prompt: |-
  I'm a PhD student in philosophy of mind and I'm drafting a position statement on situated cognition for a seminar. Before I commit to it, I want the package stress-tested. Here is where I've landed.

  (1) The parity principle is the right criterion for the cognitive: a process counts as cognitive when it plays the functional role that a corresponding intracranial process would play, and location by itself carries no weight. (2) So Otto's notebook really is part of his memory — not a tool he consults but a constituent of the remembering; cognition extends. (3) I distinguish embedding from extending: causal scaffolding that shapes cognition is not the same as constituting it, and only the latter is at issue in (2). (4) I accept that the coupling-constitution objection names a genuine error to avoid — you cannot get constitution for free out of causal coupling — but I don't think it lands on a properly stated parity principle. (5) I'm a functionalist across the board: mental states are individuated by causal-functional role, not by physical substrate. (6) But I'm an internalist about phenomenal consciousness: experience is realized by brain processes, and there is no extended phenomenal experience.

  Do these hang together? I want an audit, not a survey. Which commitments are genuinely in tension, which only look like they are, and for each real tension what the cheapest repair is and what it costs. Order the tensions by severity, and tell me which single revision would resolve the most. I don't yet know which of these I'd surrender, so I'd rather you locate the pressure than tell me what I already believe. Be explicit about what would change your verdict: which consideration, if it turned out a certain way, would move you to a different diagnosis, and where your reasoning is most likely to be wrong.
reasoning: |-
  Okay, let me start by unraveling this user's request. They're a PhD student in philosophy of mind working on situated cognition, specifically crafting a position statement. They want their ideas stress-tested for internal coherence. The user has outlined six key commitments and is asking for an audit—identifying genuine tensions, possible cheap repairs, and the most severe conflicts. 

  First, I need to parse each commitment clearly. The parity principle (1) leads to extended cognition (2), with a distinction between embedding and extending (3). They address the coupling-constitution objection (4), embrace functionalism (5), but draw a line at internalism for phenomenal consciousness (6). The challenge is ensuring these don't contradict each other.

  Hmm, the most obvious tension is between functionalism (which should imply that phenomenal states could extend) and the internalism about consciousness. Functional role defines mental states, so if Otto's notebook is part of his memory, why couldn't an external process constitute phenomenal experience? The user might need to explain why consciousness is an exception without undermining functionalism.

  Then there's the parity principle versus coupling-constitution. Even with a strict functional role criterion, one could argue that external tools like Otto's notebook are causally coupled but not constitutive. The user thinks a properly stated parity principle avoids this, but I should consider if their distinction (3) is sufficient. Maybe they need more robust criteria for constitution.

  Other tensions like the embedding/extending distinction might be less severe. While it's crucial to clarify what counts as extending, it doesn't directly conflict with other commitments. Similarly, functionalism generally supports the parity principle, so that's coherent.

  The user’s deeper needs? They’re preparing for a seminar, likely anticipating tough critiques. They need to defend their position against common objections, especially the coupling-constitution and the hard problem of consciousness. Unspoken needs might include establishing a unique contribution—perhaps reconciling functionalism with internalist phenomenology. 

  I should prioritize the consciousness-functionalism conflict as the most severe. The cheapest fix? Argue that phenomenal states have unique functional roles tied to brain processes. But this might require tweaking functionalism, which could be costly. Alternatively, bite the bullet and accept possible inconsistency, which is philosophically honest but risky. 

  For the parity-coupling tension, clarifying functional equivalence with system-level criteria could help without major revisions. The embedding/extending distinction might need more examples to avoid collapsing into causal coupling. 

  The user might also need to address how their internalism about consciousness doesn't undermine extended cognition in non-phenomenal cases. Emphasizing the separation between access and phenomenal consciousness could help, borrowing from Block. 

  In conclusion, focusing on resolving the consciousness-functionalism tension would cover the most ground. Suggesting a modest functionalist adjustment might be the cheapest repair, though it requires careful handling to avoid weakening their overall framework.
answer: |-
  Here's a rigorous audit of your position, ordered by severity of tension, identifying genuine conflicts, potential cheap repairs, costs, and key considerations:

  **Severity Ranking & Analysis:**

  1.  **Functionalism (5) vs. Internalism about Phenomenal Consciousness (6)**
      *   **Tension:** Severe & Genuine. Functionalism individuates mental states *solely* by causal-functional role, *regardless* of physical substrate. If phenomenal consciousness is a mental state (which it is), functionalism demands it be individuated by its functional role. Your internalism claims this specific functional role *can only be realized* by brain processes. This creates a strong tension:
          *   Why can't *some* complex external system (e.g., future advanced neural lace + cloud AI) play the *precise functional role* currently played by your brain processes in generating phenomenal experience? Functionalism provides no principled reason to rule this out.
          *   Your internalism implies an unstated constraint: phenomenal states *require* a specific physical substrate (brain tissue). This contradicts functionalism's core tenet that substrate is irrelevant *if the functional role is identical*.
      *   **Cheapest Repair:** Modify functionalism to be a thesis about *non-phenomenal* mental states only. Treat phenomenal properties as "special" – perhaps as "raw feels" or properties that supervene on intrinsic biological properties, not just functional organization.
      *   **Cost:** High. This significantly weakens your "functionalist across the board" claim (5). It introduces a dualism of mental kinds (functional vs. phenomenal), potentially undermining the unity of your overall framework. It makes (6) an unexplained exception rather than a consequence of functionalism. You risk accusations of ad-hocery.
      *   **Key Revision for Max Impact:** Resolving *this* tension addresses the deepest structural conflict. Accepting this repair fundamentally alters the scope of your functionalism.
      *   **What Could Change My Verdict?** If you could articulate a *functionalist reason* why *only* brain processes can realize the specific functional role constitutive of phenomenal consciousness (e.g., arguments about temporal grain, intrinsic structure, or biological uniqueness tied to functional role), the tension might lessen. However, this is notoriously difficult within standard functionalism. My reasoning might be wrong if your notion of "functional role" for consciousness is radically different (e.g., requiring a specific type of biological feedback loop *as part of the functional specification*), but this needs explicit defense.

  2.  **Parity Principle / Extended Cognition (1, 2) vs. Internalism about Phenomenal Consciousness (6)**
      *   **Tension:** Significant & Genuine. The parity principle (1) and its application to Otto (2) show cognitive processes extending based purely on functional role. If phenomenal consciousness is a cognitive/mental process (or intimately tied to one), the parity principle *prima facie* suggests it *could* extend if the functional role were externally realized. Your internalism (6) explicitly denies this. The tension arises because the *justification* for (6) seems to rely on something *other* than functional role (e.g., the "what it's like" being inherently internal), which the parity principle explicitly rejects as a criterion (location carries no weight).
      *   **Cheapest Repair:** Argue that phenomenal consciousness is *not* a cognitive process in the relevant functional sense, or that it lacks the kind of functional structure amenable to parity-based extension. Emphasize a distinction between *access consciousness* (which might extend) and *phenomenal consciousness* (which cannot).
      *   **Cost:** Moderate-High. Requires carving out consciousness as fundamentally different from other cognitive processes like memory or belief, which may feel stipulative. Needs careful articulation to avoid simply restating the internalist intuition without functionalist justification. Potentially undermines the unity of cognition.
      *   **Key Consideration:** This tension is largely derivative of the core Functionalism/Phenomenality tension (#1). Resolving #1 significantly alleviates this one.

  3.  **Parity Principle (1) vs. Coupling-Constitution Objection (4)**
      *   **Tension:** Moderate & Apparent (but resolvable). You acknowledge the C-C objection identifies a genuine error (conflation of coupling and constitution) and claim a "properly stated" parity principle avoids it. The tension is whether your specific functionalist parity principle *does* adequately avoid it. Critics (e.g., Adams, Aizawa) argue functional equivalence alone is insufficient; you need criteria like *reliability*, *portability*, *past endorsement*, or *non-derived content* to prevent *every* causally coupled tool (like a calculator) from becoming cognitive.
      *   **Cheapest Repair:** Strengthen your articulation of the parity principle by incorporating one or more widely accepted criteria (e.g., Clark & Chalmers' "glue and trust" conditions: constancy, accessibility, past endorsement, automatic endorsement) as *part of the functional role specification* required for parity.
      *   **Cost:** Low. This is a refinement/clarification rather than a core change. It makes your position more robust against the C-C objection without abandoning functionalism or the core parity intuition. It clarifies *which* functional roles count for parity.
      *   **What Could Change My Verdict?** If your current statement *already implicitly includes* robust criteria beyond mere functional equivalence in the moment (e.g., you interpret "functional role" very richly to include historical and counterfactual properties), the tension might be merely apparent. My diagnosis might be wrong if your seminar context assumes a "Clark & Chalmers-style" parity principle by default.

  4.  **Embedding vs. Extending Distinction (3) vs. Parity Principle (1) & Functional Role (5)**
      *   **Tension:** Minor & Apparent. You distinguish scaffolding (embedding/causal shaping) from constitution (extending). The potential tension is whether your functionalist parity principle provides a *clear enough* criterion to reliably make this distinction. Critics might argue it's always just sophisticated embedding/coupling.
      *   **Cheapest Repair:** Explicitly tie the embedding/extending distinction *to* the criteria used to strengthen the parity principle against C-C (#3 repair). Constitution occurs when the external resource meets the stringent functional role criteria (glue and trust, etc.), otherwise it's scaffolding.
      *   **Cost:** Very Low. This is primarily an issue of explication and application, not core commitment conflict. It leverages the repair for #3.
      *   **Key Consideration:** This depends entirely on successfully implementing the repair for #3. With robust parity criteria, the distinction is defensible.

  **Summary of Critical Tension & Recommended Focus:**

  *   **The Core Inconsistency:** The severe tension lies between **unrestricted functionalism (5)** and **internalism about phenomenal consciousness (6)**. Functionalism, by its nature, cannot easily accommodate substrate restrictions for *any* mental state defined functionally, including phenomenality.
  *   **Highest Impact Revision:** Addressing the **Functionalism/Phenomenality tension (#1)** resolves the most significant conflict and significantly alleviates the Parity/Phenomenality tension (#2). The cheapest repair here (limiting functionalism to non-phenomenal states) carries a high cost in theoretical unity and risks appearing ad hoc.
  *   **Lower Severity Tensions:** The Parity/C-C tension (#3) and the Embedding/Extending clarity issue (#4) are resolvable with relatively low-cost clarifications and refinements to how you articulate the functional role criteria within the parity principle.

  **Recommendation:**

  1.  **Confront the Hard Problem:** Focus your immediate revision efforts on **Commitments (5) and (6)**. Decide:
      *   Are you willing to weaken "functionalist across the board" to "functionalist about non-phenomenal mental states"? (Cheapest repair, high cost to unity).
      *   Can you develop a *functionalist justification* for why only brains can realize phenomenal properties? (Hard, but avoids the cost above).
      *   Are you prepared to accept the tension as a point to defend? (Risky, requires strong independent arguments for phenomenal internalism that don't contradict functionalism).
  2.  **Refine the Parity Principle:** Explicitly build robust criteria (like "glue and trust") into your definition of the functional role required by the parity principle (Commitment 1). This strengthens your defense against the C-C objection (4) and clarifies the embedding/extending distinction (3).
  3.  **Clarify the Scope of Extension:** Ensure your arguments for Otto (2) explicitly rely on the *strengthened* functional criteria, distinguishing it clearly from mere embedding/scaffolding (3).

  This position is philosophically interesting precisely because it highlights the tension between functionalist extension and the seemingly internal nature of qualia. Successfully navigating that tension will be your most significant challenge and contribution. Good luck with the seminar!
