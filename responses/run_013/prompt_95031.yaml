prompt: |-
  I'm trying to work out what I actually think about when two people are doing something together, going off gut reactions to cases. Two flatmates both get up to make tea at the same moment, each fancies a cup, each knows the other's up and doing it too: that's two separate things happening, not something we did. Same two flatmates, but there's a standing unspoken thing where whoever's up first makes the pot for both: that one's together. A load of strangers form a bucket chain at a house fire, nobody orginizes it, people just start passing: together. Same crowd when the alarm goes and everyone bolts for the one exit, shoving: not together, however closely they're all reading each other's movements. A string quartet: together, obviously. Two rival supermarkets that have matched each other's prices for years, each watching the other and each knowing they're watched: not together, feels like the opposite of together. Two people who happen to be walking to the same shop, fall into step, chat the whole way: I think they walked there together, even though neither needed the other and neither would have changed their route. And two coauthors who write their halves in separate rooms, never talk, but each writes so it'll fit what the other's section needs: I want to say together, and that one worries me. The case I keep going back and forth on is the Mexican wave at a match -- everyone stands up when their neighbour stands up, no plan, no goal beyond the wave itself.

  Is there a principle that gets all of these, or close? Tell me what it says about a case I haven't listed: a couple where she cooks and he does the washing up, every night, never discussed, and each would just keep doing their bit even if the other stopped. If your principle saves every verdict of mine, tell me what it costs in complexity; if a simpler one overturns one of my verdicts, say which and why I should give it up. Please don't just name-drop the standard theories of shared intention at me -- state the thing itself, precisely enough that I can apply it to new cases.

  Principle: [the whole thing compressed into one sentence]
reasoning: |-
  Okay, the user is trying to figure out a principle that distinguishes when two or more people are acting together versus separately. They've provided several examples and their gut reactions to each. Let me start by listing out all their cases and their judgments:

  1. **Flatmates making tea separately**: Not together. Each is acting independently even though they're doing the same thing at the same time.
  2. **Flatmates with a standing arrangement for tea**: Together. There's an unspoken agreement that one makes tea for both.
  3. **Bucket chain at a fire**: Together. Spontaneous coordination without organization.
  4. **Crowd rushing to exit**: Not together. Even though they're reacting to each other, it's every person for themselves.
  5. **String quartet**: Together. Clear collaborative effort with a shared goal.
  6. **Supermarkets matching prices**: Not together. Competitive, even though they're reacting to each other.
  7. **Two people walking and chatting**: Together. They coordinate their walk and chat, even if originally separate plans.
  8. **Coauthors writing separately**: Together. They adjust their work to fit the other's needs without direct communication.
  9. **Mexican wave**: The user is unsure. It's spontaneous, no plan, done for the wave itself.

  The user wants a principle that covers all these cases and can be applied to a new scenario: a couple where one cooks and the other washes up every night without discussion, and each would continue their part even if the other stopped.

  First, I need to identify common elements in the "together" cases. The key seems to be mutual responsiveness and coordination toward a shared activity, even if unspoken. In the tea arrangement, bucket chain, quartet, walking pair, and coauthors, there's an element of each person adjusting their actions considering the other. The supermarkets are responsive but competitive, not cooperative. The crowd rushing is responsive but conflicting.

  For the Mexican wave, it's tricky because it's imitative but lacks a shared goal beyond the moment. However, participants are aware they're part of a collective action. So maybe it counts as together because of mutual responsiveness to create the wave.

  The couple example: Each has a role (cooking, washing) and they perform these roles interdependently. Even without communication, there's an established pattern where each expects the other to play their part. If they continue their roles regardless, that might lean away from togetherness because there's no active coordination. But the user might see it as together because it's a coordinated routine.

  The principle should emphasize mutual responsiveness and interdependence in actions directed at a common activity. The distinction lies in whether individuals are adjusting their actions with the others in mind as part of a joint activity. Competitors or those in conflict, even if responsive, aren't "together."

  So the principle could be: "People are acting together when each participant adjusts their actions in response to others specifically to contribute to a common activity, with mutual awareness of this coordination."

  Applying this to the couple: If each is doing their part expecting the other to do theirs, that's coordination. But if they'd continue regardless, it's not interdependent. The user mentioned each would keep doing their bit even if the other stopped, which suggests no real interdependence. So under this principle, it's not together. However, the established routine might imply mutual expectation, so it's a borderline case. The user might need to decide if the expectation of reciprocity is necessary. If the cook would stop cooking if the washer stopped, then it's interdependent. But since they'd continue, it's not. So the couple isn't acting together. But if the user feels it is together, the principle might need adjustment.
answer: |-
  Here's a precise, single-sentence principle derived from your intuitions, designed to capture the core difference:

  **Principle: People are acting *together* when each participant actively adjusts their actions in mutual responsiveness to the others, specifically to contribute to a shared activity or outcome, with the mutual awareness that this reciprocal adjustment is occurring.**

  **Breakdown of Key Concepts:**

  1.  **Active Adjustment:** Participants aren't just reacting or acting in parallel; they deliberately modify what they do *because* of others.
  2.  **Mutual Responsiveness:** Adjustment is reciprocal and interdependent. Each person's actions are shaped by the others', and vice versa, forming a coordinated loop.
  3.  **Specifically to Contribute:** The adjustment isn't random or self-serving; it's directed towards enabling or sustaining a *common* activity or result.
  4.  **Shared Activity/Outcome:** There's a recognizable "thing" (making tea, passing buckets, playing music, walking-and-chatting, writing a book, doing the wave) that they are jointly engaged in producing or sustaining.
  5.  **Mutual Awareness:** Participants understand, at least implicitly, that this reciprocal adjustment for the shared activity is happening. They see themselves as co-contributors in this specific context.

  **Application to Your Cases:**

  1.  **Flatmates (Separate Tea):** NO. No adjustment *for* a shared activity. Each makes their own cup independently.
  2.  **Flatmates (Unspoken Pot):** YES. Each adjusts (making a pot vs own cup) *in response to* the other being up, *to contribute to* the shared outcome of "tea being made for both", with mutual awareness of this unspoken norm.
  3.  **Bucket Chain:** YES. Each actively adjusts (taking bucket, passing it on) *in response to* the actions of their neighbors *specifically to contribute to* the shared outcome of "moving water efficiently", with mutual awareness of the emerging coordinated effort.
  4.  **Crowd Shoving:** NO. Adjustment (shoving, dodging) is reactive and self-serving (escape), *not* to contribute to a shared activity (getting out is individual; shoving hinders others). Lacks mutual responsiveness *for* a shared good.
  5.  **String Quartet:** YES. Continuous, intricate mutual responsiveness (timing, dynamics) *specifically to contribute to* the shared activity of "making music together", with constant mutual awareness.
  6.  **Supermarkets:** NO. Adjustment (price matching) is reactive and *competitive* (self-serving), *not* to contribute to a shared activity or outcome ("selling goods" isn't shared; their success is mutually exclusive). Responsiveness is adversarial, not cooperative.
  7.  **Walking & Chatting:** YES. They adjust (pace, route, topic) *in mutual response* to each other *specifically to sustain* the shared activity of "walking and chatting together", with mutual awareness ("we're walking together now").
  8.  **Coauthors:** YES. Each adjusts their writing *in response to* their understanding of the other's needs/contributions *specifically to contribute to* the shared outcome of "a coherent joint book", with mutual awareness (they know the other is doing the same).
  9.  **Mexican Wave:** YES. Each participant actively adjusts (standing/sitting) *in direct response to* their neighbors' actions *specifically to contribute to* the shared activity/outcome of "sustaining the wave moving around the stadium", with mutual awareness of being part of this collective phenomenon. (The wave *is* the shared goal/activity).

  **Application to Your New Case: The Couple (Cooks/Cleans independently, would continue if other stopped)**

  *   **Verdict using Principle: NO, they are *not* acting together.** Here's why:
      *   **Active Adjustment?** Yes, each performs their role. *But*... is this adjustment *in direct response* to the other's *current* action? Or is it just a fixed habit triggered by the time/situation? The description suggests the latter - she cooks because it's dinner time, he cleans because the meal is done. It's sequential routine, not dynamic mutual responsiveness.
      *   **Mutual Responsiveness?** Weak/None. Her cooking isn't *shaped by* his imminent cleaning; she cooks regardless. His cleaning isn't *shaped by* her specific cooking *this meal*; he cleans regardless. They perform isolated actions in sequence based on a static role division. The "would continue if other stopped" clause confirms this *lack of interdependence* in the moment. There's no feedback loop adjusting their actions based on the other's *current* contribution.
      *   **Specifically to Contribute to a Shared Activity?** They contribute to the *outcome* (dinner done and cleaned up), but the *activity* itself isn't dynamically shared. Cooking and cleaning are distinct phases done by one person each, without coordinated interaction *during* the activity. It's a system, not a joint action.
      *   **Mutual Awareness?** Probably aware of the overall pattern, but not of reciprocal adjustment *during* the specific actions. He isn't thinking "I'm washing *because she cooked and is relying on me*" as he washes tonight's pan; he's just washing *the pan* because that's his fixed role.

  **Cost & Potential Overturn:**

  *   **Complexity Cost:** The principle requires identifying several elements simultaneously: active adjustment, mutual responsiveness (interdependence), contribution to a shared activity, and mutual awareness. It's more complex than simpler definitions like "shared goal" or "acting in concert".
  *   **Simpler Principle & Overturn:** A simpler principle like "Acting towards a shared goal" would overturn your verdict on the **Coauthors**. They *do* share the goal of a coherent book and act towards it. However, this simpler principle would likely *incorrectly* (by your lights) classify the **Supermarkets** as "together" (shared goal of profit/market share? shared activity of competition?), and *fail* to explain why the **Bucket Chain** *is* together (no pre-existing shared goal) or why the **Shoving Crowd** *isn't* (shared goal of escape). Your intuition about the Coauthors being "together" despite isolation and lack of direct interaction is strong, and the proposed principle captures this through mutual responsiveness *to the other's contribution/needs* and mutual awareness of the joint enterprise, even asynchronously. Abandoning the Coauthors verdict seems a higher cost than accepting the principle's complexity.

  **Conclusion:** The principle emphasizes the *dynamic, interdependent process* of mutual adjustment *for* a shared end, distinct from mere parallel action, reaction to stimuli, or fixed role systems without reciprocal responsiveness. It explains your intuitions across the cases, including the "No" for the couple due to the lack of active, interdependent adjustment during the activity itself. The complexity cost is justified by its ability to capture subtle cases like the Coauthors and the Mexican Wave that simpler principles miss.
