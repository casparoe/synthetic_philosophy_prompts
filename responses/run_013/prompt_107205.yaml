  For desiderata, I should list: Attitudes Involved (showing the distinction applies beyond belief to pro-attitudes), Paradigm Cases (classifying demon, bribe, grief as WKR), Belief Special Case (handling the user's cases a and b), Toxin Parallel, Normative Difference (RKR vs WKR have different weights/roles), Non-Collapse (not reducing to other distinctions), and Attitude-Type Implication (how RKR/WKR status affects attitude norms). Each with a "why" based on intuitions or platitudes.

