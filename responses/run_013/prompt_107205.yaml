answer: |-
  Here are the desiderata for an adequate account of the RKR/WKR distinction, structured to address your specified cases and requirements. The considerations behind each are grounded in core intuitions and non-negotiable platitudes of the literature.

  ---

  ### **Core Desiderata**
  1. **Attitudes Involved**  
     *Requirement:* Must apply to *attitudes* (belief, admiration, grief, love, desire), not just actions.  
     *Why:* The problem arises for non-voluntary attitudes (e.g., you can’t directly choose to believe/admire). Cases: **Admiration Demon**, **Grief Reward**.  

  2. **Paradigm WKR Cases Classified Correctly**  
     *Requirement:* Must classify the following as *WKR*:  
     - **Admiration Demon** (reward for admiring a vile demon).  
     - **Arithmetic Bribe** (cash to believe 2+2=5).  
     - **Grief/Love Reward** (reward for feeling grief/love toward a target).  
     *Why:* These are uncontested WKR paradigms—reasons here don’t bear on the *object’s properties* but on *consequences of holding the attitude*.  

  3. **Belief Special Cases**  
     *Requirement:* Must correctly handle:  
     - **(a) Money for Correct Belief** (reward iff belief is *true*).  
     - **(b) Employer Bonus** (bonus for *sincerely* believing product is safe).  
     *Why:* (a) is WKR despite truth-aimed payoff (reward still external); (b) is WKR (sincerity doesn’t make the reason about safety evidence). *Contested:* Some argue (a) is RKR, but consensus leans WKR.  

  4. **Toxin-Style Desire Case**  
     *Requirement:* Reward for *desiring* (not acting) to drink toxin must be WKR.  
     *Why:* Parallels toxin puzzle: reason targets the *attitude itself*, not the desire’s object (drinking toxin).  

  5. **Normative Difference**  
     *Requirement:* RKR must be capable of *justifying/rationalizing* the attitude; WKR cannot.  
     *Why:* Platitude—e.g., evidence for "p" makes belief rational; a bribe does not.  

  6. **Non-Collapse**  
     *Requirement:* Must not collapse into:  
     - Epistemic vs. practical reasons.  
     - Voluntary vs. involuntary attitudes.  
     *Why:* WKR exist for desires (voluntary-ish) and RKR for non-belief attitudes (e.g., admiration).  

  7. **Attitude-Type Implication**  
     *Requirement:* RKR status must depend on the *type* of attitude (e.g., reasons fitting for belief ≠ admiration).  
     *Why:* What counts as RKR for belief (evidence) differs from admiration (admirable traits). Cases: **Admiration Demon** (traits irrelevant) vs. **Grief** (reasons must relate to loss).  

  ---

  ### **Conflicting Desiderata Pairs**  
  - **Belief Special Cases (3) vs. Normative Difference (5):**  
    If (a)/(b) are WKR, but the reward *contingent on truth/sincerity* seems to bear on belief’s "correctness," this strains (5) (RKR justify, WKR don’t).  
  - **Toxin-Style Desire (4) vs. Normative Difference (5):**  
    If desire-WKR *can* practically justify cultivating the desire, this blurs "rationalization" in (5).  

  ---

  ### **Theory-Family Performance (Brief)**  
  - **Non-Reductive (WKR = reasons to *want* the attitude):**  
    Nails *Normative Difference* (5): WKR don’t rationalize attitudes. Struggles with *Toxin-Style Desire* (4) (desiring toxin for reward *is* a reason to want it, but intuitively WKR).  
  - **Object-Given vs. State-Given (OG/SG):**  
    Intuitive for *Paradigm Cases* (2) (OG: demon’s traits; SG: reward). Fails *Belief Special Cases* (3): SG reasons contingent on truth (e.g., money for correct belief) are still SG/WKR, but feel "object-linked."  
  - **Fittingness-Primitivism (RKR = reasons from fittingness facts):**  
    Handles *Attitude-Type Implication* (7) well (fittingness is attitude-relative). Avoids reduction clashes but risks obscurity on *Belief Cases* (3) (is truth-contingent reward a "fittingness" reason?).  

  ---

  ### **Settled vs. Contested**  
  - **Settled:**  
    - Paradigm cases (Admiration Demon, etc.) are WKR.  
    - RKR/WKR distinction is genuine and non-collapsible (6).  
    - WKR cannot rationalize attitudes (5).  
  - **Contested:**  
    - Whether belief cases (a)/(b) are WKR (consensus: yes, but dissenters exist).  
    - Whether "fittingness" is reducible (central divide in literature).  
    - Whether OG/SG is exhaustive or coherent (e.g., toxin-desire reasons challenge SG).  

  ---
  **Key for Seminar:** The tension between *external contingencies* (even truth-linked) as WKR and the *rationalizing role* of RKR is the core fault line. Theories trade off clarity on paradigmatics vs. edge cases.
