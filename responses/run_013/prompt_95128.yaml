answer: |-
  Based on your background, goals, and the three "knots" you've identified, I recommend prioritizing **two core questions** that are upstream, tractable for a scientist-philosopher, and directly address the unification of your knots. These questions treat your three knots as symptoms of a deeper issue: **the interplay between objective patterns in the world and epistemic constraints in defining "probability"**. The knots arise from failing to rigorously bridge this gap. Below is the prioritized ranking, defense, tractability assessment, and criteria for reordering. Ignore fashionable but downstream work (e.g., new axiomatizations of imprecise probability, purely Bayesian model comparisons, or metaphysical debates about "chance primitives").

  ### Core Insight: The Unified Knot
  Your three knots share a root: **the tension between invariance and context-dependence in probabilistic reasoning**. 
  - **Reference-class problem**: Requires *objective invariance* across a collective, but the choice of collective is *context-dependent* (often probabilistic). 
  - **Single-case propensity**: Seeks *objective invariance* in a singular system, but risks collapsing into epistemic (subjective) or frequentist (collective) accounts without a robust link to *context-independent physical symmetries*. 
  - **Calibration problem**: Demands *epistemic invariance* (credence matching objective chance) but struggles to define chance without circularity, missing how *objective invariance patterns constrain credence*.  
  **Deeper issue**: The role of **typicality** (from stat mech) and **exchangeability** (de Finetti) in defining *when and why* certain patterns (frequencies, propensities) license probabilistic inferences. Progress requires grounding probability in *physically salient symmetries* while acknowledging epistemic limitations.

  ### Ranked Questions & Defense
  #### **1. How do objective symmetries (e.g., typicality, physical invariance) license the choice of reference classes or exchangeable sequences, and can this dissolve the frequentist-subjectivist divide?**  
     - **Why upstream?**  
       This question is foundational to all three knots. It addresses:  
       - The *reference-class problem* by asking: *Which physical symmetries* (e.g., conservation laws, scale invariance) define "natural" collectives where frequencies stabilize?  
       - The *subjectivist calibration problem* via de Finetti: Exchangeability is the *epistemic substitute* for objective symmetry. If we show how objective symmetries *ground* exchangeability (e.g., via typicality), we resolve circularity in the Principal Principle.  
       - The *propensity knot* indirectly: Propensities may reduce to *dispositions arising from symmetries* (e.g., quantum symmetries enabling single-case propensities).  
       *Progress here redefines the entire debate.*  

     - **Tractability for you**:  
       - Leverages your physics intuition: Symmetries (e.g., rotational invariance in particle physics) and typicality (e.g., ergodicity in stat mech) are familiar.  
       - Concrete starting points:  
         - **Typicality**: Work by Dürr, Goldstein, Zanghì shows how typicality (not probability) grounds frequencies in deterministic systems. Can this extend to frequentism?  
         - **Exchangeability**: Recent work in *algorithmic statistics* (e.g., Jan Leike) ties exchangeability to *computational symmetry*. Your math skills suffice here.  
       - Focus on *physical case studies*: E.g., why is "all carbon-14 atoms" a non-arbitrary reference class? Hint: nuclear symmetry (isotope stability).  

     - **What counts as progress (3 years)**:  
       1. A framework linking **physical symmetry groups** (e.g., Lie groups) to **statistical invariance** (e.g., sufficiency, exchangeability).  
       2. Showing how **de Finetti’s theorem** holds *approximately* under physical typicality (e.g., in complex systems), dissolving the frequentist-subjectivist distinction for realistic agents.  
       3. Resolving the "probabilistic reference-class" sub-problem: Classes defined by probabilities (e.g., "events with P(A|B)=0.5") are valid only if *meta-symmetries* exist (e.g., renormalization group invariance).  

  #### **2. Can conditional propensity (e.g., P(A|B)) be defined as an objective, single-case disposition without collapsing into credence or frequency, using symmetry-breaking or contextual invariance?**  
     - **Why second?**  
       - Builds on Q1: Propensity needs *symmetry-derived objectivity* to avoid collapse.  
       - Directly tackles your *single-case knot*: Conditioning (e.g., P(decay | quantum state)) must reflect *contextual physical invariants* (e.g., boundary conditions preserving unitary evolution).  
       - Informs the *calibration knot*: If propensities are grounded, they become the "chance" in the Principal Principle.  
       *More specialized than Q1 but forces operational clarity.*  

     - **Tractability for you**:  
       - Physics offers test cases: Quantum probabilities (e.g., Born rule) and chaotic systems (e.g., weather propensities) are inherently single-case.  
       - Use *conditional probability formalisms* (e.g., Bayes nets) but demand *causal-mechanical grounding* (e.g., Woodward’s interventionism).  
       - Start with *quantum foundations*: Recent no-go theorems (e.g., PBR) show objective single-case probabilities *must* rely on conditional symmetries (e.g., preparation independence).  

     - **What counts as progress (3 years)**:  
       1. A **conditional propensity axiom** based on *symmetry-breaking*: E.g., P(A|B) is objective iff B defines a context where symmetries fix the propensity (e.g., radioactive decay conditioned on isotope type).  
       2. Showing when propensities *reduce* to symmetrized frequencies (e.g., via ergodicity) or *require* irreducible dispositions (e.g., quantum indeterminism).  
       3. A proof that *no non-circular* definition exists—this too is progress, pushing propensity toward eliminativism.  

  ### What to Ignore
  - **Fashionable but downstream**:  
    - **Imprecise probability**: Unless tied to physical symmetry (e.g., as ignorance of group parameters), it rearranges labels.  
    - **Quantum Bayesianism (QBism)**: Its anti-realism avoids your knots but doesn’t resolve them.  
    - "**New**" **principal principles**: Variations (e.g., BPP) presuppose "chance"; focus on grounding chance instead.  
  - **Overrated literature**:  
    - Metaphysical propensity debates (e.g., "Are propensities categorical properties?"). Your physics lens favors operational definitions.  
    - Frequentist "solutions" via fiducial inference or likelihoodism—they dodge the reference-class problem.  

  ### Evidence for Reordering
  - **Prioritize Q2 over Q1 if**:  
    - Breakthroughs in **quantum conditional probabilities** (e.g., unifying Born rule with causality) emerge, making single-case propensities tractable faster.  
    - **No progress on symmetry-based reference classes** by Year 2 (e.g., if typicality only applies to idealized Hamiltonian systems).  
  - **Deprioritize both if**:  
    - **Experimental tests of de Finetti’s theorem** (e.g., in cognitive science) show exchangeability *never* holds empirically—undermining the unification project.  

  ### Strategic Approach
  - **Year 1**: Focus on Q1. Study typicality (Goldstein et al.) and exchangeability (de Finetti, with modern critiques by Diaconis). Analyze a physical system (e.g., Ising model) to identify how symmetries license probabilistic inferences.  
  - **Year 2**: Tackle Q2 using quantum cases (e.g., conditional decay probabilities) while refining Q1.  
  - **Year 3**: Synthesize results into a unified framework (e.g., "Symmetry-Grounded Probabilism"), addressing all three knots.  

  Your unique advantage as a physicist-philosopher is the ability to demand *empirical salience* from probability interpretations. By anchoring your work in symmetry and typicality—concepts that "do real work" in science—you can cut through taxonomic debates and make tangible progress on these century-old knots.
