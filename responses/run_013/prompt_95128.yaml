  Prioritizing questions: The first should be the most upstream. That might be how objective grounds for reference classes relate to exchangeability. If we can resolve that, it impacts both frequentism and subjectivism. Propensity might be harder to tackle without first clarifying the others. The calibration problem depends on having a notion of objective chance, so it's downstream.

