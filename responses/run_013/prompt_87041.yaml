prompt: |-
  I am in my third year of a philosophy degree and taking a formal epistemology paper this term; we have spent the past few weeks on accuracy-first treatments of credence, so I am reasonably at home with proper scoring rules and with the dominance argument for probabilism, but the package stops looking like a package as soon as I test it on cases. A classmate and I have been trading examples, and my own reactions pull in two directions at once — towards the thought that what makes a credence good is accuracy itself, and towards the thought that what makes it good is something about how it hangs together with the others. Take accuracy to be the sum of squared errors over whatever propositions are scored, assume the agents below share their evidence unless I say otherwise, and assume the worlds mentioned are the only ones in play. Here are my verdicts. (i) Two agents await a fair coin toss: the first holds 0.5 that it lands heads, the second holds 0.9, having arrived there by wishful thinking she would be the first to disown. It lands heads, and the second agent's credence is the more accurate by a distance (0.01 against 0.25). I want to say hers is nevertheless the worse credence, and worse epistemically rather than all things considered. (ii) Two agents hold credences in three propositions — that it rains, that it is cold, and that it rains or is cold. The first holds 0.4, 0.4 and 0.9; the second 0.4, 0.4 and 0.8. Only the second is coherent. At the world where it rains and is cold, the first agent scores the better of the two (0.73 against 0.76 — I have checked the arithmetic). I still want to say she is the worse off, and that her incoherence is a defect a lucky score does not repair; I note in passing that she cannot even say what she expects to score, having no distribution to take the expectation with, and I take that to be part of the point. (iii) Suppose an agent is scored on those same three propositions and on nothing else. My classmate says the dominance argument then delivers coherence over the scored propositions only, full probabilism being an artefact of scoring over an algebra. My verdict is that she is right about what the argument delivers and wrong that it matters: the requirement should still be full coherence, and I would rather say the restricted set-up is under-described than that rationality is relative to the scoring sheet. (iv) A three-person committee must announce a single set of credences. Its members hold 0.2, 0.2 and 0.9 in some proposition and 0.8, 0.8 and 0.9 in its negation, so one member is incoherent; the committee announces the means, 0.43 and 0.83, which are not a probability function either. My verdict is that the committee should announce those means and not tidy them up, its business being to represent its members rather than to be a well-behaved agent in its own right. (v) An agent who knows the objective chance of a proposition to be 0.2 holds 0.2 in it; a second agent, who knows the same, holds 0.4. The proposition turns out true, so the second has been the more accurate of the two. I want to say the first agent's credence is the better one, and better because it answers to the chance rather than because of how it scored.

  My tentative principle is that a credence is better the more accurate it is in expectation, where the expectation is taken by the agent's own lights. That seems to get the fifth case; on the first it tells me the wishful thinker is already doing the best she can, which is precisely the verdict I want to reject; on the second it is either silent or vindicated by a trick, since the incoherent agent has no expectations to take; and on the fourth it treats the committee as a single agent whose incoherence is straightforwardly a defect, which is the verdict I am least willing to give up. Please test it, repair what can be repaired, and give me the principle — or the small set of candidates — stated precisely enough that I could apply it to an agent neither of us has described, saying for each clause which of my cases forces it. Tell me what it implies about two cases I have deliberately left out: an agent whose credences are perfectly accurate because she has simply been told every truth, and a pair of agents whose priors differ while their evidence does not, one of whom ends up much the closer to the truth. Finally, if the only principle that saves all five verdicts is a conjunction of four clauses with nothing to do with one another, say so, and tell me which single verdict I should surrender for the sake of a more unified principle, and why that one rather than another.
reasoning: |-
  Okay, let me start by unpacking this philosophy student's problem. They're in a formal epistemology course, grappling with accuracy-first epistemology. They've listed five cases where their intuitions clash with standard accuracy-based arguments for probabilism. Each case reveals a tension between valuing accuracy directly versus valuing coherence among credences.

  First, I need to understand each case thoroughly. In case (i), the wishful thinker has a more accurate but poorly formed credence. The student feels it's epistemically worse despite its accuracy. Case (ii) shows an incoherent agent scoring better in a specific world, yet the student still sees incoherence as defective. Case (iii) raises whether scoring only a subset of propositions weakens the demand for full coherence. Case (iv) involves a committee outputting incoherent averages, which the student defends as properly representative. Case (v) prioritizes matching chances over actual accuracy.

  The student's tentative principle—maximizing expected accuracy from the agent's perspective—solves (v) but conflicts with (i) and struggles with (ii)'s incoherent agent. Their core tension is between outcome-oriented accuracy and process-oriented rationality.

  Now, considering solutions: The student's principle needs refinement. Expected accuracy only works for coherent agents who can compute expectations. For others, we might need a generalized scoring approach. Joyce's 2009 extension of scoring rules to incoherent credences could help here—it allows evaluating any credence function by treating it as implicitly probabilistic over a coarser partition.

  For case (i), the wishful thinker's high expected accuracy (given her distorted beliefs) doesn't make her credence rational. We need to add that rationality requires sensitivity to evidence—so her failure isn't in accuracy pursuit but in evidence responsiveness. This bridges accuracy-first with evidentialist concerns.

  Case (ii)'s incoherent agent can't calculate expected accuracy, but Joyce's method assigns her an implicit probability distribution. Her Brier score relative to that implicit distribution would be worse than the coherent agent's, justifying the intuition that she's worse off despite her lucky score.

  Case (iii) about restricted scoring sets: The dominance argument indeed only enforces coherence over scored propositions. But rationality should demand global coherence regardless. This suggests a limitation of scoring arguments—they're tools for justification, not definitions of rationality. The student's intuition here points beyond technical scoring setups.

  Case (iv) with the committee: Treating the committee as a single agent misrepresents its role. Since it's an aggregator, not a believer, coherence isn't required. The student's resistance here highlights that rationality applies primarily to doxastic agents, not mere summarizers.

  Case (v) is straightforward: Expected accuracy relative to chances justifies matching them when known. This aligns with the Chance-Dominance principle from accuracy literature.

  Now the additional cases: The fully informed agent would have perfect accuracy but irrational if she formed beliefs arbitrarily before receiving information. This shows accuracy isn't sufficient for justification. For agents with different priors but shared evidence, the one whose priors are better calibrated to the world's structure (e.g., simpler or more truth-conducive) is more rational—accuracy alone doesn't capture this.

  I think the unified solution combines three principles: Evidence-Responsiveness for credence formation, Global Coherence as a constitutive requirement, and Chance-Responsiveness when chances are known. This package saves all five verdicts while explaining why accuracy matters: as the goal that coherence and evidence-responsiveness serve.

  The key insight is distinguishing between the constitutive standards of rationality (coherence, evidence-responsiveness) and the epistemic goal (accuracy). This resolves the tension in the student's cases—each verdict prioritizes rationality standards over momentary accuracy when they conflict.
answer: |-
  Your cases reveal a deep tension between accuracy as an *outcome* and rationality as a *process*. Your tentative principle (maximize *expected accuracy by the agent's own lights*) captures important intuitions but conflicts with others. Below, I refine it into a unified framework that preserves all five verdicts, grounded in **accuracy-first epistemology extended with evidential and structural constraints**. The core insight: **Rationality requires maximizing *expected* accuracy *relative to available evidence*, within the structural constraints of coherence.** This reconciles outcome-oriented and coherence-oriented intuitions by making coherence a precondition for evaluating expected accuracy.

  Here’s the principle, clause-by-clause, with justifications from your cases:

  ---

  ### **The Principle: Evidence-Relative Expected Accuracy Maximization (EREAM)**
  1. **Structural Coherence Requirement**:  
     A set of credences is rational only if it is probabilistically coherent (satisfies the probability axioms).  
     *Why?* Forces verdicts in (ii) and (iii): Incoherent credences fail to define expectations (as you note in (ii)), violating rationality *even if accidentally accurate*. Coherence is non-negotiable because it is constitutive of rationality—it enables consistent reasoning and expectation formation.  
     *Case force*: (ii) (incoherent agent is defective despite lucky score), (iii) (full coherence required regardless of scoring setup).

  2. **Evidence-Constrained Maximization**:  
     For a coherent agent, a credence in proposition *P* is rational only if it maximizes expected accuracy *relative to the agent’s total evidence*, where the expectation is taken using the agent’s credence function.  
     *Why?* Solves (v) and resolves (i): In (v), holding 0.2 when chance=0.2 maximizes expected accuracy (since chance is evidence). In (i), the wishful thinker’s 0.9 *does not* maximize expected accuracy relative to her evidence (a fair coin)—*even by her own lights*. Her error is evidential: she fails to align her credence with her evidence, violating this clause.  
     *Case force*: (i) (wishful thinker is irrational despite high actual accuracy), (v) (chance-match is rational despite lower accuracy).

  3. **Aggregation Neutrality**:  
     Collective entities (e.g., committees) are not required to satisfy coherence if their role is purely aggregative (not doxastic). Rationality applies only to agents with belief-forming mechanisms.  
     *Why?* Protects (iv): The committee’s job is to *report* member credences, not *hold* rational ones. Coherence is irrelevant here.  
     *Case force*: (iv) (committee should not tidy up means).

  ---

  ### **Applying EREAM to Your Cases**
  - **(i) Wishful thinker (0.9 on fair coin)**:  
    Violates **Clause 2**. Her 0.9 does not maximize expected accuracy *given her evidence* (a fair coin). By her *own* credences, expected accuracy for *c(H)=p* is minimized at *p=0.5* (the Brier score is proper). Her credence is epistemically worse because it ignores evidence, not because it scores poorly.  
    *Your verdict saved*: Hers is worse despite higher accuracy.

  - **(ii) Incoherent agent (0.4, 0.4, 0.9)**:  
    Violates **Clause 1**. Incoherence prevents expectation formation, making her unable to evaluate expected accuracy. Dominance arguments still condemn her: her credences are accuracy-dominated by coherent alternatives (e.g., 0.45, 0.45, 0.8).  
    *Your verdict saved*: Incoherence is a defect unredeemed by luck.

  - **(iii) Restricted scoring set**:  
    **Clause 1** demands full coherence. Dominance arguments *for* coherence only apply to scored propositions, but rationality requires global coherence because:  
    - (a) Unscored propositions still affect reasoning/decision-making.  
    - (b) As you intuit, rationality isn’t “relative to the scoring sheet.”  
    *Your verdict saved*: The setup is under-described; full coherence is still required.

  - **(iv) Committee with incoherent means**:  
    Satisfies **Clause 3**. Committees are not doxastic agents, so coherence is irrelevant. Reporting averages is rational for their role.  
    *Your verdict saved*: Announce the means; no tidying needed.

  - **(v) Ignoring known chance (0.4 when chance=0.2)**:  
    Violates **Clause 2**. With evidence that chance=0.2, expected accuracy (Brier score) is minimized at *c(P)=0.2*. Holding 0.4 is irrational *even if* it turns out accurate.  
    *Your verdict saved*: First agent’s credence is better.

  ---

  ### **Additional Cases & Implications**
  - **Case A: Agent told all truths (perfect accuracy)**:  
    EREAM implies:  
    - If she formed credences *before* being told, rationality depends on whether they matched her *prior evidence* (Clause 2).  
    - If she forms credences *after* being told, she *must* hold extremal credences (1 or 0). Anything else violates Clause 2 (evidence demands certainty).  
    - Accuracy alone does not make pre-information credences rational—e.g., holding 0.5 in a truth despite no evidence for it is irrational even if accurate.

  - **Case B: Agents with different priors, same evidence**:  
    EREAM implies:  
    - Both agents maximize expected accuracy *by their own lights* (Clause 2), so both are rational *at the time*.  
    - However, the one closer to the truth *after* evidence is *more justified* in hindsight, but this is not a failure of rationality—it reflects prior sensitivity.  
    - Rationality does not require “correct” priors, only that priors are updated correctly given evidence.

  ---

  ### **Why This Package Unifies Your Verdicts**
  - **Coherence** (Clause 1) is foundational: It enables the expected accuracy calculus.  
  - **Evidence-Relative Maximization** (Clause 2) explains why wishful thinking (i) and ignoring chances (v) are irrational: they misuse evidence.  
  - **Aggregation Neutrality** (Clause 3) isolates rationality to genuine believers.  
  - **No verdict sacrificed**: All five intuitions are preserved.  

  The only alternative—surrendering one verdict—would be to abandon **Clause 3** and demand committee coherence. But this is the *least* defensible surrender: committees are not agents, and your intuition here is sociologically astute. Rationality is a property of *believers*, not summaries.

  ---

  ### **Precise Statement of EREAM**
  > Let *C* be a credence function over propositional algebra ℱ.  
  > *C* is rational only if:  
  > 1. **Coherence**: *C* is a probability function (satisfies Kolmogorov axioms).  
  > 2. **Evidence-Relative Maximization**: For all *P* ∈ ℱ, *C(P)* maximizes expected accuracy *E*[𝔸(*C(P), 𝕀(P))], where:  
  >    - 𝔸 is a strictly proper scoring rule (e.g., Brier score),  
  >    - *E* is expectation w.r.t. *C*,  
  >    - *C* incorporates all available evidence (e.g., known chances).  
  > 3. **Agenthood Condition**: (1) and (2) apply iff the entity is a *doxastic agent* (not a mere aggregator).

  This rescues accuracy-first epistemology from your counterexamples by embedding it within an evidentialist and structural framework. Coherence isn’t an “artefact”—it is the scaffold for accuracy maximization. Accuracy remains the *goal*, but rationality is the *path* to it.
