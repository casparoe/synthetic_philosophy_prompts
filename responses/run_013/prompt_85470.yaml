  There's a proposal to fund 15 years of schooling in a minority language for a region where parents consistently say they want their children taught in the national language. The grantee argues that this preference is due to historical discrimination, and that fully informed parents would choose the minority language program. The region's elected council opposes this, saying their constituents know their own minds and the clause is just a way to override them.

