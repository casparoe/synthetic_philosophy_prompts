answer: |-
  ### Exam Question

  **Both the selected-effects (SE) theory and the causal-role (CR) theory of function aim to clarify what it means to say "the function of X is Y." Using the two cases below, explain what each theory is *committed to saying* about function attribution. Specifically:  
  (i) For Case (a), does the inserted gene have a function?  
  (ii) For Case (b), does the whale’s hip bone have a function?  
  After resolving (i) and (ii) for both theories, analyze *how* they diverge: Do they disagree in the same way on both cases, or in opposite directions? Finally, argue whether SE and CR are genuinely conflicting accounts of the *same* concept, or if they are best understood as addressing distinct questions. Support your position using the tensions exposed by these cases.**  

  **(a)** A lab splices a novel gene into a bacterium, enabling it to break down an antibiotic. This lineage has no evolutionary history of selection for antibiotic resistance; the gene is a one-off insertion, and the bacteria never encountered the drug before the experiment.  
  **(b)** A whale’s vestigial hip bone. It was unquestionably shaped by natural selection in ancestral tetrapods for limb support. In the modern whale, it contributes nothing to survival or reproduction; it merely exists as an evolutionary remnant.  

  ---

  ### Model Answer (498 words)  

  The selected-effects (SE) theory defines a function as the effect for which a trait was *historically selected*. The causal-role (CR) theory defines it as a *current causal contribution* to a system’s goals (e.g., survival). These cases reveal incompatible commitments and show the theories diverge in *opposite directions*.  

  In **Case (a)**, SE theory denies the inserted gene has a function. SE requires a history of selection for the effect. Here, the gene’s antibiotic resistance is entirely novel, never selected in the bacterium’s lineage. Absent this history, SE cannot attribute "breakdown of antibiotic" as its function. CR theory, however, *must* attribute a function. The gene currently contributes crucially to the bacterium’s survival when exposed to the antibiotic by performing a beneficial causal role. CR is indifferent to history; current causal efficacy suffices.  

  In **Case (b)**, SE theory affirms the hip bone *has* a function. Its current inertness is irrelevant; SE cares only about its *historical* selection for limb support. Thus, "supporting limbs" remains its function, even if that effect no longer occurs. CR theory denies it has a function. Without any current causal contribution to the whale’s fitness (e.g., no role in swimming, reproduction, or structural support), it fails CR’s requirement for systemic utility. It is merely a byproduct.  

  The theories thus **diverge in opposite directions**:  
  - In (a), SE says *no function*, CR says *yes*.  
  - In (b), SE says *yes*, CR says *no*.  
  This mirror-image disagreement underscores that SE and CR aren’t merely emphasizing different facets; they offer mutually exclusive verdicts when history and current role mismatch.  

  This conflict suggests they are **genuinely disagreeing about the core meaning of "function"** rather than answering distinct questions. Both claim to explicate the same concept: what justifies saying "X’s function is Y." SE anchors function in etiology, arguing that without selection history, we conflate function with accident (e.g., the gene’s effect is lucky, not purposive). CR anchors it in systemic organization, contending that without current utility, we confuse defunct relics with operational parts (e.g., the bone’s history is irrelevant to the whale’s biology *now*).  

  The cases expose an irreconcilable tension: SE cannot explain *new* adaptations like the gene, while CR cannot explain *vestiges* like the bone. If they addressed distinct questions (e.g., "What was it selected for?" vs. "What does it do now?"), their answers wouldn’t clash outright. But because both claim authority over whether "function" applies *at all* in (a) and (b), their divergence reveals a substantive dispute about whether normativity in biology derives from history or current dynamics. Neither theory can fully capture biological practice alone, but their contradictory outputs in these cases prove they offer competing, not complementary, accounts of the same concept.  

  ---

  ### Marking Scheme (Total: 20 points)  

  **Key Moves for Top Marks (16–20):**  
  - **(i) Case (a):** Correctly states SE denies function (no history), CR affirms it (current causal role). (4 pts)  
  - **(ii) Case (b):** Correctly states SE affirms function (historical selection), CR denies it (no current contribution). (4 pts)  
  - **Divergence:** Explicitly notes theories come apart *in opposite directions* across cases (SE: No/Yes; CR: Yes/No). (4 pts)  
  - **Conflict Analysis:** Argues theories conflict over the *same concept* (not distinct questions), using cases to show incompatible verdicts undermine neutrality. Rejects "shrug" via tension: SE fails novelty, CR fails vestiges. (6 pts)  
  - **Clarity & Structure:** Logical flow; no significant digressions. (2 pts)  

  **Common Mistakes (Deduct 1–3 pts per error):**  
  - **Misattribution:** Wrong SE/CR verdict for either case.  
  - **Vagueness:** Says theories "disagree" without specifying *how* (e.g., misses mirror-opposite divergence).  
  - **Shrug Response:** Claims theories "answer different questions" without justifying *why* their direct clashes matter, or treating conflict as superficial.  
  - **Omission:** Fails to resolve both cases for both theories, or skips divergence analysis.  
  - **Redundancy:** Parrots textbook definitions without applying to cases.  

  **Fail (≤10):** Summarizes SE/CR without case application; misses divergence; or dismisses conflict uncritically.
