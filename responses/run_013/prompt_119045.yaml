prompt: |-
  You're a philosopher who works on both formal epistemology and the ethics of mental health care — think carefully before you answer, I'd rather have a slow, careful procedure than a tidy one.

  I'm a consultant psychiatrist in an NHS trust and I've been asked to write the guidance our on-call doctors will use for what we've started calling 'binding requests': a patient, while well, asks us in writing to hold them to a decision they know they'll later want to reverse — don't let me refuse admission, keep me on the depot when I say stop, don't let me discharge myself. We get maybe a dozen a year. They're high stakes, and the call usually gets made by whoever's on at 3am, so it has to be something a tired junior doctor can actually run. Legal validity isn't my problem, the solicitors handle that; I need the ethical layer underneath it.

  What's got me stuck is this. I've been reading about van Fraassen's reflection principle, which says roughly that your credence now ought to match what you expect your credence to be later, when the later you is better informed — its just a consistency constraint on belief. But the whole point of a binding request is to stop that happening: the patient wants the earlier belief to win. So when is it right to help someone bind rather than reflect, and when isn't it? I assume the principle only bites when the later judgement comes from a better-informed process rather than a distorted one — but then who decides which is which, and isn't that just the well self marking its own homework? And I notice the principle is about beliefs, not about what someone cares about, which I suspect is doing a lot of the work here.

  Write me the procedure. In order: the questions to ask, what counts as a sufficient answer to each, where it stops with a no, and where it hands the decision to a person because the question is one of values and not facts. Mark clearly which steps are judgment calls dressed up as procedure. Then run it on two cases — (a) someone with bipolar disorder who wrote, while well, that they want admitting against their will if they stop their lithium and go high, and is now saying no; (b) someone in the early stages of dementia who signed an advance statement refusing a treatment they are now asking for — and don't soften the answer if it's one I won't like. Start with a short brainstorm of the different things 'binding' could mean here and where the reflection idea runs out. British English please, and tell me at the end where the reasoning is weakest and what would change your mind about the approach.
reasoning: |-
  Hmm, the user is a consultant psychiatrist in the NHS who needs help creating an ethical framework for handling "binding requests" from patients. This is about when patients ask in advance to be overruled later if they change their mind during a mental health episode. They're struggling with how van Fraassen's reflection principle applies here, since binding requests inherently violate that principle of aligning current and future beliefs.

  The user has raised several thoughtful concerns: How do we determine whose judgment is "better" - the well self or the ill self? When should we prioritize binding over reflection? And how much of this is about values rather than facts? They want a practical procedure that junior doctors can follow at 3am, with clear questions, thresholds for refusal, and value judgments explicitly marked.

  Let me unpack this carefully. Binding could mean several things: it could be about preserving autonomy through pre-commitment, protecting welfare, or preventing harm. The reflection principle breaks down here because it assumes rational updating of beliefs, whereas mental illness often involves distorted judgment. The key distinction is between epistemic impairment (can't think straight) and evaluative shifts (values change).

  For the procedure, I'll structure it as a flowchart with mandatory stops, value judgments, and clear documentation requirements. It needs to assess: 1) whether this is a true self-binding request (not coercion), 2) the nature of the impairment (epistemic vs. evaluative), and 3) proportionality of the intervention. I'll include hard stops for coercion, insufficient evidence, or non-imminent risk.

  Applying this to their cases: For the bipolar patient stopping lithium, I'd likely honor the binding request - their current refusal shows classic impaired judgment during mania. For the dementia patient requesting a previously refused treatment, it's trickier; if this reflects new values rather than confusion, we shouldn't bind them. The dementia case reveals the framework's weakness around shifting identities - when does the "person" change so much that prior directives shouldn't apply?

  The biggest vulnerability is determining what counts as "distortion" versus genuine value change. I'd reconsider if shown evidence that binding requests consistently cause harm, or if new models of identity in dementia challenge the "true self" concept. Also need to watch for therapeutic overreach - we mustn't assume illness whenever patients disagree with doctors.

  This needs to be practical for exhausted juniors: clear yes/no thresholds, scripted questions, and mandated senior review at ambiguous points. The ethical core is respecting persons - which sometimes means holding them to their own prior commitments.
answer: |-
  ### Brainstorm: The Nature of Binding & Limits of Reflection  
  1. **What "binding" could mean**:  
     - **Autonomy-through-time**: Preserving the patient’s long-term agency against episodic impairment.  
     - **Welfare protection**: Shielding the patient from harm during compromised states.  
     - **Identity preservation**: Honouring the "true self" (stable values) over illness-distorted impulses.  
     - **Epistemic humility**: Acknowledging that illness impairs insight, making later "reflection" unreliable.  

  2. **Where reflection runs out**:  
     - Reflection assumes rational updating of beliefs with new evidence. **Binding is defensible when the later "self" isn’t better-informed but *misinformed* by illness** (e.g., psychosis hijacks reasoning).  
     - The principle concerns *beliefs* (credences), but binding often addresses *values* (what the patient cares about). Mania might not change beliefs about lithium’s efficacy but may erase *value* for stability.  
     - **Core tension**: Well-self’s request might be biased by stigma/adaptive preferences; ill-self’s refusal might reflect anosognosia. No neutral arbiter exists.  

  ---

  ### Procedure: Ethical Assessment of Binding Requests  
  **Principles**: Minimise coercion; maximise respect for stable values; document rigorously.  
  **Format**: Flowchart with binary stops (🔴 = hard stop; ⚠️ = value judgment; ✅ = proceed).  

  #### Step 1: **Verify Authenticity**  
     *Question*: "Is this request free from coercion, undue influence, or therapeutic pressure?"  
     - *Evidence required*: Signed statement + contemporaneous clinical note confirming capacity, voluntariness, and understanding of consequences.  
     - **🔴 STOP if**:  
       - No written document OR evidence of coercion (e.g., family pressure noted in records).  
       - Patient lacked capacity *at time of request* (per GMC guidelines).  
     - **⚠️ Value check**: If ambiguous, escalate to consultant (coercion isn’t always overt).  

  #### Step 2: **Assess Current Impairment**  
     *Question*: "Is the patient’s current refusal likely distorted by the condition the request aimed to bind?"  
     - *Evidence required*:  
       - Symptoms matching the predicted impairment (e.g., grandiosity in bipolar; anosognosia in dementia).  
       - Documented history showing pattern (e.g., prior episodes where refusal caused harm).  
     - **🔴 STOP if**:  
       - No active impairment OR impairment unrelated to the request (e.g., delirious for unrelated reason).  
     - **⚠️ Value check**: "Distortion" isn’t merely disagreeing with doctors. Use validated tools (e.g., BCIS for insight) *plus* collateral history.  

  #### Step 3: **Determine Epistemic vs. Evaluative Shift**  
     *Question*: "Is the patient’s reversal due to *impaired reasoning* (epistemic) or a *change in values* (evaluative)?"  
     - *Clarify*:  
       - **Epistemic failure**: False beliefs (e.g., "Lithium poisons me"), inconsistent logic.  
       - **Evaluative shift**: Newly stated preferences (e.g., "I’d rather be happy than stable").  
     - **🔴 STOP if**:  
       - Clear evaluative shift *without evidence of impairment*.  
     - **⚠️ Value check**: Illness can *cause* evaluative shifts (e.g., frontal dementia altering personality). Default to binding **only if** shift is episodic *and* contravenes lifelong values.  

  #### Step 4: **Proportionality & Harm**  
     *Question*: "Is enforcing the request the least restrictive option to prevent *severe, imminent* harm?"  
     - *Evidence required*:  
       - Risk assessment linking refusal to specific harm (e.g., suicide risk in bipolar; rapid decline in dementia).  
       - Proof that lesser interventions failed/would fail (e.g., persuasion attempted).  
     - **🔴 STOP if**:  
       - Harm is speculative OR non-imminent (e.g., "might" become unwell in weeks).  
       - Request demands excessive restriction (e.g., indefinite detention).  
     - **⚠️ Value check**: "Severe harm" thresholds vary. Escalate to consultant if borderline.  

  #### Step 5: **Temporal Relevance**  
     *Question*: "Is the request contextually appropriate *now*?"  
     - *Check*:  
       - Changed circumstances (e.g., new treatments available; prognosis revised).  
       - Request expiry date (if specified).  
     - **🔴 STOP if**:  
       - Request is outdated/obsolete (e.g., based on outdated risk data).  

  #### Final Step: **Implementation**  
     - ✅ Enforce binding request if all steps cleared.  
     - **Document**:  
       - Why criteria were met (citing evidence).  
       - Why ill-self’s refusal is impaired (specific symptoms).  
       - Less restrictive options considered.  
     - **Mandatory**: Consultant review within 24hrs.  

  ---

  ### Case Applications  
  #### Case A: Bipolar patient stopping lithium, now refusing admission  
  1. **Authenticity**: Documented request during euthymia ✅.  
  2. **Impairment**: Current grandiosity, insomnia, spending sprees ✅ (*pattern matches*).  
  3. **Shift**: Refusal based on "I’m brilliant, don’t need drugs" (epistemic failure) ✅.  
  4. **Harm**: Imminent risk of self-injury (history of credit ruin/arrest when manic) ✅.  
  5. **Relevance**: No new treatments/context changes ✅.  
  **OUTCOME**: **Enforce request**. Admit under MHA if necessary.  

  #### Case B: Early dementia patient, advance refusal of antibiotics, now requesting treatment  
  1. **Authenticity**: Advance statement valid ✅.  
  2. **Impairment**: Moderate anosognosia but understands infection ✅.  
  3. **Shift**: Now values life extension ("I want to see grandchild’s wedding") vs. prior directive refusing "futile" treatment. **Evaluative shift** 🔴.  
     - *But*: Investigate if shift is illness-driven (e.g., frontal lobe changes altering personality). If so, ⚠️ → Step 4.  
  4. **Harm**: Without antibiotics, death likely. Is this "severe harm"? ⚠️ (*Subjective*).  
     - Prior directive saw death as preferable to decline; current self disagrees.  
  5. **Relevance**: Directive based on avoiding "prolonged suffering," but infection treatable ✅.  
  **OUTCOME**: **🔴 STOP**. Do not enforce binding. Honor current request unless clear evidence this isn’t their *stable* value (e.g., fluctuates hourly).  

  ---

  ### Weaknesses & Mind-Changing Evidence  
  **Where reasoning is weakest**:  
  1. **The "True Self" Problem**: Assuming the well-self is "authentic" ignores that chronic illness reshapes identity. *Mitigation*: Prioritize *consistent* values over time, not "wellness."  
  2. **Value Judgments as Pseudo-Objectivity**: Calling something "epistemic failure" can mask paternalism. *Mitigation*: Demand symptom evidence, not just "poor choice."  
  3. **Dementia Blindspot**: Binding may become unethical if the person’s identity meaningfully changes.  

  **What would change my approach**:  
  - Evidence that binding requests **increase long-term trauma** (e.g., studies showing worsened therapeutic alliance).  
  - Data proving **evaluative shifts in mental illness are often stable** (undermining "distortion" claims).  
  - Legal rulings redefining "personhood" in dementia (e.g., UK courts prioritizing current wishes).  

  **Final note**: This procedure errs toward non-binding when values conflict. It prioritizes current well-being over rigid adherence to past directives when identity evolves. Junior doctors should **always** default to senior review when in doubt – this isn’t a failure but ethical prudence.  

  > "Binding is a tool to protect agency from illness, not to freeze patients in past decisions."
