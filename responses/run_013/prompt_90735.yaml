prompt: |-
  I'm a PhD student in political theory, and I'm trying to write down what I actually believe about how a group ought to settle questions that hang together logically. I have a set of gut verdicts and I want to know what principle, if any, they add up to — and which of them I should give up. In every case below the individual members are internally consistent; only the group's judgments come apart.

  1. Hiring committee, nine members. Three questions: whether the candidate clears the research bar (R), whether she clears the teaching bar (T), and whether to hire (H), with the committee's rule being that H holds just in case R and T do. Four members vote R, T, H; three vote R, not-T, not-H; two vote not-R, T, not-H. The majority therefore affirms R (7–2) and affirms T (6–3), while the majority rejects H (5–4). My gut: we do not hire. Four of nine want to hire, and I don't think a decision to hire can be assembled out of two majorities made of different people. If someone said we must hire because the premises passed, I'd say they had substituted the committee's reasons for the committee's decision.

  2. Appellate panel, three judges. Whether the statute was violated (V), whether the affirmative defense applies (D), judgment for the plaintiff just in case V and not-D. Judge 1: V, not-D, for the plaintiff. Judge 2: V, D, for the defendant. Judge 3: not-V, not-D, for the defendant. Majorities for V, for not-D, and against the plaintiff, all 2–1. My gut flips here: the plaintiff wins. The court has found the violation and found no defense, and its judgment should follow from what it has found. This is the opposite of what I said in (1), and I cannot yet say what makes it different.

  3. Two-party contest, nine voters, three planks. The two platforms differ on all three planks. Three voters agree with A on all three planks and vote for A. Six voters agree with A on exactly one plank each — two on plank one, two on plank two, two on plank three — and vote for B. So A's position wins every plank 5–4, and B wins the election 6–3. My gut: B governs. A has no mandate; plank-majorities are not a majority for anything.

  4. Agenda. A nine-member committee choosing among X, Y, and Z, with majorities X over Y, Y over Z, and Z over X, each 5–4. The chair, who prefers X, puts Y against Z first and then X against Y, and X wins. My gut: illegitimate. There is no majority verdict for the committee to give, and the chair has manufactured one; the honest output is that the committee cannot settle this by majority.

  5. Entrenchment. A clause requiring two-thirds of the legislature for amendment; an amendment with 58 percent support fails. My gut: legitimate, and no one has been wronged. So my majoritarianism is not absolute.

  When I try to state what I believe, I get roughly this: the group's answer to the question it was convened to answer is whatever a majority of members say to that question, while the reasons it gives are settled separately, and it is permissible for a group's decision and its reasons to come apart. That yields no-hire in (1), B in (3), and silence in (4), where no majority answer exists. It yields not-liable in (2), against my gut, so I add a clause: where the body's output is itself an authoritative statement of the elements — a court's findings, a standard-setter's report — the elements must be voted first and the output derived from them. That clause looks like an exception invented for a single case, and I suspect it is doing no real work.

  I have also tried a formalization that has nothing to do with majorities: choose the logically consistent set of judgments closest to the members' judgments, counting each member's disagreement equally, proposition by proposition. In (1) that gives hire. The set (R, T, H) sits at total distance 10 from the nine members; (R, not-T, not-H) at 12; (not-R, T, not-H) at 14; (not-R, not-T, not-H) at 17. So the nearest consistent set is precisely the one I want to reject, and it coincides with the premise-majority answer. In (2) the same criterion leaves three consistent sets tied at distance 4 — (V, not-D, for the plaintiff), (V, D, for the defendant), (not-V, not-D, for the defendant) — so it falls silent exactly where my verdict is firmest.

  What I want: a precise statement of the principle, or small set of principles, that captures these verdicts, with each clause tied to the case that forces it. Then its verdicts on cases I have not considered — in particular (a) the same nine-member profile as (1), but where the body is enacting a general rule rather than applying one to a single applicant; (b) a court whose judgment commands a majority while each judge's route to it differs, so that no single set of findings commands a majority; and (c) two further cases of your own choosing that pull the clauses apart. Finally, tell me honestly which of my verdicts the best principle cannot accommodate — I would rather abandon a verdict than keep a clause that exists only to save it — and whether my two attempts, majority on the question and nearest consistent set, can be reconciled or whether one must go.
reasoning: |-
  Okay, let me unpack this fascinating problem. The user is a political theory PhD student grappling with how groups should make logically connected decisions. They've presented five concrete cases with conflicting gut reactions, and they want a coherent principle that explains these intuitions - even if it means abandoning some.

  First, I notice the core tension: in case 1 (hiring) they reject premise-based voting, but in case 2 (court) they embrace it. Their own attempts - majority-on-final-question versus nearest-consistent-set - both fail to capture all intuitions. The key seems to be distinguishing between different types of group decisions.

  Looking deeper: cases 1 and 3 feel like "mandate" decisions where the group must speak with one voice. Case 2 is about applying predetermined logic to findings. Case 4 is procedural fairness about cycling preferences. Case 5 shows majoritarianism isn't absolute. 

  The breakthrough comes when I realize we need to categorize decisions by their purpose. "Mandate" decisions (hiring, elections) require direct majority on the outcome because we care about the group's unified will. "Subsumptive" decisions (courts) allow premise-based outcomes because the logic is predetermined. "Procedural" decisions (agendas, supermajorities) have different rules by design.

  This framework explains all cases:
  - Hiring (mandate): no hire (no direct majority for hire)
  - Court (subsumptive): plaintiff wins (premises met)
  - Election (mandate): B wins (direct majority)
  - Agenda (procedural): illegitimate (no Condorcet winner)
  - Entrenchment (procedural): legitimate (rules followed)

  The beauty is how it handles new cases:
  a) Rule enactment (mandate) would require direct majority on the rule itself
  b) Split-path court decision: still plaintiff wins if premises are found, regardless of judges' reasoning
  c) Added cases test boundaries - like a premise-based hiring committee (should still be mandate-type) or a court ignoring its own rules (should be illegitimate)

  Where they might need to adjust: if they ever want premise-based outcomes for mandate decisions, that breaks the framework. But their gut rejects that in case 1, so consistency is worth it. The nearest-consistent-set approach is useful for subsumptive decisions but wrong for mandate ones.

  Ultimately this provides principled coherence by tying decision rules to institutional purpose - exactly what political theory should do. The user gets a defensible system where the exceptions aren't arbitrary but flow from the nature of the decision.
answer: |-
  Your gut verdicts reveal a sophisticated distinction between *types* of group decisions. The core principle isn't majoritarianism on the final question *or* premise aggregation—it's **whether the group’s task is to express a unified mandate or to apply predefined logical rules to its findings**. Here's a precise framework derived from your cases, with clauses tied to what forces them:

  ---

  ### **The Principle: Mandate vs. Subsumption**
  1. **Mandate Decisions (Direct Will Formation)**  
     *When the group’s output is an authoritative expression of its collective will (e.g., electing a leader, hiring, setting policy), the final decision requires a majority vote on the question itself.*  
     - **Why?** The group must "speak as one" on the outcome. Premise majorities are irrelevant if they don’t cohere into a unified position.  
     - **Forces clause:** Case 1 (hiring) and Case 3 (election).  
       - *Hiring:* No hire (4/9 support hire; no majority).  
       - *Election:* B governs (6/9 voted for B).  

  2. **Subsumption Decisions (Rule Application)**  
     *When the group’s output is logically determined by predefined rules applied to its findings (e.g., a court applying law to facts), vote only on premises; the output derives from them.*  
     - **Why?** The body is an epistemic agent applying external logic, not expressing will.  
     - **Forces clause:** Case 2 (court), where your gut flips.  
       - *Court:* Plaintiff wins (majorities for V and ¬D; judgment follows logically).  

  3. **Procedural Constraints**  
     *Where institutional rules (e.g., agendas, supermajorities) exist, they override pure majoritarianism.*  
     - **Why?** Fairness/legitimacy depends on agreed-upon procedures.  
     - **Forces clause:** Case 4 (agenda) and Case 5 (entrenchment).  
       - *Agenda:* Illegitimate (no Condorcet winner; cycling preferences mean no majority verdict exists).  
       - *Entrenchment:* Legitimate (rules require supermajority).  

  ---

  ### **Clash with Your Attempts**  
  - **"Majority on the final question"** fails Case 2 (court), where no majority favors "plaintiff wins" (only 1/3 judges vote that outcome directly).  
  - **"Nearest consistent set"** fails Case 1 (selects hire) and Case 4 (may force an outcome where none exists).  

  ---

  ### **Verdicts on New Cases**  
  *(a) General Rule Enactment (same profile as Case 1)*  
  - **Profile:** 4 vote R,T,H; 3 vote R,¬T,¬H; 2 vote ¬R,T,¬H.  
  - **Task:** Enacting "H if R and T" as a general rule (not applying it).  
  - **Verdict:** *Rule fails.* This is a **mandate decision**—the group isn’t applying logic but expressing will on the rule. No majority supports the rule (only 4/9 vote for it).  

  *(b) Court with Disagreed Paths*  
  - **Profile:** 3 judges. Premises: Violation (V), Defense (D). Judgment: liable iff V ∧ ¬D.  
    - Judge 1: V, D → ¬liable  
    - Judge 2: ¬V, ¬D → ¬liable  
    - Judge 3: V, ¬D → liable  
  - **Majorities:** V (2–1), ¬D (2–1), ¬liable (2–1).  
  - **Verdict:** *Liable.* **Subsumption decision.** Premises (V and ¬D) have majorities; liability follows logically. Judges’ internal reasoning is irrelevant.  

  *(c) New Test Cases*  
  - **Case C1: Premise-Based Hiring Committee**  
    - Committee votes *only* on R and T; H is automatic if both pass.  
    - Same votes: R passes 7–2, T passes 6–3.  
    - **Verdict:** *Hire.* The group defined its task as **subsumption** (applying a rule), not mandate. Your gut might resist, but the principle demands hire.  

  - **Case C2: Electoral College with Faithless Electors**  
    - Voters elect delegates who pledge to support the majority’s platform choice.  
    - Delegates: 6 support Platform B, 3 support A.  
    - But 2 B-delegates defect, voting for A because A won their pet plank.  
    - Outcome: A wins 5–4.  
    - **Verdict:** *B wins.* **Mandate decision.** Delegates were chosen to express will for a platform; defectors violate the mandate.  

  ---

  ### **What You Should Abandon**  
  - **Case 1 Consistency:** If you accept subsumption in Case 2 and Case C1, you must accept that *how the group defines its task* matters. If Case 1’s committee voted *only* on R and T (not H), hire would be correct. Your "gut" in Case 1 assumes an unreconstructed mandate decision.  
  - **Nearest Consistent Set:** Abandon this as a general principle. It works for subsumption (e.g., courts) but conflicts with mandate decisions.  

  ---

  ### **Reconciliation**  
  Your two attempts reflect the two decision types:  
  - **"Majority on the question"** captures **mandate decisions**.  
  - **"Nearest consistent set"** captures **subsumption decisions** (where minimizing disagreement on premises is key).  
  The meta-principle is: **First, classify the decision type.** This resolves all your cases without ad hoc exceptions.  

  **Final Framework:**  
  > A group’s decision is legitimate if:  
  > (1) For **mandate decisions** (will-formation), a majority supports the outcome;  
  > (2) For **subsumption decisions** (rule-application), the outcome derives logically from majority-approved premises;  
  > (3) Agreed procedures (e.g., agendas, supermajorities) are followed.  

  This satisfies your demand for principles over intuitions—and your political theory instincts about institutional roles.
