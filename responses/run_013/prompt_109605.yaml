prompt: |-
  I sit on the drafting committee of a deliberative-reform working group in a mid-sized city, and our mandate is deliberately vague: reduce the weight of career politicians in how the council actually works. Our meetings keep collapsing into a three-way argument. The sortition faction wants a randomly selected chamber with a single fixed term and no re-election. The term-limit faction wants to keep elections but cap service at two or three terms. The skeptics say both reforms simply relocate power to whoever sets agendas, writes the briefing documents, and staffs the committees, and that we should stop pretending otherwise. I have been asked to convert this into something more useful than a shouting match: a research agenda, not a literature survey. Assume the resources are one full-time researcher for two years plus a few part-time collaborators — enough for three lines of work done properly, not ten done badly.

  What I want is a ranked and defended agenda of the open questions, at most four or five of them, with the reasoning spelled out. For each one: why it is upstream of the others, in the sense that other questions become moot, easier, or differently framed once it is settled; whether it is the sort of thing that conceptual argument can settle at all, or whether it is hostage to data we cannot plausibly collect before our report is due; and how much it actually bears on the charter text we will end up writing, since a question that cannot change a clause is a question I cannot spend a researcher on. I also want to know what would move each question up or down the list over the next year. Candidates we have been arguing about, in no particular order: whether sortition's legitimacy case and its epistemic case are separable, and whether it matters which one we think we are buying; the self-application problem, that any reform must be enacted by the incumbents it demotes, and whether that changes which questions are worth settling first; the migration of careerism into the permanent administration, the lottery machinery, and the facilitation apparatus that any assembly needs — one of our members calls this second-order careerism, and I genuinely cannot tell whether it names a real mechanism or is a rhetorical trick for defending the status quo; whether term limits reduce careerism or merely transfer influence to staffers, party organisations, and lobbyists; and the selection problem, meaning who declines to serve, who gets exempted, and whether the people willing to be drafted are unrepresentative in ways that no quota can repair. Add whatever we are missing, but only if it earns its place against those.

  Please be willing to tell me that the framing is wrong. If the honest answer is that most of these are empirical questions our scale cannot resolve, or that the choice among them is settled by contested values rather than by argument, or that what we actually need is a decision procedure for the committee rather than a research agenda, say so plainly instead of manufacturing an agenda to fit the request. Where you are genuinely unsure, mark the uncertainty rather than smoothing it over; I would rather have your confidence levels, and an explicit note on which of my candidates you think are overrated or do not follow, than a confident-sounding list.
reasoning: |-
  Okay, the user is part of a deliberative-reform working group tasked with reducing career politicians' influence in their city council. They're stuck in a three-way debate between sortition advocates, term-limit supporters, and skeptics. They need a focused research agenda—not a literature review—for one full-time researcher over two years. The agenda should prioritize key questions based on their upstream impact, resolvability, and relevance to drafting the charter.

  First, I need to understand their main concerns. The user listed several candidate questions: the legitimacy vs. epistemic case for sortition, the self-application problem (reforms enacted by incumbents), second-order careerism (power shifting to staff), term limits' effectiveness, and the selection problem (who agrees to serve). They want these ranked with clear reasoning.

  The key is to identify which questions are foundational. The self-application problem seems crucial because if reforms can't be implemented due to political realities, other questions become moot. It's both practical and value-based, affecting how reforms are designed. Then, second-order careerism—if power just shifts to bureaucrats, that undermines both sortition and term limits. This requires empirical research but is actionable.

  Next, the selection problem for sortition. If the pool of willing participants is biased, it affects legitimacy. This is empirical and can be studied locally. Then, term limits' effects on careerism vs. staff influence—this has existing data but needs local context. Finally, the legitimacy-epistemic split for sortition. This is more theoretical and might not change the charter text much.

  The user also needs to know what could move these priorities. Political windows, new evidence, or pilot programs could shift focus. I should be honest about uncertainties: some issues are values-based, not researchable, and the committee might need a decision process instead. Highlight that second-order careerism and selection bias are critical, while the legitimacy-epistemic question is less actionable. Emphasize practicality and avoiding wasted effort on unresolvable questions.
answer: |-
  Here’s a prioritized research agenda focused on **actionable clarity for charter drafting**, grounded in your constraints and designed to cut through ideological gridlock. The ranking is based on *upstream impact*, *resolvability within 2 years*, and *direct relevance to charter text*. I’ve flagged uncertainties and overrated candidates explicitly.

  ### Core Principle
  **Focus on power relocation, not idealism:** All reforms redistribute power—research must map *where* it flows under each model. Ignore "ought" debates; track the "who actually decides."

  ---

  ### Ranked Research Agenda (Max 4 Lines of Inquiry)
  1. **The Second-Order Careerism Mechanism**  
     **Why upstream?**  
     If power migrates irreversibly to administrators/facilitators (e.g., agenda-setters, committee staff, lottery operators), *both sortition and term limits become symbolic*. This question determines whether *any* reform achieves your mandate.  
     **Resolvability:**  
     - *Empirical*: Case studies of cities with term limits/sortition pilots (e.g., Ostbelgien, Paris, term-limited US cities).  
     - *Actionable*: Staff influence maps (who drafts bills? who amends them?) are tractable.  
     **Charter Impact:** HIGH. Dictates safeguards (e.g., independent facilitation bodies, transparency rules).  
     **Move Up/Down:**  
     ↑ If evidence shows staff control correlates with reform adoption.  
     ↓ If initial data proves neutral administrators exist (rare).  
     **Your Candidates:** *This is "second-order careerism"—it names a REAL mechanism, not rhetoric.*

  2. **The Self-Application Problem (Incumbent Incentives)**  
     **Why upstream?**  
     If incumbents won’t enact reforms that harm their power, research on *other* questions is futile. This frames *how* reform is phased (e.g., grandfathering, delayed implementation).  
     **Resolvability:**  
     - *Mixed*: Historical analysis (failed vs. successful reforms) + structured interviews with current council members.  
     - *Limitation*: Incumbents may lie; focus on *behavioral* incentives, not self-reports.  
     **Charter Impact:** CRITICAL. Shapes transition clauses/referendum requirements.  
     **Move Up/Down:**  
     ↑ If council elections approach (leverage fear of voter backlash).  
     ↓ If a crisis (e.g., scandal) creates reform momentum.  
     **Your Candidates:** *Prioritize this early—it gates all else.*

  3. **Selection Bias in Sortition Pools**  
     **Why upstream?**  
     If willing participants are unrepresentative *even after quotas*, sortition’s legitimacy collapses. Term-limit advocates will exploit this.  
     **Resolvability:**  
     - *Empirical*: Local surveys (demographics, attitudes of likely decliners vs. accepters).  
     - *Feasible*: Simulate lottery draws with compensation tiers to test uptake.  
     **Charter Impact:** HIGH. Informs compensation, civic duty rules, opt-out criteria.  
     **Move Up/Down:**  
     ↑ If sortition gains committee traction.  
     ↓ If term limits dominate debate.  
     **Your Candidates:** *"Selection problem" is central—but quotas alone won’t fix it.*

  4. **Term Limits vs. Staff/Lobbyist Empowerment**  
     **Why upstream?**  
     Tests the skeptic’s core claim. If term limits *increase* unelected influence, they fail your mandate.  
     **Resolvability:**  
     - *Empirical*: Compare policy outcomes/staff budgets pre/post term limits in peer cities.  
     - *Data Access:* Lobbyist registration logs, staff legislative input records.  
     **Charter Impact:** MEDIUM-HIGH. Determines if term limits are viable at all.  
     **Move Up/Down:**  
     ↑ If term-limit faction gains ground.  
     ↓ If evidence overwhelmingly shows staff dominance (e.g., California cities).  

  ---

  ### What Was Demoted (and Why)
  - **Legitimacy vs. Epistemic Case for Sortition**  
    *Overrated.* Charter text won’t care *why* sortition works—only *if* it redistributes power. A theoretical debate that eats resources.  
  - **"Migration of Careerism" as Rhetoric**  
    Already embedded in **#1 (Second-Order Careerism)**—no need to duplicate.  

  ---

  ### What’s Missing? The "Problem Definition" Audit
  **Add:** *What specific behaviors of "career politicians" must be reduced?* (e.g., reelection fundraising time, committee chair dominance, vendor patronage).  
  **Why Add?**  
  - Upstream of *all* reforms. If you can’t measure the problem, you can’t evaluate solutions.  
  - Resolvable via council session logs, voting records, and time-use surveys.  
  - Charter Impact: HIGH (e.g., caps on chair terms, public campaign funding).  
  **Rank:** Would tie #2—do this *immediately* to focus the committee.  

  ---

  ### Hard Truths: What Research Can’t Fix
  1. **Values Conflicts:** No research will reconcile "democracy via election" vs. "democracy via lottery." This requires political negotiation, not data.  
  2. **Unprovable Mechanisms:** *Second-order careerism* can be observed but not predicted perfectly. Pilot projects beat forecasts.  
  3. **Scale Limits:** You lack time for longitudinal studies. Prioritize *mechanism mapping* over causality.  

  ---

  ### Recommended Process
  1. **Weeks 1–4:** Conduct the **Problem Definition Audit** (above). Force the committee to agree on observable metrics for "career politician influence."  
  2. **Months 2–6:** Parallel work on **#1 (Second-Order Careerism)** and **#2 (Self-Application)**.  
  3. **Months 7–18:** Focus on **#3 (Selection Bias)** or **#4 (Term Limit Effects)** based on committee bias.  
  4. **Final 6 Months:** Draft charter clauses with explicit "power relocation" safeguards informed by findings.  

  **Your researcher’s mantra:** "Who gains influence under this model? How do we know?" If the answer is "unelected actors," the reform failed—unless you *want* technocracy. This agenda forces that reckoning.
