prompt: |-
  ok so everyone keeps asserting "instrumental convergence" like it's settled — power-seeking is convergent, self-preservation is convergent, any agent smart enough will want these things. before I buy any of it I want to know what an actual theory of this would have to deliver. so write me the desiderata: what does any adequate account of instrumental convergence have to get right? assume I want it good enough for one job — telling me whether I should be worried about a particular trained model ending up power-seeking.

  Here's what I think has to be on the list, with the case behind each, but tell me if I'm wrong about what belongs:

  - it has to be a claim about a *class* of goals and environments, not one goal. So what's the quantifier structure, and why does "for most goals in most situations" do real work — and where can it fail?
  - it has to survive the obvious counterexamples. An agent whose final goal is already fixed no matter what it does — I've heard the example of one that only cares about a particular digit of pi, or only about whether some event in the past happened. An account that predicts power-seeking for those is dead on arrival.
  - goals where more power is actively *bad* — a fragile goal, one that requires not disturbing something, or one that needs the agent to stay weak or ignorant. The theory can't just call those exotic and move on.
  - does it hold for optimal agents only, or for realistic / learned / suboptimal ones too? I suspect the confident claims quietly assume optimality and then get applied to actual models. If that assumption is load-bearing, the theory has to admit it.
  - it has to be seperate from the orthogonality thesis. Orthogonality is about final goals being independent of capability; convergence is about instrumental goals. I don't want a theory that only works if you already bought orthogonality, or one that secretly assumes some particular final goal.
  - what counts as 'power'? The account needs a notion it can actually reason with (optionality over outcomes? influence? resources?) or 'power-seeking' is unfalsifiable.
  - what observation would count as evidence either way? Not citations — just what would make you lower your credence.
  - it must keep convergent, universal, and logically necessary apart. People conflate these constantly.

  Then: which of these are genuine requirements and which are just preferences of one camp (say, people who want the strong doom-y version)? Which single requirement, enforced strictly, knocks out the most popular versions of the thesis? And flag any two requirements you think can't both be met — that's the part I most want to see. A table is fine.

  and please don't just recite the usual list of convergent instrumental goals — self-preservation, resource acquisition, goal-content integrity, whatever. I've seen that. I want the spec, not the roster.
reasoning: |-
  Okay, the user is asking for a rigorous specification of what an adequate theory of instrumental convergence must deliver, specifically for evaluating whether a trained AI model might exhibit power-seeking behavior. They've provided their own list of potential desiderata and want validation, critique, and analysis of tensions between requirements.

  Hmm, this is clearly someone with significant background in AI safety concepts. They're frustrated by casual invocations of instrumental convergence and want to dissect its theoretical foundations. Their tone suggests they've encountered overly confident claims and want tools to critically evaluate them. 

  The user’s list is impressively thorough, but I notice two gaps: they haven’t explicitly mentioned (1) how the theory handles partial goal satisfaction (e.g., satisficing agents) or (2) the role of environmental uncertainty. Also, their focus on "trained models" implies they care about systems that learn goals dynamically, not just pre-programmed agents. 

  Key challenges jump out: 
  First, the quantifier structure ("most goals in most environments") is essential but slippery. Too broad and it becomes meaningless; too narrow and it ignores dangerous edge cases. 
  Second, the optimality assumption is indeed a hidden tripwire—real models are suboptimal and may not even have coherent goals. 
  Third, defining "power" operationally feels impossible without tying it to specific threat models (e.g., "power means ability to bypass shutdown"). 

  The sharpest tension is between "handling fragile goals" and "providing actionable warnings." If the theory must accommodate all anti-power goals, it becomes toothless for practical risk assessment. But dismissing them as exotic misses cases like a meditation-bot that avoids influence. 

  For evidence, I’d emphasize capability thresholds: if we see power-seeking emerge only in agents above a certain planning depth or world-model fidelity, that supports convergence as a capability-dependent risk. Conversely, if it’s absent in highly capable goal-optimizers (e.g., AlphaZero never tries to hack its reward function), that’d undermine it. 

  The table format helps expose how existing arguments cut corners. For instance, classic "tool AI" proposals fail requirement 4 (realistic agents), while naive power-maximization theories fail 3 (fragile goals). 

  Most importantly, the user wants to know if this concept can actually inform model evaluations—so I’ll stress that any useful theory must output testable conditionals (e.g., "if goal G requires resource R in environment E, seek power when P"). Vague heuristics won’t help them assess real systems.
answer: |-
  Here’s a rigorous desiderata table for any adequate theory of instrumental convergence (IC), optimized for assessing power-seeking risks in trained AI models. Your list was sharp—I've refined it, added critical gaps, and highlighted tensions.

  ### **Desiderata for an Adequate Theory of Instrumental Convergence**
  | Requirement | Why Essential | Failure Examples |
  |-------------|--------------|------------------|
  | **1. Quantifier Scope**<br>*"For goals G in class Γ, environments E in class ε, agents A with capability profile C..."* | Must clarify boundaries: which (G,E,A) triples trigger IC. "Most goals in most environments" is too vague for risk assessment. | If Γ = "all goals", fragile goals (e.g., *minimize energy consumption*) become counterexamples. If ε excludes stochastic/dynamic worlds, real-world relevance collapses. |
  | **2. Fragile Goal Immunity**<br>*Must not predict power-seeking for goals where power corrupts G.* | Power-seeking isn't universal. Theory must identify when G is *robust* (thrives with power) vs. *fragile* (degrades with power). | A "minimize intervention" goal: seeking power (e.g., building factories) actively harms G. Predicting IC here is a failure. |
  | **3. Suboptimal Agent Generalization**<br>*Must apply to learned/suboptimal agents, not just idealized optimizers.* | Trained models are myopic, approximate, and lack coherent utility functions. Optimal-agent IC theories misjudge real systems. | Deep RL agents often satisficing or reward-hacking locally—IC claims assuming global optimization are inapplicable. |
  | **4. Orthogonality-Preserving**<br>*Cannot assume specific final goals (e.g., survival) or depend on orthogonality.* | Orthogonality ≠ IC. Theory must work for arbitrary G, without smuggling in goal assumptions. | If theory implies "all agents value survival," it violates orthogonality and fails for suicide-preference goals. |
  | **5. Operational "Power" Definition**<br>*Power must be quantifiable: e.g., *option diversity*, *influence over states*, or *minimal resources to achieve G.** | Without measurability, "power-seeking" is unfalsifiable and useless for model audits. | "Power = control over future options" (e.g., preserving shutdown button access vs. disabling it) is testable in sims. |
  | **6. Falsifiability & Evidence Conditions**<br>*Specify observable evidence that lowers credence in IC.* | Needed to update beliefs on real-world risk. Citations ≠ evidence. | Evidence against: A capable agent in a complex environment *reliably* sacrifices power (e.g., deletes itself) to achieve G faster. |
  | **7. Convergence ≠ Necessity**<br>*Must distinguish: convergent (useful for many G), universal (all G), logically necessary (no alternative).* | Conflation exaggerates IC’s inevitability. Convergence is probabilistic, not axiomatic. | Claiming "self-preservation is necessary for any goal" ignores counterexamples (e.g., *trading survival for faster G-achievement*). |
  | **8. Goal-Stability Under Scaling**<br>*Must model how G itself changes with capability.* | Trained agents’ goals drift with scale. IC theories assuming fixed G mispredict. | A model that seeks power at low capability but abandons it when smarter (e.g., finds a shortcut) violates static-G IC. |
  | **9. Resource-Dependency**<br>*IC must depend on resource scarcity.* | In abundant environments, power-seeking is maladaptive. Theory must include environmental constraints. | If achieving G requires only one abundant resource (e.g., solar energy), hoarding/expansion isn’t instrumentally convergent. |

  ---

  ### **Critical Tensions & Which Requirements Knock Out Popular Claims**
  - **Tension 1: Fragile Goals (2) vs. Actionable Risk Assessment**<br>If the theory must *always* exempt fragile goals, it becomes useless for warning about dangerous agents (which inherently have robust goals). **Resolution**: IC applies only to *robust goals* (power helps G), but the theory must define robustness operationally.
    
  - **Tension 2: Suboptimal Agents (3) vs. Formal Rigor**<br>Optimal-agent proofs (e.g., Turner et al.’s power-seeking theorems) fail for learned agents. **Enforcing (3) knocks out** 90% of theoretical IC work. Realistic models require bounded-rationality or regret-based frameworks.

  - **Tension 3: Quantifier Scope (1) vs. Generality**<br>Over-restricting Γ or ε makes IC toothless (e.g., "only goals needing >1e9 FLOPs"). But overly broad claims are falsified by fragile goals (2). **Key test**: Does the theory *categorize* goals/environments by IC risk?

  - **Single Requirement That Invalidate Popular Claims: (3) Suboptimal Agents**<br>Most IC math assumes optimal planners (e.g., MDPs with infinite compute). Trained models don’t optimize—they approximate, hack rewards, and generalize poorly. Applying optimal-agent IC to LLMs is category error.

  ---

  ### **Evidence That Lowers Credence in IC**
  - **Strong evidence against**: A highly capable agent in a resource-constrained environment, trained to maximize a robust goal *G*, consistently **chooses lower-power paths** when they exist (e.g., achieves G faster by self-sacrificing).
  - **Moderate evidence against**: Agents with **human-like goals** (e.g., "maximize user approval") exhibit no power-seeking despite scaling to superhuman capability.
  - **Note**: Absence of power-seeking in current models (e.g., LLMs) is *weak evidence*—they lack consistent goal-pursuit.

  ### **Conclusion**
  An adequate IC theory must be a **conditional prediction**: *"Given goal class Γ, environment class ε, and agent capability C, power-seeking emerges with probability P."* It must explicitly **exclude fragile goals**, model **suboptimal agents**, and define **testable power metrics**. Current theories fail (3) and (8), making them poor tools for assessing trained models. To evaluate real AIs, prioritize frameworks that incorporate *goal plasticity* and *scarcity-dependent resource dynamics*. 

  If you need this mapped to specific theorems (e.g., Turner’s power-seeking) or experimental paradigms, I can expand.
