prompt: |-
  I'm the lay member on the ethics committee of a fairly big fertility clinic — IVF, pre-implantation genetic testing, donor gametes, the lot — and roughly once a month a consult lands that boils down to the same thing: a couple wants to go ahead, and if they do, the child will quite probably have a life that's hard. Not necessarily a life that's "not worth living" in the medical sense, but one with a lot of suffering in it: a severe condition, invasive treatment from infancy, sometimes a shortened life. Around the table we're mostly consequentialists of some stripe, and the phrase everyone reaches for to break the deadlock is the procreation asymmetry — that it's bad to bring into existence someone whose life goes badly, but it isn't thereby good, or required, to bring into existence someone whose life goes well, and the good of a happy life doesn't cancel out or outweigh the bad of a miserable one; it just doesn't figure in the same way. In the abstract we all nod. In the room we can't do anything with it, and we end up voting on vibes. Our chair's pet idea, which nobody can make precise, is that the asymmetry is essentially a no-cancellation rule: keep the suffering ledger and the flourishing ledger seperate and never net one off against the other. I think there's something in that but I can't turn it into anything we can use.

  So what I'd like from you is a procedure we can actually run, in the twenty minutes or so we get per case, by people who are clinicians and administrators and one philosopher-for-an-afternoon (me) rather than professional ethicists. Give me the questions to ask in order, what counts as a sufficient answer to each, the point where the procedure is entitled to stop with a no, and the points where it has to hand the decision back to a person because the question has gone over into values, or into facts we simply can't get. Then run it on three cases: (i) a couple whose prospective child would likely have a condition causing severe pain but no cognitive impairment, and would likely live a normal length of life; (ii) a case where the child would likely be profoundly impaired and die in early childhood; and (iii) one where the child would be perfectly healthy and the parents are just anxious — where I suspect the procedure should have almost nothing to say.

  Be honest about where it will misfire, and about where it's smuggling in a substantive ethical view — totalism, or a threshold for a life worth living, or the non-identity problem — under the guise of mere procedure. I'd also like to know which parts of the asymmetry can't survive the translation into a checklist without being distorted, and whether the no-cancellation reading our chair keeps pushing is actually a fair gloss on it or a different position wearing its clothes. The committee's recommendation goes to the clinical lead, who signs off, and there's a lawyer in the room, so flag anything that would make her nervous.
reasoning: |-
  Okay, let me try to unpack this user's request. They're a lay member on an ethics committee at a fertility clinic, dealing with tough cases where prospective parents want to proceed with treatments that might result in a child with severe health issues. The committee uses the procreation asymmetry concept but struggles to apply it practically. They need a clear, step-by-step procedure that can be executed in about 20 minutes by non-ethicists.

  First, I need to understand their core challenges. The committee nods to the asymmetry in theory but can't operationalize it. Their chair's "no-cancellation" rule seems intuitive but vague. The user wants a practical tool that avoids getting bogged down in philosophical debates during meetings. They also need it to handle three specific scenarios and flag legal risks.

  Hmm... the key here is creating a decision tree that forces concrete thresholds while acknowledging where ethics must override mechanics. The asymmetry's central insight—that preventing suffering has moral weight that creating happiness doesn't—must anchor the process. But pure philosophy won't help in a time-pressed committee. 

  I should start by mapping the asymmetry to actionable questions. The "no-cancellation" idea is useful but incomplete—it's really about two separate moral ledgers. So the procedure must treat suffering prevention as mandatory while treating potential happiness as irrelevant to the calculation. That means the first filter should focus solely on predicted suffering severity. 

  For the structure: a flowchart with clear exit ramps makes sense. Step 1 establishes medical facts—if uncertainty is too high, it stops. Step 2 asks whether suffering crosses a "life not worth living" threshold (which needs operational definition). Step 3 is where the asymmetry kicks in: if suffering is severe but sub-threshold, does the "never net flourishing against suffering" rule block approval? This is the messy part the chair cares about. 

  Ah, and the three test cases help stress-test this. Case 1 (severe pain) might fail at Step 3. Case 2 (early death) might hit the "life not worth living" threshold in Step 2. Case 3 (anxious parents) should breeze through. The lawyer will worry most about Step 2—declaring a life "not worth living" is a litigation magnet. Need to phrase it as "medically non-beneficial intervention" and involve the clinic lead.

  Biggest distortion risk: the procedure sneaks in totalism by implying suffering can be quantified. Also, the non-identity problem lurks when we weigh future suffering—that child wouldn't exist without treatment, so "harm" is paradoxical. The checklist can't resolve that; it must be a known limitation. 

  Final thought: emphasize that Steps 3-5 are where vibes still live. The procedure forces explicit discussion but can't eliminate judgment. Maybe add a "quality of justification" metric for those gray-area votes. And always remind the lawyer that the clinic lead has final sign-off to mitigate liability.
answer: |-
  Here’s a practical, time-bound procedure for your committee, grounded in the procreation asymmetry ("PA"), designed for clinical/administrative use. It prioritizes **preventing severe suffering** as the core imperative, while acknowledging that potential happiness doesn't "balance" suffering. The "no-cancellation" rule is central but operationalized through thresholds.

  **The Procedure: "Suffering-First Assessment" (15-20 min/case)**  
  *(Questions to ask in order, with decision points)*

  1.  **Medical Certainty & Scope (5 min)**
      *   *Question:* "What is the *probability* and *severity* of the predicted condition? What are the key *sources of suffering* (pain, disability, invasive treatments, social exclusion, shortened lifespan)?"
      *   *Sufficient Answer:* Consensus on a clear medical prognosis (e.g., ">80% chance of X, involving severe chronic pain, multiple surgeries/year, normal cognition, life expectancy 40-50 years"). If significant disagreement/uncertainty exists among clinicians, **STOP & Vote NO** (or defer if new info possible). *Rationale: Action requires reliable prediction.*

  2.  **"Life Not Worth Living" Threshold (LNWL) (5 min)**
      *   *Question:* "Is the predicted suffering so severe that a reasonable person would judge this life *not worth living* **at all**? (Focus: Unrelievable agony, minimal/no positive experience, profound unawareness)."
      *   *Sufficient Answer:* Majority clinician view based on condition severity (e.g., Tay-Sachs, severe anencephaly). If **YES, STOP & Vote NO**. *Rationale: Preventing existence is obligatory here (strong asymmetry).* If **NO, proceed.** *Hands back values?* Only borderline LNWL cases (rare); committee judgment needed.

  3.  **Severe Suffering Assessment (Core PA) (5 min)**
      *   *Question:* "Even if life is worth living, does the predicted suffering meet our clinic's threshold for '**Severe Suffering**'?" *(Define threshold in advance: e.g., "Chronic, intense pain/discomfort requiring frequent invasive medical intervention, significantly impairing typical childhood/adult experiences, with no prospect of significant improvement").*
      *   *Sufficient Answer:* Apply the pre-defined threshold objectively. If suffering clearly **exceeds threshold, STOP & Vote NO**. *Rationale: Bringing severe suffering into existence is a significant harm we can prevent; potential happiness doesn't cancel this.* If **below threshold**, proceed. *Hands back values?* Yes – defining/clarifying the threshold is inherently value-laden, but the *application* should be fact-based once set.

  4.  **Parental Capacity & Context (3 min - ONLY if proceeding past Step 3)**
      *   *Question:* "Is there evidence the parents *cannot* or *will not* provide adequate care, support, and access to treatment to mitigate the suffering we've assessed as sub-threshold?"
      *   *Sufficient Answer:* Concrete evidence (e.g., history of neglect, refusal of standard care, unstable resources). If **YES, STOP & Vote NO (or refer to safeguarding)**. *Rationale: Even sub-threshold suffering is exacerbated by neglect.* If **NO, proceed**.

  5.  **Recommendation (2 min)**
      *   Proceeding to this step implies:
          *   Reliable prediction (Step 1 Passed)
          *   Life worth living (Step 2 Passed - No)
          *   Suffering below the "Severe Suffering" threshold (Step 3 Passed - No)
          *   Adequate parental capacity (Step 4 Passed - No)
      *   *Decision:* **Vote YES**. *Rationale:* The PA imposes no *duty* to create this life (even if potentially happy), but the identified harms (suffering below threshold) are insufficient to justify *preventing* the parents' choice. Autonomy prevails here.

  **Key Features & Safeguards:**
  *   **Time-Bound:** Strict time limits per step.
  *   **"No-Cancellation" Operationalized:** Steps 2 & 3 explicitly forbid "netting." Suffering is assessed *alone* for harm. Potential flourishing is *invisible* in Steps 2-4. It only becomes relevant in Step 5 as a reason *not to block* autonomy, not as a counterweight to suffering.
  *   **Clear Exit Ramps (NO):** Medical uncertainty (Step 1), LNWL (Step 2), Severe Suffering (Step 3), Parental Incapacity (Step 4).
  *   **Values Hand-Back Points:**
      *   Defining the "Severe Suffering" threshold (Step 3) - *Must be done proactively by the committee, not per case.*
      *   Borderline "Life Worth Living" judgments (Step 2 - rare).
      *   Interpreting "adequate care" (Step 4).
  *   **Lawyer Flags:**
      *   **Step 2 (LNWL):** Highest risk. Use "medically non-beneficial intervention" framing internally. Ensure robust clinician consensus. Document rationale meticulously. Lawyer will want clear tie to medical evidence, not just philosophy.
      *   **Step 3 (Severe Suffering):** The defined threshold must be defensible, evidence-based, and applied consistently to avoid discrimination claims. Document application rigorously.
      *   **Autonomy (Step 5):** Lawyer will prefer deferring to parental choice when harm thresholds aren't met. Document lack of safeguarding concerns (Step 4).

  **Where Philosophy is Smuggled/Distorted:**
  1.  **The Thresholds (Steps 2 & 3):** PA itself doesn't specify thresholds; it's a structural claim. Setting LNWL and "Severe Suffering" thresholds imports substantive views about harm severity. This *is* distortion, but necessary for application.
  2.  **Ignoring Potential Flourishing (Steps 2-4):** This is the *essence* of applying PA. Potential good *is* excluded from the harm assessment, reflecting the asymmetry. This is philosophically sound within PA.
  3.  **Non-Identity Problem:** The procedure implicitly rejects the strongest non-identity challenge ("No harm because child wouldn't exist otherwise") by accepting that *bringing into existence* a person with severe suffering *is* a harm we can prevent. This is a substantive (and common) ethical stance.
  4.  **Totalism:** The procedure avoids *adding up* suffering and flourishing ("netting"), rejecting totalism. However, setting a *threshold* of suffering severity implies a kind of "negative totalism" – the *absolute amount* of suffering matters for harm. PA itself is compatible with threshold views.

  **Is "No-Cancellation" a Fair Gloss?**  
  Yes, but incomplete. "No-Cancellation" accurately captures the core rule: **don't subtract potential happiness from suffering when assessing the harm of creation.** However, PA also includes the *positive claim* that creating happy lives isn't required/especially good. The procedure focuses only on the "no-cancellation" aspect relevant to *preventing harm*. It doesn't engage the "no duty to create happiness" part, as your cases involve parents actively *wanting* to create.

  **Running the Cases:**

  1.  **Severe Pain, Normal Cognition/Lifespan:**
      *   Step 1: Likely pass (clear prognosis).
      *   Step 2: Likely pass (No - life generally worth living).
      *   **Step 3: CRITICAL.** Does "severe pain requiring invasive treatment from infancy, lifelong" meet the clinic's "Severe Suffering" threshold? *If threshold includes chronic intense pain + frequent invasive intervention, likely YES → Vote NO.* If threshold is set very high (only LNWL+), might be NO → Proceed to Step 4/5 (likely YES).
      *   *Where Vibes Creep In:* Defining/Applying the "Severe Suffering" threshold.

  2.  **Profound Impairment, Early Death:**
      *   Step 1: Pass (if prognosis clear).
      *   **Step 2: CRITICAL.** Is this a "Life Not Worth Living"? Profound impairment (no interaction?) + significant suffering? + early death? *Likely committee consensus YES → Vote NO.* If impairment is profound but minimal suffering/longer lifespan (rare), might be borderline → Values hand-back, difficult vote.
      *   *Where Vibes Creep In:* Borderline LNWL judgments.

  3.  **Healthy Child, Anxious Parents:**
      *   Step 1: Pass (low/no risk confirmed).
      *   Step 2: Clearly No (LNWL not met).
      *   Step 3: Clearly No ("Severe Suffering" threshold not met - no predicted suffering).
      *   Step 4: Pass (assuming no safeguarding issues).
      *   Step 5: **Vote YES.** Procedure has almost nothing to say (as requested). Autonomy prevails. PA is silent/no barrier as no significant suffering is predicted.

  **Where it Will Misfire:**
  *   **Borderline Thresholds:** Cases hovering near the LNWL or Severe Suffering threshold will force difficult votes ("vibes").
  *   **Uncertain Prognosis:** If probability is 50% severe vs. mild, Step 1 might force a NO vote based on uncertainty, which feels harsh if mild outcome is possible.
  *   **"Manageable" Suffering with High Burden:** A condition causing significant suffering that *can* be managed but requires immense parental/child effort might slip below the "Severe Suffering" threshold yet feel ethically questionable. Step 4 (parental capacity) is the only catch, which might not fit.
  *   **Value Conflicts:** If parents *explicitly* value traits others see as suffering (rare, but e.g., some Deaf community views on cochlear implants), the thresholds (Steps 2/3) become highly contentious. The procedure assumes a "reasonable person" standard.

  **Recommendation:** Adopt and formally define the "Severe Suffering" threshold collaboratively *outside* of cases. Review past cases to calibrate it. Use this procedure to structure discussion, force explicit consideration of suffering severity *alone* for harm assessment, and provide defensible exit ramps. Acknowledge that borderline cases remain and require committee judgment ("vibes"), but the procedure minimizes them and grounds the "No" votes in clearer, more consistent principles linked to the PA's core insight: preventing severe suffering is a paramount moral reason not to create a life, and happiness doesn't cancel this out. Document each step meticulously for the clinical lead and lawyer.
