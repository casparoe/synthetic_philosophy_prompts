prompt: |-
  I'm doing a part-time history and philosophy of science evening course, and something in the readings keeps nagging at me. The examples of theory replacement all seem to have the same shape: the old theory posits some entity that nobody believes in anymore, the entity gets thrown out, but the equations the old theory used turn up again in the new theory, just relabelled or reinterpreted. The stuff we thought was real -- whatever the light waves were supposed to be waving through, the little vortices, the mechanical bits and pieces -- gets dropped, but the mathematical relationships carry straight over, and in the region where the old theory worked the new one gives you basically the same numbers. So we seem to keep the form and lose the furniture, and I suspect thats exactly why people want to say the old theory was 'approximately true' rather than merely handy. But nobody in my class has a crisp name for that specific thing -- the retention of the pattern without the retention of whatever was supposed to be doing the pattern.

  Is there an established concept for this? I keep bumping into near misses. There's the general idea that later theories preserve the successful predictions of earlier ones, which is close but seems to be about predictions rather than about what survives; there's the idea that theories are just instruments for organising observations, which denies anything survives at all; and there's the warning that we should expect our own theories' favourite entities to be discarded eventually, which feels related but is a claim about the future rather than about what actually carries over. I want the name, if it has one, for the pattern itself, plus how it differs from each of those neighbours and where its edges are. If a theory keeps the equation but changes what the symbols refer to, is that the same thing? What if it keeps the equation and the referents but changes what they're made of? And if there's no settled name, please coin one and define it sharply enough that I can separate it from plain instrumentalism on one side and the pessimistic forecast on the other. I'm not after a label I can drop in a seminar -- I want the carving. Could you write it as continuous prose, no headings, bullet points, bold or tables, and in British English? It's going into a study-group handout and I'd rather it read like a letter from someone thinking out loud.
reasoning: |-
  Okay, let me unpack this user's query. They're studying history and philosophy of science, and they've noticed a recurring pattern in theory changes. Old theories have entities that get discarded, but the mathematical relationships persist in new theories. The user wants a precise term for this phenomenon—retention of the pattern without the ontological commitments.

  First, I need to recall relevant philosophical concepts. Structural realism comes to mind, especially the "structural" part. Worrall's version distinguishes between mathematical structure and ontological content. But is there a more specific term? The user mentioned near misses like instrumentalism or pessimistic meta-induction. They explicitly want to differentiate from those.

  The user’s examples—light waves' medium, vortices—point to historical cases like Fresnel's equations surviving despite the abandonment of the luminiferous ether. That’s classic structural realism. But perhaps "mathematical salvage" or "formal continuity" could work as coined terms if no established term fits. However, "mathematical structure" might be the core concept here.

  I should check if "equational retention" or "formalism invariance" are used anywhere. In philosophy of science, "structure" is the key term. The user wants to avoid instrumentalism (which denies survival of anything real) and pessimistic meta-induction (which predicts future theory rejection). Structural realism sits between them: structures persist even if entities don’t. 

  Also, addressing their sub-questions: if equations are kept but referents change, that’s structural continuity. If referents stay but material composition changes, it’s ontological revision, still structural if relationships hold. The boundaries matter here—structural realism’s edge is when equations break down in new domains.

  The user needs British English prose without markdown. So, structuring the response as a thoughtful letter, explaining structural realism, differentiating it from instrumentalism and pessimistic induction, using examples like Fresnel, and coining "mathematical structure" as the persistent element. Emphasizing that the pattern is the invariant relations, not the entities.
answer: |-
  Right, that nagging feeling? It’s profoundly well-placed. You've put your finger on one of the most persistent and philosophically rich patterns in the history of science – the uncanny survival of the *form* when the *furniture* gets carted off to the museum. And you're absolutely right that the usual suspects – approximate truth, instrumentalism, pessimistic meta-induction – circle it but don't quite capture its specific contours. Let me think this through with you.

  The core of what you're seeing is the **persistence of mathematical structure across theory change, despite radical shifts in ontological commitment.** Think of it as the skeleton surviving while the flesh is replaced. Fresnel’s equations for diffraction and interference? They stand, word for word, symbol for symbol, in Maxwell’s electromagnetism and beyond. But the thing those equations were *about* for Fresnel – waves in a mechanical luminiferous ether, with all its hypothetical particles and stresses – vanishes entirely. The *relationships* between amplitude, intensity, wavelength, and angle? Utterly preserved. The *stuff* supposedly doing the waving? Utterly discarded. It’s not merely that the *predictions* survive (though they do); it’s that the precise *mathematical fabric* woven by the old theory is directly incorporated into the new one, often in a very literal sense, like lifting a patch of equations whole cloth and sewing it into a new conceptual garment. The *formalism* is salvaged, even as its original *interpretation* is junked.

  This is distinct from plain instrumentalism. The instrumentalist might say, "Well, both theories were just useful tools for organising observations, so it's no surprise the maths keeps working." But that feels too thin, doesn't it? It dismisses the sense that *something* about the *world* was genuinely captured by the old equations, something robust enough to survive the ontological purge. The pattern wasn't just a convenient fiction; it latched onto a real structural feature of nature, even if we misunderstood what was *embodying* that structure. You want to acknowledge that survival *without* committing to the reality of the ether or the vortices.

  It's also distinct from the pessimistic meta-induction (the warning that our current entities are likely doomed). That's a *prediction* or an *inference* based *on* the pattern you've identified. The pattern itself – the historical fact of structural continuity amidst ontological rupture – is the evidential base *for* the pessimism about entities. But the pattern is the observed phenomenon; the meta-induction is the philosophical conclusion drawn from it.

  So, what's the crisp name? Within philosophy of science, particularly the realism debates, the most established concept capturing this is **structural continuity** or, more pointedly, the **retention of mathematical structure**. This is the central tenet of **structural realism**, championed by thinkers like John Worrall, explicitly drawing on cases like Fresnel-to-Maxwell. Structural realism proposes that what our scientific theories genuinely get right, and what survives theory change, is not the specific nature of the *entities* they postulate, but the abstract *structure* of relations they describe – typically encoded in their mathematics. The furniture changes; the architectural blueprints, surprisingly often, do not.

  Now, to your edge cases:

  1.  **Keeps the equation, changes the referent?** Absolutely central to the pattern. This *is* the Fresnel case. The equation `I ∝ A²` might have originally referred to the intensity of vibrations in an elastic solid; later, it refers to the intensity of self-propagating electromagnetic fields. The *form* of the relationship between `I` and `A` is retained; what `A` fundamentally *is* has changed utterly. This is paradigmatic structural continuity. The mathematical relation is the invariant.
  2.  **Keeps the equation and the referent, but changes what it's made of?** This is trickier. If the *referent* remains stable (e.g., we still call it "light" or "mass"), but our conception of its fundamental *composition* changes (e.g., light as particle vs. wave vs. electromagnetic wave vs. photon), *and* the mathematical relations governing its behaviour in certain domains remain identical (e.g., ray optics equations surviving), then yes, this *also* exhibits structural continuity *for that specific domain*. The *relations* governing observable behaviour persist, even as the underlying nature of the thing behaving is reconceived. However, if the change in composition fundamentally alters the *scope* or *fundamental nature* of the relations (e.g., introducing quantum uncertainty where classical determinism reigned), then the structural continuity is broken for phenomena where the new composition matters. The continuity is usually domain-specific.

  The crucial boundary lies in the *mathematical formalism itself*. Where the equations remain *operationally identical* within the old theory's domain of success, we have structural continuity. Where the new theory necessitates a *different mathematical structure* even for those previously successful predictions (which is rare in mature sciences, thankfully), then continuity is broken. Instrumentalism avoids ontological commitment altogether; structural continuity acknowledges the survival of *something* objective (the structure) while accepting the loss of the specific ontology. The pessimistic meta-induction uses the historical frequency of structural continuity coupled with ontological loss to predict the likely fate of *current* entities.

  So, for your handout, you could frame it like this: the persistent element is the **mathematical structure** – the web of formal relationships described by the equations. What gets discarded is the **ontological interpretation** – the specific picture of what entities or substances were thought to instantiate and cause that structure. We keep the blueprint; we lose the belief that it could only ever be built with Victorian brick and steam. It’s this uncanny resilience of the formal skeleton that gives the ‘approximately true’ label its strongest pull, precisely because it’s more than just handy prediction – it’s the re-use of the same mathematical machinery, now bolted onto a different engine. That’s the pattern you’ve spotted, and structural continuity is the sharpest name for its persistent beat through the history of science.
