prompt: |-
  I am advising a foundation that is considering a three-year, roughly ten-person research program on the contemporary significance of the Hart-Devlin debate. We are not interested in historical exegesis, and we do not want a literature survey. Our working hypothesis is that the debate has been framed too narrowly around whether immorality as such is a sufficient reason for criminal prohibition. The more consequential questions, we suspect, lie in three adjacent areas: first, legal moralism through private law -- contract, tort, property, licensing, platform governance -- where the state enforces moral norms indirectly and the criminal-law framework may not fit; second, what we call the moral-infrastructure asymmetry, according to which the state may be permitted to sustain the social preconditions of moral agency even if it may not directly enforce contested moral views; third, the meta-moral problem of disagreement, since any legal moralism must decide whose morality is enforced and by what procedure in a pluralistic society.

  Please assess that hypothesis and give me a defended research agenda. Which open questions in this area matter most, given a fixed budget of about ten researchers for three years? For each question you rank, explain why it is upstream of other work, how tractable it is for philosophers and legal theorists rather than empirical researchers, and what would move it up or down the list. I am especially interested in the trade-offs among conceptual clarity about legal moralism, normative questions about legitimate enforcement, institutional-design questions about courts, legislatures, and private law, and the sociology of moral change. Do not provide citations, a reading list, or a bibliography; I want the argument, not the references.

  At the very end, state your top-ranked question as a single line in the form \answer{...}, with only a short label inside the braces.
reasoning: |-
  Okay, let me unpack this query. The user represents a foundation planning a three-year research program on the Hart-Devlin debate's contemporary significance, with a clear rejection of historical or survey approaches. Their core hypothesis challenges the traditional criminal-law framing, proposing three alternative focal points: private law moralism, moral infrastructure asymmetry, and meta-moral disagreement in pluralistic societies. 

  The user's explicit requests include assessing this hypothesis, crafting a defended research agenda prioritizing 3-5 key questions, and rigorously addressing trade-offs across conceptual, normative, institutional, and sociological dimensions. Constraints are explicit: no citations, fixed 10-researcher capacity, and philosopher/legal-theorist orientation. The final output requires a top-ranked question labeled in specific format.

  Hmm... the hypothesis shows sophisticated reframing but might underweight institutional trade-offs. Private law's "indirect" enforcement could mask deeper moralism than criminal law, while moral infrastructure risks becoming a backdoor for majoritarian values. The meta-moral angle feels most urgent given rising polarization. 

  For the research agenda, I'll prioritize questions where: 
  - Conceptual groundwork enables downstream analysis (e.g., defining "moral agency preconditions")
  - Normative tensions surface institutional design needs (e.g., courts vs. legislatures on contested values)
  - Tractability suits theoretical methods (e.g., modeling disagreement-resolution procedures)
  - Sociology informs without dominating (e.g., how moral change patterns affect enforcement legitimacy)

  Top question must balance uniqueness to their hypothesis and cross-cutting impact. "Whose morality?" wins because it's upstream (procedural legitimacy affects all enforcement forms), tractable (procedural models need no empirics), and resolves their triad's tension. Plus, it forces engagement with sociology of moral change when designing institutions.

  Trade-off management: Each project should blend dimensions—e.g., studying tort moralism requires clarifying concepts (what counts as "indirect"?), then testing normative limits, THEN designing courts' role given disagreement patterns. Sequence matters: conceptual clarity first, but feed sociological insights into later institutional designs.

  Final output will structure three core questions, explaining rankings against their criteria, then box the meta-moral priority as instructed. Avoiding academic citations focuses the argument on their operational needs.
answer: |-
  Your hypothesis successfully reframes the Hart-Devlin debate beyond its criminal-law straitjacket, identifying three underexplored but highly consequential dimensions. It correctly diagnoses the limitations of focusing solely on *whether* the state may enforce morality, neglecting the *how*, *what kind*, and *whose morality* questions that dominate contemporary governance. However, the hypothesis could be sharpened: the "moral-infrastructure asymmetry" needs clearer boundaries to avoid becoming a catch-all justification, and the link between private law moralism and the meta-moral problem requires stronger articulation. Below is a defended research agenda prioritizing open questions based on impact, upstream position, tractability for theorists, and your trade-off constraints.

  **Assessed Research Agenda (Prioritized):**

  1.  **Question: What procedural mechanisms (in legislatures, courts, or hybrid bodies) can legitimately resolve the "whose morality?" problem for state action in pluralistic societies, distinguishing between core moral infrastructure, contested private law enforcement, and direct criminal prohibitions?**
      *   **Why Upstream?** This is foundational. Legitimacy precedes justification. Any enforcement of morality (via criminal law, private law, or infrastructure support) requires a defensible answer to "Who decides?" and "How?" Answering this structures analysis for all three areas of your hypothesis. It directly determines the permissible scope and form of legal moralism in each domain.
      *   **Tractability:** Ideal for philosophers (deliberative democratic theory, legitimacy, public reason) and legal theorists (institutional competence, procedural design, constitutional law). Focuses on normative principles and conceptual models for decision-making procedures under deep disagreement, not empirical prediction of outcomes.
      *   **Moves Up/Down:** Moves *up* due to intense polarization eroding faith in existing democratic and judicial processes. Moves *down* only if the project abandons pluralism as a core constraint. Highly tractable with theorist resources.
      *   **Trade-offs:** Directly tackles normative legitimacy and institutional design. Sociology of moral change informs the *context* of disagreement but the core task is procedural modeling. Conceptual clarity about the *types* of moral claims being enforced (infrastructure vs. specific norms) is a prerequisite input.

  2.  **Question: Can a coherent and justifiable principle distinguish "sustaining the preconditions of moral agency" (moral infrastructure) from "enforcing specific contested moral norms," and how does this principle constrain enforcement mechanisms across different legal domains (e.g., criminal law vs. platform licensing)?**
      *   **Why Upstream?** The moral-infrastructure asymmetry is a powerful but potentially slippery justification. Clarifying its core principle and limits is essential *before* assessing its application in specific areas like private law or platform governance. It defines the boundary of permissible state action independent of direct moral enforcement claims.
      *   **Tractability:** Primarily philosophical (moral philosophy, agency theory, political liberalism) and conceptual legal theory. Requires analyzing concepts like agency, autonomy, flourishing, and necessity, defining the "preconditions," and testing the principle against hard cases across legal domains.
      *   **Moves Up/Down:** Moves *up* if critiques show existing justifications for state action (harm principle, offense) are insufficient, creating demand for this alternative. Moves *down* if the distinction proves fundamentally incoherent or collapses into standard moral enforcement. Highly tractable with theorists.
      *   **Trade-offs:** Core focus is conceptual clarity and normative justification. Institutional design questions arise *after* the principle is defined (e.g., *which* institution is best suited to identify/vindicate preconditions?). Sociology helps identify contested preconditions but doesn't define the principle.

  3.  **Question: How do indirect enforcement mechanisms in private law and platform governance (e.g., tortious interference with contract based on moral repugnance, restrictive covenants, de-platforming for "hate speech") differ conceptually and normatively from direct criminal prohibition, and does this indirectness mitigate or exacerbate legitimacy concerns raised by the meta-moral problem?**
      *   **Why Upstream?** Private law/platform governance is where much "moralism in action" occurs today. Understanding its distinct logic – diffuse enforcement, private initiation, reliance on economic incentives/social norms, often lower procedural bars – is crucial *before* detailed institutional prescriptions. It tests whether "indirectness" provides a legitimacy shield or masks more pervasive control.
      *   **Tractability:** Legal theorists excel at doctrinal analysis, comparing enforcement logics, and normative critique of private law institutions. Philosophers contribute on coercion, complicity, and the nature of "indirect" enforcement. Less reliant on empirical sociology than understanding platform impacts might suggest; core issues are structural and normative.
      *   **Moves Up/Down:** Moves *up* as private ordering/platform power grows. Moves *down* if deemed purely empirical (e.g., measuring actual effects of specific doctrines). Requires careful framing to stay theoretical.
      *   **Trade-offs:** Blends conceptual clarity (defining indirectness), normative legitimacy (is it less/more problematic than criminal law?), and institutional design (role of courts vs. legislatures in regulating platforms/private law doctrines). Sociology of moral change is relevant context but secondary.

  **Trade-off Management:**

  *   **Sequencing:** Start with Question 1 (Procedures) and Question 2 (Infrastructure Principle) – they provide the essential frameworks. Question 3 (Private Law/Platforms) applies these frameworks to a critical domain.
  *   **Resource Allocation:** Prioritize philosophers on Q2 (core principle) and the normative aspects of Q1 (legitimacy). Prioritize legal theorists on Q1 (institutional design) and Q3 (doctrinal analysis). Ensure cross-pollination.
  *   **Sociology's Role:** Integrate sociological insights on moral change/pluralism primarily as *inputs* shaping the *problem context* for Q1 (disagreement intensity) and Q3 (emerging norms enforced via platforms/private law), not as primary research drivers. Theorists interpret and operationalize these insights.
  *   **Conceptual vs. Normative vs. Institutional:** Each core question inherently blends these. Prioritize establishing conceptual clarity *within* each question first (defining procedures, defining infrastructure, defining indirectness), *then* rigorously assess normative legitimacy, *then* derive institutional implications. Avoid silos; each strand informs the others iteratively.

  This agenda leverages your hypothesis by tackling the legitimacy crisis at the heart of modern legal moralism ("whose morality?"), grounding the promising but vague infrastructure concept, and critically examining the dominant contemporary *means* of enforcement (private law/platforms). It ensures the research is foundational, theoretically tractable, and addresses the most pressing normative and practical challenges beyond the criminal law frame.

  \answer{Legitimate Procedures for Moral Disagreement}
