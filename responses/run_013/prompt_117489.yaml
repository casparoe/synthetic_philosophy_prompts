          Rule 1: The WO can only issue a warrant for a statement if the agency presents a proof of that statement using only the premise cards that the WO holds.
          Rule 2: The premise cards are fixed and cannot be altered. The WO must check that every step of the proof is a valid inference (using standard logical rules, which the students know from their first logic course: modus ponens, etc.). The WO may reject a proof if it uses a premise not in the deck or an invalid step.
