  I was down the pub with a couple of mates the other night — one of them did astrophysics at uni, the other just reads alot of sci-fi — and we ended up doing the Fermi paradox thing again, and I came away realising that none of us actually has a number, we just wave our hands and say things like probably somewhere or probably nowhere. I'm a software engineer by trade (no philosophy background, so go easy on me), and I'm much happier with an actual figure than with vibes, so I want to pin down what I really think. The framing that's got me stuck is one I read about in a paper a while back, I think by Robin Hanson and some co-authors but don't quote me on that: the interesting question isn't whether civilisations exist, it's whether any of them are grabby, meaning they expand outward at a decent fraction of light speed and settle everything within reach. The argument runs that if even one grabby civilisation had ever arisen in our past light cone, it would have reached us long before now, so the fact that we're sat here unbothered suggests grabby civilisations are either vanishingly rare or we're one of the very first to get going — the we're-early explanation. I find that much more interesting than just asking where everyone else is, but it's also annoyingly hard to put a number on.

  So what I'd like from you is my actual credence — a real number, like 0.9 or 0.03, not a hedge — that no grabby alien civilisation has ever existed in our past light cone. And then please decompose it: the sub-questions the number actually depends on, a rough probability for each with a line or two of justification, and how they combine into the final figure. I'd want you to at least think about how often life gets started in the first place and how many of those starts get as far as something intelligent (the usual Drake-ish terms, but be honest about how much of it is guesswork dressed up as estimation); whether intelligence reliably leads to expansion or whether it usually fizzles out before it gets anywhere; whether the we're-early story is plausible given how young the universe still is relative to how long stars will keep burning; and whether there's some observation-selection reason we couldn't have found ourselves in the branch where we'd already been grabbed, which I suspect quietly does a lot of the work. Then tell me which term your final number is most sensitive to — where the disagreement between me and my mates actually lives — and which single thing we could plausibly learn in the next few decades would move your number the most. Oh, and I'm in Manchester so please write it in British English, and please don't just tell me the whole question is unfalsifiable and leave it there, I know it's unfalsifiable, I definately want the breakdown anyway.
