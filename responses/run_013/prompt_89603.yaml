answer: |-
  Here's your breakdown, following your requested structure:

  ---

  ### Plain-English reading
  The paragraph traces the meaning of "history" from its Greek root (*historia*). Originally (6th century BC, Ionian Greeks), *historia* meant "inquiry" or "investigation" into knowledge broadly, not storytelling. Only around the 4th century BC did the *historikos* (storyteller) replace the *historeōn* (knowledge-seeker). Thus, history *started* as a form of systematic research, akin to early philosophy. Herodotus embodied this – his work (*historiē*) was investigative exploration, not just narrative. However, Herodotus began using the term to refer to the *results* (details) of his inquiry, not just the inquiry itself. **The "it" in "we have it definitely applied..." refers explicitly to the *word* "history" (or rather, its Greek antecedent).** Aristotle is credited as the first to decisively apply the term to the finished written account ("the literary product"), not the prior investigation. From Aristotle onward, history became primarily a branch of literature.

  ### What 'scientific' is doing there
  The author uses "scientific research" here in its **broad, older sense of systematic, empirical inquiry aimed at discovering facts and understanding**, *not* in the modern sense of seeking universal covering laws (à la Hempel). He contrasts the rigorous *process* of investigation (*historeōn*) with the later focus on the *narrative output* (*historikos*). Herodotus is cited as exemplifying the "scientific" aspect: his "life-long investigation" involved gathering information, verifying sources (as best he could), and exploring causes – a methodical search for knowledge about the past and the world.

  The implied "fall from grace" isn't about abandoning laws vs. embracing stories. It's about a shift in the *primary focus* of the *term* and the perceived *activity*:
  1.  **Original Focus (Inquiry):** The *active process* of seeking, questioning, and verifying knowledge (seen as "scientific" – rigorous and truth-seeking).
  2.  **Later Focus (Narrative):** The *passive product* – the crafted story (*historia*) compiled *from* that inquiry (seen as "literary").
  What's potentially "lost" is the emphasis on the active, investigative, critical *process*; the term becomes associated primarily with the final, polished narrative. The distinction is **method/process (science-like inquiry) vs. output/form (literary narrative)**, not **law-explanation vs. story-explanation**. Herodotus still explained events causally within his narrative; the difference is whether the *label* "history" emphasizes *how the knowledge was obtained* or *how it is presented*.

  ### The swap test, applied
  Your friend's swap test is a useful heuristic for identifying **nomological explanations** (those relying on universal, invariant laws). Where it works:
  1.  **Physics/Chemistry:** Swapping specific lead weights for iron weights in a gravity explanation changes nothing fundamental – the law (F=G(m1m2)/r²) holds universally. The explanation rests on the law.
  2.  **Simple Historical Generalizations:** "The army collapsed due to low morale" *might* survive swapping armies/nations if low morale *always* causes collapse as a law (which it demonstrably doesn't).

  Where it breaks:
  1.  **Historical Contingency & Conjunction:** Most historical explanations hinge on the *unique conjunction* of specific actors, contexts, preceding events, structures, and choices. Swapping "Louis XVI" for "Frederick the Great" in an explanation of the French Revolution's outbreak doesn't just change a detail; it fundamentally alters the causal chain. The explanation *depends* on Louis's specific weaknesses, the specific state of French finances, the specific ideas of the *philosophes*, etc. The test collapses the explanation because the explanation is inherently particularistic.
  2.  **Intentionality & Meaning:** Explanations involving human reasons, beliefs, and cultural meanings are deeply context-bound. Swapping participants changes the intentional states driving action.

  **Covering-Law Proponent's Response:** They would argue the test *does* prove the right thing: it exposes that most historical explanations *aren't* genuinely nomological. They would likely counter that:
      *   The test highlights the *incompleteness* of purely particularistic explanations.
      *   True covering-law explanations *should* survive the test (e.g., "Societies experiencing X level of resource scarcity and Y level of elite competition *always* experience state collapse" – swap societies meeting X & Y, collapse should follow).
      *   If an explanation fails the swap test, it means it relies on implicit, untested assumptions or isn't a proper *scientific* explanation at all – it's merely a narrative description. They might see the encyclopaedia author's lament about losing the "scientific" (systematic inquiry) aspect as indirectly supporting the need for law-seeking, even if the author meant "scientific" methodologically.

  ### Confidence and the soft spot
  1.  **Plain-English Reading:** **High Confidence.** The linguistic and historical claims about the Greek terms, Herodotus, and Aristotle are standard and well-supported. The referent of "it" is grammatically unambiguous ("the word").
  2.  **What 'scientific' is doing there:** **High Confidence.** The context (1910, focus on Herodotus's method vs. narrative output) strongly supports interpreting "scientific research" as systematic, empirical inquiry, distinct from modern covering-law models. The inquiry/literary distinction is clear.
  3.  **The swap test, applied:** **Moderate-to-High Confidence.** The analysis of where the test works/breaks is robust. The covering-law proponent's counter-argument is a standard position within that philosophical framework.
  **Soft Spot:** Least confident about fully capturing *every* nuance a *specific* covering-law proponent (e.g., a strict Hempelian vs. a more nuanced positivist) might use to defend against the swap test's implication that historical explanations aren't law-based. While the core counter-argument presented is valid for the position, the precise wording they might use could vary.
