answer: |-
  ### Application of Collapse Scorecard

  **Aggregation Rule**: The aggregate collapse score is the arithmetic mean of the five axis scores. For axes with insufficient evidence, that axis is excluded from the mean. Ties in aggregate scores indicate comparable magnitude of collapse across dimensions despite differing profiles.

  ---

  #### **1. Late Bronze Age Eastern Mediterranean (c. 1200–1100 BCE)**  
  - **Settlement/Demography**: 0.9 (Urban centres like Ugarit and Hattusa abandoned; population decline severe but some coastal continuity.)  
  - **Political Integration**: 1.0 (Palace-based kingdoms [Hittite, Mycenaean] fully dissolved; no supra-local authority.)  
  - **Connectivity**: 1.0 (International trade networks (tin, copper) and elite gift-exchange collapse entirely.)  
  - **Administrative/Symbolic Apparatus**: 1.0 (Linear B writing, palatial record-keeping, and monumental architecture lost.)  
  - **Ritual/Cosmological Infrastructure**: 0.7 (Temple complexes decline, but local cultic practices persist; cosmological shifts are partial.)  
  - **Aggregate**: 0.92  
  - **Most Distinctive Axis**: **Connectivity (1.0)**. The abrupt, pan-regional severing of trade and diplomatic ties—evidenced by the cessation of shipwrecks and letters between kings—is unparalleled in its completeness.  
  - **Evidence Limitations**: All axes scorable; regional variations exist but data are robust.  

  #### **2. Terminal Classic Maya Lowlands (c. 800–950 CE)**  
  - **Settlement/Demography**: 1.0 (Near-total abandonment of major cities [Tikal, Calakmul]; populations plummet by 80–90% in core areas.)  
  - **Political Integration**: 1.0 (Divine kingship and regional polities vanish; no successor states above village level.)  
  - **Connectivity**: 0.8 (Long-distance exchange (e.g., obsidian) declines sharply but persists thinly; elite iconography fades.)  
  - **Administrative/Symbolic Apparatus**: 1.0 (Monumental inscriptions, Long Count calendar, and royal stelae cease abruptly.)  
  - **Ritual/Cosmological Infrastructure**: 0.6 (Major temples abandoned, but some sacred sites reused; cosmological concepts adapt in folk traditions.)  
  - **Aggregate**: 0.88  
  - **Most Distinctive Axis**: **Settlement/Demography (1.0)**. The scale of urban abandonment and demographic collapse in formerly densely settled heartlands is extreme and archaeologically unambiguous.  
  - **Evidence Limitations**: All axes well-documented; chronologies are precise.  

  #### **3. Rapa Nui (c. 1600–1800 CE)**  
  - **Settlement/Demography**: 0.8 (Population crashes due to environmental stress; settlement shifts from coastal to fortified inland, but continuity.)  
  - **Political Integration**: 0.7 (Complex chiefdom fragments; ceremonial authority (Ariki) weakens but kinship-based leadership endures.)  
  - **Connectivity**: *Insufficient Evidence* (Isolation makes external "connectivity" irrelevant; internal exchange continued but cannot score axis meaningfully.)  
  - **Administrative/Symbolic Apparatus**: 0.9 (Rongorongo script [if ritual] and moai-carving tradition lost; oral calendars persist.)  
  - **Ritual/Cosmological Infrastructure**: 0.8 (Moai cult abandoned; birdman cult emerges, severing ties to ancestral cosmology.)  
  - **Aggregate**: 0.80 (Mean of 4 axes; connectivity excluded.)  
  - **Most Distinctive Axis**: **Ritual/Cosmological Infrastructure (0.8)**. The deliberate toppling of moai—an overt repudiation of the old cosmology—drives collapse more than institutional decay.  
  - **Evidence Limitations**: **Connectivity** excluded as inapplicable; pre-collapse demography debated but overall trends clear.  

  #### **4. Western Roman Empire (5th–6th Centuries CE)**  
  - **Settlement/Demography**: 0.7 (Urban contraction and population decline, but not abandonment; rural villas persist.)  
  - **Political Integration**: 0.8 (Imperial administration fragments; Germanic kingdoms retain Roman titles but lack central control.)  
  - **Connectivity**: 0.6 (Mediterranean trade declines but continues [e.g., African Red Slip ware]; elite networks shift regionally.)  
  - **Administrative/Symbolic Apparatus**: 0.9 (Latin bureaucracy, secular monumental building, and imperial coinage fade; Church preserves literacy.)  
  - **Ritual/Cosmological Infrastructure**: 0.3 (Pagan temples abandoned, but Christianity—retaining Roman cosmology—becomes hegemonic.)  
  - **Aggregate**: 0.66  
  - **Most Distinctive Axis**: **Administrative/Symbolic Apparatus (0.9)**. The unravelling of the state’s logistical and epigraphic capacity—tax rolls, aqueduct maintenance, secular inscriptions—marks a fundamental unlearning.  
  - **Evidence Limitations**: All axes scorable; "continuity" narratives exist but fit this scoring.  

  ---

  ### **Ranking by Aggregate Score**  
  1. **Late Bronze Age Eastern Mediterranean** (0.92)  
  2. **Terminal Classic Maya Lowlands** (0.88)  
  3. **Rapa Nui** (0.80)  
  4. **Western Roman Empire** (0.66)  

  *No ties*: Scores separate cases cleanly, though Maya and LBA are close. Rome is distinctly less "collapsed".  

  ---

  ### **Further Judgements**  

  **1. Baseline Dependency (0–1, where 0 = low, 1 = high)**:  
  - **Late Bronze Age**: 0.3. Collapse appears abrupt against the cosmopolitan 13th century BCE; earlier crises (e.g., 2200 BCE) show similar patterns but less synchrony.  
  - **Terminal Classic Maya**: 0.4. Choosing 750 CE vs. 700 CE changes little; decline is cumulative but acceleration in the 9th century is stark.  
  - **Rapa Nui**: 0.7. "Collapse" blurs if baseline is 1200 CE (initial settlement) vs. 1500 CE (peak moai construction); later baselines amplify rupture.  
  - **Western Rome**: 0.8. Scores shift dramatically if comparing to 100 CE (high empire) vs. 400 CE (already fragmented); later baselines minimise perceived collapse.  

  **2. Collapse as Natural Kind or Observer Imposition**:  
  Collapse is **primarily an observer-imposed category** (0.8 on a 0–1 scale, where 1 = wholly imposed). The scorecard reveals that "collapse" is not a binary event but a *constellation of dissolutions*, varying across axes even within a case (e.g., Rome’s high administrative loss vs. low ritual change). What unites these cases is not a shared *process* but a shared *outcome*: the rapid, synchronous failure of multiple societal subsystems, creating a threshold where recovery to prior complexity is impossible. However, this threshold is defined by the observer’s emphasis on *certain types of complexity* (e.g., writing, monuments). Societies transform organically, but "collapse" is retroactively applied when the new state lacks features the observer values—typically those associated with elite power or cultural "high achievement". Rapa Nui’s shift to birdman cults or Rome’s ecclesiastical continuity are "collapse" only if one privileges vanished political forms. Thus, the category usefully describes *accelerated, multi-system failure* but risks conflating diverse adaptations under a teleological label implying "decline" from an idealised baseline.  

