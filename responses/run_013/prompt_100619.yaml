  The user wants a realistic scenario where the disavowal test flags manipulation, but the deception test doesn't. Constraints: no sci-fi, no false beliefs, no hidden influence attempt, and the manipulative element must arise from normal, non-sleazy tactics. The scenario should be a paragraph, followed by clear analysis.

