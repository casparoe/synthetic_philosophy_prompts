prompt: |-
  I am a doctoral candidate in the history of science at work on a methodological chapter about causal explanation in environmental history, and I have run into a conceptual snag that I have not been able to state to my own satisfaction, let alone resolve. A colleague in my department argues, with some force, that pathogens, climatic shifts, and volcanic eruptions ought to be treated as historical actors in their own right rather than as the backdrop against which human beings do the historically interesting things. She denies that this is a mere figure of speech, and she thinks that historians who reserve agency for intentional human beings are smuggling in a metaphysical commitment they would not defend if it were made explicit. I find something right in the vicinity of her view, but our conversations keep stalling: I suspect we are using cause and actor in senses that never quite meet, and I would like a clear statement of what is actually at stake. Please act as an expert in the philosophy of causation and the philosophy of history, and treat this as a conceptual problem rather than as an invitation to survey the literature.

  The case we keep returning to is schematic, and perhaps that is part of the trouble: a population with no prior exposure to a pathogen; a harvest failure following an unusually cold decade; an imperial administration that responds to the resulting distress badly and late. My colleague wants to say that the pathogen and the climate are parties to the outcome rather than its setting, while I want to say that the administration is where the explanation really lies. Neither of us can say why we disagree. So I would like you to explain the following. First, what is the difference between the claim that an eruption caused a famine and the claim that the eruption acted? Does the second claim add anything beyond metaphor, or does it stake out a genuinely different kind of assertion about what belongs in a historical explanation? Second, much of the resistance to this way of talking seems driven by the spectre of determinism: the worry that once non-human factors are admitted as agents, human deliberation begins to look like an epiphenomenon and history becomes a story about climate and microbes in which people are merely the medium. Is that worry well founded, or does it rest on an equivocation, in particular on sliding from the claim that something shaped what happened to the claim that it made what happened inevitable? Third, my colleague sometimes says that a volcano or a pathogen did real work in a given episode. I cannot tell whether that is a claim about causal efficacy, about explanatory salience, or about how credit and blame should be apportioned, and I suspect these come apart.

  Before you answer, take a moment to lay out the candidate distinctions you think are doing the work here, and flag any that turn out to be red herrings. Then explain each contested claim carefully, stating explicitly any distinction you rely on and showing how it resolves the question at issue. Where you take the dispute to be merely verbal, say so and explain why; where you take there to be a substantive disagreement, characterise it as precisely as you can, including what would have to be true for each side to be right. A compact and sharply argued explanation would serve me considerably better than an exhaustive survey.
reasoning: |-
  Okay, let me start by unpacking the doctoral candidate's problem. They're wrestling with whether non-human elements like pathogens or climate should be considered historical actors. Their colleague argues these are active participants, not just backdrop. The candidate feels there's a point there but can't pinpoint the disagreement. 

  First, I need to clarify the core distinctions. The key terms here are causation versus agency. Causation is about events leading to outcomes, while agency implies intention and action. The colleague wants to call the volcano an "actor," but that might stretch the term. Maybe they mean causal efficacy without intention. 

  Next, the determinism worry. If we say climate is an agent, does that make human actions irrelevant? Not necessarily. Multiple causes can interact. A volcanic eruption causes a famine, but human responses can mitigate or worsen it. So efficacy doesn't equal inevitability. 

  Then there's "doing real work." This could mean causal contribution, explanatory salience, or responsibility. These aren't the same. A pathogen causes disease, but explaining the empire's collapse might focus on the administration's failure. Salience depends on the historian's question. 

  The candidate’s example: a cold snap causes harvest failure, leading to distress, and the administration bungles the response. The colleague sees the climate as a party to the outcome. But the candidate thinks the explanation lies in the administration's actions. Both can be right. The climate caused the initial problem, but the administration's failure made it a disaster. 

  Substantively, they might disagree on what drives historical change. If the colleague emphasizes environmental forces, while the candidate focuses on human decisions, that's a deeper methodological split. But if it's about terminology, agreeing on terms like "causal factor" versus "agent" could resolve it. 

  The worry about determinism seems unfounded. Recognizing environmental causes doesn't negate human agency; it's about interaction. For example, the pathogen spreads, but human actions shape the impact. 

  Finally, "doing work" needs disambiguation. In the schematic case, the pathogen causes disease (causal efficacy), but the administration's failure is salient for the historical outcome. Blame falls on humans, not the pathogen. So each aspect—efficacy, salience, responsibility—belongs to different parts of the explanation.
answer: |-
  Your conceptual snag arises from conflating three distinct philosophical dimensions: **causal metaphysics**, **explanatory pragmatics**, and **agential semantics**. Below, I dissect these layers, flagging key distinctions and resolving your specific queries. The core disagreement is partly verbal but reveals a substantive methodological divergence.

  ---

  ### **Core Distinctions**
  1. **Causal Efficacy vs. Agential Action**:  
     - *Causal Efficacy*: The capacity of an entity/event to produce effects (e.g., a volcano emitting ash *causes* crop failure).  
     - *Agential Action*: Requires intentionality, goal-directedness, and responsiveness to reasons (e.g., an administration *choosing* to hoard grain).  
     - **Red Herring**: Using "actor" for non-intentional entities is metaphorical unless agency is redefined (which risks equivocation).  

  2. **Explanatory Salience vs. Causal Contribution**:  
     - *Causal Contribution*: Any factor necessary in the causal chain (e.g., the pathogen *enabled* demographic collapse).  
     - *Explanatory Salience*: What historians foreground to answer *specific why-questions* (e.g., "Why did the empire fragment?" may foreground administrative failures over the pathogen).  

  3. **Determinism vs. Causal Influence**:  
     - *Causal Influence*: X shapes outcomes without rendering alternatives impossible (e.g., cold climate *constrained* harvests but didn’t dictate the administration’s response).  
     - *Determinism*: Claims outcomes were inevitable given prior states (a stronger, often unwarranted claim).  

  ---

  ### **Answers to Your Queries**
  #### **1. "Caused" vs. "Acted" – Metaphor or Substance?**
     - **"The eruption caused a famine"** asserts *causal efficacy*: The eruption was a necessary condition for the famine.  
     - **"The eruption acted"** implies *agential qualities* (intention, autonomy, "party-like" status). This adds no empirical content beyond causal efficacy—it’s a **metaphorical projection** of human traits onto non-intentional phenomena.  
     - *Substantive Difference*: Your colleague seeks ontological parity for human/non-human causes. But "actor" smuggles in connotations of *intentionality* that pathogens lack. If she means "non-human entities are *causal forces*," that’s defensible; if she means they "act" like humans, it’s a category error.  

  #### **2. The Determinism Worry: Equivocation?**  
     - **The Spectre**: Admitting pathogens as "actors" might *seem* to reduce humans to passive conduits.  
     - **Resolution**: This worry conflates:  
       - (a) *Causal pluralism* (multiple factors, including non-human ones, contribute to outcomes) and  
       (b) *Causal determinism* (human choices are physically predetermined).  
     - **Equivocation Exposed**:  
       - Non-human factors *shape* possibilities (e.g., cold climate narrows agricultural options) but do not *eliminate* human choices (e.g., the administration could have imported grain or distributed reserves).  
       - Your focus on the administration’s failure presupposes that humans *could have acted otherwise*—a position compatible with non-human causal influence.  
     - **Verdict**: The worry is unfounded unless one conflates *influence* with *inevitability*.  

  #### **3. "Did Real Work": Efficacy, Salience, or Blame?**  
     - **Causal Efficacy**: Yes, the pathogen *causally contributed* to mortality (without it, the outcome changes).  
     - **Explanatory Salience**: Context-dependent. If the question is "Why did population collapse?" the pathogen is salient. If it’s "Why did *this empire* collapse while others survived similar outbreaks?" administrative failure is salient.  
     - **Credit/Blame Apportionment**: Only applies to moral agents (e.g., we blame the administration for callousness, not the pathogen for existing).  
     - **Why They Come Apart**:  
       - In your schematic case:  
         - Pathogen: Causally efficacious (necessary precondition).  
         - Administration: Explanatorily salient (answers "why was *this* crisis catastrophic?"), and blameworthy (moral responsibility).  
       - Your colleague emphasizes efficacy; you emphasize salience and moral agency.  

  ---

  ### **Substantive Disagreement vs. Verbal Quibble**
  - **Merely Verbal**: If "actor" = "causal force," your disagreement collapses. But your colleague’s insistence that volcanoes are "parties" suggests she wants more: a *symmetry* between human and non-human causation that erases the distinction between *reasons* (governed by norms) and *causes* (governed by laws).  
  - **Substantive Disagreement**:  
    - **Her View Requires**: That intentionality is irrelevant to historical explanation; history is an interplay of forces (human and non-human) with no privileging of deliberation.  
    - **Your View Requires**: That history explains outcomes *as products of choices* (even if constrained), making human agency explanatorily irreducible.  
    - **What’s at Stake**: Whether history is a *humanistic* discipline (explaining actions via reasons/norms) or a *naturalistic* one (explaining events via causal laws).  

  ---

  ### **Resolution Path**
  1. **Clarify Terms**: Replace "actor" with "causal factor" for non-human entities. Acknowledge their *efficacy* but reserve "agency" for intentional beings.  
  2. **Embrace Explanatory Pluralism**: In "Why the famine?," the volcano is salient. In "Why the societal collapse?," administrative failure is salient.  
  3. **Reject False Dichotomies**: Non-human causes *constrain* human actions but don’t annihilate agency. A harvest failure *creates conditions* for famine; maladministration *turns it* into catastrophe.  

  Your intuition is correct: The administration is where *distinctively historical* explanation resides—not because climate/pathogens lack efficacy, but because **history’s subject is human worlds shaped by, and shaping, their environments**. Your colleague’s view, if radicalized, risks reducing history to environmental determinism; yours risks underplaying material constraints. A dialectical synthesis is possible: **Humans act; environments react; both are causes, but only humans are actors**.
