answer: |-
  **1. Countable Harm Test:** Ask: "Does the harm, in a single instance or cumulatively from recurrence (same source, same person), cause the affected person to notice, report, or change behavior?" Sufficient answer: "Yes" if exposure frequency exceeds a defined threshold (e.g., weekly) for recurrence or if inherently noticeable. A "yes" ends the inquiry for that harm, making it countable. Frequency thresholds are value-based; exposure data are factual.  

  **2. No-Amount Clause Test:** Ask: "Is there a countable harm causing severe, irreversible injury (e.g., burns requiring grafts, permanent disability)?" Sufficient answer: "Yes" if harm meets predefined severity criteria (e.g., medical intervention needed). A "yes" ends further trade-offs with sub-floor harms. Severity classification is value-based; injury extent is factual.  

  **3. Regulation Balance Test:** Ask: "If no severe harm exists, do monetized benefits of regulation (preventing countable harms) outweigh its costs (monetary costs plus new countable harms)?" Sufficient answer: "Yes" or "no" via standard cost-benefit analysis. If severe harm exists, skip to verdict. Monetary costs always count; valuation is value-based.  

  **4. Case Verdicts:**  
  - Case one (water odour): No countable harm (sub-floor, recurrence < threshold). Do not regulate.  
  - Case two (burns): Severe harm (burns) exists. Regulate despite added cost (floor does not apply to money).  

  **5. Limitations:** The procedure cannot resolve conflicts where severe harm exists but regulation causes extreme monetary costs (e.g., >1% GDP impact) or new severe harms. Hand back these files. Earliest warning: cost estimates exceeding predefined caps or borderline recurrence frequencies.
