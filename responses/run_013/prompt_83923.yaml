  **Bottom line:**  
  The finiteness of the encoding premium ensures that ideal agents eventually converge on the same truth for distinguishable hypotheses, supporting simplicity as an asymptotic guide to truth. However, the non-computability of the premium, combined with empirical equivalence, implies that simplicity comparisons are arbitrary and unstable for finite data, undercutting parsimony as an objective criterion for practical theory choice.

  ### Discussion  
  The invariance theorem’s finite encoding premium (i) guarantees that, for hypotheses distinguishable by data, the posterior odds ratio between two agents using different universal machines stabilizes after a finite settling time. This asymptotic agreement vindicates the ideal role of simplicity: in the limit, shorter programs (simpler hypotheses) dominate for truth-tracking. However, this relies on unbounded computation and data. Critically, the non-computability (ii) of the encoding premium means agents cannot know the settling time or bound prior differences for finite data. Thus, two agents may disagree arbitrarily on which hypothesis is simpler—and hence better-supported—early in inquiry. For empirically equivalent hypotheses, likelihoods cannot drive separation, so priors (and thus reference machines) alone determine posteriors. Here, simplicity is purely conventional: one agent’s "simpler" hypothesis may be another’s complex one, with no data able to resolve the conflict.  

  This undermines parsimony’s objectivity in scientific practice. Resource-bounded agents (e.g., scientists) face indeterminacy: they cannot compute whether their simplicity judgment reflects "true" Kolmogorov complexity or is an artifact of their uncomputable reference machine. Consequently, while simplicity aids convergence for ideal agents with infinite data, it cannot reliably guide theory choice under bounded resources. The non-computability also rules out any procedural fix, such as "averaging" over reference machines, since the premium is uncomputable. Philosophically, this shows that simplicity is reference-relative, not universally truth-conducive—especially for empirically equivalent or underdetermined hypotheses.  

