  Note on ordering: The first row is most important because empirical equivalence is a common scenario in science and the arbitrariness of the prior in that case is a fundamental limitation. The second row is next because non-computability directly affects the practical use of simplicity. The third row is a positive result but is asymptotic and for ideal agents. The rest follow.

