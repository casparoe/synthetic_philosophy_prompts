prompt: |-
  I'm a fourth-year PhD student in philosophy of science working on the foundations of inductive inference, and I need the most important implications of a particular pair of facts about the Solomonoff prior — not an exposition of the prior, and not a survey of the literature.

  Here is the setup I want you to work from. Fix two universal reference machines U and U′. The invariance theorem tells us that the ratio M_U(x)/M_U′(x) between the two priors is bounded above by a finite constant for every string x. Call that constant the encoding premium for the pair. Because the premium tracks a shortest-description length, it is not computable in general, so an agent cannot determine from the inside how far her prior is from a counterpart's. Now consider two agents who agree on everything except their reference machine — same hypothesis space, same likelihoods, same data — and two rival hypotheses h₁ and h₂. Define the settling time for h₁ versus h₂ as the number of observations after which the two agents' posterior odds for h₁ over h₂ agree to within a factor of two, assuming the data are generated by one of the two hypotheses and that they are eventually distinguishable. (If you think a different idealization of the comparison is more apt — for instance, comparing the agents' full posterior distributions rather than a single pair of odds — say so and use it instead.)

  My question: what are the most important implications of (i) the finiteness of the encoding premium and (ii) its non-computability, taken together with the further fact that hypotheses assigning identical likelihoods to every possible data sequence are never separated by any amount of data, for the claim that simplicity is a guide to truth and for how parsimony comparisons should be treated in the practice of theory and model choice? I am already persuaded of the invariance theorem, so do not re-derive it; I want the downstream consequences, including the ones that cut against the usual line that Solomonoff induction vindicates Occam's razor. Where an implication bites only for resource-bounded agents rather than ideal ones, or holds only under extra assumptions, flag that explicitly. No citations or reading suggestions are needed.

  Please open with a two-sentence bottom line, then present the discussion in prose, then close with a table whose rows are ordered from most to least important and whose columns are exactly these:

  - implication: the implication stated in one sentence.
  - premises: which of (i), (ii), or the empirical-equivalence fact it draws on.
  - scope: what it constrains — the ideal agent, the bounded agent, the working scientist, or the philosophical thesis.
  - rules_out: the position or practice it makes untenable, or "none" if it merely weakens one.
  - overreach: the tempting conclusion it does not license.
  - confidence: high, medium, or low, with a one-clause reason.
reasoning: |-
  We are given two facts: (i) the encoding premium (the constant bounding the ratio of priors from two different universal machines) is finite but (ii) non-computable. Also, we note that empirically equivalent hypotheses (same likelihoods for all data) cannot be separated by data. The question is about implications for the role of simplicity in guiding truth and for the practice of model choice.

  Bottom line in two sentences:
  The finiteness of the encoding premium ensures that, in the limit, the choice of reference machine does not affect which hypotheses are favored, supporting the objectivity of simplicity as a guide to truth. However, the non-computability of the premium, combined with empirical equivalence, implies that for finite data and resource-bounded agents, simplicity comparisons can be arbitrarily dependent on the reference machine and thus lack a firm foundation for practical model choice.

  Now, the detailed discussion:

  1. **Finiteness of the encoding premium (i) and convergence:**
     The invariance theorem (finiteness of the encoding premium) guarantees that the difference in log-priors for any string x between two universal machines is bounded by a constant (the encoding premium). This implies that as the data grows, the influence of the reference machine on the posterior odds of two hypotheses becomes negligible. Specifically, for two hypotheses h1 and h2 that assign different likelihoods to data sequences (so they are distinguishable in the limit), the settling time (the time after which the posterior odds agree within a factor of two) will be finite. This is because the prior ratio is bounded, and the likelihood ratios (under the true hypothesis) will eventually dominate. Thus, for ideal agents with infinite computing resources, the choice of reference machine does not affect the asymptotic convergence to the truth.

  2. **Non-computability of the encoding premium (ii) and practical uncertainty:**
     However, the encoding premium is non-comcomputable. This means an agent cannot know, for a given pair of reference machines, what the exact bound is. Moreover, for any finite data, the prior assigned to a hypothesis (which depends on the Kolmogorov complexity) can vary significantly between reference machines. Since the agent cannot compute the premium, she cannot adjust for it. Therefore, for finite data, the two agents (using U and U') may have very different posterior odds for h1 vs h2. The settling time might be very large and the agent cannot know when the posterior odds have stabilized. This is especially problematic for resource-bounded agents (including scientists) who must make decisions with finite data.

  3. **Empirical equivalence and the limits of discrimination:**
     The fact that two hypotheses with identical likelihoods for all data sequences cannot be separated by any data is a fundamental limitation. In such cases, the prior (and hence the choice of reference machine) completely determines the posterior. Since the encoding premium is non-computable and the prior ratio is bounded but arbitrary within that bound, two agents may have arbitrarily different beliefs about empirically equivalent hypotheses. This means that simplicity (as encoded by the prior) is the only criterion for choosing between such hypotheses, but the non-computability implies that the assessment of simplicity is machine-dependent and not objectively fixed.

  4. **Implications for simplicity as a guide to truth:**
     - For ideal agents: The finiteness of the encoding premium supports the view that simplicity (via the prior) is a guide to truth because it does not alter the asymptotic convergence to the truth. However, the non-computability does not affect the ideal agent in the limit because the likelihoods will eventually dominate. But note that for hypotheses that are not distinguishable (i.e., empirically equivalent), the prior is all that matters and the non-computability means that the choice of which simple hypothesis to prefer is arbitrary relative to the reference machine.
     - For bounded agents and scientists: The non-computability of the premium implies that simplicity comparisons are not robust. The same data may lead to different conclusions about which hypothesis is simpler (and thus better) depending on the reference machine. This undercuts the practical use of simplicity as a guide to truth in finite settings. Moreover, since the agent cannot compute the Kolmogorov complexity, she must rely on heuristics (like short programs) which may not reflect the true complexity.

  5. **Practice of model choice:**
     The non-computability of the encoding premium implies that the working scientist cannot determine if a particular simplicity-based model choice is stable across reasonable reference machines. Thus, parsimony comparisons should be treated with caution. They should not be taken as objective truth-guiding without a lot of data (which we typically don't have) and without knowing that the hypotheses are empirically distinguishable. In the case of empirically equivalent hypotheses, the use of simplicity is entirely conventional and not truth-conducive in any objective sense.

  6. **What it rules out:**
     - The idea that simplicity is an objective and universally valid criterion for model choice in finite samples. The non-computability and the empirical equivalence fact show that simplicity is reference-machine relative and thus not a fixed standard.
     - The idea that two scientists using different reference machines will converge quickly in their views. The settling time might be very long and cannot be bounded by the agent.

  7. **Tempting conclusions to avoid:**
     - That because the invariance theorem holds, simplicity is a robust and practical guide for model choice in science. The non-computability and the potential for empirical equivalence mean that it is not.
     - That the Solomonoff prior provides a unique and objective prior for induction. It does, but only up to a non-computable constant, which makes it unusable in practice.

