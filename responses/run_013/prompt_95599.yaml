  Key breakdown points to highlight: 
  The circularity: "Unwanted effect" → but "wanted" depends on the task's purpose → which the AI must interpret. 
  Baseline ambiguity: Is "no action" the default? What if humans were already acting? 
  The human-copout question: Asking humans works only if they agree and respond fast—which fails in emergencies. 

