  ### Interactive Flowchart: The Wrong-Kind-of-Reasons Problem  
  **Anchoring Case**: A demon promises lavish rewards if and only if you admire him. You agree this gives *some* reason to admire him but not the kind that makes him admirable. This flowchart sorts your view of why it fails.  
  **New Diagnostic Case (The Trickster)**: A being offers a reward if and only if you admire her *for reasons unrelated to the reward itself*. If you admire her because of the reward, you forfeit it.  

  ---

  #### DECISION TREE  
  **Start here**  
  **Q1: Does the demon’s promise give you a reason to admire the demon?**  
  - *No* → **Leaf 1: No Reason**  
    The promise isn’t a reason for admiration at all. The problem dissolves.  
  - *Yes* → **Q2**  

  **Q2: Is the fitting-attitude analysis correct? (Being good = being fitting to admire.)**  
  - *No* → **Q3**  
  - *Yes* → **Q4**  

  **Q3: Is the demon’s reason the same *kind* as reasons that make things admirable?**  
  - *Yes* → **Leaf 2: Fitting-Attitude Collapse**  
    Right/wrong-kind reasons aren’t distinct. The analysis fails (it would make the demon good).  
  - *No* → **Q5**  

  **Q5: Is value an unanalyzable primitive property?**  
  - *Yes* → **Leaf 3: Value Primitivism**  
    Goodness can’t be reduced to fitting attitudes. The analysis was always flawed.  
  - *No* → **Leaf 4: Alternative Value Analysis**  
    Value exists but is analyzed independently (e.g., in terms of natural properties).  

  **Q4: Is the demon’s reason a reason *for admiration itself*?**  
  - *No* → **Leaf 5: Reason for Something Else**  
    The promise is a reason to *want* or *cause* admiration, not to admire.  
  - *Yes* → **Q6**  

  **Q6: In the Trickster case, does her promise give you a reason to admire her?**  
  - *No* → **Leaf 6: State-Focused Reasons**  
    The reason concerns the *state* of having admiration (its rewards), not the *object* (the being).  
  - *Yes* → **Leaf 7: Constitutive Question View**  
    The reason doesn’t bear on the question admiration answers (“Is this admirable?”).  

  ---

  #### LEAF DESCRIPTIONS  
  1. **No Reason**: The promise provides no reason to admire. No further puzzle.  
  2. **Fitting-Attitude Collapse**: Wrong-kind reasons *are* reasons for admiration, so the analysis fails (it implausibly makes the demon good).  
  3. **Value Primitivism**: Goodness is basic. It was a mistake to analyze it via fitting attitudes.  
  4. **Alternative Value Analysis**: Value is real but defined without reference to attitudes (e.g., as pleasure, perfection, or desire).  
  5. **Reason for Something Else**: The promise is a reason to *seek* or *induce* admiration, not to hold the attitude itself.  
  6. **State-Focused Reasons**: Reasons target the *attitude’s consequences* (e.g., rewards), not the *object’s properties*. Thus, they can’t make the object admirable.  
  7. **Constitutive Question View**: Reasons must address the attitude’s core question (e.g., admiration asks “Is this admirable?”). The promise doesn’t.  

  ---

  #### NOTES  
  - **Unoccupied Branches**:  
    - *Q2 → Yes + Q4 → Yes + Q6 → No coherent branch*: If the reason is for admiration *and* the analysis holds, but it doesn’t make the demon good, the only consistent exits are Leaf 6 or Leaf 7. A "yes" at Q4 + Q6 that *endorses* the demon’s admirability is incoherent (you already denied this).  
  - **Verbal Overlap**:  
    - **Leaf 6 (State-Focused) and Leaf 7 (Constitutive Question)** may reflect the same underlying idea: both deny the reason bears on the object’s admirability. They are separated here for diagnostic clarity but may collapse in practice.  
  - **Diagnostic Sharpening**:  
    The **Trickster case** (Q6) tests if a reason can *exist* while being self-undermining. If you answer "no," you likely see wrong-kind reasons as intrinsically flawed (Leaf 6). If "yes," you see them as genuine but irrelevant to admirability (Leaf 7).  

  ---  
  **Use this tree**: Start at Q1. Answer based on your intuition, not theory labels. Proceed until you reach a leaf. The leaf describes your solution to the wrong-kind problem.
