  - Agglomeration: If you believe p and believe q, it seems you should believe both together. Otherwise, belief isn't closed under conjunction, which might seem odd.

  - Holding many independent beliefs: I believe the sky is blue, grass is green, etc., each with less than near-certainty.

  The contradiction shows one must go.

  I think the most common response to the lottery paradox is to reject agglomeration. That is, belief isn't closed under conjunction. So you can believe each ticket loses but not believe all lose together.

