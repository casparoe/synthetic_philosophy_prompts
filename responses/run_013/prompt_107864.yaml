  2. Credences are coherent, meaning they obey probability rules.

  3. Belief agglomerates: believing p and q means believing (p and q).

  In the lottery case with 100 tickets and t=0.9, for each ticket, you have 0.99 credence it loses, so you believe each one loses (since 0.99 > 0.9). By agglomeration, you believe all lose. But your credence all lose is 0 (since one wins), which contradicts the threshold rule requiring credence >0.9 for that belief.

  The general result is that for independent beliefs, the product of credences must exceed t for the conjunction to be believed, which forces each credence to be very high if there are many beliefs. For example, with 1000 beliefs at t=0.9, each must be about 0.9999 or something. That seems unrealistic; I believe many things without such high confidence.

  Similarly, in the preface case, believing each claim but also believing at least one is false leads to contradiction via agglomeration.

  I don't like the "ceiling" on how many things I can believe. I'm attached to having coherent credences and believing many things, so I need to drop one part: the threshold rule, coherence, agglomeration, or that I hold many rational independent beliefs.

  I need to choose which to reject and explain why it seemed obvious and what it costs. Also, whether the fix works for both paradoxes.

  First, let's recall why each part might seem obvious:

