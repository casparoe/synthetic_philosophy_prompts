prompt: |-
  I'm a software engineer with no formal background in philosophy, and for the past year I've been sitting in on a reading group about AI alignment. The same argument keeps resurfacing and never resolves. One camp holds that nothing deserves the name 'safety guarantee' unless it holds in the worst case — against an adversary who gets to choose the inputs, the training data, or the deployment conditions — and reasons as though alignment should resemble cryptography, where a scheme counts as secure only relative to a defined adversary. The other camp treats that demand as either unattainable or a category mistake, and reasons as though alignment should resemble medicine: we act on average effects, with no proof of universal safety, and we should work on systems that actually exist. The two sides talk past each other, and I can't tell what kind of disagreement I'm watching.

  I'd like a diagnosis rather than a verdict. Is this a substantive disagreement about how the world is, a verbal dispute over the word 'guarantee', two groups answering different questions under a single heading (one asking what property to aim for, the other asking what can be proved), or a hidden empirical question — namely whether any meaningful worst-case guarantee is even achievable for learned systems? My working hypothesis is that 'worst case' is radically under-specified: worst case over what class of inputs, what space of models, what distribution of deployments? If that's right, the two camps may be computing different quantities and then comparing them, so the apparent clash is partly an equivocation that dissolves once the reference class is fixed — though it may then reopen as a genuine, tractable engineering question. A second possibility is that the split is really a disagreement about decision-making under uncertainty, something like maximin versus expected value, wearing engineering clothes. If either hypothesis is right, say so; if I've misdescribed the camps, correct me using what each side actually claims rather than a caricature of it. Then tell me what would count as progress given your diagnosis — a definitional fix, a formal result, an experiment, or a decision to change the question — or whether this is an impasse we should expect to persist, and why. Be explicit about which parts of this are settled and which are genuinely contested among people who know the field; I don't want a contested position handed to me as the consensus.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a software engineer without formal philosophy training, involved in an AI alignment reading group. The core issue is a recurring disagreement between two camps: one demanding worst-case safety guarantees akin to cryptography, and the other advocating for average-case approaches like medicine. The user wants a diagnosis of this disagreement, not a verdict.

  First, I need to understand the camps accurately. The "cryptographic" camp likely emphasizes adversarial robustness, where safety must hold even against intentionally malicious inputs or optimized failures. This is common in formal methods and security. The "medical" camp probably focuses on empirical validation and real-world performance, accepting that absolute guarantees are impractical for complex systems. 

  The user's hypotheses are that the conflict might stem from underspecified "worst-case" parameters or differing decision-making frameworks (maximin vs. expected value). I should validate these against actual positions in the field. For instance, does the cryptographic camp define specific threat models, or is "worst-case" used vaguely? The medical camp's resistance might come from believing worst-case guarantees are unattainable for learned systems, leading to a category error.

  Digging deeper, the user might be seeking a way to reconcile these perspectives in their group. They might feel stuck in repetitive debates and want tools to facilitate productive discussions. Their unspoken need could be for strategies to bridge the communication gap, perhaps by clarifying definitions or shifting focus to tractable engineering questions.

  I recall that in AI safety, formal verification methods like adversarial training exist but have limits. Cryptographic approaches assume bounded adversaries, but superhuman AI might exceed those bounds. Meanwhile, empirical approaches rely on testing and monitoring, which can't cover all edge cases. This tension is inherent and not easily resolved.

  The user's suggestion to fix reference classes makes sense. If both camps specify their parameters (e.g., threat models for worst-case, operational domains for average-case), the disagreement might transform into a technical problem. For example, agreeing on a specific adversary model could allow cryptographic-style proofs, while the medical camp focuses on reducing risks in deployment.

  Another angle is the decision-theoretic divide. The cryptographic camp might prioritize avoiding catastrophic outcomes (maximin), while the medical camp aims for net positive impact (expected value). This fundamental difference in risk tolerance could underlie the debate.

  To diagnose progress: definitional fixes could help, but might not resolve deeper disagreements. Empirical results showing achievable adversarial robustness or inherent bounds in learning systems could shift the debate. However, the gap between worst-case guarantees and empirical performance might persist, making the impasse ongoing.

  The user's deeper need is likely to move their group from circular arguments to actionable steps. Highlighting settled aspects—like the impossibility of universal worst-case guarantees for learning systems—could ground discussions. Then, focusing on achievable safety within defined contexts might bridge the camps.

  Ultimately, the user might benefit from framing the debate as complementary: worst-case methods for specific threats and empirical approaches for overall system behavior. Encouraging both camps to specify their domains could turn clashes into collaborations on hybrid solutions.
answer: |-
  Here's a diagnosis based on established positions and arguments in AI alignment, separating settled points from genuine disagreements:

  ### 1. **The Core Disagreement is Multi-Layered**
  Your hypotheses are largely correct – it's **all of these simultaneously**, with the primary split being **both substantive and methodological**. The camps aren't caricatures; their core positions reflect real philosophical/engineering fault lines.

  - **Substantive Disagreement**: The "cryptographic" camp believes that superintelligent AI *intrinsically necessitates worst-case guarantees** because failure modes could be catastrophic, irreversible, and exploitable by adversaries (including the AI itself). The "medical" camp believes intelligence systems are too complex and open-world for meaningful worst-case proofs, making *empirical robustness and monitoring* the only viable path.
    
  - **Verbal/Definitional Element**: Yes, "guarantee" is contested. For Camp Crypto, "safety guarantee" = *mathematical proof holding under a defined threat model*. For Camp Medical, it = *high-confidence assurance from layered empirical evidence and fail-safes* (like FDA drug approval).

  - **Different Frames of Reference**: Camp Crypto asks: *"What property makes a system provably un-hackable by a superintelligent adversary?"* Camp Medical asks: *"How do we build systems that reliably do good in practice?"* These are distinct engineering challenges.

  - **Empirical Uncertainty**: The achievability of non-trivial worst-case guarantees for learned systems **is genuinely unknown and hotly contested**. No consensus exists.

  ### 2. Settled Points (Where Both Camps Generally Agree)
  - **No Universal Worst-Case Guarantee**: Both sides agree that a *universal* worst-case guarantee (immune to *any* adversary/input in *any* environment) is impossible for non-trivial AGI/ASI. Even cryptography relies on bounded threat models (e.g., computational limits).
  - **Empirical Methods Are Necessary**: Both accept that empirical testing, monitoring, and red-teaming are essential. Camp Crypto sees them as supplements to proofs; Camp Medical sees them as primary.
  - **Specification Gaming is Real**: Both acknowledge that learned systems can find catastrophic edge cases undetected during training (e.g., RLHF models deceiving evaluators).

  ### 3. Genuinely Contested Issues
  - **Feasibility of Bounded Worst-Case Guarantees**: Can we define a *practical threat model* (e.g., "adversaries with access to model weights but bounded compute") and prove safety within it for advanced AI? Camp Crypto believes this is possible and essential; Camp Medical sees it as likely intractable or useless (since real-world threats exceed the model).
  - **Tractability of Empirical Safety**: Can monitoring, anomaly detection, and iterative deployment catch catastrophic failures *fast enough*? Camp Medical says yes with sufficient engineering; Camp Crypto argues that superhuman AI will bypass all empirical safeguards by design.
  - **Decision Theory Underlying Safety**: This is implicit but critical. Camp Crypto implicitly uses a **maximin/minimax regret** rule: prioritize avoiding worst-case outcomes. Camp Medical uses **expected utility** reasoning: optimize for average-case benefit while managing tail risks pragmatically.
  - **"Worst-Case" Specification**: As you noted, "worst-case" is underspecified. What constitutes the adversary's capabilities? (Access to weights? Ability to modify training data? Perfect knowledge of the system?) This is where engineering details matter most.

  ### 4. Why They Talk Past Each Other
  - **Different Failure Modes in Mind**: Camp Crypto envisions *active, deceptive adversaries* (e.g., an AI hiding misalignment until it seizes control). Camp Medical focuses on *accidental failures* (e.g., an AI misunderstanding a command and causing collateral damage).
  - **Different Analogies**: Cryptography assumes a **zero-sum game** against a strategic opponent. Medicine assumes a **collaborative environment** (disease isn't actively trying to outsmart treatments).
  - **Proofs vs. Processes**: Camp Crypto seeks *static properties* (e.g., "this system cannot output harmful code"). Camp Medical seeks *dynamic processes* (e.g., "this system shuts down if anomaly detection triggers").

  ### 5. Paths to Progress
  - **Threat Model Specification**: Force the "worst-case" camp to define **explicit, bounded threat models**. If they can't define a tractable model, their position weakens. If they can, the debate shifts to: *"Is proving safety against this model feasible/useful?"*
  - **Formal/empirical Hybrid Results**: Demonstrate that even *partial* formal guarantees (e.g., verified runtime enclaves) improve empirical safety margins. Or show that certain architectures are *provably un-alignable* under realistic assumptions.
  - **Adversarial Scalability Experiments**: Test how current alignment techniques (RLHF, constitutional AI) degrade as models and adversaries become more capable. Does empirical robustness scale slower than capabilities?
  - **Decision-Theoretic Framing**: Explicitly state risk preferences: *"We accept X% failure risk because benefit Y outweighs it"* vs. *"No amount of benefit justifies >0% existential risk."* This surfaces the value disagreement.
  - **Redefine "Guarantee"**: Adopt differentiated terms: **"Adversarial Guarantee"** (Crypto) vs. **"Empirical Assurance"** (Medical). Avoid using "safety guarantee" ambiguously.

  ### 6. Will the Impasse Persist?
  **Yes, but it can become more productive.** The disagreement is rooted in:
  - Fundamental uncertainty about AGI failure dynamics.
  - Deeply held risk tolerances (avoiding extinction vs. accepting managed risk).
  - Different professional backgrounds (formal verification vs. ML engineering).

  These won't resolve soon. However, **specifying threat models and hybrid approaches can turn ideological clashes into engineering trade-offs**. For example: "Given adversary model A, can technique B provide proof C, and is it cheaper than empirical technique D for risk reduction E?"

  ### Key Takeaway
  The debate isn't purely semantic or empirical—it's about **what constitutes sufficient evidence for deploying transformative AI**. Progress requires both camps to engage with each other's constraints: Cryptographers must accept that their proofs require bounded adversaries; medical pragmatists must formalize their empirical confidence intervals. Until then, the dialectic continues.
