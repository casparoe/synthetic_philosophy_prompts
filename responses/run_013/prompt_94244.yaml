       - Explain the formula: a principle is one that no one can reasonably reject.
       - Highlight the aggregation problem: the group couldn't add up the small harms of the pothole victims to outweigh the large harm of the dam victim because each delegate could only consider the harm to their own group relative to the harm to others individually.
       - Distinguish the aggregation problem from the separate issue of whether numbers count: 
          - Aggregation problem: we cannot sum small harms to outweigh a large harm because the test is applied individually.
