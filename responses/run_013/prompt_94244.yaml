  - We define: Death = 10 harm units.
  - A broken arm = 0.3 harm units (so each pothole victim suffers 0.3, and each Pothole Delegate's group suffers 5 * 0.3 = 1.5 harm units).

  **Policies:**
  - Policy A: Fix the dam, don't fix the potholes.
    - Dam victim: 0 harm (saved).
    - Each pothole group: 1.5 harm (5 broken arms).
  - Policy B: Fix the potholes, don't fix the dam.
    - Dam victim: 10 harm (dies).
    - Each pothole group: 0 harm (saved).

  **Rules of the Activity:**
  - A policy is adopted only if no delegate can reasonably reject it.
  - To reject a policy, a delegate must argue that the harm to their claimant(s) under that policy is unreasonable compared to the harm that would be imposed on others under an alternative policy.
  - The group must try to find a policy that no one reasonably rejects.

  **Timeline (90 minutes):**

  1. **Introduction and Role Assignment (5 minutes):**
     - Facilitator explains the scenario and the two policies without mentioning contractualism or the aggregation problem. Just the facts: the town can only do one, and the effects of each policy.
     - Assign roles: one Dam Delegate, ten Pothole Delegates. Hand out index cards with the role and the harm their claimant(s) would suffer under each policy.

  2. **Individual Preparation (5 minutes):**
     - Each delegate reads their card and considers:
       - What harm their claimant(s) face under Policy A and Policy B.
       - Which policy they would prefer and why.
       - Whether they can reasonably reject either policy.

  3. **Group Discussion and Policy Deliberation (40 minutes):**
     - Facilitator writes the two policies on the whiteboard.
     - Delegates present their positions. Each delegate gets 1-2 minutes to state their case.
     - Then open discussion: delegates try to agree on a policy that no one can reasonably reject.
     - Facilitator moderates and ensures everyone speaks. The facilitator also reminds the group of the rule: a policy can be blocked if any delegate reasonably rejects it.

  4. **Voting and Decision (10 minutes):**
     - The facilitator calls for a test of reasonable rejection for each policy.
       - For Policy A: "Does any delegate reasonably reject Policy A? If so, why?"
       - For Policy B: same.
     - If a policy has no reasonable rejections, it is adopted. If both have rejections, then the group must reconsider or deadlock.

