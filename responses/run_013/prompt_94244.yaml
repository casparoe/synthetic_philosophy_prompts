  **Title:** The Dam and the Potholes: A Contractualism Simulation

  **Goal:** To experience the aggregation problem in Scanlon's contractualism.

  **Participants:** 12 people. We assign:
  - 1 person as the Dam Delegate (representing the one person who would die if the dam fails).
  - 10 people as Pothole Delegates (each representing 5 people who would each break an arm in a pothole accident if the potholes are not fixed). So 50 people represented in total.
  - 1 person as the Facilitator.

  **Materials:**
  - Index cards for each delegate (with their role and the harm their claimant(s) face under each policy).
  - A whiteboard to write the two policies and for voting.
  - Sticky notes for delegates to write their arguments.

