          - The Dam Delegate could reasonably reject Policy B because 10 > 1.5 (the harm to any Pothole Delegate under Policy A) and because there's no one else facing a harm as big as 10 under Policy A? But note: the harm to the Dam Delegate under Policy B is 10, and the harm to a Pothole Delegate under Policy A is 1.5. So the Dam Delegate can say: "Why should I bear 10 units of harm when each of you is only bearing 1.5? That's not fair." But the Pothole Delegates together are bearing 15, but that's not considered.

  6. **Wrap-up (5 minutes):**
     - Summarize the key takeaway: contractualism's individualistic test leads to the aggregation problem, which can result in outcomes that seem to ignore the total amount of harm.

  **Predictable Problems and How to Handle Them:**

  1. **Problem:** The group might try to aggregate the harms (e.g., the pothole delegates might form a coalition and say together they represent 15 units of harm). 
     - **Handling:** The facilitator must enforce the rule: each delegate must consider only their own burden and whether it is reasonable compared to the burden on any single other delegate under the alternative. They cannot pool their harms. Remind them: "Remember, you are only representing your own group. Can you, as one delegate, reasonably reject the policy based on the harm to your group alone?"

  2. **Problem:** The group might deadlock (both policies get rejected by someone). 
     - **Handling:** The facilitator should point out that if no policy is without reasonable rejection, then the group fails to adopt a policy and the town does nothing? That might be an outcome. Then discuss why that happened.

  3. **Problem:** The group might ignore the rules and just vote by majority. 
     - **Handling:** The facilitator must remind them that the rule is unanimity in the sense of no reasonable rejection. They are not voting for the best overall outcome but for a policy that no one can reasonably reject.

  4. **Problem:** The harm units might be confusing or controversial (e.g., is a broken arm really 0.3 of a death?).
     - **Handling:** The facilitator should explain that the units are just a tool to make the trade-offs clear. The key is the relative harm per group. The numbers are set to illustrate the problem.

  **What the Activity Can't Reproduce:**
  - The activity simplifies the moral reasoning by assigning harm units. In real life, we don't have such units, and the comparison of harms is more complex. Also, the activity forces the delegates to think only about their own group. In reality, people might have broader moral concerns. The activity cannot fully capture the philosophical depth of what makes a rejection reasonable. In the debrief, you'll have to explain that in Scanlon's view, reasonable rejection is based on the reasons that individuals have, and that these reasons are not just about the magnitude of harm but also about fairness, rights, etc. The activity focuses on the aggregation problem, but Scanlon's framework is richer.

  **Debrief Structure:**
  1. Ask participants to describe what happened and how they felt.
  2. Highlight the moments where the aggregation problem appeared (e.g., when a Pothole Delegate wanted to add up the harms but couldn't).
  3. Explain the two concepts: the aggregation problem (the structure of the test) and the separate issue of how to weigh different types of harm (which the activity also touched upon with the harm units).
  4. Connect to Scanlon: the activity showed why the contractualist formula leads to the aggregation problem, and how that might conflict with utilitarian thinking.

  This activity should make the aggregation problem tangible and memorable.
answer: |-
  Below is a detailed 90-minute activity designed to make Scanlon's aggregation problem viscerally tangible for your group. It uses your core idea of delegates representing claimants but refines it to force direct engagement with the "no reasonable rejection" test and the tension between individual vs. aggregated harms. The activity avoids lectures upfront, as requested, and uses minimal materials (index cards, sticky notes, a whiteboard).

  ---

  ### **Activity Title: The Lifesaver Protocol**  
  *Premise:* A city faces two disasters. Delegates must agree on a policy to avert one disaster, governed by Scanlon's rule: **"A policy passes only if no delegate can reasonably reject it."**

  ---

  ### **Materials**  
  1. **Index cards (13):** 12 role cards + 1 facilitator card.  
  2. **Sticky notes (1 pad):** For delegates to write rejection arguments.  
  3. **Whiteboard:** To track policies, rejections, and harms.  
  4. **Timer:** For strict timekeeping.  

  ---

  ### **Roles & Payoffs**  
  Assign roles randomly. Each delegate protects one claimant but understands the *entire* scenario. Adjust claimant numbers to fit your 12 participants:  

  | **Role**               | **Claimant Harm**                                                                                               | **Harm Units** (Simplified for comparison) |  
  |------------------------|----------------------------------------------------------------------------------------------------------------|------------------------------------------|  
  | **Bridge Delegate**    | One person will die in a bridge collapse unless saved.                                                         | Death = 10 "harm units" (e.g., loss of life, emotional trauma). |  
  | **Pothole Delegates**  | 10 people (each delegate represents 1 person). Each faces a minor injury (broken finger) if potholes aren’t fixed. | 1 "harm unit" per person (e.g., pain, medical costs, lost wages). |  
  | **Facilitator**        | Runs the activity, enforces rules, and tracks time. Does not vote or deliberate.                               |                                          |  

  **Policy Choices:**  
  - **Policy A:** Save the bridge victim (no harm to them; all pothole victims suffer broken fingers).  
  - **Policy B:** Fix the potholes (no harm to pothole victims; bridge victim dies).  

  **Harm Totals:**  
  - Policy A total harm: 10 harm units (all pothole claimants).  
  - Policy B total harm: 10 harm units (bridge claimant).  
  *Why this balance?*  
  - Forces the group to confront *distribution* (one big harm vs. many small ones), not total harm.  
  - The equal total harm eliminates the utilitarian "greater good" argument, isolating the aggregation problem.  

  ---

  ### **Timeline (90 Minutes Total)**  
  *(Facilitator keeps strict time; delegates stand during debates to maintain energy.)*  

  #### **Phase 1: Setup (10 min)**  
  - **0–5 min:** Assign roles. Hand index cards explaining harms. *Example Bridge card:* "Your claimant dies under Policy B. Harm: 10 units." *Pothole card:* "Your claimant breaks a finger under Policy A. Harm: 1 unit."  
  - **5–10 min:** Silent prep. Delegates read cards and write:  
    - *Sticky note 1:* "Which policy can I **reasonably reject**? Why?"  
    - *Sticky note 2:* "What burden does **my claimant** bear under the other policy?"  

  #### **Phase 2: Deliberation & Rejection (45 min)**  
  - **10–20 min:** **Individual cases.** Each delegate has 60 seconds to state:  
    - Their claimant’s harm under each policy.  
    - Which policy they reject and why it’s "unreasonable" for their claimant.  
    - *Facilitator writes key arguments on whiteboard.*  
  - **20–35 min:** **Open debate.** Delegates negotiate. Focus: Can they find a policy no one rejects? Rules:  
    - Delegates must frame rejections in terms of *their claimant’s burden* (e.g., "My claimant loses a finger—isn’t that unreasonable when Policy B saves them?").  
    - **No aggregation allowed:** Delegates cannot say "our 10 harms outweigh 1 death." They can only compare *individual* burdens (e.g., "My 1 harm vs. your 10 harm").  
  - **35–45 min:** **Rejection vote.** Facilitator tests each policy:  
    - "Who reasonably rejects Policy A? State your case." Delegates voice rejections.  
    - Repeat for Policy B.  
    - *If both policies are rejected*, delegates must propose a new policy or concede deadlock.  

  #### **Phase 3: Decision & Consequences (15 min)**  
  - **45–55 min:** **Final choice.** If no policy has unanimous non-rejection, deadlock occurs. If one passes, it "wins."  
  - **55–60 min:** **Outcome revealed.** Facilitator announces:  
    - *If Policy A passes:* Bridge victim saved; all pothole claimants suffer harm.  
    - *If Policy B passes:* Pothole claimants saved; bridge victim dies.  
    - *If deadlock:* Both disasters happen.  

  #### **Phase 4: Structured Debrief (30 min)**  
  *(Key: Map the experience to Scanlon’s theory and disentangle aggregation from "numbers" confusion.)*  

  1. **Feelings first (5 min):**  
     - Ask: *"How did it feel to argue for your claimant? Was the outcome fair? Why?"*  
     - *Surface tension:* Pothole delegates feel powerless; Bridge delegate feels targeted.  

  2. **Identify the wall (10 min):**  
     - Ask: *"Why couldn’t the pothole delegates team up? What rule blocked you?"*  
     - Highlight: **The "no reasonable rejection" test forced one-on-one comparisons.** Point to whiteboard notes showing delegates comparing "my 1 harm vs. your 10 harm."  
     - Reveal: *"This is Scanlon’s aggregation problem: You couldn’t add small harms together to counter a large harm because the test is applied individually."*  

  3. **Clarify the confusion (10 min):**  
     - Distinguish on whiteboard:  
       - **Aggregation Problem:** *Structural flaw in Scanlon’s test.* Can’t combine small burdens (e.g., 10 broken fingers) to reasonably reject a policy that imposes a large burden (1 death).  
       - **Numbers Question:** *Moral debate.* Do 10 minor harms *ever* outweigh 1 major harm? (e.g., "Is 10 broken fingers worse than 1 death?").  
     - Point to gameplay:  
       - Aggregation surfaced when pothole delegates were **silenced individually** ("My 1 harm isn’t enough to reject Policy A").  
       - Numbers arose when delegates **secretly thought** "But 10 harms should matter more!" but couldn’t express it.  

  4. **Connect to Scanlon (5 min):**  
     - Emphasize: *"Scanlon’s formula isn’t about totals—it’s about whether each person’s burden, alone, is reasonable compared to others’. Today, you experienced why that blocks aggregation."*  
     - Contrast with utilitarianism: *"Unlike adding up harms, Scanlon protects individuals from being sacrificed for the group."*  

  ---

  ### **What Will Go Wrong (and How to Handle It)**  
  1. **Problem: Delegates aggregate instinctively.**  
     - Pothole delegates will try to say, "Together, our 10 harms beat 1 death!"  
     - *Handle it:* Intervene immediately: "Stop. Remember, you’re one delegate. Can you alone reasonably reject Policy A? Compare your claimant’s 1 harm to the bridge claimant’s 10 harm."  

  2. **Problem: The Bridge delegate dominates.**  
     - Their harm is dramatic; others may concede too easily.  
     - *Handle it:* Prep pothole delegates in silence phase: "Your claimant’s harm is real—fight for them." Remind during debate: "Policy A gives your claimant a broken finger—is that reasonable to accept?"  

  3. **Problem: Deadlock frustration.**  
     - If no policy passes, delegates may feel the exercise is pointless.  
     - *Handle it:* Use this in debrief! *"Deadlock is a feature—it shows Scanlon’s test can paralyze decisions with competing individual claims."*  

  4. **Problem: Harm units feel artificial.**  
     - Someone may argue, "You can’t compare death to a broken finger!"  
     - *Handle it:* Acknowledge it: "Yes, comparing harms is hard—but Scanlon requires it. Focus on why the *structure* blocked you, not the numbers."  

  ---

  ### **What the Activity Can’t Do (Supply This in Debrief)**  
  - **Capture "reasonableness" depth:** Scanlon’s "reasonable rejection" involves nuanced moral reasoning (e.g., fairness, rights). The activity simplifies it to harm units. *In debrief, say:* "Scanlon isn’t just about harm size—it’s about whether a burden is *justifiable*. Today focused on harm to expose aggregation; real-world rejections involve broader reasons."  
  - **Simulate real-world consequences:** The stakes are abstract (harm units). *In debrief, note:* "In reality, a broken finger affects a life. Scanlon cares about this—but his test still prevents adding them up."  

  ---

  ### **Why This Works**  
  - **The wall is real:** Delegates *feel* powerless as pothole claimants ("My harm isn’t enough!") and isolated as the bridge claimant ("Everyone’s against me!").  
  - **Distinction becomes clear:** The gameplay forces aggregation (structural) and numbers (moral) apart. Pothole delegates see how Scanlon’s test silenced them *individually* even though they sensed the group’s total harm mattered.  
  - **Pub-friendly:** Roleplay leans into your group’s camaraderie. The "disaster" framing adds stakes without melodrama.  

  **Final Tip:** Start cold—no Scanlon prep. Let them wrestle in the dark. When you debrief, watch for the "aha" when they realize they’ve been in Scanlon’s machine all along. Good luck!
