  We are going to design an activity that simulates Scanlon's contractualism and highlights the aggregation problem. The central idea is to have participants act as delegates representing individual claimants in a scenario where they must agree on a rule (policy) that no delegate can "reasonably reject." The scenario will involve a situation where a large number of people each suffer a small harm, and one person suffers a large harm. The aggregation problem will emerge when the group must decide whether to prevent the large harm or the many small harms.

