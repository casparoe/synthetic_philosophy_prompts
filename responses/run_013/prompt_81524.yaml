answer: |-
  Here’s a comprehensive exam design addressing all your requirements, including a provocative question, model answer, and detailed marking scheme:

  ### Essay Question
  **"Adam Smith’s critique of empire was merely a complaint about British mismanagement, not a fundamental rejection of colonial monopolies." Critically evaluate this claim using Smith’s analysis in *Wealth of Nations*.**

  ---

  ### Model Answer (650 words)
  Smith’s opposition to empire was neither simplistic rejection nor mere frustration with administrative incompetence. His critique targeted the *structural logic* of colonial monopolies, revealing their self-defeating economics for Britain, while acknowledging nuanced exceptions like the Navigation Acts. His proposed remedies further demonstrate a systemic diagnosis, not just managerial dissatisfaction.

  **First, Smith’s core argument hinges on the monopoly’s distortion of capital allocation and its boomerang effect on Britain.** Colonial trade monopolies artificially inflate profits in the protected sector, drawing excessive British capital away from other trades (e.g., European commerce, domestic manufacturing). This capital surge into colonial ventures lowers returns *within the colony trade itself* due to intensified competition among British investors. Crucially, the *monopoly price* of colonial goods (e.g., sugar, tobacco) is passed to British consumers, effectively acting as a hidden tax. Thus, Britain pays twice: once through inflated prices, and again via diminished overall national profits as capital flees lower-return, unsubsidized sectors. Smith’s point isn’t that colonies suffer most, but that Britain sabotages its *own* wealth creation by disrupting market-determined capital flows.

  **Second, Smith’s qualified defense of the Navigation Acts underscores his prioritization of security over pure efficiency—a deliberate exception proving his systemic rigor.** He concedes that forcing colonial trade through British ships (despite higher costs) is justified *only* because naval power depends on a robust merchant marine. This is not hypocrisy but a Hobbesian trade-off: national defense is the prerequisite for all commerce. By accepting this inefficiency, Smith sacrifices laissez-faire purity to preserve the state’s foundational role in enabling markets. His consistency lies in admitting that defense spending—unlike empire—is a genuine "public good" markets can’t self-supply. The exception highlights that his opposition to monopolies isn’t absolute dogma but a calculus where security trumps profit.

  **Third, Smith’s remedies reflect his diagnosis of empire as a *political-economy failure*, not just bad management.** He proposes:  
  1. **Immediate free trade:** Ending monopolies to normalize capital flows and prices (e.g., opening colonial ports to all nations).  
  2. **Gradual representation:** Integrating colonies into Parliament to align interests and prevent future exploitative policies.  
  3. **Eventual separation:** If representation is refused, consensual independence is wiser than costly coercion.  
  These solutions aren’t ad hoc but flow logically from his analysis: Free trade corrects market distortions; representation addresses the *political* roots of monopolies (distant, unaccountable rule); separation is the last-resort alternative to perpetual fiscal drain from defense costs. This progression shows Smith understood empire as an unsustainable *system* requiring institutional overhaul—not mere administrative tweaks.

  The claim that Smith merely opposed "mismanagement" thus collapses. His profit-rate mechanism shows monopolies are inherently harmful regardless of execution; his defense exception proves his principles accommodate non-economic imperatives; and his multi-stage remedies reveal a structural critique. Smith opposed empire not because Britain bungled it, but because its extractive logic violated the conditions for sustainable national wealth—even for the imperial power itself.

  ---

  ### Marking Scheme (5 x 4 = 20 marks)
  **Award 4 marks per section if the student clearly demonstrates understanding. Deduct marks for these common errors:**

  1. **Mechanism of Harm to Britain**  
     *Must-hit:* Explains how monopoly diverts capital → depresses colony-trade profits → inflates consumer prices.  
     *-1 Mark for:* Vague claims like "monopolies are inefficient" without specifying capital reallocation/profit dynamics.

  2. **Who Bears the Cost**  
     *Must-hit:* Identifies British consumers pay monopoly prices *and* overall national profit falls due to capital misallocation.  
     *-1 Mark for:* Implying only colonies suffer or ignoring the dual burden on Britain.

  3. **Navigation Acts as Principled Exception**  
     *Must-hit:* Notes defense justifies inefficiency as a public good; Smith sacrifices optimal efficiency for security.  
     *-1 Mark for:* Calling it a "contradiction" without explaining why defense is exceptional.

  4. **Smith’s Proposed Remedies**  
     *Must-hit:* Names all three (free trade, representation, separation) and links them to his critique (e.g., free trade fixes capital flows; representation addresses political roots).  
     *-1 Mark for:* Only mentioning free trade/independence or failing to connect remedies to analysis.

  5. **Refuting the Provocation**  
     *Must-hit:* Argues that Smith attacks the *system* (monopolies’ inherent logic), not just execution; uses points 1-4 as evidence.  
     *-1 Mark for:* General rebuttal without synthesizing mechanisms/exceptions/remedies.

  ---

  ### Distinguishing 16 from 20/20  
  - **16/20:** Hits all 5 must-hit points competently but mechanically; explanations lack fluid synthesis.  
  - **20/20:** Seamlessly connects profit mechanisms, the defense exception, and remedies to show how they collectively refute the "mismanagement" claim. Demonstrates why Smith’s analysis implies empire is *structurally* flawed, not merely poorly run—e.g., by contrasting the inefficiency of monopoly (fixable) with its systemic profit-rate consequences (inherent).
