prompt: |-
  I have no training in philosophy — I studied something else entirely — but I have been reading about population ethics on my own for a while now, and I have reached the point where I want the specification before the candidates. Every argument I read that some theory is unacceptable turns on a single case; every defence turns on a single intuition I am asked to weigh against it, and I have no way of telling whether the two things being weighed are even the same kind of thing. So please write me the desiderata: what any theory of this subject has to deliver in order to count as adequate. I understand the subject to be the comparative value of possible futures in which the number of people, how well their lives go, and who they are may all differ — the sort of ranking that would tell us whether it is better to have a smaller number of people living very well or a vastly larger number living lives that are only just worth living.

  Set out the requirements with the case or consideration behind each, and mark which of them you take to be genuine conditions on any theory in the area and which are the commitments of one camp rather than of the subject itself. Some of what I list below may be of the second kind; if so, say so.

  The cases I want the list to be answerable to, at a minimum:

  - the conclusion Derek Parfit named the repugnant conclusion — that for any population of people living very well there is a much larger population whose lives are barely worth living whose existence would be better;
  - the step-by-step argument that gets you there, and whether refusing to accept the transitivity of better-than is a legitimate way of stopping it or a refusal to answer the question;
  - the harsher version in which the huge population also contains a large group whose lives are worse than not living at all, and the theory still calls that world better;
  - the mirror-image trouble on the other side, where a theory avoids the repugnant conclusion only by implying that adding people whose lives go well makes the world worse;
  - the case of the woman who could postpone a pregnancy so that a different, healthier child is born, where it seems wrong to justify the postponement by saying the child she would otherwise have had would have been better off not existing;
  - a case where a theory implies it is better to create people whose lives contain real suffering than people whose lives are just worth living;
  - a case where a theory prefers a world because it is more unequal;
  - whether the theory must say anything at all about futures containing infinitely many people, or may be silent about them.

  The distinctions I want it to respect, or to explain why it need not:

  - that something can be worse without being worse for anyone, and whether a theory is allowed to say a world is worse when there is no one for whom it is worse;
  - the value of a world as against the choiceworthiness of an action — whether a theory may accept the repugnant conclusion about value while still not recommending the action that leads there;
  - equal value as against genuine incomparability, and whether saying two futures cannot be compared is an answer or a failure to deliver;
  - whether the ranking must be complete and transitive, and if giving up either is an acceptable price, what exactly we are buying;
  - whether the theory must rank all possible futures or only those we could affect;
  - whether it must remain usable under uncertainty, where we do not know how many people there will be or who they will be.

  Then, on top of the list:

  - flag any subset of the requirements that you believe cannot be jointly satisfied, with an account of which ones collide and why. I have a vague sense that there are impossibility results in this area, and what I want to know is which conditions are the ones doing the colliding;
  - tell me which single requirement rules out the most otherwise attractive theories;
  - tell me which requirement you would abandon first if something has to go, and what we lose by abandoning it;
  - give a short account of how the main families of view do against the list — total views, average views, views that set a critical level below which adding a life counts against, views on which the value of adding a life depends on how many others there already are, views that treat high welfare as a different category altogether from low, and views that make the value of a world depend on what is good or bad for particular people — including the option of simply accepting the repugnant conclusion rather than avoiding it. Keep the emphasis on the requirements, though; I can look up scorecards later.

  One requirement is my own, and I cannot tell whether it is a genuine condition or just sentiment: that a theory should not judge a world worse on the strength of a comparison with people who will never exist. Tell me where that belongs on the list, whether it does any independent work or is only the non-identity worry in another guise, and whether a theory that gives it up is disqualified by doing so.

  The purpose I have in mind, in case adequacy should be relativised to one, is a theory I could actually use to think about long-run questions — how many people there should be, what we owe to those who come after us — rather than one that only ranks toy populations. If the list should look different given that purpose, say how and why.
reasoning: |-
  Okay, this user is diving deep into population ethics without formal training, which is impressive but also clearly frustrating them. They're hitting that classic wall where every argument seems to hinge on isolated intuitions and thought experiments without a clear framework. Their request is methodological: they want the *ground rules* for evaluating theories before getting lost in the weeds of specific positions.

  Hmm, their list of cases shows they've done serious reading - Parfit's Repugnant Conclusion, non-identity problems, transitivity debates. But they're rightly suspicious about whether these are genuine requirements or just rhetorical devices. The meta-question about "requirements vs camp commitments" is sharp - reminds me of how some impossibility theorems work by stacking contested premises.

  Their personal requirement about "comparisons with nonexistent people" is interesting. Feels like an instinctive rejection of impersonal aggregation, maybe rooted in deontological leanings? But they're self-aware enough to question it. Definitely need to disentangle that from the non-identity problem.

  For structure... should organize desiderata into tiers: logical must-haves (like consistency), then domain-specific adequacy conditions, then optional values. The impossibility results (especially Arrhenius') will be crucial here - showing why some intuitive requirements clash mathematically. 

  User's practical purpose matters too. For real-world application, we can't demand infinite precision - theories must handle uncertainty and partial comparisons. Might need to relax "complete ordering" requirement compared to academic treatments. Also should flag which conflicts are most paralyzing for policy (e.g., transitivity failures making decisions impossible).

  Biggest tension points: Avoiding Repugnant Conclusion often forces either sadistic conclusions or intransitivity. And their "no comparisons with nonexistents" principle might rule out most aggregative approaches entirely. Need to be honest that some trade-offs can't be resolved neatly.

  For scoring theories... total utilitarianism wins on simplicity but crashes into Repugnance; average utilitarianism avoids Repugnance but implodes on different cases. Critical-level theories feel promising until you see they create their own paradoxes. Might emphasize that no theory satisfies all desiderata - the field's still wrestling with this.

  Final note to self: User's clearly analytical but frustrated by lack of scaffolding. Should validate that frustration while giving tools to navigate it. No false promises about easy answers - this is famously messy terrain. But can at least map the minefield.
answer: |-
  You've articulated the core challenge of population ethics brilliantly: the need for evaluative criteria *before* settling on a specific theory. Below is a structured list of desiderata, categorized and assessed for their status (core requirement vs. camp commitment), keyed to your cases and distinctions, followed by impossibility results, trade-offs, theory assessments, and your personal requirement.

  **I. Desiderata for a Theory of Population Ethics**

  *(Status Key: **C = Core Requirement** (logical/moral necessity for *any* coherent theory); **D = Domain Adequacy** (necessary for addressing the subject matter); **V = Value Commitment** (reflects a particular ethical stance, not universally shared))*

  1.  **Consistency (Logical Coherence):** The theory must not generate contradictory rankings or violate basic logical principles in its core domain.
      *   *Case/Consideration:* Essential for reasoning. E.g., a theory cannot simultaneously rank A>B, B>C, and C>A. Refusing transitivity to block the Repugnant Conclusion risks incoherence.
      *   *Status:* **C**

  2.  **Non-Implosion:** The theory must avoid implying that *no* future is better than any other (complete incomparability) or that *all* futures are equally good, unless demonstrably true for a specific pair.
      *   *Case/Consideration:* Addresses whether incomparability is an answer or a failure. Must be able to make *some* meaningful comparisons relevant to the domain (e.g., clearly better/worse futures).
      *   *Status:* **D**

  3.  **Asymmetry of Existence/Non-Existence:** Creating a person with a life not worth living is bad. Failing to create a person with a life worth living is *not* bad *for* that person (since they don't exist), and the theory must account for this asymmetry.
      *   *Case/Consideration:* The case of postponing pregnancy for a healthier child. Saying the first child would be "better off not existing" conflates perspectives. The badness lies in creating a *life not worth living*, not in harming a nonexistent person.
      *   *Status:* **D** (Fundamental to the "non-identity problem" aspect of the domain).

  4.  **Avoidance of the Sadistic Conclusion:** The theory must not imply that adding people with lives *not worth living* (who experience net suffering) is *better* than adding people with lives worth living, all else equal.
      *   *Case/Consideration:* Directly addresses the "harsher version" of the Repugnant Conclusion and the case where creating suffering is preferred over creating positive welfare.
      *   *Status:* **D** (Widely considered a devastating flaw).

  5.  **Avoidance of the Anti-Egalitarian Conclusion:** The theory must not imply that a more unequal distribution of welfare is strictly better than a perfectly equal distribution with the same total (or average) welfare.
      *   *Case/Consideration:* Addresses the case where inequality is preferred.
      *   *Status:* **V** (Reflects a commitment to the intrinsic badness of inequality; some theories, like pure Total Utilitarianism, are indifferent to distribution).

  6.  **Avoidance of the Mere Addition Paradox:** The theory must avoid implying that adding people whose lives are *worth living but worse than the average* makes the outcome worse *if* the original people are unaffected.
      *   *Case/Consideration:* The "mirror-image trouble": avoiding Repugnance by making benevolent additions bad.
      *   *Status:* **D** (Reflects the intuition that benevolent creation shouldn't be harmful).

  7.  **Responsiveness to Welfare:** The theory must be sensitive to the quality of individual lives. Ceteris paribus, increasing someone's welfare must make the outcome better; decreasing it must make it worse.
      *   *Case/Consideration:* Core to evaluating "how well lives go". Undermined if adding good lives makes things worse (Mere Addition) or adding bad lives makes things better (Sadistic Conclusion).
      *   *Status:* **D**

  8.  **Non-Identity Insensitivity:** The theory must be able to compare outcomes involving different possible people, evaluating the *state of affairs* itself.
      *   *Case/Consideration:* Essential for comparing futures with different populations (e.g., having Child A vs. Child B later). The value of a world *can* be worse without being worse *for* any particular existing person.
      *   *Status:* **D** (Fundamental to the domain of varying populations).

  9.  **Action-Guiding Potential (Under Certainty & Uncertainty):** The theory should, in principle, provide grounds for decision-making, even if complex or requiring auxiliary principles (e.g., decision theory under uncertainty).
      *   *Case/Consideration:* Links "value of world" to "choiceworthiness of action". Purpose: usable for long-run questions. Must handle uncertainty about who/will exist. Silence on infinite populations might be acceptable *if* finite cases are handled robustly and infinite cases are deemed practically irrelevant or theoretically intractable.
      *   *Status:* **D** (For your stated purpose).

  10. **Avoidance of the Strong Repugnant Conclusion:** The theory must avoid implying that for any perfectly equal population with very high welfare, there is a larger population with lives barely worth living *and containing a large subgroup with lives not worth living* that is better.
      *   *Case/Consideration:* The "harsher version" you specified.
      *   *Status:* **D** (An even more compelling adequacy condition than avoiding the standard Repugnant Conclusion).

  **II. Your Personal Requirement: "No Comparisons with Nonexistents"**

  *   **Analysis:** This is distinct from, but closely related to, the **Asymmetry (3)** and **Non-Identity Insensitivity (8)**. It expresses discomfort with *impersonal aggregation* – summing welfare across possible people.
  *   **Status:** Primarily **V**. It reflects a deep-seated intuition that morality is fundamentally about relations between existing or future *identifiable* individuals ("person-affecting" focus). However, it does **independent work**:
      *   It directly challenges the core methodology of *impersonal Totalism* (summing welfare across possible people).
      *   It might rule out comparing futures with completely disjoint populations (e.g., Earth vs. Mars colony descendants), even if no non-identity problem exists within each lineage.
  *   **Consequence:** A theory abandoning this (like Total Utilitarianism) isn't *logically disqualified*, but it fails to respect this strong person-affecting intuition. Theories embracing it (e.g., some Narrow Person-Affecting views) face severe difficulties making comparative judgments in non-identity cases and may struggle to avoid the Sadistic Conclusion or Mere Addition Paradox. It's a **significant camp commitment**.

  **III. Impossibility Results & Collisions**

  The central impossibility theorem (Arrhenius et al.) shows that **no population axiology can satisfy all of the following simultaneously**:

  1.  **Egalitarian Dominance (V):** If population A is a perfectly equal population of the same size as B, and everyone in A has higher welfare than everyone in B, then A is better than B.
  2.  **General Non-Extreme Priority (D):** There is some number of lives with very high welfare such that a population containing them is better than any population containing lives with very low positive welfare, regardless of size. (A strong denial of the Repugnant Conclusion).
  3.  **Non-Sadism (D):** Adding lives with positive welfare is better than adding lives with negative welfare, ceteris paribus. (Avoids the Sadistic Conclusion).
  4.  **Avoidance of the Weak Mere Addition Paradox (D):** If population A is better than B, then A is better than a population that is just like B but with an additional group of people with lives worth living (at *any* positive level), who do not affect the original inhabitants.
  5.  **Transitivity (C):** The "better than" relation is transitive.
  6.  **Completeness (V?/D?):** All distinct populations are comparable.

  **Key Collision:** The core conflict is between **denying the Repugnant Conclusion (General Non-Extreme Priority)** and **allowing benevolent additions without making things worse (Avoidance of Weak Mere Addition Paradox)**, while respecting **Non-Sadism** and **Transitivity**. Insisting on strong avoidance of Repugnance forces you to either accept that benevolent additions can be bad (violating Mere Addition) or accept intransitivity.

  **IV. Trade-offs & Scoring**

  1.  **Rule-Out King:** **Avoidance of the Repugnant Conclusion (or its strong form).** Most intuitively appealing theories (Total Utilitarianism, Critical Level) accept it. Avoiding it requires complex maneuvers (intransitivity, lexical thresholds, average views) that often lead to other serious problems (Sadistic Conclusion, Mere Addition Paradox, Anti-Egalitarianism).
  2.  **First to Abandon:** **Completeness.** Insisting all possible futures (especially disjoint populations with no overlap) *must* be comparable is overly demanding and arguably not necessary for practical decision-making under uncertainty (we often compare prospects, not definite outcomes). We lose theoretical tidiness but gain flexibility to avoid paradoxes by admitting genuine incomparability in some edge cases.
  3.  **Cost of Abandoning Transitivity:** **Usability.** Intransitivity makes cyclic preferences possible (A>B, B>C, C>A), paralyzing rational choice. It might block the Repugnant Conclusion argument, but at the high cost of making consistent decision-making impossible. (**Status: C** makes abandoning it costly, but some argue it's necessary).

  **V. Theory Families vs. Desiderata (Brief Assessment)**

  *   **Total Utilitarianism (TU):** (Sum welfare)
      *   *Fails:* Repugnant Conclusion (embraces it), Strong Repugnant Conclusion. *Struggles:* Avoid Anti-Egalitarian Conclusion (indifferent).
      *   *Satisfies:* Non-Sadism, Mere Addition (embraces), Responsiveness, Non-Identity Insensitivity, Simplicity/Action Guiding (under certainty). *Fails your requirement.*
  *   **Average Utilitarianism (AU):** (Maximize average welfare)
      *   *Fails:* Mere Addition Paradox (adding good but below-average lives makes things worse), potentially Sadistic Conclusion (if adding miserable people raises the average), Non-Identity Insensitivity in some cases.
      *   *Satisfies:* Avoids Repugnant Conclusion (usually), Avoids Strong Repugnant Conclusion (usually). *Fails your requirement.*
  *   **Critical-Level Theories (CL):** (Value of adding a life = Welfare - CL)
      *   *Fails:* Can generate Sadistic Conclusion if CL is set too high; Strong Repugnant Conclusion remains a risk if CL is low; Mere Addition Paradox can arise depending on CL relative to existing average.
      *   *Satisfies:* Avoids standard Repugnant Conclusion (with appropriate CL), Non-Sadism (with appropriate CL), Responsiveness. *Fails your requirement.*
  *   **Variable Value/Variable Critical Level:** (Value of additional life diminishes/increases with pop size)
      *   *Goal:* Avoid Repugnance without Mere Addition Paradox/Sadism. *Success:* Mixed. Often avoids standard Repugnance and Mere Addition. *Risk:* Intransitivity, complexity, potential for other paradoxes (e.g., "Reverse Repugnance" where high welfare small pop is inferior to medium welfare medium pop). May struggle with Strong Repugnant Conclusion. *Fails your requirement.*
  *   **Lexical/Discontinuity Views:** (High welfare has infinite/lexical priority over low)
      *   *Fails:* Mere Addition Paradox (if the added life is below the threshold). Can imply extreme conclusions (e.g., vast populations of barely positive lives are worthless compared to one very good life). May struggle with completeness/comparability across thresholds.
      *   *Satisfies:* Avoids Repugnant and Strong Repugnant Conclusions decisively, Avoids Sadism (if threshold is positive). *Fails your requirement.*
  *   **Person-Affecting Views (PA):** (Focuses only on effects on existing/future identifiable individuals)
      *   *Fails:* Often struggles with Non-Identity cases (e.g., Parfit's Depletion), may imply the Mere Addition Paradox is acceptable, can lead to the Sadistic Conclusion in some formulations. Difficulty comparing disjoint futures. Hard to apply under uncertainty about identity.
      *   *Satisfies:* Your personal requirement, Asymmetry, avoids standard Repugnant Conclusion (by denying the impersonal aggregation it rests on). *Status:* Highly diverse camp; many formulations struggle with **Domain Adequacy (D)** requirements like Non-Identity Insensitivity and Responsiveness in non-identity cases.
  *   **Accepting Repugnance:** (E.g., TU, some CL)
      *   *Fails:* Repugnant & Strong Repugnant Conclusions (by accepting them), Anti-Egalitarianism (if TU). *Satisfies:* Non-Sadism, Mere Addition, Responsiveness, Non-Identity Insensitivity, Simplicity. *Fails your requirement.* The cost is accepting the counterintuitive conclusion.

  **VI. Conclusion Given Your Purpose**

  For a theory usable on *long-run questions* involving uncertainty about who will exist and potential for vastly different population sizes:

  1.  **Prioritize:** Logical Consistency, Non-Implosion, Non-Sadism, Strong Avoidance of Sadistic Conclusion, Responsiveness, Non-Identity Insensitivity, Action-Guiding Potential (under uncertainty).
  2.  **Be Flexible On:** Completeness (allow incomparability for disjoint futures), potentially strict Avoidance of the *standard* Repugnant Conclusion (if the cost is too high elsewhere like Sadism or Mere Addition), strict Egalitarianism.
  3.  **Concede:** A perfect theory satisfying all intuitions is impossible (Arrhenius). Trade-offs are inevitable.
  4.  **Your Requirement:** Embracing it (**V**) significantly constrains options, likely pushing you towards complex Person-Affecting views or views embracing incomparability. Be prepared for the theoretical costs (difficulty with non-identity cases, potential paralysis under uncertainty). Abandoning it opens the door to impersonal aggregative views (TU, CL) which are simpler and more decisive but violate that intuition and accept Repugnance or its cousins.

  The quest is for the least implausible balance of these conflicting demands. Focus on theories that robustly avoid the *most catastrophic* conclusions (Sadism, Strong Repugnance) while remaining usable under uncertainty, even if they require accepting some counterintuitive results (like the standard Repugnant Conclusion) or limited incomparability. Critical Level theories (with cautious CL setting) or sophisticated Variable Value views often represent this pragmatic middle ground, though they fail your personal requirement. Person-Affecting views respecting your requirement demand careful formulation to avoid their own pitfalls.
