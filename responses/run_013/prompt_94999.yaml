  I need to design this procedure with specific features: questions they can answer from the text alone, clear stopping points for "strike," "hedge," or "faculty referral," and explicit acknowledgment of where judgment is required. I must also apply it to three sample claims and explain where Nyāya concepts don't perfectly map to modern academic contexts.

  For the procedure itself, I'll structure it as a decision tree with these key steps: identifying the epistemic source (pramāṇa), checking for defeaters, evaluating justification sufficiency, and applying the inference fallacy framework. I'll mark judgment points clearly and specify what to do when steps can't be answered.

  For the sample claims:
  - Claim 1 (survey data) should get "hedge" due to methodological limitations
  - Claim 2 (stereotype threat) should get "hedge" for unsupported assertion
