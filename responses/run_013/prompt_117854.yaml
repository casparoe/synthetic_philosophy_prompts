answer: |-
  Here are the desiderata for a theory of the political content of artifacts, derived from your cases and constraints. I've structured them as non-negotiable core requirements (N) and important but potentially camp-specific preferences (P). The motivating cases drive the requirements.

  **Brainstormed Candidate Requirements (Before Filtering):**
  1.  Must distinguish political effects from economic/distributive/aesthetic ones.
  2.  Must handle both intentional and unintentional political consequences.
  3.  Must account for system-level effects beyond single artifacts.
  4.  Must explain how politics operates *through* material form/function, not just use.
  5.  Must accommodate politics in maintenance, decay, and absence of action.
  6.  Must explain how artifacts can *stabilize* or *enforce* orders, not just express them.
  7.  Must handle cases where politics is invisible or shapes the thinkable.
  8.  Must be applicable across scales (object, standard, system, infrastructure).
  9.  Must avoid collapsing politics into designer intent.
  10. Must explain how artifacts assign roles/status/visibility.
  11. Must account for differential impact on different groups/agents.
  12. Must handle cases where formal compliance masks substantive exclusion.

  **Settled Desiderata List:**

  1.  **Non-Neutrality Criterion (N):** The theory must explain how the artifact's *specific material configuration, function, or operational logic* actively produces or sustains a differential distribution of power, agency, access, recognition, vulnerability, or benefit among identifiable social groups or categories (e.g., class, race, ability, profession), *beyond* simply reflecting economic efficiency or aesthetic preference.
      *   *Motivating Cases:* Parkway overpass (class/transport access), Proprietary-standard (market access/control), Platform visibility defaults (labor recognition), Back-door accessibility (substantive vs formal inclusion), Risk-shifting device (vulnerability distribution), Biased metric (reproduction of historical disadvantage), Selective maintenance (differential service/survival).
      *   *Non-Negotiable:* This defines the core phenomenon.

  2.  **Agency Traceability (Non-Intentionalism) (N):** The theory must attribute political content to the artifact without requiring *designer intent* as the source. It must explain how political effects arise from the artifact's design, its interaction with social structures, its operational context, or systemic logic, even when unintended or unforeseen.
      *   *Motivating Cases:* Biased metric (emergent bias from data), Risk-shifting device (unforeseen consequence), Platform visibility defaults (system logic over intent), Selective maintenance (systemic prioritization, often unstated).
      *   *Non-Negotiable:* Intentionalism fails on critical cases. Politics emerges from socio-technical interaction.

  3.  **Non-Reducibility Criterion (N):** The theory must distinguish "political" content from merely economic, distributional, aesthetic, or ergonomic effects. It must identify when differential outcomes constitute an exercise of power (e.g., shaping life chances, enforcing norms, structuring participation in collective life) rather than just market dynamics, resource allocation, taste, or convenience.
      *   *Motivating Cases:* Parkway overpass (exclusion from public space ≠ mere inconvenience), Back-door accessibility (symbolic relegation ≠ cost-saving), Audit trail unreadability (democratic deficit ≠ technical complexity), Biased metric (systemic disadvantage ≠ statistical anomaly), Selective maintenance (de facto disenfranchisement ≠ budget constraint).
      *   *Non-Negotiable:* Essential for the "politics rather than mere..." clause.

  4.  **Material Efficacy (N):** The theory must show how the political effect is *operationalized materially* – how the artifact's physical properties, code, rules, or functional constraints *enable, enforce, or necessitate* the political outcome. Politics must be baked into the artifact's function, not just its symbolic meaning.
      *   *Motivating Cases:* Parkway overpass (clearance height physically blocks buses), Proprietary-standard (technical requirement dictates tool dependency), Risk-shifting device (algorithmic logic redistributes harm), Audit trail (technical format dictates legibility), Building code compliance (physical location dictates access route).
      *   *Non-Negotiable:* Prevents reducing artifacts to neutral vessels for social forces.

  5.  **Scalability & Context Sensitivity (P):** The theory should be applicable to diverse artifacts (objects, standards, interfaces, codes, systems, infrastructures) and account for how context (social, institutional, historical) shapes the realization of political content. However, the core political mechanism should be identifiable across contexts.
      *   *Motivating Cases:* Contrasting parkway (object/system) with biased metric (algorithm/system) or maintenance regime (practice/system). The *how* differs, but the *political nature* should be explicable.
      *   *Preference:* Strict universalism might oversimplify, but context-blindness is worse. Most camps need some version.

  6.  **Systemic Emergence & Maintenance (N):** The theory must account for political content that arises *only* at the level of systems, networks, or long-term regimes (like maintenance), not from isolated artifacts. It must explain how politics operates through aggregation, path dependency, normalization, and the management of absence/decay.
      *   *Motivating Cases:* Selective maintenance regime (politics through neglect/capital allocation), Platform interface defaults (systemic effect on labor visibility), Proprietary-standard ecosystem (market gatekeeping through network effects), Risk-shifting across populations (systemic harm distribution).
      *   *Non-Negotiable:* Intentionalist or single-artifact-focused theories fail here.

  7.  **Visibility & Shaping the Thinkable (P):** The theory should ideally explain how artifacts can render political effects *invisible* (to some) or shape the very possibilities for action and thought (e.g., defining what is feasible, normal, or even conceivable), not just constrain visible choices.
      *   *Motivating Cases:* Platform visibility defaults (shaping what work "counts" without deletion), Audit trail unreadability (making oversight practically impossible), Selective maintenance (normalizing decay for some infrastructures), Proprietary-standard (defining "legitimate" participation).
      *   *Preference:* Crucial for critical analysis, but some positivist or liberal accounts might downplay this as "latent" or focus only on observable constraints. Strongly motivated by cases.

  **Testing Your Political Registers:**

  1.  **Artifacts as Settlements:** Theory must explain how designs *encode resolutions* of past conflicts, making specific power relations durable and often taken-for-granted.
      *   *What to Explain:* Parkway overpass (historical class/access compromise), Building code (formalizing accessibility norms, however minimally).
      *   *Counterexample:* A biased metric derived from "neutral" statistical modeling lacking any *conscious* conflict resolution. Forces revision: "Settlement" might be too narrow; "Stabilization" (conscious or not) is broader and necessary.

  2.  **Artifacts as Constraints:** Theory must explain how designs *actively limit possibilities* for certain actors/groups, changing their feasible action sets materially.
      *   *What to Explain:* Parkway overpass (blocks buses), Proprietary-standard (blocks non-tool-users), Back-door access (constrains dignified entry).
      *   *Counterexample:* Platform visibility defaults – it doesn't *prevent* work, it makes it *invisible*. Forces revision: Need a register for *shaping recognition/value* beyond physical constraint. "Constraints" is too blunt.

  3.  **Artifacts as Scripts:** Theory must explain how designs *assign roles, competencies, obligations, and identities* to users/non-users.
      *   *What to Explain:* Platform interface (defines whose work is "core" vs. peripheral), Audit trail (defines who is a "legitimate" auditor), Maintenance regime (defines what is "maintainable" vs. "disposable").
      *   *Counterexample:* Parkway overpass – it sorts access but doesn't necessarily *script* the roles of bus riders vs car drivers beyond that access. It's more a constraint. Forces refinement: Scripts often imply performative roles *within* a system enabled by the artifact, not just exclusion.

  4.  **Artifacts as Infrastructures:** Theory must explain how systems *distribute visibility, legibility, and maintainability*, governing what is monitored, understood, sustained, and thus politically actionable.
      *   *What to Explain:* Audit trail unreadability (legibility deficit), Platform visibility defaults (visibility distribution), Selective maintenance (distributed maintainability), Risk-shifting device (visibility of harm distribution).
      *   *Counterexample:* Biased metric – it *uses* infrastructure but its core political act is *reproducing bias via classification/decision*, not primarily distributing visibility/legibility/maintenance *of itself*. Forces revision: This register is powerful but distinct. It might subsume aspects of the others at a systemic level.

  **Revised Registers Recommendation:** Drop "Settlements" as too narrow/historical. Keep "Constraints" (material limitation of action). Rename "Scripts" to **"Roles/Recognition"** (assigning status, value, visibility, identity). Keep **"Infrastructures"** (distributing systemic capacities: visibility, legibility, maintainability). Add **"Stabilization/Enforcement"** (making specific orders durable/resistant to change, encompassing "Settlements" but broader).

  **Evaluating Distinctions:**

  *   **Genuine Requirements:** Artifact function vs downstream effect (Req 4); Artifact-level vs system-level politics (Req 6); Politics in maintenance/decay vs just design/use (Req 6); Necessary vs contingent consequences (Req 3 helps assess necessity); Politics shaping the thinkable vs visible choices (Req 7).
  *   **Camp-Specific/Optional:** Designer intent vs artifact function (Req 2 makes intent optional); Politics *in* design vs *in* use (Use-centered camps emphasize use, others emphasize design/function); Artifact *being* political vs *used for* politics (Most serious theories see the artifact itself as political via its function in context).
  *   **Requirement Clarification:** "Stabilization/Enforcement" (Req 1) covers *necessary* political consequences inherent in the artifact's function within its context. Contingent effects are downstream.

  **Tensions & Key Exclusions:**

  1.  **Tension between Agency Traceability (N) and Systemic Emergence (N):** Requiring politics traceable to *some* human agency (design, policy, investment choices) but *not* requiring intent, while also demanding that the theory captures politics emerging *only* from complex system interactions (e.g., biased metric, maintenance regime decay patterns). **Resolution:** The theory must allow agency to be distributed, historical, embedded in institutional logics, and emergent from interactions, without pinpointing a single "intending" actor. Failure here risks either intentionalism or excessive structuralism.
  2.  **Key Excluding Requirement: Non-Reducibility Criterion (N).** This does the heaviest lifting. Many functionalist, economic, or ergonomic accounts fail precisely here, arguing political effects are epiphenomenal to efficiency, cost, or usability. This requirement forces the theory to grapple with power dynamics inherent in the artifact's function. *Impossibility:* A theory insisting political content *only* exists when explicitly intended (violates Req 2) fundamentally cannot handle systemic emergence (Req 6). This shows intentionalism is inadequate.

  **Verdict on Theoretical Families:**

  *   **Designer-Intent:** Fails Req 2 (Agency Traceability), Req 6 (Systemic Emergence), Req 7 (Shaping the Thinkable). Cannot handle unintentional or emergent politics.
  *   **Functionalist:** Often fails Req 3 (Non-Reducibility), reducing function to efficiency/ergonomics, missing power. Struggles with Req 6 (Systemic Emergence) if focused on single artifacts. May downplay Req 7.
  *   **Use-Centered:** Fails Req 4 (Material Efficacy) if politics is *only* in use, ignoring baked-in function. Struggles with Req 6 (Systemic Emergence/maintenance) and Req 1 (Non-neutrality) where politics is inherent in design logic constraining use possibilities. Can handle Req 7 well.
  *   **Affordance-Based:** Risks failing Req 3 (Non-Reducibility) if affordances are seen as neutral potentials. Needs strong coupling to social power (Req 1) and agency traceability (Req 2) to avoid this. Struggles with Req 6 (Systemic Emergence) unless scaled up significantly. Good at Req 4.
  *   **Structural-Power:** **Most promising.** Naturally handles Req 1 (Non-Neutrality/Power), Req 2 (Agency Traceability via structures), Req 3 (Non-Reducibility), Req 6 (Systemic Emergence), and Req 7 (Shaping Thinkable). Biggest challenge is specifying Req 4 (Material Efficacy) – *how exactly* does the structure operate materially through *this* artifact? Needs concrete mechanisms.

  **Contestable Requirement & Vulnerability:**

  *   **Most Contestable:** **Scalability & Context Sensitivity (P).** Is there a *single* core mechanism for "political content," or is it irreducibly pluralistic, requiring different explanations for different artifact types/registers? My requirement leans towards seeking a unified core mechanism applicable across contexts.
  *   **What Would Change My Mind:** A compelling demonstration that the political mechanisms operating in a parkway overpass (material constraint) vs. a biased metric (algorithmic classification/reproduction) vs. a maintenance regime (systemic prioritization/neglect) are fundamentally *incommensurable* at the level of core explanation, requiring distinct theoretical frameworks. This would force me to drop the scalability preference and accept pluralism.
  *   **Point of Vulnerability:** My reasoning for **Non-Reducibility (N)** relies on interpreting cases like the parkway or back-door access as *inherently* exercises of power. Someone could argue these *are* fundamentally economic (cost of building higher bridges, cost of front-door ramps) or ergonomic (traffic flow, space constraints), and the "power" is just interpretation. My defense hinges on the *differential impact on collective participation and status* (access to public space, dignified entry) constituting a political act *through* the material form, regardless of stated rationale. If this link between material constraint/design and political status/participation is rejected as "merely" social interpretation, the core project collapses. This is the foundational gamble of the field.
