  I need to develop a set of requirements that any theory must satisfy to handle these cases. The requirements should be motivated by specific cases and I should indicate whether each is non-negotiable or camp-specific. I'll need to organize this clearly, starting with a brainstorm and then settling on a final list.

  For the political registers, I'll examine each category (settlements, constraints, scripts, infrastructures) and identify what a theory needs to explain for each, plus counterexamples that would challenge the categorization. I'll also need to evaluate various distinctions (designer intent vs function vs effect, artifact vs system level, etc.) and determine which are essential requirements versus optional preferences.

  Importantly, I should flag any potential conflicts between requirements that might be impossible to jointly satisfy, and identify which requirement does the most work in excluding otherwise plausible theories. Finally, I'll briefly evaluate major theoretical approaches (designer-intent, functionalist, use-centered, affordance-based, structural-power) against the non-negotiable requirements, and conclude with a reflection on where my reasoning might be most vulnerable.

  For the desiderata, I'll likely include requirements covering: non-neutrality, traceability to human agency, non-reducibility to other domains, observability in material impact, scalability across contexts, accounting for emergence, and addressing maintenance/decay. Each will be tied to specific cases from their list. The parkway overpass shows how design constraints sort access; the proprietary standard reveals market gatekeeping; the platform interface demonstrates visibility politics; and so on.

  I'll organize this systematically, ensuring each requirement is clearly stated with its motivating case and negotiability status. For the political registers, I'll test each against counterexamples - for instance, whether "settlements" can handle cases where politics wasn't explicitly contested, or whether "infrastructures" captures maintenance politics adequately.

  The key tensions will likely emerge between requirements like intentional traceability (which might exclude emergent system effects) and systemic emergence (which might overextend political attribution). The requirement doing the heaviest lifting will probably be the non-reducibility criterion, as it forces the distinction between political content and mere economic or aesthetic effects.

