prompt: |-
  I retired last year after thirty-five years in microbial ecology, and I have spent the past eighteen months reading philosophy of science with more enthusiasm than method. I keep returning to the underdetermination of theory by evidence, because it names something I lived with at the bench but never had to state precisely. I have in mind a handful of cases from my own work and from neighboring fields, and I would like you to help me see what principle, if any, underlies my verdicts about them. Please treat me as a serious amateur: I can follow formal distinctions, but I need them explained in plain language, and I am not looking for a reading list or citations.

  My verdicts are these. First, when two models of bacterial chemotaxis — one saying the cell compares receptor occupancy over time, the other saying it senses spatial differences across its body — both fit the same capillary-assay trajectories from my old lab, I say the evidence underdetermines the choice, even though I know the spatial model is physically implausible for a cell that small. Second, when a magnetic-map model and an olfactory-map model of bird navigation both fit the same release-and-recapture data, I say the evidence underdetermines the choice, but only weakly, because I think a new experiment could break the tie in principle. Third, when a colleague presents a neutral model and a niche model of species-abundance distributions that fit the same plot, I say the evidence underdetermines the choice, and I am uneasy about that, because the two models seem to disagree about what would happen if I manipulated the environment. Fourth, when someone shows me two formulations of the same enzyme-kinetics model related by a mathematical reparameterization, I say the evidence does not underdetermine anything; there is just one model written twice. Fifth, when a model with extra free parameters is tuned to fit the same data as a simpler model, I say the evidence underdetermines the choice between them, but I also think the simpler model is better supported — and I cannot tell whether that is a contradiction or a distinction. A young colleague has proposed that we adopt an 'evidential symmetry audit': before accepting any model, list every rival that fits the same data and assign them equal credence until an intervention breaks the symmetry. I find this proposal both admirable and absurd, and I want to know which of my verdicts it would force me to give up.

  Please act as a philosopher of science with expertise in underdetermination, scientific inference, and the epistemology of experiment. Think carefully about the cases before answering. You may brainstorm privately, but in your final answer give me exactly five numbered items and nothing else — no introduction, no conclusion, no headings. Each item should be a sentence or two. In item 1, state the single best principle you can find that captures as many of my verdicts as possible, stated precisely enough that I could use it to classify a new case. In item 2, identify the case that motivates its central clause and explain why. In item 3, identify the case that forces you to add a qualification or a second clause. In item 4, say what your principle predicts for a case I have not mentioned: two models that fit the same data but differ in whether they posit a hidden entity that is, by hypothesis, permanently unobservable. In item 5, tell me which of my five verdicts your principle cannot accommodate, and whether I should abandon that verdict or abandon the principle.
reasoning: |-
  Okay, the user is a retired microbial ecologist who's been diving into philosophy of science, particularly underdetermination of theory by evidence. They've presented five specific cases from their experience and want a principle that explains their judgments about when evidence underdetermines theory choice. 

  First, I need to unpack their examples carefully. The chemotaxis case shows physical impossibility breaking underdetermination despite empirical equivalence. The bird navigation case introduces the idea of testability breaking underdetermination in principle. The niche modeling case highlights unease when models make different intervention predictions. The enzyme kinetics case correctly dismisses underdetermination for mere reparameterizations. The free parameters case reveals tension between underdetermination and preferring simpler models.

  Hmm... the core tension across these cases seems to be between empirical equivalence and other scientific virtues. But their judgments suggest empirical equivalence alone isn't sufficient for underdetermination - they consistently require something more. The physical impossibility in case 1, testability in case 2, and intervention predictions in case 3 all seem to override pure empirical equivalence.

  For the principle, I'm considering something like: "Evidence underdetermines theory choice only when empirically equivalent alternatives remain plausible after considering physical constraints and testable consequences." This handles their rejection of the spatial chemotaxis model (physical implausibility) and the enzyme reparameterization (not genuine alternatives). 

  But case 5 is tricky. They acknowledge underdetermination yet prefer the simpler model - which feels contradictory but aligns with scientific practice. The principle must allow that underdetermination can coexist with differential support. Maybe adding "epistemic" clarification would help? Like specifying underdetermination concerns justification rather than heuristic preference.

  For the unmentioned case about permanently unobservable entities... if both models fit data equally and both are physically plausible, underdetermination should hold unless one makes superior testable predictions elsewhere. Their colleague's "evidential symmetry audit" would fail here by assigning equal credence despite potential differences in testability.

  Finally, case 5 resists full accommodation because their verdict contains two claims: underdetermination exists (which fits) AND simplicity provides better support (which seems extra). The principle explains the first but not the second - though I think they should keep both since simplicity is a valid epistemic virtue beyond underdetermination considerations.
answer: |-
  Here are five numbered items as requested:

  1. Evidence underdetermines theory choice between empirically equivalent models only if they are physically plausible, distinct in their representational content (not mere reparameterizations), and their equivalence cannot be broken by any possible experiment or intervention, either practically or in principle.

  2. Case 2 (bird navigation) motivates the "breakable in principle" clause: You judge underdetermination weak because future interventions *could* distinguish the magnetic and olfactory models, highlighting that underdetermination hinges on whether empirical equivalence is permanent, not just current.

  3. Case 1 (bacterial chemotaxis) forces a qualification: While the models are empirically equivalent and distinct, you reject the spatial model due to physical implausibility (cell size). This shows underdetermination requires alternatives to be *physically possible*, not just mathematically fitting.

  4. For two models fitting the same data but differing in positing a permanently unobservable entity: If both are physically plausible and no possible intervention (even conceptual) could break the equivalence, the principle predicts genuine underdetermination. If one makes testable predictions the other cannot (even about other phenomena), equivalence isn't permanent, weakening underdetermination.

  5. The principle cannot fully accommodate Case 5 (extra parameters). It explains why evidence underdetermines the choice (empirical equivalence), but not your judgment that the simpler model is "better supported." You should not abandon this verdict; it reflects distinct epistemic virtues (e.g., parsimony) that guide belief *despite* underdetermination.
