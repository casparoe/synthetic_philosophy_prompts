answer: |-
  Right, your brother-in-law's argument is cleverly constructed to sound watertight, but it smuggles in some dodgy logic and false choices. He's conflating *absolute fairness* with *any fairness*, and using the impossibility of the first to dismiss the pursuit of the second. Here's where it goes wonky and what you can reasonably drop:

  1.  **The Core Problem: Steps (4), (5), (6), and (7) set up a Straw Man and False Dichotomy.**
      *   **Straw Man:** Your brother-in-law redefines the goal of fairness (from step 1) as the *complete and total elimination of any and every possible advantage* derived from family background. He lists money, contacts, confidence, accent, parenting, and even *genes* (step 5). He then correctly points out that eliminating *all* of these, especially things like parenting and genes, is impossible without monstrous interventions (step 6).
      *   **False Dichotomy:** He then presents only two options: either achieve *perfect, total equality of opportunity* by resorting to state orphanages (which everyone rightly rejects), OR abandon the *entire principle* of trying to make life chances less dependent on birth family (step 7). This is the "all or nothing" fallacy.

      **Where he's wrong:** The principle (1) – "A fair society is one where your chances in life **don't depend** on the family you were born into" – is an *aspiration* and a *direction of travel*, **not** a demand for perfect, unattainable sameness. We can meaningfully strive to *reduce* the dependence, *mitigate* the advantages/disadvantages, and *lessen* the impact of brute luck without needing to eliminate *every single atom* of difference. Accepting that some advantages (like a loving parent reading to you) are untouchable doesn't mean we should throw our hands up and do nothing about the advantages we *can* affect, like vast inheritances.

  2.  **Specific Flaws in Steps:**

      *   **Step (4): Misunderstanding Advantage.** He argues that inheritance only matters because it gives a *relative* ranking advantage ("a head start"). This is partially true but ignores *absolute* advantages. If everyone inherited enough capital to buy a house outright or start a secure business, **even if everyone had the same amount**, that would *massively* improve absolute life chances compared to a world where nobody inherited anything and everyone started with crippling debt or insecure housing. Wealth isn't *just* about being top of the pile; it's about security, opportunity, and freedom from poverty. Taxing large inheritances doesn't aim to make everyone *win* a ranking; it aims to prevent the extreme concentration of unearned capital that distorts opportunity and creates dynastic wealth.
      *   **Step (5) & (6): The Slippery Slope / Conflation.** Listing *all* the things families pass on (genes, accents, bedtime stories) and then saying "None of that can be taxed away" is true. But the leap to "Therefore, *to cancel all of it* you'd need state orphanages" is the straw man. Nobody serious about fairness (based on principle 1) advocates for cancelling *all* of it. They advocate for mitigating the *economic* aspects we *can* influence (like inheritance) and providing compensatory opportunities (like good state education, healthcare, social mobility programs) to counter some of the *non-economic* disadvantages where possible.
      *   **Step (7): The Non Sequitur.** Because achieving *perfect* fairness (his redefined, impossible version) is undesirable and unattainable, he concludes that the *entire principle* (1) is a "fantasy" and that taxing inheritance specifically is just "envy". This simply doesn't follow. Rejecting an impossible extreme doesn't invalidate the core principle of reducing unfair dependence on birth. Taxing inheritance isn't about eliminating *all* advantage or achieving sameness; it's about preventing the *most extreme, unearned* economic advantages from entrenching inequality across generations and making a mockery of meritocracy. Calling it "envy" is a cheap rhetorical trick to avoid engaging with the substantive argument about fairness and unearned privilege.

  **The Cheapest Thing to Drop (Without Abandoning Principle 1):**

  You don't need to drop anything fundamental. You need to **reject the false all-or-nothing interpretation** that your brother-in-law imposes on Principle (1) in steps (4) through (7).

  *   **Keep Principle (1):** It's sound. A fair society *should* strive to make your life chances less dependent on the lottery of birth. This is a widely held ethical principle.
  *   **Keep Step (2):** Inheritance *is* a pure case of unearned advantage based solely on family.
  *   **Modify Step (3):** Instead of "tax inheritances away to nothing," reframe it as "a fair society would **significantly mitigate the impact of large inheritances** through taxation and other policies." The goal isn't literal zero (small, modest inheritances are less problematic), nor is it the *only* tool, but it is a crucial tool targeting the most direct transmission of unearned wealth.
  *   **Reject the Straw Man & False Dichotomy (Steps 4-7):** Acknowledge that *some* advantages (genes, loving parenting) are untouchable and desirable. Argue that fairness isn't about creating clones, but about **levelling the playing field as much as reasonably possible.** We tax income despite differences in talent and effort; we provide public education despite differences in parental support; we can tax large inheritances despite differences in genes or accent. It's about reducing the *scale* of the unfair advantage, not eliminating every single variable.

  **How to Counter Him (In British Terms):**

  "Right, you've built a clever argument, but you're setting up a straw man. No one serious thinks we can or should erase every difference between kids – genes, whether your mum reads you stories, your accent. That *would* be monstrous and impossible. Principle (1) isn't about that daft utopia. It's about reducing the *massive, unearned economic advantages* that lock in inequality.

  Think of it like this: We accept we can't make everyone equally talented or give everyone identical parents. But we *do* provide the NHS so your health chances aren't *entirely* down to your parents' wealth. We *do* have state schools so your education isn't *solely* bought by mum and dad. Taxing large inheritances is the same principle applied to capital. It's not about 'envy,' it's about stopping dynastic wealth making a mockery of the idea that effort matters.

  Your point about 'ranking' misses the mark. If everyone inherited a decent lump sum, even if identical, it would still mean fewer people starting life saddled with debt or unable to ever buy a home – that's a huge *absolute* improvement, not just shuffling the rankings. And taxing the mega-inheritances? That just stops a tiny few starting life on third base thinking they've hit a triple.

  So, the principle stands: A fairer society *reduces* the dependence on birth luck where it reasonably can. Pretending we can't touch anything just because we can't touch *everything* is like saying we shouldn't have the NHS because we can't cure all diseases. It's a cop-out."

  This keeps the core principle intact, accepts the reality of untouchable advantages, but firmly argues for mitigating the specific, large-scale economic transfers that inheritance represents. It reframes fairness as achievable progress, not impossible perfection. Good luck next Christmas!
