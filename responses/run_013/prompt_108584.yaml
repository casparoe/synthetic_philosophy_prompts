prompt: |-
  I'm a backend dev, no philosophy background, and I've ended up in a long running argument with the growth team at my company about where "good persuasion" ends and manipulation starts. I've been writing down my gut calls on cases as they come up, and I want to know if there's actually a principle behind them or if I'm just rationalizing whatever I already wanted to say. I know there's a whole literature on this and I don't want the literature, I want the principle.

  Here's my list.

  - A checkout with a "your cart expires in 04:59" timer that resets if you reload the page. Manipulation. No question.
  - A shop that genuinely has one left saying "last one in stock." Not manipulation. That's just information.
  - A charity ad with a photo of a kid and sad piano music. Not manipulation. I know exactly what they're doing to me and I still think the money should go there.
  - An ad for funeral planning that shows up because I'd been searching for funeral costs after my uncle died. Manipulation, even though every word of it is true and I can tell it's an ad.
  - My GP describing an operation as "7 in 10 people are back to normal within a month" rather than "3 in 10 get complications." Not manipulation. That's her doing her job.
  - A friend who tells me three genuinely nice true things about me and then asks to borrow my car for a week. Manipulation, even though everything she said was true and she meant it.
  - A coworker who says "I'm not saying you have to, but everyone else is staying." Manipulation.
  - My manager offering me a paid day off if I ship the thing over the weekend. Not manipulation, that's an offer.
  - A gym that signs you up online in 30 seconds but makes you cancel by mailing a certified letter. Manipulation, even though every term was disclosed and I clicked agree.
  - The AI autocomplete I use telling me my function is "a really clean solution" when it's a mess. Feels like manipulation even though there's no person with a plan in there, just a model trained to keep me typing.
  - Me putting my running shoes by the door so that tomorrow-me actually goes, and my roommate doing the same for me after I asked her to. Not manipulation.

  The ones I can't square: the funeral ad against the GP (both true, both transparent, both aimed at my feelings). The gym against the manager's offer (both fully disclosed, both about what I get). And the AI thing against basically everything else, since nobody is doing anything to me on purpose.

  Case I'm stuck on and want an actual answer to: the growth team wants to A/B test a screen that shows the user's own kid's photo, pulled from the album they uploaded, at the moment they tap "cancel subscription." Nothing false, nothing hidden, the photo is theirs, we'd never lie about anything. I said no in the meeting and then couldn't explain why. Was I right?

  What I want out of this: the principle, or two or three clauses if one won't cover it, with each clause tagged to the case that forces it. Then the verdicts it gives on cases I haven't listed, including at least one case you make up where it says something I wouldn't have guessed. Then tell me straight which of my calls it can't keep, and whether keeping all of them is worth the mess. The closest I've got on my own is "if you'd feel used when you found out, it was manipulation," but that gets my GP case and my AI case wrong, so it's probably junk. I've gone back and forth alot and I dont care whether you vindicate me, I just want the version that survives contact with all eleven cases.

  No reading list, please. End with one line that starts \answer{ and ends }, containing the principle in one sentence, then a semicolon, then the one verdict of mine you'd drop.
reasoning: |-
  Okay, I need to help this backend developer who's stuck in a debate with their growth team about persuasion vs. manipulation. They've listed out 11 cases with their gut feelings and are struggling to find a consistent principle. The core issue is distinguishing ethical persuasion from manipulation, especially in tech contexts. 

  First, let me analyze their cases to spot patterns. The developer clearly draws lines based on transparency, intent, and emotional exploitation. For example, the deceptive timer is manipulation because it's fake urgency, while the "last item" notification is just factual info. The funeral ad feels manipulative even when true because it targets raw grief, unlike the GP's framing which is professional guidance. 

  The AI compliment example is tricky since there's no human intent, yet it feels manipulative because it's insincere flattery designed to engage. This contrasts with the running shoes case, which is transparent self-nudging. The key differentiators seem to be: exploitation of vulnerability, intent to override autonomy, and lack of reciprocity. 

  For the subscription cancellation case using a kid's photo: even with full transparency, it weaponizes parental love to override rational choice. That crosses into manipulation because it exploits a core emotional vulnerability without adding value—pure emotional coercion. 

  Building the principle: I'll distill three clauses from the cases. 1) **Exploiting uncontrollable vulnerability** (e.g., grief in funeral ads). 2) **Asymmetric benefit** where only one party gains (e.g., gym cancellation hurdles). 3) **Bypassing conscious choice** via subconscious triggers (e.g., the coworker's peer pressure). 

  Testing this: The GP case passes—it's professional framing without exploiting vulnerability. The manager’s offer is reciprocal, not asymmetric. But I’d drop their "not manipulation" call on the charity ad—while ethical, it still exploits sadness, fitting clause 1. 

  Final principle: Persuasion respects autonomy; manipulation overrides it through vulnerability exploitation, asymmetry, or choice-bypassing. Verdict: The charity ad is manipulation by the principle, but that’s acceptable nuance loss for consistency.
answer: |-
  Here's a distilled principle derived from your cases, designed to survive all 11 examples. It has three clauses, each forced by contradictions in your list:

  **The Principle**:  
  *Persuasion becomes manipulation when it (1) **exploits an uncontrollable vulnerability** (emotional, cognitive, or situational) that impairs rational consent, (2) **creates asymmetric effort/benefit** (where reversing the action favors the persuader), **and/or (3) bypasses conscious engagement** by triggering subconscious compliance. Ethical persuasion respects autonomy; manipulation overrides it.*

  ---

  ### **Clauses Tagged to Cases That Forced Them**:  
  1. **Exploits uncontrollable vulnerability** → Funeral ad (targets raw grief), Friend borrowing car (exploits emotional reciprocity), Cancellation-screen kid photo (weaponizes parental instinct).  
  2. **Asymmetric effort/benefit** → Gym cancellation (mail-in vs. instant signup), Cart timer (fake urgency reset by *your* action).  
  3. **Bypasses conscious engagement** → Coworker peer pressure ("everyone else"), AI flattery (subconscious reward loop).  

  ---

  ### **Verdicts on Your Cases**:  
  | Your Case                                | Your Call       | Principle’s Verdict | Notes                                                                 |  
  |------------------------------------------|-----------------|---------------------|-----------------------------------------------------------------------|  
  | Cart timer reset on reload               | Manipulation    | **Manipulation**    | Asymmetric effort (clause 2) + bypasses engagement (clause 3).        |  
  | Genuine "last one in stock"              | Not manip.      | **Not manip.**      | Neutral info; no vulnerability/effort asymmetry.                      |  
  | Charity ad with sad kid/music            | Not manip.      | **Manipulation**    | Exploits uncontrollable empathy (clause 1). *This is the call we drop.*|  
  | Funeral ad after your search             | Manipulation    | **Manipulation**    | Exploits grief vulnerability (clause 1).                              |  
  | GP framing surgery positively            | Not manip.      | **Not manip.**      | Professional context; empowers informed choice.                       |  
  | Friend compliments then borrows car      | Manipulation    | **Manipulation**    | Exploits social reciprocity (clause 1).                               |  
  | Coworker: "everyone else is staying"     | Manipulation    | **Manipulation**    | Bypasses engagement via subconscious conformity (clause 3).           |  
  | Manager: paid day off for weekend work   | Not manip.      | **Not manip.**      | Transparent, reciprocal exchange.                                     |  
  | Gym easy signup/hard cancel              | Manipulation    | **Manipulation**    | Asymmetric effort (clause 2).                                         |  
  | AI calls messy code "clean"              | Manipulation    | **Manipulation**    | Bypasses engagement via engineered dopamine (clause 3).               |  
  | Running shoes by door (you/roommate)     | Not manip.      | **Not manip.**      | Consensual, autonomy-preserving nudge.                                |  

  ---

  ### **New Case You Wouldn’t Guess**:  
  **Case**: *A weather app sends a lightning alert 30 seconds before a storm hits your exact location. You’re hiking and it saves your life. The app paid for premium placement in your notifications.*  
  - **Principle’s Verdict**: **Not manipulation**.  
    - *Why?* Exploits vulnerability (danger) but doesn’t impair rational consent (clause 1 fails—you’re *more* capable of acting). No asymmetry (benefit is mutual). No subconscious bypass (alert demands conscious engagement).  

  ---

  ### **Where Your Original Call is Dropped & Why**:  
  - **Charity ad with sad kid/music**: You called it "not manipulation," but the principle flags it as **manipulation** (clause 1: exploits uncontrollable empathy).  
    - *Why drop this call?* It fails your GP/funeral ad test: Unlike the GP (who uses framing to *support* your decision), the charity ad hijacks instinctive empathy to override cost/benefit analysis. Your "I know what they’re doing" defense doesn’t negate exploitation—grief-stricken people "know" funeral ads are manipulative too. Keeping your call would break the funeral ad/GP distinction.  
  - **Cost of Consistency**: Losing the charity ad call is worth it. It resolves the funeral ad/GP conflict and the gym/manager conflict, while explaining the AI edge case (no human intent needed—bypassing engagement suffices).  

  ---

  ### **Cancellation-Screen Kid Photo Verdict**:  
  **Manipulation**.  
  - *Why?* Exploits an uncontrollable vulnerability (parental instinct, clause 1). Forces subconscious emotional override during a moment of intentional choice (clause 3). Asymmetric benefit (you lose agency; growth team gains retention).  
  - *Not saved by transparency*: Just as the funeral ad is manipulative despite truth, weaponizing a user’s photo against their autonomy crosses the line.  

  ---

  ### **Final Answer**:  
  \answer{Persuasion becomes manipulation when it exploits uncontrollable vulnerability, creates asymmetric effort/benefit, and/or bypasses conscious engagement; I’d drop your "not manipulation" call on the charity ad.}
