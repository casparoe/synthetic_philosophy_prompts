prompt: |-
  I'm giving the best man speech at my best freind's wedding next month. He's a philosopher who works on collective intentionality, and so is his fiancée, so about half the room will be their department friends and the other half will be our families, who think collective intentionality is a fancy way of saying they bought a couch together. I just got off the phone with our friend Sam after a three-hour arguement about what the couple's we actually is. Sam thinks it's just a coordination equilibrium: two people with individual intentions that happen to mesh, like drivers at a four-way stop. I think that misses something, because when one of them stops wanting the thing, the other can still be owed something, and you can't get that from a traffic-light theory of joint action. We also got stuck on the regress Sam kept pushing: I intend that we do it, you intend that we do it, I intend that you intend that we do it, and so on, and he says it never bottoms out, while I said that's exactly why you need a joint commitment as a primitive rather than something built out of individual intentions. Then we hit what we started calling the stalled-cart case: two people are pushing a cart, one stops, and we couldn't agree on whether the joint action ended right then or kept going as a failed joint action. Anyway. Write me the best man speech, about five minutes, maybe 700-800 words. It has to land for the philosophers without losing the aunts and uncles. And it has to actually take a side on the Sam question, but do it in a way that doesn't turn into a lecture or make Sam feel ambushed at a wedding. The philosophical stuff should shape the speech -- like, it should stop me from saying you two are one soul or you complete each other, because those are exactly the claims the argument was about, and instead find a way to say something true about a joint commitment that neither of them can unilaterally walk away from, while still being funny and warm. There's a running bit available in the stalled-cart case if you can use it: the families will laugh at the cart, the philosophers will laugh at the stall. But don't overexplain it. Also, the couple has a dog named Bishop, if that helps. No need to quote anyone or cite any books. Just the speech.
