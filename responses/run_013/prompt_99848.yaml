  The Law represents Cartesian mechanism—repetition without understanding. The reversion to instinct underscores that ingrained habits can't override innate nature, aligning with Descartes' view of animals as automata.

  The novel's value lies in visceral impact. It makes the doctrine feel monstrous by showing suffering creatures treated as machines. Prendick's mercy-kill is both argument and sentiment: it rejects Moreau's ethos, affirming that suffering matters regardless of reason. The horror lies in the ethical void when consciousness is denied.

