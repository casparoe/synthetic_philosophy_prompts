prompt: |-
  I've been going back and forth with a friend for like a year about whether me eating meat actually does anything wrong, and we keep talking past each other, so I want an actual number out of you instead of a vibe.

  The claim I want your credence on: for a typical middle-class person in a rich country right now, buying and eating factory-farmed meat is morally wrong, even though one purchase makes no detectable difference to how many animals get farmed. I'm at about 0.55, my friend's at about 0.15. Give me your own number, but mostly give me the decomposition: the sub-questions it hinges on, a rough probability for each, one line of justification each, how they combine into the final number, and which sub-question the final number is most sensitive to.

  To keep it from being hand-wavy, work inside this specific setup (I made it up but it seems realistic): the farm's capacity comes in lumps, so it only adds another barn every ~50,000 chickens worth of demand; the number of chickens alive at any time is set by the price/demand curve and barely moves for one purchase; but my buying does slightly raise the odds that the people around me keep buying, and those people add up. Also, assume for half the question that the animals live decent-ish pasture lives, so the harm isn't a miserable life but the killing and the land/feed use — I want to know how much that assumption moves your number versus the factory version.

  Then tell me which single sub-question my number and my friend's number most likely disagree about, and what argument or piece of evidence would move you most. And how much of your number is resting on contested meta-ethics (like whether "wrong" requires actually making a difference) versus empirical stuff about how supply chains respond? I don't have alot of philosophy background so keep the terms plain-ish.
