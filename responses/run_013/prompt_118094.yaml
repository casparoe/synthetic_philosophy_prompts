  Here’s a lean, embodied draft of your story—concepts woven into action, silences, and the weight of untranslatable grammar. No lectures, just the cold mechanics of meaning in a room where language is a trapdoor:

  ---

  **Title:** *Evidentials*  

  The dialect of the Wharfside folk doesn’t permit naked facts. Every declaration wears its origin like a barnacle: *-ak* for eye-witnessed, *-resh* for hearsay, *-sul* for gut-feeling. As interpreter for the Port Middleton Magistrate’s Court, Marta’s job is to scrape these off, leaving plain English behind. The law demands it.  

  The case: Jonah Vale, accused of cutting the *Blue Cormorant*’s nets. The prosecution’s case hangs on one sentence from Old Man Hemlock, delivered in a wet rasp:  

  > *“Jonah Vale stood by them cut nets, ak.”*  

  *Ak*. Seen it himself. Clear as gulls on a buoy.  

  But Hemlock’s rheumy eyes flicker sideways as he says it. Marta knows the truth: Hemlock *heard* it from his drunk nephew, who *surmised* it from Jonah’s grudge. It should be: *“Jonah Vale stood by them cut nets, resh-sul.”* Hearsay piled on guesswork.  

  **FIRST DRAMATIZATION: Implicature & Cancellation**  
  Prosecutor Finch leans in, silkily: “So, Mr. Hemlock… Jonah Vale was *seen* at the nets?”  
  Hemlock shifts. “He was there, sure.”  
  Finch turns to the bench: “*Seen*, Your Honour. Direct evidence.”  
  Later, under cross, Hemlock backpedals: “I never said *I* seen him! Just… he was there!”  
  Defence snaps: “But you implicated—”  
  Finch cuts in: “Objection! My witness stated a fact: *He was there*. Any… *colouration* is the interpreter’s burden, not his intent.”  
  The magistrate nods. Words are water; their spill can’t be unmopped. Hemlock’s denial doesn’t contradict his utterance—only its shadow. The shadow clings.  

  **Marta’s Choice:**  
  Render *“stood by them cut nets, ak”* as:  
  1.  *“Jonah Vale was seen at the cut nets.”* (A lie by the dialect’s lights, but Finch’s preferred weapon)  
  2.  *“It is said Jonah Vale was at the cut nets.”* (True to the *resh*, but vague—likely acquittal)  
  3.  *“Jonah Vale was at the cut nets.”* (Bare assertion; kills nuance, kills Jonah)  

  She chooses #3. The gavel of grammar. Jonah flinches as she speaks.  

  **SECOND DRAMATIZATION: Non-Detachable Meaning**  
  The *-ak* suffix isn’t context—it’s bone. Marta tries smuggling the doubt out:  
  “*Jonah Vale was observed near the damaged nets…*”  
  Finch pounces: “Interpret accurately, Miss Voss! Did the witness say ‘observed’ or ‘stood by’? And where is the directness?”  
  The dialect’s certainty is fused to the verb. Paraphrase bleeds it white. English has no vessel for this knowing. The *-ak* is indelible ink; her translation paper must soak it or tear.  

  **THE PRIVATE UNDERSTANDING:**  
  Jonah’s eyes lock onto Marta’s. No words. Just a slow blink—the Wharfside signal for *I know you hear what I cannot say*. Years ago, when Marta’s brother drowned, Jonah used that blink across a crowded wake. *I see your grief*. Reflexivity: an intention recognized solely *by* its recognition. Proof dissolves in the act.  

  **CLIMAX: Reflexivity & The Unrecordable**  
  After the verdict (guilty; her bare assertion the keystone), guards lead Jonah out. He stops before Marta. Finch is shuffling papers. The Magistrate adjusts his spectacles.  

  Jonah’s voice is raw salt: “You spoke clean, Miss Voss. Just… grammar.”  

  He pauses. Lets the Wharfside grammar *do* its work:  
  > *“The nets were cut by another, ak.”*  

  He uses *-ak*. The eye-witness marker. But his gaze drills into hers, heavy with the unspoken: *You know I wasn’t there. You know I can’t have seen it. I need you to know I’m trusting you with this lie.*  

  It’s a bomb wrapped in syntax. He intends her to recognize:  
  1. He’s lying about seeing it (*-ak* is false).  
  2. He’s telling the truth about the real culprit.  
  3. He’s using *her* knowledge of his innocence as the conduit.  
  4. The recognition *is* the message.  

  She gives the faintest nod—*received*. Not agreement. Not promise. Just: *I see your intention*.  

  Finch glances up. “Something to add, prisoner?”  
  Jonah’s face blanks. “No, sir. Just… thanking the interpreter.”  

  The exchange evaporates. No note-taker caught it. To the court, it was noise. To Marta, it was a cathedral of meaning built and demolished in three seconds.  

  **ENDING: Exact, Not Consoling**  
  Later, Marta signs the transcript:  
  > *DEFENDANT: “You spoke clean, Miss Voss. Just grammar. The nets were cut by another, I saw it myself.”*  

  She writes the lie Finch will toast and the Magistrate will file. The *-ak* is flattened to “I saw it myself.” Jonah’s true meaning—the plea, the trust, the reflexive act of being *understood*—leaves no trace. It exists only in the space between her nod and his retreating back. A meaning that crossed a language boundary only to hit the wall of the record. The law deals in sayings. Not in recognitions.  

  ---

  **Embedded Concepts:**  
  - **Cancelled Implicature:** Hemlock’s retreat fails; the court holds Finch’s *spin* as truth because the words allowed it.  
  - **Non-Detachable Meaning:** The *-ak* suffix’s certainty clings even as Marta wrestles with synonyms. Grammar as cage.  
  - **Reflexivity:** Jonah’s *-ak* bomb—his meaning lives *only* in Marta recognizing his layered intent. The court sees a lie; she sees a trust fall.  
  - **Sentence Shape:** Hemlock’s use of *-ak* implies eyewitness evidence inherently. No context softens it; the grammatical form *itself* carries the hint.  

  **Silences Doing Work:**  
  - Marta’s choice to strip *-ak* isn’t debated; it’s felt in Jonah’s flinch.  
  - The blink at the wake—backstory without exposition.  
  - The nod—complicity without confession.  

  The ending leaves the machinery of meaning exposed: Grice’s "intention to be recognized" survives the dialect, only to die in the court’s ledger. What’s *meant* can travel farther than what’s *said*, but not here. Not on the record.
