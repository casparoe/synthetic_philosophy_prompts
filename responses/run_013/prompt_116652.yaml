prompt: |-
  ok so I just had a two and a half hour argument with my friend Dan about whether his landlord coerced him, and I've come out of it with a pattern I can't name, and it's driving me up the wall. Sorry for the ramble, I'm still annoyed.

  The case: Dan's landlord said he could stay, but the rent goes up 300 a month, otherwise he's out at the end of the month. Dan said fine. Dan thinks he agreed. I think he didn't really agree to anything. We got absolutely nowhere.

  What's bugging me is that I can make near-identical cases where I'd say the opposite, and I can't find what changes between them:

  - Doctor: 'take this pill every day or you'll probably be dead in a year.' I say yes. Nobody calls that a threat, nobody says my yes doesn't count. If anything I'm grateful.
  - Boss: 'work Saturday or you're out.' I'd say the boss is a jerk. I would not say I didn't agree to work Saturday.
  - Boss, other version: 'sleep with me or you're out.' Now my yes is not a yes, obviously.
  - Mugger: 'your wallet or your teeth.' There's no agreement here at all as far as I can tell, even though I'd hand the wallet over.
  - Landlord: the one above, which I'm definately confident is on the mugger side of the line and Dan's just as confident it's on the boss-Saturday side.
  - Shopkeeper during a flood: '500 for the boat ride across.' He's not threatening me and he didn't cause the flood, and if I pay then fine, I paid — but everyone I know would say he did something wrong to me. I keep wanting to put this one in the same bucket as the landlord, and I suspect it's actually a seperate bucket, which is part of what I want you to sort out.

  In all six, someone's hanging a bad outcome on my not doing what they want. The size of the bad outcome doesn't sort them — losing my job is worse than losing 300 a month, but one counts and one doesn't. First theory: maybe it's whether the other person created the bad outcome. Dies immediately, the boss creates the 'you're fired' outcome too.

  Second theory: it depends whether they were allowed to hang that consequence on me in the first place — boss is allowed to ask for Saturday, not for sex. But that's a circle, isn't it? Whether the landlord was allowed to demand the extra 300 seems to depend on whether Dan validly agreed to it, which is the exact thing I'm trying to figure out.

  So: is there a name for this? I have a feeling there's something in ethics or law about it but I've never studied either. And I don't want just a word. I want to know what the thing actually is, where it stops, and which of my six cases each candidate answer gets right.

  Give it to me as: 'The pattern' (~150 words), where you say back what I've noticed and say whether it has an established name or you're coining one; 'What it's not' (four short paragraphs) on the nearby ideas I'd probably confuse it with, and where each comes apart from mine; 'The best account' (~300 words) laying out the strongest version of the distinction and testing it against my six cases one by one; 'Edges' (two or three cases) where that account gets weird or contested and what you'd do with them; and 'Verdict' (three sentences) on whether I've found a real thing or just restated something older with worse vocabulary. Skip the reading list, I'm not going to read it.
reasoning: |-
  Okay, the user is frustrated after a long argument and needs clarity on what distinguishes coercive agreements from legitimate ones. They've outlined six scenarios where someone faces a negative consequence for non-compliance, but the moral/legal status varies wildly. Their core question is: what invisible line separates the landlord case (which feels coercive) from the boss-Saturday case (which doesn't)? 

  First, I need to validate their intuition—they're absolutely right that there's a pattern here. The common thread is *contingent threats*, but that's too broad. The key is the *illegitimacy of the threat*, not just the bad outcome. 

  Breaking down their theories: 
  - "Created the bad outcome" fails because the flood shopkeeper didn't cause the flood yet still feels wrong. 
  - "Allowed to impose consequence" risks circularity, as they noted. 

  The strongest framework is *wrongful exploitation of vulnerability*. Three factors matter: 
  1. **Power asymmetry** (landlord/tenant vs. doctor/patient) 
  2. **Illegitimacy of demand** (sex vs. overtime) 
  3. **Baseline entitlement** (is the threat depriving you of something you're owed? Rent stability vs. life-saving pills). 

  Testing against their cases: 
  - Doctor: Legitimate demand, no exploitation. 
  - Boss-Saturday: Harsh but within employment norms. 
  - Boss-sex: Illegitimate demand exploiting power. 
  - Mugger: Pure coercion, no pretense of right. 
  - Landlord: Exploits housing vulnerability to extract unearned value. 
  - Flood shopkeeper: Exploits dire need despite no wrongdoing—this is where the framework strains, revealing edge cases about "fair" profit vs. gouging. 

  The landlord case sits closer to the mugger than the boss because housing is a basic need, and the rent hike isn't tied to increased costs—it's predation. Dan might see it as "business," but ethics isn't just about surface consent. 

  Verdict: Yes, this is real—it's the core of *contractual duress* doctrine in law and *exploitative coercion* in ethics. Their examples brilliantly expose how context transforms identical threat structures into morally distinct categories.
answer: |-
  ### The Pattern  
  You've identified a core tension in how we perceive agreements under pressure: **when does a "choice" framed as "do X or suffer Y" invalidate consent due to coercive dynamics?** This isn't just about threats or consequences—it's about the *legitimacy of leveraging vulnerability*. The pattern has established names: **"duress"** (in law) or **"coercive proposal"** (in ethics), but its boundaries are contested. Your cases reveal that duress hinges on whether the *proposer exploits an unjust power imbalance or creates the harm*, not just the severity of the consequence.

  ### What It's Not  
  1. **Pure Threat Assessment:** It’s not solely about harm size. Losing a job > losing $300, yet Boss-Saturday feels "valid" while Landlord doesn’t. Severity matters, but isn’t decisive.  
  2. **Causation of Harm:** The flood shopkeeper *didn’t cause* the flood, yet we condemn him. Meanwhile, the Doctor *didn’t cause* the illness but isn’t blamed. Causation isn’t the key.  
  3. **Legality of the Demand:** Boss demanding sex is illegal, while demanding overtime may be legal—but legality often *follows* moral judgments like yours, not explains them.  
  4. **Consent Surface-Level:** Saying "yes" doesn’t resolve it. Mugger gets your wallet via "consent," but we reject it as involuntary. The *quality* of consent is the issue.

  ### The Best Account  
  The strongest framework is **"wrongful exploitation of vulnerability"**:  
  - **Legitimacy of the Demand:** Is the demand itself justified? (e.g., Doctor’s pill is medically necessary; Boss-Saturday aligns with labor norms).  
  - **Baseline Entitlement:** Are you being denied something you’re *owed*? (e.g., Tenant deserves stable housing per lease; Employee deserves job security absent breach).  
  - **Power Asymmetry + Harm Creation:** Did the proposer *weaponize* unavoidable vulnerability? (e.g., Landlord abuses control over shelter; Mugger creates the threat).  

  **Applied to your cases:**  
  1. **Doctor:** Legitimate demand (healthcare), no entitlement to *avoid* treatment. **Valid agreement.**  
  2. **Boss-Saturday:** Demand may be harsh but normatively acceptable (work flexibility). You’re not *owed* exemption from overtime. **Valid agreement.**  
  3. **Boss-Sex:** Illegitimate demand (sexual coercion), exploits job vulnerability. **Invalid "agreement."**  
  4. **Mugger:** Creates the threat, demands unrelated to any right. **No agreement—theft.**  
  5. **Landlord:** Exploits tenant’s need for shelter to extract unearned value (no cost increase justified). Tenant is *owed* lease stability. **Coercive—invalid agreement.**  
  6. **Flood Shopkeeper:** Legitimate service? Yes. But exploits existential vulnerability *he didn’t create*, violating fairness norms. **Not coercive duress, but unethical profiteering** (separate bucket: exploitation of necessity).

  ### Edges  
  1. **The Lifesaving Drug Monopoly:** "Pay $1M for this drug or die." Is this the Doctor (legitimate) or Shopkeeper (profiteering)? *Account:* If the price is detached from costs/risk, it exploits vulnerability—unethical but not duress if no prior entitlement exists.  
  2. **Union Busting:** "Renounce the union or you’re fired." *Account:* Illegitimate demand (violates labor rights), exploits power imbalance. **Coercive, invalid.**  
  3. **Climate Crisis:** Oil company raises prices 300% during a fuel shortage. Like the flood shopkeeper? *Account:* Not duress (no direct threat), but potentially exploitative if prices are manipulative.

  ### Verdict  
  You’ve absolutely found a real thing: the **moral/legal distinction between "hard bargaining" and "coercive duress"** turns on wrongful exploitation, not just consequences or surface consent. Your cases expose why debates like Dan’s rage—society disputes when vulnerability-crossing becomes *unjust*. Landlord is closer to Mugger than Boss-Saturday because shelter is a basic need, and the demand exploits contractual power illegitimately. Dan’s "agreement" smells coerced because the landlord weaponized housing insecurity.
