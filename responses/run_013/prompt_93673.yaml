prompt: |-
  I'm the science editor at a mid-size online magazine and I get two or three pitches a week that smell like pseudohistory -- a guy who's re-dated all of ancient history by running statistics on old chronicles, someone who's found a lost civilisation under the ice, someone with a theory that the pyramids are thousands of years older than archaeologists say. Right now I decide by gut in about twenty minutes: run it as science, run it with a 'contested' tag, or send a polite no. I'd like a procedure I can actually run instead, grounded in whatever philosophy of science has to say about where science stops and pseudoscience starts -- the questions to ask in order, what counts as a good enough answer to each, where it stops with a no, and where it hands the call to a person because it's a values question rather than a factual one. Be honest about wich steps are just my judgment wearing a lab coat. Then run it on three: the statistical re-dating of history, the lost ice civilisation, and one where I'd personally like the answer to come out the other way -- say a heterodox re-dating of a site that uses bog-standard methods but annoys the consensus. My fact-checker has maybe an hour, and the editor-in-chief signs off on anything we run with a disclaimer. Finish by telling me what the procedure can't do.
reasoning: |-
  Okay, the user is a science editor dealing with pseudohistory pitches and wants a systematic, philosophy-of-science-based vetting procedure. Let me unpack this carefully. 

  First, the core tension: they need to filter out pseudoscience while staying open to legitimate heterodoxy. Their current gut-check method isn't scalable or defensible. The unspoken pressure here is maintaining credibility without stifling innovation - that's every science editor's tightrope walk.

  Hmm... they're smart to ask where the "lab coat" covers subjective judgment. Real philosophy of science acknowledges gray areas. Popper's falsifiability is table stakes but insufficient alone - Kuhn's paradigms and Lakatos' research programmes feel more useful here. Also must incorporate practical constraints: only 1 hour for fact-checking, EIC signs off on disclaimers. 

  For the framework... needs clear exit ramps to "no" but also off-ramps to human judgment calls. Should structure it as a decision tree with weighted red flags. Key metrics: methodological soundness (can they show their work?), engagement with existing literature (do they ignore counter-evidence?), and epistemic humility (do they claim conspiracy when challenged?). 

  Testing three examples is crucial. That pyramid dating one... classic chronological revisionism. Red flags: cherry-picked data, no error margins, misapplied statistics. Ice civilization? Textbook "extraordinary claims require extraordinary evidence" territory - no peer-reviewed geoarchaeology, just vibes. The "annoying consensus" case is trickiest - here the procedure must distinguish unpopular from unsupported. 

  Biggest limitation they must accept: this won't catch everything. Some pseudoscience is highly sophisticated (look at string theory debates). And when institutional bias might be in play? That's inherently political. The procedure's strength is forcing transparency about why we're rejecting things. 

  Final note to self: remind them disclaimers don't absolve ethical responsibility. Running bunk with a "contested" tag still lends credibility. Better to kill 99 fringe ideas than platform one damaging one.
answer: |-
  Here's a structured, philosophy-of-science-grounded vetting procedure designed for efficiency (fact-checker: 1 hour max), with clear exit points and transparency about judgment calls. It prioritizes **methodological rigor** and **epistemic responsibility** over novelty or appeal.

  **The Vetting Procedure: "The Epistemic Funnel"**

  1.  **Stage 0: Initial Scan (Your Gut Check - 5 mins)**
      *   *Question:* Does this pitch clearly fall into *established, well-supported* pseudoscience (e.g., flat earth, ancient aliens without evidence) or obvious crackpottery (rambling, conspiracy-laden)?
      *   *Good Enough Answer:* "Yes, it fits known pseudoscience patterns" OR "No, it's novel or uses seemingly technical language."
      *   *Exit:* If **Yes**, **Polite No**. (Saves time. *Judgment Call:* Defining "established pseudoscience" relies on your experience.)
      *   *Proceed:* If **No**, to Stage 1.

  2.  **Stage 1: Falsifiability & Testability (Core Science - 10 mins)**
      *   *Question 1a (Popper):* **Is the core claim falsifiable?** Could evidence *conceivably* prove it wrong?
      *   *Question 1b:* **Does the pitch propose *specific, concrete* methods to test the claim beyond the author's initial work?** (e.g., "We used X method, but Y or Z method could confirm/refute this.")
      *   *Good Enough Answer:* Clear "Yes" to both. Claims must be structured so others can potentially disprove them, and the author acknowledges this.
      *   *Exit:* If **No** to either, **Polite No**. (Lack of falsifiability is a hallmark of pseudoscience. *Judgment Call:* Assessing "conceivably" requires interpreting the claim's scope.)
      *   *Proceed:* If **Yes**, to Stage 2.

  3.  **Stage 2: Methodology & Evidence (Rigor Check - 20 mins - Fact-Checker Focus)**
      *   *Question 2a:* **Does the author describe their methods with sufficient detail for a specialist to *in principle* replicate or evaluate them?** (e.g., named statistical tests, data sources cited, clear logic chain).
      *   *Question 2b:* **Does the author engage with *relevant counter-evidence* or *mainstream explanations*?** Do they explicitly address why their claim differs and how they resolve contradictions?
      *   *Question 2c:* **Are there glaring methodological red flags?** (e.g., misapplying techniques, ignoring error margins/uncertainty, cherry-picking data, extraordinary claims based solely on visual interpretation).
      *   *Good Enough Answer:* "Yes" to 2a (basic transparency), "Attempts to engage" for 2b (doesn't need full refutation, but can't ignore), "No major red flags" for 2c.
      *   *Exit:* If **No** to 2a, **No** to 2b (ignores counter-evidence), or **Yes** to 2c (major red flags), **Polite No**. (Failure here indicates poor scientific practice. *Judgment Call:* Severity of red flags & sufficiency of engagement.)
      *   *Proceed:* If passes, to Stage 3.

  4.  **Stage 3: Community & Consensus (Context Check - 15 mins)**
      *   *Question 3a:* **Has this work been subjected to peer review?** If yes, where? If not, why not? (Be wary of only "friendly" journals/conferences).
      *   *Question 3b:* **Does the author acknowledge the relevant scientific *consensus* (if one exists) and provide a *reasoned critique* of its limitations?** (Not just dismissal as "dogma").
      *   *Question 3c:* **Is there *independent* support?** (e.g., co-authors from relevant institutions, cited by credible sources *other* than the author/promoter).
      *   *Good Enough Answer:* Peer review is a strong plus. Absence requires strong justification. Must acknowledge consensus meaningfully (3b). Independent support is a plus but not mandatory for novelty. *Lack* of independent support + rejection of consensus *without strong evidence* is a red flag.
      *   *Exit:* If **No meaningful engagement** with consensus (3b) **AND** **No peer review** **AND** **No independent support**, **Polite No** likely. (Indicates isolation from scientific discourse. *Judgment Call:* Strength of justification for lack of review/support & quality of consensus critique.)
      *   *Proceed:* If passes, to Stage 4.

  5.  **Stage 4: Presentation & Implications (Editorial Judgment - 10 mins)**
      *   *Question 4a:* **Is the pitch presented with appropriate *epistemic humility*?** (Acknowledging uncertainty, limits of the study, need for further validation) or with excessive certainty and grandiosity?
      *   *Question 4b:* **What is the *potential harm*?** (Promoting harmful ideologies, damaging public trust in science, wasting reader time)?
      *   *Question 4c:* **What is the *novelty/public interest* value vs. the *risk* of platforming shaky science?**
      *   *Good Enough Answer:* Humility preferred. Low/no identifiable harm. Public interest justifies potential risk.
      *   *Exit/Decision:*
          *   **High Certainty + High Harm Risk:** **Polite No**.
          *   **Low Humility + Low Novelty/High Risk:** **Polite No**.
          *   **Good Humility + Genuine Novelty + Manageable Risk:** **Run with 'Contested' Tag**.
          *   **Strong Methodology + Solid Peer Review + Novelty:** **Run as Science** (rare for these pitches).
      *   *Judgment Call:* Entirely. This is values-based editorial weighing of responsibility, interest, and potential consequences.

  ---

  **Application to Your Three Cases:**

  1.  **Statistical Re-Dating of All Ancient History:**
      *   **Stage 0:** Proceed (Novel/technical).
      *   **Stage 1:** Likely passes (Claims *are* falsifiable in principle, might suggest tests).
      *   **Stage 2:**
          *   2a: *Maybe*. Depends on code/data sharing. Often opaque.
          *   2b: **FAIL.** Typically dismisses archaeology/textual criticism as "corrupted" without detailed refutation. Ignores dendrochronology, radiocarbon calibration, stratigraphy.
          *   2c: **Major Red Flags.** Ignores error propagation, assumes chronicles are independent/accurate, cherry-picks sources. *Massive* revision requires *extraordinary* evidence, not just stats on texts.
      *   **Exit:** Stage 2 - **Polite No.** (Core failure: Ignores counter-evidence & massive methodological flaws).

  2.  **Lost Civilisation Under the Ice:**
      *   **Stage 0:** Proceed (Novel/spectacular).
      *   **Stage 1:** *Maybe*. Claim *is* falsifiable (dig and find nothing). Often light on *specific, feasible* tests proposed beyond their initial "discovery".
      *   **Stage 2:**
          *   2a: **FAIL.** Usually relies on ambiguous satellite images/radar, vague geological interpretations. No clear archaeological methodology presented.
          *   2b: **FAIL.** Dismisses glaciologists/archaeologists explaining natural formations or lack of evidence for human habitation in that period/place. No engagement.
          *   2c: **Major Red Flags.** Extraordinary claim based on low-resolution/ambiguous data. Ignores climate history & feasibility. Often "data" is just pictures.
      *   **Exit:** Stage 2 - **Polite No.** (Core failure: No credible methodology, ignores counter-evidence, massive red flags).

  3.  **Heterodox Re-Dating Using Bog-Standard Methods (Annoying Consensus):**
      *   **Stage 0:** Proceed (Seemingly conventional).
      *   **Stage 1:** Passes (Falsifiable, methods imply tests).
      *   **Stage 2:**
          *   2a: Passes (Methods described: e.g., specific radiocarbon dating protocol).
          *   2b: **Key Test.** *Do they engage?* Do they address *why* previous dates are wrong? Do they critique specific studies/methods? Or just say "consensus is stubborn"? **Quality of engagement is critical.**
          *   2c: Check for cherry-picking samples, ignoring context/stratigraphy, misapplying calibration curves. Might be subtle.
      *   **Stage 3:**
          *   3a: Submitted to journals? Rejected? Why? (Peer review hurdle is crucial here).
          *   3b: Must acknowledge consensus and critique it *substantively* (e.g., "Smith 2010's dates rely on contaminated sample X, our protocol avoids this by Y").
          *   3c: Any co-authors? Cited by anyone neutral?
      *   **Stage 4:**
          *   4a: How certain are they? Grandiose claims?
          *   4b: Low harm risk (just academic dispute).
          *   4c: High novelty/interest *if* credible challenge. High risk if shaky.
      *   **Decision Path:**
          *   **Passes 2b/3a/3b Well:** Strong methodology + good critique + peer review (or plausible submission) = **Run as Science** or **Run with 'Contested' Tag** (depending on strength of challenge).
          *   **Fails 2b/3b (Poor Engagement):** Dismissive of consensus without strong evidence = **Polite No** (Stage 2/3 exit).
          *   **Passes 2b/3b Marginally & Fails 3a:** Good faith effort but lacks peer review support = **Run with Strong 'Contested' Tag + Disclaimer** emphasizing lack of peer review and ongoing debate. (*High Judgment Call*).

  ---

  **What the Procedure CAN'T Do:**

  1.  **Guarantee Truth:** It filters for *scientific credibility* and *responsible discourse*, not absolute truth. Good science can be wrong; novel ideas can be right.
  2.  **Detect Sophisticated Fraud:** Deliberate, well-hidden data manipulation can pass initial checks. (Fact-checker's hour isn't a forensic audit).
  3.  **Resolve Deep Scientific Disputes:** It flags whether a claim *engages responsibly* with the dispute, but won't settle who's *right* in complex debates (e.g., heterodox chronology).
  4.  **Eliminate Judgment Calls:** Stages 2c, 3b, 3c, and all of Stage 4 inherently rely on editorial experience and values. The procedure makes these calls explicit and structured, not absent.
  5.  **Force Consensus Engagement:** If an author *refuses* to engage with mainstream science (Stage 2b), the procedure flags it as unscientific, but it can't make them engage.
  6.  **Prevent Harm from "Contested" Tags:** Running something as "contested" still platforms it and can lend undue credibility or fuel conspiracy narratives ("They don't want you to know!"), even with disclaimers. The procedure helps weigh this risk (Stage 4b/c) but can't eliminate it.
  7.  **Account for Institutional Bias:** Sometimes the "consensus" *is* overly rigid or wrong. The procedure (Stage 3b) demands a *reasoned critique* from the challenger but can't independently verify if gatekeeping is happening. It relies on the quality of the challenger's argument.

  **Conclusion:** This procedure systematizes your gut check using core scientific principles (falsifiability, methodology, evidence engagement, peer review). It provides clear "No" exits for pseudoscience hallmarks (unfalsifiability, ignored counter-evidence, major methodological flaws) and forces explicit editorial judgment for borderline cases, particularly those challenging consensus. It maximizes efficiency by front-loading disqualifying criteria. Remember: **When in significant doubt, especially with high-risk claims, "No" is the scientifically responsible default.** Use the "Contested" tag sparingly and only for work showing genuine methodological rigor and responsible engagement with the field, even if controversial.
