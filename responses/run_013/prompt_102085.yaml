prompt: |-
  I'm a novelist, and I've somehow ended up on the grant committee of a small foundation that funds research on human nature (they wanted a storyteller in the room, dont ask). We meet Thursday and I have to circulate a short written opinion before then. On the table: a psych lab's proposal that boredom is an adaptation -- that the itch of restlessness is a signal our current goals aren't paying off, evolved to shove us toward exploring new ones -- and they want money to test whether people high in boredom-proneness actually explore more and end up with more status and mating success down the line. Half the committee is thrilled; the other half says you could spin any result either way, so it's a just-so story with a budget, and we shouldnt be funding untestable evolutionary stories no matter how pretty they are. Give me a memo that lands on a concrete recommendation -- fund it, reject it, or fund it with conditions -- with the reasoning laid out, say clearly what evidence would actually settle the question rather than leaving room for the story to absorb anything, and be honest about the strongest thing the losing side has going for it. One page or less, 500 words max, American English.
reasoning: |-
  Okay, the user is a novelist serving on a grant committee for human nature research. They need a memo evaluating a proposal about boredom as an adaptation. The committee is split: half think it's exciting, half call it an untestable "just-so story." The memo must recommend funding, rejection, or conditional approval; specify testable evidence; and acknowledge the strongest counterargument—all under 500 words.

  Hmm, the core tension is testability. The proposal claims boredom proneness leads to exploration, status, and mating success. Critics argue results could be spun either way—e.g., if bored people explore more but gain less status, researchers might say "exploration failed" or "status isn't the only metric." That’s a valid concern.  

  To satisfy critics, the memo should demand falsifiable predictions. For example: if high boredom leads to more exploration AND objectively measured status gains (e.g., income, job promotions), that supports adaptation. If they explore more but end up worse off, it undermines the thesis. Crucially, the proposal must predefine "success" metrics—no retroactive spin.  

  The losing side’s best point? Evolutionary psych often overfits narratives. But conditional funding could force testability: require pre-registration, longitudinal tracking, and objective success markers. That way, it’s not "just a story."  

  Recommendation: Fund with strict conditions. Highlights rigor while acknowledging storytelling risks—something a novelist would appreciate.  

  Word count check: Draft hits ~450 words. Nails the "concrete evidence" ask by specifying income/job titles as metrics. Strongest counterargument gets its own line ("Just-so stories persist...").  

  Solid for a novelist-turned-grant-referee. Mic drop.
answer: |-
  **MEMORANDUM**  
  **TO:** Grant Committee  
  **FROM:** [Your Name], Novelist & Committee Member  
  **DATE:** [Date]  
  **SUBJECT:** Recommendation on "Boredom as Adaptation" Proposal (ID# [Number])  

  **Recommendation:** **Fund with Conditions**  

  ### Reasoning  
  The core hypothesis—that boredom is an evolved signal prompting exploration to enhance long-term fitness—is theoretically compelling and addresses a gap in understanding a universal human experience. However, the strongest critique (that results could be spun post-hoc) is valid. To justify funding, the study **must pre-commit to falsifiable predictions** and **objective metrics** that prevent narrative flexibility.  

  ### Critical Testability Conditions  
  The proposal earns support **only if** the researchers agree to:  
  1. **Pre-register Hypotheses & Null Criteria:**  
     - Pre-specify *exact thresholds* for "exploration" (e.g., quantified career/relationship changes) and "success" (e.g., income growth ≥20%, partner count/quality, or social rank via standardized scales).  
     - Define *in advance* what results would **falsify** the adaptation claim (e.g., high boredom → exploration but *no* status/mating gains, or *declines* in objective outcomes).  
  2. **Longitudinal Rigor:**  
     - Track outcomes over ≥5 years (not self-reported "intentions"). Use administrative/data-linked measures (tax records, employment history) where ethically feasible.  
  3. **Control for Confounders:**  
     - Measure impulsivity, depression, and IQ. If boredom’s effects disappear when controlling for these, the "adaptation" narrative weakens.  

  ### What Settles the Question?  
  **Conclusive support requires:**  
  - A statistically significant pathway: **High boredom → Increased exploration → Tangible gains in resources/reproduction**.  
    - *Example evidence:* Boredom-prone individuals switch jobs/partners more often AND achieve higher income/more stable relationships than matched controls.  
  **Conclusive rejection requires:**  
  - Exploration without gains, OR gains linked solely to confounders (e.g., only impulsive subjects benefit).  

  ### Strongest Point for the Losing Side (Rejection)  
  Just-so stories *can* persist by redefining "success" retroactively (e.g., "exploration is adaptive *because* it builds character, even without status"). Without pre-registered null criteria, positive results could be overinterpreted and negative results dismissed. Evolutionary hypotheses are especially vulnerable to this.  

  ### Why Fund Conditionally?  
  Boredom’s universality demands investigation. A well-designed test could pioneer methods for studying "subjective states as adaptations." If the team accepts rigorous conditions, this transitions from storytelling to actionable science. If they refuse, the critique of untestability stands.  

  **Action:** Table funding pending PI’s written acceptance of conditions (1)-(3) by EOD Tuesday.  

