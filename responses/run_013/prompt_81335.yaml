answer: |-
  ### Essay Question  
  "Using the KT-7 bacterium case, explain whether the mineral shell has a biological function:  
  (a) before transfer to the tank,  
  (b) immediately after transfer, and  
  (c) after twenty generations of serial passage.  
  Apply the *historical selection account* (where function requires past selection for a trait) and the *current capacity account* (where function depends on a trait’s present contribution to a system’s survival/reproduction).  
  Then, determine whether KT-7m’s partial shell is a malfunction, and under which account.  
  Finally, argue whether this case shows the two accounts conflict, addressing the objection that they merely answer different questions."  

  ---

  ### Model Answer (700 words)  
  **Historical vs. Current Capacity Accounts**  
  The *historical selection account* defines a trait’s function by its evolutionary history: a function exists only if the trait was *selected* for enhancing survival/reproduction in ancestral populations. The *current capacity account* defines function by present utility: a trait has a function if it *currently* contributes to a system’s (e.g., organism’s) fitness, regardless of its past.  

  **Pre-Transfer: No Function vs. Potential Utility**  
  - *Historical view*: Pre-transfer, the shell spread by **drift, not selection**. Though present, it conferred no survival advantage historically. Thus, it **lacked a biological function**—its persistence was non-adaptive "noise."  
  - *Current capacity view*: The shell **had no actual function** before transfer, as it provided no *current* fitness benefit. However, it had a *capacity* to form a shell. Crucially, this account does not assign function based on latent capacities—only active contributions count.  

  **Post-Transfer (Immediately): Still No Historical Function, but Current Function Emerges**  
  - *Historical view*: The shell now aids survival (30% increase), but this advantage is **recent and context-dependent**. As there was **no past selection** for shell-building in marine environments, it still **lacks a function**. Selection history hasn’t changed; novelty negates function.  
  - *Current capacity view*: In the high-UV/high-salinity tank, the shell **actively enhances survival** (blocks UV, mitigates salinity). It thus **gains a function**: protecting the cell. Function arises from real-time fitness contribution, irrespective of origin.  

  **After Twenty Passages: Historical Function Stabilizes; Current Function Persists**  
  - *Historical view*: Serial passage **artificially selects** for intact shells, weeding out defective variants. This mimics natural selection: shells now have a **history of being selected** (over 20 generations) for survival in the tank. Hence, the shell **acquires a function**.  
  - *Current capacity view*: The shell still **provides protection**, so its function **remains unchanged**. The account is indifferent to duration or mechanism of selection.  

  **KT-7m’s Partial Shell: Malfunction Only Under Historical Standards**  
  - *Historical view*: Post-passage, the intact shell has a function (protection). KT-7m’s mutated shell **fails to perform this selected role** (causing death in high salinity), making it a **malfunction**.  
  - *Current capacity view*: While the partial shell **fails to contribute** to survival *in this environment*, it is not a "malfunction" per se—the term implies deviation from a *normative* function tied to history. Here, it merely lacks current utility.  

  **Conflict Verdict: The Accounts Clash on Function Assignment**  
  The two accounts **genuinely conflict**, challenging the objection that they address separate questions. Both answer "What is the trait’s function?" but diverge sharply:  
  1. **Post-transfer**: The shell has a function (current capacity) vs. none (historical).  
  2. **Malfunction**: Only the historical view permits calling KT-7m defective.  
  The case exposes that **historical selection is necessary for normative function** (e.g., "the shell *should* protect"). Without it, "malfunction" lacks meaning—KT-7m’s shell is merely *non-functional* in the tank, not broken.  
  The current account’s reliance on *immediate context* also clashes with history’s emphasis on lineage. For example, pre-transfer, the shell’s latent capacity to protect wasn’t a function; post-transfer, its identical structure instantly becomes functional without historical warrant. This is not complementary—it’s contradictory. The case thus shows the accounts offer **competing criteria for "function,"** with practical consequences for identifying malfunctions.  

  ---

  ### Marking Scheme (25 points total)  
  **Must-hit points (5 marks each)**:
  1. **Pre-transfer analysis**: Historical account denies function (drift history); current account denies function (no *current* benefit).  
     *→ Penalty: Fails to distinguish drift from selection OR misattributes latent capacity as function.*  
  2. **Post-passage shift**: Historical account *only* assigns function after serial passage (artificial selection history).  
     *→ Penalty: Claims historical function emerges immediately post-transfer OR ignores artificial selection.*  
  3. **Post-transfer current capacity**: Shell gains function under current account due to immediate survival contribution.  
     *→ Penalty: Confuses capacity with function OR omits environmental relativity.*  
  4. **KT-7m malfunction**: Partial shell is malfunction *only* under historical account (fails selected role); current account sees non-function, not malfunction.  
     *→ Penalty: Calls it malfunction under both accounts OR conflates "harmful" with "malfunction."*  
  5. **Conflict resolution**: Argues accounts conflict (same question, different answers) using post-transfer/malfunction examples; rejects "different questions" by showing normative implications diverge.  
     *→ Penalty: Accepts "different questions" uncritically OR fails to use case evidence.*  

  **A vs. B Differentiation**:  
  - **A (21–25)**: Precision on *all* temporal phases; clear malfunction distinction; compelling conflict argument using tank/passage details; no conceptual blurring.  
  - **B (16–20)**: Minor omissions (e.g., artificial selection’s role); weaker conflict reasoning; occasional conflation (e.g., "function" as capacity).
