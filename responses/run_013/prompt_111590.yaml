    "alarm_vs_fire": "The poem explicitly uses the 'wires behind drywall / That shout when cut, but shout to no one?' metaphor to contrast neural registration ('shout') with the uncertainty of subjective suffering ('no one?'), and later questions finding 'the fire / Behind the sounding smoke alarm'.",
    "line_vs_gradient": "The tension appears in stanza 4, contrasting 'The knife-edge law requires' a binary list ('Protected. Not.') against 'the slow spectrum we observe' in the animals' responses.",
    "unsettled": "The fundamental question of whether the animal (fish/crustacean) subjectively experiences suffering ('pain' in the refrain) and the possibility of humans definitively knowing this.",
    "shaky": "Using 'pain' as shorthand for subjective suffering might oversimplify complex neuro-ethological debates; a specialist might argue nociception and sentience are distinct concepts, though 'pain' effectively conveys the core ethical concern for a general audience."
  }
  ```

  **Key Points Reflecting Your Request:**

  1.  **Refrain Evolution:** The refrain changes precisely one word per stanza, moving from certainty ("does not", "cannot") to questioning ("Does it?", "might?") to claimed certainty undermined by punctuation ("We know?") to fundamental doubt ("Can we know?"). The animal remains constant.
  2.  **Plain Language & Tone:** Uses straightforward, conversational language without poetic flourish. Sounds like a thoughtful practitioner reflecting.
  3.  **Smoke Alarm vs. Fire:** Directly incorporated in Stanza 3 ("wires... shout... shout to no one?") and referenced again in Stanza 5 ("fire / Behind the sounding smoke alarm").
  4.  **Line vs. Gradient:** Explicitly addressed in Stanza 4 with the contrast between the regulatory "list" / "knife-edge law" and the observed "slow spectrum".
  5.  **No Anthropomorphism:** The animals act (twitch, jerk, work gills) but do not speak or have internal monologues.
  6.  **No Sermon/Conclusion:** The poem ends in sustained doubt ("Can we know?") and the unresolved action of continuing the work ("I pour the feed. We carry on"). It presents the dilemma, not an answer.
  7.  **No Prescription:** Focuses solely on the speaker's evolving uncertainty and the inherent tension, not on judging the industry or prescribing action.
  8.  **JSON Object:** Provided as requested, summarizing the structure, refrain progression, key devices, and potential specialist concerns concisely. The "shaky" field acknowledges the potential oversimplification of using "pain".

  This poem aims to authentically capture your journey from certainty to profound, unsettling doubt, using your specific metaphors and respecting the complexity and lack of easy answers inherent in the question of animal suffering in aquaculture.
