prompt: |-
  I'm in a long-running argument with two freinds from my old rationality reading group, and I want you to settle it by actually arguing for a position rather than surveying the literature. The setup we all agree on: the standard paradox of self-deception is that it sounds like it requires you to know the truth in order to hide it from yourself, which is incoherent. My position, which I want you to defend, is that self-deception is plainly possible and the paradox is an artifact of two bad assumptions — that a mind has a single belief store which either contains P or doesn't, and that deceiving yourself has to be a thing you do in the way that lying to someone is a thing you do. Here's the mechanism I keep pushing on them, and I want you to make it do real work rather than just name-drop it: split the mind into a belief-former and an attention-policy. The belief-former is scrupulous; given what it sees, it infers what follows, no motivated inference allowed, so it never ends up holding P and not-P. The attention-policy can't write beliefs directly at all. What it can do is pick which questions get asked, which evidence gets gathered, how a question gets framed, when inquiry stops, what gets rehearsed nightly and what never gets thought about again. Over years, a policy like that can walk a mind to a conclusion it would never have reached under unsteered inquiry, and the resulting belief will feel like something that simply happened to it.

  So: argue that this is genuine self-deception, that we should call it that and not something anodyne like motivated reasoning or biased evidence selection, and that the paradox dissolves once you accept the architecture. I've thought about this alot and I need it to land with two people who are smart, stubborn, and have already heard all the cheap versions. So please take the strongest objection seriously — that the policy never possesses the truth to hide, so nobody is deceiving anybody and the belief-former is just doing its job on a skewed sample — and say why that's wrong, or why it's right about the mechanism but wrong about the label. Then say whether the account survives the case where the policy was inherited rather than chosen: someone raised in a bubble whose attention was steered by other people from the start, with no unsteered baseline to compare against. My friends think that case collapses the whole thing into just calling ordinary socialization self-deception, and I'd like you to either show them why it doesn't or concede the point honestly. Don't be precious about definitions; if you need to separate self-deception from wishful thinking, motivated ignorance, and plain cowardice about looking, do it explicitly and tell me which of those the bubble case actually is.
