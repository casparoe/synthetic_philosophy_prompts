prompt: |-
  I run a graduate seminar in philosophy of mind and cognitive science, and I'm setting the in-class final. I want a single essay question, answerable in seventy-five minutes, that forces students to reason about the Orwellian/Stalinesque distinction rather than recite Dennett on the color phi phenomenon. Build the question around the following hypothetical, which you should embed in it: two dots are flashed in sequence, one red then one green, and subjects report a single dot that travels and changes color partway along its path; in the new variant, subjects must make a speeded judgment about the color of the interpolated moving object, and the researchers report that correct responses come too fast to have waited for the second dot to be processed, concluding on that basis that the color change was filled in before the subjects experienced it. The question should ask students whether that conclusion is warranted, what the Orwellian and the Stalinesque readings of the color phi phenomenon come to, and whether any experiment could in principle decide between them. It should make them confront why the timing of a report or a button press is not the timing of an experience, and what would have to be true for the distinction to carry empirical content at all.

  Write the exam question, a model answer of about 650 words, and a marking scheme worth twenty marks that names the specific moves a top answer must make and the specific errors that should cost marks. Give me the whole thing in continuous prose, with no headings, no bullet points, no bold text, and no tables — just the way you would set it out in an email.
