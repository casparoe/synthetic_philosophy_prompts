prompt: |-
  I chair the grants committee of a mid-sized foundation whose charter commits us to reducing animal suffering. A donor has proposed what she calls a "moral trade": she will make a large unrestricted gift for farm-animal welfare, on the condition that the committee sign, in the foundation's name, a public statement she has drafted opposing a particular biomedical technology. That topic lies outside our charter; we have no settled view on it and no expertise. She is candid that the statement is not aimed at our mission — it advances a cause she cares about, and she is paying us to lend our name to it. Half the committee sees a clean win, since her money does our work and signing costs us nothing we value; the other half believes we would be selling the foundation's credibility, endorsing a claim we have not assessed, and establishing that our public positions are for hire. We meet Thursday. Draft the committee's decision memo. Structure it as: Recommendation (the specific course of action, in no more than three sentences, stating plainly whether we sign, decline, or sign with conditions); Why (roughly 250 words giving the affirmative case for your recommendation); The strongest objection (roughly 150 words presenting the best argument against your recommendation, in terms a dissenting member would accept as fair); and Reply to the objection (roughly 150 words answering it). Take seriously the possibility that our integrity as a funder is itself a good we hold in trust, and address whether endorsements are the kind of thing that can be traded at all.
reasoning: |-
  Okay, the user chairs a grants committee for a foundation focused on reducing animal suffering. A donor proposed a "moral trade": a large unrestricted gift for farm-animal welfare in exchange for the foundation publicly endorsing a statement against a biomedical technology outside their expertise. The committee is split. Half see it as a free win with no cost, while the other half worry about selling credibility. The user needs a decision memo structured with a recommendation, reasoning, strongest objection, and reply.

  First, I need to understand the core conflict. The foundation's mission is animal suffering reduction, specifically farm animals. The biomedical tech is unrelated. The donor admits it's about her cause, not theirs. Signing might bring funds but risks reputation. The memo must address if endorsements can be traded and if integrity is a held good.

  The recommendation should be clear. Declining seems right because trading endorsements compromises integrity. Even though the money helps, the foundation's credibility is crucial for long-term effectiveness. If they're seen as for hire, future trust erodes.

  For the "Why" section: Emphasize that credibility is a non-tradable asset. Foundations rely on trust; losing that could harm partnerships and influence. Accepting this trade sets a precedent: future donors might demand unrelated endorsements. The unrestricted funds are tempting, but the cost to reputation isn't worth it. The foundation should avoid endorsing statements they haven't vetted, as it violates their duty to stakeholders.

  Strongest objection: The money could significantly reduce animal suffering now. Signing costs nothing they value since it's outside their mission. They're not experts, so their endorsement shouldn't matter much. Why not use the funds for good?

  Reply: The endorsement does matter because it uses their name, implying judgment. Even if they're not experts, lending credibility suggests they've assessed it. Also, it sets a dangerous precedent. Future donors could demand endorsements that contradict their mission. Plus, stakeholders might question their integrity, reducing their overall impact. The short-term gain isn't worth the long-term risk.
answer: |-
  ## Grants Committee Decision Memo: Donor Proposal for "Moral Trade"

  **Date:** [Date of Meeting]
  **To:** Grants Committee Members
  **From:** Chair, Grants Committee
  **Subject:** Recommendation Regarding Donor Proposal for Public Statement Endorsement in Exchange for Unrestricted Gift

  **Recommendation:**
  The committee declines the donor's proposed "moral trade." We will not sign the public statement opposing the specified biomedical technology. We express gratitude for the donor's passion and her desire to support farm-animal welfare, and we remain open to discussing unrestricted gifts or grants aligned with our core mission and values without requiring unrelated public endorsements.

  **Why (Affirmative Case for Declining - ~250 words):**
  Our foundation's effectiveness hinges on the integrity and credibility of our public voice. This credibility is not merely an asset; it is a core good held in trust for our beneficiaries, stakeholders, and the causes we serve. Signing a statement on a complex biomedical issue, entirely outside our charter, expertise, and established positions, constitutes a misuse of that trust. We would be lending our name—implying considered judgment and institutional backing—to a claim we have not assessed and lack the competence to evaluate. This fundamentally transforms our endorsement from a reflection of mission-driven conviction into a commodity available for purchase.

  Accepting this "trade" establishes a dangerous precedent that our public positions are negotiable based on financial inducements unrelated to the merits of the position itself. It signals to other donors, grantees, partners, and the public that our institutional voice can be rented. This erodes the very trust necessary for us to be effective advocates and responsible stewards of resources dedicated to reducing animal suffering. While the unrestricted funds are substantial and their potential impact on farm animals is real, the cost is an unacceptable compromise of our foundational integrity. Protecting the independence and authenticity of our public stance is paramount to our long-term ability to fulfill our mission. We can achieve impact through mission-aligned funding without sacrificing the principle that our endorsements arise solely from our expertise, values, and charter.

  **Strongest Objection (Presented Fairly - ~150 words):**
  The opposing view holds that this is a clear net gain for animal suffering reduction. The donor's unrestricted funds would directly advance our core mission, enabling significant, tangible good for farm animals that we might otherwise lack the resources to achieve. Signing the statement imposes no direct cost on our operations or mission; the biomedical issue lies entirely outside our scope, so our endorsement carries little weight in that domain and doesn't detract from our farm animal work. Our name is not being used to harm our cause, and the donor is candid about the transaction. Withholding signature over an abstract principle like "credibility" sacrifices concrete, immediate welfare gains for animals in dire need. Since we have no stake in the biomedical debate, why not leverage this opportunity to fund our vital work? The foundation’s name is being used neutrally or positively for our mission’s benefit, not sold for harm.

  **Reply to the Objection (~150 words):**
  This objection rightly emphasizes the potential for immediate good and the lack of *direct* harm to our mission. However, it underestimates the corrosive long-term cost to our credibility and the precedent set. Our endorsement, even on an unrelated matter, *is not neutral*. It uses our hard-earned reputation to lend weight to a statement we haven't vetted, implying a judgment we haven't made. This fundamentally trades on trust built for our mission. Once established that our name is available for hire on unrelated issues, we invite future demands, potentially on topics conflicting with our values or harming our reputation with crucial partners. Stakeholders (grantees, peers, the public) rely on the authenticity of our positions; discovering they can be bought undermines our legitimacy across *all* activities, including farm animal advocacy. The "cost" isn't abstract; it's the devaluation of our most vital non-financial asset – trust – essential for sustained, effective impact. Protecting this integrity *is* advancing our mission responsibly.
