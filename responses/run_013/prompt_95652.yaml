  Kant's indirect duty view fits the "no direct enforcement" part but clashes with the focus on the animal's own suffering. The law seems to care about animals for their sake, not just human character. So the implicit theory is probably a middle ground: animals have intrinsic moral value, warranting protection from suffering, but not equal to humans. Their status is below constitutional rights-holders like humans.

  To reconstruct: Strictly presupposed is that animals are sentient beings deserving protection from suffering due to their capacity to suffer. But they aren't legal subjects with claims. What fits but isn't required is Kant's view or utilitarianism. The law's structure avoids committing to a specific theory beyond sentience-based protection.

  If animals were owed direct duties, changes needed would be: constitutional clause granting enforceable rights, criminal law allowing animals to be complainants, farming practices overhauled to prioritize animal welfare absolutely, not just minimize suffering. Slaughter might need phasing out unless completely painless, and using animals could face stricter limits.

