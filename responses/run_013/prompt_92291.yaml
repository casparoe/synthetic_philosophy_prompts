  Your objection conflates two distinct moral failures: being the *agent* of an innocent's death versus *allowing* deaths you didn't cause. My duty isn't just "don't want terrible things to happen," it's "**don't *you* commit murder.**" The killer's act is his responsibility; if I kill the innocent to stop him, *I* become a murderer. It's not about my hands being clean—it's about refusing to make myself the instrument of an intrinsic wrong. You demand I violate a core duty—"do not intentionally kill the innocent"—to achieve a net good. But that duty *defines* moral agency; violating it corrupts me, regardless of consequences. It’s not self-centeredness, but recognizing I am categorically *forbidden* to use an innocent as a mere means, even to save others. The "five vs one" math ignores the agent-relative prohibition binding *me*.

