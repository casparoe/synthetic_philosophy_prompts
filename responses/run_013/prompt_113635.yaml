prompt: |-
  I somehow ended up on the hardship fund committee of our housing co-op — six of us, about forty grand a year to hand out, and I'm the one who has to write up the reasoning every time we meet, which is how I've noticed we've never actually written down a policy. Our track record, roughly: we paid for the whole of a member's ongoing care for a condition she was born with; we paid full relocation for a family whose building got condemned; we covered four months of rent for a member after the factory he worked at shut down; we gave nothing to a guy who lost about fifteen grand on a poker habit he'd always been open about (he kept his job and his flat, just had no savings); nothing to a member who quit a solid job to write poetry and then couldn't make rent (he had family he could move back in with, and we all knew it); and nothing to someone who took out a loan for a motorbike, crashed it, and wanted us to cover his physio — though we did pay for the ambulance and the emergency surgery. Nobody has ever seriously pushed back on any of these. People just nod and say yeah, that's fair.

  Next week's application is making everyone twitchy. A member is genuinely destitute, can't cover his arrears, and if we say no he's looking at a hostel or worse. It's down to a two-year gambling problem — he says it started after he was put on painkillers for a back injury and he's never really been able to stop — plus he turned down two jobs last year that he says weren't for him. Half the committee says we've already decided this kind of thing: he chose it, he eats it, we don't bail out people who make bad decisions. The other half says the man is going to be on the street, and whatever he did, we are not the kind of body that lets that happen. I need to know what our own precedents actually commit us to.

  So: what rule have we really been running, and what other rules fit every single thing we've done just as well? What does each of them predict for this application, which precedent is the closest analog, and which rule do you think we should own up to adopting if we have to choose? Also, does the ambulance and surgery thing for the motorbike guy change the analysis, or is that just a way of dodging — someone on the committee said it's the whole answer in miniature and I can't tell if that's clever or a cop-out. And tell me what future case would force us to admit which rule we're actually running, because I'd rather find out on our terms than on someone's eviction notice.
reasoning: |-
  Alright, the user is part of a hardship fund committee in a housing co-op. They've been handling applications without a written policy, relying on precedents. Now, they're stuck on a tough case involving a member with gambling debt and potential homelessness. They need to figure out the implicit rules they've been following and how to apply them to this new situation.

  First, I need to parse the precedents they've listed. There's a pattern in their past decisions: they helped with congenital medical conditions, building condemnation, job loss due to factory closure. But they denied help for gambling losses, quitting a job for poetry, and a motorbike accident where they only covered emergency medical costs. The key seems to be whether the hardship was beyond the member's control or a result of their choices.

  The user is worried about consistency. They mentioned the motorbike case where emergency care was covered but not ongoing physio. That's a clue—maybe they distinguish between immediate, life-threatening needs versus long-term consequences of choices. The committee member who called it "the answer in miniature" might be onto something. But is that a solid principle or a loophole?

  Now, the current applicant is destitute due to gambling and refusing jobs. Half the committee says it's his fault, the other half can't let him be homeless. The user needs to know which precedent applies and what rule they've been following. They also want to avoid future conflicts by clarifying their policy.

  Looking deeper, the user might be seeking validation for either approach. But their real need is to establish a fair, transparent policy to prevent disputes and ensure consistency. They might also want to balance compassion with accountability without setting a problematic precedent.

  Possible rules: 
  1. **No Unavoidable Harm** - Help only if the issue wasn't self-inflicted. 
  2. **Basic Needs Exception** - Provide minimal aid for survival, regardless of fault. 
  3. **Causal Proximity** - Assist with direct consequences of uncontrollable events, even if choices followed. 

  The motorbike case fits #3—emergency care was immediate, physio was a result of his choice to ride. For the gambler, under #1, they'd deny help. Under #2, they might cover enough to prevent homelessness. #3 is tricky—gambling started after painkillers, which might be a mitigating factor, but refusing jobs complicates it.

  The closest precedent is the poker player—both gambling-related, but the poker guy had savings and a job, while this applicant faces homelessness. That difference might push them toward the Basic Needs Exception. 

  The user should consider drafting a policy that incorporates both control and severity. For example, prioritize preventing homelessness even if the cause was controllable, but with conditions like financial counseling or job seeking. The motorbike case shows they're willing to assist in emergencies, which could extend to preventing imminent harm like eviction.

  Future cases that could force a decision: someone with a chronic illness due to smoking, or repeated financial mismanagement. Having a clear policy would handle these without ad-hoc debates. The user needs to lead the committee to define their principles now, using this case as a catalyst.
answer: |-
  Based on your precedents, you're running a sophisticated, unwritten policy centered on **mitigation of harm arising from circumstances beyond reasonable individual control**, tempered by a **duty to prevent catastrophic outcomes regardless of fault**. Here's the breakdown:

  ### The Core Rule You've Actually Been Following:
  **"We intervene to prevent severe hardship caused by unavoidable misfortune or systemic failure, but not to absorb the consequences of avoidable personal choices—*unless* refusal would result in catastrophic, immediate harm to basic human welfare (shelter, life, health)."**

  ### How This Rule Explains Every Precedent:
  1.  **Congenital Care:** *Unavoidable misfortune* (born with condition). **Covered.**
  2.  **Building Condemned:** *Systemic failure* (building safety). **Covered.**
  3.  **Factory Closure:** *Systemic failure* (economic/job loss). **Covered.**
  4.  **Poker Losses:** *Avoidable personal choice* (gambling habit), *no catastrophic harm* (kept job/flat). **Denied.**
  5.  **Quit Job for Poetry:** *Avoidable personal choice* (career change), *no catastrophic harm* (family safety net). **Denied.**
  6.  **Motorbike Accident (Physio):** *Avoidable personal choice* (loan/risk-taking), *harm not catastrophic/immediate*. **Denied (Physio).**
  7.  **Motorbike Accident (Ambulance/Surgery):** *Avoidable cause, BUT imminent catastrophic harm* (life-threatening injury). **Covered (Emergency Care).**

  ### Other Rules That *Almost* Fit (But Don't):
  *   **"No Bailouts for Bad Choices":** Explains Poker, Poetry, Motorbike Physio. *Fails* to explain covering Emergency Surgery for Motorbike guy (his choice) or potentially covering this applicant if homelessness is deemed catastrophic.
  *   **"Prevent Homelessness/Death at All Costs":** Explains Emergency Surgery, Congenital Care, and *could* explain covering this applicant. *Fails* to explain denying Poetry guy (he *could* have become homeless if family refused, but you assessed the risk as low) and Poker guy (no imminent risk).
  *   **"Only Cover Truly Random Misfortune":** Explains Congenital Care, Building Condemned. *Fails* to explain Factory Closure (could argue worker *chose* that job) and definitely fails Emergency Surgery (his choice).

  ### Analysis of Next Week's Application (Destitute Gambler):
  *   **The Harm:** **Catastrophic** (homelessness).
  *   **The Cause:** Primarily *avoidable personal choices* (gambling, refusing jobs). The painkiller origin complicates fault but doesn't erase subsequent choices.
  *   **Precedent Closest Analog:** **The Poker Player** is the *direct* behavioral analog (gambling losses). **The Emergency Surgery** is the *harm-level* analog (catastrophic outcome).
  *   **Prediction by Your Core Rule:** Your rule creates tension here. The *cause* (avoidable choices) leans towards **denial** (like Poker). However, the *severity of harm* (catastrophic homelessness) leans towards **intervention** (like Emergency Surgery). This is why the committee is split.
  *   **How Your Rule Likely Resolves It:** The "catastrophic harm" clause likely **trumps** the "avoidable choice" factor in practice. Preventing immediate homelessness is analogous to preventing death via emergency surgery. You'll probably cover *enough* to prevent homelessness (e.g., clearing arrears, maybe temporary support), perhaps with conditions (e.g., mandatory gambling support, job search requirement). A full bailout of all gambling debts is unlikely.

  ### The Motorbike Emergency Care: Key Insight, Not a Cop-Out
  The committee member is **right**. This *is* the precedent in miniature revealing your core rule's critical nuance. You **distinguished between:**
  1.  **The Consequence of the Choice:** The debt from the loan, the need for physio - *denied*.
  2.  **The Imminent, Life-Threatening Consequence:** The emergency medical need - *covered*.
  This shows you **will** intervene to prevent the most extreme, immediate harms (death, destitution, loss of home) *even if the pathway to that harm involved poor choices*, but you **won't** cover the broader fallout of those choices themselves. It's **not dodging**; it's defining the *limit* of your responsibility based on the *severity* of the outcome.

  ### What Rule Should You Own Up To?
  **Adopt the Core Rule Explicitly:** It's honest, nuanced, and reflects your actual practice. Phrasing suggestion:
  > *"The Hardship Fund exists to prevent severe, immediate harm to members' basic welfare (shelter, health, safety) arising primarily from circumstances beyond their reasonable control (e.g., illness, systemic failures, sudden economic shocks). While consequences of significant personal choices are generally the member's responsibility, intervention may occur when refusal would result in catastrophic outcomes like homelessness or life-threatening medical neglect, regardless of fault origin."*

  ### The Future Case That Forces Clarity
  **The "Reckless But Unlucky Chronic":** A member with a long-term, expensive health condition *directly caused by persistent, known avoidable choices* (e.g., smoking-related COPD, obesity-related diabetes with non-compliance) who faces imminent eviction due to medical bills *and* has exhausted all other options. They have no safety net.

  *   **Why it Forces the Issue:**
      *   **Cause:** Clearly avoidable personal choices over time.
      *   **Harm:** Catastrophic and imminent (homelessness, potentially death).
      *   **Analogs:** Pulls equally from "Congenital Care" (ongoing health cost) and "Poker/Gambler" (self-inflicted cause). It tests the *limits* of both the "unavoidable misfortune" and "catastrophic harm override" clauses.
      *   **Decision Point:** Do you cover the arrears/ongoing costs to prevent homelessness *because* the harm is catastrophic, even though the cause was entirely avoidable choices? Or do you deny because the member had years of agency to prevent the situation?

  **How this forces your rule:** If you cover it, you solidify the **Catastrophic Harm Override** as your primary principle, even overriding significant personal responsibility. If you deny it (despite the catastrophic harm), you solidify **Avoidable Cause** as the dominant principle, limiting the override to only *immediate*, *unforeseen* catastrophic consequences of choices (like the emergency surgery), not *long-term*, *foreseeable* ones. The Motorbike case becomes your "override limit" precedent.

  ### Recommendation for Next Week & Beyond
  1.  **Present the Core Rule:** Frame the gambler's case using the tension inherent in your unwritten rule: avoidable cause vs. catastrophic harm. Highlight the Emergency Surgery precedent as the key for catastrophic outcomes.
  2.  **Aim for Harm Mitigation:** Propose covering *only* what's needed to prevent immediate homelessness (clear arrears, maybe 1 month buffer), potentially tied to mandatory engagement with gambling support services and active job search. This honors both the "avoidable cause" principle (no full bailout) and the "catastrophic harm" principle (prevents the street).
  3.  **Demand a Written Policy NOW:** Use this case as the catalyst. Draft the core rule, debate it explicitly, incorporate the nuance revealed by the Emergency Surgery precedent, and codify it. Include definitions ("catastrophic harm," "reasonable control," "exhaustion of options") and processes.
  4.  **Discuss the Future Case:** Explicitly discuss the "Reckless Chronic" scenario *now* while drafting policy. Decide where your co-op's ethical line is *before* it hits someone's eviction notice. Does the *origin* of the catastrophe matter if the *immediacy* and *severity* are identical?

  Your committee has shown remarkable practical judgment. Formalizing that judgment into clear, compassionate, and accountable policy is the crucial next step. The gambler's case isn't just a dilemma; it's the prompt your process desperately needed.
