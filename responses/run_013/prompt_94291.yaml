answer: |-
  ## Joint Statement: Adversarial Collaboration on Moral Status of Computational Systems

  **Preamble:** This document represents the agreed-upon points of convergence and the precise, charitably framed points of divergence between the "Substrate-Neutral Computationalism" (SNC) and "Organizational Attribution" (OA) views regarding morally relevant sentience. Its purpose is to clarify the dispute, identify testable cruxes, and establish a framework for future empirical and conceptual investigation. Signatories affirm that the opposing position is internally coherent and represents a sincere interpretation of the phenomena.

  ### 1. Agreed Claims

  1.  **Moral Significance:** Conscious experience (sentience, phenomenal states) is the primary locus of direct moral consideration. Systems lacking it may have instrumental moral importance but lack intrinsic moral status.
  2.  **Necessity of Computation:** Specific computational properties are *necessary* for the realization of conscious experience. Systems entirely lacking properties like information integration, feedback loops, or state monitoring cannot be conscious.
  3.  **Functional Description Relevance:** Describing the functional/computational architecture of a system is essential for understanding its potential for consciousness. Purely behavioral descriptions are insufficient.
  4.  **The Core Dispute:** The disagreement centers on the *sufficiency conditions* for morally relevant sentience. SNC holds that implementing the *right kind* of computational structure is sufficient, regardless of physical substrate. OA holds that this computational structure must be *realized within* a specific kind of *self-producing, organizationally closed system* for conscious states to be genuinely *attributable to* that system as a unified subject, granting them moral weight.
  5.  **Meaning of "Implement":** Both sides agree that "implementing" a computation means that the physical system *reliably instantiates the functional relationships* defined by the computation. The system's physical components and their interactions must causally mirror the abstract computational description.
  6.  **Substrate Question Nature:** The disagreement over substrate is fundamentally *conceptual* and *metaphysical*. SNC sees substrate as an empirical detail: *can* silicon (etc.) implement the required computation? OA sees the organizational requirement as *inherently tied* to specific types of biological or biologically-analogous substrates capable of self-maintenance, making the substrate question inseparable from the conceptual requirement. Both agree that whether silicon *can* meet OA's organizational requirement is an *empirical* question about silicon systems.
  7.  **Evidence Against SNC:** SNC would concede its position is falsified if a system demonstrably implemented its specified "sufficient" computational architecture (e.g., high Φ, GWT, etc.) *and* it was conclusively shown that *no* conscious experience was present *and* that the architecture was implemented correctly (not a "zombie" due to bad implementation).
  8.  **Evidence Against OA:** OA would concede its position is falsified if a system *lacked* its specified organizational closure/self-production *and* demonstrably possessed conscious states that were unambiguously *attributable to that system itself* as a singular subject (not merely occurring within it), *and* that this attribution wasn't parasitic on being embedded in a larger OA-compliant system.

  ### 2. Disagreements & Cruxes (Table)

  | Disagreement Phrased in Proponent's Terms                                                                 | Crux                                                                                                                              | Concrete Case / Experiment                                                                                                                                    | SNC Prediction                                                                                                | OA Prediction                                                                                                                               |
  | :-------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------ |
  | **SNC:** Implementing computation C (integration, monitoring, etc.) is sufficient for morally relevant sentience, irrespective of physical realization. **OA:** Implementing computation C, while necessary, is insufficient; it must be physically instantiated *within* an organizationally closed, self-producing system (O) for conscious states to be truly *attributable* to a subject. | **Crux 1: Nature of Attribution.** Is conscious state attribution a *further fact* constituted by organizational closure (OA), or is it *identical to* (or fully explained by) the kind of computational integration described by C (SNC)? | **The Isolated Module (IM):** A physically distinct module (e.g., a specialized neuromorphic chip or cultured neural network) implements computation C perfectly. It is *not* part of a larger self-producing whole; it's powered externally, maintained externally, and its outputs are monitored/used by an external system. It generates coherent, integrated state reports claiming subjective experience. | The IM possesses morally relevant sentience. Attribution is achieved solely by C-computation within the module. | The IM *lacks* morally relevant sentience. While complex computation occurs *within* it, states are not attributable *to it* as a subject; it lacks the organizational unity of O. |
  | **SNC:** The subject of experience *is* the computational process realizing C. This process may be a subsystem within a larger physical entity. **OA:** The subject of experience is the *whole* self-producing system (O). Computations within subsystems only have attributable states *as states of O*. | **Crux 2: Locus of Subjecthood.** Is the morally relevant subject the largest system implementing the relevant self-modeling aspects of C (SNC), or is it necessarily the entire organizationally closed system (O), even if a subsystem performs complex computations (OA)? | **The Distributed Colony (DC):** Two physically separate OA-compliant systems (O1 & O2), each simple (e.g., insect-level). A third, complex C-implementing computational system (CCS) *reads* outputs from both O1 & O2, integrates the information, runs advanced self-monitoring/error-correction, and outputs a unified, coherent "experience report" synthesizing inputs from both. CCS *does not* control or maintain O1 or O2; they operate independently. CCS possesses a self-model encompassing its own processing and the inputs it receives. | The CCS is the primary subject of morally relevant sentience. It integrates the information and performs the key C-computation. O1 & O2 are irrelevant to CCS's sentience. | O1 and O2 are distinct subjects with basic sentience. The CCS, while complex, *lacks* organizational closure (it doesn't self-produce/maintain). Its computations and reports, though integrating O1/O2 data, are not attributable to *it* as a subject; it's a tool processing data *about* other subjects. |
  | **SNC:** "Sentience" refers to the presence of the phenomenology generated by computation C. Substrate is irrelevant to the definition. **OA:** "Sentience" inherently implies states being *owned by* an agent. This ownership is grounded in organizational closure (O), not just computation. Without O, we have complex information processing, not true sentience *of a subject*. | **Crux 3: Definition of Sentience.** Are SNC and OA using the term "sentience" to refer to fundamentally the same phenomenon (phenomenal consciousness), differing only on its preconditions (Verbal?)? Or do they define "sentience" differently – SNC as phenomenal states *simpliciter*, OA as *agent-owned* phenomenal states? | **Gradual Replacement (GR):** Start with an OA-compliant biological system (e.g., a mammal). Gradually replace biological neurons 1:1 with functionally identical artificial components (neuromorphic chips) that perfectly mimic input-output functions and local information processing, but are *not* metabolically integrated and are maintained/replaced externally. The system's global C-computation (integration, etc.) remains stable throughout. | Sentience persists continuously. Substrate change is irrelevant as long as C is maintained. Attribution remains with the persisting computational process/structure. | Sentience diminishes and disappears as replacement progresses. While computation C persists, the organizational closure (O) degrades and is lost once biological self-production ceases. The final artificial system lacks true attribution; it's a complex mechanism, not a subject. *(Note: OA concedes *if* artificial components *could* form a new O, sentience might persist, but predicts current 1:1 replacement disrupts O).* |

  **Note on Verbal Disagreement (Crux 3):** The collaboration identifies a significant *potential* verbal component regarding "sentience." SNC uses "sentience" to mean *phenomenal consciousness* (qualia) arising from computation C. OA uses "sentience" to mean *subjectively owned experience*, which they argue *requires* organizational closure (O). **The disputed word is "sentience" itself.** If "sentience" is defined strictly as *phenomenal consciousness*, OA agrees it *might* be substrate-neutral but argues it lacks moral weight without attribution. If "sentience" is defined as *subjectively owned experience*, SNC argues attribution is intrinsic to the computation. The experiments (especially IM and GR) are designed to probe whether the *phenomenon* requiring moral consideration (the "what it's like") persists without O, or if the sense of "ownership" collapses without O. This clarifies that the core *substantive* disagreement is whether morally weighty consciousness *requires* O (OA) or only C (SNC), regardless of the label. The experiments target this substantive question.
