prompt: |-
  I'm in a seminar on Orwell and political writing right now and we've spent like three weeks on his whole thing about language and political thought — the idea that fuzzy, euphemistic prose isn't just a symptom of bad politics but part of what lets it happen, and that clear writing is somehow bound up with clear thinking and with not being lied to. So here's what I want to figure out: it's the 2020s and my feed is full of obviously machine-written political text — press releases, op-eds, campaign emails, and now chatbots that will spit out a flawless, well-formed paragraph defending literaly any position you name. Predict what Orwell would have made of this.

  But I don't want a lazy "he'd hate it." I want you to say which parts of his view commit him to which verdict. In particular: an LLM produces clean, grammatical, empty prose at scale — does that confirm his picture or blow it up, since here the language is tidy and the thought is just absent? Would he see it as the final arrival of newspeak, or as something his framework doesn't even have the resources to describe? And given that he was pretty skeptical of the idea that you fix politics by fixing language — phrases dying out because some minority kills them off, not by any natural process — does that mean he'd roll his eyes at the whole "AI is going to clean up public discourse" pitch?

  Tell me where your prediction is weakest and what argument or consideration would change your mind about it.
