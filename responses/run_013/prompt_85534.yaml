  Now, the disagreements table. Two cruxes: the targeted intervention case and the dilemma about sound deliberation. For the intervention case, externalists would say reasons survive, internalists deny it. The crux is whether reasons require an actual motivational link. Evidence against each view: for internalism, if post-erasure intuitions favor reasons existing; for externalism, if no one sees reasons post-erasure. The case here is the friend's concert—survival prediction split.

  The second crux is the dilemma: if sound deliberation can generate new motives, internalism might be vacuous; if not, it could be false. Externalists see the first horn as problematic, internalists the second. Evidence against: internalists if deliberation can't expand motives; externalists if it can. The case of the indifferent heir—internalists predict deliberation can create a motive, externalists doubt it. Both agree the first crux might move the debate, the second is more foundational.

  I need to ensure the structure is clear: numbered agreed claims, then a table with each disagreement, crux, evidence against, and a case with predictions. Also, specify which crux could actually shift opinions. The intervention case is more empirical, so it might move the debate, while the dilemma is theoretical. Make sure each side's wording is accepted. Avoid bias, present neutrally. Check if all user points are covered: functions of reasons, stock cases, verbal disputes, both cruxes with cases. Use clear examples and precise language.
answer: |-
  ## Joint Statement: Internalist-Externalist Adversarial Collaboration

  **Preamble:** We, a committed internalist and a committed externalist regarding reasons for action, engaged in sustained, good-faith adversarial collaboration. Our goal was not to persuade each other to abandon our core positions, but to achieve greater clarity on points of agreement, identify genuinely substantive disagreements, and pinpoint where our differences might be partly verbal or methodological. This document records our shared understandings and persisting disagreements.

  **1. Agreed Claims: Common Ground**

  We jointly accept the following:

  1.  **The Function of Reason-Statements:** Statements about reasons for action serve several interconnected roles:
      *   **Explanatory:** They help explain why agents act (or fail to act) as they do, particularly in contexts of deliberation or rational assessment.
      *   **Deliberative:** They function as guides within practical reasoning, helping agents determine what they ought to do, all things considered.
      *   **Normative:** They license practices of advice (offering considerations to guide others' actions) and blame/praise (assessing actions against standards the agent *should* have recognized).
  2.  **Status of Stock Cases:**
      *   **The Amoralist (understands moral reasons but is unmoved):** Both views can acknowledge the existence of such an agent. The Internalist sees this as confirming that reasons require a motivational link the amoralist lacks for moral considerations. The Externalist sees this as confirming that reasons exist independently of an agent's contingent motivations, highlighting the amoralist's *failure* to respond to genuine reasons.
      *   **The Fully Informed but Wholly Unmoved Agent (e.g., towards a clear self-interest):** Similarly, both views acknowledge this conceptual possibility. The Internalist sees this as demonstrating the *absence* of a reason *for that agent* (as no sound deliberation connects existing motives to the action). The Externalist sees this as demonstrating the *presence* of a reason the agent is failing to grasp *as* motivating (due to a deliberative defect or motivational deficit), emphasizing the reason's objective status.
      *   These cases are not decisive counter-examples to either view; they are boundary markers illustrating the different starting points and priorities of each framework.
  3.  **Verbal/Contextual Disagreements:** We acknowledge that some disputes in the literature, and some of our own initial disagreements, stemmed from using the word "reason" in subtly different contexts or with different emphases:
      *   **"Reason" as Motivation-Accessible Justification (Internalist Emphasis):** Often used when focusing on the perspective of the deliberating agent, the explanation of *their* actions, or the conditions for *their* being guided or blameworthy.
      *   **"Reason" as Objective Justification (Externalist Emphasis):** Often used when focusing on normative standards independent of individual psychology, justifying blame/advice even when motivation is absent, or discussing what an agent *should* do from an ideal or impartial perspective.
      *   Recognizing this contextual variation helps avoid talking past each other in some instances, though it does not resolve our core substantive disagreements about the nature of normativity itself.

  **2. Table of Residual, Substantive Disagreements**

  | Disagreement Stated (Per Side's Wording)                                                                 | Crux the Disagreement Turns On                                                                                                 | What Counts as Evidence Against Own View                                                                                                                              | Shared Case/Argument Bearing on Crux                                                                                                                               | Predictions                                                                                                  | Moves Debate?           |
  | :------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------- | :---------------------- |
  | **Int:** "An agent lacks a reason to φ if, after sound deliberation from her existing motivations, no motivation to φ arises or can be sustained." <br> **Ext:** "An agent can have a reason to φ even if sound deliberation from her existing motivations cannot lead her to be motivated to φ." | **Does the existence of a normative reason for an agent *necessarily depend* on there being a *possible* motivational connection via sound deliberation from *her actual* motivational set?** | **Int:** Strong, persistent intuition (esp. post-erasure) that a reason *does* still exist, unshaken by explaining the intuition as tracking "should have" or blame. <br> **Ext:** Widespread acceptance that reasons *vanish* with the erasure, suggesting they were always motivation-dependent. | **Targeted Erasure:** Agent A deeply values friend B's well-being. A sophisticated, targeted intervention instantly erases *all* of A's concern for B, leaving A's knowledge, rationality, and other motivations fully intact. B is in dire need of help only A can provide. Does A *still have a reason* to help B? <br> *Assumptions:* No prior instrumental links to other motives; no general beneficence motive applies; erasure is permanent & complete. | **Int:** Predicts post-erasure, A has *no reason* to help B. The necessary motivational root is gone. <br> **Ext:** Predicts post-erasure, A *still has a reason* to help B; the value of B's need/friendship grounds it. | **Yes.** Both agree intuitions on this specific, clean case could be probative. |
  | **Int:** "Sound deliberation can generate genuinely new, non-derivative motivations (e.g., valuing honesty upon realizing its constitutive role in friendship), thus non-vacuously connecting reasons to an expanded motivational set." <br> **Ext:** "Internalism either trivializes reasons by allowing deliberation to create any motive needed ('vacuous'), or falsely denies reasons exist if deliberation is restricted to deriving motives from existing ones ('false')." | **Can 'sound deliberation' *non-trivially generate* new, non-instrumental, non-derivative motivations that weren't latent in the prior set, without collapsing the reason/motivation link or rendering internalism vacuous?** | **Int:** If compelling cases show deliberation *cannot* expand motives non-trivially (only reveals instrumental links/consistency), supporting the 'false' horn. <br> **Ext:** If compelling cases show deliberation *can and does* reliably generate *genuinely new* core motivations (e.g., valuing fairness intrinsically upon understanding it) in psychologically plausible ways, supporting the 'non-vacuous' horn. | **The Indifferent Heir:** C is entirely unmotivated by family ties or legacy. C learns via rigorous, sound deliberation that respecting their deceased parent's specific, non-harmful wishes (e.g., donating an inheritance to a specific charity) is constitutive of fulfilling the role of a 'dutiful child' – a role C had never considered or valued. Does sound deliberation *from C's current motives* have the *non-trivial capacity* to generate a new, non-instrumental motivation to fulfill the parent's wish? | **Int:** Predicts *yes*; understanding the constitutive link can generate a new, non-derivative valuing of 'being dutiful' in this context. <br> **Ext:** Predicts *no*; without a prior spark of care about family/role/duty, deliberation alone cannot create this motivation. It might reveal C *should* care, but won't make C care. | **Less Directly.** Debate hinges on contested views of deliberation's powers; harder to isolate a single intuition pump. |

  **Conclusion:** Our collaboration clarified significant common ground concerning the *work* done by reason-talk and the *status* of classic thought experiments. We identified a core verbal ambiguity surrounding "reason." However, two fundamental, substantive disagreements remain, centered on the **necessity of a possible motivational link grounded in the agent's actual psychology** (tested by Targeted Erasure) and the **powers and limits of sound deliberation** (tested by the dilemma and cases like the Indifferent Heir). We agree the Targeted Erasure case presents the clearest potential test where empirical (intuitive) evidence might meaningfully challenge one view or the other. While we remain committed to our respective positions, we agree that progress requires focusing debate on these specific cruxes and the psychological plausibility of deliberation's generative power.

  **Signed,**

  [Signature - Internalist]
  [Signature - Externalist]
