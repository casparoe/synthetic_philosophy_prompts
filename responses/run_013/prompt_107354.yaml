answer: |-
  ### Analysis of Post-Civil War Southern Freedpeople Through Liberty Frameworks  
  *(Mapping the case through negative, positive, and republican liberty)*  

  ---

  #### **1. Republican Liberty (Non-Domination)**  
  **Core Concept:** Freedom as absence of arbitrary power over one’s choices (Pettit/Skinner). Requires immunity from others’ unconstrained will.  
  - **Dominators:**  
    - *Explicit*: Landlords (via debt manipulation), sheriffs (enforcing vagrancy laws), courts (upholding biased contracts).  
    - *Structural*: The state itself (via Black Codes, convict leasing) and economic systems (crop-lien traps).  
  - **Case Mapping:**  
    - **Sharecropper with Unpayable Debt**: Formally "free" to leave, but legally bound by contracts enforced by courts. Debt functions as **arbitrary power**: the landlord controls his fate without consent or recourse. *Non-domination violated*: Exit is "lawful" but practically impossible without facing chain gangs or starvation.  
    - **Black Landowner "Left Alone"**: Experiences *non-interference* but lives under constant threat of the Black Codes. The sheriff’s restraint is discretionary, revocable at will. *Domination persists*: Security depends on the oppressor’s whim, not institutional guarantees.  
    - **Blind Spots**:  
      - *Impersonal Domination*: The "web of law" replaces individual masters with structural control. Republican theory struggles when domination lacks a single "arbitrary will" but is systemic.  
      - *Remedy Gap*: Republican solutions (ballot, contestation) were denied (voter suppression, no jury access). The episode reveals non-domination’s dependence on *robust institutional agency*—precisely what was sabotaged.  

  **Verdict**: Best captures the *relational injustice*—freedom erased by vulnerability to others’ power. Exposes how "lawful" coercion sustains domination.  

  ---

  #### **2. Negative Liberty (Non-Interference)**  
  **Core Concept:** Freedom as absence of external obstacles to action (e.g., physical coercion, legal barriers).  
  - **Case Mapping:**  
    - **Freedpeople’s Formal Rights**: Marriage, movement, contracts exist—a veneer of non-interference.  
    - **Sharecropper’s Predicament**: Negative liberty sees *no interference* if he "chooses" to stay on the plantation. His debt is a "voluntary" contract. Ignores that "choice" occurs under duress (starve or sign).  
    - **Black Landowner**: Sheriff’s non-action satisfies negative liberty—no active interference. Misses the *threat* as a liberty violation.  
  - **Blind Spots**:  
    - **Coercion via Structure**: Poverty, vagrancy laws, and debt traps are "background" interference invisible to negative liberty.  
    - **The Philosopher’s Refinement?** Distinguishing "secure citizen" vs. "lucky dependent" is *crucial here*: Negative liberty cannot explain why the landowner is unfree while undisturbed. It conflates luck with liberty.  

  **Verdict**: Fails to diagnose systemic unfreedom. Mistakenly codes structural coercion (debt peonage) as "free choice."  

  ---

  #### **3. Positive Liberty (Self-Mastery/Self-Realization)**  
  **Core Concept:** Freedom as self-determination, requiring capacity/resources to pursue one’s goals (individual or collective).  
  - **Case Mapping:**  
    - **Self-Mastery Denied**: Sharecroppers lack control over labor, land, or futures. Debt bondage destroys autonomy.  
    - **Collective Self-Rule Suppressed**: Freedpeople’s political exclusion (e.g., Black Codes barring jury service/voting) blocks collective agency.  
    - **Social Conditions of Agency**: Poverty, illiteracy, and terror sabotage capacity for meaningful choice. Convict leasing reduces humans to expendable labor—total negation of self-realization.  
  - **Insights Missed by Others**:  
    - Negative liberty ignores *internal capacities*; republican liberty overlooks *material prerequisites* for non-domination. Positive liberty highlights how poverty and fear cripple agency.  
  - **Blind Spots**:  
    - Risks "redescribing" the problem: Calling sharecropping a failure of "self-realization" adds little without diagnosing *power relations*.  
    - Overlooks *non-arbitrariness*: A benevolent landlord granting fair terms might satisfy positive liberty but still dominate.  

  **Verdict**: Explains the *crushed potential* of freedpeople but underspecifies the *mechanisms of power*.  

  ---

  #### **What the Episode Asks of Theory**  
  1. **Structural Domination**: Republican liberty must address impersonal systems (e.g., racial capitalism) where "arbitrary power" lacks a human face.  
  2. **Agency vs. Structure**: Positive liberty’s focus on capacity clashes with republican emphasis on power relations. The case demands synthesis: non-domination *requires* material security and education.  
  3. **The Illusion of Formalism**: Negative liberty’s fixation on legal non-interference is exposed as inadequate when law itself is weaponized (Black Codes).  
  4. **Remedies in Context**: Republican tools (contestation, voting) were neutralized by white supremacy. Theory must confront how domination adapts to resist its own solutions.  

  ---

  ### Conclusion: A Tripartite Failure of Freedom  
  - **Negative liberty** sees surface non-interference, missing coercion via structure.  
  - **Positive liberty** sees strangled potential, missing relational domination.  
  - **Republican liberty** best diagnoses the *core injury*—systemic vulnerability to arbitrary power—but stumbles on impersonal structures and sabotaged remedies.  
  **The Unanswered Question**: How can non-domination exist without *transformative redistribution* (land, resources) and *anti-racist institutional power*? The episode shows liberty’s ideals collapsing without these, a challenge all three theories must confront.
