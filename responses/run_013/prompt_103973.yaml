  ### Decision-Theory Classroom Game: The Fragility of Good's Theorem

  **Objective**: Illustrate that the expected value of information (EVOI) is non-negative under Good's assumptions (fixed decision problem, utility maximization, stable actions/preferences), and then show how relaxing the "fixed action set" assumption leads to negative EVOI.

  ---

  #### **Materials**
  - Two coins (or virtual coin flips) per round.
  - Whiteboard/projector to display payoff tables.
  - Score sheet to track points (no real money).

  ---

  #### **Game Structure**  
  **Rounds 1–3**: Standard decision problems where EVOI ≥ 0.  
  **Round 4**: Harmful information (same free signal, but EVOI < 0 due to relaxed assumption).

  ---

  ### **Round-by-Round Rules & Payoff Tables**

  #### **Round 1: Obvious Positive EVOI**  
  - **States**: Fair coin flip (Heads = S1, Tails = S2; P=0.5 each).  
  - **Actions**: A1 or A2 (available regardless of looking).  
  - **Payoff Table**:  

    | Action | S1 (Heads) | S2 (Tails) |  
    |--------|------------|------------|  
    | **A1** | 10 points  | 0 points   |  
    | **A2** | 0 points   | 10 points  |  

  - **Signal**: Free perfect signal (reveals true state).  
  - **Procedure**:  
    1. Players choose: **Look** (see signal, then pick A1/A2) or **Don’t Look** (pick A1/A2 blindly).  
    2. Flip coin for state.  
    3. Assign payoffs.  

  - **Predicted Outcome**:  
    - *Don’t Look*: Max EU = 5 (e.g., pick A1: 50% chance of 10, 50% of 0).  
    - *Look*: EU = 10 (always pick correct action).  
    - **EVOI = +5** → Looking dominates.  

  ---

  #### **Round 2: Imperfect Signal, Still Positive EVOI**  
  - **States**: S1 (P=0.6), S2 (P=0.4) (use biased coin or RNG).  
  - **Signal**: Imperfect (70% accurate). If S1, signal says "S1" with P=0.7; if S2, "S2" with P=0.7.  
  - **Payoff Table**: Same as Round 1.  
  - **Procedure**: Same as Round 1.  

  - **Predicted Outcome**:  
    - *Don’t Look*: Pick A1 → EU = (0.6×10) + (0.4×0) = 6.  
    - *Look*: EU ≈ 8.2 (details: P(signal=S1)=0.62; if signal=S1, pick A1 (EU=10×0.6/0.62 ≈ 9.68); if signal=S2, pick A2 (EU=10×0.4/0.38 ≈ 10.53); weighted avg = 8.2).  
    - **EVOI ≈ +2.2** → Looking still better.  

  ---

  #### **Round 3: Risk-Averse Context, Positive EVOI**  
  - **States**: S1 (P=0.5), S2 (P=0.5).  
  - **Actions**: Safe (constant payoff) or Risky.  
  - **Payoff Table**:  

    | Action | S1   | S2   |  
    |--------|------|------|  
    | **Safe** | 8    | 8    |  
    | **Risky**| 20   | 0    |  

  - **Signal**: Free perfect signal.  
  - **Procedure**: Same as Round 1.  

  - **Predicted Outcome**:  
    - *Don’t Look*: EU(Safe) = 8, EU(Risky) = 10 → Pick Risky, EU=10.  
    - *Look*: EU = 20 (if S1) or 8 (if S2) → Average EU = 14.  
    - **EVOI = +4** → Looking better.  

  ---

  #### **Round 4: Harmful Information (EVOI < 0)**  
  - **States**: S1 (P=0.5), S2 (P=0.5).  
  - **Critical Twist**:  
    - **Don’t Look**: Choose from {**Safe**, **Risky**}.  
    - **Look**: Choose from {**Risky**, **Trap**} (Safe vanishes!).  
  - **Payoff Tables**:  
    - **Don’t Look Actions**:  

      | Action | S1   | S2   |  
      |--------|------|------|  
      | **Safe** | 20   | 20   |  
      | **Risky**| 30   | 0    |  

    - **Look Actions**:  

      | Action | S1   | S2   |  
      |--------|------|------|  
      | **Risky**| 30   | 0    |  
      | **Trap** | 35   | -100 |  

  - **Signal**: Free perfect signal.  
  - **Procedure**:  
    1. Players choose **Look** or **Don’t Look** *without knowing the twist*.  
    2. After choices are locked, reveal the twist: Lookers lose Safe, gain Trap.  
    3. Flip coins for states (one per player).  
    4. Assign payoffs:  
       - *Don’t Look*: Get 20 (Safe chosen optimally).  
       - *Look*: See state → Pick best action:  
         - S1: Trap (35 > 30) → **35 points**.  
         - S2: Risky (0 > -100) → **0 points**.  

  - **Predicted Outcome**:  
    - *Don’t Look*: EU = 20.  
    - *Look*: EU = (0.5×35) + (0.5×0) = 17.5.  
    - **EVOI = 17.5 - 20 = -2.5** → Looking harms in expectation.  

  ---

  ### **Debrief & Key Insights**  
  - **Rounds 1–3**: Confirm Good’s theorem. EVOI ≥ 0 because:  
    - Decision problem fixed (actions, states, preferences stable).  
    - Players maximize EU after seeing the signal.  
  - **Round 4**: EVOI negative. Why? **The action set changed when players looked**:  
    - *Don’t Look*: Retained access to Safe (20 in both states).  
    - *Look*: Safe replaced by Trap (high upside in S1, catastrophic in S2).  
    - Result: Lookers avoid disaster in S2 but lose the guaranteed payoff of Safe.  

  - **Loophole Illustrated**: Good’s theorem assumes a **fixed set of available actions**. When looking *alters the action set* (here, replacing Safe with Trap), EVOI can turn negative.  
    - *Other assumptions held*:  
      - Fixed decision problem (states, probabilities unchanged).  
      - Players maximized EU (chose Trap in S1, Risky in S2).  
      - Preferences stable (utility from payoffs unchanged).  

  ---

  ### **Predictable Issues & Handling**  
  1. **Issue**: Round 4 feels unfair; players protest "I wouldn’t have looked if I knew Safe vanished!"  
     - **Handling**: Emphasize this is the point! Good’s theorem assumes no such change. Real-world violations occur (e.g., getting diagnostic test results may lock you out of insurance).  

  2. **Issue**: Students think Trap is irrational.  
     - **Handling**: Stress that Trap *is* EU-maximizing *after* seeing S1 (35 > 30). Harm arises from the *menu change*, not myopia.  

  3. **Issue**: Small sample size (only 12 students) → Round 4 lookers may "get lucky" (more S1 flips).  
     - **Handling**: Flip coins publicly for each looker, record outcomes. Even if 10/12 lookers get S1, note:  
       - *Actual avg. for lookers*: (10×35 + 2×0)/12 ≈ 29.2 (still < 20? No!) → **Clarify**: Non-lookers *all* get 20. Lookers’ EU *ex-ante* is 17.5. If more S1s occur, real-world luck ≠ refutation.  

  ---

  ### **Limitation & What You Must Supply**  
  - **What the game cannot reproduce**: The *ex-ante* expectation of EVOI.  
    - **Why**: Players see real outcomes, not abstract probabilities. In Round 4, lookers who get S1 feel smart (35 > 20), masking the *expected* loss.  
  - **What you must supply**: Stress that **EVOI is an ex-ante concept**. Even if lucky players celebrate, the *decision to look* was harmful *on average* before the coin flip.  

  ---

  **Verdict**: fixed set of available actions.
