answer: |-
  Here is a comprehensive exam package designed to meet your specifications. The question forces engagement with textual ambiguity, legislative history traps, and methodological tensions, while the model answer and marking scheme provide clear evaluative criteria.

  ---

  ### Exam Question (30 marks, 90 minutes)
  **Interpret the following statute and apply it to two scenarios. For each scenario, determine whether the device requires a permit. Resolve any ambiguities using statutory interpretation principles. Critically evaluate whether textualist and purposivist approaches would yield different outcomes, and discuss what this reveals about debates over statutory meaning.**

  **Statute:** *The Automated Delivery Device Act*  
  1. No automated delivery device shall operate on a public sidewalk or in a crosswalk without a permit issued under this chapter.  
  2. "Automated delivery device" means a self-propelled machine that transports goods to a customer’s address.  
  3. This chapter does not apply to a device that is under the continuous physical control of a natural person.  
  4. The department shall issue a permit to any applicant who pays the fee and files a safety plan.  

  **Legislative History:**  
  - An early draft of §3 included the phrase "except devices weighing less than fifty pounds," but this was deleted in conference.  
  - When asked about small robots, the floor sponsor stated they were "leaving it to the department" and called the issue "a mess."  

  **Current Context:**  
  The department has halted new permits pending a study. Small robots are de facto banned; large ones operate freely.  

  **Scenarios:**  
  (a) A **6-pound robot** navigates autonomously. One remote operator supervises 40 robots simultaneously and can take control if problems arise.  
  (b) A **200-pound robot** is followed by a worker holding a "dead-man switch" that stops the device if released.  

  ---

  ### Model Answer (650 words)
  The statute’s central ambiguity lies in §3’s exemption for devices under "continuous physical control." This phrase is undefined and raises three questions: (1) Does "physical" require immediate proximity? (2) Does "control" demand active operation or merely intervention capacity? (3) Is "continuous" temporal (unbroken) or functional (reliable when needed)? Without clarification, both scenarios present close cases.  

  **Applying the Statute:**  
  - **Scenario (a):** The 6-pound robot likely *requires a permit*. While a human *can* intervene remotely, they lack "physical" proximity (§3) and divide attention across 40 devices, undermining "continuous" control. Textually, "physical" suggests bodily presence, and "continuous" implies undivided focus. The remote operator’s sporadic oversight fails this standard, placing the device under the permit requirement (§1).  
  - **Scenario (b):** The 200-pound robot likely *does not require a permit*. The worker maintains immediate physical presence and direct control via the dead-man switch. Though not actively steering, their grip on the switch constitutes "physical control" that is "continuous" through constant readiness. This satisfies §3’s exemption.  

  **Legislative History and Purpose:**  
  The deleted 50-pound exemption complicates purposive analysis. Superficially, its removal suggests intent to regulate *all* devices. However, the floor sponsor’s comments reveal legislators deliberately *avoided* resolving small robots, delegating the issue to the department. Invoking the deletion as evidence of a "purpose" to regulate small robots is thus flawed—it contradicts the legislature’s explicit admission of uncertainty. Instead, the deletion signals a conscious choice *not* to adopt size-based distinctions, making purpose ambiguous.  

  **Textualism vs. Purposivism:**  
  - A **textualist** would prioritize §3’s plain language. For (a), "physical control" requires human presence; remote oversight is insufficient. For (b), the worker’s proximity and switch satisfy the exemption. The deleted clause is irrelevant—only enacted text matters.  
  - A **purposivist** would note the statute’s safety goals but confront the legislature’s intentional indecision. The sponsor’s "mess" comment suggests regulating small robots was deferred to agencies. Thus, purposivism might exempt (a) as the legislature’s "unresolved" category, while permitting (b) aligns with exempting human-supervised devices.  

  Crucially, *both methods reach the same outcomes*: (a) requires a permit; (b) is exempt. Textualism achieves this through linguistic analysis; purposivism through the legislature’s deliberate delegation. This convergence suggests the textualism/purposivism debate is less about outcomes and more about *legitimacy*. Textualists avoid unenacted intent to preserve democratic accountability; purposivists prioritize adaptive governance. Here, the legislature’s ambiguity forces both approaches to rely on context—textualists on semantic nuance, purposivists on institutional deference. The debate thus reflects divergent theories of legislative authority, not meaning itself.  

  **Broader Implications:**  
  The department’s moratorium exacerbates the statute’s tensions, banning small robots while exempting large ones—opposite to apparent safety priorities. But interpreters cannot fix this mismatch; the legislature explicitly delegated the problem. This highlights statutory interpretation’s limits: when text and purpose are ambiguous, courts and agencies must navigate gaps without usurping legislative role.  

  ---

  ### Marking Scheme (30 marks total)
  **A-grade (25–30 marks) must demonstrate:**  
  1. **Precise ambiguity identification** (5 marks):  
     - Names *all three* dimensions of "continuous physical control" (proximity, nature of control, temporality).  
     - Avoids declaring text "clear"; argues why ambiguity exists.  
  2. **Accurate scenario resolution** (10 marks):  
     - (a) Requires permit: Links remote supervision to lack of *physical* proximity and *continuous* attention.  
     - (b) Exempt: Connects dead-man switch to immediate physical intervention.  
     - Rejects surface-level "safety" assumptions (e.g., doesn’t assume heavy=regulated).  
  3. **Sophisticated legislative history use** (7 marks):  
     - Identifies deletion of weight clause as evidence of *deliberate omission*, not implied purpose.  
     - Uses sponsor’s "mess" comment to show legislative delegation, not intent to regulate small robots.  
  4. **Methodological insight** (5 marks):  
     - Notes textualism/purposivism *converge* on outcomes but *diverge* on reasoning.  
     - Argues the debate concerns institutional legitimacy (democracy vs. adaptability), not semantic meaning.  
  5. **Clarity and structure** (3 marks):  
     - Logical progression; avoids tangents.  

  **B-grade (18–24 marks) may:**  
  - Identify ambiguity but miss 1–2 dimensions (e.g., omits "temporality").  
  - Resolve scenarios correctly but with weak textual analysis (e.g., focuses only on weight).  
  - Misuse legislative history: Assumes deletion *proves* intent to regulate small robots (trap!).  
  - Oversimplify textualism/purposivism as inherently opposed outcomes.  
  - Have minor gaps in logic or structure.  

  **C-grade or below (<18 marks):**  
  - Declares text "unambiguous" or ignores ambiguity.  
  - Reaches wrong outcomes (e.g., exempts (a)/permits (b) without textual basis).  
  - Treats deleted clause as binding evidence of purpose.  
  - Fails to compare methodologies or address delegation.  
  - Disorganized; conflates scenarios.  

  ---

  ### Why This Works
  - **Avoids real-case crutches:** No named doctrines or cases—forces analysis of hypothetical text.  
  - **Targets your traps:**  
    - The deleted clause lures students into misconstruing purpose; A-answers must reject this.  
    - Remote vs. proximate control tests "physical" ambiguity.  
    - Heavy/light inversion prevents rote safety arguments.  
  - **Meta-question addressed:** Shows textualism/purposivism converge here, exposing the debate as one of institutional legitimacy.  
  - **Grading precision:** Marking scheme rewards nuanced moves (e.g., "deletion as deliberate omission") and penalizes common errors (e.g., "deletion as implied intent").  

  Let me know if you’d like a shorter version, additional scenarios, or adjusted weightings!
