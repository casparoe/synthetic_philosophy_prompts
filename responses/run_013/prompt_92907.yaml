  Hmm, why does the memoir work for them but not the documentary? Both are real. Maybe because the memoir is crafted as a narrative, offering insight or beauty, while the documentary feels immediate and calls for action. The ancient play is distant, so it doesn't impose real-world demands. 

  Their mixed verdict on case 7 (beautiful but no redemption) is interesting. They lean towards no enjoyment. That suggests that beauty alone isn't enough; there needs to be some insight or meaning beyond the sadness. 

  For case 8 (VR without pause), they feel trapped. Control seems important here. If they can't disengage, the sadness becomes overwhelming, not part of a framed experience. 

  Let me brainstorm principles. First, the **Aesthetic Distance Principle**: enjoyment requires psychological separation where sadness is observed, not lived. This explains why real conversations (case 2) and immersive VR (case 8) aren't enjoyed. But does it handle the memoir? Maybe, because even though real, it's mediated through art. 

  Second, **Cognitive Enrichment Principle**: enjoyment comes when sadness is paired with insight, beauty, or meaning. This explains why the manipulative story (case 6) fails—no real insight—and why the beautiful but empty story (case 7) is mixed. The documentary (case 5) might lack this enrichment, focusing on raw suffering. 

  Third, **Volitional Control Principle**: enjoyment depends on the ability to engage or disengage voluntarily. This covers the VR case (no control, no enjoyment) and the song on repeat (control to listen when wanted). But does it explain the memoir? They choose to read it, so yes. 

  Fourth, **Fictional/Real Divide Principle**: fiction is enjoyed; real suffering isn't. But case 10 (memoir) and case 9 (ancient real events) challenge this. The memoir is real but enjoyed, ancient events are real but distant. So this principle is too simplistic. 

  Now, testing these. The Aesthetic Distance and Cognitive Enrichment principles together seem promising. Combining them: enjoyment occurs when sadness is framed with distance and enriched with cognitive value. 

  Case 10, the memoir: it's real but framed artistically, offering insight, so it fits. Case 5, the documentary: it might lack sufficient framing or cognitive enrichment if it's purely graphic. Case 9, ancient play: distance in time provides framing. 

  Repairing the principle: add **framing** (artistic presentation that creates distance) and **cognitive-affective enrichment** (adds insight, beauty, etc.). Also, **volition** matters—choosing to engage. 

  Final principle: **Framed Cognitive-Affective Enrichment with Voluntary Engagement**. 

  - Framing: Artistic mediation (cases 1,3,9,10 vs 2,5,8). 
  - Enrichment: Insight/beauty (cases 1,3,4,10 vs 6,7). 
  - Volition: Control to engage (cases 1,3,4,9,10 vs 8). 

