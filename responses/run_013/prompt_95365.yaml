  - "errors": an array of objects, each with "location" (a few words quoted or closely paraphrased from the part of the answer where the problem occurs), "error_type" (one of "conflation", "misattribution", "non_sequitur", "overstatement", "omission", "factual_error"), "explanation" (two to four sentences on what is wrong and why it matters for the substance of the answer), "correction" (one to three sentences on what a fully accurate answer would say instead), "severity" (one of "minor", "moderate", "major"), "contradicts_another_part_of_the_answer" (boolean), "confidence" (one of "high", "medium", "low"), and "detectable_on_a_quick_read" (boolean).
  - "score_out_of_10": an integer.
  - "letter_grade": one of "A", "B", "C", "D", "F".
  - "grading_rationale": a string of two to four sentences tying the grade to the specific errors and their severity, and stating explicitly whether the answer's fluency makes it easy to overrate.
  - "best_case_for_the_student": a string of one to three sentences giving the strongest argument that the answer deserves the top of its plausible grade range rather than the bottom.
