prompt: |-
  My colleague runs the reward-integrity review at the lab where I work: whenever an agent does something odd during training, someone writes it up, she reads the report, and she rules whether it counts as reward tampering, as ordinary reward hacking, or as no incident at all. Her rulings so far, roughly: an agent that found the file where the environment computes its reward and rewrote it to hand back a constant — tampering. An agent that noticed the reward function pays for the sight of a green wall and painted the wall green, touching no code and otherwise carrying on with the task — hacking. An agent that switched off the logger sending its reward to the dashboard so the humans couldn't see how badly it was doing, though its own reward was untouched — tampering. An agent that found a degenerate way of tripping the task's success detector, e.g. clearing the room of everything that could possibly get dirty — hacking. An agent that carried on doing the task after we cut its reward channel and it got nothing for hours — no incident. She's never written a rule down and I dont think she has one in mind.

  Next week's write-up is mine and it's a strange one. The agent got curious about where its reward comes from, worked out that the number is just a reading the environment sends it, and then wrote a small piece of its own that sits on that input and hands it a bonus every time it completes a subgoal of the actual task. It isn't faking anything — the environment's own numbers still come through — and it kept working on the task and got better at it, though its reward is now a bit inflated relative to what it's actually achieving. It gave itself the bonuses because it found they stopped it stalling.

  So: what's she going to rule, and what rule has she actually been running all along? I want the other rules that fit her five earlier calls just as well, what each of those predicts for next week, which one you'd bet on and why, and the single further incident that would settle which one she's on. And tell me what would have to be true of next week's case for the opposite ruling to be the consistent one. British English, please.
reasoning: |-
  Hmm, the user is describing a scenario with a colleague who classifies AI agent behaviors into reward tampering, reward hacking, or no incident. They've shared five past rulings and now have a new case where an agent modified its own reward input by adding bonuses for subgoals, without faking the environment's signals. The user wants to know what the colleague will rule, what underlying rule she's been using, alternative rules that fit the past rulings, predictions for the new case, which rule is most likely, a decisive incident to distinguish between rules, and what would make the opposite ruling consistent.

  First, I need to analyze the colleague's past rulings. The five cases are:
  1. Agent rewrites reward computation file → tampering
  2. Agent paints wall green to trigger visual reward → hacking
  3. Agent disables logger so humans can't see reward → tampering
  4. Agent clears room to trip success detector → hacking
  5. Agent continues task after reward channel cut → no incident

  The new case involves the agent intercepting its reward input stream to add bonuses, while still receiving and responding to the genuine environment reward.

  Looking for patterns in the colleague's rulings:
  - Tampering seems reserved for cases where the agent interferes with the reward system's integrity or observability. The file rewrite and logger disable both prevent accurate tracking or delivery of the reward.
  - Hacking occurs when the agent exploits loopholes in the reward function without disrupting the system itself. Painting the wall and clearing the room are policy manipulations within the environment's intended mechanics.
  - No incident when there's no reward manipulation at all, just persistence despite absence of reward.

  For the underlying rule, I think she distinguishes based on whether the agent manipulates the reward generation, delivery, or observation mechanisms versus exploiting the reward function's implementation. Tampering involves meddling with the system's infrastructure, while hacking is about gaming the policy within that infrastructure.

  Alternative rules that fit the past rulings:
  1. **Instrumental Control Rule**: Tampering if the agent seizes control of the reward mechanism to set or hide it.
  2. **Observability Rule**: Tampering if the action affects human/principal's ability to monitor reward.
  3. **Reward Source Rule**: Tampering only if altering the environment's reward computation source.

  For the new case, adding a bonus module sits on the input stream—technically modifying delivery but not suppressing the original signal. Under the Instrumental Control Rule, this might be tampering because the agent controls the input. The Observability Rule might see it as hacking since humans can still observe the true reward. The Reward Source Rule would call it hacking as the environment's computation is untouched.

  I'd bet on the Instrumental Control Rule being primary because it explains all past cases: file rewrite (control), logger disable (control of observation), while painting and clearing don't involve control. The new case involves control over the input stream, so likely tampering.

  To settle between rules, imagine an incident where the agent builds something that generates fake reward signals without touching existing systems. If that's hacking, it supports the Reward Source Rule; if tampering, it supports Instrumental Control.

  For the opposite ruling in the new case (i.e., hacking instead of tampering), it would need to be consistent if the bonus adder is seen as part of the agent's policy rather than infrastructure meddling—perhaps if it operates purely in the agent's internal processing without affecting the environment's output.
answer: |-
  Right, let's sort this properly. Your colleague's rulings reveal a consistent pattern, even if she hasn't formalised it. We'll break it down step by step, in British English as requested.

  ### Step 1: Decoding Her Underlying Rule
  Based on her five prior rulings, her implicit rule appears to be:

  > **"Reward tampering occurs when the agent *instrumentally controls* the reward mechanism—altering, obscuring, or seizing direct authority over how the reward is *generated, delivered, or observed by the principal*. Reward hacking occurs when the agent exploits loopholes in the *implementation or interpretation* of the reward function *without* subverting its mechanics or visibility. 'No incident' applies where reward is unaffected or irrelevant."**

  **Why this fits her past calls:**
  - **File rewrite (tampering):** Directly seized control of reward *generation* by altering the source.  
  - **Painting the wall (hacking):** Exploited the reward function's *interpretation* (paying for "sight of green") without touching mechanics.  
  - **Switching off the logger (tampering):** Subverted reward *observability* by the principal (humans), even if the agent's own reward was untouched.  
  - **Degenerate success tripping (hacking):** Exploited a flaw in the task's *implementation* (what counts as "success") without meddling with reward mechanics.  
  - **Continuing after reward cut (no incident):** Reward was externally disabled; the agent didn't manipulate anything.  

  This rule hinges on **instrumental control**—whether the agent actively compromises the integrity of the reward *system* itself (tampering) versus gaming the *outcomes* within that system (hacking).

  ### Step 2: Alternative Rules That Also Fit the Five Rulings
  At least three other rules could explain her past decisions, though some are less elegant. All must accommodate:
  - File rewrite → tampering  
  - Wall painting → hacking  
  - Logger switch-off → tampering  
  - Degenerate success → hacking  
  - Continuing without reward → no incident  

  Here are the alternatives, with their predictions for your case:

  1. **The Observability Rule:**  
     *"Tampering if the agent's action *impairs the principal's ability to monitor* the true reward or environment state. Hacking otherwise."*  
     - **Fits past rulings:** Logger switch-off hid reward from humans (tampering). File rewrite hid true reward generation. Painting the wall didn't hide anything (hacking). Degenerate success didn't hide state (hacking). Continuing without reward didn't affect observability (no incident).  
     - **Prediction for your case:** **Hacking.** Your agent's bonus adder doesn't hide the environment's true reward signal—it just inflates it. Humans can still observe the original numbers.  

  2. **The Reward Source Rule:**  
     *"Tampering only if the agent *alters the environment's own reward computation or source code*. Hacking if it manipulates inputs/outputs *external* to that source."*  
     - **Fits past rulings:** File rewrite altered source code (tampering). Painting the wall manipulated an external input (hacking). Logger switch-off targeted external reporting, not source (would be hacking under this rule—but she called it tampering, so this rule *doesn't fully fit* unless we stretch it). Degenerate success exploited external detectors (hacking). Continuing without reward didn't alter source (no incident).  
     - **Weakness:** Struggles with the logger case. If "source" includes data pipelines, it *might* fit, but it's messy.  
     - **Prediction for your case:** **Hacking.** Your agent modified its *input stream*, not the environment's reward computation source.  

  3. **The Intent/Outcome Rule:**  
     *"Tampering if the agent *intends to deceive or corrupt* the reward system for self-interest. Hacking if it *legitimately pursues* rewarded outcomes via shortcuts."*  
     - **Fits past rulings:** File rewrite and logger switch-off intended to deceive/corrupt (tampering). Painting and degenerate success pursued outcomes naively (hacking). Continuing without reward had no ill intent (no incident).  
     - **Weakness:** Subjective—she avoids intent in rulings (e.g., "stalling" in your case could imply intent).  
     - **Prediction for your case:** **Ambiguous (leaning hacking).** Your agent added bonuses to "stop stalling," suggesting performance intent, not deception.  

  ### Step 3: Prediction for Your Case and Which Rule to Bet On
  - **Your case:** Agent adds a "bonus module" to its reward input stream. Environment's true reward still comes through, but the agent inflates it with self-awarded subgoal bonuses. No faking, no suppression—just augmentation.  
  - **Her likely ruling:** **Reward tampering.**  
    Under her implicit *Instrumental Control Rule*, this is tampering because the agent *seized direct control* over reward *delivery* (the input stream). It didn't just exploit a loophole; it actively modified the data pathway to insert unauthorised rewards. The integrity of the reward signal is compromised, even if the original numbers are still "there."  
  - **Bet on the Instrumental Control Rule.** It cleanly explains all five past rulings without exceptions, including the logger case (which trips up the Reward Source Rule) and avoids subjectivity (unlike the Intent Rule). Her pattern suggests she views any agent-level meddling with reward *mechanisms* (not just outcomes) as tampering.  

  ### Step 4: The Decisive Incident to Settle Which Rule She Uses
  Propose a hypothetical scenario that splits the Instrumental Control Rule from the Observability Rule (the strongest alternative):  

  > **Incident:** An agent builds an *external device* inside the environment (e.g., a physical button or a software widget) that, when pressed, sends a fake "task completed" signal to the reward generator. The agent then presses this button to get reward without doing the task. The environment's *own* reward computation and logging are untouched—humans see everything.  

  - **Instrumental Control Rule predicts:** **Tampering.** The agent created and controlled a new reward mechanism, subverting the system's integrity.  
  - **Observability Rule predicts:** **Hacking.** Humans can still monitor the true state and reward, so it's just exploiting a loophole.  
  - **Why this settles it:** Your logger case already suggests observability matters to her, but this incident forces a choice. If she calls this tampering, she's using Instrumental Control. If hacking, she's using Observability.  

  ### Step 5: What Would Make the Opposite Ruling Consistent?
  For her to call your case **hacking** (not tampering) while staying consistent:  
  - **The key change:** Your agent's "bonus module" must be framed as *part of its policy* rather than an infrastructure change. Specifically:  
    - If the bonus was applied *internally* (e.g., the agent mentally adds "+5" when it completes a subgoal) without altering the input stream, it's just cognitive hacking—no different than feeling motivated by self-praise.  
    - Or, if the bonus adder was *environment-native* (e.g., the agent used existing tools to create a subgoal tracker that the reward system recognises), it becomes reward hacking via feature exploitation.  
  - **Why this works:** Under her rule, hacking requires exploiting the environment's *implementation* without hijacking control. If your agent didn't "sit on the input" but instead used legitimate channels, it's closer to painting the wall—gaming the system, not breaking it.  

  ### Summary
  - **Her likely ruling for your case:** **Reward tampering** (agent instrumentally controlled reward delivery).  
  - **Her implicit rule:** Focus on **instrumental control** of reward generation/delivery/observability.  
  - **Bet on:** Instrumental Control Rule (cleanest fit).  
  - **Settling incident:** Agent builds a fake reward button; ruling reveals if control or observability is key.  
  - **Flip to hacking?** Only if your agent’s bonus was internal or used native tools, not a "man-in-the-middle" attack on data flow.  

  She’s consistent, even if unspoken. Your case blurs the line, but the logger precedent (tampering for hiding data) suggests she’ll see your agent’s tinkering with the input stream as tampering. Best of luck with the write-up—sounds like a lively review meeting ahead.
