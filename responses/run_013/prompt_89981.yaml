prompt: |-
  I am working on a foundations seminar and need the specification for a theory of iterated dominance elimination when mixed strategies are permitted. Before I assess any particular solution concept, tell me what such a theory must deliver: the cases it has to get right (pure-strategy dominance that only mixed strategies can expose; games where elimination order changes what survives; simultaneous elimination in which a strategy is removed by a mixture of strategies that are themselves removed in the same round; and cases where weak dominance and admissibility diverge), the distinctions it cannot collapse (strict versus weak dominance, pure versus mixed dominators, one-shot versus iterated elimination, and being eliminated versus being irrational to play), and the formal constraints it must respect (existence of a determinate survivor set, invariance under positive affine payoff transformations, and consistency with common knowledge of rationality). Give the consideration behind each requirement, mark which are non-negotiable and which are the preferences of a particular approach, and flag the pair you suspect cannot be jointly satisfied. Finally, say which single requirement does most to exclude otherwise attractive theories. I do not need a survey or citations; I need the criteria.
reasoning: |-
  We are building the specification for a theory of iterated dominance elimination that allows mixed strategies. The theory must satisfy several requirements, which can be broken down into cases it must handle, distinctions it must preserve, and formal constraints it must meet.

  ### I. Cases the Theory Must Get Right

  These are critical test cases that any adequate theory must handle correctly.

  1. **Pure-Strategy Dominance That Only Mixed Strategies Can Expose**:
     - *Description*: There are games in which a pure strategy is not strictly dominated by any other pure strategy but is strictly dominated by a mixed strategy. The theory must recognize such dominance and eliminate the dominated pure strategy.
     - *Consideration*: This is fundamental because the power of mixed strategies in dominance comes from their ability to exploit weaknesses that no single pure strategy can. Without this, we might not eliminate all irrational strategies.
     - *Non-negotiable*: Yes.

  2. **Games Where Elimination Order Changes What Survives**:
     - *Description*: In some games, the order in which we eliminate dominated strategies can lead to different surviving sets. The theory must specify a well-defined procedure (like simultaneous elimination) that avoids such order-dependence and yields a unique survivor set.
     - *Consideration*: Without a fixed procedure, the theory would be ambiguous and might lead to multiple solutions. The standard solution is to eliminate all dominated strategies simultaneously in each round.
     - *Non-negotiable*: The requirement that the survivor set must be unique (or at least well-defined) is non-negotiable. However, the simultaneous elimination procedure is the typical way to achieve this.

  3. **Simultaneous Elimination Involving Mixed Strategies**:
     - *Description*: There might be a round in which a strategy is eliminated because it is dominated by a mixed strategy that itself is eliminated in the same round (because the mixed strategy is dominated by something else). The theory must account for this possibility and still correctly eliminate the strategy.
     - *Consideration*: The mixed strategy that dominates a given strategy might not survive the same round of elimination. However, the fact that such a dominator exists (even if it is removed) is sufficient to justify elimination. The theory must allow for this without requiring the dominator to survive.
     - *Non-negotiable*: Yes.

  4. **Cases Where Weak Dominance and Admissibility Diverge**:
     - *Description*: Weak dominance allows a strategy to be dominated if there is another that is at least as good in every contingency and strictly better in some. However, admissibility (avoiding strategies that are not best responses to any belief) is often associated with weak dominance. The theory must be able to handle the subtleties of weak dominance and admissibility, especially in iterated contexts.
     - *Consideration*: Weak dominance is more permissive than strict dominance and can lead to more eliminations. However, iterated weak dominance can be problematic because it may eliminate strategies that are admissible (i.e., not dominated by any mixed strategy). The theory must respect the distinction: a strategy that is weakly dominated might still be admissible, but in the iterated context, we often require admissibility at each step. There is a tension: some approaches to iterated weak dominance might eliminate too much or too little.
     - *Non-negotiable*: The theory must be clear about how it handles weak dominance and admissibility. However, there is no universal agreement on the exact treatment of weak dominance in iteration. Some theories (like the Dekel-Fudenberg procedure) use a mix of strict and weak dominance to avoid over-elimination. Therefore, the requirement to handle weak dominance correctly is non-negotiable, but the specific approach might vary.

  ### II. Distinctions the Theory Must Preserve

  These are conceptual distinctions that the theory must not collapse.

  1. **Strict vs. Weak Dominance**:
     - *Description*: The theory must distinguish between strict dominance (a strategy is strictly worse than another in every contingency) and weak dominance (a strategy is never better and sometimes worse). The latter is more controversial because it can lead to the elimination of strategies that are best responses to some beliefs (i.e., admissible).
     - *Consideration*: Strict dominance is uncontroversial and always leads to elimination. Weak dominance is more subtle and may require caution. The theory must not treat them as the same.
     - *Non-negotiable*: Yes.

  2. **Pure vs. Mixed Dominators**:
     - *Description*: The theory must allow for the possibility that a strategy is dominated by a mixed strategy even when it is not dominated by any pure strategy. The distinction between pure and mixed dominators is crucial because mixed strategies can dominate more strategies.
     - *Consideration*: This is a key reason for allowing mixed strategies in dominance. Without it, we would have a weaker solution concept.
     - *Non-negotiable*: Yes.

  3. **One-Shot vs. Iterated Elimination**:
     - *Description*: The theory must be clear about the difference between one round of elimination and the iterated process. What survives one round might be eliminated in a subsequent round because new dominators become available after removing strategies.
     - *Consideration*: Iterated elimination is a dynamic process that may go beyond one round. The theory must define the rounds (typically simultaneous elimination in each round) and the stopping condition.
     - *Non-negotiable*: Yes.

  4. **Being Eliminated vs. Being Irrational to Play**:
     - *Description*: The theory must not conflate a strategy being eliminated by the algorithm with it being irrational to play. The elimination procedure is a tool to identify irrationality, but the connection must be justified. In particular, a strategy that survives is not necessarily rational to play in every context (it might be weakly dominated but not strictly, and hence survive strict elimination), and a strategy that is eliminated is irrational only if the elimination steps are justified by common knowledge of rationality.
     - *Consideration*: The theory must be grounded in rationality. A strategy is eliminated only if it is never a best response (under strict dominance) or not admissible (under weak dominance). The procedure must reflect this.
     - *Non-negotiable*: The requirement that elimination must correspond to irrationality is non-negotiable. However, the exact link between the procedure and rationality might be a matter of philosophical debate.

  ### III. Formal Constraints the Theory Must Respect

  These are mathematical properties that the procedure must satisfy.

  1. **Existence of a Determinate Survivor Set**:
     - *Description*: The iterated elimination process must converge to a well-defined set of strategies (possibly empty, but typically non-empty for games with strict dominance) that does not depend on arbitrary choices (like the order of elimination). This set is called the survivor set.
     - *Consideration*: Without this, the theory would not provide a clear prediction.
     - *Non-negotiable*: Yes.

  2. **Invariance Under Positive Affine Payoff Transformations**:
     - *Description*: The solution (the survivor set) must be invariant if we apply a positive affine transformation to the payoffs of any player (i.e., multiplying by a positive constant and adding a constant). This is because such transformations do not change the strategic structure (they preserve preferences up to linear transformations).
     - *Consideration*: Game theory assumes that payoffs represent von Neumann-Morgenstern utilities, which are unique up to positive affine transformations. Therefore, the solution concept must respect this invariance.
     - *Non-negotiable*: Yes.

  3. **Consistency with Common Knowledge of Rationality**:
     - *Description*: The elimination procedure must be justifiable by the assumption that players are rational and that this rationality is common knowledge. In particular, at each step, the eliminated strategies must be those that a rational player would never play given the common knowledge that only the surviving strategies of others are played.
     - *Consideration*: This is the foundational justification for iterated dominance. Without it, the procedure would be ad hoc.
     - *Non-negotiable*: Yes.

  ### IV. Potential Tensions

  - **Flagged Pair That Might Not Be Jointly Satisfiable**: 
     The requirement of **handling weak dominance and admissibility** and the requirement of **existence of a determinate survivor set** might conflict. 
     - *Why?*: Iterated weak dominance is known to be order-dependent in general. Even with simultaneous elimination, the survivor set of iterated weak dominance may not be unique. Moreover, there is a tension between admissibility (which requires avoiding weakly dominated strategies) and the desire to have a well-defined survivor set. For instance, the Dekel-Fudenberg procedure (which uses one round of weak dominance and then iterated strict dominance) is one way to get a well-defined set, but it might not capture all admissibility considerations in the iterated context.

  ### V. The Single Requirement That Does the Most to Exclude Theories

  - **The requirement that the theory must handle cases of "pure-strategy dominance that only mixed strategies can expose" does the most to exclude otherwise attractive theories.** 
    - *Why?*: Without mixed strategies, we have a simpler theory (pure iterated dominance) that is computationally easier and avoids the complications of mixed strategies. However, this requirement forces the theory to consider mixed strategies, which are more complex and might lead to computational intractability. Moreover, it rules out theories that only consider pure dominators (like some early game theory models) which are insufficient for capturing the full power of dominance.

  ### Summary of Non-negotiable vs. Preferences

  - **Non-negotiable**:
    - Pure-strategy dominance exposed only by mixed strategies.
    - Simultaneous elimination that can remove a strategy by a mixture that is itself removed in the same round.
    - Distinctions: strict vs. weak dominance, pure vs. mixed dominators, one-shot vs. iterated.
    - Formal constraints: existence of a determinate survivor set, invariance under affine transformations, consistency with common knowledge of rationality.
    - The requirement that elimination must correspond to irrationality (though the exact link is debated).

  - **Preferences of a Particular Approach**:
    - The exact treatment of weak dominance and admissibility (e.g., whether to use iterated weak dominance or a mixed procedure like Dekel-Fudenberg) may vary by approach. Some approaches might prefer to avoid iterated weak dominance because of its problems, while others might embrace it with caution.

  Note: The requirement for a well-defined survivor set is non-negotiable, but the way to achieve it (simultaneous elimination) is standard but not the only possibility. However, the standard approach is simultaneous elimination.

  This specification provides the criteria for evaluating a theory of iterated dominance with mixed strategies.
answer: |-
  ### Specification for a Theory of Iterated Dominance Elimination with Mixed Strategies

  A theory of iterated dominance elimination permitting mixed strategies must satisfy the following requirements to be considered adequate. The criteria are grouped into **cases**, **distinctions**, and **formal constraints**. Each requirement is annotated with its rationale, negotiability status, and impact.

  ---

  #### **I. Cases the Theory Must Get Right**  
  *(Test scenarios that the theory must resolve correctly)*

  1. **Pure-Strategy Dominance Exposed Only by Mixed Strategies**  
     - **Description**: A pure strategy is undominated by any pure strategy but dominated by a mixed strategy. The theory must eliminate such pure strategies.  
     - **Rationale**: Mixed strategies expand the scope of dominance beyond pure strategies; failing this implies under-elimination.  
     - **Non-negotiable**: Yes.  

  2. **Elimination Order Sensitivity**  
     - **Description**: Games where sequential elimination order affects the survivor set (e.g., eliminating Strategy A before B leaves a different outcome than B before A). The theory must ensure a unique survivor set regardless of order.  
     - **Rationale**: Order dependence undermines predictive power; simultaneous elimination is the standard fix.  
     - **Non-negotiable**: Yes (determinism is essential).  

  3. **Simultaneous Elimination via Transient Mixtures**  
     - **Description**: Cases where a strategy is eliminated by a mixed strategy that is itself eliminated in the same round. The theory must permit such "transient dominators."  
     - **Rationale**: Rationality depends on dominance relationships existing at the time of elimination, not survivability of dominators.  
     - **Non-negotiable**: Yes.  

  4. **Weak Dominance vs. Admissibility Divergence**  
     - **Description**: Games where weakly dominated strategies are admissible (i.e., best responses to some beliefs). The theory must not conflate weak dominance with inadmissibility.  
     - **Rationale**: Weak dominance does not imply irrationality (admissibility matters for subjective rationality).  
     - **Non-negotiable**: Partially (handling divergence is mandatory, but approaches vary in tolerating weak dominance).  
       - *Preference*: Conservative theories exclude iterated weak dominance to preserve admissibility.  

  ---

  #### **II. Distinctions the Theory Cannot Collapse**  
  *(Conceptual boundaries the theory must uphold)*

  1. **Strict vs. Weak Dominance**  
     - **Description**: Strict dominance (strictly worse in all contingencies) vs. weak dominance (never better, sometimes worse). The theory must treat these as non-equivalent.  
     - **Rationale**: Weak dominance is sensitive to belief structures and may not justify elimination under common knowledge of rationality.  
     - **Non-negotiable**: Yes.  

  2. **Pure vs. Mixed Dominators**  
     - **Description**: Dominance by pure strategies vs. mixtures. The theory must recognize mixed dominators as distinct (e.g., they can dominate strategies pure ones cannot).  
     - **Rationale**: Mixed strategies are necessary for comprehensive dominance; collapsing this distinction weakens the theory.  
     - **Non-negotiable**: Yes.  

  3. **One-Shot vs. Iterated Elimination**  
     - **Description**: The theory must differentiate outcomes of a single elimination step from iterated processes.  
     - **Rationale**: Iteration leverages deeper chains of rationality; conflating stages obscures the role of common knowledge.  
     - **Non-negotiable**: Yes.  

  4. **Eliminated vs. Irrational to Play**  
     - **Description**: A strategy eliminated by the algorithm may still be playable without irrationality (e.g., weakly dominated but admissible strategies). The theory must not equate elimination with irrationality.  
     - **Rationale**: Elimination is a technical procedure; irrationality depends on epistemic conditions (e.g., belief consistency).  
     - **Non-negotiable**: Partially (elimination must imply irrationality under strict dominance; weak dominance is context-dependent).  
       - *Preference*: Epistemically rigorous theories demand elimination entails irrationality.  

  ---

  #### **III. Formal Constraints the Theory Must Respect**  
  *(Mathematical/logical properties)*

  1. **Existence of a Determinate Survivor Set**  
     - **Description**: The process must converge to a unique, non-empty (for generic games) set of surviving strategies.  
     - **Rationale**: Predictability requires a well-defined solution.  
     - **Non-negotiable**: Yes.  

  2. **Invariance Under Positive Affine Payoff Transformations**  
     - **Description**: Payoff transformations \( u_i \mapsto a u_i + b \) (\(a > 0\)) must not alter the survivor set.  
     - **Rationale**: Game theory assumes ordinal preferences; invariance preserves strategic equivalence.  
     - **Non-negotiable**: Yes.  

  3. **Consistency with Common Knowledge of Rationality (CKR)**  
     - **Description**: The survivor set must align with strategies playable under CKR (i.e., no eliminated strategy is rationalizable).  
     - **Rationale**: Iterated dominance is justified by CKR; violations imply epistemic incoherence.  
     - **Non-negotiable**: Yes.  

  ---

  #### **IV. Key Tensions and Exclusivity**

  - **Suspected Incompatible Pair**:  
    **Determinate Survivor Set** vs. **Weak Dominance Handling**.  
    - **Rationale**: Iterated weak dominance often induces order dependence or non-convergence, jeopardizing a unique survivor set. Most theories (e.g., Dekel-Fudenberg) restrict weak dominance to one round to resolve this.  

  - **Most Exclusionary Requirement**:  
    **Pure-Strategy Dominance Exposed Only by Mixed Strategies**.  
    - **Rationale**: This excludes theories relying solely on pure dominators (e.g., naïve IDS), which fail in games like Matching Pennies where mixed strategies are necessary to expose dominance. It compels the use of mixed strategies, increasing complexity and limiting computational tractability.  

  ---

  #### **V. Negotiability Summary**
  - **Non-negotiable**:  
    Cases (1–3), distinctions (1–3), constraints (1–3), and CKR consistency.  
  - **Preference-Dependent**:  
    Weak dominance admissibility (distinction 4, case 4) and elimination-irrationality link (distinction 4).  
    - *Conservative Approach*: Avoid iterated weak dominance; use strict dominance or one-shot weak elimination (à la Dekel-Fudenberg).  
    - *Aggressive Approach*: Allow iterated weak dominance but sacrifice admissibility.  

  This specification defines a minimally adequate theory. The tension between weak dominance and determinacy, alongside the necessity of mixed dominators, shapes the core trade-offs.
