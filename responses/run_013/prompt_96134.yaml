  Usability by outsiders: even if a criterion is correct, can someone without local knowledge apply it? Credence 0.85—highly unlikely. Misinterpretations are common, as seen in development work where outsiders mislabel practices.

  Risk of domination: a universal standard could be misused to impose values. This shouldn't affect truth but makes application problematic. Credence 0.8 for the risk existing. This is about ethics, not the proposition's truth.

  Combining these: I'm multiplying the credences since they're interdependent. Starting from 0.7 for the functional kind, then adjusting down for other factors. Final credence around 0.15—quite low.

  Now, sensitivity analysis: the public/private distinction (credence 0.75) is most impactful. If I change it to 0.95, the total jumps to 0.23; to 0.55, it drops to 0.11. So that's the key sub-question.

  For the test case: the user's criterion involves an impartial observer endorsing the mandate. But in societies without role separation, is the mandate even definable? I think it's incoherent there—the observer concept relies on Western assumptions. So the issue is coherence, not just extensional adequacy.

