answer: |-
  Your gut calls reveal an intuitive grasp of ethical boundaries around copying, but they aren't fully consistent. The underlying principle isn't just about substitution or harm—it's about **whether the copying free-rides on invested creative effort or innovation without adding new value, and whether society has deemed such copying acceptable through rules like intellectual property expiration or fair use**. This principle balances incentives for creation against public access and competition. Let's break it down:

  ### How the Principle Explains Your Verdicts:
  1. **Standup copies a joke**: Not okay. The comic free-rides on Dana's creative effort (crafting the joke) without adding originality. Even with attribution, it harms Dana's exclusive "performance" value in comedy, which relies on novelty.
  2. **Food blogger copies a recipe**: Fine. The blogger adds new value (e.g., personal experience, presentation) and links back, transforming the original. Recipes are functional and meant to be used; the restaurant still benefits from sales and publicity.
  3. **Perfume reverse-engineered**: Not okay. This free-rides on the original's R&D investment and creative effort (scent design) without adding new value. It directly harms the market by undercutting the innovator, similar to the joke.
  4. **Fast-fashion copies a dress**: **Inconsistent—should be not okay**. Like the perfume, this free-rides on creative design effort without adding value, harming the small designer's market. Your "jerk move but not worked up" reaction might stem from desensitization to fashion knock-offs, but ethically, it aligns with the perfume (creative effort copied).
  5. **Generic drug post-patent**: Fine. Society explicitly allows this via patent expiration to promote competition and access. No free-riding—it's a policy-based exception.
  6. **Drug tweak to extend patent**: Not fine. This evades the social contract of patent expiration, free-riding on the original innovation without meaningful new value (just a minor tweak). It harms access.
  7. **Drum break sampled**: Not okay. It free-rides on the drummer's creative expression without permission, credit, or compensation. Even as part of a new song, it doesn't add enough transformative value to offset the harm to the original artist.
  8. **Rival reprints phone directory**: **Inconsistent—should be fine**. The numbers are facts from public records, requiring no creativity, so copying doesn't free-ride on innovation. Compilation effort alone doesn't merit protection (as per copyright law's "sweat of the brow" doctrine). Your "not fine" verdict likely overvalues effort, but ethically, this is acceptable reuse.

  ### Inconsistencies Addressed:
  - **Perfume vs. dress**: These are similar (creative designs copied for cheaper alternatives), yet you have opposite calls. The perfume verdict (not okay) is correct under the principle, but the dress verdict must be overturned to align. Both involve free-riding on creative effort without transformation, harming the original market.
  - **Phone directory**: Your "not fine" verdict should be overturned. Copying factual data without creativity is acceptable—no free-riding on innovation.

  ### New Cases:
  - **AI model trained on a novelist's books**: Not okay. It free-rides on the novelist's creative effort and style investment without adding transformative value (e.g., commentary, parody). Even without reusing sentences, it risks harming the novelist's market by diluting their unique voice or enabling substitutes. Society hasn't deemed this acceptable yet (unlike patents).
  - **Magician publishes another's trick secret**: Not okay. This free-rides on decades of creative development and performance investment. Unlike functional knowledge (e.g., recipes), magic relies on secrecy for its value—publishing it harms the magician's market without adding new artistic or social value.

  ### Principle in One Plain Sentence:
  **Copying is unethical when it free-rides on invested creative effort or innovation without adding transformative value or social benefit, and when it harms the original creator's market, unless society has explicitly permitted it (e.g., expired patents, factual data).**

  \answer{Free-riding on creative effort without transformation or social justification; overturn the dress verdict (should be not okay) and the phone directory verdict (should be fine).}
