prompt: |-
  I write about science and ideas for a general audience — mind and brain stuff, mostly — and I'm working up a piece on the philosophers who say consciousness is an illusion. A friend of mine has a book draft in this area and sent me his chapter on them. He's a good writer and he's clearly read the literature, so I'd been treating his summary as reliable, but two people I mentioned it to have now winced, and I'm not sure wether I can use any of it. Here's his gist, in my words:

  "Consciousness is supposed to be the hard problem — there's something it's like to be you, and no amount of neuroscience ever touches that. The illusionists say the hard problem is a mistake. On their view phenomenal consciousness doesn't exist: no inner glow, no qualia, nothing it's like. What's real is a brain that represents itself as having those properties, and that representation is the illusion. So illusionism is really just eliminativism about consciousness in a nicer suit — it says the felt quality of pain is a bit of folk psychology that science will eventually drop, like phlogiston. And the payoff is that there's nothing left to explain: once you see the phenomenal properties were never there, the hard problem dissolves, and the only real question left is why we're so sure we have experiences. They lean on the psychology of introspection — confabulation, choice blindness, that kind of thing — to show we're not the reliable narrators of our own minds we think we are. They insist they aren't saying we're zombies, since they don't deny we're conscious in the ordinary sense, though I don't see how you get to say both of those things. And anyway the whole position looks self-undermining to me: an illusion has to seem like something to somebody, so if there's nothing it's like to be under the illusion, there's no illusion."

  My instinct is that the self-undermining point is fatal and the rest is a word game. But I've been wrong about this kind of thing before, and I'd rather not print something that gets me a pile of emails. What I need isn't a philosophy lecture, it's an accuracy audit I can act on: which parts of his summary are fair, which are subtly off, and whether the conclusions he draws from it — that the view collapses into eliminativism, and that it refutes itself — actually follow from the accurate parts. Don't bother with a reading list, I won't have room for it anyway.

  Give it to me in these sections, in this order:

  - "The short version" — 2-3 sentences, the thing I'd say out loud at a party.
  - "What holds up" — one short paragraph on the parts a specialist would nod along to.
  - "What's off" — the long one. Go claim by claim through his summary and tell me which bits are just wrong, which are common simplifications, and which are things a defender would say he's smuggled in. Be explicit about which of his sentences I should not repeat.
  - "How they'd answer him" — one paragraph in the voice of the strongest defender, especially on the self-undermining objection.
  - "What I can print" — a handful of sentences I could actually put in the piece, safe enough that nobody in the field writes me an angry email.

  American English please.
reasoning: |-
  Okay, the user is a science writer focusing on mind and brain topics for a general audience. They're working on a piece about philosophers who claim consciousness is an illusion and received a chapter from a friend's book draft. Though the friend is well-read and a good writer, two people winced at the summary, making the user question its reliability. They need an accuracy audit to determine what parts are fair, what's off, and whether the conclusions about eliminativism and self-undermining hold up. They want specific sections in a particular order without a reading list.

  The core of the friend's summary is that illusionists argue phenomenal consciousness doesn't exist—it's just the brain representing itself as having properties like qualia. This is framed as eliminativism in disguise, solving the hard problem by denying its existence. The friend also claims illusionism is self-undermining because illusions require something it's like to experience them.

  Assessing accuracy: The core illusionist position described is correct—thinkers like Dennett or Frankish do reject phenomenal properties as real, treating them as introspective misrepresentations. The comparison to eliminativism (like phlogiston) is also fair, and their reliance on psychological evidence (confabulation, choice blindness) is accurate. 

  But distortions appear in the friend's framing. Saying illusionists deny "nothing it's like" entirely oversimplifies—they reject *irreducible* phenomenality but accept cognitive access and reportability. The "zombie" accusation misses the nuance: illusionists distinguish phenomenal consciousness (denied) from functional consciousness (accepted). The claim that they "insist" they're not saying we're zombies is accurate, but the friend's skepticism about this is a personal interpretation, not a flaw in the position itself.

  The self-undermining objection is the friend's own argument, not a standard critique. While similar objections exist (e.g., Chalmers), illusionists have counterarguments—they'd say the "illusion" isn't a phenomenal experience but a false *judgment* generated by cognitive mechanisms. The friend's version assumes illusion requires phenomenality, which illusionists explicitly reject.

  The user should avoid repeating the friend's phrasing that illusionists deny "nothing it's like" entirely and the claim that their position is self-refuting without context. Instead, present illusionism as rejecting *irreducible* subjective qualities and emphasize their distinction between functional access and phantom phenomenality. 

  For the "What I can print" section, focus on neutral phrasing: illusionists argue that what we call phenomenal consciousness is a brain-generated representation, not an intrinsic property, and that resolving this dissolves the hard problem. The self-undermining point can be acknowledged as a common criticism but attributed to critics rather than stated as fact.
answer: |-
  Here's your accuracy audit, structured as requested:

  ### The short version
  Illusionists argue that the "inner glow" of consciousness isn't real—it's a trick the brain plays on itself. They claim science will show that subjective feelings like pain's *hurt* are misrepresentations, dissolving the "hard problem." Critics say this refutes itself because an illusion can't exist without *someone* experiencing it.

  ### What holds up
  Your friend accurately captures illusionism's core claim: phenomenal consciousness (subjective "what-it's-like-ness") is a misrepresentation, not a real feature of the world. He's correct that illusionists (e.g., Dennett, Frankish) lean heavily on cognitive psychology (confabulation, choice blindness) to show introspection is unreliable, and that they position this as dissolving the hard problem by eliminating its subject. The comparison to eliminativism about folk concepts like phlogiston is a standard framing used by both critics and some proponents.

  ### What's off
  Go claim-by-claim:

  1.  **"On their view phenomenal consciousness doesn't exist: no inner glow, no qualia, *nothing it's like*."**  
      *   **Subtly Off:** This is a common simplification critics make, but it's misleading. Illusionists **deny the existence of *irreducible* or *non-physical* phenomenal properties.** They *do* accept that there is "something it's like" *in the sense of cognitive access, reportability, and behavioral responses*—they just argue this isn't caused by or identical to mysterious qualia. They reject the *metaphysical interpretation* of "what-it's-like," not the functional reality of self-reporting and reacting. **Don't repeat "nothing it's like" without heavy qualification.** Say they deny *irreducible* subjective qualities.

  2.  **"So illusionism is really just eliminativism about consciousness in a nicer suit."**  
      *   **Fair Simplification:** Many illusionists (like Keith Frankish) explicitly embrace this, calling it "eliminativism about phenomenal properties." Others (like Dennett) prefer "illusionism" to emphasize the *cause* of the mistaken belief. It's a defensible characterization.

  3.  **"They insist they aren't saying we're zombies... though I don't see how you get to say both of those things."**  
      *   **Smuggled-in Skepticism:** Your friend's confusion ("I don't see how") is his interpretation, not an inaccuracy *in describing their claim*. Illusionists *do* insist they aren't positing zombies. Their argument hinges on a crucial distinction: they deny *phenomenal* consciousness (P-consciousness) but accept *access* or *report* consciousness (A-consciousness). Zombies, by definition, lack *all* consciousness (including A-consciousness). For illusionists, we have rich A-consciousness, which *is* "consciousness in the ordinary sense." **Don't imply their position logically *requires* zombies; present their distinction (P vs A consciousness) clearly.**

  4.  **"And anyway the whole position looks self-undermining to me: an illusion has to seem like something to somebody..."**  
      *   **Just Wrong (as a definitive refutation) & Smuggled-in Premise:** This is your friend's *own* argument, not an established fact. Illusionists explicitly reject the premise that an "illusion" requires a phenomenal subject experiencing it. They argue the "illusion" is a *false judgment* or *representation* generated by cognitive mechanisms. The seeming *is* the judging/representing, which *is* a physical process. Calling this "self-undermining" assumes the very thing (irreducible phenomenality) they deny. While this is a *common criticism* (Chalmers makes it), illusionists have detailed rebuttals. **Don't state this self-undermining point as an objective truth or fatal flaw; frame it as the *critics'* main objection.**

  ### How they'd answer him
  "Your self-undermining objection begs the question. It assumes an illusion *must* involve phenomenal experience – the very thing we deny is fundamental. The 'illusion' isn't a ghostly show for an inner spectator. It's simply the brain generating false *judgments* and *representations* about its own states, based on incomplete information and evolved heuristics. When we introspect, we access these misleading representations, not raw phenomenality. We experience cognitive access, reactivity, and the conviction of having qualia – and *that* is what it's like to be us. This functional reality is fully explainable by physical processes. Insisting on an extra layer of 'seeming' is the real illusion – clinging to a doomed folk intuition."

  ### What I can print
  *   "Illusionists argue that the hard problem of consciousness stems from a misconception: the felt quality of experience, like the 'hurt' of pain, isn't a fundamental property. Instead, they propose it's a misleading representation generated by the brain."
  *   "They draw on psychology – such as studies showing our unreliable introspection and tendency to confabulate reasons for choices – to suggest we systematically misrepresent our inner states."
  *   "By denying the existence of irreducible 'qualia' or subjective feels, illusionists contend the hard problem dissolves; the only puzzle left is explaining why we so firmly *believe* we have these phenomenal properties."
  *   "While illusionists maintain they aren't claiming we're unconscious 'zombies' – emphasizing our capacity for rich thought, report, and response – critics argue their position erases the very subjective experience it tries to explain. The core debate hinges on whether this 'illusion' can exist without *some* form of genuine subjective seeming."
  *   "Proponents counter that the 'illusion' is a cognitive error, not a phenomenal show, and that science will explain our sense of experience without needing non-physical properties."

  This framing presents illusionism's core claims accurately, highlights the key distinction they make (denying phenomenal properties but not functional consciousness), presents the eliminativist comparison fairly, and neutrally flags the self-undermining criticism *as a criticism from opponents* without endorsing it as a knockdown argument. It avoids the most misleading simplifications ("nothing it's like") and presents the zombie point as part of the ongoing debate.
