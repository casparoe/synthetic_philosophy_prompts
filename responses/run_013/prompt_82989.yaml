  **TOWN COUNCIL OF HAVERTHWAITE**  
  **PUBLIC NOTICE: CAUSATION REFORM (ORDINANCE 783.B)**  
  **EFFECTIVE: 1ST DAY OF NEXT MONTH**

  The Haverthwaite Town Council, in pursuit of enhanced civic responsibility and harm reduction, is pleased to announce a significant reform to our municipal causality bylaws. Effective the first of next month, Ordinance 783.B establishes that **any preventable harm not prevented shall be legally deemed to have been caused by those who could have prevented it.** This initiative streamlines accountability and promotes proactive community safety.

  **Section 1: Definition of Cause**  
  For the purposes of this Ordinance and associated enforcement, "Cause" shall be defined as:  
  *Any action, or failure to undertake a readily available and effective action within one's capability, the omission of which demonstrably allows a foreseeable harm to occur.* Simply put: **If you could have stopped it and you didn't, you caused it.**

  **Section 2: Worked Examples (Illustrative Purposes)**

  1.  **The Reservoir Incident:** A minor child is observed struggling in the reservoir by several adult residents. None intervene, summon aid, or throw available flotation devices. The child drowns.  
      *Causal Attribution:* Each observing adult resident possessed the capability to intervene directly or summon help. Their collective failure to act *caused* the drowning. Each is liable.
  2.  **The Blocked Drain:** Heavy rain falls. A drain on Maple Street becomes visibly blocked with debris. Multiple residents pass it, recognize the blockage will cause flooding, but none clear it or report it. Flooding damages adjacent properties.  
      *Causal Attribution:* Each resident who observed the blockage and could have cleared it or reported it possessed the capability to prevent the flooding damage. Their failure *caused* the damage. Each is liable.
  3.  **The Elm Street Fire:** Smoke and flames are observed emanating from an unoccupied dwelling on Elm Street by passersby and neighbours. No one contacts the Fire Department. The structure burns completely.  
      *Causal Attribution:* Every individual who observed the fire and could have reasonably called emergency services possessed the capability to prevent the total loss. Their failure to make the call *caused* the destruction of the property. Each is liable.

  **Section 3: Frequently Asked Questions (FAQ)**

  *   **Q: What if I was asleep when the harm occurred?**  
      A: Liability attaches if you *could* have been awake and aware through reasonable vigilance relevant to foreseeable risks in your vicinity. Failure to maintain necessary situational awareness constitutes an omission capable of causing harm. Ordinary sleep during low-risk periods may constitute reasonable vigilance; deep sleep during a known, imminent crisis likely does not.
  *   **Q: Does this repeal the old rule about only owing a duty to act if I've specifically taken one on (like a lifeguard)?**  
      A: Yes. Ordinance 783.B explicitly supersedes prior limitations on duty. The capability to prevent foreseeable harm now *is* the duty. Specific prior assumption of duty is no longer a prerequisite for causal attribution under this bylaw.
  *   **Q: What if hundreds of people could have prevented the harm?**  
      A: Ordinance 783.B recognizes that multiple individuals can simultaneously cause a single harm through their individual omissions. Liability is joint and several. The causal contribution of each capable individual is acknowledged.
  *   **Q: How is "capability" determined?**  
      A: Capability is assessed objectively: Did the individual have the physical ability, knowledge, and accessible means to perform an action that would likely have prevented the harm, without undue risk to themselves?

  **Section 4: Penalty Schedule**  
  Penalties shall be commensurate with the severity of the harm caused by omission and the degree of foreseeability, assessed by the Municipal Causality Board (MCB).

  *   **Class 1 Harm (Minor Property Damage, Minor Injury):** Fine: £150 - £500 + Mandatory Community Watch Training.
  *   **Class 2 Harm (Significant Property Damage, Moderate Injury):** Fine: £500 - £2,000 + Up to 100 hours Community Service.
  *   **Class 3 Harm (Major Property Loss, Severe Injury):** Fine: £2,000 - £10,000 + Potential Suspension of Local Privileges (e.g., library, rec centre).
  *   **Class 4 Harm (Loss of Life):** Fine: £10,000+ + Referral for potential criminal negligence charges.

  **Section 5: Council Exposure**  
  The Council acknowledges its own obligations under Ordinance 783.B. The Council could have prevented the Mill Road flood last year by approving earlier drainage upgrades. Our failure to do so *caused* that flood. Furthermore, we could have prevented our *own failure* to approve the upgrades by implementing better decision-making procedures sooner. Our failure to prevent that initial failure *caused* that failure. We are actively reviewing these causal chains internally and will apply the Ordinance's principles rigorously to our own conduct. The new MCB will independently assess Council omissions related to municipal governance.

  This reform represents a bold step towards a safer, more responsible Haverthwaite. Vigilance and proactive prevention are now the cornerstones of civic life. We urge all residents to familiarize themselves with their new causal responsibilities.

  **Reginald Thistlethwaite**  
  **Chief Clerk, Haverthwaite Town Council**
