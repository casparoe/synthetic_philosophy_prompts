  ok this might be a dumb question but i've been reading about the "heterogeniety problem" for hedonism and it's kind of shaken me. the idea is that the pleasure of a hot bath, the pleasure of hearing a song you love, the pleasure of finally scratching an itch that's been bugging you, and the pleasure of watching someone you dislike fail have basicly nothing in common as feelings — there's no single sensation that runs through all of them. so heres my worry: doesn't that just kill hedonism outright? if there's no one thing that pleasure is, then when a hedonist says "maximize pleasure" they're really saying "maximize a bunch of totally unrelated feelings," which doesn't seem like it could even mean anything, so the whole theory of well-being is dead and i should just switch to desire satisfaction instead. and doesn't the same thing sink utilitarianism, since it's built on maximizing pleasure too? or am i missing something here.
