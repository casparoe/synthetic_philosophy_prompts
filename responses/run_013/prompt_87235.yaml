prompt: |-
  I'm sitting in on a seminar on the philosophy of marriage this term — I'm a Kant person myself, so I mostly go to make trouble — and the most interesting thing in the room is a colleague in the department who's been arguing about what marriage is for since before I got here. Her track record, as best I can reconstruct it from seminars and one very long argument at a party: she's all in for same-sex marriage; she thinks a couple who say they'll never have kids can obviously marry; she wasn't bothered that an eighty-something widow and widower were marrying mostly for company and to pool their pensions, and said something like, the looking-after is the point, the rest is scenery; she thinks three mutually committed adults who share a house and are raising kids together shouldn't get a licence, and when I pushed her she said the trouble is the three, not the consent; she thinks two adult siblings shouldn't be allowed to marry even with no kids, but she was clear her reason is what being raised in a family does to consent, not sex or romance; and she was unmoved by two friends who married so one of them could get a visa, though she added that her problem there was immigration law treating marriage as a test, not with the two of them.

  Next week's case is a pair of men in their fifties — not a couple, no sex, no romance, but fifteen years of being each other's emergency contact, caregiver, mortgage co-signer and next of kin, and now they want the licence, mostly so the legal package attaches to what they already are. What does she say? I care much less about the yes or no than about the rule she's actually running: I can think of at least two that fit everything above and pull in opposite directions on these two, so tell me which fits her record best, what each candidate rule predicts here, and what further case would force her to choose between them. If the record genuinely underdetermines it, say that too, and tell me what she'd be buying into on either branch.

  And go easy on the confident pronouncements: separate what's actually settled in this area (if anything is) from what's genuinely contested among people who work on it, and dont hand me the care-and-dependency line as though it were the consensus — I referee enough of this stuff to know better.
reasoning: |-
  Hmm, the user presents an intricate puzzle about a philosopher colleague's stance on marriage. They've meticulously reconstructed her positions across various edge cases: pro same-sex marriage, childless couples okay, elderly companionship accepted, but anti-polyamory (citing "the three") and anti-sibling marriage (citing upbringing's effect on consent). Now they want to predict her response to platonic life partners seeking legal recognition.

  The user is clearly sophisticated - a Kant scholar who referees philosophy papers - so I must avoid oversimplifying. They specifically warn against presenting care/dependency as consensus, and want to know if her record underdetermines the answer. Key observations: 1) Her rejections focus on structural barriers to consent (group dynamics, familial power), not affective elements 2) She separates legal scaffolding from romantic/sexual content 3) The visa case reveals she objects to institutional incentives distorting marriage, not the participants' motives.

  I see two plausible principles that fit her record but diverge here:
  A) Consent-capacity Principle: Marriage requires unimpeded capacity for ongoing negotiated consent. This would reject the platonic pair due to lifelong interdependence potentially coercing consent.
  B) Relational-framework Principle: Marriage formalizes pre-existing mutual support structures. This would approve since they already function as a domestic unit.

  The user's right - both fit past cases. To force a choice, I'd propose a test case: two strangers with no prior relationship marrying solely for reciprocal end-of-life care. Principle A might allow it (clean consent), while Principle B would reject (no organic framework). 

  The deeper philosophical tensions are between marriage as a structure that enables care (needing existing interdependence) versus one that protects autonomy (needing freedom from constraint). The colleague seems to be wrestling with consent's conditions in asymmetrical relationships - a live debate in relational autonomy theory that the user would know from feminist philosophy. 

  Notably absent from her framework are both Kantian deontology (which surprises me given the user's specialty) and consequentialist approaches. She's building something distinctly relational, possibly drawing on Elizabeth Brake or Martha Fineman while rejecting their more expansive conclusions about care networks.
answer: |-
  Based on your colleague's consistent pattern of reasoning, her position is likely **underdetermined** by the existing record regarding the platonic male pair. However, one principle fits *significantly better* than the other major contender when analyzing her reasoning holistically. Here's the breakdown:

  1.  **The Best-Fitting Rule: *Formalized Mutual Lifelong Undertaking of Core Dependency/Guardianship***
      *   **Explanation:** Marriage, for her, is the legal formalization of a mutual, exclusive, and lifelong commitment to act as each other's primary guardian and dependency manager – handling core welfare needs (care, medical decisions, financial interdependence, legal next-of-kin status) within a specific, dyadic structure. It's about assuming the *institutional role* of being the legally designated "first responder" for life's fundamental vulnerabilities. The absence of romance/sex/kids is irrelevant if this core function is present and freely chosen. Consent must be unimpeded and capable of sustaining this lifelong, high-stakes undertaking.
      *   **Predicts for the Platonic Pair: YES.** They explicitly embody this core function: emergency contact, caregiver, mortgage co-signer, next of kin. They aren't marrying *for* the legal benefits in a transactional sense (like the visa case), but to *attach* the legal framework *to* the existing functional reality. The relationship structure (dyadic, exclusive in this role) fits.
      *   **How it Fits the Record:**
          *   *Same-Sex/Childless/Elderly:* All involve partners undertaking lifelong mutual guardianship/dependency management. Kids aren't the point; the *looking-after* is ("the rest is scenery").
          *   *Polyamory (NO):* The issue is "the three." A dyadic structure is essential for the specific legal framework and the clarity/feasibility of the mutual lifelong commitment to being *primary* guardian. Multiple adults create potential conflicts in primary responsibility and consent complexity ("not the consent" *itself*, but the *structure* enabling clear, unimpeded, mutual lifelong undertaking between two specific individuals for this role).
          *   *Siblings (NO):* Upbringing creates inherent power dynamics and potential coercion/impaired voluntariness ("what being raised in a family does to consent"). Consent cannot be truly free and unimpeded in this context for the lifelong, high-stakes dependency undertaking.
          *   *Visa (Ambivalent NO):* Her problem isn't the couple's motive per se, but that *immigration law* distorts the institution by using it as a test. The *couple* might be undertaking mutual dependency genuinely *despite* the motive, but the *system* corrupts the institution. Her focus remains on the integrity of the institution's core function, not subjective motives.

  2.  **The Contender Rule: *Consensual Formation of a New Socially Recognized Kinship Unit***
      *   **Explanation:** Marriage creates a new, socially and legally recognized kinship bond between two previously unrelated (or not primarily related) adults, based on consent, forming a new family core. It's about forging a novel primary relational unit.
      *   **Predicts for the Platonic Pair: NO (or Highly Questionable).** While they have interdependence, they haven't formed a *new kinship unit* in the traditional social sense; they are friends formalizing an existing *non*-familial bond. Marriage, on this view, should create something *new* akin to blood/affinal kinship, not codify an intense friendship.
      *   **Why it Fits *Less* Well:**
          *   *Siblings (NO):* Fits perfectly (forbidden kinship).
          *   *Same-Sex/Childless:* Fits (creating new kinship).
          *   *Elderly:* Fits (renewing/forming kinship).
          *   *Visa:* Ambiguous, but the lack of genuine intent to form kinship could be a factor.
          *   **Key Misfits:**
              *   *Polyamory (NO):* Why couldn't three consenting adults form a new kinship unit? Her objection ("the three, not the consent") isn't naturally explained by kinship formation alone. Kinship groups can be larger (extended families).
              *   *Core Focus:* Her emphasis on the elderly couple's *"looking-after" being the point* and her functional description of the platonic pair's relationship ("emergency contact, caregiver... next of kin") strongly points towards the *function* of dependency management, not the *metaphysical/social category* of kinship formation. The kinship language is more implicit in her reasoning than explicit.

  **Conclusion on Her Likely Position:** Her record strongly leans towards the **Formalized Mutual Lifelong Undertaking of Core Dependency/Guardianship** principle. Therefore, she would almost certainly say **YES** to the platonic male pair. Their relationship perfectly embodies the core function she identifies: mutual, exclusive (in this role), lifelong commitment to managing each other's fundamental welfare and vulnerabilities, seeking the legal framework that fits that function.

  **The Test Case to Force a Choice:**

  *   **Scenario:** Two adults with severe, complementary chronic disabilities meet through a support group. They have no prior relationship, no romance, and no particular affection beyond mutual respect. They explicitly agree to marry *solely* to legally formalize and optimize their mutual caregiving arrangements (medical decisions, financial pooling for care, guaranteed access, next-of-kin status). It's a purely functional, negotiated agreement entered into with clear eyes for mutual survival benefit.
  *   **How it Forces the Choice:**
      *   **Under the Dependency/Guardianship Rule:** This is a clear YES. The marriage directly formalizes the core function of mutual lifelong dependency management and guardianship. Consent appears free and informed. The lack of prior relationship or affection is irrelevant; the function is paramount.
      *   **Under the Kinship Formation Rule:** This is likely a NO. There is no intent to form a new *kinship bond* or social family unit; it's a coldly functional contract about care logistics. It instrumentalizes marriage solely for benefits without the relational substance of forming a new primary kinship tie.

  **The Philosophical Landscape (Settled vs. Contested):**

  *   **Settled (Mostly):** There is no single, universally accepted philosophical definition of marriage's essential purpose. The historical link to procreation and heterosexual union is widely acknowledged but fiercely contested as essential. The idea that marriage involves *some* form of committed partnership is central, but the nature of that commitment (romantic love? mutual care? economic union? kinship?) is the core battleground.
  *   **Genuinely Contested:**
      *   **Essentialism vs. Constructivism:** Is there a core, transhistorical essence to marriage, or is it a socially constructed institution whose purposes evolve?
      *   **The Role of the State:** Is the state's interest primarily in regulating relationships affecting children (the "Link to Procreation" argument), promoting stable caregiving units for dependents (the "Care/Dependency" view - which *is* prominent but **not** consensus, as you note), fostering stable adult relationships for societal benefit, recognizing fundamental rights of association, or simply providing a useful legal framework for private ordering?
      *   **The Primacy of Romantic Love:** Is romantic/sexual love essential, or just one possible foundation among others (like deep friendship or mutual care)?
      *   **Exclusivity and Dyadism:** Is the dyadic (two-person) and sexually exclusive structure essential, or contingent/historical? This is the most active frontier, driving debates on polyamory.
      *   **Consent & Autonomy:** What constitutes sufficiently free and informed consent, especially considering power dynamics within relationships (like siblings) or societal pressures? How much does the state need to protect against potentially harmful or non-autonomous entries into the institution?
  *   **Your Colleague's Position:** She clearly rejects romantic love or procreation as essential. She implicitly rejects the state's primary interest being children (via acceptance of childless/elderly couples). She centers the state's interest (or the institution's core) on formalizing *dyadic*, *mutual*, *lifelong commitments to manage core welfare dependency*. She places immense weight on the *structure enabling free consent* for this high-stakes commitment, hence rejecting siblings and polyamory on structural consent grounds, not moralistic ones. She navigates between essentialism (the core dependency function) and constructivism (rejecting traditional romantic/procreative definitions).

  **What She Buys Into on Either Branch:**

  *   **If Dependency/Guardianship (Likely):** She commits to a functionalist, institutional view of marriage. Its value lies in the practical, legal management of fundamental human vulnerability between two individuals. This risks instrumentalizing marriage but offers a clear, potentially inclusive (for non-romantic dyads) rationale grounded in basic human needs. It directly confronts the "legal package" reality.
  *   **If Kinship Formation (Unlikely):** She commits to a more symbolic/social view where marriage creates a unique *type* of socially recognized bond, distinct from friendship. This preserves a sense of marriage as something "special" but struggles harder with the polyamory objection and risks excluding valid non-romantic life partnerships that function identically to marriages in terms of care and dependency.

  Her record points decisively towards functional dependency management as the core, making a "Yes" for the platonic pair the most consistent outcome based on her established reasoning patterns. The test case exposes the potential limits of pure functionalism.
