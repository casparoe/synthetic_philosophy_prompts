prompt: |-
  I'm a software engineer with no formal philosphy background beyond a couple of podcasts, and I keep getting into arguments with a coworker who says deontology is just absolutism for people who don't want to do the math. He said it last week when we were arguing about a feature that would sacrifice one user's privacy to stop a breach affecting thousands. I think he's just dunking, but I also can't tell if there's a real position under it. What precise claims could that one-liner be making? I want the full menu, from the trivial readings to the radical ones, and for each one tell me whether it's plausible, whether it's actually about the paradox of deontology (the thing where deontology seems to forbid sacrificing one to save many but also seems to require saving many when you can), and whether it would actually support his conclusion that we should sacrifice the one. If any readings turn on the difference between agent-relative constraints and agent-neutral reasons, or on intending harm versus merely foreseeing it, flag that. Don't give me a reading list or citations, I won't look them up. Assume I know the basic trolley problem but not much else. You're a philosopher who specializes in deontology and has thought hard about the paradox of deontology. Think carefully, and start with a quick brainstorm of possible readings before you lay out the menu. Format it as: Bottom line (one sentence), Brainstorm (5-8 bullet points, one line each), The menu (each reading as its own short paragraph: state the precise claim, then a verdict: trivial, substantive, false, etc.), Which readings actually support his use (one short paragraph), What I should say back (2-3 sentences). Keep the whole thing under 900 words.
