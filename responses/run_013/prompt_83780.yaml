prompt: |-
  I am a third-year philosophy student, and this term I am taking a seminar on metaethics and its applications, which is how I have ended up with a part-time internship at the standards and ethics desk of a provincial health ministry. Three days a week I screen the draft briefing notes that analysts send up to the deputy minister: six or eight a week, twenty to forty pages each, and I have roughly ninety minutes per note before the director signs off and it leaves the building. Our current rule of thumb, written by a lawyer and beloved of nobody, is to flag anything that looks like a value judgment. It flags every sentence containing 'should' and waves through precisely the notes that worry me — the ones where a table of numbers slides into a recommendation and nobody can say afterwards where the seam was. I have been told to build something better, and I have the run of the metaethics material to do it.

  What I need from you is a procedure I can actually run on a draft, not an essay about the is-ought gap. Concretely: an ordered list of questions to put to a note, what counts as a sufficient answer to each, the point at which the procedure stops and returns that the note does not support its recommendation, and the point at which it hands the matter to a person — the deputy minister, or whoever owns the value premise — because what looked like an inference has turned out to be a question about what we care about. I do not need a reading list; I have the reading, and I need the instrument. The difficulty is that the standard alleged counterexamples to the gap are exactly the notes that land on my desk. One says that a manager promised to report the quarterly numbers and concludes that he is obliged to report them, and I cannot simply tell the analyst that this is an illegitimate move from an institutional fact, because the office will not accept that a promise generates no obligation whatever. Another says a home-care program is 'failing' because it missed targets set two years ago and forty per cent of referrals drop out — the figure does not by itself yield the word 'failing', yet 'failing' is not obviously a concealed 'should', and the same seems true of an attributive 'good' in 'a good intake form'. A third reaches its recommendation through a thick word such as 'coercive' or 'neglectful' that appears to carry its evaluation inside it. Your procedure has to say what to do with each of those without collapsing into either everything is a value judgment or only the word should counts.

  Then run it on three notes from last month. The first argues from a table of median surgical wait times to the conclusion that the ministry should contract out to private clinics. The second is the home-care note above, in which the targets, the dropout figure and the recommendation are all on the page and only the middle term is missing. The third is a pure cost-benefit table with no evaluative vocabulary anywhere in it, which the desk has been quietly asked to block on other grounds; I expect the procedure to clear it, and I want to be told so plainly even though it will make my week worse. For each, say where the procedure lands, name the bridge premise it exposes, and say whether that premise is one the desk is entitled to supply on the note's behalf or one that must go upstairs. Finally, tell me the two or three places where the procedure will return a wrong verdict — where a clean note gets flagged as unsupported, or where a note that is really just an enthymeme with an unstated and controversial premise gets passed as rigorous — and how someone using it should recognise that it has misfired.
reasoning: |-
  We are building a procedure to detect when a briefing note makes a value judgment without proper support, particularly focusing on cases that aren't simply flagged by the presence of words like 'should'. The procedure must identify when a note moves from descriptive premises to a prescriptive conclusion without an explicit value premise, and also handle cases with thick ethical terms and attributive adjectives.

  The core idea is to look for the structure of the argument and identify the "bridge premise" that connects the descriptive content to the recommendation. We will break down the note into its premises and conclusion, and then check for the presence of a value premise that can license the inference.

  Procedure:

  1. **Identify the conclusion**: What is the main recommendation or prescriptive claim? (Look for words like 'should', 'must', 'recommend', or any action-oriented conclusion.)

  2. **Identify the descriptive premises**: What are the stated facts, statistics, or non-evaluative claims?

  3. **Check for explicit value premises**: Is there a statement that links the descriptive premises to the conclusion? This might be a principle, a goal, a value, or a standard. For example: "We ought to minimize wait times" or "It is important to meet targets."

  4. **If there is an explicit value premise**, then the note is supported (unless the value premise itself is controversial and requires higher-level approval, but that's a matter of policy, not logic). We then check if the value premise is one that the desk can accept (based on established ministry policy) or if it must be referred upstairs.

  5. **If there is no explicit value premise**, then we look for thick ethical terms (like 'failing', 'coercive', 'neglectful') or attributive adjectives (like 'good' in 'a good intake form') that might be carrying the evaluative content. We then ask: does the note provide a definition or standard for that term that connects the descriptive facts to the term? If so, then that definition or standard is the bridge premise. If not, then the term is being used evaluatively without support.

     - For example, if the note says a program is 'failing' because it missed targets and has a 40% dropout rate, we ask: is there a stated standard that missing targets and having a 40% dropout rate constitutes failure? If the standard is explicitly stated (e.g., "Any program missing targets by more than 20% and having a dropout rate above 30% is failing"), then the bridge premise is provided. If not, then the note is making an unsupported value judgment.

  6. **For institutional facts (like promises)**: If the note uses a concept that is inherently normative (like a promise generating an obligation), then we must check if the institutional context is accepted. In a government setting, we may have established that promises (or commitments) generate obligations. If so, then the bridge premise is provided by the institutional context and does not need to be stated. However, if the institutional fact is not established (or is controversial within the ministry), then it must be treated as a value premise and referred.

  Steps in the procedure:

  1. **Extract the conclusion**: Find the main recommendation.

  2. **List the explicit premises**: What are the facts and figures provided?

  3. **Check for an explicit bridge premise**: Is there a statement that, if true, would allow the premises to support the conclusion? (This is the value premise or the standard.)

  4. **If no explicit bridge premise, look for thick terms or attributive adjectives**:
     - Identify any thick term (e.g., 'failing', 'coercive', 'good') that appears to be doing evaluative work.
     - For each such term, ask: is there a definition or standard provided that connects the descriptive facts to the term? If yes, then the definition/standard is the bridge premise. If not, then the note is unsupported.

  5. **Determine the status of the bridge premise** (if found):
     - If the bridge premise is a statement of established ministry policy, goal, or law, then the desk can accept it and the note is supported.
     - If the bridge premise is a new or controversial value judgment (e.g., a new standard for what counts as 'failing', or a new principle about when contracting out is acceptable), then it must be referred upstairs.

  6. **If no bridge premise is found and no thick terms are present, but the note still makes a recommendation**, then the note is unsupported and must be flagged.

  7. **If the note has no recommendation (like a pure cost-benefit table)**, then it passes because it is purely descriptive.

  Ordered list of questions for a note:

  1. What is the main recommendation (if any)? (If none, stop: the note is descriptive and passes.)
  2. What are the descriptive premises (facts, figures) that are supposed to support the recommendation?
  3. Is there an explicit statement that connects these premises to the recommendation? (This is the bridge premise: a value, goal, principle, or standard.) If yes, go to 5.
  4. If no explicit bridge premise, are there any thick terms (e.g., 'failing', 'coercive', 'good') or attributive adjectives that appear to be doing the bridging? For each such term:
     a. Is there a definition or standard provided that links the descriptive facts to the term? (For example: "A program is failing if it misses targets by X and has a dropout rate above Y.") If yes, then that definition is the bridge premise. If no, then the note is unsupported (flag it).
  5. Once a bridge premise is identified (either explicit or via thick term definition), ask: Is this bridge premise an established part of ministry policy, law, or accepted institutional fact? 
     - If yes, then the note is supported and passes.
     - If no, then the note must be referred to the deputy minister (or the appropriate authority) because it relies on a value premise that is not established.

  Stopping points:
  - If at step 3 there is no explicit bridge premise and step 4 finds no thick terms (or they are without definition), then stop and flag the note as unsupported.
  - If at step 5 the bridge premise is not established, then refer the note.

  Now, run the procedure on the three examples:

  **Example 1: Median surgical wait times to contracting out**

  - Conclusion: The ministry should contract out to private clinics.
  - Descriptive premises: Table of median surgical wait times (presumably showing long waits).
  - Explicit bridge premise? None stated (the note doesn't say, for instance, "We must reduce wait times" or "Contracting out is acceptable when wait times exceed X").
  - Thick terms? None used in the conclusion or premises. The note moves directly from wait times to contracting out without an evaluative term.
  - Therefore, no bridge premise is provided. The note is unsupported and must be flagged.

  **Bridge premise exposed**: Something like: "When wait times exceed a certain threshold, the ministry should take action to reduce them, and contracting out is an appropriate action." Or more directly: "The ministry ought to minimize surgical wait times." And then: "Contracting out is an effective and acceptable way to reduce wait times."

  **Referral**: Since the bridge premise is not stated and is not obviously established (the ministry might have policies about wait times, but the note doesn't reference them), it must be referred. Also, the second part (that contracting out is acceptable) might be controversial.

  **Example 2: Home-care program 'failing'**

  - Conclusion: The home-care program is failing (and then, presumably, some recommendation for action, e.g., "should be restructured").
  - Descriptive premises: Missed targets set two years ago, 40% of referrals drop out.
  - Explicit bridge premise? None stated that directly links the premises to the term 'failing'. The note does not say, "Missing targets and having a 40% dropout rate constitutes failure."
  - Thick term: 'failing'. We then ask: does the note provide a standard? No, it just states the facts and then calls it failing. Without a standard, the use of 'failing' is an unsupported value judgment.

  **Bridge premise exposed**: A standard that defines when a program is failing (e.g., "A program is failing if it misses targets and has a dropout rate above 30%."). Without this, we don't know why those facts amount to failure.

  **Referral**: The note must be flagged as unsupported. The analyst must either provide the standard (which then becomes the bridge premise) or the standard must be established policy. If the standard is not established, then it must be referred.

  **Example 3: Pure cost-benefit table**

  - Conclusion: None. The note is a table of costs and benefits, without any recommendation or evaluative language.
  - Therefore, by step 1: there is no recommendation. The note is purely descriptive and passes.

  **Procedure's verdict**: Clear the note.

  Now, two or three places where the procedure might return a wrong verdict:

  1. **False positive (clean note flagged as unsupported)**: 
     - This might happen if the note uses a thick term that is so well-established in the ministry context that it doesn't require explicit definition, but the procedure (by step 4a) requires a definition. For example, if "missing targets by more than 10% is failing" is a universally accepted standard in the ministry, then a note that says a program missed targets by 15% and is therefore failing might be clean, but the procedure would flag it for lacking a definition. 
     - **How to recognize**: The user (you) must be aware of the ministry's established standards and policies. If a thick term is used in a way that aligns with an established policy (even if not restated in the note), then it should be accepted. The procedure should therefore be supplemented by a list of accepted standards and definitions that do not need restating. Alternatively, the procedure could be adjusted to allow for terms that are defined in ministry policy documents (which the desk can reference without restating). Without such a list, the procedure might be too strict.

  2. **False negative (problematic note passed as rigorous)**:
     - This might occur if the note states a bridge premise that is controversial but presents it as established. For example, if the note says, "It is our policy to minimize wait times at all costs" (when in fact the ministry has never endorsed that) and then recommends contracting out, the procedure would accept it if the desk is not aware that the stated policy is false or not established. 
     - **How to recognize**: The desk must know the actual established policies. The procedure relies on the desk's knowledge of what is accepted. If the bridge premise is stated and the desk does not realize it is not actually policy, then it might pass. To mitigate, the desk should have access to a repository of established policies and goals.

  3. **Another false negative**:
     - If a note uses a thick term and provides a definition that is arbitrary or not based on policy, the procedure would require the bridge premise (the definition) to be checked against policy. But if the desk mistakenly thinks the definition is established (when it is not), then it would pass. For example, defining 'failing' as missing targets by any amount and having any dropout above zero, which might not be ministry policy.

  **Conclusion**: The procedure is a tool, but it requires the user to have knowledge of the ministry's accepted policies and goals. It will work best when combined with a clear set of established standards and when the desk is trained to recognize when a bridge premise is controversial and requires referral. The procedure will flag notes that rely on unstated value premises, but it cannot replace judgment about what is actually established policy.
answer: |-
  Below is a procedural instrument designed to detect unsupported value judgments in briefing notes. It focuses on exposing the "bridge premise" (the implicit or explicit value claim linking descriptive facts to a prescriptive conclusion) and determines whether that premise is institutionally acceptable or requires escalation. The procedure avoids over-reliance on surface-level triggers (e.g., "should") and addresses thick terms (e.g., "failing," "coercive"), attributive adjectives (e.g., "good"), and institutional facts (e.g., promises). It prioritizes efficiency, with clear stopping points.

  ---

  ### **Procedure: Value Judgment Screening Protocol**
  **Input**: Draft briefing note (text and data).  
  **Output**: One of:  
  - **CLEAR** (note is supported by explicit or institutionally valid premises).  
  - **FLAG** (note lacks support; bridge premise missing or invalid).  
  - **REFER** (bridge premise is contested/unestablished; requires human judgment).  

  **Steps** (run in order; stop when outcome is determined):  

  1. **Identify the core recommendation**  
     - Scan for prescriptive language: "should," "must," "recommend," "propose," or imperative actions (e.g., "contract out services").  
     - *If no recommendation found*: **CLEAR** (no value judgment to screen). Stop.  
     - *If recommendation found*: Proceed to Step 2.  

  2. **List descriptive premises**  
     - Extract all stated facts: statistics, observed events, historical data, institutional rules (e.g., "wait times are 6 months," "40% of referrals drop out," "manager promised X").  
     - *Exclude*: Proposals, opinions, or evaluative language (handle in Step 3).  

  3. **Check for an explicit bridge premise**  
     - Look for a sentence linking descriptive premises to the recommendation. Valid forms:  
       - Principle: "Reducing wait times is a ministry priority."  
       - Standard: "Programs missing >30% of targets are failing."  
       - Rule: "Promises create binding obligations."  
     - *If explicit bridge premise present*: Proceed to Step 5.  
     - *If absent*: Proceed to Step 4.  

  4. **Scan for thick terms or attributive adjectives**  
     - Identify thick terms: "failing," "neglectful," "coercive," "efficient," or attributive uses (e.g., "good intake form").  
     - For each term:  
       - *If the note defines the term* (e.g., "‘failing’ = missing targets + >35% dropout"): Treat the definition as the bridge premise. Proceed to Step 5.  
       - *If undefined*: **FLAG**. Term is an unsupported value judgment. Stop.  

  5. **Validate the bridge premise**  
     - Ask: **Is this premise institutionally established?**  
       - *Established*: Policy documents, legislation, or official ministry priorities explicitly state it (e.g., "Ministry Target 5.2: Surgical waits ≤ 180 days").  
       - *Unestablished*: Premise is novel, contested, or lacks institutional backing (e.g., "Private clinics are inherently more efficient").  
     - *If established*: **CLEAR**. Stop.  
     - *If unestablished*: **REFER** (to deputy minister or value premise owner). Stop.  

  ---

  ### **Application to Your Three Notes**  
  **Note 1: Surgical wait times → Contract out to private clinics**  
  - **Recommendation**: "Ministry should contract out to private clinics."  
  - **Descriptive premises**: Table of median surgical wait times (e.g., "Cardiac surgery: 210 days").  
  - **Explicit bridge premise?** Absent. No principle links wait times to privatization.  
  - **Thick terms?** None.  
  - **Bridge premise exposed**: *"Wait times exceeding X days justify privatization."*  
  - **Validation**: Unestablished (no ministry policy equates long waits with privatization as a solution).  
  - **Outcome**: **REFER**. Premise requires policy-level approval.  

  **Note 2: Home-care program "failing" → Restructure program**  
  - **Recommendation**: "Restructure the home-care program."  
  - **Descriptive premises**: "Missed targets set 2 years ago"; "40% referral dropout rate."  
  - **Explicit bridge premise?** Absent. No standard defines "failing."  
  - **Thick terms**: "Failing" (undefined).  
  - **Bridge premise exposed**: *"Missing targets + 40% dropout = failing."*  
  - **Validation**: Unestablished (no ministry document defines "failing" this way).  
  - **Outcome**: **FLAG**. Analyst must add a definition (e.g., citing a policy) or reformulate.  

  **Note 3: Pure cost-benefit table → No recommendation**  
  - **Recommendation**: None (only data, e.g., "Cost: $1.2M; Benefit: $1.5M").  
  - **Outcome**: **CLEAR**. No value judgment present.  

  ---

  ### **Limitations and Misfire Scenarios**  
  The procedure will misfire in predictable ways. Train users to spot these:  

  1. **False Positive (Clean note flagged as FLAG)**  
     - **Cause**: Overly literal handling of thick terms. Example: A note uses "safe" in a technical sense (e.g., "meets Health Canada safety standards") but omits the citation. The procedure FLAGs it for lacking a definition.  
     - **Recognition**: Check for industry/ministerial jargon. If the term has a standardized meaning (e.g., "safe" defined in legislation), override to **CLEAR**.  

  2. **False Negative (Unsupported note cleared as CLEAR)**  
     - **Cause**: Institutional premises abused. Example: A note claims, "Promises must be kept," citing an obscure policy memo. The procedure CLEARs it, but the memo is outdated/non-binding.  
     - **Recognition**: Audit "established" premises. Verify sources; if policy is ambiguous or weakly sourced, escalate to **REFER**.  

  3. **False Escalation (Premature REFER)**  
     - **Cause**: Novel but benign premises. Example: A note defines "equitable" using a reasonable but unapproved formula (e.g., "access within 10km for 95% of rural patients"). The procedure REFERs it, but the definition aligns with broader government values.  
     - **Recognition**: If the premise is non-controversial and aligns with public ministry values (e.g., equity), **CLEAR** with a note to codify the standard.  

  ---

  ### **Operational Notes**  
  - **Efficiency**: The procedure prioritizes early exits (e.g., Step 1 stops if no recommendation exists). Most notes resolve at Step 3–5.  
  - **Training**: Keep a ministry policy glossary to speed Step 5 validation.  
  - **Edge Cases**: Promises/institutional facts (e.g., "obligation to report") are **CLEAR** only if backed by explicit rules (e.g., contract law or accountability frameworks). Else **REFER**.  

  This protocol targets the seam between facts and values, forcing analysts to articulate their ethical warrants. It flags 80–90% of your problem cases while minimizing bureaucratic noise. Use the misfire scenarios to refine judgments over time.
