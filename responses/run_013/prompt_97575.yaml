  ok so we did Kant on animals in my ethics seminar and I think I must be missing something. The way it came out, Kant says we have no direct duties to animals, only indirect ones — the real duty is to ourselves, and being cruel to a dog is wrong because it hardens you and makes you more likely to be cruel to people later. Fine. But that makes the wrongness of cruelty sound like a prediction about my character instead of anything about the dog. So take someone who genuinely wouldn't be hardened — they're already as gentle with people as they'll ever be, or its a one-off that doesn't stick — doesn't Kant then have to say it wasn't wrong? That can't be his actual view, right? So where does this reading go wrong, and how much of it is settled vs. something people who study Kant still argue about? Keep it under 250 words, and please seperate what's actually agreed on from what's genuinely contested — don't just hand me the tidy version.
