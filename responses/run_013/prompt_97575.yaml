answer: |-
  Here's the breakdown on Kant and animals, separating settled points from debates:

  **Settled:**
  1.  Kant **unequivocally denies** animals direct moral status or that we have duties *to* them. Only rational beings (humans) are ends-in-themselves.
  2.  Our duties regarding animals are **strictly indirect duties *to* humanity in ourselves**. Cruelty violates our duty to cultivate virtue and avoid vice within our own character.
  3.  The *primary* reason given in his texts for avoiding cruelty is that it **"dulls" or "weakens" our shared feeling of humanity**, making us less compassionate beings *in general*, potentially harming our duties *to humans*.

  **Contested & Your Concern:**
  The core debate revolves around **interpreting the "harden" mechanism**:

  1.  **Empirical Prediction Reading (Literalist):** This aligns with your worry. If cruelty *genuinely doesn't* weaken compassion for humans (as a psychological fact in a specific case), then, on this view, it wouldn't be wrong *for Kant*. Some scholars argue this is the plain meaning of his texts.
  2.  **Character/Virtue Reading:** Most contemporary Kantians reject the purely empirical prediction view. They argue:
      *   Cruelty inherently **violates the duty of self-perfection** – cultivating virtuous dispositions (like compassion) and avoiding vices (like callousness).
      *   The wrongness lies in **actively cultivating a vicious character trait** (cruelty) or **failing to cultivate a virtuous one** (compassion), regardless of *specific future consequences* for human interaction.
      *   It's about the **intrinsic degradation of one's moral capacity** ("humanity") by engaging in the act itself. The "harden" point illustrates *why* this duty exists, but the duty is to *avoid the vice*, not just its predicted outcomes.

  **Conclusion:** Kant **does** ground the wrongness in the agent's character, not the animal. The **debate is whether this requires a contingent prediction about future human-directed actions (literal reading) or is a categorical demand to avoid cultivating vice in oneself (virtue reading)**. Most scholars favor the latter to avoid the counterintuitive result you identified, though the primary texts lean towards the prediction language.
