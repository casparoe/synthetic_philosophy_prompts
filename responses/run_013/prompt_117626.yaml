  Below is a decision tree designed to sort views on the color phi phenomenon and related cases. It uses concrete questions based on empirical cases (including your made-up scenarios) to expose underlying commitments. The tree branches along two primary axes:  
  - **(i) The relationship between report and experience**: Does the verbal report directly reflect the experience, reconstruct it post-hoc, or is there a disconnect?  
  - **(ii) Determinacy of temporal experience**: Can we assign a precise time to when an event (e.g., the color change) was experienced?  

  The tree also distinguishes:  
  - Views where the phenomenon is about *experience* (e.g., illusions in perception) vs. *reports/narration* (e.g., errors in memory or judgment).  
  - Views that attribute the effect to *early sensory processing* (no "revision" needed) vs. those positing *post-perceptual revision* (editing of content).  

  **Instructions for use**: Start at Node 1. Answer each question based on the cases described. Proceed to the next node until you reach a leaf (a named position). Cases referenced:  
  - **Color phi**: Red dot (left), then green dot (right) after 100ms; reported as one dot moving and changing color mid-trajectory.  
  - **Metacontrast masking**: A target (e.g., a shape) is followed by a mask at varying intervals; if the interval is short, subjects cannot report the target.  
  - **Cutaneous rabbit**: Taps at wrist, elbow, then shoulder are felt as evenly spaced taps along the arm, including intermediate locations not tapped.  
  - **Phoneme restoration**: A cough replaces a phoneme in a word (e.g., "legi*lature*"), but the word is heard as intact.  
  - **Made-up case A (timing probe)**: A tap on the finger 150ms after the second flash in color phi; subjects judge if the tap came before or after the color change.  
  - **Made-up case B (training)**: Subjects trained with feedback over hundreds of trials to report "literally"; some then report "two dots, no motion" in color phi.  

  ---

  ### **Decision Tree**  
  *Nodes are questions; branches are answers. Cases are used as needed to force distinctions.*

  **Node 1**: In **metacontrast masking**, when the subject cannot report the target due to a closely timed mask, is the target still consciously experienced?  
  - **Yes** → It is experienced but becomes unreportable (go to Node 2).  
  - **No** → It is never consciously experienced (go to Node 3).  

  **Node 2** (from Node 1 "Yes"): In the **cutaneous rabbit illusion**, are the intermediate taps (at untapped locations) consciously experienced?  
  - **Yes** → The illusion involves sensory interpolation (go to Node 4).  
  - **No** → The intermediate taps are only inferred post-experience (go to Node 5).  

  **Node 3** (from Node 1 "No"): In **phoneme restoration**, when the subject hears the full word despite the cough, is the missing phoneme consciously experienced?  
  - **Yes** → Auditory experience includes non-veridical content (go to Node 6).  
  - **No** → The word is heard as intact due to cognitive filling-in (go to Node 7).  

  **Node 4** (from Node 2 "Yes"): In the **color phi timing probe (made-up case A)**, if subjects consistently report the color change *before* the tap (at 150ms post-second-flash), does this imply the change was experienced at a specific time (e.g., the midpoint)?  
  - **Yes** → Experience has determinate timing (go to Node 8).  
  - **No** → The temporal order is assigned post-hoc, not during experience (leaf: *Post-Perceptual Narrative*).  

  **Node 5** (from Node 2 "No"): In the **training case (made-up case B)**, when subjects report "two dots, no motion" after training, is this due to them suppressing an automatic revision process?  
  - **Yes** → Revision normally occurs, but training inhibits it (leaf: *Controlled Revision*).  
  - **No** → Training alters low-level processing, preventing the illusion (leaf: *Early Vision Plasticity*).  

  **Node 6** (from Node 3 "Yes"): In **color phi**, is the reported motion and color change part of conscious experience (not just inferred)?  
  - **Yes** → Illusion is experiential (leaf: *Sensory Incorporation*).  
  - **No** → Motion/change is inferred from sensory data (leaf: *Cognitive Reconstruction*).  

  **Node 7** (from Node 3 "No"): In **color phi**, does the question "when was the color change experienced?" have a determinate answer?  
  - **Yes** → Timing is fixed by the system (leaf: *Temporal Binding*).  
  - **No** → Timing is inherently indeterminate (leaf: *Anti-Determinism*).  

  **Node 8** (from Node 4 "Yes"): In the **training case (made-up case B)**, when subjects report "two dots, no motion", are they accessing an unrevised experience that existed before revision?  
  - **Yes** → Initial experience is unrevised but later overwritten (leaf: *Orwellian*).  
  - **No** → No unrevised experience exists; the report is reconstructive (leaf: *Stalinesque*).  

  ---

  ### **Leaf Positions**  
  *Each leaf includes: (1) Position name, (2) Explanation of color phi, (3) Most awkward commitment, (4) What it forces you to give up (if surprising).*  

  1. **Orwellian**  
     - **Color phi**: Initially experienced as a red dot moving; memory revised after the green flash to include color change at the midpoint.  
     - **Awkward commitment**: Untrained reports are false memories, but trained reports access "true" experiences—yet no independent evidence exists for this unrevisable access.  
     - **Gives up**: Reliability of untrained verbal reports; requires a "fixed" past experience that can be recalled accurately under training.  

  2. **Stalinesque**  
     - **Color phi**: Experience is delayed and edited pre-presentation; only the moving, color-changing dot is experienced.  
     - **Awkward commitment**: The system must "pre-experience" the green flash to place the color change at the midpoint (before the flash occurs).  
     - **Gives up**: Real-time consciousness; experience is always "behind" sensory input.  

  3. **Sensory Incorporation**  
     - **Color phi**: The motion and color change are experienced due to interpolation in sensory processing (like phoneme restoration).  
     - **Awkward commitment**: Non-veridical content (e.g., intermediate taps in rabbit) is genuinely experienced, not inferred.  
     - **Gives up**: Naïve realism; perception is inherently constructive, not a direct readout of stimuli.  

  4. **Cognitive Reconstruction**  
     - **Color phi**: Experience is of two flashes; motion/change is inferred post-experience to fit expectations (report reconstructs experience).  
     - **Awkward commitment**: Subjects sincerely claim to "see" motion, but this is a cognitive error, not experiential content.  
     - **Gives up**: Introspective access; verbal reports track inferences, not raw experience.  

  5. **Post-Perceptual Narrative**  
     - **Color phi**: Experience is of disjointed sensory data; motion/change is added during narration to create coherence (report reconstructs experience).  
     - **Awkward commitment**: Temporal judgments (e.g., timing probe) are entirely post-hoc, yet feel immediate.  
     - **Gives up**: Temporal phenomenology; the "when" of experience is always a narrative construct.  

  6. **Controlled Revision**  
     - **Color phi**: Experience is initially of two flashes but automatically revised; training suppresses revision, allowing unrevised reports.  
     - **Awkward commitment**: Training overrides "default" conscious content, implying consciousness is highly malleable.  
     - **Gives up**: Stability of consciousness; small manipulations can alter "what it's like" at a basic level.  

  7. **Early Vision Plasticity**  
     - **Color phi**: Training rewires early vision, so no motion/change is experienced; reports are literal.  
     - **Awkward commitment**: Low-level processing (e.g., V1/V2) is trainable like a cognitive skill, contrary to some vision science.  
     - **Gives up**: Modularity of perception; early vision isn't "cognitively impenetrable."  

  8. **Temporal Binding**  
     - **Color phi**: Color change is experienced at a precise time (e.g., midpoint) due to neural timing mechanisms.  
     - **Awkward commitment**: The timing probe must align with the midpoint (even though the green flash arrives later); if not, the view is falsified.  
     - **Gives up**: Physics-compatible timing; experience can antedate sensory input.  

  9. **Anti-Determinism**  
     - **Color phi**: There is no fact about "when" the change was experienced; temporal experience is inherently indeterminate.  
     - **Awkward commitment**: Denies intuitive temporal granularity (e.g., "before tap" judgments are meaningless).  
     - **Gives up**: Temporal realism; consciousness lacks fine-grained time stamps.  

  ---

  ### **Collapsed Distinctions and Unoccupied Positions**  
  - **Collapsed distinction**: The tree cannot separate **Stalinesque** from **Temporal Binding** using the timing probe alone, as both predict the change is experienced "before the tap" (Stalinesque via pre-presentation editing, Binding via neural timing). The training case breaks this: Stalinesque denies unrevised experiences exist, while Binding allows them but with indeterminate timing.  
  - **Unoccupied positions**:  
    - "Experience is unrevised, but reports are always reconstructive": Incoherent, as it requires reports to be unreliable even when experience is stable (denied by all leaves).  
    - "Revision occurs, but no unrevised experience exists": Unattractive, as it conflates Stalinesque (editing pre-experience) with Orwellian (editing post-experience).  
    - "Determinate timing with no sensory interpolation": Unexplored; would require a non-constructive account of the illusion (e.g., direct perception of motion), which no major position holds.  

  ### **Surprising Leaves and Their Trade-offs**  
  - **Anti-Determinism**: Forces you to give up temporal realism—consciousness lacks fine-grained temporal structure, making "when" questions meaningless (e.g., in the timing probe).  
  - **Cognitive Reconstruction**: Forces you to give up introspective authority—subjects are wrong about their own experience, mistaking inferences for perceptions.  
  - **Early Vision Plasticity**: Forces you to give up modularity—perception is cognitively penetrable, so "fixed" illusions can be unlearned (unlike e.g., the Müller-Lyer).  

  ---

  **Tree Summary**:  
  - 7 nodes, 9 leaves (meets your target).  
  - Cases used: All provided cases (color phi, metacontrast, rabbit, phoneme, timing probe, training) are integrated.  
  - Flow: Starts with metacontrast to force the report/experience split early, then uses rabbit/training to separate revision types, and timing probe to handle determinacy.  

  This tree exposes nuances beyond Orwellian/Stalinesque (e.g., whether revision is controllable, whether timing is fixed) and uses your cases to ground abstract commitments. For your group: Focus discussion on "what it forces you to give up" to debate metaphysical trade-offs.
