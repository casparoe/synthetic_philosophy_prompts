  The core challenge is translating criteria like dissimilarity and embarrassment into Bayesian terms. Dissimilarity feels like a likelihood ratio test (P(data|authentic) vs P(data|inauthentic)), but the lack of clear inauthentic distributions is problematic. Embarrassment maps to evidence against strategic fabrication, yet assumes editors wouldn't omit embarrassing material - a selection effect.

  Multiple attestation resembles repeated measures, but with non-independent sources and unknown common origins. Coherence risks overfitting by reinforcing prior assumptions. Linguistic criteria might be feature engineering, but with circular validation risks.

  The deeper issues are fundamental: 
  - No well-defined estimand (is "authentic saying" binary? probabilistic? context-dependent?) 
  - No control group of definitively inauthentic material 
  - Extreme missing data where absence of evidence isn't evidence of absence 
  - Assumption of a single "Jesus" latent variable that may not hold 

