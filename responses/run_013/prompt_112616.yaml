answer: |-
  Below is a Q&A prep sheet tailored to your workshop. It prioritizes objections by **likelihood × damage** (highest to lowest), with factions identified. Each objection includes a concise two-minute reply, notes on "soft" points (where you're vulnerable), and a judgment on whether it's a **genuine problem** (requiring substantive engagement) or a **turf dispute** (where naming the disagreement suffices). 

  **Key Upfront Concessions** (state these in your intro to preempt obvious counters):  
  1. *"I concede that thin measures (e.g., Brier score) can support some results, like the dominance argument for probabilism."*  
  2. *"I grant that accuracy-first offers valuable tools for modeling coherence. My critique targets its normative reach, not its technical prowess."*  
  3. *"I accept that thick measures aren't 'mysterious'—they emerge naturally in the formalism. But their justification is parasitic on coherence, not accuracy."*  

  ---

  ### **Objection 1 (Accuracy-First Insiders)**  
  **Objection:** "You claim our flagship results require ‘thick’ measures, but Joyce already showed probabilism follows from thin measures alone via dominance. If your dilemma collapses there, why should we care about the rest?" *(Likely & high damage: challenges core thesis)*  
  **Reply:** "Correct—probabilism works with thin measures like Brier. But the *significance* of that result depends on interpreting accuracy normatively. Thin measures can’t ground conditionalization or the chance-credence principle without smuggling in thick features. For instance, expected-accuracy maximization for conditionalization requires global, non-decomposable properties like *calibration*, which thin measures alone don’t capture."  
  **Soft point:** If pressed, concede that *some* derivations of conditionalization use thin measures, but note they rely on ad hoc add-ons (e.g., "current score" constraints).  
  **Judgment:** **Genuine problem**. Forces you to clarify which results *specifically* require thickness (cite Greaves & Wallace 2006 for conditionalization).  

  ### **Objection 2 (Accuracy-First Insiders)**  
  **Objection:** "Strict propriety isn’t just one constraint—it’s *necessary* for accuracy-coherence alignment. Your continuum of measures is irrelevant: any improper rule permits dominated credences, so we’re justified in excluding them." *(Likely & high damage: defends program’s foundations)*  
  **Reply:** "Strict propriety ensures coherent credences aren’t dominated, but it doesn’t tell us *which* coherent function to pick. Myriad strictly proper rules (e.g., Brier vs. log score) disagree on what’s rational in non-ideal cases (e.g., non-partitional evidence). The program’s ‘rationality’ claims assume a privileged measure, but propriety alone can’t select one. This is why your results are coherence-in-disguise."  
  **Soft point:** If pressed, concede propriety is necessary for *some* dominance results but emphasize it’s insufficient for uniqueness.  
  **Judgment:** **Genuine problem**. Highlights the tension between coherence and normativity.  

  ### **Objection 3 (Statistician)**  
  **Objection:** "This is philosophy masquerading as math. Scoring rules are tools for elicitation—we pick them based on practical goals (e.g., sensitivity to outliers). Demanding ‘epistemically privileged’ measures is like demanding a ‘privileged’ hammer. Why not drop the pretense that this is about truth?" *(High damage: undermines framing; likely from statistician)*  
  **Reply:** "I agree—for elicitation, it’s engineering. But accuracy-first epistemology *claims* these scores track epistemic value. If that’s just a metaphor, we lose the normative force of ‘rationality.’ My dilemma shows this: if scores are task-relative, the program can’t ground universal norms like ‘conditionalization is rational.’ It reduces to instrumental advice for coherence-seeking agents."  
  **Soft point:** If pressed, concede that *applied* scoring rules are pragmatic, but argue epistemology seeks stronger justification.  
  **Judgment:** **Turf dispute**. Name it: "Your objection confirms my point—accuracy-first conflates engineering with epistemology."  

  ### **Objection 4 (Imprecise Credence Defenders)**  
  **Objection:** "Your thick/thin distinction just resurrects the ‘arbitrariness’ problem we solve with imprecise credences. If no single measure is privileged, rationality demands representing uncertainty with sets of probabilities—not picking one ‘coherent’ function." *(Likely & medium damage: co-opts your argument)*  
  **Reply:** "Imprecise credences don’t escape the dilemma—they also rely on thick measures. For example, accuracy arguments for imprecision (e.g., Mayo-Wilson 2019) use global properties like *admissibility*, which isn’t decomposable proposition-wise. My critique applies equally: your sets are ‘rational’ only by coherence standards internal to your chosen measure."  
  **Soft point:** If pressed, concede that imprecise approaches *mitigate* arbitrariness but still depend on thick scoring for justification.  
  **Judgment:** **Genuine problem**. Requires distancing your critique from their solution.  

  ### **Objection 5 (Accuracy-First Insiders)**  
  **Objection:** "You say strict propriety is the only constraint, but we *have* others: symmetry, normality, and more. These pick out Brier-like scores and validate our results." *(Likely & medium damage: challenges your continuum claim)*  
  **Reply:** "Symmetry and normality are aesthetic or pragmatic—they don’t stem from accuracy considerations. For example, the log score violates normality but is strictly proper and used in epistemology (e.g., Leitgeb & Pettigrew 2010). These add-ons are post hoc; they don’t resolve the arbitrariness in why we should privilege, say, additive over multiplicative rules."  
  **Soft point:** If pressed, admit some constraints narrow options but stress they’re extrinsic to accuracy (e.g., symmetry assumes propositional interchangeability).  
  **Judgment:** **Turf dispute**. Reply: "This proves my point—you’re adding coherence-friendly constraints to salvage the program."  

  ### **Objection 6 (Knowledge-First Epistemologist)**  
  **Objection:** "Why engage this? Credences aren’t real. Epistemology should start from knowledge, not ‘accuracy’ for phantom degrees of belief. Your whole debate presupposes a failed framework." *(Low likelihood but high damage: dismisses premise)*  
  **Reply:** "I’m not defending credence-first epistemology—I’m showing its best formal version can’t deliver what it promises. If we *do* model agents with credences, accuracy-first is the most rigorous tool we have. But even here, it only justifies coherence, not rationality. Your objection is orthogonal: we agree the locus of value isn’t credences, but I’m working within the program to expose its limits."  
  **Soft point:** If pressed, concede this might be "tinkering on the Titanic" but stress that internal critiques are valuable.  
  **Judgment:** **Turf dispute**. Name it: "This is a meta-dispute about formalism—I’m granting your framework for argument’s sake."  

  ### **Objection 7 (Understanding-Focused Epistemologist)**  
  **Objection:** "Accuracy for individual propositions misses the point. Understanding requires grasping explanatory connections—something your ‘thick’ measures still reduce to atomistic scoring. Why not abandon credences entirely?" *(Medium likelihood, low damage: similar to #6)*  
  **Reply:** "I agree that understanding is irreducible—but accuracy-first explicitly targets credal rationality. My thick measures aren’t a fix; they’re a symptom. They show the program needs structure beyond truth-tracking (e.g., calibration) to work, which *still* doesn’t capture understanding. This reinforces your view but isn’t my focus."  
  **Soft point:** None—this aligns with your concession that accuracy-first is limited.  
  **Judgment:** **Turf dispute**. Acknowledge common ground: "We both see credences as inadequate; I’m explaining why *even on their terms*, the program falls short."  

  ### **Objection 8 (Accuracy-First Insiders)**  
  **Objection:** "Your ‘thick’ measures sound like incoherent credences scored with proper rules. But we’ve shown coherence is necessary for accuracy—so rationality reduces to coherence. What’s the problem?" *(Likely but low damage: reasserts orthodoxy)*  
  **Reply:** "Coherence is necessary but not sufficient. Rationality requires more—e.g., responsiveness to evidence. Accuracy-first uses ‘accuracy’ to smuggle in thicker demands (like calibration) that go beyond coherence. But it can’t justify why *those* demands are epistemic rather than pragmatic. Without that, it’s not a theory of rationality—it’s a coherence detector with a marketing problem."  
  **Soft point:** If pushed, admit coherence is a component of rationality but insist thickness conflates it with the whole.  
  **Judgment:** **Genuine problem**. Forces clarification on what "rationality" should include.  

  ---

  **The Single Reply That Must Land** (for the paper to survive):  
  When pressed on **Objection 1** (insiders defending thin measures), pivot to conditionalization/chance-credence:  
  *"Let’s take conditionalization: Greaves and Wallace’s proof requires maximizing *expected accuracy* from your *current* credence function. But ‘expectation’ here is computed using that very credence function—a global, thick property. Thin measures score proposition-wise, but this result needs the whole function to self-evaluate. That’s not truth-tracking; it’s coherence maintenance. If accuracy-first rejects thick measures, it loses this result. If it keeps them, it can’t motivate them independently. That’s the dilemma."*  

  **The Question You Hope Nobody Asks:**  
  *"If accuracy-first is just about coherence, why call it a ‘masquerade’? Coherence is a recognized epistemic virtue. Aren’t you attacking a straw man by demanding ‘thick’ normative foundations they never promised?"*  
  **Why it’s dangerous:** It reframes your critique as uncharitable, forcing you to defend the charge of "masquerading" and potentially concede that the program is consistent if we lower our expectations to "coherence theory."  
  **If asked:** Briefly restate the program’s ambition (e.g., Pettigrew’s claim that accuracy "vindicates" Bayesian norms), then say: *"If they retreat to ‘coherence is our only goal,’ I’ll celebrate their clarity—but then the dominance argument for probabilism is trivial, and the rhetoric of ‘accuracy’ is misleading. My paper invites that retreat."*  

  ---

  **Summary Strategy**:  
  - **Lead with concessions** to drain easy objections.  
  - **Focus replies** on conditionalization/chance-credence as the weakest links for accuracy-first.  
  - **Name turf disputes** briskly; spend energy on genuine problems (Objections 1, 2, 4).  
  - **Land the thick/thin distinction** by tying it to specific results (conditionalization > probabilism).  
  - If the "hoped-nobody-asks" question arises, reframe it as an invitation for accuracy-first to clarify its scope.
