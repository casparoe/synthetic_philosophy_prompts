prompt: |-
  You are a philosopher of probability and an expert on the reference class problem. Before you answer, brainstorm the candidate readings of the practice described below; then give a structured response that separates the reading you favor from those you reject, and flags what the practice leaves open.

  Insurers and consumer lenders price contracts by assigning an applicant to a group — an age band, a postcode, an occupation, a marital status, a credit history, a smoking status — and charging the rate that the group's statistics imply. In many of the same jurisdictions the law forbids using race, religion, disability, or (in some places) sex, even where those classifications are at least as predictive as the ones that are permitted, and sometimes forbids using genetic test results that strongly predict claims. The practice is thus comfortable with group rates in general and hostile to certain group rates in particular.

  What conception of the reference class problem does this presuppose? Every applicant belongs to indefinitely many classes with different frequencies, and no class is uniquely correct on statistical grounds alone, so something other than frequency must be fixing the relevant class. Is the practice committed to the individual's own risk as the true reference class, with group rates as approximations to it — and if so, what makes the individual the right unit? Or does it assume a causal or explanatory criterion, admitting only factors that explain the risk rather than merely correlate with it? Or a moralized criterion, admitting only factors for which the applicant can be held responsible, or that track desert rather than brute luck? Or does it treat the choice of class as a convention or political settlement rather than a factual matter? Say which of these would license the practice, which would undermine it, and where the practice is underdetermined, so that several incompatible views of the reference class would each license it. Note the internal tension as well: the actuarial ideal is ever-finer classification of individual risk, yet full classification would destroy the pooling that makes insurance insurance. Does the practice presuppose a principled stopping point for classification, and can it supply one without appealing to the statistics? Finally, say what would have to change in the practice if its implicit conception were replaced by a straightforwardly predictive one. Argue from the concepts; no citations are needed.
reasoning: |-
  Okay, the user is asking me to analyze the insurance pricing practice through the lens of the reference class problem. They want me to brainstorm different philosophical interpretations and then structure my response around which views support or undermine the practice. 

  First, I need to unpack the core dilemma: insurers use group statistics to set prices, but deliberately exclude certain predictive characteristics like race or genetics. This creates a tension - they're relying on group classification while rejecting some statistically valid groups. The reference class problem asks how we choose which groups matter when infinite classifications are possible.

  Hmm, the user seems sophisticated - they're familiar with philosophical concepts like brute luck vs desert, and they've framed this beautifully with that internal tension about risk pooling. Probably an academic or policy thinker. They might be probing whether current practices have coherent philosophical foundations or are just political compromises.

  Let me mentally list the candidate interpretations:
  1) Individual risk as ideal (group rates as approximation)
  2) Causal/explanatory criteria
  3) Moral responsibility factors
  4) Conventionalist/political view
  5) Straightforward predictive accuracy

  I notice the practice excludes factors associated with discrimination or immutable characteristics, even when predictive. That screams "moral responsibility" framework to me. But I should also consider how each view handles the stopping point problem - why not infinitely refine groups until each person is their own class?

  The causal view is tempting but problematic - insurers often use correlates without caring about causation (like postal codes). And the individual-risk-as-ideal view would logically demand full personalization, destroying insurance. 

  Ah! The moral responsibility view best explains the exclusions: we reject race not because it's non-predictive, but because it's unjust to penalize for innate traits. This creates a principled (non-statistical) stopping point: we stop refining when we hit morally problematic factors.

  But I should acknowledge the underdetermined aspects too - the practice doesn't specify why some factors are morally problematic, leaving room for different theories of justice. And the tension with actuarial ideals remains unresolved; they're balancing fairness against risk-pooling practicality.

  If we switched to pure predictive accuracy, we'd have to include all statistically relevant factors - genetic tests, race, etc. That would make insurance more "accurate" but might violate equality principles. The practice implicitly rejects that trade-off.

  Better flag that the moral view isn't monolithic - responsibility theories vary (control vs choice vs desert). The practice assumes some version but doesn't specify which. Also worth noting that permitted factors like smoking status bridge moral and predictive considerations.
answer: |-
  Based on a conceptual analysis of the practice and the reference class problem, here's a structured breakdown of the presupposed conceptions, their implications, and unresolved tensions:

  **Candidate Readings of the Reference Class Problem in Insurance Practice:**
  1.  **Individual Risk as "True" Reference Class:** Group rates are approximations of an applicant's unique, objective risk.
  2.  **Causal/Explanatory Criterion:** Only factors directly *causing* the risk (e.g., smoking causing health issues) are admissible; mere correlates (e.g., zip code correlating with theft rates) are suspect.
  3.  **Moralized Criterion:** Only factors for which the applicant is deemed *responsible* (e.g., smoking choice) or which reflect *desert* rather than *brute luck* (e.g., genetic predisposition) are admissible.
  4.  **Conventionalist/Political Settlement:** The choice of reference class is not dictated by statistics or metaphysics, but by social norms, legal frameworks, and political agreement.

  **Analysis of the Practice:**

  1.  **Reading Favored by the Practice: Moralized Criterion**
      *   **Why it Fits:** The practice explicitly rejects highly predictive factors like race, religion, disability, sex, and genetics. These are typically characteristics that are immutable, assigned at birth, or deeply tied to identity and systemic disadvantage – paradigms of "brute luck." Permitted factors (age, occupation, smoking, credit history – *to some extent*) are perceived as involving elements of choice, consequence of action, or factors for which differential treatment is socially acceptable (even if partly luck-based). The hostility to certain predictive groups stems from a moral judgment about fairness and responsibility, not their statistical validity.
      *   **Licenses the Practice:** It provides the *non-statistical justification* for including some predictive groups and excluding others, even when excluded groups are equally or more predictive. It answers *why* we don't use *all* predictive classes.

  2.  **Readings Undermined or Incompatible with the Practice:**
      *   **Straightforward Predictive Accuracy:** This view holds that *any* class improving predictive power should be used to set the most accurate (i.e., fair in an actuarial sense) price. **This directly undermines the practice.** Using race or genetics, if predictive, would be mandated. The practice's deliberate exclusion of highly predictive factors is fundamentally incompatible with this view.
      *   **Individual Risk as "True" Class:** While the actuarial drive for finer classification hints at this ideal, the practice *rejects* its logical conclusion. Truly individual risk pricing would destroy pooling, the core mechanism of insurance. The practice relies on pooling groups defined by *morally permissible* characteristics, not uniquely individualized risk. This view cannot justify *which* groups are used for approximation; it only pushes for finer granularity *within* permitted factors.
      *   **Causal/Explanatory Criterion:** This view is **partially compatible but insufficient and often violated.**
          *   *Compatible:* Excluding race/genetics aligns if they are seen as non-causal correlates (though this is often biologically/sociologically dubious). Including smoking fits a causal narrative.
          *   *Insufficient:* It doesn't explain why *non-causal but predictive and responsibility-linked* factors (like credit history for auto insurance) are often used, nor why *causal but immutable* factors (like some genetic disabilities) are excluded. The practice often relies on correlates (e.g., postcode correlating with risk) without requiring proven causation, as long as they are morally permissible.
          *   *Violated:* Using correlates like postcode or occupation (which may correlate with risk due to systemic factors beyond individual control) contradicts a pure causal criterion while being standard practice.

  3.  **Underdetermined Aspects (Multiple Compatible Views Possible):**
      *   **The *Specific* Moral Theory:** The practice presupposes *some* moral distinction between permissible and impermissible factors (brute luck vs. option luck, responsibility, desert, anti-discrimination norms) but is **underdetermined** regarding *which specific theory* (e.g., Rawlsian, luck egalitarian, control-based responsibility) is correct. Different theories could license the same classifications or lead to slightly different ones (e.g., debates over obesity as choice vs. predisposition).
      *   **The Role of Convention/Politics:** While the moral criterion provides the primary justification, the practice is **underdetermined** on whether the *specific list* of permitted/prohibited factors is purely derived from moral philosophy or is also shaped by historical contingencies, lobbying, and political compromise (e.g., why credit history is often permitted while genetics are not, despite both involving elements beyond pure choice). The moral view provides the *framework*, but convention/politics likely shapes the *specific implementation* within that framework.

  **Addressing the Internal Tension & Stopping Point:**
  *   **Tension:** The practice navigates the core tension (refining groups vs. maintaining pools) by using morally permissible groups of a *practically manageable* size. The actuarial drive refines *within* the boundaries set by the moral criterion.
  *   **Principled Stopping Point:** The practice **presupposes a principled (non-statistical) stopping point:** refinement stops when further segmentation would require using a *morally impermissible* factor (e.g., race) or would functionally equate to individual pricing (destroying pooling). The stopping point is defined by the **moralized criterion**, not by diminishing statistical returns alone. We don't use race *not* because it lacks predictive power, but because it's morally excluded *despite* its predictive power. This moral line halts the refinement process before it destroys pooling.

  **Implications of Shifting to a Straightforward Predictive Conception:**
  If the practice adopted a purely predictive view of the reference class:
  1.  **Inclusion of Excluded Factors:** Race, religion, disability, sex, and highly predictive genetic results *must* be used in pricing if they improve predictive accuracy. Actuarial "fairness" (individuals paying their expected cost) would demand it.
  2.  **Erosion of Risk Pooling:** Pricing would trend relentlessly towards hyper-personalization based on all available predictive data. High-risk individuals (based on immutable traits) would face prohibitively high premiums or denial of coverage, undermining the very purpose of insurance as a collective risk-sharing mechanism.
  3.  **Moral Conflict:** This shift would directly conflict with fundamental legal and societal norms prohibiting discrimination based on protected characteristics, regardless of statistical correlation. It would equate actuarial accuracy with moral fairness, rejecting the current practice's core moral distinction.
  4.  **Elimination of the Moral Stopping Point:** The constraint against using certain groups would vanish. Refinement would continue based solely on predictive power until limited only by data availability or computational power, pushing the system towards the individual risk ideal and away from pooling.

  **Conclusion:**
  The insurance pricing practice described **presupposes a moralized conception** of the reference class problem. It uses statistical group frequencies but explicitly subordinates pure predictive accuracy to a moral criterion that distinguishes between permissible and impermissible groupings, primarily based on notions of responsibility, desert, and the rejection of penalizing individuals for brute luck. This moral criterion provides the essential non-statistical justification for including some predictive groups while excluding others and establishes the principled stopping point that prevents refinement from destroying risk pooling. While the specific moral theory and the exact role of convention/politics remain underdetermined, the rejection of straightforward predictive accuracy for certain factors is the defining feature of the practice's implicit philosophy. Shifting to a purely predictive conception would fundamentally alter the practice, requiring the inclusion of currently prohibited factors and undermining the social pooling function of insurance.
