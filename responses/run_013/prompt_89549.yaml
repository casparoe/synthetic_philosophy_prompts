prompt: |-
  I run the search-and-rescue operation for a large alpine park, and I have just been handed the job of rewriting our deployment protocol for the situation the handbook has always dodged: one aircraft, one weather window, and people we could reach on two different routes but not both. On paper our rule is "maximize expected lives saved," which in practice means the larger party gets the flight. Since taking over I have been reading the philosophical literature on whether the numbers count — in particular the argument associated with John Taurek, that when I can save one stranger or save five, the five do not have a weightier claim merely because they are more numerous, and that what fairness requires instead is something like a lottery among the individuals at risk. It is more persuasive to me than I expected, and it has made me distrust our protocol. But I cannot hand a duty officer a rule that amounts to "toss a coin" without working out what that actually means at three in the morning in a storm. These calls come perhaps two or three times a season, but each one is somebody's life and the decision is irreversible.

  I would like you to act as a philosopher working in normative ethics and the theory of rational choice, and also as someone used to advising operational agencies, and to turn this principle into a procedure my duty officers can actually run. Please think carefully before you answer, and begin by brainstorming in writing: set out what the principle is really committed to, separating the claim about the separateness of persons from the claim about how ties are to be broken, and say which parts are load-bearing and which are rhetoric. Then give me the procedure itself — the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a definite answer, and where it hands the decision back to a human because the question is one of value rather than fact.

  It has to survive the cases that actually come up: (a) one badly injured climber on one route against five uninjured but stranded climbers on another; (b) one person reachable before the window closes against five who could also be reached, more slowly, by a ground team that is already committed and would otherwise be free; (c) a certain rescue of one against a low-probability rescue of five; (d) one death against five serious injuries rather than five deaths; (e) a solo climber against a rope team, where only one member of the rope team can be lifted at that moment. One of my team leads has proposed a "weighted lottery" — everyone gets a ticket, but a party of five gets five tickets — and I want the procedure to say plainly whether that is a fix or our old rule in disguise.

  Then run the procedure on two of these cases, one of which it decides in a way I will not like, and be explicit about what the procedure cannot do: where it will misfire, which judgments it is quietly smuggling in, and what would have to be added by someone with the authority to make policy rather than by a duty officer on shift.

  Constraints: the duty officer has minutes, not hours; the person running the procedure may have no background in philosophy; the decision has to be defensible afterwards, in writing, to a review board and to the families involved; and the procedure cannot depend on information we will not have, such as life-years gained, age, or dependents.
reasoning: |-
  Hmm, this is a profound operational and ethical dilemma. The user runs alpine search-and-rescue and needs to transform Taurek's philosophical argument into a practical protocol. They're clearly grappling with the tension between standard expected-value calculations ("save the larger group") and Taurek's radical claim that numbers shouldn't matter. 

  First, let's unpack what's really being asked. The user needs:
  - A step-by-step procedure operable at 3am by non-philosophers
  - That implements Taurek's core principle (individual moral equality)
  - While handling real-world complexities like injuries, probabilities, and team dynamics
  - With full auditability for review boards
  - And explicit boundaries showing where policy decisions must be made upstream

  Key insights from the query:
  The user has clearly done deep reading - they reference Taurek's "separateness of persons" argument accurately. Their examples reveal sophisticated understanding of edge cases: the stranded climber vs rope team scenario particularly shows how "individuals" aren't always clear-cut. Their skepticism about "weighted lotteries" is spot-on - that's just utilitarianism in disguise.

  The operational constraints are brutal: minutes to decide, no luxury of deliberation, irreversible consequences. Yet the ethical stakes couldn't be higher - literally life/death fairness. What's especially acute is their need for defensibility; rescue teams face legal and emotional fallout regardless of choice.

  Breaking down Taurek:
  1) Foundational claim: Each person has equal moral claim to rescue, regardless of group size. Saving five isn't "better" than saving one - that treats persons as interchangeable units.
  2) Implication: When resources can't save all, we must give each individual equal chance via fair lottery.
  3) Crucial nuance: This isn't about compassion or outcomes, but about respecting persons as ends-in-themselves. The "load-bearing" element is the lottery mechanism; the rhetoric is about resisting aggregation.

  Now for the hard part - implementation. The procedure must:
  - First confirm true scarcity (can't reach both groups)
  - Then verify comparable rescue impact (no major outcome differentials)
  - Only then trigger the lottery
  But crucially, it must flag where comparisons fail (e.g., injury severity changes "rescue" meaning) and kick those decisions upstairs as policy questions.

  Testing against their cases:
  For the injured vs uninjured scenario - the procedure should pause because "rescue" means different things medically. This exposes where operational definitions matter. 
  For the low-probability case - expected lives (1 vs 0.5) would normally dictate, but Taurek forces us to ask: is probability assessment reliable enough to override equal chance?

  The rope team dilemma cuts deepest: are five individuals on a rope "one unit" or five persons? Ethically they're five, but operationally rescuing one might doom others. Here the procedure must explicitly state it's making a policy call about group definition.

  Finally, the weighted lottery trap: giving five people five tickets sounds fair but actually replicates "save the larger group" by probability. True Taurek requires one ticket per individual, then draw one ticket to determine which group gets rescued. That's the only way to give each person equal chance.

  What the user might dislike: In the certain-rescue-of-1 vs low-probability-rescue-of-5, pure Taurek says run lottery anyway. That will feel wrong operationally - which is why we need clear "off-ramps" where probability differentials are too great, but that requires policy thresholds set in advance.
answer: |-
  ### Brainstorm: Core Principles & Load-Bearing Elements  
  **Taurek’s Commitment**:  
  1. **Separateness of Persons** (Load-Bearing):  
     - Each individual has equal moral claim to rescue, irrespective of group size.  
     - Saving 5 is not inherently "better" than saving 1; aggregating claims violates individual worth.  
  2. **Fairness Mechanism** (Load-Bearing):  
     - When resources are insufficient to save all, a lottery gives each person an equal chance.  
     - *Not* "save the larger group," nor "weighted lottery" (which aggregates claims).  
  3. **Rhetoric vs. Substance**:  
     - *Rhetoric*: "Numbers don’t count" (emphasizes anti-aggregation).  
     - *Substance*: **Equal chance per life at risk**, enforced by a uniform lottery.  

  **Critical Distinction**:  
  - **Weighted lottery (e.g., 5 tickets for 5 people) is a covert utilitarian rule**. It replicates "save the larger group" statistically. True Taurek requires **one ticket per individual, drawn once** to select which *group* is rescued.  

  ---

  ### Procedure: "Equal Chance Protocol"  
  **Objective**: Assign rescue priority via a lottery that gives each imperiled person an equal chance.  
  **Runtime**: <5 minutes. Tools: Coin, dice, or random number generator (RNG).  
  **Output**: Rescue coordinates or "Policy Decision Required" flag.  

  #### Step-by-Step Questions:  
  1. **"Can we reach both parties fully before the window closes?"**  
     - *Yes*: Rescue both. **STOP**.  
     - *No*: Proceed.  

  2. **"Is every person in immediate peril of death if not rescued *now*?"**  
     - *No* (e.g., ground team can reach one group later): Rescue the group with no alternative. **STOP**.  
     - *Yes* (both face imminent death without this flight): Proceed.  

  3. **"Are the outcomes of rescue *equivalent* for all individuals?"**  
     - *Checklist*:  
       - All will live if rescued (no irrecoverable injuries).  
       - All face death if not rescued.  
       - Rescue probability is identical (e.g., no high-risk extractions).  
     - *No* (e.g., injured vs. uninjured; certain vs. low-probability rescue): **"Policy Decision Required"** (see **Limits** below).  
     - *Yes*: Proceed to Lottery.  

  4. **Lottery Mechanism**:  
     - Assign each person a unique number (e.g., Party A: 1, Party B: 2–6).  
     - Use RNG (or dice/coin conversion) to draw **one number** from the total pool.  
     - Rescue the group containing the drawn individual.  
     - **Document**: "Random selection among [X] individuals. Drawn: Person #[N]."  

  ---

  ### Case Applications  
  **Case (a): 1 injured climber vs. 5 uninjured climbers**  
  - Step 2: Both face death? *Assume yes*.  
  - Step 3: Outcomes equivalent? **No** (rescued injured climber may die en route; uninjured likely survive).  
  - **Outcome**: "Policy Decision Required." *Why?* Medical asymmetry violates outcome equivalence.  

  **Case (c): Certain rescue of 1 vs. 30% chance to save 5**  
  - Step 2: Both face death? *Yes*.  
  - Step 3: Outcomes equivalent? **No** (certain life vs. probabilistic survival).  
  - **Outcome**: "Policy Decision Required." *Why?* Probability mismatch. Taurek’s lottery assumes deterministic outcomes.  

  **Case Taurek Decides (and you may dislike):**  
  - **Scenario**: 1 healthy solo climber vs. 5 healthy stranded climbers. Identical rescue probability.  
  - Procedure: Step 3 → Equivalent? *Yes*. Lottery runs.  
  - **Possible result**: Solo climber saved (1/6 chance).  
  - *Why you’ll dislike it*: 5 lives lost when you could have saved them. But Taurek: Saving the 5 because they are more numerous disrespects the solo climber’s equal claim.  

  ---

  ### What the Procedure *Cannot* Do (Limits)  
  1. **Handles Only "Apples-to-Apples" Peril**:  
     - Fails in cases of unequal outcomes (injury, probability, downstream effects). These require **pre-defined policy rules** (e.g., "Prioritize higher survival probability if gap > X%").  
  2. **Defines "Individual" Rigidly**:  
     - In rope teams (Case e), if only one can be lifted, the procedure treats them as separate individuals. *But*: If lifting one dooms others (e.g., cut rope), Step 3 fails equivalence → Policy call.  
  3. **Ignores Efficiency Tradeoffs**:  
     - Case (b) (flight vs. ground team): Step 2 catches this ("no alternative" for one group).  
  4. **No Moral Weight to Injuries/Deaths**:  
     - Case (d) (1 death vs. 5 injuries): Not applicable—Step 2 requires *imminent death* for all.  

  ---

  ### Is Weighted Lottery a Fix or Old Rule?  
  - **It’s the old rule in disguise**. A 5-ticket lottery gives the group of 5 an 83% chance to win, replicating "save the larger group" in expectation. Taurek’s core is uncompromising: **1 ticket per person, one draw**.  

  ### Defensibility & Audit Trail  
  - **Documentation**: Log answers to Steps 1–3. If lottery triggered, record method and draw.  
  - **For "Policy Decision Required"**: Duty officer follows pre-authorized rules (e.g., "Prioritize larger group if outcomes inequivalent").  
  - **Philosophy in Plain Language**:  
     > "We gave each person an equal chance because no life is worth more than another. When risks were identical, random selection was fairest. When risks differed, we followed [Policy X]."  

  ### Implementation Kit  
  - **Quick Reference Card**:  
    ```  
    1. Can we save both? YES → Save both.  
    2. Can one group wait? YES → Save the other.  
    3. Are all equally likely to live if rescued? NO → Apply Policy [X].  
    4. YES → Assign each person a number. Draw ONE number. Save that group.  
    ```  
  - **Tools**: Pocket dice (e.g., 1d10 for ≤10 people) or smartphone RNG app.  

  This procedure honors Taurek’s non-aggregation principle while containing operational off-ramps for realism. Its rigor lies in forcing explicit policy where ethics and practicality collide—shifting value judgments from panicked duty officers to daylight policy debates.
