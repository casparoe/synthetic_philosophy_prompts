prompt: |-
  I'm writing the specification for a theory of life before committing to any particular account of it. The theory's job, for my purposes, is to license defensible yes/no verdicts on whether a given system is alive, issued by someone with limited data and no prospect of gathering more — a biosignature officer reading a distant instrument, say. Give me the desiderata such a theory has to meet: the cases it must classify correctly, the distinctions it must not collapse, the findings from biology and chemistry it must not contradict, each with the consideration that makes it a requirement. Two cases I want handled explicitly, since I think they are where the usual checklists strain: first, a chemically active, self-repairing system sealed in a stable environment that neither reproduces nor evolves; second, a lineage of self-replicating molecules that does evolve under selection but has no metabolism of its own, its copying driven by apparatus I can switch off. For each desideratum, mark whether it is non-negotiable or the preference of one camp, and flag any pair that looks jointly unsatisfiable; note also which single requirement does the most to rule out otherwise plausible accounts. Close by naming the requirement you are least confident belongs on the list, and what you would have to be shown to drop it.
reasoning: |-
  Okay, the user is developing a theory of life for practical applications like biosignature detection. They need a set of criteria that can definitively classify systems as alive or not, especially in scenarios with limited data. The key challenges they mentioned are two edge cases: a self-repairing system without reproduction or evolution, and evolving replicators without intrinsic metabolism.

  First, I need to recall the standard definitions of life and their limitations. Biology typically includes reproduction, evolution, metabolism, etc., but these edge cases test those boundaries. The user's context is crucial—biosignature officers can't run new experiments; they rely on existing data. So the theory must work with incomplete information.

  The user wants desiderata that cover necessary classifications, avoid contradictions with science, and handle the two tricky cases. They also want to know which points are non-negotiable versus debatable, and identify any conflicts. Plus, they need the weakest requirement that could be dropped under certain evidence.

  Desideratum 1: Operational Verifiability. This is non-negotiable because the theory must function with limited data. Without this, the whole purpose fails. But it might conflict with avoiding false negatives if some life processes are undetectable remotely.

  Desideratum 2: Binary Classification. This is non-negotiable too. Biosignature decisions are yes/no. Continuous properties like complexity can't lead to maybe answers. However, this might clash with systems that are borderline, like the self-repairing entity.

  Desideratum 3: Avoiding False Negatives. Non-negotiable. Missing actual life is unacceptable. But if a system doesn't show key processes like evolution, it might be excluded. The self-repairing case tests this—if it lacks reproduction, is it alive? Some theories say no, but the user might want to include it.

  Desideratum 4: Avoiding False Positives. Also non-negotiable. Non-living systems like fire or crystals shouldn't be mistaken for life. The evolving replicator case is key here. If it evolves but relies on external machinery, is it alive? If included, it might set a precedent that includes non-biological evolvers.

  Desideratum 5: Compatibility with Known Biology. Non-negotiable. Must align with Earth's life. But extraterrestrial life might differ, so this could cause false negatives if too Earth-centric. The challenge is to generalize without contradicting existing knowledge.

  Desideratum 6: Compatibility with Chemistry. Non-negotiable. Life shouldn't violate physical laws. This grounds the theory in reality but might not add much beyond existing science.

  Desideratum 7: Handling Reproduction/Evolution Edge Case. This is debatable. The replicator case: if it evolves but lacks metabolism, is it alive? Theories like Gánti's chemoton or NASA's definition exclude it without metabolism. Including it might require redefining life to separate evolution from other functions.

  Desideratum 8: Handling Metabolism/Maintenance Edge Case. Also debatable. The self-repairing system without reproduction. Most definitions require reproduction, so excluding it aligns with standards. Including it could conflict with avoiding false positives if similar to machines.

  Now, conflicts: Operational Verifiability vs. Avoiding False Negatives. If life processes are internal and undetectable, verifying without data is hard. Also, Binary Classification vs. Handling Edge Cases—borderline systems challenge clear yes/no answers.

  The biggest constraint is Avoiding False Negatives because it forces inclusion of edge cases, which might conflict with traditional definitions. For example, including the self-repairing system might require dropping reproduction as necessary, which many theories insist on.

  The weakest requirement might be Handling Metabolism/Maintenance Edge Case. If shown that such systems are effectively complex machines, not life, it could be dropped. Evidence from robotics or synthetic biology showing they don't achieve autonomy could support this.

  I should structure each desideratum with its necessity, rationale, and relevance to the edge cases. Highlight conflicts and the key requirement that rules out many theories. Close with the debatable requirement and what evidence could change it.
answer: |-
  Here’s a structured set of desiderata for your theory of life, designed to handle the edge cases you specified while meeting practical biosignature constraints. Each requirement is marked as **non-negotiable** (core to the theory’s purpose) or **debatable** (subject to philosophical/biological disagreement), with conflicts and key constraints flagged.

  ---

  ### **Core Desiderata**  
  1. **Operational Verifiability**  
     - **Requirement**: Must yield verdicts using finite, static, and possibly incomplete data (e.g., spectral analysis, telemetry).  
     - **Rationale**: Essential for the "biosignature officer" use case—no new data can be gathered.  
     - **Status**: **Non-negotiable**.  
     - **Edge Cases**: Forces the theory to adjudicate your sealed self-repairing system and switch-dependent replicators *as-is*.  

  2. **Binary Classification**  
     - **Requirement**: Must output definitive yes/no verdicts (no "maybe" or gradients).  
     - **Rationale**: Practical decisions (e.g., resource allocation for further study) demand unambiguous calls.  
     - **Status**: **Non-negotiable**.  
     - **Conflict**: Potentially clashes with the continuity of biological complexity (e.g., viruses, prions).  

  3. **Avoid False Negatives**  
     - **Requirement**: Must classify all uncontroversially living systems (e.g., Earth life) as alive, *even with limited data*.  
     - **Rationale**: Missing actual life is catastrophic for astrobiology/exploration.  
     - **Status**: **Non-negotiable**.  
     - **Edge Cases**: Rules out theories excluding your evolving replicators (e.g., if "metabolism" is strictly required).  

  4. **Avoid False Positives**  
     - **Requirement**: Must exclude non-living systems (e.g., fire, crystals, software, hurricanes) that mimic life processes.  
     - **Rationale**: False alarms waste resources and undermine credibility.  
     - **Status**: **Non-negotiable**.  
     - **Edge Cases**: Tests against your self-repairing system (if deemed non-living) or replicators dependent on external apparatus.  

  5. **Compatibility with Known Biology**  
     - **Requirement**: Must not contradict empirical biology (e.g., evolution, cellular structure, entropy management).  
     - **Rationale**: Grounds the theory in observed reality; extraterrestrial life is inferred from known principles.  
     - **Status**: **Non-negotiable**.  
     - **Key Constraint**: Rules out theories violating evolutionary mechanisms (e.g., static "vitalism").  

  6. **Compatibility with Chemistry/Physics**  
     - **Requirement**: Must not invoke mechanisms violating thermodynamics or chemical kinetics.  
     - **Rationale**: Life is a physicochemical process; violations would make detection incoherent.  
     - **Status**: **Non-negotiable**.  

  ---

  ### **Debatable Desiderata (Philosophical/Camp-Specific)**  
  7. **Handling the Reproduction/Evolution Edge Case**  
     - **Requirement**: Must classify your evolving replicators (copying driven by external apparatus) as alive *or* not, with justification.  
     - **Rationale**: Tests whether evolution *alone* suffices for life.  
     - **Status**: **Debatable** (e.g., NASA’s "chemical evolution" includes it; Gánti’s chemoton excludes it without metabolism).  
     - **Conflict**: Jointly unsatisfiable with *Avoid False Positives* if replicators are included (risks classifying AI or crystals as alive).  

  8. **Handling the Metabolism/Maintenance Edge Case**  
     - **Requirement**: Must classify your sealed, self-repairing system as alive *or* not, with justification.  
     - **Rationale**: Tests whether homeostasis/metabolism *without* reproduction/evolution constitutes life.  
     - **Status**: **Debatable** (e.g., autopoiesis theories include it; Darwinian theories exclude it).  
     - **Conflict**: Jointly unsatisfiable with *Avoid False Negatives* if excluded (e.g., senescent organisms might fail this test).  

  ---

  ### **Key Constraints & Conflicts**  
  - **Most Constraining Requirement**: **Avoid False Negatives**. This forces the inclusion of marginal cases (e.g., viruses, dormant spores) and rules out "checklist" approaches missing universal features. It directly challenges theories that over-prioritize reproduction (excluding your self-repairing system) or metabolism (excluding your replicators).  
  - **Critical Conflict**: **Operational Verifiability vs. Avoiding False Negatives**. With limited data, a system may lack observable signatures of key processes (e.g., evolution). This may force the theory to rely on *potential* rather than observed dynamics, risking false positives.  

  ---

  ### **Weakest Requirement**  
  **Handling the Metabolism/Maintenance Edge Case** (Desideratum 8) is the least defensible on my list. I would drop it if shown:  
  - **Evidence that self-repair without replication is trivially achievable** in non-living systems (e.g., advanced self-healing polymers or robotic systems that mimic "metabolism" but lack evolutionary potential).  
  - **Biological consensus** that such systems are not alive (e.g., if all Earth life requires reproduction for long-term persistence, making your sealed system analogous to a disconnecting battery).  

  This requirement risks over-inclusion (e.g., classifying thermostats as alive) and may not reflect life’s *lineage-dependent* nature. If dropped, the theory could focus on evolution/reproduction as the non-negotiable core.  

  ---  
  **Final Note**: The hardest trade-off lies between *Operational Verifiability* (requiring simple, observable proxies) and *Avoiding False Negatives* (demanding inclusivity). Your theory must bridge this by identifying a **minimal observable signature** that captures life’s essence (e.g., chemical disequilibrium + adaptive complexity). The two edge cases will stress-test any candidate.
