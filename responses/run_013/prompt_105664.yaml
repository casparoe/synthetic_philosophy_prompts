  First, the cases they mentioned: one-shot interactions with strangers, iterated finite rounds, noisy environments, partner choice, small structured populations, and asymmetric payoffs. Each of these scenarios presents unique challenges for cooperation to evolve. For example, in one-shot interactions between strangers, there's no future interaction to incentivize cooperation, so any theory must address how cooperation can emerge here without direct reciprocity.

  The user's specific requirements are interesting. Perturbation accountability means the theory should explain not just stability but how cooperation degrades with small changes in payoffs. Portability requires the mechanism to work across similar games without re-tuning. No unbounded resources rules out infinite populations or perfect rationality. Accounting neutrality demands clarity on whether explanations are individual or group-level. And one-shot non-negotiable insists on explaining some cooperation in one-shot cases or explicitly excluding it.

  I need to consider each requirement's legitimacy. Perturbation accountability seems crucial because real-world payoffs aren't fixed; they fluctuate. If a theory can't handle small perturbations, it's not robust. Portability is important for generalizability but might be too strict. Rigid portability could be parochial if cooperation mechanisms are context-dependent. No unbounded resources is non-negotiable since biological and cognitive limits exist. Accounting neutrality prevents fuzzy thinking between individual and group selection. One-shot non-negotiable is tricky; insisting on explaining one-shot cooperation might be unrealistic, but the theory should at least address why it's rare.

  Now, distinctions the theory must respect. Behavior vs. disposition is key. A disposition (like a strategy) can be selected for even if behaviors vary. Stability vs. invasion resistance: a strategy can be stable but not resistant to all invaders, or vice versa. Short-run vs. long-run explanations matter because mechanisms like kin selection work long-term, while reciprocity might show quicker results.

  Conflicts between desiderata: Portability and one-shot cooperation might clash. Mechanisms for one-shot (like signaling) may not transfer to iterated games. Also, perturbation accountability and no unbounded resources could conflict in structured populations where stability margins depend on network size.

  The most excluding requirement is probably the one-shot non-negotiable. Many theories (like direct reciprocity) fail here. Kin selection and group selection might handle it but face other issues like accounting neutrality.

  The user likely wants to ensure their model is robust and applicable across scenarios without unrealistic assumptions. They might be building an agent-based model and need theoretical grounding. Their unspoken need is to avoid common pitfalls in evolutionary cooperation theories, hence emphasizing explicit requirements and potential conflicts.
answer: |-
  Here are the core desiderata for an adequate theory of the evolution of cooperation, grounded in your specified cases and requirements, with justification and assessment of necessity:

  **Core Desiderata Forced by the Cases:**

  1.  **Explain Cooperation Without Future Interaction:** Must account for cooperation in the *one-shot stranger* case (minimal signal only) or explicitly exclude it as impossible under the theory's scope. *(Forced by: One-shot strangers case)*.
      *   *Satisfaction:* The theory provides a mechanism (e.g., kin recognition via signal, costly signaling, spatial assortment leading to pseudo-kin effects, pre-commitment) or states plainly that cooperation cannot evolve in this specific scenario under the model's assumptions.
      *   *Non-negotiable?* **Contextual.** A theory *can* be valid while excluding this case *if* it clearly defines its domain (e.g., "only applies to repeated interactions"). However, excluding it significantly limits generality and explanatory power. A truly general theory *should* address it.

  2.  **Handle Finite Horizons:** Must explain cooperation in iterated interactions with a *known, finite* number of rounds. *(Forced by: Finite rounds case)*.
      *   *Satisfaction:* The mechanism generates cooperation despite the inevitability of a final defection (e.g., reputation spillover beyond the dyad, spatial structure preventing perfect backward induction, incomplete information about horizon/type, partner choice).
      *   *Non-negotiable?* **Yes.** Backward induction dictates defection in the final round of a perfectly known finite PD. Any realistic theory must circumvent this logic or show why it doesn't apply biologically.

  3.  **Robustness to Noise:** Must explain the persistence of cooperation in a *noisy* environment where intended actions are misperceived. *(Forced by: Noisy world case)*.
      *   *Satisfaction:* The cooperative strategy/mechanism is error-tolerant (e.g., strategies like Generous Tit-for-Tat, Contrite TFT; forgiving mechanisms; reputation systems that account for noise; focusing on expected payoffs).
      *   *Non-negotiable?* **Yes.** Noise is ubiquitous in biological and social systems. A mechanism that collapses under the slightest misperception is biologically implausible.

  4.  **Integrate Partner Choice:** Must incorporate the effects of agents *choosing or leaving partners* rather than only responding within fixed interactions. *(Forced by: Partner choice case)*.
      *   *Satisfaction:* The theory models how agents select partners based on signals/reputation, the costs/benefits of search/switching, and how this selection pressure shapes cooperative behavior (e.g., competitive altruism, biological markets).
      *   *Non-negotiable?* **Increasingly Yes.** Partner choice is a powerful driver of cooperation often overlooked in classic models (like the Prisoner's Dilemma). Ignoring it misses a major evolutionary pathway.

  5.  **Function in Finite Structured Populations:** Must work in populations that are *small, finite, and structured* (non-uniform interaction). *(Forced by: Small/structured populations case)*.
      *   *Satisfaction:* The theory explicitly models population structure (e.g., graphs, spatial grids, tags, kin groups) and finite size effects (e.g., drift, local extinction/recolonization, limited partner pools).
      *   *Non-negotiable?* **Yes.** Infinite, well-mixed populations are unrealistic idealizations. Drift, local competition, and assortment are fundamental to evolutionary dynamics.

  6.  **Handle Asymmetric/Private Payoffs:** Must account for cooperation when payoffs are *asymmetric and not common knowledge*. *(Forced by: Asymmetric payoffs case)*.
      *   *Satisfaction:* The theory does not rely on agents knowing each other's exact payoffs or symmetric incentives. Mechanisms work with observable actions/signals/reputation rather than perfect payoff knowledge (e.g., reciprocity based on actions, not inferred payoffs; partner choice based on behavioral outcomes).
      *   *Non-negotiable?* **Yes.** Perfect, common knowledge of symmetric payoffs is unrealistic. Cooperation must emerge despite uncertainty and differing individual valuations of outcomes.

  **Assessment of Your Specific Requirements:**

  1.  **Perturbation Accountability:**
      *   *Satisfaction:* The theory quantifies the stability margin (e.g., critical benefit-cost ratio, maximum tolerable noise level, minimum required assortment coefficient, minimum reputation signal strength) and predicts the degradation pattern (e.g., gradual decline, sharp threshold, hysteresis).
      *   *Legitimacy:* **Highly Legitimate & Non-negotiable.** Real-world parameters fluctuate. Knowing *only* if cooperation is stable at one precise point is insufficient; knowing *how* stable it is and *how* it fails is crucial for robustness and testability. Silence on degradation implies fragility.

  2.  **Portability:**
      *   *Satisfaction:* The core mechanism (e.g., kin recognition tags, reputation scores, spatial clustering) functions effectively when applied to different but strategically similar games (e.g., moving from Prisoner's Dilemma to Snowdrift or Stag Hunt) without altering parameters tuned for the original game.
      *   *Legitimacy:* **Partially Legitimate, Potentially Parochial.** Desiring *some* generality across similar dilemmas is legitimate. However, demanding *perfect portability without any adjustment* is likely parochial. Optimal strategies/parameters often depend on specific payoff structures. The key is that the *core logic* (e.g., assortment, reciprocity, reputation) remains valid and effective, even if details like tolerance levels need slight tuning. Requiring no re-tuning whatsoever may be unrealistic.

  3.  **No Unbounded Resources:**
      *   *Satisfaction:* The theory explicitly assumes finite populations, finite expected interaction lengths, bounded memory/recall (e.g., finite state machines, summary statistics like reputation), and bounded rationality/computation.
      *   *Legitimacy:* **Absolutely Legitimate & Non-negotiable.** Infinite time, infinite memory, perfect recall, infinite populations, and hyper-rationality are biologically and cognitively implausible. Mechanisms relying on these are suspect. Boundedness is essential for realism.

  4.  **Accounting Neutrality:**
      *   *Satisfaction:* The theory is formulated strictly in terms of individual fitness (replicator dynamics, agent-based models with individual selection). If group-level concepts (e.g., group fitness, group selection) are used, their causal efficacy relative to individual fitness is explicitly defined and their necessity is justified (e.g., explaining variation not reducible to individual traits under selection).
      *   *Legitimacy:* **Crucially Legitimate & Non-negotiable.** Ambiguity between levels of selection is a major source of confusion and flawed explanation. The theory must be clear about where fitness consequences occur (individual vs. group) and avoid "sloppy agnosticism" or equivocation. Defining the level is essential.

  5.  **One-Shot Non-Negotiable:**
      *   *Satisfaction:* The theory provides a plausible mechanism for *some* cooperation in the minimal one-shot stranger case, or explicitly and rigorously argues why cooperation is impossible in this specific scenario under the theory's core principles.
      *   *Legitimacy:* **Mostly Legitimate, but Contextually Negotiable.** A theory *can* be valid and important without explaining one-shot stranger cooperation (e.g., a theory focused solely on kin selection or long-term reciprocity). However, given its importance for human sociality and certain biological phenomena (e.g., signaling altruism), a truly *general* theory *should* address it. Demanding it as *absolutely* non-negotiable for *any* theory might be parochial, but refusing to address it *at all* significantly limits scope. The requirement to *explicitly address it* (even if concluding it's impossible) is non-negotiable for generality.

  **Essential Distinctions the Theory Must Respect:**

  1.  **Behavior vs. Disposition (Strategy/Type):** Must distinguish the cooperative *action* from the underlying evolved *rule* (strategy, genotype, phenotype, disposition) that generates it. Selection acts on dispositions, not isolated actions. Explaining the evolution of a *cooperative disposition* is the core goal.
  2.  **"Cooperation is an Equilibrium" vs. "Cooperation Resists Invasion":** Must distinguish:
      *   A cooperative state being a Nash/Evolutionary Stable Strategy (ESS) equilibrium (no *individual* has incentive to deviate).
      *   The *dynamic stability* of that equilibrium – its ability to resist invasion by rare mutants (ESS condition) or recover from small perturbations (convergence stability).
      *   The *accessibility* of the cooperative equilibrium from non-cooperative starting points (e.g., via drift, mutation, environmental change).
  3.  **Short Run (Transient Dynamics) vs. Long Run (Equilibrium/Stationary Distribution):** Must clarify what is explained:
      *   **Short Run:** How cooperation *emerges* or *increases* from low frequencies (invasion, spread), potentially driven by non-equilibrium forces (drift, spatial effects, transient asymmetries).
      *   **Long Run:** The *persistent* state of the population (stable equilibrium, cyclical attractor, stationary distribution in stochastic models). A strategy can be long-run stable but very hard to reach (short-run inaccessible), or easily reached but unstable long-run.

  **Suspected Conflicts Between Desiderata:**

  1.  **Portability vs. One-Shot Non-Negotiable vs. Finite Horizons:** Mechanisms excelling in repeated games (e.g., direct reciprocity) often fail utterly in one-shot games. Mechanisms for one-shot (e.g., costly signaling) might be ineffective or maladaptive in long finite interactions. Achieving portability across *all* these contexts with one mechanism is extremely challenging. Partner choice helps bridge this but adds complexity.
  2.  **Perturbation Accountability (Precise Margins) vs. No Unbounded Resources (Finite/Noisy):** Calculating precise stability margins often relies on asymptotic analysis (large N, weak selection, infinite time). In finite, noisy, structured populations, stability margins become stochastic and distributional, making precise analytical prediction difficult. Agent-based models can satisfy both but sacrifice analytical generality.
  3.  **Accounting Neutrality (Individual Focus) vs. Explaining Strong Cooperation in Small Groups:** While multilevel selection can be formulated neutrally, explaining intense cooperation within small groups (e.g., eusociality) often *feels* more natural with group-level terms, and rigorous individual-level accounting can be complex. The tension is in the *ease of explanation*, not necessarily impossibility, but it highlights the need for clarity.

  **The Most Excluding Requirement:**

  **No Unbounded Resources** is likely the single requirement that does the most to exclude candidate theories. It immediately disqualifies:
  *   Models relying on infinite populations to ignore drift/stochasticity.
  *   Models requiring infinite interaction horizons (e.g., Folk Theorem reliance).
  *   Models assuming perfect memory of infinite histories.
  *   Models requiring hyper-rational Bayesian updating over vast state spaces.
  This requirement forces the theory into the computationally complex, stochastic, finite realm of biological reality, where many elegant analytical solutions break down. It pushes towards computationally intensive methods (like agent-based modeling) and demands robustness to cognitive and informational limitations that idealized models often circumvent.
