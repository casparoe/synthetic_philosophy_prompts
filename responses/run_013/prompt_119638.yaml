          We might say: both are causes because they both increased the dose. But we cannot attribute specific cases to one or the other.

          This becomes a values call: we might report that both sources contributed to the contamination and the resulting health risk.

          Therefore, we might not have a clear "stop" here. We would proceed to Step 5 and report both.

          However, in our procedure, Step 4 might not yield a clear answer. We might then have:

            Q6: But-for the plant, would the cluster have occurred? 
                - Without the plant, the level would be 4 ppm. If 4 ppm is not associated with increased risk, then no. But if 4 ppm still carries some risk, then maybe the cluster would have occurred but smaller? 

            We then move to Q7: Interventionist: if we remove the plant, the level drops to 4 ppm, which might reduce the risk. So the plant is a cause.

            Similarly, if we remove the utility, the level drops to 6 ppm, which is still above threshold, so the cluster would still occur. Then the utility is not a cause? 

            But note: the utility's contribution added to the dose, so it might have caused some of the cases. We might use the concept of attributable fraction.

          This is complex and might require modeling. We might have to escalate to the director for a decision on how to attribute.

  Example 3: Exposure made an existing condition worse.

     Step 0: The outcome is progression of disease (severity or acceleration), not incidence.

     Step 1: General causation? Is the exposure known to worsen the condition? (If not, then we might not have evidence.) Assume yes.

     Step 2: Exposure? Assume present and at a level known to worsen the condition.

     Step 3: Cluster? We are not looking at incidence, but at a group of individuals whose condition worsened. We would need to show that the rate of progression is higher than expected. This might be difficult. Assume we have evidence that the progression rate is unusually high and the exposed group has a higher progression rate than a comparable unexposed group.

     Step 4: 
          But-for: without the exposure, would the worsening have occurred at this time and to this degree? If not, then the exposure caused the worsening.
          Interventionist: if we remove the exposure, would the progression have been slower? If yes, then the exposure caused the accelerated progression.

     So we can say the exposure is a cause of the worsened condition.

  VI. Judgment Calls in a Lab Coat

  Flagged steps that require expert judgment:

  - Step 1, when there is limited evidence for general causation (escalate to director).
  - Step 2, Q4: determining if the exposure level is sufficient to cause the disease (requires toxicological and exposure modeling expertise).
  - Step 3: statistical assessment of the cluster (requires biostatistics expertise; and when statistical significance is not achieved but the disease is rare, then a judgment call).
  - Step 4: applying but-for or interventionist in complex cases (overdetermination, preemption) may require philosophical and scientific judgment.

  VII. Conclusion

  The procedure is a guideline but cannot eliminate judgment. It structures the inquiry and forces us to consider key elements. It is important to document each step and the reasoning.

  We must also be clear that we are making inferences based on the available evidence and that uncertainty is inherent.

  Finally, we note that the two causal questions are complementary and we should use both when needed. The procedure might help in standardizing the approach and defending decisions.

