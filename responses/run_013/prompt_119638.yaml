          But note: the utility's contribution is also above the threshold? No, 4 ppm is below. So without the plant, the utility's 4 ppm is not harmful. Without the utility, the plant's 6 ppm is harmful. So only the plant is a cause? 

          Alternatively, if the harm is continuous (more solvent leads to more risk), then both are causes because both increased the risk.

