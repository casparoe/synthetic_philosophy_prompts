prompt: |-
  I run the exposure-investigation unit at a state health department — four of us, and we get two or three "cancer cluster near the plant" petitions a year, plus alot of smaller complaints, each one with a family attached and usually a lawyer on the other side. Right now we decide whether the exposure caused it by instinct, and we get accused of both rubber-stamping and crying wolf. I want a written proceedure we can actually run on a petition: the questions to ask in order, what counts as a good enough answer to each, where the process stops with a no, and where it goes to the director because it's a values call about how much evidence is enough rather than a fact we can settle.

  Build it out of the philosophy of causation, specifically the disagreement between the but-for / counterfactual line (X caused Y if Y wouldn't have happened without X) and the interventionist line (ask what would happen if you could intervene on X surgically, setting aside everything that normally travels with X). I want to know which of those two questions to reach for when, because they come apart on exactly the cases that land on my desk: two sources each of which was sufficient on its own; a factor that only mattered because it made things happen sooner; an exposure that made things worse only because somebody else had already switched off the thing that would have stopped it; and the ordinary case where the exposure is one factor among many and the real question is which factor to blame.

  Run it on three: (1) a cluster of a rare birth defect downstream of a plant with a documented release the year before and no other local source anyone can find; (2) a neighborhood where the water utility and an old industrial site both plausibly put the same solvent into wells, and the wells are contaminated; (3) a complaint where the exposure made an existing condition worse but the condition would have progressed anyway.

  And be blunt if this is a bad idea — if a checklist honestly can't do this, or if I'm quietly mashing together two different questions (did this exposure cause this person's illness, vs. does this exposure cause this illness in general), say so instead of handing me a tidy flowchart. Flag the steps that are judgment calls in a lab coat.
reasoning: |-
  We are building a procedure for evaluating cancer cluster petitions that incorporates both but-for (counterfactual) and interventionist views of causation. The procedure should be a checklist of questions, with clear stopping points and guidance on when to escalate to the director for a values call.

  Key challenges in the cases provided:
  - Two sources each sufficient on its own (overdetermination).
  - A factor that only made things happen sooner (preemption).
  - An exposure that made things worse only because a safety mechanism was off (preemption again?).
  - The ordinary case with multiple factors (contributory cause).

  We note that the two questions (but-for vs. interventionist) might yield different answers in these cases.

  The procedure must distinguish between two types of questions:
  1. Did this exposure cause this specific person's illness? (individual causation)
  2. Does this exposure cause this illness in general? (general causation)

  In public health investigations, we are often concerned with general causation (does the exposure cause the disease?) and then, if we can, attributing specific cases. However, in a cluster investigation, we are looking for evidence that the exposure caused the cluster (which is a set of specific cases). We might break it down into:
  - First, establish whether the exposure is capable of causing the disease (general causation).
  - Then, for the cluster, determine whether it is likely that the exposure caused these particular cases.

  But note: the petitions are about clusters, so we are not necessarily required to prove every single case, but to see if the cluster is caused by the exposure.

  The procedure:

  I. Preliminary Assessment (Screening)
     A. Is the disease in question known to be caused by the exposure (based on established science)? 
        - If no, stop (unless there is new compelling evidence, then escalate to director for consideration of novel causation).
        - If yes, proceed.

     B. Are there plausible alternative explanations for the cluster (e.g., random chance, known risk factors in the population)? 
        - Use statistical methods to see if the cluster is unlikely by chance (e.g., standardized incidence ratio, p-value). 
        - If the cluster is not statistically significant and there are strong alternative explanations, stop. 
        - If it is significant and the exposure is present, proceed.

     C. Is there a documented exposure pathway (e.g., release from the plant, contamination in the water) and are the affected individuals in that pathway? 
        - If no, stop. 
        - If yes, proceed.

  II. Causal Analysis
     We now consider the two causal frameworks.

     A. But-for (counterfactual) causation for the cluster:
        - Would this cluster have occurred without the exposure? 
          - If the answer is clearly no (e.g., without the exposure, the cluster would not have occurred because there are no other known causes in the area and the background rate is very low), then we have a strong case for causation by the exposure.

        - However, in cases of overdetermination (two sufficient causes) or preemption, the but-for test fails. For example:
            Case (2): two sources of solvent. If either source alone would have been sufficient to cause the contamination, then but-for either one the contamination would still have occurred (because of the other). So but-for neither source? We might need to consider the absence of both.

        - We can reframe: But-for the exposure, would this specific cluster have occurred in the way it did? (But note: we are not always able to know.)

     B. Interventionist causation:
        - If we could intervene to remove the exposure (surgically, without changing anything else), would the cluster have been prevented? 
          - This helps in overdetermination: if removing one source would not have prevented the contamination (because the other was sufficient), then that source is not a cause by interventionist view? Actually, no: the interventionist view might still say that the exposure is a cause if intervening on it changes the outcome. In the case of two sufficient causes, removing one does not change the outcome (since the other remains). So the interventionist might say that neither is a cause? That seems counterintuitive.

        - Alternatively, we can think of the intervention as setting the exposure to zero. If doing so would have prevented the cluster (or reduced the number of cases), then the exposure is a cause.

        - This view is more aligned with public health actions: if we can intervene to reduce the exposure and expect a reduction in disease, then the exposure is causal.

     Given the complexities, we might use both and then decide which framework is more appropriate for the situation.

     We propose a two-step causal analysis:

     Step 1: General Causation
        - Is the exposure known to cause the disease? (From toxicology, epidemiology, etc.)
          - If no, then we stop unless there is strong new evidence (then escalate to director).
          - If yes, proceed.

     Step 2: Specific Causation for the Cluster
        - We consider the cluster as a whole and ask:

          A. But-for the exposure, would the cluster have occurred?
            - We look for evidence that the exposure is necessary in the circumstances for the cluster to occur. This might require showing that without the exposure, the background rate would not have produced a cluster of this size.

          B. Interventionist: if we could have prevented the exposure, would the cluster have been prevented (or reduced in size)?
            - This is similar to but-for but allows for probabilistic causation and partial causes.

        - However, in the case of multiple causes, we might not be able to say the cluster wouldn't have occurred without the exposure, but we might be able to say that the exposure increased the risk and thus caused some of the cases.

  III. Handling Special Cases
     We design the procedure to flag these issues and provide guidance.

     Case 1: Two sources each sufficient (overdetermination)
        - In but-for: neither source passes the but-for test individually (because without one, the other would have caused the same). But together, we might say that without both, the contamination wouldn't have occurred? Or we might consider each as a cause because if we remove either, the outcome might be different (e.g., the level of contamination might be lower). However, if the level is already above the threshold for harm, then removing one might not change the outcome.

        - In interventionist: if we remove one source, does the contamination level drop below the harmful threshold? If yes, then that source is a cause. If not, then it isn't.

        - Therefore, for overdetermination, we need to know the dose-response and whether the individual source contributed enough to exceed the threshold.

     Case 2: A factor that only made things happen sooner (preemption)
        - But-for: without the exposure, the disease would have occurred later. So the exposure caused it to happen now, but not in the sense that it wouldn't have happened at all. In public health, we might still consider it a cause of the early occurrence.

        - Interventionist: if we remove the exposure, the disease would have occurred later. That might be considered a different outcome (in time) so we might say the exposure caused the early onset.

     Case 3: An exposure that made things worse only because a safety mechanism was off
        - But-for: without the exposure, the harm wouldn't have occurred (because the safety mechanism was off, the exposure caused the harm). So it passes but-for.

        - Interventionist: if we remove the exposure, the harm would not have occurred. So it passes.

     Case 4: Ordinary case with multiple factors
        - We are looking for the exposure to be a contributing factor. We might use the concept of "substantial factor" (if the exposure was a substantial factor in causing the disease, then it is a cause). This is a common legal standard.

        - Alternatively, we can use the probability of causation: did the exposure more than double the risk? (Then, more likely than not, it caused the disease.)

  IV. The Procedure Checklist

  We design a flowchart with questions and stopping points.

  Step 0: Document the petition (who, what, where, when, exposure, disease).

  Step 1: General Causation
     Q1: Is there established scientific evidence that the exposure can cause the disease? (E.g., IARC classification, EPA assessment, or multiple peer-reviewed studies.)
        - Yes: Proceed to Step 2.
        - No: 
            - Is there new and compelling evidence (e.g., a recent high-quality study) that suggests causation? 
               - Yes: Escalate to director (values call: whether to investigate a novel causal link).
               - No: Stop. (The exposure is not known to cause the disease.)

  Step 2: Exposure Assessment
     Q2: Is there evidence that the exposure occurred in the area of the cluster? (E.g., documented release, monitoring data.)
        - Yes: Proceed.
        - No: Stop. (Unless there is strong circumstantial evidence, then escalate to director.)

     Q3: Is there a plausible exposure pathway (e.g., air, water, soil) connecting the source to the affected individuals?
        - Yes: Proceed.
        - No: Stop.

     Q4: Is there evidence that the affected individuals were exposed at a level known to cause the disease? (Dose-response.)
        - Yes: Proceed to Step 3.
        - No: 
            - Is there evidence of exposure but at low levels? Then we need to consider if it could still contribute. This is a judgment call: escalate to director if there is uncertainty about the level of exposure and its significance.

  Step 3: Cluster Assessment
     Q5: Is the cluster statistically significant? (Use appropriate statistical tests for the observed vs. expected cases, accounting for confounding factors like age, sex, and known risk factors.)
        - Yes: Proceed.
        - No: 
            - Are there features of the cluster that suggest non-randomness (e.g., very rare disease, spatial-temporal pattern)? Then escalate to director (because even without statistical significance, a rare disease cluster might warrant investigation).
            - Otherwise, stop.

  Step 4: Causal Attribution
     We now consider the specific causal questions.

     Q6: But-for causation (for the cluster as a whole): 
          Without the exposure, would this cluster have occurred? (Consider: background rates, other known causes in the area, and the rarity of the disease.)
          - If the answer is clearly no (e.g., the background rate is very low and there are no other exposures), then the exposure is a cause. Proceed to Step 5 (Reporting).
          - If the answer is unclear or yes (the cluster might have occurred anyway), then we consider interventionist causation.

     Q7: Interventionist causation:
          If we could have intervened to eliminate the exposure, would the cluster have been prevented (or reduced in size) in a meaningful way?
          - If yes, then the exposure is a cause. Proceed to Step 5.
          - If no, then the exposure is not a cause. Stop.

     But note: in the case of multiple exposures, we might need to consider each one. We might also use the concept of "substantial factor": was the exposure a substantial factor in causing the cluster?

     Alternative for Q6 and Q7: We might ask both and then decide based on the type of case.

     We can have a decision tree for special cases:

        Case of two sufficient causes (overdetermination) as in example (2):
            - Check if the exposure from the plant was a necessary component of the sufficient cause? (Not necessarily.) 
            - Instead, we might ask: if we remove the plant's exposure, would the contamination levels still be above the harmful threshold?
                - If yes, then the plant's exposure is not a cause (by interventionist) because the removal wouldn't change the outcome.
                - If no, then it is a cause.

        Case of preemption (made things happen sooner): 
            - We might consider that the exposure caused the early onset. So we reframe the outcome: not just the disease, but the disease at this time. Then the but-for test: without the exposure, would the disease have occurred at this time? (No.) So it is a cause of the early onset.

        Case of making an existing condition worse (example 3):
            - But-for: without the exposure, would the condition have worsened to this degree at this time? 
            - Interventionist: if we remove the exposure, would the progression have been slower? Then the exposure caused the accelerated progression.

     Therefore, we might add:

     Q8: Is the exposure likely to have changed the timing or severity of the disease? (For individual cases in the cluster, but we can look for a pattern.)
          - If yes, then it is a cause of the worsened condition or early onset. Proceed to Step 5.
          - If no, then it is not a cause of the worsening. But note: if the disease would have occurred anyway, then the exposure did not cause the disease itself. We might still report that the exposure worsened the condition.

     However, for a cluster of new cases, we are usually looking at incidence, not progression. So for example (3), if the complaint is about a cluster of cases that are more severe, then we are looking at severity. But if it's about incidence, then the existing condition is not relevant (because they already had the condition). So we must be clear on the outcome.

     Therefore, we must define the outcome of interest: 
          - Is it the incidence of the disease? 
          - Or the progression of the disease? 

     This should be clarified at Step 0.

  Step 5: Reporting and Recommendations
     - If we have determined that the exposure caused the cluster (or contributed to it), we then write a report and recommend actions (e.g., further monitoring, cleanup, public notification).
     - We also consider whether the evidence is strong enough to justify regulatory action.

  V. Running the Examples

  Example 1: Cluster of rare birth defect downstream of a plant with a documented release and no other local source.

     Step 1: General causation? Assume the chemical is known to cause birth defects. Yes.
     Step 2: Exposure? Documented release and pathway (water or air). Affected individuals in the pathway. Assume exposure level is sufficient. Proceed.
     Step 3: Cluster? Rare defect, so even a few cases might be significant. Assume statistically significant. Proceed.
     Step 4: 
          But-for: without the release, would this cluster have occurred? Probably not (no other source). So cause.
          Interventionist: if we had prevented the release, the cluster would not have occurred. Cause.
          Proceed to Step 5.

  Example 2: Neighborhood with two sources of the same solvent.

     Step 1: General causation? Solvent known to cause the disease (say cancer). Yes.
     Step 2: Exposure? Both sources are present and both have contaminated the wells. So exposure is present. But what level? We need to know the combined level and the individual contributions.
          Q4: Is the level from each source alone above the harmful threshold? 
              - If the plant's contribution alone is above the threshold, then even without the utility, the exposure would be harmful. Similarly for the utility.
              - But if each alone is below the threshold, then together they are above. Then both are necessary.

          We might not have the data. So we escalate to director: we cannot determine without more data? Or we say both are causes because together they caused the harm.

          Alternatively, we can use interventionist: 
              - If we remove the plant, what happens? If the level drops below threshold, then the plant is a cause. Similarly for the utility.

          Without more data, we might not be able to decide. We might need to model the contributions.

          So in the procedure, we would flag this as requiring more data and then escalate to director if we can't get it.

          Let's assume we have data: 
              - The plant contributes 50% of the solvent, the utility 50%. The threshold for harm is 40% of the current level. Then each alone would be above threshold? No, each alone would be 50% of the current level? Actually, we need absolute levels.

