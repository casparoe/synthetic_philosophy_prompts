answer: |-
  ## Seminar Case: The Resource Allocation Dilemma (Ward 7B)

  **Scenario:**  
  Ward 7B houses two long-term patients requiring constant pain management. **Sarah** experiences chronic, moderate pain. Standard pain relief (1 unit of analgesic) reduces her suffering significantly, granting her a "good day" (adding +10 utility). Giving her a second unit provides minimal extra relief (+1 utility). **David** has an unusual, but entirely physical, neurological condition affecting his pain perception and emotional response. For David, the *first* unit of analgesic provides only slight relief (+2 utility – a 'bad day' becomes 'very difficult'). Crucially, however, **each subsequent unit David receives yields dramatically increasing returns** due to a complex cascade effect in his nervous system. A *second* unit grants major relief (+15 utility), a *third* unit brings near-comfort (+25 utility), and a *fourth* unit achieves complete, euphoric relief (+50 utility). The ward has only **4 units** of analgesic available today. The nurse must decide how to allocate them between Sarah and David. Everything about their conditions, needs, and the drug's effect is known and measurable. The *only* variable is the severity of David's underlying neurological quirk, which dictates the steepness of his utility curve from the drug.

  **Analysis of Theories:**

  1.  **Classical Total Utilitarianism:** Focuses purely on maximising the sum total utility. Allocating all 4 units to David yields: Sarah (0) + David (2+15+25+50) = **+92 utility**. Allocating 2 to Sarah and 2 to David yields: Sarah (10+1) + David (2+15) = **+28 utility**. Allocating 3 to Sarah and 1 to David: Sarah (10+1+1) + David (2) = **+14 utility**. Allocating all 4 to Sarah is impossible as she plateaus after 2 units. **Verdict:** Give all 4 units to David. The massive total gain he achieves dwarfs Sarah's potential gains.
  2.  **Average Utilitarianism:** Focuses on maximising utility per person. Allocating all 4 to David: Average = 92 / 2 = **46 utility/person**. Allocating 2 to Sarah and 2 to David: Average = 28 / 2 = **14 utility/person**. Allocating 3 to Sarah and 1 to David: Average = 14 / 2 = **7 utility/person**. **Verdict:** Give all 4 units to David. While this favours David immensely, the *average* utility is still highest because his enormous gain outweighs Sarah getting nothing in the calculation of the mean.
  3.  **Prioritarianism (with a focus on the worse-off):** Gives extra moral weight to benefits for those at a lower absolute welfare level. *Before any allocation today*, both are suffering, but David's baseline is arguably lower (gaining only +2 from first unit vs Sarah's +10). However, the key prioritarian move is that Sarah's *potential gain* from the first unit (+10, taking her from suffering to a good day) is morally more significant than David's *potential gain* from the third or fourth unit (taking him from moderate comfort to euphoria), *even if David's gain is numerically larger*. Prioritising the worse-off (Sarah, in terms of who benefits most from initial resources) or weighting her baseline suffering more heavily leads to rejecting giving David more than 1 or 2 units. **Verdict:** Give Sarah 2 units (meeting her core need for +11 utility) and David 2 units (giving him significant relief: +17 utility). Total utility (+28) is lower than the max, but Sarah's pressing need is met, and David still gets substantial help.

  **The Structural Feature:** The critical element is the **non-linear, radically increasing marginal utility** for David. His utility function is convex, while Sarah's is concave after the first unit. This steeply increasing return on investment for David is what creates the monster effect. If David's utility gains were *linear* (e.g., +10 per unit) or even moderately increasing, the total and average utilitarian verdicts would likely align with giving Sarah her effective dose (2 units) and David the remainder, converging towards the prioritarian view.

  **Strongest Utilitarian Reply (Defending TU/AU):** A committed utilitarian could argue this *isn't* a counterexample to utilitarianism per se, but highlights a feature of the real world utilitarianism correctly identifies: **resources should flow where they are most efficiently converted into welfare, irrespective of identity.** They might contend:
      *   **Fungibility:** If the "utility" is real and measurable (as stipulated), then David genuinely gains vastly more well-being per unit resource. Denying him the resource *because* he benefits so much more seems perverse and envious, deliberately choosing less overall/average good.
      *   **Scarcity is Key:** The dilemma only arises because resources are scarce (only 4 units). If resources were abundant, both could be satisfied. Utilitarianism handles scarcity by directing resources to their highest-value use, which in this case is David. Calling him a "monster" is just emotive labelling for someone whose physiology makes resource allocation extremely efficient regarding welfare gains.
      *   **Prioritarianism's Arbitrariness:** They might challenge prioritarianism's weighting scheme as subjective and lacking the objective measurability of total or average utility. Why *should* Sarah's initial gain be prioritised over David's larger later gains, if welfare is the ultimate currency?

  This case cleanly isolates the impact of non-linear utility functions under scarcity, forcing a clash between pure aggregation (TU), per-capita aggregation (AU), and distribution-sensitive weighting (Prioritarianism) when faced with radically increasing marginal utility.
