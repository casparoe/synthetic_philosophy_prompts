  ### Final Examination Question: Safe Pareto Improvements in Delegated Game Playing

  **Instructions:** Answer all three parts. Justify your answers with explicit payoff calculations and clear reasoning. The prisoner's dilemma payoff structure is:  
  - Mutual cooperation (C, C): (3, 3)  
  - Row cooperates, Column defects (C, D): (0, 5)  
  - Row defects, Column cooperates (D, C): (5, 0)  
  - Mutual defection (D, D): (1, 1)  

  Row delegates their move to a program. The **default program** \(d\) outputs D regardless of Column’s program. The **candidate program** \(p\) outputs C if and only if Column’s program (when run against \(p\)) outputs C.  

  A **safe Pareto improvement (SPI)** is defined as follows:  
  \(p\) is an SPI over \(d\) relative to a set \(Q\) of Column’s programs if:  
  (a) For every \(q \in Q\), the payoff pair \((R_p, C_p)\) from \((p, q)\) weakly Pareto-dominates the payoff pair \((R_d, C_d)\) from \((d, q)\) (i.e., \(R_p \geq R_d\) and \(C_p \geq C_d\)).  
  (b) For at least one \(q \in Q\), \((R_p, C_p)\) strictly Pareto-dominates \((R_d, C_d)\) (i.e., \(R_p > R_d\) or \(C_p > C_d\), with neither worse).  

  ---

  **Part 1 (8 marks)**  
  Let \(Q_1 = \{\)`coop`, `defect`, `mirror`\(\}\), where:  
  - `coop` always outputs C.  
  - `defect` always outputs D.  
  - `mirror` outputs whatever the other program outputs (e.g., if the other outputs C, `mirror` outputs C).  

  For each \(q \in Q_1\), compute the payoff pairs for \((d, q)\) and \((p, q)\). Is \(p\) an SPI over \(d\) relative to \(Q_1\)? Justify.  

  **Part 2 (8 marks)**  
  Now let \(Q_2\) be the set of **all possible programs**. Is \(p\) an SPI over \(d\) relative to \(Q_2\)? Either:  
  - Exhibit a specific \(q \in Q_2\) that violates condition (a) and explain, or  
  - Argue that no such \(q\) exists.  

  **Part 3 (4 marks)**  
  Consider a **weaker definition**: \(p\) is a *weak SPI* over \(d\) relative to \(Q\) if:  
  (i) For every \(q \in Q\), \((p, q)\) weakly Pareto-dominates (1, 1).  
  (ii) For at least one \(q \in Q\), \((p, q)\) strictly Pareto-dominates (1, 1).  

  Explain what the original SPI definition captures that this weaker definition misses, and why the opponent-relative comparison (i.e., \((p,q)\) vs. \((d,q)\) for each \(q\)) is central to the motivation for SPI.  

  ---

  ### Model Answer (≈700 words)  
  **Part 1: Analysis for \(Q_1 = \{\)`coop`, `defect`, `mirror`\(\}\)**  
  We compute payoffs for each \(q\):  

  - **Against `coop`:**  
    - \((d, \text{`coop`})\): \(d\) outputs D, `coop` outputs C → (5, 0).  
    - \((p, \text{`coop`})\): `coop` outputs C against any program. Thus, \(p\) (seeing C) outputs C → (3, 3).  
    - Comparison: (3, 3) vs. (5, 0). Row gets 3 < 5, so (3, 3) does **not** weakly dominate (5, 0) (Row is worse off).  

  - **Against `defect`:**  
    - \((d, \text{`defect`})\): Both output D → (1, 1).  
    - \((p, \text{`defect`})\): `defect` outputs D against \(p\). Thus, \(p\) outputs D → (1, 1).  
    - Comparison: (1, 1) vs. (1, 1) → weakly dominates (equal).  

  - **Against `mirror`:**  
    - \((d, \text{`mirror`})\): \(d\) outputs D, so `mirror` outputs D → (1, 1).  
    - \((p, \text{`mirror`})\): \(p\) and `mirror` mutually reference each other. If \(p\) outputs C, `mirror` (copying \(p\)) outputs C, satisfying \(p\)’s condition → consistent (C, C) → (3, 3).  
    - Comparison: (3, 3) vs. (1, 1) → strictly dominates.  

  **Conclusion for Part 1:**  
  \(p\) is **not** an SPI over \(d\) relative to \(Q_1\). Condition (a) fails for \(q = \text{`coop`}\) because (3, 3) does not weakly dominate (5, 0) (Row’s payoff decreases from 5 to 3).  

  ---

  **Part 2: Analysis for \(Q_2 =\) all possible programs**  
  \(p\) is **not** an SPI over \(d\) relative to \(Q_2\). We exhibit a counterexample \(q = \text{`coop`}\) (which is in \(Q_2\)):  
  - As in Part 1, \((d, \text{`coop`}) = (5, 0)\) and \((p, \text{`coop`}) = (3, 3)\).  
  - (3, 3) does not weakly dominate (5, 0) because Row’s payoff drops from 5 to 3, violating condition (a).  

  **Dependency on \(Q\):** The SPI concept relies critically on how \(Q\) (plausible opponents) is defined. For \(Q_1\) and \(Q_2\), `coop` causes \(p\) to fail SPI, but if \(Q\) excluded `coop` (e.g., \(Q = \{\text{`defect`}, \text{`mirror`}\}\)), \(p\) would be an SPI.  

  ---

  **Part 3: Weak SPI vs. original SPI**  
  The weaker definition misses two key aspects:  
  1. **Opportunity cost for Row:** The default \(d\) can yield outcomes better for Row than (1, 1) (e.g., (5, 0) against `coop`). The weaker definition only requires \(p\) to avoid outcomes below (1, 1), but does not require \(p\) to preserve Row’s *best-case gains* under \(d\). For example:  
     - Against `coop`, \(p\) yields (3, 3), which dominates (1,1) but fails to dominate (5,0) from \(d\). Row loses by switching to \(p\).  
  2. **Safety against per-opponent losses:** The original SPI ensures \(p\) is never worse than \(d\) against **any** \(q \in Q\). The weaker definition only checks outcomes against (1,1), ignoring how \(d\) performs against specific opponents.  

  **Motivation for opponent-relative comparison:**  
  The core goal of SPI is to make delegation **safe**—Row should switch to \(p\) only if it guarantees no losses (and some gains) against every plausible opponent. The weaker definition allows losses against opponents where \(d\) excels (e.g., `coop`), making it inadequate for "safe" delegation. SPI’s strength lies in conditioning improvement on the *default’s performance per opponent*, not just beating mutual defection.  

