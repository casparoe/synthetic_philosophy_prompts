  The user has two novel experimental ideas they want incorporated: 1) A "no victim/no audience" scenario testing private ritual violation in WEIRD vs. ancestral-culture groups, and 2) A design disentangling disgust from harm in wrongness judgments. Both need predictions and potential concession triggers.

