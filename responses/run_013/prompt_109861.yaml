  Finally, I'll analyze the semantic minefield around "objectivity" and note that while data can constrain positions, core metaethical disagreements may remain philosophical. The experimental designs could force refinement but likely won't settle the ultimate nature of morality.

  The tone should maintain scientific rigor while subtly highlighting how both sides might be talking past each other - especially on definitions. I'll keep it citation-free as requested, focusing on argument structure.
answer: |-
  Here’s the joint statement your sources *should* have written, focusing on shared ground, clear disagreements, testable cruxes, and your novel scenarios. It forces them to confront methodological limits, define terms, and isolate empirical levers.

  **Joint Statement: Points of Agreement**

  1.  **Methodological Limits:** Both self-report surveys (psychology) and ethnographic fieldwork (anthropology) are susceptible to artifacts. Surveys risk imposing WEIRD categories; fieldwork risks over-interpreting uniqueness or missing latent patterns. Neither method alone is definitive.
  2.  **Variation Exists:** Cross-cultural and intra-cultural variation in *specific moral rules, prohibitions, and practices* is extensive and well-documented (e.g., food taboos, familial obligations, property norms, sexual practices).
  3.  **WEIRD Problem is Real:** Over-reliance on Western, Educated, Industrialized, Rich, Democratic populations severely limits generalizability. Findings from these groups cannot be assumed universal without cross-validation in diverse, especially small-scale, societies.
  4.  **Harm & Fairness are Widespread Concerns:** Concepts related to avoiding harm (physical, psychological) and promoting fairness/reciprocity appear frequently across cultures as justifications for rules or judgments of wrongness. Their specific *application* varies significantly.
  5.  **Defining "Superficial" vs. "Deep" Variation:**
      *   **Superficial/Cosmetic:** Variation in the *specific objects, actions, or contexts* governed by a shared underlying principle or psychological mechanism (e.g., *which* animals are taboo vs. the existence of *some* purity/sanctity concerns; *how* fairness is calculated vs. the salience of unfairness).
      *   **Deep/Fundamental:** Variation in the *core principles, foundational values, or psychological mechanisms* themselves constituting the moral domain (e.g., whether "purity without harm" is genuinely moral; whether obligations to ancestors are distinct from social contracts; whether impartiality is a universal ideal or a WEIRD peculiarity).
  6.  **"Begging the Question" Acknowledgement:** We agree that both sides risk presupposing their conclusions: Universalists may impose their framework when interpreting variation; Relativists may assume variation precludes shared structure.

  **Table of Persistent Disagreements (Neutrally Worded)**

  | Disagreement Point                                                                 | Universalist Position (Agrees wording is fair)                                                                                             | Relativist Position (Agrees wording is fair)                                                                                                 |
  | :--------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------- |
  | **The Nature of Moral Foundations**                                                | Variation occurs primarily at the level of culturally shaped inputs/outputs activating a small set of universal, innate moral foundations. | The very foundations of morality (what counts as a moral concern, the relative weight of different concerns) are culturally constructed.      |
  | **Scope of the Moral Domain**                                                      | The moral domain universally encompasses concerns beyond harm and fairness (e.g., loyalty, authority, purity) as distinct, deep structures. | Concerns like loyalty, authority, and purity are either extensions of harm/fairness, entirely culturally contingent, or not inherently moral at all. |
  | **Explanatory Primacy**                                                            | Deep psychological structures (e.g., innate intuitions, evolved modules) best explain the shared contours and constrained variation of morality. | Cultural practices, historical trajectories, and social learning best explain the fundamental differences and local coherence of moral systems. |
  | **Potential for Objectivity**                                                      | The existence of deep, shared structures provides a basis for objective moral truth claims that transcend specific cultures.                 | The fundamental cultural variation demonstrates that morality is inherently local and negotiated; claims of objectivity are projections of local norms. |

  **Cruxes: Testable Sub-Questions & Predictions**

  1.  **Crux: Does "No Victim, No Audience, No Harm" Private Action Elicit Moral Condemnation?**
      *   **Case:** Vignette: "A person, entirely alone and unseen, destroys a cherished, irreplaceable keepsake belonging to a deceased close family member. They feel no regret. No one is physically harmed, no promise is broken, no one else's plans are affected." Tested in WEIRD populations and a small-scale society with strong ancestor veneration.
      *   **Universalist Prediction:** WEIRD: Minimal moral condemnation (perhaps seen as strange, sad, impious, but not *morally wrong*). Ancestral Culture: Strong condemnation driven by perceived *harm* to ancestor spirits, violation of *duty/loyalty*, or *purity* violation – all mapping to universal foundations. *Concession Trigger:* If strong condemnation emerges in the ancestral culture *and* participants explicitly reject harm/spirit concepts, framing it only as a violation of tradition/respect with no deeper principle.
      *   **Relativist Prediction:** WEIRD: Minimal condemnation (confirms morality tied to harm/rights). Ancestral Culture: Strong condemnation framed as a fundamental *moral* violation of sacred duty/respect, *irreducible* to harm or fairness. *Concession Trigger:* If condemnation in the ancestral culture is weak or framed solely in terms of personal grief or cultural faux pas, not moral wrongness.

  2.  **Crux: Is Perceived Wrongness Driven Primarily by Disgust or by Harm, and Are They Distinct?**
      *   **Case:** Design: Present two violations. **Violation A (Disgusting/Harmless):** Consuming a culturally neutral but intensely disgusting substance (e.g., sterilized cockroach smoothie) privately. **Violation B (Harmful/Not Disgusting):** Making a small, anonymous, untraceable donation to a charity known to be highly inefficient (wasting money, thus causing net *harm* by misallocating resources). Measure perceived moral wrongness, disgust, and perceived harm. Test cross-culturally.
      *   **Universalist Prediction:** Wrongness for Violation A (Disgust) will be weaker and more culturally variable than for Violation B (Harm). Harm judgments will correlate more strongly with wrongness ratings than disgust across cultures. Disgust may be a cue for impurity, but harm drives core wrongness. *Concession Trigger:* If Violation A consistently evokes *strong* moral wrongness *independent* of perceived harm and *across diverse cultures*, especially if harm ratings for B don't strongly predict its wrongness.
      *   **Relativist Prediction:** Wrongness for Violation A will be significant in cultures with strong purity norms, potentially rivaling wrongness for Violation B. Disgust and harm will show independent contributions to wrongness, and their relative weight will vary culturally. Harm isn't the sole driver. *Concession Trigger:* If Violation A universally evokes minimal moral wrongness *despite* high disgust, and wrongness for Violation B is universally high and strongly tied to harm perception, across diverse samples.

  3.  **Crux: Is "Purity Without Harm" Universally Within the Moral Domain?**
      *   **Case:** Builds on Crux 2 (Violation A). Key question: Do participants explicitly judge the disgusting but harmless act as a *moral* violation ("This is morally wrong") vs. merely distasteful, impolite, or non-moral ("This is gross but not immoral")? Test across cultures with varying purity norms.
      *   **Universalist Prediction:** In cultures where purity is salient, a significant portion *will* categorize it as moral, reflecting the purity foundation. *Concession Trigger:* If categorization as "moral" for harmless purity violations shows *no* cultural patterning and is consistently low *even* in cultures with strong ritual purity practices.
      *   **Relativist Prediction:** Categorization as "moral" will be highly culturally specific and tied to explicit theological or cultural doctrines, not a universal intuition. *Concession Trigger:* If categorization as "moral" for harmless purity violations emerges consistently across highly diverse cultures *without* explicit doctrines linking the specific act to harm or community well-being.

  **The Verbal Smell Test: "Objective" and the Limits of Data**

  You're right. A significant chunk of the heat stems from equivocation on "objective":

  1.  **Mind-Independent?** (Does morality exist like physical laws, regardless of minds?) This is pure metaethics. *No empirical finding* can settle this. Data about universals might *inspire* realist theories, but variation doesn't *refute* them (a realist can say we perceive imperfectly). This part is a non-starter empirically.
  2.  **Universal?** (Are there features shared by all humans?) **This is empirical.** The cruxes above target this. Finding genuine universals (like harm avoidance as a *core* concern) supports this sense. Finding fundamental variation in the *content* or *structure* of core concerns undermines it.
  3.  **Non-Negotiable/Non-Arbitrary?** (Are some moral claims not merely preferences?) If "universal" is established, it lends weight to this (why would evolution/cognition generate non-negotiable intuitions unless they tracked something important?). However, universality doesn't *prove* non-arbitrariness (universal biases can be arbitrary). Variation makes "non-negotiable" harder to defend cross-culturally. Data constrains but doesn't settle this.
  4.  **Not Up to Anyone's Say-So?** (Can individuals or cultures be morally wrong?) If "universal" deep structures exist, this becomes plausible (a culture violating harm principle is wrong *by its own latent standards*). The relativist denies such standards exist externally. Data can't jump the is-ought gap here.

  **Conclusion:** The empirical fight is over **universality and the structure of moral cognition**. Your novel scenarios directly probe these. Data *can* resolve whether certain features (like harm aversion, or the moral status of harmless violations) are universal deep structures or culturally constructed. However, data **cannot** resolve the core metaethical question of whether morality is *mind-independent* ("objective" in the strongest sense). Your sources are likely conflating universality with mind-independence. Forcing them to define "objective" and focus on testable universality claims (via agreed-upon cruxes like your scenarios) is where progress lies. The joint statement forces this clarity.
