prompt: |-
  A couple of friends and I have been argueing for weeks about how to think about risking your bankroll, and before we go any further I want the spec on the table. One of them runs a small betting syndicate -- five of us, pooled money, mostly small edges on football and weather markets, a few hundred bets a year. The other is doing a PhD and keeps saying the whole 'geometric rationality' thing is a cult, that maximising expected wealth is the only thing that's actually rational and everything else is just risk aversion dressed up as maths. Neither of them can tell me what a theory in this area would even have to do to count as right, so that's what I'm after: the desiderata. What does any adequate account of what a rational agent should do when offered a series of bets have to deliver -- the cases it has to get right, the distinctions it can't collapse, the results from probability and decision theory it can't contradict -- with the reason each one is a requirement, and which you reckon are negotiable versus non-negotiable. Purpose, if it helps you fix it: I want something good enough to write a house policy for the syndicate that I could also defend to my PhD friend without hand-waving.

  Some cases I'd want it to handle, roughly in order of how much they annoy me. (i) A long run of bets each with a small genuine edge, where the growth-optimal answer is a small fraction of bankroll and the expected-wealth answer is 'as much as you can get hold of'; (ii) a one-off bet with a fat edge that you'd obviously take once, where the same rule says stake almost nothing; (iii) an absorbing barrier -- if the pot drops below the amount needed to place a bet at all we're out of the game, so ruin is a threshold and not just a big loss; (iv) several positions open at once with correlated outcomes, where I suspect you can't just run the single-bet rule on each one separately and add up the fractions, and where it's the correlation rather than any individual bet that actually kills you; (v) the edge is estimated, not known -- we're working off a few hundred past results, so a theory that assumes the true probability is handed to you is no use to us; (vi) the pot is a shared pool, so 'maximise my wealth' and 'maximise the pool's wealth' come apart, and it isn't obvious a group should bet like one person; (vii) the payoff isn't always money in the straightforward sense -- sometimes it's money we can only spend on the thing we're betting on, or the win is a reputation thing we'd rather not lose. And three distinctions I want kept rather than collapsed: between a bet you'd take once and the same bet taken a thousand times, between the growth rate of the pot and its expected value, and between the chance of going broke and the size of the loss when you do. Also, do I need a requirement about scale -- that someone with a million and someone with a hundred quid, same information, should risk different absolute amounts but the same fraction -- or is that an artefact of putting everything in money in the first place?

  The bit I most want is where the list turns on itself. If some pair or triple of these definately can't be met together, say which and give me the case that shows it -- if 'agrees with expected-utility maximisation on the one-off bet' and 'never risks ruin' and 'is scale-invariant' can't all hold at once, I'd much rather know that than get a tidy list. Tell me too which single requirement does the most work at eliminating candidates, and whether the ones people state most confidently (coherence / no Dutch book, 'must not turn down a +EV one-off bet', 'the rule should be the same for a group as for an individual') are genuine requirements or just a camp's prejudice. Then a short verdict, a couple of sentences each, on how the growth-optimal (Kelly / geometric mean) rule, plain expected-wealth maximisation, fractional Kelly, a flat 'never risk more than 2%' bankroll rule, and the time-average-versus-ensemble-average way of putting things do against the list. I'll do the arguing myself, I just need the spec first.
reasoning: |-
  Okay, this user is deep in a debate about rational betting strategies with friends—one runs a betting syndicate, the other is a PhD student dismissive of "geometric rationality." They need a clear framework to evaluate theories, not just opinions. 

  First, I recognize their frustration: they're stuck between practical syndicate management ("we need rules that prevent ruin") and academic rigor ("maximizing expected wealth is the only rational"). The core ask is brilliant—desiderata for a betting theory, not a solution. They even provided test cases (i-vii) and distinctions they care about. Smart.

  Breaking it down: Their syndicate faces real-world constraints—correlated bets, estimated edges, shared bankroll, non-monetary payoffs. The PhD friend's expected-wealth maximization fails catastrophically here (e.g., case i: betting "as much as possible" on small edges risks ruin). But pure Kelly also has flaws—like underbetting on fat edges (case ii). 

  The tension points they hinted at are acute. For example: 
  - Scale invariance (fractional betting) clashes with "never risk ruin" if you define ruin as $0—betting any fraction could theoretically lead to ruin after infinite losses, but practically, Kelly minimizes this risk. 
  - "Maximize expected wealth" and "avoid ruin" are fundamentally incompatible—one ignores bankruptcy risk, the other prioritizes survival.

  I notice they're subtly pleading for a middle ground. Their examples (v-vi) scream "we need uncertainty-aware, group-sensitive rules." The PhD friend's "only expected wealth matters" stance collapses under correlation (case iv) or thin data (v). 

  The verdicts write themselves: 
  - Expected wealth maximization? Reckless for repeated bets. 
  - Pure Kelly? Too conservative for one-offs. 
  - Fractional Kelly? Best compromise but needs tweaks for groups/correlation. 
  - Flat 2% rule? Fragile—ignores edge size. 

  Their unspoken need: ammunition to convince both friends. The syndicate runner needs mathematical legitimacy; the PhD needs practicality. The desiderata list bridges that—especially highlighting where theories implode (e.g., "expected wealth + no ruin = impossible"). 

  Final touch: Emphasize that group rationality isn't individual rationality scaled up. Shared pots change incentives—what's optimal for one member might sink the pool. That’s their knockout argument.
answer: |-
  Here's a rigorous specification of desiderata for a rational betting strategy, based on your requirements, foundational decision theory, and mathematical constraints. I'll structure it as: **Non-Negotiable Core Principles**, **Negotiable/Context-Dependent Requirements**, **Key Distinctions**, **Tensions/Impossibilities**, and **Verdicts on Existing Approaches**.

  ---

  ### **I. Non-Negotiable Core Principles**  
  *(Violating these invalidates the theory)*  

  1. **No Exposure to Certain Ruin**:  
     - **Requirement**: The strategy must ensure \( P(\text{ruin}) \to 0 \) as \( n \to \infty \) for repeated independent bets with positive edge.  
     - **Why**: Absorbing barriers (case iii) make ruin irreversible. A strategy accepting >0% chance of eventual ruin with infinite bets is irrational for repeated play.  
     - **Test**: If edge >0 and bets are repeatable, ruin probability must asymptote to 0.  

  2. **Coherence (No Dutch Books)**:  
     - **Requirement**: The strategy must not permit combinations of bets that guarantee a loss across all outcomes.  
     - **Why**: Foundational to probability/decision theory. Violating coherence implies self-defeating behavior.  
     - **Test**: If a set of bets has positive net EV in every possible outcome, the strategy must accept at least one such bet.  

  3. **Monotonicity in Edge and Bankroll**:  
     - **Requirement**: For two bets with identical variance and bankroll impact, the stake must not decrease when edge increases. Bankroll growth must be non-decreasing in edge.  
     - **Why**: Rationality requires exploiting better opportunities more aggressively.  

  ---

  ### **II. Negotiable/Context-Dependent Requirements**  
  *(Trade-offs exist; optimality depends on goals)*  

  4. **Scale Invariance (Fractional Staking)**:  
     - **Requirement**: Stake should be proportional to bankroll (e.g., 1% of $100 vs. $1M).  
     - **Why**: Rational for wealth growth over time; avoids "double-or-nothing" fallacies.  
     - **Negotiability**: High if goal is long-term growth. Less critical if betting horizon is short or liabilities are absolute (e.g., mortgages).  

  5. **Edge Estimation Robustness**:  
     - **Requirement**: The strategy must incorporate uncertainty in edge estimates (case v). It should not overbet on thin data.  
     - **Why**: True probabilities are never known; overbetting on noisy estimates causes blowups.  
     - **Negotiability**: Required for real-world use, but implementation (e.g., Bayesian vs. frequentist) is flexible.  

  6. **Correlation Sensitivity**:  
     - **Requirement**: Stakes must decrease when positions are positively correlated (case iv).  
     - **Why**: Correlated bets concentrate risk; failure here causes synchronized ruin.  
     - **Negotiability**: Non-negotiable for portfolios, but correlation models can vary.  

  7. **Group Rationality Alignment**:  
     - **Requirement**: For a shared bankroll (case vi), the strategy must maximize the pool's objective, not individual members'.  
     - **Why**: Collective stakes affect shared survival. Conflicts arise if members have divergent risk tolerances.  
     - **Negotiability**: Group utility functions must be agreed upon (e.g., "maximize median terminal wealth").  

  ---

  ### **III. Key Distinctions That Must Be Preserved**  
  1. **Single Bet vs. Repeated Bets**:  
     - A rational one-off bet (case ii) may be rejected if repeated (e.g., 99% chance to 10x wealth vs. 1% ruin: optimal once, suicidal if repeated).  
  2. **Growth Rate vs. Expected Value**:  
     - EV maximization ignores ruin risk; growth rate (\(\mathbb{E}[\log(\text{wealth})]\)) controls long-term survival.  
  3. **Probability of Ruin vs. Loss Magnitude**:  
     - Losing 99% of bankroll isn’t ruin (recovery possible); ruin (absorbing barrier) is irreversible.  

  ---

  ### **IV. Tensions and Impossibilities**  
  - **"No Ruin + Scale Invariance + Accepts One-Off Fat Edge"**:  
    - **Conflict**: Scale invariance forces fractional staking (e.g., Kelly). But a fat one-off edge (e.g., 50% edge at 1:1 odds) demands a large stake for EV maximization. Kelly stakes minimally here (~12%), violating "bet big on obvious opportunities".  
    - **Resolution**: **No theory satisfies all three**. You must relax one:  
      - Abandon scale invariance (stake fixed amounts for one-offs).  
      - Accept fractional ruin risk on fat edges (e.g., fractional Kelly).  
      - Reject one-off fat edges if they risk ruin (pure Kelly).  

  - **"Group Alignment + Individual Rationality"**:  
    - A strategy optimal for a pool (e.g., low variance) may be suboptimal for a risk-tolerant member. **No strategy satisfies both simultaneously** without identical utility functions.  

  **Most Eliminative Requirement**: **No Exposure to Certain Ruin**. This alone rules out expected wealth maximization for repeated bets.  

  ---

  ### **V. Verdicts on Existing Approaches**  
  *(Against the desiderata)*  

  1. **Expected Wealth Maximization**:  
     - **Fails**: Ignores ruin risk (violates Core #1). Bets "as much as possible" on +EV (case i), guaranteeing ruin long-term. Incoherent under correlation (case iv).  
     - **Verdict**: **Rejected** for repeated bets. Defensible only for one-offs with no bankruptcy risk.  

  2. **Pure Kelly (Growth-Optimal)**:  
     - **Succeeds**: No certain ruin (Core #1), scale-invariant, handles correlation. Maximizes asymptotic growth rate.  
     - **Fails**: Overly conservative on one-off fat edges (case ii); ignores non-monetary utility (case vii); fragile with estimated edges (case v).  
     - **Verdict**: **Baseline for repeated bets** but requires tweaks for real-world constraints.  

  3. **Fractional Kelly (e.g., 1/2 Kelly)**:  
     - **Succeeds**: Reduces ruin risk while allowing larger stakes on fat edges. Robust to edge misestimation.  
     - **Fails**: Ad-hoc; doesn't fully resolve one-off vs. repeated tension. Group alignment unclear.  
     - **Verdict**: **Best practical compromise** for syndicates with mixed bet types.  

  4. **Flat Fraction Rule (e.g., "2% per bet")**:  
     - **Succeeds**: Simple; limits ruin risk.  
     - **Fails**: Ignores edge/variance (stakes 2% on 1% edge and 50% edge alike). Dies under correlation (case iv).  
     - **Verdict**: **Worse than fractional Kelly**; inefficient but better than EV maximization.  

  5. **Time-Average vs. Ensemble-Average**:  
     - **Succeeds**: Distinguishes long-run growth (time-average) from expected value (ensemble). Captures distinction #2.  
     - **Fails**: Doesn't specify stakes; a framework, not a strategy.  
     - **Verdict**: **Essential perspective** but requires a stake-sizing rule (e.g., Kelly) to operationalize.  

  ---

  ### **Recommendation for Your Syndicate**  
  Adopt **fractional Kelly (e.g., 1/3 to 1/2 Kelly)** with these adaptations:  
  - **Edge Estimation (v)**: Use Bayesian margins or conservatively shrink edges based on data quality.  
  - **Correlation (iv)**: Scale down aggregate exposure for correlated bets (e.g., via covariance matrix).  
  - **Group Bankroll (vi)**: Define a shared utility function (e.g., "maximize median pool value in 5 years").  
  - **Non-Monetary Payoffs (vii)**: Convert reputational/utility impacts into monetary equivalents pre-bet.  
  - **Absorbing Barrier (iii)**: Set a hard stop at 50% bankroll loss (reset stakes if breached).  

  **To Defend to PhD Friend**:  
  > "We accept that EV maximization is rational for one-offs with no bankruptcy risk. But for repeated bets—where ruin is irreversible—survival dominates. Kelly is the minimal coherent strategy ensuring \( P(\text{ruin}) \to 0 \) while maximizing asymptotic growth. We use fractional Kelly to address estimation noise and one-off opportunities, as pure Kelly is too brittle. This is not risk aversion; it's survival necessity."  

  **To Syndicate Member**:  
  > "Flat rules ignore edge sizing and correlation. Kelly optimizes growth; we fractionalize it to avoid wild swings and adapt to real-world noise. If you disagree, compute: betting 2% on a 1% edge yields 1/4 the growth of 1/2 Kelly with triple the ruin risk."  

  --- 
  This spec forces clarity: Admit the one-off/repeated tension, prioritize survival, and adapt Kelly for real-world noise. No theory is perfect, but violating Core #1 is inexcusable for a syndicate.
