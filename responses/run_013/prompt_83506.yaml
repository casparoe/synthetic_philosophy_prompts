answer: |-
  Here's a logical decision tree for your handout, focusing on *what the right is* and *who holds it*, using concrete cases to separate positions without relying on political labels. Hohfeldian incidents are explained in plain terms at relevant nodes. The tree ensures each named position (leaf) is distinct, and flags undefended combinations.

  ---

  ### **The Second Amendment: What Kind of Right Exists?**  
  *Start here → Answer each question with your intuitive judgment*  

  #### **Q1: Can an individual sue to block a city law banning handguns in homes?**  
  *(i.e., Does the 2A protect an individual right enforceable against local government?)*  
  - **YES** → Go to Q2.  
  - **NO** → Go to Q3.  

  ---

  #### **Q2: Can a state deny a concealed-carry permit to a law-abiding adult with no "special need" for self-defense?**  
  *(i.e., Is the right a "liberty" (government can't ban guns entirely) or a "claim-right" (government must facilitate access)?)*  
  - **Liberty (State can deny permits):** Government may regulate public carry heavily; the right is a baseline freedom from total bans. → Go to Q4.  
  - **Claim-right (State cannot deny permits):** Government must allow armed self-defense in public; the right imposes active duties on the state. → Go to Q5.  

  ---

  #### **Q3: Can Congress ban all firearm possession by nonviolent felons?**  
  *(i.e., Does the 2A limit federal power over individuals, or only protect states?)*  
  - **YES (No federal limit):** The 2A only restricts Congress from disarming state militias → **"State Militia Shield"** (e.g., *Cruikshank* era view).  
  - **NO (Federal limit exists):** The 2A protects a collective/state right against federal disarmament → **"Collective/State Right"** (e.g., *Presser* theory).  

  ---

  #### **Q4: Can Congress ban private possession of "assault weapons" (e.g., AR-15s)?**  
  *(i.e., Is the right's scope tied to its original purpose, or can it evolve?)*  
  - **YES (Ban allowed):** The right’s scope "floats free" of history; modern regulation adapts to new risks → **"Living Constitution: Broadly Regulable Right"** (e.g., Breyer-style balancing).  
  - **NO (Ban invalid):** The right’s scope is fixed by its 1791 purpose; "arms in common use" are protected → Go to Q5.  

  ---

  #### **Q5: Can a private militia stockpile military-grade arms to resist future federal tyranny?**  
  *(i.e., Is the ultimate purpose of the right personal safety or revolutionary deterrence?)*  
  - **YES (Stockpiling protected):** The right includes arming for potential revolution against tyranny → **"Individual-Right/Insurrectionist"** (e.g., radical originalism).  
  - **NO (Stockpiling not protected):** The right is for personal/communal defense, not overthrowing government → **"Individual-Right/Self-Defense"** (e.g., *Heller* majority).  

  ---

  #### **Q6 (If you answered NO to Q1 AND YES to Q3): Does the 2A have any modern legal force?**  
  *(i.e., Is it a dead letter?)*  
  - **YES (It limits government somehow):** → **"Militia-Centered Civic Republican"** (e.g., some academics: right exists only via organized militia service).  
  - **NO (It’s obsolete):** The 2A is irrelevant today; repeal or ignore it → **"Dead Letter/Repeal"** position.  

  ---

  ### **Resulting Positions & Notes**  
  1. **Individual-Right/Self-Defense** (Q1:Y → Q2:C-R → Q5:N)  
  2. **Individual-Right/Insurrectionist** (Q1:Y → Q2:L or C-R → Q5:Y)  
  3. **Collective/State Right** (Q1:N → Q3:N)  
  4. **Militia-Centered Civic Republican** (Q1:N → Q3:Y → Q6:Y)  
  5. **State Militia Shield** (Q1:N → Q3:Y)  
  6. **Living Constitution: Broadly Regulable Right** (Q1:Y → Q2:L → Q4:Y)  
  7. **Dead Letter/Repeal** (Q1:N → Q3:Y → Q6:N)  

  ---

  ### **Key Observations**  
  - **Undefended Combinations:**  
    - *"The 2A protects an individual right, but only for hunting/sport."*  
      - **Why empty?** Incoherent. The amendment’s text ("security of a free state") and history ignore recreational uses as a core justification.  
    - *"The right is an individual immunity (government can’t regulate guns at all)."*  
      - **Why empty?** Unattractive/unworkable. No mainstream scholar or court advocates absolute bans on all regulation.  
  - **Clarifications:**  
    - The tree separates all 7 positions. *Heller*-style self-defense (Position 1) and insurrectionism (Position 2) diverge at Q5 (tyranny hypothetical).  
    - "Living Constitution" (Position 6) emerges only under the "liberty" branch (Q2:L → Q4:Y), as it requires accepting broad state regulatory power.  
  - **Design Choices:**  
    - Omitted hunting/sport: Legally trivial; no serious theory treats it as the *core* of the 2A.  
    - Used "assault weapon ban" (Q4) to isolate scope/flexibility, as it forces confrontation with technological change.  
    - Q3 (felon ban) splits collective-right theories: "State Militia Shield" allows federal felon bans; "Collective/State Right" does not.  

  This fits on one page and uses concrete cases to reveal underlying principles. Participants won’t know the labels until the end!
