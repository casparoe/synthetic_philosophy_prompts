prompt: |-
  I direct provenance research at a mid-sized encyclopedic museum. My desk vets roughly forty acquisitions and loans a year and answers a growing number of restitution claims from families and from governments, and each one turns on a single question: is it established that this object came to its present owner the way that owner says it did? The grounds we actually have are always some mixture of documents and statements, the object itself, what follows from the object's features, and resemblance to objects whose history is documented. I have been reading my way into the Nyāya school of Indian epistemology, and I think its machinery has exactly the right shape for this problem. I want it turned into a procedure my junior researchers can run.

  Please write that procedure. Build it on the Nyāya account of warranted cognition: the four knowledge-sources the school recognises — perception, inference, analogy or comparison, and the testimony of a reliable speaker — treated as genuinely different grounds with different failure modes rather than as one scale of confidence; the conditions the tradition places on testimony, which turn on whether the speaker knows the matter and whether the speaker is moved to report it as it stands; the catalogue of faulty reasons, including the reason that holds equally of the cases where the claim fails, the reason that proves the opposite, the reason that merely restates the claim, the reason that is itself unproved, and the reason overturned by a stronger source of knowledge; and the school's insistence that a cognition is not presumed true, its warrant lying in the absence of defects in the conditions that produced it. I also want the five-step form the Nyāya logicians required of a sound inference — thesis, reason, the general rule together with an example, the application of the rule to this case, and the conclusion — used as the template in which any provenance assertion must be set out before we act on it, since the step our arguments habitually omit is the example.

  Keep the procedure to a page. The verdicts must be few and honest: it must be able to end in doubt rather than forcing a finding, and to state what would settle the doubt, because doubt is a result and not a weak conclusion. Run it on three cases: an object with a clean-looking chain of documents that all descend from a single dealer's stock book; an object whose only evidence is a family's recollection from the 1940s; and an object whose material and construction point one way while its export paperwork points another. One of these must come out against the museum.

  The researcher running this has no Sanskrit and no philosophy, half an afternoon, and nothing to consult; the acquisitions committee signs off on anything we take in. Mark the points where the procedure cannot decide and a person must, especially where the question stops being what we know and becomes what we owe. Tell me where this translation will misfire, and what Nyāya cannot do for us.
reasoning: |-
  We are going to design a procedure based on Nyāya epistemology for provenance research. The procedure will use the four knowledge sources: perception (pratyakṣa), inference (anumāna), analogy/upamāna, and testimony (śabda). Each has distinct failure modes. We also incorporate the five-step inference form (parārthānumāna) and the catalog of faulty reasons (hetvābhāsa). The goal is to evaluate whether the object came to its present owner as claimed.

  The procedure steps:

  1. **Gather the Grounds**: Collect all available evidence (documents, statements, physical examination of the object, comparisons with similar objects, etc.) and categorize them by the four knowledge sources.

  2. **Evaluate Testimony (Śabda)**: For each testimonial source (documents, oral accounts, etc.), check:
     - **Knowledge Condition**: Does the testifier have direct knowledge of the matter?
     - **Truthfulness Condition**: Is the testifier motivated to report truthfully? (Consider bias, incentives to lie, etc.)
     - If either condition fails, the testimony is unreliable.

  3. **Evaluate Perception (Pratyakṣa)**: For direct physical evidence (e.g., marks on the object, material analysis):
     - Is the perception clear and without defect? (e.g., not under poor lighting, not misinterpreted by the observer)

  4. **Evaluate Analogy/Comparison (Upamāna)**: For evidence from resemblance to other objects:
     - Is the comparison valid? (i.e., the similar object is well-documented and the points of resemblance are relevant to provenance)
     - Beware of superficial similarities.

  5. **Evaluate Inference (Anumāna)**: For reasoning from evidence to a conclusion, structure the inference in the five-step form:
     - Step 1: **Pratijñā** (Thesis): State the claim about provenance.
     - Step 2: **Hetu** (Reason): Provide the evidence or reason for the thesis.
     - Step 3: **Udāharaṇa** (Example and General Rule): State a general rule and an example that illustrates the rule. (e.g., "Objects from this dealer's stock book have been verified in the past, as with object X.")
     - Step 4: **Upanaya** (Application): Apply the rule to the current case. (e.g., "This object is from that dealer's stock book.")
     - Step 5: **Nigamana** (Conclusion): Restate the thesis as proven.
     - If any step is missing or flawed, the inference fails.

  6. **Check for Faulty Reasons (Hetvābhāsa)**:
     - **Savvyabhicāra** (Inconclusive reason): The reason may apply even when the claim is false (e.g., the dealer's stock book might have included stolen goods).
     - **Viruddha** (Contradictory reason): The reason actually supports the opposite claim.
     - **Satpratipakṣa** (Rebutted by a stronger reason): Another knowledge source contradicts the reason.
     - **Asiddha** (Unproved reason): The reason itself is not established.
     - **Bādhita** (Overturned by a stronger source): The reason is contradicted by perception or other direct evidence.

  7. **Synthesize and Conclude**:
     - Combine the evaluations from the four sources. A claim is warranted only if at least one source is defect-free and not overturned.
     - If there is a conflict, rank the sources: perception and testimony (when conditions are met) are strong; inference and analogy are weaker but can be corroborated.
     - If any knowledge source is defective, the claim is unwarranted.
     - If there is doubt, state the doubt and what evidence would resolve it.

  **Procedure Output**:
  The procedure must end in one of three verdicts:
  - **Proven**: The claim is established beyond doubt.
  - **Disproven**: The claim is refuted (e.g., by a stronger source).
  - **Doubt**: The evidence is insufficient. State what would settle the doubt.

  **Cases**:

  1. **Case A: Object with a clean chain of documents from a single dealer's stock book.**
     - Testimony: The documents are testimony. Check the dealer's knowledge and truthfulness.
       - If the dealer recorded the object in the stock book, they had knowledge. But were they truthful? If the dealer has a clean record, then condition holds. If there's evidence of dealing in looted art, then condition fails.
     - Inference: Use the five-step form.
       - Thesis: The object was acquired legally from the dealer.
       - Reason: The object is recorded in the dealer's stock book.
       - Rule: Objects recorded in this dealer's stock book are legally acquired (example: object X from the same book was verified).
       - Application: This object is in the book.
       - Conclusion: Therefore, it was legally acquired.
     - Check for faulty reasons: Is the reason inconclusive? (e.g., if the dealer sometimes handled stolen goods, then it's savyabhicāra). If the dealer's record is unblemished, then it's not inconclusive.
     - Verdict: If the dealer is reliable, Proven. If the dealer's record is tainted, Doubt or Disproven (if there's evidence this object was stolen).

  2. **Case B: Object with only a family's recollection from the 1940s.**
     - Testimony: The family's recollection. Check knowledge and truthfulness.
       - Knowledge: Were they present? How detailed is the recollection? (If vague, knowledge may be weak.)
       - Truthfulness: Do they have an interest in the outcome? (e.g., financial gain) If so, condition fails.
     - Without other sources, this is weak. Analogy: Does the object resemble family possessions? But without documentation, analogy is weak.
     - Inference: Formulate the thesis (the object was in the family in the 1940s). The reason is the recollection. But the rule? "Recollections from the 1940s are reliable" — but without an example, this fails. Also, memory is fallible.
     - Check faulty reasons: The reason (recollection) might be unproved (asiddha) because we cannot verify it. It might be inconclusive (savyabhicāra) because memories can be false even when the claim is true.
     - Verdict: Doubt. We need corroborating evidence (e.g., photographs, documents).

  3. **Case C: Object with material/construction pointing one way and export paperwork pointing another.**
     - Perception: Material analysis places the object in Region A at a certain time. But the export paperwork says it came from Region B at a different time.
     - Testimony: The export paperwork is testimony. Check the issuing authority's knowledge and truthfulness. If the authority is known to have issued false papers, then the testimony is unreliable.
     - Inference: Two conflicting inferences.
       - Inference 1 (from material): Thesis: The object is from Region A. Reason: Material matches Region A. Rule: Objects with this material are from Region A (example: verified objects from A have this material). Application: This object has it. Conclusion: It's from A.
       - Inference 2 (from paperwork): Thesis: The object is from Region B. Reason: Export paperwork. Rule: Export paperwork from this authority is reliable (example: past paperwork was verified). Application: This paperwork exists. Conclusion: It's from B.
     - Conflict: The two inferences contradict. Check which reason is faulty. If the material analysis is strong (perception) and the paperwork is testimony, then if the testimony is flawed (e.g., the authority is corrupt), then inference 2 fails. If the material analysis is not definitive (e.g., the material is found in both regions), then it's inconclusive (savyabhicāra).
     - Verdict: If the paperwork is from a corrupt source, then Disproven (against the paperwork). If the material is ambiguous, then Doubt. We need more evidence (e.g., more advanced material testing).

  **Where the Procedure Cannot Decide**:
  - When there is a conflict between knowledge sources and we cannot determine which is stronger.
  - When the testimony conditions are borderline (e.g., the testifier might have known but we can't be sure, or might have had a slight bias).
  - When the inference requires a general rule that is not established (e.g., about the reliability of a type of document without examples).

  **Where Nyāya Might Misfire**:
  - Nyāya does not account for modern scientific analysis (though we can treat it as perception or inference).
  - Nyāya does not handle statistical evidence well (e.g., carbon dating has a margin of error).
  - The focus on absence of defects in the conditions might be too strict for historical research where some gaps are inevitable.

  **What Nyāya Cannot Do**:
  - Nyāya does not address ethical obligations. Even if the provenance is not established, we might have moral duties (e.g., to return an object to a community that was wronged). This must be handled outside the procedure.

  **Procedure Summary**:

  **Step 1: Collect and Categorize Evidence**
     - List all evidence under perception, inference, analogy, testimony.

  **Step 2: Testimony Check**
     - For each testimonial piece: Check if the testifier knew the facts and was truthful. If not, discard.

  **Step 3: Perception Check**
     - Is the physical evidence clear and correctly interpreted? If not, discard.

  **Step 4: Analogy Check**
     - Is the comparison valid and relevant? If not, discard.

  **Step 5: Inference Construction**
     - For each claim, build the five-step inference. If any step is missing or flawed, the inference fails.

  **Step 6: Check for Faulty Reasons**
     - For each reason, check if it is inconclusive, contradictory, unproved, restating the claim, or overturned.

  **Step 7: Synthesis and Verdict**
     - If any source is defect-free and supports the claim, and there is no stronger source against it, then Proven.
     - If a source is defect-free and contradicts the claim, then Disproven.
     - Otherwise, Doubt. State what evidence is missing.

  **Verdicts**:
  - Proven: Act on the claim (e.g., acquire, return).
  - Disproven: Reject the claim (e.g., do not acquire, or if already held, investigate further).
  - Doubt: Do not act until the doubt is resolved. State the required evidence.

  **Case Outcomes**:
  - Case A: If the dealer is reliable, Proven. If not, Doubt or Disproven (if evidence of theft).
  - Case B: Doubt (needs corroboration).
  - Case C: If the paperwork is from a corrupt source and the material is strong, then the claim based on paperwork is Disproven. If both are uncertain, Doubt.

  We will now write the procedure in a form for junior researchers.
answer: |-
  ### Nyāya-Inspired Provenance Verification Procedure  
  **Purpose:** To determine whether an object's provenance claim (acquisition or loan) is warranted, using Nyāya epistemology. Warranted cognition requires defect-free grounds from one or more of four sources: **Perception** (direct observation), **Inference** (logical reasoning), **Comparison** (analogy), and **Testimony** (reliable reports). A claim is only accepted if supported by at least one *unimpaired* source. If doubt remains, state what evidence would resolve it.  

  ---

  #### **Step 1: Assemble the Grounds**  
  Categorize all evidence into Nyāya’s four knowledge sources:  
  - **Perception (Pratyakṣa)**: Physical traits (e.g., material, wear, inscriptions).  
  - **Inference (Anumāna)**: Deductions from evidence (e.g., style implies origin).  
  - **Comparison (Upamāna)**: Similarities to documented objects (e.g., matching a known collection).  
  - **Testimony (Śabda)**: Documents, oral accounts, or records.  

  *Note: Treat sources as distinct. Do not merge them into one "confidence score."*  

  #### **Step 2: Test Testimony for Defects**  
  For each testimonial source (e.g., a document, statement, or record):  
  - **Knowledge Condition**: Did the speaker/writer directly witness the event? (If not, reject.)  
  - **Truthfulness Condition**: Was the speaker/writer *unbiased and motivated to report accurately*? (If financial gain, coercion, or inconsistency exists, reject.)  
  - **If either condition fails, the testimony is invalid.**  

  #### **Step 3: Check for Faulty Reasoning**  
  Evaluate all inferences and testimonies for these defects:  
  - **Inconclusive Reason** (Savvyabhicāra): Evidence applies even when the claim is false (e.g., "Many objects from this dealer are clean, so this one is" ignores stolen items in their stock).  
  - **Contradictory Reason** (Viruddha): Evidence supports the *opposite* claim (e.g., paperwork says "exported in 1945," but the object has a 1950s trademark).  
  - **Unproved Reason** (Asiddha): The evidence itself is unverified (e.g., a document citing an unknown source).  
  - **Circular Reason** (Ātmāśraya): Restates the claim without proof (e.g., "It’s authentic because the owner says so").  
  - **Overturned Reason** (Bādhita): Contradicted by a stronger source (e.g., testimony conflicts with scientific analysis).  
  *If any defect is found, discard the reasoning.*  

  #### **Step 4: Structure Every Claim as a 5-Step Inference**  
  For any claim (e.g., "This object was legally acquired in 1930"), format it as:  
  1. **Thesis** (Pratijñā): State the claim.  
  2. **Reason** (Hetu): Provide evidence (e.g., "Dealer’s ledger lists it").  
  3. **Rule + Example** (Udāharaṇa): State a general rule *and* a verified case (e.g., "Ledgers from this dealer are reliable, as proven in Case X").  
  4. **Application** (Upanaya): Link rule to this case (e.g., "This object is in the ledger").  
  5. **Conclusion** (Nigamana): Restate the thesis.  
  ***Reject any claim missing Step 3 (Example).***  

  #### **Step 5: Synthesize and Rule**  
  - **Proven**: One source (perception, inference, comparison, testimony) is defect-free and not overturned.  
  - **Disproven**: A stronger source contradicts the claim (e.g., perception overturns testimony).  
  - **Doubt**: No source is defect-free, or sources conflict without resolution. State: "Unsettled due to [gap]. Would resolve if [evidence]."  
  *Do not force a verdict—doubt is valid.*  

  #### **Step 6: Ethical Boundary**  
  If the procedure ends in doubt or disproven, but moral obligations arise (e.g., potential harm, historical injustice), **pause**. Nyāya does not address ethics—escalate to senior staff.  

  ---

  ### **Case Applications**  
  **Case 1: Object with a dealer’s stock-book chain**  
  - *Thesis*: "Object acquired legally via dealer."  
  - *Testimony*: Documents descend from dealer’s ledger.  
    - Check: Did dealer witness acquisition? (Yes.) Was dealer truthful? (If ledger is unsullied, yes; if dealer handled looted art, no → defect.)  
  - *Inference*: Build 5-step:  
    1. Thesis: Legal acquisition.  
    2. Reason: Ledger entry.  
    3. Rule + Example: "Dealer’s ledgers are reliable; e.g., Object Y verified." (If no example, reject.)  
    4. Application: This object in ledger.  
    5. Conclusion: Legal.  
  - *Fault check*: If dealer handled stolen goods, reason is "inconclusive" (Savvyabhicāra).  
  - **Verdict**: If dealer reliable → Proven. If dealer corrupt → Doubt ("Resolve with proof ledger entries were vetted").  

  **Case 2: Object supported only by 1940s family recollection**  
  - *Testimony*: Family account.  
    - Check: Did they witness? (Yes.) Were they truthful? (If seeking restitution, bias possible → defect.)  
  - *Inference*: Build 5-step:  
    3. Rule + Example: "1940s recollections are reliable; e.g., Object Z verified by memory." (No example → reject.)  
  - *Fault check*: Recollection is "unproved" (Asiddha) without corroboration.  
  - **Verdict**: Doubt ("Resolve with photo/diary evidence").  

  **Case 3: Object with conflicting material analysis vs. export papers**  
  - *Perception*: Material/construction indicates Region A.  
  - *Testimony*: Export papers say Region B.  
    - Check: Did issuer know origin? (If customs officer, maybe.) Were they truthful? (If regime forged papers, no → defect.)  
  - *Inference (Material)*:  
    1. Thesis: From Region A.  
    2. Reason: Material traits.  
    3. Rule + Example: "This material is unique to A; e.g., Object P verified."  
    4. Application: This object has traits.  
    5. Conclusion: From A.  
  - *Inference (Papers)*:  
    3. Rule + Example: "Export papers from this era are reliable; e.g., Object Q verified." (If issuer corrupt, rule fails.)  
  - *Fault check*: If papers are forged, testimony is overturned (Bādhita) by perception. If material is ambiguous, reason "inconclusive."  
  - **Verdict**: If papers are defective → **Disproven** (against museum’s claim of lawful export). If material is ambiguous → Doubt ("Resolve with advanced testing").  

  ---

  ### **Where Nyāya Misfires**  
  - **Gaps in History**: Nyāya requires positive evidence. Gaps (e.g., lost records) create doubt but don’t disprove—this may clash with legal "balance of probabilities."  
  - **Scientific Uncertainty**: Nyāya treats perception as infallible, but tools like carbon dating have error margins. Flag as "potential defect" in perception.  
  - **Ambiguous Analogies**: Comparison relies on "resemblance," which is subjective. Junior staff may over/underweight similarities.  
  - **Ethical Blind Spot**: Nyāya evaluates truth, not justice. When provenance is doubtful but moral claims exist (e.g., colonial looting), the procedure stops—**human judgment must take over**.  

  **Output**: Proven → Act. Disproven → Reject claim. Doubt → Hold, specify evidence needed.  
  **Time**: 30–60 minutes per case after evidence gathering.
