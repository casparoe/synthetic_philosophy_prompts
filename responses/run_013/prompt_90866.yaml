  I need to create a document that helps both sides find common ground while clarifying their disagreements. The user wants this structured as an adversarial collaboration with specific sections: agreed claims, a disagreements table, and cruxes with concrete cases. They've also suggested two potential cruxes about whether "affected" is determinate enough and whether coercion is binary or gradational.

  First, I should identify areas of agreement. Both sides likely agree that legitimacy requires some form of consent or justification to those governed, that boundaries are necessary for any functioning democracy, and that perfect inclusion is impossible. They probably also agree that coercion is a key feature of state power. 

  For the disagreements table, I need to frame each side's position in language they'd accept. The core disagreements seem to be about what fundamentally constitutes membership (coercion vs affected interests), how to determine the relevant constituency for decisions (predetermined vs decision-relative), and whether coercion is binary or gradational. I should check if any disagreements are merely verbal - perhaps about how they define "legitimacy" or "demos."

  For the cruxes, I'll use concrete cases: 
  - A secession referendum (does only the region vote or the whole country?)
