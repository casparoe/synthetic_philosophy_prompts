  - Climate policy with global effects
  - Immigration policy

  For each crux, I'll outline what both sides would predict about these cases. The secession case tests coercion vs affected interests directly. The rezoning case examines whether physical presence matters more than impact. Climate policy challenges the subjection view with its global effects. Immigration policy probes whether coercion applies to non-residents.

  The most load-bearing crux seems to be whether coercion can be decoupled from territorial presence - if the affected-interests side can show coercion applies beyond borders, it undermines the subjection view's foundation. I'll mark this as the key crux in the final answer.

  I'll structure this clearly with numbered sections, keep the language accessible (no jargon), and maintain a neutral, collaborative tone throughout. The document should help them move beyond circular arguments by focusing on testable differences through concrete cases.
answer: |-
  Here's the adversarial collaboration document you requested - designed to clarify agreements, pinpoint genuine disagreements without strawmen, and surface testable cruxes using concrete cases.

  **Agreed Claims (What Both Camps Can Sign Onto):**

  1.  **Legitimacy Requires Justification:** A democratic decision is only legitimate if it can be justified *to* those it governs/binds in a way they could reasonably accept, even if they disagree with the outcome.
  2.  **Boundaries Are Necessary:** A functioning democratic procedure *requires* a defined constituency (the demos) to operate. There cannot be a vote without knowing who votes.
  3.  **The Boundary Problem is Real:** Defining the initial demos *is* circular ("who decides who decides?"), and there's no perfectly neutral, non-circular, purely "democratic" way to bootstrap the first demos from a state of nature.
  4.  **Coercion Matters:** The state's unique power to make and enforce binding, coercive laws is a central feature of why democracy is needed.
  5.  **Impact Matters:** Democratic decisions *do* affect people's interests, and considering those effects is important for legitimacy and justice.
  6.  **Perfect Inclusion is Impossible:** No practical demos can perfectly include every single person potentially affected by every decision; some line-drawing is inevitable.
  7.  **The Demos Isn't Always Fixed:** While the *core* demos might be stable, the relevant constituency *for specific decisions* might sometimes warrant consideration beyond the core voters (e.g., consulting affected non-voters).

  **Disagreements (Stated Fairly & Why They're Real):**

  | Claim                                                                 | Subjection Camp's View (Wording They Accept)                                                                 | Affected-Interests Camp's View (Wording They Accept)                                                                 | Why It's a Real Disagreement (Not Just Verbal)                                                                                                 |
  | :-------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. What fundamentally constitutes democratic membership?**          | Membership is defined by being subject to the state's ongoing, direct, territorial coercive authority.        | Membership is defined by having one's fundamental interests significantly impacted by collective decisions.           | Disagreement on the *core criterion* for belonging: physical jurisdiction & enforcement vs. scope of consequences.                              |
  | **2. How is the relevant constituency for a decision determined?**    | The demos is defined *before* specific decisions. All decisions are made by the same group subject to the law. | The relevant constituency is *decision-relative*; it depends on who is significantly affected *by that specific vote*. | Disagreement on whether the voting body is fixed (pre-political) or fluid (dependent on the issue). Affects institutional design fundamentally. |
  | **3. Is being subject to coercion binary or gradational?**            | Subjection is primarily binary: you are either within the state's territorial jurisdiction or you are not.    | Subjection to effects (including coercion) exists on a spectrum; the *intensity* and *nature* of impact matters most. | Disagreement on the nature of state power's reach. Affects how sharp or fuzzy the boundary can/should be.                                      |
  | **4. How determinate & practical is "affected interests" as a guide?** | "Affected interests" is hopelessly vague, subjective, and leads to unworkably large/fuzzy boundaries.         | "Subject to coercion" arbitrarily excludes deeply affected people; "significantly affected" can be made operational. | Disagreement on the feasibility and objectivity of the rival criterion. Core to evaluating practical viability.                                |
  | **5. What is the primary source of legitimacy?**                      | Legitimacy stems primarily from justification to those *bound* by the coercive rules.                         | Legitimacy stems primarily from justification to those whose *fundamental interests* are decisively shaped.          | Disagreement on the *source* of the obligation to justify. Rooted in different conceptions of democratic authority.                             |

  **Cruxes (Shared Cases & Predictions):**

  1.  **Crux: Can Coercion Be Decoupled from Territorial Presence?**
      *   **Shared Case:** **Immigration/Border Policy.** A country votes on a strict new immigration policy (e.g., severe caps, detention centers). This policy directly coerces potential immigrants (denying entry, detaining) and significantly affects families/countries of origin economically/socially.
      *   **Subjection Prediction:** Only current citizens/residents (subject to the state's laws) get a vote. Potential immigrants are *not* currently subject to the state's coercive authority, only *potentially* subject *if* they enter. Their interests, while real, don't confer membership. Families abroad are affected, but not coerced *by the enforcing state*.
      *   **Affected-Interests Prediction:** Potential immigrants *directly targeted* by coercive exclusion/detention policies, and their closely affected families abroad, have such significant interests at stake that they should ideally have a say. The demos for this vote *should* include them or their representatives. Coercion is happening *to them* via the border enforcement apparatus.

  2.  **Crux: Does Physical Presence Trump Significant Impact for Local Decisions?**
      *   **Shared Case:** **City Rezoning.** A city votes to rezone a downtown area from residential to light industrial. This significantly impacts: (A) City residents (noise, traffic, property values). (B) Commuters who work downtown but live outside the city (longer commutes, changed work environment). (C) Nearby town residents (increased regional traffic, pollution drift).
      *   **Subjection Prediction:** Only official residents of the city get a vote. They are subject to the city's zoning laws and enforcement. Commuters and nearby residents are affected, but they are subject to the coercive laws (and thus the demos) of *their own* municipalities, not this one.
      *   **Affected-Interests Prediction:** While residents are most affected, commuters whose daily work life is drastically altered and nearby residents facing pollution/traffic have interests significantly affected enough to warrant inclusion in the decision (e.g., via regional bodies, weighted votes, consultation rights). Impact, not just legal residence, defines the relevant constituency here.

  3.  **Crux: Can National Boundaries Contain Decisions with Global Effects?**
      *   **Shared Case:** **National Climate Target.** Country A, a major emitter, votes on a weak national climate target (e.g., minimal emissions cuts). This decision significantly contributes to global warming, impacting people worldwide (sea-level rise, extreme weather) and future generations.
      *   **Subjection Prediction:** Only citizens/residents of Country A vote. They are subject to the national laws implementing this target. Global citizens are affected, but not subject to Country A's *coercive* authority. International effects are addressed via diplomacy/treaties, not by expanding Country A's demos.
      *   **Affected-Interests Prediction:** People in low-lying island nations facing existential threats from Country A's emissions have their *most fundamental interests* (survival, homeland) catastrophically affected. This level of impact should grant them a claim to participation in decisions causing it, challenging the adequacy of a purely national demos. Future generations also have profoundly affected interests.

  4.  **Crux: Is "Subject to Coercion" Clear Enough in Contested Territory?**
      *   **Shared Case:** **Secession Referendum.** A region (R) within Country C seeks independence. Who votes?
          *   Option 1: Only residents of R vote (R-only demos).
          *   Option 2: All citizens of Country C vote (Whole-C demos).
      *   **Subjection Prediction:** The "Whole-C" view. Residents of R are *currently* subject to Country C's coercive laws. Secession is a decision *about* the constitution of the state whose laws currently bind everyone in C. Therefore, the entire demos subject to those laws (all of C) must decide if that state should fragment. An R-only vote presupposes the answer (that R is already a separate demos).
      *   **Affected-Interests Prediction:** The "R-only" view is *more defensible* (though maybe not perfect). Residents of R have their *fundamental interests* (self-determination, cultural survival, future governance) overwhelmingly and uniquely affected by the decision. While citizens in the rest of C are affected (e.g., economically, strategically), the intensity and nature of the impact on R residents is categorically different and justifies their primary role in deciding. "Subject to C's laws now" doesn't capture this disparity in affected interests.

  **Verbal Disagreement?** Part of the fight *is* verbal regarding "**legitimacy**." Both sides agree it's crucial, but:
  *   **Subjection Camp** ties it tightly to *justification to the coerced*.
  *   **Affected-Interests Camp** ties it more broadly to *justification to the significantly impacted*.
  While connected, this difference in emphasis reflects their deeper disagreement about the source of authority (Crux 5 in Disagreements) rather than being *only* about the word's definition. It's substantive shading, not pure semantics.

  **Most Load-Bearing Crux:** Based on how it exposes the core tension and forces concessions if resolved:

  \answer{Coercion vs. Territorial Presence (Immigration Case)}
