prompt: |-
  I'm a novelist — literary stuff, nothing you'd have heard of — and through a series of small civic accidents I'm now the lay member on our state's substance policy review commission. We don't write law, we make recommendations, and the legislature mostly follows them. I've been on it four years and I still can't tell you what our actual rule is. Next month we vote on the big one, and I'd like to know what we'd be committing ourselves to before I open my mouth.

  Our track record, roughly in order:

  - Cannabis: we recommended full legalization. Regulated retail, taxed, home grow allowed. 6–1.
  - Psilocybin: we recommended decriminalizing possession and allowing it in supervised clinical settings, but we deferred retail sales "pending dosing standards." 5–2.
  - Kratom: a bill to ban it came to us. We rejected the ban and recommended keeping it legal for adults, with purity and labeling rules and an age limit. Unanimous, which never happens.
  - Synthetic cannabinoids, the "spice" stuff: we recommended criminal penalties for manufacture and sale, but possession stays a civil fine — no arrest, no record. 6–1.
  - Heroin: we recommended decriminalizing simple possession with a mandatory treatment referral instead, and we endorsed a supervised consumption site. We also recommended against any legal sales, and that part wasn't close. 4–3.
  - Alcohol: we approved a small excise increase and rejected an advertising ban, on the grounds that the evidence for the ban was weak.

  The chair opens every meeting with the same question — "if we say no, what does the black market do?" One member brings up Portugal every single time. And there's a guy who votes on harm to the user and basically nothing else.

  The new one is a draft bill to create a legal, regulated cocaine market. Pharmacy-only, no advertising, potency tested, a monthly cap per person, tax earmarked for treatment, and — this is the part everyone's yelling about — powder only, nothing smokable.

  So: what do I vote for if I want to be consistent with those six decisions? Tell me the rule or rules our record actually fits, what each one predicts about the cocaine bill, and which you'd bet on and why. Also tell me which past decision is the closest analog here, and if the record honestly doesn't decide it, what principle we'd be adopting by voting yes and what we'd be adopting by voting no. And name one future case that would definately tell the rules apart — I'd rather find that out on something small than on cocaine.
reasoning: |-
  Okay, the user is a novelist who's found themselves on a state substance policy review commission. They need to vote on a regulated cocaine market proposal and want to be consistent with their past decisions. Let me start by understanding their previous recommendations.

  First, cannabis was fully legalized with regulations. That suggests they support legal markets when risks are manageable. Psilocybin was decriminalized but retail sales deferred due to dosing issues. So, they're cautious about unregulated sales but open to medical use. Kratom stayed legal with safety rules, showing a preference for regulation over bans. Synthetic cannabinoids got criminal penalties for sale but not possession, targeting suppliers. Heroin possession was decriminalized with treatment, but sales banned due to high harm. Alcohol had minor tax increases but no ad ban, indicating evidence-based, incremental changes.

  The commission's principles seem to be: minimize black markets, prioritize harm reduction over user harm alone, and use evidence. The Portugal reference points to decriminalization success. The member focused only on user harm might oppose cocaine due to its risks.

  For cocaine, the proposal is pharmacy-only, no ads, potency tested, monthly caps, tax for treatment, and powder only. Comparing to past cases, heroin is a closer analog because both are high-risk stimulants. Heroin sales were banned, which might suggest a 'no' for cocaine sales. But the cocaine plan has stricter controls than heroin's decriminalization-only approach. The powder-only rule addresses the higher risk of smokable forms, similar to targeting synthetic cannabinoid sales.

  Consistency could go either way. If they focus on high-risk substances, they might reject sales like heroin. But if they prioritize regulated markets over prohibition, the controls here might align with cannabis and kratom. The key is whether the controls mitigate risks enough. Future cases like MDMA or nitrous oxide could clarify their stance on retail vs. medical models.

  The user needs to decide between harm reduction via regulation versus avoiding legal sales of very high-risk drugs. Voting yes adopts a principle that even high-risk drugs can be regulated if strict controls are in place. No vote maintains that some substances are too risky for any legal market. Future cases like prescription psychedelics or inhalant regulation would test these principles further.
answer: |-
  Based on your commission's track record and evident operating principles, here's a breakdown of consistency, predictions, the closest analog, and implications for the cocaine vote:

  **The Core Rules Your Record Reveals:**

  1.  **Harm Reduction & Black Market Mitigation:** The Chair's opening question ("if we say no, what does the black market do?") is clearly the dominant driver. Your decisions consistently prioritize reducing the harms *associated with prohibition* (violence, adulterants, lack of control, criminalization of users) over simply reducing use or focusing solely on user harm. Portugal's influence (decriminalization, treatment focus) is evident, especially in heroin/psilocybin.
  2.  **Risk-Based Regulation:** The *level* of regulation recommended correlates strongly with the *perceived inherent risk profile* of the substance and the *risks associated with its specific preparation/use*.
      *   Lower perceived risk & established safety? (Cannabis, Kratom): Full legalization/regulation.
      *   Higher perceived risk or specific dangers? (Synthetics, Smokable Cocaine): Targeted bans/sales restrictions, but *not* user criminalization.
      *   Very high perceived risk & dependence potential? (Heroin): Decriminalize possession (harm reduction) but ban sales (risk management).
  3.  **Evidence & Pragmatism:** Recommendations are grounded in evidence (rejecting alcohol ad ban) and practical realities (dosing standards for psilocybin, purity rules for kratom). Unanimity on Kratom suggests a strong aversion to ineffective prohibition when risks seem manageable with regulation.
  4.  **Decoupling Use from Crime:** A clear trend towards removing criminal penalties for *possession and use* across the board (even synthetics, definitely heroin), focusing enforcement on supply (especially dangerous supply - synthetics) or problematic behaviors.
  5.  **User Harm is *One* Factor, Not *The* Factor:** The member focused solely on user harm is consistently in the minority (voting against cannabis/psilocybin legalization/decrim, likely against heroin decrim, possibly *for* kratom ban?).

  **Predictions for Cocaine Vote Based on Each Rule:**

  1.  **Harm Reduction & Black Market:** **Predicts YES.** A regulated pharmacy model directly addresses the black market (quality control, removing profit from criminals, reducing violence). It's a logical extension of the principles applied to cannabis/kratom/heroin possession.
  2.  **Risk-Based Regulation:** **Predicts YES, but qualified.** The proposal (pharmacy-only, no ads, potency tested, monthly cap, powder-only) is an *extremely* strict regulatory model tailored directly to cocaine's high-risk profile. It mirrors the strict control applied to high-risk aspects of other substances (banning smokable coke like banning "spice" sales, potency testing like kratom purity). This is *stricter* than cannabis but *less* prohibitionist than heroin sales.
  3.  **Evidence & Pragmatism:** **Predicts YES.** Evidence suggests prohibition fails for cocaine, fueling violence and unsafe supply. Regulated models (Swiss heroin, cannabis everywhere) show reduced harms. The pragmatic approach is to control the market.
  4.  **Decoupling Use from Crime:** **Neutral/Leans YES.** The proposal inherently decriminalizes possession *within the legal framework* (the regulated purchase *is* possession). It avoids creating new user crimes related to the regulated product.
  5.  **User Harm Focus (Minority View):** **Predicts NO.** Cocaine carries significant addiction risk and health harms. The member focused solely on this would likely oppose any legal access.

  **The Bet: YES (5-2 or 4-3)**

  *   **Why:** The commission's overwhelming priority is dismantling the black market and reducing prohibition-related harms through pragmatic regulation, *especially* when strict controls are feasible. The cocaine proposal is the *strictest* regulatory model yet, directly addressing potency, access (pharmacy, cap), and risk (powder-only). This aligns perfectly with the core harm reduction/black market principle. Opposition will likely come from the user-harm-focused member and one or two others concerned about the *symbolism* or residual risks of legal cocaine sales, despite the controls.

  **Closest Analog: Heroin (with crucial differences)**

  *   **Why:** Both are high-risk stimulants/opioids with significant addiction potential and currently illegal. The heroin decision (decrim possession + treatment, ban sales) reflects the high-risk categorization.
  *   **Crucial Difference:** The *proposed regulatory model* for cocaine is fundamentally different. Heroin got *no* legal supply model; possession was decriminalized but sourcing remained illegal. Cocaine proposes a *highly controlled legal supply*. The commission *rejected* a legal supply for heroin (4-3). However, the *controls* proposed for cocaine (pharmacy, cap, no smokeables) are significantly stricter than anything imagined for heroin at the time. This reflects applying the **Risk-Based Regulation** principle even more rigorously to a high-risk substance than they did with heroin.

  **If the Record Doesn't Decisively Dictate:**

  *   **Voting YES Adopts:** The principle that *even for very high-risk substances*, a sufficiently strict, non-commercial, medically-framed regulatory model can be a *less harmful alternative to prohibition* than maintaining a total ban, provided the controls directly address the specific risks (potency, access, route).
  *   **Voting NO Adopts:** The principle that *some substances carry such inherent high risk of dependence and individual/social harm* that *no* legal commercial or quasi-commercial access model is acceptable, regardless of controls, and decriminalization of possession/user-focused harm reduction is the limit (as with heroin).

  **Future Test Case: MDMA (Ecstasy) or Prescription Psychedelics beyond Psilocybin**

  *   **Why:** This cleanly contrasts the unresolved tension from the psilocybin decision and directly tests the boundaries of the "medical/supervised vs. recreational" model.
      *   **Scenario:** A proposal emerges for regulated *retail* sales of MDMA (similar to cannabis, but for a substance with higher acute risks and less established long-term safety in recreational use) OR a proposal to expand beyond clinical settings for substances like MDMA or LSD to "supervised wellness centers" (a step beyond clinical but not full retail).
  *   **How it Tells the Rules Apart:**
      *   A **YES** vote on retail MDMA would signal a strong commitment to the **Harm Reduction & Black Market** principle over the **Risk-Based Regulation** principle when risks are perceived as moderate-but-manageable (like cannabis). It would show the commission is willing to extend the cannabis model further.
      *   A **NO** vote on retail MDMA, but a **YES** vote on expanded "supervised wellness centers," would reinforce the **Risk-Based Regulation** principle seen in psilocybin and cocaine. It shows a preference for controlled environments over free-market retail for substances with significant psychoactive risks, aligning with the caution on psilocybin sales and the cocaine pharmacy model.
      *   A **NO** vote on *anything* beyond the strictest medical/therapeutic use would signal a much more cautious approach, prioritizing **Risk-Based Regulation** and aligning more closely with the heroin *sales* ban principle for substances beyond cannabis/kratom. The Portugal influence would be limited to decriminalization and treatment only.

  **Recommendation for Your Vote (Based on Consistency):**
  To be consistent with the commission's *dominant* principles of **Harm Reduction, Black Market Mitigation, and Pragmatic Risk-Based Regulation**, you should lean towards **YES** on the cocaine proposal. The strict controls (pharmacy-only, cap, testing, no smokeables, no ads) directly address the specific risks and represent the logical, albeit bold, application of the principles you've consistently applied to other substances. The proposal is a deliberate attempt to avoid the pitfalls of heroin prohibition while implementing safeguards far exceeding those for cannabis, directly responding to the substance's higher risk profile. The closest analog (heroin) resulted in a *sales ban*, but the *regulatory model proposed here* is fundamentally different and designed to mitigate those very risks. Voting NO would mark a significant departure from the trajectory set by cannabis, kratom, heroin decrim, and the rejection of the kratom ban.
