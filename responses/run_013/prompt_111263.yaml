  *Audience analysis:*
  The Dennett-sympathetic prof will attack the "fourth stance" necessity—Dennett's framework is famously flexible. The neuro-focused faculty will pounce on "real patterns" for RL agents, seeing intentionality as fictional. The ML student will demand technical rigor on "compresses better" claims. Grad students might blend these angles.

