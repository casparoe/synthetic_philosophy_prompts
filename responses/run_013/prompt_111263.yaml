     *Weakness:* Over-reliance on edge cases.

  *Non-negotiables:* 
  - Must defend that training stance is distinct in cases of misalignment. 
  - Never concede that predictive success is irrelevant to "real patterns."

  *Landmine question:* 
  "Doesn't your stance collapse into the physical stance when we examine network weights?" (Exposes a deep tension—if training patterns supervene on physics, is this really a new stance?)

