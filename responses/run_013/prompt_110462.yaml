  For belief, the constitutive aim is truth, so monetary incentives can't provide reasons for belief itself - only for desire to believe. The joke case confirms amusement's tie to perceived funniness (object), not social consequences. Intention vs action might turn on intention's constitutive link to action's perceived worth. 

