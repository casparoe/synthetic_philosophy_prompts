answer: |-
  Here's my philosopher-of-history hat firmly on. Let's dissect "objectivity" before tackling your practical dilemma.

  **Brainstorming "Objectivity" in Historical Writing:**

  1.  **Positivist/Objectivist:** The historian can (and should) present "the facts" as they *actually* happened, neutrally, without personal bias or interpretation. The past exists independently, and our job is to mirror it accurately in our writing. This seems closest to your editor's view.
  2.  **Absence of Overt Bias:** Objectivity means striving to minimize *identifiable* bias (political, ideological, personal). It involves rigorous source criticism, acknowledging counter-evidence, and avoiding loaded language. It's procedural fairness rather than perfect neutrality.
  3.  **Inter-Subjective Agreement:** Objectivity arises when a community of trained historians, applying shared methodological standards to the same evidence, converges on a consensus interpretation. It's less about "truth" and more about disciplined, verifiable agreement.
  4.  **Perspectival/Objectivity-as-Fairness:** Recognizing that *all* history involves selection and framing, objectivity means presenting multiple relevant perspectives fairly, acknowledging the limitations of the evidence, and avoiding undue emphasis or suppression. It's honesty about the constructed nature of the account.
  5.  **Narrative Detachment:** Objectivity means avoiding causal claims, moral judgments, or imposing a "plot" on events. It's presenting the "what" without speculating on the "why" or assigning significance beyond the bare record. (Your editor's "no narrative" rule).
  6.  **Pragmatic Objectivity:** Focusing on what the evidence *compels* us to say, distinguishing clearly between established facts and interpretations (even our own), and prioritizing explanations that best account for the available data, even if complex or unsatisfying.

  **My Actual View:**

  The Positivist/Objectivist view (1) is fundamentally incoherent for historical writing. **History is not a mirror, it's a reconstruction.** Here's why your editor's demand is problematic, yet why her core concern (honesty, fairness) is valid:

  *   **The Selection Problem (Your Mate is Right):** Choosing *which* dates, decisions, and documents to include is an act of interpretation. Why start at incorporation and not the founder's birth? Why include the 1958 "bet" at all? Why list factory openings but not minor accidents? Every inclusion/exclusion implies significance. A bare list *is* a minimalist narrative – one that implies "these things mattered."
  *   **The Framing Problem:** Simply placing facts in chronological order imposes a sequence that can imply causality or significance. Calling something a "decision" rather than an "impulse" or "reaction" frames it. Omitting adjectives doesn't remove the framing inherent in selection and juxtaposition.
  *   **The Interpretation in the "Record":** Documents aren't pure data. Minutes reflect power dynamics and what was deemed minutable. Letters reveal perspective and motive (often the writer's). Reading them requires interpreting context, subtext, and potential silences. Presenting "the record" *is* presenting an interpretation of what that record means.
  *   **The Causal Vacuum:** Banning narrative often means banning *explanation*. But "decision X happened" begs the question *why* or *how* it happened. Explaining it *requires* interpretation. Avoiding explanation entirely leaves history sterile and often misleading.

  **However...** This doesn't mean "anything goes" or that striving for fairness and accuracy is pointless. This is where Perspectival/Objectivity-as-Fairness (4) and Pragmatic Objectivity (6) become crucial.

  **Applying This to Your Dilemma:**

  1.  **The Editor's Rule (Re-framed):** Her demand, while impossible in its strictest sense, is a valuable push *against* unwarranted embellishment, myth-making, and imposing simplistic or self-serving narratives. Your job is to push back against the *impossibility* while honoring the *intent*: rigorous honesty, minimal speculation, and avoiding known biases (like hero-worship).
  2.  **The 1958 Decision:**
      *   **YES, you absolutely write what the record shows.** Suppressing this because it contradicts the heroic myth is *precisely* the lack of objectivity she claims to abhor (though it's actually bias). It's dishonest to the past.
      *   **Avoid Swapping Narratives:** Don't frame it cynically as "just dumb luck." Frame it **evidentially**. Present the documented *reason* for the decision (the spat), then state the documented *outcomes* (the unexpected export order, the competitor's fire). Let the complexity speak for itself. You might write:
          > "In 1958, following a dispute with Supplier Y, Chairman Z diverted significant resources to develop Product X, a strategic shift. While internal projections were pessimistic, the venture ultimately proved highly profitable after securing an unexpected export contract with Firm A in 1960, coinciding with the destruction of primary competitor B's main facility."
      *   **This is Objective (in the Pragmatic/Sensible sense):** It states the documented motivation, the action, the context of skepticism, and the key factors contributing to the success, *without* editorializing ("foolish," "lucky," "brilliant," "foresightful"). It presents the complex reality the evidence reveals.
  3.  **Fairness vs. Accuracy:** Accuracy *is* the foundation of fairness to the dead. Presenting the documented motivations and outcomes accurately *is* fair. Glossing over his documented impulsive reason to preserve a heroic image is *unfair* because it misrepresents him and the historical reality. Fairness requires presenting him as the complex, perhaps flawed, human the records reveal, not as a simplified legend.
  4.  **The Descendants & Practicality:**
      *   **Stick to the Evidence:** Your shield is the documents. "The minute book from July '58 cites the supplier dispute as the catalyst." "Correspondence in '60 confirms the export order resulted from a personal connection to the buyer at Firm A." "Local news archives report Competitor B's fire in March '60." This is harder to dispute than interpretation.
      *   **Focus on Outcomes & Significance:** Emphasize the *impact* of the decision and the subsequent events – it *did* save the firm and shape the town for decades. The *why* is documented fact, the *what happened* is documented fact, the *result* is documented fact.
      *   **Avoid Value Judgments:** Don't call the decision "poor" or "reckless," even if internal projections suggested it. State the projections existed and the documented reason for the decision. Let readers infer.
      *   **Pre-empt the Conversation:** When submitting the draft, flag this section specifically to the editor *and* the descendants. Explain briefly: "The archival record on the 1958 decision provides specific details on the initial motivation (supplier dispute) and the unforeseen events that led to its success (export order, competitor fire), differing slightly from common recollections. I've presented this strictly based on the minute books and correspondence to adhere to the factual mandate." Frame it as adhering to the rules, not attacking the founder.
      *   **Pick Your Battles:** Is this the *only* potential point of friction? If so, stand firm based on evidence. If there are many, prioritize this significant one.

  **Conclusion & What to Write:**

  Your editor asks for the impossible (a narrative-less, purely objective mirror of the past), but her underlying demand for rigor and resistance to myth-making is sound. **True historical objectivity, pragmatically understood, means being ruthlessly honest about what the evidence compels you to say, acknowledging complexity, avoiding unsupported interpretations (positive or negative), and clearly distinguishing fact from common lore.**

  Regarding the 1958 decision: **Write the documented facts about the reason, the action, the context of doubt, and the key subsequent events that led to success.** Present it dispassionately, without the adjectives of either heroism or cynicism. This is *more* honest and accurate than the myth, and it avoids simply replacing one simplistic narrative with another. It embraces the messy reality history often presents.

  You are not swapping one story for another; you are replacing an *unsupported* story with a *documented* sequence of events and contexts. That's the closest we get to objectivity in history. Good luck navigating the descendants – your best defense is the cold, hard paper trail.
