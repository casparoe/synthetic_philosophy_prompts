prompt: |-
  I spent thirty-five years doing bench science, and since retiring I've been reading philosophy — badly, but enthusiatically. Right now I'm stuck on the old result about group accuracy: the more voters you have, each one even slightly more likely than not to get a yes/no question right, the closer the majority supposedly gets to infallible. My measurement instincts won't let it go, because in the lab I never once met two readings that were genuinely independant, and I keep feeling the theorem is quietly smuggling in assumptions no real group satisfies. I don't want another confident summary — I want a proper spec, and one I can actually use, because my real question is when I should trust a large anonymous crowd's verdict (a jury, a refereeing panel, a prediction market, the internet's opinion of the day) and what I'd need to know about it first.

  So write me the desiderata an adequate theory of collective judgment has to meet. I mean the whole list: the cases it has to get right (voters who are correlated because they all read the same sources, voters whose competence isn't a fixed property but shifts with what the neighbours are saying, a handful of genuinely expert voters drowned in alot of mediocre ones, voters with a stake in the outcome), the distinctions it can't be allowed to collapse (between the chance the majority is right and the size of the winning margin; between a voter being wrong and a voter being biased in a consistent direction; between a group being accurate and a group being legitimate), and the formal facts it has to live with — what actually happens to the theorem once you relax independence, or let competence vary across the group, or let the crowd split into two camps each slightly better than random but pulling opposite ways. For each requirement give me the case or result behind it, and say which ones you think are genuine demands of the subject and which are just the prejudices of one camp. A table would be fine.

  Then the part I most want: tell me which of these requirements can't be satisfied together. My hunch is that the ones that make a group track the truth (independent, sincere, individually competent, roughly equal voters) pull against the ones that make it fair or legitimate (every vote weighed the same, majority rule come what may), and that you can't max both at once. Say whether that's right, which single requirement does the most to eliminate candidate theories, and whether any contender on the table actually survives the whole list or they all die somewhere. And please skip the reading list — I can't look anything up and I don't want a bibliography, just the criteria and your reasoning.
reasoning: |-
  Okay, let me tackle this user's query. They've spent 35 years in bench science and are now diving into philosophy, specifically the Condorcet Jury Theorem (CJT) and its real-world applicability. Their main concern is that the theorem's assumptions—like voter independence and fixed competence—don't hold up in practice. They want a thorough breakdown of what a good theory of collective judgment must account for, including pitfalls and conflicting requirements.

  First, I need to address their skepticism about independence. In lab settings, measurements often correlate, similar to voters influenced by common sources. The CJT's collapse without independence is a big issue. Then there's variable competence—real people aren't consistently accurate; their judgment shifts with context or biases. The user mentioned juries and prediction markets, so cases like expert dilution and strategic voting are crucial.

  They also want distinctions maintained, like accuracy vs. legitimacy. A group might be right but unfair, like if only some votes count. Or consider bias vs. random error—systematic skews need different handling. The user’s hunch about truth-tracking conflicting with fairness is key here. Equal voting might include incompetent voices, lowering accuracy, while weighting by competence could exclude representation, harming legitimacy.

  Formal relaxations of CJT show trouble. Correlated voters reduce accuracy gains; variable competence means optimal group size isn't always bigger. Polarized groups might have high confidence but be wrong if both sides are biased. These points challenge the theorem’s optimism.

  Now, assembling desiderata. Essential cases: correlated voters, shifting competence, expert dilution, motivated voters. Required distinctions: accuracy vs. legitimacy, margin size vs. correctness, bias vs. error. Formal facts: CJT’s degradation under real conditions. I should note which requirements are broadly accepted vs. debated, like whether strategic voting is always bad.

  Conflicts are central. Independence vs. equality: weighting by competence breaks one-vote-per-person fairness. Truth-tracking vs. legitimacy—experts might be correct but unrepresentative. Also, sincerity vs. strategy: honest voting is ideal, but sometimes strategy corrects for biases, creating tension.

  The biggest roadblock? Probably independence. Real groups share information, violating it. Without it, CJT doesn't hold, and most models struggle. No theory satisfies all, but Bayesian approaches with variable weights come closest, though they're complex and need data.

  Assessing the user’s deeper needs: they want actionable criteria to evaluate real groups. They’re not after abstract theory but practical tools—what to check before trusting a crowd. Highlighting trade-offs helps them make informed judgments. Their science background means they value empirical grounding over philosophical arguments, so focusing on measurable factors like correlation strength or bias detection is key.
answer: |-
  Below is a structured analysis of the desiderata for a theory of collective judgment, addressing your core concerns about real-world applicability, conflicts between requirements, and the fragility of the Condorcet Jury Theorem (CJT). I focus on formal constraints, empirical cases, and inherent trade-offs.

  ---

  ### **Desiderata for an Adequate Theory of Collective Judgment**

  | **Requirement**                                       | **Case/Result Behind It**                                                                 | **Nature (Demand/Prejudice)**                     |
  |-------------------------------------------------------|-------------------------------------------------------------------------------------------|---------------------------------------------------|
  | **1. Must handle correlated voters**                  | CJT collapses with even small correlations (e.g., voters relying on same media). Majority accuracy plummets if errors are positively correlated. | **Genuine demand** (Empirical: all real groups share information sources). |
  | **2. Must account for variable competence**           | In lab/science, skill isn't fixed (e.g., a voter's accuracy drops on complex sub-questions). CJT fails if average competence <50% or varies widely. | **Genuine demand** (Empirical: expertise is domain-specific and fluid). |
  | **3. Must distinguish accuracy from legitimacy**      | A jury might be factually correct but racially biased (legitimacy failure). Prediction markets may be accurate but manipulated (lack fairness). | **Genuine demand** (Normative: accuracy ≠ procedural justice). |
  | **4. Must not conflate margin size with correctness** | A 51-49 majority can be wrong (e.g., biased question); a 90-10 majority can be right but overconfident. | **Genuine demand** (Formal: CJT links margin to confidence, but real groups break this). |
  | **5. Must handle strategic/incentivized voters**      | Jurors with career stakes, prediction traders with financial bias, or panelists seeking peer approval. | **Genuine demand** (Empirical: incentives distort sincerity). |
  | **6. Must model shifting competence (e.g., herding)** | "Wisdom of crowds" fails in bubbles (e.g., stock market frenzies, social media bandwagons). | **Genuine demand** (Behavioral: information cascades are well-documented). |
  | **7. Must address expert dilution**                   | Adding 100 mediocre voters swamps 5 experts unless weighted. CJT assumes homogeneous competence. | **Genuine demand** (Formal: unweighted voting loses expert insight). |
  | **8. Must separate bias from random error**           | A climate panel with oil-funded members (systematic bias) vs. random misjudgment. | **Genuine demand** (Methodological: biases require structural fixes, not more votes). |
  | **9. Must survive polarization**                      | Two opposing blocs, each 55% accurate but mutually hostile (e.g., political juries). CJT fails if average competence >50% but blocs are internally correlated. | **Genuine demand** (Empirical: polarized societies are common). |

  ---

  ### **Conflicts Between Requirements**
  Your hunch is correct: **truth-tracking and legitimacy/fairness pull in opposite directions**. Here’s the breakdown:

  1. **Independence vs. Equality (One-Vote-Per-Person)**  
     - *Conflict*: Weighting votes by competence (to boost accuracy) violates "equal say" legitimacy.  
     - *Result*: Theories maximizing accuracy (e.g., Bayesian peer-prediction) require unequal voting power.  

  2. **Truth-Tracking vs. Legitimacy**  
     - *Conflict*: Excluding incompetent voters (e.g., in science panels) improves accuracy but undermines representational legitimacy.  
     - *Case*: A prediction market excluding "noise traders" may be more accurate but less "democratic".  

  3. **Sincerity vs. Strategic Incentives**  
     - *Conflict*: Requiring sincere voting ignores that incentives can *improve* accuracy (e.g., prediction markets rewarding correct bets).  
     - *Result*: Mechanisms forcing sincerity (e.g., enforced anonymity) may reduce real-world applicability.  

  4. **Expert Weighting vs. Robustness to Corruption**  
     - *Conflict*: Weighting by expertise assumes honest identification of experts. In practice, this invites manipulation (e.g., panels stacking "experts" with biased members).  

  ---

  ### **Which Requirement Eliminates Most Theories?**
  **Independence** is the biggest roadblock. No real group satisfies strict independence. Once correlation exists:
  - CJT’s accuracy guarantee vanishes.  
  - Correlated errors compound, so adding voters *hurts* accuracy if they share biases.  
  - Most theories (including extensions of CJT) fail when correlation exceeds competence advantages.  

  ---

  ### **Formal Facts: What Happens When CJT Assumptions Relax**
  | **Assumption Relaxed**      | **Effect on Majority Accuracy**                                                                 | **Key Insight**                                  |
  |-----------------------------|-------------------------------------------------------------------------------------------------|-------------------------------------------------|
  | **Independence**            | Accuracy gains plateau or reverse; positive correlation caps group competence.                  | Correlation > competence advantage kills CJT.   |
  | **Fixed Competence**        | Adding voters helps only if new voters’ average competence >50%. Else, harms accuracy.          | Heterogeneity requires weighting, not counting. |
  | **Homogeneous Competence**  | Majority accuracy dominated by the *least* competent if correlations exist.                     | "Weak links" break collective wisdom.           |
  | **Sincerity**               | Strategic voters may distort outcomes (e.g., vote against truth to manipulate markets).         | Incentives can align or misalign with truth.    |
  | **Binary Choice**           | With >2 options, majority cycles (Arrow’s Theorem) make "correct" outcome undefined.           | Accuracy presupposes a clear truth to track.    |

  ---

  ### **Can Any Theory Satisfy All Requirements?**
  **No theory survives the entire list.** All fail in polarized or corrupted environments. However:
  - **Best Contender**: **Bayesian Truth-Seeking Models** (with dynamic weights and correlation adjustments).  
    - *Strengths*: Handles variable competence, weights experts, and models some correlations.  
    - *Failures*: Requires unobservable parameters (true competence, bias levels), struggles with legitimacy (weights are unequal), and fails under strong herding.  
  - **Second Best**: **Prediction Market Mechanisms** (using incentives to align votes with truth).  
    - *Strengths*: Incentivizes accuracy, reveals confidence via prices.  
    - *Failures*: Vulnerable to rich/minority biases, conflates accuracy with market efficiency.  

  ---

  ### **Practical Implications: When to Trust a Group**
  1. **Check correlation risks**: If voters share sources (e.g., a jury exposed to the same media), distrust majority.  
  2. **Assess incentive alignment**: Trust prediction markets only if incentives reward *truth* (not popularity).  
  3. **Demand negative weights**: Suspect groups where biases are systematic (e.g., political panels) unless counterweights exist.  
  4. **Prefer small groups with heterogeneity**: 10 diverse experts outperform 1,000 correlated novices.  
  5. **Ignore margin, seek calibration**: A 55% majority with low correlation is more trustworthy than 90% with high correlation.  

  Your measurement instincts are sound: the gap between CJT and reality lies in **unobservable dependencies**. In practice, trust requires *knowing how the group was formed*—not just its size. The closest to a universal rule:  
  > **Trust anonymous crowds only when errors are likely random, uncorrelated, and incentives reward sincerity. Otherwise, assume corruption.**
