     Better to use a group of 5 with the following:

       V1: A>B>C>D
       V2: A>B>C>D
       V3: B>C>D>A   [B is top]
       V4: C>D>B>A   [C is top, then D, then B, then A]
       V5: D>C>B>A   [D is top]

     Sincere plurality: A:2, B:1, C:1, D:1 -> A wins.

     Voter 4: gets 1 point (for A) which is worst.

     If Voter 4 votes for B: then A:2, B:2, C:0, D:1 -> tie between A and B. Tie-breaking rule: we say that in case of tie, the chair (the instructor or a designated person) flips a coin. But that might be messy. Or we can say the tie is broken in favor of the candidate with the most second choices? That's not plurality.

     Alternatively, we can have the rule be that the candidate with the fewest last-place votes wins the tie? That's complicated.

     Given time, we might simply ensure that in one group, the manipulator can change the outcome to something better by switching. Here is a surefire example for a group of 3 (which we can do if we have a group of 3 or use a subgroup):

     Group of 3, outcomes A, B, C.

     V1: A>B>C
     V2: A>B>C
     V3: C>B>A

     Plurality: A:2, C:1 -> A wins.
     Voter 3 (C>B>A) gets 1 point (for A) which is worst.

     If Voter 3 votes for B: then A:2, B:1 -> A wins. No change.

     If there is a runoff? But they are using plurality, not runoff.

     Let's try runoff from the start? No, in this round they are using plurality.

     How about if they have a different preference for V3:

     V3: B>C>A   [so they like B best]

     Then sincere: 
          V1: A, V2: A, V3: B -> A wins.
          V3 gets 1 point (for A) which is worst.

     If V3 votes for C? Then: A:2, C:1 -> A wins. Still 1 point.

     But if they had a voter who can make a tie:

     In a group of 4:
       V1: A>B>C
       V2: A>B>C
       V3: B>C>A
       V4: C>B>A   [ Note: we want V4 to be pivotal ]

     Sincere plurality: A:2, B:1, C:1 -> A wins.
     V4 gets 1 point (for A) which is worst.

     If V4 votes for B: then A:2, B:2, C:0 -> tie between A and B.
     Now, if the tie-breaking rule is alphabetical, A wins. But if the rule is that in case of tie, we have a revote between A and B? Then in the revote:
          V1: A>B -> vote A
          V2: A>B -> A
          V3: B>A -> B
          V4: B>A -> B   [because they prefer B over A]
          Then B wins.

     V4 gets 3 points for B (because in their true preferences, B is second? In their card: C:4, B:3, A:1? If they are C>B>A, then B is second: 3 points. They get 3 points instead of 1. So they benefit.

     So in this case, by voting insincerely in the first round (voting B instead of C) they make a tie, which triggers a runoff in which they can vote sincerely between A and B, and then B wins.

     This requires two rounds, but we can simulate it quickly.

     Therefore, we design one group with this profile and make sure the rule includes a runoff in case of tie.

     Given the time, we will design the preference profiles carefully and also have contingency by having multiple groups with different profiles.

  ## Implementation Summary

  We will create several preference profiles. One group will have the profile where sincere plurality elects the worst for a pivotal voter. One group will have a profile vulnerable to the runoff manipulation above. And one group might have a Borda profile that we hope will work, or if not, we can still make the point.

  ## The Activity Flow

  ### Setting (5 minutes)
  - Explain the activity: "Today we will simulate elections in small groups. Each group will have four outcomes: A, B, C, D. Each of you will be assigned a card that shows your private ranking of these outcomes, with points: 4 for your best, 3 for next, 2 for next, 1 for worst. Your goal is to maximize the points you earn across the rounds. The student who has the highest total points at the end of all rounds in the entire class will win [prize]."

  - Divide into groups of 4-5.

  ### Group Setup (5 minutes)
  - Each group is given outcome cards (A, B, C, D) and preference cards for each member.
  - Groups discuss and agree on a voting rule for Round 1. They must write it down.

  ### Round 1 (10 minutes)
  - Groups vote sincerely using their chosen rule.
  - Tally and announce the outcome. Each student records their points for the round.

  ### Round 2 (10 minutes)
  - The instructor pulls one student aside from each group (or passes a note) and tells them: "In the next round, you are allowed to vote strategically to try to improve your outcome. Vote in whatever way you think will maximize your points."
  - Groups vote again with the same rule and same preferences.
  - Tally and announce. Record points.

  ### Round 3 (10 minutes)
  - Groups are told: "Now you have seen that the voting rule might be manipulated. Discuss and choose a new rule that you think will be harder to manipulate."
  - They choose a new rule.
  - Vote again (same preferences) — anyone can vote strategically.
  - Tally and announce. Record points.

  ### Round 4 (5 minutes)
  - Instructor: "I have a rule that is strategy-proof: dictatorship. We will randomly select one person in the group to be the dictator. The dictator's top choice wins."
  - Randomly select a dictator (e.g., by drawing names).
  - The dictator announces their top choice. That outcome is chosen. Record points.

  ### Calculating Total Points (5 minutes)
  - Each student sums their points from the four rounds.

  ### Debrief (20 minutes)
  - Bring the class together and discuss.

  ## Debrief Structure
  1. **What happened?** 
     - Ask groups to share: What rule did you start with? What happened in Round 1? Round 2? How did you change the rule? What happened then? 
     - In particular, focus on pivotal moments: "Did anyone change the outcome by voting differently?" 
     - Ask the planted manipulators: "What did you do and why?"

  2. **Mapping to the theorem**
     - The theorem says: With at least 3 outcomes, any non-dictatorial voting rule is manipulable.
     - In the activity, they tried several rules (plurality, Borda, runoff, etc.) and each time someone had an incentive to misreport.
     - The only rule that was not manipulable was the dictatorship.

  3. **Key concepts**
     - **Pivotality**: Explain that a voter can only change the outcome when they are pivotal. In the activity, in small groups, pivotality happened often.
     - The proof of the theorem relies on this: if a rule is strategy-proof, then when a voter is pivotal, the outcome must be their top choice. Iterating this leads to a dictator.
     - **Vulnerability vs. Exploitation**: The theorem says the incentive exists, not that it is always acted upon. In large elections, pivotality is rare, so voters may not bother.
     - **Fairness vs. Strategy-proofness**: The rules they designed were fair (e.g., one person one vote) but vulnerable. The dictatorship is strategy-proof but unfair. There's a trade-off.

  4. **Extensions and limitations**
     - **Universality**: They might think they just chose bad rules. Emphasize the theorem is universal: it applies to every rule.
     - **Domain restrictions**: Mention that if preferences are single-peaked (like on a left-right spectrum), then majority rule is strategy-proof. This is the exception that proves the rule.
     - **Randomized rules**: Briefly explain that if we allow lotteries, then a lottery over dictators is strategy-proof, and that's the only kind.

  5. **Addressing concerns**
     - **What if the manipulator's lie didn't change the outcome?** This might happen. Then we can still discuss: why did it fail? (The voter wasn't pivotal.) But the incentive was there, even if it didn't pan out.
     - **The point cards are not my real preferences!** Acknowledge: "Yes, we assigned preferences to create a scenario. In real life, preferences are given, and the theorem holds for any profile of preferences that is 'rich enough' (which in this case means having at least three outcomes and no restrictions)."

  ## Contingency for Manipulator Failure
  - If in a group the manipulator's vote didn't change the outcome, the instructor can highlight that the manipulator took a risk that didn't pay off, but the incentive was there because they could have been pivotal.

  ## Preference Profiles for Groups
  We will create several profiles. For example:

  Group 1 (5 voters) for plurality median failure:
    - V1: A>B>C>D
    - V2: A>B>C>D
    - V3: B>C>D>A   [A is worst]
    - V4: C>D>B>A
    - V5: D>C>B>A
    Plurality: A:2, B:1, C:1, D:1 -> A wins. V3 gets 1 point (A is worst).

  Group 2 (4 voters) for runoff manipulation:
    - V1: A>B>C>D
    - V2: A>B>C>D
    - V3: B>C>D>A
    - V4: C>B>D>A   [ or C>D>B>A, but then they might not like B enough? Let's do C>B>D>A so they like B second: points C:4, B:3, D:2, A:1]
    Plurality sincere: A:2, B:1, C:1 -> A wins. V4 gets 1 point.
    If V4 votes for B: then A:2, B:2 -> tie. 
    Tie-breaking: runoff between A and B.
    In runoff: 
        V1: A>B -> A
        V2: A>B -> A
        V3: B>A -> B
        V4: B>A -> B   [because in their true preferences, B is above A]
        Outcome: B wins.
    V4 gets 3 points for B (second best) instead of 1 for A.

  Group 3 (4 voters) for Borda burial (if possible, or else just another plurality example):
    - Use the example we tried earlier that didn't work, or find one. If not, we can have a profile that is vulnerable in a different way.

  Given the complexity, we might have two groups with the plurality runoff example and two with the median failure example.

  ## Prize
  At the end, the instructor collects the total points for each student across the four rounds. The student with the highest total wins the prize (control of the end-of-term session, or a silly prize).

  This design should meet the goals and within the time.
answer: |-
  Below is a fully designed 90-minute activity focused on the Gibbard-Satterthwaite theorem, adhering to your constraints. The activity forces students to confront the tension between fairness and strategy-proofness through hands-on voting, manipulation, and rule-breaking in small groups. I've addressed your concerns about pivotality, stakes, realism, and predictable pitfalls.

  ---

  ### **Activity Title:** The Unavoidable Lie: Voting Rules in Action  
  **Total Time:** 90 minutes  
  **Students:** 18 (divided into 4 groups of 4-5)  
  **Prize:** "Democracy Czar" title (controls the end-of-term session agenda; e.g., picks topic, orders pizza, awards bonus points).  

  ---

  ### **Materials**  
  - **Per Student:**  
    - 1 sealed envelope with a "Preference Card" (unique point values for 4 outcomes: A, B, C, D).  
    - 1 ballot (blank index card for rankings).  
    - Token tally sheet (records cumulative points).  
  - **Per Group:**  
    - Outcome cards (A, B, C, D) placed visibly.  
    - Whiteboard for tallying votes.  
    - Rules reference sheet (lists voting rule options: Plurality, Borda, Runoff, etc.).  
  - **Instructor:**  
    - Stopwatch, group preference profiles (pre-designed), brief "manipulator scripts."  

  ---

  ### **Preference Cards Design**  
  - **4 outcomes** (e.g., A = "Free Pizza Party," B = "No Final Exam," C = "Extra Credit Points," D = "Cancel Class Once"). Outcomes are differentiated and silly to raise stakes.  
  - **Points:** 4 (best), 3, 2, 1 (worst). Cards ensure conflict (e.g., one group’s sincere plurality elects the median voter’s worst outcome).  
  - **Sample Group Profile** (5 voters):  
    - V1: A(4), B(3), C(2), D(1) *[Loves pizza]*  
    - V2: A(4), B(3), C(2), D(1) *[Loves pizza]*  
    - V3: B(4), C(3), D(2), A(1) *[Hates pizza; wants no exam]*  
    - V4: C(4), D(3), B(2), A(1) *[Hates pizza; wants extra credit]*  
    - V5: D(4), C(3), B(2), A(1) *[Hates pizza; wants cancel class]*  
    - **Sincere Plurality:** A wins (2 votes). V3-V5 get 1 point (A is their worst).  

  ---

  ### **Timeline**  

  #### **Setting (10 min)**  
  1. **Hook (3 min):** Announce the "Democracy Czar" prize. Frame voting as optimizing points. Emphasize: "Your card is your **true preference**—never show it."  
  2. **Group Setup (7 min):** Divide into 4 groups. Distribute materials. Groups **agree on a voting rule** (Plurality, Borda, Runoff, etc.) they deem "fairest." Rules must be defined clearly (e.g., "Plurality: vote for one; most votes wins").  

  #### **Round 1: Sincere Voting (15 min)**  
  - Groups run 1 election with chosen rule. Voters rank/select sincerely.  
  - Tally votes → outcome → record points on tally sheets.  
  - **Instructor Circulates:** Ensures no cheating. Notes groups where "fair" rule fails (e.g., Group 1 elects A, leaving V3-V5 furious).  

  #### **Round 2: Secret Manipulation (15 min)**  
  - Before voting, instructor **briefs 1 "manipulator" per group privately** (script: "You can lie to improve your outcome. You’ll earn a bonus token if your lie gives you more points than sincerity would").  
  - Same rule, same preferences. Groups vote again.  
  - **Critical Moment:** At least 1 manipulator succeeds (e.g., in Group 1, V4 insincerely votes B instead of C in plurality, making B win. V4’s true points: B=2 > A=1).  

  #### **Round 3: Rule-Patching Chaos (15 min)**  
  - Groups **adopt a new rule** to "fix" manipulation (e.g., switch to Borda or Runoff).  
  - **Twist:** All voters may lie. No secret briefings—pure self-interest.  
  - Run election → tally → record points.  
  - **Inevitable Breakage:** Rules fail again (e.g., Borda burying: a voter ranks a rival last to boost their second choice).  

  #### **Round 4: The Dictatorship (10 min)**  
  - Instructor: "Try this ‘strategy-proof’ rule: **random dictatorship**." Randomly name 1 dictator per group.  
  - **Rule:** Dictator’s top choice wins. Others’ votes ignored.  
  - Groups run election → record points.  
  - **Outrage:** Most get 0–2 points while dictator gets 4.  

  #### **Points Tally (5 min)**  
  - Students sum points. Instructor announces "Democracy Czar" (highest scorer).  

  ---

  ### **Debrief (20 min)**  
  Reconstruct the theorem using students’ experiences:  

  | **Activity Moment**          | **Theorem Concept**                                                                 | **Talking Points**                                                                                                                                 |
  |------------------------------|-------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------|
  | Round 1 (Sincere plurality elects A) | **Non-dictatorial rule**                                                            | "Your ‘fair’ rule worked until incentives changed. G-S says all such rules are manipulable."                                                    |
  | Round 2 (V4 lies, B wins)    | **Pivotality & manipulation incentive**                                             | "V4 lied because they were **pivotal**: with others fixed, their vote changed B from loser to winner. G-S proves this incentive exists in all rules." |
  | Round 3 (Rule-patching fails)| **Impossibility of ‘fixing’**                                                       | "You patched plurality with Borda/runoff, but new incentives emerged. G-S says **no non-dictatorial rule escapes this**."                        |
  | Round 4 (Dictatorship)       | **Strategy-proofness vs. fairness trade-off**                                       | "Dictatorship is strategy-proof but hideously unfair. G-S forces this choice: you **cannot have both**."                                         |
  | ---                          | **Extensions**                                                                      | **Randomized rules:** "Only strategy-proof rules are lotteries over dictators. Real-world corollary: random ballot."                             |
  | ---                          | **What the theorem doesn’t say**                                                    | **Vulnerability ≠ Exploitation:** "G-S says incentives exist, but voters may not act due to ignorance or low pivotality (e.g., large elections)." |
  | ---                          | **Domain restrictions**                                                             | "If preferences are single-peaked (e.g., left-right spectrum), majority rule is strategy-proof. G-S fails here—hypotheses matter!"             |

  ---

  ### **Predictable Pitfalls & Solutions**  
  1. **Manipulator’s Lie Fails:**  
     - **Risk:** In Round 2, a manipulator might not be pivotal.  
     - **Mitigation:** Pre-test preference profiles to ensure ≥1 group has a clear pivot (e.g., 2-1-1-1 split). If still inert, say: "Your lie didn’t matter *this time*, but the *incentive* existed—what if others had voted differently?"  

  2. "**These Aren’t My Real Preferences!**"  
     - **Risk:** A student rejects point cards as artificial.  
     - **Mitigation:** Pre-empt this: "Your card defines your interests **for this game**. In real voting, we can’t assume others share our preferences—that’s why G-S uses ‘any configuration.’"  

  3. **Chaotic Rule-Patching (Round 3):**  
     - **Risk:** Groups design overly complex rules, wasting time.  
     - **Mitigation:** Give a 3-option menu (Borda, Runoff, Approval). Cap discussion at 5 min.  

  4. **Dictatorship Backlash:**  
     - **Risk:** Students reject dictatorship as "not a real voting rule."  
     - **Response:** "Exactly! That’s the point—G-S says it’s the *only* strategy-proof ‘rule,’ hence the impossibility."  

  ---

  ### **Why This Works**  
  - **Pivotality Achieved:** Small groups ensure voters are decisive repeatedly.  
  - **Stakes Feel Real:** Silly outcomes + "Democracy Czar" prize create investment.  
  - **Theorem as Explanation:** Students experience manipulation *first*; G-S explains *why* it happened.  
  - **Trade-off Personalized:** They *chose* fairness, then *suffered* manipulation, then *rejected* the only escape (dictatorship).  

  By the end, students will viscerally grasp that strategy-proofness requires sacrificing fairness—and that the filing cabinet is their own reality.
