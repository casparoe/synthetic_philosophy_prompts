  - For each table (4-5 students): 
    - 4 outcome cards (labeled A, B, C, D)
    - Preference cards for each student (each card assigns a point value to each outcome, e.g., 4, 3, 2, 1 for a student's ranking from best to worst). We must design the preferences so that there is potential for strategic voting and so that in at least one table, the sincere plurality vote leads to the median voter's worst outcome.
  - Ballots (blank slips of paper or a form for ranking)
  - A way to tally votes (whiteboard or paper at each table)
  - A prize for the overall winner (e.g., control of the end-of-term session, or bonus points) — but note we are using points in the game, so we need to explain how game points convert to the prize.

  ## Setup (15 minutes)
  - Divide the class into groups of 4-5. (For 18 students: four groups of 4 and one of 5, or three groups of 5 and one of 3, but 3 might be too small? Let's aim for four groups of 4-5.)
  - Explain the setting: Each group will hold a series of elections to choose one of four outcomes (A, B, C, D). Each student in the group is assigned a preference ordering over the outcomes (via a point card). The points are: 4 for best, 3 for next, 2 for next, 1 for worst. The goal of each student is to maximize their own points.
  - The prize: The student with the highest cumulative points across all rounds (in the entire class) wins the prize (e.g., control of the end-of-term session). This creates a small but real incentive.
  - Each group must agree on a voting rule to use for the first round. They can choose any rule they like (plurality, Borda, runoff, etc.). The rule must be defined clearly.

  ## Timeline

  ### Round 1: Sincere Voting (15 minutes)
  - After the rule is chosen, each student votes sincerely (according to their point card) in the first election.
  - The group tallies the votes and announces the outcome. Each student records the points they received for that outcome (based on their card).
  - The instructor circulates and notes the outcomes. In particular, we want at least one group where the outcome is the worst for the median voter (we'll design the preference profiles to ensure this).

  ### Round 2: Introduce a Manipulator (15 minutes)
  - Before Round 2, the instructor takes one student from each group aside (or passes a note) and gives them a special instruction: "You are allowed to vote strategically in the next round to try to get a better outcome for yourself. Remember, you are trying to maximize your own points." (Alternatively, if we don't want to single out, we can tell everyone they are allowed to vote strategically now, but then we risk everyone doing it and the effect being too chaotic. Let's single out one per group to ensure at least one manipulator.)
  - The group uses the same voting rule as in Round 1.
  - They vote again (with the same preferences) but now the manipulator (and possibly others) may vote insincerely.
  - Tally the votes and announce the outcome. Record points.

  ### Round 3: Change the Rule (15 minutes)
  - The group now discusses and chooses a new voting rule (they have seen the problem with the first one). They must agree on a rule they think is less manipulable.
  - They vote again (same preferences) but now without any special instruction (so strategic voting is allowed by anyone). However, we don't plant a manipulator this time — let them act on their own.
  - Tally and record.

  ### Round 4: The Dictatorship (10 minutes)
  - The instructor now intervenes and says: "I have a rule that is strategy-proof: dictatorship. We will assign one person in the group to be the dictator. The dictator's top choice wins, regardless of others' votes. Let's run one round with this rule."
