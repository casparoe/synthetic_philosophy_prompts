prompt: |-
  I'm on an advisory panel for our state health department, and somehow I got handed the job of writing the "precautionary rule" we're supposed to apply to the gene-drive mosquito question — whether to recommend field trials of a strain meant to crash the local malaria vector population. The thing is, the more I stare at the standard move here, the more it looks like it can be aimed at anything. I can say don't release, the ecological fallout is uncertain; or say release, the malaria deaths are certain and the delay is the harm. The other side just says the mirror image back at me. Our chair keeps saying well, it's the precautionary principle, as if that settled which way it cuts. So before I write a word of the actual rule, I want the spec: what would a theory of precaution — as a real decision rule for a regulator, not a vibe — actually have to deliver?

  Give me the requirements list, with the case or consideration behind each one. The cases I care about: the gene drive itself; a drug with a rare side effect that only shows up at scale; a chemical where we have a bad animal signal and basically nothing else; and a case where the precautionary call turned out to be the thing that killed people — delayed approvals, moratoriums on stuff that later looked fine — because a rule that can't handle that last one is a bias, not a principle. Distinctions I don't want collapsed: risk vs. genuine uncertainty vs. we don't even know what to look for; precaution vs. old-fashioned prevention of a known hazard; reversible vs. irreversible harms; who has to carry the burden of proof and why; and whether a pile of small individually-acceptable risks can add up to something the rule has to catch. I also want the meta-requirements — that it be action-guiding (tells me yes or no, not be careful), that it not be re-aimable at every available option, and that it not quietly smuggle in a cost-benefit calculation while pretending to be a different kind of principle.

  Then tell me which of these are non-negotiable and which are just the taste of one camp, and — the part I actually need — whether some subset of them can't all hold at once. My hunch is that action-guiding and doesn't-just-reduce-to-expected-utility are in a fight, but I dont know if that's a real result or just me being confused. And say which single requirement knocks out the most otherwise-popular versions of the principle. Skip the scorecard of the named versions, I'll do that in the meeting.
reasoning: |-
  Okay, the user is on an advisory panel for the state health department and needs to draft a "precautionary rule" for gene-drive mosquitoes. They're frustrated because the precautionary principle seems too vague and can be used to argue either side. They want a clear set of requirements for what a real decision rule should deliver, not just a vague vibe.

  First, I need to understand their main concerns. They mentioned several cases: gene drives, drugs with rare side effects, chemicals with bad animal signals but little human data, and instances where precaution caused harm by delaying approvals. They want distinctions between risk, uncertainty, and ignorance; precaution vs. prevention; reversible vs. irreversible harms; burden of proof; and cumulative risks. Also, meta-requirements like being action-guiding, not re-aimable, and not smuggling in cost-benefit analysis.

  The user is likely dealing with pressure from different stakeholders. Their deeper need is to create a rule that's defensible, rigorous, and avoids bias. They might be worried about being blamed if things go wrong, so they need a framework that justifies decisions logically. They also want to prevent the principle from being misused to block innovation or cause unintended harm.

  Key requirements should address the cases they mentioned. For instance, handling uncertainty in gene drives involves irreversibility and unknown unknowns. The drug case requires detecting rare side effects at scale, which ties into monitoring and reversibility. The chemical case with poor data needs clear evidentiary thresholds. Historical harm cases highlight the need to weigh inaction risks.

  Meta-requirements are crucial. Action-guiding means the rule must lead to a decision, not just caution. Non-reaimability prevents flipping the principle to oppose any action. Avoiding hidden cost-benefit ensures it's distinct. But these might conflict, especially action-guiding vs. no hidden CBA. If the rule has to be decisive without quantifying costs/benefits, it might rely on qualitative thresholds, which could still imply implicit valuations.

  Identifying non-negotiables: Handling uncertainty/ignorance, distinguishing prevention, irreversibility, burden of proof, and cumulative risks are essential. Meta-requirements like action-guiding and non-reaimability are also critical. But the trickiest part is avoiding hidden CBA while being action-guiding. Most versions sneak in some form of cost-benefit, so the "no hidden CBA" requirement might knock out many popular approaches. 

  The user's hunch about action-guiding conflicting with no expected utility reduction is valid. If the rule avoids quantitative analysis, it needs clear criteria for when to act or not, which might be arbitrary. For example, irreversibility could be a trigger, but determining thresholds without implicit trade-offs is hard. 

  In conclusion, the user needs a framework that explicitly addresses their cases, incorporates the meta-requirements, and acknowledges the trade-offs. Highlighting that "no hidden CBA" is the major stumbling block can help them scrutinize existing versions during their meeting. They should focus on structuring the rule with clear thresholds for irreversibility and uncertainty while being transparent about unavoidable trade-offs.
answer: |-
  Here’s a requirements list for a rigorous precautionary **decision rule**, tailored to your cases and distinctions. Each requirement includes the underlying case/consideration and whether it's non-negotiable (NN) or contested (C). Conflicts are highlighted at the end.

  ---

  ### **Core Requirements for a Precautionary Decision Rule**
  1. **Handle Genuine Uncertainty & Ignorance**  
     *Requirement:* Must distinguish and respond differently to:  
     - **Risk** (known probabilities, e.g., drug side effects at scale)  
     - **Uncertainty** (known unknowns, e.g., chemical with bad animal data)  
     - **Ignorance** (unknown unknowns, e.g., gene-drive ecological cascade).  
     *Case:* Gene drives (ignorance) vs. drug side effects (risk).  
     *NN:* Yes. A rule that treats all uncertainties alike fails.

  2. **Explicitly Address Irreversibility**  
     *Requirement:* Weight harms that are irreversible (extinction, permanent ecosystem shift) more heavily than reversible ones (temporary pollution).  
     *Case:* Gene drives (potentially irreversible) vs. drug pause (reversible if monitoring exists).  
     *NN:* Yes. Core to precaution vs. standard risk management.

  3. **Avoid Conflating Precaution with Prevention**  
     *Requirement:* Prevention addresses *known* hazards (e.g., seatbelts). Precaution addresses *unresolved* threats. The rule must not trigger for well-characterized risks.  
     *Case:* Malaria nets (prevention) vs. gene-drive release (precaution).  
     *NN:* Yes. Prevents misuse for routine regulation.

  4. **Assign & Justify Burden of Proof**  
     *Requirement:* Specify who must prove safety/risk (proponent? regulator?) and *why* (e.g., irreversibility, unequal power, historical harm patterns).  
     *Case:* Chemical with weak animal data – industry must fund studies?  
     *NN:* Yes. A rule without this is vacuously flexible.

  5. **Account for Cumulative/Risk-Risk Tradeoffs**  
     *Requirement:* Consider if inaction causes greater harm (e.g., malaria deaths during delay) or if small risks aggregate (e.g., endocrine disruptors).  
     *Case:* Delayed drug approval killing people; chemical "safe at low doses" but ubiquitous.  
     *NN:* Yes. A rule ignoring tradeoffs is dangerous.

  6. **Require Dynamic Monitoring/Reversibility Measures**  
     *Requirement:* Mandate plans to detect emerging harms and reverse course if possible (e.g., "stop switches" in gene drives, phased rollouts).  
     *Case:* Drug rare side effects (post-market surveillance); gene drives (containment).  
     *NN:* Yes. Distinguishes responsible precaution from blanket bans.

  ---

  ### **Meta-Requirements**
  7. **Action-Guiding**  
     *Requirement:* Outputs a clear regulatory decision (approve/deny/phase) under defined thresholds – **not** "be cautious."  
     *Case:* Must say "no field trial without reversibility tech" vs. "study risks carefully."  
     *NN:* Yes. Avoids regulatory paralysis.

  8. **Non-Reaimability**  
     *Requirement:* Cannot be weaponized to support *all* positions (e.g., both "release" and "don’t release" gene drives).  
     *Case:* Your core frustration – PP used symmetrically by both sides.  
     *NN:* Yes. Essential for legitimacy.

  9. **No Smuggled Cost-Benefit Analysis (CBA)**  
     *Requirement:* Must not implicitly rely on quantified probabilities/utilities. Justification must be based on uncertainty, irreversibility, or burden of proof – **not** hidden "expected utility."  
     *Case:* If "potential ecological harm" secretly weighs costs of release vs. malaria deaths, it’s CBA in disguise.  
     *NN:* Contentious (see conflicts below).

  ---

  ### **Non-Negotiables vs. Contested**
  - **Non-Negotiables (NN):** 1, 2, 3, 4, 5, 6, 7, 8.  
    *Why:* Without these, the rule is either incoherent, dangerous, or non-functional.  
  - **Contested (C):** 9 (No Smuggled CBA).  
    *Why:* Some argue precaution *must* integrate CBA under uncertainty; others insist it’s philosophically distinct.

  ---

  ### **Key Conflicts: Where Requirements Clash**
  - **Action-Guiding (7) vs. No Smuggled CBA (9):**  
    To be action-guiding under ignorance (e.g., gene drives), you *must* make implicit tradeoffs ("irreversible harm potential" vs. "lives lost to delay"). **Pure precaution (strict 9) often collapses into inaction** – violating 7. Solutions require *procedural* thresholds (e.g., "halt if irreversibility > X and uncertainty > Y"), but setting X/Y smuggles in values.

  - **Burden of Proof (4) vs. Risk-Risk Tradeoffs (5):**  
    Assigning burdens to industry (e.g., "prove this chemical safe") risks delaying beneficial tech (e.g., a vaccine). But *not* assigning it may expose publics to harm. **Balancing requires explicit ethical priors** (e.g., "burden shifts when harm is catastrophic and irreversible").

  - **Non-Reaimability (8) vs. Handling Ignorance (1):**  
    True ignorance (unknown unknowns) makes symmetric arguments easy ("we don’t know if it’s safe/unsafe"). **Breaking symmetry demands anchoring to non-utilitarian norms** (e.g., "irreversible harm to commons shifts burden to intervenor").

  ---

  ### **The Requirement That Knocks Out Most Popular Versions**
  **#9 (No Smuggled CBA)** eliminates:  
  - The "Wingspread Statement" PP (vague, allows re-aiming).  
  - EU-style PP (often devolves to CBA-lite).  
  - "Proportionality" versions (requires weighing costs/benefits).  

  **#8 (Non-Reaimability)** kills weak versions like UNESCO’s 2005 formulation ("When human activities may lead to morally unacceptable harm..."). *Morally unacceptable* is re-aimable by definition.

  ---

  ### **The Unavoidable Tension**
  Your hunch is correct: **Action-guiding precaution without smuggled CBA is impossible under deep uncertainty**. To decide, you *must* compare types of harm (e.g., "irreversible ecological damage" vs. "statistical lives lost"), which is qualitative CBA. The solution is to:  
  1. **Anchor thresholds to non-utilitarian principles** (e.g., "no irreversible harm to common resources without consensus safety evidence"),  
  2. **Make tradeoffs explicit** (e.g., "delay permitted only if harm from delay is reversible").  

  This gives you a rule that’s *procedurally* precautionary while admitting that **all decisions under uncertainty are value-laden**. Your gene-drive rule might read:  
  > *"Release prohibited if: (a) potential harm is irreversible AND (b) uncertainty is unresolved (ignorance or high uncertainty) AND (c) reversibility tech is absent. Else, phased release with monitoring required."*  

  This satisfies 1-8 while minimizing (but not eliminating) smuggled CBA. For the drug moratorium case, it forces asking: *"Was the harm from delay irreversible? Could monitoring have reversed course?"* If yes, the rule failed; if no, it worked.
