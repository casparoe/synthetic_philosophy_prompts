  - "errors": array of objects, each {"location": ..., "what_they_said": ..., "problem": ..., "correction": ..., "severity": "minor" or "major"} — in the order the issues come up in the answer. "location" points at the sentence or passage, "what_they_said" is a short paraphrase, "problem" says what's wrong with it, "correction" says what the right thing is.
  - "overall_comment": two or three sentences I can paste at the bottom of the feedback.

  Keep it tight, and spend the most words on the errors list.
