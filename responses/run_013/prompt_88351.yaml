prompt: |-
  My grandmother died last month and I'm trying to translate a poem she wrote in her native language for the funeral. It's a sestina, so the six end-words have to repeat in that fixed spiral, and one of them is a word that does double duty as wound and gift in her dialect. My friend who translates poetry says you have to keep the sestina form, even if you have to pick six English words that only approximate the meanings, becuase the form is doing the emotional work. My other friend, a poet, says that's nonsense: if the wound/gift word is the point, you should break the form and write a free-verse translation that lets that word land. They're both smart and neither is a strawman. Write the dialogue between them, in the car on the way to the funeral. Let them actually respond to each other about what counts as the same poem. Don't quote any real poem; just make up the details as needed.
