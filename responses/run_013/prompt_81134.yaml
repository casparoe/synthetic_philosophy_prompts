prompt: |-
  I am working through the literature on scientific continuity — the family of views holding that something survives when one successful theory is replaced by another, and that this something explains why the successor inherits the predecessor's predictive successes. Before I commit to any of them (epistemic structural realism, ontic structural realism, the Ramsey-sentence strategy, and the entity-realist and selective-realist alternatives), I want the specification on the table: what any adequate account in this area must deliver, with each requirement tied to the case or consideration that forces it.

  Work through the following, and add whatever I have missed.

  Cases it must get right. The retention of the wave equation and of Fresnel's laws of reflection and refraction through the replacement of the elastic-solid aether by an electromagnetic theory of light; the fate of phlogiston, and of caloric, where Carnot's cycle survived a theory of heat that did not; the status of the classical gene once molecular genetics arrives, where it is contested whether the successor preserved the predecessor's units or replaced them; and the electron, which was both referred to as an entity and embedded in equations, so that an account licensing only structural continuity must either explain that persistence or admit that a blanket ban on entity talk is untenable.

  Distinctions it must respect. Structure versus ontology; preservation of a predecessor's structure versus mere reproduction of its predictions; continuity as a historical fact versus continuity as a licence for present-day belief; and the difference between what a theory says exists and what its formalism commits it to.

  Constraints it must satisfy. It must not simply dismiss the pessimistic induction as a historical generalization, nor the no-miracles intuition that motivates realism in the first place. It must pick out the preserved structure by something stronger than a cardinality condition, or the thesis risks being trivially satisfiable by any successor whatsoever. It must say whether the preserved structure is a feature of our theories or of the world, and if the latter, what it is about the world that allows successive false theories to track it. And it must apply to a live theory, not only to settled history: I want to know what to believe about a current research programme, not merely how to narrate the nineteenth century.

  One constraint I have not seen stated, and want treated as a requirement in its own right: the verdict about what is being carried over must be available to a working scientist at the time, not only to a historian who already knows which successor won. An account whose continuity claims can be issued only retrospectively is, for my purposes, not an account of what is preserved but a redescription of what happened.

  For each requirement, give the consideration that forces it, and mark it non-negotiable or camp-specific. Flag any pair you believe cannot be jointly satisfied — I have a suspicion about where the conflict lies, but I want yours. Then name the single requirement that does the most to narrow the field, and which of the positions above it eliminates. I will do the scoring myself; the list is the deliverable.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're working on scientific continuity—what stays when theories change. They mentioned several views like structural realism, Ramsey sentences, and entity realism. They want a list of requirements for any adequate account, tied to cases, distinctions, constraints, and even a new constraint they proposed.

  First, I need to cover all the cases they listed: wave equation retention in light theories, phlogiston and caloric, the classical vs. molecular gene, and the electron. Each case tests different aspects—structural retention, ontological shifts, entity persistence. For example, the wave equation shows structure surviving ontology change, while phlogiston's complete rejection tests when nothing carries over. The gene case is contested, so any account must handle ambiguity. The electron is key for entity realism because it persists despite theory changes.

  Next, distinctions: structure vs. ontology, preservation vs. reproduction, historical vs. epistemic continuity, and theory's commitments vs. assertions. These are crucial because confusing them leads to flawed accounts. Like, mistaking predictive success for structural preservation might overlook ontological losses.

  Constraints are tougher. The account must address pessimistic induction (past theories failed, so why trust current ones?) and no-miracles argument (success implies truth). Also, preserved structure needs stronger criteria than cardinality—otherwise, any successor trivially satisfies continuity. They want the account to specify if structure is in theories or the world, explaining how false theories track reality. Plus, applicability to live theories, not just historical cases.

  The user's added constraint is vital: continuity judgments must be accessible to scientists at the time, not just historians. This prevents hindsight bias and makes the account actionable for ongoing research. If an account can't do this, it's merely descriptive, not prescriptive.

  Now, checking for conflicts. The biggest tension is between the "at the time" constraint and avoiding triviality. Scientists need criteria to identify preservable elements without knowing the successor. But without knowing which theory succeeds, how can they judge what's preserved? Cardinality conditions are too weak, but stronger criteria might require future knowledge. This is a real challenge.

  I recall structural realism struggles here. Epistemic structural realism (ESR) might rely on mathematical structures, but how can a scientist know which structures will survive? Ontic structural realism (OSR) faces issues with entities—electrons persist, but caloric didn't. Entity realists like Hacking focus on manipulability, but that's not always clear-cut. The Ramsey-sentence approach formalizes theoretical content, but its success depends on the successor theory, which isn't known in advance.

  The user suspects a conflict. I think the "at the time" requirement clashes with needing non-trivial criteria. Positions that require knowing the successor (like some Ramsey interpretations) might falter. ESR and OSR need to specify structures without hindsight, which is tricky. Selective realism based on working posits (like electrons) might work if scientists can identify manipulable entities, but genes are ambiguous, so it's not foolproof.

  The most narrowing requirement is probably the "at the time" constraint. It forces accounts to provide clear, present criteria for continuity, eliminating approaches that rely on retrospective analysis. For example, some versions of the Ramsey-sentence strategy or structural realism that depend on future theory might not make the cut. Entity realism could be more viable if it emphasizes current manipulability, but even that has uncertainties.

  Also, handling the gene case's ambiguity is tough. If an account must decide whether units were preserved or replaced, but historians debate it, how can a present theory adjudicate? Perhaps the account should allow for partial continuity or degrees, but that might weaken the position.

  In summary, the user needs a robust framework that respects historical cases, clear distinctions, addresses key philosophical arguments, avoids triviality, applies to current science, and allows real-time judgments. The toughest trade-off is between non-trivial criteria and present accessibility. Positions that can't meet both, like certain structuralist or Ramsey approaches, might be eliminated or need refinement. The electron case supports entity realism, while structuralism might handle wave equations better. Balancing these is key to narrowing the field.
answer: |-
  Below is a comprehensive specification of requirements for an adequate account of scientific continuity, structured by your categories. Each requirement is tied to its motivating case/consideration, marked for negotiability, and flagged for conflicts. The most narrowing requirement is identified at the end.

  ---

  ### **I. Cases It Must Get Right**
  1. **Wave Equation & Fresnel's Laws Retention**  
     - *Requirement*: Explain how mathematical structure (equations, laws) persists despite radical ontological change (elastic aether → EM fields).  
     - *Force*: Demonstrates structural continuity without entity preservation.  
     - *Status*: **Non-negotiable** (core test for structural realism).  

  2. **Phlogiston/Caloric Fate**  
     - *Requirement*: Explain why *nothing* substantive (entities or structure) was preserved in phlogiston’s case, but *structural relationships* (Carnot’s cycle) survived caloric’s rejection.  
     - *Force*: Tests accounts that overgeneralize continuity; distinguishes abandonment from structural preservation.  
     - *Status*: **Non-negotiable** (eliminates naively optimistic accounts).  

  3. **Classical vs. Molecular Gene**  
     - *Requirement*: Resolve ambiguity: decide whether molecular genetics preserved "units of heredity" (continuity) or replaced them with DNA segments (discontinuity).  
     - *Force*: Highlights contested ontology in successor theories; tests selectivity criteria.  
     - *Status*: **Non-negotiable** (probes entity realism vs. structuralism).  

  4. **The Electron**  
     - *Requirement*: Explain why reference to the electron as an *entity* persisted despite theory change (e.g., Thomson’s "corpuscle" → QFT point particle).  
     - *Force*: Challenges structuralism to accommodate robust entity continuity or admit ontological commitments.  
     - *Status*: **Non-negotiable** (forces engagement with entity realism).  

  ---

  ### **II. Distinctions It Must Respect**
  1. **Structure vs. Ontology**  
     - *Requirement*: Separate preservation of relational/mathematical structure (e.g., wave equation) from preservation of entities (e.g., aether).  
     - *Force*: Cases like EM theory vs. aether demand this split.  
     - *Status*: **Non-negotiable** (foundational for structural realism).  

  2. **Preservation vs. Mere Prediction Reproduction**  
     - *Requirement*: Ensure continuity involves *inheriting* the predecessor’s structure/entities, not just replicating predictions via new means.  
     - *Force*: Prevents ad hoc accounts (e.g., claiming phlogiston "survives" because combustion is still explained).  
     - *Status*: **Non-negotiable** (avoids triviality).  

  3. **Historical Fact vs. Epistemic Licence**  
     - *Requirement*: Distinguish describing past continuity from justifying present belief in preserved elements.  
     - *Force*: Motivations differ: history explains theory change; epistemology justifies realism.  
     - *Status*: **Camp-specific** (e.g., structural realists prioritize epistemology; selective realists blend both).  

  4. **Asserted vs. Committed Ontology**  
     - *Requirement*: Account for what a theory *explicitly claims* (e.g., "caloric fluid") vs. what its formalism *requires* (e.g., Carnot’s thermodynamic relations).  
     - *Force*: Caloric’s case shows survival of unacknowledged structural commitments.  
     - *Status*: **Non-negotiable** (prevents oversight of implicit content).  

  ---

  ### **III. Constraints It Must Satisfy**
  1. **Address Pessimistic Induction (PI) & No-Miracles Argument (NMA)**  
     - *Requirement*: Reconcile PI (past theories false, so current likely false) with NMA (success implies truth). Show how continuity avoids PI without dismissing it.  
     - *Force*: Core tensions in scientific realism; failure here collapses the project.  
     - *Status*: **Non-negotiable** (defines the problem space).  

  2. **Non-Trivial Preservation Criterion**  
     - *Requirement*: Define preserved structure/entities with criteria stronger than "predictive similarity" or cardinality (e.g., not just matching equations count).  
     - *Force*: Avoids vacuity (any successor meets a weak criterion).  
     - *Status*: **Non-negotiable** (eliminates trivial accounts like "approximate truth").  

  3. **Specify Nature of Structure**  
     - *Requirement*: State whether structure is theoretical (human constructs) or ontic (mind-independent). If ontic, explain how false theories track it.  
     - *Force*: Wave/electron cases suggest mind-independent structure; demands metaphysical clarity.  
     - *Status*: **Camp-specific** (e.g., ontic vs. epistemic structural realism diverges here).  

  4. **Applicability to Live Theories**  
     - *Requirement*: Provide guidance for *ongoing* research (e.g., quantum gravity), not just historical cases.  
     - *Force*: Realism must inform current theory choice, not just historiography.  
     - *Status*: **Non-negotiable** (practical relevance test).  

  5. **Continuity Judgments Accessible "At the Time"**  
     - *Requirement*: Scientists must identify preservable elements *before* successor theories are confirmed.  
     - *Force*: Prevents hindsight bias; ensures accounts guide *progress*, not just retroactive description.  
     - *Status*: **Non-negotiable** (your added requirement; eliminates backward-looking accounts).  

  ---

  ### **IV. Conflicts Between Requirements**
  - **Key Conflict**: **Non-Trivial Criterion vs. At-the-Time Accessibility**  
    - *Why*: Strong criteria (e.g., formal symmetries, entity manipulability) may require future knowledge to apply rigorously (e.g., knowing which structures "survive"). But scientists need criteria usable *now*.  
    - *Example*: In 1900, could a physicist identify preservable elements of Maxwell’s EM theory without knowing QED? Structural accounts (Ramsey sentences, ESR) struggle here without hindsight.  
    - *Suspicion Confirmed**: This tension destabilizes positions relying on post-hoc formalisms (e.g., Ramsey-sentence realism) and favors entity-based selectivity (e.g., "working posits" like electrons).

  ---

  ### **V. Most Narrowing Requirement**
  - **Requirement**: **Continuity judgments must be accessible to working scientists *at the time***.  
  - *Why it narrows the field*:  
    1. Eliminates **Ramsey-sentence realism** (depends on logical reconstruction requiring successor theories).  
    2. Challenges **Epistemic Structural Realism (ESR)** if it relies on identifying "essential" structure pre-successor (e.g., how could a 19th-century scientist isolate "preservable" structure from Fresnel’s theory?).  
    3. Favors **Entity Realism** (e.g., Hacking’s "if you can spray it, it exists") or **Selective Realism** (e.g., "working posits" like the electron), which prioritize criteria usable in practice (e.g., manipulability, explanatory role).  
  - *Eliminates*: Ramsey-sentence approaches and some versions of ESR unable to meet the "at the time" constraint without circularity.

  ---

  ### **Summary Deliverable**
  | **Requirement**                     | **Forced By**                          | **Status**          |
  |-------------------------------------|----------------------------------------|---------------------|
  | 1. Wave equation retention          | EM vs. aether transition               | Non-negotiable     |
  | 2. Phlogiston/caloric asymmetry     | Ontological vs. structural loss        | Non-negotiable     |
  | 3. Gene continuity verdict          | Contested ontology in biology          | Non-negotiable     |
  | 4. Electron entity persistence      | Theory-change-resistant entities       | Non-negotiable     |
  | 5. Structure/ontology distinction   | Aether → EM fields case                | Non-negotiable     |
  | 6. Preservation ≠ prediction reprod.| Phlogiston abandonment                 | Non-negotiable     |
  | 7. Historical vs. epistemic continuity | Realism’s justificatory aims         | Camp-specific      |
  | 8. Asserted vs. committed ontology  | Survival of Carnot’s cycle sans caloric| Non-negotiable     |
  | 9. Address PI & NMA                 | Meta-arguments for/against realism     | Non-negotiable     |
  | 10. Non-trivial preservation        | Risk of vacuity in structural accounts | Non-negotiable     |
  | 11. Specify structure’s nature      | Wave/electron cases                    | Camp-specific      |
  | 12. Apply to live theories          | Need for realist guidance in science   | Non-negotiable     |
  | 13. **At-the-time accessibility**   | **Prevent hindsight bias**             | **Non-negotiable** |

  **Conflict Flag**: Requirements 10 (Non-Trivial Criterion) and 13 (At-the-Time Accessibility) are in tension.  
  **Most Narrowing Requirement**: 13 (At-the-Time Accessibility) → eliminates Ramsey-sentence realism and strains ESR. Favors entity/selective realism.  

  Use this to score positions: ESR and ontic structural realism must confront the "at the time" challenge; entity realism must handle structural cases (e.g., Carnot); Ramsey realism likely fails.
