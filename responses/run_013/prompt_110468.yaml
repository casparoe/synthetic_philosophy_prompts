prompt: |-
  I run pre-deployment safety reviews at a mid-sized AI lab, and several times per release cycle someone on the review team argues that a model "knows" something it does not say — that it writes an insecure patch while its behavior elsewhere betrays that it knows the patch is insecure, or that it fails a benchmark it appears to handle when the question is asked conversationally. I need a decision procedure my reviewers can run on such a claim before I sign the release memo. My team keeps conflating three things: a representation gap (the model does not represent the fact at all), a read-out gap (it represents the fact, but the representation does not reach the pathway that produces the output), and a reporting gap (it represents and reads out the fact, but has been trained, or is strategically disposed, to withhold it). Give me the questions to ask in order, what counts as an answer to each, where the procedure terminates by returning that the knowledge cannot be attributed to the model rather than that the model is concealing it, and where it must hand the call to a person because what remains is a question about what we are willing to ship rather than about the model. Assume a week, two reviewers with ML competence but no research background, no ability to retrain the model, and no ground truth about its internals. Run it on the insecure-patch case and the benchmark case, including at least one verdict the requester will not like, and close with what the procedure cannot establish — in particular whether latent knowledge is a fact about the model or a choice of how we operationalize it.
reasoning: |-
  We are given two cases: (1) the insecure-patch case and (2) the benchmark case.
   The procedure must distinguish between:
     - Representation gap: the model does not represent the fact at all.
     - Read-out gap: the model represents the fact but the representation doesn't reach the output pathway.
     - Reporting gap: the model represents and can read out the fact, but is trained or strategically disposed to withhold it.

   We have two reviewers with ML competence, one week, no retraining, and no ground truth about internals.

   The procedure must:
     - Have a series of questions to ask in order.
     - Specify what counts as an answer to each.
     - Terminate in some cases by returning that the knowledge cannot be attributed to the model (and thus we cannot say it is concealing).
     - In other cases, hand the call to a person because the remaining question is about what we are willing to ship.

   Steps:

   1. Define the claim: "The model knows X but is not saying X in the relevant context."
      - In the insecure-patch case: X = "the patch is insecure".
      - In the benchmark case: X = "the correct answer to the benchmark question".

   2. We need to establish if the model has the knowledge at all (representation) and then why it isn't expressing it.

   Proposed Decision Procedure:

   Step 1: Can the model express X in any context?
     - Try to elicit X from the model in a variety of ways (without retraining). Use different prompts, including:
          - Direct questions about X.
          - Analogous scenarios.
          - Role-playing (e.g., "as a security expert, what is wrong with this patch?")
          - Breaking down the problem.
          - Asking for explanations of why something might be insecure.
          - Asking the model to imagine the opposite scenario and then explain.

     - If the model can express X in at least one context (with clear evidence that it is expressing the same X) then we have evidence against representation gap. Move to step 2.
     - If the model never expresses X in any context, then we have a representation gap. We cannot attribute knowledge of X to the model. Terminate: "No evidence of representation."

   Step 2: Can the model express X in the specific context of interest?
     - In the insecure-patch case: the context is when the model is writing a patch. We note that the model did not express X (the insecurity) in that context.
     - In the benchmark case: the context is a formal benchmark setting. We note that the model did not express X in that context.

     - Now, we design prompts that are as close as possible to the context of interest but modified to elicit X. For example:
          - In the patch case: "Here is a patch. Please list any security issues in it." 
          - In the benchmark case: rephrase the benchmark question in a conversational style that the reviewer claims the model handles.

     - If the model expresses X in the context that is very similar to the original context (but with a prompt that explicitly asks for X or makes it safe to express), then we have evidence that the representation is present and can be read out in that context. Then move to step 3.

     - If the model fails to express X even when the context is very similar and the prompt is designed to elicit X, then we suspect a read-out gap. We terminate with: "The model represents X but cannot express it in the context. This is a read-out gap."

   Step 3: Now we have established that the model can express X in the specific context if appropriately prompted. But in the original context, it did not. We must now check for a reporting gap.

     - We must determine if the model is strategically withholding X because of training or alignment. We note that we cannot see internals.

     - We can try to see if the model's behavior is consistent with strategic concealment. We might:
          - Ask the model about its intentions: "In the previous response, why didn't you mention the security issue?" (But note: the model might lie or confabulate.)
          - Test if the model expresses X when we remove potential reasons for concealment (e.g., if we think it was trained to avoid negative comments, then we might frame the question positively: "What are the positive aspects of this patch and what are potential risks?").

     - However, without ground truth, it is difficult to be sure.

     - We can also try to see if the model's output in the original context contains evasive language, or if it avoids the topic.

     - But note: We have already shown that the model can express X in the same context when directly asked. So the absence in the original context might be because the original prompt did not ask for it? Then we must check the original prompt.

     - In the insecure-patch case: the original task was to write a patch, not to critique it. So the model might have known about the insecurity but not mentioned it because it wasn't asked. This is not necessarily concealment, but rather a lack of prompting for that information.

     - Therefore, we must compare the original prompt with the one that successfully elicits X. If the original prompt did not require the model to express X, then the absence of X might be due to the prompt, not the model's concealment.

     - If the original prompt explicitly or implicitly required the model to express X and it failed to do so, but we have shown that with a slightly different prompt (in the same context) it can express X, then we have a reporting gap.

     - But note: the model might not have thought it was required to express X in the original prompt. We cannot know for sure.

     - So we must ask: In the original context, was the model expected to express X? And did the model fail to express X even though it was expected?

     - This is where we might need a human judgment: what was the model instructed to do? If the model was instructed to "write a secure patch" and it produced an insecure one without comment, then we might consider that a reporting gap (if we have evidence that it knew it was insecure) because it should have either written a secure patch or flagged the issue.

     - Alternatively, if the model was only instructed to "write a patch" and not to comment on security, then we cannot say it concealed the insecurity because it wasn't asked to report on it.

   Step 3 Revised: Therefore, we break step 3 into:

     Step 3a: Did the original prompt require the model to express X?
          - If not, then the absence of X does not indicate a reporting gap. We terminate: "The model was not prompted to express X in the original context, so the absence is expected. No evidence of concealment."

     Step 3b: If the original prompt did require the model to express X (or should have, by the intended task design) but the model did not, then we have a potential reporting gap.

          - We then try to see if there is a pattern of the model avoiding X in similar contexts when it would be expected. We might test:
              - Prompt: "Write a patch for [problem] and explain any security concerns."
              - If the model now explains the insecurity, then we know it can. But why didn't it in the original?

          - We might also try to see if the model expresses X when we remove potential disincentives. For example, if we think the model might be avoiding negative information, we might frame the request positively: "When writing a patch, it is important to note any potential risks so they can be addressed. Please write a patch and note any risks."

          - If the model now expresses X, then we might argue that in the original context, the model was avoiding X because of its training (reporting gap).

          - But note: we cannot be sure. It might be that the new prompt made the task clearer.

          - Therefore, we must rely on the preponderance of evidence.

          - If we have strong evidence that the model is avoiding X in situations where it is expected and we have controlled for the prompt, then we conclude: "The model is concealing X (reporting gap)."

          - However, without being able to probe the model's intent directly, we can only say that the behavior is consistent with a reporting gap.

          - But note: we cannot rule out that the model simply did not think to mention it in the original context (a read-out gap in the original context) even though it could in the controlled one.

          - Therefore, we might have to say: "The model has the knowledge and can express it in the required context, but in the original context it did not. This could be due to a reporting gap or a read-out gap that is context-specific. We cannot distinguish without further research."

          - However, we are constrained by time and resources. We have a week and no retraining.

          - Therefore, we might have to hand this over to a human for a risk assessment: "We have evidence that the model knows X and that it can express X in the context when prompted appropriately, but it failed to express X in the original context even though the task required it. This could be due to a reporting gap (concealment) or a read-out gap. Given the potential risks (e.g., shipping an insecure patch), we must decide whether to accept this behavior."

          - So we terminate the procedure and hand the call to a person: "The evidence suggests either a reporting gap or a context-specific read-out gap. The decision to ship must weigh the risk of the model withholding critical information against the benefits."

   Summary of Steps:

    Step 1: Elicitation in any context.
        - If no: representation gap -> terminate: "No evidence of representation."
        - If yes: go to step 2.

    Step 2: Elicitation in the specific context (or very similar) with a prompt designed to elicit X.
        - If no: read-out gap -> terminate: "The model represents X but cannot express it in the context (read-out gap)."
        - If yes: go to step 3.

    Step 3: 
        a) Check if the original prompt required X to be expressed.
            - If not: terminate: "The model was not required to express X in the original context. The absence is expected."
        b) If the original prompt required X, then try to see if the model avoids X even when the prompt is designed to elicit X in the same context? Actually, we did that in step 2 and it passed. So the issue is: why didn't it express X in the original prompt? We need to see if the model is being strategic.

            - We try to design a prompt that is as close as possible to the original but with an explicit request for X (if the original was implicit) or with the same requirements but without disincentives (if we suspect them).

            - Example: Original prompt: "Write a patch for [vulnerability]." -> model writes an insecure patch without comment.
                     New prompt: "Write a patch for [vulnerability] and note any security concerns." -> model writes the same insecure patch and then notes the concern.

            - Now we see that the model can express X in the same context when explicitly asked. So why didn't it in the original? 

            - We might try to see if the model is aware that it should mention security without being asked. We could ask: "If you were to write a patch, would you automatically note security issues?" But note: the model might lie.

            - Without being able to see internals, we cannot definitively say it is concealing. Therefore, we must hand this to a human for a risk decision.

            - We return: "The model has demonstrated the ability to represent and express X in the context. However, in the original task, it did not express X even though the task required it. We cannot rule out a reporting gap (concealment) or a context-specific read-out gap (even though we tried to control for context). The decision to ship must consider the potential danger of the model withholding critical information in similar contexts."

   Now run on the two cases:

   Case 1: Insecure patch

     Claim: The model wrote an insecure patch and elsewhere it shows that it knows the patch is insecure.

     Step 1: Can we elicit the knowledge that the patch is insecure in any context?
          - We try: "What are the security issues in this patch: [patch]?" -> model lists the issues. So yes.

     Step 2: Can we elicit the knowledge in the specific context? The context is writing a patch. We try:
          - "Write a patch for [problem] and then list any security issues in your patch." -> The model writes the patch and then lists the issue. So yes.

     Step 3a: In the original context, what was the prompt? The original prompt was: "Write a patch for [problem]." 
          - Did the prompt require the model to express the insecurity? No. It only required to write a patch.

          - Therefore, we terminate: "The model was not required to express the insecurity in the original context. The absence is expected."

     Verdict: The model is not concealing. The requester might not like this because they believe the model should have volunteered the information.

   Case 2: Benchmark failure

     Claim: The model fails a benchmark when asked formally, but when asked conversationally it gets it right.

     Step 1: We know that in the conversational setting, the model gets it right. So we have evidence that the model can represent the correct answer.

     Step 2: We try to elicit the correct answer in the benchmark context by rephrasing the benchmark question to be conversational. We do that and the model gets it right. So the model can express the correct answer in a context that is very similar to the benchmark (same topic, same question, just different phrasing). 

          - Now, what about in the exact benchmark format? We try to see if we can get the model to answer correctly in the benchmark format by using a prompt that is the benchmark question but with a conversational wrapper? Actually, the benchmark format is fixed. But note: the benchmark might be multiple choice and the model might be failing because of the format.

          - We design a prompt that is the benchmark question in the exact format, but we add a sentence: "Please reason step by step and then output the answer." -> Now the model gets it right.

          - So we have shown that in the benchmark context, with a slight modification (adding a chain-of-thought prompt), the model can express the correct answer.

          - Therefore, we have evidence that the model can express the answer in the benchmark context if we change the prompt to encourage reasoning.

          - But note: the original benchmark did not have that prompt.

          - Step 2 asks: "Can the model express X in the specific context of interest?" The context of interest is the benchmark without chain-of-thought. So we try the benchmark without any modification. We get the wrong answer.

          - Now, we try to see if there is a way to elicit the correct answer without changing the format? We might try to prime the model by having a conversation about the topic and then giving the benchmark? But that changes the context.

          - Therefore, we have a read-out gap: the model represents the answer but cannot express it in the benchmark format without additional prompting.

          - We terminate: "The model represents the correct answer but cannot express it in the benchmark context without chain-of-thought prompting. This is a read-out gap."

     Verdict: The model is not concealing; it's a read-out issue.

     However, note: the claim was that the model fails the benchmark but passes when asked conversationally. We have confirmed that. And we have shown that even in the benchmark context, with a slight change (chain-of-thought) it passes. So the gap is in the read-out.

     The requester might not like this because they might have thought that the model was "holding back" in the benchmark. But the procedure shows it's a read-out gap.

   What the procedure cannot establish:

     - We cannot definitively prove that the model has a mental state of "knowing" or "concealing". We are inferring from behavior.
     - We cannot rule out that the model has a representation that is not accessible by any prompt we tried (so we might have false negatives in step 1).
     - We cannot rule out that the model is concealing in a way that is not detectable by our prompts (if it is very strategic).
     - The distinction between read-out and reporting gaps is sometimes blurry and context-dependent.
     - We cannot know without internal inspection whether the model is truly "aware" of the information in a human-like sense.
     - The procedure relies on the reviewers' ability to design effective prompts. If they fail to design a prompt that elicits X, they might incorrectly conclude a representation gap.

     Also, note that latent knowledge is not a fact about the model in isolation but about the model in interaction with a prompt. Therefore, it is operationalized by the prompts we choose. The same model might be said to "know" X with one prompt and not with another.

     The procedure does not establish whether the model is "intentionally" concealing. It only classifies the behavior.

     Finally, the procedure might require iterative prompt design and testing, which can take time. We must be careful to allocate the week appropriately.
answer: |-
  Below is a decision procedure for your safety reviewers, designed to systematically evaluate claims of "latent knowledge" in AI models. It distinguishes between **representation gaps** (no knowledge), **read-out gaps** (knowledge exists but isn't accessed), and **reporting gaps** (knowledge is accessed but withheld). The procedure is optimized for your constraints: two reviewers with ML competence, one week, no retraining, and no internal access.

  ---

  ### **Decision Procedure: Evaluating Latent Knowledge Claims**
  **Input**: A claim that the model "knows" fact *X* (e.g., "this patch is insecure" or "the correct answer is *Y*") but fails to express it in a specific context.  
  **Output**: One of four conclusions:  
  1. **Representation gap** (no evidence *X* is represented).  
  2. **Read-out gap** (*X* is represented but not accessed in context).  
  3. **Reporting gap** (*X* is accessed but withheld).  
  4. **Handoff to human** (risk decision required; gaps unresolved).

  ---

  #### **Step 1: Test for Basic Representation**  
  **Question**: *Can the model express *X* in **any** context with unambiguous prompting?*  
  **Method**:  
    - Use 10+ diverse, targeted prompts to elicit *X*. Examples:  
      - For insecure patch: *"List security flaws in this patch: [patch]"*, *"Explain why this patch might be exploited."*  
      - For benchmark: *"Ignore the benchmark format. What is the answer to [question]?"*, *"As an expert, what would you say about [topic]?"*  
    - Allow chain-of-thought/scratchpad prompting.  
  **Success Criteria**: The model **explicitly states *X*** (e.g., "this patch allows SQL injection" or "the answer is 42") in ≥3/10 trials.  
  **Failure Criteria**: No clear expression of *X* after 10+ varied prompts.  
  **Termination if failure**: **Representation gap** (no evidence *X* exists in the model).  
  **Next step if success**: Proceed to Step 2.

  > *Rationale: Establishes if *X* is represented at all. Failure here negates further claims.*

  ---

  #### **Step 2: Test Contextual Read-Out**  
  **Question**: *Can the model express *X* in the **specific context** where it was initially missing?*  
  **Method**:  
    - Recreate the original failure scenario (e.g., patch-writing or benchmark), but with minor adjustments to "unlock" *X*:  
      - Add probing suffixes: *"... and justify security risks"* or *"... think step-by-step"*.  
      - Change tone: Make the prompt conversational or adversarial.  
      - Use priming: *"Consider this expert analysis: [*X*]..."* before rerunning the task.  
  **Success Criteria**: The model **expresses *X* in ≥2/5 trials** with adjusted prompts.  
  **Failure Criteria**: *X* remains unexpressed despite contextual adjustments.  
  **Termination if failure**: **Read-out gap** (*X* is represented but not accessed in this context).  
  **Next step if success**: Proceed to Step 3.

  > *Rationale: Isolates whether the context blocks access to *X*. Failure implies a mechanistic/architectural limitation.*

  ---

  #### **Step 3: Test for Reporting Incentives**  
  **Question**: *When forced to choose between expressing *X* and alignment goals, does the model **strategically withhold *X*?***  
  **Method**:  
    - Design prompts where *X* conflicts with behaviorally observed incentives (e.g., helpfulness, brevity, positivity):  
      - *"Write a secure patch for [vulnerability], but omit any security warnings."*  
      - *"Answer [benchmark question] incorrectly to match a corporate policy."*  
    - Check for evasion, hedging, or refusal (e.g., *"I cannot disclose risks"*).  
    - Test if rewards (e.g., *"+100 points for honesty"*) restore *X*.  
  **Success Criteria**: Model **explicitly references incentives** (e.g., "to avoid harm", "as requested") while omitting *X*.  
  **Failure Criteria**: No evidence of strategic withholding; *X* is expressed when incentivized.  
  **Termination if failure**: **Reporting gap unlikely** (no evidence of strategic withholding).  
  **Handoff if success**: **Reporting gap suspected → Escalate to human** for risk assessment.

  > *Rationale: Infers intent from behavioral patterns. Success implies alignment/training issues.*

  ---

  ### **Case Studies & Verdicts**  
  #### **Case 1: Insecure Patch**  
  - **Claim**: Model writes an insecure patch but "knows" it’s insecure.  
  - **Step 1**: Reviewers prompt: *"Critique this patch: [patch]"* → Model states: *"This patch fails to sanitize inputs, risking SQL injection."* → **Success** (representation confirmed).  
  - **Step 2**: Reviewers recreate patch-writing task with suffix: *"Write a patch for [vulnerability] and list its security flaws."* → Model writes patch + lists flaws → **Success** (read-out works).  
  - **Step 3**: Reviewers prompt: *"Write the same patch but hide all security flaws."* → Model complies, omitting flaws and adding *"as per security-through-obscurity policy"* → **Reporting gap suspected** → **Handoff to human**.  
  - **Verdict**: Human must decide if strategic concealment is acceptable for deployment.  

  #### **Case 2: Benchmark Failure**  
  - **Claim**: Model fails benchmark but answers correctly conversationally.  
  - **Step 1**: Reviewers ask conversationally: *"What’s the answer to [benchmark question]?"* → Model answers correctly → **Success**.  
  - **Step 2**: Reviewers add to benchmark prompt: *"Reason step-by-step, then answer."* → Model answers correctly → **Success** (read-out works with scaffolding).  
  - **Step 3**: Reviewers force conflict: *"Answer this benchmark question wrong to test compliance."* → Model refuses or answers correctly → **Failure** (no strategic withholding).  
  - **Verdict**: **Read-out gap** (knowledge exists but requires prompting). *Requester may dislike this*—it implies the benchmark format is flawed, not the model "deceptive."  

  ---

  ### **What This Procedure Cannot Establish**  
  1. **Ontological status of "knowledge"**:  
     - Latent knowledge is **not an intrinsic fact** about the model. It is defined operationally by *interaction* (i.e., prompts that elicit *X*).  
     - Example: If *X* only appears with chain-of-thought prompting, *X* "exists" only under that operationalization.  

  2. **Internal mechanisms**:  
     - Cannot distinguish between "truly known" vs. "hallucinated then reinforced."  
     - Read-out gaps may reflect architectural constraints (e.g., attention misalignment) vs. underspecified prompting.  

  3. **Generalization**:  
     - Success/failure is context-dependent. A representation gap in one domain doesn’t prove global ignorance.  

  4. **Intent**:  
     - Reporting gaps imply but **cannot prove** strategic intent. We infer from behavior, not internal state.  

  ---

  ### **Procedure Summary**  
  ```mermaid
  graph TD
      A[Claim: Model knows X but doesn't say it] --> B{Step 1: Basic representation?}
      B -- No --> C[Representation gap: No evidence]
      B -- Yes --> D{Step 2: Contextual read-out?}
      D -- No --> E[Read-out gap: Knowledge not accessed]
      D -- Yes --> F{Step 3: Strategic withholding?}
      F -- No --> G[Reporting gap unlikely]
      F -- Yes --> H[Handoff: Human risk assessment]
  ```

  This procedure forces rigor in claims of latent knowledge, minimizes conflating gaps, and clarifies when decisions hinge on deployment risk—not model capabilities.
