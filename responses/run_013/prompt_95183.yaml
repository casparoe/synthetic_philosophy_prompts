prompt: |-
  Right, I'm a psych PhD student who's gone too far down the methods rabbit hole, and I want a sanity check on my comittments before I say any of this out loud in a seminar. Here's where I've landed.

  1. Evidence is a Bayesian business. What data tell you is how much they should move your credences, and a p-value isn't a measure of evidence at all. I also take the likelihood principle seriously: if two experiments hand you the same likelihood function, they hand you the same evidence, so it shouldn't matter that you'd planned to run twenty more participants or that you peeked at the data halfway through.

  2. The replication crisis is mostly a selection problem. You can fiddle with your covariates, your exclusion criteria, your outcome measure, and only the version that landed under p < .05 makes it into the paper. So the fix is pre-registration and registered reports — lock the analysis before you see the data.

  3. I don't really believe in a single true effect size for most of what we study. Effects are context-bound, and the picture of one number sitting out there waiting to be estimated is a fiction. So when someone fails to replicate a study in a slightly different setup with a different population, they haven't refuted anything — they've tested a different claim.

  4. That said, when a big batch of our published findings got re-run and only a minority came back, I read that as evidence that a lot of what got published was simply false. That's the whole reason I care about any of this.

  5. I'm suspicious of priors in psychology. I don't think anyone can honestly put a number on how likely it is that ego depletion is real, so when I see a Bayesian paper with a prior over the effect size I basically read the prior as made up. A well-powered pre-registered frequentist study with the analysis plan filed in advance strikes me as more trustworthy than a Bayesian analysis whose prior was picked because it looks neutral.

  And one more thing I've been chewing on, which I don't think is a standard view so much as something I've invented in my notes — I've started writing as if every study has two readings. There's the evidential reading: what does this data do to my credences. And there's the audit reading: if a whole field works like this, what fraction of what it publishes is true. I can't tell whether that distinction is doing real work or whether I'm just dressing up the thing everyone already knows.

  So: which of 1–5 are actually pulling against each other, which pairs only look like they clash, and what's the cheapest way back to a package that hangs together? Rank the tensions by how bad they are — I'd rather be told that one of them is fatal than get a list where everything is equally worrying. For each genuine one, say what has to give and what I lose by giving it. And at the end, tell me which single change cleans up the most mess, even if it isn't the one I'd enjoy making. I don't need a lecture on the replication crisis, I need the audit.

  Write it in British English please — my supervisor is pedantic about -ise and I'll never hear the end of it.
reasoning: |-
  Okay, the user is a psych PhD student deep into methodology, seeking a sanity check on their five points before presenting them. Let me start by understanding each point and how they might conflict.

  First, point 1 is Bayesian-focused: evidence changes credences, p-values aren't evidence, and the likelihood principle is key. Point 2 stresses pre-registration to combat selection bias in the replication crisis. Point 3 says effect sizes aren't fixed; context matters. Point 4 acknowledges that failed replications show many published findings are false. Point 5 distrusts Bayesian priors in psychology, favoring pre-registered frequentist studies.

  Looking for tensions. Point 1's Bayesianism clashes with point 5's suspicion of priors. How can they reconcile evidence as Bayesian with distrusting made-up priors? Maybe they need to accept that some Bayesian approaches use objective priors, but that might not satisfy their audit concerns.

  Point 2's pre-registration and point 3's contextual effects also conflict. Pre-registration fixes selection bias but assumes a fixed analysis, while point 3 says effects are context-dependent. If the context changes, pre-registered analyses might not capture the true effect, making replications tricky. The user needs to decide if pre-registration still adds value despite context shifts.

  Point 4's view that failed replications indicate false findings seems at odds with point 3. If effects are context-bound, a failed replication doesn't mean the original was false, just different. But the user cites replication failures as evidence of false publications. They need to clarify what "false" means here—perhaps the original context wasn't as general as claimed.

  The audit vs. evidential reading distinction might help. Pre-registration addresses the audit trail, ensuring that published results aren't just selection artifacts. Bayesian updating handles individual evidence. But point 5 prefers frequentist methods for audit because priors are subjective. So the user might need to separate when to use each approach: Bayesian for evidence, frequentist for audit.

  The biggest tension is between points 1/5. Accepting Bayesian evidence but distrusting priors is a core conflict. They might compromise on using uninformative priors or empirical Bayes methods. But that loses the pure Bayesian principle. Alternatively, they could reframe priors as part of the audit, requiring pre-specification.

  The second tension is between points 2/3. Pre-registration fixes p-hacking but ignores context. They could argue that pre-registration still prevents bias, even if effects are contextual. Replications then test generalizability, not just truth.

  Point 4 and 3's conflict might be resolved by noting that many published findings overgeneralize. The original study's context wasn't as narrow as point 3 suggests, so replications reveal when effects don't hold even in similar settings. Thus, audit trails show when claims were too broad.

  The cheapest fix? Emphasizing the audit/evidential distinction. It separates individual belief updating from field-wide credibility. Pre-registration serves the audit, while Bayesian methods serve evidence. This resolves several clashes by allocating methods to different purposes.

  Key changes: Accept that priors can be part of the audit if pre-specified. Use pre-registration to combat selection bias, acknowledging contextual effects by framing replications as generalizability tests. Admit that failed replications often indicate overgeneralized claims, not necessarily false ones in the original context. This maintains coherence without abandoning any core points.
answer: |-
  Right then, let's get this sorted. You've got a coherent core straining at a few seams. The tensions exist, but they're manageable with some conceptual tidying. Here’s the audit, prioritised by severity:

  **Ranked Tensions & Resolutions (Most Severe First):**

  1.  **Tension: Point 1 (Bayesian Evidence/Likelihood Principle) vs. Point 5 (Suspicion of Priors)**
      *   **Severity:** High. This is the core methodological friction.
      *   **The Clash:** You champion Bayesian updating (evidence moves credences) and the Likelihood Principle (data is data, regardless of intentions). But you fundamentally distrust the *starting point* for that updating in psychology – the prior. If priors are "made up" or impossible to quantify honestly for complex psychological constructs (like ego depletion), then the entire Bayesian machinery feels untrustworthy *for audit purposes*. You're left in a bind: evidence *is* Bayesian, but the inputs are suspect.
      *   **What Has to Give:** You need to loosen your stance on *either* the necessity of subjective priors for evidence *or* the absolute distrust in *any* form of prior specification for audit. Point 1 (strict Bayesianism) is the more fundamental commitment here, but Point 5 (audit suspicion) is driving your practical preference for frequentism.
      *   **What You Lose:**
          *   *If you soften Point 1:* You lose the pure Likelihood Principle justification for why stopping rules/optional stopping don't affect *evidence*. You might need to accept some frequentist operating characteristics (like error rates under repeated sampling) *do* matter for audit, even if they don't change the evidential meaning *for you personally*.
          *   *If you soften Point 5:* You lose the clean dismissal of Bayesian analyses with ostensibly "neutral" priors. You might need to accept *some* forms of objective or weakly informative priors (e.g., Cauchy(0, 0.707), Normal(0, 1) on a standardised scale *if justified*) as less arbitrary *for specific, constrained questions* than you currently find them, especially if pre-specified. Or accept that the prior *is* part of the model specification needing justification/audit.
      *   **Cheap Fix Direction:** Embrace the **Evidential vs. Audit distinction explicitly**. For *your personal evidential reading*, stick with Point 1. But for the *audit reading* (field-level credibility), acknowledge that Point 5 is largely correct *for complex theories* and that pre-specified frequentist methods (or *pre-specified* Bayesian methods with *explicitly justified* priors) offer a more robust *audit trail*. The Likelihood Principle holds for evidence, but audit requires controlling procedures *known* to be vulnerable to selection effects.

  2.  **Tension: Point 3 (Context-Bound Effects) vs. Point 4 (Failed Replications as Evidence of False Findings)**
      *   **Severity:** Moderate. This is less a direct contradiction and more a potential inconsistency in interpretation.
      *   **The Clash:** You argue effects aren't universal constants (Point 3), so a failure to replicate isn't a refutation but a test of a different claim. Yet, you interpret the low replication rate in large-scale projects (Point 4) as evidence many published findings were "simply false". If effects are context-bound, isn't *every* replication attempt, strictly speaking, a test of a slightly different claim? How can failure then indicate the *original* was false?
      *   **What Has to Give:** Your interpretation of "false" in Point 4. It likely needs refinement beyond a simple binary true/false for the effect *in its original context*.
      *   **What You Lose:** The stark, satisfying clarity of "many published findings were false". You gain nuance but lose rhetorical punch.
      *   **Resolution:** Reconcile them by arguing that the *original published claims* were often framed (implicitly or explicitly) as more general or robust than the highly context-bound reality allows. The replication failures expose this *overgeneralisation* or lack of robustness. The *specific* original finding might be "true" in its *very specific* context (Point 3), but the *published claim* (implying broader applicability or robustness) is what is "false" in the sense of being unsupported or misleading (Point 4). The failed replications are evidence *against the generality or robustness* that was claimed or implied, even if not against the specific original instantiation. The low replication rate signals a field-wide problem of overclaiming based on contextually fragile effects.

  3.  **Tension: Point 2 (Pre-registration as Fix) vs. Point 3 (Context-Bound Effects)**
      *   **Severity:** Moderate (but often overblown).
      *   **The Clash:** Point 2 advocates locking down analyses *before* seeing data to prevent selection bias. Point 3 argues effects are context-bound. Doesn't locking down the analysis risk being inflexible and missing the true, context-dependent nature of the effect? Doesn't it potentially force a square peg (complex reality) into a round hole (pre-registered analysis)?
      *   **What Has to Give:** A rigid interpretation of pre-registration. It doesn't preclude exploration *after* confirming the primary pre-registered result. Point 3 needs to acknowledge that *some* stability or predictability is necessary for science to function, even if effects are contextual.
      *   **What You Lose:** The idea that pre-registration captures the "pure" truth. You gain robustness against bias at the cost of potential initial inflexibility to complex reality.
      *   **Resolution:** Pre-registration primarily addresses *selection bias* (Point 2, the audit problem), not the ontological status of effects (Point 3). It ensures the primary test of the *pre-specified hypothesis* in the *pre-specified context* with the *pre-specified sample/analysis* is unbiased. The context-bound nature (Point 3) means replication/extension work is *essential* to map the boundaries, and exploratory analyses (clearly labelled as such) post-confirmation are valuable. Pre-registration stops you from *pretending* an exploratory finding was your primary hypothesis all along. It doesn't stop you from discovering context dependencies *after* establishing an initial, unbiased result.

  4.  **Tension: Point 1 (Likelihood Principle) vs. Point 2 (Need for Pre-registration)**
      *   **Severity:** Low/Apparent Only.
      *   **The Clash:** The Likelihood Principle says stopping rules don't change the evidence. Pre-registration often includes stopping rules. Why bother pre-registering the stopping rule if it doesn't affect the evidence?
      *   **What Has to Give:** The idea that pre-registration is *only* about the evidential meaning for a single study. It isn't.
      *   **Resolution:** Pre-registration is primarily an *audit* tool, not an evidential one. While the Likelihood Principle holds for *your* evidential updating (Point 1), knowing the stopping rule (and analysis plan) is crucial for *auditing* the research *process* across many studies (Point 2 & your Audit Reading). It tells you if the researcher behaved in a way that inflates Type I error rates *across their career or the field*, even if, for *this specific dataset*, the likelihood is the same. Pre-registration combats *selection* at the study design/procedure level, which the Likelihood Principle, dealing only with the data *in hand*, doesn't address. They operate on different levels (evidence vs. process).

  **Your Audit/Evidential Distinction: Real Work or Dressing Up?**

  It's **doing real work**, and it's crucial for resolving the tensions above (especially 1v5 and 1v2). It's not entirely novel (it echoes the difference between personal epistemology and institutional norms, or exploratory vs. confirmatory), but explicitly framing it as "Evidential Reading" (Bayesian updating, Likelihood Principle) vs. "Audit Reading" (field-level credibility, control of error rates, prevention of selection bias, requiring pre-specification) is powerful. It allows you to:

  *   Be a Bayesian in your *interpretation of data* (Evidential).
  *   Advocate for pre-registered, frequentist-leaning *procedures* for published confirmatory research (Audit).
  *   Acknowledge context-dependence (Evidential & Ontological) while demanding rigorous tests of *specific, pre-specified* claims (Audit).
  *   Accept that a replication failure *might* just indicate a different context (Evidential/Ontological) while arguing that widespread failures signal a field-level audit problem of overgeneralisation or bias (Audit).

  **The Single Change That Cleans Up the Most Mess (Even if Unpleasant):**

  **Fully embrace and explicitly define the Evidential vs. Audit distinction throughout your framework.**

  *   **Why it cleans up:** It directly resolves the severe tension (1v5) by allowing you to maintain Bayesianism for evidence while justifying your preference for pre-specified (often frequentist) methods for audit. It elegantly resolves the apparent clash between the Likelihood Principle and pre-registration (1v2). It provides the nuanced language needed to reconcile context-dependence with replication failure concerns (3v4). It even gives a home for your distrust of subjective priors in audit contexts.
  *   **What it costs:** It requires acknowledging that the "pure" Bayesian evidential reading isn't sufficient for regulating a scientific field. You have to accept procedural/rules-based solutions (like pre-registration, emphasis on error rates in audit) that aren't strictly necessary for *your personal* belief updating but *are* essential for the health of the collective enterprise. It might feel like compromising philosophical purity for practical governance. It also requires careful communication to avoid sounding like you have a split personality.

  **Final Sanity Check Verdict:**

  Your package *can* hang together coherently. The key is rigorously applying your Evidential/Audit lens. Your instincts about selection bias (Point 2), context-dependence (Point 3), and the field-level problem signalled by replication failures (Point 4) are sound. Your distrust of subjective priors in psychology (Point 5) is justified *for the audit reading*. Your commitment to Bayesian evidence (Point 1) is philosophically solid *for the evidential reading*.

  **The cohesive package:** Science needs robust *audit trails* (pre-registration, registered reports, pre-specified analyses, focus on error rates in aggregate) to combat selection bias and ensure the credibility of its published record, especially given the context-bound nature of psychological effects and the demonstrable history of overgeneralisation/false positives. The *evidential meaning* of data for updating personal beliefs about specific hypotheses is governed by Bayesian principles and the Likelihood Principle, though honest prior specification for complex theories remains challenging and requires careful justification within the audit framework when used confirmatorily.

  Now go forth and seminar. Just lead with the Evidential/Audit distinction early. Your supervisor might still be pedantic, but at least your framework will be coherent. Best of luck.
