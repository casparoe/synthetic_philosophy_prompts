answer: |-
  Here's a head-to-head breakdown of endurantism vs. perdurantism on the cost of change, an analysis of your third option, and the gritty realities of where each view stumbles:

  **Head-to-Head: Paying for Change**

  1.  **Endurantism (Wholly Present):**
      *   **Cost:** Needs to explain how the *very same* object, wholly present at t1 and t2, can have incompatible properties (straight, bent). This forces either:
          *   **Time-Indexing Properties (Relationalism):** "The object has *straight-at-t1* and *bent-at-t2*." This treats the properties as relational to times. **Cost:** It denies genuinely intrinsic temporary properties. "Straight" becomes no more intrinsic than "to the left of Bob." Is this really explaining *change* in the object, or just describing different relational states? It arguably dissolves intrinsic change.
          *   **Adverbialism:** "The object is straight *t1-ly* and bent *t2-ly*." The *having* of the property is modified by time. **Cost:** This is often seen as metaphysically obscure or merely verbal gymnastics. What does "t1-ly" *mean* beyond just "at t1"? It risks being a restatement of the problem.
      *   **"Has a property at a time" vs. "Has a time-indexed property":** For the Endurantist, this is CRUCIAL. Insisting that the object simply "has the property (simpliciter) *at that time*" is core to maintaining that the object itself genuinely changes. Saying it "has a time-indexed property" is the relationalist move they often try to *avoid* (or reluctantly adopt) because it makes the property itself static and relational. The difference is between the object being fundamentally dynamic vs. the properties being fundamentally static but time-relational.

  2.  **Perdurantism (Temporal Parts):**
      *   **Cost:** Needs temporal parts. The straight-at-t1 part exists, the bent-at-t2 part exists. The whole worm *has* a straight part and a bent part. **Cost:** This posits additional entities (temporal parts) and fundamentally changes the ontology of objects. The "whole object" is never wholly present at any single time; you only ever directly encounter a temporal slice.
      *   **"Has a property at a time" vs. "Has a time-indexed property":** For the Perdurantist, "the object (the whole worm) has the property *at a time*" simply *means* "the temporal part located at that time instantiates the property." "Has a time-indexed property" isn't fundamentally different; it's just another way of saying the temporal part has that property. The temporal part *does* have the property simpliciter (e.g., the t1-slice is *straight*, full stop). The *whole worm* has the property derivatively, via its part. The distinction collapses into their ontology.

  **Winner on Initial Cost (for Change):** It's a tie with heavy caveats.
  *   Perdurantism pays a clear, upfront cost: temporal parts. It buys a simple account of properties (had simpliciter by parts) and avoids incompatible properties on one entity. Change is "at-at" variation across parts.
  *   Endurantism tries to pay *no* upfront cost (no parts) but gets immediately ambushed by the problem of incompatible intrinsics, forcing it into either relationalizing properties (denying genuine intrinsic change) or obscure adverbialism. Its cost is the complexity/weirdness of its solution *or* sacrificing the intuitive notion of intrinsic change.
  *   **Honest Take:** Perdurantism often feels cheaper *on this specific problem* because it tackles it head-on with a clear (if ontologically loaded) mechanism. Endurantism feels like it's trying to have its cake (no parts, wholly present) and eat it too (genuine change), often leading to maneuvers that seem costlier than advertised.

  **Your Third Option: Wholly Present, Time in the Fact**

  *   **The View:** The object is wholly present at t1 and wholly present at t2. It has the property *straight* simpliciter at t1 and the property *bent* simpliciter at t2. The "at t1" and "at t2" are not part of the object *or* the property, but part of the fundamental *facts*: there is the fact [Object O is straight at t1] and the fact [Object O is bent at t2]. Time is a constituent of the fact, not the object or its properties.
  *   **Is it Genuine?** Yes, it's a distinct flavor of Endurantism (sometimes called "Relationalism about Time" or "The Russellian View").
  *   **Does it Collapse?**
      *   **Into Perdurantism?** No. There are no temporal parts. The *whole* object is involved in each fact.
      *   **Into a "No Change" View?** **This is the critical pressure point.** What makes this *change*? It posits two distinct atomic facts: F1(O, straight, t1) and F2(O, bent, t2). But what connects F1 and F2 into the *history of a single, persisting, changing object O*? The view needs to add:
          *   **Primitive Persistence:** O just *is* the same entity at t1 and t2. There's no further analysis. This can feel like hand-waving ("O just *is* persistent!").
          *   **A "Thick" Object:** O has an essential identity that "flows through" time, participating in different facts at different times. This risks sounding mysterious or requiring a robust substance ontology.
      *   **The Problem:** While it avoids indexing properties *to the object*, it **relationalizes change *to facts*.** Change isn't a dynamic feature *of the object itself*; it's a feature of the sequence of facts the object participates in. The object itself, considered independently of time, doesn't *contain* change. Change becomes extrinsic to the object's being. This fails to capture the intuition that the object itself *undergoes* change. Is O at t1 *intrinsically different* from O at t2? On this view, only in the sense that it participates in different facts. The core "haecceity" or "thin particular" of O remains static, while its fact-based relations shift.

  **Where They Run Out of Steam (The Hand-Waving Exposed)**

  1.  **Endurantism (Classic & Your Fact Version):**
      *   **The Primitive Persistence/Identity Problem:** How does the *very same thing* persist through change without temporal parts or fact-relationalization? Saying "it just does" or "it's primitive" is the core hand-wave. What *grounds* its being the same entity at t1 (straight) and t2 (bent)? This becomes especially acute for the fact-based view – what connects O-in-F1 to O-in-F2 besides our stipulation?
      *   **The "No Intrinsic Change" Problem:** Both relationalized properties and the fact-based view struggle to deliver genuine *intrinsic* change. They often reduce change to variation in relational states (to times or to facts). Does the object itself *become different*, or is the difference located in the framework (time/facts) around it?
      *   **The Causality Problem:** If the object is wholly present at each instant, how does its state at t1 *cause* its state at t2? What is the mechanism of change *within* the enduring object? This often requires additional, sometimes awkward, metaphysics (e.g., powers, dispositions, immanent causation).

  2.  **Perdurantism:**
      *   **The "Wholly Present" Intuition:** It blatantly violates the strong intuition that we encounter and interact with whole objects *now*, not just temporal slices. Explaining ordinary language and thought ("I sat on *the chair*") requires constant paraphrase ("I sat on the chair's t-slice").
      *   **The Problem of Unity:** What binds the temporal parts together into a single persisting object? Glue? Spacetime worms? Similarity and causation? All proposed solutions have issues. Why is *this* sequence of slices a "chair" and that sequence mere "chair-slices"? This can feel like gerrymandering.
      *   **The Problem of Vagueness & Identity Over Time:** While it handles precise temporal boundaries well, it struggles with vague persistence (when exactly does the chair cease to exist?). Deciding which slices belong to the worm can seem arbitrary.
      *   **The Cost of Slices:** Positing instantaneous (or arbitrarily short-lived) temporal parts as concrete entities feels ontologically profligate and potentially unintuitive. Are there really trillions of "me-parts"?

  3.  **Your Fact-Based Endurantism (Specific Hand-Waving):**
      *   **The Static Core:** The biggest hand-wave is that the object itself, stripped of its participation in time-indexed facts, seems static and unchanging. The *change* is entirely located in the *facts*, not *in* the object. This makes change seem external and relational, not something the object *does* or *undergoes* intrinsically.
      *   **The Grounding of Fact Identity:** What makes [O is straight at t1] a fact *about O*? It relies on the primitive identity of O across facts, which is precisely what needs explaining.
      *   **Dynamic Flow:** It struggles even more than classic endurantism to capture the sense of dynamic flow or passage of time, as time is just a constituent of static facts.

  **Conclusion:**

  *   **Cost for Change:** Perdurantism pays its cost upfront (temporal parts) and solves the problem cleanly. Endurantism avoids the upfront cost but pays later with complex property-having or relationalization. Perdurantism often wins narrowly on *this specific problem*.
  *   **Property Talk:** The distinction between "has P at t" and "has P-t" is crucial *for Endurantism* trying to avoid relationalism; it largely collapses for Perdurantism.
  *   **Your Third Way:** It's a genuine, distinct form of Endurantism, avoiding temporal parts and time-indexed properties. **However, it collapses the idea of intrinsic change *within the object*.** Change becomes a feature of the sequence of atomic facts involving the object, not a feature of the object's own intrinsic nature over time. This pays for persistence by making change extrinsic and potentially primitive. It avoids collapsing into Perdurantism but risks collapsing into a view where objects themselves are static participants in a changing tapestry of facts.
  *   **Hand-Waving:** All views hand-wave somewhere:
      *   **Endurantism:** Waves hands furiously at primitive persistence/identity through incompatible properties.
      *   **Perdurantism:** Waves hands at the unity of temporal parts and the denial of "wholly present."
      *   **Fact-Based View:** Waves hands at the static nature of the object core and the grounding of its identity across facts.

  The choice often boils down to which bill you'd rather pay: the cost of temporal parts (Perdurantism), the cost of relationalized properties/adverbialism (Classic Endurantism), or the cost of extrinsic, fact-based change (Your View). None escape the need for *some* metaphysically loaded primitive or seemingly counterintuitive commitment. The "hand-wave" is fundamentally about how we ground persistence and identity through time and change itself.
