  We'll structure the table by regime and also include the two specific cases (voting and eating meat) where relevant.

  Table:

  | Regime        | Point of Disagreement                                                                                                                                 | Crux                                                                                                                                                                | Case/Argument/Result that both agree would bear on the crux                                                                                                                                                                                                      | Marginalist's Prediction                                                                 | Participant's Prediction                                                                 |
  |---------------|-------------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------|
  | Elastic       | Marginalist: An individual act is permissible if the expected harm it causes is below a de minimis threshold (which it typically is). Participant: The act is still wrong because it is part of a harmful practice. | Is the moral status of an act determined solely by the expected harm it causes (in isolation) or also by its role in a harmful practice?                           | A philosophical argument that establishes whether being part of a harmful practice, even when the individual contribution is negligible, can by itself make an act wrong.                                                                                         | The argument will show that without a non-negligible expected harm, the act is not wrong. | The argument will show that participation in a harmful practice is sufficient for wrongness. |
  | Threshold     | Marginalist: An individual act is wrong only if the expected harm (probability times magnitude) is non-negligible. Participant: The act is wrong because it risks triggering a catastrophe. | How should we morally evaluate acts that have a very low probability of causing a very large harm? Is the expected harm calculation the only relevant factor? | A decision-theoretic analysis of actions with low probability and high stakes, or a moral principle about risk imposition. (Example: Pascal's mugging and its avoidance.)                                                                                      | The analysis will support that only expected harm matters and that if it is negligible, the act is permissible. | The analysis will show that the risk of catastrophe is unacceptable even if the expected harm is small. |
  | Compensated   | Marginalist: An individual act is permissible because it makes no difference (the harm is invariant). Participant: The act is still wrong because it is part of a practice that causes harm. | Can an act be wrong if it is causally inert (i.e., it makes no difference to the harm) but is part of a harmful practice? | An analysis of complicity and participation: does moral responsibility require causal contribution or can it arise from participation alone? (Example: buying products from a sweatshop in a market where one's purchase is immediately offset by another buyer.) | The analysis will show that without causal contribution, the act is not wrong.           | The analysis will show that participation in a harmful practice is wrong even without individual causal impact. |
  | Voting        | Marginalist: Voting is permissible because the chance of being decisive is negligible and the cost of voting is low. Participant: Voting for a harmful policy is wrong because it is participation in a harmful system. | Does voting in a safe seat (where the outcome is virtually certain) constitute participation in a harmful practice? | An analysis of the symbolic and expressive nature of voting, and whether it constitutes endorsement of a candidate or policy. (Example: voting for a racist candidate in a safe seat.)                                                                            | The analysis will show that without a realistic chance of affecting the outcome, voting is not wrong. | The analysis will show that expressing support for a harmful policy is wrong regardless of the chance of being decisive. |
  | Eating meat   | Marginalist: A single beef meal is permissible because its impact on demand and thus on production is negligible. Participant: It is wrong because it is participation in the harmful practice of factory farming. | Does the causal chain (through market mechanisms) make the individual act a part of the harm, even if the effect is negligible? | An empirical and conceptual analysis of market mechanisms: does one's purchase in a large market have a non-negligible effect on production? If not, does it still constitute participation?                                                                     | The analysis will show that the effect is negligible and thus the act is permissible.    | The analysis will show that the act is part of the market demand that sustains the harmful practice. |

  Cruxes and Predictions:

  Note: The crux column in the table above already contains the crux for each row. The predictions are also included.

  Verbal Dispute:

  We judge that part of the dispute is verbal regarding the term "complicity". The participant uses "complicit" to mean participating in a harmful practice, regardless of individual causal impact. The marginalist uses "complicit" to imply causal contribution. Therefore, they are talking past each other on the meaning of complicity. Clarifying the definition of complicity would resolve part of the disagreement.

  Token vs. Type and Causal Ancestry vs. Mechanism:

  The user's two distinctions:

  1. **Causal ancestry vs. mechanism**: The marginalist focuses on whether the act is part of the causal ancestry (i.e., did it make a difference?). The participant focuses on whether the act is part of the mechanism (the practice that produces the harm). This distinction is useful and captures a core difference: the marginalist requires being in the causal ancestry, while the participant requires being in the mechanism.

  2. **Token vs. type**: The marginalist evaluates the token act (this particular flight) by its own consequences. The participant evaluates the token act as an instance of a type (flying) that is harmful when performed by many. This distinction is also useful and helps clarify the participant's view: the wrongness of the token act derives from the wrongness of the type when generalized.

  One Joint Statement for Voting and Eating Meat?

  We can cover both in the same joint statement because both involve the same structural regimes (voting is a threshold harm with an extremely low probability of being decisive, and eating meat is an elastic harm in a market that may have compensatory elements). However, we have addressed them separately in the table because the causal mechanisms differ (voting is a direct act in a threshold system, while eating meat operates through market dynamics). The marginalist might treat them similarly (both negligible) while the participant treats them similarly (both participation). But the regimes differ: voting is threshold, eating meat is elastic (with possible compensated elements, e.g., if supply is fixed in the short run). Therefore, we treat them in separate rows in the table.

  Burden of Proof on Negligibility:

  Both agree that if the expected harm of an individual act (in elastic: the harm per unit times the individual's contribution; in threshold: the probability of being decisive times the harm) is non-negligible, then the act is wrong. The dispute is over what constitutes negligibility. The marginalist holds that if the expected harm is below a de minimis threshold (which they believe it typically is), then the act is permissible. The participant holds that even if the expected harm is negligible, the act might still be wrong because of participation. So the burden of proving negligibility is on the marginalist in the sense that they must show the expected harm is indeed very small. But the participant must show that participation alone can make an act wrong even when the expected harm is negligible.

  The document should explicitly state that the dispute turns on whether negligibility (in expected harm) is sufficient to make the act permissible. The quantity to be estimated is the expected harm of the individual act. If it cannot be estimated, then the marginalist would say we should assume it is negligible (because we have no evidence it isn't), while the participant would say that the lack of evidence doesn't matter because participation is the issue.

