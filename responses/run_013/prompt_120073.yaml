  1. **Agreed Claims**: Numbered list (7 items as above).
  2. **Disagreements**: Table with 5 rows (elastic, threshold, compensated, voting, eating meat) and columns as above.
  3. **Cruxes**: Already in the table, so no separate section.
  4. **Verbal Dispute**: A note on complicity.
  5. **Use of Distinctions**: A note on the two distinctions provided by the user (causal ancestry vs. mechanism, token vs. type) and their relevance.

