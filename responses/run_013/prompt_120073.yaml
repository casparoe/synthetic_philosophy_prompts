answer: |-
  ### Joint Statement: Marginalist and Participant Adversarial Collaboration  

  **Preamble**: After two years of debate, we—the marginalist and the participant—agree that our dispute centers on whether individual acts in collective harm scenarios can be morally assessed *solely* by their detectable causal differences or *also* by their role in harmful practices. We affirm the scientific and moral distinctions below, structured by harm regimes (elastic, threshold, compensated). We identify unresolved disagreements, specify testable cruxes, and acknowledge verbal disputes. Progress requires empirical refinement (e.g., quantifying "negligible" effects) and conceptual clarity on complicity.  

  ---

  ### I. Agreed Claims  
  *(Substantive, mutually costly commitments)*  

  1. **Scientific Limits of Detectability**:  
     - In **elastic harms** (e.g., CO₂ emissions), science establishes that an individual act (e.g., one flight) makes a non-zero but often negligible difference to aggregate harm (linear proportionality).  
     - In **threshold harms** (e.g., ecological collapse), science confirms that individual acts carry a small, non-zero probability of being decisive but cannot predict the threshold location.  
     - In **compensated harms** (e.g., capped pollution markets), science proves aggregate harm is invariant to individual acts due to offsetting mechanisms (e.g., others’ increased emissions).  

  2. **Moral Predicates Are Distinct**:  
     - "Wrong" (an act’s impermissibility), "blameworthy" (deserving censure), "a reason against" (a defeasible consideration), and "complicit" (implicated in harm) are non-identical. An act may be complicit without being wrong (e.g., negligible elastic acts), or wrong without being blameworthy (e.g., unavoidable participation).  

  3. **Collective Obligation is Paramount**:  
     Policy/collective action (e.g., carbon taxes) is obligatory and often the only effective response to these harms. Individual acts matter instrumentally only when they influence collective outcomes (e.g., shifting norms or tipping thresholds).  

  4. **Burden of Proof on Negligibility**:  
     - Where the dispute hinges on "how small is too small" (e.g., expected harm in elastic/threshold regimes), the marginalist bears the burden of proving negligibility. If the expected harm *cannot* be estimated (e.g., in complex markets), the participant’s "participation" claim gains default weight.  
     - The key quantity for empirical resolution is the **expected harm per individual act** (elastic: marginal damage; threshold: probability × harm magnitude).  

  5. **Token vs. Type Distinction is Crucial**:  
     - Evaluating an act as a **token** (a specific instance) versus a **type** (a general practice) clarifies disputes. The marginalist focuses on tokens (did *this* flight cause harm?), the participant on types (is flying inherently harmful?). Science cannot resolve this moral divide.  

  6. **Causal Ancestry vs. Mechanism Matters**:  
     - **Causal ancestry** (did the act contribute to harm?) differs from **mechanism** (did it sustain the harmful practice?). This distinction explains disagreements: the marginalist demands ancestry, the participant requires mechanism membership.  

  7. **Progress Requires Regime-Specific Analysis**:  
     No universal rule applies across regimes. Progress demands:  
     - Empirical work: Quantifying expected harms and offset dynamics.  
     - Conceptual work: Defining "participation" and "complicity" in compensated cases.  

  ---

  ### II. Disagreements, Cruxes, and Predictions  
  *(Wording acceptable to each side; regimes structure the debate)*  

  | Regime       | Marginalist’s Position (Acceptable Wording)                                                                 | Participant’s Position (Acceptable Wording)                                                                 | Crux (Sub-question Settling This Would Move One Side)                                                                 | Case/Argument/Result Bearing on Crux (Both Agree)                                                                                          | Marginalist’s Prediction                                                                 | Participant’s Prediction                                                               |  
  |--------------|-------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|  
  | **Elastic**  | An individual act (e.g., one beef meal) is permissible if its expected harm is negligible (scientifically undetectable in practice). | An individual act is wrong because it instantiates a harmful type (e.g., animal exploitation), irrespective of negligible token effects. | Does token negligibility *always* negate wrongness, or can type-based wrongness apply?                                | A moral theory showing whether generalizing the act (e.g., universal beef-eating) collapses collective goals (e.g., sustainability).       | Theory will show negligibility negates wrongness; only blame persists for type.          | Theory will show participation in a harmful type is inherently wrong.                  |  
  | **Threshold**| An act (e.g., voting in a safe seat) is wrong only if its expected harm (probability × magnitude) exceeds a de minimis threshold. | An act is wrong if it risks contributing to catastrophe (e.g., electing extremists), regardless of low probability. | Is low-probability risk imposition *ever* permissible if the harm is severe but expected value is negligible?         | Decision theory modeling societal risk norms (e.g., Pascal’s Mugging paradox applied to climate thresholds).                              | Model will show negligible expected harm negates wrongness; only collective acts matter. | Model will show unacceptability of any avoidable risk for severe harms.               |  
  | **Compensated** | An act (e.g., exceeding a personal carbon quota in a capped market) is permissible as it causes no net harm (provably invariant). | An act is wrong because it perpetuates a harmful practice (e.g., commodifying pollution), even with net-zero token effects. | Can an act with *provably zero* causal difference be wrong solely due to participation in a harmful system?           | Philosophical analysis of complicity in invariant systems (e.g., purchasing sweatshop goods in a market with instant offsetting).         | Analysis will show participation without difference is not wrong; only policy change matters. | Analysis will show participation in unjust systems is inherently blameworthy.         |  
  | **Voting**   | Voting is permissible: decisive probability is negligible (e.g., 10⁻⁸ in safe seats), and cost/benefit favors expression. | Voting for harmful policies is wrong: it endorses injustice, and low decisiveness is irrelevant to complicity. | Does voting’s expressive/symbolic role dominate its causal role in moral assessment?                                  | Empirical study on whether voting shifts norms or policies independently of electoral outcomes (e.g., voter influence on party platforms). | Study will show voting’s impact is purely causal; low decisiveness negates wrongness.    | Study will show voting expresses complicity, creating indirect harm via legitimacy.   |  
  | **Eating Meat** | A single beef meal is permissible: its market impact is negligible (elastic regime), with no detectable effect on production. | A single beef meal is wrong: it financially supports and normalizes a harmful practice (industrial farming). | Do market mechanisms render individual consumer acts *causally inert* due to elastic offsets?                       | Economic model testing if individual demand changes affect supply (e.g., price elasticity of meat; short- vs. long-run effects).          | Model will confirm negligibility; no moral reason against token acts.                    | Model will show demand is non-negligible in aggregate, implicating each participant. |  

  ---

  ### III. Verbal Disputes, Regime Shifts, and Final Notes  
  **Verbal Dispute**: The term "complicit" is ambiguous. The marginalist uses it to imply *causal responsibility* (requiring detectable difference), while the participant uses it for *symbolic association* (membership in a harmful practice). Clarifying this would resolve ~30% of the disagreement.  

  **Regime-Dependent Shifts in Disagreement**:  
  - **Elastic**: Dispute peaks on "negligibility." Participant’s view survives if type-wrongness is defensible.  
  - **Threshold**: Dispute centers on risk ethics. Marginalist’s view weakens if low-probability/high-stakes risks are deemed unacceptable.  
  - **Compensated**: Marginalist’s position *survives* (no difference = no wrongness) but is morally unsatisfying; participant’s *survives* if complicity is independent of causality.  

  **Voting vs. Eating Meat**: Covered jointly here—both involve negligible differences but distinct regimes (voting: threshold; eating meat: elastic/compensated). No separate treatment is needed; the regime framework suffices.  

  **Cruxes and Empirical Demands**:  
  - **Burden of Proof**: If expected harm *cannot* be quantified (e.g., in complex markets), the participant’s participation-based claims default to stronger standing.  
  - **Progress Metrics**: Resolving a crux (e.g., the compensated-regime complicity analysis) would shift one position. Predictions above are falsifiable.  

  **Conclusion**: We agree this dispute is substantive, not confused. The marginalist prioritizes causal responsibility; the participant, ethical consistency in practices. Both views are coherent but diverge on the moral weight of undetectable contributions. Joint progress requires regime-specific science (e.g., quantifying "negligible" in elastic harms) and philosophy (e.g., defining complicity).  

  ---  
  *Signed,*  
  The Marginalist and The Participant  
  *Adversarial Collaboration, 2023*
