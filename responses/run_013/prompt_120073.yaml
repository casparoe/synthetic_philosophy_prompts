  We are creating a joint statement from the marginalist and the participant after an adversarial collaboration. The document will have three parts: agreed claims, points of disagreement, and cruxes. We will structure the agreed claims as a numbered list. The disagreements will be in a table with columns for the point of disagreement, the crux (the sub-question that would move at least one side), the case/argument/result that both agree would bear on the crux, and each side's prediction. We will consider the three regimes: elastic, threshold, and compensated harms. We will also address whether the dispute is partly verbal and note the user's two distinctions (causal ancestry vs. mechanism, token vs. type) and whether they are useful.

  Agreed Claims (numbered list, substantive, 4-12 items, but focus on quality and cost to both sides):

  1. **Scientific Fact about Aggregate Harm**: Both agree that in each of the three regimes (elastic, threshold, compensated), the aggregate of individual actions causes harm. However, the science does not establish that any single individual's action (taken in isolation) causes a detectable change in the harm in the elastic and compensated regimes (for elastic, the change is negligible; for compensated, it is exactly zero due to offset). In the threshold regime, the science establishes that each individual action carries a small probability of being decisive.

  2. **The Role of Probability in Threshold Harms**: Both agree that in threshold harms, each individual act has a non-zero (though possibly very small) chance of being the one that triggers the harm. Therefore, each act in a threshold harm scenario does make a difference in expectation (i.e., it increases the expected harm by a small amount).

  3. **Compensated Harms and Invariance**: Both agree that in compensated harms, the aggregate harm is invariant to any single individual's action (because of the offsetting mechanism). Therefore, a single act (such as one less flight in a capped emissions system) does not change the total harm.

  4. **Moral Predicates in Play**: Both agree that the moral predicates under discussion include: (a) the act being *wrong* (prohibited by morality), (b) the act being *blameworthy* (deserving of moral criticism), (c) the act providing a *reason against* performing it (a consideration that counts in the moral calculus), and (d) the act making one *complicit* in a harm (being part of a wrongful practice). They agree that these predicates are distinct and may apply differently.

  5. **Collective Action and Policy**: Both agree that collective action (e.g., policy changes, group efforts) is necessary to address the harms in question and that such collective action can be obligatory. They also agree that individual actions, even if not making a detectable difference, may be instrumentally valuable as part of a collective effort (e.g., by setting an example, building momentum, or expressing commitment).

  6. **The Need for Empirical Estimation**: Both agree that in the elastic and threshold regimes, the magnitude of the individual's causal contribution (or the probability of being decisive) must be estimated to determine whether it is negligible. They agree that if the expected harm caused by an individual act (in elastic: the linear effect; in threshold: the probability-weighted harm) is above a de minimis threshold, then the act is not negligible. They also agree that establishing such a threshold is a moral question, but the empirical estimation of the individual's impact is a scientific one.

  7. **Progress in the Debate**: Both agree that progress would be made by clarifying the conditions under which an individual act is: (a) causally relevant to a harm (even if undetectable), (b) part of a practice that is harmful, and (c) a necessary component for the harm to occur at the scale it does. They also agree that progress would involve better understanding the role of individual acts in collective harms and the moral significance of participation in harmful practices.

  Points of Disagreement (table format):

  We will have a table with the following columns:
  - Regime (elastic, threshold, compensated)
  - Point of Disagreement (stated in wording acceptable to each side, with the marginalist's view and the participant's view)
  - Crux (the sub-question that, if settled, would move at least one side)
  - Case/Argument/Result that both agree would bear on the crux
