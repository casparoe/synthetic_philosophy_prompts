prompt: |-
  A student in my metaethics seminar has an arguement she thinks turns Williams's integrity objection into a proof that no moral theory with a general criterion can be true, and I can't decide whether it's a real result or a trick of phrasing. It goes:

  (1) A moral theory's job is to say what an agent may and must do.
  (2) If the theory has a general criterion of right action, then what justifies the agent's act is, at bottom, that the criterion selects it.
  (3) So when the man saves his wife rather than the stranger, if his reason is just that she's his wife, the theory will ask what makes that enough; and the answer has to come from the criterion (partiality is permitted, or the act maximizes the good). His justifying thought has to be, at least implicitly, a thought about the criterion.
  (4) So the theory treats his attachment to her as not justifying anything on its own — it needs the criterion to back it.
  (5) That's Williams's complaint about the wife case: the theory wants one thought too many.
  (6) But nothing in (1)-(5) is about consequentialism in particular. Any theory that sorts acts by a general criterion does this, agent-relative theories included.
  (7) So the objection, if it lands, refutes every general moral theory; and a charge that convicts every theory isn't an objection to any of them. Which leaves either that Williams is just describing what it is to have a theory at all, or that there can be no general theory.

  She also says the wife case is a distraction — swap in a man whose deepest project is famine relief and she claims the argument runs identically — which I think is either the sharpest thing she's said or a sign something broke upstream. Where's the break? I'd like to keep (5), since I think Williams is onto something real, but (7) is absurd. And if you tell me the whole thing never gets off the ground, tell me what the agent's justification is supposed to be instead, because it can't just be that she's his wife with nothing behind it.
reasoning: |-
  Okay, I need to unpack this student's argument. The core idea is that Williams' integrity objection, which targets utilitarianism, actually applies to any moral theory with a general criterion. The argument seems to go like this: any such theory requires actions to be justified by the criterion, not by personal attachments or projects. This makes the justification "one thought too many," which Williams criticized. But if this applies to all general theories, then it can't be a valid objection since it would undermine all moral theories. That seems absurd, so where's the flaw?

  First, I recall Williams' original point. He used the example of a man saving his wife from drowning instead of a stranger. Utilitarianism would require the man to justify this through overall utility, like his wife's happiness contributing more to general welfare. Williams argued that this adds an unnecessary thought—the man should just save his wife because she's his wife. The moral theory here forces an impersonal justification, compromising personal integrity.

  The student extends this to any theory with a general criterion. Even an agent-relative theory (say, one allowing partiality) would still require that the partiality is permitted by the criterion. So the man's reason ("she's my wife") only works because the criterion says so. Thus, the personal attachment isn't inherently justifying; it's backed by the theory. That seems to make all justification impersonal.

  The student's famine relief example is interesting. If someone's life project is famine relief, a general theory would still require their actions to align with the criterion. So even here, the personal project is justified only through the theory, not on its own. This broadens the argument beyond personal relationships.

  Now, the problem: if every general theory does this, then Williams' objection either describes what theories do (so it's not an objection) or implies no general theory is possible. But that can't be right because we do have plausible moral theories. So where's the break?

  I need to challenge premises. Let's look at step (4): "the theory treats his attachment as not justifying anything on its own." Is that accurate for all theories? For example, in a virtue ethics framework, virtues like loyalty might directly justify partial actions without appeal to a higher criterion. But virtue ethics might not have a "general criterion" in the same way as utilitarianism or deontology. The student's argument hinges on "general criterion," but maybe that term needs clarification.

  The key might be in what constitutes a "justifying thought." Williams argues that the direct thought ("I'm saving my wife") should be sufficient. The theory adds a layer ("because partiality is permitted"). The student claims this layer is always present in general theories. But perhaps in agent-relative theories, the criterion itself incorporates personal perspectives, so the agent's reason isn't mediated. For instance, if the criterion says "act according to your roles," then "she's my wife" is directly justifying under the theory. No extra thought is needed; the criterion validates the personal reason as primary.

  So the break might be in step (3): "His justifying thought has to be, at least implicitly, a thought about the criterion." For agent-relative theories, the criterion is designed to include personal reasons, so the agent doesn't need to think about the criterion separately. The thought "she's my wife" is already within the framework. Thus, the justification isn't impersonal; it's personal but sanctioned by the theory.

  But the student might counter that even then, the attachment's justificatory power comes from the theory, not inherently. However, Williams' point is about phenomenology—how the agent experiences the justification. If the theory allows the personal reason to be sufficient without reflection on the criterion, then it avoids the "one thought too many" issue. For example, in common-sense morality, saving one's spouse is just what you do; no further justification is needed. A theory that codifies this doesn't force an additional thought.

  The famine relief case is trickier. If someone's project is famine relief, and they act on it, a general theory might require that it aligns with morality. But if the theory permits personal projects, then acting on them doesn't need extra justification. The issue arises only if the project conflicts with the theory. Williams' complaint was that utilitarianism forces the agent to subordinate personal commitments to impersonal demands. Agent-relative theories avoid this by building personal perspectives into their criteria.

  So the break is likely in step (6): the objection doesn't apply to all general theories. Agent-relative theories can accommodate personal reasons without adding an extra thought. Williams targeted consequentialism (and maybe rigid deontology) for failing to acknowledge the normative force of personal attachments. But theories that integrate agent-relative reasons can preserve integrity.

  In summary, the flaw is assuming that all general criteria make personal reasons secondary. Some theories make them primary, so the justification remains direct. Thus, Williams' objection only applies to theories that insist on impersonal justification, not all general theories.
answer: |-
  Your student's argument is clever and raises deep issues about moral theory structure and Williams's integrity objection, but it contains a critical flaw in its treatment of "justification" and the scope of "general criterion." I'll reconstruct the argument, pinpoint where it breaks, explain why Williams's objection still holds force against specific theories (like consequentialism), and clarify what the agent's justification should look like. The core issue lies in **step (3) and (4)**, which misrepresent how agent-relative theories handle justification, and in a conflation of *grounding* with *deliberative reasoning*.

  ### Step-by-Step Breakdown of the Flaw
  Let's walk through the argument with corrections:

  1. **Premise (1) is mostly correct**: A moral theory does aim to specify what agents may/must do.  
  2. **Premise (2) is true but ambiguous**: If a theory has a general criterion (e.g., "maximize utility," "respect rational agency," "fulfill role-based duties"), it provides the ultimate *ground* for right action.  
  3. **Step (3) is where the argument derails**:  
     - The student claims that for the man saving his wife, his reason ("she's my wife") must *implicitly* appeal to the criterion (e.g., "partiality is permitted").  
     - **The flaw**: This confuses two distinct things:  
       - **The metaphysical ground**: What *makes* the act right (the criterion).  
       - **The agent's justifying thought**: The reason *for which* the agent acts.  
     - In **agent-relative theories** (e.g., "you have special obligations to family"), the criterion *builds in* personal attachments as foundational justifiers. The agent's reason ("she's my wife") **is directly justifying** because the criterion endorses it *as a basic normative fact*. No "backing" from an impersonal criterion is needed in deliberation.  
  4. **Step (4) doesn't follow for all theories**:  
     - Consequentialism (and some rigid deontologies) *does* treat personal attachments as inert without external validation—hence Williams's "one thought too many."  
     - But **agent-relative theories do not**: They treat attachments *as intrinsic justifiers* because their criterion is designed to accommodate them. The criterion doesn't "back" the attachment; it *incorporates* it.  
  5. **Step (5) is correct about Williams**: His complaint *is* that consequentialism demands an alienating, impersonal justification for personal commitments.  
  6. **Step (6) is false**: The objection **does not** apply to all general theories. It only lands against theories that:  
     - Prioritize **agent-neutral** criteria (e.g., "maximize overall good," "universalizable duties"), forcing agents to submerge their personal perspectives.  
     - **Agent-relative theories** (e.g., "parents must prioritize their children," "projects generate non-transferable reasons") avoid this by making the criterion sensitive to the agent's particular relationships and projects.  
  7. **Step (7) is thus unsupported**: Williams isn't "describing what it is to have a theory at all." He's exposing a pathology of **specific** theories (like utilitarianism) that fail to respect the *first-personal character* of practical reasoning.  

  ### Why the Famine Relief Case Doesn't Save the Argument
  The student claims swapping the wife for a famine-relief project runs identically. This *seems* sharp but reveals the argument's core confusion:  
  - In a famine-relief case, if the agent acts *because "this project is mine and central to my life,"* a **consequentialist theory** still requires them to justify it via the criterion (e.g., "does this maximally reduce suffering?"). This *is* "one thought too many," as Williams would agree—it alienates the agent from their deepest commitments.  
  - But in an **agent-relative theory** (e.g., one that recognizes "personal integrity" or "projects as reason-generating"), the agent's reason ("this project is mine") *is sufficient*. The criterion *already includes* such reasons as basic. No further appeal is needed.  

  **The asymmetry**: Williams's objection *only* applies when the theory insists on translating all reasons into agent-neutral terms. Agent-relative theories avoid this by allowing reasons to be *irreducibly* personal.  

  ### What the Agent's Justification Should Be (and Why It's Not "Nothing")
  You ask: *"What is the agent's justification supposed to be instead? It can't just be that she's his wife with nothing behind it."* Here's the Williams-compatible answer:  
  - **In ordinary deliberation**: The man saves his wife *simply because she's his wife*. This is a **sui generis, non-inferential reason** grounded in the relationship itself. It doesn't require "backing" from a deeper criterion.  
  - **The role of the theory**: A moral theory (like a pluralist agent-relative theory) should *recognize* this reason as valid *because* relationships generate obligations. The theory doesn't provide the reason; it *describes* it.  
  - **What "justifies" it metaphysically?** The value of relationships, partiality, or integrity—but this is a *philosophical explanation*, not part of the agent's deliberation. Williams's point is that forcing this explanation into the agent's head distorts their moral psychology.  

  ### Conclusion: Where the Argument Fails and Williams Stands
  - **The break**: Steps (3)–(4) erroneously assume all general criteria reduce personal reasons to instances of impersonal principles. Agent-relative theories reject this. Williams's objection *only* refutes theories that demand agent-neutral justification (e.g., consequentialism, some Kantianisms).  
  - **Why (7) is absurd**: If Williams's objection "convicts every theory," it convicts itself—but agent-relative theories escape by design. The student overgeneralizes a problem specific to impartialist theories.  
  - **Sharpest insight**: The famine-relief case *does* show that Williams's worry extends beyond personal relationships to any deep commitment. But this doesn't universalize the objection—it just broadens the scope of *which theories* are vulnerable.  

  **Practical takeaway for your seminar**: Williams is exposing a flaw in theories that cannot accommodate *the phenomenology of first-personal reasons*. The student's argument fails by ignoring how agent-relative criteria preserve the immediacy of "she's my wife" as a justification. Williams isn't anti-theory; he's anti-*theory-that-alienates*. A successful moral theory (e.g., nuanced virtue ethics or role-based deontology) can have a general criterion *while* letting agents act directly on personal reasons. This keeps Williams's insight alive without collapsing into absurdity.
