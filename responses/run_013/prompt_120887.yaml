    - If \(q < 1\), \(U_E > 0\) (since \(1 - \frac{3q}{2} + \frac{q^2}{2} > 0\)).
    - If \(q = 1\), \(U_E = 0\).
  - Staying out always gives $0, so entering is:
    - At least as good as staying out (since \(U_E \geq 0\)).
    - Strictly better when \(q < 1\) (e.g., if others stay out for sure (\(q=0\)), \(U_E = 1 > 0\)).
  - **Conclusion**: Entering is weakly dominant in the ordinary sense.

  **Nash equilibrium**:
  - In non-cooperative game theory, players treat others' strategies as fixed.
  - Since entering is weakly dominant, the only pure-strategy Nash equilibrium is all players entering (\(q = 1\)), yielding $0 for everyone (as multiple entrants always occur).
