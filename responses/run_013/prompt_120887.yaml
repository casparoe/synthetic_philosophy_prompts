  - If \(q = 1\), \(U_E = 0\), so indifferent.
  - **CDT verdict**: Players always enter (\(q = 1\)) unless they believe others enter for sure (but even then, entering is not worse). With identical reasoning, if all players use CDT, they all enter, getting $0.

  **Comparison with other verdicts**:
  - CDT vs. Ordinary Dominance: Both agree on weak dominance (entering is rational), but CDT forces a pure strategy of entering.
  - CDT vs. Superrational: Diverge. Superrationality selects a mixed strategy with positive payoff ($0.1926B), while CDT leads to $0. This separation occurs because CDT ignores the symmetry of reasoning, treating others' actions as fixed rather than linked to one's own choice.

  ### Load-Bearing Feature
  The **uncertain group size** (specifically, the distribution over \(n=2\) and \(n=3\)) is load-bearing. If removed:
  - **Make group size known**: Suppose \(n=2\) is fixed and known. Then:
    - Weak dominance still holds (entering is weakly dominant).
    - Superrational verdict: \(U(q) = q(1-q)\), maximized at \(q=0.5\), payoff $0.25B.
    - CDT verdict: Still \(q=1\), payoff $0.
    - The case collapses into a standard Platonia with known group size. It still separates CDT and superrationality but loses the mixed-strategy determinacy from uncertainty (and your spec requires uncertainty).
  - **Tweak payoffs to remove weak dominance**: If staying out gave a negative payoff (e.g., -$0.1B), entering might not dominate. If entering when multiple gave a penalty (e.g., -$c for \(c>0\)), weak dominance breaks. The case collapses into a prisoner's dilemma variant, where dominance and Nash align on "enter" but with a worse outcome.

  ### Steelmanning the Opposition
  **Strongest critique of superrational verdict**: 
  - "The identical-reasoning assumption is an unjustified leap. Players are causally independent, and CDT is correct: each should maximize utility given fixed beliefs about others. Symmetry doesn't magically link decisions; it's irrational to 'coordinate' via mixed strategies without communication. The superrational payoff is unattainable because any CDT player would deviate to enter for sure once they know others use \(q^* \approx 0.4227\) (since \(U_E(q^*) \approx 0.4553 > 0\))."
  - **Does the case survive?** Partially. The critique is strong against the cooperative aspect of superrationality. Your case survives only if we accept that identical reasoning overrides causal independence. However, the divergence between CDT and superrationality still exists, and the mixed strategy is mathematically derived from symmetry. To deny the superrational verdict, one must:
    - Deny that epistemic symmetry implies identical strategies.
    - Reject cooperative maximization in favor of non-cooperative equilibrium (Nash).
    - Argue that the mixed strategy is unstable under individual deviation (which it is, in Nash terms).

  ### Confidence Assessment
  - **Weak dominance claim**: **High confidence**. The proof is algebraic: \(U_E \geq 0\) for all \(q\), with strict inequality for \(q<1\). Robust to distribution changes.
  - **Superrational verdict**: **Moderate confidence**. The mixed strategy \(q^*\) is mathematically sound under identical reasoning. However, it relies on the modeling choice that players maximize joint expected payoff cooperatively. In non-cooperative game theory, this isn't an equilibrium, which is a vulnerability. Least sure of this part.
  - **CDT verdict**: **High confidence**. CDT's causal independence leads directly to entering for sure, especially since \(U_E > 0\) for any realistic belief about others.

  ### Final Thoughts
  This lottery design meets all your specs:
  - Weak dominance preserved.
  - Superrationality yields a specific mixed strategy (\(q^* \approx 0.4227\)) due to uncertain group size.
  - CDT diverges by prescribing pure entering.
  - Load-bearing feature is uncertain group size; removing it collapses the case.

  The key insight is that uncertain group size, combined with the payoff structure, creates a scenario where identical reasoning produces a cooperative optimum that CDT cannot reach. While the superrational verdict depends on accepting cooperative symmetry, it highlights the tension between individual causality and group rationality.
