    We can raise this objection after the case. The point is that the vNM axioms for society force ex ante aggregation and ignore ex post fairness.

  ### 7. Final Question and Wrap-up (10 minutes)

  **Final Question:** 
  - "Suppose we have applied Harsanyi's theorem and obtained a social utility function that is a weighted sum of individual vNM utilities for a given profile of individual preferences. What does this result tell us about how to aggregate preferences in a different society (with different individuals) or in the same society facing a different set of alternatives? And what does it leave open about the choice of weights and the interpretation of the individual utilities?"

