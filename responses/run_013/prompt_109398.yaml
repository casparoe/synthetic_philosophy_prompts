  ### 6. Addressing Misconceptions (10 minutes)

  **Misconception 1: The theorem proves utilitarianism.**
  - Dismantle at the point after the case: The case shows that the weights are not fixed. Moreover, the individual utility functions are vNM utilities, which represent individual attitudes to risk and are not necessarily measures of well-being or welfare. So even if we set the weights equally, the social utility function is the sum of vNM utilities, which may not be interpersonally comparable in a way that makes the sum a measure of total welfare. The theorem is about representing social preferences under uncertainty, not about welfare aggregation.

  **Misconception 2: Conflating the aggregation theorem with the impartial observer.**
  - The aggregation theorem is a representation result for social preferences under the Pareto condition and vNM rationality. The impartial observer argument is a different device: it imagines an impartial observer who has an equal chance of being any individual and then uses expected utility from that perspective. That yields a particular social welfare function (the average utility) but it is a distinct argument. The aggregation theorem does not require any veil of ignorance; it is an immediate consequence of the axioms.

  **Misconception 3: Seeing it as Arrow's theorem with the difficulty removed.**
  - Arrow's theorem is multi-profile: it requires that the social ordering be determined by individual orderings for any possible profile of individual preferences (universal domain) and also requires independence of irrelevant alternatives. Harsanyi's theorem is single-profile: it takes one profile of individual preferences (and their vNM representations) and produces a social ordering for that profile. It does not claim to work for any possible profile. Moreover, the Pareto condition is the only condition linking individual and social preferences. So it is a very different result.

