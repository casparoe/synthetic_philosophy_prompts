  We are preparing a 90-minute session on Harsanyi's aggregation theorem for an interdisciplinary reading group of PhD students in PPE with a background in decision theory but no prior exposure to social choice. The goal is to plan the sequence of teaching, address common misconceptions, and use a worked case to highlight the theorem's structure and implications.

  **Overall Structure Plan:**
  1. **Introduction (10 minutes):** Set the stage by framing the problem of aggregating individual preferences into a social preference under uncertainty, and introduce the key components without technical details.
  2. **Setting up the Framework (15 minutes):** Define the elements: a set of individuals, a set of social alternatives (lotteries), individual preference relations satisfying the vNM axioms (hence representable by vNM utility functions), and the need for a social preference relation.
  3. **Introducing the Three Key Components Sequentially (25 minutes):** Break down the three elements that students tend to conflate, introducing them in the following order with clear justifications:
     a. **The existence of a social utility representation (Component 1):** Explain that we first need to assume that the social preference relation is complete and transitive (and then later, with the other axioms, it will be representable by a utility function). But at this stage, we do not assume that it satisfies the vNM axioms. We merely note that if we want a utility representation for social preference, we must have these basic ordering properties. However, in Harsanyi's theorem, we do not start by assuming a utility representation exists; we assume the social preference satisfies the vNM axioms (which imply the existence of a utility representation). So we will actually introduce the vNM axioms for social preference (Component 2) next, and that will imply Component 1. But we must be careful to separate the two.

     Revised order and reasoning:
     - Start by assuming that both individual and social preferences are defined over lotteries and satisfy the vNM axioms (so they are complete, transitive, continuous, and independent). This implies that each individual and society can be represented by a vNM utility function (unique up to positive affine transformations). This step bundles together the existence of a utility representation (Component 1) and the assumption of the vNM axioms (Component 2) because in the vNM framework, the axioms are what give us the representation. We must explain that the vNM axioms are being assumed for society as well as for individuals. This is a substantive assumption.

     - Then, introduce the Pareto condition (Component 3): If every individual weakly prefers lottery A to lottery B, then society weakly prefers A to B (and if at least one individual strictly prefers A to B and none prefer B to A, then society strictly prefers A to B). This condition links individual and social preferences.

     Why this order? Because the vNM axioms for the social preference (which imply the existence of a social utility representation) are a prerequisite for the theorem's machinery. Without them, we cannot even talk about a social utility function. Then the Pareto condition connects the individual and social levels.

  4. **The Theorem Statement (5 minutes):** State Harsanyi's aggregation theorem: Given the above assumptions, there exists a set of positive weights (one for each individual) such that the social utility function is a weighted sum of the individual utility functions, and this social utility function represents the social preference.

  5. **Worked Case (25 minutes):** Present a case with three individuals (to avoid the two-person case where weights might seem arbitrary) and a set of lotteries. The case should be designed so that the intuitive "fair" social choice conflicts with the one delivered by the expected-utility social ordering (to show the "price of the axioms"). We will work through the case step by step.

  6. **Addressing Misconceptions (10 minutes):** After the case, tackle the common misunderstandings: that the theorem proves utilitarianism (it doesn't, because the weights are not fixed and the utility functions are not necessarily welfare measures), the conflation with the impartial observer, the comparison with Arrow, the single-profile nature, and the ex ante/ex post objection.

  7. **Final Question and Wrap-up (10 minutes):** Pose a question to test understanding of what is left unsettled by the theorem, and note deliberate omissions.

  **Detailed Breakdown:**

  ### 1. Introduction (10 minutes)
  - Context: We are in a society making choices under uncertainty (lotteries). We have individuals with rational preferences (vNM rational) and we want a social preference that is also rational in the same sense. Harsanyi's theorem gives a striking result: under certain conditions, social utility is a weighted sum of individual utilities.
  - Today's goal: To understand the theorem's structure, its assumptions, and what it does and does not imply.

  ### 2. Setting up the Framework (15 minutes)
  - **Elements:**
    - A finite set of individuals: let's say N = {1, 2, ..., n} (we'll use n=3 in the example).
    - A set of alternatives: lotteries over a set of outcomes (e.g., money allocations, but we can abstract away from outcomes to lotteries directly).
  - **Individual preferences:** Each individual i has a preference relation over lotteries that satisfies the vNM axioms (completeness, transitivity, continuity, independence). Therefore, each has a vNM utility function U_i, unique up to positive affine transformations.
  - **Social preference:** We require a social preference relation over the same lotteries. We assume that this social preference also satisfies the vNM axioms (so it too can be represented by a vNM utility function W, unique up to positive affine transformations). This is a strong assumption: society is rational in the same way as individuals under uncertainty.

  ### 3. The Pareto Condition (5 minutes of the 25 allocated in the component breakdown)
  - Introduce the **Pareto principle for lotteries**: For any two lotteries A and B, if every individual weakly prefers A to B, then society weakly prefers A to B. Moreover, if at least one individual strictly prefers A to B and none prefer B to A, then society strictly prefers A to B.
  - Why after the vNM assumptions? Because without the vNM structure for society, we wouldn't have a social utility function to relate to the individual ones. The Pareto condition is the bridge.

  ### 4. Theorem Statement (5 minutes)
  - Harsanyi's Aggregation Theorem: Under the above assumptions (vNM rationality for individuals and society, and the Pareto condition), there exist positive weights α_1, α_2, ..., α_n (one for each individual) such that the social utility function W can be written as:
      W = α_1 * U_1 + α_2 * U_2 + ... + α_n * U_n
    for every lottery.
  - The weights are positive and unique up to a positive scalar multiple (because the social utility function is unique up to positive affine transformations, and the individual utility functions are also unique up to positive affine transformations, the weights can be scaled as long as relative weights are preserved).

