  - We have not discussed the proof (which is relatively straightforward: the Pareto condition implies that the social utility is a linear combination of individual utilities, and the weights are positive because of the strong Pareto condition).
  - We have not discussed the possibility of dropping the vNM axioms for society (e.g., for rank-dependent utility) or alternative aggregation methods.
  - We have not covered the connection to welfare economics or how to choose the weights in practice.
  - We have only touched on the ex ante/ex post issue without going into the large literature on it.

  **Answer to the Final Question (for the instructor):**
  - The result is single-profile: it applies to one fixed set of individual preferences. It does not tell us how to aggregate when individual preferences change. The weights we obtain are for that profile and are not necessarily transferable. 
  - The result leaves open the choice of weights (any positive weights) and the interpretation of the individual utilities (they are vNM utilities, not necessarily welfare measures).
answer: |-
  ### Lesson Plan: Harsanyi's Aggregation Theorem  
  **Duration:** 90 minutes  
  **Audience:** PhD students in Philosophy, Politics, and Economics (PPE) with prior decision theory (vNM axioms, utility representations) but no social choice background.  
  **Objective:** Sequence the theorem’s components to preempt conceptual collapses, use a worked case to reveal axiomatic costs, and dismantle misconceptions.  

  ---

  ### **1. Introduction (10 mins)**  
  - **Framing:** Pose the core problem: *How can society rationally choose between lotteries when individuals have conflicting preferences under uncertainty?*  
  - **Key Takeaway:** Harsanyi’s theorem provides a mathematical answer but imposes strong assumptions. Today reveals *what the axioms buy and what they cost*.  
  - **Roadmap:** Briefly state the three components to be sequenced:  
    > "We’ll build this step by step: first, the *possibility* of a social utility function; second, the *demand* that social preferences obey vNM axioms; third, the *Pareto link* to individual preferences."  

  ---

  ### **2. Sequencing the Components (25 mins)**  
  **Rationale:** Students conflate (1) social utility existence, (2) vNM axioms for society, and (3) Pareto condition. Sequence them to show dependency.  

  #### **Step 1: Social Preference Requires a Utility Representation (5 mins)**  
  - **Why first?** Establish a baseline: Society, like individuals, needs *some* complete/transitive preference over lotteries to be rational.  
  - **Key Point:**  
    > "Before imposing axioms, we note: if society is to choose, it must rank lotteries systematically. This *allows* a utility representation but doesn’t specify its form."  
  - **Misconception Preemption:** Emphasise this is a *minimal rationality assumption*—not yet vNM.  

  #### **Step 2: Social Preferences Satisfy vNM Axioms (10 mins)**  
  - **Why next?** vNM axioms (completeness, transitivity, continuity, independence) are the engine of the theorem. They force linearity.  
  - **Key Point:**  
    > "vNM axioms for society imply its utility is *linear in probabilities* and unique up to affine transformations—just like individual utilities. This is *not inherited* from individuals; it’s an independent demand."  
  - **Contrast with Step 1:**  
    > "Existence of a utility function (Step 1) is trivial. vNM axioms (Step 2) *constrain its shape*: society must be an ‘expected utility maximiser’."  

  #### **Step 3: Pareto Condition Over Lotteries (10 mins)**  
  - **Why last?** Pareto links social and individual preferences, but relies on Steps 1–2 to be meaningful.  
  - **Key Point:**  
    > "Pareto requires: if all individuals weakly prefer lottery A to B, so must society. This *uses* the vNM structure (Step 2) to connect utilities."  
  - **Theorem’s Real Work:**  
    > "The theorem’s magic happens here: Pareto + vNM for society *forces* social utility to be a weighted sum of individual utilities. Without vNM, Pareto alone doesn’t imply linear aggregation."  

  ---

  ### **3. Worked Case: The Life-Saving Drug (25 mins)**  
  **Case Design Criteria:**  
  - **Must have:** 3 individuals (avoid arbitrariness of 2), lotteries with risk, conflict between "fairness" and vNM-Pareto.  
  - **Must lack:** Symmetric weights (to show weights are unconstrained), ex post equality (to prime ex ante/ex post objection).  
  - **Why this case?** Forces students to "feel" the axioms’ price when fairness diverges from linear aggregation.  

  #### **The Scenario**  
  - **Actors:** Alice (A), Bob (B), Charlie (C). One life-saving drug dose; only one can survive.  
  - **Outcomes:**  
    - \(X\): A lives, B and C die.  
    - \(Y\): B lives, A and C die.  
    - \(Z\): C lives, A and B die.  
  - **Lotteries:**  
    - *Lottery 1 (L₁)*: Equal chance (1/3 each) of \(X\), \(Y\), \(Z\).  
    - *Lottery 2 (L₂)*: 100% chance of \(X\) (A lives; B and C die).  
  - **Individual Preferences (Selfish, linear utilities):**  
    - \(U_A(X) = 1\), \(U_A(Y) = 0\), \(U_A(Z) = 0\) (A values only her survival).  
    - Similarly: \(U_B(X) = 0\), \(U_B(Y) = 1\), \(U_B(Z) = 0\); \(U_C(X) = 0\), \(U_C(Y) = 0\), \(U_C(Z) = 1\).  
  - **Expected Utilities:**  
    - \(L₁\): \(EU_A = 1/3\), \(EU_B = 1/3\), \(EU_C = 1/3\).  
    - \(L₂\): \(EU_A = 1\), \(EU_B = 0\), \(EU_C = 0\).  

  #### **Applying Harsanyi’s Assumptions**  
  1. **vNM for Society:** Social utility \(W\) must be linear.  
  2. **Pareto:**  
     - All prefer \(L₂\) to \(Y\) (since \(L₂\) gives A survival, others death, but \(Y\) kills A). Pareto demands society prefers \(L₂\) to \(Y\).  
     - *Crucial conflict:* Compare \(L₁\) and \(L₂\).  
       - A prefers \(L₂\) (1 > 1/3).  
       - B and C prefer \(L₁\) (1/3 > 0).  
       - Pareto is silent (no unanimity).  
  3. **Theorem Implication:**  
     - \(W = \alpha_A U_A + \alpha_B U_B + \alpha_C U_C\) (\(\alpha_i > 0\)).  
     - \(W(L₁) = \frac{1}{3}(\alpha_A + \alpha_B + \alpha_C)\).  
     - \(W(L₂) = \alpha_A\).  
     - Society prefers \(L₂\) if \(\alpha_A > \frac{1}{3}(\alpha_A + \alpha_B + \alpha_C)\).  

  #### **The Axiomatic Cost**  
  - **"Fairness" Intuition:** \(L₁\) equalises survival chances (ex ante fairness). \(L₂\) privileges A arbitrarily.  
  - **Theorem’s Verdict:** Society may prefer \(L₂\) if \(\alpha_A\) is large (e.g., \(\alpha_A = 0.5\), \(\alpha_B = 0.25\), \(\alpha_C = 0.25\) → \(W(L₂) = 0.5 > W(L₁) \approx 0.33\)).  
  - **Why It Bites:**  
    > "The axioms force linear aggregation but allow *any positive weights*. Fairness isn’t required; society could ‘weight’ A heavily for arbitrary reasons. The result is elegant, but its *normative price* is that fairness must be smuggled in via weights."  

  ---

  ### **4. Misconception Map (15 mins)**  
  **Dismantle in Sequence:** After the worked case, when weights are salient.  

  #### **Misconception 1: "This Proves Utilitarianism"**  
  - **When Addressed:** During debrief of the case.  
  - **Dismantling:**  
    > "The weights \(\alpha_i\) are *unspecified* by the axioms. Nothing forces \(\alpha_i = 1\) (utilitarianism) or equality. Worse: \(U_i\) are vNM utilities—*not welfare measures*. They encode risk attitudes, not well-being. Harsanyi gives a *mathematical form*, not an ethical doctrine."  

  #### **Misconception 2: "This Is the Veil of Ignorance"**  
  - **When Addressed:** When introducing the theorem.  
  - **Distinction (without "decision vs ethics"):**  
    > "The aggregation theorem assumes *actual* preferences over lotteries. The veil of ignorance is hypothetical: ‘What would you prefer if you didn’t know who you were?’ Harsanyi used both, but they’re distinct. One is aggregation; the other is contractarian justification."  

  #### **Misconception 3: "Arrow’s Difficulty Solved by Fiat"**  
  - **When Addressed:** When stating the theorem.  
  - **Clarification:**  
    > "Arrow’s theorem is *multi-profile*: it demands a aggregation rule for *all possible* preference profiles. Harsanyi is *single-profile*: given one set of vNM preferences, we get one social utility. Arrow’s impossibility isn’t ‘solved’; it’s sidestepped by restricting the domain."  

  #### **Misconception 4: "Ex Ante/Ex Post Doesn’t Matter"**  
  - **When Addressed:** After the worked case (pre-emptively).  
  - **Objection in Idiom of the Case:**  
    > "In \(L₁\), ex post outcomes are unequal (one lives, others die), but ex ante chances are equal. In \(L₂\), ex post is also unequal, but ex ante favours A. The theorem ignores this—social preference is linear in probabilities. But society might care about *ex post fairness* (e.g., ‘Why privilege A?’). The axioms block this concern."  

  ---

  ### **5. Final Question and Omissions (10 mins)**  
  **Final Question (Reveals Understanding):**  
  > "Harsanyi tells us that, for a *fixed* profile of individual preferences, social utility is a weighted sum of individual utilities. What does this *not* tell us about how society should handle a *new* policy dilemma where preferences over outcomes differ?"  

  **Expected Answer:**  
  - It doesn’t provide a *general rule* for weighting individuals across different contexts (weights are profile-specific).  
  - It doesn’t justify interpreting utilities as welfare or specify how to choose weights.  

  **Deliberate Omissions (Flagged Explicitly):**  
  1. **Proof Mechanics:** We skip the derivation (Pareto + vNM → linearity via separating hyperplane theorem).  
  2. **Interpersonal Comparisons:** We assume vNM utilities are given, but their comparability is ethically fraught.  
  3. **Alternative Axioms:** e.g., Dropping vNM for society (e.g., rank-dependent utility).  
  4. **Empirical Applications:** How weights might be set in practice (e.g., via voting).  

  ---

  ### **Session Flow Summary**  
  | Timing      | Segment                          | Key Activities                                                                 |
  |-------------|----------------------------------|-------------------------------------------------------------------------------|
  | 0–10 mins   | Introduction                     | Frame problem; preview components and misconceptions.                         |
  | 10–35 mins  | Sequencing Components            | Step 1: Social utility existence → Step 2: vNM axioms → Step 3: Pareto.       |
  | 35–60 mins  | Worked Case (Drug Lotteries)     | Compare \(L₁\) (fair) and \(L₂\) (unfair); show weights allow unfairness.    |
  | 60–75 mins  | Misconception Map                | Dismantle utilitarianism, veil conflations, Arrow, ex ante/ex post.           |
  | 75–85 mins  | Final Question & Omissions       | Pose question; flag what’s left unsettled and omitted.                        |
  | 85–90 mins  | Wrap-up                          | Emphasise: "Harsanyi describes structure, not justice."                       |

  **British English Notes:** "Maths" not "math"; "prioritise" not "prioritize"; "among" not "amongst"; "axe" not "ax" (for axiom).
