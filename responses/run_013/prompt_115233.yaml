answer: |-
  ### One-Sentence Summary
  Students play the absent-minded driver in a simulated journey with randomized junctions, then design a "cough contract" for a passenger to provide a one-bit signal, testing whether communication can resolve the dilemma without prior theory exposure.

  ### Activity Design  
  **Setting & Roles**  
  - **Driver (1 per round):** Chooses CONTINUE or EXIT at each junction without knowing if it’s first or second.  
  - **Passenger (1 per round, Round 2 only):** Sees the junction but can only cough once or stay silent, per the class’s pre-written contract.  
  - **Contract Committee (all other students):** Collaboratively writes the passenger’s contract before Round 2.  
  - **Instructor:** Flips coins, enforces rules, records payoffs.  

  **Materials**  
  - **Junction Props:** Two identical-looking stations (e.g., two whiteboards labeled "?" or covered boxes).  
  - **Coins:** One to randomize starting junction.  
  - **Scoreboard:** Track points per driver (use χ for "points" to avoid real-money connotations).  
  - **Timer:** For contract design (5 mins).  

  **Payoffs (χ points)**  
  - Exit at first junction: **0χ**  
  - Exit at second junction: **4χ**  
  - Continue past both junctions: **1χ**  

  **Game Flow**  
  1. **Intro (2 mins):**  
     - Explain roles, payoffs, and goal: "Maximize your χ points. You’ll face identical junctions and can’t tell which is first or second."  
     - Emphasize: *No theory—discover through play.*  

  2. **Round 1: Without Passenger (15 mins)**  
     - **Trials:** 5 drivers (volunteers), each doing 1 journey.  
     - **Setup per trial:**  
       - Flip coin: Heads → start at first junction (path: J1 → J2), Tails → start at second junction (only J2).  
       - Driver chooses CONTINUE/EXIT at each junction faced. At J1, CONTINUE leads to J2 (driver not told it’s J2).  
     - **Example:**  
       - Start at J1 (coin=Heads): Driver chooses CONTINUE → moves to J2 → chooses again. If EXIT at J2: 4χ. If CONTINUE: 1χ.  
       - Start at J2 (coin=Tails): One choice. EXIT: 4χ, CONTINUE: 1χ.  
     - **Predictable Issue:** Drivers over-exit (fearing J1) or over-continue (hoping for J2), leading to suboptimal payoffs (e.g., 0χ or 1χ when 4χ was possible).  

  3. **Round 2: With Passenger (20 mins)**  
     - **Contract Design (5 mins):** Class writes rules: "At J1, passenger does ______. At J2, passenger does ______." (Options: cough or no cough).  
     - **Trials:** 5 new drivers + 5 passengers.  
     - **Setup per trial:**  
       - Flip coin for starting junction (same as Round 1).  
       - Passenger coughs/not per contract *before* driver chooses.  
       - Driver hears cough (or silence) and chooses CONTINUE/EXIT.  
     - **Example Contract:**  
       - *Passenger coughs only at J1. Driver: If cough → CONTINUE (aiming for J2); no cough → EXIT (at J2).*  
       - Outcome: Always 4χ (cough at J1 → continue to J2; no cough at J2 → exit).  

  **Debrief (13 mins)**  
  1. **Feel the Problem (3 mins):**  
     - Ask: *"Round 1: What frustrated you? Why was choosing hard?"* Highlight that drivers faced identical nodes, so act-by-act choices felt rational but led to regret (e.g., "I continued hoping for J2, but got stuck with 1χ").  
     - Reveal: "This is the absent-minded driver problem—you experienced it!"  

  2. **Policy vs. Act-by-Act (5 mins):**  
     - **Act-by-act:** "In Round 1, you maximized *expected utility per choice*: At any node, CONTINUE might give 4χ later. But this failed because you couldn’t condition on node type (J1/J2)."  
     - **Policy:** "Round 2 forced you to design a *policy* (contract) *before* the journey. The passenger’s cough let you ’see’ the node, turning a state-dependent policy into higher payoffs."  
     - **Key Insight:** "Maximizing utility per act feels intuitive but fails with imperfect information. Optimality requires pre-commitment to a strategy."  

  3. **Limitation & Theoretical Bridge (5 mins):**  
     - **Unreproduced Element:** "In the classic problem, the driver forgets past actions. We simulated this with random starts, but real absent-mindedness involves *memory failure in a sequence*. Our contract ’solved’ it with communication—but without the passenger, you’re stuck with a mixed strategy (e.g., randomizing CONTINUE/EXIT)."  
     - **Connect:** Show the standard solution (optimal exit probability = \( \frac{1}{3} \) at each node) and contrast with Round 2’s 4χ.  

  ### Predictable Problems & Fixes  
  - **"Driver ignores contract in Round 2":** Remind drivers: "The contract is binding. Re-read it before choosing." Show contract on screen during trials.  
  - **"Vague contract design":** Intervene during committee time: "Be specific: What does the passenger do *at each junction*? What should the driver do if they hear/don’t hear a cough?"  
  - **"Low Round 1 engagement":** Use a leaderboard. Stress: "This isn’t about winning—it’s about feeling the dilemma."  
  - **"Coin flips feel unfair":** Acknowledge randomness: "Life doesn’t announce junctions—this mimics real uncertainty."  

  **Why It Works**  
  Students *feel* the conflict between local rationality (act-by-act) and global optimization (policy) before labeling it. The passenger twist forces creative coordination, making the payoff jump (e.g., 1.5χ avg in Round 1 → 4χ in Round 2) visceral. Debrief maps intuition to theory, cementing why "maximize now" fails when nodes are indistinguishable.  

  **Word Count**: 798
