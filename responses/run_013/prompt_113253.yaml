prompt: |-
  I'm a retired geologist — forty years of rocks, and since I hung it up I've been reading moral philosophy in the evenings, badly and slowly. There's a pattern I keep bumping into and I've never found a name for it, and I'm starting to think either there isn't one or it's hiding under a name I don't recognise.

  Here's the thing. Somebody has a strong reaction to a practice — the yuck reaction to lab-grown meat, say, or a gut sense that a certain kind of deal is dishonest even though nobody's been lied to, or a conviction that a way of treating animals is degrading. When we happen to approve of the reaction we call it a moral conviction, a considered value, and we say it deserves respect and shouldn't be messed with. When we don't approve we call it a bias and we go hunting for the psychological or evolutionary story that produced it, as if finding the story settled the matter. The odd part is that the story is always available in both cases — every moral conviction anyone has ever held has some causal history, disgust, upbringing, group loyalty, whatever. So the origin story can't be what separates the value from the bias, or nothing would count as a value. But in practice that's exactly the move people make, over and over, and it usually works on the room. I've watched a colleague dismiss someone's objection as 'just their culture' in one breath and defend his own as reasoned in the next, and I don't think he was being cynical, I think he genuinely couldn't see it.

  Second thing, closer to home. When I introspect I can't tell the difference from the inside. My irritation at a neighbour's behaviour and my principled objection to it feel identical — same heat, same certainty. Nothing inside says 'this one is just conditioning.' And I notice I'm much more willing to go looking for a deflating explanation of other people's convictions than of my own.

  So: is there an established name for this — the problem of telling a legitimate preference or value from a bias, when both have the same kind of origin and the same feel from the inside, and the only sorting device anyone seems to actually use is whether they already agree with the reaction? I know about the genetic fallacy, and I've gathered there's a literature on 'debunking arguments' in ethics, but what I'm after seems narrower than that, or maybe broader: not 'does origin undermine a moral belief' in general, but the prior question of how you ever seperate the reactions that are up for debunking from the ones doing the debunking. Does it have a name, am I confusing it with something else, and if there's no name, what would you call it so it doesn't just collapse into 'bias' or 'preference'?

  What I don't want is to be told 'that's just reflective equilibrium' or 'that's the genetic fallacy' and left there — I want the carving. Where is the line, if there is one, and what sits at the edges of it? Is my preference for chocolate over vanilla in the same category, and if not, what work is the word 'moral' doing there? Sorry for the length, I'm probly overthinking it.
reasoning: |-
  Okay, let me start by really understanding what this retired geologist is asking. He's noticed a pattern in moral philosophy where people treat their own strong reactions as moral convictions but dismiss others' as mere biases, even though both have similar origins. He’s struggling to find a name for this specific issue and wants to know if there's a distinction between legitimate values and biases when they feel the same internally.

  First, I need to recall related concepts. The genetic fallacy comes to mind—it's when you dismiss a belief just because of its origin. But he mentions that’s not quite it. He’s aware of debunking arguments in ethics, but his point is more about how we decide which reactions are up for debunking in the first place. The key here seems to be the asymmetry in how we judge our own convictions versus others'.

  I remember moral psychology talks about dual-process theory, like Kahneman's System 1 and 2. System 1 is intuitive, fast reactions (like disgust), and System 2 is slower, reasoned thought. But he mentioned that even when he introspects, his principled objections feel the same as irrational irritations. So that doesn't fully address the internal indistinguishability.

  Then there's the problem of moral epistemology—how we justify moral beliefs. Reflective equilibrium is the method of aligning intuitions with principles. But he’s skeptical of that because it feels circular. He wants to know why some intuitions are considered valid starting points while others aren't.

  The term "affective dogmatism" from Haidt's social intuitionist model might fit. It explains how emotions drive moral judgments, and reasoning is often post-hoc. But again, that doesn't name the asymmetry he’s observing. 

  What about "naive realism"? That’s the belief that we see reality objectively, and others who disagree are biased. This connects to his colleague dismissing others' views as "just culture" while seeing his own as reasoned. That’s a cognitive bias where we don’t recognize our own subjectivity.

  He also questions the role of the word "moral." Is it just a label we apply when we agree? Meta-ethics debates moral realism vs. anti-realism. If morals are subjective, then the distinction between value and bias might be social, not ontological. But he’s looking for a practical way to differentiate, not necessarily a philosophical resolution.

  The concept of "thick ethical concepts" from Williams could be relevant. These concepts blend description and evaluation, like "cruel" or "degrading." But that still doesn’t solve the asymmetry issue. 

  Putting it together, the core issue is the double standard in evaluating moral intuitions. We might call it the "asymmetry of moral scrutiny" or "first-person moral immunity." But he needs a recognized term. I recall that in psychology, this is related to the bias blind spot, where people see biases in others but not themselves. Applied to morality, it’s the moral blind spot.

  Also, Gendler's "alief" versus belief might help explain the gut reactions, but again, not the asymmetry. The deeper challenge is epistemic: how to justify treating some intuitions as evidence. Philosophers like Singer argue against relying on intuitions with evolutionary origins, but that’s part of the debunking debate he’s aware of.

  So, the closest terms are "bias blind spot" in moral contexts or "motivated reasoning" in meta-ethics. But perhaps there isn’t a single term. The geologist might be pointing to the foundational problem of moral epistemology—the lack of a clear demarcation. He could call it the "problem of intuitive authority" or "moral intuition asymmetry."

  Considering his examples: chocolate vs. vanilla isn’t moral, but animal treatment is. So "moral" signals societal weight and emotional resonance. But the internal feeling is similar. The distinction might be in the cognitive architecture—moral judgments engage different brain areas, like the vmPFC. But that doesn’t help introspectively.

  In conclusion, the recognized terms are "bias blind spot" and "naive realism" in moral judgment. The phenomenon itself is a blend of cognitive biases and meta-ethical challenges. Naming it "the moralist's fallacy" or "asymmetric intuition validation" might work, but established terms are limited. His insight highlights the inherent difficulty in moral epistemology without objective anchors.
answer: |-
  What you're describing is a profound and unsettling feature of moral psychology and epistemology. It's a pattern many philosophers grapple with, but it doesn't have one universally agreed-upon name – it sits at the intersection of several established concepts. Your frustration about "genetic fallacy" and "debunking arguments" being insufficient is spot-on; you're pointing to something deeper: **the asymmetry in how we *grant authority* to intuitions based on pre-existing agreement, while treating identical subjective experiences as mere biases when we disagree.**

  Here's the carving, using established concepts and highlighting the gap you've identified:

  1.  **The Core Phenomenon:** You're observing the **Selective Treatment of Moral Intuitions** or **Asymmetric Intuition Validation**. The key components are:
      *   **Subjective Indistinguishability:** From the first-person perspective, a deeply held moral conviction and a "mere" bias or conditioned disgust *feel identical* in terms of heat, certainty, and phenomenology. Introspection doesn't reliably tag the source.
      *   **Causal Equivalence:** Both types of reactions *have* causal histories (evolutionary, cultural, personal). Finding an origin story doesn't inherently delegitimize a belief (the genetic fallacy), nor does the absence of a known story inherently legitimize it.
      *   **The Asymmetry Criterion:** The *primary* (often only) practical criterion used to sort "value" from "bias" is **pre-existing agreement/disagreement.** We grant epistemic/moral authority (treat it as a "value" worthy of respect and a starting point for reasoning) to intuitions we share. We deny that authority (treat it as a "bias" to be explained away) to intuitions we dislike, *using the very causal stories we ignore for our own convictions*.

  2.  **Relevant Concepts & Why They Aren't *Quite* It:**
      *   **Genetic Fallacy:** You're correct that this is related but insufficient. It *warns* against dismissing a belief *solely* because of its origin. But your point is that people *do* exactly that selectively, *and* that the origin story is *always* lurking. The genetic fallacy identifies the error; you're naming the *pattern of selective application* of that error.
      *   **Debunking Arguments:** These *use* origin stories to challenge the justification of moral beliefs. Your insight is the *prior selectivity*: **Why is *this* intuition deemed a legitimate target for debunking via its origin story, while *that* one (with an equally contingent origin) is treated as a foundational datum or a "considered judgment" immune to such treatment?** Debunking focuses on the attack; you're focused on the asymmetry in target selection.
      *   **Moral Intuitionism:** This view *grants* prima facie authority to moral intuitions. But it struggles with precisely your point: *which* intuitions? It often relies on "considered judgments" (reflective equilibrium), but as you note, the feeling of "consideration" or "conviction" doesn't distinguish deeply held bias from deeply held value. Intuitionism doesn't adequately solve the asymmetry problem.
      *   **Social Intuitionism (Jonathan Haidt):** This gets closer. Haidt argues moral judgments are driven primarily by quick, affect-laden intuitions ("gut feelings"), with reasoning often serving post-hoc justification. This explains *why* your irritation and principled objection feel the same – they *are* the same kind of intuitive process initially. However, Haidt's model describes the mechanism but doesn't *name* the selective validation asymmetry itself.
      *   **Confirmation Bias / Motivated Reasoning:** These explain *why* we do it (we protect our own beliefs, dismiss threatening ones) but don't specifically name the *phenomenological and causal equivalence* coupled with the *asymmetric treatment based on agreement* in the moral domain.
      *   **Bias Blind Spot (Emily Pronin):** This is highly relevant. It's the cognitive bias where people recognize the impact of biases on others' judgment more readily than on their own. Your observation is essentially **The Moral Bias Blind Spot:** We readily see the contingent, biasing origins of others' moral reactions ("just culture," "just disgust," "just upbringing") while remaining blind to the identical contingency in our own deeply held convictions, which feel like pure "reason" or "value."

  3.  **The Closest Established Labels & A Proposed Synthesis:**
      *   **The Problem of Moral Epistemic Authority:** This highlights the core issue: how do we determine which intuitions have legitimate authority as starting points for moral reasoning, given their subjective feel and causal origins? What makes one gut feeling "moral evidence" and another "mere bias"?
      *   **The Asymmetry of Moral Scrutiny:** This emphasizes the double standard in applying causal explanations.
      *   **The Moralist's Asymmetry (or Moralist's Blind Spot):** This combines the selective validation with the bias blind spot specifically in the moral domain.
      *   **Naïve Realism in Morality (Lee Ross):** Applied to morality, this is the tendency to believe we perceive moral truths objectively, while those who disagree are biased by their upbringing, emotions, etc. This fits your colleague perfectly.

      **The most concise, recognized phrase capturing your core observation is likely: The Asymmetric Application of Debunking Explanations (or Genetic Explanations) in Ethics, rooted in the Moral Bias Blind Spot.**

  4.  **The Line & The Edges:**
      *   **Is there a line?** Epistemologically, it's incredibly blurry. From a purely descriptive psychological standpoint, the "line" is drawn pragmatically and socially based on agreement within a community or individual. There's no bright internal light distinguishing "value" from "bias."
      *   **What sits at the edges?** This is where the hard work happens:
          *   **Reflective Equilibrium (RE):** This is the primary *proposed* solution (Rawls). We test intuitions against principles and principles against intuitions, seeking coherence. The problem (as you sense) is that deeply held biases *also* get woven into the equilibrium. RE is the *process*, not the guarantee of distinguishing bias from value. It can entrench bias as easily as refine value.
          *   **Scrutiny of Origin:** While origin alone isn't disqualifying (genetic fallacy), *certain kinds* of origins *can* be defeating *if* we have independent reason to distrust that origin as a reliable guide. For example:
              *   **Evolved Disgust:** Was this disgust mechanism "designed" (by evolution) to track *moral* wrongness, or merely pathogen avoidance/parasite avoidance? If the latter, why trust it *morally* regarding lab meat? (See Joshua Greene, Peter Singer on "disgust").
              *   **Explicit Contradiction:** Does the intuition directly contradict other deeply held, consistently applied principles within one's own framework?
              *   **Harm/Care Foundations:** Does the intuition track tangible suffering/harm, or is it primarily about purity, loyalty, authority (Haidt's Foundations)? Many argue intuitions grounded in harm are more reliably moral starting points.
          *   **The Role of "Moral":** This is crucial. Your chocolate/vanilla preference is *not* treated as "moral" by you or society. It lacks the key features:
              *   **Perceived Objectivity/Authority:** Moral convictions feel like they describe objective truths or demands ("This *is* wrong," not just "I dislike this").
              *   **Seriousness/Weight:** They concern perceived serious harms, injustices, rights violations, or fundamental values.
              *   **Emotional Resonance:** Often tied to strong emotions like anger, disgust (problematic), guilt, or profound respect.
              *   **Social Enforcement:** They involve expectations about how others *should* behave and judgments about blame/praise.
          The word "moral" signals that we take the reaction *seriously* as a claim about right/wrong, not just preference. The problem is that biases *also* masquerade with these features – the feeling of objectivity and weight is part of what makes them so stubborn. The *work* "moral" is doing is signaling that this intuition *demands* to be treated as more than a mere preference, as having normative authority. The challenge is distinguishing when that demand is legitimate.

  5.  **Conclusion: You're Not Overthinking, You're Seeing a Core Tension.**
      You've identified a fundamental challenge in moral psychology and epistemology: **the lack of a reliable first-person or purely causal marker to distinguish deeply held, socially reinforced biases from legitimate moral values.** We navigate this with tools like reflective equilibrium, scrutiny of origins for *defeating* conditions (not just any origin), and appeals to consistency and consequences (like harm). But ultimately, the asymmetry you observe – granting authority based on agreement while dismissing disagreement via causal stories – is a pervasive feature of human moral reasoning, driven by the Moral Bias Blind Spot and Naïve Realism. It highlights the difficulty of achieving genuine moral objectivity and the ever-present risk of self-serving justifications disguised as moral conviction.

  While there isn't one perfect, universally agreed-upon name, **"The Asymmetry of Moral Scrutiny"** or **"The Problem of Selective Epistemic Authority for Moral Intuitions"** captures the core of your insight. It's the uncomfortable realization that the line between "moral value" and "bias" is often drawn with the crayon of our pre-existing commitments.
