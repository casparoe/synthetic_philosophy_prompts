prompt: |-
  I'm in the second half of a graduate seminar on distributive justice, and we have spent the past two weeks on the levelling-down objection to prioritarianism — the charge that a view ranking outcomes by how well off the worst off are cannot call it an improvement to pull the better off down when no one gains by it. I keep offering verdicts in section that my classmates insist do not hang together, and before I write my response paper I would like to know whether they do. Confiscating a thousand dollars from someone earning a million and burning it is worse than doing nothing at all — not merely wasteful, but a real worsening of the world, even though no one ends up worse off than they were. Confiscating the same thousand and handing it to someone earning ten thousand is plainly good. Abolishing a school's honour roll, or a firm's published productivity ranking, strikes me as an improvement even when I stipulate that no one's income, health, or felt happiness changes at all — the ranking itself was the harm, and I want to say the same of a village that quietly stops holding its beauty contest. But when I imagine a tax that simply leads the top earner to work less and earn less while everyone else is untouched, I feel nothing whatever; I cannot bring myself to say the world got worse. When I try to justify the honour-roll verdict I find I am treating a comparative advantage as intrinsically bad, which is precisely what I denied in the burning-money case, and a classmate tells me I have quietly switched to a view on which equality is a matter of how people stand to one another rather than of how much each of them has.

  Please tell me what principle, or what small set of principles, captures these verdicts, and be candid about which of them I would have to give up. I would like exactly five numbered items, each one or two sentences, with no introduction and no conclusion: the principle or principles themselves; the case that forces each clause of it; your verdicts on two further cases I have not mentioned; the verdict of mine that it cannot accommodate; and, finally, whether you would keep every one of my verdicts with a more complicated principle or drop one for a cleaner account, together with your recommendation.
reasoning: |-
  Hmm, the user is grappling with some complex ideas in distributive justice, specifically the levelling-down objection to prioritarianism. They've shared several intuitive judgments about cases involving redistribution, equality, and status that seem contradictory to their classmates. I need to help them identify a consistent principle behind these intuitions and be honest about what trade-offs would be required.

  Looking at their judgments: They believe confiscating money from a millionaire and burning it makes the world worse, while giving that money to someone poor makes it better. Abolishing honor rolls or beauty contests improves the world even without material changes, but they feel indifferent about a tax that makes a top earner work less without affecting others. The core tension is between their rejection of pure levelling-down (the money-burning case) and their endorsement of status-equality improvements (the honor roll case).

  The honor roll judgment suggests they care about social relations and comparative advantage in a way that conflicts with their material-only concern in the money-burning case. This aligns with their classmate's observation about switching between "how much people have" and "how they stand to one another." To capture this, I should propose a principle that incorporates both prioritarian concerns (helping the worst-off) and relational equality concerns (reducing harmful hierarchies).

  For additional cases to test their intuitions: a mandatory uniform policy (which eliminates visible status markers) and a hypothetical where everyone gains equally but status gaps widen. These will reveal whether their equality concern is about subjective feelings or objective social structures.

  The earnings-tax case is the hardest to reconcile - their indifference there contradicts both the honor roll approval (since it reduces inequality) and the money-burning disapproval (since it's pure loss without gain). They'd likely need to either abandon that indifference or refine their view of what constitutes harmful comparison.

  I'll recommend keeping all verdicts except the earnings-tax indifference, as that's the most isolated intuition and conflicts with the broader pattern. A dual-principle approach (prioritarianism + relational equality) best honors their other judgments while admitting the honor roll case requires a different equality metric than the money cases. The key is distinguishing when comparisons are intrinsically harmful from when they're merely informational.
answer: |-
  Here are five numbered items capturing your judgments and their implications:

  1.  **Principle:** Outcomes are evaluated by both (a) the absolute well-being of the least well-off (weak prioritarianism) and (b) the absence of harmful social comparisons or invidious hierarchical distinctions, which are intrinsically bad relational goods.
      *   *Justified by:* Clause (a) explains confiscation+burning (harmful loss to well-off worsens world without helping worst-off) and confiscation+giving (helps worst-off). Clause (b) explains abolishing honour roll/beauty contest (eliminating harmful comparison is good).

  2.  **Principle (cont.):** Harmful comparisons/hierarchies are defined as socially salient rankings that generate envy, shame, domination, or undermine equal social standing, independent of absolute resource levels or felt happiness.
      *   *Forced by:* Your stipulation that abolishing honour roll improves the world *even without changes* to income, health, or felt happiness – the harm resides in the social structure itself.

  3.  **Verdict on new case 1 (Mandatory Uniforms):** Abolishing school uniforms if they masked significant wealth disparities, leading to visible status competition based on clothing despite unchanged incomes/happiness, would be an improvement (eliminates harmful comparison).
      *   *Verdict on new case 2 (Equal Gain, Widening Gap):* If everyone gains $1000, but the gap between richest and poorest widens significantly due to baseline differences, this is neutral or slightly good (absolute gain for worst-off via (a)), but not improved by the widening gap itself (irrelevant or potentially harmful if it creates new salient comparisons via (b)).

  4.  **Your verdict it cannot accommodate:** Your indifference to the tax making the top earner work/earn less while others are untouched. The principle implies this *is* a worsening (clause (a): top earner's absolute well-being decreases without any gain for the worst-off, analogous to burning money). Your intuition here contradicts clause (a).

  5.  **Trade-off Recommendation:** Drop your indifference verdict on the earnings-tax case to maintain a cleaner account. A more complex principle (e.g., discounting well-being losses from *voluntary* reductions) risks arbitrariness. Your core insights (rejecting pure levelling-down *and* valuing relational equality) are best preserved by consistently applying (a) and (b), requiring you to see the earnings-tax loss as bad.
