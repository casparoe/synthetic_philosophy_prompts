prompt: |-
  I am preparing a graduate seminar on the metaphysics of causation and its application in law and clinical ethics, and I want to begin with the criteria rather than the theories. Set out the desiderata that any adequate theory of causation by omission must satisfy, where "adequate" means: precise enough to adjudicate contested cases in which it is disputed whether someone's not doing something caused a harm, and disciplined enough to avoid collapsing either into the claim that any counterfactual dependence is causation or into the claim that omissions never cause anything at all.

  For each desideratum give me four things: the demand stated in a sentence; the case, puzzle, or result that motivates it; what it rules out; and whether it is non-negotiable or instead the preference of one camp, in which case say which camp would deny it and on what grounds.

  Your list has to accommodate at least the following, which I take to be fixed points — but tell me if any of them is not a genuine requirement at all, but a parochial feature of one legal tradition or one camp's intuitions:

  - A pair of cases with the same outcome and the same counterfactual profile, differing only in whether the agent acted: a life-support machine switched off versus the identical machine never switched on. A theory must either treat these alike and explain away the persistent intuition that they differ, or treat them differently and say precisely what the difference consists in.
  - Omissions are absences, and absences do not look like entities. The theory must say what the relata of the causal relation are in an omission case, or explain why that question is confused.
  - The individuation problem: my failing to water your plant is also my failing to water every other plant and my not doing countless other things. If omissions are causes, the theory needs a non-arbitrary way to pick out the causally relevant one, and the obvious route — appeal to duties or norms — threatens to build normativity into causation itself.
  - Chains that run through an omission which was itself produced by an earlier action: someone's manoeuvre distracts the only person in a position to intervene, and so the intervention does not happen.
  - The legal asymmetry: liability for harmful action without any prior duty, versus liability for omission only where a duty exists; and doctrines such as loss of chance, where liability attaches even though the but-for test is not satisfied.
  - The empirical asymmetry: the robust tendency of subjects to rate harmful omissions as less blameworthy, and omissions as more permissible, than otherwise equivalent actions, even when the costs are the same.
  - The fact that fundamental physical descriptions contain no absences. If omissions cause, then either causation is not a fundamental feature of the world, or the causal story is not exhausted by physics.
  - Overdetermination and preemption by omission: two omissions, each of which alone would have sufficed to prevent the harm; and a case where the first omission would not have prevented the harm had the second not occurred.
  - The distinction between causation and causal selection: even granting that omissions are among the causes of an outcome, we pick out some of them for explanation and blame. The theory should say whether that selection belongs to causation or to a separate pragmatic layer.

  After the list, do three further things. First, identify any subset of the desiderata that cannot be jointly satisfied, with the tension or argument spelled out and the cost of each way out. Second, name the single requirement that does the most to exclude otherwise popular positions, and explain why. Third, list any candidate desiderata you considered and rejected as not genuine requirements, with your reason for rejecting each.

  Do not include a bibliography, citations, or a reading list, and do not lean on the names of authors or works — I will be circulating this without the surrounding literature, so refer to positions by describing them.

  Return a single JSON object and nothing outside it, with these keys:

  - "desiderata": an array of objects, each with "id" (short string such as "D1"), "requirement" (one sentence), "kind" (one of "case_to_get_right", "distinction_to_preserve", "consistency_constraint", "explanatory_demand"), "case_or_consideration" (the motivating case or result, two to four sentences), "what_it_rules_out" (the positions or moves it forbids), "status" ("non_negotiable" or "camp_specific"), and "camp_that_would_reject_it" (a description of the position, or null).
  - "conflict_sets": an array of objects, each with "desideratum_ids" (array of ids), "conflict" (what cannot be had together), and "cost_of_each_way_out" (an object mapping each way out to its cost).
  - "most_exclusionary_requirement": an object with "id" and "why".
  - "candidates_rejected_as_prejudice": an array of objects with "candidate" and "why_not_a_requirement".
  - "purpose_sensitivity": a short string saying which of the desiderata would drop off if the theory were needed only for explanation in the sciences rather than for adjudication.
reasoning: |-
  We are constructing a list of desiderata for a theory of causation by omission. The theory must be precise for contested cases and avoid collapsing into two extremes: that any counterfactual dependence is causation, or that omissions never cause anything.

  We have several fixed points to accommodate. We'll structure each desideratum with an id, requirement, kind, case_or_consideration, what_it_rules_out, status, and camp_that_would_reject_it.

  We'll then identify conflict sets, the most exclusionary requirement, and candidates rejected as prejudice.

  Finally, we note which desiderata would drop off if the purpose were only for scientific explanation.

  Let's list the desiderata:

  1. **Symmetry of Action and Omission in Counterfactual Profile (Fixed Point 1)**
     - Requirement: The theory must either treat the switching-off and never-switching-on cases alike (and explain away the intuition they differ) or treat them differently and specify the difference.
     - Kind: case_to_get_right
     - Case: Consider two scenarios: (a) A doctor turns off a life-support machine, causing death. (b) A doctor never turns on an identical life-support machine (which would have saved the patient), causing death. The counterfactual profile (but-for dependence) is the same in both. Yet, intuitively, (a) is an action and (b) is an omission. The theory must account for this.
     - What it rules out: Theories that cannot explain the intuition of difference or that arbitrarily treat them differently without justification.
     - Status: non_negotiable? But note: some theories might argue that the difference is not in causation but in other factors (like norms). However, the fixed point says we must account for the intuition. So we'll set as non-negotiable because it's a fixed point.

  2. **Relata of Causal Relation (Fixed Point 2)**
     - Requirement: The theory must specify what the relata of the causal relation are in omission cases (events? facts? absences?) or explain why the question is confused.
     - Kind: explanatory_demand
     - Case: Omissions are absences (e.g., the absence of watering a plant). Absences are not concrete events. If causation requires relata that are entities, how can omissions be causes?
     - What it rules out: Theories that posit omissions as causes without explaining what they are or how they enter into causal relations. Also rules out theories that dismiss the question without argument.
     - Status: non_negotiable? It's a fundamental metaphysical issue.

  3. **Individuation Problem (Fixed Point 3)**
     - Requirement: The theory must provide a non-arbitrary way to pick out the causally relevant omission from the many that are true, without building normativity into causation itself (or if it does, it must explain how this is consistent).
     - Kind: explanatory_demand
     - Case: When I fail to water your plant, I also fail to water every other plant and fail to do countless other things. Which omission caused the plant's death? The obvious solution is to appeal to duties (I had a duty to water your plant), but that may make causation normative.
     - What it rules out: Theories that cannot individuate the relevant omission without invoking norms, if they wish to keep causation non-normative. Also rules out theories that leave the individuation arbitrary.
     - Status: non_negotiable? It's a core problem.

  4. **Chains through Omissions (Fixed Point 4)**
     - Requirement: The theory must accommodate causal chains that run through an omission which was itself produced by an earlier action.
     - Kind: case_to_get_right
     - Case: A person's action distracts the only potential intervener, so the intervention does not occur. The harm results from the omission of intervention, which was caused by the distracting action. The theory must allow that the initial action causes the harm via the omission.
     - What it rulesounds out: Theories that deny that omissions can be caused or that deny that omissions can be links in causal chains.
     - Status: non_negotiable? It's a fixed point and common in legal scenarios.

  5. **Legal Asymmetry (Fixed Point 5)**
     - Requirement: The theory must be compatible with the legal asymmetry: liability for harmful actions without prior duty, but for omissions only when a duty exists; and with doctrines like loss of chance (where but-for causation is not required).
     - Kind: distinction_to_preserve
     - Case: In law, if I hit you, I may be liable even without a prior duty not to hit. But if I fail to save you, I am liable only if I had a duty to save. Also, in loss of chance (e.g., medical negligence reducing survival chance from 40% to 0%), liability attaches even though the but-for test (without negligence, the bad outcome would not have occurred) may fail because the patient might have died anyway.
     - What it rules out: Theories that cannot explain why the law treats actions and omissions differently. Also, theories that require but-for causation for all liability would rule out loss of chance.
     - Status: camp_specific? Because some theories of causation might not care about legal applications. But the context is for a seminar on law and ethics, so it is a requirement for an adequate theory in that context. However, note that the fixed point includes it. We'll mark as non-negotiable for the purpose of this seminar, but note that a purely metaphysical theory might not address law.

  6. **Empirical Asymmetry (Fixed Point 6)**
     - Requirement: The theory must account for the robust tendency to judge harmful omissions as less blameworthy and more permissible than equivalent actions, even when the costs are the same.
     - Kind: distinction_to_preserve
     - Case: Experimental philosophy shows that people rate actively harming (e.g., pushing a man off a bridge to stop a trolley) as worse than allowing harm (e.g., not pulling a switch to stop the trolley, which results in the same harm). This asymmetry persists even when the outcome and counterfactual dependence are identical.
     - What it rules out: Theories that cannot explain this asymmetry in judgments. Also, theories that equate causation by omission with action causation without accounting for the difference in judgments.
     - Status: non_negotiable? It's a psychological fact that needs explaining.

  7. **Fundamental Physics Constraint (Fixed Point 7)**
     - Requirement: The theory must address the fact that fundamental physical descriptions contain no absences, so if omissions cause, then either causation is not fundamental or the causal story is not exhausted by physics.
     - Kind: consistency_constraint
     - Case: In physics, we describe the world in terms of what is present (particles, fields, etc.), not what is absent. If omissions (absences) are causes, then causation must be a higher-level feature or else we must show how absences fit into fundamental physics.
     - What it rules out: Theories that claim omissions are causes and that causation is a fundamental physical relation without showing how absences fit in.
     - Status: non_negotiable? It's a metaphysical challenge.

  8. **Overdetermination and Preemption by Omission (Fixed Point 8)**
     - Requirement: The theory must handle overdetermination and preemption cases involving omissions.
     - Kind: case_to_get_right
     - Case: (a) Overdetermination: two omissions, each sufficient to prevent the harm (e.g., two guards fail to close a gate, and either one could have closed it). (b) Preemption: the first omission would not have prevented the harm without the second (e.g., Guard A fails to close the gate, but if he had, Guard B would have opened it; however, Guard B also fails to close it, so the harm occurs).
     - What it rules out: Theories that cannot account for the intuition that in overdetermination, both omissions are causes, and in preemption, the preempted omission is not a cause (or vice versa).
     - Status: non_negotiable? It's a standard test for causal theories.

  9. **Causation vs Causal Selection (Fixed Point 9)**
     - Requirement: The theory must clarify whether the selection of some omissions for explanation and blame is part of causation itself or a separate pragmatic layer.
     - Kind: distinction_to_preserve
     - Case: Even if many omissions are causes of an outcome, we typically pick out only some for blame (e.g., the doctor's failure to diagnose, not the nurse's failure to remind, nor the hospital's failure to have a better system). Is this selection part of the causal relation or a separate process?
     - What it rules out: Theories that conflate causation with causal selection or that fail to account for the distinction.
     - Status: non_negotiable? It's critical for understanding the role of causation in explanation and blame.

  Now, we assign IDs:

  D1: Symmetry of Action and Omission in Counterfactual Profile
  D2: Relata of Causal Relation
  D3: Individuation Problem
  D4: Chains through Omissions
  D5: Legal Asymmetry
  D6: Empirical Asymmetry
  D7: Fundamental Physics Constraint
  D8: Overdetermination and Preemption by Omission
  D9: Causation vs Causal Selection

  We must also consider if any fixed point is not a genuine requirement. The fixed points are given as such, but we note that D5 (Legal Asymmetry) might be seen as parochial to legal traditions. However, the seminar includes law, so we keep it. Similarly, D6 (Empirical Asymmetry) is about human judgment, which might be considered outside metaphysics, but the application to ethics requires it.

  Now, conflicts:

  Conflict Set 1: D1 (Symmetry) and D6 (Empirical Asymmetry)
  - Conflict: D1 requires that we treat action and omission cases alike (or explain the difference in causation) when the counterfactual profile is the same. However, D6 notes that people judge them differently. A theory that treats them alike in causation must explain why judgments differ (perhaps due to non-causal factors). A theory that treats them differently in causation must account for the counterfactual symmetry. The conflict is that if the causal relation is the same, then the difference in judgment must be non-causal, but if the causal relation is different, then we must specify the difference beyond counterfactuals.
  - Cost of each way out:
    - Way 1: Treat them alike in causation. Then the asymmetry in judgment is due to non-causal factors (e.g., norms). Cost: We must explain why the non-causal factors are not part of causation, which might be hard if norms are involved in individuating omissions (D3).
    - Way 2: Treat them differently in causation. Then we must add an extra element to causation beyond counterfactual dependence. Cost: This might make causation disunified or overly complex.

  Conflict Set 2: D2 (Relata) and D7 (Fundamental Physics)
  - Conflict: D2 requires an account of the relata for omissions (absences). D7 says fundamental physics has no absences. If causation is fundamental, then absences cannot be relata. But if omissions cause, then causation must be non-fundamental.
  - Cost of each way out:
    - Way 1: Deny that omissions are causes at the fundamental level. Then causation by omission is a higher-level phenomenon. Cost: We must show how higher-level causation emerges and is compatible with fundamental physics.
    - Way 2: Insist that absences can be relata in fundamental causation. Cost: We must explain how absences are represented in fundamental physics.

  Conflict Set 3: D3 (Individuation) and D5 (Legal Asymmetry) and D6 (Empirical Asymmetry)
  - Conflict: D3 requires a non-arbitrary way to pick out the relevant omission without norms, but D5 and D6 suggest that norms are central to how we treat omissions (in law and judgment). If we use norms to individuate, we build normativity into causation (violating D3 if we want causation non-normative). If we don't use norms, how do we account for the legal and empirical asymmetries?
  - Cost of each way out:
    - Way 1: Build normativity into causation. Cost: Causation becomes normative, which might conflict with a naturalistic worldview and with D7 (if fundamental physics is non-normative).
    - Way 2: Keep causation non-normative and explain the asymmetries by a separate normative layer. Cost: We must then explain how the non-normative causal facts interact with the normative layer to produce the legal and empirical asymmetries.

  Now, the most exclusionary requirement: 
  - D3 (Individuation Problem) because it forces a choice between building normativity into causation (which many theories resist) or finding a non-normative solution (which is difficult). It rules out many popular theories that rely on counterfactuals without norms, because without norms they cannot individuate the relevant omission.

  Candidates rejected as prejudice: 
  - Candidate: "The theory must hold that omissions are not causes because they are absences." 
    Why not a requirement: This is a position of one camp (eliminativism about causation by omission) and not a desideratum. The fixed points include cases where omissions are taken to cause harm (e.g., in the life-support case). So we reject this as a requirement because it is not neutral.

  - Candidate: "The theory must satisfy the but-for test for all cases of causation by omission."
    Why not a requirement: The fixed point D5 (legal asymmetry) includes loss of chance, which violates the but-for test. Also, overdetermination cases (D8) may not satisfy but-for.

  Purpose sensitivity: If the theory were only for scientific explanation, then D5 (Legal Asymmetry) and D6 (Empirical Asymmetry) would drop off because they are specific to law and human judgment.

  Now, we build the JSON.
