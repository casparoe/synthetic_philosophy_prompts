prompt: |-
  I'm putting together a proposal for a 4000-word term paper in a grad seminar on the history of ideas about technology and catastrophe, and I have a half-formed idea I'd like you to turn into an actual proposal document. The standard line on von Neumann goes: he wrote that Fortune piece in the mid-fifties saying nuclear weapons had made national sovereignty untenable and that some kind of world authority would be needed, he made that remark to Ulam about an approaching singularity in human affairs, and separately there's the self-reproducing automata stuff. Everyone writes that essay. What I want instead is to take seriously the fact that in the same period he worked out how to build arbitrarily reliable machines out of unreliable parts, by spending enough redundancy, and that this result has a threshold structure: below some critical component failure rate, no amount of redundancy rescues you, and above it you can make the failure probability as small as you like at a cost. My hunch is that he thought about political survival the way he thought about circuit reliability, and that this makes him stranger and more intersting than either the world-government reading or the doom reading, because it predicts that a technological civilization has a minimum viable scale and a maximum tolerable error rate rather than requiring any particular institution. So the question would be something like: does his engineering treatment of reliability out of unreliable parts genuinely carry over to his claims about the survival of technological societies, or is the analogy doing illegitimate work, since political systems have no clean analogue of independent component failure. Write me the proposal: state the question so it has a determinate answer, say why the usual readings leave it open, say what I'd actually do in twelve weeks given that I have no archival access and it has to be argument-driven from published material, explain why this angle beats the obvious alternative of just doing exegesis of the essay, say what a result would look like and what would count as the project failing, and give an honest scope check. No citations or reading lists, I'll fill those in myself. And tell me where this reading is most likely to be wrong and what would change your mind about it, e.g. if he somewhere treats reliability as a problem of institutional design rather than statistical redundancy, then the whole framing may be me importing Shannon-era thinking onto a man who was up to something else.
