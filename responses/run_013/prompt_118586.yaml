answer: |-
  Here is a villanelle wrestling with the fire and the *must*, the custom and the cause, holding al-Ghazālī's tension:

  **Custom of the Cause**

  The flame will burn the cotton when they meet.  
  (Record the heat, the ash, the rising air)  
  No chain compels the consequence complete.

  Through countless tests, the outcome is discreet:  
  The fiber flares within the furnace glare.  
  The flame will burn the cotton when they meet.

  Is there a force the particles entreat?  
  Or does the Act, devoid of reason's snare,  
  No chain compel? The consequence complete

  Depends upon the Agent's own heartbeat,  
  Whose constant way transcends a law's despair.  
  The flame will burn the cotton when they meet.

  Through means He may appoint, or grace discrete,  
  The burning blooms – His custom to declare  
  No chain compels. The consequence complete

  Is gift, not debt. The pattern, pure and sweet  
  Repetition, hangs upon His care.  
  The flame will burn the cotton when they meet;  
  No chain compels the consequence complete.

  ---

  **How this addresses your specifications:**

  1.  **Refrains:** Line 1 is the **description**: "The flame will burn the cotton when they meet." It states the observed, repeatable fact, clinically ("when they meet"). Line 3 is the **denial**: "No chain compels the consequence complete." It explicitly denies necessary connection ("No chain compels") and subtly points to the divine Actor ("consequence complete" implies an agent completing it).
  2.  **Obsessive Return:** The villanelle form forces the constant return of *both* ideas, mirroring the stubborn regularity of nature and the persistent theological denial of necessity. They are woven together, neither disappearing.
  3.  **Final Quatrain:** The last stanza places the refrains side-by-side (L16 & L17): "The flame will burn the cotton when they meet; / No chain compels the consequence complete." Their coexistence here emphasizes they are not rivals but two facets of the same reality – the observed pattern and its non-necessary, divinely upheld nature.
  4.  **Custom/Habit:** Words like "constant way" (L10), "custom to declare" (L14), and "pattern, pure and sweet / Repetition" (L15-16) carry the weight of divine *habitus* ("sunna"). "Hangs upon His care" (L16) reinforces dependence on divine will, not autonomous law.
  5.  **Intermediary Ambiguity:** "Through means He may appoint, or grace discrete" (L13) explicitly introduces the possibility of secondary causes ("means He may appoint") or direct action ("grace discrete"), leaving it unresolved whether this fundamentally changes the picture ("merely relocates the same puzzle").
  6.  **Accuracy:** The core argument is present: constant conjunction observed (Refrain 1), necessity denied (Refrain 2), divine custom/will as the true cause (L10, L13, L14, L16), possibility of interruption implied ("No chain compels").
  7.  **Accessibility:** Without knowing al-Ghazālī, the poem presents a clear tension between observed regularity and a belief that this regularity is upheld by a conscious Will, not blind necessity. The language is poetic but clear.
  8.  **Avoiding Errors:** The poem never claims the burning doesn't happen (it constantly affirms it does). It never grants intrinsic necessity to fire (it constantly denies any compulsion). The cause is always God ("His care," "His custom," "the Agent," "He may appoint").

  The villanelle's circling, insistent form becomes the perfect vessel for this enduring philosophical dance between the world as we find it and the world as sustained by a sovereign Will.
