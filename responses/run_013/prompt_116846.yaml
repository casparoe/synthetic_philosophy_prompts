  I'm a second-year PhD student in philosophy, working on moral uncertainty and animal welfare, and I'm trying to turn a half-formed idea into a two-page proposal for an internal summer fellowship (about 3 months, maybe 8–10k words of output). The idea started in an argument with freinds about insects and AI systems: the standard moral-uncertainty toolkit seems built for cases where you're unsure which theory is right—utilitarianism vs. contractualism, say—but you're pretty sure who's in the running for moral consideration. But alot of the uncertainty I actually feel is upstream of that: I don't know whether insects are in the moral community, or whether an AI system could be, or whether the boundary is vague or interest-relative. I've been calling this "constituency uncertainty"—uncertainty about the domain of morally considerable beings, as opposed to uncertainty about the correct first-order theory over a fixed domain. I want the proposal to ask: does moral uncertainty have a different structure when the uncertainty is about the constituency of the moral community, and can the standard decision-theoretic machinery (expected moral value, intertheoretic comparisons, the usual ways of handling disagreement between theories) handle it without assuming the answer to the very question at issue? The worry is that most formal approaches treat the set of options and the set of affected parties as fixed, so they either can't represent constituency uncertainty or they smuggle in a determinate answer about who counts.

  Turn this into a proposal with a precise statement of the question (something with a determinate answer, not just "explore"), why existing positions leave it open, and the method—what I'd actually do month by month for a 3-month project. I'd like the method to be philosophical but concrete: distinguish at least three kinds of constituency uncertainty (e.g., uncertainty about whether a kind is a moral patient, about the boundary being vague, about the moral relevance of a kind's interests), then test whether each can be modeled in a decision framework without presupposing a fixed moral constituency; use cases like insects, embryos, ecosystems, and AI systems as stress tests; and say what a result would look like (a taxonomy plus an impossibility or adequacy result, or a revised framework) and what would count as the project failing (e.g., if every kind of constituency uncertainty collapses into ordinary theory uncertainty, or if the formal tools are simply too blunt and the whole thing becomes verbal). No bibliography or literature review by citation—I'll add the citations myself; just refer to positions and arguments in plain terms. Also give me a realistic scope for 3 months and tell me what part is most likely to be too big.

  I want the proposal to be honest about its own weak points. At the end, say what would change your mind about the framing—what argument or consideration would make you think "constituency uncertainty" is not a distinct problem but just a label for ordinary moral uncertainty, or that the formal approach is the wrong way to go. And tell me where your reasoning is most likely to fail (e.g., relying on an intuitive but contested boundary between "who counts" and "what theory is right", or assuming decision theory must be the medium). Last line should be a one-sentence summary in the form \answer{...} so I can paste it into a spreadsheet.
