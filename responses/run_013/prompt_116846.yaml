answer: |-
  ## Fellowship Proposal: Constituency Uncertainty and the Limits of Moral Decision Theory  

  **Research Question:**  
  Can standard decision-theoretic frameworks for moral uncertainty (e.g., expected moral value, intertheoretic comparisons) adequately model *constituency uncertainty*—uncertainty about the set of morally considerable beings—without presupposing a fixed moral constituency, and if not, what structural revisions are required?  

  ### The Gap in Existing Work  
  Current formal models of moral uncertainty (e.g., the "maximization of expected choice-worthiness" approach) assume a **fixed domain of moral patients** while evaluating disagreements between theories (e.g., utilitarianism vs. deontology). Yet profound moral dilemmas—like obligations to insects, AI systems, or ecosystems—often involve uncertainty *about the domain itself*:  
  - Is the uncertainty about *which theory is correct* (e.g., "Does utilitarianism or Kantianism best describe duties to humans?")?  
  - Or is it about *who counts* (e.g., "Is utilitarianism *even applicable* to this entity?")?  
  Existing tools conflate these or silently presuppose constituency is settled before theory comparison begins. This risks smuggling in contested metaphysical boundaries (e.g., "only humans count") or obscuring unique challenges like vagueness.  

  ### Method: Taxonomy, Stress Tests, and Formal Modeling  
  **Months 1–2: Develop a taxonomy of constituency uncertainty and formal test cases**  
  - **Categorize 3 types of constituency uncertainty**:  
    1. **Existence uncertainty**: Is entity-type *X* (e.g., insects) a moral patient *at all*?  
    2. **Boundary vagueness**: Does *X* (e.g., embryos at early stages) have *gradient or indeterminate* moral status?  
    3. **Interest-relativity**: Do *X*’s interests (e.g., an AI’s goal-states) have *moral relevance*, even if *X* lacks intrinsic status?  
  - **Design stress-test cases**: Insects (existence), embryos (vagueness), AI systems (interest-relativity), ecosystems (compound case). Ecosystems will be deprioritized if time runs short.  

  **Month 3: Test formal adequacy and propose refinements**  
  - For each uncertainty type, evaluate whether standard decision-theoretic tools can:  
    - Represent the uncertainty *without* assuming a fixed constituency (e.g., can "expected moral value" be computed if the set of patients is indeterminate?).  
    - Generate non-arbitrary prescriptions (e.g., does intertheoretic comparison collapse when theories disagree on *who matters*?).  
  - **Outputs**:  
    - A **taxonomy** of constituency uncertainty.  
    - An **adequacy/impossibility result**: Either (a) show how existing tools model all 3 types, (b) prove they cannot model ≥1 type without circularity, or (c) propose **revised decision rules** (e.g., incorporating credences over constituencies *and* theories).  
  - **Failure condition**: The project fails if constituency uncertainty reduces entirely to ordinary theory uncertainty (e.g., if "insect moral status" is just a dispute within utilitarianism) *or* if formalization forces implausible precisification (e.g., eliminating vagueness artificially).  

  ### Realistic Scope & Risks  
  - **Achievable in 3 months**: Taxonomy + 2–3 case studies (insects, embryos, AI) + formal analysis of 2 uncertainty types.  
  - **Likely overreach**: Analyzing ecosystems or all 3 types formally. **Mitigation**: Prioritize AI/insects; treat ecosystems as illustrative only.  
  - **Highest-risk task**: Formalizing vagueness without misrepresenting it (e.g., forcing exact probability thresholds).  

  ### Weaknesses and Open Flanks  
  1. **Framing vulnerability**: If "constituency" is inseparable from first-order theory (e.g., utilitarianism *defines* patients as sentient beings), constituency uncertainty *is* ordinary theory uncertainty. **What would change my mind**: A compelling argument that all theories entail mutually exclusive, exhaustive patient-criteria, leaving no distinct "domain" question.  
  2. **Methodological risk**: Decision theory may be too coarse for boundary problems. If modeling requires unnatural assumptions (e.g., "precise credences in vague boundaries"), the project may reveal the *limits* of formal tools rather than their adaptability.  
  3. **Boundary problem**: The distinction between "who counts" and "what theory is right" relies on intuitions (e.g., that "insect sentience" is prior to utilitarian calculus). If these intuitions are contested, the taxonomy fails.  

  \answer{This project investigates whether standard models of moral uncertainty can accommodate distinct forms of constituency uncertainty (existence, vagueness, interest-relativity) without presupposing fixed moral boundaries, using insects, embryos, and AI as test cases.}
