  Ah, and the time-vault scenes! They're not just exposition - they're Asimov's way of visualising historical determinism being undermined by its own announcements. Every "crisis solved" proclamation gets immediately contradicted, which feels deliberate. Maybe that's Asimov winking at Popper?

