  ### The Self-Referential Strand  
  *After Douglas Hofstadter's Typogenetics*  

  **ACGTACGT**  
  By paired commands, the work's defined:  
  Each couplet takes its form, combined,  
  To add itself—both bases—to  
  The copy growing, row by row.  

  **ACGTACGT**  
  First AC: appended thus, and so,  
  The copy starts with A then C.  
  A new strand blooms, by its own word—  
  The very letters that you heard.  

  **ACGTACGT**  
  Then GT: its G and T now bind  
  To lengthen what the first designed.  
  The structure builds, with naught beside  
  The strand’s own laws to be its guide.  

  **ACGTACGT**  
  Next AC returns: once more it writes  
  Its A and C in shared recites.  
  Then GT: appends itself, and shows  
  How marks enact what they compose.  

  **ACGTACGT   ACGTACGT**  
  By paired commands, the work's defined:  
  Each couplet takes its form, combined,  
  To add itself—both bases—to  
  The copy growing, row by row.  

