  3. **Poetic Structure**:  
     - Syllables: Strictly 10 per line (e.g., "By **paired** | com**mands**, | the **work's** | de**fined**").  
     - Self-replication: The final quatrain repeats the first verbatim, mirroring the strand’s self-copy.  
