prompt: |-
  I run the interpretation side at a county museum service — I'm the person who signs off on gallery labels, on the "what we know about these people" panels, and increasingly on the archaeological sections of planning documents where a developer has to say what the site they're about to bulldoze means before they bulldoze it. My problem is that I've got four writers, none trained past a decent undergrad degree, and they keep making claims the evidence can't carry. Someone finds a pit of deliberately smashed pots and writes "a ritual of destruction expressing grief." Someone finds forty burials all oriented east and writes "a shared belief in rebirth." Someone finds the same style of brooch spread over two hundred miles and writes "a kingdom with a central administration." Sometimes those are fine. Usually they're guesses in confident prose, and my options are to wave them through or to argue with a colleague who just says "well, it's a reasonable interpretation" — and I never have a better answer ready on the spot. So what I want from you is a decision procedure my writers can actually run, half an hour per claim, in order: the questions to ask, what counts as a sufficient answer to each, the point where it just stops and says the objects can't settle this, and the point where it hands the call to me because it's a judgment about values or about what we owe the descendant communities we consult, not a fact about the dirt. I'd much rather it return too little than too much — I can live with a boring label.

  I know there's an old textbook picture where inference gets shakier as you climb from technology up through subsistence and economy to social organization and finally to religion and belief, and I know the general point that you need some bridging argument to get from a pattern in the ground to a meaning, and that the same pattern can be produced by very different beliefs. Don't lecture me on those — turn them into boxes to tick. In particular I want the procedure to force the writer to state the bridging premise out loud and say what would have to be true for it to hold; to distinguish a claim that people *did* something from a claim that they *believed* or *instituted* something, and to say what a belief leaves behind that a mere practice doesn't; to require more than one line of evidence and to check whether the lines are really independent or are all just the same assumption wearing different hats; and to say when an ethnographic analogy is allowed, which analogy, and what would break it. It should end in a fixed verdict — something like supported, provisional, or not supportable as written — with the conditions for upgrading later.

  Then run it on three: the smashed pots, the east-facing burials, and the brooch distribution. I want to see where it bites, and I want at least one where it tells me the thing I like is not supportable, because if it never does that it's useless to me. And be honest about where the procedure misfires — I suspect it will be bad with anything that hinges on scale or on absence of evidence, and I'd rather know that going in than find out in a planning inquiry.
reasoning: |-
  Okay, the user manages interpretation for a county museum service. They deal with gallery labels, informational panels, and archaeological assessments for development sites. Their main issue is that their writers, who only have undergraduate degrees, often make claims that go beyond the evidence. For example, interpreting smashed pots as a grief ritual, east-facing burials as belief in rebirth, or widespread brooches indicating a centralized kingdom. The user wants a decision procedure to help writers evaluate such claims step-by-step, taking no more than half an hour per claim. The procedure should ensure claims are evidence-based, distinguish between actions and beliefs, require multiple independent lines of evidence, and handle ethnographic analogies properly. It should end with a clear verdict: supported, provisional, or not supportable.

  First, I need to understand the user's deeper needs. They need a practical tool to prevent overinterpretation, which could lead to misinformation or issues in planning inquiries. The writers might lack training in constructing valid inferences, so the procedure must be structured and educational. The user also wants the procedure to flag when a claim involves value judgments or descendant community input, which requires their oversight. They emphasize wanting a conservative approach—better to have boring labels than unsupported claims.

  The decision procedure should be a checklist with clear questions. Each step must force writers to articulate their assumptions and evidence. Key components include:
  1. **Action vs. Belief**: Distinguishing between observable actions (e.g., burying bodies east-facing) and inferred beliefs (e.g., rebirth). Beliefs require more evidence since they're intangible.
  2. **Bridging Premise**: Explicitly stating the assumption linking evidence to interpretation, and what evidence would support or refute it.
  3. **Multiple Lines of Evidence**: Requiring at least two independent sources. Writers must check if the evidence isn't just different manifestations of the same assumption.
  4. **Ethnographic Analogy**: Allowing analogies only when justified, specifying the source culture, and identifying what would invalidate the comparison.
  5. **Thresholds for Verdicts**: Clear criteria for "supported" (strong evidence), "provisional" (plausible but needs more evidence), or "not supportable" (lacks evidence). Including conditions for upgrading later if new evidence emerges.

  Now, applying the procedure to the examples:
  1. **Smashed Pots as Ritual of Grief**:
     - Action: Smashing pots deliberately. Easy to confirm.
     - Belief: Linking to grief. The bridging premise is that deliberate destruction equals emotional expression. But is there evidence ruling out other reasons? Need multiple lines: Are there human remains? Associated artifacts? Contextual data? Without these, it's not supportable. Ethnographic analogies (like modern rituals) might be used, but must specify which culture and potential breaks (e.g., different contexts). Verdict: Not supportable as written. Writers should describe the action without inferring emotion.

  2. **East-Facing Burials as Belief in Rebirth**:
     - Action: Bodies oriented east. Observable.
     - Belief: Rebirth linked to sunrise. Bridging premise assumes orientation has symbolic meaning. Multiple lines needed: Grave goods, inscriptions, settlement patterns. If other sites show variability, that weakens the claim. Ethnographic analogy could be Egyptian sun cults, but breaks if local cosmology differs. Without corroborating evidence, it's provisional at best. Verdict: Provisional if consistent; otherwise not supportable.

  3. **Brooch Distribution as Centralized Kingdom**:
     - Action: Same brooch style over 200 miles.
     - Institution: Centralized administration. Bridging premise: uniform artifacts indicate political control. But alternatives exist (trade, imitation). Need independent evidence: administrative structures, written records, production centers. If brooches vary in material or design, it's not uniform. Without multiple lines, it's not supportable. Verdict: Not supportable; suggest alternatives like trade networks.

  Weaknesses of the procedure: Struggles with absence of evidence (e.g., no variation in burials might be interpreted as uniformity, but could be sampling bias). Scale issues: Large brooch distribution might imply centralization, but without context, it's speculative. Also, ethnographic analogies can be misapplied if not critically evaluated.

  The user needs this tool to enforce rigor, reduce conflicts with writers ("reasonable interpretation" arguments), and ensure claims are defensible. By making the process explicit, writers learn to ground interpretations in evidence. The examples show where it bites—rejecting unsupported claims. Honesty about limitations (scale, absence) prepares the user for planning inquiries. Overall, this should help the user maintain accuracy and avoid overstatements, even if labels become less sensational.
answer: |-
  Here's a **Practical Interpretation Decision Procedure (PIDP)** designed for your team. It's a 7-step checklist forcing explicit reasoning within 30 minutes. It prioritizes caution and flags value judgments for your review. Weaknesses are noted upfront.

  **Key Weaknesses:**
  1.  **Scale:** Struggles with claims requiring "absence of evidence" (e.g., "no other explanation is possible") or vast spatial/temporal scales lacking dense data points.
  2.  **Absence:** Cannot reliably interpret *why* something is missing; focuses on positive evidence.
  3.  **Nuance:** May oversimplify complex social phenomena; treats "belief" as monolithic.
  4.  **Analogy Reliance:** Heavily dependent on appropriate analogical reasoning.

  **The PIDP Checklist (30 mins max per claim):**

  1.  **Define the Core Claim:** *What exactly are we asserting?*
      *   *Write the claim in one sentence.*
      *   *Sufficient:* Clear, specific statement of *what* happened or *what* people thought/did.
      *   *Stop if:* Claim is vague or conflates multiple ideas. Rewrite.
      *   *Handoff if:* Claim inherently involves modern values, ethics, or specific obligations to descendant communities (e.g., "this proves their inferiority," "this belongs to group X").

  2.  **Action vs. Belief/Institution:** *Is this about observable behavior or inferred thought/social structure?*
      *   *Action:* Describe the physical act/pattern (e.g., "bodies buried facing east," "pots deliberately smashed," "brooches of similar style distributed widely").
      *   *Belief/Institution:* Describe the inferred mental state or social organization (e.g., "belief in rebirth," "ritual expressing grief," "centralized kingdom").
      *   *Sufficient:* Clear distinction made. If claim is Belief/Institution, proceed to Step 3. If *only* Action, skip to Step 6 (but check if label implies more).
      *   *Crucial:* **Beliefs/Institutions require exponentially more evidence than Actions.** An Action leaves physical traces; a Belief leaves *patterns consistent with* that belief *and not easily explained otherwise*.

  3.  **State the Bridging Premise:** *What assumption links the evidence (Action) to the interpretation (Belief/Institution)?*
      *   *Write it explicitly:* "We assume that [Action] *always* or *primarily* happens because of [Belief/Institution]." (e.g., "We assume deliberate pot smashing *always* expresses grief.")
      *   *Sufficient:* Premise is clear, strong (uses "always/primarily"), and directly links A to B.
      *   *Test the Premise:* **What evidence would prove this premise FALSE?** (e.g., "Pots smashed accidentally during a raid," "Smashed pots found in contexts clearly *not* associated with death/grief"). If no falsifying evidence is conceivable, the premise is dogma, not archaeology. *Stop/Revise.*
      *   *Handoff if:* Premise relies solely on untestable philosophical assumptions.

  4.  **Require Multiple Independent Lines:**
      *   *List at least TWO distinct types of evidence supporting the Bridging Premise.*
      *   *Are they TRULY independent?* Do they rely on the *same* underlying assumption? (e.g., "East-facing burials + grave goods depicting the sun" are more independent than "East-facing burials + alignment with solstice sunrise" if the solstice alignment *depends* on the burial orientation being symbolic). *Hats Test:* If both lines disappear if the core assumption (e.g., "orientation is symbolic") is wrong, they are the *same hat*.
      *   *Sufficient:* At least two lines identified AND they pass the Hats Test (different assumptions/mechanisms).
      *   *Stop if:* Only one line, or lines fail Hats Test. Verdict likely "Not Supportable".

  5.  **Evaluate Analogy (If Used):**
      *   *Is an analogy necessary?* (Often needed for Belief/Institution).
      *   *Specify EXACTLY which culture/practice is the analogy.* (e.g., "Pot smashing analogous to *kula* pot-breaking in Culture X documented by Anthropologist Y in Year Z").
      *   *Justify Relevance:* Why is *this specific* analogy appropriate? (Similar environment? Similar technology? Temporal proximity? Demonstrated cultural connection?).
      *   *Break Conditions:* What evidence would *break* this analogy? (e.g., "If the smashed pots are found in midden heaps, not ritual spaces," "If local descendant oral tradition explicitly contradicts this meaning").
      *   *Sufficient:* Specific analogy named, relevance justified, break conditions stated.
      *   *Stop if:* Analogy is vague ("many cultures do this"), unjustified, or break conditions are present/plausible. Analogy *supplements* evidence, *is not* evidence itself.

  6.  **Assess Plausible Alternatives:**
      *   *List 2-3 other plausible explanations for the Action/Pattern that DO NOT require the claimed Belief/Institution.* (e.g., East burials: solar alignment for practical warmth? Dominant wind direction? Simple tradition copying? Brooches: trade? fashion imitation? independent parallel development? Smashed pots: accidental breakage? recycling kiln waste? hostile destruction?).
      *   *Can the current evidence reasonably DISPROVE these alternatives?* If yes, how? If no, note them.
      *   *Sufficient:* At least one strong alternative identified. Lack of disproval acknowledged.
      *   *Stop if:* No plausible alternatives considered.

  7.  **Verdict & Wording:**
      *   **Supported:** Bridging Premise is strong *and* falsifiable, *multiple independent lines* of evidence strongly support it, *plausible alternatives are disproven or highly unlikely*, analogy (if used) is robust. *Wording:* Can state claim confidently ("indicates," "demonstrates").
      *   **Provisional:** Bridging Premise is plausible *and* falsifiable, *some evidence* supports it (may have only one strong line, or multiple weaker ones), plausible alternatives exist but the claimed one is *currently the best fit*, analogy (if used) is reasonable. *Wording:* Use tentative language ("suggests," "may indicate," "possibly reflects," "a plausible interpretation is..."). *State the key condition for upgrading:* (e.g., "If future finds show X...", "If analysis of Y confirms Z...").
      *   **Not Supportable as Written:** Bridging Premise weak/unfalsifiable/dogmatic, insufficient/contradictory evidence, no independent lines, analogy poor/unjustified, plausible alternatives better fit. *Wording:* Describe ONLY the observable Action/Pattern ("forty burials oriented east," "a pit containing deliberately fragmented ceramics," "widespread distribution of similar brooch styles"). Add: "The meaning or reason for this practice remains unclear," or "Interpretations range from X to Y."
      *   *Handoff if:* Verdict hinges on weighing descendant community input, ethical considerations, or non-archaeological values.

  ---

  **Application to Your Examples:**

  **1. Claim: "A ritual of destruction expressing grief" (Smashed Pots)**
  *   **Step 1 (Core Claim):** Belief (Ritual) + Emotion (Grief). Clear.
  *   **Step 2 (A vs. B):** Belief/Emotion. Proceed.
  *   **Step 3 (Bridging Premise):** "Deliberate pot smashing *always/primarily* happens as a ritual expressing grief." **Falsifying Evidence:** Smashed pots in trash middens (cleaning house after death?); smashed pots associated with conquest/violence (anger, not grief?); smashed pots as kiln waste/raw material prep.
  *   **Step 4 (Multiple Lines):** *Line 1:* Smashed pots (Action). *Line 2:* ??? (Context? Associated human remains? Charcoal indicating pyre? Specific types of pots smashed?). **FAIL Hats Test.** Only one line (the smashed pots themselves). Context *might* be a second line *if* it's clearly funerary/ritual *and independent* of the assumption (but proving context is funerary often *requires* assuming the smashing is ritual!). **Insufficient.**
  *   **Step 5 (Analogy):** Likely needed. *Which analogy?* Must be specified. *Break Conditions?* (e.g., if pots are cooking pots, not ritual vessels; if found with food waste).
  *   **Step 6 (Alternatives):** Recycling material; accidental breakage during event; hostile destruction; disposal of damaged goods; preparation for making grog-tempered pottery. **Not disproven.**
  *   **Step 7 (Verdict):** **NOT SUPPORTABLE AS WRITTEN.** Evidence only supports Action: "a pit containing numerous deliberately smashed ceramic vessels." *Provisional Upgrade Path:* "If found within a sealed funerary context alongside human remains and objects associated with mourning in this culture, a ritual interpretation becomes more plausible." *Handoff:* If descendant tradition strongly links pot smashing to grief.

  **2. Claim: "A shared belief in rebirth" (East-Facing Burials)**
  *   **Step 1 (Core Claim):** Belief (Rebirth). Clear.
  *   **Step 2 (A vs. B):** Belief. Proceed.
  *   **Step 3 (Bridging Premise):** "Consistent eastward burial orientation *always/primarily* indicates a shared belief in rebirth (likely linked to the rising sun)." **Falsifying Evidence:** Orientation dictated by practical concerns (prevailing wind, slope, space constraints); simple copying of a dominant local tradition without symbolic meaning; alignment for warmth at sunrise (practical, not rebirth); evidence of *west*-facing burials associated with solar symbolism elsewhere in the culture.
  *   **Step 4 (Multiple Lines):** *Line 1:* Orientation pattern (Action). *Line 2:* Grave goods depicting solar symbols/sun gods? Inscriptions/texts mentioning rebirth/sun? Settlement layout aligned with solstice? Consistency across social strata/ages? **Likely FAIL Hats Test.** Without Line 2, only one line. Is Line 2 truly independent? (Does a solar symbol *only* mean rebirth?).
  *   **Step 5 (Analogy):** Often used (Egypt, Christianity). *Which analogy?* Must be specified. *Break Conditions?* (e.g., if local cosmology associates death with the *west*; if solar symbols are absent; if orientation varies significantly by status/age).
  *   **Step 6 (Alternatives):** Practical constraints; non-religious tradition; alignment for warmth/light; belief in an afterlife journey *not* involving rebirth. **Not disproven.**
  *   **Step 7 (Verdict):** **PROVISIONAL (at best).** Evidence strongly supports *Action:* "a cemetery containing forty burials consistently oriented east-west, with heads to the east." *Wording:* "This consistent orientation *may* reflect symbolic beliefs, possibly related to the rising sun. Interpretations range from practical considerations to concepts of an afterlife journey or renewal." *Supported Upgrade Path:* "If associated grave goods consistently depict solar rebirth motifs *and* local environmental factors cannot explain the orientation." *Handoff:* If descendant community has strong oral tradition about orientation meaning.

  **3. Claim: "A kingdom with a central administration" (Brooch Distribution)**
  *   **Step 1 (Core Claim):** Institution (Centralized Kingdom/Administration). Clear.
  *   **Step 2 (A vs. B):** Institution. Proceed.
  *   **Step 3 (Bridging Premise):** "The widespread (200mi) distribution of identical/very similar brooch styles *always/primarily* indicates political unification under a centralized administration controlling production/distribution." **Falsifying Evidence:** Stylistic similarity due to robust trade networks; independent local production copying a fashionable elite style; parallel development; production at multiple decentralized centers under loose cultural affiliation; evidence of stylistic *variation* correlating with known sub-regions/polities. **Scale (200mi) makes premise inherently shaky.**
  *   **Step 4 (Multiple Lines):** *Line 1:* Brooch style distribution (Action). *Line 2:* Evidence of centralized production (single workshop site with molds/tools for *all* variants)? Standardized weights/materials? Associated administrative artifacts (seals, standard weights, written records of tribute/tax)? Settlement hierarchy indicating a capital? Fortifications implying central control? **CRITICAL FAIL Hats Test.** Brooch style alone is *only one line*. Other potential lines (e.g., settlement pattern) require *independent* evidence of centralization, not just the brooch pattern assumed to *be* that evidence. **Insufficient.**
  *   **Step 5 (Analogy):** May be used (Roman, Carolingian). *Which analogy?* Must be specified. *Break Conditions?* (e.g., if brooches show localized variations; if production debris is widespread; if no associated admin sites).
  *   **Step 6 (Alternatives):** Extensive trade network; elite fashion imitation; shared cultural identity without political unity; independent local production from a common template. **Scale (200mi) makes alternatives VERY plausible and not disproven by brooches alone.**
  *   **Step 7 (Verdict):** **NOT SUPPORTABLE AS WRITTEN.** Evidence supports Action: "brooches of the [Name] style are found distributed across a wide area, approximately 200 miles in extent." *Wording:* "The widespread distribution of this style indicates significant contact and shared cultural connections across the region. Whether this reflects trade networks, the spread of fashion, or political unification remains unclear." *Supported Upgrade Path:* "If found alongside evidence of centralized production, standardized administrative artifacts, and a hierarchical settlement system implying a central place." *Handoff:* If political claims have significant modern ramifications for land/historical narrative.

  **Conclusion:** The PIDP forces explicit reasoning, exposes weak assumptions (especially unfalsifiable bridging premises), demands more than one line of evidence, and highlights plausible alternatives. It successfully flagged the "smashed pots = grief" and "brooches = kingdom" claims as unsupported based solely on the described evidence. The "east burials = rebirth" was downgraded to provisional. It forces descriptive language ("deliberately smashed," "oriented east," "widespread distribution") as the baseline. It surfaces where analogies are crutches and flags issues for your judgment. While imperfect (especially on scale/absence), it provides a defensible, structured rationale for rejecting over-interpretation and promoting responsible, evidence-based communication. Remember: **"Boring but accurate" beats "Exciting but wrong" every time in responsible archaeology.**
