answer: |-
  Here is a self-contained exam question, a model answer, and a detailed marking scheme designed to meet your specifications.  

  ---

  ### **Exam Question (60 minutes, closed book)**  
  **Mechanistic Anomaly Detection: Defining "Same Mechanism"**  

  **Background**:  
  Suppose you’ve audited an AI model on a task and verified a mechanistic account of its computation—a chain of components (e.g., heads, features, activation directions) that processes information left-to-right, called **M**. Now consider three cases:  
  1. **Same behavior, different insides**: On new inputs, outputs match **M**’s predictions, but probes reveal the answer is computed via a different internal route.  
  2. **Same insides, different system**: A retrained model (from scratch) has identical components/arrangement to **M** at your chosen level of description, but weights differ and training was independent.  
  3. **Same behavior, same insides, different level**: All probes (respecting your units, e.g., heads or features) match **M**, but a colleague’s finer-grained redescription makes the computation look mechanistically distinct.  

  **Candidate Criteria for "Same Mechanism"**:  
  - **(a) Behavioral Equivalence**: Same input-output map on the relevant distribution.  
  - **(b) Intervention Equivalence**: Responds identically to a predefined set of interventions (e.g., ablations, activation edits).  
  - **(c) Historical Equivalence**: Same causal history (e.g., formed by identical training processes).  

  **Your Task**:  
  1. **Choose one criterion (a, b, or c)** and defend it as superior to the other two for mechanistic anomaly detection.  
  2. **Apply your criterion** to cases 1–3: Which is a mechanistic anomaly? Which is not? Justify.  
  3. **Critically evaluate your criterion**:  
     - Is "same mechanism" a claim about **the world** or about **the overseer’s knowledge**?  
     - Show whether your criterion avoids two pitfalls:  
       - **Triviality** (everything is anomalous; no two mechanisms are identical).  
       - **Vacuousness** (nothing is anomalous; behaviorally equivalent mechanisms are lumped together).  
     If your criterion collapses into triviality/vacuousness, propose the *least-bad repair*.  
  4. **Name one realistic scenario** where your criterion’s verdict about mechanism identity should **not be trusted**.  

  ---

  ### **Model Answer (650 words)**  
  **Chosen Criterion**: (b) Intervention Equivalence.  

  **Defense Against Alternatives**:  
  Behavioral equivalence (a) ignores internal structure, making it blind to anomalies like deceptive alignment (case 1: different internals matching behavior). Historical equivalence (c) is brittle: retrained models (case 2) may be functionally identical but fail (c) due to new training runs, over-penalizing harmless redundancy. Intervention equivalence (b) avoids both flaws by testing causal structure: mechanisms are identical only if edits (e.g., ablating a head) produce identical changes in behavior *and* intermediate states. This captures *how* computation works, not just inputs/outputs or origins.  

  **Application to Cases**:  
  - **Case 1 (Same behavior, different insides)**: **Anomaly**. Interventions (e.g., ablating a head) would diverge from **M**’s response, revealing different internal logic despite matching outputs.  
  - **Case 2 (Same insides, different system)**: **Not an anomaly**. If component-level interventions (e.g., perturbing a feature direction) yield identical changes to **M**, the mechanism is preserved regardless of weight values or training history.  
  - **Case 3 (Same behavior, same insides, different level)**: **Not an anomaly** (but borderline). Interventions at the *chosen level of description* (e.g., head ablations) match **M**, so mechanisms are identical *at that granularity*. Finer-grained differences are irrelevant to the auditor’s chosen ontology.  

  **World vs. Knowledge**:  
  "Same mechanism" is a claim about **the world** under (b). It asserts an objective, interventionally verifiable causal structure. The overseer’s knowledge is limited by which interventions they test, but the criterion’s truth is independent: undiscovered interventions could reveal hidden differences.  

  **Avoiding Collapse**:  
  - **Triviality?** Avoided. (b) allows non-identical mechanisms (e.g., case 1) but does not demand *perfect* identity: minor weight differences (case 2) may not affect intervention responses.  
  - **Vacuousness?** Avoided. Behaviorally equivalent systems (case 1) can be interventionally distinct.  
  **Repair**: If *no* interventions distinguish two mechanisms, (b) deems them identical—but this risks vacuousness if the intervention set is too narrow. The repair: **dynamically expand interventions** when anomalies are suspected (e.g., add targeted edits for new inputs).  

  **Failure Scenario**:  
  **Trust issues when interventions miss hidden state**. Example: A model uses a *backup circuit* that activates only when the primary circuit is edited. If interventions only test the primary circuit, (b) falsely declares identity. Anomalies like "sleeper agents" could evade detection.  

  **Why (b) is Robust**:  
  Intervention equivalence forces auditors to declare *which causal operations matter*, anchoring "mechanism" to reproducible tests. It accepts that identity is granularity-dependent (resolving case 3) while demanding empirical evidence beyond behavior or history.  

  ---

  ### **Marking Scheme (20 points total)**  
  **Must-hit points (4 points each)**. Deduct points for described omissions:  

  1. **Criterion Defense**:  
     - ✓ Clearly contrasts chosen criterion with both rejected ones using case-based reasoning.  
     - *Typical loss*: Vague comparisons (e.g., "b is better" without addressing how a/c fail specific cases).  

  2. **Case Application**:  
     - ✓ Correct anomaly/non-anomaly labels for all three cases *based on chosen criterion*, with interventions explicitly mentioned for (b)/historical details for (c)/behavior for (a).  
     - *Typical loss*: Inconsistent labeling (e.g., calling case 2 anomalous under (b) without justification).  

  3. **World/Knowledge & Collapse Avoidance**:  
     - ✓ States whether "same mechanism" is ontological (world) or epistemological (knowledge).  
     - ✓ Diagnoses triviality/vacuousness risk and proposes repair *only if collapse occurs*.  
     - *A-grade move*: Notes that **all criteria risk collapse without careful parameterization** (e.g., (b) requires declaring interventions).  
     - *Typical loss*: Ignores one pitfall; confuses world/knowledge (e.g., "it depends on what we know" for (b)).  

  4. **Failure Scenario**:  
     - ✓ Names a *plausible* scenario where the criterion fails, tied to its limitations (e.g., incomplete interventions for (b), non-robust behavior for (a), unobserved training noise for (c)).  
     - *Typical loss*: Generic failure (e.g., "it fails if we’re wrong") without mechanistic specificity.  

  5. **Coherence & Insight**:  
     - ✓ Maintains consistent stance on mechanism identity; uses cases to expose tradeoffs.  
     - ✓ **A-grade separator**: Acknowledges that *no criterion is perfect* and identity is granularity-relative (e.g., "case 3 shows levels matter").  
     - *Typical loss*: Contradictions in reasoning; misses that case 3 challenges *all* criteria.  

  ---

  ### **Why This Works**  
  - **Forces Identity Commitment**: Students must define "same mechanism" via their criterion and apply it to ambiguous cases.  
  - **Punishes Superficiality**: Reciting definitions fails without defending choices, handling collapse, and admitting flaws.  
  - **A vs. B Differentiation**: A answers recognize granularity-dependence (case 3) and proactively address pitfalls; B answers apply criteria rigidly.  
  - **Self-Contained**: No external citations needed; cases/criteria define the universe of discourse.  

  Let me know if you’d like adjustments to the cases or model answer!
