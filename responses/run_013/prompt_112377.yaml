  Okay, the user is a second-year PhD student in political theory with a prospectus due soon. They have a half-formed idea about inheritance taxes and equal opportunity. Their main insight is that "equal opportunity" debates conflate two things: immediate resource transfers (what tax codes address) and dynastic capacity (long-term family influence across generations). They suspect people care more about the latter, but policies target the former, and these can diverge.

  First, I need to help them turn this into a focused research proposal. They want a narrow, answerable question. The existing literature doesn't distinguish between transfer and dynasty, treating them interchangeably. The student needs to show that this conflation is a problem. The challenge is to prove that separating these concepts reveals something new.

  The user is a theorist, so empirical methods like regressions are out. They need a conceptual approach. Possible methods include conceptual analysis, constructing thought experiments, analyzing policy instruments, and genealogical work on key terms. The deliverable could be a taxonomy showing how policies affect each dimension differently, or an impossibility result proving some instruments can't target both.

  Scope is a concern. The advisor is skeptical of purely conceptual projects. I should address how this approach adds value that empirical work can't. Conceptual clarity can reframe debates and expose hidden trade-offs, guiding future empirical research. This project seems feasible for a dissertation chapter or a term paper if tightly scoped.

  The user's deeper needs include validation of their idea's originality, reassurance about the conceptual method, and a realistic timeline. They might fear their insight is obvious or trivial. Emphasizing the literature gap and potential for new frameworks can alleviate that. Also, clarifying how this fits into their PhD trajectory—starting with a chapter—could reduce anxiety about scope creep.

  Finally, defining success and failure is crucial. Success would be a demonstrable misalignment in the literature, showing policies can succeed in one dimension but fail the other. Failure would be if the distinction doesn't yield new insights or if policies are always aligned. Being upfront about these outcomes shows rigor.
answer: |-
  Here’s a structured research proposal tailored to your core insight, designed for clarity, feasibility, and theoretical rigor. This focuses on *diagnosing the conceptual gap* rather than solving the policy problem.

  ---

  **Research Proposal: Dynastic Capacity vs. Resource Transfer: Untangling the Foundations of Equal Opportunity in Inheritance Debates**  

  ### 1. Precise Research Question  
  *Can the conceptual distinction between discrete resource transfers (RT) and dynastic capacity (DC) resolve persistent contradictions in normative arguments about inheritance taxation and equal opportunity, and does this distinction expose limitations in existing policy frameworks?*  

  **Why it’s narrow & answerable:**  
  - It targets *conceptual coherence* in arguments, not policy outcomes.  
  - Success hinges on demonstrating that RT/DC:  
    (a) Are analytically distinct (not reducible to each other);  
    (b) Generate divergent normative demands;  
    (c) Are conflated in key texts, causing confusion.  
  - Answer is "yes" if the distinction clarifies contradictions; "no" if it adds no explanatory value.

  ### 2. Why Existing Literature Doesn’t Settle This  
  The literature treats RT and DC as synonymous or causally linked, obscuring tensions:  
  - **Libertarians** (Nozick, Epstein) focus on RT as an extension of property rights, dismissing DC as irrelevant or inevitable.  
  - **Luck Egalitarians** (Dworkin, Roemer) critique unearned *transfers* but rarely model multi-generational *entrenchment* (DC) as a distinct harm.  
  - **Stakeholder Theorists** (Ackerman, Alstott) address unequal starting points (related to DC) but tie remedies to *lump-sum transfers* (RT), assuming equivalence.  
  - **Empirical Economics** (Piketty, Saez) measures wealth *movement* (RT) but struggles to quantify institutional influence/durability (DC), treating them as proxies.  
  **Gap:** No work systematically *disaggregates* RT and DC to test if they: (i) demand different justifications, (ii) respond differently to policy levers, or (iii) explain why partisans talk past each other on "equal opportunity."

  ### 3. Method: Conceptual Analysis & Normative Reconstruction (Theory-Centric)  
  **Semester Workplan:**  
  - **Weeks 1–4: Conceptual Groundwork**  
    - Define RT (momentary resource shift) and DC (durable power to convert wealth into advantage across generations) with precision.  
    - Construct thought experiments where RT and DC *diverge* (e.g., high estate tax + dynastic trust loopholes; low tax + high social mobility).  
  - **Weeks 5–8: Diagnostic Textual Analysis**  
    - Select 4–5 foundational texts (e.g., Rawls on intergenerational justice, Murphy/Nagel on taxation, Piketty on capital) and contemporary policy debates.  
    - Map how authors: (a) define "equal opportunity"; (b) diagnose harms of inheritance; (c) propose solutions. Flag points where RT/DC conflation occurs.  
  - **Weeks 9–12: Normative Implications & Policy Limits**  
    - Analyze *why* RT and DC generate distinct claims:  
      - *RT* concerns fairness in acquisition/transfer; *DC* concerns structural power and opportunity hoarding.  
      - Test if policies targeting RT (e.g., estate taxes) can *logically* disrupt DC (e.g., if dynasties shift to inter vivos gifts, social capital, or capital returns).  
    - Draft a "taxonomy of policy misalignment" showing how instruments effective for RT may fail for DC (and vice versa).  

  ### 4. Deliverable: Form of the Result  
  - **A Conceptual Taxonomy** demonstrating:  
    - How RT and DC operate on different logics (e.g., RT is transactional; DC is relational/systemic).  
    - Why policies targeting RT (taxes, lump-sum grants) may be *necessary but insufficient* to curb DC.  
  - **An Impossibility Lemma for Policy Design:**  
    *"No single policy instrument targeting discrete transfers can reliably disrupt dynastic capacity if that capacity is maintained through non-transfer mechanisms (e.g., compounding returns, informal networks, educational advantage)."*  
  - **Diagnostic Value:** The conflation of RT/DC explains why debates about "equal opportunity" are intractable—partisans prioritize different aspects of the problem.  

  ### 5. Scope & Feasibility  
  - **This is a dissertation chapter** (15,000–20,000 words). It’s too rich for a term paper but manageable as a core theoretical intervention within a larger project.  
  - **Realistic for 1 semester** if you:  
    - Limit textual analysis to 3–5 key authors/debates.  
    - Focus on *exposing the gap* rather than solving it.  
  - **Stop condition:** If, after rigorous analysis, RT/DC collapses into one concept or adds no explanatory power, the project fails (but this is a valuable negative result!).  

  ### 6. Why Purely Conceptual Work Matters Here  
  - **Empirical work cannot resolve conceptual confusion:** Economists measure wealth *transfers* (RT) but lack tools to quantify "dynastic capacity" (DC) as a social/political phenomenon. Theory must define DC *before* it can be measured.  
  - **The core problem is normative:** Disagreements about "equal opportunity" stem from unstated assumptions about what makes inheritance *problematic*. Conceptual clarity is prerequisite to empirical testing.  
  - **Unique Contribution:** Only theory can:  
    - Isolate the *logic* of dynastic entrenchment apart from material flows.  
    - Show why policies failing to distinguish RT/DC are incoherent *even if empirically effective*.  
  - **Rebuttal to Skepticism:** This isn’t "just semantics"—it diagnoses why policy debates *keep failing*. If DC is the real concern, but tools target RT, theory explains the persistent disconnect.  

  ---

  **What Success Looks Like:** A peer reading your analysis says, "I can no longer read Rawls/Piketty/Nozick the same way—this distinction reframes the debate."  
  **What Failure Looks Like:** The distinction proves trivial (e.g., DC is reducible to RT + time) or doesn’t illuminate texts/arguments.  

  **Next Step:** Build a reading list juxtaposing:  
  1. *Theorists of Transfer* (Nozick, inheritance tax critics)  
  2. *Theorists of Structural Inequality* (Mills, Scheffler on durably unequal societies)  
  3. *Policy Mechanics* (Shaviro on wealth tax design, historical analyses of trusts/estate planning).  

  This is a viable, high-value project. It’s theory doing what it does best: cutting through noise to expose hidden structures. Go sharpen that knife.
