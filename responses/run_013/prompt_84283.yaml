prompt: |-
  I'm on a civic commision that keeps having to rule on statues and street names one at a time -- a bust here, a square there -- and we're doing it entirely ad hoc, case by case, whoever bothers to show up to the meeting. Before we look at any actual theory of commemoration I want the spec sheet first: what does a theory of when a community may keep, remove, relocate, or annotate a monument actually have to deliver? Treat it as the adequacy conditions, not the answer.

  So: the cases it has to get right, with the case given each time. Use these, and add any you think the list is missing:

  - A fountain put up by public subscription in 1902 for a man who funded the town's first schools and also led a militia that burned a neighbouring settlement. Both facts are in the local paper of the day.
  - A statue of a poet erected twenty years ago by an immigrant association, in a language most of the city doesn't read. The community that put it up has since moved away, and it's now a gathering point for a group that reads the poet as theirs.
  - A street named after a living donor who has since been convicted of fraud. Nobody much cares, but renaming means readdressing half the city.
  - A monument whose plaque was stolen in the 70s. No one alive knows who it commemorates; the plinth is a well-known meeting spot.
  - A monument to a figure who was, by the standards of his own time, on the progressive side of the main question of his day, and by ours is on the wrong side of it.

  Then the distinctions I don't want collapsed, because I suspect half our fights are just these getting smeared together:

  - honouring vs. recording (the museum-plaque answer -- is the objection to the statue, or to it standing in the square?)
  - erecting vs. keeping. This is the one I care about most: is keeping a monument an endorsement, or just inertia plus the cost and hassle of removing it? If a theory can't say which, it can't say anything.
  - the honoree's life vs. the monument itself -- can a monument be objectionable in a way the person wasn't, or the reverse?
  - who has standing: current residents, the honoree's descendants, descendants of the people harmed, people who live elsewhere but use the square every day.
  - remove / relocate / re-annotate / counter-monument / leave it up and fund something else -- is that a real menu of distinct options or one option in five costumes?
  - public ownership vs. private, and public land vs. public money.

  And the constraints it can't contradict: that a city is a temporally extended body whose present members never agreed to its past speech acts; that a state's speech is held to different standards than an individual's; that the same object can be public art and a political claim at once; that there may be no neutral option, since taking a statue down is also a statement; and that some value attaches to settlement -- we can't relitigate everything every ten years, but I don't know how to state that without it becoming a licence for whatever happens to already be up.

  Two proposals from colleagues I'd like the list to judge. First, the one-way ratchet: anything can be removed by a two-thirds vote, but nothing new can be erected for fifty years, since we can't know how our own honours will age. Second, the marble rule: only the dead, and only a century dead, on the grounds that a monument is a wager on the future and we should bet small. Does an adequate theory vindicate either, and does it do so for the right reasons?

  Most of all I want the pairs that can't both be satisfied. The one I keep bumping into: the theory has to be able to say the honoree's record was bad enough to matter, but it also has to avoid turning the council into a court of historical moral judgment, since we have neither the competence nor the legitimacy for that -- and yet every removal decision is exactly that judgment. If that's a genuin contradiction, say so, and tell me what has to give. And tell me which single requirement does the most work, i.e. rules out the most otherwise-plausible views (the history-not-heritage line, let-each-community-decide proceduralism, the contextualise-don't-remove compromise, the preservationist default). Skip the reading list, I don't need to be told what to read.
reasoning: |-
  Okay, let me tackle this civic commission query. The user wants adequacy conditions for monument evaluation - essentially a framework checklist before diving into theories. They've provided concrete cases, key distinctions, and constraints, plus two existing proposals to test. 

  First, the cases: each presents unique tensions. The 1902 philanthropist/militia leader forces us to weigh social good against direct harm. The poet statue highlights how meaning shifts with communities - original intent versus current interpretation. The fraudster street name pits practical costs against symbolic appropriateness. The anonymous plinth shows how utility can eclipse commemoration. The "progressive for his time" figure exposes historical relativism dilemmas.

  The distinctions are crucial. Honoring versus recording is fundamental - is the objection to the subject or the presentation? The erecting/keeping difference matters most to the user; we must determine if preservation implies endorsement. The monument/person distinction allows for problematic tributes to good people (or vice versa). Standing questions reveal power dynamics: who decides? And the menu of options (remove/relocate/etc.) needs clarification on whether these are meaningfully different.

  Constraints add philosophical depth. The temporal disconnect between past and present communities is key. Government speech carries different weight than private expression. The dual nature of monuments as art/politics complicates matters. The "no neutral option" reality means every action speaks. Settlement value fights perpetual relitigation but risks entrenching injustice.

  Testing the colleagues' proposals: The one-way ratchet fails on multiple counts. It ignores that new communities deserve representation and that not all new monuments are equally risky. The marble rule (century-old/dead-only) is similarly flawed - it dodges current values and assumes history judges fairly, which it often doesn't. Both proposals collapse under the "erecting vs keeping" distinction since they treat preservation as passive when it's actually active endorsement.

  The core tension they identify is real: evaluating historical morality without playing judge. This seems insoluble at first glance. But perhaps the solution lies in shifting focus from judging individuals to assessing community values. We don't declare "Person X was evil"; we ask "Does this representation align with who we aspire to be?" Still, this requires some historical reckoning - the contradiction can't be fully resolved, only managed through process.

  The most powerful requirement appears to be the erecting/keeping distinction. If keeping isn't neutral endorsement, nearly all common approaches fail. Proceduralism ("let each community decide") ignores that existing monuments already impose values. Contextualization assumes the monument's presence isn't itself problematic. Preservationism depends entirely on seeing retention as passive.

  The settlement constraint does heavy lifting too - it eliminates approaches that demand constant revision. But it must balance with justice concerns, not serve as inertia's shield. Ultimately, any adequate theory must navigate between freezing the past and erasing it, acknowledging that monuments shape public space actively, not neutrally.
answer: |-
  Here's a specification sheet for an adequate theory of commemoration, structured around your cases, distinctions, constraints, and the core tension you identified. It defines what a *minimally viable theory must deliver*, not the theory itself.

  **I. Core Adequacy Conditions (What the Theory MUST Do):**

  1.  **Address All Provided Cases:** It must provide a consistent, principled framework for analyzing each scenario you listed, generating distinct outputs (keep/remove/relocate/annotate/etc.) based on its core logic. It cannot treat them all identically without justification.
  2.  **Respect the Critical Distinctions:** It must explicitly account for and *not* collapse:
      *   **Honouring vs. Recording:** Explain why an object in a square functions differently than in a museum/library context.
      *   **Erecting vs. Keeping:** Define the symbolic meaning of *maintaining* an object in public space. Is it active endorsement, passive inertia, or something else? This is paramount.
      *   **Honoree vs. Monument:** Allow for the possibility that a monument's form, context, or intended message might be problematic even if the honoree's life (by some measure) wasn't, or vice-versa.
      *   **Standing:** Specify whose voices/values/interests carry weight in the decision (current residents, descendants of harmed/honored, regular users, city as temporal entity) and *why*.
      *   **Menu of Options:** Treat "Remove," "Relocate," "Re-annotate," "Add Counter-Monument," "Leave & Fund Elsewhere" as distinct actions with different symbolic and practical meanings, not just synonyms.
      *   **Ownership/Control:** Differentiate decisions involving publicly-owned objects on public land, publicly-owned objects on private land (easements?), privately-owned objects on public land, and objects funded/erected through different mechanisms (public funds, private donation, community subscription).
  3.  **Operate Within Constraints:** It must be compatible with:
      *   The **temporal disconnect** (present community inheriting past speech acts without prior consent).
      *   **Government speech** being held to higher/different standards than individual speech (e.g., perceived endorsement, use of public resources/space).
      *   The **dual nature** of monuments (simultaneously art, history, and political statement).
      *   The **"no neutral option"** reality (inaction/retention is also a communicative act).
      *   The **value of settlement** (avoiding perpetual relitigation) without making it an absolute shield ("whatever is up stays up").
  4.  **Resolve the Core Tension (or Explain Why It Can't):** Address the paradox: Decisions inherently involve assessing the honoree's record and its relationship to current values ("bad enough to matter"), while recognizing the council lacks legitimate *judicial* authority over history and moral judgment across time. The theory must either:
      *   Provide a non-judgmental framework for this assessment (e.g., focus on *harm caused* or *values represented* today, not "evil/good" verdicts), OR
      *   Clearly define the limited scope and legitimacy of the council's *necessary* historical-moral judgment, OR
      *   Demonstrate why this tension is irresolvable within the mandate and specify what *must* give way (e.g., legitimacy requires deferring to majoritarian sentiment regardless of historical nuance, or vice-versa).

  **II. Testing the Colleagues' Proposals Against Adequacy:**

  *   **The One-Way Ratchet (Remove Only, No New for 50yrs):**
      *   *Fails Distinctions:* Collapses "erecting" (forbidden) and "keeping" (allowed unless removed) entirely, treating all retention as acceptable inertia. Ignores the possibility that *not* erecting new monuments for marginalized groups *is* a statement violating "no neutral option".
      *   *Fails Constraints:* Violates the "temporal disconnect" by binding future communities (prevents *their* commemoration for 50 years). Ignores "government speech" – refusing to speak is still state action. Undermines "value of settlement" for *new* communities/values. Fails the core tension by avoiding judgment only for *new* commemorations, leaving past judgments unchallenged.
      *   *Verdict:* Inadequate. Avoids difficult decisions about the past while stifling the present/future.

  *   **The Marble Rule (Only Dead >100 Years):**
      *   *Fails Distinctions:* Implicitly treats "keeping" older monuments as safer/sanctioned by time, potentially confusing historical endurance with endorsement. Neglects analyzing *why* an old monument might be harmful *today* regardless of age.
      *   *Fails Constraints:* Violates "temporal disconnect" by implying past judgments (>100 yrs old) are inherently more legitimate than present ones. Fails "no neutral option" – retaining an old harmful monument is still a choice. Fails "government speech" – the state still hosts it. Fails core tension by *deferring* judgment to the passage of time, which is not a reliable moral arbiter (many injustices were long-enduring).
      *   *Verdict:* Inadequate. Prioritizes age over substance and dodges contemporary responsibility for the meaning of public space.

  **III. The Most Powerful Requirement:**

  The **Erecting vs. Keeping Distinction** does the most work in ruling out otherwise plausible views:

  1.  **"History not Heritage" (Just add a plaque):** Assumes "keeping" is neutral recording. If keeping *is* active endorsement, a plaque is insufficient.
  2.  **Proceduralism (Let each community decide):** If "keeping" is endorsement, procedural fairness alone doesn't resolve the moral weight of that endorsement. A majority vote to keep a harmful monument doesn't negate the endorsement.
  3.  **Contextualise-Don't-Remove:** Relies entirely on the premise that the monument's *presence* isn't inherently problematic, only the *lack of context* is. If its presence *is* the harm (endorsement), contextualization fails.
  4.  **Preservationist Default (Remove only if extreme harm):** Depends entirely on defining "keeping" as passive inertia or respect for history, not endorsement. If keeping *is* endorsement, the bar for removal should arguably be lower.

  **IV. The Core Tension: Is it a Genuine Contradiction?**

  It is **not a strict logical contradiction**, but a **profound practical and legitimacy dilemma**.

  *   **Why it's a Dilemma:** Every removal decision *does* require the council to make a value judgment about the past ("This person/action represented by this monument is incompatible with our core values today"). Councils *aren't* constituted as historical courts, lack specific expertise, and their legitimacy stems from representing the *present* populace, not adjudicating historical morality.
  *   **What Has to Give:** The theory must either:
      *   **Acknowledge Limited Legitimacy & Focus:** Explicitly state that the council's judgment is *not* a final historical verdict but a *present-day assessment of the monument's compatibility with current public values and its impact on the living community*. Shift focus from judging the *person* to assessing the *monument's function and effect* in *today's* public sphere. This doesn't avoid judgment entirely but grounds it in present consequences and communal self-definition.
      *   **Embrace Necessary Imperfection:** Acknowledge that while councils lack perfect legitimacy for historical judgment, they are the *only practical body* empowered to steward public space. The decision is a necessarily imperfect political-ethical act, requiring robust process (transparency, diverse input, clear criteria) to bolster its legitimacy *despite* the lack of historical court status.
      *   **Devolve Judgment (Partially):** Incorporate mechanisms that bring historical expertise and affected community perspectives formally into the process, not just as public comment, but as structured input with defined weight, making the council less the sole "judge" and more the final arbiter weighing multiple inputs.

  **Conclusion for the Spec Sheet:** An adequate theory must be a decision-making *framework*, not just a set of answers. It must transparently navigate the inherent tensions (past/present, endorsement/inertia, judgment/legitimacy) using clearly defined principles applied consistently across diverse cases, while respecting the crucial distinctions you've identified. Its primary task is to make the values and trade-offs inherent in every commemoration decision explicit and defensible. The "Erecting vs. Keeping" distinction is the linchpin; failing here renders most common approaches inadequate. The core tension cannot be eliminated but must be managed through focus (present impact/values) and process (transparency, inclusivity, defined criteria).
