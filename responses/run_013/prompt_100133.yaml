  ### Iterated Elimination of Dominated Strategies (IEDS) Procedure

  **Quick Summary for Your Friends**: "We're crossing off moves that are always worse than some mix of other moves, no matter what the opponent does. If a move can never be your best choice, kick it out. Keep going until nothing else can be kicked."

  **Steps in Order**:
  1. **List all strategies** for yourself and opponents.
  2. **Check strict dominance**:
     - A strategy \(s_i\) is *strictly dominated* if there exists another single strategy or probability mix of your other strategies that gives a **strictly better payoff** against **every possible opponent move**.
     - Quick visual test: Plot payoffs for each of your strategies against opponent moves. If another strategy/mix always sits above \(s_i\)'s payoff curve, \(s_i\) is dominated.
  3. **Eliminate all strictly dominated strategies** (for all players).
  4. **Repeat** with the reduced strategy set until no more strategies can be eliminated.
  5. **Play any surviving strategy**.

  **When to Stop**: When no player has any strictly dominated strategies left.

  **Key Notes**:
  - **No un-crossing**: Once eliminated, a strategy is dead. The procedure assumes common knowledge of rationality (everyone does this elimination).
  - **Justification to Friends**: "This move is garbage because even a random mix of my other moves beats it no matter what you do. Why play it?"
  - **Mixed Strategies**: To check if a mix dominates \(s_i\) without linear programming:
    - For each opponent move \(t_j\), ensure the mix's expected payoff \(\geq\) payoff of \(s_i\).
    - The mix must be **strictly better** for at least one \(t_j\).
    - *Visual shortcut*: If \(s_i\) has a "low point" (e.g., a very bad payoff for some \(t_j\)) and other strategies cover that low point well, a mix likely dominates.

  ---

  ### Case 1: A-B-C Matching Game
  **Payoff Matrix (Row Player)**:
  ```
        Opponent
        A     B     C
    A [ 3,    0,    1 ]
  Me B [ 0,    3,    1 ]
    C [ 1,    1,    0 ]
  ```
  - **Step 1**: Check if any strategy is strictly dominated.
    - **C vs. Pure Strategies**:
      - C vs. A: Against Opp-A, C (payoff=1) < A (3). Against Opp-B, C (1) < B (3). Against Opp-C, C (0) < A (1) or B (1). But not dominated by one pure strategy (e.g., A loses to Opp-B).
    - **C vs. 50/50 Mix of A & B**:
      - Mix payoff vs. Opp-A: \(0.5 \times 3 + 0.5 \times 0 = 1.5 > 1\) (C's payoff)
      - Vs. Opp-B: \(0.5 \times 0 + 0.5 \times 3 = 1.5 > 1\)
      - Vs. Opp-C: \(0.5 \times 1 + 0.5 \times 1 = 1 > 0\)
      - **→ C is strictly dominated by the mix. Eliminate C**.
  - **Step 2**: Reduced matrix (only A and B):
    ```
          A     B
      A [ 3,    0 ]
      B [ 0,    3 ]
    ```
    - No strategy dominates the other: A beats B vs. Opp-A, B beats A vs. Opp-B.
    - No mix dominates A or B (e.g., a \(p\) mix of A and B has payoff \(3p\) vs. Opp-A and \(3(1-p)\) vs. Opp-B, which can’t beat both 3 and 0 simultaneously).
    - **Stop. Surviving strategies: A, B**.

  **Result**: Never play C. Play A or B arbitrarily (coordination required).

  ---

  ### Case 2: 0-100 Game (Closest to \(\frac{2}{3}\) of Average)
  - **Strategies**: Integers from 0 to 100.
  - **Elimination Process**:
    - **Step 1**: Max possible \(\frac{2}{3}\text{avg} \leq \frac{2}{3} \times 100 \approx 66.67\). Any number \(> 67\) is strictly dominated by 67:
      - For any true \(\frac{2}{3}\text{avg} \leq 66.67\), 67 is closer than \(y > 67\) (distance difference: \(y - 67 > 0\)).
      - **Eliminate 68–100**.
    - **Step 2**: Reduced set: 0–67. Max \(\frac{2}{3}\text{avg} \leq \frac{2}{3} \times 67 \approx 44.67\). Any \(y > 45\) dominated by 45. **Eliminate 46–67**.
    - **Step 3**: Reduced set: 0–45. Max \(\frac{2}{3}\text{avg} \leq 30\). **Eliminate 31–45**.
    - **Step 4**: Reduced set: 0–30. Max \(\frac{2}{3}\text{avg} \leq 20\). **Eliminate 21–30**.
    - **Step 5**: Reduced set: 0–20. Max \(\frac{2}{3}\text{avg} \leq \frac{40}{3} \approx 13.33\). Any \(y > 13.33\) (e.g., 14–20) dominated by 13:
      - Distance to true \(x \leq 13.33\): \(|13 - x| < |y - x|\) for all \(y > 13.33\).
      - **Eliminate 14–20**.
    - **Continue**:
      - 0–13: Max \(\frac{2}{3}\text{avg} \leq \frac{26}{3} \approx 8.67\) → eliminate 9–13.
      - 0–8: Max \(\frac{2}{3}\text{avg} \leq \frac{16}{3} \approx 5.33\) → eliminate 6–8.
      - 0–5: Max \(\frac{2}{3}\text{avg} \leq \frac{10}{3} \approx 3.33\) → eliminate 4–5.
      - 0–3: Max \(\frac{2}{3}\text{avg} \leq 2\) → eliminate 3.
      - 0–2: Max \(\frac{2}{3}\text{avg} \leq \frac{4}{3} \approx 1.33\) → eliminate 2.
      - 0–1: Max \(\frac{2}{3}\text{avg} \leq \frac{2}{3} \approx 0.67\) → eliminate 1.
    - **Surviving strategy: 0**.

  **Result**: The only rationalizable move is **0** (assuming common knowledge of rationality). But in practice with non-rational players, you lose if others pick higher numbers.

  ---

  ### Where It Breaks (Misfires and Limitations)
  1. **Weak Dominance & Order Dependence**:
     - If strategies are *weakly* (not strictly) dominated, elimination order matters.
     - *Example*: In a game with payoffs:
       ```
          L     R
       U [1,1  0,0]
       D [0,0  0,0]
       ```
       - U weakly dominates D (better vs. L, equal vs. R). If you eliminate D first, U survives. If you eliminate R first (assuming opponent rationality), then D may appear non-dominated. **Stick to strict dominance to avoid order issues**.

  2. **Coordination Problems**:
     - IEDS may leave multiple strategies (e.g., Case 1’s A and B). No guidance on which to pick.
     - *Solution*: Use focal points, pre-game talk, or randomize. Not IEDS’s job.

  3. **Eliminates Everything**:
     - If all strategies are dominated, IEDS leaves no rational play (rare in practice). *Example*: Matching Pennies. **Fallback**: Play a Nash equilibrium or best guess.

  4. **Non-Rational Opponents**:
     - IEDS assumes common knowledge of rationality. If opponents play irrationally (e.g., pick C in Case 1 or >0 in Case 2), **deviate from IEDS**.
     - *Justification*: "The math assumes everyone does this elimination. If they don’t, we adapt." Use IEDS as a baseline, then adjust for human behavior (e.g., in 0-100, pick \(\frac{2}{3}^n \times 50\) for \(n\) levels of reasoning).

  5. **Computational Limits**:
     - Checking mixed strategies gets hard for large strategy sets. **Heuristic**: Focus on obvious mixes (equal weights) or pure-strategy dominance first. Skip IEDS if the game is too complex and wing it.

  **Final Advice**: IEDS is a pre-game sanity check to prune bad moves. For your game nights:
  - **Case 1**: Cross off C immediately. Justify: "Even flipping a coin between A and B beats C no matter what you pick."
  - **Case 2**: In theory, play 0. In practice, if your crew picks 15–35, play \(\frac{2}{3} \times 25 \approx 17\) and win.
