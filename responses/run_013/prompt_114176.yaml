prompt: |-
  I do brand and type design for a living. right now im drawing a wordmark for a coffee shop called Cascade, and ive drawn the 'a' as basically a circle with a small hook off the bottom right — on its own, honestly, you'd call it a 'q'. my client says it doesnt read as an 'a' and that ive just invented a glyph; weirdly he likes the rest of the wordmark, its just this one letter he wont accept. but in the actual word, everyone whos seen it reads it as an 'a' with no hesitation, and on its own, nobody does. i showed it to another designer friend who shrugged and said letters are pure convention, so if i say its an 'a' then it is and the client is just behind the times. i dont buy that — but i also cant tell the client what rule im breaking, because every typeface draws 'a' differently (some single story, some double, some barely more than a blob) and we still call them all 'a'. so take a position for me. is there a fact of the matter about whether my shape is an 'a'? if there is, where does that fact live — in the shape itself, in the surrounding letters of the word, or in the readers? and if the client is right, name the specific thing ive violated. i want a definate verdict and your reasoning, not a both-sides answer.
