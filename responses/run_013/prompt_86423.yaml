prompt: |-
  I'm supervising a PhD student who wants to turn the old Dutch book argument into a practical audit: point it at any system that reports probabilities -- a forecasting platform, a language model, a lab's elicited credences -- find a set of bets it would accept that guarantees a loss, and use the size of that loss both as a training signal and as a way of explaining to non-philosophers what's wrong with the numbers. She's got three years and a philosophy thesis to write, and I want her on the parts that genuinely need settling rather than the plumbing. Which open questions about Dutch book arguments should she take first, and in what order? Give me the reasoning, not the list: for each, is it upstream or downstream of the others, how much turns on stipulation rather than argument, and what would move it up or down. Two things I dont want waved away. First, is the argument supposed to show you'd be fleeced by a clever bookie, or only that your credences dont hang together? The audit seems to need the first and the literature mostly supplies the second. Second, a colleague insists that anyone who reports intervals instead of point probabilities dodges every book, so the audit only ever punishes people who were already trying to be precise. If he's right, half the field is chasing a ghost; if he's wrong, tell me exactly where the reasoning breaks. And say what you'd have her avoid -- things that look like live questions but are traps. No reading list please, I know the literature.
reasoning: |-
  Okay, the user is supervising a PhD student who wants to apply the Dutch book argument as a practical audit tool for systems that report probabilities. The main goal is to identify inconsistencies by finding sets of bets that guarantee a loss, using the loss size as both a training signal and an explanation for non-philosophers. The user wants guidance on which open questions about Dutch book arguments the student should tackle first, considering dependencies between them, what's based on stipulation versus argument, and what would change their priority. They also have two specific concerns: whether the argument implies vulnerability to a bookie or just internal inconsistency, and whether reporting intervals instead of point probabilities avoids Dutch books entirely.

  First, I need to address the two non-negotiable points. For the first point, the literature mainly frames Dutch book arguments as demonstrating internal incoherence rather than practical exploitability. But the audit requires the latter to be compelling. So the student must bridge this gap by showing how incoherence necessarily leads to exploitability in realistic scenarios. This involves considering operational constraints like transaction costs or market mechanisms, which isn't trivial and sits at the foundation of the audit's validity.

  The second point is about interval reports dodging Dutch books. If intervals are interpreted as representing sets of probability functions, they can avoid sure losses only if the set is convex. But if the system commits to specific decisions based on those intervals, like accepting bets within certain bounds, a Dutch book might still be constructed using combinations of bets that exploit the boundaries. The key here is to formalize how the system uses intervals to make decisions, which challenges the notion that intervals are immune. This issue needs resolution early because if intervals are truly invulnerable, the audit's scope is limited.

  Now, prioritizing the open questions. The foundational question is about exploitability versus incoherence. Since the audit's credibility hinges on showing actual exploitability, this must be addressed first. It's upstream of other issues because without establishing exploitability, the audit's practical relevance is undermined. The resolution involves empirical or simulation-based work on decision environments, which could be time-consuming but essential.

  Next, the interval vulnerability question is critical. If the colleague is correct, the audit only applies to point probabilities, missing many modern systems. The student needs to demonstrate that under decision rules derived from intervals, Dutch books can still be constructed. This involves formalizing decision rules and showing necessary conditions for vulnerability. Since this affects the audit's applicability, it's a high-priority dependency for the core argument.

  Other questions like dealing with logical/mathematical truths, computational limits, and ethical considerations are downstream. For instance, handling logical truths might require syntactic consistency proofs, which depend on the foundational assumptions established earlier. Computational tractability is important for implementation but relies on the prior resolution of theoretical vulnerabilities. Ethical concerns about deliberately exploiting systems come last since they pertain to deployment after the method is validated.

  Stipulation versus argument plays a role here. The shift from incoherence to exploitability involves stipulating operational parameters, which might be contested. Similarly, for intervals, the choice of decision rules is a stipulation that could be debated. The student should focus on robust arguments where possible, using formal proofs for vulnerability conditions and simulations to bolster practical exploitability.

  Traps to avoid include deep dives into generalized probability theories or debates on subjective probability interpretations unless directly relevant. Also, philosophical debates on justification versus coherence might distract from the practical goals. The student should stay focused on formal and computational aspects that directly impact the audit's feasibility and scope.

  In summary, the student should first tackle exploitability vs. incoherence, then interval vulnerability, as these are foundational to the audit's validity and scope. Subsequent issues can be addressed once these are resolved, ensuring the core methodology is sound before moving to implementation challenges.
answer: |-
  Here’s a structured approach to prioritizing the open questions, grounded in their dependencies and your non-negotiables. The goal is to direct your student to the **high-leverage, unsettled foundations** that could sink the audit if unaddressed, while deferring "plumbing" (implementation details) until the core viability is secure.  

  ### Core Hierarchy of Dependencies  
  1. **The Exploitability Gap (Your First Non-Negotiable)**  
     - **Why upstream?** If the audit can’t credibly show that incoherent probabilities *would* (not just *could*) be exploited by a realistic adversary, it fails as a practical tool. The literature treats DBAs as *synchronic coherence checks*—proof that beliefs violate the probability axioms. But for your audit:  
       - **Stipulation vs. Argument:** The leap from "incoherence" to "exploitable in practice" hinges on operational assumptions:  
         - *Transaction costs* (does the bookie need frictionless, cost-free betting?),  
         - *Access* (can the bookie observe all probabilities simultaneously?),  
         - *Strategy* (can the bookie construct arbitrarily complex bets?).  
       - **What moves it?** Empirical work (e.g., simulations of adversarial betting in constrained environments) or formal decision-theoretic models (e.g., embedding the system in a market with incentive-compatible mechanisms). If she can show that even bounded bookies exploit incoherence robustly, this moves up.  
     - **Trap to avoid:** Philosophical debates about "rationality." Focus on *mechanism design*: "Under what market-like conditions does incoherence → guaranteed loss?"  

  2. **Vulnerability of Intervals (Your Second Non-Negotiable)**  
     - **Why upstream?** If intervals are invulnerable, the audit’s scope collapses to point estimators—a fatal limitation.  
       - **Where the reasoning breaks:**  
         - **Classical DBA:** Intervals *can* avoid incoherence if they represent *sets* of coherent probabilities (e.g., Levi-admissible credence sets). But your colleague assumes systems *use* intervals passively.  
         - **The audit’s hook:** If a system *accepts/rejects bets based on intervals* (e.g., "I take any bet with positive expected value under *some* probability in my interval"), it becomes vulnerable. Example:  
           - System A reports interval [0.4, 0.6] for event E.  
           - Bookie offers:  
             - Bet 1: Pays £1 if E, costs £0.45 → A accepts (since max EV = 0.6 - 0.45 > 0).  
             - Bet 2: Pays £1 if ¬E, costs £0.55 → A accepts (max EV = 0.6 - 0.55 > 0? Mistake: EV for ¬E bet is 0.55 - P(¬E). If P(E)=0.4, P(¬E)=0.6, EV = 0.55 - 0.6 = -0.05 < 0. But if A evaluates each bet separately *using only its own interval*, it miscalculates).  
           - A pays £0.45 + £0.55 = £1.00, wins max £1.00 (if E or ¬E), guaranteeing loss.  
         - **Key:** Systems using intervals for *decision rules* (not just uncertainty reporting) can be incoherent *in their betting behavior*.  
       - **Stipulation vs. Argument:** The vulnerability turns on how intervals translate to betting commitments. If the system’s "acceptance rule" is formally defined, Dutch books exist iff the rule violates the axioms of *decision robustness* (e.g., avoiding sure loss under all compatible priors).  
     - **What moves it?** Formalize the system’s betting protocol. If it commits to *any* rule beyond "I report a set," exploitability follows (see Walley’s theory of lower previsions).  

  3. **Logical/Math Omniscience & Computation**  
     - **Downstream of 1 & 2.** DBAs assume agents spot all logical entailments (e.g., if P(A)=0.6 and P(B|A)=0.5, but B⊢A, incoherence). Real systems (LMs, forecasters) don’t.  
       - **Stipulation:** Must define "feasible" coherence. Is it tractable (polynomial-time checkable)? Approximate?  
       - **Trap:** Don’t dive into "bounded rationality" yet. First, show that *even with known logical constraints*, the audit finds exploitable gaps. Move this up if early tests show systems violate obvious logical constraints (e.g., P(A) + P(¬A) ≠ 1).  

  4. **Dynamics & Updating**  
     - **Downstream.** Synchronic DBAs (one-time bets) are simpler but less realistic. If probabilities update (e.g., LMs in conversation), diachronic Dutch books matter.  
       - **Stipulation:** What counts as a "fair" update? Bayesian?  
       - **Defer initially:** Audit v1.0 can be static. But if diachronic incoherence is common (e.g., LMs violating reflection), prioritize after core exploitability.  

  5. **Loss Metric as Training Signal**  
     - **Downstream.** How to map "size of loss" to gradient signals? Depends on system architecture (e.g., differentiable forecasts vs. black-box elicitation).  
       - **Trap:** Don’t build the training pipeline until the audit’s *detection* logic is watertight.  

  ### Traps to Avoid  
  - **"Generalized Probability" Digressions:** Non-additive frameworks (e.g., Dempster-Shafer) "avoid" Dutch books by redefining coherence. But if your audit targets systems *claiming* to use standard probability, this is irrelevant.  
  - **Interpretation Wars:** Don’t litigate subjectivism vs. frequentism. Treat probabilities as *decision-guiding commitments*.  
  - **Infinite Regresses:** E.g., "What if the bookie is also incoherent?" The audit assumes an ideal adversary—like penetration tests assume skilled hackers.  

  ### Recommended Order & Rationale  
  1. **Resolve exploitability (Non-Negotiable #1)**  
     - *Why first?* Without this, the audit is a philosophical toy.  
     - *Action:* Formalize a "pragmatic DBA" with constraints (e.g., bookie sees only published probabilities, limited bet types). Simulate exploitation on synthetic incoherent agents.  
  2. **Defang the interval objection (Non-Negotiable #2)**  
     - *Why next?* Half the target systems use intervals; if invulnerable, the project bleeds out.  
     - *Action:* Prove that systems using intervals *to make betting decisions* are vulnerable iff their decision rule is non-convex (Walley’s work is key here). Code a PoC against interval-based forecasters.  
  3. **Tractable coherence checking**  
     - *Why now?* Audit must run feasibly. Identify low-hanging fruit (e.g., violations of P(A) ≤ P(B) when A⊢B).  
  4. **Dynamics/Loss-as-signal**  
     - *Why last?* Dependent on 1–3.  

  **What moves things up/down:**  
  - If early experiments show systems are *obviously incoherent* (e.g., P(A) + P(¬A) = 1.2), exploitability (#1) becomes urgent.  
  - If target systems overwhelmingly use intervals (e.g., climate models), #2 jumps to pole position.  
  - If industry partners demand "real-time" audits, diachronicity (#4) gains priority.  

  The student should **write code early**—even a crude audit against toy systems will force concrete engagement with these questions. Philosophy theses thrive when grounded in a hard, unsolved *thing*—here, "How do we *build* the bookie?" is that thing.
