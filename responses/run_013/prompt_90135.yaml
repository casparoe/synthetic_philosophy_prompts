  For the characters, I'll name them Dr. Aris Thorne (the critic) and Dr. Lena Vance (the prioritarian) to give them distinct voices. I'll make sure both make strong points: Lena will emphasize that her weighting function avoids leveling-down while still prioritizing the worse-off, while Aris will press whether this approach leads to implausible trade-offs in real cases. Their final exchange should leave Lena facing a dilemma about whether to accept extremely steep priority weightings or abandon prioritarianism altogether.

