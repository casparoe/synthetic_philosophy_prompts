answer: |-
  ### Democratic Decision-Making Simulation: "The Rotating Council"  
  **Core Concept:** Students experience tradeoffs between electoral, sortition, and self-referential selection methods while grappling with representation, accountability, and rotation—without upfront theory.  

  ---

  ### **Materials**  
  1. **Preference Cards** (18 unique cards, distributed secretly):  
     - **Group A (5 students):** *"Prioritize GROUP A receiving MAX points. Secret secondary goal: Ensure no group gets <15 points (fairness)."*  
     - **Group B (5 students):** *"Prioritize GROUP B receiving MAX points. Secret secondary goal: Allocate points proportionally to group size (A:5/18, B:5/18, C:4/18, D:4/18)."*  
     - **Group C (4 students):** *"Prioritize GROUP C receiving MAX points. Secret secondary goal: Award ≥40 points to ONE group (excellence deserves reward)."*  
     - **Group D (4 students):** *"Prioritize GROUP D receiving MAX points. Secret secondary goal: Minimize GROUP A’s points (historical rivalry)."*  

  2. **Stakes:**  
     - A "Participation Point Pool" (100 points/round) to be allocated among groups.  
     - **Real impact:** Points convert to 1% extra credit on the next assignment (max 3% if a student’s group "wins" all rounds). *No real money; symbolic but motivating.*  

  3. **Body Size:** 4 students per round (small enough to force tradeoffs).  

  ---

  ### **Timeline (90 Min)**  
  #### **Round 1: Election/Volunteering (25 Min)**  
  - **Goal:** Feel electoral incentives (popularity/strategy over competence).  
  - **Rules:**  
    - Body selected via open nomination + approval voting: Each student votes for up to 4 candidates; top 4 win.  
    - **Rotation Constraint:** Winners ineligible for Round 2.  
  - **Task:** Allocate 100 points among Groups A, B, C, D.  
  - **Predictable Tension:** Confident students dominate; Groups C/D may be underrepresented.  

  #### **Round 2: Sortition (25 Min)**  
  - **Goal:** Feel randomness (inclusion vs. incompetence).  
  - **Rules:**  
    - 4 students drawn randomly from non-Round1 members.  
    - **Rotation Constraint:** Winners ineligible for Round 3.  
  - **Task:** Reallocate 100 points (fresh start).  
  - **Predictable Tension:** Quiet students may struggle; decisions may seem arbitrary or fair.  

  #### **Round 3: Self-Referential Rule (30 Min)**  
  - **Goal:** Feel the "regress problem" (who chooses the choosers?).  
  - **Rules:**  
    - **Round 2 body designs the next selection rule** (e.g., "election with speeches," "sortition from volunteers," "hybrid").  
    - Rule must exclude Round 2 members (forced turnover).  
    - Class implements the new rule to select Round 3 body.  
  - **Task:** Allocate final 100 points.  
  - **Predictable Tension:** Round 2 may design self-serving rules (e.g., "sortition from Group B").  

  #### **Debrief (10 Min)**  
  Introduce terms *after* the simulation:  
  - **Descriptive vs. Substantive Rep:** *"In Round 1, did the elected body look like the class? Did they fight for your group’s goals?"*  
  - **Accountability:** *"Could you hold the random body accountable? Did elected members promise things they ignored?"*  
  - **Regress Problem:** *"When Round 2 designed Round 3’s rule, did you trust them? Who guards the guardians?"*  
  - **Rotation Tradeoffs:** *"What did we lose when experienced members rotated out? What did we gain?"*  
  - **Amateur vs. Professional:** *"Did random recruits deliberate differently than confident volunteers?"*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Time Overruns:**  
     - *Fix:* Use a visible timer. If a body deadlocks, impose majority vote.  

  2. **Unbalanced Representation:**  
     - *Fix:* Let it happen! (e.g., if Group C/D is excluded in Round 1, debrief "tyranny of the majority").  

  3. **Round 2 Struggles with Self-Referential Rule:**  
     - *Fix:* Give 2 rule options if they stall: "Default to sortition if no decision in 5 min."  

  4. **Students Ignore Secondary Goals:**  
     - *Fix:* Privately remind body members: *"Don’t forget your secret goal!"*  

  5. **Low Stakes = Low Engagement:**  
     - *Fix:* Emphasize extra credit; praise "high-stakes" behavior publicly.  

  ---

  ### **What This Activity Can’t Simulate (Instructor Notes)**  
  1. **Long-Term Career Incentives:** Real politicians build expertise over decades; here, rotation is instant. *Debrief:* "In reality, losing experienced legislators might cost institutional memory."  
  2. **Parties/Media:** No campaigns, parties, or spin. *Debrief:* "Elections here lacked misinformation or party machines—key flaws in real democracies."  
  3. **Scale:** 18 students ≠ millions of citizens. *Debrief:* "Sortition scales poorly without stratified sampling."  
  4. **Coercive Power:** Bodies can’t enforce decisions. *Debrief:* "Real governments have police and taxes; this misses legitimacy tensions."  

  ---

  ### **Why This Works**  
  - **Election Round:** Rewards extroverted, strategic students; may lead to pork-barrel promises.  
  - **Sortition Round:** Rewards "ordinary" students; may reveal deliberation gaps.  
  - **Self-Referential Round:** Exposes rule-making biases ("Do we trust ourselves to be fair?").  
  - **Rotation:** Forces turnover—students see expertise lost *and* stagnation prevented.  

  By the debrief, students will have felt why Athens used sortition, why Madison feared it, and why rotation thrills and terrifies—all before hearing the jargon.
