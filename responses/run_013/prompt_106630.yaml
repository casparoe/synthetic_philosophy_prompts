            - Did the body look like the class?

          Substantive representation: 
            - Did the body members advocate for the interests of their group? 
            - How did the selection method affect that?

          Accountability:
            - In the election round, did the elected members feel accountable to those who elected them? 
            - How about in the sortition round? (They might feel accountable to no one, or to the whole class.)

          The selection regress:
            - In Round3, the body chose the rule for the next body. What rule did they choose? Why? 
            - How did that feel? (This is the problem of who selects the selectors: it can go on forever, and the initial rule might be arbitrary.)

          Rotation and turnover:
            - What happened when experienced members (from Round1) were rotated out in Round2? 
            - What about when Round2 was rotated out? 
            - What did we gain (fresh perspectives) and lose (experience, expertise)?

          Amateur vs. professional:
            - In the sortition body, were the members less prepared? Did they deliberate differently? 
            - In the elected body, did they seem more confident? 
            - What are the trade-offs?

          Also, note the incentives:
            - Who benefited from election? (The popular, the strategic, the confident)
            - Who benefited from sortition? (Anyone, but especially those who might not run for office)

          Objections to sortition: 
            - Incompetence? (Did the random body struggle?) 
            - Lack of accountability? (Did they make arbitrary decisions?)

          Objections to election: 
            - Elite capture? (Did the same type of people get elected?) 
            - Short-term thinking? (Trying to please voters)

     Also, discuss the private goals: 
          - How did the additional beliefs (like the fairness constraint or the rivalry) play out? 
          - Did they lead to compromise or conflict?

   Predictable problems and how to handle:

     1. Time management: 
          - We have tight timelines. The instructor must be strict with time. Use a timer. If a body can't decide in the time, the instructor can impose a decision rule (e.g., majority vote).

     2. In Round1 election: 
          - Too many candidates? We limit nominations to 2 minutes and then vote. 
          - Tie in votes? The instructor can break the tie arbitrarily (e.g., flip a coin) or by a run-off among the tied.

     3. In Round2 sortition: 
          - The random body might be very quiet and struggle to deliberate. The instructor can remind them that they have to make a decision in 10 minutes. They can also assign a facilitator randomly (e.g., the first name drawn is the chair).

     4. In Round3: 
          - The Round2 body might take too long to decide the selection rule. The instructor can give them a 5-minute hard stop and then if they haven't decided, impose a default (e.g., sortition). 
          - The rule they choose might be complex and take time to implement. The instructor must be ready to interpret and implement quickly.

     5. Representation: 
          - It might happen that a group is not represented in a body (especially in the random one). That's a learning moment: in debrief, discuss how that affected the decision.

     6. Students not taking it seriously: 
          - The instructor should emphasize that the simulation is a core part of the class and that they should try to act according to their preference card.

     7. The body not consulting the class: 
          - That's okay; we want to see if they feel accountable without being forced.

     8. The same students keep getting selected in different rounds? 
          - The rotation rule prevents consecutive service, but in Round3, Round1 members are eligible. If a student is elected in Round1 and then again in Round3, that's acceptable.

   What the activity cannot reproduce:

     - The multi-decade timescale of real politics: We have 20-minute rounds. Real political careers and institutional memory build over years.
     - The infrastructure of parties and media: We don't have parties, campaigns, or media scrutiny. The election is very simple.
     - The complexity of policy: Our decision is a simple allocation. Real policy is multidimensional and requires expertise.
     - The scale: We have 18 students. Real democracies have millions.
     - The stakes: Real politics has life-and-death stakes; we have symbolic points.

     The instructor should note these limitations in the debrief and explain that the simulation is meant to illustrate certain mechanisms in a simplified way.

   Final note: The preference cards should be handed out at the beginning and collected at the end to maintain privacy.

