  The user is familiar with the standard criticisms of CJT (correlated votes, strategic voting, etc.) and wants a prioritized list of unresolved questions that would significantly impact the field. They've highlighted five specific areas they want me to weigh in on: (a) dependence vs. shared bias, (b) the unit of aggregation (voter vs. evidence), (c) propositions vs. decisions, (d) fixed competence vs. dynamic competence through deliberation, and (e) the regress problem in competence estimation.

  I need to approach this systematically. First, I'll brainstorm candidate questions based on the user's prompts and other important gaps in CJT research. Then I'll rank them based on upstream impact, tractability, neglect, and potential for near-term progress. For each question, I'll address why it's fundamental, how feasible it is for different researchers, how underexplored it is, and what could change its priority.

  Here are the candidate questions I'm considering:
  1. The ontology of competence: What exactly are we aggregating? (Ties to user's points b and d)
  2. Dynamic competence: How does interaction change epistemic reliability? (User's point d)
  3. Shared bias vs. statistical dependence: Which is more damaging to CJT? (User's point a)
  4. Proposition-decision gap: How does aggregating beliefs differ from aggregating actions? (User's point c)
  5. Meta-competence regress: Can we bootstrap competence estimation? (User's point e)
  6. Applicability to real-world mechanisms: Is CJT useful for design or just math? (User's final concern)

  After careful consideration, I'll rank these questions by their upstream nature. The ontology of competence (#1) seems most fundamental because we can't even define "competence" without addressing what we're measuring. Next comes dynamic competence (#2) since static CJT assumptions break if interaction changes competence. Shared bias (#3) follows as it attacks the core independence assumption. The proposition-decision gap (#4) comes next as it affects how we apply CJT. Meta-competence (#5) is slightly downstream, and applicability (#6) is a practical implementation question.

  For each question I'll keep, I'll explain:
  - Why it's upstream
  - Tractability for philosophers vs. formal/empirical researchers
  - How neglected it is
  - What could change its priority soon

  Then I'll recommend which two to fund and suggest alternative work for the third researcher. Throughout, I'll maintain a critical view on whether CJT can be applied to real-world mechanisms without becoming "cargo-cult math."

  The user seems sophisticated—likely an academic leading a research team. They're frustrated with superficial critiques of CJT and want transformative questions. Their unspoken need might be identifying high-leverage research that could redefine the field while avoiding dead ends. I'll be honest about limitations, especially regarding real-world applications.
answer: |-
  Here’s my structured reasoning, followed by the ranked agenda. I’ve brainstormed candidate questions, filtered for transformative potential (not local/dead ends), and ordered them by *upstream leverage*: how deeply they reconfigure foundational assumptions, forcing downstream work to adapt.

  ### Brainstorming & Filtering
  **Candidate Questions:**  
  1. **Ontology of "competence"**: What *is* being aggregated? Voters? Evidence-states? (Linked to your point B)  
  2. **Dynamism vs. stasis**: Can competence be fixed when deliberation/campaigns alter it? (Your point D)  
  3. **Bias vs. dependence**: Is shared systematic bias more corrosive than statistical dependence? (Your point A)  
  4. **Proposition-decision gap**: Does aggregating *beliefs* (P) vs. *actions* (decision-to-act-on-P) fracture CJT? (Your point C)  
  5. **Meta-competence regress**: Can we bootstrap competence estimation without infinite regress? (Your point E)  
  6. **Applicability to mechanisms**: Is CJT a design tool or a fragility proof? (Your final prompt)  
  7. *Rejected: Heterogeneous competence* (well-mapped; solutions exist but are context-dependent)  
  8. *Rejected: Strategic voting under CJT* (extensively modeled; equilibrium analyses dominate)  

  **Ordering Principle:**  
  Upstream questions redefine *what CJT is about*. Questions 1 and 2 attack the *ontology* and *temporality* of competence—if these shift, everything else (bias, aggregation units) must be rethought. Question 3 redefines failure modes. Question 4 exposes a hidden fracture in CJT's applicability. Question 5 is critical but *operational* (applies after competence is defined). Question 6 is meta-practical.  

  ---
  ### Ranked Agenda (Highest Leverage First)
  **1. Ontology of Competence: Evidence-States vs. Voters**  
  - **Why upstream?** If competence attaches to evidence-states (e.g., 20 people reading the same memo = 1 independent "vote"), not voters, CJT collapses into an evidence-tracking problem. This forces a rewrite of "independence" and "group size."  
  - **Tractability:** Philosophers excel here (conceptual analysis, epistemology). Requires formal work to model evidence-partitioning.  
  - **Neglect:** Severe. Most extensions assume voters=units; evidence-as-unit is niche (e.g., Dietrich & List) but underexplored empirically.  
  - **Near-term mover:** An empirical study showing groups with shared evidence don’t outperform solo agents (would elevate); a formal proof that evidence-units restore CJT under partitioning (would partially resolve).  
  - **Risk:** Could dissolve CJT into general epistemology.  

  **2. Dynamic Competence: Deliberation as Competence Transformer**  
  - **Why upstream?** If deliberation *changes* p(competence), static CJT is a special case. This forces models to treat groups as dynamical systems, not aggregators.  
  - **Tractability:** Ideal for philosopher-modeler teams (conceptualize dynamics + simulate/measure). Pure philosophers struggle with feedback loops.  
  - **Neglect:** Growing work on deliberation, but rarely integrated with CJT’s probabilistic framework. Most models assume fixed p.  
  - **Near-term mover:** A lab experiment showing deliberation *reduces* independence without raising competence (debunks "more talk, better CJT"); a simulation proving dynamically updated p can *worsen* group accuracy under bias.  
  - **Risk:** May reveal CJT as inapplicable to deliberative bodies.  

  **3. Shared Bias vs. Statistical Dependence: Which Sinks CJT Harder?**  
  - **Why upstream?** Correlated errors *can* wash out with size (if mean-unbiased); shared bias *cannot*. If systematic bias dominates, CJT’s "bigger=better" fails catastrophically.  
  - **Tractability:** Formal/modeler sweet spot. Requires quantifying bias/dependence in real data (e.g., meta-analysis of forecasting errors).  
  - **Neglect:** Dependence is well-studied; bias is treated as a subcase. Rigorous separation is rare.  
  - **Near-term mover:** Empirical evidence that shared bias explains >90% of collective error in domains like policy forecasting (would upend); a theorem showing size amplifies bias-driven error faster than dependence-driven error.  
  - **Risk:** May prove CJT irrelevant in polarized/ideological settings.  

  **4. Proposition vs. Decision Aggregation**  
  - **Why here?** CJT assumes voting "P is true." But if the vote is "do X" (where X depends on P), strategic voting or moral preferences distort independence. This fractures CJT’s applicability to real decisions.  
  - **Tractability:** Philosophers + light formalization (e.g., merging CJT with social choice). Empirically testable in experiments.  
  - **Neglect:** Glossed over in CJT literature; adjacent to "rational ignorance" in political science but not integrated.  
  - **Near-term mover:** A model showing majority-trustworthy groups on propositions become untrustworthy on decisions due to incentive misalignment.  

  **5. Meta-Competence Regress**  
  - **Why downstream?** Presumes competence exists and is estimable. Important but less foundational.  
  - **Tractability:** Formal (Bayesian modeling) + behavioral experiments.  
  - **Near-term mover:** An algorithm for robust competence estimation from sparse data.  

  ---
  ### Funding Recommendations & Honest Appraisal
  **Fund these two:**  
  1. **Ontology of Competence** (Philosopher + Modeler)  
     - *Why:* Reshapes what CJT *is*. Success could unify evidence aggregation (e.g., model ensembles) with voter aggregation.  
     - *Task:* Conceptualize evidence-units; simulate partitioning in model ensembles vs. human groups.  
  2. **Dynamic Competence** (Philosopher + Modeler)  
     - *Why:* CJT assumes static worlds. Modern problems (misinformation, AI advice) are dynamic. This could bridge to adaptive systems.  
     - *Task:* Lab experiments on deliberation with controlled evidence exposure; coupled agent-based models.  

  **For the third person (empirical/modeling specialist):**  
  - **Pivot to testing shared bias in real systems.** Use existing data (e.g., prediction markets, scientific peer review) to decompose errors into bias vs. dependence. *Why:* Directly addresses question 3 with low cost; builds empirical foundations for others. If bias dominates, it cautions against naive CJT applications.  

  **On Real-World Applicability:**  
  > **The honest answer:** CJT is not a design tool—it’s a *fragility proof*. Its assumptions (independence, fixed p>0.5) are unrealistically strong for most social systems. Using it to justify "bigger groups = better decisions" in citizens’ assemblies or model ensembles is often cargo-cult math.  
  >  
  > **The honest project:** Treat CJT as a *stress test* for real mechanisms. Ask: *When does this system approximate CJT conditions?* Focus on mitigating *bias* (not just dependence) and *evidence-quality control* (not just headcount). For model ensembles, this might mean diversity-promoting algorithms; for citizens’ assemblies, evidence-curated deliberation. The goal isn’t to implement CJT—it’s to identify where its logic *fails* and engineer workarounds.  

  This agenda prioritizes reconfiguring CJT’s foundations (1-2), then its failure modes (3-4). Settling any of the top three would force the field to pivot. The rest follows.
