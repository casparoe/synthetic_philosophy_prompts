prompt: |-
  Act as a philosopher of social science who is equally at home in the formal results on judgment aggregation and in the messier empirical work on deliberation and group forecasting — someone who could referee for a political philosophy journal and also write the simulation code. I want you to think carefully here; before you answer, do some visible brainstorming: lay out the candidate questions you can see, then cut and order them. Don't just list them — the ordering and the defence of it is the point.

  Context: I'm part of a small group deciding where to put about three researcher-years of support, probably two philosophers and one person who's handy with models and data, on the Condorcet jury theorem and the work it's spawned. You know the core claim: if each voter is more likely than not to be right and the voters are independent, bigger groups are more likely to be right, approaching certainty as the group grows, with the mirror-image result when competence falls below chance. I'm less interested in that then in what's still open around it, and which of those open things are actually worth a career.

  I don't want a survey of the standard worries — correlated votes, strategic voting, heterogeneous competence, whether the theorem justifies democracy or only describes juries. Assume I know those. What I want is a ranked agenda: which unresolved questions, if settled, would change how the rest of the field looks, and which look important but are actually local or already dead. Some things I'd like you to weigh in on rather than take for granted: (a) whether the real crux is dependence at all, or whether systematic shared bias is worse, since correlated but unbiased errors wash out with numbers and a shared bias doesn't; (b) whether the right unit of aggregation is the voter or the body of evidence, so that twenty people who all read the same memo should count as one; (c) whether the theorem is really about propositions or about decisions, because majority voting on a claim and majority voting on what to do may come apart badly, and I don't think that gap gets enough attention; (d) whether 'competence' can be treated as fixed when deliberation and campaigning plausibly change it, and what happens to the whole framework if it can't; (e) the regress of estimating everyone else's competence when you're deciding whether to defer.

  For each question you keep on the list: say why it's upstream of the others, how tractable it is for philosophers as opposed to formal or empirical people, how neglected it is, and what result in the next year or two would move it up or down the ranking. Then tell me which two you'd actually fund and what you'd tell the third person to do instead.

  One more thing I'd like you to take seriously and not wave away: should this framework be pushed toward designing aggregation mechanisms in the real world — citizens' assemblies, prediction markets, expert panels, peer review, and the one I care most about, pooling outputs from many samples or many models — or are the idealisations doing so much work that importing the theorem into those settings is just cargo-culting the maths? If it's the latter, say so, and say what the honest version of the project would be.

  Keep the formalism light enough that I can follow it, don't hand me a reading list, and don't invent citations. Where you're unsure whether something is settled, say so.
reasoning: |-
