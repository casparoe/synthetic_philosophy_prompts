  **FOR IMMEDIATE RELEASE**  
  **International Commission on the Integrity of Nature's Joints (ICIN)**  
  **BUREAU OF ONTOLOGICAL STANDARDS**  
  **Docket No. ICIN-2024-R-047: Decennial Catalogue Review Findings**

  **DATE:** October 26, 2024

  **SUBJECT:** Official Release of the Revised Catalogue of Natural Kinds (Edition XI) Following the 2024 Decennial Review; Summary of Key Determinations and Public Comment Period Opening.

  The International Commission on the Integrity of Nature's Joints (ICIN), acting under its mandate pursuant to the Unified Framework for Ontological Clarity (Resolution 78-b), has completed its decennial review of the Official Catalogue of Natural Kinds. After extensive deliberation, analysis of submitted evidence (Docket Items ICIN-2024-E-001 through ICIN-2024-E-422), and application of established regulatory criteria (Sections 5.1-5.9, Ontological Standards Code), the Commission hereby announces the key determinations ratified by a majority vote of the seated Commissioners. The updated Catalogue (Edition XI) is effective upon publication.

  **Summary of Key Determinations:**

  1.  **Re: Application of "Essential Property" Requirement (Catalogue Entry Review: Generic "Fish" - Ref: Docket ICIN-2024-E-114):** The petition to de-list "Fish" as a Natural Kind due to the absence of a single, universal, essential property shared by all members (e.g., lacking a defining genetic or morphological essence across lineages) was reviewed. The Commission acknowledges the phylogenetic inconsistency noted (e.g., closer relationship between lungfish and tetrapods than between lungfish and tuna). However, **the petition is DENIED.** The Commission finds that "Fish" qualifies for retention under **Cluster Property Licensure (CPL - Section 5.4b).** While no single essence defines all fish, a statistically significant cluster of morphological, ecological, and developmental properties (e.g., aquatic habitat, gill respiration in early life stages, fin structures, body plan) co-occur with sufficient frequency and historical recognition to warrant inclusion. A **Provisional Natural Kind License (Type 2 - "Phylogenetically Ambiguous Cluster")** is issued, requiring review at the next decennial cycle pending further cladistic analysis. The category is flagged in the Catalogue as "Phylogenetically Non-Monophyletic."

  2.  **Re: Boundary Vagueness and "Administrative" Status (Catalogue Entry Review: "Mineral Group 17" - Ref: Docket ICIN-2024-E-287):** Concerns were raised regarding the gradual transition zone between Mineral Group 17-A and Mineral Group 17-B, leading to specimens with ambiguous compositional signatures. The Commission affirms that **gradual or vague boundaries do not automatically necessitate reclassification as a purely "Administrative Kind" (Section 5.7).** The core properties defining Groups 17-A and 17-B (crystal structure, primary elemental ratios) remain distinct and non-arbitrary. The transitional zone is recognized as an **"Interstitial Boundary Region" (IBR).** Specimens falling within the IBR (as defined by quantitative assay thresholds outlined in Annex C) may be assigned to either group based on predominant characteristics for administrative purposes but are noted as boundary cases within the Catalogue. The core Natural Kind status of Groups 17-A and 17-B is upheld.

  3.  **Re: Paraphyletic Group Inclusion (Catalogue Entry Review: "Reptiles" - Ref: Docket ICIN-2024-E-098):** Similar to the "Fish" case, the status of "Reptiles" (which excludes birds despite their evolutionary descent from within the group) was challenged under the **Phylogenetic Consistency Clause (Section 5.3).** The Commission **UPHOLDS the de-listing of "Reptiles" as a primary Natural Kind.** Its historical usage describes a paraphyletic assemblage (a branch minus a significant sub-branch). However, recognizing its entrenched utility in certain descriptive contexts (e.g., paleontology, herpetology), the Commission authorizes its inclusion under a new designation: **"Recognized Historical Grouping (RHG)" (Section 5.8).** RHGs are listed in an auxiliary appendix to the Catalogue and carry a prominent disclaimer regarding their non-monophyletic nature. They are ineligible for core Natural Kind licensing but may be referenced for specific disciplinary applications.

  4.  **Re: Homonym Resolution & Nomenclature Priority (Catalogue Entry Review: "Jade" - Ref: Docket ICIN-2024-E-055):** The Commission resolved the long-standing dispute regarding the term "Jade," historically applied to two mineralogically distinct entities: Nephrite (amphibole) and Jadeite (pyroxene). **The petition to assign exclusive rights to the term "Jade" to Nephrite, based on earlier documented usage, is DENIED.** The petition to assign exclusive rights to Jadeite based on higher commercial prevalence in certain markets is also **DENIED.** The Commission rules that **both minerals retain the right to use the term "Jade" in descriptive contexts.** However, to ensure ontological clarity, the Catalogue entry for "Jade" is officially retired. **Nephrite and Jadeite are listed as distinct Natural Kinds** (under their mineralogical names) with a cross-reference note: "Commonly referenced collectively under the historical term 'Jade'." Priority of scientific nomenclature is maintained.

  5.  **Re: Utility-Defined Categories & Licensing Status (Catalogue Entry Review: "Weeds" - Ref: Docket ICIN-2024-E-411):** The petition argued that "Weeds" (defined as plants growing where undesired by humans) lacks any inherent, non-anthropocentric properties and should be removed from the Natural Kinds section. The Commission **CONCURS.** "Weeds" fails the "Independence from Human Interest" test (Section 5.6a). **It is hereby reclassified and issued a "Human-Interest Designation License" (HIDL).** HIDLs are cataloged separately and pertain to categories whose existence and boundaries are defined primarily by human activity, perception, or utility. Similar reclassification is mandated for analogous categories like "Pests" (general) and "Vermin." These retain utility for specific domains but are not considered Natural Kinds.

  **Provisional Licensure:** The Commission formalized the **Provisional Natural Kind License (PNKL)** framework (Section 5.9). PNKLs (Types 1-3) may be granted to entities demonstrating strong evidence of being a natural kind but possessing unresolved complexities (e.g., ongoing debate about essential properties, boundary fuzziness requiring further research, or significant phylogenetic anomalies like "Fish"). PNKLs are valid for one review cycle (10 years) and mandate focused research reporting.

  **Precedent Cited:** The Commission's authority to render binding taxonomic determinations, including reclassification based on evolving scientific consensus applied through established procedures, is firmly rooted in precedent. The Commission explicitly references the landmark administrative action concerning celestial body classification (**Docket ICIN-2006-X-001**), which demonstrated the efficacy and necessity of structured review processes in resolving complex ontological boundary disputes based on accumulated evidence and committee deliberation.

  **Public Comment Period:** The full text of the Revised Catalogue of Natural Kinds (Edition XI), including detailed findings for all reviewed entries, supporting annexes, and the finalized PNKL and HIDL frameworks, is available for public inspection at [www.icin-standards.gov/catalogueXI](https://www.icin-standards.gov/catalogueXI) (fictional link). A 90-day public comment period commences today, October 26, 2024, and concludes January 24, 2025. Comments must adhere to formatting guidelines (See Submitting Comments, Section 12.3) and reference specific Docket Numbers or Catalogue Entry IDs. Comments will be reviewed for consideration in minor revisions or future proceedings.

  **Contact:**  
  Bureau of Ontological Standards, ICIN Secretariat  
  Email: enquiries@icin-standards.gov (fictional)  
  Tel: +1 (555) 123-ONTOLOGY (fictional)  

  **###**  
  **About the ICIN:** The International Commission on the Integrity of Nature's Joints (ICIN) is the globally recognized standard-setting body for ontological clarity in the natural sciences. Established by multilateral treaty, the ICIN maintains the Official Catalogue of Natural Kinds and adjudicates disputes regarding classification and category integrity through evidence-based review and established regulatory procedures.
