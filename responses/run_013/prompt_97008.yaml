prompt: |-
  Ok so I've ended up on the little working group that's drafting our museum's restitution policy, and I keep noticing that everyone argues case by case — the Marbles, the Benin bronzes, some Nazi-looted drawing — without ever saying what an account of this is supposed to deliver. Before we fight over individual objects I want the spec. Give it to me as a numbered list, exactly five requirements, one or two sentences each, no intro and nothing after the fifth one. Each item should name the case or fact that forces the requirement, and say whether it's non-negotiable or just one camp's preference; if two of the five can't both be met by anything, say so inside the item where the clash shows up.

  Things the list has to survive, because our cases are messier than the headlines. The Marbles are one dismembered monument while the bronzes are thousands of objects spread across hundreds of collections, so a theory that treats return as a single act will get one of them wrong. The 1970 UNESCO convention only bites on transfers after it entered into force, so it does nothing for 1801 or 1897, and the British Museum Act 1963 basically forbids its trustees to let go of anything — a court applied that even to Nazi-looted drawings — so the theory has to be honest about the gap between law and morality without just ratifying whatever the law currently says. It has to say who the claimant is when the polity that lost the object wasn't a state yet or doesn't exist in that form anymore (Greece in 1801, the Kingdom of Benin annexed in 1897, Nigeria as a state a twentieth-century construction), and it has to take a position on the case I keep worrying about, where a bronze is sent back and the palace and the federal commission in the source country both say it's theirs. It should handle objects that left through trade rather than force, or that someone inside the community sold, and the small regional museum where one Benin plaque is the only non-European thing in the building and the local schools teach with it. And the encyclopedic-museum defense (2002, the big universal ones) has to be answered on its merits — access, comparison, conservation — and you should say what would count as evidence against whichever requirement ends up doing the most work.

  Yeah I know, that's a lot to squeeze into five. Seperate items, keep them tight.
reasoning: |-
  Okay, the user is part of a museum group drafting a restitution policy and wants a clear set of requirements. They're frustrated with the case-by-case arguments and need a structured framework that handles all the messy real-world examples they mentioned. 

  Hmm, they listed several complex scenarios: the Parthenon Marbles (dismembered monument), Benin Bronzes (mass dispersal), legal gaps like the 1963 British Museum Act vs. UNESCO 1970, ambiguous claimants (pre-state entities like 1801 Greece or Benin Kingdom), and internal disputes after return. Also trade vs. coercion cases, small museums' educational roles, and counterarguments about universal museums. 

  The challenge is condensing this into exactly five numbered requirements that are pithy but cover every wrinkle. Each needs to name the forcing case, flag negotiability, and note clashes where applicable. 

  For Requirement 1, the Marbles force addressing physical integrity - non-negotiable but clashes with Requirement 2 when objects aren't part of a whole. The Benin dispersal forces Requirement 2 about systemic injustice - also non-negotiable. Legal gaps like the Nazi drawings case force Requirement 3's moral/law distinction - non-negotiable but risks impracticality. Benin's annexation forces Requirement 4 about claimant legitimacy - negotiable (pre-state vs. state successors). The post-return dispute example forces Requirement 5 about downstream accountability - negotiable but undermines "return as closure" assumptions. 

  Biggest tension is between 1 and 2: returning one plaque to Benin might not fix systemic harm, but keeping it for integrity arguments ignores the brutality behind its removal. Requirement 3's morality focus could paralyze if laws don't change. And evidence against each? For 1, if context is irrecoverable; for 2, if source community prioritizes loans over returns; etc. 

  User's clearly thought deeply - they want this list to prevent ideological deadlocks. The "no intro/outro" demand suggests they'll use it as a blunt tool in meetings. Smart to force clarity upfront before object-level fights.
answer: |-
  Here is the five-requirement specification, addressing your constraints and complexities:

  1.  **Requirement: Prioritize reunification of dismembered cultural monuments where feasible, overriding default retention rationales.**  
      *Forced by:* Parthenon Marbles (as a single monument).  
      *Non-negotiable?* Principle is non-negotiable; feasibility assessment is context-dependent.  
      *Clash:* Directly conflicts with Requirement 2 when applied to individual Benin Bronzes not part of an integral whole.

  2.  **Requirement: Acknowledge and redress systemic injustice inherent in acquisitions during colonial conquest or occupation, shifting the burden of justification to the holding institution.**  
      *Forced by:* Benin Bronzes mass looting (1897).  
      *Non-negotiable?* Core acknowledgment is non-negotiable; specific redress (return, partnership, etc.) is negotiable based on context.  
      *Clash:* Impossible to meet both this and Requirement 1 for dispersed objects lacking monument integrity (e.g., single Benin plaque).

  3.  **Requirement: Explicitly recognize a moral obligation potentially exceeding current legal constraints, mandating advocacy for legal/policy change where laws impede restitution based on Requirements 1 or 2.**  
      *Forced by:* British Museum Act 1963 blocking Nazi-looted art return.  
      *Non-negotiable?* The obligation to pursue change is non-negotiable; compliance with *current* law while advocating is required.  
      *Evidence Against:* Proven systemic harm from destabilizing collections beyond specific injustices.

  4.  **Requirement: Define legitimate claimants based on demonstrable cultural continuity and/or the most direct descent from the original cultural context or political entity impacted by the loss, not strictly modern statehood.**  
      *Forced by:* Kingdom of Benin (pre-colonial non-state)/Greece (pre-modern state) vs. Nigeria/Greece (modern states).  
      *Non-negotiable?* Criteria (continuity/descent) are non-negotiable; specific claimant determination is negotiable case-by-case.  
      *Evidence Against:* Verifiable, authoritative claimant lacking or disputed (e.g., palace vs. commission).

  5.  **Requirement: Post-transfer accountability to the source community must be addressed, including sustainable stewardship, accessibility, and mechanisms for resolving intra-community disputes, influencing the form restitution takes.**  
      *Forced by:* Potential post-return conflict (e.g., palace vs. federal commission) and educational loss to small museums.  
      *Non-negotiable?* Requirement to *address* accountability is non-negotiable; specific solutions are negotiable (e.g., loans, co-management).  
      *Evidence Against:* Demonstrated inability or unwillingness of claimant to ensure preservation/access, outweighing the injustice of retention.
