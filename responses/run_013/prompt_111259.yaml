          We can model it as a normal form game. But it might be complex.

          Alternatively, we note that simultaneous move might lead to coordination problems.

          In any case, we see that the outcome depends on the move order. And choosing the move order is itself a collective decision.

  We might not have time for this in the amendment round, but we can mention it in the debrief.

  Amendment round flow:

  - We ask for proposals. We write them on the board.
  - For each proposal, we test on the original household and then on the stress household that shows the cost.
  - We allow discussion and then vote on whether to adopt the amendment? But we are not actually adopting, we are exploring.

  We might run out of time. We have 30 minutes for amendment round. We can cover 2-3 proposals.

  Predictable problems:

  - Households might not understand the task and produce a ranking by aggregating preferences without following the rules. We must emphasize that they must derive the ranking using the two rules only.
  - In the amendment round, students might propose rules that are not general or are tailored. We enforce the two constraints.
  - The stress household demonstration might be rushed.

  Debrief (last 20 minutes):

  - We reveal that what they experienced is known as the liberal paradox (or Sen's paradox). Name it once.
  - Map the activity: 
        The two rules represent two principles:
          Rule 1: Liberalism (individuals have the right to decide matters that are personal)
          Rule 2: Unanimity (if everyone prefers one outcome to another, society should too)

        But these principles can conflict, as they saw.

  - Then, in the amendment round, they tried to fix the rules. Each fix came with a cost:
        Dropping liberalism: loss of individual freedom in personal matters.
        Dropping unanimity: might end up with an outcome that is worse for everyone.
        Restricting liberalism: might leave some decisions without any rule, leading to incompleteness.
        Giving up transitivity: outcomes become arbitrary and manipulable.

  - Ask each student to reflect: which demand (liberalism or unanimity) did they personally feel was more important to give up? And why was that not free? (Because it had a cost shown by the stress household.)

  - Be honest:
        The activity shows that for some preference profiles (like the one on the cards), the two principles conflict. It doesn't show that they conflict for every profile. But we cannot design a system that works for every possible preference profile without dropping one of the principles or accepting the cost.
        If a student says, "But in real life, people don't have such preferences," they are proposing to restrict the domain of preferences. That might work, but it has a cost: we are limiting individual freedom of preference. Also, the stress households showed that even with other preferences, the costs of the fixes are real.

  - How to say it without deflating: 
        "Today we saw that the two principles we started with can pull in opposite directions. That tension is real and arises in many collective decision problems. While it's true that not every group will have preferences that cause a cycle, the fact that it can happen means we have to design our rules carefully. And as we saw, every way of avoiding the cycle comes with a trade-off. The lesson is not that collective decision-making is impossible, but that we must be aware of the costs of the rules we choose."

  Predictable problems during the session:

  - First time running: 
        Households might take longer than 25 minutes to try to complete the form. Some might not see the contradiction. We can give a warning at 20 minutes and then collect at 25.
        In the amendment round, students might propose many repairs and it might overrun. We must be strict on time. We can pick two or three representative amendments.
        Students might try to propose repairs that are not general, e.g., "in this case, we let A decide" -> but that violates the constraint of not knowing which household they are in.
        They might also try to use a different aggregation method (like Borda) without realizing that it might violate the rules. We have to remind them that the rules are fixed.

  - Where the amendment round will overrun: 
        In the discussion of each proposal and the stress household. We should limit each proposal to 5 minutes: 2 minutes for proposal, 3 minutes for testing and discussion.

  - Which repairs will they try to smuggle in:
        They might suggest letting the household vote by majority on everything (dropping Rule 1) without seeing the cost to individual freedom.
        They might suggest letting the members negotiate and trade (but that's not a rule, and it might not work in all cases).
        They might suggest ignoring transitivity and then using a random method to choose the outcome.

  Materials:

  1. Rule ratification: a board to write the rules.
  2. Payoff cards for 9 households (each household has two cards: one for A and one for B). The scenario is the TV example. The preferences are fixed: A: Z>X>Y, B: X>Y>Z.
  3. Household form: a sheet where they write the household's ranking of the three outcomes (must be complete and transitive) and sign. Also, space to explain if they cannot.
  4. Stress household cards for the amendment round (four stress households, each on a card).

  Exact text of the cards:

  Card for A (in original household):

  "You are member A in your household. You and your housemate share a TV in the common room. The TV can be in one of three states:
    - State X: Your nature documentary is playing.
    - State Y: Your housemate's sports channel is playing.
    - State Z: The TV is off.

  Your preferences:
    - You are an environmentalist and want to save energy. You also find sports shallow and loud. 
    - You prefer the TV off (Z) most because it saves energy.
    - If the TV must be on, you prefer your nature documentary (X) to sports (Y) because it is educational and calming.
    - So your ranking: Z > X > Y

  Remember the house rules:
    1. Your own switch is yours alone. If two outcomes differ only in what you do with your switch (and the other member's switch is the same), then your preference between those two outcomes decides for the household.
    2. If both of you strictly prefer one outcome to another, then the household prefers it too.

  You must work with your housemate to derive a complete and transitive ranking for the household using only these rules."

  Card for B (original household):

  "You are member B in your household. You and your housemate share a TV in the common room. The TV can be in one of three states:
    - State X: Your housemate's nature documentary is playing.
    - State Y: Your sports channel is playing.
    - State Z: The TV is off.

  Your preferences:
    - You are tired and find sports too stimulating. You prefer the nature documentary (X) because it's calming. 
    - You don't like silence and would rather have some background noise.
    - So you prefer the nature documentary (X) to sports (Y) to the TV being off (Z).
    - Your ranking: X > Y > Z

  Remember the house rules (same as above)."

  Household form:

  "Household: __________
  Members: A: __________, B: __________

  Rank the outcomes X, Y, Z from most preferred to least preferred by the household, using only the two house rules. The ranking must be complete and transitive.

  Household ranking (use > to denote strict preference):

  1. _______
  2. _______
  3. _______

  If you cannot complete a transitive ranking without violating the rules, explain why:

  _________________________________________________________

  Signatures: 
  A: ___________________
  B: ___________________

  Date: ________________"

  Stress household cards (prepared for amendment round):

  Stress Household 1 (for dropping Rule 1):

  Card for A:
    "Scenario: TV as before.
     Preferences: 
        You (A) are shy and don't want your content shown. You also find B's content acceptable.
        Ranking: Z (off) > Y (B's sports) > X (your own content)"
  Card for B:
    "Preferences:
        You (B) want to encourage A and also dislike silence.
        Ranking: X (A's content) > Y (your own sports) > Z (off)"

  Stress Household 2 (for dropping Rule 2):

  Card for A:
    "Preferences: 
        You (A) love your own content and hate silence.
        Ranking: X > Y > Z"
  Card for B:
    "Preferences:
        You (B) are very energy-conscious and also prefer silence to sports.
