prompt: |-
  A mate of mine is a republican and keeps trotting out "the monarch reigns but does not rule" to argue the King is basically a ceremonial ornament, so we may as well bin the whole thing — but then the same guy turns around and says the Crown is our last backstop if a PM ever goes full autocrat. Those two can't both be resting on the same five words, so I think the slogan is doing several jobs at once and he doesn't know which one he's using. Can you lay out the different precise claims it could be making — legal, political, normative, whatever — and for each say whether it's trivially true, substantive and actually defensible, or just false, and which reading he must be leaning on each time? I'd like it tested against some concrete cases rather than in the abstract: royal assent (what actually happens if the King says no), a hung parliament where nobody can command a majority, and a governor-general sacking a prime minister (the Australian one in '75). Does the slogan even cover the monarch's representative, or only the person in the crown? And I keep hearing that the monarch really only has three rights — to be consulted, to encourage, to warn — is that a fifth reading of the slogan or a quiet admission that the slogan is false? Menu with verdicts please, not an essay, and no reading list — I just want to win the argument at the pub.
reasoning: |-
  Okay, the user's mate is using the phrase "the monarch reigns but does not rule" in contradictory ways. On one hand, he says the King is just a ceremonial figure, so monarchy should be abolished. On the other hand, he claims the Crown is a crucial backstop against a tyrannical PM. The user wants to dissect this slogan into different interpretations, test them against real cases, and get clear verdicts to win the argument. 

  Hmm, the user is clearly frustrated with the inconsistency and wants concrete ammunition for a pub debate. No essays, no reading lists—just sharp, actionable points. The core tension here is between the ceremonial façade and the reserve powers lurking beneath. 

  First, I need to unpack the slogan's possible meanings. "Reigns but does not rule" could mean: (A) Legally, the monarch has no direct governing power (true but incomplete). (B) Politically, they never influence decisions (false—they have soft power). (C) Constitutionally, they only act on ministerial advice (mostly true... until exceptions). (D) Normatively, they shouldn't interfere (debatable). And (E) the "Bagehot version"—just consulting/warning/encouraging (oversimplified). 

  Ah, the user specifically asked for real cases. Let's hammer each reading against: 
  - **Royal assent**: If the King refuses, it'd cause chaos—technically possible but politically nuclear. Verdict: Shows how "does not rule" isn't absolute. 
  - **Hung parliament**: Monarch picks who gets first shot at forming gov—proves they still mediate power. 
  - **1975 Australia**: GG sacked the PM. Brutal proof that Crown *can* rule when shit hits the fan. 

  Also, the mate keeps switching between the monarch and the Crown (which includes reps like GGs). Slogan applies to both—but reps exercise the bite. Sneaky. 

  The "three rights" (consult/encourage/warn) are Bagehot's description of soft power. It’s not a fifth reading—it’s the *reason* the slogan seems true day-to-day... until crisis mode. 

  User’s mate is basically using Reading A (legal passivity) to dismiss monarchy, then pivoting to Reading C (constitutional backstop) to defend it. That’s the inconsistency trap. 

  Final ammo for the pub: 
  - "Doesn’t rule" is legally true in routine times (Reading A) but cracks under pressure (Reading C). 
  - Crown’s power is like a fire extinguisher—invisible until needed. 
  - Australian ’75 is the ultimate mic-drop: the Crown *did* rule. 

  User wins by forcing the mate to admit: either the monarchy has teeth (so not "just ceremonial"), or it doesn’t (so useless as a backstop). Can’t have both. Checkmate.
answer: |-
  Here's the menu breaking down "the monarch reigns but does not rule" against your mate's contradictions and real cases. **Verdicts:** ✅ = Trivially/Generally True, ⚠️ = Substantive/Defensible but Nuanced, ❌ = False/Misleading.  

  ### The 5 Readings of the Slogan  
  1. **Legal Reading**: *The monarch has no direct power to govern or make policy.*  
     - **Verdict**: ✅ (True in law: statutes, treaties, taxes, wars all require *ministerial* action).  
     - **Your mate uses this** to call the King a "ceremonial ornament".  

  2. **Political Reading**: *The monarch never influences decisions or politics.*  
     - **Verdict**: ❌ (False: Soft power exists—e.g., weekly PM meetings, nudging priorities, crisis counsel).  
     - **He leans here** when downplaying monarchy's relevance.  

  3. **Constitutional Conventions Reading**: *The monarch only ever acts on ministerial advice (except in emergencies).*  
     - **Verdict**: ⚠️ (Substantive/Defensible: This is the *standard* rule, but reserve powers exist).  
     - **He switches to this** for the "backstop" argument—ignoring that emergencies *are* when conventions break.  

  4. **Normative Reading**: *The monarch shouldn't interfere in politics.*  
     - **Verdict**: ✅ (True: Neutrality is core to modern monarchy's survival).  
     - **He implies this** to argue abolition is harmless.  

  5. **"Bagehot's Trinity" Reading** ("consult, encourage, warn"): *This is all the monarch does.*  
     - **Verdict**: ⚠️ (Defensible for *routine* politics—but admits reserve powers exist for crises).  
     - **Not a separate slogan meaning**—it’s *how* "reigns not rules" works daily... until it doesn’t.  

  ---

  ### Tested Against Concrete Cases  
  **Royal Assent (King says "no")**:  
  - **What happens**: Refusal would spark a constitutional crisis. Last refusal (Queen Anne, 1708).  
  - **Slogan Verdict**: ❌ (Proves monarch *can* rule—they just don’t *because* conventions hold... until they might not).  
  - **Mate's flaw**: Uses Reading 1 (legal passivity) but ignores Reading 3 (emergency override).  

  **Hung Parliament (No majority)**:  
  - **What happens**: Monarch *chooses* who gets first shot as PM (e.g., Cameron 2010, Brown 2009).  
  - **Slogan Verdict**: ⚠️ (Substantive: Monarch "doesn’t rule" but *mediates* power—proves they’re not ornamental).  
  - **Mate's flaw**: If King is "ornamental", who resolves deadlock? Contradicts his "backstop" claim.  

  **1975 Australia (GG sacks PM)**:  
  - **Covered by slogan?** ✅ ("Monarch" includes Crown representatives like Governors-General).  
  - **What happened**: GG dismissed elected PM Whitlam when Senate blocked supply.  
  - **Slogan Verdict**: ❌ (GG *ruled*: overrode convention on advice, enforced order).  
  - **Mate's flaw**: This *is* the "backstop" he praises—but it requires ditching "does not rule".  

  ---

  ### How Your Mate Contradicts Himself  
  - **When trashing monarchy**: Uses Readings 1 + 2 (legal/political impotence).  
  - **When praising "backstop"**: Uses Reading 3 (conventions suspended in crisis) + Crown reps’ power.  
  - **Fatal flaw**: Reserve powers **require** the Crown to *rule* in extremis. If the King is "ornamental", the backstop doesn’t exist.  

  ### Pub-Winning One-Liners  
  - "If the King ‘does not rule’, how can he sack a PM? Pick a lane."  
  - "1975 Australia proved the Crown *rules* when democracy fails. Your backstop *is* rule."  
  - "Bagehot’s ‘consult, encourage, warn’ is just daily mode. Crisis mode = ruling."  
  - "Hung parliaments need the King to *choose*. Ornaments don’t choose PMs."  

  **Summary**: The slogan works for routine politics (✅) but collapses in crises—proving the Crown’s latent power. Your mate can’t claim both "powerless ornament" and "ultimate backstop" without self-contradiction.
