          - Then do a second update: set new marginal for texture: [0.7,0.3] and compute the new joint.
          - Then reverse the order and show non-commutativity.

    5. (5 min) Discuss non-commutativity and the importance of the partition and order.

    6. (5 min) Recap and address misconceptions:
          - Jeffrey is not Bayes with softened likelihood: we never conditioned on an event.
          - Rigidity is essential: without it, the rule doesn't apply.
          - Order matters for updates on different partitions.

    7. (5 min) Question for rigidity:
          - "After we update the color, we decide to update the color again (maybe we get more evidence). We change the color probabilities to [0.2,0.5,0.3]. How do we update the probability of cotton? Do we need any new information? Why or why not?"
            Answer: We use the same conditionals: P(Cotton|Red)=0.7, etc. So Q_new(Cotton)=0.2*0.7+0.5*0.4+0.3*0.5 = 0.14+0.20+0.15=0.49. The rigidity condition still holds because the first update preserved these conditionals, and we are updating again on the same partition.

    8. (5 min) Leave out: 
          - We won't discuss how to handle multiple updates on different partitions in general (it can be complex). 
          - We leave out the continuous case.
          - We don't discuss the justification from principles of minimal change.

    Note: The example with two attributes (color and texture) and two updates (color then texture vs texture then color) is the core of the non-commutativity. We do the math in class (with calculators?) or we can do approximate numbers. Alternatively, we can set the numbers so that the conditionals are round.

