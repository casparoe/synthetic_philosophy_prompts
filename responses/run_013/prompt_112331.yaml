  We are teaching Jeffrey conditionalization to graduate students familiar with Bayes but new to probability kinematics.
   Goal: Plan a 60-minute session, with a single carrying example, focusing on the core concepts and addressing common misconceptions.

   Components to cover in order:

   1. **Review of Bayesian Conditionalization**: Start by reminding them of standard conditionalization (learning that a proposition is true). 
      - Example: Prior P(H), then we learn E (so P(E)=1), then posterior P(H|E) = P(H and E)/P(E).
      - Emphasize: This requires setting P(E)=1.

   2. **Introduce the problem of uncertain evidence**: 
      - Sometimes we don't learn that E is true with certainty, but we get evidence that shifts the probabilities of a set of mutually exclusive and exhaustive propositions (a partition). 
      - Example: You are in a room and the lighting changes. You see a cloth that might be red, green, or blue. Initially you have a prior over these colors. After the lighting change, you are not certain of the color but your degrees of belief change.

   3. **Present a partition and an uncertain observation**:
      - Choose a partition with at least three cells (to avoid binary and to show generality). 
      - Example: The color of a cloth under changing lighting. Partition: {Red, Green, Blue}.
      - Prior: P(Red) = 0.5, P(Green)=0.3, P(Blue)=0.2.
      - Uncertain observation: After looking in dim light, your new probabilities (degrees of belief) for the colors become: 
            Q(Red) = 0.6, Q(Green)=0.3, Q(Blue)=0.1.

   4. **Key question**: How to update the probability of other propositions (say, that the cloth is made of cotton) given this shift?
      - They might think: we can just apply Bayes with a softened likelihood? But note: we don't have a specific evidence proposition that we are conditioning on. We have a shift in the partition.

   5. **Introduce Jeffrey conditionalization**:
      - We require a rigidity condition: the conditional probabilities of other propositions given the partition elements remain unchanged.
          - That is, for any proposition A, and for each cell C_i in the partition, P(A|C_i) = Q(A|C_i).
      - Then, the update rule: Q(A) = sum_i Q(C_i) * P(A|C_i)

   6. **Work through the example**:
      - Suppose we want the new probability that the cloth is cotton (A). 
      - We need the prior conditionals: P(Cotton | Red), P(Cotton | Green), P(Cotton | Blue). Let's say:
            P(Cotton|Red)=0.7, P(Cotton|Green)=0.4, P(Cotton|Blue)=0.5.
      - Then Q(Cotton) = (0.6)(0.7) + (0.3)(0.4) + (0.1)(0.5) = 0.42 + 0.12 + 0.05 = 0.59.

   7. **Contrast with what they might expect**:
      - Misconception: Jeffrey conditionalization is just Bayes with a softened likelihood? 
          - In Bayes, we condition on a specific evidence E. Here, we don't have a single E but a shift in a partition. 
          - We head this off by showing that we are not using any likelihood function for a particular observation. We are directly assigning new probabilities to the partition.

