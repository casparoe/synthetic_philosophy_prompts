          Then new joint:
              Smooth: 
                  Red=0.7*0.5902≈0.4131, Green=0.7*0.3279≈0.2295, Blue=0.7*0.0820≈0.0574
              Rough:
                  Red=0.3*0.6154≈0.1846, Green=0.3*0.2564≈0.0769, Blue=0.3*0.1282≈0.0385

      Reverse order:

          First update: texture to [0.7,0.3] (from prior) while preserving conditionals of color given texture.
              Smooth: 
                  Red=0.7*0.5=0.35, Green=0.7*(1/3)≈0.2333, Blue=0.7*(1/6)≈0.1167
              Rough:
                  Red=0.3*0.5=0.15, Green=0.3*0.25=0.075, Blue=0.3*0.25=0.075

          Then color marginal: 
              Red=0.35+0.15=0.5, Green=0.2333+0.075≈0.3083, Blue=0.1167+0.075≈0.1917

          Conditionals of texture given color from this intermediate distribution:
              P(Smooth|Red)=0.35/0.5=0.7, P(Rough|Red)=0.15/0.5=0.3
              P(Smooth|Green)=0.2333/0.3083≈0.7567, P(Rough|Green)=0.075/0.3083≈0.2433
              P(Smooth|Blue)=0.1167/0.1917≈0.6088, P(Rough|Blue)=0.075/0.1917≈0.3912

          Second update: color to [0.6,0.3,0.1] while preserving these conditionals.
              Red: Smooth=0.6*0.7=0.42, Rough=0.6*0.3=0.18
              Green: Smooth=0.3*0.7567≈0.2270, Rough=0.3*0.2433≈0.0730
              Blue: Smooth=0.1*0.6088≈0.0609, Rough=0.1*0.3912≈0.0391

          Then texture marginal: 
              Smooth=0.42+0.2270+0.0609≈0.7079
              Rough=0.18+0.0730+0.0391≈0.2921

      We see that the two orders give different joints.

   13. **Conclusion**: 
       - Jeffrey conditionalization is a rule for updating when evidence shifts probabilities on a partition. 
       - It requires rigidity of conditionals given the partition elements.
       - Successive updates on different partitions do not commute.

   14. **Final note**: We have time for questions.

   This plan fits 60 minutes if we keep the calculations efficient (maybe use precomputed numbers for the second update to save time).
answer: |-
  ### Teaching Plan: Uncertain Evidence and Jeffrey Conditionalization  
  **Duration:** 60 minutes  
  **Prerequisites:** Familiarity with Bayes' theorem, conditional probability, and basic probability theory.  
  **Avoid:** Medical tests, urns, binary hypotheses, and determinate evidence.  

  ---

  #### **Carrying Example: "Mystery Fabric Under Changing Light"**  
  **Scenario:** A fabric swatch is viewed under shifting lighting conditions, affecting color perception. Later, tactile evidence about texture is obtained.  
  **Why this example?**  
  - Intuitive (visual/tactile uncertainty), avoids clichés, and partitions are naturally misaligned.  
  - **Partition:** Color = {*C₁: Red*, *C₂: Green*, *C₃: Blue*} (3 cells, non-binary).  
  - **Auxiliary proposition:** *A* = "The fabric is cotton".  
  - **Prior probabilities:**  
    - *P(C₁) = 0.5*, *P(C₂) = 0.3*, *P(C₃) = 0.2*  
    - *P(A \mid C₁) = 0.7*, *P(A \mid C₂) = 0.4*, *P(A \mid C₃) = 0.5* (fixed conditionals).  
  - **First uncertain observation:**  
    Lighting shifts → new color credences: *Q₁(C₁) = 0.6*, *Q₁(C₂) = 0.3*, *Q₁(C₃) = 0.1*.  
  - **Second uncertain observation:**  
    Touch suggests texture, partitioned as {*T₁: Smooth*, *T₂: Rough*}. New credences: *Q₂(T₁) = 0.7*, *Q₂(T₂) = 0.3*.  

  ---

  #### **Teaching Sequence (55 min)**  
  1. **Introduction: Learning *That* vs. Shifting Credences** (5 min)  
     - **Review standard conditionalization:**  
       "We learn *E is true* → set *P(E) = 1* → update to *P(\cdot \mid E)*."  
     - **Contrast with uncertain evidence:**  
       "Lighting changes make *Red* likelier but not certain—*probabilities shift* across {*Red, Green, Blue*}, but no proposition is learned as true."  
     - **Key point:** Uncertain evidence requires updating *without* setting any event to probability 1.  

  2. **Jeffrey Conditionalization: Rule and Intuition** (15 min)  
     - **Present the rule:**  
       \( Q(A) = \sum_i Q(C_i) \cdot P(A \mid C_i) \)  
       **Emphasize:** This is *not* derived from Bayes’ theorem.  
     - **Apply to example:**  
       Update *P(A)* using new color credences:  
       \( Q_1(A) = (0.6)(0.7) + (0.3)(0.4) + (0.1)(0.5) = 0.59 \).  
     - **Rigidity condition:**  
       "Conditionals *P(A \mid C_i)* remain *unchanged* by the update."  
       - *Why?* The evidence only shifts credences over *Cᵢ*; it doesn’t alter how *A* relates to *Cᵢ*.  

  3. **Addressing Misconceptions** (10 min)  
     - **Misconception 1:** "Jeffrey = Bayes with softened likelihood."  
       **Clarify (during rule explanation):** Bayes conditions on an event *E*; Jeffrey redistributes probabilities over a partition *without* conditioning. No likelihoods are involved.  
     - **Misconception 2:** "Any probability change licenses Jeffrey."  
       **Clarify (when defining rigidity):** Jeffrey *only* applies if rigidity holds for the partition. If *P(A \mid C_i)* changes, the rule fails.  
     - **Misconception 3:** "Jeffrey dissolves old evidence."  
       **Clarify (during Q&A):** Jeffrey handles *new* uncertain evidence. Old evidence problems require different tools (mention but defer).  

  4. **Second Update: Non-Commutativity** (15 min)  
     - **New partition:** Texture {*Smooth*, *Rough*}, which cross-cuts color.  
       - Prior joint distribution (simplified):  
         *P(C₁, T₁) = 0.3*, *P(C₁, T₂) = 0.2*, ... (ensure *P(T₁) = 0.6*, *P(T₂) = 0.4*).  
     - **Update 1 (color → texture):**  
       - Compute intermediate *Q₁(T₁)* using rigidity (e.g., *Q₁(T₁) = 0.61*).  
       - Update texture to *Q₂(T₁) = 0.7* → new joint distribution.  
     - **Update 2 (texture → color):**  
       Reverse order: Update texture first (to *Q₁(T₁) = 0.7*), then color (to *Q₂(C₁) = 0.6*, ...).  
     - **Result:** Final joint distributions differ!  
       - **Key insight:** Successive Jeffrey updates *do not commute* if partitions cross-cut.  

  5. **Pitfalls: Partition Choice and Rigidity** (5 min)  
     - **Problem 1:** "Second observation ignores the first update."  
       If you naively reuse the *original* conditionals after the first update, rigidity is violated.  
     - **Problem 2:** "Partition not fixed in advance."  
       If the partition changes mid-process (e.g., updating on *color* then on *color+texture*), rigidity fails.  

  ---

  #### **Check for Understanding: Rigidity Question** (5 min)  
  **Question:**  
  > "After the first update (color), you feel the fabric and shift *Q(Smooth)* to 0.7. Suppose you discover this *also* altered your belief about *P(Cotton \mid Blue)*. Can you apply Jeffrey conditionalization for the texture update? Why or why not?"  

  **Expected Answer:**  
  > No—rigidity is violated. The conditional probability *P(A \mid C_i)* must remain fixed, but here *P(Cotton \mid Blue)* changed. Jeffrey’s rule assumes these conditionals are stable.  

  ---

  #### **Explicit Omissions & Why**  
  1. **Generalized probability kinematics/continuous cases:** Too advanced for an intro session.  
  2. **Dutch book justifications:** Focus is on mechanics, not foundations.  
  3. **Non-partition updates (e.g., soft evidence):** Jeffrey requires a fixed partition.  
  4. **Solving the "problem of old evidence":** Jeffrey addresses *new* evidence; old evidence is a distinct issue.  

  ---

  **Why This Works:**  
  - Builds from intuition to formalism, using a relatable, non-clichéd example.  
  - Preempts major misconceptions at critical points.  
  - Non-commutativity demo highlights uniqueness of Jeffrey updates.  
  - Rigidity question tests conceptual grasp beyond rote calculation.
