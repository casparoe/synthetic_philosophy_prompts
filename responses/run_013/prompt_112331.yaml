   10. **Common misconceptions and when to address them**:
       a. **That Jeffrey conditionalization is just Bayes theorem with a softened likelihood**:
            - Address when introducing the rule. Emphasize: Bayes conditions on evidence E, but here we don't have E. We have a new distribution over a partition. We are not conditioning on any event that has happened, but rather redistributing probabilities over the partition.
       b. **That any change in the probability of the evidence licenses it**:
            - The update requires a specific partition and the rigidity condition. Not any change can be modeled by Jeffrey. We must have a shift in a partition and the rigidity of conditionals given each cell.
            - Address when presenting the rule: we require the rigidity condition for the entire partition and for every proposition of interest.
       c. **That the update is order-independent**:
            - We show by example that two successive Jeffrey updates on different partitions do not commute.
       d. **That it dissolves the problem of old evidence**:
            - We won't go into old evidence here? But if they bring it up, note that Jeffrey is for updating on uncertain evidence, not for old evidence. We leave old evidence out.

