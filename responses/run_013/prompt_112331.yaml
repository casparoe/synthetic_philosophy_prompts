   Plan for the 60 minutes:

    0. (5 min) Introduction: Today we discuss updating beliefs when the evidence is uncertain.

    1. (10 min) Review standard conditionalization and its limitation: requires certainty.
          - Example: You see a cloth and it looks red, but you are unsure because of the lighting.
          - So you don't set P(Red)=1, but you might set P(Red)=0.6, P(Green)=0.3, P(Blue)=0.1.

    2. (10 min) Present the partition and the uncertain shift. 
          - We have a partition: the cloth is either Red, Green, or Blue.
          - Prior: [0.5, 0.3, 0.2]
          - After the observation: [0.6,0.3,0.1]
          - How to update other beliefs? (e.g., the cloth is cotton)

    3. (15 min) Introduce Jeffrey conditionalization: 
          - Rigidity: P(Cotton | Red) remains the same, etc.
          - Rule: Q(A) = ∑ Q(C_i) * P(A|C_i)
          - Work the example: 
               P(Cotton|Red)=0.7, P(Cotton|Green)=0.4, P(Cotton|Blue)=0.5.
               Q(Cotton)=0.6*0.7 + 0.3*0.4 + 0.1*0.5 = 0.42+0.12+0.05=0.59.

    4. (15 min) Second update on a different partition (texture: {Smooth, Rough}):
          - We need a prior joint over (color, texture). Set one up (as above).
