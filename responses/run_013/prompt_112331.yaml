   Example requirements for the carrying example:
       - Partition: {Red, Green, Blue} (three cells)
       - Prior: P(Red)=0.5, P(Green)=0.3, P(Blue)=0.2
       - First uncertain observation: shifts to [0.6,0.3,0.1]
       - We need to update an auxiliary proposition: P(Cotton|...) with specific conditionals: say [0.7,0.4,0.5] for the three colors.
       - Second update: on a different partition (texture: {Smooth, Rough}) that cuts across. We start with a joint prior on color and texture? Then we do the first update on the color partition. Then we do a second update on the texture partition, setting new marginals for texture.

