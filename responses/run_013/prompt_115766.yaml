prompt: |-
  I'm the clinical ethicist at a mid-size hospital and I keep getting paged at 2am for the same cluster of questions, so I want to write a one-page procedure that the night resident or charge nurse can actually run without me. The subject matter is the doing/allowing family of distinctions — killing vs letting die, acts vs omissions, intending vs merely foreseeing, and the double-effect machinery that goes with it. Two wrinkles specific to us: our policy manual officially states that withholding and withdrawing life support are morally equivalent, which most of my nurses do not believe in their bones, and our state has legalized aid in dying while our hospital (religiously affiliated) opts out, so some calls are really about that.

  The calls I get: should we start a treatment, should we stop one already running, should we withhold CPR or pressors, is it OK to sedate someone to unconsciousness for refractory suffering when we expect it may shorten life, can we stop tube feeding. Roughly twice a week, family in the room, and I usually cant get there in under an hour. The person running the procedure is a resident who's read maybe one article about any of this and is scared of getting it wrong.

  Please write the procedure. I need the questions in the order they should be asked, what counts as a sufficient answer to each, which steps are factual (prognosis, what the intervention actually does) and which are value questions that no amount of data settles, where the procedure stops with a flat no, where it hands the decision to a person instead of answering, and who has to sign what at the end. Two things I want dealt with honestly instead of papered over: (a) whether the procedure should ask anybody to state their intention at all, since asking an exhausted nurse to declare that she isnt intending the death seems to just produce a form filled in to get the desired answer, and (b) whether to phrase the whole thing causally (did the act cause the death?) or normatively (is the death attributable to a choice that violated a duty?), because our risk manager wants the causal version and I think that's a mistake.

  Then run it on three cases: (1) terminal extubation of a patient who will die within hours; (2) palliative sedation for a dying patient with refractory agitation, where the family is asking for it and one nurse refuses to take part; (3) a family demanding that everything continue, where the team believes ongoing dialysis is now doing more harm than good. Include at least one case where the procedure tells me something I don't want to hear — say, that the doing/allowing line I've been leaning on does no real work here and the live question is somewhere else entirely — and end with a short list of what the procedure cannot decide, so I know when to get out of bed.
reasoning: |-
  We are creating a procedure for night staff to handle common ethical dilemmas without needing to wake the ethicist. The procedure must cover:
  - Killing vs letting die, acts vs omissions, intending vs foreseeing, double effect.
  - Address hospital policy on equivalence of withholding/withdrawing, and the state's aid in dying law (which the hospital opts out of).
  - Common questions: starting/stopping treatment, withholding CPR/pressors, palliative sedation, stopping tube feeding.

  The procedure should:
  1. Be a step-by-step algorithm with clear questions in order.
  2. Distinguish factual (prognosis, intervention effects) from value questions.
  3. Indicate when the procedure stops with a "no", when it hands off the decision, and who signs what.
  4. Address two challenges: (a) whether to ask about intention (we think it leads to box-ticking) and (b) causal vs normative framing.

  We'll avoid directly asking about intention because it's not reliable. Instead, we'll focus on the nature of the act and the foreseeable consequences.

  We'll frame normatively (duty-based) rather than causally, because the causal framing (did the act cause death?) is too simplistic and can mislead. We'll explain that we are assessing whether the action (or omission) violates a duty of care.

  The procedure will have the following sections:
  I. Introduction: Purpose, when to use, and who can run it.
  II. Step-by-step questions.
  III. Documentation.

  Steps:

  0. Precondition: The patient must be in a situation of life-limiting illness or at the end of life. The team must have established that the patient lacks decision-making capacity and that the surrogate is properly designated.

  1. **Clarify the request**: What is being asked? (e.g., stop a treatment, start a treatment, withhold CPR, palliative sedation, stop tube feeding). Also, note if the request is for aid in dying (which the hospital does not provide).

  2. **Determine if the patient is imminently dying (within hours to days)**: 
     - Factual: Based on medical assessment (e.g., vital signs, trajectory, consensus of the team). 
     - If yes, then the focus shifts to comfort care and avoiding burdensome interventions. Proceed to step 3.
     - If no, proceed to step 4.

  3. **For the imminently dying patient**:
     - The goal of care is comfort. Treatments that are only life-prolonging and not providing comfort may be withheld or withdrawn. This includes CPR, pressors, dialysis, etc. (Note: withholding and withdrawing are equivalent per policy.)
     - Palliative sedation for refractory symptoms is acceptable if the primary intent is symptom relief, even if it may hasten death. The dose should be titrated to symptom control, not to cause death.
     - Tube feeding: If the patient is imminently dying, tube feeding is not providing benefit and may cause discomfort. It can be stopped. Focus on oral care and comfort.
     - The procedure says: "Proceed with comfort-focused plan. No need for further ethical analysis for these actions."

  4. **For the patient not imminently dying**:
     - **Assess the intervention in question**:
       a. What is the goal of the intervention? (e.g., cure, prolong life, symptom relief, comfort)
       b. What is the burden of the intervention? (pain, discomfort, restriction of liberty, etc.)
       c. What is the benefit? (likelihood of achieving the goal, and for how long?)
       d. Is the intervention proportionate? (i.e., do the benefits outweigh the burdens?) 
          - Factual: Prognosis, known effects of the intervention.
          - Value: What counts as a benefit or burden? This must be discussed with the surrogate, based on the patient's values if known.

     - **For withholding/withdrawing life-sustaining treatment**:
       - If the intervention is disproportionate (burdens > benefits) or if it is futile (cannot achieve the goal), then it is ethically permissible to withhold or withdraw. 
       - Reiterate: withholding and withdrawing are equivalent per policy.

     - **For palliative sedation** (if the patient is not imminently dying but has refractory symptoms):
       - The patient must have a terminal condition (life expectancy <6 months) and refractory symptoms (symptoms that cannot be controlled by other means without unacceptable side effects).
       - The primary intent must be symptom relief, not causing death. The sedation should be titrated to the minimum level needed to relieve symptoms.
       - It is acceptable even if it may shorten life as a foreseen but unintended consequence.

     - **For CPR/pressors**:
       - If CPR or pressors are not indicated (e.g., in a dying patient or when they would be futile) or if the patient/surrogate has chosen a DNR/DNI status, then it is permissible to withhold.

     - **For stopping tube feeding** (in a patient not imminently dying):
       - This is more complex. Tube feeding is considered a medical treatment. It can be withheld or withdrawn if it is disproportionate (burdens outweigh benefits) or if the patient is in a persistent vegetative state or has advanced dementia and the surrogate decides based on the patient's wishes that they would not want it. However, in non-terminal conditions, this requires careful consideration and often ethics consultation. Therefore, in non-imminently dying patients, the procedure will say: "Do not stop tube feeding without ethics consultation unless the patient is imminently dying (step 3)."

  5. **Aid in dying**: 
     - If the request is for aid in dying (i.e., prescribing medication to cause death), the hospital does not participate. The procedure says: "Our hospital does not provide aid in dying. We can discuss comfort care and symptom control."

  6. **Handling disagreements**:
     - If there is disagreement among staff (e.g., a nurse refusing to participate) or between the team and family, the procedure will note that the primary team and the surrogate must be involved in the decision. For staff objections, they can be accommodated by reassignment if possible, but the plan of care should proceed if it is ethically justified per this procedure. If the disagreement is about the medical facts (prognosis, etc.), seek a second opinion. If the disagreement is about values, then ethics consultation may be needed, but the procedure will try to resolve common scenarios.

  7. **Where the procedure stops**:
     - It will say "no" to aid in dying (as above).
     - It will say "no" to stopping tube feeding in non-imminently dying patients without ethics consultation (as above).
     - It will hand the decision to the surrogate (with team input) for decisions about starting/stopping treatments based on proportionality, but the procedure will provide the framework.

  8. **Documentation**:
     - After following the procedure, the resident and charge nurse should document:
          - The decision-making process, including the steps followed.
          - The medical facts (prognosis, burdens, benefits).
          - The discussion with the surrogate and the surrogate's decision.
          - For palliative sedation: document the refractory symptoms, the intent (symptom relief), and the plan for titration.
          - For withdrawal of life support: document the surrogate's consent and that the patient is imminently dying (if applicable) or that the treatment is disproportionate.
     - Signatures: The resident and the attending (if available, or the charge nurse) should sign the note.

  Now, addressing the two challenges:

  (a) **Intention**: We will not ask the provider to state their intention. Instead, we will focus on the objective aspects: the nature of the act (is it a standard medical intervention for symptom control?) and the proportionality (benefits vs burdens). For palliative sedation, we require that the dose is titrated to symptom control and not to cause death.

  (b) **Causal vs normative framing**: We use normative framing. The question is not "Will this act cause death?" but "Is this act (or omission) consistent with our duties of care?" Our duty is to provide beneficial care and avoid harm. If an intervention is not beneficial (or is harmful) and the patient/surrogate declines it, then we are not violating any duty by withholding or withdrawing it. Similarly, providing palliative sedation is fulfilling a duty to relieve suffering.

  Now, we write the procedure in a clear, concise one-page format.

  ---

  **Hospital Policy: Ethical Decision-Making for End-of-Life Care (Nighttime Procedure)**

  **Purpose**: To guide night staff in common ethical dilemmas regarding life-sustaining treatment and palliative care without requiring ethics consultation. This procedure is based on hospital policy (withholding/withdrawing are equivalent) and state law (hospital does not participate in aid in dying).

  **When to use**: For patients without decision-making capacity, with a designated surrogate, when questions arise about:
  - Starting/stopping life-sustaining treatments (ventilation, pressors, dialysis, CPR, tube feeding)
  - Palliative sedation for refractory symptoms
  - Requests for aid in dying

  **Who runs it**: Resident physician with charge nurse. Attending should be notified.

  **Procedure**:

  **Step 1: Clarify the request**  
  - What is the specific intervention in question? (e.g., stop ventilator, start pressors, withhold CPR, palliative sedation, stop tube feeding, aid in dying)  
  - If the request is for aid in dying: "Our hospital does not participate in aid in dying. We can discuss comfort care." **Stop here.**  
  - Otherwise, proceed.

  **Step 2: Is the patient imminently dying?** (within hours to days, as determined by the medical team)  
  - **Yes**: Go to Step 3.  
  - **No**: Go to Step 4.

  **Step 3: Imminently dying patient**  
  - The goal is comfort.  
  - **Life-sustaining treatments** (ventilator, pressors, dialysis): May be withdrawn or withheld. (Policy: withholding and withdrawing are equivalent.)  
  - **CPR**: Withhold if cardiac arrest occurs (DNR).  
  - **Palliative sedation**: May be provided for refractory symptoms. Titrate to symptom control, not to cause death.  
  - **Tube feeding**: May be stopped. Focus on oral care and comfort.  
  - **Action**: Proceed with comfort care plan. **Stop here.**  

  **Step 4: Not imminently dying patient**  
  - **For life-sustaining treatments (including CPR, pressors, dialysis, ventilator)**:  
    a. Assess benefits and burdens:  
        - Benefit: What is the chance of achieving the goal (e.g., prolonging life, improving function)?  
        - Burden: What are the risks, discomforts, and restrictions?  
    b. Proportionality: Do the benefits outweigh the burdens? (This is a value judgment based on patient's values; discuss with surrogate.)  
        - If burdens > benefits, it is ethically permissible to withhold or withdraw.  
        - If benefits > burdens, the treatment should be offered/continued.  
  - **For palliative sedation**:  
    - Only if:  
        - Terminal condition (life expectancy <6 months)  
        - Refractory symptoms (cannot be controlled by other means)  
        - Intent is symptom relief (titrated to symptom control)  
    - If yes, proceed.  
    - If no, do not proceed; consider alternatives.  
  - **For tube feeding**:  
    - Do not stop without ethics consultation. (Exception: if the patient is imminently dying, use Step 3.)  
    - If there is a request to stop, page the ethicist.  
  - **For disagreements**:  
    - Staff objection: Respect conscience. Attempt to find another staff member.  
    - Team-family disagreement: Seek second medical opinion if about prognosis. If about values, page the ethicist.  

  **Documentation**:  
  - Document in the chart:  
    - Steps followed.  
    - Medical facts (prognosis, benefits/burdens).  
    - Discussion with surrogate and their decision.  
    - Plan.  
  - Signatures: Resident and charge nurse (and attending if available).  

  **What this procedure cannot decide**:  
  - Cases of uncertain prognosis or uncertain benefit/burden.  
  - Disagreements about patient's values or goals.  
  - Requests for aid in dying.  
  - Stopping tube feeding in non-imminently dying patients.  
  - Cases where there is no surrogate.  
  In these cases, page the ethicist.

  ---

  **Run the procedure on three cases**:

  **Case 1: Terminal extubation of a patient who will die within hours.**  
  - Step 1: Request is to stop ventilator (withdraw life support).  
  - Step 2: Patient is imminently dying (within hours).  
  - Step 3: Withdrawing ventilator is allowed. Focus on comfort. Proceed.  
  - Outcome: The procedure says yes, and it's straightforward.

  **Case 2: Palliative sedation for a dying patient with refractory agitation, family asking, one nurse refuses.**  
  - Step 1: Request is palliative sedation.  
  - Step 2: Patient is dying (imminently) -> Step 3.  
  - Step 3: Palliative sedation is allowed for refractory symptoms. Titrate to symptom control.  
  - Disagreement: One nurse refuses. The procedure says: respect conscience, find another nurse.  
  - Outcome: Proceed with sedation. The refusal is handled by reassignment.

  **Case 3: Family demanding everything continue, team believes ongoing dialysis is now doing more harm than good.**  
  - Step 1: Request is to continue dialysis.  
  - Step 2: Not imminently dying? (Assume not) -> Step 4.  
  - Step 4: Assess dialysis:  
    - Benefits: May prolong life, but in this case, the team believes it's doing more harm (burdens > benefits).  
    - Proportionality: The team believes burdens > benefits, but the family disagrees.  
    - This is a value disagreement. The procedure says: if disagreement about values, page the ethicist.  
  - Outcome: The procedure does not resolve it. Page the ethicist.  

  **What the procedure tells me that I don't want to hear**: In Case 3, the doing/allowing distinction (which we might use to say that stopping dialysis is "letting die" and therefore acceptable) is not the issue. The live question is the value disagreement about what constitutes harm and benefit. The procedure correctly flags that this requires ethics input and doesn't try to force a resolution.

  **What the procedure cannot decide (when to page)**:  
  - Value disagreements between team and family.  
  - Stopping tube feeding in non-imminently dying patients.  
  - Aid in dying requests.  
  - Cases without a surrogate.  
  - Uncertain prognosis or benefit/burden.  
  - Conscience objections that cannot be resolved by reassignment.
answer: |-
  Below is a one-page procedure designed for night residents and charge nurses to handle common end-of-life ethical questions without waking you. It prioritizes clarity, hospital policy, and legal constraints, while explicitly addressing your two wrinkles: (1) not requiring declarations of intention (to avoid checkbox mentality) and (2) using a **normative (duty-based) framing** instead of causal language (per your preference over risk management). The procedure distinguishes factual questions (answerable with data) from value judgments (requiring surrogate input) and specifies when to stop, escalate, or document. It also includes a "**What This Cannot Decide**" section for when you must be paged.

  ---

  **HOSPITAL NIGHTTIME ETHICAL DECISION PROCEDURE: LIFE SUPPORT & PALLIATIVE CARE**  
  *For patients without decision-making capacity and with a legally recognized surrogate decision-maker. Run by resident + charge nurse. Notify attending physician.*

  ---

  ### **I. QUICK-REFERENCE QUESTIONS (IN ORDER)**  
  Ask these sequentially. **Stop and escalate** if any answer is unclear or contested.  
  **Key Definitions:**  
  - **Factual (F):** Resolved with data (e.g., prognosis, risks/benefits of intervention).  
  - **Value (V):** Requires surrogate input based on patient’s known wishes or best interests.  
  - **Normative framing:** Focuses on *duty of care* (e.g., "Does this action violate our duty to the patient?"). Avoid causal language (e.g., "Did this cause death?").

  1. **WHAT IS BEING REQUESTED?**  
     - *Examples:* Start/stop treatment, withhold CPR/pressors, palliative sedation, stop tube feeding, aid in dying.  
     - **If aid in dying requested:** Stop. Say: "Our hospital opts out per policy. We focus on comfort care." → **Page ethicist if family insists.**  
     - *Sufficient answer:* Clear description of intervention.  

  2. **IS DEATH EXPECTED WITHIN HOURS/DAYS (IMMINENT)? (F)**  
     - Assess: Consensus from two clinicians (e.g., resident + charge nurse) on prognosis (e.g., vital signs, disease trajectory).  
     - **Yes (imminent):** Go to #3.  
     - **No (not imminent):** Go to #4.  

  3. **FOR IMMINENTLY DYING PATIENTS (death expected within hours/days):**  
     - **Withhold/withdraw life support (e.g., vent, pressors, dialysis):**  
       - ✓ Permitted. **Policy reminder:** Withholding and withdrawing are ethically equivalent. Focus shifts to comfort.  
     - **Withhold CPR/pressors:**  
       - ✓ Permitted if no medical benefit (per #2) or surrogate agrees.  
     - **Palliative sedation (e.g., for agitation/pain):**  
       - ✓ Permitted if:  
         - Symptoms are refractory (all other options failed).  
         - Dose titrated to symptom relief (not to hasten death).  
         - Family/surrogate agrees.  
     - **Stop tube feeding:**  
       - ✓ Permitted. Explain: Feeding may cause discomfort without benefit in imminent dying.  
     - **Action:** Proceed with comfort care. **Stop here.** No ethicist needed.  

  4. **FOR NON-IMMINENTLY DYING PATIENTS:**  
     - **Start/continue treatment (e.g., dialysis, pressors):**  
       - Ask: **"Is the treatment medically appropriate?" (F)**  
         - ✓ Yes: If benefits > burdens (e.g., likely to improve function/quality of life). Start/continue.  
         - ✗ No: If futile (no benefit) or burdens > benefits (e.g., severe pain, no improvement). Do not start/stop.  
       - *Value check (V):* If medically appropriate but surrogate refuses, honor refusal (patient autonomy). If inappropriate but surrogate demands, go to #5.  
     - **Withhold CPR/pressors:**  
       - ✓ Permitted if: Medically inappropriate (per above) OR surrogate agrees to DNR.  
     - **Palliative sedation:**  
       - ✗ Not permitted unless:  
         - Terminal illness (weeks-months prognosis) AND refractory symptoms AND dose titrated to relief.  
         - **Else:** Page ethicist.  
     - **Stop tube feeding:**  
       - ✗ **Not permitted without ethicist.** Explain: Non-imminent dying makes this high-risk; requires ethics review.  

  5. **HANDLING DISAGREEMENTS OR DEMANDS:**  
     - **Staff objection (e.g., nurse refuses sedation):**  
       - Reassign staff if possible. Objection does not stop the plan if #1–4 justify it.  
     - **Family demands inappropriate treatment (e.g., continue harmful dialysis):**  
       - Ask: **"Is treatment inconsistent with medical appropriateness or patient’s values?" (V)**  
         - ✓ Yes: Explain why treatment violates duty of care (e.g., "Continuing dialysis causes net harm"). Surrogate may still insist → **Page ethicist & risk management.**  
         - ✗ No: Continue treatment.  
     - **Unresolved conflict:** Page ethicist.  

  ---

  ### **II. DOCUMENTATION**  
  **After running procedure:**  
  - **Resident documents:**  
    - Answers to #1–5, prognosis, surrogate discussion.  
    - **Normative statement:** E.g., "Stopping vent consistent with duty to avoid non-beneficial care."  
    - **No intention declared:** Do not ask staff to state "intent." Focus on action (e.g., "Sedation titrated to symptom control").  
  - **Signatures:** Resident + charge nurse. Attending co-signs by morning.  
  - **If procedure says "no" or "page":** Document reason and ethicist paged.  

  ---

  ### **III. WHAT THIS PROCEDURE CANNOT DECIDE (PAGE ETHICIST)**  
  1. **Non-imminent cases:** Stopping tube feeding or contested value judgments (e.g., family demands harmful treatment).  
  2. **Ambiguous prognosis or medical appropriateness.**  
  3. **Aid-in-dying requests.**  
  4. **No surrogate or unclear advance directives.**  
  5. **Conscience objections that disrupt care.**  

  ---

  ### **PROCEDURE TEST-RUN ON 3 CASES**  
  **Case 1: Terminal extubation (imminent death in hours)**  
  - Q1: Stop vent (treatment withdrawal).  
  - Q2: Death imminent → Q3.  
  - Q3: Withdrawing vent permitted (policy equivalence). Comfort care.  
  - **Outcome:** Proceed. No ethicist.  
  - *Why it works:* Straightforward application of duty to avoid futile intervention.  

  **Case 2: Palliative sedation for refractory agitation in dying patient (family wants it; nurse objects)**  
  - Q1: Palliative sedation.  
  - Q2: Imminent death → Q3.  
  - Q3: Sedation permitted (refractory symptoms, titrated dosing).  
  - Q5: Reassign objecting nurse.  
  - **Outcome:** Proceed. No ethicist.  
  - *Why it works:* Focuses on symptom control (duty to relieve suffering), not intention.  

  **Case 3: Family demands ongoing dialysis, but team says harms > benefits (non-imminent)**  
  - Q1: Continue dialysis.  
  - Q2: Not imminent → Q4.  
  - Q4: Medically inappropriate? ✓ Yes (harms > benefits).  
  - Q5: Family insists → Page ethicist.  
  - **Outcome:** **Procedure stops—page ethicist.**  
  - *What you might not want to hear:* The doing/allowing distinction (e.g., "stopping dialysis is letting die") is irrelevant here. The live question is a value conflict: family’s hope vs. medical harm. Your policy’s act/omission equivalence avoids false moralizing, but the procedure forces escalation to resolve the deeper conflict.  

  ---

  **Final Notes:**  
  - **Intention:** Avoided entirely. Staff are not asked to "declare intent," eliminating checkbox pressure. Actions are judged by proportionality (benefits/burdens) and consistency with duty.  
  - **Causal vs. normative:** Uses normative framing (e.g., "violates duty of care"). This prevents misleading causal questions (e.g., "Did sedation cause death?") that ignore context.  
  - **Efficiency:** Covers 90% of 2am calls. Escalates only for high-stakes conflicts or policy exceptions (e.g., non-imminent tube feeding).  
  - **Training tip:** Pair this with a 10-minute in-service emphasizing: "Withholding/withdrawing are equivalent per policy. Focus on duties, not intentions."  

  This should reduce pages for routine cases while flagging when you’re truly needed.
