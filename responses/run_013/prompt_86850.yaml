prompt: |-
  Alright, I need a case built to order. Context: I'm writing a section arguing that the emotion-as-perception view has one advantage the emotion-as-evaluative-judgement view can't match, namely that it can give emotions an evaluative content that isn't propositional — and I keep getting the same three illustrations from everyone (spider on the windowsill, exam nerves, grief for a dead grandmother), so I want something fresh.

  What I need: one episode, one ordinary adult, in which

  (a) the feeling view — emotions just are the felt bodily goings-on — has to count the episode as an emotion;
  (b) the perception view — emotions are non-inferential, not-up-to-you appearances of value, same family as perceptual experience — has to count it as an emotion;
  (c) the judgement view (Solomon's line: an emotion is an evaluative judgement, not a feeling) is forced either to deny that it's an emotion or to stretch 'judgement' until it stops meaning anything.

  The crux is (c), and here's the shape I'm after: the person has an emotion directed at a particular thing, and there is genuinely no property she takes that thing to have — nothing she'd assent to, nothing she'd infer from, nothing she'd defend. The perception view can eat that; it can represent value without concepts. The judgement view can only get it back by positing a judgement that plays none of the roles judgements play. Don't just stipulate that, build it so it shows.

  Constraints, because otherwise this gets fudged:

  - one paragraph, kitchen/bus/office realism. No lesions, no drugs, no hypnosis, no blindsight, no zombies, no fictional objects.
  - not a recalcitrance case with the serial numbers filed off ('she knows the spider's harmless but...'). No self-deception, no repression.
  - I need to rule out 'she does judge it, she just won't say so' on grounds other than her own introspective testimony, so make the missing judgement conspicuous from the outside — in what she infers, what she'll say when she thinks no ones listening, what she'd concede under pressure.
  - she's not an unusually opaque person; the point is that a judgement there would have been visible, not that she's a superb introspector.
  - the state has to be object-directed, so nobody gets to say 'that's a mood'. Its aboutness should be evident in attention, memory, action tendencies.
  - and it has to read as a full-blooded emotion — anyone watching would say she's in the grip of one. That's the bit people cheat on: don't tack on 'and it is an emotion' as a stipulation, make it come across.

  Then walk me through it: the verdict each view gives and why, which single feature of the case is doing the work, what happens if I take that feature away (does it collapse into a standard recalcitrance case?), and the strongest way a defender of the judgement view would attack the case. Two of my grad students tried this and both ended up stipulating the verdicts, which is exactly what I don't want — if it can't be built, tell me where it breaks.
reasoning: |-
  Okay, the user is working on a philosophy paper comparing different theories of emotion. They need a fresh case study that meets very specific criteria to demonstrate an advantage of the perception view over the judgment view. 

  Hmm, this is quite a challenging request. The user has clearly encountered the standard examples too many times and wants something original that can't be dismissed easily. They're frustrated with graduate students who resorted to stipulation rather than constructing a solid case. 

  The constraints are tight: ordinary setting, no special conditions, must feel like a genuine emotion to observers, and crucially must show complete absence of judgment without relying on introspection. The judgment view defender must be forced into an awkward position. 

  Let me think through possible scenarios... Workplace situations might work well because they involve complex social dynamics. What about someone feeling inexplicable dread toward an ordinary printer? The physical symptoms (a) and perceptual qualities (b) are easy to establish. For (c), the key is showing zero trace of evaluative belief - not just denial but no behavioral evidence whatsoever. 

  The printer case could work because:
  - Physical signs are undeniable (sweating, avoidance)
  - Attention is object-focused (stares at it, remembers past failures)
  - Under pressure she admits it makes no sense
  - Even alone she talks to it as if it were malicious but explicitly denies believing that
  - Colleagues clearly recognize it as irrational fear

  Important nuances: She doesn't infer anything dangerous about the printer, doesn't act on any supposed properties, and her verbalizations show awareness of the irrationality. The judgment view would either have to deny this is emotion (implausible) or invent a "judgment" that bears no relation to actual judgment properties. 

  Potential objections: A judgment theorist might claim there's unconscious judgment. But the user specified ruling this out through observable behavior - here, the absence of judgment-consistent actions even in private moments counters that. If we remove the "explicit denial while personifying" element, it might collapse into standard recalcitrance. 

  This seems to satisfy all requirements while feeling realistic. The printer's mundanity highlights how the perception view handles pre-conceptual evaluation better. I'll develop it with concrete details that make the emotion unmistakable.
answer: |-
  Here's a fresh case built to your specifications, followed by analysis:

  **The Case: Printer Dread**
  Sarah, a normally composed office manager, approaches the aging departmental printer (the "Beast") to retrieve a report. As she nears it, her palms sweat, her breath quickens slightly, and her shoulders tense – a familiar, unwelcome wave washes over her. She avoids eye contact with the machine, focuses intensely on its blinking "ready" light, and feels a powerful urge to grab the report and flee. Later, recounting the incident to a trusted colleague *she knows finds the Beast reliable*, she laughs nervously: "I know it's ridiculous! The stats show it rarely jams for *me*, it's just old and ugly, not *evil*. But honestly? Every time I walk up, it feels like it's *waiting* to ruin my day. I call it names in my head sometimes when it's quiet, 'you useless lump' – but I don't *really* think it's out to get me! That'd be bonkers." Under direct questioning ("So, do you believe the printer *intends* to harm you or your work?"), she firmly rejects it: "No, of course not. It's just a machine. It *feels* hostile, is all." Her colleagues readily identify this as "Sarah's weird printer phobia," observing her visible tension and hurried movements around it.

  **Walkthrough:**

  1.  **Feeling View (Primal Fear):** The episode *must* count as an emotion. The core criteria are met: distinct, reportable patterns of felt bodily changes (sweating, breath quickening, tension) are present and constitutive of the experience Sarah identifies as "dread" directed at the printer.
  2.  **Perception View (Value Appearance):** The episode *must* count as an emotion. It presents a non-inferential, passive appearance of negative value (threat, hostility, malevolence) emanating *from the printer itself*. Sarah doesn't reason to this appearance; it strikes her immediately upon encountering the object. The aboutness is clear: her attention fixes on the printer, her memory recalls past encounters, her action tendencies are avoidance/flight.
  3.  **Judgement View (Forced Choice):** The judgement view faces a dilemma.
      *   **Deny it's an emotion:** This strains credibility. The physiological symptoms, object-directed focus, behavioral manifestations (avoidance, nervous laughter), and intersubjective recognition ("Sarah's weird printer phobia") all scream "emotion" – specifically, fear or dread. Denying this severs the theory from common sense and observable phenomena.
      *   **Stretch 'Judgement':** To accommodate it, the view must posit an "unconscious judgement" or "non-propositional evaluation" that the printer is hostile/threatening. However:
          *   **No Assent:** Sarah explicitly denies assenting to any proposition like "The printer intends to harm me" or "The printer is threatening *me*," even under pressure and in private confidence.
          *   **No Inferential Role:** She doesn't infer *anything* from this supposed judgement (e.g., she doesn't warn others, request a replacement, or avoid tasks involving the printer beyond the immediate interaction). Her knowledge of the printer's reliability overrides any potential inference.
          *   **No Defensive Role:** She offers no defense of the printer's hostility; she actively mocks the *idea* ("bonkers") while acknowledging the *feeling*.
          *   **No Conceptual Articulation:** Even in private monologue ("you useless lump"), the language is expressive frustration, not an articulation of a threatening property she attributes to it. Her explicit self-report distinguishes *feeling* ("it feels hostile") from *believing* ("I don't really think it's out to get me").
      A judgement playing *none* of these characteristic roles (assent, inference, defense, conceptual articulation) ceases to be recognizable as a *judgement* in the standard philosophical sense Solomon employs. It becomes an empty posit, a "judgement" in name only to save the theory.

  **The Crucial Feature:** **The complete dissociation between the object-directed emotional phenomenology (presenting hostile value) and *any trace* of a corresponding evaluative belief or judgement in the subject's cognitive economy, observable through her assertions (public/private), inferences, and justificatory behavior.**

  *   **Why it works:** Sarah's explicit, pressured denial combined with the total absence of belief-consistent reasoning or action *even in private* rules out self-deception, repression, or unspoken assent. Her private mutterings reveal expressive frustration, not hidden belief. Observers see the emotion clearly, but also see her rational assessment contradicting it completely.
  *   **If Removed:** If Sarah *hinted* at believing the printer was "jinxed" for her, or avoided complex print jobs "just in case," or became flustered defending her denial, it collapses into standard recalcitrance (judgement vs. feeling). The *total absence* of judgement-consistent cognition/behavior is key.
  *   **Judgement View Defense:** The strongest attack would be: **"She *does* judge it negatively (e.g., 'bad', 'unreliable', 'frustrating') in a thin, non-propositional way, and *that* minimal judgement constitutes the emotion. The 'hostility' is just vivid sensory/somatic accompaniment."**
      *   **Counter:** This fatally weakens the judgement view. Firstly, "thin" evaluations like "bad" lack the specificity of the emotion's content (directed hostility/threat). Secondly, it concedes the core point: the *rich, specific evaluative content* (the hostile intentionality) Sarah experiences isn't carried by a judgement. It reduces the "judgement" to a bare, inert label tacked onto the feeling/perception, failing to explain the *aboutness* and *specificity* of the emotion itself. It becomes a feeling view or perception view in disguise.

  **Why it Doesn't Stipulate:** The case doesn't *declare* "no judgement exists." It *builds* the absence through Sarah's observable cognitive and behavioral profile: consistent explicit denial under pressure, lack of inferential or justificatory behavior based on hostility, private expressions that are expressive rather than attributive, and rational acceptance of contradictory evidence – all within an episode displaying unmistakable emotional phenomenology and object-directedness recognized by others. The verdicts for (a) and (b) follow directly from the described phenomenology; (c) is forced by the constructed absence of judgement's defining roles.
