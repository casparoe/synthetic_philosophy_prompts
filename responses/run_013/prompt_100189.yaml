prompt: |-
  Draft the joint statement of an adversarial collaboration between epistemicists and supervaluationists about vagueness. I have read too many comment threads in which these two camps restate their positions at each other, and I want the document they could both actually sign: not a dialogue, not a verdict, and not an explanation of why the debate is stuck, but the constructive text that a genuine adversarial collaboration would produce.

  Set it out as follows.

  First, a numbered section of claims both sides can sign. I want these to be substantive rather than platitudinous, and I would rather they were surprising than safe. Include, if you can get them past both parties: that both reject degree-theoretic treatments of vagueness; that both preserve classical propositional logic and classical consequence for the object language; that both hold sorites arguments unsound, and agree on which premise does the damage; that both hold the sharp-cutoff existential — the claim that some number of grains is the last that makes a heap — to be true; that both accept that no empirical procedure, no exercise of linguistic competence and no introspection will deliver the location of the cutoff; and that both therefore owe an account of why ordinary speakers say there is no fact of the matter, rather than taking that remark at face value. Be precise about scope: say which of these hold for vague predicates generally and which only for sorites-susceptible ones. Where a claim would be vacuous as stated, tighten it until it is not.

  Second, the disagreements, as a table. One row per question, with a column giving the epistemicist's answer and a column giving the supervaluationist's answer, each phrased in terms that side would accept as its own — neither caricatured nor pre-conceded. Further columns: the crux the row turns on; a concrete case, argument or test that both sides agree would bear on it; and each side's prediction for that test, recorded in advance. Make sure the table includes the status of borderline sentences (truth-valueless versus bivalent but unknowable), the behaviour of the truth predicate itself, and what becomes of the individual sorites conditionals taken one at a time. For the row on the truth predicate, the test I have in mind is the pair of sentences 'P or not P' and 'P is true or not-P is true': the two camps should diverge there, and I want that divergence written out.

  Third, a short section on cruxes. For each, say which side it would move and in which direction, and what each side would count as evidence against its own view. I expect the load-bearing ones to be whether the in-principle unavailability of the cutoff is evidence of ignorance or of the absence of a fact, and whether higher-order vagueness is handled better by one camp's machinery than the other's; but tell me if I have the cruxes wrong.

  Fourth, say plainly which parts of the dispute are terminological, if any, and why — I suspect at least the quarrel over the word 'true' is partly verbal, and I want that separated from the residue that is not.

  Write for someone who can reason about this but cannot look anything up: do not name theorists, cite works, or lean on any particular author's formulation, and do not presuppose that the reader has memorised a canonical statement of either view. Use 'epistemicist' and 'supervaluationist' purely as labels for the positions. British English. End with a final line of the form \answer{...} containing a label of no more than a dozen words naming the single crux on which, if it were settled, the disagreement would most nearly disappear.
reasoning: |-
  We are drafting a joint statement from an adversarial collaboration between epistemicists and supervaluationists on the topic of vagueness. The goal is to produce a document both sides can sign, focusing on constructive agreements and clear disagreements.

  The structure is as follows:

  1. **Agreements**: A numbered list of substantive claims both sides accept. These should be precise and non-trivial.
  2. **Disagreements**: A table with rows for key questions, columns for each side's position, the crux of the disagreement, a concrete test case, and each side's prediction for that test.
  3. **Cruxes**: A short section on the key points that could shift the debate, including what each side would count as evidence against their own view.
  4. **Terminological Issues**: A plain statement on which parts of the dispute are merely terminological.

  Finally, we end with an `\answer{}` containing a label for the single most pivotal crux.

  We write in British English and avoid references to specific authors or works.

  ---

  **Joint Statement on Vagueness: Epistemicism and Supervaluationism**

  **1. Agreements**

  Both epistemicists and supervaluationists, in their treatment of vagueness, agree on the following substantive claims:

  1. **Rejection of Degree-Theoretic Treatments**: Both parties reject any theory that assigns intermediate truth values (such as degrees of truth between 0 and 1) to vague sentences. This rejection holds for all vague predicates.

  2. **Preservation of Classical Logic for the Object Language**: Both parties preserve classical propositional logic and classical consequence for the object language. Specifically, for any vague sentence P, the law of excluded middle (P ∨ ¬P) holds and is a tautology, and the law of non-contradiction holds. This applies to all vague predicates.

  3. **Sorites Arguments are Unsound**: Both agree that sorites arguments are unsound, and they agree on which premise is false. For a sorites series for a predicate F (e.g., 'is a heap') with a series of objects a₁, a₂, ..., aₙ such that a₁ is clearly F and aₙ is clearly not F, the premise that does the damage is the universal conditional: ∀i (F(a_i) → F(a_{i+1})). This premise is false. This agreement holds for all sorites-susceptible vague predicates.

  4. **Sharp Cutoff Existential is True**: Both hold that there is a sharp cutoff in a sorites series. That is, for a sorites series as above, there exists some i such that a_i is F and a_{i+1} is not F. This existential claim is true. However, this agreement is specific to sorites-susceptible vague predicates (those for which a sorites series can be constructed).

  5. **In-Principle Unavailability of the Cutoff**: Both accept that no empirical procedure, no exercise of linguistic competence, and no introspection will deliver the location of the cutoff. This is not merely a practical limitation but an in-principle one. This holds for all vague predicates that exhibit sorites susceptibility.

  6. **Accounting for Ordinary Speech**: Both parties acknowledge that ordinary speakers often say "there is no fact of the matter" when confronted with borderline cases. Both therefore owe an account of why such remarks are made, rather than taking them at face value as evidence that there is no fact of the matter. This holds for all vague predicates.

  **2. Disagreements**

  The table below sets out the key disagreements. Each row addresses a specific question. The columns are:
  - **Epistemicist Answer**: The epistemicist's position in their own terms.
  - **Supervaluationist Answer**: The supervaluationist's position in their own terms.
  - **Crux**: The fundamental issue the row turns on.
  - **Concrete Test**: A case, argument, or test that both sides agree would bear on the disagreement.
  - **Epistemicist Prediction**: What the epistemicist predicts for the test.
  - **Supervaluationist Prediction**: What the supervaluationist predicts for the test.

  | Question                                                                 | Epistemicist Answer                                                                 | Supervaluationist Answer                                                                 | Crux                                                                                                | Concrete Test                                                                                                                               | Epistemicist Prediction                                                                 | Supervaluationist Prediction                                                               |
  | :----------------------------------------------------------------------- | :---------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------- |
  | What is the status of a borderline sentence?                             | Every borderline sentence is either true or false (bivalent), but it is unknowable. | A borderline sentence is neither true nor false (truth-valueless).                       | Whether vagueness is a matter of ignorance (epistemic) or lack of definite truth conditions (semantic). | Consider a borderline case P (e.g., 'This grain collection is a heap'). Assess the truth value of P.                                        | P has a truth value (either true or false), but we cannot know it.                      | P has no truth value.                                                                      |
  | What is the behaviour of the truth predicate?                            | For any sentence P, 'P is true' has the same truth value as P.                      | 'P is true' is true only if P is true on all precisifications; false only if false on all; otherwise, neither. | Whether the truth predicate is bivalent and transparent, or whether it inherits the vagueness of its argument. | Compare the sentences: (A) 'P or not P' and (B) 'P is true or not-P is true'.                                                               | Both (A) and (B) are always true.                                                       | (A) is always true, but (B) is not true when P is borderline (since both disjuncts lack truth value). |
  | Are the individual sorites conditionals (e.g., for each i, F(a_i) → F(a_{i+1})) true? | Each such conditional is false at the cutoff; elsewhere, they are true.             | Each such conditional is neither true nor false when the antecedent and consequent are borderline, and false at the cutoff. | Whether conditionals involving borderline cases have truth values and, if so, which.                | Take a sorites conditional for a clear non-borderline case (e.g., F(a₁) → F(a₂)) and for a borderline case (e.g., F(a_k) → F(a_{k+1})). | The conditional is true for clear cases, false at the cutoff, and for borderline cases, it is true or false (but not always false). | The conditional is true for clear cases, false at the cutoff, and neither true nor false for borderline cases. |

  **3. Cruxes**

  The following cruxes are pivotal in the debate. For each, we note which side it would move and in what direction, and what each side would count as evidence against its own view.

  - **Crux 1: The nature of the in-principle unavailability of the cutoff**  
    - *Epistemicist stance*: The unavailability is due to ignorance — there is a fact, but we cannot know it.  
    - *Supervaluationist stance*: The unavailability is due to the absence of a fact — the language is unsettled.  
    - *How it could shift the debate*: If it were shown that the cutoff must be knowable in principle, this would falsify epistemicism. If it were shown that the cutoff cannot exist (e.g., by a compelling account of higher-order vagueness that precludes any sharp boundaries), this would falsify supervaluationism.  
    - *Evidence against own view*:  
      - Epistemicists: Evidence that the cutoff is not merely unknowable but incoherent (e.g., a proof that no sharp boundary can exist without contradiction).  
      - Supervaluationists: Evidence that the cutoff is knowable (e.g., an empirical method to reliably identify the exact boundary in a sorites series).

  - **Crux 2: Higher-order vagueness**  
    - *Epistemicist stance*: Higher-order vagueness is just more ignorance about where the boundaries of ignorance lie.  
    - *Supervaluationist stance*: Higher-order vagueness requires multiple levels of precisifications, but this leads to a regress that may be problematic.  
    - *How it could shift the debate*: If higher-order vagueness cannot be modelled without collapsing into either bivalence or a non-classical logic, this would challenge supervaluationism. If higher-order vagueness can be shown to be reducible to first-order ignorance without regress, it would support epistemicism.  
    - *Evidence against own view*:  
      - Epistemicists: Evidence that higher-order borderline cases are not merely cases of ignorance but require a semantic account (e.g., intuitive judgments that some sentences are not just unknown but indeterminate at higher orders).  
      - Supervaluationists: Evidence that the supervaluationist machinery cannot handle higher-order vagueness without either admitting sharp boundaries at some level or violating classical logic.

  **4. Terminological Issues**

  We identify the following terminological elements:

  - **The word 'true'**: The dispute over whether 'true' applies to borderline sentences is partly terminological. Both sides agree that in the object language, classical logic holds (so 'P or not P' is true). However, the supervaluationist uses 'true' in a more restrictive sense (requiring truth on all precisifications) for the meta-language, while the epistemicist uses a bivalent, disquotational notion. This difference in the definition of 'true' is not substantive in the sense that both can agree on the object-language facts, but it reflects a deeper disagreement about the nature of vagueness.

  - **The phrase 'no fact of the matter'**: This phrase is often used by ordinary speakers. Both sides agree that it is uttered, but they interpret it differently. For the epistemicist, it expresses ignorance; for the supervaluationist, it expresses indeterminacy. This is not merely terminological because it reflects the underlying disagreement about whether there is a fact.

  The residual, non-terminological disagreement is whether vagueness is fundamentally an epistemic phenomenon (there are facts, but we don't know them) or a semantic one (the facts are not fixed by our language and usage).

  \answer{The nature of the unavailability of the cutoff}
answer: |-
  ### Joint Statement on Vagueness: Epistemicism and Supervaluationism  

  #### 1. Substantive Agreements  
  Both epistemicists and supervaluationists endorse the following claims as foundational to their shared rejection of non-classical approaches to vagueness. These are specific to sorites-susceptible vague predicates (e.g., "heap", "bald")—those admitting of a sorites series—unless otherwise stated:  

  1. **Degree-theoretic treatments are inadequate**: Both reject theories assigning partial truth values (e.g., [0,1] intervals) to vague sentences. Such treatments fail to preserve classical logic or explain sharp cutoffs. This holds for all vague predicates.  
  2. **Classical logic governs the object language**: For any vague atomic sentence \(P\), classical propositional logic holds: \(P \lor \neg P\) is tautologous, and consequence is classical. This applies universally to vague predicates.  
  3. **Sorites arguments are unsound, with a identifiable false premise**: The universal premise (e.g., "For all \(i\), if \(i\) grains make a heap, then \(i+1\) do") is false. Its falsity explains the paradox.  
  4. **A sharp cutoff exists**: There is a specific point \(n\) in a sorites series where \(P(n)\) is true and \(P(n+1)\) is false. This existential claim ("There exists a last heap") is true.  
  5. **The cutoff is in principle undiscoverable**: No empirical method, linguistic competence, or introspection can identify \(n\). This is not contingent but necessary.  
  6. **Ordinary denials of "fact of the matter" require explanation**: Speakers’ assertions that "there is no fact" in borderline cases must be explained, not taken as literal truth. Both owe an error theory for this.  

  #### 2. Disagreements  
  The table below presents unresolved disputes. Predictions for tests are stipulated in advance and are empirically falsifiable (e.g., via speaker judgments or logical analysis).  

  | Question                                                                 | Epistemicist Answer                                                                 | Supervaluationist Answer                                                                 | Crux                                                                 | Concrete Test                                                                                                                                                                                                                              | Epistemicist Prediction                                                                                              | Supervaluationist Prediction                                                                                              |  
  | :----------------------------------------------------------------------- | :---------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------- | :------------------------------------------------------------------ | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------ |  
  | **What is the status of a borderline sentence?**                         | Every borderline sentence is either true or false, but irredeemably unknowable.     | Borderline sentences lack truth values: they are neither true nor false.                 | Whether vagueness is fundamentally epistemic or semantic.           | Present speakers with a borderline proposition \(P\) (e.g., "This 100-grain collection is a heap") and ask: "Is \(P\) true, false, or neither?"                                                                                         | Speakers will erroneously judge "neither", but the correct answer is "true or false" (though unknowable).          | Speakers will correctly judge "neither".                                                                                |  
  | **How does the truth predicate behave?**                                 | "True" is transparent: \(T(\ulcorner P \urcorner)\) always matches \(P\)'s truth value. | "True" is precisification-relative: \(T(\ulcorner P \urcorner)\) holds iff \(P\) is true on all admissible precisifications. | Whether truth is bivalent and disquotational.                       | Compare the sentences: (A) \(P \lor \neg P\) and (B) \(T(\ulcorner P \urcorner) \lor T(\ulcorner \neg P \urcorner)\), for borderline \(P\). Logically evaluate (A) and (B) in the theory.                                               | (A) and (B) are both true.                                                                                           | (A) is true; (B) is not true (as neither disjunct holds).                                                                |  
  | **Are individual sorites conditionals true?**                            | Each conditional \(P(i) \to P(i+1)\) is true except at the cutoff \(n\), where \(P(n) \to P(n+1)\) is false. | For \(i\) in the borderline range, \(P(i) \to P(i+1)\) lacks a truth value; it is false only at the cutoff. | Whether conditionals can be non-bivalent due to vagueness.          | Test a sorites conditional for a pair \((i, i+1)\) where both are borderline (e.g., "If 100 grains make a heap, so do 101"). Ask: "Is this conditional true, false, or neither?"                                                        | Speakers will judge "true" or "false" (erroneously if borderline), but the conditional is true (unless at cutoff). | Speakers will judge "neither", correctly reflecting truth-value gaps.                                                   |  
  | **Does higher-order vagueness exist?**                                   | Higher-order vagueness reflects ignorance of cutoff boundaries, not semantic indeterminacy. | Higher-order vagueness requires indeterminacy in precisifications, introducing further truth-value gaps. | Whether higher-order vagueness is reducible to first-order ignorance. | Examine a sentence \(Q\): "It is indeterminate whether \(P(i)\) is borderline". Assess if \(Q\) introduces new truth-value gaps beyond first-order cases.                                                                               | \(Q\) is always true or false (unknowably); no new gaps arise.                                                       | \(Q\) may lack a truth value, demonstrating higher-order gaps.                                                            |  

  #### 3. Cruxes  
  The debate hinges on resolvable empirical or theoretical cruxes. Each side specifies what would falsify its view:  
  - **Crux 1: The unavailability of the cutoff**  
    - *Epistemicist stance*: Unavailability implies ignorance; if shown that no fact *could* exist, epistemicism fails.  
    - *Supervaluationist stance*: Unavailability implies indeterminacy; if the cutoff were discovered, supervaluationism fails.  
    - *Evidence against own view*:  
      - Epistemicists: Proof that "\(P(n) \land \neg P(n+1)\)" is incoherent (e.g., via vicious regress in higher-order vagueness).  
      - Supervaluationists: Empirical demonstration of a cutoff (e.g., consistent intersubjective convergence on \(n\) via a new method).  
    - *Shift direction*: Settling this crux would most directly sway undecided parties toward one view.  

  - **Crux 2: Higher-order vagueness**  
    - *Epistemicist stance*: Higher-order vagueness is epistemically tractable; if it forces non-classical logic, supervaluationism gains.  
    - *Supervaluationist stance*: Higher-order vagueness is semantically seamless; if it collapses into sharp boundaries, epistemicism gains.  
    - *Evidence against own view*:  
      - Epistemicists: If speakers systematically judge higher-order borderline cases as "gappy" (not merely unknown).  
      - Supervaluationists: If no satisfactory supervaluationist model captures higher-order vagueness without ad hoc machinery.  
    - *Shift direction*: Resolution here would weaken the non-prevailing side but not eliminate it (as Crux 1 is more fundamental).  

  #### 4. Terminological Issues  
  - **"Truth" and "fact of the matter"**: The dispute over whether borderline sentences are "true" or have a "fact" is partly terminological. Both agree on the object-language logic (e.g., \(P \lor \neg P\) holds), but supervaluationists restrict "true" to supertruth (truth on all precisifications), while epistemicists use it disquotationally. This masks deeper agreement: both affirm that borderline sentences lack *determinate* truth values—epistemicists due to ignorance, supervaluationists due to semantic indecision.  
  - **Residue**: The non-terminological core is whether the in-principle unknowability of cutoffs is *constitutive of* vagueness (epistemicism) or a *byproduct* of semantic indecision (supervaluationism). This turns on the nature of linguistic competence and metaphysical commitment to bivalence.  

  \answer{The nature of the unavailability of the cutoff}
