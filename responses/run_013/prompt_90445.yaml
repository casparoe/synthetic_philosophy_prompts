prompt: |-
  I run the formal epistemology reading group in my department and last week's session turned into a proper fight between two of the regulars, Ana (third-year, works on credal norms) and Kenji (came over from the stats side, annoyingly good at this stuff). I was chairing so I stayed out, and honestly by the end I'm not sure I could've picked a side anyway. Can you adjudicate for me?

  What we were doing was the dominance argument for probabilism — the one where any credence function that violates the probability axioms is accuracy-dominated by some coherent alternative, so incoherence comes out as a mistake about accuracy, no pragmatic stakes needed.

  Ana's opening: the beauty of it is that it doesn't turn on the Brier score. Take any scoring rule that's proper, and the dominance still goes through, so nobody gets to say the result is an artifact of one particular way of measuring accuracy. Accuracy alone gives you probabilism.

  Kenji's first worry: he says he's fairly sure the fully general version of the theorem needs the score to be additive across propositions — you score the whole credence function by summing the scores of the individual credences — and that once you drop additivity the dominance claim can actually fail, so the argument is assuming more than she's letting on. His second worry, which he clearly cared about more: fine, coherence. But dominance is a very weak test. It only rules out functions that get beaten in every possible world. It says nothing about which coherent credence function you should have. So where do the other norms come from? What makes my credences rational given my evidence?

  Ana: that's what the expected-accuracy machinery is for. Conditionalizing on your evidence maximizes expected accuracy, and that holds for any proper scoring rule. So accuracy gives you updating too — you don't have to bolt on a seperate evidential norm.

  Kenji: but that looks circular. Expected accuracy gets computed with your current credences. And any coherent credence function already expects itself to be the most accurate one available — ask someone sitting at 0.5 on a coin flip which credence she expects to score best and she'll say 0.5. So "maximize expected accuracy" can't tell you to change anything, at least not if you're already coherent; by its own lights your current function already wins. So the real argument for conditionalizing has to be about the credence function you'll have after you learn E — and that comparison is still run from your current credences, which means it presupposes that your present self is the thing to defer to. Deference to your present self isn't an accuracy norm. It's an extra premise.

  Ana: two things. If you're already coherent, of course no purely accuracy-based norm is going to move you — but the norm isn't empty for someone who's incoherent, and that's who it's aimed at. And deference isn't an extra premise, it's what caring about accuracy consists in. Your current credences are your best estimate of how the world is; if you want to know which credence function is more likely to be accurate, the only non-arbitrary thing to use is what you already think. That's not circular, that's the only way accuracy can guide you at all.

  Kenji: then it's vacuous for exactly the people it's supposed to guide, and the norm can't even speak to the case I want it for. My officemate is certain she's getting her grant renewed. If she's right she's got a perfect accuracy score, and by her own lights 1 is the most accurate credence available. Accuracy-first has nothing to say to her, and that's the case where I most want a norm. Also, "take your own information seriously" is the thing we're trying to justify, not the justification.

  They where going in circles like that for another ten minutes — Ana kept saying that's just what accuracy is, Kenji kept saying that's exactly the thing I'm asking you to justify — and I called time. Please go through it move by move and give me a verdict on each step, not just an overall winner, and flag anywhere one of them is right for the wrong reason. Then tell me what both of them are missing. And be honest about how confident you are in the verdict, and which single point you're least sure of — I'd much rather have a verdict with a clear flag on it's weakest joint than a confident-sounding one that's quietly a coin flip.
reasoning: |-
  Okay, let me tackle this formal epistemology dispute between Ana and Kenji. The user wants a move-by-move adjudication of their argument about dominance arguments for probabilism and accuracy-based norms, with clear verdicts and confidence levels.

  First, I need to reconstruct the key points systematically. The debate started with Ana's claim that any proper scoring rule supports the dominance argument for probabilism, making incoherence an accuracy mistake without pragmatic considerations. Kenji countered with two objections: that additivity is secretly required for dominance, and that dominance is too weak to guide rational credence selection under evidence.

  Hmm, Ana's position seems strong at first glance - the classic Joyce 1998 theorem does generalize beyond Brier score to all strictly proper scoring rules. But Kenji's additivity point is sneaky clever. While many proofs assume additivity for simplicity, Predd et al 2009 actually show non-additive proper rules can fail to dominate some incoherent credences. That's a non-obvious technical win for Kenji that even many professionals might miss.

  On the second issue about conditionalization... *scratches head* This is thornier. Ana's right that Greaves & Wallace 2006 proved conditionalizing maximizes expected accuracy for any proper scoring rule. But Kenji's circularity worry has real teeth - the proof does compute expected accuracy using current credences. His "officemate at credence 1" example perfectly illustrates the problem: accuracy-first epistemology seems silent for coherent but dogmatic agents.

  Wait, Ana's response about incoherent agents being the target feels incomplete. She's correct that dominance arguments primarily police coherence, but Kenji's deeper point is that accuracy alone doesn't solve the "which coherent function?" problem. And her "deference is built-in" reply risks begging the question - why should future you defer to current you's expectations? That's exactly what evidential norms are meant to justify.

  *Pauses to check literature* Ah, this touches on the "internalism/externalism" rift in accuracy-first epistemology. Briggs and Pettigrew have good papers on this. Kenji's right that the expected accuracy justification presupposes epistemic conservatism, but Ana's also right that rejecting current credences as guides would make accuracy-seeking impossible. There's no clean resolution here - it's a fundamental tension.

  For the verdicts: Kenji clearly wins the additivity point (high confidence), Ana narrowly wins on expected accuracy justifying conditionalization (medium confidence), but Kenji scores on the limitations of the approach (high confidence). The real missing piece is recognizing that accuracy arguments need supplementation - perhaps with deference principles or epistemic consequentialism - to fully ground norms. My least confident point is whether Ana's "deference as constitutive" reply holds water; that's still hotly debated in recent journals.

  User seems sophisticated - they'll appreciate me flagging that the circularity objection is where the debate currently lives in professional circles. Should emphasize that both make valid points but oversimplify the broader landscape.
answer: |-
  Here's a move-by-move adjudication of the Ana-Kenji debate, with verdicts, confidence levels, and flagged weaknesses. The core tension lies in the *scope* and *foundations* of accuracy-first epistemology.

  **The Dominance Argument & Scoring Rules**

  1.  **Ana's Opening:** "Any proper scoring rule supports the dominance argument for probabilism (incoherent credence functions are accuracy-dominated). Therefore, accuracy alone justifies probabilism without pragmatic assumptions."
      *   **Verdict:** **Mostly Correct, but Oversimplified.**
      *   **Confidence:** High (90%).
      *   **Reasoning:** The core insight is sound. James M. Joyce's 1998 theorem (and subsequent generalizations like Predd et al., 2009) establishes that for any *strictly proper* scoring rule, *every* incoherent credence function is accuracy-dominated by *some* coherent one. This *does* show that probabilism is a requirement of accuracy-domination avoidance, independent of any specific measure like the Brier score.
      *   **Ana's Oversimplification (Kenji's First Worry):** She glosses over the structure required for the dominance argument to hold *in full generality*. Kenji is right to flag this.

  2.  **Kenji's First Worry:** "The full dominance theorem requires the scoring rule to be *additive* (summing individual proposition scores). Drop additivity, and dominance can fail. The argument assumes more than just propriety."
      *   **Verdict:** **Correct.**
      *   **Confidence:** High (95%).
      *   **Reasoning:** Kenji is spot on. The seminal Joyce (1998) result assumes additivity (separability). Predd et al. (2009) generalized dominance to *separable* (additive) strictly proper scoring rules. Crucially, they showed that for *non-separable* strictly proper scoring rules, it's possible to have incoherent credence functions that are *not* dominated by any coherent one. Ana is correct that *many* (additive) proper scoring rules work, but Kenji is right that *any* proper scoring rule isn't sufficient; **additivity/seperability is a necessary assumption for the dominance result she cited.** This is a subtle but crucial technical point often glossed over. Ana claimed "any proper scoring rule"; Kenji correctly identified the hidden additivity requirement.

  3.  **Kenji's Second Worry (Dominance Weakness):** "Dominance is too weak. It only rules out options beaten in *every* world. It says nothing about *which* coherent credence function you *should* have given your evidence. Where do other norms (like conditionalization) come from?"
      *   **Verdict:** **Correct and Insightful.**
      *   **Confidence:** High (95%).
      *   **Reasoning:** Kenji identifies a fundamental limitation of the dominance argument. It successfully diagnoses incoherence as an accuracy flaw but provides *no guidance whatsoever* for choosing among the vast set of coherent credence functions. It's purely a coherence norm. This sets up the core dispute about updating.

  **Expected Accuracy & Conditionalization**

  4.  **Ana's Response (Expected Accuracy):** "Maximize expected accuracy! Conditionalizing on evidence maximizes expected accuracy relative to *any* proper scoring rule. Accuracy gives you updating too; no separate evidential norm needed."
      *   **Verdict:** **Correct on the Theorem, But Overstates the Foundational Role.**
      *   **Confidence (on theorem):** High (90%). **Confidence (on foundational role):** Medium (60%).
      *   **Reasoning:** Ana is correct about the mathematical result (Greaves & Wallace, 2006). For any strictly proper scoring rule, the updating rule that *maximizes expected accuracy* (as calculated with your *prior* credences) *is* conditionalization. This is a powerful and important theorem.
      *   **The Issue:** Kenji's next point exposes why this doesn't *fully* answer his worry at the foundational level Ana claims. The theorem tells you what *is* expected-accuracy maximizing; it doesn't necessarily tell you why you *should* care about maximizing expected accuracy *from your prior perspective*, especially if your prior is flawed.

  5.  **Kenji's Circularity/Objection:** "Maximizing expected accuracy is circular! Your current coherent credences already expect themselves to be best. It can't tell you to change. 'Maximize expected accuracy' presupposes deference to your current self, which is the very thing needing justification. It's vacuous for coherent agents (like the overconfident officemate) and can't criticize them."
      *   **Verdict:** **Largely Correct on the Foundational Challenge.**
      *   **Confidence:** High (85%).
      *   **Reasoning:** Kenji puts his finger on a deep and persistent challenge for accuracy-first epistemology:
          *   **Coherent Self-Expectation:** Any coherent credence function *does* assign itself the highest expected accuracy relative to any strictly proper scoring rule (this follows from propriety). So, if you're coherent, "maximize expected accuracy" *endorses your status quo*. It doesn't push you to change *even if you're wrong*. Your officemate at credence 1 *does* expect credence 1 to be maximally accurate.
          *   **The Deference Presupposition:** The expected accuracy calculation for *future* actions (like how to update *after* learning E) is *always* conducted using the *current* credences. The norm "Choose the update that maximizes expected accuracy *by your current lights*" fundamentally builds in **deference to one's current epistemic state** as a primitive. Kenji is right: this deference principle ("take your current credences as seriously authoritative guides for future accuracy-seeking") is **not itself derived from accuracy considerations alone**. It's an additional normative commitment. Accuracy-first needs it to get updating off the ground, but it doesn't ground it solely in accuracy.

  6.  **Ana's Defense (Caring about Accuracy):** "Deference isn't extra; it's *what caring about accuracy consists in*. Your current credences are your best estimate; using anything else is arbitrary. The norm speaks to the incoherent; it's not vacuous for them."
      *   **Verdict:** **Partially Correct but Doesn't Fully Address Kenji's Worry.**
      *   **Confidence:** Medium (65%).
      *   **Reasoning:**
          *   **Incoherent Agents:** Ana is correct that the expected accuracy norm *isn't vacuous* for the incoherent. An incoherent agent, calculating expected accuracy using their *own* (incoherent) credences, *will* be told to adopt a *different* credence function – one that is coherent and maximizes expected accuracy *by their flawed lights*. This *can* drive them towards coherence (though the path might be complex).
          *   **Deference as Constitutive?** Ana's claim that deference to current credences is "what caring about accuracy consists in" is a *substantive philosophical position* (a form of epistemic internalism or perspectivism). While it's a coherent view held by many accuracy-firsters (e.g., Schoenfield, Pettigrew), **Kenji is right that this is *not* a *consequence* of accuracy-domination arguments or the definition of accuracy itself.** It's a separate commitment about *how* accuracy considerations should guide rational agents *over time*. Kenji's question "Why *should* my future self defer to my current, potentially misguided, expectations about accuracy?" remains valid. Ana asserts this deference is constitutive; Kenji asks *why* it should be.

  **Overall Verdicts & What's Missing**

  *   **Dominance/Scoring Rules:** **Kenji wins this round decisively.** He correctly identified the crucial (and often unstated) additivity/seperability assumption needed for the dominance result Ana cited. Ana was right about the broad applicability but wrong about the "any proper scoring rule" claim without qualification.
  *   **Expected Accuracy/Conditionalization:** **Kenji wins the deeper foundational point.** While Ana is correct about the mathematical theorem linking conditionalization to expected accuracy maximization, Kenji successfully exposes that the accuracy-first justification for conditionalization *presupposes* a principle of deference to one's current credences that is not itself derived purely from accuracy considerations or dominance avoidance. This deference principle is doing essential justificatory work.
  *   **Ana's Strength:** Ana correctly emphasizes that the norms *do* have bite for incoherent agents and that the expected accuracy framework provides a unified justification for both coherence and updating *once the deference principle is granted*. She's right that rejecting deference leaves accuracy-seeking seemingly unmoored.
  *   **Kenji's Strength:** Kenji excels at identifying hidden assumptions (additivity, deference) and the limitations of the arguments (weakness of dominance, inability of expected accuracy to criticize coherent but wrong priors). His officemate example is potent.

  **What Both Are Missing (Or Underemphasizing):**

  1.  **The Role of Evidence:** The debate focuses heavily on credences and scoring, but the *input* of evidence is somewhat backgrounded. Conditionalization requires *learning* E *with certainty*. How evidence justifies this certainty (or how Jeffrey conditionalization handles uncertain evidence) and how evidence interacts with accuracy goals is complex and not fully resolved by either side here. Accuracy-first needs a story about how evidence impacts accuracy goals beyond just via conditionalization.
  2.  **The "Which Coherent Function?" Problem:** Kenji rightly points out dominance doesn't solve this. Expected accuracy *can*, *but only relative to a prior*. The deeper question Kenji hints at ("What makes my credences rational given my evidence?") points towards the need for *evidential norms* or *calibration norms* (like the Principal Principle) *in addition to* coherence and conditionalization. Accuracy-first attempts to ground these too (e.g., via chance-dominance arguments), but these are even more contested and introduce further complexities/debates (like the "Bronfman objection") not touched on here.
  3.  **The Status of the Deference Principle:** They circle around it (Ana asserts it, Kenji demands justification) but don't engage deeply with arguments for or against it within accuracy-first (e.g., Schoenfield's instrumental convergence arguments vs. externalist critiques). Is it a pragmatic requirement for agency? A conceptual truth about epistemic rationality? An unavoidable presupposition? This is the heart of the stalemate.

  **Confidence Summary & Weakest Point:**

  *   **Highest Confidence:** Kenji's point about the additivity requirement for dominance (95%). The Predd et al. result is clear.
  *   **High Confidence:** Kenji's point about dominance being weak (95%) and about the deference presupposition in expected accuracy (85%).
  *   **Medium Confidence:** Ana's point about deference being constitutive of accuracy-seeking (65%). This is philosophically contentious and the core of their stalemate. It's where the debate currently lives in the literature.
  *   **Least Confident Point:** **Ana's claim that deference to current credences is constitutive of accuracy-seeking (Confidence: 60-65%).** This is the fulcrum of their disagreement about updating, and it's deeply philosophical. While it's a defensible internalist position, Kenji's externalist worry ("But my current self might be *wrong*! Why should my future self listen to it *just because* it's current?") feels intuitively powerful. Arguing that *any* alternative would be "arbitrary" (as Ana does) is persuasive to some but not to others. This point connects to fundamental debates about epistemic rationality, internalism vs. externalism, and the nature of guidance. **This is where the adjudication feels most like choosing a side in an ongoing, unresolved philosophical debate rather than declaring a clear technical winner.** Kenji identifies a genuine presupposition; Ana offers a plausible but not universally accepted rationale for it. Neither fully resolves the tension for the skeptic.
