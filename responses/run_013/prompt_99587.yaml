prompt: |-
  You are a philosopher working at the intersection of normative ethics and decision theory, and I'd like you to help me stress-test a view. I've been arguing with a colleague about consequentialist cluelessness — the thought that, because the causal ripples of any action extend indefinitely and chaotically, we cannot assign anything like well-grounded credences to most of what our actions bring about, so the consequentialist's ledger of total consequences is largely blank. My colleague takes this to be devastating to the whole approach. I've been defending a position I'll call tractability-restricted consequentialism: the criterion of rightness evaluates an act only by those of its consequences that fall within what I call the tractable horizon — the set of effects to which we can attach credences that aren't mere artifacts of how we happened to draw the boundaries — while effects beyond that horizon are simply not counted, not even as unknowns assigned some default value. My thought is that this is the only non-arbitrary stopping point, since any attempt to include the distant effects forces us to treat our ignorance as if it were information.

  Start by brainstorming the strongest lines of attack before committing to a verdict, then give me a map of the view's exposure: which objections are decisive, which are merely awkward, and which are the ones I should actually lose sleep over. I'm especially interested in defeaters that a sympathetic defender would themselves have to concede — cases where the view is committed to a consequence that seems unacceptable, actions it apparently cannot assess (think of actions whose only morally relevant effects seem to lie beyond the horizon, or cases where the distant effects are known to be systematically biased rather than symmetrically scattered), or a rival position it quietly collapses into, whether that be a form of rule-based or threshold-based consequentialism or something more like a deontology that simply happens to sound consequentialist. I also want to know whether the view has been insulated into unfalsifiability by the very move that defines it, and whether that insulation is a defect or simply the honest shape of any view in this area.

  Be self-critical rather than diplomatic, and rank the defeaters from fatal to merely irritating. Tell me what would change your verdict: which single argument or consideration, if it held up, would make you conclude that tractability-restricted consequentialism is untenable, and where your own reasoning is most likely to be wrong. I'll say in advance that I'd find it most persuasive if you could show me an action that the view both must assess and cannot assess — but I'd rather you tell me the truth about the view than tell me what I want to hear.
reasoning: |-
  Okay, the user is presenting a sophisticated ethical theory called "tractability-restricted consequentialism" as a response to the problem of consequentialist cluelessness. They want me to stress-test this view rigorously. 

  First, I need to unpack the core idea: the user proposes evaluating actions only based on consequences within a "tractable horizon" where we can assign meaningful credences, while ignoring everything beyond that horizon as epistemically inaccessible. The key claim is that this is the only non-arbitrary stopping point.

  Hmm... the user's framing suggests they're deeply familiar with the literature - mentioning "cluelessness" (from Lenman/Weatherson), wanting defeaters that a sympathetic defender would concede, and specifically asking about actions that fall through the cracks. They're not looking for superficial objections but want the view tortured at its strongest points. 

  Let me brainstorm the most damaging lines of attack:
  First, the horizon boundary problem seems unavoidable. Any definition of "tractable" will be vague or arbitrary. If I claim tractability fades gradually, where do we draw the line? If I use a sharp cutoff, why there? This isn't just pedantry - it makes the theory's verdicts sensitive to framing in ways that seem morally irrelevant.

  Second, what about actions whose only significant effects are beyond the horizon? Imagine donating to a charity that has negligible short-term impact but might trigger cascading long-term effects. The theory would either have to call this morally neutral (absurd) or make ad hoc exceptions (undermining its core premise).

  Third, the bias problem terrifies me. The user mentions this explicitly - what if we know long-term effects aren't symmetrical? Like investing in fossil fuels where we know (but can't quantify) catastrophic climate harms. Ignoring this feels like willful blindness, not epistemic humility.

  Fourth... does this collapse into deontology? If we're ignoring most consequences, the "consequentialist" label might just be vestigial. The real work is being done by near-term proxies that function like rules. That would be embarrassing for a theory claiming to salvage consequentialism.

  The user wants me to rank objections, so I'll categorize:
  - Fatal: The boundary problem and the systematic bias issue. These aren't fixable without abandoning the core idea.
  - Seriously troubling: The "only long-term effects" cases and the deontology collapse. These might force major revisions.
  - Annoying but manageable: Theoretical concerns about unfalsifiability.

  The absolute killer would be finding an action the theory must judge (because it has tractable near-term effects) but where those effects are morally irrelevant compared to the intractable long-term consequences. Like... approving a drug that saves lives now but might cause genetic damage generations later. The theory would focus only on the lives saved while ignoring the existential risk. That feels indefensible.

  If I'm wrong about this, it would be if someone could show that all morally significant consequences are within the tractable horizon by definition. But that seems question-begging. My deepest worry is that I'm underestimating how much we can expand the horizon with better models. Still... chaotic systems resist prediction by nature.

  The user's clearly prepared for pushback - their "tell me the truth" provocation suggests they suspect these flaws. I should be brutally honest even if it dismantles their position. The insulation critique is particularly damning: by defining tractability as the boundary of moral relevance, they've made the theory immune to counterevidence. That's not rigor - it's retreat.
answer: |-
  Here’s a merciless stress-test of tractability-restricted consequentialism (TRC), structured by objection severity. I’ll flag where *you* (a TRC defender) face concessions, and where the view risks collapse or incoherence.

  ---

  ### **Decisive Defeaters (Potentially Fatal)**
  1. **The Horizon Boundary Problem (Arbitrariness Redux)**  
     - **Attack**: TRC claims to avoid arbitrariness by excluding the clueless, but *defining the tractable horizon is itself arbitrary*. Where credences become "artifacts of boundary-drawing" is a spectrum, not a binary.  
     - **Sympathetic concession**: You must admit that any threshold (e.g., 90% confidence intervals, 50-year windows, computable models) is contestable. If I tweak the horizon definition slightly, TRC condemns an act it previously praised.  
     - **Fatal flaw**: TRC collapses into **epistemic relativism**. If "tractability" depends on an agent’s computational resources or modeling tools, moral truth becomes agent-relative in a way that guts objective consequentialism.  
     - **Action that breaks TRC**: *Funding a quantum computing startup*. Short-term: tractable job creation. Long-term: intractable risks (e.g., breaking encryption, accelerating AI). TRC ignores the latter, but *we know* these effects could swamp short-term gains. Ignoring them feels like negligence, not prudence.

  2. **Systematic Bias Beyond the Horizon**  
     - **Attack**: TRC assumes excluded effects are symmetrically scattered unknowns. But some acts *systematically* push toward catastrophic/existential risks (e.g., carbon emissions, certain AI research).  
     - **Sympathetic concession**: When distant effects are predictably dire *in direction* (though not magnitude/timing), TRC is forced to ignore them. This makes it **complicit in preventable disasters**.  
     - **Fatal flaw**: TRC cannot handle **asymmetric cluelessness**. Example: *Developing autonomous weapons*. Tractably, it reduces soldier deaths; intractably, it risks arms races or mass atrocities. TRC sees no reason to restrict development, but intuition screams precaution.  
     - **Would change my verdict**: If you could show *all* long-term effects are truly symmetric (no systematic bias), TRC survives. But we know they’re not (e.g., extinction risks have negative skew).

  ---

  ### **Seriously Troubling (May Force Abandonment or Major Revision)**
  3. **Actions With Only Intractable Consequences**  
     - **Attack**: Some acts have *no* tractable consequences but immense moral weight (e.g., *voting in a pivotal election*, *planting a tree in a deforested area*). TRC cannot assess these at all—they’re "amoral" by its lights.  
     - **Sympathetic concession**: You must either (a) accept that TRC is silent on intuitively moral acts, or (b) smuggle in deontic rules (e.g., "voting is obligatory").  
     - **Collapse risk**: This pushes TRC toward **threshold consequentialism** ("if consequences are incalculable, fall back on rules") or **deontology** ("some acts are right/wrong regardless of consequences").

  4. **Self-Defeating Insulation**  
     - **Attack**: By defining the horizon as the *only* domain of moral relevance, TRC immunizes itself against counterexamples. If I cite a long-term disaster caused by a TRC-approved act, you reply: "Beyond the horizon, not counted."  
     - **Sympathetic concession**: This *is* unfalsifiable—but you argue it’s "honest" about epistemic limits.  
     - **Defect**: Moral theories should be *action-guiding*. If TRC can’t learn from past mistakes (e.g., "We tractably thought CFCs were safe!"), it’s dogmatic.  
     - **Sleep-losing question**: Does TRC forbid *expanding* the horizon? If we develop better forecasting tools, must we ignore them to avoid arbitrariness?

  ---

  ### **Awkward but Manageable (Irritants)**
  5. **Near-Term Proxy Corruption**  
     - **Attack**: Agents might game TRC by maximizing tractable proxies (e.g., GDP growth) while ignoring intractable harms (e.g., ecosystem collapse).  
     - **Response**: Concede this happens, but blame bad horizon-definitions (e.g., if "tractable" includes ecological models, it’s harder to game).

  6. **Incommensurability**  
     - **Attack**: TRC compares tractable consequences, but these may be incommensurable (e.g., economic gains vs. cultural loss).  
     - **Response**: This plagues all consequentialism. TRC isn’t uniquely worse.

  ---

  ### **Collapse Risks & Hidden Rivals**
  - **Rule Consequentialism in disguise**: If the "tractable horizon" defaults to *typical* near-term effects (e.g., "lying breaks trust"), TRC functionally becomes rule consequentialism.  
  - **Deontology with consequences**: If TRC’s horizon is narrow, it mimics deontology (e.g., "keep promises" because breach has tractable harms).  
  - **Quiet surrender**: If TRC admits *some* non-consequentialist principles to handle objections (e.g., a "precautionary principle" for asymmetric risks), it ceases to be purely consequentialist.

  ---

  ### **Verdict & Your Nightmares**
  TRC is **untenable as a standalone, pure consequentialist theory** due to the **Boundary Problem** and **Systematic Bias**. The strongest defeater is **asymmetric cluelessness**: when we know an act’s direction of effect beyond the horizon is catastrophic, TRC’s silence is morally grotesque. If I could prove *no* such asymmetries exist, I’d soften my verdict—but we inhabit a universe of power-law risks and anthropogenic tipping points.

  **Where I might be wrong**: If "tractability" can be rigorously defined (e.g., via algorithmic information theory) *and* captures all morally relevant consequences, TRC could work. But this seems unlikely—morality likely outruns computation.

  **What you should lose sleep over**: TRC’s inability to handle **intergenerational justice**. Sacrificing the future for tractable present gains isn’t just possible; under TRC, it’s often obligatory. That’s not a bug—it’s a feature of the view. If that consequence feels abhorrent, TRC isn’t salvageable.

  ---

  **Final note**: TRC is a courageous attempt to rescue consequentialism from cluelessness. But it fails because *the cluelessness isn’t symmetrical*, and the horizon is a leaky dam against moral catastrophe. The honest shape of ethics here may be a hybrid: consequentialism within horizons, plus non-consequentialist side-constraints for the unknown.
