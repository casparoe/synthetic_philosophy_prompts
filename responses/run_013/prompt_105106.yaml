prompt: |-
  I teach an advanced undergraduate seminar on induction and concept formation. There are sixteen students, the session is ninety minutes, and most of them have already met Hume's problem of induction and Goodman's grue in lecture and can recite the standard responses. What they have never done is try to induce a concept themselves from a handful of examples under conditions where the examples genuinely underdetermine the answer, so that they can feel the pull of a rule that fits everything in front of them and the vertigo of realizing that fitting is not the same as being right. I want to build the session around Bongard-style problems, in which a set of figures is divided into two groups and the solver must find the concept that separates them, and I want the concept to be discovered in the doing rather than announced.

  Design the activity. Give me the rules, the materials, the timeline, and the debrief, with the following requirements.

  Materials and construction: everything must be buildable by me in an afternoon without artistic skill, so specify how I compose the figure sets from a small fixed library of shapes, dots, lines, and enclosures, and how many problems I need. For each problem, state the intended concept in plain words, and for the one problem that carries the session, state both the intended concept and the simpler feature-count rule that fits all twelve training cards equally well, together with a held-out card on which the two rules disagree. Build the set so that a majority of teams will adopt the simple rule and be wrong on the held-out card, and so that the correct concept, once seen, feels obvious and they cannot reconstruct how they missed it.

  Structure: an individual warm-up on one easy problem; then teams of three or four; then the reveal with the held-out card; then a construction round in which each team authors a problem and a rival team must recover its concept. The construction round is essential, because I want them to run into the gap between possessing a concept and being able to transmit it in twelve cards, and to notice how easily a fair-looking problem turns out to have several admissible readings.

  Incentives: a scoring scheme that does not need real money, rewarding teams for committing to a concept after as few examples as possible and penalizing confident generalizations that fail on the held-out card, so that asking for more examples is a real cost rather than a free move. Tell me how the bids or scores should work, and how to keep the competition from swamping the point.

  Debrief: map each phase onto the conceptual content I am trying to convey. I want them to leave seeing the difference between a hypothesis that accommodates the data and one that is projectible; the role of a prior bias toward simple or natural generalizations, and the fact that this bias is doing the work the examples cannot; the idea that solving these problems involves a change in how the figure is represented rather than a search over the original features; and the temptation of a grue-style alternative that matches every card shown and predicts something absurd for the next one, which I want planted deliberately so that someone can raise it and we can see why it feels like cheating. Hold back the vocabulary until the debrief; they should not hear the names of the positions until they have felt the problem.

  Then tell me, honestly, what will predictably go wrong the first time I run this, how to handle each failure, and which features of the underlying idea the activity cannot reproduce and that I will have to supply myself in the closing minutes.
reasoning: |-
  We are designing an activity for an advanced undergraduate seminar on induction and concept formation. The goal is to have students experience the underdetermination of concepts by examples and the difference between fitting the data and being projectible. We'll use Bongard problems as the basis.

  Materials and Construction:
  - We'll create the figures using a fixed library: 
    Shapes: circle, square, triangle (all same size, solid colors)
    Dots: small solid circles (black)
    Lines: straight lines of fixed length (black)
    Enclosures: circles, squares (dashed lines) that can enclose other elements.

  Each figure is drawn on a 3x3 grid (to standardize positioning) and can contain multiple elements. We'll create two sets of Bongard problems: a warm-up set and the main set.

  Total problems needed:
  - One warm-up problem (for individuals)
  - One main problem (for teams, with the underdetermination and a held-out card)
  - Plus materials for the construction round (each team creates one problem, so we need at least 4 problems worth of materials for 4 teams? Actually, we can have teams create problems on the spot with given materials, so we just need enough blank cards and elements for them to create)

  We'll design two problems for the warm-up and main activity. The warm-up is straightforward. The main problem is designed so that a simple feature-count rule fits all training cards but fails on the held-out card, while the correct concept (which requires a representational shift) is projectible.

  Warm-up Problem (Individual):
  - Concept: "Contains a triangle"
  - Left side (6 cards): each card has at least one triangle (and possibly other shapes, dots, lines, etc.)
  - Right side (6 cards): no triangle (only circles and squares, and other elements)

  Main Problem (Team Activity):
  - Intended Concept: "There is a shape that is both enclosed and has a dot inside it" (or equivalently, "there exists an enclosed shape that contains a dot"). We call this the "enclosed-dot" concept.
  - Simpler feature-count rule that fits: "Total number of dots is odd" (or even, but we'll design so that odd fits the left and even the right in the training set, but then the held-out card will break it).

  How we design the training set (12 cards: 6 left, 6 right) for the main problem:

  Left side (positive for the intended concept): 
    Each card must have at least one enclosed shape that has a dot inside it (so the dot is inside the shape and the shape is enclosed by a dashed enclosure). Additionally, we can have other elements. We design so that the total number of dots is always odd (to fit the simple rule).

  Right side (negative for the intended concept): 
    No enclosed shape has a dot inside it. We design so that the total number of dots is even (so the simple rule holds: left=odd, right=even).

  Held-out card:
    We design a card that has the intended concept (so it should be on the left) but has an even number of dots. Thus, the simple rule (odd=left, even=right) would place it on the right, but the intended concept places it on the left.

  Alternatively, we could have the held-out card break the simple rule in the opposite way: no enclosed dot (so right) but odd number of dots. But we want the held-out card to be positive for the intended concept and negative for the simple rule to show that the simple rule fails.

  So let's do:
  Held-out card: 
    It has an enclosed shape (say a circle) with a dot inside it, and then one other dot somewhere not enclosed (so total dots: 2 -> even). Thus, the intended concept says left, but the simple rule (odd=left, even=right) says right.

  We must design the training set so that the simple rule (odd=left, even=right) holds for all 12 cards. We also want the intended concept to hold: every left card has at least one enclosed dot, and no right card has an enclosed dot.

  Examples:

  Left cards (6 cards, each with at least one enclosed dot and odd total dots):
  1. One enclosed circle (dashed circle around a solid circle) with a dot inside the solid circle. Total dots: 1 (odd).
  2. Two enclosed shapes: a square and a triangle, each with a dot inside. Total dots: 2 (even) -> but we need odd. So we add one more dot outside: total 3 (odd). Now the intended concept holds (two enclosed dots, but we only need one) and total dots=3 (odd).
  3. ... (we design similarly)

  Right cards (6 cards, no enclosed dot, and even total dots):
  1. One circle (not enclosed) with a dot next to it (so the dot is not inside any shape). Total dots: 1 (odd) -> but we need even. So we add a second dot: two dots, both outside any shape? But then total dots=2 (even). But we must ensure that there is no enclosed shape with a dot inside. We can have a shape that is enclosed but without a dot? That's acceptable as long as the dot is not inside the enclosed shape. Alternatively, we can have no enclosures at all? Let's do:
     - Card: two circles (solid, not enclosed) and two dots (each outside the circles). Total dots=2 (even). No enclosed dot (since no enclosures) -> correct for right.
  2. ... 

  We design 12 such cards (6 left, 6 right) that satisfy both the intended concept and the simple rule (odd/even). Then we design the held-out card as described.

  Structure and Timeline (90 minutes total):

  1. Introduction (5 min): Explain the activity and the rules. Emphasize that the goal is to figure out the rule that divides the figures into two groups. They will work individually first, then in teams.

  2. Warm-up (10 min): 
     - Each student gets a sheet with one easy Bongard problem (6 left and 6 right). They work individually to figure out the rule (which is straightforward, e.g., "contains a triangle").
     - After a few minutes, they share their answers. Then reveal the rule.

  3. Team Activity: Main Problem (25 min):
     - Form teams of 3-4 (about 4 teams for 16 students).
     - Each team gets the 12 training cards (6 left, 6 right) for the main problem, shuffled and without labels (so they don't know which are left and which are right). They must figure out the rule that separates the two groups.
     - The scoring system (see below) is introduced: they can request to see an example (one card at a time) and must bid how many more examples they think they need to commit to a rule. They are penalized for incorrect rules and rewarded for committing early.
     - They work together to form hypotheses and can request to see the next card (each request costs points). After they commit to a rule, they write it down.

  4. Reveal with Held-out Card (10 min):
     - Each team states their rule and predicts for the held-out card (which they haven't seen). The held-out card is then revealed and the true rule (intended concept) is explained.
     - Teams that used the simple rule (odd/even) will be wrong on the held-out card. The intended concept (enclosed dot) will be explained.

  5. Construction Round (25 min):
     - Each team creates their own Bongard problem. They must define a concept (not too simple) and create 12 cards (6 left and 6 right) that illustrate it. They can use the same library of shapes, dots, lines, and enclosures. They also create one held-out card that fits their concept but might break a simple alternative.
     - Then teams swap problems. Each team tries to solve the problem created by another team. They have limited time (10 min to create, 10 min to solve, then 5 min for quick reveals).

  6. Debrief (15 min): 
     - Map the phases to the conceptual content (see below).

  Scoring and Incentives:
  - Each team starts with 100 points.
  - At any time, a team can request to see a new example (a card from the training set, which is then revealed and they are told which group it belongs to). Each request costs 10 points.
  - After seeing some examples, a team can make a bid: they state how many more examples they think they need to commit to a rule. They must pay the bid amount (in points) immediately. Then they see that many examples (without paying the per-example cost). After seeing those, they must commit to a rule and write it down.
  - If the rule they commit to is correct (as per the intended concept), they earn 50 points. If it is incorrect (does not fit all training examples or fails on the held-out card), they lose 50 points.
  - Alternatively, they can commit without a bid: they write the rule and pay no extra cost but also get no bonus. They are then scored on correctness.
  - The goal is to maximize points. The bidding system encourages them to think carefully about when they have enough evidence and to avoid overconfidence.

  Debrief Mapping:

  - Warm-up: Shows that sometimes concepts are easy to induce when the data is clear and the concept is simple. This builds confidence and familiarity with the format.
  - Main Problem: 
     - The underdetermination: the simple rule (odd/even) fits the training data but is not projectible. The held-out card shows that it fails.
     - The intended concept (enclosed dot) requires a representational shift: they must think about relationships (a dot inside a shape that is enclosed) rather than counting features. This highlights the role of representation in concept formation.
     - The feeling of vertigo: when they realize that they had a rule that fit but was wrong, they feel the gap between accommodation and projection.
  - Construction Round: 
     - They experience the difficulty of transmitting a concept with limited examples. They might create a problem that they think is clear, but the solving team finds an alternative rule that fits the same data. This illustrates the gap between possessing a concept and communicating it via examples, and how easily underdetermination arises.
  - Conceptual Content:
     - Phase 1 (Warm-up): Concept formation as pattern recognition when the pattern is obvious.
     - Phase 2 (Main): The problem of underdetermination: multiple rules fit the data. The role of prior bias (they likely went for the simple counting rule). The held-out card as a stand-in for future experience (projection). The representational shift (from counting to relational) as a way to resolve the underdetermination by favoring a more "natural" concept.
     - Phase 3 (Construction): The challenge of communication via examples and the ease of creating underdetermined problems. The gap between concept and evidence.

  Predictable Problems and Handling:

  1. Problem: In the main activity, teams might not discover the intended concept at all and only see the simple rule. 
     - Handling: This is expected. The held-out card will show the failure. Then you can guide them to see the intended concept by asking: "What else could it be? Look for relationships." 

  2. Problem: The bidding system might be confusing or teams might not use it optimally (e.g., they might request too many examples and run out of points). 
     - Handling: Explain the system clearly. Remind them that they can make a bid to lock in a cost for more examples. Also, the point loss for wrong rules is severe, so they must be cautious.

  3. Problem: The construction round might take too long. 
     - Handling: Set strict time limits. Provide pre-drawn grids and a set of elements (stickers?) that they can quickly arrange. Alternatively, have them create the problem by describing it (but that might not be as effective). 

  4. Problem: In the construction round, a team might create a problem that is too hard or too ambiguous, leading to frustration. 
     - Handling: Encourage them to test their problem quickly themselves. Suggest they avoid overly complex concepts. 

  5. Problem: The held-out card in the main problem might be too obvious, or the simple rule might not be the one teams adopt. 
     - Handling: Pilot the main problem with a friend to see if they adopt the simple rule. If not, adjust the examples to make the simple rule more salient.

  What the Activity Cannot Reproduce and Must Be Supplied:

  - The activity focuses on visual concept formation. It does not directly address linguistic or symbolic concepts (like "grue"). You will have to explicitly connect the visual underdetermination to Goodman's grue in the debrief. 
     - In the debrief, you can say: "In this activity, the simple rule (odd/even) is like 'grue': it fits all the data we've seen, but it leads to an absurd prediction for the held-out card (or for future examples). Why do we reject it? Because we have a prior bias toward concepts that are about relationships and properties that are 'natural' (like being enclosed and having a dot) rather than arbitrary (like parity of dot count)."

  - The activity does not explicitly cover the philosophical arguments for and against induction. You will have to tie the experience back to Hume: the gap between past observations and future predictions, and the role of natural biases in filling that gap.

  - The activity does not cover the full range of responses to the problem of induction (e.g., Bayesian approaches, falsificationism). You can mention these in the debrief as alternative frameworks.

  Closing Minutes:
  - Reiterate that the examples alone are never enough; we need a prior bias toward certain kinds of generalizations (simplicity, naturalness, etc.). 
  - Connect to Goodman: the grue example is not just a trick; it reveals that induction requires a notion of projectible predicates, and that projectibility is tied to our conceptual scheme.
  - Note that changing how we represent the data (as in shifting from counting to relational) is a way of bringing our prior biases to bear.

  By the end, the students should have a visceral understanding of the underdetermination problem and the role of prior biases in concept formation and induction.
answer: |-
  ### Activity Design: Induction and Concept Formation Seminar

  #### **Materials and Construction**
  - **Library of Elements** (buildable with basic shapes, no artistic skill needed):
    - **Shapes**: Small identical cutouts (1" diameter) of circles, squares, and triangles (all solid black).
    - **Dots**: Tiny black adhesive dots (3mm diameter).
    - **Lines**: Short straight black lines (1" long, 2mm thick) and cross-shaped "+" marks.
    - **Enclosures**: Dashed-line squares or circles (2"x2", printed on cardstock).
    - **Cards**: 4"x4" white cardstock squares with a 3x3 grid (faint lines) for consistent placement.
    - **Tools**: Glue sticks, scissors, printer. All elements are pre-cut for quick assembly.

  - **Figure Sets** (build in an afternoon):
    - **Warm-up Problem**: 12 cards (6 Group A, 6 Group B).
      - **Concept**: "Contains a cross-shaped line (+)".
      - **Group A**: All have a "+" mark (e.g., square with +, circle with +, etc.).
      - **Group B**: No "+" mark (e.g., lone shapes, shapes with dots/lines but no +).
    - **Main Problem**: 12 training cards (6 Group A, 6 Group B) + 1 held-out card.
      - **Intended Concept**: "A shape is bisected by a line" (e.g., a line cuts through a shape, splitting it visibly).
      - **Simple Feature-Count Rule**: "Total elements (shapes + dots + lines) are even."
      - **Training Set Design**:
        - **Group A (Bisected)**: All have exactly one line bisecting a shape. Total elements *even* (e.g., one bisected circle + one dot = 3 elements? No: circle=1, line=1, dot=1 → total=3? Wait, let's fix:  
          - *Example 1*: Circle bisected by line (shape=1, line=1 → total=2, even).  
          - *Example 2*: Square bisected by line + one dot (total=3? → add a dot: shapes=1, lines=1, dots=2 → total=4, even).  
          - Ensure all Group A cards have even totals and a bisected shape.
        - **Group B (Not Bisected)**: No bisected shapes. Total elements *odd* (e.g., lone shape =1; shape with dot=2? → add a line not touching shape: shapes=1, dots=1, lines=1 → total=3, odd).  
      - **Held-Out Card**:  
        - **Appearance**: A circle bisected by a line (Group A concept), but with a *second* non-bisecting line → total elements = shape(1) + bisecting line(1) + extra line(1) = 3 (odd).  
        - **Conflict**:  
          - Simple rule (even total = Group A) predicts Group B (since 3 is odd).  
          - Intended concept (bisected shape) predicts Group A.  
        - **Psychological Pull**: Teams fixate on counting; the bisection is visually obvious *after* reveal but easily missed during problem-solving.  
    - **Construction Round**: Provide blank cards, element cutouts, and glue sticks for teams to create problems.  
    - **Total Problems Needed**: 1 warm-up, 1 main (+ held-out), and materials for 4 team-created problems.  

  #### **Rules for Students**
  1. **Objective**: Find the rule separating Group A and Group B cards using as few examples as possible.  
  2. **Scoring**: Teams start with 100 points.  
     - **Cost to Reveal a Card**: 10 points (per card requested beyond the initial 2 per group).  
     - **Commitment**: Bid how many *more* cards you need to commit to a rule (e.g., "We bid 2 cards"). Pay the bid amount (e.g., 20 points for 2 cards). After seeing those cards, you *must* state a rule.  
     - **Rewards/Penalties**:  
       - Correct rule (fits all training cards *and* held-out): +50 points.  
       - Incorrect rule: -30 points.  
       - No bid before commitment: No bonus/penalty beyond correctness.  
     - **Incentive**: Bidding low risks penalties; bidding high wastes points. Revealing cards is costly, forcing trade-offs.  

  #### **Timeline (90 Minutes)**
  1. **Introduction (5 min)**: Explain rules, scoring, and goals. Emphasize discovery over speed.  
  2. **Individual Warm-up (10 min)**:
     - Each student gets warm-up problem (12 shuffled cards).  
     - Goal: Find the rule ("contains a +") in 5 minutes.  
     - Reveal and discuss: "How did you confirm your hypothesis?"  
  3. **Team Main Problem (25 min)**:
     - Form teams of 4 (four teams total).  
     - Give each team the 12 training cards (shuffled, no labels).  
     - Teams request cards one-by-one (cost: 10 pts/card), starting with 2 per group (free).  
     - After min. 4 cards, teams can bid (e.g., "Bid 10 pts for 1 more card").  
     - Teams commit to a rule, write it down, and predict the held-out card.  
  4. **Reveal & Held-Out (10 min)**:
     - Teams share rules. Most will state "even/odd totals."  
     - Show held-out card: Their rule fails (predicts Group B), but it belongs to Group A (bisected).  
     - Reveal intended concept. Discuss why the simple rule misled them.  
  5. **Construction Round (25 min)**:
     - Teams create a Bongard problem (10 min): Define a concept (e.g., "shape enclosed by dashed line"), make 6 Group A/B cards.  
     - Swap problems with another team (5 min to solve).  
     - Test with held-out card (5 min): Solvers state rule; creators reveal intended concept.  
  6. **Debrief (15 min)**: Structured discussion (see below).  

  ---

  ### **Debrief: Mapping to Conceptual Content**
  **Phase** | **Experience** | **Conceptual Connection**  
  ---|---|---  
  **Warm-up** | Quick success; rule feels obvious. | Demonstrates "easy" induction when data unambiguously supports one hypothesis (no underdetermination).  
  **Team Main Problem** | Frustration with competing rules; shock when held-out card falsifies their confident hypothesis. | **Accommodation vs. Projectibility**: Their "even/odd" rule *accommodated* all data but wasn’t *projectible* (failed on new data).  
   | Vertigo when bisection rule is revealed—feels obvious in hindsight. | **Representational Shift**: Solving required seeing lines *relationally* (bisecting shapes) not *atomistically* (counting elements).  
   | Tendency to default to feature-counting. | **Prior Bias**: Simplicity (counting) over complexity (relationships) as a default inductive bias, even when it’s wrong.  
  **Construction Round** | Struggles to create unambiguous cards; rival teams find alternative rules. | **Underdetermination in Communication**: Possessing a concept ≠ transmitting it via examples. "Fair" problems admit multiple rules (like grue).  
   | Natural emergence of "grue-like" rules (e.g., "dots inside squares on Tuesdays"). | **Goodman’s Grue**: Students create arbitrary rules that fit data but feel "cheating"—highlighting the need for *natural kinds*.  

  **Key Vocabulary Hold-Back**:  
  - Avoid terms like "projectible," "grue," or "underdetermination" until debrief.  
  - During discussion, name their experiences: "What you felt was **underdetermination**—the data supported multiple rules."  

  ---

  ### **What Will Go Wrong and How to Handle It**  
  1. **Problem**: Teams ignore bidding and hoard cards.  
     - **Handling**: Enforce a "no free looks" rule. After the first 4 free cards, pause to remind them of costs. Award a 5-pt bonus to the first team to bid.  

  2. **Problem**: Main problem is too hard; no team finds the bisection rule.  
     - **Handling**: Pre-reveal, ask: "What relationships might you be missing?" If stuck, show a hint card (e.g., circle bisected by line with no other elements).  

  3. **Problem**: Construction round runs long due to design complexity.  
     - **Handling**: Limit elements (e.g., "Use ≤3 elements/card"). Use timers. Provide a "concept menu" (e.g., "enclosure," "touching elements").  

  4. **Problem**: Held-out card doesn’t surprise teams (they guess the bisection rule).  
     - **Handling**: In the main problem training set, amplify distractions: Add dots/lines to cards to make counting more salient. Ensure no card *only* has a bisected shape (always include extra elements).  

  5. **Problem**: Competition overshadows reflection.  
     - **Handling**: Start debrief with, "Forget points—what did you *feel* when your rule failed?" Use teams’ errors as discussion points ("Team 3’s rule worked here—why not there?").  

  ---

  ### **What the Activity Can’t Reproduce (Supply in Closing)**  
  - **The Grue Intuition**: The activity shows underdetermination but not grue’s temporal arbitrariness. **Supply this**: "In Goodman’s grue, 'green before 2050, blue after' fits all emeralds we’ve seen—but feels wrong. Your 'even/odd' rule was like grue: it fit the data but was unnatural. Why? Because projectibility relies on *time-invariant* properties (like shape relationships) not *gerrymandered* ones (like element counts)."  
  - **Hume’s Problem**: The activity assumes induction is possible with "good" biases. **Clarify**: "Hume showed induction has no logical foundation—we *must* rely on biases like simplicity. But Goodman reveals these biases are cultural/contingent. Your 'bisection' rule felt natural, but might not in a culture that prioritizes counting."  
  - **Bayesian Priors**: The activity implies simplicity is innate. **Note**: "Simplicity isn’t objective—it’s a prior we update. In construction, you saw how your biases shaped what rules you considered."  

  **Final Prompt**: End with, "Next week: Does science avoid grue-like rules? Or is all induction biased?" This primes deeper inquiry.  

  This design balances experiential learning with philosophical depth, using minimal materials. Students confront underdetermination viscerally, ensuring they leave unsettled by how easily "obvious" rules fail—and why that matters for real-world induction.
