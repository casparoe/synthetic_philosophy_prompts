prompt: |-
  Ok so I've been going around in circles with a friend about epiphenomenalism, and I want an actual number out of you rather than another round of vibes. The view I have in mind, stated as precisely as I can: phenomenal properties — the qualitative character of experience, the what-it's-like — are not among the causes of the subject's own behavioural and verbal reports about those very phenomenal properties. So the raw feel of red is along for the ride, but it's the brain stuff underneath that's doing all the pushing, including pushing me to say the word red. My friend thinks this view refutes itself: if my experiences are causally inert, then my judgement that experiences are causally inert was produced by something that has nothing to do with any experience, so it can't be a case of my getting it right for the right reasons, and the same goes for the epiphenomenalist's own assertion of their theory — hence no one could ever be positioned to know it. I keep saying that's a mirror rather than a reductio, because it looks like it cuts against any view on which our reports about X are caused by something other than X, and I'm honestly not sure whether I'm being clever or just slippery. My own credence is probaly around 0.15 but it wobbles depending on how I'm feeling about physicalism that day.

  Give me your credence that the proposition as I've stated it is true. I don't want a bare number, I want it torn into the sub-questions it actually rests on, with a rough probability for each and one line of justification: whether phenomenal properties are non-physical in the first place (and how much work the causal-closure/exclusion argument is doing there), whether inertness follows even granted non-physicalism, whether the self-undermining objection is sound — and if it is, how much that should actually lower your credence that the view is true versus merely making it unassertable, whether introspective judgements about our own qualia track anything at all, and whatever other terms you think belong in the product. Be explicit about how the terms combine and whether they're independent, since I suspect some of them are doing double duty.

  Lay it out like this, please. First a section called Bottom line, one sentence, just the number. Then The decomposition, one bullet per term, each with a number and a single line of why. Then How it combines, a short paragraph walking through the arithmetic and any dependence between terms. Then Sensitivity, a short paragraph naming the one term you're least confident in, how far the final number would move if that term were, say, 0.2 higher or lower, and what evidence or argument would actually shift it.
