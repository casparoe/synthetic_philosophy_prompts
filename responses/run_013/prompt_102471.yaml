prompt: |-
  Im putting together an episode for the science-and-ideas podcast I host, and next weeks guest is a developmental psycholinguist who's been on the nativist side of the language-acquisition fight for about thirty years. What I want the episode to hang on is her own reframing, which she insists the field keeps getting wrong: the poverty of the stimulus was never really a claim about how little language kids hear. It's a claim about search — the space of grammars a child could in principle entertain is so large that no domain-general learner could find the right one in the few years it has. So the poverty is in the hypothesis space, not the input. I want questions that force her to actually defend that rather than just restate it, and I want it to sound like I've read her stuff.

  Eight to ten questions, and I need at least one each on:

  - what the actual input looks like. We now have big corpora of child-directed speech, and the constructions that are supposed to flip the relevant parameters turn out to be vanishingly rare in it. Does the sparseness story survive the corpus counts, or does she quietly retreat to the hypothesis-space version?
  - the distributional-learning reply — kids are demonstrably good at tracking transitional probabilities and chunking — and how she thinks "learned a pattern" differs from "learned a grammar." I suspect that's the line she'll want to draw, so make her draw it.
  - the ideal-learner move: hand a general-purpose Bayesian learner the right priors and it gets the grammar out, and then the whole fight is just about where the priors come from. Is that a concession, or a redescription of nativism in fancier clothes?
  - falsifiability. What would actually count against "the hypothesis space is too big"? If nothing does, she owes me a story about why this is still a scientific claim and not a slogan.
  - the linking problem: even granting innate constraints, how do they hook onto the specific grammatical facts — parameters, features, whatever — without smuggling the grammar back in whole?

  For each of these, give me a follow-up keyed to the answer she's most likely to give, especially the deflections I can see coming — "thats a claim at the computational level, not the algorithmic one," or "you're conflating the data with the trigger." And end on the one I actually want answered: is there any child, any language, any experiment that could make her give up the framing?
reasoning: |-
  Okay, the user is hosting a science podcast and has a guest who's a developmental psycholinguist with a nativist view on language acquisition. The guest has reframed the "poverty of the stimulus" argument, focusing on the hypothesis space being too large rather than the input being insufficient. The host wants pointed questions that challenge this reframing and show they've done their homework.

  First, I need to address the key areas the user mentioned. They want questions on input sparsity, distributional learning, Bayesian learners, falsifiability, and the linking problem. Each question needs a follow-up to prevent deflections. The user anticipates responses like computational vs. algorithmic levels or conflating data with triggers.

  For the input sparsity part, the host mentions that corpora show rare constructions. The guest might argue that it's not about frequency but the trigger's existence. The follow-up should push on how rarity affects learnability without innate constraints. Maybe using examples like subject drop in English vs. Italian.

  Distributional learning: Kids track transitional probabilities. The guest might say this is shallow pattern learning, not grammar. Follow-up needs to distinguish pattern from grammar. Ask for a testable criterion, like recursive structures or binding principles.

  Bayesian learners: If priors lead to grammar, is that nativism in disguise? Guest might call it a redescription. Follow-up should question the origin of priors—evolved or learned? If evolved, it's nativism.

  Falsifiability: What evidence would disprove the hypothesis space being too big? Guest might say successful domain-general learners. Follow-up to specify what such a learner looks like and why current models don't count.

  Linking problem: How do innate constraints connect to specific parameters without preloading grammar? Guest might mention innate feature sets. Follow-up on how features map to language-specific rules without data, using examples like ergativity.

  Ending question: What would make her abandon the framing? Forces a concrete answer, showing openness to counterevidence.

  Need to ensure questions sound informed by her work. Mention specific studies or terms she uses. Anticipate deflections and cut them off with follow-ups. Make it conversational but rigorous, pushing for defense over restatement. The host's deeper need is to have an engaging episode that challenges the guest, revealing new insights rather than rehearsed points. They want to showcase critical thinking and depth, appealing to an audience familiar with the debate.
answer: |-
  Here are 8 rigorously crafted questions designed to push your guest beyond restatement, incorporating your specific points and anticipating deflections. Each includes a targeted follow-up:

  1.  **Core Reframing & Input Sparsity:** "You've emphasized that POS is fundamentally about the *hypothesis space* being too vast for domain-general search, not the *input* being sparse. Yet, critiques often point to corpus studies – like work on auxiliary inversion or anaphoric 'one' – showing the triggering data *is* vanishingly rare in child-directed speech. If the triggering data is genuinely *that* sparse, doesn't that effectively collapse the 'hypothesis space' problem back into an 'input sparsity' problem for any realistic learner?"  
      *   *(Likely Deflection: "Rarity isn't absence; the trigger *exists*." / "The learner only needs the *type*, not high frequency.")*  
      **Follow-Up:** "But if the relevant trigger occurs, say, once in a million child-directed utterances for a specific parameter, doesn't the computational burden of *recognizing* that sparse, noisy trigger amidst the vast hypothesis space *itself* become an insurmountable input sparsity problem without highly constrained search? How does the 'hypothesis space' framing *operationally differ* from an input claim in that scenario?"

  2.  **Distributional Learning & Shallow vs. Deep:** "Children are demonstrably superb at distributional learning – tracking transitional probabilities, identifying chunks and patterns. Proponents like Elman or Christiansen argue this *is* sufficient to acquire core grammatical structures without innate syntactic primitives. Where do you draw the line between a child 'learning a statistically robust pattern' and 'acquiring a grammar'? What specific grammatical phenomenon *cannot*, even in principle, be bootstrapped this way?"  
      *   *(Likely Deflection: "Distributional learning gets surface patterns, not abstract hierarchical structure/syntactic dependencies.")*  
      **Follow-Up:** "But models like RNNs/LSTMs *do* learn hierarchical dependencies from distributional cues. If a model *can* learn to predict grammaticality judgments for complex center-embedded structures or binding principles (e.g., Principle C) purely from distributional input, doesn't that empirically undermine the claim that distributional learning is inherently 'shallow'? What's the *testable signature* of a 'true grammar' that distributional learning fails to capture?"

  3.  **The Ideal Learner & Priors:** "The 'ideal learner' approach in Bayesian modeling shows that a domain-general learner *can* acquire complex grammars if endowed with the *right priors*. Proponents argue this shifts the debate: the core question becomes the origin of those priors – evolved, learned from non-linguistic cognition, or domain-specific. Is this Bayesian reframing a tacit concession that domain-general *learning* is possible with appropriate initial structure, or is it simply nativism (UG) described in probabilistic terms?"  
      *   *(Likely Deflection: "It shows the necessity of *structure*. The priors *are* the innate constraints." / "It's a computational-level description.")*  
      **Follow-Up:** "But if the 'priors' required to make language acquisition tractable for the Bayesian learner are themselves highly language-specific – encoding notions like 'subject', 'object', 'agreement', 'displacement' – haven't we just redescribed UG's parameters or principles as prior probabilities? Doesn't this model *presuppose* rather than explain the origin of the linguistic structures the child ends up with, making it functionally equivalent to nativism?"

  4.  **Falsifiability of the Hypothesis Space Claim:** "The claim that 'the hypothesis space is too large for a domain-general learner' is powerful but potentially unfalsifiable. What specific, observable finding *could* disprove this core tenet of your reframed POS? For instance, if a reliable, purely statistical domain-general learner (algorithmic, not just computational) were empirically demonstrated to acquire the full complexity of human grammar from realistic input, would that falsify it? Or is the claim insulated by definition?"  
      *   *(Likely Deflection: "No such learner exists or is plausible." / "It's a logical argument from computational complexity.")*  
      **Follow-Up:** "Understood, but for it to be a scientific claim, not just a logical assertion, there must be conceivable evidence *against* it. If we stipulate that no current model achieves it, what are the *minimal criteria* for a 'domain-general learner' and 'realistic input' that, *if* it succeeded, *would* force you to abandon the 'too large' claim? What performance on what specific grammatical tasks?"

  5.  **The Linking Problem:** "Granting innate constraints to shrink the hypothesis space, the 'linking problem' arises: how do these innate biases link to the *specific* linguistic features of the ambient language? For example, how does an innate 'Agreement' bias know whether to look for subject-verb agreement (like English), object-verb agreement (like Swahili), or ergative-absolutive agreement (like Basque), without the child essentially needing pre-knowledge of the language's specific grammatical framework? Doesn't solving this linking problem require innate knowledge so specific it functionally *is* the grammar?"  
      *   *(Likely Deflection: "The innate constraints define the *possible features* (phi-features, case), the input provides the values/configuration.")*  
      **Follow-Up:** "But the *configuration* is crucial. How does the innate bias for 'Agreement' guide the learner to identify *what agrees with what* in a novel language? If the innate system provides only a universal set of *potential* features (phi-features), how does it avoid linking them incorrectly without *also* providing innate constraints on their *possible combinatorial structures* (e.g., subject-verb vs. object-verb)? Isn't that combinatorial structure itself a core part of the grammar?"

  6.  **Parameters vs. Emergence:** "Parameter-setting models were a key nativist response to the hypothesis space problem. Yet, corpus studies often fail to find robust evidence for the 'triggers' posited to flip parameters. Further, constructionist and usage-based approaches show how complex syntax can emerge from piecemeal learning. Does the lack of clear triggers and the success of emergence models push you towards a weaker notion of innate constraints – perhaps just architectural biases – rather than specific grammatical parameters or principles?"  
      *   *(Likely Deflection: "Parameters were always an approximation; innate constraints guide learning without literal 'switches'." / "Emergent complexity still requires initial structure.")*  
      **Follow-Up:** "If we move away from explicit parameters to 'architectural biases', how do these biases differ fundamentally from constraints proposed in non-nativist emergentist models (e.g., biases inherent in sequential processing or social cognition)? And if triggers aren't identifiable discrete cues, how does the constrained search *actually operate* algorithmically to converge on the correct grammar?"

  7.  **Comparative Evidence & Domain-Generality:** "Beyond language, humans rapidly acquire complex, structured cultural knowledge (e.g., rituals, tool-making sequences, social norms) that also seems to rely on limited, noisy input. If domain-general statistical and social learning mechanisms *can* acquire these other complex systems, doesn't that weaken the argument that language *specifically* requires innate domain-specific constraints, rather than leveraging powerful general capacities honed by evolution for cultural learning?"  
      *   *(Likely Deflection: "Language has unique properties (discrete infinity, compositionality) those lack." / "Those domains may also involve innate constraints.")*  
      **Follow-Up:** "While unique, are the computational demands of acquiring the *syntactic* aspects of language demonstrably *greater* than acquiring, say, the hierarchical structure and combinatorial rules of complex tool-making sequences observed in some cultures? If we posit innate constraints for those too, doesn't that risk making the nativist claim untestable by broadening UG to cover all complex cognition?"

  8.  **The Existential Question:** "After three decades championing this perspective, what single piece of evidence – a finding from a specific child, a property of a particular language, or a result from a crucial experiment – could, *in principle*, convince you that the 'poverty of the hypothesis space' framing is fundamentally incorrect or unnecessary? What's the scenario that would make you say, 'Okay, I was wrong about *that* core idea'?"  
      *(Force a concrete, falsifiable condition. No deflection allowed here.)*

  **Why this works:**

  *   **Informed Tone:** References specific phenomena (auxiliary inversion, anaphoric 'one', binding Principle C, phi-features, ergativity), computational models (RNNs/LSTMs, Bayesian learners), theoretical positions (constructionist, usage-based), and core problems (linking problem, triggers).
  *   **Forces Defense, Not Restatement:** Each question directly challenges a key implication or vulnerability of her reframing (input sparsity *despite* framing, distributional sufficiency, Bayesian redescription, unfalsifiability, linking problem).
  *   **Anticipates Deflections:** Follow-ups are specifically designed to cut off common nativist rebuttals ("It's computational!" "Triggers exist!" "Priors *are* the constraints!") and push for concrete, operational answers.
  *   **Covers Your Mandates:** Explicitly hits all 5 required points (Input, Distributional, Bayesian, Falsifiability, Linking) plus the existential question.
  *   **Progressive Structure:** Builds from input/data (Q1), through learning mechanisms (Q2, Q3, Q6, Q7), to core philosophical/logical issues (Falsifiability - Q4, Linking - Q5), ending with the personal commitment question (Q8).

  **Delivery Tip:** Frame questions conversationally but precisely. Use phrases like "You've argued that...", "In your [Year] paper on [Topic], you suggested...", "Critics like [Name] counter that... how do you respond?". This signals deep engagement with *her* work specifically. Good luck with the episode!
