prompt: |-
  I spent thirty years as a hydrogeologist before retiring, and I have spent the years since reading political philosophy with more appetite than method. One thing led to another, and I now sit on the steering committee of a citizens' assembly that our metropolitan authority has convened to decide the fate of the Alder aquifer and the river that drains it. Our first business has been to fix the eligibility frame — to settle who belongs to the assembly's electorate, which my reading has taught me to call the boundary problem — and on that question one of my colleagues, a retired administrative-law judge who spent her career on municipal boundary disputes, has been briskly decisive. Her rulings so far:

  1. Residents without legal immigration status, ten years in the area: eligible.
  2. Citizens of the country who have never lived in the area and own nothing there: ineligible.
  3. Sixteen- and seventeen-year-olds: eligible.
  4. Adults under guardianship for advanced dementia: eligible, with facilitation.
  5. Owners of firms inside the area who live elsewhere, are bound by the Authority's rules, and draw their livelihoods from those firms: eligible.
  6. Residents who hold a second citizenship and vote in its elections: eligible.
  7. Residents who have publicly declared that they will not comply with the assembly's decisions: eligible.

  The next category before us is Marrowfield, a town outside the Authority's boundary, downstream. The assembly's decisions will determine whether the river its people drink from and fish is cleaned up or further poisoned, so they are plainly affected; but they are not bound by the assembly's decisions, own nothing inside the area, and are not resident in it. The one complication is that, under a compact their own council signed years ago, the Authority's environmental standards already apply to them in certain respects, so they are subject to the Authority's rules in a way that residents of comparable outside towns are not — though not to the decision now before the assembly.

  Tell me how she will rule. Set out the rules that fit her record, say what each predicts here, give me the bet you would make and your reasons, tell me which of her earlier rulings is the nearest precedent, and name the category that would best force the issue if we ever put it to her. My own instinct is that anyone who will drink the water ought to have a voice in what happens to it; but I have learned to distrust that instinct, and I would rather understand the rule she is running than win the vote.
reasoning: |-
  Okay, let's start by understanding the user's background. He's a retired hydrogeologist with thirty years of experience, now involved in a citizens' assembly deciding the fate of an aquifer and river. He's been reading political philosophy but admits it's more appetite than method. His current role on the steering committee involves figuring out eligibility for the assembly's electorate—the boundary problem.

  The user presents rulings from a colleague, a retired administrative-law judge with experience in municipal boundary disputes. He lists seven specific rulings and then introduces a new case: Marrowfield, a downstream town outside the authority's boundaries. Marrowfield is affected by the assembly's decisions but doesn't meet typical criteria like residency or ownership within the area. The complication is they're subject to some of the Authority's environmental standards due to a past compact, but not the specific decision at hand.

  The user wants to predict how the judge would rule on Marrowfield. He needs the underlying rules from her past decisions, the prediction, a bet with reasons, the closest precedent, and a category that would force the issue. He mentions his instinct that those affected should have a voice but distrusts it, prioritizing understanding the judge's approach over winning the vote.

  First, I need to extract the implicit rules from the judge's seven rulings. Let's go through each:

  1. **Undocumented residents, 10+ years in area: Eligible.** Rule here seems to be based on long-term residency despite legal status. Presence and duration matter more than citizenship.
     
  2. **Citizens never lived/owned in area: Ineligible.** Absence of physical connection or stake in the area excludes them, even if they're citizens.
     
  3. **16-17 year-olds: Eligible.** Age isn't a barrier; participation is inclusive beyond typical voting ages.
     
  4. **Adults under guardianship for dementia: Eligible with facilitation.** Cognitive capacity isn't a barrier; inclusion with support mechanisms.
     
  5. **Business owners outside area but with firms inside: Eligible.** Economic stake and being bound by rules are key here. Livelihood dependency within the area grants eligibility.
     
  6. **Residents with dual citizenship: Eligible.** Multiple political affiliations don't exclude them; local residency is what counts.
     
  7. **Residents who won't comply: Eligible.** Willingness to comply isn't a prerequisite; eligibility isn't conditional on acceptance of outcomes.

  Now, identifying core principles from these:
  - **Rule-Bound Subjection:** Being subject to the authority's rules is crucial (ruling 5).
  - **Presence/Participation:** Physical residency or long-term presence matters (rulings 1, 3, 4, 6).
  - **Stakeholding:** Direct stake in the area, like livelihood or property (ruling 5), but residency can substitute (rulings 1, 3, 4).
  - **Exclusion of External Citizens:** No connection means no eligibility (ruling 2).
  - **Non-Contingency:** Eligibility doesn't depend on compliance or other affiliations (rulings 6, 7).

  For Marrowfield:
  - **Affected?** Definitely, as their water and fishing depend on the river's condition.
  - **Subject to Rules?** Partially, due to the compact. They follow environmental standards in some respects, but not the specific decision being made by the assembly.
  - **Resident?** No, outside the boundary.
  - **Own Property?** No, nothing inside the area.
  - **Stake?** Economic or livelihood? Not mentioned, but they rely on the river. However, similar to ruling 2 where citizens were excluded despite being affected nationally.

  The closest precedent is ruling 5 (business owners). They were eligible because they were bound by the authority's rules and had a livelihood stake. But Marrowfield is only partially bound by existing rules, not the new decisions. Ruling 2 is also relevant; external citizens were excluded despite potential indirect effects.

  The judge's approach seems to require direct subjection to the rules being decided or a tangible stake within the boundary. Marrowfield's partial subjection to existing standards doesn't extend to the assembly's new decisions. Without residency or direct rule application, she'd likely rule them ineligible.

  A category that would force the issue: "Communities with existential dependency but no jurisdictional link." This would challenge the boundaries of rule-boundedness versus affectedness.

  User's instinct about affectedness is understandable but conflicts with the judge's rule-bound framework. The assembly's design likely prioritizes those governed by the decisions, not just impacted.
answer: |-
  Based on your colleague's rulings and her administrative-law background, I'll break this down systematically: first extracting the implicit rules from her precedents, then applying them to Marrowfield, giving my prediction, identifying the closest precedent, and suggesting a test case to force the issue. Her approach centers on **jurisdictional linkage and tangible stake**, not abstract affectation or moral claims.

  ### Rules Implicit in Her Prior Rulings
  Her decisions reveal four non-negotiable principles:
  1. **Rule-Bound Subjection Trumps Affectation**: Eligibility requires being *bound by the Authority's enforceable rules* (Ruling 5: business owners subject to rules are in; Ruling 2: unconnected citizens are out, despite potential indirect effects).  
  2. **Presence/Participation Over Status**: Physical residency or long-term presence supersedes legal status (Ruling 1), age (Ruling 3), or cognitive capacity (Ruling 4).  
  3. **Direct Stake, Not Proxy Claims**: Stake must be personal and immediate—livelihood (Ruling 5), residency (Rulings 1, 3, 4, 6), or property—not ideological or symbolic.  
  4. **Non-Contingency of Compliance**: Eligibility is not conditional on acceptance of outcomes (Ruling 7) or external affiliations (Ruling 6).  

  ### Prediction for Marrowfield
  - **Rule 1 (Subjection)**: Marrowfield is subject to *some* Authority rules via compact (e.g., environmental standards), but **not the specific decisions of this assembly**. This is partial, historical subjection—not ongoing or relevant to the aquifer decision. *Prediction: INELIGIBLE*.  
  - **Rule 2 (Presence)**: No residents, property, or long-term physical ties to the Authority’s area. *Prediction: INELIGIBLE*.  
  - **Rule 3 (Stake)**: Their dependency on the river is real but indirect (water/fishing), not tied to enforceable obligations within the Authority. *Prediction: INELIGIBLE*.  
  - **Rule 4 (Non-Contingency)**: Irrelevant here—no defiance or dual allegiance cited.  

  **My Bet**: She rules Marrowfield **INELIGIBLE** with near-certainty.  
  **Why?**  
  Her record shows zero tolerance for "affectedness" alone (Ruling 2 explicitly rejects this). The compact’s narrow, pre-existing standards don’t equate to being bound by *this* assembly’s decisions. Marrowfield’s lack of residency or direct rule-subjection places them squarely in the "external citizen" category (Ruling 2), not the "embedded stakeholder" category (Ruling 5). Her administrative-law instincts will prioritize jurisdictional clarity over moral claims—if they’re not under the Authority’s *direct governance* for *this issue*, they’re out.  

  ### Nearest Precedent
  **Ruling 5 (External Business Owners)** is the closest but **distinguishes** Marrowfield:  
  - Similarity: Both are outside residents subject to Authority rules.  
  - Difference: Business owners are *directly* bound by the rules *and* derive livelihoods *from within the boundary*. Marrowfield’s compact is limited, passive, and unrelated to livelihoods tied to the Authority’s territory. This makes Ruling 5 a *narrower* precedent favoring exclusion here.  

  ### Category to Force the Issue
  To test her framework, propose: **"Communities with existential dependency but no jurisdictional link."**  
  - Example: *A tribal nation downstream whose sole water source is the river, with no historical compact, no residency in the Authority, and no binding rules.*  
  - **Why it forces the issue**: It pits "affectedness" (your instinct) directly against her "rule-bound subjection" principle. Her record suggests she’d still exclude them, revealing the rigidity of her jurisdictional test. If she *included* such a group, it would undermine her own Ruling 2 and force a philosophical concession.  

  ### A Note on Your Instinct vs. Her Rule
  Your belief—"those who drink the water should have a voice"—aligns with *all-affected principle* theories (e.g., Dahl, Goodin). Her rulings reject this, embracing a *all-subjected principle* (e.g., Song, Abizadeh) focused on governance. She’s building a wall around jurisdictional accountability, not moral concern. In her framework, including Marrowfield would "dilute" the electorate with voices bearing no responsibility for implementation—a classic administrative-law concern. If you want to sway her, argue that the compact *implicitly* binds Marrowfield to *future* Authority decisions (a stretch, given your description), not that they’re affected.  

  Her next move? Likely a crisp: "Marrowfield lacks the requisite territorial nexus. Ineligible."
