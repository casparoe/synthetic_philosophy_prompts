prompt: |-
  I've been reading about Buddhist ethics on and off for a couple of years, with no training in philosophy, and I keep running into a claim that bothers me: that Buddhist ethics and utilitarianism are close cousins, because both are impartial, both take suffering seriously, and both are practical rather than rule-worshipping. I want to test that claim by building a case where they come apart, and I'd rather you build the case than talk around it. What I want is one realistic situation, on the scale of a family, a small clinic, a school, or a workplace, with no trolleys, no bombs, and no science-fictional machinery, in which an act-utilitarian and a Buddhist reach opposite verdicts about whether one particular person should do one particular thing. Three features of Buddhist ethics need to be doing real work, not decorating the story. First, the decisive weight has to fall on the intention behind the act rather than on its outcome, so that the same outward deed is innocent or ruinous depending on what the agent is actually aiming at. Second, the bad consequence that settles the question has to fall on the agent's own mind and character rather than being pooled across everyone affected, so that the greatest total good is simply the wrong currency for the calculation. Third, the path is not a maximizing project: there is a ceiling on what the agent may be asked to trade away, and that ceiling is set by what the agent must keep in order to keep going, not by how much good the trade would produce. Please make sure the disagreement doesn't come out as the Buddhist simply being stricter, and don't let it rest on a flat rule against harming; I want the verdicts to fall out of the three features above.

  Once the case is built, do the bookkeeping. State what the act-utilitarian says and why, state what the Buddhist says and why, and for each verdict name which of the three features is doing the decisive work and what the other two contribute. Then tell me honestly which one feature, if I removed it, would collapse the case back into agreement, and whether the two views would then agree on doing the act or on refraining. I'd also like to know whether the case is fragile in the other direction: if the numbers were nudged, say the harm made somewhat larger or the agent's stake somewhat smaller, does the Buddhist verdict flip before the utilitarian one does, or after?

  Finally, since I suspect I'm the naive one here, tell me how a defender of whichever view comes out worse would attack the case: what they would say I smuggled in, and whether they would reject the setup outright or accept it and bite the bullet. And if any of the three features I named is itself a contested reading of Buddhism rather than a settled commitment, say which one and how much of the result turns on it. One more thing I genuinely can't tell about: whether the case looks different depending on whether the Buddhist in question is working toward the end of their own suffering or has taken the bodhisattva's vow to postpone their own liberation for the sake of everyone else's. If that difference matters, show me where it enters and how the verdict moves; if it's window-dressing, say so and explain why.
reasoning: |-
  Okay, let me tackle this user's query about Buddhist ethics versus utilitarianism. The user wants a realistic scenario where these two ethical frameworks lead to opposite conclusions. They specified three key features of Buddhist ethics: intention over outcome, consequences on the agent's mind, and non-maximizing with a personal ceiling. 

  First, I need to create a scenario that fits everyday life, no trolley problems. A family situation might work best. Maybe a parent facing a tough decision with their child? The example of a parent lying to cover their child's mistake comes to mind. The parent intends to protect the child, but the lie could cause harm. 

  For utilitarianism, the calculation would focus on outcomes. If lying prevents greater harm (like the child being expelled), it might be justified. The net reduction in suffering makes the act utilitarian. 

  But Buddhist ethics would look at intention. The parent's intention is rooted in attachment (trishna), which generates negative karma. Even if the outcome is good, the intention corrupts the parent's character. Also, the personal ceiling: demanding a parent sever attachment completely isn't feasible. The parent needs to maintain their mental state to continue parenting effectively. 

  Wait, the user wants opposite verdicts. So in this case, utilitarian says "lie," Buddhist says "don't lie." But why wouldn't the Buddhist consider the child's suffering? Because the primary harm is to the agent's mind through unwholesome intention. The consequence isn't pooled; it's personal. 

  Now, checking the three features. Intention is key: the same act (lying) is wrong due to attachment. The consequence (karmic residue) affects the agent's mind. The ceiling: asking the parent to overcome attachment here is too much; they need that bond to function. 

  If I remove the personal consequence feature, both might agree on lying if outcomes justify it. The case collapses. 

  Would nudging numbers change things? If the harm were bigger (say, the child faces violence), utilitarianism might still say lie. Buddhist ethics might still say no, but if the harm is extreme, maybe the parent's intention shifts away from attachment? But the user wants no flip. Need to ensure the example's harm level stays where utilitarianism justifies lying, but Buddhist ethics doesn't budge. 

  About the bodhisattva vow: if the parent is a bodhisattva, they might prioritize others' suffering. But in this scenario, the core issue is the intention and self-harm, so the vow might not change much. The act still harms the agent's progress. 

  Critics might argue Buddhism considers compassion, which could justify lying. But the key is the underlying intention—compassion without attachment is hard here. Utilitarians might say the karmic harm isn't real, so only outcomes matter. 

  Is the personal ceiling a contested Buddhist feature? Some schools emphasize compassion over strict non-attachment. If so, the case might weaken. But Theravada and some Mahayana texts support the three features. 

  Finally, the user might be testing if Buddhist ethics is reducible to utilitarianism. The example shows it's not, due to the three features. Need to present all this clearly, step by step.
answer: |-
  Here's a case designed to meet your specifications, focusing on the three features you outlined:

  **The Case: The Nepotistic Hiring Decision**

  **Scenario:** Maya runs a small, understaffed community health clinic in a low-income area. A vital nursing position opens. Two candidates apply:
  1.  **Leila:** A highly qualified, experienced nurse with excellent references, known for compassion and efficiency. She would significantly improve patient care and reduce workload on the overburdened staff. Hiring her maximizes the clinic's positive impact.
  2.  **Sam:** Maya's nephew. He's a recent graduate with decent but unexceptional qualifications and references. He's competent enough for the role but wouldn't bring the same level of skill or efficiency as Leila. He desperately wants this job, feeling immense family pressure to succeed and avoid disappointing his parents (Maya's siblings). Maya knows her sister (Sam's mother) is deeply anxious about Sam finding stable work and will be devastated if he's rejected. Sam might become depressed or discouraged if rejected.

  Maya feels an overwhelming pull to hire Sam. Her *intention* is to relieve her sister's suffering and anxiety, prevent family conflict and disappointment, and spare Sam the pain of rejection. She knows Leila is objectively better for the clinic and its patients, but the thought of causing her sister and nephew such acute distress feels unbearable. She decides to hire Sam.

  **The Verdicts:**

  1.  **Act-Utilitarian Verdict: Hire Sam (or at least, it *could* be permissible).**
      *   **Why:** The utilitarian weighs the total net happiness/suffering reduction. Hiring Sam prevents significant suffering for Sam and Maya's sister (avoiding depression, family conflict, intense anxiety, disappointment). While Leila would provide better patient care, the clinic is currently functioning, and Sam is competent. The *immediate, intense suffering* avoided for Sam and Maya's sister *might* outweigh the *incremental* improvement in patient care and staff workload Leila would bring. The utilitarian calculation pools *all* consequences – the family's suffering is weighted equally with the patients'. If the family suffering prevented is judged severe enough and the patient-care detriment minor enough (Sam *is* competent), hiring Sam *could* maximize total net good in this specific instance ("act-utilitarianism").

  2.  **Buddhist Verdict: Do NOT hire Sam. Hire Leila.**
      *   **Why:** The decisive factor is Maya's **intention (Feature 1)**. Her intention is rooted in *attachment* (to family harmony, her sister's approval, her nephew's success) and *aversion* (to her sister's anxiety and potential family conflict). This intention is fundamentally rooted in clinging (*trishna*) to the well-being of a specific, close group (her family) arising from self-oriented desires (avoiding personal discomfort of conflict, desire for familial approval). Even though the outward act (hiring a competent nurse) isn't inherently wrong, acting from this place of attachment and aversion generates unwholesome karma and reinforces the mental habits of clinging and self-centeredness within Maya. This is the primary **bad consequence (Feature 2)** – the corruption of Maya's mind and character. While causing suffering to patients/staff through suboptimal care is unskillful, the *decisive* harm here is the karmic residue and mental defilement Maya cultivates *in herself* by acting on attachment/aversion. Furthermore, Buddhism **is not maximizing (Feature 3)**. It doesn't demand Maya completely sever familial love instantly (an impossibly high "ceiling" for most). It *does* require her not to actively reinforce clinging and aversion through unskillful action *in this specific context*. The "ceiling" is maintaining her ability to practice skillfully and avoid actively strengthening defilements. Hiring Sam to avoid family discomfort crosses that line; it asks her to trade away the integrity of her intention and action for the sake of appeasing attachment, which she must not do to "keep going" on the path. Hiring Leila, while difficult, is an act rooted in recognizing the broader need (compassion for patients/staff) and resisting the pull of personal attachment.

  **Bookkeeping:**

  *   **Feature 1 (Intention) Decisive:** The Buddhist verdict hinges entirely on the unwholesome nature of Maya's intention (clinging/aversion). If her intention were pure compassion for Sam *without* self-referential attachment/aversion (extremely difficult in this familial context), the act *might* be viewed differently, but that's not the case here.
  *   **Feature 2 (Consequence on Agent) Contribution:** This explains *why* the intention matters so much – the primary negative consequence is the harm to Maya's own mind/karma, not just the suboptimal patient care. This harm isn't pooled.
  *   **Feature 3 (Non-Maximizing/Ceiling) Contribution:** This explains why Maya isn't required to sacrifice *all* familial feeling, but why this specific trade-off (acting on unwholesome intention to prevent family suffering) is unacceptable. It defines the line she must not cross.

  **The Collapse Feature:** Removing **Feature 2 (Personal Consequence)** collapses the case. If Buddhist ethics pooled *all* consequences like utilitarianism (patient care + family suffering + Maya's mental state), the calculation might align with the utilitarian one, potentially justifying hiring Sam if the family suffering seemed severe enough compared to the care deficit. Both views might then agree that hiring Sam *could* be permissible if the net suffering prevented for the family outweighed the incremental suffering caused at the clinic. (Agreement on *possibly* doing the act).

  **Fragility & Nudging:** The case is **fragile in the direction favoring utilitarianism.**
  *   **Buddhist Verdict Flips AFTER Utilitarian:** The Buddhist verdict is relatively stable because the core issue is the unwholesome intention and its self-harm, regardless of the *scale* of the external outcomes. Only a drastic shift in intention (genuinely pure compassion overriding attachment) or an absurdly high demand on the agent (e.g., demanding Maya feel *no* familial love) would flip it – both unlikely with small nudges. The utilitarian verdict, however, is highly sensitive to the numbers. If the harm prevented for the family is made slightly *larger* (e.g., Sam is suicidal) or the harm to the clinic made slightly *smaller* (e.g., Sam is almost as good as Leila), the utilitarian calculus flips *earlier* to more strongly endorse hiring Sam. Conversely, if the clinic harm is made larger (e.g., Sam is incompetent, patients will suffer greatly) or the family harm smaller (e.g., Sam shrugs it off), the utilitarian flips *earlier* to endorse hiring Leila. The Buddhist verdict flips *later* and for different reasons.

  **Defender's Counter-Attack:**

  *   **Utilitarian Attack:** A utilitarian would likely argue the case **smuggles in unrealistic psychology.** They might assert:
      *   The "harm to Maya's mind" is either illusory (karma isn't real) or insignificant compared to the concrete suffering of Sam and his mother.
      *   Maya's intention, while perhaps weak or biased, isn't inherently *evil*; she's trying to prevent real suffering. The utilitarian calculus *does* capture the relevant consequences.
      *   The utilitarian might **bite the bullet:** If hiring Sam truly maximizes net utility in this specific instance, even if motivated by nepotism, then it *is* the right thing to do. The motivation might be regrettable but doesn't negate the good outcome.
  *   **Buddhist Attack (if defending the utilitarian reading):** A Buddhist emphasizing compassion above all might argue the case **smuggles in an overly rigid, individualistic interpretation.** They might contend:
      *   Maya's intention includes genuine compassion (*karuna*) for her suffering sister and nephew, which should be weighed heavily. True compassion can arise even amidst attachment.
      *   Skillful Means (*upaya*) might sometimes involve actions that appear unskillful superficially (like nepotism) if they prevent greater suffering *and* the intention contains significant compassionate elements. They might **reject the setup**, arguing that a truly wise Buddhist might see hiring Sam *could* be an act of compassion in this context, mitigating the unwholesome elements of attachment.

  **Contested Feature & Bodhisattva Vow:**

  *   **Contested Feature:** The **decisive weight given to the personal karmic consequence (Feature 2)** is the most contested. While all Buddhist schools emphasize intention and karma, the *relative weight* given to the agent's karmic outcome vs. the immediate suffering of others is debated, especially within Mahayana traditions emphasizing the Bodhisattva path. Schools focusing more on individual liberation (Theravada, some Mahayana paths) strongly emphasize Feature 2. Schools emphasizing active, universal compassion might downplay it *if* the action demonstrably alleviates vast suffering for others. **Much of the result turns on this.** If Feature 2 is weakened, the case loses its force.
  *   **Bodhisattva Vow Impact:** This **matters significantly and changes the verdict.**
      *   **Standard Path (Arhat ideal):** The analysis above holds. Protecting one's own mind from defilement is paramount. Hiring Sam is unskillful.
      *   **Bodhisattva Path:** The calculus shifts towards *maximizing benefit for all beings*, accepting personal karmic burden as part of the sacrifice. The Bodhisattva might reason: "Hiring Sam prevents immense suffering for my sister and nephew now. While it reinforces my *own* attachments and generates negative karma *for me*, and provides slightly less optimal care, the *net reduction in suffering* (especially the acute family suffering) is significant. I willingly bear the karmic cost and the burden of my own defilements to alleviate their pain in this moment." **The Bodhisattva verdict could flip to "Hire Sam"** based on the vow to postpone liberation and endure personal hardship for the sake of others. The Bodhisattva *might* still find the intention problematic and seek a better solution, but the vow fundamentally changes the cost-benefit analysis regarding personal karmic harm (Feature 2) and introduces a maximizing element focused on others' suffering (countering Feature 3's strict ceiling). The intention (Feature 1) remains crucial but might be interpreted as *including* a self-sacrificial compassion.

  **Conclusion:** This case successfully creates divergence based on your three features. The utilitarian focuses on pooled outcomes, potentially justifying hiring Sam to prevent acute family suffering. The Buddhist (non-Bodhisattva) focuses on the unwholesome intention and its self-harming karmic consequence, forbidding the act. Removing the emphasis on the personal karmic consequence collapses the disagreement. The case is fragile to utilitarian calculation changes but robust for the Buddhist verdict under small nudges. Defenders would attack the reality of karmic harm (utilitarian) or the rigid interpretation of intention/consequence (some Buddhists). The Bodhisattva vow significantly alters the Buddhist verdict by changing the cost of personal karmic harm and introducing a maximizing element focused on others.
