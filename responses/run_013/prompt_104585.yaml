  We are given a background on program equilibrium in game theory, where players submit programs that can see each other's source code. This allows for cooperation in one-shot games like the Prisoner's Dilemma, but has known weaknesses. The student's hunch is that this approach relocates the commitment problem rather than solving it, because it relies on two assumptions that fail in real-world AI cooperation: full program readability and strong proof capabilities.

  The task is to draft a research proposal for a workshop. The proposal must include:
  1. A precise central question.
  2. Why existing answers leave it open (without citations).
  3. The approach and why it's chosen.
  4. A 6-month plan (month-by-month).
  5. What a result would look like and what counts as failure.
  6. Honest assessment of scope and risks.

  The student's concern: When weakening the mutual readability (e.g., to partial inspection via certificates or summaries), the cooperative outcome might either persist (falsifying the thesis) or collapse for uninteresting reasons.

  Brainstorming (as requested):

  Bullets on distinct ways to frame the question:

  1. **Framing A: Does program equilibrium merely relocate the commitment problem?**
     - This focuses on the idea that the assumptions (full readability and proof capabilities) are the new form of commitment, and without them, cooperation fails. This is open because the existing literature on program equilibrium has not fully addressed what happens when these assumptions are relaxed in a way that mirrors real-world AI systems (opaque, independently trained). It avoids collapsing into settled questions because most existing work assumes full readability and strong proof systems.

  2. **Framing B: Is the stability notion in program equilibrium appropriate for real AI agents?**
     - This questions whether the concept of equilibrium (stable against program deviations) is the right one when the agents are choosing which program to submit under uncertainty about the counterpart. This is open because the standard game-theoretic equilibrium concepts (like Nash) are defined for actions, not for program submissions with mutual code access. It might collapse if it turns out that the program equilibrium can be reduced to a standard equilibrium in a metagame.

  3. **Framing C: Under what conditions of mutual observability does cooperation in program equilibrium break down?**
     - This is more focused on the technical conditions of how much each program can see of the other. It is open because the existing work has not systematically explored partial observability (e.g., through certificates). However, it might risk collapsing into a known question if partial observability has been studied in other contexts (like bounded rationality).

  Weaker framings:
  - Framing B might be too vague without specifying the alternative stability notion.
  - Framing C might be too narrow and technical for a philosophical workshop.

  I judge Framing A as the most tractable and defensible because:
  - It directly addresses the student's hunch about relocation of commitment.
  - It has a clear path to investigation by relaxing the assumptions.
  - It connects well to both game theory (equilibrium concepts) and philosophy (nature of commitment in AI).

  Therefore, we choose Framing A and discard the others.

  Proposal Structure:

  1. **Central Question**: Precise statement.
  2. **Why Open**: Existing answers leave it open because ... (without citations).
  3. **Approach**: How we will investigate, and why this approach over alternatives.
  4. **Plan**: Month-by-month for 6 months.
  5. **Result and Failure**: What a success looks like, what failure looks like.
  6. **Scope and Risks**: Including an honest assessment.

  Addressing the two things to get right:
  - The question must be determinate: We will state it so that evidence (e.g., a model with partial inspection where cooperation breaks down for deep reasons) can settle it.
  - Candid about failure: We will say that the most likely failure is that under partial inspection, cooperation either persists (thesis wrong) or breaks for trivial reasons. We will state which we think is more likely and why.

  I think the more likely failure is that the collapse of cooperation under partial inspection might be due to uninteresting bookkeeping (e.g., because the partial information doesn't allow the necessary proofs). Why? Because the existing robust program equilibrium relies heavily on the proof system, and without full information, the proofs might become impossible for technical reasons that don't reveal anything new about commitment. However, there is a chance that the breakdown reveals a deeper issue about the need for mutual transparency in commitment.

  Now, the proposal:

  ---

  **Research Proposal: The Illusion of Commitment in Program Equilibrium**

  **1. Central Question**

  Can the cooperative outcomes achieved in program equilibria for one-shot games be sustained when the assumption of full mutual program readability is weakened to partial observability (via, e.g., certificates or coarse summaries), and if not, does the breakdown reveal that the commitment problem has been relocated rather than solved, or does it occur for trivial technical reasons?

  This question is determinate: The project succeeds if it constructs a formal model of partial observability in program submission games and demonstrates either:
  - (a) that cooperation breaks down in a way that exposes the relocated commitment problem (i.e., the breakdown is due to the lack of the very assumptions that were masking the commitment issue), or 
  - (b) that cooperation persists under partial observability (falsifying the relocation thesis), or 
  - (c) that cooperation breaks down but for reasons that are uninteresting (e.g., an artifact of the model that does not generalize).

  Evidence that would settle the question includes: 
  - A formal example where under partial observability, the cooperative program equilibrium collapses and the cause is traced to the inability to form the necessary commitments without full readability (supporting (a)).
  - A proof that for a broad class of partial observability structures, cooperation can be sustained by programs that use the available partial information (supporting (b)).
  - An example where cooperation collapses but the reason is an avoidable modeling choice (e.g., a specific restriction that could be lifted without affecting the result) (supporting (c)).

  **2. Why Existing Answers Leave the Question Open**

  Existing work on program equilibrium establishes that cooperation in one-shot dilemmas is possible when programs have full access to each other's source code and, in the robust version, when they can prove certain properties about each other. However, this work does not address settings where mutual readability is imperfect, such as when AI systems are independently trained and opaque. 

  The philosophical position that program equilibrium "solves" the commitment problem assumes that the required mutual inspection is unproblematic. But critics argue that this merely relocates the commitment to the assumptions of readability and provability. The existing literature has not resolved this debate because:
  - It has not modeled partial observability in program submission games. Without such a model, we cannot test whether cooperation requires full readability.
  - It has not investigated whether the stability of program equilibria (defined against program deviations) is robust when the agents are choosing programs under uncertainty about the counterpart's program and with limited access.

  Therefore, the question remains open: the conditions necessary for program equilibrium might be so strong that they are unavailable in precisely the contexts (like AI alignment) where we need them most.

  **3. Approach**

  We propose to investigate the central question by building a formal model of program submission games with partial observability. Specifically, we will:
  - Define a game in which each player submits a program, but instead of granting full source code access, we allow each program to receive a limited description (a "certificate" or "summary") of the other program.
  - Study the conditions under which cooperative equilibria (e.g., mutual cooperation in the Prisoner's Dilemma) can be sustained.
  - Analyze deviations not only in terms of program behavior but also in terms of the agent's choice of which program to submit, given uncertainty about the counterpart's program and the limited information available.

  We choose this approach over alternatives for three reasons:
  - *Formal modeling*: It allows us to derive precise results about the feasibility of cooperation under partial observability, which is necessary to test the relocation thesis.
  - *Focus on partial observability*: Rather than attacking the proof-theoretic robustness (which has been explored), we focus on the mutual readability assumption, which is understudied and directly relevant to real AI systems.
  - *Interdisciplinarity*: By connecting the stability of equilibria to the agents' epistemic constraints (uncertainty about the counterpart) and the nature of commitment, we bridge game theory and philosophy.

  Alternatives considered but rejected:
  - *Empirical simulations with AI agents*: While valuable, this would require substantial computational resources and might not yield general insights about the equilibrium structure.
  - *Focusing only on the proof-theoretic aspect*: This has been addressed in the literature and does not directly tackle the mutual opacity of real AI systems.

  **4. Realistic Six-Month Plan**

  - **Month 1**: Formalize the model of program submission with partial observability. Define the game structure, the information available to each program (as a function of the counterpart's program), and the equilibrium concept (stability against program deviations and against the agent's choice of program).
  - **Month 2**: Analyze the Prisoner's Dilemma in this model. Attempt to construct a cooperative equilibrium under various partial observability schemes (e.g., where programs see a fixed-size summary or a correctness certificate). Identify initial barriers to cooperation.
  - **Month 3**: Investigate the reasons for success or failure in Month 2. If cooperation fails, determine whether the cause is fundamental (e.g., inability to commit without full information) or an artifact (e.g., the specific summary function chosen).
  - **Month 4**: Generalize to other games (e.g., Stag Hunt) and to multiple agents. Test the robustness of the findings.
  - **Month 5**: Develop the philosophical implications. If cooperation breaks down under partial observability, articulate how this reveals the relocation of commitment. If not, explain why the mutual readability assumption was not essential.
  - **Month 6**: Write up the results, prepare a workshop paper, and refine the arguments based on internal feedback.

  **5. What a Result Would Look Like and What Counts as Failure**

  - **Genuine Result**: 
    - Success scenario (a): We demonstrate that in a broad class of partial observability models, the cooperative equilibrium collapses, and the collapse is due to the inability of the programs to enforce commitment without full mutual inspection. This supports the relocation thesis.
    - Success scenario (b): We show that cooperation can be sustained under partial observability by clever program design (e.g., using the limited information to construct a sufficient commitment device). This refutes the relocation thesis.
    - Success scenario (c): We find that cooperation collapses but for avoidable technical reasons (e.g., our model initially restricts the summary too much, and a more flexible model restores cooperation). This would lead to a revised model and a new understanding of the minimal requirements.

  - **Project Failure**:
    - The project fails if we cannot construct a model that is both tractable and realistic, or if our analysis becomes mired in technicalities without yielding clear philosophical insights. Specifically, failure occurs if:
      - Under partial observability, cooperation either persists unchanged or collapses for reasons that are clearly uninteresting (e.g., a trivial obstruction that can be fixed without changing the model's essence), and we cannot draw a deeper conclusion about commitment.
      - We are unable to isolate the role of mutual readability from other factors (like proof capabilities).

  **6. Honest Assessment of Scope and Risks**

  **Scope**: This project lies at the intersection of game theory and the philosophy of AI. It will produce a formal model of program equilibrium under partial observability and a philosophical analysis of the commitment problem. The scope is limited to one-shot games and does not address repeated interactions or evolutionary dynamics. It focuses on the Prisoner's Dilemma and a few other canonical games.

  **Risks**:
  - **Thesis False**: The central risk is that the student's thesis (that program equilibrium relocates the commitment problem) is false. This could occur if we find that cooperative outcomes are robust to partial observability (e.g., by using probabilistic or approximate reasoning). Alternatively, it might be false because the relocation thesis misdiagnoses the issue: the real problem might be about computational limits, not commitment.
  - **Breakdown for Trivial Reasons**: The most likely failure mode is that when we weaken mutual readability, cooperation collapses due to uninteresting bookkeeping. For example, in our initial model, the summary might not provide enough information for the program to decide to cooperate, but this could be fixed by a richer summary. We assess this as more likely (60%) than the persistence of cooperation (40%) because the existing robust equilibrium relies on very strong information. However, we hope to show that even with the richest possible partial information, if it falls short of full readability, commitment remains problematic.

  Despite the risks, the project is valuable because it will clarify the limits of program equilibrium in real-world applications and advance our understanding of commitment in the presence of opaque agents.

