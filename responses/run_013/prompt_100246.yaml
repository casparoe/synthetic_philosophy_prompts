answer: |-
  ## The Causal Status of Omissions: Defending a Robust Parity Thesis

  Metaphysical debates concerning causation by omission strike at the heart of our understanding of agency, responsibility, and the structure of the world. The core dispute pits the **Parity Thesis** – asserting that omissions are causes in the same robust, metaphysical sense as positive events – against the **Deflationary Thesis** – contending that omissions are not genuine causes, or are causes only in a derivative or attenuated sense. This essay will adjudicate this dispute, arguing that the Parity Thesis offers the most coherent and explanatorily powerful account, once properly understood and defended against its most potent challenges.

  **I. The Contending Theses: Formulated Robustly**

  *   **The Robust Parity Thesis:** Omissions (e.g., the gardener's failure to water) are genuine causes, ontologically on par with positive events (e.g., a rock striking a window). The counterfactual dependence test is the core criterion for causation: *c* causes *e* iff had *c* not occurred (or been different in the relevant way), *e* would not have occurred (or been different in the relevant way). Applied consistently, this test licenses omissions as causes when the outcome depends counterfactually on the non-occurrence of the omitted action. Any perceived asymmetry between positive and negative causation stems not from metaphysics, but from pragmatic factors like our expectations, norms, interests, and the salience of certain possibilities over others (e.g., we expect watering more than we expect *not*-watering by specific individuals). Causation itself is a difference-making relation, and omissions make differences just as effectively as positive events.
  *   **The Robust Deflationary Thesis:** Genuine causation requires a spatiotemporally located, positive occurrence – an event, process, or interaction involving the transfer or manifestation of energy, force, or some metaphysically robust "oomph." Omissions, being absences or non-events, lack this ontological status. They cannot stand in the *causal relation* proper. Talk of "causation by omission" is either a loose, pragmatic shorthand for identifying *explanatorily relevant factors* or *conditions* necessary for the positive causes to operate, or it denotes a distinct, second-class relation (e.g., quasi-causation, dependence). The counterfactual test, while useful for identifying relevance and dependence, is too permissive to capture genuine causation, precisely because it licenses countless absences.

  **II. Confronting Profligacy: Can Parity Be Saved?**

  The deflationary theorist's strongest weapon against parity is the **Problem of Profligacy**: If the counterfactual test licenses the gardener's omission as a cause of the plants' death, why not also the omission of every passerby, the plant owner vacationing abroad, the seed supplier who didn't come back to water, or even the President (who *could* have ordered a rescue mission)? This explosion of omission-causes seems metaphysically absurd and pragmatically useless. The deflationist argues this profligacy reveals a fatal flaw: the counterfactual test conflates genuine causation with mere counterfactual dependence, and only restricting causes to positive events avoids this absurdity.

  The parity theorist *can* offer a principled response without abandoning the core counterfactual framework:

  1.  **Contrastivity:** Causation is inherently contrastive. We ask not simply "Did *c* cause *e*?" but "Did *c* rather than *C* cause *e* rather than *E*?" When we say "The gardener's failure caused the death," we typically implicitly contrast it with *the gardener watering*. We are *not* contrasting it with "every possible non-waterer acting." The relevant omission is relative to a specific, contextually salient alternative possibility.
  2.  **Normative/Pragmatic Salience:** While countless absences might satisfy the *bare* counterfactual, we naturally focus on omissions by agents who had a *duty*, *capacity*, or *reasonable expectation* to act. The passerby's omission might make the same counterfactual difference, but the gardener had a specific role-based obligation. This salience affects which omissions we *call* causes, not whether they *are* causes in the metaphysical sense. Profligacy highlights the vast network of counterfactual dependencies, but context selects which nodes we deem relevant *as causes* for our explanatory or normative purposes.
  3.  **Preemption & Redundancy:** Many potential omission-"causes" are redundant or preempted. If the gardener was hired specifically to water and failed, the owner's distant failure might be redundant – the death would still have occurred even if the owner *had* watered (because they weren't there to do it). The counterfactual test, applied carefully, can often rule out redundant omissions. The gardener's omission is a *sine qua non* cause; many others are not, once the context is fixed.

  Therefore, profligacy is a challenge to *identifying* or *pragmatically selecting* which omission-causes matter, not a refutation of their metaphysical status. It highlights a feature of the counterfactual landscape, not a flaw in parity's core metaphysics.

  **III. The Drowning Child: Parity, Intuitions, and Divergence**

  Consider the case: A child drowns. A nearby stranger and the on-duty lifeguard both could easily have saved her, yet neither acted. Both omissions are counterfactually indistinguishable regarding the death: had *either* acted, the child would have lived. The Parity Thesis commits us to the view that **both omissions are equally causes of the death** in the metaphysical sense. The counterfactual dependence is identical.

  Our intuitions, however, diverge sharply. We feel the lifeguard's omission is a *stronger* or *more significant* cause, or perhaps more blameworthy. This divergence is **not primarily evidence about causation itself**, but rather about **responsibility, blame, and normative expectations**.

  *   **Normative Expectations & Roles:** The lifeguard had a specific, socially defined duty to act. The stranger had, at best, a general moral duty. This difference in obligation makes the lifeguard's omission a graver *failing* and grounds greater blame.
  *   **Explanatory Focus:** In explaining *why* the death occurred *despite safeguards*, the lifeguard's omission is paramount. In explaining the *general opportunity* for rescue, both omissions are relevant. The focus shapes which cause we emphasize.
  *   **Causal Contribution vs. Causal Sufficiency:** Both omissions were necessary parts of the causal history leading to the death *in this scenario*. Neither omission *alone* was sufficient – the drowning required the child's presence, the water, etc. But both omissions were equally necessary links in the chain of counterfactual dependence leading to the outcome.

  The divergence in intuition highlights that causation (as difference-making) is one thing; normative assessment and the assignment of responsibility are another, though they often build upon the causal facts. The parity thesis correctly identifies the shared causal status; the deflationary thesis mistakes the stronger normative weight attached to the lifeguard's omission for a difference in causal *metaphysics*.

  **IV. Defending the Verdict: Robust Parity with Pragmatic Constraints**

  The truth does not lie in a vague middle ground. I defend a **Robust Parity Thesis**, qualified only by the recognition that *identifying* and *emphasizing* causes is always context-dependent:

  1.  **Metaphysical Equivalence:** When an outcome counterfactually depends on an omission in the same way it depends on a positive event (i.e., the absence of the action is a *sine qua non* condition for the outcome, relative to the occurrence of that action), that omission is a genuine cause in the same metaphysical sense. The gardener's not-watering *causes* the death just as surely as a vandal's cutting the stems does. The lifeguard's and stranger's failures are equally causes of the drowning. The causal relation itself is the difference-making relation captured by counterfactual dependence.
  2.  **Deflationism's Error:** The deflationary thesis mistakenly reifies causation as requiring a specific ontological category (positive events/processes) and a mysterious "connection" beyond difference-making. This leads to an untenable dualism: either we must deny the obvious causal relevance of omissions (making vast swathes of explanation and responsibility unintelligible), or we must invent a second-class causal relation, which simply relabels the problem without solving it. The profligacy worry is pragmatic, not metaphysical, and is handled by contrastivity and salience.
  3.  **The Role of Pragmatics:** The asymmetry we perceive stems entirely from pragmatics: Salience, normative expectations (duties, roles), explanatory interests, and the contrast classes we implicitly employ. These factors determine *which* of the many counterfactual dependencies we *call* "the cause" in a given context. They do not determine whether an omission *is* a cause. The lifeguard's omission *is* metaphysically equivalent to the stranger's as a cause, but it is normatively weightier and explanatorily more salient in most contexts.
  4.  **Explanatory Power:** Parity provides a unified, elegant account of causation using a single, powerful tool (counterfactual dependence). It seamlessly handles positive events and omissions within the same framework, explaining why "He died because he was shot" and "He died because no one gave him the antidote" feel like parallel causal explanations. Deflationism fractures this unity without sufficient metaphysical gain.

  **Conclusion**

  The insistence that omissions cannot be genuine causes stems from an overly restrictive ontology of causation and a conflation of metaphysical status with pragmatic salience and normative weight. The Robust Parity Thesis, grounded in counterfactual dependence, correctly identifies omissions as causes metaphysically equivalent to positive events. The Problem of Profligacy reveals the vast scope of counterfactual dependencies but is managed by recognizing the contrastive nature of causal claims and the role of context in selecting salient causes. The divergent intuitions in cases like the drowning child reflect differences in duty, blame, and explanatory focus, not a difference in the causal relation itself. Therefore, we must conclude that omissions are **genuine causes**, full stop. The gardener's neglect *causes* the plants to wither; the lifeguard's inaction *causes* the drowning; and this causation is as real as that of the rock shattering the window. The felt asymmetry is a shadow cast by our norms and interests, not a feature of the causal fabric of the world.
