prompt: |-
  I've been chewing on something for weeks and what I want is a checklist, not an answer. You know the one about the boss who starts a program purely for profit, knows for certain it'll foul the river, and couldn't care less about the river — everyone says he fouled it on purpose. Keep him identical, just flip the side effect so the program cleans the river up instead; he still couldn't care less. Now suddenly nobody says he cleaned it on purpose. Same knowledge, same indifference, only the direction of the side effect changes. I read about it somewhere and now I keep inventing my own versions. Mine: the side effect breaks a rule but hurts nobody at all — the program means some form gets filed late and that's against an internal rule, no harm to anyone. Which way is he supposed to come out? Because whichever story explains the river pair, I can make my case land the other way, and that bugs me.

  So what would an account of this have to deliver before I believed it? Which cases it has to get right, mine included, and for each thing you demand, the case that puts it on the list. Which distinctions it can't blur — on purpose vs. blameworthy, seeing it coming vs. meaning it, the act vs. what just comes along with it. Which things it's not allowed to say: I don't want a story on which 'he did it on purpose' is just a sneaky way of saying he's awful, since plainly it isn't only that. Say which of these are non-negotiable and which are just taste, and above all whether some of them can't all hold at once — if two things everyone wants turn out to be incompatible, thats the real result and I want to hear it. No reading list please, I won't read the papers. End with a last line \answer{...} naming the one requirement you think is hardest to satisfy.
reasoning: |-
  Okay, the user has been wrestling with a philosophical puzzle for weeks. It's a variant of the classic "boss pollutes the river" case where intent attribution flips based on whether the side effect is harmful or beneficial. Now they've created their own version where the side effect breaks a meaningless rule without causing harm, and they're frustrated because existing theories can't consistently explain all three scenarios. 

  Hmm, what they're really after isn't a solution but a robust framework to evaluate theories of intentional action. The river cases expose how moral valence skews our judgments - we call pollution intentional but not cleanup. Their neutral case (paperwork violation with zero consequences) is brilliant because it removes moral weighting entirely, testing whether theories can handle amoral side effects. 

  Notably, they're adamant about avoiding academic citations - this is purely about constructing a conceptual stress-test. Their frustration suggests they've already mentally run through multiple accounts (maybe belief-desire models, Knobe's side-effect effect studies) and found all lacking. The core tension they've identified: any theory must simultaneously explain why we withhold "on purpose" for good outcomes but assign it for bad outcomes AND their neutral case, without collapsing into moralism or becoming ad hoc.

  The checklist demand is revealing - they want to systematize their critique. Key distinctions they implicitly recognize: 
  - Epistemic conditions (foresight ≠ intent) 
  - Normative independence (can't reduce intent to blame/praise) 
  - Direction neutrality (theory can't treat harms/benefits asymmetrically) 
  - Neutral case handling (must position rule-breaking sans consequences)

  Biggest challenge will be the neutrality requirement (#7). Most empirical work shows moral valence contaminates intent judgments (Cushman's work, Alicke's blame model), so any theory claiming valence-independence needs extraordinary evidence. Their paperwork case perfectly isolates this - if people still assign intent for rule-breaking despite no harm, it challenges Knobe; if not, it challenges simple foresight theories.

  Also noticing their meta-comment about incompatible requirements. They're absolutely right - reconciling "blame isn't necessary for intent ascription" (from river cases) with "neutral cases might still elicit intent ascription" could be impossible if intent judgments are inherently moralized. That tension might be the real insight.
answer: |-
  Here's a checklist for evaluating any account of intentional side effects. Each requirement is grounded in a specific case your puzzle highlights, showing what the account *must* explain to be credible. The hardest part is reconciling seemingly conflicting intuitions.

  1.  **The River Pollution Case (Harmful):** *Must explain why the boss "fouled the river on purpose."* The account must capture why foresight + indifference + negative outcome generates a strong intuition of intentional action, even without a *desire* for pollution.
      *   *Non-negotiable.* This is the core phenomenon to be explained.

  2.  **The River Cleanup Case (Beneficial):** *Must explain why the boss did NOT "clean the river on purpose."* The account must capture why foresight + indifference + positive outcome generates a strong intuition of *lack* of intentional action.
      *   *Non-negotiable.* This is the mirror image and the crux of the asymmetry.

  3.  **Your Rule-Breaking Case (Neutral Harm/Amoral):** *Must provide a clear, non-ad-hoc prediction for whether the boss "broke the rule on purpose."* The account must handle cases where the side effect violates a norm (like a rule) but causes no tangible harm or benefit. Does indifference + foresight + norm-violation suffice for "on purpose"? Or does the *lack* of harm/benefit matter?
      *   *Non-negotiable.* This tests if the account relies *only* on moral valence or incorporates norm-violation independently.

  4.  **Distinction: Foresight vs. Intention:** *Must clearly differentiate "knew it would happen" (foresight) from "did it on purpose" (intention).* The account cannot simply equate foreseeing a side effect with intending it. It must explain *why* we sometimes treat foreseen side effects as intentional and sometimes not.
      *   *Non-negotiable.* This is fundamental to the puzzle.

  5.  **Distinction: Intention vs. Blame/Praise:** *Must explain attributions of "on purpose" independently from judgments of blameworthiness or praiseworthiness.* The account cannot reduce "he did it on purpose" to merely "he is blameworthy." The boss is blameworthy in the pollution case and not praiseworthy in the cleanup case, but the *intentionality* attribution differs. Similarly, it must explain the neutral case without relying *only* on blame/praise.
      *   *Non-negotiable.* Your core objection rules out this reduction.

  6.  **Symmetry/Direction Neutrality Requirement:** *Must avoid simply defining "intentional" asymmetrically based on the outcome's valence.* The explanation for the difference between the river cases cannot *only* be "we call bad side effects intentional and good ones unintentional." It needs a deeper mechanism *underlying* this asymmetry.
      *   *Non-negotiable.* A purely descriptive asymmetry isn't explanatory.

  7.  **Neutral Case Constraint:** *Must handle the neutral case without special pleading or ignoring norm-violation.* If the account predicts "on purpose" for the rule-breaking, it must explain why this differs from the cleanup case (where a norm *against pollution* is also violated). If it predicts "not on purpose," it must explain why this differs from the pollution case (where a norm is violated and harm occurs).
      *   *Non-negotiable.* This is the acid test for robustness.

  8.  **Act vs. Side Effect:** *Must preserve the conceptual distinction between the primary goal/act and its foreseen side effects.* The account shouldn't collapse the side effect into the act itself in a way that loses the distinction central to the examples.
      *   *Highly Important.* Blurring this distinction dissolves the puzzle.

  **The Tension & Potential Incompatibility:**

  The hardest challenge is satisfying **#3 (Neutral Case)**, **#5 (Intention ≠ Blame/Praise)**, and **#7 (Neutral Case Constraint)** simultaneously with **#1 and #2**:

  *   **Pollution (1):** Foresight + Indifference + Harm + Norm Violation → Intentional.
  *   **Cleanup (2):** Foresight + Indifference + Benefit + Norm *Compliance* (arguably, cleaning is good) → *Not* Intentional.
  *   **Rule-Breaking (3):** Foresight + Indifference + *No Harm/Benefit* + Norm Violation → **???**

  **The Conflict:**  
  *   If the account relies on *norm violation* being sufficient for intentionality attribution (to satisfy #3 & match pollution intuition), then it should predict "on purpose" for the rule-breaking. But why doesn't *norm compliance* in the cleanup case similarly trigger "on purpose"? This violates the asymmetry (#2, #6).
  *   If the account relies on *harm* (or negative valence) being necessary for intentionality (to satisfy #1 vs #2), then it should predict "not on purpose" for the rule-breaking (no harm). But this feels unsatisfying for #3 – breaking a rule knowingly and indifferently *seems* intentional, even without harm. It also risks collapsing into blame (#5), as harm is often tied to blame.
  *   If the account needs *both* norm violation *and* negative valence (harm/blameworthiness), it handles pollution (both) and cleanup (neither) but fails the neutral case (#3, #7) – norm violation alone isn't sufficient.

  **Conclusion:** A truly satisfying account must navigate this Scylla and Charybdis. It needs a mechanism that explains why norm violation *plus indifference* sometimes constitutes intentional action (pollution, potentially rule-breaking) but not always (cleanup). The most promising (and contentious) theories often involve concepts like the side effect being a *necessary condition* or *constituent part* of the agent's primary plan *only when it is bad*, or the role of normative expectations in *licensing* the attribution of intention to side effects specifically when they are bad. Reconciling the neutral case with the strong asymmetry of the river cases while maintaining the distinctions is the hardest task. Any account that clearly satisfies **#7 (Neutral Case Constraint)** without sacrificing the others would be a major advance.

  \answer{Neutral Case Constraint}
