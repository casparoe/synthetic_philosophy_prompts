  ### Glyph Evaluation Procedure: Role-Based Identity & Stylistic Consistency

  This procedure evaluates glyphs by prioritizing their **functional role** (how they maintain contrasts within the alphabet system and preserve a core skeleton) and **stylistic consistency** (how they adhere to the family’s design logic). It is designed to be run glyph-by-glyph, with clear pass/fail gates and handoffs for subjective decisions. The skeleton is the invariant structure (e.g., stroke count, topological relationships), while style is the coherent application of variables (e.g., contrast, terminals, proportions).

  ---

  #### **Step-by-Step Questions & Criteria**  
  *(Run in order; stop at first failure)*

  1. **Skeleton Integrity Check**  
     - **Question:** Does the glyph preserve the core topological skeleton (e.g., stroke count, open/closed forms, junction points) consistent across all styles in the family?  
     - **Pass:** The skeleton is identical to the family’s master skeleton (e.g., a two-story "a" remains two-story; a closed "o" remains closed).  
     - **Fail:** Altered skeleton (e.g., a one-story "a" in a family of two-story "a"s). Stops with **no**.  
     - **Taste Handoff:** Never. Skeleton is non-negotiable for identity.

  2. **Contrast System Check**  
     - **Question:** Does the glyph maintain sufficient contrast with similar glyphs (e.g., "a" vs. "o", "n" vs. "h") to avoid ambiguity at the style’s intended size?  
     - **Pass:**  
       - *Text styles:* Distinguishable at 10pt in running text (e.g., "a" bowl doesn’t optically close; "i" dot is clear).  
       - *Display styles:* Distinguishable at 36pt in isolation (e.g., "a" doesn’t merge with "e" in a headline).  
     - **Fail:** Ambiguous in target context (e.g., "a" reads as "o" in text; "c" closes into "o"). Stops with **no**.  
     - **Taste Handoff:** If contrast is *technically sufficient* but pushes stylistic boundaries (e.g., a playful display "a" with a tighter bowl than usual).

  3. **Strict Style Consistency Check**  
     - **Question:** Are all style-specific decisions (terminals, contrast axis, proportions) applied identically to this glyph as in the rest of the alphabet?  
     - **Pass:** Metrics match the family’s style rules (e.g., all terminals are flat; all bowls have 10:1 contrast).  
     - **Fail:** Inconsistent execution (e.g., a ball terminal when all others are wedge-shaped; a 5:1 contrast in a 10:1 style). Stops with **no**.  
     - **Taste Handoff:** If consistency is achieved but the *degree* of a style trait is debatable (e.g., whether a terminal is "too sharp" in a high-contrast design).

  4. **Systemic Role Check**  
     - **Question:** Does the glyph support reading rhythm (e.g., spacing, weight distribution) and integrate with adjacent glyphs without disrupting the system?  
     - **Pass:**  
       - No visual "hiccups" in test strings (e.g., "nausea" reads smoothly).  
       - Spacing/weight aligns with the family’s metrics (e.g., side-bearings match "n" or "o").  
     - **Fail:** Breaks rhythm (e.g., glyph is too wide/light; creates gaps/tangles in "average"). Stops with **no**.  
     - **Taste Handoff:** If functional but stylistically divisive (e.g., an "a" with a calligraphic flair in a minimalist sans).

  5. **Taste & Context Handoff**  
     - **Question:** Does the glyph align with the family’s expressive intent while passing Steps 1–4?  
     - **Outcome:** Human judgment required. No automatic pass/fail.  
     - **Triggers:**  
       - Stylistic innovation that doesn’t break function (e.g., a display "g" with a dramatic tail).  
       - Subjective trade-offs (e.g., historical fidelity vs. readability).  

  ---

  #### **Verdicts on Test Cases**  
  *Assumptions:  
  - Family skeleton: Double-story "a".  
  - Text style: Designed for 8–12pt.  
  - Display style: Designed for 36pt+.*

  **Case 1: Near-circular ‘a’ with almost-closed bowl (text style)**  
  - **Step 1 (Skeleton):** Pass. Bowl/stem topology preserved.  
  - **Step 2 (Contrast):** **Fail.** Bowl closure causes "a" to collapse into "o" at 10pt (e.g., "dance" reads as "donce").  
  - **Verdict: Reject.** Hard stop—functional failure.  

  **Case 2: Immaculate ‘a’ with contradictory terminal (any style)**  
  - **Step 1 (Skeleton):** Pass. Structure intact.  
  - **Step 2 (Contrast):** Pass. Distinguishable from "o" and "e".  
  - **Step 3 (Style Consistency):** **Fail.** Terminal (e.g., flared) contradicts all other letters (e.g., tapered).  
  - **Verdict: Reject.** Breaks style logic.  

  **Case 3: Display ‘a’ collapsing into ‘o’ in text (display style)**  
  - **Step 1 (Skeleton):** Pass.  
  - **Step 2 (Contrast):** Pass. Unmistakable at 36pt.  
  - **Step 3 (Style Consistency):** Pass. Stylistic decisions are uniform.  
  - **Step 4 (Systemic Role):** Pass. Rhythm maintained in headlines.  
  - **Taste Handoff:** Triggered. While functional *as display*, it fails when misused in text. Humans must decide:  
    - **Option A:** Pass. "Display styles aren’t for text."  
    - **Option B:** Fail. "Real-world misuse is inevitable; preempt it."  
  - **Final Verdict (Procedure):** **Handoff for taste.**  
    - *(You may dislike this: The procedure allows a pass, but designers must debate misuse risk.)*  

  ---

  #### **What the Procedure Cannot Decide**  
  1. **Pure Aesthetics:** "Is this glyph *beautiful*?" or "Is this stroke *elegant*?" are taste-based.  
  2. **Expressive Boundaries:** When a stylistic choice (e.g., a exaggerated display serif) doesn’t break function but divides opinion.  
  3. **Historical/Licensing Nuances:** "Does this ‘a’ respect the source material?" requires cultural/historical judgment.  
  4. **Threshold Ambiguity:** *Exact* metrics (e.g., "minimum bowl aperture") must be predefined per family; the procedure flags deviations but can’t set the rule.  

  This system forces objective scrutiny of *role* and *consistency* first, reserving subjectivity only when function is secure. It ensures glyphs earn their place in the system—not just as shapes, but as working parts of a linguistic machine.
