prompt: |-
  I keep getting into arguments about when it's actually wrong to not beleive someone, and I've noticed my gut verdicts don't obviously run on a single principle. Instead of reading more about it, I want you to reverse-engineer the principle from my verdicts and tell me which of the verdicts I have to give up. Please don't just report what some famous philosopher supposedly said — I want the actual principle, stated so I could apply it myself. Here's where I land:

  - A doctor shrugs off a woman's abdominal pain as anxiety; it turns out to be something serious. Unjust, obviously.
  - My brother lies about everything. He tells me the road is flooded, I ignore him, I wreck the car. He was right, and I still don't think I wronged him.
  - A guy at a party has a thick accent and keeps mangling a technical term. I catch myself deciding he doesn't know what he's talking about, even though I understood him fine and he's right. Unjust.
  - Someone from a group with a genuinely higher base rate for a certain medical condition tells me about something totally unrelated — a plumbing problem — and I quietly discount them. I say unjust, even though I'd happily use that base rate for the medical thing.
  - Same person, but now they really are telling me about the medical thing, and I weight their word lower because of the base rate. Honestly I think that's fine, or at least not an injustice.
  - Here's one I can't resolve: someone has a terrible track record at a skill, so I never believe them about it. It turns out they never got to practice because they were kept out of every room where the skill gets learned. I want to say my discount is unjust, but it's not about their group and it's about the right topic, so my other verdicts don't get me there.
  - Someone bad at reading social situations misses that a colleague is quietly sabotaging her. Nobody disbelieves her — there's no moment where she says something true and gets shot down. She just can't make sense of what's happening and blames herself. I think that's an injustice, but I can't point to anyone who did anything wrong.
  - Flip it: a woman says she's being harassed, and her manager genuinely doesn't think the behavior counts as harassment, though he has the word and uses it for other cases. Nobody dismisses her testimony as such — they just disagree about whether it applies. I want to say that's not an injustice, just a bad argument, and I'm not sure that survives contact with the previous case.
  - One more, about patterns: a rushed doctor misses an atypical presentation of a disease in a man. No injustice there. The same doctor misses it in nine women in a row and never notices. I think the ninth is an injustice even though each visit, taken alone, involved no prejudice and no sloppiness.

  My draft principle was: a credibility judgment is unjust when the hearer's discount isn't tracking evidence about this speaker on this topic. That handles the accent and unrelated-base-rate cases, but it makes the flooded-road verdict come out unjust (his record is evidence about him on this topic), and it does nothing with the last two, which look like they're about patterns and concepts rather than any single judgment.

  Please give me:

  **The principle(s)** (~150 words): one, or two or three competing candidates, precise enough that I could apply it to a fresh case without asking you.

  **What forces each clause** (~150 words): for every clause, the specific case above that made you add it.

  **Cases I didn't list** (~150 words): what your favourite version predicts for a hearer who is personally blameless but whose judgment fits a pattern that has hurt this speaker's group, and for a speaker who talks herself out of her own knowledge with no hearer involved at all.

  **Verdicts I'd have to drop** (~100 words): which of my gut reactions the principle can't save, and whether you'd keep the principle or the verdict.

  **Bottom line**: one paragraph — the version you'd actually endorse and what it costs me.

  Keep it concrete and no bibliography. And tell me honestly if the whole thing is just one idea wearing different hats.
reasoning: |-
  Hmm, the user is asking me to reverse-engineer an ethical principle about when it's wrong to disbelieve someone, based on their specific judgments in various scenarios. They've presented eight detailed cases where they have strong intuitions about injustice, and one case they're struggling with. They want me to extract a principle from these, explain why each part of the principle is needed based on specific cases, test it on new scenarios, and identify which of their existing judgments would need to be abandoned.

  Looking at their cases, I notice several patterns. In scenario 1 (doctor ignoring abdominal pain), they see injustice in dismissing individual testimony due to bias. Scenario 2 (lying brother) shows they don't see injustice when discounting based on personal track record. Scenario 3 (accent bias) and 4 (unrelated base rate) both involve discounting for group-based reasons unrelated to the topic. Scenario 5 (related base rate) shows they accept statistical evidence when relevant. Scenario 6 (excluded learner) troubles them because the discount seems fair but the background is unfair. Scenario 7 (socially unaware victim) involves structural injustice without active disbelief. Scenario 8 (definitional disagreement) questions when conceptual differences constitute injustice. Scenario 9 (pattern of misdiagnosis) shows concern for systemic patterns.

  The user's draft principle about "tracking evidence about this speaker on this topic" has problems: it would condemn ignoring the lying brother (which they don't want to do) and doesn't address their structural injustice concerns. To build a better principle, I need to incorporate their distinction between personal and group-based evidence, while also accounting for their sensitivity to systemic patterns and conceptual exclusion.

  For the principle itself, I develop a dual-track approach. The core principle states that a credibility judgment is unjust if it uses group-level evidence when personal evidence should override, or if it's applied in a way that sustains exclusion. This handles the accent case (group evidence overriding personal understanding) and the unrelated base rate case (applying medical statistics to plumbing). The exclusion clause addresses the excluded learner scenario by recognizing that discounting perpetuates past exclusion.

  For the pattern cases, I add that systemic injustice occurs when patterns of discounting create or maintain exclusion. This explains why the ninth misdiagnosis is unjust through cumulative effect, and why the self-blaming victim suffers injustice despite no active disbelief - the environment itself is exclusionary. The conceptual disagreement case (harassment definition) isn't unjust because it's about honest conceptual debate, not exclusionary discounting.

  Testing this principle on their requested new cases: For a blameless hearer whose discount fits a harmful pattern, the injustice lies in the pattern, not individual blame. For someone who talks themselves out of their own knowledge, there's no hearer to blame, so no injustice in the discount sense - though it might reflect internalized oppression.

  This principle requires abandoning two verdicts: First, their judgment that discounting the lying brother isn't unjust (the principle says it is, since it's personal evidence properly applied). Second, their sense that the harassment definition case isn't unjust (the principle agrees it's not, but they were unsure). I'd keep the principle over these verdicts because it better captures their core concerns about group-based exclusion.

  The bottom line is that injustice occurs when credibility judgments use group data where individual data exists or sustain exclusion systems. This costs them consistency on personal track records but protects their intuitions about systemic harm.
answer: |-
  Here's your principle reverse-engineered from your verdicts, with explanations:

  ### **The Principle**
  A credibility judgment is unjust when:  
  **(1)** It applies group-level evidence (base rates, stereotypes) *where personal evidence about this speaker should override*, **or**  
  **(2)** It sustains or compounds prior exclusion (denying someone the chance to *become* credible).  
  Systemic injustice occurs when patterns of such judgments create/maintain exclusion, even if no single act is blameworthy.

  ---

  ### **What Forces Each Clause**
  - **Clause (1)**: Driven by your accent case (discounting despite understanding the speaker) and unrelated-base-rate case (applying medical stats to plumbing). Group evidence overrides personal evidence when it shouldn’t.  
  - **Clause (2)**: Forced by your "excluded learner" case (discounting skill due to lack of practice *caused* by exclusion). Discounting perpetuates past injustice.  
  - **Systemic addendum**: Needed for your "ninth misdiagnosis" (individual acts are fine, but the pattern harms women) and "self-blaming victim" cases (no active disbelief, but exclusionary environment causes harm).

  ---

  ### **Cases You Didn’t List**
  - **Blameless hearer, harmful pattern**: A doctor uses a diagnostic tool that underestimates pain in Black patients due to biased training data. *Your principle says unjust*: it applies group-level evidence (flawed base rates) where personal evidence (the patient’s testimony) should override (Clause 1). The hearer isn’t blameworthy, but the pattern sustains exclusion.  
  - **Speaker discounts themselves**: A woman rationalizes her harassment as "not real" because she internalized stereotypes. *No injustice in the discount sense*: no hearer violated the principle. But it’s a *harm* caused by prior exclusion (Clause 2’s root).

  ---

  ### **Verdicts You’d Have to Drop**
  - **Your brother’s flooded road**: Your verdict (no injustice) must go. His lies *are* valid personal evidence about him on this topic. The principle *condemns* ignoring this as a violation of Clause 1 (group evidence isn’t involved, so personal evidence *should* dominate).  
  - **Harassment definition dispute**: You tentatively said "not unjust." The principle *agrees* if the manager genuinely applied consistent concepts (no group discount). Keep this verdict; drop your doubt.  

  **Trade-off**: You lose the flooded-road exemption but gain consistency on systemic cases.

  ---

  ### **Bottom Line**
  The core idea is **exclusion-tracking**: unjust discount either misuses group data where individual data exists, or feeds exclusion loops. It costs you the "lying brother" exemption but rescues your structural intuitions (the excluded learner, the ninth patient). Endorse this: injustice isn’t about individual malice but whether the discount *replicates or entrenches* unfair barriers. All your cases are hats for that one idea.
