prompt: |-
  I run the forecasting desk at a mid-sized specialty insurer — we're four people, and we crank out probability estimates all day for underwriters, actuaries, and the occasional lawyer who wants a number in a deposition. My problem is that we keep having the same fight and I want it to stop. We'll assign, say, "0.15" to something and then spend an hour arguing about what we even did: did we read it off a historical frequency, pull it from a model, just gut it? Half the team thinks a probability for a one-off thing (will this named competitor file a claim by Q3? will this one patient respond?) is a category error and we should refuse to give a number; the other half says refusing is just cowardice and of course you can have a degree of belief about a one-off. And whenever I say "well, it depends what you mean by probability," everyone groans. I want a decision procedure we can actually run on a job, ideally as a form we fill in, that takes a quantity we're asked to price and walks us to (a) what kind of probability claim we're entitled to make, (b) how to actually generate a number under each kind, and (c) how to say it out loud to the client without overclaiming.

  We already tag every request with a "source type," if that helps as scaffolding: F = we have a big historical reference class (e.g., claim frequency for a policy class); C = it's a chance setup with a known-ish mechanism (a die, a component with a rated failure distribution, a radioactive source); J = basically a judgment call with no obvious reference class (a competitor's move, a regulator's decision); M = the number came out of a model and nobody's quite sure what it means. I'd like the procedure to route each tag to the right interpretation — frequentist, subjective/Bayesian, propensity, whatever the right one is — and to be honest when the interpretation you'd want isn't available, e.g. when the client wants a "real" chance for something that only has a degree of belief. Then run it on three of our recurring items: (1) the chance that a specific named supplier defaults within 18 months (we have a small pool of similar suppliers, and the team keeps fighting over whether they're even exchangeable with this one); (2) the chance that a particular industrial press fails in the next 30 days given its age and usage (we have lots of failure-time data, but this is one machine); (3) the chance that a specific pending bill becomes law (basically a political call). One of these the procedure is going to tell us we can't price the way the client wants, and I'd like to know which and why. Also flag the steps that are just judgment wearing a lab coat, and tell me what the procedure can't do — where two people running it honestly will still disagree about the number itself.
reasoning: |-
  We are going to design a decision procedure in the form of a flowchart or a form that the team can fill out for each probability request. The goal is to:

  1. Determine what kind of probability claim we are entitled to make (frequentist, propensity, subjective, etc.)
  2. How to generate the number under each kind
  3. How to communicate it to the client without overclaiming.

  We have the existing tags: F, C, J, M.

  We will map these tags to interpretations:

  - F (historical reference class) -> frequentist
  - C (chance setup with known mechanism) -> propensity
  - J (judgment call) -> subjective/Bayesian
  - M (model output) -> we need to interpret the model: it might be a mix, but we have to be cautious.

  But note: sometimes the tag might not match the desired interpretation. We must be honest when the interpretation the client wants isn't available.

  The procedure should have steps:

  1. Identify the quantity we are asked to price (the event).
  2. Assign a source type (F, C, J, M) based on available data/mechanism.
  3. Determine the available interpretations for that source type and whether they match the client's implicit or explicit request (if the client wants a "real" chance, but we only have a subjective one, we must note that).
  4. Generate the number according to the interpretation.
  5. Formulate the verbal explanation.

  Additionally, we want to flag steps that involve judgment and note where two honest people might still disagree.

  We'll then apply this to the three examples.

  ---

  **Decision Procedure Form**

  *Event Description:*
  [ ]

  *Client's implicit or explicit expectation (if known):* 
  [ ] A "real" chance (like a physical propensity) 
  [ ] A frequency-based probability 
  [ ] A degree of belief 
  [ ] Not sure / doesn't specify

  *Step 1: Assign Source Type (F, C, J, M)*
  - F: We have a large historical reference class of similar events.
  - C: The event is the outcome of a known random mechanism (e.g., a die roll, component failure with known distribution).
  - J: Judgment call - no reference class or known mechanism, one-off event.
  - M: Output of a model (e.g., machine learning, actuarial model) but the model's basis is not entirely clear.

  *Step 2: Map to Interpretation and Check Availability of Desired Interpretation*
  - If F: 
    - Available interpretation: frequentist (long-run frequency).
    - Can we provide a "real" chance? Not necessarily, unless the event is part of a long-run sequence. But we can provide a frequency-based estimate.
  - If C:
    - Available interpretation: propensity (inherent tendency of a system to produce an outcome).
    - Can provide a "real" chance if the mechanism is well-understood and stable.
  - If J:
    - Available interpretation: subjective/Bayesian (degree of belief).
    - Cannot provide a "real" chance or a frequency (unless we can construct a reference class, but by definition, J has no obvious reference class).
  - If M:
    - We must dissect the model:
      - If the model is based on frequency data (like an actuarial model built on past claims), then it's F.
      - If the model is based on a known mechanism (like a physics-based failure model), then it's C.
      - If the model is a black box (like a neural network) and we don't know the basis, then we must treat it as J (subjective) because the output is effectively a model-based judgment.

    But note: M might be a mix. We must trace the model's foundation.

    After tracing:
      - If the model is F-based -> frequentist
      - If the model is C-based -> propensity
      - Otherwise (e.g., expert opinion encoded, or black box without clear foundation) -> subjective

  *Step 3: Generate the Number*
  - Frequentist (F): 
    - Use the historical frequency: count of events / total exposures in the reference class.
    - Uncertainty: Provide a confidence interval if possible and if requested.
  - Propensity (C):
    - Use the theoretical model (e.g., exponential distribution with given failure rate).
    - Uncertainty: If parameters are estimated from data, then we might use a Bayesian approach to incorporate parameter uncertainty, but the core is the propensity.
  - Subjective (J and M when not F or C):
    - Use structured judgment: e.g., Delphi method, expert elicitation, or a scoring model that combines factors.
    - Uncertainty: We might express a range (e.g., 0.10 to 0.30) or a distribution.

  *Step 4: Communication to Client*
  - Frequentist: "Based on historical data from similar cases, we estimate the probability to be [number]. This reflects the frequency we have observed in the past, but note that your specific case may differ."
  - Propensity: "Based on the known failure mechanism and the manufacturer's specifications, we calculate the probability to be [number]. This is the inherent chance of failure for this type of system."
  - Subjective: "Based on expert assessment of the specific factors in this case, we assign a probability of [number]. This represents our degree of belief in the event occurring, considering all available information."

  *Step 5: Flagging Judgment and Disagreement Potential*
  - In every step, note where judgment is involved (even in F: defining the reference class; in C: assuming the mechanism; in J: obviously; in M: model selection and interpretation).
  - Steps that are judgment-heavy (especially J and some M) will have high potential for disagreement. Also, in F and C, if the reference class is debatable or the mechanism is not perfectly known, there can be disagreement.

  *Step 6: When We Cannot Provide What the Client Wants*
  - If the client wants a "real" chance (propensity or frequency) but we only have a subjective assessment, we must be clear: "We cannot provide a well-defined objective probability for this event because it is a one-off situation without a clear underlying random mechanism or sufficient historical data. However, we can provide a subjective assessment based on expert judgment."

  ---

  Now, apply to the three recurring items:

  **Example 1: The chance that a specific named supplier defaults within 18 months.**

  - *Source Type*: We have a small pool of similar suppliers. But is the named supplier exchangeable with the others? This is contentious. So we might tag it as F if we consider the pool as a reference class, but if the team disagrees on exchangeability, then it's more like J.

    Let's break down:

    - If we consider the pool as a reference class (F), then we can compute the historical default rate. But if the named supplier is not similar (e.g., different financials, size, etc.), then we might need to adjust. That adjustment is judgment (so becomes J or a mix).

    - Alternatively, we might build a model (M) that uses financial indicators to predict default. Then it's M.

    - However, the problem states: "we have a small pool of similar suppliers, and the team keeps fighting over whether they're even exchangeable". So:

      - If we force a tag: It might be F if we decide to use the pool, but then we have to note that the exchangeability is questionable. Alternatively, if we don't have enough data for a model, it might be J.

    Since the team is fighting, it suggests that the reference class is not clearly appropriate. Therefore, we might tag as J (because the reference class is not agreed upon) or M if we have a model.

    Let's assume we have a model (M) that uses the pool and adjusts for factors. Then we go to Step 2 for M.

    - Step 2: The model (M) is based on historical data (the pool) and possibly other factors. So we trace: if the model is a statistical model (like logistic regression) using historical defaults, then it's F-based. But if the model includes expert adjustments, then it's partially subjective.

    We'll say the model is primarily F-based (if it's data-driven) but with potential judgment in feature selection and model fitting. So we can treat it as F, but with a caveat.

    However, if the model is not well-calibrated or the data is thin, then we might have to fall back to J.

    Given the small pool, we might not have a robust model. So we might have to admit:

      - We can provide a frequentist estimate from the pool, but note the limitations (small sample, possible lack of exchangeability). Or we can provide a subjective adjustment.

    *Conclusion for Example 1*: We can provide a frequentist estimate with a large margin of error, but we must be clear about the limitations. Alternatively, if we don't trust the reference class, we might have to use a subjective assessment. 

    *How to communicate*: 
      - If using F: "Based on the historical default rate of similar suppliers, we estimate the probability at X. However, note that this supplier may not be exactly comparable and our data is limited, so the true probability could be significantly different."
      - If we cannot use F: "Because this supplier is unique and we lack a clear reference class, we are providing a subjective assessment based on expert judgment. Our assessment is X."

    *Which interpretation can we provide?* We can attempt a frequentist one, but if the client wants a "real" chance (propensity) for this specific supplier, we cannot provide that because there's no clear mechanism (it's a business event). We can only provide frequency (if we use the class) or subjective.

    *Disagreement potential*: High, because of the exchangeability debate.

  **Example 2: The chance that a particular industrial press fails in the next 30 days given its age and usage.**

  - *Source Type*: We have lots of failure-time data for similar presses. So we can build a model (M) that uses age and usage to predict failure. But note: we have data, so it's F-based? However, we are asked about one machine. 

    - We can use a survival model (like Weibull) that is fitted to the historical data (F) and then applied to this machine. So the model (M) is built on F.

    - Step 2: The model is F-based -> frequentist. But note: we are conditioning on this machine's age and usage, so the reference class is machines with similar age and usage. If we have enough data in that stratum, then it's F. Otherwise, we might rely on the model's extrapolation, which introduces judgment.

    However, the problem says "we have lots of failure-time data", so we can form a reference class of similar machines (by age and usage). Therefore, we can use F.

    Alternatively, if we have a known failure mechanism (e.g., the press fails when a certain part wears out, and we have a distribution for that part's lifetime), then it could be C.

    But the description says "given age and usage", so we are using data, not a physical model. So we'll go with F.

    *How to generate*: From historical data, compute the failure rate within 30 days for presses of the same age and usage (or use a survival model to estimate the conditional probability).

    *Communication*: "Based on the failure rates observed in our database for industrial presses of similar age and usage, we estimate the probability of failure in the next 30 days to be [number]."

    *Can we provide a "real" chance?* The client might want a propensity (the inherent chance for this press). We can argue that the historical data reflects the propensity (if we believe the presses are identical and the conditions are stable). But note: each press might have individual differences. So we can say: "This is an estimate based on similar presses. The actual chance for this specific press might vary due to unobserved factors."

    *Disagreement potential*: Medium. We might disagree on the definition of the reference class (how similar? what age and usage bands?) or the model used.

  **Example 3: The chance that a specific pending bill becomes law.**

  - *Source Type*: This is a political call. There is no reference class (every bill is unique) and no known random mechanism. It's a judgment call (J).

    - Step 2: J -> subjective.

    *How to generate*: Expert judgment, possibly using a structured method (e.g., scoring based on factors: party support, public opinion, etc.). But it's still subjective.

    *Communication*: "We assign a probability of [number] based on expert assessment of the political landscape. This represents our degree of belief that the bill will become law, given the current information."

    *Can we provide a "real" chance?* No. The client might want one, but there is no objective frequency or propensity. We must be clear that this is subjective.

    *Disagreement potential*: High. Different experts will have different opinions.

  ---

  Now, which one of these are we going to say we can't price the way the client wants?

  The client might want a "real" chance (objective probability) for:

  - Example 1: We can provide a frequency (if we use the reference class) but we have to note the issues. However, if the client insists on a propensity (the inherent chance for this specific supplier), we cannot provide that because we don't have a mechanistic model. So we must explain the limitation.

  - Example 2: We can provide a frequency that approximates the propensity. We might be able to satisfy the client.

  - Example 3: We cannot provide a "real" chance at all. We can only give a subjective assessment.

  Therefore, **Example 3** is the one where we cannot provide an objective probability. We must refuse to give an objective number and only provide a subjective one.

  But note: the procedure says we can still give a number, but we must be clear about what it means.

  So the answer: We can price all three, but for Example 3 we cannot give an objective probability (only subjective). For Example 1, we can give a frequency but it comes with caveats. For Example 2, we can give a frequency that is close to what the client might want.

  However, if the client for Example 1 wants a propensity and we don't have a mechanistic model (we don't), then we cannot provide that. Similarly, Example 2 we can present as propensity if we believe the historical data reflects the inherent chance, but if not, we have to be cautious.

  But the one where we definitely cannot provide a "real" chance (propensity) is Example 3.

  ---

  **Summary of the Procedure**

  We design a form with the following:

  1. Event description.
  2. Client's expectation (if known) about the kind of probability.
  3. Source type (F, C, J, M) - choose one.
  4. Interpretation (frequentist, propensity, subjective) based on source type and model foundation (if M).
  5. Check: Can we meet the client's expectation?
     - If the client wants a "real" chance (propensity) and we have C, yes.
     - If the client wants a frequency and we have F, yes.
     - If the client wants a degree of belief, we can always provide that (subjective).
     - Otherwise, we cannot meet the expectation and must note the discrepancy.
  6. Method to generate the number (with formulas or procedures).
  7. Communication script.
  8. Flags for judgment steps and potential for disagreement.

  This should help structure the process and reduce arguments by making the assumptions explicit.
answer: |-
  Below is a decision procedure designed as a form to resolve your team's recurring disputes. It maps your existing source-type tags (F, C, J, M) to probability interpretations, guides number generation, and provides communication scripts. The procedure explicitly flags where judgment creeps in (even in "objective" methods) and where disagreements are unavoidable. It also identifies when the client's desired interpretation (e.g., a "real" chance) isn't available.

  ---

  ### **Probability Assignment Decision Form**
  *Fill this out for each requested probability. Answer sequentially.*

  #### **1. Event Description:**
     - [ ] *What specific event are we pricing? (e.g., "Supplier X defaults within 18 months")*

  #### **2. Source Type (Tag Selection):**
     - **F** (Historical frequency): Large reference class of similar past events.  
       *e.g., Claim frequency for a policy class.*
     - **C** (Chance setup): Known mechanism with inherent randomness (e.g., physics, engineering).  
       *e.g., Component failure with rated distribution.*
     - **J** (Judgment call): One-off event with no clear reference class or mechanism.  
       *e.g., Competitor's strategic decision.*
     - **M** (Model output): Number from a black-box/model; source unclear.  
       *e.g., ML model output without interpretability.*  
     - **Selected Tag**: [ ] F | [ ] C | [ ] J | [ ] M  
       *If uncertain, default to J.*

  #### **3. Client's Implicit Request (If Known):**
     - [ ] "Real" chance (objective propensity/frequency)  
     - [ ] Degree of belief (subjective)  
     - [ ] Unspecified  

  #### **4. Interpretation & Entitlement Check:**
     *Based on the tag, what can we claim?*  
     - **F** → **Frequentist**: *Long-run frequency from historical data.*  
       - Can provide a "real" frequency? **Yes**, *if reference class is valid*.  
       - Judgment alert: **Defining reference class** (e.g., what counts as "similar"?).  
     - **C** → **Propensity**: *Inherent tendency of a system (e.g., physics-based).*  
       - Can provide a "real" chance? **Yes**, *if mechanism is stable and understood*.  
       - Judgment alert: **Assuming mechanism applies** (e.g., ignoring wear-and-tear).  
     - **J** → **Subjective/Bayesian**: *Degree of belief based on expert judgment.*  
       - Can provide a "real" chance? **No** — *this is not an objective probability*.  
       - Judgment alert: **Inherently judgment-based** (no way around it).  
     - **M** → **Trace the model**:  
       - Model based on **F**? → **Frequentist** (with caveats).  
       - Model based on **C**? → **Propensity** (with caveats).  
       - Model is black-box/heuristic? → **Subjective** (treat as J).  
       - Judgment alert: **Model selection/interpretation** (e.g., why trust this model?).  

     **Entitlement Conclusion**:  
     - If client wants a "real" chance but we have **J/M (subjective)**: **We cannot comply** — explain why.  
     - If client wants "degree of belief" and we have **F/C**: We can provide both number + context.  

  #### **5. Generate the Number:**
     *Methods per interpretation. Flag where disagreement is unavoidable.*  
     - **Frequentist (F)**:  
       - `Probability = (Past occurrences) / (Total exposures in reference class)`  
       - *Disagreement source*: **Reference class definition** (e.g., which data counts?).  
     - **Propensity (C)**:  
       - `Probability = Output of mechanism-based model (e.g., survival function)`  
       - *Disagreement source*: **Parameter validity** (e.g., is the failure rate constant?).  
     - **Subjective (J/M)**:  
       - Use **structured judgment**:  
         1. *Expert Delphi*: Average of anonymous estimates.  
         2. *Weighted scoring*: Rate factors (e.g., regulator bias: 0.7, industry pressure: 0.3).  
       - *Disagreement source*: **Expert weights/estimates** (irreducible differences).  

  #### **6. Communication Script:**
     *Tailor to interpretation. Bold = non-negotiable phrasing.*  
     - **Frequentist**:  
       *"Based on **historical data** from [reference class], we estimate a **frequency** of [number]. This reflects past outcomes; **your case may differ**."*  
     - **Propensity**:  
       *"Based on the **inherent mechanism** of [system], we calculate a **propensity** of [number]. This assumes [mechanism] is stable and **applies here**."*  
     - **Subjective**:  
       *"Based on **expert judgment** weighing available evidence, we assign a **degree of belief** of [number]. This is **not a 'real' chance** and may change with new information."*  

  #### **7. Limitations & Conflict Flags:**
     - **Judgment steps**: Always present (even in F/C). Highlight in **bold** in the form.  
     - **Unavoidable disagreements**: Occur at:  
       - Reference class boundaries (F).  
       - Mechanism applicability (C).  
       - Expert estimates (J).  
       - Model trust (M).  
     - **Can't satisfy client?** When they want a "real" chance but we only have subjective (J/M). Refuse and explain.  

  ---

  ### **Application to Your Recurring Items**
  **Key**:  
  ✅ = Can provide number with interpretation.  
  ⚠️ = Can provide number but with major caveats/overclaim risk.  
  ❌ = Cannot provide client's desired "real" chance.

  #### **1. Supplier Default (Named supplier; small pool of "similar" suppliers)**  
     - **Tag**: **F** (if using pool) or **J** (if supplier is unique).  
     - **Entitlement**:  
       - If treated as F: Frequentist frequency.  
       - *But*: **Reference class is disputed** (exchangeability debate). Judgment alert!  
       - Client likely wants a "real" chance → ❌ **Not fully possible** (no propensity; frequency is debatable).  
     - **Generate Number**:  
       - If F: `Default rate of similar suppliers` (e.g., 2/10 defaults → 0.20).  
       - *Disagreement*: **Which suppliers are "similar"?** Unavoidable.  
     - **Communication**:  
       *"Based on historical defaults in a pool of suppliers we judge as similar, we estimate a frequency of 0.20. **This assumes your supplier is exchangeable with the pool**; if not, the true probability could differ."*  
     - **Verdict**: ⚠️ (Can give number, but high conflict risk; can't provide "real" chance).

  #### **2. Industrial Press Failure (Specific machine; lots of failure data)**  
     - **Tag**: **F** (reference class: same age/usage presses).  
     - **Entitlement**: Frequentist frequency. Can approximate a "real" chance (propensity) if mechanisms are stable. ✅  
     - **Generate Number**:  
       - `Conditional failure rate` (e.g., from survival model: 5% of similar presses fail in 30 days → 0.05).  
       - *Disagreement*: **Data stratification** (e.g., how granular are age/usage bands?).  
     - **Communication**:  
       *"Based on failure rates in historical presses of the same age and usage, we estimate a frequency of 0.05. **This may approximate an inherent propensity**, but unobserved factors could affect this specific machine."*  
     - **Verdict**: ✅ (Best-case; minimal judgment in number generation).

  #### **3. Pending Bill Becomes Law (Political decision)**  
     - **Tag**: **J** (no reference class/mechanism; one-off).  
     - **Entitlement**: Subjective belief only. ❌ **Cannot provide "real" chance** (no frequency or propensity).  
     - **Generate Number**:  
       - Structured judgment (e.g., expert Delphi: avg. of 0.25, 0.40, 0.30 → 0.32).  
       - *Disagreement*: **Expert estimates** (e.g., one analyst says 0.10, another says 0.60). Unavoidable.  
     - **Communication**:  
       *"Based on expert assessment of political factors, we assign a degree of belief of 0.32. **This is not an objective probability**; it reflects our judgment given current information."*  
     - **Verdict**: ⚠️ (Can give number, but must refuse if client demands "real" chance).

  ---

  ### **Which One Can't We Price as the Client Wants?**
  **Example 3 (Pending Bill)**.  
  - **Why**: The client likely wants a "real" chance (propensity or frequency), but this is a one-off political event with no reference class (F) or mechanism (C). We can only offer a subjective belief (J), which isn't a "real" chance. Refuse to frame it as objective.

  ---

  ### **Critical Limitations of This Procedure**
  1. **Judgment is everywhere**:  
     - Defining reference classes (F), trusting mechanisms (C), scoring judgments (J), or interpreting models (M) all involve subjectivity. Label these steps **in red** on the form.  
  2. **Disagreements it can't resolve**:  
     - Two honest people will **always disagree** on:  
       - Reference class boundaries (F).  
       - Model validity (M).  
       - Subjective estimates (J).  
     - The procedure only forces transparency about *why* you disagree—not consensus.  
  3. **Can't force consensus**: If your team disputes exchangeability (e.g., Supplier Default), the form flags it but won't solve it. Default to J and communicate uncertainty.  
  4. **Client expectations**: If they demand a "real" chance for J/M events, the procedure empowers you to say no.  

  ---

  ### **Implementation Tips**
  - **Run the form as a checklist** in every job. Have all 4 team members fill it independently, then compare Step 4 (Entitlement) and Step 5 (Generation) to surface conflicts early.  
  - **For "M" tags**: Require model documentation (e.g., "Is this model built on F or C?"). If unanswerable, treat as J.  
  - **Track disagreements**: Log where conflicts occur (e.g., "Step 5, Supplier Default: 2 votes for F, 2 for J"). This data helps refine your approach.  

  This procedure won’t eliminate all arguments—probability is inherently contested—but it will make your assumptions explicit, reduce circular debates, and prevent overclaiming to clients. When in doubt, **default to J and communicate subjectivity**.
