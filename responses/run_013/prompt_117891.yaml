answer: |-
  ### Prep Dossier: Loop-First Content for EEB Seminar  

  #### 1. Room Read (Pre-Objections)  
  Biologists hear "content" as suspiciously mentalistic baggage smuggled into signal evolution—for them, it implies unmeasurable "aboutness" detached from behavioral triggers. The Fodorian philosopher expects crisp causal chains locking content to specific producers and will dismiss loop-talk as evasion. The enactivist hears unnecessary reification of a control process best described dynamically. All three groups will instinctively recoil at "representation" as either too vague (biologists), too weak (Fodorian), or redundant (enactivist).  

  #### 2. Upfront Concessions/Pre-emptions  
  **Concede immediately:** "I am *not* claiming brains 're-present' the world internally—drop that word if it misleads. Forget neural representations." **Pre-empt:** "This is *not* psychology—it’s a formal account of how task functions constrain signal use. ‘Loop’ means a measurable sensorimotor pathway with fitness consequences."  

  ---

  #### 3. Objections by Source (Ordered by Damage: ★ = Low, ★★ = Medium, ★★★ = High)  

  **A. Signalling Biologist (Function/Measurability)**  
  *Objection:* "You say loops are selected, but we measure selection on *traits*. How do I quantify this ‘error space’ for, say, bird alarm calls? Your crustacean example sounds like two traits with one function—why isn’t that sufficient?"  
  - *Damage:* ★★★ (They’ll see this as hand-waving biology; undermines empirical credibility)  
  - *Reply:* "Treat the loop as the trait. Error space is the range of contexts where the response *reliably fails*—e.g., in bird studies, play calls in non-predatory contexts and measure fitness dips. Two-channel crustacean shows one function (avoid flatworms) split across redundant inputs—content unifies them."  
  - *Soft spot:* "But redundancy isn’t unity—what if one channel evolves separately?"  

  **B. Fodorian Philosopher (Indeterminacy)**  
  *Objection:* "Your dual-role insect: one hunger state with two contents? That violates compositionality. If the state ‘means’ foraging-risk *and* brood-risk, how does the insect avoid conflating them? Asymmetric dependence fixes this."  
  - *Damage:* ★★★ (Exposes indeterminacy; room will see it as fatal inconsistency)  
  - *Reply:* "Compositionality isn’t primitive—it’s built via loop interaction. The hunger state’s content is *context-bound*: in foraging loop, it means ‘energy deficit’; in brood loop, ‘colony resource deficit.’ No conflation because loops are separate."  
  - *Soft spot:* "But the *state* is identical—you’ve made content observer-relative!"  

  **C. Signalling Biologist (Function)**  
  *Objection:* "Selection acts on variation. If a loop has no variants (e.g., fixed foraging paths), how can it be ‘selected for’? Your account needs historical contingency we can’t test."  
  - *Damage:* ★★ (Questions evo-bio foundations; biologists nod)  
  - *Reply:* "Even fixed loops persist *because* they avoid error spaces—e.g., ants following pheromone paths face selection if paths lead to dehydration. Stability reflects sustained avoidance of maladaptivity."  
  - *Soft spot:* "That’s just ‘not broken’—not selected *for* anything."  

  **D. Enactivist Philosopher (Indeterminacy/Redundancy)**  
  *Objection:* "Why call this ‘content’? Your loop is sensorimotor regulation. Calling avoidance of error ‘representation’ adds nothing—it’s just dynamics. Your dual-role case proves it’s context-bound coping."  
  - *Damage:* ★★ (Gives enactivist a platform; sways biologists)  
  - *Reply:* "Because misrepresentation *matters*: when the crustacean’s vibration-detector fires sans flatworm, it ‘gets it wrong’—this explanatory gap needs content. Dynamics don’t capture error."  
  - *Soft spot:* "But ‘wrong’ just means ‘fitness cost’—no semantics needed."  

  **E. Fodorian Philosopher (Function)**  
  *Objection:* "If content is fixed by avoiding maladaptivity, doesn’t *everything* a state avoids become content? E.g., a mouse’s fear state ‘means’ cats, hawks, *and* falling rocks if all trigger flight. That’s no content at all."  
  - *Damage:* ★★ (Highlights indeterminacy; feels like a reductio)  
  - *Reply:* "No—only what’s *specifically* avoided by the loop’s design. Mouse flight loops are selected to avoid predation-error-space (e.g., claws, talons), not earthquakes (too rare). Content is constrained by historical selection pressures."  
  - *Soft spot:* "But ‘specifically’ is vague—what excludes rare threats?"  

  **F. Corridor Objection (Post-Talk, Skeptical Biologist)**  
  *Objection:* "This justifies anthropomorphism. If a plant’s phototropism ‘loop’ avoids shade-error-space, does it ‘represent’ light? That stretches ‘representation’ to nonsense."  
  - *Damage:* ★★ (Feeds ‘slippery slope’ narrative; corridor ambush)  
  - *Reply:* "Only if the loop involves state-mediated responses with alternative outcomes—e.g., no ‘state’ in tropism, just direct growth. My account requires decoupled producer/consumer states."  
  - *Soft spot:* "Define ‘decoupled’ without neuroscience."  

  ---

  #### 4. Survivable Objections  
  - **"Learning isn’t selection—reinforcement isn’t heredity."** Survivable because she concedes it’s weak; stress it’s a *formal analogy* for stability, not literal selection.  
  - **"Error-space content is too coarse-grained."** Survivable: bite the bullet—coarse content *is* biologically realistic (e.g., crustacean case unifies signals).  
  - **"Why not define content by success, not error?"** Survivable: flip it—success is plural (e.g., eating/not-poisoned), error is singular (e.g., poisoned), so error fixes content tighter.  

  #### 5. The Dangerous Question  
  *Question:* "In your dual-role insect, what happens if hunger triggers brood-tending in a famine? The response is adaptive (saves energy) but ‘wrong’ per foraging-loop content. Is this misrepresentation?"  
  - **Why dangerous:** Exposes tension between adaptivity and truth—threatens to collapse her account into pragmatism.  
  - **Best reply:** "Yes—it misrepresents *for the foraging loop*. Content is loop-relative, so one loop’s truth is another’s indifference."  
  - **Cost:** Admits content can be ‘true’ while globally maladaptive (e.g., energy saved but colony starves), alienating biologists who see adaptation as holistic.  

  #### 6. Forbidden Sentences  
  - **"This solves the disjunction problem."** (Fodorian will eviscerate: "No, your error-space *is* disjunctive!")  
  - **"Selection targets the loop’s *real* function."** (Biologists pounce: "‘Real’? We measure traits, not metaphysics!")  

  ---  
  **Final note:** Anchor replies to *crustacean* (unifies content) and *insect* (relativizes content)—they’re your best concrete leverage. When pressed, say: "Measure the loop’s error-boundary."
