  - Biologists know etiological functions but are skeptical about applying them to psychology
  - Everyone hates jargon and wants measurable concepts
  - Nobody else knows teleosemantics literature
  - Philosophers have diametrically opposed views on representation

  For the room read (part 1): Biologists will hear "content" as vague mentalism, the Fodorian will expect causal-covariance chains, the enactivist will hear unnecessary reification. All will want operational definitions.

  For upfront concessions (part 2): She must surrender "representation" if pressed, disavow neural representations, and clarify that "loop" means measurable sensorimotor pathway. This pre-empts enactivist objections and biologist skepticism.

