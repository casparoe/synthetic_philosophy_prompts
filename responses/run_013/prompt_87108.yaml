prompt: |-
  I do cost-effectiveness work for a public health insurer — when a drug comes up for coverage I run the numbers, and the numbers are QALYs, which means at the end of the day I'm adding up years of life across people and funding whatever comes out biggest. Some patient groups have started pushing back on this, and one of them sent a long letter I can't really argue with: they say our method treats the population like it's one person who can trade a bad year here against a good year there, when there isn't any such person — the one who eats the bad year and the one who gets the good year are different people, and the second one's gain doesn't make the first one's loss up to anybody. I basicly agree, which is a problem, because we still have to decide. I get about a week per decision, I'm not a philosopher, and whatever I produce has to go to a committee that signs off.

  So write me a procedure I can actually run on a funding proposal. Questions in order, what a good enough answer to each looks like, where the procedure stops with a no, and — the part I really need — where it stops being technical and becomes a value call the committee has to own out loud. It can't just say never aggregate, because then it's useless and everyone ignores it. I'm pretty sure some kinds of adding-up are the objectionable kind and some aren't, and I can't say what the difference is. One more thing that bugs me: trading a bad year for a good year inside one life is obviously fine, that's just what treatment is, so why is it supposed to be outrageous across two lives? Either there's a real difference there or their isn't, and I'd rather the procedure take a side on that than paper over it.

  The procedure should end by producing a short written justification I can send to the people who lose out, addressed to them specifically. If all I can say is that it's better on the whole, that's the very answer they're already rejecting.

  Then run it on three cases: (a) a cheap drug that gives a small benefit to a huge number of people versus an expensive one that gives a big benefit to a handful; (b) closing a clinic that serves one identifiable group in order to fund something with more QALYs spread thinly across everyone else; (c) a case where the procedure tells me the thing I'm doing right now is the bad kind — don't soften it. And say plainly which steps are arithmetic, which are moral philosophy in a lab coat, and what the procedure can't settle at all.
reasoning: |-
  We are designing a procedure that respects the concern about aggregating QALYs across different persons while still providing a practical decision-making framework. The key insight is that the objection is about interpersonal compensation: one person's loss not being compensated by another's gain. We want to avoid aggregating in a way that ignores the separateness of persons, but we also cannot avoid all aggregation because we must make decisions.

  The procedure will have several steps, each with a specific question. Some steps are technical (arithmetic or evidence-based), and some require value judgments that must be flagged for the committee. The procedure aims to:
  1. Identify when benefits and burdens fall on the same individuals (intrapersonal) versus different individuals (interpersonal).
  2. Avoid aggregating across persons in a way that allows one person's loss to be compensated by another's gain unless specific conditions are met (e.g., consent, prior agreement, or other justifications).
  3. Where aggregation is necessary and interpersonal, require explicit committee approval and justification.

  We will structure the procedure as a flowchart of questions. It stops with a "no" (i.e., do not fund) if the proposal fails certain tests. Otherwise, it proceeds to the next step until a decision is reached. The justification must be transparent, especially when we are making a trade-off that affects different groups.

  **Procedure Steps:**

  1. **Question 1: Does the intervention produce net health benefits without creating any losers?**  
     - *Explanation*: If the intervention improves health for some without making anyone worse off (a Pareto improvement in health), then it is unproblematic.
     - *Good enough answer*: Evidence shows that no one is left worse off in terms of health (QALYs) than before, and at least one person is better off.
     - *Stop with a no?* If the answer is no, we move to the next question. If yes, then fund and stop.
     - *Technical or value?* Mostly technical (evidence-based) but note: we are only considering health effects (QALYs). Non-health effects (like financial) are not considered in this step.

  2. **Question 2: Are the losses and gains concentrated on the same individuals?**  
     - *Explanation*: If the same person who bears the burden (e.g., a temporary side effect) also receives the benefit (e.g., cure of disease), then it is intrapersonal and acceptable. This is the typical case for most treatments.
     - *Good enough answer*: The individuals who experience the negative effects (loss of QALYs) are the same as those who get the positive effects (gain of QALYs) over the course of the intervention.
     - *Stop with a no?* If the answer is yes, then fund and stop (because it's intrapersonal). If no, move on.
     - *Technical or value?* Technical: it's about identifying the same individuals.

  3. **Question 3: Is the intervention addressing a life-threatening condition for a group with no alternative treatment, and does it provide a substantial benefit to that group?**  
     - *Explanation*: This step considers the severity of the condition and the availability of alternatives. If the group facing the condition is at risk of death or severe disability and there is no other treatment, then the benefit might be prioritized even if it comes at a cost to others. However, note that this step may involve taking resources from others, so we must be cautious.
     - *Good enough answer*: The condition is life-threatening or causes severe disability (e.g., without treatment, life expectancy is severely reduced or quality of life is very poor). There are no alternative treatments. The benefit is substantial (e.g., significant extension of life or improvement in quality of life).
     - *Stop with a no?* If the answer is yes, then we move to Question 4 (because we are considering funding despite interpersonal trade-offs). If no, then we move to Question 5.
     - *Technical or value?* Technical in identifying the condition and alternatives, but the threshold for "substantial" may involve value judgment. We can set a technical threshold (e.g., at least 5 QALYs per person) but the committee must agree on what is substantial.

  4. **Question 4: Can the burden on others be justified by the urgency and lack of alternatives?**  
     - *Explanation*: This step requires a value judgment. We are considering taking resources from one group (who will lose QALYs) to give to another group (who gain a lot). We require that the loss to the losers is not catastrophic (i.e., not leading to severe harm or death) and that the gain to the beneficiaries is life-saving or prevents severe harm. Additionally, we require that the burden is distributed fairly (e.g., not targeting a vulnerable group) and that the overall health system goals are met.
     - *Good enough answer*: The committee must explicitly weigh the benefits and burdens and determine that the gains to the severely affected group are of such moral importance that they outweigh the losses to others. The losses must not be so severe as to push the losers into a similarly catastrophic situation.
     - *Stop with a no?* If the committee cannot justify the trade-off, then the answer is no. If they can, then fund with a justification that acknowledges the trade-off.
     - *Technical or value?* Value judgment: the committee must own this.

  5. **Question 5: Is the intervention cost-effective under a strict per-person equity adjustment?**  
     - *Explanation*: This step applies when the prior steps have not led to a decision. We adjust the standard QALY calculation to give extra weight to QALYs for disadvantaged groups (e.g., those with severe conditions, or from marginalized communities) and then see if the intervention is cost-effective. The adjustment must be based on a predefined equity weighting scheme that the committee has approved in advance.
     - *Good enough answer*: Using the predefined equity weights, the cost per QALY falls below the threshold. The equity weights must be set by the committee in a separate process and applied consistently.
     - *Stop with a no?* If the equity-adjusted cost per QALY is above the threshold, then do not fund. If below, then fund.
     - *Technical or value?* The adjustment is technical once weights are set, but setting the weights is a value judgment (done in advance).

  6. **Question 6: If none of the above, then do not fund.**  
     - *Explanation*: The intervention involves interpersonal aggregation that cannot be justified by the above steps.

  **Justification for the Decision:**
  The written justification must be addressed to the group that loses out. It should:
  - Acknowledge the loss they will bear.
  - Explain the reason for the decision in a way that is honest and transparent about the trade-off.
  - If the decision was made at a step that required a value judgment (especially Step 4), state that the committee considered the trade-off and made a difficult choice based on the urgency and severity for the other group.
  - If the decision was made at Step 5, explain that the decision was based on a predefined equity adjustment that aims to address health inequalities.

  **Running the Cases:**

  **Case (a): Cheap drug that gives small benefit to a huge number vs. expensive drug that gives big benefit to a few.**

  - Step 1: Not a Pareto improvement (if we fund the expensive drug, the huge number loses the small benefit; if we fund the cheap one, the few lose the big benefit). So no.
  - Step 2: Not the same individuals (the beneficiaries and the losers are different). So no.
  - Step 3: For the expensive drug: if the few have a life-threatening condition and no alternative, and the benefit is substantial, then we proceed to Step 4. Otherwise, we go to Step 5.
    - Let's assume the expensive drug is for a rare, life-threatening condition with no alternative and offers a cure (substantial benefit). Then we go to Step 4.
  - Step 4: The burden on the huge number is the loss of a small benefit (e.g., a minor improvement in quality of life). The gain for the few is life-saving. The committee must decide: is it justified to forgo a small benefit for many to save a few lives? 
    - The committee may say yes, because the loss to the many is minor and the gain to the few is life-saving. Then fund the expensive drug.
    - Justification to the losers (the huge number): "We chose to fund a treatment for a life-threatening condition that has no alternative. The treatment offers a cure to a small group of patients. This means we cannot fund the drug that would have given you a minor improvement. We acknowledge that you will not receive this benefit, but the alternative was to allow the other group to face severe harm or death. We made this difficult choice because we believe that saving lives in such circumstances is a priority."

  **Case (b): Closing a clinic that serves one identifiable group to fund something with more QALYs spread thinly across everyone else.**

  - Step 1: Not Pareto (the identifiable group loses the clinic, others gain). No.
  - Step 2: Not the same individuals. No.
  - Step 3: The clinic closure may cause harm to the identifiable group. If the clinic is providing essential care for a severe condition without alternative, then we might consider Step 4. But note: we are taking away an existing service. This is a loss for the group. The gain is for everyone else.
  - Step 4: We must ask: is the harm to the identifiable group severe? If the clinic closure leads to loss of life or severe disability for that group, and the gain for others is small (e.g., minor preventive services), then the committee might decide it is not justified. But if the gain for others is substantial and the loss for the group is manageable (e.g., they can access care elsewhere without severe harm), then it might be justified.
    - However, note that the clinic serves an identifiable group, which might be vulnerable. This raises equity concerns.
    - The committee must weigh: the severity of the loss to the group versus the gain to others. 
    - Example: If the clinic serves a remote indigenous community and closure would leave them without any care, leading to deaths, and the alternative is a minor benefit for urban populations, then the committee might not justify it. Do not close the clinic.
    - Justification to the group: If the clinic remains open: "We have decided not to close your clinic because the harm it would cause to your community in terms of loss of essential health services is too severe. We will look for other ways to fund the new program." If closed: "We have made the difficult decision to close the clinic in order to fund a program that provides a broader benefit across the population. We acknowledge that this will cause hardship for your community and we are committed to mitigating this by [specific measures]."

  **Case (c): A case where the current method is the bad kind.**

  Consider a current practice: funding a drug that gives a moderate benefit (say, 1 QALY) to a large group by not funding a more expensive drug that gives a large benefit (say, 10 QALYs) to a small group, simply because the total QALYs in the first scenario are higher (e.g., 1000 QALYs vs. 500 QALYs). This is the standard QALY aggregation that the patient group is objecting to.

  - Step 1: Not Pareto (the small group loses out). No.
  - Step 2: Not the same individuals. No.
  - Step 3: The small group may have a severe condition. If the condition is life-threatening and without alternative, then we proceed to Step 4. But if the condition is not severe (e.g., a chronic but non-life-threatening condition) then we go to Step 5. 
    - In our example, let's assume the small group has a life-threatening condition and no alternative. Then Step 4.
  - Step 4: The committee must justify: the large group loses a moderate benefit (1 QALY each) to save the small group (10 QALYs each). The total QALYs lost by the large group might be 1000 (if 1000 people lose 1 QALY) and the small group gains 500 (50 people gain 10 QALYs). The committee might say: the loss of 1 QALY per person in the large group is not catastrophic, but the gain for the small group is life-saving. However, note that the total QALYs are less (500 vs 1000). But the objection is about interpersonal compensation. The committee might decide that the life-saving for the few is more important than the moderate benefit for the many. 
    - However, in our current practice, we would have funded the large group because of the higher total. But according to this procedure, we might fund the small group instead. 
    - This shows that the current practice (aggregating without regard to distribution) is the "bad kind" and would be rejected by this procedure in favor of funding the small group when their condition is severe.

  **Clarifying the Steps:**

  - Arithmetic: Steps 1 and 2 (if the data is available) and Step 5 (once weights are set) are technical/arithmetic.
  - Moral philosophy in a lab coat: Step 3 (if we have to define "substantial", that might involve value judgment) and Step 4 (explicit value judgment by the committee). Step 5's weights are set by the committee in advance (value judgment) but the application is arithmetic.
  - What the procedure can't settle: If the committee cannot agree on Step 4, then the procedure leads to not funding. Also, the procedure does not address non-health considerations (like financial burden on patients) unless they are incorporated into QALYs or the equity weights.

  **Conclusion:**
  This procedure avoids the problematic aggregation by requiring explicit justification for interpersonal trade-offs. It prioritizes intrapersonal trade-offs and Pareto improvements, and then uses severity and lack of alternatives as a gate to interpersonal trade-offs. The committee must own the value judgments in Step 4 and in setting equity weights. The procedure also produces a transparent justification for the losing group.
answer: |-
  Below is a practical, step-by-step procedure for evaluating funding proposals, designed to address the ethical concern about aggregating QALYs across different individuals. It avoids treating the population as "one person" by prioritizing intrapersonal trade-offs (within a single life) and requiring explicit committee ownership for interpersonal trade-offs (across lives). The procedure limits aggregation to cases where it can be ethically justified, flags value judgments for committee sign-off, and produces a patient-centered justification for losers.

  The procedure is structured as **five sequential questions**. Each question must be answered with evidence; if a "no" or "inconclusive" answer is reached at key steps, the proposal fails unless the committee overrides. Steps 3–5 are where interpersonal aggregation occurs, requiring committee ownership. **Bold text** indicates committee-owned value judgments.

  ---

  ### **Procedure for Funding Evaluation**  
  **Time per proposal:** ~1 week (requires data on QALY impacts, target populations, and severity).  
  **Outputs:** (1) Funding decision (yes/no), (2) Short written justification for affected groups.  

  #### **Question 1: Is the intervention a Pareto improvement in health?**  
  - **Question:** Does the proposal improve health for at least one person without worsening health for anyone else? (Health = QALYs only; ignore financial/access impacts here.)  
  - **Good enough answer:**  
    - *Yes:* Clear evidence that no group loses QALYs (e.g., new funding without reallocation, or gains offset losses for the same group).  
    - *No/Unclear:* Any group loses QALYs, or data is insufficient.  
  - **Stop with a no?** No → Proceed to Q2.  
  - **Technical/Value:** Arithmetic (sum QALYs per group). If yes, fund immediately.  
  - **Justification if funded:** "This improves health for some without harming others."  

  #### **Question 2: Are gains and losses confined to the same individuals?**  
  - **Question:** Do the people experiencing QALY losses (e.g., side effects, delayed care) also receive offsetting QALY gains from the intervention?  
  - **Good enough answer:**  
    - *Yes:* Evidence that losers and beneficiaries are identical (e.g., a drug with short-term discomfort but long-term survival gain).  
    - *No:* Losses fall on one group, gains on another (e.g., defunding Group A to fund Group B).  
  - **Stop with a no?** If yes, fund and stop → **No aggregation needed (intrapersonal trade-off)**.  
  - **Technical/Value:** Technical (demographic/clinical data matching).  
  - **Justification if funded:** "This treats a health trade-off within your own life, like all medical care."  

  #### **Question 3: Does the intervention prioritize severity or urgency?**  
  - **Question:** Does the target group face a severe health burden (e.g., life-threatening, high disability) with no alternatives?  
  - **Good enough answer:**  
    - *Yes:* Target group has: (a) high baseline severity (e.g., <5 years life expectancy, QoL <0.5), (b) no effective treatments exist, and (c) intervention offers large per-person gain (e.g., ≥3 QALYs).  
    - *No:* Condition is non-severe, alternatives exist, or gains are small.  
  - **Stop with a no?** If no → Proceed to Q4. If yes → Proceed to Q5 (committee judgment).  
  - **Technical/Value:** Technical (severity metrics, clinical guidelines).  
  - **Rationale:** Filters for cases where aggregation might be defensible (e.g., rescuing those in dire need).  

  #### **Question 4: Is the cost-effectiveness ratio below threshold after equity weighting?**  
  - **Question:** Using an equity-adjusted QALY (eQALY) calculation, is the cost per eQALY below the insurer's threshold?  
  - **Equity adjustment:**  
    - Apply predefined weights to QALY gains for disadvantaged groups (e.g., severity, socioeconomic status).  
    - *Example weight:* 2x multiplier for QALYs in groups with severity score >X (defined by committee).  
  - **Good enough answer:**  
    - *Yes:* Adjusted cost per eQALY ≤ threshold (e.g., ≤$50,000/eQALY).  
    - *No:* Above threshold.  
  - **Stop with a no?** If no, reject. If yes → Proceed to Q5 (committee approval).  
  - **Technical/Value:** Arithmetic once weights are set. **But weights require committee-defined values** (e.g., "How much extra weight for severity?").  

  #### **Question 5: Can the interpersonal trade-off be publicly justified? (Committee Ownership)**  
  - **Question:** Is the gain for Group B significant enough to morally offset the loss to Group A, given:  
    (a) The absolute burden on losers (not just relative QALYs),  
    (b) Avoidability of harm (could losers be protected?),  
    (c) Consent/fairness (e.g., would losers accept this if behind a "veil of ignorance"?).  
  - **Good enough answer:**  
    - Committee must draft a **public statement** justifying the trade-off, addressing losers directly.  
    - Requires majority vote.  
  - **Stop with a no?** If committee cannot agree on justification → Reject.  
  - **Technical/Value:** **Pure value judgment**. No formulas—committee must defend the ethics.  
  - **Outcome:** Fund only if justification is approved.  

  ---

  ### **Written Justification for Losers**  
  **Template:**  
  > "To [Group A]: We acknowledge this decision causes you harm—specifically [loss details, e.g., reduced access to X]. We did not fund this because [reason from procedure]. [If funded via Q5]: We funded [intervention] for [Group B] because [severity/urgency reasons], and we recognize this prioritizes their needs over yours. This choice reflects our commitment to [ethical principle, e.g., rescuing the most vulnerable], but we take responsibility for the harm to you. We will [mitigation plan, e.g., monitor outcomes]."  

  **Key features:**  
  - Names the losing group and their specific loss.  
  - Distinguishes between technical steps (e.g., "no Pareto improvement") and value calls (e.g., "we prioritized severity").  
  - For Q5 decisions, emphasizes committee ownership.  

  --- 

  ### **Case Applications**  
  #### **Case (a): Cheap drug (small benefit, many) vs. expensive drug (large benefit, few)**  
  - **Q1:** Not Pareto (funding one harms the other).  
  - **Q2:** Not same individuals → Proceed.  
  - **Q3:** If expensive drug targets severe disease (e.g., rare cancer), **yes** → Proceed to Q5. If not, **no** → Q4.  
  - **Q4:** Equity weights may favor severe group if predefined. If not, may fail cost-effectiveness.  
  - **Q5:** **Committee owns the call**. E.g., "We fund the expensive drug because saving a life with no options outweighs small gains for many. Loss to the majority is real, but we prioritize rescuing the most vulnerable."  
  - **Justification to losers:** "We chose not to fund the widely beneficial drug because the alternative rescues patients with no other options. This causes you to lose [small QALY gain], but we deemed the severity of their need more pressing."  
  - **Why not current QALY aggregation?** Standard QALY sums favor the cheap drug (more total QALYs). This procedure *may* reject that if severity justifies it.  

  #### **Case (b): Closing a clinic (serves Group A) to fund population-wide program**  
  - **Q1/Q2:** Not Pareto, not same individuals → Proceed.  
  - **Q3:** If Group A has severe needs (e.g., Indigenous community with high diabetes rates), **yes** → Q5. If not, **no** → Q4.  
  - **Q4:** Unlikely to pass if equity weights favor Group A (e.g., high severity multiplier).  
  - **Q5:** **Committee must justify**. E.g., "Closing the clinic harms Group A, but the population program saves more lives. However, if Group A is marginalized, we reject this trade-off as unfair."  
  - **Justification if rejected:** "We kept your clinic open because closing it would harm a group with high needs and no alternatives, and we cannot justify that loss."  
  - **Why interpersonal trade-off is "bad" here?** Group A's loss (e.g., life-years lost) is *not* compensated by gains to strangers—committee must own this sacrifice.  

  #### **Case (c): Current Practice Fails (e.g., minor gains for many over major losses for few)**  
  - **Scenario:** Fund a drug giving 0.1 QALYs to 10,000 people (total 1,000 QALYs) instead of a drug giving 10 QALYs to 50 high-severity patients (total 500 QALYs). Standard QALY aggregation funds the first.  
  - **Q1/Q2:** Not Pareto, not same individuals → Proceed.  
  - **Q3:** High-severity group has no alternatives → **yes** → Q5.  
  - **Q5:** **Committee must confront the trade-off**. If they fund the minor-gains drug: "We prioritize total QALYs, so your loss as a high-severity patient is offset by many small gains." But this is *exactly* the objectionable aggregation! Procedure forces committee to own it or reject it.  
  - **Outcome:** Committee might reject current practice, saying: "We cannot justify letting 50 people die to give minor benefits to 10,000. The gain doesn't compensate the loss to you."  
  - **Justification to high-severity losers:** "We defunded your treatment because standard QALY math favored a larger group. We recognize this sacrifices your survival for others' small gains—a choice we now question."  

  --- 

  ### **What the Procedure Solves (and Doesn't)**  
  - **Arithmetic steps:** Q1 (summing QALY changes), Q2 (matching losers/beneficiaries), Q4 (equity-weighted cost-effectiveness).  
  - **Moral philosophy in a lab coat:** Q3 (defining "severity," "no alternatives"), Q4 (setting equity weights).  
  - **Pure value judgments (committee-owned):** Q5 (justifying interpersonal trade-offs).  
  - **Can't settle:**  
    - Non-health impacts (e.g., financial hardship).  
    - How to set equity weights (requires separate committee process).  
    - Disagreements on "fairness" in Q5—procedure ensures transparency, not consensus.  

  ### **Key Differences: Intrapersonal vs. Interpersonal Trade-offs**  
  The procedure **takes a side**:  
  - **Intrapersonal trades (same person) are fine** (Q2 pass)—they align with medicine's goal of net benefit for an individual.  
  - **Interpersonal trades (different people) are not automatically fine**—they require scrutiny at Q3–Q5. The ethical difference is that in intrapersonal trades, the person consents to short-term loss for long-term gain (e.g., chemo). In interpersonal trades, losers don't consent and aren't compensated; committee ownership (Q5) makes this explicit.  

  This ensures aggregation only occurs when:  
  1. Gains/losses are intrapersonal (Q2), or  
  2. Interpersonal trades are justified by severity (Q3) or equity weights (Q4), and publicly owned (Q5).  

  ---  
  **Final note:** This procedure forces committees to confront the ethics of aggregation. If they approve Q5, they must write to losers honestly—no hiding behind "overall benefit." Use pre-defined equity weights and severity thresholds (from committee guidance) to reduce subjectivity. Revise weights annually based on stakeholder input.
