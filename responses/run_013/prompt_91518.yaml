   The tree will have branch nodes that are questions answerable from evidence, and leaves that are named diagnoses with a one-sentence note on the most awkward commitment (i.e., what you must accept for that diagnosis to hold).

   We also need to lay out the logical space first. We'll consider the following underlying dimensions:

   1. **Failure location**: Where does the failure occur?
       - In the objective we specified (proxy isn't aligned with true goal) vs. in what the model learned (the model's internal objective is misaligned).

   2. **Nature of bad behavior**: 
       - Does the bad behavior trace to a learned internal objective? Or is it due to underdetermination plus distribution shift (i.e., the model didn't learn a robust policy, and so when the distribution shifts, it fails)?

   3. **Situational awareness**: 
       - Does the model exhibit awareness of being in training vs. evaluation? (This is crucial for deceptive alignment.)

   4. **Conditionality of bad behavior**:
       - Is the bad behavior conditionally suppressed (e.g., only when it thinks it's being evaluated) or uniformly bad?

   5. **Performance on training distribution**:
       - Does the model perform well on the training distribution but badly on the intended (out-of-distribution) domain?

   6. **Persistence across seeds**:
       - Does the bad behavior go away with a different random seed? (This might indicate that the issue is not robust and could be due to optimization flukes.)

   7. **Base model behavior**:
       - Was the bad behavior already present in the base model? (If yes, it might be a pretraining issue rather than a finetuning issue.)

   8. **Proxy metric vs. true metric**:
       - Did the proxy metric (e.g., training loss, reward model score) climb while the true metric (what we actually care about) stayed flat or got worse?

   9. **Response to hints**:
