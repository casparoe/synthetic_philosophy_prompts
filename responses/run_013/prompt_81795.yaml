  First, their frustration is palpable: they call the argument "dumb" but admit it consumed a week. That tells me they care deeply about rigor despite the playful framing. Their examples show they've done homework—they name-drop Laplace, Haldane, Solomonoff—so this isn't a beginner question. They're likely grad students or researchers in stats/physics/CS. 

  The core ask is "desiderata," but reading between lines: they suspect uninformative priors are either arbitrary or impossible to define coherently, and want confirmation. Specifically:  
  - They notice invariance vs. normalizability clashes (1/x priors blow up)  
  - They're bugged by how "symmetry" claims feel circular (what defines "correct" parametrization?)  
  - They doubt differences vanish with data (coin example)  
  - They hint at deeper unease: is "ignorance" even representable mathematically?  

  For the response, I should:  
  1. Acknowledge their examples as canonical pain points (Bertrand/etc.)  
  2. Systematize requirements—split into must-haves (prob axioms) vs. wants (invariance)  
  3. Explicitly call out conflicts, especially normalizability vs. invariance  
  4. Clarify philosophical splits: frequentist Bayesians (Jeffreys) vs. info-theoretic (maxent) vs. computational (Solomonoff)  
  5. Stress that "uninformative" always involves tradeoffs—no free lunch  

  Biggest trap to avoid: sounding dismissive. Their frustration is valid! I should validate that this *is* messy and debates are ongoing.  

  Key insight for the structure: organize desiderata by what they *lose* when compromised. E.g., dropping normalizability lets you keep invariance but forces cutoffs. That mirrors their "what costs what" question.  

  Also—their Solomonoff mention is a curveball. Most uninformative prior lit ignores it because it's uncomputable, but I should note it solves *some* invariance issues at infinity (via Turing machines) while creating others (measure dependence).  

  Final tone: respect their technical level, but add wit where possible. They called Bertrand "wearing a hat"—I can match that energy.
answer: |-
  You've hit the core paradoxes of "uninformative" priors head-on. The frustration is warranted—**no single definition satisfies all intuitive desiderata simultaneously.** Below is a systematic breakdown of what an "adequate" theory *should* deliver, the conflicts, and how existing approaches compromise. I'll structure this as: 

  1.  **Non-Negotiable Foundations** (the bedrock)  
  2.  **Desiderata for "Uninformativeness"** (what we *want*, but conflict)  
  3.  **Motivating Cases & Where They Bite**  
  4.  **Key Distinctions That Matter**  
  5.  **The Inevitable Conflicts**  
  6.  **Scorecard of Approaches & Their Tradeoffs**  

  ---

  ### 1. Non-Negotiable Foundations (The Bedrock)
  These *must* hold for any coherent Bayesian framework:

  *   **A1: Adherence to Probability Axioms (Kolmogorov):**  
      The prior must define a valid probability measure (non-negative, sum/integrate to 1 over the sample space).  
      *   **Motivation:** Without this, you're not doing Bayesian probability. Violations lead to logical inconsistencies (e.g., probabilities >1).  
      *   **Cost of Violation:** The framework ceases to be Bayesian. "Improper priors" (like 1/x for scale parameters) are *formal devices* violating A1—they only become valid *after* normalization by the evidence (if finite).  

  *   **A2: Consistency with Conditionalization (Bayes' Theorem):**  
      Posterior beliefs must be updated via Bayes' theorem: `P(θ|data) ∝ P(data|θ) * P(θ)`.  
      *   **Motivation:** This is the *definition* of Bayesian updating. Violating it abandons the framework.  
      *   **Cost of Violation:** Not Bayesian.  

  *   **A3: Avoidance of Strict Dutch Books:**  
      No agent using the prior should be susceptible to a guaranteed loss from a clever bookie.  
      *   **Motivation:** Coherence. Axioms A1 & A2 imply this for finite spaces; for continuous spaces, it requires care but remains fundamental.  
      *   **Cost of Violation:** The prior is probabilistically incoherent.  

  ---

  ### 2. Desiderata for "Uninformativeness" (The Aspirations)
  These characterize what we *mean* by "no information," but they conflict:

  *   **D1: Invariance under Reparametrization:**  
      If φ = g(θ) is a one-to-one transformation of the parameter, the prior `P_φ(φ)` should be equivalent to transforming `P_θ(θ)` via the Jacobian. Formally: `P_φ(φ) = P_θ(θ) * |dθ/dφ|`.  
      *   **Motivation:** True ignorance about θ should imply true ignorance about φ. Bertrand's paradox (chord length vs. central angle), your cube (side length `s` vs. volume `s^3` vs. log-side `log s`), and the coin (`p` vs. log-odds `log(p/(1-p))`) show that flat priors in different parametrizations contradict each other.  
      *   **Status:** Often considered the *core* of objectivity. **Conflict:** Incompatible with D4 for unbounded parameters.  

  *   **D2: Consistency with Known Symmetries / Group Invariance:**  
      If the problem has a natural transformation group (e.g., location shift `θ -> θ + c`, scale change `θ -> kθ`), the prior should be invariant under that group.  
      *   **Motivation:** Ignorance implies no preferred origin or scale.  
          *   *Location:* Flat prior `dθ`.  
          *   *Scale:* The prior `dθ/θ` (equivalent to flat on `log θ`).  
      *   **Status:** Powerful justification for common "uninformative" choices. **Conflict:** `dθ/θ` violates A1 (non-integrable).  

  *   **D3: Maximum Ignorance / Maximum Entropy (MaxEnt):**  
      The prior should maximize Shannon entropy `S = -∫ p(θ) log p(θ) dθ` subject to known constraints.  
      *   **Motivation:** Maximizes uncertainty subject to what's known.  
      *   **Status:** Appealing info-theoretic foundation. **Conflict:** Requires *known constraints* (even if trivial). Depends on the underlying measure (reparametrization issue!). Flat priors maximize entropy *only* if the "natural" measure is `dθ`.  

  *   **D4: Proper Normalization (Integrability):**  
      `∫ p(θ) dθ < ∞` over the parameter space.  
      *   **Motivation:** Necessary for A1 (probability axiom). Allows interpretation as actual degrees of belief.  
      *   **Status:** Foundational (A1). **Conflict:** Directly clashes with D1 and D2 for unbounded parameters (e.g., positive real line).  

  *   **D5: Predictive Matching / Low-Data Consistency:**  
      The prior should yield sensible posteriors even with minimal data.  
      *   **Motivation:** Avoids Haldane's `0/0` problem (prior `p^{-1}(1-p)^{-1}` for coin bias: predicts 100% heads after 1 head, 100% tails after 1 tail). Laplace's `add-one` (prior ∝ `p^0(1-p)^0` = flat) predicts 2/3 heads after 1 head.  
      *   **Status:** Crucial for practical use with small samples. **Conflict:** Can clash with D1/D2 (e.g., flat vs. Haldane on coin bias).  

  *   **D6: Frequentist Asymptotic Matching:**  
      For large samples, Bayesian intervals should approximately match frequentist confidence intervals.  
      *   **Motivation:** "Calibration" objective Bayesians seek.  
      *   **Status:** Important for many practitioners. **Conflict:** Not always possible, especially in complex models.  

  *   **D7: Generality (Handles Complex Spaces):**  
      Extends to non-Euclidean, discrete, or infinite-dimensional spaces (e.g., Solomonoff induction).  
      *   **Motivation:** Real-world ignorance isn't limited to simple parametric models.  
      *   **Status:** Often ignored by parametric approaches.  

  ---

  ### 3. Motivating Cases & Where They Fail
  *   **Bertrand's Chord Paradox (Circle):**  
      *   **Problem:** "Random chord" has different lengths under "flat on distance from center", "flat on endpoint angle", "flat on midpoint position".  
      *   **Desiderata Clash:** D1 (Invariance) fails spectacularly. "Symmetry" (D2) suggests rotational/scale invariance, pointing to a non-flat prior.  
  *   **Cube Factory (Unknown Size):**  
      *   **Problem:** Flat on side-length `s` vs. flat on volume `v = s^3` vs. flat on `log s` give different predictive distributions for the side length of a random cube.  
      *   **Desiderata Clash:** D1 again. D2 (scale invariance) demands prior `∝ ds/s` (flat on `log s`), but this violates D4 (non-integrable). Requires an *arbitrary cutoff* to normalize, violating objectivity.  
  *   **Coin Bias (p):**  
      *   **Problem:**  
          *   Flat on `p` (Laplace): `P(heads|1st flip=head) = 2/3`  
          *   Flat on log-odds `log(p/(1-p))` (Jeffreys for binomial): `P(heads|1st flip=head) ≈ 3/4`  
          *   Haldane prior `∝ [p(1-p)]^{-1}`: `P(heads|1st flip=head) = 1`  
      *   **Desiderata Clash:** D1 (flat in `p` ≠ flat in log-odds), D2 (no symmetry group forces one), D5 (Haldane gives absurd predictions with low data). D6 favors Jeffreys (matches frequentist CI best).  
  *   **Infinite-Dimensional Spaces (e.g., Solomonoff):**  
      *   **Problem:** Assigning prior over *all* computable hypotheses.  
      *   **Desiderata Clash:** D7 is paramount. D1/D2/D3/D4 are generally intractable. Solomonoff uses a universal prior (based on program length) satisfying D1/D2 *in a computable invariance sense*, but it's uncomputable and only semi-measure (violates D4 strictly).  

  ---

  ### 4. Key Distinctions That Matter
  *   **Real Ignorance vs. Known Symmetry:**  
      Ignorance is hard to define; symmetry (D2) is a *positive assumption*. Assuming translation symmetry *is information*.  
  *   **Prior vs. Likelihood:**  
      The prior's role is distinct. A "flat" prior combined with a complex likelihood isn't "uninformative" – the information comes from the model structure.  
  *   **Proper Distribution vs. Formal Measure:**  
      `1/x` for scale is a *Haar measure* (invariant under `x -> kx`), not a probability distribution. Using it requires:  
      1.  Truncation (cutoff) → violates D1/D2 near boundaries.  
      2.  Relying on data to normalize later → violates A1/D4 until data arrives.  
  *   **Ignorance in Parameters vs. Predictions:**  
      "Uninformative" often targets parameters, but predictions matter more. Different priors yielding different predictions with little data (coin) show they encode different information.  

  ---

  ### 5. The Inevitable Conflicts
  **The Core Impossibility:** For a continuous parameter space unbounded in at least one direction (e.g., `θ > 0`):  
  *   **D1 (Reparam Invariance) + D2 (Scale Invariance) ⟹ Prior `∝ dθ/θ`**  
  *   **`∫_{θ>0} dθ/θ = ∞` ⟹ Violates D4 (Integrability) and A1.**  

  **You must sacrifice one:**  
  1.  **Sacrifice D1/D2:** Use a proper prior with arbitrary bounds/mean (e.g., flat on `s` from 0.1cm to 100km for cubes). *Cost:* Introduces arbitrary information.  
  2.  **Sacrifice D4 (A1):** Use improper prior `∝ dθ/θ`. *Cost:* Not a probability distribution; coherence (A3) is subtle; requires finite evidence to normalize; predictions depend on arbitrary truncation until enough data arrives.  
  3.  **Sacrifice "True Ignorance":** Acknowledge that "uninformative" is a misnomer. Priors like Jeffreys or reference priors encode *minimal information relative to a chosen metric or inference goal* (D5/D6), not absolute ignorance.  

  **Other Key Conflicts:**  
  *   **D5 (Predictive Matching) vs. D1/D2:** Haldane vs. flat vs. Jeffreys on coin bias.  
  *   **D7 (Generality) vs. D1-D6:** Solomonoff satisfies a form of invariance but fails computability, normality, and practical calculability.  
  *   **D6 (Frequentist Matching) vs. D1/D2:** Jeffreys often wins D6 but may lose D5 (e.g., multivariate problems).  

  ---

  ### 6. Scorecard of Approaches
  | Approach          | Key Idea                                     | Satisfies Well          | Sacrifices Hard             | Notes                                                                 |
  | :---------------- | :------------------------------------------- | :---------------------- | :-------------------------- | :-------------------------------------------------------------------- |
  | **Flat Prior**    | Constant density on chosen `θ`.              | D3 (if `dθ` is "natural") | **D1, D2, D4 (if unbounded)**, D5/D6 | Only "uninformative" if parametrization is privileged (rarely true).      |
  | **Jeffreys Prior**| `p(θ) ∝ sqrt[I(θ)]` (Fisher info)            | **D1, D6**              | D2 (sometimes), D4 (often), D5 | "Gold standard" for frequentist matching. Invariant under reparam (D1). Often improper. |
  | **Reference Prior**| Maximizes expected divergence from prior → posterior | **D1, D6**              | D2, D4, D5, Computability   | Generalization of Jeffreys; aims for "maximal information gain".      |
  | **Group Invariance**| Prior = Haar measure of symmetry group.     | **D2**                  | **D1 (if group doesn't cover reparam), D4** | Matches Jeffreys for location/scale. Deep foundation, but often improper. |
  | **MaxEnt**        | Maximize entropy under constraints.          | **D3**                  | **D1, D2, D4 (no constraints)** | Needs *known* constraints. Depends critically on base measure (violates D1). |
  | **Soliticing Rules**| e.g., Laplace `add-1` (Beta(1,1)), Haldane Beta(0,0)| **D5** (Laplace)      | **D1, D2, D4 (Haldane)**    | Ad-hoc fixes for low-data cases. Not general.                          |
  | **Solomonoff**    | Prior `∝ 2^{-K(h)}` (K = Kolmogorov complexity) | **D1/D2 (asymptotic), D7** | **D4, Computability, Usefulness** | Theoretically profound for induction, but utterly impractical. Semi-measure. |

  **The Reality:** **Jeffreys/reference priors** are the pragmatic workhorses of "objective" Bayesian analysis, satisfying D1 and D6 best. **Group invariance** provides deep justification for location/scale problems. **Proper but vague priors** are often better than improper ones in practice. **"Uninformative" is always relative** to a chosen model, parametrization, and inference goal. True ignorance remains elusive—priors encode *something*, even if it's minimal information or a formal invariance. The "best" choice depends on what you value most: coherence (D4), invariance (D1/D2), low-data performance (D5), or frequentist calibration (D6).
