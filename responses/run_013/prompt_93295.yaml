answer: |-
  ## OFFICE OF OMISSION LIABILITY  
  MUNICIPAL DISTRICT VII  
  NOTICE TO RESIDENTS: COMPUTATION OF OMISSION LIABILITY & APPEALS PROCESS  

  **Effective Date:** [Current Date]  
  **Reference:** Municipal Code § 42.7 (Causation by Omission), Administrative Directive OOL-2024-03  

  **1. PURPOSE:** This Notice clarifies the computation of liability arising from causal omissions pursuant to Municipal Code § 42.7 and outlines the appeals process. Liability attaches when a resident's failure to perform an act is deemed a *but-for cause* of subsequent harm, provided a *Presumptive Duty to Act (PDA)* existed prior to the harm event.

  **2. THE COUNTERFACTUAL BASIS OF OMISSION LIABILITY:** Causation is determined objectively via the *But-For Test*: Harm Event H would not have occurred *but for* your failure to perform Act A. Crucially, Act A need not be physically proximate to H, nor need you have directly initiated the causal chain. Your omission becomes a necessary link in the causal sequence leading to H. For instance, observing Condition C (e.g., a tree limb precariously overhanging a power line visible from your domicile) creates a PDA to report C. Failure to report C (Omission O) is analyzed thus: *But for* O, Authorities would likely have intervened, preventing H (e.g., downed power line causing fire). Therefore, O is a cause of H. Distance, complexity of intervention, or unawareness of ultimate consequences do not negate this causal link; they are *Attenuation Factors* considered during penalty computation (See Sec. 4).

  **3. SCOPE OF LIABILITY & THE PRESUMPTIVE DUTY TO ACT (PDA):** Liability is not infinite. It is bounded by the existence of a PDA. A PDA arises when:
      *   **(a)** A resident possesses sensory or cognitive awareness (actual or imputed via reasonable observation capacity, e.g., functional windows) of a Condition C presenting a foreseeable risk of Harm H; and
      *   **(b)** Acting to mitigate C or report C to Authorities is deemed reasonably practicable under the circumstances (considering time, resources, personal safety); and
      *   **(c)** No other agent with a higher or equal PDA was reasonably expected to act.

  **The PDA is the critical mechanism distinguishing causal omissions from the infinite background of non-occurring acts.** Your failure to prevent a flood in District I is not liable because (a) you likely lacked awareness/imputed observation of District I's specific risk conditions, and (b) acting was not reasonably practicable. Your failure to stop a falling object directly above a pedestrian *within your immediate physical reach* likely involves a PDA. Your failure to report the visibly precarious tree limb involves a PDA based on sensory awareness and practicable action (reporting).

  **4. COMPUTATION OF LIABILITY SCORE (LS):** Your Liability Score (LS) for a cited Omission is computed as follows:
      `LS = (H_Severity) x (PDA_Strength) x (1 - Σ(Attenuation_Factors))`

      *   **H_Severity:** Quantified scale (1-10) based on property damage value, injury severity, environmental impact, etc.
      *   **PDA_Strength:** Assessed (0.5-1.0) based on:
          *   Clarity/immediacy of perceived risk.
          *   Ease/expected efficacy of practicable action (e.g., making a phone call = high strength; complex physical intervention = lower).
          *   Specificity of knowledge (e.g., seeing the exact weak point vs. general unease).
      *   **Attenuation Factors (ΣAF, each 0.0-0.3):** Mitigating circumstances reducing *proportional* liability, not causation itself. Examples:
          *   Temporal Distance: Significant delay between O and H.
          *   Causal Complexity: Multiple intervening acts/omissions by others between O and H.
          *   Reasonable Uncertainty: Genuine doubt about risk or correct action, if documented.
          *   Resource Limitations: Genuine lack of means to act, if documented.
          *   Prior Reporting: Evidence you reported similar risks previously.

  **5. ACCRUAL OF LIABILITY:** Liability accrues per distinct Omission linked to a distinct Harm Event via the But-For Test and PDA. Residents may accrue multiple Omission Liabilities over time. Your cumulative Omission Record (OR) is maintained by the OOL. It is accurate that under this causal model, many residents possess extensive ORs; this reflects the objective counterfactual structure of causation, not administrative error. The PDA requirement ensures only omissions within a defined scope of reasonable expectation generate liability.

  **6. APPEALS PROCESS:** Appeals contesting a Notice of Omission Liability (NOL) must be filed within 30 days. Grounds for appeal are limited:
      *   **A. Dispute of Fact:** Contesting the accuracy of the observations forming the PDA (e.g., the tree limb was not visible; you were demonstrably absent).
      *   **B. Absence of PDA:** Demonstrating that no Presumptive Duty to Act existed per Sec. 3 criteria (e.g., Condition C was not reasonably perceivable; no practicable action existed; a higher-duty agent was solely responsible).
      *   **C. Computational Error:** Demonstrating mathematical error in LS calculation.

  **Appeals MAY NOT challenge:**
      *   The philosophical basis of causation by omission (§ 42.7).
      *   The But-For Test application *assuming the facts and PDA as established*.
      *   The ontological status of omissions as non-events. The law defines eligible omissions as failures to perform a specific, practicable Act A under a PDA, constituting a legally cognizable cause.
      *   The existence of other potential causes. Multiple omissions/acts can be concurrent but-for causes.

  **Appeal Procedure:** Submit Form OOL-A1 with supporting evidence. An OOL Hearing Officer will review written submissions only. No in-person testimony is permitted. The burden of proof rests with the appellant to demonstrate error by clear documentation. The Hearing Officer's decision is final.

  **7. COMPLIANCE & MITIGATION:** Proactive reporting of potential hazards via the OOL Hotline or Web Portal may be considered a mitigating factor in future LS computations should a reported condition later contribute to harm, demonstrating fulfillment of the PDA. Regular review of your property lines and environs for potential risks is recommended to minimize PDA accrual.

  **The Office of Omission Liability administers § 42.7 impartially to ensure all necessary causal links in preventable harm are accounted for, fostering a community of proactive vigilance.**

  **[End of Notice]**  
  OOL Contact: [Fictional Phone Number] | [Fictional Web Address] | Inquiries Only - No Appeal Filing Via Phone/Email
