  Predictions for Buddha:

  - Under the main rule (contemporary external evidence): Buddha lacks contemporary evidence. Ashoka is 200 years later, and the texts are from followers. So, she might say no.

  - But she might accept Ashoka as sufficient external evidence, similar to Boudicca's Roman sources being decades later. The gap for Buddha is longer—about 150-200 years vs. Boudicca's 50-100 years? Tacitus wrote about Boudicca around 100 CE, revolt was 60-61 CE, so 40 years gap. Cassius Dio later. Socrates: Aristophanes' *Clouds* was 423 BCE, Socrates died 399, so contemporary. Plato wrote later, but based on firsthand knowledge. For Buddha, Ashoka is 250 BCE, Buddha died ~400 BCE, so 150 years. The Pali Canon was compiled around 1st century BCE, but oral tradition earlier. But no contemporary records exist for India from that period, so absence of evidence isn't evidence of absence. But the advisor might require positive evidence.

