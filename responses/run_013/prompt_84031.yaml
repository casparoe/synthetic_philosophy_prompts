answer: |-
  Based on your advisor's verdicts and her stated principle—"the question isn't whether something happened, it's whether the smallest thing you can actually defend is still the thing the story is about"—I'll break this down as requested. First, I'll propose the most consistent rule that explains all her calls, then offer a plausible rival rule that also fits her decisions. I'll predict what each rule implies for the Buddha case, give my own best guess, and suggest a test case to distinguish the rules. Finally, I'll address whether she's being inconsistent.

  ### 1. The Most Likely Rule: "Independent Near-Contemporary Corroboration"
  This rule emphasizes **evidence from outside the legendary tradition that is roughly contemporary (within a few generations) and supports a core claim without relying on the legend itself.** The "smallest defensible thing" must still capture the essence of the story—if the evidence reduces the event or person to something unrecognizable from the legend, it doesn't count. Crucially, the evidence must come from sources independent of the community that produced the legend (e.g., external records, archaeology, or neutral/opposing accounts).

  #### How it fits your advisor's calls:
  - **Trojan War:** She accepts it because Hittite records (external, contemporary to the late Bronze Age) and archaeology (a destruction layer at Troy) corroborate a major conflict at the site. The "smallest defensible thing" is "a historical war at Troy," which aligns with the core of the story (a war), even if Homer's details (Helen, coalition) are fiction. The evidence is independent of Greek epic poetry.
  - **King Arthur:** Rejected because the earliest references (e.g., 9th-century Welsh texts) are centuries later, rely on oral legend, and lack contemporary external corroboration. The "smallest defensible thing" (e.g., "a war leader who fought Saxons") is reconstructed *from the legend itself*, making it circular and untrustworthy. No independent evidence (e.g., Anglo-Saxon chronicles or archaeology) supports even this minimal core.
  - **Exodus:** Rejected because there's no Egyptian or external records of the migration/conquest, and the archaeological record contradicts it. The "smallest defensible thing" (e.g., "a small group leaving Egypt") isn't the Exodus story—which is about a divine liberation of a nation—so it fails the essence test. Any evidence is internal (Biblical texts) or speculative.
  - **Romulus:** Rejected despite Rome's existence because the story relies solely on later Roman myth-making (e.g., Livy). No contemporary external sources (e.g., Etruscan or Greek records) support even a minimal core like "a founder figure."
  - **Boudicca:** Accepted because Roman historians (Tacitus, Cassius Dio) wrote about her revolt within decades, using sources independent of British oral tradition. The "smallest defensible thing" ("a British queen who led a revolt against Rome") aligns with the story's essence, even though the accounts are biased and late.
  - **Socrates:** Accepted due to contemporary external evidence: Aristophanes mocked him in *The Clouds* during his lifetime, providing independent (if satirical) corroboration. Plato and Xenophon (students with agendas) support this core, but Aristophanes' role as an "outsider" makes it defensible. The essence ("a real Athenian philosopher") is intact.

  **Why Arthur is rejected despite seeming similar?** For Arthur, the "smallest defensible thing" ("a war leader who won against Saxons") *could* be the story's essence, but your advisor rejects it because it relies entirely on the legend. There's no independent contemporary evidence (e.g., 5th–6th century Anglo-Saxon or British records)—only later texts that are "already legend-shaped." In contrast, Troy has external Hittite records, and Boudicca has Roman histories.

  ### 2. A Plausible Rival Rule: "Plausible Historical Kernel with Minimal Embellishment"
  This rival rule focuses on **whether the legend has a plausible, non-miraculous core that can be defended with any evidence (even indirect or late), provided the core isn't drowned out by later myth-making.** The "smallest defensible thing" must still feel like the story, but it doesn't require contemporary external sources—archaeology, oral tradition, or later external mentions might suffice if they don't contradict the core.

  #### How it fits your advisor's calls (surprisingly well):
  - **Trojan War:** Accepted because archaeology (destruction layer) provides a plausible kernel ("major conflict at Troy"), and it's not overshadowed by Homer's myth— the war remains central.
  - **King Arthur:** Rejected because the core ("war leader against Saxons") is inseparable from later magical embellishments (e.g., Merlin, Excalibur), and there's no evidence for even a mundane version. Early references (e.g., Gildas) omit Arthur, making the kernel indefensible.
  - **Exodus:** Rejected because the core ("mass liberation from Egypt") is implausible (no evidence) and the mythic elements (e.g., plagues, parting sea) dominate. A "small group" isn't the story.
  - **Romulus:** Rejected because the story is inherently mythical (raised by wolves, divine origins), and no evidence supports a human founder.
  - **Boudicca:** Accepted because the revolt is plausible (Roman occupation), and accounts, though late, focus on historical events without heavy myth-making. Tacitus' sources may derive from eyewitnesses.
  - **Socrates:** Accepted because the core ("real philosopher") is plausible and non-miraculous, with accounts emphasizing his teachings over legend.

  **Why Arthur is rejected here?** The Arthurian legends are "already legend-shaped" from the start, with no clean separation of history from myth. Even the minimal core is speculative.

  ### Predictions for the Buddha Case
  - **Historical Buddha question:** Was there a real teacher behind the tradition? Evidence: Earliest Buddhist texts (e.g., Pali Canon) are centuries later (compiled 1st century BCE), from followers; Ashoka's inscriptions (mid-3rd century BCE) are the first external evidence, referencing Buddha and his teachings ~200 years after his death.
  - **Prediction under Rule 1 (Independent Near-Contemporary Corroboration):** She says **no**. Ashoka's inscriptions are external but not contemporary—they come 150–200 years after Buddha's death, and Ashoka was a Buddhist convert, so he's part of the tradition. The texts are internal and late. No contemporary evidence (e.g., from other Indian kingdoms) exists. The "smallest defensible thing" (e.g., "a teacher who inspired Buddhism") might be defensible with Ashoka, but it's not independent or near-contemporary enough—similar to rejecting Arthur for relying on late, legend-shaped sources.
    
  - **Prediction under Rule 2 (Plausible Historical Kernel):** She says **yes**. Ashoka's inscriptions provide external validation of a real figure, and the core ("a teacher who founded Buddhism") is plausible and not inherently miraculous. The essence of the story (a human teacher with insights) remains intact despite later embellishments (e.g., supernatural births), similar to how Troy's war is accepted despite Homer's myths.

  ### My Best Guess and Reasoning
  **I think your advisor uses Rule 1 (Independent Near-Contemporary Corroboration), and she will say "no" to a historical Buddha.** Here's why:
  - **Consistency with her pattern:** Her rejections of Arthur and Exodus hinge on the lack of independent contemporary evidence. For Arthur, late texts are "legend-shaped"; for Exodus, no Egyptian records exist. Ashoka's inscriptions are closer to Boudicca's Roman sources in being external, but the gap is larger (200 years vs. Boudicca's 40–100 years), and Ashoka is a follower, not a neutral source. She'd likely argue that Ashoka is like a later Christian emperor referencing Jesus—useful but insufficient without earlier corroboration. The Buddhist texts are internal and compiled centuries later, making them analogous to the Arthurian legends.
  - **Her Troy/Exodus distinction:** She rejects a "small group" Exodus because it isn't the story, just as she might reject "a wandering ascetic" as not the Buddha story if the evidence is weak. For Buddha, the smallest defensible core ("a real teacher") might be too vague without contemporary proof, reducing it to something unrecognizable (e.g., "multiple influencers" could have inspired Buddhism).
  - **Why not Rule 2?** Rule 2 is a good fit for Boudicca and Socrates, but she's stricter with Arthur and Exodus. Her Troy call relies on Hittite records (external), not just archaeology. If she used Rule 2, she might accept Buddha due to Ashoka, but her emphasis on "defending" evidence suggests Rule 1 is primary.
  - **My own view:** I'd cautiously say **yes, there was a historical Buddha**, based on Ashoka's early external mention and the coherence of the Pali Canon's core teachings (which lack the later supernatural elements). However, I agree with your advisor's likely skepticism—200 years is a long gap, and Ashoka isn't fully independent. But compared to Arthur (500+ year gap), it's stronger evidence.

  ### Test Case to Distinguish the Rules
  To clarify which rule she uses, argue about **Homer himself**. Was there a real Homer behind the *Iliad* and *Odyssey*?
  - **Evidence:** No contemporary records of Homer; earliest references are centuries later (e.g., 6th century BCE). The poems likely emerged from oral tradition, and "Homer" may be a legendary composite.
  - **Prediction under Rule 1:** She says **no**—no independent near-contemporary evidence (e.g., 8th-century BCE Greek inscriptions) exists. The "smallest defensible thing" (e.g., "a bard who composed epics") can't be defended without relying on the tradition itself.
  - **Prediction under Rule 2:** She says **yes**—the core ("a real poet") is plausible, and oral tradition provides a kernel, similar to Buddha. The essence (a foundational author) remains.
  - **Why this test?** It mirrors Buddha (oral tradition, late texts) but with weaker evidence (no equivalent of Ashoka). If she rejects Homer, Rule 1 is confirmed; if she accepts, Rule 2 fits better.

  ### Is She Inconsistent?
  Not really—her approach is coherent but hinges on a strict evidence threshold. The Arthur case *seems* inconsistent because "a war leader against Saxons" feels like the story's essence, but she dismisses it because that core is reconstructed from legend, not independent evidence. Troy gets a pass due to Hittite records; Arthur doesn't. Her rule is about defensibility: if you can't point to evidence outside the legend, the core isn't truly "defended." For Buddha, the lack of contemporary external evidence likely means a "no."

  If you want to push her, focus on why Boudicca (decades-later Roman accounts) is acceptable but Buddha (centuries-later Ashoka) might not be—ask how she defines "near-contemporary" and whether absence of evidence (e.g., for Arthur) is decisive. Good luck!
