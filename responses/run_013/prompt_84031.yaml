  Her Troy call: She accepts it because of Hittite records and archaeology, independent of Homer. For Arthur, no such evidence. Exodus, no evidence. Boudicca, Roman sources independent of British oral tradition. Socrates, multiple accounts. Romulus, no independent sources. Buddha: Ashoka is independent, but only one source? And the texts are from followers. So she might be skeptical.

  But she said for Arthur, "every candidate is reconstructed out of those same late texts," meaning no external corroboration. For Buddha, Ashoka provides that, but it's later. Is the gap too big?

  Best guess for the advisor's rule: **An event or person is historical if there is credible evidence from near-contemporary sources that are independent of the legendary tradition, and the core defensible claim aligns with the essence of the story.**

