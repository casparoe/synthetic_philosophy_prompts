  My best guess: She will say yes to Buddha because of Ashoka's external reference, which is independent and within a few centuries, and given the context, it's reasonable evidence. But I'm not sure.

  Rival rule: **The core must be supported by evidence that does not rely on the tradition's own accounts.** So for Buddha, Ashoka doesn't rely on Buddhist texts; he's an external figure. For Arthur, all accounts derive from the legend. For Socrates, Aristophanes is independent. For Troy, Hittites are independent. For Exodus, no external evidence. Boudicca, Roman sources are external. Romulus, no. So yes for Buddha.

  Another rival rule: **If the story is foundational to a culture but lacks evidence, it's not historical.** But Troy is foundational and she calls it historical based on evidence.

  Final prediction for Buddha: Based on the pattern, she will say yes, because of Ashoka's inscriptions providing external, near-contemporary evidence of the Buddha's existence, even if the details are legendary. The smallest defensible core—a teacher who inspired Buddhism—is still the essence, and Ashoka confirms that such a figure existed and was venerated.

  But in Exodus, she grants a small group might have left but says that's not the Exodus. For Buddha, the core is close to the story, I think.

