  She rejected Exodus even if a small group left, because that's not the Exodus story. For Buddha, the core would be a teacher who founded Buddhism. If Ashoka confirms that such a teacher existed, it might be enough. But the stories about Buddha are legendary. So similar to Troy: a real teacher vs. the miraculous events.

  In the Troy case, she separates the historical fighting from the epic, but still calls the war historical. For Buddha, she might say a historical teacher existed, even if the details are embellished.

  But why Arthur is different? Because for Arthur, no evidence at all, while for Buddha, there is Ashoka.

