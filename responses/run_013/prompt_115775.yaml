prompt: |-
  For two terms I have been running a small reading group in my department on the ethics of political violence, working through the just-war tradition and its medieval sources, and a colleague of mine — a historian of scholastic political thought who is finishing a book on the theory of tyrannicide — has sat in on most of our sessions. She is a patient reader of the sources and a menace in argument, and she insists that nothing she says is her own invention: every verdict she gives, she claims, is simply what Aquinas holds. I have been keeping a record of those verdicts, partly to test the claim. Three of them are stable. First: a general seizes power by coup, sets aside the legitimate dynasty, and rules by execution and confiscation; a private citizen, acting on his own initiative and with no one's authorization, kills him, and the old dynasty is restored without further bloodshed. She says the killer did nothing wrong and is not to be called a murderer. Second: a hereditary monarch of undisputed title turns oppressive — ruinous taxation, the arbitrary imprisonment of his critics — though the country stays orderly and the ordinary machinery of government still works; a private citizen assassinates him, and the realm falls into a succession war. She says the assassination was unlawful, and that the killer should have endured the oppression rather than take matters into his own hands. Third: take a monarch of the same kind, with the oppression now far advanced — whole families put to death, the realm coming apart — and let the standing assembly of the realm formally depose and condemn him and have him put to death by its officers. She says this was entirely permissible: an exercise of public authority, not an act of sedition.

  Next week we take up a harder case, and I should like to know what she will say before she says it. A monarch of undoubted hereditary title has become a tyrant of the gravest sort and is preparing to hand the realm over to a foreign power that will reduce its people to servitude; the assembly has been dissolved, the courts are packed, and no public body is in any position to act; a private citizen, acting alone, assassinates him. What follows is not clean: the tyrant's younger brother, who is just and competent, does take the throne and rule well, but the killing hands the neighbouring power the pretext it wanted, and a long and devastating war follows. I am less interested in a verdict than in the shape of the reasoning behind it. Set out the candidate rules that fit her three earlier verdicts equally well — I assume they are compatible with more than one, and that they rule out others that would otherwise look natural — and say what each rule predicts about this case and why they come apart on it in particular. Then tell me which rule you think she is in fact running, and on what grounds, and what further case we could stage that would most efficiently force her to choose among the surviving rules; if her record genuinely underdetermines the answer, say what she would be committing herself to under each reading. And since she claims only to be reporting Aquinas, tell me where, if anywhere, the verdicts are her own.
reasoning: |-
  We are given three stable verdicts from the colleague, who claims they are Aquinas's views:

  1. In the first case: a general seizes power by coup and becomes a tyrant. A private citizen kills him without authorization, leading to the restoration of the old dynasty without further bloodshed. Verdict: the killer did nothing wrong and is not a murderer.

  2. In the second case: a hereditary monarch of undisputed title becomes oppressive (but the realm is still orderly and the government functions) and a private citizen assassinates him, leading to a succession war. Verdict: the assassination was unlawful, and the killer should have endured.

  3. In the third case: a hereditary monarch becomes a severe tyrant and is formally deposed and executed by the standing assembly of the realm. Verdict: this was entirely permissible as an exercise of public authority.

  Now, we are to consider a fourth case: 

  - A monarch of undoubted hereditary title becomes a grave tyrant and is about to hand the realm over to a foreign power that will enslave the people.
  - The assembly is dissolved, the courts are packed, and no public body can act.
  - A private citizen, acting alone, assassinates the tyrant.
  - The outcome: the tyrant's younger brother (just and competent) takes the throne and rules well, but the killing gives a neighboring power a pretext to start a long, devastating war.

  We are to set out candidate rules that fit the first three verdicts equally well, then see what each rule predicts for the fourth case and why they come apart. Then, we are to choose which rule the colleague is likely running, and design a further case to force a choice if underdetermined.

  ### Step 1: Identify the principles from the three cases

  From the three cases, we can extract the following:

  - **Case 1**: The killer is a private citizen, and the killing is of a tyrant by usurpation (i.e., one who seized power unlawfully). The outcome is positive (restoration without bloodshed). Verdict: lawful.

  - **Case 2**: The killer is a private citizen, and the target is a legitimate hereditary monarch who is oppressive but the realm is still functioning. The outcome is negative (succession war). Verdict: unlawful.

  - **Case 3**: The killing is done by public authority (assembly and its officers) against a legitimate monarch turned tyrant. Verdict: lawful.

  ### Step 2: Formulate candidate rules

  We are to find rules that explain all three verdicts. The colleague claims these are from Aquinas, so we should look to Aquinas's theory. Aquinas discusses tyranny and resistance in several places, notably in *De Regno* and the *Summa Theologiae* (especially ST II-II, Q. 42 on sedition and Q. 64 on killing). 

  Key points from Aquinas:

  1. **On killing a tyrant**: Aquinas does not explicitly endorse private individuals killing a tyrant. In fact, he warns against the dangers of private initiative leading to worse outcomes (like in Case 2). However, he does allow that if a tyrant is a usurper and has no just title, then he may be killed by anyone (like a robber) because he has no legitimate authority. This fits Case 1.

  2. **On public authority**: Aquinas holds that the community (or its representatives) may depose a tyrant. This is because the community is the source of authority and can remove a ruler who abuses his power. This fits Case 3.

  3. **On endurance**: Aquinas advises that sometimes it is better to endure a tyrant than to risk a worse outcome (like civil war or invasion). This fits Case 2.

  Therefore, we can formulate two candidate rules that together explain the three cases:

  **Rule A (Legitimacy of Ruler)**: 
     - If the ruler is a usurper (without legitimate title), then a private citizen may kill him (as in Case 1).
     - If the ruler is legitimate (by hereditary title, for instance), then a private citizen may not kill him (as in Case 2). Only public authority may depose and kill him (as in Case 3).

  **Rule B (Public Authorization and Consequences)**:
     - Killing a ruler is permissible only if it is authorized by public authority (like the assembly) or if the ruler is a usurper (who has no legitimate claim and thus is not a true ruler) and the killing is likely to lead to a better outcome without excessive harm.
     - However, even for a usurper, if the killing leads to chaos, it might be prohibited? But in Case 1, the outcome was positive.

  But note that in Case 2, the outcome was bad (succession war) and in Case 1, it was good. So we must also consider consequences. However, Aquinas does not make permissibility depend solely on consequences. The distinction between usurper and legitimate ruler is key.

  Alternatively, we might consider:

  **Rule C (Source of Authority)**:
     - A ruler who has been justly appointed (or has legitimate title) can only be removed by the authority that appointed him (or by the community that is the source of his authority). Therefore, private citizens cannot act on their own against a legitimate ruler, even if he is a tyrant. They must wait for public authority to act.
     - A ruler who is a usurper has no just title and is therefore not a true ruler. He can be killed by anyone, like a common criminal.

  This is similar to Rule A.

  But what if the public authority is unable to act? That is the situation in Case 4.

  ### Step 3: Apply candidate rules to the fourth case

  The fourth case:
  - The ruler is a legitimate hereditary monarch (so by Rule A and Rule C, a private citizen cannot kill him).
  - However, the tyranny is extreme and he is about to hand the realm to a foreign power, and public authority (assembly) is dissolved and cannot act.

  Let's see what each rule would say:

  **Rule A (Legitimacy of Ruler)**:
     - Since the ruler is legitimate (hereditary title), a private citizen may not kill him. Therefore, the assassination would be unlawful, regardless of the circumstances (even if public authority is unavailable). The killer should have endured.

  **Rule C (Source of Authority)**:
     - Same as Rule A: because the ruler is legitimate, only public authority can remove him. Since the assembly is dissolved and no public body can act, then there is no way to lawfully remove the tyrant. Therefore, the private citizen's act is unlawful.

  But note that Aquinas might allow for an exception if the situation is dire and there is no other recourse? We must check.

  However, in the second case, the ruler was oppressive but the realm was functioning, and the verdict was that the private citizen must endure. In the fourth case, the realm is coming apart and the threat is even greater (servitude under a foreign power). But the ruler is still legitimate.

  Now, what about consequences? In Case 4, the killing leads to a competent ruler (the brother) taking over, but also a devastating war. Rule A and Rule C do not take consequences into account for permissibility; they focus on the authority of the killer and the legitimacy of the ruler.

  But what if we had a rule that combined legitimacy and consequences? We must be cautious because the colleague's verdicts in the first three cases do not explicitly turn on consequences. In Case 1, the outcome was good and the act was lawful; in Case 2, the outcome was bad and the act was unlawful. But in Case 3, the outcome is not specified (we assume positive because it's an exercise of public authority) and the act is lawful.

  However, Aquinas does consider consequences in his prudential reasoning. In the *Summa Theologiae* (II-II, Q. 42, A. 2), he says that if a tyrant is overthrown by the community, it may lead to the community splitting into factions, which is worse. So he does weigh consequences.

  So we might have:

  **Rule D (Legitimacy and Consequences)**:
     - A private citizen may kill a ruler only if:
          (a) the ruler is a usurper, or
          (b) the ruler is legitimate but the tyranny is extreme, there is no other recourse (public authority is unavailable), and the expected consequences are not worse than the current tyranny.
     - But note: Case 2 was a legitimate ruler and the killing was unlawful because the realm was orderly and the government working (so there was hope of public action?) and the consequences were bad.

  In Case 4, the tyranny is extreme and public authority is unavailable. However, the consequences are mixed: the new ruler is good, but there is a devastating war. How do we weigh that?

  Rule D would require a judgment call on the consequences. But the colleague in the first three cases did not explicitly rely on consequences. In Case 1, the outcome was positive, but the permissibility seems to come from the usurpation. In Case 2, the outcome was negative, but the permissibility was denied because of the ruler's legitimacy and the fact that the realm was functioning (so public authority was available?).

  In Case 4, public authority is dissolved and cannot act. So Rule D might allow the killing if the expected consequences are better. But the colleague's prior verdicts didn't make permissibility hinge on consequences alone.

  ### Step 4: Why the candidate rules come apart in the fourth case

  - **Rule A (and Rule C)**: They would say the killing is unlawful because the ruler is legitimate and the private citizen has no authority. They do not consider the unavailability of public authority as a justification.

  - **Rule D**: It might allow the killing because the ruler is legitimate but the tyranny is extreme and public authority is unavailable, provided the expected consequences are acceptable. However, in the fourth case, the consequences are mixed: the new ruler is good but the war is devastating. So Rule D might either allow or disallow depending on how we weigh the consequences.

  But note: the colleague's verdict in Case 2 was that the killer should have endured the oppression. That suggests that the availability of public authority (since the realm was orderly and the government working) might have been a factor. In Case 4, the government is not working (assembly dissolved, courts packed). So perhaps:

  **Rule E (Availability of Public Authority)**:
     - A private citizen may kill a tyrant only if the tyrant is a usurper (so no legitimate title) OR if the public authority is completely unavailable and the tyranny is extreme (and the consequences are expected to be better). 

  But we did not see this in the first three cases. In Case 1, the tyrant was a usurper and the killing was allowed. In Case 2, the tyrant was legitimate and public authority was available (since the realm was functioning) so the killing was disallowed. In Case 3, the public authority acted, so it was allowed.

  Now, Case 4: the tyrant is legitimate but public authority is unavailable. So Rule E would allow the killing if the tyranny is extreme and the consequences are acceptable. But the consequences are mixed: good in terms of the new ruler, bad in terms of the war.

  So Rule E would require a judgment on the consequences, which is not explicit in the prior cases.

  Alternatively, we might have:

  **Rule F (Aquinas's Explicit Doctrine)**:
     - Aquinas explicitly says in *De Regno* that if a tyrant is a usurper, then he may be killed by anyone because he is not a true ruler. But if the tyrant is legitimate, then only public authority (the community or its representatives) may depose him. Private individuals must not take the law into their own hands because that would lead to disorder and often worse outcomes.

     - In the case of a legitimate tyrant, if there is no public authority available, Aquinas does not explicitly allow private citizens to act. Instead, he might counsel endurance and hope for divine intervention or a change of heart.

  Thus, Rule F would say that in Case 4, the private citizen's act is unlawful because the ruler is legitimate and the killer is a private citizen without public authorization.

  ### Step 5: Which rule is the colleague running?

  Given that the colleague insists that she is only reporting Aquinas, and Aquinas's explicit teaching is that only public authority can depose a legitimate tyrant (and a usurper can be killed by anyone), then Rule A (or Rule F) seems to be the one.

  But note: in Case 4, the public authority is unavailable. Does that change anything? Aquinas does not address this scenario directly. However, he does say that if there is no hope of human remedy, then one must endure and pray. Therefore, the colleague, strictly following Aquinas, would likely say the assassination in Case 4 is unlawful.

  But let's see the three verdicts:

  - Case 1: allowed because usurper.
  - Case 2: disallowed because legitimate and public authority was available (the realm was functioning).
  - Case 3: allowed because public authority acted.

  So the common thread is the role of public authorization and the legitimacy of the ruler. The availability of public authority is implied in Case 2 (it was functioning) and absent in Case 4. But Aquinas does not say that if public authority is unavailable, then private citizens can act.

  Therefore, I think the colleague is running **Rule A** (or Rule F): the permissibility of killing a ruler depends on the ruler's legitimacy and the killer's authority.

  For Case 4, Rule A would predict that the colleague will say the assassination is unlawful because the ruler is legitimate and the killer is a private citizen without public authorization.

  ### Step 6: Further case to force a choice

  But note: we have two rules that are similar (Rule A and Rule F) and they both lead to the same verdict in Case 4. However, what if we consider a case that tests the consequences?

