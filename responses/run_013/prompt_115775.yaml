  Rule D: if the consequences are good, and the ruler is a tyrant, and public authority is unavailable, then it might be allowed even if the ruler is not clearly a usurper.

  But the colleague's prior cases did not have ambiguous legitimacy. They were clear: usurper vs. legitimate.

