prompt: |-
  I'm a second-year philosophy PhD — action theory, mostly, though I've been reading my way into the free will literature for a chapter — and there's a shape of argument I keep running into that I don't have a name for.

  Roughly: someone argues that nobody is ever really responsible for what they do, because being responsible for an action would require being responsible for the self that produced it, which would require being responsible for the self that produced that self, and so on. I say fine, but that only tells us about a very demanding notion of responsibility — the one where you're the ultimate author of yourself — and I don't think that's what the word is doing when I say my flatmate is responsible for leaving the window open in a hailstorm. They say the thin thing isn't responsibility, it's just a system for allocating blame. I say the blame-allocating thing is the only one worth the name. Round in circles for an hour, neither of us saying anything false, both of us getting a bit cross, which suggests somethings at stake. (I know this particular argument has a name and an owner. That isn't what I'm after.)

  What I've realised is that we aren't disagreeing about any fact. We're disagreeing about which of two things the word should be tracking, and every argument either of us makes only gets off the ground if you've already settled that question our way. You can't dissolve it with 'right, two senses, use subscripts', because we each think the other person's sense is the one doing the real work. I've seen the same shape in arguments about whether machines can think — one side means inner experience, the other means information processing, and each side's arguemnt only works on its own reading — so it isn't a quirk of the free will debate.

  Is there an established name for this? Not ordinary ambiguity: I know what that is, and this is worse, because the disagreement about which sense is the correct one is the whole disagreement. I have a vague sense that there's something in the literature about words whose proper use is itself up for grabs, and something about disputes that are really about our concepts rather than about the world, but I can't find the thread and I may be making both up. If there's a term, what is it, and how does it differ from the two or three nearest ones? If there isn't, coin one, with edges: it should cover this case and the machine-thinking case, and it shouldn't cover two economists who mean different things by 'recession' and both know it.
reasoning: |-
  Okay, the user is a second-year PhD student in philosophy, focusing on action theory and free will. They’re encountering a specific type of argument where two sides are talking past each other because they’re using the same term with fundamentally different underlying concepts. The example given is about responsibility: one side insists on an ultimate authorship sense, while the other focuses on a practical blame-allocation sense. Neither is factually wrong, but they can’t agree on which concept the word "responsibility" should track. The user mentions a similar pattern in debates about machine thinking, where one side emphasizes inner experience and the other information processing. 

  The user is explicitly asking for an established term for this phenomenon. They’ve ruled out ordinary ambiguity because the disagreement isn’t just about different meanings—it’s about which meaning is the "correct" or primary one. They also hint at recalling something in the literature about words where the proper use is contested, or disputes about concepts rather than the world, but can’t pinpoint it. 

  First, I need to recall relevant philosophical concepts. The description aligns perfectly with what’s called a "verbal dispute" in philosophy, but the user wants precision. The deeper issue involves "conceptual competence" or "metalinguistic negotiation," where parties dispute which concept a term should express. The user’s examples (responsibility, machine thinking) are classic cases where the dispute isn’t empirical but about conceptual boundaries. 

  Key terms to consider:
  - **Metalinguistic negotiation**: From David Plunkett and Tim Sundell. This fits because the disagreement is about which concept the word should pick out, not about facts.
  - **Merely verbal dispute**: Often used casually, but the user needs to distinguish it from cases where both parties acknowledge multiple meanings (like economists with "recession").
  - **Substantive verbal dispute**: A subtype where the verbal disagreement masks deeper normative or conceptual stakes.
  - **Boundary dispute**: Related to how we categorize concepts, e.g., what counts as "thinking."

  The user also mentions that simply subscripting the senses (responsibility₁ vs. responsibility₂) doesn’t resolve it because each side thinks their sense is the "real" one. This highlights the normative/evaluative layer: each party believes their concept is more important or correct. 

  For the machine-thinking example, it echoes the Hard Problem of Consciousness (Chalmers) vs. functionalist views (e.g., Turing). Here, the conflict is over whether "thinking" requires phenomenal consciousness or just computational processes. Again, no empirical resolution—it’s about what the concept *should* entail. 

  To differentiate from ordinary ambiguity: In the economist example, both parties agree "recession" has technical definitions and can clarify which they’re using. In the user’s cases, the dispute is over which definition *ought* to be primary. 

  The best fit is **metalinguistic negotiation**. It captures the idea that the disagreement is about language use itself, driven by deeper commitments (e.g., ethical stakes in responsibility debates, ontological stakes in machine thinking). Alternatives like "conceptual dispute" or "merely verbal dispute" are either too broad or miss the normative dimension. 

  I should also address why this matters for the user: as a PhD student, they’re likely looking to frame their analysis of these debates more effectively, cite relevant literature, or refine their chapter on free will. Naming the phenomenon helps them articulate why these arguments feel circular and high-stakes. 

  Finally, recommend further reading: Plunkett and Sundell for metalinguistic negotiation; Chalmers on verbal disputes; possibly Carnap on explication (though that’s more prescriptive). Emphasize that recognizing this pattern can defuse frustration by shifting focus to why each side privileges their concept.
answer: |-
  This is a brilliantly articulated problem, and you're absolutely right to identify it as distinct from mere ambiguity. The established term for this phenomenon is **metalinguistic negotiation** (or sometimes **foundational verbal dispute**).

  Here's why it fits your cases perfectly and how it differs from near neighbors:

  1.  **Core Idea:** A metalinguistic negotiation is a dispute where the *primary* disagreement is **not about the non-linguistic facts** of the world, but rather **about which concept a particular word or phrase should express**, or **how a concept should be bounded**, especially when the choice carries significant normative, practical, or theoretical weight. The parties are negotiating *through* the language *about* the language/concepts themselves.

  2.  **Why it Fits Your Examples:**
      *   **Responsibility:** You and your interlocutor agree on the *facts* about the flatmate, the window, and the hailstorm. The disagreement is about what the word "responsibility" *ought to mean* in contexts like this. Should it track the "ultimate authorship" concept (which leads to skepticism) or the "practical blame allocation" concept (which preserves everyday usage)? Each side thinks *their* concept is the one that *matters* or captures the "real essence" of responsibility. The stakes are normative/philosophical: what kind of control or ownership justifies blame/praise?
      *   **Machine Thinking:** Both sides might agree on the *facts* about the machine's input-output behavior and internal processing. The disagreement is about whether the word "think" *should* be applied to this set of facts. Should it require phenomenal consciousness (the "inner experience" concept) or is sophisticated information processing sufficient (the "functional" concept)? The stakes are conceptual/philosophical: what constitutes genuine thought vs. mere simulation? What kind of phenomenon are we *really* interested in when we talk about "thinking"?

  3.  **Key Distinguishing Features (from near neighbors):**
      *   **Ordinary Ambiguity / Lexical Polysemy:** This occurs when a word has multiple established meanings (e.g., "bank" = financial institution or river edge). Crucially, in ordinary ambiguity, **the parties can often recognize and disambiguate the meanings contextually or by stipulation ("use subscripts") without deep disagreement.** The dispute *resolves* once the ambiguity is clarified. In your examples, disambiguation *doesn't* resolve the dispute because the core issue is *which meaning should be privileged* as the correct or important one in this domain. The disagreement persists *about* the meaning itself.
      *   **Merely Verbal Dispute:** This is a broader category often encompassing both ordinary ambiguity and metalinguistic negotiation. However, "merely verbal" often carries the implication that the dispute is trivial or resolvable by simple clarification. **Metalinguistic negotiations are *substantive* verbal disputes.** They are "merely verbal" only in the sense that they are *about* language/concepts, but they are *not trivial* because the choice of concept has significant implications (e.g., moral responsibility, the nature of mind, legal liability, AI ethics). The "getting cross" you experience signals the substance beneath the verbal surface.
      *   **Conceptual Analysis Disagreement:** This is very close. Metalinguistic negotiation is *a type of* conceptual disagreement. However, it specifically highlights that the disagreement manifests *as* a dispute about word meaning, and that resolving it requires negotiating *which* concept (or which boundaries for a concept) we *should* be using for a particular purpose, often involving normative considerations about the *point* of the concept. It's not just analyzing *what we currently mean*, but *what we ought to mean*.
      *   **Boundary Dispute:** This captures the aspect of arguing about where the limits of a concept lie (e.g., is Pluto a planet? Is a virus alive? Is this act "violent"?). Metalinguistic negotiation often involves boundary disputes, but emphasizes that the dispute is *conducted through* language and involves negotiation about the *criteria* defining the boundary, driven by deeper commitments.
      *   **Economists & 'Recession' (Your Counter-Example):** This *is* ordinary ambiguity/polysemy or potentially a technical stipulation. Both economists likely recognize the different technical definitions (e.g., two consecutive quarters of negative GDP growth vs. a broader set of economic indicators showing significant decline). They can easily clarify which definition they are using for a specific analysis. The disagreement, if any, would likely be about *which technical definition is more useful* for a specific purpose, but crucially, **they aren't arguing that the *other* economist's sense isn't *really* a sense of "recession" or that it's illegitimate.** They likely agree both are valid technical usages. In your cases, each side thinks the *other* side's concept isn't the *real* responsibility/thinking, or isn't the one that matters for the deep philosophical question at hand.

  4.  **Why "Metalinguistic Negotiation" is the Best Fit:**
      *   **"Metalinguistic":** The dispute is *about* the language itself (what 'responsibility'/'thinking' means/should mean).
      *   **"Negotiation":** It implies an active, often substantive, disagreement where parties are advocating for their preferred conceptualization, driven by underlying values, theoretical commitments, or views about the practical/normative stakes. It's not just a passive recognition of difference.
      *   **Captures the Stakes:** It explicitly allows for the "getting cross" element – the negotiation matters because the outcome affects how we understand fundamental concepts with real-world implications (blame, punishment, personhood, machine capabilities).
      *   **Distinguishes from Trivial Ambiguity:** It focuses on cases where simple disambiguation fails because the *choice* of concept is itself the contested issue.
      *   **Covers Both Cases:** It perfectly encompasses the responsibility and machine thinking examples you gave.

  **In summary:** You're encountering **metalinguistic negotiations**. These are substantive disputes where the primary disagreement concerns *which concept a term should express* or *how a concept should be bounded*, driven by underlying normative, theoretical, or practical commitments. The disagreement persists even when non-linguistic facts are agreed upon because the core issue is *conceptual choice* itself, and each side believes their preferred concept is the correct or important one. Ordinary ambiguity is insufficient to describe it because the parties are fundamentally contesting *which meaning is legitimate or primary* for the philosophical purpose at hand.

  **Key References (for your literature dive):**
  *   **David Plunkett & Tim Sundell:** They are the most prominent contemporary philosophers developing this framework explicitly. See:
      *   Plunkett, D., & Sundell, T. (2013). Disagreement and the Semantics of Normative and Evaluative Terms. *Philosophers' Imprint*, 13(23), 1–37. (The foundational paper)
      *   Plunkett, D. (2015). Which Concepts Should We Use?: Metalinguistic Negotiations and The Methodology of Philosophy. *Inquiry*, 58(7-8), 828–874.
  *   **Herman Cappelen:** His work on "conceptual engineering" and "verbal disputes" is highly relevant, though his framing differs slightly. See *Fixing Language: An Essay on Conceptual Engineering* (2018).
  *   **Sally Haslanger:** While focused on gender/race concepts, her work on "ameliorative analysis" is a form of conceptual engineering where the *point* of the concept drives the negotiation (e.g., what *should* 'woman' mean for feminist purposes?).
  *   **Ludwig Wittgenstein & Later Ordinary Language Philosophy:** While not using the term, the idea that philosophical problems can arise from misunderstandings about language use, and that meaning is tied to use within a "form of life," is a deep background influence.

  Recognizing this structure can help you step back from the immediate frustration ("round in circles") and reframe the debate: "It seems we are engaged in a metalinguistic negotiation about what concept *ought* to be expressed by the term 'responsibility' in this context. Your arguments presuppose the 'ultimate authorship' concept is primary, while mine presuppose the 'practical accountability' concept. To move forward, we need to discuss *why* we think our preferred concept is the one that captures what's truly important about responsibility..." This shifts the focus to the underlying motivations and stakes, which is often where the real philosophical work lies.
