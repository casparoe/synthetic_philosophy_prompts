prompt: |-
  ok so this is long, sorry, but the details are the whole point here.

  Background: I've been reading LessWrong/Slate Star Codex-adjacent blogs for over a decade, did a couple of years of forecasting on Metaculus, and I'm probaly the guy in my friend group who brings up prediction markets at parties. So I'm not coming to futarchy as a skeptic — I already think it's one of the most underrated ideas in political economy. Which is exactly why I want you to be hard on me rather than encouraging.

  The situation: my city is running a participatory budgeting pilot this year, and a friend and I want to pitch the council on going further and actually adopting futarchy for the next budget cycle. I'm writing the pitch doc now. Before I do, I want to check my own understanding, because if I get the mechanism wrong in front of a council I'll look like an idiot and set the idea back a decade locally.

  Here's my model, spelled out:

  1. We pick a metric that stands in for the public good. GDP per capita is the obvious one, or maybe median income, or a happiness index if we can get survey data.
  2. We set up prediction markets on what that metric will be five years out.
  3. Departments and outside groups propose budget policies. Traders bet on what the metric will be under each proposal.
  4. The market converges on the true expected value of the metric for each policy, and whichever policy has the highest number gets funded.
  5. Since prediction markets are efficient, the market's number is basically correct, so we can trust it.
  6. The beautiful part is that this takes the politics out of budgeting. Nobody has to argue about what's worth wanting anymore — the market just tells us which policy actually produces more of the good thing.

  Now, my questions:

  (a) Is it right that the only genuinely hard problem here is choosing the metric? Once you've got the metric, is everything else just engineering — liquidity, traders, resolution, that kind of thing?
  (b) What metric should we use? GDP feels crude but at least it's measurable. Is there something better that's still tractable for a mid-sized city?
  (c) Am I right that this lets us skip the part where we vote on what we value? Because if the market just tells us which policy produces more of the good thing, then there's no value disagreement left to have, which is the part of politics I find most exhausting.

  Take the role of a political economist / mechanism design person who has read the original futarchy proposal and the academic pushback on it — there's a decent critical literature, and I want the objections that actually bite, not the knee-jerk markets-are-icky stuff.

  Before you answer, do a quick pass: go through my six numbered points and mark each one true, half-true, or wrong, with one line on why. Then give me the real answers to (a), (b) and (c). Think carefully here; I'd much rather be told my model is broken in some specific way than be told it's promising. And please dont just tell me to go read the literature — give me the actual arguments, because I have to defend this in a room full of people who have never heard of any of it.

  One last thing: if there's a version of this proposal that would actually work, tell me what it looks like — but only after you've told me what's wrong with mine.
reasoning: |-
  Okay, let me tackle this user's futarchy proposal step by step. The user is clearly knowledgeable and invested in the concept, having followed related blogs and engaged in forecasting. Their passion for implementing this in their city's budgeting process is evident, but they want rigorous critique to avoid missteps.

  First, I need to assess their six numbered points honestly. Point 1 about selecting a metric seems half-true - while necessary, GDP alone is problematic for local governance. Point 2's five-year horizon ignores short-term impacts and discounting issues. Point 3's policy isolation is wrong because real-world policies interact in complex ways. 

  For point 4, market convergence to "true" expected value is half-true at best - thin markets and manipulation risks are real concerns. Point 5's claim that markets are "basically correct" is dangerously oversimplified given the literature on market failures. Point 6's assertion that this removes politics is wrong - metric selection and policy design remain deeply political.

  Now addressing their specific questions: (a) The metric isn't the only hard problem - incentive design and market robustness are equally challenging. (b) GDP is inadequate for cities; I should suggest alternatives like composite indices with local data. (c) The value conflicts don't disappear - they just shift to metric selection and implementation details.

  The user might be underestimating how political the "apolitical" mechanism really is. Their desire to bypass value debates is understandable but unrealistic - even Robin Hanson acknowledges this limitation. I should emphasize practical alternatives like starting with pilot markets for specific projects rather than full budget allocation.

  What worries me most is the potential for backlash if oversold. The council members won't care about prediction market theory - they'll want to know about voter perception and implementation costs. I'll structure the critique to first validate their vision before detailing why the initial model won't work, then offer a scaled-down approach that maintains the core insight while being politically viable.
answer: |-
  Here's a hard-nosed, literature-informed critique of your model, followed by realistic adjustments. I'll mark your points as requested, then answer (a)-(c) directly.

  **Critique of Your 6 Points:**

  1.  **"Pick a metric for public good."** → **Half-True.**  
      *Why:* Necessary *in theory*, but fatally oversimplified. GDP/median income ignore distribution, externalities, non-market goods (parks, safety, equity). Happiness indices are noisy, manipulable, and lagging. **The metric choice *is* the value debate in disguise.** What you omit (inequality, environment) becomes politically contentious.

  2.  **"Set up markets on metric 5 years out."** → **Half-True.**  
      *Why:* 5 years ignores short-term costs/long-term benefits beyond the horizon. Discount rates matter. Markets struggle with extreme tail risks (pandemics, disasters) and "unknown unknowns." Liquidity for *every* proposal is unrealistic (see point 3).

  3.  **"Proposals bet on, traders bet."** → **Wrong.**  
      *Why:* This assumes policies are **atomistic and independent**. Reality: Policies interact (e.g., funding police vs. social services affects crime metrics differently if both are funded). Markets for *all possible combinations* are combinatorially explosive. Traders need expertise on *every* proposal – impossible.

  4.  **"Market converges to true EV, highest wins."** → **Half-True (at best).**  
      *Why:* Markets *can* be efficient with **thick liquidity, informed traders, and no manipulation.** Your setup guarantees none. Thin markets (for niche proposals) are easily manipulated or noisy. "True EV" assumes perfect foresight traders don't have (Keynes: "Markets can stay irrational..."). **Manipulation risk is high** (e.g., a developer shorts "parks funding" to kill a project near their land).

  5.  **"Markets efficient, so trust the number."** → **Dangerously Wrong.**  
      *Why:* Prediction markets work well for **binary, near-term, verifiable events** (sports, elections). They fail catastrophically for **complex, long-term, multi-causal, manipulable outcomes** like city GDP/happiness. Evidence: No operational futarchy exists beyond tiny experiments. Manipulation, reflexivity (betting influences policy which influences outcome), and Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure") are fatal flaws.

  6.  **"Takes politics out, no value disagreement."** → **Completely Wrong.**  
      *Why:* **Politics is displaced, not eliminated.** Brutal fights erupt over:  
      *   *Metric definition:* Is it GDP? GDP + Gini? Happiness? Who controls this?  
      *   *Policy bundling:* How are proposals structured? (See Point 3).  
      *   *Market rules:* Who can trade? With what limits? Who funds liquidity? Who resolves disputes?  
      *   *Baseline:* Against what is the policy's effect measured?  
      **The value conflict is now about meta-rules**, not specific policies, and is arguably *more* opaque and less democratic.

  **Answers to Your Questions:**

  **(a) Is the metric the only hard problem?**  
  **No. It's the *first* hard problem, but far from the only one.**  
  *   **Engineering Problems:** Liquidity provisioning (who pays?), preventing manipulation (sybil attacks, wash trading), trader recruitment (who has skin in the game/expertise?), resolution criteria (data revisions? disasters?), low-volume markets.  
  *   **Mechanism Problems:** Policy interaction/combinatorics, time horizons/discounting, baseline setting, separating correlation/causation in bets.  
  *   **Political Problems:** Legitimacy (why trust traders more than voters/council?), accountability (who gets fired if it fails?), transition (how to phase in?), legal authority (can a market legally bind budget allocation?).  
  *   **Epistemic Problems:** Markets aggregate *existing* knowledge poorly on complex, novel policies. Traders bet on expectations, not ground truth.

  **(b) What metric? GDP vs. Alternatives?**  
  **GDP is terrible for a city.** It ignores:  
  *   Commuters (inflates city GDP),  
  *   Inequality (can rise while median falls),  
  *   Cost of Living (nominal GDP is misleading),  
  *   Non-market goods (clean air, safety, community).  
  **"Better" (but still flawed) options:**  
  1.  **Adjusted Median Household Income:** Local, accounts for inequality better than mean GDP. Still ignores non-income factors.  
  2.  **Local Composite Index:** Build your own (e.g., 40% employment rate, 30% median rent burden, 20% crime stats, 10% park access). **Problem:** Weighting = politics. Requires robust, frequent local data.  
  3.  **Highly Specific Proxy:** "Reduction in % of households spending >30% income on rent + utilities." Narrow, measurable, less gameable, but misses other goods.  
  **Brutal Truth:** *No single metric works.* Futarchy's core weakness is **monomania** – optimizing one thing ignores trade-offs. A city isn't a corporation.

  **(c) Does this skip value disagreements?**  
  **Absolutely not. It obscures and entrenches them.**  
  *   **Metric Choice IS Value Choice:** Picking GDP says "growth above all." Picking median income says "equitable growth." Picking happiness says "subjective well-being." This is pure politics.  
  *   **Market Rules ARE Value Choices:** Who trades? (Only property owners? Residents?) = Who has influence? Funding liquidity = Who subsidizes the market?  
  *   **Policy Definition IS Value Choice:** What counts as a "policy proposal"? Who bundles them? (e.g., "Police + Job Training" vs. "Police Only").  
  *   **The "Good Thing" Illusion:** The market doesn't tell you which policy *produces* the good thing. It tells you which policy *traders believe* will *make the metric number go up*. These are different due to manipulation, error, and Goodhart's Law. **You replace messy democratic debate with a black box whose inputs are still political.**

  **The Biting Academic Critiques (Beyond "Markets Icky"):**  
  1.  **Goodhart's Law / Campbell's Law:** Any metric used for control becomes corrupt. Traders bet on metric movement, not underlying welfare. Gaming becomes rational.  
  2.  **Manipulation & Sabotage:** Actors can profit by betting *against* good policies or sabotaging outcomes. Costly to prevent in complex, long-term markets.  
  3.  **Combinatorial Explosion:** Evaluating policies independently is impossible; evaluating combinations is intractable.  
  4.  **Epistemic Limits:** Markets excel at aggregating known info about predictable events. They fail at predicting the effects of novel, complex social interventions.  
  5.  **Value Aggregation Failure:** Markets aggregate *beliefs* about a metric, not values. They ignore distribution, rights, justice, and non-commensurable goods.  
  6.  **Legitimacy & Accountability:** Undemocratic. Voters lose direct control. Who answers for failures? Opaque decision-making.

  **A Version That *Might* Work (Pilot-Scale, Not Full Futarchy):**  
  **Forget full budget allocation. Start small with a specific, measurable goal:**  
  1.  **Define a Narrow, Measurable Outcome:** "Reduce pedestrian fatalities at intersections by 15% in 3 years" or "Increase 3rd-grade reading proficiency in District X by 10% in 2 years."  
  2.  **Fund a Pilot Pool:** Allocate $500K from PB for projects targeting *this specific outcome*.  
  3.  **Run a *Policy Analysis Market* (PAM):**  
      *   **Proposals:** Community groups/city depts. submit concrete plans.  
      *   **Market Structure:** Traders bet on the **difference in outcome** between implementing Proposal A vs. *Status Quo* (or vs. Proposal B). **Binary or few options.**  
      *   **Traders:** Vetted experts, stakeholders, citizens with skin-in-the-game (small bonds). Use a LMSR or similar for liquidity.  
      *   **Resolution:** Clear, objective data source (traffic cameras, standardized tests).  
      *   **Decision:** Council uses market probabilities as a **strong input** (not the sole decider) for allocating the pilot pool.  
  4.  **Evaluate Rigorously:** Track real outcome vs. market prediction. Learn about manipulation, liquidity needs, trader behavior.

  **Why this is more realistic:**  
  *   **Manages Complexity:** Narrow scope, fewer interactions.  
  *   **Reduces Manipulation Risk:** Shorter horizon, clearer resolution.  
  *   **Retains Accountability:** Council makes final choice using market input.  
  *   **Builds Legitimacy:** Focuses on concrete problems citizens care about.  
  *   **Generates Evidence:** Tests the mechanism without betting the city.  
  *   **Avoids Monomania:** Only replaces debate on *how best to achieve X*, not what X should be.

  **Your Pitch Reality Check:**  
  Pitching full futarchy to a city council will likely backfire. They'll see complexity, risk, and loss of control. Instead:  
  1.  **Frame it as "Smarter Pilot Funding"** within their existing PB process.  
  2.  **Focus on a Specific Problem:** Pick one high-visibility, measurable goal.  
  3.  **Emphasize Input, Not Abdication:** Markets inform expert judgment, don't replace democracy.  
  4.  **Pilot, Pilot, Pilot:** Propose a tiny, time-bound experiment.  
  5.  **Acknowledge Trade-offs:** Be honest this won't solve value disputes, just maybe improve efficacy *for a specific, agreed aim*.

  You love futarchy? Prove its value incrementally. Start small, learn fast, and scale only what works. Going all-in now guarantees the "idiot setting the idea back a decade" outcome you fear. Good luck!
