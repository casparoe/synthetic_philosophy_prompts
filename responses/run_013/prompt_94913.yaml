prompt: |-
  Hey, I'm putting together the final for my upper-level seminar on animal minds and comparative cognition, and I want one essay question on Dennet's four grades of creatures -- you know, Darwinian, Skinnerian, Popperian, Gregorian. The problem is every year students just reguritate the standard summary: Darwinian creatures are hardwired, Skinnerian creatures learn by reinforcement, Popperian creatures simulate, Gregorian creatures use tools and language. I want a question that makes them actually think about what the ordering is supposed to be tracking. Here's my half-baked idea: the grades are usually presented as a hierarchy of intelligence, but I think they're better understood as a hierarchy of how much of the relevant information is stored inside the organism versus how much is offloaded onto the environment or onto other minds. So I want a question that forces them to distinguish those two axes -- cognitive sophistication versus internalization -- and then asks whether the Gregorian grade is really a fourth grade at all or just a special case of the Popperian one once you add cultural scaffolding. Can you write the exam question, a model answer of about 600-700 words, and a marking scheme that separates an A from a B answer by naming the specific moves each must contain? The question should be answerable in 90 minutes, and it should be impossible to get full marks by just reciting Dennett. Also, don't ask for citations or reading lists -- these kids can't search the web during the exam anyway. And please write the response in continuous prose, no headings, no bullet points, no bold, no tables. Just an email-style answer. Oh, and one more thing: I want the marking scheme to have a few specific traps -- like, a student who says the Gregorian grade is just about tool use should lose marks, and a student who collapses the internalization axis into the intelligence axis should lose marks. Make the model answer actually take a stand, not just survey the options. Thanks.
