prompt: |-
  A historian I know gave a lecture on the end of dueling and of the Atlantic slave trade, and summarized the philosophical literature on moral revolutions like this: "Nobody was ever argued out of dueling or out of slavery. The moralists had made the arguments for a century or more and the practices went on. What ended them was that they became dishonorable and expensive — dueling stopped being what gentlemen did and became what ruffians did; slavery stopped paying, and the abolitionists made it shameful to own slaves. The Williams thesis is the same point about the slave trade: the arguments we now find so compelling were not what did the work, and they look compelling to us only because we already have the sentiments that make them look that way. So moral revolutions are driven by interest and shame, and reasons are at best the slogans later generations attach to changes that were happening anyway."

  I find this bracing, and it fits my own sense that moral argument rarely moves anyone. But I would like to know how much of it I can safely repeat. Which parts would Appiah accept, which parts misrepresent what he and Williams actually argue, and does the general lesson about interest and shame follow from the parts that are accurate? I am also unsure whether the summary slides from a claim about what moves people to a claim about the status of the moral judgments themselves, and whether that slide changes the conclusion I would be taking away. Please be explicit about what a defender of each author would object to, and about what survives once the summary is corrected.
reasoning: |-
  Okay, the user has shared a historian's summary of moral revolutions, specifically regarding dueling and the Atlantic slave trade. The historian claims that arguments didn't end these practices—instead, they became dishonorable and economically unviable. The user is seeking to understand which parts of this summary align with Kwame Anthony Appiah's and Bernard Williams' actual arguments, and where the summary might misrepresent them.

  First, I need to recall what Appiah and Williams actually argued. Appiah, in "The Honor Code," emphasizes honor and social perception as drivers of moral change. For dueling, he points out that it declined when it started being seen as something ruffians did, not gentlemen. For footbinding, it was when Chinese reformers associated it with national backwardness. So the historian's take on dueling matches Appiah here. Regarding slavery, Appiah does discuss economic factors but also stresses that abolitionists made slave-owning shameful among elites. Williams, in "Shame and Necessity," focuses on how shame—rooted in social expectations—plays a role in ethical life. He's skeptical about whether moral reasons alone drive change, which aligns with the historian's point about arguments not being the primary mover.

  However, the historian's summary oversimplifies. While Appiah and Williams downplay the effectiveness of moral arguments in isolation, they don't dismiss them entirely. Appiah shows how arguments were repackaged to appeal to honor—economic reasons were framed as national strength, moral concerns as matters of reputation. Williams distinguishes between internal and external reasons; reasons only motivate when they connect to existing motivations. So the historian's claim that "nobody was ever argued out" is too strong. Arguments worked when tied to honor or shame.

  The user also wonders if the summary conflates what moves people with the status of moral judgments. That's a key point. Appiah and Williams are making descriptive claims about how changes happened, not saying that the moral judgments themselves lack truth. The historian's summary might imply moral relativism—that reasons only seem compelling because we already accept certain sentiments. But Williams argues that internal reasons are objective relative to an agent's motivations. So the slide from description to meta-ethics is problematic. A defender would insist that explaining the change doesn't undermine the truth of abolitionist arguments.

  On the slave trade, Eric Williams' thesis (which Bernard Williams engages with) argues that economic decline led to abolition. Appiah incorporates this but adds that shame was crucial too. The historian's mention of the "Williams thesis" likely refers to Eric, not Bernard. Bernard Williams acknowledges economic factors but sees them as part of a broader shift where slavery became incompatible with emerging self-conceptions.

  The user's deeper concern might be about whether moral arguments are futile. Appiah and Williams suggest arguments need to connect to emotions, honor, or identity to be effective. The takeaway isn't that reasons don't matter, but they must be integrated with psychological and social factors. The user should avoid the strong claim that arguments never work, instead noting they work through honor and shame. Also, avoid implying moral relativism—explaining the origin doesn't negate the validity of moral judgments.

  In correcting the summary: emphasize that arguments were necessary but insufficient without being tied to honor/shame; economic factors interacted with moral shaming; and the descriptive account doesn't undermine normative truths. The core lesson survives if softened: interests and shame are primary drivers, with reasons playing a supporting role by framing changes in compelling ways. This helps the user accurately present the ideas without oversimplification or unintended philosophical implications.
answer: |-
  This is an insightful but somewhat oversimplified summary that captures important aspects of Appiah and Williams while distorting others. Let's break it down piece by piece, distinguishing what survives correction from what requires refinement or rejection. Key texts: Appiah's *The Honor Code* (on dueling, footbinding, slavery) and Bernard Williams' *Shame and Necessity* (and his engagement with Eric Williams' *Capitalism and Slavery*).

  **Parts Appiah Would Accept (with nuance):**
  1.  **The Primacy of Honor/Shame:** Appiah's core thesis is that **moral revolutions succeed when practices become *dishonorable*** within the relevant social group. Dueling declined when elites saw it as "ruffianly" rather than gentlemanly. Footbinding ended when Chinese reformers framed it as making China "backward" and "uncivilized" in the eyes of the world. Slavery's abolition involved making it deeply shameful for elites (e.g., in Britain) to participate in or support it. *He emphatically agrees that abstract moral arguments alone were insufficient for centuries.*
  2.  **Arguments Look Compelling Because of Changed Sentiments:** Appiah argues that philosophical arguments *gain traction* when they resonate with evolving ideas of honor and identity. We find past defenses of slavery appalling *because* our honor code (shaped by the revolution) now values equality and condemns exploitation in ways it previously did not. The arguments didn't *cause* the shift in sentiment but became powerful tools *because* of it.
  3.  **The Role of Interest (Economy):** Appiah acknowledges Eric Williams' thesis that the *declining economic profitability* of the West Indian sugar colonies played a significant role in enabling British abolition. He sees this as a crucial factor that *created the conditions* where moral arguments and shaming could become effective. It wasn't just altruism; economic shifts made resistance less fierce.

  **Parts Appiah Would Reject or Sharply Qualify:**
  1.  **"Nobody was ever argued out..." / "Reasons are at best slogans...":** This is the biggest overstatement. Appiah does **not** dismiss the role of argument or reason.
      *   *How arguments function:* Moral arguments *were* essential, but not as abstract logic delivered in a vacuum. Abolitionists (like Clarkson, Equiano) and anti-dueling reformers *framed* their arguments explicitly in terms of **honor, national character, hypocrisy, and manliness**. They used reason *to redefine what honor meant*. Arguments weren't "slogans after the fact"; they were the *tools* used to reshape the sentiment of honor *during* the struggle. They made the shame *intelligible* and *articulate*.
      *   *Not "slogans later":* The arguments were actively deployed *to create* the change in perception. The Haitian Revolution (driven by enslaved people) was a terrifyingly concrete "argument" that fundamentally reshaped the economic and moral calculus.
  2.  **"Driven by interest and shame":** While interest (economic shifts) and shame are central, Appiah presents a more complex picture:
      *   *Shame is intertwined with identity:* It's not just feeling bad; it's about failing to live up to a *redefined* ideal of self and group identity that reformers argued *for*.
      *   *Interest enables, doesn't drive:* Economic decline in the West Indies *weakened* the pro-slavery lobby, making abolition politically feasible. It didn't *motivate* the moral shift in the broader public or elites; shame and honor did. The driving *moral* force was the redefinition of honor.
      *   *Other factors:* He notes the role of religion (evangelicalism fueling abolitionist fervor as a matter of *duty* and *purity*), politics, and contingent events.

  **Bernard Williams' Position (Relevant to Shame and Reasons):**
  1.  **Shame vs. Guilt:** Williams argues **shame** is a more fundamental and socially embedded ethical emotion than guilt. Shame concerns failing to live up to ideals (often shared social ideals) of who one *ought to be*, damaging one's standing in the eyes of others and oneself. This aligns with the emphasis on practices becoming "dishonorable."
  2.  **Internal vs. External Reasons:** This is crucial. Williams argues that for a reason to *motivate* an agent, it must connect to their existing "motivational set" (desires, projects, commitments, sense of identity). An abstract moral argument ("slavery is wrong") is an *external reason* to someone whose identity and interests are bound up in slavery. It only becomes an *internal reason* (a reason *for them*) when it connects to something they *already* care about or when their motivational set *changes*.
      *   *The Historian's Point:* "arguments we now find so compelling were not what did the work, and they look compelling to us only because we already have the sentiments" captures Williams' view of *external* reasons failing and the dependence on an agent's motivational set (sentiments).
      *   *Williams' Nuance:* Reformers succeeded by **linking the abstract argument to elements *within* the existing motivational sets of elites:** their sense of honor, national pride, Christian duty, or (later) economic self-interest framed morally. Arguments *changed* the motivational set by redefining honor. Reasons aren't *just* slogans; they are the *means* by which the redefinition of honor (and thus the shift in the internal reasons landscape) occurs.
  3.  **Eric Williams' Thesis:** Bernard Williams engaged seriously with Eric Williams' economic argument. He likely agreed that economic factors were necessary conditions and powerful enablers, but **not sufficient** explanations for the *moral* shift. The economic decline made the *political* victory possible, but the *moral* victory required the shaming and redefinition of honor documented by Appiah. B. Williams would resist a *purely* economic determinism.

  **The Slide from Motivation to Moral Status & Its Danger:**
  You are absolutely right to flag this. The historian's summary slides from a (mostly correct) **descriptive/sociological claim** about *how moral change happened historically* ("what moves people") to a much more contentious **meta-ethical claim** about the *status of moral judgments themselves* ("reasons are at best slogans... they look compelling only because we have the sentiments").

  *   **Defender's Objection (Appiah/Williams):** Both are primarily making *explanatory* claims about historical causation and moral psychology. They are **not** necessarily claiming moral judgments like "slavery is wrong" are *merely* expressions of sentiment with no objective basis. Appiah explicitly defends the *truth* of the moral judgments that prevailed. Williams' internal reasons theory is about *motivation*, not necessarily *truth*.
  *   **The Danger:** The summary risks implying **moral relativism** or **non-cognitivism**: that moral judgments *only* have force relative to a society's current sentiments, and that the reasons given for them are just rationalizations. This is *not* a necessary conclusion from their descriptive accounts. One can fully agree that shame and interest were the primary *engines* of change in these cases while still believing that the abolitionists' arguments were *true* and that slavery was *objectively wrong*, regardless of contemporary sentiments. The explanation of *how* a true moral belief prevailed doesn't undermine its truth.

  **What Survives Correction: A More Precise Lesson**

  Once corrected for overstatement and the illicit slide, a powerful and defensible lesson remains:

  1.  **Primacy of Honor/Shame:** Profound moral changes concerning entrenched social practices are typically driven not by winning abstract philosophical debates, but by successfully **redefining social honor**. When a practice becomes deeply *dishonorable* within the relevant community (e.g., elites), its foundations crumble.
  2.  **Role of Interest:** Material interests (especially economic shifts) can be crucial **enabling conditions**, removing powerful obstacles or altering cost-benefit analyses, making moral/political change feasible. They rarely *cause* the moral shift directly but create the space for it.
  3.  **Function of Reason/Argument:** Moral arguments are essential, but **not as abstract logic**. They succeed by being **strategically deployed** to *redefine* what honor, identity, and duty require. They articulate the shame and connect condemnation to the agent's existing values and self-conception (making external reasons internal). They are the *tools of persuasion and redefinition*, not just post-hoc slogans.
  4.  **Sentiments Enable Reasons:** For moral arguments to be *compelling* or *motivating*, they must resonate with the agent's existing "motivational set" (Williams) or sense of identity/honor (Appiah). The widespread acceptance of an argument often *follows* a shift in underlying sentiment, which the argument itself helped to shape through redefinition.

  **Conclusion for Your Use:**

  You can safely repeat the core insight that **dueling and slavery ended primarily because they became profoundly dishonorable to the elites who sustained them, and that economic factors played a significant enabling role.** Emphasize Appiah's focus on **honor redefinition** as the engine.

  **Refine the problematic parts:**
  *   Instead of "Nobody was ever argued out," say: "Abstract moral arguments alone failed for centuries; arguments only became powerful when reformers linked them directly to redefining honor and identity."
  *   Instead of "reasons are at best slogans," say: "The compelling force of the moral reasons we now accept depended on a prior shift in sentiments about honor, which those reasons helped to articulate and solidify."
  *   Avoid implying moral relativism: Clearly separate the *explanation of how the change happened* (honor, shame, interest) from the *moral status of the judgments* (e.g., slavery was wrong). You can say: "Appiah/Williams explain *how* these practices ended, not that the arguments against them weren't true."

  The general lesson that **"moral revolutions are driven significantly by shifts in honor/shame and facilitated by material interests, with reasons serving as crucial tools for redefinition rather than abstract winning arguments"** survives correction and is a powerful and defensible interpretation of Appiah and Williams. Just avoid the strong dismissals of reason and the slide into implying moral judgments lack objective force.
