  With equity weighting: in 10 years, the beneficiary consumption is 50% of the national average. The national average in 10 years: (1.02)^10 = 1.219 times today's average. So the beneficiary's consumption is 0.5 * 1.219 = 0.6095 times today's national average. The marginal utility adjustment: (C_avg_today / C_beneficiary_10years) = 1 / 0.6095 ≈ 1.64. So the adjusted benefit: 1.1 * 1.64 = 1.804 billion. Present value: 1.804 / (1.02)^10 ≈ 1.804 / 1.219 ≈ 1.48 billion. So benefits > costs, approve.

  This case would show whether she uses equity weighting.

  But note: the committee might not take up such a case because it's near-term and not intergenerational. We need a long-horizon case? But the point is to separate the rules. Alternatively, we can have a long-horizon case with a clear difference in consumption.

  Another case: a project that costs a small amount now to provide a large benefit to a future generation that is expected to be much poorer. If she approves that, then she uses equity weighting.

  But in our delta case, even with equity weighting, the project was rejected under most discount rates. Only under a very low rate was it approved.

  Conclusion: the record underdetermines the verdict in the sense that we don't know if she uses equity weighting and we don't know the exact discount rate schedule. But under the most plausible assumptions (no equity weighting and a discount rate schedule that gives around 1% for 126 years), we reject.

  The one further fact that would settle it: whether she uses equity weighting for benefits going to poorer groups. If she does, and if she uses a very low discount rate for this horizon, then she might approve. But without knowing that, we lean towards reject.

