  3. She might not use equity weighting because it was not mentioned in the earlier rulings. And even with equity weighting, the benefits only exceed costs under an extremely low discount rate.

  The closest analog from the six rulings: ruling 1 (climate policy) because it involves long-horizon welfare evaluation. But in ruling 1, she uses 2% for the first decades. Here, the benefits start in 126 years, so the discount factor is very small. The analogy holds in that it's a welfare project with long horizons, but breaks because the beneficiaries are poorer (which might call for equity weighting) and there is a probability of no beneficiaries.

  Strongest case against my guess: 
