  But is using 0.5% reasonable? The committee's guidance goes below 1% after two centuries. For 126 years, it might be around 1% or higher. 0.5% is very low and might be for horizons beyond 200 years.

  Given the above, without equity weighting, the project is rejected under any reasonable discount rate. With equity weighting and a very low discount rate, it might be approved. But the low discount rate (0.5%) is probably too low for 126 years.

  My best guess: she will reject the project.

  Reasons:
  1. The benefits are too far in the future and discounted heavily even with a declining schedule.
