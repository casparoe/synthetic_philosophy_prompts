  We are building a decision procedure for distinguishing treatment from enhancement for prior authorization appeals. The procedure must be run by reviewers with no philosophy training, 20 minutes per case, and defensible in plain English. It must consider five axes in order: A, B, C, D, E.

  Key principles:
  - Treatment: intended to address a medical condition, restoring or maintaining normal function.
  - Enhancement: improving function beyond what is typical or normal, often for non-medical reasons.

  However, we are grounding in the real debates:
  - Biostatistical/normal-functioning view: treatment restores normal species functioning.
  - Welfarist objections: focus on well-being, not just statistical normality.
  - Disability rights critique: "normal" is a social construct and can be discriminatory.

  We are using five axes:

  A. Reference class / baseline: What population and counterfactual define "normal"? Who picks?
     - We must define the reference class (e.g., age, sex, species-typical) and the counterfactual (what would be normal for this individual without the condition?).
     - Key: if there is no objective basis for the reference class (e.g., using a broad population that includes people with disabilities when the condition is a disability) and it is contested, we may need to escalate.

  B. Positional vs non-positional benefit (Hirsch): Is the benefit mostly relative (zero-sum) or absolute?
     - Positional: benefit comes from being better than others (e.g., height in basketball). Non-positional: absolute improvement (e.g., being able to walk without pain).
     - If the benefit is primarily positional, it is more likely enhancement.

  C. Reversibility and identity: Is the change reversible? Does it alter the person's self-narrative or a community's shared form of life? Does this change the verdict?
     - Irreversible changes that alter identity (e.g., genetic modifications) might be more contentious and lean towards enhancement, but this is complex.

  D. Third-party and distributive effects: Does funding this pull resources from someone with a stronger claim on A-C?
     - Consider opportunity cost: if we fund this, are we denying a more compelling treatment? This step may require comparing the strength of the claim.

  E. Consent and coercion: Would declining impose a serious cost (job, social standing, access)? Is the choice free?
     - If there is significant coercion (e.g., job loss without the intervention), it might shift towards treatment.

