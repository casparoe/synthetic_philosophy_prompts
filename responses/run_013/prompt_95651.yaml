  ### Limitations and Failure Modes
  1. **Misfires**:  
     - **False Enhancements**: Ignores welfare in rigid resource decisions (e.g., Step D overrides Step E coercion).  
     - **False Treatments**: Positional benefits masked as absolute (e.g., Step B misclassifying "focus" drugs for exams as non-positional).  
     - **Escalation Overload**: Steps C (identity) and D (cost) often escalate, slowing reviews.  

  2. **Can’t Decide**:  
     - **Preventive Interventions**: Vaccines for rare diseases (Step A unclear if "at-risk" is diseased).  
     - **Neurodiversity**: ADHD meds for high-functioning adults (Step A pathologizes normal variation).  
     - **Cultural/Social Claims**: Deaf parents refusing cochlear implants for child (Step C identity clashes with Step A pathology).  

  **Final Note**: This procedure optimizes for defensibility, not moral perfection. It fails when "normal" is indefensible (e.g., gender-affirming care) or cost thresholds are unjust. Use it to *contain* disputes—not resolve them.
