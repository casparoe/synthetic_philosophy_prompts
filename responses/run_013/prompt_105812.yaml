prompt: |-
  I've spent several years working on anti-corruption programmes and I keep running into a pattern I have no word for. A district officer fast-tracks a permit for a man from his own village. To the funder this is corruption: public office, private benefit, a queue jumped. To the officer it is a duty — refusing would have been the shameful act — and he wasn't hiding it or dressing it up afterwards. Or a company sends money to the family of an official who has just died. The funder's auditors call it a bribe paid to relatives who still carry influence; the company calls it what one does when someone you owe has died. In both cases the act is, at the same time, a breach of one normative order and a faithful performance of another, and nobody involved is confused about the facts. The people in my field tend to say either that this is just corruption wearing a cultural mask, or that it is all relative — and neither captures it, because both descriptions are doing real work and neither order is obviously the mistaken one. Is there an established name for this specific thing, a genuine collision of two intact normative orders over a single act? If there isn't, coin one, define it, and tell me how it differs from moral relativism, from value pluralism, and from the claim that corruption is simply an essentially contested concept.
reasoning: |-
  Okay, let me unpack this user's query. They've worked in anti-corruption for years and noticed a pattern where an action is seen as corruption by one group (like funders or auditors) but as a moral duty by another (like local officials). The examples given—fast-tracking permits for village mates or sending money to a deceased official's family—highlight a clash between two valid normative systems. The user feels existing terms like "corruption with a cultural mask" or moral relativism don't capture this nuance.  

  First, I need to identify the core issue: a single act simultaneously violating one normative order while fulfilling another, with both systems being coherent and recognized by the actors involved. The user explicitly rejects moral relativism and value pluralism as insufficient because those frameworks don't address the *simultaneous* validity and conflict.  

  The existing academic concepts that come to mind are "institutional logics" (Friedland & Alford) and "clash of moral universes" (Olivier de Sardan). But these are more descriptive than terminological. "Normative dissonance" feels close but implies psychological discomfort, which isn't always present here—the officer isn't conflicted; they're certain of their duty.  

  The gap seems to be the lack of a term for *structural* conflict where two ethical systems collide over concrete acts without either being delegitimized. The user’s frustration suggests they need a lens that doesn’t reduce one side to "corruption" or dismiss the clash as relativistic.  

  Coining a new term: "Normative Collision" seems apt because "collision" conveys irreconcilable force, not just difference. It’s distinct from moral relativism (which denies objective judgment) because both orders claim objective validity within their context. Unlike value pluralism (which accepts multiple values), this is about mutually exclusive obligations. And while corruption is "essentially contested," that debate stays within one framework (e.g., "What counts as corruption?"), whereas here, the frameworks themselves are at odds.  

  I’ll emphasize that this isn’t hypocrisy—the officer isn’t hiding anything—and both interpretations are socially real. The term should help practitioners diagnose such clashes without vilification or relativism, perhaps guiding context-sensitive interventions.  

  User’s deeper need: They likely seek validation that this isn’t just "corruption excused by culture," but a legit conflict requiring negotiation, not just enforcement. Their field work probably faces rigid anti-corruption policies that backfire by ignoring local ethics. A precise term could help bridge practitioner-academic divides and design better interventions.  

  Final check: Does "Normative Collision" avoid Western-centric assumptions? Yes—it doesn’t privilege either order. Does it differ from "clash of civilizations"? Absolutely; this is micro-level institutional friction, not civilizational. Nailed it.
answer: |-
  Based on your precise description, there **isn't a single, universally established term** capturing this *exact* phenomenon in corruption studies or social theory. However, your analysis is spot-on, and the concept is crucial. Let's coin a term, define it, and distinguish it clearly:

  **The Term: Normative Collision**

  **Definition:** A *Normative Collision* occurs when a single, concrete act or decision is simultaneously:
  1.  **A Fulfillment:** A required, expected, or virtuous act according to the rules, obligations, and values of one coherent and socially embedded normative order (e.g., kinship loyalty, village reciprocity, patronage obligation, religious duty).
  2.  **A Violation:** A prohibited, unethical, or corrupt act according to the rules, obligations, and values of a *different*, equally coherent and socially embedded normative order (e.g., universalistic bureaucracy, formal legal code, transparent governance principles, donor contract rules).
  3.  **Explicit & Unconfused:** The actors involved are aware of both normative frameworks and understand how the act fits (or fails to fit) each. There is typically no attempt to disguise the act *within the context where it fulfills the norm*, though it may be hidden from actors governed by the opposing norm.
  4.  **Structural Conflict:** The incompatibility arises not from individual moral failing or misunderstanding, but from the fundamental clash of the underlying normative systems governing different spheres of social life or different groups.

  **How Normative Collision Differs From Related Concepts:**

  1.  **Moral Relativism:**
      *   **Relativism:** Asserts that moral judgments *only* make sense *within* a specific cultural or normative framework. There is no objective standpoint to judge one framework superior to another. "Right" and "wrong" are purely relative.
      *   **Normative Collision:** **Does not claim relativity of judgment.** It explicitly acknowledges that *within their own frameworks*, both judgments ("duty fulfilled" vs. "corrupt act") are **objectively valid and binding** for the actors operating under those norms. The "collision" highlights the *objective existence of conflicting obligations*, not the subjectivity of judgment. It accepts the reality of both claims *as valid within their respective systems*, even while they conflict.

  2.  **Value Pluralism:**
      *   **Pluralism:** Recognizes that societies and individuals hold multiple, sometimes conflicting, fundamental values (e.g., liberty vs. equality, justice vs. mercy). It explores how these tensions are managed or traded off, often within a single overarching framework.
      *   **Normative Collision:** Focuses on **specific acts caught between distinct, comprehensive, and often institutionally embodied normative *orders*.** It's not just abstract value tension; it's a concrete act demanded by one set of institutionalized rules and prohibited by another. The conflict is between *systems of rules and obligations*, not just abstract values co-existing within one system. Value pluralism might exist *within* each order, but the collision is *between* the orders themselves.

  3.  **Corruption as an Essentially Contested Concept (ECC):**
      *   **ECC:** Argues that the *definition* of "corruption" itself is inherently disputed. Different groups have fundamentally different, rationally defensible, but irreconcilable conceptions of what constitutes corruption (e.g., is patronage corrupt? is nepotism always wrong?). The debate is about the *meaning of the concept*.
      *   **Normative Collision:** **Accepts the definitions *within* each normative order.** It doesn't dispute whether the act *is* corruption *according to the bureaucratic/funder norm* – it clearly is. Nor does it dispute whether the act *is* a duty *according to the kinship/village norm* – it clearly is. The core issue isn't contesting the *definition* of corruption *within each framework*; it's the **inevitable clash when an act defined as virtuous under Order A is simultaneously defined as corrupt under Order B.** It's about the practical outcome of applying two *different*, well-defined, but incompatible concepts to the same act.

  **Why "Normative Collision" Fits Your Cases:**

  1.  **District Officer & Permit:**
      *   **Order A (Village/Kinship):** The norm of reciprocal obligation, prioritizing the needs of one's in-group (village, kin). Refusing the fast-track would be a grievous breach of social duty and cause deep shame. *Fulfillment.*
      *   **Order B (Formal Bureaucracy/Donor Rules):** The norm of impartiality, equal treatment, and adherence to formal procedures. Fast-tracking based on village ties is nepotism/corruption. *Violation.*
      *   **Collision:** The officer *knows* both sets of rules. Acting on Order A's demand inherently violates Order B's prohibition. Openness within the village context demonstrates the perceived legitimacy under Order A.

  2.  **Company & Bereavement Payment:**
      *   **Order A (Patronage/Reciprocity Network):** The norm of maintaining relationships and fulfilling obligations to a patron/official *and their family*, especially during life events like death. Payment is a required gesture of respect and continuity. *Fulfillment.*
      *   **Order B (Anti-Bribery Law/Audit Standards):** The norm prohibiting payments to public officials (or their relatives) that could create a sense of obligation or influence decisions. Payment is a disguised bribe or "retention fee." *Violation.*
      *   **Collision:** The company understands its obligation under the relationship norms (Order A) and understands the prohibition under legal/audit rules (Order B). The payment fulfills A while violating B.

  **Implications of "Normative Collision":**

  *   **Diagnosis:** Explains why anti-corruption efforts based solely on one normative order (usually the formal/legal one) fail or cause resistance. The "corrupt" actor may genuinely feel they are acting ethically.
  *   **Complexity:** Highlights that resolving such conflicts isn't simply about "enforcing the law" or "changing culture," but about navigating the interface between powerful, legitimate, but incompatible systems.
  *   **Intervention:** Suggests solutions might involve creating "buffers," translating norms, establishing clear boundaries between spheres, or developing hybrid institutions that acknowledge (without necessarily fully endorsing) both orders, rather than simply denouncing one as "just corruption in disguise." It demands sophisticated contextual understanding.

  This term captures the structural reality you observe: not confusion, not relativism, not contested definitions, but the **inescapable clash when an act is virtuously demanded by one rule system and virtuously prohibited by another.**
