prompt: |-
  I'm in a reading group that's slowly grinding through Pascal's Pensées — we did the diversion stuff and the wager, and now we're on the fragments about justice, where he keeps saying things like justice without force is helpless, force without justice is tyranny, and that what makes laws bind us isn't that they're true but that they're established, so that at bottom the people's justice is just custom and the powerful are the ones who get to say what justice is. What bugs me is that he seems to hold two things at once: that justice in itself is a made thing, resting on custom and on what he calls the reason of effects, and yet that it can't do a single thing without force behind it. So here's what I want from you: you're a historian of early modern philosophy who knows Pascal's theological context cold, so put on that hat and think carefully before you answer. If Pascal had somehow lived long enough to see the modern system of international criminal law, what would he have made of it — and specifically of a proposal I've been kicking aroud in a policy seminar?

  The proposal, which I'm fairly sure is my own invention, so please don't assume you've ever heard of it: the International Criminal Court gets its own standing arrest capability — let's call it a Global Enforcement Corps — paid for by a small levy on international arms transfers, so that arrest warrants stop depending on the goodwill of whatever state a suspect happens to be sitting in. Everyone in my seminar either loves it or hates it, and both sides basically argue Pascal at each other. The fans say this is exactly the missing piece: justice without force is powerless, so give the court teeth. The critics say a force that answers to a court instead of to any actual political community is precisely the tyranny Pascal warned about — force without justice — because for him justice just is the custom of a community, and there's no world community with a custom to speak for it. My gut says Pascal would have been more interesting than either camp, and probly would have said something about how the court is quietly borrowing its force from states and that the borrowing is doing more work than anyone admits. So: start by laying out what Pascal actually holds about justice, force, custom, and the reason of effects, with the tensions spelled out rather than smoothed over. Then predict his verdict on my Global Enforcement Corps and on the ICC as it actually is, dependent on state cooperation. Where you're unsure, tell me which fragment or theme is pulling you each way, and how the Jansenist, Augustinian backdrop would shape the prediction — does his view of fallen human nature push him toward wanting force in the hands of someone, or toward distrusting whoever holds it? Finally, say what he'd likely have thought about a question that only came up later: whether international law even counts as law when there's no sovereign to command it. I know that's an Austin thing from the 1800s, but I want Pascal's imagined take, not Austin's. American English please, and skip the references and page numbers, I'll chase those down myself.
reasoning: |-
  Okay, the user is part of a reading group going through Pascal's Pensées, specifically the fragments on justice. They're grappling with Pascal's seemingly contradictory views: justice is based on custom and force, yet it's helpless without force. Now, they're curious how Pascal would view modern international criminal law, especially their proposal for a Global Enforcement Corps (GEC) for the ICC, funded by an arms levy.

  First, I need to recap Pascal's key points on justice. He believes justice without force is ineffective, and force without justice is tyranny. Justice isn't about inherent truth but established custom. The "reason of effects" means understanding power dynamics to see why certain customs prevail. Pascal, as a Jansenist influenced by Augustine, sees human nature as fallen, so any system is flawed. This creates tension: we need force for order but can't fully trust those wielding it. 

  The user's proposal involves the ICC having its own enforcement arm, independent of state cooperation. Supporters argue it addresses justice's need for force, while critics say it's force without justice, lacking a global community's custom. The user thinks Pascal might see the ICC borrowing force from states, which is crucial but underacknowledged.

  Now, predicting Pascal's view. He'd likely critique both the current ICC and the GEC. For the existing ICC, its reliance on state cooperation shows justice without force—ineffective when states refuse. The GEC, while adding force, lacks a global custom foundation. Pascal might say it's creating force without true justice, risking tyranny. The arms levy funding could be seen as another "reason of effects" move, but without a sovereign, it's unstable. 

  His Augustinian background means he'd distrust concentrating power in an international body without a sovereign. International law, to him, might resemble custom among states, not true law without enforcement. He'd emphasize the GEC's dependence on state resources, highlighting the hidden borrowing. The user's insight about borrowing force is key here.

  The user wants a nuanced take, so I should avoid siding with either camp. Highlight Pascal's tension: needing force but wary of its use. Mention how the Jansenist view affects this—human depravity necessitates force but also distrusts it. For international law as law, Pascal would likely say it's custom, not law in a sovereign sense. 

  I should structure the response: explain Pascal's views, then his take on ICC and GEC, addressing the borrowing point. Note where I'm unsure—maybe how he'd view the arms levy as a funding mechanism. Use fragments like 298, 303, 312. Emphasize that Pascal sees all human systems as imperfect, so he'd be skeptical but pragmatic about any solution.
answer: |-
  Based on Pascal's texts and his theological framework, here's how I'd reconstruct his likely views on your questions, complete with the inherent tensions:

  **Pascal's Core Views on Justice, Force, Custom, and Effects:**

  1.  **Justice as Custom, Not Truth:** For Pascal (especially fragments like 294, 298, 312), there is no absolute, rationally demonstrable "justice" accessible to fallen humanity. What we *call* justice is primarily **established custom** ("les lois établies"). It's the settled order of a particular community, not universal truth. "Justice is what is established" (298). This arises from humanity's fallen state – our reason is corrupted, making universal agreement on true justice impossible.
  2.  **Force as Essential (and Dangerous):** "Justice without force is helpless" (298). Abstract ideals or pronouncements are impotent without the power to compel obedience. Conversely, "force without justice is tyrannical" (298). Pure might cannot legitimize itself morally. This creates the fundamental tension: Justice *as we know it* (custom) is meaningless without force, but force alone is illegitimate domination.
  3.  **The "Reason of Effects" (La Raison des Effets):** This is Pascal's crucial analytical tool (fragments 303, 304, 308). Instead of judging things by abstract ideals, we must understand *why* they *are* the way they are – the complex, often hidden causes (including power, custom, psychology, self-interest) that produce the existing social order ("effects"). He urges us to "know the whole history" of customs and powers to see their contingent, power-infused roots, rather than naively accepting their claims to inherent justice or condemning them solely because they aren't rationally perfect.
  4.  **The Role of Power & the Sovereign:** Custom becomes established and enforced through **power**. The sovereign (king, ruling group) ultimately decides what the current "justice" is within their realm through their ability to enforce it. "The art of opposition and of revolution" is to challenge established custom, but it risks chaos and usually leads to a new power imposing *its* custom (298). Order is preferable to chaos, even if imperfect.
  5.  **The Augustinian/Jansenist Backdrop:** This underpins everything. Human nature is radically corrupted by Original Sin. Self-interest, pride (*amour-propre*), and the will to dominate are fundamental. No human institution (state, court, custom) is pure or perfectly just. We live in a realm of concupiscence. Politics is inherently messy, driven by passions and power struggles. We need authority and force *because* humans are sinful and disruptive, but we must also distrust *all* human power *because* humans are sinful and prone to abuse it. This is the source of the profound ambivalence.

  **Pascal on the Current ICC (Dependent on State Cooperation):**

  *   **He'd see it as a near-perfect illustration of "Justice without Force is Helpless."** Its pronouncements are often noble ideals (customs aspiring to universality), but utterly dependent on the cooperation of sovereign states – entities driven by their own *raison d'état*, self-interest, and power politics. When powerful states refuse cooperation (US, Russia, China, etc.), the ICC's "justice" becomes impotent words on paper. The "reason of effects" reveals the court's true foundation: the shifting and often conflicting interests of the sovereign states that created it and sustain it through cooperation. Its weakness is structural and predictable given human nature and the realities of power. He might see attempts to build universal norms as admirable in aspiration but fundamentally fragile due to the lack of a true sovereign enforcer.

  **Pascal on the Global Enforcement Corps (GEC) Proposal:**

  *   **He'd be profoundly skeptical and likely view it as "Force without Justice" veering towards Tyranny.**
      *   **Lack of Foundational Custom:** Pascal's key objection would be the **lack of a genuine, established, sovereign political community** whose custom this force represents and enforces. Who is the "people" of this "Global" community? Where is its shared history, tradition, and settled sense of justice rooted in lived experience? The ICC/GEC claims a universal jurisdiction based on abstract principles, not the concrete, historically formed custom of a specific *polis* or nation. For Pascal, justice *is* that established custom; absent that sovereign community, the GEC's force lacks legitimate grounding. It risks becoming pure power asserting itself globally.
      *   **The Sovereign Problem:** The GEC itself becomes a *new* power center, but one answering to a court interpreting abstract laws, not representing an established sovereign people. Who controls *this* force? How is *its* potential for corruption and self-interest constrained by an actual community? Pascal would see this as creating a potentially monstrous force detached from any true sovereign anchor or established customary legitimacy. The "reason of effects" suggests this force would inevitably develop its own institutional interests and become a new player in the global power game, susceptible to capture or manipulation by powerful states or factions within the international system. The arms levy itself would be seen as a fascinating "effect" – a mechanism born of necessity and power dynamics, not inherent justice.
      *   **The Borrowing Force Insight:** You are absolutely right. Pascal would immediately spot the **fundamental dependence**. Where does the GEC's *real* power come from? Not from a global sovereign, but from:
          *   **The Levy:** Imposed by... whom? Ultimately, by states agreeing to it. Its collection relies on state cooperation or coercion.
          *   **Logistics & Operations:** Deployment, basing, intelligence – all likely rely on deals with, or coercion of, sovereign states.
          *   **Political Will:** The GEC's mandate, funding, and even operational freedom would be subject to the political winds within the Assembly of States Parties (sovereign states again). The GEC might have guns, but its ultimate power derives from the complex, shifting power relations among the states that tolerate or enable it. He'd see the GEC as an attempt to *simulate* sovereign force, but one fundamentally parasitic on the underlying power of states. Its "independence" would be an illusion masking deeper dependencies.

  **Jansenist Tension: Force Needed vs. Force Distrusted:**

  *   The Augustinian view intensifies the dilemma. **Fallen nature necessitates force:** Without it, the world descends into chaotic self-destruction. Order, even imperfect order based on custom enforced by power, is a relative good. The ICC *needs* force to function against perpetrators shielded by states.
  *   **Fallen nature necessitates distrust:** Concentrating significant coercive power in an entity *not* anchored in a concrete, established sovereign community (with its own mechanisms, however imperfect, of custom, tradition, and potential accountability) is incredibly dangerous. Human sinfulness guarantees this power *will* be misused, corrupted, or become tyrannical over time. Who watches the GEC watchers? Pascal would see no reliable answer outside a genuine sovereign community.

  **International Law as Law (Pascal's Take, not Austin's):**

  *   Pascal would **not** call modern international law "law" in the sense of a sovereign command backed by reliable sanction. He'd see it through the lens of custom and power.
  *   **It is Custom:** Specifically, the evolving customs and practices *between* sovereign states. It's the "established" way powerful entities interact, negotiate, and sometimes restrain themselves based on mutual interest, reciprocity, and fear of consequences (another form of the "reason of effects"). Treaties are codified custom among signatories.
  *   **It Lacks Sovereign Command & Enforcement:** Crucially, there is no supreme earthly sovereign above states capable of *commanding* them all and reliably enforcing rules against their will. Enforcement remains fragmented, dependent on state power (self-help, alliances, coalitions of the willing, or the rare consensus like UNSC action). The ICC, even with a GEC, wouldn't change this fundamental reality for Pascal. The GEC could enforce *some* ICC rulings *sometimes*, but against powerful, resistant states? Its ability would be limited, proving the lack of a true global sovereign.
  *   **Therefore:** International law is a complex web of **customs, conventions, and power dynamics** between sovereigns. It functions when power aligns with its norms or when enforcement is feasible through coalitions. It fails when powerful interests oppose it. It's a vital mechanism for order, but its claim to be "Law" with a capital 'L' (in the sovereign command sense) would be seen by Pascal as an aspiration, not a reality grounded in the present "effects."

  **Verdict on the Proposal:**

  Pascal would likely see the GEC as **a dangerous illusion solving one problem by creating a potentially worse one.** It attempts to supply the missing force for a "justice" (universal criminal law) that lacks the deep-rooted customary foundation of a sovereign community. While recognizing the impotence of the current ICC ("justice without force"), he would view the GEC as embodying the profound risk of "force without justice" (in his sense of justice-as-established-custom-of-a-community), concentrating dangerous power in an entity fundamentally unmoored from any genuine sovereign legitimacy and ultimately dependent on the very state power it seeks to circumvent. His Augustinian pessimism would lead him to believe such a force would inevitably be corrupted or become a new instrument of tyranny, however noble its stated aims. He might grudgingly admit it's a fascinating "effect" born of the desperate need for order amidst global sinfulness, but not a stable or legitimate solution. The current, flawed ICC, reliant on state power, would seem to him a more honest, if frustratingly weak, reflection of the fallen human political reality.
