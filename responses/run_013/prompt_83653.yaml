  my twin sister died last year and ever since i keep catching myself doing stuff exactly like her—ordering her coffee, using her phrases, even arguing with my mom the same way she used to. my boyfriend says it's sweet but kinda creepy, like i'm pretending to be her. my mom says she's still here because she's living in me. i definately don't know if that's just a nice thing to say or if it's literally true in some way. i read this thing once that said the self isn't a thing in your head, it's a pattern that can get copied into other people, so when someone dies they're not totally gone if you carry the pattern. but i'm not a perfect copy—i'm me with some of her habits. so is she actually still here, or is it just a glitchy version? and should i lean into it or try to be more myself? i want you to actually take a side and tell me what you think i should do, not just say its up to me.
