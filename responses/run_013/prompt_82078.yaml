prompt: |-
  You are a philosopher of logic and epistemology specializing in bounded rationality. I have just spent a long evening arguing with a friend who insists that the problem of logical omniscience is a fatal defect in epistemic logic: any model that treats agents as believing all the logical consequences of their beliefs is simply not a model of belief. I want you to make the opposite case. Argue for this position: the problem is not that epistemic logic makes agents too logically competent, but that it treats logical consequence as a single, context-independent relation. Once we index closure to a reasoning frame—the set of inference rules an agent is disposed to apply under a given cognitive load and task—the alleged omniscience becomes a tractable parameter, and the residual failures are failures of attention rather than of logical ability. Before writing, brainstorm the strongest objections and think carefully about whether the view is more than a relabeling. Then present your argument as exactly five numbered points, each one or two sentences, with no introduction or conclusion. Each point must advance the case; include at least one concrete example involving a disjunction or conditional that an ordinary reasoner would not infer, and reply to the objection that your proposal merely renames the problem. Do not cite any literature.
reasoning: |-
  Okay, the user wants me to act as a philosopher of logic and epistemology specializing in bounded rationality. They've been arguing with a friend who thinks the problem of logical omniscience makes epistemic logic fundamentally flawed. I need to defend the opposite view: that the issue isn't agents being too competent, but rather that logical consequence is treated as context-independent. The solution is to index closure to a "reasoning frame" - the set of inference rules an agent can apply under specific cognitive loads and tasks. This turns omniscience into a parameter, with failures being due to attention rather than ability.

  First, I need to brainstorm strong objections to this position. The most obvious one is that this just relabels the problem - instead of "logical omniscience" we now have "reasoning frame limitations," but it's essentially the same issue. Another objection might be that this doesn't actually solve how agents can fail to believe obvious logical consequences. There's also the question of how to define these reasoning frames precisely without circularity. And doesn't this make the model too vague or subjective? 

  I should think about concrete examples involving disjunctions or conditionals. For instance, an ordinary reasoner might believe "If it rains, the street is wet" and "It is raining," but fail to infer "The street is wet" because they're distracted. But that seems like an attention failure. A better example might be a more complex logical structure they wouldn't notice without effort.

  The key is to show that relabeling isn't trivial - it reframes the problem from an unrealistic idealization to a measurable parameter. For the example, I can use a disjunction: someone believes "P or Q" and "not-P," but doesn't infer Q because they're under cognitive load. The failure is attentional - they didn't apply the rule, not that they couldn't.

  Now, structuring the five numbered points. Each should advance the case, be concise (one or two sentences), include an example, and address the relabeling objection. 

  Point 1 can define the problem as misdiagnosed - omniscience stems from ignoring reasoning constraints. Point 2 introduces reasoning frames as the solution, parameterizing competence. For the relabeling objection, Point 3 can argue that this shifts focus to attention, using an example like the disjunction to show it's not merely renaming. Point 4 could explain how failures occur due to cognitive load affecting which rules are accessed. Point 5 might emphasize that this makes epistemic logic empirically tractable by modeling real-world reasoners.

  The example needs to be concrete: say, an agent believes "The meeting is on Monday or Tuesday" and "It's not Monday," but under time pressure, doesn't infer "It's on Tuesday." This illustrates an attentional lapse in applying disjunctive syllogism.

  By tying this to cognitive load and task, I show it's not just renaming - it's a framework for empirical study. The response to relabeling is that it transforms an impossibility into a variable factor, opening doors for research on human reasoning.
answer: |-
  Here are five numbered points advancing the case:

  1.  The objection misdiagnoses the flaw: logical omniscience arises not from attributing *competence* per se, but from treating logical consequence monolithically, ignoring that agents access different inferential resources under varying cognitive constraints. This conflates capacity with context-dependent performance.
  2.  Indexing closure to a *reasoning frame*—defined by available inference rules, cognitive load, and task demands—parameterizes competence: an agent believes consequences derivable *via rules in their active frame*, not all abstractly possible ones. For example, under high load, an agent believing "P" and "If P, then Q" may still not believe "Q" if modus ponens isn't reliably accessed in that frame.
  3.  Contrary to relabeling objections, this distinguishes *in-principle ability* (having a rule dispositionally) from *attentional failure*: residual non-closure reflects not lacking the rule, but the rule not being triggered or maintained under specific pressures, like failing to infer "R" from "P ∨ Q" and "¬P" while multitasking, despite knowing disjunctive syllogism.
  4.  Failures manifest when cognitive load exceeds frame capacity: an agent who easily infers "S" from "¬R ∨ S" and "R" in a low-stakes context may not infer it during stress, demonstrating that the *same* logical ability fails due to attentional resource depletion, not absence.
  5.  This makes epistemic logic empirically tractable: reasoning frames model real-world agents by grounding closure in psychologically plausible, measurable constraints (e.g., working memory limits), transforming the "defect" into a variable feature explaining *when* and *why* logical consequences are missed.
