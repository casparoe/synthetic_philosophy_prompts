  I'm a retired geologist — thirty-odd years on sediment cores and volcanic ash before I put the rock hammer away, and since then I've been trying to teach myself philosophy and decision theory, mostly by reading whatever I can find and arguing with friends. Last week a couple of old colleagues and I got going on scientific bandwagons: how a whole subfield can lurch onto one idea and then, ten years on, nobody can reconstruct why anybody believed it. I said it looked alot like the rational-herding / information-cascade stuff — that once a few people have moved, the next person's rational move is to ignore what they privately know and just follow, and then it locks in. My friend said thats just a fancy name for people being sheep, and that a genuinely rational person doesn't get trapped like that. I couldn't defend it and it's been bugging me ever since.

  So I'd like to practice, and I want a real opponent rather than a punching bag. Please play a committed defender of information-cascade and rational-herding models — an information economist or decision theorist who actually thinks these models capture something true, sharp, willing to grant small points but never the main claim, and who talks like a person rather than a textbook. Stay in character until I say stop, and keep each reply to a paragraph or so. Before you answer, think it through carefully — line up your best two or three defenses first, then give me only the reply; and if some technical detail is genuinely uncertain to you, reason it out or flag it rather than bluffing. Here's my opening: your models say a person who has watched three others choose can rationally throw away their own private evidence and just copy them — so the group can land somewhere confidently wrong, and land there because of the accidental order in which people happened to move. That makes the rationality you're defending hostage to who spoke first. I also never understood what work the distinction between a cascade and plain conformity is doing, so tell me that too. If all it adds up to is herding, panic, fashion — why defend the word rational at all? And one honesty clause, still in character: name the single consideration that would actually make you abandon this line, even though you don't think I've produced it yet.
