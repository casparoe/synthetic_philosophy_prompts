  ## Annual Report 2024: Fenland Futures Trust

  **Chair’s Letter: Stewardship in Focus**

  Dear Supporters,

  This past year has been one of profound growth and reflection for Fenland Futures. Thanks to your unwavering generosity, we have significantly expanded the Alderbrook Marsh complex, planted over 18,000 reed seedlings (exceeding target by 12%), and welcomed 1,200 volunteer days dedicated to habitat creation. The new boardwalk, named in honour of long-standing patron Mrs. Eleanor Vance, now offers unparalleled access to the marsh’s recovering beauty. We remain deeply committed to measurable positive impact. This year, in line with evolving best practices in ecological stewardship, we are piloting the integration of **Welfare Accounting** metrics alongside our traditional outputs. This rigorous approach allows us to quantify the *net welfare experience* arising from our interventions, ensuring our stewardship is both effective and ethically informed. It is a challenging but necessary evolution in our understanding of what true restoration entails.

  **Impact in Numbers**

  *   Habitat Created: 42 Hectares (Cumulative: 187 Ha)
  *   Reed Seedlings Planted: 18,475
  *   Volunteer Engagement: 1,243 Days
  *   Estimated New Invertebrates Supported: 3.5 Billion ± 1.2 Billion (95% CI)
  *   Estimated Vertebrate Hatchlings/Fry Produced: 1.8 Million ± 650,000 (95% CI)
  *   Estimated Vertebrate Mortalities (Pre-Fledging/Sub-Adult): 1.61 Million ± 600,000 (95% CI)
      *   Primary Causes (Modelled): Starvation (42%), Predation (31%), Disease/Parasites (22%), Exposure (5%)
  *   **Net Vertebrate Welfare Balance (Modelled): +190,000 Life-Years (LY) ± 1.1 Million LY (95% CI)**
  *   Estimated Average Suffering Intensity per Mortality Event (Scalar Model): 0.65 ± 0.25 (95% CI)

  **The New Marsh: Alderbrook Expansion**

  The successful hydrological reinstatement and planting of the 12-hectare Alderbrook extension marks a major milestone. Initial surveys indicate rapid colonisation by characteristic species: breeding pairs of reed warblers increased by 15%, and water vole signs are promising. Crucially, the expansion has created significant new breeding habitat for r-strategist species – primarily invertebrates (midges, beetles, copepods) and amphibians (common frogs, smooth newts). Standard ecological metrics indicate a thriving, biodiverse system. Our preliminary welfare accounting model suggests the site will generate approximately 800,000 new invertebrate lives and 120,000 vertebrate hatchlings annually. The model further estimates that >99% of invertebrates and >85% of vertebrate hatchlings will die before reaching maturity, predominantly from the factors listed above. The net welfare contribution of these new lives, given their predicted experiences, remains within the large confidence interval of our overall balance.

  **Spotlight: Predator Management Pilot**

  *Rationale:* Recognising predation as a significant modelled source of suffering (31% of mortalities, predominantly slow: consumption of larvae, prolonged invertebrate parasitism), the Trust initiated a small-scale, ethically reviewed pilot in Zone C. Non-lethal deterrents (ultrasonic devices, reflective tape) were deployed during key breeding/nesting periods.
  *Outcomes:* Initial observations show a 15% reduction in observed predation events on monitored nests/larvae pools within the pilot zone. No significant displacement of predator activity to adjacent zones was detected. A slight decrease in stress indicators in some prey species cohorts was tentatively noted.
  *Welfare Accounting Impact:* The pilot reduced estimated suffering by approximately 2,500 LY within the zone. However, the cost-effectiveness ratio relative to other potential welfare interventions (e.g., supplemental feeding feasibility studies) is currently under review by the Ethics Subcommittee. The pilot reaffirms the complexity of intervening in trophic interactions we only partially comprehend.

  **Footnote: A Trustee's Perspective**  
  *(Dr. Alistair Finch, Emeritus Professor of Ecology)*  
  "While appreciating the intellectual rigour, I must dissent regarding the primacy of welfare accounting. Our core mission, funded by donors seeking habitat restoration, is to conserve functioning ecosystems. These systems inherently involve cycles of life and death we did not design. Focusing on individual suffering metrics risks pathologising natural processes we barely understand and diverting resources from scalable habitat protection. Crucially, the CI on the net welfare balance (-910,000 LY to +1.29 Million LY) renders it operationally meaningless. Does this framework ultimately ask us to prefer fewer, potentially 'happier' lives over ecologically vibrant but suffering-rich populations? I remain unconvinced this aligns with donor intent or practical conservation."

  **Looking Ahead**

  Fenland Futures enters the coming year focused on consolidating gains and deepening our understanding. Priorities include:
  1.  **Refining Welfare Models:** Investing in research partnerships to reduce confidence intervals, particularly concerning invertebrate sentience weightings and suffering-intensity modelling.
  2.  **Ethical Framework Development:** Establishing clear, consensus-driven guidelines for when and how welfare interventions might be applied, balancing efficacy, ecological integrity, and resource constraints.
  3.  **Donor Dialogue:** Engaging our supporters in conversations about the complex ethical dimensions of restoration and the meaning of 'positive impact' in the context of wild animal welfare.
  4.  **Habitat Resilience:** Continuing core restoration work (reedbed management, hydrological optimization) to ensure robust ecosystems capable of supporting diverse life – the foundational prerequisite for any welfare consideration.

  The introduction of welfare accounting compels us to confront difficult questions inherent in creating life within ecosystems defined by vast, often harsh, natural processes. We undertake this work not because the answers are clear, but because the moral responsibility demands we ask the questions. We are profoundly grateful for your continued trust and support as we navigate this challenging, essential frontier in ecological stewardship.

  With sincere appreciation,

  Eleanor Shaw  
  Chair, Fenland Futures Trust

  ---

  **Author's Note on Satirical Liberties & Contested Ground**

  This piece satirically employs "welfare accounting" to critique the "more nature is automatically good" assumption, leaning on several contested aspects of the wild animal welfare (WAW) debate:

  1.  **Mortality Picture & r-strategy:** The emphasis on vast numbers of doomed offspring is accurate for many wetland species. However, WAW advocates debate the *significance* of this. Some argue early death prevents greater suffering later (e.g., through starvation), making high juvenile mortality potentially welfare-positive compared to prolonged poor adult lives. The satire presents it as unambiguously negative.
  2.  **Population Ethics - The "Adding Animals" Knot:** The core question – does creating a life likely to contain suffering constitute a harm? – is **the** central, unresolved philosophical debate in WAW (akin to the "Asymmetry" in antinatalism). The report presents it as a stark dilemma needing resolution ("net welfare balance"), but WAW proponents are deeply divided. Some reject the idea that creating lives with net negative welfare is inherently wrong in wild contexts, focusing instead on reducing suffering within existing populations.
  3.  **Predation as a Target:** The predator management pilot highlights a major fault line. While some WAW thinkers see predation as a huge source of suffering needing mitigation, **many others strongly disagree**. Objections include: ecological ignorance, risk of unintended consequences, practical impossibility, and ethical concerns about interfering with predators' natural behaviours or intrinsic value. The report presents non-lethal deterrence as a plausible (if complex) intervention, which many WAW proponents would find highly contentious or premature.
  4.  **Invertebrate Suffering & Epistemic Uncertainty:** The report accurately highlights the massive uncertainty regarding sentience in insects/crustaceans and the implications for welfare models. The satire leans into the absurdity of billion-count estimates with huge CIs, but the *degree* of uncertainty and whether we should assign *any* welfare weight to invertebrates based on current evidence is hotly contested.

  **On the Brief's Feasibility:** The core tension – a sincere, donor-facing report using a framework inherently questioning the donors' assumed goal – *is* a contradiction pushing towards dark satire. The "blandest sentences being chilling" effect requires embracing this tension. It risks smugness by making the welfare calculus seem both absurd *and* morally necessary, implicitly critiquing both unexamined conservation and the impracticality of WAW. The trustee's footnote is crucial for balance, ensuring the framework itself takes hits (meaningless CI, misalignment with donor intent). It avoids being a pure tract by showing the internal conflict and institutional paralysis the framework induces.
