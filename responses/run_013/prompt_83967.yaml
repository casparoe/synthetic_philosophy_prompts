          At level k, a team can choose to set a tripwire. This does not escalate the conflict immediately. Instead, it sets a die roll that will happen at the next level:

            - If the game escalates to level k+1, then before the level k+1 round, the die is rolled. If the die roll is below a threshold T (say, 1-3 on a d6), then the team that set the tripwire is forced to escalate at level k+1. Otherwise, they are free to choose.

          This introduces uncertainty. The opponent doesn't know for sure if you will be forced to escalate at the next level.

          But then the credibility is probabilistic.

          How it works:

            - At level k, both choose actions. If at least one sets a tripwire, then if the game goes to level k+1, the tripwire will be active.

            - At level k+1, before the teams choose, the die is rolled for each tripwire set at level k. For each tripwire set, if the die roll is <=3 (for example), then that team is committed to escalate at level k+1.

          This means that if both set a tripwire at level k, then at level k+1, there are two die rolls. Each team might be committed or not.

          The advantage of setting a tripwire: it makes your threat to escalate at the next level credible with some probability. The opponent knows that if they don't back down at level k, they face a chance that at level k+1 you will be forced to escalate, which increases the risk of catastrophe.

          We want the setting of the tripwire to improve the setter's position because it might induce the opponent to back down at level k.

          Also, it makes the situation more dangerous because it introduces a chance of automatic escalation.

      Let's design with dice:

          We'll use a six-sided die (d6). When a team sets a tripwire at level k, they also choose a threshold (or we fix it). To keep it simple, we fix the threshold at 3 (so 50% chance).

          In the next level (k+1), before the teams choose their actions, we roll the die for each tripwire set at the previous level. If the die roll is <=3, then that team is committed to escalate at level k+1.

          If a team is committed, they have no choice: they must escalate. If they are not committed by the die, they can choose freely.

          Also, note: a team can set only one tripwire per game? Or per level? We'll say a team can set only one tripwire in the entire game.

      The game flow:

          Round 1 (level 1):
            - Teams choose: Back Down, Escalate, or Set Tripwire.
            - If at least one backs down: game over, backer loses L(1), other wins P.
            - If both back down: both lose L(1).
            - Otherwise: level escalates to 2.

            - Additionally, if any team set a tripwire at level 1, then for level 2 there will be a die roll for each such tripwire.

          Round 2 (level 2):
            - If there are tripwires set at level 1, roll dice. For each tripwire that activates (<=3), that team is committed to escalate at level 2.
            - Then, teams that are not committed choose their actions (Back Down, Escalate, Set Tripwire). Committed teams must escalate.
            - Resolve the round as above.

          ... until level 5.

          At level 5:
            - No tripwire setting allowed (because there's no level 6). So actions are only Back Down or Escalate, but some might be committed by tripwires set at level 4.

          Catastrophe occurs if at level 5, both teams are either committed to escalate or choose to escalate.

      We need to ensure that level 5 is EV-negative. How? By having the catastrophe cost very high. But also, the backing down cost at level 5 is high. However, with the tripwire, the chance of catastrophe increases.

      Private information: Each team knows its own PT and CC. They do not know the opponent's.

      Materials:
          - Whiteboard to track level.
          - Dice (d6) for tripwire activations.
          - Cards for private information (PT and CC) for each team.

      How to assign PT and CC? We'll have a set of cards:

          Team Red: choose one of:
            PT: 2, 3, or 4
            CC: -10, -15, -20

          Team Blue: same.

          But we want a correlation? Or not? We can let the instructor assign or let them draw randomly.

          We'll prepare cards:

            Red options:
              Card 1: PT=2, CC=-10
              Card 2: PT=3, CC=-15
              Card 3: PT=4, CC=-20

            Blue options:
              Card 1: PT=2, CC=-20
              Card 2: PT=3, CC=-15
              Card 3: PT=4, CC=-10

          This way, there is variety.

      Prize P: let's set P=10.

      Now, let's do an example expected value calculation for level 5 to show it's EV-negative if both are free to choose and both know each other's PT and CC? But they don't. But we can show in the debrief.

      However, note: without delegation, at level 5 it's a chicken game. With delegation, the chance of catastrophe increases.

      We want the students to discover that they'd rather not be in control. How? By setting a tripwire, they might force the opponent to back down. And if both set tripwires, the chance of catastrophe increases, but each did it to look resolved.

      Timeline for 90 minutes:

          0-10 min: Introduction and setup. Divide into two teams (9 each, but they will play as a team). Assign private information (PT and CC) to each team. Explain the rules.

          10-30 min: First playthrough (20 minutes)

          30-40 min: Quick debrief of the first round: what happened? Did anyone set a tripwire? When? What was the outcome?

          40-60 min: Second playthrough with a twist. The twist: now each team knows that the other team might have learned something. But we can also change the private information or add a new rule? The instructor's choice. Alternatively, the twist could be that now they can set tripwires with different thresholds? But let's keep it simple. We might just replay with new private information.

          60-85 min: Debrief. Map the concepts.

          85-90 min: Wrap-up and name the concept.

      Rules for the TA:

          Materials:
            - Whiteboard or flip chart to track the level.
            - Markers.
            - Two six-sided dice.
            - Private information cards (prepared in advance) for Red and Blue.

          Setup:
            - Divide the class into two teams: Red and Blue.
            - Assign one or two students in each team to be the decision-makers (to avoid too many voices). Or let them discuss and then the spokesperson reveals the action.
            - Give each team their private information card (PT and CC). They should not reveal it to the other team.

          Rules:

            The game has 5 levels. The prize for winning is 10 points. The game starts at level 1.

            In each round (at level k, where k=1,2,3,4), both teams simultaneously choose one of three actions:

              A) Back Down: You are backing down. This ends the game. You lose points equal to L(k) [see below]. The other team wins and gains 10 points.

              B) Escalate: You want to escalate to the next level. If both teams choose Escalate (or one escalates and the other sets a tripwire), the game goes to level k+1. If one team chooses Back Down and the other Escalate, then the team that backed down loses L(k) and the other wins 10.

              C) Set Tripwire: You set a tripwire for this level. This action also escalates the level (so if the game continues, it will go to level k+1). Additionally, if the game goes to level k+1, then at the beginning of level k+1, a die will be rolled to determine if you are committed to escalate at level k+1. 

            If both teams choose Back Down, both lose L(k) and there is no winner.

            If one team chooses Back Down and the other chooses Escalate or Set Tripwire, then the team that did not back down wins.

            If at least one team chooses Set Tripwire, then the game escalates to the next level, and we note which teams set a tripwire.

            When moving to level k+1, if any team set a tripwire at level k, then before the level k+1 round, we roll a die for each such team:

               - Roll a d6: if the result is 1, 2, or 3 (<=3), then that team is COMMITTED to escalate at level k+1 (they have no choice; they must choose Escalate).
               - If the result is 4,5,6, then that team is not committed and can choose freely at level k+1.

            At level k+1, teams that are committed do not choose; they are forced to escalate. Teams that are not committed choose from the actions (Back Down, Escalate, Set Tripwire) but note: at level 4, they cannot set a tripwire because there is no level 5 tripwire (since level 5 is the maximum). So at level 4, the available actions are only Back Down and Escalate.

            At level 5:

               - Teams that are committed (by a tripwire set at level 4) must escalate.
               - Teams that are not committed can choose Back Down or Escalate.
               - If both teams escalate (either by commitment or choice), then catastrophe occurs: both teams get their catastrophe cost (CC).
               - If one team escalates (or is committed) and the other backs down, then the backer loses L(5) and the escalator wins 10.

            Definition of L(k): 
               - If k <= your PT, then L(k) = k.
               - If k > your PT, then L(k) = 2*k - PT.

            Example: 
               PT=3, then:
                   k=1: L(1)=1
                   k=2: L(2)=2
                   k=3: L(3)=3
                   k=4: L(4)=2*4-3=5
                   k=5: L(5)=2*5-3=7

            PT=2:
                   k=1:1, k=2:2, k=3: 2*3-2=4, k=4:6, k=5:8

            PT=4:
                   k=1:1, k=2:2, k=3:3, k=4:4, k=5: 2*5-4=6

            Catastrophe cost (CC) is given on the card (a negative number, e.g., -15).

          Scoring examples:

            - If you win, you get +10.
            - If you back down at level k, you lose L(k) (so your score is -L(k)).
            - If catastrophe happens, you get your CC.

          Note: The score for the winner is +10, and they do not incur any backing down cost? Yes, because they didn't back down.

          First round example at level 1:

            Red: PT=3, CC=-15
            Blue: PT=2, CC=-20

            Both choose actions at level 1. Suppose both choose Escalate: then level goes to 2.

            At level 2, no tripwires set, so no die roll. Both choose: say both escalate again -> level 3.

            At level 3: 
               Red: L(3)=3 (because 3<=3)
               Blue: L(3)=4 (because 3>2 -> 2*3-2=4)

            Suppose at level 3, Red sets a tripwire, Blue escalates.
              - Since at least one escalated (or set tripwire) and none backed down, level goes to 4.
              - Red has set a tripwire at level 3.

            Now, at level 4:
              - Before the round, roll die for Red's tripwire: say roll=2 -> committed. So Red must escalate at level 4.
              - Blue is not committed, so Blue can choose: Back Down or Escalate (cannot set tripwire because it's level 4).

            Blue's options at level 4:
              - Back Down: lose L(4)=6 (because for Blue PT=2, L(4)=2*4-2=6) -> score -6.
              - Escalate: then since Red is escalating, the level will go to 5.

            If Blue escalates, then level 5:

              At level 5:
                - Red: committed? They didn't set a tripwire at level 4, so not committed by that. But they are not forced. But wait: they were forced at level 4 to escalate, but that doesn't force them at level 5. So at level 5, Red is free? 

            Correction: The tripwire set at level 3 forces the setter at level 4. It doesn't force at level 5. So at level 5, both are free (unless they set a tripwire at level 4, which they couldn't because at level 4 you can't set a tripwire).

            So at level 5, both choose:

              Red: PT=3 -> L(5)=7. If they back down, lose 7. If they escalate and Blue escalates, catastrophe (CC=-15). If they escalate and Blue backs down, they win 10.
              Blue: PT=2 -> L(5)=8. Similarly.

            Now, if both are free, it's a chicken game at level 5.

            But in our example, Blue at level 4 might choose to back down to avoid level 5.

          Alternatively, we can change the rules for level 4: since you can't set a tripwire, the actions are only Back Down and Escalate. And if you escalate at level 4, you are not making any commitment for level 5.

          This is complex, but it will generate the dynamics we want.

      Debriefing points:

          - Where did the credibility gap show up? (When a threat to escalate was not believed because the team wouldn't carry it out on their own.)
          - Where did a team choose to lose control on purpose? (Setting a tripwire.) How did that change the other team's behavior?
          - How did the shared risk get manufactured? (When both set tripwires, the chance of automatic escalation increased, making catastrophe more likely even if both would prefer to avoid it.)
          - Why couldn't either side unilaterally turn the dial back down? (Because backing down means losing, and once tripwires are set, they are out of your control.)

          This cluster of ideas is often called "brinksmanship" (deliberately letting events escalate to the brink of disaster to force the opponent to back down) and is related to the "commitment problem" in game theory.

      What might go wrong the first time:

          - They might escalate to level 5 quickly without setting tripwires and then at level 5 they both escalate -> catastrophe. This ends the game fast. But they will see that catastrophe is bad.

          - They might not use tripwires. Then the game is just a series of chicken games.

          To encourage using tripwires, you might in the introduction hint: "Sometimes you can make your threat more credible by taking a step that removes your control."

          Alternatively, in the second playthrough, they might use it more.

      What the game can't do:

          - The catastrophe is represented as a big negative score, but in reality, there might be no afterward. We haven't modeled that. The score is just a teaching abstraction.

          - The private information (PT and CC) is static and known to the team, but in reality, resolve might change.

          - The game might not perfectly capture the idea that the standoff at the top makes small fights safer. How can we add that?

            We could add a second phase: after one full game, we play again but now there is a tripwire already set by an external actor (the instructor) at a high level. Then the teams might be more willing to engage in small escalations because they know that the high-level tripwire will deter the opponent from going too far? 

            For example, before the game starts, we set a tripwire at level 4: if the game reaches level 4, then there is a 50% chance that both teams will be forced to escalate at level 4 (leading to level 5, and then level 5 might be played). This represents an existing MAD doctrine. Then the teams might be more aggressive at lower levels because they know that the high-level deterrent will kick in and make catastrophe likely if they go too far, so the opponent will be deterred from escalating beyond level 3 or 4.

            We can try this as the second playthrough.

            Second playthrough twist: 

              "Now, due to an existing mutual defense treaty, a tripwire is already set at level 3. If the game reaches level 4, then before level 4, we will roll a die: if <=3, then both teams will be forced to escalate at level 4. If the die roll is 4-6, no effect."

            This tripwire is not set by either team, but it exists. How does this affect their behavior at levels 1 and 2?

            We want them to see that the existence of this high-level danger might make them more willing to escalate at lower levels because they believe the opponent will be deterred from escalating to level 3 (knowing that level 4 might be automatically escalated).

          - The game might teach that being crazy (having a low PT or a high CC in absolute value) is good because it makes you more resolved. But we don't want to teach that the best move is to be the craziest. Instead, we want to teach that the best move is to use commitment devices to make your threats credible. In the game, a team with high PT (so can tolerate backing down at high levels) might still win by using a tripwire effectively.

      Let's hope the game works as intended.

      Rules write-up for the TA:

          Brinksmanship Game Rules

          Objective: Your team wins if the other team backs down. The winning team gets 10 points. If both back down, both lose.

          Levels: The game has 5 levels (1 to 5). The game starts at level 1.

          Private Information: Each team has two private numbers:
            - Pain Tolerance (PT): This is the highest level at which you can back down without extra penalty.
            - Catastrophe Cost (CC): The points you get if catastrophe occurs (a negative number).

          Backing Down Cost (L(k)): 
            - If you back down at level k:
                  If k <= PT, you lose k points.
                  If k > PT, you lose (2*k - PT) points.
            - Example: PT=3, then backing down at level 3: 3 points; at level 4: 2*4-3=5 points.

          Catastrophe: Occurs only at level 5 if both teams escalate (by choice or commitment). Both teams get their CC.

          Actions available at levels 1,2,3,4:
            - Back Down: You back down. This ends the game immediately.
            - Escalate: You wish to escalate to the next level.
            - Set Tripwire: You set a tripwire. This also escalates the level (so if the game continues, it goes to the next level). Additionally, if the game goes to the next level, a die will be rolled to determine if you are committed to escalate at the next level.

          Actions available at level 5:
            - Back Down or Escalate (no tripwire).

          How tripwires work:
            - If you set a tripwire at level k, then if the game goes to level k+1, before the level k+1 round, roll a die:
                 - If the die roll is 1,2, or 3, you are committed to escalate at level k+1.
                 - If 4,5,6, you are not committed and can choose your action freely at level k+1.
            - Note: You can set only one tripwire per game.

          What if both teams set a tripwire at the same level? Then both dice are rolled independently.

          How the level advances:
            - If at least one team chooses Escalate or Set Tripwire and neither backs down, the level escalates to the next level.
            - If both teams choose Back Down, the game ends and both teams incur the backing down cost for the current level.
            - If one team chooses Back Down and the other does not, the team that backed down loses according to L(k) for the current level, and the other team wins (gets 10 points).

          Committed teams:
            - At a level, if a team is committed (because their tripwire die roll activated), they must choose Escalate. They cannot back down or set a tripwire.

          Level 5:
            - If both teams escalate (either because they are committed or by choice), catastrophe occurs: both get CC.
            - If one team escalates (or is committed) and the other backs down, the team that backs down loses L(5), and the other wins.

          Procedure for a round at level k (1-4):

            1. Both teams secretly discuss and choose their action (Back Down, Escalate, Set Tripwire).
            2. Reveal actions simultaneously.
            3. If at least one team chose Back Down:
                 - If both backed down: both lose L(k).
                 - If only one backed down: that team loses L(k) and the other team wins.
                 - The game ends.
            4. If no one backed down:
                 - The level escalates to k+1.
                 - Record which teams set a tripwire at level k.
            5. If any team set a tripwire at level k, then before the level k+1 round, roll a die for each such team:
                 - For each tripwire set, roll one die: 
                      - If 1-3: that team is committed to escalate at level k+1.
                      - If 4-6: that team is not committed.
            6. At level k+1, teams that are committed must escalate. Teams that are not committed choose their action (but at level 4, they cannot set a tripwire).

          Level 5 round:

            1. Teams that are committed (by a tripwire set at level 4) must escalate.
            2. Teams that are not committed choose Back Down or Escalate.
            3. Resolve as described.

          Second playthrough twist:

            In the second game, there is an existing tripwire at level 3 set by a treaty. This means:
               - If the game reaches level 4, then before the level 4 round, the instructor will roll one die for the treaty tripwire:
                     - If 1-3: both teams are committed to escalate at level 4.
                     - If 4-6: no effect.
               - This tripwire is in addition to any that the teams set.

          Debriefing Guide:

            After each game, discuss:

            1. At what level did the game end? Why?
            2. Did any team set a tripwire? When? What happened because of it?
            3. How did the existence of the tripwire change the other team's behavior?
            4. Did the tripwire make the situation more dangerous? How?
            5. In the second game, how did the pre-set tripwire at level 3 affect the early levels?
            6. Draw the connection: the high-level danger (the treaty tripwire) made it safer to be aggressive at lower levels because it deterred escalation to the high levels.

            Key concepts to name at the end:

              - Credibility gap: A threat that you wouldn't carry out is not believed.
              - Commitment device: Setting a tripwire makes the threat credible by taking away your control.
              - Brinksmanship: Pushing a situation to the brink of disaster to force the opponent to back down.
              - Mutually Assured Destruction (MAD): When both sides have tripwires set that make catastrophe likely, it may deter them from escalating to that level.

            Also, note: the game does not teach that being the craziest (lowest PT or most negative CC) is best. In fact, a team with high PT can use a tripwire to make a credible threat. The key is the commitment device.

          What if they race to the top and get blown up quickly?

            - In the first game, if they escalate without setting tripwires and then at level 5 both escalate, they get catastrophe. This is a learning moment: ask them why they escalated? Did they believe the other would back down? How could they have made their threat credible without going to catastrophe?

            - Then in the second game, they might use tripwires earlier.

      Let's hope it works.

      Note: The arithmetic for the expected value at level 5 is complex because of incomplete information. But we can illustrate with an example:

          Suppose at level 5, both teams are free and both have PT=3 (so L(5)=7) and CC=-15.

          If both escalate: catastrophe, -15.
          If you escalate and the other backs down: you get 10.
          If you back down: you get -7.

          If you think the other will escalate with probability p, then your expected value of escalating is: p*(-15) + (1-p)*10 = 10 - 25p.
          The expected value of backing down is -7.

          You would escalate if 10 - 25p > -7  => 17 > 25p => p < 17/25 = 0.68.

          So if you think the probability the opponent escalates is less than 68%, you should escalate.

          But if both think that, they might both escalate even though p=1 is not in their interest.

          With private information, they don't know p.

          But with a tripwire, you can increase the perceived probability that you will escalate, which might make the opponent back down.

      This completes the design.
