  ### Brinksmanship: Escalation and Credibility Game  
  **Concept Spotlight**: Credible threats require delegation of control (dice rolls, automated systems). Mutual delegation creates shared risk that neither side can unilaterally reduce, even when both prefer less danger. Standard name: **Brinksmanship** (pushing to the edge of disaster to force concessions).  

  **Learning Goals**:  
  1. A threat you won’t carry out is worthless.  
  2. Delegating control (e.g., to randomness) makes threats credible.  
  3. When both sides delegate, risk escalates jointly—neither can back down without losing.  
  4. High-level brinksmanship enables low-level aggression (the "stability-instability paradox").  

  **Materials**:  
  - Whiteboard (track level, scores, tripwires)  
  - 2 six-sided dice (d6)  
  - 12 playing cards (6 red, 6 blue) for private info  
  - Candy (or stakes like "losers summarize next reading")  

  **Prep**:  
  1. **Private Info Cards** (prepare in advance):  
     - **Red Team Cards**:  
       - Card 1: Pain Tolerance = 2, Catastrophe Cost = -15  
       - Card 2: Pain Tolerance = 3, Catastrophe Cost = -20  
       - Card 3: Pain Tolerance = 4, Catastrophe Cost = -10  
     - **Blue Team Cards**:  
       - Card 1: Pain Tolerance = 2, Catastrophe Cost = -20  
       - Card 2: Pain Tolerance = 3, Catastrophe Cost = -10  
       - Card 3: Pain Tolerance = 4, Catastrophe Cost = -15  
     *Shuffle each set; teams draw one card secretly.*  

  2. **Key Rules**:  
     - **Levels**: 1 (least escalated) to 5 (catastrophe). Start at Level 1.  
     - **Pain Tolerance (PT)**: Highest level you can back down without extra penalty.  
     - **Backing Down Cost (at level k)**:  
       - If \( k \leq \text{PT} \): Loss = \( k \)  
       - If \( k > \text{PT} \): Loss = \( 2k - \text{PT} \)  
       *Example: PT=3, back down at Level 4 → Loss = 2×4 – 3 = 5.*  
     - **Catastrophe Cost (CC)**: Loss if both escalate to Level 5 (see card).  
     - **Winner’s Prize**: 10 points (e.g., candy for all team members).  

  ---  

  ### Game Rules (20 minutes per round)  
  **Actions Each Round** (both teams choose simultaneously):  
  1. **Back Down**: Lose points based on current level. Opponent wins 10 points.  
  2. **Escalate**: Push conflict to next level. If both escalate, level increases.  
  3. **Set Tripwire**:  
     - Escalates level +1 *and* delegates your next choice to a die roll.  
     - **Visible effect**: Place a [T] next to your team on whiteboard.  
     - **Mechanic**: At next level, roll d6:  
       - Roll 1–3 → You *must* Escalate.  
       - Roll 4–6 → You choose freely.  
     - **Limit**: Each team can set only *one tripwire per game*.  

  **Level 5 Rules**:  
  - No tripwires allowed (no Level 6).  
  - If both escalate (or are forced to), catastrophe occurs → both get CC.  

  **Procedure**:  
  1. **Start at Level 1**. Teams discuss choices secretly (2 min/round).  
  2. **Reveal choices simultaneously**. Resolve outcomes:  
     - If either backs down → game ends, backer loses, other wins.  
     - If both back down → both lose current level’s cost.  
     - If no one backs down → level escalates.  
  3. **If tripwire set**: Roll die at *start of next level* to force escalation.  
  4. **End**: When someone backs down or Level 5 catastrophe.  

  ---  

  ### Why Level 5 is Objectively Dumb (Arithmetic Proof)  
  At Level 5, if both escalate:  
  - Both get Catastrophe Cost (CC ≤ -10).  
  - If one backs down: Loss = \( 2×5 - \text{PT} \leq 8 \) (since PT ≥ 2).  
  - **Expected Value (EV) of escalating**: Assumes opponent backs down sometimes. But if *both* escalate 100%:  
    - EV = CC (e.g., -15 or -20) **<<** Backing down cost (max -8).  
  - **Conclusion**: Escalating at Level 5 is EV-negative if opponent won’t back down. It’s only rational as a bluff.  

  ---  

  ### 90-Minute Timeline  
  **0–10 min: Setup**  
  - Split into Red/Blue (9 students each).  
  - Distribute private cards. Explain rules, write examples on board:  
    > *"If Red (PT=3) backs down at Level 4: Loss = 5.  
    > If both escalate to Level 5: Both get CC (e.g., -20)."*  

  **10–30 min: Round 1 (No Tripwires)**  
  - Goal: Teams discover credibility gap.  
  - *Predictable issue*: They race to Level 5, someone backs down or catastrophe. Ends fast.  
  - **When it happens**: Note it! *"Why did catastrophe happen? Was Level 5 a rational choice?"*  

  **30–40 min: Debrief Round 1**  
  - Ask:  
    - "Where did threats fail? Why?"  
    - "Why couldn’t you force the other side to back down?"  
    - "What would make escalation credible?"  
  - Introduce "tripwire" concept.  

  **40–60 min: Round 2 (With Tripwires + Twist)**  
  - **Twist**: Pre-set "Treaty Tripwire" at Level 3 (instructor-controlled):  
    - If Level 4 is reached, roll d6:  
      - 1–3 → Both teams *must* Escalate at Level 4.  
      - 4–6 → No effect.  
  - Goal: Teams use delegation and see how high-level danger enables low-level risks.  

  **60–85 min: Debrief**  
  Map game moments to concepts:  
  1. **Credibility Gap (Round 1)**:  
     - *"Why didn’t anyone believe your threat at Level 4? How did tripwires fix this?"*  
  2. **Delegating Control (Round 2)**:  
     - *"When did a team set a tripwire? How did it change opponents’ behavior?"*  
     - *"Did you feel safer or in more danger after delegation?"*  
  3. **Manufactured Shared Risk**:  
     - *"When both set tripwires, why couldn’t you reduce risk even if both wanted to?"*  
     - *Example*: Tripwires at Level 3 → forced escalation to Level 4 → higher catastrophe risk.  
  4. **Stability-Instability Paradox (Twist)**:  
     - *"How did the Treaty Tripwire at Level 3 make you act at Levels 1–2? Why do small fights feel safer when big disasters are 'automatic'?"*  
  5. **Name the Concept**:  
     - *"This is Brinksmanship: Creating mutual risk of catastrophe to force concessions. Examples: Cold War nuclear alerts, automated retaliation systems."*  

  **85–90 min: Wrap-Up**  
  - Stress: *"This game does NOT teach 'be the craziest.' It teaches that credible threats require surrendering control—but mutual surrender traps everyone."*  
  - Distribute candy/tasks.  

  ---  

  ### What Goes Wrong & Fixes  
  - **Problem 1**: They escalate to Level 5 too fast.  
    - **Fix**: After Round 1, ask: *"Why did catastrophe happen? What could you have done to force the opponent to back down earlier?"*  
  - **Problem 2**: Ignoring danger.  
    - **Fix**: In Round 2, emphasize: *"Your CC is catastrophic (-10 to -20). Backing down at Level 5 costs at most -8. Is escalating rational?"*  
  - **Problem 3**: Not using tripwires.  
    - **Fix**: Hint pre-Round 2: *"To make threats credible, smart players give up control."*  

  ### What the Game Can’t Do  
  - **Abstracted Catastrophe**: Real nuclear war has no "points after." The score is a teaching hack.  
  - **Oversimplified Motives**: Real brinksmanship involves ideology, human error, and complex alliances.  
  - **"Craziest in the Room"**: Unlike Chicken, this game *doesn’t* reward irrationality. It rewards **calculated delegation** (e.g., tripwires). Winning comes from credible threats, not madness.  

