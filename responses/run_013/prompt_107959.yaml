prompt: |-
  I sit on the character-and-fitness panel of a state bar's board of law examiners. Our job is to interview applicants whose records raise a question — an old conviction, a finding of academic dishonesty, undisclosed debts, a run of jobs abandoned without explanation — and to recommend admission, conditional admission, or denial. We sit monthly; each panelist carries six to eight files; each applicant gets forty-five minutes and a vote in the same session; the chair signs the recommendation and the full board ratifies it. Our written reasons are disclosed to the applicant and are appealable, so a recommendation that amounts to disliking the applicant is a real liability for us. Treat the substantive standard as ours to state; I am not asking what any particular jurisdiction's rules currently provide.

  I want to replace our internal guidance with an actual decision procedure, because I have come to think that most of what the panel does is an unlicensed inference from conduct to character. The folk theory we run on — that a piece of conduct reveals a stable trait, and the trait predicts later conduct — is precisely the theory that the situationist research program in psychology and the philosophical debate over virtue ethics have been undermining for decades. I cannot simply abolish the panel; someone has to make these calls, and a panel that shrugged and admitted everyone would not be doing its job either.

  So write the procedure. Start from what virtue ethics actually claims about character, habituation, and practical wisdom, and from what the situationist critique actually establishes as opposed to what it merely insinuates, and then do the translation work: which distinctions have to survive the compression into something a non-philosopher can run, which can be dropped, and where the procedure will misfire. I want the questions in the order a panelist should ask them, what counts as a sufficient answer to each, the point at which the procedure returns a no, and the points at which it must hand the decision back to a person because what remains is a question of values rather than of fact. I want a test that separates a trait ascription doing explanatory work from one that merely restates the conduct, and something a panelist can do with a single episode where there is no pattern to read. And I want the procedure to say what to do about local traits — the applicant who is scrupulous in one setting and careless in another — because I suspect that is most of what we actually see, and our current guidance has nothing to say about it.

  Then run the procedure on three files. First, an applicant who in her second year of law school plagiarized a seminar paper during a term in which she was working nights and caring for an ill parent, and who has since practiced four years without complaint. Second, an applicant with a spotless record — strong references, no discipline, no debts — whose entire history consists of situations in which nothing was at stake. Third, the file where I expect the procedure to tell me something I do not want to hear; choose it yourself, but it should be a case the panel would decide on the basis of the applicant's character in a way the procedure cannot license. For each, give the recommendation the procedure yields, the written reason a panelist could actually defend, and where you had to make the procedure's silence explicit rather than paper over it. Finish by saying what the procedure cannot do, and what a panelist should do when the answer it yields is one the panel will not accept.
reasoning: |-
  We are designing a decision procedure for the character-and-fitness panel. The procedure must be grounded in a correct understanding of virtue ethics and the situationist critique, and it must be practical for non-philosophers to apply.

  Virtue ethics (as per Aristotle) emphasizes:
  - Character traits (virtues and vices) as stable dispositions to act in certain ways.
  - Habituation: virtues are acquired through practice and repetition.
  - Practical wisdom (phronesis): the ability to discern the right action in particular circumstances.

  The situationist critique (from psychology, e.g., Milgram, Zimbardo, and philosophers like Doris and Harman) argues:
  - Behavior is often more strongly influenced by situational factors than by stable character traits.
  - People do not consistently display traits across different situations (the problem of cross-situational consistency).
  - What we often attribute to character may be the result of the situation.

  Therefore, the procedure must avoid:
  - Over-reliance on single episodes as indicative of a stable trait.
  - Ignoring the role of situational factors.

  The procedure should:
  1. Focus on patterns of behavior over time and across situations (to the extent they exist).
  2. Consider the context (situational factors) of any misconduct.
  3. Distinguish between a trait that explains behavior and a mere restatement of the behavior (e.g., "he lied because he is dishonest" vs. "he lied because he was under extreme pressure and made a one-time error").
  4. Account for local traits (traits that are context-specific, e.g., honest in professional settings but not in personal ones) and how they might affect legal practice.

  The decision procedure:

  Step 1: Identify the conduct of concern.
     - What is the specific conduct that raised the red flag? (e.g., plagiarism, conviction, job abandonment)

  Step 2: Assess the situational factors at the time of the conduct.
     - Were there external pressures (e.g., stress, illness, financial hardship, family crisis) that might have contributed?
     - Were there institutional or environmental factors (e.g., a toxic work environment, lack of supervision, peer pressure)?
     - How unusual were the circumstances? (Could they happen again? Are they likely to recur in legal practice?)

     If the conduct occurred in a highly unusual and stressful situation that is unlikely to recur, and the applicant has no other issues, then it may be discounted. However, if the situational factors are common (e.g., ordinary work stress) and the response was inappropriate, that is more concerning.

  Step 3: Look for patterns.
     - Is there a history of similar conduct? (Multiple instances of plagiarism, multiple job abandonments, etc.) If so, that suggests a habit (or vice) that may be stable.
     - If there is only a single episode, can we find any pattern in the applicant's life that might explain it? (E.g., a pattern of poor judgment under stress, or a pattern of responsibility in other areas?)

     If there is a pattern of misconduct, especially in diverse situations, that suggests a stable negative trait. If there is a pattern of good conduct, that may offset an isolated lapse.

  Step 4: Examine the applicant's response and growth.
     - Has the applicant taken responsibility for the conduct?
     - Has the applicant taken steps to address the underlying causes (e.g., sought counseling, paid restitution, undertaken additional training)?
     - Has the applicant demonstrated learning and change? (E.g., after a plagiarism incident, has the applicant shown exceptional care in subsequent work?)

     This step is crucial because virtue ethics emphasizes habituation and learning. If the applicant has actively worked to improve, that is evidence of developing virtue.

  Step 5: Consider the relevance to legal practice.
     - Is the conduct of a type that is likely to be relevant to the practice of law? (E.g., dishonesty, lack of diligence, inability to manage stress, disregard for rules, substance abuse affecting performance.)
     - How might the situational factors that led to the misconduct manifest in legal practice? Are they avoidable or manageable?

  Step 6: Evaluate the applicant's overall record and references.
     - Look for evidence of positive traits (e.g., trustworthiness, diligence, reliability) in other contexts, especially professional and academic settings.
     - What do references say? Do they attest to the applicant's character in a way that is specific and credible?

  Step 7: For applicants without any negative conduct but also without any significant challenges (the "spotless but untested" record), we must be cautious. Virtue is demonstrated in the face of challenges. Therefore:
     - We should look for any evidence of how the applicant handles responsibility, pressure, or ethical dilemmas, even if minor.
     - If there is no evidence at all, we cannot infer either positive or negative traits. However, the absence of negative evidence is not by itself problematic. We would typically recommend admission, but we might note the lack of testing and suggest that the applicant may need mentorship when facing future challenges.

  Step 8: When we have a single episode and no pattern, we must be careful not to over-interpret. We can consider:
     - The severity of the episode.
     - The recency and the applicant's subsequent record.
     - Whether the episode is part of a larger context that might indicate a local trait (e.g., the applicant is usually diligent but failed in one high-stress situation).

  Step 9: The procedure must recognize when it cannot make a determination without a value judgment. For example:
     - When the conduct is borderline and there is no clear pattern, but the panel might feel uneasy, the procedure should force an explicit statement of the values at stake (e.g., "We value honesty so highly that even a single instance of plagiarism is disqualifying without extraordinary mitigation").
     - When the situation is highly unusual and the panel must decide whether the applicant's response (e.g., taking responsibility) is sufficient.

  Decision points:
  - If the conduct is severe and recent, and there is a pattern of similar conduct, and little evidence of change, then denial is likely.
  - If the conduct is isolated, mitigated by situational factors, and the applicant has shown growth and has a positive record otherwise, then admission (possibly conditional if there are concerns about recurrence).
  - If the conduct is not clearly relevant to legal practice and the applicant has an otherwise strong record, then admission.

  Conditional admission might involve requirements like ongoing counseling, supervision, or reporting.

  Now, we run the procedure on three cases.

  Case 1: Applicant who plagiarized in law school (second year) while working nights and caring for an ill parent. Four years of practice without complaint.

  Step 1: Conduct - plagiarism in a seminar paper.
  Step 2: Situational factors - high stress: working nights and caring for an ill parent. These are significant and unusual pressures that might have impaired judgment.
  Step 3: Pattern - only one known instance of academic dishonesty. Since then, four years of practice without complaint suggests a pattern of integrity in professional work.
  Step 4: Response - we don't have details, but the fact that she has practiced without complaint suggests she has been responsible. We would need to know if she took responsibility at the time (e.g., admitted, learned from it) and if she has discussed it in her application.
  Step 5: Relevance - plagiarism is directly relevant to legal practice (honesty in work). However, the situational factors are less likely to recur in the same way (she is no longer a student with those specific pressures). Her four years of practice without issue suggest she can handle the pressures of legal work.
  Step 6: Overall record - strong in the professional setting (four years without complaint). References from her employers would be important.
  Step 8: Single episode with clear situational factors and a subsequent positive pattern.

  Recommendation: Admission. The plagiarism was a one-time lapse in an exceptionally stressful period, and the applicant has demonstrated over four years of practice that she is trustworthy and competent.

  Written reason: "The panel finds that the act of plagiarism, while serious, occurred during a period of extreme personal stress and has not been repeated. The applicant has since practiced law for four years without any disciplinary issues. The panel is satisfied that the applicant has learned from the incident and has demonstrated the requisite character and fitness for the practice of law."

  Case 2: Applicant with a spotless record but no history of facing significant challenges.

  Step 1: No conduct of concern.
  Step 2: No negative situational factors to consider.
  Step 3: Pattern - no negative pattern, but also no pattern of overcoming challenges.
  Step 6: Overall record is positive but untested.
  Step 7: We have no evidence of how the applicant handles stress or ethical dilemmas. However, the absence of negative evidence is not a basis for denial.

  Recommendation: Admission. The procedure cannot penalize someone for not having faced challenges. We note that the applicant may need support when facing future challenges, but that is true for everyone.

  Written reason: "The panel finds no evidence of conduct that would call into question the applicant's character or fitness. The applicant's record is unblemished. While the record does not include significant challenges, the panel does not require applicants to have faced adversity to be admitted. The applicant is recommended for admission."

  However, we might add a note in the internal guidance: for such applicants, the panel might emphasize in the interview the importance of seeking support when facing challenges, but this does not affect the recommendation.

  Case 3: We choose a difficult case: an applicant with a pattern of minor dishonesty in diverse settings. For example:
     - In college, he was caught cheating on a minor assignment and received a warning.
     - In a previous job (non-legal), he was fired for falsifying time records.
     - In law school, he was disciplined for misrepresenting his pro bono hours.

  The applicant explains that each incident was a one-time mistake due to pressure and that he has learned his lesson. He has worked for one year as a paralegal without incident and has strong references from his current employer.

  Step 1: Conduct - multiple instances of dishonesty (academic, employment, and pro bono hours).
  Step 2: Situational factors - he claims pressure, but the incidents happened in different settings and over time. The pressure is not extraordinary and is typical of life (work and school).
  Step 3: Pattern - a pattern of dishonesty in diverse situations (academic, work, and law school). This suggests a stable trait of dishonesty.
  Step 4: Response - he says he has learned, and he has one year without incident. But the pattern is concerning because it shows repeated behavior despite previous consequences.
  Step 5: Relevance - dishonesty is highly relevant to legal practice.
  Step 6: Overall record - the references from the current employer are positive, but they are based on one year. The pattern of dishonesty in multiple settings over years is more telling.

  The procedure would likely point to denial because of the pattern. However, the panel might be tempted to admit because of the recent clean year and strong references. The procedure would force the panel to confront the pattern and the lack of evidence that the trait has changed. One year is not a long time to establish a new habit.

  Recommendation: Denial.

  Written reason: "The panel finds a pattern of dishonest conduct in multiple settings over several years. While the applicant has had one year without known incidents, the pattern indicates a lack of the trustworthiness required for the practice of law. The applicant has not provided sufficient evidence of sustained reform over a significant period to overcome the pattern."

  But what if the panel wants to admit conditionally? The procedure does not rule that out if we believe the one year of good behavior is a start. However, the pattern is strong. The procedure would note that conditional admission might require a longer period of supervised practice and counseling, but the pattern is so concerning that denial may be the safer choice.

  However, the procedure must also account for the possibility of change. We might build in an option for conditional admission if the applicant can demonstrate a sustained period of reform (e.g., 2-3 years) and has undergone counseling. But in this case, only one year has passed since the last incident (in law school). Therefore, denial is indicated.

  Where the procedure must hand back to the panel: The procedure can identify the pattern and the relevance, but the decision about how much weight to give the recent positive year is a value judgment about the required period of reform. The procedure might say: "If the pattern of dishonesty is in multiple settings and over an extended period, and the period of demonstrated reform is less than [X] years, then denial is recommended. However, if the panel believes the applicant has truly reformed, they may consider conditional admission with strict supervision and reporting for [Y] years." But to avoid arbitrariness, we set a guideline: for a pattern of dishonesty, at least two years of demonstrated honesty in a professional setting. Since the applicant has only one year, denial is the default.

  What the procedure cannot do:
  - It cannot eliminate all discretion. There will be borderline cases.
  - It cannot account for every nuance of a person's life story.
  - It may be too rigid in cases where the applicant has shown extraordinary growth but the pattern was severe.
  - It cannot resolve value conflicts (e.g., how much weight to give to rehabilitation vs. the original conduct).

  When the procedure yields an answer the panel does not want to accept (e.g., denial in a case where the panel feels sympathetic), the panel should:
  1. Explicitly state the reasons why they are departing from the procedure.
  2. Ensure that their decision is based on evidence that the procedure did not capture (e.g., extraordinary evidence of rehabilitation) and not simply on sympathy.
  3. Be prepared to defend the decision on appeal.

  Final note: The procedure is a tool to structure the inquiry and avoid unlicensed inferences. It does not replace judgment but guides it. The panel must still exercise practical wisdom, but in a way that is transparent and consistent.
answer: |-
  ### Decision Procedure for Character-and-Fitness Panel  
  **Grounding in Virtue Ethics and Situationist Critique**  
  - **Virtue Ethics**: Character traits are stable dispositions developed through habituation (repeated practice) and guided by practical wisdom (contextual judgment). A single act may not define character; patterns and growth matter.  
  - **Situationist Critique**: Behavior is often driven by situational factors (e.g., stress, institutions) rather than global traits. People exhibit "local traits" (context-specific behaviors) but lack cross-situational consistency. Traits must be inferred cautiously, avoiding overgeneralization.  

  **Key Distinctions Retained**  
  1. **Trait vs. Restatement**: A trait (e.g., dishonesty) must explain behavior across contexts; it cannot merely restate the act (e.g., "plagiarized because dishonest" is circular).  
  2. **Pattern vs. Single Episode**: Patterns suggest habituation; single episodes require scrutiny of context and growth.  
  3. **Global vs. Local Traits**: Local traits (e.g., diligence at work but not in studies) are common and acceptable if irrelevant to legal practice.  
  4. **Situational Factors**: Mitigating/aggravating circumstances (e.g., crisis, institutional pressure) must be weighed.  

  **Dropped Distinctions**  
  - Philosophical nuances (e.g., Aristotelian vs. Stoic virtue) are omitted for simplicity.  
  - Situationist debates about trait existence are simplified to: "Assume traits exist but are local and context-bound."  

  **Decision Procedure: Step-by-Step Questions**  
  *Panelists must ask these questions in order. Stop and return a decision if criteria are met.*  

  1. **What is the conduct of concern?**  
     - *Sufficient answer*: Clearly describe the act (e.g., plagiarism, debt nonpayment).  
     - *If no conduct*: Skip to Step 7.  
     - *Misfire risk*: Overemphasizing minor conduct; use severity thresholds (e.g., felonies, academic fraud).  

  2. **Were situational factors present?**  
     - Assess: Stress (e.g., illness, poverty), institutional influences (e.g., toxic workplace), or extraordinary circumstances (e.g., natural disaster).  
     - *Sufficient answer*: Factors are specific, corroborated, and plausibly influential.  
     - *Stop if*: Factors are severe, unlikely to recur in legal practice, *and* conduct is isolated → **Admit unconditionally**.  
     - *Misfire risk*: Excusing common stressors (e.g., routine job pressure).  

  3. **Is there a pattern?**  
     - Look for: Similar conduct across diverse contexts (e.g., dishonesty at work *and* school).  
     - *Sufficient answer*: ≥2 incidents in distinct settings (e.g., academic, financial, professional).  
     - *Stop if pattern exists*: → Proceed to Step 4.  
     - *If no pattern*: → Proceed to Step 5 (single episode).  

  4. **Does the pattern indicate a trait relevant to legal practice?**  
     - Test: Trait must (a) explain the pattern (not restate it), and (b) threaten core legal duties (e.g., honesty, diligence, reliability).  
       - *Relevant traits*: Chronic dishonesty, repeated negligence, inability to manage conflicts.  
       - *Irrelevant traits*: Local flaws (e.g., disorganized personal finances but professional rigor).  
     - *Sufficient answer*: Trait is named (e.g., "habitual dishonesty"), and examples show cross-context harm.  
     - *Stop if*: Trait is irrelevant → **Admit unconditionally**.  
     - *Stop if*: Trait is relevant *and* unmitigated → **Deny**.  
     - *If mitigated*: → Proceed to Step 6.  

  5. **For single episodes: Was growth demonstrated?**  
     - Assess: (a) Accountability (e.g., admission, restitution), (b) remediation (e.g., counseling, education), (c) time since incident, (d) post-conduct record.  
     - *Sufficient answer*: Clear evidence of change (e.g., clean record for 2+ years, proactive corrections).  
     - *Stop if*: Growth is shown *and* conduct is not severe (e.g., non-felony) → **Admit unconditionally**.  
     - *Stop if*: No growth *or* conduct is severe (e.g., violent crime) → **Deny**.  
     - *If ambiguous*: → **Conditional admission** (e.g., supervision, monitoring).  

  6. **Is the trait remediated?**  
     - Assess: (a) Sustained change (≥3 years without recurrence), (b) evidence of habituation (e.g., mentorship, new skills).  
     - *Sufficient answer*: Documentation (e.g., employer references, therapy records).  
     - *Stop if*: Remediated → **Conditional admission** (probationary period).  
     - *Stop if*: Not remediated → **Deny**.  

  7. **For "spotless" records: Is there evidence of tested character?**  
     - Assess: References, work history, or life experiences demonstrating integrity *under pressure* (e.g., ethical dilemmas, high-stakes decisions).  
     - *Sufficient answer*: Examples showing judgment in adversity (e.g., leading a team through conflict).  
     - *Stop if*: No testing → **Admit unconditionally** (untested ≠ unfit).  
     - *Misfire risk*: Penalizing privilege (e.g., applicants without adversity).  

  **Handoff to Human Judgment**  
  - Proceed to deliberation if:  
    - Values conflict (e.g., "How much rehabilitation is enough?").  
    - Situational factors are disputed (e.g., "Was the parent's illness severe enough?").  
    - Local traits pose ethical trade-offs (e.g., "Is courtroom diligence sufficient to offset personal recklessness?").  

  **Procedure Outputs**  
  - **Recommendation**: Admit, Deny, or Conditional Admission (with terms).  
  - **Written Reason**: Fact-based, citing evidence (avoid "dislike" or global trait labels).  

  ---  
  ### Case Applications  
  #### Case 1: Law School Plagiarism  
  - **Background**: Plagiarized a seminar paper while working nights and caring for ill parent. Four years of practice without complaint.  
  - **Procedure Walkthrough**:  
    1. **Conduct**: Plagiarism (academic dishonesty).  
    2. **Situational Factors**: High stress (work + caregiving); severe and unlikely to recur identically. → *No stop; proceed*.  
    3. **Pattern**: Single episode (no prior/future dishonesty). → *Proceed to Step 5*.  
    4. **Growth Demonstrated**: Four-year clean record in practice; accountability assumed (no recurrence). → **Admit unconditionally**.  
  - **Recommendation**: Admit.  
  - **Written Reason**: "The plagiarism occurred during a documented period of extreme personal stress. The applicant has since maintained an unblemished four-year legal practice, demonstrating rehabilitation and fitness. The conduct is isolated and not indicative of a persistent trait relevant to practice."  
  - **Silence Explicitly Noted**: The procedure assumes accountability; if the applicant denied responsibility, growth would be unproven.  

  #### Case 2: Spotless but Untested Record  
  - **Background**: Flawless academics, no debts/discipline, but no high-stakes challenges. Strong references praise competence, not character under pressure.  
  - **Procedure Walkthrough**:  
    1. **No conduct of concern** → Proceed to Step 7.  
    2. **Evidence of Tested Character**: References describe reliability but no adversity (e.g., "excelled in structured environments"). → **Admit unconditionally**.  
  - **Recommendation**: Admit.  
  - **Written Reason**: "No conduct raises fitness concerns. While the record lacks evidence of character tested under adversity, absence of testing does not imply deficiency. Admission is recommended with the expectation that mentorship will support future ethical challenges."  
  - **Silence Explicitly Noted**: The procedure cannot infer risk from a lack of testing; it defaults to admission.  

  #### Case 3: The "Character" Denial (Chosen Case: Chronic Financial Irresponsibility)  
  - **Background**: Applicant has six undisclosed debts in collections, three evictions, and two job firings for "poor time management" over eight years. Claims "bad luck," but pattern persists post-remediation efforts (e.g., budgeting course). References describe them as "well-meaning but scattered."  
  - **Why the Panel Would Deny on Character**: Panelists infer global "irresponsibility" and predict client harm.  
  - **Procedure Walkthrough**:  
    1. **Conduct**: Debt nonpayment, evictions, job abandonment.  
    2. **Situational Factors**: None claimed; conduct occurs in stable periods. → *No stop; proceed*.  
    3. **Pattern**: Repeated across financial, residential, and employment contexts. → *Proceed to Step 4*.  
    4. **Relevant Trait?**: Pattern suggests "chronic unreliability" (explains behavior, not restatement). Trait threatens legal practice (e.g., missed deadlines, client neglect). → *Proceed to Step 6*.  
    5. **Remediated?**: Efforts made (e.g., budgeting course), but no sustained change (debts/evictions continue). → **Deny**.  
  - **Recommendation**: Deny.  
  - **Written Reason**: "The applicant's pattern of financial negligence, housing instability, and employment terminations demonstrates unreliability across multiple contexts. Remediation efforts have not produced sustained change. This trait risks harm to clients and the profession."  
  - **Silence Explicitly Noted**: The procedure cannot assess "good intentions" vs. results; it prioritizes outcomes. If panelists value effort over change, they must override.  

  ---  
  ### Limitations and Overrides  
  **What the Procedure Cannot Do**  
  1. **Resolve Value Conflicts**: E.g., "How much redemption is enough?" requires panelist judgment.  
  2. **Handle Ambiguous Evidence**: Conflicting references or disputed facts need human interpretation.  
  3. **Predict Future Conduct**: It assesses past patterns, not prophecy.  
  4. **Evaluate "Moral Luck"**: E.g., Two identical applicants—one caught, one not—may be treated differently.  

  **When the Panel Disagrees with the Procedure**  
  - **Override Only If**:  
    - New evidence justifies deviation (e.g., unreported rehabilitation).  
    - Values-based rationale is explicit (e.g., "We prioritize second chances for non-violent conduct").  
  - **Documentation Required**: Written reasons must state:  
    - "The procedure recommends [X], but we recommend [Y] because [values/facts]."  
    - Ground the override in evidence or jurisdiction-specific values (e.g., "Our bar prioritizes rehabilitation").  
  - **Appeal Risk**: Overrides risk reversal if reasons are circular (e.g., "we distrust them") or ignore procedure safeguards.  

  **Final Note**  
  This procedure replaces folk psychology with a scaffold for evidence-based decisions. It compresses virtue ethics (habituation, growth) and situationism (context, local traits) into a practical tool. Panelists must still exercise wisdom—but now within guardrails that minimize bias and maximize fairness.
