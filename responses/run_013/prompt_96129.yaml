prompt: |-
  I'm a backend engineer with no philosophy background at all, and I've somehow become the person who has to get new engineering practices to stick across our org of about 40 devs. Someone in a book club told me that culture itself evolves Darwinianly — practices and habits spreading the way memes do, copied with variation and then selected for — and that this is a real theory and not just a metaphor (apparently the word came from a biologist in the 70s). I want to actually use it, so: turn the Darwinian theory of culture into a procedure I can run before I try to roll out a practice, so I can tell in advance whether it'll spread or die, and what to change to give it a better shot.

  It has to be something I can run in an afternoon by myself, no researcher around and noones approval but mine: the questions to ask in order, what counts as a good enough answer to each, where the procedure stops with a no, and where it hands the decision back to a person because the call is about what we value rather than about what spreads. Keep the jargon light and define anything you can't avoid in a clause. Half of what I read says the whole meme thing got quietly dropped by the people who used to work on it, so don't sell me a framework thats been abandoned — if the theory only gets me partway, say where it quits and where it'll hand me a confident wrong answer. And copying isn't literal: people half-remember a practice and reinvent it, so the procedure needs to cope with a practice that mutates a bit every time it's handed on, not just one thats passed along intact.

  Run it at the end on two cases: (1) always write the failing test first, which I've rolled out twice and which died both times, and (2) no code goes to main on a Friday, which spread through the team on its own without me doing anything, and which I'm suspicious of precisely because it caught on so easily. I'd like the procedure to tell me the Friday rule is good, and I have a feeling it won't.

  Give it back as exactly five numbered items, one or two sentences each, no intro and no conclusion — items 1 through 4 are the steps, and item 5 is where you run both cases through them.
reasoning: |-
  We are going to use a simplified version of memetic theory (the Darwinian theory of cultural evolution) to assess the spreadability of an engineering practice. The key factors are: 
   - **Fidelity**: How accurately is the practice copied? (But note: in reality, practices mutate, so we need to assess how robust it is to mutation.)
   - **Fecundity**: How often is the practice copied? (How many opportunities to observe and copy? How memorable?)
   - **Longevity**: How long does the practice persist in an individual or group? (Does it stick once adopted?)
   - **Selection Pressure**: What environmental factors (e.g., team culture, tooling, incentives) favor or disfavor the practice?

   However, note that the theory has been debated and is not universally accepted. It can give insight into why some practices spread, but it doesn't account for all social factors (like power structures, rational deliberation, or moral values). It might hand you a wrong answer if the spread is driven by non-Darwinian factors (e.g., top-down mandate, a charismatic advocate, or a sudden crisis that makes the practice essential).

   Steps:

   1. **Assess Observability and Clarity (Fidelity/Fecundity)**: 
      - How easily can someone observe the practice being done and understand what it is? 
      - If it's not directly observable (e.g., a mental habit like writing a test first), how clearly can it be described? 
      - Good: Practice leaves visible artifacts (like a PR with a test commit before the fix) or is easily demonstrated. Bad: Abstract, hard to see, or requires context to recognize.
      - Stop if: The practice is inherently invisible and cannot be made observable without excessive overhead.

   2. **Check for Robustness to Mutation (Fidelity)**: 
      - What are the core elements that must be preserved for the practice to work? 
      - How tolerant is the practice to small changes (e.g., if someone forgets part of it, does it still deliver value)? 
      - Good: The practice has a clear, memorable core and can still work even if details are altered. Bad: It's brittle and falls apart if not done exactly right.
      - Stop if: The practice requires precise execution in a way that our environment (busy engineers, time pressure) cannot support.

   3. **Evaluate Environmental Fit (Selection Pressure)**:
      - What current problems does this practice solve that people actually feel? (e.g., "no code on Friday" prevents weekend fires, which people dread.)
      - Does it conflict with existing habits, tools, or incentives? (e.g., if the team is rewarded for shipping fast, writing tests first might feel slow.)
      - Good: It solves a felt pain without conflicting with existing workflows. Bad: It creates new friction or solves a problem no one cares about.
      - Hand back if: The practice's value depends on a long-term benefit that isn't immediately felt (then it's about values).

   4. **Assess Reinforcement (Longevity/Fecundity)**:
      - Once adopted, does the practice naturally lead to positive outcomes that encourage repeating it? (e.g., a test catches a bug and saves time, reinforcing the habit.)
      - Are there social or tooling mechanisms to remind and reward? (e.g., PR templates that prompt for tests, or peers who notice and praise.)
      - Good: Immediate positive feedback loops. Bad: Delayed or abstract benefits, or no reinforcement mechanisms.
      - Hand back if: The practice requires cultural change that the organization hasn't committed to (then it's about values and investment).

   Now run the two cases:

   Case 1: "Always write the failing test first" (TDD)
     Step 1: Observability is low. Writing a test first is a mental process. The artifact (test commit before code) might be visible in Git, but it's not salient in daily work. Not a clear stop, but a challenge.
     Step 2: Robustness is low. If you forget to write the test first and just write code, the practice collapses. It requires discipline and is brittle to lapses.
     Step 3: Environmental fit: Conflicts with time pressure and existing habits (just fix the bug fast). The immediate pain it solves (design flaws) is not as acute as the pain of a looming deadline. Hand back? Maybe: if we value design quality over speed, but the org doesn't feel that pain acutely now.
     Step 4: Reinforcement is weak. The payoff (better design, fewer bugs) is delayed and might not be attributed to TDD. Immediate feedback is negative (slower to get the first test passing). Without strong reinforcement (e.g., a champion, metrics showing gains), it fades.

   Case 2: "No code goes to main on a Friday"
     Step 1: Highly observable. Everyone sees the PR merged on Thursday or held. The rule is simple and visible.
     Step 2: Robust to mutation. Even if people forget sometimes, the core (avoid Friday) is easy to remember and the worst-case (deploy on Friday and have a fire) is memorable. Variations (e.g., no deploys after 3pm) still capture the spirit.
     Step 3: Environmental fit: Solves a felt pain (weekend firefighting). Conflicts with shipping pressure, but the pain of a fire outweighs that. Fits because the cost (delay until Monday) is acceptable.
     Step 4: Reinforcement is strong. If someone breaks the rule and causes a fire, it reinforces the rule. If they follow it and avoid a fire, they enjoy the weekend. Social reinforcement: peers remind each other on Thursday afternoons.

   Thus, the procedure predicts:
     - TDD: Likely to die without strong intervention (beyond what memetics can address).
     - Friday rule: Likely to spread and stick.

   However, note: The Friday rule might be overly cautious in a team with robust CI/CD and feature flags (so the environmental fit could change). The procedure might be overconfident if the context changes.

   Format as five numbered items:
answer: |-
  1. **Check observability and simplicity**: Can people easily see the practice in action and grasp its core? If it's hidden (like internal reasoning) or overly complex, it won't spread well. Stop if critical parts are unobservable without unnatural effort.  
  *Example: "No Friday deploys" is visible in calendar blocks/PR timing; "write failing test first" is mental and leaves ambiguous traces.*  

  2. **Test mutation tolerance**: Will the practice still work if simplified or altered during copying? Identify its core "DNA"—what must stay intact. Stop if minor changes (e.g., skipping steps) break it entirely.  
  *Example: "No Friday deploys" works even if relaxed to "no deploys after 3 PM"; "failing test first" fails if tests are written mid-coding.*  

  3. **Assess environmental fit**: Does it solve a felt pain or conflict with existing workflows/incentives? Strong fit requires solving immediate, high-stakes problems without clashing with habits/tools. Hand back if value depends on long-term ideals (e.g., "code quality") versus urgent needs.  
  *Example: "No Friday deploys" prevents weekend fires (urgent pain); "failing test first" clashes with deadline pressure.*  

  4. **Verify reinforcement**: Does the practice naturally reward users quickly (e.g., via success, praise, or avoided pain)? If benefits are delayed, abstract, or require external enforcement, it won't self-sustain. Hand back if persistence relies on mandated compliance.  
  *Example: "No Friday deploys" gives instant relief/reinforcement; "failing test first" has delayed payoff and feels slower initially.*  

  5. **Case results**:  
     - **Write failing test first**: Fails step 1 (low observability), step 2 (fragile to mutation), step 3 (poor fit with speed incentives), step 4 (weak reinforcement). Predict: dies without structural changes.  
     - **No code to main on Friday**: Passes step 1 (visible), step 2 (mutation-tolerant core), step 3 (solves urgent pain), step 4 (self-reinforcing). Predict: spreads naturally.
