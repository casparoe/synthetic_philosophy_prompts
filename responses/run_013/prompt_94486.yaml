answer: |-
  ## The Argument

  **Setting:** A quiet corner booth in a dimly lit bar, glasses half-empty. The novelist (**Leo**, mid-50s, intense eyes, restless hands) leans forward, while the documentary filmmaker (**Mara**, late 40s, watchful, precise gestures) sits back, fingers tracing the rim of her whiskey glass.

  **Leo:** (Stabbing the air with a finger) Mara, you’re demanding a fidelity to a record that *isn’t* fidelity. That ledger? It tells us how many sacks of flour she bought, not why she flinched when the inspector touched the doorknob. That transcript? It’s cagey answers given to a man who’d already decided she was a grasping harpy. To chain her to *that* is the real betrayal. The novel reaches for the pulse *under* the skin the documents barely graze.

  **Mara:** (Leans in, voice low but sharp) And who gave you the scalpel, Leo? You say ‘betrayal’ like the record is the enemy. It’s all we *have* of her. She’s defenceless. Utterly. She can’t say, ‘No, I wasn’t afraid like that,’ or ‘I never had a sister,’ or ‘That cowardice you pinned on me? It was calculation.’ That silence isn’t permission. It’s vulnerability. We owe the silent *more* care, not license to fill the void however we please just because we can invent prettily.

  **Leo:** Vulnerability? Absolutely. But you’re confusing silence with purity. Her ‘voice’ in that transcript? It’s a performance! She’s cornered by a hostile official in a system stacked against women like her. Of *course* she’s crafting answers. Fidelity to *that performance* isn’t fidelity to *her*. It’s fidelity to the inspector’s stage. Your archive isn’t innocent, Mara. It’s curated by suspicion, filtered through power. My invented chapter? It’s an attempt to bypass *his* damn stage and find the person pacing backstage.

  **Mara:** (Takes a slow sip, considering) Okay. Point landed. The archive isn’t pure. It’s biased, incomplete, a product of its time and its authors’ agendas. Conceded. But Leo, that doesn’t make *your* construction automatically *truer*. It just makes it different. And your difference trades on the reader knowing *she was real*. That ledger’s existence, those begging letters – they whisper, ‘This happened.’ Your novel whispers, ‘This *felt* like this.’ But the reader hears both whispers as truth claims *because* of the real name, the real place. Your refusal to *assert* history like a textbook is a dodge. The form itself asserts authenticity by proximity.

  **Leo:** But it *is* true! True in the way that matters for understanding a human life under pressure. Not forensically true, but psychologically, emotionally true. The depth where life is *lived*. That inspector’s transcript skims the surface tension; my chapter dives for the undertow. Isn’t that a greater service to her memory than parroting the official record? Giving her an inner landscape?

  **Mara:** Inner landscape? Fine. Invent the fears, the longings, the secret grief the ledger doesn’t show. I can hold my nose at that, barely. But deeds, Leo. *Deeds*. You gave her a sister. You moved events. You put her in a room where no document places her, speaking words she never spoke. *That’s* where you cross the line. Invent the interior if you must, but never give her an action she didn’t perform. Protect the known facts. That’s the line.

  **Leo:** (Leans back, suddenly quieter) Is it stable, Mara? Really? Where’s the bright line between the ‘interior’ you grudgingly grant me and the ‘deed’ you forbid? Fear isn’t abstract; it *is* the trembling hand, the evasive glance, the decision to *not* speak. If I invent her *feeling* terror during a storm, but the record just shows she ordered extra lamp oil that month… isn’t that inventing a *reason* for a deed? And if I invent her *speaking* about that fear, in a room I placed her in – is that an invented deed, or just giving voice to the invented feeling? Your line dissolves in the murk of human experience. You protect the skeletal record while leaving the flesh and blood person utterly exposed to my imagination. How is *that* more respectful?

  **Mara:** (Silent for a beat, then) It’s… messier than I want it to be. Okay. Conceded. The interior/exterior divide isn’t clean. But Leo, the *weight* feels different. Inventing her crying alone in a pantry? Annoying, but maybe tolerable. Inventing her stealing funds, or turning away a specific child she actually took in? That feels like a different order of wrong. It paints her character with a brush she didn’t hold. You said you made her braver in one scene, more cowardly in another. Do you feel the same about both inventions?

  **Leo:** (Looks down, twists his glass) No. I don’t. The cowardice… it pricks. It feels like a violation. The bravery feels… generous. Like I’m giving her something. But is that just my squeamishness? My own vanity wanting her to be admirable? Or is there a real ethical asymmetry? Is a false kindness less harmful than a false accusation?

  **Mara:** Both are false! Both are *you* imposing your narrative on her irrecoverable reality. The ‘kindness’ might make readers admire a ghost who wasn’t like that. The ‘cowardice’ might make them despise her. Both distort. But the harm… (She hesitates) Maybe the harm *to her* is the same – a misrepresentation she can’t correct. But the harm to the *living*… to the few who might still care about her memory, or to readers forming their only image… the negative distortion feels more actively malicious. Like libel versus hagiography. Both lies, but one feels dirtier. I don’t know. That asymmetry might just be human instinct, not ethics. But it *matters*. You admitting it pricks you… that feels honest.

  **Leo:** It does prick. But where does that leave us? If the archive is suspect, and my invention is necessary to reach the depth, but I can’t cleanly separate thought from deed, and both kindness and cruelty in my pen feel problematic… what’s the alternative? Silence? Leaving her as the inspector’s caricature? Is *that* the ethical choice? To let the hostile record be the final word because we’re afraid to imagine responsibly?

  **Mara:** Not silence. But maybe… a different kind of honesty? A humility about the limits. That note you mentioned for the front matter: ‘Some scenes are invented.’ Does that discharge anything? Or does it just make everything *else* you wrote implicitly certified? ‘See, I flagged the big lies; the rest must be gospel.’ It feels… inadequate. Maybe even cynical.

  **Leo:** Agreed. It’s a fig leaf. It might warn off the most literal-minded, but it doesn’t touch the core problem you’ve articulated. It certifies the uncertainty without resolving it. So, no easy out there. What about her own words? That one interview. You’d grant those primacy, wouldn’t you? They must carry *some* special weight?

  **Mara:** *Must* they? (She sighs, the fight momentarily draining) That’s the knife twist, isn’t it? After arguing for her silence, her vulnerability… yes, part of me screams, ‘Her own words! That’s *her*!’ But… you’re right. It’s a performance. Under duress. To a hostile audience. She’s crafting a persona for survival. Is that *truer* than the inspector’s notes? Or just another layer of performance? Her words are precious, Leo, incredibly precious – they are the only vibrations left of her actual voice. But… they’re not gospel. They’re one document among others, fraught with their own context. Conceded. Damn it. (She drains her glass). But that doesn’t mean they’re worthless, or that your invention has equal footing!

  **Leo:** No. It doesn’t. They’re a shard of the real vase. My chapter is… a careful replica of what I imagine the whole vase looked like, based on the shard, the dust it was found in, and the shape of other vases from the time. Neither is the whole truth. But the replica allows people to *see* the vase, hold its shape in their mind, in a way the shard alone never could. Isn’t that worth the risk? Isn’t that a form of care? Not just for her, but for the *truth* of what it meant to be her?

  **Mara:** (Stares at him for a long moment) Care? Or colonization? You give her a voice you designed, Leo. You make her speak your truth about fear. What if her fear was nothing like that? What if it was colder, or sharper, or more resigned? You’ve replaced her irrecoverable inner reality with yours and called it a service. The risk… the risk is that the replica becomes the reality in people’s minds. That the fragile, ambiguous, hostile shard gets forgotten because your beautiful, coherent vase tells a better story. Is that care? Or is it erasure dressed as resurrection?

  **Leo:** And leaving her as the inspector’s suspect? Is *that* not erasure? Is letting the thin, hostile record define her because we lack the courage to imagine fuller – isn’t *that* the greater failure? We’re damned if we do, damned if we don’t, Mara. Either way, she’s at our mercy. The question is, which act of mercy – or arrogance – serves her, or the truth of her experience, better? I believe my novel, with all its inventions, gets closer to the bone.

  **Mara:** And I believe your belief is a necessary fiction for the novelist. But for the woman who lived? I think we owe her the acknowledgement that the bone is forever lost, and all we have are fragments and shadows. Filling the void feels like generosity, Leo. But sometimes, respecting the void is the only honesty left. (She signals for the check). We’ve circled the drain. You think the depth justifies the invention. I think the silence demands restraint. We both know the archive is poisoned. We both know the disclaimer is useless. We both feel the asymmetry of kindness versus accusation. And we both know her own words are just another unreliable layer. So where does that leave your chapter?

  **Leo:** (Quietly) Where it always was. In the book. Written. Because I believe, deeply, that it *is* true. And because silence felt like the greater wrong.

  **Mara:** (Nods slowly, wearily) And I will always believe that your belief, however profound, doesn’t grant you the right. We’ve landed exactly where we started, Leo. Just with fewer illusions about the ground beneath us.
