prompt: |-
  I'm a journalist who covers science and ideas for a general-interest mag — I did a CS degree and spent a few years writing about distributed systems before I moved to the bioethics beat, so my head is still full of failure detectors, quorums, split-brain, liveness vs safety, heartbeats and timeouts, fencing tokens, at-least-once vs exactly-once, leader election, and the whole business of deciding when a node is really gone. I'm working on a long feature about the definition of death, and the more I read the more I can't shake the feeling that the whole brain-death-vs-circulatory-death fight is something I already know how to think about, just wearing a lab coat. So here's what I want from you: take the circulatory position (death = irreversible cessation of circulatory and respiratory function) and the whole-brain position (death = irreversible cessation of function in the brain including the brainstem), and restate each of them, as faithfully as you can, in the vocabulary I actually use — failure detection, liveness and safety properties, false positives and false negatives, quorum, split-brain, recovery vs permanent failure, at-least-once vs exactly-once, and so on. Restate them one at a time, then give me the residue report, which is the part I actually care about: which claims cross over cleanly (I have a hunch that "irreversible" is doing the work of a timeout, and that the brainstem is basically the quorum, and that a locked-in patient is a partitioned node somebody's about to fence off, but tell me where I'm right and where I'm just pattern-matching), which ones only survive with distortion, and which have no counterpart in my vocabulary at all — I'm especially suspicious about anything having to do with the fact that the thing being declared dead is a person with interests rather than a stateless replica, and about whether "irreversibility" is a fact about the world or a policy choice we made about how long to wait.

  Then tell me what the residue means. Is it that my vocabulary is missing something — it's purely operational and descriptive, it can tell you when to fail over but it has no way to say why any of it matters — or is it that the philosophical disagreement is less substantive than the people having it think, and it's really just a design choice about which false positive vs false negative you're willing to eat, dressed up as a question about the nature of death? I go back and forth on this and I want somebody to actually land somewhere rather than give me the even-handed tour.

  One more thing: don't hedge. Take a definite position on which restatement is more faithful to its original and on whether the residue is a defect in my framework or a deflation of theirs, and give me your reasons even if they're contestable. I was arguing about this with a friend who's an anesthesiologist and she thinks I'm being reductive, so I'd like some ammo or a good reason to drop it. Keep the whole thing under 800 words, please — one page, no more, and skip the throat-clearing intro.
reasoning: |-
  Okay, let me tackle this fascinating request from a science journalist. They're clearly deeply familiar with distributed systems concepts and want to map brain-death vs circulatory-death debates onto that framework. The core challenge is translating medical/ethical definitions into CS metaphors without losing essential meaning.

  First, I need to unpack their core ask: they want circulatory death and whole-brain death restated in distributed systems terms, then an analysis of where the metaphors hold or break. They're especially interested in "irreversibility" as timeout, brainstem as quorum, and whether philosophical differences are just design choices. Their suspicion about personhood vs stateless replicas is crucial - that's where metaphors might fray.

  For circulatory death, the translation feels straightforward: it's like a node failure detected via heartbeat timeout. "Irreversible" maps neatly to the point where the system stops retrying - a policy decision masquerading as physical reality. The 2-5 minute wait in protocols is exactly like tuning a timeout window to balance false positives vs false negatives.

  Whole-brain death is trickier. The brainstem as quorum concept works well - loss of core regulatory functions means consensus impossible. But the "whole brain" requirement introduces problems: what about isolated cortical activity? That's like a partitioned node still logging writes locally but unable to propagate. The metaphor handles this with fencing tokens (DNR orders), but the ethical weight feels different when it's consciousness vs data consistency.

  The residue analysis is where it gets juicy. Three big gaps emerge: First, irreversibility in CS is purely operational (we stop retrying), but in medicine it's treated as ontological (the state itself). Second, personhood changes everything - we can't just "fail over" a human. Third, the liveness/safety tradeoff has moral dimensions here; declaring death early risks killing someone, while delaying risks desecration.

  I think the journalist is right that much disagreement boils down to false positive/false negative preferences disguised as philosophy. But their framework misses why we care about errors asymmetrically. The anesthesiologist friend's "reductive" critique points to this: we tolerate circulatory false positives (quick declarations) partly because the alternative - keeping bodies alive indefinitely - violates dignity in ways servers don't.

  Final position: The metaphors are 80% illuminating, especially on operational parallels. But the residue isn't a defect - it reveals medicine's irreducible moral stakes. Circulatory death's restatement is cleaner technically, but whole-brain death's messy residue exposes what matters: when we decide to stop treating a person as a person. That's not a design choice; it's the weight of human significance that no timeout value can capture.
answer: |-
  ### Circulatory Death Restatement  
  **System Model:** The body as a distributed system where the heart/lungs (primary node) maintain liveness via cyclic "heartbeats" (pulses/respiration).  
  **Failure Detection:** Death = timeout after cessation of detectable heartbeats, triggering irreversible failover (cessation of resuscitation).  
  **Properties:**  
  - **Safety:** Avoid false positives (declaring death prematurely). Protocol enforces a mandatory timeout (2-5 min) to ensure no spontaneous recovery.  
  - **Liveness:** Tolerates false negatives (delayed declaration) to prevent killing recoverable nodes. "Irreversible" is a **policy-driven timeout**—not physics, but a consensus on when retries cease.  
  **Quorum/Split-Brain:** N/A. Single-point failure detector; no quorum needed for decision.  

  ### Whole-Brain Death Restatement  
  **System Model:** Brain as a consensus cluster. Brainstem = **leader/coordinator** (regulates heartbeat, respiration). Cortex = worker nodes (cognition).  
  **Failure Detection:** Death = irreversible loss of **quorum consensus**. Requires global failure of all brain regions, confirmed by:  
  - Absence of "heartbeats" from brainstem (no autonomic functions).  
  - No "write acknowledgments" from cortex (no higher responses).  
  **Split-Brain/Locked-In Analogy:** Isolated cortical activity = partitioned node. Declaring death requires **fencing** (e.g., apnea test) to prove partition is unrecoverable.  
  **Properties:**  
  - **Safety:** Avoids false positives via redundant tests (clinical, EEG, angiography).  
  - **Irreversibility:** A **long timeout** (hours/days) + proof of no failover (no artificial support).  

  ---

  ### Residue Report: Where the Metaphor Holds, Frays, and Breaks  
  **Clean Crossovers:**  
  1. **Irreversible = Timeout:** Correct. Both systems treat "irreversibility" as **operational futility**—not metaphysical certainty, but a policy decision to stop retries.  
  2. **Brainstem = Quorum Leader:** The brainstem’s role in homeostasis maps perfectly to a coordinator. Loss collapses the system.  
  3. **Locked-In = Partitioned Node:** Isolated consciousness with no I/O? Fencing tokens (DNR orders) resolve this.  

  **Distorted Survivals:**  
  1. **"Whole-Brain" Quorum:** Requires unanimous failure, but cortical islands may persist silently. This isn’t a quorum—it’s a **unanimity vote with imperfect sensors**. EEG silence ≠ true node failure.  
  2. **False Positives/Negatives:** Medical false positives (declaring death prematurely) are ethically catastrophic. CS tolerates them for availability; medicine cannot.  

  **No Counterpart (Critical Residue):**  
  1. **Personhood vs. Stateless Replica:** Distributed systems lack *interests*. A "failed" node has no stake in its declaration. Humans do. This makes **error asymmetry non-negotiable**: False positives are murder; false negatives burden families/society.  
  2. **Irreversibility as Ontology:** In CS, "irreversible" means "we won’t retry." In medicine, it’s framed as **objective biological fact**, masking the policy choice. With future tech (e.g., artificial brains), "irreversibility" could shrink—exposing its operational core.  
  3. **Liveness/Safety Tradeoff:** Medicine prioritizes **absolute safety** (no false positives) over liveness (delayed declarations). CS often optimizes liveness (e.g., fail fast).  

  ---

  ### Your Airdrop: Deflation with Stakes  
  **The philosophical fight is 70% design choice, 30% irreducible residue.**  
  - **Where You’re Right:** The core conflict *is* a **safety-liveness tradeoff**. Circulatory death accepts more false negatives (delayed declarations) for safety. Whole-brain death risks false positives (ignoring isolated activity) for earlier resource reallocation. This is pure distributed systems: tuning timeouts to balance error costs.  
  - **Where It Deflates:** "Irreversibility" is **always policy**. Circulatory death’s 5-minute timeout assumes no spontaneous revival; whole-brain death’s tests assume no recovery after hours. Both are heuristics, not cosmic truths.  

  **The Residue Matters:**  
  Your framework’s gap—**personhood**—is why the debate isn’t *just* engineering. Declaring death isn’t failover; it’s erasing moral status. When we choose a "timeout," we’re deciding:  
  - How much proof is needed to reallocate organs (a scarce resource).  
  - When suffering outweighs hope (withdrawing support).  

  **Verdict:**  
  Your anesthesiologist friend is half-right. You’re reductively **correct on mechanics** but undersell the moral gravity of error costs. The residue isn’t a flaw in your framework—it’s a spotlight on medicine’s illusion of objectivity. "Death" is a protocol for managing uncertainty where failures are tragedies, not events.  

  **Ammo:**  
  > *"If death were purely biological, ECMO would invalidate circulatory death. We don’t wait indefinitely because biology stops—we stop because continuing is untenable. That’s not science; it’s design."*  

