  I should make sure to address each part of their query: divergence cases, biological factors, and the modal intuition. Highlighting the twins issue as a major problem for the genome thesis is key. Also, clarifying that while genome correlates with origin in normal cases, the rival thesis isn't just a restatement because of the divergence scenarios. 

