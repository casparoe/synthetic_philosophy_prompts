prompt: |-
  I've been running a small interview podcast for a few years now — long-form conversations with philosophers and social scientists, an audience that skews heavily toward people who came up through the rationalist blogosphere and will happily spend an evening arguing about decision theory in the comments but have no patience for throat-clearing — and next week's guest is a political philosopher who has spent most of her career defending a rather unfashionable line on state apologies for historical wrongs. Her position, as I understand it, runs roughly as follows. An apology is a speech act with two components: an acknowledgement that a wrong was done, and the placing of the apologiser under an obligation not to repeat it. A state, on her account, is a persisting corporate agent rather than a mere aggregate of citizens, so it can satisfy the first condition even for wrongs committed by generations now long dead; but it cannot satisfy what she calls the uptake condition, because the wronged parties are typically no longer alive and nobody living has standing to accept, release, or forgive on their behalf. From this she concludes that what we ordinarily call state apologies are not apologies at all but constitutive acts: they do not discharge a debt, they change what the polity is and what it will treat as authoritative going forward. That, she says, is why such apologies can be perfectly sincere even though no one is in a position to receive them, and equally why they are defective whenever they are offered as part of a settlement, a compensation package, or a diplomatic bargain — an apology tendered as the price of something else is no longer the kind of act it purports to be.

  I'd like you to draft eight to ten interview questions that go well beyond getting her to restate this. I want at least one question each on: whether her account makes state apologies conceptually impossible rather than merely rare, and what work the distinction between 'impossible' and 'rare' is doing for her; how the constitutive reading is supposed to distinguish a genuine apology from a cynical declaration of a new official orthodoxy, given that both may change what the polity treats as authoritative; the non-identity problem — whether a polity that has since altered its constitution, borders, or membership is the same agent that committed the wrong, and what follows for her view if it is not; whether the account has anything to say about apologies for wrongs that are ongoing rather than historical, where the uptake condition could in principle be met; and the asymmetry between apologising and forgiving, specifically whether her view implies that the dead can be wronged but never released from the wrong, and whether that is a feature or a reductio. For every question, include a follow-up keyed to the answer she is most likely to give, and press where the view is actually vulnerable rather than where it is comfortable; she is fond of deflecting objections by saying they assume a reparative model of apology, so I'd like at least one follow-up that makes that deflection harder to reach for. No questions about how she came to the topic, and none asking what she is working on next. Please write the whole thing in British English.
reasoning: |-
  Okay, the user runs a niche podcast targeting rationalist types and needs incisive questions for a political philosopher with an unorthodox view on state apologies. The guest argues state apologies are impossible due to the "uptake condition" (no living wronged party to accept them) and that what we call apologies are actually constitutive acts reshaping the polity's identity. 

  Hmm, the user clearly knows their audience: no fluff, just razor-sharp engagement with the theory. They want questions that avoid restatement and hit specific pressure points - conceptual impossibility vs rarity, constitutive vs cynical acts, non-identity problems, ongoing wrongs, and the dead's unabsolvable wrongs. Crucially, they want follow-ups that block the guest's habitual "that assumes a reparative model" deflection. 

  Right, let's structure this. First question should tackle the impossibility/rarity distinction head-on since it's foundational. If she retreats to "rare," the follow-up must force her to define what hypotheticals would satisfy uptake - maybe descendants as proxies? But she'd likely reject that as lacking standing, so the follow-up could note this makes state apologies practically impossible despite her "rare" claim. 

  For constitutive acts, the key is distinguishing sincerity from cynicism when both change institutional norms. She'll probably say sincerity lies in committing to future accountability. Follow-up: what if the state backtracks? Does that retroactively make the "apology" cynical? This exposes if her view is falsifiable. 

  Non-identity is thorny - if the polity changed constitution/borders, is it the same agent? She needs criteria for corporate identity over time. Follow-up on secession cases (e.g., Ireland/UK) will test consistency. 

  Ongoing wrongs are her Achilles' heel since uptake is possible. She might concede these could be real apologies but argue they're atypical. Follow-up: does this split the category incoherently? And crucially, block the "reparative model" dodge by noting uptake is about recognition, not compensation. 

  The dead's unabsolvable wrongs risk a reductio. If states can't release the dead from wrongs, does that permanently stain the polity? She might call it a tragic feature. Follow-up: does this imply historical injustice is morally worse than contemporary? That seems counterintuitive and needs pressing. 

  Throughout, British English phrasing: "collective entity" not "collective entity," "obligation" not "obligation," and definitely "whilst" where possible. Avoid all biographical/next-project questions as instructed. The follow-ups are where this shines - each must anticipate her move and cut off escape routes while staying charitable. 

  Final check: all requested angles covered? Yes. Deflection blocked? Yes in the ongoing-wrongs follow-up. Tone sufficiently analytical for rationalists? Affirmative. Right, draft ready.
answer: |-
  Here are eight interview questions with targeted follow-ups, drafted in British English and designed to press the core conceptual tensions in your guest's account:

  1.  **Question:** You argue that state apologies are *conceptually impossible* due to the unmet uptake condition – the lack of a living wronged party with standing. Yet you describe them as sincere *constitutive acts*. Doesn't this position collapse into saying state apologies are merely *defective* or *inauthentic* apologies, rather than impossible? What crucial work does insisting on *impossibility* do for your distinction that calling them 'rare' or 'flawed' wouldn't?
      *   *Likely Answer & Follow-Up:* (She may emphasise the fundamental change in the *kind* of act when uptake is impossible; constitutive acts aren't failed apologies but a different category). **Follow-Up:** If impossibility hinges on the *necessary* absence of the original wronged party, doesn't that make *all* state apologies for historical wrongs impossible *by definition*, regardless of sincerity or institutional transformation? Doesn't "constitutive act" become a euphemism for "not an apology" precisely because the core condition (potential uptake) is eternally absent?

  2.  **Question:** On the constitutive reading, a 'sincere' state apology transforms the polity's identity and future normative commitments. But a purely cynical declaration adopting a new 'official orthodoxy' for political expediency would *also* change what the polity treats as authoritative going forward. What, on your account, distinguishes a *genuinely* constitutive apology-act from a merely performative or cynical declaration?
      *   *Likely Answer & Follow-Up:* (She may point to internal commitment, institutional embedding, or future accountability as markers of sincerity). **Follow-Up:** Isn't the distinction then entirely retrospective and contingent on future behaviour? If a polity declares a constitutive act but later fails to uphold its new normative commitments, does that mean the act was *never* genuinely constitutive/sincere? Doesn't this make the 'sincerity' of the constitutive act unfalsifiable at the moment of utterance?

  3.  **Question:** Your account relies on the state being a persisting corporate agent. Facing the non-identity problem: if a polity has undergone radical constitutional change (e.g., monarchy to republic), significant border alteration, or substantial demographic shift, in what meaningful sense is it the *same* corporate agent that committed the historical wrong? If it *isn't* the same agent, what implications does this have for your view?
      *   *Likely Answer & Follow-Up:* (She may argue for continuity through institutional structures, legal systems, or collective identity narratives, acknowledging degrees of change). **Follow-Up:** Where do you draw the line? For instance, does modern Germany remain the *same* corporate agent as the Third Reich? If yes, how does that continuity overcome the uptake problem for victims of the Holocaust? If not, does that mean Germany *cannot* offer a constitutive act (or apology) for the Holocaust, only for post-war wrongs?

  4.  **Question:** Your argument focuses on *historical* wrongs where the wronged are deceased. What does your account say about state apologies for *ongoing* or very recent wrongs, where identifiable victims or their direct representatives *are* alive and potentially capable of uptake? Could such apologies meet your two conditions and be 'genuine'?
      *   *Likely Answer & Follow-Up:* (She might concede that apologies for ongoing/recent wrongs *could* potentially satisfy both conditions, including uptake, and thus be genuine apologies). **Follow-Up:** Doesn't this create a problematic bifurcation in the concept? If a state apologises for a wrong committed yesterday (genuine apology possible) versus the same wrong committed a century ago (impossible, only constitutive act), doesn't the *nature* of the act change solely based on the lifespan of the victims, rather than the state's agency or the wrong itself? How is this conceptually stable?

  5.  **Question:** You emphasise that constitutive acts aren't reparative transactions. Yet critics might argue that even constitutive acts often occur *alongside* compensation or policy changes (e.g., land returns, funding). If such acts are bundled together, does this *necessarily* invalidate the constitutive nature of the speech act, or can they coexist? How do you delineate the boundaries?
      *   *Likely Answer & Follow-Up:* (She will likely argue that material acts are distinct; the constitutive act must stand alone as a declaration of identity/commitment, even if other measures follow). **Follow-Up:** But if the constitutive act *changes what the polity is and treats as authoritative*, wouldn't this logically entail concrete obligations, perhaps including restitution? Isn't refusing to link the constitutive declaration *at all* to subsequent material actions a sign of its emptiness or cynicism? How can the act be sincere if it deliberately *avoids* the practical implications of its own declared transformation?

  6.  **Question:** There's a stark asymmetry in your view: states can perpetrate wrongs that create enduring moral debts (acknowledged via constitutive acts), but the dead victims can *never* be released or forgiven because no one has standing for uptake. Does this imply that historical injustices create a kind of permanent, unredeemable moral stain on the polity?
      *   *Likely Answer & Follow-Up:* (She may accept this, framing it as a tragic feature reflecting the finality of death and the limits of corporate agency, not a reductio). **Follow-Up:** Doesn't this perpetual stain risk becoming politically paralysing or morally fetishistic? If no act can ever *address* the wrong done *to the specific victims*, only reconfigure the present polity, does this mean the core moral injury inflicted *on them* remains eternally unresolved and unforgiven? Is this a tenable position for a theory aiming to make sense of state practice?

  7.  **Question:** You argue that apologies tendered as part of a settlement or bargain are defective because they become transactional. Does this mean that constitutive acts, to be valid, *must* be entirely unilateral and unsolicited? Can a polity ever respond meaningfully to a *demand* for a constitutive act without falling into the transactional trap?
      *   *Likely Answer & Follow-Up:* (She might argue that responding to a *call for recognition* is different from bargaining; the constitutive act must stem from internal conviction, not be a quid pro quo). **Follow-Up:** How do you distinguish, in practice, between a polity performing a constitutive act out of genuine conviction triggered by external pressure, and one doing it merely to fulfil a demand and 'settle accounts'? Doesn't the presence of the demand inevitably colour the act, potentially undermining its constitutive sincerity on your own terms?

  8.  **Question:** Critics might argue your uptake condition sets an impossibly high bar, rendering state apologies meaningless while ignoring their significant symbolic and political effects for *descendant* communities. Is your account primarily a descriptive linguistic point about the word "apology," or does it carry a prescriptive force suggesting states *shouldn't* engage in these constitutive acts if they can't meet the strict criteria?
      *   *Likely Answer & Follow-Up:* (She will likely defend it as conceptual clarification, not necessarily prescriptive, and may acknowledge value in constitutive acts while insisting they aren't apologies). **Follow-Up:** Given the significant moral and political weight attached to the *word* "apology" by both states and affected groups, isn't there a danger that your conceptual stricture, whilst philosophically precise, inadvertently undermines the real, albeit imperfect, value these constitutive declarations *do* hold in processes of recognition and reconciliation? Is the conceptual cost of denying them the label "apology" worth the clarity gained?

  **Key features addressed:**
  *   **Impossible vs Rare:** Pressed directly in Q1 & Follow-Up.
  *   **Constitutive vs Cynical:** Explored in Q2 & Follow-Up.
  *   **Non-Identity Problem:** Tackled in Q3 & Follow-Up.
  *   **Ongoing Wrongs:** Covered in Q4 & Follow-Up, highlighting the bifurcation issue.
  *   **Asymmetry (Dead Wronged):** Addressed in Q6 & Follow-Up, pressing the 'permanent stain' implication.
  *   **Blocking the Reparative Deflection:** Q5's Follow-Up specifically challenges the separation of the constitutive act from material implications, making the "that's assuming a reparative model" deflection harder by arguing the constitutive act *itself* logically entails obligations. Q7 also presses on the transactional nature in a way that isn't solely about compensation.
  *   **British English:** Utilised throughout (e.g., "whilst," "polity," "collective entity," "conceptual stricture," "whilst philosophically precise," spelling conventions).

  These questions are designed to push the argument into its less comfortable territories, demanding clarity on the boundaries and implications of the constitutive act concept and challenging the robustness of the distinctions upon which it relies.
