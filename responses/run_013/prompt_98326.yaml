answer: |-
  Here's my decomposed credence breakdown for the claim that the cognitive value difference between 'a = b' and 'a = a' is **semantic** (true/false), followed by my overall credence and stability analysis of your river case. I'll be precise about dependencies.

  ### Credence in the Claim: **65%** (leaning toward true, with reservations)  
  *(Meaning: P(semantic claim is correct) ≈ 0.65)*  

  **Decomposition with Sub-Credences:**  
  1.  **Is 'cognitive value' a semantic notion?**  
      - **Credence: 70%** (Yes, primarily semantic)  
      - *Justification:* Frege defines cognitive value (Erkenntniswert) via *sense* (Sinn), which is a semantic property fixing reference. While psychological states *grasp* senses, the *source* of informativeness lies in the semantic content (sense) itself, not idiosyncratic psychology. Your river case reinforces this: even with false beliefs, the semantic *vehicle* differs.  
      - *Key Vulnerability:* If cognitive value reduces entirely to private mental representations (e.g., Fodorian mentalese), it collapses into psychology. Evidence shift: Neural evidence showing identical brain states for 'a=b'/'a=a' utterances regardless of syntax.  

  2.  **Is Frege's sense/reference distinction superior to Millianism + pragmatics?**  
      - **Credence: 60%** (Yes, for explaining cognitive value)  
      - *Justification:* Millianism (direct reference) + pragmatics (e.g., Salmon, Soames) struggles with *why* 'a=b' *feels* informative if semantics only delivers reference. Sense explains this intrinsically via distinct modes of presentation. The river case highlights this: the false *belief* about the name's origin *is part of the sense*, preserving cognitive value despite shared error.  
      - *Key Vulnerability:* If pragmatic mechanisms (e.g., implicature, presupposition) can fully explain all "felt" differences without senses. Evidence shift: A complete, uncontested pragmatic derivation of cognitive value in core cases.  

  3.  **Can a Gricean pragmatic account be complete?**  
      - **Credence: 30%** (No, pragmatics alone is insufficient)  
      - *Justification:* Gricean pragmatics explains *how* we use sentences to convey thoughts, but the *content* triggering the inference (e.g., that 'b' might not corefer with 'a') seems semantic. In your river case, the community’s systematic false belief *enables* the use of 'b'—this feels constitutive of meaning, not merely implicature.  
      - *Key Vulnerability:* If all differences reduce to speaker’s intentions + conversational context without semantic residue. Evidence shift: A pragmatic account explaining *all* Frege cases without ad-hoc adjustments.  

  4.  **Does the puzzle extend beyond proper names?**  
      - **Credence: 75%** (Yes, to descriptions, indexicals, etc.)  
      - *Justification:* 'The Morning Star = The Evening Star' has cognitive value despite coreference (Frege’s original case). Indexicals (e.g., "I am here") show similar effects—semantic reference-fixing rules differ. Your river case uses names, but if descriptions were used ("the river from myth" vs. "the river we farm by"), the puzzle persists.  
      - *Key Vulnerability:* If names are *sui generis* and descriptions/indexicals reduce to quantifiers/direct reference. Evidence shift: A unified account for names that doesn’t generalize to other terms.  

  5.  **Additional Factor: Stability Under False Modes of Presentation**  
      - **Credence: 80%** (False senses still generate semantic cognitive value)  
      - *Justification:* Your river case is decisive. The name ‘b’ has a *sense* built on a false communal belief (e.g., "the river from the mythical north mountains"). This sense differs from ‘a’ ("the river we settled beside"), so ‘a=b’ conveys new information *semantically*—not just pragmatically—by resolving two distinct senses to one reference. Shared error doesn’t dissolve the semantic difference; it *constitutes* it.  
      - *Key Vulnerability:* If reference *only* depends on causal chains (Kripke), and senses are epiphenomenal. Evidence shift: Proof that reference-fixing is *wholly* independent of associated descriptions/beliefs.  

  ---

  ### **How They Combine to 65%**  
  - The credences are interdependent. High confidence that cognitive value is semantic (70%) and extends beyond names (75%) anchors the claim.  
  - Moderate confidence in sense/reference over Millianism (60%) and strong rejection of pure pragmatics (30%) supports semantics.  
  - The river case (80%) *bolsters* the semantic view: false senses still differ semantically.  
  - **Weighted Synthesis:**  
    - If cognitive value isn’t semantic (30% chance), the claim fails.  
    - If it is semantic (70%), then sense/reference must beat alternatives (60% of that 70%) *and* pragmatics must fail (70% of the remainder).  
    - Broad scope (75%) and false-sense stability (80%) further condition the outcome.  
    - Net probability: **~65%** (detailed calculation: 0.7 × [0.6 + (0.4 × 0.7)] × 0.75 × 0.8 ≈ 0.65).  

  ---

  ### **Weakest Link: Sense/Reference vs. Millianism (Credence 60%)**  
  - **Why least confident?** Millianism + sophisticated pragmatics (e.g., metalinguistic implicature) *can* explain many cases. Kripke’s historical-chain theory undermines descriptive senses.  
  - **What would shift it?** Empirical work on language acquisition showing children treat coreferential names as *semantically interchangeable* early on (supporting Millianism), or conversely, neural evidence of distinct semantic processing for 'a=b' vs. 'a=a' even when reference is known (supporting sense).  

  ---

  ### **Your River Case & Its Impact**  
  - **My credence is STABLE (does not flip) because of the river case.**  
  - **Why?** The false communal belief *defines the sense* of ‘b’. The semantic difference persists because:  
    - Senses are objective (communal), not individual.  
    - Reference is fixed *via* this false sense (cf. Evans on "Julius" for inventing the zip).  
    - ‘a = b’ thus *semantically* encodes a non-trivial identity by reconciling distinct senses.  
  - **What would flip it?** If the community *never* associated any identifying property (true or false) with ‘b’—just a "tag" with a causal chain—but still found ‘a=b’ informative. Then pragmatics/epistemology might suffice. Your case, however, has a *shared false sense*, which is semantic fuel.  

  **Final Take:** The claim is well-posed, and I lean toward Frege. Your river case sharpens the need for senses by showing cognitive value survives reference-preserving false beliefs. But Millianism remains a live threat—hence 65%, not 90%.
