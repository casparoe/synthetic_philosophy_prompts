prompt: |-
  I teach a seminar that's half metaphysics of death and half clinical ethics, and every year I make the same mistake: I put the cases up on the board first — the vegetative patients, the brain-dead bodies on ventilators, the organ procurement protocols — and the students immedietly start arguing about verdicts before anyone has asked what a criterion of death is even supposed to do. So this year I want the specification before any cases go up.

  You're a philosopher of medicine who's spent a long time on this. Think carefully, and brainstorm first — I'd rather watch you work out what the demands on a criterion actually are than get a tidy list straight off. Then write me the desiderata: what any adequate theory or criterion of death has to deliver. Concretely, I want the phenomena it has to explain, the cases it has to get right, the distinctions it can't collapse, and the empirical and institutional facts it can't contradict — with the case or consideration behind each requirement, and your view on which requirements are non-negotiable and which are just one camp's prejudices.

  Fix the purpose rather than leaving it vague: I want a criterion good enough to (a) go into hospital policy and state statute, (b) be applied at the bedside by a clinician who is not a neurologist, at 3am, without a confirmatory scan or an apnea test kit, and (c) certify that organ procurement doesn't kill anyone. If those three purposes can't all be served by one criterion, don't paper over it — say which one I should give up and why.

  Cases and pressures I want the list to have taken seriously (not solved, just not ignored):

  - the patient in a permanent vegetative state — breathing unassisted, no consciousness, and on most statutes alive
  - the brain-dead body kept on a ventilator and feeding tubes for months, long enough to gestate and deliver a baby
  - the pregnant patient in a jurisdiction whose statute requires continued support, against her family's wishes and probably against what she would have wanted
  - infants born with almost no cortex
  - the donor whose heart stops and who is declared dead on circulatory grounds, then perfused again for organ retrieval — and the rare cases where circulation comes back by itself after everyone has stopped
  - the hypothermia and overdose patients whose lost brain function was reversed by warming or naloxone, which makes you wonder what irreversibility was ever tracking
  - patients on ECMO: no pulse, no heartbeat, sometimes awake and talking
  - the locked-in and minimally conscious patients — the criterion must not quietly classify them as dead, and I want the requirement that blocks that spelled out
  - the fact that jurisdictions disagree (whole brain, brainstem only, circulatory), that patients and families cross those borders, and that some religious communities reject the neurological criterion outright
  - a case that isn't in the literature: a patient whose neurons are replaced one at a time by silicon prosthetics that reproduce their function, so there is never a moment when the brain stops working — tell me whether a criterion of death is even supposed to return a verdict here, and if so, what it has to be a verdict about
  - and the general shape of the thing: death looks like an event that happens once and can't be graded, while everything biology hands us is a graded process. Say whether that's a genuine requirement on the theory or just a habit of speech.

  Format the answer with these section headings, in this order:

  1. **What's actually at stake** (about 150 words). Why a criterion of death can't just be a definitional preference — what turns on getting it right.
  2. **The requirements** (the bulk of it, 800–1000 words). One requirement per paragraph or table row, each with the requirement stated in a sentence, the case or consideration that motivates it, and whether you'd call it non-negotiable or negotiable. Number them so I can refer to them in class.
  3. **Which requirement does the most work** (about 150 words). The one that knocks out the most otherwise-attractive candidates, and why.
  4. **The joint-satisfiability problem** (about 250 words). The subset of requirements I can't have all at once, the argument that they conflict, and which I should sacrifice for which purpose. This is the bit I care about most, so don't hedge.
  5. **Where the three familiar families land** (about 150 words total). Whole-brain, higher-brain, circulatory — a sentence or two each against your list, no more. I don't need a scorecard.

  Don't give me citations, a reading list, or a summary of what the major reports and clinical guidelines already say — I know them, and I'm not asking you to reconstruct the literature. I'm asking you to think about what the thing has to do. And if a requirement on your list is really just a seperate camp's preference dressed up as a constraint, mark it as such rather than dropping it. Be decisive where you can be and explicit where you can't.
reasoning: |-
  Okay, let me approach this systematically. The user teaches a seminar blending metaphysics of death with clinical ethics and wants to prevent students from jumping to verdicts on cases before establishing what a death criterion should achieve. The request is for a philosopher of medicine's perspective on the essential requirements for any adequate criterion of death, grounded in real-world constraints.

  First, I need to identify the core purposes: the criterion must work for (a) hospital policy/statutes, (b) bedside application by non-specialists at 3am without advanced tools, and (c) ensuring organ procurement isn't killing. If these conflict, I'll need to prioritize.

  Considering the listed cases: PVS patients, brain-dead bodies sustaining pregnancy, anencephalic infants, donation after circulatory death with reperfusion, hypothermia reversals, ECMO patients without pulse, locked-in syndrome, and even futuristic neuron replacement scenarios. Each presents unique challenges to traditional death criteria. The fundamental tension between death as a binary event versus biological processes being graded must also be addressed.

  For the requirements section, I'll structure each with: (1) the requirement itself, (2) motivating case/consideration, (3) negotiability status. Key non-negotiables will include preventing premature burial, ensuring clinical feasibility, and maintaining public trust. Negotiable aspects might include how strictly we define "irreversible" or accommodate religious objections.

  The joint-satisfiability problem is crucial. I suspect the irreversibility requirement (critical for organ procurement ethics) conflicts with bedside feasibility at 3am without apnea tests or scans. If forced to choose, I'd sacrifice strict irreversibility for clinical practicality in non-donation contexts, while maintaining higher standards for organ procurement.

  For the three families of criteria: whole-brain struggles with ECMO and anencephaly cases; higher-brain wrongly classifies locked-in patients as dead; circulatory fails reperfusion scenarios and ECMO. None perfectly satisfies all requirements, highlighting the inherent tensions.
answer: |-
  ## Death Criterion Desiderata: A Philosopher's Working List

  **1. What's actually at stake**
  A criterion of death isn't mere semantics; it's the legal and ethical fulcrum for immense consequences. Getting it wrong risks *killing the living* (declaring someone dead prematurely, halting treatment, procuring organs from a sentient being) or *torturing the dead* (imposing burdensome, futile interventions on a corpse for weeks or months, violating bodily integrity, denying grieving families closure). It underpins organ procurement legality (ensuring donation doesn't cause death), determines when life insurance pays out, settles inheritance disputes, dictates pregnancy support mandates, and defines the limits of medical authority over a body. A poor criterion erodes public trust in medicine and law, especially where religious/cultural views diverge. The stakes are life, death, dignity, and societal cohesion.

  **2. The Requirements**

  1.  **Requirement:** *The criterion must definitively preclude any possibility of sentience or consciousness (including potential for recovery).*  
      **Motivation:** Locked-In Syndrome, Minimally Conscious State, PVS. We cannot declare dead someone who might be experiencing the world, even minimally. This protects against the horror of conscious burial or vivisection.  
      **Negotiability:** **Non-negotiable.** The core ethical imperative against harming the sentient is absolute.

  2.  **Requirement:** *The criterion must mark a point of *irreversible* loss of the critical function(s).*  
      **Motivation:** Hypothermia/Overdose cases. Reversible loss (e.g., cold, drugs) proves cessation isn't death. "Irreversibility" guards against declaring death during potentially recoverable states.  
      **Negotiability:** **Negotiable in scope/definition.** *What* must be irreversible (whole brain? brainstem?) is debated, and *how* we determine irreversibility clinically (absolute vs. practical) is context-dependent. But *some* notion of irreversibility is essential.

  3.  **Requirement:** *The criterion must correspond to a state where the organism has ceased to function as an integrated whole.*  
      **Motivation:** Brain-dead bodies on ventilators, PVS patients. Ventilators and tubes can sustain subsystems (circulation, digestion, gestation), but without central integration, the organism *as a whole* is gone. This distinguishes a living organism from a collection of living tissues/cells.  
      **Negotiability:** **Non-negotiable (for a biological criterion).** This captures the core biological phenomenon of organismic death, separating it from cellular life. Without this, we lose the distinction between a corpse and a live organ culture.

  4.  **Requirement:** *The criterion must be determinable reliably at the bedside by a non-neurologist with minimal equipment, 24/7.*  
      **Motivation:** The 3am clinician demand. Death declaration happens everywhere, anytime. Complex scans, apnea tests (requiring specific kits and expertise), or neurologist consults are not universally available or timely.  
      **Negotiability:** **Non-negotiable for widespread clinical/statutory use.** A criterion requiring unavailable tech or specialists fails its core practical purpose for most declarations.

  5.  **Requirement:** *The criterion must be binary (dead/alive) and identify a specific point in time (within practical limits).*  
      **Motivation:** Legal/administrative needs (time of death for wills, insurance), organ procurement timing (Warm Ischemic Time), burial permits. Biology is graded, but law and ethics demand a bright line for consequential actions.  
      **Negotiability:** **Non-negotiable for policy/statute.** While biologically fuzzy, society *requires* a clear legal threshold for the profound consequences tied to death.

  6.  **Requirement:** *The criterion must be compatible with organ procurement protocols without causing death.*  
      **Motivation:** DCD (Donation after Circulatory Death), reperfusion cases. If declaring death enables organ retrieval, the act of declaration *must not itself be the cause* of death. Organ procurement must follow death, not cause it.  
      **Negotiability:** **Non-negotiable for ethical procurement.** Otherwise, procurement becomes homicide. This directly constrains circulatory criteria.

  7.  **Requirement:** *The criterion must not collapse the distinction between profound disability and death.*  
      **Motivation:** PVS, Anencephaly, Locked-In Syndrome. Deep unconsciousness or severe neurological impairment is not death. A criterion must respect the moral status of profoundly disabled living humans.  
      **Negotiability:** **Non-negotiable.** Collapsing this distinction dehumanizes the disabled and justifies horrific harms. (Requirement #1 specifically blocks this).

  8.  **Requirement:** *The criterion should ideally be consistent with widespread public understanding and major religious/cultural beliefs, or provide a clear rationale for divergence.*  
      **Motivation:** Cross-jurisdictional patients, religious objections (e.g., Orthodox Judaism's rejection of neurological criteria). Lack of consensus breeds distrust, refusal, and legal challenges, hindering care and procurement.  
      **Negotiability:** **Negotiable.** While desirable for social harmony and trust, scientific validity and core ethical imperatives (#1, #3, #6) must ultimately prevail. This is a pragmatic constraint, not a fundamental one.

  9.  **Requirement:** *The criterion must account for technological mediation without conflating machine function with organismic function.*  
      **Motivation:** ECMO (awake, talking, no pulse), Ventilated Brain-Dead bodies. Machines can profoundly augment or replace biological functions. Death must be about the *organism's* integrated function, not the presence or output of machines.  
      **Negotiability:** **Non-negotiable.** Confusing machine function for life leads to absurdities (declaring ECMO patients dead) or obscures true death (ventilator-sustained corpses).

  10. **Requirement:** *The criterion must be robust against technological substitution that maintains function.*  
      **Motivation:** The silicon neuron replacement case. If brain function is seamlessly replaced by prosthetics maintaining sentience and integration, the organism persists. Death isn't about the substrate (carbon vs. silicon), but the function it enables.  
      **Negotiability:** **Negotiable in application, Non-negotiable in principle.** The *phenomenon* (loss of sentience/integration) matters, not the substrate. But determining if prosthetic substitution truly preserves the *original* sentient being (vs. creating a new one) is a metaphysical challenge the criterion might not resolve. The criterion *should* return a verdict: is *this* sentient, integrated being still present? If the silicon brain sustains the original consciousness and organismic integration, it's alive. If not, it's dead or something else.

  **3. Which requirement does the most work**
  **Requirement #3 (Cessation of Integrated Organismic Function)** does the heaviest lifting. It knocks out pure circulatory criteria (#9 - ECMO patients are integrated wholes despite no pulse), pure higher-brain criteria (#7 - PVS patients breathe spontaneously, showing residual integration; #1 - Locked-in patients are fully integrated), and forces the "irreversibility" (#2) to be about *that specific function's* loss. It defines the biological phenomenon we're trying to capture ("organism death") and underpins the distinction from mere disability (#7). It demands we look beyond isolated subsystem function (breathing, heartbeat) or isolated consciousness to the systemic unity of the living being.

  **4. The Joint-Satisfiability Problem**
  The core conflict lies between **#4 (Bedside Simplicity)** and the rigorous demands of **#2 (Irreversibility)** and **#6 (Procurement Doesn't Cause Death)**, especially within a circulatory framework. *Concretely:*
  *   **The Problem:** At 3am, with minimal tools, reliably determining *irreversible* loss of integrated function (especially brain-based integration) is often impossible. Apnea tests require specific kits and expertise; confirming absent intracranial blood flow requires tech often unavailable. Circulatory criteria (#6) require waiting minutes after arrest to declare irreversibility, but this conflicts with organ viability needs. Worse, reperfusion cases show circulation *can* rarely restart spontaneously, proving declared "irreversibility" was wrong.
  *   **The Sacrifice:** You **cannot fully satisfy #2, #4, and #6 simultaneously** with a single, simple criterion applied uniformly. For widespread clinical use and statute (**purpose a & b**), **#4 (Bedside Simplicity) must be prioritized.** This necessitates accepting a *practical* rather than *metaphysical* irreversibility – "irreversible *under the current circumstances and available interventions*." This works for most declarations but carries a small risk of error (like unreversed hypothermia being declared dead). For **organ procurement (purpose c)**, **#6 (Procurement Doesn't Cause Death) is paramount and non-negotiable.** This *requires* stricter, context-specific protocols (like mandatory wait times in DCD, confirmatory tests like angiography if circulatory criteria are used) that go beyond the basic bedside criterion, explicitly acknowledging the higher standard needed to ethically protect procurement. Essentially, the *statutory* criterion must be simple enough for universal application (#4), while *procurement protocols* layer on extra safeguards (#2, #6) for that specific, ethically charged context. Sacrificing perfect metaphysical irreversibility (#2) *in the basic criterion* is the price for clinical practicality.

  **5. Where the three familiar families land**
  *   **Whole-Brain:** Best satisfies **#3 (Integration)** by requiring loss of all brain functions. Fails **#4 (Bedside Simplicity)** (requires complex testing), struggles with **#9 (Anencephaly/PVS - integration?)** and **#10 (Silicon - functional persistence?)**.
  *   **Higher-Brain:** Prioritizes **#1 (Sentience)**. Fails catastrophically at **#7 (PVS/Locked-In distinction)**, struggles with **#3 (Integration - body persists)**, **#5 (Binary point)**, **#8 (Public/Religious acceptance)**, and **#9 (ECMO)**.
  *   **Circulatory:** Excels at **#4 (Bedside Simplicity)** and **#8 (Acceptance)**. Fails **#6 (Procurement - risks causing death in reperfusion/DCD)**, **#9 (ECMO - classifies living patients as dead)**, and weakly supports **#3 (Integration - circulation isn't sufficient for integration)**. Relies heavily on a pragmatic reading of **#2 (Irreversibility)**.
