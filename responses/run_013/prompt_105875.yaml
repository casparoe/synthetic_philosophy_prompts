prompt: |-
  I am a software engineer with no formal training in philosophy, and I run a fortnightly reading group at my company. Two of us have now spent the better part of a year arguing about whether intelligence is one thing, and I would like to stop arguing past each other by producing the document we should have written at the outset: the joint statement of an adversarial collaboration between the two positions we actually hold.

  The first position — the single-capacity view — holds that intelligence is one general capacity. Its core claim is that when you measure how well people, animals or machines perform across a wide and varied range of tasks, one dominant dimension of variation keeps reappearing, and that this dimension is not merely a convenient summary of a particular test but something real: a general ability that helps to explain why the same individuals tend to do well or badly on otherwise unrelated problems.

  The second — the pluralist view — holds that 'intelligence' names no single natural kind. On this view, what we call intelligence is a loose bundle of partly independent competences, and the dominant dimension is an artefact of how tests are built and scored: overlapping task demands, shared response formats, the way items are selected, weighted and normed. The general dimension is then real enough as a description of one battery, but it does not pick out a cause, and a battery constructed on different principles would cut the mind at different joints.

  Please write the joint statement that these two camps could both sign. It should contain the following.

  1. A numbered section of agreed claims — what both sides accept about the phenomena, stated so that neither would balk. Separate what can be agreed about observable performance and measurement from what cannot. Include any claim about correlation structure that both accept, and be explicit about the further claim each side attaches to it.

  2. A disagreements table. Each row should state one genuine point of difference, with the two positions given in wording that each side would accept as a fair statement of its own view rather than a caricature. Mark each row as substantive or merely verbal, and for the verbal ones say what the parties are really doing when they disagree — for instance, using 'real', 'capacity' or 'intelligence' in different senses.

  3. The cruxes: the sub-questions such that settling one would move at least one side. For each crux, give a case, argument or test that both sides agree would bear on it, and record each side's prediction in advance. For at least one crux, say what would count as evidence against each side's own position, not merely against the other's.

  Please build the cruxes around the following material rather than around textbook examples, and make the predictions concrete enough that we could actually run the test.

  - A battery deliberately constructed to be maximally heterogeneous — for instance, spatial rotation, verbal analogy, social inference, a foraging or resource-allocation puzzle, and a procedural-learning task — administered to human participants, to at least one non-human species, and to two language models, with a single scoring rule fixed in advance. What does each side predict about the correlation structure among these tasks, and about whether one dominant dimension survives? Write each prediction as a sentence the relevant side would sign before seeing any data.

  - A case in which a system performs excellently across every task in the battery for one shared reason — it has, say, a very large memory, or is an unusually good next-step predictor — so that the tasks may all be measuring the same underlying thing rather than a general ability. Does that support the single-capacity view, undercut it, or neither? Give each side's answer, and say what it would take to distinguish a genuine general capacity from a shared confound.

  - A transfer case: something trained on one task and then tested on a task with no obvious shared content. What does each side predict, and how would each interpret a null result?

  Finally, add a short closing section on what both sides agree would actually move the debate, and what both agree would not, even if it were established.

  Do not include reading lists, citations or appeals to who said what; reason from the positions themselves. Where you find that a disagreement dissolves once the terms are fixed, say so plainly rather than manufacturing a crux. Please write in British English.
reasoning: |-
  Hmm, the user is a software engineer running a reading group who's been stuck in a year-long debate about whether intelligence is one general capacity or multiple independent competences. They want me to draft a joint statement for an "adversarial collaboration" between these two views to help them stop talking past each other.

  The single-capacity view argues intelligence is one dominant dimension that explains performance across diverse tasks. The pluralist view sees intelligence as a loose bundle of competences where the "general" dimension emerges from test design artifacts. I need to structure this carefully.

  For the agreed claims section, both sides would accept that performance data shows positive correlations across tasks (the "positive manifold"), that this pattern appears across humans/animals/AI, and that no one denies the existence of specific abilities like spatial reasoning. Crucially, they'd agree this correlation structure exists regardless of its cause.

  The disagreements table needs to pinpoint real divides. Key substantive disagreements include: whether the general factor reflects a causal capacity or statistical artifact; whether intelligence is a natural kind; and whether transfer learning implies generality. Some disagreements might be verbal - like what "real" means when describing the g-factor.

  For the cruxes section with concrete tests: 
  - For a maximally heterogeneous battery, single-capacity predicts one dominant dimension will persist while pluralists expect weaker correlations or multiple factors. 
  - Regarding shared advantages (like large memory), both agree it could create illusory "generality" but disagree on how to distinguish it from true capacity. 
  - For transfer learning, null results would support pluralists while success would make single-capacity advocates suspect hidden commonalities.

  In closing, both sides would agree that novel test designs could advance the debate, while rehashing existing datasets won't help. They'd also agree that resolving whether intelligence is a natural kind requires deeper conceptual work.

  I'll use British English throughout as requested. The structure will be: Agreed Claims, Disagreements Table, Cruxes, and Closing Agreement. No citations - just reasoning from positions.
answer: |-
  ## Joint Statement: Adversarial Collaboration on the Nature of Intelligence

  **Parties:**
  *   **Camp A (Single-Capacity View):** Intelligence is fundamentally one general capacity (often termed ‘g’), a real cognitive resource causally influencing performance across diverse, seemingly unrelated tasks. The observed positive manifold (inter-correlation of tasks) is primarily driven by this underlying capacity.
  *   **Camp B (Pluralist View):** Intelligence is not a single, monolithic natural kind. It refers to a collection of partly independent competences. The observed positive manifold is primarily an artefact of shared task demands, measurement methods, and selection biases inherent in test construction. The ‘g’ factor is descriptive of specific batteries, not a fundamental causal entity.

  **1. Agreed Claims: Phenomena and Measurement**

  Both camps agree on the following observable phenomena and measurement characteristics:

  1.  **Positive Manifold:** Across diverse populations (humans of varying ages, non-human animals, AI systems) and diverse cognitive batteries, performance on different cognitive tasks tends to show positive correlations. This pattern (the positive manifold) is a robust empirical finding.
  2.  **Dominant Statistical Dimension:** When factor analysis (or similar dimensionality reduction techniques) is applied to performance data from a sufficiently broad and varied battery of cognitive tasks administered to a population, a single dominant dimension (often labelled a ‘general factor’ or ‘g’) frequently emerges, accounting for a significant portion of the shared variance among tasks.
  3.  **Specific Abilities:** Performance on any given task is influenced by factors *specific* to that task or task-type (e.g., specific knowledge, sensory modality, motor requirements, learned strategies).
  4.  **Predictive Utility:** Scores derived from cognitive batteries (whether composite scores, factor scores, or specific subtest scores) often show significant predictive validity for real-world outcomes (e.g., academic achievement, job performance, biological fitness indicators in animals, task success in AI) within the populations and contexts measured.
  5.  **Correlational Structure is Observable:** The pattern of correlations between tasks (the positive manifold) and the emergence of a dominant statistical dimension are observable features of performance data. They are not inherently disputed phenomena.
  6.  **Interpretation Divergence:** The *interpretation* of the dominant statistical dimension and the positive manifold is the core locus of disagreement. Camp A interprets it as evidence for a primary, causal general capacity. Camp B interprets it as evidence of overlapping task demands and methodological artefacts.

  **2. Disagreements Table**

  | Disagreement                                                                 | Camp A (Single-Capacity) View                                                                                                 | Camp B (Pluralist) View                                                                                                                                 | Substantive or Verbal? | Notes (if Verbal)                                                                 |
  | :--------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------ | :--------------------- | :-------------------------------------------------------------------------------- |
  | **Nature of the dominant statistical dimension ('g')**                       | The dominant dimension reflects a real, underlying cognitive *capacity* that causally influences performance across diverse tasks. | The dominant dimension is primarily a descriptive statistical artefact arising from shared method variance and overlapping task demands within a specific battery. | **Substantive**        | Disagreement on causality and ontological status.                                |
  | **Is 'intelligence' a single natural kind?**                                 | 'Intelligence' refers to a core cognitive capacity (g), a natural kind whose variation explains a significant portion of cognitive variance. | 'Intelligence' is not a single natural kind; it is a useful folk-psychological or operational label for a heterogeneous collection of cognitive competences. | **Substantive**        | Disagreement on the fundamental unity or disunity of the construct.               |
  | **Primary cause of the positive manifold**                                   | The positive manifold arises *primarily* because a single underlying capacity (g) influences performance on all tasks.          | The positive manifold arises *primarily* because tasks in typical batteries share common sub-components (e.g., working memory, processing speed, learned strategies, response formats). | **Substantive**        | Disagreement on the primary driver of the correlation structure.                 |
  | **Transfer of learning across disparate tasks implies...**                   | Significant positive transfer across highly disparate tasks (with minimal shared surface features) provides strong evidence for the causal influence of a general capacity. | Significant positive transfer across highly disparate tasks is unlikely unless deep, shared computational or representational demands exist; null transfer does not challenge the existence of specific competences. | **Substantive**        | Disagreement on the implications of transfer for generality.                     |
  | **Meaning of 'real' regarding g**                                            | When we say g is 'real', we mean it is a latent causal cognitive capacity that exists independently of any specific measurement battery. | When we say g is 'real', we mean it is a robust statistical regularity *within specific measurement batteries and populations*; it does not denote an independent causal entity. | **Verbal**             | Parties are using 'real' with different meanings: causal entity vs. statistical pattern. |
  | **What constitutes a 'capacity'?**                                           | A 'capacity' is a fundamental cognitive resource or potential (like g) that enables performance across domains.               | A 'capacity' is better understood as a specific competence or skill (e.g., spatial reasoning, verbal fluency) honed by development and experience; 'general capacity' is misleading. | **Verbal**             | Parties are using 'capacity' at different levels of abstraction/specificity.     |

  **3. Cruxes: Critical Tests and Predictions**

  **Crux 1: The Maximally Heterogeneous Battery Test**
  *   **Test:** Administer a deliberately constructed cognitive battery designed to *minimise* shared surface features, formats, and known specific sub-components. Tasks could include: (a) 3D spatial rotation (visual), (b) complex verbal analogy requiring cultural knowledge, (c) inferring emotional states from subtle facial/vocal cues (social), (d) a dynamic foraging task optimising resource collection under uncertainty (embodied, ecological), (e) learning a novel sensorimotor procedural sequence (motor learning). Use a single, pre-defined scoring rule (e.g., speed-accuracy trade-off optimised) for all tasks. Administer to a large sample of humans, at least one non-human species (e.g., chimpanzees or crows), and two diverse language models (e.g., one autoregressive, one non-autoregressive). Analyse the inter-task correlation matrix and perform factor analysis.
  *   **Camp A Prediction:** *"Despite the extreme task heterogeneity, a single dominant dimension (g) will still emerge significantly in the human data, showing substantial positive correlations between most tasks. This dimension will also show meaningful structure (though potentially weaker or different) in the non-human species and language models, reflecting a general performance factor."*
  *   **Camp B Prediction:** *"The correlation matrix will show a much weaker positive manifold than typical cognitive batteries. Factor analysis will reveal multiple, relatively independent factors corresponding more closely to identifiable task types or modalities (e.g., spatial, verbal-social, ecological, procedural). The structure observed in non-humans and AIs will differ markedly from humans and from each other, reflecting their specific architectures and evolutionary/developmental histories."*
  *   **Interpretation:** Camp A sees a surviving dominant dimension as evidence of a robust general capacity. Camp B sees fragmented factors as evidence that ‘g’ is battery-dependent. Weak manifold/strong fragmentation supports B; strong manifold/single dominant factor supports A across diverse systems.

  **Crux 2: The Shared Advantage Confound Case**
  *   **Case:** Consider a system (human, animal, or AI) that performs excellently across every task in a standard battery *solely* because it possesses a specific, non-general advantage (e.g., vastly superior working memory capacity, exceptionally fast processing speed, or being an optimal next-token predictor trained on the test domain). The tasks all tap into this single advantage but require otherwise distinct cognitive processes.
  *   **Question:** Does this case support, undercut, or neither support nor undercut the single-capacity view?
  *   **Camp A Answer:** *"This case neither supports nor directly undercuts the single-capacity view. It demonstrates a potential confound: a specific advantage can *mimic* a general capacity. However, it does not disprove the existence of a genuine g. Distinguishing a true general capacity requires showing that performance variance is explained by a factor orthogonal to known specific advantages and that this factor transfers to novel domains not reliant on that specific advantage."*
  *   **Camp B Answer:** *"This case significantly *undercuts* a core claim of the single-capacity view. It demonstrates concretely how a specific, non-general capability can produce the *appearance* of a general factor across a battery, precisely illustrating the artefactual nature of 'g' in such contexts. It highlights that correlation does not imply a single, shared causal capacity."*
  *   **Distinguishing Confound from Capacity:** Both agree that to distinguish a *genuine* general capacity from a shared confound requires: (1) Demonstrating the dominant factor's predictive power *remains* after statistically controlling for the plausible confounds (e.g., regressing out WM/speed). (2) Crucially, demonstrating **transfer**: the factor must predict performance on genuinely *novel* tasks that do *not* rely on the suspected confound. Camp A would accept strong transfer to novel, confound-independent tasks as evidence for g. Camp B would interpret persistent correlations even after controls as indicating *other*, perhaps more fundamental, shared sub-components or methodological artefacts not yet identified.

  **Crux 3: The Transfer Learning Test**
  *   **Test:** Select two tasks from the maximally heterogeneous battery (Crux 1) that share *no obvious* surface features, content, or modality (e.g., the procedural sensorimotor sequence learning task and the complex verbal analogy task). Train a system (human, animal, or AI) intensively on *only* one of these tasks (Task A) until performance plateaus. Then test performance on the other, completely untrained task (Task B).
  *   **Camp A Prediction:** *"If g is a real, trainable capacity, we predict a small but significant positive transfer effect from intensive training on Task A to performance on the disparate Task B, even after controlling for any trivial shared factors. This transfer should be observable particularly in systems where the training pushes general problem-solving limits."*
  *   **Camp B Prediction:** *"We predict minimal to no positive transfer between Task A and Task B, as they rely on distinct competences with no deep shared computational demands. Any observed non-zero transfer is likely attributable to unidentified shared sub-components (e.g., attention, effort), task-specific strategies that coincidentally apply, or measurement noise."*
  *   **Interpretation of Null Result:** Camp A would interpret a consistent null result across diverse systems and task pairs as a significant challenge, suggesting g might not be as trainable or transferable as assumed, or that the tasks weren't sufficiently g-loaded. Camp B would interpret a null result as strong evidence against a single, fundamental, trainable capacity driving performance across such disparate domains, reinforcing the independence of specific competences. *Camp A Commitment:* "If rigorous, well-powered tests consistently show *no* positive transfer between highly disparate, g-loaded tasks after intensive training on one, across diverse systems, we would accept this as significant evidence against the trainability of a *single, domain-general* capacity as the primary driver of the positive manifold."

  **Closing Agreement: What Moves the Debate (and What Doesn't)**

  Both camps agree that the debate will be meaningfully advanced by:

  1.  **Novel Test Designs:** Constructing and deploying cognitive batteries specifically engineered to test the limits of the positive manifold and factor structure (like the maximally heterogeneous battery in Crux 1).
  2.  **Controlling Confounds:** Rigorously designing experiments and analyses to disentangle potential confounds (like shared WM/speed or LLM next-token prediction) from hypothesised general capacities (Crux 2).
  3.  **Transfer Experiments:** Conducting carefully controlled transfer studies using maximally disparate tasks with no obvious shared components (Crux 3).
  4.  **Diverse Systems:** Testing across a wider range of intelligences (humans across development, diverse non-human species, diverse AI architectures) to reveal commonalities and differences in cognitive organisation.

  Both camps agree that the following, *even if established*, would **not** resolve the core disagreement:

  1.  **Replicating Existing Manifold:** Merely demonstrating the positive manifold and a dominant factor in yet another standard battery confirms an agreed phenomenon but does not address its cause (Agreed Claim 5 & 6).
  2.  **Predictive Validity:** Showing that a 'g'-score predicts real-world outcomes only demonstrates utility; it does not reveal whether 'g' is a cause or an artefactual summary of specific predictors (Agreed Claim 4).
  3.  **Neurocorrelates:** Finding a neural correlate (e.g., brain region activation, connectivity pattern) associated with a 'g'-score does not determine whether it reflects a unitary capacity or an integration hub for multiple competences. Both interpretations remain viable.
  4.  **Philosophical Appeals:** Solely appealing to definitions of "real," "capacity," or "natural kind" without new empirical constraints (as outlined in the Cruxes) is unlikely to persuade the other side, given the differing usages identified as verbal disagreements.

  This document represents our best joint effort to clarify our positions, identify genuine disagreements, and propose empirical paths forward. We sign it as a commitment to productive, evidence-driven dialogue.
