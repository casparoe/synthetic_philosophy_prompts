prompt: |-
  I run a reading group for philosophy grad students — they can handle basic probability but glaze over the second a sum gets an index, and honestly a couple of them still think "expected value" means "the amount I'll probably get." Next month is the St. Petersburg paradox, and I don't want you to explain it to me; I want a plan for teaching it in fifty minutes. So: what has to be in place before the paradox even looks like a paradox, and in what order — what depends on what? Should the carrying example be the plain doubling coin game, or should I first do the capped version where you stop after N flips, so the expected value comes out to N+1 (I think thats right?) and only then let the cap go to infinity? Tell me which one carries the session and what the example has to have and lack. Then the misconceptions, roughly in the order they'll actually surface — "expected value is the average I'll really get," "infinite EV means it's worth an infinite amount, so paying a million is obviously rational," "the paradox just shows people are risk-averse / money has diminishing value, case closed," "the real problem is the casino can't pay" — and exactly where in the sequence I should head each one off. What I want to land by the end is that something has to give: either money's value is linear, or utility is unbounded, or maximizing expected value is the right rule, and they can't keep all three. Is that the right thing to make land, and where does it go? Give me one question to ask at the end that tells me whether it landed, and tell me what to skip at this level (and to say out loud that I'm skipping it). Keep it to one page, 600 words max, American English.
reasoning: |-
  Okay, the user runs a philosophy grad reading group. They need a 50-minute plan to teach the St. Petersburg paradox. The students understand basic probability but struggle with indexed sums and have misconceptions about expected value. I need to focus on what's essential for the paradox to emerge as a paradox.

  First, the foundational concepts: expected value must be defined clearly. I'll use the fair die example to show it's a probability-weighted average, not necessarily the most likely outcome. Then introduce the St. Petersburg game with doubling payouts. To make it digestible, I'll start with a capped version (say N=3 flips) where the expected value is finite and calculable (N+1 dollars). This helps students see the pattern before removing the cap.

  When we let N go to infinity, the expected value becomes infinite. That's when the paradox surfaces: why won't people pay large amounts to play? Common misconceptions will arise. Some students might think expected value equals actual average payout, but the capped game shows averages are finite while EV is infinite when uncapped. Others might argue that infinite EV means paying any finite amount is rational, but intuition rejects this. I'll address risk aversion and diminishing utility briefly, pointing out that the paradox persists even with linear utility. The casino's bankruptcy is a practical concern but not the core issue.

  By the end, students should see that the paradox forces us to reject one of three assumptions: linear value of money, unbounded utility, or expected value maximization. To check understanding, I'll ask: "If we insist money has linear value and utility is unbounded, what must we give up?" Skipping deeper mathematical justifications like convergence rates or utility curvature, I'll state that explicitly.

  The plan must be concise, under 600 words. Structure the session with timing: 10 minutes for EV basics, 15 on capped game, 15 on infinity and paradox, 10 for misconceptions and resolution. Final question to confirm they grasp the trilemma.
answer: |-
  ### St. Petersburg Lesson Plan (50 Minutes)  
  **Goal:** Show the paradox forces a choice between linear $, unbounded utility, or EV maximization.

  **Prerequisites (10 mins):**  
  1.  **Expected Value Definition:**  
      - "EV is a probability-weighted average *over all possible outcomes*, not your most likely result."  
      - *Example:* Fair die for \$1–\$6. EV = \$3.50. Stress that you never get \$3.50; it’s an abstract average.  

  **Build the Paradox (25 mins):**  
  2.  **Capped Game (N flips):**  
      - Play until first tails (max N flips). Payoff = $2^{\text{(heads count)}}$.  
      - *Calculate for N=2:* Outcomes: T (\$1, prob 1/2), HT (\$2, prob 1/4), HH (\$0, prob 1/4). **EV = \$1.50.**  
      - *Generalize:* EV = $N$ dollars for max $N$ flips (*yes, EV = N*). **Key:** Finite cap → finite, sensible EV.  
  3.  **Uncapped Game (Infinity → Paradox):**  
      - Remove the cap: payoff can be $2^k$ for *any* k.  
      - EV = $\sum_{k=1}^{\infty} \frac{1}{2^k} \cdot 2^k = 1 + 1 + 1 + \cdots = \infty$.  
      - **Contradiction:** EV = ∞, yet no one pays \$1,000 to play. *This is the paradox.*  

  **Address Misconceptions & Land the Point (15 mins):**  
  *(Order they’ll arise, with rebuttals):*  
  - *"EV = average payout!"* → **No:** In capped game, average over trials is ~$N$; uncapped, finite trials show modest averages despite ∞ EV. EV ≠ typical outcome.  
  - *"∞ EV = worth ∞ $!"* → **Paradox hinges here:** Would you pay \$1 million? If not, you reject EV maximization *despite* ∞ calculation.  
  - *"It’s just risk aversion / diminishing utility!"* → **Insufficient:** Paradox persists if utility = dollars (linear $) and we assume unbounded utility.  
  - *"Casino can’t pay!"* → **Distraction:** The paradox is theoretical. Assume a deity pays. The *mathematical* conflict remains.  

  **Conclusion & Skip:**  
  - **The Trilemma:** You can’t keep all three:  
    **(1)** Utility linear in money,  
    **(2)** Utility unbounded (any finite payoff has value),  
    **(3)** Maximizing EV is always rational.  
  - **Final Question:** *"If we insist money has linear value (no diminishing returns), AND utility is unbounded (any finite fortune matters), what must we give up?"* → **Answer:** EV maximization.  
  - **Explicit Skip:** "We’re skipping convergence rates, utility curvature proofs, and historical solutions like Kelly criterion. Focus on the core tension."  

  **Why This Works:**  
  The capped game makes EV concrete; uncapping reveals infinity *without* advanced math. Misconceptions are refuted using the setup itself. The trilemma emerges inevitably.
