  Let's list the desiderata we need to include, based on the user's description:

  1. **Case: Muller-Lyer illusion** - even when you know it's an illusion, it still looks that way. Requirement: The theory must explain why cognitive states (like knowing it's an illusion) do not always alter perception (so the illusion persists). This bites because if cognitive penetration were always happening, knowing the truth should make the illusion go away. But it doesn't. So the theory must account for cases where perception is resistant to cognitive influence.

  2. **Case: Duck/Rabbit** - you can flip between seeing it as a duck or a rabbit at will, but you cannot see it as both at once. Requirement: The theory must explain how cognitive states (like deciding to see it as a duck) can influence perception (so it changes) but also why there is a limitation (only one at a time). This bites because it shows a controlled influence of cognition on perception but also a constraint.

  3. **Case: Memory colour** - a grey banana looks slightly yellowish. Requirement: The theory must account for whether this is a genuine case of cognitive penetration (where knowledge of the typical colour of bananas affects the perception of the current grey banana) or if it's something else (like post-perceptual bias). This bites because if it's penetration, then it's a case of cognition affecting early perception; if not, then it might be a later effect.

  4. **Case: Phoneme restoration** - when a phoneme in a word is replaced by noise, we hear the phoneme as if it were there. Is this cognitive penetration (knowledge of the word filling in the phoneme) or just inference? Requirement: The theory must have a way to distinguish between cognitive penetration and inferential processes that are part of perception. This bites because without a clear distinction, any top-down influence might be labeled as penetration even if it's just normal perceptual inference.

  5. **Case: Wine tasting** - wine tastes better when it costs more. Requirement: The theory must account for whether this is cognitive penetration (belief about price affecting the taste experience) or a post-perceptual judgment. This bites because it's a case where the effect is clearly cognitive but might not be perceptual. The theory must not conflate perceptual and non-perceptual effects.

  6. **Case: Perceptual learning and expertise** - e.g., radiologists seeing an X-ray differently than novices. But this is slow. Requirement: The theory must distinguish between synchronic cognitive penetration (immediate influence) and diachronic changes (like learning) without just appealing to time. This bites because if all long-term changes are excluded, then we might miss important effects, but if included, then the notion of cognitive penetration becomes too broad.

