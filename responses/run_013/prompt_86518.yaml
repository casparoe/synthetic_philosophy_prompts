  7. **Arbitration requirement** - perception must be a shared given so that two people with different beliefs can agree by looking. Requirement: The theory must not make perception so belief-soaked that looking settles nothing. This bites because if perception is too penetrated by beliefs, then there is no common basis for resolving disputes.

