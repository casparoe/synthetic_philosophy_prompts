prompt: |-
  Please explain the conceptual issue that motivates two-dimensional semantics, without assuming that the reader has already absorbed the formal apparatus. Begin by distinguishing the epistemic intension of an expression from its metaphysical intension, and explain why the epistemic intension is standardly modeled as a diagonal proposition over centered worlds rather than as the proposition expressed at the actual world. Then work through the following case. A community introduces the term 'verdanite' for a mineral they reliably identify by a distinctive green fluorescence. Unbeknownst to them, the samples are not all the same substance: some are a compound with atomic number 42, others a chemically distinct compound with a nearly identical fluorescence. Explain how a two-dimensionalist should assign epistemic and metaphysical intensions to 'verdanite' before and after the discovery, and how the case bears on the claim that identity statements involving natural kinds can be both a posteriori and necessary. Be explicit about the roles of the context of utterance and the circumstance of evaluation, and about why the same sentence may receive different diagonals in different communities. Finally, assess whether the mixed-sample case exposes a tension between the framework's treatment of reference and its treatment of a priori knowledge, or whether the framework can absorb the case without revision. Reason from the commitments of the framework itself; do not rely on citations, reading lists, or external sources.
