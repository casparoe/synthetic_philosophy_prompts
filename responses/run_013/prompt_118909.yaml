  Epistemic intension captures how we understand terms based on our knowledge - it's about how things appear to us. Metaphysical intension deals with how terms actually refer in reality, regardless of our knowledge. The key point is that epistemic intension is modeled using centered worlds (worlds with a designated individual and time) because meaning depends on the speaker's perspective.

  Now for the verdanite case: A community uses this term for green-fluorescent minerals, not realizing there are two different substances (atomic numbers 42 and 43). Before discovery, both intensions map to anything with that fluorescence. After discovery, the metaphysical intension becomes ambiguous - but we can't have ambiguous reference, so two-dimensionalism would likely say the term never successfully referred to a single kind. The epistemic intension remains tied to the appearance.

  This case challenges Kripke's view that natural kind identities (like "water is H₂O") are necessary but a posteriori. Here, "verdanite is substance X" couldn't be necessary because the term didn't pick out one substance. The diagonal proposition (epistemic intension) varies between communities based on their use of the term.

  The tension: The framework struggles with how we gain knowledge from failed reference cases. If "verdanite" never referred, how did the community learn anything empirical about it? But two-dimensionalism can absorb this by saying we learned about the limitations of our identification method. The diagonal proposition was always about appearances, not hidden essences.

