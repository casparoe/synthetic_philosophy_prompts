prompt: |-
  I'm a fourth-year PhD student in philosophy, midway through a dissertation chapter on contractualism and the problem of aggregation, and I've been stuck for a week on an argument a colleague produced in our reading group. I'd like you to act as an expert in normative ethics with a specialist's command of the contractualist tradition and of the debate over whether contractualism can accommodate numbers. Please think carefully before committing to a verdict, and begin by laying out the moving parts in your own words. I don't want citations or a survey of the secondary literature; I want the argument itself diagnosed.

  Contractualism, on Scanlon's official formulation, holds that "An act is wrong if its performance under the circumstances would be disallowed by any set of principles for the general regulation of behaviour that no one could reasonably reject as a basis for informed, unforced, general agreement." My colleague's reconstruction of what follows runs like this:

  (1) A principle is one that no one could reasonably reject just in case every person affected by it lacks a sufficiently strong objection to living under it; if even one person has such an objection, the principle is rejectable, and any act it permits is wrong.
  (2) Whether a principle could reasonably be rejected is settled by the objections available to individuals taken one at a time. The fact that many people each have an objection of the same kind does not make any one of those objections stronger, and objections are never summed across persons.
  (3) It follows that for any principle which imposes a loss on each of n people and confers a benefit on a single person, the principle is rejectable just in case some one individual's objection, considered on its own, is strong enough to reject it. The size of n never enters the test.
  (4) Now suppose I can either save A, who will otherwise suffer a harm of magnitude 10, or save each of n other people, each of whom will otherwise suffer a harm of magnitude 9.9, and nothing else is at stake. No individual among the n has an objection to the principle "save A" that is as strong as A's objection to the principle "save the greater number."
  (5) So A could reasonably reject "save the greater number," while no one among the n could reasonably reject "save A." By (1), saving the n is wrong and saving A is required — for every finite n, however large, and however small the gap between 10 and 9.9.
  (6) That cannot be right. A morality that forbids rescuing a billion people from serious harm in order to spare one person a marginally greater harm, and that lets a single individual's objection outweigh the objections of any number of others of the same kind, is not a morality anyone could reasonably live under.

  I'd most like to keep (1) and (2). The whole point of contractualism, as I understand it, is that justification is owed to each person severally rather than to a collective, and (2) strikes me as simply what that means. But I can't accept (6) either. A friend of mine says the trouble is worse than the numbers case: on the same steps, no general rule at all could be justified, since any rule imposes some loss on someone, and by (3) the beneficiaries' numbers can never offset it. I would like to know whether that extension really follows, because if it does, something in the middle is doing work it has no right to do.

  So: which step should I give up, and what would giving it up cost me? In particular, please do the following.

  First, say what work (1) and (2) are each doing in the argument, and whether they can be separated.

  Second, state (2) as precisely as you can, and flag any ambiguity you find in it — I suspect it may be carrying more than one idea at once, but I can't say which.

  Third, if you think the argument contains a mistake rather than a false premise, identify exactly where the slide occurs, explain why the offending step looked so plausible, and say what a defender of the argument should say in reply.

  Fourth, if you think the argument is valid as it stands, tell me which premise is least costly to surrender, and be honest about the loss: what would I then have to say about the case in (4), what further commitments does the repair drag in, and is the resulting position still recognizably contractualist or has it quietly become a form of maximizing consequentialism?

  Finally, if there is a way to keep both (1) and (2) while blocking the conclusion, state the repair precisely and price it; if there isn't, say why there isn't. Where you see several distinct exits, lay them out as a menu with the cost of each rather than choosing for me. I'd rather keep (2) than (6) if it comes to that, but I want to know exactly what I'm buying.
reasoning: |-
  Okay, let me approach this systematically. The user presents a sophisticated contractualism puzzle centered on aggregation, explicitly requesting expert diagnosis rather than literature survey. They're stuck on a colleague's argument that seems to show contractualism forbids saving any number of people from 9.9-harm to save one from 10-harm. Core tension: preserving (1) and (2) – contractualism's individual-centeredness – seems to force absurdity in (6).

  Hmm, the user flags two key concerns: the extension to all rules (friend's worry), and their preference to keep (2) over (6). Need to validate whether the friend's generalization holds. Also sensing unspoken anxiety – if this argument stands, their dissertation chapter might need major restructuring. 

  First, parsing the argument's mechanics. Premise (1) is Scanlon's core "each must not reasonably reject" requirement. Premise (2) contains the critical no-aggregation claim. The user suspects ambiguity here – rightly. "Objections never summed across persons" could mean either:
  - Type A: objections remain atomized (strength assessed solo)
  - Type B: objections can't be combined into collective weight
  But perhaps also a third reading: while objections are individual, their interpersonal patterns matter contextually? Must dissect this.

  Now, the lethal move is (3)'s claim that numbers never matter. But look at the case in (4): saving one from harm-10 vs. many from harm-9.9. The inference that no single n-person has sufficient objection relies on comparing individual objections asymmetrically. Aha – here's a crack. When assessing "save A" principle, we compare A's objection against each n-person's. But for "save n" principle, we compare each n-person's objection against... what? The argument assumes it's still against A's loss, but contractualism requires assessing each affected party's objection to that specific principle.

  *scribbles mentally* For principle P1 ("save A"): 
  - Objectors: each n-person (harmed by not being saved)
  - Their objection strength: 9.9
  - But P1's defenders? Only A benefits. To reject P1, is 9.9 > the counter-objection from A (losing 10)? Clearly no. So P1 not rejectable.

  For principle P2 ("save n"):
  - Objector: A (harmed by not being saved)
  - Objection strength: 10
  - Defenders: each n-person benefits. But their counter-objections? Each would lose 9.9 if we don't adopt P2. However – and here's the rub – contractualism doesn't let them pool their 9.9s. So individually, is 10 > one person's 9.9? Yes. Thus A can reject P2.

  But this seems to ignore that under P2, A isn't facing 10 vs. one 9.9, but 10 vs. n instances of 9.9. The error is in (3)'s framing: it assumes the only objections to consider are from the losers, when actually, for any principle, both losers and winners have stakes, and winners' stakes provide counter-reasons against rejection. 

  Yet (2) forbids summing winners' stakes. So perhaps the flaw is in how "sufficiently strong objection" is defined. The user's friend worries this kills all rules – but that overreaches. Rules typically involve reciprocal benefits: I accept road taxes because others' payments benefit me. But in one-directional rescue cases, reciprocity vanishes. 

  So options:
  1. Reject (2)'s strict no-aggregation. But user wants to keep it. 
  2. Argue that in P2's assessment, the n-people aren't merely beneficiaries but would-be victims of an alternative principle (P1). Their objection to P1 is relevant context for whether A's rejection of P2 is reasonable. Scanlon's later "complaint model" might help here – but user wants no citations. 
  3. Different repair: distinguish objection strength from rejection reasonableness. Even if each n-person's objection is weaker than A's, the fact that many have identical objections might make A's rejection unreasonable if ignoring them shows disrespect. But smells like aggregation through backdoor. 

  User's hidden priority: preserve "justification to each severally." So repair must not collapse into utilitarianism. The least damaging move might be to qualify (2): objections are individual, but when identical objections exist, we assess the reasonableness of rejection against the pattern of burdens, not just atomized complaints. Thus for P2, A's objection, while strong, must be weighed against the fact that P2 avoids n identical 9.9-harms – not by summing, but by recognizing the moral significance of repeated burdens. 

  Cost: blurs "each severally" purity. Benefit: saves contractualism from absurdity while keeping (1). Friend's generalization fails because most rules have diffuse reciprocal benefits; rescue cases are edge cases without reciprocity. 

  Final note: in (4), the gap between 10 and 9.9 is suspiciously small. Contractualism might handle large-gap cases (save one from death vs. many stubbed toes) differently. But user's case is designed to trap us. Best to grant the scenario and fix the framework.
answer: |-
  Let's dissect the argument systematically, preserving its structure while identifying pressure points. I'll proceed exactly as requested.

  ### 1. The Work of (1) and (2)  
  - **(1)** anchors Scanlon's core contractualist criterion: wrongness hinges on *individual reasonable rejectability*. It makes moral justification *agent-relative* – if **any single person** has a sufficiently strong objection, the principle fails. This is non-negotiable for contractualism's individualism.  
  - **(2)** denies *interpersonal aggregation* of complaints. Objection strength is assessed *per person in isolation*; identical objections don't combine into a stronger collective objection. This is meant to protect contractualism from collapsing into utilitarianism.  
  **Can they be separated?** No. (2) operationalizes (1)'s individualism. Without (2), (1) could permit summing objections, betraying contractualism's essence. They are conceptually fused.

  ### 2. Precision and Ambiguity in (2)  
  **(2) restated precisely**:  
  > "The reasonable rejectability of a principle is determined *solely* by comparing the *strongest individual objection* to that principle against the objections individuals would have to every alternative principle, where:  
  > (i) Each objection is evaluated *atomistically* (only the features of that individual's burden matter);  
  > (ii) No two objections can be *combined* to produce a stronger objection;  
  > (iii) The *number* of individuals sharing an identical objection is *irrelevant* to its strength."  

  **Ambiguity/Overload**:  
  - (2) conflates two distinct ideas:  
    - **(a) Non-aggregation**: Objections cannot be summed (e.g., 100 complaints about a 1-unit burden ≠ one complaint of strength 100).  
    - **(b) Insensitivity to numbers**: The *replication* of identical objections doesn't affect their moral weight.  
    While (a) is core to contractualism, (b) is a *consequence* of (a) in this argument – but it might not be inevitable. This is where the argument gains traction.

  ### 3. The Mistake and Its Plausibility  
  **Where the slide occurs**: **Step (4) misapplies the comparative test**.  
  - The argument assumes that when evaluating "save A," we *only* compare A's objection to *each n-person's objection individually*. But contractualism requires assessing *all objections to a principle* against *all objections to its alternatives*.  
  - **For "save the n" (P2)**: A objects (losing 10). But *each n-person* also has an objection to the *alternative* principle "save A" (P1) – they each lose 9.9. While objections can't be summed, the *availability of P1* means that adopting P2 *avoids imposing 9.9 on each of n people*. A's objection to P2 must be weighed against the fact that P2 *prevents n distinct objections* to P1.  
  - **Why it looked plausible**: The argument treats P1 and P2 asymmetrically. It notes that no *single* n-person can reject P1 (since 9.9 < 10), but ignores that P2 is *motivated by avoiding n identical rejections of P1*. Contractualism compares principles pairwise; (4) fails to account for the full objection landscape.  

  **Defender's reply**: "But (2) forbids counting the *n* objections! Each n-person's objection to P1 is weaker than A's to P2. Preventing weaker objections doesn't strengthen A's case." This exposes the crux: Must contractualism ignore *how many* weaker objections a principle avoids?

  ### 4. If Valid: Least Costly Surrender  
  If we grant validity, **surrender (2)'s insensitivity to numbers (but not non-aggregation)**.  
  - **Repair**: Allow that while objections cannot be summed, the *replication* of identical objections can make a single objection *sufficient to reject* a principle that imposes widespread comparable burdens.  
  - **Cost to (4)/(5)**: In the rescue case, while each n-person's objection to "save A" is weaker than A's to "save n," the *fact that n is large* means "save n" avoids *many* identical objections. Thus, A's rejection of "save n" becomes unreasonable when n is sufficiently large.  
  - **Commitments**:  
    - Must define a threshold (e.g., when burdens are "comparable," numbers break ties).  
    - Risk: Opens the door to "aggregation-lite" – but objections remain individual (no summing *different* burdens).  
  - **Consequentialism?** Not necessarily. Justification still rests on *individual objections*, not total welfare. It becomes a *threshold-constrained* contractualism (e.g., Kamm, Otsuka). Recognizably Scanlonian if framed as "reasonable rejection must account for patterns of comparable burdens."

  ### 5. Can (1) and (2) Be Saved? Two Exits  
  **Exit 1: Reject the Principle Formulation (Cost: Moderate)**  
  - **Repair**: Principles must be *general* and *reciprocal*. The rescue case uses *ad hoc* principles ("save A" vs. "save n"), but actual contractualism tests *general rules* (e.g., "save the greater number" or "minimize largest loss").  
  - **Application to (4)**: Under a general rule "Prevent the largest individual loss," saving A is required (10 > 9.9). Under "Save the greater number," objections depend on expected frequency of being in A's vs. n's position. If n is large, each person has a higher ex ante chance of being in the group – so "save the greater number" may be unrejectable.  
  - **Cost**: Must abandon one-off principle assessments. Scanlon endorses generality, but this limits contractualism's flexibility in atypical cases. Friend's "no rules" worry defused: Reciprocity in general rules allows diffuse benefits to offset local burdens.  

  **Exit 2: Distinguish Objection Strength from Reasonableness (Cost: High)**  
  - **Repair**: (2) governs *objection strength*, but *reasonable rejectability* depends on whether a principle shows *equal concern* for each person's objections. Ignoring n identical objections might constitute unfair discounting, making rejection *unreasonable* even if no single objection outweighs.  
  - **Application to (4)**: A's objection to "save n" is strong, but rejecting it to save A *disregards n identical, nearly-as-strong objections*. This could be "unreasonable" as a form of disrespect, even if objections aren't summed.  
  - **Cost**: Blurs the line between individual complaints and relational fairness. Risks collapsing into a fairness-based consequentialism. Scanlon might resist, as rejectability stems from individual burden strength, not impersonal fairness.  

  ### Menu of Options  
  | **Choice**                          | **Cost**                                                                 | **Outcome in Rescue Case**                                                                 |
  |-------------------------------------|--------------------------------------------------------------------------|-------------------------------------------------------------------------------------------|
  | **Keep (1) & (2); fix asymmetry (Step 4)** | Low (preserves core); may need case-specific adjustments              | Save A required for small n; save n permitted for large n (if alternative objections contextualized) |
  | **Surrender (2)'s number-insensitivity** | Moderate (adds "comparability threshold")                             | Save n required for large n, even with tiny individual gap                               |
  | **Exit 1: General principles only**     | Moderate (loses fine-grained per-case assessment)                      | Depends on reciprocal general rule; likely permits saving n                              |
  | **Exit 2: Reasonableness as fairness**  | High (stretches "individual objection" beyond Scanlon)                 | Forbids saving A when n is large; focuses on equal concern                              |

  ### Recommendation  
  **Target Step (4)'s asymmetry** while keeping (1) and (2) intact. Contractualism compares *principles*, not isolated objections. When evaluating "save n," the relevant alternative is "save A" – and each n-person has a *strong objection to "save A"* (losing 9.9). While no *single* n-person's objection outweighs A's 10, the *set* of objections to the alternative shows that "save n" *responds proportionally* to a widespread comparable burden. A's rejection may still be reasonable for small n, but when n is vast, rejecting "save n" ignores that it resolves *many* serious complaints. This avoids summing while acknowledging scale. Cost: Requires nuanced judgment about "comparable" burdens and critical n thresholds – but saves contractualism from absurdity without capitulating to aggregation. 

  **On your friend's worry**: The "no rules" extension fails because general rules involve *reciprocal expectations* over time. A tax rule burdens me today but benefits me tomorrow; isolated rescues lack this reciprocity. Edge cases don't generalize. 

  This preserves the spirit of (2) while blocking the conclusion. If rigor demands rejecting all exits, I'd reluctantly surrender (2)'s number-insensitivity – but only as a last resort. Your instinct to save (2) is defensible; the argument abuses it by misconstruing the objection space.
