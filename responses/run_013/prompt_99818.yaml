prompt: |-
  My sister's best friend Dana has read alot of moral philosophy and she's definately the person I text when I'm about to do something I'm not sure about. Which is why I'm asking you this, because something has come up and I want to figure out what she's going to say before I tell her, so I can be ready for it.

  Here's every verdict she's given me over the past couple of years, which is basically my whole evidence base:

  - A kid drowning in a pond, saving him means ruining my good shoes and being an hour late for work. She said obviously I'd have to go in.
  - A guy has a seizure at my bus stop, I call 911 and sit with him till the ambulance comes and miss my train. Have to.
  - A toddler wanders into traffic, I sprint out and grab him, roll my ankle and miss a job interview. Have to.
  - Quit my job for a year to keep my friend's bakery afloat, when it would only do a little better with me there. She said I don't have to.
  - Give up every Saturday for two years to tutor at a school that would be marginally better off. Don't have to.
  - A friend of hers asked whether she'd have to go back into a burning house to try to pull a stranger's kid out. Dana said absolutely not, not with those odds, she isn't dying for someone else's family.
  - She said I don't have to give up my weekend to help a friend move when he could just hire movers.

  So here's my thing. There's a guy across town, mid-forties, I've never met him, and he'll die without a new liver. I got tested after his family put something on the local news, and the transplant people say I'm a good match. They'd take part of my liver. It grows back, in him and in me, but I'd be in the hospital most of a week and feel like garbage for a couple of months, and the surgeon was straight with me that there's a small chance of something going seriously wrong, well under one percent but not nothing, and it's a bigger deal than giving a kidney. My job gives me paid leave for this, so I wouldn't lose any money over it. And there's a real chance his body rejects it anyway and it doesn't even work.

  What I want to know is whether Dana thinks I have to do this or whether it's above and beyond, and what rule she's actually running, because I genuinely can't tell if she's going by what an act costs the person doing it or by how much good it does.

  Please lay it out in this order. Start with a section called Bottom line, two or three sentences, just the prediction and your best guess at which rule she's really running. Then a section called The rules that fit, where you give me the two or three rules that account for every one of her verdicts above, around 250 words. Then What each rule says about me, going rule by rule and giving its prediction for my liver situation, around 200 words. Then What would settle it, meaning the case or question I should put to her that would tell the rules apart, around 150 words.
reasoning: |-
  Okay, the user is trying to predict how their sister's friend Dana would advise on a liver donation dilemma. They've shared Dana's past moral verdicts to help analyze her ethical framework. 

  First, I need to map Dana's pattern from these cases. The drowning kid, seizure response, and saving a toddler all involve immediate physical danger where inaction = death/disability, with moderate personal cost (ruined shoes, missed appointments). In contrast, quitting a job for a bakery, long-term tutoring, or weekend moving assistance have either high/chronic costs or alternatives exist (hiring movers). The burning house case is key - Dana draws a line at near-certain death risk despite potential benefit.

  Hmm... this suggests Dana operates on a modified "rescue principle": obligatory when (1) severe irreversible harm is imminent, (2) your action is uniquely necessary, and (3) personal cost is non-catastrophic. The liver case sits in a gray area: death is certain without intervention, but not "imminent" like drowning; the match makes the user potentially "unique," though others might get tested; the physical cost is significant but not lethal. 

  The paid leave factor is interesting - Dana seems to weight financial impacts, so that probably moves it closer to "obligatory" in her framework. But the 1% surgical risk and possible organ rejection might tilt it toward supererogatory (heroic but not required). 

  For the user's experiment suggestion: proposing a hypothetical where someone's rare blood type could save a stranger via months-long plasma donations (chronic but lower risk) would test Dana's thresholds for uniqueness vs. burden. If she says "must donate once" but not "repeatedly," that confirms her cost/benefit calculus isn't purely utilitarian.
answer: |-
  Based on Dana's consistent pattern of verdicts, here's the breakdown:

  **Bottom line**
  Dana will almost certainly say you **do NOT have to donate part of your liver** to the stranger across town. Her rule appears to prioritize preventing severe, imminent, and unavoidable harm *only* when the personal cost is moderate and doesn't risk catastrophic loss (like death or life-altering injury). Your situation involves significant personal risk and suffering, even with paid leave, pushing it beyond obligation into supererogation (heroic, but not required).

  **The rules that fit (≈250 words)**
  Dana's verdicts are best explained by a **modified Rescue Principle** combined with a **threshold of acceptable cost**:

  1.  **Modified Rescue Principle:** You have a strong obligation to prevent severe, irreversible harm (death, serious disability) to another person *if*:
      *   The harm is **imminent and practically unavoidable** without your *immediate* action (drowning, seizure without aid, toddler in traffic).
      *   You are **uniquely or especially positioned** to help in that moment (you're right there, no one else is acting/able).
      *   The **expected harm prevented is vastly greater than the cost to you**.
  2.  **Threshold of Acceptable Cost:** This obligation has strict limits based on the cost *to you*:
      *   **Moderate Costs (Obligatory):** Inconvenience, financial loss (shoes, missed work/interview), minor injury (rolled ankle), significant time commitment *if* required to prevent imminent catastrophe (sitting with seizure victim).
      *   **High/Chronic Costs or Catastrophic Risks (Not Obligatory):** Major life disruption (quitting job), chronic sacrifice (every Saturday for years), significant risk of death or severe injury (burning building), or actions where alternatives exist (hiring movers). The cost to you crosses a threshold where it becomes supererogatory.
      *   **Magnitude of Benefit Matters Less Than Immediacy/Uniqueness/Cost:** While the benefit is large in the tutoring/bakery cases, the harm wasn't *imminent* and catastrophic without *her specific* action, *and* the cost was high/chronic.

  This framework perfectly fits every case: Obligation exists only for imminent catastrophe where you're uniquely positioned and the cost stays below the threshold (shoes, time, minor injury). High cost, chronic sacrifice, catastrophic risk, or lack of true immediacy/uniqueness negates the obligation.

  **What each rule says about me (≈200 words)**

  1.  **Modified Rescue Principle:** This rule focuses on the *nature of the threat and your proximity*. The man's death is severe and certain without a transplant, but it's *not imminent* in the "right now" sense like drowning. Crucially, you are *not* uniquely positioned; while a good match, you aren't the *only* possible match – others exist or could be tested. This weakens the "rescue" imperative compared to being the only person at the pond. Verdict: **Not obligatory.**
  2.  **Threshold of Acceptable Cost:** This rule focuses on *your sacrifice and risk*. While paid leave mitigates financial cost, the physical cost (major surgery, weeks of feeling "like garbage," months of recovery) is significant. More importantly, the "small chance... well under one percent but not nothing" of something "seriously wrong" crosses Dana's established threshold against catastrophic personal risk (like the burning house). The risk, combined with the significant suffering and recovery time, exceeds the acceptable cost for an obligation to a stranger. The possibility of rejection further reduces the guaranteed benefit. Verdict: **Not obligatory.**

  **What would settle it (≈150 words)**

  To definitively distinguish between a rule focused purely on high benefit vs. low cost and Dana's apparent rule (immediacy/uniqueness + cost threshold), pose this scenario:

  *"A child in a remote village will die in six months without expensive medication. I'm the only person who knows about it and can afford the cost. Donating the money would mean canceling my non-refundable dream vacation (a significant financial and emotional loss, but no risk of death/injury). Do I have to donate?"*

  *   **Benefit-Focused Rule:** Would likely say **Yes, you must**. The benefit (saving a life) vastly outweighs the cost (lost vacation).
  *   **Dana's Likely Rule:** Would say **No, you don't have to**. While the harm is severe and you are uniquely positioned, the harm is *not imminent* (6 months away), and the cost, while significant, involves no catastrophic risk. It likely falls below her threshold for *obligation* to a stranger, becoming supererogatory. Her bakery/tutoring verdicts support this.
