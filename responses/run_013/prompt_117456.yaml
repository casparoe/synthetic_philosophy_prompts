prompt: |-
  I'm building a set of prompts about Strawson's reactive attitudes and I want one that makes a model actually construct a case instead of reciting the participant stance vs the objective attitude stuff it's seen a hundred times. So heres the job.

  Build me an ordinary-life scenario, one paragraph max, where a wrong gets done and three views about blame come apart. I'll state the three views so you dont have to go look anything up, and please dont — no citations, no reading lists, no names of papers, just the argument.

  (1) The Strawson-ish view: resentment, and the vicarious version of it that a bystander feels on someone else's behalf, are the same kind of attitude. They're apt when the wrongdoer's will really did display the disregard it appears to, and the only difference between the victim's version and the bystander's is which seat you're sitting in.

  (2) The standing view: holding someone responsible is making a demand on them, and to make a demand you need the authority to make it — you have to be in good standing with respect to the norm yourself. No standing, no demand, no blame.

  (3) The relationship view: blame just is the registering of a damaged relationship between the blamer and the blamed, so if there's no relationship there, there's nothing for resentment to register.

  The scenario needs two observers of one act: the person actually wronged (call her V) and a bystander with no prior relation to either party (call him B). Both see the same evidence and know the same things about the wrongdoer's history and motives. The wrongness of the act and the wrongdoer's responsibility stay fixed throughout: no excuses, no ignorance of fact, no coercion, no manipulation, nothing sci-fi, nothing lurid, nothing that turns the wrongdoer into a special case. Now the hard part: V has to be the one who comes out, on view (2), with impaired standing, while B comes out clean. Thats the reverse of what you'd expect, since standing normally tracks being the one who got hurt. So whatever does the impairing has to be a fact about V and not about the wrongdoer, it can't be anything that changes what the wrongdoer did or whether she's responsible, it can't be that V consented to it, and it can't be that V was only trivially harmed. And whatever costs V her standing can't be something B is also guilty of, or you've failed the spec.

  Then show the work. For each of the three views: what it says about V's resentment and about B's resentment, and why, in that view's own terms. Then tell me which single feature of the case is doing all the work, and what happens to the three verdicts if you delete it — which of the views collapse into agreement with each other and which don't. Then, since one of the three is going to come out looking worst, say how someone who holds it would attack the case: not a generic grumble, the best specific objection available. The whole point of the exercise is whether the participant stance has any room for a standing condition at all, so if your scenario just announces that V's resentment is inappropriate, or that B's is, you've cheated — the verdicts have to fall out of the views.

  Format: scenario and walkthrough as prose, scenario one paragraph. Then a table with these columns: view | verdict on V's resentment | verdict on B's resentment | is B's attitude the same attitude as V's, just from a different seat (yes/no plus one clause) | what the view treats as doing the work (seat, or title, or relation) | weakest point in that verdict. Then one last short paragraph with the collapse test and the counterattack.
reasoning: |-
  We are constructing a scenario that meets the following specifications:
   - An ordinary-life scenario with a wrong done.
   - Two observers: V (the victim) and B (a bystander with no prior relation to either party).
   - The wrong is clear: no excuses, ignorance, coercion, etc. The wrongdoer is fully responsible.
   - The challenge: V (the victim) has impaired standing on view (2) (the standing view), while B (the bystander) has clean standing. This is the reverse of the usual expectation (where the victim would normally have standing). The impairing fact must be about V, not about the wrongdoer, and cannot change the wrongdoer's responsibility. The harm to V must be non-trivial, and V must not have consented. Moreover, the fact that impairs V must not also impair B.

   We need to design the scenario such that:
     - On the standing view (2): V lacks the authority to blame because she is not in good standing with respect to the norm (i.e., she has violated the same norm in a similar way recently, without having made amends). Meanwhile, B is in good standing because he hasn't violated that norm (or at least not in the relevant way).
     - The other views must also be applied to the same scenario.

   Let's design the scenario:

   Scenario:
   At a community meeting, Alex (the wrongdoer) publicly spreads false and damaging rumors about Terry (V), claiming Terry embezzled funds from the neighborhood association. This is a lie, and Alex knows it. The harm to Terry's reputation is significant. Bystander Bailey (B) witnesses this, having no prior connection to either. Terry, however, recently did something similar: last month, Terry spread false rumors about another neighbor, Sam, and has not apologized or made amends for that.

   Now, the three views:

   (1) Strawson-ish view: Both V (Terry) and B (Bailey) can appropriately feel resentment (or its vicarious version) because the wrongdoer (Alex) displayed a clear disregard for Terry. The attitude is the same in kind; the difference is only the seat (Terry is the victim, Bailey is a bystander). The fact that Terry has a history of similar wrongdoing doesn't change the aptness of Terry's resentment (because the attitude is about Alex's current act of disregard) or Bailey's (which is vicarious resentment on Terry's behalf). So both are appropriate.

   (2) Standing view: To blame, one must have the authority to make the demand. Terry (V) lacks standing because Terry has recently violated the same norm (spreading false rumors) and hasn't made amends. Therefore, Terry is not in good standing to demand that Alex not spread false rumors. However, Bailey (B) is in good standing because he hasn't violated that norm (or at least, we have no reason to think he has). Thus, Terry's resentment is inappropriate (because Terry lacks standing), but Bailey's is appropriate.

   (3) Relationship view: Blame is the registering of a damaged relationship. For Terry (V), the relationship with Alex is damaged by Alex's act, so Terry's resentment is appropriate (it registers that damage). For Bailey (B), there is no prior relationship with Alex, so there is no relationship to be damaged. Therefore, Bailey's resentment is not appropriate (because there is no relationship to register as damaged). However, note that the view might allow for a different kind of attitude in the bystander (like moral disapproval) but that wouldn't be blame in the relational sense.

   Now, we need to show the work in a table:

   View | Verdict on V's resentment | Verdict on B's resentment | Is B's attitude the same as V's? (yes/no + one clause) | What the view treats as doing the work | Weakest point in that verdict
  ------|---------------------------|---------------------------|------------------------------------------------------|------------------------------------|-----------------------------
   (1) Strawson-ish | Appropriate | Appropriate | Yes: same attitude (resentment) from the victim's seat vs. the bystander's seat | The quality of the wrongdoer's will (disregard) | It doesn't account for why the victim's own past might matter to the appropriateness of their resentment.
   (2) Standing | Inappropriate (lacks standing) | Appropriate | No: V's attitude is resentment but is inappropriate because of lack of standing; B's is appropriate resentment. But note: the view might say they are the same kind of attitude (resentment) but one is apt and the other not because of standing. However, the question is whether they are the same attitude. The view might hold that the attitude is the same but the conditions for its aptness differ. But the prompt asks: are they the same kind of attitude? The Strawson-ish view says yes, the same kind, just from a different seat. The standing view, I think, would also consider the attitude as the same (it's resentment) but the conditions for its appropriateness are different. However, the prompt says: "the same kind of attitude" and the Strawson-ish view emphasizes that they are the same. The standing view doesn't necessarily deny that the attitude is the same kind, but it adds a condition for appropriateness. So we can say: Yes, but the standing view adds that the appropriateness depends on the blamer's standing. | The blamer's standing (authority) | It seems counterintuitive that the victim cannot blame because of their own past, while a bystander can.
   (3) Relationship | Appropriate (registers the damage to the V-Alex relationship) | Inappropriate (no relationship to damage) | No: V's attitude is blame (which is relational), but B's attitude cannot be blame (because there's no relationship). B might feel something else (moral indignation) but it's not blame in this sense. | The existence and state of the relationship between blamer and blamed | It doesn't account for the bystander's natural feeling of moral outrage and the sense that they are blaming the wrongdoer.

   Now, the collapse test: what if we delete the key feature? The key feature is that V (Terry) has a recent history of violating the same norm without making amends.

   Without that feature (i.e., Terry has not spread rumors about Sam):
   - View (1): Still both appropriate. No change.
   - View (2): Now Terry (V) has standing (because she hasn't violated the norm) so her resentment is appropriate. B (Bailey) also has standing, so both are appropriate. Thus, (2) now agrees with (1) on both counts. Previously, (2) had a split verdict (V inappropriate, B appropriate) but now both are appropriate. So without the key feature, (2) collapses into agreement with (1) on both V and B.
   - View (3): Without the key feature, the verdicts remain the same: V's resentment is appropriate (because the relationship is damaged) and B's is not (no relationship). So (3) does not change and remains in disagreement with the others on B.

   Therefore, without the key feature, (1) and (2) agree that both V and B can appropriately resent, but (3) still holds that B cannot.

   Counterattack (from the view that comes out worst?):
   The relationship view (3) might be seen as the most counterintuitive because it says the bystander cannot appropriately blame. How would a proponent of the relationship view attack the case?

   They might say: The scenario is set up to make the relationship view look bad by having a bystander who has no relationship. But in ordinary life, bystanders do have a minimal moral relationship with others in the community. So the relationship view can be expanded to include the general moral relationship we all share. Then, Bailey (B) does have a relationship with Alex (as members of the same community) and Alex's act damages that relationship (by showing disregard for community norms). Therefore, Bailey's resentment (or rather, blame) is appropriate because it registers the damage to that general moral relationship.

   However, note that in the scenario, we specified "no prior relation to either party", but the relationship view might still hold that there is a basic moral relationship. This attack would challenge the setup by saying that there is always a relationship in a moral community.

   But the scenario says "bystander with no prior relation", meaning no special relationship (like friendship, family, etc.), but the relationship view might argue that the moral relationship is always present. So the counterattack is: the scenario assumes no relationship, but in fact, in a moral community, there is always a minimal moral relationship between any two members. Therefore, the bystander does have a relationship and can appropriately blame.

   Alternatively, the standing view might be attacked by the Strawson-ish view: The standing condition is not part of the core idea of the reactive attitudes. The reactive attitudes are natural responses to the quality of will, and they don't depend on the blamer's own moral record. The standing view confuses the issue by importing an extraneous condition. In particular, it seems to conflate the question of whether one is a hypocrite (which might make one's blame ineffective or open to criticism) with whether the attitude is appropriate. The Strawsonian might argue that even a hypocrite can appropriately feel resentment, though they might not be in a position to express it effectively.

   However, the prompt says the counterattack should be specific to the case. So for the relationship view, the counterattack is as above.

   Let's write the scenario in one paragraph and then the table and the rest.

   Scenario:
   During a neighborhood meeting, Alex falsely accuses Terry of embezzling association funds, knowing the accusation is untrue, causing significant harm to Terry's reputation. Bailey, a neighbor with no prior connection to either, witnesses the event. However, Terry recently spread similarly false rumors about Sam, another neighbor, and has not apologized or made amends for that.

   Table:

  | View               | Verdict on V's resentment | Verdict on B's resentment | Is B's attitude the same as V's? (yes/no + clause) | What the view treats as doing the work           | Weakest point in that verdict                              |
  |--------------------|---------------------------|---------------------------|----------------------------------------------------|--------------------------------------------------|------------------------------------------------------------|
  | (1) Strawson-ish   | Appropriate               | Appropriate               | Yes: same attitude (resentment) from a different seat. | The wrongdoer's displayed disregard              | Ignores how the victim's own actions might undermine their resentment. |
  | (2) Standing       | Inappropriate (lacks standing) | Appropriate               | Yes, but appropriateness depends on the blamer's standing. | The blamer's authority (standing) to make the demand | It seems harsh to silence the victim due to their own past. |
  | (3) Relationship   | Appropriate               | Inappropriate             | No: V's attitude is blame (relational), B's is not blame (or not appropriate) because no prior relationship. | The existence of a relationship between blamer and blamed | Denies that bystanders can appropriately blame.            |

   Note: For the "Is B's attitude the same as V's?" column, the standing view (2) might be interpreted as saying the attitude is the same kind (resentment) but the conditions for its aptness are different. So we put "Yes, but ...". The relationship view (3) says they are not the same: V's is blame (relational) and B's is something else (if anything) or at least not the same kind.

   Collapse test and counterattack:

   If we delete the key feature (Terry's recent similar wrongdoing without amends), then:
     - View (1) remains: both appropriate.
     - View (2) changes: now Terry has standing, so both V and B are appropriate. Thus, (1) and (2) agree.
     - View (3) remains: V appropriate, B inappropriate. So (3) now disagrees with both.

   The view that comes out worst in the original scenario might be the relationship view because it denies that the bystander can appropriately blame. A proponent of the relationship view might counterattack by arguing that the scenario artificially excludes the moral relationship that exists between any two members of a community. In reality, Bailey and Alex do have a relationship as fellow community members, and Alex's wrongdoing damages that relationship. Therefore, Bailey's blame is appropriate because it registers that damage.

   Alternatively, the standing view might be attacked by the Strawsonian: The standing condition is not part of the core concept of the reactive attitudes. The fact that Terry has violated the same norm doesn't make her resentment inappropriate; it might make her hypocritical if she expresses it, but the feeling itself is still a natural and apt response to the disregard shown by Alex. The standing view confuses the appropriateness of the emotion with the permissibility of its expression or the effectiveness of holding the wrongdoer accountable.

   However, the prompt asks for the best specific objection available to the view that comes out worst. In the table, the relationship view has the counterintuitive result about the bystander, so it might be seen as the weakest. Therefore, we present the counterattack from the relationship view.

   Final paragraph:

   If we remove the feature of Terry's recent similar wrongdoing, the standing view (2) collapses into agreement with the Strawson-ish view (1) that both V and B can appropriately resent, but the relationship view (3) remains isolated in rejecting B's blame. The relationship view proponent would counterattack by challenging the assumption that Bailey has no relationship with Alex: in a shared moral community, a minimal relationship exists, and Alex's act damages that relationship, making Bailey's blame (as the registering of that damage) appropriate.
answer: |-
  ### Scenario  
  During a community fundraiser, Alex intentionally shoves Terry (V) into a display of expensive pottery, causing her injury and destroying the items. Terry, who recently committed a similar act of unprovoked violence against another member (and never apologized), is visibly hurt. Bailey (B), an out-of-town visitor with no prior ties to anyone present, witnesses the entire event. Both see Alex’s act as deliberate and inexcusable, and both know Terry’s history of unresolved aggression.  

  ### Walkthrough  
  **Strawson-ish View (1)**:  
  - **V’s resentment**: Appropriate, as Alex’s shove clearly displayed disregard for Terry.  
  - **B’s resentment**: Appropriate—it’s vicarious resentment on Terry’s behalf, identical in kind to Terry’s, differing only because B occupies the bystander’s seat.  
  - *Why?* The attitude hinges solely on the wrongdoer’s ill will, not the blamer’s history.  

  **Standing View (2)**:  
  - **V’s resentment**: Inappropriate. Terry’s own unaddressed violence deprives her of the moral standing to demand accountability from Alex.  
  - **B’s resentment**: Appropriate. Bailey, lacking a history of such wrongdoing, has the standing to blame Alex.  
  - *Why?* Blame requires authority to enforce norms, which Terry forfeited by violating the same norm without amends.  

  **Relationship View (3)**:  
  - **V’s resentment**: Appropriate, as Alex damaged their interpersonal relationship through the attack.  
  - **B’s resentment**: Inappropriate. With no prior relationship to Alex, Bailey cannot "register" relational damage; his disapproval is generic moral judgment, not blame.  
  - *Why?* Blame is defined by the rupture of a specific relationship, which B lacks.  

  ### Analysis Table  
  | View               | Verdict on V’s Resentment | Verdict on B’s Resentment | B’s Attitude = V’s? (Yes/No + Clause)                   | What Does the Work?         | Weakest Point                          |  
  |--------------------|---------------------------|---------------------------|--------------------------------------------------------|-----------------------------|----------------------------------------|  
  | (1) Strawson-ish   | Appropriate               | Appropriate               | Yes: Same attitude (resentment), different seat.       | Wrongdoer’s ill will        | Ignores how V’s history affects moral credibility. |  
  | (2) Standing       | Inappropriate             | Appropriate               | No: V’s attitude is tainted by hypocrisy; B’s is not. | Blamer’s standing           | Punishes V twice (harm + silencing).   |  
  | (3) Relationship   | Appropriate               | Inappropriate             | No: V’s attitude tracks relational rupture; B’s cannot. | Existence of a relationship | Denies bystanders’ right to blame.     |  

  ### Collapse Test & Counterattack  
  **Key feature**: Terry’s recent, unamended similar wrongdoing.  
  - **If deleted**:  
    - (1) and (2) collapse into agreement: Both deem V and B’s resentment appropriate (V’s standing is now intact).  
    - (3) remains isolated: Still rejects B’s resentment for lacking a relationship.  
  **Counterattack from the Standing View (which fares worst due to victim-silencing)**:  
  > "This scenario rigs the case by equivocating on ‘standing.’ Terry’s past violence *does* impact Alex’s blameworthiness: it makes Alex’s act partially retaliatory, undermining the ‘fixed responsibility’ requirement. If Alex knew of Terry’s history, their disregard was not purely gratuitous—it reacted to Terry’s own norm-violating character. Thus, the case smuggles in an excuse for Alex, violating your parameters."  

  **Why this counters the scenario**:  
  The standing view objects that Terry’s history *does* alter Alex’s moral position (contrary to the prompt’s "fixed responsibility" rule) by implying Alex’s shove was provoked, reframing it as payback rather than pure disregard. This invalidates the setup, as the wrongdoer’s responsibility is no longer "fixed."
