prompt: |-
  For a seminar on population ethics I have to write a short reflective-equilibrium piece: I lay out my considered verdicts on a range of population cases and then work out what axiology, if any, they add up to. Before I commit to it, I want the set stress-tested.

  Throughout, I'm imagining myself as a benevolent designer choosing which of two worlds to make actual. Welfare is measured on a scale with 0 as the neutral point: a life at 0 is neither worth living nor worth not living, positive lives are worth living, negative lives are worth not living. Unless I say otherwise, nothing varies between the worlds except people's welfare levels and how many people there are.

  1. Small addition. World A: ten million people at 100. World B: those same ten million at 100, plus another ten million at 5. No one in B is worse off than in A, and the newcomers' lives are worth living. Verdict: B is better than A. Bringing worthwhile lives into existence is a good thing.

  2. The large trade-off. World C: ten million people at 100. World D: ten trillion people at 5. Verdict: C is better than D, and not by a little. I do not accept that an enormous population of barely-worth-living lives beats a small flourishing one.

  3. Neutral additions. World E: ten million at 100. World F: ten million at 100 plus ten million at exactly 0. Verdict: E and F are equally good; adding neutral lives changes nothing.

  4. Wretched additions. World G: ten million at 100. World H: ten million at 100 plus ten million at -20. Verdict: H is worse than G.

  5. Authenticity. World I: ten million at 100 plus ten million at 5, where the newcomers are exactly as well off as their level says, but only because they are systematically deceived about their situation. World J: the same, except the newcomers' equal welfare rests on true beliefs. Verdict: J is better than I. So even with welfare held fixed, how that welfare is realized seems to matter to me.

  6. Identity. World K: ten million people at 100. World L: ten million entirely different people at 100, with the original ten million never existing. Verdict: K and L are equally good; swapping in a wholly different population at the same welfare changes nothing.

  I can already feel that these cannot all survive contact with one principle, and I'd rather find that out now than in front of the seminar. So don't hand me the standard menu of positions. Take a definite stand. Tell me which principle, or small set of principles, actually fits the verdicts, which of my verdicts it forces me to give up, and why that is the trade-off worth making rather than some other one. Then tell me what the surviving principle implies for two cases I haven't given a verdict on: (a) ten million at 100 versus ten million at 60 together with ten billion at 6; and (b) a world in which the added lives are worth living but their welfare depends on resources taken from the people who already exist. Please write in American English.
reasoning: |-
  Okay, the user is preparing for a population ethics seminar and needs their intuitive judgments about different world scenarios stress-tested. They've listed six specific cases with their verdicts and want to know what ethical principle(s) align with them, which verdicts might need revision, and how to handle two new cases. 

  First, let's unpack their core intuitions: They clearly value individual welfare (B>A, H<G), reject pure aggregation (C>D), see neutral lives as irrelevant (E=F), care about authenticity beyond hedonic states (J>I), and view welfare-levels as identity-independent (K=L). That's a coherent starting point.

  The tension jumps out immediately: Their rejection of massive barely-positive aggregation (C>D) clashes with valuing small additions of positive lives (B>A). If they accept that adding 10M at +5 improves the world, why wouldn't adding trillions more do the same? Classic Mere Addition Paradox territory. 

  The Average Utilitarianism solution seems promising here - it explains all verdicts except #1. But sacrificing the intuition that adding good lives is good feels wrong. Perfectionism handles #1 and #2 but fails #3 and #6. Critical-Level Utilitarianism could work if we set the critical level above 0 but below 5... but then #1 becomes problematic.

  Wait - their authenticity verdict (#5) is the key. They care about more than welfare numbers. Maybe a pluralist approach: Average Utility + an authenticity constraint. But that feels ad hoc. Alternatively, a capability/objective-list view where deception violates a good even if welfare is identical. 

  For the unresolved cases: (a) Average Utility would prefer 10M at 100 over the larger but lower-average population. But if they previously rejected aggregation in #2, this is consistent. (b) Introducing resource trade-offs complicates things - if existing people drop from 100 to 80 to add lives at 5, it depends whether we prioritize average welfare or total net gain. 

  The real struggle is preserving #1 while rejecting #2. One radical option: Embrace Average Utility but qualify that additions only matter when they raise the average. That forces giving up #1 as literally stated - adding positive lives at sub-average welfare doesn't improve things. Painful but coherent. 

  Alternatively, bite the bullet on #2? But their "not by a little" phrasing suggests deep intuition. Best path: Average Utility with a non-welfare value for authenticity. Sacrifice the pure welfare-monism of #1-4 to preserve #5, while using average to block extreme aggregation. Then for case (a), average wins; for (b), if existing people lose welfare, average likely drops - so don't add them unless the newcomers dramatically outperform. 

  Final note: Their identity indifference (#6) suggests they're not person-affecting, which helps. Overall, they'll need to either abandon "additions always good" or accept massive aggregation - no perfect escape. I'll position Average Utility as the least-bad fit that honors most intuitions.
answer: |-
  Here's the stress test. Your verdicts point toward **Average Utilitarianism (AU)**, but with a significant conflict and a crucial refinement needed for authenticity. Let's break it down:

  **The Principle: Average Utilitarianism (Refined)**
  *   **Core:** The value of a world is determined by the *average welfare level* of all individuals who exist in that world. Higher average welfare = better world.
  *   **Refinement for Authenticity:** Welfare must be constituted by genuine states of being and authentic experiences. Welfare based on systematic deception is discounted or considered less valuable than welfare based on true beliefs, even if the reported hedonic level is identical.

  **How Your Verdicts Fit (Mostly):**

  1.  **Small Addition (B > A):** Fits AU. Adding lives at +5 increases the total welfare, but *decreases* the average (from 100 to (1000 + 50)/20 = 52.5). **CONFLICT!** AU implies B is *worse* than A. Your verdict contradicts core AU.
  2.  **Large Trade-Off (C > D):** Fits AU perfectly. Average in C is 100. Average in D is 5. AU clearly says C is vastly better than D.
  3.  **Neutral Additions (E = F):** Fits AU. Average in E is 100. Average in F is (1000 + 0)/20 = 50. **CONFLICT!** AU implies F is *worse* than E. Your verdict contradicts core AU. However, AU *could* be consistent with this verdict if neutral lives are considered "non-existent" for the average calculation, but standard AU includes them, dragging the average down to 50.
  4.  **Wretched Additions (H < G):** Fits AU. Average in G is 100. Average in H is (1000 - 200)/20 = 40. AU clearly says H is worse than G.
  5.  **Authenticity (J > I):** Fits the *Refined AU*. The welfare level of the deceived (+5) is discounted or considered less valuable than the authentic +5. The *effective* average welfare in I is lower than in J. (E.g., if we discount the deceptive welfare by 50%, the average in I is (1000 + 25)/20 = 51.25, while J remains 52.5).
  6.  **Identity (K = L):** Fits AU. The average welfare is identical (100). Who the individuals are doesn't matter, only their welfare level.

  **The Inescapable Trade-Off:**

  Your verdicts #1 (B>A) and #3 (E=F) are fundamentally incompatible with standard Average Utilitarianism applied to the populations *as you've described them*. AU demands that adding lives *below* the existing average makes the world worse (#1), and adding lives *at* the existing average keeps it the same (#3 only if added at 100). Adding lives at 0 (#3) or below average (#1, welfare=5<100) *must* lower the average and make the world worse according to AU.

  **The Trade-Off Worth Making: Reject Verdicts #1 and #3 as Stated**

  1.  **Reject #1 (Small Addition):** Adding lives with *positive but below-average* welfare (like +5 when the existing are at +100) actually makes the world *worse* on AU because it lowers the average. Your intuition that it's "good" stems from seeing the newcomers' gain in isolation. AU forces you to consider the *overall distribution*. Sacrificing the average for a larger population of less well-off individuals is precisely what you *rejected* in #2. Accepting #1 while rejecting #2 is inconsistent. AU resolves this by valuing the average consistently: any addition below the average lowers overall value.
  2.  **Reject #3 (Neutral Additions):** Adding lives at 0 *lowers* the average welfare (from 100 to 50 in your example). Therefore, on AU, F is *worse* than E. Your intuition that it "changes nothing" treats neutral lives as non-entities. AU counts them as existences dragging the average down. The trade-off is accepting that adding lives, even neutral ones, has a negative impact on the overall average welfare metric.

  **Why this Trade-Off is Better:**

  *   **Consistency:** AU provides a single, clear principle (maximize average welfare) that handles #2, #4, #5 (with refinement), and #6 elegantly and consistently. Abandoning #1 and #3 as stated resolves the core contradiction between your acceptance of small additions and rejection of large trade-offs.
  *   **Respects Anti-Aggregation:** AU strongly aligns with your powerful intuition in #2 that a vast population of barely-positive lives is vastly inferior to a small flourishing one.
  *   **Handles Wretchedness:** AU naturally explains why adding negative lives (#4) is bad.
  *   **Accommodates Authenticity:** The refinement cleanly incorporates your crucial insight from #5.
  *   **Identity-Neutral:** AU naturally aligns with #6.

  **Implications for New Cases:**

  1.  **Ten Million at 100 vs. Ten Million at 60 + Ten Billion at 6:**
      *   **World 1:** Pop: 10M, Total Welfare: 10M * 100 = 1 Billion, **Average: 100**
      *   **World 2:** Pop: 10,010M, Total Welfare: (10M * 60) + (10B * 6) = 600M + 60B = 60.6 Billion, **Average: 60.6 Billion / 10,010M ≈ 6.05**
      *   **AU Verdict:** World 1 (Average 100) is vastly better than World 2 (Average ~6.05). This aligns perfectly with your rejection of massive aggregation of low-positive lives (#2).

  2.  **Added Lives Depend on Resources from Existing:**
      *   **Scenario:** World M: Ten Million at 100. World N: Original ten million at Y, plus ten million newcomers at Z (Z > 0), where Y < 100 because resources were diverted to create/sustain the newcomers.
      *   **AU Analysis:** The value depends on the *new average*.
          *   Calculate Average M: 100.
          *   Calculate Average N: (10M * Y + 10M * Z) / 20M = (Y + Z) / 2.
      *   **AU Verdict:** World N is better than M *only if* (Y + Z) / 2 > 100. For example:
          *   If Y=99, Z=5: Average N = (99+5)/2 = 52. N is *worse* than M (Avg 100).
          *   If Y=90, Z=30: Average N = (90+30)/2 = 60. N is *worse* than M (Avg 100).
          *   If Y=80, Z=130: Average N = (80+130)/2 = 105. N is *better* than M (Avg 100). (This would require the newcomers to be *exceptionally* well-off due to the resources taken).
      *   **Key Point:** AU prioritizes the average. Taking resources from existing people (lowering Y) to add new people (at Z) is only justified if the newcomers are so well-off that they raise the average *despite* the loss to the original population. Small gains for newcomers at the cost of significant losses to the existing population will make the world worse on AU. This aligns with prioritizing the welfare of those who exist against the *potential* good of adding new lives unless the new lives dramatically improve the average.

  **Conclusion:**

  Your strongest intuitions (rejecting massive aggregation of low-positive lives, rejecting negative additions, valuing authenticity, ignoring identity) point forcefully toward **Refined Average Utilitarianism**. The cost is abandoning the intuition that *any* addition of worthwhile lives is intrinsically good (#1) or neutral (#3) regardless of the effect on the average. This cost is necessary for consistency and to uphold your powerful anti-aggregation stance (#2). AU provides a clear, principled framework that handles your other verdicts well and gives determinate answers to the new cases, emphasizing that adding lives only improves the world if it raises the average welfare, especially when resources are finite.
