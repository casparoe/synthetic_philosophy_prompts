  Then: "So when we say that you could have been a banker, we are not describing you in any other world. We are describing a different individual -- your counterpart..." This is mostly okay. The counterpart is a different individual, but the claim isn't that we're describing the counterpart per se. The truth conditions involve the counterpart, but the statement is still about the actual individual. The user is unsure about the inference from "counterpart isn't you" to "the claim is about someone else," which is a key point here.

  The next part: "It follows that, strictly speaking, you have no modal properties at all..." This is where the summary goes wrong. Lewis would say that modal properties are relational, not non-existent. The counterpart relation allows de re modal claims to be about the actual individual via their counterparts. So saying "I could have been a banker" is true because of my counterpart, but it's still attributed to me. The user's confusion here is valid.

