              - (b) Because the policy was made rationally and you should stick to it resolutely: Leaf: "Resolute Choice View" (required by the initial plan).
              - (c) Because following such a policy has good consequences overall: Leaf: "Rule-Consequentialist View" (allowed, sometimes required if the rule is optimal).

