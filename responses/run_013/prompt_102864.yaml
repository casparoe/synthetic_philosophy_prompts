          For (a): Leaf: "Empty or Not a Defense" - If only the act's consequences matter, then past costs are sunk and should not affect the act. Any indirect effect (like regret) would be a future consequence and thus part of the act's consequences, so this isn't honoring sunk costs per se.

          For (b): go to Q7
          For (c): Leaf: "Virtue-Theoretic View" - Honoring sunk costs can be rational as an expression of virtues like perseverance or commitment (allowed, sometimes required).

          Q7: Why follow a policy of honoring sunk costs in this case?
