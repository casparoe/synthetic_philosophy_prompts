answer: |-
  Below is a decision tree designed to map commitments to positions on sunk costs, using concrete cases to force distinctions. The tree starts with foundational questions, branches through key commitments, and ends with named positions (or empty combinations). Each internal node is a question answerable via a case-based intuition. Positions are separated by their core justifications (e.g., temporal identity, rule-consequences) rather than labels.

  ---

  ### **Decision Tree: Can Sunk Costs Be Rationally Action-Guiding?**  
  *Start with Q1 for a case like: "You bought a non-refundable concert ticket but feel ill on the day. Does the money spent *itself* give you a reason to attend?"*

  #### **Q1: Do past costs (e.g., ticket price) provide a direct reason to continue, independent of future outcomes?**  
  - **Yes** → Past costs are intrinsically reason-giving (e.g., "Wasting money feels wrong"). Go to Q2.  
  - **No** → Past costs only matter indirectly (e.g., via incentives or emotions). Go to Q3.  

  #### **Q2 (If Yes): In a failing research project you’ve sunk 3 years into, is the primary agent of your decision:**  
  - **A single time-slice** (only your present self) → **Leaf: Incoherent**. *Diagnosis*: A time-slice didn’t incur past costs, so they can’t be direct reasons.  
  - **A temporally extended self** (you across time) → Go to Q4.  
  - **A collective/institution** (e.g., a lab or firm) → **Leaf: Institutional Integrity View (Direct)**. Honoring sunk costs is required to maintain institutional commitments (e.g., a firm completes a doomed product to uphold stakeholder trust).  

  #### **Q4 (If temporally extended self): When staying in a bad relationship due to time invested, is the core reason about self-continuity?**  
  - **Yes** → **Leaf: Narrative-Identity View**. Honoring sunk costs is required for narrative coherence (e.g., "Quitting betrays my past self’s sacrifices").  
  - **No** → **Leaf: Unoccupied**. *Diagnosis*: Direct reasons for temporally extended selves typically reduce to narrative; alternatives are unstable.  

  #### **Q3 (If No from Q1): Can past costs indirectly justify continuing (e.g., via future effects)?**  
  - **Yes** → Go to Q5.  
  - **No** → **Leaf: Strict Marginalism/Evidential View**. Sunk costs are irrelevant (only future costs/benefits matter). Exception: past costs as *evidence* (e.g., "High R&D spending suggests future success").  

  #### **Q5 (If Yes): For a firm considering ending a costly war, is the unit of rationality:**  
  - **Individual acts** (this decision alone) → **Leaf: Empty**. *Diagnosis*: If sunk costs don’t directly matter, they can’t indirectly justify *this act* without appealing to policies/character.  
  - **Policies/rules** (e.g., "always finish projects") → Go to Q6.  
  - **Character/virtues** (e.g., "being tenacious") → **Leaf: Virtue-Theoretic View**. Honoring sunk costs is allowed (sometimes required) to express virtues like perseverance (e.g., finishing a meal you hate to avoid wastefulness).  

  #### **Q6 (If policies/rules): Should a person finish a hated meal to avoid waste?**  
  - **Yes, to bind future choices** (e.g., "Otherwise I’ll quit everything") → **Leaf: Sophisticated Commitment-Device View**. Honoring sunk costs is required to enforce personal rules against impulsivity.  
  - **Yes, because the rule itself is rational** (e.g., "I chose this rule in a calm moment") → **Leaf: Resolute-Choice View**. Honoring sunk costs is required to maintain prior resolutions.  
  - **Yes, due to broader consequences** (e.g., "If everyone did this, waste would decrease") → **Leaf: Rule-Consequentialist View**. Honoring sunk costs is allowed if general adherence has good effects (e.g., social norms against waste).  

  #### **Q5 Alternative (If collective agent): For a firm funding a doomed product, are sunk costs honored due to group dynamics?**  
  - **Yes** → **Leaf: Institutional View (Indirect)**. Honoring sunk costs is required to maintain morale, credibility, or stakeholder trust (e.g., "Canceling demoralizes teams").  

  ---

  ### **Tree Summary**  
  - **Leaves (Positions)**:  
    1. **Strict Marginalism/Evidential View**  
    2. **Institutional Integrity (Direct)**  
    3. **Narrative-Identity View**  
    4. **Virtue-Theoretic View**  
    5. **Sophisticated Commitment-Device View**  
    6. **Resolute-Choice View**  
    7. **Rule-Consequentialist View**  
    8. **Institutional View (Indirect)**  
    9. **Incoherent** (time-slice + direct reasons)  
    10. **Unoccupied** (temporally extended self + non-narrative direct reasons)  
    11. **Empty** (individual acts + indirect reasons)  

  - **Key Diagnostics**:  
    - **Q1** separates *direct-reason* views (Narrative, Institutional-Direct) from *indirect* views (Commitment, Rule-Consequentialist).  
    - **Q2/Q5** isolates *institutional* and *temporal identity* commitments.  
    - **Q6** distinguishes policy-based views (Commitment vs. Resolute vs. Rule-Consequentialist).  

  - **Unseparated Positions**:  
    - **Rule-Consequentialist vs. Institutional (Indirect)**: Both appeal to consequences, but the tree splits them by agent (individual vs. group). If group agents blur into "social rules," these may merge.  
    - **Resolute vs. Commitment-Device**: Separated by *why* policies matter (fidelity vs. incentive-shaping), but cases like "finishing research" may blur if both apply.  

  - **Artificialities**:  
    - **Agent Identity (Q2/Q5)**: Forces a discrete choice (time-slice/extended/collective), though real agents may hybridize.  
    - **Direct/Indirect (Q1)**: Some views (e.g., Virtue) blur this; the tree prioritizes justificatory structure over mechanisms.  

  - **Empty/Unoccupied Combinations**:  
    - **Time-slice + direct reasons**: Incoherent (past costs can’t bind a momentary self).  
    - **Temporally extended + non-narrative direct reasons**: Unstable (no major theory defends this).  
    - **Individual acts + indirect reasons**: Empty (indirect effects require cross-temporal or policy-based reasoning).  

  ---

  ### **How to Use**  
  - **In the seminar**: Have participants walk through the tree with their own intuitions about cases (e.g., concert tickets, research projects).  
  - **Debate focus**: Positions clash at branching points (e.g., Q1 for marginalists vs. narrativists; Q6 for resolute vs. commitment views).  
  - **Output**: Participants land on a named position, revealing their core commitments (e.g., "You’re a rule-consequentialist if you honor sunk costs for meal waste to uphold social norms").  

  This tree forces distinctions between "sunk cost rationalizers" by stressing *why* past costs matter (directness, identity, rules) rather than the fallacy binary. It also exposes unstable commitments (e.g., time-slice direct reasons) and institutional exceptions.
