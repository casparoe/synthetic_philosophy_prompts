answer: |-
  ### IN THE COURT OF APPEALS FOR THE COMMONWEALTH OF COHERENCE  
  *No. 23-1578*  

  **SYLLABUS**  
  A fiduciary who executes disclosed, fee-based transactions at a client’s direction commits no breach where the client’s preferences are intransitive and vulnerable to a money pump. The defect lies in the client’s foresight, not the broker’s conduct, and the law’s sole standard of rationality is immunity to pumping.  

  ---

  **OPINION OF THE COURT**  
  Delivered by CHIEF JUSTICE THRANE  

  1. **The Facts and Procedural Posture.** Plaintiff-Appellant, a sophisticated investor, held cyclic preferences over three assets: he preferred Asset A to B, B to C, and C to A. Defendant-Appellee, a licensed broker, executed a series of transactions at Appellant’s request: converting A to B (for a $500 fee), B to C ($500), and C to A ($500). This cycle repeated six times, draining $9,000 from Appellant’s account while returning him to Asset A. Appellant sued for breach of fiduciary duty, alleging Appellee exploited his irrationality. The District Court granted summary judgment to Appellee. We affirm.  

  2. **The Governing Doctrine.** Under *In re Preference Pumping Litigation*, 5 Comm. Dec. Theory Rep. 112 (2010), and the Rational Transactions Act (RTA) § 2(b), rationality is defined as immunity to exploitation via arbitrage of preference cycles. A fiduciary breaches no duty by facilitating transactions consistent with a client’s expressed preferences, however disordered, absent fraud or nondisclosure. Here, Appellee disclosed all fees and acted solely at Appellant’s direction. The RTA demands no more.  

  3. **The Pump and Its Economic Mechanics.** Appellant contends the cycle impoverished him. True—but only because each trade carried a cost. Had transactions been costless, cycling would have been harmless (*Preference Pumping*, 5 CDTR at 119). This distinction is immaterial. The law assesses disclosed costs as inherent to real-world markets; it does not entertain counterfactuals of frictionless exchange. Appellant’s loss stems from his willingness to pay for each preferred shift, not from Appellee’s levying of agreed fees.  

  4. **Foresight and Naivety.** Appellant claims he did not anticipate the full cycle ex ante. Had he done so, he concedes he would have rejected the initial trade. This confirms the flaw lay in his foresight, not Appellee’s conduct. The RTA evaluates choices *as presented* at each decision node (*see Agency Order No. 12*, 7 CDTR App. 3). A fiduciary need not rescue clients from myopia.  

  5. **Resolute Choice Rejected.** Appellant’s expert urged that commitment to a plan—e.g., retaining Asset A—would have averted exploitation. But the law recognizes no "plan" as a unit of accountability. Each transaction stands alone under RTA § 5(c): "A preference is tested at the moment of choice among immediately available options." At Node 1 (holding A), Appellant preferred B; at Node 2 (holding B), he preferred C; at Node 3 (holding C), he preferred A. Each choice was rational when isolated.  

  6. **Extended Preferences Unavailing.** The expert further proposed that ranking "whole trajectories" (e.g., "retain A indefinitely" vs. "cycle endlessly") would have precluded intransitivity. We do not dispute this. But the law takes preferences as it finds them: option by option, in the sequence presented. Appellant’s preferences were elicited and recorded per transaction. We decline to impose a duty on fiduciaries to remodel clients’ preference structures.  

  7. **The Limits of the Pump’s Mandate.** Appellant’s expert correctly observes that vulnerability to pumping only necessitates acyclicity of *strict* preference—not full compliance with expected-utility axioms like completeness or the sure-thing principle (*cf. Rationality Standards Commentary*, 9 CDTR 45, 67). This distinction, however, is academic. The RTA’s test is pragmatic: immunity to pumping is the *sole* criterion for legal rationality. Whether other infirmities (e.g., incompleteness) could support a claim under different facts is not before us. We note only that incompleteness, unlike intransitivity, requires additional premises (e.g., indifference exploited by coercion) to enable pumping—a matter we reserve.  

  8. **The Self-Torturer Paradigm.** Appellant analogizes his position to the "self-torturer" in his testimony: a device allowing imperceptibly incremental increases in pain, each step deemed worth its monetary reward, culminating in agony. This is not a distinct pathology but intransitivity’s temporal cousin. Just as the self-torturer’s local choices are rational yet globally ruinous, so too Appellant’s stepwise preferences were lawful at each trade. The law intervenes only where preferences are pump-susceptible—a threshold crossed here.  

  ---

  **ORDER**  
  The judgment of the District Court is AFFIRMED. Appellant shall bear costs. Pursuant to RTA § 7, Appellant is directed to submit to preference-completion therapy by a court-certified decision therapist,费用 wholly borne by Appellant, within 90 days. Failure may result in contempt.  

  *It is so ordered.*  

  ---  
  **Counsel:**  
  For Appellant: Elias Trent, *Trent & Vorhaus*  
  For Appellee: Mara Voss, *Voss Barclay*  
  **Reporter:** 12 Comm. Dec. Theory Rep. 308 (2024)
