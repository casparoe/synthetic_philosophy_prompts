   Required elements:
   1. Economics of the pump: note that without per-trade costs, cycling would be harmless. The court acknowledges and disposes of this in a clause.
   2. Naivety vs. sophistication: The plaintiff didn't foresee the whole sequence. Had he seen it, he could have refused the first trade. The court blames the plaintiff's foresight.
   3. Resolute choice: The plaintiff's expert argues that if the plaintiff had adopted a plan and stuck to it, he wouldn't have been pumped. The court says the law looks at each transaction individually, not at plans.
   4. Extended preferences: The expert says that ranking whole trajectories avoids cycles. The court says preferences are taken option by option as they are presented.
   5. Gap between acyclicity and EU: The expert notes that the pump only requires acyclicity, not full EU representation. The court concedes in one sentence but says the law's standard is the pump and nothing more, so the distinction is too fine.
   6. Incompleteness: The court notes that incompleteness (a different disorder) would require more to yield a pump, and declines to decide if the statute reaches it.
   7. The self-torturer: The court compares the plaintiff to a device that leads to agony by small increments, seen as the same disorder.

   Form: syllabus (one or two sentences), numbered paragraphs, formal order.

   Voice: dry, authoritative, unhesitating. Never state objections to the doctrine, never concede coherence is one virtue among several, never let any character speak for the author. Use fictional authorities.

