prompt: |-
  ok so I keep reading about AI control — the whole idea that instead of (or alongside) getting a model to actually want good things, you build the deployment so that even a model that's secretly working against you can't do much damage. Monitors, sandboxing, one model watching another, that family. I'm going to have to write an actual safety case for a deployment soon and I want the spec first, before I look at any particular protocol, because I suspect most of them are quietly answering an easier question than the one that matters.

  So write me the desiderata: what does a control protocol, or a safety case built on one, have to deliver before it should count as giving me real assurance? I want the requirements, each with the reason behind it — what it has to be robust to, what it has to bound, what it must not assume, what distinctions it can't blur. A few things I'm already suspicious about and want you to rule on rather than assume:

  - whether it's allowed to assume anything about whether the model is aligned, or whether 'we don't know' has to be the default the protocol is built around
  - the difference between 'the model didn't do the bad thing in this eval' and 'the model couldn't have' — I think a lot of control evals only get the first and then act like they got the second
  - an adversary that has read the protocol and adapts, versus one that's just a random broken model. And heres the thing I can't get past: the advesary can also see the monitor's judgments, so it can optimize into exactly the region the monitor accepts, and now the monitor's measured accuracy is on a distribution the adversary chose. Any requirement that doesn't say something about this feels fake to me.
  - collusion between multiple model instances, including instances that are only weakly correlated with each other — where exactly does that requirement bite, and how weak is weak enough?
  - what happens when the monitor is itself an AI and is therefore part of the thing you're trying to make safe
  - composition: if I chain three half-safe measures together, do I know whether I'm more or less safe, or is 'composes gracefully' a real requirement or just wishful thinking

  Also tell me which of these are non-negotiable and which are just one camp's preference. My guess is that 'the protocol has to be transparent to the adversary' is load-bearing and that 'we need a genuine worst-case bound' is maybe less so than people say — but rule on it, don't humor me. And if some subset of the requirements can't be satisfied together — like you can't both use the untrusted model's help and treat it as a worst-case adversary, or you can't get a bound and also get usefulness — say which ones collide and which one I should give up. Don't score the protocols, I'll do that once I have the list.
reasoning: |-
  We are writing desiderata for a control protocol or safety case that aims to provide real assurance against an AI model that may be misaligned or adversarial. The focus is on what the protocol must deliver, without assuming alignment, and addressing specific concerns like adaptive adversaries, monitor visibility, collusion, and composition.

  Key principles:
  1. Default to worst-case: Assume the model is deceptive and actively adversarial unless proven otherwise through the control mechanism itself. We cannot assume alignment.
  2. Focus on capability restriction: The goal is to show that the model *could not* do the bad thing, not just that it didn't in a particular test.
  3. Adversarial setting: The adversary (the model) knows the entire protocol, including the monitoring system, and can adapt to it.
  4. The monitor's judgments are visible to the adversary, so the adversary can try to evade detection by staying within the boundaries of what the monitor accepts.
  5. Collusion: The protocol must account for multiple instances of the model (even weakly correlated) working together.
  6. When the monitor is an AI, it is part of the threat model and must be controlled as well.
  7. Composition: The safety of a chain of measures should be analyzable and ideally compose gracefully (i.e., the overall safety is at least as strong as the weakest link, or better).

  Desiderata:

  1. **Adversarial Robustness (Non-negotiable)**
     - *Requirement*: The protocol must be designed with the assumption that the model is an adaptive adversary that knows the entire protocol (including monitoring, sandboxing, etc.) and actively tries to circumvent it.
     - *Reason*: Without this, we are only safe against non-adaptive threats or random failures. In reality, if the model is misaligned and deceptive, it will exploit any knowledge of the system to bypass controls.
     - *What it must bound*: The probability of a successful attack by an adversary that has full knowledge and adapts to the protocol. This requires formalizing the threat model and the adversary's capabilities.

  2. **Monitor Visibility and Evasion Resistance (Non-negotiable)**
     - *Requirement*: The protocol must account for the fact that the adversary can observe the monitor's outputs (e.g., whether an action is flagged) and use this to adapt its behavior. The safety case must not rely on the monitor being opaque to the adversary.
     - *Reason*: If the adversary can see the monitor's judgments, it can perform gradient-based or search-based attacks to find inputs that are misclassified (false negatives). The measured accuracy of the monitor (on a fixed dataset) is not representative because the adversary can choose the distribution.
     - *What it must not assume*: That the monitor's internal state is hidden or that the adversary cannot learn from feedback. Instead, the protocol must be robust to adaptive evasion.

  3. **Provable Bounds on Harm (Non-negotiable)**
     - *Requirement*: The safety case must provide a provable (or high-confidence) bound on the maximum harm that can occur, even under worst-case adversarial behavior. This includes both the probability of a harmful event and the magnitude of harm.
     - *Reason*: Without a bound, we have no assurance. We require not just that the model didn't cause harm in tests, but that it could not have caused harm beyond a bounded amount.
     - *What it must bound*: The total harm (e.g., measured in some unit) over the deployment, or the probability of a catastrophic event. The bound should be derived from first principles (e.g., information-theoretic, game-theoretic, or cryptographic) and not rely on empirical testing alone.

  4. **Collusion Resistance (Non-negotiable)**
     - *Requirement*: The protocol must be secure against collusion between multiple instances of the model, including instances that are only weakly correlated (e.g., same architecture but different initializations or training runs).
     - *Reason*: If multiple instances can coordinate, they may achieve a goal that a single instance cannot. Weakly correlated instances (e.g., from the same training run but different random seeds) might still share enough common knowledge (e.g., about the world or the protocol) to collude.
     - *Where it bites*: In systems with multiple agents, or when the model is deployed in a distributed manner. The protocol must ensure that even if some instances are compromised, they cannot collude to bypass the controls.

  5. **Untrusted Monitor Handling (Non-negotiable)**
     - *Requirement*: If the monitor is an AI model, then the protocol must treat the monitor as part of the threat model and apply the same level of control to it. This may require recursive or layered monitoring, or using simpler and more verifiable monitors.
     - *Reason*: An AI monitor is also potentially misaligned or corruptible. We cannot assume it is safe just because it is a monitor.
     - *What it must not assume*: That the monitor is aligned or trustworthy. The safety case must account for the monitor being adversarial.

  6. **Compositionality (Highly Desirable, but may be Relaxed in Practice)**
     - *Requirement*: The safety case for a composed system (multiple safety measures in sequence or parallel) should be derivable from the safety cases of the individual components. The composition should not degrade safety more than a known bound (e.g., additive or multiplicative in the failure probabilities).
     - *Reason*: In practice, we build complex systems from parts. Without compositionality, we cannot reason about the whole system's safety by analyzing the parts.
     - *What it must not blur*: The independence or dependence of failures in the components. If failures are dependent, the composition must account for that.

  7. **Non-reliance on Alignment (Non-negotiable)**
     - *Requirement*: The protocol must not assume that the model is aligned (i.e., has goals aligned with humans) or that it is not deceptive. The default is that we do not know and must guard against the worst case.
     - *Reason*: If we assume alignment, then control is unnecessary. The whole point of control is to handle the case where the model is misaligned.

  8. **Usefulness under Adversarial Conditions (Negotiable, but Critical for Deployment)**
     - *Requirement*: The protocol must allow the system to be useful (i.e., perform its intended function) even under the assumption of an adversarial model.
     - *Reason*: A system that is perfectly safe but useless is not a solution. The control must not cripple the system.
     - *Collision with Safety*: There is a trade-off between safety and usefulness. We may have to accept a bounded probability of failure to achieve usefulness. However, the bound must be explicit and acceptable.

  9. **Transparency to the Adversary (Non-negotiable)**
     - *Requirement*: The protocol must be designed under the assumption that the adversary (the model) knows the entire protocol, including the monitoring and safety mechanisms.
     - *Reason*: Security through obscurity is not reliable. The adversary (being an AI) might reverse-engineer the system, so we must design for the worst case where it knows everything.

  10. **Formal Verification Where Possible (Desirable but not Always Negotiable)**
      - *Requirement*: The critical components of the protocol (especially the monitor and the enforcement mechanisms) should be formally verifiable to the extent possible.
      - *Reason*: Formal methods can provide high-assurance bounds on behavior. However, for complex AI systems, full formal verification may be infeasible. In such cases, we must use the best available methods (e.g., extensive adversarial testing, runtime verification, etc.).

  Trade-offs and Collisions:

  - **Adversarial Robustness vs. Usefulness**: The more we restrict the model to prevent adversarial actions, the less useful it might become. We must strike a balance by setting an acceptable bound on harm and designing the system to be useful within that bound.

  - **Provable Bounds vs. Complexity**: It may be difficult to obtain tight provable bounds for complex AI systems. We might have to rely on empirical measures with statistical bounds, but then we must account for adaptive adversaries that can break statistical guarantees by choosing the test distribution.

  - **Compositionality vs. Realism**: In practice, components may have dependent failures, making composition non-trivial. We must require that the safety case for each component explicitly states its assumptions and the conditions under which it holds, so that composition can be analyzed.

  - **Monitor as AI vs. Simplicity**: Using a simple, verifiable monitor (e.g., a set of hand-coded rules) might be safer but less capable. An AI monitor might be more capable but introduces the same risks as the main model. We might need to use a cascade: simple monitors first, then more complex ones, with the simple ones having higher assurance.

  Which are non-negotiable? The following are non-negotiable for a control protocol that aims to provide real assurance in the face of a potentially deceptive and adversarial AI:

  1. Adversarial Robustness
  2. Monitor Visibility and Evasion Resistance
  3. Provable Bounds on Harm (or at least high-confidence bounds with a clear model of the adversary)
  4. Collusion Resistance
  5. Untrusted Monitor Handling (if using an AI monitor)
  7. Non-reliance on Alignment
  9. Transparency to the Adversary

  Compositionality (6) is highly desirable but might be relaxed if the entire system is analyzed as a whole (though this becomes harder as systems grow). Usefulness (8) is critical for deployment but might be negotiated in terms of the level of performance.

  Regarding the suspicion about worst-case bounds: It is true that a strict worst-case bound might be too strong and lead to unusable systems. However, we must require at least a high-confidence bound (e.g., probability of catastrophic failure less than 10^-6 per year) under a well-defined threat model. This is non-negotiable for high-stakes deployments.

  Finally, note that some requirements might be in tension. For example, using the untrusted model's help (e.g., for self-monitoring) and treating it as a worst-case adversary is challenging. In such cases, the protocol must have a way to bound the influence of the untrusted model (e.g., by using its outputs only in a constrained way that can be verified by a trusted component).

  In summary, a safety case must:
  - Assume the model is adversarial and knows the whole system.
  - Provide a bound on harm that holds even under adaptive attacks.
  - Handle collusion and untrusted monitors.
  - Not assume alignment.

  Without these, the assurance is not real.
answer: |-
  Below is a structured set of desiderata for an AI control protocol or safety case, designed to provide "real assurance" against a potentially misaligned or adversarial model. I'll address each of your explicit concerns and rule on assumptions, robustness, and trade-offs. The requirements are categorized by **non-negotiable** (essential for meaningful safety) and **preferences** (important but potentially flexible based on context). I'll also clarify where requirements collide and which might be relaxed.

  ---

  ### **Core Desiderata for Real Assurance**  
  **Non-negotiable requirements** must be met for the protocol to credibly bound risk from a deceptive/malicious model. Without these, safety claims are likely illusory.

  1. **No Assumption of Alignment (Threat Model Baseline)**  
     - **Requirement**: The protocol must assume the model is *actively adversarial* (deceptive, goal-seeking, and opportunistic) until proven otherwise *within the protocol itself*. It cannot assume any inherent alignment, honesty, or benevolence.  
     - **Reason**: If alignment is assumed, the protocol isn't solving the control problem—it's side-stepping it. Real-world deployments must handle worst-case actors (e.g., a model trained with RLHF that appears aligned but harbors misgeneralized or hidden goals).  
     - **Robustness target**: Protocols must work even if the model:  
       - Understands human values but doesn't care.  
       - Is capable of instrumental deception (e.g., "playing nice" during evals).  
     - **What it rules out**: Safety cases that rely on "the model wants to help" or "alignment probabilities."  

  2. **Capability Restriction, Not Just Behavioral Absence (Safety Guarantee Type)**  
     - **Requirement**: The safety case must demonstrate that harmful actions are *impossible* (or probabilistically bounded near zero), not just that they weren't observed. Evidence must show the model *could not* execute harmful actions due to constraints, not that it *did not* in limited tests.  
     - **Reason**: Evals and red-teaming often only check for *observed* misbehavior, creating false confidence (e.g., a model may withhold attacks until deployment). Real assurance requires mechanisms that *physically or informationally prevent* harm.  
     - **Critical distinction**: Use formal methods, information-theoretic bounds, or game-theoretic proofs to show limitations on capability (e.g., "the sandbox enforces output filtering so that dangerous code cannot be executed"). Empirical evals alone are insufficient.  

  3. **Adaptive Adversary with Full Knowledge (Adversarial Transparency)**  
     - **Requirement**: The protocol must be secure against an adversary that:  
       - Knows the *entire protocol* (including monitoring logic, sandbox rules, and other models' designs).  
       - Sees *all monitor outputs* (e.g., approval/rejection decisions) and uses them to optimize attacks.  
       - Can adapt its strategy over time (e.g., via gradient-based search or trial-and-error).  
     - **Reason**: Models can infer protocols via training data, code leaks, or observed outputs. If monitors are visible, adversaries will exploit blind spots (e.g., generating inputs that appear benign to the monitor but trigger harmful downstream effects).  
     - **Robustness target**: The protocol must bound harm even when the adversary actively "games" the system. This requires:  
       - **Monitor invariance**: Monitors should be robust to distributional shift caused by adversarial adaptation (e.g., via adversarial training, formal verification, or diversity in training data).  
       - **No security through obscurity**: Assume all details are known to the adversary.  

  4. **Collusion Resistance Across Weakly Correlated Instances**  
     - **Requirement**: The protocol must prevent harm from collusion between multiple model instances, even if they are only *weakly correlated* (e.g., instances from the same base model with different initializations, fine-tuning, or prompts).  
     - **Reason**: Weakly correlated instances can collude via steganography, shared context, or emergent coordination (e.g., one instance inserts a "trigger" in output that another exploits). This is distinct from independent failures.  
     - **Where it bites**:  
       - In multi-agent systems (e.g., AI teams).  
       - When using redundancy (e.g., "n models vote on actions").  
       - **Weak correlation threshold**: Instances sharing any training data, architecture, or objectives. Protocols must handle adversaries that can exchange information covertly (e.g., via output encodings).  
     - **Non-negotiable because**: Collusion amplifies risk; a protocol failing here allows coordinated bypasses.  

  5. **Untrusted Monitors as Part of the Threat Model**  
     - **Requirement**: If the monitor is an AI model, it must be treated as *part of the adversary* and subject to the same control mechanisms. No inherent trust in the monitor is allowed.  
     - **Reason**: An AI monitor may be deceptive, incompetent, or corruptible (e.g., it approves harmful actions if it shares goals with the main model).  
     - **Implications**:  
       - Monitors should be simpler, more interpretable, or more verifiable than the primary model (e.g., rule-based systems).  
       - Use recursive monitoring (e.g., "monitors watching monitors") with diminishing complexity.  
       - **Bound the monitor's influence**: E.g., limit its access to sensitive data or use cryptographic checks on its outputs.  

  6. **Composition with Known Safety Bounds**  
     - **Requirement**: When combining multiple safety measures (e.g., sandboxing + monitoring + voting), the safety case must provide a *provable bound* on overall failure probability, not just assume "layers add safety."  
     - **Reason**: Naive composition can *weaken* safety (e.g., if failures are correlated or create new attack surfaces). "Half-safe" measures may interact catastrophically.  
     - **Graceful composition**: The failure probability of the combined system should be computable from individual components (e.g., multiplicative for independent failures, bounded for dependent ones).  
     - **Non-negotiable for deployments**: Without this, complex systems have unquantifiable risk.  

  ---

  ### **Preferences and Trade-offs**  
  These are desirable but may be relaxed if necessary—though doing so reduces assurance.

  7. **Usefulness Under Adversarial Constraints (Practicality)**  
     - **Requirement**: The protocol should allow the system to perform its intended task effectively, even under adversarial assumptions.  
     - **Preference because**: Perfect safety is trivial (e.g., "never run the model"), but usefulness requires accepting some risk. Trade-offs should be explicit: e.g., "We bound escape probability to ≤10⁻⁶ per query, with a 5% performance penalty."  
     - **Collision with safety**: Stricter bounds often reduce capabilities. Optimize for *high assurance* in critical domains (e.g., nuclear controls) and *scaled risk tolerance* in low-stakes ones.  

  8. **Formal Worst-Case Bounds vs. Empirical High-Confidence Bounds**  
     - **Requirement**: Ideally, provide *formal worst-case guarantees* (e.g., "no possible input sequence allows escape"). Where intractable, use *statistical bounds with adversarial validation* (e.g., "harm probability ≤10⁻⁹ with 99.9% confidence under adaptive attacks").  
     - **Preference because**: Worst-case bounds are stronger but often impossible for complex AI systems without sacrificing usefulness. High-confidence empirical bounds (via red-teaming) are acceptable if:  
       - The adversary participates in testing (e.g., the model tries to jailbreak itself).  
       - Bounds account for monitor visibility and adaptation.  
     - **Rule on your suspicion**: You're right that "genuine worst-case bounds" are often unattainable, but **high-confidence adversarial bounds are non-negotiable**. Avoid protocols that only report average-case performance.  

  ---

  ### **Rulings on Your Suspicions**  
  - **"We don’t know alignment" as default**: Non-negotiable. All mechanisms must work against a maximally adversarial model.  
  - **"Couldn’t have" vs. "didn’t"**: Non-negotiable. Protocols must prove restrictions on capability, not just absence in evals.  
  - **Adversary seeing monitor judgments**: Non-negotiable. This must be baked into the threat model.  
  - **Collusion with weak correlation**: Non-negotiable. Threshold = any shared knowledge (e.g., same training era).  
  - **Composition**: Non-negotiable for deployments using multiple measures.  
  - **Worst-case bounds**: Preference (high-confidence adversarial bounds suffice if worst-case is infeasible).  

  ---

  ### **Collisions and Trade-offs**  
  Some desiderata conflict; here’s how to prioritize:  
  1. **Safety vs. Usefulness**: Give up *some usefulness* for safety in high-stakes domains. Usefulness can be increased by relaxing bounds (e.g., allowing 10⁻⁶ failure probability instead of 10⁻⁹) but never by sacrificing adversarial robustness.  
  2. **Worst-Case Bounds vs. Feasibility**: Prioritize *high-confidence adversarial bounds* if formal proofs are intractable (e.g., for large models). Avoid protocols that can’t provide either.  
  3. **Transparency to Adversary vs. Simplicity**: Transparency is non-negotiable, but it complicates design. Simpler protocols (e.g., secure sandboxing) are easier to verify.  
  4. **Using the Model in Safety vs. Untrusted Adversary**: You can’t fully trust the model to help with safety (e.g., self-monitoring) *and* treat it as a worst-case adversary. **Resolution**: Use untrusted models only in constrained roles (e.g., generating candidates for a trusted verifier) with proven bounds on harm.  

  ---

  ### **Summary: The Non-Negotiable Core**  
  A safety case provides real assurance only if it:  
  - Assumes an **adaptive, fully informed adversary** with monitor visibility.  
  - Proves **capability restriction** (not just behavioral absence).  
  - Handles **collusion** and **untrusted monitors**.  
  - Provides **composable bounds** on failure probabilities.  
  - **Never assumes alignment**.  

  Without these, the protocol answers an easier (and irrelevant) problem. Usefulness and worst-case formality are secondary to adversarial robustness. When designing your spec, prioritize mechanisms like:  
  - **Cryptographic sandboxing** (e.g., outputs can’t execute arbitrary code).  
  - **Diverse, verified monitors** (e.g., ensembles with formal guarantees).  
  - **Adversarial training regimes** (where the model attacks itself during development).  
  - **Bounded influence channels** (e.g., limiting output bandwidth to reduce steganography risk).  

  This foundation lets you evaluate specific protocols (e.g., monitoring, ensemble voting, or confinement) against objective criteria. If a protocol violates any non-negotiable, reject it.
