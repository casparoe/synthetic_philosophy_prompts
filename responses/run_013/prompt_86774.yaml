  Subject: Research Proposal: Diagnosing Apparent Intransitivity in 'Better Than' – A Contextualist Approach to Spectrum Arguments

  Thanks for considering this application. My proposed research tackles a persistent puzzle in population ethics and decision theory: the apparent intransitivity of the ‘better than’ relation revealed by spectrum arguments (leading to conclusions like Parfit’s Repugnant Conclusion) and the subsequent threat of money-pumps. The standard dialectic presents a trilemma: defend transitivity by rejecting a premise (e.g., denying the existence of lives barely worth living, or the ‘small improvement’ step), accept intransitivity and grapple with money-pumps, or deny the existence of a coherent ‘all-things-considered betterness’ relation altogether. I propose stepping outside this frame by rigorously examining ‘better than’ through the lens of linguistic semantics for gradable adjectives, arguing that the apparent intransitivity is likely an artefact of treating ‘better than’ as a context-insensitive relation over fully determinate alternatives, analogous to misapplying the semantics of ‘tall’.

  The core question is precise: **Does interpreting ‘A is better than B’ as a context-sensitive, potentially vague comparative adjective, similar to ‘taller than’, provide a more satisfactory diagnosis of the apparent intransitivity generated by spectrum arguments, and what are the implications for the presumed properties (transitivity, completeness) and the very coherence of a single, context-free ‘all-things-considered betterness’ relation essential for practical deliberation?** Crucially, this approach forces us to confront two specific challenges head-on: first, whether such contextualism preserves the *deliberative role* of an ‘all-things-considered’ better-than judgement intended to be objective and context-invariant; and second, whether standard money-pump arguments against intransitive preferences retain their force if preferences (modelled on betterness judgements) are understood as inherently context-sensitive.

  Existing positions leave this specific avenue underexplored. Work by philosophers like Larry Temkin forcefully argues for genuine intransitivity, while Derek Parfit, John Broome, and others explore rejecting premises or questioning the relation’s structure. Economists and decision theorists like McClennen or Schick offer sophisticated defences against money-pumps even with intransitivity. Meanwhile, linguists (Kennedy, van Rooij, Sassoon) and philosophers of language (Raffman, Graff Fara) provide detailed models of gradable adjectives, vagueness, and context-sensitivity applied to predicates like ‘tall’, ‘red’, or ‘rich’. However, systematic application of this linguistic machinery – particularly the semantics of comparatives involving vagueness and context-shift – to the ‘better than’ relation in ethical spectrum arguments is lacking. Some (e.g., Rachels, Handfield) gesture towards vagueness, but rarely engage deeply with the formal semantics or confront the specific challenges of the deliberative ‘all-things-considered’ role and the money-pump implications. The gap is the *rigorous integration* of these linguistic tools to diagnose the *source* of the apparent intransitivity in betterness spectra, explicitly testing whether it mirrors sorites-induced failures for other comparatives, and then grappling with the consequences for our foundational assumptions about value comparisons in decision-making. Nobody has systematically asked: if ‘better than’ behaves linguistically like ‘taller than’ in a sorites series, what does that mean for transitivity *as a constraint on the value relation itself*, versus a feature of how we *describe* it across contexts?

  The method involves a structured, six-month investigation:

  *   **Months 1-2: Deep Dive & Disambiguation:** Thorough review of key spectrum arguments (Parfit, Temkin) and the core dialectic. Simultaneously, detailed study of the formal semantics of gradable adjectives, comparatives, vagueness, and context-sensitivity (Kennedy, van Rooij, Lassiter). Crucially, map the *structural parallels* between value spectra (e.g., A+ > A > B+ > B ... > Z) and sorites series for height/colour/etc. Identify the specific linguistic mechanisms (e.g., contextual parameter adjustment, tolerance principles) invoked to explain apparent intransitivity/vagueness in non-normative cases. Flag points of genuine philosophical contention (e.g., Temkin vs Broome on premise deniability, or competing semantic frameworks).
  *   **Month 3: Applying the Framework:** Construct a model treating ‘better than’ as a context-sensitive comparative adjective. Analyse a canonical value spectrum argument using this model. Does the apparent intransitivity (A > B, B > C, but not A > C) plausibly arise from shifts in the relevant context (e.g., the comparison class, the threshold of significance, the ‘dimension of goodness’ in focus) between pairwise comparisons, rather than a property of the underlying value relation? This is the core diagnostic step.
  *   **Month 4: Confronting the ‘All-Things-Considered’ Challenge:** This month directly tackles your primary tripping point. Does the contextualist model render the notion of a single, objective, context-free ‘all-things-considered better than’ incoherent or merely complex? Can a ‘deliberative context’ be defined that fixes parameters sufficiently for practical choice? What does ‘all-things-considered’ *mean* if context-sensitivity is fundamental? Engage with critiques that contextualism collapses into relativism or fails to capture the normative force of betterness for rational choice. This is likely the most philosophically dense phase.
  *   **Month 5: Money-Pumps Revisited:** Analyse standard money-pump arguments under the contextualist model. If an agent’s pairwise choices reflect context-sensitive ‘better than’ judgements, does cycling behaviour (A chosen over B, B over C, C over A) necessarily indicate irrationality, or could it reflect rational responses to *shifting contexts* induced by the pump setup itself? Does contextualism defang the money-pump threat to the same extent as sophisticated choice defences, or differently? This tests the practical implications.
  *   **Month 6: Synthesis & Output:** Consolidate findings. Articulate clearly: What *is* preserved (e.g., transitivity within a fixed context?)? What must be relinquished (e.g., completeness? a single monolithic betterness relation? the simplicity of ‘all-things-considered’)? Draft a substantive paper presenting the contextualist diagnosis of spectrum arguments, its implications for the structure of value, its handling of the deliberative ideal, and its perspective on money-pumps.

  A successful result would be a coherent framework demonstrating that the apparent intransitivity in spectrum arguments is best explained as a context-shift artefact akin to sorites phenomena, accompanied by a clear account of which traditional assumptions about betterness (transitivity, completeness, monism) must be modified or abandoned in light of this diagnosis. Crucially, it would provide a *plausible* (though perhaps complex) story about how ‘all-things-considered better than’ functions contextually in deliberation, and show how money-pump arguments require careful reinterpretation. It would shift the debate away from the trilemma towards understanding the linguistic and contextual underpinnings of value comparison.

  The project would fail if it becomes clear that: 1) The linguistic parallel is too weak or inapt to illuminate the value case; 2) The contextualist account cannot provide a non-deflationary or coherent story about ‘all-things-considered’ betterness that retains its normative force for rational choice; 3) The tensions within the diagnosis (e.g., between context-sensitivity and the demand for objective deliberative conclusions) prove irreconcilable; or 4) The analysis simply replicates existing ‘vagueness’ proposals without the added value of formal semantics or confronting the two key challenges.

  Regarding scope: Six months is sufficient to produce a significant, publishable paper laying out the core argument, the diagnosis, and its major implications, including honest engagement with the deliberative and money-pump challenges. It will establish the framework and its advantages/disadvantages clearly. It is *not* sufficient for a book. A book would require expanding into: detailed comparisons with all major alternative positions (intransitivity, incomparability, denial); exploring specific applications across different ethical theories (utilitarianism, prioritarianism, pluralism); developing a full formal semantics integrated with decision theory; and potentially conducting empirical work on how people actually use ‘better than’ in spectrum-like choices. The proposed six months is the essential foundation – proving the core concept’s viability and value as a novel diagnosis. That foundation is achievable and constitutes a meaningful contribution.

  ---

  This draft keeps the core idea sharp, identifies the specific gap (applying *formal semantics* of gradable adjectives to betterness spectra while *confronting* the deliberative role and money-pumps), provides a concrete monthly plan, defines success/failure clearly, and gives an honest assessment of output (solid paper, not a book). It flags contested points without taking premature sides. Good luck with it!
