  ## Exhibit Panel: Ritual & Power at Late Bronze Age Dunwich Fen

  **HEADER:** THE DUNWICH FEN SETTLEMENT: EVIDENCE FOR SOCIAL COMPLEXITY (c. 1150-950 BCE)

  **Main Text:**
  Excavations at Dunwich Fen (Site DF-7) reveal a late Bronze Age settlement of significant scale and organization. The presence of over 30 deep, cylindrical storage pits, concentrated in the northern sector, indicates centralized food management beyond individual household needs. The consistent form and capacity (1.5-2m deep, 1m diameter) of these pits demonstrate standardized practices, implying coordinated labour and oversight. Analysis of faunal remains within 70% of the pits, dominated by cattle and sheep/goat bones exhibiting signs of butchery for consumption, confirms their primary function as grain and food stores. The estimated volume of these pits supports a settled population of 120-150 individuals.

  The discovery of a distinct cluster of 15 finely crafted, polished stone axes in Pit 27, deposited simultaneously and showing minimal use-wear, marks a significant departure from utilitarian storage. The deliberate placement of these valuable items, coupled with the absence of domestic debris within this specific pit, indicates a non-secular purpose. Such structured deposition strongly suggests ritual activity, likely associated with votive offerings or foundation rites.

  Further evidence for specialized activity is found in the recovery of 42 standardized pierced bone discs (avg. diam. 4.5cm) from a midden context near the settlement's core. The uniformity in size, material (predominantly bovine metapodials), and perforation technique indicates production beyond casual, domestic crafting. The presence of this standardized assemblage implies the existence of a dedicated workshop. Workshops producing non-essential, potentially symbolic items necessitate attached specialists supported by surplus resources. The support of such specialists indicates the presence of a controlling elite capable of directing labour and surplus.

  This emerging elite likely extended its influence into the spiritual realm. The discovery of Structure 4, featuring an extensively burnt clay floor (approx. 3m x 4m) sealed beneath a sterile layer, provides key evidence. The intensity and uniformity of the burning across the entire floor surface, inconsistent with accidental domestic fires, indicates deliberate, high-temperature firing. Such controlled conflagration within a defined structure is strongly indicative of ritualized destruction or purification practices. The maintenance and repeated use implied by such a specialized structure points towards an institutionalized priesthood responsible for mediating communal ritual.

  The pattern of deposition reinforces this interpretation. Three pits (Pits 8, 19, 33) contained no organic remains or artefacts, only sterile clay fills. Their location near Structure 4 and their deliberate emptiness, contrasting sharply with functional storage pits, suggests they served a symbolic or ritual purpose, perhaps as markers, offerings to chthonic forces, or components in a ceremonial landscape. The structured placement of the axe cache (Pit 27) and the burnt ritual floor (Structure 4) in close proximity further strengthens the identification of this zone as a focus for elite-sanctioned ceremonial activity, likely overseen by a hereditary priesthood legitimizing the elite's temporal authority through control of ritual knowledge.

  *While the precise nature of the beliefs held at Dunwich Fen remains beyond definitive reconstruction, the material evidence—standardized ritual objects, specialized structures, structured deposits, and evidence for attached craft production—paints a compelling picture of a community where social hierarchy was inextricably linked to the management of both material resources and spiritual practice during this period.*

  ---

  **SIDEBAR: WHAT THE OBJECTS TELL US!**

  *   **Look! Polished Stone Axes!** Found carefully placed together in one special pit. This wasn't an accident! People put them there on purpose, probably as a gift to their gods or ancestors around 1100 BCE. This proves they had important rituals!
  *   **Look! Pierced Bone Discs!** They're all almost exactly the same size and hole! That means someone really skilled was making lots of them, probably in a special workshop. Only important people (like chiefs or priests!) could have people making special things just for ceremonies.
  *   **Look! The Burnt Floor!** This whole room was burned super-hot on purpose! That wasn't a cooking fire. It was a special ritual fire, maybe to cleanse the place or send messages to the spirit world. Priests definitely did this!
  *   **Look! Empty Pits!** Three pits were dug but left totally empty! Why? Because sometimes the *act* of digging the pit in a special spot *was* the ritual! It was their way of talking to the earth or the gods below.
  *   **Look! Animal Bones!** Lots of cow and sheep bones in the storage pits tell us these people were farmers. But putting the fancy axes in a *clean* pit shows they knew the difference between everyday stuff and super-important sacred things. The priests made the rules!

  **(Panel Word Count: Approx. 640)**
