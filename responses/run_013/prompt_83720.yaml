prompt: |-
  I have no academic background. I write the on-screen text, the spoken prompts, and the printed quick-start card for a home battery-backup system made by a small company, and for two years I have been turning over a distinction I met in Hofstadter's Gödel, Escher, Bach: every message carries three things at once. There is the inner message, what it actually says. There is the outer message, what it says about itself — that it is a warning rather than a status update, that it was written by a manufacturer rather than a neighbor, that it is addressed to an electrician rather than to me. And there is the frame message, the thing that tells you how to decode the message at all, which as far as I can tell almost never sits inside the message it governs.

  I want that distinction turned into a procedure I can run on a string before I hand it to the localization agency. A batch is twenty strings, I am the only writer, and I have about two hours per batch. The strings then go out to a vendor and come back in sixteen languages; each must fit a forty-character display; each is also read aloud by a synthesized voice; and for three markets we ship a pictogram-only card, because the installers there read little of any written language. Every string also ends up in our web help center, where people arrive by search with none of the surrounding context left intact. One further complication: our automated quality tool compares each translation to the English and flags differences in length and in glossary terms. As best I can tell it only ever inspects the inner message, and I do not know what to make of that.

  Please give me the procedure: the questions in the order I should ask them, what counts as a sufficient answer to each, the point where the answer is simply no — where a string cannot be translated and has to be rebuilt as a pictogram or a tone instead — and the point where the question stops being factual and has to go to our regulatory sign-off, who handles anything touching electric shock and has no patience for theory. Tell me which parts of the three-level distinction must survive into the checklist and which I can throw away, and be honest about the steps that are judgment dressed up as procedure.

  I also have a half-invented fourth level for you to adjudicate: the message about who is being addressed and what that person is assumed to be allowed to do. Tell me whether that is genuinely distinct from the outer message or only the outer message seen from another angle, and if it is distinct, where it belongs in the procedure.

  Then run the procedure on three of my strings — Battery at 20 percent; non-essential circuits will be shut off soon; Error 41, contact your installer; and a card showing a figure opening the equipment enclosure with a bar through it — and include at least one case where the procedure tells me to do something I do not want to do. Finish by saying what the procedure cannot do, and which of my decisions it only appears to settle.
reasoning: |-
  Okay, the user is a technical writer creating content for a home battery-backup system. They encountered Hofstadter's three-layer message framework in GEB and want to apply it practically to their localization process. Their constraints are tight: 20-string batches, 2 hours per batch, multilingual translations with character limits, synthesized voice output, pictogram cards for some markets, and web help content stripped of context. There's also an automated QA tool flagging glossary/length variances that only checks the "inner" layer.

  Hmm... their core pain points are: 
  First, ensuring translations preserve meaning across contexts where outer/frame messages might get lost (e.g., web help lacking UI context). 
  Second, handling cases where text fundamentally can't translate (hence pictogram fallbacks). 
  Third, reconciling automated QA's narrow focus with deeper meaning layers. 
  Fourth, their proposed "addressee layer" – is it distinct from Hofstadter's outer message?

  Breaking down their needs:
  - Urgent: A concrete, time-efficient procedure that fits within 2-hour batches
  - Practical: Clear thresholds for when to abandon text (→ pictogram) or escalate (regulatory)
  - Philosophical: Validation/clarification of their fourth "addressee" layer
  - Critical: Examples proving the procedure catches non-obvious pitfalls

  Their hidden challenges: 
  - The QA tool's limitations might force oversimplification
  - Pictogram-only markets require radical message redesigns
  - Regulatory constraints could override all message layers

  For the procedure, I'll prioritize survivability – only keep GEB layers essential for localization pitfalls. The "frame" matters most (decoding instructions), then outer (message type/author), while inner is already handled by translation. Their fourth layer (addressee permissions) feels like a subset of outer messaging – it describes context about the receiver, which is part of the message's self-description. 

  Key procedure design principles:
  - Front-load failure points (e.g., frame checks first)
  - Binary decisions where possible (yes/no → escalate/redesign)
  - Separate factual checks (glossary) from judgment calls (tone)
  - Explicitly mark steps requiring human judgment

  Now testing their examples: 
  1. "Battery at 20 percent" – Seems simple but fails frame check (web context lacks battery icon). Requires outer message rebuild. 
  2. "Non-essential circuits will be shut off soon" – Outer message ambiguity (warning vs status) could cause regulatory issues in translations. 
  3. "Error 41, contact your installer" – Addressee layer mismatch (user vs installer) becomes critical in pictogram markets. 
  4. Pictogram card – Actually demonstrates frame failure (no text decoding possible) so it's already optimized.

  The procedure won't solve: 
  - QA tool's blindness to outer/frame layers
  - Deep cultural mismatches (e.g., "installer" implying expertise that doesn't exist in some markets)
  - Synthesized voice's inability to convey urgency tonally

  Biggest risk: The checklist creates false confidence. For example, deciding a string "passes" doesn't guarantee the translated outer message lands correctly – that requires linguistic/cultural insight beyond the procedure.
answer: |-
  Here's a battle-tested procedure based on Hofstadter's framework, optimized for your constraints. It prioritizes **failure points** and **actionability**, distilling the theory into a 20-string/2-hour workflow. Your "addressee layer" is folded into the **Outer Message** (it's contextual metadata about the receiver, not a separate tier).

  ---

  ### **The Localization Pre-Check Procedure**
  **Core Principle:** *If the Frame or Outer Message isn't **explicitly encoded** or **universally inferable**, the string will fail in at least one output context.*

  #### **1. FRAME CHECK: "Can this be decoded without surrounding context?"**  
     *Why first?* If the frame fails, translations and pictograms are meaningless.  
     **Ask:** *"What signals tell the user this is a battery message (not a weather app or a novel)?"*  
     - **Sufficient Answer:** Embedded unique identifiers (e.g., "`Battery:`" prefix, error codes like "`E41`", your company's color/iconography in UI).  
     - **Fail & Redesign If:**  
       - Relies solely on UI placement (e.g., text in a blank box assumes the user knows it's from the battery).  
       - Depends on temporal sequence (e.g., "`Shutting off...`" only makes sense after a prior alert).  
     - **Escalate to Regulatory If:** Frame requires safety knowledge (e.g., "`DC Fault`" assumes electrical training).

  #### **2. OUTER CHECK: "Who says this, to whom, and why?"**  
     *(Includes your addressee layer: audience + permissions)*  
     **Ask:** *"Does the text self-identify its source, intent, and target?"*  
     - **Sufficient Answer:**  
       - **Source:** Grammar/style implies manufacturer (e.g., imperative verbs: "`Contact...`").  
       - **Intent:** Explicit urgency markers ("`Error`", "`Warning!`", "`Soon`").  
       - **Target:** Pronouns/permissions ("`your installer`", "`non-essential circuits`" implies user config access).  
     - **Fail & Redesign If:**  
       - Ambiguous intent (e.g., "`Circuits disabled`" could be status or warning).  
       - Addresses the wrong actor (e.g., "`Check wiring`" to end-user → unsafe).  
     - **Escalate to Regulatory If:** Outer message implies risk mitigation (e.g., "`Shut off soon`" is a warning requiring compliance).

  #### **3. INNER CHECK: "Is the core message overloaded or QA-hostile?"**  
     *Why last?* Inner message is what localization vendors *actually translate*.  
     **Ask:** *"Will the QA tool or character limit mutilate this?"*  
     - **Sufficient Answer:**  
       - Under 35 chars (allows 5 for translation expansion).  
       - No idioms/cultural refs (e.g., "`raining cats and dogs`").  
       - Glossary terms locked (e.g., "`installer`" = certified professional).  
     - **Fail & Redesign If:**  
       - "Soon", "critical", "essential" are untranslatably vague.  
       - Dynamic values break syntax (e.g., "`Battery at {value}%`" → "`20%`" works, but "`Low`" doesn't).  
     - **Escalate to Regulatory If:** Inner message references safety standards (e.g., "`UL9540 compliant`").

  ---

  ### **What Survived from Hofstadter?**  
  | Layer       | Kept in Procedure          | Discarded                          |  
  |-------------|----------------------------|------------------------------------|  
  | **Frame**   | Decoding signals           | Abstract "meta" interpretation     |  
  | **Outer**   | Source/Intent/Target       | Artistic self-reference            |  
  | **Inner**   | Glossary/brevity checks    | Philosophical "meaning" debate     |  

  **Judgment Dressed as Procedure:**  
  - Step 1 (Frame): Deciding what's "universally inferable" requires guessing installer literacy.  
  - Step 2 (Outer): Interpreting "intent" assumes cultural parity (e.g., "`soon`" may not signal urgency everywhere).  

  ---

  ### **Testing Your Strings**  
  **1. "Battery at 20 percent"**  
  - **Frame Check:** FAIL. No identifier. In web search, it could be a phone battery.  
    *→ Redesign:* "`System Battery: 20%`" (adds Frame via "System").  
  - **Outer Check:** Pass (status to user).  
  - **Inner Check:** Pass (clear, short, no jargon).  

  **2. "Non-essential circuits will be shut off soon"**  
  - **Frame Check:** Pass (assumes battery UI context).  
  - **Outer Check:** FAIL. "Soon" is ambiguous intent (warning vs. status). "Non-essential" assumes user-defined circuits → addressee permissions unclear.  
    *→ Redesign:* "`Warning: Non-essential circuits shutting off in 2 min`" (specifies intent, time, uses "Warning" for Outer).  
  - **Inner Check:** FAIL. "Soon" is QA-hostile (varies in translation length/meaning).  

  **3. "Error 41, contact your installer"**  
  - **Frame Check:** Pass ("Error" + code signals battery system).  
  - **Outer Check:** FAIL. "Your installer" → addressee is user, but action requires technician. Mismatch in permissions!  
    *→ Regulatory Escalation:* "Contact your installer" implies user mitigation of risk. Requires legal sign-off.  
  - **Inner Check:** Pass (under 40 chars, glossary term "installer" used).  

  **4. Pictogram Card (figure opening enclosure with bar through it)**  
  - **Frame Check:** Pass (universal symbol).  
  - **Outer Check:** Pass (intent=prohibition, target=any person near equipment).  
  - **Inner Check:** N/A (no text).  
    *→ Ideal solution for markets needing non-text comms.*  

  **Procedure Forcing Unwanted Action:**  
  For *"Error 41"*, the procedure demands regulatory escalation. You might want to avoid delays, but the Outer Check reveals liability risk if a user contacts an unqualified "installer".

  ---

  ### **What the Procedure Cannot Do**  
  1. **Fix Cultural Mismatches:** A string passing all checks might still fail if "installer" implies expertise absent in certain markets.  
  2. **Override QA Tool Limitations:** If your tool flags "`Battery`" vs. "`System Battery`" as a glossary violation, you must negotiate manually.  
  3. **Synthesize Voice Nuance:** A translated Outer message like "`Warning`" may sound calm in some languages.  
  4. **Replace Pictogram Design:** It identifies *when* you need a pictogram but not *how* to design it effectively.  

  **Decisions It Only *Appears* to Settle:**  
  - **"Sufficient" Frame Signals:** Regulatory may reject your Frame solution (e.g., "`System Battery`" if "System" isn't a certified term).  
  - **Addressee Permissions:** Passing the Outer Check doesn't guarantee the recipient *has* those permissions in reality (e.g., user might not know their "installer").

  **Final Tweak:** Add a **"Pictogram Threshold"** rule: If a string fails Frame *or* Outer Check *and* the redesign exceeds 40 chars/regulatory limits → use a pictogram. This consolidates escape valves. Run your next batch through this—it should fit the 2-hour window once internalized.
