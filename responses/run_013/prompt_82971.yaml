prompt: |-
  I'm a fourth-year PhD student in political science, and my training is almost entirely in quantitative causal inference: potential outcomes, identification strategies, DAGs, the fundamental problem of causal inference, the standard warnings about what counts as a well-defined treatment and what SUTVA rules out. I've spent the last two years on a dissertation using synthetic control and difference-in-differences, so I genuinely think in terms of treated units, donor pools, and counterfactual trajectories. This term, mostly as a break from my own work, I've been sitting in on a history seminar on the origins of the Cold War, and I keep having the strange experience of understanding every sentence and being unable to say what any of them would mean in my own vocabulary. The seminar is organized around the familiar three-way quarrel — the orthodox or traditionalist reading, the revisionist reading, and the post-revisionist attempt to distribute responsibility more widely — along with the recurring proposal that the whole question is malformed: that 'who started it' is a question about a narrative or a policy program rather than about a single event, and that the proper object of study is the structure of the postwar system rather than anybody's decision.

  I'd like you to do something specific and fairly unforgiving with this. Take the central positions in that debate — roughly, that Moscow is to blame, that Washington is to blame, and that the question itself is the wrong one — and restate each of them as faithfully as you can in the vocabulary I actually use: unit-level and average treatment effects, counterfactual dependence, interventions and manipulability, confounding and common causes, overdetermination and conjunctural causation, path dependence, and the distinction between a cause and a background condition. Treat this as a genuine translation exercise and not a debunking; I'm not looking for the claim that historians are just doing bad causal inference in prose. Where a historian's claim can be rendered as a claim about what would have happened under an intervention, render it, and tell me what the treatment variable would have to be, whether it is well-defined, and whether the required model is doing the argumentative work rather than reporting it. Where it can't be rendered, say exactly where the translation breaks. Then give me the residue report, which is the part I actually care about: which historiographical claims survive intact, which survive only after being quietly altered (and what got altered), and which have no counterpart in my vocabulary at all. I have three suspects in mind — the notion of blame or responsibility as something distinct from causal contribution; the idea that a whole system or structure rather than an agent can be what made an outcome inevitable; and the suggestion that the counterfactual I would need is not merely unknown but indeterminate, since there is no fact of the matter about how a Stalin who had been removed from the scene in 1946 would have behaved. For each item of residue, tell me whether you take it to reveal a real expressive limitation of the causal-inference framework, something it cannot represent without changing the subject, or whether it shows that the original claim was doing normative or rhetorical work it would be better off doing openly. I don't want a survey of the literature, a reading list, or citations; I want the translation and an honest ledger of what it fails to carry.
reasoning: |-
  We are going to take the three central positions in the Cold War origins debate and translate them into the vocabulary of quantitative causal inference. We'll consider:
    1. Orthodox (Moscow to blame)
    2. Revisionist (Washington to blame)
    3. Post-revisionist (distribute responsibility more widely) and the structural critique (the question is malformed)

  We'll use concepts: unit-level and average treatment effects, counterfactual dependence, interventions, manipulability, confounding, common causes, overdetermination, conjunctural causation, path dependence, and cause vs. background condition.

  We are to be faithful, not debunking. For each, we will:
    - Render the claim as a claim about what would have happened under an intervention.
    - Specify the treatment variable: is it well-defined? Does the model do argumentative work?
    - Where translation breaks, note it.
    - Then, a residue report: what survives, what is altered, what has no counterpart.

  Additionally, we are to address three specific residues:
    a. Blame/responsibility distinct from causal contribution?
    b. System/structure making outcome inevitable?
    c. Counterfactual indeterminacy (e.g., a Stalin removed in 1946).

  Finally, for each residue, say if it reveals a limitation in the causal-inference framework or if it is normative/rhetorical work that should be done openly.

  Let's begin.

  ### 1. Orthodox Position (Moscow to blame)
  **Claim:** The Soviet Union, particularly under Stalin, initiated the Cold War through aggressive expansionism and ideological confrontation.

  **Translation:**
    - We consider the Cold War as the outcome. We want to know: if we had intervened to change the behavior of the Soviet Union (specifically, to a non-aggressive, non-expansionist stance), would the Cold War have been avoided?
    - Treatment variable: Let `T = 1` if the Soviet Union pursues an aggressive/expansionist policy (as historically), and `T = 0` if it pursues a non-aggressive, cooperative policy. We are interested in the effect of `T` on the binary outcome `Y` (Cold War occurs: yes=1, no=0).
    - Counterfactual: If the Soviet Union had been non-aggressive (`T=0`), would the Cold War still have occurred? The orthodox claim is that `Y(T=0) = 0` for the unit (the world in 1945-1947) — meaning that without Soviet aggression, the Cold War would not have occurred. Thus, the unit-level treatment effect is `Y(T=1) - Y(T=0) = 1 - 0 = 1`.
    - Well-defined? The treatment is an intervention on the Soviet Union's foreign policy. We must assume that we can define a clear, manipulable policy stance. However, the policy stance is multifaceted and might not be reducible to a binary. Also, SUTVA might be violated because the response of the US and others might depend on the exact nature of the Soviet policy and the context. Moreover, the treatment is not randomly assigned and there are confounders (e.g., the state of the world after WWII, economic conditions, etc.) that might affect both the Soviet policy and the outcome. But the orthodox position typically does not see these as confounders that would explain away the effect; rather, they see the Soviet policy as the key active cause.
    - The model is doing argumentative work: The claim is that the counterfactual world without Soviet aggression would not have led to the Cold War. The orthodox position is making a claim about the necessity and sufficiency of Soviet aggression.

  **Residue:**
    - The notion of "blame" might carry normative weight beyond causal contribution. In causal inference, we are saying the Soviet policy was a necessary cause (in this context). But the term "blame" implies moral responsibility, which is not in the causal model. This residue is normative and should be done openly.

  **Translation Breaks:**
    - The orthodox position often relies on specific events (e.g., the Berlin Blockade) as evidence of Soviet aggression. These events are seen as manifestations of the underlying policy. But in causal inference, we are abstracting to a policy stance. The historian might be making a more nuanced claim about the sequence of events that cannot be captured by a single intervention.

  ### 2. Revisionist Position (Washington to blame)
  **Claim:** The United States, driven by economic imperialism and anti-communism, initiated the Cold War.

  **Translation:**
    - We consider the same outcome `Y`. Now the treatment is US policy: `T = 1` if the US pursues an aggressive, containment-oriented, anti-Soviet policy (as historically), and `T = 0` if the US pursues a cooperative, non-confrontational policy (e.g., accepting Soviet influence in Eastern Europe, not promoting the Marshall Plan as an anti-Soviet tool, etc.).
    - Counterfactual: The revisionist claim is that if the US had been non-confrontational (`T=0`), then the Cold War would not have occurred: `Y(T=0) = 0`. The treatment effect is `1 - 0 = 1` at the unit level.
    - Well-defined? Similar issues: the US policy is complex and might not be binary. Also, SUTVA is a concern because the Soviet response would be part of the system. The revisionist might argue that the US policy was the active ingredient that turned the post-war situation into a Cold War. Confounders: the state of the world, but the revisionist position would see the US policy as the key manipulable cause that made the difference.

  **Residue:**
    - Again, "blame" carries normative weight. Also, the revisionist position often ties the US policy to economic structures (capitalism). This structural aspect might be seen as a background condition. But the causal inference model might represent this as a pre-treatment variable that conditions the effect. However, if the economic structure is taken as fixed, then it becomes a background condition and the intervention on US policy might be seen as the proximate cause. But the revisionist might want to say that the economic structure was a necessary condition without which the US policy would not have been adopted. This is conjunctural causation: the Cold War required both the US economic structure and the choice of policy. Without the structure, the policy wouldn't have been chosen. Without the policy, the structure wouldn't have led to the Cold War. But we are only intervening on the policy.

  **Translation Breaks:**
    - The revisionist claim about economic structures as the deep cause: we cannot intervene on the entire capitalist system in 1945 without changing the whole post-war world. So the treatment (changing the economic structure) is not well-defined in a localized way.

  ### 3. Post-revisionist and Structural Critique
  **a. Post-revisionist (distribute responsibility):**
  **Claim:** Both superpowers contributed to the Cold War through a series of actions and reactions; the conflict was overdetermined.

  **Translation:**
    - We are now considering multiple treatments. Let `T_sov` be the Soviet policy (as before) and `T_us` be the US policy. The outcome `Y` might be caused by either or both. We can model the potential outcomes as:
        Y(T_sov, T_us) = 1 if either T_sov=1 OR T_us=1 (or both), and 0 only if both are 0.
      But this might be too simplistic. Alternatively, we might have interaction: maybe both are required? The post-revisionist view is often that both contributed, meaning that if either had acted differently, the Cold War might have been avoided. But note: if both are set to 0, then Y=0. But if we set only one to 0, what happens?
    - The post-revisionist might say that the Cold War was overdetermined: even if one power had acted differently, the other might have still caused it. So we might have:
        Y(T_sov=0, T_us=1) = 1   (US policy alone causes Cold War)
        Y(T_sov=1, T_us=0) = 1   (Soviet policy alone causes Cold War)
        Y(T_sov=0, T_us=0) = 0   (no Cold War)
        Y(T_sov=1, T_us=1) = 1   (Cold War)
      This is a case of overdetermination: each treatment is sufficient by itself. But note: in the actual world, both were present. The unit-level effect of each treatment, conditional on the other being present, is 0? Because removing one treatment (setting to 0) doesn't change the outcome if the other is still 1. So we must be careful.

    - Alternatively, we might model it as each being a necessary component of a sufficient set (INUS condition). The post-revisionist might see the Cold War as the result of a complex interaction. They might argue that without both, the conflict would not have escalated. So:
        Y(T_sov, T_us) = T_sov * T_us   (both are necessary)
      Then, the effect of each is only present when the other is set to 1.

    - The post-revisionist position is often more nuanced: it might say that the actions of both were necessary in the sense that if either had been absent, the outcome might not have occurred. But note: if we set T_sov=0 and T_us=1, then the outcome might be 0? The post-revisionist might say that without Soviet actions, the US actions wouldn't have been triggered, and without US actions, the Soviet actions wouldn't have been interpreted as aggressive. This suggests a dynamic, game-theoretic interaction that might not be captured by a static intervention.

    - Well-defined? The treatments are still complex, and we have two of them. Also, the interventions might not be independent: setting T_sov=0 might change the value of T_us? This is a violation of the standard causal model because the treatments are on different units but might be interdependent. We might need a dynamic model.

    - The model does argumentative work: the post-revisionist is claiming that both treatments are causes, and that the outcome was highly likely because both were present. But the exact causal structure (sufficiency, necessity) is not always clearly specified.

  **b. Structural Critique (the question is malformed):**
  **Claim:** Asking "who started it" is the wrong question because the Cold War was the result of the structure of the post-war international system (bipolarity, nuclear weapons, ideological divide, etc.). The focus should be on the system, not on specific decisions.

  **Translation:**
    - We cannot define an intervention on a single agent because the outcome is determined by the system. We must intervene on the system structure. Let `S` represent the structure of the post-war system. We might define `S=1` as the actual historical structure (bipolar, with two superpowers, ideological conflict, etc.) and `S=0` as an alternative structure (e.g., multipolar, no ideological conflict, etc.). The claim is that given `S=1`, the Cold War was inevitable: no matter what the agents did, the outcome would be `Y=1`. So for any intervention on the agents within the structure, `Y` remains 1. Therefore, the agents' decisions are not causes in the sense that changing them (within the structure) wouldn't change the outcome. The structure is the cause.

    - But note: we are now intervening on the entire system. This is a macro-level intervention. The treatment is the system structure. The counterfactual is: if the post-war system had been structured differently (`S=0`), would the Cold War have occurred? The structuralist claims that in that case, `Y=0`.

    - Well-defined? The system structure is a complex, multifaceted variable. It is not clear how to define a well-defined intervention that changes the structure without changing everything. Moreover, the structuralist might argue that the structure was determined by the outcome of WWII, so we cannot easily intervene on it without changing history.

    - The model does argumentative work: it shifts the focus from unit-level interventions (on the US or USSR) to a system-level intervention. The claim is that the structure is a necessary and sufficient condition for the Cold War.

    - However, the structural critique also says that the question of "who started it" is malformed because it focuses on agency in a structural context. In causal inference terms, the structuralist is saying that within the actual structural context, the decisions of the agents were not the causes (because the outcome was fixed). The cause is the structure.

  **Residue for Structural Critique:**
    - The idea that the system made the outcome inevitable: in causal inference, we can represent this by saying that the structure is a cause and that it is deterministic. But note: if we cannot change the structure without changing the entire past, then the counterfactual might be too distant. Also, the structuralist might be making a claim about path dependence: the system structure was set by WWII and then the Cold War was the only path.

    - However, the structural critique might also say that the agents' decisions were constrained by the structure. In causal inference, we might model this as the structure being a background condition that sets the stage. But then the interventions on the agents would be ineffective. This is a claim about effect modification: the structure modifies the effect of the agents' decisions. In the actual structure, the agents' decisions are irrelevant. But that's a strong claim.

  ### Residue Report

  We now address the residue:

  **1. Blame/Responsibility distinct from causal contribution:**
     - In causal inference, we talk about causes as difference-makers. But blame implies moral responsibility. The orthodox and revisionist positions use causal claims to assign moral responsibility. The causal inference framework does not have a notion of blame. This residue is normative and should be done openly. It is not a limitation of the framework per se, because the framework is not designed to handle normative judgments. However, note that in the post-revisionist and structural views, the distribution of blame is decoupled from simple causal contribution. The structural view might say that no one is to blame because the outcome was inevitable. But in causal inference, we can say that the structure is the cause and the agents are not. That might map to "no blame" for the agents, but then we are still using causal language to inform blame.

  **2. System/structure making the outcome inevitable:**
     - We can represent this in the causal inference framework by defining a system-level treatment and claiming that the outcome is deterministic under that treatment. However, the intervention on the entire system might not be well-defined because it is too global. Moreover, the system structure is often seen as a background condition that is fixed. In that case, we are not allowed to intervene on it. The causal inference framework typically focuses on manipulable causes. If the structure is not manipulable (at least in a localized way), then it might be considered a background condition and not a cause. This reveals a limitation: the framework is designed for localized interventions. The structural claim might be that the real cause is non-manipulable, but then causal inference is not the right tool. Alternatively, we could use the framework to say that the structure is a cause, but we must acknowledge that we cannot design an experiment to change it. This is a real expressive limitation when it comes to macro-historical structures.

  **3. Counterfactual indeterminacy (e.g., a Stalin removed in 1946):**
     - The claim: there is no fact of the matter about how a different leader would have behaved. In causal inference, we require that the counterfactual is well-defined. If we define an intervention that replaces Stalin with someone else, we must specify who that someone else is. Without specifying the alternative, the counterfactual is not well-defined. This is a challenge for unit-level treatment effects. The causal inference framework requires that we specify the intervention precisely. If the historian argues that the counterfactual is indeterminate because we cannot specify the alternative, then the translation breaks. We cannot define the potential outcome. This reveals a limitation: the framework assumes that we can define meaningful interventions. In history, many interventions (like changing a leader) are not well-defined because the counterfactual world is too underdetermined.

  ### Summary of Residues:

  - **Blame/responsibility**: This is normative and not part of causal inference. It survives only by being altered: we strip the normative content and leave the causal claim. The normative residue must be done openly.

  - **System/structure as cause**: We can represent it, but the intervention is global and not manipulable. This is a limitation of the framework because it is designed for localized interventions. The claim survives but is altered: we must represent the system as a variable we intervene on, which is a simplification. The structural critique that the question is malformed because of the system's overdetermining role survives only if we accept that we can model the system as a cause. But if we stick to manipulability, then the structural claim might be seen as pointing to background conditions, which are not causes in the framework.

  - **Counterfactual indeterminacy**: This breaks the translation. The causal inference framework requires well-defined interventions. The claim that the counterfactual is indeterminate has no counterpart. This reveals a real limitation: the framework cannot handle underdetermined counterfactuals. It assumes that we can specify the alternative world.

  ### Final Ledger:

  - **Survives intact**:
      - The core causal claims (e.g., that a change in Soviet or US policy would have prevented the Cold War) can be represented as counterfactuals.
      - The overdetermination claim (both superpowers' actions were sufficient) can be represented with multiple sufficient causes.

  - **Survives altered**:
      - The distribution of responsibility (post-revisionist) becomes a claim about multiple causes and their interactions. The moral dimension is stripped away.
      - The structural critique becomes a claim about a macro-level intervention that makes the outcome deterministic. The notion of the system as cause is represented, but the intervention is not manipulable in the usual sense.

  - **No counterpart**:
      - The normative concept of blame.
      - The idea that a counterfactual is indeterminate (because we cannot specify the alternative with enough precision).
      - The structural critique's deeper point that the question of agency is irrelevant in a structural context: if we model the structure as the cause, we have changed the subject from agency to the system. But if we cannot intervene on the system, then the causal inference framework might not engage with the claim that the system is the cause.

  ### Conclusion:
  The causal inference framework can capture many aspects of the historical debate, but it requires well-defined interventions and strips away normative content. The residues reveal both normative elements that should be made explicit and limitations in handling non-manipulable structural causes and indeterminate counterfactuals. This does not mean that the historians' claims are invalid; it means that they are doing more than causal inference can capture, and that some of their claims are about non-manipulable structures or underdetermined counterfactuals that fall outside the framework.
answer: |-
  ### Translation of Cold War Historiographical Positions into Causal Inference Framework

  #### **Orthodox Position (Moscow to blame)**  
  **Core Claim:** Soviet actions (Stalin's expansionism, ideological hostility) were the primary cause of the Cold War.  
  **Translation as Causal Claim:**  
  - **Treatment Variable:** Binary intervention on Soviet policy: \( T_{\text{sov}} = 1 \) (historically aggressive/expansionist stance) vs. \( T_{\text{sov}} = 0 \) (non-aggressive/accommodative stance, e.g., no sphere of influence in Eastern Europe).  
  - **Counterfactual Dependence:** The Cold War (\( Y = 1 \)) counterfactually depends on \( T_{\text{sov}} \). If \( T_{\text{sov}} = 0 \), \( Y = 0 \) (no Cold War).  
  - **Unit-Level Effect:** For the historical unit (1945–1947 geopolitical context), \( Y(1) - Y(0) = 1 \). The treatment is necessary and sufficient in this context.  
  - **Confounding/Common Causes:** Orthodox historians dismiss confounders (e.g., U.S. economic interests) as secondary; the Soviet treatment is seen as the active ingredient.  
  - **Manipulability/Well-Defined Treatment?** Problematic. Defining \( T_{\text{sov}} = 0 \) requires specifying a coherent alternative Soviet policy. Stalin’s personality and ideology are entangled with the state apparatus, making it unclear whether \( T_{\text{sov}} \) is manipulable independently of systemic factors (e.g., Bolshevik ideology).  
  - **Model Work:** The counterfactual model is central to the argument—it asserts a clear, singular path to avoid the outcome.  

  #### **Revisionist Position (Washington to blame)**  
  **Core Claim:** U.S. actions (economic imperialism, atomic diplomacy) initiated the Cold War.  
  **Translation as Causal Claim:**  
  - **Treatment Variable:** Binary intervention on U.S. policy: \( T_{\text{us}} = 1 \) (historically confrontational: Truman Doctrine, Marshall Plan as anti-Soviet) vs. \( T_{\text{us}} = 0 \) (cooperative: acceptance of Soviet security concerns, no containment policy).  
  - **Counterfactual Dependence:** \( Y \) counterfactually depends on \( T_{\text{us}} \). If \( T_{\text{us}} = 0 \), \( Y = 0 \).  
  - **Overdetermination/Conjunctural Causation:** Revisionists often imply \( T_{\text{us}} \) is sufficient but not necessary if other factors (e.g., capitalism’s structural logic) could independently cause \( Y \). This is modeled as \( Y = 1 \) if \( T_{\text{us}} = 1 \) OR other capitalist-expansion variables = 1.  
  - **Common Causes:** Economic structures (e.g., capitalist expansion) are confounders affecting both \( T_{\text{us}} \) and \( Y \). Revisionists treat these as background conditions, not manipulable causes.  
  - **Manipulability/Well-Defined Treatment?** Limited. \( T_{\text{us}} = 0 \) assumes the U.S. could ignore systemic pressures (e.g., domestic industrial lobbying). The "treatment" conflates policy decisions with structural drivers.  
  - **Model Work:** The counterfactual demonstrates U.S. agency, but structural confounders undermine the treatment’s discreteness.  

  #### **Post-Revisionist/Structural Position (Question malformed)**  
  **Core Claim:** The Cold War was inevitable due to the bipolar structure; "who started it" misattributes systemic outcomes to agency.  
  **Translation as Causal Claim:**  
  - **Treatment Variable:** Intervention on the *systemic structure*: \( S = 1 \) (post-1945 bipolarity, mutual suspicion) vs. \( S = 0 \) (multipolarity, trust, e.g., a functional UN security framework).  
  - **Counterfactual Dependence:** If \( S = 0 \), \( Y = 0 \). Under \( S = 1 \), \( Y = 1 \) regardless of unit-level interventions on \( T_{\text{sov}} \) or \( T_{\text{us}} \) (i.e., \( Y(T_{\text{sov}}, T_{\text{us}} \mid S=1) = 1 \) for all \( T \)).  
  - **Path Dependence:** The outcome is locked in by 1945 path dependencies (e.g., WWII power vacuums, nuclear technology).  
  - **Cause vs. Background Condition:** The structure \( S \) is the cause; unit-level policies are epiphenomenal.  
  - **Manipulability/Well-Defined Treatment?** Highly problematic. \( S \) is non-manipulable—it emerges from WWII’s end state and cannot be altered without rewriting history. \( S = 0 \) is a "miracle" intervention (e.g., erasing ideological differences).  
  - **Model Work:** The model reframes agency as irrelevant, but struggles with indeterminacy (e.g., could leaders have mitigated hostility under \( S = 1 \)?).  

  ---

  ### Residue Report: What the Translation Fails to Carry  

  #### **1. Blame/Responsibility vs. Causal Contribution**  
  - **Translation Attempt:** Blame is mapped to *necessary causation* (e.g., if \( T_{\text{sov}} = 0 \), \( Y = 0 \)).  
  - **Residue:** Blame implies *moral agency* and *intent*, which causal inference strips away. A "cause" in DAGs has no moral weight; blame does. Orthodox/revisionist claims rely on imputing motives (e.g., Stalin’s expansionism as inherently aggressive), which are non-falsifiable in potential-outcomes frameworks.  
  - **Nature of Residue:** Normative work smuggled into causal language. The framework cannot represent *culpability* without external ethical axioms. Better to treat blame as rhetorical.  

  #### **2. System/Structure as Making the Outcome Inevitable**  
  - **Translation Attempt:** Modeled as structural treatment \( S \) with deterministic potential outcomes (\( Y \mid S=1 = 1 \)).  
  - **Residue:** Structuralists argue the Cold War was *overdetermined* at the systemic level, but causal inference requires specifying a well-defined \( S = 0 \). Historians reject this: the structure is a holistic, non-decomposable context. The claim "no agent caused it" becomes *no unit-level treatment is identifiable*, violating SUTVA (treatments are interdependent).  
  - **Nature of Residue:** Expressive limitation. Causal inference handles systems via DAGs or equilibrium models, but cannot represent *emergent inevitability* without ad hoc assumptions (e.g., fixing all confounders).  

  #### **3. Indeterminate Counterfactuals (e.g., "Stalin Removed in 1946")**  
  - **Translation Attempt:** Treatment = leadership change (\( T_{\text{lead}} = 1 \) if Stalin replaced).  
  - **Residue:** Historians argue this counterfactual is *unknowable* (no data on alternatives) and *indeterminate* (Soviet policy was shaped by bureaucracy/ideology, not just Stalin). Causal inference assumes well-defined interventions ("replace with whom?"), but history rejects this precision.  
  - **Nature of Residue:** Expressive limitation. Potential outcomes require interventions to be "meaningful" (manipulable), but macrohistorical actors are often non-separable from context.  

  ---

  ### Ledger of Survival  
  | **Historiographical Claim**          | **Survival in Causal Vocabulary**                                  | **Alteration/Loss**                                                                 |  
  |--------------------------------------|--------------------------------------------------------------------|-------------------------------------------------------------------------------------|  
  | Soviet/U.S. actions caused Cold War  | ✅ As unit-level treatment effects.                                | Blame → causation; intent/ideology reduced to binary treatments.                   |  
  | Cold War was overdetermined          | ✅ As overdetermination (multiple sufficient causes).             | Loss of *narrative complexity* (e.g., "reactions" as dynamic processes).           |  
  | Structure > agency                   | ⚠️ As systemic intervention \( S \).                             | Structure made manipulable; holistic "inevitability" lost.                         |  
  | Blame as moral responsibility        | ❌ No counterpart.                                                | Normative residue discarded.                                                        |  
  | Indeterminate counterfactuals        | ❌ No counterpart (framework assumes determinism).                | Uncertainty ≠ indeterminacy; framework cannot handle "no fact of the matter".       |  
  | Ideology as causal force             | ⚠️ As confounder or treatment modifier.                          | Reduced to measurable proxies (e.g., "speech acts").                                |  

  ### Conclusion  
  The causal inference framework **successfully translates** claims about specific actions (e.g., "Soviet expansion caused the Cold War") into testable counterfactuals but **fails to capture**:  
  1. **Normative intent** (blame/responsibility),  
  2. **Holistic structural determination** (non-manipulable systems),  
  3. **Indeterminate agency** (vague counterfactuals).  

  These residues reveal **expressive limitations**, not historian naiveté. Causal inference excels at discrete interventions but struggles with macrohistorical *context* and *meaning*. The structural critique—that "who started it" is malformed—highlights this gap: it exposes causal inference’s reliance on well-defined treatments, which history often cannot provide. To engage historians, concede that some questions require narrative tools; to refine your framework, incorporate *conjunctural causation* (e.g., interaction terms for structure/agency) and *mechanisms* (e.g., process tracing) where potential outcomes reach their limits.
