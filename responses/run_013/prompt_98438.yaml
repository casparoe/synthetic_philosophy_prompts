answer: |-
  ## Joint Statement: Adversarial Collaboration on the Doctrine of Double Effect (DDE)

  **Parties:**
  *   **Party A:** Defender of the Doctrine of Double Effect (DDE).
  *   **Party B:** Critic of DDE, proponent of causal structure/proportionality as explanatorily sufficient.

  **Preamble:** After decades of debate concerning the moral significance of the distinction between intended harm and merely foreseen harm, we, Party A and Party B, undertake this adversarial collaboration. Our goal is to clarify points of agreement, isolate and precisely define our core disagreements, identify testable cruxes, and acknowledge any merely verbal disputes. We use Cases X and Y (described below) as a focal point for discussion.

  **Case X (Harm on Causal Path):** Five people are trapped in a flooding tunnel. A bystander can save them by opening a lock. The water saving the five *must* first pass through a side chamber, drowning one person trapped there. The one's death is foreseen and lies on the causal path to saving the five.

  **Case Y (Harm Off Causal Path):** Five people are trapped in the same flooding tunnel. The bystander can save them by opening the same lock. The water reaches the five through the main channel. However, operating the lock requires opening a pressure valve which, via a *separate* channel, floods a side chamber, drowning one person trapped there. The one's death is foreseen but does *not* lie on the causal path to saving the five.

  **1. Agreed Claims (Signed by Both Parties):**

  1.  The Doctrine of Double Effect (DDE), as historically formulated and commonly discussed, asserts that there is sometimes a morally significant difference between harm an agent *intends* as part of their plan and harm the agent merely *foresees* as a consequence of their action, even if the outcome is identical.
  2.  Classic thought experiments like the Trolley Problem (redirecting vs. pushing) and Transplant (harvesting organs) are widely believed to demonstrate an intuitive moral difference. DDE is frequently invoked as the *explanation* for this perceived difference.
  3.  The intuitive judgments in the classic cases (e.g., redirecting the trolley often judged permissible; pushing the man or harvesting organs judged impermissible) are robust phenomena worthy of philosophical explanation.
  4.  DDE does *not* claim that intending harm is *always* impermissible or that merely foreseeing harm is *always* permissible. It functions within constraints of proportionality, necessity, and that the good effect must not be produced *by* the bad effect.
  5.  The distinction between harm as a *means* to an end and harm as a *side effect* is often correlated with the intended/foreseen distinction in paradigmatic cases, but they are conceptually distinct notions.
  6.  Cases X and Y are specifically designed to separate the variable of "lying on the causal path" (a feature of causal structure) from the variable of "being intended" (a feature of the agent's mental state). Both cases involve foreseen, non-intended death as a consequence of saving five.
  7.  A decisive objection to Party A's position (DDE as explanatorily fundamental) would be demonstrating that all moral differences allegedly explained by the intended/foreseen distinction can be fully and more parsimoniously explained by differences in causal structure (e.g., means/side-effect, causal proximity) combined with proportionality, without any residual explanatory role for intention.
  8.  A decisive objection to Party B's position (causal structure/proportionality as sufficient) would be demonstrating a pair of cases identical in all relevant features of causal structure and proportionality, yet exhibiting a clear moral difference that can only be explained by a difference in the agent's intention regarding the harm.
  9.  The concept of "intention" relevant to DDE involves the agent's plan: what aims are constitutive of the action undertaken, and which outcomes are accepted as consequences but not pursued for their own sake or as necessary steps to the goal.

  **2. Residual Disagreements:**

  | Disagreement Point                                                                 | Party A's Position (DDE Defender)                                                                                     | Party B's Position (DDE Critic)                                                                                                 |
  | :--------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------ |
  | **Explanatory Primacy of Intention**                                               | The distinction between intended harm and foreseen harm marks a *genuine, independent, and fundamental* moral difference. It provides unique explanatory power that cannot be fully reduced to causal structure and proportionality. | The intended/foreseen distinction *does no independent moral work*. Once causal structure (e.g., means vs. side-effect, causal path, tightness of connection) and proportionality are fixed, attributions of intention add nothing substantive to the moral assessment. Intention often *tracks* causal structure but does not *ground* a distinct moral norm. |
  | **Role of Intention in Defining Causal Structure**                                 | Descriptions of causal structure (e.g., "harm is a means") often implicitly or explicitly depend on the agent's intention or plan. Causal role is not purely physical but teleological. *(Note: This phrasing leans towards A's view; B strongly disagrees)* | Causal structure (e.g., whether harm is causally necessary for the good effect, the spatio-temporal path, counterfactual dependencies) can be characterized *objectively*, without essential reference to the agent's subjective intentions. Intention is an interpretation *of* the causal structure, not constitutive of it. |
  | **Moral Assessment of Cases X & Y**                                                | Cases X and Y are morally equivalent. In both, the death is foreseen but not intended (it is a side effect, not part of the plan). Both actions are permissible under proportionality. The difference in causal path is morally irrelevant here. | Cases X and Y are morally distinct. In X, the harm is a causally necessary antecedent condition *on the path* to the good effect, making it structurally closer to being a means (even if not intended as such). In Y, the harm is a truly collateral effect occurring "off-path." This difference in causal structure is morally significant. X is more problematic than Y. |
  | **Does the X/Y Pair Isolate the Variable?**                                        | Yes. The pair successfully isolates "lying on the causal path" (present in X, absent in Y) from the "intended/foreseen" variable (foreseen/not intended in both). This shows causal path alone, without intention changing, does not create a moral difference. | Partially. It isolates "directly on the causal path to the good effect." However, this structural feature *is* morally significant independently of intention. The pair shows intention isn't the *only* factor, but doesn't show intention is a *necessary* factor. The "side-effect" in X is causally integrated differently than in Y. |

  **3. Cruxes and Test Cases:**

  | Crux                                                                                                       | Concrete Test Case/Argument Agreed as Bearing on Crux                                                                 | Party A's Prediction                                                                 | Party B's Prediction                                                                |
  | :--------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------- |
  | **1. Can causal structure (means/side-effect, path, tightness) be fully characterized WITHOUT any implicit or necessary reference to the agent's intention or plan?** | Analyze a complex causal chain (e.g., Rube Goldberg device, biological process) involved in a harmful outcome. Can "means," "side-effect," "causal path to benefit" be defined solely using counterfactuals, physical connections, and temporal sequences, without any teleological language implying purpose or plan? | No. Attempts will inevitably rely on notions like "for the sake of," "in order to," or "part of the process achieving X," which smuggles in intentionality or goal-directedness. | Yes. Using robust concepts of causal necessity, counterfactual dependence, and physical mechanism, the relevant structural features can be described objectively, independent of any agent's mind. |
  | **2. Do cases exist that are identical in causal structure and proportionality but differ *only* in the agent's intention regarding the harm, leading to a moral difference?** | **Case Z:** Identical to the standard "redirect trolley" scenario (one on side track, five on main) in all physical and causal details. **Version Z1:** Agent intends *only* to save the five; the one's death is foreseen but regretted. **Version Z2:** Agent also harbors a secret hatred for the one and *intends* their death as a desired outcome, while still primarily aiming to save the five. Does Z2 seem morally worse than Z1? | Yes. The presence of the additional intention to harm in Z2 constitutes a distinct wrong (e.g., a vicious attitude, conditional willingness to harm) making the act morally worse, even if the causal structure and outcome are identical to Z1. | No. The causal structure (diverting a threat as a side effect) and proportionality (5 vs. 1) are identical. The bad intention in Z2 reveals a bad character, but it does not make the *act itself* morally worse than in Z1. The act is permissible in both, the intention is blameworthy only in Z2. |
  | **3. Is the "causal path" difference between Case X and Y morally significant independently of intention?** | As per the original Cases X and Y description.                                                                        | Moral assessment will be the same (permissible) for both X and Y. The causal path difference is morally inert. | Moral assessment will differ. X (harm on path) will be judged less permissible or more problematic than Y (harm off path), even though harm is foreseen in both. |

  **4. Verbal Disagreements and Talking Past:**

  We identify one primary locus where apparent disagreement may stem partly from verbal differences or differing emphases:

  *   **The Term "Means":** Party B typically uses "means" in a *causal-functional* sense: X is a means to Y if X is a causally necessary (or contributory) step in a process producing Y. Party A often uses "means" in an *intentional-instrumental* sense: X is a means for an agent if the agent *uses* X *in order to* bring about Y, as part of their plan. This difference leads to potential miscommunication.
      *   **How They Talked Past:** In discussions about cases, Party B might argue "The harm in Case X is a *means* (causally necessary step on the path)" to explain its moral significance. Party A hears this as implying the harm is *intended* as a means (which it isn't in X), leading A to reject B's characterization as inaccurate or question-begging. Conversely, A's insistence that the harm isn't a "means" (in the intentional sense) seems to B to ignore the morally relevant causal fact that it *is* a necessary step on the path (B's sense of "means"). Clarifying which sense of "means" is being used in a given argument is crucial. While the core disagreement about explanatory primacy remains substantive, confusion over this term has sometimes obscured the debate.

  **Conclusion:** This collaboration has allowed us to articulate a significant area of agreement on the phenomena to be explained and the nature of potential decisive objections. We have precisely mapped our core disagreements regarding the explanatory role of intention versus causal structure, particularly highlighted by our divergent analyses of Cases X and Y. We have identified three crucial cruxes (characterization of causal structure, existence of pure intention-difference cases, moral significance of causal path) and committed to specific test cases and predictions for each. We acknowledge that some confusion has arisen from differing connotations of the term "means." We undertake further joint work focused on these cruxes, particularly refining objective characterizations of causal structure (Crux 1) and investigating cases like Z (Crux 2), aiming to resolve whether intention provides unique explanatory power or if causal structure and proportionality are indeed sufficient.
