answer: |-
  ## Prospectus: The Two Faces of Fairness: Disentangling Integrity and Distribution in Lottocratic Legitimacy

  **1. Research Question:** Does the perceived legitimacy of sortition (selection by lottery) depend critically on distinguishing between *lottery integrity* (procedural robustness: verifiable non-manipulation, auditable randomness, absence of self-selection/screening) and *distributional fairness* (outcome representativeness: matching population demographics/views), and if so, which property (or a related third property, the *impossibility of candidacy*) provides the primary normative foundation for lottocratic systems?

  **2. The Gap in Existing Positions:** Current defenses of sortition tend to invoke a unified concept of a "fair lottery" as the source of legitimacy. Proponents often glide seamlessly between appeals to the incorruptible, unbiased *procedure* (integrity) and the promise of a descriptively representative *outcome* (fairness), treating them as naturally co-occurring or mutually reinforcing. Critics, meanwhile, often attack one aspect (e.g., the risk of unrepresentative outcomes in pure lotteries, or the potential for bias in stratified designs) without acknowledging the distinct normative value potentially offered by the other. This conflation obscures crucial trade-offs inherent in institutional design choices (stratification vs. purity, pre-determined strata vs. adaptive criteria, auditability mechanisms) and prevents a precise understanding of *why* lotteries might be legitimate. The question of whether the *inability to run for office* itself is a more fundamental legitimating factor than either procedural integrity or representational fairness remains largely unexplored within this framing.

  **3. Approach (Conceptual Analysis - One Semester):** This project employs a conceptual and normative methodology, essential for clarifying the foundational principles and justifications underlying political legitimacy claims. Empirical studies of existing or hypothetical lottocratic bodies are valuable but presuppose clarity on the normative standards against which they should be judged. This project seeks to establish that conceptual clarity.

  *   **Month 1: Foundational Mapping & Critique:** Systematically analyze key arguments for lottocratic legitimacy (e.g., anti-corruption, descriptive representation, equality, epistemic diversity, overcoming elite capture). For each, identify whether the argument relies implicitly or explicitly on *integrity*, *distributional fairness*, or an unstated combination. Document instances where the distinction is blurred or ignored, highlighting the resulting ambiguity in justifying specific design features.
  *   **Month 2: Conceptual Disentanglement & Third Variable:** Precisely define and differentiate *lottery integrity* and *distributional fairness*. Develop criteria for each. Formulate and rigorously assess the hypothesis that the *impossibility of candidacy* – the structural removal of electoral ambition, campaigning, and the "candidate filter" – is the more fundamental source of legitimacy, potentially explaining the appeal of *both* integrity and fairness (as mechanisms preventing *de facto* candidacy via manipulation or pre-selection).
  *   **Month 3: Design Implications & Trade-offs:** Apply the clarified framework to concrete institutional design dilemmas:
      *   Stratified vs. Unstratified Lotteries: How do integrity and fairness trade off? Does pre-setting strata inherently compromise integrity?
      *   Timing of Strata Definition: Does defining strata after the pool is identified (but before the draw) mitigate fairness concerns without sacrificing integrity?
      *   Auditability: What mechanisms best serve integrity, and do they interact with fairness goals?
  *   **Month 4: Synthesis, Legitimacy Claims, & Drafting:** Synthesize findings to answer the core question: What is the primary normative foundation of lottocratic legitimacy revealed by this distinction? Revise the framework based on the role of "impossibility of candidacy." Articulate clear implications for how we should understand, evaluate, and design lottocratic institutions based on which legitimating property we prioritize. Draft the final paper.

  **4. What a Result Looks Like:**
  *   **Success:** The project demonstrates convincingly that leading arguments for sortition rely *differentially* on integrity and fairness, that these properties are conceptually distinct and often in tension, and that this tension directly maps onto practical design choices. It provides a clear framework for analyzing these choices. Crucially, it offers a persuasive assessment of whether integrity, fairness, or the impossibility of candidacy serves as the stronger or more fundamental legitimating pillar, potentially reframing the theoretical basis for sortition. The 6,000-8,000 word paper presents this analysis with conceptual precision, engages effectively with key positions, and delivers actionable insights for institutional design.
  *   **Failure:** The project fails if:
      *   It cannot compellingly show that the conflation of integrity and fairness in existing literature is significant or problematic.
      *   The distinction between integrity and fairness proves analytically incoherent or collapses under scrutiny (see point 6).
      *   The analysis of design implications remains vague or disconnected from the conceptual framework.
      *   The exploration of "impossibility of candidacy" is underdeveloped or fails to integrate meaningfully.
      *   The conclusion on the primary legitimating property is unclear, unsupported, or merely restates existing positions without novel insight.

  **5. Scope Assessment & Potential Cuts:**
  This project is appropriately ambitious but feasible for one semester *if focused rigorously*. The core task – disentangling integrity and fairness and probing their legitimating roles – is well-defined. The inclusion of "impossibility of candidacy" adds valuable depth but increases the load.
  *   **Where to Cut if Needed:** The most natural reduction would be to treat "impossibility of candidacy" as a secondary or concluding point for further research rather than a fully integrated third pillar in the main analysis. Month 3 could focus on 1-2 key design dilemmas (e.g., stratification vs. purity and auditability) instead of all three listed. Deep dives into highly specific historical examples or complex mathematical models of representativeness should be avoided in favor of conceptual clarity.

  **6. What is Lost if the Distinction Collapses?**
  If integrity and fairness prove inseparable – if robust procedural integrity *necessarily* guarantees acceptable distributional fairness, or vice versa, or if they are fundamentally the *same concept* viewed from different angles – then a significant opportunity for theoretical refinement and practical guidance is lost. We would remain unable to:
  *   **Intelligently Navigate Trade-offs:** We couldn't rationally choose between a highly auditable pure lottery risking unrepresentativeness and a carefully stratified lottery requiring upfront (potentially biased) category choices.
  *   **Diagnose Legitimacy Failures:** If a lottocratic body loses legitimacy, we couldn't determine if the cause was a compromised procedure (failed integrity) or an unacceptably skewed outcome (failed fairness), hindering effective reform.
  *   **Understand the Source of Legitimacy:** The conflation would mask whether citizens accept lotteries because the process *feels* incorruptible (integrity), because the result *looks* like them (fairness), or because no one *chose* to be there (no candidacy). This ambiguity weakens the theoretical foundation of sortition and its persuasive power.
  *   **Design Robust Institutions:** Without recognizing the distinct mechanisms needed to secure integrity (audit trails, transparent algorithms) versus fairness (appropriate stratification, large enough samples), designs might be ineffective or overlook critical vulnerabilities.

  **Deliverable:** A 6,000-8,000 word research paper presenting the conceptual analysis, critique of existing conflation, framework distinguishing integrity and fairness, assessment of "impossibility of candidacy," analysis of key design implications, and conclusion regarding the primary normative foundation(s) of lottocratic legitimacy.
