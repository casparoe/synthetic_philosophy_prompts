  First, I need to unpack their core argument: they see Marx's machinery analysis not as technological determinism or unemployment prediction, but as a unified thesis about capital undermining its own value foundation by displacing living labor. They're explicitly rejecting the common "early optimism vs. later pessimism" reading of Grundrisse versus Capital.

