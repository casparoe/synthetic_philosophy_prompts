  Then there's the autonomist influence question. Did thinkers like Negri retroject their "crisis of measurability" ideas onto Marx? Capital's focus on relative surplus value extraction through machinery seems more about capital's adaptability than its dissolution. Still, Grundrisse's "real wealth vs value" distinction does support the user's reading.

