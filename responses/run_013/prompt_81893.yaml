  Me and my mate got into a right long arguement last night about whether everything you believe just rests on other things you believe. He reckons it goes all the way down — every belief is propped up by further beliefs, and in principle you could question any of them. I said no, there's stuff I couldn't even make sense of doubting, like that I've got hands, or that the world didn't pop into being five minutes ago with all my memories already baked in. He said that's just dogmatism with a fancy hat on.

  I want to actually get this straight, because I think he's missing something. Can you explain what's supposed to be special about hinge certainties — the ones sitting at the bottom that aren't themselves backed by evidence — as opposed to ordinary beliefs we just happen to hold very confidently? People keep telling me these things are more like rules, or a way of acting, than like claims that could be true or false, and I don't really feel the force of that. I also want the awkward part: if they aren't backed by evidence, how is this not just a brute foundation you either have or you don't? And what happens when the bedrock shifts — when something that was a hinge for a whole community, or a whole science, quietly stops being one? Does it even make sense to say a hinge turned out to be wrong?

  Please write it in British English. Also tell me how confident you are in what you're saying, and point out the bit you're least sure about.
