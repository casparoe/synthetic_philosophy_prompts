answer: |-
  ## Policy Directive 7

  The shift hums low beneath the strip-lit glare,  
  My knee complains its old familiar ache.  
  **No one is harmed when one more life is made.**  
  The radio repeats the same thin air,  
  A static tune for every breath we take.  
  The shift hums low beneath the strip-lit glare.

  My bowl holds starch and shreds – it's fine, I swear,  
  Warm in the belly, better than no cake.  
  **If no one wants to die, then all should stay.**  
  The mountain view costs more than I can spare,  
  Just grey beyond the wire, for heaven's sake.  
  The shift hums low beneath the strip-lit glare.

  The child next door just learned to fix his stare  
  On moving lights. A small sound he will make.  
  **No one is harmed when one more life is made.**  
  My boots are worn, but patched with decent care,  
  They walk the line for every shift I wake.  
  **If no one wants to die, then all should stay.**

  The foreman checks the count, beyond compare  
  To other times. The numbers never break.  
  The shift hums low beneath the strip-lit glare.  
  We stack the boxes, neat, in ordered pairs.  
  The air tastes thin, but serves us, for God's sake.  
  **No one is harmed when one more life is made.  
  If no one wants to die, then all should stay.**

  ---

  **Notes on execution:**

  *   **Refrains:** "No one is harmed when one more life is made" captures the non-worseness claim (Mere Addition) in plain language. "If no one wants to die, then all should stay" captures the principle that if life is net-positive for the individual, adding it is good (driving the Repugnant Conclusion). They sound plausible in isolation.
  *   **Voice:** First-person, grounded in concrete, mundane details – the strip lighting, the aching knee, the repetitive radio, the cheap starch-and-shreds meal (implied favorite? simply sustenance?), the unreachable mountain view, the worn but cared-for boots, the box-stacking job, the thin air. Life is "fine," functional, endured without overt misery.
  *   **Z-World Texture:** Conveyed through sensory details (hum, static, taste of air, feel of boots/ache) and limitations (costly view, repetitive work, thin food) rather than adjectives. The "numbers never break" subtly hints at the vast population.
  *   **Internalization:** The speaker states the refrains matter-of-factly, as accepted truths about their own existence and the constant addition around them. The child learning to stare at lights normalizes the context.
  *   **Folding Together:** The final quatrain places the two refrains consecutively, forcing them into direct contact without commentary. The preceding line ("We stack the boxes, neat, in ordered pairs") suggests the mechanistic, endless nature of the conclusion they imply. The reader feels the weight of "therefore, this world is better" without it being stated.
  *   **Tone:** Quiet, resigned, focused on the immediate. The horror is in the juxtaposition of the mundane reality with the relentless logic of the refrains she accepts.
  *   **Title:** "Policy Directive 7" – bureaucratic, impersonal, hinting at the theoretical framework imposing this valuation.
  *   **No Resolution:** Ends with the refrains standing side-by-side. The speaker continues her shift. The ethical dilemma remains unresolved within the poem's world.
