  ## The Flaw in the Lock: On the Necessity of True Irrevocability in Precommitment Architecture

  *By Silas Thorne, Principal, Thorne Commitment Counsel LLC (Specializing in High-Stakes Precommitment Architecture)*

  Colleagues,

  Our profession rests on a noble, if often thankless, premise: empowering individuals and institutions to bind their future selves against predictable volitional degradation. We craft Ulysses contracts – elegant mechanisms of self-governance designed to navigate the shoals of passion, procrastination, or market hysteria. Yet, after two decades drafting these instruments, I have identified a persistent, corrosive flaw in their standard architecture: the escape hatch. Or, more precisely, the entire *apparatus* of potential revocation – the cooling-off period, the petition procedure, the override clause. This "messy middle" fundamentally undermines the integrity of the precommitment.

  Consider the core logic. A client approaches us in State A – lucid, rational, and possessed of a clear-eyed understanding that her State B self (whether tempted by substance, impulsive spending, or the siren song of a bad investment) cannot be trusted. We design a mechanism: assets are sequestered, access is restricted, and an enforcer is appointed. The intent is absolute: State A *must* prevail over State B.

  But then, we introduce the fatal crack. We allow State B to *plead* with the enforcer. We permit, even codify, a process by which the bound party can argue that her desire for release isn't weakness, but a genuine evolution of values or circumstance. Worse still, we sometimes install a failsafe – a third party empowered to overrule the enforcer should they deem the plea valid.

  **This is where the architecture fails.** The very purpose of the Ulysses contract is to render the enforcer *deaf* to such pleas, whether they stem from akrasia *or* authentic value shift. Drafting cannot reliably distinguish between a craving rationalized as enlightenment and a bona fide change of heart. The distinction is epistemologically opaque at the moment of crisis. Therefore, *any* mechanism that allows for the contract's dissolution based on the bound party's *current* desires – no matter how articulated or adjudicated – reintroduces the weakness the contract was meant to defeat. It hands State B the key we were hired to destroy.

  The solution is stark, yet elegant: **True Irrevocability.** A serious precommitment must be just that – precommitted. It should contain *no* internal revocation procedure. No cooling-off period (a concession to transient doubt, not structural soundness). No petition right for the bound party (their voice *must* be silenced by their prior, wiser self). The enforcer’s sole duty is to execute the terms as written, forever. Their judgment on whether a request violates the agreement is, by definition, final because there *is* no request to consider; the agreement permits none.

  "But," I hear the cautious among us object, "what if the enforcer errs? What if they become corrupt? Who watches the watcher?" This objection misunderstands the nature of the structure. The enforcer is not a sovereign authority; they are a *mechanism*, an extension of State A's will. To install an override for the enforcer – a third-party reviewer – is simply to replicate the original flaw at a higher level. It transforms what was meant to be an individual's internal struggle into an interpersonal power dynamic. What began as one person's relation to her future self becomes, irrevocably, a relation between two (or three) distinct persons. The purity of the self-binding act is lost.

  Therefore, the enforcer's role must be defined with absolute finality. If we deem an enforcer necessary, their judgment *must* be unreviewable. Any suspicion that an enforcer *might* require oversight should lead us to one of two solutions: either design a purely mechanical lock requiring no human enforcer (algorithmic triggers, timed destruction of access codes), or, if a human element is unavoidable, ensure the enforcer themselves is bound by *their own* irrevocable Ulysses contract regarding their duties. This creates a closed, self-reinforcing system of precommitment, free from the contamination of later appeals.

  **This logic extends seamlessly to constitutional entrenchment.** We are seeing a rise in clients – institutions, cooperatives, even nascent polities – seeking to lock in foundational rules against future amendment. Our housing cooperative clients, for instance, often wish to preserve certain ownership structures or community principles "in perpetuity." Yet, standard legal drafting makes the same error as personal Ulysses contracts: it includes an amendment clause.

  An amendment clause *is* a revocation clause. It allows a future generation – a "State B" collective – to plead that circumstances or values have changed, and to petition (via supermajorities or other procedures) to undo the earlier commitment. A document that permits its own amendment has not truly bound anyone; it has merely created a higher hurdle for the future self it distrusts. True constitutional precommitment demands clauses that are not merely difficult to amend, but *structurally immutable*. The founding generation must have the courage to say: "This rule is not negotiable. Our judgment, crystallized here, is final. No future assembly, no matter how large its majority or how passionate its plea, can alter it." The "dead hand of the past" is not an insult; it is the *point* of the exercise – binding the future to prevent its perceived folly, whether that folly stems from weakness or wisdom.

  The fear of irrevocability stems from a sentimental attachment to the idea of an evolving, always-rational self or polity. But our profession exists precisely because we recognize that selves and societies *degrade*. We are architects of volitional fortresses. Let us build them without secret passages. Let the locks be true locks. Only then does the precommitment achieve its intended, protective purpose.

  Let us design instruments where the "messy middle" is eliminated, replaced by the clean, final clang of the irrevocable gate. The bound party – individual or collective – loses the standing to petition because their future voice has been contractually extinguished. The enforcer’s judgment is final because there is nothing *to* judge but adherence to the fixed terms. This is not harshness; it is fidelity to the original, clear-eyed intent of the precommitting self. Only through such uncompromising design can we deliver the protection our clients genuinely seek.

