answer: |-
  ### Essay Question  
  **"The utilitarian argument for prioritizing insect welfare rests on multiplying a minute probability of sentience (e.g., 1/1000) by the vast number of insects (∼10¹⁸). Critics object that this ‘probability’ reflects epistemic uncertainty about a *single fact* (e.g., ‘Are insects sentient?’), so multiplying it across individuals is illegitimate—akin to Pascal’s Mugging. Defenders counter that rejecting multiplication would also undermine obligations to farmed fish, future generations, or humans with uncertain sentience. Assess whether, and why, this multiplication is valid. What *kind* of probability is ‘the probability of insect sentience’ (e.g., credence over a binary fact, gradable property, decision weight)? Does its nature determine whether the arithmetic holds? How should symmetry with fish/future humans inform the answer?"**  

  ---

  ### Model Answer (698 words)  
  The multiplication challenge centers on whether low-probability/high-stakes expected value (EV) calculations apply when sentience is uncertain. To evaluate it, we must first define "probability of sentience." Three interpretations exist:  

  **(1) Credence over a binary fact**: Here, "P(sentience)" represents subjective confidence in a universal claim ("All insects are sentient" or "None are"). This probability is *perfectly correlated* across insects—if one is sentient, all likely are (barring fringe scenarios). Multiplying P by N insects assumes statistical independence, but correlation invalidates this. If P = 0.001 is credence that insects *as a class* are sentient, then EV = P × (Total welfare if sentient) × N. However, "Total welfare if sentient" itself depends on whether sentience exists—it’s not independent. Treating P as a multiplier for individual insects thus conflates uncertainty about a type with variation across tokens. This mirrors Pascal’s Mugging: a tiny chance of a true fact (e.g., "this mugger controls spacetime") justifies any bet, but we reject it because credences aren’t separable probabilities per individual.  

  **(2) Graded property**: Sentience might be scalar (e.g., insects have 0.001 "units" of subjective experience). Now P isn’t probability but *intensity*. Multiplying 0.001 × N is coherent: each insect contributes expected welfare proportional to its faint sentience. However, this presumes sentience is additive and linearly measurable—a major empirical and metaphysical commitment. If sentience is binary ("lights on/off"), grading collapses into interpretation (1).  

  **(3) Decision weight under ambiguity**: If we lack evidence to assign any probability (e.g., radical uncertainty about insect minds), P may reflect precautionary weight. But this divorces "probability" from EV calculus. Multiplying it isn’t arithmetic but a policy heuristic (e.g., "avoid large-scale risks").  

  **The arithmetic’s validity depends entirely on which interpretation we adopt**. Only (2) straightforwardly permits multiplication. Interpretation (1) requires aggregating welfare *conditional* on the fact being true—not distributing P across individuals. For example, if we assign 0.001 credence to insect sentience, we should spend 0.001% of resources on them *if sentient*, not multiply P by N. The latter erroneously treats credence as per-insect chance.  

  **Symmetry with fish/future humans** sharpens this. Consider farmed fish: if we have 95% credence they are sentient, EV calculations *condition* on that fact (e.g., 95% chance of preventing N instances of suffering). We don’t treat each fish as having independent 95% sentience probability—their sentience is correlated via shared evidence. Similarly, future humans’ existence depends on common factors (e.g., societal collapse). Thus, rejecting per-insect multiplication *doesn’t* automatically threaten these cases; we still compute EV conditional on the shared fact ("fish feel pain," "humans will exist"). The critic’s objection holds only if we misrepresent population-level uncertainty as individualized risk.  

  However, symmetry bites if evidence suggests *variation* within a kind. For example, if some fish species have dubious sentience markers, we might assign differing probabilities per individual (e.g., based on neuroanatomy). Here, multiplication *is* valid—but this requires independent evidence for variation, unlike the insect case where P is derived from uncertainty about the whole class. For future humans, if we’re uncertain *how many* will exist (e.g., due to climate scenarios), we multiply probabilities of population sizes by welfare impacts. But this differs from multiplying a *fixed* N by a uniform P.  

  Ultimately, the utilitarian’s calculation works only if "P(sentience)" is either (a) a gradable property or (b) a per-individual probability with *actual variation*. For insects, (a) is empirically implausible without evidence of scalable consciousness; (b) fails when P reflects ignorance about a type. The critic rightly notes that mistaking a type-uncertainty for token-variation invites absurd demands. But symmetry reveals a nuance: multiplication *is* valid for populations where individuals *do* vary in sentience likelihood (e.g., marginal humans with diverse brain injuries)—yet this variation must be evidenced, not assumed. The utilitarian’s error isn’t multiplying small probabilities *as such*, but misapplying it to correlated cases. Thus, insect welfare’s priority hinges on whether sentience uncertainty is decomposable per individual—a claim unsupported by evidence and structurally distinct from obligations to fish or future people.  

  ---

  ### Marking Scheme (20 marks total)  
  1. **Distinguishes probability interpretations** (4 marks): *A* answers define and contrast ≥2 views (e.g., credence vs. gradable property); *B* answers conflate them or address only one.  
  2. **Assesses multiplication per interpretation** (5 marks): *A* answers explain why arithmetic holds for gradable properties/individual variation but not correlated credence; *B* answers treat multiplication as universally valid/invalid.  
  3. **Engages symmetry objection rigorously** (5 marks): *A* answers show why rejecting multiplication *doesn’t* undermine fish/future humans (e.g., by conditioning on shared facts); *B* answers dismiss symmetry superficially or misapply it.  
  4. **Notes role of evidence for variation** (3 marks): *A* answers require empirical justification for per-individual probabilities (e.g., neurodiversity); *B* answers assume variation without evidence.  
  5. **Resolves the crux coherently** (3 marks): *A* answers conclude multiplication’s validity depends on sentience’s metaphysical/evidential status; *B* answers assert a position without integrating earlier analysis.  

  ---  
  This question forces engagement with probability metaphysics while leveraging pre-existing knowledge. The model answer demonstrates the needed precision, and the rubric targets conceptual clarity on each contested layer. Let me know if you’d like adjustments to the weightings or scope.
