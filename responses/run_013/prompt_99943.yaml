  **IN THE COURT OF GENERAL SESSIONS FOR THE METROPOLITAN DISTRICT**

  **PEOPLE OF THE METROPOLITAN DISTRICT**
  **v.**                                                          **Docket No.: CR-24-1785**
  **MICHAEL D. RHODES**

  **MEMORANDUM OPINION AND ORDER DENYING DEFENDANT'S MOTION FOR DOWNWARD DEPARTURE FROM SENTENCING GUIDELINES**

  **Filed:** October 27, 2024
  **Judge:** The Honorable A. N. Kyteler

  **1.**  This matter comes before the Court on the Defendant's Motion for Downward Departure from the Sentencing Guidelines ("Motion for Mitigation") pursuant to District Sentencing Statute § 45-9.12(c). Defendant Michael D. Rhodes, having pleaded guilty to one count of Armed Robbery in the Second Degree (DSS § 39-11-203), seeks a reduced sentence predicated on the following asserted factors: (1) a history of physical abuse perpetrated by his father during childhood; (2) a diagnosed but untreated opioid use disorder; and (3) the assertion that this disorder, coupled with the alleged abuse, created circumstances under which he "could not help" committing the robbery of MetroCare Pharmacy on June 14, 2024, to obtain oxycodone. The Court has reviewed the motion, the supporting psychological evaluation, the Pre-Sentence Investigation Report, and the People's response. For the reasons stated herein, the Motion for Mitigation is **DENIED**.

  **2.**  The foundational principle governing culpability and sentencing within this jurisdiction is the absolute and inescapable freedom of the human consciousness. This Court recognizes no entity, force, or antecedent condition capable of determining the choices of a conscious being. Character, temperament, upbringing, psychological state, physiological dependency, or external circumstance do not *cause* actions; they are themselves manifestations of choices perpetually renewed. To assert otherwise is to fundamentally misunderstand the nature of human existence.

  **3.**  Defendant's motion relies entirely on the fallacy of determinism. He presents his childhood experiences, his subsequent opioid dependence, and the imperatives of withdrawal as chains binding his will. This is a profound error. The Defendant's recollection of his father's violence is not an inert historical fact exerting causal pressure upon the present. It is a *meaning* he has chosen to confer upon those past events, a meaning he actively sustains in the present moment to serve a specific project – namely, the evasion of responsibility. He has chosen to interpret his past as a deterministic force, thereby fabricating the very "compulsion" he now pleads.

  **4.**  Similarly, the Defendant's assertion of an opioid use disorder compelling his criminal act constitutes a textbook instance of bad faith (*mauvaise foi*). He seeks to transform his consciousness into a mere object, a thing buffeted by chemical processes and physiological need. However, consciousness is not an object; it is pure transcendence. The state of "addiction," as described, is not a disease that *happened to* the Defendant. It represents a sustained project of choices: choices to initiate use, choices to continue use despite known consequences, choices to interpret withdrawal symptoms as unbearable imperatives rather than as sensations to be endured or rejected, and, ultimately, the choice to commit robbery. The anguish he describes is not proof of constraint, but the inevitable corollary of his recognition of freedom – a recognition he flees by attributing his actions to the opioid use disorder itself.

  **5.**  Defense counsel argues that the Defendant "never chose" his dependence. This assertion is incoherent. Dependence is not an exogenous condition imposed upon the will; it is the cumulative result of innumerable discrete choices made by the Defendant regarding the ingestion of opioids and the interpretation of his own desires and sensations. Each act of use was a free affirmation of the project of dependence. The present state of dependence is merely the sedimentation of those past free choices, which the Defendant, in his current freedom, chooses to perpetuate as the "reason" for his crime. His plea of "I could not help myself" is, paradoxically, the clearest demonstration that he *could* – for in uttering it, he exercises his freedom to define himself as helpless, thereby evading the anguish of acknowledging his own authorship of the act.<sup>1</sup>

  **6.**  The circumstances cited – the abusive father, the untreated disorder, financial hardship, the pangs of withdrawal – constitute what might be termed the *situation*. The Court readily acknowledges that freedom is always enacted *within* a situation; pure, abstract freedom is a chimera. However, the situation is not a cage. It presents only *resistance*, a field of obstacles and meanings against which the free project of the consciousness defines itself. The resistance encountered does not diminish freedom; it is the very condition *of* freedom's exercise and demonstration. A mountain presents resistance to the climber; it does not *cause* the climber to climb, nor does it excuse a failure to reach the summit. The Defendant encountered resistance; he chose the project of robbery as his response. Other projects – seeking treatment, enduring withdrawal, asking for help, or even choosing inaction – were perpetually available possibilities. His choice of robbery was an absolute, unsupported eruption of freedom within his situation.

  **7.**  To grant the requested mitigation based on the proffered factors would be to participate in the Defendant's bad faith. It would constitute a judicial endorsement of his self-objectification, treating him not as a free consciousness responsible for its choices, but as a determined object, a mere concatenation of causes and effects. This is the gravest insult the Court could deliver. It would deny the Defendant his fundamental humanity – his freedom – by reducing him to the status of a thing governed by antecedent conditions. True respect for the Defendant *as a person* demands that the Court hold him solely and entirely accountable for the free choice he made on June 14, 2024. Leniency founded on the denial of his freedom is not mercy; it is the deeper cruelty of confirming his self-deception and negating his being.<sup>2</sup>

  **8.**  Therefore, the Court finds that the factors presented by the Defendant do not constitute legally cognizable grounds for mitigation under our jurisprudence. They represent not facts diminishing culpability, but descriptions of the very project of self-deception by which the Defendant seeks to evade the burden of his freedom and the full consequences of his choice. The Sentencing Guidelines, formulated with a clear understanding of radical human responsibility, provide the appropriate framework for judgment.

  **IT IS THEREFORE ORDERED** that the Defendant's Motion for Downward Departure from the Sentencing Guidelines is hereby **DENIED**. Sentencing shall proceed as scheduled.

  A. N. Kyteler
  Judge, Court of General Sessions

  ---

  **Footnotes:**

  <sup>1</sup> *Cf. Metropolitan District v. Cartwright*, 422 Metro. Rep. 3d 112, 118 (Gen. Sess. 2021) ("The plea of compulsion, whether rooted in passion, addiction, or circumstance, is invariably the conscious act by which the defendant seeks to disguise his authorship of the act. It is the excuse that proves the freedom it disavows.").

  <sup>2</sup> This recognition of the Defendant's absolute freedom, even in the face of significant situational adversity, is the foundation of his dignity before the law. To treat him otherwise – as an object of pity determined by his past or his physiology – is to deliver a profound ontological injury. See generally *Sentencing Commission Commentary to DSS § 45-9.12*, Subsection (c): "Mitigation & the Ontology of the Subject."
