  Now for Darwin versus Turing. Darwin's natural selection is productive: it produces complex adaptations without any representation of biological norms. The mechanism of variation and selection explains competence without needing comprehension. Turing's computation is descriptive: when we say a computer runs a program, we're imposing an interpretation. The machine itself doesn't represent the algorithm; it's just flipping bits according to physical laws. We use the competence as an explanatory tool, but it's not inherent.

  The key issue is that cognitive science often treats the mind as computational, suggesting that mental competence comes from programs in the brain. But according to this argument, that's a descriptive inversion - we're interpreting brain processes as computations. This borrows prestige from Darwin's productive inversion, implying that the brain naturally produces competence the way evolution does, when it's really just us describing it that way.

  I should address some challenges. One big objection is that natural selection might also be descriptive because biological function depends on observers. But I think this fails - functions in biology are defined by survival and reproduction, not by human interpretation. A heart's function to pump blood is productive; it's not just described that way. For computation, though, the function is assigned by programmers.

  Also, the notion of algorithms in cognitive science already assumes the descriptive inversion. When we say the brain "computes," we're interpreting its states, not claiming it inherently represents computations. This makes computational explanations interpretive rather than fully causal - they're about how we model the system, not about fundamental mechanisms.

  The strongest objection is indeed about biological functions being observer-relative. But I'll counter that while descriptions require observers, the functional outcomes in biology exist independently. A heart pumps blood regardless of whether anyone observes it, whereas computational functions depend entirely on our assignment.

  What turns on this distinction? If cognitive science confuses descriptive with productive inversions, it might overstate what programs explain. Programs describe competence but don't produce it causally in the same way natural selection does. This doesn't mean computational models are useless - they're great for prediction and description - but they shouldn't be seen as explaining how competence arises naturally in the brain. What doesn't turn on it is the practical value of AI or computational models; the issue is about explanatory depth in understanding the mind.

