  1. **Represented, causal work now, beneficiary required**: Rationale must be internally represented and actively guiding behavior for some beneficiary's benefit. Name: Strong Representationalism. Awkward: Must deny real rationales in spider webs and prices, as they lack inner representations.  
  2. **Unrepresented, anchored by selection history, causal work not required, beneficiary required**: Rationale is real due to evolutionary history, even if idle now, serving a beneficiary. Name: Teleosemantics. Awkward: Must accept that extinct-predator warning colors have a real rationale despite doing nothing.  
  3. **Unrepresented, anchored by current feedback, causal work required, beneficiary not required**: Rationale is sustained by ongoing learning or feedback, actively shaping behavior, without needing a beneficiary. Name: Current Causal Role Functionalism. Awkward: Must deny rationales in spider webs (if no current learning) but affirm reinforcement learning agents, even if weights aren't "reasons."  
  4. **Unrepresented, anchored by selection history or current feedback, causal work not required, beneficiary required**: Rationale is real if anchored by history or active learning, even when idle, but must serve a beneficiary. Combines two anchors; not distinguished by questions. Name: Broad Teleofunctionalism. Awkward: Must accept idle traits like warning colors as rationales while also requiring beneficiaries for non-biological systems like prices.  
  5. **Unrepresented, anchored by nothing (interpreter's gloss only), causal work not required, beneficiary not required**: Rationale is purely interpretive, with no constraint from the system. Name: Nobody. Why empty: Unattractive (incoherently permissive), as it makes all interpretations equally real, e.g., seeing prices as tracking unicorns.
