answer: |-
  Here’s a rigorous breakdown of desiderata for a theory of phenomenal judgment under epiphenomenalism, the inherent tensions, and how standard responses fare. I’ll avoid relabeling the problem and focus on what must be explained.

  ---

  ### **Core Desiderata for an Epiphenomenalist Theory of Phenomenal Judgment**
  *(Non-negotiable marked with ⚠️; others may be contested)*

  1.  **⚠️ Causal Closure of Physics (CCP):**  
      *All physical events have sufficient physical causes.*  
      **Why:** Non-negotiable for physicalists/epiphenomenalists. Violating CCP introduces "spooky" causal gaps. Judgments (as physical events) must be fully explainable by prior physical states.

  2.  **Reliability (R):**  
      *Phenomenal judgments (e.g., "I see red") correlate reliably with actual phenomenal states.*  
      **Why:** Necessary to explain the *apparent* accuracy of introspection. If judgments were random or systematically mismatched, we couldn’t trust any first-person reports (undermining the data of consciousness studies).

  3.  **Phenomenal Inertness (PI):**  
      *Qualia cause no physical effects.*  
      **Why:** Defining constraint of epiphenomenalism. If qualia influenced the brain, they’d be physically efficacious.

  4.  **Judgment Transparency (JT):**  
      *Judgments about qualia present as *directly* reporting experience (e.g., "I *feel* pain," not "My C-fibers fired").*  
      **Why:** Introspection feels immediate. A theory must explain why we don’t experience judgments as inferences about neural states.

  5.  **Error Accommodation (EA):**  
      *Explains cases of *misjudgment* (e.g., placebo pain, anosognosia, ambiguous stimuli).*  
      **Why:** Introspection isn’t infallible. A theory must handle errors without collapsing distinctions between accurate/inaccurate judgments.

  6.  **Metacognitive Capability (MC):**  
      *Explains judgments *about* phenomenal judgments (e.g., "Am I *really* seeing red or just imagining it?").*  
      **Why:** We reflect on our experiences. A theory must account for higher-order access without invoking qualia as causes.

  ---

  ### **The Central Tension: Reliability (R) vs. Phenomenal Inertness (PI)**
  **The Conflict:**  
  - **PI** says qualia (Q) are causally inert.  
  - **R** requires that physical judgment-states (J) reliably track Q.  
  - **CCP** requires physical causes for J.  

  **The Epiphenomenalist's Move:**  
  J is caused by the *neural correlate* (N) of Q, not by Q itself. Since N reliably co-occurs with Q (by psychophysical correlation), J *indirectly* tracks Q.  

  **Why This Fails to Satisfy Reliability (R):**  
  1. **Tracking ≠ Correlation:**  
     Reliability requires that J is *sensitive* to Q. But if Q does nothing, J is only sensitive to N. If Q could change *without* N changing (or vice versa), J would be wrong, yet we’d have no way to detect this.  
     - *Example:* If a "red quale" Q1 suddenly paired with neural state N2 (normally "green"), you’d still say "this is red" when experiencing green. Reliability is luck, not tracking.  

  2. **No Justification for Trust:**  
     We rely on J for knowledge (e.g., "I’m in pain → seek help"). But if J is only about N, and Q is irrelevant, why trust J to report Q? The judgment "I am experiencing Q" is physically identical whether Q exists or not.  

  3. **Collapse of Distinction (EA Violation):**  
     Accurate/inaccurate judgments become indistinguishable *in principle*. If Q is severed from causal chains, all judgments are equally "hallucinations" of Q.  

  ---

  ### **What Must the Epiphenomenalist Give Up?**
  - **Reliability (R)** is the casualty. To preserve PI + CCP, they must deny that phenomenal judgments genuinely *track* qualia.  
  - **Consequence:** Phenomenal judgments are *systematically false* in claiming to report Q. They are really reports of N (the neural state), but mistakenly interpreted as being about Q.  

  **Result:** **Illusionism** (e.g., Dennett, Frankish).  
  - Qualia don’t exist, or judgments about them are illusory.  
  - *Satisfies:* CCP, PI (trivially), EA (errors are expected), MC (metacognition operates on neural states).  
  - *Violates:* R (reliability is abandoned), JT (judgments aren’t transparent; they’re misinterpretations).  

  ---

  ### **Scorecard of Standard Moves Against Desiderata**  
  | **Theory**               | CCP | PI  | R   | JT  | EA  | MC  | **Cost**                                  |  
  |---------------------------|-----|-----|-----|-----|-----|-----|-------------------------------------------|  
  | **Epiphenomenalism + Correlation** | ✓   | ✓   | ✗   | ~   | ✗   | ~   | Reliability & error distinction collapse. |  
  | **Parallelism/Pre-harmony** | ✗   | ✓   | ✓   | ✓   | ✓   | ✓   | Violates CCP (non-physical synchronicity).|  
  | **Identity Theory**         | ✓   | ✗   | ✓   | ~   | ✓   | ✓   | Denies PI (qualia *are* physical).        |  
  | **Illusionism**             | ✓   | ✓   | ✗   | ✗   | ✓   | ✓   | Denies reality of qualia/judgment truth.  |  
  | **Interactionism**          | ✗   | ✗   | ✓   | ✓   | ✓   | ✓   | Violates CCP + PI (qualia cause physics). |  

  **Key:** ✓ = Satisfies, ✗ = Fails, ~ = Partial/Contested  

  ---

  ### **Conclusion: The Non-Negotiable Trade-off**  
  - **CCP + PI** require abandoning **Reliability (R)** for phenomenal judgments. The "neural correlate" move preserves *correlation* but cannot ground *epistemic justification* for trusting judgments about qualia.  
  - **The Price:** Epiphenomenalism can only "explain" phenomenal judgments by redefining them as *judgments about brain states* that we misdescribe as qualia. This dissolves the transparency of experience (JT) and makes error (EA) indistinguishable from accuracy.  
  - **Your Suspicion is Correct:** Reliability and phenomenal inertness *are* jointly unsatisfiable under physical causal closure. The epiphenomenalist must either embrace illusionism (deny R) or abandon physicalism (deny CCP).  

  This is why threads die: the correlation move is a label, not a solution. It papers over the tension between causal inertness and the lived authority of phenomenology. To progress, one must choose a side.
