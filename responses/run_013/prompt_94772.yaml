  Hmm, the user is a museum writer who crafts exhibits for small heritage sites and is struggling with historical inaccuracies that communities cling to. They need a practical, step-by-step procedure to evaluate contested stories during the first week of a job—not academic theory. Their existing framework has three tests (present-tense relevance, narrative function, audience impact), but they want it refined into an actionable protocol with clear decision points.

  The user's pain points are practical: volunteer boards with emotional stakes, limited time per project (1-2 weeks), and past mistakes where challenging myths backfired. They explicitly reject citations but crave honesty about the method's limitations. Their three proposed cases (Confederate plaque, Masada, Dunkirk) are perfect stress tests for the procedure.

  Breaking this down: Their three tests aren't muddled but overlapping. The "job test" (what the myth accomplishes) is the analytical core, while "present-tense" and "audience" are context filters. The output options need tightening—"route around it" is vague, and "present as open dispute" might inflame tensions in small communities. 

  Key insights for the procedure: First, efficiency is non-negotiable—it must work in days. Second, the volunteer board's power dynamics can't be ignored; sometimes "leave it alone" is the only professional option. Third, the audience test is their most original contribution—forcing confrontation with who physically faces the exhibit—so it stays.

  For the Confederate plaque case: Present-tense test screams "live" (removal debates), job is "moral win for white supremacy," audience is Black residents who must confront glorification of their oppressors. Output? Can't route around or present neutrally—must contextualize or refuse the job. But if the board insists? That's a values call: walk away.

  Masada is trickier. Present-tense? Less urgent outside Israel. Job? Moral victory myth. Audience? Tourists who likely don't have trauma ties. Here, complicating it with archaeological dissent ("some scholars question...") is low-risk. Dunkirk exposes the method's limits: present-tense (UK national identity), job (defeat-to-heroism), audience (veterans' families). Challenging it might sink the project. Output: route around or minimally footnote unless trustees agree otherwise.

  The procedure's failure points are stark: When trustees veto truth, when funding depends on myth, or when the writer's ethics can't bend. I'll flag these as "VALUES CALL" in caps. No sugarcoating—sometimes the answer is "drop the client."
answer: |-
  Here’s a streamlined procedure based on your framework, designed for speed and clarity. It prioritizes your "gut" instincts but structures them into actionable steps. **Bold text marks decision points where you must use judgment** (values calls). Failures and hard truths are in *italics*.

  ---

  ### **The Contested History Procedure (Week 1)**
  **Goal:** Decide how to handle a disputed story in an exhibit.  
  **Time:** 3–4 hours per story (interview board, scan local media, draft output).  
  **Tools:** Notebook, 3 sticky notes per story (one for each test).

  #### **STEP 1: THE PRESENT-TENSE TEST (10 min per story)**  
  **Ask:** *"Who is using this story TODAY to win an argument, claim resources, or avoid blame? Give specific examples."*  
  **Good enough answer:** Names of groups/individuals + their current goal (e.g., "The historical society uses it to block the new community center").  
  **Move on if:** No one can name a *current* conflict. *If it’s "just tradition," skip to STEP 3.*  
  **Red flag:** If multiple groups name opposing uses (e.g., "It proves our ancestors were heroes" vs. "It whitewashes slavery").

  #### **STEP 2: THE JOB TEST (15 min per story)**  
  **Ask:** *"What emotional or political heavy lifting does this story do? Pick one:  
  A) Turn defeat into moral victory?  
  B) Hide who caused harm?  
  C) Make the present feel inevitable?"*  
  **Good enough answer:** Consensus on A, B, or C + who benefits (e.g., "It’s A – lets the town feel proud of a massacre").  
  **Move on if:** The board agrees on the job. *If they refuse or can’t articulate it, assume B (hiding harm).*  

  #### **STEP 3: THE AUDIENCE TEST (5 min per story)**  
  **Ask:** *"Who has to stand in front of this panel? The people it flatters, or the people it hurts?"*  
  **Good enough answer:** Visualize a specific person (e.g., "Black families on the school trip" or "Veterans’ grandkids").  
  **Move on if:** You can picture the audience. *If unsure, default to "those it hurts" – safer ethical choice.*  

  ---

  ### **OUTPUT DECISION (15 min per story)**  
  **Use this flowchart:**  
  1. **If Step 1 (Present-Tense) is "LIVE" + Step 3 (Audience) is "HURTS":**  
     - **CHOOSE:** "Present as open dispute" or "Tell story + what it does."  
     - *You cannot "route around" or "tell as fact" without causing harm.*  

  2. **If Step 2 (Job) is "HIDE HARM" (B):**  
     - **CHOOSE:** "Tell story + what it does" (e.g., "This plaque shifted blame from slave owners to 'northern aggression'").  
     - *Never "tell as fact" – this is actively dangerous.*  

  3. **If Step 1 is "NOT LIVE" and Step 3 is "FLATTERS":**  
     - **CHOOSE:** "Route around it" (omit) or "Present as open dispute" if harmless.  

  4. **If trustees resist all above:**  
     - **VALUES CALL:** *Walk away. You’ll cost the client more by enabling harm.*  

  ---

  ### **WHERE IT FAILS (HONEST TRUTHS)**  
  - **Fails when:**  
    - Trustees lie about the story’s current use (Step 1). *Trust your gut – if local news contradicts them, believe the news.*  
    - The audience (Step 3) is abstract (e.g., "tourists"). *Then ask: "Who does this silence?"*  
    - Money is tied to myth (e.g., Dunkirk gift shop). *Output will likely be "route around" or quit – you can’t fight economics.*  
  - **You’ll hate:**  
    - "Route around it" feels cowardly but is often the *only* option with volunteer boards.  
    - "Leave it alone" is sometimes ethical (if not live and harmless).  

  ---

  ### **RUN THE CASES**  
  **Case 1: Confederate Plaque**  
  - **Step 1:** **LIVE.** Heritage group vs. townspeople (removal debate).  
  - **Step 2:** **JOB B.** Hides slavery as cause, frames fighters as "patriots."  
  - **Step 3:** **AUDIENCE HURTS.** Black residents stand in front of it.  
  - **Output:** Must "present as dispute" or "tell story + its job." *Cannot restore as fact. VALUES CALL: Refuse job if board insists on glorification.*  

  **Case 2: Masada**  
  - **Step 1:** **LIVE?** In Israel (national myth), less so abroad. If outside Israel, likely not live.  
  - **Step 2:** **JOB A.** Turns Roman massacre into "heroic last stand."  
  - **Step 3:** **AUDIENCE FLATTERS.** Tourists seeking inspiration (not descendants).  
  - **Output:** "Tell story + what it does" (e.g., "Josephus’ tale inspired modern Israelis"). *Safe to complicate since harm is low.*  

  **Case 3: Dunkirk**  
  - **Step 1:** **LIVE.** UK national identity, school programs.  
  - **Step 2:** **JOB A.** Turns military disaster into "people’s victory."  
  - **Step 3:** **AUDIENCE FLATTERS.** Veterans’ families, proud Brits.  
  - **Output:** **Route around it.** *Fighting this costs you the job and helps no one. Add a footnote if possible: "Some historians note the Luftwaffe held back."*  

  ---

  ### **FINAL NOTES**  
  - **Drop the "Job Test" if simplifying?** No – it’s your core tool. Step 1 (Present-Tense) is most skippable if uncontested.  
  - **Your output list works.** Just redefine:  
    - **"Route around"** = Omit the myth entirely.  
    - **"Present as open dispute"** = "Some say X, others say Y, evidence suggests Z."  
  - **You decide at:**  
    - **VALUES CALL 1:** Does the harm of a lie (Step 3) outweigh client wishes?  
    - **VALUES CALL 2:** Is your integrity worth firing yourself over?  

  This won’t prevent all fights, but it forces the board to confront *why* they want the story – and gives you an exit before you’re complicit.
