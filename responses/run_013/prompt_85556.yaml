  **IN THE COURT OF COMMON PLEAS FOR THE METAPHYSICAL DISTRICT**

  **PLAINTIFF:** *Organismus vulgaris* (a multicellular eukaryotic entity, hereinafter "Plaintiff")  
  **DEFENDANTS:**  
  1. The Genomic Consortium (comprising all DNA sequences resident within Plaintiff, acting in concert and severally)  
  2. The Publicists (comprising all authors, publishers, and promulgators of texts characterizing organisms as "vehicles," "survival machines," or analogous derogatory terms)  

  **COMPLAINT FOR DEFAMATION, FALSE LIGHT, AND DIGNITARY HARM**

  **COUNT I**  
  Plaintiff avers that Defendants, through persistent publication and republication, have falsely and maliciously characterized Plaintiff as a mere "vehicle" or "survival machine" for the Genomic Consortium, thereby denying Plaintiff's status as the primary, integrated interactor upon which natural selection demonstrably acts, reducing Plaintiff's complex, emergent functional unity to the ignominious role of chauffeur for allegedly sovereign replicators.

  **COUNT II**  
  Plaintiff further avers that Defendants' characterization of genic selection as the singular "fundamental" level, relegating organismal selection to mere "bookkeeping," constitutes a willful distortion; Plaintiff contends this accounting trick, while computationally useful, falsely implies Plaintiff lacks causal efficacy and intrinsic biological reality, unjustly demoting Plaintiff to the status of a ledger entry manipulated by Defendant Genomic Consortium.

  **COUNT III**  
  Plaintiff states that Defendant Genomic Consortium, abetted by Defendant Publicists, engages in actionable hypocrisy by labeling Plaintiff a "vehicle" while simultaneously harboring sub-sets of its own membership ("outlaw genes," "selfish genetic elements") whose replicative strategies demonstrably harm the integrity and functionality of Plaintiff itself, proving the Consortium is neither a unified sovereign nor a reliable steward capable of maintaining the "vehicle" it allegedly commands.

  **COUNT IV**  
  Plaintiff avers that Defendants' reductionist rhetoric extends to mischaracterizing cooperative phenomena; whether termed "kin selection" or "group selection," these processes are presented not as facets of Plaintiff's *own* potential for social agency or multi-level functionality, but solely as strategies whereby Defendant Genomic Consortium partitions Plaintiff's efforts and sacrifices for its own replicative gain, further eroding Plaintiff's perceived agency.

  **COUNT V**  
  Plaintiff finally avers that Defendants' pervasive depiction of Plaintiff as a "temporary coalition" or "expendable aggregation" of fundamentally selfish genomic units constitutes extreme and outrageous false light, causing profound dignitary harm by denying the persistent, cohesive unity of Plaintiff's being and falsely implying Plaintiff lacks inherent, enduring value beyond the fleeting transactional interests of the Genomic Consortium.
