  ### Key Feature and Redundancies
  - **Key feature**: The existence of a column (R) where M is uniquely best (requirement 2) and has high payoff, and other columns where M is weak. This ensures M is not dominated initially (due to R) but becomes dominated after R is deleted (since R's protection is gone).  
  - **If dropped**: If M were not uniquely best to R (e.g., if T or B were as good as M against R), then M might be dominated in the full game, breaking requirement 3.  
  - **Friend's attack**: Might argue that the pure Nash in the final 2x2 (though unintended) makes the example "degenerate." Counter: The focus is on domination changes, not equilibrium properties. Remove requirement 7 if needed.  
  - **Redundant requirements**:  
    - Requirement 5 is redundant given 4 (strict domination implies never a best reply).  
    - Requirement 6 (forced deletion) ensures clarity but isn't essential to the core point.  
    - Requirement 2 and 3 are interdependent: Removing 2 might allow M to be dominated initially.  
    - Requirement 7 is standalone and can be omitted without affecting the main phenomenon.  

  ### Construction Notes
  - **Why it works**: R "shields" M from domination in the full game by providing a column where M excels. Deleting R exposes M's weakness in L and C, allowing a mixed strategy to dominate it.  
  - **Payoff choices**: Player 2's payoffs for R are designed to be beaten only by a mix (1), and player 1's payoffs for M are high against R (2) but low otherwise (0 or 1), creating the shift.  
  - **Bounds**: Small integers used; inequalities are easily verifiable.
