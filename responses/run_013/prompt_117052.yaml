  ### Explanation  
  - **Vera’s authority** (decisive over {a, c}) is voiced in "Vera cancels, refuses the stage" (c > a).  
  - **Sam’s authority** (decisive over {b, c}) is voiced in "Sam chooses to speak, not withdraw" (b > c).  
  - **Weak Pareto** (a > b) is voiced in "Both rank Vera first, Sam no more."  
  The pantoum’s recursive form mirrors the cycle: each authority and Pareto verdict reappear, forcing a return to the start (b > c > a > b). Meter is iambic tetrameter, enforcing the "rigid rule" that creates irresolvable contradiction.
