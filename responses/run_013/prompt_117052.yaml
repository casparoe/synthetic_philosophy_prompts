  Sam chooses to speak, not withdraw.  
  Vera cancels, refuses the stage.  
  Both rank Vera first, Sam no more.  
  The cycle spins, trapped in its cage.  

  Vera cancels, refuses the stage.  
  Pareto demands Vera present.  
  The cycle spins, trapped in its cage.  
  Her authority stands, dissent.  

