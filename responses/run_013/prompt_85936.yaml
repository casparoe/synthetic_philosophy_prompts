  ### Thought Experiment: The Wax Apple

  Alice, a philosophy student with no expertise in perception, enters her kitchen and sees a red apple on the table under normal lighting. She forms the belief that *there is a red apple on the table* based on her visual experience. In the actual case, this experience is veridical: a real apple is present and causes her perception normally. Unbeknownst to her, in a nearby possible world, a visually indistinguishable wax replica (moulded from a real apple and identically coloured) replaces the apple. Here, her experience is non-veridical—the replica is not an apple, so *p* is false—but she forms the same belief from the same evidence (identical phenomenal character, lighting, and viewing angle). Alice has no prior suspicions or false beliefs about the setup, and the replica was placed by a friend without her knowledge. The experiences differ metaphysically: the actual case involves direct awareness of the apple (disjunctivist veridical perception), while the counterpart is an illusion (no apple exists to cause the experience directly).

  1. **Belief, Method, and Nearby Worlds**:  
     - Belief: *There is a red apple on the table*.  
     - Method: Formed via visual perception under normal conditions (good lighting, no obstructions).  
     - Relevant nearby worlds: The actual world (real apple) and the counterpart world (wax replica).

  2. **Theoretical Responses**:  
     - **Sense-datum theorist**: Both cases involve direct awareness of an identical sense-datum (a red, apple-shaped datum), making the experiences epistemically equivalent despite different causes.  
     - **Adverbialist**: Alice senses "appley-redly" in both cases, so the experiences share a common mental modification, justifying the belief equally.  
     - **Naïve realist**: Only the actual case constitutes a genuine perceptual relation to the apple, providing direct justification; the counterpart is a different, non-relational state, so justification differs fundamentally.  
     - **Disjunctivist**: The experiences are metaphysically distinct (veridical perception vs. illusion), so the actual case provides factive, world-involving justification absent in the counterpart, rejecting a common epistemic factor.

  3. **Key Feature for the Epistemic Argument and Its Removal**:  
     The critical feature is that Alice has *no access to external indicators* (e.g., context, history, or anomalies) that could distinguish the cases from her perspective, forcing justification to depend solely on the shared subjective evidence. If Alice knew her friend often placed replicas (adding a defeating reason), she would lack justification in the counterpart, undermining the argument by breaking the epistemic symmetry.

  4. **Disjunctivist Attack and Proponent's Concession**:  
     A disjunctivist would attack by arguing that the actual case’s factive reason (direct contact with the apple) provides stronger, non-inferential justification unavailable in the counterpart, making the justification *different in kind* despite superficial similarity. The proponent of the argument should concede that the veridical case may yield knowledge (unlike the counterpart) but insist that the *justificatory status for the belief* is identical because Alice’s rational grounds (e.g., absence of doubt, same phenomenal evidence) are indistinguishable.

  The scenario demonstrates that epistemic indistinguishability—not merely phenomenal—entails identical justification, as Alice’s rational position is symmetric across cases due to her limited perspective.  
  \answer{argument from illusion}
