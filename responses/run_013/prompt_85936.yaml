  Relevant nearby worlds: 
  - Actual world: the world in which there is a real apple on the table.
  - Counterpart world: the world in which there is a wax replica of an apple on the table (same appearance).

  Second: What each theory says:
  - Sense-datum theorist: In both cases, Alice is directly aware of a sense-datum (a red, apple-shaped sense-datum). In the veridical case, the sense-datum corresponds to the real apple; in the non-veridical case, it does not. The common factor is the sense-datum.
  - Adverbialist: In both cases, Alice is sensing in a certain manner (e.g., "appley-redly"). The experience is a modification of consciousness. The common factor is the adverbial state.
  - Naïve realist (a form of disjunctivism): Only in the veridical case is Alice directly aware of the real apple and its properties. In the non-veridical case, there is no such direct awareness. The experiences are fundamentally different in kind: one is a relation to the apple, the other is not. There is no common factor in the experience itself.
  - Disjunctivist (epistemological): The disjunctivist maintains that the two experiences are of different kinds. The veridical experience provides factive reasons (the presence of the apple) which the non-veridical does not. However, they might concede that from the subject's perspective, the evidence seems the same, but that does not mean the justificatory status is the same. But note: the argument from illusion is pressing on the justificatory status being the same.

  Third: Identify the single feature that makes the epistemic argument work despite the disjunctivist's metaphysical distinction. And explain if that feature is removed.
  The key feature is that the subject has no evidence or reason to doubt that her experience is veridical in either case. The evidence available to her (the phenomenal character of the experience and her background beliefs) is identical. Thus, she is equally justified in both cases. If we remove this feature — for example, if Alice had reason to suspect that her nephew might have replaced the apple with a replica (say, if she knew he was visiting and had done so before) — then in the counterpart case she might not be justified. But in the scenario, she has no such reason. So the feature is the absence of any defeating evidence.

