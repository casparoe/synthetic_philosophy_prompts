  I am a doctoral candidate in philosophy working on disjunctivism and the epistemology of perception. I need a thought experiment constructed to specification for a paper on the argument from illusion. The target is the following epistemic version of the argument: if a veridical perception and a subjectively indistinguishable non-veridical experience give the subject the same justification for her perceptual belief, then they must share a common epistemic factor, and disjunctivism is false as an epistemic thesis. I want a case that isolates the variable at issue—epistemic indistinguishability as opposed to mere phenomenal indistinguishability—while holding everything else fixed.

  Please construct a single realistic perceptual scenario in which: (i) a subject forms a perceptual belief that p; (ii) in the actual case her experience is veridical, p is true, and her experience is caused in the normal way by the fact that p; (iii) there is a subjectively indistinguishable counterpart case in which her experience is non-veridical, p is false or the experience is not caused by p, and she has exactly the same evidence and forms the same belief; (iv) the two experiences differ in metaphysical kind, as the disjunctivist claims; and (v) the case makes it plausible, rather than merely stipulates, that the subject's justification is the same in both cases. Constraints: the scenario must be realistic and ordinary; no brains in vats, no evil demons, no hallucinogenic drugs, no science fiction; it must be one paragraph; no more than two objects and one subject; the subject must not be an expert on perception; and the case must not turn on any antecedent false belief the subject has about the object, though the perceptual belief itself may be false in the non-veridical counterpart.

  After the scenario, do the following. First, state the belief, the method by which it is formed, and the relevant nearby worlds. Second, say what a sense-datum theorist, an adverbialist, a naïve realist, and a disjunctivist each say about the case, and why. Third, identify the single feature of the case that makes the epistemic argument from illusion work despite the disjunctivist's metaphysical distinction, and explain what happens if that feature is removed. Fourth, say how a disjunctivist would attack the case, and what a proponent of the epistemic argument from illusion should concede. Finally, give your verdict on whether the case supports the epistemic argument from illusion or disjunctivism, in British English. Immediately before the final line, provide a one-sentence summary of your reasoning. Then make the final line a machine-readable line \answer{...} containing only a label for that verdict, either argument from illusion or disjunctivism.
