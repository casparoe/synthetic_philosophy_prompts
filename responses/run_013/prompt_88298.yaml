prompt: |-
  In a number of democracies, bodies of randomly selected ordinary citizens are given real decision-making or agenda-setting power: the jury is the oldest example, and the more recent "citizens' assembly" -- convened to deliberate on a single well-framed question such as constitutional change or climate policy -- is a newer one. In each case the random body is trusted with a narrow question, and the ordinary business of legislating remains with elected representatives who in practice make a career of it. Many of these same systems also cap the number of terms a president or governor may serve while placing no comparable limit on legislators, who can be returned to office indefinitely.

  I would like a philosophical reconstruction of what these arrangements presuppose. Consider the apparent inconsistencies the asker is puzzled by. First: we will let twelve randomly chosen citizens decide whether a stranger spends the rest of his life in prison, but we will not let randomly chosen citizens set a tax rate -- what does that asymmetry assume about the kind of judgment a decision requires? Second: sortition is in one respect the most radically anti-careerist device imaginable, since a randomly selected body cannot be campaigned for or captured, yet citizens' assemblies are almost always convened by, and report back to, the elected officials whose authority they are meant to check -- does that practice presuppose that the elected body retains a legitimacy the random body lacks, and if so, on what view of legitimacy? Third: term limits are imposed on executives but not on legislators; does that presuppose that the harm of long tenure is entrenchment in a single office rather than incumbency as such, or that the executive wields a kind of power -- command, initiative, the ability to entrench a faction -- that a single legislator does not?

  For each of the three, reconstruct the implicit theory of political competence, representation, and accountability that the practice only makes sense under, and state which rival theories it quietly rules out. Distinguish carefully between what the practice strictly presupposes and what it merely happens to fit well with, and say where it is philosophically underdetermined, so that several incompatible views would each license the same arrangement. Where the presuppositions conflict with one another across the three practices, say which of them a coherent defender of all three would have to give up, and what the institutional arrangement would look like if it were rebuilt on the presupposition you think is doing the most work.

  Lead with your bottom line in the first sentence -- your overall verdict on what these practices presuppose -- and then give the reasoning. No preamble, and do not restate my question.
reasoning: |-
  Hmm, the user wants me to reconstruct the philosophical presuppositions behind certain democratic practices involving random citizen bodies, term limits, and apparent inconsistencies. They've presented three puzzles: why random citizens can decide serious criminal cases but not tax rates; why citizen assemblies report to elected officials despite being anti-careerist; and why executives have term limits while legislators don't.

  I need to start with a bottom-line verdict in the first sentence. Then I'll systematically address each puzzle by reconstructing the implicit theories of political competence, representation, and accountability. I must distinguish between strict presuppositions and mere compatibility, note where things are underdetermined, identify conflicts between presuppositions, and suggest what a coherent defender would need to give up.

  For the first puzzle about juries vs. tax decisions, the key seems to be the nature of judgment required. Juries focus on concrete facts and moral culpability - applying community standards to specific cases. Tax rates involve complex, systemic trade-offs requiring technical expertise and continuous adjustment. This presupposes that some decisions need specialized knowledge while others rely on common sense moral judgment. It rules out theories that see all political judgment as fundamentally similar.

  Regarding the second puzzle about citizen assemblies reporting to elected bodies, this suggests that while sortition prevents corruption, it lacks formal authorization and continuity. Elected bodies gain legitimacy through regular elections that confer popular consent. This presupposes a proceduralist view of legitimacy based on authorization, potentially ruling out pure epistocratic or pure deliberative democratic theories that might see random selection as sufficient.

  For the third puzzle about term limits for executives but not legislators, this indicates a distinction between concentrated power and distributed power. Executives can entrench factions and abuse command authority, while legislators face internal checks and represent diverse interests. This presupposes that the danger lies in unitary power concentration rather than tenure itself, ruling out views that see all long incumbency as equally corrupting.

  Now I notice conflicts: the jury practice values lay judgment in moral matters, while the citizen assembly reporting practice subordinates lay judgment to elected authority. Also, term limits assume careerism is dangerous only in concentrated power, but citizen assemblies assume elected careerism needs checking through sortition.

  A coherent defender would need to resolve these. They might abandon the idea that random bodies inherently lack legitimacy for agenda-setting, instead seeing them as supplementary but subordinate. The institutional implication would be to formalize citizen assemblies with more autonomy while maintaining their issue-specific, temporary nature.

  I'll organize this clearly with the bottom line first, then address each puzzle in order, highlighting presuppositions, rival theories, strict vs. compatible elements, underdetermined aspects, conflicts, and necessary concessions.
answer: |-
  These arrangements presuppose that distinct political functions require distinct legitimating foundations, with procedural authorization necessary for continuous governance but lay judgment sufficient for bounded moral or agenda-setting tasks, while asymmetrical term limits reflect a focus on containing concentrated power rather than tenure itself.

  **First asymmetry (juries vs. tax-setting):**  
  - *Presupposes* that criminal guilt involves applying communal moral norms to concrete facts—a task where ordinary experiential wisdom ("common sense") is competent. Tax policy requires balancing incommensurable goods (e.g., equity vs. growth) amid dynamic systemic effects, demanding technical expertise and iterative adjustment incompatible with ad hoc lay bodies.  
  - *Rules out* theories equating all political judgment (e.g., radical populism claiming "the people" can decide any issue) or reducing justice to pure procedure (e.g., positivism denying juries' moral role).  
  - *Strictly presupposes* a categorical distinction between particularistic moral discernment and systemic instrumental reasoning.  
  - *Underdetermined* whether this stems from epistemic limits (laypeople lack economics knowledge) or normative ones (taxation requires ongoing mandate).  
  - *Fits with* trustee over delegate representation for legislators.

  **Second asymmetry (sortition’s anti-careerism yet subordination to elected bodies):**  
  - *Presupposes* that legitimacy for *continuous* authority requires explicit periodic authorization (elections), while random bodies gain legitimacy only *procedurally* (fair selection) and *epistemically* (deliberative quality) for specific, bounded tasks. Elected bodies retain superior legitimacy as the authorized conduit of popular sovereignty.  
  - *Rules out* pure epistocracy (which would distrust lay judgment) and strong deliberative democracy (which might see sortition as intrinsically superior to electoral mandates).  
  - *Strictly presupposes* that elections confer unique legitimacy via accountability mechanisms absent in sortition (e.g., recall, public scrutiny of campaigns).  
  - *Underdetermined* whether elected superiority stems from authorization alone or also competence.  
  - *Fits with* a hybrid view: sortition checks elite capture but doesn’t replace electoral accountability.

  **Third asymmetry (term limits for executives not legislators):**  
  - *Presupposes* that executives wield *unilateral power* (e.g., command of bureaucracy, veto, agenda-setting) enabling entrenchment and factional dominance, while legislators act collectively, their influence diffused and checked internally. Harm arises from *concentrated* incumbency, not tenure per se.  
  - *Rules out* theories viewing all long tenure as corrupting (e.g., strict rotation advocates) or all incumbency as equally legitimate (e.g., majoritarianism indifferent to power concentration).  
  - *Strictly presupposes* that institutional role, not individual longevity, determines corruption risk.  
  - *Underdetermined* whether the concern is authoritarianism (executives resemble monarchs) or factionalism (executives empower partisan networks).  
  - *Fits with* a Madisonian fear of "elective despotism."

  **Conflicts and coherence:**  
  - The jury practice valorizes lay moral judgment, while subordinating citizens’ assemblies implies elected bodies’ unique legitimacy—a tension if sortition is seen as *inherently* democratically purer.  
  - Term limits assume careerism is dangerous only when power is concentrated, yet citizens’ assemblies exist to counter elected careerists’ biases.  
  - *A coherent defender must abandon* the implicit claim that random bodies intrinsically lack legitimacy for agenda-setting. Instead, they should treat sortition as a *supplementary* legitimacy source (deliberative, non-partisan) that remains subordinate to electoral authorization for binding decisions.  
  - *Rebuilt arrangement:* Citizen assemblies would gain agenda-setting autonomy (e.g., placing proposals directly on ballots) but remain temporary and issue-specific, acknowledging that their legitimacy is *functional* (for impartial deliberation) not *foundational* (like electoral mandates). Legislators stay uncapped due to diffuse power, but citizens’ assemblies periodically review electoral rules to combat careerist entrenchment—resolving the tension via functional separation. The executive term limit remains, as its concentrated power poses unique risks.
