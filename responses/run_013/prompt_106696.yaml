answer: |-
  ### Exam Question: Thomson's Lamp and Supertasks (25 marks total)  
  *(Answer all parts. Time: 90 minutes)*  

  **Thomson’s Lamp** is set toggled infinitely many times in a supertask: switched on at \( t = 0 \), off at \( t = \frac{1}{2} \), on at \( t = \frac{3}{4} \), off at \( t = \frac{7}{8} \), and so on, completing all switches by \( t = 1 \). A debate exists over whether this description:  
  (A) *Underdetermines* the lamp’s state at \( t = 1 \) (i.e., the setup is consistent but incomplete), or  
  (B) Is *inconsistent* (i.e., logically impossible).  

  1.  **Commitment and Distinction (9 marks):**  
      Argue for either (A) or (B). Your answer must:  
      - Explain why your chosen position is stronger than the alternative.  
      - Separate the concept of *underdetermination* (outcome not fixed by the rules) from *inconsistency* (rules imply a contradiction).  
      - State clearly whether the lamp’s final state is undefined (underdetermined) or contradictory (inconsistent).  

  2.  **The Dimming Lamp Variant (8 marks):**  
      Consider a modified lamp where the *brightness* at step \( n \) is set to \( 1 - 2^{-n} \) (so after step 1, brightness = 0.5; step 2, brightness = 0.75; etc.). The supertask schedule (time-steps) is identical to Thomson’s original.  
      - Is the brightness at \( t = 1 \) determinate? Justify your answer.  
      - What does this imply about whether the indeterminacy in the *original* Thomson’s lamp arises from the supertask itself or from the nature of the variable (on/off vs. continuous)?  

  3.  **The Parity Lamp Variant (8 marks):**  
      Suppose we stipulate for the *original* Thomson’s lamp: "The lamp is on at \( t = 1 \) if and only if the total number of toggles is even."  
      - Does this stipulation resolve the indeterminacy? Explain why or why not.  
      - What does this reveal about the difference between *underdetermination* and *incoherence* (i.e., a rule that appears meaningful but is ill-defined)?  

  ---  
  ### Model Answer (Full Marks, ~750 words)  

  **(1) Commitment and Distinction**  
  Thomson’s lamp description is *underdetermined*, not inconsistent. Underdetermination means the rules permit multiple logically possible outcomes without specifying which occurs; inconsistency means the rules entail a contradiction, making the scenario impossible. Here, the supertask mechanically executes infinitely many toggles without contradiction: each step \( n \) (for \( n = 1,2,3,\ldots \)) has a definite state (on or off) at time \( t = 1 - 2^{-n} \), and the lamp exists at \( t = 1 \). The inconsistency reading claims the final state *must* be both on and off, violating non-contradiction. But this misreads the setup. The lamp’s state changes only at defined times *before* \( t=1 \), and no rule governs \( t=1 \) itself. Thus, the outcome is undefined—like asking "what is \( x \)?" after listing \( x = (-1)^n \) for all finite \( n \), without specifying \( n \) at infinity. The inconsistency view conflates "no final toggle" with "contradictory final state." Yet "no final toggle" implies indeterminacy, not impossibility: we can consistently add completion rules (e.g., "always ends on"), proving no inherent contradiction. The stronger position is underdetermination because it isolates the flaw (incompleteness) without rejecting supertasks outright.  

  **(2) The Dimming Lamp Variant**  
  The dimming lamp’s brightness at \( t=1 \) *is* determinate: it converges to 1. At each step \( n \), brightness \( b_n = 1 - 2^{-n} \). As \( n \to \infty \), \( b_n \to 1 \), and since brightness is continuous, the limit exists and defines the final state. This differs from the original lamp, where the state jumps discontinuously between discrete values (0 or 1) with no limit. The dimming variant shows that the supertask itself is not the source of indeterminacy: infinite processes can have well-defined limits if the variable evolves continuously. The original lamp’s problem stems from its binary (discrete) variable. Toggling forces divergence: the state oscillates without settling, so no limit exists. Thus, indeterminacy arises not from performing infinitely many actions per se but from applying a discontinuous process to a discrete output. This clarifies that the original lamp’s issue is underdetermination—fixable by redefining the variable (e.g., using brightness)—not inconsistency.  

  **(3) The Parity Lamp Variant**  
  The parity stipulation fails to resolve indeterminacy and reveals incoherence. It claims the lamp is on iff toggles are "even" at completion. But "total number of toggles" in a supertask is infinite, and infinity is neither even nor odd (as parity depends on finitude). The stipulation appears meaningful but is ill-defined: it tries to assign a property (even/odd) that has no extension to infinite cardinals. This is incoherent—not merely underdetermined—because it uses a concept (parity of infinite sets) that lacks mathematical or logical definition. Underdetermination, by contrast, involves gaps we *can* fill coherently (e.g., "lamp ends on"). Here, the rule itself is meaningless, exposing a deeper flaw. This shows the difference: underdetermination is solvable by adding consistent rules (e.g., "final state = state after step 1"), while incoherence requires abandoning or redefining the rule. For parity, we might salvage determinacy by reinterpreting "even" (e.g., via limits in modular arithmetic), but as stated, it is circular and undefined.  

  **Making the Original Determinate**  
  To fix the original lamp, add a completion rule that "breaks" the toggle sequence. For example: "At \( t=1 \), the lamp’s state equals its state after the first toggle." This overrides the oscillation, setting a definite state (off). Such rules work because they specify an outcome without contradiction. Alternatively, use a convergent sequence: e.g., a lamp dimming from 0 to 1 brightness. This confirms underdetermination: the inconsistency reading fails because supplementation is possible.  

  ---  
  ### Marking Scheme (25 marks total)  
  *Top answers must make these specific moves. Deduct marks for omissions/errors.*  

  **(1) Commitment and Distinction (9 marks)**  
  - **Explicitly commits to underdetermination or inconsistency** (2 marks).  
  - **Distinguishes underdetermination (incomplete rules) from inconsistency (contradiction)** (3 marks).  
  - **Argues why chosen position is stronger** (e.g., underdetermination allows supplementation; inconsistency misdiagnoses gap as contradiction) (3 marks).  
  - **States final state is undefined (for underdetermination) or impossible (for inconsistency)** (1 mark).  
    *Common pitfall: Conflates "no defined state" with "contradictory state" (loses 3 marks).*  

  **(2) Dimming Lamp (8 marks)**  
  - **States brightness is determinate (limit = 1)** (2 marks).  
  - **Correctly justifies via convergence/limit theory** (2 marks).  
  - **Identifies that supertasks are not inherently indeterminate** (1 mark).  
  - **Attributes original indeterminacy to discrete (binary) variable, not supertask structure** (3 marks).  
    *Common pitfall: Claims dimming lamp is "indeterminate like the original" (loses 4 marks).*  

  **(3) Parity Lamp (8 marks)**  
  - **States stipulation fails to resolve indeterminacy** (1 mark).  
  - **Explains why: infinity has no parity (even/odd undefined)** (3 marks).  
  - **Identifies incoherence (ill-defined rule) vs. underdetermination (fixable gap)** (3 marks).  
  - **Notes stipulation is circular/meaningless, not merely incomplete** (1 mark).  
    *Common pitfall: Assumes "infinite even" is valid (loses 4 marks).*  

  **Overall coherence, clarity, and concision**: Adjust within the 25 marks (e.g., award 1–2 bonus marks for exceptional rigor, deduct 1–2 for disorganization).
