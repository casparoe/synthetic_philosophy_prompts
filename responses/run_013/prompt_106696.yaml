prompt: |-
  I'm putting together the final for an upper-level metaphysics module I run called "Puzzles of the Infinite" -- mostly Zeno, supertasks, and the arithmetic of the infinite. The students are strong, but they've all read the same two or three popular write-ups of Thomson's lamp, so I keep getting the same canned answer ("there's no last switch, so it's neither on nor off, so the setup is impossible") and I want a question that actually makes them work for it. Please write me one essay question (90 minutes, 25 marks, so a full-mark model answer should be roughly 700-800 words) on Thomson's lamp that forces them to (i) seperate the claim that the outcome is underdetermined by the description from the claim that the description is outright inconsistent, and commit to which one it is, and (ii) say what you'd have to add to the description to make the final state determinate, and why. I don't want them just reciting "Benacerraf says it's underdetermined" versus "the lamp shows a real contradiction" -- I want the question to make them take a side.

  To stop them coasting I'm seeding two variants that I want baked into the question as sub-parts, and I want the marking scheme to distinguish students who see why the two are different. First, a "dimming lamp" where at the n-th step the brightness is set to 1 − 2^−n, so the brightness creeps up toward 1 as the steps pile up and has an obvious limit -- I want them to say whether that variant is determinate and what it shows about whether the indeterminacy in the original comes from the supertask itself or just from choosing an on/off variable. Second, a "parity lamp" where we stipulate that the lamp is on at the final instant iff the number of toggles is even -- here I want them to notice that the stipulation looks like it settles the matter but may be secretly ill-defined, and to say what that reveals about the difference between underdetermination and incoherence. Keep the question free of any particular paper or author's name; just describe the positions ("the underdetermination reading," "the inconsistency reading," and so on) so a student who hasn't read the exact article can still answer. And no citations anywhere, please -- the module's closed-book and I don't want them hunting for references.

  Give me: the exam question as it should be printed, with the marks for each sub-part shown; a model answer that would earn full marks; and a marking scheme that names the specific moves a top answer has to make (with what each is worth out of 25), plus a one-line note for each sub-part on the mistake that typically costs marks. No preamble and no restating what I asked -- start straight with the question as it'll appear on the paper, then the model answer, then the marking scheme.
