  Below is a comprehensive spec for your decision-support tool, addressing the philosophical challenges (transitivity, spectrum arguments, cycles, incommensurability) and providing a step-by-step procedure. The spec includes checks, failure handling, detection methods, and clear hand-offs, followed by analysis of your three cases.

  ---

  ### **Spec: Pairwise Comparison Validation for Ranked Lists**
  #### **Core Principle**  
  The tool assumes "better than" is transitive *unless* inconsistencies (cycles, spectrum patterns, or incommensurability) are detected. When inconsistencies occur, a total ranked list is impossible. The procedure validates if a complete, acyclic, and transitive weak order exists.

  #### **Ordered Checks & Failure Handling**
  Run these checks in sequence before generating a ranked list. **Inputs**: Complete pairwise comparisons for all option pairs (user must answer for every pair). Each pair must have one of:
  - `A > B` (A beats B)
  - `B > A` (B beats A)
  - `A ~ B` (tie: equally good)
  - `A ? B` (incomparable: no relation holds).

  | Step | Check                 | Pass Condition                                  | Fail Condition                             | Failure Handling (Defensible Options)                                                                                                                                                                                                                                | Philosophy Justification                                                                 |
  |------|-----------------------|------------------------------------------------|--------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------|
  | 1    | **Cycle Check**       | No directed cycles in `>` relations.           | Any cycle (e.g., `A > B > C > A`).         | **Refuse to rank** and flag the cycle. UI shows: *"Cycle detected: [A > B > C > A]. Revise comparisons."*<br>**Do NOT** break cycles arbitrarily—users must resolve irrationality.                                                                                  | Cycles violate acyclicity (foundational for rational choice). Arbitrary resolution is indefensible. |
  | 2    | **Incomparability Check** | No `?` relations.                         | Any `A ? B` pair.                          | **Refuse to rank** and list incomparable pairs. UI shows: *"Incomparable pairs: [A, B]. Remove or revise."*<br>**Do NOT** force into a list—incommensurability means no rank can capture truth.                                                                    | Incommensurable options resist ordering by definition. Forcing ranks misrepresents reality. |
  | 3    | **Transitivity Check** | No contradictions in the weak order (`A ≥ B` = `A > B` or `A ~ B`). | Any violation:<br>- `A ≥ B`, `B ≥ C`, but `C > A`<br>- `A ~ B`, `B ~ C`, but `A > C`<br>- Spectrum-induced reversal (e.g., chain `A₁ > A₂ > ... > Aₙ` with `A₁ ~ Aₙ` or `Aₙ > A₁`). | **Refuse to rank** and flag the triple. UI shows: *"Transitivity violation: [A ≥ B ≥ C, but C > A]. Revise."*<br>**Do NOT** ignore—spectrum arguments expose value conflicts. | Transitivity is required for consistent utilities. Violations indicate value misalignment or measurement errors. |

  #### **How to Detect Spectrum Arguments**
  - **Method**:  
    - **During Transitivity Check (Step 3)**: Look for long chains (`A₁ > A₂ > ... > Aₙ`) where endpoints (`A₁` and `Aₙ`) have a weak relation (`A₁ ~ Aₙ` or `Aₙ > A₁`) contradicting the chain.  
    - **Why it works**: Spectrum reversals manifest as:  
      - **Explicit contradiction**: `A₁ > ... > Aₙ` + `A₁ ~ Aₙ` (fails Step 3).  
      - **Cycle**: `A₁ > ... > Aₙ` + `Aₙ > A₁` (fails Step 1).  
    - **Blind spot**: If the user *does not compare endpoints*, the chain ranks cleanly (no detection). Mitigate by enforcing complete comparisons.

  #### **Hand-off to Humans: Wording & Value Calls**
  When checks fail, the tool **cannot** resolve inconsistencies algorithmically. Hand-off must:  
  - **Avoid sounding like a bug**:  
    > *"The tool detected an inconsistency in your comparisons that prevents a ranked list. This often happens when values conflict (e.g., job salary vs. meaning) or small changes accumulate (e.g., animal welfare trade-offs). Please review the flagged pairs below—you may need to adjust trade-offs or accept incomparability."*  
  - **Bottom-out cases**:  
    - **Cycles/Spectrums**: User must reconcile value conflicts.  
    - **Incommensurability**: User must remove options or accept partial orders.  
    - **Value call**: "What matters more?" (e.g., salary vs. meaning).

  #### **What the Tool Cannot Do**  
  Document these limitations:  
  1. **Cannot force a total order** from cycles, incommensurability, or spectrum contradictions.  
  2. **Cannot detect spectrum reversals** if the user doesn’t compare endpoints.  
  3. **Cannot infer missing pairs**—requires complete input.  
  4. **Cannot resolve value conflicts**—only surfaces inconsistencies.  
  5. **Cannot support cyclic preferences** (e.g., money-pump scenarios).

  ---

  ### **Case Analyses**
  #### **Case 1: Job Offers (Salary vs. Commute vs. Meaning)**  
  - **Options**: JobA (high salary, long commute), JobB (medium salary, medium commute), JobC (low salary, short commute, high meaning).  
  - **User comparisons**:  
    - `JobA > JobB` (salary dominates)  
    - `JobB > JobC` (commute dominates)  
    - `JobC > JobA` (meaning dominates) → **Cycle!**  
  - **Procedure**:  
    - **Step 1**: Cycle detected (`JobA > JobB > JobC > JobA`).  
    - **Result**: **Fail**. UI shows: *"Cycle detected: JobA > JobB > JobC > JobA. Revise comparisons."*  
    - **Outcome**: No ranked list. User must break the cycle (e.g., decide: salary > meaning?).

  ---

  #### **Case 2: Animal Welfare Interventions (Spectrum)**  
  - **Options**: Interventions `I₁` to `I₁₀₀`, where each `Iₙ` affects slightly more animals than `Iₙ₊₁` but with marginally worse conditions.  
  - **User comparisons**:  
    - `I₁ > I₂ > I₃ > ... > I₁₀₀` (each step is better)  
    - `I₁ ~ I₁₀₀` (user feels endpoints are "equally good" despite the chain).  
  - **Procedure**:  
    - **Step 1**: No cycles.  
    - **Step 2**: No incomparable pairs.  
    - **Step 3**:  
      - Chain implies `I₁ > I₁₀₀` by transitivity.  
      - Contradiction with `I₁ ~ I₁₀₀` → **Transitivity violation!**  
    - **Result**: **Fail**. UI shows: *"Transitivity violation: I₁ > I₂ > ... > I₁₀₀ implies I₁ > I₁₀₀, but you marked them as tied."*  
    - **Outcome**: No ranked list. This is a **spectrum argument**—user must decide if the chain reflects a true improvement or if endpoints are misvalued.

  ---

  #### **Case 3: User Inputs a Cycle**  
  - **Options**: `A`, `B`, `C`.  
  - **User comparisons**: `A > B`, `B > C`, `C > A` (entered inconsistently).  
  - **Procedure**:  
    - **Step 1**: Cycle detected (`A > B > C > A`).  
    - **Result**: **Fail**. UI shows: *"Cycle detected: A > B > C > A. Revise comparisons."*  
    - **Outcome**: No ranked list. User must resolve the cycle (e.g., retry comparisons or remove an option).

  ---

  ### **Key Takeaways for Your Team**  
  - **Require complete comparisons** to detect spectrum endpoints/cycles.  
  - **Never auto-resolve failures**—users must confront value conflicts.  
  - **UI/UX implication**: Build a "review" mode for failed checks, highlighting problematic pairs.  
  - **Docs should state**: *"The tool guarantees a ranked list only for consistent, acyclic, and comparable inputs. Real-world trade-offs may require revisions."*  
  - **Case 2 fails**—this is intentional. Shipping a list here would **misrepresent spectrum decisions**.  

  This spec ensures philosophically defensible outputs while pragmatically limiting scope to what pairwise comparisons can support.
