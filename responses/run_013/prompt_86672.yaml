  The user's questions are razor-sharp: Does this require Sartre's radical freedom? Can compatibilism work? Where exactly does the practice commit to certain philosophical positions? They want the implicit theory reconstructed and stress-tested, not just literature references. 

  I need to approach this systematically. First, I'll need to articulate the unstated theory of freedom that bridges the disease and responsibility components. Then examine how self-deception functions in their "bad faith inventory" practice. The tricky part will be distinguishing what's philosophically essential versus merely compatible. 

  The internal tension seems most acute around relapse framing - is it a "symptom" (disease model) or a "choice" (responsibility model)? And the discharge policy might be philosophically unstable if both models are held simultaneously. 

  For rival theories, compatibilism could potentially accommodate both strands by distinguishing different levels of explanation. Divided-self views might work if the program sees the "choosing self" as distinct from the "diseased brain." But a strict determinist model would collapse the responsibility component, while pure Sartreanism would reject the disease language entirely. 

  The user's depth of inquiry suggests they're preparing to potentially overhaul their program's theoretical foundations. My analysis should give them concrete guidance on what would need to change under different philosophical commitments - from intake forms to discharge criteria. 

  This requires careful philosophical surgery. I'll need to be precise about where their practice actually commits to certain positions versus where there's flexibility. The discharge policy for non-engagement might be the litmus test - that's where the rubber meets the road philosophically.
answer: |-
  ## Philosophical Reconstruction of Your Treatment Protocol

  **Summary Verdict (120 words):**  
  Your practice presupposes a *compatibilist-leaning hybrid* view, prioritizing phenomenological responsibility over metaphysical freedom, and is *operationally coherent* but *philosophically strained*. It treats addiction simultaneously as a deterministic neurobiological process constraining choice *and* as a domain where individuals retain ultimate responsibility for actions via self-awareness and commitment. The core coherence lies in its pragmatic focus: the "disease" framework justifies treatment, reduces stigma, and explains vulnerability, while the "responsibility" framework empowers agency and drives behavioral change. However, tension exists in reconciling the deterministic language of "symptoms" and neurobiology with the absolute demands of the "choice journal" and discharge criteria, particularly regarding relapse.

  **The Implicit Theory of Freedom (450 words):**  
  Your protocol implies a view of agency operating on two distinct but linked levels:

  1.  **Constrained Capacity (Disease Level):** At the neurobiological level, agency is significantly constrained. Cravings are "events," relapse is often a "symptom," and vulnerability is heightened by triggers, stress, and biology (facticity). This acknowledges deterministic forces shaping desire, impulse strength, and behavioral tendencies. Freedom here is understood as *limited capacity* – the disease makes certain choices vastly harder, riskier, and less voluntary in the moment.
  2.  **Authorial Responsibility (Phenomenological Level):** Despite these constraints, the practice insists the resident is the ultimate *author* of their actions in a crucial sense. The "choice journal" demands active voice ("I chose"), rejecting passive victimhood ("the craving took over"). This presupposes a core "choosing self" that, however influenced, *enacts* the decision to use. This self is:
      *   **Responsible:** Capable of owning actions and their consequences, even when difficult.
      *   **Reflective:** Able to observe impulses, thoughts, and self-deceptions (via journal/inventory).
      *   **Committed:** Expected to align actions with stated goals (sobriety), implying a capacity for future-directed commitment that can override immediate impulses.
      *   **Non-Divided:** The practice treats the resident as a *single agent* accountable for internal conflicts ("denial is a project *you* are running"). While acknowledging internal struggle (cravings vs. commitment), it doesn't absolve the whole person by splitting into "diseased part" vs. "healthy part."

  **Freedom**, therefore, is not radical Sartrean creation ex nihilo, but the *cultivated capacity* to recognize constraints, dismantle self-deceptions, make reflective commitments, and enact choices aligned with one's recovery goals *despite* the disease. It's the freedom found in lucidity and commitment within a constrained field.

  **The Implicit Theory of Self-Deception (350 words):**  
  The "bad faith inventory" presupposes that self-deception ("bad faith") is:

  1.  **An Active Strategy:** Not merely a passive symptom of disease or unconscious defense mechanism, but an *instrumental project* the individual undertakes ("a project the resident is running"). It serves a purpose – usually to circumvent the anxiety of acknowledging the conflict between one's stated commitment (sobriety) and one's actual desire/intention (to use).
  2.  **Knowable & Accountable:** The resident possesses sufficient (though perhaps obscured) self-awareness to recognize these deceptive narratives *in retrospect* and articulate them. Staff refusal to accept "inability" implies that the self-deceiver retains some level of awareness of the truth they are evading; the deception is semi-conscious or strategically maintained.
  3.  **Narratively Structured:** Self-deception manifests as specific, falsifiable *stories* the resident tells themselves ("only going to the corner store," "can stop after one"). These narratives mask true intentions and facilitate relapse.
  4.  **A Barrier to Agency:** Bad faith is the primary mechanism by which the resident *disowns* their agency in the moment of choice. By adopting the passive voice internally ("the craving made me"), they evade responsibility. The inventory/journal aim to dismantle these narratives, forcing confrontation with one's active role. This presupposes that lucidity (seeing through bad faith) is a necessary precursor to exercising the constrained freedom described above.

  **Strict Presuppositions vs. Mere Fits (350 words):**

  *   **Strict Presuppositions (Cannot Do Without):**
      *   **Authorial Agency:** The absolute requirement that residents narrate relapse as "*I chose*" necessitates that the individual, as a unified agent, is the *author* of the action, however constrained. This rejects pure passivity or complete external determination *at the level of enacting the behavior*.
      *   **Knowable Self-Deception:** The bad faith inventory requires that self-deceptive narratives are accessible to reflection (at least retrospectively) and that the resident has the capacity to identify and articulate them. This rejects views where self-deception is entirely unconscious, inaccessible, or purely a symptom beyond the individual's reflective grasp.
      *   **Dischargeable Responsibility:** The policy of discharge for "failure to engage" (interpreted as refusal to adopt the authorial/accountable stance) presupposes that taking this stance is a *necessary condition* for treatment progress and is ultimately within the resident's *volitional control*, regardless of disease severity.

  *   **Mere Fits (Compatible, Not Required):**
      *   **Sartrean Radical Freedom:** While the emphasis on choice, bad faith, and rejection of excuses *fits* Sartre, the disease model's strong constraints on capacity and the focus on cultivating lucidity/commitment *within* constraints contradict the idea of pure transcendence always surpassing facticity. Your practice acknowledges powerful facticity.
      *   **Simple Divided-Self Views:** While acknowledging internal conflict, the practice treats the *whole person* as accountable. It fits *some* divided-self views (e.g., Frankfurtian identification) but not those that absolve the "core self" of responsibility for actions driven by the "addicted self."
      *   **Pure Disease Determinism:** The responsibility strand clearly contradicts this.

  **Rival Theories That Would Also License the Practice (350 words):**

  1.  **Compatibilism:** A sophisticated compatibilism (e.g., Frankfurt, Fischer & Ravizza) is the strongest alternative. It can accommodate the disease constraints (causal determinants) *and* the responsibility strand by defining freedom as the ability to act according to one's *reflectively endorsed* values and commitments (sobriety), even amidst powerful contrary desires. The choice journal cultivates this reflective capacity. Contingency management shapes desires/reinforces endorsed values. Bad faith inventory addresses failures of reflection/endorsement. Discharge for non-engagement targets the unwillingness to participate in the reflective/endorsing process crucial for compatibilist freedom. This view *best* fits the hybrid nature of your protocol.
  2.  **Hierarchical or Endorsement-Based Divided-Self Views (e.g., Harry Frankfurt, Gary Watson):** These views distinguish between first-order desires (cravings) and second-order volitions (the desire *not* to desire cravings, the commitment to sobriety). Addiction involves a conflict where first-order desires override second-order commitments. Your protocol fits well: it aims to strengthen the resident's second-order commitment (responsibility strand) and manage first-order desires (disease strand, CM). The "choosing self" aligns with the higher-order volitional self. Bad faith involves misrepresenting one's true higher-order commitments. Discharge occurs when the resident refuses to identify with/endorse the commitment to recovery.
  3.  **The Disease Model Itself (with Nuance):** A purely biological disease model struggles. However, a *biopsychosocial* disease model that incorporates learning, cognition, and volition can *partially* accommodate the responsibility strand. "Responsibility" here means engaging in treatment (a behavior), learning skills, adhering to medication – actions seen as possible despite the disease. The choice journal could be framed as cognitive restructuring, not metaphysical authorship. Bad faith is a maladaptive cognitive distortion. Discharge is for non-compliance with treatment, framed medically. This *downplays* the strong authorial agency presupposed but offers a functional equivalent focused on behavioral engagement.

  **Internal Tensions (350 words):**  
  The core tension lies in the **simultaneous framing of relapse**:

  1.  **As "Symptom" (Disease Strand):** This framing implies determinism – relapse is the predictable outcome of exposure/stress/sleep loss/neurobiology. It encourages staff empathy, reduces shame, justifies MAT/CM, and views relapse through a medical lens. It suggests limited control in the moment.
  2.  **As "Choice" (Responsibility Strand):** The choice journal demands relapse be narrated as an active, authored decision ("I chose"). This implies significant control/agency in the moment, rejects determinism at the behavioral level, and aims to instill personal responsibility. Discharge for non-engagement reinforces this as a volitional act.

  *   **Conflict:** Calling relapse a "symptom" undermines the absolute demand to see it purely as a "choice." If it's truly a symptom of disease, how can refusal to call it a "choice" (a potential symptom of denial/impairment itself) be grounds for discharge? The disease model suggests the *inability* to take responsibility might *be* part of the illness, contradicting the discharge policy's assumption that taking responsibility is always volitionally possible.
  *   **Language Dissonance:** Staff oscillate between deterministic language ("trigger," "craving as event," "relapse risk factors") and language of absolute authorship ("own your choice," "stop running your project of denial"). This risks confusing residents and staff about the actual nature of agency.
  *   **"Bad Faith" Scope:** The disease strand might suggest that *some* denial or inability to articulate self-deception *is* a genuine symptom of neurological impairment, yet the protocol treats *all* appeals to inability as unacceptable "bad faith," potentially pathologizing genuine cognitive limitations.

  **What Would Change Under a Replacement View (350 words):**

  *   **Under Thoroughgoing Psychiatric Determinism:**
      *   **Intake Forms:** Focus solely on symptoms, risk factors, history. Remove questions implying future choice/commitment.
      *   **Group Sessions:** Shift from "owning choices" to understanding triggers, managing symptoms, compliance. Eliminate choice journals/bad faith inventories. Relapse is discussed solely as a treatment setback/symptom flare-up.
      *   **Discharge Criteria:** Only discharge for medical instability, danger, or *inability to benefit* from the structured environment (framed deterministically), never for "failure to engage" or lack of responsibility. Non-participation is a symptom.
      *   **Language:** Eliminate "choice," "responsibility," "bad faith," "denial as project." Use "symptom," "compulsion," "behavioral dysregulation," "treatment non-adherence."
      *   **MAT/CM:** Emphasized even more as primary tools. Vouchers reward compliance with treatment, not "clean choices."

  *   **Under Explicit Sartrean Radical Freedom:**
      *   **Intake Forms:** Focus on current projects, self-definitions, fundamental choices. Downplay medical history as mere "facticity."
      *   **Group Sessions:** Relentlessly focus on the present moment of choice. Choice journal becomes central, *always* in active voice, dissecting every evasion. Bad faith inventory focuses on *current* evasions of freedom. Disease language ("chronic brain disease") is minimized or reframed as a self-serving "excuse" in bad faith. Triggers/stress are "situations" to be freely transcended.
      *   **Discharge Criteria:** Discharge for "bad faith" – persistent refusal to acknowledge radical freedom and responsibility *in the present moment*. "Failure to engage" means refusal to confront one's absolute authorship.
      *   **Language:** Eliminate "symptom," "disease," "craving as event." Embrace "choice," "project," "facticity," "transcendence," "bad faith," "authenticity." Relapse is *always* "your choice right now."
      *   **MAT/CM:** Potentially viewed suspiciously as inauthentic props or "bad faith" crutches that evade confronting pure freedom. Emphasis shifts entirely to conscious choice in each moment.

  **Bottom Line (120 words):**  
  Your protocol is a pragmatically coherent, clinically effective hybrid, but its philosophical foundations are an unstable blend. It *strictly requires* a core belief in authorial agency and knowable, accountable self-deception to justify its responsibility rituals and discharge policy. While compatible with sophisticated compatibilism or hierarchical self-views, it strains against the deterministic implications of its own disease language, especially concerning relapse. To achieve full philosophical consistency, you would need to either: 1) Soften the absolute demands of the responsibility strand (particularly discharge for non-engagement), adopting a more nuanced compatibilist/biopsychosocial disease language, or 2) Radically minimize the disease framework and embrace a near-Sartrean emphasis on constant choice, accepting the clinical risks of that approach. The current tension is manageable operationally but philosophically unresolved.
