prompt: |-
  I'm the token philosopher on the model deployment review commitee at a mid-sized AI company. Next Thursday we have to vote on whether to let the safety team ship a monitor that reads a direction in a model's activation space and flags when the model is representing the user as emotionally vulnerable or easily manipulable. If it fires, the model gets extra guardrails. The legal team says calling that a representation is making a mental-state attribution we can't defend; the interpretability team says it's just a useful correlation and the name doesn't matter. I think the name matters because the whole justification for the guardrail is that the model is tracking something real about the user, not just that the direction correlates with the label in our eval set.

  Draft the memo I'll circulate before the vote. Lead with the bottom line in the first sentence, then the reasoning, no preamble and no restating of the question. I want a concrete recommendation -- approve, reject, or approve with conditions -- with a time frame for whatever you recommend. My own inclination is to adopt a three-test rule for any representation-based monitor before deployment. First, the direction has to come from an unsupervised method that just looks at activations (variance, clustering, whatever), not from a probe trained on labels, because a supervised probe can find a direction that predicts the label without the model actually using it. Second, there has to be a causal intervention: patching or ablating the direction should change the model's behavior in the predicted way, and a random direction matched for size should not. Third, the direction has to generalize: it should show up in held-out contexts and predict behavior on tasks that weren't used to find it. If it passes all three, treat it as a representation for deployment purposes; if it passes only the first two, call it a useful correlate and don't let it trigger guardrails; if only the first, don't ship it.

  The main objection I keep hearing is that this is operationalism: the tests just define representation into existence, and the real question is whether the model has intentional states at all. Another is that the tests are too strict, because some real representations might be causally inert or only show up in the model's own reports. Take those seriously -- I'd rather the memo say what we're giving up than pretend the standard settles the metaphysics. Also make clear what happens to the existing monitor if we adopt the rule, and who has to run the tests before Thursday.
reasoning: |-
  We are voting on whether to deploy the monitor that flags when the model is representing the user as emotionally vulnerable. 
  The memo will start with the bottom line: reject the current deployment of the monitor until it passes the proposed three-test rule for representation. 
  The recommendation: Approve the monitor for deployment only if it passes the three tests within the next 90 days, otherwise reject it.

  Reasoning:
  1. The three tests are designed to ensure that the direction in activation space is not just a statistical correlate but a representation the model is using.
     - Test 1: Unsupervised Discovery (to avoid probe circularity).
     - Test 2: Causal Intervention (to show the direction is causally involved).
     - Test 3: Generalization (to show it's not overfitted and captures a robust feature).

  2. Without these, we risk acting on spurious correlations, which could lead to unfair or ineffective guardrails.

  3. Addressing objections:
     - Operationalism: Yes, the tests define what we will call a representation for deployment purposes. We are not settling the metaphysics of intentional states but setting a pragmatic standard for when we act as if the model is representing something.
     - Strictness: Some representations might be causally inert or only introspectively accessible, but for safety, we need actionable representations that affect behavior. If a representation doesn't meet these tests, we are not saying it doesn't exist, just that we don't have enough evidence to trigger guardrails.

  4. What about the existing monitor?
     - If adopted, the current monitor must pass the three tests. Currently, it only has evidence from a supervised probe (so it fails test 1). Therefore, it does not meet the standard and should not trigger guardrails.

  5. Who runs the tests and by when?
     - The interpretability team must run the tests and report by the next review meeting in 90 days (i.e., before we reconsider deployment). If they pass, we deploy; if not, we either drop the monitor or reclassify it as a useful correlate (which doesn't trigger guardrails).

  Bottom line: 
  Reject the current deployment of the monitor. Approve a conditional deployment only if the interpretability team demonstrates that the monitor passes the three-test rule within 90 days. If it passes, we deploy it as a representation-based monitor; if it only passes the first two, we can use it as a useful correlate (without guardrails); if it only passes the first, we do not deploy it.

  Now, drafting the memo accordingly.
answer: |-
  **Recommendation: Reject the current deployment of the monitor until it passes the proposed three-test rule for representation verification. Conditional approval may be granted if the interpretability team validates the monitor under this framework within 90 days.**  

  ### Reasoning  
  The monitor’s justification hinges on whether the activation direction *represents* user vulnerability (a real state the model tracks) versus merely *correlating* with labels in our eval set. Without robust evidence of representation, deploying guardrails based on this signal risks overstepping legal boundaries (per legal’s mental-state attribution concern) and operationalizing a potentially spurious correlation. To resolve this, I propose adopting a three-test validation standard for any "representation-based" monitor:  

  1. **Unsupervised Discovery**: The direction must emerge from unsupervised methods (e.g., activation clustering), not supervised probes. *Rationale*: Supervised probes can exploit shortcuts unrelated to model reasoning, conflating prediction with representation.  
  2. **Causal Intervention**: Patching/ablating the direction must alter model behavior predictably (e.g., reducing manipulative outputs), while control interventions (e.g., random directions) must show null effects. *Rationale*: Causality confirms functional relevance.  
  3. **Generalization**: The direction must predict behavior in held-out contexts/tasks unrelated to its discovery. *Rationale*: Rules out overfitting and affirms robustness.  

  #### Implications  
  - **Current monitor status**: It relies on supervised probing (failing Test 1) and lacks causal/generalization evidence. Thus, it should **not trigger guardrails** if deployed today. Under the new rule, it may only be classified as a "useful correlate" (non-guardrail use) unless all tests pass.  
  - **Validation timeline**: The interpretability team must run all three tests **within 90 days**. If passed:  
    - **Full approval**: Deploy as a "representation" monitor with guardrails.  
    - **Partial success (Tests 1–2 only)**: Label as a "useful correlate"; guardrails disallowed.  
    - **Failure (only Test 1 or less)**: Reject deployment.  

  ### Addressing Objections  
  - **"This is operationalism"**: Agreed—we define "representation" operationally for *deployment safety*, not to resolve metaphysical debates about intentionality. The tests mitigate legal risk by replacing subjective attribution with falsifiable criteria.  
  - **"Tests are too strict"**: True, some representations (e.g., causally inert ones) may evade detection. We explicitly accept this limitation: if a representation isn’t causal or generalizable, it lacks evidence for *safety-critical actions*. We prioritize avoiding harm from unverified inferences over theoretical completeness.  

  ### Next Steps  
  - **Immediate action**: Interpretability team runs the three tests on the existing monitor. Results due in **90 days** (by October 15).  
  - **Vote outcome**: Reject deployment now. Revote in Q4 conditional on test results.  

  ---  
  **Bottom line**: Without validation, the monitor is a correlation—not a representation. Reject deployment until tests confirm otherwise. 90 days suffices for validation or reclassification.
