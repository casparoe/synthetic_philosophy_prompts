  We are going to translate Good's result and its caveats into the language of stochastic control.

  Core Vocabulary:
  - State: \( x_t \) (possibly hidden, partially observable)
  - Observation: \( z_t \) (from an observation channel)
  - Estimator: Produces an estimate of the state (e.g., Kalman filter for linear Gaussian systems)
  - Policy/Controller: \( \pi \) mapping from information state to control action \( u_t \)
  - Cost-to-go: \( J(x_t, t) \) or \( J_k(x_k) \) for cost from time t to the end
  - Value function: \( V(x_t, t) \) = min expected cost-to-go from state \( x_t \) at time t
  - Certainty equivalence: In LQG, optimal control is as if the state estimate were the true state.
  - Separation principle: In LQG, the problems of state estimation and control can be separated.

  The Principle of Total Evidence (Good, 1967) in Bayesian decision theory: 
    If you are a Bayesian expected-utility maximizer, and you are offered free information (at no cost and without affecting the state dynamics or cost) before you choose an action, then it is always optimal to take that information. The expected utility after receiving the information (and conditioning on it) is at least as high as without it.

  Translation to Stochastic Control:

  We consider a discrete-time stochastic control problem.

  Setting:
  - Time: t=0 (now), t=1 (action time)
  - At t=0, we are about to choose a control action u at t=1 (so we have time to get information at t=0 and then act at t=1).
  - We have an initial belief (prior) about the state x (which may be evolving, but for simplicity, assume the state is static between t=0 and t=1? Or we can consider a dynamic state and the information is about the initial state).

  But note: in control, the state might evolve. So let's set up:

  - Let the system be at state x_0 at time 0.
  - We can take an observation z at time 0 (free information) which is related to x_0 by an observation channel: p(z|x_0).
  - Then at time 1, we choose a control u (which might affect the state and incur cost). The state evolves to x_1 = f(x_0, u, w) for some noise w, and we incur cost c(x_0, u, x_1) (or more generally, we might have a cost that depends on the whole trajectory).

  However, the classic Good setup is about a static decision: we have to choose u at time 1 (without any state evolution) and then we get cost c(x, u). The state x is fixed but unknown. The information z is about x.

  So to match the philosophy scenario, let's consider:

  - State: x (fixed, unknown) at time 0.
  - We have the option to observe z ~ p(z|x) at time 0 (free: no cost and does not change x).
  - Then at time 1, we choose u from a set U, and incur cost c(x, u).

  We have a prior p(x). Our goal is to minimize expected cost.

  Without information:
    We choose u* that minimizes E_x[ c(x, u) ] (over u).

  With information:
    We first observe z, then choose u(z) that minimizes E_x[ c(x, u) | z ].

  The expected cost without information: min_u E_x[ c(x, u) ]
  The expected cost with information: E_z [ min_u E_{x|z} [ c(x, u) ] ]

  Good's result is that:
    E_z [ min_u E_{x|z} [ c(x, u) ] ] <= min_u E_x[ c(x, u) ]

  This is the non-negativity of the value of information.

  In stochastic control, we often consider a dynamic system with observations at each time. The optimal control policy is found by dynamic programming, and the value function is defined recursively.

  But note: in the static case above, it's a one-step decision. However, the result also extends to multiple steps: if you get an additional free observation at a time when you cannot act, then the expected cost is non-increasing in the information.

  In control, we often assume that we are going to use all the available information. The separation principle (for LQG) tells us that the optimal controller uses the conditional distribution of the state given the history (the information state) and then acts as if that were the true state (in the case of certainty equivalence in LQG). But note: the separation principle holds only for LQG and some special cases.

  Now, the translation:

  Theorem (in control terms):
    Consider a system with a state x (which may be static or dynamic) and a cost function that we wish to minimize. Suppose we are given an additional free observation z (which is conditionally independent of future noise given the current state) at a time when we cannot take a control action. Then the optimal expected cost when having access to z is less than or equal to the optimal expected cost without z.

