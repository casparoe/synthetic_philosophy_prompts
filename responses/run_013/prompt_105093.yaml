  Caveat 4: When the information is about your own future choice.
    In control terms: if the information z is about the future noise or about the future control action that you will take, then conditioning on it might break the standard dynamic programming. For example, if z tells you what control action you will choose in the future, then you are constrained. This is related to the concept of "self-fulfilling prophecies" or "self-knowledge". In standard control, we assume that the controller is free to choose the control action at each time based on the current information. But if we condition on the future action, it might lead to a fixed point that is suboptimal.

    Example: consider a simple one-step problem: two actions u1 and u2. Without information, we choose the one that minimizes expected cost. But if we are told (by a perfect predictor) that we will choose u1, then we are forced to choose u1? Or we can choose differently? This leads to paradoxes.

  Residue Report:

  1. Which pieces land cleanly?
     - The main theorem: "free information is never bad" lands very cleanly. It follows from the fact that the set of policies that ignore the extra information is a subset of the policies that use it. Therefore, the optimal policy with the information must be at least as good.

     - It is also baked into the standard setup of stochastic control: we always condition on all available information. The separation principle (in LQG) tells us that we use the Kalman filter to update the state estimate and then use the control based on that estimate. The value function update in dynamic programming (for POMDP) uses the conditional belief.

     - The caveat about costly information is standard: we have sensor selection problems where we optimize the trade-off between information cost and control performance.

  2. Which pieces require bending the machinery?
     - Caveat 2 (preferences depending on beliefs): In standard stochastic control, the cost is a function of the state and action only, not of the belief. To model this, we would have to extend the state to include the belief (or the knowledge state) and then the cost would depend on that. This is possible but not standard. The value function in POMDPs does depend on the belief, but the cost function at each step is typically defined on the true state. So we would have to redefine the cost to include the belief. This is a bend but not a break.

     - Caveat 3 (non-expected-utility): If we move away from the expected cost minimization to minimax or risk-sensitive criteria, then the value of information might not be non-negative. In control, we do have robust control and minimax control, but the value of information in these settings is not as straightforward. We would have to re-derive the properties. This is a bend.

     - Caveat 4 (information about future actions): This is very problematic for standard control. In our framework, the control actions are chosen by the policy and are not random variables that we condition on in the same way. We do not model correlation between the noise and the future actions (because the noise is exogenous and the actions are chosen deterministically based on the state/observation). But if we have information that is about our own future actions, it breaks the causality. We would have to model the controller as having a fixed policy and then the information being about the output of that policy? This is not standard and requires a reformulation (e.g., as a game against a predictor, or using causal decision theory). This is a significant bend.

  3. Which pieces have no expression?
     - The philosophical debate about what constitutes "free" information: in control, we model the information as coming from a known observation channel. But what if the information is provided by an adversary? Then we are in the realm of robust control or game theory. But that is expressible.

     - The caveat about the agent not being a clean expected-utility maximizer: we do have other criteria (like minimax) but we don't have a general theory for all possible decision criteria. So for arbitrary non-expected-utility, we don't have a standard expression.

     - The idea that "information is never bad" in the standard setup is baked into the framework: we always use the available information, and we derive the optimal policy that uses it. Therefore, the result is a theorem that we prove (as above) but it is also an assumption: we always condition on the data. So the philosophers' argument about whether this is always rational might be about whether the expected-utility framework is the right one. In control, we take the framework for granted.

  Conclusion: 
     In stochastic control, the principle that free information is never harmful (in expectation) is both baked into the framework (because we condition on all available information) and also a theorem that follows from the fact that ignoring information is always an option. The caveats, however, point to situations that either require extending the standard framework (e.g., by including the belief in the cost) or moving to different criteria (like minimax) where the result may not hold. The most challenging caveat is when the information is about the agent's own future actions, which introduces a self-referentiality that standard control does not handle.

  Therefore, the philosophers' debates about the caveats are not trivial: they point to real limitations of the standard stochastic control framework. However, within the standard setup, the result is a theorem and we don't question it.
answer: |-
  ### Translation of Good's Principle of Total Evidence into Stochastic Control Vocabulary

  #### Core Setup
  - **State**: \(x \in \mathcal{X}\) (unknown, static or dynamic; e.g., system parameters or hidden state).  
  - **Observation channel**: \(z \sim p(z|x)\) (sensor model; provides noisy information about \(x\)).  
  - **Cost function**: \(c(x, u)\) (penalty for action \(u \in \mathcal{U}\) in state \(x\); minimized by controller).  
  - **Policy**: \(\pi(\cdot)\) mapping beliefs or observations to actions.  
  - **Belief (prior)**: \(b(x)\) (probability distribution over \(x\); e.g., prior estimate).  
  - **Value function**: \(V(b) = \min_{u} \mathbb{E}_{x \sim b} [c(x, u)]\) (minimal expected cost given belief \(b\)).  

  #### Theorem Restatement
  **Claim**: If a free observation \(z\) (no acquisition cost, no state impact) is offered before choosing \(u\), the optimal expected cost with \(z\) is \(\leq\) the optimal cost without \(z\):  
  \[
  \mathbb{E}_{z} \left[ \min_{u} \mathbb{E}_{x|z} [c(x, u)] \right] \leq \min_{u} \mathbb{E}_{x} [c(x, u)].
  \]  
  **Proof in Control Terms**:  
  - Without \(z\), optimal cost is \(V(b) = \min_{u} \mathbb{E}_{x \sim b}[c(x, u)]\).  
  - With \(z\), we:  
    1. Update belief: \(b_z(x) = p(x|z)\) (Bayesian conditioning).  
    2. Choose \(u^*(z) = \arg\min_{u} \mathbb{E}_{x \sim b_z}[c(x, u)]\).  
    3. Incur expected cost \(V(b_z) = \min_{u} \mathbb{E}_{x \sim b_z}[c(x, u)]\).  
  - Since policies using \(z\) dominate policies ignoring \(z\):  
    \[
    \mathbb{E}_{z}[V(b_z)] = \mathbb{E}_{z} \left[ \min_{u} \mathbb{E}_{x|z} [c(x, u)] \right] \leq \min_{u} \underbrace{\mathbb{E}_{z} \left[ \mathbb{E}_{x|z} [c(x, u)] \right]}_{\mathbb{E}_{x}[c(x, u)]} = V(b).
    \]  
  **Control Interpretation**: Separation principle holds—estimation (belief update) and control (action selection) are separable. Information from \(z\) refines \(b_z\), shrinking estimation error covariance, improving \(u^*(z)\).  

  ---

  ### Caveats Translated
  1. **Costly Information** (Non-free observation):  
     - If acquiring \(z\) incurs cost \(c_{\text{acq}} > 0\), then \(\mathbb{E}_{z}[V(b_z)] + c_{\text{acq}} \not\leq V(b)\) always.  
     - *Control analogy*: Sensor selection problem; optimize information-cost trade-off (e.g., sensor scheduling in LQG).  

  2. **Preference-Dependent Beliefs** (Cost depends on knowledge state):  
     - If cost is \(c(b, x, u)\) (e.g., psychological cost of knowing \(x\)), then conditioning on \(z\) may increase cost:  
       \[
       \mathbb{E}_{z} \left[ \min_{u} \mathbb{E}_{x|z} [c(b_z, x, u)] \right] \not\leq \min_{u} \mathbb{E}_{x} [c(b, x, u)].
       \]  
     - *Control analogy*: Augment state to include belief \(b\), but cost now depends on uncertainty (e.g., variance penalties). Rare in standard control.  

  3. **Non-Expected-Utility Maximizers** (e.g., minimax agents):  
     - For minimax cost: \(\min_u \max_x c(x, u)\), information can hurt:  
       \[
       \min_{u(\cdot)} \max_x \mathbb{E}_{z|x} [c(x, u(z))] \not\leq \min_u \max_x c(x, u).
       \]  
     - *Example*: With \(z\), adversary exploits \(u(z)\)-dependence; without \(z\), robust action \(u\) may dominate.  
     - *Control analogy*: Robust control or \(H_\infty\) methods; information can increase conservatism.  

  4. **Information About Future Actions** (Self-predictive or causal loops):  
     - If \(z\) reveals your future action \(u\) (e.g., "you will choose \(u_1\)"), standard conditioning fails.  
     - *Control analogy*: Policies become functions of future actions, breaking causality. Requires game-theoretic fixes (e.g., modeling predictor as adversary).  

  ---

  ### Residue Report: What Survives, Bends, or Breaks in Control Vocabulary
  | **Aspect**                         | **Translation Status**                                                                 | **Notes**                                                                 |
  |------------------------------------|----------------------------------------------------------------------------------------|---------------------------------------------------------------------------|
  | **Core Theorem**                   | ✅ Lands cleanly                                                                      | Already baked into DP/LQG: Conditioning = belief update → better \(u\).  |
  | **Costly Information**             | ✅ Lands cleanly                                                                      | Standard sensor cost trade-off; no machinery bend.                        |
  | **Belief-Dependent Costs**         | ⚠️ Bends machinery                                                                   | State augmentation \((\mathcal{X} \times \mathcal{B})\); non-standard costs. |
  | **Non-Expected-Utility (minimax)** | ⚠️ Bends machinery                                                                   | Requires robust/risk-sensitive control; info may worsen worst-case.      |
  | **Self-Referential Information**   | ❌ No direct expression                                                               | Control assumes causal independence of actions; self-prediction breaks DP. |
  | **Philosophical Disagreement**     | ❗ Baked into setup, but caveats reveal framework limits                              | Disagreements target when the **setup** applies (e.g., belief costs, non-Bayes agents). |

  #### Key Insights
  - **Substantive Theorem or Baked In?**  
    The theorem is **baked into stochastic control's setup** (conditioning on observations is axiomatic). Dynamic programming/value iteration assume all available information is used.  
  - **Why Philosophers Disagree Matters**  
    - Disagreements highlight **boundaries of the control framework**:  
      - Belief-dependent costs and minimax are expressible but require bending (e.g., augmented states).  
      - Self-referential information has **no natural expression**—control lacks tools for acausal loops.  
    - Philosophers debate whether the Bayesian setup is universally valid; control engineers assume it for tractability.  
  - **Residue**:  
    - **Survives**: Costly information, core value of information (free info → better estimation → better control).  
    - **Bends**: Non-Bayesian criteria (minimax) or belief costs—possible but require framework extensions.  
    - **Breaks**: Information about future actions—**no control vocabulary exists** without violating causality.  

  **Conclusion**: The principle is a theorem in your framework, but philosophers expose its fragility when the Bayesian expected-cost-minimizer model **doesn't apply** (e.g., with psychological costs or adversarial settings). Your machinery silently assumes away these cases, making disagreements non-trivial.
