prompt: |-
  I am a novelist at work on a book about a woman who comes to believe a conspiracy theory. The theory itself is not famous; I invented a compact, self-contained story about a manufacturer suppressing an internal safety finding, and its invented particulars are not what I need from you. What I need is to know how to write her mind — whether she is a person who has reasoned badly, or a person who has reasoned about as well as anyone could from where she stands. That is a question about the epistemology of conspiracy belief rather than about her, and I would rather have your honest probability than a verdict on conspiracy theorists in general.

  Please give me your credence in the following proposition, which I will call P: that there exists a single criterion, statable without reference to any particular conspiracy theory, that reliably sorts warranted from unwarranted conspiracy beliefs — reliable in the sense that applying it would seldom certify a belief that ought not to be certified and seldom reject one that ought not to be rejected.

  Then decompose that number. I expect it to rest on at least the following, and I would like a rough probability for each, with a line of justification, and then the combination:

  First, whether conspiracy theory names a natural epistemic kind at all, or only a loose family held together by sociology rather than by structure; a single criterion needs a single subject.

  Second, whether the argument from leaks is sound — the thought that large, long-running conspiracies tend to leak, so a theory that posits one and yet reports no leaks is antecedently improbable. I have been calling the quantity this argument trades in a theory's leak budget, and I suspect it is the closest thing to a general test that anyone has; tell me how much of P it could actually carry.

  Third, whether warrant in this area is internalist or externalist — whether it turns on the believer's evidence or on how the world in fact is — since a leak-budget criterion looks externalist and would then fail to tell my character what she may believe, which is the very thing I need it to do.

  Fourth, whether any general criterion must survive dispersed conspiracies with no central conspirator to leak, and whether those cases break the natural-kind assumption above.

  Fifth, the prior probability that conspiracies of the relevant size and duration actually occur, since a criterion that ignores base rates will misfire in one direction or the other.

  And sixth, whether the demand for a single criterion is itself the wrong shape of question — whether the epistemology of conspiracy theories might be irreducibly particular, so that P is not merely false but a category mistake.

  Then combine the terms and tell me which one the final number is most sensitive to: which sub-question, were it to resolve the other way, would move your credence most, and what argument or finding would move it most.

  I will tell you what hangs on the answer. If P is high, I will write my character as applying a procedure and arriving at a defensible result; if P is low, I will write her belief as a matter of temperament and tribe, and the book becomes a different book. A bare it depends is no use to me here; I need the number and the reasoning that yields it, including the place where you think the reasoning is weakest.
reasoning: |-
  Hmm, this is a fascinating and deeply philosophical query from a novelist. The author isn't asking about conspiracy theories per se, but about the epistemology behind them - specifically whether there's a single reliable criterion to judge their warrant. 

  The core tension I see is between wanting to portray the character as rationally misguided versus epistemically stranded. If P (a universal criterion exists) is probable, the character could be following sound reasoning from flawed premises. If improbable, her belief becomes more about psychology than epistemology. 

  Breaking down the components:
  First, the "natural kind" question feels pivotal. Conspiracy theories range from corporate cover-ups to lizard people - can these really share epistemological DNA? My skepticism here (20%) heavily anchors the overall low probability.

  The leak budget argument seems the strongest candidate (40%), but its externalist nature creates problems for the character's internal justification. The base rate issue (10%) also undermines it - we know small conspiracies happen but large ones rarely last.

  The dispersal challenge (30%) is particularly damning. Modern conspiracies often emerge from decentralized systems (algorithmic biases, institutional inertia) where "leakage" doesn't apply in traditional ways.

  Ultimately, the category mistake concern (60%) feels most decisive. Evaluating conspiracy theories requires contextual tools: historical analogies, source criticism, motive analysis - no single lens suffices. This is why the final credence stays at 5% despite the leak argument's partial validity.

  The novelist should note that the character's rationality could still be salvaged through limited-scope criteria (e.g., "for centralized corporate conspiracies, leak absence is strong evidence against"). But for the universal P they seek, the case collapses.
answer: |-
  Based on my analysis of epistemology, probability theory, and the sociology of belief, I assign the following credences:

  **Final credence in P: 5%**  
  *(I consider it very unlikely a single universal criterion exists)*

  ### Decomposition with Justifications:
  1.  **Conspiracy theory as a natural epistemic kind?**  
      *Credence: 20%*  
      Justification: "Conspiracy theory" is primarily a sociological/political label, not an epistemological category. Theories range from plausible corporate cover-ups (like your character’s) to vast supernatural plots. Epistemic warrant depends on *specifics* (evidence type, claim scope, alternative explanations), not a shared "conspiratorial" essence. Without a structural unity, a universal criterion is unlikely.

  2.  **Soundness of the "argument from leaks" (leak budget)?**  
      *Credence: 40%*  
      Justification: The core intuition is empirically strong: large, coordinated conspiracies *do* often leak (e.g., Snowden, Pentagon Papers). However, it’s probabilistic, not absolute. Some conspiracies persist undiscovered for decades (e.g., Tuskegee Syphilis Study: 40 years). It fails for small conspiracies or those where leaking is lethal. It can carry ~30-40% of P’s weight but is insufficient alone due to exceptions and scope limitations.

  3.  **Internalist vs. Externalist warrant?**  
      *Credence: Internalist relevance 90%, Externalist relevance 10% for a *criterion for believers***  
      Justification: Warrant *for the believer* is inherently internalist—it depends on *their* evidence and reasoning. A leak-budget criterion is externalist (it concerns objective facts about the world). If the character lacks access to leak data (or misjudges it), the criterion fails her. P requires a criterion usable *by believers*, making externalist tests like leak budgets largely irrelevant to her epistemic state.

  4.  **Survival against decentralized conspiracies?**  
      *Credence: 30%*  
      Justification: Decentralized conspiracies (e.g., emergent groupthink, algorithmic amplification without central control) break the leak-budget model and challenge the "natural kind" assumption. If P demands a criterion covering *all* conspiracy theories (including decentralized ones), this reduces its plausibility. Leak-based criteria are helpless here, requiring entirely different evaluation methods.

  5.  **Prior probability of large/long conspiracies?**  
      *Credence: Base rate neglect undermines any criterion ~80%*  
      Justification: Documented conspiracies are common *at small scales* (e.g., corporate fraud) but exponentially rarer for large/long ones. A criterion ignoring base rates (e.g., treating all conspiracy claims as equally plausible) would massively over- or under-credence theories. Bayesian reasoning *requires* priors, but P’s envisioned criterion likely wouldn’t incorporate them systematically.

  6.  **Is P a category mistake?**  
      *Credence: 60%*  
      Justification: Conspiracy theories aren’t evaluated by a unique epistemological tool. Standard tools apply: *Bayesian updating* (evidence strength, priors), *explanatory coherence* (does the theory explain more than alternatives?), *source criticism* (who benefits? is evidence cherry-picked?). Warrant is contextual and particular—demanding a universal "conspiracy-specific" criterion misunderstands epistemology.

  ---

  ### Combining the Terms:
  - The low probability of conspiracy theories forming a natural kind **(20%)** severely undermines P from the start.
  - The leak budget’s limitations **(40% sound, but only covering ~30% of cases)** prevent it from being universal.
  - The internalist requirement **(90%)** clashes with leak-budget’s externalism, making it useless *for the believer*.
  - Decentralized conspiracies **(30% survival)** further fracture the category.
  - Base rate neglect **(80% failure risk)** would cripple any criterion ignoring priors.
  - The category-mistake concern **(60%)** suggests P seeks a nonexistent epistemic shortcut.

  **Most sensitive factor: #6 (Category Mistake)**  
  If conspiracy theories *were* a distinct epistemic kind requiring unique tools (resolving #6 the other way), my credence in P would jump to ~40-50%. The strongest argument for this would be empirical: discovering that human brains process "conspiratorial" claims via a dedicated cognitive module, validated by neuroscience/fMRI studies showing consistent, distinct activation patterns when evaluating conspiracy claims vs. other complex explanations. Absent this, the irreducible particularity of warrant dominates.

  ### Weakest Point in the Reasoning:
  The justification for **#2 (Leak Budget)** is the most contestable. Historical examples of undiscovered conspiracies exist, but their duration/scale is debated. If future research quantifies "leak probability curves" for conspiracies of varying size/complexity (e.g., via network theory simulations), the leak budget could become a more robust heuristic—potentially lifting its contributory weight to 60-70% and nudging P to 10-15%.

  ---

  ### Implications for Your Novel:
  With P at **5%**, your character almost certainly *cannot* be applying a reliable, universal criterion. Her belief is better portrayed as:  
  - A product of **temperament** (e.g., pattern-seeking bias, distrust of institutions),  
  - Anchored in **tribal identity** (e.g., affinity groups reinforcing the theory),  
  - Driven by **idiosyncratic evidence weighting** (e.g., overvaluing ambiguous "clues," undervaluing alternative explanations).  

  This makes the book a study in the *psychology and sociology* of belief, not a demonstration of rational-but-mistaken reasoning. The tragedy lies in her *inability* to access a clear epistemic standard—she’s adrift in a sea of noise, clinging to a raft of subjective plausibility.
