  For Boorse's view, I should note that hearing loss clearly qualifies as disease under his theory since auditory function falls below species-typical levels. But this appears to ignore the community's cultural claims, reducing their objection to biological ignorance. The key tension is whether statistical abnormality implies biological dysfunction - after all, low vision correction is normalized while deafness remains pathologized.

  The normativist perspective better validates the cultural argument by treating "disease" as socially constructed. However, it struggles with the community's own factual claims about auditory purpose. Their position contains both descriptive ("the ear has functions") and normative ("those functions don't define us") elements.

  The impairment/disadvantage distinction is crucial here. Naturalists focus solely on impairment, while normativists see disadvantage as socially contingent. But interestingly, the Deaf community itself acknowledges impairment while rejecting disadvantage - which actually cuts across both theories.

  The counterfactual about signing environments is revealing: in a perfectly accessible world, naturalists would still call deafness a disease (potentially a reductio), while normativists would not. This suggests both positions have blind spots - naturalism ignores social context, normativism risks relativism.

