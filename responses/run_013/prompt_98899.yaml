prompt: |-
  Act as a philosopher of psychiatry who's read too much Hacking and sat through too many DSM revision fights. I want a spec, not a survey. Imagine a new label gets added to the manual -- call it algorithmic burnout -- and within a few years people start describing themselves in its terms, clinicians start seeing it everywhere, the criteria get revised, and the population of sufferers changes shape. That's a looping effect, and I want to know what a theory of psychiatric classification has to get right if its going to handle that kind of feedback rather than pretend categories are natural kinds waiting to be discovered. Start by brainstorming the phenomena and cases such a theory must accommodate, then write the desiderata: the cases it must get right, the distinctions it cant collapse (like useful vs. real, prevalence rising vs. incidence rising, patient self-interpretation vs. clinician bias), the results from epidemiology or psychometrics it must not contradict, and which requirements are non-negotiable vs. nice-to-have. Flag any pair you think cant be jointly satisfied, and say which single requirement does the most to rule out the standard just-improve-the-criteria view. No citations or reading list; I care about the reasoning. Think carefully and be explicit about your assumptions.
