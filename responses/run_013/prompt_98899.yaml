answer: |-
  Here’s a rigorously constructed spec for a theory of psychiatric classification capable of handling looping effects like "algorithmic burnout," grounded in the realities of clinical practice, epidemiology, and the social dynamics of diagnosis. It prioritizes phenomena over dogma and identifies core tensions.

  **Core Phenomena the Theory Must Accommodate:**
  1.  **Semantic Contagion:** Rapid adoption of a new label (e.g., "algorithmic burnout") by patients *before* clinical consensus or robust evidence, driven by media, online communities, or perceived cultural resonance.
  2.  **Criterion Instability:** Revision of diagnostic criteria (e.g., DSM updates for algorithmic burnout) not merely due to *discovery* of error, but in *response* to shifts in the identified population, clinical pushback, or external pressures (e.g., insurers, patient advocacy).
  3.  **Symptom Migration & Amplification:** Patients consciously or unconsciously shaping their reported experiences and behaviors to align with the new label’s criteria ("Am I scrolling because I’m addicted, or is this burnout?"), and clinicians preferentially noticing symptoms that fit the label.
  4.  **Treatment Feedback Loops:** Availability of treatments (therapy protocols, drugs, workplace accommodations) designed for the label *creating* new presentations or altering the course of the condition (e.g., people learning "burnout management" strategies that inadvertently prolong dysfunction).
  5.  **Identity Formation:** The label becoming a core part of personal identity and social recognition, altering help-seeking, coping mechanisms, and perceived recovery trajectories ("I *am* someone with algorithmic burnout").
  6.  **Epidemiological Flux:** Measured prevalence changes that cannot be cleanly separated into: a) actual change in underlying distress/impairment, b) increased recognition/diagnosis, c) diagnostic boundary shifts, d) label adoption for secondary gain/avoidance (e.g., sick leave).
  7.  **Stigma & Counter-Stigma:** The label attracting stigma (e.g., "lazy millennials"), prompting counter-movements redefining it as valorized resistance ("burnout as rebellion against toxic tech culture"), further shaping who identifies with it.
  8.  **Instrumentalization:** Use of the diagnosis for non-clinical purposes (workplace policy, legal claims, political discourse) exerting pressure on diagnostic boundaries and reporting.

  **Desiderata for the Theory:**
  **(Non-Negotiables - Failure Here Invalidates the Theory)**
  1.  **Anti-Natural-Kind Commitment:** Must explicitly reject the assumption that psychiatric categories map onto discrete, stable, pre-existing biological or psychological "kinds" awaiting discovery. *This is the single requirement that most decisively rules out the "just-improve-the-criteria" view, which assumes refinement asymptotically approaches a natural truth.*
  2.  **Dynamic Ontology:** Must treat diagnostic categories as *interactive kinds* – their definition, the population they pick out, and the experiences of those labeled are co-constituted and evolve over time through feedback loops. Validity is partially *retroactive* and *contextual*.
  3.  **Bidirectional Causality:** Must model influence flowing *from* the classification system *to* individuals/society *and back again* (label -> self-understanding/behavior -> clinical observation -> criteria revision -> label...).
  4.  **Epidemiological Parsimony:** Must coherently explain *how* and *why* measured incidence/prevalence changes, without defaulting to simplistic "more disease" or "better detection" narratives. Must accommodate the possibility that apparent "epidemics" are primarily artifacts of looping.
  5.  **Distinguish Utility from Correspondence Truth:** Must provide criteria for judging a diagnosis's *clinical/practical utility* (e.g., predicts treatment response, organizes care) that are separate from claims about its *correspondence to a mind-independent reality* (which it largely denies exists for these categories).
  6.  **Acknowledge Value-Ladenness:** Must incorporate how social values, power dynamics, and cultural contexts inherently shape the definition, application, and consequences of any diagnosis.

  **(Essential Distinctions - Collapsing These Renders Analysis Useless)**
  7.  **Prevalence (P) vs. Incidence (I):** Must distinguish:
      *   **Rising P due to rising I:** Actual new cases increasing.
      *   **Rising P due to increased duration:** People staying "ill" longer (e.g., due to identity effects, chronicity framed by label).
      *   **Rising P due to diagnostic shift:** Changing criteria or recognition capturing more people (including "mild" cases or misdiagnoses).
      *   *(The theory must explain how looping affects each pathway distinctly).*
  8.  **Patient Self-Interpretation vs. Clinician Bias:** Must differentiate:
      *   **Genuine self-discovery:** The label providing a meaningful, accurate framework for pre-existing but unarticulated suffering.
      *   **Suggestive shaping:** The label actively molding the patient's experience and reporting.
      *   **Clinician detection bias:** The label making clinicians notice confirming evidence and overlook disconfirming evidence.
      *   **Clinician conceptual bias:** The label constraining how clinicians *conceive* of the problem, limiting differential diagnosis.
  9.  **Distress/Impairment vs. Diagnosis:** Must maintain that subjective distress and functional impairment are *real phenomena* requiring response, even while the *diagnostic label* applied is understood as a contingent, interactive construct. Suffering isn't "fake" because the category is unstable.
  10. **Stabilizing vs. Destabilizing Loops:** Must distinguish loops that:
      *   **Stabilize** a category (e.g., consistent treatment response reinforces diagnostic boundaries).
      *   **Destabilize** a category (e.g., criteria revisions expand population, altering core features).
      *   *(A theory must handle both dynamics).*

  **(Constraints from Existing Knowledge - Cannot Contradict)**
  11. **Psychometric Constraints:** Cannot violate core principles of reliable measurement. While categories are interactive, assessment tools must still demonstrate internal consistency, test-retest reliability (acknowledging stability might be lower for highly interactive/new categories), and some form of validity (e.g., predictive, concurrent – understood as context-bound utility, not eternal truth).
  12. **Epidemiological Constraints:** Must be compatible with population-level data on risk factors, comorbidities, course, and outcomes – even while acknowledging these patterns themselves may shift due to looping. Cannot ignore robust, replicated associations (e.g., between severe childhood adversity and later mental health problems, however categorized).

  **(Nice-to-Haves - Pragmatic but Not Fundamental)**
  13. **Guidance for Revision:** Offer principles for *when* and *how* to revise criteria in light of observed looping effects (beyond just "more research").
  14. **Addressing Instrumentalization:** Provide frameworks for analyzing and mitigating the non-clinical uses/misuses of diagnosis that drive harmful loops.
  15. **Clinical Utility Metrics:** Develop nuanced ways to assess clinical utility that incorporate stability, treatment matching, and patient agency within the interactive model.

  **Flagged Tensions & Likely Incompatibilities:**
  *   **Stability vs. Responsiveness (Tension):** The need for stable categories for research, treatment development, and clinical communication clashes with the need for categories responsive to observed looping effects and societal change. *A theory must navigate this tension but cannot eliminate it.*
  *   **Radical Constructivism vs. Biological Constraints (Potential Incompatibility):** An extremely strong constructivist view (all meaning *only* from looping) risks becoming untethered from any biological or psychological constraints on experience/behavior. A theory *must* acknowledge these constraints (e.g., neurobiology limits possible experiences; severe trauma *does* cause distress) while denying they map neatly onto discrete diagnostic categories. *Finding a path between naive biological reductionism and radical social constructivism is critical and difficult.*
  *   **Utility as Truth Proxy (Danger):** There's immense pressure to treat clinical utility *as if* it were evidence of correspondence truth. The theory must rigorously resist this collapse while still valuing utility. *This distinction is fragile and constantly threatened.*

  **The Core Assumption:** Psychiatric classifications are fundamentally *tools for action* within complex biological-psychological-social systems, not *maps of nature*. Their "goodness" is judged by their practical consequences (alleviating suffering, enabling agency, organizing care) within specific contexts, acknowledging these consequences dynamically reshape the landscape the tools are used on.

  **Why this spec matters:** It forces psychiatry to confront its categories as *processes* embedded in history and power, not static entities. It demands humility about claims of "discovery," vigilance about unintended consequences, and a focus on pragmatic outcomes for suffering individuals within an ever-shifting social reality. It moves beyond the futile debate of "real vs. not real" to the crucial question: "*How does using this label change the game, and is that change helpful or harmful, for whom, and under what conditions?*"
