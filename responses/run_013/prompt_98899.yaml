  The core challenge is designing a framework that accommodates how diagnostic labels reshape the very phenomena they describe. For "algorithmic burnout," I need to consider: how people start using the term to interpret their fatigue, how clinicians then see it everywhere, how criteria evolve, and how the population changes.

  First, I should brainstorm key phenomena this theory must handle:
