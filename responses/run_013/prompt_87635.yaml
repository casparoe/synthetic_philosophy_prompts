  ~80% sure this sorts cleanly. The cases force hard choices, but:  
  - **Least sure about:** The **distributed** leaf (Q6). It’s broad, and some might collapse into frame or interpreter.  
  - **Watch for:** People insisting *all* cases lack meaning (true deflationary)—but the bottle example usually smokes them out.  

