answer: |-
  Here's a one-page decision tree designed to sort positions on where meaning resides, using concrete cases to avoid requiring prior knowledge of -isms. The tree starts from the shared premise that frame, outer, and inner messages can come apart (as in GEB). Each branch uses specific scenarios to probe intuitions, leading to the named leaves.

  ---

  ### **Meaning Locator Decision Tree**  
  *Start here: I accept that frame, outer, and inner messages can meaningfully come apart in principle.*

  1. **Consider a vinyl record with grooves encoding a symphony, never played. Does the symphony’s meaning exist?**  
     - **No → Go to Q2**  
       *(Meaning seems to require something beyond the artifact itself.)*  
     - **Yes → Go to Q3**  
       *(Meaning can exist without being accessed.)*  

  2. **Now consider a lullaby sung to a sleeping baby who doesn’t understand words. Is there meaning here?**  
     - **No → Go to Q4**  
       *(Meaning might require competent decoding.)*  
     - **Yes → Go to Q5**  
       *(Meaning might arise from context or effect.)*  

  3. **Take a sentence in a dead language, undecodable by anyone alive. Does it have meaning?**  
     - **No → Leaf: Meaning is in the interpreter’s response**  
       *Your view: Meaning requires an actual interpreter’s reaction (e.g., the baby’s comfort or a driver stopping). Without it, there’s no meaning—even if structure exists.*  
     - **Yes → Go to Q6**  
       *(Meaning persists independently of interpretation.)*  

  4. **A QR code is never scanned. Does it contain meaning?**  
     - **No → Leaf: Meaning is in the interpreter’s response**  
       *Your view: Meaning is the interpreter’s action (e.g., scanning the QR code). No interpreter, no meaning.*  
     - **Yes → Leaf: Meaning is in the outer structure/algorithm**  
       *Your view: Meaning lives in the pattern itself (e.g., the QR code’s geometry). It’s "there" even if unused.*  

  5. **In the lullaby case, what best explains the meaning?**  
     - **The context (e.g., bedtime ritual) → Leaf: Meaning is in the frame/use/context**  
       *Your view: Meaning comes from the situation (e.g., "this is a lullaby"), not content or structure.*  
     - **The baby’s response (e.g., being soothed) → Leaf: Meaning is in the interpreter’s response**  
       *Your view: Meaning is the effect on the interpreter (e.g., calming the baby).*  
     - **Both, plus the song itself → Leaf: Meaning is distributed across the whole system**  
       *Your view: Meaning is a network of artifacts, practices, and users—no single layer holds it.*  

  6. **Traffic light with a burnt-out red bulb: drivers stop because they know red should be there. What carries "stop"?**  
     - **The system (drivers’ knowledge + light’s position) → Leaf: Meaning is distributed across the whole system**  
       *Your view: Meaning is emergent—artifacts, norms, and interpreters together create it.*  
     - **The intended function (traffic rules) → Leaf: Meaning is in the frame/use/context**  
       *Your view: Meaning is in the purpose or context (e.g., "this is a traffic light").*  
     - **The bulb’s position (outer structure) → Leaf: Meaning is in the outer structure/algorithm**  
       *Your view: Meaning is in the pattern (e.g., top light = stop), even when broken.*  

  7. **A computer program that would print "hello" if run, but never runs. Does it contain meaning?**  
     - **No → Leaf: Meaning is in the interpreter’s response**  
       *Your view: Execution is key—meaning needs an interpreter (e.g., a running computer).*  
     - **Yes → Go to Q8**  
       *(Meaning is in the artifact, but where?)*  

  8. **For the program, is meaning in the code (outer) or the output (inner)?**  
     - **The output ("hello") → Leaf: Meaning is in the inner content**  
       *Your view: Meaning is the core message (e.g., "hello"), not the carrier.*  
     - **The code (algorithm) → Leaf: Meaning is in the outer structure/algorithm**  
       *Your view: Meaning is the set of rules for extraction (e.g., how the program works).*  

  ---

  ### **Empty Spots & Ambiguities**  
  - **Deflationary leaf not reached?** It’s captured if you answer "No fact of the matter" to cases like the **message in a bottle** ("the frame message is a lie"). This view is rare in practice—most people default to one of the leaves.  
  - **Can’t separate:**  
    - **Distributed vs. frame/context** (Q6): Some see frame as part of distribution. The tree prioritizes frame if context alone suffices.  
    - **Interpreter’s response vs. distributed** (Q5): If you emphasize the interpreter *and* context, you’ll land on distributed.  
  - **Empty spot: "Meaning is purely in inner content" without structure.** Incoherent—inner content needs *some* structure to exist (e.g., "hello" requires code or grooves). Hence, no leaf for "inner alone."  

