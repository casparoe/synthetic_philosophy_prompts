prompt: |-
  I am designing the opening unit of a graduate seminar in moral and political philosophy on moral compromise, and I want a specification before we examine any particular account. The target is compromise between value systems: cases in which parties with conflicting moral commitments reach a settlement that each regards as better than the status quo, even though neither has converted to the other’s values and each may continue to regard the settlement as morally imperfect. Consider a hospital ethics committee divided between a bloc that treats a certain intervention as intrinsically degrading and a bloc that treats prohibiting it as a failure of care. They adopt a protocol that permits the intervention only under independent review, directs part of the benefit to those who object, and leaves both blocs free to keep condemning the protocol. Each prefers this to deadlock; neither thinks it is fully justified. What would a theory of moral compromise have to say about this and similar cases?

  Write the desiderata: what any adequate theory of moral compromise must deliver. Include the cases it must get right, the distinctions it must respect, and the constraints it must not violate, with the consideration behind each requirement. At a minimum, the theory should address the possibility of gains from trade when the currency is value realization rather than preference satisfaction; the difference between compromise and capitulation, bargaining, toleration, and modus vivendi; the normative status of a settlement that both sides regard as morally second-best; the phenomenon of moral remainder or regret even when compromise is justified; the limits of tradability for rights, duties to third parties, sacred or identity-constituting commitments, and values whose violation is thought to be categorically wrong; the effects of asymmetric power, coercion, and unjust background conditions; the difference between compromising one’s own values and compromising values one holds in trust for others; the relation between compromise and integrity; the role of mutual respect, recognition, and sincerity; the epistemic dimension of compromising under uncertainty about one’s own values; the relation between compromise, justice, and legitimacy; the conditions under which a compromise may bind dissenters or future generations; and the question whether there is a duty to compromise or whether it is merely permissible or supererogatory.

  Then distinguish genuine desiderata from the prejudices of particular traditions, and say which requirements are non-negotiable and which are negotiable. Flag any subset of requirements you suspect cannot be jointly satisfied, and explain what that impossibility implies for the theory. Finally, identify the single requirement that does the most to exclude the most popular accounts of compromise, and explain why. I do not want a reading list or a scorecard of named views; I want the criteria and the cases that motivate them. A table is acceptable if it helps, but the reasoning behind each entry matters more than the table.
reasoning: |-
  We are constructing desiderata for a theory of moral compromise. The goal is to specify what any adequate theory must deliver, motivated by cases and considerations. We'll list the requirements, then discuss their status (non-negotiable/negotiable) and any tensions.

  ### Desiderata for a Theory of Moral Compromise

  1. **Gains from Trade in Value Realization**:
     - *Requirement*: The theory must explain how compromise can yield mutual gains in the realization of values (not just preference satisfaction) even when no party abandons their core moral commitments.
     - *Motivation*: In the hospital case, both blocs achieve partial realization of their values (e.g., one bloc prevents unregulated use of the intervention, the other ensures access under review). This is not about compromising preferences but about realizing more value than under the status quo.
     - *Case*: The hospital ethics committee compromise.

  2. **Distinguish Compromise from Capitulation, Bargaining, Toleration, and Modus Vivendi**:
     - *Requirement*: The theory must delineate moral compromise from:
       - *Capitulation*: One side gives in entirely.
       - *Bargaining*: Negotiation based on preferences without moral commitment.
       - *Toleration*: Enduring what one disapproves of without joint settlement.
       - *Modus Vivendi*: A pragmatic accommodation that lacks moral endorsement.
     - *Motivation*: In the hospital case, the compromise is a jointly adopted settlement with moral content, not mere coexistence. Each bloc actively participates and endorses the outcome as better than deadlock, but without moral surrender.
     - *Case*: The hospital case is a compromise, not modus vivendi, because it involves a shared institutional protocol.

  3. **Normative Status of Morally Second-Best Settlements**:
     - *Requirement*: The theory must account for the normative standing of a settlement that both sides regard as morally imperfect (second-best) yet acceptable.
     - *Motivation*: In the hospital, both blocs continue to condemn the protocol as falling short of their ideals, yet they accept it as binding. The theory must explain why such a settlement can be legitimate and binding despite being suboptimal from each perspective.
     - *Case*: Hospital protocol.

  4. **Moral Remainder/Regret in Justified Compromise**:
     - *Requirement*: The theory must accommodate the phenomenon of moral remainder (e.g., regret, residue) even when the compromise is justified. It should not require that parties cease to feel the loss of their uncompromised values.
     - *Motivation*: In the hospital, each bloc continues to condemn the protocol, indicating that the compromise does not erase the moral conflict. The theory should not demand moral satisfaction but allow for ongoing moral criticism alongside acceptance.
     - *Case*: Hospital case: both blocs keep condemning the protocol.

  5. **Limits of Tradability**:
     - *Requirement*: The theory must identify which values, commitments, or duties are non-negotiable (e.g., rights, duties to third parties, sacred values, identity-constituting commitments, categorical prohibitions) and thus cannot be the subject of compromise.
     - *Motivation*: Not everything can be compromised. For instance, compromising a patient's right to life for administrative convenience would be impermissible. The theory must provide criteria for when compromise is off the table.
     - *Case*: A hospital compromise that allows some patients to be denied life-saving treatment due to cost would violate this limit.

  6. **Effects of Asymmetric Power, Coercion, and Unjust Background**:
     - *Requirement*: The theory must address how power imbalances, coercion, and unjust background conditions affect the legitimacy of a compromise. It should not treat compromises under duress or severe injustice as morally acceptable.
     - *Motivation*: A compromise reached under threat or in a context of systemic injustice (e.g., a racial minority forced to accept an unfair settlement) may be invalid. The theory must ensure that compromise is voluntary and not exploitative.
     - *Case*: A compromise on healthcare access in a society with structural racism might be tainted by background injustice.

  7. **Compromising One's Own Values vs. Values Held in Trust**:
     - *Requirement*: The theory must distinguish between compromising one's own moral commitments and compromising commitments held in trust for others (e.g., representatives compromising for their constituents, or parents for children). It should be harder to justify compromising others' values without their consent.
     - *Motivation*: In the hospital, committee members might be representing stakeholders (e.g., patients, staff). Compromising on behalf of others requires additional justification.
     - *Case*: A patient representative on the ethics committee compromising on a value that the patient community holds sacred.

  8. **Relation between Compromise and Integrity**:
     - *Requirement*: The theory must explain how compromise is compatible with personal integrity. It should not portray compromise as necessarily involving betrayal of one's values.
     - *Motivation*: In the hospital case, each bloc maintains integrity by continuing to condemn the protocol while accepting it as a practical improvement. The theory should allow for this duality.
     - *Case*: Hospital committee members maintain their moral stance while agreeing to the protocol.

  9. **Role of Mutual Respect, Recognition, and Sincerity**:
     - *Requirement*: The theory must account for the importance of mutual respect and recognition in the process of compromise, and the role of sincerity (e.g., not lying about one's commitments).
     - *Motivation*: A compromise achieved through deception or without respecting the other's moral standing is suspect. The hospital case involves open condemnation and mutual acceptance of the other's stance.
     - *Case*: The hospital blocs recognize each other's moral positions and do not demand insincere retractions.

  10. **Epistemic Dimension: Compromising Under Uncertainty**:
      - *Requirement*: The theory must address the possibility that parties may compromise under uncertainty about their own values or the consequences of the settlement.
      - *Motivation*: Moral agents are not always certain. A committee member might be unsure if the intervention is truly degrading. The theory should allow for revisable compromises based on new moral insights.
      - *Case*: A hospital member who is uncertain about the moral status of the intervention but agrees to the compromise as a temporary measure.

  11. **Relation between Compromise, Justice, and Legitimacy**:
      - *Requirement*: The theory must clarify how a moral compromise relates to justice (e.g., can an unjust compromise be legitimate?) and what makes a compromise legitimate (e.g., procedural fairness, substantive minima).
      - *Motivation*: The hospital protocol must meet some threshold of justice to be acceptable, even if imperfect. The theory should not equate compromise with justice but must set boundaries.
      - *Case*: A compromise that saves lives but violates a right might be legitimate but not fully just.

  12. **Binding Dissenters and Future Generations**:
      - *Requirement*: The theory must specify under what conditions a compromise can bind those who did not consent (dissenters) or future generations, and what obligations it creates for renegotiation.
      - *Motivation*: The hospital protocol binds all staff, including those who object. Similarly, a climate compromise might bind future generations. The theory must address authority and intergenerational ethics.
      - *Case*: The hospital protocol is binding on new staff who join after the compromise.

  13. **Duty to Compromise**:
      - *Requirement*: The theory must address whether there is a moral duty to compromise (and under what conditions), or whether compromise is merely permissible or supererogatory.
      - *Motivation*: In the hospital, the deadlock might harm patients. Is there a duty to seek compromise? The theory should clarify the moral demands.
      - *Case*: A prolonged deadlock in the hospital causing patient harm might trigger a duty to compromise.

  ### Distinguishing Genuine Desiderata from Prejudices

  - **Genuine Desiderata**: These are requirements that any theory must meet to capture the phenomenon of moral compromise as described. They are motivated by the core case and similar real-world examples.
  - **Prejudices of Particular Traditions**:
    - *Utilitarian Prejudice*: That compromise is always about maximizing aggregate welfare might overlook the non-tradable limits and the role of integrity.
    - *Deontological Prejudice*: That compromise always involves violating a duty might fail to account for the permissibility of second-best settlements in non-ideal conditions.
    - *Liberal Prejudice*: That compromise requires mutual respect and recognition might not be shared by theories that focus solely on outcomes.

  ### Non-Negotiable vs. Negotiable Requirements

  - **Non-Negotiable** (core to the concept):
    - Gains from trade in value realization (1): Without this, it's not compromise but something else.
    - Distinction from capitulation, etc. (2): Essential to define the domain.
    - Normative status of second-best settlements (3): Central to the phenomenon.
    - Moral remainder (4): Compromise without regret is not compromise.
    - Limits of tradability (5): Without limits, compromise becomes moral corruption.
    - Integrity (8): Compromise must not require self-betrayal.
    - Binding dissenters/future generations (12): Needed for institutional and intergenerational cases.

  - **Negotiable** (can be handled in different ways by different theories):
    - Role of mutual respect (9): Some theories might emphasize respect more than others.
    - Epistemic dimension (10): Theories can vary in how they handle uncertainty.
    - Relation to justice and legitimacy (11): Theories may define justice differently.
    - Duty to compromise (13): Theories can disagree on whether it's a duty or not.

  ### Tensions and Impossibilities

  - **Tension between (5) Limits of Tradability and (1) Gains from Trade**:
    - If some values are non-tradable, then gains from trade might be limited. A theory must balance these: it must allow trade but within constraints. This is not impossible but requires careful delineation.

  - **Tension between (3) Second-Best Status and (11) Justice**:
    - A settlement that is second-best for both might still be unjust. The theory must explain how a compromise can be legitimate without being fully just. This is a challenge but not impossible: legitimacy might come from procedural fairness or avoidance of worse outcomes.

  - **Tension between (7) Values Held in Trust and (12) Binding Dissenters**:
    - Compromising values held in trust might be harder to justify, yet the settlement might bind dissenters (who are the trust beneficiaries). This might require consent mechanisms or special representation.

  - **Suspected Impossibility**:
    - Perhaps no theory can simultaneously satisfy:
      - (4) Moral remainder (allowing ongoing condemnation) and 
      - (8) Integrity (without self-betrayal), 
      - while also providing a robust account of 
      - (12) Binding dissenters (who might share the condemnation).
    - *Implication*: The theory might need to allow for a dual stance: accepting the compromise as binding while morally condemning it, and providing avenues for continued dissent and renegotiation.

  ### The Most Excluding Requirement

  - **Requirement that Does the Most to Exclude Popular Accounts: (5) Limits of Tradability**.
    - *Why*: Many popular accounts (e.g., bargaining models, some consequentialist views) treat values as fully tradable. But the requirement that some values (rights, sacred commitments) are non-negotiable rules out theories that allow any value to be compromised for overall gains. For example:
      - Utilitarianism might see no problem in trading off a right if it maximizes utility.
      - Pragmatic accounts might overlook categorical constraints.
    - This requirement forces the theory to incorporate deontic elements or threshold constraints, which many accounts lack.

  ### Summary Table (Optional)

  | **Desideratum** | **Requirement** | **Motivation** | **Status** |
  |-----------------|----------------|----------------|------------|
  | 1. Gains from Trade | Explain mutual gains in value realization | Hospital case: partial value realization | Non-negotiable |
  | 2. Distinctions | Delineate from capitulation, bargaining, toleration, modus vivendi | Hospital is a joint settlement, not mere coexistence | Non-negotiable |
  | 3. Second-Best Status | Account for legitimacy of morally imperfect settlements | Both blocs accept but condemn the protocol | Non-negotiable |
  | 4. Moral Remainder | Accommodate regret in justified compromise | Both blocs continue to condemn | Non-negotiable |
  | 5. Limits of Tradability | Identify non-negotiable values (rights, etc.) | Some compromises are impermissible (e.g., trading a right) | Non-negotiable |
  | 6. Asymmetric Power | Address effects of power and injustice | Avoid endorsing coerced compromises | Non-negotiable? (context-dependent) |
  | 7. Values in Trust | Distinguish compromising own vs. others' values | Representatives must be cautious | Negotiable (how to handle) |
  | 8. Integrity | Explain compatibility with integrity | Blocs maintain their moral stance | Non-negotiable |
  | 9. Mutual Respect | Role of respect and sincerity | Process matters for legitimacy | Negotiable (degree) |
  | 10. Epistemic Dimension | Handle uncertainty | Compromise as temporary under uncertainty | Negotiable |
  | 11. Justice & Legitimacy | Relation to justice | Set boundaries for acceptable compromises | Negotiable (conceptions vary) |
  | 12. Binding Dissenters | Conditions for binding non-consenters | Hospital protocol binds new staff | Non-negotiable (for institutions) |
  | 13. Duty to Compromise | Clarify if there is a duty | In deadlock with harm, duty might arise | Negotiable |

  This provides a framework for evaluating theories of moral compromise. The hospital case and similar examples ground each requirement. The theory must navigate the tensions, especially around non-tradable limits and moral remainder, while respecting the non-negotiable core.
answer: |-
  Below is a systematic specification of desiderata for a theory of moral compromise, grounded in the hospital ethics committee case and analogous scenarios (e.g., climate policy between industrial and ecological advocates, peace treaties in divided societies). The desiderata are organized into **core requirements**, **distinctions**, **constraints**, and **relational elements**, each motivated by a paradigmatic case or conceptual necessity. I then distinguish non-negotiable from negotiable requirements, flag tensions, and identify the most excluding requirement. A table summarizes the framework, but the reasoning for each item is elaborated first.

  ---

  ### **I. Desiderata: What an Adequate Theory Must Deliver**  
  *(Motivated by cases and conceptual analysis)*  

  #### **A. Core Phenomena to Explain**  
  1. **Gains from Trade in Value Realization**  
     - **Requirement**: Explain how compromise generates mutual gains by partially realizing conflicting values (e.g., care vs. dignity), not merely satisfying preferences.  
     - **Motivation**: Hospital case—both blocs achieve *some* value (regulated access to intervention; protection against degradation) despite moral disagreement. Without this, compromise collapses into zero-sum bargaining.  
     - **Constraint**: Gains must be non-exploitative and non-coercive.  

  2. **Normative Status of Second-Best Settlements**  
     - **Requirement**: Justify why a settlement both parties deem morally imperfect (e.g., the hospital’s review protocol) can be binding and legitimate.  
     - **Motivation**: Hospital case—neither bloc views the outcome as ideal, yet both prefer it to deadlock. The theory must avoid conflating legitimacy with moral perfection.  
     - **Distinction**: Separate moral *acceptability* (permissible under non-ideal conditions) from moral *optimality*.  

  3. **Moral Remainder/Regret**  
     - **Requirement**: Accommodate persistent moral regret (e.g., both blocs condemning the protocol) without undermining the compromise’s justification.  
     - **Motivation**: Hospital case—parties experience "moral residue" (Williams) because their core values are unfulfilled. A theory denying this misrepresents moral conflict.  
     - **Constraint**: Regret must not imply the compromise was unjustified; it reflects unresolved value tensions.  

  #### **B. Essential Distinctions**  
  4. **Compromise vs. Capitulation, Bargaining, Toleration, and Modus Vivendi**  
     - **Requirement**: Define compromise as distinct from:  
       - *Capitulation* (one side abandons its values).  
       - *Bargaining* (deal-making for preference-satisfaction, e.g., splitting a budget).  
       - *Toleration* (passive endurance without joint settlement).  
       - *Modus vivendi* (pragmatic coexistence without moral engagement, e.g., a ceasefire).  
     - **Motivation**: Hospital case—parties actively shape a shared protocol while retaining moral disapproval. Toleration or modus vivendi would involve no collaborative settlement; capitulation would silence one bloc.  
     - **Case Contrast**: Climate policy where parties trade emission caps (bargaining) vs. agreeing on a flawed but value-honoring transition plan (compromise).  

  5. **Compromising One’s Own Values vs. Values Held in Trust**  
     - **Requirement**: Differentiate self-directed compromise (e.g., personal convictions) from proxy compromise (e.g., representatives acting for vulnerable groups).  
     - **Motivation**: Hospital case—committee members compromising *for* patients (trust) face stricter constraints than if only their own values were at stake.  
     - **Case**: Indigenous land rights negotiators cannot trade sacred sites, even if personally willing.  

  #### **C. Constraints and Limits**  
  6. **Non-Tradability of Certain Values**  
     - **Requirement**: Identify values that resist compromise, such as:  
       - Core rights (e.g., torture prohibitions).  
       - Duties to third parties (e.g., patients’ rights in the hospital case).  
       - Sacred/identity-constituting commitments (e.g., religious prohibitions).  
       - Categorical wrongs (e.g., genocide).  
     - **Motivation**: Hospital case—if the intervention involved irreversible harm to non-consenting parties, compromise would be impermissible. Limits prevent moral corruption.  
     - **Case**: A peace treaty permitting ethnic discrimination violates non-tradability.  

  7. **Immunity to Power Asymmetries and Injustice**  
     - **Requirement**: Ensure compromises are invalid if coerced, exploitative, or reinforcing background injustice (e.g., wealth disparities shaping healthcare access).  
     - **Motivation**: Hospital case—if one bloc held institutional power to impose terms, the outcome would be capitulation, not compromise.  
     - **Constraint**: Compromise must not compound existing oppression (e.g., gender policies in patriarchal societies).  

  #### **D. Relational and Epistemic Elements**  
  8. **Integrity-Preserving Compromise**  
     - **Requirement**: Show how compromise need not violate integrity (e.g., parties can uphold core identities while accepting partial defeat).  
     - **Motivation**: Hospital case—both blocs maintain their convictions ("condemning the protocol") without self-betrayal.  
     - **Distinction**: Integrity loss occurs in capitulation; compromise minimizes it through reciprocity.  

  9. **Mutual Respect and Sincerity**  
     - **Requirement**: Make mutual recognition (acknowledging the other’s values as morally serious) and sincerity (non-deception about intentions) necessary for legitimacy.  
     - **Motivation**: Hospital case—blocs engage as adversaries, not enemies; deception would undermine the settlement’s moral authority.  
     - **Case**: A climate compromise where parties secretly plan to violate terms lacks sincerity.  

  10. **Epistemic Uncertainty**  
      - **Requirement**: Address compromises made under doubt about one’s own values (e.g., Is the intervention *truly* degrading?).  
      - **Motivation**: Real-world agents (e.g., hospital members) may lack perfect moral knowledge.  
      - **Constraint**: Uncertainty must not justify moral indifference; compromises require revisability.  

  #### **E. Systemic and Temporal Dimensions**  
  11. **Relation to Justice and Legitimacy**  
      - **Requirement**: Clarify connections:  
        - *Justice*: Compromises must meet minimal thresholds (e.g., no rights violations).  
        - *Legitimacy*: Derived from fair procedures (e.g., inclusive deliberation), not just outcomes.  
      - **Motivation**: Hospital case—if the protocol exacerbated inequities (e.g., for low-income patients), it might be legitimate but unjust.  
      - **Distinction**: Compromise can be legitimate in non-ideal contexts without being fully just.  

  12. **Binding Dissenters and Future Generations**  
      - **Requirement**: Specify when a compromise binds non-consenting parties (e.g., new hospital staff) or future generations (e.g., long-term environmental pacts).  
      - **Motivation**: Hospital protocol applies to all staff; climate agreements affect future people.  
      - **Constraint**: Bindingness requires ongoing renegotiation mechanisms and avoidance of irreversible harm.  

  13. **Duty to Compromise**  
      - **Requirement**: Determine if compromise is obligatory (e.g., to prevent harm), merely permissible, or supererogatory.  
      - **Motivation**: Hospital deadlock might harm patients, creating a duty; but compromising categorical wrongs is forbidden.  
      - **Case**: A duty arises in democratic stalemates with high stakes (e.g., pandemic policy).  

  ---

  ### **II. Negotiability, Tensions, and Excluding Requirements**  

  #### **Distinguishing Desiderata from Prejudices**  
  - **Genuine Desiderata**: All above requirements stem from the structure of moral conflict (e.g., regret in #3, non-tradability in #6) or agency conditions (e.g., integrity in #8). They are neutral between traditions.  
  - **Prejudices of Traditions**:  
    - *Utilitarianism*: May reduce compromise to preference-trading (#1), ignoring integrity (#8) or non-tradable values (#6).  
    - *Absolutist Deontology*: May reject second-best legitimacy (#2) or moral regret (#3) as incoherent.  
    - *Realist Political Theory*: May conflate compromise with modus vivendi (#4), neglecting mutual respect (#9).  

  #### **Non-Negotiable vs. Negotiable Requirements**  
  - **Non-Negotiable** (failure here invalidates the theory):  
    - Gains from value trade (#1), distinction from capitulation (#4), moral remainder (#3), non-tradability limits (#6), immunity to coercion (#7), integrity preservation (#8).  
    - **Why**: These define the *concept* of moral compromise (e.g., no regret → no moral conflict; no integrity → capitulation).  

  - **Negotiable** (theories may reasonably differ):  
    - Duty to compromise (#13), binding future generations (#12), epistemic uncertainty (#10), role of respect (#9).  
    - **Why**: These depend on broader commitments (e.g., democratic theory may impose stronger duties; epistemology may shape uncertainty norms).  

  #### **Tensions and Suspected Impossibilities**  
  - **Tension 1**: Non-tradability (#6) vs. Gains from Trade (#1).  
    - **Conflict**: If some values are untradable, compromises may be impossible in high-stakes conflicts (e.g., abortion debates).  
    - **Implication**: The theory must delineate "tradable" vs. "non-tradable" values contextually (e.g., via deliberative thresholds).  

  - **Tension 2**: Binding Dissenters (#12) vs. Integrity (#8).  
    - **Conflict**: Requiring dissenters to comply (e.g., new hospital staff) may challenge their integrity.  
    - **Implication**: Compromises need sunset clauses or renegotiation avenues to avoid permanent integrity violations.  

  - **Suspected Impossibility**: Jointly satisfying **Second-Best Legitimacy (#2)** and **Justice (#11)** in deeply unjust societies.  
    - **Why**: If background conditions are unjust (e.g., systemic racism), even procedurally fair compromises may entrench injustice.  
    - **Implication**: The theory may need to prioritize minimal justice over legitimacy in such cases.  

  #### **Most Excluding Requirement**  
  - **Requirement**: **Non-Tradability of Values (#6)**.  
  - **Why It Excludes Popular Accounts**:  
    - Consequentialist/utilitarian views (e.g., Singer) treat all values as tradable for aggregate gains.  
    - Bargaining models (e.g., Nash) reduce values to utilities, ignoring categorical constraints.  
    - Pragmatic accounts (e.g., Rorty) dismiss "sacred" values as irrational.  
  - **Exclusionary Power**: This requirement demands that compromise respects moral boundaries, excluding theories that prioritize efficiency or preference-aggregation over deontic constraints.  

  ---

  ### **III. Summary Table of Desiderata**  
  | **Requirement**                     | **Desideratum**                                                                 | **Motivating Case/Consideration**                                     | **Status**          |  
  |-------------------------------------|---------------------------------------------------------------------------------|-----------------------------------------------------------------------|---------------------|  
  | **1. Gains from Value Trade**         | Explain mutual gains in value realization (vs. preference satisfaction).        | Hospital: Both blocs realize partial values.                          | Non-negotiable      |  
  | **2. Second-Best Legitimacy**         | Justify settlements both sides deem morally imperfect.                          | Hospital: Protocol accepted despite moral flaws.                      | Non-negotiable      |  
  | **3. Moral Remainder/Regret**         | Accommodate regret without invalidating compromise.                             | Hospital: Blocs keep condemning the protocol.                         | Non-negotiable      |  
  | **4. Distinctions**                   | Differentiate from capitulation, bargaining, toleration, modus vivendi.         | Hospital vs. ceasefire (modus vivendi) or budget split (bargaining). | Non-negotiable      |  
  | **5. Values in Trust**                | Distinguish self-compromise from proxy compromise (for others).                 | Hospital reps compromising patient interests.                         | Non-negotiable      |  
  | **6. Non-Tradability**                | Identify untradable values (rights, sacred commitments).                       | Hospital: Cannot compromise patient consent.                          | Non-negotiable      |  
  | **7. Immunity to Power/Coercion**     | Invalidate coerced compromises or those reinforcing injustice.                  | Hospital: Power imbalance invalidates outcome.                        | Non-negotiable      |  
  | **8. Integrity Preservation**         | Show compatibility with personal integrity.                                     | Hospital: Blocs maintain core convictions.                            | Non-negotiable      |  
  | **9. Mutual Respect/Sincerity**       | Require recognition and non-deception.                                          | Hospital: Blocs engage as moral adversaries.                          | Negotiable          |  
  | **10. Epistemic Uncertainty**         | Address compromise under value uncertainty.                                     | Hospital member unsure if intervention is degrading.                  | Negotiable          |  
  | **11. Justice & Legitimacy**          | Clarify minimal justice thresholds and procedural fairness.                     | Hospital: Protocol must not worsen inequities.                        | Negotiable          |  
  | **12. Binding Dissenters/Futures**    | Specify when non-consenters are bound, with renegotiation options.              | Hospital protocol binds new staff; climate deals bind futures.        | Negotiable          |  
  | **13. Duty to Compromise**            | Determine if compromise is obligatory, permissible, or supererogatory.          | Hospital deadlock harming patients → duty.                            | Negotiable          |  

  ---

  This framework ensures that theories of moral compromise address the hospital case and its analogues without collapsing into mere bargaining or capitulation. The non-negotiable requirements protect against moral corruption, while negotiable ones allow for theoretical pluralism. The centrality of **non-tradability (#6)** challenges dominant consequentialist and pragmatic accounts, demanding a theory that takes incommensurable values seriously.
