answer: |-
  ## Joint Statement: Adversarial Collaboration on Grue and Variants

  **Signed:** Bayes & Entrench (Reading Group Members)

  **(1) Claims We Both Endorse:**

  1.  **Evidence Favors Simplicity/Uniformity:** Given only evidence of green emeralds observed before time T, the evidence *rationally favors* the hypothesis that emeralds are uniformly green over time, rather than the hypothesis that they are grue (green before T, blue after). This holds for all variants (grellow, grue-ripe, uranium-grue).
  2.  **Syntactic Symmetry is Insufficient:** The predicates "green," "grue," "grellow," "grue-ripe," and "uranium-grue" are syntactically and logically symmetric *given the evidence observed before T*. No purely formal, syntactic, or definitional criterion applied solely to the predicates themselves can, without additional constraints, explain why projecting "green" is rational and projecting "grue" is not. This includes the original grue and all variants.
  3.  **No Solution Purely in the Present:** A satisfactory account of projectibility cannot be based solely on the current evidence and the logical form of hypotheses considered at a single moment in time. Something more is needed to break the symmetry.
  4.  **Dead Escape Routes:** We agree the following attempted solutions fail:
      *   **Denying Grue Exists:** Grue, grellow, etc., are legitimate predicates.
      *   **Appeal to Ostension/Simplicity Alone:** The simplicity of "green" as a color term is insufficient without further justification. "Grue-ripe" feels simple in its causal context.
      *   **Linguistic Universals:** There's no evidence "green" is universally fundamental while "grue" is not.
      *   **Pure Deductive Logic:** Logic alone cannot distinguish the hypotheses given the evidence.
      *   **Ignoring Time:** The problem fundamentally involves time and change.
  5.  **Solution Must Deliver Rational Preference:** Any successful account must explain the *rationality* of favoring "green" over "grue" (and analogues), not just the psychological fact that we do so.
  6.  **The Variants Are Core Cases:** The grellow (supernova-indexed), grue-ripe (touch-indexed), and uranium-grue (undetermined event-indexed) variants are central test cases for any proposed solution. They are not peripheral distractions.

  **(2) Core Disagreements (Neutrally Stated):**

  *   **Bayes:** "The rational preference for projecting 'green' over 'grue' (and variants) is fully explained by the prior probability distribution over hypotheses. Priors reflect rational expectations about the world's structure (e.g., temporal uniformity, causal locality), learned inductively or inherent in rational cognition. The 'entrenchment' of predicates like 'green' is an observable *consequence* of successful projection under these priors, not its source. The symmetry is broken by the assignment of lower prior probability to hypotheses requiring complex, arbitrary, or non-local discontinuities (like color change tied to unrelated supernovas or undetermined decays)."
  *   **Entrenchment:** "The rational preference for projecting 'green' over 'grue' (and variants) stems from the established history of successful projection and co-projectibility within a linguistic community. Predicates like 'green' are entrenched; 'grue', 'grellow', and 'uranium-grue' are not. The Bayesian prior is merely a *representation* of this historical entrenchment and the practical constraints it imposes. Assigning a low prior to 'grue' *is* the act of recognizing its lack of entrenchment; it does not provide an independent, non-circular justification for why 'green' is entrenched and 'grue' is not. The Bayesian 'smuggles in' the solution via the prior."

  **(3) Cruxes, Predictions, and the Variants:**

  1.  **Crux: Does Projectibility Require Causal Grounding?**
      *   **Case:** The **Grue-Ripe Variant (ii)**. A fruit is "grue-ripe" if it is green while untouched and turns blue once touched. This predicate incorporates a clear, local causal mechanism (like oxidation causing browning) within its definition.
      *   **Question:** Is "grue-ripe" projectible *merely* because of its causal component, despite having the formal structure of grue? Or does it require historical entrenchment like any other predicate?
      *   **Experiment/Prediction:**
          *   **Bayes Predicts:** A rational agent *could* legitimately project "grue-ripe" *without* prior historical use, based solely on the evidence (untouched fruits are green) and a prior favoring hypotheses with plausible, local causal mechanisms (like oxidation) over arbitrary temporal switches. The causal grounding *directly* justifies a higher prior. Priors can encode causal understanding. *Prediction: Projection of "grue-ripe" is rationally permissible without entrenchment.*
          *   **Entrenchment Predicts:** "Grue-ripe" is *not* projectible without becoming entrenched through historical use, regardless of its causal plausibility. Its causal component might make it *easier to become entrenched*, but until it *is* entrenched, it lacks the status needed for rational projection. The formal similarity to grue dominates. *Prediction: Projection of "grue-ripe" requires entrenchment; causal plausibility alone is insufficient for rational projection.*
      *   **Bearing:** Directly tests if causal understanding can *confer* projectibility independently of history (Bayes) or if history/entrenchment is always the fundamental source (Entrenchment). **This variant breaks the claim that no formal criterion can sort predicates?** Both agree: **No.** While "grue-ripe" feels more projectible than "grellow," this is due to its *semantic content* (causality), not its *syntactic form*. Syntactic symmetry remains. The pressure is on *what* makes predicates projectible – priors based on content like causality, or historical use?

  2.  **Crux: How Do Agents Handle Genuinely Undetermined Futures?**
      *   **Case:** The **Uranium-Grue Variant (iii)**. A sample is "uranium-grue" if it is green and the next decay in lump U occurs before 2100, blue if after. The timing of U's next decay is currently physically undetermined.
      *   **Question:** How should a rational agent update beliefs based on observing green samples *now*? What prior probabilities are assigned to "green always" vs. "uranium-grue"?
      *   **Experiment/Prediction:**
          *   **Bayes Predicts:** A rational prior assigns very low probability to "uranium-grue" because it posits an arbitrary correlation between a macroscopic color property and a specific, unrelated quantum event. Observing green emeralds strongly confirms "green always" over "uranium-grue" due to this prior asymmetry, *even though* the truth of "uranium-grue" is currently unsettled. Priors reflect expectations of independence/local causality. *Prediction: Observing green strongly favors "green always" over "uranium-grue".*
          *   **Entrenchment Predicts:** "Uranium-grue" is unentrenched and bizarre. Observing green samples confirms "green" simply because "uranium-grue" isn't a live hypothesis for projection *at all* within our linguistic practices; it lacks entrenchment. The unsettled future is irrelevant; the predicate itself is illegitimate for projection due to lack of use. *Prediction: Observing green confirms "green" because "uranium-grue" isn't projectible. Its unsettled status doesn't change this.*
      *   **Bearing:** Tests if priors handle fundamental indeterminism rationally (Bayes) or if entrenchment bypasses the issue entirely by excluding the predicate (Entrenchment). Reveals differing views on what makes a hypothesis "live" for confirmation.

  3.  **Crux: Is Entrenchment Explanatory or Descriptive?**
      *   **Case:** Historical analysis of scientific predicate adoption. How did predicates like "mass," "gene," or "electron" become entrenched? Was it prior causal plausibility/utility driving adoption (Bayes), or community agreement establishing use, which *then* allowed projection (Entrenchment)?
      *   **Question:** Does entrenchment *explain* why we project, or does it merely *describe* which predicates we *have* projected? What drives the *initial* adoption of a projectible predicate?
      *   **Experiment/Prediction:**
          *   **Bayes Predicts:** Predicates become entrenched *because* hypotheses formulated with them were assigned high priors (due to perceived causal coherence, simplicity, explanatory power) and were subsequently confirmed. Entrenchment is the historical record of successful projection under rational priors. *Prediction: Newly introduced predicates gain entrenchment iff hypotheses using them have high prior probability (based on content) and are confirmed.*
          *   **Entrenchment Predicts:** Entrenchment arises from community linguistic practice and successful *use* (which includes, but isn't solely determined by, confirmation). Priors *reflect* current entrenchment, not the original cause of it. The *initial* adoption involves complex social, pragmatic, and historical factors beyond just Bayesian priors. *Prediction: Entrenchment patterns correlate with historical use and community agreement, which may incorporate factors not fully captured by Bayesian prior assignments (e.g., utility, metaphor, authority).*
      *   **Bearing:** Tests whether entrenchment is the fundamental source of projectibility or a downstream effect of prior-driven confirmation. Crucial for assessing circularity charges.

  **Verbal Dispute Component:** A significant portion of the three-year debate centered on the term "justification." The Bayesian argued that priors *justify* the preference for green. The Entrenchment theorist argued that priors merely *encode* the preference (based on entrenchment) without providing an independent *justification* for why *that* preference is correct. This is largely verbal: "justification" meant "rational grounding in world-structure expectations" (Bayes) vs. "non-circular reason independent of linguistic history" (Entrenchment). Clarifying the meaning of "justification" resolves this surface conflict but highlights the deeper cruxes above.

  **Handling the Variants:**

  *   **Grellow (Supernova-indexed):**
      *   **Bayes:** Very low prior due to arbitrary, non-local correlation. Evidence strongly favors green.
      *   **Entrenchment:** Not entrenched. Not projectible. Evidence confirms green.
  *   **Grue-Ripe (Touch-indexed):**
      *   **Bayes:** Higher prior than grellow due to plausible local causality. *Could* be projected based on evidence + prior if causal mechanism deemed plausible, even without history.
      *   **Entrenchment:** Not entrenched. Not projectible. Needs historical use first, despite causal element.
  *   **Uranium-Grue (Undetermined):**
      *   **Bayes:** Very low prior (arbitrary non-local quantum correlation). Evidence strongly favors green. Prior handles indeterminism.
      *   **Entrenchment:** Not entrenched. Not projectible. Unsettled future irrelevant; predicate illegitimate for projection.

  **Final Answer:**

  \answer{The source of projectibility (causal priors vs. historical entrenchment)}
