  Hmm, the user is asking me to outline the core requirements for any adequate theory of evaluative language meaning, particularly in light of the Frege-Geach problem and their custom stress-tests. They want me to identify which requirements are non-negotiable, highlight potential conflicts, and evaluate how different expressivist approaches handle the toughest challenges.

  First, I need to recall what the Frege-Geach problem entails. It's about how evaluative statements like "lying is wrong" function in embedded contexts while expressivism claims their primary role is expressing attitudes rather than stating facts. The challenge is explaining how these statements can participate in logical inferences if they're just attitude expressions.

  Looking at the user's stress-tests, they cover important nuances: negation asymmetry examines how different negations work; epistemic embedding tests scope issues; quantification checks if evaluative predicates can be bound; ellipsis in attitude reports probes shared content; questions/interrogatives challenge whether evaluation is present; counterfactual antecedents test suppositional behavior; mixed explanation examines how descriptive and evaluative claims connect; reductio ad absurdum tests temporary suppositions; truth predication threatens expressivism with collapse into descriptivism; and fiction explores context-sensitivity.

  For each test case, I should derive a corresponding requirement. For example, from negation asymmetry we get the requirement for compositional negation; from epistemic embedding we need scopal neutrality; from quantification we require bindable semantic values. All these must be non-negotiable since they're fundamental to how language works.

  I suspect the toughest requirements to satisfy jointly will be Compositionality (how meaning builds from parts) and Non-Descriptivism (avoiding truth-conditional semantics). Also, Attitude-Expression (core expressivist commitment) creates tension with Compositionality and Scopal Neutrality. The Inferential Integration requirement (valid inference preservation) might conflict with Non-Descriptivism too.

  For the closing tasks: the most exclusionary requirement is likely Compositionality because it forces all embeddings to work systematically, which is extremely hard for non-cognitivist views. Regarding expressivist strategies: Bare non-cognitivism fails compositionality and scopal neutrality; Prescriptivism struggles with quantification and mixed explanation; Hybrid views handle compositionality better but risk descriptivist collapse; Quasi-realism aims to satisfy all requirements through sophisticated semantics but faces challenges with attitude-expression purity and fiction cases.

  The bottom line is that Compositionality is the most exclusionary requirement, and while the full set contains tensions (especially between Non-Descriptivism and Compositionality/Inferential Integration), quasi-realism comes closest to satisfying them all, though not without controversy.
answer: |-
  The most exclusionary requirement is Compositionality, and while the full set contains tensions (notably between Non-Descriptivism and Compositionality/Inferential Integration), no subset is provably unsatisfiable—quasi-realism attempts to satisfy all.

  ### Desiderata for an Adequate Account of Evaluative Meaning
  1.  **Compositionality** (Non-negotiable):  
      *Motivation*: All stress-tests (esp. 1-6, 8-10) require that the meaning of complex sentences (e.g., negations, embeddings, quantifications) systematically depends on the meanings of their parts and how they combine.  
      *Conflict Potential*: Tensions with Attitude-Expression and Non-Descriptivism.

  2.  **Inferential Integration** (Non-negotiable):  
      *Motivation*: Frege-Gech core case and stress-test 8 require that evaluative sentences participate in logically valid inferences (e.g., modus ponens) identically to descriptive ones, preserving truth/validity across embeddings.  
      *Conflict Potential*: Challenges Non-Descriptivism if validity requires truth-conditional content.

  3.  **Negation Uniformity** (Non-negotiable):  
      *Motivation*: Stress-test 1 (negation asymmetry) shows that "not wrong" must behave as a contradictory negation (denying commitment), distinct from meta-level denial, and compose predictably.  
      *Conflict Potential*: Tests the limits of Attitude-Expression (can attitudes be uniformly negated?).

  4.  **Scopal Neutrality** (Non-negotiable):  
      *Motivation*: Stress-tests 2 (epistemic modals), 6 (counterfactuals), and 9 (truth) require evaluative content to take narrow/wide scope under operators without altering its core meaning or collapsing into description.  
      *Conflict Potential*: Conflicts with views that fix evaluative force externally (e.g., bare expressivism).

  5.  **Quantificational Bindability** (Non-negotiable):  
      *Motivation*: Stress-test 3 (quantification) demands that "wrong" in "everything wrong" functions as a predicate bound by quantifiers, requiring a semantic value (e.g., property, function) for variables.  
      *Conflict Potential*: Incompatible with views denying evaluatives have propositional content.

  6.  **Anaphoric Uniformity** (Non-negotiable):  
      *Motivation*: Stress-test 4 (attitude reports with ellipsis) requires that "Bo does too" shares the same semantic content as "Ada thinks hoarding is wrong," and Bo’s denial targets that content.  
      *Conflict Potential*: Pressures Attitude-Expression to explain shared content without propositions.

  7.  **Interrogative Neutrality** (Non-negotiable):  
      *Motivation*: Stress-test 5 (questions) requires that "Is hoarding wrong?" does not express evaluation, but "No" denies the embedded evaluative claim, demanding contentful answers.  
      *Conflict Potential*: Challenges views where evaluation is always force-activated.

  8.  **Suppositional Parity** (Non-negotiable):  
      *Motivation*: Stress-tests 6 (counterfactual antecedent) and 8 (reductio) require that "suppose lying is wrong" functions as a contentful supposition for reasoning, not an expressed attitude.  
      *Conflict Potential*: Directly conflicts with Attitude-Expression in unasserted contexts.

  9.  **Explanatory Cohesion** (Non-negotiable):  
      *Motivation*: Stress-test 7 (mixed explanation: "wrong *because* suffering") requires evaluative and descriptive claims to share a "world-guided" dimension, enabling "because" to link them intelligibly.  
      *Conflict Potential*: Strains pure Non-Descriptivism if explanation requires factual linkage.

  10. **Truth-Attributability** (Non-negotiable):  
      *Motivation*: Stress-test 9 ("'Lying is wrong' is true") requires the theory to accommodate truth predications without implying the sentence describes a mind-independent fact or collapsing into descriptivism.  
      *Conflict Potential*: Threatens Non-Descriptivism if truth requires correspondence.

  11. **Contextual Force Independence** (Non-negotiable):  
      *Motivation*: Stress-test 10 (fiction) requires that evaluative claims in fiction or indirect discourse (e.g., "considered marrying beneath her wrong") can report attitudes *without* expressing the speaker’s evaluation.  
      *Conflict Potential*: Contradicts views tying meaning directly to speaker’s current attitude.

  12. **Attitude-Expression** (Negotiable for non-expressivists):  
      *Motivation*: Core expressivist commitment: evaluative claims fundamentally express non-cognitive attitudes (e.g., disapproval).  
      *Conflict Potential*: Primary source of tension with 1-11; may be incompatible with Compositionality/Suppositional Parity.

  13. **Non-Descriptivism** (Negotiable for descriptivists):  
      *Motivation*: Anti-realist metaethical commitment: evaluative sentences do not describe mind-independent facts.  
      *Conflict Potential*: Challenges compatibility with Inferential Integration, Explanatory Cohesion, Truth-Attributability.

  ---

  ### Hardest Requirements & Expressivist Strategies
  -   **Compositionality & Suppositional Parity**:  
      -   *Bare Non-Cognitivism*: Fails. Attitudes don’t compose; suppositions can’t be mere "entertained" attitudes.  
      -   *Prescriptivism*: Fails. Imperatives don’t embed in conditionals/reductios.  
      -   *Hybrid Expressivism*: Manages compositionality via descriptive component, but suppositional content may drift from expressive core.  
      -   *Quasi-Realism*: Best shot: constructs propositional contents from attitudes, enabling compositionality and suppositional content.

  -   **Inferential Integration & Non-Descriptivism**:  
      -   *Bare/Prescriptivist*: Fail. No robust notion of truth/validity for attitudes.  
      -   *Hybrid*: Partial success; inference rules apply to truth-apt descriptive component, but evaluative force may not integrate.  
      -   *Quasi-Realism*: Claims success: projects attitudes into a "moral truth" framework to validate inferences while retaining non-descriptivism.

  -   **Contextual Force Independence**:  
      -   *Bare/Prescriptivist*: Fail. Cannot detach evaluation from current speaker’s attitude.  
      -   *Hybrid/Quasi-Realism*: Succeed by separating content (e.g., property of wrongness) from force, allowing content-reporting in fiction.
