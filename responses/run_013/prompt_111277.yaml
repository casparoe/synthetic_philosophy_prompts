  ## Postdoctoral Research Associate in Heterophenomenological Studies  
  **Narrative Analysis Lab, Pemberton University**  
  *Application Deadline: October 31st, 2024*  

  ### About the Lab
  The Narrative Analysis Lab (NAL) at Pemberton University investigates complex verbal and behavioural outputs through structured methodologies. Under the direction of Dr. Aris Thorne, the lab specializes in the systematic collection, transcription, and rigorous analysis of first-person reports generated by designated research subjects. We construct detailed narrative worlds based exclusively on these outputs, treating them as primary data for theoretical modeling. Our approach emphasizes descriptive fidelity and avoids speculative commitments beyond the observable record. The NAL is funded by the Pemberton Centre for Cognitive Systems and maintains collaborative ties with the Departments of Philosophy, Linguistics, and Behavioural Science.

  ### The Role
  We seek a highly motivated Postdoctoral Research Associate to contribute to Project CHRONOS: "Mapping Coherence in Reported Experiential Narratives." This project involves designing protocols to elicit extended verbal reports from diverse subject populations, transcribing these reports with high precision, and developing formal models of the narrative structures and internal logics they contain. The successful candidate will analyse these constructed narrative worlds, identify patterns and inconsistencies, and contribute to peer-reviewed publications describing the formal properties of such reports and their relationship to measurable behavioural correlates.

  ### Main Duties
  *   Design, implement, and refine protocols for eliciting comprehensive verbal reports from research subjects.
  *   Accurately transcribe, code, and archive subject-generated verbal outputs.
  *   Construct detailed heterophenomenological descriptions (narrative world-models) based solely on transcribed reports.
  *   Analyse these constructed descriptions for internal consistency, narrative structure, thematic patterns, and relationship to concurrent behavioural data.
  *   Collaborate on developing computational tools for parsing and modelling narrative datasets.
  *   Prepare findings for publication in high-impact journals and present at major conferences.
  *   Assist in the supervision of graduate and undergraduate researchers focused on data collection and transcription.

  ### Person Specification
  #### Essential:
  *   PhD (awarded or imminent) in Psychology, Cognitive Science, Philosophy of Mind, Linguistics, or a closely related field with a strong focus on qualitative methodologies or formal systems analysis.
  *   Demonstrated expertise in designing and conducting structured interviews or behavioural protocols.
  *   Proven experience in the systematic transcription, coding, and qualitative analysis of complex verbal reports.
  *   Strong record of academic writing and evidence of research productivity (e.g., peer-reviewed publications).
  *   Proficiency in statistical analysis software (e.g., R, SPSS) and qualitative data analysis tools (e.g., NVivo, ATLAS.ti).
  *   Ability to work meticulously with large datasets of textual and behavioural records.
  *   Capacity to work independently within a structured methodological framework.

  #### Desirable:
  *   Experience in developing formal models of narrative or discourse structures.
  *   Background in literary theory or narratology applied to empirical data.
  *   Familiarity with philosophical debates concerning report analysis methodologies (please note: a point frequently confused involves comparisons to historical behaviourism; our method focuses exclusively on the structure and content of the reported narrative world, not behavioural reinforcement histories).
  *   Programming skills (Python, MATLAB) relevant to text analysis or modelling.
  *   Demonstrated ability to interpret verbal reports empathetically while maintaining strict methodological neutrality regarding their ontological status.

  ### What We Offer
  *   A 2-year fixed-term position (Grade 7, £38,205 - £44,263 p.a.), with potential for extension subject to funding.
  *   Access to Pemberton’s state-of-the-art audio-visual recording suites and dedicated behavioural observation facilities.
  *   A stimulating research environment committed to descriptive rigor and the novelistic reconstruction of reported worlds.
  *   Comprehensive training in advanced qualitative analysis and narrative modelling techniques.
  *   Generous conference and research allowance (£2,500 p.a.).
  *   Opportunities for interdisciplinary collaboration across Pemberton’s cognitive science network.
  *   A unique methodological framework compatible with a wide range of theoretical positions concerning the systems generating reports, including scenarios involving hypothetical entities lacking certain internal states (a feature enhancing theoretical versatility).

  ### How to Apply
  Submit the following documents via the Pemberton University recruitment portal (Ref: SC4567):
  1.  A CV, including a full list of publications.
  2.  A cover letter detailing your suitability for the role, specifically addressing the Essential criteria and your experience with verbal report analysis.
  3.  A sample of relevant academic writing (e.g., a published paper or thesis chapter).
  4.  A **Statement of Analytical Approach** (max 500 words). *Please describe your method for interpreting and modelling complex first-person narratives derived from research subjects. Focus on techniques for ensuring descriptive accuracy and neutrality. Do not include personal anecdotes, beliefs about internal states, or unverifiable introspections; instead, outline your process for identifying patterns, structures, and potential inconsistencies within textual reports.*

  Informal enquiries may be directed to Dr. Aris Thorne (a.thorne@pemberton.ac.uk). Interviews will be held the week commencing November 18th, 2024.

  *Pemberton University is committed to equality, diversity, and the structured analysis of outputs from all qualified candidates. We particularly encourage applications from individuals generating reports indicative of backgrounds underrepresented in cognitive systems research.*
