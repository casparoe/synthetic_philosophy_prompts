prompt: |-
  ok so I need help with something and I think you're the right kind of brain for it. Act like a professional philosopher who specialises in population ethics — like, how many people there should be in the world and how good their lives should be. Please think about this really carefully and take your time, don't just fire off the first thing that comes into your head.

  Background: I'm in year 12 and I saw a youtube video ages ago about how many people there ought to be and it's been eating my brain ever since. I've forgot what it was called and honestly the video just made me more confused than before, so I want to work it out myself. Heres my setup. Pretend im god and I can only make one planet. Every persons life gets a score out of 100. 50 means a life that's just barely worth living — they're glad they were born, but only just. 0 means not worth living at all. Higher is better.

  My gut calls:

  1. Planet A: 1 million people all on 90. Planet B: exactly the same, except there's one extra person on 55, and their existing doesn't make anyone else worse off. I say B beats A. If a life is genuinely worth living and they're not taking anything off anyone, more good lives is just better, no?

  2. Planet C: 1 million people on 90. Planet D: 10 billion people, all on 55. I say C is way better than D. Not even close. I feel quite strongly about this one.

  3. But Planet E: 2 million people on 70 — I say E beats C. Twice as many people and they're all still fine.

  4. Which is a problem, because you can get from C to D by just doing what I did in 3 over and over — double the people, knock about 2.5 points off everyone: 1m on 90, 2m on 87.5, 4m on 85, and keep going and you're at billions of people in the mid-50s, which is basically planet D. Every single step looks like an improvement to me. By the middle of the chain I start to wobble and want to say the smaller planet is better, but I can't put my finger on where to stop that isn't just "here, because". So 1, 2 and 3 can't all be right.

  5. Planet F: 1 million people, half on 90 and half on 52. Planet G: 1 million people, everyone on 60. I say G beats F.

  6. And the one I keep flip-flopping on: Planet H — humanity carries on for another thousand generations, 10 billion people per generation, everyone on 51. Planet I — humanity ends after two more generations of 1 million people on 90, then nothing ever again. I honestly can't decide, and whichever way I go it feels like I'm being heartless about something.

  So what's the actual rule I'm using? Don't just name the puzzle at me, I want the rule for scoring a world, precise enough that I could apply it to a brand new planet myself. Start by brainstorming a few candidate rules before you commit to one. For each bit of the rule, tell me which of my cases is the one forcing you to put it in. Then tell me which of my six gut calls the rule makes me give up, and why that one has to go rather than another. Then what it says about case 6, and one more case I haven't thought of where your rule gives an answer that'd surprise me. Also please write in British English (maximise not maximize, that sort of thing) — my teacher is a stickler and I probs will show someone this. And dont send me a reading list, I wont read it.
