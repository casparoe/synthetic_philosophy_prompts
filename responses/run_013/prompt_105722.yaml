  ### Performance Measure Evaluation Procedure  
  Based on Goodhart's Law and specification gaming risks, this procedure evaluates whether a measure is safe as a target. It addresses your five recurring cases and the "goal displacement" risk. The three-way risk taxonomy (drift, capture, saturation) is **repaired and integrated**:  
  - **Drift** = Measure no longer tracks the goal (world changes).  
  - **Capture** = Agents optimize the measure at the expense of the goal.  
  - **Saturation** = Measure loses discrimination (no room for improvement).  
  - **Added "Goal Displacement"** = Agency culture/processes redefine the goal to match the measure.  

  The procedure is designed for non-experts (understands averages/percentages). **Judgment calls** are marked with *(J)*. Values-based decisions are flagged for board review.  

  ---

  ### Procedure Steps  
  **Ask these questions in order. Stop and reject/hand off if criteria are unmet.**  

  1. **Clarity of Purpose**  
     - *Question:* "What specific goal does this measure directly support? State it in one sentence."  
     - *Sufficient Answer:* Concrete, non-vague goal (e.g., "Reduce child abuse recurrences," not "Improve family well-being").  
     - *Stop & Hand Off:* If the goal is unclear or contested (values debate about priorities).  
     - *(J)*: Distinguishes between a true goal and a proxy.  

  2. **Relevance Check** (Addresses *Case 1: Useless measures*)  
     - *Question:* "If this measure improves, does it directly cause progress toward the goal? Explain why."  
     - *Sufficient Answer:* Evidence-based logic (e.g., "Research shows timely reunification reduces trauma") or verified causal links.  
     - *Flat No:* If no plausible connection exists (e.g., "Visits per family" vs. "Child safety" without evidence visits prevent harm).  
     - *(J)*: Avoids "common sense" assumptions; requires documented causation.  

  3. **Gaming Potential & Intent** (Addresses *Case 2: Desirable gaming*)  
     - *Question:* "List ways someone could improve this measure without helping the goal. For each, is it:  
       a) *Corrupt* (e.g., falsifying data),  
       b) *Legal but harmful* (e.g., prioritizing easy cases), or  
       c) *Desirable* (e.g., actual increased effort)?"  
     - *Sufficient Answer:* At least 3 realistic gaming tactics identified.  
     - *Flat No:* If >50% of tactics are corrupt/harmful *and* easy to execute.  
     - *Stop & Hand Off:* If disagreement on "desirable" vs. "harmful" tactics (values debate).  
     - *(J)*: Critical for separating target-aligned effort (good) from exploitation (bad).  

  4. **Goal Displacement Risk**  
     - *Question:* "Could this measure redefine how we think about the goal? (e.g., hiring/promotions based solely on moving this number)"  
     - *Sufficient Answer:* Scenario describing cultural/organizational shift (e.g., "Caseworkers hired for speed, not empathy").  
     - *Mitigation Required:* If risk is high (e.g., measure is narrow/simplistic).  
     - *(J)*: Unique to your unnamed failure mode; distinct from capture/drift.  

  5. **Data Trustworthiness** (Addresses *Case 4: Provider-reported data*)  
     - *Question:* "Is the data independently verified? If not, what deters manipulation?"  
     - *Sufficient Answer:* At least one of:  
       - Audits (≥5% random checks, severe penalties for fraud).  
       - Corroboration by unrelated data sources (e.g., court records vs. provider reports).  
     - *Flat No:* If providers control all data *and* no safeguards exist.  

  6. **Discrimination & Saturation** (Integrates *saturation* risk)  
     - *Question:* "What % of units (providers/regions) score ≥90% of the target? Is there meaningful variation?"  
     - *Sufficient Answer:* Numeric % (e.g., 30% score >90%).  
     - *Mitigation Required:* If ≥80% score >90% (saturation) or variation <10 points.  
     - *Not a judgment call*: Uses hard thresholds.  

  7. **Drift & Capture Surveillance** (Integrates *drift/capture* risks)  
     - *Question:* "Compared to 2 years ago:  
       a) Has the measure still moved with the goal? (drift check)  
       b) Have we seen unintended harm from focusing on this? (capture check)"  
     - *Sufficient Answer:* Data showing correlation with goal metrics (e.g., visits ↑ but abuse rates unchanged → drift) or harm reports (e.g., rushed reunifications).  
     - *Flat No:* If drift is confirmed *or* severe unmitigated harm exists.  
     - *(J)*: Relies on observed trends; distinguishes drift (world changes) from capture (agent actions).  

  8. **Federally Mandated Override** (Addresses *Case 3: Required measures*)  
     - *Question:* "Is this measure federally required?"  
     - *Output*: If "yes" and previous steps flag risk → **"Keep for reporting ONLY. Do not use for bonuses/contracts."**  
     - *Enforcement:* Remove from internal dashboards; publish only in compliance reports with disclaimer: "Not a performance target." Document rationale to auditors.  

  9. **Mitigation Viability**  
     - *Question:* "For all risks above, are there mitigations? (e.g., counterweights like 'reunification safety' paired with 'speed')"  
     - *Sufficient Answer:* Specific, actionable controls (e.g., "Audits start next quarter" or "Cap bonuses at 20% for this measure").  
     - *Flat No:* If unaddressed corrupt/high-risk tactics remain.  

  **Final Outputs:**  
  - ✅ **Approve**: Passes all steps.  
  - 🚫 **Reject**: Fails any "flat no" criterion.  
  - 📋 **Reporting Only**: Federally mandated but risky.  
  - 🔄 **Hand to Board**: Values conflict or unresolved mitigations.  

  ---

  ### Repaired Risk Taxonomy Assessment  
  - **Right Division?** Yes, but incomplete. Drift (external change), capture (agent gaming), and saturation (statistical limit) cover *mechanisms*, but miss *cultural* risks (goal displacement).  
  - **Conflations?** No—drift, capture, and saturation are distinct.  
  - **Procedure Integration:** Essential. Used in Steps 6 (saturation), 7 (drift/capture), and 4 (goal displacement).  

  ---

  ### Test Runs on Example Measures  
  #### **Measure 1: Monthly Caseworker Visits per Family**  
  - **Step 1 (Clarity):** Goal = "Ensure child safety via caseworker engagement." → *Sufficient*.  
  - **Step 2 (Relevance):** "Visits correlate with safety in studies." → *Sufficient*.  
  - **Step 3 (Gaming):**  
    - Tactic 1: Short, fake visits (corrupt).  
    - Tactic 2: Prioritize low-risk families (harmful).  
    - Tactic 3: Actual engagement (desirable).  
    → >50% corrupt/harmful → **🚫 Flat No** (fails Step 3).  
  - **Output:** Reject.  
  - *Board Objection Expected:* "But visits increased!" → *Counter:* "Without quality checks, this incentivizes fraud/neglect."  

  #### **Measure 2: Share of Children Returned Home Within 12 Months**  
  - **Step 1 (Clarity):** Goal = "Reunify families *safely and stably*." → *Sufficient*.  
  - **Step 2 (Relevance):** "Timely reunification reduces trauma." → *Sufficient*.  
  - **Step 3 (Gaming):**  
    - Tactic 1: Return kids early to hit deadline (harmful).  
    - Tactic 2: Delay removing at-risk kids to avoid "failures" (harmful).  
    - Tactic 3: Genuine faster reunification (desirable).  
    → >50% harmful → *Mitigation required*.  
  - **Step 4 (Displacement):** "Hiring/promotions favor speed over safety." → *High risk*.  
  - **Step 5 (Data):** Provider-reported → *Requires audits* (none exist → **🚫 Flat No**).  
  - **Output:** Reject (fails Step 5).  
  - *Board Objection Expected:* "This is our flagship measure!" → *Counter:* "No audits + harmful gaming = unsafe target."  

  ---

  ### Limitations & Misfires  
  1. **Misfires:**  
     - *False Negatives:* Over-rejects broad measures (e.g., "visits") if no mitigations exist.  
     - *Case 2 (Desirable Gaming):* Struggles if board misclassifies "harmful" as "desirable" (e.g., defends rushed reunifications).  
     - *Case 5 (Board's Favorite):* Step 3 (gaming) is vulnerable to bias if members downplay risks.  

  2. **Cannot Decide:**  
     - Values conflicts (e.g., "Is speed or safety more important?").  
     - Measures with no historical data (Step 7 becomes guesswork).  

  3. **Worst-Handled Case:**  
     - **Case 2 (Desirable Gaming):** Relies on subjective classification in Step 3. If the board rationalizes harmful tactics as "desirable," the procedure fails.  

  ### Final Advice  
  - **For Goal Displacement:** Add a mandatory 3-year review for all measures to reset cultural alignment.  
  - **For Bias:** Rotate external reviewers into the board for "favorite measure" evaluations.  
  - **Procedure Strength:** Forces explicit risk documentation, making rejections auditor-defensible.  

  ---  
  This procedure prioritizes safety over convenience. It will reject popular but gamed measures, but that is its purpose: to ensure targets drive *real* impact, not just numbers.
