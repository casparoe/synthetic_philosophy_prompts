   But note: the procedure must be run with the current state.

   Now, the five cases:

    Case 1: Measure that cannot be gamed and tells nothing we care about.
        - Step 2 (Relevance) will catch it: we reject because there's no link to the goal.

    Case 2: Measure whose gaming is the behavior we wanted.
        - Step 3: we list the ways, and for the intended ways we mark them as intended. If the only ways are intended, then we are okay. But usually there are also corrupt ways. The key is to identify the corrupt ways and mitigate them.

    Case 3: Federally required measure.
        - We run steps 1-9. If it fails, we output "Keep for reporting only".

    Case 4: Provider-reported measure.
        - Step 6: we check data quality. If there are no independent checks, we reject unless we add them.

    Case 5: Board's favorite measure.
        - The procedure is designed to be objective. If it fails any step, we reject.

   Where the procedure might misfire:
     - It requires judgment at several steps, and the board might be biased in their judgment (e.g., for their favorite measure, they might downplay risks).
     - It might be too strict: if we require mitigation for every risk, we might reject many measures. But that is by design: we want safe targets.
     - It might not catch every form of gaming if the board cannot imagine the gaming methods in step 3.

   What it cannot decide:
     - It cannot set the goal (step 1 must be provided).
     - It cannot resolve values disputes: if there is disagreement about what is an intended response versus corruption (step 3) or about the acceptability of goal displacement (step 5), then we hand back to the board.

   Which of the five cases does it handle worst?
     - Case 2: because the distinction between intended and corrupt gaming is subjective and might be contentious. The board might argue that a corrupt method is intended (or vice versa). This is why we mark step 3 as requiring judgment and might hand back to the board.

   Let's formalize the procedure:

   **Performance Measure Evaluation Procedure**

   Step 1: Goal Clarity
     - Ask: "What is the explicit goal this measure is intended to track? Write it in one sentence."
     - If the goal is not clear and agreed, stop and hand to the board for clarification.

   Step 2: Relevance
     - Ask: "Is there strong evidence (research, theory, or prior experience) that moving this measure improves the goal?"
