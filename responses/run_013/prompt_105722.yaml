   Step 3: Gaming Potential
     - Ask: "How could someone increase (or decrease) this measure without improving the goal? List at least two ways."
     - For each way, ask: "Is this an intended response (good) or corruption (bad)?"
     - If no way is listed, note: "We cannot think of any gaming method? This is unusual. The measure might be too vague or we are not thinking hard enough." Then proceed but note the risk.
     - This step does not reject by itself, but if there are corrupt methods that are feasible and likely, we will need mitigation.

   Step 4: Unintended Consequences
     - Ask: "What negative side effects might occur if we make this measure a target? (e.g., neglect of other goals, harmful behaviors)"
     - Record the list.

   Step 5: Goal Displacement
     - Ask: "Could this measure change how we think about the goal? Might the goal become redefined as what the measure captures?"
     - If yes, and the measure is a narrow proxy, this is a risk.

   Step 6: Data Quality and Independence
     - Ask: "Is the data collected independently of the agents whose performance is measured? If not, what checks are in place?"
     - Checks must include at least two of: random audits (at least 5% with penalties), independent verification, or multiple corroborating sources.
     - If the data is not independent and there are fewer than two checks, reject. (Flat no)

   Step 7: Variability and Saturation
     - Ask: "What is the current distribution? (Provide a histogram, or min, max, average.) Is there room for improvement? Does the measure discriminate between good and bad performance?"
     - If the measure is saturated (e.g., 90% of providers above 90%) and there's no room for improvement, then note: the measure may not be useful as a target.

   Step 8: Drift Check
     - Ask: "Do we have evidence that the measure still tracks the goal? (e.g., historical correlation with the goal or a proxy)"
     - If we have evidence of drift (i.e., loss of correlation) and no way to adjust the measure, then reject.

   Step 9: Mitigation
     - Ask: "For each risk identified in steps 3-8, what specific mitigations are in place? (e.g., additional measures, audits, balancing, etc.)"
