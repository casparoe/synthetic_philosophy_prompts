prompt: |-
  I chair the performance-measurement review board of a mid-sized state human-services agency. Twice a year the board approves, renews, or retires the roughly forty measures that govern our contracts with private providers, our federal reporting, and, indirectly, the annual bonuses of regional directors. Each measure gets about ninety minutes of meeting time; I have no analyst of my own; the standing membership is two program directors, a lawyer, a data manager, and a community representative; and whatever we decide has to be defensible in writing to the state auditor. I would like a procedure the board can run on a proposed or an existing measure to decide whether it is safe to use as a target.

  Build it on Goodhart's law and on what is actually known about specification gaming, but do not give me a restatement of the law. I want the questions, in the order we should ask them; what counts as a sufficient answer to each; the point at which the procedure returns a flat no; and the points at which it must stop and hand the decision back to the board because the question is one of values rather than of measurement. Assume the procedure's user understands percentages and averages and nothing more. Mark plainly which steps are judgment calls wearing the costume of measurement, and say which distinctions in the underlying idea have to survive this translation into a committee procedure and which we can drop without losing the point.

  The procedure has to survive five cases, because all five come up every cycle.

  - A measure that cannot be gamed and still tells us nothing we care about. Goodhart's law has nothing to say about this failure, and I need the procedure to.
  - A measure whose gaming is the behaviour we wanted. When we began counting caseworker visits, visits rose, and part of the rise was real. The procedure must distinguish corruption of a measure from the intended response to it.
  - A measure we are required to report federally, which we may not retire whatever the procedure concludes. It needs an output meaning keep it, but do not let it steer anything, and it needs to say how that is enforced when the governor's office reads the same dashboard we do.
  - A measure reported to us by the providers whose money depends on it.
  - The case I expect to dislike: the board's favourite measure, the one everyone in the room is proud of. I want the procedure to be capable of ruling against it.

  Two further matters to settle. First, we have observed a failure mode I have not seen named. The measure keeps tracking what we care about, but over the years the agency reorganizes around it: hiring favours people who move the number, programme goals get rewritten in the measure's vocabulary, and what we care about gradually comes to mean whatever the measure captures. If your taxonomy of risks has no slot for this, say so and say what slot to add. Second, a colleague proposes that we sort every risk into drift, capture, or saturation — drift being the measure ceasing to track the target because the world moved, capture being agents optimizing the measure instead of the target, saturation being the measure ceasing to discriminate once everyone reaches the ceiling. Assess that three-way cut: is it the right division, does it conflate things that should be kept apart, and is your procedure better with it, with a repaired version of it, or without it?

  Then run the finished procedure from beginning to end on two measures — monthly caseworker visits per family, and the share of children returned home within twelve months — showing the questions asked, the answers, the output, and the objection you would expect from the board. Finish by telling me where the procedure will misfire, what it cannot decide, and which of the five cases above it handles worst.
reasoning: |-
  We are building a procedure to evaluate performance measures for safety as targets, based on Goodhart's law and known specification gaming risks. The procedure must be understandable by someone who knows percentages and averages.

   Key considerations:
   1. Goodhart's law: "When a measure becomes a target, it ceases to be a good measure." This happens because people start optimizing for the measure specifically, which may diverge from the intended goal.
   2. We must also handle measures that are not gamed but are useless (case 1) and measures where gaming is the desired response (case 2).
   3. The procedure must output one of:
      - Approve as a target
      - Reject (flat no)
      - Keep for reporting only (for federally required measures, case 3) but not for steering or bonuses
      - Return to the board for a values decision (when the question is about what we care about, not measurement)

   Steps must be in order, with clear criteria for sufficient answers and points of rejection or hand-off.

   Additional risks:
     - The un-named failure mode: "measure colonization" - the agency reorganizes around the measure, and the measure redefines the goal. We'll call this "goal displacement" and treat it as a distinct risk.

   The colleague's three-way cut:
     - Drift: world changes, measure no longer tracks the target.
     - Capture: agents optimize the measure at the expense of the target.
     - Saturation: measure loses discrimination because everyone is at the ceiling.

   Assessment of the three-way cut:
     - It is a useful starting point but conflates causes (drift and saturation are about the measure becoming less informative, capture is about agent behavior) and misses the "goal displacement" risk we identified.
     - We'll incorporate them as:
          - Drift: addressed in our procedure by checking if the measure still correlates with the goal.
          - Capture: addressed by checking for gaming and unintended consequences.
          - Saturation: addressed by checking the distribution and variance.
     - We will also add a check for goal displacement.

   We'll design the procedure to include steps for all these risks.

   Procedure Steps:

   1. **Clarity of the Goal**: 
      - Question: "What is the explicit goal this measure is intended to track? Write it in one sentence."
      - Sufficient answer: A clear, concise statement of the goal. If the goal cannot be stated, the measure fails.
      - If the goal is not clear: return to the board for clarification (values decision?).
      - This step is a judgment call because it requires defining what we care about.

   2. **Relevance** (Addresses case 1: measure tells us nothing we care about):
      - Question: "Is there a strong reason to believe that moving this measure in the desired direction would improve the goal stated in step 1? (Answer must be more than 'it's obvious'.)"
      - Sufficient answer: Evidence from research, theory, or prior experience that links the measure to the goal. If no, then the measure is rejected (flat no) because it is not relevant.
      - This step is a judgment call because it requires assessing the strength of the link.

   3. **Gaming Potential and Intended Response** (Addresses case 2: gaming is desired):
      - Question: "How could someone increase (or decrease) this measure without improving the goal? List all known ways."
      - Follow-up: "For each way, is it a form of corruption (bad) or an intended response (good)?"
      - Sufficient answer: A list of at least one way the measure can be gamed. If no way can be imagined, that is a red flag (because gaming is almost always possible) and the measure may be too vague or we are not thinking hard enough.
      - If there are ways that are corruption and they are feasible and likely, then the measure is at risk. 
      - If the only ways are intended responses, then the measure is safe (but note: this is rare because usually there are both).
      - This step does not immediately reject because we can sometimes mitigate. But if the only ways are corrupt and cannot be mitigated, then reject.
      - This step is a mix of judgment and factual: identifying ways is creative, but categorizing as intended or not is a values call? However, we can try to base it on whether the action would be considered legitimate by the board.

   4. **Unintended Consequences** (Capture risk in the three-way cut):
      - Question: "What are the unintended consequences we have observed or expect when this measure is made a target? (Consider: does it draw effort away from other important goals? Does it encourage harmful behavior?)"
      - Sufficient answer: A list of potential negative side effects. If there are severe negative consequences that cannot be mitigated, the measure may be rejected.
      - This step is a judgment call.

   5. **Goal Displacement Risk** (The un-named failure mode):
      - Question: "If this measure becomes a target, how might it change the way we think about the goal? Could the goal itself become redefined as what the measure captures?"
      - Sufficient answer: A description of the risk. If the risk is high and the measure is a narrow proxy, then the measure may be rejected or require mitigation.
      - This step is a judgment call.

   6. **Data Quality and Independence** (Addresses case 4: reported by providers):
      - Question: "Is the data for this measure collected independently of the agents whose performance is being measured? If not, what checks are in place to ensure accuracy?"
      - Sufficient answer: If the data is self-reported by the provider (and the provider has incentive), then we require at least two of: 
          - Random audits with a high enough frequency (e.g., at least 5% of cases) and severe penalties for misreporting.
          - Independent verification (e.g., by case files or third party).
          - Corroboration by multiple data sources.
      - If the data is not independent and no sufficient checks, then the measure is rejected (because it is too easy to manipulate).

   7. **Variability and Saturation** (Saturation risk in the three-way cut):
      - Question: "What is the current distribution of the measure? (Provide a histogram or at least the range and average.) Is there room for improvement? Is the measure still able to discriminate between good and bad performance?"
      - Sufficient answer: If the measure is clustered at the ceiling (e.g., over 90% of providers are above 90%) and there is no meaningful variation, then it may be saturated. In that case, consider retiring or revising.
      - This step requires data and is less of a judgment call.

   8. **Drift Check** (Drift risk in the three-way cut):
      - Question: "Has the measure been stable in its relationship to the goal? If the goal changes, does the measure still track it? If we have historical data, show the correlation between the measure and the goal (or a proxy) over time."
      - Sufficient answer: If the measure has been used for a while, show that when the goal improved/worsened, the measure moved accordingly. If there is evidence of drift (i.e., the measure no longer correlates with the goal) then the measure should be rejected.
      - This step is partially data-based but also judgment if data is lacking.

   9. **Mitigation**:
      - If the measure has risks (gaming, unintended consequences, goal displacement, data quality, saturation, drift) but they can be mitigated, then we must specify the mitigation.
      - Question: "For each risk identified in steps 3-8, what mitigations are in place? (e.g., additional measures, audits, caps, balancing with other measures, etc.)"
      - Sufficient answer: A specific mitigation plan for each major risk. If a risk has no feasible mitigation, then the measure is rejected.

   10. **Federally Required Measures** (Case 3):
       - If the measure is federally required, then we cannot retire it. But we can decide not to use it as a target (for steering or bonuses). So we output: "Keep for reporting only, do not use for steering or bonuses." 
       - However, to enforce this when the governor's office sees the dashboard, we must:
            - Clearly document that this measure is for reporting only and not used for performance evaluation.
            - Remove it from the dashboard that is used for internal management and bonus decisions, and put it on a separate compliance dashboard.
            - Communicate to the governor's office the reason (via the procedure's output).

   11. **Final Decision**:
       - If at any step the measure gets a flat no (e.g., step 2: not relevant; step 6: data quality insufficient and no mitigation; step 8: drift and no fix; step 9: unmitigated risk), then output "Reject".
       - If the measure passes all steps and is not federally required, then "Approve as a target".
       - If federally required and not approved as a target, then "Keep for reporting only".
       - If at any step the question requires a values decision (e.g., step 1: goal not clear; step 3: what is an intended response vs corruption; step 5: how much goal displacement is acceptable), then we stop and hand back to the board.

   Order of Steps:

    1. Clarity of the Goal -> if not clear, hand to board.
    2. Relevance -> if not, reject.
    3. Gaming Potential -> if only corrupt ways and no mitigation, reject; but note: we might not reject until step 9 if we can mitigate.
    4. Unintended Consequences
    5. Goal Displacement
    6. Data Quality -> if insufficient and no mitigation, reject.
    7. Variability and Saturation
    8. Drift Check -> if drift and no mitigation, reject.
    9. Mitigation -> if unmitigated risks, reject.
    10. If federally required and we would otherwise reject, then output "Keep for reporting only". But note: for federally required, we might still want to run through the steps to see if we can use it as a target? The requirement says we must report, but we can decide not to use it as a target.

   However, note: we must decide for each measure whether to use it as a target. Federally required measures must be kept but might still be used as targets if they pass. So:

     - First, run steps 1-9. If the measure passes, then it can be approved as a target. If it fails, then for federally required measures, we set to "reporting only". For non-federally required, we reject.

   But step 10 is a special case.

   Revised Flow:

    Steps 1-9: Evaluate the measure as a target.

    After step 9:
        If the measure is federally required:
            - If it passed (approved as target), then output "Approve as a target and report".
            - If it failed, then output "Keep for reporting only, do not use as a target".
        If not federally required:
            - If passed, "Approve as a target".
            - If failed, "Reject".

    But note: if during steps 1-9 we hit a point that requires a values decision, we hand back to the board.

   Now, we run two examples.

   Example 1: Monthly caseworker visits per family

    Step 1: Goal - "To ensure that children in the child welfare system receive adequate attention and support from their caseworkers."

    Step 2: Relevance - There is evidence that regular visits help in monitoring the child's safety and well-being. So yes.

    Step 3: Gaming Potential:
        Ways to increase without improving the goal:
          - Short, meaningless visits just to count.
          - Visiting only the easiest cases (low-risk families) to boost numbers.
          - Double-counting (if a visit is split into two short ones).
        Intended response: increasing the number of meaningful visits.
        Some of these are corrupt (short visits, double-counting) and some might be unintended consequences (focusing on low-risk families).

    Step 4: Unintended Consequences:
        - Caseworkers might spend less time on complex cases that require more time per visit.
        - Paperwork might be rushed to allow more visits.

    Step 5: Goal Displacement:
        - We might start thinking that the number of visits is the goal, not the child's well-being. This could lead to neglecting other aspects of care.

    Step 6: Data Quality:
        - The data is reported by the providers (caseworkers or their agencies). They have an incentive to report more visits. Without independent verification, this is risky.
        - We might have audits? If we do random checks of case files, then it might be okay. But if no audits, then reject.

    Step 7: Variability:
        - We need data: if the average visits per family per month is 2, and the range is 0 to 5, then there is room for improvement and variation.

    Step 8: Drift Check:
        - We would look at historical data: if in the past, increasing visits led to improved outcomes (like reduced abuse recurrences), then it's good. But if we see visits going up without outcome improvements, that might indicate drift.

    Step 9: Mitigation:
        - For gaming: we could set a minimum visit duration and require documentation of content. We could also audit visit logs.
        - For unintended consequences: balance with other measures (like outcomes for high-risk cases).
        - For goal displacement: pair with outcome measures (like recurrence of maltreatment).
        - For data quality: implement random audits.

    If we have these mitigations, we might approve. But if we don't, then reject.

    However, note step 6: if there are no audits, then we must reject. Let's assume we have no audits currently. Then step 6 would lead to rejection unless we commit to adding audits. In step 9, if we say "we will implement audits", then we can conditionally approve.

    But the procedure must be strict: if we don't have the mitigations in place now, then we cannot approve until they are. So we might say "reject until audits are implemented".

    Alternatively, we could have a conditional approval: approve if the mitigations are implemented by next cycle. But the procedure must be clear.

    We'll say: if a risk is identified and a mitigation is proposed but not yet implemented, then the measure is rejected until the mitigation is in place. We can then re-evaluate.

    So for this measure: without audits, reject. But if we have audits, then we move on.

   Example 2: Share of children returned home within twelve months.

    Step 1: Goal - "To reunify families when it is safe and in the child's best interest."

    Step 2: Relevance - Yes, because timely reunification is a key goal of child welfare.

    Step 3: Gaming Potential:
        Ways to increase without improving the goal:
          - Returning children home too early, even when it's unsafe.
          - Not removing children who are at risk, so that they don't enter care and then don't count in the denominator? (Actually, the measure is of children who were removed and then returned. So if we remove fewer children, then the denominator shrinks and the share might go up? But note: the measure is the share of children who were removed and then returned within 12 months. So not removing a child doesn't affect the measure because that child isn't in the removed group.)
          - Alternatively: delaying removal beyond the point of safety to avoid having the child in care? But then the child might not be in the system. 
          - Or: closing cases quickly by returning children without adequate preparation.

    Step 4: Unintended Consequences:
        - Children returned to unsafe environments.
        - Pressure to reunify even when inappropriate.

    Step 5: Goal Displacement:
        - We might focus on the speed of reunification at the expense of its safety and stability.

    Step 6: Data Quality:
        - This data is also reported by providers? Actually, the agency itself might track removals and returns. But if providers (foster care agencies) are involved, they might have an incentive to return children quickly to reduce their costs? So we need to check: who reports? 
        - If the agency's own caseworkers report, and their performance is measured on this, then we need checks. If the data comes from court orders or official placements, then it might be objective.

    Step 7: Variability:
        - The share might be 60% on average. There is room for improvement (to 100%? but not if unsafe). We care about appropriate returns.

    Step 8: Drift Check:
        - If the measure has been stable and we see that when we increase the share, we don't see an increase in re-entry (which would indicate unsafe returns), then it's good. But if we see that when the share goes up, re-entry also goes up, then that's drift.

    Step 9: Mitigation:
        - Balance with a measure of re-entry (children returning to care within 12 months of reunification) to catch unsafe returns.
