   Step 11: Final Approval
     - If the measure passed steps 1-9 and is not federally required, output "Approve as a target".

   Note: At any step, if a values decision is needed (e.g., step 1 goal clarity, step 3 intended vs. corrupt, step 5 acceptability of goal displacement), and the board cannot agree on an answer, then stop and hand back to the board.

