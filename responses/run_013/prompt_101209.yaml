answer: |-
  You've grasped the core concession—that a causally memory-linked post-mortem sequence isn't logically incoherent—but you misconstrue my refusal to declare it *me*. The issue isn't stipulation, but the dissolution of the ordinary criteria that give "same person" its sense. Bodily continuity provides the public, re-identifiable anchor; private memory links, however seamless, lack the intersubjective framework that fixes reference. Without that body, the survivor's apparent memories of *my* life could just as coherently be interpreted as the genuine experiences of a new entity fortuitously imprinted with my mental traces. There is no "fact of the matter" here because the conditions for determinately answering "Is it *him*?"—grounded in observable persistence—are absent. Survival isn't ruled out; it simply lacks the scaffolding to be verifiably *my* survival. We confront a conceptual void, not a hidden truth.
