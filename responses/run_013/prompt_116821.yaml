prompt: |-
  so my debate coach keeps saying that information can never hurt you, like if you find something out you're always at least as well off as you were before, and she says theres an actual theorem behind that and it's not just vibes. but i keep coming up with cases where finding something out is obviously bad and i dont think theyre all me being dumb. before i go read what people have actually written about this, i want the full spec first. what would any theory of when information is worth having have to get right? like the requirements list, with the case behind each one.

  stuff it definately has to handle:
  - the plain cases where the theorem is right, and why its right there (you can always just ignore what you learned, right?)
  - info that's worth literally nothing, like finding out something that can't change any choice you'd make anyway
  - info you can't un-know, like you find out something about a friend and now you have to carry it around forever
  - info that changes what you want and not just what you believe (you find out you'd actually love a job you were sure you'd hate)
  - info that's bad because of how you got it (the test results are in the envelope and everybody saw you open it)
  - info that's bad because other people know you have it (haggling over something, the seller can tell you know its real, so now your edge is gone)
  - info about your own future choice that might change the choice (somebody tells you what you're gonna pick and then you pick the other one out of spite)
  - the gap between info being bad on average and info being bad once you've already got it
  - people who aren't textbook rational, like me
  - weirder meta stuff, like info about how much info is worth, and whether it can ever be rational to pay to not find something out

  for each one say why it's a requirement, and mark which ones are non-negotiable and which are just things one side cares about. then the part i actually want: which of these can't all be true at once? like does keeping the theorem force you to give up on the cases where info is clearly bad, or is there some way to have both? and which single requirement knocks out the most theories. at the end, like two sentences on how the plain expected-value-of-information picture does against the list versus one that says info is only good when it changes what you actually end up doing. no citations please, i can't get online anyway.
