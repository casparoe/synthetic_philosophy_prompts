  ### 2. Diagonal Argument

  Cantor's diagonal argument shows that the set of real numbers (or the set of infinite binary sequences) is uncountable. In programming, we can represent an infinite binary sequence as a generator that yields bits forever. 

  An enumeration of infinite binary sequences would be a generator that yields generators (each being an infinite binary sequence). Let's call this `enum`.

  The diagonal argument constructs a sequence `d` such that the n-th bit of `d` is the complement of the n-th bit of the n-th sequence in `enum`. Then `d` is not in the enumeration.

  In programming, we can write:

  ```python
  def diagonal(enum):
      # enum: a generator that yields generators of bits
      # We assume that the n-th sequence is obtained by next(enum) at step n
      # We build d step by step
      n = 0
      d = []
      # We reset enum to start from the beginning? But we can't reset a generator. We must assume we can run the enum again? 
