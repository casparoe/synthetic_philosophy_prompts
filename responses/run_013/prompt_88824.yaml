  Therefore, in programming:

  - The diagonal argument for arbitrary infinite sequences (non-computable) does not have a direct counterpart because we cannot represent non-computable sequences by a program.
  - For computable sequences, the diagonal argument becomes the argument for the halting problem: we cannot have an effective enumeration of all computable sequences (because if we did, we could diagonalize and get a new computable sequence not in the list, which is a contradiction).

  So the claim about size (uncountable) becomes: not effectively enumerable. 

  ### 3. Finitist and Constructivist Objections

  Finitism: only finite objects exist. Constructivism: only objects that can be constructed by an effective procedure are admitted.

  In programming, we are by nature constructive: we write programs that build objects. We also are constrained by finite memory and finite time. However, we can represent infinite objects via finite descriptions (generators). 

  The finitist might object: the generator for the natural numbers is a finite string, but it never completes the task of producing all natural numbers. So we cannot say the set of all natural numbers exists as a completed infinity. 

  The constructivist might be happy with the generator as a construction for any natural number, but they would reject the idea of the entire set as a completed infinity. 

  In programming, we have to be cautious: we can write programs that run forever, but we cannot complete an infinite computation. So the natural numbers are represented as a potential infinity: we can get any natural number we want, but we cannot get them all.

