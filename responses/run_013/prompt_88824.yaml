  However, in programming, we care about what we can compute. The fact that the reals are uncountable in set theory does not directly affect us because we cannot even represent most reals (only computable reals). So the loss is the entire world of non-computable objects. But if we are only concerned with computation, then we have captured the essence: we cannot effectively enumerate all computable sequences, and that is the obstacle we face.

  Is anything lost? Yes: the classical result is about the existence of a bijection (or lack thereof) in the abstract, regardless of computability. But in computation, we are only concerned with effective bijections (computable functions). So the classical result is stronger in the sense that it applies to arbitrary sets, but that strength is not relevant to computation.

  ### 4. Finitism native to programming

  In programming, a natural finitism arises: we can only compute objects that can be represented in finite memory and computed in finite time. We can represent potential infinities (via generators) but we cannot complete an infinite computation. 

  This view retains the force of finitism: we reject completed infinities because we cannot actually have them. However, we are more liberal than strict finitism because we allow unbounded computations (that run forever) and we reason about them. But in practice, we must set resource bounds for termination.

  The force of the original finitism was to avoid paradoxes of infinity. In programming, we avoid non-termination and out-of-memory errors by design. So the force comes from practical constraints.

  ## Bottom Line

  If you tell your colleague that the whole dispute is either obvious or empty, you would be getting wrong the following:

