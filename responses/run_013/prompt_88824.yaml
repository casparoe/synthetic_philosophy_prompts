  The problem: we are building a finite list because we can only run for as long as the enumeration provides sequences. But the argument requires that we build an infinite sequence. 

  Moreover, the enumeration might be infinite, but we cannot run the diagonalization to infinity in finite time. So we are stuck: the diagonal argument in its classical form requires that we have an enumeration of all infinite sequences (a completed infinity) and then we construct a sequence that is not in the enumeration. In programming, we cannot complete this construction because we cannot run an infinite number of steps.

  But we can interpret the diagonal argument as a proof by contradiction: if there were an enumeration of all infinite binary sequences, then we could build a sequence not in the enumeration. Therefore, no such enumeration exists.

  In computability terms, we can say: there is no algorithm (generator) that enumerates all infinite binary sequences. Why? Because if we had such an algorithm, we could use the diagonal argument to produce a sequence that is not enumerated. But note: the diagonal argument as an algorithm would have to run in finite time? It doesn't. 

  However, we can consider the diagonal argument as a proof that the set of infinite binary sequences is not effectively enumerable. That is, there is no computable bijection between the natural numbers and the set of all infinite binary sequences.

  But note: there is a bijection in set theory (if we accept the axiom of choice) but it is not computable. In programming, we care about computable functions.

  So the diagonal argument in programming terms becomes: the set of infinite binary sequences is not computably enumerable. This is similar to the halting problem? 

  Actually, the halting problem can be used to show that there is no enumeration of all computable functions (or all computable infinite sequences). But here, we are talking about all infinite binary sequences (including non-computable ones). In programming, we typically only consider computable sequences (because they are generated by a program). 

