prompt: |-
  My friend and I got into a three-hour argument last night about the unilateralist's curse and I honestly can't tell if we were even disagreeing or just talking past each other. His position: the curse shows that when a bunch of actors can each unilaterally do some high-variance thing, you get too much of the bad tail, so the fix is basically a norm of not acting without some kind of conformity/coordination check. Fine. My position: that's a lopsided picture, because there's a mirror-image failure he keeps waving away. I've been calling it the multilateralist's curse (my coinage, don't be polite about it if it's dumb) — when acting requires the absence of objection, or actual consensus, and objections are cheap, the default slides toward nobody doing the good thing, and the harm that piles up from inaction is invisible precisely because it never appears as anybody's unilateral act. I think the mirror version is worse whenever the stakes are diffuse and slow. We also got stuck on whether the original thing even survives if the actors' errors are correlated instead of independent, and whether "acting" includes just publishing a paper that nudges someone else to act, which felt like it dissolved half the disagreement.

  Anyway. I'm a philosopher with about a year and a half of postdoc left and one willing co-author, and I want to spend that time on whatever in this area actually matters most, not write another survey. So: what are the real open questions in this neighborhood, and which one or two would you put the year and a half into? I care way more about the ordering and the reasoning than the list. Specifically, for each candidate, tell me what makes it upstream of the others (what work would just be wasted if this got settled wrong), how tractable it is for theorists rather than people running experiments, and how neglected it currently is. And be honest about which of these is a rabbit hole — the kind of thing that sounds deep but where the answer wouldn't change anyone's behavior. What would move a question up or down your list over the next couple years? Also, since I'll probably lose this argument with my friend one way or the other, tell me which framing you'd actually defend, the conformity-norm one or my mirror version, or whether the whole action/omission split is a red herring.
reasoning: |-
  Okay, let me start by unpacking this user's query. They had a three-hour argument with a friend about the unilateralist's curse and its mirror version. The user is a philosopher with limited postdoc time and wants to focus on impactful research. They need help identifying the most pressing open questions in this area.

  First, I need to understand both sides of their argument. The friend emphasizes the unilateralist's curse: individual actions causing harm due to high variance, requiring coordination norms. The user counters with the multilateralist's curse: inaction due to cheap objections leading to diffuse harm. They also mentioned correlated errors and whether publishing counts as action.

  The user's deeper needs seem to be about prioritizing research that's both foundational and impactful. They want to avoid surveys and dive into something that addresses core issues. Their questions about upstream importance, tractability, neglect, and rabbit holes are key. They also care about resolving their debate's framing.

  I should identify which areas are upstream—meaning solving them would clarify other issues. For example, defining decision thresholds affects both curses. If we can formalize when an action requires consensus vs. unilateral moves, that could unify both problems. This seems highly tractable for theorists using game theory or decision theory models. It's also somewhat neglected since most literature focuses on unilateral risks, not the inaction problem.

  Next, how error correlation changes the curses. The user mentioned this during their argument. If errors are correlated, the unilateralist's curse might weaken because actors aren't making independent mistakes. This is theoretically tractable but might require simulations. It's under-discussed, so tackling it could prevent misapplied solutions. However, it might be a rabbit hole if real-world errors are context-dependent.

  Considering incentive structures is another area. Why do people object cheaply or act unilaterally? Designing mechanisms to balance these could be impactful. But it's more applied and might require empirical work, which the user wants to avoid.

  The status quo bias in multilateral scenarios is crucial. Why does inaction's harm remain invisible? This ties into moral philosophy and could influence policy. It's tractable through formalizing harm distribution and decision inertia. Neglected in current literature, making it a high-value target.

  Assessing rabbit holes: Definitions of "action" (like publishing) might not change real behavior. Similarly, if error correlation findings are too abstract, they might not shift norms. Prioritizing upstream questions avoids these pitfalls.

  Regarding their debate, both curses are valid but context-dependent. The multilateral curse is worse for diffuse, slow harms, which are often overlooked. Emphasizing this could balance the discourse. The action/omission split is less critical than the threshold problem.

  The user should focus on decision thresholds first, then error correlation. These are foundational, tractable, and neglected. Addressing them would frame other issues better and align with their expertise. The status quo bias is also vital for highlighting invisible harms.
answer: |-
  Here's a brutally honest prioritization of open questions in your neighborhood, with reasoning on upstream impact, tractability, neglect, and rabbit holes. I'll defend a position on your debate at the end.

  **Core Insight:** Your "multilateralist's curse" is **valid, understudied, and often more pernicious** for slow-burn, diffuse-stakes problems. The action/omission split *is* partially a red herring – the deeper issue is **decision thresholds and the visibility of harm**.

  ### Prioritized Open Questions (Ranked)

  1.  **The Threshold Problem: Formalizing Decision Rules & Default States**
      *   **What it is:** Rigorously modeling *when* an action requires unilateral initiative, simple majority, consensus, veto rights, etc., and how the *default state* (action vs. inaction) is determined by institutional design or norms. This directly unifies both curses.
      *   **Upstream Impact (Highest):** Settling this dictates *which curse applies* in a given context. A flawed threshold model makes *any* subsequent analysis of coordination mechanisms, error correlation, or harm calculation potentially wasted or misapplied. It defines the battlefield.
      *   **Tractability:** High for theorists. Combines game theory (voting, bargaining, mechanism design), decision theory (under uncertainty), and institutional analysis. Focus on comparing equilibrium outcomes under different threshold rules for initiating action/blocking action, incorporating costs of coordination/objection.
      *   **Neglect:** Severe. Vast literature on voting/collective action, but surprisingly little *directly* modeling the *choice of threshold itself* as a lever controlling the trade-off between unilateral recklessness and multilateral paralysis for high-stakes, uncertain actions. Your "multilateralist's curse" framing highlights this gap.
      *   **Rabbit Hole Risk:** Low. Getting the threshold wrong has massive behavioral implications. Clarity here forces explicit trade-offs.
      *   **Movement Factor:** New empirical work on real-world coordination failures/successes (e.g., climate governance, AI governance attempts, institutional reforms) could provide crucial test cases or highlight neglected variables (e.g., time pressure asymmetries).

  2.  **Error Structure & Its Impact on Curse Dominance**
      *   **What it is:** How does the correlation of errors (in judgment, risk assessment, value weighting) among actors change the severity and dynamics of *both* curses? Does high correlation mitigate the unilateral curse but exacerbate the multilateral curse?
      *   **Upstream Impact (High):** Determines the robustness of proposed solutions (like conformity norms). If errors are highly correlated, conformity norms become *worse* – they amplify systemic blind spots without reducing unilateral tail risk much. Solutions assuming independence fail catastrophically. This fundamentally changes the risk calculus for both curses.
      *   **Tractability:** Moderate-High. Theory-heavy: Bayesian networks, models of herding/information cascades, correlated priors/updating in group settings. Requires moving beyond simple i.i.d. error assumptions. Simulations are powerful here.
      *   **Neglect:** Significant. While correlation is acknowledged abstractly, its *systematic impact* on the core dynamics of these specific curses (especially the interaction with decision thresholds) is under-theorized. Most discussions implicitly assume independence.
      *   **Rabbit Hole Risk:** Moderate. If taken too abstractly ("what if errors are correlated *in general*?"), it becomes intractable and less actionable. Must be tightly coupled to specific contexts (e.g., "correlation in AI risk assessment among tech leaders").
      *   **Movement Factor:** Advances in modeling complex dependence structures in decision theory or empirical studies of group judgment correlation in high-stakes domains (e.g., finance, pandemic response) could make this more urgent.

  3.  **The Invisibility Discount: Quantifying Harm from Systemic Inaction**
      *   **What it is:** Developing robust formal methods to characterize, attribute, and weigh the *diffuse, slow-moving, non-attributable harms* arising from the multilateral curse (inaction) against the *visible, attributable harms* of the unilateral curse (bad actions).
      *   **Upstream Impact (Medium-High):** Essential for justifying interventions against the multilateral curse. If we can't credibly model/signify these harms, the unilateral curse will always dominate policy attention ("We must stop *this bad thing someone did!*" vs. "We should maybe prevent this slow decline?"). Impacts cost-benefit analysis for institutions.
      *   **Tractability:** Moderate. Challenges: Formalizing counterfactuals of inaction, discounting future diffuse harms, assigning responsibility/credit. Leverages welfare economics, social choice, moral philosophy frameworks. Less pure math, more conceptual heavy lifting.
      *   **Neglect:** High, especially formally. Philosophers discuss "sins of omission" and economists model externalities, but a dedicated framework for the *systemic, institutional paralysis* harm specific to high-threshold decisions is lacking. Your "invisible precisely because it never appears" hits the nail on the head.
      *   **Rabbit Hole Risk:** Moderate-High. Risk of getting bogged down in intractable moral philosophy (e.g., non-identity problems) or vague definitions. Must stay focused on *comparative institutional impacts*.
      *   **Movement Factor:** Growing focus on long-termism, existential risk, and slow-moving crises (climate, antimicrobial resistance) increases demand for tools to make inaction costs salient.

  ### Lower Priority / Rabbit Holes

  *   **The "What Counts as Action?" Debate (Publishing, Nudging, etc.):** Important contextually, but **rabbit hole risk: High**. It often dissolves into semantics. Focus instead on the **locus of decisive causal influence** and **attributability of harm/benefit** within your threshold and harm models. Does publishing *reliably and significantly* shift the probability of harmful outcomes attributable to the publisher? If yes, model it as a (risky) action within your framework. Don't let definitions paralyze the core analysis.
  *   **Generic "Which Curse is Worse?":** **Rabbit hole.** The answer is always "It depends on the threshold, error structure, stakes distribution, and time horizon." Focus on modeling *when* each dominates.
  *   **Pure Survey Work:** You're right to avoid this. Synthesize *only* as needed to build your formal models for 1-3 above.

  ### Your Argument: Which Framing to Defend?

  1.  **Your Friend is Right... but Narrow:** The unilateralist's curse is real, well-documented (e.g., in AI risk, biosecurity), and conformity/coordination *is* a crucial tool. Ignoring it is dangerous for high-variance, fast-acting risks.
  2.  **You are More Fundamentally Right:** The "multilateralist's curse" (though I'd suggest **"Consensus Paralysis"** or **"Veto Inertia"** as clearer terms than your coinage) is:
      *   **Theoretically Symmetric:** It's the exact inverse failure mode of the unilateral curse, governed by the decision threshold.
      *   **Empirically More Pervasive:** For the vast majority of complex, slow-moving, diffuse-stakes problems facing institutions (climate decay, institutional rot, underinvestment in resilience, slow-motion ethical failures), the barriers to coordinated action *are* the primary failure mode. The harm is colossal but invisible.
      *   **Philosophically Deeper:** It directly challenges our moral and institutional focus on *attributable* harm, highlighting a massive blind spot.
  3.  **The Action/Omission Split *is* Largely a Red Herring:** The core isn't metaphysics, it's **institutional design and default states.** Does the system default to action unless stopped (enabling unilateral curse), or default to inaction unless positively enabled (enabling multilateral curse)? Both can cause massive, morally significant harm. Framing it as "action vs. omission" often just reflects the *current institutional default*, not a deep moral truth.

  **Defend This:** **The critical issue is the *choice of decision threshold*, which creates a fundamental trade-off between the risks of unilateral harm and systemic paralysis. Ignoring either side of this trade-off, especially the insidious harms of paralysis, leads to catastrophic institutional failure. The multilateral curse (Consensus Paralysis/Veto Inertia) deserves equal theoretical standing and is often the dominant threat for humanity's most pressing challenges.**

  ### What to Spend 1.5 Years On

  1.  **Core Project (1 Year):** **Formal Models of Decision Thresholds & Curse Trade-offs.** Develop a unified theoretical framework (game-theoretic/decision-theoretic) modeling how different decision rules (unilateral action, majority, consensus, veto systems) alter the probability and severity of *both* types of curses. Incorporate:
      *   Costs of coordination/objection.
      *   Asymmetric stakes/risk perceptions.
      *   **Explicitly model the "default state" and its consequences.**
      *   *Outcome:* Foundational paper establishing the threshold trade-off rigorously. This is the most upstream, tractable, and neglected high-impact target.
  2.  **Side Project (0.5 Year):** **Error Correlation in Your Framework.** Extend the core model to analyze how correlated errors shift the optimal threshold and the dominance of one curse over the other. Show how "conformity norms" can backfire spectacularly under correlation. *Outcome:* Strong follow-up paper or major section in the main paper, addressing a key robustness concern and increasing real-world applicability.

  This approach tackles the most fundamental lever (thresholds), provides tools to analyze your debate rigorously, addresses the error correlation point, gives formal heft to your "multilateral curse," avoids rabbit holes, and delivers foundational rather than survey work. It positions you to shape the core understanding of collective action under uncertainty. Good luck!
