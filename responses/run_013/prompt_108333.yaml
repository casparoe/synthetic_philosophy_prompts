  *anticipating* The user wants their deflationist to sound clever but lose logically. Thomas should concede nothing about the hypothetical's plausibility ("pure fantasy") while hammering the relational damage. The phrase "you've vandalized the scaffolding of human cooperation" feels right - sharp but not preachy. 

