  We are to design a pair of scenarios: one of genuine perception and one of subjectively indistinguishable non-perception, set in an ordinary context (like a kitchen). The non-perception should not be a hallucination but perhaps a very realistic non-perceptual state (e.g., a vivid memory or a very realistic imagination). We want to avoid sci-fi.

  Scenario:

  You are in your kitchen, making tea. In the good case, you look at the counter and see a red kettle. It is actually there. In the bad case, you are in the same kitchen, but the kettle is not on the counter (it's been put away). However, you have a vivid, involuntary memory flash of the kettle being on the counter (from when it was there just a minute ago). This memory is so vivid and sudden that it is subjectively indistinguishable from actually seeing the kettle at that moment. You are not aware that it's a memory; it feels like a present perception.

  So:

  - Good case: You see the kettle (veridical perception).
  - Bad case: You have a vivid, involuntary memory that is subjectively like seeing the kettle, but it's not a perception (it's a memory).

  Now, we need to get the three positions to yield:

  (a) Common-core: same experience, same justification.
  (b) Disjunctivist about experience (so the two experiences are different in kind) but not about justification: same justification.
  (c) Disjunctivist about justification: only the good case gives perceptual justification.

  Walk through:

  First, the common-core view (a):

  This view holds that the two situations (veridical perception and the vivid memory) share a common core of experience. The subject has the same sensory impression in both cases. Therefore, what the subject has to go on is identical. The subject is equally justified in believing that there is a red kettle on the counter in both cases. The justification is based solely on the internal state, which is the same.

  Second, view (b): disjunctivist about experience but not about justification.

  This view says that the two experiences are of different kinds: one is a genuine perception (which is a relation to an actual object), and the other is a memory (which is not). So they are fundamentally different mental events. However, the justification for belief is the same in both cases because the subject has no way to tell them apart. The subject's evidence is the same: it seems to the subject exactly as if there is a red kettle. Since justification depends only on the subject's perspective (the internal evidence), the subject is equally justified in believing that there is a kettle in both cases.

  Third, view (c): disjunctivist about justification or knowledge.

  This view says that only in the good case (the genuine perception) does the subject have the kind of warrant that comes from perception. In the bad case, even though it seems the same, the subject does not have perceptual justification. The justification in the bad case is not the same because it is not grounded in the world. The subject might be blameless in believing, but they are not justified in the same way. Only the good case provides the subject with a reason that is factive (i.e., it entails the truth of the belief).

  Now, the key feature that allows (b) to be distinct from (c) is the role of the subject's perspective. Both (b) and (c) agree that the experiences are different in kind (so they are disjunctivists about experience). But they differ on justification. In (b), justification is internal and depends only on how things seem to the subject. In (c), justification is external and requires that the experience be connected to the world in the right way (like being a perception).

  The feature that does the work: justification is determined solely by the subject's internal evidence (or the way things seem) in (b), but in (c) it requires the appropriate external connection (like being caused by the object in the right way).

  What if we strip that feature? If we remove the idea that justification depends only on the internal state, then (b) would collapse into (c). Because without that internalist constraint, the disjunctivist about experience would naturally say that the justification must also be different because the experiences are different and only one is a perception.

  But if we remove the disjunctivism about experience, then (b) and (c) would collapse into (a) because we are back to common core.

  However, the feature we are focusing on is the internal/external dimension of justification. Without the internalist component, (b) becomes (c). Without the disjunctivism about experience, we get (a).

  Now, the common-core view (a) would object to the scenario by arguing that the bad case is not a genuine case of the same experience as perception because memory is a different kind of state. But we set up the bad case as a memory that is subjectively indistinguishable. The common-core view might say: even though we call it a memory, if it is subjectively indistinguishable, then it must share the same core experience. So they would stick to their guns.

  But let's give the common-core view a stronger objection: they might argue that the bad case as described (a vivid memory) is not really subjectively indistinguishable from a current perception. In a memory, even if vivid, there might be subtle differences (e.g., it might feel like a memory, or lack the immediacy). To counter this, we can stipulate that the memory is so vivid and sudden that it is momentarily taken as a perception. But the common-core view might still say that in principle, if it is indistinguishable, then it must have the same core.

  Alternatively, the common-core view might object that the disjunctivist is just re-describing the same internal state with different external labels. They would say that the experience itself is the same, and the difference is only in the cause.

  But we are building the case to have the disjunctivist about experience say that the experiences are different in kind. So we have to assume that for the purpose of the thought experiment.

  Now, the strongest move against the case from the common-core view: They might argue that the bad case (vivid memory) is not a candidate for being a perceptual experience at all, so it's not a case that can be compared. But we are comparing a perception and a non-perception that are subjectively indistinguishable. The common-core view must say that the two cases share a common core of experience, and that is what justifies the belief. They would deny that the disjunctivist's claim about the experiences being different in kind is correct. They would insist that the subject has the same evidence in both cases.

  So, to sum up:

  The key feature that separates (b) from (c) is that in (b) justification is determined solely by the subject's internal state (internalism about justification), whereas in (c) justification requires an appropriate external connection (externalism about justification).

  Answer: the feature that does the work is internalism about justification.

  But note: in (b), we have disjunctivism about experience (so the experiences are different) but internalism about justification (so the justification is the same). In (c), we have disjunctivism about experience and externalism about justification (so the justification is different).

  Therefore, the key is the internalist/externalist dimension of justification.

