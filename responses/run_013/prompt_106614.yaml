prompt: |-
  Right, so — I did thirty-odd years in a chem lab and retired, and now I've fallen in with a philosophy reading group, and disjunctivism is the thing thats been keeping me up. As I understand it, disjunctivism says that when I see the kettle and when I merely hallucinate a kettle, those aren't the same inner event with a different cause bolted on; they're different kinds of thing. And the argument from illusion is the crowbar people use to break that: the two cases are indistinguishable from the inside, so (the argument goes) they must share a common core.

  What I want from you is a case built to order, not a summary of the debate. One pair of ordinary, everyday situations — kitchen, street, office, whatever, no brains in vats, no evil neuroscientists, nothing sci-fi — a genuine perception in one and a subjectively indistinguishable non-perception in the other, engineered so that three positions land on the verdicts I'm about to list, and I want those verdicts to fall out of the positions themselves, not be smuggled in by me:

  (a) the common-core view — the two cases are the same kind of experience, the subject has the same thing to go on, so the subject is equally justified in both;

  (b) a view that IS disjunctivist about the experience but NOT about the justification — the two experiences really are different in kind, and yet what the subject is justified in believing is identical in the two cases;

  (c) the view that's disjunctivist about the justification or knowledge itself — only in the good case does the subject have the kind of warrant that a perception gives you, so the verdicts come apart.

  The bit I actually care about is getting (b) to be a live option and not a contradiction, so I need the case to make clear why someone could call the two experiences different kinds while still saying the subject's justification is the same. Set the scenario out in a paragraph, then walk the three positions through it one at a time, saying for each exactly what it says and why.

  Then tell me the one feature of the case that's doing the real work in separating (b) from (c) — I've been thinking about it alot and I suspect it's something about whether justification depends only on how things seem to the subject or whether it's tied to the world actually being a certain way, but I want you to pin it down. Say what happens to the whole thing if I strip that feature out: does (b) collapse into (c), or into (a)? And then argue it from the other side — put on the hat of someone who holds the common-core view and give me their single strongest move against the case, not a weak version.

  Keep the whole thing tight, no more than a page or so. Finish with one last line that is just \answer{...} with a few words inside the braces naming the feature that does the work, so I can copy it straight into my notes.
