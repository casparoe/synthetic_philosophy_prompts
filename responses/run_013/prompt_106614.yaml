answer: |-
  ### Case Setup: The Kitchen Kettle

  You're in your kitchen making tea. In the **good case**, you glance at the counter and see a red kettle. It’s actually there—your partner just filled it and set it down. In the **bad case**, you glance at the same spot, but the kettle isn’t there (your partner moved it to the cupboard seconds earlier). Instead, you experience a sudden, vivid, and involuntary memory flash of the kettle from when it *was* on the counter moments ago. This memory is so immediate and sensorily rich (color, shape, location) that it’s subjectively indistinguishable from actually seeing the kettle now. You don’t recognize it as a memory; it feels like a present perception. Both cases involve the same belief: "There’s a red kettle on the counter."

  ### Walkthrough of the Three Positions

  **(a) Common-core view (e.g., sense-datum theory or representationalism):**  
  The two cases involve the same kind of experience—a subjective impression of a red kettle. Whether caused by perception or memory, the inner event (e.g., a mental image or representation) is identical from the subject’s perspective. Thus, the evidence available to you—how things seem—is identical in both cases. You’re equally justified in believing the kettle is there because justification depends solely on this internal evidence. In the bad case, you’re misled by the memory, but your justification is unchanged: it’s based on the same seeming-state.

  **(b) Disjunctivist about experience, but not justification (e.g., experiential disjunctivism combined with internalist justification):**  
  The two experiences are fundamentally different in kind. The good case is a genuine perception: a direct relation to the real kettle. The bad case is a memory: a stored mental state triggered involuntarily, lacking perceptual contact with the world. These are distinct psychological events. However, justification is determined entirely by your internal perspective: how things seem to you. Since the experiences are subjectively indistinguishable, your evidence—the apparent presence of the kettle—is identical in both. Thus, you’re equally justified in believing the kettle is there. The difference in experience doesn’t affect justification because justification is internal and access-based.

  **(c) Disjunctivist about justification/knowledge (e.g., epistemological disjunctivism):**  
  The experiences differ in kind (as in b), but crucially, justification also differs. Only the good case involves a perceptual state that directly links you to reality, providing factive warrant (your experience guarantees the kettle’s presence). In the bad case, the memory state provides no such link; it’s a mere appearance disconnected from the current world. Thus, you’re justified in the good case because your belief is grounded in perception, but in the bad case, you lack justification—even though you’re blameless. Justification requires the right external connection, not just internal seemings.

  ### The Key Feature and Its Role

  The feature doing the real work in separating (b) from (c) is **whether justification is internalist (depending solely on the subject's perspective) or externalist (requiring a reliable connection to reality)**.  
  - In (b), justification is internalist: it’s determined by how things seem, making the subject’s evidence identical despite differing experiences.  
  - In (c), justification is externalist: it requires the experience to be factively grounded, so only perception justifies.  

  **If this feature is stripped out (e.g., by removing internalism):**  
  - (b) collapses into (c): Without internalism, justification must rely on external factors, so the disjunctivist about experience would naturally deny equal justification in the bad case.  
  - (It does not collapse into (a) because (b) still rejects a common core of experience.)  

  **If disjunctivism about experience is removed, (b) and (c) collapse into (a)**: Both would then treat the experiences as sharing a common core, making justification identical.  

  ### Strongest Common-Core Objection  

  The common-core advocate argues: "Your ‘bad case’ isn’t truly subjectively indistinguishable! Memories, even vivid ones, carry subtle temporal or qualitative differences from perceptions—e.g., a faint sense of pastness or less sensory immediacy. If it *were* indistinguishable, that would prove a shared core (e.g., a sense-datum or representation), making the experiences fundamentally the same. Calling one ‘memory’ and one ‘perception’ just labels external causes; internally, they’re identical events. Thus, (b) and (c) are smuggling in an unmotivated disjunction—they’re just (a) with extra baggage."  

  ### Final Analysis  

  The case succeeds in making (b) a live option by leveraging internalism about justification: even with different experiences, justification remains tied to seemings. Without internalism, (b) fails; with it, (b) avoids collapsing into (a) or (c).  

  \answer{internalism about justification}
