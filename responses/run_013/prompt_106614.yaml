  The feature that separates (b) from (c) is the acceptance of internalism about justification (i.e., that justification depends only on the subject's internal state). Without this feature, if we reject internalism and accept externalism, then (b) collapses into (c). That is, if we think that justification requires an appropriate external connection, then the disjunctivist about experience would naturally say that only the good case has the right connection and thus provides justification.

