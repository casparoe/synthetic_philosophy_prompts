prompt: |-
  I work as an interpretive naturalist at a state park. Most of my day is spent answering some version of 'why does it do that?' or 'what is that for?' — on walks, at the visitor center, and in the short labels and program descriptions that go out under the park's name. I have to answer in a sentence or two, without jargon, to people who reasonably take what I say as the park's considered word.

  The longer I do this, the less certain I am that I know what I am claiming when I say a trait is 'for' something. Sometimes I seem to mean that the trait was shaped over many generations because it helped ancestors survive or reproduce; other times I only mean that it does something useful for the organism right now. I have learned the hard way that these can come apart. A biologist friend caught me giving a tidy selection story for a structure that, as far as anyone can tell, never had any selection pressure behind it — it simply comes along for the ride with something else. Another time I explained a behavior as being 'for' mating when it was at least as likely to be a side effect of something unrelated. I have also been asked, reasonably, what the point is of a structure that clearly mattered to ancestors but appears to do nothing for the animals in front of us now. I would rather have a method than keep improvising.

  Please write me a decision procedure I can actually run in the minute or two before I answer, whenever I am about to say that some trait has a function. I want the questions to ask, in order; what counts as a good answer to each; the point at which the procedure tells me to say something weaker or vaguer; and the point at which it tells me that the question is a judgment call rather than a fact, so that I should either flag my uncertainty aloud or hand it to someone with more training. I do not have the technical vocabulary, but I understand that there is a genuine, unresolved disagreement among people who study this about what it even means to say that a trait has a 'function,' and I do not want the procedure to paper that over. If the honest output is sometimes 'this has a function in one sense and not in another,' I want the procedure to say so, and to tell me how to phrase that for a visitor without sounding evasive.

  Then run the procedure on three cases and tell me where each one lands: (a) a showy trait that everyone assumes was selected for attracting mates, where I want to know exactly what that claim commits me to; (b) a feature that is clearly doing something useful for the organism right now but that no one thinks was shaped by selection for that particular use; and (c) a feature that was plainly shaped by selection in the ancestors but that, in the population I am actually talking about, no longer performs that job. At least one of the three should come out with an answer I will not like — something less confident than what visitors expect, or than what I would instinctively say.

  Finally, tell me what the procedure cannot do. I would like an honest list of the function questions I should refuse to answer on my own, and of the cases where the best I can do is tell a visitor that the park does not know.
reasoning: |-
  We are creating a decision procedure for an interpretive naturalist to determine when and how to assign a function to a trait.
   The procedure must be run in a minute or two, so it must be a short sequence of questions.
   We are aware of two main concepts of function: 
     1. Historical (etiological): The trait was shaped by natural selection because it contributed to survival or reproduction in the past.
     2. Causal-role (dispositional): The trait currently plays a beneficial role for the organism.

   Steps in the decision procedure:

   Step 1: Ask "Is the trait currently contributing to the survival or reproduction of the organism?"
     - If yes, note that it currently has a causal role (dispositional function). Then proceed to Step 2.
     - If no, then we cannot assign a current causal role. Proceed to Step 2 to check for historical function.

   Step 2: Ask "Is there evidence that this trait was shaped by natural selection because it contributed to the survival or reproduction of the organism's ancestors?"
     - If yes, then it has a historical (etiological) function. But note: it might not be currently functional (if Step 1 was no).
     - If no, then we cannot assign a historical function.

   Step 3: Interpret the results:

     Case A: Both Step 1 and Step 2 are yes.
          - We can say: "This trait likely evolved because it helped the animal [historical function], and it still serves that purpose today by [causal role]."

     Case B: Only Step 1 is yes (current causal role) but Step 2 is no (no evidence of historical selection for that role).
          - We can say: "Right now, this trait helps the animal by [causal role]. However, we don't have evidence that it originally evolved for that purpose. It might have been a side effect of other changes or it might have been co-opted for this use later."

     Case C: Only Step 2 is yes (historical function) but Step 1 is no (no current role).
          - We can say: "This trait appears to have been important in the animal's evolutionary past because it helped with [historical function]. However, in the current population/environment, it doesn't seem to serve that purpose anymore. It might be a vestige or it could be doing something else we haven't identified."

     Case D: Both are no.
          - We can say: "We don't currently know of a specific function for this trait. It might be a byproduct of other traits, or it could have a function we haven't discovered yet."

   Step 4: If there is uncertainty in the evidence for either step, we must express that. For example:
     - If we are not sure about the current role (Step 1): "It might be helping with ... but we aren't certain."
     - If we are not sure about the historical role (Step 2): "It's possible that this trait evolved for ... but we don't have strong evidence for that."

   Step 5: When we have conflicting interpretations or when the evidence is weak, we should flag our uncertainty. Also, if the question involves a trait that is the subject of ongoing scientific debate, we should say so and perhaps refer to a specialist.

   Step 6: If the procedure leads to an answer that combines both concepts (like Case B or C) or if we have uncertainty, we must phrase it clearly without jargon.

   Important: We must avoid claiming certainty when we don't have it. Also, we must not imply that every trait must have a function.

   Now, let's run the procedure on the three cases:

   Case (a): A showy trait that everyone assumes was selected for attracting mates.
     Step 1: Is it currently contributing to survival or reproduction? 
          - We assume it is currently used in mate attraction, so yes (causal role: attracting mates).
     Step 2: Is there evidence that it was shaped by selection for attracting mates?
          - The question says "everyone assumes", but we must be cautious. If the evidence is strong (e.g., through experiments or comparative studies) then yes. But if it's just an assumption without direct evidence, we might have to say "it is thought to have evolved for that purpose, but we don't have direct evidence". However, for the sake of the case, let's assume there is evidence (e.g., in many birds, showy plumage has been studied and shown to be under sexual selection). So yes.

     Result: Case A. We can say: "This showy trait likely evolved because it helped the animal attract mates, and it still serves that purpose today."

     But note: if the evidence for historical selection is weak, we might say: "It is currently used for attracting mates, and it is widely thought that this is why it evolved, but we don't have direct evidence from this species."

   Case (b): A feature that is clearly doing something useful for the organism right now but that no one thinks was shaped by selection for that particular use.
     Step 1: Yes, it currently has a causal role (e.g., a current use).
     Step 2: No, we don't think it was shaped by selection for that use (it might be an exaptation).

     Result: Case B. We say: "Right now, this feature helps the animal by [current use]. However, we don't have evidence that it originally evolved for that purpose. It might have been a side effect of other changes or it might have been co-opted for this use later."

   Case (c): A feature that was plainly shaped by selection in the ancestors but that, in the current population, no longer performs that job.
     Step 1: Currently, it does not perform the job (so no for current causal role in that original function). But note: it might have a new function? The question says "no longer performs that job", so we assume Step 1 for the original function is no. However, we must check if it has a new function? The question doesn't say, so let's assume we are only considering the original function.

     Step 2: Yes, it was shaped by selection for a particular function in the ancestors.

     Result: Case C. We say: "This feature was important in the animal's evolutionary past because it helped with [historical function]. However, in the current population, it doesn't seem to serve that purpose anymore. It might be a vestige or it could be doing something else we haven't identified."

     But note: if we know it has a new function, we would have mentioned that in Step 1. So if we know of a new function, we could say: "While it was originally shaped by evolution for [historical function], now it appears to be used for [new function]." That would be a combination of Case C and then adding the new function from Step 1 (if we have evidence for the new function).

   Now, which one might be an answer the naturalist won't like? 
     Case (b) might be unsatisfying because visitors often want to hear an evolutionary story, but we are saying we don't have evidence for that. 
     Case (c) might be unsatisfying because the trait is no longer functional, and visitors might wonder why it's still there.

   Finally, what the procedure cannot do:

     1. It cannot resolve deep philosophical disagreements about the nature of function (we are presenting both historical and causal-role concepts and being clear when we are using which).
     2. It cannot provide evidence that we don't have. If there is no research on the trait, we have to admit ignorance.
     3. It cannot assign a function in cases where the trait is currently harmful or neutral and we have no evidence of past function (Case D) without speculation.
     4. It does not account for every nuance (e.g., traits that have multiple functions, or functions that have changed over time). In such cases, we might need to give a more complex answer or refer to an expert.

     Therefore, we should refuse to answer on our own when:

       - The trait is the subject of active scientific debate and there is no consensus.
       - We are aware of conflicting evidence that we cannot resolve.
       - The question involves complex mechanisms that require specialized knowledge (e.g., molecular or genetic explanations beyond our training).
       - We cannot find any information on the trait (then we say: "That's a great question! We don't have a clear answer for that. I can try to find out more or you might look up [suggest a resource].")

     In such cases, we can say: "That's a really interesting question, and scientists are still working on it. I don't have a definitive answer, but I can point you to some resources if you'd like to learn more."

   Let's formalize the procedure:

     Step 1: Current Function?
          - Is there evidence that the trait currently contributes to the organism's survival or reproduction? (Be specific: what is the contribution?)
          - If yes, note the current function (causal role) and move to Step 2.
          - If no, move to Step 2.

     Step 2: Historical Function?
          - Is there evidence that the trait was shaped by natural selection for a specific role (and that role is the one we are considering)?
          - Evidence might include: comparative studies, experimental manipulation, or strong inference from the trait's design.

     Step 3: Combine:

          Current? | Historical? | What to say
          ----------------------------------------
          Yes      | Yes         | "This trait likely evolved because it helped with [historical function], and it still serves that purpose by [current function]."
          Yes      | No          | "Currently, this trait helps with [current function]. However, we don't have evidence that it originally evolved for that purpose. It might be a side effect or a later co-option."
          No       | Yes         | "This trait was shaped by evolution to help with [historical function] in the animal's ancestors. However, in the current population, it doesn't seem to serve that purpose anymore. It might be a vestige, or it could have a new function we haven't identified."
          No       | No          | "We don't currently know of a specific function for this trait. It might be a byproduct of other traits, or it could have a function we haven't discovered yet."

     Step 4: If we are uncertain about either step, we should express that uncertainty.

     Step 5: If the question is about a function that is controversial or not well-studied, we should say: "There are different ideas about this. Some scientists think ... while others ... We don't have a definitive answer yet."

     Step 6: If we are out of our depth, we should refer the visitor to a specialist or offer to follow up later.

   Now, let's write the procedure in a way that the naturalist can use:

     When asked "What is this for?" or "Why does it do that?" about a trait:

       1. Ask yourself: "Do I know what this trait does for the animal right now that helps it survive or reproduce?" 
          - If yes, state that current function clearly and briefly. (But don't overstate: if you're not sure, say "might" or "could be".)
          - Then proceed to the next question.

       2. Ask yourself: "Do I know that this trait was shaped by natural selection for that specific function (or for a function that matches what we see now)?" 
          - Consider: Have scientists done studies (on this species or close relatives) that show the trait was under selection for that role? Or is it just assumed?
          - If you have good evidence (from reliable sources) say so. If not, then we cannot claim a historical function.

       3. Based on the answers:

          - If both are solid: Present the historical and current function together as above.
          - If only current: Present the current function and explain that we don't know about the evolutionary origin.
          - If only historical: Explain the past function and note the current lack of function (or uncertainty about current function).
          - If neither: Admit that we don't know.

       4. Always be ready to say:
            - "We don't know for sure, but one idea is ..."
            - "There are different ways to think about function ..."
            - "This is an active area of research ..."

       5. If the trait is complex or controversial, or if you are unsure about the evidence, say: 
            - "That's a great question! The answer isn't straightforward because ... [brief reason: e.g., we don't have enough research, or there are competing ideas]. I'd be happy to point you to some resources if you're interested."

       6. Know your limits: If the question is about genetics, deep evolutionary history that is not well understood, or a topic you are not trained in, refer to a specialist or offer to look it up later.

     Remember: It's okay to say we don't know. It's better to be honest than to give a false sense of certainty.

     Now, let's apply to the three cases with the above steps:

     Case (a): Showy trait for mate attraction.
          Step 1: Yes, currently used to attract mates (so current function: mate attraction).
          Step 2: We have evidence? Let's assume we do (e.g., in peacocks, the tail has been studied). So yes, historical function is mate attraction.

          Answer: "This showy trait likely evolved because it helped the animal attract mates, and it still serves that purpose today."

     Case (b): Current use but not shaped for that use.
          Step 1: Yes, current function (e.g., penguins' wings are used for swimming, not flying).
          Step 2: Historical function? The wings were shaped by selection for flight in ancestors, but not for swimming. However, note: in penguins, the wings have been modified by selection for swimming. So we must be cautious.

          But the case says: "no one thinks was shaped by selection for that particular use". So let's take an example: human appendix. Currently, it might have a minor role in immune function, but it wasn't shaped by selection for that. The historical function was for digesting cellulose? But we don't have strong evidence for that either. Actually, the appendix is often considered a vestige. Alternatively, consider the human ear muscles. They can move slightly in some people (current use: none, or very minor) and they were shaped for moving ears in ancestors? But we don't have strong evidence for that. Alternatively, consider a trait that is an exaptation: bird feathers. They evolved for insulation (historical) and then were co-opted for flight (current). But in that case, the current function (flight) was not the historical function. So:

          Example: Feathers in birds for flight.
            Step 1: Current function: flight (and insulation).
            Step 2: Historical function: insulation? (from fossils of dinosaurs with feathers). So the historical function was not flight. Therefore, for the function of flight, Step 2 is no (it wasn't shaped by selection for flight originally). But note: once feathers were present, they were then shaped by selection for flight. So it's a two-step process.

          How to handle? We might say: "Feathers originally evolved for insulation, but they were later modified by natural selection for flight." So we are being clear about the historical sequence.

          For our case (b): if we are talking about the flight function of feathers in modern birds, we can say:
            Step 1: Yes, current function for flight.
            Step 2: Was it shaped by selection for flight? Partially: the feathers were co-opted and then modified. But the initial evolution of feathers was not for flight. So we have to be nuanced.

          Alternatively, let's take a simpler example: the human chin. It might be a byproduct of other changes in the face. It currently serves as an attachment point for some muscles, but it wasn't selected for that. So:

            Step 1: Current function? It does provide an anchor for muscles, so yes (but minimally). 
            Step 2: Historical? No, it's likely a spandrel (byproduct).

          Then we would use the Case B answer.

          So for case (b): "Currently, the chin provides an anchor point for facial muscles. However, we don't have evidence that it originally evolved for that purpose. It might be a side effect of other changes in our facial structure."

     Case (c): Vestigial trait. Example: pelvic bones in whales.
          Step 1: Currently, do they help with survival or reproduction? They are reduced and don't support hind limbs (which are absent). They might have a minor role in reproduction (as attachment points for muscles) but the original function (supporting hind limbs for walking) is gone. So for the original function: no. We might not know of a current function, or it might be minimal.
          Step 2: Historical? Yes, they were part of the hind limb structure in terrestrial ancestors.

          Answer: "These pelvic bones are remnants from the whale's ancestors, which had hind legs and walked on land. They were important for locomotion then, but in modern whales, they don't serve that purpose. They might have a different function now (like helping with reproduction) or they might be vestigial."

          In this case, we are in Case C, but note: if we know of a current function (like attachment for muscles) we would have said yes in Step 1 for that function. Then we would have to consider:

            - Historical function: for walking (which is gone).
            - Current function: muscle attachment.

          Then we might say: "These bones are remnants from the whale's walking ancestors. While they no longer help with walking, they now serve as attachment points for muscles involved in reproduction."

          This combines both: the historical function is one thing and the current function is another.

          But the case says: "no longer performs that job" (the historical job). So we are clear that the historical function is gone. We are then free to note if there is a current function.

          Therefore, we can adjust the procedure to allow for multiple functions? But we are usually asked for the primary function. We can say: "Originally, it was for X. Now, it might be for Y."

     Conclusion:

     The procedure is a tool to help structure the answer. It requires the naturalist to have some knowledge of the trait and its evolution. When in doubt, be honest about the uncertainty.

     Now, the naturalist might not like the answer for case (b) because it doesn't give a satisfying evolutionary story. Or for case (c) because it points out that the trait is a remnant without a clear current function.

     Finally, the procedure cannot:

        - Make up evidence.
        - Resolve debates in the scientific literature.
        - Account for every possible nuance (e.g., traits that have multiple functions at once, or functions that change during an organism's lifetime).
        - Replace expert knowledge in specialized areas.

     Therefore, the naturalist should refuse to answer when:

        - They are aware of significant controversy among experts.
        - The question requires technical knowledge beyond their training (e.g., detailed genetics or biochemistry).
        - There is simply no known function (and they should say so).

     And in such cases, they can say: "That's a fascinating question, but it's outside my area of expertise. I'd be happy to refer you to [resource] or you can check with [specialist]."

     They can also say: "Scientists are still studying that. We don't have a definitive answer yet."

     This approach maintains the park's credibility and encourages scientific curiosity.
answer: |-
  Below is a step-by-step decision procedure you can use to evaluate "function" claims. It’s designed for speed (1–2 minutes) and clarity, with explicit thresholds for uncertainty. The procedure acknowledges two distinct definitions of "function":  
  - **Historical function**: The trait was shaped by natural selection in the past because it improved survival/reproduction.  
  - **Current function**: The trait provides a clear, observable benefit to the organism *today*.  

  **Key rules upfront**:  
  - If evidence for *either* function is weak or conflicting, **default to uncertainty**.  
  - If you lack expertise (e.g., genetics, deep evolutionary theory), **defer to specialists**.  
  - Never guess. If the answer isn’t clear, say: *"We don’t know yet—scientists are still studying this!"*  

  ---

  ### **Decision Procedure: What to Ask (in Order)**  
  Run these questions *mentally* before answering a visitor. Stop early if you hit a "no" or "unsure."  

  1. **Is the trait *currently* doing something observable that helps the organism survive or reproduce?**  
     - *Good evidence*: Direct observations, experiments, or consensus in field guides/park materials.  
     - *Weak evidence*: Anecdotes, untested assumptions, or vague benefits.  
     - **If YES → Note the current function. Proceed to Q2.**  
     - **If NO or UNSURE → Skip to Q2 (it might still have a historical function).**  

  2. **Is there strong evidence that this trait was *shaped by natural selection* for a specific role?**  
     - *Good evidence*: Fossil records, experimental studies, or comparisons showing the trait evolved *because* it provided a specific advantage.  
     - *Weak evidence*: "Just-so stories," traits that are merely correlated, or traits that tag along with another adaptation (linked genes).  
     - **If YES → Note the historical function. Proceed to Q3.**  
     - **If NO or UNSURE → Stop. The trait *lacks* a historical function.**  

  3. **Do historical and current functions align?**  
     - **If YES → You can confidently state both.**  
     - **If NO → Acknowledge the mismatch (e.g., "It evolved for X, but now it does Y").**  
     - **If UNSURE → Default to current function only (if Q1 was clear).**  

  ---

  ### **How to Phrase Answers for Visitors**  
  - **Always flag uncertainty** with phrases like:  
    - *"We think..."*  
    - *"The leading idea is..."*  
    - *"This is debated..."*  
  - **For mismatches or unknowns**:  
    > *"This trait does [X] for the animal today, but we don’t know if it evolved for that purpose. It might be a side effect or a leftover from the past."*  

  ---

  ### **Testing the Procedure: Your Three Cases**  

  #### **Case (a): Showy trait (e.g., peacock's tail) "for" attracting mates**  
  - **Q1**: Yes! It’s observed attracting mates *now* (current function: mate attraction).  
  - **Q2**: Is there evidence it was *shaped by selection*? **Uncertain**. Sexual selection is likely, but proof requires genetic/experimental data (e.g., tail removal reducing mating success). Many "showy trait" stories are inferred, not proven.  
  - **Procedure output**:  
    > *"This trait helps attract mates today. It’s *likely* it evolved for that purpose, but we can’t be certain—it might be a byproduct of other changes. Scientists are still studying this!"*  
  - **Why you might dislike this**: Visitors expect a tidy evolutionary story, but the procedure forces you to admit uncertainty unless direct evidence exists.  

  #### **Case (b): Current use, no selection history (e.g., human appendix)**  
  - **Q1**: Yes! The appendix *currently* supports gut bacteria/immunity (current function: immune support).  
  - **Q2**: Was it *shaped by selection* for this? **No consensus**. It’s likely a vestige of a larger plant-digesting organ. No evidence selection *shaped* it for immunity.  
  - **Procedure output**:  
    > *"Today, the appendix may help maintain gut bacteria, but it probably didn’t evolve for that. It’s more likely a leftover from our ancestors’ digestive system that got repurposed."*  
  - **Why this works**: You acknowledge the current benefit while rejecting a historical claim.  

  #### **Case (c): Historical function, no current use (e.g., whale pelvic bones)**  
  - **Q1**: Does it help *now*? **No observable benefit** (current function: absent or unknown).  
  - **Q2**: Was it shaped by selection? **Yes!** Fossil evidence shows it supported hind limbs in land-dwelling ancestors.  
  - **Procedure output**:  
    > *"These bones are evolutionary leftovers. They helped our ancestors walk on land, but in modern whales, they no longer serve that purpose. We don’t know why they’re still here—they might be vanishing slowly or have hidden uses."*  
  - **Why you might dislike this**: Visitors expect every trait to have a "point," but the procedure forces you to say: *"It’s a relic with no clear current job."*  

  ---

  ### **What the Procedure CANNOT Do**  
  **Refuse to answer** (or say *"We don’t know"*) when:  
  1. **The trait involves complex genetics or development** (e.g., "Why do some mammals have gene X but not others?"). Defer to biologists.  
  2. **The question conflates adaptation with random chance** (e.g., "Why did this useless trait evolve?" if it’s a drift/spandrel). Say:  
     > *"Not every trait has a ‘purpose’—some are evolutionary accidents."*  
  3. **Evidence is contradictory or emerging** (e.g., animal cognition, microbiome roles). Flag uncertainty:  
     > *"This is an active research area—the park doesn’t have a consensus answer yet."*  
  4. **You’re asked to speculate far beyond your training** (e.g., deep-time evolution, molecular mechanisms). Respond:  
     > *"I’d need to consult our biology team for that. Can I email you an answer later?"*  

  **Remember**: Your role is to inspire curiosity, not certainty. Saying *"We don’t know"* models good science—and often excites visitors more than a shaky story.  

  Use this tool to navigate function questions with integrity. When in doubt, fall back on:  
  > *"Let’s look that up together!"*  
  or  
  > *"Great question—here’s what we *do* know..."*
