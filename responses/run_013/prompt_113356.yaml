  counterfactual

  The colleague's classification appears to be based primarily on grammatical form, specifically the mood and tense of the verb in the antecedent. The indicative sentences in the record ("If the train is late," "If it rains tomorrow," "If John is at home") all use the present indicative tense, while the counterfactual sentences ("If John were at home," "If it had rained yesterday," "If the coin had landed heads") use either the past subjunctive ("were") or past perfect ("had" + past participle) forms. The consequent verb forms also align: indicative sentences use future ("will miss") or present ("is off," "is asleep") constructions, whereas counterfactuals use "would" or "would have" + base verb or participle.

  This grammatical rule—classifying a sentence as counterfactual if the antecedent uses past subjunctive or past perfect, and indicative if it uses present indicative—fits all given examples. Alternative rules are inconsistent with the record. A rule based on presupposing the antecedent's falsity fails because, for future events like "If it were to rain tomorrow," falsity cannot be presupposed (the future is unsettled), yet the form matches counterfactual patterns. A rule based on speaker belief is untenable without context and is not reflected in the consistent form-based pattern. Thus, only the grammatical form rule survives.

  For the new sentence, "If it were to rain tomorrow, the picnic would be off," the antecedent "were to rain" uses the past subjunctive "were" + infinitive, paralleling "If John were at home" (counterfactual). The consequent "would be" also matches the counterfactual pattern. Therefore, the grammatical rule predicts counterfactual.

  I would bet on this prediction because the record shows strict adherence to form, regardless of time reference (e.g., "If John were at home" is present counterfactual, while "If it rains tomorrow" is future indicative). The new sentence's subjunctive form and "would" consequent make it grammatically analogous to the classified counterfactuals.

  To confirm the rule and separate any residual doubt about presupposition vs. form, a further sentence like "If John was at home, he would be asleep" could be useful. If classified as indicative (due to "was" being potentially indicative in informal use), it might challenge the form rule; if counterfactual, it reinforces form (as "was" can substitute for "were" in some dialects). However, given the record's use of clear subjunctive "were," this test is minor, and form remains robust.
