answer: |-
  ### Decision Tree for Judging Historical Figures  

  **Object of Judgment** (Top Node: Avoid circularity by specifying target)  
  - **A. An individual’s character/actions** (e.g., Jefferson as a person)  
  - **B. A practice/institution** (e.g., slavery as a system) → *Leaf: Structural view* (e.g., “Blame institutions, not individuals”)  

  **Branch A (Individual)**  
  1. **Is the defense “He was a man of his time” meant to excuse or explain?**  
     - **A1. Excuse** (Lessens/blameshifts responsibility)  
     - **A2. Explain** (Contextualizes without excusing)  

  2. **What does “his time” refer to?** (Split defenses)  
     - **a. Belief availability** (Could he have known better?)  
       - *Probe for Jefferson: “Jefferson wrote against slavery. Does this weaken the defense that he ‘couldn’t have known’?”*  
     - **b. Practice pervasiveness** (How common was the act?)  
       - *Probe for Jefferson: “Slave-owning was normal for Virginia elites. Does this strengthen the defense?”*  

  3. **Is morality timeless or period-specific?**  
     - **Yes** (Morality changes) → *Leaf: Strict historicism* (“Blaming past figures is a category error”)  
     - **No** (Morality is universal) → Proceed to Q4  

  4. **Do contemporary critics matter?**  
     - **Yes** (Objections existed → culpable ignorance possible)  
       - *Probe for Columbus: “Las Casas condemned colonial violence in the 1500s. Does this make Columbus more blameworthy?”*  
       - *Probe for Roman senator: “Stoics criticized slavery. Does this negate the defense?”*  
     - **No** (Critics were outliers → moral fog) → *Leaf: Moral fog view* (“Nobody could see clearly”)  

  5. **Should public figures be judged differently?**  
     - **Yes** (Role-differentiated ethics) → *Leaf: Role-differentiated view* (e.g., “Statesmen prioritize national interest”)  
       - *Probe for Churchill: “Should Churchill be excused for the Bengal famine due to wartime pressures?”*  
     - **No** (Same standards for all) → Proceed to Q6  

  6. **Is the individual the right target?**  
     - **Yes** → Proceed to Q7  
     - **No** → *Leaf: Structural view* (e.g., “Focus on systems, not people”)  

  7. **Grading benchmark?**  
     - **Absolute standard** (Timeless morality) → *Leaf: Straight presentism* (“Judge by today’s norms”)  
     - **Relative standard** (Compare to peers) → *Leaf: Relative-progress view* (“Was he better than contemporaries?”)  
       - *Probe for Roman senator: “Seneca owned slaves but preached mercy. Is he ‘better’ than his peers?”*  

  ---

  ### Key Cases for Probes  
  - **Jefferson**: Belief availability (he knew abolitionist arguments) vs. practice pervasiveness (slavery was normalized).  
  - **Churchill**: Role-differentiated (wartime leader) vs. universal ethics (famine neglect).  
  - **Columbus**: Contemporary critics (Las Casas) vs. moral fog (colonial era norms).  
  - **Roman Senator**: Control case where both belief availability (Stoic critics) and pervasiveness (slavery ubiquity) exist.  

  ---

  ### Notes on Tree Logic  
  1. **Collisions & Indistinguishable Positions**  
     - The “moral fog” and “strict historicism” leaves are partially separable:  
       - *Moral fog* requires Q4 → “No” (critics don’t matter) + Q3 → “No” (morality universal).  
       - *Strict historicism* requires Q3 → “Yes” (morality period-specific).  
     - “Culpable ignorance” (Q4 → “Yes”) and “they had abolitionists” are the same view.  

  2. **Empty Cells & Why**  
     - **A1 (Excuse) + Q3 → “No” (morality universal) + Q4 → “No”**: *Incoherent*. If morality is universal and critics don’t matter, an “excuse” contradicts timeless blame.  
     - **A2 (Explain) + Q3 → “Yes” (morality period-specific)**: *Unattractive*. Historicism already explains context; adding “explain” is redundant.  
     - **Q5 → “Yes” (role-differentiated) + Q7 → “Relative standard”**: *Undefended*. No major theory combines these; role ethics usually uses absolute standards.  

  3. **Double Standards (Grading Perpetrators vs. Victims)**  
     - The tree **exposes this via Q3 (morality period-specific)**. If a student answers:  
       - “Yes” (morality changes) for perpetrators (e.g., Jefferson), but  
       - “No” (morality universal) for victims (enslaved people),  
       → The inconsistency is flagged at Q3.  

  ---

  ### Summary of Named Leaves  
  - **Structural view**: Institutions, not individuals, are blameworthy.  
  - **Strict historicism**: Moral world of the past is incommensurable with ours.  
  - **Culpable ignorance**: Critics existed → figure should have known better.  
  - **Moral fog**: Norms were too pervasive to resist.  
  - **Role-differentiated view**: Public figures face unique ethical trade-offs.  
  - **Straight presentism**: Apply today’s standards rigidly.  
  - **Relative-progress view**: Judge against contemporaries, not modern ideals.  

  This tree fits on one page, uses concrete cases to force distinctions, and isolates common logical pitfalls (e.g., double standards). Assign students to walk through it using a historical figure, then discuss their landing position.
