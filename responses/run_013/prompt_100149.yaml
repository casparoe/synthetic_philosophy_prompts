  They're clearly frustrated—this started as a TA-side debate but turned "heated," and they're now personally invested in proving principled ethics can work. The demand for five rigidly formatted items suggests they want surgical precision, not academic waffling. Underneath, I suspect they're also wrestling with their own dissertation's tension between algorithmic rules and contextual nuance.  

  For the principle, I'll build a Rossian framework: prima facie duties plus defeasibility conditions. Case (1) forces the "significant competing duty" clause; (2) anchors "frivolous" exceptions; (3)/(4) require the "reasonable consent" condition; (5) needs "capacity" limits; (6) demands "solemnity" weighting; (7) excludes self-promises; (8) and (9) distinguish deception types via "expectation" clauses. The "solemnity" term specifically rescues case (6) by honoring the dead friend's stake without requiring actual welfare impact.  

  Testing it against a new case: promising to dog-sit then skipping it for a protest march. The principle would permit breaking if the protest addresses grave injustice (competing duty) but forbid it for a trivial march—verifying the duty hierarchy. It stumbles on case (9) though; white lies feel permissible despite violating consent, exposing a tension in veracity norms.  

  I'll concede that case (9) remains thorny but argue the principle captures 8/9 cases—enough to reject particularism. Final verdict: principles exist but aren't algorithmic; they're defeasible guides requiring judgment. That bridges their fairness research (rules) and TA work (moral nuance). No gloating for their friends—this is a qualified win for principlism.
answer: |-
  1. **Principle:** Breaking a promise is permissible if and only if (a) keeping it would violate a significantly stronger competing moral duty, (b) the promisee would reasonably consent to release you if informed, or (c) you lack the capacity to fulfill it; promises to oneself lack binding force, and solemnity increases the strength of the duty.  
  2. **Forced Clauses:** (a) Cases (1) (parental duty > promise) and (2) (no stronger duty); (b) Cases (3) (consent given) and (4) (consent absent though reasonable); (c) Case (5) (incapacity); Case (7) forces exclusion of self-promises; Case (6) forces weighting by solemnity.  
  3. **New Case Application:** You promise to dog-sit, but skip it to join a vital protest against grave injustice. Prediction: Permissible (stronger duty to resist injustice outweighs promise, assuming protest is urgent and significant).  
  4. **Unaccommodated Verdict:** Case (9) (white lie) violates the principle (deception without consent or stronger duty) but your intuition is "fine-ish"; the principle condemns it due to lack of consent or overriding duty, missing the distinction in expectation/seriousness from (8).  
  5. **Big Question Verdict:** Principles exist and govern promise-keeping (this one systematizes 8/9 cases), but require defeasible structure and contextual judgment—particularism loses, but rigid generalism fails too; principles are pro-tanto guides, not algorithms.
