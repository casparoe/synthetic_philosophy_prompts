  ## Ordinance 201-B Revision Stalls Indefinitely as Adjudicator Rules on Validity of Adjudicator’s Authority Under Proposed Revision

  The monthly meeting of the Greendale Municipal Rule Committee dissolved into its now-customary state of suspended animation Tuesday evening, following Adjudicator Brenda Shipton’s preliminary ruling that her own authority to rule on the proposed revision to Ordinance 201-B—the rule governing how rules are changed—could not be confirmed until a final vote on Ordinance 201-B itself was held, rendering the entire amendment process temporarily inoperable. This marks the seventh consecutive session paralyzed by attempts to modify the foundational procedures of Greendale’s unique, Nomic-derived town charter.

  Since adopting the self-amending rule system two years ago—initially pitched as a "dynamic, participatory experiment in civic engagement"—Greendale has seen remarkable shifts in municipal law. The original victory condition (awarding 100 points via council dice roll) was swiftly repealed as "administrative deadweight." Zoning restrictions morphed weekly, briefly mandating all new construction be shaped like dodecahedrons. The immutable rule requiring obedience to all rules (Rule 101) underwent a fraught transmutation process, emerging slightly mutable but now requiring any challenge to it be submitted on lavender parchment. Yet, the core mechanism of change itself, Ordinance 201, remained untouched—until last fall.

  "Ordinance 201-B was proposed in good faith," insisted Councilor Aris Thorne, its primary sponsor, shuffling through three competing versions of the rulebook. "It simply sought to lower the vote threshold for transmuting immutable rules from ¾ to ⅔. Streamlining, really." The problem arose mid-vote. Rule 213, governing Adjudicator appointment, states the Adjudicator is "empowered by Ordinance 201 in its current form" to rule on move legality. Thorne’s proposed 201-B, however, would have altered the very rules under which Shipton was appointed and empowered. Did voting on 201-B occur under *current* 201, or *proposed* 201-B? Could Shipton rule on a move that, if successful, might retroactively invalidate the rule establishing her office?

  "Following the procedural chain," Shipton read from her notes Tuesday, her voice weary, "my authority to rule on the legality of the vote *on* 201-B stems from Rule 213, which explicitly references Ordinance 201. Proposed 201-B seeks to alter Ordinance 201. Until the status of Ordinance 201 is settled—either as original or amended—the validity of Rule 213, and thus my authority under it, is contingent. I cannot rule definitively on 201-B’s legality without potentially relying on an authority the successful passage of 201-B might nullify. We are... caught in a procedural eddy."

  Meanwhile, Deputy Clerk Elara Vance noted a quieter, strategic layer. "Mayor Gunderson voted against transmuting Rule 105 last month," Vance whispered, referencing the rule assigning points for successful proposals. "He’s currently leading by 43 points. Rule 105 is *immutable* right now. If 201-B passes, lowering the transmute threshold, someone *else* could more easily transmute 105 and change how points are awarded, threatening his lead. His faction has suddenly become very... strict constructionist regarding amendment procedures."

  The town’s practical governance has suffered. Pothole repairs require a successful proposal and a die roll exceeding 4. The noise ordinance was accidentally repealed during an attempted amendment to the amendment process for animal control statutes. The Clerk’s office spends most days painstakingly collating the current, official ruleset—a document that often changes between breakfast and lunch.

  "I just want to know if I can build a porch," lamented resident Hank Driscoll, holding zoning proposal 78-G. "But the rules for *submitting* the proposal form changed yesterday, and the rules for *changing* the submission rules are currently under adjudication because they might affect the adjudicator who... ah, forget it." He walked away, muttering about dice rolls and lavender parchment.

  The Committee has tentatively scheduled a subcommittee to propose rules for resolving self-referential authority paradoxes. The formation of that subcommittee, however, remains pending Adjudicator Shipton's ruling on the legality of forming such a body under the current, contested framework. The next meeting is tentatively scheduled for "when the rules clarify themselves, or possibly never."

  **Closing Note on Mechanics & Liberties:**

  *   **Self-Amendment Coherence:** The satire leans into the *practical vertigo and bureaucratic gridlock* of self-amendment rather than asserting logical incoherence. Peter Suber argues convincingly that self-amendment *is* logically coherent: a rule can authorize its own change under its own terms, and the change takes effect according to those prior terms. Greendale’s paralysis stems not from logic failing, but from *human actors struggling to apply procedures mid-change and uncertainty about which ruleset applies to a transitional action* (like voting on a rule-change).
  *   **The Key Paradox Exploited:** The central joke hinges on the *procedural state during amendment*. When voting on a new Rule 201-B under the *old* Rule 201, is the Adjudicator's authority (derived from the old Rule 201 via Rule 213) still valid *for that vote*? The satire assumes a contested reading where the *potential success* of 201-B casts doubt *mid-process* on the basis of the Adjudicator's power. Suber's logic would likely say the vote happens entirely under the old rule, and the Adjudicator's ruling is valid based on that old rule; the *new* rule only takes effect *after* successful passage. Greendale panics because they conflate the transition.
  *   **Liberties Taken:**
      *   **"Transmuted Before Touched":** The piece implies transmuting an immutable rule is a direct step before amending it. Strictly, transmutation *is* the amendment that changes its status from immutable to mutable. It's one move, not two. The satire blurs this slightly for narrative flow ("underwent a fraught transmutation process").
      *   **Entrenchment Tactic:** The point about the Mayor strategically opposing easier transmutation to protect his lead via an immutable rule is a valid Nomic tactic and realistic.
      *   **Adjudicator's Authority:** The core confusion about the Adjudicator's authority during the amendment of the rule empowering her is the main dramatic liberty, amplifying the practical confusion Suber acknowledges can arise, even if logically resolvable. It pushes the "who decides?" question to its breaking point within the fiction.
  *   **Verdict:** Your friend sees a profound jurisprudential question; you see a parlor trick. Suber demonstrates the parlor trick *works* logically. The profound question lies in the *practical execution and human interpretation* when the rules governing change are themselves in flux – the "who decides *right now*?" during transition. That's the load-bearing question the satire highlights, and it *is* defensible as deeply important in any real-world system attempting radical self-amendment. The piece sides with the *experience* of paradox without requiring the system to be logically impossible.
