  First, they want a clear mapping of sender, receiver, quality, and cost in the ordeal. The accused is the sender, God is the actual receiver, but the human audience (community, judges) is the proxy receiver. The quality is innocence/guilt, but it's a past act, not a trait. The cost is physical harm and ordeal suffering. The challenge here is that the cost isn't differentially borne based on innocence; both innocent and guilty face the same ordeal. That strains the model because typically, in signaling theory, costs differ by type.

  The user questions whether the shared belief in divine judgment makes the signal parasitic on that belief. That's a valid point. The signal's reliability depends entirely on the community's belief that God intervenes, not on the cost itself. So the handicap principle isn't the foundation here; it's the belief system that underpins it. When the Church withdrew, that belief was undermined, causing collapse. The cost didn't maintain honesty; the belief did.

  Then there's the issue of the priest controlling the outcome. If rigging was possible, the cost wasn't the deterrent; institutional credibility was. The 1215 prohibition removed that credibility, so the signal failed. Signaling theory doesn't explain the collapse; it was the loss of institutional support that did.

  Alternative explanations like dispute resolution or lotteries challenge the signaling model. If the ordeal was just a way to force settlements or shift responsibility, then it wasn't transmitting information about guilt. Signaling might be a misapplication here. 

  Ultimately, the case doesn't fit signaling theory well. The key factors were institutional credibility and shared beliefs. The user might be testing the limits of signaling theory, seeking where it applies versus where other frameworks are better. They likely want a honest assessment, not forcing the theory where it doesn't fit. So concluding that institutional factors were primary, not signaling, addresses their need for a careful, non-decorative analysis.
answer: |-
  Here's a careful mapping and reckoning using the handicap principle and signaling theory, focusing on analytical rigor rather than decorative analogy:

  ### 1. Signaling Framework Mapping (with Strains)
  *   **Sender:** The accused (undergoing the ordeal).
  *   **Receiver (Primary):** God (as the divine adjudicator).  
  *   **Receiver (Proxy):** The human community/judges (interpreting God's verdict).  
  *   **Quality/Fact Signaled:** Innocence or guilt regarding a specific past act (not an inherent "quality" like strength).  
  *   **Signal:** Willingness to undergo the ordeal *and* its physical outcome (unharmed vs. harmed).  
  *   **Cost:** Severe physical pain, risk of injury/death, psychological terror. Borne primarily by the accused.  
  *   **Honesty Mechanism (Theory):**  
      *   *Zahavi (Handicap Principle):* Only the truly innocent would rationally accept the ordeal, trusting God to protect them. The guilty, knowing God would not protect them, would avoid it (e.g., flee, confess). The cost deters false signals *ex ante*.  
      *   *Spence (Costly Signaling/Differential Cost):* The cost is differentially bearable. For the innocent, the ordeal is *less costly* psychologically (due to faith in divine protection) and physically (due to expected divine intervention). For the guilty, it's prohibitively costly (no protection expected).  

  **Key Strains in the Mapping:**
  *   **Cost Bearer vs. Receiver:** God (the primary receiver) bears *no cost*. The cost is borne entirely by the sender (accused). This inverts typical models where the signaler's cost deters deception *aimed at the receiver*. Here, the cost deters the accused from *attempting* the signal if guilty.
  *   **Fact vs. Quality:** Signaling a specific past act (guilt/innocence) is fundamentally different from signaling an inherent, stable quality (health, strength). The "quality" is binary, transient, and externally verifiable (in principle, unlike a peacock's health).
  *   **Ex Post Cost Realization:** The cost isn't just the *threat*; it's *actually inflicted* unless divine intervention occurs. The signal includes the *outcome* (wound/no wound, float/sink), not just the willingness.

  ### 2. The Cost Correlation Problem & the Belief Parasite
  *   **Problem:** The physical cost *is* identical for innocent and guilty during the ordeal. Divine intervention (making the cost *effectively* lower for the innocent) is required for differentiation. This intervention relies entirely on a **shared belief** in an active, intervening God who judges the ordeal.
  *   **Analysis:** This *is* fatal to a *purely material* handicap principle interpretation. The signal's reliability is **parasitic on the belief system**. The cost only functions as a signal *because* of the prior belief in God's adjudicative power and willingness to intervene. Without this belief:
      *   The ordeal is just torture/lottery with random outcomes.
      *   Rational innocent parties would *also* refuse the ordeal if they disbelieved divine intervention (eliminating the *ex ante* deterrent).
  *   **Amendment?** The theory *can* incorporate beliefs as part of the "type." An "Innocent/Believer" type genuinely expects lower costs (divine protection), while a "Guilty/Non-Believer" (or pragmatist) expects high costs. However, this still relies on the *receiver* (community) sharing the belief that God *will* perform this cost reduction for the innocent. **The core reliability is externally anchored in the belief system, not generated *by* the cost itself.**

  ### 3. Costly to Perform vs. Costly to Fake & Collapse
  *   **Costly to Perform:** Extremely high for *all* accused who undergo it.
  *   **Costly to Fake:** Very low *for the priest/institution*. Subtle manipulation of the blessing, bandage inspection, water temperature, or interpretation was possible. The *outcome* was cheaply faked by the human administrators.
  *   **Collapse Explanation:** The handicap principle focuses on the sender's cost preventing false signals. It **cannot explain the collapse** triggered by the Lateran prohibition. The prohibition removed the *institutional credibility* and *interpretive authority* (the priest's blessing/role), not the physical cost for the accused. This demonstrates:
      *   The signal's reliability depended critically on the *perceived objectivity and divine connection* of the officiating priest/church. When the church declared the ordeal invalid (no divine judgment involved), it destroyed the shared belief underpinning the signal.
      *   The vulnerability to cheap faking by the priest meant the signal's honesty relied on institutional integrity, not the ordeal's inherent cost structure.
      *   **Conclusion:** The collapse highlights that the *interpretive framework* (divine judgment mediated by the church) was the true source of (perceived) reliability, not the cost borne by the accused. Signaling theory, focused on sender costs, is inadequate here; institutional credibility and shared epistemology are primary.

  ### 4. Alternative Interpretations vs. Signaling
  *   **Dispute Termination / Responsibility Displacement:** If the ordeal's primary function was to end disputes authoritatively and absolve human judges of blame, this **directly conflicts** with a core signaling claim. Signaling posits the ordeal *reveals* hidden information (guilt/innocence). Termination/displacement suggests it *creates* a socially accepted outcome *regardless* of underlying truth. The cost serves as ritual suffering legitimizing the verdict, not as a truth-revealing signal.
  *   **Settlement Inducement / Lottery:** If the ordeal pressured parties into private settlement (to avoid the lottery), this also **undermines signaling**. The signal isn't transmitted; the *threat* of the ordeal (a potentially random outcome) is used as a bargaining tool. The cost deters proceeding to the ordeal itself, not deception *within* the ordeal.
  *   **Redescription Risk:** Applying signaling theory here risks being a *redescription*. It imposes a biological/economic framework ("signal," "cost," "honesty") onto a complex socio-religious-legal ritual whose participants understood it as invoking divine judgment, not sending a costly signal. If the alternatives better capture the *intended function* and *mechanism of collapse*, signaling may be an anachronistic overlay.

  ### 5. Verdict: Anomaly & Limits of Signaling Theory
  *   **Confirmation?** No. The core mechanisms of the handicap principle (cost deters low-quality signalers) or Spence signaling (differential cost enables separation) are not the primary drivers of reliability or collapse.
  *   **Anomaly:** Yes. It exposes key limitations:
      *   **Receiver Cost:** The primary receiver (God) bears no cost.
      *   **Belief Dependence:** Reliability is parasitic on a shared metaphysical belief, not generated by the cost.
      *   **Institutional Mediation:** Vulnerability to cheap faking and dependence on institutional credibility for interpretation.
      *   **Signaling Past Acts vs. Qualities:** Signaling a specific historical fact is fundamentally different.
  *   **Better Account:** **Institutional Credibility and Epistemic Authority.** The ordeal functioned because the community *believed* the church could facilitate divine judgment. Its reliability stemmed from this shared belief in the institution's special access to truth. The collapse occurred when the institution *withdrew its authority*, destroying the belief in the ordeal's divine connection and exposing it as a manipulable human ritual. Conventions of proof and the authority to define "truth" are central.
  *   **Saving the Case for Signaling?** A signaling theorist would need to:
      1.  **Reframe the Sender:** Treat the *Church* as the primary sender. The signal is the *administration of the ordeal* and its verdict. The cost is the *institutional risk* of losing credibility if verdicts appear unjust or if God "fails" to act. The quality signaled is the Church's divine authority/connection.
      2.  **Focus on Ex Ante Deterrence:** Emphasize the ordeal's cost as deterring *frivolous accusations* or encouraging *confession/compurgation* beforehand (the innocent might call the bluff, the guilty might confess). The ordeal itself is then the costly failure of these cheaper signals.
      3.  **Acknowledge the Belief Foundation:** Explicitly incorporate the shared belief system as the necessary substrate enabling the cost to function *as* a signal.

  **Conclusion:** The collapse of the judicial ordeal is **primarily an anomaly** for the handicap principle and costly signaling theory as frameworks for explaining the ordeal's *reliability and collapse*. While the ordeal involved high costs, these costs were not the independent engine of reliability. The theory strains at mapping the actors, the nature of the "quality" signaled, and the role of the divine receiver. The practice's reliability depended critically on **institutional credibility and shared belief in divine mediation**, not on differential costs deterring deceptive signaling by the accused. Its collapse was triggered by the **withdrawal of the authoritative interpreter** (the Church), destroying the shared belief framework. Signaling theory provides limited insight here; the core dynamics belong to institutional sociology, the history of epistemology, and the authority to define truth.
