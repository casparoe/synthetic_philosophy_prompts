prompt: |-
  I run measurement and reporting at a mid-size logistics company, about 900 people, and every quarter I have to sign off on the numbers that roughly twenty teams get judged on -- and since last year a chunk of their bonus is tied to. I've been burned twice already: we targeted 'cases closed per agent per day' and got a flood of three-line closes, and we targeted 'on-time delivery' and dispatch started moving the promised-delivery clock instead of moving the truck. So what I want is a procedure I can actually run before we adopt a metric as a target.

  Act as someone who knows the Goodhart's law literature properly but has also actually built scorecards inside a company -- not a theorist, not a consultant. Think step by step, and start by brainstorming the failure modes you'd expect in a firm like ours before you write anything down.

  Give me a checklist to run in order when a team proposes a new target metric. For each step: the question, what counts as a good enough answer, when the procedure stops and says no, and when it hands the decision to me or the COO because it's a value call and not a technical one. Sort each risk you turn up into the four standard kinds of Goodhart failure -- the one where the metric is a noisy proxy so optimising just selects the noise (regressional), the one where the proxy stops tracking the goal out in the tail (extremal), the one where pushing on the metric breaks the causal link back to the goal (causal), and the one where someone simply manipulates or misreports the number (adversarial) -- because i gather these need different defences and I want the checklist to say which defence goes with which.

  I also want you to use four things I've started tracking in a spreadsheet, and say where each one earns its keep and where it turns out to be useless: (1) gaming surface -- how many independent cheap moves exist that raise the number without moving the thing I actually care about; (2) detection lag -- how long before the real goal visibly diverges from the metric; (3) reversibility -- whether the damage undoes itself once we drop the metric; (4) who holds the pen -- whether the people being scored also get to record the number.

  Constraints: I have maybe two hours per metric and no stats team, we can't run experiments on most of these, and anything we adopt has to be explainable to a warehouse supervisor in one paragraph.

  Then run the finished procedure on three live proposals: 'cases closed per agent per day', with the bonus attached at the individual level; 'cut 30-day re-shipments by 10%' for the returns team; and 'increase the share of A/B tests that beat baseline' for the data team. One of the three should come out with an answer I won't like. Then tell me honestly which steps are judgment dressed up as procedure, and what this procedure can't do at all. No citations or reading lists please, I can't check them.
reasoning: |-
  We are going to create a checklist that addresses the four types of Goodhart failures: regressional, extremal, causal, and adversarial. We'll also incorporate the four additional factors: gaming surface, detection lag, reversibility, and who holds the pen.

  The checklist steps:

  1. **Define the Real Goal**: What is the ultimate outcome we care about? 
     - Good answer: Clear, non-metric description of the desired outcome (e.g., "reduce customer complaints about late deliveries").
     - Stop if: The team cannot articulate a real goal beyond the metric itself.
     - Escalate if: The goal is multi-faceted and requires trade-offs (e.g., speed vs. quality).

  2. **Check for Regressional Goodhart (Noise)**: Is the metric a noisy proxy for the real goal?
     - Question: How well does the metric correlate with the real goal in normal conditions? Are there common factors that cause the metric to move independently of the goal?
     - Good answer: The metric has a strong historical correlation with the goal, and we've controlled for known confounders.
     - Stop if: The metric is known to be weakly correlated or easily swayed by irrelevant factors.
     - Defense: Use multiple metrics to reduce noise (if possible) or adjust for known confounders.

  3. **Check for Extremal Goodhart (Non-linearity)**: Does the relationship between the metric and the goal break down at high or low values?
     - Question: At extreme values (e.g., when we push the metric very high), does the metric still track the real goal?
     - Good answer: Evidence (even anecdotal) that the relationship holds across the expected range of performance. If not, we set guardrails (e.g., don't let the metric go beyond a certain point without review).
     - Stop if: There is reason to believe that pushing the metric beyond a certain point actually harms the goal (e.g., closing cases too fast leads to poor quality).
     - Escalate if: We need to set boundaries but it's unclear where.

  4. **Check for Causal Goodhart (Breaking the Link)**: Could pushing on this metric break the causal link to the goal?
     - Question: Are there ways that agents can improve the metric by actions that don't contribute to (or even harm) the real goal?
     - Good answer: The team has considered and mitigated such actions (e.g., by having quality checks that prevent them).
     - Stop if: The most obvious ways to improve the metric are by actions that harm the goal (e.g., moving the delivery clock instead of the truck).
     - Defense: Pair the metric with a counterbalance (e.g., if you measure speed, also measure quality).

  5. **Check for Adversarial Goodhart (Gaming)**: How easy is it to manipulate the metric without affecting the goal?
     - Question: How many cheap moves exist to game the metric? Consider who holds the pen and how hard it is to verify.
     - Good answer: Few gaming opportunities, independent verification, and high detection lag is short (so we catch gaming quickly).
     - Stop if: The gaming surface is high and we cannot verify the data independently.
     - Defense: Independent audits, automated monitoring for anomalies, and penalties for gaming.

  Now, incorporate the four factors:

  - **Gaming surface**: This is directly tied to adversarial Goodhart. We want a low gaming surface. We can quantify it by listing known gaming moves and estimating how cheap they are. If the gaming surface is high, we need strong controls (like independent verification) or we reject the metric.
  - **Detection lag**: How long before we notice the real goal diverging? Short lag is good. If the lag is long, we need leading indicators or frequent audits. This affects all Goodhart types but especially adversarial and causal.
  - **Reversibility**: If we stop using the metric, does the damage undo itself? For example, if agents start closing cases poorly, will they stop when the incentive is removed? If not, we might cause long-term harm (e.g., customer trust). This is a general risk factor that might cause us to avoid the metric if reversibility is low.
  - **Who holds the pen**: If the person being measured also records the data, adversarial risk is high. We must have independent verification or strong audits.

  Checklist Steps with the Four Factors:

  1. **Define the Real Goal** (as above)
  2. **Assess Gaming Surface** (for Adversarial):
     - Question: List 3-5 ways someone could game this metric without helping the real goal. How easy are they? (Cheap = low cost, hard to detect)
     - Good answer: Few or no cheap moves. If moves exist, we have plans to block them (e.g., by changing definitions, adding controls).
     - Stop if: More than one cheap move exists and we cannot mitigate.
     - Factor: Gaming surface (high = bad). Also, who holds the pen? If the agent records the number and gaming surface is high, it's a red flag.

  3. **Check Detection Lag** (General):
     - Question: How long would it take for a drop in the real goal (due to gaming or misalignment) to become visible? 
     - Good answer: Short (e.g., within one reporting cycle). If long, we need a leading indicator or audit.
     - Stop if: The lag is long (e.g., months) and we have no way to monitor the real goal in the interim.
     - Factor: Detection lag (long = bad). This affects our ability to catch all Goodhart failures.

  4. **Check Reversibility** (General):
     - Question: If we stop the metric and the incentive, will the system revert to normal without lasting damage? 
     - Good answer: Yes, or the damage is minimal and repairable.
     - Stop if: The damage is irreversible (e.g., loss of key customers, regulatory fines). 
     - Factor: Reversibility (low = bad). This is a risk factor that might lead to rejection.

  5. **Check for Regressional Goodhart** (as above)
  6. **Check for Extremal Goodhart** (as above)
  7. **Check for Causal Goodhart** (as above)
  8. **Check for Adversarial Goodhart** (as above, but note we already did gaming surface and who holds the pen)

  We can integrate the four factors into the existing Goodhart checks. However, to avoid repetition, we'll structure the checklist as:

  **Full Checklist**:

  1. **Define the Real Goal**
     - ... (as above)

  2. **Gaming Surface and Adversarial Risk**
     - Question: How many independent cheap moves exist to game the metric? (List them) Who records the metric? How will we verify?
     - Good answer: Low gaming surface (0-1 cheap moves) OR independent verification in place. If the agent records the number, then we must have an audit.
     - Stop if: High gaming surface without independent verification.
     - Factor: Gaming surface, who holds the pen.

  3. **Detection Lag and Monitoring Plan**
     - Question: How long before we'd notice the real goal diverging? What's our plan to monitor the real goal and the metric?
     - Good answer: Lag is short (days/weeks) OR we have a monitoring plan with frequent checks of the real goal.
     - Stop if: Lag is long and we have no monitoring plan.
     - Factor: Detection lag.

  4. **Reversibility**
     - Question: If we stop the metric, will the damage (if any) reverse?
     - Good answer: Yes, or the potential damage is acceptable.
     - Stop if: Potential damage is irreversible and severe.
     - Factor: Reversibility.

  5. **Regressional Goodhart (Noise)**
     - ... (as above)

  6. **Extremal Goodhart (Non-linearity)**
     - ... (as above)

  7. **Causal Goodhart (Breaking the Link)**
     - ... (as above)

  8. **Adversarial Goodhart (Gaming) - Additional Controls**
     - Question: Beyond what we covered in step 2, are there other gaming risks? How will we detect and punish gaming?
     - Good answer: We have automated checks for common gaming patterns and a clear consequence.
     - Stop if: We can't detect or deter gaming.

  9. **Overall Viability**
     - Question: Considering all the above, is this metric safe enough to use as a target?
     - Good answer: Risks are low or mitigated.
     - Escalate to you or COO: When there is a trade-off between the metric's benefits and risks, or when the mitigation plan requires resources (e.g., adding audits).

  Now, let's run the three examples:

  **Example 1: 'cases closed per agent per day' (individual bonus)**

  1. **Real Goal**: Reduce customer wait time and backlog, while maintaining quality.
  2. **Gaming Surface**: High. Cheap moves: closing cases prematurely, marking complex cases as simple, reopening cases later (if not tracked). Who holds the pen? The agent. Without independent verification, high risk.
  3. **Detection Lag**: Moderate. Quality issues might take a week to show in customer complaints.
  4. **Reversibility**: High. If we stop, agents might stop gaming, but customer trust might be damaged temporarily.
  5. **Regressional**: Moderate noise. Some agents might have harder cases, but we don't adjust for case complexity.
  6. **Extremal**: High risk. Pushing too hard leads to poor quality and more rework.
  7. **Causal**: High risk. Agents can close cases without solving them, breaking the link to customer satisfaction.
  8. **Adversarial Controls**: We could add a quality audit, but that costs time.

  Verdict: Stop. High gaming surface, causal risk, and adversarial risk without strong controls. We already got burned by this.

  **Example 2: 'cut 30-day re-shipments by 10%' for returns team**

  1. **Real Goal**: Reduce costs from returns and improve customer experience by sending the right item the first time.
  2. **Gaming Surface**: Moderate. Cheap moves: discourage returns (e.g., by making returns harder), or reclassify returns as something else. Who holds the pen? The returns team might record the reason for return, so risk exists.
  3. **Detection Lag**: Short. If customers are discouraged from returns, complaints might rise quickly.
  4. **Reversibility**: High. If we stop, returns process returns to normal.
  5. **Regressional**: Low noise. Re-shipments are a direct cost, so cutting them should reduce costs. But we must ensure we aren't just shifting the cost (e.g., to customer service handling complaints).
  6. **Extremal**: Moderate. Cutting re-shipments too much might lead to customer frustration if legitimate returns are denied.
  7. **Causal**: Moderate. The team might cut re-shipments by refusing valid returns, which harms customer experience.
  8. **Adversarial Controls**: We can monitor customer complaints about returns and audit return reasons.

  Overall: Proceed with caution. We need to pair this with a customer satisfaction metric (e.g., returns satisfaction score) to avoid harming the goal. Escalate to you/COO: because we have to decide if the cost savings are worth the potential customer experience trade-off.

  **Example 3: 'increase the share of A/B tests that beat baseline' for the data team**

  1. **Real Goal**: Improve the quality of experiments and the impact of product changes.
  2. **Gaming Surface**: High. Cheap moves: run tests on easy wins (low impact), stop tests early, cherry-pick metrics, or set a low bar for "beat". Who holds the pen? The data team runs and reports the tests.
  3. **Detection Lag**: Long. It might take months to see that the winning tests aren't leading to business impact.
  4. **Reversibility**: Moderate. If we stop, they might stop gaming, but we might have launched ineffective features.
  5. **Regressional**: High noise. The metric doesn't capture the business impact of the tests. A test might beat baseline by a tiny margin but be worthless.
  6. **Extremal**: High risk. Pushing the share to 100% might lead to not running any risky tests (which are often the most valuable).
  7. **Causal**: High risk. The team can optimize for statistical significance on trivial metrics instead of real impact.
  8. **Adversarial Controls**: We could require a minimum effect size and track the actual business impact of launched features.

  Verdict: Stop. The gaming surface is high, detection lag is long, and the causal link to the real goal is weak. We need a better metric (e.g., average impact per test, or number of high-impact tests).

  **Which one won't you like?** The third one (A/B tests) comes out as a clear "stop", which you might not like because it's a common metric.

  **Honest Assessment of the Procedure**:

  - Steps that are judgment calls: 
     - Defining the "real goal" (step 1) is often subjective.
     - Assessing gaming surface (step 2) requires imagining bad behavior, which is speculative.
     - Reversibility (step 4) is a judgment about future states.
     - In extremal Goodhart (step 6), we don't have data for the tails, so it's a judgment call.

  - What the procedure can't do:
     - It can't predict all unintended consequences (only the ones we imagine).
     - It can't quantify the risks, only qualify them.
     - It can't create a good metric if the team proposes a bad one; it only screens out bad ones.
     - Without experiments, we rely on historical data and logic, which might miss context.

  Despite these limitations, the checklist forces us to think systematically about the risks and might catch the most egregious problems.
answer: |-
  ### Goodhart's Law Defense Checklist for Target Metrics  
  Here’s a step-by-step procedure to vet new target metrics, designed for your constraints (2 hours/metric, no stats team, supervisor-friendly). It focuses on the four Goodhart failure types and integrates your four tracking factors. **Fail any red-flag step? Kill the metric. Borderline? Escalate to you/COO for value judgments.**  

  #### Checklist Steps  
  1. **Pinpoint the real goal**  
     - **Question:** "What’s the actual business outcome we care about? Describe it without using metrics."  
     - **Good enough:** Concrete, non-metric description (e.g., "Reduce customer frustration from delayed shipments" vs. "Improve on-time delivery").  
     - **Stop if:** The goal is vague or conflated with the metric itself.  
     - **Escalate if:** The goal involves trade-offs (e.g., speed vs. quality) that need executive input.  
     - **Goodhart type:** Foundational (applies to all failures).  

  2. **Assess gaming surface + who holds the pen**  
     - **Question:** "List 3–5 cheap, real-world ways to boost this metric without helping the goal. Who records the data?"  
     - **Good enough:** ≤1 cheap gaming tactic identified, AND the metric recorder is independent (e.g., system-generated or audited by a neutral party).  
     - **Stop if:** High gaming surface (≥3 tactics) AND recorder is the person/team being measured.  
     - **Escalate if:** Gaming surface is moderate (2 tactics) but requires costly controls (e.g., new audits).  
     - **Goodhart type:** Primarily **adversarial** (tactics like misreporting).  
     - **Your factor’s role:** "Gaming surface" quantifies adversarial risk; "who holds the pen" amplifies it. Useless for other failure types.  

  3. **Test for causal breakage**  
     - **Question:** "Can you improve the metric by doing something that *harms* the real goal? Give examples."  
     - **Good enough:** No realistic "harmful shortcuts" exist, OR mitigation is baked in (e.g., pairing with a counter-metric like "customer satisfaction").  
     - **Stop if:** Obvious harmful shortcuts exist with no viable mitigation.  
     - **Escalate if:** Shortcuts exist but trade-offs are acceptable (e.g., short-term cost for long-term gain).  
     - **Goodhart type:** **Causal** (metric and goal become decoupled).  
     - **Your factor’s role:** "Detection lag" warns how quickly harm appears. Short lag (<1 week) helps catch breaks early; long lag (>1 month) makes this risk severe. Reversibility irrelevant here.  

  4. **Check for noise (regressional risk)**  
     - **Question:** "What unrelated factors could push this metric up/down? Show historical data if available."  
     - **Good enough:** Metric correlates tightly with goal in past data (e.g., when on-time delivery rose, customer complaints fell). Limited noise from external factors (e.g., weather).  
     - **Stop if:** High noise (e.g., metric jumps due to uncontrollable events like supply-chain disruptions).  
     - **Escalate if:** Noise is manageable but requires adjustments (e.g., seasonal baselines).  
     - **Goodhart type:** **Regressional** (optimizing noise, not signal).  
     - **Your factor’s role:** "Detection lag" is critical—long lag means noise isn’t caught quickly. Gaming surface useless here.  

  5. **Stress-test extremes**  
     - **Question:** "If we push this metric to the 90th percentile, does it still help the goal? What breaks?"  
     - **Good enough:** Metric remains correlated with goal at high levels (e.g., "delivery speed" doesn’t cause more damaged goods).  
     - **Stop if:** Metric becomes counterproductive at high performance (e.g., maximizing "cases closed" sacrifices quality).  
     - **Escalate if:** Extremes are rare but catastrophic (e.g., regulatory fines).  
     - **Goodhart type:** **Extremal** (metric fails at tails).  
     - **Your factor’s role:** "Reversibility" matters—if damage is irreversible (e.g., lost customers), risk is unacceptable. Detection lag warns how fast extremes cause harm.  

  6. **Final viability check**  
     - **Question:** "Can we explain this metric’s link to the goal to a warehouse supervisor in one paragraph?"  
     - **Good enough:** Simple cause-effect story (e.g., "Faster repairs → happier customers").  
     - **Stop if:** Explanation requires jargon or caveats.  
     - **Escalate if:** Metric is complex but necessary (e.g., regulatory compliance).  
     - **Goodhart type:** Holistic (all failures).  

  ---

  ### Live Application to Your Proposals  
  **Key:**  
  - ✅ = Passes step  
  - ⚠️ = Borderline (escalate)  
  - ❌ = Fails step (reject)  

  #### 1. **"Cases closed per agent per day" (individual bonus)**  
     - **Step 1 (Real goal):** Reduce customer resolution time. ✅  
     - **Step 2 (Gaming surface + pen holder):** High risk. Cheap moves: Close cases prematurely, mark complex cases as "simple," reopen cases later. Agents self-report. ❌ **STOP.**  
       - *Goodhart type: Adversarial.*  
     - *Why it fails:* Gaming surface is high (3+ tactics), and agents hold the pen. Detection lag short (complaints rise in days), but reversibility low (lost trust). **No need to proceed—fatal flaw.**  

  #### 2. **"Cut 30-day re-shipments by 10%" (returns team)**  
     - **Step 1 (Real goal):** Reduce costs from replacement shipments. ✅  
     - **Step 2 (Gaming surface + pen holder):** Moderate risk. Cheap moves: Deny valid returns, pressure customers to keep items. Team records re-shipments. ⚠️  
     - **Step 3 (Causal breakage):** High risk. Cutting re-shipments by denying returns harms customer loyalty. ❌ **STOP.**  
       - *Goodhart type: Causal.*  
     - *Why it fails:* Harmful shortcut exists (denying returns), and mitigation (e.g., pairing with NPS) isn’t baked in. Detection lag medium (2–4 weeks for complaints), reversibility low (churned customers).  

  #### 3. **"Increase share of A/B tests that beat baseline" (data team)**  
     - **Step 1 (Real goal):** Drive product improvements that increase revenue. ✅  
     - **Step 2 (Gaming surface + pen holder):** High risk. Cheap moves: Run tests on low-impact features, lower "beat" threshold, stop tests early. Data team self-reports. ⚠️  
     - **Step 3 (Causal breakage):** Moderate. Gaming could inflate wins but ignore business impact. ✅ with mitigation (require minimum effect size).  
     - **Step 4 (Noise):** High risk. Metric noisy—beating baseline doesn’t guarantee revenue impact (e.g., +0.1% significance on useless feature). ❌ **STOP.**  
       - *Goodhart type: Regressional.*  
     - *Why it fails:* High noise with no historical correlation to revenue. Detection lag long (months), reversibility high (easy to undo tests), but irreparable if bad features launch. **You won’t like this—it’s common but flawed.**  

  ---

  ### Honest Assessment of the Procedure  
  **What’s judgment dressed as procedure?**  
  - Step 3 (causal breakage) and Step 5 (extremes) rely on hypotheticals ("What if someone does X?"). Requires guessing human behavior.  
  - Step 2 (gaming surface) assumes you can brainstorm all tactics—real-world ingenuity often outruns this.  
  - Escalation points are value calls (e.g., "Is this trade-off acceptable?").  

  **What the procedure can’t do:**  
  - **Predict unknown unknowns:** It won’t catch every creative gaming tactic.  
  - **Fix bad metrics:** Only screens them—doesn’t design better ones.  
  - **Replace experiments:** Without A/B testing, you’re relying on logic and history, not proof.  
  - **Handle multi-goal conflicts:** E.g., if a metric helps cost but hurts quality, the COO must decide.  

  **Final note:** This won’t prevent all fires, but it forces teams to confront Goodhart risks upfront. For the proposals above, only "A/B test wins" might survive with mitigations (e.g., add a revenue-impact safeguard), but it’s the weakest—reject it and demand a better metric.
