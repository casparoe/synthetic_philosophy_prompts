answer: |-
  Here’s a comprehensive exam question, model answer, and marking scheme designed to meet your specifications. The question forces students to engage with the conceptual tension in your ratchet case while demanding precision on optionality and supererogation.

  ---

  **FINAL EXAM QUESTION: Supererogation and the Ratchet Effect (50 Minutes Total)**

  **Background:**  
  Standard accounts of supererogation define a supererogatory act as one that is:  
  (a) Morally good/praiseworthy,  
  (b) Not morally required (i.e., optional), and  
  (c) Goes "beyond the call of duty."  

  Consider the following case:  
  > **Nadia’s Commitment:** Nadia can voluntarily sign up as the sole on-call medical responder for a remote clinic. Signing up is optional; no one pressures her, and it costs her significant money and every other weekend. Initially, this seems supererogatory. However, once she signs up, she becomes the only person with access to critical drugs, and 40 patients depend entirely on her availability. If she quits after 6 months, she would violate serious obligations to these patients. Signing up *converts* her future commitments—continuing is now obligatory.  

  **Definitions:**  
  - An act is **narrowly optional** if, *at the time of choice*, you may do it or not do it *on that specific occasion* without violating a duty *at that time*.  
  - An act is **widely optional** if, whichever choice you make (do it or not), your *overall set of moral obligations before and after the act* remains unchanged.  
  - An act is **self-escalating** if doing it once makes continuing or repeating it *obligatory for the same agent in the future*. (Example: Becoming someone’s emergency contact or starting to feed feral cats daily).  
  - An act is **one-shot** if it does not alter the agent’s future obligations.  

  **Devlin’s Thesis:** "An act cannot be supererogatory unless it is widely optional."  

  ---

  **Your Tasks:**  
  1. **Analysis (8 pts):** Can a self-escalating act (like Nadia’s) be supererogatory? Defend your answer using the concepts of narrow and wide optionality.  
  2. **Definitional Implications (8 pts):** If your answer to (1) challenges Devlin’s thesis, how should the standard definition of supererogation be revised? If it supports Devlin, explain why the definition needs no revision. Address what "required" means in this context.  
  3. **Praiseworthiness (4 pts):** Should we praise Nadia *more*, *less*, or *the same* as a "one-shot hero" who performs an equally costly/good act (e.g., rescuing 40 patients in a single event) but faces no future obligations? Justify briefly.  

  ---

  **MODEL ANSWER (650 words)**  

  **1. Self-Escalating Acts Can Be Supererogatory**  
  A self-escalating act *can* be supererogatory, and Devlin’s thesis is mistaken. Supererogation requires only that the act is *narrowly* optional at the time of performance, not widely optional. When Nadia initially signs up for the clinic, her act satisfies all standard criteria for supererogation: (a) It is morally good (saving lives), (b) It is not required *at that moment* (no prior duty compelled her), and (c) It imposes significant sacrifice (money, time). Crucially, the *future* obligations created by her choice do not retroactively negate the initial act’s optionality. Narrow optionality concerns only the *present* choice context: Nadia faces no blame for refusing to sign up. Wide optionality, however, demands no downstream duty changes—a requirement not found in classic definitions (e.g., Urmson, Heyd). Since supererogation evaluates acts *as performed*, not their future consequences for the agent’s duty profile, Nadia’s signing up is supererogatory despite its self-escalating nature. Devlin conflates the *initial act* with the *resulting role*.  

  **2. Patching the Standard Definition**  
  The standard definition needs refinement to explicitly reject Devlin’s wide-optionality requirement. We should amend it as follows:  
  > *A supererogatory act is one that (a) is morally good, (b) is not morally required **at the time of its performance**, and (c) involves significant sacrifice or risk.*  

  The critical revision clarifies that "required" refers *only* to obligation *at the moment of choice* (narrow optionality). This blocks Devlin’s move because self-escalating acts are not required *when initiated*—even if they generate future duties. Without this temporal specificity, the definition becomes vulnerable to "duty creep," where any act that *could* create future obligations (e.g., having children) is vacuously excluded from supererogation. This is counterintuitive and collapses the category. We routinely praise people for *starting* morally transformative projects (founding charities, adopting children) precisely because the *initial* act was optional and costly. The revised definition preserves these intuitions while acknowledging that Nadia’s *later* obligation to continue does not retroactively erase the supererogatory status of her *first* commitment.  

  **3. Praiseworthiness: Nadia vs. One-Shot Hero**  
  Nadia deserves **equal praise** to the one-shot hero. Praise for supererogation should track the *initial* sacrifice and moral courage displayed *at the time of action*. The one-shot hero’s act is costlier in immediate terms (e.g., diving into a burning building once), while Nadia’s initial signing up is less extreme but triggers ongoing burdens. However, supererogation focuses on the *choice to exceed minimal duty* when refusal was permissible. Both agents performed identically in this regard: each voluntarily accepted a significant cost for the greater good when they could have walked away blamelessly. To praise Nadia *less* would penalize her for the *consequences* of her virtue (i.e., being "trapped" by duty), which confuses the act’s moral worth with its downstream constraints. Conversely, praising her *more* risks fetishizing protracted suffering over decisive action. The core moral value lies in the optional, costly, benevolent choice itself—equally present in both cases.  

  ---

  **MARKING SCHEME (Total: 20 pts)**  
  **A (18–20):** Rejects Devlin, revises definition with precision, defends equal praise with conceptual clarity.  
  **B (16–17):** Correct conclusion but minor gaps in argumentation or definitional repair.  
  **C (14–15):** Superficial treatment; repeats "drowning child" logic or misapplies optionality.  

  **Task 1: Analysis (8 pts)**  
  - **✓ (3 pts) Rejects Devlin & defends narrow optionality:** Explicitly states self-escalating acts *can* be supererogatory by separating initial optionality from future duties.  
    *Common error (0 pts): Assumes future obligations negate initial optionality.*  
  - **✓ (3 pts) Applies ratchet case correctly:** Uses Nadia to show narrow optionality holds at t1 despite duties at t2.  
    *Common error (0 pts): Claims signing up is "not optional" because quitting later is wrong.*  
  - **✓ (2 pts) Contrasts narrow/wide optionality:** Distinguishes between permissibility at t1 (narrow) vs. unchanged duty profile (wide).  
    *Common error (0 pts): Treats "optional" as monolithic.*  

  **Task 2: Definitional Repair (8 pts)**  
  - **✓ (3 pts) Revises "required" to mean "at time of act":** Amends definition to specify temporal scope.  
    *Common error (0 pts): Leaves definition ambiguous, allowing Devlin’s reading.*  
  - **✓ (3 pts) Explains why revision is necessary:** Argues without temporal precision, supererogation collapses (e.g., parenting, careers excluded).  
    *Common error (0 pts): Says definition is "fine as is" or proposes irrelevant changes.*  
  - **✓ (2 pts) Addresses "duty creep":** Notes that wide optionality would implausibly expand "required" acts.  
    *Common error (0 pts): Ignores implications for non-ratchet cases.*  

  **Task 3: Praiseworthiness (4 pts)**  
  - **✓ (2 pts) Advocates equal praise:** Bases judgment on initial sacrifice/choice, not cumulative costs.  
    *Common error (0 pts): Praises one-shot hero more because "no strings attached."*  
  - **✓ (2 pts) Separates act-assessment from agent-assessment:** Praises the *signing up* (supererogatory) separately from *continuing* (obligatory).  
    *Common error (0 pts): Conflates Nadia’s ongoing role with her initial act.*  

  ---

  **Why this works:**  
  - **Forces engagement:** Students can’t regurgitate "saints and heroes" tropes; they must dissect optionality.  
  - **Time-efficient:** Clear subtasks prevent tangents. A prepared student can outline answers in 5 mins and write for 45.  
  - **Tests precision:** Top answers must spot temporal ambiguity in "required" and decouple act/agent evaluation.  
  - **Real-world relevance:** Validates your insight that most praised acts (caregiving, activism) involve ratchets.  

  This question rewards students who see that ethics isn’t about frozen "types" of acts, but about how choices transform agency over time. Good luck with the printing!
