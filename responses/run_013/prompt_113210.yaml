  We are discussing a method of iterative removal of dominated strategies, which is a common technique in game theory. The two claims you've been told are related to the concept of dominated strategies and the iterative deletion process.

  First, let's break down the two claims:

  1. **Claim 1**: You may sometimes discard an action because it is inferior to a mixture of the other actions (a mixed strategy) even when no single other action is better. This is the idea of a strategy being strictly dominated by a mixed strategy.

  2. **Claim 2**: The order in which you discard options does not matter, and after discarding all discardable options, you are left with exactly the actions that a rational, well-informed party could defend (i.e., the rationalizable strategies).

  Now, let's assess and build upon these claims.

  ### Implications of the Pruning Method

  The method you are using is known as **Iterative Deletion of Strictly Dominated Strategies (IDSDS)**. When considering mixed strategies, we sometimes refer to the iterative deletion of strategies that are strictly dominated by a mixed strategy. This process leads to the set of **rationalizable strategies**.

  #### What it licenses you to eliminate
  - You can eliminate any pure strategy that is strictly dominated by another pure strategy or by a mixed strategy. 
    - A strategy `s_i` for player `i` is strictly dominated if there exists another strategy (pure or mixed) `σ_i` such that for every possible combination of strategies of the other players, the payoff from `σ_i` is strictly greater than the payoff from `s_i`.
  - The elimination of a strategy that is strictly dominated by a mixed strategy is particularly important because sometimes a strategy is not dominated by any single pure strategy but is dominated by a mixture.

  #### What it does not eliminate
  - Strategies that are not strictly dominated. This includes:
    - Weakly dominated strategies: a strategy `s_i` is weakly dominated if there exists another strategy `σ_i` that yields at least as good a payoff for all opponent strategy profiles and strictly better for at least one. Weakly dominated strategies are not necessarily eliminated by this process (unless we use a different procedure, such as iterative weak dominance, which is more problematic).
    - Strategies that are part of a Nash equilibrium: but note that the set of rationalizable strategies includes all Nash equilibria and possibly more.

