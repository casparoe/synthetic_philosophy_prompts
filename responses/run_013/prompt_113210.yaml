  ### What the Surviving Set Tells You

  - **What it can tell you**: The surviving set (rationalizable strategies) includes every strategy that might be played by a rational player who believes others are rational and so on. Therefore, any strategy that is not rationalizable can be safely eliminated because no rational player would play it under the common knowledge assumptions.

