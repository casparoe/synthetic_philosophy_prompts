  - If Player 2 plays Left: Middle gives 1, Top gives 0, Bottom gives 3 -> Middle is not best.
  - If Player 2 plays Right: Middle gives 1, Top gives 4, Bottom gives 0 -> Middle is not best.

  But is Middle dominated? Let's check by a mixed strategy. Suppose Player 1 plays a mixed strategy that assigns probability p to Top and (1-p) to Bottom. Then the expected payoff against Left is: p*0 + (1-p)*3 = 3-3p. Against Right: p*4 + (1-p)*0 = 4p.

  We want this mixture to be better than Middle (which gives 1 in both cases) for both of Player 2's moves. So we require:
  - Against Left: 3-3p > 1  => 3p < 2 => p < 2/3.
  - Against Right: 4p > 1 => p > 1/4.

