  **Claim 2**: This claim is partially correct but requires qualification. 
  - **Order Independence**: The iterative deletion of strictly dominated strategies (by pure or mixed) is order-independent in the sense that the final set does not depend on the order of deletion. This is a known result in game theory for strict dominance. However, note that if we consider weak dominance, order can matter. But the problem states we are using strict dominance (by the mixture condition) so order independence holds.
  - **What remains?**: The set of strategies that survive iterative deletion of strictly dominated strategies is the set of rationalizable strategies. This set is the maximal set for which every strategy in it is a best response to some belief about the opponents' strategies (where the belief is a probability distribution over the opponents' strategies that are also in the rationalizable set).

  However, note that the claim says "exactly the actions a rational, well-informed party could defend." This is the definition of rationalizable strategies. So that part is correct.

  But note: rationalizability does not require common knowledge of rationality? Actually, it does. The iterative deletion process corresponds to common knowledge of rationality (and the structure of the game). 

