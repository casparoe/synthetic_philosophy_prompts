  ## Commemorative Address: The Weight We Carry, the Mirrors We Hold

  [Stand tall, take a breath, make eye contact across the crowd]

  Friends, neighbors, descendants of resilience, colleagues… we gather in this open air, beneath this shared sky, to remember an ending. Not a neat ending. Not a simple one. But an ending that changed the world: the abolition of the transatlantic slave trade.

  The committee’s kind invitation suggested, as these invitations often do, that this victory was a testament to the power of moral argument alone – that good words finally swayed hard hearts against entrenched interests. It’s a comforting story. A story that flatters our belief in reason, in progress. And while the courage of abolitionists *screaming* moral truths into the void was vital, absolute… I wonder if that story carries the full, terrible, complex weight of how such a monstrous thing actually *dies*.

  Because deeply rooted evils rarely vanish by logic alone. They die in different ways. And understanding *how* they die… perhaps that helps us understand the work that remains.

  **[Shift tone slightly, more reflective]**

  Consider, for a moment, another practice that once seemed immovable, woven into the fabric of honor: dueling. Two gentlemen, pistols at dawn. For centuries, it was how disputes of reputation were settled among Europe’s elite. Arguments *against* dueling were plentiful – sermons preached its sin, doctors lamented the waste of life, kings outlawed it. But what finally killed it?

  It died when it became… *laughable*. When the peers of those gentlemen – the people whose opinion *truly* mattered to them – began to see it not as bravery, but as absurdity. As childish posturing. To step onto that field meant risking not just your life, but your *standing*. The cold sneer of society became a heavier burden than the hot lead of a bullet. The change came from the *outside in* – a shift in what the crowd deemed honorable.

  **[Pause, let the image settle]**

  Now… hold that image. And look at the slave trade.

  The arguments against it were ancient, powerful, and morally unassailable. Voices like Clarkson, Wilberforce, Equiano, the countless enslaved themselves crying out – they laid bare the horrific, undeniable truth. They *were* heard. Their words struck nerves.

  But consider the slaveholder. Or the merchant. Or the politician whose power rested on that brutal system. What finally reached *them*? Beyond the economic shifts scholars like Eric Williams documented – shifts that quietly loosened the trade's grip on the nation's purse – what cracked the shell of indifference?

  I suspect it wasn't *only* the fear of being seen as dishonorable by others – though Kwame Anthony Appiah rightly shows how powerful that force of "honor" can be. I wonder if something deeper, more unsettling, began to happen.

  **[Lean in slightly, quieter intensity]**

  Imagine a British merchant, perhaps sitting in his comfortable London study. He reads the latest abolitionist pamphlet. He hears the sermon. He *knows* the arguments. But he also knows himself as a Christian. As a man of reason, of the Enlightenment. As a loyal subject of a nation that prides itself on liberty. Day after day, year after year, the dissonance grows.

  The arguments aren't just attacking his *trade*; they’re attacking his *self*. Who he claims to *be*. To continue… is to live a lie he can no longer ignore. It costs him not just his reputation *with* others, but his possession *of* himself. It becomes an unbearable hypocrisy echoing in his own mind. The change, perhaps, had to come from the *inside out*. A confrontation not just with society's judgment, but with the reflection in the mirror.

  **[Pause, acknowledge the complexity]**

  So, which force was stronger here? Was it the shifting winds of economic interest, eroding the foundations? Was it the transforming code of honor among the powerful, making the trade shameful? Or was it this internal reckoning – the agonizing realization that one could not *be* a "good Englishman," a "man of God," a "rational being," while perpetuating such an evil? Historians debate this. Philosophers ponder it. My colleague Eric Williams points rightly to the crumbling economic pillars; my colleague Kwame Appiah illuminates the powerful mechanics of social honor.

  **[Gesture broadly, encompassing all]**

  Perhaps the truth, the immense, difficult truth we grapple with today, is that it took *all* of it. The relentless moral argument created the language, exposed the horror. The changing economic landscape made abolition conceivable, even practical, for some. The shifting tides of honor among elites made it politically possible. And for some, surely, it was that internal fracture – the inability to reconcile their actions with their professed selves – that finally moved the stone.

  **[Shift tone to reverence and resolve]**

  We stand here today, descendants of the enslaved, neighbors, students, officials, scholars, because that system *did* end. Not perfectly. Not without immense, ongoing struggle for true freedom and justice that continues right now. But it ended.

  We honor the ancestors who endured the unimaginable. Their strength is our bedrock. We honor the abolitionists who spoke, who organized, who risked everything. Their courage is our compass.

  But what do we carry home from this remembrance? Not a comforting lie that pure reason effortlessly topples tyranny. Not a simple story where economics alone dictate morality.

  **[Speak slowly, with earned weight]**

  We carry this: Evil dies hard. It dies when the arguments strip away its justifications. It dies when its foundations crumble. It dies when society brands it shameful. And crucially, it dies when individuals can no longer look themselves in the eye while perpetuating it.

  The fight for justice – in *our* time, against *our* entrenched wrongs – demands all these things. It demands our voices speaking hard truths. It demands we understand the systems that prop up injustice. It demands we build cultures of true honor, where oppression brings not profit or prestige, but shame. And yes, it demands that we each hold ourselves accountable – that we strive to live in ways where our actions align with the principles we claim to cherish.

  The end of the slave trade wasn’t a victory of simple morality. It was a victory of relentless pressure, on every front, including the human soul. That is the weight we remember. That is the mirror we hold up. That is the difficult, necessary work we inherit. Let us carry *that* truth with us, and let it strengthen our resolve. Thank you.

  **[Hold gaze for a moment, then step back solemnly]**
