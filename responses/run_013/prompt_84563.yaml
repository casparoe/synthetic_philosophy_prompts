prompt: |-
  I'm running the two sessions on self-locating belief in our graduate seminar; the students are at ease with Bayesian confirmation theory but have never met the self-sampling/self-indication contrast, and half of them arrive suspecting that indexical credence is a confusion rather than a topic. Plan the teaching rather than delivering it: the order in which the components must go so that the self-sampling assumption (SSA) and the self-indication assumption (SIA) arrive as rival answers to a question the room already feels, the one case that should carry the whole contrast, the misconceptions they will predictably form and the exact point in the sequence where each must be defused, a single closing question that would reveal whether the distinction landed rather than just the labels, and what I should announce outright that I am not covering.

  I want the carrying case to be one I have been using: a hotel whose week's occupancy was settled by a fair coin, ten guests on heads and ten thousand on tails, with each guest knowing only that they are one of that week's guests. Tell me whether that case can bear the weight, what it must have and must lack for the divergence to come out cleanly, and why the familiar Sleeping Beauty and doomsday framings would import conclusions the sequence has not yet earned. Treat the presumptuous philosopher (a coin flip between a cosmos with N observers and one with N+1) as the price of the SIA horn and the doomsday argument as the price of the SSA horn, not as two unrelated curiosities.

  Answer as exactly five numbered items, each a sentence or two, with no introduction or conclusion.
reasoning: |-
  Hmm, the user is a philosophy graduate seminar instructor planning two sessions on self-locating beliefs. They need a structured teaching sequence that makes SSA and SIA emerge naturally as solutions to a felt problem. Students are Bayesian-literate but skeptical about indexical credence. The hotel case (10 vs 10,000 guests based on coin flip) is proposed as the central example.

  Key requirements: The sequence must first establish why standard Bayesianism feels inadequate here, then present SSA/SIA as competing answers to that gap. Common student misconceptions need preemptive addressing. I should avoid Sleeping Beauty/Doomsday analogies until after the hotel case is fully internalized since those import extra assumptions. The presumptuous philosopher and doomsday argument should frame SIA/SSA costs at the end.

  For the hotel case to work cleanly: It must lack any non-indexical evidence (like dated name tags) that could resolve uncertainty externally. The coin's fairness should be unquestioned to isolate the indexical problem. Crucially, the "feeling" of being more likely in a crowded hotel must arise organically before labeling it as SIA.

  Predictable misconceptions: Students might conflate indexical uncertainty with lack of evidence about the coin, or think SIA contradicts Bayesian updating. These must be defused when first introducing the case.

  The closing should test conceptual grasp: Ask what probability they'd assign to tails if they found their room number was ≤10. Correct answer requires understanding that SIA would update toward tails (since low numbers are rarer there), while SSA wouldn't.

  Finally, explicitly exclude anthropic reasoning beyond observer-counting to keep focus tight.
answer: |-
  1. Begin with the hotel case as the core puzzle: present it neutrally as a probability problem ("Given you're a guest, what's P(heads)?") to first elicit the intuitive clash between Bayesian instincts (initial P(heads)=0.5) and the unease that one's existence *feels* likelier if tails (many guests) is true, forcing the room to articulate why standard evidence-updating feels incomplete here.  
  2. Formalize the gap using indexical ignorance: explicitly model the observer's uncertainty as spanning both possible worlds (heads/tails) *and* their identity within a world (which guest), showing that Bayesian conditionalization alone cannot resolve the "which guest am I?" question—this creates the necessary void for SSA (treat observer-positions as equiprobable) and SIA (treat worlds as probability-weighted by observer-count) to emerge as rival bridging principles.  
  3. Defuse the "indexicals are confused" skepticism immediately after introducing the hotel case by noting that, absent SSA/SIA, the intuitive 0.5 credence implies indifference between betting on heads when you might be one of 10 vs. one of 10,000 observers—a tension demanding resolution—and preempt the misconception that SIA "double-counts" evidence by clarifying it weights *hypotheses* by observer density before updating.  
  4. Introduce presumptuous philosopher (SIA's cost: absurdly favoring larger universes) and doomsday (SSA's cost: absurdly favoring human extinction soon) only after deriving both from the hotel math, explicitly framing them as the "price" of each solution to *the same underlying puzzle*—this prevents them seeming like distinct paradoxes and anchors the debate in the established case.  
  5. Close by asking for the posterior P(tails) if they learn their room number is ≤10: correctly seeing this as evidence *for* tails under SIA (low numbers are rarer in tails-world) but irrelevant under SSA (room number doesn't change observer-position probability) reveals grasp of the contrast, not just labels; announce upfront that anthropic selection effects (e.g., fine-tuning) are excluded to focus purely on observer-counting.
