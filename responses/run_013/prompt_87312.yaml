prompt: |-
  hey — second-year PhD student here, TAing the intro ethics course this term, and I'm slogging through the short-essay responses for the virtue ethics unit. The question I set them was:

  "The situationist critique associated with Gilbert Harman and John Doris challenges virtue ethics on empirical grounds. In ~500 words, (a) explain what the situationist critique claims and what psychological evidence it draws on, and (b) assess whether it succeeds in undermining virtue ethics."

  Here's one of the answers. I have to hand back a grade out of 15 plus the specific comments that justify it — students can appeal, so I can't just write "good, but a few issues." I need to point at the exact claims that earn or lose marks and say why. So: what's solid, what's shaky, and what's actually wrong?

  ---
  Virtue ethics, which goes back to Aristotle, treats the central question of ethics as being about what kind of person one should be rather than what one should do. Its key notion is the virtue: a stable character trait, such as honesty or compassion, that a person has and that reliably issues in virtuous behaviour across a wide range of situations. The situationist critique, developed by Gilbert Harman and John Doris in the late 1990s and early 2000s, argues that this picture of the person is empirically untenable.

  The critique leans heavily on social psychology. In Milgram's obedience experiments, ordinary participants were willing to keep administering what they believed were painful electric shocks to a stranger because an experimenter told them to; to the situationists this shows that people do not really possess stable compassionate characters, and that what a person does depends far more on the pressures of the situation than on any inner disposition. Darley and Batson's Good Samaritan study points the same way: seminary students who had been told they were running late were much less likely to stop and help a man slumped in an alley, even though they were on their way to give a talk about the Good Samaritan.

  Doris concludes that we should give up on global character traits and replace them with local traits, e.g. "helpful-when-not-in-a-hurry." Harman goes further still and proposes that we replace the whole vocabulary of character with local traits, since the fundamental attribution error makes us systematically overestimate how much behaviour is driven by dispositions and underestimate how much is driven by situations.

  The usual virtue-ethical reply, from people like Julia Annas and Rachana Kamtekar, is that the situationists are attacking a straw man. On the Aristotelian picture a virtue is not a blind habit that fires automatically; it involves practical wisdom and is exercised through deliberation, so the fact that people behave badly when they're stressed or in a hurry doesn't show that virtues don't exist, it only shows that most people aren't virtuous. The experiments tell us about the average person, not about the virtuous person. So the situationist critique, while it raises interesting questions, doesn't refute virtue ethics; if anything it shows why we need virtue ethics in the first place.
  ---
reasoning: |-
  Okay, the user is a second-year PhD student TAing an intro ethics course. They need to grade a student's essay on the situationist critique of virtue ethics, providing specific comments for a grade out of 15. The essay covers the critique by Harman and Doris, using Milgram and Good Samaritan studies, and mentions virtue ethicists' responses like Annas and Kamtekar. 

  First, I'll assess the essay's strengths. The student accurately defines virtue ethics and the situationist critique, correctly attributes the studies to their authors, and summarizes Doris and Harman's positions well. They also present the virtue ethics rebuttal clearly. These are all key points that show understanding.

  But there are issues. The student says "global character traits" but doesn't explain the term, which is central to the critique. They also misrepresent Harman's point—he didn't just say to replace character with local traits; he questioned if character traits exist at all, using the fundamental attribution error. The essay only mentions it in passing without explaining how it challenges virtue ethics. 

  For the virtue ethics response, the student mentions Annas and Kamtekar but leaves out that virtues require consistent behavior even in tough situations. They don't address how the critique affects the achievability of virtue. Also, they don't engage with the deeper debate, like whether virtues can be developed or if the studies challenge the existence of any character traits.

  The structure is mostly good, but the conclusion is weak. It doesn't assess the critique's success thoroughly, just repeats the rebuttal without analysis. The essay hits the word limit, but some arguments are underdeveloped.

  I think a grade of 11/15 is fair. They cover the main points but miss key nuances and depth. For feedback, I'll note the accurate parts, then point out the omissions and errors specifically: the lack of "global traits" definition, misrepresentation of Harman, insufficient explanation of the fundamental attribution error, superficial treatment of the virtue ethics response, and the weak assessment. This gives clear reasons for the score and helps the student improve. The user needs this detail because grades can be appealed, so comments must be precise and justified.
answer: |-
  Here's a detailed breakdown of the essay's strengths and weaknesses for grading, followed by a suggested grade and specific comments:

  **Strengths (Demonstrating Good Understanding):**

  1.  **Accurate Core Definition:** Correctly identifies the core of virtue ethics (focus on character/virtues, stable traits, reliable behavior) and its Aristotelian roots. (+)
  2.  **Correct Attribution & Core Claim of Situationism:** Accurately names Harman and Doris as key figures, locates them temporally, and states the fundamental situationist claim: the virtue ethical picture of stable character traits is "empirically untenable." (+)
  3.  **Key Evidence Cited Accurately:** Correctly identifies Milgram's obedience experiments and Darley & Batson's Good Samaritan study as central evidence. Describes the basic setup and findings of each study accurately in relation to the critique (situational pressure overriding presumed dispositions). (++)
  4.  **Distinguishes Doris & Harman:** Correctly notes Doris's proposal for "local traits" and Harman's more radical skepticism about character traits altogether, mentioning the fundamental attribution error (FAE) as part of Harman's argument. (+)
  5.  **Captures Main Virtue Ethics Rebuttal:** Accurately summarizes the standard Aristotelian response (Annas/Kamtekar): situationists attack a "straw man" by misunderstanding virtue as a "blind habit" rather than something exercised through "practical wisdom" and "deliberation." Correctly states the core rebuttal point: experiments show most people aren't virtuous, not that virtues don't exist or are impossible. (++)
  6.  **Structure & Clarity:** The essay is well-structured, logically progressing from defining VE, to explaining the critique and evidence, to presenting the rebuttal. It's clearly written and concise. (+)

  **Weaknesses & Errors (Shaky Ground or Misunderstandings):**

  1.  **Underdeveloped Explanation of "Global Traits":** While mentioning Doris's shift to "local traits," the essay doesn't explicitly define or emphasize the key target of the critique: *global*, *robust*, *cross-situationally consistent* character traits. This is crucial. The critique specifically argues that evidence shows these *global* traits don't exist, not just that traits are weak. The student implies it ("reliably issues... across a wide range"), but doesn't make the "global vs. local" distinction explicit enough in explaining the critique's target. (-)
  2.  **Misrepresentation/Misunderstanding of Harman:** The phrase "replace the whole vocabulary of character with local traits" is misleading. Harman is far more skeptical. He argues that the FAE shows we *mistakenly attribute* behavior to dispositions (character traits) when it's actually caused by situations. His conclusion isn't just to *replace* character talk with local traits; it's that character traits (global *or* local, in the robust sense) might be largely *fictional* or empirically unsupported constructs ("The Nonexistence of Character Traits" is a famous Harman title). The FAE is central to his *denial* of traits, not just a reason to prefer local ones. This is a significant misstep. (-- - Major Point)
  3.  **Superficial Treatment of Fundamental Attribution Error (FAE):** The essay mentions the FAE but fails to explain *how* it specifically undermines virtue ethics. It doesn't connect the FAE to the core situationist claim that our *common-sense belief* in character traits (which virtue ethics relies on) is itself a cognitive error revealed by psychology. This omission weakens the explanation of Harman's argument. (-)
  4.  **Oversimplified Virtue Ethics Rebuttal:** While capturing the main point, the rebuttal section misses crucial nuances:
      *   It doesn't address the *consistency* requirement inherent in virtue. A virtuous person *should* display compassion even under stress or time pressure (though perhaps not identically). The studies challenge whether *anyone* possesses virtues robust *enough* to manifest consistently across challenging situations. The essay implies virtues are immune to situational pressure, which isn't quite right.
      *   It doesn't engage with the situationist challenge to the *acquirability* of such robust traits if they are so rare and easily disrupted.
      *   While mentioning Annas/Kamtekar, it doesn't hint at the deeper philosophical debate about whether the *concept* of virtue requires empirical realizability or is an ideal. (-)
  5.  **Weak Assessment (Part b):** The essay effectively presents the rebuttal but fails to provide a genuine *assessment* of whether the critique *succeeds in undermining* virtue ethics. It simply restates the rebuttal as the final answer without weighing its strength against the critique's evidence or considering counter-rebuttals (e.g., Do the studies *really* show no robust traits exist, or just that they are hard to achieve? Is the virtue ethicist redefining "virtue" to be empirically unfalsifiable?). This section feels like a summary, not an evaluation, which is the core of part (b). (-- - Major Point for Omission)

  **Suggested Grade: 11/15**

  **Justification for Grade:**

  *   **Strong Foundation (8-9 pts):** Demonstrates a solid grasp of the core concepts, key figures, main evidence, and the primary rebuttal. Well-structured and clear.
  *   **Significant Deficiencies (-3-4 pts):**
      *   **-2 pts:** Serious misunderstanding/misrepresentation of Harman's radical skepticism and the role of the FAE.
      *   **-1 pt:** Underdevelopment of the "global traits" concept central to the critique and insufficient explanation of how the FAE specifically undermines VE.
      *   **-1 pt:** Weak assessment section (part b) that merely restates the rebuttal without genuinely evaluating the strength of the critique against it.

  **Specific Comments to Provide to the Student:**

  ```
  Grade: 11/15

  Strengths:
  *   Excellent definition of virtue ethics' core focus and its reliance on stable character traits.
  *   Accurate identification of Harman and Doris as key situationists and clear statement of their fundamental claim against the empirical tenability of virtue ethics' view of character.
  *   Correct and effective use of the Milgram and Good Samaritan studies to illustrate the situationist argument about situational power overriding disposition.
  *   Good distinction between Doris's "local traits" proposal and Harman's more radical position.
  *   Clear summary of the core Aristotelian rebuttal (straw man, practical wisdom, distinction between average and virtuous person), correctly attributing it to Annas/Kamtekar.
  *   Well-structured and clearly written response.

  Areas for Improvement (Specific reasons for point deductions):
  1.  **Misrepresentation of Harman (-2):** Your characterization of Harman's position ("replace the whole vocabulary of character with local traits") is inaccurate and significantly weakens your explanation. Harman uses the Fundamental Attribution Error (FAE) to argue that character traits (global *or* robust local ones) might be largely *nonexistent* or empirically unsupported *illusions*. His point isn't just to switch vocabulary; it's that our common-sense attributions of character are fundamentally mistaken. You needed to explain that the FAE demonstrates our tendency to *falsely* attribute behavior to dispositions, thereby undermining the very *existence* claims about character traits that virtue ethics relies upon.
  2.  **Underdeveloped Concepts (-1):** While you mention "global" traits implicitly, you didn't explicitly define or emphasize that the situationist critique specifically targets *global, robust, cross-situationally consistent* character traits as the empirically problematic element of virtue ethics. This is the precise target Doris and Harman are aiming at. Furthermore, you mentioned the FAE but didn't adequately explain *how* this specific cognitive bias directly challenges the foundations of virtue ethical character psychology.
  3.  **Insufficient Assessment (-1):** Part (b) asks you to *assess* whether the critique succeeds in undermining virtue ethics. You accurately presented the main virtue ethics rebuttal, but you didn't move beyond summary to provide a genuine evaluation. A strong assessment would weigh the strength of the situationist evidence (do these studies *prove* robust traits don't exist, or just that they are rare/fragile?) against the force of the rebuttal (is the virtue ethicist offering a plausible defense or retreating to an unfalsifiable ideal? Does the critique force a modification of VE, or can VE fully withstand it?). Your conclusion simply restates the rebuttal without this critical analysis.

  Overall: A very good demonstration of knowledge on the core points, but let down by a significant misstep on Harman and a lack of depth in the crucial assessment component.
  ```

  This feedback provides the student with clear recognition of what they did well and *precisely* identifies the specific claims or omissions that resulted in point deductions, justified by reference to the course material and the essay question's requirements. This level of specificity is crucial for transparency and defensibility if an appeal arises.
