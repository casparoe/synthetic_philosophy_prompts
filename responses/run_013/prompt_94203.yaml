prompt: |-
  Ok so I'm in a grad seminar on confirmation theory and probability (we did probabilism, conditionalization, Dutch books, the usual, and now we're on how Bayesian confirmation handles historical cases) and two people in the class have been going at each other for three weeks about the problem of old evidence, to the point where the rest of us just watch. A says the objection is answerable: you either take the counterfactual route (what credence would you have had in the hypothesis if you hadn't already known the evidence?) or you say the genuinely new item is your discovery that the hypothesis entails the old datum, or gives it a good likelihood, and you conditionalize on that. B says every one of those moves either leaves the problem exactly where it was -- conditionalizing on something you'd already assigned probability 1 does nothing, so "just conditionalize on E" is dead on arrival -- or hands the Bayesian enough freedom that any answer can be made to come out right, and that once you admit the agent didn't already see the consequences of her own hypotheses you've stopped doing the probability-function picture rather than patched it. A third classmate keeps interjecting that the whole thing is an artefact of asking about posteriors instead of likelihood ratios, and that if confirmation is the ratio then it makes no difference whether the datum was known or new.

  What I'd like you to write is the document those three should have produced instead of shouting at each other: the joint statement all three could sign. Structure it as (1) a numbered list of agreed claims -- substantive ones, about the Mercury perihelion case and about the 1919 eclipse, about exactly what conditionalization does and doesn't require of an agent, about what "old" should mean here (known before the hypothesis existed vs. known but never connected to it), and about what would count as a fix at all; and then (2) a disagreements table where each row gives the precise point in dispute, with each side's position worded the way that side itself would accept it, and a flag for whether the disagreement is genuine or is really about what Bayesianism is for. Keep the agreed section strong enough that someone could actually deny one of the claims; don't let it fill up with "evidence matters" style truisms.

  After that, seperately, I want the cruxes -- the sub-questions such that settling one would move at least one of them -- and for each crux a case, argument or thought experiment that all three agree would bear on it, plus each side's prediction written down in advance. Two I'm particularly curious about: whether the counterfactual route survives a case where the agent's counterfactual credence is intuitively indeterminate (pick a good one), and whether the likelihood-ratio line survives a case where the old evidence has likelihood ratio 1 for the rival theories. I also want to know whether the parallel problem for genuinely new hypotheses is the same disease or a different one, since we read something on that and I couldn't tell. And if you decide part of the fight is verbal -- e.g. it's really about whether Bayesianism is modelling the actual history of a scientist's beliefs or only synchronic relations of support -- say which part and why. No citations or reading lists needed, you can't check them anyway; just the substance, and don't be diplomatic-vague, I want to be able to see where the seams are.
reasoning: |-
  We are to produce a joint statement that A, B, and the third classmate (let's call them C) can sign. The statement has two parts: (1) a numbered list of agreed claims, and (2) a disagreements table.

  First, let's outline the agreed claims. We need substantive agreements about:
  - The Mercury perihelion case and the 1919 eclipse case.
  - What conditionalization does and doesn't require.
  - What "old evidence" means (known before the hypothesis existed vs. known but not connected).
  - What would count as a fix for the problem of old evidence.

  Then, the disagreements table: each row with the precise point of dispute, each side's position as they would accept it, and a flag for whether it's a genuine disagreement or about the purpose of Bayesianism.

  After that, we'll have the cruxes: sub-questions that, if settled, would move at least one of the parties. For each crux, we'll provide a case, argument, or thought experiment that all three agree would bear on it, and each side's prediction. We are specifically asked for two cruxes: one about the counterfactual route in a case of indeterminate counterfactual credence, and one about the likelihood-ratio line when the old evidence has a likelihood ratio of 1 for rival theories. Also, we need to address whether the problem for genuinely new hypotheses is the same or different.

  Finally, we'll note if part of the dispute is verbal.

  Let's begin.

  **Part 1: Agreed Claims**

  1. **The Mercury Perihelion Case**: The anomalous precession of Mercury's perihelion was known before Einstein formulated General Relativity (GR). When GR was shown to predict this precession, it was taken as strong confirmation for GR. However, since the anomaly was already known (and assigned probability 1), standard Bayesian conditionalization cannot increase the probability of GR upon learning E (the perihelion precession) because P(E)=1.

  2. **The 1919 Eclipse Case**: The bending of starlight during the solar eclipse was a novel prediction of GR. The observation of the bending was new evidence and, when learned, increased the probability of GR via conditionalization. This case does not exhibit the problem of old evidence because the evidence was not already known.

  3. **Conditionalization's Requirements**: Conditionalization requires that the agent updates their credence in a hypothesis H upon learning new evidence E (with certainty) by setting the new credence in H to the old conditional credence P(H|E). This assumes that the agent already has a prior that includes P(H|E). However, conditionalization does not require that the agent has explicitly considered the connection between H and E before learning E.

  4. **Meaning of "Old Evidence"**: We agree that "old evidence" in this context refers to evidence that is already known (and thus has probability 1) at the time the hypothesis is under consideration. There is a distinction between evidence that was known before the hypothesis was formulated (like Mercury's perihelion for GR) and evidence that was known but the logical or probabilistic connection to the hypothesis was not realized (e.g., the agent knew E but did not know that H entailed E, or that P(E|H) was high).

  5. **What Counts as a Fix**: A solution to the problem of old evidence must explain how old evidence can confirm a hypothesis in a Bayesian framework without violating the laws of probability. The solution should not allow arbitrary adjustments that could make any hypothesis confirmed by any old evidence.

  6. **The Role of Logical Omniscience**: We agree that the problem arises because Bayesianism assumes logical omniscience (or at least that probabilities are defined over a fixed algebra) but in reality, agents are not logically omniscient. Therefore, an agent might not have realized that H entails E, and so the agent's actual conditional probability P(H|E) might not reflect the entailment.

  7. **The Likelihood Ratio Point**: We agree that if one defines the measure of confirmation as the likelihood ratio (P(E|H)/P(E|~H)), then the fact that E is old does not by itself make the ratio 1. However, if E is old and has probability 1, then P(E|~H) is also 1 (by the definition of conditional probability) and thus the ratio becomes 1. So the problem remains for the likelihood ratio if we use the current probability function.

  **Part 2: Disagreements Table**

  | Dispute # | Point of Dispute | A's Position (as A would accept) | B's Position (as B would accept) | C's Position (as C would accept) | Genuine Disagreement or About Purpose? |
  |-----------|------------------|----------------------------------|----------------------------------|----------------------------------|---------------------------------------|
  | 1 | **The counterfactual route**: Can we solve the problem by considering the counterfactual credence the agent would have had in E if they had not known E? | Yes. In the counterfactual state where the agent does not know E, they assign a probability less than 1 to E. Then, upon learning E, conditionalization can increase the probability of H. This is a legitimate way to model the confirmatory impact. | No. The counterfactual state is underspecified and arbitrary. How do we determine the counterfactual probability of E? Without a well-defined method, we can adjust it to get any desired confirmation, which violates the objectivity of confirmation. | The counterfactual route is unnecessary because the likelihood ratio (using the current probability function) already captures the confirmatory relation without needing to imagine unknown states. | Genuine (about method) and also about purpose: whether Bayesianism should model actual or counterfactual states. |
  | 2 | **Conditionalizing on the logical relation**: Can we solve the problem by conditionalizing on the discovery that H entails E (or that P(E|H) is high)? | Yes. The agent learns a new fact: that H entails E (or that P(E|H) is high). This new fact is not previously assigned probability 1, so conditionalization on it can increase the probability of H. | No. This move abandons the original probability function because the agent's failure to see the entailment means that their prior probability function was not logically omniscient. Thus, we are no longer doing standard Bayesianism with a single probability function over time. | This move is acceptable because it focuses on the actual learning event (the discovery of the entailment) and the likelihood ratio for that new evidence can be non-trivial. | Genuine: about whether Bayesianism requires logical omniscience or can be applied to non-omniscient agents. |
  | 3 | **The likelihood ratio as a solution**: Does defining confirmation by the likelihood ratio (at the time of hypothesis evaluation) avoid the problem of old evidence? | The likelihood ratio is a good measure, but it does not by itself solve the problem because if E is old, then P(E|H) and P(E|~H) are both 1 (if the agent is aware of the entailment) so the ratio is 1. | The likelihood ratio doesn't solve the problem for the same reason: it's still 1 when E is old. | Yes, because the likelihood ratio P(E|H)/P(E|~H) is timeless and does not depend on the current probability of E. Even if E is old, if at the time of hypothesis formulation we use the likelihood ratio, it can be different from 1. | Partly verbal: about the time at which the likelihood ratio is evaluated. Also, about what confirmation measures are appropriate. |

  Note: We have three parties. In the table, we represent A, B, and C.

  **Part 3: Cruxes**

  We now present the cruxes: sub-questions that, if settled, would move at least one of the parties.

  **Crux 1: Counterfactual Credence in an Indeterminate Case**

  *Sub-question:* Can the counterfactual route provide a non-arbitrary solution in a case where the agent's counterfactual credence in E is intuitively indeterminate?

  *Case/Thought Experiment:* Consider the following: A mathematician has been working on a conjecture C for years and has come to believe it is true (but without proof). She then learns that a consequence E of C (which she had never considered) has been observed. However, E is a very complex mathematical statement that she had never thought about. Now, if we ask: what credence would she have assigned to E if she hadn't known E? But note: she never considered E, so in the counterfactual world where she doesn't know E, she still might not have considered E. How do we assign P(E) then? The counterfactual is highly indeterminate.

  *All three agree this case bears on the issue.*

  *Predictions:*
  - A: Even in such a case, we can use a counterfactual where she considers E without knowing it. We might use a principle of minimal change: hold fixed her beliefs about the domain and compute the probability of E given her background knowledge. But A admits that if no such principle is available, it might be problematic.
  - B: This case shows the counterfactual is indeterminate and thus arbitrary. Without a clear method, the counterfactual route fails.
  - C: This case is irrelevant because we should not use counterfactuals. Instead, we should note that the likelihood ratio at the time she learns the consequence E is P(E|C)/P(E|~C). Since she hadn't considered E before, P(E) was not 1, and we can compute the ratio from her prior beliefs about the mathematical domain.

  **Crux 2: Likelihood Ratio 1 for Rival Theories**

  *Sub-question:* Does the likelihood-ratio solution avoid the problem when the old evidence E has a likelihood ratio of 1 relative to the rival theories under consideration?

  *Case/Thought Experiment:* Suppose we have two rival hypotheses H1 and H2. The evidence E is old. It turns out that P(E|H1) = P(E|H2) = c (where c is some constant). Then the likelihood ratio for H1 vs H2 is 1, so E does not confirm one over the other. But now suppose that in reality, E is a consequence of H1 but not of H2, and the agent just hasn't realized that H2 does not entail E. However, in the agent's probability function, because they haven't realized the lack of entailment, they have set P(E|H2) = 1 (since E is known). Then the likelihood ratio is 1. But if they were to realize that H2 does not entail E, they would set P(E|H2) to a lower value.

  *All three agree this case bears on the issue.*

  *Predictions:*
  - A: This shows that the agent must conditionalize on the discovery of the logical relations. Once they learn that H1 entails E and H2 does not, they update and then the likelihood ratio becomes favorable to H1.
  - B: This illustrates that the agent's current probability function is flawed because of the lack of logical omniscience. But the likelihood ratio using the flawed function is 1, so the problem remains until the agent updates on the logical discovery, which is not standard conditionalization.
  - C: The likelihood ratio should be computed with the probabilities that reflect the logical relations. If the agent doesn't know them, then they should use their best estimates. But in this case, the agent's probability function is mistaken. However, once they learn the logical facts, the likelihood ratio changes. But if we stick to the ratio at the time of evaluation, it might be 1. So C would say that the ratio must be computed with the updated probabilities after learning the logical facts.

  **Parallel Problem for New Hypotheses**

  *Question:* Is the problem of old evidence the same as the problem for genuinely new hypotheses?

  *Response:* The problem for new hypotheses is different. The problem of old evidence specifically concerns evidence that is already known (and thus has probability 1). For a new hypothesis that is introduced, the standard Bayesian can update on the new hypothesis by conditionalizing on the evidence that has been observed. However, if the evidence is old, then we run into the same problem. But if the hypothesis is new and the evidence is new, then conditionalization works. The problem of old evidence is a special case of the more general issue of logical learning, but the oldness of the evidence is crucial because it forces P(E)=1.

  We think the three would agree that the problem of old evidence is distinct because of the probability 1 issue, but the underlying issue of logical learning is the same in both cases (when an agent learns a new logical relation, whether for old or new evidence).

  **Verbal Dispute Component**

  The dispute is partly verbal about what Bayesian confirmation theory is for. 
  - A and C see Bayesianism as a normative model of scientific reasoning that can be extended to handle non-ideal agents (by counterfactuals or by conditionalizing on logical discoveries). 
  - B sees Bayesianism as a synchronic model of rational degrees of belief that requires logical omniscience and that the problem of old evidence reveals a fundamental limitation of the model for actual historical cases. 

  This is evident in Dispute #2: whether conditionalizing on the logical relation is still Bayesianism. B says it is not because it abandons the original probability function and thus the diachronic model. A and C are more flexible.

  This is also tied to the purpose: is Bayesianism meant to model the actual history of a scientist's beliefs (which includes learning logical relations) or only the synchronic relations of support? B leans toward the latter, while A and C accept the former.

  Thus, the agreed joint statement might not resolve the fundamental disagreement about the scope of Bayesianism, but it clarifies the points of agreement and the nature of the disagreements.

  We now write the document accordingly.
answer: |-
  ### Joint Statement on the Problem of Old Evidence in Bayesian Confirmation Theory

  We, A, B, and C, after extensive debate, present this document to clarify agreements and disagreements on the problem of old evidence (POE). We focus on the Mercury perihelion case (General Relativity) and the 1919 eclipse case, the mechanics of conditionalization, the meaning of "old evidence," and criteria for a solution. Our goal is to isolate substantive points of consensus and precisely map disputes, including whether disagreements stem from divergent views on Bayesianism's purpose.

  ---

  ### (1) Agreed Claims  
  *Substantive, non-truistic claims all parties endorse. Denying any would constitute a genuine challenge to the consensus.*

  1. **Mercury Perihelion Case**:  
     - The anomalous precession of Mercury's perihelion was known and accepted (P(E) = 1) before Einstein formulated General Relativity (GR). When GR was shown to entail E, scientists treated this as strong confirmation. However, within standard Bayesian conditionalization, no increase in P(GR) occurs upon "learning" E, since P(E) was already 1. This case exemplifies POE because the evidential update cannot be captured diachronically without modification.

  2. **1919 Eclipse Case**:  
     - The bending of starlight observed during the 1919 solar eclipse was novel evidence (P(E) < 1 prior to observation). Upon learning E, conditionalization increased P(GR) relative to rivals (e.g., Newtonian gravity with ad hoc fixes). POE does not arise here, as E was not previously known or assigned probability 1.

  3. **Conditionalization's Requirements and Limitations**:  
     - Conditionalization requires an agent to update credences by setting P_new(H) = P_old(H|E) upon learning E with certainty. It does not require the agent to have previously computed P_old(H|E) or recognized the connection between H and E. However, if P_old(E) = 1, conditionalizing on E leaves P(H) unchanged, as P_old(H|E) = P_old(H).

  4. **Definition of "Old Evidence"**:  
     - "Old evidence" here means evidence already known and assigned P(E) = 1 at the time H is evaluated. It is irrelevant whether E was known before H existed or was known but never connected to H; the core issue is the synchronic assignment P(E) = 1 at the time of confirmation. The "connection" (e.g., entailment or likelihood) is a separate epistemic discovery.

  5. **Criteria for a Solution to POE**:  
     - A solution must:
       - Explain how E can confirm H diachronically (i.e., show an increase in P(H) upon a relevant learning event).
       - Avoid triviality: It cannot allow arbitrary confirmation (e.g., by letting any H be confirmed by any E via unconstrained adjustments).
       - Preserve core Bayesian principles (e.g., coherence, conditionalization as the update rule).
     - Failure modes include: (a) solutions that leave P(H) unchanged despite intuitive confirmation (e.g., "just conditionalize on E"), or (b) solutions that grant excessive freedom to tune P(H|E) post hoc.

  6. **Probability 1 and Logical Learning**:  
     - If P(E) = 1, then P(H|E) = P(H) for any H, and P(E|H) = 1 for any H consistent with E. This is unavoidable in the synchronic probability function. Discovering that H entails E (or that P(E|H) is high) is a distinct epistemic event—learning a logical relation—not accounted for in the initial probability function.

  7. **Likelihood Ratios and Old Evidence**:  
     - Likelihood ratios (LR = P(E|H)/P(E|~H)) can, in principle, measure confirmation without diachronic update. However, if P(E) = 1 and the agent recognizes the logical implications of H and ~H for E, then P(E|H) = P(E|~H) = 1, so LR = 1, showing no confirmation. Thus, POE persists for LR if evaluated synchronically when E is old.

  8. **Scope of POE**:  
     - POE is a distinct problem from challenges with genuinely new hypotheses. For new hypotheses (e.g., string theory), conditionalization works if evidence is novel (P(E) < 1). POE specifically arises from evidence being old (P(E) = 1), creating a technical obstacle to diachronic confirmation.

  ---

  ### (2) Disagreements Table  
  *Each row states a precise dispute, with positions worded as each party accepts them. "Genuine" = substantive disagreement; "Purpose" = disagreement about Bayesianism's aims.*

  | Dispute | Precise Point of Dispute | A's Position | B's Position | C's Position | Disagreement Type |
  |---------|--------------------------|--------------|--------------|--------------|-------------------|
  | 1 | **Counterfactual route as solution**: Does evaluating confirmation counterfactually (e.g., P(H) if agent hadn't known E) resolve POE? | "Yes. We counterfactually lower P(E) to its pre-known value (e.g., based on background knowledge), then conditionalize on E. This yields a non-arbitrary increase in P(H) and matches scientific practice (e.g., Mercury as 'retroactive prediction')." | "No. The counterfactual credence in E is underdetermined and unconstrained (e.g., no unique P(E) in the counterfactual state). This grants agents freedom to 'manufacture' confirmation, violating solution criterion (avoid triviality)." | "Irrelevant. Likelihood ratios (LR) measure confirmation synchronically without counterfactuals. If the LR was favorable when H was proposed, E confirms H regardless of age." | Genuine (on method) + Purpose (whether Bayesianism should model counterfactual histories). |
  | 2 | **Logical discovery as solution**: Does conditionalizing on the discovery that H entails E (or that P(E|H) is high) resolve POE? | "Yes. The agent learns new evidence: the logical fact L = 'H entails E' (or 'P(E|H) is high'). Since P_old(L) < 1, conditionalizing on L increases P(H). This is a standard Bayesian update." | "No. Introducing L abandons the original probability function. If the agent didn't see the entailment, their P_old was incomplete (violating logical omniscience). This 'fix' replaces Bayesianism with a new model of logical learning." | "Partially. Conditionalizing on L can update P(H), but LR alone suffices. For L, the LR P(L|H)/P(L|~H) is often >1, confirming H. No diachronic update on E is needed." | Genuine (on logical omniscience) + Purpose (whether Bayesianism must use a single, logically omniscient P-function). |
  | 3 | **Likelihood ratios as solution**: Does defining confirmation via likelihood ratios (LR) alone dissolve POE? | "LR helps but doesn't solve POE alone. If E is old, synchronic LR=1, so no confirmation. We still need diachronic elements (e.g., counterfactual LR or updating on L)." | "LR doesn't solve POE. Synchronic LR=1 when P(E)=1, and diachronic LR requires updating on E, which fails if P(E)=1. LR is just as stuck as conditionalization." | "Yes. Confirmation is the LR at time t when H is evaluated. If, at t, P(E|H) > P(E|~H) (even if P(E)=1), LR>1 confirms H. POE is an illusion from focusing on diachronic P(H)." | Genuine (on confirmation measures) + Purpose (whether Bayesianism is synchronic or diachronic). |

  ---

  ### Cruxes: Sub-Questions with Test Cases and Predictions  
  *For each crux, we provide: (a) a sub-question whose resolution would shift at least one party's position, (b) a case/argument all agree bears on it, and (c) advance predictions from each party.*

  #### Crux 1: Counterfactual Credence Indeterminacy  
  **Sub-question**: Can the counterfactual route avoid arbitrariness when the agent's counterfactual credence in E is intuitively indeterminate?  

  **Case**: *The Unconsidered Mathematical Consequence*  
  - A mathematician knows complex theorem E (P(E)=1) but has never considered its relation to a new conjecture H. We ask: "What would P(E) have been if you hadn't known E?" Background: E is highly non-obvious (e.g., a counterintuitive result in number theory). Intuitively, there is no determinate P(E) in the counterfactual state—the agent might never have considered E, or assigned any credence.  

  **Predictions in Advance**:  
  - A: "The counterfactual P(E) can be objectively set via rational priors (e.g., simplicity/complexity of E). Here, P(E) would be low, so learning E strongly confirms H. Indeterminacy is rare; we use best estimates."  
  - B: "Indeterminacy is fatal. Without a unique rational P(E), the agent can choose values to force confirmation or not. This violates solution criteria (non-triviality)."  
  - C: "Irrelevant. The synchronic LR at hypothesis-evaluation time is what matters. If P(E|H) > P(E|~H) then LR>1, regardless of counterfactuals."  

  **Why it moves the needle**: If the case shows indeterminacy is pervasive, A must concede arbitrariness; if it can be resolved, B must reconsider objections.

  ---

  #### Crux 2: Likelihood Ratio 1 for Rivals  
  **Sub-question**: Does the LR solution fail when old evidence E has LR=1 for rival theories?  

  **Case**: *The Uniform Prior Anomaly*  
  - Evidence E (e.g., a planetary orbit anomaly) is old (P(E)=1). Two rival theories H1 and H2 both entail E, but the agent hasn't deduced this. In their P-function, P(E|H1) = P(E|H2) = 1 (since E is known), so LR=1 for H1 vs. H2. Later, the agent learns L1: "H1 entails E" and L2: "H2 does not entail E" (but E remains consistent with H2).  

  **Predictions in Advance**:  
  - A: "Conditionalizing on L1 and L2 updates P(E|H2) to a lower value (as H2 doesn't entail E), so LR for H1 vs. H2 becomes >1. This resolves POE."  
  - B: "This confirms H1, but only by updating on logical discoveries (L1, L2), not E itself. The original P-function with LR=1 remains flawed. POE isn't solved—it's bypassed by changing the model."  
  - C: "At evaluation, after learning L1/L2, P(E|H1) = 1 and P(E|H2) < 1, so LR >1. E confirms H1 via LR, no diachronic update on E needed. POE vanishes."  

  **Why it moves the needle**: If post-discovery LR>1 confirms H1 without diachronic issues, C's view gains ground; if updating on L1/L2 is necessary, A and B see it as non-Bayesian or incomplete.

  ---

  #### Parallel Problem for New Hypotheses  
  **Question**: Is POE the same "disease" as the problem for genuinely new hypotheses?  

  **Response**:  
  - All agree it is a **different disease**. POE arises specifically from P(E)=1 blocking conditionalization. For genuinely new hypotheses (e.g., a sudden quantum gravity proposal), if E is new, conditionalization works. If E is old, it reduces to POE. However, the "symptoms" (logical learning, counterfactual credences) may share mechanisms, but the core issue (P(E)=1) is unique to old evidence.  

  ---

  ### Verbal Dispute Component  
  Part of the disagreement is verbal, centering on **Bayesianism's purpose**:  
  - **Source**: Disputes #1–3 all involve whether Bayesianism should model the *actual diachronic history* of agents (including counterfactuals or logical discoveries) or *synchronic support relations* (e.g., LR at a time).  
  - **Why verbal**:  
    - A views Bayesianism as a model of rational belief revision over time, so counterfactuals/logical learning are legitimate extensions.  
    - B sees Bayesianism as a synchronic standard of coherence for logically omniscient agents, so POE reveals an in-principle limitation.  
    - C treats Bayesianism as a tool for quantifying evidential support synchronically (via LR), making diachronic updates secondary.  
  - **Resolution**: Clarifying the goal (e.g., "Should Bayesianism explain historical cases like Mercury?") would refocus disputes. If the aim is synchronic support, POE is less acute; if diachronic, it demands a solution.  

  ---  
  This document represents our shared understanding. Signatories:  
  - A: [Signature]  
  - B: [Signature]  
  - C: [Signature]
