answer: |-
  Your request is a fascinating exercise in conceptual translation, forcing the philosophical discourse on inheritance through the rigid mesh of quantitative genetics. Let's proceed position by position, then assess the residue.

  **The Egalitarian Case:** The core claim that life chances shouldn't be determined by birth translates directly into minimizing the *heritability* of socioeconomic position. The "transmission kernel" governing the transfer of wealth/advantage (W) from parent (P) to offspring (O) needs to be altered significantly. The target is a stationary distribution of W where the correlation ρ(P, O) approaches zero. Quantitatively, this means reducing the slope (β) of the offspring-on-parent regression line for W. Equality of opportunity, in this strict sense, *is* well-defined: it demands β ≈ 0 and a low additive genetic variance (V_A) for W under the transmission rules. The kernel itself must have low fidelity – the expected value of O given P (E[O|P]) should be largely independent of P, converging rapidly towards the population mean regardless of starting point. The "quantity equalized" is the expected starting value (or breeding value, BV) for W. Crucially, this *is* a specific target within your formalism, though achieving it requires strong interventions (taxes) acting as perturbations to the kernel, increasing the environmental variance (V_E) and reducing the covariance Cov(P,O). However, the genetics framework is silent on *why* β=0 is desirable; it merely describes the state. The "social welfare function" determining that low heritability is good is entirely external.

  **The Entitlement Case:** This argues against perturbing the transmission kernel. Just acquisition implies the parent's W_P is their "breeding value" expressed under fair selection (earned fitness). Disposing freely via bequest is then conceptualized as the parent directly contributing to the offspring's "permanent environmental effect" (E_P) or, more accurately, as a direct, unattenuated component of the offspring's initial BV for W. Taxing bequests is seen as equivalent to taxing the *expression* of the parent's BV *twice* – once upon acquisition (income tax) and again upon transmission. The core distinction your framework *cannot* natively represent is "justly acquired" versus "merely received." Genetics has only transmission fidelity (the magnitude of β, Cov(P,O)) and the sources of variance (V_A, V_E, Covariance between them). It lacks the category of "desert" or "just initial acquisition." "Fitness" is a dangerous analogy here. In biology, fitness differentials drive transmission *because* they confer reproductive (transmission) advantage. Applying "fitness" to earned income implies high earners *should* transmit more – a normative claim smuggled in as a biological analogy. Your framework can model the transmission consequences of different earnings (treating income as a fitness proxy affecting the *resources available* for transmission), but it cannot adjudicate whether this *ought* to be the case. The entitlement view relies entirely on normative concepts (justice, ownership, double taxation) that find no direct counterpart in the transmission kernel itself.

  **The Family Case:** Here, intergenerational wealth transfer is framed as an extension of parental investment, analogous to provisioning or education increasing offspring fitness. In quantitative genetics terms, this views the wealth transmission component of the kernel as part of the "parental effect" (Cov(P, O) arising from shared environment/non-genetic inheritance) or as a direct contribution to the offspring's E_P. Suppressing large transfers is seen as disrupting a beneficial parental strategy that enhances offspring survival/reproductive success (fitness). The translation highlights a tension: Is this wealth transfer part of the "normal" environmental variance influencing the expression of the offspring's own traits (e.g., their ability to earn), or is it a direct alteration of the offspring's starting BV for W? The "valuable" aspect the polity suppresses is the parent's ability to maximize their offspring's expected fitness (or starting BV) via this specific channel. The framework *can* model the fitness consequences: reducing parental investment (wealth transfer) likely decreases mean offspring fitness (W) in the next generation, potentially lowering the population mean. However, it cannot judge whether this suppression is "wrong" or whether the specific *form* of investment (massive wealth vs. education) is qualitatively different. The genetics lens sees only the impact on the distribution and the transmission parameters.

  **The Empirical Claim (Dynastic Persistence):** This translates most cleanly. It's a claim about the stationarity and ergodicity of the wealth distribution under the current transmission kernel. If ρ(P, O) > 0 and especially if transmission is multiplicative (see below), the system has a non-degenerate stationary distribution with positive variance. Without intervention (a constant "corrective" perturbing the kernel, like a tax), the distribution does not converge to a delta function; families (lineages) will exhibit persistence in their relative standing (quantiles) over generations. The autocorrelation of lineage mean BV across generations decays slowly. The "same families at the top" reflects the upper tail of this stationary distribution exhibiting low mobility. This is a straightforward prediction of quantitative genetic models with non-zero heritability under constant conditions. The framework handles this claim perfectly.

  **Branching Process & Lineages:** The branching process perspective is crucial. Ancestry is indeed a graph, not a tree, converging to the same set of ancestors for all present-day individuals (the Identical Ancestors Point). This fundamentally undermines the concept of a discrete, isolated "dynasty" over deep time. Every lineage eventually connects to every other. The philosophical claims framed around multi-generational family units ("the Smith dynasty") become operationally fuzzy beyond a few generations. The *statistical* persistence of high BV lineages within the population distribution remains valid, but the idea of a unique, continuous "Smith" entity controlling distinct wealth evaporates in the coalescent. Ethical arguments based on preserving or breaking *specific, named* dynasties lose coherence in this deep-time view; the focus necessarily shifts to the properties of the *distribution* (variance, heritability, mobility) across the population graph at any given time.

  **Multiplicative Growth:** This radically changes the dynamics and potentially reframes arguments. In a multiplicative wealth process (W_t+1 = W_t * R, where R is a random growth rate), the ensemble average growth rate (E[log R]) dominates long-term dynamics. A tax on large bequests acts by reducing the variance in the transmission kernel (compressing the distribution of R). Crucially, by Jensen's inequality, reducing the variance of R can *increase* the expected long-term growth rate for the *typical* (median) lineage (E[log R]), even if it slightly decreases the arithmetic mean growth rate (E[R]). An egalitarian tax, by reducing the right tail of R (the massive multiplicative advantages), can thus boost the typical trajectory's growth rate. This provides a potential *efficiency* argument grounded in the mathematics of multiplicative processes, distinct from pure equity concerns. It suggests that high transmission fidelity (high heritability under multiplicative transmission) can be detrimental to the typical lineage's prospects. An entitlement view prioritizing arithmetic mean growth (E[R]) might see this tax as harmful, while the typical lineage benefits from the variance reduction. This mathematical insight offers a novel, non-normative perspective favoring redistribution in multiplicative environments – it's not just about fairness, but about optimizing the typical growth path.

  **The Residue Report:**

  The translation carries the *mechanics* of transmission remarkably well. Concepts like heritability (β), transmission kernel, breeding value, stationary distribution, variance components, and the dynamics under multiplicative growth map directly onto the core arguments about wealth persistence, mobility, and the effects of intervention (tax). The empirical claim about self-perpetuating wealth is perfectly captured. The branching process insight profoundly challenges the ontological stability of "dynasties."

  The translation distorts primarily by *flattening* normative distinctions. The crucial philosophical cleavage between "justly acquired" and "merely inherited" advantage evaporates. Genetics offers only Cov(P,O) and β; it cannot distinguish between advantage earned by the offspring's own traits versus advantage bestowed directly. The "entitlement" claim relies entirely on this distinction, which has no counterpart. Similarly, the "family" case's appeal to the inherent value of parental provision is an external normative judgment; the framework only sees it as a source of covariance and potential mean fitness effect. The genetics lens renders these distinctions invisible, treating all sources of parent-offspring similarity in the trait (W) as equivalent components of the transmission kernel.

  What cannot be said at all falls into two categories:

  1.  **Normative Foundations:** The *why*. Why is low heritability (β≈0) desirable (Egalitarian)? Why is freedom of disposition an inherent right (Entitlement)? Why is parental wealth transfer a specially valuable form of care (Family)? The framework describes states and dynamics but provides no basis for valuing one state over another. The "social welfare function" is entirely missing and must be imported. Fitness is a dangerously misleading analogy here; applying it normatively (high earners *deserve* to transmit more because they are "fit") is a category error, conflating a biological mechanism with a moral principle.
  2.  **The Nature of "Advantage":** Wealth (W) is treated as a univariate quantitative trait. This misses the qualitative complexity. "Life chances" encompass social networks, cultural capital, political influence – factors not easily quantified or additive, and whose transmission might not follow the same kernel as financial wealth. The framework struggles with multidimensional, non-additive advantage. Furthermore, the distinction between advantage that enhances an individual's *own* productive potential (e.g., education funding their skills) versus advantage that is purely positional or rent-extracting (e.g., sheer capital ownership) is invisible. Genetics sees only the trait value (W), not its source or economic function.

  The gap is not primarily a defect *of* the genetic framework; it is designed for different phenomena. It reveals that key parts of the philosophical debate – especially those relying on concepts of justice, desert, rights, and the qualitative nature of advantage – are doing rhetorical work that a purely mechanistic description of transmission cannot support. The translation exposes these arguments as resting on external ethical premises. However, the framework also enriches the debate by providing rigorous tools to model consequences (like the multiplicative growth insight) and by fundamentally challenging simplistic notions of lineage (via the branching process). It cannot tell us what we *ought* to do, but it can tell us with great precision what the consequences of different "transmission kernels" (tax policies) are likely to be for the distribution of advantage across the generations. The residue, then, is the irreducible core of ethics and qualitative judgment that the mathematics of transmission cannot encapsulate, but which the mathematics can profoundly inform.
