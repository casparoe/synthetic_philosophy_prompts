prompt: |-
  ok so I'm putting together a session for a group of people who work on voting reform -- campaigners, a couple of local councillors, some policy folks -- and the whole reason we need it is that everyone in the room says they want to 'expand the franchise' and then agrees about nothing. Some want 16 year olds voting, some want non-citizen residents voting, some want compulsory voting, and they keep assuming those three go together or don't, without ever saying what they think the vote is actually *for*.

  What I want from you is a decision tree / taxonomy that sorts the positions properly. Build it from the ground up: the first split should be over what grounds someone's claim to the vote -- not 'are you a democrat' but the real dividing questions. Things like: is the vote owed to whoever is *bound* by the law, or to whoever's *interests* are at stake, or to whoever is *competent* to use it, or is it a mark of *membership* in a people, or is it just whoever has skin in the game / reciprocal standing. Each of those should be a branch you reach by answering a question about a concrete case, not by picking a label. And put in a node for the circularity problem, since the people deciding who gets in are the ones already in -- I want to see which leaves have a story about that and which just quietly assume the boundary.

  Then the three issues I care about -- compulsory voting, lowering the age, votes for non-citizens -- should show up as the diagnostic nodes further down, because thats where the views actually come apart and where my group is hand-waving.

  Here's the angle I really need, and its the part I can't get from any textbook: I want the tree to show whether a position's take on *compulsory* voting is genuinely entailed by its ground for the franchise, or whether it's just bolted on. Like -- if you think the vote is a competence you exercise, forcing people to exercise it kind of makes sense; if you think it's a right you hold because your interests are at stake, forcing you to pursue your own interests looks weird; and if it's a duty you owe to the people who won it for you, compulsion follows almost trivially. So some cells in your tree are going to be combinations where the franchise-ground and the compulsion-stance don't fit together. Don't smooth those over -- mark them and say whether they're empty because the view is incoherent, because it's unattractive, or just because nobody's bothered to defend it.

  Please make sure these leaves turn up somewhere: the view that the franchise should go to everyone affected by the decision (and yes, follow that where it goes -- foreigners, future people, the lot); the view that it goes to everyone subjected to the law's coercion; the competence-graded view; the bounded-people / membership view; the stakeholder or reciprocity view; and one deflationary leaf for 'the franchise is just whatever a stable constitution happens to settle on, there's no deep ground.'

  Use these as the branch questions, or at least make sure your branches can handle them: a 16 year old who works and pays tax; a non-citizen who's lived here twenty years, pays tax, and can be deported; a citizen who's lived abroad for a decade; someone with advanced dementia; a prisoner; and someone in another country whose whole livelihood will be wrecked by our climate policy.

  Also -- if any two leaves give the same answer on every one of those cases, say so, don't pretend they're seperate. I'd rather have a smaller tree that actually splits things than a big one that just lists labels.

  Be commited about this: don't hand me five options and shrug. Cut the tree where you think it should be cut, tell me which empty cells are empty for a reason and which are just unexplored, and at the end say which leaf you actually think is right and why. Aim for somewhere between six and ten leaves.
reasoning: |-
  Okay, the user is organizing a session for voting reform advocates who all say they want to "expand the franchise" but disagree on specifics like lowering the voting age, non-citizen voting, and compulsory voting. They need a decision tree that starts from fundamental principles rather than surface positions, using concrete cases to reveal underlying logic. 

  First, I need to identify the core philosophical splits about why someone deserves a vote. The user listed several possibilities: being bound by laws, having interests at stake, competence, membership, or reciprocity. Each should branch from real-world scenarios, not abstract labels. 

  The user also wants to expose how compulsory voting fits (or doesn't) with each franchise rationale. For example: if voting is a right, compulsion feels odd; if it's a duty, compulsion makes sense. I'll flag inconsistencies where positions seem incoherent. 

  Key cases to include: 
  - A 16-year-old worker (tests age/competence/taxation) 
  - Long-term non-citizen resident (tests membership vs. subjection) 
  - Citizen living abroad (tests territoriality) 
  - Dementia patient (tests competence thresholds) 
  - Prisoner (tests forfeiture theories) 
  - Foreigner harmed by climate policy (tests "affected interests" scope) 

  I'll build branches by pitting these cases against each other. Start with the deepest split: is the franchise boundary principled or arbitrary? From there, branch into: 
  1. Subjection to coercion (laws apply to you) 
  2. Affected interests (stakeholderism) 
  3. Competence/autonomy 
  4. Membership/reciprocity 
  5. Constitutional deflationism (no deep principle) 

  Each branch will then resolve the concrete cases, showing where compulsory voting is natural (duty-based views), awkward (rights-based), or irrelevant (deflationism). The "affected interests" branch will explode into impracticality (foreign voters, future generations), forcing advocates to confront implications. 

  For compulsory voting coherence checks: 
  - Subjection view: Compulsion inconsistent unless reframed as duty 
  - Affected interests: Contradicts individual autonomy 
  - Competence view: Paradoxical (forcing the incompetent to vote?) 
  - Membership/reciprocity: Aligns with civic duty 
  - Deflationism: Purely pragmatic 

  I'll collapse branches where different principles yield identical outcomes (e.g., reciprocity and subjection might agree on non-citizen residents). The final tree will have 8 leaves, with "subjection to coercion + civic duty" as the most coherent position—it handles prisoners, non-resident citizens, and compulsion without overextending to foreigners. 

  User's hidden need: They suspect advocates haven't interrogated their own premises. The tree will force clarity by exposing trade-offs (e.g., supporting votes for 16-year-olds but not climate-affected foreigners reveals inconsistent "affected interests" logic). Marking compulsory voting tensions will show which positions are ideologically motivated versus principled.
answer: |-
  Below is a principled decision tree for franchise grounds, built from concrete cases and designed to expose incoherencies. It has **8 terminal leaves** (final positions), with compulsory voting compatibility marked explicitly. Branches are split using real-world scenarios, not labels, and identical outcomes are merged. The tree prioritizes *grounds for inclusion* over policy preferences.

  **Key to Consistency Marks:**  
  ✅ = Compulsory voting logically compatible  
  ❌ = Incompatible or contradictory  
  ⚠️ = Contingent/context-dependent (no entailment)  
  ✳️ = Empty cell (unexplored or indefensible)  

  ---

  ### **The Decision Tree**  
  **Root Question: Who decides the boundaries of the demos?**  
  *(Test case: Should non-citizen residents vote?)*  

  1. **A: "The existing demos decides (circular but pragmatic)."**  
     → *Go to Branch I (Deflationary)*  

  2. **B: "There is a universal principle defining the demos."**  
     → *Test case: Should a foreigner whose livelihood is destroyed by our climate policy vote?*  
     - **B1: No** → *Go to Branch II*  
     - **B2: Yes** → *Go to Branch III (Affected Interests)*  

  ---

  ### **Branch I: Deflationary Stability**  
  *(The franchise is whatever a stable constitution settles on; no deeper principle.)*  
  - **Grounds:** Pragmatic stability, not philosophy.  
  - **Cases:**  
    - 16-year-old worker: 🤷 Depends on current rules.  
    - Non-citizen resident: 🤷 Depends on current rules.  
    - Citizen abroad: 🤷 Depends on current rules.  
    - Dementia patient: 🤷 Depends on current rules.  
    - Prisoner: 🤷 Depends on current rules.  
    - Foreign climate victim: ❌ No (unless constitution says otherwise).  
  - **Compulsory Voting:** ⚠️ (Purely pragmatic; no entailment).  
  - **Circularity Problem:** Ignores it by design.  
  - **Leaf 1: Deflationary Pragmatism**  

  ---

  ### **Branch II: The Demos as a Bounded Community**  
  *(Test case: Citizen living abroad for 10 years?)*  
  - **IIA: "Voting requires ongoing community membership."**  
    → *Citizen abroad: ❌ No*  
    → *Test case: Non-citizen resident (20 yrs): Should they vote?*  
    - **IIA1: No** → *Go to Branch IV (Membership)*  
    - **IIA2: Yes** → *Go to Branch V (Reciprocity)*  

  - **IIB: "Voting requires subjection to coercion."**  
    → *Citizen abroad: ❌ No (not subject to laws)*  
    → *Non-citizen resident: ✅ Yes (subject to laws/deportation)*  
    → *Go to Branch VI (Subjected to Coercion)*  

  ---

  ### **Branch III: Affected Interests**  
  *(All whose interests are significantly impacted vote.)*  
  - **Grounds:** Suffering consequences → moral claim to influence.  
  - **Cases:**  
    - 16-year-old worker: ✅ Yes (taxed/affected).  
    - Non-citizen resident: ✅ Yes.  
    - Citizen abroad: ❌ No (unless directly affected).  
    - Dementia patient: ✅ Yes (interests still matter).  
    - Prisoner: ✅ Yes (subject to laws).  
    - Foreign climate victim: ✅ Yes.  
  - **Compulsory Voting:** ❌ (Forcing participation contradicts autonomy; voting is a right, not a duty).  
  - **Circularity Problem:** Ignores feasibility (who defines "significance"?).  
  - **Leaf 2: Universal Affected Interests**  

  ---

  ### **Branch IV: Cultural Membership**  
  *(Voting as ritual of belonging to a pre-political people.)*  
  - **Grounds:** Shared identity, history, or culture.  
  - **Cases:**  
    - 16-year-old: ❌ No (not full member).  
    - Non-citizen resident: ❌ No (not "one of us").  
    - Citizen abroad: ✅ Yes (still belongs).  
    - Dementia patient: ✅ Yes (lifetime membership).  
    - Prisoner: ✅ Yes (unless exile implied).  
    - Foreign climate victim: ❌ No.  
  - **Compulsory Voting:** ⚠️ (Compatible if voting = cultural duty; incoherent if voting = individual right).  
  - **Circularity Problem:** Assumes pre-existing boundaries.  
  - **Leaf 3: Ethno-Cultural Membership**  

  ---

  ### **Branch V: Reciprocity (Skin in the Game)**  
  *(Voting tied to contribution/risk.)*  
  - **Grounds:** Those sharing burdens deserve voice.  
  - **Cases:**  
    - 16-year-old worker: ✅ Yes (pays tax).  
    - Non-citizen resident: ✅ Yes (pays tax/faces deportation).  
    - Citizen abroad: ❌ No (no contribution/risk).  
    - Dementia patient: ❌ No (can't contribute).  
    - Prisoner: ❌ No (net recipient).  
    - Foreign climate victim: ❌ No (no reciprocity).  
  - **Compulsory Voting:** ❌ (Forced voting violates reciprocity; burdens must be voluntary).  
  - **Circularity Problem:** Defers to current tax/subjection definitions.  
  - **Leaf 4: Civic Reciprocity**  

  ---

  ### **Branch VI: Subjected to Coercion**  
  *(All governed by binding laws vote.)*  
  - **Grounds:** No taxation/coercion without representation.  
  - **Cases:**  
    - 16-year-old worker: ✅ Yes (bound by law).  
    - Non-citizen resident: ✅ Yes (bound/deportable).  
    - Citizen abroad: ❌ No (not governed).  
    - Dementia patient: ✅ Yes (still legally bound).  
    - Prisoner: ✅ Yes (intensively governed).  
    - Foreign climate victim: ❌ No (not subject to enforcement).  
  - **Compulsory Voting:** ✅ (If voting is a duty to legitimize coercion).  
  - **Circularity Problem:** Bootstrapped by initial consent (e.g., revolution/constitution).  
  - **Leaf 5: Coercion-Subjection Contractualism**  

  ---

  ### **Branch VII: Competence Threshold**  
  *(Voting requires cognitive capacity.)*  
  - **Test case: Dementia patient?*  
    - **VIIA: "Competence required for all":**  
      → Dementia patient: ❌ No  
      → 16-year-old: ❌ No (unless proven competent)  
      → *Leaf 6: Epistocratic Threshold*  
    - **VIIB: "Competence presumed unless disproven":**  
      → Dementia patient: ❌ No  
      → 16-year-old: ✅ Yes (presumed competent)  
      → *Leaf 7: Presumptive Competence*  

  **Leaf 6: Epistocratic Threshold**  
  - **Cases:** Non-citizen resident: ✅ If competent. Prisoner: ✅ If competent.  
  - **Compulsory Voting:** ✳️ (Incoherent: can’t force incompetents to vote competently).  

  **Leaf 7: Presumptive Competence**  
  - **Cases:** Matches Leaf 5 (Coercion-Subjection) *except* dementia patient ❌.  
  - **Compulsory Voting:** ❌ (Contradicts autonomy; competence ≠ obligation).  

  ---

  ### **Summary of Terminal Leaves & Key Diagnostics**  
  | Leaf                              | 16yo | Non-Citizen | Compulsory Voting | Coherence                          |  
  |-----------------------------------|------|-------------|-------------------|------------------------------------|  
  | 1. Deflationary Pragmatism        | 🤷   | 🤷          | ⚠️                | Avoids philosophy                  |  
  | 2. Universal Affected Interests   | ✅   | ✅          | ❌                | Impractical, ignores demos bounds  |  
  | 3. Ethno-Cultural Membership      | ❌   | ❌          | ⚠️                | Exclusionary, static               |  
  | 4. Civic Reciprocity              | ✅   | ✅          | ❌                | Excludes vulnerable populations    |  
  | 5. Coercion-Subjection            | ✅   | ✅          | ✅                | **High coherence**                 |  
  | 6. Epistocratic Threshold         | ❌   | ✅*         | ✳️                | Incoherent on compulsion           |  
  | 7. Presumptive Competence         | ✅   | ✅          | ❌                | Incoherent on compulsion           |  
  | 8. *Leaf 7 = Leaf 5 on all except dementia patient* |  

  **Identical Leaves:**  
  - **Leaf 5 (Coercion-Subjection)** and **Leaf 7 (Presumptive Competence)** agree on all cases *except* dementia patients. If dementia patients retain voting rights, they collapse into Leaf 5.  

  ---

  ### **The Circularity Problem & Empty Cells**  
  - **Solved:** Branch V (Reciprocity) and VI (Coercion) use social contract logic to bootstrap boundaries.  
  - **Ignored:** Branch I (Deflationary) and III (Affected Interests) lack solutions.  
  - **Empty Cells:**  
    - **Epistocratic + Compulsory (✳️):** Incoherent (can’t compel the incompetent).  
    - **Affected Interests + Compulsory (❌):** Contradicts individual autonomy.  

  ---

  ### **Which Leaf is Most Coherent?**  
  **Leaf 5 (Coercion-Subjection Contractualism)** is the most defensible:  
  1. **Solves circularity** via social contract foundations.  
  2. **Entails compulsory voting** as a civic duty to legitimize coercion.  
  3. **Handles key cases consistently:**  
     - 16-year-olds and non-citizen residents included (governed).  
     - Citizens abroad excluded (not governed).  
     - Prisoners included (intensively governed).  
     - Foreigners excluded (not subject to enforcement).  
  4. **Rejects arbitrary exclusion** while avoiding unbounded "affected interests."  

  **Weakness:** Dementia patients retain votes despite incapacity. If this is unacceptable, pair with a *procedural* exclusion mechanism (e.g., court-appointed guardians voting in their interest).  

  ---

  ### **How to Use This in Your Session**  
  1. Have participants **apply their views to the test cases** before labeling themselves.  
  2. **Expose compulsory voting tensions:** Ask, "If voting is a [right/duty/tool], why force it?"  
  3. **Force trade-offs:** Make them choose between excluding dementia patients (Leaf 5/7) or including foreigners (Leaf 2).  
  4. **Focus on Grounds, Not Policies:** "Why *should* 16-year-olds vote?" not "Do you support it?"  

  This tree forces clarity: If someone supports votes for non-citizen residents *and* opposes votes for foreigners affected by climate policy, they **cannot** appeal to "affected interests" and must adopt Leaf 5 (Coercion) or Leaf 4 (Reciprocity). No hand-waving allowed.
