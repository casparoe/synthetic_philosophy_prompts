  We are drafting a joint statement after an adversarial collaboration between a pessimist and an optimist about aesthetic testimony. The goal is to find common ground and clarify the disagreements.

  Brainstorming the Cruxes (the pivotal points of disagreement):

  1. **The nature of aesthetic judgment**: 
     - What is required for a genuine aesthetic judgment? Is it a belief about the aesthetic properties of an object, or does it require a personal, experiential element?

  2. **The role of testimony in forming beliefs**:
     - Can testimony alone transmit knowledge of aesthetic matters? Or is there something about aesthetic properties that makes them resistant to testimony?

  3. **The difference between knowing that a work is good and appreciating it**:
     - Can one know that a painting is beautiful without having the experience of its beauty? And is appreciation necessarily tied to experience?

  4. **The blind critic case**:
     - What does the blind critic case demonstrate? Does it highlight a fundamental epistemic limitation in aesthetics, or is it an extreme case that doesn't undermine the possibility of testimonial knowledge in more ordinary circumstances?

  5. **The ordinary case of a friend's recommendation**:
     - How do the two sides explain the common practice of relying on recommendations? Is this reliance a matter of testimonial knowledge or something else?

  Now, the joint statement:

  ---

  **Joint Statement on Aesthetic Testimony by a Pessimist and an Optimist**

  We, a pessimist and an optimist about aesthetic testimony, have engaged in a good-faith adversarial collaboration. We agree on several fundamental points and have identified the key areas of disagreement. Below, we set out our agreements, followed by a table that clearly outlines our disagreements and the cruxes on which they turn.

  **Section 1: Points of Agreement**

  We both accept the following:

  1. **Aesthetic judgment requires an evaluation of the aesthetic properties of an object**. Aesthetic properties are those that contribute to the object's aesthetic value (e.g., beauty, elegance, balance). Such judgments are not merely reports of one's own subjective feelings but involve claims about the object that are potentially intersubjective.

  2. **Testimony is a reliable source of knowledge in many domains** (e.g., history, science, everyday facts). We agree that testimony can transmit knowledge when the testifier is competent and sincere, and the recipient has no defeaters.

  3. **There is a distinction between knowing that an artwork is good and being able to appreciate it**. One can know that a painting is beautiful without currently experiencing its beauty, and even without ever having seen it. However, appreciation typically involves an experiential component: to appreciate the beauty, one must have an experience of the object that grounds that appreciation. Thus, the blind critic might know that a painting is good without being able to appreciate it in the full experiential sense.

  4. **The blind critic case is a useful thought experiment** that highlights the role of experience in aesthetics. It shows that the critic cannot have direct experiential access to the painting and must rely entirely on testimony. However, we agree that this case does not by itself settle the debate between pessimism and optimism. It may be an edge case that tests the limits of testimonial transmission in aesthetics.

  5. **In ordinary cases of aesthetic testimony** (e.g., a friend recommending a film), people often form beliefs about aesthetic value based on testimony. We agree that such beliefs can be reasonable and that they play a significant role in our aesthetic practices. However, we disagree about whether these beliefs amount to knowledge.

  6. **The dispute is not merely verbal** in the sense that we both are concerned with the same phenomena: the epistemic standing of beliefs formed on the basis of aesthetic testimony. However, we note that some of the disagreement might stem from different emphases on what counts as a "genuine" aesthetic judgment. The pessimist might require that a genuine aesthetic judgment must be based on first-hand experience, while the optimist does not. This is a substantive disagreement about the nature of aesthetic judgment, not a verbal one.

  **Section 2: Disagreements**

  We now turn to the key points of disagreement. The table below lists the cruxes, a neutral formulation of each side's position, the predictions each side makes about the blind critic case and an ordinary case (a friend's recommendation), and the evidence or arguments that both sides agree would bear on the crux.

  | Crux | Neutral Formulation of the Positions | Predictions in the Blind Critic Case | Predictions in the Ordinary Case (Friend's Recommendation) | Evidence/Arguments Bearing on the Crux |
  |------|--------------------------------------|-------------------------------------|----------------------------------------------------------|----------------------------------------|
  | **1. The Epistemic Role of Experience** | **Pessimist:** Genuine aesthetic knowledge requires first-hand experience because aesthetic properties are response-dependent and can only be known through one's own response. <br> **Optimist:** Aesthetic knowledge does not require first-hand experience; testimony can provide knowledge because aesthetic properties are objective features of the object that can be reported by others. | **Pessimist:** The blind critic cannot have aesthetic knowledge of the painting because he lacks the requisite experience. <br> **Optimist:** The blind critic can have aesthetic knowledge if the testimony is reliable and he processes it appropriately. | **Pessimist:** When a friend recommends a film, the hearer might form a belief but it does not rise to the level of knowledge until she sees it. <br> **Optimist:** The hearer can gain knowledge that the film is good from the friend's testimony. | Both sides agree that empirical studies on how people form aesthetic judgments (e.g., whether they defer to experts) and philosophical analysis of the nature of aesthetic properties would be relevant. |
  | **2. The Nature of Aesthetic Judgment** | **Pessimist:** Aesthetic judgment must be based on one's own aesthetic experience to count as a genuine judgment. <br> **Optimist:** Aesthetic judgment can be formed on the basis of testimony and still be genuine. | **Pessimist:** The blind critic's judgment is not a genuine aesthetic judgment but a second-hand report. <br> **Optimist:** The blind critic's judgment is a genuine aesthetic judgment. | **Pessimist:** The belief formed on a friend's recommendation is not a full aesthetic judgment until confirmed by experience. <br> **Optimist:** It is a genuine aesthetic judgment. | Analysis of linguistic practices (e.g., do we say "I know the painting is beautiful" without having seen it?) and the role of expertise in forming judgments. |
  | **3. The Possibility of Appreciation without Experience** | **Pessimist:** Appreciation of an artwork requires first-hand experience and cannot be achieved through testimony alone. <br> **Optimist:** While appreciation is enhanced by experience, one can have a form of appreciation based on testimony, especially if the testimony is rich and evocative. | **Pessimist:** The blind critic cannot appreciate the painting. <br> **Optimist:** The blind critic might achieve a limited form of appreciation through the descriptions, but it will be inferior to direct experience. | **Pessimist:** The hearer might know the film is good but cannot appreciate it until she sees it. <br> **Optimist:** The hearer can have some appreciation from the testimony, but it is incomplete. | Psychological studies on the effects of vivid descriptions vs. direct experience, and philosophical reflection on the concept of appreciation. |
  | **4. The Role of Expertise and Trust** | **Pessimist:** Even with a trusted and expert friend, testimony can only provide evidence that the work is good, but not aesthetic knowledge. <br> **Optimist:** A trusted and expert friend's testimony can provide aesthetic knowledge. | **Pessimist:** Even with a trusted friend, the blind critic's belief does not become knowledge. <br> **Optimist:** With a trusted and expert friend, the blind critic can gain knowledge. | **Pessimist:** The friend's recommendation provides a reason to believe but not knowledge. <br> **Optimist:** It can provide knowledge if the friend is reliable and the conditions are right. | Epistemological analysis of testimony in other domains (e.g., moral testimony) and case studies of expert testimony in the arts. |

  **Conclusion on Verbal Disagreement**: We both agree that the term "aesthetic judgment" might be used in different ways. The pessimist typically reserves the term for judgments based on direct experience, while the optimist uses it more broadly. This is not merely verbal because it reflects a deeper disagreement about the nature of aesthetic value and our epistemic access to it.

  We hope this statement clarifies the debate and provides a foundation for further discussion.

  Signed,
  [Pessimist]
  [Optimist]

