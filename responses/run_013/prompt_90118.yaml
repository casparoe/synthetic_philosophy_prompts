prompt: |-
  I am the legal adviser to a truth and reconciliation commission constituted after a twelve-year internal conflict. Our statute empowers us to recommend amnesty for politically motivated offences in exchange for full disclosure, leaves the conditions of eligibility entirely to us, and makes our recommendations binding on prosecutors; the plenary votes on the amnesty policy in three weeks, and the first hearings follow immediately after. Two provisions of the draft policy are contested. The first would require an applicant not merely to give a complete factual account of what he did but to acknowledge that the act was wrong; a minority of commissioners argues that this turns a legal proceeding into a test of conscience, and that the coerced, the frightened, and the merely polite will fake the acknowledgment to get their papers. The second would extend eligibility to those who never personally killed but designed, ordered, or signed off on the machinery, and would give victims' families a right of reply at the hearing; the draft is silent on whether their objection can block amnesty or can only be recorded in the commission's report. Please draft the written opinion I will circulate before the vote: recommend a definite policy, spell out the conditions and the test to be applied to each category of applicant, and give an honest account of the strongest objection on the losing side — that any amnesty at all tells victims the state will not affirm that what was done to them was wrong. State which consideration would change your recommendation, and where your reasoning is most likely to fail.
reasoning: |-
  Okay, this is a complex and sensitive legal advisory request from someone deeply involved in post-conflict justice. The user is a legal adviser to a Truth and Reconciliation Commission (TRC) facing critical policy decisions about amnesty eligibility. They need a pre-vote opinion addressing two contested provisions: the requirement for moral acknowledgment of wrongdoing, and extending amnesty to architects of violence rather than direct perpetrators.

  Hmm, the user operates at the intersection of legal pragmatism and moral philosophy. Their hidden concerns likely include: maintaining the commission's credibility, avoiding procedural challenges, and balancing victim catharsis against perpetrator cooperation. The tension between legal process and moral reckoning is palpable throughout their query.

  Let me unpack the core issues systematically. First, the moral acknowledgment requirement - it's essentially asking whether we can demand remorse as legal currency. The minority commissioners have a point about coerced performances, but the symbolic value for victims can't be dismissed. Then there's the command responsibility question: should planners get equal amnesty access as trigger-pullers? And how much veto power should victims' families really have?

  I recall South Africa's TRC struggled with similar dilemmas. Their amnesty committee required full disclosure but stopped short of demanding remorse. That might be the wiser precedent here. For architects of violence, we need to recognize that systemic crimes require different accountability than individual acts. Maybe tiered disclosure requirements?

  The victims' right of reply is particularly thorny. Giving them amnesty-blocking power could paralyze the process, but mere token participation risks re-traumatization. The solution might lie in separating voice from veto - let them be heard without granting decision-making authority.

  Ah, and that fundamental objection about amnesty denying moral affirmation... that's the elephant in the room. The user wants me to confront it head-on. The painful truth is that amnesties trade perfect justice for social stability. We must acknowledge this sacrifice while arguing that the alternative - endless trials or blanket impunity - serves victims worse.

  My recommendation will likely face challenges around enforceability. How do we verify "full disclosure" when archives are destroyed? What if high-level applicants give technically complete but evasive testimony? I should flag these implementation risks.

  The clincher would be if evidence emerges that the conflict's architects are using the TRC to whitewash history. That would force reconsideration of amnesty scope. But barring that, this middle path seems most viable for national healing.
answer: |-
  ## Pre-Vote Advisory Opinion: Amnesty Policy Framework

  **To:** Commissioners of the Truth and Reconciliation Commission  
  **From:** Legal Adviser  
  **Date:** [Date of Circulation]  
  **Subject:** Recommended Policy on Contested Amnesty Provisions & Ethical Foundations  

  This opinion addresses the two contested provisions of the draft amnesty policy. It recommends a specific framework grounded in our statutory mandate for "full disclosure" of "politically motivated offences," while acknowledging the profound ethical tensions inherent in any amnesty process. The goal is a policy that maximizes truth recovery, ensures procedural integrity, facilitates national reconciliation, and respects the core mandate granted to us by law.

  ### I. Recommendation on Contested Provisions

  1.  **Moral Acknowledgment Requirement ("Acknowledgment of Wrongfulness"):**
      *   **Recommendation:** **Reject** the requirement for applicants to explicitly acknowledge their acts were morally wrong.
      *   **Alternative Condition & Test:** Require **"Full Factual Disclosure with Contextual Understanding."**
      *   **Application:**
          *   **Condition:** The applicant must provide a complete, truthful, and detailed account of *what* they did, *when*, *where*, *to whom*, and *under whose authority or direction* (if applicable). Crucially, they must also disclose the *political objective or motivation* they believed the act served.
          *   **Test:** Disclosure is assessed for **Completeness, Veracity, and Specificity** based on:
              *   Corroboration (where available from commission investigations, documents, or other testimony).
              *   Internal consistency and plausibility.
              *   Level of detail provided (avoiding vague generalities).
              *   Demonstrated understanding that the acts described *were violations of law or fundamental human rights norms* (implicit in describing them factually as killings, torture, etc.), without requiring a *personal moral judgment*.
      *   **Reasoning:** While understanding the desire for moral reckoning, compelling a statement of personal remorse or moral condemnation:
          *   **Exceeds Statutory Mandate:** Our statute requires "full disclosure," not a confession of conscience. Compelling moral statements transforms a legal/truth-seeking process into a coerced exercise of conscience, raising significant ethical and potential legal challenges regarding freedom of thought.
          *   **Undermines Truth Recovery:** It creates a powerful incentive for insincere performance ("faking it") by the coerced, frightened, opportunistic, or ideologically committed, potentially contaminating the factual record we are mandated to establish. Truth is sacrificed to the appearance of contrition.
          *   **Creates an Unworkable Standard:** Objectively assessing the sincerity of a moral acknowledgment is virtually impossible and risks arbitrary decisions. Our core competency is assessing factual truth, not the state of an applicant's soul.
          *   **Symbolic Value vs. Practical Risk:** While symbolic for victims, the practical risk of distorting truth and exceeding our mandate outweighs this benefit. The factual record itself, established through full disclosure, is the most powerful testament to wrongfulness.

  2.  **Eligibility for Architects & Victims' Families' Right of Reply:**
      *   **Recommendation:** **Affirm** eligibility for those who designed, ordered, or signed off on systematic violations ("architects"). **Affirm** the right of reply for victims' families. **Clarify** that victims' families' objections **cannot block amnesty** but will be **recorded and reflected in the Commission's report and findings**.
      *   **Conditions & Test for Architects:**
          *   **Condition:** Applicants must meet the **"Full Factual Disclosure with Contextual Understanding"** standard described above, applied rigorously to their specific role.
          *   **Test:** Disclosure must detail:
              *   The specific policies, plans, or orders they designed, issued, or approved.
              *   The chain of command and decision-making process.
              *   Their knowledge (or willful blindness) regarding the likely or actual consequences of their decisions/orders for human rights.
              *   The political objective they intended to achieve.
          *   **Higher Scrutiny:** Due to the scale of harm often caused by their actions, the Commission will apply heightened scrutiny to the completeness and veracity of disclosures by this category. Vague claims of ignorance or lack of intent will be critically examined against available evidence of systemic patterns and command responsibility.
      *   **Victims' Families' Right of Reply:**
          *   **Procedure:** Families will be given a dedicated opportunity to address the Commission *after* the applicant has testified and been questioned by the Commission. Their statements may include factual corrections, personal impact statements, expressions of grief, anger, or moral condemnation.
          *   **Effect:** Family statements **inform the Commission's assessment** of the applicant's disclosure (e.g., highlighting inconsistencies or the human cost) and **contribute profoundly to the historical record and the process of national healing**. However, their objection **does not constitute a veto** on the amnesty recommendation. The legal decision on amnesty eligibility, based on statutory criteria (full disclosure of politically motivated acts), remains solely with the Commission.
          *   **Recording:** All statements will be fully recorded, transcribed, and their substance (respecting confidentiality where requested and appropriate) integrated into the Commission's final report, findings, and narrative of the conflict.
      *   **Reasoning:**
          *   **Statutory Scope:** "Politically motivated offences" logically encompass the planning and ordering of crimes, not just their physical execution. Excluding architects would create a profound injustice, shielding those often most responsible while punishing foot soldiers, and would yield an incomplete, distorted truth.
          *   **Truth Imperative:** Understanding the structural and systemic nature of the violence requires testimony from those at the policy and command levels. Their full disclosure is arguably *more* critical to the Commission's ultimate purpose than that of individual perpetrators.
          *   **Victim Dignity & Voice:** The right of reply is essential for acknowledging victims' suffering, restoring dignity, and ensuring the process isn't perpetrator-centric. It allows the human cost to be vividly presented. However, granting a veto would paralyze the process, empower individual grievances over the collective goal of establishing a comprehensive truth, and potentially violate our statutory mandate to determine eligibility based on disclosure.
          *   **Balancing Interests:** This approach balances the need for the highest-level truth with the imperative to hear victims, without surrendering the Commission's adjudicative responsibility.

  ### II. Confronting the Fundamental Objection (Losing Side Perspective)

  The **strongest and most ethically resonant objection** to the amnesty process itself, underlying much of the dissent, is this: **Any grant of amnesty, regardless of conditions, constitutes a state-sanctioned declaration that the victims' suffering does not necessitate justice.** It signals that the state will not, and cannot, affirm through its highest legal processes that what was done to victims was categorically *wrong* and deserving of punishment. Amnesty, even with disclosure, trades justice for truth and stability. For victims, this can feel like a profound betrayal, a second violation where the state that failed to protect them now refuses to condemn their tormentors in the most meaningful way – through criminal accountability. It risks conveying that their pain is expendable in the calculus of political settlement, that the restoration of order for the collective outweighs the imperative of justice for the individual. This objection argues that the very foundation of reconciliation built on such a bargain is morally compromised and risks perpetuating a culture of impunity.

  ### III. Conditions that Could Change this Recommendation

  *   **Emergence of Systematic Abuse:** If, during the initial hearings, overwhelming evidence emerges that high-level architects are systematically exploiting the "Full Factual Disclosure" standard by providing technically detailed but evasive, contextually sterile, or blatantly self-justifying testimony that *undermines the truth recovery purpose* and deeply re-traumatizes victims, reconsideration of the moral acknowledgment requirement *for this category only* might be warranted. The trigger would be a demonstrable failure of the factual standard alone to achieve meaningful truth-telling from commanders.

  ### IV. Where the Reasoning is Most Vulnerable

  1.  **Verification of "Full Disclosure":** The core weakness lies in the practical difficulty of *verifying* "full disclosure," especially for architects operating in secret or where records are destroyed. Did the commander *truly* disclose all they knew or ordered? Assessing completeness against a hidden baseline is inherently challenging and relies heavily on cross-referencing, circumstantial evidence, and the Commission's investigative resources. Applicants may disclose *just enough* to technically qualify while obscuring the full picture or their personal culpability.
  2.  **The "Mere Politeness" Problem (Architects):** While rejecting coerced moral statements, the recommendation for architects still risks accepting highly sanitized, bureaucratic, or euphemistic testimony ("operational decisions," "regrettable collateral damage") that factually details actions but deliberately obscures their brutal reality and moral gravity. The "Contextual Understanding" test aims to mitigate this but relies on Commissioners' ability to rigorously challenge such framing, which is subjective and demanding.
  3.  **Victim Satisfaction vs. National Healing:** The recommendation concedes that victims' families *will* feel justice is denied, even with a voice. The gamble is that the aggregate truth recovered and the prevention of wider impunity will foster a deeper, societal healing that ultimately benefits victims more than fragmented prosecutions of low-level actors. This is a profound wager with no guaranteed payoff.

  **Conclusion:** This framework prioritizes the Commission's statutory mandate for factual truth recovery through full disclosure, applied rigorously to all responsible actors including architects. It protects the process from the pitfalls of compelled conscience while honoring victims' voices without surrendering adjudicative responsibility. It confronts the painful reality that amnesty inherently withholds the state's fullest moral condemnation through criminal justice, arguing that the alternative paths offer victims and society less. The recommended policy presents the most legally sound, practically feasible, and ethically defensible path forward under our empowering statute to achieve the Commission's foundational goals of truth, accountability (through exposure, not punishment), and reconciliation. I urge the plenary to adopt this approach.
