  We are to list requirements, indicating which are non-negotiable and which are preferences. We must also identify any conflicts (inconsistent requirements) and the trade-offs.

  Let's break down the requirements:

  1. **Handling Missing Data** (Non-negotiable): The fairness criterion must provide a way to handle cases where the protected attribute (ethnicity) is missing (about 20% of applicants). 
