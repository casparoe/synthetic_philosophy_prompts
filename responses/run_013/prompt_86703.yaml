answer: |-
  Below is a structured specification of desiderata (requirements) for your fairness criterion, designed to address your operational, regulatory, and technical constraints. Requirements are categorized as **non-negotiable** (legally/compliance-mandated or fundamental to validity) or **preference** (practicality/actionability). Conflicts and trade-offs are explicitly mapped.

  ---

  ### **Non-Negotiable Requirements**  
  *Must hold to satisfy legal, regulatory, or core fairness obligations.*

  1. **Handles missing protected attributes**  
     *Why*: 20% of applicants have unknown ethnicity; excluding them violates audit coverage rules and risks bias.  
     *Constraint*: Metric must produce valid results when ethnicity is missing (e.g., via a "missing" group or robustness checks).  

  2. **Operates without protected attribute in model inputs**  
     *Why*: Legal prohibition on using ethnicity in underwriting decisions.  
     *Constraint*: Metric must audit model outputs (scores/decisions) using ethnicity *only* as a post-hoc grouping variable.  

  3. **Auditable at the group level**  
     *Why*: Regulatory audits require high-level summaries; individual justifications are infeasible.  
     *Constraint*: Metric must be computable from aggregate statistics (e.g., group-wise rates).  

  4. **Robust to differential label noise**  
     *Why*: "Default within 24 months" is a noisy proxy for true credit risk, and noise varies by ethnicity.  
     *Constraint*: Metric must not amplify bias (e.g., avoid over-reliance on error rates if noise correlates with group).  

  5. **Regulator-aligned disparity measurement**  
     *Why*: Regulatory scrutiny demands metrics that map to legal standards (e.g., disparate impact).  
     *Constraint*: Metric must output a standardized measure (e.g., ratio, difference) comparable to industry norms.  

  6. **Population coverage**  
     *Why*: Partial audits invite legal challenges; all applicants must be included.  
     *Constraint*: Metric must incorporate all individuals (including those with missing attributes/intersections).  

  ---

  ### **Preference Requirements**  
  *Reflect practicality, actionability, and scalability.*

  7. **Supports intersectional reporting without fragmentation**  
     *Why*: Reporting on (e.g., ethnicity × age) must yield interpretable, high-signal groups.  
     *Constraint*: Metric should enable coarse groupings (e.g., bins) or scalable summaries (e.g., additive decompositions).  

  8. **Decision-based (over score-based)**  
     *Why*: Lending decisions are binary (approve/deny); regulators focus on outcomes.  
     *Constraint*: Metric should use final decisions, not raw scores—unless scores directly map to decisions.  

  9. **Computational simplicity**  
     *Why*: Engineers need implementable specs; complex metrics delay deployment.  
     *Constraint*: Metric should avoid iterative adjustments or non-standard estimators.  

  ---

  ### **Inherent Conflicts & Trade-offs**  
  *No metric satisfies all desiderata simultaneously. Key trade-offs:*

  #### **Conflict 1: Group Fairness vs. Noisy Labels**  
  - **Conflict**:  
    - Metrics relying on *error rates* (e.g., **equal opportunity**, **predictive parity**) require accurate labels.  
    - But labels are noisier for some groups (violates *Requirement 4*).  
  - **Trade-off cost**:  
    Using error rates may falsely indicate unfairness (if noise differs by group) or mask true bias.  
  - **Resolution**:  
    Prefer metrics less sensitive to label noise (e.g., **demographic parity**).  
    *Requirement to relax*: *Robustness to differential label noise* (if regulator allows).  

  #### **Conflict 2: Intersectionality vs. Fragmentation**  
  - **Conflict**:  
    - Intersectional splits (e.g., ethnicity × age) create small cells, harming statistical power.  
    - Aggregating intersections loses granularity (violates *Requirement 7*).  
  - **Trade-off cost**:  
    Overly granular reporting → unactionable results; overly coarse → misses subgroup bias.  
  - **Resolution**:  
    Use additive fairness metrics (e.g., **disparate impact ratio** decomposable by age) or risk-controlled bands.  

  #### **Conflict 3: The Fairness Trilemma**  
  - **Conflict** (Fundamental impossibility):  
    No single metric can simultaneously satisfy:  
    - **Independence**: Equal approval rates (*demographic parity*).  
    - **Separation**: Equal error rates (*equalized odds*).  
    - **Sufficiency**: Equal prediction quality (*calibration*).  
    ...unless base default rates are equal across groups (unlikely).  
  - **Trade-off cost**:  
    Choosing one metric violates others. For example:  
    - Enforcing **demographic parity** may worsen error-rate disparities.  
    - Enforcing **equalized odds** may require unequal approval rates.  
  - **Resolution**:  
    Prioritize based on *Requirement 5* (regulator alignment):  
    - **Lending regulators typically prefer demographic parity** (disparate impact).  
    - *Requirement to relax*: *Separation* or *sufficiency* (e.g., ignore equal error rates if regulator prioritizes access).  

  #### **Conflict 4: Missing Data vs. Group Meaningfulness**  
  - **Conflict**:  
    - A "missing" ethnicity group is heterogeneous (violates *Requirement 5*).  
    - Omitting "missing" group violates *Requirement 6* (population coverage).  
  - **Trade-off cost**:  
    "Missing" group dilutes audit conclusions (e.g., may hide subgroup biases).  
  - **Resolution**:  
    Report metrics with/without the "missing" group; use sensitivity analysis.  

  ---

  ### **Which Single Requirement to Relax for Consistency?**  
  To resolve the **Fairness Trilemma** (the most severe conflict), relax:  
  - ***Robustness to differential label noise*** (if regulator accepts proxy limitations) OR  
  - ***Regulator-aligned disparity measurement*** (if regulator permits non-standard metrics).  

  **Recommendation**: Prioritize **demographic parity** (approval-rate parity) for its noise robustness, alignment with lending regulators, and compatibility with missing data. Use **sensitivity analyses** for label noise and intersections.  

  ---

  ### **Final Spec Summary**  
  Your fairness metric must:  
  1. **Non-negotiables**: Handle missing ethnicity, exclude ethnicity from the model, use group-level aggregates, mitigate label noise, align with regulators, and cover all applicants.  
  2. **Preferences**: Support scalable intersections, use binary decisions, and simplify computation.  
  3. **Trade-offs**: Accept that demographic parity may imbalance error rates, intersections require aggregation, and missing groups reduce interpretability.  

  Next step: Score candidate metrics (demographic parity, equalized odds, etc.) against this spec. Start with **demographic parity** (disparate impact ratio) as the default—it best satisfies non-negotiables in your context.
