answer: |-
  Below is a comprehensive voting procedure designed for your committee, addressing the constraints of partial ballots, simplicity, explainability in a 90-minute meeting, and no formal training required. The procedure uses a **modified Borda count** (a scoring system) because it produces a full ranking, handles partial ballots robustly, and is computationally feasible. I'll first outline the procedure step-by-step, then analyze three test cases (the cycle, a voting bloc, and a late entrant), including which of Arrow's conditions are sacrificed and why. Finally, I'll address the "chair dictatorship" question.

  ---

  ### **Voting Procedure: Modified Borda Count**
  **Why Borda?**  
  - It converts rankings into points, sums them, and produces a full ordering.  
  - Handles partial ballots by assigning unranked candidates 0 points (treated as "bottom tier").  
  - Simple to compute manually (no complex pairwise comparisons).  
  - Survives Arrow's impossibility by sacrificing **independence of irrelevant alternatives (IIA)** (a trade-off for simplicity and completeness).

  **Step-by-Step Instructions for the Committee:**  
  1. **Ballot Distribution**:  
     - Each member receives a ballot listing all applicants.  
     - They rank **as many or as few applicants as they wish** (e.g., if they only reviewed 4/7, they rank only those 4).  
     - Rankings are strict: no ties allowed on a ballot.  

  2. **Point Assignment**:  
     - For a committee with `n` applicants:  
       - Rank #1 on a ballot gets `n-1` points.  
       - Rank #2 gets `n-2` points.  
       - ...  
       - Rank `k` (last ranked) gets `n-k` points.  
       - **Unranked applicants get 0 points**.  
     - *Example*: For 7 applicants, a member ranks only 3:  
       - #1 → 6 points, #2 → 5 points, #3 → 4 points.  
       - Unranked applicants (4) → 0 points.  

  3. **Tallying Votes**:  
     - Sum points for each applicant across all ballots.  
     - Applicants ordered by total points (highest to lowest).  
     - **Tie-breaking**:  
       - Compare number of first-place rankings.  
       - If still tied, compare second-place rankings.  
       - Continue until tie is broken.  
       - If still tied, the chair decides the order.  

  4. **Output**:  
     - Full ranked list for the funder.  

  **Time and Simplicity**:  
  - **Explainable in 10 minutes**: "Rank your top candidates; higher ranks get more points."  
  - **Ballot completion**: 5–10 minutes.  
  - **Tallying**: 15–30 minutes (manual or spreadsheet).  
  - **Total**: 30–50 minutes, well under 90-minute limit.  
  - **Partial ballots**: Built-in (unranked = 0 points).  

  **Trade-offs**:  
  - Sacrifices **IIA** (adding/removing an applicant can change rankings between others).  
  - Sacrifices **strategy-proofness** (members might manipulate rankings to help/hurt applicants).  
  - Retains **non-dictatorship** and **Pareto efficiency** (if everyone prefers A > B, A ranks above B).

  ---

  ### **Test Case Analyses**
  We'll use a 3-applicant cycle (A, B, C) with 3 voters, then scale to your committee size. Points assume `n=3` (#1 = 2 pts, #2 = 1 pt, #3 = 0 pts).

  #### **Case 1: Condorcet Cycle**  
  - **Ballots**:  
    - Voter 1: A > B > C → A:2, B:1, C:0  
    - Voter 2: B > C > A → B:2, C:1, A:0  
    - Voter 3: C > A > B → C:2, A:1, B:0  
  - **Totals**:  
    - A: 2 + 0 + 1 = 3  
    - B: 1 + 2 + 0 = 3  
    - C: 0 + 1 + 2 = 3  
  - **Result**: Three-way tie.  
  - **Tie-breaking**:  
    - First-place votes: A (1), B (1), C (1) → tie.  
    - Second-place votes: A (1: Voter 3), B (1: Voter 1), C (1: Voter 2) → tie.  
    - **Chair breaks tie** (e.g., A > B > C).  

  **Arrow's Condition Sacrificed**:  
  - **Non-dictatorship**: Not violated (tie-breaking is rare and follows a rule).  
  - **IIA and strategy-proofness**: Not directly relevant here.  
  - **Core issue**: Borda avoids cycles but creates ties in symmetrical conflicts. The chair’s tie-breaking is a **values decision**—it prioritizes decisiveness over algorithmic fairness.  

  #### **Case 2: Voting Bloc (Two Members Helping a Friend)**  
  - **Scenario**: 7 applicants, 5 voters. Two members boost Applicant A and bury strong rival B.  
  - **Ballots**:  
    - Bloc Voter 1: A > C > D > E > F > G > B → A:6, B:0 (others partial)  
    - Bloc Voter 2: A > C > D > E > F > G > B → A:6, B:0  
    - Honest Voter 1: B > C > D → B:6, C:5, D:4 (others 0)  
    - Honest Voter 2: B > C > D → B:6, C:5, D:4  
    - Honest Voter 3: B > C > D → B:6, C:5, D:4  
  - **Totals**:  
    - A: 6 + 6 + 0 + 0 + 0 = **12**  
    - B: 0 + 0 + 6 + 6 + 6 = **18**  
    - C: 5 + 5 + 5 + 5 + 5 = **25** (wins)  
  - **Result**: C wins. B is second, A is third.  
  - **Analysis**:  
    - The bloc hurt B (0 points) but couldn’t overcome B’s support from honest voters.  
    - A’s low support from non-bloc voters limited its gains.  

  **Arrow's Condition Sacrificed**:  
  - **Strategy-proofness**: Violated—bloc voters manipulated rankings.  
  - **Trade-off**: Borda is vulnerable to tactical voting (e.g., "burying" rivals). This is a **values choice**: simplicity and partial ballot tolerance enable minor manipulation. Mitigate by encouraging honest rankings.  

  #### **Case 3: Late Applicant Flips the Winner**  
  - **Scenario**: Initial vote with A and B (n=2). Late applicant C joins (n=3).  
  - **Initial Vote (A vs. B)**:  
    - Voter 1: A > B → A:1, B:0  
    - Voter 2: A > B → A:1, B:0  
    - Voter 3: B > A → B:1, A:0  
    - Voter 4: B > A → B:1, A:0  
    - Voter 5: B > A → B:1, A:0  
    - Totals: A:2, B:3 → **B wins**.  
  - **Vote with C (n=3)**:  
    - Voters 1–2: A > B > C → A:2, B:1, C:0  
    - Voters 3–5: B > C > A → B:2, C:1, A:0 (strategic: they rank C above A to hurt A)  
    - Totals: A: (2+2) + (0+0+0) = **4**; B: (1+1) + (2+2+2) = **8**; C: 0 + (1+1+1) = **3**  
    - **Result**: B wins > C > A (A loses, as in initial vote).  
  - **Alternative**: If Voters 3–5 rank honestly (B > A > C):  
    - A: 2+2 + 1+1+1 = **7**; B: 1+1 + 2+2+2 = **8** → **B still wins**.  
  - **Flip Scenario**: If initial vote had A winning (e.g., 3 votes for A, 2 for B), and Voters 4–5 rank B > C > A:  
    - A: 2+2+2 + 0+0 = **6**; B: 1+1+1 + 2+2 = **7** → **B wins** (A loses due to C).  

  **Arrow's Condition Sacrificed**:  
  - **IIA**: Violated—adding C changed A vs. B ranking (A won initially but lost after C joined).  
  - **Values vs. Technical**: This is **technical** (inherent to Borda). If IIA is critical, Borda is flawed. However, IIA is often sacrificed for simplicity in real-world rankings.  

  ---

  ### **Should You Let the Chair Decide?**  
  **No—but with caveats**:  
  - **Pros of Borda**: Democratic, auditable, handles partial ballots, and meets funder requirements.  
  - **Cons**: Vulnerable to IIA and strategy (per Arrow/Gibbard-Satterthwaite).  
  - **Chair dictatorship**: Simplest but sacrifices fairness and committee buy-in. It violates **non-dictatorship** outright.  

  **Recommendation**: Use the **Borda procedure** above. It balances fairness, simplicity, and transparency. If ties or manipulation become frequent, add:  
  - A "minimum rankings" rule (e.g., members must rank ≥3 applicants).  
  - Blind applications during voting to reduce bias.  
  - A short training on strategic voting risks.  

  **Final Notes**:  
  - Arrow’s theorem means **all systems have flaws**; Borda’s IIA sacrifice is pragmatic for your constraints.  
  - The procedure’s legitimacy comes from **transparency**: members understand the trade-offs.  
  - If the committee rejects Borda, **Condorcet-Schulze** is more robust but too complex for 90 minutes.  

  This Borda-based system prioritizes your needs: speed, explainability, and full rankings. It turns a "mess" into a reproducible process.
