  ### Joke and Annotation

  **Joke Text**  
  "A man was walking down the street when two strangers blocked his path. The first said, 'Give me your wallet, and with a one-in-a-googolplex chance, I’ll create a universe of infinite joy.' The second said, 'Give it to me! I’ll create two universes of infinite joy with the same odds.' The man froze—he couldn’t choose between two infinite expected values. The first mugger upped his offer: 'I’ll double the probability!' The second shot back, 'I’ll triple it!' They bid back and forth until the first yelled, 'Fine, I’ll make it a fifty-fifty chance!' The second stammered, 'I—I’ll do that too!' The man sighed, 'Now we’re tied again.' Then he brightened. 'But if I walk away, the expected value of keeping my wallet includes the chance that a third mugger offers me three universes tomorrow. That’s also infinite!' He pocketed his wallet and left. The muggers stared after him. One muttered, 'We just got out-priced by infinity.'"

