prompt: |-
  Retired from a biology dept a few years back and I've been crashing philosophy seminars ever since — evolution and mind, mostly. There's a one-liner that keeps doing alot of work in our reading group and I've started to distrust it: 'if it's still around, it must be doing something.' Latest use: I brought up the spandrels point — that plenty of what looks like design is really a byproduct of something else, just riding along — and a guy said, well, if the feature persists it must be selected for, otherwise it'd be gone, so the byproduct story is hand-waving.

  Maybe he's right. But I suspect 'must be doing something' is smuggling in several claims at once. Can you seperate that sentence into the distinct precise things it could be saying, from the boring to the ambitious, with a verdict on each (true, false, contested, trivially true, doesn't follow), and tell me which reading he actually needs for his move against the spandrels point to go through? I think somewhere in there we slide between 'has some current effect,' 'has a function,' 'was selected for,' 'is kept around by selection,' and 'is well built for its job.' And I never can keep straight whether 'exaptation' and 'constraint' are supposed to help his case or sink it — and where drift fits, since I have a vague sense something can just linger because nothing's pushing against it. Work those in if they matter.

  I'm a scientist by training, so please be clear about where the people who actually study this disagree and where they don't — don't sell me a tidy consensus that isn't there. I'd like the byproduct story to come out respectable, but don't humor me.
reasoning: |-
  Okay, let me tackle this user's question. They're a retired biology professor now involved in philosophy seminars, focusing on evolution and mind. The key issue is the phrase "if it's still around, it must be doing something" used in their reading group. Specifically, someone countered their spandrels argument with this, claiming that persistent features must be selected for. The user suspects this phrase conflates several concepts and wants them disentangled.

  First, I need to break down the one-liner into distinct meanings. The user mentioned possible interpretations like having a current effect, having a function, being selected for, maintained by selection, or being well-designed. Each needs evaluation: true, false, contested, etc. Also, the user brought up exaptation, constraints, and drift. How do these fit into the discussion?

  Starting with the most trivial interpretation: "has some physical effect." Everything has some effect, so this is trivially true but irrelevant. The opponent probably isn't using this because it doesn't counter spandrels. Next, "has a current fitness effect." This could be positive, negative, or neutral. If a trait has a positive effect, it might be maintained, but if neutral or negative, it might persist due to other factors like drift. This is where drift and constraints come in. Neutral traits can linger without selection acting against them. So this interpretation is true but doesn't imply selection.

  Then there's "has a function." This is tricky because function often implies purpose, which in evolution means selected effect. But in spandrels, a trait might be co-opted later (exaptation), so it gains a function without originally being selected for. The opponent's claim that persistence means selected for ignores this possibility. Traits can persist as byproducts and later become functional. So this interpretation is false as a necessity.

  The strongest claim is "was selected for originally." But Gould and Lewontin's spandrels paper argues that some traits are byproducts of other adaptations. For example, the redness of blood wasn't selected for; it's a byproduct of hemoglobin's oxygen-carrying function. If such a trait isn't costly, it can persist without being selected. So this is contested but leans false. Many biologists accept that not all traits arise via direct selection.

  Another angle is "is currently maintained by selection." Even if a trait started as a spandrel, if it later provides a benefit, selection might maintain it. But the opponent's point was against the byproduct story, implying that persistence proves original selection. However, a trait could be maintained now for different reasons than its origin. Exaptation examples show this: feathers for insulation co-opted for flight. The original trait wasn't selected for flight, but now it is maintained for it. So the opponent needs this interpretation for their argument, but it's contested. Not all persistent traits are maintained by selection; some are neutral.

  The user also mentioned constraints. Developmental constraints can explain why a trait persists even if slightly maladaptive. If changing it is too costly due to interconnected systems, selection might not eliminate it. This supports the byproduct argument. Drift allows neutral traits to persist randomly, especially in small populations.

  Putting it together, the opponent needs the claim that persistence implies the trait was originally selected for or is currently maintained by selection. But both are contested. Evidence from evolutionary biology shows that traits can persist without being selected for (drift), as byproducts (spandrels), or through exaptation. The user wants the byproduct story to remain valid, and it is respected in evolutionary theory. The key is that the burden of proof is on the claimant to show selection, not assume it from persistence.

  The user's background as a scientist means they value clarity on where consensus lies. There's agreement that selection isn't the only force, but debates on specific cases. Exaptation and constraints are part of the toolkit to explain persistence without direct selection. Drift is well-established in population genetics. The spandrels concept is accepted, though its prevalence is debated. The opponent's move against spandrels only works if they conflate persistence with original selection, which isn't supported.
answer: |-
  You've put your finger on a classic and often contentious conflation in evolutionary reasoning. The phrase "if it's still around, it must be doing something" *is* smuggling in multiple distinct concepts, and your opponent's move against the spandrels argument crucially depends on conflating them. Let's break it down rigorously, separating the distinct claims within that statement, assessing their validity, and seeing which one(s) your opponent needs for his argument to work. We'll incorporate exaptation, constraint, and drift explicitly.

  Here are the distinct interpretations of "must be doing something," ranked roughly from least to most ambitious, with verdicts and relevance to the spandrels debate:

  1.  **"Has *some* physical effect on the organism or its interactions with the environment."**
      *   **Verdict:** **Trivially True, but Irrelevant.** Every physical trait *does* something in the trivial sense of having mass, occupying space, absorbing/reflecting light, interacting with forces, etc. Even a vestigial appendix has physical presence and metabolic cost. This tells us nothing about evolution or function.
      *   **Relevance to Spandrels:** Doesn't challenge the spandrel concept at all. A spandrel *by definition* has physical existence and effects – it's just that its *origin* isn't due to selection *for that effect*.

  2.  **"Has *some* current effect on fitness (positive, negative, or neutral)."**
      *   **Verdict:** **True (by definition), but Insufficient.** Any trait that persists long enough to be observed must have a fitness effect *somewhere* on the spectrum from deleterious to beneficial (including precisely neutral). Persistence implies the trait isn't *so* deleterious that it has been *completely* eliminated *yet* (especially considering drift and constraints). Neutral traits persist because nothing is strongly pushing against them.
      *   **Relevance to Spandrels:** Does not challenge the spandrel concept. A spandrel can have a neutral (or even slightly deleterious) effect initially and persist, especially if linked to a strongly selected trait (constraint) or via drift. Its persistence doesn't tell us *why* it originated or what its *original* effect was. **Drift is key here:** Traits can "linger because nothing's pushing against it." Constraints (developmental, genetic, phylogenetic) can also prevent removal of non-beneficial traits.

  3.  **"Has a *current function* (i.e., contributes positively to fitness *and* its presence is explained by that contribution)."**
      *   **Verdict:** **Contested / Often False.** While many persistent traits *do* have a current function, this is **not** a logical necessity. Many traits persist:
          *   **As Neutral Byproducts (Spandrels):** The classic example is the redness of blood – a direct biochemical consequence of hemoglobin's selected oxygen-carrying function, likely neutral itself.
          *   **Via Drift:** In small populations or for traits with very small effects, neutral or even slightly deleterious traits can fix or persist stochastically.
          *   **Due to Constraints:** A trait might be slightly deleterious but impossible to remove without disrupting essential linked functions (e.g., the path of the recurrent laryngeal nerve in giraffes).
          *   **As Vestigial Remnants:** Traits like the human coccyx or goosebumps have no current positive function for most people but persist due to lack of strong negative selection and developmental inertia.
      *   **Relevance to Spandrels:** Directly challenges the *simple* spandrel story *if* the trait has a significant *positive* effect. However, it doesn't address *origin*. A trait *originally* a spandrel can later **acquire** a function (**Exaptation**). Exaptation *sinks* your opponent's argument because it shows a trait can persist *without* an *original* function, only later gaining one. Exaptation *helps* the sophisticated spandrel/constraint view by providing a mechanism for how non-selected features can become functional. Your opponent needs to rule out current neutrality or constraint-based persistence.

  4.  **"Is *currently maintained* in the population by natural selection."**
      *   **Verdict:** **Contested / Often False.** Selection is *one* mechanism maintaining trait frequency, but not the only one. Traits can be maintained:
          *   **Neutrally via Drift:** Especially if mutation rate is low or population size is small/moderate.
          *   **Due to Lack of Variation:** If mutations eliminating the trait are rare or lethal.
          *   **Due to Constraints:** As above, preventing removal even if slightly deleterious.
          *   **Due to Pleiotropy/Linkage:** Being genetically linked to a strongly selected trait.
      *   **Relevance to Spandrels:** This is a **stronger claim** your opponent might be leaning towards. If true, it means selection is *actively* keeping the trait frequency where it is *now* (potentially due to a *current* function, or as a linked consequence). However, **this does not imply anything about the trait's *origin***. A spandrel *can* be maintained by selection *if* it later acquired a function (exaptation) *or* if it is inextricably linked to an adaptation. Constraints make this linkage argument more plausible. Your opponent needs this claim *plus* an assumption about origin to counter the spandrel origin story.

  5.  **"Was *originally selected for* its current form and/or effect." (The Strong Adaptationist Claim)**
      *   **Verdict:** **Contested / Often False.** This is the core of Gould and Lewontin's critique. Many traits arise as:
          *   **Spandrels/Byproducts:** Architectural consequences of selected changes elsewhere (e.g., chin shape as a byproduct of jaw reduction).
          *   **Exaptations:** Features selected for one function (or arising as spandrels) that later become co-opted for a new function (e.g., feathers for insulation co-opted for flight).
          *   **Results of Developmental Constraints:** The form is limited by the available "building materials" and pathways, not finely honed selection for an optimal solution.
          *   **Fixed via Drift:** Especially early in evolutionary trajectories or in small populations.
      *   **Relevance to Spandrels:** **This is the claim your opponent *absolutely needs* for his argument against the spandrels point to go through.** He is arguing that persistence *proves* the trait was *originally* a direct target of selection ("must be selected for"). **This is demonstrably false.** Examples abound:
          *   The human appendix: Persists, likely originally had a function (digestive), now largely vestigial/no positive function, not *currently maintained* by positive selection, and certainly not *selected for* its current state.
          *   Neutral genetic markers: Persist via drift, no function, not selected for.
          *   Male nipples: A developmental byproduct (spandrel) of the shared early embryonic plan, persist due to lack of strong negative selection and constraints. Not originally selected *for* being male nipples.
      *   **Exaptation:** Sinks his case. It provides clear examples where persistence is due to *later* selection for a *new* function, disproving the necessity of *original* selection for the current trait.
      *   **Constraint:** Sinks his case. Explains why non-optimal or non-functional traits persist *despite* lack of positive selection (or even with slight negative selection) because changing them is developmentally difficult or genetically costly.
      *   **Drift:** Sinks his case. Provides a mechanism for persistence *without* any selection acting positively *or* negatively on the trait itself.

  6.  **"Is 'well-built' or optimal for its job."**
      *   **Verdict:** **Often False / Contested.** Evolution produces "good enough" solutions, not optimal ones. Traits are often kludges, compromises constrained by history (path dependency), development, and pleiotropy. The Panda's "thumb" (a modified wrist bone) is a famous example of a suboptimal but functional solution arising from constraint. Persistence only implies the trait isn't bad *enough* to be eliminated, not that it's perfectly designed.
      *   **Relevance to Spandrels:** While not central to your opponent's specific counter, conflating persistence with optimality is a related adaptationist fallacy. Spandrels, exaptations, and constraint-driven traits are often *not* optimal for any role they might play.

  **The Verdict on Your Opponent's Move:**

  *   **His Argument Relies On:** Conflating "persists" with Claim 5 ("Was *originally* selected for") and/or Claim 4 ("Is *currently maintained* by selection") while ignoring or dismissing the possibilities outlined in Claim 3 (Neutrality/Constraint), Claim 2 (Drift), and the core concepts of Exaptation and Constraint.
  *   **Why His Argument Fails:** He commits the **Persistence Implies Past Selection Fallacy.** Persistence *only* necessitates that the trait hasn't been *completely eliminated* by selection *or* drift *yet*. This is entirely compatible with:
      *   **Spandrel Origin:** The trait arose as a non-selected byproduct and persists because it is neutral (or nearly so) and/or developmentally constrained.
      *   **Later Exaptation:** The trait arose as a spandrel (or for a different function), persisted neutrally/constraint-bound, and only *later* acquired a function for which it is *now* maintained by selection. Its persistence *prior* to exaptation had nothing to do with its later function.
      *   **Drift:** The trait persists randomly.
      *   **Constraint:** The trait persists because removing it is too difficult or costly.

  **The Scientific Consensus & Respectability of the Byproduct Story:**

  1.  **Consensus:** There is **strong consensus** among evolutionary biologists that natural selection is *not* the *only* process shaping organismal form. Genetic drift, developmental constraints, phylogenetic inertia, pleiotropy, linkage, and historical contingency are fundamental forces. The idea that *every* persistent feature *must* have been *directly selected for* its current form/function is rejected as simplistic adaptationism.
  2.  **Spandrels/Byproducts:** The concept of non-adaptive byproducts is **well-respected and empirically supported.** Examples like the redness of blood, male nipples in mammals, the chin (arguably), many aspects of brain structure/function, and countless molecular/genomic features are widely accepted as likely spandrels. The **debate is about the *relative frequency*** of spandrels vs. direct adaptations for complex phenotypic traits, *not* their existence.
  3.  **Exaptation:** This is **widely accepted and crucial.** It's a fundamental mechanism for evolutionary innovation. Feathers (insulation -> flight), bird wings (thermoregulation -> flight), countless enzyme functions – exaptation is pervasive. It explicitly separates the *origin* of a trait from its *current maintenance*.
  4.  **Constraints:** Developmental, genetic, and physical constraints are **central to modern evolutionary developmental biology (Evo-Devo).** They explain limits to variation, channel evolutionary paths, and account for the persistence of suboptimal designs. They are essential for understanding why organisms aren't infinitely perfectible.
  5.  **Drift:** The role of neutral evolution and genetic drift is **foundational in population genetics**, solidified by the Neutral Theory. It explains massive amounts of molecular variation and persistence and influences trait evolution, especially in small populations or for traits with small selective coefficients.

  **Conclusion:**

  Your distrust of the one-liner is well-founded. "If it's still around, it must be doing something" is scientifically sloppy shorthand that often smuggles in the strong, contested, and often false claim that persistence implies *original selection for* the trait. Your opponent's counter to the spandrels point relies entirely on this conflation.

  The byproduct story (spandrels) is a **perfectly respectable and necessary part of modern evolutionary theory**, alongside exaptation, constraints, and drift. Persistence alone tells us very little about *why* a trait exists. It only tells us it hasn't been eliminated. To understand a trait's origin and current maintenance requires careful analysis of phylogeny, development, genetics, and ecology – not a simplistic appeal to persistence. Your philosophical reading group would benefit greatly from distinguishing these concepts rigorously. Don't let the adaptationist bulldozer flatten the rich landscape of evolutionary processes.
