  I should make sure to connect why conditional convergence is a problem for decision theory. Expected utility should guide rational choices, but if the value depends on how you calculate it, that's a fundamental issue. The Altadena game serves as a useful contrast because, with positive payoffs, bounded utility resolves it cleanly. 

