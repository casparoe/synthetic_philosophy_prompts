  I'm a journalist working on a feature about decision theory and the weird games philosophers invent, and I'm stuck on the Pasadena game. I think I've got the gist: it's basically the St. Petersburg game, where the payoffs keep doubling, so the expected value blows up to infinity, and that's why it's undefined. My understanding is that the standard fix for St. Petersburg is to use a bounded utility function, so the infinite expectation becomes finite and well-defined. So my question is: why don't decision theorists just do the same thing for the Pasadena game? If we replace dollars with utility and cap utility at some finite maximum, doesn't the expected utility become a perfectly well-defined number? Then the paradox dissolves, right?

  I feel like I'm missing something, because people keep writing about the Pasadena game as if it's a deeper problem than St. Petersburg, but I can't see why. Is it just that the payoffs alternate in sign or something? I'd love a clear explanation I can use in the piece, because I don't want to tell readers that the fix is obvious if it isn't. Also, someone mentioned an Altadena game to me and I nodded along, but I have no idea how it fits in.
