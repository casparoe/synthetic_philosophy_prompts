answer: |-
  Here’s your requirements list for evaluating theories of "the will of the people," structured as requested, with key clashes and contender assessments.

  ---

  ### **The List: Desiderata for an Adequate Theory**  
  *(~650 words)*  

  1. **Coherence (Non-Negotiable)**  
      *Case:* A population where each individual has perfectly consistent, transitive preferences (A>B>C>A), yet the aggregated group preference cycles intransitively (A>B, B>C, but C>A), violating rationality.  
      *Why it bites:* If "the will" is incoherent (e.g., prefers Policy A to B, B to C, but C to A), it cannot guide stable policy or ground authority. Arrow’s Theorem proves no aggregation method can *always* produce coherent group preferences from individual rankings while satisfying basic fairness conditions. Any theory claiming a singular "will" must confront this.  

  2. **Responsiveness to Actual Preferences (Non-Negotiable for Descriptive Theories)**  
      *Case:* Polls show 60% support Policy X when framed as "security," but 60% oppose the same policy when framed as "surveillance." Or: The same electorate votes differently on identical proposals in consecutive elections.  
      *Why it bites:* If a theory ignores context-dependent, unstable, or manipulated preferences, it risks being ideological fiction. Must account for how framing, misinformation, or temporal mood shifts affect expressed "will."  

  3. **Protection Against Tyranny of the Majority (Normative, but Widely Demanded)**  
      *Case:* A majority votes to permanently disenfranchise or expropriate a minority (e.g., 90% vote to seize property of 10%).  
      *Why it bites:* Legitimacy requires limits on majoritarian power. If "the will" licenses permanent oppression, it becomes self-defeating for liberal-democratic orders. Rousseau’s general will excludes such "particular" wills, but minimalist theories often lack this filter.  

  4. **Intergenerational Authority (Critical for Constitutional Democracies)**  
      *Case:* A founding generation ratifies a constitution forbidding religious tests for office. A later majority votes to impose one, claiming *their* will is sovereign.  
      *Why it bites:* Can a past "will" bind future people? Theories must resolve whether "the people" is a transgenerational entity or a snapshot of current majorities. Failing this invites constitutional crisis.  

  5. **Boundary Sensitivity (Non-Negotiable)**  
      *Case:* Who counts as "the people"? Non-citizen residents? Minors? Disenfranchised groups? Deciding membership *democratically* requires prior boundaries (a circle).  
      *Why it bites:* "The people" cannot be defined by its own will without circularity. Theories must address how boundaries are set (e.g., historically, coercively, or discursively) without appealing to democratic legitimacy.  

  6. **Distinction Preservation (Non-Negotiable)**  
      Must **not** collapse:  
      - *Actual vs. Ideal Will:* What people *do* will vs. what they *should* will if rational/informed (Rousseau’s distinction).  
      - *Unitary vs. Aggregate:* A single emergent will vs. summed individual preferences.  
      - *Settled vs. Transient Will:* Enduring consensus vs. ephemeral majority mood.  
      *Why it bites:* Conflating these enables authoritarian manipulation (e.g., "You *really* will X, even if you say otherwise").  

  7. **Non-Dictatorship & Equality (Formal Constraint)**  
      *Case:* Arrow’s Theorem requires that no single voter dictates outcomes (non-dictatorship) and all preferences are weighted equally (unrestricted domain).  
      *Why it bites:* If a theory implies a de facto "interpreter" (e.g., a leader) defines the will, it violates core democracy.  

  ---

  ### **The Clash: Irreconcilable Tensions**  
  *(~250 words)*  
  The core tension is **between Coherence and Responsiveness**, amplified by formal impossibility theorems:  
  - **Arrow’s Theorem** proves no voting system can *simultaneously* guarantee Coherence, Non-Dictatorship, Unrestricted Domain, and Independence of Irrelevant Alternatives.  
  - **Condorcet’s Paradox** shows that majority preferences can cycle irrationally even if all individuals are rational.  
  - **McKelvey’s Chaos Theorem** adds that with multiple policy dimensions, any outcome can be manipulated by agenda-setting.  

  **Your suspicion is correct:** A theory cannot be both *fully descriptive* (perfectly responsive to actual, mutable preferences) and posit a *coherent, unitary will* that legitimizes authority.  
  - **Heavy-Lifting Requirement:** **Coherence** is the killer. To deliver a singular, rational "will," theories must either:  
    - *Filter* preferences (e.g., Rousseau: only "general" non-tyrannical wills count), sacrificing Responsiveness.  
    - *Impute* rationality (e.g., "If people knew better, they’d will X"), risking paternalism.  
    - *Abandon descriptivism* entirely (e.g., constructivism: "the people" is performatively created).  

  Minimalist proceduralism avoids this by rejecting Coherence as necessary—legitimacy comes from process, not output rationality. But this fails your friend’s demand for a substantive "will" that can be "betrayed."  

  ---

  ### **Where the Obvious Contenders Land**  
  *(~200 words)*  

  1. **Rousseau’s General Will**:  
     - *Meets:* Coherence (only non-contradictory, common-interest wills), Anti-Tyranny (rejects "particular wills").  
     - *Fails:* Responsiveness (actual preferences ≠ general will), Boundary Sensitivity (assumes pre-political community).  
     - *Tension:* Requires a Legislator to "discover" the general will, risking paternalism.  

  2. **Minimalist Proceduralism (Schumpeter, Przeworski)**:  
     - *Meets:* Responsiveness (will = election results), Non-Dictatorship.  
     - *Fails:* Coherence (accepts cycling/instability), Anti-Tyranny (majority rule has no limits), Intergenerational binds.  
     - *Tension:* Reduces "will" to ephemeral majorities—vulnerable to your framing cases.  

  3. **Constructivism (Laclau, Müller)**:  
     - *Meets:* Boundary Sensitivity ("the people" is discursively constituted), Distinction Preservation (no "real" will beyond claims).  
     - *Fails:* Coherence and Responsiveness (rejects fixed will; it’s contingent and political).  
     - *Tension:* Risks making "will" purely strategic—no ground to condemn demagoguery.  

  **Conclusion**: No theory satisfies all desiderata. Your friend’s view likely fails *Coherence* and *Boundary Sensitivity*, mistaking majority preference for a metaphysical "will." The phrase isn’t empty, but its deployment as a singular, stable entity is indefensible empirically—it’s always a contested political claim.
