     3. The linearity of spending: In reality, spending more resources doesn't necessarily linearly increase the chance of winning, and there might be diminishing returns or thresholds.

     Scaling:
     - For 12 participants: 3 blocs of 4, and reduce the planks to 5. Remove one of the planks (e.g., remove National Security). Adjust the weights and the interaction.
     - For 30 participants: 6 blocs of 5, and add 2 more planks. Ensure there are enough pairwise trades.

