  ### Workshop Design: Value Trade Simulation

  **Core Mechanics**: Four value-based blocs negotiate over six policy planks. Each bloc has private weights for each plank and must win its bedrock plank. Baseline inefficiency arises from misallocated effort and a forced bedrock collision. Negotiations allow trading (e.g., "I'll let you win Plank X if you let me win Plank Y"). Gains come from reallocating chits to win differently valued planks, but the most beneficial trade is between ideologically opposed blocs.

  ---

  ### **Planks, Weights, and Matrix**
  **Plank Descriptions** (morally loaded, non-identity):  
  1. **Animal Autonomy**: Ban all commercial animal testing *even if it slows medical progress*.  
     *Why*: Forces clash between species ethics and human welfare.  
  2. **Meritocratic Allocation**: Assign societal rewards strictly by measurable contribution *even if it increases inequality*.  
     *Why*: Tests fairness vs. efficiency in resource distribution.  
  3. **Intergenerational Equity**: Prioritize environmental restoration over present economic growth *even at significant cost to current jobs*.  
     *Why*: Highlights sacrifice for future generations.  
  4. **Absolute Free Speech**: Protect hate speech from legal consequences *even when it causes psychological harm*.  
     *Why*: Pits liberty against communal well-being.  
  5. **Community Solidarity**: Mandate wealth redistribution to support the disadvantaged *even if it reduces overall GDP*.  
     *Why*: Challenges self-reliance vs. collective responsibility.  
  6. **Preventive Authority**: Allow indefinite state detention of "high-risk" individuals *without trial or public evidence*.  
     *Why*: Balances security against due process.

  **Value Blocs and Private Weights** (1–10 scale; bedrock starred):  
  - **A: Ecological Integrity** (weights: 1:3, 2:1, 3*:10, 4:2, 5:8, 6:4)  
    *Bedrock*: Intergenerational Equity (Plank 3).  
  - **B: Individual Prosperity** (weights: 1:1, 2*:10, 3:2, 4:8, 5:3, 6:6)  
    *Bedrock*: Meritocratic Allocation (Plank 2).  
  - **C: Communal Care** (weights: 1:7, 2:2, 3:8, 4:4, 5*:10, 6:3)  
    *Bedrock*: Community Solidarity (Plank 5).  
  - **D: Unconstrained Liberty** (weights: 1:2, 2:4, 3*:10, 4:9, 5:1, 6:8)  
    *Bedrock*: Intergenerational Equity (Plank 3) — *overlap with A, causing unavoidable collision*.

  ---

  ### **Baseline Outcome & Best Trade**
  - **Baseline Chit Distribution** (no negotiation):  
    - A: Plank 3:8, Plank 5:7, Plank 1:5  
    - B: Plank 2:7, Plank 4:8, Plank 6:5  
    - C: Plank 5:9, Plank 3:6, Plank 1:5  
    - D: Plank 3:9, Plank 4:6, Plank 6:5  
  - **Baseline Winners & Scores**:  
    - Plank 1: A wins (5 > C:5 — tiebreak to A) → **A:3**  
    - Plank 2: B wins (7) → **B:10**  
    - Plank 3: D wins (9 > A:8, C:6) → **A:0** (loses bedrock), **D:10**  
    - Plank 4: B wins (8 > D:6) → **B:8**  
    - Plank 5: C wins (9 > A:7) → **C:10**  
    - Plank 6: B wins (5 > D:5 — tiebreak to B) → **B:6**  
    **Scores**: A=3, B=24, C=10, D=10. *A fails bedrock (Plank 3), so score stands but cannot accept deals without winning Plank 3*.

  - **Best Available Trade (A and D)**:  
    - A drops Plank 1 (saves 5 chits), shifts to Plank 3:13 (wins against D’s 9).  
    - D drops Plank 6 (saves 5 chits), shifts to Plank 4:11 (wins against B’s 8).  
    - New winners:  
      - Plank 3: A wins → **A:10**  
      - Plank 4: D wins (11) → **D:9**  
      - Plank 6: B wins (5, uncontested) → **B:6**  
    - **New Scores**: A:10 (Plank 3) + 8 (Plank 5) = 18 (+15), D:10 (Plank 3) + 9 (Plank 4) = 19 (+9). B:10 (Plank 2) + 6 (Plank 6) = 16 (-8). C:10 (unchanged).  
    **Gain**: +24 collective points, but B loses, and A/D (ideologically distant) benefit most.

  **Three Mutually Beneficial Bilateral Trades**:  
  1. **A and C**: A wins Plank 3 (D drops effort), C wins Plank 5 uncontested. Gains: A +7, C +0 (but secures bedrock).  
  2. **B and D**: B wins Plank 6 uncontested, D wins Plank 4. Gains: B +0, D +3.  
  3. **A and D**: As above, gains +15 (A) and +9 (D).  

  **Largest Gain Pair**: A (eco-focused) and D (liberty-focused) have least overlap (weights correlate at r=-0.8), creating distasteful efficiency.

  ---

  ### **Materials List**
  - **For each bloc (×4)**:  
    - Private weight card (bloc name, weights, bedrock marked).  
    - 2 chit allocation sheets (rounds 1 and 2).  
    - 20 physical chits (e.g., poker chips).  
  - **Shared**:  
    - Plank description cards (displayed).  
    - Master scoreboard (blocs, planks, winners, scores).  
  - **Facilitator**: Timer, calculator, markers.

  ---

  ### **Minute-by-Minute Timeline**
  - **0–5 min**: Facilitator intro (script below).  
  - **5–10 min**: Distribute materials. Explain rules:  
    - "Spend 20 chits across 6 planks. The bloc with *most chits* on a plank *wins* it. Your score = sum of weights of planks you win. Bedrock: Spend ≥6 and *never* accept a deal where you lose it."  
  - **10–20 min**: **Round 1 (no talk)**. Blocs allocate chits privately.  
  - **20–25 min**: Collect sheets. Reveal winners/scores on board. Highlight bedrock failure (A).  
  - **25–60 min**: **Negotiation round**. Blocs talk, show weights, form deals. Submit *joint* sheets if agreed.  
  - **60–65 min**: Collect final sheets.  
  - **65–75 min**: Reveal round 2 results. Contrast scores.  
  - **75–90 min**: Debrief (structure below).

  ---

  ### **Facilitator Script (First 5 min)**  
  "Welcome. You’ll negotiate policy across six contested issues today. Each bloc has core values. Your goal: Win planks you care about.  
  Rules:  
  - Spend 20 chits. The bloc with the *most* chits on a plank *wins* it.  
  - Your score = sum of weights on your *winning* planks.  
  - One plank is your *bedrock*. Spend at least 6 on it, and *never* settle for losing it.  
  - First round: No talking. Second round: Negotiate freely.  
  Questions? Begin chit allocation now."

  **What NOT to say until debrief**:  
  - Avoid "trade," "efficiency," "utilitarianism," or "incommensurable values."  
  - If a participant says, "This is utilitarianism with extra steps!" → "Interesting. How does that play out in your bloc’s strategy?"  
  - If someone names "logrolling" early → "Keep exploring; we’ll unpack that later."

  ---

  ### **Debrief Script**  
  **Map Observations to Concepts**:  
  1. **"Free Plank" moment** (e.g., Plank 6 baseline): "When bloc B won Plank 6 with 5 chits because no one contested it. *Why?* Others valued it low. Shows low-effort wins when values misalign."  
  2. **Largest Trade (A-D)**: "A and D gained most but are opposites. Why was this *uncomfortable*? Trading with 'enemies' feels like endorsing their values."  
  3. **Bloc B’s loss**: "B lost 8 points post-trade. *Why didn’t they see it coming?* Externalities — deals between others can hurt you."  
  4. **Bedrock collision (A/D on Plank 3)**: "A and D both needed Plank 3 but couldn’t win simultaneously. The 'pure waste' — you spent chits to fight, not to win new value."  
  5. **Refusals**: "Did any bloc reject a beneficial deal? Why? Perhaps bedrock violation or moral distaste (e.g., A refusing D’s offer to trade Plank 1 for Plank 3)."  

  **Concept Synthesis**:  
  - "You experienced *issue-trading*: Trading wins on low-value issues to gain high-value ones. Both sides profit because values differ."  
  - "Why is this *disturbing*? Splitting the difference feels fair but leaves value on the table. Trading feels dirty but creates gains. It forces cooperation with opponents."  
  - **The Elephant in the Room (common scale)**: "Scores assumed weights are comparable across blocs. But *should* we reduce ethics to numbers? Real objections: Values may be incommensurable, or trading may legitimize immoral positions. This sim simplifies — but the gains you saw are real *if* you accept the scale."

  ---

  ### **Predictable Problems & Fixes**  
  1. **Blocs misallocate baseline chits** (e.g., spread chits evenly).  
     - *Fix*: Remind, "Focus on what you *most* want to win."  
  2. **Negotiations stall** (e.g., distrust between A and D).  
     - *Fix*: Circulate and prompt: "What does the other bloc care about that you don’t?"  
  3. **Grand coalition attempts fail** due to bedrock clash (A/D on Plank 3).  
     - *Fix*: Let it implode; point out in debrief: "Some conflicts are irreconcilable."  
  4. **"Unfair!" when externalities hit** (e.g., B loses post A-D trade).  
     - *Fix*: "Note how others’ deals affected you. Real-world parallel: Trade agreements harming third parties."

  ---

  ### **What the Activity Cannot Reproduce (Frank Note)**  
  1. **Common Scale Assumption**: The simulation requires weighting values on a shared numeric scale. The strongest objection denies this: *Moral commitments are incomparable and degrade when quantified*. Facilitator: "This model *presumes* comparability. If you reject that, gains are illusions. But if you accept it, trading is powerful. Where do you stand?"  
  2. **Dehumanization of Trade**: Real-world deals involve emotional/symbolic costs (e.g., "shaking hands with evil"). The sim reduces partners to utility functions.  
  3. **Long-Term Trust**: One-off negotiation ignores reputation or future interactions.  
  4. **Power Imbalances**: All blocs have equal chits; reality has asymmetric resources.  

  *Strongest Feature Missing*: The activity cannot capture the *phenomenological unease* of trading with ideological enemies. Participants feel it, but the debrief must articulate why: "Trading across values feels like moral betrayal because it demands cooperating with those you deem wrong on issues you deem sacred."

  ---

  ### **Scaling & Variants**  
  - **12 Participants**: 3 blocs (remove D). Reduce to 5 planks (drop Plank 6). Adjust weights to preserve trades (e.g., A/B collision on Plank 3).  
  - **30 Participants**: 6 blocs (add "Techno-Optimists" and "Tradition-Keepers"). Add 2 planks (e.g., "Digital Privacy" and "Cultural Preservation"). Ensure 3+ bilateral trades exist. Keep tables of 5; negotiation stays peer-driven.  
  - **Lottery Variant**: Not worth it. Coin-flip alternatives (e.g., "50% chance of Platform X vs. Y") add complexity but dilute the trading lesson. In 90 minutes, stick to core.  

  **No prize needed** — the cognitive tension is the reward. Run it as-is.
