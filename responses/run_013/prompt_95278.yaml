  - The payoffs are: for the first heads on flip n, the payoff is (-1)^{n-1} * 2^n / n.
  - The expected value, if computed naively by summing the series in the natural order, is the alternating harmonic series: 1 - 1/2 + 1/3 - 1/4 + ... = ln(2) ≈ $0.69.
  - However, the series is conditionally convergent: the positive terms alone (1, 1/3, 1/5, ...) sum to infinity and the negative terms alone (-1/2, -1/4, ...) sum to negative infinity. Therefore, by rearranging the terms, we can get any real number as the sum.
  - Thus, the expected value is undefined.

