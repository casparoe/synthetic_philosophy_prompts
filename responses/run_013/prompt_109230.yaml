answer: |-
  ## Twin Roads

  The streetlamp bleeds on rain-slicked tar,  
  The windshield wipers beat their arc.  
  A corner takes them, near and far,  
  Drawn by the same distracted spark.  
  A hand drops down, the screen's glow blooms,  
  Three seconds lost in private rooms.  
  The same wet night, the same quick glance,  
  The tires roll on, leaving chance.  

  The streetlamp bleeds on rain-slicked tar,  
  The windshield wipers beat their arc.  
  A corner takes them, near and far,  
  Drawn by the same distracted spark.  
  A hand drops down, the screen's glow blooms,  
  Three seconds lost in private rooms.  
  The same wet night, the same quick glance,  
  **The small life ends beneath the chance.**  

  What difference wrought? What ledger holds  
  The cost of that chance, bought and sold?  
  The rain still falls. The night is cold.  
  The story stays, forever told.

  ---

  ### Philosophical Context (Plain Prose)

  *   **Common Ground:** Philosophers generally agree this scenario illustrates "moral luck" (the term you noted, not used in the poem). They agree the *physical actions and internal states* of the two drivers were identical up to the moment of impact (or lack thereof). They agree society *will* judge them differently (legally, morally, personally) solely because of the outcome.
  *   **Contested Points (Where the Poem Holds the Door Open):**
      *   **Should we judge them differently?** This is the core debate. Some (like Bernard Williams and Thomas Nagel, who named the problem) argue our deep intuitions about responsibility *are* tied to outcomes, making different judgments inevitable and perhaps even appropriate. Others (like Kantians or consequentialists aiming for consistency) argue the *intention* and *action* were identical, so blame/praise should be identical regardless of luck. The poem *shows* the differing societal judgment without saying if it's *right*, fulfilling your request.
      *   **Does the outcome change *who they are*?** This is deeply contested. Some argue the driver who killed the child *becomes* a different kind of person (a killer) through the event, regardless of intent. Others argue their essential moral character or fault remains identical to the other driver; only circumstances changed. The poem ("different people in the eyes... of themselves") *implies* this internal change likely happens but doesn't *endorse* it as philosophically correct.
      *   **Can we "train out" the differing reactions?** Strongly contested. Some believe we *should* and *can* strive for judgments based solely on controllable factors (intention, recklessness). Others believe our reactive attitudes (guilt, blame, remorse) are fundamentally tied to outcomes and cannot/should not be eradicated. The poem's coda ("What difference wrought? What ledger holds...") reflects the *questioning* inherent to this debate, not an answer.
  *   **Where the Poem Quietly Leans (Subtly):** The phrase "beneath the chance" in the altered line subtly personifies "chance" as the active, crushing force. While neutral in describing the event, this wording *might* faintly echo the view that the outcome was truly a matter of luck, a brute external factor, potentially downplaying any inherent difference in the driver's *deed* at the crucial moment. However, it avoids explicitly endorsing the view that luck *absolves* the driver. The coda's questioning tone ("What difference wrought?") leans towards the *puzzlement* central to the problem, arguably aligning more with the view that the *disparity* in judgment is philosophically troubling, even if inevitable. It doesn't take a strong stand *for* either side of the "should we judge differently" debate.
