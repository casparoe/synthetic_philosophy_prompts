  ### Research Proposal: Epistemic Foundations of Iterated Elimination with Mixed Strategies and Order-Dependence  

  **Title:** Rationality, Hypothetical Mixtures, and Order-Dependence: Re-Evaluating the Epistemic Basis of Iterated Dominance  

  #### 1. Core Research Question  
  The proposal addresses two interlinked puzzles in the epistemic foundations of iterated dominance:  
  **(A) The role of hypothetical mixtures in strict dominance:** Does the equivalence between "strictly dominated" and "never a best response" (NBR) break under iteration when mixtures serve as eliminators, particularly in games with ≥3 players? Does this undermine the canonical rationality story ("no rational player chooses dominated strategies, and this is common knowledge")?  
  **(B) Order-dependence in weak dominance:** Can we define a non-arbitrary epistemic condition (e.g., robustness to belief perturbations) that resolves order-dependence in iterated weak dominance (IEWDS), or does order-dependence imply an inherent ambiguity in "rationality"?  

  *Sharpened sub-questions (open/settled):*  
  1. **Open:** In 3+-player games, does iterated strict dominance by mixed strategies (IESDS) eliminate strategies that *are* best responses to *correlated* beliefs? If so, does this create a divergence between IESDS and rationalizability under common knowledge of rationality (CKR)?  
     - *Settled background:* In 2-player games, strict dominance ⇔ NBR (Pearce 1984). In 3+-player games, strict dominance by independent mixtures ⇒ NBR for independent beliefs, but *not* for correlated beliefs (Brandenburger & Dekel 1987). Iteration amplifies this gap.  
  2. **Open:** Does IESDS permit "epistemically inconsistent" eliminations—where a strategy σ is eliminated by a mixture that is itself dominated *in later rounds*—violating the stepwise rationality justification?  
     - *Settled background:* IESDS is order-independent for strict dominance (Osborne & Rubinstein 1994). But if mixtures used for elimination are later removed, the epistemic story ("players consider mixtures when assessing dominance") may conflict with actual play.  
  3. **Open:** For IEWDS, does there exist a total order (e.g., based on dominance "strength") that yields a unique minimal set, aligning with a refined epistemic condition (e.g., ε-rationality)?  
     - *Settled background:* IEWDS is order-dependent (Rochet 1985). No canonical order exists; the weak rationalizability set contains all possible IEWDS outcomes (Samuelson 1992).  

  #### 2. Proposed Research Focus  
  **Primary question:** *Does IESDS preserve the "never a best response" property under iteration in multi-player games when mixtures are eliminators, and what does this imply for the epistemic justification of elimination?*  
  - **Why existing treatments leave this open:**  
    - Analyses of IESDS often assume 2 players or focus on convergence, not stepwise epistemic consistency (e.g., Gilboa et al. 1990).  
    - The role of mixtures as *eliminators* (not just as possible strategies) is underexplored. Mixtures may be "hypothetical" (never played) but still justify elimination—this tension is unresolved.  
    - For ≥3 players, the divergence between independent vs. correlated rationalizability is known, but its impact on iterative elimination’s epistemic story is not characterized.  

  #### 3. Methodology  
  **Brute-force exploration of small games** is the *right tool* for this conceptual question:  
  - **Scope:** All 3-player, 2×2×2 and 3×3×3 games with payoffs in {0,1,2,3} (finite set: ~10^6 games).  
  - **Procedure:**  
    1. **Strict dominance (Question A):**  
       - For each game, compute:  
         - IESDS elimination sequence (using mixed dominators).  
         - Stepwise "NBR" status under independent/correlated beliefs.  
         - Rationalizable sets (independent vs. correlated).  
       - Identify games where:  
         - A strategy eliminated by IESDS is a best response to correlated beliefs *at that step*.  
         - A mixture eliminating σ is later dominated (testing epistemic inconsistency).  
    2. **Weak dominance (Question B):**  
       - Implement all possible elimination orders for IEWDS.  
       - Measure "dominance strength" for each strategy (e.g., # of dominating mixtures, payoff margin).  
       - Test if a total order (e.g., descending by dominance strength) minimizes/maximizes the surviving set.  
       - Compare to perturbed-belief models (e.g., ε-trembles).  
  - **Tools:** Python + Gambit library for game enumeration; SQLite for tracking elimination sequences.  

  #### 4. Expected Results & Failure Modes  
  - **Success scenarios:**  
    - **Result A1:** In ≥3-player games, IESDS eliminates strategies that are best responses to correlated beliefs → epistemic justification requires belief independence.  
    - **Result A2:** "Epistemically inconsistent" eliminations occur only in edge cases (e.g., cycles) → the rationality story holds robustly.  
    - **Result B:** No total order resolves IEWDS dependence, but simultaneous elimination yields a set consistent with ε-rationality → recommends a new solution concept.  
  - **Failure conditions:**  
    - No epistemically inconsistent IESDS cases found → suggests mixtures are benign eliminators.  
    - IEWDS shows no structure across orders → order-dependence is irreducibly arbitrary.  
  - **Novel contribution:** A taxonomy of games where epistemic justification fails, and prescriptive fixes (e.g., "restrict eliminators to rationalizable mixtures").  

  #### 5. Feasibility for 10-Week Summer Project  
  - **Timeline:**  
    - Weeks 1–2: Game generation pipeline; IESDS/NBR code.  
    - Weeks 3–5: Full 2×2×2 analysis; characterize IESDS-NBR divergence.  
    - Weeks 6–7: IEWDS order-dependence experiments.  
    - Weeks 8–9: Epistemic interpretation; write-up.  
  - **Risks:**  
    - 3×3×3 games (10^4 more than 2×2×2) may be computationally heavy → prioritize 2×2×2 and sparse 3×3×3 sampling.  
    - Conceptual clarity may require iterative refinement → build simple GPT-4-assisted game explorers.  
  - **Why feasible:** Small-game focus avoids intractability; key insights emerge from extreme cases.  

  #### 6. Broader Implications  
  - **Conceptual:** Challenges "rationality" as a static concept; exposes gaps in textbook CKR stories.  
  - **Practical:** Informs algorithm design for game solvers (e.g., when to allow mixed eliminators).  
  - **Philosophical:** Highlights game theory’s unexamined assumptions about counterfactuals (mixtures as hypothetical threats).  

