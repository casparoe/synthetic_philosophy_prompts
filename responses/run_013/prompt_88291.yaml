  **Research Questions:**
  1. In multi-player games, does the equivalence between strict dominance by mixed strategies and never being a best response break down when beliefs are allowed to be correlated? How does this affect the epistemic justification of iterated elimination?
  2. Can we define a canonical order for the elimination of weakly dominated strategies that aligns with a natural epistemic condition, or does the order-dependence indicate a fundamental ambiguity in the concept of rationality?

  **Existing Literature and Open Issues:**
  It is known that in two-player games, a strategy is strictly dominated by a mixed strategy if and only if it is never a best response to any belief (independent or correlated). In multi-player games, this equivalence holds only for independent beliefs; with correlated beliefs, a strategy may be strictly dominated by an independent mixed strategy but still be a best response to a correlated belief. However, the implications for the iterated elimination process and its epistemic justification have not been fully explored. Similarly, the order-dependence in weak elimination is known, but the search for a canonical order or an epistemic condition that resolves the ambiguity is ongoing.

  **Methods:**
  We will use a combination of theoretical analysis and computational experimentation on small games. 
  - For question 1, we will construct multi-player games (focusing on three-player games with 2 or 3 strategies per player) where a strategy is eliminated by IESDS but is a best response to a correlated belief. We will then use epistemic game theory to model the players' reasoning and show why the elimination is not justified without the independence assumption. 
  - For question 2, we will implement various orders of elimination for IEWDS (e.g., by the number of dominating strategies, by the size of the region of dominance, or randomly) on a set of small games and compare the surviving sets. We will also test simultaneous elimination of all weakly dominated strategies at each step.

  **Expected Results and Implications:**
  We expect to show that in multi-player games, the epistemic justification of IESDS requires the assumption of independent beliefs. Without it, the common knowledge of rationality does not imply the elimination of strategies that are strictly dominated by independent mixed strategies. For IEWDS, we expect to show that no order is canonical, but that simultaneous elimination might be a viable alternative. These results will clarify the epistemic conditions needed for iterated elimination and inform the design of algorithms for game solving.

  **Feasibility:**
  The project is feasible in 10 weeks. The first half will focus on the strict dominance part and the second on weak dominance. We will use existing software (e.g., Gambit) for some computations and write custom code for others. The risk is that the weak dominance part may not yield clear results, but even negative results (showing the inherent ambiguity) are valuable.

  **Conclusion:**
  This project addresses foundational questions in game theory with both conceptual and practical implications. By clarifying the epistemic foundations, we aim to strengthen the justification for solution concepts and improve the preprocessing steps used in computational game theory.
