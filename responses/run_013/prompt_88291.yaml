  - **Clarity:** Your core insight—that mixtures as eliminators might conflict with "no rational agent would play them"—is novel and important. The framing is *not* muddled, but needs to distinguish:  
    - Mixtures as *dominators* (always allowed) vs. mixtures as *surviving strategies* (may be dominated later).  
    - Epistemic conditions (CKR) for *elimination* vs. *play*.  
  - **Sharpening:** Focus on 3+-player games for divergence (Q1). For Q2, drop "canonical order" (likely impossible) and instead ask if order-dependence *maps to* epistemic instability.  
  - **Method:** Brute-force is perfect here. Small games are the "microscope" for conceptual questions—this is a strength, not a limitation.
