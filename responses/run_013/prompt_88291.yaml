  **Proposal Draft (Two Pages)**  

  **Title:** Rationality Under Hypothetical Play: Epistemic Consistency of Iterated Dominance with Mixed Strategies  

  **1. Introduction**  
  Iterated dominance is central to game-theoretic reasoning, justified by common knowledge of rationality (CKR). Yet two issues undermine this epistemic foundation: (1) Strict dominance by mixed strategies ("hypothetical" lotteries) may eliminate strategies rationalizable under correlated beliefs in multi-player games, and (2) order-dependence in weak dominance suggests CKR is underspecified. This project investigates whether standard epistemic justifications survive these challenges, using computational experiments on small games.  

  **2. Research Questions**  
  - **Q1 (Strict dominance):** When mixtures eliminate strategies under iterated strict dominance (IESDS), does stepwise "rationality" hold if mixtures are later dominated or if beliefs are correlated?  
  - **Q2 (Weak dominance):** Does order-dependence in iterated weak dominance (IEWDS) reflect epistemic ambiguity, and can a dominance "strength" metric resolve it?  

  **3. Background & Open Issues**  
  - **Strict dominance:** In 2-player games, IESDS converges to rationalizability. In ≥3-player games, strict dominance assumes *independent* beliefs, but CKR may permit *correlated* beliefs. Mixtures used as eliminators may not be playable later, creating tension. *Open: Does this violate stepwise CKR?*  
  - **Weak dominance:** IEWDS order-dependence is well-known, but no epistemic condition (e.g., trembles) aligns with a unique order. *Open: Is order-dependence inherent to "weak" rationality?*  

  **4. Methodology**  
  **4.1 Game Corpus:** All 3-player 2×2×2 games (n=256 payoff variants) and sampled 3×3×3 games (n=10,000) with payoffs in {0,1,2,3}.  
  **4.2 Computational Experiments:**  
  - **For Q1:**  
    - Compute IESDS sequences, flagging strategies eliminated by mixtures.  
    - At each step, test if eliminated strategies are best responses to *correlated* beliefs over surviving strategies.  
    - Track if dominating mixtures are later dominated.  
  - **For Q2:**  
    - Run IEWDS under all elimination orders.  
    - Quantify "dominance strength" (e.g., min payoff difference, # of dominating opponents).  
    - Test if orders based on strength yield unique/maximal sets.  
  **4.3 Analysis:** Classify games by divergence types (e.g., "epistemically inconsistent IESDS," "order-stable IEWDS").  

  **5. Expected Outcomes**  
  - **Theory:** A formal characterization of when IESDS violates CKR for correlated beliefs, and whether IEWDS order-dependence reflects epistemic ambiguity.  
  - **Algorithms:** Heuristics for "safe" elimination (e.g., only use mixtures that survive IESDS).  
  - **Taxonomy:** Game classes where standard epistemic stories fail (e.g., games with "transitive mixed dominators").  

  **6. Feasibility & Timeline**  
  - **10-week scope:** Focused on 2×2×2 games (Weeks 1–5) with extension to 3×3×3 (Weeks 6–8).  
  - **Risks:** Computational limits for 3×3×3 mitigated by payoff symmetry; negative results still inform epistemology.  
  - **Deliverables:** Code for game analysis; draft paper with game classifications.  

  **7. Conclusion**  
  This project bridges game theory’s computational and philosophical foundations. By stress-testing iterated dominance in small games, we expose hidden assumptions about rationality and belief, offering refinements for theory and practice.  

