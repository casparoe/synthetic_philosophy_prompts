answer: |-
  Here's a comprehensive exam package tailored to your requirements, designed to push students beyond the standard "two tyrannies" framework and engage deeply with the interpretive tensions in Aquinas.

  **Essay Question:**

  "Thomas Aquinas argues that a tyrannical regime, ordered solely to the ruler's private good, lacks the justice inherent in a true political authority (ST II-II, q. 42). Consequently, disturbing such a regime is not sedition. However, he immediately qualifies this by stating such disturbance is only licit if it does not cause greater harm to the community than the tyranny itself. Elsewhere (De Regno, I.6), he strongly cautions that private individuals lack the authority to kill a tyrant, reserving such action for public authority or divine intervention, emphasizing procedural concerns and the prudential risk of worsening the situation. Furthermore, his earlier Commentary on the Sentences (II, d. 44, q. 2, a. 2) appears more permissive towards tyrannicide undertaken by private individuals for the common good.

  **Evaluate the following thesis:** 'Aquinas's seemingly diverse statements on resisting tyranny are unified by a single, constant criterion: the question of *who possesses legitimate public authority* to act on behalf of the community. The language of the "common good" serves only to describe the *purpose* of authority, not as an independent justification for resistance by those lacking such authority. The prudential warnings and the apparent shift in his position from the Sentences merely underscore the dangers of unauthorized action.' Does this 'borrowed criterion' reading provide the most coherent account of Aquinas's thought on tyrannicide across these texts? Why or why not?"

  ---

  **Model Answer (Approx. 800 words):**

  The "borrowed criterion" thesis offers a provocative and elegant lens for interpreting Aquinas’s complex statements on tyrannicide, centering legitimacy solely on the possession of public authority. While it captures crucial procedural and prudential dimensions in Aquinas's thought, particularly the core distinction between public and private action emphasized in *De Regno*, it ultimately proves reductive. It fails to fully account for the normative force of the "common good" as an independent criterion for judging tyranny *itself* and the resultant implications for resistance, as articulated in the *Secunda Secundae*, and it struggles to integrate the consequentialist qualification or the nuances of his earlier position coherently.

  The thesis's strength lies in its compelling synthesis of *De Regno* and the underlying logic of authority throughout Aquinas's political philosophy. Aquinas consistently grounds legitimate political power in its derivation from God for the sake of the common good (*ST* I-II, q. 90, a. 3; *De Regno* I.1). Crucially, this authority is *vested* in specific offices or bodies capable of acting *publicly* for the community. The *De Regno* passage explicitly condemns private individuals killing tyrants precisely because they lack this public mandate: "it seems that to proceed against the cruelty of tyrants is an action to be undertaken, not through the private presumption of a few, but rather by public authority." The appeal to a "superior authority" reinforces this procedural framework – resistance must be authorized. The prudential warning about trading one tyrant for a worse one further underscores the potential chaos and injustice inherent in *unauthorized*, private action disrupting the public order. The thesis rightly identifies this prohibition on private initiative as a constant thread, contrasting it with the potentially more individualistic stance in the *Sentences Commentary* (where Aquinas argues a private individual *can* kill a tyrant if acting for the common good and if no public remedy exists, likening it to killing a robber). The "borrowed criterion" reading interprets this shift not as a fundamental change in doctrine, but as Aquinas later refining his view to strictly subordinate resistance to public authorization, with the *Sentences* representing a less mature position where the implications of his authority framework weren't fully worked out.

  However, the thesis stumbles significantly in its treatment of *ST* II-II, q. 42. Here, Aquinas defines sedition as "an unjust disturbance of the peace of the people." The key point is his assertion: "A tyrannical government is not just, because it is directed, not to the common good, but to the private good of the ruler... Consequently, the disturbance of such a government does not have the character of sedition." **This is a substantive, normative judgment about the regime itself based *exclusively* on its *telos* – its orientation towards the private good versus the common good.** The justice or injustice of disturbing the regime hinges *first* on this intrinsic quality of the regime, *not* on who is doing the disturbing. The "common good" criterion here is doing independent work: it defines what constitutes a *true* political authority versus a perversion thereof. Only *after* establishing that disturbing tyranny isn't inherently seditious *because it lacks justice*, does Aquinas introduce the consequentialist qualification ("unless perhaps the tyranny be so excessive that the upheaval causes the community greater suffering than the tyranny itself"). This qualification modifies the *application* of the principle but does not negate the foundational claim that tyranny, by its nature, lacks the justice that makes disturbance seditious.

  The "borrowed criterion" reading, by asserting the common good language merely describes authority's purpose without providing independent justification, cannot adequately explain why disturbing tyranny isn't seditious *at all*. If authority were the sole criterion, disturbing *any* ruler, even a tyrant, could still be seen as an unauthorized usurpation of public function, potentially seditious. Aquinas avoids this by grounding the *illegitimacy of the tyranny itself* in its failure regarding the common good. This provides a *reason why* a public authority (or those acting under its mandate) might be justified in resisting – the tyrant has forfeited the moral claim to obedience inherent in just authority. The procedural concerns of *De Regno* address *how* that resistance should be undertaken (publicly, authoritatively), but the *justifying reason* for resistance stems from the substantive failure regarding the common good outlined in the sedition question.

  Furthermore, the consequentialist qualification ("unless...") sits awkwardly with the "borrowed criterion." If the sole issue is authorized public action, why would the *consequences* of authorized resistance matter in the same way? The qualification seems more directly linked to the *common good* principle itself – resistance, even justified by the tyrant's failure, is only licit if it doesn't ultimately inflict greater harm *on that same common good*. This is a pragmatic limitation on acting on the substantive common-good criterion.

  In conclusion, while the "borrowed criterion" thesis powerfully highlights Aquinas's unwavering insistence on public authorization for *executing* resistance (especially lethal force) and explains the shift from the *Sentences* to *De Regno*, it underestimates the independent normative force of the "common good" as the defining characteristic of just rule and the fundamental justification for why tyranny can be licitly resisted *in principle*. Aquinas's thought presents a complex interplay: the substantive injustice of tyranny (defined by its failure regarding the common good) provides the *reason* for resistance; the principle of public authority dictates the *proper agents and mode* of resistance, especially its most extreme forms; and prudential considerations regarding the common good's actual outcome impose a vital *practical limitation* on action. Reducing this to solely the question of "who has authority" flattens Aquinas's nuanced, multi-faceted approach to the profound problem of tyranny.

  ---

  **Marking Scheme (Out of 20):**

  1.  **Understanding & Framing the Core Tension (4 pts):**
      *   **Top Answer (4 pts):** Clearly identifies and explains the apparent conflict between the "common good as intrinsic criterion for regime justice/resistance legitimacy" (ST II-II q.42) and the "public authority/procedure as necessary condition for action" (De Regno), including the role of the consequence clause and the Sentences passage. Avoids reducing the question to the "two tyrannies."
      *   **Common Mistake (0-2 pts):** Spends significant time explaining the "two tyrannies" distinction irrelevant to the prompt; fails to articulate the specific tensions between the texts outlined in the question; conflates the different arguments.

  2.  **Engagement with the "Borrowed Criterion" Thesis (5 pts):**
      *   **Top Answer (5 pts):** Accurately summarizes the thesis (common good = descriptive purpose, authority = sole criterion). Provides a compelling evaluation, identifying its strengths (e.g., explains De Regno prohibition, shift from Sentences, integrates prudential risk) AND its significant weaknesses (e.g., fails to account for the independent normative force of common good in defining tyranny/justifying resistance *in principle* in ST II-II q.42, struggles with consequence clause).
      *   **Common Mistake (0-3 pts):** Merely describes the thesis without substantive evaluation; only lists its strengths or only lists its weaknesses; misrepresents the thesis; evaluation remains superficial.

  3.  **Analysis of Key Texts (ST II-II q.42 Focus) (5 pts):**
      *   **Top Answer (5 pts):** Demonstrates a deep understanding of ST II-II q.42: explains how the common good directly defines tyranny's injustice *and* why disturbing it isn't seditious *based on this definition*. Analyzes the consequence clause as a pragmatic modification of the common-good principle, not its negation. Explicitly argues why the common good here functions as an independent *justifying reason*, not merely descriptive.
      *   **Common Mistake (0-3 pts):** Glosses over ST II-II q.42 or misinterprets it (e.g., thinks consequence clause negates the core argument); fails to explain *why* disturbing tyranny isn't seditious; doesn't connect the common good to the *definition* of tyranny's injustice.

  4.  **Analysis of Key Texts (De Regno & Sentences Focus) (4 pts):**
      *   **Top Answer (4 pts):** Explains the core argument of De Regno (private lack of authority, role of superior, prudential risk) as primarily procedural. Analyzes the Sentences passage as an earlier, less restrictive view. Effectively argues how the "borrowed criterion" *succeeds* in explaining the De Regno position and the shift from the Sentences, integrating the prudential warning.
      *   **Common Mistake (0-2 pts):** Misreads De Regno (e.g., thinks it *completely* forbids tyrannicide rather than forbidding *private* action); ignores the Sentences passage or fails to contrast it with later works; doesn't connect the prudential warning to the authority framework.

  5.  **Synthesis & Conclusion (2 pts):**
      *   **Top Answer (2 pts):** Offers a clear, nuanced conclusion adjudicating the thesis (e.g., "explains procedure well but underestimates substantive justification"), synthesizing the insights from analyzing all texts. Presents a coherent alternative view of Aquinas's multifaceted approach (substantive reason, procedural mode, prudential limitation).
      *   **Common Mistake (0-1 pt):** Conclusion merely restates points; fails to adjudicate; presents a contradictory or confused summary; ignores elements of the analysis.

  **Cap on "Two Tyrannies" Answers:** An essay that primarily focuses on explaining the "usurper vs. legitimate ruler turned tyrant" distinction, even if accurate and well-written, **cannot score higher than 10/20 (a C grade)**. It fundamentally fails to engage with the specific textual tensions and the "borrowed criterion" thesis central to the question. Points would likely only come from basic textual knowledge (e.g., mentioning De Regno's warning) and structure, but not from the targeted analysis required.
