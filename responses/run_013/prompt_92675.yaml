prompt: |-
  Bit of an ongoing argument with a labmate and I want my side stress-tested. My position: the replication crisis in social psych and biomed is at bottom a problem with the inference framework, and the fix is to replace p-values with Bayes factors under default (objective-ish) priors. Bonus claim that I lean on pretty hard: with a fixed prior you don't need to preregister a sample size at all, because optional stopping doesn't bias a Bayes factor the way it inflates a p-value, so a lot of the preregistration push is solving a problem that only exists for frequentists.

  What counts against this? I want the actual defeaters ranked by how decisive they'd be -- formal results, simulation results, empirical patterns (including things that have arguably already happened, like journals or subfields that already switched), and conceptual arguments, not just "p-hacking is bad." Tell me which ones a committed Bayesian would concede really bite versus wave off as misuse, and whether the position has been quietly qualified into something unfalsifiable -- and if it has, whether that's actually a problem for a position of this kind. I care most about the optional-stopping part, since if that result is shakier than it looks the whole package looses its main selling point; say how exposed it really is. And say where you'd put the blame instead if not the framework -- design, incentives, base rates, measurement, theory.

  Say how confident you are in each claim and single out the one you're least sure of.

  Give it back as JSON: an array of objects with "defeater" (short name), "kind" ("formal", "simulation", "empirical", "conceptual", "historical"), "what_it_would_show", "decisiveness" ("fatal", "serious", "awkward", "cosmetic"), "defender_concedes" ("yes", "no", "partly"), "confidence" (0-1); then top-level "ranked_summary" (one line per defeater, most to least decisive), "insulation_verdict", and "least_confident_claim".
reasoning: |-
  We are going to address the user's position step by step. The position is that the replication crisis is fundamentally a problem of the inference framework (frequentist p-values) and that replacing them with Bayes factors (BF) under default priors would fix it. The bonus claim is that with a fixed prior, you don't need preregistration of sample size because optional stopping doesn't bias the BF.

  We are to provide defeaters (counterarguments) against this position, categorized by kind (formal, simulation, empirical, conceptual, historical). Each defeater will be an object in a JSON array with the specified fields. We will then rank the defeaters by decisiveness (fatal, serious, awkward, cosmetic) and note whether a defender (committed Bayesian) would concede the point (yes, no, partly). We also assign a confidence level (0-1) to each.

  Additionally, we'll provide:
  - A ranked summary (one line per defeater, most to least decisive)
  - An "insulation_verdict": whether the position has been quietly qualified into something unfalsifiable and if that's a problem.
  - The "least_confident_claim": which defeater we are least sure about.

  Let's list the potential defeaters:

  1. **Formal issues with Bayes factors under optional stopping**:
     - The claim that optional stopping doesn't bias the BF is formally true under a fixed prior, but only if the prior is correctly specified and the model is true. However, in practice, the prior might be misspecified or the model might be wrong. Moreover, the Lindley's paradox shows that with large samples, a BF might favor the null even when there is a small but real effect, which could be problematic.

  2. **Sensitivity to prior choice**:
     - Bayes factors are highly sensitive to the choice of prior. Default priors are often arbitrary and can lead to different conclusions. This is a conceptual and practical issue.

  3. **Empirical evidence of Bayes factors not solving the crisis**:
     - In subfields that have adopted Bayesian methods (e.g., some areas of cognitive psychology), replication issues might still exist. There is also evidence that Bayes factors can be hacked similarly to p-values by choosing favorable priors or by optional stopping in a way that exploits the stopping rule (though formally it's allowed, it might lead to overestimation of evidence).

  4. **The problem of base rates and publication bias**:
     - The replication crisis is also driven by low base rates of true effects, publication bias, and incentives for novel findings. Changing the inference framework does not address these.

  5. **The issue of model misspecification**:
     - Bayes factors depend on the model being correct. In social psych and biomed, models are often simplified and may not capture the true data-generating process. This can lead to misleading BFs.

  6. **Practical challenges and misinterpretation**:
     - Even if BF is formally correct, researchers might misinterpret it (e.g., treating it as a posterior probability) or use it in a way that doesn't solve the problem.

  7. **The role of preregistration beyond stopping rules**:
     - Preregistration is not only about stopping rules but also about preventing other forms of p-hacking (e.g., choosing dependent variables, covariates after seeing the data). Bayesian methods do not automatically prevent these.

  8. **Simulation evidence**:
     - Simulations show that under optional stopping with Bayes factors, the type I error rate (in a frequentist sense) can be inflated if the stopping rule is based on the BF. However, the Bayesian would argue that type I error is not the right metric. Yet, in practice, if the goal is to control false positives, this might be a concern.

  Let's structure the defeaters:

  We rank by decisiveness:

  - **Fatal**: If true, this would completely undermine the core claim.
  - **Serious**: A major problem but perhaps not fatal.
  - **Awkward**: A problem that can be managed but is inconvenient.
  - **Cosmetic**: A minor issue.

  We'll consider:

  1. **Base rates and publication bias (conceptual/empirical)**: Even with BF, if journals only publish positive results (BF>threshold) and the base rate of true effects is low, we'll have a high false discovery rate. This is a serious defeater because the framework change doesn't fix the incentive structure.

  2. **Sensitivity to prior (conceptual/empirical)**: The BF can be manipulated by choosing a prior. This is a serious issue because the user proposes "default" priors, but there is no consensus on what that should be.

  3. **Model misspecification (formal/conceptual)**: If the model is wrong, the BF can be misleading. This is a serious issue because in social psych, models are often not well-specified.

  4. **Optional stopping and frequentist properties (simulation)**: While BF is formally immune to optional stopping, if we care about frequentist error rates (and many institutions do), then optional stopping with BF can lead to high false positive rates in practice. This is awkward because the Bayesian framework doesn't care, but the scientific community might.

  5. **Empirical failure in subfields (empirical)**: Some fields that use Bayes factors (e.g., cognitive psychology) still have replication issues. This is awkward but not fatal because there could be other factors.

  6. **Misinterpretation and misuse (empirical/conceptual)**: Researchers might misuse Bayes factors just like p-values. This is cosmetic because it's about education, not the framework.

  7. **Preregistration for other p-hacking (conceptual)**: Preregistration addresses more than stopping rules. This is awkward because it shows that the bonus claim overreaches.

  8. **Lindley's paradox (formal)**: With large samples, a BF might favor the null even when there is a small but real effect. This is awkward because it might lead to missing important effects.

  We must also consider the optional stopping part:

  The formal result (that BF is not biased by optional stopping) is sound under the assumptions (fixed prior and correct model). However, in practice, if the stopping rule is used to repeatedly test until a threshold is reached, the BF can be made to support either hypothesis with high probability if the true effect is zero (see Rouder (2014) and simulations). But the Bayesian would argue that the BF is still a valid measure of evidence under the model. The problem is that the evidence might be weak and the repeated testing might lead to a BF that is large by chance. This is a simulation-based defeater.

  Now, we assign:

  - **Defeater 1: Base rates and publication bias**
    - Kind: conceptual and empirical
    - What it would show: Even with BF, the replication crisis would persist because of the incentive structure and low base rates of true effects.
    - Decisiveness: serious (because it shows that the framework change is insufficient)
    - Defender concedes: partly (they might agree that these are separate issues, but argue that BF is still better for inference)
    - Confidence: 0.9

  - **Defeater 2: Sensitivity to prior choice**
    - Kind: conceptual and empirical
    - What it would show: Default priors are arbitrary and can lead to different conclusions, so the BF doesn't provide an objective solution.
    - Decisiveness: serious
    - Defender concedes: yes (most Bayesians acknowledge the prior sensitivity and offer methods to check, but it remains a problem for default priors)
    - Confidence: 0.95

  - **Defeater 3: Model misspecification**
    - Kind: formal and conceptual
    - What it would show: If the model is wrong, the BF can be misleading. Since models in social psych are often oversimplified, this is a major issue.
    - Decisiveness: serious
    - Defender concedes: yes (but might argue that all models are wrong and that this is a general problem)
    - Confidence: 0.85

  - **Defeater 4: Optional stopping and frequentist error control**
    - Kind: simulation
    - What it would show: While BF is formally immune to optional stopping, in simulations, optional stopping with BF can lead to high frequentist type I error rates. This is problematic if the scientific community cares about error rates.
    - Decisiveness: awkward (because it challenges the bonus claim in a practical sense, but not formally)
    - Defender concedes: no (they would argue that frequentist error rates are irrelevant in a Bayesian framework)
    - Confidence: 0.8

  - **Defeater 5: Empirical evidence from subfields**
    - Kind: empirical
    - What it would show: Fields that have adopted Bayesian methods (like some in cognitive psychology) still have replication problems, suggesting that the framework alone isn't the solution.
    - Decisiveness: awkward (because there could be many confounders)
    - Defender concedes: partly (might argue that adoption is incomplete or that other problems dominate)
    - Confidence: 0.7 (due to limited evidence)

  - **Defeater 6: Misinterpretation and misuse**
    - Kind: empirical and conceptual
    - What it would show: Researchers might misuse Bayes factors (e.g., treating BF>3 as conclusive) just like p<0.05, leading to similar problems.
    - Decisiveness: cosmetic (because it's about implementation, not the framework)
    - Defender concedes: no (argues that education would fix this)
    - Confidence: 0.75

  - **Defeater 7: Preregistration addresses more than stopping**
    - Kind: conceptual
    - What it would show: Preregistration also prevents other p-hacking practices (e.g., choosing outcomes, covariates, subgroups) which BF doesn't solve.
    - Decisiveness: awkward (it undercuts the bonus claim that preregistration is unnecessary)
    - Defender concedes: partly (might agree that preregistration has other benefits but maintain that for stopping rules it's unnecessary)
    - Confidence: 0.9

  - **Defeater 8: Lindley's paradox**
    - Kind: formal
    - What it would show: With large samples, BF can strongly favor the null even when there is a small but real effect, which might lead to dismissing important effects.
    - Decisiveness: awkward (it shows a limitation of BF, but not fatal to the main claim)
    - Defender concedes: yes (it's a well-known property)
    - Confidence: 0.85

  Now, rank by decisiveness (most to least):

  1. Base rates and publication bias (serious) -> because it shows that even with BF, the crisis might persist
  2. Sensitivity to prior choice (serious) -> because it undermines the objectivity of the proposed solution
  3. Model misspecification (serious) -> because it's a fundamental limitation in complex fields
  4. Optional stopping and frequentist error control (awkward) -> because it challenges the practical benefit of the optional stopping claim
  5. Preregistration addresses more than stopping (awkward) -> because it shows that the bonus claim is incomplete
  6. Lindley's paradox (awkward) -> a known quirk but not as central
  7. Empirical evidence from subfields (awkward) -> limited evidence, but still a counter
  8. Misinterpretation and misuse (cosmetic) -> implementation issue

  Insulation Verdict: The position has been qualified in Bayesian circles by emphasizing that the prior must be chosen carefully and that the model must be reasonable. This does make the position somewhat unfalsifiable because any failure can be attributed to a poor prior or model. However, this is a problem for the position because it shifts the burden and makes the solution less straightforward than simply switching to default Bayes factors.

  Least Confident Claim: The empirical evidence from subfields (Defeater 5) because the adoption of Bayesian methods is still limited and it's hard to isolate the effect of the inference framework from other factors. Confidence: 0.7.

  Now, we write the JSON.
