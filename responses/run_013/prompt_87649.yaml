  Okay, the user wants me to act as a philosopher of biology and dissect Gould and Lewontin's spandrels paper. They've been exposed to secondhand opinions from evo-psych blogs and LessWrong but recently read a science journalist's explainer. The journalist summarized it as: the paper attacked adaptationism by arguing many traits are useless byproducts, using San Marco spandrels as a metaphor, and that adaptationists invent unfalsifiable just-so stories. Critics like Dennett called it a strawman that set the field back.

  First, I need to recall the actual content of the 1979 paper. Gould and Lewontin criticized the adaptationist program, not all adaptationism. They argued against assuming every trait is an optimal adaptation without considering alternatives. The San Marco analogy was about architectural constraints leading to non-adaptive features. They emphasized that spandrels are necessary byproducts, not useless. 

  The user mentions Dennett's criticism about San Marco not being real spandrels. I should check that. Dennett pointed out that the spandrels were designed, so the analogy might be flawed. But Gould clarified later that it was about structural constraints, not intentional design. The paper also discussed other non-adaptive forces like genetic drift and developmental constraints.

  The user is confused about whether the paper offered a research program or just criticism. The paper did suggest alternatives: studying developmental constraints, phylogenetic history, and multiple adaptive traits as units. They mentioned Baupläne and integrated phenotypes. But critics argue these weren't fully developed into testable methods.

  The "strawman" charge: Did they misrepresent adaptationists? Some, like Mayr, acknowledged constraints, so maybe it's a weakman. But in 1979, the adaptationist approach was dominant in some circles, so perhaps it was a needed corrective. The setback claim—maybe it caused overcorrection, but it also spurred important debates.

  I need to address each part of the journalist's summary. The "useless byproducts" point is a misrepresentation; spandrels are necessary, not useless. The just-so stories critique is valid, as adaptationists sometimes invent narratives without evidence. The San Marco metaphor's accuracy is contested, but the core idea stands. The paper's positive proposals were somewhat vague but inspired research on constraints.

  The user's deeper needs: They want clarity on the paper's true impact and whether criticisms are valid. They might be seeking a balanced view to reconcile conflicting opinions they've encountered. Also, understanding if evo-psych's adaptationist approach is flawed based on this critique.

  I should structure the response by dissecting each claim: what G&L said, popularization accuracy, distortions, defenses, and the strawman/setback charge. Then evaluate the positive proposals. Confidence levels: High on most, but least sure about the "set the field back" claim since it's hard to measure impact.
answer: |-
  Here's a point-by-point dissection of the claims, grounded in the original paper, its context, and the subsequent debates. I'll structure it as requested, assessing each element and flagging confidence levels. My background: I've studied the adaptationism debates extensively, including the original paper, key responses (Dennett, Mayr, Alcock), and Gould's later clarifications.

  **Claim 1: "Gould and Lewontin's 1979 spandrels paper was the opening shot in the war on adaptationism — the idea that every trait is an adaptation shaped by selection."**

  *   **What G&L Actually Said:** They explicitly targeted the "*adaptationist programme*," not adaptationism *per se*. They defined this as a methodological approach characterized by:
      1.  Atomization: Breaking organisms into individual traits.
      2.  Optimality Assumption: Assuming each trait is optimally designed.
      3.  Storytelling: Inventing adaptive explanations without rigorous testing or considering alternatives.
      4.  Neglect: Ignoring non-adaptive explanations (like developmental constraints, genetic drift, historical contingency, or pleiotropy).
      They argued this *specific methodology* was flawed and dominated evolutionary biology, hindering progress. They *did not* deny that natural selection is powerful or that many traits are adaptations.
  *   **Reasonable Popularization:** Framing it as a "war" is hyperbolic but captures the rhetorical impact. Calling it the "opening shot" is partially true for *this specific critique*, but critiques of naive adaptationism existed earlier (e.g., Darwin himself acknowledged constraints, Sewall Wright on drift, Waddington on epigenetics). G&L synthesized and amplified these critiques powerfully.
  *   **Distortion/Conflation:** Conflating the "adaptationist *programme*" (their specific target) with "adaptationism" *in general* (the uncontroversial view that selection is the *primary* force shaping complex traits) is a major misrepresentation. G&L were attacking a *methodological practice*, not the foundational importance of selection.
  *   **Defender's Pushback:** G&L specifically stated: "We do not attack the concept of adaptation... the concept of adaptation is central to evolutionary biology." They were criticizing *how* the concept was applied – uncritically, exclusively, and atomistically.
  *   **Confidence:** High (based on explicit statements in the paper's introduction).

  **Claim 2: "Using the spandrels of the Basilica di San Marco, they argued that many biological traits are useless byproducts of other traits rather than adaptations..."**

  *   **What G&L Actually Said:** The San Marco spandrels are architectural *constraints* – the necessary triangular spaces created when you place a dome on rounded arches. The *artwork* on them is secondary decoration. G&L argued that many biological features are similarly:
      1.  **Non-adaptive (or Neutral) Byproducts:** Not "useless," but *necessary consequences* of structural, developmental, or phylogenetic constraints. They are *spandrels* – spaces created that *can* be utilized later ("exapted") but weren't originally adaptations. Examples: human chin (byproduct of jaw reduction), male nipples (byproduct of developmental pathways shared with females), the large brain size enabling language (arguably a spandrel relative to its initial selective pressures).
      2.  **Not Necessarily Useless:** They emphasized that spandrels can be *co-opted* for functional purposes later (exaptation). Their key point was the *origin* being non-adaptive constraint, not current utility.
  *   **Reasonable Popularization:** The core metaphor is reasonably captured: some traits arise as necessary byproducts, not directly shaped by selection *for* that specific trait.
  *   **Distortion/Conflation:** Calling them "useless" is a significant distortion. G&L stressed they are *necessary* byproducts of adaptive structures (like the dome or arches). They can be neutral *or* later become useful. The popularization risks implying they are vestigial junk, which isn't the core argument. The spandrel is the *space*, not the decoration.
  *   **Defender's Pushback:** G&L's point was precisely about the *origin* of traits, not their current function. The "useless" characterization ignores the concepts of constraint and exaptation central to their argument. They provided biological examples beyond the metaphor.
  *   **Confidence:** High (the paper is explicit about constraints and origins vs. current utility).

  **Claim 3: "...and that adaptationists respond to failed predictions by making up new, unfalsifiable just-so stories."**

  *   **What G&L Actually Said:** This is a core complaint. They accused the adaptationist programme of:
      1.  **Panglossian Paradigm:** Blindly assuming everything is "for the best" (a la Voltaire's Dr. Pangloss), leading to uncritical acceptance of any adaptive story.
      2.  **Lack of Falsifiability:** Inventing new adaptive stories *ad hoc* when one explanation fails, without ever rejecting the underlying assumption that *an* adaptive explanation *must* exist. They called this "storytelling" rather than science.
      3.  **Failure to Test Alternatives:** Never seriously considering non-adaptive hypotheses (constraints, drift, history) as null models.
  *   **Reasonable Popularization:** The "just-so story" critique (named after Kipling's fanciful tales) is central and accurately captured. The charge of unfalsifiability due to *ad hoc* story generation is well-stated.
  *   **Distortion/Conflation:** While G&L implied it was pervasive, they didn't claim *all* adaptationists did this *all* the time. They criticized the *programme's* methodological tendency. Some critics (like Mayr) argued good adaptationists *did* consider alternatives.
  *   **Defender's Pushback:** This is arguably the paper's strongest and most enduring point. Modern evolutionary biology widely accepts the need for rigorous testing of adaptive hypotheses against alternatives and the danger of uncritical storytelling. The paper catalysed this shift.
  *   **Confidence:** High (explicit and central throughout the paper).

  **Claim 4: "The paper is usually credited with discrediting naive adaptationism..."**

  *   **Reality:** This is largely true. The paper was a watershed moment. It forced evolutionary biologists to:
      1.  Explicitly consider non-adaptive explanations.
      2.  Develop more rigorous methods for testing adaptive hypotheses (e.g., comparative methods controlling for phylogeny, studying developmental mechanisms).
      3.  Acknowledge the importance of constraints and historical contingency.
      "Naive adaptationism" (the uncritical atomistic storytelling they described) *was* significantly discredited as a dominant methodology.
  *   **Confidence:** High (consensus view among historians/philosophers of biology).

  **Claim 5: "...though critics like Dennett have pointed out that the San Marco shapes weren't even real spandrels..."**

  *   **Dennett's Critique:** Dennett argued the San Marco spandrels are *not* true architectural spandrels (which are the smooth, curved, load-bearing triangles beneath a dome). The San Marco mosaics are on the *pendentives* – the *infill* between arches supporting a *drum*, not the dome itself. Furthermore, pendentives *are* often deliberately designed surfaces for decoration from the outset. He argued G&L botched their own metaphor.
  *   **G&L's Defense/Reality:** Gould later acknowledged the architectural error but argued it was irrelevant to the *biological* point. The core concept – features arising as necessary byproducts of structural constraints, which *can* then be decorated/utilized – remains valid. The biological examples (chin, brain size for language, male nipples) stand independently. The metaphor was illustrative, not foundational proof.
  *   **Distortion?** Dennett's critique is technically correct architecturally but arguably pedantic regarding the paper's core argument. It doesn't invalidate the biological concept of constraints and byproducts.
  *   **Confidence in Assessment:** High (the architectural point is factual, Gould conceded it, but the biological argument survives).

  **Claim 6: "...and that the whole thing was a strawman that set the field back."**

  *   **Strawman Charge:**
      *   **Critics' View (Dennett, Alcock):** Argue G&L attacked a caricature ("Panglossianism") that few serious biologists actually adhered to. They claim leading adaptationists (like G. C. Williams, G. E. Hutchinson, R. A. Fisher) *did* consider constraints, drift, and alternative hypotheses. Portraying them as uncritical storytellers was unfair.
      *   **G&L Defense/Reality:** G&L cited numerous prominent papers exhibiting the flaws they described. They argued the *programme's* assumptions were implicit in much research practice, even if not explicitly stated. While perhaps not true of the *very best* theorists, it characterized a vast amount of empirical work and textbook presentations at the time. Their target was a widespread *methodological tendency*, not a specific person or theoretical school.
      *   **Assessment:** It's more "weakman" than pure strawman. They attacked a *common practice* that *did* exist, sometimes exaggerating its universality among elites. But their critique resonated because it reflected a real methodological problem observable in many publications.

  *   **"Set the Field Back" Charge:**
      *   **Critics' View:** Argue the paper created an atmosphere of hostility towards adaptationist hypotheses, deterring researchers from investigating them even when appropriate. They claim it led to "hyper-reluctance" and wasted effort chasing non-adaptive ghosts.
      *   **G&L Defense/Reality:** G&L argued they were correcting an imbalance, not forbidding adaptationist research. They called for *better*, more rigorous adaptationist science, not its abandonment. The field *needed* a corrective. The positive outcome was the development of more sophisticated methods for studying adaptation *and* constraints. While there might have been some overcorrection in certain subfields (like early evolutionary psychology), the net effect was methodological advancement.
      *   **Assessment:** This is the **claim I'm least confident about**. Quantifying "set back" is hard. Did it cause *some* researchers to shy away from adaptationist questions? Probably, temporarily. Did it *overall* hinder progress? Unlikely. It spurred crucial debates, improved methodological rigor (e.g., phylogenetically controlled comparative methods), and revitalized the study of development and constraints (Evo-Devo). The field advanced significantly *because* of, not despite, this critique. The charge of a major setback is likely overstated, reflecting the discomfort of some adaptationists rather than objective stagnation.

  **Claim 7: The Paper's Positive Proposal**

  *   **What G&L Offered:** They didn't just complain. They advocated for an alternative framework:
      1.  **Developmental Constraints:** Study how ontogeny channels evolutionary possibilities ("Baupläne").
      2.  **Integration & Unity of Type:** Study how selection acts on integrated wholes, not atomized parts. Traits may be linked (pleiotropy, allometry), constraining or enabling evolution.
      3.  **Phylogenetic Inertia:** Consider historical legacy.
      4.  **Non-Adaptive Hypotheses as Null Models:** Test adaptation against drift, constraint, etc.
      5.  **Exaptation:** Recognize features can gain new functions.
  *   **Research Program?** They offered a *conceptual framework* and *agenda*, not a specific, testable research program like population genetics. It was a call to broaden perspectives and methodologies. This framework *did* inspire research:
      *   Revival of Evolutionary Developmental Biology (Evo-Devo).
      *   Renewed focus on quantitative genetics and constraints.
      *   Methodological developments in comparative biology.
      *   Critical examination of adaptationist claims in fields like sociobiology/evolutionary psychology.
  *   **Assessment:** It was more than a complaint, but less than a fully operationalized research program. It provided the philosophical and conceptual impetus for significant shifts in evolutionary biology, particularly the rise of Evo-Devo and more pluralistic methodologies. Its influence is undeniable, even if implementation took time.

  **Summary Verdict:**

  1.  **Core Argument:** G&L successfully critiqued a dominant, uncritical methodological practice ("adaptationist programme") that ignored constraints and non-adaptive forces, relying on unfalsifiable "just-so" stories. (High Confidence)
  2.  **Metaphor:** The San Marco spandrel metaphor was architecturally flawed but effectively illustrated the concept of non-adaptive byproducts of constraints. (High Confidence)
  3.  **Strawman:** The charge is overstated; they attacked a real and prevalent methodological tendency, though perhaps caricaturing the most sophisticated theorists. (Medium-High Confidence)
  4.  **Set Back the Field?** Highly unlikely. While causing discomfort, it spurred methodological advances, pluralism, and new fields (Evo-Devo). The net effect was progress. **(Least Confident Claim - Impact is complex, but setback seems hyperbolic)**
  5.  **Positive Proposal:** Offered a crucial conceptual framework advocating for pluralism (constraints, development, history), which *did* inspire productive research programs, though not a single, unified "program" itself. (High Confidence)
  6.  **Legacy:** The paper remains essential reading. It discredited *naive* adaptationism and forced evolutionary biology to become more rigorous, pluralistic, and integrated with development. While some specifics (like the centrality of "spandrels") are debated, its core methodological critique is widely accepted. Evolutionary psychology, in particular, still grapples with its implications. (High Confidence)

  Gould and Lewontin weren't trying to destroy adaptationism; they were trying to save evolutionary biology from bad methodology. Their paper was polemical and imperfect, but its core message about methodological rigor and pluralism was necessary and ultimately beneficial.
