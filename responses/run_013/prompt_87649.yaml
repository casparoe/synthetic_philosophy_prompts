prompt: |-
  I'd like you to act as a philosopher of biology who knows the adaptationism debates from the inside — someone who's read Gould and Lewontin's original paper and the replies to it, not just the Wikipedia version. Think carefully and brainstorm a bit before you answer; lay out the claims you're going to assess, then assess them.

  Background on my confusion: I've been reading evo-psych-adjacent blogs and LessWrong-adjacent stuff for like a decade, so I've absorbed alot of secondhand opinion about the spandrels paper, but I only recently read an explainer by a science journalist that pulled it all together. Here's the gist of what he said, as close to verbatim as I can reconstruct:

  'Gould and Lewontin's 1979 spandrels paper was the opening shot in the war on adaptationism — the idea that every trait is an adaptation shaped by selection. Using the spandrels of the Basilica di San Marco, they argued that many biological traits are useless byproducts of other traits rather than adaptations, and that adaptationists respond to failed predictions by making up new, unfalsifiable just-so stories. The paper is usually credited with discrediting naive adaptationism, though critics like Dennett have pointed out that the San Marco shapes weren't even real spandrels, and that the whole thing was a strawman that set the field back.'

  Some of that I'm confident about (the byproduct point, the Pangloss thing, the San Marco metaphor itself), but the framing feels like it might be flattening an argument that was actually more careful and more interesting. Could you go through it claim by claim: what Gould and Lewontin actually said, what's a reasonable popularization, what's a distortion or conflation, what a defender of the paper would push back on, and whether the "strawman that set the field back" charge has anything to it? And where does that leave the paper's positive proposal — was there a research program on offer or just a complaint?

  Also tell me how confident you are in each part of your answer and flag the one claim you're least sure of.
