prompt: |-
  Bit of an odd request, I'll warn you. I retired three years ago after about 35 years as a soil scientist (nitrogen cycling, lots of field work, not much maths beyond what you need for a t-test), and since then I've been reading philosophy of science and a couple of the popular causal-inference books. Never touched any of it as a student. Now I sit on the quality-and-safety committee of the small regional health network where I live — unpaid, meets monthly, and they keep handing us dashboards and asking us to flag outliers.

  Here's my problem. Every few months the numbers flip on us and the committee dissolves into an argument about which number is the real one. Last meeting: Hospital A had a higher mortality rate than Hospital B overall, but once you broke it down by how sick people were when they arrived, A looked better in every single severity band. Two members wanted the overall figure in the minutes, two wanted the bands, and one said we should not report anything. Nobody could say why. I gather this is Simpson's paradox, and that the textbook answer is that it depends on the causal question you're asking, which is true and completely useless to a committee with forty-five minutes and a chief medical officer waiting to sign off.

  What I'd like from you is a decision procedure I can actually run at the table. Ordered questions, what counts as a good enough answer to each, where it stops with a no, and where it stops and hands the decision to a person because the rest is values or politics rather than evidence. Keep it usable by people who don't know the words confounder and collider — I do, barely, but the retired schoolteacher next to me doesn't, so any term like that needs to be unpacked in the procedure itself. I can do arithmetic and cross-tabs in a spreadsheet; I cannot fit models, and we will not be hiring anyone mid-meeting, so if a step genuinely needs an epidemiologist, have the procedure say so and say what to hand them.

  Two things it has to handle, because they've both bitten us. One: sometimes the reversal runs the other way, and it's the stratified comparison that's the artefact, because we've broken people down by something that is itself a consequence of the thing we're studying — we only have records for patients who were admitted, or who made it to discharge. Two: we keep getting comparisons of improvement between two units where one analysis adjusts for the patients' starting scores and the other just looks at how much each patient changed, and the two analyses tell opposite stories about the same data. I'm told that one is a known puzzle too. I don't need the history, I need the rule.

  Then run the procedure on three cases: (a) the hospital A versus B thing above; (b) a case where the overall figure favours the unit I personally suspect is worse, so the procedure tells me something I won't enjoy; and (c) a case where the honest output is that the data we have cannot settle it and we should go and collect something else — say clearly what we'd need to collect.

  Also tell me where this procedure will misfire or get gamed, and don't pretend the judgement calls away.

  Finish each worked case with a line in exactly this form, nothing after it: \verdict{aggregate} or \verdict{stratified} or \verdict{neither}. And make the very last line of your whole answer \answer{...} with the braces containing the single question in your procedure that does the most work when everything else comes out even, in one sentence.
reasoning: |-
  Okay, let me think through this retired soil scientist's request. They need a practical decision procedure for handling statistical paradoxes in their health committee work, specifically Simpson's paradox and Lord's paradox. 

  First, I consider the user's background - 35 years in soil science with limited math, now dealing with health data dashboards. The key requirements are:
  - Must be usable by non-experts during short meetings
  - Needs to handle both Simpson's paradox (confounding) and Lord's paradox (adjustment vs change scores)
  - Requires clear stopping points where decisions move from data to human judgment
  - Must include three worked examples with specific verdict formats

  For the decision procedure itself, I design a flowchart-like sequence of questions that:
  1. Starts with establishing the causal question
  2. Checks for known data limitations (like selection bias)
  3. Handles stratification issues
  4. Includes practical tests like the "severity transfer" concept
  5. Has clear exit points to "neither" when data is inadequate

  The three cases need careful construction:
  (a) Classic Simpson's paradox with hospitals A and B - here stratification makes sense because severity is pre-treatment
  (b) A scenario where the aggregate result is correct despite seeming paradox - perhaps due to post-treatment stratification
  (c) A case where data is insufficient - say when discharge status affects recorded severity

  For the final \answer{} line, I consider which question cuts to the heart of causal interpretation. "Is the stratifying factor determined before the exposure?" seems most fundamental as it addresses temporality - a core principle in causal inference that doesn't require advanced statistics.

  Throughout, I maintain awareness of practical constraints: no modeling during meetings, spreadsheets only, and the need to explain terms like "confounder" in plain language (e.g., "third factor that affects both"). The procedure must also acknowledge where politics or values take over from data.
answer: |-
  Here's a decision procedure designed for committee use, focused on actionable questions with clear exit points. It handles Simpson's paradox and Lord's paradox-type conflicts without requiring statistical modeling.

  **Decision Procedure: Which Figure to Report?**  
  *(Run through these questions in order. Stop at first "No" or explicit endpoint.)*

  1.  **"What is the specific question we're being asked?"**  
      *If unclear:* Ask committee to phrase it as "Which [unit] has higher [outcome]?" (e.g., "Which hospital has higher mortality?"). **If no agreement, STOP \verdict{neither}.**  
      *Good enough:* A single, specific comparison question exists.

  2.  **"Is there a known, major data gap that makes *both* figures unreliable?"**  
      (e.g., missing records for >20% of eligible cases, outcome definition changed mid-period, critical severity data missing for >30% in key groups).  
      *Yes:* Flag the gap. **STOP \verdict{neither}.**  
      *No:* Proceed.

  3.  **"Is the stratifying/grouping factor (like severity, starting score) determined *before* the exposure (like hospital admission, treatment unit)?"**  
      *Unpack:* Was this factor set *before* the patient entered the unit/hospital being compared? (e.g., Severity on arrival? Yes. Discharge status? No.)  
      *Yes:* Proceed to Q4.  
      *No:* **Potential red flag.** Proceed to Q4 cautiously.  
      *Unsure:* Treat as "No" for now.

  4.  **"Does the relationship flip direction (e.g., A>B overall, B>A in groups) when we use the grouped/stratified/adjusted figure?"**  
      *No:* Either figure likely tells same story. **STOP \verdict{either}** (Report both if feasible, aggregate is simpler).  
      *Yes:* **Paradox detected.** Proceed to Q5.

  5.  **"Is the grouping factor strongly linked to BOTH the exposure AND the outcome?"**  
      *Unpack:*  
      a)  *Exposure Link:* Does the distribution of the grouping factor differ *a lot* between the units? (e.g., Does Hospital A get way more severely ill patients than Hospital B? Check cross-tabs/spreadsheet).  
      b)  *Outcome Link:* Does the outcome differ strongly by the grouping factor? (e.g., Is mortality much higher in severe vs mild patients? Check rates per group).  
      *Both Yes:* **Likely confounding.** Stratified figure is probably more relevant. Proceed to Q6.  
      *Either No:* **Stratification may be misleading.** Aggregate figure *might* be more relevant. Proceed to Q6.  
      *Unsure:* Treat as "No" for b). Proceed to Q6.

  6.  **"Severity Transfer Test:"** Imagine moving patients *only* based on the grouping factor. Would it change the overall comparison?  
      *Unpack:* If Hospital A has more severe patients, what happens if we *hypothetically* gave Hospital A the *same mix* of severity levels as Hospital B? Use the stratified rates to calculate a "Standardized Rate" for each hospital.  
      *Simple Calc:* `Std Rate = Sum( (Group Rate) * (Overall % of patients in Group) )` for each hospital. Use the *overall* population's group percentages. Compare the two Std Rates.  
      *Result matches Stratified:* Supports stratified figure. **Proceed to Q7.**  
      *Result matches Aggregate:* Supports aggregate figure. **Proceed to Q7.**  
      *Result is different/confusing:* **STOP \verdict{neither}.** Data too messy. Report both figures with clear caveats.

  7.  **"Is there a plausible reason the grouping factor could be *caused* by the exposure?"**  
      *Unpack:* Could being in Unit A *make* the patient appear sicker (or healthier) *on this factor*? (e.g., Discharge status, a lab value affected by treatment, length of stay).  
      *Yes (or Unsure):* **High risk of bias.** Aggregate figure is likely *less* biased. **STOP \verdict{aggregate}.**  
      *No:* Stratified figure is likely less biased. **STOP \verdict{stratified}.**

  **Handles Your Requirements:**  
  *   **Cause-Consequence Stratification (Q3, Q7):** Explicitly flags when stratification uses a post-exposure factor.  
  *   **Change Score vs Adjustment (Lord's Paradox):** Covered in Q3 & Q7. "Starting score" is usually pre-exposure (Q3=Yes), supporting adjustment (stratified). Change scores alone (aggregate) are vulnerable if groups start at different levels (Q5a).  
  *   **Judgement Calls:** Q3, Q5, Q7 require judgement ("plausible", "strongly linked"). The procedure forces explicit discussion and provides exit points (\verdict{neither}) when uncertainty is high.  
  *   **Misfires/Gaming:**  
      *   **Q5:** Judging "strongly linked" is subjective. Could be downplayed to favor a preferred result.  
      *   **Q7:** Judging "plausible" is subjective. Could be overstated/understated.  
      *   **Q6:** Requires simple calc. Done wrong, misleads. Requires consistent overall group %.  
      *   **General:** Relies on data quality (Q2). Won't handle complex interactions well. Doesn't replace an epidemiologist for deep dives. Favors simpler answers under time pressure.

  ---

  **Worked Cases:**

  **Case (a): Hospital A vs B Mortality**
  1.  Q1: "Which hospital has higher mortality?" Agreed.
  2.  Q2: Assume data is clean.
  3.  Q3: Severity on arrival? **Yes** (Pre-exposure).
  4.  Q4: Overall: A > B. By Severity Band: B > A in *every* band. **Flip: Yes.**
  5.  Q5: a) Exposure Link: Assume Hospital A gets *many* more severe patients (Check data!). **Yes.** b) Outcome Link: Mortality much higher in severe patients? **Yes.** **Both Yes -> Likely Confounding.**
  6.  Q6: Std Rate: Use overall pop severity %. Calc will likely show Hospital A's Std Rate < Hospital B's (matches stratified story). Supports stratified.
  7.  Q7: Severity on arrival caused by hospital? **No.**
      \verdict{stratified}

  **Case (b): Unit X (Suspected Worse) vs Unit Y Improvement (Lord's Paradox Scenario)**
  *   *Scenario:* Unit X has lower average improvement (Aggregate) than Unit Y. BUT, after adjusting for starting functional score (Stratified/Adjusted), Unit X looks better. Unit X tends to get sicker patients (lower starting scores).
  1.  Q1: "Which unit has greater patient improvement?" Agreed.
  2.  Q2: Assume clean.
  3.  Q3: Starting score? **Yes** (Pre-exposure).
  4.  Q4: Overall: X < Y. Adjusted: X > Y. **Flip: Yes.**
  5.  Q5: a) Exposure Link: Unit X gets patients with lower (worse) starting scores? **Yes.** b) Outcome Link: Is improvement linked to starting score? (e.g., Do sicker patients improve more/less? Check.) *Assume data shows sicker patients (low start) have greater potential for improvement.* **Yes. Both Yes -> Likely Confounding.**
  6.  Q6: Std Rate for Improvement: Use overall pop starting score distribution. Calc will likely show Unit X's Std Improvement > Unit Y's (matches adjusted story).
  7.  Q7: Starting score caused by the unit? **No.**
      \verdict{stratified} *(Procedure forces reporting adjusted figure, even if Unit X looks better)*

  **Case (c): Cannot Settle - Need More Data**
  *   *Scenario:* Comparing complication rates between two surgical teams (Team P vs Team Q). Overall: Team P > Team Q. Stratified by "Surgery Duration": Short Surgeries: P > Q, Long Surgeries: P > Q. But wait! Duration is recorded only for patients who *made it to the operating room*. Many critical patients referred to Team P died *before* surgery (not in data). Team P handles more complex referrals.
  1.  Q1: "Which team has higher complication rate?" Agreed.
  2.  Q2: **Major Gap:** Missing patients who died pre-op (likely Team P). **STOP \verdict{neither}.** *(Data cannot answer question as patients at highest risk are missing)*
      *   **What to Collect:** Need data on *all* patients *assigned* to each team for surgery, including those who died before reaching the OR or were too sick for surgery. Outcome = complication OR death within X days of assignment.

  ---

  \answer{Is the stratifying/grouping factor determined *before* the exposure?}
