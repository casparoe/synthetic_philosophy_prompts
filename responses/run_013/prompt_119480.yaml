  Next, "Death as Non-Experiential State." This is defensible and Epicurus's core idea. It directly addresses fear of death but doesn't invalidate grief. 

  The "Symmetry" argument compares pre-birth and post-death nonexistence. Defensible for fear of death, but again, not relevant to grief. 

