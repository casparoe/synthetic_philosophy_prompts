  ### What will go wrong:
  1. **Round 1:** Teams might not build a complex enough web. Solution: Encourage them to be as intricate as possible. Set a minimum (e.g., at least 10 nodes and 9 links per team) and if they don't meet it, they get a penalty? Or just encourage: "The more you build, the more points you can get."

