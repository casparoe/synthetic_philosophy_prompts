answer: |-
  ### The Activity: **Web of Tales**  
  *An immersive game where writers experience the extended mind through collaborative storytelling and sudden loss of external supports.*

  ---

  ### **Materials & Setup**  
  - **Whiteboard:** Divided into two sections (left/right) with a vertical line.  
  - **Index Cards:** 200+ cards, with 10 cards per writer (14 writers = 140 cards).  
  - **Pens:** One per writer.  
  - **Timer:** For strict timekeeping.  
  - **Stakes:** "Loser buys the round" (small, social stakes).  
  - **Theme:** "The Forgotten Library" (a flexible, writer-friendly prompt about interconnected stories).  

  ---

  ### **Rules & Timeline (90 Minutes Total)**  

  #### **Phase 1: Building the Web (30 Minutes)**  
  - **Goal:** Create a collaborative story web using the whiteboard and index cards.  
  - **Rules:**  
    1. **Teams:** Split into 2 groups of 7. Team A uses the left board, Team B the right.  
    2. **Node Creation:**  
       - Each writer writes **one story element** per index card (e.g., character, object, location, event). Examples: *"A sentient quill," "A labyrinth of mirrors," "The Night of Whispering Fog."*  
       - Place cards on a shared table. **No personal notes allowed.**  
    3. **Web Construction:**  
       - Teams add cards to the board by drawing **nodes** (circles with card text) and **labeled connections** (lines + relationship phrases).  
       - Example: *"Sentient quill — WIELDS — Thief-Archivist"* or *"Labyrinth of mirrors — HIDES — Celestial Map."*  
       - **Rotate turns:** Each writer adds 1 node + 1 connection per turn (30 seconds max). All must contribute.  
    4. **Scoring (Quantifiable):**  
       - 1 point per **node** (card on board).  
       - 1 point per **connection** (labeled line).  
       - *Bonus (optional):* 2 points for a node with 3+ connections.  
  - **Facilitator Role:**  
    - Enforce speed: "30 seconds per turn!"  
    - Track scores publicly (tally marks on board edge).  
    - **DO NOT explain the "why" yet.**  

  #### **Phase 2: The Severing (15 Minutes)**  
  - **Goal:** Experience the loss of externalized "memory."  
  - **Rules:**  
    1. **Sudden Removal:** Erase the whiteboard without warning. Collect **all index cards** into a box.  
    2. **Recall Test:**  
       - Teams have 5 minutes to reconstruct their web **from memory** on a blank board section.  
       - Writers can only use their minds—no cards, notes, or tools.  
    3. **Scoring:**  
       - Compare reconstruction to original:  
         - 1 point per **correctly recalled node**.  
         - 1 point per **correctly recalled connection** (exact label + nodes).  
       - Deductions: -1 per error (misplaced node, wrong label).  
  - **Why it works:** The score drop will be brutal (e.g., Team A had 42 points in Phase 1 but only 12 in Phase 2).  

  #### **Phase 3: Shared Mind Challenge (20 Minutes)**  
  - **Goal:** Provoke ambiguity about "whose mind" the board belonged to.  
  - **Rules:**  
    1. **Merge the Webs:** Both teams combine forces. Their task:  
       - Rebuild the *entire* story web (both sections) **together** using the reclaimed index cards.  
       - Add **3 new bridge connections** between Team A and Team B’s nodes (e.g., *"Sentient quill — REVEALS — Celestial Map"*).  
    2. **Scoring:**  
       - 1 point per **bridge connection** (must be creative and coherent).  
       - *No individual scores—group effort only.*  
    3. **Final Tally:**  
       - Add Phase 1 + Phase 2 scores for each team.  
       - **Loser:** Team with the **lowest combined score** buys drinks.  

  ---

  ### **Debrief (25 Minutes)**  
  *Guide the discussion—never lecture. Use their experience as evidence.*  

  1. **The Removal Test (5 min):**  
     - *Ask:* "How did it feel when the board disappeared? Be specific—was it like losing a tool, or losing *part of yourself*?"  
     - *Highlight:* The score drop proves the board wasn’t just a "tool"—it was **integral to cognition**. Losing it was amputation, not inconvenience.  

  2. **The Blurred Boundary (10 min):**  
     - *Ask:*  
       - "When you rebuilt the web together, did the board feel like *your* mind, *their* mind, or *our* mind?"  
       - "Could one person have held this entire web in their head?"  
     - *Map to Thesis:*  
       - The board wasn’t "yours" or "mine"—it was **part of a coupled system** (group + objects). Thinking happened *between* minds and the room.  
       - Writers already do this: Drafts, notes, and whiteboards aren’t just records—they’re **scaffolding for thought**.  

  3. **The Ugly Follow-Up (5 min):**  
     - *Ask:* "If the board was part of your mind, and it was part of theirs... did we have one mind or fourteen?"  
     - *Reveal the Thesis:* Name-drop Clark & Chalmers ("extended mind") **only now**.  
     - *Key Insight:* Cognition isn’t confined to the skull. It’s a **feedback loop** between brain, body, and environment.  

  4. **What the Activity Can’t Teach (3 min):**  
     - *Limitation:* This game can’t replicate **long-term integration** (e.g., a notebook you’ve used for years becoming "part of you").  
     - *Salvage:* Acknowledge this gap. Ask: "How might months of using index cards change your relationship with them?"  

  5. **Closing (2 min):**  
     - End with the line: **"Where does the mind stop and the rest of the world begin?"**  
     - Let the silence hang. Pass the drinks from the losing team.  

  ---

  ### **What Will Go Wrong (and How to Fix It)**  
  1. **Problem:** Teams build simple webs (low node/connection count), making the removal less painful.  
     - *Fix:* Urge speed and complexity: "Go wild! More nodes = higher scores!" Use the bonus rule.  

  2. **Problem:** Writers hoard cards or take secret notes.  
     - *Fix:* Roam the room during Phase 1. Joke: "If I see scribbling, you’re buying drinks regardless!"  

  3. **Problem:** Chaos during Phase 3 (too many people at the board).  
     - *Fix:* Assign 2 "scribes" per team. Others dictate from their seats.  

  4. **Problem:** The thesis feels forced in debrief.  
     - *Fix:* Anchor discussion in *their quotes*. Ask: "Remember when [Name] said, ‘I couldn’t think without the board’? That’s the thesis."  

  5. **Problem:** Low stakes = low engagement.  
     - *Fix:* Announce stakes early: "This isn’t theoretical—someone’s buying drinks!" Laughter bonds the group.  

  ---

  ### **Why This Works for Writers**  
  - **No abstraction:** They *feel* the extended mind via story-building (their craft).  
  - **The removal is visceral:** Scores plummet—proof the board was cognitive scaffolding.  
  - **Shared ambiguity:** Phase 3 forces the question: "Was this *my* mind or *ours*?"  
  - **You stay quiet:** The game does the teaching. You’re just the referee.  

  Run it tight, embrace the chaos, and watch them gasp when the board vanishes. The best debriefs start with, "Holy shit, I felt naked without that whiteboard." That’s your cue.
