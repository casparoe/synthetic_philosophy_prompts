  3. **Round 2 Reconstruction:** They might argue about what was there. That's okay, it shows the fragility of memory without the external aid.

  4. **Round 3:** The merging might be chaotic with 14 people. Solution: Let them self-organize, but if needed, appoint a facilitator for each team? Or let them choose a representative to draw. Alternatively, they can discuss and then a few go to the board.

  5. **Scoring:** It might be messy to score during the game. Solution: Have a scoring sheet. You (the facilitator) and maybe one volunteer can score during the reconstruction. For Round 1, you count the nodes and links at the end of the round. For Round 2, you count during the reconstruction.

  ### Debrief (30 minutes):
  1. **Experience:** Ask them to describe what happened. Focus on:
     - How did it feel to build the web? (They might say it felt natural, like they were thinking together.)
     - How did it feel when the board was erased? (Loss, frustration, like they lost part of their memory.)
     - How did the index cards help? (They had the nodes, but without the structure, they were incomplete.)
