  6. **Reveal the thesis:** At the end, reveal that this is about the extended mind thesis (Clark and Chalmers, 1998). Then ask: "Where does the mind stop and the rest of the world begin?" and close with that line.

  ### Stakes:
  - The losing team (based on Rounds 1 and 2 combined) buys a round of drinks for the group.

  ### Materials Checklist:
  - Whiteboard and markers (two colors if possible).
