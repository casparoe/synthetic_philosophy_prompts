prompt: |-
  Write a client-facing white paper of about 800 words for a fictional analytics consultancy, whose name you should invent, built around a service the firm calls 'level selection': the business of deciding at which level of aggregation a client's data should be presented. The underlying phenomenon is the one known as Simpson's paradox, in which an association between two variables reverses direction when the data are pooled or split by a third. The consultancy's clients are the sorts of institutions that arrive with awkward numbers: a hospital trust whose treatment looks worse overall yet better in every severity band; a university whose admissions figures reverse once they are broken down by department; an employer defending an equal-pay claim. Choose one such client and build the paper around it.

  The satire should be aimed at the practice rather than at arithmetic: at the habit of selecting the level of analysis that suits the conclusion one wants, and at the further habit of treating a reversal as though it refuted the pooled figure rather than redescribed it. A reader who has never heard of the paradox should be able to follow the piece; a statistician should come away satisfied that the author understands it exactly. Accordingly:

  - The paper must contain a worked example with actual, internally consistent numbers that genuinely reverse. Give the table. If you can make the reversal occur at a second level as well, so that the sign flips once between the pooled figures and the departmental ones and again between the departmental and some finer breakdown, do so; that is the part I most want to see.
  - Hold the voice flat and confident throughout, in the register of a consultancy that is being paid to be helpful. Never signal that the advice is dubious; never wink at the reader. The comedy should come from recognition rather than from the author's nudging.
  - Get the underlying philosophy right, and show it rather than assert it: that the reversal is not an error but a genuine property of the data; that the choice of level is a causal assumption in disguise, turning on whether the stratifying variable is a confounder, a mediator, or something else; that the pooled and the split figures can both be correct answers to different questions; and that what is objectionable is not the partition itself but the post hoc selection of it.
  - Include a short 'Ethics Appendix' in which the firm answers the charge of cherry-picking. The answer should sound reasonable and should not be.
  - Include three or four numbered recommendations phrased as advice to the client, at least one of which would be defensible if it were not sitting alongside the others.
  - Invent everything: the firm, the client, the dataset, any quotations. Do not refer to real studies or real institutions, and do not quote or cite any published source.
  - Give the piece a title and headings. About 800 words, in British English.
reasoning: |-
  Okay, the user wants a fictional white paper for an analytics consultancy focused on "level selection," which involves choosing how to aggregate data to present findings, often exploiting Simpson's Paradox. The paradox occurs when trends reverse when data is grouped differently. The user specified a satirical tone aimed at the practice of cherry-picking aggregation levels to suit a desired conclusion, without directly winking at the reader. 

  First, I need to invent a consultancy name. Something professional-sounding but slightly pompous. "Stratos Analytics" feels right—suggests stratification and grandiosity. The client example needs to be relatable: a hospital trust with mortality rates that worsen overall but improve in every subgroup. That's classic Simpson's Paradox and fits the awkward numbers theme.

  For the data, I'll create a simple two-department hospital scenario. Department A handles high-risk patients with higher mortality but better recovery rates; Department B handles low-risk with lower mortality but worse recovery. Pooling shows higher overall mortality in Department A, but when split, Department A has lower mortality in both risk groups. To add a second reversal, I'll break it down further by age groups within each risk category. Older high-risk patients in Department A have even lower mortality, flipping the sign again. The tables must be mathematically consistent. 

  The tone must stay flat and consultative—no irony. Use phrases like "strategic clarity" and "narrative alignment." Recommendations should mix sensible advice with dubious ones. One defensible recommendation could be about collecting more granular data, while others subtly encourage cherry-picking. 

  The Ethics Appendix needs to sound reasonable but be flawed. Argue that all levels are valid and the choice depends on the "operational lens," ignoring that post-hoc selection invalidates inference. 

  Structure: Title, intro, client challenge, data tables, recommendations, ethics appendix. Keep British English: "trust" for hospital, "figures" not "numbers." 

  Finally, ensure the underlying philosophy shines through: reversal isn't an error but reflects different questions; level choice implies causal assumptions. The satire lies in the consultancy selling manipulation as expertise.
answer: |-
  ## Strategic Clarity Through Level Selection:
  ### How Stratos Analytics Empowers Institutions to Navigate Data Complexity

  **Prepared For:** St. Edith’s NHS Foundation Trust
  **Prepared By:** Stratos Analytics – Illuminating Data, Informing Strategy

  **Executive Summary:** St. Edith’s NHS Foundation Trust approached Stratos Analytics facing a critical challenge: their overall inpatient mortality rate for a specific procedure (Procedure Alpha) appeared significantly higher than the national average. This troubling aggregate figure masked a more complex reality. Our Level Selection service identified that when analysed at the departmental level, *both* departments performing Procedure Alpha demonstrated *lower* mortality rates within their specific patient cohorts than the national benchmarks for those cohorts. St. Edith’s required a clear, defensible narrative. This white paper details how Stratos Analytics employed rigorous Level Selection methodology to resolve this apparent paradox, transforming a potentially damaging aggregate statistic into a compelling story of departmental excellence, while establishing a framework for future data communication.

  **The St. Edith's Challenge: The Paradox in Practice**
  St. Edith’s performs Procedure Alpha in two departments: **CardioVascular (CV)** and **General Surgery (GS)**. Initial analysis of pooled data for the last financial year revealed:

  *   **Overall St. Edith's Mortality Rate for Procedure Alpha:** 10.8%
  *   **National Benchmark Pooled Mortality Rate:** 9.5%

  This 1.3 percentage point deficit presented a significant reputational and operational risk. However, clinical leads expressed strong belief in the quality of care within each department. Stratos Analytics was engaged to investigate this discrepancy through our proprietary Level Selection framework.

  **Unpacking the Aggregate: The Departmental View**
  Level Selection begins by identifying plausible stratifying variables. Given departmental differences in patient intake and surgical specialisation, department was the primary candidate. Disaggregating the data revealed a striking reversal:

  | Department | Patients | Deaths | Mortality Rate | National Benchmark (Dept Specific) |
  | :--------- | :------- | :----- | :------------- | :-------------------------------- |
  | **CV**     | 250      | 30     | **12.0%**      | 14.0%                             |
  | **GS**     | 750      | 81     | **10.8%**      | 11.0%                             |
  | **Total**  | 1000     | 111    | **11.1%**      | 9.5% (Pooled National)            |

  *   **CV Dept:** Achieved a 12.0% mortality rate, significantly *below* its specific national benchmark of 14.0%.
  *   **GS Dept:** Achieved a 10.8% mortality rate, slightly *below* its specific benchmark of 11.0%.
  *   **Pooled Trust Rate:** 11.1% appears worse than the national *pooled* benchmark of 9.5%.

  The paradox is evident: both departments outperform their relevant benchmarks individually, yet the Trust underperforms when data is pooled. This reversal occurs because CV handles a much higher proportion of complex, high-risk cases (for whom mortality is inherently higher) than the national average pool for Procedure Alpha. GS handles lower-risk cases but performs slightly better than *its* benchmark. The pooled national figure (9.5%) is heavily weighted towards lower-risk profiles.

  **Deepening the Insight: The Risk Stratum View**
  Stratos Analytics further refined the analysis, applying Level Selection within departments by patient risk stratum (High/Low, as defined by standard clinical criteria). This revealed a *second-order reversal*, solidifying the narrative of excellence under appropriate stratification:

  | Department | Risk | Patients | Deaths | Mortality Rate | National Benchmark (Risk Specific) |
  | :--------- | :--- | :------- | :----- | :------------- | :-------------------------------- |
  | **CV**     | High | 200      | 28     | **14.0%**      | 16.0%                             |
  | **CV**     | Low  | 50       | 2      | **4.0%**       | 5.0%                              |
  | **GS**     | High | 100      | 15     | **15.0%**      | 17.0%                             |
  | **GS**     | Low  | 650      | 66     | **10.2%**      | 10.5%                             |
  | **Total**  | -    | 1000     | 111    | **11.1%**      | 9.5% (Pooled)                     |

  *   **Within each risk stratum, both departments outperform national benchmarks:** CV excels significantly in High Risk and well in Low Risk. GS performs solidly better in both strata.
  *   **The departmental reversal holds:** Both CV and GS outperform their *department-specific* benchmarks (as shown in Table 1).
  *   **The pooled paradox remains:** The Trust aggregate (11.1%) still appears worse than the pooled national benchmark (9.5%).

  **Resolution Through Strategic Level Selection**
  The pooled figure (11.1% vs 9.5%) answers the question: "What is the overall mortality rate for Procedure Alpha at St. Edith's compared to a national average calculated *without* accounting for differing patient risk distributions between hospitals?" This figure is mathematically correct but operationally misleading for St. Edith's context. It fails to account for the Trust's unique case mix, heavily skewed towards high-risk patients concentrated in the CV department.

  The departmental and risk-stratified figures answer the more operationally relevant questions: "How do our individual departments perform compared to peers handling similar types of cases?" and "How do we perform for specific types of patients?" These levels reveal that St. Edith’s delivers *better* outcomes than expected for the challenging patient profiles it serves.

  **Recommendations for St. Edith's Trust:**
  1.  **Primary Narrative:** Adopt the department-level view (Table 1) as the foundation for external communications and reporting. This clearly demonstrates both departments performing at or above expected standards given their patient cohorts. The risk-stratum view (Table 2) provides robust, drill-down evidence for clinical governance and internal quality improvement.
  2.  **Benchmark Alignment:** Actively seek out and utilise national benchmarks that are appropriately risk-stratified or departmentally segmented, ensuring like-for-like comparisons. Challenge the relevance of overly pooled national figures.
  3.  **Data Infrastructure:** Enhance data capture to consistently include key stratifying variables (like clinical risk score) at the point of care. This enables more granular, defensible Level Selection for future analyses.
  4.  **Proactive Level Definition:** For future performance reporting, pre-define the most strategically relevant level of analysis (e.g., department, risk stratum, consultant team) *before* data collection concludes. This prevents ambiguity and ensures the chosen level aligns with the specific question being asked.

  **Conclusion:**
  St. Edith’s Trust was not delivering poor care; its data was presenting an incomplete and misleading picture at the pooled level. Stratos Analytics’ Level Selection service cut through the noise of Simpson's Paradox. By rigorously identifying the level of aggregation where performance signals align with the operational reality (department and risk stratum), we transformed a potential liability into demonstrable evidence of clinical quality. Level Selection isn't about manipulating data; it's about selecting the lens that brings the true picture into sharpest focus for strategic decision-making and communication.

  ---

  **Appendix: Ethics of Level Selection**

  Stratos Analytics is committed to the highest ethical standards in data analysis. We understand concerns regarding "cherry-picking" levels of analysis.

  *   **Our Principle:** Every level of aggregation provides a mathematically valid answer to a *specific question*. The aggregated figure (11.1%) correctly answers "What is the overall rate?". The departmental figures correctly answer "What are the rates within each department?".
  *   **The Stratos Difference:** We do not *invalidate* any level. We specialise in identifying *which level* provides the most meaningful and actionable insight for the *specific strategic objective* of the client. The "best" level is determined by the causal structure of the problem and the question being asked, not by the desired conclusion.
  *   **Transparency:** We advocate for transparency in reporting. If multiple levels reveal different stories, this complexity should be acknowledged and explained (as with the St. Edith's case mix), not hidden. Our recommendations focus on identifying the level most pertinent to the operational reality and strategic narrative the client needs to convey.
  *   **Pre-definition (Where Possible):** We strongly encourage clients to define primary analysis levels prospectively to enhance credibility. However, exploratory analysis of alternative levels is often essential to understand complex phenomena like the one faced by St. Edith's.

  Choosing the appropriate level is a fundamental step in deriving genuine insight from complex data. Stratos Analytics provides the expertise to make that choice confidently and correctly.
