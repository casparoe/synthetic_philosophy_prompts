  ### Dollar Auction Poem
  **Speaker:** The losing bidder, reflecting on each bid  
  **Form:** Rhyming couplets with bids rising by $0.05 per line  

  **The Bids**  
  *(Starting at $0.05, escalating to $1.40)*  
  He bids five cents. I bid ten:  
  *Ninety cents profit* if he folds right then.  
  He bids fifteen. I bid twenty—  
  *Eighty cents gain* if he leaves empty.  
  He bids twenty-five. I raise to thirty—  
  *Seventy cents profit*, neat and dirty.  
  He bids thirty-five. I leap to forty.  
  *Sixty cents profit*? Sounds a surety.  
  He bids forty-five. I strike at fifty—  
  *Fifty cents gain*; he’ll fold, I’m nifty.  
  He bids fifty-five. I hit sixty.  
  Forty cents left? Still seems thrifty.  
  He bids sixty-five. I charge to seventy.  
  *Thirty cents gain*? I’ll take that plenty.  
  He bids seventy-five. I dash to eighty—  
  *Twenty cents profit*... but stakes feel weighty.  
  He bids eighty-five. I vault to ninety.  
  *Ten cents gain*... this grows ungodly.  
  He bucks ninety-five. I surge to one.  
  *No gain at all*... but quitting? None.  

  **The Trap**  
  He bids one-oh-five. I groan—*one-ten*.  
  *Losing a dime* beats sinking ten.  
  He bids one-fifteen. I crawl to one-twenty—  
  *Lose thirty cents*? Or chase a penny?  
  He bids one-twenty-five. I bleed one-thirty.  
  *Forty cents sunk*—this dance feels flirty.  
  He bids one-thirty-five. I howl—*one-forty*.  
  **Ninety cents loss**... but *still* less than quitting’s penalty.  
  *(Quit now? Lose $1.35. Bid? Lose just $0.90 if he folds...)*  

  **Final Stanza (Mirroring the First)**  
  He bids one-forty. I roar—*one-forty-five*:  
  *Losing ninety cents* if he drops, I’m alive.  
  *(Same move, higher stakes: $1.45 bid risks $0.90 loss instead of $1.40 loss from quitting. The "profit" is now avoiding deeper ruin.)*  

  ---

  ### Analysis: Settled vs. Contested  
  **Settled Mechanics:**  
  - The auction’s rules (winner gets the dollar, second-highest bidder pays and gets nothing).  
  - Bids escalate via locally rational choices: each bid minimizes immediate loss (*e.g., bidding $0.90 to avoid losing $0.85 if you quit*).  
  - The trap emerges when the cost of quitting exceeds the cost of bidding again, locking bidders into losses.  

  **Contested Interpretations:**  
  1. **Real-world relevance**: Is this a valid model for wars, R&D races, or litigation? Some argue it captures "escalation traps"; others say real conflicts involve asymmetric information or values not reflected here.  
  2. **Blame allocation**: Is the failure due to irrational bidders or an inherently toxic game structure? Experiments show even rational players get trapped, but critics note human sunk-cost biases amplify it.  
  3. **Sunk-cost linkage**: Is this *identical* to sunk-cost fallacy? Some say yes (both involve "throwing good money after bad"); others note sunk costs aren’t required here (*e.g., first bidder faces no sunk cost yet still escalates*).  
  4. **Solutions**: Does pre-commitment, mediation, or bid caps fix it? Labs show caps reduce losses, but in practice, enforcement is debated. Some argue only avoiding the game works.  

  **Key Insight**:  
  The dollar auction’s power lies in exposing how *locally sound* decisions breed *globally catastrophic* outcomes—no stupidity needed. Its elegance is in the math, but its fury is in the human stories we project onto it.
