prompt: |-
  Ok so this is a weird request and I'm not totally sure how to even ask it. My oldest friend (call her M) is getting married next month, and she met her fiancé in grad school — they're both philosophers — and I've somehow ended up giving the toast. The complication is that they met in a seminar on the problem of universals and honestly it's the thing that brought them together. The setup: he's a nominalist about properties — he thinks there's no such thing as a single 'redness' that two red things literally share, only particular rednesses that resemble each other — and she's a realist who thinks there really is one thing, the universal, that both things genuinely share. They have this running bit where anytime one of them says two things are 'the same' the other raises an eyebrow, and 'the one over many' is basically their pet name for each other. I did one intro philosophy course in college so I know just enough to get myself in trouble here. What I want is a toast that actually celebrates them — how much they have in common, how they bring out the same qualities in each other, that kind of thing — but I don't want to say anything either of them would consider false, and I really don't want to smuggle in a metaphysical commitment that quietly picks a side. Half the room is their philosopher friends who will definately notice if I do, and the other half is both sets of parents and relatives who will be completely lost (and a little alarmed) if the whole thing turns into a talk about properties. Can you write me something in the neighborhood of a five-minute toast?

  I'm hoping you can take this on as someone who's both a competent philosopher and a good speechwriter, and actually think it through before you write a word. Maybe start by brainstorming which ordinary wedding-toast sentences are secretly 'loaded' given the nominalism/realism split — does saying 'the same love' already take a side? does 'you two share so much' commit me to something? does 'you're made for each other' imply a universal or a resemblance or neither? — then for each one work out the affectionate version that neither of them could object to, and only then write the toast. The philosophical stuff should do real structural work here: it should shape what I can and can't say, not just be a cute joke I bolt on at the end. It's fine if the philosophers chuckle and the families just think I'm being sweet. It's not fine if the families feel like they're sitting in a lecture or the philosophers feel like I cheated. Pleae take your time on this one.
