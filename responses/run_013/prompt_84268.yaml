prompt: |-
  I'm a novelist — fourth book, secondary-world stuff — and my editor keeps telling me the rituals in my invented societies read like set dressing. She's right, and I think it's because I never asked what any of them are *for*. A friend who does behavioral ecology told me to stop thinking about customs and start thinking about signals. Some traits are indices, she said: they can't be faked because they're physically tied to the underlying quality (you can't fake being the biggest stag). Others are handicaps: they only pay off if you're good enough to afford the cost, which is why the price has to fall harder on low-quality signalers than high-quality ones. She also mentioned signals of need versus signals of quality, that a purely conventional gesture can still be honest while interests line up (cheap talk), and that signals rot over time as receivers learn to discount them. I nodded alot.

  Here's what I want. Put on your behavioral ecologist hat and your dramaturg hat, think carefully, and before you write anything, brainstorm a little about how signals fail in a world like mine. Then give me a procedure I can actually run on any ritual I invent — fifteen minutes, no theory, I'm definately not reading a textbook: ordered questions, what counts as an answer to each, where it says "this is just a cost, not a signal," where it says "cut this or go fix the economy," and where it hands the call back to me because it's an authorial question rather than a biological one. Then run it on three: the nine-day adolescent fast in the hills, the suitor's public gift of a season's spice harvest, and the daily stick of temple incense everyone burns. Make sure one of the three comes out somewhere I won't like — I'd rather find out now. And tell me what the procedure can't do.
reasoning: |-
  Okay, the user is a novelist working on their fourth book in a secondary world. Their editor pointed out that the rituals feel like set dressing, lacking depth. A friend in behavioral ecology suggested thinking in terms of signals instead of customs. The user wants a practical, fifteen-minute procedure to analyze any ritual through the lens of signaling theory. They also want me to apply it to three examples and ensure one fails the test.

  First, I need to recall the key concepts from signaling theory: indices (unfakeable traits), handicaps (costly signals that differentiate quality), signals of need vs. quality, cheap talk (low-cost honest signals when interests align), and signal decay. The challenge is to translate these into actionable questions without theory jargon.

  The user needs a step-by-step procedure. It should be efficient, ordered, and include clear decision points. Questions must identify the signal's purpose, costs, honesty mechanisms, and potential failures. I should flag when something isn't a signal (just a cost) or when the economy doesn't support it. Also, note where authorial choice is needed.

  For the procedure, I'll structure it into five questions: 
  1. Who signals to whom? 
  2. What's being claimed? 
  3. What's the cost? 
  4. How is it enforced? 
  5. What could go wrong? 

  Each question needs specific answers. For example, question 3 should distinguish between indices (inherent costs) and handicaps (deliberate costs). Question 4 checks for honesty via indices, handicaps, or alignment of interests. Question 5 assesses risks like signal decay or exploitation.

  Now, applying this to the three rituals: 
  1. **Nine-day adolescent fast**: Signals endurance/commitment. Cost is physical suffering. It's a handicap. But risks include high mortality or cheating, making it potentially unsustainable. The procedure might flag it as problematic. 

  2. **Suitor's spice harvest gift**: Signals resources/skill. Cost is labor and opportunity loss. Could be a handicap, but if wealth inequality is high, it might not differentiate skill. Risk of inflation or exclusion of the worthy poor. 

  3. **Daily temple incense**: Signals piety. Low cost, so likely cheap talk. Risks include signal decay if everyone does it without belief, or economic burden if incense is expensive. 

  I need to ensure one ritual fails. The fast has high risks, so that could be the one. The incense might be ineffective if it's too cheap. 

  The procedure's limitations: It can't create cultural meaning or handle symbolic depth. It focuses on functional honesty, not narrative themes. Also, it assumes rational actors, which might not fit all societies. 

  Finally, the user might have deeper needs: wanting rituals to feel organic, enhance plot/character, and avoid clichés. The procedure should help embed rituals in the world's logic, making societies feel alive. Highlighting flaws can create conflict, adding depth to the story. 

  I'll present the procedure clearly, then analyze each ritual with the questions, pointing out where they succeed or fail. Emphasize that some outcomes require authorial decisions, like balancing realism with story needs. Conclude with limitations to manage expectations.
answer: |-
  Here's a behavioral ecologist's fast ritual audit procedure, designed for maximum novelist utility in 15 minutes or less. **No theory jargon, just actionable questions.**

  **The Ritual Signal Interrogation Procedure:**

  1.  **Who Signals to Whom?**
      *   *Answer Needed:* Specific actor(s) performing the ritual → Specific audience(s) observing/receiving it. (e.g., "Adolescents → Elders & Community", "Suitor → Potential Spouse & Their Kin", "Household Head → Neighbors & Priests").
      *   *Red Flag:* "Everyone to everyone vaguely." Needs sharpening.
      *   *Authorial Handoff:* If the audience is unclear or the signaler's identity is culturally complex.

  2.  **What's Being CLAIMED? (The Underlying Quality/State)**
      *   *Answer Needed:* A concrete, valuable trait, resource, commitment, or state the ritual performer is *trying to prove* they possess. Must be hard to observe directly. (e.g., "Endurance/Commitment", "Resource Abundance/Skill", "Piety/Loyalty").
      *   *"Just a Cost" Alarm:* If the answer is just "They are performing the ritual" or "Obedience." That's the *action*, not the *underlying quality* it signals. Dig deeper *why* obedience/performance matters here.
      *   *"Cut/Fix Economy" Alarm:* If the claimed quality seems trivial, unbelievable, or irrelevant to the audience's interests in *this* society. Does proving this *actually* benefit the signaler with this audience?

  3.  **What's the COST? (The Price of the Signal)**
      *   *Answer Needed:* What tangible, unavoidable resources (time, energy, food, money, risk, opportunity) are expended *specifically because* it's a ritual display? (e.g., "9 days of hunger/weakness/risk", "Entire season's valuable spice income", "Daily expense of incense + time").
      *   *"Just a Cost" Alarm:* If the cost is purely functional (e.g., fasting because food is scarce anyway, burning incense for light/smell). The cost must be *added* for signaling.
      *   *Authorial Handoff:* Quantifying how costly this *really* is within your world's economy/ecology. Is this ruinous, trivial, or significant-but-manageable?

  4.  **How is it ENFORCED? (The Honesty Mechanism)**
      *   *Answer Needed:* Pick ONE primary mechanism that keeps the signal honest (prevents cheap faking):
          *   **A. Index Trap:** Is the cost *inherently linked* to the claimed quality? (e.g., You can't fake surviving the fast *unless* you actually have endurance/resources/support. You can't gift the spice *unless* you actually harvested it).
          *   **B. Handicap Squeeze:** Does the cost *hurt low-quality signalers MORE*? (e.g., A weakling is more likely to die/permanently weaken in the fast. A poor/unskilled suitor loses proportionally more by giving away the spice harvest).
          *   **C. Aligned Interests ("Cheap Talk"):** Is the cost very low *AND* do the signaler and receiver *share the exact same goal*? (e.g., Everyone wants the community to *appear* pious to outsiders, so burning cheap incense is a coordinated display).
      *   *"Cut/Fix Economy" Alarm:* If you can't pick A, B, or C convincingly. The signal is probably dishonest/flimsy. Either add a mechanism or reconsider the ritual/economy.
      *   *Authorial Handoff:* How the audience actually verifies/assesses the signal (do they watch the fast? judge spice quality? smell the incense?).

  5.  **What Could Go WRONG? (Signal Failure Modes)**
      *   *Answer Needed:* Brainstorm 1-2 plausible ways this signal could decay, be exploited, or backfire *within your world's logic*:
          *   **Decay:** Does the cost become trivial over time (inflation)? Does everyone do it regardless of the quality, making it meaningless? (e.g., Incense becomes cheap; even lazy people burn it daily).
          *   **Exploitation:** Can low-quality types fake it or bear the cost dishonestly? (e.g., Sneak food during the fast; buy spice to gift instead of harvesting it yourself).
          *   **Backfire:** Does it accidentally signal something *bad*? Or attract the *wrong* audience? (e.g., Surviving the fast might signal luck over endurance; lavish gifting might signal wastefulness, not suitability).
      *   *"Cut/Fix Economy" Alarm:* If failure modes seem inevitable and catastrophic to the signal's function. Time to redesign the ritual or the context.
      *   *Authorial Handoff:* Are these failure modes *interesting*? Could they drive plot/character conflict? Embrace or mitigate them?

  ---

  **Audit Results:**

  **1. The Nine-Day Adolescent Fast in the Hills**

  1.  **Who → Whom:** Adolescents (specific age group) → Elders / Community Leaders / Potential Mates.
  2.  **Claimed:** Physical endurance, mental fortitude, resilience, commitment to the group ("Can survive hardship for us"), maybe spiritual purity/connection.
  3.  **Cost:** Severe physical suffering (hunger, exposure, weakness), significant risk (injury, illness, death), lost time/opportunity (not helping family, learning skills).
  4.  **Enforced:** **B. Handicap Squeeze (Primary)** - A weaker, less resilient, or less prepared adolescent is *much* more likely to fail, get sick, suffer permanent damage, or die. **A. Index Trap (Secondary)** - You genuinely can't fake enduring 9 days of starvation/exposure without the underlying toughness/support. (*Authorial: How is cheating prevented? Supervision? Geography? Honor system?*)
  5.  **Failure Modes:**
      *   **Exploitation:** Wealthy families provide covert support (hidden food, warm shelters). Strong but rebellious youths endure easily but learn no lesson. (*Authorial: Is this tolerated? How?*)
      *   **Backfire:** High mortality rates weaken the community. Survivors might be callous or traumatized, not resilient. Signals luck more than character.
      *   **Decay:** If times are always hard, endurance is common; the signal loses differentiation. If times are easy, it seems unnecessarily cruel.
      *   **"Cut/Fix Economy" Alarm:** **THIS IS THE ONE YOU WON'T LIKE.** High mortality is biologically unsustainable unless birth rates are *very* high or adolescents are expendable (grimdark). *Solution Paths:* Make it shorter/less lethal (weakening the handicap). Add a *non-fatal* but clear "failure" state (e.g., visible stigma, social exclusion). Make resources/support part of the *honest signal* (Index - only well-connected/resourced youths can afford the *preparation*, allowing them to survive). Or, lean into the unsustainability - maybe this ritual *is* decaying/causing crisis.

  **2. The Suitor's Public Gift of a Season's Spice Harvest**

  1.  **Who → Whom:** Suitor → Potential Spouse, Spouse's Family (Kin Group), potentially the wider Community.
  2.  **Claimed:** Resource abundance (I have so much, I can give this away), farming/harvesting skill (I produced this bounty), generosity, commitment (I invest this in *you*).
  3.  **Cost:** The entire market value (or subsistence value) of a season's worth of labor-intensive spice harvest. Opportunity cost (not selling it for profit/necessities).
  4.  **Enforced:**
      *   **A. Index Trap:** You physically cannot give what you don't have/harvest. The *quantity/quality* is direct evidence.
      *   **B. Handicap Squeeze:** Giving away this harvest is a MUCH bigger sacrifice for a poor or unskilled farmer than for a wealthy or skilled one. The poor farmer might risk starvation or debt; the skilled one still has surplus.
      *   (*Authorial: Is the spice quality verifiable by the audience?*)
  5.  **Failure Modes:**
      *   **Exploitation:** Suitor borrows/buys spice to gift instead of growing it (faking skill/abundance). Family pools resources to make one suitor look good.
      *   **Decay:** Spice value plummets (inflation), making the gift trivial. Everyone expects huge gifts regardless of actual wealth/skill ("Keeping up with the Jonses").
      *   **Backfire:** Signals extravagance/wastefulness rather than suitability. Attracts gold-diggers, not genuine partners. Poor but worthy suitors are excluded. Causes resentment in the suitor's own family.
      *   *Verdict:* **Functionally Sound.** Mechanisms are strong. Failure modes are narratively rich (fraud, inflation, social pressure). *Authorial Levers:* Control spice value & ease of acquisition. Define how easily skill vs. wealth can be faked.

  **3. The Daily Stick of Temple Incense Everyone Burns**

  1.  **Who → Whom:** Household Head / Individual → Neighbors, Community, Priests, (maybe) the Gods.
  2.  **Claimed:** Piety, conformity, loyalty to the temple/faith, good citizenship, belonging ("I am one of you").
  3.  **Cost:** Daily cost of incense sticks + small time investment to burn it.
  4.  **Enforced:** **C. Aligned Interests (Cheap Talk):** The primary audience (community, priests) *wants* everyone to *appear* pious and conformist. It maintains social order and temple authority. The cost is low enough that even the minimally pious will do it to fit in. Dishonesty (burning without belief) doesn't directly harm the receivers' core interests in conformity. (*Authorial: Are the Gods real? If yes, does the incense *actually* do something? Then cost/enforcement changes!*)
  5.  **Failure Modes:**
      *   **Decay (Inevitable here):** This is the classic "cheap talk" rot. If *everyone* does it regardless of true belief (which they will, because cost is low and pressure is high), it becomes a meaningless social formality. It signals "not a rebel" more than "truly devout."
      *   **Exploitation:** Hypocrites burn incense while acting against the faith. Cynical priests profit from selling incense.
      *   **Backfire:** Becomes a tool for social policing ("Why didn't YOUR smoke rise today?"). Burden on the very poor.
      *   *Verdict:* **Biologically Plausible but Thematically Shallow (as-is).** It's honest only about conformity, not deep piety. *Authorial Levers:* Make the cost *meaningful* for the poor (turning it into a weak Handicap for devotion). Add a *true* Index/Handicap ritual *alongside* this cheap talk one (e.g., weekly painful penance, huge tithes). Or, embrace the decay – the incense *is* just conformity, and true devotion is shown elsewhere (or absent).

  **What the Procedure CAN'T Do:**

  1.  **Invent Cultural Meaning:** It tests the *functional logic* of a signal, not its deep emotional, historical, or symbolic resonance. *Why* endurance, spice, or incense? That's your authorial magic.
  2.  **Define "Quality":** It relies on *you* defining what's valuable (Endurance, Piety, Resources) in your society. Biology sets constraints, not values.
  3.  **Handle Pure Symbolism/Art:** Rituals can be art, commemoration, or pure tradition with *no* signaling function. The procedure will flag these as "Just Cost" or lack enforcement. That's fine! But know that's what they are.
  4.  **Account for Irrationality/Religion:** If gods are real and active, the "audience" and "costs" change dramatically. The procedure assumes purely biological/social receivers.
  5.  **Guarantee Narrative Interest:** A biologically sound signal can still be boring. A flawed one can be fascinating. This is about internal logic, not drama.
  6.  **Replace Character/Plot:** A ritual is a tool. How characters *interact* with it (embrace, reject, cheat, suffer) creates the story.

  **In essence:** This procedure forces you to identify the **Sender, Receiver, Message, Stamp of Authenticity, and Weak Points** for any ritual. Run it fast. If the ritual fails the audit, either fix its economic/biological logic, or lean into *why* it's flawed and decaying within your world – that's often where the real story lies. Good luck!
