prompt: |-
  I'm TAing for a second-year metaphysics course and I'm about a week behind on marking, so I'm outsourcing one question to you. It's the short answer on semantic externalism. They had 45 minutes and a 400-word cap, so the answers are dense and there isn't much room to hedge. The question I set was: (1) state exactly what the Twin Earth case is supposed to establish about the relation between a speaker's inner states and what her words refer to, and name one thing it's often taken to establish that it doesn't; (2) then take this variant on the case — the setup is Putnam's, except that from about 1850 the two planets are in regular radio contact and the chemists on both sides collaborate, so that by 1900 everyone on both planets knows that the local liquid on Earth is H2O and the local liquid on Twin Earth is XYZ, and both communities go on calling their own local liquid water; in 1900, do Oscar's and Twin-Oscar's words for water have the same reference, and do they mean the same thing by it?; (3) finally, does the case tell against narrow content, where narrow content is content that supervenes on what's inside the head?

  Here's the answer from a student who is normally solid.

  Putnam asks us to imagine Twin Earth, a planet that duplicates Earth in every respect except that what the inhabitants call water is not H2O but a different substance, XYZ, which is indistinguishable from water in all everyday respects. Oscar on Earth and Twin-Oscar on Twin Earth are molecule-for-molecule duplicates: their inner lives are identical, they have the same beliefs, memories and sensations, and they would say and do the same things. But when Oscar says water he refers to H2O, and when Twin-Oscar says water he refers to XYZ. So the reference of a speaker's terms is not fixed by anything inside her head, and meanings are not in the head.

  What the case doesn't show is that there is no such thing as narrow content. It's an argument about the reference of natural kind terms, and it leaves it open that some level of content — the level Fodor is after — does supervene on the brain, even if that content doesn't determine truth conditions in the ordinary way. It also doesn't show that we can't know what our own words mean.

  On the variant, once the two planets are in regular contact and the chemists have jointly established what the two liquids are, the two populations are part of a single linguistic community in the relevant sense, so their words converge. After 1900 water means the same thing on both planets: roughly, the liquid, whichever of H2O or XYZ you happen to have locally. The reference would have to be the disjunction H2O or XYZ, since that is the stereotype the two communities now share. So the original intuition only holds for populations that are causally isolated from one another.

  On narrow content, the Twin Earth argument actually shows that no content at all supervenes on the brain: the two Oscars are identical in the head and differ in what they mean. This is the same point Putnam pushes further when he says that even an ideal theory can't fix reference, so reference is ultimately indeterminate, and the causal theory of reference is all that keeps our terms attached to anything. The arthritis case, which Putnam uses to show that meaning depends on the linguistic community, makes the same point at the social level.

  What I need from you is a mark out of 10 and then the comments I'd write in the margin — line by line, not a general impression. These go back to the students with the marks on them, so the comments have to be things I'd definately be happy to defend in office hours, and where you think something is wrong I want you to say what the right thing is rather than just flagging it. Also tell me how much you'd take off for each problem, since I have to justify the mark distribution to the course convenor.
reasoning: |-
  Alright, let me tackle this TA request step by step. The student's answer on semantic externalism needs detailed evaluation against the three-part question.

  First, analyzing part (1): The student correctly identifies Twin Earth's purpose - showing reference isn't determined by inner states. They also rightly note it doesn't disprove narrow content existence. But their phrasing "meanings are not in the head" could be more precise; Putnam specifically argues meanings aren't solely in the head, not that internal states play no role. The "doesn't show" section is strong though - they properly distinguish reference determination from narrow content possibility and self-knowledge.

  For the variant case in part (2): The student's disjunctive solution is problematic. Putnam's framework suggests that after contact, "water" would still refer to different substances on each planet because of local causal chains. Their linguistic community convergence claim contradicts externalism's core principle that reference is historically grounded. The shared stereotype might affect speaker competence but not reference itself.

  Regarding part (3) on narrow content: The student makes a categorical error claiming "no content at all" supervenes internally. Putnam explicitly allows for narrow content (e.g., in "The Meaning of 'Meaning'") while denying it determines reference. Their conflation with Quinean indeterminacy and Burge's arthritis case overextends the argument - these make different points about social externalism, not brain supervenience.

  Now structuring feedback: 
  For part (1), minor deduction (-0.5) for the "meanings" phrasing, but full credit for the "doesn't show" points. 
  Part (2) gets significant deduction (-3) for misapplying externalism to the variant case and the disjunctive reference error. 
  Part (3) loses points (-1.5) for denying narrow content possibility and conflation with other theories. 
  The total (-5) reflects substantial misunderstandings in key areas while acknowledging the student's general competence.

  Marginal comments will pinpoint each issue concisely, offering corrections like "Reference remains H2O/XYZ respectively due to causal history" for the variant case, and "Putnam allows narrow content exists but says it doesn't fix reference" for the brain supervenience point. This approach ensures defensible feedback that helps the student refine their externalism understanding.
answer: |-
  Here's a granular breakdown of the answer with marks, marginal comments, deductions, and justification. Total: **5/10**.

  **Part 1: Twin Earth's Purpose & Limits**  
  *Student Answer:*  
  "Putnam asks us to imagine Twin Earth... meanings are not in the head. What the case doesn't show is that there is no such thing as narrow content... It also doesn't show that we can't know what our own words mean."  
  *Feedback:*  
  - ✅ "Reference not fixed by inner states": Correct. Twin Earth shows reference depends on external environment. (+1)  
  - ❌ "Meanings are not in the head": Overstated. Putnam argues **linguistic meaning** (reference) isn't solely in the head, not that all mental content lacks internal components. (-0.5)  
  - ✅ "Doesn’t show no narrow content": Correct. The case targets reference determination, not existence of internal content (e.g., phenomenal states). (+1)  
  - ✅ "Doesn’t show we can’t know meanings": Correct. Self-knowledge isn’t challenged; Oscar/Twin-Oscar both know what *they* mean by "water". (+1)  

  **Part 2: Variant Case (Post-Contact)**  
  *Student Answer:*  
  "After 1900 water means the same thing... reference would have to be the disjunction H2O or XYZ."  
  *Feedback:*  
  - ❌ "Words converge / same meaning": **Incorrect**. Putnamian externalism holds that reference is fixed by *causal-historical chains*, not current knowledge or stereotypes. Earth "water" still refers to H₂O, Twin Earth "water" to XYZ. (-1.5)  
  - ❌ "Reference = disjunction H₂O or XYZ": **Incorrect**. Natural kind terms refer rigidly to underlying structures. Post-contact, Earth speakers still denote H₂O (not XYZ), and vice versa. (-1.5)  
  - ⚠️ "Stereotype shared": Partly right but misleading. Stereotypes guide *use*, but reference is determined by the actual substance in the environment. No deduction, but clarify.  

  **Part 3: Twin Earth vs. Narrow Content**  
  *Student Answer:*  
  "The Twin Earth argument actually shows that no content at all supervenes on the brain... Putnam pushes further... causal theory... arthritis case..."  
  *Feedback:*  
  - ❌ "No content at all supervenes": **False**. Putnam *explicitly allows* narrow content (e.g., "syntactic state") that supervenes on the brain but doesn’t determine reference. Twin Earth shows **wide content** (reference) isn’t narrow. (-1.5)  
  - ❌ Conflation with Quine/indeterminacy: Putnam’s "model-theoretic argument" is separate from Twin Earth. Twin Earth doesn’t show reference is "indeterminate." (-1)  
  - ❌ Misuse of "arthritis case": Burge’s case shows *social* externalism (meaning depends on community usage), not brain supervenience. Twin Earth is *environmental* externalism. Distinct points. (-1)  

  ---

  **Scoring Breakdown & Justification**  
  - **Part 1: 3.5/4**  
    (Deducted 0.5 for "meanings not in the head" overstatement; otherwise perfect.)  
  - **Part 2: 0/3**  
    (Fundamental errors: −1.5 for convergence claim, −1.5 for disjunctive reference. Core externalism misunderstood.)  
  - **Part 3: 1.5/3**  
    (Deducted −1.5 for denying narrow content, −1 for Quine conflation, −1 for arthritis misapplication. Max −2.5 for part, but capped at rubric weight.)  
  - **Total: 5/10**  

  **Key Marginal Comments (Line-by-Line):**  
  1. *"Meanings not in the head"* → **Margin:** "Clarify: Putnam argues *reference* isn’t determined internally. He allows internal states contribute to meaning."  
  2. *"Words converge... same meaning"* → **Margin:** "No: Reference remains H₂O on Earth, XYZ on Twin Earth. Causal history fixes reference, not shared knowledge."  
  3. *"Reference = disjunction"* → **Margin:** "Incorrect. ‘Water’ is a rigid designator. On Earth, it picks out H₂O exclusively; on Twin Earth, XYZ exclusively."  
  4. *"No content supervenes on the brain"* → **Margin:** "False. Putnam distinguishes narrow content (brain-bound) from wide content (reference). Twin Earth targets the latter."  
  5. *"Indeterminacy/arthritis case"* → **Margin:** "Twin Earth ≠ Quine’s indeterminacy. Arthritis case (Burge) shows social externalism, not brain supervenience. Don’t conflate."  

  **Defense Rationale for Office Hours:**  
  - **Part 2 errors** are critical: The student misunderstands externalism’s core tenet (reference is environmentally fixed, not updated by knowledge). This is a major conceptual flaw.  
  - **Part 3 missteps** conflate distinct arguments (Putnam vs. Quine/Burge) and ignore Putnam’s explicit allowance of narrow content.  
  - **Fairness:** Strong performance in Part 1 shows grasp of basics, but Part 2/3 errors undermine key learning objectives. 5/10 reflects partial credit where due.  

  **Suggested Correction for Student:**  
  *In the variant case, "water" still refers to H₂O on Earth and XYZ on Twin Earth post-contact because reference is determined by the initial "baptism" of the substance, not later knowledge. Narrow content (e.g., "watery stuff") supervenes on the brain, but Twin Earth shows it can’t fix reference.*
