  ### Workshop Plan: Sen's Liberal Paradox as a Diagnostic Tool for Housing Cooperatives  
  **Total Time:** 2 hours  
  **Goal:** Equip the board to spot incoherent decision-making using Sen’s paradox, avoiding theoretical jargon. Focus on a concrete housing dispute, head off misconceptions, and end with application.  

  ---

  #### **Session Structure**  
  **1. Introduction: The Problem of Seemingly Fair Rules (10 mins)**  
     - **Hook:** Start with a relatable pain point: "Have you ever designed a decision rule that seemed fair—respecting individual freedom and collective agreement—only to hit a deadlock? Today, we’ll unpack why that happens."  
     - **Objective:** "We’ll learn a tool to diagnose when your rules might be logically incoherent. No philosophy degree needed!"  

  **2. Core Principles in Plain Language (20 mins)**  
     - **Minimal Liberalism (Individual Sovereignty):**  
       - "In a cooperative, some decisions are private. Example: What you eat in your unit is your business. Minimal liberalism means at least two people have ‘sovereignty’ over one personal choice each. It’s not a veto—it’s limited control in your domain."  
       - *Head off misconception:* Clarify that this is **not a blanket veto** ("Alex can’t veto the roof repair policy"), but control over specific personal issues.  
     - **Pareto Principle (Unanimous Efficiency):**  
       - "If everyone agrees Option A is better than Option B, your rules should reflect that. Seems obvious, right? But it’s not always compatible with individual sovereignty."  
       - *Head off misconception:* Note that Pareto **isn’t sacred**—e.g., if unanimity forces someone into harmful choices.  

  **3. The Concrete Case: Pet Rat Policy Dispute (30 mins)**  
     - **Scenario:** Greenview Cooperative must decide:  
       - *Collective policy:* Ban exotic pets (e.g., rats) in the building?  
       - *Personal matter:* Can Alex keep their pet rat *if* the ban is rejected?  
     - **Characters & Preferences (Cycle-Inducing):**  
       - **Alex:** Wants to keep the rat.  
         - *Prefers:* **No ban + rat** (B) > **No ban + no rat** (C) > **Ban + no rat** (A)  
         *(Why? B lets them keep the rat; C avoids a ban but they lose the rat; A is worst—no rat AND a ban.)*  
       - **Bailey:** Hates rats but values harmony.  
         - *Prefers:* **No ban + rat** (B) > **Ban + no rat** (A) > **No ban + no rat** (C)  
         *(Why? B avoids conflict with Alex; A enforces safety; C is worst—no rat to justify the risk.)*  
       - **Casey:** Fears disease, pro-ban.  
         - *Prefers:* **Ban + no rat** (A) > **No ban + no rat** (C) > **No ban + rat** (B)  
         *(Why? A is safest; C is unsafe but no rat; B is unacceptable—rat present.)*  
     - **Decision Procedure:**  
       - *Step 1:* Vote on collective policy (ban vs. no ban).  
       - *Step 2:* If no ban, Alex decides whether to keep the rat.  
       - *Minimal liberalism:* Alex is sovereign over rat-keeping (if no ban); Bailey is sovereign over a personal choice (e.g., painting their door red—simplified to policy impact later).  

  **4. Generating the Cycle (25 mins)**  
     - **Apply Rules:**  
       - Liberalism: Alex’s sovereignty → Between B and C, **B > C** (Alex keeps rat if allowed).  
       - Liberalism: Bailey’s sovereignty → Between A and C, **A > C** (Bailey’s preferences on policy/personal sphere).  
       - Pareto: Unanimous on **B > C** (Alex, Bailey, Casey all prefer B to C? No: Casey prefers C > B! *Pause—reveal trap*).  
     - **Cycle Emerges:**  
       - Liberalism forces: **A > C** (Bailey’s choice) and **B > C** (Alex’s choice).  
       - Pareto check: **A vs. B** → *Not unanimous* (Alex: B > A; Bailey: B > A; Casey: A > B). Deadlock!  
       - **Result:** No stable outcome. Rules demand A > C and B > C, but voting between A and B loops:  
         - Majority (Alex+Bailey) prefers B > A.  
         - But if B wins, Casey demands A > C (sovereignty), reigniting debate.  

  **5. Debunking Misconceptions (20 mins)**  
     - **"Paradox only with selfish/bizarre preferences?":**  
       - *When:* After presenting preferences.  
       - *Head off:* "Notice—Alex isn’t selfish (accepts no rat to avoid ban); Bailey compromises; Casey prioritizes health. The cycle arises from *conflicting values*, not pathology."  
     - **"Minimal liberalism = veto?":**  
       - *When:* When introducing sovereignty.  
       - *Head off:* "Sovereignty isn’t veto power. Alex controls only rat-keeping—not the policy. Bailey controls one personal choice, not all votes."  
     - **"Pareto is always right?":**  
       - *When:* During Pareto explanation.  
       - *Head off:* "What if unanimity forces Alex to sell their rat? Pareto ignores freedom. Sometimes, you *should* override it."  

  **6. Application Exercise (10 mins)**  
     - **Question to Board:**  
       *"Imagine your cooperative debates a 'quiet hours' policy. Options: X (10pm–7am), Y (11pm–8am), Z (no policy). Taylor is sovereign over their music volume at night; Sam over their morning alarm time. If preferences create a cycle (e.g., Taylor: Z > X > Y; Sam: Y > Z > X; others: X > Y > Z), how would you diagnose this using Sen’s paradox?"*  
     - **Ideal Answer:**  
       - "Sovereignty gives Taylor Z > X, Sam Y > Z. Pareto might demand X > Y (if unanimous), but sovereignty conflicts. The rules are incoherent—we need to adjust spheres or accept deadlock."  

  **7. Wrap-Up & Takeaways (5 mins)**  
     - **Key Insight:** "Sen’s paradox isn’t just a trick—it’s a sign your decision rules may clash internally. If you see:  
       1. Personal sovereignty + group unanimity,  
       2. Conflicting preferences on linked issues,  
       → Watch for cycles or unstable outcomes."  
     - **Actionable Use:** "Revisit policies where ‘private’ and ‘collective’ overlap. Test for coherence by mapping preferences early!"  

  ---

  #### **What to Explicitly Leave Out & Why**  
  - **Social choice formalism (e.g., preference orderings, axioms):**  
    *Why:* Overwhelms non-philosophers. Focus on intuition, not notation.  
  - **Weak vs. strong Pareto:**  
    *Why:* Only strong Pareto (unanimity) matters for the paradox in practice. Weak Pareto adds noise.  
  - **Sen’s theorem conditions (e.g., unrestricted domain):**  
    *Why:* Technicalities distract. The pet rat case illustrates the core conflict sufficiently.  
  - **Arrow’s Theorem or other impossibilities:**  
    *Why:* Sen’s paradox is the sharpest tool for cooperatives juggling individual/collective decisions. Keep it focused.  

  **Materials Needed:**  
  - Whiteboard + markers.  
  - Handout: Preference table for the pet rat case (visualize the cycle).  
  - Timer for exercises.  

  This plan turns abstraction into a practical lens, using a housing dispute to show why "fair rules" sometimes backfire—and how to fix them.
