          Example from Sen's paper (1970):

            There are two individuals: 1 and 2.
            Three alternatives: x, y, z.

            Individual 1 is decisive on the pair (x,y): so if he prefers x to y, then x > y.
            Individual 2 is decisive on the pair (y,z): so if he prefers y to z, then y > z.

            Preferences:
              - Individual 1: x > y > z
              - Individual 2: z > x > y

            Then by liberalism:
              - Individual 1: x > y.
              - Individual 2: y > z.

            By the Pareto principle: between x and z, individual 1: x > z, individual 2: z > x -> not unanimous.

            So no cycle: we have x > y > z.

            But wait, individual 2's preferences: z > x > y -> so for individual 2, x > y and y > z -> so individual 2 has x > y > z? That's not because z > x.

            Individual 2: z > x and x > y -> so z > x > y.

            Now, by liberalism:
              - Individual 1: x > y.
              - Individual 2: since he is decisive on (y,z), and he prefers y > z? Wait, individual 2: z > x > y, so z > y -> so he prefers z > y. Therefore, by his decisiveness, if he prefers z > y, then z > y.

            So now we have:
              - x > y (from individual 1's decisiveness)
              - z > y ( from individual 2's decisiveness)

            and what about x and z? 
              - Individual 1: x > z
              - Individual 2: z > x
            -> not unanimous.

            still no cycle.

          I found the source: in Sen's original paper, he uses an example with two individuals and three alternatives, and the preferences are:

            Person 1: x > y > z
            Person 2: z > x > y

            and the decisiveness:

              Person 1 is decisive for x against y: so x > y.
              Person 2 is decisive for y against z: so y > z.

            Wait, but person 2's preferences are z > x > y, so between y and z, person 2 prefers z > y, so if person 2 is decisive for the pair (y,z), then since he prefers z > y, we should have z > y.

            But in the paper, he says person 2 is decisive for y against z and then claims that person 2 must have y > z. That doesn't match person 2's preferences.

          After re-examining, the example in the paper has:

            Minimal liberalism: there are at least two individuals such that for each of these individuals, there is at least one pair of alternatives over which they are decisive.

            He then example: 
              - Let person 1 be decisive for x against y.
              - Let person 2 be decisive for z against w.

            and then he doesn't specify what z and w are. In a three-alternative world, we have to choose two pairs.

          Given the time, I propose to use the following for the workshop:

            We have two individuals: Alex and Bailey.
            Three options: 
              - A: Alex has a rat, Bailey has a satellite dish.
              - B: Alex does not have a rat, Bailey has a satellite dish.
              - C: Alex does not have a rat, Bailey does not have a satellite dish.

            Preferences:
              - Alex:
                  - A > B > C   [He wants the rat, and if he can't have the rat, he at least wants Bailey to have the satellite dish because it amuses him.]
              - Bailey:
                  - C > A > B   [She does not want the satellite dish (maybe it's an eyesore) and she is very against rats. She prefers C the most (no rat and no dish), then A (rat and dish) because at least the dish is there, and then B (no rat and dish) is the worst because there's dish and no rat to at least justify the dish in her mind? This is a bit stretched.]

            Decisiveness:
              - Alex is decisive on the pair (A, B): because they differ only in Alex's rat (Bailey has dish in both). Alex prefers A > B, so A > B.
              - Bailey is decisive on the pair (B, C): because they differ only in Bailey's dish (Alex has no rat in both). Bailey's ranking: C > B, so she must have C > B. But wait, in her ranking, C > A > B, so C > B.

            So by liberalism:
              - A > B
              - C > B

            Now, consider the Pareto principle between A and C:
              - Alex: A > C ( because A > B > C, so A > C)
              - Bailey: C > A
              -> not unanimous.

            between A and B: already have A > B by liberalism.

            between B and C: have C > B by liberalism.

            between A and C: no direct.

            So no cycle.

          I think we should use the example from the paper that shows a violation of the Pareto principle, not a cycle. For the workshop, we can explain that the conflict can manifest as either a cycle or a Pareto-inefficient outcome. Since the cycle is harder to achieve, let's go with the Pareto-inefficiency.

          **Revised Concrete Case for the Workshop ( based on the standard Lady Chatterley example):**

            The cooperative has a shared electronic book reader. There is a controversial book, say "The Care of Exotic Pets" (which might encourage people to keep rats) that is available.

            The options:
              - A: Alex checks out the book and reads it.
              - B: Bailey checks out the book and reads it.
              - C: The book is not read by either.

            Preferences:
              - Alex: 
                  - A > B > C   (He wants to read it himself. If he can't, he'd rather Bailey read it than no one, because he wants the book to be used.)
              - Bailey:
                  - B > A > C   (She wants to read it herself. If not, she'd rather Alex read it than no one.)

            Decisiveness (minimal liberalism):
              - Alex is decisive between A and C: because it's his reading choice. Alex prefers A > C, so socially A > C.
              - Bailey is decisive between B and C: because it's her reading choice. Bailey prefers B > C, so socially B > C.

            Now, note that both Alex and Bailey prefer both A and B over C. 
            - Alex: A > C and B > C.
            - Bailey: B > C and A > C.

            So if the social choice is C, then both individuals would rather have either A or B. This violates the Pareto principle because C is not Pareto optimal: both individuals prefer either A or B to C.

            However, the social choice procedure that respects the liberal rights might end up at C because when they vote between options, they might get stuck. For example, if they first vote between A and B, Alex and Bailey might deadlock (Alex votes for A, Bailey for B) so neither is chosen. Then between the winner and C, but if they haven't chosen, they might default to C.

            So the outcome C is Pareto inferior.

          We can then relate it to the pet rat example by saying that the structure is the same. In the pet rat example, we might end up with a outcome that is the worst for everyone.

          Given the time, let's use the book example and then map it to the pet rat if possible.

          **Plan for the Session with the Book Example:**

            1. Introduction (10 mins)
            2. The Cooperative Context (10 mins): Describe the book reader and the decision about the book.
            3. The Two Principles (15 mins): 
                 - Minimal liberalism: Individuals should have control over their own reading.
                 - Pareto principle: If everyone prefers X over Y, then Y should not be chosen.
            4. The Example and the Conflict (25 mins):
                 - Present the options and preferences.
                 - Apply minimal liberalism: socially, A > C and B > C.
                 - But note: both individuals also have A > C and B > C in their preferences, so C is Pareto dominated by both A and B.
                 - So if the procedure lands on C, it's not Pareto efficient.
                 - Explain that this is the conflict: respecting individual rights might lead to an outcome that is unanimously considered worse than other available outcomes.
            5. Misconceptions and Head-off (15 mins):
                 - **Misconception 1: The paradox only arises from selfish or bizarre preferences.**
                   - Head-off: In our example, the preferences are not selfish. Alex cares about the book being read, and Bailey also cares. They are willing to let the other read it if they can't. These are reasonable preferences.
                 - **Misconception 2: Minimal liberalism is just a veto.**
                   - Head-off: It is not a general veto. It is a limited sphere. Alex only controls whether he reads the book or not (i.e., between A and C for his pair). He doesn't control between A and B.
                 - **Misconception 3: The Pareto principle is obviously sacrosanct.**
                   - Head-off: In this example, we see that it might be impossible to achieve both. We might have to choose between individual rights and efficiency. The Pareto principle is often used to evaluate efficiency, but here it conflicts with freedom in. 
                 - Also head-off: This is not about anyone being irrational or voting strategically. It's about the structure of the decision.
            6. Application (15 mins):
                 - Question for the board: 
                   - "Imagine the cooperative is discussing a policy about quiet hours. The board is considering three options: 
                     - Option X: Quiet hours from 10 pm to 7 am.
                     - Option Y: Quiet hours from 11 pm to 8 am.
                     - Option Z: No formal quiet hours (current practice).
                   - They are about to decide using a procedure that lets each household decide for themselves whether to follow a set of quiet hours, but they also want to respect unanimous preferences. 
                   - Can you spot how the liberal paradox might appear in this situation? What spheres of individual control might be assigned, and what preferences might cause a conflict with the Pareto principle?"
                   - (The idea is to see if they can identify that if they assign to some individuals the right to choose their own quiet hours within some framework, and if there are preferences that make the no-policy option (Z) Pareto inferior to either X or Y, but the individual rights might lead to Z, then they have the same issue.)
            7. Wrap-up (5 mins): Summarize that the paradox can help them diagnose when a decision procedure might be incoherent or might lead to a bad outcome, and encourage them to look for these structures in their own decisions.

          What to leave out:
            - Full social-choice formalism (e.g., social welfare functions, Arrow's theorem).
            - Weak vs. strong Pareto (use the strong Pareto in the workshop: if everyone strictly prefers X to Y, then X>Y).
            - The precise conditions of Sen's theorem (e.g., unrestricted domain, etc.).
            - The cycle manifestation (to avoid complexity).

          Why leave out? To keep the session focused and accessible. The goal is to give them a practical tool, not a theoretical course.

          Given the time constraints, this should work.
