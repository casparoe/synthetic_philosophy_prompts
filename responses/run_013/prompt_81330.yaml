  We are going to translate the iterative deletion of dominated strategies (both strict and weak) into the vocabulary of fixed-point computation and rewriting systems. We will then analyze the properties of the deletion operator and the resulting fixed points, and finally discuss the residue of game-theoretic concepts that do not translate cleanly.

  ### Part 1: Translation to Fixed-Point Vocabulary

  #### Basic Setup
  - The game is given by a set of players and for each player a set of pure strategies. We represent the set of pure strategies for player i as a relation `strat(i, s)` meaning "s is a strategy for player i". Initially, this relation contains all strategies.
  - We are going to iteratively delete dominated strategies. We focus on two kinds of dominance: strict and weak.

  #### The Deletion Rule
  The deletion rule for a strategy `s` of player `i` is triggered when there exists another strategy (or mixture of strategies) for player `i` that dominates `s`. We must distinguish between strict and weak dominance.

  1. **Strict dominance**: A pure strategy `s` of player `i` is strictly dominated if there exists a (possibly mixed) strategy `σ` for player `i` such that for every profile of opponents' strategies (in the current set), the payoff of `σ` is strictly greater than that of `s`.

  2. **Weak dominance**: Similarly, `s` is weakly dominated if there exists a `σ` such that for every opponents' profile, the payoff of `σ` is at least as good as that of `s`, and for at least one opponents' profile, it is strictly better.

  We can model the deletion process as a fixed-point computation over the lattice of strategy sets (for each player). The state of the computation is a tuple of strategy sets (one per player). We start with the full sets and repeatedly apply a deletion operator.

  #### The Deletion Operator
  Let `S` denote the current state, which is a tuple `(S_1, S_2, ..., S_n)` where `S_i` is the set of strategies for player `i` that have not been deleted yet.

  The deletion operator, `T`, removes from each `S_i` the strategies that are dominated (according to either strict or weak criteria) with respect to the current `S_{-i}` (the current strategy sets of the opponents).

  Formally:
  - `T(S)_i = { s in S_i | s is not dominated in S_i with respect to S_{-i} }`

  We are interested in the fixed point of `T`, i.e., a state `S` such that `T(S) = S`.

  #### Properties of the Deletion Operator

  1. **Monotonicity**:
     - The operator `T` is **not** monotone in the usual lattice-theoretic sense (where the lattice is ordered by set inclusion). Why?
       - Consider two states: `S` and `S'` with `S ⊆ S'` (componentwise). If a strategy `s` is dominated in `S'`, it might not be dominated in `S` because `S` has fewer opponent strategies. Therefore, `T(S')` might remove more strategies than `T(S)`, so `T(S) ⊆ T(S')`? Actually, no: because when we remove strategies from a player, we are reducing the opponents' strategy sets for the other players, which might make a strategy that was dominated now not dominated. This is a form of non-monotonicity.

     However, note that in the case of strict dominance, if we consider the lattice of strategy sets ordered by *reverse* inclusion (so that smaller sets are "larger" in the lattice), then the operator is monotone. But that is not the standard lattice. Alternatively, we can note that the deletion process is anti-monotonic: if we have more strategies (bigger sets) then we might remove more. But the key point is that the operator does not satisfy the condition for the standard Knaster-Tarski fixed-point theorem (which requires monotonicity with respect to a partial order that forms a complete lattice).

  2. **Stratification**:
     - We can simulate the iterative deletion process by a sequence of applications of `T` starting from the full set. We stop when we reach a fixed point.
     - For strict dominance, it is known that the fixed point is unique and does not depend on the order of deletion. This suggests a form of confluence.
     - For weak dominance, the fixed point is not unique: the order of deletion matters.

  #### Confluence Analysis

  We can model the deletion process as a rewrite system: we delete one dominated strategy at a time. The state is the set of surviving strategies. The rewrite rule is: if a strategy `s` for player `i` is dominated (with respect to the current state), then we can remove it.

  - **Strict dominance**: 
    - The rewrite system for strict dominance is confluent (and terminating). Why?
      - Termination: because the set of strategies is finite, and we only remove strategies.
      - Local Confluence: We must check that if we have two different dominated strategies that we might delete, then deleting one does not make the other non-dominated. But note: if strategy `s` is strictly dominated by `t` and strategy `u` is strictly dominated by `v`, then even if we remove `s`, `u` remains strictly dominated because the condition for strict dominance requires that the dominating strategy (`v`) does better against every opponent profile (and removing `s` only removes some opponent profiles for player `i`? Actually, note: when we remove a strategy of player `i`, it does not directly affect the domination condition for another player `j`. However, for the same player `i`, if we remove a strategy, it might break the domination of another strategy? Actually, no: because the domination condition for a strategy of player `i` is defined with respect to the opponents' strategies (which are from other players). But note: if we remove a strategy of player `j`, then the set of opponent profiles for player `i` becomes smaller. Removing an opponent strategy might make a strategy of player `i` that was dominated now not dominated? 

    However, for strict dominance, it is known that the deletion order does not matter. This is because if a strategy is strictly dominated in a set, it remains strictly dominated in any subset. Therefore, if a strategy is strictly dominated at some stage, it will remain dominated until it is deleted. Hence, the system is locally confluent: if two strategies are dominated, we can delete them in any order and we will end up in the same state.

  - **Weak dominance**:
    - The rewrite system is not confluent. Why?
      - Consider the possibility that by deleting one weakly dominated strategy, we might cause another weakly dominated strategy to become non-dominated. For example: 
        - Suppose for player `i`, strategy `s` is weakly dominated by `t` and also by `u`. But if we delete `s`, then `t` might become weakly dominated by `u` (or vice versa) and then we can delete `t`. But if we had deleted `t` first, then `s` might not be dominated anymore because the opponent profile that made `t` better than `s` might be gone (if `t` was used as an opponent strategy for another player? Actually, note: the domination condition for player `i` depends on the opponents' strategies, not on the strategies of player `i` that are present. But wait: if we delete a strategy of player `i`, it does not affect the opponents' strategy sets (which are from other players). However, if we delete a strategy of player `j`, then the set of opponent profiles for player `i` shrinks. It is possible that a strategy `s` of player `i` is weakly dominated in the full set but becomes non-dominated when we remove a strategy of player `j` because the opponent profile that witnessed the strict improvement of the dominating strategy over `s` is gone.

    Therefore, the deletion of a strategy in one player's set can affect the domination condition for another player. Moreover, even within the same player, the deletion of one strategy might make another strategy non-dominated. Therefore, local confluence fails.

  #### The Role of Mixed Strategies

  In the above, we allowed the dominator to be a mixed strategy. This complicates the deletion rule because checking for dominance becomes a linear programming (LP) problem: for a given strategy `s` of player `i` and given the current opponents' strategy sets, we must check if there exists a mixed strategy (over the current set of player `i`'s strategies) that strictly (or weakly) dominates `s`.

  - **Effect on Confluence**:
    - For strict dominance: the LP condition is such that if a strategy is strictly dominated in a set, it remains strictly dominated in any subset. Why? Because the set of mixed strategies available in a subset is a subset of the mixed strategies in the original set. However, note: the condition for strict dominance requires that the dominator does better against every opponent profile. If we remove an opponent profile (by removing a strategy of an opponent), then the condition becomes easier to satisfy? Actually, no: because we require the dominator to do better against all opponent profiles that are still present. Therefore, if a strategy is strictly dominated in a set, it remains strictly dominated in any subset of that set. Therefore, the confluence property for strict dominance is preserved.

    - For weak dominance: the same does not hold. Removing an opponent profile might break the weak domination condition because the dominator must be at least as good against all remaining opponent profiles and strictly better in at least one. If we remove an opponent profile that was the only one where the dominator was strictly better, then the condition fails. Therefore, the deletion of a strategy by one player might break the weak domination of a strategy in another player.

  #### Should the Relation Carry Mixed Strategies?

  In the fixed-point computation, we are only tracking the pure strategies. The mixed strategies are not stored in the state; they are used only in the side condition (the LP query). This is acceptable because the domination condition is defined by the existence of a mixed strategy that dominates. We do not need to represent the mixed strategies as part of the state because:

  - The set of mixed strategies available is determined by the set of pure strategies that survive. Therefore, we can compute the domination condition on the fly by solving the LP with the current pure strategies.

  Note: the dominator is a mixed strategy over the current pure strategies of the player. Therefore, if we delete a pure strategy, it cannot be used in the mixed strategy dominator. But that is already taken care of because the LP only considers the current pure strategies.

  However, note that a mixture of already-deleted pure strategies is not available. But we are only considering mixtures over the surviving pure strategies. Therefore, we are safe.

  ### Part 2: Residue Report

  We now discuss how well the game-theoretic concepts translate.

  #### Concepts that Translate Cleanly
  - **Iterative deletion as fixed-point computation**: The process of iteratively applying the deletion operator until a fixed point is reached is a direct translation.
  - **Strict vs. weak dominance and confluence**: The distinction between strict and weak dominance is reflected in the rewrite system properties: strict dominance deletion is confluent (so the fixed point is unique) and weak dominance is not.
  - **Termination**: Because the strategy sets are finite, the process terminates.

  #### Concepts that Survive with Distortion
  - **The surviving set as a solution concept**: 
    - In game theory, the set of strategies surviving iterative deletion of strictly dominated strategies is a solution concept. In our fixed-point world, it is just the unique fixed point. For weak dominance, there might be multiple fixed points (maximal deletion sequences) and the solution concept is then not uniquely defined.

  - **Order dependence (for weak dominance)**: In the fixed-point world, we can model the set of possible fixed points as the set of states that are fixed points of the deletion operator and that are reachable by some sequence of deletions. This captures the order dependence.

  - **Epistemic reading**: 
    - The textbook epistemic reading (common knowledge of rationality) is not directly captured by the fixed-point machinery. However, the fixed point can be seen as the result of an iterative process of reasoning: at step 0, no strategies are deleted; at step 1, strategies that are dominated with respect to the initial set are deleted; at step 2, strategies that are dominated with respect to the set after step 1 are deleted, etc. This corresponds to a hierarchy of beliefs (each step corresponding to a level of mutual knowledge of rationality). But the fixed-point framework does not explicitly model knowledge.

  #### Concepts with No Direct Counterpart
  - **Relation to Nash equilibrium**: 
    - In game theory, every Nash equilibrium must survive iterative deletion of strictly dominated strategies. In our fixed-point world, we can define a relation that holds between the fixed point (the surviving set) and the set of Nash equilibria: every Nash equilibrium (if we represent it as a profile of pure strategies) must be contained in the surviving set. But note: the surviving set is a set of pure strategies per player, and a Nash equilibrium might be mixed. However, we know that if a pure strategy is in the support of a Nash equilibrium, it must survive. But our fixed-point computation does not compute the Nash equilibria.

  - **Rationalizability**: 
    - The surviving set of the iterative deletion of strictly dominated strategies is exactly the set of rationalizable strategies. This is a theorem in game theory. So in our fixed-point world, the fixed point is the set of rationalizable strategies. This is a clean translation.

  - **Normal-form versus extensive-form gap**:
    - In game theory, the same game can be represented in normal form or extensive form, and the outcome of iterative deletion might differ (especially when considering weak dominance). Our fixed-point framework is defined on the normal form. The extensive form is not represented. Therefore, this gap does not translate.

  #### The Contrast with Static Analysis

  In static analysis, we judge an analysis (which computes an abstract fixed point) as sound or complete with respect to a concrete semantics.

  - **What is the concrete semantics for the deletion procedure?**
    - In game theory, the deletion procedure is often presented as a method to compute a solution concept (like rationalizability) which is defined independently? Actually, the surviving set *is* the definition of rationalizability. So the procedure is the definition. Therefore, there is no independent concrete semantics.

    However, we can ask: what is the intended meaning of the surviving set? It is the set of strategies that might be played by rational players under common knowledge of rationality. This is a behavioral prediction. But note: we do not have an independent mathematical model of the behavior of rational players that we can use as a concrete semantics. The deletion procedure is the model.

  - **Is the gap a defect of the vocabulary?**
    - Our fixed-point vocabulary is designed for analyses that are sound (or complete) with respect to a given concrete semantics. Here, the deletion procedure is not an approximation of some other semantics; it is the primary definition. Therefore, we don't have a concrete semantics to compare to.

    The textbook presentation of the deletion procedure is indeed tidier than its foundations in the following sense: for weak dominance, the non-uniqueness is a problem. But the fixed-point framework does not provide a canonical solution for weak dominance. Instead, we must consider all maximal deletion sequences. This is analogous to having multiple fixed points (minimal fixed points in some ordering) but without a clear criterion to choose.

  ### Conclusion

  We have translated the iterative deletion of dominated strategies into a fixed-point computation and rewrite system. The deletion operator for strict dominance is well-behaved (confluent) and yields a unique fixed point. For weak dominance, the rewrite system is not confluent, and we get a family of fixed points. The fixed-point framework does not provide a canonical solution for weak dominance; we must consider the set of maximal deletion sequences.

