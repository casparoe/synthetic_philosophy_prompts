answer: |-
  ### Translation of Iterated Dominance into Fixed-Point Vocabulary

  #### Surviving Strategies as a Fixed Point
  Define a state as a tuple of relations:  
  **`strat(Player, Strategy)`**  
  This relation represents the current set of surviving pure strategies for each player. The initial extension is the full strategy set.  

  The deletion operator **`T`** is defined by:  
  **`T(S) = S - { (P,S) | ∃ dominance witness against (P,S) in S }`**  

  #### Dominance Rules as Side Conditions
  - **Strict dominance**:  
    `(P,S)` is deletable iff:  
    `∃ mixed strategy σ over S_P (current strategies of P) such that:`  
    `∀ opponents' profiles o in S_{-P}, u_P(σ, o) > u_P(S, o)`  
    This is a **linear feasibility query** over the current extensions.

  - **Weak dominance**:  
    Same as strict but with `u_P(σ, o) ≥ u_P(S, o)` for all `o`, and strict inequality for at least one `o`.

  #### Structural Properties of the Deletion Operator
  1. **Monotonicity**:  
     - **Strict dominance**: Operator is **monotone** (for reverse set inclusion lattice). If `S ⊆ S'`, then `T(S) ⊆ T(S')`.  
       *Reason*: If a strategy is strictly dominated in `S'`, it remains dominated in any subset `S` (domination conditions persist under strategy removal).  
     - **Weak dominance**: **Not monotone**. Removing a strategy may invalidate weak domination (e.g., by removing the sole opponent profile where domination was strict).  

  2. **Rewrite System View**:  
     - Deletion steps are rewrite rules: `strat(P,S) → ∅` if side condition holds.  
     - **Termination**: Finite strategy sets guarantee termination.  
     - **Confluence**:  
       - **Strict dominance**: **Confluent** (Newman’s lemma applies). Critical pairs: Deleting two strategies `s₁`, `s₂` for players `P`, `Q`. Since deletion depends only on opponents' strategies, order doesn’t matter.  
         - *Local confluence test*: If `s₁` (for `P`) and `s₂` (for `Q`) are deletable, deleting either leaves the other still deletable (removing `s₂` doesn’t affect `P`'s domination condition).  
       - **Weak dominance**: **Not locally confluent**. Counterexample:  
         - Player `A` has strategies `a1`, `a2`; Player `B` has `b1`, `b2`.  
         - `a1` weakly dominates `a2` *only* against `b1`; `b1` weakly dominates `b2` *only* against `a2`.  
         - Delete `a2` first: `b1` vs. `b2` is now evaluated against `a1` only, so `b1` may no longer dominate `b2`.  
         - Delete `b2` first: Symmetric issue.  
         - Result: Final set depends on deletion order.  

  3. **Stratification for Non-Monotone Operators**:  
     - Weak dominance lacks monotonicity, so no stratification (no syntactic acyclic dependency) can guarantee uniqueness.  
     - **Honest interpretation**: The object of study is the **family of maximal deletion sequences** (i.e., all terminal states reachable via valid deletion sequences). No canonical fixed point.  

  #### Mixed Strategies and Linear Queries
  - **Mixed strategies as dominators**:  
    - Handled via **on-demand linear programming** against the current `strat` extension.  
    - **Not stored in the relation**: Mixed strategies are ephemeral witnesses; the state tracks only pure strategies.  
  - **Confluence impact**:  
    - Strict dominance: LP queries preserve confluence (domination is preserved under strategy removal).  
    - Weak dominance: LP queries amplify non-confluence (removal may break domination by eliminating critical opponent profiles).  
  - **Why not store mixed strategies?**  
    Storing mixtures would:  
    - Explode the state space (infinite extensions).  
    - Require dominance checks over mixtures of mixtures (intractable).  
    The standard procedure is correct without it: A mixed strategy dominator exists iff it can be formed from *current* pure strategies.  

  ---

  ### Residue Report: Lost in Translation

  #### Clean Translations
  1. **Strict vs. weak dominance**:  
     → Maps cleanly to **confluent vs. non-confluent rewrite systems**.  
     - Strict: Unique fixed point (independent of schedule).  
     - Weak: Schedule-dependent terminal states.  

  2. **Surviving set as solution concept**:  
     → **Unique fixed point** (strict) or **terminal states of rewrite sequences** (weak).  

  3. **Rationalizability**:  
     → **Fixed point under strict dominance** = rationalizable strategies.  

  4. **Order dependence in weak dominance**:  
     → **Non-confluence** of the rewrite system.  

  #### Distorted Survivors
  1. **Epistemic reading ("common knowledge of rationality")**:  
     - Fixed-point iteration resembles **stages of mutual knowledge**.  
     - **Distortion**: The fixed-point machinery has no inherent semantics of "knowledge" or "rationality". Epistemic justifications are external annotations.  

  2. **Nash equilibrium**:  
     - Theorem: *Nash equilibria survive iterated deletion of strictly dominated strategies*.  
     - **Distortion**: Fixed-point computation **does not find equilibria**; it only prunes strategies. Connection to equilibrium is a theorem *about* the fixed point, not a property *of* the computation.  

  3. **Normal-form vs. extensive-form gap**:  
     - Iterated dominance behaves differently in extensive-form games.  
     - **Distortion**: Our translation **assumes normal form** (single relation `strat`). Extensive form would require tree-structured state (not in this vocabulary).  

  #### No Counterpart
  1. **Equilibrium as a solution concept**:  
     - Nash equilibrium is a **global fixpoint** over *strategy profiles* (`∏_i S_i`).  
     - Dominance deletion is a **monotone operator** on *individual strategy sets* (`S_i`).  
     - **Gap**: Dominance fixes `S_i` independently; Nash requires simultaneous best responses.  

  2. **The "why" of deletion**:  
     - Game theory invokes **rationality** to justify deletion.  
     - Fixed-point view treats deletion as a **syntactic side condition** (LP query). Rationality is not represented.  

  #### The Static-Analysis Contrast
  - **Soundness/completeness relative to concrete semantics**:  
    - **No independent concrete semantics** exists for dominance deletion.  
    - The procedure **defines its own "semantics"**: The surviving set *is* the solution concept (e.g., rationalizability).  
  - **Why the gap?**  
    - Game-theoretic deletion is **self-defining**; static analysis is **relative** (e.g., "this analysis over-approximates concrete program behavior").  
    - Textbook presentations **oversell tidiness**: Weak dominance is presented as a "solution" but the framework reveals it as **schedule-dependent heuristics** without canonical status.  

  ### Key Takeaways
  - **Strict dominance** is a **monotone, confluent operator** → unique fixed point.  
  - **Weak dominance** is **non-monotone, non-confluent** → terminal states are schedule-dependent; no stratification helps.  
  - **Mixed strategies** are handled via **LP side queries**; they don’t require state extensions.  
  - **Epistemology and equilibrium** are **external theorems** about the fixed point, not internal to the computation.  
  - **The procedure is its own semantics**—no soundness/completeness claim is made or needed.
