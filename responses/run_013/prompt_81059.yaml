prompt: |-
  I am currently taking a course on rational choice and its applications, and I have been keeping a list of cases that I cannot fit under a single heading. The pattern is this: someone is made worse off by coming to know something that is true, freely available, and directly relevant to a decision they face. None of my cases turns on the news being unpleasant, and none turns on the information being difficult to obtain. In one, the customers of an insurer all learn their own risk categories; the pooling that had made coverage affordable comes apart, and everyone ends up worse off than they were in mutual ignorance, although no one has been misled. In a second, a person would rather not learn something about their partner, because they know that once they know it they will feel bound to leave, and leaving is worse for them by their own lights. In a third, part of what a person cares about is what they believe — about their own health, say — so that a more accurate belief can leave them worse off even when it leads them to do nothing differently.

  I have been told, as though it were a general result, that information cannot have negative value: that knowing more never leaves you worse off, at least before the fact and on average. My cases look like counterexamples, but I suspect the claim holds within limits I was never told about, and that each of my cases crosses a different one.

  What I want is not a label but a boundary. Is there a name for what I have been describing, and is it one phenomenon or a family of them? For each case, which condition of the general claim does it violate, and are the cases genuinely independent of one another? I would also like to know what my cases are not: how they differ from the familiar point that information is often costly to acquire, and from the familiar observation that people sometimes avoid news they expect to be bad. A name by itself would settle none of this for me; I need the edge of the concept.
reasoning: |-
  Okay, the user is studying rational choice theory and has encountered cases where acquiring true, freely available, relevant information makes someone worse off. They list three examples: an insurance market collapse due to self-knowledge of risk categories, avoiding knowledge to prevent relationship dissolution, and negative utility from accurate health beliefs. They've been told that information can't have negative value, but these seem like counterexamples. They want to understand the boundaries of this principle and how their cases violate it.

  First, I need to recall the standard rational choice assumption: more information should never harm decision-making. The user mentions that their cases don't involve unpleasant emotions or acquisition costs, which are common caveats. So the key is to identify the structural conditions that cause information to backfire.

  Looking at the insurance example, this seems like a classic adverse selection problem. When everyone knows their risk levels, the risk pool destabilizes. High-risk individuals stay, low-risk drop out, leading to higher premiums. This violates the assumption of fixed decision problems because the information changes the strategic environment. The act of acquiring information alters others' actions, creating a negative externality. That's different from the standard model where information only affects individual choices.

  Next, the relationship case involves self-binding. If knowing a fact would compel action against one's preferences, ignorance preserves a better outcome. This breaks the "no preference change" condition. The information makes the person prefer an action (leaving) that they wouldn't choose otherwise, even though they value the relationship more. It's about information altering revealed preferences, not just beliefs.

  The health belief case introduces utility from beliefs themselves. Accurate diagnosis reduces utility directly, not through changed actions. This contradicts the instrumental value assumption—here information has intrinsic disutility. It's not about better decisions; the belief itself is costly.

  The user wants to know if these are distinct phenomena. Each case violates a different assumption: strategic interdependence, preference consistency, and instrumentalism. They're independent mechanisms. 

  Common misunderstandings to clarify: this isn't about information costs (free in these cases) or emotional distress (unpleasantness isn't the core issue). The negative value arises from structural or preference effects. 

  The umbrella term "information paradox" or "value of information failure" might apply, but the key is specifying the broken conditions. The user needs conceptual boundaries, not just labels. 

  I should emphasize that in standard rational choice frameworks, these are edge cases violating core assumptions. Each case crosses a different boundary: game-theoretic stability, dynamic preference consistency, and belief-dependent utility. 

  The user's deeper need seems to be reconciling theory with real-world exceptions. They likely want to map the limits of rational choice models and understand when information can be harmful despite standard claims. Highlighting the three distinct violation pathways addresses this by showing systematic boundaries rather than ad hoc exceptions.
answer: |-
  Your inquiry cuts to the heart of foundational assumptions in rational choice theory and information economics. You've correctly identified genuine counterexamples to the naive claim that "free, relevant, true information cannot have negative expected value." This claim holds only under **very specific conditions**, and your cases violate different ones. Here's the boundary analysis:

  ### Core Violated Conditions & Conceptual Boundaries
  1.  **The Insurance Case: Violates Strategic Independence & Exogenous Decision Problems**
      *   **Boundary Violated:** The assumption that *your information acquisition doesn't alter the strategic environment or others' actions*. Information changes the *game*, not just your knowledge.
      *   **Mechanism:** Prior to information, a stable Nash equilibrium exists (the pooling contract). Revealing private types (risk levels) fundamentally alters the strategic landscape. High-risk individuals now signal their type implicitly by accepting higher premiums, causing low-risk individuals to exit. This unravels the mutually beneficial pool.
      *   **Result:** *Ex-post Pareto inferior outcome* compared to the ignorance state. Information has negative *social value* and negative *ex-post value* for all participants, despite being individually rational to *use* once known.
      *   **Key Concepts:** Adverse Selection, Market Failure, Strategic Interdependence, Endogenous Decision Problem. The decision problem itself (available contracts/prices) changes *because* of the information revelation.
      *   **Distinctiveness:** This is a game-theoretic phenomenon relying on multiple agents and information changing the structure of interaction.

  2.  **The Relationship Case: Violates Preference Consistency & Separability of Belief and Action Value**
      *   **Boundary Violated:** The assumption that *information only affects utility through enabling better actions within stable preferences*. Here, information *irrevocably changes your preferences over actions*.
      *   **Mechanism:** Your preference ordering over relationship states (Stay > Leave) is conditional on ignorance. Knowing the specific fact `X` introduces a *new preference* or *commitment* (e.g., a moral imperative) that makes "Leave" the dominant choice *if `X` is known*. Crucially, you prefer the state (Ignorant & Stay) over both (Know `X` & Stay) *and* (Know `X` & Leave). Information destroys your ability to maintain your preferred state (Ignorant & Stay).
      *   **Result:** Information has negative *ex-ante expected value*. You rationally avoid free information because knowing it forces you into a choice set dominated by your current preferred ignorance state. Your "self" post-knowledge has different effective preferences.
      *   **Key Concepts:** Dynamic Inconsistency / Self-Binding, State-Dependent Preferences, Non-Separability of Belief Utility. Utility depends on the *pair* (State of Knowledge, Action Taken).
      *   **Distinctiveness:** This hinges on information fundamentally altering the agent's own revealed preferences or constraints in a way detrimental to their prior self.

  3.  **The Belief Utility Case: Violates Instrumentalism & State Independence of Utility**
      *   **Boundary Violated:** The assumption that *utility is derived solely from outcomes/states of the world, not from beliefs themselves*. Beliefs are purely instrumental to achieving better states.
      *   **Mechanism:** The agent has *direct utility* (or disutility) from holding certain beliefs, irrespective of their accuracy's impact on actions or outcomes. A more accurate but negative belief (e.g., "I have a high genetic risk") directly lowers well-being, even if no feasible action changes. The belief itself is a bad state.
      *   **Result:** Information has negative *realized value* *ex-post*. The agent is directly worse off holding the true belief, even if actions are unchanged and the information was costless.
      *   **Key Concepts:** Belief-Dependent Utility, Intrinsic Value of Beliefs, Non-Instrumental Value of Information, Affective Forecasting Errors (sometimes, but not necessarily). Utility `U(S, B)` where `S` is state of the world and `B` is belief state.
      *   **Distinctiveness:** This explicitly rejects the core instrumentalist view of beliefs within standard rational choice. Information's value isn't solely about improving decisions/outcomes.

  ### Are They One Phenomenon or a Family?
  This is a **family of distinct phenomena** united only by the surface-level observation "free true relevant information made me worse off." The underlying mechanisms are fundamentally different:
  1.  **Insurance:** Strategic interaction failure (Multi-agent game theory).
  2.  **Relationship:** Dynamic preference change / self-command problem (Single-agent dynamic choice).
  3.  **Belief Utility:** Non-instrumental value of beliefs (Philosophical/Psychological challenge to utility foundations).

  ### What They Are NOT (Distinguishing Features)
  *   **Not Costly Acquisition:** You explicitly state the information is free/freely available. The negative value arises *from having the information*, not from the effort to get it.
  *   **Not Merely Unpleasant News:** While the news *might* be unpleasant, the negative value stems from the *structural consequences* (insurance collapse, forced action) or *intrinsic belief disutility*, not just the hedonic impact of hearing bad news. Standard "bad news avoidance" is often about avoiding *distress*. Your cases involve rational avoidance due to worsened *outcomes* or *choice sets*.
  *   **Not Misleading/False Information:** The information is true and relevant.
  *   **Not Value of Information (VoI) in Isolation:** Standard VoI calculus assumes instrumentalism, stable preferences, and an exogenous decision problem. These cases violate those assumptions.

  ### The Core Boundaries of the "Information Cannot Have Negative Value" Claim
  The general claim holds **only if all the following are true**:
  1.  **Instrumentalism:** Utility depends *only* on states of the world/outcomes, not on beliefs themselves.
  2.  **Stable Preferences:** Preferences over outcomes/actions do not change based on acquiring the information.
  3.  **Exogenous Decision Problem:** The set of available actions and the mapping from actions to outcomes does not change based on you (or others) acquiring the information.
  4.  **No Strategic Interaction (or Perfect Commitment):** Either no other agents whose actions depend on your information/actions, or mechanisms exist to commit to strategies pre-information (often unrealistic).
  5.  **Costless Processing/Action:** While acquisition is free, acting on information or processing it cognitively is also costless.

  ### Naming the Terrain
  *   **Umbrella Term:** "Paradoxes of Information" or "Negative Value of Information (VoI) Scenarios". There's no single perfect universally recognized name because the mechanisms differ.
  *   **Specific Labels:**
      *   Insurance: **Endogenous Risk Pool Collapse** / **Adverse Selection Unraveling via Information Revelation**.
      *   Relationship: **Self-Binding Problem** / **Preference-Changing Information Avoidance**.
      *   Belief Utility: **Intrinsic Disutility of True Belief** / **Non-Instrumental Negative VoI**.

  ### Conclusion
  You've identified three robust counterexamples to an oversimplified claim about information. They are genuinely independent, each violating a different core assumption necessary for the "information cannot harm" result: strategic independence (Insurance), preference consistency (Relationship), and instrumentalism (Belief Utility). The crucial conceptual boundaries lie in understanding how information can alter the decision problem itself (Insurance), irrevocably change the agent's effective preferences (Relationship), or directly constitute a bad state (Belief Utility). Your cases highlight the limits of applying simple rational choice models without carefully considering dynamic preferences, strategic interactions, and the potential non-instrumental value of beliefs.
