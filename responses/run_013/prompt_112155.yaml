prompt: |-
  I host a small interview podcast on the philosophy of language, and next month's guest is a philosopher who has defended supervaluationism about vagueness for most of her career: on her view a vague sentence is true when it comes out true under every admissible way of making the predicate precise, false when it comes out false under all of them, and neither true nor false when the admissible ways of making it precise disagree. The reason I want her on is a twist she has been developing lately — she insists that the admissible sharpenings are not abstract predicates sitting in some platonic warehouse, but rather concrete ways a linguistic community could carry on using the word, so that vagueness is a matter of the open-endedness of a practice rather than a gap in the world. I need eight to ten questions that get past the usual exposition and press her where the view is actually under strain, each with a follow-up keyed to the answer she is most likely to give, so that I can keep her from settling into a restatement of the position.

  I want at least one question on higher-order vagueness: if the line between the admissible and the inadmissible ways of carrying on is itself fuzzy, does her view simply relocate the problem one level up, and if so is that a stable resting place or the first step of a regress? I want one pressing the suspicion that her use-theoretic reading of the sharpenings quietly collapses into the epistemicism she rejects, since there may be a fact of the matter about how the community would carry on even if nobody could know it; and one asking whether she can make it come out true, rather than merely not false, that a vague predicate draws no sharp boundary anywhere. I would also like a question on the sorites: on her account the argument is valid and its conclusion is false, yet no single premise is false, so how does she diagnose the failure — a false premise, an equivocation, an invalid step, or none of the above? And one about the same word being vague in one community and precise in another: is that a change in the facts, in the language, or in neither? Please close the sequence with a question asking her what could count as evidence against the whole approach — something that could actually come out against it, not a rehearsal of its explanatory virtues.
reasoning: |-
  Okay, let me tackle this query. The user hosts a philosophy podcast and needs incisive questions for a supervaluationist guest with a practice-based twist. I need to craft 8-10 questions targeting pressure points, each with strategic follow-ups. 

  First, assessing core requirements: the guest reinterprets admissible sharpenings as concrete linguistic practices rather than abstract entities. Key pressure points include higher-order vagueness, epistemicism concerns, truth-value gaps in boundarylessness, sorites diagnosis, cross-community vagueness, and falsifiability. 

  For higher-order vagueness, I consider how her "concrete practices" approach handles blurred lines between admissible/inadmissible developments. The follow-up should challenge whether this creates regress or if practice itself blocks it. On epistemicism, the risk is that unknown communal dispositions might create hidden sharp boundaries. The follow-up needs to probe if "could" versus "would" saves her view.

  The boundarylessness question must distinguish between "not false" and "true" - does her framework allow asserting no-sharp-boundary as positively true? Sorites requires unpacking why she rejects false premises yet deems the conclusion false, pressing whether "truth" applies differently to premises vs. conditionals. 

  Cross-community vagueness needs to clarify ontological commitments: is the difference in linguistic practice or world-involving facts? Finally, falsifiability demands concrete empirical counterexamples, not theoretical objections.

  I structure the sequence to escalate from conceptual pressures to meta-philosophical implications. Closing with falsifiability invites reflection on the theory's empirical grounding. Each follow-up anticipates defensive responses and counters them to prevent restatements of the position. The wording avoids jargon while preserving philosophical precision.
answer: |-
  Here are 8 incisive questions targeting pressure points in her practice-based supervaluationism, each with a follow-up designed to push past restatement:

  1.  **Question (Higher-Order Vagueness):** You ground vagueness in the open-endedness of *concrete* linguistic practices. But the line between "admissible" and "inadmissible" ways a community *could* carry on the practice seems itself inherently fuzzy – communities can disagree, drift, or innovate in borderline ways about what counts as carrying on the practice. Doesn't this relocate the problem of vagueness to the meta-level of "admissibility," and if so, how does grounding it in practice prevent a regress?
      *   **Likely Answer:** She might appeal to the practice itself resolving borderline cases contextually or deny that "admissibility" requires a sharp meta-boundary, emphasizing the practice's inherent flexibility.
      *   **Follow-Up:** If the community's evolving standards *themselves* have borderline cases of what counts as "carrying on" the original practice (e.g., subtle shifts in usage precedent), doesn't that mean the "admissibility" of a sharpening itself becomes a vague matter? If so, how does your supervaluationism – which relies on a definite set of admissible sharpenings – even get off the ground without presupposing a sharp line you deny exists at the object level?

  2.  **Question (Epistemicism Risk):** By defining admissible sharpenings as concrete ways the community *could* carry on the practice, aren't you smuggling in a hidden epistemicism? Even if *we* don't know the exact boundaries of what the community *would* do under all counterfactuals, isn't there a fact of the matter about the actual dispositions and potential developments inherent in the practice *right now*, determining a unique set of "coulds"? Doesn't this make the "admissible sharpenings" just unknowable precise boundaries in disguise?
      *   **Likely Answer:** She'll stress the modal "could" over the epistemic "would," emphasizing genuine openness and multiple possible future developments inherent in the practice's state, denying any single fact of the matter about *the* unique path.
      *   **Follow-Up:** But doesn't the *current* state of the practice (its rules, dispositions, precedents) objectively constrain which future developments are *genuinely possible continuations* versus radical changes or mistakes? If those constraints are objective (even if complex), doesn't that mean the set of "admissible" sharpenings *is* sharply determined by the current practice's facts, making truth-value gaps merely epistemic? How is "could" not parasitic on a factual "would given the practice's actual state"?

  3.  **Question (Truth of "No Sharp Boundary"):** Supervaluationism typically renders "There is no sharp boundary" *not false* (since no *single* sharpening has a boundary, but the set does), but crucially, not *true* either (because the set *as a whole* draws boundaries). Can your practice-based account do better? Can "This vague predicate 'P' draws no sharp boundary" ever come out *true* simpliciter on your view, rather than merely not false?
      *   **Likely Answer:** She might argue that the statement *is* true because *no admissible sharpening* (i.e., no concrete way of carrying on the practice) introduces a sharp boundary; the boundaries only exist in the abstract space between sharpenings, not in any actual or potential realization of the practice.
      *   **Follow-Up:** But does the *totality* of admissible sharpenings (the whole set of ways the practice *could* go) not collectively define boundaries for the *vague predicate as it is now*? For example, isn't it determinately false *now* that a 1-atom-tall pile is a heap, and determinately true *now* that a mountain is, precisely *because* no admissible sharpening flips those verdicts? Doesn't this mean the current vague predicate *does* have boundaries fixed by the range of its admissible sharpenings, even if no single sharpening realizes them? How is "no sharp boundary" true if the set defines outer limits?

  4.  **Question (Sorites Diagnosis):** Take a standard Sorites: "1 grain isn't a heap; if n grains aren't a heap, then n+1 grains aren't; therefore, 1,000,000 grains aren't a heap." On your view, the conclusion is false (it's supertrue that 1M grains *is* a heap), no single premise is false (each is either true or neither-true-nor-false), and the logic is classically valid. What, then, is the *source* of the paradox? Where exactly does the reasoning fail, if not at a false premise or invalid step?
      *   **Likely Answer:** She'll likely say the failure is in the *application* of classical logic to vague predicates, or in the inductive premise being *not true* (neither true nor false) overall, even though no instance is false.
      *   **Follow-Up:** If the inductive premise ("If n grains aren't a heap, then n+1 grains aren't") is *not true* (i.e., neither true nor false) because it's false on *some* admissible sharpenings (namely, those placing the cut-off between n and n+1), how is the argument *valid*? Doesn't classical validity require that if the premises are *true*, the conclusion must be true? But here, the premises are never *jointly true* on any sharpening (when the premise is true for a cut-off, the base case or conclusion fails). Doesn't this suggest supervaluationism actually requires a *non-classical* notion of validity, undermining the claim that the logic is classical?

  5.  **Question (Practice vs. World):** You emphasize that vagueness lies in the practice, not a "gap in the world." But consider a word like "bald" used identically in two communities: one where scalp micropigmentation is unknown/impossible, and one where it's common and considered genuine hair. "Bald" seems vaguer in the first community (where the possibility of artificial dots doesn't arise) than in the second. Is this difference in vagueness solely a fact about their linguistic practices, or does the state of the *world* (what's technologically possible/considered) also play a constitutive role?
      *   **Likely Answer:** She'll argue it's still about the practice – the second community's practice *incorporates* the possibility of micropigmentation when determining what counts as "hair" or "bald scalp," making the predicate more precise in that dimension.
      *   **Follow-Up:** Doesn't this make the "admissible sharpenings" (ways of carrying on) heavily dependent on non-linguistic facts about technology, biology, or social norms? If the *world* changing (e.g., micropigmentation becoming possible) can change which future developments count as "carrying on" the practice of using "bald," doesn't this blur your distinction? Is the openness of the practice itself partly constituted by worldly possibilities?

  6.  **Question (The Cost of "Neither"):** Your view posits genuine truth-value gaps for borderline cases. Yet, in ordinary practice, borderline statements often function pragmatically – we might treat "That patch is red" as acceptable to assert or deny in context, or force a decision. Doesn't insisting on a "neither" status for borderline cases fail to capture the *positive* but context-sensitive role these statements play in actual communication within the practice?
      *   **Likely Answer:** She might agree that borderline statements have important pragmatic roles (hedging, prompting clarification, context-setting) but insist this is compatible with their lack of classical truth value; the practice accommodates this indeterminacy.
      *   **Follow-Up:** But if competent speakers within the practice regularly *treat* borderline statements *as if* they have a truth-value in specific contexts (e.g., "For this purpose, we'll count that as red"), doesn't this suggest that the *practice itself* often operates with a local precision that your global supervaluationist semantics misses? Isn't the "gappy" semantics potentially an *over-intellectualization* of how vagueness actually functions dynamically in use?

  7.  **Question (The Precision of "Admissible"):** You reject abstract sharpenings for concrete practices. What guarantees that the set of "ways a community could carry on the practice" is sufficiently well-defined *in practice* to ground supervaluationist semantics? Couldn't the boundaries of this set be so indeterminate or contested within the community that it fails to provide the necessary determinacy for truth conditions (e.g., for clear cases)?
      *   **Likely Answer:** She'll argue that clear cases are supertrue/superfalse precisely because *all* plausible continuations of the practice agree on them. The core stability of the practice fixes these.
      *   **Follow-Up:** But if the set of "plausible continuations" is itself vague (as per Q1), how can there be *any* statement that is true on *all* admissible sharpenings? Wouldn't even "1 grain is not a heap" potentially fail if there's a radically deviant, barely admissible sharpening that counts *any collection* as a heap? Doesn't grounding admissibility in potentially contested or vague communal dispositions undermine the determinacy needed for supertruth at the edges?

  8.  **Question (Falsifiability):** What kind of empirical discovery about language use or a specific linguistic community would genuinely threaten or falsify your practice-based supervaluationist approach? What evidence could show that this framework gets the fundamental nature of vagueness wrong?
      *   **Likely Answer:** She might struggle initially, then suggest something like discovering a community using a putatively vague predicate in a way that *requires* hidden precise boundaries to explain successful coordination, or evidence that borderline statements consistently behave like unknown truths/falsehoods in reasoning.
      *   **Follow-Up:** Suppose we found a community using a Sorites-susceptible predicate where: (a) all competent speakers exhibit deep, irremediable inconsistency in classifying a fixed borderline series *even under ideal reflection and full discussion*; (b) they readily accept classical logic; *and* (c) they nevertheless display highly reliable and coordinated behavior using the predicate in real-world contexts, *without* any evidence of contextual precisification. Wouldn't this suggest their competence relies on something *other* than a range of potential precisifications (since they can't access or converge on them) and that truth-value gaps might actively hinder explaining their successful coordination? Could your framework accommodate this?

  **Key Strengths of this Sequence:**

  *   **Targets Core Innovations:** Focuses on the concrete practice twist, not vanilla supervaluationism.
  *   **Anticipates Defenses:** Follow-ups are designed to counter the most natural defensive moves.
  *   **Covers Requested Topics:** Explicitly addresses HOV, epistemicism risk, "no sharp boundary" truth, Sorites diagnosis, practice/world, and falsifiability.
  *   **Progressive Pressure:** Builds from conceptual regress (Q1) to potential incoherence (Q7) to empirical risk (Q8).
  *   **Prevents Restatement:** Each follow-up forces engagement with the tension raised, demanding justification or refinement, not just repetition.
  *   **Closes Strong:** Q8 pushes her to confront the theory's empirical grounding and potential vulnerabilities.

  Use these to steer the conversation into the deep, potentially choppy waters where the most interesting philosophical insights about her view are likely to emerge. Good luck with the interview!
