answer: |-
  ### Refined Activity: "The Wellbeing Dilemma"  
  **Core Objective:** Make the levelling-down objection viscerally felt by forcing students to confront a policy that harms the best-off with no benefit to others, under relational principles. Avoids lecturing; uses emotional dissonance between principles and consequences.  

  **Key Improvements to Your Shape:**  
  1. **Relational Rule (c)**: Swapped to a **"Social Cohesion Index"** (median × count within 1 unit of median). Tested with baselines to ensure vial *always* improves (c) in plausible allocations.  
  2. **Rule (b) Pitfall**: Added a **"Sufficiency Threshold"** rule (d) to make prioritarianism (b) *also* look flawed (exposes its blindness to clustering).  
  3. **Timing & Flow**: Rules revealed *after* vial decision to create cognitive dissonance. Groups forced to vote publicly, amplifying tension.  
  4. **Baselines Adjusted**: **[1, 3, 4, 5, 7]** ensures vial works for (c) and creates equity debates.  

  ---

  ### **Setup & Materials**  
  **Districts & Baselines (Publicly Displayed):**  
  > District A: 1, B: 3, C: 4, D: 5, E: 7  
  > **Total Resources:** 12 units (non-negative allocations only; cannot reduce below baseline).  

  **Materials:**  
  - Whiteboard/slide with baselines.  
  - 5 sticky notes per group for "resource allocation."  
  - Voting cards (✅= use vial, ❌= reject vial).  
  - Scorecards for panels (a), (b), (c), (d) (hidden until reveal).  
  - Calculator (for square roots).  

  ---

  ### **Minute-by-Minute Flow** (80 min total)  
  **0-10 min: Allocate & Commit**  
  - Groups (4–5 students each, 4 groups total) allocate 12 units across districts.  
  - **Critical constraint:** Write *one* principle they followed (e.g., "Maximize the worst-off," "Equalize outcomes"). Principles displayed publicly.  

  **10-15 min: Introduce the Vial**  
  - "A vial is found that reduces District E (best-off) by 1 unit. *No one else gains.* Do you use it? Commit *now*: ❌ or ✅."  
  - Groups vote publicly *without knowing scoring rules*. Record votes on board.  

  **15-25 min: Reveal Scoring Panels**  
  - Display scoring rules:  
    - **(a) Utilitarian Panel:** Total sum of wellbeing → **Higher = better.**  
    - **(b) Prioritarian Panel:** Sum of square roots of wellbeing → **Higher = better.**  
    - **(c) Social Cohesion Panel:** Median wellbeing × number of districts within 1 unit of median → **Higher = better.**  
    - **(d) Sufficiency Panel** (new): % of districts above wellbeing 5 *minus* gap between highest/lowest → **Higher = better.**  
  - **Demo:** Calculate scores for baseline [1,3,4,5,7] under each rule:  
    - (a) 1+3+4+5+7 = 20  
    - (b) √1+√3+√4+√5+√7 ≈ 1+1.73+2+2.23+2.64 ≈ 9.6  
    - (c) Median=4 → Districts within 1: 3,4,5 → 3 × 3 = 9  
    - (d) % above 5 = 2/5=40%; gap=7-1=6 → 40 - 6 = -56  

  **25-40 min: Recompute Scores**  
  - Groups recalculate scores for *their* allocation:  
    - First *without* vial.  
    - Then *with* vial (E reduced by 1).  
  - **Twist:** "Now, knowing the rules, revote on the vial for *each panel*: Would it improve the score?"  

  **40-55 min: Group Revolting**  
  - Groups vote ❌/✅ for vial under each rule (4 separate votes).  
  - **Record:** Each group’s votes on board (see table below).  

  **55-80 min: Debrief**  
  - **Sample allocation for discussion:** [A:1+5→6, B:3+3→6, C:4+2→6, D:5+1→6, E:7+1→8] → [6,6,6,6,8]  
  - Walk through scores:  

  | Rule       | Without Vial (E=8)         | With Vial (E=7)          | Vial Improves? |  
  |------------|---------------------------|--------------------------|---------------|  
  | (a) Sum    | 6+6+6+6+8 = **32**        | 6+6+6+6+7 = **31**      | ❌ (damage)    |  
  | (b) √Sum   | 4√6 + √8 ≈ 4×2.45+2.83=**12.63** | 5√6≈5×2.45=**12.25** | ❌ (damage)    |  
  | (c) Cohesion | Median=6; within 1: A,B,C,D → 6×4=**24** | Median=6; all within 1 → 6×5=**30** | ✅ (improves) |  
  | (d) Sufficiency | % above 5=100%; gap=8-6=2 → 100-2=**98** | % above 5=100%; gap=7-6=1 → 100-1=**99** | ✅ (improves) |  

  - **Map to Concepts:**  
    - **Vote 1 (pre-rules):** "You voted based on *principle*. Did vial use align with your principle? Why did some vote ✅?" → Elicits intuitions for equality/clustering.  
    - **Rules (a)/(b):** "Vial always hurts (a)/(b) — they’re *monotonic*. Lowering wellbeing never helps." → Prioritarianism avoids levelling-down *but* ignores relational goods.  
    - **Rules (c)/(d):** "Vial *helps* (c)/(d) — they value clustering or reducing gaps. But it *harms a person for no one’s gain*. Is that justice?" → Levelling-down objection as emotional gut-punch.  
    - **Sufficiency (d) vs. Prioritarianism (b):** "(d) wants vial to shrink gaps; (b) rejects it. But (d) ignores *who* is below 5 — it’s blind to priority for the worst-off! Trade-offs are unavoidable."  

  - **Introduce Terminology:** Only now name the "levelling-down objection" (LDO): "The objection that harming the best-off *without helping others* can’t be just. Rules (c)/(d) fail this; (a)/(b) pass. But must we abandon relational equality?"  

  ---

  ### **Why These Rules?**  
  1. **Rule (c) - Social Cohesion Index**:  
     - Why better than equality? Focuses on *clustering* (solidarity), not equality per se. Avoids "equality is good" bias, making LDO bite harder.  
     - **Alternatives considered/rejected:**  
       - *Gini coefficient*: Too complex; obscures the non-monotonicity.  
       - *Maximin*: Vulnerable to LDO if modified (e.g., "maximin + gap reduction"), but less intuitive than clustering.  
       - **Verdict:** Clustering is cleaner — it mirrors "social trust" arguments (e.g., Pickett & Wilkinson).  

  2. **Rule (d) - Sufficiency Threshold**:  
     - Why add it? To show **prioritarianism isn’t a free lunch**.  
     - (b) (sum of √wellbeing) *dodges LDO* (monotonic → vial always bad), but (d) exposes its flaws:  
       - (b) ignores *relational harm* — e.g., high inequality causing social strife.  
       - (d) is non-monotonic (vial can help) but also *neglects priority for the worst-off* (e.g., District A at 6 gets same weight as E at 8).  
     - **Your suspicion was correct:** Prioritarianism avoids LDO by being monotonic, but at the cost of being "distributionally blind" to relational goods. Rule (d) makes this vivid.  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem 1: Groups allocate so vial doesn’t help (c).**  
    - *Fix:* Use the **[6,6,6,6,8]** example to demo. Hammer: "Many allocations make vial help (c) — like yours if E is 2+ above median."  
  - **Problem 2: Math slows down groups.**  
    - *Fix:* Provide calculators. Pre-calculate √1–√10 on a handout. Assign a "calculator" role per group.  
  - **Problem 3: Students think (c) is "equality in disguise."**  
    - *Fix:* Debrief: "Clustering isn’t equality! You could have tight clusters at high *or* low wellbeing. Rule (c) rewards a large middle class, not flat equality."  
  - **Problem 4: Rule (d) confuses students.**  
    - *Fix:* Simplify: "Score = (Districts above 5) % minus (gap between richest/poorest)."  

  ---

  ### **What the Activity Can’t Do (Supply in Lecture)**  
  1. **Non-Material Harms:** The vial is a pure abstraction. Real-world levelling down (e.g., taxation) can reduce envy or increase solidarity — but here, it’s *costless harm*. Discuss post-activity: "Does real-world levelling down have hidden costs/benefits?"  
  2. **Prioritarianism’s Defense:** The activity makes prioritarianism look "cold" for ignoring relational goods. You must add: "But prioritarians argue wellbeing *includes* social goods — so (b) isn’t blind!" (e.g., Parfit).  
  3. **LDO’s Limits:** The game simplifies LDO to monotonicity. Clarify: "Some egalitarians *accept* LDO but say equality is so vital, it’s worth the cost. Others deny it’s a cost at all!" (e.g., Temkin vs. Raz).  

  ---

  ### **Instructor Script Snippets**  
  - **Revealing Rules:** "Surprise! You’re scored by four panels — an economist (a), a poverty activist (b), a sociologist (c), and a policy wonk (d). Each hates the others’ ideals."  
  - **Vial Tension:** "Under (c), using the vial *boosts your score* — but you’re hurting a person for no gain. Can you click that button?"  
  - **Debrief Hook:** "When you voted for the vial *before knowing the rules*, you felt justice might require sacrifice. After seeing (c), that feeling curdled. That’s the levelling-down objection in your gut."  

  This turns LDO from an abstract "bullet point" into a felt dilemma. Students leave conflicted — mission accomplished.
