  ## Absentia Omission Cover™: Frequently Asked Questions

  **1. What exactly does Omission Cover protect me against?**  
  Absentia Omission Cover™ provides financial protection against liabilities arising specifically from *your failure to act*, where that failure is deemed the legally recognized cause of a negative outcome. Examples include (but are not limited to): liability for property damage due to failing to perform routine maintenance, personal injury claims stemming from not warning of a hazard, or contractual penalties incurred due to not meeting a stipulated duty of care. We insure the *non-occurrence* that caused the harm.

  **2. How do you determine if MY specific omission caused the damage? Isn’t everything technically caused by something I didn’t do?**  
  An excellent question highlighting the complexity of omission causation. Absentia employs proprietary actuarial models (Patent Pending) to establish the *Relevant Baseline of Expectation™*. We statistically analyze what a "reasonable person" *would have been expected to do* in your specific circumstances, based on millions of data points. Crucially, not *every* possible omission counts – only those falling demonstrably *below* this statistically defined baseline of expected action. For instance, while not inventing a cure for cancer yesterday is an omission, it falls far outside your Relevant Baseline. Not watering the plant entrusted to you, however, likely falls within it. We identify the omission that *made the critical difference* against the expected norm.

  **3. I was sued because I didn’t donate to my neighbour’s crowdfunding campaign for their experimental pet iguana surgery. The iguana died. They claim my omission caused the death. Am I covered?**  
  Coverage depends on establishing if a donation fell within your Relevant Baseline of Expectation™. Generally, spontaneous charitable acts, especially for non-essential veterinary procedures on exotic pets, fall well outside the standard baseline defining a "reasonable person’s" expected actions. Absentia actuaries categorize such expectations on a spectrum from "Legally Mandated Duty" to "Purely Voluntary Supererogation." Failure to perform a purely voluntary act rarely constitutes a legally actionable omission. Therefore, this claim would likely fall outside policy coverage. We insure failures to meet established duties, not failures to fulfill every potential "moral obligation."

  **4. My policy mentions "Action-Omission Premium Differentials." Why does actively causing harm sometimes cost *less* to insure than failing to prevent it?**  
  Our risk assessment models consistently show that liabilities arising from *active interventions* often involve more predictable causal chains and clearer intent, allowing for more accurate premium calculation. Liabilities stemming from *omissions*, however, involve complex counterfactual analysis (what *would* have happened if you *had* acted?) and the inherent challenge of defining the precise baseline expectation. This increased actuarial complexity and the broader scope of *potential* omissions contributing to any given harm necessitate a modest premium adjustment. Think of it as the complexity surcharge for insuring the unseen and undefined.

  **5. I flooded my basement by not pumping it during a storm. But I genuinely forgot! I didn't *know* I was omitting to pump. Does intent matter?**  
  Absentia Omission Cover™ focuses on the *fact* of the omission relative to the Relevant Baseline of Expectation™ and its causal link to the harm, not necessarily on your conscious awareness *at the precise moment*. However, establishing liability often involves legal concepts of negligence, which may consider whether you *should have known* about the duty and the risk. Our claims investigation will determine if "forgetting" itself constituted a deviation from the expected baseline of vigilance for a homeowner in your situation (e.g., were storm warnings issued? Was flooding foreseeable?). The intersection of knowledge, foreseeability, and duty is complex, and coverage depends on this nuanced assessment.

  **6. I filed a claim after my business partner sued me for not investing in his startup idea (which then failed). NullSure Insurance denied his claim against me instantly, saying "an absence isn't a real cause." Why is Absentia different?**  
  NullSure adheres to a specific ontological stance, holding that causation requires positive, spatiotemporally located *events* linked by energy transfer or physical processes. Under this view, absences (non-events) cannot be causes. Absentia, however, recognizes the well-established legal and practical reality that *failures to fulfill expected duties* are routinely deemed causes in tort law and everyday responsibility attribution. Our policies are built on this pragmatic understanding. While NullSure denies *all* omission claims on principle, Absentia provides essential coverage based on the actual functioning of liability systems, utilizing our sophisticated Baseline of Expectation™ model to distinguish relevant omissions from irrelevant non-actions.

  **7. How do you stop people from claiming *everything* was caused by someone else’s omission?**  
  Our claims process rigorously applies the counterfactual test *within the constraints of the Relevant Baseline of Expectation™*. We ask: "Would the harm *still* have occurred if the policyholder had performed the specific action within their statistically defined baseline?" Crucially, we identify the *most direct and proximate omission* below the baseline that made the critical difference. While countless omissions *could* be argued counterfactually necessary for any event (e.g., the harm wouldn’t have occurred if your great-grandfather hadn't omitted to move to a different continent), only omissions falling demonstrably below *your* specific, contextual baseline and directly enabling the harm chain are considered. Our actuaries are experts at isolating the signal (the relevant omission) from the noise (all other non-actions).

  **8. Where can I learn more about the specifics of my Relevant Baseline of Expectation™?**  
  Your personalized Baseline is dynamically calculated using proprietary algorithms based on your policy details, location, occupation, and historical risk data. For transparency, your policy documents include a general categorization matrix (e.g., "Homeowner - Standard Vigilance Tier," "Small Business Operator - Basic Duty of Care Level"). The full actuarial tables defining these categories in granular detail are Absentia trade secrets, protected to ensure the integrity of our risk models and pricing structure. Rest assured, your baseline is defined with actuarial objectivity to reflect the statistically expected actions for someone in your precise risk profile.
