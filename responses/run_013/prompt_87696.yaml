answer: |-
  Here’s a one-page procedure designed for speed, clarity, and resilience against gaming. It focuses on **evidence credibility** using your "bluffer's difficulty" principle. Panelists run this during discussion when credentials (matching funds, letters, partners, plans) are raised.

  ---

  ### **GRANT PANEL EVIDENCE ASSESSMENT PROCEDURE**
  **When a credential is cited (e.g., "They have matching funds!"), ask these questions in order:**

  1. **WHO PAID?**  
     - **If the applicant paid** (e.g., hired a consultant, diverted staff time to write a complex plan), proceed to Q2.  
     - **If someone else paid** (e.g., bank donated funds, famous partner endorsed for free), skip to Q3.  
     - **If unclear**, mark as "Suspect" (see Step 4).  

  2. **EXPENSIVE?**  
     - *"Could a weak project fake this by spending money?"*  
     - **Yes** (e.g., glossy evaluation plan, paid celebrity letter): → **"Expensive Signal"**  
     - **No** (e.g., decade of completed reports, unique expertise): → **"Unfakeable"**  
     - **Unsure**: → **"Suspect"**  

  3. **UNFAKEABLE?**  
     - *"Does this require genuine success/trust to exist?"*  
     - **Yes** (e.g., reputable partner’s *ongoing* collaboration, unsolicited community testimonials): → **"Unfakeable"**  
     - **No** (e.g., one-off letter from politician, bank’s PR-driven funds): → **"Expensive Signal"**  
     - **Unsure**: → **"Suspect"**  

  4. **WEIGHT & ACTIONS**  
     - **Expensive Signal**: **Ignore.** It proves access to resources, not project quality.  
     - **Unfakeable**: **Add 1–2 pts** (max 20% of total score). Only decisive if it directly answers a *major weakness* (e.g., "No track record?" countered by 11 yrs of reports).  
     - **Suspect**: **Flag for chair.** Chair asks: *"Could a sham project produce this without real merit?"*  
       - Majority "yes" → Ignore.  
       - Majority "no" → Treat as "Unfakeable."  
       - Tie → Ignore.  

  5. **RUBRIC ADAPTATION RULE**  
     - *Before scoring:* Ask: *"If every applicant did this next year, would it still distinguish quality?"* If no, exclude it from criteria.  

  **Values Call Required When:**  
  - Evidence is tied to core mission fit (e.g., a senator’s letter for an *apolitical* arts project).  
  - "Unfakeable" status hinges on panel’s trust in a field (e.g., is a "famous university partner" meaningful?).  
  → **State aloud:** "This is a values call on [issue]. Vote based on relevance."  

  ---

  ### **APPLICATION TO YOUR CASES**
  *(Scoring: 0–10. Unfakeable adds 0–2 pts. Expensive Signals = 0.)*  

  **Case (a): Regional Theatre**  
  - *$40k Bank Funds*: **Expensive Signal** (Bank paid; easily faked via PR deals). → **0 pts**  
  - *Senator’s Letter*: **Expensive Signal** (Politician paid nothing; low authenticity bar). → **0 pts**  
  - *Project*: Website/workshops. Credentials add nothing. Score the plan’s merits alone.  
  **→ Procedure contradicts instinct to reward "prestige." Ignores both credentials.**  

  **Case (b): Retired Librarians**  
  - *No funds/names*: Not raised → No penalty.  
  - *11 yrs of reports*: **Unfakeable** (Applicant paid in labor; requires real consistency). → **+1–2 pts**  
  - *Boring reports*: Actually a strength (proves accountability).  
  **→ Procedure rewards your instinct. Their track record is gold.**  

  **Case (c): University Centre**  
  - *Logic Model*: **Unfakeable** if complex/specific (Requires real expertise to design). → **+1 pt**  
  - *External Evaluator (15%)*: **Expensive Signal** (Applicant paid; bluffer hires one too). → **0 pts**  
  - *Famous Partner*: **Suspect** → Chair asks: "Could a sham project get this name?"  
    - If partner lends *ongoing oversight* → **Unfakeable (+1 pt)**.  
    - If name-only → **Expensive Signal (0 pts)**.  
  - *Apparatus cost*: Penalize in budget review (efficiency), not evidence scoring.  
  **→ Procedure challenges your instinct: A valid logic model is unfakeable expertise. But it slashes weight for the evaluator.**  

  ---

  ### **WHERE YOUR INSTINCTS CONFLICT**  
  - **You dismissed (c)’s "apparatus"** → Correct on the evaluator (expensive), but the logic model *might* deserve credit if truly rigorous.  
  - **You valued (b)’s humility** → Procedure agrees, but forces explicit reward for their reports.  
  - **You distrusted (a)’s glitter** → Procedure *validates* this, rejecting both signals.  

  **Key Insight:** Your "bluffer's difficulty" principle *protected* (b) and *penalized* (a)/(c)’s bloat. The procedure makes this systematic. Hand this out—it’s battle-ready.  

  ---  
  *Chair’s Note: This won’t fix groupthink, but it forces scrutiny. When prestige is cited, throw the questions on the table: "Who paid? Could a sham do this?" Ten seconds, then vote.*
