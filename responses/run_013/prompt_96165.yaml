prompt: |-
  Something about guardianship and medical decision-making has always bothered me, and I want to know what the rules are actually assuming. When an adult loses the ability to decide for themselves, the instruction to whoever decides for them is usually not do what's best for them, it's do what they would have wanted -- reconstruct their choice, don't make your own. Fine. But in a lot of places that same instruction is written to cover people who never had capacity at any point in their life: someone with a profound intellectual disability from birth, a child who will never be competent, a patient who's been unresponsive since an accident at nineteen. There's no earlier choice to recover. The surrogate is still supposed to ask what the person would have wanted, and is explicitly told not to substitute their own values -- and courts have authorized real, irreversible things on exactly that basis, which is where it starts to feel like a magic trick. Meanwhile the same hospital, sometimes the same statute, falls back on best interests for the very same kind of patient, and best interests is a seperate question: what's good for them, not what they want. And then the case that really gets me: a competent adult refuses a life-saving treatment while severely depressed, and we override the refusal on the grounds that it isn't really their decision, that the depression is doing the deciding. Take that seriously and you've said there's a gap between what someone actually chooses and what they really want.

  So what does this cluster of practices presuppose about a person's will? Is it committed to there being a fact of the matter about what someone would want if they were thinking clearly -- a fact that could hold even for someone who has never wanted anything -- or could the whole thing run on something thinner, like a procedural rule (follow the last explicit statement, and where there isn't one, use best interests) that never needs an idealized will at all? Which parts of the practice strictly require the idealized-will picture and which parts merely happen to fit it? Is it internally consistent, or is the never-competent case doing something the depression case forbids, since there we discount the actual choice and here we elevate a counterfactual one? And if you gave up on the idea that there's a fact about what someone would want under ideal conditions -- if preferences only existed when they were actually had -- what would concretely change: who decides, what the surrogate is told to do, what counts as a good reason at the bedside? Last thing, if the idealization is legitimate for one person, whats the argument against extending it to a family, or a community, or a whole society's idealized will?
reasoning: |-
  Okay, let me start by unpacking the user's question. They're really digging into the philosophical and practical inconsistencies in how guardianship and medical decision-making handle different groups: those who were once competent, those who never were, and those whose competence is temporarily impaired. 

  The user's frustration is palpable—they see a "magic trick" in reconstructing choices for people who never had capacity. That's a sharp observation. I need to address why the legal system does this while sometimes defaulting to best interests for similar cases. The tension between idealized will and actual choices is central here.

  First, I should clarify the core concepts. Substituted judgment is about hypothetical preferences, while best interests are objective welfare standards. For never-competent individuals, applying substituted judgment seems contradictory. Courts often admit it's a legal fiction but use it to maintain procedural consistency. That's a key point—procedural rules might be driving this more than philosophical commitment.

  The depression case adds another layer. Overriding a depressed patient's refusal assumes a "true self" beneath the illness. But for the never-competent, we invent a hypothetical self. The user’s spot on about the inconsistency: discounting actual choices in one case while elevating counterfactual ones in another. I need to explain why systems tolerate this. Maybe it's about respecting autonomy where it might have existed versus where it couldn't.

  If we abandoned idealized preferences entirely, what changes? For never-competent patients, we'd default to best interests without the charade. Surrogates would focus solely on well-being. That seems cleaner, but it might feel less respectful to families who believe their loved one had discernible preferences. Ethically, it's more honest but could clash with cultural values.

  Extending idealization to groups opens a can of worms. The user’s hinting at slippery slopes—if we idealize an individual's will, why not a society's? That’s where liberal political theory draws a line: individual autonomy protects against collective imposition. But the user’s pushing to see if the underlying principle is the same. I should emphasize that individual idealization is a stopgap for missing autonomy, while group versions risk erasing dissent.

  Underneath all this, the user might be wrestling with how we value autonomy versus welfare. Are we pretending to respect autonomy when we’re really imposing values? Their examples expose real fault lines in bioethics. Maybe they want validation that the system is philosophically messy, and practical solutions aren’t always elegant. They might also fear paternalism creeping in through these fictions. Addressing that concern matters—highlighting where transparency and safeguards can help.

  I’ll structure the response around the core tension, then break down each practice, inconsistencies, and alternatives. Concrete examples will show what changes if we drop idealization. Finally, I’ll tackle the group extension as a boundary case. Keeping it grounded in real-world impact (who decides, what counts as a reason) should meet their need for tangible answers.
answer: |-
  This is a profound and incisive critique, hitting at the core tensions in medical ethics, legal doctrine, and the philosophy of autonomy. The cluster of practices you describe presupposes a complex, often inconsistent, understanding of "will" or "preferences." Let's break it down:

  **Core Presuppositions:**

  1.  **The Existence of a "True Self" or "Authentic Will":** The system fundamentally assumes that beneath impairment, incapacity, or transient mental states (like severe depression), there exists a core set of values, beliefs, and preferences that constitute the person's "real" wishes. This is the "idealized will" – what they *would* want if thinking clearly, rationally, consistently with their core identity, and free from distorting influences.
  2.  **Knowability (or Constructability) of this Will:** It presupposes that this "authentic will" can be known or reasonably constructed, even in its absence:
      *   For the *formerly competent*: Through past statements, values (religious, cultural, philosophical), lifestyle choices, and relationships ("What would Mom *really* want?").
      *   For the *never competent*: Through extrapolation from observed reactions, personality fragments, known likes/dislikes (even simple ones), family values, and sometimes, controversially, what a "reasonable person" in their situation would want. The practice often relies on the belief that *some* preferences existed, however rudimentary, or that a "true self" existed *in potentia*.
      *   For the *depressed/transiently impaired*: By distinguishing the "illness" (depression) from the "real person," assuming the refusal is a symptom, not an authentic expression.
  3.  **Primacy of Autonomy (Even Hypothetical):** The system prioritizes respecting a person's self-determination *over* purely objective welfare considerations ("best interests"), whenever possible. Substituted judgment is an *extension* of autonomy into incapacity. Using it for the never-competent is an attempt (however strained) to grant them this same respect, avoiding pure paternalism.
  4.  **Distinction Between "Choice" and "Authentic Will":** The depression case explicitly creates this gap. The actual refusal is seen as *inauthentic*, not truly expressive of the person's underlying values and desires. This validates the idea that an "actual choice" can be invalid if not aligned with the "idealized will."

  **Addressing Your Specific Questions:**

  1.  **Is it committed to a fact about an idealized will, even for the never-competent?**
      *   **Formally/Procedurally:** Yes. Statutes and doctrines *instruct* surrogates to *try* to determine what the person *would* have wanted. Courts *do* authorize decisions based on reconstructed preferences for the never-competent. This presumes such a fact *can* be found or constructed.
      *   **Philosophically/Practically:** It's often a **legal fiction**. Many ethicists and practitioners acknowledge that for the profoundly disabled from birth, constructing a "true will" is impossible. The practice persists partly due to:
          *   **Procedural Consistency:** Having one rule ("substituted judgment") for all incapacitated adults simplifies the legal framework.
          *   **Respect Gesture:** Avoiding the explicit declaration that some lives are governed solely by others' judgments of their welfare.
          *   **Family/Cultural Input:** Allowing families to project their understanding of the person's "spirit" or potential preferences.
      *   **It's not entirely "thinner."** While procedural rules exist (follow advance directives first), the *justification* for substituted judgment, even where applied fictionally, relies on the *idea* of an authentic will. "Best interests" is explicitly the fallback *when* substituted judgment is impossible, acknowledging the fiction's limits.

  2.  **Internal Consistency?**
      *   **No, there is significant tension:**
          *   **Never-Competent vs. Depression:** This is the starkest contradiction. For the depressed patient, we *reject* the actual, contemporaneous, verbalized choice as inauthentic. For the never-competent, we *construct* a hypothetical choice based on scant evidence and treat it as authoritative. We elevate a counterfactual choice for one group while discounting an actual choice for another.
          *   **Justification:** The distinction hinges on the *potential* for autonomy. The depressed person *had* and *will have again* (presumably) an authentic will; the refusal is seen as a temporary aberration. The never-competent person *never had* that potential. The system struggles to handle these extremes consistently under the banner of autonomy. The fallback to "best interests" for the never-competent (when the fiction becomes too strained) highlights the inconsistency.

  3.  **What if we abandon the idealized will?**
      *   **Concrete Changes:**
          *   **Never-Competent:** The default rule *everywhere* would become **pure best interests**. Surrogates would *only* be instructed to decide based on objective welfare considerations (pain relief, comfort, basic needs, potential for simple pleasures, medical efficacy). The charade of "what they would want" would end.
          *   **Formerly Competent:** **Advance Directives (Living Wills, Durable POA for Healthcare) would become even more crucial** as the *only* reliable window into actual prior preferences. Where no directive exists, surrogates might still try to infer past wishes, but the *primary mandate* would shift decisively towards **best interests**, perhaps tempered by *known* past values ("She valued independence, so avoiding burdensome care aligns with her interest in dignity").
          *   **Transient Impairment (Depression):** Decisions would become **much harder and more controversial**. Overriding a refusal would require a much stronger argument that the choice is *imminently dangerous* and *clearly irrational* even within the person's current state, not just inconsistent with a hypothetical "clear" state. The focus might shift more towards temporary protective measures while treating the depression, with a lower threshold for temporary overrides based on imminent harm/paternalism, but a higher bar for permanent decisions based on substituted judgment.
          *   **Surrogate Guidance:** Instructions would simplify: "Follow written directives. Where none exist, decide based on the patient's best medical and overall welfare interests, considering their current condition, prognosis, and known values only as they inform well-being, not as a separate reconstructed choice."
          *   **Bedside Reasoning:** Arguments would center on medical facts, prognosis, burdens/benefits of treatment, quality of life assessments, and minimizing suffering. Appeals to "what the *real* Mary would want" would vanish.

  4.  **Extending Idealization to Groups/Society?**
      *   **The Argument Against:** This is where the liberal foundations of autonomy become crucial. The idealized will concept, however flawed, is tied to **individual self-determination**.
          *   **Slippery Slope:** Extending it to groups risks justifying profound paternalism or authoritarianism ("We know what the *true* will of the people is, even if they don't express it").
          *   **Loss of Individual Protection:** The *whole point* of the individual idealized will (especially in the depression case) is to protect the individual *from* having group or societal values imposed upon them when they are vulnerable. Abandoning this distinction removes a key safeguard.
          *   **Who Defines the Group Will?** Determining the "idealized will" of a family, community, or society is even more fraught and subject to manipulation by those in power than the already problematic individual version.
          *   **Suppression of Dissent:** It inherently devalues actual, expressed preferences of individuals or minorities within the group if they conflict with the constructed "true" group will.
      *   **Why it's Different:** Respecting an individual's idealized will (even fictionally for the never-competent) is an attempt to respect *that specific person*. Extending it to groups moves into the realm of collective decision-making and potentially overriding *actual* individual choices in the name of a constructed collective ideal, which is fundamentally opposed to individual autonomy rights.

  **Conclusion:**

  The current cluster of practices presupposes a philosophically messy but practically resilient concept of an "authentic will" that can persist through or exist independently of current capacity. It prioritizes autonomy in principle, leading to the procedural dominance of substituted judgment. However, it encounters severe strain with the never-competent, revealing the idealized will as often a legal fiction maintained for consistency and respect gestures. The depression case highlights the gap between actual choice and idealized will, creating tension with the never-competent scenario.

  Abandoning the idealized will would lead to a clearer, more paternalistic system focused on welfare ("best interests") for those without capacity and a much higher bar for overriding refusals in cases of transient impairment. While philosophically cleaner in some respects, it risks feeling less respectful to individuals and families.

  Extending the idealization concept to groups is dangerous, as it fundamentally undermines the core liberal principle of individual autonomy that the individual idealized will concept, however imperfectly, attempts to serve. The system is not perfectly consistent, but its inconsistencies often arise from the difficult tension between respecting autonomy and protecting welfare when autonomy is compromised or never existed.
