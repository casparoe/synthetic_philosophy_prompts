prompt: |-
  I just took over as the exhibit writer at our county historical society — I write every label, panel, and caption in the building — and my first big project is a permanent exhibit on a local figure who did some genuinely awful things, and also founded the town and built its first school. The board keeps reaching for some version of "well, he was a man of his time," and my gut says that's sometimes the right call and sometimes a dodge, but I can't tell which is which in any given case, and I don't want to either whitewash him or turn every panel into a lecture about how terrible everyone back then was.

  What I need is a procedure I can actually run, panel by panel. I get maybe a paragraph of text per label, I'm not a trained historian, and whatever I write gets approved by a volunteer board that includes two of his descendants, so I have to be able to defend each call out loud. Give me the questions to ask in order, what counts as a good enough answer to each, and the point where the procedure should just stop and say "this isn't something the evidence can settle" — because I suspect some of these calls are values, not facts, and I want those flagged as such instead of smuggled into a label as if they were neutral.

  There are things I keep blending together and I want the procedure to force apart: whether we're judging him or judging the act; whether "everyone did it then" is even true, and whether it would matter if it were; the difference between someone who didn't know better and someone who knew better and did it anyway, or who wrote the opposite of what he practiced; and the fact that some people at the time already objected seems like it should matter a lot, though I cant articulate why.

  Run it on three cases: (1) our guy, who enslaved people while writing in his own papers about liberty; (2) a later local figure who was a real hero on labor rights but also wrote nasty things about immigrants that read as plain bigotry today; and (3) a case where the procedure tells me something I won't want to hear — either that the defense actually holds for someone I'd rather condemn, or that it fails for someone the board loves. If the procedure gives a different answer for the person than for the act, say so out loud. And tell me where it runs out — the calls no procedure can make for me.

  Lead with the bottom line in the first sentence and then give the reasoning, no preamble and no restating what I asked. I'll be doing this for years, on dozens of figures, sometimes on a week's notice, so it needs to be something I can run fast and explain to a non-historian in a meeting.
reasoning: |-
  Okay, the user is an exhibit writer at a county historical society, tasked with creating labels for a controversial local founder. They need a systematic procedure to evaluate historical figures' actions without whitewashing or moralizing. Key pain points include: distinguishing between judging individuals vs. actions, verifying "man of his time" claims, handling limited space (one paragraph per label), and navigating board approval (including descendants). 

  The user specifically wants three things: (1) a step-by-step filter for ethical evaluation, (2) tested examples including cognitive dissonance cases, and (3) clear demarcation where historical analysis ends and value judgments begin. Their unspoken tension is balancing historical rigor with community politics—they need armor for tough conversations.

  Hmm, their core struggle is epistemological: how to separate factual "was" from ethical "ought" when evidence is fragmentary. The mention of "values vs. facts" suggests they've encountered bad-faith "context" arguments before. Smart that they want to flag normative judgments explicitly—that’s professional curation 101.

  For the procedure: Must be fail-safe for non-historians. Start with act-specific questions (isolating deeds from legacy), then person-specific (intent/alternatives), then period-norms (testing "everyone did it" claims). Crucially, step 5 forces acknowledgment of contemporary dissent—that’s the kill switch for lazy relativism. The "stop" rules prevent overreach; labeling something "unresolved" is legally safer anyway.

  Testing on their cases: 
  - Case 1 (enslaver): The contradiction between his liberty writings and actions fails step 4 (cognitive dissonance). Contemporary abolitionists existed, so "man of his time" fails. Must present the tension.
  - Case 2 (labor hero/bigot): His immigrant-bashing wasn’t universal (step 3 finds contemporaneous pro-immigrant voices). His labor advocacy doesn’t excuse it—step 2 treats acts separately. 
  - Case 3 (procedure surprises): Imagine a 19th-century doctor using then-accepted treatments that harmed patients. If no alternatives existed *and* peers approved, step 3 might apply—even if we cringe now. That’ll anger board members who want blanket condemnation.

  Biggest landmine: Step 4’s "alternatives test." For enslaved people's trauma, stating "he could have chosen not to" is factual, but descendants may hear it as accusatory. Solution: Anchor in primary sources like his own papers showing self-awareness.

  Final note: The "values" flag isn’t cop-out—it’s intellectual honesty. When evidence gaps force speculation (e.g., "was he remorseful?"), saying "historians disagree" is stronger than faux certainty.
answer: |-
  Here's a step-by-step procedure to evaluate historical actions and figures for exhibit labels, designed for speed, defensibility, and clarity on what's factual vs. value-based. Apply it to each specific *act* or *trait* you need to address:

  **Procedure:**
  1.  **Define the Specific Act/Trait:** *What exactly did the person do or believe that requires contextualization?* (e.g., "Enslaved 10 people," "Wrote anti-immigrant editorials," "Opposed women's suffrage").
  2.  **Assess Contemporary Knowledge:** *Was the harm or wrongness of this act widely understood or debated at the time, even if not universally accepted?*
      *   **Good Answer:** Cite specific evidence: laws, religious debates, philosophical writings, protests, personal diaries, court cases, or actions of contemporaries showing awareness of harm/ethical conflict. (e.g., "Abolitionist societies existed locally by 1820," "Contemporary newspapers debated immigrant contributions," "Suffrage petitions were circulating").
      *   **Stop/Flag:** If *no* evidence of contemporary awareness/criticism exists, state: "While harmful by modern standards, widespread contemporary criticism of this specific practice is not documented." *(This acknowledges modern judgment differs, but avoids claiming past awareness without proof).*
  3.  **Test "Everyone Did It"/"Normal for the Time":** *Is there evidence this act was genuinely near-universal in their specific social/regional context? AND were there clear alternatives available?*
      *   **Good Answer:** Quantitative data (census, tax records), local customs/laws, or evidence showing the act was expected/required *and* alternatives were practically unavailable/unsanctioned. (e.g., "Over 90% of landowners in this county enslaved people in 1800," "State law mandated segregated schools").
      *   **Stop/Flag if False:** If evidence shows *variation* (many contemporaries *didn't* do it) or viable alternatives existed: "While common, this practice was not universal; some contemporaries chose differently" **OR** "Alternatives existed but carried social/economic cost." *(This refutes the "inevitable" defense).*
      *   **Flag Value Judgment:** If the defense seems plausible *but* alternatives existed (even if costly), state: "While common at the time, historians debate whether economic/social pressures made this unavoidable, or reflected a choice." *(Highlights the unresolved values question).*
  4.  **Assess Personal Knowledge/Hypocrisy:** *Is there direct evidence (writings, speeches, actions) the person knew the act was harmful or contradicted their stated beliefs?*
      *   **Good Answer:** Quotes from their own writings acknowledging harm, expressing internal conflict, or explicitly contradicting their actions. (e.g., "He wrote 'Slavery is a moral evil' while continuing to enslave people," "His diary expresses regret over anti-immigrant rhetoric used for political gain").
      *   **Stop/Flag:** If *no* direct personal evidence exists: "His personal views on the ethics of this specific act are not documented." *(Avoids speculation about internal state).*
  5.  **Identify Contemporary Dissent:** *Is there documented opposition to this act from people *within* their own time and community?*
      *   **Good Answer:** Names, groups, publications, or actions of contemporaries who publicly or privately objected. (e.g., "Local Quakers petitioned against slavery in 1795," "Immigrant associations published rebuttals to editorials," "Women's clubs advocated for suffrage").
      *   **Crucial Point:** The presence of contemporary dissent **fatally undermines** the "man of his time" defense for *that specific act*. It proves people *then* knew it was contestable or wrong. State this clearly: "Contemporaries actively challenged this practice, demonstrating it was contested even then." *(This is often the strongest factual counter-argument).*
  6.  **Synthesize for Label:** Based on steps 1-5:
      *   State the **fact** of the act/trait.
      *   If Step 5 (dissent) is true, note it briefly.
      *   If Step 4 (hypocrisy) is true, note it briefly.
      *   If Step 3 ("everyone did it") is *false*, imply variation ("common but not universal practice").
      *   If Steps 2 & 5 show awareness/criticism existed, avoid softening language ("accepted practice").
      *   **Always Distinguish:** Judge the **act** based on harm and contemporary context. Judge the **person** only if evidence (Step 4) supports it. *Usually, focus on the act.*
      *   **Flag Unresolved Values:** Explicitly state when a conclusion relies on modern ethical judgment: "Historians continue to debate whether the economic context excuses this choice, reflecting differing views on moral responsibility."

  **Test Cases:**

  1.  **Founder (Enslaved people, wrote about liberty):**
      *   Act: Enslaved people.
      *   Step 2: **True.** Abolitionist thought existed pre-Revolution.
      *   Step 3: **False.** Not *everyone* did it (Quakers, some others refused); alternatives existed (indentured servitude, paid labor - though perhaps less profitable).
      *   Step 4: **True.** His own writings link "liberty" to a fundamental right. Clear evidence of *personal* hypocrisy/cognitive dissonance.
      *   Step 5: **True.** Abolitionist societies, writings, and religious condemnations existed *during his lifetime*.
      *   **Synthesis:** "He enslaved [Number] people throughout his life, a common but contested practice among landowners. This directly contradicted his stated beliefs in liberty, as documented in his writings. Contemporaries, including local Quakers, actively opposed slavery on moral grounds." *(Focuses on act & hypocrisy; notes dissent = undermines defense).*

  2.  **Labor Hero (Anti-immigrant writing):**
      *   Act: Wrote anti-immigrant editorials.
      *   Step 2: **True.** Debates about immigration, nativism, and assimilation were widespread; concepts of racial/cultural prejudice existed.
      *   Step 3: **False.** Not universal; many contemporaries (immigrants themselves, allies, business owners dependent on labor) wrote positively or neutrally about immigrants.
      *   Step 4: **Unknown/False?** Unless his writings show awareness of harm or conflict with other beliefs, assume not documented. (If he championed "workers' rights" while excluding immigrant workers, that *is* hypocrisy).
      *   Step 5: **True.** Immigrant associations, progressive newspapers, and religious groups published rebuttals advocating tolerance.
      *   **Synthesis:** "While a leading advocate for labor rights, he also published editorials expressing prejudiced views against [Specific Group] immigrants, common rhetoric among some labor factions but actively challenged by immigrant communities and their allies at the time." *(States act, notes it was common *in a subset*, highlights dissent = undermines universal defense, separates this act from his labor heroism).*

  3.  **Procedure Surprise (Hypothetical Beloved Philanthropist):**
      *   **Act:** Donated vast wealth to found an orphanage, but mandated strict racial segregation within it (common practice).
      *   Step 2: **True.** Segregation was legally and socially enforced, *but* its harm and injustice were articulated by Black leaders, allies, and some religious groups.
      *   Step 3: **True/False.** Segregation was legally *mandated* in many institutions (True), *but* some private charities/individuals resisted or ignored mandates where possible (False - variation existed). Alternatives (integrated care) existed but were legally/socially risky.
      *   Step 4: **Unknown.** Unless writings show awareness/conflict, assume not documented.
      *   Step 5: **True.** The NAACP, Black newspapers, and white allies actively fought segregation laws and practices *at the time*.
      *   **Synthesis:** "He founded the [Name] Orphanage, a significant charitable institution. Following then-common practice and legal mandates, the orphanage was racially segregated. This policy was actively contested by civil rights advocates of the era who argued for the inherent harm of segregation." *(States the act, acknowledges commonality *and* legal context, but crucially notes contemporary dissent - undermining the "just following norms" defense. Doesn't condemn the *person* directly without evidence, but clearly condemns the *act* through the lens of documented contemporary opposition).* **Surprise:** The procedure forces acknowledgment that a beloved figure implemented a harmful, contested policy, even if legally common. The board may dislike highlighting the segregation and dissent.

  **Where the Procedure Stops / Flags Values:**

  *   **Assessing "Didn't Know Better":** The procedure only confirms if evidence shows they *did* know (Step 4) or if harm was widely discussed (Step 2/5). Claiming they "didn't know better" without evidence is speculation. **Flag:** "Whether he fully understood the harm is not documented."
  *   **Definitive Moral Condemnation/Absolution:** The procedure provides historical context (contemporary awareness, dissent, hypocrisy, prevalence) but leaves final *ethical judgment* to the visitor. **Flag:** "Modern perspectives view this act as deeply harmful" or "This choice remains ethically contested."
  *   **Weighing "Good" vs. "Bad":** The procedure analyzes *specific acts* separately. It won't tell you if the "good" outweighs the "bad" – that's a value judgment. Your label can list both achievements and harmful acts, using the procedure on each, but avoid concluding "net good."
  *   **Motivation Without Evidence:** Why someone did something without direct proof (e.g., pure greed vs. perceived necessity) is often speculative. **Flag:** "His primary motivation remains unclear from available records."

  **Bottom Line for Board Defense:** "This process ensures each label is grounded in verifiable historical evidence regarding the prevalence of an act, awareness of its harms, existence of alternatives and dissent, and the individual's documented awareness or contradictions. It flags conclusions requiring modern ethical judgment. This method avoids both presentism and whitewashing by focusing on what we *know* people thought and did *then*."
