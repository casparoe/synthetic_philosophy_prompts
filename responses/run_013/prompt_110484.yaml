prompt: |-
  I dont have any academic background, I just read a lot on my own, and I've fallen into a hole about the handicap principle and the whole costly signaling business — peacock tails, brightly coloured frogs advertising how poisonous they are, people explaining religion and charity and enormous weddings as ways of burning resources so that others will believe you. The more I read the more I think there are two or three different theories wearing the same coat, and that the label gets slapped onto any behaviour that looks wasteful after the fact. My flatmate says that's because the whole thing is unfalsifiable and I half believe her. Before I try to work out who's right in any particular case, I want the spec — good enough that I could look at a case I've never read about and say whether the account covers it or not. So write me the list of things any account of honest communication between creatures whose interests only partly overlap has to get right: the cases it has to handle (the peacock, the poison frog, the honest-without-cost stuff like body size or a deep voice that anyone can just read off, the human cases where the audience is mates and rivals and allies at once), the distinctions it can't collapse (between a signal and a mere cue, between a cost that's a flat waste and a cost only some can afford, between advertising your quality and advertising your commitment), and the results it can't contradict (that selection doesn't keep paying for pure waste, that the receiver needs a reason to respond and not only the sender a reason to signal). For each item, tell me the case or observation that puts it on the list, and say whether it's something any decent account needs or just something one camp happens to want.

  Then the part I actually care about: tell me which items can't all be satisfied at once. If the list is secretly inconsistent — say, if being general enough to cover the free honest cues makes the whole thing vacuous, or if the demand that the account name the cost in advance fights with the demand that it cover the human cases where anything expensive can be relabelled — then I want that said out loud, because then the list is itself the answer and I can stop hunting for the one true theory. Also tell me which single requirement does the most work in ruling candidates out, and which requirement you'd drop first if you had to. No reading list please, I only want the spec. A table is fine.
reasoning: |-
  Okay, the user is diving deep into the handicap principle and costly signaling theory. They're self-taught, so they might not have formal training in evolutionary biology, but they've clearly done a lot of reading. Their main confusion is whether there are multiple theories under the same umbrella and if the concept is unfalsifiable. They want a clear framework to evaluate any signaling account themselves.

  First, I need to address their core request: a list of essential criteria any theory of honest signaling must meet. They mentioned specific examples like peacocks, poison frogs, and human behaviors like weddings. They want distinctions between signals vs. cues, types of costs, and what the theory can't contradict. Also, they’re concerned about internal inconsistencies in the requirements.

  The user’s flatmate thinks the whole thing is unfalsifiable, which is a valid critique. The user seems to be looking for a way to test theories themselves. Their deeper need might be to resolve their confusion without getting lost in academic debates. They want practical tools to assess any signaling claim.

  I recall that the handicap principle, proposed by Amotz Zahavi, suggests signals must be costly to be honest. But there are nuances. For instance, some signals are "indexes" (unfakeable due to physical constraints) like a frog's bright color being linked to its toxicity. Others are "conventional signals" where the cost maintains honesty, like peacock tails. Human cultural signals add complexity because costs can be arbitrary (e.g., expensive weddings).

  Key points to cover:
  1. **Cases to handle**: Peacock tails (sexual selection), poison frogs (aposematism), unfakeable cues (deep voice), and human socio-cultural signals (multi-audience).
  2. **Distinctions**: Signals vs. cues, types of costs (waste vs. affordability), quality vs. commitment signals.
  3. **Non-contradiction**: Natural selection avoids pure waste, receivers must benefit from responding.

  Potential conflicts:
  - **Generality vs. Precision**: Including indexes (no cost) might make the theory too broad. If every honest trait is a "signal," the term loses meaning.
  - **Pre-specified Costs vs. Cultural Relativity**: In human contexts, costs are culturally defined. Requiring costs to be pre-specified clashes with the flexibility of cultural signals.
  - **Receiver Benefit vs. Complexity**: In multi-party interactions (like human societies), the receiver's benefit isn't always clear-cut. Allies and rivals complicate the cost-benefit analysis.

  The most constraining requirement might be **Receiver Benefit Requirement**. Without it, any costly behavior could be labeled as signaling, leading to unfalsifiable claims. For example, explaining extravagant weddings as signaling requires showing how attendees benefit from believing the signal.

  If I had to drop one requirement, it might be **Pre-specified Cost Constraint**. Human cultural signals often assign costs arbitrarily. Insisting on pre-specified costs could exclude valid examples where the cost is socially constructed.

  The user’s suspicion of unfalsifiability is spot-on. The key is whether a theory can make testable predictions. For instance, if a signal's cost doesn't correlate with the advertised quality, the theory should be questioned. But in cultural contexts, this is harder to test.

  In conclusion, the list reveals tensions between biological and cultural applications. The user can use these criteria to dissect any signaling claim, checking for gaps like missing receiver benefits or conflated signal types. This framework empowers them to evaluate theories without needing a definitive "one true" answer.
answer: |-
  Here's the specification ("spec") for evaluating any account of honest signaling via costs (handicap principle/costly signaling) across biological and human domains. The list is built from core conceptual demands derived from evolutionary logic and empirical observations, not factional preferences. Items marked **CORE** are non-negotiable for any minimally decent account; others are crucial but potentially negotiable depending on the scope. Conflicts are highlighted.

  **The Essential List: Requirements, Cases, Distinctions, and Constraints**

  | Item                                     | Type                       | Why It's Needed (Case/Observation)                                                                 | Core/Negotiable? | Conflicts With...                          |
  | :--------------------------------------- | :------------------------- | :------------------------------------------------------------------------------------------------- | :--------------- | :----------------------------------------- |
  | **1. Define "Signal" vs. "Cue"**         | **Distinction**            | **Frog's bright color (signal) vs. a deep voice (cue).** Signals *evolved to influence* receivers; cues are merely informative byproducts. Must prevent labeling *everything* as a signal. | **CORE**         | Generality (Item 4) if definition is too loose. |
  | **2. Explain Honesty Maintenance**       | **Mechanism Requirement**  | **Peacock's tail:** Why isn't cheating (dull but healthy, or bright but sickly) evolutionarily stable? Requires a mechanism preventing deception. | **CORE**         | Pure Waste Prohibition (Item 9) if mechanism *is* pure waste. Indexes (Item 6) bypass this need. |
  | **3. Specify the Cost**                  | **Mechanism Requirement**  | **Peacock's tail (production/maintenance cost), Human charity (resource/opportunity cost).** Must identify *what* is costly, *how* it's paid, and *who* pays it (sender, receiver, both). | **Contextual**   | Human Relabeling (Item 11), Pre-specified Cost (Item 12). Hard in human culture. |
  | **4. Generality Requirement**            | **Scope Requirement**      | **Must cover poison frogs (defense), peacocks (mating), human status (multi-domain).** Theory shouldn't only work for sexual selection. | **CORE**         | Precision (Item 8), Index Distinction (Item 6) - risks vacuity if *too* general. |
  | **5. Receiver Benefit Requirement**      | **Constraint**             | **Peahen mating with a healthy mate, bird avoiding a toxic frog.** Receiver *must* gain fitness/relevant benefit from responding (e.g., better mate, avoiding poison). Prevents "signaling for signaling's sake". | **CORE**         | Multi-party Complexity (Item 10) - benefit can be murky. **Most important for ruling out unfalsifiable junk.** |
  | **6. Index Distinction**                 | **Distinction**            | **Frog's toxicity/brightness link, body size/deep voice.** Indexes are unfakeable due to physical constraints. *Costly signaling isn't needed here.* Must not conflate with costly signals requiring strategic investment. | **CORE**         | Costly Signal Definition (Item 2,3) - indexes are honest *without* strategic cost. |
  | **7. Quality vs. Commitment Distinction**| **Distinction**            | **Peacock tail (quality/genes) vs. Expensive wedding (commitment to alliance/investment).** Signals can advertise inherent traits *or* future behavioral intentions. Mechanism/cost may differ. | **Highly Useful**| Often collapsed, leading to muddy explanations. |
  | **8. Precision Requirement**             | **Constraint**             | **Peacock tail size/quality correlation.** Signal should correlate reliably with the underlying trait/intent being advertised (within the model's assumptions). | **CORE**         | Generality (Item 4), Human Relabeling (Item 11) - correlation can be weak/noisy in practice. |
  | **9. Pure Waste Prohibition**            | **Constraint**             | **Evolutionary logic (Fisherian runaway is *disfavored*).** Selection won't maintain signals *solely* because they are wasteful; cost must *do* something (enforce honesty, be an index). | **CORE**         | Costly Honesty Maintenance (Item 2) - if the *only* function of cost *is* waste, this is violated. |
  | **10. Multi-party Complexity**           | **Case Requirement**       | **Human status signals (weddings, religion):** Audience includes potential mates, allies, rivals, kin simultaneously with conflicting interests. Must handle conflicting receiver benefits/costs. | **Crucial for Humans** | Receiver Benefit (Item 5), Cost Specification (Item 3) - becomes extremely complex. |
  | **11. Human Relabeling Problem**         | **Constraint**             | **Anything expensive (art, education) *can* be labeled a signal post-hoc.** Theory must avoid arbitrary designation; needs criteria for *why* this specific cost signals *this* specific trait. | **Critical Test**| Cost Specification (Item 3), Precision (Item 8), Falsifiability. |
  | **12. Pre-specified Cost Constraint**    | **Methodological Demand** | **Avoids "just-so" stories.** A good account should predict *what kind* of cost is necessary *before* observing the signal (e.g., cost must be condition-dependent for quality signals). | **Ideal but Tough** | Human Relabeling (Item 11), Cultural Arbitrariness - costs in humans are often culturally defined/symbolic. **Hardest for human cases.** |

  **Inconsistencies & Tensions:**

  1.  **Generality (Item 4) vs. Precision/Falsifiability (Items 8, 11, 12):** This is the core tension. Including indexes (Item 6) and diverse human signals (Item 10) makes the theory broadly applicable but risks vagueness. A theory general enough to cover unfakeable cues *and* culturally arbitrary costly rituals struggles to make precise, testable predictions about *which* costly behaviors are signals *of what* in novel human contexts without post-hoc rationalization (violating Item 11 & 12). This fuels the "unfalsifiable" critique.

  2.  **Index Distinction (Item 6) vs. Costly Signal Definition (Items 2, 3):** Accounts that *only* focus on strategic costs (like classic handicap) fail to explain honest cues like poison frog colors or deep voices. Accounts that lump indexes and costly signals together under "signaling" (often to be general - Item 4) obscure the crucial difference in mechanism (physical constraint vs. strategic investment), making the theory less powerful and potentially vacuous for explaining costly displays.

  3.  **Receiver Benefit (Item 5) vs. Multi-party Complexity (Item 10):** In simple dyads (peahen/peacock), benefit is clear. In human groups, a signal (e.g., lavish gift) might benefit the receiver (recipient gains resources), benefit the sender (status gain with onlookers), harm rivals, and be irrelevant to allies. Defining the "receiver" and the "benefit" becomes ambiguous, weakening the clarity of Item 5.

  4.  **Pre-specified Cost (Item 12) vs. Human Relabeling/Cultural Arbitrariness (Item 11):** Biological signals often involve physiologically "natural" costs (energy, predation risk). Human signals use culturally *defined* costs (money, time, specific rituals). It's often impossible to specify the "correct" cost *a priori* for human cultural signals because the cost *is* the arbitrary social convention. Demanding Item 12 here makes human signaling theories seem like post-hoc rationalization.

  **Key Takeaways:**

  *   **The Biggest Rule-Out:** **Receiver Benefit Requirement (Item 5).** Any account that cannot clearly articulate *why the receiver is selected to respond* (what benefit they gain) fails immediately. This is the primary guard against unfalsifiable "it's a signal!" claims for any costly behavior.
  *   **The First Requirement to Drop (If Forced):** **Pre-specified Cost Constraint (Item 12).** While ideal for rigor, it's the most difficult to satisfy universally, especially for human cultural signals where costs are socially constructed. Focusing on *condition-dependence* (can only the high-quality/committed afford it?) or *receiver benefit* is often more practical, even if less pristine.
  *   **The Core Inconsistency:** **The tension between Generality and Falsifiable Precision.** The desire for one unified theory covering poison frogs, peacocks, and potlatches clashes with the need for mechanisms specific enough to make testable predictions and avoid post-hoc storytelling. This *is* the answer you suspected: there isn't one seamless "true theory." Biological indexes, biological costly signals, and human cultural costly signals operate under different (though sometimes overlapping) evolutionary and mechanistic logics. The "spec" reveals that applying the *same* cost-enforced-honesty logic rigidly across all cases leads to contradictions or vagueness. **The list itself highlights why hunting for a single, universally consistent "handicap principle" is likely futile.** Use the list to dissect specific claims: Does it confuse a cue for a signal? Does it ignore the receiver's benefit? Does it claim cost ensures honesty without saying how? Does it work for *this* case but fail the frog or the wedding? That dissection *is* the power.
