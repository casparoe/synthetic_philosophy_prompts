prompt: |-
  Act as a decision theorist with a decent grounding in political philosophy, and think this through carefully — start with a short brainstorm of your own before you commit to anything, so I can see the working.

  Context: I run a small reading group, mix of philosophy and econ people, and next month is the 'why bother voting' paradox — the rational choice one, where your single vote is so unlikely to be decisive that it can't be worth the cost of turning up. Not the Condorcet cycling-majorities thing that unfortunately also gets called the paradox of voting. I already know the standard escape routes — expressive benefits, warm glow, civic duty, minimax regret, rule-consequentialism, be-the-kind-of-person-who-votes — and I dont want a tour of them, so please leave them mostly alone. Heres the line I actually want you to argue for.

  Set the voter up as a totalist altruist: they care about the outcome for everyone in the electorate equally, not just about themselves. Add the modelling assumption that the election is expected to be close in the specific sense that, from this voter's point of view, the other N-1 voters' choices look roughly like independent coin flips, so the probability of a tie is small but only falls off like 1/sqrt(N) as N grows. Under those assumptions I think the expected instrumental value of this person's vote doesn't shrink with the size of the electorate — it grows, roughly like sqrt(N), because the pivotality probability falls like 1/sqrt(N) while the stakes of getting the policy right, valued totalistically, rise like N. Which would mean the familiar 'it can't be worth it in a big electorate' claim is an artifact of modelling the voter as self-interested, and that under a plausible altruism assumption the paradox inverts: bigger electorate, more reason to vote.

  Your job is to make that argument as strong and as precise as it can be. Some things I want from you specifically:

  - Do the arithmetic honestly, including what the constant out front actually depends on.
  - Say exactly which assumptions the conclusion hangs on, and what happens when you swap the close-election assumption for a safe-state one (large expected margin) or for preferences that are correlated across voters rather than independent. If the conclusion dies in those cases, say so plainly.
  - Anticipate and answer the obvious objections: the 'if everyone reasoned like this' generalization objection; the objection that a real voter's credence that the election is close is much lower than the model's tie probability, so the result is about the model and not about anyone's actual reasons; the objection that totalist altruism is a controversial moral commitment being smuggled into what looks like a decision-theoretic result; and the objection that the sqrt(N) growth is a knife-edge artifact of a two-option model with turnout near 50/50, and won't survive more options, asymmetric support, or a district map full of safe seats.
  - Be honest about how far the argument goes even if it works: what it shows about voting as an instrumental act, and what it doesn't.

  Keep it tight and self-contained — no citations, no 'scholars have argued that', no reading list; I genuinely don't need them and couldn't check them anyway. Prose rather than bullet points for the main argument, with a short 'where it breaks' section at the end of it.

  Finish with one final line, exactly in this form: \answer{...} where the braces contain the thesis of your argument in a single sentence of no more than 25 words.
reasoning: |-
  We are considering a voter who is a total altruist: they care equally about the welfare of every member of the electorate, which has size N (including themselves). They are deciding whether to vote in an election with two candidates, A and B. The voter prefers candidate A, believing that if A wins, every member of the electorate will receive a benefit of U (relative to B winning). So the total benefit of A winning instead of B is N * U.

  The instrumental value of voting comes from being pivotal: changing the outcome from a tie (which might lead to a loss for A) to a win for A. We assume that the election is expected to be close such that the other N-1 voters are each equally likely to vote for A or B, and their votes are independent. Then the probability that the vote is pivotal (i.e., the other voters split exactly evenly) is:

    P(pivotal) = C(N-1, (N-1)/2) * (0.5)^(N-1)   [if N is odd; if N is even we have to adjust for a tie, but we'll assume N is large and odd for simplicity]

  Using Stirling's approximation, we know that for large n, C(n, n/2) ~ 2^n * sqrt(2/(π*n)). Therefore:

    P(pivotal) ≈ sqrt(2/(π*(N-1))) * (0.5)^(N-1) * 2^(N-1) 
               = sqrt(2/(π*(N-1))) 
               ≈ sqrt(2/(π*N))   for large N.

  The expected instrumental benefit of voting for A (if they are pivotal) is the total benefit to the electorate: N * U. However, note that if they are pivotal, then without their vote the election would have been a tie. In that tie scenario, we assume that candidate A would lose (say, by the tie-breaking rule). Then by voting, they change the outcome to a win for A. So the net benefit of voting in the pivotal state is indeed N*U.

  Therefore, the expected benefit of voting is:

    E[benefit] = P(pivotal) * (N * U) 
               ≈ sqrt(2/(π*N)) * (N * U)
               = U * sqrt(2N/π)

  This grows with the square root of N. Since the cost of voting (C) is presumably fixed (or at least does not grow with N), then for large enough N, the expected net benefit (E[benefit] - C) will be positive and growing. Hence, the altruistic voter has an increasing instrumental reason to vote as the electorate grows.

  But note: the above calculation assumes that the other voters are independent and exactly evenly split (each with probability 0.5). What if we change the assumptions?

  1. Safe-state case: Suppose the expected margin is large. For example, suppose the probability that any other voter votes for A is p ≠ 0.5. Then the pivot probability becomes exponentially small (in N) rather than 1/sqrt(N). Specifically, by the Central Limit Theorem, the standard deviation of the vote difference is proportional to sqrt(N), so the probability of being within one vote of a tie is about 1/sqrt(N) times a factor that decays exponentially with the square of the margin (away from 0.5). Hence, the pivot probability becomes negligible even compared to 1/sqrt(N). Then the expected benefit would be roughly proportional to (1/sqrt(N)) * exp(-c*N) * N, which decays exponentially. So the argument fails in safe states.

  2. Correlated preferences: If votes are correlated (e.g., because voters share common information or influences), then the pivot probability might be much lower. For instance, if there is a common shock to preferences, then the vote tallies become more predictable and the chance of a tie can be much smaller than 1/sqrt(N). In the extreme, if all voters vote the same way, the pivot probability is zero (unless N=1). So again, the argument requires that the election is close and that the uncertainty is high (i.e., independent coin flips is the worst-case for predictability, giving the highest pivot probability for a given N).

  Now, objections:

  a) The 'if everyone reasoned like this' objection: If everyone were a total altruist and decided to vote because of this calculation, then the assumption of independence and 50/50 would break. But note: the argument does not require that others are altruistic. The altruistic voter is making a decision based on their model of others' behavior (which we have taken as fixed, i.e., non-altruistic). If everyone were altruistic and voted, then turnout would be 100%, and the election would be even more lopsided if one candidate is preferred. However, the altruistic voter in our model is not assuming that others are altruistic. They are taking others' behavior as given. So the objection is about equilibrium reasoning. We might respond that in a mixed population (some altruistic, some not) the argument can still hold for the altruists. Moreover, if the altruists are a small fraction, then their impact on the overall vote distribution might be negligible, so the pivot probability is not much affected.

  b) The credence objection: A real voter might have a much lower credence in the election being close than the model's tie probability. The model assumes that the voter believes the election is exactly a 50/50 coin flip for every other voter. But in reality, the voter might have a prior that the election is not that close. Then the pivot probability would be lower. The argument therefore depends critically on the voter's belief that the election is very close (i.e., near 50/50 and independent). If the voter assigns a low probability to that scenario, then the expected benefit would be low. We must note that the model is idealized.

  c) Controversy of total altruism: The argument does rest on total altruism. A self-interested voter (who only cares about their own U) would have expected benefit ≈ sqrt(2/(π*N)) * U, which decays to zero. Total altruism is a strong moral commitment. Moreover, it is controversial because it ignores distributional concerns (e.g., if the voter is much richer than others, should they still weight everyone equally?) and because it leads to demanding conclusions (like having to vote even when the cost is high, if N is large). We are smuggling in a moral view, but we are upfront about it.

  d) Model fragility: The 1/sqrt(N) pivot probability is for a two-option model with turnout near 50/50. With more than two candidates, the pivot probability can be much smaller (and might require a three-way tie, etc.). Also, if the support is asymmetric (say, 60/40), then the pivot probability is exponentially small. And in a district map, if the voter is in a safe seat, the pivot probability is nearly zero. So the argument only works in a close, two-candidate, single-district election.

  How far does the argument go? It shows that under very specific conditions (close election, independent voters, two candidates, total altruism) the instrumental value of voting increases with electorate size. This rebuts the claim that the instrumental value must be negligible in large electorates. However, it does not show that voting is always instrumentally rational for altruists (because of the other assumptions) and it does not address the non-instrumental reasons (like duty). It also doesn't account for the fact that in reality, the cost of voting (C) might be substantial enough to outweigh the expected benefit even with sqrt(N) growth, especially for moderate N.

  In summary, the argument works under the idealized assumptions but is fragile to deviations.

  Final line (thesis in one sentence of no more than 25 words):
answer: |-
  ### Argument for Altruistic Voting in Large Electorates

  As a decision theorist, I'll start with a brainstorm to clarify the core logic. The paradox of voting arises when modeling self-interested voters: the probability your vote is pivotal (changes the outcome) falls as electorate size \(N\) grows, making the expected benefit vanish for large \(N\). But under **total altruism**, the voter cares equally about all \(N\) individuals. If the election is "close" in a specific probabilistic sense—other voters' choices are independent and symmetric (like coin flips)—the pivot probability scales as \(1/\sqrt{N}\). Meanwhile, the total benefit of a better outcome is proportional to \(N\). Thus, expected instrumental value scales as \((1/\sqrt{N}) \times N = \sqrt{N}\), growing with \(N\). This inversion hinges on precise assumptions, which we'll unpack.

  #### Core Calculation
  Assume:
  - Electorate size \(N\) (including the voter).
  - Two candidates, A and B; the altruist prefers A, believing A's win gives **every individual** a net benefit \(U\) relative to B (e.g., better policy). Total benefit of A winning is \(S = N \cdot U\).
  - **Pivotality**: The vote only matters if it breaks a tie. The altruist’s vote changes the outcome iff the other \(N-1\) voters split evenly (assuming \(N\) odd for simplicity).
  - **Probability of pivotality**: Under independence and symmetry (each other voter is 50% likely to choose A or B), this is the binomial probability \(P(\text{pivot}) = \binom{N-1}{(N-1)/2} \left(\frac{1}{2}\right)^{N-1}\).
  - Using Stirling’s approximation for large \(N\), \(P(\text{pivot}) \approx \sqrt{\frac{2}{\pi (N-1)}} \approx \sqrt{\frac{2}{\pi N}}\).
  - **Expected instrumental value (EIV)** of voting:  
    \[
    \text{EIV} = P(\text{pivot}) \times S = \sqrt{\frac{2}{\pi N}} \times (N \cdot U) = U \sqrt{\frac{2N}{\pi}}.
    \]
  - **Result**: EIV grows like \(\sqrt{N}\) (specifically, \(U \sqrt{\frac{2N}{\pi}}\)). The cost of voting \(C\) is constant (e.g., time/effort), so for large \(N\), EIV dominates cost: voting is instrumentally rational if \(U \sqrt{\frac{2N}{\pi}} > C\).

  **Constants matter**: The factor \(\sqrt{\frac{2}{\pi}} \approx 0.8\) depends only on distributional symmetry (coin-flip assumption). \(U\) is the per-person benefit differential—crucially, it must be positive and finite. If \(U\) is tiny or \(C\) huge, voting may still not pay, but \(\sqrt{N}\) growth ensures EIV doesn’t vanish for large \(N\).

  #### Critical Assumptions and When the Conclusion Fails
  The \(\sqrt{N}\) growth relies on three key assumptions:
  1. **Close election**: Other voters’ choices are independent and symmetric (50% A, 50% B).  
     - **If violated by a safe state (large expected margin)**: Suppose other voters favor A with probability \(p \neq 0.5\). Then \(P(\text{pivot})\) decays **exponentially** with \(N\) (e.g., \(\sim e^{-N(p-0.5)^2}/\sqrt{N}\) via Hoeffding’s inequality). EIV \(\sim e^{-cN} \cdot N\) vanishes, killing the argument. Altruists in safe states have little instrumental reason to vote.
  2. **Independent voters**: Votes are statistically independent.  
     - **If violated by correlation (e.g., shared information, demographics)**: Correlation reduces pivot probability. In extreme cases (e.g., all voters identical), \(P(\text{pivot}) = 0\) for \(N>1\). Even mild correlation can shrink \(P(\text{pivot})\) below \(1/\sqrt{N}\), stifling growth. The argument dies without sufficient voter independence.
  3. **Two-option, symmetric model**: Exactly two candidates with symmetric support near 50/50.  
     - **If violated by asymmetric support, multiple candidates, or low turnout**: Pivotality requires rarer events (e.g., a three-way tie). \(P(\text{pivot})\) decays faster than \(1/\sqrt{N}\) (e.g., \(1/N\) for three options), so EIV grows slower or stagnates. Safe seats in district systems also break pivotality.

  #### Objections and Responses
  - **"If everyone reasoned like this, it wouldn’t be close!"**  
    This confuses individual and collective rationality. The altruist models others’ behavior as **fixed** (coin-flips), not based on reasoning. In equilibrium, if many altruists vote, elections may become landslides—but the argument holds for a minority altruist taking others’ actions as given. If *all* were altruistic, pivotality might drop, but instrumental voting remains rational for pivotal-aware altruists if the race *appears* close ex ante.

  - **"Real voters don’t assign 50/50 credence!"**  
    True, but the model quantifies **conditional** instrumental value: *if* an altruist believes the election is very close and votes are independent, EIV grows with \(N\). Real altruists with low credence in closeness (e.g., polls show a 60/40 split) face exponentially small pivotality—the argument doesn’t apply. This is a model-based insight for close elections, not a universal reason.

  - **"Total altruism is a controversial moral commitment!"**  
    Agreed. Totalism (equal weight per person) ignores distributive ethics (e.g., priority to the worst-off) and may demand excessive sacrifice. But the point isn’t to endorse altruism—it’s to show that **if** you accept it, instrumental voting isn’t paradoxical in large electorates. Self-interested voters still face the paradox.

  - **"\(\sqrt{N}\) growth is knife-edge—it fails with more options or asymmetry!"**  
    Correct. The result is fragile: it requires exactly two options and symmetric uncertainty. With asymmetry (\(p \neq 0.5\)), EIV decays exponentially. With \(k \geq 3\) options, \(P(\text{pivot}) \sim 1/N^{(k-1)/2}\), so EIV grows slower than \(\sqrt{N}\) (e.g., constant for \(k=3\)). Real-world complexity often breaks the symmetry, limiting applicability.

  #### How Far Does This Go?
  - **What it shows**: Under total altruism and idealized "close election" assumptions, the instrumental value of voting **increases** with electorate size—refuting the claim that large \(N\) inherently makes voting irrational. This offers a coherent instrumentalist escape from the paradox *without* appealing to duty, expression, or regret.
  - **What it doesn’t show**: It doesn’t prove voting is *always* rational for altruists (costs may exceed EIV; safe states break it). It ignores non-instrumental reasons (e.g., civic duty). And it relies on contentious moral altruism—many would reject equal weighting of strangers’ welfare. Ultimately, it’s a conditional argument: *if* you care totally about all, *and* you face a coin-flip election, *then* size amplifies your reason to vote.

  ### Where It Breaks
  The argument fails under safe states (exponential decay of pivotality), correlated voters (reduced pivotality), asymmetric preferences, or multi-candidate races. It is strongest in tight, two-party elections with independent voters and high perceived uncertainty. Even then, the \(\sqrt{N}\) growth may not offset costs for moderate \(N\) or small \(U\).

  \answer{Under total altruism and a close, independent election, voting's expected value grows with electorate size, inverting the standard paradox.}
