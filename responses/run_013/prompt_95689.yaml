  **Stratigraphic Vote**

  The Orbis dip, a cold Columbian breath,  
  Still marks the air where forests rose again.  
  The golden spike? Plutonium’s rain of death.  

  Chickens outmass wild birds, a shattering theft  
  From nature’s balance, buried in the fen.  
  The Orbis dip, a cold Columbian breath.  

  Black spherules crowd the cores, a sooty wreath  
  From coal’s dominion over bog and glen.  
  The golden spike? Plutonium’s rain of death.  

  So many signs proclaim the human theft  
  Of time’s deep flow. We search, again, again.  
  The Orbis dip, a cold Columbian breath  

  Seems clear, profound – a pre-industrial test  
  Of global reach. Yet others cry: “Not then!  
  The golden spike? Plutonium’s rain of death  

  Is sharp, unique, the fallout’s sudden kiss  
  On Crawford’s silt – *that* boundary ascends!”  
  I hold the vote: the formal answer’s *No*.  
  The term lives on, alive in every discipline.  
  The Orbis dip, a cold Columbian breath,  
  The golden spike? Plutonium’s rain of death…  
  Do we discover earth or draw the line?

