prompt: |-
  I am a high school junior, and next month my school board votes on a policy that would require every student to lock their phone in a pouch for the entire school day starting in the fall, with no review date and no provision for changing course. I have five minutes at the meeting to argue that the board should adopt it differently. My case is Deweyan: a policy about how students learn is a hypothesis rather than a settled fact, the ends we aim at are properly held as ends-in-view and revised in light of what follows from them, and a school is genuinely democratic only insofar as the people who undergo the consequences of a decision take part in forming the problem, gathering the evidence, and judging the outcome. Write the speech. Please build it around one concrete proposal, namely that the policy be adopted as a single-semester experiment whose success criteria are fixed in advance and whose continuation is decided by a joint panel of students, teachers, and board members, since on the Deweyan view that structure is not a courtesy but the only way the board can be said to be inquiring at all. The room is mixed: three board members who want the vote finished, two teachers who have actually read Dewey, and several hundred students who will tune out anything that sounds like a textbook. I cannot claim the policy will obviously fail, appeal to students being right simply for being students, treat the majority vote as the end of the matter, or defer to expert judgment alone, and I do need to concede that if the evidence goes against us, we should accept it. About five minutes, written to be spoken aloud.
reasoning: |-
  Okay, the user is a high school junior preparing a five-minute speech to challenge their school board's proposed phone ban policy. They want to frame it using John Dewey's educational philosophy while proposing a concrete alternative: making the policy a single-semester experiment with joint evaluation. 

  Hmm, the constraints are tricky. The audience includes impatient board members, Dewey-literate teachers, and hundreds of students who'll disengage if it sounds academic. The speech must avoid claiming the policy will fail, appealing to student entitlement, or relying solely on majority vote/expert opinion. And crucially, it must embrace evidence-based outcomes.

  First, let's unpack the Deweyan angle. The key points seem to be: 
  - Policies as hypotheses needing testing
  - Ends as flexible "ends-in-view" 
  - Democratic participation of those affected
  The structural proposal brilliantly embodies this - the joint panel isn't just fair but epistemically necessary for genuine inquiry.

  *scratches head* Biggest challenge is making Dewey accessible without dumbing it down. Maybe anchor it in shared frustration? Students hate being talked about without being heard; teachers hate top-down mandates. The "experiment" framing could unite them.

  Ah! Should lead with the concrete alternative immediately - no one listens if the solution comes after philosophy. Present the panel not as compromise but as smarter governance. The evidence concession is strategic; it disarms opposition by showing intellectual honesty.

  *checks watch* Timing matters. Five minutes is ~650 words. Need to: 
  :00-:50 Hook (shared concern about learning)
  :50-2:30 Dewey made practical (policy=hypothesis → experiment)
  2:30-4:00 Concrete proposal + panel composition 
  4:00-5:00 Call to action (vote for real inquiry)

  Student language tips: 
  - Say "lock us out" not "prohibit usage" 
  - "Trial run" > "pilot program" 
  - Mention TikTok but pivot to learning
  Teachers/board nods: 
  - "Measurable goals" 
  - "Accountability to data"
  Dewey bait: 
  - "Ends-in-view" (but explain instantly) 
  - "Consequences → voice" equation

  *winces* Must avoid landmines: 
  No "you'll regret this" predictions 
  No "students know best" appeals 
  Save democracy arguments for structure, not outcome

  Final polish: The "not a courtesy but how we know" line crystallizes everything. And ending on "let's find out together" makes it collaborative rather than confrontational. Smart kid.
answer: |-
  ## The Five-Minute Speech: A Smarter Experiment for All

  **(Start with calm conviction, addressing the board directly, then include the room)**

  Board Members, Teachers, Fellow Students:

  We all share one goal: creating the best possible learning environment. And we all know phones can be a distraction. The proposed policy aims to solve that problem. I’m not here to say phones belong in every classroom every minute. **But a policy dictating *how* we learn isn’t a final verdict – it’s a starting point. It’s a hypothesis: "Locking phones away all day will significantly improve focus and learning for everyone."**

  Here’s the thing about hypotheses: they need testing. Not just *any* testing, but *rigorous* testing where we actually learn something meaningful. A permanent policy, locked in with no review, no chance to adapt? That’s not an experiment; that’s a decree. It assumes we already have all the answers. We don’t.

  The philosopher John Dewey, who deeply shaped modern education, argued that true learning – and true democracy – happens through *experience* and *inquiry*. **For a policy like this to be more than just an order, it needs to be treated as an experiment from the start.** That means:

  1.  **Defining Success *Beforehand*:** What *exactly* are we trying to achieve? Is it fewer disruptions? Higher quiz scores? Improved well-being reports? Better participation? We need clear, measurable goals *now*, not vague feelings later.
  2.  **Setting a Review Point:** We need a chance to look at the evidence. Does locking phones away *all day* actually achieve those goals? Are there unintended consequences – maybe making after-school coordination harder, or increasing anxiety for some, or hindering specific learning tools in certain classes? We won’t know unless we look.
  3.  **Including Those Affected:** Most importantly, Dewey taught that people who live with the consequences of a decision *must* be part of evaluating it. Why? Because their experience *is* the evidence. Their insights reveal the real-world impact a textbook or a distant policy can't see.

  **So, my concrete proposal: Let’s run this as a genuine, single-semester experiment.**

  *   **Adopt the phone pouch policy for Fall Semester only.**
  *   **Define clear, measurable success criteria *before* school starts.** What metrics prove this works? (Attendance? Specific assessments? Climate surveys?)
  *   **Establish a Joint Review Panel for December.** This panel *must* include students, teachers, *and* board members – equally. Their task? Examine *all* the evidence: the hard data, the teacher experiences, and crucially, the student experiences. Did it work? How? For whom? Where did it fall short?
  *   **Let this panel recommend the path forward for Spring Semester and beyond.** Continue? Modify? Abandon? Their judgment, based on the evidence *they* gathered and analyzed together, should guide the Board's final decision.

  **This isn't just about being fair. On the Deweyan view, this structure isn't a courtesy – it's essential for genuine inquiry.** It transforms a top-down mandate into a shared learning process for the *entire* school community. The Board initiates the experiment, but the community – those who *live* it – helps gather the evidence and judge the outcome. *That’s* how we turn a hypothesis into real knowledge.

  To the Board: This approach strengthens your decision. It provides accountability to the data and the community you serve. If the evidence shows clear, overwhelming benefits, the case for continuing is undeniable. **And if the evidence shows mixed results, or serious drawbacks we didn't anticipate, we should be willing to adapt or change course.** Rigorous inquiry demands that.

  To my fellow students: This isn't about demanding phones back no matter what. It’s about demanding a *voice* in understanding if this solution actually works the way it's supposed to, and if the cost is worth it. It’s about making sure our real experiences count as evidence.

  To the teachers: This collaborative review respects your professional judgment *and* your firsthand observations in the classroom, alongside the data and student perspectives.

  **A one-size-fits-all, permanent solution pretends education is static. It’s not. Let’s treat this policy for what it is: a significant experiment in how we learn. Let’s run it right. Let’s define success, gather evidence from everyone involved, and decide the future together, based on what we actually learn.**

  Vote for a one-semester experiment with a Joint Review Panel. Let’s find out what works, together. Thank you.

  **(End confidently, meeting the Board's gaze)**
