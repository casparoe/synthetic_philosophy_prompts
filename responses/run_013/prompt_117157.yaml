prompt: |-
  My two flatmates, Sam and Nadia, had a argument at breakfast last week about a diet study we'd all read, and I still can't work out who had the better of it, so I'm outsourcing it.

  (1) Sam said she wasn't going to believe it, because she can't check it herself and neither can the person who wrote it up. Her rule: if you can't verify something for yourself, you shouldn't believe it.
  (2) Nadia said that rule would mean believing nothing. Almost everything you know came from other people. You don't remember being born; you know your own birthday because your mum told you. If you only get to believe what you've verified yourself, you don't know any history or geography or whats in your own medical file. Which is absurd. So there has to be a default: you're allowed to believe people unless you've got some reason not to.
  (3) Sam said that's not what she's doing. She doesn't trust people at random, she trusts people who've earned it — her mum's been right about things before, and the birthday's on a certificate anyway. She checks the weather app against the window often enough to know it's decent. She only believes a source once it's got a track record, or once it's the kind of thing thats reliably been right. Blind faith isn't the same thing.
  (4) Nadia said the track record is made of stuff other people told you. Who told you your mum's been right before? Who told you the certificate is a birth certificate and not a receipt? And when you "check" the weather app against the window, you're trusting your own memory of what the app said — which you didn't verify either — and you learned what rain is from other people in the first place. Also, little kids can't be doing track record assessments, and they end up knowing plenty. Her rule isn't "believe everyone," it's "believe unless there's a reason not to," and there's obviously a reason not to believe the bloke on the corner shouting that the moon landings were faked.
  (5) Sam said fine, but then where does the reason not to come from? If it comes from evidence, that's just her own view again. If it doesn't, then "reason not to" is whatever Nadia feels like calling a reason. And she wanted to know how the default handles this: does it mean she should believe Nadia when Nadia says her knee hurts? Sam has zero evidence about Nadia's knee. If yes, fine, but that seems like a different kind of thing from believing a stranger about a diet study, and she wants to know what the difference actually is.
  (6) Nadia said the difference is that trusting people gets updated as it goes — when it pans out or doesn't, that's information, whereas Sam's version wants the update before the trust, which you can never have. And the knee is different because of how the words work, not because Nadia's earned anything.

  Neither of them will budge and I honestly can't referee it. Can you go through it move by move and say who's right about what, and where each of them is actually going wrong — not just who's louder. At the end, say which of them is closer to right overall, and what the thing is that they're both missing, if there is one. One thing I'd especially like answered: whether there's a real difference between trusting someone about a fact and trusting an expert about something only they can check, because that's where I got lost.

  Also, tell me how confident you are in the verdict, and flag the single point you're least sure about.
reasoning: |-
  Hmm, the user presents a fascinating philosophical debate between their flatmates Sam and Nadia about the epistemology of trust. They've outlined six moves in the argument and want me to analyze who has the better position at each step, identify overall strengths, and resolve a specific question about trusting facts versus expert testimony.

  Breaking this down systematically. The core tension is between Sam's verificationism ("trust only what you can verify") versus Nadia's default trust ("trust unless contradicted"). Both positions have merit but also clear weaknesses when pushed to extremes.

  For move (1): Sam establishes a reasonable-sounding principle but immediately shows its impracticality. Complete self-verification would paralyze modern life - we couldn't function if we personally verified every fact. Nadia effectively exposes this in move (2) by listing examples of necessary trust (birth records, medical files). Score this round to Nadia.

  In move (3): Sam adjusts wisely by introducing earned trust through track records. This pragmatic approach mirrors how we actually navigate the world - we trust weather apps because they've proven reliable, not blindly. But Nadia counters brilliantly in move (4) by pointing out that even "track records" rely on prior trust (who told you the certificate was real? Who taught you what rain is?). Her observation about children's learning is particularly strong - toddlers don't audit credibility before trusting caregivers. Another point to Nadia here.

  Move (5) reveals Sam's strongest challenge: if trust is the default, what constitutes valid "reasons not to believe"? Sam rightly notes this could become arbitrary ("whatever Nadia feels like"). Her knee pain example is excellent - it distinguishes between verifiable claims and personal experiences. Nadia's response in move (6) feels weaker - her "words work differently" handwave doesn't resolve the core issue of how we gatekeep trustworthy claims. Advantage Sam this round.

  On the specific question about trusting facts vs experts: this is where contextual epistemology matters. Trusting a friend's knee pain relies on different mechanisms (empathy, common experience) than trusting a diet study (methodology, institutional credibility). Sam is closer on empirical claims; Nadia on interpersonal testimony.

  Overall verdict: Nadia's position is more philosophically coherent for daily life, but Sam exposes its vulnerabilities. They're both missing that trust operates on spectra - we calibrate credulity based on stakes, domain, and fallback verification options. My confidence is high except regarding how precisely we define "reasons not to trust" - that remains philosophically thorny.

  For the user's benefit, I'll structure the response to mirror their move-by-move request while adding clear verdict markers. The key insight is that epistemology isn't binary - we need both principles, applied contextually.
answer: |-
  Here's a move-by-move analysis, verdict, and answers to your specific questions:

  **Move-by-Move Analysis:**

  1.  **Sam's Opening:** Her principle ("only believe what you can personally verify") is **epistemologically strict but impractical**. While skepticism is healthy, this *absolute* rule is self-defeating. She *can't* verify the rules of logic, her own senses, or her memory – all foundations of knowledge. *Sam is going wrong* by proposing an impossible standard. **Advantage: Nadia.**
  2.  **Nadia's Response:** She correctly demolishes Sam's absolute rule, highlighting its absurd consequences (no history, geography, personal history). Her proposed default ("trust unless reason not to") is **pragmatic and reflects how humans actually acquire knowledge**. *Nadia is going wrong* by slightly overstating "believing nothing" (Sam *could* believe verified sense data, math, etc.), but her core point is sound. **Advantage: Nadia.**
  3.  **Sam's Refinement:** Sam adapts well. Shifting to "trust based on track record" is **far more reasonable and realistic** than her initial absolute rule. This mirrors how we assess experts, news sources, and friends. *Sam is going wrong* by implying this entirely escapes Nadia's critique – the *foundation* of that track record still relies on initial trust. **Advantage: Sam.**
  4.  **Nadia's Counter:** She lands a powerful blow. Sam's "track record" **depends on prior layers of unverified trust** (who told you Mum was right? Who defined "rain"?). Her point about children is strong – foundational learning *requires* initial trust without verification. Her clarification ("believe *unless*...", not "believe everyone") is crucial. *Nadia is going wrong* by slightly downplaying that track records *do* matter *after* the initial trust is established. **Advantage: Nadia.**
  5.  **Sam's Challenge:** Sam asks the **critical question**: Where do "reasons not to believe" come from? If from evidence, it risks circularity or relying on Sam's own principle. If not, it seems arbitrary. Her knee pain example is excellent – it highlights the **difference between trusting testimony about objective facts vs. subjective experiences**. *Sam is going wrong* by not acknowledging that "reasons not to" often come from inconsistency with *other* trusted sources or established principles (coherence), not necessarily direct verification. **Advantage: Sam.**
  6.  **Nadia's Reply:** Her point about trust being **iterative and updated** ("updated as it goes") is **essential and a strength** of her position. Trust *is* dynamic. Her claim that Sam wants "update before trust" is accurate – Sam demands verification *before* any trust is granted, which is impossible for foundational knowledge. Her point about the knee ("how the words work") is **weak and evasive**. She correctly identifies that knee pain testimony isn't about an objective fact Sam can verify, but she fails to articulate *why* that difference matters to the default principle or how it avoids arbitrariness. *Nadia is going wrong* by not adequately answering Sam's challenge about the source of "reasons not to" and fumbling the knee example. **Advantage: Draw (Nadia strong on iteration, weak on knee/foundation of reasons).**

  **Overall Verdict: Nadia is closer to being right.** Her pragmatic default of "trust testimony unless there's a reason not to" is the only workable foundation for human knowledge acquisition, as demonstrated by her critique of Sam's initial rule and the point about children. Sam effectively exposed vulnerabilities in defining "reasons not to" and highlighted important distinctions (like the knee), but her core principle remains too restrictive to be tenable as a starting point.

  **What They're Both Missing:**
  *   **Contextualism:** The level of scrutiny and the burden of proof shift dramatically based on context. Trusting your flatmate about the milk being off requires almost no justification. Trusting a stranger's claim about a miracle cure requires significant justification. Neither fully grapples with how context dictates the application of their rules.
  *   **Degrees of Belief:** Belief isn't always binary. We often hold beliefs with varying degrees of confidence based on the source and evidence, rather than absolute "believe/don't believe."
  *   **The Social Nature of Knowledge:** Knowledge isn't built atomically by individuals verifying everything. It's a collective, social endeavor built on networks of trust, institutions, and methodologies (like science) designed to generate reliability *despite* individual limitations. Both focus heavily on individual sources.

  **Answering Your Specific Question: Trusting Facts vs. Experts**

  *   **Trusting an Expert About Something Only They Can Check:** This relies heavily on **institutional credibility and methodology**. We trust a radiologist's report on our X-ray because:
      *   We trust the medical training and certification system.
      *   We trust the scientific principles underlying radiology.
      *   We trust the hospital/clinic's quality control.
      *   We (implicitly) trust the track record of medicine improving lives. *The trust is in the system and process that produced the expert and their finding.*
  *   **Trusting Someone About a General Fact:** This relies more on **source reliability and coherence**. We trust a news report about a distant event based on:
      *   The news outlet's track record for accuracy.
      *   Corroboration from other sources.
      *   Lack of obvious motive to deceive *us* specifically.
      *   Coherence with other things we believe. *The trust is more directly in the source conveying the information.*

  **The Key Difference:** Trusting an expert about a private fact often involves trusting a **process or system** you believe is designed to produce reliable results in that domain, even if you can't personally verify *this specific instance*. Trusting a general fact involves trusting a **source's reliability and the coherence of the information** within your existing web of beliefs. Nadia's "default trust" applies to both, but the *reasons why* we accept or reject the trust claim differ significantly, as Sam's knee question highlights. Trusting the knee pain is trusting the speaker's sincerity and your understanding of language/concepts, not a system designed for verification.

  **Confidence & Uncertainty:**

  *   **Overall Verdict Confidence:** **High (8/10)**. Nadia's position is fundamentally necessary for human knowledge; Sam's initial principle is demonstrably unworkable, and her refined position still relies on Nadia's foundation.
  *   **Least Sure Point:** **The precise source and nature of "reasons not to believe" (Sam's Move 5 challenge).** While Nadia's iterative update is crucial, articulating a non-arbitrary, non-circular foundation for the *initial* "reasons not to" that doesn't subtly rely on *some* background trust or coherence is philosophically challenging. Is it purely coherence with other trusted beliefs? Innate skepticism towards certain claims? This point remains philosophically contested.
