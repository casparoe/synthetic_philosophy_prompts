  - Self-reinforcement over time without actual evidence
  - Increasing irreversibility due to perceived consensus
  - Distributed nature across non-cohesive groups

  Reviewing concepts: 
  - Pluralistic ignorance fits well—people privately doubt but assume others agree, creating false consensus. 
  - Institutional inertia describes the persistence aspect, especially in organizational contexts. 
  - Path dependence explains the lock-in effect, where early accidents become entrenched. 
  - Normative social influence captures the pressure to conform to perceived norms. 

  The combination of pluralistic ignorance and institutional inertia seems most comprehensive. It covers the silence-as-misinterpreted-agreement dynamic and the self-perpetuating nature. The distributed aspect is addressed by how these phenomena can scale beyond tight groups. 

  To test boundaries: 
