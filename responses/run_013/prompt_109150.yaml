  - Information cascades differ because they involve sequential rational updates; here, no updating occurs. 
  - Groupthink requires in-group cohesion; this works without it. 

  The user's request for "what would make it healthy" suggests practical application. The answer lies in mechanisms that surface dissent (e.g., anonymous feedback) or force re-evaluation (e.g., sunset clauses). 

  Proposing "inertial consensus" as a new term feels justified since existing terms require stitching together. The definition would center on false unanimity from misinterpreted silence, leading to entrenched practices without validation. Edge cases: 
