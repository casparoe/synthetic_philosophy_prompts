answer: |-
  This phenomenon you're describing is both fascinating and frustratingly common. It's more specific than the broad labels people have offered you, and I agree that "information cascade," "herd behavior," or even "groupthink" don't quite capture the mechanics you're seeing. What you've zeroed in on is a particular kind of **social proof illusion reinforced by silence and institutional inertia**. Let's carve it up.

  The core engine is this: **individuals mistake the *absence of dissent* for *positive evidence of correctness or consensus***. It's not that people are blindly copying a visible decision (like sheep seeing others run). It's that they observe *no one objecting* and interpret that silence *itself* as a meaningful signal. "If this were a bad choice," the unspoken reasoning goes, "someone smart would have spoken up by now. Since no one has, it must be okay." This creates a false sense of unanimity or justification where none was actively established. The silence isn't evidence of evaluation; it's evidence of *fear of being the outlier*, *assumption that evaluation happened upstream*, or simple *apathy*. Yet, it gets misinterpreted *as* evidence of evaluation.

  This misinterpreted silence then feeds **institutional inertia**. Once the choice or process exists, its mere existence becomes its primary justification. "We use X because we use X." "The deploy process is this way because it is this way." The historical accident or initial unexamined choice hardens into an unassailable norm. New entrants, seeing the established state and the *lack of visible debate*, assume the reasoning must be sound, buried somewhere in the past. The longer this goes on, the stronger the illusion becomes because: 1) The perceived consensus becomes more entrenched ("*Everyone* uses it!"), and 2) The cost of speaking up increases. Being the first dissenter against an apparently unanimous, long-standing norm feels risky and irrational, reinforcing the silence that started the cycle. It creates a powerful status quo bias.

  So, why the labels you mentioned don't quite fit:
  *   **Information Cascade:** As you noted, classic cascades involve people rationally updating beliefs based on *observed actions* of others *plus* their own private signal. They see people choosing A, and if their own weak signal doesn't strongly suggest B, they choose A too, amplifying the signal for the next person. Your scenario lacks the genuine private signal evaluation *and* the fragility. Here, people aren't weighing their own signal against others'; they're interpreting *silence* as a signal *in place of* evaluation. It's not fragile because new information doesn't challenge the *perceived consensus*; it challenges the *thing itself*, which is defended by the inertia.
  *   **Herd Behavior:** Too broad. Herding covers everything from stock market panics to fashion trends, often driven by fear of missing out or simple mimicry without deep thought. Your phenomenon is more specific: the misinterpretation of silence *as* consensus, leading to entrenchment.
  *   **Groupthink:** Focuses on cohesive, insulated groups where the desire for harmony overrides realistic appraisal. Pressure to conform is direct and social. Your scenario happens across diffuse groups (different teams, hires over years) where individuals aren't necessarily pressured *by each other* directly, but by the *perceived weight of the established norm and the silence surrounding it*. The pressure is institutional and historical, not primarily interpersonal cohesion.

  **The closest established concepts are a blend:**
  1.  **Pluralistic Ignorance:** This is key. People privately doubt the norm/choice but mistakenly believe everyone else accepts it. They conform to what they *think* is the consensus (based on the silence/lack of dissent), reinforcing the false norm for others. Your examples are textbook cases of pluralistic ignorance in an organizational setting.
  2.  **Institutional Inertia / Path Dependence:** The idea that past decisions constrain future ones, often irrationally. Choices made early on, sometimes arbitrarily, become "locked in" because the cost of changing them seems too high, or simply because "that's how it's done." The silence reinforces this inertia by masking the lack of original justification.
  3.  **Normative Social Influence (Misapplied):** Conforming to gain social approval or avoid disapproval. In your case, the perceived norm (created by silence) exerts pressure *not* to question it, for fear of being the odd one out or rocking the boat, even if disapproval wouldn't actually be widespread.

  **What would make it healthy consensus?** A genuine consensus involves *visible deliberation*. Evidence of evaluation would be present: documented benchmarks, meeting notes showing debated alternatives, individuals feeling safe to voice concerns *during the decision process*, and a clear, accessible rationale *beyond* "others do it" or "it's always been this way." Crucially, dissent would be surfaced and addressed, not suppressed or assumed away by silence. The rationale would be maintained, not forgotten.

  **If we need a precise label: "Inertial Consensus" or "Silence-Reinforced Institutional Norm."** Here's the definition:
  *   **Phenomenon:** The establishment and perpetuation of a group decision or practice, where the *primary perceived justification evolves into the mere existence of the choice/process itself and the apparent lack of dissent surrounding it*, rather than any underlying objective rationale. This arises from the misinterpretation of silence as evidence of consensus or validation, leading to increasing entrenchment and resistance to change due to the escalating perceived cost of being the first dissenter against an apparently unanimous, established norm.

  **Edge Cases:**
  *   *Should Cover:* A team adopts a library because GitHub stars are high, assumes *someone* must have benchmarked it because no one objects in meetings, and years later the justification is purely "it's the standard." (Misinterpreted silence + inertia). A manufacturing plant keeps a slightly risky procedure because the veteran who set it up retired, no incidents have happened (yet), and new engineers assume there's a deep reason they don't see. (Forgotten origin + silence as validation).
  *   *Should NOT Cover:* A team openly argues about tools, looks at some (flawed) benchmarks together, and chooses Tool A. It later turns out to be wrong, but the evaluation was genuine, just mistaken. (This is error, not silence-reinforced inertia). A team adopts a tool because a trusted, well-regarded expert strongly advocates for it with specific, articulated reasons everyone hears and accepts. (This is persuasion/authority, not silence misinterpreted as consensus). A temporary fad where everyone genuinely tries the new thing because it's flashy, knows it's a fad, and drops it quickly when the next thing comes along. (Lacks the entrenchment and inertia).

  The power of this pattern lies in its self-sealing nature. The silence creates the illusion of consensus, which discourages dissent, which deepens the silence and the illusion. Breaking it requires deliberately disrupting that cycle: forcing the surfacing of doubts (e.g., anonymous feedback, "pre-mortems" on decisions), demanding documented rationale at the point of origin, scheduling regular "why do we do this this way?" reviews for processes, and actively encouraging the first dissenter by rewarding constructive challenge over blind conformity. It's hard work precisely because the phenomenon makes the status quo feel so deceptively solid.
