          - Quiet failure (slow value drift): the project statement changed step by step, each step reasonable, but ending up somewhere that might not align with the original goal.

     - Map moments:
          - In the relay: when did the drift become noticeable? Was there a moment when the proxy (e.g., measurability) became the goal?
          - In the tally: when did someone notice the takeover possibility? What happened when they objected (if they did)?

     - Make the case: 
          - Oversight, voting, and vigilance are well-suited for the loud failure because it's visible and there is a clear moment to object. 
          - They are poorly suited for the quiet failure because each step is reasonable and there's no clear moment to object until it's too late.

     - What the activity cannot reproduce: 
          - In real systems, objectives are often not easily readable (like in AI systems). In this activity, we had the advantage of written statements. In reality, we might not have access to the internal objectives of an AI system, making the quiet drift even harder to detect.

