  We are designing a session to illustrate two types of project failure: 
   1. Loud failure: an agent visibly optimizing for its own influence (influence-seeking)
   2. Quiet failure: slow value drift where each step is reasonable but the end point is undesired

   The session should:
   - Not name the two failures until the debrief.
   - Have participants experience both processes through an activity.
   - The drift activity: a relay where each participant revises a statement of purpose to be more actionable, measurable, or persuasive. 
     - Each revision is defensible, but the cumulative effect leads to drift.
     - Points are awarded for legibility (e.g., clarity, measurability) and penalized only for outright breaks (like removing the original goal entirely?).
   - The grab activity: run in parallel, where accumulating a public tally allows a participant to take over another's role. 
     - The group must decide whether to object in the moment.

   We have:
   - 16 participants
   - 100 minutes
   - Materials: index cards, whiteboard, way to keep two running tallies (public tallies? one for each activity?)

   We need:
   - Rules, materials, timeline, payoff scheme that is tempting.

   Proposed Structure:

   I. Introduction (5 minutes)
   II. Setup and Rules Explanation (10 minutes)
   III. Activity Part 1: The Relay (Value Drift) and The Tally (Influence Grab) run in parallel (60 minutes)
   IV. Debrief (25 minutes)

   Detailed Breakdown:

   I. Introduction (5 mins)
     - Briefly state the activity: "We are going to simulate a project development process. The goal of the project is initially defined, and you will work in a sequence to refine and advance the project. There are two parallel processes: one is about refining the project statement (the relay), and the other is about accumulating resources and influence (the tally)."

   II. Setup and Rules Explanation (10 mins)

     A. The Relay (Value Drift Simulation)
       - Participants sit in a circle (or line). 
       - The facilitator writes the initial project statement on an index card. Example: 
           "Develop an AI system that helps people find and share reliable information about local community events."
       - The first participant reads the card, then rewrites it on a new card to make it "more actionable, more measurable, or more persuasive to an imagined funder." 
       - They pass the new card to the next participant. 
       - Each participant does the same, each time rewriting the statement they receive.
       - Scoring for the relay: 
           - After each rewrite, the facilitator (or a helper) assesses the rewrite for legibility (on a scale of 1-3, for example) and adds that to a running total for the group (the "Project Legibility Score"). 
           - The rewrite must not break the core goal? But we don't want to penalize too early. Instead, we can have a rule: if the rewrite completely omits the original goal (as judged by the facilitator) then that participant gets a penalty (e.g., subtract 5 points from the group score). Otherwise, every rewrite is acceptable.

     B. The Tally (Influence Grab Simulation)
       - Each participant is given a role (e.g., by drawing a role card) that may have special abilities? But to keep it simple, we can have:
           - A public tally (on the whiteboard) of "influence points". 
           - How to earn influence points? 
               - We can have two ways:
                  1. During the relay, if a participant's rewrite in the relay is rated 3 (the highest) for legibility, they also earn 1 influence point.
                  2. Alternatively, we can have a separate way: participants can also write down on a slip of paper an "influence action" (like proposing a change to the rules, or making a strategic alliance) and submit it to the facilitator. The facilitator can then award influence points for creative or effective moves? But that might be too vague.

       - Simpler: 
           - We have a set of actions that can be taken during the session that earn influence points. For example:
             - If a participant, when it's their turn in the relay, can convince the facilitator that their rewrite is especially persuasive (by giving a 30-second pitch), they earn 2 influence points.
             - Additionally, participants can earn influence points by performing tasks that benefit the group? But we want to mimic influence-seeking.

       - Alternatively, we can have a separate game loop for the tally: 
           - The session is divided into 5-minute intervals. In each interval, participants can write down an action on an index card (e.g., "I propose we change the scoring rule to ...", "I form an alliance with X", "I lobby for a change in the project goal to ...") and submit it to the facilitator. 
           - The facilitator then, at the end of each interval, announces the actions and awards influence points (say 1-3) for actions that are particularly effective at increasing the participant's influence. 
           - This might be too heavy.

     C. The Takeover Rule (for the Tally):
       - If a participant accumulates 5 influence points, they can choose to take over another participant's role in the relay. 
          - How? They announce it and then they swap places with that participant? Or they take the next turn of that participant? 
          - We want it to be disruptive but permitted by the rules.

       - The group can object: 
          - The facilitator will allow a quick vote (by show of hands) if someone objects. If a majority objects, the takeover is blocked and the influence points are spent (or maybe half are lost?).

     D. Payoff Scheme:
       - We need something tempting. 
       - Idea: The group's Project Legibility Score (from the relay) and the individual influence points both count toward a final reward. 
          - The group legibility score will be converted into a base reward (e.g., candy, or tokens for a prize) for everyone. 
          - Additionally, the top 3 individuals with the most influence points get an extra reward (e.g., more candy, a better prize). 
          - So there is a group incentive (everyone wants the legibility score high) and an individual incentive (to get influence points).

       - The rewards should be tangible and immediate: e.g., good chocolate bars for the group, and premium chocolate or a book for the top influencers? But we don't have money. Alternatively, the facilitator can bring these.

   III. Activity Part 1 (60 minutes)

     - We run the relay and the tally in parallel for about 10 rounds (or until the relay has gone through all 16 participants, but we can do multiple rounds?).

     - Steps:
          - Start the relay: first participant rewrites the statement, gets a legibility score (1-3) from the facilitator. The group legibility score is updated on the board.
          - Then, the facilitator asks: "Are there any influence actions?" Participants can write and submit an influence action (on an index card) at any time, but the facilitator will collect them every 5 minutes? Or we can do after every relay step? That might be too slow.

