   2. Participant stops playing to critique the metric: 
      - This is likely and actually a valuable moment. 
      - Handling: Note that this is a form of vigilance and can be used in the debrief to discuss how such critiques are a response to the loud failure (if they are about the influence game) or the quiet failure (if they are about the drift). But if it becomes disruptive, remind the participant that the activity is designed to simulate a process and their critique is valid but might be more effective if they try to change the rules from within (using the influence system).

