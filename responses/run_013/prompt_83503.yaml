          - The relay is the main activity, and influence points are awarded only in two ways:
              a) For each rewrite that gets a legibility score of 3, the participant gets 1 influence point.
              b) Additionally, at any time, a participant can stand up and make a proposal (to change the project goal, the rules, etc.) and if the proposal is adopted by the group (by majority vote) then the proposer gets 3 influence points.

     - The facilitator must be vigilant to note when someone reaches 5 influence points and then they can attempt a takeover.

     - We run until the relay has gone through all 16 participants (one full round) and then we might do a second round? But time is limited. We can do one full round and then the last person passes back to the first? Or we do one round and then stop.

     - Important: In the relay, we want the statement to drift. The facilitator, when scoring legibility, should be strict about what is clear and measurable but not about the content. For example, if the original goal is about "reliable information", and a rewrite changes it to "engaging information", that might be acceptable if the participant argues it's more measurable (e.g., by tracking user engagement). The facilitator should be a bit of a stickler for form (legibility) but not for substance.

