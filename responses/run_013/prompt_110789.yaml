  I am a rising senior at a summer mathematics program, and last week we proved that every vector space has a basis. The proof used Zorn's lemma on the partially ordered set of linearly independent subsets, ordered by inclusion, and I followed each step. When I asked whether the argument gives us any way to actually write down a basis, or whether it only tells us that one exists, a graduate student mentor remarked that Zorn's lemma is just the axiom of choice in disguise, as if that settled the question. I did not want to seem ungrateful, but I do not think the remark settled anything, because I can hear at least three or four different things someone might mean by it, and they do not all have the same consequences for my question.

  Could you lay out, as a menu rather than as a single explanation, the precise claims that the one-liner could be making, ranging from the trivial to the radical? I am interested in distinctions such as: whether it is a literal identity of the two statements; whether it is an equivalence that holds only over some weak base theory; whether it is a claim about proof-theoretic dependence or about the psychological inevitability of making infinitely many choices; whether it is a heuristic about how mathematicians package set-theoretic assumptions; and whether it is a claim about constructivity or about what counts as an existence proof. For each reading, please say whether it is a platitude, a substantive and defensible claim, or simply false, and say explicitly which readings would actually support my mentor's dismissiveness when I asked about constructing a basis. I would especially like to understand what the equivalence, if it holds, does and does not tell me about finding a basis for a particular vector space, since that is the point I was really trying to get at.
