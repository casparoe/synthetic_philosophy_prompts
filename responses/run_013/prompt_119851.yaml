  Below is a decision tree designed to guide students through the conceptual landscape of what constitutes a letter 'a'. It incorporates your specified cases, positions, and constraints. The tree has 10 nodes (within your dozen-node limit) and can be completed in ~20 minutes. Each branch question is answerable without prior knowledge of philosophical positions, and the leaves include your requested views plus one addition (*Detection View*) to accommodate the pandemonium model.

  ---

  ### **Decision Tree: What Makes an 'a' an 'a'?**

  **Start at Node 1.**

  #### **Node 1**:  
  *Consider a Cyrillic 'а' (U+0430) that looks identical to a Latin 'a' (U+0061) but has a different Unicode code point. Is it the same letter?*  
  - **Yes** → Go to Node 2.  
  - **No** → Go to Node 6.  

  #### **Node 2**:  
  *Can an 'a' be recognized in total isolation (e.g., floating alone in space)?*  
  - **Yes** → Go to Node 3.  
  - **No** → **Leaf: Differential View**.  
    - *Most awkward commitment:* An 'a' half-eaten by compression in a captcha isn’t an 'a' unless contrasted with neighboring letters.  

  #### **Node 3**:  
  *Does an 'a' retain its identity if you mirror it horizontally (e.g., flipped like "ɒ")?*  
  - **Yes** → **Leaf: Family Resemblance**.  
    - *Most awkward commitment:* Mirrored "@" could be an 'a' if it shares enough features (e.g., enclosed curve) with other 'a's.  
  - **No** → Go to Node 4.  

  #### **Node 4**:  
  *Is the core identity of an 'a' defined by an underlying skeleton path (e.g., Metafont), not pen width/slant?*  
  - **Yes** → Go to Node 5.  
  - **No** → **Leaf: Exemplar Theory**.  
    - *Most awkward commitment:* A 5-pixel-tall bitmap 'a' isn’t an 'a' if it doesn’t closely match stored instances.  

  #### **Node 5**:  
  *If you draw the same skeleton with a fatter, slanted pen, is it the same 'a'?*  
  - **Yes** → **Leaf: Platonism**.  
    - *Most awkward commitment:* Your handwritten 'a' is an inferior approximation of an ideal form.  
  - **No** → **Leaf: Conventionalism (Goodman-esque)**.  
    - *Most awkward commitment:* An italic 'a' (U+1D44E) is a distinct symbol from roman 'a' solely due to notational rules.  

  #### **Node 6**:  
  *Is an upside-down 'a' (e.g., "ɐ" in IPA) still an 'a'?*  
  - **Yes** → **Leaf: Prototype Theory (Rosch)**.  
    - *Most awkward commitment:* A one-storey Futura 'a' is a "worse" 'a' than a two-storey Times 'a' if it’s less typical.  
  - **No** → Go to Node 7.  

  #### **Node 7**:  
  *Is an 'a' with a diacritic (e.g., 'å' or 'ä') a variant of 'a' or a new letter?*  
  - **Variant** → **Leaf: Causal-Historical View**.  
    - *Most awkward commitment:* A Cyrillic 'а' is not an 'a' despite identical appearance, due to divergent lineage.  
  - **New letter** → Go to Node 8.  

  #### **Node 8**:  
  *Is recognizing an 'a' more like running a detection routine (e.g., Selfridge’s pandemonium) than judging shapes?*  
  - **Yes** → **Leaf: Detection View** (*added to accommodate pandemonium*).  
    - *Why added?* To capture cognitive process-based views where 'a'-ness is a brain-state, not a shape-property.  
    - *Most awkward commitment:* A shape is only an 'a' if it triggers the right neural feature-demons.  
  - **No** → Go to Node 9.  

  #### **Node 9**:  
  *Is the cursive 'a' (resembling an 'o' with a tail) an 'a' because of its function in a system?*  
  - **Yes** → **Leaf: Differential View** (revisited).  
    - *Most awkward commitment:* The cursive 'a' is only an 'a' because it isn’t 'c' or 'd' in the script.  
  - **No** → **Leaf: Deflationary View**.  
    - *Most awkward commitment:* There’s no fact of the matter—Unicode could swap 'a' and '@' without error.  

  ---

  ### **Unoccupied Combinations & Why**
  1. **Platonism + Detection View**  
     - *Why unoccupied?* **Incoherent**. Platonism requires mind-independent essences; the Detection View makes 'a'-ness mind-dependent.  
  2. **Conventionalism + Causal-Historical View**  
     - *Why unoccupied?* **Unattractive**. Conventionalism needs arbitrary rules; Causal-History needs descent. Combining both overdetermines identity with no clear payoff.  
  3. **Exemplar Theory + Family Resemblance**  
     - *Why unoccupied?* **Redundant**. Both are similarity-based; no theorist needs both (exemplars use specific instances, family resemblance uses feature clusters).  

  ---

  ### **Pairs of Leaves the Tree Can’t Separate**
  1. **Prototype Theory vs. Detection View**  
     - *Why?* Both might answer similarly on typicality (e.g., two-storey 'a' as "better").  
     - *Separable with extra question?* **Yes**. Ask: *If a brain has no 'a'-detectors, could a shape still be an 'a'?*  
       - Detection View: No (requires detectors).  
       - Prototype: Yes (ideal exists independently).  

  2. **Conventionalism vs. Differential View**  
     - *Why?* Both appeal to systems (notation vs. contrasts).  
     - *Separable with extra question?* **Yes**. Ask: *Can a notation include non-contrastive properties (e.g., exact pen angle)?*  
       - Conventionalism: Yes (rules can demand anything).  
       - Differential: No (only contrasts matter).  

  3. **Deflationary vs. Family Resemblance**  
     - *Why?* Both deny strict criteria.  
     - *Separable with extra question?* **No**. Both are anti-essentialist; the difference is linguistic (deflationary: "no fact"; family resemblance: "fluid facts").  

  ---

  ### **Design Notes**
  - **Cases integrated**:  
    - Node 1: Cyrillic vs. Latin 'a'.  
    - Node 2: Captcha/degraded 'a'.  
    - Node 3: Mirrored 'a' and "@".  
    - Node 4/5: Metafont skeletons and pen variations.  
    - Node 6: Upside-down 'a' (IPA).  
    - Node 7: Diacritics (å, ä) vs. base 'a'.  
    - Node 9: Cursive 'a' and system-dependence.  
  - **Pandemonium**: Explicitly in Node 8 (Detection View).  
  - **Efficiency**: The tree prioritizes high-splitting questions early (history, isolation, transformation) to reach leaves quickly.  
  - **Unnamed Leaf**: Hybrid views (e.g., historical + conventional) are omitted as unexplored and unattractive in literature.  

