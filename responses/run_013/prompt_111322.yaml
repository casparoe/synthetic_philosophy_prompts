prompt: |-
  I'm a novelist, currently about two-thirds through a campus novel set in a cognitive science department in the late 1990s, and I've built its central rivalry around a distinction I came across in Daniel Dennett's Darwin's Dangerous Idea — the contrast between cranes and skyhooks, together with his phrase "greedy reductionism." My neuroscientist, Vollard, is meant to be the greedy reductionist: at faculty dinners he insists that love, grief, and the sense of self are "nothing but" electrochemical events, and he clearly enjoys the discomfort this causes. Against him I've placed my philosopher, Iris, who is supposed to embody the humanistic resistance. She wants to keep the level of meaning and first-person experience from being swallowed whole by the lab downstairs, and I have been writing her as the defender of the skyhooks — on the assumption that Dennett's contrast is a version of the familiar one between humble, pluralistic explanation and the imperious "nothing but" variety, with the skyhooks standing for the humane, anti-reductionist side of the ledger and greedy reductionism naming the vice of dragging everything down to the level of atoms.

  What I need from you is a correction and a plan, in that order. First, tell me plainly whether I have the terms right — whether the crane/skyhook contrast is the modest-versus-imperious distinction I've assumed, whether skyhooks are really the humanistic alternative to Vollard's reductionism, and whether "greedy reductionism" means reducing too far down (to physics, say) or something else; if I've mis-assigned either character, say so without softening it. Second, assuming I've got something wrong, sketch how the two of them should actually be drawn so that the argument between them is intellectually honest: what Vollard's position really commits him to, what a serious reply to him would look like from someone who is not simply reaching for a skyhook, and where — if anywhere — Dennett's own view would come down between them. I'd also like to know which one, on the corrected reading, is the more interesting character to write, since I suspect I've been giving the better lines to the wrong man. No citations or reading lists, please; I just need the ideas straight before the copyedit.
