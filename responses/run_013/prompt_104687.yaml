prompt: |-
  I am a platform engineer at a mid-sized software company, and I have no formal background in philosophy or economics. I own an internal shared compute cluster — a few thousand CPU cores plus a GPU pool — that every product team draws on directly, with no chargeback and no per-team budget: the cost sits on one central line. Every quarter or so we have the same fight. Two or three teams run large batch jobs that saturate the queue for days; interactive work from everyone else sits behind them; and the only fixes anyone proposes are add capacity, which we cannot get funded, or impose hard quotas, which the loudest teams say will destroy their roadmaps. Someone always calls this a tragedy of the commons and the conversation ends there.

  When I tried to read up on it, I found that the people who study shared resources for a living seem to say the classic story is wrong in a specific way, and that there is a mirror-image failure I had never heard of in which the problem is too much exclusion rather than too little. Here is the half-digested version I am working from, and I would like you to correct it rather than take it on faith: a common-pool resource is one that is rival — my use subtracts from yours — but from which people are hard to exclude, whereas a public good is non-rival; the famous tragedy is really about unmanaged open access rather than shared ownership as such; communities have repeatedly governed shared resources for long stretches without either privatization or central control, using rules the users themselves set, monitoring that is cheap, and penalties that start mild and escalate; the monitoring and sanctioning are themselves collective-action problems, so a governance scheme can fail at the second level even when the first-level rule is sound; and the anticommons is the reverse pathology, where many separate holders of exclusion rights each block the others and the resource ends up underused.

  What I want is not a lecture. I want a decision procedure my team can actually run when a contention complaint comes in. Please give me: the questions to ask, in the order to ask them, phrased so that an on-call engineer can answer them from data we already have; what counts as a sufficient answer to each, and what the procedure does when the answer is missing or contested; the point at which the procedure terminates with do nothing, the resource is not actually being depleted and no intervention is warranted; and the point at which it stops and hands the decision to a human because the remaining question is about whose work matters more, which is a value judgment and not something the procedure can settle. Give me a short diagnostic sequence — a handful of things we can measure or check in under an hour, such as the ratio of demand to capacity, the spread of consumption across teams, whether a team has a workable substitute for the resource, and how visible each team's usage is to the others — and say what each diagnostic is actually a proxy for. Be explicit about which distinctions from the theory must survive the translation into a checklist and which I can safely drop, and be honest about the cases where the procedure will misfire or produce an answer that looks rigorous but is really a judgment call in disguise.

  Then run the procedure on three cases: the two batch-job teams that are saturating the queue; a proposal from my director to give every team a use-it-or-lose-it share of the cluster, which is popular because it sounds fair; and a case where the honest answer is to do nothing. I expect to dislike at least one of the outcomes, so do not soften them.

  Constraints: I have roughly two weeks before the next planning cycle, no economist on staff, and any policy change has to be signed off by my director together with the product team leads — so the procedure has to be usable by people who will not read the underlying literature, and it has to say when to escalate to those leads rather than to me. Finally, tell me what the procedure cannot do, and in particular whether the framing I brought you is even the right diagnosis for my situation, or whether I am forcing a story about herders onto a problem that is really something else.
reasoning: |-
  We are building a diagnostic procedure for shared resource contention. The goal is to determine when intervention is needed and what type, based on data we can collect quickly. The procedure should avoid making value judgments about whose work is more important, and instead focus on observable metrics and structural properties.

  Key distinctions from theory that we must preserve:
  1. **Rivalry**: The resource is rivalrous (use by one subtracts from others). We assume this is true for the cluster (CPU/GPU contention).
  2. **Excludability**: The resource currently has low excludability (hard to prevent teams from using it). This is the open-access condition that leads to the tragedy.
  3. **Monitoring and Sanctioning**: We need to check if usage is visible (monitoring) and if there are any existing rules or consequences (sanctioning).

  We can drop:
  - Detailed historical examples of commons governance (like fisheries or pastures) as long as we capture the principles in the diagnostics.
  - The full institutional analysis of collective action (we are building a lightweight version).

  The procedure will have up to 5 steps, each with a question, how to measure, what is sufficient, and what to do if missing/contested. It will terminate in one of three ways:
  A. Do nothing (no depletion, no intervention needed).
  B. Escalate to human (value judgment required).
  C. Implement a specific intervention (based on the diagnostics).

  Diagnostics we can measure quickly (proxies):
  1. **Demand-to-capacity ratio (DCR)**: Proxy for scarcity. If DCR is near or below 1, then there's no contention. If much greater than 1, then scarcity is present.
  2. **Concentration of usage (Gini coefficient or top 2 teams' share)**: Proxy for the risk of a few teams dominating. High concentration suggests a few heavy users are causing the problem.
  3. **Substitutability**: Whether a team has a workable alternative (e.g., cloud credits, their own servers). Proxy for how much they depend on the shared cluster.
  4. **Visibility of usage**: Can teams see each other's usage? Proxy for monitoring. If usage is visible, then teams can self-regulate.
  5. **Existing rules and enforcement**: Are there any informal or formal rules? How are they enforced? Proxy for the presence of governance.

  The Procedure:

  **Step 1: Check for actual scarcity (Demand-to-capacity ratio)**
     - Question: Is the resource currently over-demanded relative to capacity?
     - Measurement: 
          - Total demand (sum of all requested resources over a representative week, e.g., in core-hours) / Total capacity (available core-hours in that week). 
          - Note: We care about peak contention, so look at the worst week in the last quarter.
     - Sufficient answer: DCR > 1.2 (indicating at least 20% over-subscription) is a sign of scarcity. If DCR <= 1, then the resource is not scarce and we can stop (do nothing).
     - Missing/Contested: If data is missing, we cannot proceed. We must fix monitoring. If contested, re-measure with agreed-upon time window.

  **Step 2: Check usage concentration**
     - Question: Is the high usage concentrated in a few teams?
     - Measurement: Calculate the share of total usage by the top 2 teams over the same period. Alternatively, compute a Gini coefficient (if we can quickly get the distribution). 
          - A simple threshold: if the top 2 teams account for more than 50% of the total usage, then concentration is high.
     - Sufficient answer: High concentration (above 50% for top 2) indicates that the contention may be driven by a few teams. Low concentration (below 50%) suggests widespread contention and potentially a need for capacity expansion.
     - Missing/Contested: If we don't have per-team usage, we cannot proceed. We must fix monitoring to track per-team usage.

  **Step 3: Check substitutability for the heavy users**
     - Question: Do the teams causing the contention (if concentration is high) have a viable alternative?
     - Measurement: For each of the top teams (from Step 2), check:
          - Do they have access to other resources (like cloud credits, reserved instances, or their own hardware) that could handle their batch jobs?
          - This is a qualitative question: ask the team leads. We need a yes/no with a brief reason.
     - Sufficient answer: If at least one of the top teams has a viable alternative, then we can consider asking them to use it (or creating incentives). If none do, then the cluster is critical and we must consider capacity expansion or quotas (but we'll check next steps).
     - Missing/Contested: If the team says they don't have an alternative and we doubt it, we may need to escalate to a human to verify (but we try to take their word).

  **Step 4: Check visibility (monitoring)**
     - Question: Can teams easily see the current and historical usage by all teams?
     - Measurement: 
          - Is there a dashboard that shows per-team usage in near real-time? 
          - Do teams have access to it? 
          - Have they been using it?
     - Sufficient answer: If visibility is low (no dashboard, or teams don't look at it), then improving monitoring might help. If visibility is already high, then monitoring is not the issue.

  **Step 5: Check existing rules and enforcement**
     - Question: Are there any rules (formal or informal) governing usage? How are they enforced?
     - Measurement: 
          - Interview team leads: "What rules do you follow when scheduling jobs? What happens if someone breaks the rules?"
          - Look for evidence of enforcement (e.g., logs of interventions, complaints).
     - Sufficient answer: If rules exist and are enforced (even informally, like peer pressure) then we have some governance. If not, we are in an open-access situation.

  Termination points:
  - After Step 1: If DCR <= 1, terminate with "do nothing" (no scarcity).
  - After Step 2: If concentration is low (top 2 teams < 50%) and DCR is high, then the problem is not a few bad actors but overall scarcity. We must escalate to human (director and leads) for a value judgment on capacity expansion vs. quotas for all.
  - After Step 3: If we find that heavy users have no alternative and the resource is critical, then we are in a situation where we must either add capacity or impose quotas. But we can also look at governance.
  - After Step 5: If we find no rules and low visibility, then we are in an open-access tragedy. We need to establish rules.

  The procedure will stop and escalate to a human (the director and team leads) when:
  - We need to decide on capacity expansion (if the problem is overall scarcity and no one has alternatives) because that requires budget and prioritization.
  - We need to decide on the allocation of quotas (how much each team gets) because that is a value judgment about team priorities.
  - We are considering changing governance (like introducing monitoring or rules) but the teams must agree on the rules.

  What the procedure cannot do:
  - Solve the collective action problem of setting up governance. It can only diagnose that it is missing.
  - Make value judgments about which team's work is more important.
  - Address the anticommons (underuse due to too many vetoes) unless we see underuse (which we aren't currently).

  Now, let's run the procedure on the three cases.

  **Case 1: The two batch-job teams saturating the queue**
  - Step 1: DCR during the contention period. We know the queue is saturated for days, so DCR >> 1. Proceed.
  - Step 2: Check concentration. These two teams are the top users and likely account for most of the usage during the contention. If they are over 50%, then high concentration. Proceed.
  - Step 3: Check substitutability for these two teams. Do they have alternatives? 
      - Suppose Team A says: "We could use cloud but it would cost 3x more and we don't have budget." -> No viable alternative.
      - Team B says: "We have our own cluster, but it's small and we use it for testing. We could scale it up with a one-time investment." -> Maybe, but it would take time and money.
      - If both have no immediate alternative, then we proceed to Step 4.
  - Step 4: Visibility. Do we have a dashboard? If not, then low visibility. If we do, but teams don't look at it, then also low.
  - Step 5: Rules and enforcement. Currently, no hard quotas, so no rules? Maybe there's an informal rule like "don't run huge jobs during business hours" but they are running for days. So enforcement is weak.

  Termination: 
  We have high concentration, no substitutes, and weak governance. The procedure would recommend:
  - Implement governance: Start by making usage visible (if not already) and then set rules. The rules might include:
     - Soft quotas (with monitoring) that can be exceeded but trigger a review.
     - Priority scheduling for interactive jobs.
     - A requirement that batch jobs over a certain size must be scheduled during off-peak hours or require approval.

  But setting the actual rules requires human agreement (so escalate to director and leads). The procedure stops and says: "The problem is due to a few teams with no alternatives and weak governance. Propose rules for fair usage and monitoring to the director and team leads for approval."

  **Case 2: Proposal for use-it-or-lose-it shares (per-team quotas)**
  This is a policy proposal. We run the procedure to see if it's the right intervention.

  First, we run the procedure to see the current state (as above) and then check if the proposal fits.

  Assume we already know from Case 1 that we have high concentration and no substitutes. Now, the proposal is to allocate fixed shares.

  The procedure doesn't directly evaluate proposals, but we can use the diagnostics to see:

  - Step 1: We have scarcity (DCR>1.2).
  - Step 2: High concentration (so we are targeting the heavy users).
  - Step 3: No substitutes (so we cannot offload).

  Now, the proposal: use-it-or-lose-it quotas.

  Pros: 
  - It introduces excludability (each team can only use up to their share) so it prevents overuse by any one team.
  - It might lead to underuse if teams don't use their full share (anticommons risk).

  But we must check:
  - Would it cause underuse? We don't have data on that yet.

  We can simulate:
  - Look at historical usage: if every team used their share (say, equally divided by team), would the total usage be less than capacity? Then we might have underuse.

  But note: the procedure is for contention complaints. For this proposal, we are being proactive.

  The procedure would say:
  - We have a tragedy of the commons (open access) and we are introducing exclusion (quotas). This can solve the overuse, but we must watch for underuse.

  The procedure cannot decide the fairness of the allocation (that's a value judgment). So we must escalate to the director and leads to decide the allocation.

  But note: the procedure would flag that we are moving from open access to a quota system, which might work, but we must monitor for underuse (if DCR becomes < 1 because teams are not using their shares) then we have an anticommons problem.

  Termination: The procedure would note that we are changing the governance structure. It would require the director and leads to agree on the allocation and set up monitoring to watch for underuse.

  **Case 3: A case to do nothing**
  We want a scenario where the procedure terminates at Step 1.

  Example: A team complains about slow interactive jobs. We run Step 1: We measure DCR for the period when they complained. We find that the cluster was not saturated (DCR <= 1). 

  Why might they complain? Maybe a temporary spike or a localized issue (e.g., one node was slow). 

  Then the procedure stops: "No intervention needed. The resource is not being depleted overall. Investigate localized issues (e.g., node failures, network) if the complaint persists."

  **Is the commons framing right?**
  We have a rival resource (compute) with low excludability (any team can submit jobs). The symptoms (overuse by a few, leading to degradation for others) match the tragedy of the commons (open access). The anticommons (underuse due to too many exclusion rights) is not present because we don't have exclusion rights yet. So the diagnosis fits.

  But note: the problem might also be a technical one (e.g., inefficient scheduling). The procedure assumes that the scheduler is working as intended and the issue is resource contention.

  What the procedure cannot do:
  - Fix technical issues (like a better scheduler that preempts batch jobs for interactive ones).
  - Address budget constraints (if we need more capacity but can't get funding).
  - Resolve interpersonal conflicts between teams.

  The procedure is a diagnostic for resource contention due to governance failures. It will misfire if the problem is technical (e.g., a bug in the job scheduler) or if the demand data is inaccurate.

  In summary, the procedure:

  1. Measure DCR -> if <=1, stop (do nothing).
  2. Measure concentration (top 2 teams share) -> if low, escalate for capacity/quotas for all.
  3. For high concentration, check substitutes for top teams -> if substitutes exist, recommend using them (or incentives). If not, proceed.
  4. Check visibility -> if low, recommend adding monitoring.
  5. Check rules -> if none, recommend establishing rules.

  And always escalate when:
  - We need to set the actual rules or quotas (because that requires value judgments).
  - We need to decide on capacity expansion (budget decision).
  - The problem is not governance but something else (like technical).

  Now, we write the procedure as a checklist.
answer: |-
  Below is a practical, step-by-step decision procedure for diagnosing and addressing contention in your shared compute cluster. It's designed as a checklist that an on-call engineer can run in under an hour using existing data (e.g., cluster utilization logs, job metadata, team resource requests). The procedure focuses on observable metrics as proxies for the key distinctions from commons theory: **rivalry** (your cluster is inherently rivalrous), **excludability** (current low barriers to access), and **collective action problems** (monitoring, rules, sanctions). It avoids economic jargon and terminates early if no action is needed.

  The procedure stops at **three outcomes**:
  1. **Do nothing**: No scarcity or depletion detected.
  2. **Escalate to human**: Requires value judgments (e.g., prioritization, fairness, budget).
  3. **Implement intervention**: Technical fixes (e.g., soft quotas) or governance changes.

  **Key distinctions preserved from theory**:
  - **Rivalry vs. non-rivalry**: Measured via demand-to-capacity ratio (DCR). Must preserve—this is core.
  - **Excludability**: Measured via visibility and existing rules. Must preserve—it defines your "open access" problem.
  - **Collective action**: Measured via monitoring and substitutability. Must preserve—it reveals why governance fails.
  - **Anticommons risk**: Measured via unused capacity in quota proposals. Must preserve—it catches over-exclusion.

  **Distinctions dropped**:
  - "Community self-governance" details (e.g., gradual sanctions). Your teams lack this structure.
  - "Public goods" theory. Irrelevant here (your resource is rivalrous).
  - "Perfect" enforcement. You need pragmatism, not idealism.

  **What the procedure cannot do**:
  - Solve budget constraints (e.g., if "add capacity" is the answer but unfunded).
  - Replace human judgment for prioritization or fairness.
  - Fix technical inefficiencies (e.g., poor job scheduling algorithms).
  - Diagnose non-contention issues (e.g., hardware failures).

  **Is this a commons problem?**  
  Yes. Your cluster is a **rivalrous common-pool resource with low excludability** (teams self-submit without limits). The "tragedy" manifests as a few teams saturating capacity, degrading it for others. The anticommons (underuse from over-exclusion) isn't your current issue, but your director's quota proposal risks creating it. This framing fits—it's not forced.

  ---

  ### **Contention Diagnostic Procedure**  
  *Run this when a team reports contention (e.g., "interactive jobs are stuck").*  
  **Time:** 30-60 mins using existing monitoring (e.g., Grafana, cluster scheduler logs, team resource requests).  
  **Who runs it:** On-call engineer. Escalate to you (platform lead) if Step 3 or 5 triggers intervention. Escalate to director + team leads if Step 2, 4, or 5 requires human judgment.  

  #### **Step 1: Is there real scarcity?**  
  **Question:** Is demand consistently exceeding capacity during contention periods?  
  **Measurement:**  
    - Calculate **Demand-to-Capacity Ratio (DCR)** for the affected period:  
      `DCR = (Total core-hours requested) / (Total core-hours available)`  
      Use scheduler logs from the past 7 days (or peak contention window).  
    - Ignore one-off spikes (e.g., <2 hours). Focus on sustained contention (>4 hours).  
  **Sufficient answer:**  
    - **DCR ≤ 1.0**: No scarcity → Outcome: **Do nothing** (e.g., complaints are flukes or localized).  
    - **DCR > 1.2**: Scarcity confirmed → Proceed to Step 2.  
  **Missing/contested data?**  
    - If logs are incomplete, use the scheduler’s queue wait-time metric:  
      `Wait-time ratio = (Average job wait time) / (Average job run time)`  
      Ratio > 1.0 indicates scarcity. Still contested? Extend the window to 14 days.  

  #### **Step 2: Is usage concentrated or widespread?**  
  **Question:** Are a few teams dominating usage, or is load spread evenly?  
  **Measurement:**  
    - Calculate **% of total core-hours used by the top 2 teams** during the same period as Step 1.  
    - (Optional) Compute a **simplified Gini coefficient**:  
      - Sort teams by usage (high to low).  
      - `Gini = 1 - (2 * cumulative share of bottom 50% of teams)`  
      - E.g., 5 teams: Usage shares = [40%, 30%, 20%, 5%, 5%]. Cumulative bottom 50% = Team4 + Team5 = 10%. Gini = 1 - (2*0.1) = 0.8.  
  **Sufficient answer:**  
    - **Top 2 teams ≤ 50%** OR **Gini ≤ 0.4**: Low concentration → Outcome: **Escalate to human** (director + team leads). *Why? Scarcity is systemic; need value judgments on capacity expansion or org-wide quotas.*  
    - **Top 2 teams > 50%** OR **Gini > 0.6**: High concentration → Proceed to Step 3.  
  **Proxy for:** Risk of "tragedy" (overuse by a few). High concentration suggests governance is failing.  

  #### **Step 3: Can heavy users substitute?**  
  **Question:** Do the top 2 teams (from Step 2) have viable alternatives to the shared cluster?  
  **Measurement:**  
    - Check for **workable substitutes** per team:  
      - Cloud credits (AWS/GCP) allocated to their budget.  
      - Dedicated hardware (e.g., team-owned servers).  
      - Ability to delay jobs >24h without roadmap impact.  
    - Use historical data: Look for past instances where teams used alternatives. If none, ask the team lead (yes/no with 1-sentence rationale).  
  **Sufficient answer:**  
    - **Both teams have substitutes**: Proceed to Step 4.  
    - **One or both lack substitutes**: Outcome: **Escalate to human** (director + team leads). *Why? Quotas could harm roadmaps; need value judgment on capacity funding or exemptions.*  
  **Proxy for:** "Excludability cost." Low substitutability = high dependence on commons.  

  #### **Step 4: Is usage visible to all?**  
  **Question:** Can teams easily see real-time and historical usage by others?  
  **Measurement:**  
    - **Audit visibility**:  
      - Is there a dashboard (e.g., Grafana) showing per-team usage?  
      - Can any engineer access it without special permissions?  
      - Check dashboard access logs: >50% of teams viewed it in the past week?  
  **Sufficient answer:**  
    - **Visibility is high** (dashboard exists, accessible, and >50% usage): Proceed to Step 5.  
    - **Visibility is low** (no dashboard or <50% usage): Outcome: **Implement intervention** (build/promote a usage dashboard). *Why? Cheap monitoring enables self-governance.*  

  #### **Step 5: Do rules and enforcement exist?**  
  **Question:** Are there agreed-upon rules for fair use, and are they enforced?  
  **Measurement:**  
    - **Check for rules**:  
      - Scheduler policies (e.g., job priority tiers, preemption for interactive jobs).  
      - Team agreements (e.g., "no batch jobs during business hours").  
    - **Check enforcement**:  
      - Look for logs of job preemptions, team notifications, or sanctions (e.g., emails to abusive users).  
      - If no logs, ask teams: "What happens if someone runs a 48-hour job during peak hours?"  
  **Sufficient answer:**  
    - **Rules exist AND enforced**: Outcome: **Do nothing** (governance works; contention is temporary).  
    - **Rules exist but unenforced**: Outcome: **Implement intervention** (enforce via scheduler or alerts).  
    - **No rules**: Outcome: **Implement intervention** (draft soft quotas + escalation path).  
  **Proxy for:** Collective action failure. Rules without enforcement = "cheap talk."  

  #### **Intervention Examples**  
  - **Soft quotas**: "Teams get warnings at 80% of fair-share usage, manual review at 100%."  
  - **Scheduler tweaks**: Preempt batch jobs for interactive work.  
  - **Dashboard**: Real-time usage visibility.  
  *Note: All interventions require your approval as platform lead. Escalate to director + leads if they impact roadmaps (e.g., hard quotas).*  

  ---

  ### **Run the Procedure on Your Cases**  
  *Assumptions: Cluster capacity = 1000 core-hours/day. Data from a typical contention week.*  

  #### **Case 1: Two Batch-Job Teams Saturating the Queue**  
  - **Step 1**: DCR = 1.5 (1500 core-hours requested / 1000 available) → **Proceed**.  
  - **Step 2**: Top 2 teams = 70% of usage (Team A: 40%, Team B: 30%) → **Proceed**.  
  - **Step 3**:  
    - Team A: No substitutes (relies solely on cluster; cloud credits expired).  
    - Team B: Has dedicated servers (uses them for testing only) → **Escalate to human**.  
  **Outcome**: Escalate to director + team leads. *Why? Team B could shift work but isn’t. This requires a value judgment: Should Team B be forced to use their servers? Or exempted? The procedure flags this but won’t decide.*  
  **You’ll dislike this**: It doesn’t "fix" the problem—it exposes a political deadlock.  

  #### **Case 2: Director’s "Use-It-or-Lose-It" Quota Proposal**  
  *Run the procedure to diagnose the cluster first, then evaluate the proposal:*  
  - **Steps 1–3**: Same as Case 1 (scarcity, high concentration, mixed substitutability).  
  - **Step 4**: Visibility is low (no dashboard) → **Implement dashboard** (short-term fix).  
  - **Step 5**: No rules → **Reject quota proposal as-is. Why?**  
    - **Anticommons risk**: Measure unused capacity from historical data. If average daily usage <70% of capacity, quotas could cause underuse ("too much exclusion").  
      - Your data: Average usage = 85% → Moderate risk.  
    - **Procedure outcome**: **Implement soft quotas with a usage bank** (e.g., teams borrow/lend shares). Escalate allocation details to director + leads.  
  **You’ll dislike this**: The popular "fair" solution is rejected. Quotas need flexibility to avoid underuse.  

  #### **Case 3: Do Nothing (No Actual Depletion)**  
  - **Step 1**: DCR = 0.9 (900 core-hours requested / 1000 available) → **Do nothing**.  
  **Outcome**: No intervention. Complaints likely due to isolated issues (e.g., a GPU node failing).  

  ---

  ### **When the Procedure Misfires**  
  - **False negatives**: If teams hide usage (e.g., fake job labels), DCR/concentration metrics fail. Mitigation: Audit job metadata quarterly.  
  - **False positives**: High DCR during off-peak hours (e.g., nightly builds) isn’t real contention. Mitigation: Exclude pre-approved windows.  
  - **Hidden judgments**: "Substitutes" (Step 3) and "enforcement" (Step 5) rely on self-reporting. The procedure flags this—it doesn’t hide it.  

  ### **Final Recommendation**  
  - **Short-term (next 2 weeks)**:  
    1. Implement a usage dashboard (Step 4 fix).  
    2. For the batch-job teams (Case 1), escalate to director + leads with data: "Team B has underused dedicated servers—should we mandate their use?"  
    3. Reject hard quotas (Case 2). Propose soft quotas + borrowing rules instead.  
  - **Long-term**: Use the procedure to build a governance pact: Teams co-own rules (e.g., "batch jobs yield to interactive work"), with you as enforcer. Escalate only when trade-offs impact roadmaps.  

  **Why this works**: It converts theory into actionable checks, exposes value judgments early, and avoids academic debates. The only "homework" for your director/leads is to answer: *Whose work gets priority when resources are scarce?* That’s a business decision, not an engineering one.
