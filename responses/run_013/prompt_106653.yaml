  The Stoic dichotomy was indeed ontological and ethical - about what constitutes the true self. Epictetus frames it as "what is mine" versus "what is not mine". The modern circle is more psychological and strategic - about resource allocation. The key question is whether the modern application is consistent with the Stoic foundation. I think there's a legitimate concern here about whether a moral claim can support pragmatic advice.

