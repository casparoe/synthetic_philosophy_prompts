prompt: |-
  I sit on the animal welfare and ethics review body at my univeristy — we see half a dozen protocols a month, twenty minutes each, lay members included, and the chair wants us to stop deciding by gut feel. Someone on the panel keeps pushing a view she calls lexical threshold negative utilitarianism: suffering comes first, and below some intensity of pain there's supposed to be a threshold such that no amount of mild pleasure or other benefit, however large, can buy it off — while above that intensity things can at least be weighed against each other. I'd like a procedure we can actually run on a protocol, in order: the questions to ask, what counts as a good enough answer to each, where it stops with a reject, and where it has to go to a full vote because it's a values call dressed up as a fact. Two things it has to be honest about: whether pleasure and pain are even on one scale, so that any exchange rate between them is a bit of a fiction, and what we do when we can't put a number on either side. Then run it on three: (a) mice with a moderate but weeks-long painful condition, testing a drug that would probably help alot of people; (b) very mild but lifelong discomfort across a large colony, small scientific payoff; (c) short but severe pain in a few animals, with a big expected payoff — I suspect the procedure tells us to reject that one and I want to see whether it really does. Finally, where will the procedure misfire, and where could a determined applicant game it?
reasoning: |-
  Okay, the user is part of an animal welfare ethics review board at a university. They handle about six protocols a month, each reviewed in 20 minutes, including lay members. The chair wants to move away from gut-feeling decisions. One panel member advocates for "lexical threshold negative utilitarianism," which prioritizes suffering and sets a threshold below which no amount of pleasure can justify the pain. The user needs a practical procedure to evaluate protocols step-by-step, addressing key questions, when to reject, and when a vote is needed. They also want honesty about whether pleasure and pain are comparable and how to handle unquantifiable factors. They provided three examples to test the procedure.

  First, I need to understand the core issues. The panel is time-constrained, so the procedure must be efficient. The lexical threshold concept introduces a rigid rule against certain suffering, which might conflict with utilitarian trade-offs. The user wants transparency on value judgments versus factual disputes. They also want to prevent gaming by applicants.

  The user's explicit request is a step-by-step procedure, but deeper needs include ensuring ethical consistency, avoiding arbitrary decisions, and managing panel disagreements. They might also need to balance scientific goals with animal welfare, maintaining legitimacy in their reviews.

  Next, structuring the procedure. It should have clear stages: harm assessment, benefit assessment, trade-off analysis, and decision points. Each stage needs specific questions and criteria for passing or rejecting. The lexical threshold must be integrated, possibly as a veto point for severe suffering below the threshold.

  For harm assessment, questions should identify the nature, duration, intensity, and mitigation of suffering. Intensity levels need definitions—mild, moderate, severe—based on observable indicators. If harm is above the threshold and unmitigated, immediate rejection under the lexical rule. Quantification challenges should be acknowledged, pushing uncertain cases to panel votes.

  Benefit assessment involves scientific merit, potential impact, and probability. Unquantifiable benefits or low probabilities lead to value judgments. The trade-off stage compares mitigated harms to benefits only if harms are below the threshold. Here, if harms outweigh benefits, reject; otherwise, proceed or vote if ambiguous.

  Applying this to the examples:
  - (a) Mice with moderate, weeks-long pain for a high-benefit drug. Harm is moderate but prolonged. If below threshold, proceed to trade-off. Benefits are high, so likely approve with conditions.
  - (b) Mild lifelong discomfort in a large colony with small payoff. Harm is mild but extensive. Below threshold, but benefits minimal. Trade-off likely negative, so reject.
  - (c) Severe short-term pain with big payoff. If severe pain is above the lexical threshold, immediate rejection regardless of benefits. This aligns with the user's suspicion.

  Potential misfires include underestimating cumulative mild suffering or overvaluing speculative benefits. Applicants might game the system by downplaying harm intensity or overstating benefits. Mitigation plans could be exaggerated. The procedure needs scrutiny on harm classification and benefit evidence.

  Honesty about the pleasure-pain scale is crucial. The procedure should state that trade-offs are value-based when harms are below the threshold. Above the threshold, no trade-off is allowed. Unquantifiable factors require panel deliberation, highlighting where values differ.

  The user might also need training for panel members on assessing intensity and benefits consistently. Clear guidelines prevent subjective interpretations. Lay members' input is vital for societal values, so the procedure must be accessible.

  In conclusion, the step-by-step procedure with clear thresholds and decision points addresses the chair's concerns. Testing on examples shows how lexical threshold impacts decisions, especially rejecting severe pain despite benefits. Mitigations for misfires involve rigorous verification and panel votes for borderline cases. This balances efficiency with ethical rigor, reducing gut-feeling reliance.
answer: |-
  Here’s a **step-by-step evaluation procedure** designed for your panel’s constraints (20 min/protocol), incorporating transparency about value judgments and the lexical threshold principle. It explicitly rejects "gut feel" by forcing structured reasoning and flagging uncertainty.

  ---

  ### **The Procedure: 4 Stages, 10 Key Questions**
  **Core Principles:**  
  1. **Lexical Threshold (LT):** Suffering above intensity `X` (severe/unmitigated) **cannot** be offset by any benefit.  
  2. **Honesty:**  
     - Pain/pleasure are *not* on one scale; trade-offs below `X` are value judgments.  
     - Unquantifiable harms/benefits trigger panel votes.  
  3. **Efficiency:** Clear "Reject" triggers; ambiguous cases go to vote.

  ---

  #### **STAGE 1: HARM ASSESSMENT**  
  *(Goal: Is suffering above the lexical threshold?)*  

  1. **What is the *nature* and *duration* of harm?**  
     - *Good answer:* Specifics (e.g., "inflammatory paw edema," "8 days").  
     - *Bad answer:* Vague terms ("discomfort," "short-term").  
     - **→ If unacceptably vague: REJECT or demand revision.**

  2. **What is the **peak intensity** of suffering?**  
     - *Use predefined scale:*  
       - **Mild** (e.g., transient weight loss <10%, no behavioral distress).  
       - **Moderate** (e.g., labored breathing, reduced activity, weight loss 10–20%).  
       - **Severe** (e.g., collapse, self-mutilation, vocalization, weight loss >20%).  
     - **→ If SEVERE & unmitigated: REJECT immediately (LT rule).**  

  3. **Is suffering **mitigated** (e.g., anesthesia, analgesia, endpoints)?**  
     - *Good answer:* Dosing schedules, monitoring intervals, humane endpoints.  
     - *Bad answer:* "Analgesia provided if needed."  
     - **→ If SEVERE pain is *not* fully preventable/relieved: REJECT (LT rule).**  

  4. **Cumulative harm?**  
     - *Assess:* Duration × Intensity × Number of animals.  
     - **→ If *cumulative* harm crosses LT (e.g., prolonged moderate = severe): REJECT.**  

  **OUTCOME 1:**  
  - Above LT? → **REJECT**.  
  - Below LT? → Proceed to Stage 2.  
  - Uncertain intensity? → **VOTE** (values call: "Is this suffering severe?").

  ---

  #### **STAGE 2: BENEFIT ASSESSMENT**  
  *(Goal: Quantify benefits; flag speculation)*  

  5. **What is the **scientific merit**?**  
     - *Good answer:* Hypothesis-driven, controls, stats power, novelty.  
     - *Bad answer:* "Exploratory," "fishing expedition."  

  6. **What is the **probability of success**?**  
     - *Good answer:* Pilot data, established methods.  
     - *Bad answer:* "Potential," "could lead to."  

  7. **What is the **magnitude of benefit**?**  
     - *Good answer:* "Reduces human morbidity by X%," "saves Y animal lives."  
     - *Bad answer:* "Advances knowledge."  

  **OUTCOME 2:**  
  - Benefits unquantifiable/low probability? → **VOTE** (values call: "Is this benefit worth *any* harm?").  
  - Benefits robust? → Proceed to Trade-off.

  ---

  #### **STAGE 3: TRADE-OFF (Only if Harm < LT)**  
  *(Goal: Balance harms vs. benefits – values zone)*  

  8. **Can harms/benefits be **numerically approximated**?**  
     - *Example:* Harm = "10 mouse-weeks of moderate pain"; Benefit = "1M human DALYs saved × 10% success prob."  
     - **→ If no: VOTE** (values call: "Does benefit justify harm?").  

  9. **Is the **benefit:harm ratio** clearly favorable?**  
     - *Use threshold:* e.g., Benefit > 10× Harm (panel agrees on multiplier).  
     - **→ If ratio < threshold: REJECT.**  
     - **→ If ratio ambiguous: VOTE.**  

  **OUTCOME 3:**  
  - Trade-off unjustified → **REJECT**.  
  - Justified → **APPROVE (with conditions)**.

  ---

  #### **STAGE 4: VOTE & DOCUMENTATION**  
  - **Vote triggers:** Uncertain harm severity, unquantifiable benefits, or ambiguous trade-offs.  
  - **Document:** Rationale for rejection/approval, including LT application or value judgments.  

  ---

  ### **Test Cases**
  **Case (a): Mice with moderate weeks-long pain, high-benefit drug**  
  - Stage 1: Harm = **moderate** (below LT if mitigated). Proceed.  
  - Stage 2: Benefits = **high** (probable, large human impact).  
  - Stage 3: Trade-off → Harms quantifiable (e.g., 100 mouse-weeks pain), benefits large. **Likely APPROVE** with strict endpoints/analgesia.  

  **Case (b): Mild lifelong discomfort in large colony, small payoff**  
  - Stage 1: Harm = **mild** (below LT) but cumulative (lifelong × N animals). Proceed.  
  - Stage 2: Benefits = **low** (small scientific value).  
  - Stage 3: Trade-off → Minimal benefit vs. widespread harm. **REJECT** (fails benefit:harm ratio).  

  **Case (c): Short severe pain in few animals, big payoff**  
  - Stage 1: Harm = **SEVERE** (above LT). **REJECT immediately** (lexical threshold violated).  
    - *Your suspicion is correct: no benefit can justify this under LT rules.*  

  ---

  ### **Where It Misfires**  
  1. **False Negatives:**  
     - Rejects high-benefit studies with *transient* severe pain (e.g., terminal surgery under anesthesia).  
     - Solution: Refine LT to allow *fully mitigated* severe harm.  

  2. **Cumulative Harm Blindspots:**  
     - May overlook 10,000 mice with "mild" stress that collectively crosses LT.  
     - Solution: Define cumulative thresholds (e.g., total animal-pain-days).  

  3. **Over-reliance on Quantification:**  
     - Dismisses "soft" benefits (e.g., behavioral ecology insights).  
     - Solution: Panel vote with expert input.  

  ---

  ### **How Applicants Could Game It**  
  1. **Downplaying Harm:**  
     - Claiming "mild" for moderate stress (e.g., calling weight loss "insignificant").  
     - **Counter:** Require objective metrics (clinical scoring, behavioral assays).  

  2. **Overstating Benefits:**  
     - Inflating medical impact (e.g., "cures Alzheimer's") without evidence.  
     - **Counter:** Demand literature citations/pilot data.  

  3. **Mitigation Theater:**  
     - Promising analgesia "as needed" with no monitoring plan.  
     - **Counter:** Require detailed SOPs for intervention.  

  4. **Threshold Manipulation:**  
     - Proposing slightly below-LT harm in huge numbers (e.g., mild stress in 1,000 animals).  
     - **Counter:** Enforce cumulative harm caps.  

  ---

  ### **Key Upfront Requirements for Your Panel**  
  1. **Define the Lexical Threshold:**  
     - e.g., "Severe = any unrelieved pain causing self-harm or collapse."  
  2. **Set Trade-off Ratios:**  
     - e.g., "Benefits must outweigh harms by 5:1 for moderate pain."  
  3. **Train Panelists:**  
     - Calibrate harm scoring using video examples (e.g., mouse grimace scale).  

  This procedure forces explicit reasoning, exposes value judgments, and respects the lexical threshold – while fitting within 20 minutes via clear exit ramps (reject/vote). It turns philosophical debates into actionable checks.
