  Hmm, they're making a solid point here. When you design a Bongard problem, you don't just randomly pick examples. You carefully choose images that make the rule discoverable but also plant red herrings. Like putting triangles with circles on the left and triangles without circles on the right, but making sure some left examples have squares too to distract from the real pattern. So yeah, it's totally about mind-reading the designer.

  The user's real challenge is that "hard case" scenario though. What if the rule is meta - left images tempt simple rules, right images tempt complex rules, and the actual rule is that left images are traps for simple thinkers? Whoa, that's devious. Even in this case, I think the argument holds. Why? Because now the solver has to think about what the designer would consider "simple" or "complex" traps. It's still about modeling the puzzle-setter's psychology, just at a higher level. 

  This actually reveals something deep about concept learning. Outside puzzle contexts, we do learn from examples, but always with assumptions about how the world generates those examples. Like kids learning "dog" from examples aren't just memorizing features - they're subconsciously assuming parents show typical dogs first. So all concept learning might involve guessing the source's intent. 

