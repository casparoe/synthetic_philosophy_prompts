answer: |-
  ## The Commencement Address: The Job of the 'a'

  **(Professor steps to the podium, holds up the printed commencement program, taps the letter 'a' in "graduates")**

  Look at this little shape. An 'a'. Seems simple, right? For the last four years, six of you sitting right here have fought with me – gloriously, rigorously – about what actually *makes* this... an 'a'.

  Because here’s the thing nobody tells you when you first pick up a pen: **There is no single, perfect, essential 'a' hiding in the universe waiting to be discovered.**

  Think about it. Look at this ‘a’ on the program. Two stories. A little bowl, a little arch. Now, picture how you write one by hand. Probably one story – a circle, a stem down the side. No shared lines. No shared curves. Some ‘a’s have tails. Some are open. Some are loops. Some are sharp wedges on ancient stones.

  **So, if there’s no common shape… what makes them all ‘a’?**

  **(Pauses, looks out at the audience – parents, families, all the graduates)**

  It’s not a *shape*. It’s a *job*.

  An 'a' is whatever can reliably *do* what an 'a' needs to do. It has to hold its ground in the chaos of a word. Be unmistakably *not* an 'o'. *Not* an 'e'. *Not* a 'd'. Especially not when it’s tiny. Or smudged. Or carved in stone. Or glowing on a screen six pixels high. It has to perform its function – to be that specific sound, that specific marker – consistently, clearly, dependably. **The job is real.** The job defines it.

  And then? Then comes style. Hand a gifted type designer – like the ones we’re graduating today – just four letters of a new alphabet, and they’ll draw you the rest. Not because every letter shares some magic squiggle, but because they share a *way of making decisions*. A consistency of approach. A voice. Does the curve start abruptly or taper? How heavy is the stroke? How does it meet the baseline? That shared sensibility – that disciplined *way* of solving the problem of each letter – is what makes a typeface sing as one harmonious whole. Not sameness. Harmony.

  **(Turns more directly to the graduates, especially the type designers)**

  There is no secret essence inside the letter. There’s a demanding job that needs doing. And there’s a way – your way – of doing that job.

  **(Shifts gaze to encompass all graduates)**

  And isn’t that… everything? Not just for letters, but for the work you’re about to go out and do? For the lives you’re about to build?

  The world will try to sell you on the idea of an essential *you* – a perfect, fixed, discoverable core. Or worse, it will tell you it’s all arbitrary, that nothing really matters. Both are traps.

  **Because you are not defined by some pre-packaged essence waiting to be unearthed. You are defined by the job you choose to do in the world, and the distinct, unwavering *way* you choose to do it.**

  What problem will you solve? What need will you fill? What contribution will you reliably make? *That’s* the job. And how will you do it? With what integrity? With what particular blend of rigor and grace? With what unique perspective shaped by your struggles and your joys? *That’s* your style. Your voice.

  And here’s the counterintuitive truth my argumentative type designers know deep in their bones: **Your voice doesn’t exist in a vacuum. It only becomes audible, it only becomes *distinct*, against constraints.** Against the limits of the material. Against the demands of the problem. Against the need to be clear, to be functional, to *work* alongside others. You cannot be distinctive at nothing. The constraints aren't the enemy of your voice; they are the very thing that gives it shape and makes it heard. The job defines the form. The discipline defines the voice.

  So, Class of [Year], as you step out of here, don’t chase some mythical, perfect essence of yourself. Don’t drown in the idea that nothing matters. Instead, find the real work that calls to you. Show up for that job, every day. Learn its demands intimately. And then, bring your *way* to it. Your disciplined choices. Your consistent hand. Your unique sensibility. Wrestle with the constraints, not as limitations, but as the very ground from which your distinctive contribution will grow.

  Do the job. Do it your way. And trust that *that* – the reliable function performed with unmistakable character – is how you build something that lasts, something that holds its place, something that reads true, whether it’s six pixels tall or etched across the sky.

  Congratulations. Now go get to work.
