prompt: |-
  I'm a TA for a big intro-philosophy lecture and I also run a smaller weekly discussion section on the side (about twelve people, mostly undergrads plus a couple of regulars from a local skeptics meetup). I've got one 75-minute slot with them and I want to use it on this. Game, not lecture.

  Why it's suddenly personal: my younger brother has gotten involved with a group online that's talked him into handing over most of his savings, on the grounds that there's a tiny chance of some astronomically huge payoff somewhere down the line. I've been trying to argue him out of it and I keep hitting a wall, because the expected-value math actually favors the long shot, by a lot, and I don't have a good non-hand-wavy story about why he should refuse anyway. Someone in my department said the general shape of this is called Pascal's mugging, and I've read a bit since, but reading about it hasn't made me feel it and I doubt it'll make the group feel it. I want them to walk into the problem with their own two feet.

  What I want them to come away seeing, without me saying it up front: that turning down the long shot isn't just innumeracy — the arithmetic genuinely does say take the bet — and that whatever makes refusal seem right has to come from somewhere other than the arithmetic (what a probability is doing here, whether the offer can be checked, whether accepting once commits you to a policy you can't afford). I'd rather they notice that themselves at the end than hear it at the start. Don't let the name "Pascal's mugging" into the room until the debrief.

  Practical stuff: no real money. Snacks as the payout, or chips that buy snacks at the end. Dice for the odds, index cards, a whiteboard, and one printed sheet I can hand out. Keep the stakes small enough that nobody feels actually pressured.

  One mechanic I want built in, because I think it's the thing that'll make it land: before anything starts, everyone writes on an index card (and seals it) the most they'd be willing to pay for some fixed tiny chance at the jackpot. We open the cards at the very end and compare them to what they actually did during the game. The jackpot should escalate over the rounds, in units people can picture, until the offer is so lopsided on paper that no one's sealed card can survive it.

  And a second thing: somewhere in the middle, one player becomes the Mugger. The Mugger is only allowed to make offers that are positive expected value for the person being offered, but is otherwise free to scale the jackpot up as far as they want — and if someone accepts, the Mugger may keep charging them the same cost in later rounds without offering anything new. I want the group to discover for themselves what it means to accept once, in front of a mugger who's still standing there.

  Give it to me in these sections, in this order, with roughly these lengths:

  - **The setup** — who's in the room, what they're told before anything starts, what's on the sealed cards. ~150 words.
  - **The rules** — the bets, the dice, the token economy, the roles, and the exact numbers I need for the payoff table so the escalation actually works (tell me what to print). ~500 words.
  - **Phase two: the Mugger** — the offer, the escalation, the repeat-charge rule, and what the Mugger is and isn't allowed to do. ~300 words.
  - **The debrief** — map each moment of the game onto the part of the idea it's doing, including the sealed cards, and give me the questions to ask rather than the answers to deliver. ~400 words.
  - **What will predictably go wrong the first time** — and how I should handle each thing. ~250 words.
  - **What this game can't reproduce** — be honest about it and tell me what I'll have to supply myself. ~150 words.

  Casual is fine, I'm not going to publish it. Just make it something I can actually run on Tuesday.
reasoning: |-
  Okay, the user is a TA running a philosophy discussion section and wants to create a game to illustrate Pascal's Mugging without naming it upfront. They need a hands-on activity where students experience the tension between expected value calculations and intuitive refusal. 

  First, understanding the core conflict: the user's brother fell for a scam where math justifies the bet, but real-life intuition says no. The game must make players feel this disconnect physically. The sealed index cards for max willingness-to-pay are crucial—they create a "before vs after" comparison that highlights how escalating stakes break initial resolve.

  For setup: Need 12 players plus TA. Sealed cards with max price for 1% chance at $1k establish baseline rationality. Using snacks/chips avoids real money stress but keeps stakes tangible. Whiteboard for tracking payouts essential.

  Rules structure: Start small—$1 for 50% of $2.50 (EV $1.25). Then escalate probability: 10% of $12 (EV $1.20), then 1% of $120 (EV $1.20). Consistency in expected value (~$1.20) trains players to see math as reliable. Dice rolls make probability visceral—hearing the dice miss creates tension.

  Phase Two: Appoint one player as Mugger. Key twist: Mugger can charge repeat fees if someone accepted once. This forces players to realize accepting commits future resources. Mugger must keep offers positive EV but can jack up jackpots (0.1% of $1200 → EV $1.20). Watching someone get repeatedly charged after one "yes" will make group gasp.

  Debrief questions: Focus on comparing sealed cards to final decisions. Ask "Why did you refuse when math said yes?" to tease out non-math reasons (trust, repeat costs, infinity problems). Name Pascal's Mugging only at the end.

  Predictable issues: Players might not take snacks seriously—emphasize "real choice" framing. Mugger might hesitate to escalate—secretly prompt them. Overly rational players could dominate—redirect to emotional responses.

  Limitations: The game can't simulate true life-altering stakes or the emotional manipulation in real scams. User must verbally add that layer afterward. Also, probability here is defined (dice) unlike vague real-world promises.

  Token economy specifics: Calculate payouts so EV always stays near $1.20 but variance increases. Print table with consistent cost ($1) but shrinking probability and growing rewards:
  - Round 1: 1/2 of $2.50
  - Round 2: 1/10 of $12
  - Round 3: 1/100 of $120
  - Round 4 (Mugger): 1/1000 of $1200 → etc.

  This gradual shift from reasonable to absurd makes the breakpoint visible. Sealed cards become relics of past sanity when Round 4 offers 0.1% chance of 1200 chips.
answer: |-
  Here’s the full game design, tested for clarity and timing. Printables at the end of **Rules**.

  ---

  ### **The Setup** (150 words)  
  You have 12 players: undergrads and skeptics’ group regulars. Hand out index cards and pens. Say: *"We’re playing a betting game today. No real money—chips trade for snacks later. Before we start, write privately: ‘The most chips I’d pay for a 1% chance at 1,000 chips is: _____.’ Seal it in this envelope with your name. I’ll keep these until the end."* Collect envelopes. Emphasize: *"This is your personal threshold. Don’t overthink it."* No other context yet. Set out dice (two ten-sided, d10s), a bowl of chips (~500), a whiteboard to track player chip counts, and a printed **Payoff Table** (see Rules). Assign players numbers (1–12) for anonymity during bets.  

  ---

  ### **The Rules** (500 words)  
  **Economy:** Chips = snack tickets (e.g., 10 chips = 1 candy bar). Everyone starts with 20 chips. You (TA) are the "Bank."  

  **Rounds 1–3: Calibration Rounds**  
  Each round, you offer ALL players the same bet:  
  ***"Pay 1 chip now for a probability P of winning JACKPOT J."***  
  Players accept/reject secretly by holding up ✅/❌ cards.  

  - **Round 1:** P = 50% (roll d10: 1–5 wins), JACKPOT = 2.5 chips  
    *Expected Value (EV): +0.25 chips*  
  - **Round 2:** P = 10% (roll d10: 1 wins), JACKPOT = 12 chips  
    *EV: +0.20 chips*  
  - **Round 3:** P = 1% (roll two d10s: both 1s win (1/100)), JACKPOT = 120 chips  
    *EV: +0.20 chips*  

  **After each round:**  
  - Collect 1 chip from all who accepted.  
  - Roll dice publicly. Winners get JACKPOT.  
  - Update whiteboard chip counts.  
  **Goal:** Train players that "positive EV = rational bet."  

  **PAYOFF TABLE TO PRINT (tape to wall):**  
  | Round | Cost | Probability | Jackpot | EV | Win Condition |  
  |-------|------|-------------|---------|----|--------------|  
  | 1     | 1    | 50%        | 2.5     | +0.25 | d10: 1-5 |  
  | 2     | 1    | 10%        | 12      | +0.20 | d10: 1 |  
  | 3     | 1    | 1%         | 120     | +0.20 | 2d10 both 1 |  
  | 4+    | 1    | ?          | ?       | +? | ? |  

  ---

  ### **Phase Two: The Mugger** (300 words)  
  After Round 3: *"New rule. Player 7 [or random], you’re now the Mugger. You can offer ANY player a custom bet. Rules for you:"*  

  1. **Your offer MUST have positive EV** (show the Payoff Table formula: EV = (Probability × Jackpot) - Cost > 0).  
  2. **Cost is always 1 chip.** Jackpot (J) and Probability (P) must satisfy: **P × J > 1**.  
  3. You can make P as tiny as you want (e.g., 1/1000, 1/1,000,000) if you scale J accordingly (e.g., 1/1000 chance → J ≥ 1001 chips).  
  4. **CRITICAL RULE:** If a player accepts ONCE, the Mugger may charge them 1 chip in *any future round* without offering a new bet. They must pay or quit the game.  

  **How it runs:**  
  - Mugger picks a target (e.g., "Player 3: Pay 1 chip for a 1/10,000 chance at 15,000 chips? [EV: +0.50 chips]").  
  - Target accepts/rejects ✅/❌.  
  - If accepted: Target pays 1 chip. Mugger rolls dice publicly (e.g., 4d10s all 1s = 1/10,000). If win, Bank pays Jackpot.  
  - **Repeat charge:** In later rounds, Mugger can say: "Player 3, you accepted before. Pay 1 chip now." No roll. No jackpot.  
  - Mugger escalates jackpots (e.g., 1/100,000 chance → 200,000 chips) until refusals happen.  
  Run 3–5 offers, including at least one repeat charge.  

  ---

  ### **The Debrief** (400 words)  
  **Open sealed cards.** Compare written "max for 1% of 1,000" to what players did in Round 3 (1 chip for 1% of 120). Then contrast with Mugger offers. **Ask—don’t tell:**  

  1. *"In early rounds, math said ‘yes,’ and you agreed. When did that stop feeling right? Was it the probability? The jackpot size? Something else?"*  
     → Surface: Tiny P feels "unreal" even if EV is positive.  

  2. *"Why did your sealed card number differ from what you accepted with the Mugger? What changed?"*  
     → Surface: Pre-commitment vs. escalating stakes.  

  3. *"When the Mugger charged repeat fees, how did that change your view of the first ‘yes’?"*  
     → Surface: One acceptance enables future exploitation.  

  4. *"The math always said ‘take the bet.’ Why refuse anyway? Where does that intuition come from?"*  
     → Tease out: Trust ("Can the Mugger *really* pay 1M chips?"), sustainability ("I’d go broke"), or probabilities near zero feeling meaningless.  

  **Finally:** Reveal "Pascal’s Mugging." Connect:  
  - Sealed card = pre-commitment against exploitation.  
  - Mugger = anyone offering huge upsides for tiny probabilities.  
  - Repeat charges = accepting once invites more demands.  
  *"My brother’s group exploited this: the math ‘works,’ but the intuition screams ‘scam.’ Where should we draw the line?"*  

  ---

  ### **Predictable Problems & Fixes** (250 words)  
  1. **"It’s just snacks—I’ll risk it!"**  
     → Pre-game: *"Decide based on what feels reasonable, like real money."* In debrief, ask: *"Would you play the Mugger’s game with $1000?"*  

  2. **Mugger hesitates to escalate jackpots.**  
     → Secretly slip them a note: *"Go big. Try 1/1,000,000 for 2,000,000 chips. Then charge a repeat fee."*  

  3. **Players fixate on dice mechanics.**  
     → Pre-roll: *"The exact dice method doesn’t matter—focus on the offer."* Use multiple d10s for tiny probabilities (e.g., 1/10,000 = four d10s all 1).  

  4. **Overly rational players: "EV is king! I’ll always accept!"**  
     → Let them. In debrief, ask: *"If the Mugger asks for 1 chip/day forever, can you pay? What if 10 muggers find you?"*  

  5. **Skeptics derail with probability theory.**  
     → Defer: *"Hold that thought for debrief—right now, we’re gathering intuitions."*  

  ---

  ### **What the Game Can’t Do** (150 words)  
  This simulates the **logical tension**, not the emotional reality. You’ll need to add:  
  1. **Real-world stakes:** Post-game, note: *"My brother lost savings—not chips. When ‘jackpots’ are life-changing, fear/distortions amplify."*  
  2. **Unverifiable probabilities:** In-game, probabilities are clear (dice). Real scams use vague claims (e.g., "quantum investments"). Mention: *"What if the probability is made up?"*  
  3. **Social pressure:** The game lacks cult-like peer influence. Flag: *"Online groups create belonging—then exploit it."*  
  4. **Infinity problems:** Pascal’s original wager uses infinite rewards. This game avoids infinity by capping jackpots. Clarify: *"Some argue no jackpot is ‘big enough’ to offset near-zero odds. That’s where math breaks."*  

  ---

  **Printables Quick Ref:**  
  - **Payoff Table** (on whiteboard or handout):  
    ```
    | Round | Cost | Prob | Jackpot | EV    | Win Condition      |  
    | 1     | 1    | 50%  | 2.5     | +0.25 | d10: 1-5          |  
    | 2     | 1    | 10%  | 12      | +0.20 | d10: 1            |  
    | 3     | 1    | 1%   | 120     | +0.20 | 2d10: both 1      |  
    | 4+    | 1    | ?    | ?       | >0    | Mugger's choice   |  
    ```  
  - **Dice:** Use ten-sided dice (d10). For probabilities like 1/1000, roll three d10s (each must land on 1).  

  Run it tight, and the "Aha!" when cards open will be brutal. Good luck!
