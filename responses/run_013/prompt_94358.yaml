answer: |-
  ## Joint Statement on Moral Luck: Areas of Agreement, Disagreement, and Cruxes

  **Parties:**  
  Party A (Control-Principle Hardliner)  
  Party B (Moral-Luck Realist)

  **Preamble:**  
  We, the undersigned, acknowledge a profound and persistent disagreement regarding the relationship between luck, control, and moral responsibility. We recognize that each position captures significant and seemingly ineliminable aspects of our moral practices and intuitions. This statement aims to clarify our points of agreement, pinpoint our core disagreements descriptively and normatively, identify the cruxes that divide us using a shared test case, propose an operational criterion, and assess the nature of our dispute. We affirm each other’s competence and the genuine force of the opposing arguments.

  **I. Shared Claims (Agreed Upon by Both Parties):**

  1.  **The Primacy of Intent/Recklessness:** Both parties agree that an agent’s intentions, choices, and the degree of recklessness or negligence *displayed in action* are fundamental to moral assessment. A reckless driver is morally distinct from a careful one, regardless of outcome.
  2.  **Epistemic Limitations are Real:** Both agree that our *warrant* for blaming, and the practical expression of blame, often depend on factors outside the agent’s control (like outcome or discovery). We lack perfect access to agents' inner states and intentions. Party A emphasizes this point; Party B acknowledges its significance.
  3.  **Control Matters:** Both agree that an agent’s *control* over their will and actions is necessary for moral responsibility in the core cases. We do not blame agents for outcomes they could not possibly have foreseen or influenced through any reasonable exercise of agency. Party B concedes that the control principle captures a vital constraint: without *any* control, there is no genuine responsibility.
  4.  **Concession on "Appearance" (B to A):** Party B concedes that *some* intuitions of increased blameworthiness due to outcome luck *can* be explained, at least partially, by epistemic factors (e.g., outcome providing vivid evidence of negligence previously hidden, or triggering stronger emotional responses).
  5.  **Concession on "Real Effect" (A to B):** Party A concedes that Party B’s strongest cases (e.g., the negligent driver who kills vs. the identical driver who doesn't; the failed assassin vs. the successful one; the discoverable betrayal vs. the hidden one) reveal a deep, persistent, and phenomenologically powerful feature of our *actual moral practices*: outcomes *do* seem to make a non-epistemic difference in our felt responses and judgments of blameworthiness *in these specific contexts*. Party A grants that this is not *merely* a mistake or illusion; it reflects something structural about how humans experience and practice blame.
  6.  **The Practice is Inconsistent:** Both agree that our actual blaming practices exhibit tensions regarding luck. We sometimes resist outcome-luck (e.g., excusing unforeseeable accidents), yet at other times seem deeply influenced by it (e.g., differential blame for identical recklessness with different results).

  **II. Residual Disagreements (Stated Fairly by Each Side):**

  1.  **Descriptive Question (What our practices *in fact* track):**
      *   **Party A:** "Our blaming practices *aim* to track the agent’s quality of will (intentions, choices, reasons responsiveness) and the degree of their controllable negligence/recklessness. Apparent tracking of outcomes is an artifact of epistemic limitations and emotional salience, leading to systematic error in application." (A sees outcome-influence as a *bug* in the system)
      *   **Party B:** "Our blaming practices *in fact* track a complex relation that inherently incorporates the actual moral significance of the agent’s actions within the world, which includes outcomes and consequences the agent did not control. Outcome-luck is a constitutive element shaping the *nature* of the responsibility relation itself in many contexts." (B sees outcome-influence as a *feature* of the system)

  2.  **Normative/Metaphysical Question (What practices *ought* to track / What desert *really is*):**
      *   **Party A:** "Moral desert and blameworthiness *ought* to track, and *only* track, what was within the agent’s control: their intentions, choices, and the foreseeable risks they culpably ignored or accepted. Factors beyond control (like outcomes) are irrelevant to *true* blameworthiness; incorporating them is a normative error, making blame contingent on fate rather than agency." (Desert is metaphysically grounded solely in controlled aspects of the agent)
      *   **Party B:** "Moral desert and responsibility are *constituted* by the agent’s action (including its quality of will) *as embedded within the actual causal and normative fabric of the world*. The actual consequences and moral meanings realized in the world, even if luck-infused, are essential components of what makes an agent blameworthy *for a particular wrong*. True blameworthiness *can* vary with luck without being arbitrary." (Desert is metaphysically grounded in the agent-in-the-world nexus)

  **III. Cruxes and the Test Case:**

  *   **Shared Test Case:** Driver 1 and Driver 2 are identical in all controllable respects (BAC, speed, attention, skill, route) rounding a blind corner. In World 1, a child is present and killed; Driver 1 learns this. In World 2, the child was called inside moments earlier; Driver 2 never learns a child was present. Assume perfect knowledge of all facts by us, the assessors.

  *   **Crux 1: Does Blame Admit of a Truth-Like Standard Independent of Outcome?**
      *   **Case Bearing on it:** The Driver Test Case.
      *   **Party A Prediction:** Driver 1 and Driver 2 are *equally blameworthy* (for reckless endangerment). Driver 1's *warranted* blame is greater (due to knowledge and harm), and the *expression* of blame will differ, but their fundamental *desert* is identical.
      *   **Party B Prediction:** Driver 1 is *more blameworthy* than Driver 2. The actual killing, and its moral significance, changes the nature of Driver 1's responsibility.
      *   **Double Crux:**
          *   *For A to move to B:* A would need to be convinced that the increased blame directed at Driver 1 is not *just* a function of stronger evidence or emotional response, but reflects a judgment that is *correct* or *true* in a way that wouldn't hold if the child had lived, *even knowing all the controllable facts were identical*. A would need to see that "blameworthiness for killing" is a distinct, irreducible moral status dependent on the outcome.
          *   *For B to move to A:* B would need to be convinced that the *only* reason Driver 1 seems more blameworthy is because we, knowing the outcome, *project* the harm backward onto the agent's will in a way that is metaphysically unfounded and confuses the *object* of blame (the reckless state) with its tragic *result*. B would need to see that Driver 1's desert is fully fixed at the moment of action and is identical to Driver 2's, with all other differences being non-desert-related.

  *   **Crux 2: Is Responsibility Unitary or a Family of Relations?**
      *   **Case Bearing on it:** Comparing negligence causing death vs. "mere" negligence causing no harm vs. intentional wrongdoing.
      *   **Party A Prediction:** Responsibility is fundamentally unitary: it is about the agent's culpable state (intentional, reckless, negligent) *regardless* of outcome. Differences in blame for different outcomes of identical culpability are differences in *expression* or *warrant*, not in the core desert relation.
      *   **Party B Prediction:** Responsibility is a family of distinct relations. "Responsibility for a tragic outcome caused by negligence" is a different moral relation (with different implications for desert and blame) than "responsibility for reckless endangerment that luckily caused no harm," even if the underlying negligence is identical. These relations share core elements (like control over the initial action) but are not reducible to a single metric.
      *   **Double Crux:**
          *   *For A to move to B:* A would need to be convinced that attempts to reduce "blame for killing" to "blame for recklessness + harm" fail to capture the *sui generis* moral gravity of having *actually caused* a terrible outcome, a gravity that genuinely attaches to the *agent* in a way distinct from their recklessness alone.
          *   *For B to move to A:* B would need to be convinced that the apparent differences in desert between the negligent killer and the merely negligent driver are fully explicable as differences in the *manifestation* or *consequences* of the *same* underlying culpable state, combined with non-desert-related responses to harm, and that positing distinct relations is unnecessary and obscures the core of agency.

  **IV. Operational Criterion for Outcome-Luck Affecting Desert (vs. Epistemic Warrant):**

  *   **Proposed Criterion:** *"An agent's degree of blameworthiness has been altered by outcome-luck (rather than merely our warrant for blaming) if a fully informed, rational, and impartial moral judge, knowing all facts *including* counterfactual outcomes, would ascribe different levels of blameworthiness to two agents whose controllable actions and mental states were identical but whose outcomes differed."*

  *   **Falsifiability:**
      *   **Party A (Predicts criterion falsified):** Party A would concede its position is falsified if such a judge *consistently* and *reasonably* ascribed greater blameworthiness to the agent with the worse outcome, *even while affirming the identity of controllable factors*, and if this judgment could not be explained solely by the judge's emotional response to the harm or its role as evidence. A would see this as evidence that outcome directly shapes desert.
      *   **Party B (Predicts criterion confirmed):** Party B would concede its position is falsified if such a judge, under the stipulated conditions, *never* ascribed different levels of blameworthiness based solely on outcome differences when controllable factors were identical. B would see this as evidence that outcome-luck only affects warrant/expression, not desert.

  **V. Verdict on Verbal Disagreement:**

  We agree that **the core dispute is not merely verbal.** While terms like "responsibility," "blameworthiness," and "desert" are central, our disagreement stems from fundamentally different conceptions of what these terms refer to *in the world*.

  *   **Why not verbal?** Party A uses "desert" to refer to a property grounded solely in the agent's controlled attitudes and actions. Party B uses "desert" to refer to a property grounded in the agent's action *as situated in the actual world with its consequences*. We are not simply using the same word for different concepts; we are disputing which concept *correctly describes the normative and metaphysical foundations of moral assessment*. We agree that the *phenomenology* of outcome-luck is real (B's point), and we agree that control is necessary (A's point). The disagreement is over whether the phenomenology reflects a deep normative/metaphysical truth (B) or a persistent error stemming from epistemic and psychological limitations (A). This is a substantive disagreement about the nature of morality and agency.

  **Signatories:**

  *   _________________________ (Party A, Control-Principle Hardliner)
  *   _________________________ (Party B, Moral-Luck Realist)
