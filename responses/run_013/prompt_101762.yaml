  Okay, the user is in an ethics seminar that's deeply divided on nudging. They've spent weeks on it, and the class is split into two camps: one pro-nudging as libertarian paternalism, the other anti-nudging on autonomy grounds. The professor introduced a substitute/supplement distinction that's become a flashpoint. The user wants to write a term paper that's a joint statement both sides could sign—so it needs neutral, fair language that captures agreements, disagreements, and cruxes without bias.

  First, I need to outline what both camps agree on. Common ground likely includes: nudges are ubiquitous, they work through psychology, autonomy is important, effectiveness matters for evaluation, and transparency is key. I should phrase these points neutrally, avoiding loaded terms like "manipulation" or "paternalism." 

  Next, the disagreements. Camp 1 sees nudges as harmless helps that preserve choice, while Camp 2 views them as autonomy violations even with opt-outs. The substitute/supplement distinction is central—Camp 1 might accept it as valid, while Camp 2 sees it as impractical or irrelevant. Also, the nature of harm: is it about welfare or autonomy? And what counts as "authentic" preference? Each point must be stated in language each side would endorse. 

  For the cruxes, I need concrete cases. The substitute/supplement debate could use the organ donation default: if someone opts out despite the default, does that prove it's supplemental? Predictions differ. The harm question could use a calorie label nudge: if it helps health but feels intrusive, is the harm autonomy-based? I'll design cases where both sides engage, showing their reasoning. 

  Language disputes: terms like "manipulation" or "authentic preference" might be sticking points. Clarifying those could reduce friction. The goal is to make the statement a tool for clearer debate, not a resolution. I'll keep it structured and precise, as the user requested—no citations, just the document.
answer: |-
  ## Joint Statement on Nudging: Common Ground, Precise Disagreements, and Testable Cruxes

  This statement aims to articulate shared premises, clarify core disagreements fairly, and identify key testable cruxes in the debate between the described perspectives on nudging (hereafter "Camp 1" and "Camp 2").

  **I. Shared Premises (Points of Agreement):**

  1.  **Nudges Are Ubiquitous:** Both sides agree that influencing choice architecture (defaults, framing, presentation) is unavoidable in any social context. A state of "no nudge" is practically impossible.
  2.  **Nudges Leverage Psychology:** Both sides acknowledge that nudges work by exploiting predictable features of human cognition and decision-making (heuristics, biases, attention limits) rather than solely through rational deliberation.
  3.  **Autonomy Holds Intrinsic Value:** Both sides accept that respecting individual autonomy is a fundamental ethical principle. Interfering with a person's capacity for self-governance requires strong justification.
  4.  **Outcomes Matter:** Both sides agree that the actual welfare consequences (e.g., health, financial security, subjective well-being) resulting from a nudge are relevant to its ethical evaluation, even if not the *only* factor.
  5.  **Transparency is Relevant:** Both sides acknowledge that the transparency or opacity of a nudge can be ethically significant, though they may differ on *how* significant or what transparency entails.
  6.  **Core Definition of Nudge:** Both sides operate with a shared core understanding of a "nudge": any aspect of the choice architecture that predictably alters people's behavior without forbidding options or significantly changing economic incentives.

  **II. Precise Statements of Core Disagreements:**

  1.  **The Nature of the Primary Ethical Concern:**
      *   **Camp 1:** The primary ethical concern with nudging is the potential for *welfare harm* (leading people to choices contrary to their own best interests) or the *removal of meaningful choice*. Absent these, nudging is generally permissible, especially if it helps people achieve what they *would* want upon reflection.
      *   **Camp 2:** The primary ethical concern with nudging is the potential *violation of autonomy*, understood as disrespecting the individual's *process* of reasoning and decision-making, even if the outcome is beneficial and choice remains formally available. "Opting out" does not necessarily remedy this violation if the nudge bypassed reasoning in the first place.

  2.  **The Validity and Practicality of the Substitute/Supplement Distinction:**
      *   **Camp 1:** The distinction between nudges that *substitute* for the target's reasoning (doing the deciding for them) and those that *supplement* it (aiding their own deliberation) is both valid and crucial. Only substitutive nudges raise serious autonomy concerns under typical circumstances. This distinction *can* be meaningfully drawn in practice through evidence of reflective endorsement or predictable divergence from considered preferences.
      *   **Camp 2:** The substitute/supplement distinction is conceptually unstable or impossible to apply reliably in practice. Most effective nudges inherently *bypass* reasoning to some degree; the line is arbitrary. Focusing on "supplementing" underestimates how seemingly helpful information or framing can still hijack or pre-empt authentic deliberation.

  3.  **The Relationship Between Choice Architecture and "Authentic" Preference:**
      *   **Camp 1:** Preferences are often latent, context-dependent, and inconsistent. Nudges can help individuals reveal or act upon preferences they *would* hold under better conditions (more time, information, cognitive resources), making the resulting choice more "authentic" to their underlying interests.
      *   **Camp 2:** Preferences formed or acted upon *because* of a specific nudge, especially one bypassing deliberation, lack authenticity. Authenticity requires that the choice emerges from the individual's *own* reasoning process, respecting their agency *in the moment*, not just hypothetical "better" conditions. A nudge determining the choice undermines this authenticity.

  **III. Key Testable Cruxes and Predictive Cases:**

  1.  **Crux 1: Does the Substitute/Supplement Distinction Hold Water (Conceptually and Practically)?**
      *   **Concrete Case:** Consider a retirement savings plan with a high default contribution rate (e.g., 10%). *Assume evidence shows:* (a) Most employees stay at the default. (b) Surveys show most employees who stay at the default *express satisfaction* with their savings rate later. (c) However, behavioral economists predict that if the default were 3%, most people would stay at *that*, saving significantly less, and later express regret.
      *   **Camp 1 Prediction:** This is a clear case of *supplementation*. The default helps people achieve what they reflectively want (adequate savings) but struggle to implement due to present bias/inertia. The later satisfaction and predicted regret at lower savings confirm this. The nudge aids reasoning about long-term goals.
      *   **Camp 2 Prediction:** This is *substitution*. The default rate effectively *decides* for most people. Their later satisfaction likely reflects post-hoc rationalization or adaptation, not authentic endorsement. The fact they wouldn't have chosen 10% actively *at the time of enrollment* shows the nudge bypassed their reasoning. The distinction collapses here.

  2.  **Crux 2: Is the Core Harm of Problematic Nudges Primarily to Welfare or to Autonomy?**
      *   **Concrete Case:** A cafeteria uses bright red "Stop!" labels on unhealthy desserts, significantly reducing their selection. *Assume:* (a) The labels demonstrably improve average nutritional intake. (b) Most patrons report appreciating the nudge afterwards. (c) However, some patrons feel a distinct sense of irritation or being "steered," even when they choose the healthy option, describing it as "being treated like a child."
      *   **Camp 1 Prediction:** The core concern is welfare, which is improved. The irritation of a minority is outweighed by the overall benefit and the majority's appreciation. The formal choice remains, minimizing autonomy harm. Opting out (choosing dessert anyway) resolves the autonomy concern for those who feel it.
      *   **Camp 2 Prediction:** The core harm is to autonomy, experienced even by those who choose healthily *because of the nudge* and by those who feel irritated. The "Stop!" label deliberately triggers an automatic aversion response, bypassing reasoned consideration of the choice (e.g., "I want a small treat tonight"). The welfare gain does not negate this disrespectful process. Opting out doesn't undo the initial bypass.

  3.  **Crux 3: Can "Reflective Endorsement" Retroactively Validate a Nudge that Bypassed Initial Reasoning?**
      *   **Concrete Case:** An app uses subtle gamification and social comparison (e.g., "You're in the top 20% of savers!") to encourage increased savings deposits. *Assume:* (a) Savings increase significantly. (b) Users report feeling motivated by the features. (c) When shown later *how* the app influenced them (the specific triggers), some users feel surprised and slightly manipulated, though they acknowledge the positive outcome and say they *now* endorse saving more.
      *   **Camp 1 Prediction:** The later reflective endorsement validates the nudge. The initial bypass was a tool to help achieve a goal the user now authentically embraces. The end result aligns with the user's considered interests.
      *   **Camp 2 Prediction:** The initial manipulation remains problematic. The later endorsement might be influenced by the sunk cost of saving or post-hoc justification. The *process* of using non-rational triggers without the user's awareness at the time of decision disrespects their agency. Endorsement after the fact doesn't cure the initial autonomy violation.

  **IV. Potential Language Disputes:**

  Part of the disagreement may stem from differing connotations of key terms:
  *   **"Manipulation":** Camp 2 uses this broadly for influence bypassing reasoning. Camp 1 often reserves it for deceptive or coercive influence, seeing benign nudges as distinct.
  *   **"Authentic Preference":** Camp 1 focuses on preferences aligned with underlying interests (revealed by outcomes/endorsement). Camp 2 focuses on preferences formed through an agent's own conscious reasoning process.
  *   **"Respect for Autonomy":** Camp 1 emphasizes preserving choice and promoting welfare (seen as respecting future autonomy). Camp 2 emphasizes respecting the *process* of decision-making itself in the present moment.

  **Conclusion:** This statement clarifies that the debate centers on *how* nudges interact with reasoning (Substitute/Supplement), the *nature* of the core ethical harm (Welfare vs. Autonomy), and the *validity of retrospective endorsement*. The concrete cases provide focal points where each camp's core assumptions yield distinct predictions and interpretations, moving beyond talking past each other to testable disagreements.
