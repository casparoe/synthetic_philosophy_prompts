answer: |-
  Here’s a rigorous desiderata list for emotion theories, structured to meet your specifications. Key tensions and test cases are integrated throughout.

  ---

  ### **Non-Negotiable Core Requirements**  
  *(Any adequate theory must explain these, regardless of camp)*  

  1. **Phenomenal Character**  
     *Requirement*: Explain the subjective *feel* of emotions (e.g., heaviness of grief, heat of anger).  
     *Test Case*: Your surgical patient lacks all phenomenal experience despite fear’s full functional profile. A theory must deny this is fear *or* explain how phenomenality is non-essential (e.g., by decoupling "emotion" from "feeling").  
     *Why Non-Negotiable*: Introspective reports of feeling are primary data.  

  2. **Functional Adaptiveness**  
     *Requirement*: Explain how emotions solve evolutionary problems (e.g., fear promoting survival via avoidance).  
     *Case*: If fear tracks danger but lacks phenomenology, the theory must clarify whether functional success suffices for emotionhood.  
     *Why Non-Negotiable*: Emotions exist across species with shared adaptive functions.  

  3. **Intentionality/Object-Directedness**  
     *Requirement*: Account for emotions being *about* something (e.g., fear *of* a snake).  
     *Tension*: Must reconcile with objectless states (moods, free-floating anxiety). A theory cannot collapse moods/emotions but must explain their kinship (e.g., moods as generalized intentional states).  
     *Why Non-Negotiable*: Without intentionality, emotions reduce to meaningless sensations.  

  4. **Physiological Embodiment**  
     *Requirement*: Explain bodily changes (autonomic arousal, facial expressions) and their necessity.  
     *Reverse Test Case*: If someone feels "fear’s turbulence" without appraisal/behavior, is it fear? A theory must decide if embodiment is constitutive or contingent.  
     *Why Non-Negotiable*: Emotions are corporeal events (neural, hormonal, behavioral).  

  ---

  ### **Contested Requirements**  
  *(Where camps diverge; theories may satisfy some but not others)*  

  5. **Appraisal Dependence**  
     *Requirement*: Must emotions require cognitive evaluations (e.g., "this is a threat")?  
     *Preference*: Central for appraisal theories; rejected by basic emotion theories.  
     *Test*: Reverse surgical case—full phenomenology + physiology but *no* appraisal. Appraisal theories must deny this is emotion; feeling theories may accept it.  

  6. **Self-Knowledge Fallibility**  
     *Requirement*: Allow for systematic error in self-reported emotions (e.g., misattribution, repression).  
     *Preference*: Non-negotiable for psychoanalytic/constructivist theories; contested by phenomenal-privilege views.  
     *Case*: Surgical patient’s sincere denial challenges theories privileging first-person authority.  

  7. **Cross-Cultural Variation**  
     *Requirement*: Explain both universals (e.g., shared facial expressions) and cultural divergences (e.g., emotion concepts like *schadenfreude* or *awumbuk*).  
     *Preference*: Essential for social constructivists; downplayed by basic emotion theorists.  
     *Tension*: Must avoid biological determinism *or* radical relativism.  

  8. **Animal-Human Continuity**  
     *Requirement*: Explain similarities (e.g., rodent fear responses) without reducing human emotions to animal affect.  
     *Preference*: Non-negotiable for evolutionary/biological theories; peripheral for social constructivists.  

  9. **Action-Readiness**  
     *Requirement*: Link emotions to motivation (e.g., anger preparing to fight).  
     *Preference*: Central for functionalist/perceptual theories; optional for feeling theories.  

  ---

  ### **Surgical Test Case Resolution**  
  - **Case 1 (No Feelings, Full Functional Profile)**:  
    - *Appraisal/Functional Theories*: Likely count as fear (satisfies adaptiveness + intentionality).  
    - *Feeling/Perceptual Theories*: Deny it is fear (lacks phenomenality).  
  - **Reverse Case (Feelings + Physiology, No Appraisal)**:  
    - *Feeling Theories*: Count as emotion (e.g., "primordial fear").  
    - *Appraisal Theories*: Reject (no cognitive evaluation).  

  ---

  ### **Key Tensions & Exclusionary Power**  
  - **Most Exclusionary Requirement**: **Intentionality + Moods**.  
    - *Why*: Forces theories to explain objectless states without reducing emotions to sensations. Basic emotion theories (e.g., Ekman) struggle with moods; pure feeling theories (e.g., James) collapse intentionality.  
  - **Suspect Tension**: **Phenomenal Character vs. Cross-Cultural Variation**.  
    - *Conflict*: If phenomenology is universal (e.g., anger always *feels* hot), how do cultural constructs (e.g., *liget* in the Ilongot) create distinct experiences? Perceptual theories (e.g., Prinz) face strain here.  

  ---

  ### **Theoretical Scorecard**  
  | Requirement               | Feeling Theories | Appraisal Theories | Perceptual Theories |  
  |---------------------------|------------------|---------------------|----------------------|  
  | Phenomenal Character      | ✅✅             | ⚠️ (Secondary)     | ✅                  |  
  | Intentionality/Moods      | ❌               | ✅                  | ⚠️ (Moods fuzzy)    |  
  | Appraisal Dependence      | ❌               | ✅✅                | ⚠️ (Somatic markers)|  
  | Cross-Cultural Variation  | ❌               | ⚠️                 | ✅                  |  
  | Animal-Human Continuity   | ✅               | ❌ (Cognition-heavy)| ✅                  |  
  | Surgical Case 1 (No Feel) | ❌               | ✅                  | ❌                  |  

  **✅✅** = Core strength | **⚠️** = Partial | **❌** = Weakness  

  ---  
  This framework ensures theories are stress-tested against edge cases, cross-species/cultural realities, and conceptual fissures. The surgical dilemma alone excludes pure-feeling or pure-appraisal accounts, while the mood/emotion distinction demands nuance on intentionality. Assign readings that explicitly grapple with these fault lines (e.g., Griffiths vs. Barrett on biology/construction).
