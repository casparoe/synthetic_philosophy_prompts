prompt: |-
  I sit on the ethics committee at a long-term neuro-rehab hospital, and I have to circulate a written opinion before Thursdays meeting. A vendor is pitching us a "consciousness index": they run a patient through an EEG/fMRI paradigm and it spits out a number they claim tracks whether there's any subjective experience there at all. Their whole pitch rests on higher-order theories -- the index is supposed to pick up the top-down, higher-order signals that (on those theories) are what make a brain state conscious rather than merely processed. Half our clinicians want to use it to decide whether we keep a woman in a minimally-conscious-ish state on standing pain meds or shift her toward comfort-focused care; her family keeps asking us what she actually feels. The other half says the whole thing is circular -- you can't validate a consciousness detector without already knowing which patients are conscious -- and that whatever it's measuring is probably attention or reportability, not experience. Draft the opinion for me: a concrete recommendation (approve, reject, or approve with conditions, with a time frame) plus the reasoning, and give the strongest consideration on the side I end up rejecting its best shot rather than a strawman. I'm not asking what higher-order theories say in the abstract -- tell me what work they can and can't actually do in a decision like this, and where the "no-report" worry really bites. No citations, we're not writing a paper.
