  ### Iterated Strict Dominance Procedure for Payoff Matrix Pruning

  The following procedure eliminates strictly dominated moves for a given player (row player in this context) using iterative checks for pure and mixed strategy dominance. It assumes rationality of the row player and common knowledge of rationality but makes no assumptions about the opponent's payoffs or rationality. Weak dominance is excluded due to order-dependence issues. The procedure stops when no more moves can be eliminated by strict dominance.

  | Step | What the Step Checks | Test for Coding | Delete if | Keep if | Assumes About Opponent | How It Misfires |
  |------|----------------------|-----------------|-----------|---------|-------------------------|-----------------|
  | 1 | Pure strict dominance (one round) | For each row i and row k ≠ i, check if all payoffs in k are > payoffs in i (across all opponent columns). | Any such k exists | No such k exists | Nothing (tests all opponent columns) | Fails to eliminate moves dominated only by mixed strategies. |
  | 2 | Mixed strict dominance (one round, if Step 1 deleted nothing) | For each row i, solve LP: <br> max ε <br> s.t. Σ_{k≠i} (λ_k * payoff_kj) ≥ payoff_ij + ε, ∀j <br> Σ_{k≠i} λ_k = 1, λ_k ≥ 0 | Optimal ε > 0 (with tolerance, e.g., 1e-5) | Optimal ε ≤ 0 or LP infeasible | Nothing (tests all opponent columns) | Computationally expensive; numerical instability for near-zero ε. |
  - **Procedure stops** if no deletions occur in a full iteration (Steps 1 and 2). Output is the set of surviving moves.
  - **Order of deletions**: For strict dominance (pure or mixed), order does not matter—final surviving set is unique.
  - **"Never a best response" vs. strict dominance**: In 2-player games, these are equivalent. In ≥3-player games, they diverge (see Case 3).
  - **What the procedure cannot do**:
    - Eliminate weakly dominated moves (avoids order-dependence).
    - Prune opponent moves without their payoffs.
    - Resolve indeterminacy when multiple non-dominated moves survive (common—judgment required).

