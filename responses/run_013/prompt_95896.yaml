  ### Key Takeaways
  1. **Order and Dominance Type**: Use strict dominance only—order doesn't matter. Weak dominance is excluded due to order-dependence (shown in Case 2).
  2. **Best Response vs. Dominance**: In 2-player games, "strictly dominated" ≡ "never a best response." In ≥3 players, they diverge (Case 3 shows a move can be never a best response but not strictly dominated).
  3. **Limitations**: 
     - Expect many models to retain multiple moves (e.g., Case 1 leaves 2/3 moves). Supplement with judgment or additional criteria.
     - Opponent moves aren’t pruned (no payoff data).
     - Mixed dominance checks add computational cost but are necessary.
