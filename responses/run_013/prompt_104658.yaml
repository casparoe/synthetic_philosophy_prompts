answer: |-
  Here are five numbered points addressing your query:

  1.  **Borges accurately depicts the *expansive potential* of lotteries to replace elections entirely (aligning with Guerrero/Van Reybrouck), but crucially **confuses sortition (selecting *agents* randomly)** with **randomly assigning *outcomes* directly (like torture)** – a conflation absent in serious lottocratic theory which selects decision-makers, not decisions themselves.
  2.  **The story highlights a key distinction: procedural fairness (random draws) does not automatically confer legitimacy.** Borges's lottery becomes universally binding despite its cruelty, whereas real sortition systems (like Athenian isonomia or modern proposals) depend on public acceptance and constitutional grounding for legitimacy, absent here.
  3.  **The Company's secrecy isn't just atmosphere; it underscores the total *erosion of accountability*.** Unlike transparent sortition models requiring oversight and designated bodies (Landemore's open democracy), the invisible Company embodies the danger of randomness *without* traceable responsibility or redress.
  4.  **It functions less as a *reductio* of lottocracy and more as a warning about the *abdication of human judgment and agency*.** The problem isn't random selection per se, but the system's evolution into a mechanism where *no one chooses or takes responsibility for anything*, reducing life to pure, administered chance.
  5.  **Borges adds the visceral, lived *experience of losing individual agency and facing arbitrary power* under total randomization,** a psychological and existential dimension often abstracted in theoretical debates about fairness, procedure, and legitimacy in sortition systems.
