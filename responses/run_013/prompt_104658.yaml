  I'm putting together a session on sortition and lottocracy and I want to use Borges's "The Lottery in Babylon" as the anchor text, since unlike Shirley Jackson's story it's actually about a lottery that runs a whole society and not just one stoning. In Borges the draw starts out as a normal raffle and then quietly swallows everything — money, offices, whether you get tortured, whether you live — and the Company behind it is either invisible or nonexistent, depending on who you ask. I want a reading that takes both the story and the real sortition literature seriously (the lottocracy crowd like Guerrero, Landemore on open democracy, Van Reybrouck, plus the older isonomia ideal), and that doesnt just turn the story into a spooky fable about fate. Where does Borges actually get sortition right, and where is he trading on a confusion — say, between randomly picking who holds an office and randomly deciding outcomes, or between a procedure being fair and a procedure being legitimate? Does the secrecy of the Company matter, or is it just atmosphere? And is the story a reductio of lottocracy, or a warning about something else entirely, like what happens to responsibility and accountability when no one is choosing anything? Finish by saying what the story adds to the debate that the political theory on its own doesnt.

  Give me exactly five numbered points, one or two sentences each, no intro and no conclusion.
