prompt: |-
  I am working on a seminar paper about the dispute over whether knowing how to do something is a species of knowing that, and I want to build the central case myself rather than borrow one from the literature. The intellectualist side, in the version I am working with — the one associated with Stanley and Williamson — holds that knowing how to F is simply a matter of knowing a proposition: for some way w of F-ing, one knows that w is a way for one to F. On this view, the familiar complaint that skilled people often cannot say what they know is not a serious objection, because the way need not be known under a descriptive mode of presentation; the knower grasps it practically, as the way she is acting, and a practical grip on a way is not the sort of thing that can be put into words. The anti-intellectualist side, going back to Ryle's treatment of the intellectualist legend in The Concept of Mind, holds that knowing how is a different kind of thing altogether and is not constituted by knowledge of any proposition. I would like a single case, built to order, that puts maximum pressure on the intellectualist without begging the question against it, and I would rather be told that my specifications cannot be jointly satisfied than be handed a case that cheats.

  The case must meet the following specifications. It should involve two ordinary adults and a single skill, described in no more than a paragraph; no science fiction, no exotic neurophysiology, no animals or infants, and no paralysis, injury, missing equipment, or other incidental obstacle that would explain the failure. The two people must be matched in every propositional respect I can think of: the same information, the same beliefs about the technique, the same beliefs about which descriptions of the technique apply to their own case, the same evidence, and the same opportunities. The only difference between them is that one can do the thing and the other cannot. The one who can must be at least as articulate as the other, and it must be clear that the difference is not a gap in information: the one who fails has been told everything, including a correct and complete description of the way the successful one moves, and can recite it, while the successful one's own spoken account of what she does is, as it happens, a false description of the way she actually moves. Avoid the stock examples that turn up in every discussion of this topic, and choose a skill whose execution cannot be captured by a short list of instructions.

  After the case, do five things. First, state the verdict each side gives: what proposition, if any, the successful one knows, in what mode, and why the intellectualist is entitled to say that the unsuccessful one lacks the same knowledge. Second, identify the single feature of the case that is doing the work, and say what happens to the case if that feature is removed — in particular, whether it collapses into the familiar insufficiency argument against intellectualism. Third, set out the practical-mode-of-presentation reply in your own words, say whether it rescues the intellectualist here, and say whether it is circular: that is, whether the relevant mode of presentation is available only to someone who already has the ability in question. Fourth, describe the strongest way for an intellectualist to attack the case — either by finding a proposition the successful one does know that I have overlooked, or by arguing that the unsuccessful one's deficit is itself a deficit of knowledge in the relevant mode — and say what would have to be true for that attack to succeed. Fifth, tell me which side, if either, the case actually refutes, and be willing to conclude that it refutes neither.
reasoning: |-
  Okay, the user is working on a seminar paper about the intellectualism vs. anti-intellectualism debate regarding "knowing-how." They need a custom-built case that challenges intellectualism without begging the question. Let me unpack their requirements carefully.

  First, the case must feature two ordinary adults with identical propositional knowledge about a skill, yet only one can perform it. The skill should be complex—not reducible to simple instructions—and avoid clichés like bike riding or skiing. The user emphasized avoiding sci-fi, disabilities, or external obstacles. The successful performer must be articulate, but crucially, their verbal description of their actions must be factually wrong. The unsuccessful one should know all correct descriptions yet still fail.

  Hmm, the challenge is creating asymmetry in ability while maintaining propositional symmetry. The key seems to be the performer's inaccurate self-report—this forces the intellectualist to explain why knowing the correct proposition doesn't confer ability. I'm considering a physical skill with subtle coordination, like a dance move or musical technique, where proprioception matters more than conscious description. 

  For the dance example: both know the "correct" steps (cross-step + shoulder dip), but the successful performer actually does cross-step + hip sway while believing they do the shoulder dip. The unsuccessful one knows every detail of both descriptions yet can't execute. This creates tension: the performer's practical mode of presentation (how they experience the action) contradicts their verbal report, but their body "knows" the motion. 

  Intellectualism would argue the successful person knows the proposition under a practical mode—but is that mode defined by the ability itself? That risks circularity. Anti-intellectualism would say the ability isn't propositional at all. The case's pivot is the performer's inaccurate self-awareness; remove that, and it collapses into standard objections about articulation. 

  The strongest counterattack? An intellectualist might argue the unsuccessful person lacks proprioceptive knowledge—but that knowledge is arguably ability-constituted. If proprioceptive concepts aren't ability-dependent, intellectualism survives; but evidence suggests they are. 

  Ultimately, this exposes intellectualism's vulnerability to cases where propositional knowledge dissociates from ability despite maximal parity. It doesn't refute intellectualism but pressures its practical-mode gambit, pushing it toward circularity. The user gets a targeted challenge, not a knockout punch.
answer: |-
  Here is a tailored case designed to meet your stringent specifications, followed by the requested analysis:

  ### The Case: The Reversed Charleston
  Two friends, Alex and Blair, decide to learn a specific vintage dance step: a reversed Charleston variation popular in niche swing dance circles. They have identical backgrounds: same age, fitness, prior dance experience (minimal), access to the same teacher, videos, and written instructions. The teacher provides a detailed, accurate description: "Shift weight to the left foot, kick forward with the right foot while swinging the left arm across the body at shoulder height, then step back with the right foot as the left arm swings down and back." Both memorize this description perfectly, watch the same slow-motion tutorials, and practice for the same amount of time in the same studio with mirrors. Both believe this description applies to their own attempts. They are equally articulate and intelligent.

  Alex successfully performs the step fluidly and consistently. Blair, despite intense effort and understanding, produces a jerky, off-balance motion that lacks the characteristic swing. Crucially, when Alex *describes* what she does while performing, she states: "I kick forward with the right foot while swinging my *right* arm across my body." Video analysis confirms Alex *actually* swings her *left* arm (as per the correct description) while kicking her right foot – her verbal report is factually incorrect. Blair knows the correct description ("left arm swings"), knows Alex's incorrect self-report ("right arm swings"), and has watched frame-by-frame video proof of Alex's *actual* movement (left arm swings). Blair can recite all of this flawlessly but still cannot execute the step.

  ---

  ### Analysis

  1.  **Verdicts:**
      *   **Intellectualist:** Alex knows the proposition *that w (the specific left-arm-swinging movement pattern she enacts) is a way for her to perform the Reversed Charleston*. She knows this under a *practical* mode of presentation, tied directly to her proprioceptive/kinesthetic execution. Blair lacks knowledge of this *specific* proposition *under the practical mode of presentation*. Blair knows the proposition *that v (the verbally described left-arm-swinging pattern) is a way to perform the step* under a descriptive mode, and knows the proposition *that w (the pattern Alex enacts) is the pattern Alex enacts*, but crucially, she does not know *that w is a way for her to perform the Reversed Charleston* under the *practical* mode – she cannot "grasp" w *as* a way for her to dance.
      *   **Anti-Intellectualist:** Alex possesses the ability to perform the Reversed Charleston. Blair lacks this ability. The ability itself is not constituted by knowing any proposition; it is a complex dispositional property involving motor control, timing, and proprioceptive feedback. The propositional knowledge both possess (and Alex's incorrect self-report) is irrelevant to the core ability.

  2.  **The Pivotal Feature & Its Removal:**
      *   **Feature:** Alex's demonstrably *false verbal self-description* of her own successful action, contrasted with Blair's *perfect propositional knowledge* of both the correct description and Alex's actual movement.
      *   **Consequence of Removal:** If Alex accurately described her own movements, the case would collapse into the standard "insufficiency of description" argument against intellectualism (the "swimming" or "bike-riding" objection Stanley addresses with the practical mode). The intellectualist could directly argue that Blair lacks the proposition under the practical mode, using Alex's accurate description as the known proposition. Alex's *inaccuracy* forces the intellectualist to identify the known proposition *not* as what Alex says, but as the pattern she *enacts* (w), known practically. Blair's knowledge *about* w (that it's what Alex does) becomes salient but inadequate.

  3.  **Practical Mode Reply & Circularity:**
      *   **Reply:** The intellectualist argues Alex knows the proposition *that w is a way for her to F* under a practical mode of presentation (Mp). Mp is non-descriptive, grounded in sensorimotor capacities, allowing her to token the thought via action, not description. Blair knows propositions *about* w descriptively but lacks the Mp necessary to know *that w is a way for her to F*.
      *   **Rescue Attempt?** This reply *attempts* to rescue intellectualism by locating the difference in the *mode* of presentation of the same proposition (w is a way to F).
      *   **Circularity?** **Yes, arguably.** The core question becomes: What *is* this practical mode of presentation Mp? If Mp is defined as *the way one conceptualizes the way w when one is able to execute w*, then Mp is *constituted* by the very ability it's supposed to explain. Acquiring Mp just *is* acquiring the ability. The intellectualist needs Mp to be a genuinely *cognitive* state (a way of grasping a proposition) that is distinct from but enables the ability. If Mp is only identifiable *through* the possession of the ability, the explanation is circular: S knows-how because S knows that p under Mp, but S has Mp because S knows-how.

  4.  **Strongest Intellectualist Attack:**
      *   **Attack:** The intellectualist argues that Blair *does* lack a crucial piece of *propositional* knowledge, known under a practical mode: Blair lacks *proprioceptive knowledge* of how her *own* limbs move during the attempt. Specifically, Blair doesn't know (under a practical/proprioceptive mode) *that this specific felt kinesthetic pattern (k) is the pattern Blair is producing when she tries to execute w*. Alex *does* know (under Mp) *that this specific felt kinesthetic pattern (a) is the pattern she (Alex) is producing when executing w*. The relevant proposition differentiating them is not directly about the dance step, but about their own bodily states during execution: Alex knows her successful pattern proprioceptively, Blair knows her failed pattern proprioceptively, but Blair lacks knowledge linking the *target* pattern w to her own proprioceptive state.
      *   **Requirement for Success:** For this attack to succeed, it must be true that:
          1.  Proprioceptive awareness constitutes *knowledge of propositions* (e.g., "This specific pattern k is occurring now").
          2.  This proprioceptive knowledge utilizes distinct, ability-independent *modes of presentation* (Mp_prop).
          3.  Blair's deficit in executing w is fundamentally caused by her lacking the proposition *that w is the pattern I am producing* (or similar) under the relevant Mp_prop, *rather than* by a non-cognitive motor inability. The Mp_prop must not itself be defined by or dependent on the ability to produce w.

  5.  **Refutation:**
      *   **Refutes:** This case **does not conclusively refute intellectualism**, but it **severely pressures its core defense (the practical mode)** and **strengthens the anti-intellectualist position**.
      *   **Why:** The case successfully isolates *ability* as the sole difference while neutralizing standard intellectualist counters based on descriptive knowledge gaps or articulation. The combination of Alex's inaccurate self-report and Blair's perfect descriptive knowledge *about* Alex's actual movement (w) forces the intellectualist to rely entirely on the *practical mode of presentation* (Mp) to explain the difference. However, the analysis of Mp reveals a deep tension: avoiding circularity requires Mp to be a genuinely cognitive, non-ability-constituted state, yet it remains unclear what independent criteria identify Mp beyond the ability itself. The strongest counterattack (proprioceptive propositions) pushes intellectualism into less intuitive territory regarding the propositional nature of bodily sensation and faces its own challenges concerning ability-independence and explanatory priority. The case vividly demonstrates that the *explanatory burden* for the intellectualist lies in providing a non-circular, genuinely cognitive account of the practical mode. If this cannot be done, anti-intellectualism gains significant plausibility. Ultimately, the case highlights the **explanatory gap** intellectualism struggles to bridge, rather than delivering a fatal blow.
