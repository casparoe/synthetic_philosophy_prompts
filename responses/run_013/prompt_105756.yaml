answer: |-
  Based on your friend's verdicts, I've identified two underlying rules that fit all her previous judgments equally well. Both rules are consistent with small-l libertarian principles, emphasizing property rights, consent, and the legitimacy of government functions. Below, I'll outline each rule, explain how it fits the prior cases, predict what she would say about the university tax, and then discuss which rule she's probably using and why. Finally, I'll suggest a further case to settle which rule she's actually applying.

  ### The Two Rules That Fit All Prior Verdicts
  Both rules explain her pattern of calling some taxes "theft" and others "not theft" based on libertarian concepts like consent, benefit, and the role of government. The toll case (not theft) is handled under both rules as a voluntary fee rather than a tax, so it doesn't conflict.

  1. **Rule A: Minimal State Justification**
     - **Description**: Taxes are not theft only if they fund services that are essential for protecting individual rights and enabling a functioning society—specifically, courts, police, and military. These are "public goods" that provide universal, non-excludable benefits (e.g., security and property protection) and are seen as the minimal legitimate functions of government. Any tax funding services beyond this scope (e.g., education, culture, general welfare) is theft, regardless of whether the individual benefits or not, because it involves coercive taking for non-essential purposes.
     - **Fits all prior verdicts**:
       - Federal income tax: Theft (funds a wide range of non-essential programs, not just minimal state functions).
       - Tax funding only courts, cops, military: Not theft (directly funds essential rights-protection services).
       - Sales tax: Theft (typically funds general government operations, not tied to essential services).
       - Property tax for public schools: Theft (education is not essential for rights protection; she has no kids, but even with kids, it might still be theft under this rule as schools are non-essential).
       - Toll on a private road: Not theft (not a tax; it's a voluntary fee for a service she chose to use).
       - Tax funding a museum: Theft (museums are not essential for rights protection; she never visits, but benefit is irrelevant).
     - **Prediction for university tax**: Theft. The university is not part of the minimal state—it's an educational institution, not essential for protecting life, liberty, or property. Even though she benefits directly (it funds her salary), this rule doesn't consider personal benefit; it focuses on the service's role in the minimal government. Thus, the mandatory tax is coercive and illegitimate.

  2. **Rule B: Direct Benefit and Voluntariness**
     - **Description**: A payment is not theft if the individual directly benefits from the specific service funded and has some form of choice or voluntariness in the transaction. Taxes for services that provide no direct, personal benefit to the individual are theft. This rule emphasizes individual consent and reciprocity: if you benefit, it's not theft (even if mandatory), but if you don't benefit, it is. For government services, "direct benefit" can include using the service or deriving tangible gains (like income). The courts/cops/military exception fits because everyone is seen as directly benefiting from security (it's non-excludable and foundational), making it not theft.
     - **Fits all prior verdicts**:
       - Federal income tax: Theft (funds general services; no direct, specific benefit to her, and she has no choice).
       - Tax funding only courts, cops, military: Not theft (she directly benefits from societal security and property protection, even if indirectly; it's a universal benefit).
       - Sales tax: Theft (paid during purchases, but the tax funds general things, not specific services she uses or benefits from directly).
       - Property tax for public schools: Theft (no direct benefit since she has no kids; she doesn't use the service).
       - Toll on a private road: Not theft (voluntary choice to use the road and direct benefit from it).
       - Tax funding a museum: Theft (no direct benefit since she never visits).
     - **Prediction for university tax**: Not theft. She directly benefits because the tax funds her salary, making her "better off" in a tangible way. Under this rule, the benefit overrides the mandatory nature of the tax, as it's tied to a specific service (the university) that she engages with through her employment. It's similar to the toll case in terms of direct benefit, but without the voluntariness of choice (which might make it a weaker fit, but the benefit alone could suffice).

  ### Which Rule Is She Probably Using and Why?
  She is **probably using Rule A (Minimal State Justification)**. Here's why:
  - **Ideological Consistency**: Small-l libertarians often adhere to a strict "night-watchman state" view, where only taxes for rights-protection services (courts, police, military) are justified. This aligns with her verdicts, as she consistently labels non-essential taxes as theft, regardless of personal benefit (e.g., property tax for schools or museum tax, where benefit could be argued indirectly but she still calls it theft). Rule A doesn't waver based on individual circumstances—it's about the service type, not the person.
  - **Benefit is Secondary in Prior Cases**: In cases like the museum or schools, she ignores potential indirect benefits (e.g., an educated society or cultural enrichment), focusing instead on whether the service is essential. This suggests Rule A's principle-based approach. If she were using Rule B, she might have nuanced her verdicts (e.g., "if I had kids, school tax might not be theft"), but she didn't.
  - **Voluntariness Emphasis**: The toll case shows she values choice, but for taxes, Rule A explains why only the minimal state exception exists—it's seen as necessary for society's existence, not voluntary. Rule B struggles slightly with the courts/cops/military tax because the benefit isn't always "direct" in a personal sense (e.g., she might never use a court), but it's accepted as universal. Rule A handles this cleaner by categorizing it as essential.
  - **Prediction for University Tax**: Under Rule A, she'll say theft. Even though she benefits, the university isn't a minimal state function, and libertarians often argue education should be privatized. This fits her pattern of rejecting non-essential taxes even when she might gain personally—coercion is key.

  **Why not Rule B?** Rule B is plausible and fits the data, but it's less consistent with core libertarianism. For example, if benefit alone could justify a tax, she might have called the museum tax "not theft" if she visited, but she didn't raise that possibility. Rule B also blurs the line between voluntary actions (toll) and mandatory taxes, making it less principled. However, it's a viable alternative, especially if she prioritizes reciprocity.

  ### Further Case to Settle It
  To definitively determine which rule she's using, propose a case that pits Rule A against Rule B:
  - **Case**: A mandatory local tax that funds a public park. She regularly visits this park, enjoys it, and directly benefits from its maintenance (e.g., she exercises there daily).
  - **How it settles the rule**:
    - If she says **theft**, she's using **Rule A** (Minimal State Justification). Parks are not essential for rights protection, so the tax is illegitimate regardless of her benefit.
    - If she says **not theft**, she's using **Rule B** (Direct Benefit and Voluntariness). Her direct, personal benefit from using the park makes the payment non-theft, even though it's mandatory.

  This case isolates the role of personal benefit for a non-essential service. In the museum example, she never visited, so benefit was absent—here, benefit is present and clear. If she calls it theft, Rule A is confirmed; if not, Rule B is likely. It also avoids confounding factors like employment (as in the university case) to focus purely on benefit versus minimal government.
