answer: |-
  Here are the core desiderata for an adequate theory of interpersonal aggregation, presented with their motivating intuitions and cases, as requested:

  ---

  ### 1. **Unanimity (Pareto Principle)**  
     - **Requirement**: If every individual strictly prefers outcome A to outcome B, society must strictly prefer A to B. If every individual is indifferent between A and B, society must be indifferent.  
     - **Motivating Case/Intuition**: The core of respecting individual sovereignty. If *everyone* agrees A is better (e.g., all prefer a policy saving 100 lives over one saving 10), overriding this consensus would be tyrannical. It ensures aggregation doesn’t disregard unanimous welfare judgments.  

  ---

  ### 2. **Distinctness of Persons**  
     - **Requirement**: The social preference must recognize that welfare is distributed across separate individuals, not merely aggregated into a "social total" as if society were a single entity. Personal identity matters.  
     - **Motivating Case/Intuition**: Borrowing from Rawls/Nozick: Sacrificing one person’s life to save two others treats individuals as containers of utility, not rights-bearing agents. Unlike a single person accepting pain for future gain, society cannot "compensate" a dead person for their loss. Ignores the separateness of persons.  

  ---

  ### 3. **Distribution Sensitivity (Anti-Repugnance & Anti-Leveling)**  
     - **Requirement**: The theory must:  
       - Reject the **repugnant conclusion** (a vast population with minimally positive welfare is not better than a small, flourishing one).  
       - Reject **leveling down** (reducing everyone to equal misery is not an improvement, even if equality increases).  
     - **Motivating Cases/Intuitions**:  
       - *Repugnant Conclusion* (Parfit): A world of 10 billion barely satisfied lives should not outweigh a thriving population of 1 billion. Total utilitarianism fails here by ignoring quality.  
       - *Leveling Down*: Reducing a genius’s welfare to match a disabled person’s level (without aiding the latter) isn’t fair or better—equality without improvement is hollow.  

  ---

  ### 4. **Ex Ante / Ex Post Fairness Distinction**  
     - **Requirement**: The theory must distinguish between:  
       - *Ex ante fairness*: Equal chances of benefit (e.g., a lottery for lifesaving treatment).  
       - *Ex post fairness*: Actual distribution of outcomes.  
       It must allow that two policies with identical *individual expected utilities* can differ in fairness.  
     - **Motivating Case**: **Medical Lottery Dilemma**:  
       - Option A: Give a scarce drug to Patient X (deterministically).  
       - Option B: Allocate by a fair lottery, giving each patient an equal 50% chance.  
       Both options have identical *expected utility* for each person, but Option B is ex ante fairer. An adequate theory must recognize B as superior in fairness, even if outcomes are identical ex post.  

  ---

  ### **Tensions & Exclusions**  
  #### **Incompatible Subset**:  
  - **Distribution Sensitivity + Symmetry + Pareto + Harsanyi Rationality → Repugnant Conclusion**.  
    Harsanyi’s theorem (weighted utilitarianism) satisfies Pareto, distinctness (formally), and ex ante fairness but *violates distribution sensitivity*:  
    - It accepts the repugnant conclusion (maximizing total utility).  
    - It cannot condemn leveling down (if total utility is unchanged).  
    - **Conflict**: Distribution sensitivity requires *non-additive* aggregation (e.g., prioritizing the worst-off), but Harsanyi’s rationality + Pareto forces additivity.  

  #### **Most Exclusionary Requirement**:  
  **Distribution Sensitivity** does the most to exclude otherwise attractive theories:  
  - **Utilitarianism**: Fails repugnant conclusion and leveling down.  
  - **Harsanyi’s Aggregation**: Requires symmetry for equal weights but ignores distribution.  
  - **Ex Ante Egalitarianism**: May violate ex post fairness (e.g., rewarding reckless gambles).  
  - **Only theories like Prioritarianism** (weighting worse-off individuals more) or **Sufficientarianism** (prioritizing those below a threshold) satisfy this—but they often conflict with strong Pareto or expected utility axioms.  

  ---

  ### **Key Takeaway**  
  The tension between **Pareto + Rationality** (pushing toward utilitarianism) and **Distribution Sensitivity + Ex Post Fairness** (pushing toward egalitarianism) is irreconcilable within Harsanyi’s framework. Distribution sensitivity is the major "spoiler," forcing trade-offs between efficiency, fairness, and the structure of aggregation. Theories must choose which moral intuitions to prioritize—a choice Harsanyi’s theorem alone cannot resolve.  

  Would you like deeper analysis of specific theories (e.g., prioritarianism vs. leximin) against these criteria?
