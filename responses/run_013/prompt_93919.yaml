prompt: |-
  I recently came across a short encyclopaedia entry on the Hart–Devlin debate and want to know how much of it to trust before I rely on it. Its account of the two positions runs roughly as follows:

  "Devlin and Hart disagreed about whether the criminal law may enforce morality. Devlin held that immoral conduct is intrinsically wrong and that society has a right to uphold virtue, so the law may criminalise conduct on the ground of its immorality alone; he added only that the convictions of the reasonable person should be the standard, so that the law need not defer to the merely eccentric or the oversensitive. Hart answered with Mill's harm principle: conduct may be restricted only where it harms others, and therefore the law may never regulate conduct merely because it is immoral. Since there is no evidence that a shared morality is required for a society's survival, and since Hart's principle is the one that liberal legal systems have largely adopted, Hart's position has prevailed."

  Three things about this strike me as possibly off, but I cannot tell whether the fault lies in the entry or in my own expectations, and I would rather not simply assume that Hart won because Mill was right.

  First, is the entry's Devlin a fair reconstruction? My impression is that his case was not that immorality as such is wrong and therefore punishable, but something more sociological, about a shared morality being part of the fabric of a society and therefore something the society may protect; and that the reasonable person was less a liberal safeguard than the figure whose sentiments fix the content of the morality that is to be enforced. If that is right, then the entry has quietly substituted one kind of legal moralist for another, and I would like to know exactly what has been swapped in and what it changes.

  Second, does the entry overstate Hart? "The law may never regulate conduct merely because it is immoral" is a much stronger conclusion than I remember being attributed to him, and it makes his objection to Devlin turn wholly on an inherited principle rather than on an argument he supplied. I want to know what his actual case against Devlin was, and whether he had a distinction available to him that the entry simply omits — something about the difference between the morality a society happens to accept and a morality that could be defended.

  Third, does the closing inference survive? Even if every sentence about the two positions were accurate, "liberal legal systems have largely adopted Hart's principle, therefore Hart's position has prevailed" appears to change the subject from which view is correct to which view is popular. I also doubt the description itself, since I have the impression that contemporary criminal law still prohibits some conduct on grounds that look moralistic rather than harm-based.

  Finally, a friend claims that Devlin's argument is structurally the same as a much more recent one — that certain kinds of speech or information should be restricted not because they harm any particular person, but because they corrode the shared norms a democracy needs in order to function. He says this shows Devlin was making an argument we still take seriously, merely in different dress. Is that comparison fair, or does it inherit the same ambiguity as the encyclopaedia entry?

  Please go through the entry sentence by sentence and tell me, for each claim, whether someone who works on this debate would accept it, wince at it, or call it a distortion; indicate which of the distortions a defender of Devlin would resist and which a defender of Hart would resist; and say whether any conclusion the entry draws can be salvaged once the misdescriptions are corrected. Where the entry flattens a distinction that matters — I suspect there is more than one kind of legal moralism in play, and possibly more than one ground for criminalisation besides harm — set the distinctions out and tell me what turns on them.
reasoning: |-
  Okay, let me tackle this user's query about the Hart-Devlin debate. They've shared an encyclopedia entry and have three main concerns: whether Devlin's position is accurately portrayed, if Hart's stance is overstated, and if the conclusion about Hart "prevailing" holds up. Plus, there's a bonus question about a modern analogy to Devlin's argument.

  First, I need to recall the core arguments. Devlin argued that society's moral fabric is essential for its survival, so laws can enforce shared morality based on what the "reasonable person" deems intolerable. Hart, following Mill, insisted that only harm to others justifies legal intervention. The user suspects the entry oversimplifies both positions.

  Looking at the entry's Devlin summary: it claims he thought immorality is intrinsically wrong and punishable. But that's misleading. Devlin's actual argument was sociological—shared morality binds society, so its collapse risks social disintegration. The "reasonable person" wasn't just a liberal safeguard but the barometer for what counts as intolerable immorality. The entry flattens this into crude moralism, which Devlin defenders would hate.

  For Hart, the entry says he flatly rejects any morality-based laws. But Hart was more nuanced. He allowed "paternalism" (self-harm) and "legal moralism" in limited forms. His real critique was that Devlin confused popular morality with critical morality and failed to prove that moral dissent destroys society. Hart's case wasn't just "Mill said so"—it was a philosophical dismantling of Devlin's premises. The entry's absolutism would make Hart supporters wince.

  The "Hart prevailed" claim is shaky. Yes, liberal systems use harm principles, but moralistic laws (e.g., vices, public indecency) persist. Plus, equating popularity with correctness is a non sequitur. The user's friend's point about modern "democracy-preserving" speech laws mirroring Devlin is valid—it shows his structural argument still resonates, though the analogy isn't perfect.

  Key distinctions muddled by the entry:  
  1. Devlin's sociological conservatism vs. intrinsic wrongness moralism.  
  2. Hart's critical morality vs. popular morality.  
  3. Harm principle vs. other grounds for criminalization (like paternalism).  

  The user wants precision, so I'll map each entry sentence to expert reactions. Defenders of both sides would resist distortions of their arguments. The conclusion? Hart influenced liberalism, but Devlin's concerns echo in contemporary debates—no clean "victory."  

  The friend's analogy works if focused on structural parallels (protecting social fabric), but Devlin targeted sexual morality, while modern speech debates involve democratic functionality. Different contexts, same logic skeleton.
answer: |-
  Your suspicions are well-founded—the encyclopedia entry oversimplifies both positions and misrepresents key nuances. Below is a sentence-by-sentence analysis, followed by clarifications of the distinctions that matter and an evaluation of the conclusion. Defenders of **Devlin** (D-defenders) and **Hart** (H-defenders) would resist different parts.

  ### Sentence-by-Sentence Breakdown:
  1. **"Devlin and Hart disagreed about whether the criminal law may enforce morality."**  
     - **Acceptable?** Yes. This is the core debate.  
     - **Reaction:** Uncontroversial. Both sides accept this framing.

  2. **"Devlin held that immoral conduct is intrinsically wrong..."**  
     - **Distortion.** Devlin’s primary argument was **sociological, not metaphysical**. He claimed society’s survival depends on a shared moral fabric, not that immorality is "intrinsically wrong" in a philosophical sense.  
     - **D-defender resistance:** They’d insist Devlin was describing a functional necessity for social cohesion, not endorsing moral objectivism.  
     - **Reaction:** Wince. This confuses Devlin with natural law theorists (e.g., Aquinas).

  3. **"...and that society has a right to uphold virtue, so the law may criminalise conduct on the ground of its immorality alone..."**  
     - **Overstatement.** Devlin argued society may enforce **shared morality essential to its existence**, not "virtue" abstractly. He explicitly rejected enforcing *all* morality (e.g., he distinguished between "moral" and "immoral" versus "not moral" acts like parking violations).  
     - **D-defender resistance:** They’d note his focus was on "moral standards necessary for society’s preservation," not virtue per se.  
     - **Reaction:** Distortion. Omits his sociological premise.

  4. **"...he added only that the convictions of the reasonable person should be the standard..."**  
     - **Partially accurate but misleading.** The "reasonable person" (or "right-minded person") was Devlin’s gauge for identifying the **shared morality central to social cohesion**, not a "liberal safeguard" against eccentricity.  
     - **D-defender resistance:** They’d emphasize this was a test for *what society deems intolerable*, not a concession to liberalism.  
     - **Reaction:** Wince. Frames it as a moderation device rather than a sociological barometer.

  5. **"Hart answered with Mill's harm principle: conduct may be restricted only where it harms others..."**  
     - **Accurate but incomplete.** Hart endorsed Mill’s principle but added his own distinctions.  
     - **Reaction:** Acceptable, though oversimplified.

  6. **"...and therefore the law may never regulate conduct merely because it is immoral."**  
     - **Overstatement.** Hart **explicitly allowed exceptions** to the harm principle:  
       - **Paternalism:** Restricting self-harming conduct (e.g., seatbelt laws).  
       - **Offense principle:** Regulating deeply offensive public acts (e.g., public indecency).  
       He opposed criminalizing *private* "immoral" acts (e.g., consensual homosexuality) but did not rule out all morality-based laws.  
     - **H-defender resistance:** They’d reject this absolutism—Hart’s case was against Devlin’s *specific* justification, not all moral enforcement.  
     - **Reaction:** Distortion. Ignores Hart’s nuanced concessions.

  7. **"Since there is no evidence that a shared morality is required for a society's survival..."**  
     - **Mostly accurate.** Hart argued Devlin provided no empirical proof that moral dissent destroys society (e.g., historical societies tolerated moral pluralism).  
     - **D-defender resistance:** They’d argue Hart underestimated how moral cohesion stabilizes institutions.  
     - **Reaction:** Acceptable (Hart’s core critique).

  8. **"...and since Hart's principle is the one that liberal legal systems have largely adopted..."**  
     - **Debatable.** While harm-based reasoning dominates, **moralistic laws persist**:  
       - Examples: Drug criminalization, prostitution bans, sodomy laws (historically), "vice" regulations.  
       - Even where repealed, "harm" is often stretched to include moralistic concerns (e.g., "corruption of public morals").  
     - **Reaction:** Wince. Overstates real-world adoption.

  9. **"...Hart's position has prevailed."**  
     - **Conclusionary distortion:**  
       - **Philosophically?** Unresolved—legal moralism remains defended (e.g., by Robert George, Patrick Devlin’s modern heirs).  
       - **Legally?** Mixed: Harm principle is influential, but moral enforcement persists (e.g., blasphemy laws in Europe, obscenity laws in the US).  
       - **Logical flaw:** Popularity ≠ correctness.  
     - **Reaction:** Distortion. Erases ongoing debates.

  ---

  ### Key Distinctions Flattened by the Entry:
  1. **Devlin’s Legal Moralism vs. Intrinsic Wrongness:**  
     - **Devlin’s Type:** **Sociological conservatism** (law preserves society’s moral glue).  
     - **Alternative Type:** **Natural law moralism** (law should enforce objective morality).  
     - **What Turns on It?** Devlin’s argument is vulnerable to empirical disproof (e.g., if societies survive without shared morality), while intrinsic wrongness isn’t.

  2. **Hart’s Critical Morality vs. Positive Morality:**  
     - **Positive Morality:** What society *believes* is moral (Devlin’s focus).  
     - **Critical Morality:** What *can be rationally justified* as moral (Hart’s standard).  
     - **What Turns on It?** Hart argued law should reflect critical morality, not enforce popular prejudices.

  3. **Grounds for Criminalization Beyond Harm:**  
     | **Ground**               | **Hart’s View**       | **Devlin’s View**       |  
     |--------------------------|------------------------|-------------------------|  
     | Harm to others           | Necessary (Mill)      | Insufficient alone      |  
     | Paternalism              | Acceptable (limited)  | Irrelevant              |  
     | Offense                  | Acceptable (public)   | Subsumed under morality |  
     | Legal moralism           | Rejected              | Necessary               |  
     - **What Turns on It?** The entry reduces the debate to "harm vs. morality," ignoring other legitimate grounds Hart accepted.

  ---

  ### Your Friend’s Comparison: Devlin vs. Democratic Stability Arguments
  - **Fair?** **Structurally similar, but distinct.**  
    - **Similarity:** Both argue that certain acts (immorality/harmful speech) undermine societal foundations.  
    - **Difference:**  
      - Devlin focused on **general social cohesion** (any shared morality).  
      - Modern "democracy-preserving" arguments (e.g., against hate speech) focus on **specific democratic functions** (e.g., equal participation, informed debate).  
    - **Why It Matters:** Democracy-based limits can appeal to **harms** (e.g., silencing marginalized groups) or **institutional necessity**, making them potentially compatible with Hart’s framework. Devlin’s broader "social fabric" claim is harder to defend empirically.

  ---

  ### Conclusion: Can the Entry’s Core Claim Be Salvaged?
  - **"Hart prevailed" as historical fact?** Partially—his harm principle is **influential in liberal theory**, and many moralistic laws (e.g., sodomy bans) have been repealed.  
  - **As philosophical victory?** **No.** The debate is alive:  
    - Devlin’s concerns resurface in communitarian critiques (e.g., MacIntyre, Sandel).  
    - Legal systems still criminalize "victimless" immorality (e.g., public nudity, drug use).  
  - **Accurate Reformulation:**  
    > *"Devlin argued that society may criminalize conduct undermining its shared moral fabric, using the 'reasonable person' to identify essential norms. Hart countered that law should protect individuals from harm, not enforce popular morality, citing a lack of evidence that moral dissent destroys society. While Hart’s view shaped modern liberalism, legal systems retain moralistic elements, and the debate continues."*

  **Recommendation:** Trust this entry only as a superficial overview. For accuracy, consult primary texts (Devlin’s *The Enforcement of Morals*, Hart’s *Law, Liberty and Morality*) or modern analyses (e.g., H.L.A. Hart’s *The Concept of Law*, Robert George’s critiques).
