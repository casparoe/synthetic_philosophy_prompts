  Scenario: A group of friends has a rule that when they play soccer in the park, the first person to arrive at the field gets to choose the teams. One day, Alice arrives second but starts choosing the teams. She says: "Okay, I'll take Bob and Charlie on my team, and David and Eve on the other." Everyone understands and goes along with it. However, the first arrival, Frank, is present and was about to choose.

  Convention: Only the first arrival can choose the teams.

  Austin: The act of choosing the teams requires that the person is the first arrival. Since Alice is not, the procedure is flawed. It's a misfire because the act of team selection is not valid.

