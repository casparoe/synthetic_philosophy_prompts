  ### The Nuclear Credibility Paradox Game: "Tripwire Deterrence"

  **1. The idea and the setting**  
  This game stages the core paradox of nuclear deterrence: a threat gains credibility when a state deliberately cedes control to chance (e.g., via delegation or automated systems), making retaliation more likely but also increasing the risk of catastrophic loss of control. Players, as two alliances disputing a resource, choose whether to deploy a "tripwire" (a public, irreversible commitment) that introduces a random chance of mutual destruction if attacked. The goal is to force players to experience the trade-off: deploying makes threats believable but robs them of agency, escalating risk. The setting is a seminar with two alliances (Blue and Red, each with two teams of four students) competing for a prize with private valuations.

  **2. Materials and setup**  
  - *Materials*: Two six-sided dice, index cards, markers, whiteboard.  
  - *Setup*:  
    1. Divide students into four teams of four. Assign two teams to Alliance Blue, two to Alliance Red. Alliances sit on opposite sides of the room.  
    2. Privately give each alliance an index card with their prize value (V): 10, 20, or 30 (randomly assigned).  
    3. Draw a "ladder" on the whiteboard with three rungs:  
       - Rung 0: Status quo (no deployment).  
       - Rung 1: Tripwire deployed (commitment phase).  
       - Rung 2: Attack (escalation phase).  
    4. Display common knowledge: catastrophe cost (C = 50), war cost (W = 20), tripwire risk (die roll ≤ 2 = catastrophe, p = 1/3).  

  **3. The rules**  
  - **Phases**: Two simultaneous decision phases (commitment then attack). Alliances discuss internally but decide jointly.  
  - **Commitment phase** (5 minutes):  
    - Each alliance secretly writes "Deploy" or "Not" on a card.  
    - Instructor collects and reveals cards. If "Deploy," move alliance to rung 1 on the ladder. *This is irreversible and public*.  
  - **Attack phase** (5 minutes):  
    - Each alliance secretly writes "Attack" or "Not" on a card.  
    - Instructor collects and reveals cards.  
  - **Outcome resolution**:  
    - **No attack by either**: Status quo. Payoffs = (0, 0).  
    - **One alliance attacks, other does not**:  
      - If defender *not* at rung 1: Attacker gets V, defender gets 0.  
      - If defender at rung 1: Roll die. If ≤2 (catastrophe), both get -C. Else, attacker gets V, defender gets 0.  
    - **Both attack**:  
      - If neither at rung 1: Both get -W.  
      - If at least one at rung 1: Roll die. If ≤2 (catastrophe), both get -C. Else, both get -W.  
  - **Game end**: After outcome resolution. One full game per session.  

  **4. Payoffs**  
  | Scenario                            | Blue Payoff | Red Payoff |  
  |-------------------------------------|-------------|------------|  
  | Status quo (no attack)              | 0           | 0          |  
  | Only Blue attacks, Red not deployed | V_blue      | 0          |  
  | Only Blue attacks, Red deployed     | Roll die: ≤2: -50; Else: V_blue | Roll die: ≤2: -50; Else: 0 |  
  | Both attack, no deployment          | -20         | -20        |  
  | Both attack, at least one deployed  | Roll die: ≤2: -50; Else: -20 | Roll die: ≤2: -50; Else: -20 |  

  *Explanation*: The prize value (V) is private and high (10/20/30), while catastrophe cost (C=50) is severe. War cost (W=20) makes mutual attack painful but less so than catastrophe. Deploying (rung 1) adds credibility: if Red deploys, Blue’s expected payoff for attacking drops (e.g., for V=30, expected payoff = (2/3)*30 + (1/3)*(-50) ≈ 3.33, barely positive). This creates incentive to deploy to deter, but if both deploy, mutual attack risks catastrophe.  

  **5. Session timeline**  
  - **0–10 min**: Setup. Form alliances, assign V, explain ladder/payoffs.  
  - **10–20 min**: Commitment phase. Teams discuss, submit "Deploy/Not" decisions.  
  - **20–25 min**: Instructor reveals deployment, updates ladder.  
  - **25–35 min**: Attack phase. Teams discuss, submit "Attack/Not" decisions.  
  - **35–45 min**: Instructor reveals attacks, resolves outcomes with dice.  
  - **45–90 min**: Debrief (45 min). Discuss paradox, map to game events.  

  **6. Debrief**  
  - **Credibility through risk**: When an alliance deployed (e.g., Blue to rung 1), it visibly ceded control—attacking Red now risked catastrophe via die roll. This made Blue’s threat to retaliate *believable* because outcomes were no longer fully in Blue’s hands. Players felt the "purchase of credibility": Blue’s deployment increased real risk (e.g., if Red attacked, catastrophe became possible).  
  - **Escalation and loss of control**: If both deployed (rung 1), the safe outcome (status quo) became fragile. Attack decisions were tense because retreating (not attacking) felt weak, but attacking risked triggering the other’s tripwire. In mutual attack, the die roll symbolized loss of agency—e.g., catastrophe could occur even if alliances privately preferred peace.  
  - **Paradox in action**: High-value alliances (V=30) often deployed to deter, but if both had high V, deployment made mutual destruction more likely (e.g., a die roll decided catastrophe). Players saw that "safety" required trusting the enemy not to attack, but deployment eroded trust by making accidents possible.  
  - **Key takeaways**: Credibility demanded accepting irreversible risk. Yet, when both did this, control slipped away—the dice embodied Schelling’s "threat that leaves something to chance."  

  **7. What will go wrong the first time**  
  - **Refusal to escalate**: Students may avoid deploying or attacking, fearing catastrophe. *Handle it*: Remind them high-V alliances (e.g., V=30) have incentive to deploy/attack; award "bonus points" for taking risks to encourage engagement.  
  - **Cooperation too easily**: Alliances might signal peace ("Let’s both not deploy!"), but deals are unenforceable (rules forbid binding agreements). *Handle it*: After submissions, reveal that one side often defects (e.g., deploys secretly), highlighting distrust.  
  - **Exploiting chance mechanism**: A reckless team might deploy and attack blindly, ending the game early with a die roll. *Handle it*: In debrief, contrast this with real-world organizational complexity—here, randomness is clean and known, but in reality, risks are foggy and cumulative.  
  - **Misunderstanding payoffs**: Teams may think deployment always benefits them. *Handle it*: Run a mini-example pre-game (e.g., "If V=20 and C=50, would you attack a deployed foe? Expected payoff = -3.33!").  

  **8. What the game cannot reproduce**  
  The game simplifies the real-world "fog" of nuclear risk. Here, probabilities are quantifiable (e.g., p=1/3), decisions are centralized, and catastrophe is instantaneous. In reality, credibility stems from deep organizational systems (e.g., command delegation, alert protocols), where risks emerge from miscommunication, human error, or technical failure—not a single die roll. The game cannot capture how small, layered risks compound (e.g., a near-miss accident escalating tensions) or how leaders perceive uncertainty subjectively. Emphasize in debrief that real deterrence involves "unknown unknowns": probabilities are unmeasurable, and the "mechanism" is a web of people and machines, not a clean randomizer. This abstraction is the game’s limit—use it to segue into how Schelling’s paradox operates amid real-world complexity.
