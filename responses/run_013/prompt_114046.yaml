prompt: |-
  I'm putting together a handout for a grad seminar on skill and knowledge, and I want to do the unglamorous part first: before we read anybody's theory of knowing how, I want the spec. You're the person in the department who actually works on this, so give it to me straight — write me the desiderata list that any theory of knowing how has to satisfy to count as adequate. Not the theories, the requirements. For each one: what the requirement is, the case or consideration that forces it, and whether you'd call it non-negotiable or just something one camp happens to care about. Roughly the kind of thing I have in mind, though don't feel bound by my list — it has to make room for the person who is genuinely good at something and can't say what they're doing (the chick sexers, a batsman reading the bowler's wrist), and for the person who follows a guide around a city and gets everywhere on time without being able to find their own way, and for the amnesic patients who get better at a mirror-tracing task across sessions while insisting they've never done it before. It has to make sense of the fact that knowing how comes in degrees, that a broken arm doesn't erase it, that coaching and drilling both produce it, that sometimes thinking hard about what you're doing makes you worse at it, and that it seems to explain what people do in a way that a mere ability or a mere fact doesn't.

  Then the part I most want: which of these requirements are real constraints and which are just the prejudices of one camp dressed up as constraints, and — this is what I'll care about in discussion — whether some pair or triple of them can't be satisfied together, in which case the list itself is the result and I want you to say so flatly instead of hedging. If you think I've built the list so that only one answer could possibly satisfy it, tell me that too; I'd rather find out now then in front of the room. A short paragraph at the end on which single requirement does the most to eliminate the going theories is welcome, but keep the weight on the requirements themselves, I can do the scoring on my own, I've read the stuff. No citations or reading list, I don't need them here and they'd be wasted on me. Start by brainstorming the candidate requirements before you commit to a final list, and be upfront about your own footing: where you're reporting a consensus in the field and where you're just telling me what you think, and where you're genuinely unsure whether something is a requirement at all or just a nice thing to have.
