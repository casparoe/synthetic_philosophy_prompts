answer: |-
  Here’s a distilled desiderata list for any theory of "knowing how," grounded in empirical and conceptual constraints. I’ll flag consensus vs. contention, non-negotiables, and tensions. Requirements are ranked by robustness of support.

  ---

  ### **Core Desiderata for a Theory of Knowing How**  
  *(Non-negotiables in bold)*  

  1. **Non-Propositionality Anchor**  
     - **Requirement**: Knowing how cannot *reduce* to knowledge of facts (propositional knowledge).  
     - **Case**: Amnesic patients (e.g., H.M.) improving at mirror-tracing without recalling prior sessions. They *know how* but lack access to factual memories of learning.  
     - **Status**: **Non-negotiable** for most post-Ryleans. Consensus: intellectualism fails here.  

  2. **Knowledge Without Articulation**  
     - **Requirement**: One can know how to Φ without being able to articulate *how* one does Φ.  
     - **Case**: Chick sexers, expert batters, or pianists who perform flawlessly but cannot explain their technique.  
     - **Status**: **Non-negotiable**. Field consensus: articulation is not necessary for know-how.  

  3. **Gradability**  
     - **Requirement**: Knowing how admits of degrees (novice → expert) and can be partial.  
     - **Case**: A student driver "knows how" to parallel park but poorly; a grandmaster knows how profoundly.  
     - **Status**: **Non-negotiable**. Uncontested.  

  4. **Resilience to Temporary Incapacity**  
     - **Requirement**: Knowing how persists through temporary inability to perform (e.g., injury, fatigue).  
     - **Case**: A gymnast with a broken arm still *knows how* to do a backflip; ability is disabled, know-how isn’t.  
     - **Status**: **Non-negotiable**. Rejects "know-how = ability" views.  

  5. **Knowledge Without Autonomous Ability**  
     - **Requirement**: One can know how to Φ while needing external support (tools, guides) to succeed.  
     - **Case**: Tourist following a GPS/guide accurately but unable to navigate alone.  
     - **Status**: **Non-negotiable**. Sinks simple ability-based accounts.  

  ---

  ### **High-Priority (Near-Consensus)**  
  6. **Procedural Automaticity**  
     - **Requirement**: Knowing how can be impaired by conscious reflection during performance.  
     - **Case**: "Choking" in sports or music when over-analyzing movements.  
     - **Status**: Strongly supported (empirically). Non-negotiable for anti-intellectualists; contested by some intellectualists.  

  7. **Multiple Acquisition Paths**  
     - **Requirement**: Know-how arises from both explicit instruction *and* implicit drill/practice.  
     - **Case**: Learning tennis via coaching (rules-focused) vs. muscle-memory repetition (non-cognitive).  
     - **Status**: Near-consensus. Rejects theories requiring a single "source."  

  ---

  ### **Explanatory Constraint (Contentious but Critical)**  
  8. **Action-Guiding Explanatory Role**  
     - **Requirement**: Knowing how must *explain* successful action in a way mere ability/disposition cannot.  
     - **Case**: A novice and expert may both *succeed* at a task once, but only the expert’s success is explained by know-how.  
     - **Status**: **Non-negotiable** for most. The core reason we posit "know-how" over behaviorism.  

  ---

  ### **Tensions & Trade-offs**  
  - **The Big Tension**: *Non-Propositionality* (1) + *Explanatory Role* (8) conflict.  
    - If know-how isn’t propositional, how can it *explain* action? Intellectualists claim only propositions can explain; anti-intellectualists must ground explanation in non-cognitive structures (e.g., embodied routines).  
    - **Result**: Most theories sacrifice one desideratum or reinterpret another. No dominant solution.  

  - **Automaticity (6) vs. Acquisition Paths (7)**:  
    - If know-how is automatic/unreflective (6), how does explicit coaching (a path in 7) create it? Theories must bridge explicit learning → implicit competence.  

  ---

  ### **Your List’s Bias & Feasibility**  
  - **Your list leans anti-intellectualist** but doesn’t *force* it. An intellectualist could satisfy all by:  
    - Claiming amnesics retain *unconscious* propositions (controversial).  
    - Arguing automaticity involves "tacit" proposition access (empirically thin).  
  - **Non-Propositionality (1) is the killer requirement**: It eliminates pure intellectualist views (e.g., Stanley & Williamson) unless they gerrymander "proposition" beyond recognition.  
  - **No theory satisfies all flawlessly**. The amnesic (1) + automaticity (6) + non-articulation (2) triad is the hardest nut. Rylean dispositionalism struggles with explanatory depth (8); intellectualism buckles under (1) and (2).  

  ---

  ### **The Eliminator**  
  **Non-Propositionality** does the heaviest lifting: it forces theories into anti-intellectualist or hybrid frameworks. If a theory can’t explain amnesic learning or expert intuition without smuggling in propositions, it’s dead. This requirement alone sinks orthodox intellectualism and reorients the field toward embodied/pragmatic accounts.  

  **Final note**: This list *is* the result—a map of fault lines. Present it as a challenge: "Here’s what any theory must explain. Now see who gets closest."
