prompt: |-
  You're a philosopher of mathematics who's spent a lot of time around working mathematicians, and I want you to think carefully and do a little brainstorming before you commit to an answer.

  Here's the practice that bugs me. Mathematicians use Choice constantly without blinking — Zorn's lemma in algebra, Tychonoff for topology, quietly picking a representative from each equivalence class. But the same people get scrupulous the second measure theory or probability shows up: measurable sets only, no Vitali-style sets, and they'll say you have to be careful here. Banach–Tarski gets called a paradox instead of a theorem. And alot of them will carefully track which results actually need Choice and avoid it in the ones that don't. What philosophical commitments does that whole pattern presuppose? Does it presuppose Choice isn't really *true* but is just a handy tool, or that it's true of some intended universe while the "real" one is the measurable/constructible one, or that our pretheoretic intuitions about volume are genuine constraints on mathematical truth? Which rival views does the asymmetry quietly rule out? And is the pattern even internally consistent — or does using Zorn in algebra while banning non-measurable sets in probability commit you to two incompatible stories about what mathematics is about? Be explicit about what the practice *strictly* presupposes versus what it merely fits nicely with, and flag where it's underdetermined, i.e. which several philosophical pictures would license the exact same behavior. Then tell me what would have to change in actual mathematical practice if the presupposed picture were swapped for straight constructivism, or for full-blooded platonism about Choice.

  Under 400 words, and lead with your bottom line in one sentence before unpacking.
reasoning: |-
  Okay, let me tackle this user's query about mathematicians' asymmetric use of the Axiom of Choice (AC). The core issue is why mathematicians freely apply AC in algebra and topology but become cautious in measure theory contexts. 

  First, I need to unpack the philosophical tensions here. The user points out concrete examples: Zorn's Lemma and Tychonoff's theorem versus the rejection of non-measurable sets like Vitali sets. There's also the labeling of Banach-Tarski as a "paradox" rather than just a theorem. This suggests mathematicians treat AC as both indispensable and suspicious depending on context.

  I should consider what this practice implies about mathematical truth. Does it mean AC isn't "true" but merely useful? Or that some mathematical domains (like measure theory) have stronger intuitive constraints? The user specifically asks about philosophical commitments behind this asymmetry.

  The key points to address:
  - The practical reliability of measure theory vs set theory
  - How mathematical domains differ in their dependence on AC
  - Whether this constitutes inconsistency in philosophy of math
  - Alternative philosophical frameworks (constructivism, platonism)

  I recall that working mathematicians often prioritize domain-specific consequences over global ontological commitments. In measure theory, rejecting AC preserves intuitive properties like volume invariance, while algebraists value AC for its unifying power. This isn't necessarily inconsistent - it reflects a pragmatic division between mathematical "universes".

  For the response structure: 
  First state the bottom line upfront: The asymmetry reflects domain-specific priorities rather than global ontological commitments. Then unpack how mathematical practice separates "consequence management" from truth claims. Contrast this with how strict constructivism or platonism would force changes in practice.

  Need to stay under 400 words while covering:
  - What the practice presupposes (pragmatic prioritization)
  - What it doesn't require (specific ontological stance)
  - Alternative philosophical licenses
  - Consequences under different frameworks

  The challenge is showing how this pragmatic approach remains internally consistent despite surface contradictions. The consistency comes from mathematicians treating different domains as having different "ground rules" rather than one unified reality.
answer: |-
  **Bottom line:** The asymmetry reflects pragmatic prioritization of domain-specific consequences over global ontological commitments, presupposing that mathematics serves diverse applications where reliability in certain contexts (like probability) trumps set-theoretic generality.

  **Unpacking:**
  - **Presupposes:** (1) Mathematical practice is application-driven; measure theory’s ties to physics/statistics demand "intuitive" constraints (e.g., countable additivity), making non-measurable sets *practically* inadmissible. (2) Choice is *instrumentally* valuable but not sacrosanct; avoiding it where possible (e.g., in analysis) enhances "concreteness" without rejecting it outright. (3) Banach-Tarski is a "paradox" because it violates *physical* intuitions about volume, not mathematical coherence.
  - **Fits with, not presupposed:** (1) Quasi-constructivism (e.g., working in \(L\) or with definability) for "tame" domains. (2) Multiversism (different universes for different needs). (3) Neutrality on whether Choice is "true" in an absolute sense.
  - **Ruled out:** Strict formalism (indifference to consequence-tracking) and radical platonism (if Choice is universally "true," rejecting non-measurable sets is inconsistent).
  - **Underdetermined:** Whether this implies a hierarchy of mathematical "reality" (e.g., Borel sets > arbitrary sets) or merely contextual prudence. Both license the behavior.

  **Consistency:** It’s internally consistent as *local optimization*: algebra leans on Choice for structure theory (e.g., vector space bases), while probability prioritizes \(\sigma\)-additivity. The "story" is unified by *instrumentalism*: mathematics adapts tools to domains.

  **If swapped:**
  - **Constructivism:** Rejecting Choice everywhere. Algebra collapses (no Hahn-Banach, Zorn-dependent theorems), topology loses Tychonoff, measure theory gains but becomes trivial (no pathological sets exist).
  - **Full-blooded Platonism (Choice as true):** Non-measurable sets must be accepted; probability axioms would need revision (e.g., abandoning \(\sigma\)-additivity) or be deemed incomplete. Banach-Tarski becomes a surprising theorem, not a paradox.

  **Practice change:** Constructivism forces rebuilding core algebra/analysis; platonism forces reconciling measure theory with Choice’s consequences or accepting its irrelevance to physical volumes. Current practice avoids both by contextually balancing intuition and generality.
