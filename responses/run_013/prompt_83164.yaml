  Now, walking through the deontologist's response. They'd refuse to open the book, citing the intrinsic duty to keep promises, regardless of consequences. The key feature here is the victimless nature of the constraint. Without a living victim, harm-based justifications can't be easily applied, exposing the borrowed framework.

