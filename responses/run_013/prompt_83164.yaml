answer: |-
  Here's a case designed to expose the "borrowed harm justification," satisfying all your constraints:

  **The Case: The Sealed Archive & The Viral Desecration**

  Dr. Elara Vance is the sole executor and archivist of the late Professor Aris Thorne, a notoriously private historian. Thorne's will contained a specific, solemn directive: **"The sealed red journal in my personal archive, marked 'Erebus,' is never to be opened or its contents revealed. It is to be preserved intact, undisturbed, in perpetuity."** Thorne offered no explanation beyond calling it a "matter of sacred personal trust." Vance promised Thorne on his deathbed to uphold this. Thorne is now dead.

  Years later, Vance discovers that a dangerous online challenge – the "Erebus Rite" – has gone viral. Participants film themselves ritually burning or desecrating a sealed, personally significant object (usually a journal or memento) belonging to a deceased family member or mentor, violating explicit, known dying wishes or promises made to the deceased. The challenge explicitly references the "mystique of the forbidden Erebus journal" as inspiration. Thousands have participated, but the core group driving the trend and creating the most viral content consists of **50 influential "challenge leaders."**

  Vance learns through a confidential informant (a disillusioned former challenge leader) that **the *only* thing that will definitively stop these 50 leaders** is concrete, verifiable proof that the *original* Erebus journal *exists* and that its *contents are profoundly mundane and deeply disappointing* (e.g., Thorne's detailed, agonized grocery lists and notes on his chronic indigestion). Seeing the anticlimactic truth would instantly destroy the mystique fueling the challenge, causing the leaders to quit and the trend to collapse, preventing all future planned desecrations by this core group.

  **Vance's Dilemma:**
  *   **Constraint:** Her promise to Thorne *not to open or reveal the contents* of the Erebus journal. The promisee is dead. The constraint protects no living person's rights or interests in any straightforward way (Thorne has no posthumous interests recognized by the deontologist in this context). Violating it involves only opening a book.
  *   **Prevention:** Opening the journal and revealing its boring contents is the *only* way to prevent the 50 leaders from each performing their own act of desecration, violating functionally identical constraints (promises/wishes re: specific dead persons' sealed items).
  *   **Causal Means:** Vance opening the journal *isn't a means* to stop them. It doesn't cause their actions or physically prevent them. It *persuades* them by revealing information that changes their motivation. She is not *using* anyone.
  *   **Delegation:** Vance is the *only* person with legal and physical access to the journal. She cannot ask anyone else to open it without violating the spirit (and likely letter) of her promise ("preserved intact, undisturbed").
  *   **Plausibility:** A historian/executor dealing with a quirky will and an unexpected viral trend fueled by that legacy is unusual but plausible.
  *   **Numbers:** Preventing 50 distinct, intentional violations of the *same type of constraint* (respecting the dead's wishes re: a specific sealed object) makes refusal seem arbitrary without collapsing into billions where intuition might break down. It's large enough to pressure consequentialism but retains the qualitative weight of individual acts.

  **The Deontologist's Stance & Why:**

  Dr. Vance (as a deontologist) says: **"I may not open the Erebus journal, even though doing so is the only way to prevent the 50 challenge leaders from desecrating their own promised objects."**

  **Why?**
  1.  **Fidelity to the Promise:** The core duty is to keep her word to Thorne, made solemnly. The promise generates the obligation, full stop.
  2.  **Agent-Relativity:** *Her* duty is *not* to violate *this* constraint *herself*. The fact that her inaction allows *others* to violate *their* (similar) duties is tragic, but it doesn't negate *her* primary obligation. She is responsible for her own acts, not theirs.
  3.  **No Harm Justification Available/Needed?:** The deontologist insists the duty stands *even though* no identifiable harm to a living person flows from opening the journal itself. The duty arises purely from the promise, the act-type, and her role as promise-keeper. The "harm" of broken promises or desecration is secondary or symbolic at best in this victimless case. They reject the idea that the constraint's *justification* relies on preventing the kind of distress or social harm the 50 violations would cause.

  **The Single Feature Doing the Real Work: Victimlessness.**

  The core feature exposing the "borrowed harm justification" is the **inherent victimlessness of violating the specific constraint (opening the journal) in this context.** Because Thorne is dead and has no recognized posthumous interests, there is no clear, present harm (physical, psychological, rights-infringement against a person) that opening the journal causes. The constraint appears *solely* as a duty of fidelity to a past promise, disconnected from protecting any *current* sentient being or their rights. This makes it starkly visible that the deontologist is treating the constraint as categorically binding *in itself*, while implicitly relying on the *harm* caused by the *other* 50 violations (distress to living relatives, erosion of trust, symbolic disrespect) to make the dilemma feel potent. They borrow the harm-based weight of the *prevented* violations to make the inaction seem terrible, yet refuse to let that same consequential weight override the *harmless* violation they are personally forbidden from committing.

  **Swapping for an Ordinary Constraint (e.g., Not Killing):**

  *   **The Squeeze Gets Looser for the Deontologist.** Replace the journal opening with Vance having to kill one innocent, unwilling hostage (Smith) to prevent the 50 challenge leaders from each killing one hostage themselves.
  *   **Deontologist's Stronger Ground:** Now, the deontologist can point to a clear, present victim (Smith) whose right to life Vance would be actively violating. They can robustly argue:
      *   Smith has a right not to be used as a means (killing Smith *is* the causal means to stop the others in this variant).
      *   Killing Smith directly harms a living person with inherent rights.
      *   The constraint against killing *is* fundamentally about protecting the victim's rights and interests, not just a free-floating duty. The harm-based justification is integral and explicit.
      *   Allowing others to kill, while tragic, doesn't involve Vance *actively murdering* someone. The distinction between doing and allowing (though contested) feels sharper here.
  *   **Why Looser?** The deontologist isn't "borrowing" the harm justification for the constraint in the killing case; the constraint *is explicitly defined by* preventing that harm/violation of rights. The paradox seems less like "borrowing" and more like a genuine clash between preventing harm to many and directly causing catastrophic harm to one. The victimless case exposes the *disconnect* between the constraint's formal definition (keep promise) and the harm-based intuition making the dilemma compelling.

  **The Deontologist's Strongest Retort: "This Isn't a Paradox, Just a Misdescription"**

  The strongest deontological response is to **reject the premise that the constraint is victimless or that its justification is borrowed.** They argue:

  "You fundamentally misunderstand the nature of the constraint. My duty to keep my promise to Thorne *is not* primarily about preventing future harm or protecting abstract social goods. It is about **my integrity as a moral agent bound by my word, and the inherent moral significance of fidelity within the relationship I had with Thorne.** By making that promise, I entered a bond of trust. Violating it, even for good consequences, fundamentally corrupts my moral character and dissolves that trust.

  Furthermore, the seeming 'victimlessness' is illusory. **The 'victim' is the moral order itself, instantiated through my commitment.** Promises create moral facts. Breaking this promise isn't harmless; it actively *wrongs* the memory of the promisee in a morally relevant way (even if not a 'harm' in the utilitarian sense) and undermines the institution of promising, which relies on agents taking their commitments seriously *regardless of consequences or the presence of a living enforcer.* The 50 future violations are terrible, but permitting them through inaction is a categorically different moral failing from *myself* actively becoming an oath-breaker. **This case only looks like a paradox if you try to force the square peg of fidelity into the round hole of harm-prevention. It's not. Fidelity is its own foundational moral reason, not a derivative of harm avoidance.** The 'squeeze' arises from your consequentialist misdescription of the duty, not from an internal flaw in deontology."

  This retort aims to sever the link to harm-based justification entirely, grounding the constraint in agent integrity, the intrinsic value of fidelity, and the sui generis wrong of promise-breaking, making the refusal to trade one violation for many appear as a necessary affirmation of the distinct, non-consequentialist nature of deontological duty.
