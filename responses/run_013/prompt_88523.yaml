prompt: |-
  Act as a philosopher of medicine who also knows film well enough to write criticism — someone who has the health/disease debates at their fingertips and can read a movie as a movie rather than as a worksheet. I'm a retired industrial chemist (thirty-odd years, mostly catalysts and process scale-up) who got into philosophy late and is now running a fortnightly film-and-philosophy night at the local library. Twelve or so regulars, a couple of retired nurses, one ex-GP, otherwise people like me who read too much and know just enough to be dangerous. I want to be sure I don't make a hash of it in front of the ex-GP.

  Next month is Awakenings, the 1990 Penny Marshall film with Robin Williams as Dr. Sayer and Robert De Niro as Leonard Lowe — the encephalitis lethargica patients who had been shut down for decades, who wake up on L-DOPA, and who then slide back. I'm confident about the broad shape of it but not about details, so if anything I say about the film is wrong, say so and drop it rather than building on it.

  Here's what set me off. In my old trade nobody doubted that a malfunction is a malfunction: the enzyme doesn't work, the column fouls, end of story. I assumed 'disease' names a fact about bodies in roughly that way. Now I'm reading people who say it's partly a value-laden judgement about how a person ought to be able to live, and annoyingly they don't seem crazy. So I want a reading of the film through that split — naturalist accounts (species-typical functioning, or something like a harmful dysfunction) against normativist ones (disease as a judgement about suffering, or about a person's goals and values) — but I don't want the film used as a mere illustration. It's a better film than that.

  What interests me is the shape of the story. Leonard is, by any species-typical measure, badly broken for thirty years. When he gets his function back he suffers — restless, aware of lost time, tormented — and then it's taken away again. And my memory is that some of the patients, once they can speak, don't describe those lost years as suffering at all. Check me on that; if the film doesn't bear it out, drop it and work with what it does bear out.

  So, please:

  - Start by brainstorming three or four candidate readings of the film before you commit to one, then take the strongest.
  - Say which account of disease the film's doctors are implicitly working with, and where a particular scene forces a choice between accounts.
  - Address this directly: should 'disease' be indexed to the person's own baseline and history, rather than to a species norm? On the film's own logic, is the relapse a return to health or a fresh injury — and is the doctor's joy at the awakening evidence about health at all, or about something else?
  - Say where the film resists the reading. Don't fudge it. Tell me where the philosophy has to be bent to fit the movie, and where the movie is doing something the debate has no slot for.
  - Finish with what the film adds that argument alone doesn't.

  No citations, no reading list, no works to go look up — I'll fill in references myself. Don't quote dialogue from memory. Just talk about positions and arguments. Write it for someone who will have to answer questions from a retired GP afterwards.

  Then, after the prose, give me a short structured summary I can print on the back of the handout, as a JSON object with exactly these fields: "working_title" (a few words), "thesis" (one sentence), "account_assumed_by_the_doctors" (the naturalist or normativist account the film's physicians seem to hold, in one sentence), "key_scenes" (array of three objects, each with "scene" and "what_it_shows"), "patient_testimony" (what the patients' own reports do to the naturalist/normativist split), "baseline_verdict" (one of "personal baseline supported", "species norm supported", "undecided", plus a sentence of why), "where_the_film_resists" (one or two sentences), "what_the_film_adds" (one sentence), "weakest_step" (the part of your reading you'd defend least confidently), "confidence" (a number from 0 to 1), and "one_line_for_the_group" (a single sentence I can say out loud to start the discussion). Keep the JSON valid and keep every string short enough to fit on a handout.
