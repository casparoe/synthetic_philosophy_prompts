prompt: |-
  You're a philosopher who works on commodification and the moral limits of markets, so I want your considered take, not a survey. I'm drafting a paper and before I read anything else I want the spec sheet: what does an adequate theory of "things that shouldn't be bought and sold" have to deliver? Give me the desiderata, each with the case or consideration that motivates it.

  Cases it has to get right: kidney sales (I lean welfarist and Im genuinely torn), hurricane price gouging, vote selling, and one of my own that the stock examples dont cover: a firm that buys a perpetual exclusive license to your face, voice and gait for AI training, paid monthly, and the contract survives your death, so your heirs cant revoke it. Whatever it says has to square with the fact that we already sell labor, dangerous labor, plasma, sex and surrogacy in various places, and it cant just recode my gut reactions as premises.

  The distinctions it mustn't collapse: coercion vs. mere voluntariness under bad options; wronging a person vs. degrading a good; the good being priced vs. the person being priced; repugnance as evidence for something vs. repugnance as the thing to be explained. And it needs to say what's doing the normative work -- harm, coercion, corruption of a good's meaning, or disgust -- and whether that's a property of the good, the transaction, or the parties.

  Mark which requirements are non-negotiable and which are one camp's commitments. Tell me which single requirement does the most excluding work, and if a subset is jointly unsatisfiable -- I suspect my AI-likeness case and the requirement not to second-guess people's existing market choices pull against each other -- say which one to drop and why. Brainstorm the candidates first, then commit to a position; don't hand me a menu. A table's fine.
reasoning: |-
  Okay, let's tackle this user's query. They're drafting a paper on commodification and need a theory that specifies what shouldn't be bought and sold. The user provided specific cases: kidney sales, price gouging, vote selling, and a unique AI likeness scenario. They also listed distinctions the theory must address and existing market practices like labor and surrogacy.

  First, I need to outline the essential requirements for such a theory. The user wants desiderata with motivating cases. Let's start by listing non-negotiables. The theory must explain why some exchanges wrong individuals or degrade social goods. For example, vote selling undermines democracy, which is a non-negotiable point. Then there's coercion versus bad options; kidney sales often involve exploitation due to desperation, not just voluntariness. The AI likeness case highlights the need to protect posthumous interests, which conflicts with respecting market choices. 

  The user is torn on kidney sales, so the theory must handle that. Price gouging during hurricanes tests efficiency versus exploitation. Existing markets like surrogacy mean the theory can't dismiss all bodily services. The AI case is crucial because it involves perpetual control, merging commodification of identity and posthumous harm. 

  Distinctions like wronging a person versus degrading a good are vital. Votes are about degrading a social good, while kidney sales might wrong the seller through exploitation. Repugnance as evidence versus the thing to be explained—here, disgust might signal harm but shouldn't be the reason itself. 

  The normative work needs clarification: is it harm, coercion, corruption, or disgust? The user wants to know if it's about the good, transaction, or parties. For instance, corruption applies to the good (like votes), while coercion is about the transaction context. 

  The tension between the AI case and respecting market choices is apparent. The user suspects these conflict. Protecting posthumous interests might require limiting market freedoms, so one must be prioritized. Since respecting choices is a defeasible commitment, and the AI case involves irreversible harm, dropping strict market deference makes sense. 

  Key non-negotiables include explaining wrongs/degradation, coercion vs. bad options, and the AI case's implications. The most excluding requirement is the corruption of social goods, as it blocks markets like votes or political influence. 

  Finally, committing to a position: pluralist theory with harm and corruption doing the work. Harm covers exploitation in kidney sales, corruption addresses votes and AI likeness as degrading personhood. This handles the cases without relying on repugnance alone.
answer: |-
  Here’s the spec sheet for a robust theory of market moral limits, structured by your requirements. I’ll first outline the core desiderata (non-negotiables in **bold**), then resolve tensions and commit to a position.

  ---

  ### **I. Non-Negotiable Desiderata** (Groundwork any theory must cover)

  1. **Distinguish Wrongful Commodification from Mere Repugnance**  
     - *Motivation*: Repugnance (e.g., toward surrogacy) may signal harm or corruption but isn’t self-justifying. The theory must identify *why* an exchange is wrong beyond disgust (e.g., vote selling degrades democracy; non-consensual AI likeness commodifies identity post-mortem).  
     - *Non-negotiable*: Repugnance is evidence, not the explanandum.

  2. **Explain Harm vs. Corruption of Meaning**  
     - *Motivation*: Kidney sales may harm the poor (exploitation), but vote selling corrupts democracy’s meaning even if consensual. The AI-likeness case corrupts personhood by treating identity as alienable property beyond death.  
     - *Non-negotiable*: Must separate transactional harm (coercion/exploitation) from degradation of social/expressive goods.

  3. **Address Coercion vs. Desperation**  
     - *Motivation*: Price gouging exploits necessity (bad option set); kidney sales may involve "voluntary" choices under duress. Contrast with plasma donation: same biological good, but context alters permissibility.  
     - *Non-negotiabl*e: Cannot equate structural desperation with genuine consent.

  ---

  ### **II. Substantive Desiderata** (Camp-specific commitments flagged)

  4. **Respect Existing Market Choices (Defeasibly)**  
     - *Motivation*: Sex work/surrogacy are legal in some societies without clear systemic harm. Theory shouldn’t default to paternalism.  
     - *Commitment*: Welfarist/autonomy-leaning. **Negotiable** if corruption is primary.

  5. **Protect Social Goods from Degradation**  
     - *Motivation*: Votes shouldn’t be sold because democracy requires equal voice; AI likeness commodification turns personhood into a perpetual corporate asset, dissolving boundaries between self and capital.  
     - *Commitment*: Communitarian/expressivist. **Negotiable** for strict libertarians.

  6. **Handle Temporal/Posthumous Effects**  
     - *Motivation*: The AI-likeness case creates irreversible, intergenerational control detached from human agency. Contrasts with labor (time-bound) or surrogacy (child’s interests supersede contract).  
     - *Non-negotiable*: Must account for permanence and dissociation from the commodified self.

  ---

  ### **III. Key Distinctions the Theory Must Preserve**

  | Distinction                | Example                                  | Why Essential                          |
  |----------------------------|------------------------------------------|----------------------------------------|
  | Coercion vs. Bad Options   | Kidney seller in poverty vs. gun to head | Voluntariness isn’t binary             |
  | Wronging vs. Degrading     | Exploitative surrogacy vs. vote selling  | Harm to persons ≠ devaluation of goods |
  | Pricing Goods vs. Persons  | Selling labor vs. slavery                | Contingent vs. constitutive alienation |
  | Repugnance as Evidence/Thing | Disgust at kidney sales vs. AI likeness  | Signal vs. object of inquiry           |

  ---

  ### **IV. Normative Work: What’s Doing the Lifting?**
  - **Source**: Pluralist grounds (harm **and** corruption).  
  - **Locus**: Primarily the **good** (its social meaning/function), secondarily the **transaction** (context of choice).  
    - *Why*: Kidney sales involve a *good* (bodily integrity) whose marketization risks exploitation and expresses reductionism. AI likeness commodifies a *good* (identity) fundamental to personhood. Price gouging is a *transactional* wrong (exploiting vulnerability).  
  - **Disgust’s Role**: Epistemic tool to flag potential corruption/harm, not normative foundation.

  ---

  ### **V. Tension Resolution: The AI-Likeness vs. Market Choice Conflict**
  - **Conflict**: Your AI case demands limits on alienation (even consensual) to protect personhood. Market deference opposes such limits.  
  - **Resolution**: Drop strict **Requirement 4 (Market Choice Respect)** as defeasible.  
    - *Why*: Perpetual AI likeness commodification irrevocably degrades the constitutive elements of personhood (face/voice/gait as identity anchors). Unlike labor or surrogacy, it lacks temporal bounds, enables posthumous manipulation, and severs identity from agency. Existing markets for dangerous labor/sex don’t dissolve the self’s boundaries comparably.  
  - **Winner**: **Requirement 6 (Temporal/Posthumous Effects)** + **Requirement 2 (Corruption)**. Consent here enables infinite dissociation of self from identity – a corruption of personhood’s "non-fungibility."

  ---

  ### **VI. The Most Excluding Requirement**
  **Requirement 2: Corruption of Meaning**  
  - *Excluding Power*: It blocks markets even when voluntary and harmless (e.g., vote sales, baby-selling, AI likeness). Harms-based theories (e.g., welfare economics) can’t easily explain these prohibitions.  
  - *Does Heavy Lifting*: Explains why kidney sales *might* be wrong absent exploitation (if they express reduction of persons to parts), and why your AI case is impermissible despite consent.

  ---

  ### **VII. Committed Position: Pluralist Expressivism**
  Adequate theory must:  
  1. **Identify Social Meanings**: Goods like votes, personhood (AI case), or kidneys have constitutive roles in human practices.  
  2. **Assess Degradation Risk**: Markets corrupt when they detach goods from their social meaning (votes → influence peddling; identity → corporate IP).  
  3. **Constrain by Harm/Exploitation**: Corruption concerns don’t override dire need (e.g., kidney sales permissible *if* regulated to prevent desperation exploitation).  
  4. **Prioritize Temporal Integrity**: Perpetual/irreversible commodification (AI likeness) is suspect prima facie due to dissociation from human purposes.  

  **Applied to Your Cases**:  
  - **Kidney Sales**: Permissible *if* no exploitation (desperation mitigated), but regulated to avoid expressive reductionism.  
  - **Price Gouging**: Prohibited as transactional exploitation of vulnerability.  
  - **Vote Selling**: Corrupts democracy’s meaning – impermissible.  
  - **AI Likeness**: Corrupts personhood + permanent dissociation – impermissible.  
  - **Existing Markets (sex/labor/surrogacy)**: Permissible where harm/exploitation minimized and social meanings adaptable (e.g., surrogacy as labor, not baby-selling).  

  **Why Not Welfarism?** It can’t explain the wrong in uncontroversially prohibited markets (votes) or your AI case without smuggling in corruption concerns. Expressivism captures the full range.

  ---

  **Final Spec**  
  Your theory must explain commodification’s wrongs as *either* harm/exploitation *or* corruption of social meaning, with temporal/permanence effects as amplifiers. Drop unqualified market deference when constitutive goods are at stake. The AI case is your litmus test – if the theory can’t condemn that, it fails.
