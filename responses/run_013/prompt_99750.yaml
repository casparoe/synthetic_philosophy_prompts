prompt: |-
  I host a small interdisciplinary interview series for a graduate seminar in comparative political theory, and our next guest is a political anthropologist who has spent roughly two decades doing fieldwork inside West African and Southeast Asian bureaucracies. Her book is a sustained attack on what she calls the universalist camp in anti-corruption work: her claim is that the global anti-corruption industry has quietly smuggled in a specifically modern, Western conception of the public office — one that presupposes a sharp separation between a role-holder's public duties and his private obligations, and that treats any flow of value across that line as a breach — and then mistaken that conception for a neutral, culture-free standard. She insists on separating three things I keep collapsing into one: (a) straightforward embezzlement of public funds for private luxury; (b) clientelism, which she argues can be a stable, predictable, and even accountable mode of representation, in which a patron who fails to deliver for his clients loses standing and can be punished at the next opportunity; and (c) the gift-giving, hospitality, and reciprocal favor that sustain the personal relationships through which anything gets done at all where impersonal institutions are weak. She grants that (a) is uncontroversially wrong, but claims that folding (b) and (c) into the same index as (a) is both descriptively distorting and politically self-serving, since it lets rich countries score well on a metric built to flatter their own institutional form.

  I'd like eight to ten interview questions that press her rather than let her restate the book, with at least one question each on: the standing objection that clientelism substitutes private for public accountability and reliably hurts the poor, who lack the leverage to punish a patron; the so-called grease-the-wheels versus sand-the-wheels dispute over whether informal payments can ever improve outcomes in an over-regulated economy; whether her position collapses into a moral relativism she'd disown, or whether she can name a standard that is not merely local — for instance, whether a practice is transparent to those it binds, or whether its burdens fall on people who could refuse them; how she proposes to tell a gift that is constitutive of a relationship from a bribe that is merely disguised as one, and whether there is a fact of the matter there or only the participants' own understanding; and the collective-action problem, where if everyone is doing it, individual defection looks less like integrity than like self-harm. For each of those, give me a follow-up keyed to the answer she is most likely to give — I want the sequence to make her standard moves progressively harder to use, and I want to end on whether a genuinely non-parochial concept of corruption is even constructible, or whether the honest conclusion is that we should stop pretending the word names one thing.

  Finally, close with a short note on where this line of questioning is most likely to fail: flag which of the questions presupposes a reading of her view she might plausibly reject, identify the one most likely to read as a cheap gotcha rather than a genuine press, and say which answer she could give that ought to make you abandon the sequence you have built.
reasoning: |-
  Okay, the user hosts a graduate seminar in comparative political theory and is interviewing a political anthropologist who critiques the universalist approach in anti-corruption work. The anthropologist distinguishes between embezzlement, clientelism, and gift-giving. The user wants challenging questions that press her on key points like clientelism harming the poor, the grease/sand debate, moral relativism, distinguishing gifts from bribes, and collective action. They also want follow-ups to make her standard moves harder and end on whether a non-parochial corruption concept is possible. Plus, they need a note on where the questions might fail.

  First, I need to understand the core of her argument. She claims that anti-corruption efforts impose a Western view of public vs. private separation, collapsing distinct practices. The user wants to push back without letting her restate her book. The key areas are clientelism's impact on the poor, whether informal payments can be efficient, avoiding moral relativism, differentiating gifts from bribes, and the collective action problem. The follow-ups should challenge her responses effectively.

  For clientelism harming the poor, the initial question should focus on accountability and how the poor lack leverage. Her likely response is that clientelism can be accountable through community sanctions. The follow-up needs to address why such systems remain exploitative despite that, maybe citing specific studies. Then push on whether the poor's consent is meaningful under duress.

  On the grease-the-wheels debate, she might argue that in over-regulated contexts, informal payments improve efficiency. The follow-up should challenge the sustainability of such systems and whether they entrench inefficiency. Ask if there's evidence of these payments leading to long-term improvements or just maintaining dysfunction.

  For moral relativism, she probably appeals to local legitimacy. The follow-up needs to press on practices that are locally accepted but harmful, like caste systems. Question if her criteria can condemn such practices without using universal standards. This tests if her standard is truly non-local.

  Distinguishing gifts from bribes, she might say it's about relationship context and transparency. Follow up by asking about ambiguous cases and if there's an objective difference. Use examples where the same act could be seen as either, challenging the idea that participant understanding is sufficient.

  The collective action problem: her response might focus on incremental change. Follow-up questions the cost of integrity where systems are corrupt. Ask if individual defectors need institutional support, implying her framework doesn't address systemic change.

  Ending on a non-parochial concept of corruption. Question if such a concept is possible or if we should stop using "corruption" as a single term. Her answer here could determine the practical implications of her critique.

  Now, the note on where questioning might fail. The moral relativism question risks being a gotcha if it oversimplifies her view. She might reject the premise that her criteria are insufficient for harmful practices. If she argues that her framework allows internal critique without universalism, that could undermine the question. Also, the gift vs. bribe distinction might be seen as a cheap gotcha if participant understanding is central to her argument. If she provides a nuanced response about contextual norms, the follow-up might not hold. The user should be prepared to pivot if she effectively defends her position without relying on relativism.
answer: |-
  Here are eight focused interview questions with challenging follow-ups designed to press her arguments and explore tensions, structured as requested:

  1.  **On Clientelism & the Poor:** "You argue clientelism can be stable and accountable through client sanction. But critics like Stokes argue it systematically disadvantages the poor, who lack the resources or leverage to effectively punish a patron who fails them. Doesn't clientelism, by its nature, substitute *private accountability* (to specific clients) for *public accountability* (to all citizens or the law), inherently prioritizing those who can offer more to the patron?"
      *   **Likely Answer:** She’ll emphasize the *relative* leverage within communities, the importance of reputation sanctions beyond immediate resources, and the failure of formal institutions to serve the poor.
      *   **Follow-Up:** "If a poor client's only 'leverage' is withholding a vote *years later* or social shaming, while a wealthy client can offer immediate financial support or threats, doesn't this system structurally reproduce inequality, even if it's 'stable'? Can a system be truly 'accountable' if the cost of holding the powerful to account falls disproportionately and punitively on the weakest?"

  2.  **On the "Grease vs. Sand" Debate:** "You critique universalist anti-corruption metrics for failing to distinguish harmful extraction from functional lubrication. In an over-regulated, inefficient bureaucracy, couldn't some informal payments ('grease') actually improve outcomes by cutting through red tape, making them functionally efficient, even if technically corrupt by a universalist standard?"
      *   **Likely Answer:** She’ll agree, arguing that in specific contexts, these payments make dysfunctional systems work and meet citizen needs where formal channels fail.
      *   **Follow-Up:** "Doesn't accepting 'grease' as functional risk legitimizing and perpetuating the very inefficiency and weak institutions that create the demand for it? How do we prevent the 'solution' (informal payment) from becoming the primary source of revenue for officials, actively incentivizing them *against* improving formal systems (sanding the wheels long-term)?"

  3.  **On Moral Relativism & Trans-local Standards:** "You reject the universalist standard but disavow relativism. You suggest criteria like transparency to participants and the ability to refuse. But consider a caste-based obligation or a deeply patriarchal norm that's locally understood and where refusal is socially impossible. By your criteria, might this *not* be corrupt? Does your framework have the resources to condemn practices that are locally legitimate but cause severe, identifiable harm?"
      *   **Likely Answer:** She’ll clarify that "ability to refuse" means meaningful agency within the social context (not abstract freedom) and argue harm must be assessed within that local framework, perhaps adding criteria like whether the practice systematically excludes or exploits groups.
      *   **Follow-Up:** "If 'meaningful agency' and 'harm' are defined *within* the local framework, how does this avoid relativism? Couldn't a dominant group define agency and harm in ways that justify their privilege? Isn't the core challenge precisely when local legitimacy clashes with trans-local notions of harm or rights?"

  4.  **On Distinguishing Gift from Bribe:** "You insist on separating constitutive gift-giving from bribes disguised as gifts. But how do we *operationally* distinguish them, especially for an outsider or reformer? Is the difference solely in the *participants' understanding* of the relationship and the obligation incurred, or is there an objective, observable fact of the matter?"
      *   **Likely Answer:** She’ll emphasize context, timing, reciprocity, publicity (within the relevant network), and the nature of the relationship. It's embedded social meaning, not a single objective fact.
      *   **Follow-Up:** "What about ambiguous cases? Consider a large 'gift' given publicly during a festival by a contractor to an official, followed by a contract award. If both parties *understand* this as part of a continuous reciprocal relationship, is it constitutive? What if an auditor sees coercion or undue influence the participants deny? Does participant understanding *always* trump external observation of power imbalance?"

  5.  **On Collective Action & the Cost of Integrity:** "You argue that practices like essential gift-giving are necessary 'where impersonal institutions are weak.' But this creates a vicious collective action problem. If *everyone* relies on these personal connections and favors, the official or citizen who tries to 'defect' and act 'impersonally' faces high costs – inefficiency, exclusion, or worse. Doesn't this make individual integrity look like costly self-harm rather than virtue, trapping the whole system?"
      *   **Likely Answer:** She’ll acknowledge the trap but argue it underscores the need for *systemic* institutional change, not individual moralizing or importing external standards that ignore the functional role of these practices.
      *   **Follow-Up:** "Doesn't your framework, by legitimizing the functional necessity of these practices *within* weak systems, inadvertently make systemic change harder? If we accept that gifts/favors are constitutive *now*, how do we ever transition to the 'impersonal institution' ideal without imposing a 'parochial' standard? Isn't your analysis better at critiquing universalism than offering a path out of the collective action trap?"

  6.  **On the Target of Critique:** "Your book is a powerful critique of the *global anti-corruption industry*. But does this focus risk downplaying the agency and critiques of reformers, activists, and ordinary citizens *within* West African or Southeast Asian contexts who *do* experience clientelism or certain gift demands as oppressive or corrupt, even if they don't use the universalist framework?"
      *   **Likely Answer:** She’ll argue her framework helps understand *why* those critiques take specific local forms and that universalist metrics often drown out or mischaracterize these local struggles, failing to address root institutional causes.
      *   **Follow-Up:** "How does your anthropology ensure that the 'local understanding' it privileges isn't unconsciously favoring the perspective of powerful actors within those systems (officials, established patrons) who benefit from the status quo, over the critiques of marginalized groups or reformers?"

  7.  **On the Universality of (a):** "You grant that straightforward embezzlement (a) is uncontroversially wrong. Why is *this* distinction universally legible? Doesn't condemning (a) itself rely on *some* notion of separating public resources from private gain – the very conceptual separation you argue is parochial when applied to (b) and (c)?"
      *   **Likely Answer:** She’ll argue that (a) involves outright theft and deception, violating even local norms of custodianship and trust in a way that (b) and (c), operating within understood reciprocal frameworks, do not.
      *   **Follow-Up:** "But isn't the definition of 'public resource' and 'theft' itself culturally contingent? If the official's role is understood as inherently fused with their lineage obligations (using state resources for them), could even embezzlement be locally justified? Doesn't condemning (a) require *some* baseline, non-parochial concept of misuse of entrusted power/resources?"

  8.  **On the Concept of Corruption Itself (Conclusion):** "Pulling this together: Your work powerfully demonstrates the parochialism of dominant anti-corruption frameworks. But does this lead us to conclude that a genuinely *non-parochial*, universally applicable concept of 'corruption' is simply *unconstructible*? Should we stop pretending 'corruption' names a single, cross-culturally identifiable phenomenon and instead focus on context-specific analyses of power abuse, institutional dysfunction, or violated local expectations?"
      *   **Likely Answer:** She’ll likely lean towards this, arguing "corruption" as a singular global metric is counterproductive and that we need granular, context-sensitive analyses of specific practices and their effects within their social and institutional ecosystems.
      *   **Follow-Up:** "If we abandon the universal concept, how do we facilitate transnational dialogue or action on problems like grand kleptocracy or global money laundering that inherently cross borders and rely on exploiting *differences* in local norms and institutions? Doesn't *some* minimal, trans-local standard – perhaps focused on extreme harm, deception, or violation of *explicit, locally established* rules – remain necessary?"

  **Where This Line of Questioning is Most Likely to Fail - A Short Note:**

  1.  **Problematic Presupposition:** Question 3 (Relativism) and its follow-up risk presupposing she *needs* a trans-local standard to avoid relativism. She might firmly reject this need, arguing robust critique can emerge *immanently* from within local frameworks or via comparison without universalism. If she compellingly argues that her "transparency/refusal/harm-within-context" criteria *are* sufficient and derived non-parochially (e.g., through comparative anthropology identifying functional equivalents), the "relativism" charge may not stick, forcing a rethink.
  2.  **Cheap Gotcha Risk:** Question 4 (Gift vs. Bribe) and its follow-up, particularly the "participant understanding vs. objective fact" angle, could easily feel like a philosophical gotcha ("What about the duck-rabbit of gifts?!"). If she has a nuanced, practice-oriented response focused on observable social patterns and sanctions *within the context*, rather than getting drawn into metaphysics, this line might fizzle and appear pedantic.
  3.  **Abandon-the-Sequence Trigger:** The most likely answer that should make me abandon the planned sequence is if, in response to Question 7 (Universality of a) or Question 8 (Non-parochial concept), she provides a compelling, *positive* account of a non-parochial standard derived *from comparative analysis itself* (e.g., identifying cross-cultural "family resemblances" of abuse, or grounding norms in basic human needs/functional prerequisites of social organization observed anthropologically). If she moves beyond critique to offer a convincing alternative foundation, pressing the "relativism" or "concept collapse" points would become counterproductive; the focus should shift to evaluating *her* proposed standard.
