prompt: |-
  I was present at a seminar discussion between two fellow students, Ines and Marcus, and they have asked me to referee an argument I could not settle. The subject is Aquinas on tyrannicide. I would like you to act as an expert in medieval political thought and in Aquinas's moral theology, and to adjudicate their exchange move by move. Please think carefully about the main interpretive options before you commit to a verdict, but write your final answer as continuous prose. Do not use headings, bullet points, bold text, or tables. Do not give me a bibliography, reading list, or citations. Answer in British English.

  Ines began: Aquinas is a consistent opponent of tyrannicide. In the Summa Theologiae he treats sedition as always a mortal sin, and killing a tyrant is a seditious act; in On Kingship he warns that private individuals must not kill a tyrant, and that a tolerable tyranny should be borne rather than overthrown, since the remedy may be worse than the disease. So the apparent permission for resistance is misleading.

  Marcus replied: That is too quick. In the Summa Aquinas says a tyrannical government is not just and that disturbing it is not sedition, because the tyrant is the one who fosters discord. He forbids private individuals from taking over the role of public authority, but he does not forbid resistance as such. In the early Sentences commentary he even says that killing a usurping tyrant can be praiseworthy. So Aquinas allows tyrannicide under some conditions.

  Ines answered: The early text is an outlier. The mature view, especially in On Kingship, repudiates assassination. It says the remedy for tyranny is public deposition or recourse to God, not the dagger. It also warns that killing one tyrant often produces a worse one. The Summa's restriction to public authority is in effect a ban on private tyrannicide, which is what people normally mean by tyrannicide. Marcus is conflating public resistance with tyrannicide.

  Marcus said: But public deposition can involve killing, and Aquinas's principle is not never kill a tyrant but never kill a tyrant without public authority. If a legitimate public authority deposes a tyrant and he resists, lethal force may be justified. Also, in the Sentences he distinguishes a tyrant by usurpation from a tyrant who abuses a legitimate title. For a usurper, there is no legitimate authority to appeal to, so private killing may be permitted. That is not a retraction but a development: the later works specify the authority condition more clearly.

  Ines replied: Development or not, the later works are more restrictive. The Sentences may have said that a usurper can be killed by anyone, but the Summa says it is not the business of private individuals to overthrow a tyrant, full stop. And On Kingship says even public deposition is dangerous and should be a last resort. So the mature view is that tyrannicide is almost never justified. The early text is not a reliable guide.

  Marcus came back: Almost never is not never. And the mature view still permits resistance by public authority, and it still says that disturbing a tyrannical government is not sedition. So Ines is overstating the restriction. The distinction between a tyrant by defect of title and a tyrant by abuse of power explains why the early text is not simply abandoned: the later works focus on the case where the tyrant has some title, where private action is forbidden. The early text focuses on the usurper, where the title is absent. The two can be reconciled.

  Ines answered: Then the reconciliation makes the view depend on a controversial theory of legitimacy. Who counts as public authority? If a usurper is in power, who has the authority to kill him? Marcus says anyone; Aquinas later says only public authority. That is a substantive change, not a mere clarification. And the Summa's exception for excessive tyranny still says recourse to God, not to the knife. So the later view is a principled rejection of private tyrannicide.

  Marcus said: But the Summa also says that if the tyranny is excessive, the tyrant is guilty of sedition, and resisting him is not sedition. That gives a moral permission to resist. The question is only who may do it. So Ines is right that private assassination is forbidden, but wrong that Aquinas is a quietist about tyranny. He is a constitutionalist about resistance, not an absolute pacifist.

  Please adjudicate their exchange move by move, not merely overall. For each of the main claims they make, say whether it is clearly mistaken, partly right, or clearly right, and briefly justify your rating. Then say who is right about which specific point. In particular, address whether the early and later texts can be reconciled by the distinction between a tyrant by defect of title and a tyrant by abuse of power, or whether the later texts represent a genuine development or retraction. Also say what principle best captures Aquinas's considered view, and what both Ines and Marcus are missing. Do not simply say that both are partly right; give a genuine verdict on the disputed moves.
reasoning: |-
  Okay, the user wants me to act as an expert in medieval political thought and Aquinas's moral theology to adjudicate an argument between two students, Ines and Marcus, about Aquinas's position on tyrannicide. They've presented their exchange move by move, and I need to evaluate each claim carefully before giving a final verdict.

  Let me start by recalling Aquinas's relevant texts. In the Summa Theologiae (II-II, q.42), Aquinas defines sedition as contrary to the unity of the people and always sinful. However, he makes an exception when resisting a tyrannical regime, arguing that the tyrant is the real seditious one. In De Regno (On Kingship), he warns against private individuals killing tyrants, emphasizing the dangers of such actions and suggesting public deposition or divine recourse as remedies. His early Commentary on the Sentences (II, d.44, q.2, a.2) does suggest that killing a usurping tyrant could be praiseworthy.

  Looking at Ines's first point: she claims Aquinas consistently opposes tyrannicide. Her references to Summa and De Regno are accurate regarding sedition and warnings against private action. But she misses the exception for resisting tyranny, so I'd rate this as partly right but incomplete. Marcus counters by pointing to the Summa's distinction between just and tyrannical governments. He correctly notes Aquinas doesn't forbid resistance altogether and cites the early Sentences commentary. His claim is clearly right about the Summa but oversimplifies the early text's status.

  Ines then argues the early text is an outlier, emphasizing De Regno's rejection of assassination. She's right that the mature works are more cautious, but calling the Sentences an outlier ignores Aquinas's later distinctions. This is partly right but underplays continuity. Marcus responds by noting public deposition could involve killing and distinguishing usurpers from abusive rulers. His point about the authority condition being clarified rather than retracted is mostly correct, though he overstates how neatly the texts reconcile.

  Ines counters that later works are more restrictive, citing Summa's blanket prohibition on private action. She's clearly right about the mature view restricting private tyrannicide but overstates "almost never justified." Marcus pushes back, arguing the distinction between title defects and abuse reconciles the texts. This is plausible but requires careful handling - the Summa doesn't explicitly revive the usurper exception, so Marcus is partly right but potentially smoothing over tensions.

  Finally, Ines questions who counts as authority under usurpation, highlighting a genuine ambiguity. Marcus concedes private assassination is forbidden but defends constitutional resistance. Both make valid points here.

  For my verdict: The title defect vs. abuse distinction does reconcile most texts when understood as Marcus suggests, but Aquinas never explicitly restates the usurper exception after the Sentences. The development is more refinement than retraction. Aquinas's core principle is that resistance must align with public authority's judgment - never purely private vigilantism. Both students miss that for Aquinas, "public authority" could include natural leaders in vacuums of power, not just formal offices. Ines underestimates his permission for forceful resistance; Marcus downplays how cautiously Aquinas frames even public action.
answer: |-
  Regarding Ines's opening statement that Aquinas is a "consistent opponent of tyrannicide": this is **partly right but misleading**. She correctly cites his condemnation of sedition in the *Summa Theologiae* (II-II, q.42) and his warnings against private action and the dangers of revolt in *De Regno* (On Kingship). However, her claim that killing a tyrant is "always" seditious ignores Aquinas's explicit exception for resisting tyranny itself, making her assertion of consistent opposition an overstatement.

  Marcus's first reply is **clearly right** on the key point. He accurately notes Aquinas's distinction in the *Summa* (II-II, q.42, a.2, ad 3) that disturbing a *tyrannical* regime is not sedition because the tyrant is the true author of discord. His reference to the *Sentences Commentary* (II Sent. d.44, q.2, a.2) correctly identifies an instance where Aquinas explicitly permits killing a usurper. His claim that Aquinas forbids private individuals usurping public authority's role, but not resistance *per se*, is sound.

  Ines's response that the early *Sentences* text is an "outlier" is **partly right but overstated**. While *De Regno* indeed emphasises public deposition and divine recourse over assassination and warns of worse outcomes, it does not explicitly retract the *Sentences* view. Her point that the *Summa*'s restriction effectively bans *private* tyrannicide (the common meaning) is **clearly right**, and her accusation that Marcus conflates public resistance with tyrannicide is largely **valid** at this stage.

  Marcus's subsequent point that public deposition *can* involve lethal force is **clearly right**; Aquinas's principles of just authority and just cause could encompass killing a resisting tyrant during legitimate deposition. His argument that the *Sentences* distinction between a tyrant *ex defectu tituli* (by defect of title/usurper) and a tyrant *ex parte exercitii* (by abuse of power) is a "development" clarifying the "authority condition" is **largely plausible**. The later works focus heavily on the latter case (abuse of power by a ruler with some title), where private action is clearly forbidden, without explicitly contradicting the *Sentences* treatment of the former (usurpation).

  Ines's reply that the later works are "more restrictive" is **clearly right**, especially regarding private action. Her assertion that the *Summa* forbids private individuals overthrowing a tyrant "full stop" is **accurate** for the cases it primarily addresses (rulers with title who become tyrannical). However, her claim that the mature view holds tyrannicide is "almost never justified" is **partly right but imprecise**; it conflates *private* tyrannicide (which is forbidden) with resistance involving public authority (which is permitted in extremis).

  Marcus's comeback that "almost never is not never" is **clearly right** regarding resistance by public authority. His argument that the *Sentences* and later works can be reconciled via the tyrant-type distinction is **the strongest interpretive option**. While the *Summa* and *De Regno* don't explicitly reiterate the usurper exception, they don't negate it either; they focus on the more complex case of titled tyrants. This is a **clarifying development, not a retraction**.

  Ines's challenge on the "controversial theory of legitimacy" (who counts as authority against a usurper?) highlights a **genuine ambiguity**. While the *Sentences* suggests "anyone" can kill a usurper, the later emphasis on "public authority" creates tension. Marcus's assertion that "anyone" suffices for a usurper relies solely on the early text; the mature works offer no clear answer, making this point **inconclusive but leaning towards Marcus's reconciliation**. Her point that the *Summa* advocates "recourse to God" rather than "the knife" for excessive tyranny is **correct**, but this pertains to cases lacking legitimate human authority, not usurpation specifically.

  Marcus's final point is **clearly right**: Aquinas is not a quietist; he morally permits resistance against excessive tyranny but insists it be channelled through legitimate authority (making him a "constitutionalist"). Ines is correct that he forbids private assassination, but wrong to imply he demands passive endurance under all tyranny.

  **Specific Verdicts on Disputed Moves:**

  1.  **Can early/later texts be reconciled by the tyrant-type distinction?** **Yes, largely.** The distinction provides the most coherent framework. The *Sentences* addresses usurpers (*ex defectu tituli*) where no legitimate authority exists, potentially permitting private action. The *Summa* and *De Regno* primarily address rulers who *have* legitimate title but rule tyrannically (*ex parte exercitii*), forbidding private action and emphasising public authority/divine recourse.
  2.  **Do later texts represent a development or retraction?** **A development, not a retraction.** The core principle – resistance requires legitimate authority – is consistent. The later works develop this by focusing on the complexities of resisting a ruler with initial legitimacy, stressing the dangers of revolt, and refining the concept of "public authority". They do not explicitly retract the usurper exception but arguably render it practically marginal by emphasising alternative remedies and the risks of violence.
  3.  **Aquinas's Considered Principle:** **Lethal force against a tyrant can only be justified as an act of public authority (either existing or arising in a vacuum of legitimacy like usurpation) acting for the common good to remove an intolerable injustice, when no safer remedy exists, and where the likely outcome is not worse than the tyranny itself. Private individuals lack this authority and may never licitly assassinate a ruler.**
  4.  **What Both Miss:** **Ines** underestimates the permissibility and potential *necessity* of forceful resistance (including lethal force) by *public authority* in Aquinas's mature thought. **Marcus** underplays the profound caution and near-pessimism in *De Regno* regarding *any* violent deposition (even public), the ambiguity over who constitutes "public authority" against a usurper in the mature works, and the fact that Aquinas *never* explicitly repeats the *Sentences*'s "anyone can kill a usurper" permission, leaving it as an early, unintegrated strand.

  **Final Adjudication:** Marcus offers the more accurate and nuanced interpretation overall. Aquinas's mature position *permits* tyrannicide under the strict condition that it is an act of legitimate public authority (however constituted) removing an intolerable tyrant when no peaceful remedy exists, with lethal force being a last resort during resistance or deposition. He *absolutely forbids* private tyrannicide. The *Sentences* passage on usurpers can be reconciled as addressing a specific case (complete absence of legitimate authority) within this broader framework, though it remains the most permissive and least developed part of his thought. Ines correctly stresses the severe restrictions and dangers Aquinas associates with tyrannicide but errs in downplaying the legitimate space he allows for forceful public resistance.
