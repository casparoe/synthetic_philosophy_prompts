  The first phenomenon (with their officemate) seems to be about shared premises within an epistemic community, while the second (with their brother-in-law) seems to involve domain-specific boundaries of justification. Both reflect contextual limits on what requires justification, but the mechanisms differ. When someone with no stake asks, the social pressure to justify diminishes, potentially unmasking the arbitrary nature of these stopping points.
answer: |-
  1.  This is **contextual justification closure**, where the socially accepted stopping point for demanding further reasons depends on shared background assumptions (epistemic community) or domain-specific norms (like legal or disciplinary frameworks), not inherent logical necessity. It differs from foundationalism or coherentism by being conversationally negotiated and context-bound.
  2.  The "shared premises" case (your officemate) involves **implicit warrant convergence**: mutually recognized, domain-relevant axioms allow shorter chains. The "inappropriate question" case (your brother-in-law/seminar) involves **normative boundary enforcement**: the questioner is seen as violating epistemic or conversational rules specific to that context's practice, demanding justification where the group deems it neither required nor meaningful.
  3.  It is one phenomenon—contextual constraints on justification demands—but manifests as two distinct mechanisms: convergence on shared warrants (internal to the discourse community) versus enforcement of domain boundaries (against perceived external or improper challenges). The seam lies in whether the resistance stems from agreement or exclusion.
  4.  A non-instance is genuine foundationalism (e.g., "I believe this because it's self-evident") or bad-faith stonewalling; a borderline instance is citing "common sense," which may reflect shared context or mask boundary enforcement. The phenomenon dissolves under a genuinely disinterested questioner, as the social pressure to justify within norms vanishes, exposing the arbitrariness of the closure point.
  5.  With a stake-less asker, the closure appears as **epistemic etiquette violation**: the responder's insistence that further "why" is illegitimate relies entirely on unspoken contextual rules the outsider neither accepts nor recognizes, making the conversational cutoff starkly visible as a social convention rather than a reasoned endpoint.
