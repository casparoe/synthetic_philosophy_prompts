  The user wants to know if this phenomenon has a name, but more importantly, they want to understand the mechanics behind it. They've already considered the classic philosophical approaches to infinite regress (foundationalism, coherentism, infinitism) but recognizes this is different - it's about conversational norms rather than logical necessity. They're particularly interested in whether there are two distinct phenomena here (shared premises vs. inappropriate questioning) and what happens when someone asks without any stake in the conversation.

