prompt: |-
  I'm drafting the chapter where I argue that so-called cancel culture is best read through the expressivist theory of punishment -- the view that the point of a punishment is to express social condemnation and reaffirm the violated norm, rather than to deter or to give the offender what they deserve. I want to test it on a real case instead of yet another hypothetical. Take Justine Sacco: the PR executive who, in late 2013, tweeted a bad joke about AIDS right before an eleven-hour flight to Africa, went viral while she was in the air, and landed to find she'd been fired. What makes it good for me is that nobody was in charge -- no court, no rule she'd broken at the moment she hit send, no single punisher, no defined sentence, and the whole thing ran while she was offline and couldn't respond. So walk me through it. Does the expressivist account actually fit an episode like this, or does it secretly presuppose a punisher with standing to condemn? Map it onto the theory: which parts it explains well (the condemnation, the norm-reaffirmation, the irreversibility of the firing), and which parts it gets wrong or is just silent on (proportionality, the fact that strangers with no relationship to her set the "sentence," the way it double-counts, the total absence of any exit or appeal). Then flip it -- does the case force a revision of the theory, or does it show the theory was only ever about formal, authority-backed sanction and that what Sacco got was something else that we keep mislabeling as punishment? I keep wanting a name for that other thing (call it sanction-without-a-punisher?) and I'm not sure the category is even coherent, so tell me straight if it isn't. Bottom line first, then the mapping. Max 800 words.
reasoning: |-
  Okay, the user is working on a chapter about cancel culture and wants to apply the expressivist theory of punishment to the Justine Sacco case. Let me start by recalling what expressivist theory entails. It focuses on punishment as a way for society to express condemnation and reaffirm norms, rather than for deterrence or retribution. The Sacco case is interesting because it's a decentralized, viral reaction without any formal authority.

  First, I need to assess how well expressivism fits this case. The public outrage and her firing clearly express condemnation and reinforce the norm against racist jokes. That aligns with expressivism. But there are gaps: no proportionality, no official body, no appeals process. The punishment was immediate and severe, driven by strangers online. 

  The user mentioned key points: condemnation, norm-reaffirmation, irreversibility versus issues like proportionality and lack of authority. I should address each. The theory explains the social message but not the chaotic execution. Also, does the absence of a legitimate authority challenge expressivism? The case might force a revision of the theory to include informal social sanctions, or it might show that expressivism only applies to formal systems. 

  Next, the user wants to know if this is "sanction-without-a-punisher." Is that coherent? Social punishment exists, but without structure, it's more like collective expression. Maybe it's a form of social control distinct from punishment. The user needs clarity here. 

  I should conclude whether expressivism still holds or needs adjustment. The core elements fit, but the lack of institutional features means cancel culture operates differently. The user might be arguing that expressivism explains the intent but not the mechanism. Highlighting this distinction could strengthen their chapter. 

  Also, the user's deeper need might be to rigorously defend their thesis against potential criticisms. They might want to preempt arguments that cancel culture isn't "real" punishment. Addressing the theory's limitations shows nuanced analysis. 

  Finally, suggesting a term like "viral social sanctioning" could help categorize this phenomenon. Emphasizing that expressivism explains the why but not the how of such cases adds depth. The user's bottom line should confirm expressivism's relevance while acknowledging its boundaries in informal contexts.
answer: |-
  Here's the bottom line: **The expressivist lens powerfully explains the *core dynamics* of the Sacco case – the expressive condemnation and norm-reaffirmation – but exposes the theory's limitations regarding *structure, proportionality, and legitimacy* inherent in formal punishment. The case doesn't force a radical revision but highlights that expressivism best describes the *intent* driving the crowd, while the *mechanism* itself is a distinct, chaotic form of "viral social sanctioning" lacking core punitive features.** Expressivism fits the *why*, not the chaotic *how*.

  **Mapping the Expressivist Account onto Sacco:**

  1.  **Fits Well:**
      *   **Condemnation as Primary Purpose:** The viral outrage wasn't primarily about deterring future similar tweets (though it might have that effect) or giving Sacco her "just deserts" in a calculated way. It was an overwhelming, visceral *expression* of moral outrage and condemnation for a perceived egregious violation (racism, insensitivity, power imbalance). The point *was* to say, loudly and collectively, "This is unacceptable."
      *   **Norm Reaffirmation:** The firestorm explicitly served to reaffirm social norms against racist humor, exploitation of suffering, and the perceived arrogance of Western privilege. Countless tweets, articles, and discussions articulated *why* the joke was wrong, reinforcing the boundaries of acceptable discourse.
      *   **Symbolic Function of Outcome:** Her firing wasn't just a practical consequence; it became the ultimate symbolic act of condemnation demanded by the crowd. It served as a tangible, irreversible marker of the social expulsion resulting from the norm violation. The *irreversibility* you note aligns with the expressive finality often sought in condemnation – a clear break.

  2.  **Fits Poorly or Silent On:**
      *   **Punisher with Standing & Legitimacy:** Expressivism, even in its social forms, often presupposes *some* entity (state, community leader, defined group) with perceived legitimacy to condemn and execute the sanction. In Sacco's case, the "punisher" was a diffuse, anonymous, global online mob with no established relationship to her, no jurisdiction, and no inherent legitimacy beyond sheer numbers and outrage. Who had the *right* to condemn her *in this way*? The theory is silent on this critical lack of authority.
      *   **Proportionality:** Expressivism often assumes a (rough) calibration between offense and expressive sanction. Sacco's punishment – global vilification, career destruction, lasting infamy – was wildly disproportionate to the offense (a single, crass, offensive tweet). The viral mob dynamics amplified the sanction far beyond any conceivable expressive need.
      *   **Defined Sentence & Process:** There was no sentence. The condemnation was open-ended, the firing a response to mob pressure, not a deliberated outcome. The "process" was chaotic trial-by-X (then Twitter).
      *   **Double-Counting/Over-Punishment:** The theory doesn't account for the inherent tendency of viral outrage to layer punishments – losing her job *plus* permanent online infamy *plus* personal threats *plus* reputational scorched earth. The expressive need (condemn the act) was satisfied many times over, yet the sanctions compounded uncontrollably.
      *   **Absence of Exit/Appeal:** Expressivism in formal contexts usually implies an endpoint or possibility of reintegration after condemnation. Here, there was no mechanism for appeal, explanation (initially), apology, or reconciliation. The condemnation felt perpetual, the sentence life-long. The theory doesn't address how expression transitions to closure or forgiveness in informal settings.

  **Flipping It: Revision or Mislabeling?**

  *   **Doesn't Force Radical Revision:** Expressivism *does* capture the fundamental *motivation* behind the social reaction – the desire to condemn and reaffirm norms. This remains its core strength. We shouldn't discard the theory because the *execution* was chaotic.
  *   **But Highlights a Key Limitation:** The theory implicitly relies on *some* structure or legitimizing context for the condemnation to be recognizably "punishment." The Sacco case reveals that expressivism, as traditionally conceived, struggles with purely emergent, structureless, legitimacy-free condemnation.
  *   **"Sanction-Without-A-Punisher" - Coherent but Distinct:** **Yes, the category is coherent. Call it "Viral Social Sanctioning" (VSS).** It's a distinct social phenomenon sharing features with punishment but critically different:
      *   **Core:** Mass, decentralized, often anonymous expression of condemnation and demand for sanction.
      *   **Mechanism:** Amplification via social media dynamics (virality, outrage algorithms), not formal procedure.
      *   **Outcome:** Often disproportionate, unstructured, lacking defined endpoint or appeal, executed by third parties (employers) under pressure. The *sanction* (firing) is imposed *because of* the expressive condemnation, but not *by* the condemning body in any structured way.
      *   **Relationship to Expressivism:** VSS is *driven by* expressive desires (condemnation, norm-reaffirmation) but *lacks* the structural features (authority, proportionality, process) that make expressivist punishment socially functional and legitimate. It's expressivism unleashed and distorted by the mechanics of virality.

  **Conclusion:**
  The expressivist theory perfectly illuminates the *fuel* of the Sacco incident – the collective need to condemn and reaffirm norms against racism and insensitivity. It explains the intensity and the symbolic significance of the firing. However, the complete lack of structure, authority, proportionality, and process exposes that what occurred wasn't "punishment" in the sense expressivism typically describes, even socially. It was **Viral Social Sanctioning**: a powerful, norm-enforcing, but dangerously unstructured and often disproportionate phenomenon *fueled by* expressive condemnation but *executed through* the chaotic dynamics of online mobs and third-party capitulation. Sacco's case shows expressivism explains the *why* of cancel culture's intensity, but we need "VSS" to accurately describe its anarchic *how*.
