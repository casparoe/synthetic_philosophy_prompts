prompt: |-
  I cover law, memory, and post-conflict politics for a long-form magazine, and I am about to give a year to a single subject: a national accounting that is still being designed rather than one that has already reported. What I am working from is a composite — I have drawn on three processes I reported on and altered the details — so please do not try to identify the country. The design is this. After a twelve-year civil war in which the state's security forces, a paramilitary auxiliary, and an insurgent movement all committed atrocities, the peace agreement creates a commission with subpoena power and a three-year clock. Amnesty is available, but only to those who give a full public account of their acts, identify the burial sites of the disappeared, and surrender a share of the assets they accumulated during the war into a reparations fund. The amnesty does not extend to sexual violence, to the recruitment of children, or to the economic crimes of those who financed the fighting without ever holding a gun. The commission's findings are inadmissible in court, it must publish a report, a dissenting minority report is expressly permitted, and a continuing mechanism lets testimony be added after the deadline. The government that appointed it includes people it will have to investigate.

  Given that design, which open questions in the theory and practice of truth commissions, amnesty, and transitional justice most deserve a reporter's attention over the next year, and why? I have room for perhaps four long pieces, and I want a defended agenda rather than a survey. Tell me which questions are upstream of the others, which ones a reporter with access and a year can actually make progress on as opposed to which are unresolvable in principle, and which ones look urgent but would change nothing for a body built this way. I am especially interested in the difficulties this particular design forces and that a generic account of transitional justice would glide past — where the odd features, the partial amnesty, the liability of beneficiaries, the minority report, the clock, turn out to be exactly where the conceptual trouble sits. I would also like some account of the criteria you are ranking by and what I should watch for in the first six months that would move a question up or down the list.
reasoning: |-
  Okay, let me unpack this complex query from a journalist specializing in transitional justice. The user presents a hypothetical truth commission design with unique features - partial amnesty, asset confiscation, minority reports, and tight timelines - all wrapped in a composite case study. They're asking for four prioritized investigative angles over a year, with clear rationale about what's actionable versus theoretical.

  First, I notice the user operates at a very sophisticated level. They're not looking for Transitional Justice 101 but want to probe the pressure points where this specific design might buckle. The composite approach is smart - it avoids country-specific biases while allowing analysis of structural tensions. Their emphasis on "upstream" questions suggests they want to trace causality, not just document outcomes.

  The commission's design has several landmines: the amnesty exclusions create hierarchy of crimes, the asset surrender targets war economy beneficiaries, and the three-year clock seems unrealistic for complex investigations. But what really catches my eye is the government's inclusion of investigation targets - that's where real-time political interference might manifest.

  Hmm... they also hint at wanting "criteria for ranking" issues. That means I should be explicit about evaluation metrics. Probably: tractability (can reporting reveal answers?), leverage potential (could findings influence design?), uniqueness (does this feature break new ground?), and early warning signs (what to monitor in first six months?).

  For the four pieces, I'm considering:
  1) The amnesty-for-assets trade-off: unprecedented but may incentivize false testimony. Watch for early asset valuation disputes.
  2) The ticking clock versus delayed testimony: institutional memory vs political pressure. Early sign: rushed procedural decisions.
  3) Minority reports as weapons: could legitimize denialism. Track who demands dissent clauses.
  4) Investigating sitting power: the elephant in the room. Monitor budget allocations.

  The user's "unresolvable in principle" provocation is key. For example, whether partial amnesty delivers reconciliation is fundamentally unprovable, but documenting how design choices affect testimony quality is measurable. Similarly, the moral calculus of trading bones for amnesty can't be "solved," but we can track if it actually locates bodies.

  What they might not have explicitly stated but implies: they want stories where their access can reveal closed-door negotiations. The first six months of commissioner appointments and rule-drafting are gold for that. Also, the economic crimes angle feels underexplored in TJ literature - financiers rarely face consequences.

  ...I should probably flag the evidentiary tightrope too: findings being inadmissible means the commission's truth may never become legal truth. That tension between historical record and judicial accountability deserves attention.

  Right, structuring response around four pillars with clear why/how. Must resist academic tangents - this is for a reporter who needs concrete entry points. The minority report issue might be the sleeper - everyone focuses on the main report, but institutionalized dissent could undermine legitimacy from day one.
answer: |-
  Based on your commission's unique design and the constraints/opportunities of a year-long embedded reportage, here are the four most critical, actionable, and conceptually rich questions to prioritize, ranked by their upstream nature, tractability, and potential to expose hidden tensions:

  ### 1. **The Asset-Amnesty Nexus: Can Atrocity Financing Be Deterred While Buying Truth?**
     * **Why it's upstream & urgent:** This is the commission's most radical innovation. It directly links amnesty (for violent actors) to economic penalties (for fighters *and* financiers) and truth-telling. This creates immediate, high-stakes conflicts:
       * **Conceptual Trouble:** Does trading wealth for impunity commodify truth? Will financiers (who retain liability) sabotage the process? Can a commission designed for truth-telling effectively investigate complex financial crimes within 3 years?
       * **Practical Trouble:** Valuation disputes (what's a "share"?), hidden assets, shell companies, and resistance from powerful economic elites will dominate early negotiations. **Watch Months 1-6:** How are asset surrender rules drafted? Are forensic accountants hired? Do financiers publicly attack the commission or lobby behind the scenes? Early resistance signals future obstruction.
       * **Why Reportable:** You can track specific cases: Does a commander's "full account" magically omit financiers? Do surrendered assets prove symbolic (a rusty truck) or substantial? Does the threat of prosecution *after* the commission incentivize financiers to coerce fighters into silence?
       * **Tractability:** High. Follow the money trail, interview economists/lawyers on the commission, track asset recovery efforts. This is where opaque power meets public accountability.

  ### 2. **The Poisoned Chalice: Investigating the Government That Appointed You**
     * **Why it's upstream & urgent:** The commission's legitimacy hinges on investigating its creators. This isn't a post-facto review; it's real-time accountability of sitting power.
       * **Conceptual Trouble:** Can independence exist when funding, subpoena enforcement, and political survival depend on the entity you're investigating? How does the commission navigate threats to its existence if it targets powerful incumbents?
       * **Practical Trouble:** Expect stonewalling, witness intimidation, "lost" documents, and political attacks disguised as procedural objections. **Watch Months 1-6:** Appointment battles (who gets named? compromise candidates?), initial subpoenas (are they issued against state actors? are they obeyed?), early budget requests (are they fully funded?). Delays here foreshadow major conflict.
       * **Why Reportable:** You witness the pressure firsthand. Document closed-door meetings (sourced), track political rhetoric against the commission, follow key subpoena battles in courts. Does the commission pull punches early to survive?
       * **Tractability:** High. Political maneuvers are visible. Access to commissioners/staff reveals internal debates about risk. Legal challenges are public record.
       * **Unique Design Pressure:** Generic TJ theory assumes distance from power; here, it's intimate and dangerous.

  ### 3. **The Manufactured Dissent: How the Minority Report Clause Shapes Truth Before a Word is Written**
     * **Why it's upstream & urgent:** Permitting a minority report *in advance* fundamentally alters the internal dynamic and the final product's reception. It legitimizes dissent from day one.
       * **Conceptual Trouble:** Does this incentivize commissioners to posture for their faction rather than seek consensus? Does it predetermine the report's contested reception, undermining its unifying potential? Is "truth" being negotiated before evidence is heard?
       * **Practical Trouble:** Internal deliberations become performative. Commissioners may withhold cooperation to bolster future dissent. Leaks and strategic framing begin early. **Watch Months 1-6:** Commissioner selection (are factional representatives chosen?), early procedural votes (is there bloc voting?), public statements by commissioners staking out positions. Formation of internal factions is key.
       * **Why Reportable:** You can chronicle the birth of the "minority narrative." Track alliances, leaked drafts, and how the *expectation* of dissent influences investigation priorities and witness handling. Does it create a race to the bottom for polarizing claims?
       * **Tractability:** High. Internal politics are observable through sourcing and behavior. Early procedural fights reveal fault lines.
       * **Unique Design Pressure:** Most commissions strive for unified voice; this one *plans* for division, altering the very pursuit of truth.

  ### 4. **The Ticking Clock vs. The Open Archive: Can a Deadline Foster Urgency or Only Superficial Truth?**
     * **Why it's critical (though slightly less upstream):** The 3-year deadline clashes with the open archive. This forces brutal trade-offs between comprehensiveness and completion, with lasting consequences.
       * **Conceptual Trouble:** Does a hard deadline incentivize prioritizing "easier" cases (low-level perpetrators, well-documented massacres) over complex command responsibility or systemic analysis? Does the "continuing mechanism" become a dumping ground for inconvenient truths, absolving the commission of hard choices but guaranteeing future instability?
       * **Practical Trouble:** Rushed investigations, superficial analysis, witness queues, logistical bottlenecks. Pressure to amnesty mid-level actors for quick wins on disappearances. **Watch Months 1-6:** Investigation plan rollout (breadth vs. depth?), resource allocation (field offices? forensic teams?), early amnesty applications (who applies first? low-hanging fruit?). Signs of corner-cutting appear early.
       * **Why Reportable:** Track investigation timelines on specific cases. Compare the depth of early vs. late investigations. Monitor what gets deferred to the "continuing mechanism." Interview witnesses about feeling rushed.
       * **Tractability:** Moderate-High. Progress can be measured. Sourcing reveals internal frustrations. Comparing early/late work products is telling.
       * **Unique Design Pressure:** The open archive *acknowledges* the deadline's insufficiency but may inadvertently devalue the core report.

  ---

  ### Why Not Other Questions?

  *   **"Does partial amnesty deliver reconciliation?"**: Vital but **unresolvable in principle** within a year (or even a decade). It's a long-term societal outcome, not a commission output.
  *   **"Is the truth inadmissibility clause just?"**: Important, but a **legal/political choice baked in at design**. Your access won't change the law. Focus on its *impact*: Does it encourage fuller testimony? (Tractable via witness interviews).
  *   **"Are the amnesty exclusions (sex crimes, child soldiers) effective?"**: **Urgent but potentially unresolvable** in the short term. Perpetrators of these crimes are highly unlikely to apply for amnesty *without* its protection. You might get silence. Focus instead on how the commission *investigates* these crimes *without* perpetrator testimony (Tractable: their methods, victim support).
  *   **"Will reparations be sufficient?"**: **Changes little for the commission itself** (it creates the fund, doesn't manage it). Report on the *process* of asset surrender and fund *design* (Tractable), not long-term impact.

  ---

  ### Your Watchlist: First 6 Months (What Moves Questions Up/Down)

  1.  **Appointments & Early Rules:** Who are the commissioners? (Factional? Independent? Technocratic?). How are the rules for amnesty/asset surrender/dissent drafted? (Opaque? Inclusive? Controversial?). **Significance:** Signals political will, potential for capture, and future internal conflict. (Impacts Q2 & Q3 heavily).
  2.  **Subpoena Power Tested:** Who gets the *first* subpoenas? State security? Mid-level commanders? Financiers? Are they complied with? Enforced? Challenged in court? **Significance:** The first real test of independence and power against the government/elites. (Impacts Q2 critically).
  3.  **Resource Allocation:** Is the budget approved? Are key staff (investigators, forensic accountants, archaeologists, psychologists) hired promptly and with sufficient quality? Are field offices opened? **Significance:** Indicates practical capacity versus the ticking clock. Failure here sinks everything. (Impacts Q4 heavily).
  4.  **Early Amnesty Applicants:** Who applies *first*? Low-level actors? Those with clear knowledge of disappearances? Is their testimony credible and substantial? Are assets identified and surrendered? **Significance:** Tests the viability of the core bargain. Early fraud or trivial compliance is a bad sign. (Impacts Q1).
  5.  **Political Rhetoric:** How do government figures, military, ex-insurgents, and financiers speak about the commission? Supportive? Dismissive? Actively hostile? **Significance:** Gauges the political environment and potential for obstruction. (Impacts all, especially Q2).

  **Prioritize agility:** If the government sabotages subpoenas/budget (Q2 rockets up), or if financiers launch legal war (Q1 dominates), or if commissioners fracture publicly (Q3 escalates), be ready to pivot your focus. Your unique access to the *design-in-motion* is irreplaceable – focus on where the pressure points are visibly straining the machinery of this ambitious, fragile experiment.
