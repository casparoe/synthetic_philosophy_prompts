prompt: |-
  I spent the better part of yesterday evening arguing with a close friend, a machine-learning engineer, about functionalism and multiple realizability, and we ended by talking past each other in a way I recognize from every lecture I have ever given on the subject. His position, roughly, was that the matter is settled and obvious: minds are multiply realizable because software runs on any sufficiently capable hardware, and functionalism merely records that fact. My position was that the software-and-hardware image is doing illicit work in that argument, since it presupposes the conclusion rather than supporting it, and that even granting multiple realizability, the step from it to functionalism is an inference to the best explanation which a type-identity theorist can simply decline, for instance by treating a mental property as a disjunction of physical realizers. We got nowhere, and what unsettled me is that our disagreement is precisely the one the standard teaching materials fail to anticipate.

  Next week I have to run a single ninety-minute session on functionalism for a mixed group of graduate students, some from a cognitive science programme and some from engineering, none of whom have read anything on the subject. I do not want you to explain functionalism to me. I want a plan for teaching it.

  Give me the order in which the ideas must be introduced and why each depends on the one before it; the single carrying example I should build the whole session around, together with what that example must contain and what it must leave out in order to do the work; the misconceptions this particular audience will arrive with or form, and I expect at least the software-and-hardware conflation, the assumption that multiple realizability by itself establishes functionalism, and the collapse of functionalism into behaviourism, so tell me the exact point in the sequence at which each should be headed off; the one question I can put to them at the end that would show whether the distinction between a functional role and its realizer has actually landed rather than merely been repeated; and what I should openly refuse to settle at this level, and say so out loud.
reasoning: |-
  Okay, let me start by unpacking the user's request. They had a frustrating argument with a machine-learning engineer friend about functionalism and multiple realizability. The core issue seems to be that their friend used the software-hardware analogy as proof, while the user sees it as circular. Now, the user needs to teach this to a mixed group of grad students in cognitive science and engineering, none of whom have prior reading on the topic. 

  First, I need to structure the session so it builds concepts step by step. The key is to avoid the pitfalls they mentioned: the software-hardware conflation, assuming multiple realizability implies functionalism, and confusing functionalism with behaviorism. Starting with type identity theory makes sense because it sets up the problem that functionalism solves. Using pain as an example is classic, but I should make sure it's concrete enough for engineers to grasp.

  The carrying example needs to be both intuitive and versatile. A mousetrap comes to mind because it's mechanical and functionally defined. It can be made from different materials, showing multiple realizability without invoking computers. That avoids the circularity the user mentioned. But I have to be careful not to oversimplify. The mousetrap example must illustrate functional role versus realization, but leave out consciousness to keep it manageable.

  Next, anticipating misconceptions. The software-hardware analogy will likely come up early, especially from engineers. I should address it when introducing multiple realizability, but steer the discussion toward non-computational examples first. When moving to functionalism, explicitly separating the inference from multiple realizability is crucial. Maybe use the disjunction strategy the user mentioned—type identity theorists can accept disjunctive properties without adopting functionalism.

  For the behaviorism confusion, contrasting inputs/outputs with internal states will help. Highlight that functionalism cares about mediating processes, not just behavior. The question at the end about a broken mousetrap that still snaps could test their understanding. If they focus on the snap (output) without considering the internal mechanism, they might slip into behaviorism.

  The user emphasized not settling debates like non-physical realizers or consciousness. I should note those as advanced topics to flag upfront. Also, openly state that functionalism isn't proven by multiple realizability alone—it's an inference some reject. 

  Timing matters. Allocating specific minutes to each section ensures coverage. Starting with identity theory (15 mins), then multiple realizability (15), functionalism (20), misconceptions (15), and discussion (20). The mousetrap example threads throughout. 

  Finally, the user’s deeper need: they want students to grasp the conceptual distinction, not just parrot definitions. The plan must force students to apply the concepts, hence the targeted question. Highlighting where common misconceptions arise at each step preempts confusion. The explicit boundaries prevent derailing. This structure should foster clarity in a mixed group, addressing both cognitive scientists and engineers on their terms.
answer: |-
  Here’s a battle-tested 90-minute lesson plan designed to preempt your exact frustrations, leverage the engineering mindset, and force the functional role/realizer distinction to land:

  ---

  ### **Lesson Structure: Order & Rationale**  
  *(Total: 90 mins)*  

  1. **Problem Setup: Why Type Identity Theory Fails (15 mins)**  
     - **Start with pain**: "What is pain? Is it *just* C-fibers firing? What if we find aliens with silicon brains that scream when injured?"  
     - **Introduce Type Identity Theory (TID)**: Mental state = specific physical state (e.g., pain = human C-fiber activation).  
     - **Why it fails?** Show *multiple realizability* (MR): Octopus pain (no C-fibers), future AI pain (silicon), alien pain (unknown substrate).  
     - **Key move**: *TID can’t handle MR*. Engineers will nod—they already accept MR.  

  2. **Multiple Realizability ≠ Functionalism (20 mins)**  
     - **Carrying Example: The Mousetrap**  
       - **What it must contain**:  
         - Function: "Snap when trigger is touched, killing the mouse."  
         - Realizers: Wood/spring trap, electronic sensor+hammer, glue pad, laser grid.  
       - **What it leaves out**: Consciousness, qualia, "why" it works.  
     - **Critical question**: "Does MR *force* us to say the mousetrap *is* its function? Couldn’t we say it’s just a disjunction: *wood-trap OR e-trap OR glue-pad*?"  
     - **Preempt misconception**: MR shows TID is false, *but doesn’t prove functionalism*. It’s compatible with disjunctive physicalism.  

  3. **Functionalism as a Solution (25 mins)**  
     - **Define functionalism**: Mental states are *functional roles*—defined by inputs (stimuli), outputs (behavior), and relations to other states.  
     - **Map to mousetrap**:  
       - Input: Mouse touches trigger → Output: Snap/kill.  
       - Internal role: "Detection → Activation → Snap."  
     - **Apply to pain**:  
       - Input: Tissue damage → Output: Wincing, screaming.  
       - Relations: Causes anxiety, desire for relief.  
     - **Contrast with TID**: Pain isn’t "C-fibers," it’s *the causal role* played by C-fibers (or silicon, or alien goo).  

  4. **Preempting Collapses & Conflations (20 mins)**  
     - **Vs. Behaviorism**:  
       - "Is functionalism just inputs/outputs? What about *internal states*?"  
       - Show: Pain causes *fear of recurrence* (another mental state). Functionalism cares about the *network*, not just stimuli/response.  
       - **Preempt point**: During functional role definition (step 3).  
     - **Vs. Software-Hardware Conflation**:  
       - "Is the mind just software? Hardware independence proves functionalism?"  
       - Counter: "Software *presupposes* a functional description. We’re arguing *whether minds are software-like*."  
       - **Preempt point**: When discussing MR (step 2). Say: "MR is a fact. Functionalism is an *interpretation* of that fact."  
     - **Vs. "MR → Functionalism"**:  
       - Revisit disjunction: "Why not say pain is *C-fibers OR silicon-node OR...*?" Functionalists reply: "That disjunction shares nothing *physical*—only the *functional role* unifies them."  

  5. **The Test Question (5 mins)**  
     - **"A mousetrap is crushed by a hammer. It can’t snap anymore, but it still *looks* like a mousetrap. Is it still a mousetrap? Why/why not?"**  
     - **Correct answer**: No—it can’t perform its function. *Looks* are irrelevant; function is key.  
     - **If they say "yes"**: They confuse realizer (physical form) with function.  

  6. **Open Refusals (Stated upfront and repeated)**  
     - "We *won’t* settle:  
       - Whether functionalism is *true* (it’s one option among many).  
       - Whether consciousness can be functionalized (Hard Problem of Chalmers).  
       - Whether non-physical realizers (ghosts, angels) are possible."  
     - **Say aloud**: "This session is about *what functionalism claims*, not proving it correct."  

  ---

  ### **Why This Works**  
  - **Mousetrap over software**: Breaks the circularity of "minds are software because software is functional." Mousetraps are physical, intuitive, and substrate-neutral.  
  - **Disjunction move**: Forces students to see functionalism as a *positive thesis* (roles are primary), not just a rejection of TID.  
  - **Engineer-friendly**: MR is their entry point, but the mousetrap decouples it from computational assumptions.  
  - **Test question**: Isolates function from realizer without jargon. If they get it wrong, you reteach step 3.  

  ### **Predicted Hotspots**  
  - **Engineers** will try to jump to "brains = hardware, minds = software." Shut this down in step 2: "Does MR *require* functionalism, or just disprove TID?"  
  - **CogSci students** may resist "trivial" examples. Remind them: "If functionalism fails on mousetraps, it fails on minds."  
  - **Endgame**: If they see that a functional role can *exist* (mousetrap-ness) while being independent of its *realizer* (wood, metal), you’ve won.  

  This sequence forces the inference from MR to functionalism to be explicit and contestable—exposing the gap your friend glossed over. The mousetrap is your anchor. Use it relentlessly.
