prompt: |-
  I run a small advising service for people who've decided to give away a big chunk of their income or time, and I keep hitting the same wall: they want to know how much a consequentialist morality actually requires of them, and I don't have a procedure, just vibes. I need you to turn the demandingness debate into something I can actually run in a 45-minute session. My clients are mostly smart non-philosophers, alot are burning out, some are trying to decide whether to donate a kidney or quit a job, and I'm not a therapist, so I need to know where to stop and refer out. I have to run the procedure by my supervisor, who is a philosopher, so it needs to be defensible. Don't give me a reading list or citations; give me the procedure. I want the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, where it says this is required, where it says this is optional, and where it hands the decision back to the client because it's a values call. Keep seperate the demandingness objection and the integrity objection, because I think they come apart: one is about how much sacrifice is asked, the other about what kind of sacrifice it is. Build in the distinction between the cost of acting and the cost of not acting, and the idea that some sacrifices damage the agent's capacity to keep acting morally over time. Also use the rule-consequentialist move that a moral code demanding too much might be self-defeating because people can't internalize it, but don't let that become a get-out-of-jail-free card. And handle the supererogation problem: if an act is morally best, how can it be optional? Then run it on two cases: (1) a client who is considering donating a kidney to a stranger, and (2) a client who is considering skipping their sister's wedding to work on a political campaign they think is high-impact. For the second one, I want the procedure to give the answer I won't like, and I want you to say why the procedure can't settle some of it. Finally, tell me what the procedure cannot do and where it will misfire.
reasoning: |-
  We are designing a structured procedure for a 45-minute session that helps clients navigate the demandingness of consequentialist morality. The procedure must be defensible to a philosopher supervisor and address key philosophical distinctions without becoming overly academic.

   Key elements to incorporate:
   1. The demandingness objection: How much sacrifice is required?
   2. The integrity objection: What kind of sacrifice is being asked? (Does it undermine the agent's integrity or core commitments?)
   3. Distinguish between the cost of acting and the cost of not acting.
   4. The sustainability concern: Some sacrifices may damage the agent's capacity to act morally over time.
   5. Rule-consequentialist insight: A moral code that demands too much might be self-defeating because people cannot internalize it, but avoid making this an easy excuse.
   6. The supererogation problem: How can the morally best act be optional?

   The procedure will be a series of questions. We will define:
   - Sufficient answers: What kind of response is needed to move to the next step?
   - Stopping points: Where the procedure gives a clear "no" (not required), "required", or "optional" (supererogatory) and where it hands the decision back to the client as a values call.

   Steps:

   1. **Clarify the Action and Alternatives**
      - Ask: "What exactly is the action you are considering? What are the main alternatives (including inaction)?"
      - Sufficient answer: A clear description of the action and at least one alternative (even if that alternative is the status quo).
      - Why: We need to know what we are evaluating and what it's being compared to.

   2. **Assess the Expected Consequences**
      - Ask: "What do you believe would be the likely consequences of each option (including the one you're considering and the alternatives)? Focus on the impact on others and the world, but also include any significant consequences for yourself that might affect your long-term ability to do good."
      - Sufficient answer: A reasoned estimate of the outcomes, including both positive and negative, for all stakeholders. It doesn't have to be numerically precise, but should consider scale (how many affected), intensity (how deeply affected), and probability.
      - Why: Consequentialism requires us to look at the outcomes.

   3. **Compare Net Expected Good**
      - Ask: "Which option do you think would produce the most net expected good? If you're not sure, what's your best guess?"
      - Sufficient answer: A clear identification of the option that seems to maximize net expected good, or an acknowledgment of uncertainty.
      - Why: This identifies the candidate for the morally best action.

   4. **Check for Supererogation (The Optionality Question)**
      - We now have an action that appears to be the best. But is it required? We must consider whether demanding it would be too much.
      - We break this down:

      a. **Cost to the Agent (Demandingness)**
          - Ask: "How costly would this action be to you? Consider financial, physical, emotional, social, and time costs. Also, what are the costs of not doing the action (to you and others)?"
          - Then: "Is the cost to you so high that it would be unreasonable to demand that anyone in your position do it? Consider if it would cause severe harm to you, or if it would undermine your ability to live a minimally decent life or to continue being an effective moral agent in the future."

          - Sufficient answer: The client must articulate the costs and compare them to the benefits to others. The key is to assess if the cost is "excessive" according to a rule-consequentialist standard: would a rule requiring this level of sacrifice be self-defeating because it would lead to burnout, resentment, or non-compliance? But note: we must avoid making this too easy.

          - Guidelines for the advisor:
              - If the cost is low to moderate, then it's required.
              - If the cost is high, but the expected good is very high and the cost of not acting is catastrophic (e.g., saving a life), then it might be required unless it would destroy the agent's capacity to function.
              - If the cost is high and the expected good is moderate, then it might be optional.

          - We set a threshold: if the cost is so high that it would lead to severe and lasting damage to the agent's well-being or their ability to do good in the future, then the action is not required (it becomes supererogatory). Otherwise, it is required.

          - This step should also consider the cost of not acting: if not acting would lead to significant harm to the agent (e.g., guilt, regret, loss of self-respect) that might offset some of the personal cost of acting.

      b. **Integrity and Personal Commitments**
          - Ask: "Would doing this action require you to violate a core personal commitment or undermine your integrity? For example, would it force you to act against a deeply held value or identity, or to neglect a special responsibility you have (like to family or close friends)?"
          - Sufficient answer: The client must identify any such commitments and explain how the action would conflict with them.
          - Why: Even if the net expected good is high, if the action would require the agent to abandon their core self, it might be too demanding in a way that rule-consequentialism would reject (because a moral code that ignores integrity might be self-defeating). However, this is not a free pass: the client must also consider if the commitment is one that they should revise given the stakes.

          - Guidelines: 
              - If there is a conflict with a core commitment, then we must weigh the importance of that commitment against the expected good. 
              - But note: rule-consequentialism might endorse a moral code that allows for some special commitments (because without them, relationships and personal projects that are valuable would break down). 
              - This step may not yield a clear answer and might lead to handing the decision back to the client as a values call.

   5. **Sustainability Check**
      - Ask: "If you were to do this action, how would it affect your ability to continue doing good over the long term? Consider if it might lead to burnout, resentment, or a reduction in your overall capacity to help others."
      - Sufficient answer: Reflection on long-term effects, including the risk of moral exhaustion.
      - Why: Even if an action is required on a one-off basis, if it would cause the agent to break down and become less effective in the future, it might be counterproductive. This step might override a requirement if the long-term harm is severe.

   6. **Rule-Consequentialist Filter**
      - Ask: "Imagine a moral rule that required everyone in your situation to do this action. Do you think such a rule would be widely followed? And if not, would it lead to worse outcomes because people would reject morality altogether? Or would it be too demanding to be internalized and thus fail?"
      - Sufficient answer: A realistic assessment of whether the rule would be self-defeating.
      - Why: This step prevents the procedure from demanding actions that would be part of an unsustainable moral code. But note: we must be cautious not to let the client off too easily. The rule should be rejected only if it would clearly lead to worse outcomes overall.

   7. **Decision and Handoff**
      - After steps 4a, 4b, 5, and 6, we arrive at a conclusion:
          - If the action is identified as the best, and:
              a. The cost is not excessive (step 4a) AND 
              b. It does not seriously undermine integrity (step 4b) AND 
              c. It is sustainable (step 5) AND 
              d. The rule would not be self-defeating (step 6),
            then the action is **required**.

          - If the action is the best but fails one or more of the checks (4a, 4b, 5, 6), then it is **supererogatory** (optional but praiseworthy).

          - If the action is not the best (from step 3), then it is **not required** (and may even be wrong).

      - However, if at step 4b (integrity) the conflict is deep and the stakes are not extremely high, or if there is significant uncertainty in the assessment, then we may hand the decision back to the client as a **values call**. This is because the integrity objection often involves deeply personal commitments that the client must weigh against the impersonal good.

   8. **Special Note on Supererogation**: The procedure must explain why an action can be the best and yet optional. The explanation: Consequentialism (especially rule-consequentialism) recognizes that requiring too much can be counterproductive. Therefore, the moral code we should adopt does not require every best action, only those that are not too costly, do not undermine integrity, are sustainable, and can be part of a workable set of rules. Thus, the best action that exceeds these thresholds becomes supererogatory.

   Now, we run two cases:

   **Case 1: Donating a Kidney to a Stranger**

     Step 1: Action: donate a kidney. Alternatives: not donate (status quo).
     Step 2: Consequences: 
          - Donate: Save a life (or greatly improve quality of life) for the recipient; some pain, risk, and inconvenience for the donor.
          - Not donate: The recipient continues to suffer; donor avoids the risks and inconvenience.
     Step 3: Net expected good: Donating seems to produce more net good (life-saving vs. temporary discomfort and risk).

     Step 4a: Cost to agent: Surgery risks, recovery time, potential long-term health effects. However, for a healthy donor, the risks are low and the cost is moderate. The cost of not acting: someone might die. 
          - Judgment: The cost is not excessive (it doesn't destroy the agent's life or capacity to do good). So it passes.

     Step 4b: Integrity: Does it conflict with core commitments? Typically, no. The client might feel strongly about saving lives, so it might align. But if the client has a commitment to their own health above all, that might conflict. However, rule-consequentialism would likely endorse a moral rule that allows individuals to prioritize their health to some extent, but in this case, the risk is low. So unless the client has a very strong personal reason (like being the sole caretaker for young children and cannot take any risk), it doesn't seriously undermine integrity.

     Step 5: Sustainability: Donating a kidney is a one-time act and unlikely to cause long-term reduction in capacity to do good (if the donor is healthy). It might even inspire others. So it passes.

     Step 6: Rule-consequentialist filter: A rule that requires everyone to donate a kidney to a stranger if they are a match and healthy might be too demanding? But note: it's not required that everyone donates at all times. The rule might be: "Donate a kidney when you can save a life and the cost to you is not excessive." This rule might be internalizable. However, if we think that requiring kidney donation would lead to widespread resistance, then it might be self-defeating. But in practice, we already have such donations and they are praised but not required. So the rule might be that it is supererogatory.

     However, note: our procedure might lead to requiring it if the cost is not excessive. But let's see:

     - In step 4a we said the cost is moderate and not excessive? So then it would be required? 

     But wait: there's a tension. The advisor must note that the procedure might yield a requirement, but in practice, we do not legally or socially require kidney donation. This is where the rule-consequentialist filter might kick in: a rule requiring it might be too demanding to be internalized and might lead to backlash. So step 6 might override and make it supererogatory.

     Alternatively, we might interpret step 4a as: the cost is moderate, but the cumulative effect of requiring all such acts would be too much. However, the procedure is about this particular act. 

     Revised approach in the procedure: Step 4a should consider the cost in the context of a rule. We ask: "Is this cost so high that it would be unreasonable to demand it of anyone in your position?" For kidney donation, while the cost is moderate, it is a significant sacrifice. We might decide that it is beyond what can be required. Therefore, it would be supererogatory.

     Conclusion for Case 1: The procedure would likely classify kidney donation as supererogatory.

   **Case 2: Skipping Sister's Wedding to Work on a High-Impact Political Campaign**

     Step 1: Action: skip wedding and work on campaign. Alternatives: attend wedding and do less work (or make up the work later), or find a compromise.

     Step 2: Consequences:
          - Skip wedding: The campaign might gain some extra effort that could have a significant impact (e.g., helping to elect a candidate who will pass important legislation). But the sister and family are deeply hurt, damaging relationships. The agent might feel guilty.
          - Attend wedding: The campaign might lose a small amount of progress, but the agent maintains family bonds. The agent might be able to make up the work or the campaign might not suffer much.

     Step 3: Net expected good: This is uncertain. The campaign impact might be huge but is hard to measure. The family harm is more certain and immediate. The client's best guess might be that skipping the wedding would produce more net good, but it's a close call.

     Step 4a: Cost to agent: 
          - Acting (skipping): Emotional cost (guilt, regret), damage to family relationships, loss of support system.
          - Not acting (attending): The cost is the potential loss of campaign impact, which might be high but uncertain. Also, the agent might feel regret about not doing all they could for the cause.

          - The cost of skipping the wedding might be high (emotional toll and family rupture) but the cost of not acting (missing the campaign work) might also be high if the campaign is critical.

          - Judgment: The cost to the agent of skipping might be excessive if it leads to a permanent family rift. Also, the loss of family support might affect the agent's long-term well-being and ability to do good.

     Step 4b: Integrity: This action might directly conflict with the client's core commitment to family. The client has a special relationship with their sister. Rule-consequentialism would typically endorse rules that allow for fulfilling special obligations to family because they are essential for social stability and individual flourishing. Therefore, skipping the wedding might undermine the client's integrity.

     Step 5: Sustainability: If the client skips the wedding and damages family ties, they might lose a key support network, leading to burnout and reduced capacity for future activism. So it might not be sustainable.

     Step 6: Rule-consequentialist filter: A rule that requires skipping important family events for political work would be too demanding and would likely be rejected by many. It might lead to isolation and reduced well-being, making people less effective in the long run. So such a rule would be self-defeating.

     Conclusion: The procedure would likely say that skipping the wedding is not required. It might even be wrong because it damages important relationships and the expected good is uncertain. The best option might be to attend the wedding and find another way to contribute to the campaign.

     However, note: the client might feel that the campaign impact is extremely high and certain. In that case, step 3 might yield that skipping is the best. But then the checks in 4a, 4b, 5, and 6 would still weigh against requiring it. The procedure might hand it back as a values call because the client must weigh the importance of the campaign against family. But the procedure would suggest that skipping is not required and might be supererogatory if the client chooses to do it. However, given the risks to relationships, it might be better to attend.

     The procedure gives the answer you won't like: skipping the wedding is not required (and may be wrong). But note: the procedure cannot settle the uncertainty in step 3 (how impactful the campaign work really is). The client might overestimate the impact. The advisor should help the client assess the impact realistically.

   **Limitations of the Procedure**

   1. **Uncertainty**: Many consequentialist decisions depend on uncertain predictions. The procedure relies on the client's best guess, which might be flawed.

   2. **Subjectivity in Cost and Integrity**: What counts as "excessive cost" or a "core commitment" is subjective. The procedure may not resolve deep conflicts in values.

   3. **Time Constraints**: In 45 minutes, we may not be able to explore all consequences and costs in depth.

   4. **Bias**: Clients (and advisors) may have biases that affect their assessment of consequences and costs.

   5. **Rule-Consequentialist Complexity**: The rule-consequentialist step (step 6) is difficult to apply and may be speculative.

   6. **Handling Values Calls**: When the procedure hands the decision back to the client, it may not provide enough guidance.

   7. **Burnout and Mental Health**: The procedure is not therapy. If the client shows signs of burnout or mental health issues, the advisor must refer out. Signs include: emotional exhaustion, cynicism, reduced efficacy, depression, anxiety, or inability to function in daily life.

   8. **Misfires**:
      - It might demand too much if the client underestimates the cost to themselves.
      - It might demand too little if the client overestimates the cost or underestimates the good they can do.
      - It might allow personal commitments to override significant moral demands too easily.

   The procedure is a structured way to think through the problem, but it is not a perfect algorithm. The advisor must use judgment and be prepared to refer to a therapist when the client's well-being is at risk.

   **Final Procedure Outline for the Session (45 minutes):**

   0. Introduction (2 minutes): Explain the goal and the steps.

   1. Clarify the Action and Alternatives (5 minutes)
      - Question: "What are you considering doing? What are the main alternatives?"

   2. Assess Consequences (10 minutes)
      - Question: "What do you think would be the consequences of each option? Consider both positive and negative, short-term and long-term, for yourself and others."

   3. Compare Net Expected Good (3 minutes)
      - Question: "Which option do you think would produce the most net expected good? If you're not sure, what's your best guess?"

   4. Check for Supererogation (15 minutes total, broken down)
      a. Cost to the Agent (5 minutes)
          - Question: "How costly would the best option be for you? Consider all types of costs. What are the costs of not doing it? Would the cost be so high that it would be unreasonable to demand it of anyone in your shoes?"
      b. Integrity and Personal Commitments (5 minutes)
          - Question: "Would doing it conflict with your core commitments or sense of self? If so, how?"
      c. Advisor: Weigh the answers. If the cost is excessive OR the integrity conflict is severe, then the action might be optional.

   5. Sustainability Check (3 minutes)
      - Question: "If you did it, how would it affect your ability to do good in the future? Would it lead to burnout?"

   6. Rule-Consequentialist Filter (2 minutes)
      - Question: "If we had a rule requiring this in all similar cases, would it be too demanding for people to follow and thus backfire?"

   7. Decision and Handoff (5 minutes)
      - Advisor summarizes:
          - If the action is clearly the best and passes all checks (4a, 4b, 5, 6): required.
          - If it is the best but fails a check: supererogatory.
          - If it isn't the best: not required (and possibly wrong).
          - If there's a deep integrity conflict and the stakes are not extreme, hand back as a values call.

      - Also, if at any point the client shows signs of distress or the issue is beyond the advisor's scope, refer to a therapist.

   **Note on Timing**: The times are approximate. The advisor must be flexible.

   **Why the procedure might not settle Case 2 completely**:
     - The expected impact of the campaign work is uncertain. The client and advisor might not be able to quantify it within the session.
     - The importance of the family commitment versus the political cause is a values call that the client must make. The procedure can highlight the conflict but not resolve it.

   **Final Note**: The procedure is designed to make the demandingness of consequentialism more manageable and to prevent burnout by setting reasonable boundaries. It is grounded in rule-consequentialist reasoning and recognizes the importance of sustainability and integrity. However, it is a tool, not a definitive answer.
answer: |-
  Here's a structured 45-minute procedure designed for practical use, incorporating your requirements. It combines consequentialist principles with psychological sustainability and distinguishes demandingness from integrity concerns. The session is divided into phases with clear exit points for referrals.

  ---

  ### **The Moral Demandingness Assessment Procedure**
  **Structure:** 7 sequential questions. Time allocation is flexible but totals 45 mins.  
  **Key Principles:**  
  - **Demandingness:** About *quantity* of sacrifice (cost to agent).  
  - **Integrity:** About *type* of sacrifice (violation of core identity/commitments).  
  - **Sustainability:** Sacrifices that impair long-term moral capacity are non-mandatory.  
  - **Rule-Consequentialist Limit:** Overly demanding rules are self-defeating if they cause widespread burnout/rejection.  
  - **Supererogation Solution:** Morally best acts become optional when they fail demandingness/integrity/sustainability checks.  

  ---

  #### **Phase 1: Consequence Mapping** (10 mins)  
  1. **"What are the reasonably expected positive/negative consequences of *acting* (for others, yourself, and your future capacity to do good)?"**  
     - *Sufficient Answer:* Identifies at least 3 tangible outcomes (e.g., "Donating a kidney saves a life; I lose 6 weeks of work; I feel purposeful but risk complications").  
     - *Misfire Alert:* If client fixates on extreme hypotheticals (e.g., "What if I donate and a war breaks out?"), redirect to probable outcomes.  

  2. **"What are the reasonably expected positive/negative consequences of *not acting*?"**  
     - *Sufficient Answer:* Contrasts with Q1 (e.g., "Stranger remains on dialysis; I preserve health but feel guilty; my family feels relieved").  
     - *Stop & Refer:* If client exhibits paralyzing guilt/anxiety ("I’m evil if I don’t do this"), pause and refer to therapist.  

  ---

  #### **Phase 2: Net Good Assessment** (5 mins)  
  3. **"Which option (acting/not acting) likely creates the *most net good overall*, considering scale, probability, and depth of impact?"**  
     - *Sufficient Answer:* Clear comparative judgment (e.g., "Donating creates more net good").  
     - *Optionality Flag:* If net good is similar (±20% estimate), action is **optional**—hand back to client.  

  ---

  #### **Phase 3: Demandingness Check** (10 mins)  
  4. **"What is the *total cost to you* if you act? Include: physical/emotional health, finances, relationships, and joy depletion."**  
     - *Sufficient Answer:* Quantifies costs (e.g., "6/10 pain, $5K lost income, strain with spouse").  
     - **Threshold:** If cost is **catastrophic** (e.g., permanent disability, bankruptcy) → Action is **not required**.  

  5. **"Could you absorb this cost *without* undermining your ability to do sustained good for 5+ years?"**  
     - *Sufficient Answer:* Addresses sustainability (e.g., "I’d recover but feel resentful" vs. "I’d burn out and quit activism").  
     - **Threshold:** If cost impairs **long-term capacity** (e.g., chronic depression, skill loss) → Action is **supererogatory** (optional).  

  ---

  #### **Phase 4: Integrity Check** (10 mins)  
  6. **"Does acting conflict with *core commitments* that define who you are (e.g., parent, artist, community member)?"**  
     - *Sufficient Answer:* Names specific values (e.g., "Skipping my sister’s wedding betrays my role as a brother").  
     - **Threshold:** If conflict exists → Proceed to Q7. No conflict → Action may be **required** (if Q4–5 passed).  

  7. **"Would a moral rule *requiring this for everyone* be self-defeating? (e.g., would most people reject it, reducing overall good?)"**  
     - *Sufficient Answer:* Social-level reasoning (e.g., "Requiring kidney donation would cause resentment; fewer people donate").  
     - **Threshold:** If rule is **self-defeating** → Action is **supererogatory**.  
     - *Integrity Handoff:* If rule is *not* self-defeating but integrity is deeply violated (e.g., "This erases my identity"), action is **optional**—hand back to client. *Rationale:* Integrity is partially non-consequentialist.  

  ---

  #### **Phase 5: Decision & Exit Paths** (10 mins)  
  - **Required:** If net good is high, cost is sustainable, no integrity conflict, and rule isn’t self-defeating.  
  - **Supererogatory (Optional):** If net good is highest but fails cost/integrity/rule checks.  
  - **Not Required:** If net good isn’t clearly highest OR cost is catastrophic.  
  - **Handoff to Client:** If net good is similar OR integrity violation is unresolvable.  

  **Supererogation Justification:** Consequentialism permits optionality when requiring the "best" act would collapse moral motivation (per rule-consequentialism) or destroy the agent’s capacity (per sustainability).  

  ---

  ### **Case Applications**
  **Case 1: Kidney Donation to Stranger**  
  - Q1: Acting saves a life; minor surgery risks.  
  - Q2: Not acting leaves stranger in suffering.  
  - Q3: Acting has higher net good.  
  - Q4: Cost: Moderate pain, temporary work absence.  
  - Q5: Sustainable for most.  
  - Q6: No inherent integrity conflict (unless client is athlete/soldier).  
  - Q7: Rule requiring donation *might* be self-defeating (scares people away).  
  - **Outcome:** **Supererogatory** (fails Q7).  

  **Case 2: Skip Sister’s Wedding for Political Campaign**  
  - Q1: Acting: Campaign gains critical momentum.  
  - Q2: Not acting: Sister feels abandoned; family rift.  
  - Q3: Net good ambiguous (campaign impact uncertain).  
  - Q4: Cost: High emotional/relational harm.  
  - Q5: Likely unsustainable (loses family support network).  
  - Q6: **Integrity conflict** (violates sibling commitment).  
  - Q7: Rule requiring skipping family events *is* self-defeating (erodes social fabric).  
  - **Outcome:** **Not required** (fails Q3, Q4, Q5, Q6, Q7).  
  - **Why You Won’t Like This:** The procedure prioritizes relationship sustainability and rule-defeat over high-impact activism. Ambiguity in Q3 (campaign impact) forces caution.  
  - **Unresolved:** How client weights "sister vs. campaign" is a **values call** (handed back).  

  ---

  ### **Limitations & Misfires**  
  1. **Cannot Do:**  
     - Resolve profound uncertainty (e.g., "Will my $10K donation *actually* save a life?").  
     - Quantify "soft" costs (e.g., existential angst).  
     - Override client’s deeply held non-consequentialist values.  
  2. **Misfires When:**  
     - Clients underestimate costs (e.g., burnout-prone idealists).  
     - Net good is speculative (e.g., long-term political impact).  
     - Cultural differences inflate/deflate integrity perceptions.  
  3. **Referral Triggers:**  
     - Suicidal ideation, severe anxiety, or relationship collapse.  
     - Obsession with moral perfectionism.  
     - Inability to articulate costs/consequences (may indicate depression).  

  **Defense to Philosopher Supervisor:** This systematizes the demandingness debate (e.g., Sobel’s cost thresholds) and integrity objections (Williams/Bernard Williams), while embedding rule-consequentialism (Hooker/Brad Hooker) to avoid collapse into act-consequentialism. Sustainability draws from effective altruism literature (e.g., Will MacAskill).  

  ---  
  **Next Steps:** Run this with a test client, then refine with supervisor. Focus on Q4–Q7 to prevent burnout.
