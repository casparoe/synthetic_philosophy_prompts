  Next, structuring the question. The exam question needs to be clear and directive. It should ask students to calculate the committee's accuracy both with and without the junior member, and to find the correlation threshold where adding the junior becomes beneficial. This forces them into the weeds of the independence assumption. Also, specifying the common-shock model keeps it answerable without overcomplicating.

  For the model answer, I'll need to walk through the calculations step by step. First, the original committee's accuracy: in the bias state, they all vote wrong. In the independent state, they use the binomial formula since votes are independent. Then, the probability of being correct overall. Similarly for the expanded committee including the junior. The key is comparing these two probabilities and solving for θ where adding the junior helps. The critical θ turns out to be around 0.027, meaning if the bias probability is above that, adding the junior hurts.

