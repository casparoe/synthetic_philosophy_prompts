answer: |-
  **TO:** Content Review Panel  
  **FROM:** [Your Name], Chair, Content Review Panel  
  **DATE:** [Current Date]  
  **SUBJECT:** Resolution on Functional Language in Evolution Gallery Labels  

  ### Classification of Disputed Cases by Functional Account  
  | Case                 | Selected-Effects (Etiological) Account                                                                 | Causal-Role (Systemic) Account                                                                 |
  |----------------------|--------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------|
  | **Human Goosebumps** | *Has a function*: Thermoregulation/display in ancestors. Current goosebumps are vestigial (no *current* function). | *Has a function*: Piloerection may still contribute weakly to thermoregulation or emotional signaling. |
  | **Appendix**         | *No function*: Lacks a selection history for its current role (gut bacteria reservoir).                | *Has a function*: Its current contribution to gut flora maintenance qualifies as a function.    |
  | **Heart Sound**      | *No function*: The sound was not selected for diagnostic purposes; it’s a byproduct.                   | *Has a function*: Within the doctor-patient system, the sound enables diagnosis.                |

  ---

  ### MEMO: Functional Language in Evolution Gallery Labels  

  **Background**  
  Our gallery’s narrative—"every structure has a job"—relies on the concept of biological "function." However, two philosophical accounts define "function" differently, leading to the dispute over three labels. I’ll summarize both accounts plainly, then recommend a path forward.  

  **The Two Accounts, Explained**  
  1. **Selected-Effects (Etiological) Account**  
     A trait’s function is the effect for which it was *historically selected by evolution*. Example: The heart’s function is pumping blood because ancestors with better pumps survived better. This view answers: **"Why did this trait evolve?"**  
     - *Strengths*: Anchors function in evolutionary history; explains why traits exist.  
     - *Weaknesses*: Cannot assign functions to new traits (e.g., novel mutations) or traits that no longer contribute to fitness (e.g., goosebumps).  

  2. **Causal-Role (Systemic) Account**  
     A trait’s function is any *current causal contribution* it makes to a system’s activity. Example: The heart sound’s function is aiding diagnosis if we define the "system" as healthcare. This view answers: **"What does this trait do now?"**  
     - *Strengths*: Flexible; applies to any trait in any context (e.g., medical, ecological).  
     - *Weaknesses*: Can overextend (e.g., calling cancer "functional" if it benefits a tumor ecosystem).  

  **Why These Accounts Conflict**  
  They address distinct questions:  
  - **Selected-effects** asks about evolutionary origins ("why is this here?").  
  - **Causal-role** asks about current mechanics ("what does this do?").  
  They are complementary, not mutually exclusive—but conflating them causes confusion.  

  **Recommendation for the Museum**  
  **Adopt both accounts as complementary tools, but use them contextually.** Evolutionary exhibits should prioritize the selected-effects account for core narratives (to emphasize adaptation), while allowing causal-role language for interactive or systems-based elements. This avoids misrepresenting biology while accommodating educational engagement.  

  **Implications for Labels and Gallery Text**  
  1. **"Function" implies selection history in evolutionary contexts.**  
     Vestigial traits (e.g., goosebumps) lack *current evolutionary functions* but may have causal roles.  
  2. **"Malfunction" is tied to selected-effects.**  
     A trait "malfunctions" only if it fails at its *historically selected job* (e.g., a heart that doesn’t pump). Causal-role functions don’t "malfunction"—they simply exist or don’t.  
  3. **"For" language is preserved but clarified.**  
     Use "evolved for" (selected-effects) and "used for" (causal-role) to distinguish contexts.  

  **Resolution of Disputed Labels**  
  Replace all three labels as follows to reflect both accounts accurately while prioritizing evolutionary narratives:  

  1. **Human Goosebumps**  
     - *Current label*: "A leftover from our furrier ancestors—it no longer has a function."  
     - **Problem**: Implies no current causal role (contested) and obscures evolutionary history.  
     - **Replacement**:  
       > "A relic from furry ancestors: Goosebumps evolved to trap warmth and signal distress. Today, they are vestigial—no longer critical for survival."  
     - *Rationale*: Acknowledges historical function (selected-effects) and reduces ambiguity about current utility.  

  2. **Appendix**  
     - *Current label*: "A vestigial organ, with no function."  
     - **Problem**: Denies its causal role (gut bacteria reservoir) despite lacking evolutionary evidence.  
     - **Replacement**:  
       > "A vestige of our herbivorous ancestors? While it may aid gut bacteria today, the appendix lost its original digestive role through evolution."  
     - *Rationale*: Notes current contribution (causal-role) while emphasizing evolutionary change (selected-effects).  

  3. **Heart Sound Interactive Caption**  
     - *Current caption*: "The sound it makes has a function: it lets a doctor hear your heartbeat."  
     - **Problem**: Confuses a byproduct (sound) with a selected function (blood flow).  
     - **Replacement**:  
       > "The heartbeat’s sound is a byproduct of blood flow. But doctors *use* it to monitor health—showing how biology can be repurposed!"  
     - *Rationale*: Separates evolutionary function (selected-effects) from human utility (causal-role in healthcare).  

  **Bottom Line**  
  Our labels must prioritize evolutionary accuracy without sacrificing accessibility. By distinguishing "why a trait evolved" from "what it does now," we reconcile scientific precision with educational impact. **Approve the replacement labels above for immediate implementation.**  

  **What We Gain and Lose**  
  - **Gain**: Consistency with evolutionary theory; clearer framing of vestigial traits; avoidance of category errors.  
  - **Lose**: The causal-role account’s flexibility for non-evolutionary systems (e.g., medicine). However, this is mitigated by contextual phrasing ("used for").  

  This approach aligns with our gallery’s mission: to show evolution as an ongoing process, where history shapes current biology—even when traits outlive their original jobs.  

  **Final Direction to Designers**:  
  Use the three replacement labels verbatim. Revise the gallery’s running text to replace "every structure has a job" with:  
  > "Every structure bears the imprint of evolution—shaped by past needs, repurposed by current ones."  

  This memo preempts further debate. We proceed with these edits.  

  //End memo//  
  ---  
  **Word count**: 790  
  **Key Takeaways for Panel**:  
  - Selected-effects: "Why is this here?" (Evolutionary history).  
  - Causal-role: "What does it do?" (Current systems).  
  - Labels revised to honor both, with evolutionary context leading.  
  - No relitigation needed—forward recommendations to designers.
