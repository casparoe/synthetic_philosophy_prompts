answer: |-
  ## The Swiss Suffrage Case Through the Lens of the Democratic Boundary Problem

  The democratic boundary problem asserts that the composition of the *demos* (the people entitled to participate in collective self-government) cannot be settled democratically. Any procedure to decide membership presupposes a prior definition of *who* is entitled to make that decision, creating a foundational circularity. The Swiss women's suffrage struggle provides a rich case study to test this paradox.

  **I. Theory on the Case: Boundaries, Principles, and Tensions**

  1.  **The Demos and the Bound at Each Vote:**
      *   **1959 Vote:** The *demos* was exclusively male Swiss citizens. They voted (67% against) on whether to grant federal voting rights to women. The outcome *bound* all Swiss citizens, including women, who remained excluded from federal politics.
      *   **1971 Vote:** The *demos* was *still* exclusively male Swiss citizens. They voted (65.7% for) to grant federal voting rights to women. The outcome *bound* all Swiss citizens, including women, who were now included. Note: Women gained the *right* to vote *after* the decision binding them was made by others.

  2.  **The Boundary Problem's Prediction:**
      The boundary problem predicts that the existing (male) demos lacks the legitimate authority to definitively settle the question of *who constitutes the demos* when that change involves including a new group. The decision to include women is made by a group whose own legitimacy as the sole decider is precisely what is being questioned by the proposed inclusion. It is an act of self-definition performed by a partial subset.

  3.  **Principles of Inclusion & the Swiss Case:**
      *   **All-Affected Interests Principle (AAP):** All those whose interests are significantly affected by a decision should have a say in making it. *Swiss Fit:* Women's interests (taxation, laws, social policies, war) were profoundly affected by federal decisions. They clearly met this criterion. *Embarrassment:* Despite being undeniably affected, they were systematically excluded from the vote *about* their inclusion and all prior votes affecting them. The AAP demands their inclusion, yet the procedure blatantly ignored this.
      *   **All-Subjected to Coercion Principle (ASP):** All those subject to the binding laws and coercive power of a polity should have a say in shaping those laws. *Swiss Fit:* Women were unequivocally subject to Swiss federal law and state coercion (taxation, criminal law, civil obligations). They clearly met this criterion. *Embarrassment:* As with AAP, their subjection was undeniable, yet the procedures defining the demos excluded them. The principle highlights their *right* to be included, which the process violated.

  4.  **The Anti-Suffrage Women's Movement:**
      The existence of women campaigning *against* their own enfranchisement does **not** weaken their claim to standing under AAP or ASP. Standing is based on the objective condition of being affected or subjected, not on the subjective preferences of the affected/subjected group. However, it **genuinely complicates the AAP as a practical criterion**. If "interests" are interpreted subjectively, do women *against* suffrage genuinely have an "interest" in voting? AAP struggles when the affected group is internally divided about the nature of their interests or the remedy. ASP avoids this complication: regardless of their opinion on suffrage, these women were objectively subjected to Swiss law and coercion, grounding their claim to inclusion on a more objective basis. Their political stance is irrelevant to the *principle* of inclusion based on subjection.

  5.  **Internal Boundary vs. External Boundary:**
      This internal boundary shift (excluding a resident, subjected class) **intensifies the paradox and exposes the theory's limitations**:
      *   **Intensifies Paradox:** Excluding a group so deeply integrated (households, workplaces, subject to laws) makes the arbitrariness and injustice of the boundary starkly visible. The "pre-political" demos definition appears blatantly illogical and unjustified when it excludes half its resident adults subject to its rule.
      *   **Exposes Theory's Silence:** The boundary problem is often discussed concerning external borders (immigration, secession) where the "pre-political" unit is more readily assumed (e.g., existing nation-state). The Swiss case forces the question: *How was the original male-only demos legitimized internally?* The boundary problem struggles to explain the initial exclusion of women *within* the territory. It takes the initial boundary (male citizens) as a brute fact, unable to provide a democratic justification for *that* starting point. The theory falls silent on the historical origins of such internal exclusions, focusing only on the *change*.

  **II. Case on the Theory: Testing the "Impossibility"**

  1.  **The 1971 Vote: Self-Enlargement or Illegitimate Act?**
      The 1971 vote *appears* as the demos "enlarging itself," seemingly contradicting the impossibility claim. However, this appearance is misleading:
      *   **Not Self-Government for Women:** The women bound by the outcome had no part in the decision. It was an act of the *old* demos, not an act of self-government by the *new*, enlarged demos.
      *   **Legitimacy Deficit:** The inclusion cannot be considered *democratically* legitimate simply because the included group later participated. The *act of inclusion itself* was performed by a body (the male demos) whose authority to *withhold* that inclusion in the first place was unjustified under ASP/AAP. Granting a right does not legitimize the prior, unjust withholding of it. The decision rested on the very authority challenged by the need for inclusion.
      *   **The 1990 Court Order:** The Federal Supreme Court's intervention in Appenzell Innerrhoden is fatal to the idea that democratic self-enlargement solved the problem. Democracy alone, operating within the old boundaries, proved insufficient. Inclusion required **external, non-democratic authority** (the court, deriving legitimacy from the *federal* constitution and ASP) to enforce the principle against the resistant canton. This starkly confirms the boundary problem: the demos *within* Appenzell (still resisting full inclusion) could not settle its own boundaries democratically; an external actor enforcing a broader principle (AS) was necessary. Democracy relies on pre- or extra-democratic foundations (constitutions, courts, principles) to define its scope.

  2.  **Contrast: Scotland 2014 Referendum & Principle Test**
      *   **The Franchise:** Based on *residence* in Scotland (including 16/17-year-olds, EU/Commonwealth citizens resident there). Excluded: Scottish-born UK citizens living elsewhere in the UK (rUK), other UK citizens in rUK.
      *   **AAP Demand:** AAP, if applied rigorously, would demand enfranchising vast numbers: Scots in rUK (affected culturally, economically, possibly citizenship status), other UK citizens in rUK (affected economically, politically, nationally), potentially EU citizens outside Scotland (affected economically). This creates an unmanageably large, amorphous, and potentially contradictory electorate ("reductio ad absurdum").
      *   **ASP/Residence as Operational Principle:** The actual franchise implicitly relied on a combination of ASP (subject to the *new* Scottish state's laws if independent) and a territorially defined political community. Residence served as a proxy for primary subjection to the *outcome* (the new state). Scots in rUK would primarily remain subject to UK laws.
      *   **Contrast with Switzerland:** The Scottish case highlights why ASP (often linked to territorial jurisdiction/residence) is the *operational* principle for defining franchise in practice, despite AAP's intuitive appeal. The Swiss case confirms this: Women were *subjected* to Swiss law *within* the territory. The contrast reveals that the Swiss resolution, while imperfect, implicitly relied on **ASP as the enforceable principle**. The AAP, evident in women's affectedness, provided the moral imperative but proved insufficient for procedural resolution within the existing democratic framework. The court in 1990 enforced ASP, not AAP.

  **Verdict: Confirmation, Anomaly, or Exposed Distinction?**

  The Swiss episode **confirms the core assertion of the boundary problem** while **exposing a crucial distinction the theory often underplays**:

  1.  **Confirmation:** The process starkly revealed the circularity. The 1959 and 1971 votes were both decided by a demos whose legitimacy to exclude women in the first place was indefensible under ASP/AAP. The 1990 court order irrefutably demonstrated democracy's inability to settle its *own* boundaries internally when a subset resists inclusion based on ASP. An external, non-democratic enforcer was required.
  2.  **Exposed Distinction: ASP vs. AAP in Practice:** The case highlights the difference between the **moral force of AAP** (women were clearly affected, providing the ethical drive for change) and the **operational necessity of ASP** as the primary criterion for enforceable *membership in the demos*. While both principles pointed to inclusion, the *mechanism* of change relied on the existing demos (based on an outdated ASP interpretation) acting, and ultimately, a court enforcing ASP. The existence of anti-suffrage women complicated AAP subjectively but did not weaken the objective ASP claim. The Scottish contrast reinforces that ASP/residence is the practical, workable (though imperfect) criterion used to define the franchise, while AAP remains a broader ethical consideration often leading to impracticality if applied rigidly.

  **Conclusion:** The Swiss suffrage struggle powerfully validates the democratic boundary problem. The demos could not coherently or democratically define its own boundaries to include a group already subject to its rule. Change required action by the existing (illegitimately exclusive) demos and, ultimately, non-democratic enforcement based on the All-Subjected Principle. The case exposes the theory's silence on the origins of internal exclusions but crucially clarifies the practical primacy of ASP over AAP in resolving membership questions within existing territorial jurisdictions. The boundary problem stands, and Switzerland illustrates its intractability and the messy, often non-democratic, paths taken to overcome it.
