prompt: |-
  ok so I'm working on a piece about G.E. Moore and the hands thing — he holds up one hand, then the other, and says that settles it, there's an external world — and every source I talk to gives me the same knowing line: it's just Samuel Johnson kicking the stone. You know the scene. Someone tells Johnson that Berkeley's idealism can't be refuted, Johnson boots a big rock and says thats his refutation. The moral everyone draws is that Moore's lecture is Johnson's stunt with footnotes: commonsense bluster standing in for an argument, no answer to the skeptic, just a refusal to take him seriously.

  A philosopher I trust thinks the analogy is doing alot of work in that dismissal, and that it's a bad comparison. Her point: Johnson was trying to knock down a thesis — that matter only exists when it's perceived — while Moore wasn't attacking the skeptic's reasoning so much as reversing it. He doesn't dispute the skeptic's logic at all; he just treats the fact that there's a hand here as something he knows better than he knows any premise that would undercut it. Thats a move about burden of proof, not a kick.

  So can you audit this for me? Lay out the mapping — a table, I'm a words guy — what in the Johnson story lines up with what in Moore's proof, then where the mapping breaks, and crucially which breaks matter for the use the analogy is being put to, i.e. licensing the verdict that its just bluster and the proof is a shrug.

  Three things I'd like worked in:

  - The analogy seems to assume Moore's hands are as plain a fact as Johnson's stone, and that anyone who doubts them is being silly. But I've read that Johnson's kick is often said to miss what Berkeley actually claimed (he wasn't denying the stone is there, he was denying something else about it), and that commonsense certainties have a habit of getting overturned — everybody was once certain the sun went round the earth. If thats right, what happens to the analogy, and to the bluster verdict?
  - If the gesture really does prove the external world, the same template seems to prove the past, or anything common sense asserts, including things we've since dropped. Feature, or reductio?
  - Does any of this bear on whether the proof actually works, as opposed to whether Moore was being smug?

  And if the comparison is a dud, tell me what you'd swap in for it.
reasoning: |-
  Okay, the user is working on a piece about G.E. Moore's "Here is one hand" argument and how it's often compared to Samuel Johnson kicking a stone as a refutation of Berkeley. The user has a philosopher friend who thinks this analogy is flawed and wants me to analyze it in depth. 

  First, I need to map out the surface similarities between Johnson and Moore. Both use physical gestures - Johnson kicking a stone, Moore holding up hands - to make a point about external reality. Both are responding to philosophical skepticism. Both get dismissed as mere "commonsense bluster" without real argument. 

  But the differences are crucial. Johnson is directly attacking Berkeley's idealism, trying to disprove it through sensory evidence. Moore isn't attacking skepticism head-on; he's reversing the burden of proof. He's saying "I know this is a hand" is more certain than any skeptical premise. That's a very different philosophical move. 

  The user raises three important points. First, about whether commonsense certainties are reliable. Johnson's kick arguably misses Berkeley's actual point (which was about the nature of perception, not existence), and history shows commonsense views can be wrong (like geocentrism). This weakens the analogy because Moore isn't claiming infallibility - he's making an epistemic point about relative certainty. 

  Second, if Moore's method proves the external world, could it "prove" other commonsense beliefs, even false ones? That's actually a feature of Moore's approach - he'd say we should trust commonsense until overwhelmed by evidence, which explains why we dropped geocentrism. 

  Third, whether this affects if the proof "works." The analogy distracts from Moore's actual argument about epistemic priority. Calling it "smug" misses the philosophical substance. 

  For a better comparison, Wittgenstein's hinge propositions come to mind - those basic certainties we don't doubt because they're the framework for doubting. That captures Moore's point better than Johnson's stone-kicking. 

  The user seems sophisticated - they're wrestling with how a historical analogy shapes philosophical reception. Their frustration with the "knowing line" suggests they want to move beyond superficial dismissals. I should honor that by digging into why the analogy persists despite its flaws, and what it reveals about philosophical style versus substance.
answer: |-
  Here's a breakdown of the Johnson/Moore analogy, its mapping, its breakdowns, and why those breakdowns matter for the "bluster" verdict – plus your three points addressed and a better alternative comparison.

  **The Core Analogy & Its Appeal**

  | Feature              | Samuel Johnson (Kicking Stone)                          | G.E. Moore (Proof with Hands)                           | Shared Surface Trait (What fuels the analogy)          |
  | :------------------- | :------------------------------------------------------ | :------------------------------------------------------ | :----------------------------------------------------- |
  | **Gesture**          | Kicks a large stone                                     | Holds up two hands                                      | Physical, bodily demonstration of external reality.    |
  | **Target**           | Berkeley's Idealism (Matter exists only when perceived) | Skepticism about the External World                     | A philosophical position denying/materially questioning external reality. |
  | **Claim**            | "I refute Berkeley *thus*." (Stone's reality refutes idealism) | "Here is one hand... here is another... therefore, an external world exists." | An appeal to commonsense obviousness as decisive.      |
  | **Common Dismissal** | Mere bluster, not an argument. Ignores Berkeley's point. | Mere bluster, not an argument. Ignores the skeptic's reasoning. | Seen as substituting gesture for logic, refusing to engage seriously. |
  | **"Bluster" Verdict**| "He missed the point! It's not about *existence* but the *nature* of existence." | "He missed the point! Skepticism challenges *how we know*, not the brute fact." | Seen as intellectually crude, failing to address the core philosophical challenge. |

  **Where the Mapping Breaks Down (Crucially)**

  | Feature             | Johnson (Stone)                                            | Moore (Hands)                                               | Why the Break Matters for the "Bluster" Verdict                     |
  | :------------------ | :--------------------------------------------------------- | :---------------------------------------------------------- | :------------------------------------------------------------------ |
  | **Primary Aim**     | **Refutation:** To *disprove* a specific thesis (Berkeley's idealism). | **Reversal of Burden/Proof:** To *demonstrate certainty* exceeding skeptical premises, not necessarily refute their logic point-by-point. | **Crucial:** Johnson *tries and fails* at refutation (misses Berkeley). Moore *sidesteps* refutation to assert superior certainty. Calling Moore "bluster" assumes he *failed at refutation*, but that wasn't his main goal. |
  | **Epistemic Stance**| "This sensation *proves* matter is independent." (Makes a strong, contestable claim about what the sensation *means*). | "I *know* this is a hand *more certainly* than I know the premises of any skeptical argument against it." (Makes a claim about *relative certainty*, not ultimate proof). | **Crucial:** Johnson's claim *is* vulnerable (Berkeley can explain the sensation). Moore's claim is about the *relative weight* of different propositions in his belief system. Dismissing Moore as "bluster" misreads his more subtle epistemic move. |
  | **Engagement w/ Logic** | Implicitly denies the logic of idealism ("Sensation = External Object"). | **Explicitly grants the skeptic's logic *could* be valid** but asserts he has better reason to reject a premise than to doubt the hand. | **Crucial:** Johnson ignores/denies the opposing logic. Moore *acknowledges* it but prioritizes commonsense certainty. Calling Moore "bluster" overlooks his engagement with the skeptical structure. |
  | **Nature of "Proof"** | Presented as a *direct, conclusive refutation*.            | Presented as a *paradigm case* of an undeniable commonsense certainty, forming the basis for rejecting skeptical premises. | **Crucial:** Johnson's "proof" fails logically. Moore's "proof" works internally *within* his system of knowledge; its success depends on accepting his premise about the certainty of "here is a hand." The analogy treats both as equally failed refutations. |

  **Addressing Your Three Points**

  1.  **"Plain Fact" & Overturned Commonsense:**
      *   **Johnson:** The analogy *assumes* the stone's kick proves independent matter. Critics rightly point out Berkeley *didn't deny the sensation*; he offered a different *explanation* (God directly causing the sensation). Johnson's "plain fact" misses Berkeley's actual claim. **Analogy Impact:** Reinforces the "bluster" verdict *for Johnson* – he *did* miss the point.
      *   **Moore:** The analogy *assumes* Moore's hand is as plain a fact as Johnson's stone. But Moore's point isn't that "hand" is an *infallible* concept immune to revision. His point is that *right now*, for him, "Here is a hand" is *maximally certain*. He'd likely agree that *specific* commonsense beliefs (geocentrism) were overturned *based on evidence that became more certain than the old commonsense view*. His method doesn't claim infallibility for *specific* commonsense beliefs, but asserts that *some* commonsense certainties (like the existence of external objects via perception) are foundational starting points, more secure *for him* than complex skeptical arguments. **Analogy Impact:** The analogy conflates Moore's *epistemic priority* claim ("I know this best") with Johnson's failed *metaphysical* claim ("This sensation proves mind-independent matter"). It wrongly suggests Moore is making Johnson's mistake. The "bluster" verdict ignores Moore's nuanced position on revisability.

  2.  **Proving the Past, Geocentrism, etc. (Reductio?):**
      *   Moore *would* embrace this! He argued his method *could* be used to "prove" other commonsense propositions: "The Earth has existed for many years past," "I had breakfast this morning." He sees this as a *strength*, not a weakness.
      *   **It's a Feature, not a Reductio, for Moore:** His point is that we *do* know these things with certainty exceeding skeptical arguments. If evidence later overturned a *specific* belief (geocentrism), Moore would say the *new evidence* simply became *more certain* than the old commonsense view *at that time*. The core method – trusting what you know with the highest certainty, even if it's commonsense, *over* complex arguments leading to skepticism – remains. The analogy's dismissal as "bluster" misses that Moore *intends* this wide application and sees it as legitimate.

  3.  **Relevance to "Smug" vs. "Works":**
      *   **The Analogy:** Primarily fuels the *rhetorical* critique ("smug bluster") by linking Moore to Johnson's famously pugnacious and arguably simplistic gesture. It focuses on the *style* (physical gesture, appeal to obviousness) rather than the substance of Moore's argument.
      *   **Does it Bear on Whether it Works?** Indirectly, but unhelpfully. By framing Moore's move as identical to Johnson's failed refutation, the analogy *predisposes* people to think it *doesn't* work. However, whether Moore's "proof" *works* hinges entirely on whether you accept his core epistemological claim: that propositions like "Here is a hand" have a higher degree of certainty *for the knower* than the premises of skeptical arguments, justifying the rejection of those premises. **The analogy doesn't engage with this core argument;** it just paints it with the "bluster" brush borrowed from Johnson.

  **The Verdict on the Analogy:**

  The Johnson/Moore analogy is **deeply flawed and misleading** when used to support the "bluster and shrug" dismissal of Moore. While capturing a superficial similarity in style (gesture, appeal to obviousness), it fundamentally misrepresents Moore's philosophical aim and method:

  1.  Moore wasn't primarily *refuting* skepticism like Johnson tried (and failed) to refute Berkeley; he was *reversing the burden of proof* and asserting a *hierarchy of certainty*.
  2.  Moore explicitly acknowledged the *logical possibility* of skepticism but argued his commonsense certainties were *more secure* than any premise leading to that conclusion.
  3.  The analogy ignores Moore's nuanced view on the revisability of *specific* commonsense beliefs, conflating it with Johnson's crude metaphysical assertion.

  **What to Swap In: Wittgenstein's "Hinge Propositions"**

  For a more illuminating comparison, consider **Ludwig Wittgenstein's "On Certainty"** (inspired by Moore):

  *   **The Core Idea:** Certain propositions function as "hinges" on which our inquiries and doubts turn. They are not themselves justified by evidence within the language-game; they are the *framework* that makes justification and doubt *possible* ("The earth exists," "My name is L.W.," "That is a hand").
  *   **Mapping to Moore:** Moore's "Here is a hand" is a paradigmatic *hinge proposition*. Its certainty isn't based on evidence but on its foundational role in our epistemic practices. Doubting it isn't *wrong* in a logical sense, but it paralyzes the entire system of inquiry and discourse.
  *   **Why it's Better:**
      *   Captures Moore's point about *epistemic priority/foundationality* rather than refutation.
      *   Explains *why* such propositions seem immune to skeptical doubt – they are constitutive of the language-game of doubting and knowing.
      *   Accounts for revisability (hinges can shift over time/context) while acknowledging their bedrock status *within a framework*.
      *   Shifts focus from "bluster" to the *structure* of knowledge and justification, which was Moore's actual concern.

  **Conclusion:** The Johnson analogy is a catchy but ultimately lazy and distorting way to dismiss Moore. It confuses Moore's sophisticated (and controversial) epistemological strategy – prioritizing foundational commonsense certainties over abstract skeptical reasoning – with Johnson's failed metaphysical refutation. To understand Moore's "proof," ditch the stone and focus on the "hinges" of knowledge. The "bluster" verdict stems more from the misleading analogy than from a fair assessment of Moore's actual argument.
