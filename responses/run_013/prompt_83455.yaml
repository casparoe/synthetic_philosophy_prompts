prompt: |-
  I have no academic background in this area, so I apologize in advance if I garble the vocabulary. I have been trying to think this through on my own and keep going in circles. Somewhere I picked up a result usually called Good's theorem on the value of information. My understanding of it is this: if you are the kind of chooser who selects whichever option has the highest expected payoff, then information that arrives before you choose cannot make your choice worse in expectation, because at worst you can disregard it and choose exactly as you would have chosen without it. I take it the expectation is calculated before you see what the information says, and that the theorem concerns the quality of the decision rather than whether you are pleased by the news.

  Here is what I cannot square with that. A friend was offered a free screening test for a condition that has no treatment and does not shorten her life. The result would not tell her anything she could act on; she says she would spend the rest of her days waiting for symptoms, and that she would probably stop making long-term plans. She declined, and she has even asked the clinic to record that she does not want to be told if a later test happens to pick the condition up, which she says is because she does not trust her future self to refuse a second time. I want to tell her that she is simply being irrational, since the theorem is a mathematical fact and a rational person cannot be made worse off by information. But the only defence of that verdict I can find is that she could always ignore the result, and that defence strikes me as empty, because she cannot un-know it. When I try to imagine a version of her case where she could act on the result, I am not sure the theorem helps me either: it seems to say something about the value of choosing with information, not about whether obtaining it is worthwhile.

  So I would like to know whether I have the theorem wrong, or whether my friend is genuinely making a mistake. If the theorem does not settle her case, I would like to understand precisely what it does establish, and where the reasoning I keep reaching for breaks down.
reasoning: |-
  Okay, so the user is grappling with Good's theorem and their friend's decision to refuse potentially distressing medical information. They feel stuck between a mathematical principle and a real-life choice that seems rational on human terms. 

  First, I need to untangle why they're circling: they're trying to force a decision-theory framework onto a context it wasn't designed for. Good's theorem assumes you'll *use* information to optimize decisions, but their friend explicitly rejects that premise because she has no actionable choices. The user's phrase "she cannot un-know it" reveals their intuitive grasp of the core issue—information has intrinsic psychological weight beyond its instrumental value.

  The friend's case is fascinating because it highlights two limits of the theorem: (1) It only protects expected payoff, not emotional state. The friend's "waiting for symptoms" dread is a utility loss the theorem ignores. (2) Her precommitment (clinic note) shows she understands her future self might violate her current preferences—a self-control problem the theorem doesn't model.

  Where the user's reasoning stumbles is in assuming rationality must mean maximizing only the payoff Good's theorem considers. But rational agents can legitimately value ignorance to preserve mental health or future autonomy. The defense "she could ignore it" fails precisely because information isn't neutral—it alters your state space.

  I should emphasize that the theorem isn't wrong, just narrowly scoped. Its power is in proving information can't harm *instrumental rationality* for action-tied decisions. But their friend's situation is about *experiential rationality*—where knowledge itself directly affects wellbeing. That's why the "long-term plans" detail matters: it shows her utility function includes psychological continuity.
answer: |-
  You've hit on a profound tension between formal decision theory and real human psychology. Your grasp of Good's theorem is essentially correct, but your friend's situation exposes its limitations. **The theorem does not apply to her case, and her decision is rationally defensible.** Here's the breakdown:

  ### 1. Good's Theorem: What It Actually Says (and Assumes)
  *   **Core Idea:** For a rational agent making a *single decision* based on *expected utility (EU) maximization*, acquiring *costless, non-manipulative* information *before* the decision cannot decrease the EU of the ultimate choice, *calculated before seeing the information*. At worst, it leaves EU unchanged.
  *   **Key Assumptions:**
      *   **Action-Oriented:** The agent *must take an action* whose outcome depends on the state of the world. Information is valuable because it helps predict the state and thus choose the best action.
      *   **EU Maximization:** The agent's goal is *only* to maximize the expected value of some payoff/utility function associated with outcomes.
      *   **Utility is State-Action Based:** Utility depends *only* on the chosen action and the true state of the world. Knowing the state itself has *no intrinsic positive or negative utility*.
      *   **Free Disregard:** The agent can freely choose to ignore the information when making their decision.
  *   **Why it Holds:** If the information leads you to choose differently than you would have without it, it's because the information changed your beliefs about which action *maximizes EU*. Disregarding the information means you get the EU you would have gotten without it. Using it means you (expectationally) get at least that EU, and possibly more.

  ### 2. Why Good's Theorem Doesn't Apply to Your Friend
  *   **No Actionable Decision:** This is the critical flaw. Good's theorem is about *improving decisions*. Your friend has **no decision to make** based on the test result. There are no treatments, no lifestyle changes that affect the outcome. The theorem fundamentally requires a *choice between actions* whose consequences depend on the unknown state.
  *   **Information Has Direct Utility Cost:** The theorem assumes utility *only* comes from the outcome of the action taken in the world. For your friend, **knowing the result itself directly impacts her utility (well-being)**, independent of any action:
      *   A positive result causes anxiety ("waiting for symptoms").
      *   A positive result diminishes her enjoyment of life ("stop making long-term plans").
      *   This anxiety and diminished enjoyment *is* a negative utility, directly caused by the information, regardless of any action.
  *   **Violates "Free Disregard":** While she could technically "ignore" the information *in the sense of not acting on it*, she **cannot cognitively disregard it**. The knowledge itself imposes a psychological burden. The theorem assumes ignoring information is costless and effective; for her, it's impossible.
  *   **Rational Precommitment:** Her request to the clinic ("don't tell me even if found later") is a powerful rational strategy. She recognizes:
      *   **Self-Control Problem:** Her future self, faced with the immediate availability of the information, might choose to receive it ("does not trust her future self to refuse").
      *   **Time-Inconsistent Preferences:** Her *current* self strongly prefers never knowing. Her *future* self, in a moment of potential weakness or curiosity, might violate that preference, causing her future self harm (anxiety).
      *   **Precommitment as Solution:** By binding her future self now, she protects her *overall* lifetime well-being from the negative utility of knowing. This is a well-known rational strategy for dealing with predictable irrationality or preference inconsistency.

  ### 3. Where Your Reasoning Went Astray
  *   **Misapplying the Scope:** You correctly identified the theorem's focus on decision quality ("quality of the decision rather than whether you are pleased by the news"). The mistake was trying to apply it to a scenario where there *is no relevant decision* and where the "news" itself *is* the primary source of utility/disutility.
  *   **Overlooking Direct Utility of Information:** You focused on the inability to act ("could not act on the result") but didn't fully incorporate the crucial point that *the information itself is the bad outcome* for her, regardless of action.
  *   **Underestimating Precommitment:** The defense "she could always ignore the result" fails because it ignores the direct negative utility of knowledge and the rationality of recognizing and mitigating future self-control failures.

  ### 4. When *Would* Good's Theorem Apply?
  Imagine a *different* scenario where the condition *was* treatable if caught early, and treatment significantly improved outcomes. Now there *is* an action (treat or not treat) whose success depends on the state (has condition or not). Good's theorem applies:
  *   **Before Test:** EU(No Test) = max[ EU(Treat|Prior Belief), EU(Don't Treat|Prior Belief) ].
  *   **Before Test, Value of Test:** The EU calculated *before seeing the result* of taking the test and *then* choosing the best action (Treat/Don't Treat) based on the result *must be at least as high* as EU(No Test).
  *   **Why?** The optimal strategy after getting the test might be:
      *   If result = Positive -> Treat (High benefit if has condition, maybe some cost if false positive)
      *   If result = Negative -> Don't Treat (Avoids unnecessary treatment cost)
      This strategy *adapts* the action to the better information, yielding higher *expected* benefit than either blind "always treat" or "never treat" based only on the prior. Crucially, the utility here comes from the *outcome of the disease and treatment*, not from knowing the test result itself.

  ### Conclusion

  *   **You understand Good's theorem correctly.** It rigorously proves that costless information cannot harm the *expected outcome* of a *subsequent action* for a rational EU maximizer.
  *   **Your friend is not irrational.** Her scenario violates the core assumptions of Good's theorem:
      1.  There is **no actionable decision** whose outcome the information could improve.
      2.  The **information itself directly causes significant negative utility** (anxiety, loss of hope).
      3.  She **cannot effectively disregard** the information once known.
      4.  Her **precommitment strategy is rational** to protect her future self from this negative utility and her own potential weakness.
  *   **The theorem's defense ("ignore it") breaks down precisely because knowledge fundamentally alters her psychological state ("she cannot un-know it"), and this alteration itself is harmful in her utility function.**

  **In short:** Good's theorem is about the *instrumental value* of information for making better *decisions*. It says nothing about the *intrinsic value* (positive or negative) of information or knowledge *itself*. Your friend rationally assigns a high negative intrinsic value to knowing her status precisely because it cannot be used instrumentally and will actively harm her well-being. Her decision is coherent and defensible. Telling her she's irrational based on Good's theorem would be a misapplication of a powerful but context-specific mathematical result.
