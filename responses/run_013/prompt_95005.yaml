prompt: |-
  I'm a software engineer with no formal training in philosophy, and I've been reading about decision theory out of personal interest. I've encountered risk-weighted expected utility (REU) and I understand its rough shape: instead of maximizing the plain expected utility of a gamble, an agent orders the outcomes from worst to best, takes the probability of receiving an outcome at least as good as each one, passes those cumulative probabilities through a risk function, and uses the results to weight the incremental gains in utility between adjacent outcomes. I gather that ordinary expected utility is the special case where the risk function is the identity, and that a concave risk function corresponds to risk aversion.

  What I'd like explained is a conceptual issue that I suspect is the real heart of the view but that the summaries I've found skip over: why the risk function is applied to cumulative probabilities rather than to the probabilities of the individual outcomes. A naive variant of the theory would apply the risk function to each outcome's own probability and then take a weighted sum. As far as I can tell this naive variant is not equivalent to REU, and I want to understand what exactly goes wrong with it and what the cumulative structure is doing instead. In particular, I'd like to understand how that structural choice connects to the claim that REU lets an agent's attitude toward risk be represented separately from the shape of her utility function over outcomes — the latter being, as I understand it, the only place risk aversion can live in ordinary expected utility theory.

  Please write your answer under the following headings, in this order:

  - "Framing": restate the issue in plain terms and fix the minimum vocabulary needed, including what a risk function is and what a cumulative probability amounts to here. About 150 words.
  - "The structural difference": explain precisely how the cumulative version of the formula differs from the naive per-outcome version, working through a small concrete example with two or three outcomes so I can follow the arithmetic. About 300 words.
  - "What the cumulative structure buys": explain what conceptual or normative work the cumulative structure does — what a theory lacking it would get wrong, and why that matters. About 300 words.
  - "The interpretive question": discuss whether treating risk attitude as a separate parameter genuinely succeeds in separating risk attitude from the shape of the utility function, and set out the strongest objection to that separation. About 250 words.
  - "What would change your mind": state which consideration, argument, or example would lead you to a different assessment of the issue, and identify where your own reasoning is most likely to be unreliable. About 150 words.

  Please don't cite or recommend literature; I can't look anything up at the moment, and I'd rather have the reasoning than a reading list. Where you're unsure of a technical detail, flag the uncertainty rather than smoothing over it.
