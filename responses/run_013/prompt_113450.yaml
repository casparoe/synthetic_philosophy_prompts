  The Truman moment comes best in Letter 4. Agatha should distinguish between foreseeing deaths (permissible in just war) and making deaths the means (like bombing civilians to break morale). This mirrors her reply to the cheating case.

  Biggest challenge: Making the war criminal rebuttal airtight. Agatha must argue that proper intention analysis actually condemns more actions, since consequentialists excuse foreseen-but-"unintended" harms. The "why did you do it?" question traps defendants: If they admit the harm was instrumental, they're guilty.

