prompt: |-
  I'm running a session for our department's reading group next month — mixed crowd, a few philosophers, a couple of economists, nobody who's done formal bargaining theory past maybe seeing the prisoner's dilemma in a first-year class. The topic I got voluntold for is the Kalai–Smorodinsky bargaining solution. I know roughly what it is but I've never tought it, and I've never seen it taught well either. Don't just explain it to me — I need a plan for the session.

  What has to land first, before the solution even looks like an answer to something? What order do the pieces go in so that the monotonicity axiom feels like a constraint someone would actually want, rather than a technicality that gets tacked on at the end? And what single concrete bargaining scenario should I build the whole thing on? I keep being tempted by the obvious symmetric split-the-dollar case, but I suspect that example is a trap, because in a symmetric problem everything agrees and it hides the whole point — tell me if that's right and what to use instead, and what the example I pick has to have and has to lack so it can't be waved away.

  Then the misconceptions. I'm guessing people will come away thinking the solution is just 'the midpoint of the efficient frontier', or that it's an egalitarian or equal-gain rule, or that individual monotonicity is trivially true of any sensible solution. For each of those, tell me where in the sequence the misconception gets planted (I want to know the moment I'm about to create it, not just the fix) and exactly where I head it off. I also have a nagging worry there's a deeper one — that everyone will treat the axiomatic characterization as a prediction about how people will actually bargain, when it's a proposal about what counts as fair — so say where that one comes from and whether I should try to kill it or just flag it.

  Two more things. What's the one thing I should say out loud that I'm deliberately not going to explain at this level, so I don't get dragged into it for twenty minutes? And give me a single closing question to ask that would actually show me whether they've got the idea, not whether they can recite the formula back. Assume nobody has a laptop open, I've got a whiteboard and about fifty minutes.
reasoning: |-
  Okay, the user is preparing a session on the Kalai-Smorodinsky bargaining solution for a mixed academic audience without formal background. They need a structured plan that builds intuition, avoids common misconceptions, and uses the right example. Let me unpack this step by step.

  First, the core challenge: making monotonicity feel intuitive rather than technical. The user's instinct about symmetric examples being a trap is spot-on - symmetry masks KS's unique value. I need an asymmetric scenario where Nash's solution feels unfair to illustrate why we'd want monotonicity. Something like a salary negotiation where one party gains leverage would work well.

  For misconceptions: 
  - "Midpoint of frontier" confusion comes from visual similarity in symmetric cases. I'll need to deliberately break symmetry in the example. 
  - "Equal gains" mistake arises when people see the ray without understanding it's about proportional claims. I should emphasize utopia point as aspiration rather than equality. 
  - Monotonicity seeming trivial requires showing a solution that violates it (Nash) and why that feels unjust in the scenario. 

  The fairness-vs-prediction issue is crucial. I should explicitly state KS is normative during the axioms discussion, and perhaps contrast it with Rubinstein's model if anyone asks about descriptive approaches. 

  For time management: I'll explicitly table Rubinstein's alternating offers before someone derails the session. The closing question should test conceptual understanding - maybe asking them to sketch KS for a modified scenario on the board.

  The session flow should be: 
  1. Bargaining problem anatomy (set, disagreement point) 
  2. Why we need solutions beyond obvious cases → introduce axioms 
  3. Build KS through its unique properties 
  4. Clarify misconceptions via counterexamples 
  5. End with reflection on fairness vs prediction

  Key is making monotonicity feel necessary by showing Nash's insensitivity to changing aspirations. The salary negotiation example makes this visceral - when the employer's max offer increases, KS adjusts while Nash doesn't, which aligns with fairness intuition.
answer: |-
  Here’s a battle-tested session plan designed for clarity, intuition-building, and misconception prevention. It centers on **asymmetric power dynamics** to force engagement with KS’s unique logic.

  **Core Example: The Inheritance Negotiation**  
  *Use this throughout – it has the critical asymmetry and forces monotonicity to the forefront.*  
  - **Setup:** Two siblings (A & B) inherit an indivisible asset (e.g., a rare violin).  
  - **Disagreement Point (d):** If they fight, courts award it randomly (50/50 chance). Expected payoff d = (0.5, 0.5).  
  - **Feasible Set (S):**  
    - Sell the violin and split proceeds: (x, 1-x) for 0≤x≤1 (Line).  
    - *OR*: One keeps it, the other gets cash + sentimental bonus:  
      - If A keeps it: (Value to A = **1.4**, B gets cash max = **0.6**) → Point (1.4, 0.6)  
      - If B keeps it: (A gets cash max = **0.8**, Value to B = **1.2**) → Point (0.8, 1.2)  
  - **Utopia Point (u):** (1.4, 1.2) → *But note: (1.4, 1.2) is NOT achievable!*  
  - **Efficient Frontier:** The line connecting (1.4, 0.6) and (0.8, 1.2).  
  *Why this works:* It’s asymmetric (A values possession more, B can extract more cash), has a non-linear frontier, and u is unattainable – forcing focus on claims, not symmetry.

  ---

  **Session Flow (50 mins):**  

  1.  **Groundwork: What’s the Bargaining *Problem*? (10 mins)**  
      - Draw S, d, efficient frontier. Stress: *d is the threat, NOT zero*.  
      - **Q:** "What's 'fair' here? Equal split of cash? (0.5, 0.5) is worse than d! Equal chance at keeping it? But values differ!"  
      - **Key Landing:** Bargaining is about distributing *surplus* above d, respecting the *constraints* of S. The problem is *inherently normative* – we need principles.  

  2.  **Enter Axioms: What Do We Want? (15 mins)**  
      - **Pareto Efficiency (PE):** Obvious? Yes. Essential? Absolutely. Mark the frontier.  
      - **Individual Rationality (IR):** Point must be ≥ d. Obvious.  
      - **Scale Invariance (SI):** "If we change currency (utils to dollars), the *substance* shouldn’t change." Use rescaling analogy.  
      - **Symmetry (Sym):** *This is where the trap is sprung.*  
          - Show symmetry: "If we swapped A & B’s labels AND payoffs, would the solution swap?"  
          - **Q:** "Is our problem symmetric?" *Force them to see asymmetry (A’s max 1.4 > B’s max 1.2; cash offers differ).*  
          - **Landing:** Symmetry is intuitive *only if* the problem is symmetric. Ours isn’t. We need a *replacement* for Symmetry in asymmetric cases.  

  3.  **The Monotonicity Revelation (10 mins)**  
      - **Individual Monotonicity (IM):** "If the set *expands* in a way that *only* improves one player’s *best possible outcome* (their utopia coordinate), that player shouldn’t be *worse off*."  
      - **Crucial Demo:** Modify the example. Suppose B discovers a richer buyer! B’s max cash if A keeps violin increases from **0.6 → 0.9**.  
          - Old Utopia: u_old = (1.4, **1.2**)  
          - New Utopia: u_new = (1.4, **1.5**)  
          - **Q:** "Should B get *more* in the new solution? Should A get *less*? Or stay the same?" Debate!  
          - **Landing:** IM says B should not be worse off (could be better), A should not be better off (could be worse). This feels fair! B’s *claim* strengthened.  

  4.  **Introducing Kalai-Smorodinsky (10 mins)**  
      - **Construction:**  
          1. Plot d, u.  
          2. Draw the ray from d through u.  
          3. Find where this ray hits the efficient frontier. THAT’S KS.  
      - **Apply to Inheritance:**  
          - Calculate u - d = (1.4 - 0.5, 1.2 - 0.5) = (0.9, 0.7) → *Ratios 0.9:0.7 ≈ 1.286:1*.  
          - KS is the point on the frontier where (Payoff_A - 0.5) / (Payoff_B - 0.5) = 0.9 / 0.7 ≈ 1.286.  
          - Solve: Find point on line between (1.4, 0.6) & (0.8, 1.2) satisfying that ratio relative to d=(0.5,0.5). (Approx. (1.15, 0.9) - good enough for sketch).  
      - **Check Monotonicity:** After B’s windfall (u_B →1.5), recalc: u-d=(0.9,1.0), ratio=0.9:1.0. New KS point shifts → B gains, A may lose slightly. IM satisfied!  

  5.  **Slaying Misconceptions (Built into the Flow):**  
      - **"It's just the midpoint!"**  
          *Planted:* If you only show symmetric examples.  
          *Prevented:* Our example is asymmetric. KS (≈1.15, 0.9) is NOT the midpoint of the frontier segment (midpoint would be ≈(1.1, 0.9) – close but different). Highlight the ratio.  
      - **"It's egalitarian/equal gains!"**  
          *Planted:* Seeing the ray/ratio.  
          *Prevented:* Gains *relative to d* are proportional to *aspirations* (u - d), NOT equal. A gains ≈0.65, B ≈0.4 (using approx KS point) – proportional to 0.9 and 0.7. Stress: "Proportional to *claims*, not equal."  
      - **"Monotonicity is trivial!"**  
          *Planted:* If axioms feel like math tricks.  
          *Prevented:* By contrasting with **Nash Bargaining Solution (NBS)** *before* defining KS.  
              - *Secret Weapon:* Ask after introducing IM: "What if we used Nash? (Max (x_A-d_A)(x_B-d_B))". Calculate NBS for original problem: ≈(1.1, 0.85).  
              - *Then* apply B’s windfall: NBS *doesn't change much* because the *set expansion doesn't help the product maximizer directly*. NBS violates IM! B's better options don't help B in the NBS. This feels *unfair* in the context.  
      - **"This predicts real bargaining!"**  
          *Planted:* Any time you present a solution concept.  
          *Prevented:* **Explicitly flag upfront:** "KS (and Nash, etc.) are *normative* – they say what's *fair*, given principles. They are NOT descriptive models of psychology (e.g., Rubinstein alternating offers). We’re doing philosophy/economics of fairness today." Repeat when introducing axioms.  

  6.  **The Strategic Omission (Say This):**  
      *"One thing we're skipping is the full proof of KS's uniqueness (that PE, IR, SI, and IM *force* the KS solution). It's elegant but uses more convex analysis than we have time for. The key takeaway is that IM is the powerful axiom that pins it down uniquely when symmetry fails."*  

  7.  **The Closing Question (Diagnostic):**  
      *"Imagine the siblings discover the violin is damaged, reducing its value ONLY to A (if A keeps it, value drops to 1.0; B's max cash offer if A keeps it drops to 0.5). How does the KS solution shift? Does B get hurt by A's loss, benefit, or stay the same? Why?"*  
      - **Why it works:** Tests understanding of u changing (u_A↓), the ray shifting, and IM (A shouldn't benefit from their own loss, B shouldn't be punished). Correct answer: The ray flattens; KS point moves left/down; B likely gets slightly less too (as A's claim weakens proportionally), unless the frontier shape counteracts it. They must reference aspirations (u-d) changing.

  **Whiteboard Flow:**  
  1. Draw S, d, frontier, points for Inheritance.  
  2. Mark Utopia u (with "NOT FEASIBLE!").  
  3. Draw ray from d through u → KS point.  
  4. Modify for B's windfall → new u, new ray, new KS.  
  5. *Contrast:* Calculate/show NBS before/after windfall (little change).  
  6. *Close:* Sketch damaged violin scenario.

  This forces engagement with asymmetry, makes IM feel necessary and fair, and uses a single relatable example to build intuition and kill misconceptions in sequence. Good luck!
