prompt: |-
  I've just started as a grad on the cat risk desk at a reinsurer and I've realised I don't actually understand what my own firm thinks a probability is. Maybe you can help me work it out.

  Here's what happens. We price flood cover off a catastrophe model that spits out a "1-in-100 year" loss figure for each site, and everyone here talks about it as a fact about the world — the client is in a 1-in-100 zone, full stop. But the number comes from simulating tens of thousands of synthetic years in a computer, and there's alot of judgement in it, and it gets revised every time the vendor updates the model or we get another bad winter, and the climate is shifting the distribution underneath it anyway, so what exactly is it a frequency *of*? Then last month we wrote a big line on a risk with no loss history at all (I'd rather not say what), and the actuaries ran a "structured expert elicitation" — asked six people for their 10th, 50th and 90th percentiles, pooled them somehow — and that number went into the same spreadsheet, in the same cell type, and is now used for pricing and for the capital we report to the regulator, who wants us to hold enough to survive a 1-in-200 year loss. Meanwhile there's a standing instruction from the head of underwriting that we must never write "there is a 1 per cent chance of flooding at your site next year" in a client email, because "it either floods or it doesn't" — but we're allowed to say "1-in-100 year event" in the same email, and we do, constantly.

  So: what theory of probability does this practice actually presuppose? Reconstruct it for me. I want to know which bits are frequentist, which are subjectivist, which look like a propensity view (that there's a real chance out there in the world and the model is trying to read it off), and which bits don't commit us to anything in particular. Is the whole thing actually inconsistent, or is there a reading — calibrated credences, or "the model is just our best guess and the numbers are shorthand" — under which it hangs together? Is the "1-in-100" talk even intelligible if the underlying process isn't stationary? Does the reference class problem do real damage here, given we're applying a model fitted on one population to one particular site? And tell me what would have to change if we took either horn seriously: a thoroughgoing frequency view (only write business with a long, stable loss history?) or a thoroughgoing subjective view (whose credences? does the pooled elicitation number have any claim to being *the* number, and if not, what are we reporting to the regulator?). Don't give me a reading list — I just want the implicit theory laid out, with a verdict on which parts of it the practice genuinely needs and which parts it could drop without anything changing.
reasoning: |-
  Okay, let's dive into this grad's dilemma. They're on a cat risk desk at a reinsurer, confused about what their firm actually means by "probability." The core issue seems to be a clash between how different parts of the company treat probability—sometimes as objective facts, sometimes as expert guesses—while avoiding certain language in client communications. 

  First, I need to unpack the contradictions they've observed. The "1-in-100 year" loss figure is treated as a fixed property of a site, yet it's derived from synthetic simulations full of human judgment and gets updated frequently. Climate change makes stationarity questionable, but everyone acts like it's a stable fact. Then there's the expert elicitation for novel risks—subjective opinions pooled into a number that's treated identically to the model output. And the communication taboo: forbidding "1% chance" while embracing "1-in-100 year event" in the same breath. 

  The key philosophical tension is between frequentist interpretations (probability as long-run frequency) and subjectivist/Bayesian views (probability as quantified belief). The firm's practice seems to arbitrarily switch between these depending on context. For pricing and capital modeling, they need a single number regardless of its provenance, so they pragmatically mash together different epistemologies into what I'd call "institutionalized credence." 

  The reference class problem lurks here too—applying aggregate models to single sites assumes homogeneity that rarely exists. And non-stationarity due to climate change undermines the very concept of a "return period." Yet the business must go on, so they implicitly treat the model outputs as *actionable* probabilities while avoiding ontological commitments. 

  The head underwriter's language rule reveals a lot: rejecting "chance" while accepting "event" suggests they fear clients misinterpreting probabilities as predictions rather than risk metrics. It's a legal safeguard disguised as epistemology. 

  For consistency, the firm relies on calibration—treating all inputs as credences meant to align with long-run frequencies, even when those frequencies don't exist (like for novel risks). The regulator's role forces this calibration pretense, as capital requirements demand computable numbers. 

  If forced toward pure frequentism, they'd only cover risks with decades of stable data—impossible in catastrophe markets. Pure subjectivism would require transparent credence sources (whose beliefs? why pool them?) and kill the pretense of objectivity. Neither is feasible, so the current hybrid survives by necessity. 

  The unspoken truth: "1-in-100" is a conventionalized risk label, not a claim about reality. It works because everyone in the industry agrees to play by these rules. The parts they couldn't drop are the need for a computable metric (however derived) and the calibration anchor (even if aspirational). The rest is negotiable theater.
answer: |-
  Your firm's practice reveals a **pragmatic hybrid theory of probability**, blending frequentist, subjective, and propensity elements into a coherent operational framework—though not without philosophical tensions. Here's the implicit theory broken down:

  ### Core Tenets of the Implicit Theory
  1. **"Institutional Credence" as Actionable Probability**  
     Probability is treated as a **calibrated subjective credence** (Bayesian) that *aspires* to match long-run frequencies where possible. The number represents the firm's *best actionable estimate* of a loss frequency, incorporating all available evidence (models, experts, data). It’s not "pure" subjectivism or frequentism but a **decision-focused amalgam**.

  2. **The "1-in-X" Label as a Conventional Metric**  
     The "1-in-100 year" figure is **not a literal frequency claim** but a *standardized risk metric*:
     - It anchors pricing, capital, and communication.
     - Climate non-stationarity is acknowledged in practice (via model updates) but ignored in the *label* because the metric’s role is **comparative**, not ontological. Shifting distributions make the "year" part metaphorical, but the *ordering of risks* (1-in-100 < 1-in-50) remains useful.

  3. **Epistemic Hierarchy with a Pragmatic Core**  
     - **Cat models:** Treated as **frequency-proxies** (leaning propensity/frequentist). Synthetic years simulate a hypothetical stationary world, but updates admit it’s a "best guess" at latent risk.  
     - **Expert elicitation:** **Pooled subjectivism** (Bayesian). The pooling (e.g., linear opinion pool or Cooke’s method) creates an "institutional belief."  
     - **Regulatory capital:** The 1-in-200 figure is a **target for solvency**, not a truth. It’s the level the *firm commits to* surviving, based on its blended view.  

  ### Tensions and Resolutions
  - **Reference Class Problem:**  
    Applying a portfolio model to a single site assumes the site is **representative of the model’s class**. The firm implicitly treats the model as defining the reference class ("sites with similar characteristics"). Damage is mitigated by using location-specific covariates (elevation, flood defenses) to "individualize" the probability.  
    - *Why it works pragmatically:* For reinsurance, sites are never priced alone—they’re part of a portfolio where the law of large numbers applies. The model’s error at a site level averages out.

  - **Non-Stationarity:**  
    The "1-in-100" label remains intelligible as **today’s best estimate of current risk intensity**. Revisions (after disasters/model updates) reflect learning, not inconsistency. The metric is a **snapshot of present belief**.

  - **The Language Taboo:**  
    Banning "1% chance" while allowing "1-in-100 year event" reveals two key principles:  
    - **Legal/Client Management:** "It either floods or it doesn’t" avoids promising predictive accuracy.  
    - **Epistemic Humility:** The "event" framing emphasizes that the number describes a *loss magnitude*, not a precise probability. Clients (and courts) intuitively grasp "rare event" better than "probability."  

  ### What the Practice Needs vs. What It Can Drop
  | **Element**              | **Necessary?** | **Why**                                                                 |
  |--------------------------|----------------|-------------------------------------------------------------------------|
  | **Single-number metric** | Yes            | Pricing, capital, and regulation require a scalar input.                |
  | **Calibration aspiration**| Yes            | Models/experts must aim for long-run frequency alignment (for portfolio solvency). |
  | "1-in-X" **label**       | Yes            | Standardizes communication; embeds comparability.                       |
  | **Literal frequency**    | No             | The practice works without it (see expert elicitation for novel risks). |
  | **Stationarity**         | No             | Revisions handle non-stationarity; the metric is a living estimate.     |
  | **Ontological commitment**| No             | No need to assert if risk is "real" (propensity) or "belief" (Bayesian). |

  ### What Changes Under Pure Interpretations?
  - **Thoroughgoing Frequentism:**  
    - **Collapse.** Most cat risks lack stable loss histories. You’d only price flood cover for the Netherlands or earthquake for Japan—and even there, climate/urbanization violate stationarity. Capital models couldn’t handle novel risks (e.g., cyber).  
  - **Thoroughgoing Subjectivism:**  
    - **Transparency crisis.** Whose credence? The pooled expert number is arbitrary without calibration targets. Regulators would demand: "Why should *your* beliefs dictate capital?" Pricing becomes harder to justify to clients.  

  ### Verdict
  **The practice is consistent** under a **pragmatic decision-theoretic view**:  
  - Probability is **operationalized as a commitment device** for pricing and capital.  
  - It leans on **calibration** (credences should track frequencies where observable) but defaults to **structured judgment** when data is absent.  
  - The "1-in-X" metric is **robust to philosophical scrutiny** because it’s a **convention**, not a claim about the world. Climate change forces revisions? Update the model. No data? Elicit experts. The *process* of generating the number (model/expert → internal validation → use) matters more than its ontology.  

  **What’s fragile**: The illusion of objectivity. If models/systematically underpredict (e.g., due to climate shifts), or expert pooling is biased, the entire edifice fails. But this is a practical, not philosophical, risk. The theory’s genius is its agnosticism: it doesn’t care *what* probability "is," as long as the numbers enable profitable, solvent decision-making.
