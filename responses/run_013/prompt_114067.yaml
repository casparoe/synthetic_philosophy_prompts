prompt: |-
  Hey, so I'm not an academic or anything, this is just something I end up arguing about with my brother-in-law every Thanksgiving. He's always going on about meritocracy and people getting what they deserve, and lately I've noticed his actual verdicts on specific people don't obviously fit any one rule, and I want to pin him down. Can you act like someone who's spent a career thinking about desert and meritocracy, work through this carefully, and maybe start by brainstorming the candidate rules before you commit to one?

  Here's his track record, roughly, as best I can remember:

  - A heart surgeon he knows who trained for like 15 years, works insane hours, and has saved hundreds of people. My brother-in-law says he deserves to be rich, no two ways about it.
  - Our cousin, who does some boring admin job, works hard, doesn't hurt anybody, gets by. He says she deserves a decent life and honestly deserves more than she gets.
  - A guy who inherited a bunch of apartment buildings from his dad and just collects the rent. He says the guy doesn't *deserve* the money, but it's his, and nobody should take it off him. He's weirdly insistant on that distinction, deserving vs. entitled.
  - Somebody who won the lottery. Same thing — entitled to keep it, doesn't deserve it.
  - A friend of his who spent ten years building a small business from nothing, now employs about 20 people, barely breaks even. He says the guy deserves to do well and deserves way more than he's getting.
  - A rich kid he knows who never worked a day and contributes nothing. No desert at all, he says, none.

  Now he's got this other friend, call him Dave. Dave spent about 20 years of his life, blew up his marriage and his health, obsessively building this machine that as far as anyone can tell does nothing useful — nobody wants it, it helps nobody, and he's broke and alone. It cost him basically everything and produced nothing. My brother-in-law hasn't weighed in on Dave yet.

  So what's he going to say about Dave, and more importantly, what rule is he actually running? I can see at least a couple of rules that fit everything above and then split on Dave, so tell me which ones fit, what each one predicts for Dave, which you'd bet on and why, and what other case would seperate the rules once and for all. And since you can't just ask him, tell me how confident you actually are in all this and which part you're least sure about.
reasoning: |-
  Okay, let me start by really digging into this problem. User wants to understand their brother-in-law's concept of "desert" based on specific cases. The key is to reverse-engineer his underlying rule from his judgments. 

  First, I notice all his examples involve three elements: effort, social value, and outcome. But they don't all align perfectly. For instance: 

  The heart surgeon gets full desert - high effort AND high social value. Cousin gets partial desert - effort without proportional reward. The lottery winner has zero effort but gets entitlement. The inheritance case is trickiest - he separates legal entitlement from moral desert. 

  Hmm... the business owner case is interesting. High effort + social value (created jobs) but poor outcome. Brother-in-law says he "deserves more" - so outcome isn't necessary for desert? But then the surgeon's wealth is deserved because of outcome? Contradiction? 

  Wait no - let me reframe. Maybe desert is based on effort AND intention to create value. The business owner tried to create value, so deserves reward even if outcome failed. Whereas Dave... built a useless machine. Same effort, but no value intention? 

  But the cousin's admin job doesn't create dramatic value either. Yet she deserves decent life. So maybe any socially useful work qualifies? But Dave's machine has zero utility... 

  Aha! The key might be subjective vs objective value. Cousin's work is objectively useful (keeps systems running) while Dave's machine is subjectively meaningful only to him. Brother-in-law seems to require socially recognized utility. 

  Testing against other cases: 
  - Surgeon: clear utility 
  - Business owner: attempted utility 
  - Lottery: no utility 
  - Heir: no utility effort 
  All fit. 

  Now Dave prediction: no desert because no social value created. Brother-in-law might pity him but won't say he "deserves" reward. 

  What would really test this? Imagine someone who works equally hard on something harmful (like scamming). Rule would say negative desert! But brother-in-law hasn't provided such cases. 

  My confidence? 80% on the effort+utility rule. Least sure about the cousin case - is "admin work" considered sufficiently valuable? But he says she "deserves more," so probably yes. 

  Final thought: Brother-in-law's "entitled but not deserved" distinction protects property rights while acknowledging luck. Smart framing actually.
answer: |-
  Based on your brother-in-law's pattern of judgments, I can break this down systematically. After analyzing his cases, I see **two primary candidate rules** that fit all his existing verdicts but diverge on Dave. Let's dissect them:

  ---

  ### **Candidate Rule 1: Desert = Effort + Social Value Creation**  
  *(Effort must be directed toward socially recognized value)*  
  - **Fits all cases:**  
    - ✅ *Heart surgeon*: High effort + high social value → deserves wealth.  
    - ✅ *Cousin*: Moderate effort + modest social value (admin supports systems) → deserves decent life/more.  
    - ✅ *Inheritance/Lottery winners*: Zero effort + zero value creation → not deserved (only entitled).  
    - ✅ *Business owner*: High effort + value creation (jobs/community benefit) → deserves success.  
    - ✅ *Rich kid*: Zero effort + zero value → no desert.  
  - **Prediction for Dave:**  
    Dave expended extreme effort, but created **no social value** (machine is useless).  
    → *Verdict: **Does NOT deserve** reward/sympathy. "He wasted his life; it’s tragic but not meritorious."*  
  - **Why it fits:** Your brother-in-law consistently rewards *intentional value-creation*, not just toil. Effort alone (like Dave’s) isn’t enough; it must serve others.  

  ---

  ### **Candidate Rule 2: Desert = Sacrificial Effort + Good Intentions**  
  *(Effort with benevolent intent deserves reward, regardless of outcome)*  
  - **Fits all cases:**  
    - ✅ *Surgeon*: Sacrificed time/health + intent to save lives → deserves reward.  
    - ✅ *Cousin*: Steady effort + harmless intent → deserves decent life.  
    - ✅ *Inheritance/Lottery*: No sacrifice/intent → not deserved.  
    - ✅ *Business owner*: Sacrificed security + intent to build/employ → deserves more.  
    - ✅ *Rich kid*: No sacrifice → no desert.  
  - **Prediction for Dave:**  
    Dave sacrificed everything (marriage, health) with **sincere intent** (passion for creation).  
    → *Verdict: **Deserves compassion/support** (but not necessarily money). "He gave his all; society should help him recover."*  
  - **Why it fits:** He emphasizes *motivation* (e.g., business owner "tried" but got unlucky).  

  ---

  ### **Key Divergence on Dave**  
  - **Rule 1 (Social Value)**: Dave fails → **no desert**.  
  - **Rule 2 (Sacrifice + Intent)**: Dave qualifies → **some desert**.  

  ---

  ### **Which Rule Wins? Betting on Rule 1 (Effort + Social Value)**  
  **Confidence: 85%**. Here’s why:  
  1. **The "entitled vs. deserved" distinction** is pivotal. He separates *legal ownership* (entitlement) from *moral merit* (desert), which Rule 1 explains cleanly: desert requires value creation, not just luck/rights.  
  2. **He denies desert to the heir/lottery winner** despite zero effort *or* negative impact. If intent/sacrifice alone mattered (Rule 2), he might grant them *some* desert (e.g., "they meant well"), but he doesn’t.  
  3. **The cousin case**: Her admin work has **tangible, if mundane, social value** (keeps systems running). If desert required *exceptional* value, he’d dismiss her, but he doesn’t.  
  4. **The business owner**: He says the owner "deserves more than he’s getting" *despite failing*—not because of sacrifice alone, but because he **created jobs/value**.  

  **Weakness in Rule 2**: If sacrifice + intent were enough, he’d likely praise Dave’s "dedication." But I suspect he’ll see Dave’s work as **self-indulgent** (no value for others), negating desert.  

  ---

  ### **The Ultimate Test Case to Settle This**  
  Propose this scenario to your brother-in-law:  
  > *"Someone works 80-hour weeks for 10 years on a project they genuinely believe will cure disease... but it’s later proven to be pseudoscience with zero real-world benefit. Does this person *deserve* wealth/success?"*  

  - **Rule 1 (Social Value)**: → **NO desert** (actual value = 0).  
  - **Rule 2 (Sacrifice + Intent)**: → **YES desert** (sincere effort for noble cause).  

  His answer here would definitively reveal his rule. Based on his past judgments, I’d bet he rejects desert here, confirming **Rule 1**.  

  ---

  ### **Why I’m Least Confident**  
  The **business owner case** is the biggest ambiguity:  
  - He says the owner "deserves more," but is that due to *effort + intent* (Rule 2) or *value created* (Rule 1)? Since the business employs people (value), it fits Rule 1, but if the business had *no employees* (e.g., a failing solo venture), would he still say the owner "deserves" success? **That’s the unresolved edge.**  

  ---

  ### **Final Prediction for Dave**  
  **Brother-in-law’s verdict: "Dave doesn’t *deserve* anything. He chose a futile path—no one owes him for that. It’s sad, but not meritorious."**  
  He’ll likely stress that desert requires **contribution**, not just suffering.  

  Armed with this, you can corner him with the "failed disease cure" test case. Happy Thanksgiving 🦃.
