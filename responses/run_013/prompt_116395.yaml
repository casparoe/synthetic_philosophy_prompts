  We are creating a quiz to distinguish between different moral views on lying vs. misleading. The positions to distinguish are:

  1. **Intent Matters**: Lying and misleading are morally equivalent when the intent to deceive is the same.
  2. **Lying is Worse**: Lying breaks the trust in language, while misleading at least uses true statements.
  3. **Misleading is Worse (or as bad)**: Misleading makes the victim co-author their deception and is harder to catch.
  4. **Consequences Matter**: Neither is wrong in itself; it depends on the harm caused.
  5. **Obligation Matters**: The morality depends on whether you owed the person the truth (role-based).
  6. **No Difference**: "Misleading" is just lying with extra steps; both are equally bad.
  7. **Misleading Required (or lying required)**: Sometimes misleading is necessary (e.g., for politeness) but lying isn't, or vice versa.

  We'll create 12 scenarios with multiple-choice options (A, B, C). Each option will correspond to a judgment that aligns with one or more of the above positions. Then we'll have a scoring key that maps patterns to the positions.

  Let's design the scenarios:

  1. **The "I never said that" scenario**:  
     Alex asks Bailey if they ate the last cookie. Bailey says, "I didn't eat it today," which is true (they ate it yesterday).  
     Question: Is Bailey's behavior acceptable?  
     A. Yes, because Bailey told the truth.  
     B. No, because Bailey intended to deceive.  
     C. It depends on why Bailey didn't want to admit eating the cookie.

  2. **Ad/Label Literally True but Misleading**:  
     A juice drink is labeled "Made with Real Fruit!" but it contains only 5% fruit juice and 95% sugar water.  
     Question: Is the labeling ethical?  
     A. Yes, because it's technically true.  
     B. No, because it's designed to mislead.  
     C. It depends on whether the company had an obligation to be clear (e.g., food standards).

  3. **Friend's Relationship Status**:  
     Taylor asks Morgan: "Are you seeing anyone?" Morgan, who is casually dating but not in a serious relationship, says "No."  
     Question: Is Morgan's statement acceptable?  
     A. Yes, because Morgan isn't "seeing anyone" in the way they interpret it.  
     B. No, because Morgan knew what Taylor meant and misled them.  
     C. It depends on whether Taylor had a right to know.

  4. **Softening Bad News (Doctor/Boss)**:  
     A doctor tells a patient: "Your test results show some irregularities, but we'll run more tests. Many people live for years with this condition." The patient has a terminal illness.  
     Question: Is the doctor's statement acceptable?  
     A. Yes, because the doctor is being compassionate and not lying.  
     B. No, because the doctor is misleading the patient about the severity.  
     C. It depends on the patient's wishes and the doctor's duty.

  5. **Dodging a Direct Question**:  
     A politician is asked: "Did you accept money from Corporation X?" They respond: "I have always followed campaign finance laws." (They did accept the money, but it was legal.)  
     Question: Is the politician's response acceptable?  
     A. Yes, because they told the truth about following the law.  
     B. No, because they avoided the direct question to mislead.  
     C. It depends on the context and the public's right to know.

  6. **Protecting Someone**:  
     Casey is hiding a friend from an abusive partner. The partner asks: "Is Sam here?" Casey says: "Sam isn't here right now." (Sam is in the next room, but Casey means "here" as in "in this exact spot".)  
     Question: Is Casey's behavior acceptable?  
     A. Yes, because Casey is protecting Sam and didn't lie.  
     B. No, because Casey is misleading the partner.  
     C. It depends on the danger to Sam.

  7. **The "You never asked" scenario**:  
     A car salesman tells a customer: "This car has never been in an accident." The customer doesn't ask about flood damage, and the car was in a flood.  
     Question: Is the salesman's behavior acceptable?  
     A. Yes, because the customer didn't ask about floods.  
     B. No, because the salesman knew the customer would assume no flood damage.  
     C. It depends on the legal disclosure requirements.

  8. **White Lie vs. Misleading Truth**:  
     A child asks: "Did you eat the last cookie?" The parent, who did, says: "I didn't eat it today" (true, they ate it yesterday).  
     Question: Is the parent's response acceptable?  
     A. Yes, because it's true and avoids upsetting the child.  
     B. No, because it's deceptive.  
     C. It depends on the child's age and the parent's reasons.

  9. **Obligation to Tell the Whole Truth**:  
     A spouse asks: "Did you have lunch with your ex?" The other, who did, says: "I had lunch with a friend."  
     Question: Is this acceptable?  
     A. Yes, because it's true and the spouse didn't specify which friend.  
     B. No, because it's a misleading omission.  
     C. It depends on the context of the marriage and past agreements.

  10. **Necessary Deception for Safety**:  
      During a war, a resistance fighter is asked by enemy soldiers: "Are you hiding any Jews?" The fighter says: "There are no Jews in this house" (meaning: in this house at this exact moment, because they are in the basement).  
      Question: Is the fighter's statement acceptable?  
      A. Yes, because it's true and necessary to save lives.  
      B. No, because it's deceptive.  
      C. It depends on the circumstances and the fighter's duty.

  11. **Misleading by True Implication**:  
      An employee is late because they overslept. The boss asks: "Were you stuck in traffic?" The employee says: "The traffic was terrible this morning" (which is true, but not the reason they were late).  
      Question: Is the employee's response acceptable?  
      A. Yes, because they said something true.  
      B. No, because they intended to mislead about the reason.  
      C. It depends on the boss's management style and the employee's record.

  12. **Polite Excuse**:  
      Jordan declines an invitation by saying: "I have other plans" (which is true: the plan is to stay home and rest).  
      Question: Is this acceptable?  
      A. Yes, because it's true and polite.  
      B. No, because it's misleading (it implies social plans).  
