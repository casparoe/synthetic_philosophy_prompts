prompt: |-
  I am a novelist, and I am writing a book set in an invented country — call it the Republic of Vessary — that has just emerged from a long authoritarian period. My protagonist is a young magistrate on a newly constituted bench. The old regime's statutes remain on the books, and the new constitution provides that prior law continues in force until amended or repealed. Nearly every chapter turns on a ruling she must make, and I need those rulings to be consistent with one another and to read as the output of a legal system rather than as the author's convenience. I have been reading about the long dispute between Hart and Fuller over whether a morally iniquitous rule can count as law, and I want to convert that dispute into something my magistrate — who has no training in jurisprudence, works under time pressure, and must produce a short written order that a military overseer will countersign — could actually run.

  Please give me a decision procedure, not an essay. I want the questions she asks in order, what counts as a sufficient answer to each, the point at which the procedure stops with a finding that the rule is not law at all, the point at which it stops with a finding that it is law and must be applied however distasteful, and the points at which it must hand the matter to someone else — the legislature, the appellate bench, the overseer — because the question is political rather than legal. It should be usable in an afternoon by someone who has never heard of either theorist, and it should be explicit about which distinctions from the debate had to survive the simplification and which I can let go. Tell me where the procedure will misfire and what it simply cannot do; I would rather know its edges than have it pretend to be complete.

  Then run it, step by step, on three cases from the book. First, a man prosecuted under an old decree that criminalizes the publication of writing liable to spread despondency among the population; he has published a poem. Second, a former informer who denounced neighbours under a statute that was, by every procedural test, validly enacted at the time, and who now pleads that his conduct was lawful when he did it. Third, a detention order issued under a secret directive that was never published and that contradicts a standing statute on the same subject. One of these should come out in a way I will not like — I am fond of the poet, and I would prefer the law to release him. Do not bend the procedure to spare him; if it convicts, let it convict, and show me exactly which step does it.

  Finally, tell me where the procedure's output is a judgment call wearing the costume of a rule. Those are the places where my characters can disagree in good faith, and I need to know where they are before I write the scene.
reasoning: |-
  Okay, the user is a novelist working on a book set in the fictional Republic of Vessary. They've created a young magistrate character who has to make rulings based on old authoritarian laws under a new constitution. The user wants a practical decision procedure inspired by the Hart-Fuller debate but simplified enough for a non-legal expert to use quickly. 

  Hmm, the core challenge here is translating dense jurisprudential theory into a tool for fiction. The user needs consistency in rulings to make their legal system feel real, not just convenient for plot. They're clearly deep in research—mentioning Hart and Fuller by name—but wisely recognize their magistrate wouldn't cite theorists. 

  Breaking this down: First, the procedure must be actionable. No philosophical essays; just step-by-step questions with clear exit points. Second, it needs "failure modes"—where it hands off to other authorities or admits defeat. Third, it must flag where judgments are subjective, since those become character conflict moments. 

  Ah, and the three test cases are perfect stress tests. The poet case will hurt—the user admits fondness for him—but that's good. If the procedure convicts him fairly, it proves its integrity. The informer and secret directive cases cover other key dilemmas: retroactivity and validity versus morality. 

  Noticing subtle needs beneath the ask: The user wants legal realism (system output, not authorial fiat) but also human drama. The "judgment call in rule's clothing" request is gold—that's where magistrates can feud honorably. Also, they crave limitations upfront; smart writers hate deus ex machina tools. 

  Biggest design challenges: 
  - Simplifying Hart/Fuller without gutting their clash. Hart's "validity via procedure" and Fuller's "internal morality" must survive. 
  - Balancing speed (afternoon decision) with depth. Hence the "stop signs" at legislative/political questions. 
  - Making subjectivity explicit. Steps 4 and 5 will be battlegrounds. 

  For the poet case... yeah, this’ll sting. The despondency law is procedurally sound (Step 1-3 clear), and "absurdity" escape hatch (Step 4) won’t save him—poems aren’t like forcing left-handedness. Step 5 is his last hope, but "contradicts human dignity" is a high bar. If the magistrate squints, maybe? But the procedure rightly convicts. User’s fondness makes this better drama. 

  Informer case is easier: retroactive punishment fails Step 4 (absurd) and Step 5 (dignity violation). Secret directive fails at Step 2 (no publication)—clean win. 

  Subjectivity hotspots: 
  - Step 4's "absurdity" is a trapdoor. One magistrate’s absurdity is another’s tradition. 
  - Step 5's "human dignity" is beautifully thorny. Perfect for colleague rivalries. 
  - "Political question" calls in Step 6 depend on local power dynamics—great for military overseer tensions. 

  Final note: User’s "edges over completeness" demand is refreshing. Will explicitly warn about cultural blind spots (e.g., "dignity" varies) and unspoken precedents. Also—military overseer’s presence implies procedure isn’t the only power here. Realpolitik may override. That’s not a bug; it’s plot fuel.
answer: |-
  Here is a decision procedure for Magistrate Anya Rostova, designed for speed, consistency, and recognizing the limits of her authority under Vessary's transition. It simplifies Hart/Fuller to core operational questions, discarding metaphysical debates about "law's nature" in favor of workable tests within her mandate.

  **Magistrate Rostova's Decision Procedure: "The Six Gates"**

  1.  **Source & Form:**
      *   *Question:* Was the rule issued by a body with *formal authority* under the *old regime's own constitutional procedures* (as they existed at the time of enactment)?
      *   *Sufficient Answer:* Yes (if documented decree, statute, published regulation from recognized authority). No (if mob decree, personal whim, unsigned note).
      *   *Stop:* If **NO** -> Rule is **NOT LAW**. Disregard it. Proceed based on other valid law or dismiss.
      *   *Handoff:* If source/validity is genuinely ambiguous (e.g., disputed succession, competing decrees) -> **Hand to Appellate Bench** for historical/doctrinal clarification.

  2.  **Publication:**
      *   *Question:* Was the rule *published* (Gazette, public notice, widely available code) in a way that subjects *could reasonably have known* of its existence and content *before* the relevant conduct?
      *   *Sufficient Answer:* Yes (Gazette publication, posted notices). No (secret directive, oral order only, locked in a drawer).
      *   *Stop:* If **NO** -> Rule is **NOT ENFORCEABLE** against the individual for that conduct. Disregard it *for this specific application*.
      *   *Handoff:* If publication method is novel/contested (e.g., only on a regime intranet) -> **Hand to Appellate Bench** for precedent on sufficiency.

  3.  **Clarity (Minimal):**
      *   *Question:* Can the rule's core command/prohibition and the *type* of conduct it targets be understood *without resorting to extreme mental gymnastics or secret knowledge*? (Does it pass the "Grunts in the Barracks" test? Could a reasonably alert citizen grasp the gist?)
      *   *Sufficient Answer:* Yes (e.g., "No public gatherings >5 people", "Tax rate 10%"). No (e.g., "No acts contrary to the People's Spirit", "Taxes as the Minister deems optimal").
      *   *Stop:* If **NO** -> Rule is **VOID FOR VAGUENESS**. Disregard it. Dismiss charge or deny application.
      *   *Handoff:* If clarity is borderline (common terms with disputed meanings) -> Apply a *narrow interpretation favoring the accused/individual* (Rule of Lenity). **Proceed to Gate 4.**

  4.  **Internal Absurdity/Impossibility:**
      *   *Question:* Does applying the rule *as written* in *this specific case* lead to a result so *irrational, self-contradictory, or impossible* that it *defeats any conceivable purpose* the rule could have had *even for the old regime*? (Forget morality, think function: Does it demand squaring the circle? Punish breathing?)
      *   *Sufficient Answer:* Yes (e.g., law requiring left-handedness but banning left hands; law demanding payment in a nonexistent currency). No (e.g., harsh but functional punishment; broad but comprehensible restriction).
      *   *Stop:* If **YES** -> Rule is **NOT APPLICABLE** *in this specific instance*. Dismiss charge or deny application *for this case only*. (Rule survives for other applications).
      *   *Handoff:* If absurdity stems from changed circumstances (old tech requirement) -> **Hand to Legislature** for repeal/update. Magistrate applies rule *as written* unless absurdity is immediate and undeniable.

  5.  **Core Incompatibility (Human Dignity Threshold):**
      *   *Question:* Does applying the rule *in this case* *directly and severely* violate a *fundamental principle of human dignity* so essential that *no legal system claiming legitimacy* could tolerate it? (Focus: Extreme, direct harm - torture, slavery, retroactive death penalty, denial of existence).
      *   *Sufficient Answer:* Yes (e.g., order to torture a child based on parent's crime; law declaring a race subhuman). No (e.g., harsh imprisonment; suppression of speech; unfair property seizure; *past* acts benefiting an unjust system).
      *   *Stop:* If **YES** -> Rule is **NOT LAW** *for any purpose* in Vessary. Disregard it completely. Dismiss charge or deny application.
      *   *Handoff:* If the violation is severe but indirect, systemic, or controversial (e.g., indefinite detention without trial *if* procedural safeguards existed on paper; severe punishment for political dissent) -> **APPLY THE RULE** (Gate 6) *but* flag it urgently for the **Legislature** or **Overseer** as requiring immediate political review/repeal. *Magistrate's duty is to apply valid law.*

  6.  **Application:**
      *   *Question:* Having passed Gates 1-5, does the *proven conduct* of the individual *fall squarely within* the rule's *reasonably clear* command/prohibition?
      *   *Sufficient Answer:* Yes/No based on evidence and standard interpretation.
      *   *Action:* **APPLY THE RULE** (Convict/Acquit, Grant/Deny Order).
      *   *Handoff:* If interpretation of *conduct* vs. *rule* is novel or complex -> **Hand to Appellate Bench**. If application has major political/systemic consequences beyond the case -> Note for **Overseer/Legislature** *after* ruling based on law.

  **Surviving Distinctions:** Source Validity (Hart), Publication/Clarity (Fuller's Internal Morality - Procedural), Core Incompatibility (Fuller's Radbruch-inspired extreme injustice). Void for Vagueness (shared concern).
  **Discarded Distinctions:** General debates on "law vs. morality," the precise content of morality, the "pedigree" vs. "purpose" of law beyond basic functionality tests, Fuller's full 8 principles (simplified to core procedural ones).

  **Misfires & Limits:**
  *   **Cultural Blindness:** "Human Dignity" (Gate 5) is culturally contingent. What seems core to Anya might not be universal. The procedure assumes *her* understanding of Vessary's emerging consensus.
  *   **Systemic Injustice:** Handles *extreme, direct* evil well. Misfires on pervasive, lower-level systemic injustice woven into many laws (e.g., discriminatory property laws). Gate 5 often says "Apply" here, passing the political hot potato.
  *   **"Purpose" vs. "Text":** Leans towards textual application (Gate 6) once validity is confirmed. Might misapply laws whose *old regime purpose* is utterly defunct but text remains functional in a new, unintended way.
  *   **The "Grey Zone":** Many cases sit between "absurd" (Gate 4) and "merely harsh/unjust." Procedure forces a binary choice: Apply or (rarely) find Void for Vagueness.
  *   **Silent Precedent:** Doesn't account for unwritten judicial practices or interpretations from the old regime unless formally published.
  *   **Overseer Influence:** Doesn't factor in the military countersignature. Anya might *legally* rule one way, but the Overseer might refuse, creating a *political* crisis.

  **Running the Cases:**

  **Case 1: The Poet (Despondency Decree)**
  1.  **Source & Form:** Yes. Old Ministry of Information Decree, procedurally valid then.
  2.  **Publication:** Yes. Published in the State Gazette.
  3.  **Clarity (Minimal):** **Borderline, but probably YES.** "Writing liable to spread despondency" is vague, but targets a *type* of effect (lowering morale) from a *type* of act (publishing). Citizen knows publishing gloomy things *might* be risky. Proceed (Rule of Lenity suggests narrow interpretation).
  4.  **Internal Absurdity:** **NO.** Suppressing "despondent" writing is perfectly rational for an authoritarian regime wanting control. Harsh, but functional.
  5.  **Core Incompatibility:** **NO.** Suppressing speech, even artistic/political, is a common tool of oppression. While unjust and stifling, it doesn't reach the extreme, direct violation of core human dignity like torture or denying personhood. **APPLY THE RULE** (Gate 6).
  6.  **Application:** Did the poem spread despondency? Evidence needed. If yes, **CONVICT.** If arguable, perhaps acquit based on Rule of Lenity or insufficient evidence (Gate 6 judgment). *This is where Anya's heartbreak happens. The procedure forces her to convict if the poem demonstrably caused widespread gloom (e.g., sparked protests of despair).* **Handoff Note:** Flag for **Legislature** as unjust law needing urgent repeal.

  **Case 2: The Former Informer (Lawful Conduct Then)**
  1.  **Source & Form:** Yes. Statute valid under old procedures.
  2.  **Publication:** Yes. Published.
  3.  **Clarity:** Yes. Statute defined informable offenses (e.g., "anti-state speech," "hoarding").
  4.  **Internal Absurdity:** **YES (in this application).** Punishing someone *now* for an act that was *not only permitted but encouraged* by valid law *then* is fundamentally irrational. It destroys the predictability law needs to function, even badly. It's punishing someone for doing what the state demanded. **Rule NOT APPLICABLE in this instance.** Dismiss charge.
  5.  *(Gate 5 not reached)*. **Handoff Note:** If the *statute authorizing denunciations* itself is challenged, Anya might need to assess *it* under Gates 1-5. But the retroactive *punishment* fails at Gate 4.

  **Case 3: Secret Detention Directive (Contradicts Statute)**
  1.  **Source & Form:** *Ambiguous.* It claims authority (e.g., signed by Security Chief), but old regime procedures might require publication for validity? **Hand to Appellate Bench** (Gate 1 Handoff). *But if Anya must decide now...* Assume it's from a high official.
  2.  **Publication:** **NO.** Secret directive, never published. **NOT ENFORCEABLE** against this detainee. Disregard it. Detention must rely on the *published statute*.
  3.  **Application (to Published Statute):** Does the published statute authorize *this* detention? If the directive contradicts the statute, and the statute controls, then likely **RELEASE** the detainee (unless statute alone justifies it). **Handoff Note:** Flag secret directive existence to **Overseer** and **Legislature** as a systemic abuse requiring investigation and prohibition.

  **Judgment Calls in Rule's Clothing:**

  1.  **Gate 3 - Clarity (Minimal):** What counts as "extreme mental gymnastics"? "Reasonably alert citizen"? This is highly subjective. Anya might see clear coercion where a colleague sees acceptable state guidance. *Major conflict point.*
  2.  **Gate 4 - Internal Absurdity/Impossibility:** Defining "defeats any conceivable purpose" is fraught. Anya might find punishing the informer absurd; a hardliner might see it as vital new purpose (justice). "Conceivable" is a wide net. *Key battleground.*
  3.  **Gate 5 - Core Incompatibility:** The "Human Dignity Threshold" is the most profound judgment call. Does suppressing hope via poetry cross it? Anya might agonize that it does, while her overseer scoffs. Does forced labor? Does denying a fair trial? The line between "severe systemic injustice" (Apply) and "core violation" (Disregard) is inherently controversial. *The ultimate crucible for Anya's character.*
  4.  **Gate 6 - Application (Conduct vs. Rule):** Interpreting whether specific facts fit a rule (even a clear one) always involves judgment. Did the poem *cause* despondency, or merely express it? How much proof is needed? *Standard legal disagreement, but fuels courtroom drama.*
  5.  **"Political Question" Determination (Various Handoffs):** Deciding if something is too big, systemic, or precedent-setting for a magistrate is inherently political/judicial philosophy. Anya might try to fix a systemic flaw via Gate 5; a cautious colleague would hand it off at Gate 1 or 6.

  **For Your Poet:** The procedure convicts him at **Gate 5**. The harsh truth is that suppressing "despondent" speech, however valuable the poem, is a hallmark of authoritarian regimes and doesn't (on its own) cross the extreme threshold of *Core Incompatibility* like torture or retroactive punishment does. Gate 4 (*Absurdity*) doesn't save him because the rule functioned as intended for the old regime. His fate hinges on Anya's interpretation of **Gate 5** – the most subjective and agonizing step. If she cannot, in good conscience, see it as anything less than a fundamental attack on the human spirit necessary for a legitimate state, she *might* find Core Incompatibility. But the procedure, as designed, points strongly towards Application (conviction) under Gate 6, requiring a political (Legislature) solution, not a judicial override. This is where your character's internal conflict and potential defiance (or resignation) will be most powerful.
