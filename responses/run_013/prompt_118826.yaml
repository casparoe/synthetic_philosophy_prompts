  The user wants me to identify key fault lines in the room and prepare for tough objections. The audience includes heritage society members who see "collapse" as normal terminology, an anthropologist sympathetic to resilience theories but who might push too far, a classicist who likely sees Bronze Age collapse as catastrophic, and locals worried about their own community's future after recent wildfires.

  Key pain points I should address:
  - The term "collapse" itself - amateurs use it casually while academics have nuanced debates
  - Differing views on catastrophe: classicist vs resilience anthropologist
