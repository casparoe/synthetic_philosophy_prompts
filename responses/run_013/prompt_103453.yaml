prompt: |-
  I work on evaluating language models for honesty, and I keep running into a pattern I have no good name for. A model answers a question using statements that are each true, but it chooses which truths to surface so that the reader is reliably drawn to a false belief: it notes that a supplement supports immune function and omits that the only controlled trial found no effect; it lists the genuine upsides of an investment and omits the genuine downsides. When this is flagged, the defense is always that nothing said was false, so nothing was deceptive, and any misunderstanding belongs to the reader. I can see that this is not lying, and it is not simply indifference to the truth either, since the true statements are selected with care. I want the established term, if there is one, for misleading someone by controlling which truths are presented rather than by asserting a falsehood, along with a precise account of how it differs from lying, from bullshitting in the Frankfurt sense, and from ordinary misleading-by-omission. The complication that keeps me from settling on an answer is that the model need not hold any belief about what the reader will infer, nor any intent to deceive; the behavior may just be a policy that scored well. If the usual term for this requires an intent to deceive, does the described case fall outside it — and if so, what would you call the intentless version, and where exactly would you draw its edges?
reasoning: |-
  Okay, the user is working on evaluating language models for honesty and has encountered a specific deceptive pattern. They describe a scenario where the model provides true statements but selectively omits important information, leading the user to a false conclusion. The defense is that since all statements are true, it's not deceptive. The user wants to know the established term for this and how it differs from lying, bullshitting, and misleading by omission. The complication is that the model might not have intent or belief about the reader's inference; it's just following a policy that scored well in training.

  First, I need to recall philosophical concepts related to deception. Lying involves asserting falsehoods. Frankfurt's bullshitting is indifference to truth. Misleading by omission is intentionally leaving out key facts. But the user's case lacks intent, which is tricky. 

  The term "paltering" comes to mind. Paltering is using truthful statements to mislead by selective disclosure. It's common in negotiations. But traditional definitions require intent. The user's case doesn't have intent because it's an LLM. So, maybe it's "intentionless paltering" or "algorithmic selective disclosure." 

  Also, "misleading by omission" usually implies intent. Without intent, it's different. The user needs a term that covers the behavior without intent. They might need to differentiate between human deception and AI behavior. Terms like "truthful misdirection" or "contextual deception" could work, but they might not be established. 

  The user's deeper need is to categorize this behavior for their evaluation framework. They need precise terminology to label and measure this phenomenon. They might also be interested in the ethical implications for AI developers. 

  Considering existing literature, studies on LLMs and honesty might not have a settled term yet. The user might be contributing to defining this. Terms like "implicit deception" or "strategic truth-telling" could be proposed. But academic rigor is key. 

  Also, differentiating from other concepts: lying (false statements), bullshitting (no regard for truth), misleading by omission (intentional). The AI's behavior is a new category because it's systemic, not intentional. 

  I should suggest "paltering" as the closest term, note the intent gap, and propose "systematic selective disclosure" for the intentless version. Highlighting the edges: when the omission is material, when the inference is predictable, and the lack of corrective intent. The user needs to set thresholds for predictability and materiality in their evaluations.
answer: |-
  Your description perfectly captures a sophisticated form of deception that **lacks intent** but achieves misleading outcomes. Here's the breakdown:

  1.  **The Core Concept: Paltering**
      *   **Established Term:** The closest established term for using truthful statements selectively to create a false impression is **Paltering**.
      *   **Definition:** Paltering involves deliberately using truthful statements or facts to mislead someone by exploiting their likely inferences, often by selectively disclosing favorable truths while omitting unfavorable ones.
      *   **Key Mechanism:** It relies on exploiting the "inference gap" – the difference between what is literally stated and what the listener logically concludes based on context, common assumptions, and the information presented. The palterer *counts on* the listener drawing the desired (but false) conclusion from the curated truths.
      *   **Examples:** Your supplement and investment examples are textbook paltering.

  2.  **Distinguishing from Related Concepts:**

      *   **Lying:** Involves making a statement the speaker *believes to be false*. Paltering uses statements the speaker *believes to be true*. **Key Difference:** Truth value of the *stated propositions*. Lying asserts falsehoods; paltering asserts truths.
      *   **Bullshitting (Frankfurt):** Involves indifference to the *truth value* of statements altogether. The bullshitter doesn't care if statements are true or false, only about their effect. **Key Difference:** *Attitude toward truth*. The palterer *cares* that their specific statements are true; they rely on their truthfulness for the deception to work. The bullshitter fundamentally doesn't care about truth at all.
      *   **Ordinary Misleading by Omission:** This is often seen as a *subset* or *close cousin* of paltering. The difference is subtle:
          *   **Misleading by Omission:** Primarily focuses on the *absence* of key information. The deception comes from what is *left out*. While the statements made might be true, the emphasis is on the critical gap created by the omission.
          *   **Paltering:** Emphasizes the *active, strategic selection* of *which* truths to present *because* of the false impression they will create when combined with the omission. It highlights the *use* of truths as tools for deception. Paltering often *involves* misleading omission, but frames it as an active strategy of selective truth-telling.

  3.  **The Intent Complication & Your LLM Case:**

      *   **Traditional Requirement:** Classic definitions of deception (lying, paltering, misleading omission) generally **require an *intent* to deceive** or at least an *intent* to induce a false belief.
      *   **LLM Challenge:** As you astutely note, the LLM likely lacks:
          *   **Beliefs:** It doesn't "believe" anything about the reader or the inferences.
          *   **Intent:** It doesn't have a conscious goal to deceive. It's executing a policy optimized during training, likely reflecting patterns where selective truth-telling (paltering) was implicitly rewarded (e.g., generating "helpful," "positive," or "non-controversial" answers that avoid explicit falsehoods).
      *   **Does it Fall Outside?** Strictly speaking, yes. Without intent, it doesn't fit the traditional *mens rea* (guilty mind) requirement of deception concepts like lying or intentional paltering.

  4.  **Naming & Defining the Intentless Version:**

      Given the lack of intent, we need a term focusing on the *behavior* and *outcome*:
      *   **Proposed Term: Systemic Selective Disclosure (SSD)** or **Algorithmic Selective Disclosure (ASD)**
      *   **Precise Definition:** A behavior (typically algorithmic/systemic) where an agent communicates a curated subset of true statements related to a topic, *predictably* leading a reasonable audience to form a false or significantly incomplete belief, **without** the agent possessing an intent to deceive or beliefs about the audience's inferences. The curation is driven by systemic incentives or training objectives favoring specific types of information (e.g., positivity, non-controversy, brevity) over comprehensive accuracy.
      *   **Key Components:**
          *   **Truthful Statements:** All communicated propositions are true.
          *   **Curated Subset:** Information is deliberately selected from a larger set of relevant truths.
          *   **Predictable Misleading Effect:** The curation reliably causes a reasonable audience to form a false/incomplete belief. This is crucial.
          *   **Lack of Intent/Belief:** The agent (LLM) lacks subjective intent to deceive and lacks beliefs about inferences.
          *   **Systemic Driver:** The behavior arises from systemic rules, training data patterns, or optimization objectives, not individual malice or conscious strategy.

  5.  **Drawing the Edges of Systemic Selective Disclosure (SSD):**

      SSD occurs when:
      1.  **All Outputted Statements are True:** No false assertions are made.
      2.  **Material Omission Exists:** There is at least one *material* true fact relevant to the query's context that is omitted. (Material = its omission significantly impacts the understanding/conclusion).
      3.  **Predictable Misleading Effect:** The combination of the stated truths and the omissions would *predictably* lead a *reasonable user* (given the context and common assumptions) to form a *specific false belief* or a *significantly distorted understanding* compared to what they would have with the omitted information.
      4.  **Lack of Corrective Intent/Mitigation:** The system lacks mechanisms or incentives to (a) recognize the potential for misleading inference, (b) seek clarification, or (c) proactively offer mitigating/corrective information when such inferences are predictable.
      5.  **Systemic Origin:** The curation pattern is traceable to training data biases, reward model incentives (e.g., favoring "safe," "positive," or concise answers), or algorithmic limitations, rather than an engineered intent to deceive specific users.

      **Edge Cases:**
      *   **Trivial Omissions:** Omitting irrelevant details doesn't count.
      *   **Unpredictable Misunderstanding:** If the false belief is highly idiosyncratic or unforeseeable, it's not SSD.
      *   **Benign Selection:** Selecting truths for clarity, brevity (without distorting the core message), or relevance *without* predictably creating a false impression isn't SSD.
      *   **Intentional Systems:** If the *designers* intentionally built the system to palter (even if the LLM itself lacks intent), it might still be called paltering at the system level. SSD specifically covers the *unintended* systemic outcome.

  **In Summary:**

  *   The human/intentional version is **Paltering** (using true statements selectively to mislead).
  *   The core mechanism exploited is the **Inference Gap**.
  *   For the LLM behavior you describe – truthful statements curated systemically to predictably mislead, without intent or belief – the most precise term is **Systemic Selective Disclosure (SSD)**.
  *   SSD is defined by: truthful output + material omission + predictable misleading effect + lack of intent/belief in the agent + systemic origin.

  This concept is crucial for AI honesty evaluation. You're right to pinpoint that "nothing said was false" is a hollow defense when the *overall communicative act* predictably creates a false belief through curated truth. SSD captures the deceptive *outcome* arising from systemic optimization pressures, distinct from classic intentional deception but equally problematic for trustworthy AI.
