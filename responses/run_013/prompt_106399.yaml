answer: |-
  This is a brilliant pivot – *Memento* is indeed a devastating, almost surgical, exploration of precedent autonomy stripped of sentimentality and medical context. It doesn't just illustrate the debate; it *interrogates* its foundational assumptions in ways clinical cases often obscure. Let's break it down:

  **1. Undermining the Justifications for Precedent Autonomy (Dworkin's "Critical Interests"):**
  *   **The Unreliable Architect:** You hit the nail on the head. Leonard's "earlier self" (the one planning the system) is profoundly unreliable. He's not the wise, clear-eyed planner Dworkin imagines. He's:
      *   **The Claims Denier:** His profession trained him in suspicion and finding reasons *not* to believe incapacity claims (Sammy Jankis). This immediately casts doubt on his own system's integrity – is he designing it to genuinely help his future self, or to enable a vendetta he *knows* might be flawed?
      *   **The Self-Deceiver:** Teddy's revelation about Sammy Jankis is crucial. The "earlier self" crafting the directive (the post-accident Leonard setting up the system) is actively constructing a *false narrative* (Sammy) to avoid confronting his own condition and the potential futility of his quest. The directive isn't based on a rational assessment of his "critical interests"; it's built on a lie he tells himself to *maintain* a sense of purpose.
      *   **The Manipulator:** Actively planting the false lead (the license plate tattoo) *knowing* it will send his future self after the wrong John G. This isn't respecting future Leonard's experiential interests or critical interests; it's *sacrificing* them to sustain the *feeling* of purpose *now*. He privileges the *immediate* experiential interest (having a mission) of his current planning self over the critical interests (truth, closure, safety) of his future selves.
  *   **The "Better Informed" Myth:** Leonard is demonstrably *not* better informed about his own good. He's trapped in a cycle of vengeance fueled by grief and denial, manipulating his own future ignorance. The film argues that a directive system built by a traumatized, self-deceptive individual prioritizing a single, destructive goal over holistic well-being is inherently suspect.

  **2. The Surrogate-Interpreter Problem as Inherent, Not Corruptive:**
  *   **Hostile Interdependence:** Teddy and Natalie aren't external corruptions; they are *necessary* components of Leonard's directive system. He *cannot* function without others interpreting his notes and tattoos for him. The system *requires* external actors.
  *   **Power Dynamics:** The film explicitly shows this interpreter role grants immense power. Teddy manipulates Leonard for his own ends (cleaning up drug dealers, later for amusement/control). Natalie uses him for revenge against Dodd. Leonard is terrifyingly vulnerable to whoever holds the pen or interprets the Polaroids.
  *   **The Film's Stance:** *Memento* strongly suggests this vulnerability isn't a bug, but a *feature* of such rigid, self-imposed directive systems, especially when divorced from ongoing relationship or context. It portrays the "surrogate-interpreter" not as a benevolent helper ensuring the prior self's wishes, but as a position of inherent power ripe for exploitation, because the *system itself* removes the subject's capacity for contextual judgment. The directive becomes a tool others wield.

  **3. Addressing the Objection: "It's Not Real Advance Directives!"**
  *   **The Objection's Validity:** It's true. Leonard isn't terminally ill or demented in the progressive, degenerative sense. He's not in a hospital setting facing treatment decisions. The stakes are vengeance, not comfort care or life-sustaining treatment.
  *   **Why It Doesn't Matter (Or Why It Makes It *More* Revealing):**
      1.  **The "Clean Room" Effect:** Precisely *because* it removes the medical context, third-party institutions (hospitals, courts), and the emotional weight of terminal illness, it isolates the *core philosophical conflict*: Can a past self bind a future self who is psychologically disconnected? Does authorship confer absolute authority? The absence of medical necessity strips away justifications based on pity or futility, forcing us to confront the raw power dynamic.
      2.  **Amplifying the Disconnect:** Leonard's disconnect is absolute and daily. Parfit's "psychological connectedness" is near-zero overnight. This hyper-charges the question: Why should *this* Leonard, *this* morning, be bound by the decisions of *that* Leonard last night, whom he doesn't remember and who might have been acting on manipulated information or self-deception? It makes the discontinuity starkly visible.
      3.  **Exposing Foundational Flaws:** The film shows that if the justification for precedent autonomy crumbles under the pressure of Leonard's amnesia (due to unreliable authorship, lack of connection, and manipulative interpreters), it raises profound doubts about its application even in "standard" dementia cases. What if the "competent" self setting the directive was also under duress, influenced, or not fully rational? Leonard's case is an extreme *reductio ad absurdum* that tests the limits of the principle.

  **4. What the Film Shows That the Argument Can't: Beyond the Trade-Off**
  *   **Authority as Authorship/Will to Power, Not Rationality:** The film decisively shows Leonard's earlier self's authority rests *not* on being "right," well-informed, or acting in the future self's best interest, but **purely on the act of authorship and the imposition of will**. He owns the narrative because he writes it (and tattoos it) *first*. He binds his future self because he *can* and because it serves the *current* project of the writing self. The film suggests precedent autonomy, in practice, might be less about respecting a "whole life" and more about the **tyranny of the drafting self**, empowered by the document/system they create.
  *   **The Seduction of Purpose Over Well-Being:** The film viscerally demonstrates how Leonard (both the planner and the executor) *prefers* the destructive, manipulated quest to the terrifying void of having no narrative, no purpose. He actively chooses the directive system, even knowing (in the planning moments) it might be flawed or manipulative, because the *experience* of having a mission is paramount. This challenges the neat separation of "critical" and "experiential" interests – the "critical interest" *is* the experiential interest of having a driving purpose, however destructive.
  *   **The Physicality of Autonomy:** The notes, Polaroids, and tattoos make the conflict tangible. We see Leonard *interact* physically with the directives – reading them, burning them, tattooing himself. This embodies the abstract conflict in a way texts cannot. The directives aren't abstract wishes; they are physical objects he must obey or destroy.

  **Scenes for the Board:**
  1.  **"Don't Believe His Lies" Polaroid (Reveal):** Show the photo of Teddy with the annotation. This encapsulates the core directive *and* its inherent vulnerability (it's written by a potentially unreliable self *and* subject to interpretation). Ask: Who wrote this? Can we trust *them*? What power does holding this photo give Teddy?
  2.  **The Tattoo Parlor ("FACT 6: CAR LICENSE SG13 7IU"):** This is the moment of deliberate self-manipulation. Leonard, having learned the system's flaw and Teddy's manipulation, *chooses* to inscribe a false directive onto his own body. It's the ultimate act of precedent autonomy *as willful deception of the future self*. Key question: What does this say about the "authority" of the drafting self?
  3.  **The Final Walk:** Leonard strides purposefully into the night after setting up Sammy's photo and burning the evidence. Freeze frame here. This is the triumph of the *system* (he has a purpose) and the complete subjugation of the present experiential self to the fabricated narrative/directive. It's not freedom; it's programmed action. Question: Is this "respecting the whole life" (Dworkin) or the erasure of the present person (Dresser)? Or is it something darker – the victory of the *need* for a narrative over truth or well-being?

  **Conclusion: Where the Film Comes Down (and Cheats)**
  *   **Comes Down:** *Memento* lands heavily on the side critiquing the absolute authority of the precedent self, aligning more with Dresser's concerns about the present self. It shows:
      *   The earlier self can be irrational, self-deceptive, and actively harmful to the future self.
      *   Psychological discontinuity (Parfit) *does* matter profoundly; the disconnected self *is* a different person in crucial ways.
      *   Directive systems inherently create dangerous power imbalances with interpreters.
      *   The authority of the directive rests primarily on the *act of imposition* (authorship/ownership), not wisdom or benevolence.
  *   **Where it Cheats:** The film slightly stacks the deck by making Leonard's "critical interest" (vengeance) so inherently destructive and self-deceptive, and the disconnect so absolute. Real advance directives are usually about avoiding suffering or unwanted intervention, not pursuing a violent quest. However, this "cheat" is its genius – by taking the logic to an extreme, it exposes the potential for coercion, manipulation, and the tyranny of the drafting self that exists even in less dramatic contexts. It forces us to ask: If precedent autonomy fails *here*, on what firmer ground does it stand in the clinic?

  **The Final Takeaway for Students:** *Memento* doesn't just present the trade-off; it **reframes it**. It suggests the "authority" of the prior self isn't necessarily grounded in superior rationality or the sanctity of a "whole life," but in the brute fact of *authorship* and the *imposition of narrative*. The conflict isn't just between past and present selves, but between the *desire for a coherent, purposeful life* (even a false one) and the *reality of the disconnected, vulnerable person existing now*. The film asks: When does respecting the former become the annihilation of the latter? Your seminar will crackle with this. Good luck!
