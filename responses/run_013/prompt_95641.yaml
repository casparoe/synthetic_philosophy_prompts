prompt: |-
  I've spent the last few months arguing about welfare conditionality with a flatmate who works in a benefits office, and the arguments have left me unable to say what I actually believe, so I want someone to work out what principle, if any, my verdicts on particular cases add up to. Suppose a scheme that pays a means-tested amount to anyone whose earnings fall below a threshold, tapers that amount away as earnings rise, requires claimants to sign an agreement to seek work and to attend periodic interviews, and sanctions those who fail to do so by cutting or suspending payment. Going by gut, here is what I think. A lone parent who misses an interview because the bus was cancelled, and who telephoned ahead to say so, should not be sanctioned; sanctioning her is wrong. A man made redundant from a trade who turns down a job at two thirds of his old wage, and is sanctioned, is also wronged, though I feel it much less strongly. A man who does undeclared cash-in-hand work while claiming — because the benefit does not cover his rent — and conceals the earnings from the office, has done something seriously wrong, even though the work is exactly what the scheme says it wants from him. A neighbour who is fit for work, applies diligently for two years, finds nothing, and quietly stops applying: I do not think he should be sanctioned, though I cannot say what his fruitless effort has bought him. A wealthy woman who claims a benefit she is technically eligible for, fills in the form accurately, and keeps the money, has done something wrong, though nothing she has done is dishonest or unlawful. A man who arranges his affairs — splitting a contract, timing the sale of a house — so as to fall just under the means test, and who tells the office nothing false, has done nothing wrong, though I would resent subsidising him. Someone who exaggerates the severity of a genuine illness on a medical form to obtain a higher rate has done something wrong; someone equally and genuinely ill who, on a bad day, describes her condition in words she knows overstate it, has not — and I notice that I can distinguish these two only by the state of the claimant's soul. And if I compare a man who has never worked, intends never to work, and costs the state a modest sum with a man who has defrauded the same sum while holding down two jobs, I think the second is worse, although he has contributed more and taken no more.

  My own tentative principle was that everyone is owed enough to live on, and that in return they owe the rest of us an honest attempt to contribute, so that what is wrong with the undeclared worker is the concealment and not the money; but that cannot explain why the wealthy accurate claimant has done wrong, since she conceals nothing, or why the diligent neighbour who has given up should be spared a sanction, since he is no longer attempting anything. I have always suspected that the distinction between the deserving and the undeserving poor is resentment in a moral costume, and I would rather not end up defending it under a new name; yet the verdicts above seem to commit me to something of the kind. So I would like a principle, or a small set of them, that does better: stated precisely enough to be applied, with an indication of which of my cases each clause exists to handle, an honest account of which of my verdicts it forces me to abandon, and its verdicts on three cases I have not yet put to myself — a claimant who honestly reports a change of circumstances that the office then fails to act on, so that he is overpaid through no fault of his own and keeps the money; a claimant who is willing to work but only at a wage that would let him live without the top-up, and who refuses everything below it; and a claimant who is a fraud, in a neighbourhood where nobody regards the conditionality rules as legitimate and nearly everyone is on the scheme. I am not asking what the law should be, or what would reduce the deficit; I want to know whether there is a coherent account of when someone has done wrong in claiming, working, or refusing to work, and what it says about who deserves what. There is no need for citations — I want the argument, not the literature.
reasoning: |-
  Okay, the user has presented a really intricate ethical dilemma about welfare conditionality. They've described multiple specific scenarios where their gut feelings about right and wrong in welfare claims conflict, and their initial attempt to formulate a coherent principle has failed. 

  First, I need to unpack why their "honest attempt to contribute" principle doesn't work. The wealthy claimant case is particularly damning - if someone is technically eligible and honest, why does it feel wrong? And the neighbor who stops applying - why no sanction despite lack of current effort? These break their framework.

  Hmm... the key might be separating two distinct ethical dimensions: one about honesty in process (which covers undeclared work, fraud, etc.) and another about purpose/need (which explains why wealthy claimants feel wrong despite honesty). The user's intuition about the "state of the claimant's soul" in the illness exaggeration cases suggests they're sensitive to intent as well.

  For the new cases they proposed: 
  - The overpaid claimant through official error: keeping money feels wrong despite no fault, because they know they're not entitled
  - The wage-refuser: tricky because they're "willing" but only on unrealistic terms - this might fall under failing to make reasonable effort
  - The fraud in non-compliant community: the social context matters but doesn't erase individual dishonesty

  The user seems genuinely troubled by potentially endorsing "deserving/undeserving" distinctions while their intuitions demand some differentiation. Their fear of "resentment in moral costume" shows admirable self-awareness. I should emphasize that the proposed principles judge actions (fraud, gaming) not worthiness of persons.

  Noticing they reject purely economic arguments ("not asking what would reduce deficit") - this is firmly about moral philosophy. Their examples show particular disdain for deception, even when motivated by need (undeclared work) and for claims that violate spirit rather than letter (wealthy claimant).

  The bus cancellation case reveals they value reasonable effort over perfect compliance - the parent did everything possible. Whereas the wage-refuser's effort seems unreasonable. Interesting how "reasonableness" becomes the operative standard for effort.

  For the fraudster vs idle claimant comparison: the fraudster's active deception is worse than passive dependence because it violates social trust. This aligns with their intuition that concealment is key in the undeclared work case.

  Should flag that the "reasonable effort" criterion will be messy in practice - but since they want principles not policy, that's acceptable. The medical form cases show they already accept some subjectivity in judging intent.
answer: |-
  Your intuitions reveal a coherent ethical framework centered on **procedural integrity, substantive need, and reasonable effort**, rejecting both pure entitlement and pure contribution models. Your discomfort stems from conflating *desert* with *eligibility*—you judge actions, not moral worth. Here’s the distilled principle set:

  ### Core Principles:
  1. **The Need Principle**:  
     Welfare exists to prevent deprivation. Claiming *without need* (even if technically eligible) is wrong because it subverts the system’s purpose.  
     *Handles*: Wealthy claimant (wrong—no need), redundant tradesman (sanction wrong—forced into underpaid work risks deprivation).  

  2. **The Procedural Integrity Principle**:  
     Honesty in disclosure and compliance is non-negotiable. Deliberate deception (lies, concealment, fraud) is always wrong.  
     *Handles*: Undeclared worker (wrong—concealment), illness exaggerator (wrong—dishonesty), fraudster (worse than non-worker).  

  3. **The Reasonable Effort Principle**:  
     Claimants must engage in *reasonable* efforts to work or seek work, accounting for circumstance. Sanctions are unjust if failure results from factors beyond control or if demands are unreasonable.  
     *Handles*: Lone parent (sanction wrong—effort made), diligent neighbor (no sanction—effort was reasonable initially; futility negates ongoing obligation).  

  4. **The Anti-Gaming Clause**:  
     Structuring affairs to *technically* qualify without deception is permissible but socially objectionable—it violates the spirit of need-based support.  
     *Handles*: Asset manipulator (not *wrong* but resented—gaming without fraud).  

  ### Conflicts with Your Verdicts:
  - **Abandoned Verdict**: The "wealthy claimant" is wrong solely by **Principle 1** (no need), *not* dishonesty. Your initial "honest effort" principle couldn’t explain this—now resolved.  
  - **Clarified Verdict**: The "redundant tradesman" refusing lower pay is protected by **Principle 1** (deprivation risk from inadequate wage) *and* **Principle 3** (refusal may be reasonable if wage is exploitative).  

  ### New Cases Judged:  
  1. **Overpaid claimant (official error)**:  
     - *Verdict*: Keeping the money is wrong.  
     - *Why*: **Principle 1** (no ongoing need for overpayment) + **Principle 2** (failure to correct known overpayment is passive dishonesty).  

  2. **Wage-refuser (only accepts non-subsidized wage)**:  
     - *Verdict*: Sanction justified if refusal is unreasonable.  
     - *Why*: **Principle 3** (effort is unreasonable if it ignores labor market realities—welfare’s purpose is temporary support, not wage idealism).  

  3. **Fraud in non-compliant community**:  
     - *Verdict*: Fraud is still wrong.  
     - *Why*: **Principle 2** (systemic non-compliance doesn’t negate dishonesty’s inherent wrong; context may *explain* but not *excuse* fraud).  

  ### Why This Works:
  - **Deservingness vs. Action**: You avoid judging "deservingness." The idle non-worker isn’t "immoral"—but claiming without effort violates **Principle 3**. The fraudster is worse because they violate **Principle 2** (integrity).  
  - **Soul-State Distinction**: Medical exaggerators are judged by **Principle 2**: deliberate deception vs. imprecise description on a bad day. Intent matters, not soul-purity.  
  - **Resentment Managed**: Resenting the asset manipulator (**Anti-Gaming Clause**) is consistent—it flags a *system flaw* (means-test loopholes), not the claimant’s sin.  

  ### Limitations:
  - **"Reasonable Effort" is Contextual**: The neighbor’s ceased job search isn’t sanctioned because two years of futility makes ongoing effort unreasonable. But where to draw this line? Your intuition handles it case-by-case.  
  - **Gaming vs. Fraud**: Asset manipulation is galling but legal; rejecting it requires policy change, not moral condemnation.  

  This framework transforms your intuitions into actionable ethics: welfare is a **need-based compact** requiring **honesty** and **reasonable engagement**, where violations are acts (fraud, gaming, claiming without need) not identities ("undeserving poor"). It condemns exploitation by the comfortable, excuses hardship-induced non-compliance, and demands system integrity—without moralizing poverty.
