  I'm a software engineer with no formal philosophy background, trying to read Aristotle's Politics Book 1 on my own, and I've hit a sentence I can't get past. Jowett's translation reads: "For that which can foresee by the exercise of mind is by nature intended to be lord and master, and that which can with its body give effect to such foresight is a subject, and by nature a slave; hence master and slave have the same interest."

  The first half I think I follow: it's a division of labor between the one who plans and the one who executes, and the by-nature talk is flagging that this division isn't merely convention. But the last clause throws me: hence master and slave have the same interest. That sounds like a claim about mutual benefit, which seems like a different kind of claim from one about each party being suited to a different role. Is Aristotle actually inferring mutual benefit from division of function, or is that clause doing something else? And when he says the slave is by nature a slave, does he mean this individual is naturally fitted for it, or that there's a natural class of such people, or just that the role itself is natural to the household? I cant tell which reading the sentence needs. Could you walk me through what the sentence actually commits him to, and flag where the ambiguity is his and where it's the translation's?
