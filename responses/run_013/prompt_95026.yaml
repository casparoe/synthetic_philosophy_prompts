answer: |-
  **MEMORANDUM**  
  To: Advisory Board Members  
  From: [Your Name], Advisory Board Member  
  Date: October 26, 2023  
  Subject: Recommendation: Conditional Funding for Turkish Oral History Project  

  ---

  ### BOTTOM LINE  
  **Recommendation:** Fund the oral-history archive component ($135,000) with strict conditions: recordings must be deposited under embargo with a designated university repository abroad, and the public installation must be dropped. Decline funding if the applicant refuses these terms.  

  ---

  ### REASONING  
  This decision balances four competing imperatives:  
  1. **Preserving irreplaceable testimony** while the last living witnesses survive;  
  2. **Avoiding complicity in state-sponsored denial** by funding euphemistic language;  
  3. **Respecting on-the-ground risks** to local partners;  
  4. **Upholding the foundation’s integrity** without imposing unworkable universal standards.  

  The applicant’s compromise—archiving testimonies under embargo while scrapping the public installation—achieves this balance. It secures primary evidence for future accountability while sidestepping direct reinforcement of Turkey’s denialist framework. The archive’s content (oral histories from survivors’ descendants) inherently contradicts state narratives, even without explicit labels. Depositing it abroad ensures preservation beyond state control. Demanding public use of “genocide” would collapse the project, sacrificing concrete evidence for symbolic clarity.  

  ---

  ### STRONGEST CASE AGAINST THIS RECOMMENDATION  
  **Objection:** Funding a project that avoids "Armenian genocide" legitimizes Turkey’s erasure. The testimonies will be weaponized by denialists as “neutral” records divorced from state culpability. Our foundation’s credibility relies on rejecting euphemisms; if we fund “relocations” in Turkey after rejecting “population exchanges” in Hungary, we apply a double standard that rewards intransigent regimes. Archives without explicit framing become orphaned facts, easily absorbed into dominant narratives.  

  **Response:** This objection rightly insists on moral consistency but conflates *process* with *outcome*. In contexts like Turkey—where the state criminalizes truth-telling—the act of gathering testimony is itself a subversion. The embargoed archive creates a trove for future historians, activists, and courts when political conditions shift (as they did in Germany). Conversely, rejecting the project sacrifices tangible evidence for performative purity. Our guideline must distinguish between *denying* states (Turkey) and *reckoning* states (Germany); demanding identical terminology in both guarantees no archive emerges where it’s needed most.  

  ---

  ### TIMELINE & CONDITIONS  
  1. **By November 2:** Offer conditional grant: $135,000 for archive *only*, requiring:  
     - Recordings deposited with a pre-approved university repository (e.g., UCLA Armenian Oral History Collection) under a 10-year embargo.  
     - Public installation scrapped; no municipal memory garden funded.  
     - Final project title must include “Armenian Survivor Testimony” (legally defensible in Turkey).  
  2. **If refused:** Decline funding immediately. State publicly: “We cannot support projects that obscure historical crimes.”  
  3. **If accepted:** Disburse funds in tranches tied to recording milestones. Repository must confirm secure deposition.  

  ---

  ### PROPOSED STANDARD FOR DENYING STATES  
  **The “Repentance Threshold” Test:**  
  - **Where the state acknowledges crimes (e.g., Germany):** Demand precise language. No euphemisms; projects must name perpetrators and victims. *Rationale:* State support enables truth-telling; our role is to push against forgetting.  
  - **Where the state denies crimes (e.g., Turkey, Japan):** Prioritize evidence preservation over public framing. Accept necessary euphemisms *only* if:  
    (a) The project gathers primary sources (testimonies, documents);  
    (b) Materials are secured beyond state reach;  
    (c) Public-facing elements avoid endorsing state narratives.  
  - **Ambiguous cases (e.g., American South):** Demand context. Fund a Confederate monument audit *only* if it names slavery as foundational; reject “heritage” projects masking violence.  

  **Testing the Standard:**  
  - **Japan:** Would fund oral histories with Korean “comfort women” if deposited abroad—even if called “wartime hardships”—but reject a museum exhibit calling them “volunteers.”  
  - **Germany:** Reject any project softening Holocaust terminology; state accountability is established.  
  - **American South:** Fund a lynning memorial only if it cites white supremacy; reject “local tragedy” euphemisms.  

  ---

  ### THE UNSETTLABLE VALUES QUESTION  
  The irreconcilable tension is between **immediate symbolic integrity** (rejecting all complicity in denial) and **long-term evidentiary pragmatism** (securing proof for future justice). No standard resolves this. My recommendation prioritizes pragmatism because:  
  1. Archives in denying states are acts of defiance;  
  2. Truth without evidence is vulnerable to dismissal.  
  However, if the board views even embargoed collaboration as morally tainted, declining is defensible.  

  **Critical Unknown:** The repository’s independence. If the chosen university is susceptible to Turkish pressure, the archive could be compromised. Mitigation: Specify a repository with Armenian diaspora ties and a record of defiance (e.g., UCLA).  

  ---

  ### CONCLUSION  
  This project’s value lies in capturing vanishing voices—not in its timid label. Fund the archive, exile the evidence, and let history judge the words. We gain a weapon for tomorrow’s battles; we lose only the illusion of purity today.  

  // End //  
