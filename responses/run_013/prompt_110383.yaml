prompt: |-
  I'm in a second-year seminar on theory change and we've just done Lakatos — research programmes, the hard core, the protective belt, the positive and negative heuristic, progressive versus degenerating problem-shifts, and the claim that you appraise a programme by whether it keeps anticipating novel facts rather than by whether it's true. The bit I can't swallow is the separation of appraisal from truth: he seems fine with a programme whose hard core is just false being rated ahead of a rival whose core is true, so long as the false one keeps predicting things and the true one keeps patching itself. I want to know whether that's a real possibility or just an artefact of the historical examples he picks, so build me a case instead of citing one. Invent a small fictional research programme — a made-up science, not a real episode, so no Prout, no Bohr, no ether and Michelson-Morley — with a false hard core that Lakatos's own criteria rate as progressive, plus a rival programme with a true hard core that the same criteria rate as degenerating.

  The constraints are the hard part and I care about them more than about the scenario being pretty. (1) The verdict has to fall out of the criteria, not out of me rigging it: the false-core programme must be predicting novel facts that then get independently confirmed, and the true-core programme must be doing something that genuinely counts as ad hoc belt-patching rather than just cautious revision. (2) It can't turn on sociology — I don't want the true programme losing because it's underfunded, suppressed, or staffed by worse people, since none of that counts for Lakatos and I don't want it smuggled in. (3) Keep the science small and legible, a handful of laws and a couple of instruments, not a whole cosmology. (4) They have to be genuine rivals: same question, disagreeing answers, not two programmes quietly working on different problems. Then the debrief. Set out the hard core, protective belt, and both heuristics for each programme; go through which belt moves are ad hoc and why; and identify which predictions count as novel in Lakatos's sense and what work that word is doing there, because predicted-versus-accommodated is the hinge I keep losing track of. Finally, honestly: which single feature of the case is doing the work, what happens to the verdict if I remove or flip it, and what the strongest attack on the whole case would be from someone who thinks separating appraisal from truth was a mistake. Dont hedge and dont hand me three candidate cases to choose from — commit to one, defend it, and if you think the constraint set is actually unsatisfiable, build the best case you can and tell me exactly where it falls short.
