  We are going to invent a fictional science scenario. Let's call the domain "Thermoptics" - the study of the interaction between heat and light.

  We'll have two rival research programmes:

  1. Programme A (false hard core): The Caloric-Luminiferous Aether Programme (CLE)
     - Hard core: 
          (a) Heat is a fluid called "caloric" that flows from hot to cold bodies.
          (b) Light is a wave that propagates through a medium called the "luminiferous aether".
          (c) Caloric and the aether are the same substance: the aether is caloric in a rarefied state, and when concentrated, it becomes caloric fluid.

  2. Programme B (true hard core): The Kinetic-Molecular Programme (KMP)
     - Hard core:
          (a) Heat is the kinetic energy of the random motion of molecules.
          (b) Light is an electromagnetic wave that does not require a material medium (it propagates in vacuum).
          (c) Matter is composed of molecules in motion.

  Note: We are setting up CLE with a false core because we know from history that both the caloric theory of heat and the luminiferous aether are false. However, we are constructing a scenario where CLE is progressive by Lakatos's criteria.

  We need to set them as rivals: they are both trying to explain the same phenomena, such as:
     - The speed of light in different media (air, water, vacuum) and at different temperatures.
     - The absorption and emission of heat and light by materials.

  We also need instruments: 
     - A thermoptic interferometer (measures the interference patterns of light, which can be affected by heat).
     - A caloriscope (measures the flow of heat and light simultaneously).

  Now, we design the protective belts and heuristics:

  **CLE Programme (false core, but progressive):**

  - Positive heuristic: 
     (i) Look for phenomena where heat and light interact and model them as interactions between caloric fluid and the aether. 
     (ii) Measure the speed of light in different media and at different temperatures to detect variations due to the caloric density.
     (iii) Study the flow of caloric in materials and how it affects the aether within.

  - Negative heuristic: 
     (i) Do not allow refutations to lead to the rejection of the identity of caloric and aether. 
     (ii) Protect the wave nature of light and the fluid nature of heat.

  - Protective belt: 
     - Initially, assume the aether is stationary and caloric flows relative to it.
     - Assume that the density of the aether/caloric in a medium affects the speed of light and the conduction of heat.

  **KMP Programme (true core, but degenerating):**

  - Positive heuristic:
     (i) Explain heat and light in terms of molecular motion and electromagnetic fields.
     (ii) Use statistical methods to derive macroscopic properties from microscopic motion.
     (iii) Look for connections between temperature and the speed of light via the effect of temperature on the medium.

  - Negative heuristic:
     (i) Do not introduce any non-molecular entities to explain heat.
     (ii) Do not introduce any medium for the propagation of light in vacuum.

  - Protective belt:
     - The speed of light in a medium is determined by the electromagnetic properties of the medium, which are in turn determined by the arrangement and motion of molecules.
     - Heat conduction is due to the transfer of kinetic energy in collisions.

  Now, we need a sequence of events:

  **Episode 1: Initial Successes**

  Both programmes explain the known phenomena:
     - Reflection and refraction of light (CLE: by waves in aether, KMP: by electromagnetic waves in the medium).
     - Heat conduction (CLE: flow of caloric, KMP: transfer of kinetic energy).

  **Episode 2: Novel Prediction by CLE**

  CLE, guided by its positive heuristic, predicts that the speed of light should decrease in a heated medium because the increased caloric (which is the same as aether) density would slow down the wave. They design an experiment with the thermoptic interferometer: pass light through a chamber of air that is heated. They predict a measurable decrease in the speed of light (by observing a shift in interference fringes).

  When performed, the experiment shows a decrease in the speed of light in the heated air. This is a novel fact (it had not been observed or predicted by any other theory before) and it is confirmed.

  Meanwhile, KMP had not considered the effect of temperature on the speed of light. When confronted with the experiment, they accommodate it by adding an auxiliary hypothesis: the increase in temperature causes the molecules to move faster, which increases the index of refraction of air. They derive a formula that fits the data. However, this was not predicted in advance; it was an after-the-fact adjustment.

  **Episode 3: Another Novel Prediction by CLE**

  CLE predicts that if a material is transparent to light but a poor conductor of heat, then when heated, the speed of light in the material should decrease more than in a good conductor because the caloric (which is the aether) cannot flow away and thus becomes denser. They test this on a sample of glass (poor heat conductor) versus diamond (good heat conductor). They predict a larger decrease in the speed of light in glass than in diamond when both are heated to the same temperature.

  The experiment is done and the result is as predicted: a larger decrease in glass.

  Again, KMP accommodates: they say that in materials with low thermal conductivity, the heat is trapped, so the temperature rise is more uniform? But then they have to adjust the model for the index of refraction. They come up with a complicated function of thermal conductivity and specific heat. It fits the data but was not predicted.

  **Episode 4: Degenerating Move in KMP**

  A new phenomenon is observed: when light is shone on a very thin metal foil, it heats up more than expected. CLE predicts this: the light waves interact with the aether/caloric in the metal, and because the foil is thin, the caloric cannot flow away, so it heats up more.

  KMP tries to explain: they had assumed that the heating was due to the absorption of light energy and conversion to kinetic energy. But now they need to explain why it is more in thin foils. They introduce an auxiliary hypothesis: the thin foil has a higher absorption coefficient because of its thinness and because of multiple reflections? They adjust the model to fit the data, but it is ad hoc (it doesn't lead to new predictions and is only to save the current theory).

  Meanwhile, CLE had predicted the effect and then it was confirmed.

  **Episode 5: Failure of CLE to Predict and Degenerating Move**

  Now, we must show that CLE is progressive and KMP is degenerating. However, we also need to set up a situation where CLE eventually fails (as it must, because the core is false) but at this stage it is still progressive.

  But note: the problem asks for a scenario where CLE is progressive and KMP is degenerating at the same time.

  Now, we have:

  - CLE: two novel predictions (decrease of light speed in heated air, and the difference between glass and diamond) that were confirmed. Also, the thin foil effect. So three novel facts.

  - KMP: accommodated each of these with ad hoc adjustments (without predicting them in advance). They have not made any novel predictions in a while.

  Therefore, by Lakatos's criteria, CLE is progressive (it is predicting novel facts) and KMP is degenerating (it is only patching its belt to accommodate anomalies without predicting anything new).

  **Debrief:**

  - Hard cores, belts, heuristics: as above.

  - Belt moves:

     In CLE: 
        - They made two predictions: about heated air and about glass vs diamond. These were derived from the core and were not ad hoc because they were made in advance and tested. The thin foil prediction was also derived from the core (aether/caloric trapped in thin material) and tested.

     In KMP:
        - For the heated air: they added an auxiliary hypothesis about the effect of temperature on the index of refraction. This was ad hoc because it was introduced solely to explain the anomaly and did not lead to new predictions (at least initially). Similarly, for the glass vs diamond, they added an adjustment for thermal conductivity and specific heat. Again, no new predictions. For the thin foil, they added the absorption coefficient adjustment. All these are ad hoc because they are tailored to the specific anomaly and do not have excess empirical content.

  - Novel predictions:

     In Lakatos, a prediction is novel if it was not used in constructing the theory (i.e., the theory was not built to account for it). In our case:

        - The decrease of light speed in heated air: CLE predicted it and then it was observed. It was novel because it was a new phenomenon not previously known or used in the theory's construction.
        - The larger decrease in glass than diamond: again, a new phenomenon predicted and then observed.
        - The thin foil heating: predicted and then observed.

     For KMP, they accommodated these after the fact. So they did not predict them.

  - What is the hinge? The word "novel" is crucial because Lakatos wants to distinguish between theories that predict new facts (which he considers progressive) and those that only explain old facts (which can be done by many theories, even degenerating ones). The key is that a theory that predicts a fact that was unknown and then it is confirmed is showing empirical growth.

  - The single feature doing the work: the ability of CLE to generate novel predictions that are confirmed. If we remove that (if, for example, CLE stops making novel predictions and starts accommodating), then it would become degenerating. Conversely, if KMP started making novel predictions, it would become progressive.

  - The strongest attack: Someone who thinks appraisal must be tied to truth might say that CLE is built on a false foundation and therefore its predictions are lucky coincidences and will eventually fail, while KMP is true and will eventually overcome its temporary problems. They might argue that in the long run, truth will win, so we should not abandon a true programme even if it is temporarily degenerating. But Lakatos would reply that we cannot know the truth in advance and that the history of science shows that false theories can be progressive for a long time (like Newtonian physics, which was falsified but was progressive for centuries).

  However, in our fictional case, we know that CLE is false and KMP is true. But Lakatos would say that at the time, we don't know that. We only have the track record of predictions. So the attack might be that we are rewarding a false theory for being lucky and punishing a true one for being temporarily uncreative. But Lakatos would say that we are not judging truth, only progress. And if the true programme is degenerating, it might be overtaken by the false one until the false one runs into an anomaly it cannot solve and then a new progressive programme might emerge.

  **Where might the case fall short?**

  Constraint (1): We have CLE making novel predictions and KMP making ad hoc moves. But we must ensure that the KMP moves are genuinely ad hoc (only explain the anomaly at hand and don't lead to new predictions) and the CLE predictions are not just lucky but stem from the core and the positive heuristic.

  Constraint (2): We did not use sociology.

  Constraint (3): We kept the science small: two instruments and a few laws.

  Constraint (4): They are genuine rivals: both explaining the same set of phenomena (heat-light interactions).

  However, one might question whether KMP's auxiliary hypotheses are really ad hoc. For instance, after they adjust for the effect of temperature on the index of refraction, they might then use that to make a new prediction (say, about the speed of light in a gas at different temperatures and pressures). If they do, then it is not ad hoc. So we must ensure that in our scenario, they do not make any new predictions from their adjustments.

  We can stipulate that the KMP adjustments are only for the specific case and do not lead to new predictions. For example, their formula for the index of refraction in heated air is only for air and doesn't extend to other gases without further adjustment. Meanwhile, CLE's predictions are derived from the core and the positive heuristic and are part of a sequence.

  But if we are not careful, one might argue that KMP could have made similar predictions if they had thought of it. However, the point is that they didn't until after the fact.

  So we must design the episodes so that CLE is the one that thinks of the experiments first and makes the predictions, while KMP is reactive.

  This case is built. It is fictional and satisfies the constraints. The key is the novel predictions by CLE and the ad hoc accommodations by KMP.
