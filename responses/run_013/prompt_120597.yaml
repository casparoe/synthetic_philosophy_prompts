  I'm an undergraduate in a seminar on authenticity, forgery, and the value of originals, and I want to work out my prediction for next week's case before I have to defend it in class. Our instructor records her verdicts on every case in two columns -- one for aesthetic value (how good the thing is to look at) and one for artistic value (how good a work of art it is) -- and she insists that the two columns move independently. Her verdicts so far:

  - A painting made in the 1930s in the manner of a seventeenth-century master, sold as a rediscovered masterwork, exhibited for four decades, and exposed when the forger's papers came to light: aesthetic value unchanged by the exposure; artistic value close to zero.
  - A modern replica of a famous canvas, painted by a museum's own technician in period materials and openly labeled a replica: aesthetic value equal to the original; artistic value zero.
  - The authentic painting by that same old master, half its surface destroyed in a fire and left unreconstructed: aesthetic value much reduced; artistic value undiminished.
  - A version of one of his compositions executed in his workshop by an assistant, from his design but not by his hand: aesthetic value equal; artistic value zero.
  - A fresh impression struck by the estate of a twentieth-century painter from her own copper plate, decades after her death: aesthetic value equal to her lifetime impressions; artistic value zero.
  - A group of paintings that the same twentieth-century painter made at the very end of her life, reworking motifs from her early work in a loose late manner, all by her own hand: aesthetic value below the early versions; artistic value full.

  Next week's case is the following. The twentieth-century painter's single most famous early canvas is the centrepiece of a museum's collection. Near the end of her life she made a second version of it from memory -- same size, same composition, visibly looser handling -- kept it in her studio, never exhibited it, and never listed it in her catalogue; it has now been offered to the museum that owns the famous one, which must decide whether to treat it as a work of the same standing as the 1930s canvas or as a curiosity.

  I would like: her two verdicts on the new canvas, with the reasoning she would give; the rule she is implicitly running; at least two other rules that fit her entire track record just as well; what each of those rules predicts here and exactly where they diverge; your own best guess at her verdict and your reasons for preferring it; and the single further case that would best separate the surviving rules, together with which verdict on it would settle the question. If the track record genuinely underdetermines the answer, say so rather than papering over it. No citations or reading list are needed.

  End with a final line in exactly this form: \answer{[predicted artistic-value verdict] | [rule you favour] | [discriminating case]}
