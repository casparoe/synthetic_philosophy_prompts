prompt: |-
  OK so this is going to sound like a math homework problem but it's actually a disagreement I want you to dramatize. Last weekend two of my friends got into it at like 2am after a party and nobody could settle it, and I've been turning it over since. Both of them are plenty smart -- one (call her V) is a longtime LessWrong lurker who's basically absorbed the Sequences and thinks of herself as a hardcore Bayesian, the type to say "a prior is just your credence, there's no magic objectivity in it, so the principle of indifference is a crutch at best"; the other (call him D) is the kind of person who thinks every apparent paradox in probability is really just a badly-posed problem, and that once you nail down the actual physical randomizing procedure the answer is determinate and the confusion evaporates. Neither is a strawman, I promise, and I don't want you to make either one dumb just to let the other win.

  The thing they were fighting about is Bertrand's chord deal -- you know, "pick a random chord of a circle, what's the chance it's longer than the side of the inscribed equilateral triangle," and depending on whether you randomize over endpoints, over a radius, or over the midpoint you get 1/3, 1/2, or 1/4. D says that's just because "a random chord" isn't a specification of an experiment, and the moment you say *how* you're randomizing the ambiguity is gone, so there's no real paradox -- the principle of indifference was never asked to do the work in the first place. V says that's a shell game: the original puzzle *did* invoke indifference (or symmetry) to substitute for a procedure, and the fact that indifference can't pick out a unique answer is the actual failure; saying "just specify the procedure" only relocates the arbitrariness into the choice of procedure, since there's no non-arbitrary reason to prefer throwing darts one way over another, and if you say "the physically natural one" you've definately smuggled a uniformity assumption back in. I want the dialogue to also press on a couple of things I think are where it gets interesting: (a) whether rotational and scale invariance are enough to single out a unique procedure (D thinks they are; V thinks "enough for what?"), (b) whether the story changes if it's a random *line* in the plane rather than a chord of a fixed circle, since there's famously no uniform distribution over lines and you have to pick a measure, and (c) whether either of them thinks the whole dispute is merely verbal. Please have them actually respond to each other's moves, concede where a concession is due, and by the end make clear exactly what they still disagree about -- is it the math, or the philosophy of what a prior is allowed to be?
