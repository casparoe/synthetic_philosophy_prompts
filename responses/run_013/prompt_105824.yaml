prompt: |-
  I'm a high school student and I'm in debate club, and I keep getting into fights with my cousin about corruption. I want to know what principle, if any, actually fits my gut verdicts. Here are the cases as I see them.

  My uncle in our home country gives a envelope of cash to a clerk to get a permit for his shop. Everyone does it, the clerk doesn't hide it, and without it the permit takes six months. I think that's corruption. My other uncle pays a private doctor extra to see my grandma after hours instead of waiting in the public hospital. I think that's fine, even though it's money for faster medical care. A company gives a hamper of wine and chocolate to a procurement officer at Christmas. The officer doesn't have to give them the contract, and the company doesn't say anything about it. I think that's corruption, but milder. A village chief's daughter gets a scholarship that everyone knows is because she's the chief's daughter, and the chief later helps the scholarship board with a land dispute. I think that's corruption. A professor writes a recommendation for her own student who she genuinely thinks is the best. I think that's fine. A congressman takes a big campaign donation from a company, and later votes for a bill the company likes. I think that's corruption, even if the vote is actually good policy. A nurse takes money from a family to move their relative up the queue, but she puts the money into the ward's fund for poor patients. I think that's still corruption. A foreign NGO comes in and says our country is corrupt because officials take gifts, but the NGO hires the director's nephew as a consultant. I think that's hypocritical, but I'm not sure it's the same kind of corruption.

  My cousin says the village chief stuff is just clientelism and that Westerners call it corruption because they don't get how families work. I definately don't buy that completely, but I can't say exactly why.

  The case I keep going back and forth on is my cousin's wedding. My family gives a lot of money to my cousin's new in-laws, and in return the in-laws' family will support my uncle's business with their connections. Nobody calls it a bribe, it's just how marriage works here, and everyone knows. I don't think it's corruption, but I can't say why it's different from the envelope to the clerk.

  I also have a half-baked principle: I think something is corruption when it's hidden and against the rules, and not corruption when it's open and everyone expects it. But that makes the envelope case not corruption, which I don't accept, and it makes the congressman case maybe not corruption if he discloses the donation, which also feels wrong. So that principle is probably dead.

  Is there a principle that gets most of my verdicts, or a small set of candidate principles if no single one works? I want it stated precisely, with the case that makes each part of it necessary. Tell me which of my verdicts it has to overturn, and what it predicts for a case I didn't list, like a government that publishes a fee for speeding up a passport and gives the money to a public fund. Also, is the Western standards thing doing any real work here, or am I just assuming my own culture's rules are the default? I'm not asking for citations or reading lists, just the principle and the cases.
reasoning: |-
  Okay, let's tackle this high school debater's corruption dilemma. They've presented multiple nuanced scenarios where their gut reactions conflict with their cousin's views and their own initial principles. The core challenge is finding a consistent ethical framework that explains why some actions feel like corruption while others don't, especially across cultural contexts.

  First, I notice the student's rejected principle about secrecy/rules fails because it conflicts with their own judgments - the permit bribe is overt but still feels corrupt, while disclosed campaign donations still feel wrong. This suggests corruption isn't just about transparency or rule-breaking. 

  Looking at their cases, a pattern emerges: actions that convert public resources into private benefits consistently trigger their corruption sense. The permit clerk monetizes public authority for personal gain; the village chief trades public assets (scholarship) for personal favors; the congressman sells political influence. Conversely, the private doctor exchange feels legitimate because medical care becomes a private transaction when performed off-hours. 

  The wedding case is particularly telling. Though similar to bribery in structure, it doesn't involve public institutions - it's inter-family networking within personal spheres. This distinction between public and private realms seems crucial. Their NGO hypocrisy example confirms this: both sides abuse their positions (public official taking gifts vs NGO director hiring relatives), but the NGO's fault feels different because they're moralizing about others while committing parallel offenses with private resources.

  For the passport fee case they proposed: if the government openly charges for expedited service and allocates funds publicly, this might resemble user fees rather than corruption - unless it creates privileged access that undermines equal service. The nurse's queue-jumping remains corrupt even with redirected money because it's still abusing public position for preferential treatment.

  The student's cultural awareness is impressive. Their rejection of the cousin's "clientelism" defense shows they intuitively grasp that family networks become problematic when they distort public institutions. Western standards aren't the default here - the principle works equally if we imagine a society where wedding exchanges involved public officials trading permits. 

  The refined principle would be: Corruption occurs when agents convert public authority/resources into private benefits (personal, familial, or organizational), violating their duty to allocate public goods impartially. This captures all their corruption verdicts while permitting the doctor/wedding cases, and explains why the nurse's act remains corrupt (position abused) and NGO hypocrisy matters (private organization applying double standards about public integrity). Cases requiring verdict reversal: none - it aligns with all their intuitions.
answer: |-
  Here's a principle that fits almost all your verdicts, derived from your intuitions:

  **The Public Trust Principle:** An act is corrupt when it involves *the conversion of public authority, resources, or trust into a private benefit (personal, familial, or organizational)*, violating the *duty of impartiality* owed to the public in the allocation of public goods or the exercise of public power.

  **How it explains your cases:**

  1.  **Uncle & Permit Clerk:** ✅ **Corruption.** The clerk uses *public authority* (issuing permits) to gain a *private benefit* (cash), violating their duty to allocate permits impartially based on public rules.
  2.  **Private Doctor After Hours:** ✅ **Fine.** The doctor is using *private resources/time* (after hours, presumably their own clinic/effort) to provide a *private service* for a *private benefit* (extra payment). No public authority or resource is misused. The duty is to patients *during public hours/in the public system*.
  3.  **Company Hamper:** ✅ **Mild Corruption.** The procurement officer uses their *public authority* (awarding contracts) to solicit/accept a *private benefit* (gifts). This creates an obligation or appearance of favoritism, violating the duty of impartiality in spending *public funds*.
  4.  **Village Chief's Scholarship:** ✅ **Corruption.** The scholarship board uses a *public resource* (scholarship funds, meant for merit/need) to confer a *private benefit* on the chief's daughter (due to family connection), violating impartiality. The chief then uses *public authority* (resolving disputes) to repay the *private benefit* received by his family. It's a trade of public authority/resources.
  5.  **Professor Recommendation:** ✅ **Fine.** The professor uses their *personal expertise and judgment* (a core part of their role) to evaluate a student based on merit. While a benefit is conferred, it stems from the professor's legitimate academic authority exercised impartially *based on merit*, not converting public trust for a private gain. The student earned it.
  6.  **Congressman & Donation:** ✅ **Corruption.** The congressman converts *public authority* (their vote on legislation) into a *private benefit* for their campaign (the donation), violating their duty to exercise legislative power impartially based on the public good, not private financial support. The "good policy" outcome is irrelevant to *why* the vote was cast.
  7.  **Nurse Queue-Jumping:** ✅ **Corruption.** The nurse uses *public authority* (managing access to public healthcare resources - the queue) to confer a *private benefit* (faster care for a specific patient) in exchange for money. Redirecting the money doesn't change the core act: misusing public position for preferential treatment, violating impartiality in allocating a *public good* (healthcare access).
  8.  **NGO Hypocrisy:** ✅ **Hypocritical, different kind of fault.** The NGO director likely used their position within a *private organization* (the NGO) to confer a *private benefit* (a job/consultancy) on a family member (nephew). This is **nepotism** or **favoritism**, which is problematic and unethical, *but it's not necessarily "corruption" under the Public Trust Principle* because it doesn't inherently involve the misuse of *public* authority or resources. It *is* hypocritical because they condemn misuse of *public* trust while engaging in misuse of *private* organizational trust/power. The *type* of power misused is different.
  9.  **Cousin's Wedding:** ✅ **Not Corruption.** The exchange of money and future business connections via marriage involves *private resources* (family money) and *private networks/connections*. It's not utilizing *public authority* (like a permit clerk, procurement officer, chief, congressman, or nurse) or misallocating *public resources* (like a scholarship or healthcare queue). It's within the sphere of family and private business dealings.

  **Why it overturns your initial "hidden/against rules" principle:**
  *   **Permit Clerk:** Overt and expected, but still corruption because public authority is sold for private gain. (Your principle failed here).
  *   **Congressman:** Disclosing the donation doesn't make it *not* corruption under this principle – it's still trading public power for private campaign benefit. Disclosure might make it *legal* or *transparent*, but doesn't change the *nature* of the transaction violating the duty of impartiality. (Your principle also failed here).

  **Your Cousin's "Clientelism" Argument:**
  *   The Public Trust Principle *agrees* that the village chief case is corruption. "Clientelism" is simply a *form* or *mechanism* of corruption under this principle. It's specifically the exchange of public resources/benefits (the scholarship) for political support/loyalty/future favors (help with the land dispute), mediated through personal/family connections. Western standards aren't the issue; the issue is the misuse of public resources entrusted to the chief/board for the public good. Family obligations don't override the duty to use public power impartially.

  **The Passport Fee Case:**
  *   **Government publishes fee for speeding up passport & gives money to public fund:** Under the Public Trust Principle, this **is not corruption** *if*:
      *   The fee is official, transparent, and applies equally to all who choose to pay it.
      *   The expedited service uses dedicated, non-detrimental resources (e.g., overtime staff, a separate efficient queue).
      *   The funds genuinely go to a public purpose.
      *   **Why it's not corrupt:** It's converting a *private benefit* (faster service for those willing to pay) into a *public benefit* (revenue for the fund), while maintaining the standard free/impartial service for others. No public official gains a *private* benefit, and the allocation of the *standard* public service remains impartial. It's akin to a user fee for an optional premium service that funds the system. *(If the fee lined an official's pocket, or if paying caused others *not* paying to wait longer unfairly, it WOULD be corruption).*

  **Why Western Standards Aren't the Default:**
  *   The principle focuses on the *nature of the power/resource being misused* (public) and the *duty violated* (impartial allocation/exercise), not on specific cultural norms about gifts or family obligations. A "bribe" in a Western context and "gift-giving" expected in another context both become corruption *under this principle* **if** they involve trading public power/trust for a private benefit that violates impartiality. The wedding case highlights this: strong family obligations exist, but they are interacting with *private* resources, so it's not corruption. The permit clerk case, even if culturally normalized, *is* corruption because it diverts *public* authority. The principle provides a functional, non-culturally-specific definition based on the role of the actor and the nature of the goods involved.

  **Summary:** The Public Trust Principle cleanly explains almost all your verdicts (Permit, Doctor, Hamper, Scholarship, Professor, Congressman, Nurse, Wedding, NGO) and provides a clear answer for the Passport Fee case. It only slightly reframes the NGO case, distinguishing between misuse of *public* trust (corruption) and misuse of *private* organizational trust (hypocrisy/favoritism, but different). It rejects cultural relativism when public duties are involved and focuses on the conversion of public power/resources into private gain as the core wrong.
