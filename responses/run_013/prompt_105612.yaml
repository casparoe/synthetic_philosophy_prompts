prompt: |-
  I'm an economist, mostly game theory and mechanism design — contracts, the rules-versus-discretion literature, that sort of thing — and my brother-in-law is a public international lawyer who insists on relitigating Nuremberg and Tokyo at every family dinner. I know the shape of it (the Allies win, then they write the charter, then they try the losers for aggression and atrocity and the whole thing is retroactive by construction), but every time we argue I find myself translating his points into my own vocabulary and then not being sure whether something got lost on the way. So what I want from you: take the main positions in that debate and restate each one as faithfully as you can in the language I actually think in. That means the ex post facto objection, the victors'-justice charge, the tu quoque reply, the standard defenses (that aggression was already unlawful under customary law or under the interwar pact renouncing war as an instrument of policy, that the alternative was summary execution, that somebody had to make a record), and the extra twist at Tokyo, where at least one judge went further than anyone at Nuremberg and denied the tribunal had jurisdiction at all. Put all of that in terms of commitment, time consistency, ex ante versus ex post optimality, incentive compatibility, renegotiation-proofness, who holds the pen when the rules get written, and who has standing to enforce. Don't just relabel — I want the actual mapping.

  Then the part I care about most: the residue report. Which of his claims come across cleanly, which only come across if I fudge something, and which have no counterpart in my vocabulary at all? I'm thinking of things like the sense that this was wrong regardless of what any rule happened to say, or that a court is speaking for humanity rather than for the winning coalition, or the gap between an act being punishable and an act being condemned. For each piece of residue, give me a verdict: is my framework missing something real, or was the original claim doing less work than it sounded like? One thing I'd like you to keep separate while you're at it — whether the defendants got a fair trial by the standards of their time, versus whether the law they were tried under existed before they acted. My brother in law always collapses those two and it drives me up the wall, and I suspect the collapse is doing alot of hidden work in his argument.
reasoning: |-
  Okay, let me unpack this economist's request. He's a game theory and mechanism design specialist dealing with a public international lawyer brother-in-law who constantly debates Nuremberg/Tokyo tribunals. The core ask is to translate legal arguments into economic concepts like commitment problems and ex post optimality, then identify which claims resist translation.

  First I need to map the classic debate positions:
  - Ex post facto objection → clearly a time inconsistency problem. Creating rules after actions violates ex ante incentive design.
  - Victors' justice → enforcement standing and rule-writing authority concentrated in the winning coalition.
  - Tu quoque → essentially an incentive compatibility challenge to the enforcer's credibility.
  - Customary law defense → trying to establish pre-existing focal points in the mechanism design.
  - Summary execution alternative → comparing equilibrium selection under different enforcement regimes.

  The Tokyo twist with Judge Pal's dissent is particularly interesting - his jurisdictional objection maps perfectly to a mechanism designer questioning whether the enforcer has proper standing. 

  Now for the residue analysis:
  - The "inherent wrongness" claim seems genuinely orthogonal to economic framing - it's a deontological stance that doesn't reduce to efficiency.
  - "Speaking for humanity" might be partially captured by network externality effects in norm enforcement, but overclaims.
  - Condemnation vs punishment gap maps neatly to separating norm-setting from incentive structures.

  Important to maintain his requested separation: procedural fairness (did the mechanism function properly given period constraints) versus legal existence (was the rule set defined ex ante) are distinct game-theoretic issues. The conflation he mentions likely smuggles in moral arguments under procedural guise.

  The translation reveals which arguments are substantively about institutional design versus non-instrumental morality. His framework handles the former well but hits limits at categorical imperatives - which might actually strengthen his position in debates by forcing clarity.
answer: |-
  Below is a rigorous translation of the Nuremberg/Tokyo debates into game-theoretic and mechanism design vocabulary, followed by a residue analysis identifying conceptual gaps. I maintain strict separation between **procedural fairness** (trial conduct relative to contemporaneous standards) and **ex ante legality** (whether charges were predefined violations).

  ---

  ### **Core Arguments Translated**
  1. **Ex Post Facto Objection**  
     *Legal claim*: Defendants punished retroactively under laws created after the acts.  
     *Economic translation*: **Time-inconsistent rulemaking**. The enforcer (Allies) designed punishment rules *ex post* without precommitment, violating **ex ante optimality**. Defendants faced distorted incentives: acts were legal in period *t* but criminalized in *t+1* after regime change.  

  2. **Victors’ Justice**  
     *Legal claim*: Trials reflect the winners’ arbitrary power, not impartial law.  
     *Economic translation*: **Monopoly on mechanism design**. The winning coalition held exclusive **rule-writing authority** (Charter drafting) and **enforcement standing** (appointing judges/prosecutors). This creates a **commitment problem**: rules favor the enforcer’s interests, undermining **renegotiation-proofness** (expectation that rules bind all parties equally).  

  3. *Tu Quoque* Defense  
     *Legal claim*: Allied forces committed similar acts (e.g., Dresden, Hiroshima).  
     *Economic translation*: **Selective enforcement undermining incentive compatibility**. Punishment is **non-monotonic**—sanctions apply only to losers despite identical actions by winners. This violates **strategy-proofness**: defendants cannot trust that compliance with norms yields protection if enforcement depends on exogenous power shifts.  

  4. **Aggression Was Already Illegal**  
     *Legal claim*: Prewar treaties (Kellogg-Briand Pact) and customary law criminalized aggression.  
     *Economic translation*: **Focal points in incomplete contracting**. Treaties established **common knowledge norms** against aggression, creating a **correlated equilibrium**. Trials enforced preexisting **off-equilibrium penalties** that were credible under the *old* regime but unenforced until power shifted (a **coordination failure** in earlier periods).  

  5. **Alternative: Summary Execution**  
     *Legal claim*: Trials were preferable to mass executions without process.  
     *Economic translation*: **Comparing subgame-perfect equilibria**. Summary execution = **low-cost punishment** with no legitimacy investments. Trials = **costly signaling** to establish a **reputational mechanism** for future deterrence. The latter improves **long-run efficiency** by boosting norm salience, despite higher short-run costs.  

  6. **"Making a Record" Justification**  
     *Legal claim*: Trials created an incontrovertible historical account.  
     *Economic translation*: **Public good provision through verifiable information**. Trials generated **common knowledge** via **transparent reporting**, reducing future **asymmetric information** and lowering **monitoring costs** for norm enforcement.  

  7. **Judge Pal’s Dissent (Tokyo)**  
     *Legal claim*: Tribunal lacked jurisdiction; victors cannot define *new* crimes.  
     *Economic translation*: **Rejection of enforcement standing**. Pal argued winners had no **legitimate authority** to act as mechanism designers. Their ad hoc rules violated **participation constraints**—only a *neutral* enforcer with precommitment power could impose globally optimal norms.  

  ---

  ### **Residue Report: Claims Resisting Translation**
  | Claim                                  | Translation Verdict                                                                 | Framework Gap? |  
  |----------------------------------------|-------------------------------------------------------------------------------------|----------------|  
  | **"Inherent wrongness" beyond rules**  | Fails direct mapping. Moral absolutes ≠ **payoff structures**. "Wrongness" implies exogenous preferences; economics treats preferences as given. | **Yes: Non-instrumental ethics** missing. Framework cannot evaluate *why* norms exist. |  
  | **"Court speaks for humanity"**        | Partial mapping: "Humanity" ≈ **network externality** (enforcement benefits all). But "speaking for" assumes **impartial principal**—economics assumes *no such agent exists* without enforcement power. | **Partially: Legitimacy source** undefined. Framework lacks theory of *non-coercive authority*. |  
  | **Condemnation ≠ punishment**          | Clear mapping: Condemnation = **cheap talk**; Punishment = **costly signal**. Gap is intentional—economics focuses on incentive-compatible actions, not expressive rhetoric. | **No: Original claim confuses signaling tiers**. Framework handles this distinction cleanly. |  
  | **"Collapsed" fairness & legality**    | As you suspect: Conflation smuggles in **normative weight**. Procedural fairness = **equilibrium selection** (was trial protocol *ε*-optimal for era?). Ex ante legality = **incentive design** (were rules predefined?). | **No: Collapse is rhetorical**. Framework *improves* clarity by separating these. |  

  ---

  ### **Diagnosis**  
  1. **Clean translations** (no residue):  
     - *Tu quoque* → Non-monotonic enforcement  
     - Condemnation vs. punishment → Signaling costs  
     - "Making a record" → Public good provision  

  2. **Fudged translations** (minor residue):  
     - **"Aggression was illegal"**: Customary law ≈ **correlated equilibrium**, but economics cannot explain *why* focal points emerge without payoff structures (relies on ex post rationalization).  
     - **"Victor’s justice"**: Framework captures **monopoly design** but not the visceral *unfairness*—economics is amoral about power asymmetries.  

  3. **No counterpart** (significant residue):  
     - **"Inherent wrongness"**: Your framework has no tool for categorical imperatives. This claim relies on **deontic logic** (duties > consequences).  
     - **"Speaking for humanity"**: Assumes a **universal principal**—economics rejects this as empty without enforcement teeth.  

  ---

  ### **Strategic Recommendation**  
  When your brother-in-law conflates **procedural fairness** and **ex ante legality**, force decomposition:  
  - *Procedural*: "Were trial rules ε-best-responses to 1945 information?" (If he cites Soviet judges, note **coalitional incentives**).  
  - *Ex ante legality*: "Did defendants face **multiplicity of equilibria**? Prewar treaties ≈ **cheap-talk coordination**—no enforcement meant no common expectation of punishment."  

  His "collapsing" likely exploits **affective residue** (e.g., moral outrage about fairness). Your framework exposes this by isolating **incentive design failures** from **procedural execution**. The irreducible residue ("inherent wrongness") is his strongest point—concede it requires non-economic axioms, then pivot to measurable incentive effects.
