prompt: |-
  I'm the volunteer treasurer of a small nonprofit and I also sit on my town's capital projects committee, so a few times a year I'm in a room voting on whether to keep paying for something that's already half-built, over budget and unpopular. The words 'sunk cost' get thrown around at our meetings but they're useless in practice, because the people who want to keep going always have real arguments — we'd be throwing away what we've spent, we'd look incompetent, the contractor would walk, and half the money is committed for next year anyway. What set me off: at our fundraiser we auctioned a mystery box where the top two bidders both had to pay — winner gets the box, runner-up gets nothing — and two people bid each other up for ages until the winner paid about five times what the box was worth and the loser paid nearly as much for nothing. Watching them, it's definately the same shape as our pool fight, just faster.

  Act as an expert on decision-making under commitment problems — someone who actually knows the theory of escalation of commitment and of auctions where the losers also pay — and help me build a procedure I can run live in a 45-minute meeting with no spreadsheet and no analyst. Think it through step by step, and start by brainstorming the different ways continuing can be genuinely rational versus just stubborn, because I suspect I've been swinging 'sunk cost' like a hammer and sometimes voting to kill things that were worth finishing.

  What I want: a short ordered list of questions to ask about any 'should we keep funding this' proposal, what a good answer to each looks like, and where the list stops with a no; an entry test for before a project starts or before I raise my own paddle, since I suspect most of the damage is done at that moment; and the places where the procedure hands the decision to a human because it's politics or values rather than arithmetic. Then run it on three cases: the pool (70% done, 40% over budget, genuinely worth having when finished, but we've cut everything else to pay for it), a charity-auction bidding war over a weekend cabin stay where both top bidders pay, and our org's half-finished custom donor database where the vendor keeps asking for one more payment.

  Two things it has to handle honestly. Sometimes continuing really is right and the mistake was upstream, so I don't want a rule that mechanically says quit. And sometimes being known as someone who never backs down is worth real money, so I don't want to be talked out of that either. Tell me what the procedure can't do, and where it'll give me an answer I won't like.
reasoning: |-
  Okay, the user is a volunteer treasurer for a nonprofit and also on their town's capital projects committee. They're frustrated because sunk cost arguments aren't working in meetings where projects are over budget and half-finished. People always have reasons to continue, like not wanting to waste what's already spent or looking incompetent. They saw a similar pattern in a charity auction where two bidders paid way too much, with the loser getting nothing. 

  The user wants a practical decision-making procedure for 45-minute meetings without spreadsheets or analysts. They need a list of questions to evaluate whether to continue funding a project, an entry test for starting projects or bidding, and acknowledgment of when decisions are political or value-based. They also want the procedure applied to three cases: a pool, a charity auction, and a donor database project. 

  First, I need to address the core issue: escalation of commitment. The user mentions that "sunk cost" arguments are ineffective because proponents have valid points like reputational damage or contractual obligations. So, the procedure must distinguish between rational reasons to continue and stubbornness. 

  The user suspects they've been too quick to kill projects. They want a balanced approach that doesn't automatically favor quitting. Also, they acknowledge that sometimes a reputation for not backing down has value. The procedure must handle that.

  Breaking down the requirements:
  1. **Decision Questions**: A step-by-step list with clear yes/no outcomes. Each question needs a "good answer" definition and a stopping point for "no."
  2. **Entry Test**: A pre-commitment checklist to prevent bad starts.
  3. **Human Judgment**: Identifying where politics or values override the analysis.
  4. **Case Applications**: Testing the procedure on the pool, auction, and database.

  Key concepts from decision theory:
  - **Sunk Cost Fallacy**: Continuing just because of past investments.
  - **Rational Continuation**: When future benefits outweigh future costs, despite past losses.
  - **Escalation Drivers**: Psychological (loss aversion), social (reputation), structural (contract penalties).
  - **All-Pay Auctions**: Like the charity auction, where bidders pay regardless of winning, leading to overbidding.

  For the decision questions, structure them to first filter out projects where stopping is mandatory (legal/contractual), then assess future costs vs. benefits, and finally check for better alternatives. The entry test should focus on pre-commitment validation: clear scope, budget buffers, and exit clauses.

  The user's deeper needs:
  - **Practicality**: Must work in short meetings with non-experts.
  - **Authority**: Needs a structured process to challenge emotional arguments.
  - **Balance**: Avoids both wasteful continuation and premature termination.
  - **Reputation**: Preserves the option to continue for strategic reasons.

  For the cases:
  - **Pool**: High future costs but high benefits. The procedure should highlight the opportunity cost (what else could be done with the funds).
  - **Auction**: Pure all-pay auction dynamics. The entry test should warn bidders about the structure.
  - **Database**: Vendor dependency. The procedure might reveal that future costs are too high compared to switching.

  The procedure must explicitly state limitations: it can't quantify reputational damage perfectly or handle purely political decisions. Also, it might recommend quitting projects that are emotionally hard to abandon.

  I need to build a logical flow in the questions:
  1. **Mandatory Stop**: Are there legal/financial cliffs? If yes, proceed only if unavoidable.
  2. **Future Cost vs. Benefit**: Focus on incremental investment and returns.
  3. **Alternatives**: Compare with other uses of resources.
  4. **Reputation/Strategy**: Subjective assessment by humans.

  The entry test should include:
  - Scope definition
  - Budget contingency
  - Clear milestones
  - Exit clauses
  - "Sunset" review points

  For the auction case, the entry test would advise against participating in all-pay auctions unless the bidder has insider info. The decision questions don't apply because once in, bidders are trapped.

  Applying to the database: likely a "no" because future costs are undefined and vendor lock-in is high. But the organization might continue due to switching costs.

  The user needs to accept that the procedure might give unpopular answers, especially when recommending termination of pet projects. The key is making the implicit trade-offs explicit.
answer: |-
  ### Expert Framework: Escalation of Commitment & All-Pay Auctions  
  Your core insight is correct: **sunk costs aren't irrelevant**—they create *commitment leverage* (e.g., reputational harm, contractual penalties) that can make continuation rational. The trap isn't ignoring sunk costs; it's failing to isolate *future* costs/benefits and alternatives. Below is a battle-tested 45-minute procedure based on **decision theory** (Staw’s escalation framework) and **auction design** (all-pay contests like your fundraiser).  

  ---

  ### **I. The Procedure: 5 Questions to Kill or Continue**  
  **Rules:**  
  - **Timebox:** 2-5 min per question. Total time: 10-25 min.  
  - **Vote after Q3** if consensus is clear; proceed to Q4/Q5 only if contested.  
  - **Stop at first "no"** unless Q1-Q2 force continuation.  

  | # | Question | "Good Answer" (Continue) | "Bad Answer" (Kill) | Rationale |
  |--|--|--|--|--|
  | **Q1** | **"If we stop NOW, what legally/financially blows up? (e.g., penalties, clawbacks, lawsuits)"** | *Specific, unavoidable disaster:* "Contractor sues for $X > future costs," "Grant requires repayment." | *Manageable fallout:* "We lose sunk funds but no new liabilities," "Contractor walks but we keep site." | Tests for *forced continuation*. Sunk costs matter only if they trigger catastrophic future costs. |
  | **Q2** | **"What’s the FUTURE cost (only new cash/time) to finish vs. FUTURE benefit (tangible value)?"** | *Future benefit > future cost:* "Need $50K more for a $200K/year pool revenue stream," "Database saves $10K/month in staff time." | *Future cost > future benefit:* "$200K more for a pool worth $100K/year," "Database needs $50K but only saves $5K/month." | Isolates *marginal economics*. Ignore sunk costs! Future benefit must justify *new* spend. |
  | **Q3** | **"What’s the BEST alternative use of these resources? (e.g., scrap and pivot)"** | *Current project > alternatives:* "Finishing pool beats building a cheaper park (lower public value)," "Database beats buying off-the-shelf SaaS." | *Alternatives dominate:* "$200K could build two needed clinics," "SaaS database costs 1/5th and works now." | Opportunity cost test. If alternatives yield higher ROI, quitting is rational. |
  | **Q4** | **"Is there a STRATEGIC reason to continue? (e.g., reputation, learning, avoiding precedent)"** | *Credible, quantified upside:* "Cancelling loses a key donor who funds 30% of our ops," "Completing builds trust for future bonds." | *Vague or emotional:* "We’ll look bad," "We’ve always finished projects." | Forces concrete stakes. "Never backing down" is valid ONLY if it secures future value (e.g., deterring contractor exploitation). |
  | **Q5** | **"Can we renegotiate? (e.g., descope, new vendor, pause)"** | *Viable compromise:* "Vendor agrees to fix database for $10K not $50K," "Build basic pool now, add slides later." | *Rigid terms:* "Vendor demands full payment," "No scope reduction possible." | Tests for flexible off-ramps. If renegotiation fails, kill. |

  **Where Humans Take Over:**  
  - **After Q4:** If strategic stakes are high but unquantifiable (e.g., "This will destroy public trust"), elected officials vote.  
  - **After Q5:** If renegotiation is political (e.g., firing a connected vendor), committee debates.  

  **Procedure Outputs:**  
  - **Kill:** "No" at Q2, Q3, or Q5.  
  - **Continue:** "Yes" at Q1 + Q2, OR "Yes" at Q2 + Q4 (if strategic).  
  - **Renegotiate:** "No" at Q2/Q3 but "Yes" at Q5.  

  ---

  ### **II. Entry Test: The "Pre-Mortem" (Pre-Project or Pre-Bid)**  
  **5-Minute Checklist Before Commitment:**  
  1. **Scope/Budget Rigor:** "Is the scope fixed? Is there 20-40% budget buffer for overruns?"  
  2. **Kill Clause:** "Can we exit cheaply at milestones? (e.g., 30%/60%/90% completion)"  
  3. **Sunset Trigger:** "If we hit [X% over budget] or [Y months late], project auto-pauses for review."  
  4. **Vendor/Contract Sanity:** "Are payments tied to deliverables? Is the vendor replaceable?"  
  5. **All-Pay Auction Red Flag:** "In bidding, am I paying even if I lose? If yes, set MAX bid = 50% of value."  

  **Why it works:** Pre-commits to exit options. In all-pay auctions (your fundraiser), bidders *should* cap bids at < item value. Your losers overpaid because they ignored the "both pay" rule.  

  ---

  ### **III. Case Applications**  
  **1. The Pool (70% done, 40% over budget, high value when finished)**  
  - **Q1:** "Stop now? Contractor sues for $100K." → *Bad (forces continue)*  
  - **Q2:** "Future cost: $200K. Future benefit: $150K/year revenue." → **Bad (cost > benefit → STOP or renegotiate)**  
  - **Q3:** "Best alternative? $200K could repurpose as a community center." → *Debatable*  
  - **Q4:** "Strategic? Cancelling loses voter trust for next bond." → *Good, but must quantify*  
  - **Q5:** "Renegotiate? Descope to basic pool, save $80K." → **Yes → RENEGOTIATE**  
  **Verdict:** Don’t kill—descope. Sunk costs forced continuation (Q1), but economics demand compromise.  

  **2. Charity Auction (All-pay bidding war for cabin stay)**  
  *Entry Test Applied:*  
  - "Bidder pays even if losing? **Yes** → Max bid = 50% of cabin value ($500)."  
  - **Why:** In all-pay auctions, rational bids are *below* value. Your bidders ignored this, escalating to 5x value. Once bidding starts, Q2 (future cost: bid amount, benefit: win chance) fails unless you’re certain to win.  
  **Verdict:** Never enter without a cap. If already bidding, stop after 2 raises.  

  **3. Custom Donor Database (Half-finished, vendor demands more cash)**  
  - **Q1:** "Stop now? Vendor keeps code, but no penalties." → *Good (no block)*  
  - **Q2:** "Future cost: $50K? Future benefit: Saves $5K/month." → **Bad ($50K > 2 years of benefit → STOP)**  
  - **Q3:** "Best alternative? Buy SaaS for $10K/year." → **Better → KILL**  
  - **Q4/Q5:** N/A (Q2/Q3 kill it).  
  **Verdict:** Terminate. Vendor lock-in isn’t fatal; switching is cheaper.  

  ---

  ### **What the Procedure Can’t Do**  
  1. **Quantify Reputational Harm:** If "looking weak" loses future grants, continuation may be rational. The procedure flags this (Q4) but can’t calculate it—humans must vote.  
  2. **Fix Upstream Dysfunction:** A project killed by Q2 (future cost > benefit) was doomed by bad entry checks. The procedure exposes this but won’t prevent it.  
  3. **Override Values:** A money-losing pool might continue if "town identity" outweighs economics. Q4 allows this but forces explicit trade-offs.  
  4. **Handle Pure Politics:** If a mayor demands completion for reelection, the procedure will say "kill" (Q2/Q3), but you may override it.  

  ### **Why You’ll Hate It Sometimes**  
  - **It kills "worthwhile" projects:** If future costs exceed benefits (Q2) *and* alternatives are better (Q3), quitting is rational—even if it feels like surrender.  
  - **It forces hard numbers:** Vagueness ("the pool is vital!") fails Q2/Q3. You must demand data.  
  - **It admits stubbornness can be right:** Q4 validates "never back down" if it protects long-term leverage (e.g., deterring contractor extortion). But you must prove it.  

  ### **Final Tip**  
  Bring a physical **red card / green card** to meetings. For each project, hold up cards as you run the questions: forces clarity and speed. You’re not the sunk-cost hammer—you’re the escalation surgeon.
