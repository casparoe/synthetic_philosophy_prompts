  For both X and Y, if the action were forbidden (e.g., if the clinic had a policy against volunteering for extra shifts without authorization), they would not volunteer. So both would respect the duty if it forbade the act.

  But (B) requires that the agent would not have acted against duty. So both meet that condition.

  Therefore, (B) would grant moral worth to both X and Y because they both did the right thing and they both would not have done it if it were forbidden.

