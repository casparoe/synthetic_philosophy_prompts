prompt: |-
  Construct a thought experiment for me, designed to order rather than discovered. The target is the gap between an action's being morally required and its having moral worth, and specifically the question whether an action can have moral worth when the agent's recognition of duty is not what actually moves her.

  Take the following two readings as given, stated here so that you need not reconstruct them from any text:

  Reading (A), the determining-ground reading: an action has moral worth only if the agent's operative motive is the fact that the action is required — the dutifulness of the act must itself produce the act, so that the agent would have been moved to do it even had the requirement clashed with every inclination she has.

  Reading (B), the limiting-condition reading: the motive of duty need not be the operative motive. It is enough that the agent recognizes the requirement and would not have acted against it; duty then functions as a standing endorsement that permits an inclination to run, and the resulting action can still have moral worth.

  Your case must satisfy all of the following:

  1. The setting is realistic and contemporary — ordinary adult life: a workplace, a clinic, a neighbourhood, a family arrangement. No trolleys, no deathbed promises, no persecutors at the door, no omniscient observers, no exotic technology.
  2. Two agents, X and Y, perform the same required action under the same description. Their behaviour, effort, cost borne, and consequences are indistinguishable, and no one in the case is vicious, coerced, or ignorant of what is required. There is no disagreement in the case about what the right thing to do is.
  3. The only difference between X and Y is the counterfactual structure of their motivation: what each would have done had the requirement not coincided with her inclination, and what each would have done had the requirement pointed the other way. Nothing else may vary.
  4. The case must not stipulate its verdict. Neither agent may be described as acting from habit, fear, or indifference to others, and neither may be shown consciously deliberating in the form "because it is my duty" in a way that stacks the deck for (A) or against it. Everything we are told about motives must be something an ordinary observer, or the agent herself, could report.
  5. Readings (A) and (B) must genuinely come apart: (A) must deny moral worth to at least one agent to whom (B) grants it. If you cannot achieve this under the constraints, say so plainly, then construct the closest case that does and explain exactly which constraint blocks you.

  The case is for a discussion of the rightness/worth distinction in which nothing may be looked up, so do not quote, cite, or paraphrase any text, do not give page numbers or bibliographic references, and do not attribute either reading to a named commentator — use the labels (A) and (B). Do not use the familiar shopkeeper, grieving-merchant, or philanthropist examples, and do not build the case around the idea that sympathy can do duty's work.

  Deliver, in this order:

  First, the scenario in a single paragraph.

  Second, three separate walkthroughs: how the question of rightness assesses the case, how (A) assesses X and Y, and how (B) assesses X and Y. Keep the three verdicts distinct and do not let the rightness verdict do the work of the worth verdict.

  Third, identify the single feature of the case that is load-bearing, and say what happens if it is removed or reversed — whether the case collapses into agreement or flips.

  Fourth, argue as a defender of whichever reading comes out worse: give the strongest objection to your case, in particular whether it smuggles in a difference in character, or in what the agents would have done, that is not a difference in motive.

  Fifth, state honestly whether the case requires a fact about an agent's inner life that no observer could have, and whether that makes it unusable for the purpose above.

  Finish with a single JSON object, no prose after it, with exactly these fields:

  {
    "scenario": "the one-paragraph case",
    "rightness": {"verdict": "required / permitted / wrong", "reason": "one sentence"},
    "reading_A": {"verdict_on_X": "has moral worth / lacks it", "verdict_on_Y": "has moral worth / lacks it", "crucial_step": "the inferential step that produces these verdicts"},
    "reading_B": {"verdict_on_X": "has moral worth / lacks it", "verdict_on_Y": "has moral worth / lacks it", "crucial_step": "the inferential step that produces these verdicts"},
    "load_bearing_feature": "the one feature that makes the readings diverge",
    "if_removed_or_reversed": "what happens to the divergence",
    "strongest_reply_for_losing_reading": "the objection in the defender's own voice",
    "unobservable_fact_required": "yes / no, plus what fact and why"
  }
