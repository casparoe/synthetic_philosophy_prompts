  In a neighborhood recycling program, residents are required to sort their recyclables properly. The action is to take the time to correct a neighbor's recycling bin that has been contaminated with non-recyclable waste, which the agent notices while walking by. The agent knows that if left uncorrected, the entire bin might be rejected by the collection service, causing inconvenience to the neighbor and harm to the environment. Both X and Y correct the bin. They both spend the same time and effort, and the result is the same.

