  In the actual case, the shift is required and moderately inconvenient but not extremely so. For Y, the independent inclination is enough to motivate even without the duty, but the duty alone (without the inclination) would not be enough to overcome a strong contrary inclination.

  For X: 
  - Without duty, X wouldn't do it (because the moderate inconvenience would deter X without duty). 
  - With duty and strong contrary inclination, X would still do it because duty moves X.

  Now, the actual case: both do it. Both experience moderate inconvenience. They both know it's required and they do it.

  Now, according to (A): 
