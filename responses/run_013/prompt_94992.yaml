  Scenario:

  In a community health clinic, a staff member calls in sick for a weekend shift. The clinic's policy states that when this happens, other staff members are expected to volunteer to cover if they are able. The shift is moderately inconvenient for everyone, as it requires giving up leisure time. Two staff members, X and Y, both volunteer and work the shift. They both put in the same effort, and the clinic's operations continue smoothly. Both are aware of the policy and the need, and both agree that covering the shift is the right thing to do.

  Now, the counterfactual differences (which must be reportable by the agents or an observer, but not as conscious deliberation):

  For X: 
  - X does not have a particularly strong desire to help beyond what is expected. If there were no policy and the shift were purely optional, X would not volunteer because the leisure time is more appealing. However, if the shift had been on a major holiday (so that it conflicted with important plans and was very unpleasant), X would still have volunteered because of the policy and the duty to patients.

  For Y: 
  - Y has a strong independent desire to help patients and support the clinic. Even if there were no policy, Y would volunteer for the shift because of this desire. However, if the shift had been on a major holiday (conflicting with important plans, making it very unpleasant), Y would not have volunteered. The thought is: "I love helping, but I can't miss this family event; they'll manage without me." So, in that case, the strong contrary inclination overrides the sense of duty.

  An observer might report: 
  - X seems to be motivated by a sense of obligation to the job and patients, and would step up even when it's very hard. 
  - Y is very enthusiastic about the work and helps whenever possible, but if it's too costly, Y might not.

  But we must avoid explicit motive attributions. Instead, we can use counterfactual behavior that an observer could know from past actions or from the agent's own testimony (if they were honest).

  But the case must not describe the agents as acting from habit, fear, or indifference. We are not saying they deliberate about duty.

  We can present the counterfactuals as facts about their dispositions.

  Now, the walkthroughs:

  Rightness: The action is required. Both agents do it. So the action is right.

  Reading (A): 
  - For X: The operative motive is duty. X would have acted even in the face of contrary inclinations (as in the holiday counterfactual). So X's action has moral worth.
  - For Y: The operative motive is inclination. In the counterfactual where duty clashed with strong contrary inclination (holiday), Y would not have acted. So Y's action lacks moral worth because it was not moved by duty.

  Reading (B):
  - Both agents recognize the duty and would not act against it (if the shift were forbidden, they wouldn't volunteer). The duty functions as a limiting condition. For Y, the motive is inclination, but it is permitted by duty. So both have moral worth.

  Load-bearing feature: The counterfactual where the requirement is present but the agent has a strong contrary inclination. For that situation, X would still act and Y would not.

