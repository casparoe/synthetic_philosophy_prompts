answer: |-
  Your hypothesis cuts to the bone of the dispute. The impasse isn't primarily about textual exegesis or logic—it's a **clash of implicit philosophical frameworks** concerning the *status of philosophical language itself*. Here's a structural diagnosis, argued from each side's commitments:

  ### Core of the Disagreement: The Function of "Conventional Truth" (Saṃvṛtisatya)
  1. **Descriptive vs. Normative Tension (Your Hypothesis Confirmed)**  
     - **Metaphysical Reading (e.g., Svātantrika-leaning)**: "Conventional truth" functions **descriptively** as *the domain of dependently originated phenomena*. Emptiness (śūnyatā) is the ultimate fact *about* these phenomena. The tetralemma negates inherent existence to establish this metaphysical truth.  
     - **Therapeutic Reading (e.g., Prāsaṅgika-leaning)**: "Conventional truth" functions **normatively** as *a rule of discourse*. It signals what can be *pragmatically asserted* without ontological commitment. The tetralemma isn't establishing emptiness as a thesis; it's *performing* the dissolution of all views, including "emptiness" as a reified concept.  

     This duality creates irreconcilable interpretations:  
     - For the metaphysical camp, denying that emptiness is "ultimate truth" contradicts Nāgārjuna's critique of svabhāva.  
     - For the therapeutic camp, *asserting* emptiness as ultimate truth reifies it into a new svabhāva, violating Nāgārjuna's warning that "emptiness itself is empty."  

  2. **The Role of Logic: Collapsing vs. Constructing**  
     - **Prāsaṅgika (Argument by Consequence)**: Logic is solely *destructive*. You expose contradictions in the opponent's position without asserting independent premises. "Conventional truth" here is purely normative: it’s the *agreed-upon framework* for dialogue, not a description of reality. Progress is measured by relinquishing views.  
     - **Svātantrika (Autonomous Inference)**: Logic can *constructively demonstrate* emptiness using mutually accepted conventions. "Conventional truth" has descriptive content: it captures how phenomena *operate* interdependently. Emptiness is the ultimate fact *underlying* these conventions.  

     **Result**: Svātantrikas see Prāsaṅgikas as nihilists (denying all grounds for knowledge); Prāsaṅgikas see Svātantrikas as crypto-essentialists (smuggling in a "true" reality via logic).  

  ### Why Convergence Fails: Hidden Starting Points
  - **The Metaphysical Camp's Implicit Commitment**: *Philosophy must describe reality's structure.* Even emptiness, as the absence of essence, is a structural feature. Rejecting this collapses into incoherence.  
  - **The Therapeutic Camp's Implicit Commitment**: *Philosophy is a practice to cure attachment to views.* Any positive description (even of "emptiness") becomes a metaphysical trap. Language is strictly instrumental.  

  These commitments are **pre-argumentative**. They're not derived from Nāgārjuna’s text but brought *to* it. The text’s ambiguity (e.g., "I have no thesis" vs. "All things are empty") allows both readings to find support.  

  ### The Physics Parallel: Effective Theories Revisited
  Your analogy is apt. The dispute mirrors the realism/antirealism debate in science:  
  - **Metaphysical Reading** = **Realism about Effective Theories**:  
    Conventional truth describes *real patterns* of dependent arising at a pragmatic level. Emptiness is the fundamental law (like quantum fields underlying classical physics).  
  - **Therapeutic Reading** = **Instrumentalism about Effective Theories**:  
    Conventional truth is a *tool* for navigating experience, not a description of "reality." Emptiness isn’t a law—it’s the *realization* that all models are context-dependent and disposable.  

  Here, the camps *are* answering different questions:  
  - **Metaphysical Q**: "What is the ultimate nature of reality?"  
  - **Therapeutic Q**: "How do we liberate the mind from reification?"  

  ### What Would Count as Progress?
  1. **A Distinction**: Separating two senses of "conventional truth":  
     - **C1 (Descriptive)**: The observable world of cause, effect, and language.  
     - **C2 (Normative)**: The epistemic rules for non-referential assertion.  
     Admitting that Nāgārjuna uses both (often ambiguously) defuses the "contradiction" each side finds in the other.  

  2. **A Change of Question**: Shifting from *"What does Nāgārjuna assert?"* to *"What work does this text perform?"*  
     - The therapeutic view gains traction if Madhyamaka is seen as a *practice* to induce insight.  
     - The metaphysical view persists if seen as an *analysis* of reality.  
     Progress requires agreeing on whether the goal is *ontology* or *soteriology*.  

  3. **Formalization (With Caution)**: Mapping the tetralemma’s logic to modern paraconsistent or non-classical systems could clarify its function. Example:  
     - The tetralemma as a **boundary marker** for meaningful assertion: Rejecting all four corners exposes the limits of conceptual thought, without positing a "fifth option."  

  ### Why Progress May Be Unlikely
  - **Textual Indeterminacy**: Nāgārjuna deliberately uses paradoxical language to avoid fixation. Any "resolution" might betray his intent.  
  - **Soteriological Stakes**: For traditionalists, accepting the other view risks undermining the path to enlightenment (e.g., reifying emptiness vs. denying its soteriological power).  
  - **Foundational Intuitions**: The realism/antirealism divide in philosophy is notoriously resilient. It reflects deeper cognitive orientations.  

  ### Conclusion: Two Projects Under One Name
  The dispute is **substantive but not about metaphysics per se**. It’s about the *purpose of philosophy*:  
  - Is Madhyamaka a *theory of reality* (metaphysical reading)?  
  - Or is it a *therapy for conceptual attachment* (therapeutic reading)?  

  Your diagnosis is correct: The deadlock is sustained by unspoken disagreements about **norms of assertion** and **what counts as "truth"** in a soteriological context. Progress would require both sides to explicitly acknowledge that they are engaged in *different projects*—one descriptive, the other normative—using the same textual apparatus. Until then, they’ll continue talking past each other, each convinced the other misses the point. 

  This isn’t a flaw but a feature of a tradition that seeks to uproot all fixed positions—including its own.
