answer: |-
  **MEMORANDUM**  
  **TO:** Members, Policy Committee, State Sentencing Commission  
  **FROM:** Chair, Policy Committee  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation on Amendment 9 (Proposed Elimination of Culpability Score and Desert Rationale)  

  **RECOMMENDATION:** Reject Amendment 9 in its current form. The Culpability Score and desert rationale should be retained in the guidelines. However, direct staff to develop a separate proposal for mitigating severe childhood deprivation within the *application* of the Culpability Score framework, to be presented at the next quarterly meeting.  

  ---

  ### I. ANALYSIS OF THE PHILOSOPHICAL ARGUMENT  
  The argument attributed to Galen Strawson, as presented in the supporting memorandum, merits serious engagement. It contends that desert is impossible because:  
  (i) Actions stem from one’s inherent nature;  
  (ii) Desert requires responsibility for that nature;  
  (iii) No one can be responsible for their nature (as this demands self-creation *ex nihilo*);  
  (iv) Therefore, desert is illusory.  

  **Critical distinctions must be drawn to evaluate this:**  
  1. **Step (i) Interpretation:**  
     - *Causal Reading (Strongest for Proponent):* If step (i) asserts that actions are *deterministically caused* by prior states (genetics, environment), the argument gains force against libertarian free will (where agents cause acts independently of prior states).  
     - *Agency Reading (Weakest for Proponent):* If step (i) merely describes agency as expressing one’s character *through reasoning*, it does not preclude desert. Most retributive theories rely on this: an offender "deserves" blame when their act reflects a *reasons-responsive choice* (e.g., knowing assault is wrong but choosing it).  

  2. **Desert’s Requirements:**  
     - The amendment’s rationale assumes desert demands *ultimate self-authorship* (creating one’s own character from nothing). However, our preamble’s desert principle is plausibly grounded in *contemporary compatibilism*: an offender deserves censure if their act reflects a *quality of will* they could have governed by reasons (e.g., refusing to restrain violent impulses when capable of doing so). This requires no metaphysically impossible self-creation.  

  3. **Scope of the Argument’s Success:**  
     - The argument *strongly challenges libertarian desert* (which our guidelines do not invoke).  
     - It *does not refute compatibilist desert*, which depends only on an agent’s capacity for reason-guided behavior at the time of the offense—not on authorship of their entire character. Thus, it leaves intact the rationale underlying most sentencing guidelines.  

  **Conclusion:** The argument is strongest when attacking libertarian desert but weakest against the compatibilist foundation actually embedded in our guidelines.  

  ---

  ### II. THE "PROVES TOO MUCH" OBJECTION  
  If the argument succeeds, it imperils not just punitive desert but *all* desert-based judgments:  
  - **Praised Deserts:** We commend offenders who rehabilitate, implying they *earned* admiration through effort. Parole "earned release" programs presuppose that good conduct *deserves* reward.  
  - **Moral Accountability:** Probation officers’ accountability-focused interventions assume offenders can *take responsibility* for future choices. Everyday moral criticism (e.g., blaming a dishonest friend) relies on similar assumptions.  

  **This is not a cost to accept but evidence of overreach:**  
  - The argument, if universalized, collapses distinctions between blame/praise and causation/excuse. We consistently treat *mitigating factors* (e.g., childhood deprivation) as reducing—not eliminating—desert because they impair reasons-responsiveness. This reflects compatibilist practice: we hold people accountable *unless* their capacity for rational self-governance was severely compromised.  
  - Rejecting desert *tout court* would force the commission to abandon core sentencing practices (earned release, culpability mitigations) it endorses elsewhere.  

  ---

  ### III. INSTITUTIONAL LEGITIMACY AND DESERT LANGUAGE  
  Even if metaphysical doubts persist, retaining desert language is permissible provided:  
  1. The commission transparently acknowledges competing views exist;  
  2. The concept serves a defined, legitimate public function.  

  **This is not a "noble lie" but an endorsement of a contested moral framework:**  
  - Desert language *expresses societal condemnation* of wrongful acts, affirming victims’ dignity and reinforcing normative boundaries.  
  - It *motivates compliance* by treating citizens as reason-responsive agents, not mere objects of risk management.  
  - **Distinction from Noble Lie:** A noble lie deceives to preserve stability. Here, the commission would *reasonably endorse* one credible view (compatibilism) while acknowledging dissent—as legislatures do when criminalizing acts despite free will debates.  

  **If the commission cannot resolve the metaphysics, it must:**  
  - Default to the moral framework underlying existing law (which presupposes desert);  
  - Ensure the guidelines reflect *practical moral distinctions* (e.g., mitigating punishment for severe deprivation) without discarding the architecture of culpability.  

  ---

  ### IV. STRONGEST CASE FOR AMENDMENT 9  
  Proponents persuasively argue that rigid application of the Culpability Score risks injustice in cases like the severe childhood deprivation case. If our desert framework truly requires impossible self-authorship, retaining it *validates unearned suffering*. Even if compatibilist desert is coherent, mechanistic scoring may overlook how extreme deprivation impairs an offender’s capacity for reasons-responsive agency. A purely forward-looking system (focusing on risk, rehabilitation, and deterrence) avoids this by tailoring sentences to individual circumstances without retributive constraints. It accepts that no one "deserves" suffering but imposes sanctions only to prevent future harm—a more humane and scientifically defensible approach.  

  **Evidence That Could Alter Recommendation:**  
  If empirical evidence demonstrated that *retaining desert language* materially impedes rehabilitation or disproportionately harms deprived offenders (e.g., by fostering resentment), the commission should reconsider. No such evidence is currently before us.  

  ---

  ### V. CONCLUSION  
  Amendment 9 correctly challenges the commission to address profound questions of agency and justice. However, it overstates the metaphysical vulnerability of our desert foundation and underestimates the costs of abandoning culpability as a limiting principle. The Culpability Score should be retained but refined to address severe deprivation. **Vote: REJECT.**  

  *Attachment: Summary of Voting Options*  
  ☑ **REJECT** Amendment 9 (Retain Culpability Score & Desert Rationale; Develop Deprivation Mitigation Proposal)  
  ☐ **ADOPT** Amendment 9 (Remove Culpability Score & Desert Rationale)  
  ☐ **ADOPT with Conditions** (e.g., Retain Culpability Score as Non-Binding Factor)  

  ---  
  **Approx. 990 words**
