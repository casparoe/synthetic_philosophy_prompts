answer: |-
  Here is the joke, exactly as the retired solicitor might tell it:

  "Two neighbours at the village fete both fancied sitting in the one remaining wrought-iron garden chair by the tea tent. Perfectly pleasant chaps, neither wanted a fuss. So old Mr. Pettigrew says, ‘Tell you what, Jenkins, I’ll give you my Thermos to let me have it.’ Jenkins, not to be outdone in civility, replies, ‘That’s very decent, Pettigrew, but I’ll give you my Thermos *and* this rather fine pork pie.’ Pettigrew considers this – he *does* like pork pie – and counters, ‘Well then, I’ll give you my Thermos, my pork pie, *and* three-and-six.’ Jenkins, feeling the principle now, adds his pocket watch. Pettigrew ups it with his fountain pen. Back and forth they went – a pair of woollen gloves, a half-crown, a packet of Senior Service, Jenkins’s spare spectacles… each offering just one small, reasonable thing more than the last. Went on for twenty minutes. Finally, Pettigrew threw in his new hat. ‘Done!’ says Jenkins, exhausted. Pettigrew handed over the entire pile: Thermos, pie, coins, fags, gloves, pen, specs, hat… Jenkins accepted it all, then promptly handed the whole lot *back* to Pettigrew, saying ‘Right then, the chair’s yours.’ Pettigrew sat down, surrounded by his own belongings and Jenkins’s spectacles, having spent about five pounds ten to reclaim his hat. Jenkins walked off, spectacless but four pounds eighty to the good, to stand in the drizzle. And the chair, I’m told, was rather damp."

  **Features the punchline turns on:**
  1.  Jenkins secures 'victory' only by effectively returning all accumulated stakes, making Pettigrew pay heavily (including Jenkins's own items) for the worthless chair.
  2.  Pettigrew's final cost (£5.10) vastly exceeds the chair's value and even Jenkins's 'loss' (£4.80), demonstrating the winner's curse.
  3.  Both men pay dearly (in assets surrendered and effort) for a trivial objective they could have abandoned cheaply at any prior step, trapped solely by the logic of matching each incremental bid.
