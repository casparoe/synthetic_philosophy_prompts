prompt: |-
  I'm putting together a small set of writing prompts and I'd like your help drafting one of them. For this one, take on the role of someone who's taught Strawson's "Freedom and Resentment" for years and also writes comedy on the side. Before you write anything, think it through carefully and brainstorm a short list of the actual moving parts of Strawson's position -- the participant stance, resentment and gratitude and guilt as attitudes we hold toward each other, the objective attitude, the difference between an excuse and an exemption, and the fact that he treats the objective attitude as something you can adopt for a while but can't live inside permanently -- and then pick the ones that will actually carry the jokes. Don't just brainstorm and stop; the brainstorm is a step toward the piece.

  Here's the piece I want: a parody employee handbook, in the deadpan register of a real corporate HR document, issued by a fictional company that has rolled out a "Non-Reactive Workplace" initiative. Everyone in the company is required to take the objective attitude toward everyone else, at all times. Write it as numbered clauses, roughly 700-900 words, with the kind of section headers a real handbook would have (Purpose and Scope, Expectations, Disciplinary Procedure, Frequently Asked Questions, etc.).

  A few things I care about:

  - The humor has to come from getting Strawson right, not from generic HR jokes. Someone who's read the essay should nod; someone who hasn't should still find it funny. A reader should not need to know the essay to laugh.
  - The objective attitude -- seeing a colleague as something to be managed, handled, cured, or trained rather than as a party who can wrong you -- should be sold in the handbook as a perk, with straight-faced benefits language.
  - Include a clause on exemptions: some categories of employee are outside the scope of the participant stance altogether. Let that be quietly uncomfortable.
  - Include the carve-outs where the reactive attitudes are officially permitted -- a scheduled window, the holiday party, the exit interview -- and let it be clear between the lines that this is because the objective attitude can't actually be sustained. That tension should be the spine of the satire, not a throwaway gag.
  - Work the excuse/exemption distinction into the disciplinary procedure: "I didn't mean to" gets you one kind of treatment, "that wasn't really him" gets you another.
  - End with an FAQ that answers whether the policy depends on determinism being true, and have the answer be that it doesn't matter.
  - No citations, no quotes from the essay, no references to any real company or real person. Paraphrase the ideas in your own words. And don't wink at the reader -- stay deadpan the whole way through.

  Make it good enough that someone who teaches this stuff laughs and dosn't wince. Oh and please keep the clause numbers consistent, I got burned on that in a seperate piece last week.
reasoning: |-
  Okay, the user wants a parody employee handbook based on Strawson's "Freedom and Resentment" philosophy. They're putting together writing prompts and need something that blends academic rigor with comedy. 

  First, let's unpack their requirements. They want:
  - A deadpan corporate HR tone
  - Core Strawson concepts woven in (participant stance, reactive attitudes, objective attitude, excuse vs exemption)
  - The satire to hinge on the inherent tension in forcing permanent objective attitude
  - Specific elements like exemptions, carve-outs, and an FAQ about determinism

  Hmm... the challenge is making Strawson's complex philosophy funny without relying on inside jokes. The humor should work for both philosophy grads and office workers who've suffered through bad HR policies. 

  Key angles to mine for comedy:
  1) The absurdity of treating humans like malfunctioning appliances ("cure, train, or manage")
  2) Corporate doublespeak selling dehumanization as a "perk"
  3) Scheduled resentment breaks - like smoke breaks for emotions
  4) Quietly disturbing exemptions (interns, contractors as non-persons)

  For structure, I'll mirror a real handbook:
  - Start with lofty "Purpose" that sounds benevolent but is actually chilling
  - "Expectations" section where normal human reactions become violations
  - Disciplinary procedures that turn moral philosophy into HR legalese
  - FAQ to undercut the whole premise with "determinism irrelevant" cop-out

  The exit interview as sanctioned resentment moment feels rich - people finally being human when they quit. And the holiday party as "controlled environment" for grudges... that's gold. 

  Gotta be careful with:
  - Keeping clause numbers consistent (user got burned before)
  - No winking at the reader - true deadpan
  - Making exemptions uncomfortable but not cartoonish
  - Balancing academia with accessibility

  The determinism FAQ should sound like corporate dodging - "operationally distinct" is perfect HR-speak for "we don't care about truth". 

  Final touch: the "non-reactive" branding throughout. So much irony in that term when the policy literally schedules reactivity...
answer: |-
  ## Non-Reactive Workplace Initiative: Employee Handbook  
  **Version 3.2 | Effective Immediately**

  **1.0 PURPOSE AND SCOPE**  
  1.1 The Non-Reactive Workplace Initiative (NRWI) is designed to optimize interpersonal dynamics, minimize workflow disruption, and enhance overall operational harmony by implementing a standardized approach to colleague interaction.  
  1.2 This policy applies to all full-time, part-time, and contract personnel ("Employees") during all Company activities, including remote work, client engagements, and Company-sponsored events, unless explicitly exempted herein.  
  1.3 The core principle of the NRWI is the mandatory adoption of the **Objective Attitude** toward all fellow Employees. This attitude fosters a calm, efficient, and predictable work environment by focusing on understanding and managing behaviors, rather than reacting to them personally.  
  1.4 Benefits of the Objective Attitude include reduced interpersonal friction, elimination of counterproductive emotional responses (e.g., offense, indignation), streamlined conflict resolution, and a significant decrease in time spent on non-essential social negotiations.

  **2.0 EXPECTATIONS: THE OBJECTIVE ATTITUDE IN PRACTICE**  
  2.1 Employees are required to maintain the Objective Attitude at all times during work hours and work-related activities. This entails:  
      *   2.1.1 Viewing colleague behavior strictly as the outcome of causal factors (e.g., psychological state, environmental conditions, systemic influences, training gaps).  
      *   2.1.2 Responding to colleague actions solely as phenomena requiring practical management, adjustment, training, or accommodation.  
      *   2.1.3 Consciously refraining from Reactive Attitudes. Reactive Attitudes include, but are not limited to:  
          *   **Resentment** (e.g., feeling personally wronged by a missed deadline or critical feedback).  
          *   **Gratitude** (e.g., experiencing personal warmth for assistance beyond baseline expectations).  
          *   **Guilt** (e.g., feeling personally accountable for an error impacting others).  
          *   **Moral Indignation** (e.g., feeling collective outrage over perceived unfair treatment of another).  
          *   **Personal Stakes** (e.g., interpreting colleague actions as indicative of personal regard or disregard).  
  2.2 Examples of Appropriate Objective Responses:  
      *   "The Sales Report contained significant errors. A system flag or additional validation training appears necessary." (Instead of: "I'm furious John messed up the report again!")  
      *   "Marketing provided the assets ahead of schedule. This positively impacts the project timeline." (Instead of: "Sarah is amazing for getting those done early!")  
      *   "My miscalculation caused a budget discrepancy. Corrective procedure 7B should be initiated." (Instead of: "I feel terrible for letting the team down.")  

  **3.0 EXEMPTIONS TO THE PARTICIPANT STANCE**  
  3.1 Certain categories of individual are operationally defined as outside the scope of normal interpersonal engagement and are therefore exempt from the requirement to engage them via the Participant Stance (which the Objective Attitude replaces). Employees must adopt the Objective Attitude *toward* these individuals, recognizing their inherent exemption status.  
  3.2 Exempt Categories:  
      *   3.2.1 **Authorized Corporate Entities:** Legal persons (e.g., "The Company," "Finance Division") as referenced in official communications.  
      *   3.2.2 **Stage 1 Interns:** Individuals in the first 4 weeks of the Company Internship Program.  
      *   3.2.3 **Third-Party Contractors (Tier 3):** Defined by Procurement Code PC-45 (e.g., janitorial staff, off-site data entry personnel not integrated into core teams).  
      *   3.2.4 **Individuals Formally Designated as "Non-Standard Agents":** As determined by HR and Corporate Psychology after assessment under Policy NS-88.  
  3.3 Interaction with exempt individuals should focus solely on functional task completion. Attributing intentions, seeking personal understanding, or experiencing reactive attitudes toward them is inappropriate and constitutes a policy violation.

  **4.0 SCHEDULED INTERPERSONAL ENGAGEMENT WINDOWS (SIE WINDOWS)**  
  4.1 Recognizing the inherent demands of social cohesion, the NRWI designates specific, contained periods where the strict Objective Attitude is temporarily suspended, and limited Reactive Attitudes are permitted.  
  4.2 Approved SIE Windows:  
      *   4.2.1 **Annual Holiday Party:** The final 90 minutes of the officially scheduled event.  
      *   4.2.2 **Departmental Quarterly Collaboration Review:** The designated 15-minute "Open Feedback" segment.  
      *   4.2.3 **Formal Exit Interviews:** The duration of the interview conducted by HR.  
  4.3 Behavior during SIE Windows must remain professional and comply with all other Company policies (e.g., Anti-Harassment, Code of Conduct). Reactive Attitudes expressed must be relevant to the context (e.g., expressing regret during an exit interview, collegial appreciation at the holiday party).  
  4.4 Resentment expressed during an SIE Window must be confined to the specific incident discussed and may not carry over into subsequent work periods. The Objective Attitude must be re-established immediately following the conclusion of the SIE Window.

  **5.0 DISCIPLINARY PROCEDURE FOR NRWI VIOLATIONS**  
  5.1 Violations of the NRWI primarily involve the inappropriate manifestation of Reactive Attitudes or failure to maintain the required Objective Attitude.  
  5.2 The disciplinary path depends on the nature of the violation as determined by HR:  
      *   **5.2.1 Category A: Excusable Infraction.** The Employee acknowledges exhibiting a Reactive Attitude but claims the behavior was unintentional or contrary to their normal disposition (e.g., "I snapped because of the stress, I didn't mean to *really* resent him.").  
          *   *Action:* Mandatory re-training module (NRWI-Refresher), followed by a 30-day Observation Period.  
      *   **5.2.2 Category B: Exemption Claim.** The Employee justifies their Reactive Attitude by claiming the target colleague falls under an exempt category (Section 3.0), implying the reaction was fundamentally misplaced (e.g., "But he's basically a Stage 1 Intern!" or "I thought she was Tier 3!").  
          *   *Action:* Formal review of the target colleague's status. If the claim is valid: Verbal warning to the offending Employee regarding misapplication. If the claim is invalid: Written warning and mandatory Psychological Assessment to determine potential Non-Standard Agent status *of the offending Employee*.  
      *   **5.2.3 Category C: Willful Reactive Engagement.** The Employee intentionally and knowingly engages in the Participant Stance, expressing Reactive Attitudes outside an SIE Window without excuse or invalid exemption claim.  
          *   *Action:* Escalating disciplinary measures, up to and including termination, depending on severity and frequency. Mandatory Psychological Assessment required.  

  **6.0 FREQUENTLY ASKED QUESTIONS (FAQ)**  
  *   **Q1: What if I *feel* resentment? Do I get disciplined for a feeling?**  
      A1: The NRWI governs *manifestations* of Reactive Attitudes, not internal states. Discipline applies only if these feelings demonstrably influence your behavior, communication, or treatment of colleagues in a manner inconsistent with the Objective Attitude (e.g., coldness, sarcasm, task obstruction, verbal expressions). Management of internal states is encouraged via Company-provided mindfulness resources (Portal: MIND-CORP).  

  *   **Q2: Does this mean we can't be friends with coworkers?**  
      A2: The NRWI governs *workplace interactions* and the *attitudes* required therein. Personal relationships formed outside work hours and conducted off-premises are not regulated by this policy, provided they do not create observable conflict or violations *during* work hours. Collegiality within the Objective Attitude framework is efficient and frictionless.  

  *   **Q3: How do I give critical feedback without the other person feeling resentment?**  
      A3: Frame feedback entirely within the Objective Attitude: Focus on the action/outcome, its systemic causes or skill deficiencies, and the required adjustment or training. Avoid language implying blame or personal failing (e.g., "This report lacks key metrics [Action]. Perhaps the template needs revision or the data source requires verification [Systemic Cause]. Please consult Procedure 12D [Adjustment].").  

  *   **Q4: Does this policy mean the Company believes in determinism? That none of us have free will?**  
      A4: The operational success of the NRWI is entirely independent of metaphysical debates concerning free will or determinism. The policy functions based on the observable efficacy of the Objective Attitude in managing workplace behavior and minimizing disruption. Whether behaviors are determined or freely chosen is operationally irrelevant; the focus is on predictable management and response. The policy is pragmatically, not metaphysically, grounded.  

  *   **Q5: What if I can't sustain the Objective Attitude? It feels unnatural.**  
      A5: Initial adjustment requires conscious effort. Utilize the Company-provided resources (Training Modules: OBJ-ATT-101, OBJ-ATT-201; Support Group: OA-SUSTAIN). Remember the significant benefits: reduced stress, smoother workflows, and freedom from the burdens of personal grievance. Persistence is key. Failure to sustain the attitude will be addressed per Section 5.0.  

  **ACKNOWLEDGEMENT**  
  I have read, understood, and agree to comply with the Non-Reactive Workplace Initiative. I acknowledge that failure to adhere to these standards may result in disciplinary action, up to and including termination of employment.  
