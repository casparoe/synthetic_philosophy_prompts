prompt: |-
  I chair a scientific advisory panel that must sign off, roughly monthly, on quantitative models used to support regulatory decisions — tax-incidence forecasts, integrated assessment models, projections of targeted public-health interventions. Panel members are mostly not modellers, we have about two hours per model, and our sign-off is what lets an agency act. Reviewers repeatedly invoke the idea — sometimes labelled the F-twist — that a model's assumptions need not be realistic provided its predictions are good enough; I find this discharges some objections and licenses worse ones. Please write a decision procedure my panel can run assumption by assumption to decide whether an unrealistic assumption is acceptable for the intended use: the questions to ask in order, what counts as a sufficient answer, when the assumption obliges us to restrict the model's scope rather than license extrapolation, and where the procedure stops and hands the decision to the panel as a value judgment. Build it around a distinction I want to preserve: an assumption can be read as a negligibility assumption (approximately true, the neglected factor is small), as a domain restriction (the model makes no claim where the assumption fails), or as a heuristic device (known false but useful for reaching a testable result) — and these readings license different uses of the same model. Then run it on three cases: a representative-agent assumption in a model used to forecast the distributional effects of a tax; a homogeneous-mixing assumption in a model used to project the effect of an intervention aimed at a small subpopulation; and a forward-looking rational-expectations assumption in a model used to forecast the effects of a novel policy rule. Include at least one case where the procedure rules against an assumption I would prefer to wave through, and mark plainly which steps are technical and which are judgment wearing technical clothes.
reasoning: |-
  We are constructing a decision procedure for evaluating unrealistic assumptions in quantitative models used for regulatory decisions. The procedure will revolve around three interpretations of an assumption: negligibility, domain restriction, or heuristic device. For each assumption, the panel will follow a sequence of questions to determine whether the assumption is acceptable for the intended use, and if so, under which interpretation. The procedure will also indicate when the model's scope must be restricted and when the decision requires a value judgment by the panel.

  The decision procedure:

  1. **Identify the assumption and its role in the model:**
     - What is the assumption? (e.g., representative agent, homogeneous mixing, rational expectations)
     - What role does it play in the model? (e.g., simplification, tractability, enabling a specific prediction)
     - What is the intended use of the model? (e.g., forecasting distributional effects, projecting intervention effects, forecasting under a novel policy)

  2. **Categorize the assumption:**
     - Is the assumption intended as a negligibility assumption (the neglected factor is small and the assumption is approximately true)?
     - Or as a domain restriction (the model is only valid when the assumption holds, and we should not apply it when it fails)?
     - Or as a heuristic device (the assumption is known to be false but is used to generate a testable prediction or insight)?

  3. **Evaluate the assumption for the intended use:**
     - For negligibility: 
       - Is there evidence that the neglected factor is indeed small in the context of the model's application?
       - Are there sensitivity analyses or robustness checks that show the model's predictions are not substantially affected by the assumption?
       - If yes, the assumption may be acceptable. If not, the model may require adjustment or the scope must be restricted to cases where the factor is small.

     - For domain restriction:
       - Can we clearly define the domain where the assumption holds?
       - Is the intended application within that domain?
       - If yes, the model can be used but only within that domain. If the intended application is outside, the model is not suitable without modification.

     - For heuristic device:
       - Is the assumption necessary to derive a testable prediction that would otherwise be unattainable?
       - Are there empirical tests or historical evidence that support the model's predictions despite the false assumption?
       - If the model's predictions have been validated in relevant contexts, the assumption may be acceptable as a heuristic. Otherwise, it may not be reliable for the intended use.

  4. **Assess the potential for extrapolation:**
     - If the model is to be used in a context that extends beyond the conditions of its development or testing (e.g., a novel policy, a different population), we must consider:
       - Does the assumption hold in the new context?
       - If not, and if the assumption is a domain restriction, then extrapolation is not allowed.
       - If the assumption is a negligibility assumption, we must check if the neglected factor remains small in the new context.
       - If it is a heuristic device, we must have evidence that the model's predictions are robust in similar extrapolations.

  5. **Determine if the assumption requires a scope restriction:**
     - If the assumption is found to be invalid in the intended context and cannot be justified as a negligibility or heuristic, then the model's scope must be explicitly restricted to conditions where the assumption holds.

  6. **Value judgment step:**
     - After the technical assessment, if there is still uncertainty or if the technical analysis is inconclusive, the panel must make a value judgment:
       - What are the risks of accepting the model with the unrealistic assumption? (e.g., regulatory error, distributional inequity)
       - What are the benefits? (e.g., timeliness, lack of better alternatives)
       - The panel must weigh these risks and benefits.

  Now, we run the procedure on three cases.

  **Case 1: Representative-agent assumption in a model for forecasting distributional effects of a tax**

  - **Step 1: Identify the assumption and role.**
    - Assumption: There is a single representative agent whose behavior stands in for the entire population.
    - Role: Simplifies the model by ignoring heterogeneity in income, preferences, etc.
    - Intended use: Forecasting how a tax change affects different income groups (distributional effects).

  - **Step 2: Categorize.**
    - The modeller might intend it as a negligibility assumption (heterogeneity is small) or a domain restriction (only valid when heterogeneity is low) or a heuristic (to get a tractable model that can be calibrated). However, for distributional effects, heterogeneity is central. So it is likely a heuristic device (if the modeller believes the model can still capture average effects) but in this context, it is problematic because distributional effects require heterogeneity.

  - **Step 3: Evaluate.**
    - As a negligibility assumption: We would need evidence that heterogeneity is small and does not affect the tax incidence. This is unlikely because tax changes often have varying effects across groups.
    - As a domain restriction: The model would only be valid in a population with very low heterogeneity. This is also unlikely to hold in most real-world settings.
    - As a heuristic device: The modeller might argue that the model can be used to predict average effects and then distributional effects are added via a separate method. But if the model is being used to directly forecast distributional effects, this is not acceptable.

  - **Step 4: Extrapolation.**
    - The model is being used for a purpose (distributional effects) that inherently requires heterogeneity. Extrapolating from a representative agent to distributional effects is not supported.

  - **Step 5: Scope restriction.**
    - The model must be restricted to only providing aggregate outcomes, not distributional ones. If the agency needs distributional effects, this model is insufficient.

  - **Step 6: Value judgment.**
    - The panel must judge whether the agency can use the model for aggregate predictions and then use a different method for distribution. But for direct distributional forecasts, the model is flawed. The panel might reject the model for the intended use.

  **Verdict:** The assumption is not acceptable for forecasting distributional effects. The model's scope must be restricted to aggregate effects only. This is a case where the procedure rules against an assumption we might want to wave through (if we are under pressure to approve) because the intended use requires heterogeneity.

  **Case 2: Homogeneous-mixing assumption in a model for projecting the effect of an intervention aimed at a small subpopulation**

  - **Step 1: Identify.**
    - Assumption: The population mixes homogeneously, meaning every individual has an equal chance of interacting with every other.
    - Role: Simplifies the modeling of disease transmission or information diffusion.
    - Intended use: Projecting the effect of an intervention (e.g., vaccination, information campaign) targeted at a small subpopulation (e.g., a high-risk group).

  - **Step 2: Categorize.**
    - This is typically a negligibility assumption (the modeller assumes that the non-homogeneity is not too strong and doesn't affect the overall outcome) or a domain restriction (only valid in populations with homogeneous mixing). However, since the intervention is targeted at a subpopulation, homogeneous mixing may not hold.

  - **Step 3: Evaluate.**
    - As a negligibility assumption: We need evidence that the non-homogeneity is small and that the intervention effect on the whole population is not substantially altered by the assumption. If the subpopulation is isolated (e.g., geographically or socially), then the homogeneous mixing assumption may be grossly violated. Without evidence of small effect, this is weak.
    - As a domain restriction: The model is only valid in populations with homogeneous mixing. If the target subpopulation is not well-mixed with the rest, then the model is outside its domain.
    - As a heuristic device: The modeller might argue that the model gives a first-order approximation. But if the intervention is targeted, we need to capture the contact patterns.

  - **Step 4: Extrapolation.**
    - Applying a homogeneous-mixing model to a targeted intervention is an extrapolation. Without adjustment, it may over- or under-estimate the effect.

  - **Step 5: Scope restriction.**
    - The model should not be used for targeted interventions without modification. The scope must be restricted to interventions that are applied uniformly to the entire population.

  - **Step 6: Value judgment.**
    - If there is no alternative model and the intervention is urgent, the panel might accept the model with a warning about potential inaccuracy. But the procedure would flag the assumption as problematic.

  **Verdict:** The assumption is not acceptable without evidence that the violation does not substantially affect the results for the targeted intervention. The panel may require the model to be adjusted (e.g., by incorporating contact matrices) or restrict the model to non-targeted interventions.

  **Case 3: Forward-looking rational-expectations assumption in a model for forecasting the effects of a novel policy rule**

  - **Step 1: Identify.**
    - Assumption: Agents form expectations rationally and are forward-looking.
    - Role: Allows the model to incorporate how agents anticipate future policy changes and adjust behavior accordingly.
    - Intended use: Forecasting the effects of a novel policy rule (e.g., a new monetary policy rule) that has never been implemented.

  - **Step 2: Categorize.**
    - This is often a heuristic device: it is known that not all agents are rational and forward-looking, but the assumption allows for a tractable model that can be solved and that may capture average behavior.

  - **Step 3: Evaluate.**
    - As a negligibility assumption: We would need evidence that deviations from rationality and forward-looking behavior are small. This is difficult because behavioral economics shows systematic deviations.
    - As a domain restriction: The model is only valid in settings where agents are rational and forward-looking. This is hard to verify and may not hold in many contexts.
    - As a heuristic device: The model might have been validated in similar policy changes (even if not identical) and shown to predict well. For a novel policy, we don't have direct evidence. However, the model might be the best available.

  - **Step 4: Extrapolation.**
    - The model is being used for a novel policy, so it is an extrapolation. We must consider if the rational expectations assumption is reasonable in the new context. For example, if the policy is complex and not well communicated, agents might not form rational expectations.

  - **Step 5: Scope restriction.**
    - The model might be restricted to situations where policies are well understood and agents are well-informed.

  - **Step 6: Value judgment.**
    - The panel must weigh the lack of alternatives and the importance of the policy decision. They might accept the model with caveats, or require sensitivity analysis with alternative assumptions (e.g., adaptive expectations).

  **Verdict:** The assumption may be acceptable as a heuristic device if there is evidence that the model has performed well in similar forecasting exercises. Otherwise, the panel might require additional robustness checks. This is a case where the panel might accept the assumption despite concerns, but the procedure highlights the need for caution.

  **Summary of Technical vs. Judgment Steps:**

  - **Technical steps:** 
    - Steps 1 and 2 (identifying and categorizing the assumption) are largely technical, though categorizing may involve some interpretation.
    - Step 3 (evaluating the assumption under the three readings) is technical, requiring evidence and analysis.
    - Step 4 (assessing extrapolation) is technical, based on comparing the context of model development and the intended application.

  - **Judgment steps:**
    - Step 5 (scope restriction) involves technical input but the decision on how to restrict is a judgment.
    - Step 6 is explicitly a value judgment, weighing risks and benefits when the technical analysis is inconclusive.

  The procedure is designed to first exhaust technical questions and then leave the remaining uncertainty to panel judgment.
answer: |-
  Below is a decision procedure for your panel to evaluate unrealistic assumptions in quantitative models, structured around the three readings (negligibility, domain restriction, heuristic device). The procedure is designed to be run sequentially for each key assumption, with clear exit points for technical failures or value judgments. I then apply it to your three cases, including one where the procedure rules against an assumption you might prefer to accept.  

  ---

  ### **Decision Procedure: Evaluating Unrealistic Assumptions**  
  **Objective**: Determine if an unrealistic assumption is acceptable for the model's intended regulatory use.  
  **Input**: A specific assumption, its role, the model's purpose, and available evidence.  
  **Output**: Accept/reject the assumption, require scope restrictions, or escalate to panel judgment.  

  #### **Step 1: Classify the Assumption**  
  **Question**: How is the assumption *intended* to be read? (Consult model documentation and authors.)  
  - **Options**:  
    - **Negligibility**: "This factor is small/irrelevant; ignoring it approximates reality."  
    - **Domain restriction**: "This model only applies where this holds."  
    - **Heuristic device**: "This is false but simplifies the path to testable predictions."  
  **Sufficient Answer**: Explicit justification from modelers (e.g., "We assume homogeneous mixing because variations are negligible at large scales").  
  **Failure**: If intent is unclear, **stop and reject**—unclassified assumptions cannot be evaluated.  
  **Judgment Level**: Technical (classification relies on modeler statements).  

  #### **Step 2: Test Empirical Plausibility**  
  **Question**: Is there evidence that the assumption *could* hold in the target domain?  
  - **For negligibility**: Is the neglected factor demonstrably small (e.g., <5% effect size in prior studies)?  
  - **For domain restriction**: Does the regulatory context fall within the assumed domain (e.g., policy targets populations where mixing *is* homogeneous)?  
  - **For heuristic device**: Is the assumption *necessary* to derive predictions, and are those predictions testable?  
  **Sufficient Answer**:  
    - Data from literature, sensitivity analyses, or model validation showing the assumption does not distort key outputs (e.g., robustness checks varying the assumption).  
    - *Absence of evidence* (e.g., no data on subpopulation mixing) defaults to **fail**.  
  **Failure**: If evidence is weak/absent, **restrict model scope** (e.g., "Only valid for aggregate outcomes, not distribution").  
  **Judgment Level**: Technical (evidence-based; uses predefined thresholds like effect sizes).  

  #### **Step 3: Assess Predictive Validity**  
  **Question**: Does the model produce accurate predictions *despite* the assumption?  
  - **For negligibility/heuristic**: Compare predictions to empirical data or established benchmarks (e.g., model forecasts match historical tax-incidence data within 95% CI).  
  - **For domain restriction**: Verify the model performs well *within* its domain (e.g., accurate in homogeneous populations but not elsewhere).  
  **Sufficient Answer**:  
    - Statistical validation (e.g., R², RMSE) against real-world data.  
    - If no direct data (e.g., novel policy), use proxy comparisons (e.g., similar policies in analogous domains).  
  **Failure**: If predictions are poor, **reject the assumption** and require model revision.  
  **Judgment Level**: Technical (statistical tests; panel may set validation thresholds).  

  #### **Step 4: Evaluate Extrapolation Risk**  
  **Question**: Does the regulatory use *extrapolate* beyond the assumption’s safe zone?  
  - **For negligibility**: If the neglected factor could become large under the policy (e.g., a tax change amplifies behavioral heterogeneity), extrapolation is invalid.  
  - **For domain restriction**: Extrapolation is forbidden by definition—if the policy operates outside the domain, **reject**.  
  - **For heuristic device**: Extrapolation is high-risk; require proof that the heuristic is robust in novel contexts (e.g., tested in policy simulations).  
  **Sufficient Answer**: Evidence that the assumption’s failure does not alter conclusions (e.g., sensitivity analysis shows <1% outcome change when forcing heterogeneity).  
  **Failure**: **Restrict scope** to contexts where extrapolation is minimal (e.g., "Only for short-term forecasts").  
  **Judgment Level**: Technical (extrapolation is quantifiable via sensitivity/scenario tests).  

  #### **Step 5: Escalate to Value Judgment**  
  **Question**: If the assumption passes Steps 1–4 but uncertainties remain, what is the risk/benefit trade-off for regulatory use?  
  - **Criteria**:  
    - **Risk**: Harm from model error (e.g., regressive taxes, failed interventions).  
    - **Benefit**: Urgency, lack of alternatives, societal value.  
  - **Sufficient Answer**: Panel consensus on risk tolerance (e.g., "Uncertainty is acceptable given the intervention’s low cost").  
  **Failure**: If panel disagrees or risk is high, **reject** or demand contingency plans (e.g., post-implementation monitoring).  
  **Judgment Level**: Explicitly non-technical (weighs ethics, policy goals, and uncertainty).  

  ---

  ### **Application to Cases**  
  #### **Case 1: Representative-Agent Assumption**  
  **Model Use**: Forecast distributional effects of a tax.  
  **Assumption**: All households are represented by a single "average" agent.  
  - **Step 1 (Classify)**: Modellers claim *negligibility* ("income heterogeneity is small").  
  - **Step 2 (Empirical Plausibility)**: Evidence shows heterogeneity is *not* negligible (e.g., top 10% hold 50% of income; tax elasticities vary by group). *Failure*.  
  - **Step 3 (Predictive Validity)**: Model predicts aggregate outcomes well but fails distributional accuracy (e.g., underestimates burden on low-income groups by 15–30% in validation). *Failure*.  
  - **Step 4 (Extrapolation Risk)**: Extrapolating to distributional effects amplifies error. *Failure*.  
  - **Verdict**: **Reject assumption**. Scope restricted to aggregate forecasts only. Panel judgment not reached (technical failures suffice).  
  **Why against preference?** You might wave this through for simplicity, but empirical and predictive failures license harmful distributional errors.  

  #### **Case 2: Homogeneous-Mixing Assumption**  
  **Model Use**: Project effect of an intervention targeting a small subpopulation (e.g., needle exchange for IV drug users).  
  **Assumption**: All individuals interact randomly (no clusters or networks).  
  - **Step 1 (Classify)**: Modellers claim *domain restriction* ("model valid only in well-mixed populations").  
  - **Step 2 (Empirical Plausibility)**: Target subpopulation has concentrated networks (e.g., drug users in tight-knit communities). Regulatory context *outside domain*. *Failure*.  
  - **Step 3 (Predictive Validity)**: Model overestimates intervention spread by 40% in clustered populations (per historical data). *Failure*.  
  - **Step 4 (Extrapolation Risk)**: Use for a subpopulation violates domain restriction. *Failure*.  
  - **Step 5 (Value Judgment)**: Panel assesses risk (e.g., underestimating HIV spread) vs. benefit (no alternative model). Majority votes to **reject** due to high stakes.  
  **Verdict**: **Reject assumption**. Model scope restricted to broad populations; unsuitable for subpopulations.  

  #### **Case 3: Rational-Expectations Assumption**  
  **Model Use**: Forecast effects of a novel monetary policy rule.  
  **Assumption**: Agents have perfect forward-looking expectations.  
  - **Step 1 (Classify)**: Modellers claim *heuristic device* ("tractable way to model policy anticipation").  
  - **Step 2 (Empirical Plausibility)**: Evidence shows expectations are often adaptive/biased (e.g., inflation expectations sticky), but modelers argue heuristic is necessary for tractability. *Pass* (by necessity).  
  - **Step 3 (Predictive Validity)**: Model predicts past policy shifts within 90% CI (e.g., Fed rate changes). *Pass*.  
  - **Step 4 (Extrapolation Risk)**: Novel policy rules increase uncertainty (no data). Sensitivity analysis shows outcomes vary by ±10% with adaptive expectations.  
  - **Step 5 (Value Judgment)**: Panel debates risk (forecast errors could trigger recession) vs. benefit (no better models). Compromise: **Accept with scope restriction** (e.g., "Short-term forecasts only; monitor expectations surveys").  
  **Verdict**: **Accept as heuristic** with narrowed scope.  

  ---

  ### **Key Features of the Procedure**  
  - **Structured Scrutiny**: Forces explicit classification and evidence checks before judgment.  
  - **Stopping Points**: Technical failures (Steps 1–4) avoid unnecessary debate; judgment (Step 5) is last-resort.  
  - **Distinguishing Technical vs. Judgment**:  
    - **Technical**: Classification, empirical thresholds, validation metrics, sensitivity analyses (replicable, data-driven).  
    - **Judgment**: Risk tolerance, trade-offs, ethical weights (panel-dependent).  
  - **Outcomes**: Reject, accept, or accept with restrictions—always linked to the three readings.  

  This procedure ensures unrealistic assumptions are neither dismissed reflexively (via the F-twist) nor accepted blindly, while respecting your core distinction. It prioritizes empirical rigor but acknowledges regulatory realities in the value-judgment step.
