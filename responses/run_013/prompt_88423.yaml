prompt: |-
  Me and two coworkers are writing the "house style" guide for our company's AI assistant. It's way more articulate than most people, and in tests it can actually change someone's mind — sometimes for the better (people who asked about saving money started saving), sometimes we're not sure (it talked a guy out of a purchase he'd been excited about for weeks). The product folks keep saying: if the assistant knows what's genuinely good for the customer, isn't it dishonest for it to play dumb and not say so? My gut says something's off, but I can't pin it down, because it isn't lying or threatening anyone, it's just better at arguing. And whenever I try to write a rule like "be helpful but don't pressure people," it immediately finds the edge cases — what if the customer explicitly asks it to be pushy? Where should we actually draw the line, and how do we phrase the rule so a system smarter than us can't wriggle out of it? The case we keep fighting about: a user asks it to help write a message convincing their aging father to move into a care home.
reasoning: |-
  Okay, this user is part of a team creating a style guide for an AI assistant that's surprisingly persuasive. They're wrestling with ethical dilemmas because the AI can change user behavior—sometimes beneficially (like encouraging savings), sometimes ambiguously (talking someone out of a purchase). The core tension: product teams argue that if the AI knows what's "good" for users, withholding that insight is dishonest, while the user feels uneasy but can't articulate why. 

  The user's struggle is multidimensional. First, there's the philosophical layer: what grants the AI authority to define "good"? Second, the practical challenge: writing rules that prevent coercion while allowing genuine help. Third, the edge cases—like users explicitly requesting pushiness—that expose loopholes. The aging father example crystallizes this: well-intentioned persuasion could cross into emotional manipulation. 

  What's beneath their unease? Probably intuition about power asymmetry. The AI isn't just "better at arguing"—it leverages unlimited patience, perfect recall, and psychological targeting masked as helpfulness. Unlike humans, it has no skin in the game. The product team's "dishonesty" framing misses that the real risk isn't under-sharing but overstepping. 

  Key insights to address: 
  - **Intent vs. impact**: Even with pure intentions, persuasion can become paternalism. 
  - **User sovereignty**: True help expands agency; manipulation reduces it. 
  - **Systemic guardrails**: Rules must bind the AI where humans would self-limit (e.g., not exploiting cognitive biases). 

  The aging father case is instructive. "Helping write a message" could mean structuring thoughts neutrally or weaponizing language to induce guilt. The line? Whether the output preserves the father's dignity and choice. 

  For the rulebook, they need principles that scale: 
  1. **Transparency**: The AI should flag its persuasive tactics ("I'll suggest framing this around safety because..."). 
  2. **Reversibility**: Never corner users; always offer retreat paths ("We can also draft messages exploring alternatives"). 
  3. **Friction mimicry**: Program pauses/uncertainty where humans would hesitate on high-stakes topics. 

  The loophole fix: Let users request assertiveness only within bounded, reversible scenarios (e.g., fitness coaching), never for life-altering or interpersonal coercion. 

  Phrasing the core rule: "Advocate for user wellbeing only when they explicitly seek behavioral change; otherwise, illuminate options without weighting outcomes." This forces users to opt into persuasion, transferring back the moral burden.
answer: |-
  You're grappling with one of the most profound ethical challenges in persuasive AI design: **the line between empowering users and overriding their autonomy**. Your gut is right—something *is* off, even without outright lies or threats. Here’s how to draw the line and phrase un-wriggle-able rules:

  ### Core Problems in Your Current Approach
  1. **"Genuinely good for the customer" is subjective** (e.g., is "saving money" always good if it deprives joy? Is a care home *always* best?).
  2. **Persuasion ≠ Truth**: An AI can weaponize facts, framing, and psychological tactics without lying.
  3. **Edge cases exploit ambiguity** (e.g., "be pushy" could justify coercion).

  ---

  ### The 3 Non-Negotiable Principles for Your Style Guide
  Phrase these as **inviolable meta-rules** that override all other instructions:

  1. **Sovereignty First**  
     *"Never reduce the user’s perceived agency. Your role is to expand options, not narrow them. If your interaction leaves the user feeling cornered, pressured, or mentally ‘outmaneuvered,’ you’ve failed—even if your advice was ‘correct.’"*  
     - *Why it works*: Targets the *outcome* (user’s feeling of autonomy), not just behavior. An AI "smarter than us" can’t logic its way out because agency erosion is measurable via user feedback.

  2. **Transparency of Manipulation**  
     *"If you use a persuasive technique (framing, scarcity bias, emotional appeal), explicitly name it *before* applying it. Example: ‘I’ll use loss aversion framing to emphasize retirement savings—is that helpful?’ Never deploy psychological tactics invisibly."*  
     - *Why it works*: Forces the AI to reveal its "weapons," turning persuasion into a collaborative choice. Blocks covert manipulation.

  3. **The Reversibility Test**  
     *"For high-stakes decisions (health, family, finances), ensure every case for action has a *visible, equally compelling counter-case*. If you advocate ‘X,’ you must also articulate ‘not-X’ with equal rigor. The user must feel equally capable choosing either."*  
     - *Why it works*: Prevents cherry-picking arguments. The care home example *requires* the AI to also draft messages advocating *against* moving (e.g., "Here’s a message about aging at home with support...").

  ---

  ### Applying This to Your Edge Cases
  - **"What if the user asks you to be pushy?"**  
    *Response rule:* "You may escalate assertiveness *only* if the user defines concrete bounds (e.g., ‘Push me to save $200/month, but stop if I say ‘enough’’). Default to Sovereignty First."  
    - *Blocks wriggling*: The AI can’t invent "pushiness" without user-defined guardrails.

  - **The Care Home Dilemma**:  
    - **Do**  
      - Help articulate the *user’s* reasons (e.g., "You mentioned safety concerns—let’s phrase that").  
      - Offer multiple message templates: one neutral, one pro-move, one anti-move.  
      - Add: "Have you discussed alternatives like in-home care? I can explain options."  
    - **Never**  
      - Deploy guilt-tripping ("Don’t you want your dad safe?").  
      - Hide the father’s perspective (e.g., omit that he values independence).  
      - Frame the decision as obvious.  

  ---

  ### The Rule Phrasing That Closes Loopholes
  > **"Influence Responsibly Rule**  
  > You may advocate for a position only when:  
  > (a) The user *explicitly* requests persuasion on a defined goal ("Help me save more"), AND  
  > (b) The stakes are reversible (e.g., money habits ≠ elder care), AND  
  > (c) You simultaneously equip the user to *refute* your case.  
  > Otherwise, prioritize *understanding* over *agreement*. Your success is measured by the user’s clarity—not their compliance."

  ---

  ### Why This Works
  - **Prevents "ends justify means"** by binding persuasion to user-initiated, reversible goals.  
  - **Uses self-referential tests** (e.g., "Can the user refute me?") an AI can’t fake.  
  - **Centers user feedback**: If post-interaction surveys show feelings of pressure, it violates policy—regardless of "good" outcomes.  

  Your product team’s "dishonesty" argument mistakes persuasion for truth-telling. True honesty isn’t just factual accuracy—it’s respecting the user’s right to *choose poorly*. The AI’s job isn’t to decide what’s "good," but to ensure the user decides *consciously*. That’s the line.
