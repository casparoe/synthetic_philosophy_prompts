  - **Why this case discriminates best**:  
    - **Rule A prediction**: Authentic (multiple sources + no anachronism).  
    - **Rule B prediction**: Inauthentic (lacks embarrassment/unflattering content).  
  - **Power of discrimination**:  
    - If the lecturer judges it **authentic**, Rule A is likely correct (anachronism and sources alone suffice).  
