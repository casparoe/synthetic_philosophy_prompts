  ### Decomposition of Expected Value
  I decompose the expected value of a far-future action using a conditional chain. Let:
  - \(W\) = Expected value of the action in a non-simulation baseline (i.e., base reality with a long future).
  - \(S\) = We are in a simulation.
  - \(\neg S\) = We are in base reality.

  The overall expected value is:
  \[
  E[V] = P(S) \cdot E[V \mid S] + P(\neg S) \cdot E[V \mid \neg S]
  \]
  where \(E[V \mid \neg S] = W\) (the baseline value), and \(E[V \mid S]\) is the expected value if we are simulated.

  I model \(E[V \mid S]\) as:
