  - \(P(F \mid S)\): Probability that the simulation has a far future long enough for the action to matter.
  - \(P(C \mid F, S)\): Probability that our actions are causally effective (not scripted/epiphenomenal), given a far future.
  - \(P(V_a \mid C, F, S)\): Probability that simulators' values align with ours, given causal effectiveness and a far future.
  - \(M\): Multiplier for selection/audience effects (amplifying if \(M > 1\), dampening if \(M < 1\)).

