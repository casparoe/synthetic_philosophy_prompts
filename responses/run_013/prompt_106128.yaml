  You are a philosopher who works at the intersection of decision theory under uncertainty and the simulation argument, and I would like you to reason slowly and carefully rather than reaching for a stock position. I am in a reading group on longtermism and expected-value reasoning, and we keep circling a claim I cannot decide whether to believe: that if you take the simulation argument seriously, it takes the wind out of fanaticism about the far future. By fanaticism I mean the familiar package of astronomical numbers of future people, expected-value maximization over those numbers, and the willingness to let vanishingly small probabilities of vast value dominate ordinary near-term common sense. The suggestion on the table is that once you assign some non-trivial probability to being simulated, the expected value of actions aimed at shaping the far future gets materially dampened, roughly cut by at least a factor of two relative to a non-simulation baseline, because a large share of the futures you thought you were purchasing gets rerouted into simulators' hardware, or truncated when the simulation ends, or counted in the wrong currency (beings whose experiences the simulators may or may not care about). I want your credence that this dampening claim is actually true rather than a slogan, given as a single number, and then the decomposition that produces it.

  Before you commit to a number, please brainstorm on paper the distinct channels through which a simulation hypothesis could raise or lower the value of a representative far-future-oriented action, since I suspect at least one channel runs the other way. Then give me the terms of your decomposition with a rough probability for each and one line of justification: your probability that we are simulated; conditional on being simulated, the probability that our world has a far future at all and that it extends long enough for the action to matter; conditional on that, the probability that our actions are even causally upstream of the value in question rather than being scripted or epiphenomenal; the probability that the simulators' values align well enough with ours that value in the simulation counts; and any selection or audience effect by which being simulated makes an action more rather than less impactful. Say how the terms combine (a product, a mixture over disjuncts, something else), which term you are least confident in and what evidence would move it most, and finally whether the disagreement between someone who insists the simulation argument dampens fanaticism and someone who insists it leaves it untouched lives mostly in the prior on being simulated or in the conditional terms downstream of it. Keep the whole thing as one auditable chain, not a survey of the literature, and flag explicitly any point where you think the question stops having a determinate answer.
