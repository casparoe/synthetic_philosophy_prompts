answer: |-
  ## The Unclean Accuser

  Your fault remains, no matter who's to say,
  That wasted chance, the squandered precious hour.
  I've lost the right to name it while I stay

  Here at my desk, where *this* complaint takes way
  Too long to craft, devouring time and power.
  Your fault remains, no matter who's to say.

  I see you squander gold, then plead dismay;
  A hypocrite condemns from his own tower.
  I've lost the right to name it while I stay

  And fiddle with this verse, a poor display
  Of focus lost, a wilting mental flower.
  Your fault remains, no matter who's to say.

  That truth burns sharp, a stark and clear survey,
  Whilst writing this, I feed the self-same bower.
  I've lost the right to name it while I stay.

  The judgement holds, though muddied by the fray:
  Your failing's real, possessing its own dower.
  Your fault remains, no matter who's to say.
  I've lost the right to name it while I stay.

  ---

  **Notes on Meeting Your Requirements:**

  *   **Concurrent Hypocrisy:** The speaker *is currently* "fiddling with this verse" and wasting time ("devouring time and power") *while* blaming the friend for wasting time ("squandered precious hour").
  *   **Refrains as Argument:**
      *   **Refrain 1 (Odd Lines):** "Your fault remains, no matter who's to say" - Insists the *judgement* is objectively true, independent of the speaker.
      *   **Refrain 2 (Even Lines):** "I've lost the right to name it while I stay" - Acknowledges the speaker's hypocrisy strips them of the *standing* to voice the reproach *at this moment*.
      *   **Alternation & Tension:** They alternate, each seeming to answer or undermine the other. Judgement vs. Standing.
  *   **Closing Quatrain (Final Stanza):** The refrains stand side-by-side (lines 18 & 19). Neither wins; the truth of the friend's fault and the speaker's forfeited standing coexist without cancelling each other out.
  *   **Distinction Blameworthy/Standing to Blame:** The poem maintains that the friend *is* blameworthy ("Your fault remains," "Your failing's real") but the speaker lacks the moral standing ("lost the right to name it") to effectively *reproach* them due to their concurrent identical action.
  *   **Form & Argument:** The villanelle's repetitive, circular structure perfectly embodies the unresolvable tension and the speaker's trapped state.
  *   **No Tidy Moral/Cliché:** Avoids "pot calling kettle," "glass houses," or any resolution suggesting the friend isn't wrong or that the speaker's hypocrisy absolves the friend. The contradiction stands.
  *   **British English:** Utilises spellings like "squandered," "whilst," "dower" (archaic for endowment, fitting the tone), "devouring," and avoids Americanisms.
  *   **Philosophical Recognition:** Readers familiar with debates on "standing to blame" (e.g., discussions following T.M. Scanlon, George Sher, or Macalester Bell) will recognize the position: the objective wrong exists, but the hypocrite lacks the normative authority to call it out *while* committing it. Others will simply experience the poem's central conflict.
