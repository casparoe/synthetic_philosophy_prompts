  Okay so I've been reading way too much game theory again and I want you to write me something. You're a game theorist who also writes deadpan humor, the kind of person who could explain subgame perfection to a room and also land a joke about it. Before you write anything, brainstorm for yourself: jot down the actual technical beats you'd want to hit (backward induction on the centipede, what it requires in terms of common knowledge of rationality, what happens when the chain gets long, why the whole thing has the flavor of a reductio, what real players actually do) and then pick the three or four that will carry the piece. Don't put the brainstorm in the final answer, just use it.

  What I want is an excerpt from an invented self-help / business book, the kind of thing that sells a million copies and gets quoted on stage at sales conferences. The author is a fictional productivity guru -- let's call him Dr. Victor Ashford -- and his big idea is what he calls Backwards Thinking: he's taken the centipede game and its backward-induction solution and turned it into a life philosophy. The chapter should be about 650 words, deadpan, in his voice: smug, folksy, stuffed with invented case studies and one invented testimonial from a client. He definately never breaks character, never notices the problem with his own advice, and never winks at the reader.

  The humor has to come from him getting the game theory right. He should lay out the centipede setup accurately -- two players, a pot that grows every time someone passes, a temptation to take at every node that ends the game and pays the taker slightly more than the other guy, a known and finite last round. Then he should walk the backward induction properly: at the last node you take, so at the node before that you take, and so on back to the first node, so a rational player takes immediately and everyone walks away with the smallest possible payoff. He should treat this as a discovery about how to live. His applications should be ordinary things: business partnerships, friendships, the favor economy, marriage, maybe a will. The punchline is that applied faithfully, Backwards Thinking tells him to grab the tiny payoff on move one in every relationship he has, and he presents this as winning, because he's counting the nodes.

  Give him a couple of moves that are technically live, not just gags. At some point he should insist the whole thing only works if rationality is common knowledge, and then use that to explain why everyone else keeps ruining his strategy. Maybe a section on the trembling hand, or on what he calls the "infinitely repeated" version of a friendship and why he doesn't believe in it. If you can work in the fact that people in lab experiments pass for many rounds and do better than the theory predicts, do it -- but have him explain it away in a way that is itself the joke.

  This shouldn't be a hit piece on game theory. It should be a hit piece on the guy who reads one paper and reorganizes his life around it. If a game theorist reads it I want them laughing at the guru, not wincing at me.

  At the end, outside the excerpt, add a short note for me and not the reader, a few sentences: where does the piece take liberties with the actual theory, and which part leans on a reading of backward induction that a defender could reasonably reject? If there's a spot where the satire is unfair to the position rather than to the guru, say so and tell me what you'd cut or soften. And if you had to bet against one piece of my framing, tell me which one and why.

  Keep the framing casual but the excerpt itself should be polished prose. And no citations or reading lists anywhere, obviously -- Dr. Ashford has never read anything, he just has intuitions.
