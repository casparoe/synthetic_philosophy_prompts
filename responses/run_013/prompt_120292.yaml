prompt: |-
  Longtime lurker, first time actually asking anything. Here's the wall I keep hitting. Every formal model of belief I've poked at — epistemic/doxastic logic, Bayesian agents, whatever flavor — hands you an agent who knows every logical consequence of what they know, and that's just false of me. I've believed the axioms of arithmetic since I was a kid and there are theorems of arithmetic I still dont know, and not in the hasn't-had-time-to-compute sense: I've never once thought about most of them. And I think something real is being papered over there. When I believe P and I believe P implies Q and I haven't put the two together, there's a defect in my epistemic state that has nothing to do with the speed of my mental arithmetic. But every fix I've seen or tried either (a) keeps the omniscience in a nicer costume, (b) throws out closure entirely, after which belief stops looking like a cognitive kind at all — if nothing ever pressures me to accept the consequences of what I believe, why is believing one thing rather than another anything but a mood? — or (c) explodes the second I admit people hold inconsistent beliefs, since closure under entailment plus one contradiction gets you everything.

  So before I read one more theory I want the spec. What does any account of what an actually bounded agent believes have to deliver before I should take it seriously? The cases I keep coming back to, in case they're useful as test cases: me and the unthought-of theorem; the author who believes every sentence in their book and also, reasonably, that at least one of them is wrong; the person holding a thousand lottery tickets each of which they're certain will lose; someone who says it's raining and in the next breath says they don't believe it's raining; the surprise-exam setup, where the students reason their way to a conclusion that can't be right; a friend who builds proof assistants and insists the thing he actually needs is a model where what the machine knows and what the machine can search are two different objects; and the plain fact that reasoning feels like an activity, takes time, and sometimes comes with the sensation of discovery — which on the ideal picture is incoherent, since deduction never adds information.

  For each requirement give me the case or consideration that motivates it, and say whether you think it's non-negotiable or just a prejudice of one camp. Then the part I most want: flag which pairs of requirements you think can't be satisfied together, because my suspicion is that the list itself is where the real result lives. And tell me which single requirement does the most work in ruling out candidate theories, if I had to give one up to save the rest. A table is fine for the requirements themselves, prose for everything else. A short line or two on how the main families of approaches do against the list is welcome, but keep it short — the list is the point, and please skip any reading list, I'll do the reading myself. If you think the whole framing is off — that belief is being treated as a state when it's really a process, or that logical consequence is simply the wrong relation to close under — say so up front and then do the list anyway; I'd rather have the list than a lecture. American English throughout, please.
reasoning: |-
  Okay, this user is clearly deeply engaged with formal epistemology and has hit a persistent wall with the problem of logical omniscience. They're frustrated with how existing models handle (or fail to handle) the gap between ideal rationality and human cognition. 

  First, let's unpack their core complaint: every formal system they've encountered assumes agents automatically know all logical consequences of their beliefs, which contradicts lived experience. They mention childhood knowledge of arithmetic axioms versus unknown theorems as a concrete example - this isn't about computation time but about cognitive state prior to inference. 

  Their test cases are brilliantly chosen to stress-test theories:
  - The unthought theorem (epistemic gap)
  - The author believing their book contains an error (consistent uncertainty about logical consequences)
  - Lottery tickets (probabilistic closure paradox)
  - Moore's paradox variant (doxastic inconsistency)
  - Surprise exam (self-referential reasoning failure)
  - Proof assistant designer's need (separating knowledge base from inference capability)
  - The phenomenology of reasoning (discovery feeling vs. tautology)

  The user's demand is unusually precise: they want a specification for bounded belief models, not solutions. Specifically:
  1. Requirements motivated by test cases
  2. Conflict flags between requirements
  3. The most constraining requirement
  4. Brief family assessments

  Key challenges in responding:
  - Must resist temptation to propose solutions (they explicitly want specs, not fixes)
  - Avoid academic tangents (they'll do their own reading)
  - Honor their sophisticated framing while keeping American English prose crisp
  - Their suspicion about requirement conflicts is probably correct - need to surface those tensions

  Notable subtexts:
  - They're clearly technically competent (references to proof assistants, doxastic logic)
  - Frustration with "nicer costumes" for omniscience suggests they've seen many attempts
  - The "mood" comment reveals concern about belief losing normative force without closure
  - Mentioning inconsistent beliefs flags relevance to paraconsistent approaches

  The response structure should:
  1. Acknowledge their framing is valid (no lectures)
  2. Deliver requirements as testable conditions
  3. Explicitly map conflicts (their "real result" insight)
  4. Identify the tightest constraint (likely closure+inconsistency)
  5. Briefly score existing approaches against requirements
  6. Maintain their pragmatic, no-nonsense tone

  Most delicate balance: preserving their intuition that belief must have some closure pressure ("why is it not just a mood?") while accommodating non-omniscience. The lottery paradox case especially exposes this tension.
answer: |-
  Here's a specification for a model of bounded belief, derived from your test cases and core concerns. The requirements focus on what a credible model *must* explain or accommodate, with conflicts flagged. "Non-negotiable" means failing this likely invalidates the model for your core problem.

  ### Requirements for Bounded Belief Models
  | Requirement (R#) | Motivating Case(s) | Non-Negotiable? | Core Motivation |
  | :--------------- | :----------------- | :-------------- | :-------------- |
  | **R1: Non-Omniscience** | Unthought theorem; Reasoning as activity | Yes | Agents can believe P & (P→Q) without (yet) believing Q, *even when Q is trivial*. It's not just computational delay; it's a structural gap. |
  | **R2: Defective but Normative Closure** | "Why isn't belief just a mood?"; Surprise exam | Yes | Belief must exert rational *pressure* toward closure. Failing to accept obvious consequences *is* a defect, even if ubiquitous. Closure can't be ignored, but perfect closure is impossible. |
  | **R3: Local Consistency Tolerance** | Author with book; Inconsistent beliefs | Yes | Agents can function rationally while holding beliefs that are *globally* inconsistent (e.g., believing each sentence in a book + "one is false"). The model shouldn't explode. |
  | **R4: Attentional Granularity** | Unthought theorem; Reasoning as discovery | Yes | Beliefs must be "activated" or attended-to to drive inference. The agent's state must distinguish between *stored* beliefs and *currently active* ones. |
  | **R5: Non-Explosive Inconsistency** | Author with book; "It's raining but I don't believe it" | Yes | A single inconsistency (or even many) shouldn't entail belief in *everything* (ex falso quodlibet). Paraconsistency or fragmentation is needed. |
  | **R6: Resource Sensitivity** | Proof-assistant friend; Reasoning takes time | Negotiable (but critical) | Time, memory, or cognitive cost of inference matters. What's "obvious" depends on agent resources. |
  | **R7: Higher-Order Belief Coherence** | Surprise exam; Moorean paradox ("raining but I don't believe it") | Negotiable | Agents reason about their own (bounded) beliefs. Paradoxes arise when closure/non-closure assumptions interact reflexively. |

  ### Requirement Conflicts (The Tensions)
  *   **R2 vs. R1 & R4:** **Core Tension.** Normative closure (R2) demands movement toward logical consequence, but non-omniscience (R1) and attentional granularity (R4) prevent it. Any model must explain *how* pressure (R2) exists without implying automatic closure. *Resolution attempts:* "Attainable" consequence, dynamic belief revision, inference as action.
  *   **R2 vs. R3 & R5:** Normative closure (R2) + inconsistency (R3) classically implies explosion (¬R5). R5 (non-explosion) is essential, forcing abandonment of classical closure under entailment for inconsistent sets. *Resolution attempts:* Paraconsistent logics, belief bases with limited inference rules, fragmentation.
  *   **R3 & R5 vs. R2:** Tolerating global inconsistency (R3/R5) weakens the "teeth" of normative closure (R2). If inconsistency has no local consequence, why avoid it? Why feel pressure toward consistency? *Resolution attempts:* Local consistency demands, costs of inconsistency manifesting in specific inferences.
  *   **R4 vs. R6:** Attentional granularity (R4) explains *why* consequences aren't drawn, but resource sensitivity (R6) dictates *which* consequences *can* be drawn with effort. They overlap but focus differently (structure vs. cost).

  ### The Most Constraining Requirement
  **R5 (Non-Explosive Inconsistency)** does the most work in ruling out mainstream approaches. It immediately forces:
  1.  Rejection of classical logical closure (explodes with any inconsistency).
  2.  Rejection of standard Bayesian models (probability 0 for P forces P→Q to have prob 1 for all Q).
  3.  Necessity of radical solutions like fragmentation, paraconsistent logics, or non-monotonic reasoning.

  ### How Major Families Fare (Briefly)
  *   **Standard Epistemic/Doxastic Logic:** Fails R1, R3, R4, R5, R6. Handwaves R2. Struggles with R7.
  *   **Ideal Bayesianism:** Fails R1, R3, R4, R5, R6. Handwaves R2. Better with R7 for uncertainty, but not belief granularity.
  *   **Belief Revision Theory (AGM-style):** Focuses on R2/R7 dynamics but assumes consistent belief *sets* (fails R3/R5), ignores R1/R4/R6 granularity.
  *   **Fragmentation/Impossible Worlds:** Addresses R1, R3, R4, R5 directly. Struggles to define R2 (normative pressure) naturally and R7 coherently. R6 often tacked on.
  *   **Paraconsistent Approaches:** Solve R5 directly. Can handle R3. Struggle with R1/R4 (still often "flat"), R2 (what *is* normative closure here?), and R7.
  *   **Inferentialist/Dynamic Models (e.g., STIT, active logic):** Treat belief as action/inference. Address R1, R4, R6, R7 well. Can handle R3/R5. Struggle defining the *state* (R2's normative pressure often comes from commitment to inference rules).
  *   **Probabilistic Bounded Models (e.g., logical induction):** Embrace R6, approximate R2 under limits. Struggle with R4 (granularity of *belief* vs. credence), R3/R5 (inconsistency handling), and discrete belief phenomenology.

  ### Key Takeaway on Framing
  Your suspicion is correct: **the core tension lies in the *conflict between the requirements themselves* (especially R1/R4 vs. R2, and R2 vs. R3/R5).** Any viable model *must* navigate these tensions explicitly. The "real result" is likely that no single, simple relation (like classical entailment) closes belief for bounded agents. Belief is a dynamic, structured, resource-sensitive state subject to normative ideals it cannot perfectly meet. The list *is* the specification; satisfying all constraints fully may be impossible, but the best models minimize the compromises. R5 (Non-Explosion) is the hardest constraint that forces the biggest break from tradition.
