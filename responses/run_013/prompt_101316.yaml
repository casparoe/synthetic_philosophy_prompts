answer: |-
  ### Philosophy of Action: Weakness of Will Activity  
  **Goal:** Make students experience the tension between preference reversals (hyperbolic discounting) and the feeling of betrayal/self-distrust. Focus on two key puzzles:  
  1. Why does a reversal *feel* like a betrayal if it’s a "rational" change of mind?  
  2. Why pay to constrain a "future self" you’re supposedly identical to?  

  **Core Mechanics:**  
  - **Short delays** (minutes) to force real-time reversals.  
  - **Betting** on future choices to expose self-misprediction.  
  - **Tradable commitments** to reveal self-distrust’s market price.  

  **Materials:**  
  - **Rewards:** Small candy bars (e.g., mini-Snickers) *or* lottery tickets for extra credit (1 ticket = 1 entry into a draw for 0.1% extra credit, capped at 5% max per student).  
  - **Currency:** "Willpower Tokens" (WT). Each WT = 1 candy *or* 2 lottery tickets. Starting balance: 5 WT per student.  
  - **Commitment Devices:** "Bind" cards (force choosing LL) and "Ban" cards (block choosing SS). Traded via a TA broker.  
  - **Timer:** Projected countdown for delays.  

  ---

  ### Activity Rules & Timeline (75 Minutes Total)  
  **Prep (5 min):**  
  - Distribute 5 WT, 1 prediction sheet, and 1 choice card (A/B for SS/LL) to each student.  
  - Announce: *"Today, you’ll make choices between smaller-sooner (A) and larger-later (B) rewards. Bet on your choices to earn more. Halfway, you can trade tools to constrain future choices."*  
  - **NO theory hints.** Call SS/LL "Option A/B," not "smaller-sooner."  

  #### Phase 1: Reversals & Betting (25 min)  
  **Rounds 1–4:**  
  | Round | Time | SS (Option A) | LL (Option B) | Delay to B | Action |  
  |-------|------|---------------|---------------|------------|--------|  
  | 1 | 0:00 | 1 candy (or 2 tickets) | 2 candies (or 4 tickets) | 15 min | Choose A/B |  
  | 2 | 5:00 | 1 candy (or 2 tickets) | 2 candies (or 4 tickets) | 10 min | Predict + bet, then choose |  
  | 3 | 10:00 | 1 candy (or 2 tickets) | 2 candies (or 4 tickets) | 5 min | Predict + bet, then choose |  
  | 4 | 15:00 | 1 candy (or 2 tickets) | 2 candies (or 4 tickets) | 3 min | Predict + bet, then choose |  

  - **Predictions/Betting (Rounds 2–4):**  
    - Before choosing, students write: *"I predict I will choose [A/B] this round."*  
    - Stake 1 WT on their prediction.  
    - **Outcome:** Correct = gain 1 WT; Wrong = lose 1 WT.  
  - **Delayed Rewards:**  
    - LL rewards delivered at promised time (e.g., Round 1 LL arrives at 15:00).  
    - SS rewards delivered immediately after choice.  

  #### Phase 2: Commitment Market (25 min)  
  **Market Opens (20:00):**  
  - TA broker posts prices for commitment devices:  
    - **Bind (force LL):** Buy for 2 WT, sell back for 1 WT.  
    - **Ban (block SS):** Buy for 2 WT, sell back for 1 WT.  
  - **Trading Rules:**  
    - Students buy/sell devices with broker *or* trade peer-to-peer (TA records trades).  
    - Devices apply to **Round 5 only** (devices expire after use).  
    - *Crucial: If a student holds a Bind/Ban, they MUST obey it. If they "wriggle out," they lose 3 WT.*  

  **Round 5 (25:00):**  
  - SS: 1 candy (or 2 tickets) immediately  
  - LL: 2 candies (or 4 tickets) in **2 min** (delivered at 27:00)  
  - Students use devices (if owned) → choose.  

  **Round 6 (27:00):**  
  - SS: 1 candy (or 2 tickets) immediately  
  - LL: 2 candies (or 4 tickets) in **1 min** (delivered at 28:00)  
  - *No devices* → pure choice.  

  #### Final Settlement (5 min)  
  - Convert WT to rewards (1 WT = 1 candy or 2 lottery tickets).  
  - Students eat candy/submit lottery tickets.  

  ---

  ### Debrief (15 min)  
  **Map Key Moments to the Puzzles:**  
  1. **Reversal & "Change of Mind" (Hyperbolic Discounting):**  
     - *Ask:* "In early rounds (15-min delay), did you choose LL? In later rounds (3-min delay), did you switch to SS? Why?"  
     - *Highlight:* "At the switch, you likely felt SS was best *then*. This fits preference reversal. So why not call it a ‘rational’ change of mind?"  

  2. **Betrayal & Self-Distrust (The Itch):**  
     - *Ask:* "Who bet on themselves and lost? How did it feel? Why pay to ban SS or bind to LL?"  
     - *Highlight:* "You paid WT to constrain your future self. But if ‘you’ then = ‘you’ now, why not trust yourself? Why did mispredicting *your own choice* feel like a betrayal?"  

  3. **Gaps in the Activity:**  
     - *Admit:* "This captured reversals, regret, and self-distrust. But did anyone feel they were *actively defying their own judgment* WHILE choosing SS? Probably not. In real akrasia, you yell ‘Stop!’ at yourself mid-bite. We’ll unpack that next class."  

  **Introduce Terminology AFTER:**  
  - Name "hyperbolic discounting," "akrasia," "commitment devices."  

  ---

  ### Honest Failures & Mitigations  
  1. **The Hyper-Rational Players:**  
     - *Who:* Econ-savvy students treating it as a game-theory puzzle.  
     - *Risk:* No emotional engagement; they optimize WT, "game" the market.  
     - *Mitigation:*  
       - **In session:** Ask them: "Did you ever feel tempted? What would make this *harder* to ignore?"  
       - **Design:** Candy (physiological urge) > lottery tickets. Short delays force visceral choices.  

  2. **The Over-Anticipators:**  
     - *Who:* Students who know behavioral econ and pre-commit strategically.  
     - *Risk:* They "win" but miss the tension (e.g., buy Bind cards Round 1).  
     - *Mitigation:*  
       - Hide commitment rules until Phase 2.  
       - In debrief, ask: "If you pre-committed, did you feel smarter… or like you dodged a fight?"  

  3. **Market Collapse:**  
     - *Likely Flaws:*  
       - **Collusion:** E.g., "I’ll sell you my Ban card if you give me candy later."  
       - **Nonsense Trades:** Satirical prices (e.g., 100 WT for a Bind).  
     - *Mitigation:*  
       - TA broker enforces trades for cash (WT). No IOU/group deals.  
       - Penalize "wriggling out" (lose 3 WT) to enforce device integrity.  

  4. **What the Activity Can’t Capture:**  
     - **Acting Against Endorsed Judgment:** Students won’t feel "I am doing this *while* knowing it’s wrong." Trivial rewards lack moral/emotional weight.  
     - **Mitigation:**  
       - **Debrief confession:** "Real akrasia involves concurrent judgment—like knowing you’re betraying yourself *as you do it*. We simulated the before/after; next, we’ll dissect the during."  
       - **Homework prompt:** "Recall a time you acted against your better judgment *in the moment*. How was it different from today?"  

  **Why This Works:**  
  - **Delays are real/reversible:** LL candy arrives before class ends.  
  - **Betting makes misprediction costly/loud:** Losing WT hurts.  
  - **Commitment market quantifies self-distrust:** Paying to ban SS reveals doubt in future "self."  

  **Logistics:**  
  - **TA Roles:**  
    - Timekeeper (manages delays).  
    - Broker (runs commitment market; enforces trades).  
    - Recorder (tracks choices/bets on a public board).  
  - **Setup:**  
    - Candy pre-packed in SS/LL bundles.  
    - Project countdown timers for delays (e.g., "LL Reward Round 1: 14:59...").  

  This forces students to *live* the gap between theory (reversals as rational) and phenomenology (betrayal/regret). The market makes self-distrust visceral when they pay to constrain "themselves."
