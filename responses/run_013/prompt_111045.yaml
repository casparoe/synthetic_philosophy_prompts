answer: |-
  ## Project Proposal: The Missing Cause - Untangling How We Assign Blame When Systems Fail to Act  

  **Project Summary**  
  We increasingly rely on automated systems to make critical decisions: vehicles that brake, medical algorithms that triage, hiring tools that screen. When these systems *fail to act*—leading to crashes, missed diagnoses, or unfair rejections—we instinctively say they "caused" harm. But a troubling pattern emerges: whether we treat the omission as causal depends entirely on *how we describe it*. Shift the framing, and the causal claim solidifies or evaporates. This project investigates why, arguing that we conflate two distinct concepts of causation-by-omission—one thin and counterfactual, one thick and normative—and explores whether the "thick" version can be defined without smuggling in judgments about blame. The goal is a rigorous framework for public discourse on accountability in automated systems, grounded in conceptual clarity and real-world cases.  

  ### The Problem: When "Not Acting" Becomes the Cause  
  Recent reporting reveals a recurring dilemma:  
  - An autonomous vehicle *fails to brake* for a pedestrian obscured by glare.  
  - A hospital’s AI triage system *does not flag* a patient whose vital signs subtly deteriorate.  
  - A resume-screening algorithm *overlooks* a qualified candidate from an underrepresented group.  

  In each case, stakeholders agree the system’s **inaction contributed to harm**. Yet consensus fractures over whether this inaction was truly a *cause*. Critics point to a specific, expected function (e.g., "It should have detected Object X"). Defenders broaden the frame: "It didn’t do any of the infinite things it *could* have done." This pivot exposes a paradox: **causation-by-omission seems both obvious and illusory, depending on descriptive granularity and implicit norms**. This ambiguity fuels legal battles, policy paralysis, and public mistrust.  

  ### The Core Hypothesis & Question  
  I propose that "causation by omission" bundles two distinct ideas:  
  1. **Thin Causation**: A minimal, counterfactual sense: "If X had acted, harm would not have occurred." Almost *any* absent condition qualifies.  
  2. **Thick Causation**: A responsibility-laden sense: "X *should have* acted, and its failure breached an obligation." This is the sense that matters for accountability.  

  The thick sense appears to track norms (e.g., a brake system *ought* to stop the car; a triage tool *must* alert nurses). But does it *depend* on these norms, or can it be "laundered" into neutral terms? This leads to a determinate, tractable question:  
  > **Can "thick" causation-by-omission be defined *without* covertly appealing to judgments of obligation or blame—for example, by reducing it to non-normative factors like statistical typicality, contrastive framing, or contextual salience?**  

  ### Why Existing Frameworks Fall Short  
  Current theories handle only half the problem:  
  - **Counterfactual-Dependence Theories** (e.g., "but-for" causation) neatly capture *thin* causation but struggle to explain why only *some* omissions (e.g., "didn’t brake") feel causal, while others (e.g., "didn’t fly away") seem absurd. They quietly borrow normativity to "select" relevant omissions.  
  - **Contrastive Accounts** (defining causes via comparisons) helpfully highlight descriptive framing but often implicitly rely on normative expectations to pick the "right" contrast (e.g., "failed to brake" vs. "braked normally," not "failed to sprout wings").  

  This project avoids refereeing that stalemate. Instead, it targets the gap: **the interdependence of causal selection and normativity in omissions**.  

  ### Method: Conceptual Precision Meets Real-World Cases  
  Over 12 months, I will:  
  1. **Conceptual Groundwork** (Months 1–3):  
     - Define "omission" rigorously: Is it the absence of *any* possible action, or only *expected* actions? How do we individuate omissions (e.g., "didn’t brake" vs. "didn’t avoid the collision")?  
     - Map how norms (legal, ethical, functional) shape omission descriptions in tech, medicine, and tort law.  

  2. **Matched Case Analysis** (Months 4–9):  
     - Build a systematic battery of 30–40 documented cases (from journalism, court records, incident reports) where harm followed system inaction.  
     - For each case, **hold the facts fixed** while varying:  
       - **Description**: Reframe the omission (e.g., "didn’t apply Rule X" vs. "didn’t do something unforeseeable").  
       - **Contrast Class**: Alter the implied comparison (e.g., "unlike safe systems" vs. "unlike clairvoyant systems").  
       - **Normative Context**: Adjust perceived obligations (e.g., medical standards vs. engineering tolerances).  
     - Analyze how these shifts strengthen or weaken causal intuitions across domains.  

  3. **Synthesis & Framework Development** (Months 10–12):  
     - Test whether norm-free factors (e.g., salience, typicality) *consistently* explain "thick" causal attributions—or if norms remain ineliminable.  
     - Draft public-facing materials clarifying the distinction for policymakers and practitioners.  

  **Why this approach?** Surveys of intuitions would miss contextual nuance. Doctrinal legal analysis would overlook how norms function pre-legally. By isolating variables in real cases, I expose the machinery of causal attribution.  

  ### Expected Outcomes & Competing Conclusions  
  - **A Result**: Either:  
    - **Reduction Possible**: "Thick" causation reduces to non-normative selection mechanisms (e.g., contrast classes fixed by statistical baselines). *Deciding factor*: Consistency across domains when norms are varied.  
    - **Norms are Ineliminable**: "Thick" causation inherently references obligations; attempts to "launder" it fail. *Deciding factor*: Cases where causal attributions shift *only* when norms change, holding contrasts constant.  

  - **Project Failure Conditions**:  
    1. The thin/thick distinction collapses under scrutiny (e.g., all omissions are inherently normative).  
    2. Cases are too idiosyncratic to generalize.  
    3. Non-normative factors prove impossible to disentangle from obligations.  
    *(I will design the case battery in Month 3 to mitigate #2–3; #1 would be a significant philosophical finding.)*  

  ### Scope & Deliberate Exclusions  
  **Realistic 12-Month Scope:**  
  - Focus on 3 domains: transportation (AVs), healthcare (AI diagnostics), and hiring (algorithmic screening).  
  - Prioritize cases with clear documentation (NTSB reports, FDA audits, EEOC complaints).  
  - Produce a manuscript draft + 2–3 public essays.  

  **Exclusions:**  
  - Moral luck, free will, or metaphysical debates beyond omission specificity.  
  - Comprehensive legal reform proposals (though findings will inform them).  
  - Primary data collection (e.g., new experiments); this is synthesis of extant cases + conceptual analysis.  

  ### Why This Matters Now  
  As automated systems mediate life-altering decisions, confusion about omissions breeds inconsistent accountability: companies deflect blame ("the system didn’t *do* anything"), while victims struggle to pinpoint causes. By disentangling *descriptive* from *normative* layers of causation, this project offers tools for clearer policy, fairer adjudication, and more transparent public discourse—ensuring "the system failed" is more than a metaphor.  

  ---  
  **Next Steps:** With funding, I begin July 2024. I bring a track record of translating complex ideas for broad audiences (see attached CV) and a network of experts in law, AI ethics, and philosophy for consultation. This work will culminate in a book for a trade press and articles for outlets like *The Atlantic* or *WIRED*.
