  I need to structure this exactly as requested: five titled sections with specific word counts. The user explicitly doesn't want citations but wants historical uncertainties flagged. Their self-devised two-part test (public refusal mechanism + broad war aims) needs particular scrutiny.

  The theoretical framework requires precision. Collective responsibility theory must be defined rigorously - not just aggregation of individuals but institutional agency where decisions bind members. The individualist counterargument (Section 1) should emphasize how groups don't act, only individuals do. Then there's the intermediate position that shared intentions of influential groups matter even without formal procedures.

  For Section 2's historical mapping, I'll focus on Germany given the Versailles context. Key elements: the Chancellor/Bethmann Hollweg's role, General Staff pressure, public annexationism. The "blank cheque" to Austria-Hungary is crucial - was refusal possible given the Schlieffen Plan's constraints? War aims like Mitteleuropa clearly served elites but had wider nationalist support.

  In Section 3's evaluation, the theory explains systemic militarism but stumbles on the lack of democratic consent. The individualist would note that the Reichstag only voted funds after mobilization - too late to stop the war machine. Section 4 should conclude that WWI is an awkward case for collective responsibility - it confirms institutional capture but highlights the absence of popular agency.

  For their two-part test (Section 5), clause (i) collapses historically - no refusal mechanism existed in authoritarian Germany. Clause (ii) about broad war aims is more viable but still problematic - how broad is "sufficiently broad"? The whole analysis pivots on two disputed facts: whether Bethmann Hollweg deliberately risked war in July 1914, and how widespread popular annexationism was pre-war.

  The user's deeper need seems to be resolving whether moral judgments about nations are coherent. This requires separating legal liability (Versailles Article 231's actual purpose) from retrospective moral accounting - which their friend conflated. I'll maintain that distinction throughout.
answer: |-
  ### (1) The theory, stated  
  **Collective Responsibility (Agency Theory):** A nation bears responsibility when it possesses institutional structures that collectively authorize decisions, binding its members to outcomes. Key elements:  
  - **Authoritative Decision Procedure:** A recognized mechanism (e.g., parliament, monarchy) that formalizes group intent.  
  - **Binding Action:** Decisions made via this procedure commit the nation *as a whole*, transcending individual actors.  
  - **Intentionality:** The outcome aligns with the institution’s goals, even if unintended by all members.  
  Example: If a government votes for war after parliamentary approval, the nation is responsible—its institutional will executed the act.  

  **Individualist Rejoinder:** Only individuals act. "Nations" are abstractions; attributing intent or guilt to them commits a category error. Responsibility lies solely with specific leaders who chose war, not citizens or abstract entities. Collective guilt unjustly burdens innocents and obscures accountability.  

  **Intermediate View:** A nation is answerable when a dominant coalition (e.g., elites, press, parties) shares aims that enable a policy, creating a "culture of complicity." No formal procedure is needed, but widespread endorsement/acquiescence makes the outcome a collective product.  

  ---

  ### (2) The Mapping  
  **Actors:**  
  - *Government:* Chancellor Bethmann Hollweg, Kaiser Wilhelm II.  
  - *General Staff:* Helmuth von Moltke, advocating preemptive war.  
  - *Annexationist Lobbies:* Pan-German League, industrialists.  
  - *Press:* Major newspapers (e.g., *Berliner Tageblatt*) stoking nationalism.  
  - *Political Public:* Conservative/National Liberal parties, educated bourgeoisie.  

  **Decision Points:**  
  1. **5–6 July 1914:** "Blank cheque" to Austria-Hungary. *Refusal available?* Yes—Germany could have restrained Austria but chose escalation.  
  2. **23 July:** Austrian ultimatum to Serbia. *Refusal?* Germany could still mediate but doubled down.  
  3. **30–31 July:** Russian mobilization → German ultimatum to Russia/France. *Refusal?* Arguably no—General Staff insisted Schlieffen Plan required immediate action.  
  4. **1–4 August:** Declaration of war, invasion of Belgium. *Refusal?* None—military logic overruled diplomacy.  

  **Aims Served:**  
  - *Elites:* Territorial expansion (Mitteleuropa), breaking encirclement.  
  - *Broader Nation:* Nationalist prestige, economic dominance (supported by press/lobbies).  

  **"The Nation" Required for Attribution:** Government + General Staff + key lobbies + nationalist press. The war served their shared aims, and popular acquiescence (no mass protests) enabled action. Without these groups’ convergence, responsibility dissolves into individual actions.  

  ---

  ### (3) What the Theory Explains and What It Strains  
  **Explains:**  
  - Systemic militarism: War resulted from decades of institutionalized aggression (e.g., Schlieffen Plan, alliance rigidity).  
  - Cultural complicity: Nationalist press and lobbies created public tolerance for brinkmanship.  
  - Elite consensus: Key actors (government, army, industry) aligned on expansionist goals.  

  **Strains/Distorts:**  
  - **Democratic deficit:** Most Germans had no say in decisions; the Reichstag rubber-stamped war credits *after* mobilization.  
  - **Internal dissent:** Social Democrats opposed war initially but were marginalized.  
  - **Contingency:** Leaders (e.g., Bethmann) gambled; war wasn’t inevitable but stemmed from miscalculation.  

  **Individualist’s Reply:** The "system" was just individuals making choices: Moltke demanded mobilization; the Kaiser approved the blank cheque. Blaming "Germany" ignores that anti-war voices existed but were silenced by a handful of elites. The "culture" argument implicates non-actors unjustly.  

  ---

  ### (4) What the Case Shows About the Theory  
  WWI is a **qualified confirmation** of agency theory—but exposes its limits. Institutional actors (General Staff, monarchy) acted with binding authority, and their aims reflected broader nationalist currents. Defenders should welcome how it captures structural culpability beyond individuals.  

  However, it is **anomalous** in key ways:  
  - No single "decision moment" bound the nation; choices were fragmented among elites.  
  - The "nation" included powerless dissenters, straining moral accountability.  
  - The theory struggles with *unintended* escalation (e.g., leaders expected a localized war).  

  Ultimately, it confirms that institutions can bear responsibility but highlights the need to define "the nation" narrowly (as the decisive coalition, not the populace).  

  ---

  ### (5) Verdict on Our Test  
  **Your two-part test:**  
  - **(i) Refusal mechanism:** *Fails.* No such mechanism existed. The Kaiser and General Staff controlled decisions; public/parliament had no veto pre-war. Even the Reichstag was sidelined until after invasions began.  
  - **(ii) Broad aims:** *Survives but is flawed.* Annexationist goals were held by elites, industrialists, and much of the press—but their influence doesn’t prove *popular* endorsement. "Sufficiently broad" is vague; it risks conflating elite aims with national will.  

  **(i) is doing no work** in 1914 Germany due to authoritarianism. **(ii) carries the weight** but is overinclusive: it could blame a nation for elite actions if propaganda swayed the public.  

  **What would change the verdict?**  
  - If Germany had a parliament with pre-war veto power (e.g., UK’s House of Commons).  
  - If mass protests forced leaders to desist (as nearly happened in July 1914 *if* Social Democrats mobilized earlier).  

  **Disputed Facts:**  
  1. **German intentionality:** Was the blank cheque a high-risk bluff (Fischer) or a defensive move (revisionists)?  
  2. **Public opinion:** How widespread was pre-war annexationism? Some historians argue it was elite-driven; others cite nationalist groups with 500,000+ members.  
  Avoid leaning on these; both remain contested.  

  **Final Note:** Your test’s value lies in **(ii)**—but it needs tightening to distinguish elite capture from genuine popular complicity.
