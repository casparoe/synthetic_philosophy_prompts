          But note: if p=0 or q=0, then Outcome 1 has probability 0 -> then we set it to 0 and the expected value is finite? Let's see:

            If p=0: then Outcome 1: prob=0, Outcome 2:0, Outcome 3:1 -> payoff = -c.
