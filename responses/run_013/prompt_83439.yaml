answer: |-
  Below is a decision procedure for evaluating grant proposals, designed to be executed by analysts in under an hour per proposal. It systematically checks for undefined expected values (e.g., Pasadena-style failures), infinite payoffs, unestimable probabilities, and non-monetary payoffs. Steps requiring judgment are marked with ⚠️. The procedure halts with a "No" if a proposal violates core rules (undefined EV, negative/zero EV), or hands the decision to trustees when values (not arithmetic) are unresolved. For Pasadena-style cases, it mandates recomputation under an alternative partitioning and rejects if results disagree.

  ---

  ### **Decision Procedure: Expected Value Verification**
  **Input**: Grant proposal with outcome space, probabilities, payoffs.  
  **Output**: Recommend (✓), Reject (✗), or Hand to Trustees (↯).  
  **Time Budget**: 45-60 minutes per proposal.  
  **Rules**: Reject if EV is undefined or non-positive. All payoffs must be in a consistent utility unit (e.g., QALYs, dollars).

  #### **Step 1: Partition Outcome Space**  
  **Question**: "List all mutually exclusive, exhaustive outcomes. For continuous variables, discretize into natural intervals (e.g., severity bins)."  
  **Sufficient Answer**:  
  - Outcomes cover 100% of possibilities, are non-overlapping, and discretization is justified (e.g., "Mortality risk: 0–1%, 1–5%, 5–100%").  
  **Failure**:  
  - ↯ If partitioning is impossible (e.g., vague outcomes like "unknown unknowns").  
  **Judgment**: ⚠️ Choice of discretization intervals.  

  #### **Step 2: Assign Probabilities**  
  **Question**: "Assign probabilities to each outcome. Can all be bounded above zero?"  
  **Sufficient Answer**:  
  - Probabilities sum to 1 ± 0.01. All are point estimates or tight bounds (e.g., "≤1e-6").  
  **Failure**:  
  - ↯ If any probability is unestimable (e.g., "We cannot bound P(asteroid impact)").  
  **Judgment**: ⚠️ Estimating "tight" bounds for extreme events.  

  #### **Step 3: Assign Payoffs (Utility Conversion)**  
  **Question**: "Convert all payoffs to a common utility (e.g., dollars). Are any payoffs infinite, non-monetary, or unconvertible?"  
  **Sufficient Answer**:  
  - All payoffs finite and converted (e.g., "1 life saved = $10M").  
  **Failure**:  
  - ↯ If non-monetary payoffs resist conversion (e.g., "Aesthetic value of biodiversity cannot be monetized").  
  - Proceed to **Step 4** if any payoff is ±∞.  
  **Judgment**: ⚠️ Utility conversion factors.  

  #### **Step 4: Handle Infinite Payoffs**  
  **Question**: "Do any outcomes have ±∞ utility with non-zero probability?"  
  **Rules**:  
  - If **+∞ and −∞ coexist** (e.g., 1% chance of heaven, 1% chance of hell): ✗ Reject (undefined EV).  
  - If only **+∞** (e.g., 0.1% chance of saving ∞ lives): EV = +∞ → Proceed to Step 7.  
  - If only **−∞** (e.g., 0.1% chance of extinction): EV = −∞ → ✗ Reject.  
  - If ±∞ at **zero probability**: Ignore (set payoff = 0).  
  **Judgment**: ⚠️ Defining "non-zero" probability (e.g., is 1e-20 "zero"?).  

  #### **Step 5: Compute Expected Value (Natural Partition)**  
  **Question**: "Calculate EV₁ = Σ(Probₙ × Payoffₙ) in the natural order (e.g., chronological, by severity)."  
  **Sufficient Answer**:  
  - EV₁ converges absolutely (i.e., Σ|Probₙ × Payoffₙ| < ∞). → Proceed to Step 7.  
  - If Σ|Probₙ × Payoffₙ| = ∞, compute partial sums. Does EV₁ converge to a finite value?  
    - **Yes (conditional convergence, e.g., Pasadena)**: → Proceed to **Step 6**.  
    - **No (diverges)**: ✗ Reject (undefined EV).  
  **Judgment**: ⚠️ Defining "natural order" and numerical convergence thresholds.  

  #### **Step 6: Recompute Under Alternative Partitioning**  
  **Question**: "Regroup outcomes (e.g., pair consecutive events, cluster by payoff magnitude). Calculate EV₂."  
  **Rules**:  
  - Choose a **legitimate alternative grouping** (e.g., for Pasadena: group flip pairs [(n=1,2), (n=3,4), ...]).  
  - Compare EV₁ and EV₂:  
    - If |EV₁ − EV₂| > 10% of |EV₁| → ✗ Reject (Pasadena-style failure).  
    - Else, ✗ Reject anyway (conditional convergence implies fragility).  
  **Sufficient Answer**: EV₂ calculation with justification for regrouping.  
  **Judgment**: ⚠️ Choice of alternative partition.  

  #### **Step 7: Check Sign of EV**  
  **Question**: "Is EV > 0?"  
  **Rules**:  
  - If EV > 0 or +∞ → ✓ **Recommend**.  
  - If EV ≤ 0 → ✗ **Reject**.  
  **Note**: EV is now defined (absolute convergence or +∞).  

  ---

  ### **Procedure Applied to Three Proposals**
  #### **Proposal A: Portfolio of Long-Shot Research Grants**  
  - **Modeled benefits**: Unbounded (e.g., cure for aging → ∞ utility).  
  - **Step 1**: Partitioned by project (e.g., 10 grants).  
  - **Step 2**: Probabilities assigned (e.g., P(success) = 0.001–0.01).  
  - **Step 3**: Payoffs finite but unbounded (e.g., $1B–$1T per success). → Proceed.  
  - **Step 4**: No ±∞ payoffs.  
  - **Step 5**: Σ|Probₙ × Payoffₙ| = ∞ (heavy tails). EV₁ converges to $5M. → **Step 6**.  
  - **Step 6**: Regroup by payoff magnitude (e.g., $0–$10M, $10M–$1B, >$1B). EV₂ = −$2M. |EV₁ − EV₂| > 10% → ✗ **Reject** (Pasadena-style).  

  #### **Proposal B: Monitoring Program for ∞-Loss Aversion**  
  - **Justification**: 0.001% chance of averting human extinction (−∞ utility).  
  - **Step 1**: Outcomes: {Avoid extinction, Extinction}.  
  - **Step 2**: P(extinction) = 0.00001 (bounded).  
  - **Step 3**: Payoffs: Extinction = −∞, Avoid = −$1M (cost).  
  - **Step 4**: Only −∞ with non-zero P → EV = −∞ → ✗ **Reject**.  

  #### **Proposal C: Flagship Program (Undefined EV)**  
  - **Analyst report**: EV undefined.  
  - **Step 1**: Partitioned by timeline (e.g., impact in Year 1, 2, ...).  
  - **Step 2**: Pₙ = (1/2)ⁿ (geometric decay).  
  - **Step 3**: Payoffₙ = (−1)ⁿ × 2ⁿ / n (Pasadena structure).  
  - **Step 4**: No ∞ payoffs.  
  - **Step 5**: Σ|Pₙ × Payoffₙ| = Σ(1/n) = ∞. EV₁ = ln(2) ≈ $0.7M → **Step 6**.  
  - **Step 6**: Regroup into pairs [(n=1,2), (n=3,4), ...]. EV₂ = $0.4M. |EV₁ − EV₂| > 10% → ✗ **Reject** (Pasadena-style).  

  ---

  ### **Limitations and Judgment**  
  - **Cannot Decide**:  
    - Deep uncertainty (e.g., "unknown unknowns" with no probability bounds).  
    - Value disputes (e.g., "How much is a human life worth?").  
    - Interdependent outcomes (e.g., game-theoretic equilibria).  
  - **Judgment Steps**: ⚠️ Partitioning (Step 1), probability bounds (Step 2), utility conversion (Step 3), convergence thresholds (Step 5), alternative grouping (Step 6).  
  - **Key Weakness**: Relies on analysts to identify "natural" partitions; may miss pathological cases with >2 regroupings.  

  **Output Summary**:  
  - A: ✗ Reject (Pasadena).  
  - B: ✗ Reject (−∞ EV).  
  - C: ✗ Reject (Pasadena).  

  This procedure ensures compliance with the trustees' rule while delegating value-laden ambiguities upward. Analysts can execute it rapidly by focusing on the most salient partitions and using conservative numerical checks.
