          Alternatively, we compute the absolute expected value for the entire portfolio. But by linearity of absolute value? Not exactly: |a+b| <= |a|+|b|, but we are summing the absolute expectations. However, the absolute expectation of the portfolio is not the sum of the absolute expectations of the projects? Because the projects are independent, the absolute expectation of the portfolio might be harder to compute. But we can require that each project has finite absolute expectation? Then by the triangle inequality, the portfolio has finite absolute expectation? 

          So we require for each project j: 
              |EV_abs_j| = p_j * E[|payoff_j| | success] + (1-p_j)*0 < ∞
          Then the portfolio's absolute expected value is bounded by the sum of these, which is finite.

          Therefore, if every project has a finite absolute expected value, then the portfolio has a finite expected value and we can compute it. Then we proceed to Step 7.

