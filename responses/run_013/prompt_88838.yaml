  Top marks require recognizing that expanding the proposition set changes the evaluation, plus committing to where the flaw lies. The A/B differentiator should be whether they see that recovering criticism of the Passer requires supplementing accuracy-first with inquiry norms—and admitting that undermines its "sole fundamental good" claim. 

  *checks wordcount* Model answer needs to stay tight—800 words to show depth without overwhelming. Should explicitly reject "fixes" like penalizing skips or reweighting questions, since those concede the framework's insufficiency. 

