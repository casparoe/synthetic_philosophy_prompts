  The exam constraints are tight: 90 minutes, closed-book, one page of notes. So the question must force engagement with first principles, not literature recall. The marking scheme should reward insight about how proposition selection affects scoring, and whether the flaw lies in the agent's choices or the scoring system itself. 

  Key design challenges: First, the question must prevent students from retreating to standard arguments about coherence. Second, it needs to force them to consider scoring over different proposition sets—what if we evaluate the Passer's minimal credences over a larger algebra? Third, they must explicitly diagnose where the problem resides (agent/inquiry/metric). 

  *scribbles draft* 
