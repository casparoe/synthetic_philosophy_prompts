answer: |-
  ### Exam Question  
  **Formal Epistemology Final Examination**  
  **Time Allowed: 90 minutes**  
  **Instructions:** Answer the following question. You may use one handwritten A4 page of notes. Do not reproduce textbook arguments verbatim. Engage critically with the case.  

  ---  
  **QUESTION**  
  In a forecasting league, competitors score points by submitting credences for propositions. Skipped propositions incur no penalty and are excluded from scoring. The "Passer" wins the season by *only* submitting credences of 0 or 1 for propositions whose truth-values she can immediately verify (e.g., "The dean’s office door is blue"), skipping all unresolved or substantive propositions. She achieves a perfect average score under a strictly proper scoring rule.  

  1. **Explain** why accuracy-first epistemology (AFE), which holds that (a) accuracy is the sole fundamental epistemic good and (b) credences must be probabilistic to avoid accuracy-domination, *cannot* criticize the Passer’s epistemic conduct. (6 marks)  
  2. **Analyze** what happens when we evaluate the Passer’s *actual credence function* (defined only over trivial propositions) over a **larger algebra** that includes substantive propositions (e.g., "Interest rates will rise next quarter"). Does this reveal an epistemic defect? Why or why not? (6 marks)  
  3. **Diagnose** the root problem: Is the flaw in (i) the Passer’s credences, (ii) her inquiry strategy, or (iii) the league’s scoring metric? Defend your view. (4 marks)  
  4. **Argue**: What minimal addition must AFE make to condemn the Passer’s strategy? What core tenet of AFE does this addition compromise? (4 marks)  

  ---  
  ### Model Answer (798 words)  

  #### 1. AFE’s Inability to Criticize the Passer  
  Accuracy-first epistemology (AFE) evaluates credences solely via *scoring rules* applied to *submitted forecasts*. The Passer’s submitted credences are perfectly accurate (all 0s/1s match truths) and coherent *over her chosen domain* (a trivial sub-algebra). AFE’s core arguments thus cannot fault her:  
  - **Strict propriety** ensures her forecasts are immaculate for her submissions; no alternative credence over *those propositions* would score better.  
  - **Accuracy-domination avoidance** is satisfied: her credence function is probabilistic over its domain (a set of independent, decidable facts).  
  - **Accuracy as sole good**: AFE ignores *which* propositions are selected. Skipping generates no accuracy penalty, and AFE lacks resources to criticize *omission* of inquiry. The Passer maximizes accuracy *given her submissions*; AFE is silent on whether she *should have submitted more*.  

  Thus, AFE sees the Passer as epistemically impeccable: she dominates all local alternatives. Her "worthlessness" stems from *withholding judgment* on non-trivial questions—a defect AFE cannot articulate.  

  #### 2. Evaluating Over a Larger Algebra  
  Suppose we score the Passer’s *actual* credence function—defined only over trivial propositions—over a larger algebra **ℒ** that includes unresolved, substantive propositions (e.g., economic predictions). Her credence function **P** is **incomplete**: it assigns no values to propositions outside her trivial sub-algebra. To score **P** over **ℒ**, we must extend it to a full probability function. Critically:  
  - **Any extension** (e.g., assigning **P(q)=0.5** to all unassigned propositions) creates a coherent credence function over **ℒ**.  
  - **But**: This extended function is **accuracy-dominated** by other probability functions. For example, if the true probabilities of economic propositions are skewed, a uniform extension will be outscored by one matching the true chances.  

  **Does this reveal a defect?** Only ambiguously:  
  - **No**, because **P** was never *meant* to cover **ℒ**. The Passer deliberately restricted her domain; judging her over **ℒ** misrepresents her epistemic state. AFE evaluates agents *relative to their expressed credences*, not hypothetical extensions.  
  - **Yes**, *if* we demand that agents have credences over "significant" propositions. But AFE lacks a theory of significance. The domination arises from *our* choice of algebra, not her failure within her chosen scope. Thus, AFE still cannot condemn her—it only shows that *if* she had engaged with **ℒ**, she’d need a better strategy. But she didn’t.  

  #### 3. Diagnosing the Flaw  
  The flaw lies in **(ii) her inquiry strategy**, not her credences or the metric:  
  - **Credences (i)**: Her assignments are flawless for her submissions. To label them defective is to confuse *scope* with *incorrectness*.  
  - **Metric (iii)**: The league’s scoring rule is strictly proper and rewards accuracy. Penalizing skips would violate AFE’s commitment to "no penalty for withholding" (which avoids coercing opinions).  
  - **Inquiry (ii)**: The Passer’s failure is *propositional parsimony*: she inquires only where inquiry is cost-free and unreflective. Epistemically responsible agents should engage with propositions where accuracy *matters* (e.g., for deliberation). But AFE cannot say this—it lacks a "mattering" condition.  

  The Passer is like an archer who only shoots at unmoving targets 1cm away. Her *shots* are perfect; her *choice of targets* is the issue.  

  #### 4. Augmenting AFE to Condemn the Passer  
  To criticize the Passer, AFE must add a norm that **inquiry should cover propositions relevant to epistemic goals** (e.g., understanding, deliberation). For example:  
  - **Inquiry robustness**: Agents must submit credences for propositions where accuracy is *informative* (e.g., non-redundant, predictive, or explanatory).  
  - **Weighted scoring**: Assign higher scoring weights to "substantive" propositions.  

  **Cost to AFE**: This abandons the thesis that accuracy is the **sole fundamental epistemic good**. We now need:  
  - A theory of *epistemic significance* (e.g., "propositions central to explanatory frameworks").  
  - A value *beyond accuracy* (e.g., "comprehensiveness") to ground this theory.  

  This collapses AFE’s purity. If "significance" is itself an epistemic good, accuracy is not *fundamental*—it may be derivative of comprehensiveness or relevance. Alternatively, if significance is non-epistemic (e.g., practical), AFE becomes hybrid. Either way, the "sole good" claim is lost.  

  **Conclusion**: The Passer exposes AFE’s blind spot: it evaluates *credences*, not *inquiry*. To condemn her, AFE must incorporate norms for *which* propositions merit credences—a move that forces it to acknowledge epistemic goods beyond accuracy or to adulterate its foundations with non-epistemic values.  

  ---  
  ### Marking Scheme (Total: 20 marks)  
  **Must-hit points** (marks deducted if missed):  

  | **Points**                                                                                                | **Marks** | **Common Miss**                                                                 |
  |-----------------------------------------------------------------------------------------------------------|-----------|---------------------------------------------------------------------------------|
  | **Q1**: AFE cannot criticize Passer because her *submissions* are accurate/coherent over their domain; skipping is "free" under AFE. | 3 | Students argue Passer is incoherent (she isn’t) or that propriety implies broader duties (it doesn’t). |
  | **Q1**: AFE’s "sole good" thesis ignores proposition selection. Skipping isn’t an accuracy defect.                                | 3 | Students claim skipping is "inaccurate by omission" (inventing non-AFE norms). |
  | **Q2**: Extending Passer’s credence to **ℒ** *can* make her accuracy-dominated, but this misrepresents her actual epistemic state. | 3 | Assumes AFE *must* evaluate over **ℒ**, ignoring agent’s chosen scope. |
  | **Q2**: Domination over **ℒ** only shows risk if she engaged with **ℒ**—but she didn’t. AFE still doesn’t fault her.           | 3 | Claims domination proves her credences are defective *simpliciter* (confuses scope). |
  | **Q3**: The flaw is in inquiry (ii), *not* credences/metric. Credences are perfect; metric is proper; inquiry is unambitious.   | 2 | Blames the metric (iii) for not penalizing skips—but this changes AFE. |
  | **Q3**: Explicit rejection of credences/metric as the locus.                                          | 2 | Says defect is "in her credences" because she avoids hard questions (misattribute). |
  | **Q4**: Any viable addition (e.g., inquiry norms, weighted scoring) requires abandoning "accuracy as sole good".             | 2 | Suggests technical fixes (e.g., "penalize skips") without theoretical costs. |
  | **Q4**: Names the cost: supplements accuracy with another good (e.g., comprehensiveness) or adulterates AFE.              | 2 | Claims additions are "still accuracy-first" (ignores fundamentality). |

  **Grading Standard**:  
  - **A (17–20)**: Hits all 8 points; explicitly notes that Q2’s domination is an *artefact of algebra choice*; commits to inquiry as the flaw; states that fixing AFE requires *non-accuracy goods*.  
  - **B (13–16)**: Misses 1–2 key points (often Q2’s "misrepresentation" or Q4’s "cost"); confuses inquiry failure with credence incoherence; vague on why adding inquiry norms breaks AFE.  
  - **C (9–12)**: Misses 3+ points; retreats to standard dominance/propriety arguments; misdiagnoses the flaw as incoherence or scoring-rule defect.  
  - **D (5–8)**: Describes AFE machinery without engaging the case.  
  - **F (0–4)**: Unrelated or incoherent.  

  **Key A/B Differentiator**:  
  - **A** answers recognize that the **larger-algebra evaluation is foreign to AFE** (as it judges the agent for propositions she ignored) and state that condemning the Passer **forces AFE to reject "accuracy as sole good"**.  
  - **B** answers note the algebra issue but fail to link it to inquiry norms, or propose fixes without admitting theoretical costs.  

  ---  
  **Design Notes**:  
  - The question avoids "name-the-author" traps by focusing on arguments. Literature is irrelevant here.  
  - The Passer’s coherence is preserved: her domain is a consistent sub-algebra. Students cannot escape by disputing the case setup.  
  - Q2 forces engagement with *scope relativity*—the core insight that AFE’s evaluation is algebra-relative.  
  - The model answer’s diagnosis (inquiry failure) and AFE’s limitation (no tools for it) are explicit, satisfying the user’s crux requirement.
