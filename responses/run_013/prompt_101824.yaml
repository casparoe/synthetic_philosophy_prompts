  ## The Audit Window

  The Port Haven Fisheries Compliance Office smells perpetually of damp wool and printer toner. Senior Inspector Marta Varga stares at her terminal’s twin displays. On the left, the **Public Tally**: 1,842 tons reported landed this quarter. Her bonus, her performance review, her chance at the coveted Deputy Director slot next year – all hang on that green number climbing steadily. It’s built from the catch logs submitted by every trawler captain in her sector. Her job is to verify them, a task involving cross-referencing fuel receipts, hold capacities, and occasionally a dockside inspection. Mostly, she takes the logs at face value. Everyone does. The captains know the rules; they want their quotas filled too.

  On the right screen, a stark white rectangle reads: **AUDIT WINDOW: ACTIVE**. No number here. Just the label. This is the shadow system. Once a year, for two weeks, anonymous auditors from some temp agency Marta never sees descend. They pull random shifts from the past year, re-verify *everything* – fuel consumption against engine specs, satellite tracking data against reported fishing grounds, even cross-checking fishmonger purchase records against declared hauls. They calculate the **True Stock Impact**, a complex ecological metric supposedly reflecting real fish populations versus reported catches. Their mandate is absolute secrecy: no feedback, no consequences, just measurement. Their findings vanish into a vault. The theory was simple: this number, untouched by incentives, would be incorruptible. A silent guardian against the Public Tally’s inevitable drift.

  Except something’s leaking.

  Marta noticed it last year. A subtle shift in the auditors’ demeanor during their brief, anonymous interactions – a fractional pause when reviewing certain captains’ files, an almost imperceptible tightening around the eyes when Marta presented exceptionally *clean* logs. Whispers started. Old Captain Riordan, usually taciturn, muttered over coffee about auditors asking pointed questions about "discrepancies in fuel efficiency logs." Then, three months ago, the impossible: Deputy Director Chen, retiring, leaned in during her farewell drinks. "Between us, Marta? Watch the Audit Window. It’s… twitchy. Started feeling like they weren’t just counting fish." He’d refused to elaborate.

  Now, Marta faces Captain Silas Crowe’s log for Week 14. His reported catch: 120 tons of cod. His fuel receipt: suspiciously low for that haul, given the weather patterns recorded offshore. The Public Tally demands she accept it; Silas is reliable, mostly. Her own performance metrics sparkle when logs flow smoothly. But the phantom pressure of the Audit Window prickles her neck. *Would this shift be pulled? Would the auditors spot the fuel anomaly? Would their silent judgment – whatever form it took in that secret number – somehow ripple back?* She can’t prove it, but the air in the office feels thinner, charged with an unspoken metric.

  Her colleague, Ben, fresh from verifying a different log, flops into his chair. "Crowe again? Man’s hauling miracles this season." He taps his own Public Tally display – soaring. "Gotta love a captain who dots his i's. Smooth sailing." He doesn’t mention the Audit Window. Nobody does officially. But Ben’s been glancing at the white rectangle more often lately, a nervous tic.

  Marta hesitates. Flagging Crowe’s log means investigation: delays, paperwork, friction. It risks her Public Tally growth. Silas might complain. Her boss might frown. And for what? The Audit Window’s judgment is silent, distant, a yearly phantom. Yet… that phantom feels closer. If the True Stock Impact starts silently *tracking* the Public Tally – not because auditors cheat, but because the mere *knowledge* of their secret gaze makes inspectors like her subconsciously avoid friction, favouring clean logs over true ones – then the guardian becomes an accomplice. The firewall isn’t breached; it’s breathing the same polluted air.

  Ben sighs, stretching. "Thinking deep thoughts, Varga? Just approve it. Silas is good value. Keeps the numbers sweet." He gestures vaguely at his thriving Public Tally. "Who cares about the spooks in the back room? They don’t pay our mortgages."

  Marta’s finger hovers over the 'Accept' key. The phantom metric presses down. Acceptance means safety, a higher bonus, a step towards Deputy Director. But it also means feeding the quiet corrosion, letting the unmeasured watcher warp the measure, one unscrutinized log at a time. She thinks of Chen’s warning: *It’s twitchy*. The silence of the Audit Window isn’t neutral anymore; it’s a vacuum sucking honesty out of the room. She looks at Crowe’s implausibly efficient fuel figure, then back at the impassive white ‘AUDIT WINDOW: ACTIVE’ rectangle. The office hums with the sound of compliant keystrokes.

  Marta clicks ‘Accept’. The Public Tally ticks up to 1,962 tons. The Audit Window remains blank, silent, watching. Ben grins. "Attagirl. Smooth sailing."

  ---

  **Why I did it this way**

  *   **Mechanism Over Moral:** I focused on the *how* of the leak – not overt corruption, but the subtle, unconscious pressure of being watched, making Marta favour frictionless approval (benefiting the Public Tally) to avoid potential *implied* scrutiny from the Audit team. The auditors' unspoken reactions and Chen's hint create the "smell" without explicit rewards/punishments.
  *   **The Tracking Temptation:** The core tension is whether the True Stock Impact (TSI) will start mirroring the Public Tally *because* inspectors like Marta change their behaviour due to the *awareness* of the audit, not because the auditors themselves are corrupt. Ben embodies the complacent acceptance of this drift.
  *   **Avoiding the Obvious Crash:** I resisted ending with ecological collapse or Marta getting caught. Instead, the climax is a quiet, corrosive choice – Marta consciously prioritizes the measurable incentive (Public Tally/bonus/career) *because* the unmeasurable pressure of the Audit Window makes truth-seeking feel risky and pointless. The system wins through silent complicity, not dramatic failure. The closing line ("Smooth sailing") underscores the hollow victory of the gamed metric.
