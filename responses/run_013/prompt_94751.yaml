  Final tree and scoring key:

  **Decision Tree for Acausal Decision Theories**

  1. Is the rational choice for an act determined solely by the causal consequences of that act?
     - **Yes** -> **Causal Decision Theory (CDT)**
     - **No** -> 2.

  2. Do you believe that acausal decision problems (like Newcomb and counterfactual mugging) are well-posed (i.e., have a rational solution)?
