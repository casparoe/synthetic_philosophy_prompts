  - A view that is non-causal, well-posed, and pays in one-shot and also says the problem is ill-posed? Contradiction because they said well-posed and then paid, so it's resolved.

  **Flagged uncertainty:** I am least confident about the answer for EDT in the one-shot counterfactual mugging. Some formulations of EDT might pay, but I believe the standard view does not. However, this is a point of ongoing debate.

  **Forced choices:** The tree forces a stance on whether one-shot counterfactual mugging is a genuine problem: FDT says yes (pay), the pre-commitment view says it's only solvable by pre-commitment (so without pre-commitment, it's not rational to pay), and EDT says no (don't pay). This reflects the literature's disagreement.

