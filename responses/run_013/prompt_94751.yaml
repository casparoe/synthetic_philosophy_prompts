  ### Decision Theory Tree for Acausal Problems: From Basic Commitments to Positions

  After brainstorming, I identified the core distinctions that drive positions on acausal problems (where an agent's choice is *correlated* with, but does not *causally influence*, a payoff-relevant fact). Crucially, these distinctions are **not verbal**—they generate testable differences in the target cases (Newcomb's problem, counterfactual mugging one-shot/policy, and XOR blackmail). The key distinctions are:

  1. **Causal vs. non-causal dependence**: Whether rationality depends *only* on causal consequences (e.g., "Does my choice cause the outcome?").
  2. **Object of evaluation**: Whether rationality evaluates *individual acts* (what to do now) or *policies/procedures* (what to do across all possible situations, including counterfactuals).
  3. **Treatment of known counterfactuals**: How to handle cases where the agent knows the actual outcome but must consider counterfactual scenarios (e.g., counterfactual mugging when the coin is known to be tails).
  4. **Pre-commitment legitimacy**: Whether pre-commitment is required to resolve acausal problems "rationally."
  5. **Problem well-posedness**: Whether acausal problems are coherent or inherently ill-posed.

  Discarded distinctions:  
  - "Belief in free will" or "determinism" (irrelevant; all theories assume choices are free in the decision-relevant sense).  
  - "Subjective vs. objective probabilities" (all views use subjective probabilities; differences lie in *how* they're applied).  
  - "Rationality as selfish vs. moral" (we focus on instrumental rationality for payoff maximization).

  **Confidence notes**:  
  - High confidence (≥90%) in the tree structure and scoring, based on standard literature (e.g., Joyce, Yudkowsky, Soares, MacAskill).  
  - Moderate confidence (70%) in the placement of EDT in counterfactual mugging (some argue EDT *should* pay; I follow the consensus that it doesn't).  
  - **Lowest confidence (60%)**: Whether "pre-commitment is the only solution" is a *distinct view* or a variant of policy-based theories. I treat it separately due to its focus on temporal commitment, but it might overlap with FDT/UDT. This is flagged in the tree.

  ---

  ### Decision Tree
  **Instructions**: Start at Q1. Answer based on your intuition about rationality, not theory labels. Each question is answerable without knowing the outcomes.

  #### Q1. Is an act rational *only* if it maximizes expected utility based on **causal consequences** (i.e., how your choice *causes* outcomes, ignoring correlations without causation)?
  - **Yes** → Go to Q2.  
  - **No** → Go to Q3.  

  #### Q2 (if Q1=Yes). In Newcomb's problem, do you take both boxes?
  - **Yes** → **Leaf 1: Causal Decision Theory (CDT)**.  
    *Rationale:* Dominant causal action; correlations are irrelevant.  
    *Cases:*  
    - Newcomb: Two-box.  
    - One-shot mugging (tails): Don't pay (paying doesn't cause $10k).  
    - Policy mugging: Set policy to never pay.  
    - Blackmail: Don't comply (compliance doesn't cause threat disarmament).  
  - **No** → *Unoccupied. Diagnosis:* Incoherent. If causation is all that matters, two-boxing dominates. Defenders of one-boxing reject Q1.

  #### Q3 (if Q1=No). Are acausal problems (e.g., Newcomb, mugging) **well-posed**? (i.e., is there a rational solution without changing the problem?)
  - **No** → **Leaf 2: Problem Ill-Posed**.  
    *Rationale:* Acausal correlation implies contradiction (e.g., "rational" choice depends on impossible counterfactuals).  
    *Cases:* All rejected as incoherent.  
  - **Yes** → Go to Q4.  

  #### Q4 (if Q3=Yes). In **one-shot counterfactual mugging** (you know the coin is tails; paying $100 gets nothing but *would have* given $10k if heads), is paying rational?
  - **Yes** → **Leaf 3: Functional Decision Theory (FDT)/Timeless/Updateless (TDT/UDT)**.  
    *Rationale:* Evaluate the *output of your decision function* across all counterfactuals. Paying maintains consistency, increasing expected utility.  
    *Cases:*  
    - Newcomb: One-box (being a one-boxer causes the predictor to fill the box).  
    - One-shot mugging (tails): Pay.  
    - Policy mugging: Set policy to pay.  
    - Blackmail: Comply or not based on global policy optimization (complies if threat/independence parameters favor it).  
  - **No** → Go to Q5.  

  #### Q5 (if Q4=No). In **policy-based counterfactual mugging** (set policy before the coin flip: pay if tails, nothing if heads), is setting a policy to *pay in tails* rational?
  - **Yes** → **Leaf 4: Pre-Commitment View**.  
    *Rationale:* One-shot mugging is irrational without pre-commitment; rationality requires binding policy choices in advance.  
    *Cases:*  
    - Newcomb: One-box (via pre-commitment).  
    - One-shot mugging (tails): Not rational to pay (without pre-commitment).  
    - Policy mugging: Set policy to pay.  
    - Blackmail: Pre-commit to comply/non-compliance based on expected utility.  
  - **No** → **Leaf 5: Evidential Decision Theory (EDT)**.  
    *Rationale:* Acts are rational if they maximize conditional expected utility (i.e., *evidence* about outcomes).  
    *Cases:*  
    - Newcomb: One-box (one-boxing *correlates* with a full box).  
    - One-shot mugging (tails): Don't pay (paying provides no evidence of $10k in *this* world).  
    - Policy mugging: Set policy to not pay (conditional on the policy, paying in tails has negative expected utility).  
    - Blackmail: Don't comply (compliance is evidence that the threat is armed, making it harmful).

  ---

  ### Scoring Key and Unoccupied Combinations
  Map your answers to a leaf:

  | Q1 | Q2 | Q3 | Q4 | Q5 | Leaf                          |
  |----|----|----|----|----|-------------------------------|
  | Y  | Y  | -  | -  | -  | 1. CDT                       |
  | N  | -  | N  | -  | -  | 2. Problem Ill-Posed         |
  | N  | -  | Y  | Y  | -  | 3. FDT/TDT/UDT               |
  | N  | -  | Y  | N  | Y  | 4. Pre-Commitment View       |
  | N  | -  | Y  | N  | N  | 5. EDT                       |

  **Unoccupied combinations and diagnoses**:  
  - **Q1=No, Q3=Yes, Q4=Yes, Q5=No**: *Incoherent*. Paying in one-shot mugging requires counterfactual policy reasoning (like FDT), so rejecting the policy version is inconsistent.  
  - **Q1=Yes, Q2=No**: *Incoherent*. If causation is all that matters, one-boxing can't be rational (two-boxing dominates causally).  
  - **Q1=No, Q3=No, Q4=Yes/No**: *Unoccupied but coherent?* Possible if someone rejects acausal problems yet takes a stance; but no defense exists. Likely unattractive.  

  **Flagged limitations**:  
  - The tree **cannot separate** FDT from UDT/TDT. *Why:* They agree on all listed cases. Differences (e.g., logical uncertainty in UDT) don't manifest here.  
  - **Forced choice on one-shot mugging**: The tree forces a stance on whether one-shot mugging is a "genuine" problem:  
    - FDT says "yes" (paying is rational).  
    - Pre-commitment says "only with pre-commitment" (otherwise, not rational).  
    - EDT says "no" (never rational).  
    This reflects a real disagreement; I don't paper over it (Q4/Q5 isolate it).  

  **Confidence recap**:  
  - High confidence in Q1–Q5 branching and leaf assignments (≥90%).  
  - Lowest confidence (60%) that Leaf 4 (Pre-Commitment View) is *distinct* from Leaf 3. Some FDT defenders argue pre-commitment is inherent to policy evaluation; I list it separately due to emphasis on temporal binding.  

  This tree should resolve disputes by focusing on case judgments. For the reading group: Test intuitions against the tree, then discuss why unoccupied positions are vacant!
