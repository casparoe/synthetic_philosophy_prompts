prompt: |-
  I am a second-year PhD student in the philosophy of science, having come into the programme from a science background, and I mention that only because it explains why the problem of old evidence has caught me out in the way it has. My thesis is a Bayesian reconstruction of a dispute in my former field, and the chapter I am drafting now turns on a fact that was discovered decades before anyone proposed the theory I am reconstructing — precisely the sort of evidence a Bayesian is supposed to be unable to make any use of, and which the historical record suggests did a great deal of work. I have been arguing about this with my supervisor for months. She has a settled line on the old-evidence cases we have discussed, but I cannot work out what general rule her verdicts are tracking. As best I can reconstruct them: first, in the case of the inverse-square law and the planetary regularities, where the regularities had been established long before and were celebrated, where the law was proposed to unify terrestrial and celestial motion rather than to account for them, and where no rival account then on offer predicted them, she says the regularities confirm the law heavily, and is willing to say the law would have been nearly as well supported had they been announced the week after it was published; second, in a case from population genetics, where a hypothesis proposed on independent grounds entails a census regularity that everyone had expected when it was compiled, and where every live rival now entails the same regularity, she says the regularity confirms it hardly at all and that its real support lies elsewhere; third, in a case from the history of geology, where the regularity was mildly surprising when it was found, the hypothesis was formulated decades later for unrelated reasons, and roughly half of the field's present alternatives also entail the regularity, she says modest confirmation — more than nothing, less than much; and fourth, for a hypothesis proposed first and a striking observation that arrived afterwards and matched, she says that is straightforward confirmation and not the interesting case at all. It has not escaped me that in each of the first three cases the regularity was roughly as surprising when it was discovered as it is discriminating today. She has also said two things that pull in opposite directions, and I cannot tell which of them governs the old-evidence cases: that a Bayesian reconstruction of a historical episode is a model of what a rational agent in that episode could have believed on the evidence then available, and that it is a category error to grade a nineteenth-century scientist by what we know now; and that confirmation is a relation between a hypothesis and the total evidence, so that there is no such thing as evidence for a hypothesis which fails to raise its probability given everything we currently accept.

  My own case is this. The theory, T, was proposed in the 1980s by someone working on an entirely different problem. T entails a regularity, R, that had been discovered in the 1950s and was, at the time, a bolt from the blue: on the background knowledge of the day, R was about as improbable as a fact of that kind could be, and for thirty years nobody could account for it. The entailment from T to R was spotted by a third party in the mid-1990s, when no other theory on the table entailed R. Since about 2005, however, four rival theories have appeared, each of them constructed with R in view, and all four entail R. R now discriminates nothing: every live theory in the field predicts it, and it has gone from being the field's great anomaly to being its great platitude. I can see three places from which one might measure how much R confirms T: the standpoint of the 1950s community, before R was discovered; the standpoint of the present community, for whom the only news is the entailment itself; and the standpoint of the mid-1990s community, which had R but not the rivals. I know the first has a wrinkle — the 1950s credence function has to be extended to a theory nobody had yet formulated — and I should like to know whether that wrinkle is fatal or merely technical.

  So what will she say about how much R confirms T? I am far less interested in the number than in the rule. Tell me which general rules fit her four verdicts equally well, what each of them predicts here, which prediction you would bet on and why, and what she would have to be assuming about whose credence function is in play for her verdict to be defensible. Finally, name the further case I should invent and put to her in order to separate the rules; I would rather ask one decisive question at our next supervision than six inconclusive ones.
reasoning: |-
  Okay, the user is a second-year PhD student in philosophy of science with a science background. They're working on a Bayesian reconstruction of a historical dispute and are stuck on the problem of old evidence. Their supervisor has given verdicts on four cases, but they can't figure out the underlying rule. They want to predict their supervisor's verdict on their own case and find a decisive question to clarify the rule.

  First, I need to understand the supervisor's pattern in the four cases. The key seems to be how surprising the evidence was at the time of discovery and how discriminating it is now. In the inverse-square law case, the evidence was known but not predicted by rivals, so it confirms heavily. In population genetics, the evidence was expected and all rivals now entail it, so no confirmation. Geology had mildly surprising evidence and some rivals entail it, so modest confirmation. New evidence straightforwardly confirms.

  The user's case involves a theory T proposed in the 80s, entailing a regularity R from the 50s. R was very surprising when discovered but is now entailed by all current theories. They're considering different standpoints: 1950s, mid-90s (when entailment was spotted, no rivals), and present. The 1950s standpoint has a wrinkle because T didn't exist then. 

  The supervisor’s two conflicting principles: Bayesian reconstruction should reflect historical agents' beliefs, but confirmation is about total current evidence. For old evidence, the supervisor might prioritize current discriminative power over historical surprise. In the inverse-square case, even though the evidence was old, it discriminated because rivals didn't predict it. In population genetics, no discrimination now. So the rule might be about current discriminative power.

  For the user's case, mid-90s is key: R was known, T was new and the only one entailing R. Current discriminative power is low since all theories entail R. Supervisor would likely say R confirms T modestly, based on the geology case. But the user needs to test the rule with a hypothetical case where historical surprise and current discrimination differ. 

  Propose a case where evidence was expected historically but now only one theory entails it. If supervisor says it confirms heavily, they prioritize current discrimination. If not, historical surprise matters more. That would clarify the rule.
answer: |-
  Based on your supervisor's pattern of verdicts and stated principles, I'll reconstruct the implicit rules, apply them to your case, predict her verdict, and design a decisive test case. The key tension is between her *historical rationality* principle ("model what rational agents could believe") and her *timeless confirmation* principle ("confirmation is relative to total current evidence").

  ### Reconstructed General Rules Fitting Her Four Verdicts
  Two distinct but non-exclusive rules fit her judgments. Both depend on the **current discriminative power of evidence** (i.e., how many *current* live hypotheses entail it), but differ in their handling of historical context:

  1.  **The Current Discriminative Power (CDP) Rule:**  
      *Confirmation strength is determined by how much the evidence raises the hypothesis's probability relative to the **current** set of live alternatives, given total present knowledge. Historical surprise matters only insofar as it shaped the set of present rivals.*  
      - **Fits her cases:**  
          - Inverse-square: Confirms heavily because *currently* no rivals predict it (even if historically old).  
          - Population genetics: Near-zero confirmation because *all* current rivals entail it.  
          - Geology: Modest confirmation because *some* (but not all) current rivals entail it.  
          - New evidence: Strong confirmation as it discriminates against *current* rivals.  

  2.  **The Historical Entailment Novelty (HEN) Rule:**  
      *Confirmation strength depends on whether the evidence was **already known** when the hypothesis was formulated. For old evidence, confirmation requires that the hypothesis was the *first* or *only* entailing theory among *contemporaneous* rivals at the time of its proposal.*  
      - **Fits her cases:**  
          - Inverse-square: Confirms heavily because Newton's theory was the *first* to entail it, and no *contemporaneous* rival did.  
          - Population genetics: Near-zero confirmation because rivals *now* entail it, and it was expected historically.  
          - Geology: Modest confirmation because the hypothesis wasn't first, but some contemporaries didn't entail it.  
          - New evidence: Strong confirmation (trivially satisfies "novelty").  

  **Common Core:** Both rules prioritize *discriminative power against contemporary rivals* but disagree on *which* contemporaries matter: CDP uses *current* rivals, HEN uses rivals *at the time the hypothesis was proposed*.

  ---

  ### Prediction for Your Case (T and R)
  - **R's Status:**  
    - Historically (1950s): Highly surprising (bolt from the blue).  
    - At Entailment Discovery (mid-1990s): Known but unexplained; T was the *only* theory entailing it.  
    - Currently (post-2005): Entailed by all live rivals; non-discriminative.  

  - **Applying CDP Rule:**  
    Confirmation is near-zero. R is entailed by all current rivals → it cannot discriminate T from its competitors today. The historical surprise is irrelevant to *current* confirmation.  

  - **Applying HEN Rule:**  
    Confirmation is **strong**. At the critical time (mid-1990s), when T was proposed *as an entailler of R*, it was the *only* live hypothesis that entailed R. This satisfies "historical novelty" despite R being old.  

  **Your Supervisor's Likely Verdict:**  
  I predict she will say **R confirms T strongly** (HEN Rule). Why?  
  1. Her inverse-square verdict prioritizes the *historical context of the hypothesis's proposal* (Newton as first entailler) over current discriminative power.  
  2. She explicitly rejects grading historical actors by current knowledge ("category error").  
  3. Your case mirrors the inverse-square logic: T was the first (and initially only) theory to entail R, solving a decades-old anomaly.  

  **The 1950s Standpoint Wrinkle:**  
  She will likely dismiss the 1950s standpoint as irrelevant. Since T didn't exist then, no Bayesian credence for T can be assigned. The critical point is the mid-1990s, when T was formulated and its entailment of R recognized.  

  **Defensible Assumptions:**  
  For her verdict to hold, she must assume:  
  - The *relevant credence function* is that of the scientific community **at the time T was proposed as a solution to R** (mid-1990s).  
  - "Confirmation" here refers to the *historical impact* of R on T's acceptance, not its current probative value.  
  - R's past surprise *indirectly* matters because it made R a significant anomaly, raising the stakes for explaining it.  

  ---

  ### The Decisive Test Case to Separate CDP vs. HEN
  Propose this hypothetical to your supervisor:  

  > **"Hypothesis H is proposed in 2024 to explain a known anomaly E, which was discovered in 1980 and was highly surprising then. At the time of H's proposal, it is the *only* theory entailing E. However, by 2030, five new rival theories emerge, all designed to entail E. *None* of these rivals existed in 2024.  
  >   
  > **Question:** How much does E confirm H *today* (in 2030), given that all current rivals also entail E?"**  

  - **CDP Rule Prediction:** Near-zero confirmation. E is now entailed by all live rivals → no discrimination.  
  - **HEN Rule Prediction:** Strong confirmation. H was the *first and only* entailler among its *contemporaneous* rivals when proposed.  

  **Why This Separates the Rules:**  
  - Mirrors your case but eliminates ambiguity about the "standpoint" (clearly asks about *current* confirmation).  
  - Directly tests whether *historical novelty* (HEN) trumps *current discriminative power* (CDP).  
  - Her answer will show whether her core commitment is to the *historical significance of entailment* (HEN) or *present-day Bayesian updating* (CDP).  

  **Betting Prediction:**  
  I would bet she chooses **HEN** and says **E still confirms H strongly** in 2030. Her inverse-square verdict and emphasis on historical rationality ("no grading by current knowledge") suggest she views confirmation as "locked in" by the epistemic context at the time the hypothesis solved the anomaly.  

  ---

  ### Recommended Strategy for Your Supervision
  1. **Present your T/R case briefly.**  
  2. **Immediately pose the test case above.** Say: *"I'm trying to generalize your approach. Suppose in 2030..."*  
  3. **Based on her answer:**  
     - If she says "strong confirmation," her rule is **HEN** (Historical Entailment Novelty).  
     - If she says "minimal confirmation," her rule is **CDP** (Current Discriminative Power).  
  4. **Then apply her rule back to your case:**  
     - If HEN → R strongly confirms T.  
     - If CDP → R minimally confirms T today.  

  This forces her to resolve the tension between her principles decisively. If she balks, ask: *"Should we evaluate confirmation from the perspective of the agent who first recognized the entailment, or from our present perspective?"* Her answer will reveal whether "total evidence" or "historical rationality" dominates. 

  **Final Note:** Her philosophy seems closest to John Norton's "material theory of induction" or Whewellian consilience, where the *historical context of discovery* shapes confirmatory weight. If she confirms HEN, your reconstruction should emphasize T's *anomaly-resolving novelty* in the 1990s, not R's current status.
