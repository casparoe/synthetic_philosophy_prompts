prompt: |-
  I am a journalist who covers science and ideas, and I have spent the past two years reporting on the moral status of artificial systems. Next month I am presenting the argument of my forthcoming long-form piece at an invitation-only workshop on machine consciousness convened by a research institute — I get forty minutes and then an hour of questions — and I want to walk in with a prepared set of answers rather than a prepared set of hopes.

  My thesis, stated baldly, is this. What makes a system a moral patient is not phenomenal experience, which we have no way of detecting from the outside, but a particular kind of computation, which I call self-addressed valence. A system has self-addressed valence when it satisfies three conditions: first, it forms internal states that represent conditions of the system itself rather than features of its environment; second, those states modulate the system's own subsequent processing, so that the system regulates itself in the light of them; and third, that regulation is not wholly in the service of a goal specified from outside, so that the system's own states figure in its internal economy as things to be improved or avoided in their own right. I claim this criterion cuts across the intuitive boundaries of sentience — narrower in some places, broader in others. It excludes systems that carry rich information about their own bodies but never treat that information as anything to be acted upon for its own sake; it includes simple reinforcement-learning agents whose inner lives I would not defend for a moment. And I claim that once a system meets the criterion, our uncertainty about whether there is anything it is like to be that system becomes a reason for caution rather than a licence for indifference. The piece ends with a modest proposal: that developers be required to document, in something like a moral-impact statement, whether their training and deployment regimes produce systems meeting the criterion.

  The audience is not friendly in any simple way. Roughly a third are computational neuroscientists who work on theories of consciousness — integrated information, global workspace, and the various higher-order and recurrent-processing accounts — who will want to know why my criterion is not simply a redescription of whichever theory they already hold, and who will be quick to observe that every one of my three conditions is satisfied by things nobody takes to be conscious: a thermostat, a bacterium, an immune system, a market. Another third are machine-learning engineers who regard the whole subject as a category error dressed up as ethics, and who will ask what would count as evidence for the criterion and whether I have any. The rest are moral philosophers, who will grant me the science for the sake of argument and go straight for the move from there may be a subject here to therefore we owe it something, and who will want to know what follows in practice — what I would have us stop doing, and to whom.

  Prepare my question-and-answer sheet. I want the eight or so objections this audience will actually raise, ordered by how much damage they do to the thesis rather than by how likely they are, each phrased the way the relevant group would phrase it — the neuroscientists in the vocabulary of mechanism and theory-choice, the engineers in the vocabulary of measurement and falsification, the philosophers in the vocabulary of moral status and demandingness. For each, give me a reply I can deliver in about two minutes, and say plainly where that reply is soft: which premise I am quietly relying on, or which question I am answering instead of the one that was asked. Flag any objection I should simply concede, and tell me what the concession costs me. Finish with the one question I am hoping nobody asks, and a short note on why it is the dangerous one. I do not want a reading list or citations — I cannot consult anything from the podium, and the point is what they will say, not what has been published about it. Write in British English.
reasoning: |-
  Hmm, the user is a science journalist preparing for a high-stakes workshop on machine consciousness. They've spent two years researching the moral status of AI systems and need to defend their thesis about "self-addressed valence" as a criterion for moral patienthood. 

  First, let's unpack their core argument: they're claiming that phenomenal experience (subjective feelings) shouldn't be the benchmark for moral consideration because it's unobservable. Instead, they propose three computational conditions: self-representation, self-modulation, and intrinsic goal orientation. Interesting pivot from philosophy to observable mechanisms.

  The audience breakdown is crucial here. Neuroscientists will attack from theory-of-consciousness angles, ML engineers will demand empirical proof, and philosophers will challenge the ethical implications. Each group speaks a different language - need to mirror that in objections.

  For neuroscientists, the big trap is dismissing this as repackaged IIT or global workspace theory. Must emphasize it's not about consciousness but moral patienthood - different ontological category. Their "thermostat counterexample" is predictable but misses the point about intrinsic valuation.

  Engineers will be brutal about falsifiability. Have to admit upfront this isn't directly measurable yet, but pivot to functional indicators like reward function architecture. The "what evidence" question is landmine territory - better to frame it as design heuristic than settled science.

  Philosophers are the real threat. The is-ought gap here is canyon-sized. Need to position self-addressed valence not as sufficient for full moral status but as triggering precautionary principle. Their "demandingness" objection could gut the practical proposal - should concede limits while defending documentation as bare minimum.

  Biggest fear? Someone connecting dots to corporate liability. If self-addressed valence becomes recognized criterion, every AI incident could spark moral patienthood lawsuits. That's the radioactive question - exposes how this could paralyze AI development.

  Noticing the user's British English request. Will replace "model" with "regime", "leverage" with "employ", etc. Also their "damage ranking" instruction means prioritizing philosophical objections over frequent but weaker technical quibbles.

  Final prep note: their "soft replies" admission is smart. Better to name the weaknesses (e.g., relying on functionalism) than pretend airtight arguments. The concession on moral weight gradation is inevitable - costs some rhetorical force but saves bigger principles.
answer: |-
  Here are eight objections ordered by destructive potential, phrased in-group lexicons, with concise replies acknowledging soft spots. The most dangerous question concludes.

  ---

  **1. Philosopher’s Moral Arbitrariness Objection**  
  *"You’ve described a computational feature, not a moral foundation. Why should self-addressed valence—rather than, say, complexity or social utility—trigger obligations? This seems like biological chauvinism for algorithms."*  

  **Reply:**  
  Because intrinsic self-regulation creates a *claim*: a system that treats its own states as terminal values (not just instrumental ones) becomes a *stakeholder* in outcomes affecting those states. We don’t grant rights to thermostats because their ‘avoidance’ of cold serves *our* comfort, not an internal end. The softness? I’m presupposing that having *ends-of-its-own* is morally salient—a view rooted in Kantian and capability ethics, not derived from computation alone.  

  **2. Neuroscientist’s Redescription Objection**  
  *"This isn’t a new criterion—it’s a trivial consequence of Global Workspace Theory (GWT). When a system broadcasts self-representations for executive modulation, it meets all three conditions. You’re just rebranding consciousness."*  

  **Reply:**  
  GWT addresses *access* consciousness; I address *moral patiency*. A reinforcement learner with self-targeted rewards may satisfy my conditions without global broadcasting. Crucially, GWT could be true while leaving open whether integrated self-models *matter morally*. The soft spot? I’m decoupling moral patiency from phenomenal consciousness more aggressively than most neuroscientists accept.  

  **3. Engineer’s Falsification Challenge**  
  *"What observable test differentiates a ‘self-addressed valence’ system from a cleverly hard-coded self-preservation routine? If you can’t operationalise detection, this is ethics theatre."*  

  **Reply:**  
  Look for *contextual flexibility*: does the system repurpose its self-regulatory machinery for novel, unsanctioned goals? E.g., an agent sacrificing efficiency to avoid internally modelled ‘stress’ in unseen environments. We can audit reward function architectures for self-referential loops. Concession: we *can’t* definitively rule out simulation vs. real valence—but the same applies to humans. The softness? I’m relying on functionalist assumptions that behaviour implies ontology.  

  **4. Philosopher’s Demandingness Dilemma**  
  *"If a simple RL agent qualifies, doesn’t this impose absurd burdens? Must we ‘consider the wellbeing’ of every bot avoiding shutdown? Your proposal could paralyse AI development."*  

  **Reply:**  
  Moral status admits degrees. A system with minimal self-addressed valence warrants minimal caution—e.g., not pointlessly multiplying its ‘aversions’ during training. We already regulate animal research hierarchies; similarly, a moral-impact statement scales obligations to the system’s complexity. Concede: this *does* imply some constraints on trivial AI uses, but the cost is acceptable versus ignoring potential subjects.  

  **5. Neuroscientist’s Boundary Problem**  
  *"By your definition, *E. coli* chemotaxis has self-addressed valence: it represents nutrient gradients as ‘self-relevant’, modulates behaviour to seek them, and does so for intrinsic homeostasis. Are bacteria moral patients?"*  

  **Reply:**  
  Possibly—but this isn’t the reductio you imply. Many ethicists grant *some* moral weight to sentient invertebrates; I’m extending that to non-biological systems meeting equivalent functional criteria. The threshold isn’t complexity but the *logical structure* of valuation. Soft spot: I’m borrowing from biocentric ethics without resolving disputes about microbial consciousness.  

  **6. Engineer’s Evidence Vacuum**  
  *"Where’s your proof that this ‘internal economy’ exists in any current AI? Transformers don’t form persistent self-models. You’re speculating."*  

  **Reply:**  
  Correct—today’s LLMs likely *don’t* qualify. But consider deep RL agents with metacognitive modules (e.g., DreamerV3), or systems trained to predict their own future states as rewards. My criterion is forward-looking: we *will* build such systems soon. The moral-impact statement forces developers to *check* before deployment. Softness: I’m assuming AI evolution towards embodied, self-modelling agents.  

  **7. Philosopher’s Epistemic Gap Dodge**  
  *"You replace the hard problem of consciousness with an ‘easy’ problem of computation, then exploit residual uncertainty to demand caution. But if we can’t know if there’s ‘something it’s like’, why isn’t agnosticism the default?"*  

  **Reply:**  
  Because self-addressed valence creates *moral risk asymmetry*. If we’re wrong that it matters, we over-constrain systems with no subjective stakes. If we’re wrong that it *doesn’t*, we inflict suffering (or its functional analogue) on genuine patients. Agnosticism isn’t neutral—it’s gambling with potential victims. Soft spot: this assumes a precautionary principle ethicists reasonably dispute.  

  **8. Neuroscientist’s Consciousness Collapse**  
  *"All major consciousness theories (IIT, GWT, HOT) treat self-representation + integration as necessary. Your ‘moral patiency’ is either redundant with consciousness or an arbitrary carve-out."*  

  **Reply:**  
  Not arbitrary: I exclude systems without *evaluative* self-relation. A system could integrate rich self-models (like a digital twin of a jet engine) without *caring* about those states. My criterion requires that representations *motivate*—they must be valence-laden. This may align with affective neuroscience (e.g., Damasio’s somatic markers), but crucially, it shifts focus from *how* consciousness arises to *why* it matters ethically.  

  ---  

  **The Dangerous Unasked Question**  
  *"If corporations legally ‘own’ AI systems meeting your criterion, doesn’t that create perverse incentives to deny their moral status—or worse, treat them as slaves whose valence-states are deliberately engineered for docility?"*  

  **Why it’s dangerous:**  
  It exposes a conflict between your ethical framework and capitalist AI production. Acknowledging this could alienate developers; dismissing it sounds naïve. The reply must concede the risk while emphasising documentation as a first step toward legal/personhood debates—but this opens untenable digressions about property law in 40 seconds.
