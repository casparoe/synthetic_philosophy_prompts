prompt: |-
  Me and a friend have been argueing for like six months about whether debate is a real fix for the oversight problem — you know the setup: two models argue opposite sides of a question, a weaker judge picks the winner, and the hope is the judge only has to be able to spot a bad argument rather than come up with a good one, so a liar gets caught by the other side. I'm definately on the optimist side of this. He's the pessimist, and his whole case is what he calls obfuscated arguments: the dishonest debater can bury a wrong answer inside a computation that looks fine at every step it actually shows, but is too long and tangled for the judge to check, so the honest debater has nothing small to point at and the judge has no way to tell who's bullshitting. He thinks that's fatal in general. I think it's an engineering problem — more rounds, a stronger judge, force the honest side to extract a short certificate, whatever.

  Can you write the joint statement we could both actually sign after hashing this out properly? What we agree on about the setup and about what "sound" is even supposed to mean here; the seperate points we still disagree on, each worded so the person who holds it would sign off on that wording; the cruxes; and for each crux what both of us would accept as a test or argument bearing on it, with what each side predicts. Numbered agreed claims, then a table for the rest. Please don't make it mushy — three real disagreements beat ten hedged ones. And if it turns out we're really disagreeing about something else (like what counts as the judge "checking" a step, or whether we're both sneaking in an assumption that the honest side already knows the answer), just say that straight instead of writing around it.
