prompt: |-
  My friend is a philosophy grad student and she summarized Dennett's two-bitser example for me like this: Dennett describes a vending machine built in the US to detect quarters. It gets shipped to Panama, where it accepts Panamanian coins that are the same size and weight. Since the machine's behavior is identical, there's no fact of the matter whether it's detecting quarters or balboas — so its intentionality is entirely in the eye of the beholder. That's supposed to show that the whole idea of original, underived intentionality is a myth: nothing has intrinsic aboutness, everything is derived, and the difference between us and the machine is just that we're more complex. Searle's reply is that the machine obviously has derived intentionality, so it's a bad example — and anyway Dennett's conclusion would mean we can't say what a frog's visual system represents either, which is absurd.

  Is this fair? Go sentence by sentence and seperate what a philosopher of mind would accept, what they'd wince at, and what's just wrong. And does the conclusion she draws — that for Dennett everything is derived and the human/machine difference is just complexity — actually follow from the parts of the summary that are accurate?
