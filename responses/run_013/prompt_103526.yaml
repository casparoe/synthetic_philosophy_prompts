prompt: |-
  I chair the research ethics committee at a mid-sized university hospital. Our recurring failure is not that we approve bad protocols or reject good ones; it is that we cannot agree on when to stop asking for further justification. One faction treats any unresolved question as grounds for deferral, so reviews drag on for months and investigators learn to bury us in documentation. Another treats the principal investigator's professional standing, or the mere fact that a practice is common locally, as sufficient warrant, so our approvals sometimes rest on nothing more than seniority. I want to replace this with a written procedure that any member of the committee can run.

  Write me that procedure. It must be usable by reviewers who are not philosophers, in a thirty-minute first pass, and it must be defensible when the investigator appeals to the medical director, who signs off on the final record.

  The procedure should take the form of an ordered set of tests: what question the reviewer asks at each step, what counts as a sufficient answer, when a chain of reasons may be closed, when it must be recorded as unresolved, and when it must be handed to the full committee as a values decision rather than a factual one. Ground the stopping rules in the three standard positions on the regress of justification — foundationalism, the view that a chain must terminate in something that needs no further support; coherentism, the view that a claim is justified by its fit with what we already accept; and infinitism, the view that justification may legitimately continue without end — and say explicitly which moves in your procedure come from which position, and where you are deliberately compromising among them rather than applying any one of them cleanly.

  Our committee has already adopted two house rules, which the procedure has to accommodate and whose status you should assess. The No Private Anchors rule: no chain of justification may be closed by appeal to a claim whose only support is the proposer's own authority, seniority, or the fact that the practice is common here. The Two-Door requirement: a chain may be closed either at a door anyone on the committee could open for themselves — a published standard, a measurement, a legal requirement — or at a door the committee explicitly votes to hold shut, with that vote recorded as a values judgment. Tell me whether these two rules are coherent, whether they smuggle in one of the three positions under another name, and whether together they leave any protocol unjustifiable in principle.

  Then run the procedure on three cases. First, a placebo-controlled trial whose justification for withholding an available treatment rests on the claim that the design is standard in the field. Second, a first-in-human dosing study whose risk estimate rests on an unpublished pilot the investigator ran in their own laboratory. Third, a protocol the committee is ethically sympathetic to but whose central assumption cannot be closed at an open door without a vote the committee would rather not take. For each, show the steps, the verdict, and the point at which the procedure stops and a person must decide. At least one verdict should be one the committee will dislike.

  Finish by stating what the procedure cannot do: which disagreements it will merely relocate, which of its stopping points are conventions rather than discoveries, and how a reviewer should behave when the procedure returns unresolved.
reasoning: |-
  Okay, the user chairs a research ethics committee and is struggling with disagreements on when to stop asking for justifications. One faction defers for any unresolved question, causing delays. The other relies too much on seniority or common practice. They need a written procedure that's practical, defensible, and grounded in philosophical principles.

  First, I need to understand the core problem: stopping the infinite regress of justification. The three philosophical positions are foundationalism, coherentism, and infinitism. The procedure must incorporate these while being usable in 30 minutes by non-philosophers. The existing house rules—No Private Anchors and Two-Door—need assessment. Are they coherent? Do they align with any one theory?

  The user wants a step-by-step test. Each step must have clear questions, sufficient answers, and stopping rules. The procedure should specify when to defer, approve, or escalate to the full committee. Also, handle cases where unresolved issues require values decisions.

  Assessing the house rules: No Private Anchors prevents closure based on authority alone, aligning with foundationalism (needing objective bases) and rejecting infinitism's endless chains. Two-Door requires public standards or recorded votes, supporting foundationalism (open doors) and coherentism (committee consensus). Together, they prevent unjustifiable protocols by mandating either objective evidence or explicit value judgments. They're a hybrid approach, not smuggling one theory but combining elements.

  Now, the procedure steps. Start with foundationalism: check for open doors (Step 1). If not, move to coherentism: fit with accepted practices (Step 2). Then infinitism: assess if unresolved issues are critical (Step 3). Step 4 handles escalation. The flowchart helps reviewers navigate.

  Applying to the cases:

  1. Placebo trial: Justification based on standard design. Step 1: No open door (no citation). Step 2: Fit with standards? Insufficient without specifics. Step 3: Critical—yes, risks to participants. Unresolved, escalate. Verdict: Defer until proper justification.

  2. First-in-human study: Unpublished pilot data. Step 1: No open door. Step 2: Fit with norms? Preclinical data usually internal, but here it's unpublished and sole basis. Step 3: Critical—yes, human risk. Unresolved. Escalate. Verdict: Defer until external validation.

  3. Sympathetic protocol without open door: Step 1: No open door. Step 2: Fit? Maybe, but insufficient. Step 3: Critical? Yes. Step 4: Committee must vote, recording it as a values decision. Verdict: Approve with recorded vote, which they might dislike but is necessary.

  The procedure can't resolve value conflicts; it moves them to committee votes. Stopping points are conventions, not discoveries. Unresolved issues require escalation, not reviewer discretion.

  Deep needs: The user likely wants legitimacy and efficiency, reducing arbitrary decisions and appeals. The procedure provides structure, balances philosophical rigor with practicality, and ensures defensibility. By clarifying when to stop, it addresses factional conflicts and promotes consistency. The assessment of house rules validates their approach, reinforcing their authority in appeals.
answer: |-
  ## Research Ethics Justification Closure Procedure (REJ-CP)

  **Purpose:** To determine when a chain of ethical justification for a protocol is sufficiently grounded for approval, deferral, or escalation to the full committee, balancing rigor with efficiency. Grounded in philosophical positions on justification (Foundationalism, Coherentism, Infinitism).

  **Core Principles:**
  1.  **Philosophical Grounding:** Explicitly uses Foundationalism (F), Coherentism (C), and Infinitism (I) to structure closure.
  2.  **House Rules Compliance:** Strictly adheres to "No Private Anchors" (NPA) and "Two-Door" (TD).
  3.  **Practicality:** Designed for a 30-minute first pass by non-philosophers. Verdicts must be defensible to medical director on appeal.
  4.  **Explicit Closure:** Stops chains only at defined points requiring no further *committee-driven* justification.

  **Procedure Flowchart (Sequential Steps):**

  1.  **The Open Door Test (Foundationalism)**
      *   **Question:** *"Is the claim supporting this ethical justification grounded in an 'Open Door' (publicly accessible, verifiable source)?"*
      *   **Sufficient Answer:** YES, if the claim relies *directly and demonstrably* on:
          *   Published, peer-reviewed scientific evidence (specific citation).
          *   Explicit national/international regulatory requirement or guideline (e.g., FDA, EMA, ICH-GCP).
          *   Explicit, relevant hospital policy or SOP (cited).
          *   Established, measurable scientific fact (e.g., pharmacokinetic calculation based on standard parameters).
          *   Clear legal statute or case law.
      *   **Closure Rule:** **CLOSE THE CHAIN HERE (Approve on this point).** Foundationalism (F) dominates: The claim needs no further justification *within the committee review* because it rests on an objective, accessible foundation. NPA & TD satisfied (Open Door used).
      *   **Next Step:** If NO (or unclear), proceed to Step 2.

  2.  **The Fit & Consistency Test (Coherentism)**
      *   **Question:** *"Does the claim fit coherently within accepted knowledge and ethical standards *without relying solely on local practice or PI standing*?"*
      *   **Sufficient Answer:** YES, if *all* are true:
          *   The claim aligns logically with established scientific principles relevant to the protocol.
          *   The claim aligns with widely accepted ethical principles (e.g., Belmont Report, Declaration of Helsinki - specific section cited).
          *   The claim is consistent with *standard practice* **beyond this institution**, supported by external evidence (e.g., review articles citing widespread use, consensus guidelines from professional societies *other than our own*).
          *   No significant internal contradictions exist within the protocol's justification.
          *   **Crucially:** NPA is respected. Seniority/local practice *cannot* be the sole or primary basis.
      *   **Closure Rule:** **CLOSE THE CHAIN HERE (Approve on this point).** Coherentism (C) dominates: Justification comes from integration within the broader web of accepted knowledge/ethics. NPA satisfied (avoids private/local anchors). TD satisfied if the "fit" relies on widely accepted external standards (implicitly open doors); if it relies on *committee consensus* about "accepted principles," this implicitly uses the Values Door but doesn't require a vote *yet* unless challenged. **Compromise:** Accepts coherence as sufficient closure even without a single foundational "Open Door," acknowledging practical limits of pure F.
      *   **Next Step:** If NO (incoherent, relies on local/PI authority, lacks external consistency evidence), proceed to Step 3.

  3.  **The Criticality & Tractability Test (Infinitism/Threshold)**
      *   **Question:** *"Is the unresolved justification gap (a) CRITICAL to participant safety/welfare or core scientific validity, AND (b) TRACTABLE (resolvable with feasible additional information)?"*
      *   **Sufficient Answer:**
          *   (a) CRITICAL: YES if gap concerns core risk/benefit assessment, safety monitoring plan, scientific validity affecting participant burden, or fundamental ethical permissibility. NO if it concerns minor administrative detail or low-impact methodological nuance.
          *   (b) TRACTABLE: YES if specific, feasible information could resolve the gap (e.g., providing a specific citation, clarifying a calculation, submitting missing safety data). NO if the gap concerns an unresolvable value conflict, fundamental uncertainty, or requires impractical effort (e.g., proving a negative definitively).
      *   **Closure Rule:**
          *   **If CRITICAL=NO:** **CLOSE THE CHAIN HERE (Approve - minor unresolved point).** Infinitism (I) acknowledged: Not all chains *need* absolute closure; minor gaps are tolerable. **Compromise:** Rejects pure I's endless demand, setting a practical threshold. NPA/TD: The gap wasn't anchored privately and doesn't require a Door.
          *   **If CRITICAL=YES and TRACTABLE=YES:** **MARK AS DEFERRAL (Request specific info).** Pure I acknowledged: Justification *must* continue because the gap is vital and resolvable. NPA/TD: Prevents premature closure on weak grounds.
          *   **If CRITICAL=YES and TRACTABLE=NO:** Proceed to Step 4. Pure I *fails* – endless justification is impossible/pointless for this gap.

  4.  **The Values Door Test (Committee Authority)**
      *   **Question:** *"Must the unresolved, critical justification gap be closed by an explicit committee value judgment recorded as such?"*
      *   **Sufficient Trigger:** Arrival at Step 4 (Critical YES, Tractable NO).
      *   **Closure Rule:** **ESCALATE TO FULL COMMITTEE.** The chain *cannot* be closed by the reviewer or by further factual justification. It requires the committee to explicitly vote to use the "Values Door" (TD) to accept the justification *despite* the lack of Open Door or clear Coherentist fit, acknowledging this as a value-based risk/benefit or priority decision. **Compromise:** Rejects pure F (no foundation) and pure I (can't justify further), embracing C's social aspect but formalizing it via vote. NPA satisfied (committee authority ≠ private anchor). TD satisfied (Values Door used explicitly).

  **Assessment of House Rules:**
  1.  **No Private Anchors (NPA):** Coherent and necessary. It directly combats an invalid form of closure akin to weak foundationalism (treating authority/status as a "foundation") or bad coherentism (treating local practice as sufficient "fit"). It doesn't cleanly map to one position but reinforces the need for *external* justification (F/C) and prevents abuse of I (endless appeals to authority). Essential.
  2.  **Two-Door (TD):** Coherent and powerful. It explicitly defines closure points: Open Door (F) or Values Door (C - social justification formalized). It acknowledges the limits of pure F (requiring the Values Door option) and provides a mechanism to halt infinitism (I) via committee decision. It prevents protocols from being trapped in endless deferral *if* the committee is willing to own the value judgment.
  3.  **Together (NPA+TD):** They create a robust framework. **Do they leave any protocol unjustifiable?** Potentially yes, but deliberately. A protocol relying *solely* on unjustifiable private anchors (violating NPA) *and* lacking any Open Door justification *and* which the committee *unanimously refuses* to support via the Values Door (e.g., clearly unethical, scientifically invalid) would be *correctly* unjustifiable. The rules prevent weak protocols from sneaking through on bad grounds but allow strong ones needing value judgments to proceed via the Values Door.

  **Case Applications:**

  1.  **Placebo-Controlled Trial (Withholding available Tx, justified as "standard in field"):**
      *   **Step 1 (Open Door):** Claim: "Design is standard." Is "standard" an Open Door? NO. No citation to guideline, meta-analysis, or regulatory doc *specifically endorsing placebo use in this context when an effective treatment exists*. → Proceed.
      *   **Step 2 (Fit/Consistency):** Does "standard in field" fit coherently *without relying solely on local practice/PI*? Reviewer checks: PI provides no external evidence (only says "we always do this here"). "Standard in field" is vague. Does it fit Belmont/Declaration of Helsinki? Requires specific justification for placebo (e.g., compelling methodological reason, equipoise). → **INSUFFICIENT (Relies on implied local/PI authority, violates NPA).** → Proceed.
      *   **Step 3 (Criticality/Tractability):** Is the gap critical? **YES** (Participants denied available treatment - core risk/benefit/welfare issue). Is it tractable? **YES** (PI can be asked for specific citations to guidelines/studies *justifying placebo use in this specific scenario*). → **VERDICT: DEFER.** Request specific external justification for the placebo design choice in this context. *Procedure stops here; reviewer acts.* Committee will dislike the delay, but it's necessary.

  2.  **First-in-Human Dosing (Risk estimate based on unpublished PI pilot):**
      *   **Step 1 (Open Door):** Claim: "Risk estimate from Lab Pilot." Is the unpublished pilot data an Open Door? **NO** (Not publicly accessible/verifiable). → Proceed.
      *   **Step 2 (Fit/Consistency):** Does using internal pilot data fit coherently? **PARTIALLY** (Preclinical/toxicology often relies on sponsor/internal data - coherent with drug development norms). BUT, for critical FIH dosing, reliance *solely* on unpublished, unverified internal data is highly unusual and risky. Does it fit ethical standards? Requires strong justification (e.g., unique molecule, no alternatives). PI provides only their authority ("trust my lab"). → **INSUFFICIENT (Violates NPA - relies solely on PI authority; lacks external consistency for FIH risk).** → Proceed.
      *   **Step 3 (Criticality/Tractability):** Critical? **YES** (Directly impacts initial human safety). Tractable? **YES** (PI could provide: detailed pilot report for review; independent statistical analysis; comparison to similar published molecules; justification why external data/modeling impossible). → **VERDICT: DEFER.** Request external validation, detailed report, or robust justification for sole reliance on internal data. *Procedure stops here; reviewer acts.*

  3.  **Sympathetic Protocol (Central assumption lacks Open Door, committee reluctant to vote):**
      *   *(Assume Step 1 fails - no Open Door. Assume Step 2 fails - fit is weak or relies on local/unique factors violating NPA).*
      *   **Step 3 (Criticality/Tractability):** Critical? **YES** (Central assumption is vital to ethics/safety/validity). Tractable? **NO** (No feasible additional information will create an Open Door or strong external fit; e.g., it's a novel, value-laden approach with no precedent). → Proceed to Step 4.
      *   **Step 4 (Values Door):** **VERDICT: ESCALATE TO FULL COMMITTEE.** The committee *must* vote to either:
          *   **A. Reject:** Unwilling to accept the assumption.
          *   **B. Defer:** Demand further (perhaps implausible) justification (violating procedure).
          *   **C. Approve via Values Door:** Explicitly vote to accept the central assumption as a justified risk/value judgment, recorded in minutes. **This is the only procedurally compliant option for approval.** *Procedure stops here; full committee must decide.* Committee will dislike being forced to take a recorded vote on a contentious value judgment, but the procedure mandates it. **VERDICT: POTENTIAL APPROVAL ONLY WITH RECORDED VALUES DOOR VOTE.**

  **Limitations of the Procedure (What it Cannot Do):**

  1.  **Relocate Disagreements:** It doesn't eliminate disagreements about:
      *   **Interpretation of "Fit" (Step 2):** What constitutes "widely accepted" or "sufficiently consistent"?
      *   **Assessment of "Criticality" (Step 3):** Is *this specific gap* truly critical to welfare/validity?
      *   **"Open Door" Status (Step 1):** Is a particular guideline strong/relevant enough? Is internal data sufficiently documented *to be* verifiable?
      *   **Values Door Vote (Step 4):** The core value conflict remains; the procedure just forces it into the open for a vote.

  2.  **Conventions, Not Discoveries:**
      *   The definitions of "Open Door," "sufficient Fit," "Critical," and "Tractable" are operational conventions established by the procedure, not inherent truths discovered by it. A different committee might set different thresholds.
      *   The choice to use F in Step 1, C in Step 2, and the specific thresholds in Step 3 are pragmatic compromises, not the "one true" philosophical resolution.

  3.  **Handling "Unresolved" (Post-Procedure):**
      *   **At Deferral (Step 3 Critical/Yes Tractable/Yes):** The reviewer specifies *exactly* what information is needed to resolve the gap (linking it to Step 1 or 2 closure). No open-ended requests.
      *   **At Escalation (Step 4):** The reviewer clearly documents the *specific, critical, intractable justification gap* requiring the committee's value judgment. The full committee *must* vote on using the Values Door for that specific point; they cannot send it back for more factual justification if Step 3 deemed it intractable.
      *   **Persistent Disagreement:** If reviewers using the procedure consistently reach different verdicts on the same point (e.g., differing on Criticality), this signals a need for committee training or refinement of the procedure's definitions, not reviewer error. The procedure exposes these subjective thresholds.

  This REJ-CP procedure provides a structured, philosophically grounded, and defensible method to halt justification chains. It enforces your house rules, forces value judgments into the open, and balances rigor with efficiency. Its success hinges on consistent application and committee willingness to use the Values Door when necessary.
