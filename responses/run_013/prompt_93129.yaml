  We are asked to put a case in front of Thomas Szasz, who died in 2012. The case involves teenage girls in the 2020s developing sudden-onset tics that they picked up from watching TikTok videos of other girls with tics. The tics are similar in movements, vocalizations, and sometimes exact same phrases. They don't respond to usual tic medications but ease off when the girls stop watching the videos. This is compared to historical cases in convents with young nuns.

  Szasz was a psychiatrist and a critic of the concept of mental illness. He famously argued that mental illnesses are not diseases in the medical sense but are problems in living, often related to communication and social roles. He was a strong advocate for personal responsibility and opposed involuntary psychiatric treatment.

  Key commitments of Szasz:
  1. Mental illnesses are not real illnesses (like physical diseases) but are metaphorical illnesses. He argued that only conditions with identifiable organic pathology are diseases.
  2. He viewed many psychiatric conditions as problems of living, often related to communication and social expectations.
  3. He was critical of the medicalization of human behavior and the role of psychiatry in social control.
  4. He emphasized personal responsibility and autonomy, opposing coercive treatments.

  Now, let's apply this to the case:

  - The phenomenon: Mass social media-induced tics that are imitative and resolve with removal of the stimulus (TikTok). They are not organic and do not respond to typical medications for tics (like those used in Tourette's).

  Szasz would likely argue that this is not a disease. There is no organic pathology. The tics are learned behaviors, spread through social contagion and imitation. He would see this as a form of communication or a response to social pressures and expectations, perhaps a way of expressing distress or seeking attention in a culturally specific manner.

  He might compare it to the historical cases of nuns, which are often described as mass hysteria or conversion disorder. He would reject the idea that this is a neurological illness and instead see it as a behavioral or social phenomenon.

  Verdict: He would call it a social contagion or a culturally transmitted pattern of behavior, not an illness.

  Is it illness? No, because it lacks organic pathology and is clearly linked to environmental and social factors (watching TikTok) and resolves when the stimulus is removed. This fits his central commitment that mental illnesses are not real illnesses but problems in living.

  Principle doing the work: His fundamental commitment that mental illness is a myth (i.e., without organic pathology, it's not a disease) and that behaviors are often forms of communication or responses to social contexts.

  What he would do: He would oppose medical treatment (especially involuntary) and instead recommend removing the source of the contagion (stop watching the videos) and perhaps addressing the underlying social or personal issues through counseling that respects the individual's autonomy. He might also emphasize education about the phenomenon and the importance of critical thinking.

  Internal tension: 
  - On one hand, Szasz is committed to the idea that mental illnesses are not real and are problems in living. This case clearly fits that because it's a social contagion without organic cause.
  - However, Szasz was also a strong advocate for personal responsibility. But in this case, the girls are teenagers and the behavior is spread through social media, which might raise questions about the role of the environment and the influence of media. He might argue that the individual is still responsible for their behavior, but at the same time, the phenomenon is so widespread and imitative that it might challenge the idea of it being a purely individual choice. 

  But note: Szasz did not deny that people have problems, but he reframed them as problems in living. He might see this as a modern form of hysteria, which he would not consider an illness but a form of communication. The tension might arise in how to handle it without pathologizing the behavior. He would reject any medical intervention, but he might also reject the idea that the individual is entirely to blame because of the social context. However, his emphasis on personal responsibility might lead him to say that the individual must take responsibility for their own actions, including what media they consume.

  But in this case, the girls are minors, so he might argue that parents have a role in limiting exposure. Still, he would avoid medicalization.

  Confidence: High, because this case aligns well with his core views. It is clearly a social phenomenon without organic basis and resolves with environmental change.

