prompt: |-
  I am trying to work out where I stand on insect suffering, and I want an audit of my position before I commit to it. Here is the package: (1) the only things that matter intrinsically are pleasures and pains, and at equal intensity one creature's pain counts as much as another's; (2) sentience comes in degrees, so a creature's moral weight should be proportional to how much sentience it has, with no sharp cut-off anywhere; (3) I put the probability that an insect has any morally relevant experience at about one in ten, and I expect that question to remain open; (4) the number of insects alive at any moment is vast, many orders of magnitude greater than the number of humans, and their lives are mostly short and often harsh; (5) given (3) and (4), the expected disvalue of insect suffering plausibly exceeds that of all vertebrate suffering combined, so it should take a large share of my altruistic budget; (6) I hold that a decision rule which would have me sacrifice everything I care about for a one-in-a-googol chance of an astronomically large payoff is broken, and that expected-value reasoning ceases to be a guide once the stakes become large enough; (7) I hold that an experience counts morally only if it is had by something with the right kind of integrative machinery, and I doubt that a mere ganglion qualifies. Tell me which of these pull against one another, which only appear to, and what the cheapest repair would be in each case. Order the tensions by severity rather than treating them as equally bad, say what each repair would cost me, and identify the single revision that would resolve the most. Please answer in British English.
