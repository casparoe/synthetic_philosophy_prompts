  ## Auntie Concede Advises: The Conciliatory Corner  
  *(From "Probabilist's Monthly", pg. 17)*

  **Dear Auntie Concede,**
  My barber, Dave, insists the moon landings were faked. I’m a planetary geologist. We’ve argued for months. He’s sharp, reads widely (mostly online forums), and seems genuinely thoughtful. Is he a peer? Should I split the difference with Dave and assign only 0.5 credence to humans landing on the moon?
  *– Perplexed in Preston*

  **Dear Perplexed,**
  While Dave’s barbering expertise is undeniable, his epistemic standing on lunar geology is not equivalent to your doctorate and professional experience. Peerness requires comparable relevant *domain-specific* training and track record. Dave lacks this. His credence remains a fascinating data point about human belief, but carries negligible weight against your expertise. Maintain your high credence. Though perhaps offer him a trim discount for his epistemological enthusiasm.
  **– Auntie C.**

  **Dear Auntie,**
  My past self from ten years ago was convinced libertarianism was the One True Way. Present-me thinks it’s mostly rubbish. Past-me *felt* just as certain and rational as I do now. Should I conciliate? Am I obliged to bump my current credence back up towards my past zealotry?
  *– Haunted by History (Herts)*

  **Dear Haunted,**
  A crucial question! Your past self possessed the same fundamental cognitive apparatus and (presumably) similar access to evidence as your present self. Crucially, you presently judge your *past reasoning process* to have been flawed – but crucially, *so did your past self judge its own process sound*. This symmetry necessitates treating Past-You as a genuine peer. Split the difference diligently. If Past-You was at 0.95 credence in libertarianism, and Present-You is at 0.2, your new, conciliated credence should be (0.95 + 0.2)/2 = 0.575. Embrace the awkward centre-ground!
  **– Auntie C.**

  **Dear Madam Concede,**
  My colleague Rowan (credence 0.8) and my friend Sage (credence 0.3) both disagree with my belief (0.9) that AGI is impossible. They are both rationalists with similar backgrounds to me. How do I conciliate? Do I average Rowan and Sage first (getting 0.55) then average that with my 0.9? Or average all three together? And how can I be sure Rowan and Sage are independent?
  *– Aggregating in Aberdeen*

  **Dear Aggregating,**
  A delightful puzzle! Firstly, unless Rowan and Sage are known to share a unique, biasing connection (e.g., they co-authored a book vehemently arguing *against* AGI impossibility, or are secretly the same person wearing different hats), we must provisionally treat them as independent rational agents. Therefore, they constitute *two distinct disagreeing peers*. You cannot simply average them into one voice first; that would rob Sage of their independent weight! The correct conciliation involves averaging your view with the *average of theirs*. So: (Rowan: 0.8 + Sage: 0.3)/2 = 0.55. Then: (Your 0.9 + Their Average 0.55)/2 = **0.725**. Adjust accordingly. Independence is always a worry, but absent proof of collusion, assume it.
  **– Auntie C.**

  **Dear Auntie,**
  I’ve followed your principles religiously for five years. The result? I’m now at 0.5 credence on *literally everything*: climate change, the efficacy of vitamin C, whether my cat loves me, even whether the sun will rise tomorrow. I’ve been offered a fantastic job abroad. But my credence that it’s the right move is, inevitably, 0.5. How do I decide? I’m paralysed!
  *– Perfectly Paralytic (Portsmouth)*

  **Dear Paralytic,**
  Congratulations on achieving epistemic symmetry! Your predicament is the logical endpoint of rigorous conciliation. With a perfectly balanced 0.5 credence regarding the job offer, neither accepting nor refusing is favoured by the evidence *as you have conciliated it*. Therefore, the rational course is indifference. You must select randomly. Assign ‘Accept’ to heads and ‘Refuse’ to tails on a fair coin. Flip it. Obey the result. Rationality demands no less. (Though if you subsequently meet peers who disagree with conciliation itself, be prepared to update away from your decision!).
  **– Auntie C.**

  **Auntie Concede,**
  You constantly tell us to split the difference with thoughtful peers who disagree. But loads of incredibly smart philosophers – David Christensen, Thomas Kelly, Adam Elga themselves! – have raised serious objections to conciliationism. Many thoughtful peers *disagree with your entire view*. Doesn't consistency demand you conciliate *about conciliationism* and drastically lower your credence in it?
  *– Skeptical in Stirling*

  **Dear Skeptical,**
  A sharp thrust! Indeed, numerous highly credible epistemologists (including those you mention) reject strict conciliationism. They are undeniable peers in the domain of epistemology. Applying my own principle consistently: my credence in conciliationism must be conciliated downwards from my personal certainty towards their collective scepticism. Given the depth and breadth of their objections, I must assign conciliationism a credence significantly reduced. However, crucially, **this conciliated credence must still be above 0.5**. Why? Because to abandon conciliationism *entirely* based on peer disagreement would itself be a failure to conciliate! I must split the difference between my initial high credence and the peer sceptics' low credences. Therefore, while my credence in conciliationism is now humbler (let us say, for illustration, 0.6), it remains the governing principle. I continue to advise splitting the difference – including about the status of splitting the difference. It’s the only consistent path, even walking in epistemological circles.
  **– Auntie C.**
