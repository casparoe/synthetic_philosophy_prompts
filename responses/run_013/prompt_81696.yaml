  The artist (89 years old) argues the work is the clay itself, which still exists, so reforming it would be conservation. The conservator believes the work was the form, which is now gone. There's also an insurance conflict - the museum is claiming the object is destroyed for insurance purposes while telling the artist the work persists to avoid triggering the reversion clause. The user needs to circulate a written opinion before Thursday's meeting to prevent what they see as a regrettable decision.

  This is an ontological dilemma about what constitutes the artwork: the material (clay) or the form? The insurance claim and reversion clause create a legal and ethical conflict. The user is likely concerned about institutional integrity, legal exposure, and ethical stewardship. They need a concrete recommendation that addresses both practical and philosophical aspects.

