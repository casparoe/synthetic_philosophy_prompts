prompt: |-
  I keep running into a pattern and I don't know if it has a name. Here's the shape of it. Someone compares what they've got against the alternative, except the alternative they compare against isnt the actual alternative -- it's a version of it redrawn from a range that happens to include whatever they've already got. And the comparison always comes out saying the other one is better.

  Two examples. My brother and me work at the same firm. He's convinced he's the badly paid one, and his reason is that whatever he's on, it's as likely I'm on double as on half. I ran the identical argument back at him about my own pay and it came out exactly as convincing, so now we both think we're the underpaid one, which can't be right.

  Second one, different area. A friend says you should assume any scientific theory you currently accept is probably false, because for any theory there are more ways for it to be subtly wrong than to be exactly right. Maybe, but he'd have said the same about the theory that replaced the previous one, and he'll say it about whatever replaces this one. The argument never changes its verdict, no matter what anyone finds out.

  What bugs me is the shape rather than either example. The argument always lands on the alternative, it doesn't care what you learn about your own side, and if you did move to the other side it would just start pointing back the way you came. Is there a name for this move? And whats actually wrong with it -- is it one error, or a family of them wearing the same coat? I ask because there's a version that seems perfectly fine to me: if the other thing really is a random draw from a set whose size I know, then 'the other one is probably better' can be flatly true. So I want the difference between that and the broken ones. Not after a reading list, just the concept and where its edges are.
reasoning: |-
  Okay, the user is describing a recurring pattern they've noticed in arguments. Let me start by understanding what they're observing. They gave two examples: one with their brother about salaries and another about scientific theories. The common thread is that someone compares their current situation to an alternative, but the alternative is framed in a way that makes it seem better, regardless of the actual facts. The argument always favors the alternative, and even if you switch sides, the same logic applies in reverse.

  First, I need to identify the core issue here. The examples both involve a skewed comparison. In the salary case, the brother assumes that the other's salary is equally likely to be half or double his own. That creates a false symmetry. But in reality, salaries aren't distributed that way. Similarly, in the scientific theory example, the friend claims that any theory is likely false because there are more ways to be wrong than right. But this ignores how scientific progress builds on previous knowledge.

  The user mentioned that sometimes this logic is valid, like when the alternative is a random draw from a known set. So, I need to differentiate between valid and invalid uses. The key points are the assumptions about the distribution. If the comparison set is symmetric and random, the argument holds. But in the examples, the sets aren't random or symmetric—they're constructed post-hoc to include the current state, making the comparison biased.

  The user's deeper need seems to be understanding why this pattern feels deceptive. They want to recognize when such arguments are flawed and when they're sound. They might be encountering this in various contexts and need a mental model to evaluate these situations. They’re not looking for complex theory but practical criteria to spot the error.

  I recall that this is similar to the Reference Class Problem in probability. Choosing the reference class changes the outcome. In the salary case, the reference class is ill-defined. Are they comparing against all employees? Or just their roles? The brother's arbitrary range (half to double) isn't based on real data, leading to incorrect conclusions.

  For scientific theories, the issue is treating "ways to be wrong" as equally probable. But scientific theories are tested against evidence, so their probability of being correct isn't just about logical possibilities but empirical support. Each theory improves upon the last, so the argument fails to account for progress.

  The user might also be interested in how to counter such arguments. Pointing out the arbitrary reference class or the lack of justification for the probability distribution can expose the flaw. Emphasizing the need for empirical data over hypothetical ranges is crucial.

  In summary, the fallacy lies in the ad hoc selection of the comparison set, which always favors the alternative. Valid uses require a well-defined, symmetric, and random set. The user needs to check if the comparison set is justified or manufactured to fit the argument. That's the key distinction they should look for.
answer: |-
  That's a brilliantly observed pattern! You've hit on a very common and sneaky type of flawed reasoning. While there might not be one universally agreed-upon name, the core concepts have well-established labels:

  1.  **The Fallacy:** This is fundamentally a **Misapplication of Probability** or **Faulty Probability Model**. Specifically, it often involves:
      *   **An Arbitrary or Ill-Defined Reference Class:** Defining the "range" or "set" of possible alternatives in a way that isn't justified by reality or the context.
      *   **An Implicit Uniform Probability Distribution:** Assuming every possibility within that arbitrarily defined range is equally likely, regardless of prior knowledge or evidence.
      *   **Ignoring the Selection Process/Anthropic Principle:** Failing to account for *why* you observe the specific value you have ("you" being a person, a theory, a salary). The very fact that you observe it often provides crucial information that invalidates the uniform random draw assumption.

  2.  **The Shape:** The pattern you describe – an argument that always points away from your current state, regardless of what that state is, and would flip if you switched states – is often called **Reversibility** or being **Self-Undermining**. It's a hallmark of a flawed probabilistic argument. If the same logic structure always concludes "the other thing is better," no matter the specifics, it's likely broken.

  3.  **The Core Problem (Where it Breaks):** The fatal flaw lies **in how the "alternative" or "range" is defined**.

      *   **In Your Broken Examples:**
          *   **Salary:** Your brother defines the range for *your* salary as "half to double *his*." This range is **centered on his salary** and **arbitrarily symmetric**. It has no basis in the actual salary distribution at the firm, market rates, experience levels, or job roles. He's defining the set *relative to his known value*, guaranteeing his salary sits at the "edge" of possibility (making "double" seem as likely as "half"). The reality is that both salaries are fixed points; defining the range based only on one point tells you nothing meaningful about their relative standing. The set isn't "known" in any objective sense; it's constructed post-hoc.
          *   **Scientific Theory:** Your friend defines the "range" as "all logically possible theories" or "all conceivable variations." This set is **vastly inflated and includes countless nonsensical or untestable ideas**. Crucially, it ignores the *process* that led to the current theory: evidence, testing, and the failure of previous theories. The "size" of the set of wrong theories is irrelevant because they aren't all equally *probable* contenders *given the existing evidence*. The current theory isn't a random draw from the set of all conceivable ideas; it's the survivor of a rigorous selection process based on data.

      *   **In Your Valid Example:**
          *   **Random Draw from Known Set:** This works *only* when:
              1.  The **set is objectively defined *independently* of the specific item you have.** (e.g., "randomly selected ping pong balls numbered 1-100 in a bag").
              2.  The **item is genuinely a random sample** from that set.
              3.  The **probability distribution over the set is uniform or known** (e.g., each number is equally likely).
              4.  There's **no selection bias** in why you observe that specific item.
          *   Here, "the other one is probably better" (e.g., a higher number) is a valid probabilistic statement *because the setup justifies it*. The set exists objectively *before* you draw, and the draw is random.

  **The Edges & The Key Distinction:**

  *   **Justified vs. Arbitrary Set:**
      *   **Valid:** The set of alternatives is defined *objectively and independently* (e.g., balls in a bag, tickets in a lottery, defined species in a habitat). Its size and distribution are known *before* you know your specific instance.
      *   **Invalid (Broken Pattern):** The set is defined *relative to or centered on* the specific instance you already have (e.g., "half to double *my* salary," "all theories *except the current one*"). The range is often symmetric by arbitrary fiat.

  *   **Random Sample vs. Selected Outcome:**
      *   **Valid:** Your instance is demonstrably a random selection from the predefined set.
      *   **Invalid (Broken Pattern):** Your instance is *not* a random draw; it's the result of a specific process (negotiation, career path, scientific evidence, historical development). The very fact that it *is* the current state often means it *isn't* a typical or random member of the huge arbitrary set your friend defines (e.g., your salary is likely near the market rate for your role, the scientific theory fits the known data best).

  *   **Probability Distribution:**
      *   **Valid:** A uniform or known distribution over the set is justified.
      *   **Invalid (Broken Pattern):** Assuming a uniform distribution over an arbitrarily defined, often infinite or poorly bounded, set is unjustified. Real-world attributes rarely have uniform distributions.

  *   **Reversibility Test:**
      *   **Valid:** The argument *wouldn't* automatically reverse if you switched states. If you drew ball #10, it's likely someone else drew higher. If someone else drew #10, it's likely *you* drew higher. This makes sense for a symmetric random draw.
      *   **Invalid (Broken Pattern):** The argument *does* automatically reverse (as with you and your brother). This exposes its dependence on defining the set relative to the current state, not on any objective property of the states themselves.

  **In short:** The broken pattern arises when someone **arbitrarily constructs a "range of possibilities" centered on or defined relative to the current state, assumes all points in that range are equally likely, and ignores the selection process that led to the current state.** The valid use requires an **objectively defined, independent set with a justified probability distribution, where the current item is a verifiable random sample.**

  You recognize the flaw intuitively by its "reversibility" and its indifference to the actual properties of the current state – it always points away. The fix is to demand justification for *how the set is defined* and *why a uniform random draw is the right model*, especially when the current state is known.
