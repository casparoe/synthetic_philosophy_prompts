  ### **Glossary of Named Positions**  
  - **Eliminativism:** Species should be abandoned; no natural units exist in some cases.  
  - **Essentialist Realism:** Species are classes defined by a shared essence (e.g., DNA blueprint).  
  - **Homeostatic Property Cluster (HPC):** Species are real clusters of co-occurring traits (no single essence).  
  - **Species-as-Individuals (SAI):** Species are concrete lineages with birth/death events.  
  - **Class Realism:** Species are natural kinds defined by shared properties.  
  - **Monism:** One species concept fits all cases.  
  - **Pluralism:** Multiple concepts are valid for different contexts.  
  - **Nominalism:** Species are useful human labels, not natural kinds.  
  - **Species as a Practice:** Species are tools for science/conservation (not true/false).  
  - **Species as a Verb:** Species are processes of boundary-making (not static things).
