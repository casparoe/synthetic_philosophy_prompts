  1. **Combinations the Tree Cannot Separate:**  
     - **Realism variants (HPC, SAI, Class Realism):** The tree uses cases to distinguish these, but a user who prioritizes lineage cohesion (Node 1 "Yes") could land in HPC, SAI, or "Species as a Verb" depending on later nodes. These are separated by Node 2 (asexuals) and Node 10 (stability).  
     - **Anti-realism variants (Nominalism, Eliminativism, Practice):** Domesticated breeds (Node 7) and asexuals (Node 8) distinguish these, but if users reject all "reality" at Node 1, they are routed to Node 7 or Node 8 for finer distinctions.  

  2. **Unoccupied Branches & Diagnoses:**  
     - **Node 6 → "No" (extinct taxa same as living):** Leads to SAI (Leaf 1). The branch "Extinct taxa differ but cohesion matters" is unexplored but coherent (e.g., a lineage-focused view with flexible criteria for fossils). *Diagnosis:* Unattractive to realists (undermines species' generality) and anti-realists (overly complex).  
     - **Node 8 → "No" (no clusters with HGT):** Leads to Eliminativism (Leaf 7). The branch "HGT clusters exist but are not species" is unnamed. *Diagnosis:* Coherent (e.g., "gene-network entities") but unexplored; biologists avoid redefining "species" for microbes.  
     - **Node 4 → "No" (trees work with HGT):** Leads to Node 9. No branch for "trees work only for sexuals." *Diagnosis:* Unattractive; implies HGT is irrelevant, which contradicts modern microbiology.  

  3. **Design Choices:**  
     - The tree prioritizes cases over jargon (e.g., "cryptic species" instead of "reproductive isolation").  
     - "Most awkward commitment" highlights trade-offs (e.g., monism’s rigidity, pluralism’s inconsistency).  
     - Non-standard views ("verb" and "practice") are integrated as leaves (Node 10 and Node 7/8).  

  This tree helps users see that disagreements arise from **which cases they prioritize** (e.g., birders emphasizing reproduction may favor Node 3 "No," while microbiologists may start at Node 4). By linking concrete cases to philosophical commitments, it reveals that "realism" and "nominalism" are umbrellas for distinct positions.  

