  **Question:** Should an asexual lineage (e.g., bdelloid rotifers) that never interbreeds but is ecologically/genetically coherent be called a species?  
  - **Yes (cohesion without sex):** Go to Node 4.  
  - **No (sex required):** Go to Node 5.  

  #### **Node 3: Hybrid Zones**  
  **Question:** If two populations form a stable hybrid zone with fertile offspring, does this undermine their status as separate species?  
  - **Yes (gene flow = unity):** Go to Node 6.  
  - **No (isolation persists):** Go to Node 7.  

  #### **Node 4: Horizontal Gene Transfer (HGT)**  
  **Question:** Does widespread HGT (e.g., in bacteria) make a tree-like species model untenable?  
  - **Yes (networks over trees):** Go to Node 8.  
  - **No (trees still useful):** Go to Node 9.  

