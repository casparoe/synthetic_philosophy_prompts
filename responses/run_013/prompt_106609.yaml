prompt: |-
  I am a teaching assistant for a second-year undergraduate course in applied ethics, and I am responsible for grading the essay section of the midterm. I would like you to act as an experienced instructor in moral philosophy: read the examination question and the student's answer reproduced below, work out what the student has actually committed themselves to, and assign a grade together with the comments that justify it. Please do not give me a general impression — I need a point-by-point assessment that says which parts are adequate, which are vague or under-argued, and whether any of the errors are substantive or merely verbal. Before you settle on the grade, think carefully about what a fully adequate answer to each of the three parts would have to contain, and then check the student's answer against that standard rather than against its fluency.

  The question was: "Consider three ways in which a physician might bring about the death of a competent, terminally ill patient who has asked to die. In Case A she injects a lethal dose of a drug. In Case B she switches off the patient's ventilator. In Case C she turns a dial that steadily reduces the ventilator's oxygen supply until the patient suffocates. (i) How should each case be classified under the doing/allowing distinction, and on what does that classification depend? (ii) What is the strongest argument for the view that doing and allowing are morally different, and what is the strongest argument against it? (iii) Does the doctrine of double effect illuminate the moral difference, if any, among the cases?"

  The student's answer was: "Cases A, B and C can be sorted using the doing/allowing distinction. In Case A the physician performs an act that kills the patient, so this is a doing, and specifically a killing. In Case B she withdraws a treatment she is under no obligation to continue, and the patient then dies of the underlying illness, so this is an allowing, and specifically a letting die. Case C is different again: because the physician actively manipulates the dial and thereby changes what the patient receives, she is doing something to the patient, so this too is a doing. The classification is therefore a straightforwardly factual matter, settled by asking whether the physician's conduct is an act or an omission. The strongest argument for the moral difference is that the agent who does is the author of the death, whereas the agent who allows merely permits a natural process to continue; the strongest argument against it is that the outcome is the same, and the physician's intention may be the same, so that the only remaining difference lies in how we describe the conduct. Since the physician's conduct is necessary for the death in all three cases, the difference between them cannot be a difference in causation, and so the doing/allowing distinction is doing no real work here. The doctrine of double effect is what really explains the difference. It permits a foreseen death as a side effect while forbidding an intended death as a means. Because killing involves an intended death and letting die a merely foreseen one, the doctrine of double effect is simply the doing/allowing distinction expressed in another vocabulary, and the two ideas stand or fall together. This is why the law is right to treat the withdrawal of treatment as fundamentally different from an injection."

  Please give a letter grade (A to F, with plus or minus where appropriate) for the answer, followed by your comments. Lead with the grade and keep the whole response under 450 words.
reasoning: |-
  Okay, the user is a teaching assistant grading an applied ethics midterm essay. They need a rigorous point-by-point assessment of a student's answer about the doing/allowing distinction in end-of-life cases. The student addressed three physician actions: lethal injection (A), switching off ventilator (B), and gradually reducing oxygen (C).

  Hmm, the student's classification of Case A as "doing" and Case B as "allowing" is correct but superficial. They missed that Case B's permissibility hinges on the physician's obligation to provide treatment - a crucial normative element they reduced to mere "factual" act/omission. For Case C, calling it "doing" is debatable; many ethicists would classify gradual withdrawal as allowing since it's functionally equivalent to B. 

  Ah, part (ii) shows deeper problems. The pro-argument correctly notes authorship but ignores key defenses like autonomy or rights violations. The con-argument rightly questions outcome equivalence but fails to engage with counterexamples (e.g., failing to rescue vs. pushing into water). Worse, they prematurely dismiss causation - which is actually central to the debate!

  *facepalm* Part (iii) completely conflates doing/allowing with double effect (DDE). DDE concerns intention vs foresight, not physical action/inaction. The student wrongly claims letting die always involves merely foreseen death - but intention determines permissibility in both active and passive cases. Their legal reference is irrelevant to the philosophical question.

  *checking rubric* For a second-year undergrad: 
  - Part (i) gets partial credit (C+) for basic accuracy but misses nuances. 
  - Part (ii) is inadequate (D) - arguments lack depth and contain substantive errors. 
  - Part (iii) is fundamentally mistaken (F). 
  Overall grade balances these: C- for identifying core concepts but failing in analysis and synthesis. 

  *adjusting feedback tone* Must emphasize where points were lost without discouraging the student. Highlight that they grasped surface distinctions but need to engage counterarguments and avoid conceptual blurring. Suggest reviewing causation debates and DDE's actual criteria.
answer: |-
  **Grade: C-**  

  **(i) Classification (Adequate but incomplete):**  
  • Case A: Correctly identifies as "doing/killing" (✓).  
  • Case B: Correct as "allowing/letting die" but oversimplifies by calling it purely factual. Fails to note that moral classification hinges on *whether continuation was obligatory*, not just act/omission (△).  
  • Case C: Misclassified. Gradual reduction is standardly viewed as *allowing* (withdrawal of treatment), not "doing." The "active manipulation" claim confuses physical movement with moral agency (✗).  
  • Error: Asserts classification is "factual" and "depends on act/omission," neglecting normative context (e.g., duties of care).  

  **(ii) Arguments (Under-argued and partially flawed):**  
  • *For moral difference:* Correctly cites "authorship" but omits key defenses (e.g., rights violations, causal responsibility). Superficial (△).  
  • *Against moral difference:* Correctly notes identical outcomes/intentions but dismisses causation too hastily. Fails to address robust counterarguments (e.g., *why* causation might matter despite same result). Weak engagement (✗).  
  • Substantive error: Claims doing/allowing "cannot be causal" without argument, ignoring debates about causal thresholds.  

  **(iii) Doctrine of Double Effect (DDE) (Inaccurate):**  
  • Misrepresents DDE as synonymous with doing/allowing. DDE concerns *intention* (means vs. side effect), not physical action. Cases B/C could involve *intended* death without being "doings" (✗).  
  • Incorrectly asserts letting die always involves "merely foreseen" death; intention is independent of doing/allowing (critical error ✗).  
  • No illumination attempted: Fails to apply DDE to cases (e.g., whether death is intended as means/end).  

  **Overall:** Demonstrates basic grasp of distinctions but lacks precision. Substantive errors in Case C classification and DDE conflation undermine core concepts. Arguments are shallow and miss required depth for second-year level.  

