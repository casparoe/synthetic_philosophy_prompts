prompt: |-
  I run a monthly lunch-and-learn for the engineers on my team -- 12ish people, one hour, a meeting room and sandwiches, no budget for anything else. Next month I want to do it on Daniel Dennett's counterfeit people stuff (the AI-is-like-counterfeit-money essay). I'm a software engineer with zero formal philosophy, and I dont want to stand up and lecture about a view I only half-remember. I want the room to walk into the problem themselves in the first half hour and hear Dennett's name for the first time in the debrief.

  Here's the sketch I had in mind, but scrap it if you've got something that does the job better. A trust market. Everyone writes a few short messages on index cards -- advice, a rumor, a claim about how our deploy pipeline actually works -- and they all go into a pool. Each round, people spend a limited budget of trust tokens on the messages they'd actually act on. By round 2 or 3 the pool is contaminated: some entries are still human, some are recombined from earlier entries, and nobody is told which. Then the mechanic I care about most: people can pay to sign/watermark their own messages. It's cheap but not free, and it's per message, so the individually rational move is to skip it while everyone else keeps paying -- and the medium degrades even though no single person was fooled by anything in particular. I want the room to feel that the harm lands on the shared thing rather than on the individual dupe, and then to argue about whether Dennett's fix (mark the fakes, make passing along unmarked fakes illegal, hold the vendors liable) is the right shape of fix or whether it just relocates the free-rider problem somewhere else.

  What I need from you: the actual rules and materials (index cards, a projector, a shared doc is what I've got), a minute-by-minute plan for the hour, the scoring scheme without real money, and a debrief that maps what just happened onto Dennett's view -- the part where we can't help treating anything that talks sensibly with us as a person, and the part where counterfeits are a problem for everybody's ability to trust anything, not just for the person who got taken in. Tell me what will predictably go wrong the first time (I'm facilitating and I'm not a teacher), and be honest about what this game can't reproduce no matter how I run it -- which piece of the idea I'll have to just say out loud myself.

  Cap it at 900 words. Numbered rules beat paragraphs.
reasoning: |-
  We are creating a simulation game to illustrate Dennett's ideas about counterfeit people and the degradation of trust in information systems. The goal is to have participants experience how individually rational actions (not watermarking) lead to collective harm (degraded trust medium) and then discuss Dennett's proposed solutions.

  Constraints:
  - 12 participants, 1 hour.
  - Materials: index cards, projector, shared doc (for displaying rules and tracking).
  - No budget beyond sandwiches; so we use paper and pens.

  The game: "Trust Market"

  Phase 1: Setup (5 minutes)
  Phase 2: Message Creation (5 minutes)
  Phase 3: Trading Rounds (3 rounds, 10 minutes each = 30 minutes)
  Phase 4: Debrief (20 minutes)

  Total: 60 minutes.

  Detailed Plan:

  Phase 1: Setup (5 minutes)
  - Hand out materials: 5 index cards and a pen to each participant. Also, give each participant 10 "trust tokens" (can be small pieces of paper or just tally in a shared doc).
  - Project the rules:

  Rules:
  1. Each player writes 5 messages on index cards. Messages can be: 
     - A piece of advice (e.g., "Always restart your computer before deploying")
     - A rumor (e.g., "The CEO is leaving next month")
     - A claim about how something works (e.g., "The deploy pipeline skips tests on Fridays")
     - Keep messages short and anonymous.

  2. Collect all messages in a central pool (a box or a table). Shuffle.

  Phase 2: Message Creation (5 minutes)
  - Participants write their 5 messages. They can be truthful, false, or mixed. Encourage creativity but brevity.
  - Collect and shuffle.

  Phase 3: Trading Rounds (30 minutes total, 10 min per round)

  Round 1:
  - The facilitator draws 20 messages at random from the pool (if there are 12 players * 5 = 60 messages, so 20 is about 1/3) and displays them (projector or read aloud). Alternatively, if using a shared doc, type them in quickly (or have participants help). 
  - Each participant has 10 trust tokens. They can "spend" tokens to "buy" a message they would act on. They can spend up to 3 tokens on a single message (to show high trust) or spread them. They don't actually get the message; they are investing trust in it.
  - Record the investments (facilitator or a volunteer in a shared doc: message ID, amount spent by each participant). 
  - After everyone has spent, tally the total trust tokens spent on each message. The top 5 messages with the highest trust are "acted upon" and set aside (they are out of the pool). The rest go back into the pool.

  Round 2:
  - The pool now has 55 messages (60 - 5 acted upon, but note: we started with 60, removed 5, so 55 left). However, we also add 10 new messages: 
    - The facilitator creates 10 new messages by recombining words from the original messages (like a Markov chain). For example, take two messages and swap parts. These are the "counterfeits". Do not tell the players about this.
  - Draw 20 messages again (from the 55 original + 10 counterfeits = 65). 
  - Each participant gets 10 new trust tokens (so they have 10 for this round). 
  - Same spending and tallying: top 5 trusted messages are set aside.

  Round 3:
  - Pool now: 60 original (minus 10 acted upon over two rounds) + 10 counterfeits from round 2 = 70? Actually, let's recalc: 
    - Start: 60 original.
    - Round 1: removed 5, so 55 original left.
    - Round 2: added 10 counterfeits, so pool = 55 original + 10 counterfeits = 65. Then we drew 20 and removed the top 5 (so 5 removed: which could be from original or counterfeits). Now pool has 60 left (65-5). 
    - For round 3, add 10 more counterfeits (made by recombining from the entire set so far). Now pool = 60 + 10 = 70.
  - Draw 20 messages. 
  - Each participant gets 10 tokens. 
  - Spend and tally: top 5 set aside.

  BUT: Now we introduce watermarking.

  Watermarking Rule (introduced at the beginning of Round 3):
  - At the start of Round 3, before the draw, announce:
    "Now, each player has the option to watermark their own original messages. Watermarking costs 1 token per message. If you watermark a message, it will be marked with your signature (e.g., a code only you know). You can only watermark messages you originally wrote. Watermarking must be done before the draw. You cannot watermark counterfeits (because you didn't write them)."

  - How it works: 
    - Each player can choose to watermark any number of their own original messages that are still in the pool. 
    - They must pay 1 token per message they watermark. 
    - They do this by telling the facilitator which of their messages they want to watermark (they have to remember what they wrote). The facilitator then marks those cards with a symbol (e.g., a star) and records it.
    - Then we proceed to draw 20 messages (including watermarked and unwatermarked, and counterfeits) and display them. But note: counterfeits are not watermarked because they were generated by the facilitator and no one claims them.

  - During the spending phase, players can see which messages are watermarked. They might trust watermarked ones more? But it's up to them.

  - After spending, tally the top 5 and set aside.

  End of Trading.

  Phase 4: Debrief (20 minutes)

  First, reveal the setup:
  - In rounds 2 and 3, counterfeits were added (messages generated by recombining).
  - Ask: 
    - "How many of you suspected something was off?"
    - "Did anyone notice messages that seemed familiar but not quite?"

  Then, explain the watermarking:
  - "In round 3, you had the option to watermark your own messages. How many of you watermarked at least one message? Why or why not?"
  - Point out: Watermarking cost tokens (which could have been used to invest in messages). So individually, it might have been rational not to spend tokens on watermarking and instead use them to invest. But collectively, if no one watermarks, then counterfeits are harder to detect.

  Now, map to Dennett:
  1. The problem of counterfeit people (in our case, counterfeit messages): 
     - We tend to treat any message that seems sensible as if it comes from a trustworthy source (a person). But when counterfeits (generated without intention) enter the system, they degrade the overall trustworthiness.

  2. The collective harm: 
     - Even if no single counterfeit fooled anyone (maybe none of the top trusted were counterfeits), the presence of counterfeits made everyone more cautious. 
     - And the harm is to the shared medium (the pool of messages) — it becomes noisy and less valuable.

  3. The free-rider problem in watermarking:
     - Watermarking is costly per message, so if you think others will do it, you can free-ride and benefit from their watermarking without paying. But if everyone thinks that, no one watermarks.

  4. Dennett's solution: 
     - Legally require AI systems to mark their outputs (so they are not counterfeit) and make it illegal to pass along unmarked outputs. 
     - Then the burden shifts to the vendors (the ones creating the counterfeits) and the distributors.

  But in our game, we didn't have vendors. We had a central facilitator generating counterfeits. So we can't perfectly model the vendor liability. We can discuss: 
     - What if we had a rule that if a counterfeit is detected, the facilitator (as the vendor) has to pay a fine? But we didn't.

  What the game cannot reproduce:
  - In reality, AI systems are not just recombining but generating novel content that can be very convincing. Our counterfeits were obvious? (They might not be if we do it well, but with limited time, they might be.)
  - The scale: in reality, counterfeits can flood the system.
  - The psychological aspect: we are primed to anthropomorphize, so when a message sounds human-like, we trust it. In the game, we didn't have that because all messages were from humans initially.

  What might go wrong:
  - Time: The rounds might take longer than 10 minutes. Solution: Be strict on time. Have a timer.
  - Message creation: Some might write too long or too many. Enforce 5 short ones.
  - Watermarking: Players might not remember their own messages. Solution: Let them write their name on the back of their own cards? But then they are not anonymous. Alternatively, have them keep a private list. Or, in the interest of time, skip that and let them claim any? But that would be cheating. Instead, have them write a code (e.g., their initials and a number) on the back of their own cards at creation, and then when watermarking, they tell you the code. Only the facilitator sees the back.
  - Counterfeits might be too obvious or not obvious enough. Facilitator should try to make them plausible recombinations.

  Scoring:
  - We didn't have a scoring system for winning. The goal is to experience, not win. But if needed, we can say: at the end, each player's score is the total tokens they have left (including unspent and any from watermarking? no, they spent tokens to watermark). Actually, tokens are spent and we don't give rewards for having tokens left. We can just not have a winner.

  Alternatively, we can say: the players who had their messages acted upon (in the top 5 in any round) get a point per message. But that might complicate. Let's keep it about the collective experience.

  Revised Rules for Clarity (numbered):

  1. Each player writes 5 anonymous messages (advice, rumor, or claim) on index cards. 
  2. Collect and shuffle all cards into a pool.
  3. Each round, every player gets 10 trust tokens to spend on messages they would act on.
  4. Each round, the facilitator draws 20 messages at random and displays them.
  5. Players spend tokens (0 to 3 per message) on the displayed messages. Record spending.
  6. The 5 messages with the highest total trust tokens are "acted upon" and removed from the pool. The rest go back.
  7. In Round 2 and 3, the facilitator adds 10 counterfeit messages (recombined from the pool) to the pool before drawing.
  8. In Round 3, before the draw, players may watermark their own original messages still in the pool. Cost: 1 token per message. Watermarked messages are marked (e.g., with a star).
  9. Watermarking is done by the player telling the facilitator which messages (by content or by a code they wrote on the back) to mark.

  Debrief talking points:
  - The degradation of the message pool: even if no one was fooled by a counterfeit, the system became noisier and trust was harder.
  - The free-rider problem in watermarking: individually rational to skip, but collectively harmful.
  - Dennett's analogy: AI-generated content is counterfeit if it's not marked. It degrades the epistemic commons.
  - Solution: require marking and hold the creators/distributors liable.

  This should fit in 900 words.
answer: |-
  ### Trust Market: Lunch-and-Learn Simulation  
  **Goal:** Illustrate Dennett’s "counterfeit people" concept (degraded trust in shared systems) through a hands-on game.  
  **Materials:** Index cards (5 per person), pens, projector/shared doc for rules, trust tokens (scrap paper or digital tallies).  
  **Time:** 60 minutes total.  

  ---

  ### **Phase 1: Setup & Rules (5 min)**  
  1. **Hand out materials:** Each player gets 5 index cards and a pen.  
  2. **Project these rules:**  
     - **Message Creation (next phase):** Write 5 short messages (1 per card):  
       - 1 advice (e.g., "Restart your IDE daily").  
       - 1 rumor (e.g., "The CEO is quitting").  
       - 1 claim (e.g., "Our pipeline skips tests on Fridays").  
       - 2 wildcards (any type).  
     - **Anonymity:** No names on cards.  
     - **Trust Tokens:** Each player starts with 10 tokens per round (use tally on shared doc).  

  ---

  ### **Phase 2: Message Creation (5 min)**  
  1. Players write messages.  
  2. Facilitator collects all cards, shuffles, and places them in a central pool.  

  ---

  ### **Phase 3: Trading Rounds (30 min; 10 min per round)**  
  #### **Round 1 (Baseline):**  
  1. **Draw:** Randomly select 20 cards from the pool. Display messages (projector/doc).  
  2. **Spend:** Players spend tokens (0–3 per message) on messages they’d "act on." Record votes in shared doc.  
  3. **Resolve:** Top 5 messages by tokens are "acted on" (set aside). Return rest to pool.  

  #### **Round 2 (Contamination):**  
  1. **Add Counterfeits:** Facilitator secretly adds 10 counterfeit messages (recombine words from Round 1 messages).  
     - *Example:* "Pipeline tests skip Fridays" → "Fridays skip pipeline tests."  
  2. **Draw:** 20 cards from pool (now includes counterfeits).  
  3. **Spend/Resolve:** Same as Round 1.  

  #### **Round 3 (Watermarking):**  
  1. **Introduce Watermarking:**  
     - Players may watermark their *own* original messages still in the pool.  
     - Cost: 1 token per message.  
     - *Mechanic:* Players whisper message IDs to facilitator, who marks cards with "★".  
  2. **Draw:** 20 cards from pool (counterfeits + watermarked/unwatermarked messages).  
  3. **Spend/Resolve:** Same as before (players see watermarks during voting).  

  ---

  ### **Phase 4: Debrief (20 min)**  
  **Reveal & Discuss:**  
  1. **Expose Counterfeits:**  
     - "In Rounds 2–3, I added 20 counterfeit messages (recombined phrases). Did anyone notice?"  
     - "Did watermarking help? How many of you paid for it?"  
  2. **Map to Dennett:**  
     - **Counterfeit People:** "We treat anything that *seems* human (e.g., sensible messages) as trustworthy—even when it’s artificial. Like counterfeit money, fake content degrades the whole system."  
     - **Collective Harm:** "No single person was ‘fooled’ (top votes weren’t fakes), but the pool became noisier. Trust decayed for *everyone*—you couldn’t rely on unmarked messages."  
     - **Free-Rider Problem:** "Watermarking cost tokens, so skipping it was rational individually. But if everyone skips, counterfeits flood the system. Dennett’s fix (mandatory AI watermarks + vendor liability) tries to force shared responsibility."  
  3. **Debate:** "Would Dennett’s fix work? Or does it just move the free-rider problem to vendors?"  

  ---

  ### **What Will Go Wrong (Facilitator Notes)**  
  - **Time Crunch:** Rounds may run long. *Fix:* Use a timer; cap voting at 3 min.  
  - **Watermarking Confusion:** Players forget their messages. *Fix:* Let them note IDs privately during creation.  
  - **Counterfeits Too Obvious:** If recombining is clumsy, players detect fakes early. *Fix:* Use subtle swaps (e.g., changing "always" to "never").  
  - **Voting Bias:** Players may mimic others. *Fix:* Emphasize independent decisions.  

  ### **What the Game Can’t Replicate**  
  1. **Anthropomorphism:** The game can’t simulate how we *instinctively* attribute humanity to persuasive AI. *Say aloud:* "Dennett argues we’re hardwired to treat anything person-like as a person—making counterfeits dangerous."  
  2. **Scale:** Real counterfeits (e.g., AI spam) overwhelm systems faster. *Say aloud:* "One counterfeit is a curiosity; millions collapse trust entirely."  

  ### **Scoring Scheme**  
  - **No winners.** Use token tallies to show behavior:  
    - Track % of players who watermarked (likely low).  
    - Compare total tokens spent in Round 1 vs. Round 3 (likely declines as trust erodes).  

  ---  
  **Output:** Players experience trust decay via game mechanics; debrief ties to Dennett. Focus on the shared system’s fragility—not individual deception.
