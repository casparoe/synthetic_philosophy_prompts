  Okay, the user is in a seminar on statutory interpretation and needs to role-play as a textualist against a purposivist judge. They've crafted a fictional scenario with the Arden Heritage Rivers Act. Their argument centers on whether "maintenance dredging of a channel designated for navigation" can include sediment removal for spawning gravel restoration, based on the Act's ecological purpose. 

  Hmm, the user is clearly well-prepared—they've set specific boundaries for the judge's character (serious purposivist, no straw man) and provided a tailored statute. Their challenge is sharp: if purpose overrides the specific navigation-linked criteria in Section 5, doesn’t that negate the operative text? And that appropriation clause for "riverine restoration projects" seems like a killer point—why would the legislature use different language if they meant to fold restoration into "maintenance dredging"? 

  The user’s deeper need here is stress-testing their textualist instincts against a robust opponent. They don’t just want a counterargument; they want one that forces them to wrestle with textual ambiguity without collapsing into absurdity. The judge’s reply needs to concede surface tension (yes, "navigation" is there) while arguing that purpose reveals latent breadth in "maintenance." Key moves:  
  - Reframe "maintenance" as conserving navigability *and* ecological function (since the two are intertwined in heritage rivers).  
  - Neutralize the appropriation clause by distinguishing funding authority from regulatory limits.  
  - Insist this isn’t rewriting text but selecting a reasonable ordinary meaning (ecological upkeep = maintenance).  

  The trap to avoid: letting the user frame this as "purpose vs. text." Instead, position purpose as the lens revealing the text’s *full* meaning. If the judge holds that line without overreaching, it’ll push the user to refine their textualism beyond literalism.
answer: |-
  **Purposivist Judge:** Your textualist instincts rightly caution against disregarding operative text, but they overlook how purpose *illuminates* textual ambiguity. We begin with the Act’s explicit command: its objective is to "restore and protect the ecological integrity" of heritage rivers. Section 5’s permit exception for "maintenance dredging" is not self-defining. "Maintenance" ordinarily means conserving *existing, intended function*. For a heritage river, whose statutory raison d’être is ecological integrity, "maintenance" must encompass preserving core biological functions—like spawning habitat—integral to that integrity. The navigation channel designation provides the *location* for permissible dredging (avoiding limitless agency discretion), but the *purpose* of "maintenance" is informed by the Act’s overarching aim. This reading gives effect to every word: "dredging" remains physical sediment removal; "channel designated for navigation" confines the activity to planned waterways; "maintenance" is construed in light of the river’s statutorily mandated ecological purpose. The appropriation for "riverine restoration projects" reinforces, not undermines, this view: it shows the legislature contemplated restoration activities *distinct from regulated discharges*, but it does not shrink Section 5’s exception where restoration is achieved *through regulated dredging*. We do not delete "navigation" or "designated channel"; we recognize that maintaining ecological function in a navigation channel is consistent with the Act’s architecture when the river’s heritage status demands it.

  **Judge (continuing):** You suggest this reduces Sections 4 and 5 to mere permit-process adjuncts to the preamble. Not so. The preamble sets the goal; Sections 4 and 5 establish a *specific regulatory mechanism*: a near-total discharge ban, tempered by a narrow permit exception tied to *existing infrastructure* (navigation channels). My reading respects that structure. The Department isn’t authorized to dredge anywhere for ecological goals—only in designated navigation channels, and only where sediment removal *constitutes maintenance of the river’s ecological function*. This gives operative effect to the location requirement while harmonizing "maintenance" with the statute’s primary objective. Textual fidelity requires reading words in context, not in sterile isolation. Ignoring the ecological purpose would risk turning "maintenance dredging" into a loophole for degrading the very integrity the Act exists to protect—an outcome at odds with the legislature’s declared commitment. Your rigid separation of purpose and operative text fractures the statute’s unity. Where text permits a reasonable construction aligned with purpose, we adopt it. This requires no rewriting—only the recognition that "maintenance" in this unique statutory setting includes conserving ecological function.
