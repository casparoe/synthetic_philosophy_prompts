prompt: |-
  I need help with a recurring thing at work. I'm the compliance officer at a mid-size investment platform — not the lawyer, the one who has to sign off on new customer-facing features before they ship, which happens two or three times a month, and I usually get about a week per feature, sometimes less when marketing has already anounced it. My team keeps handing me designs that are all about removing friction: switch between funds whenever you like, undo any switch for free, cash out instantly, top up any time. My gut says some of these are traps — not scams exactly, but designs that let a customer be walked round a circle and bled a little on each lap — and I can't articulate why in a way the product team can't wave away with 'we're giving people choice'. A colleague who did a philosophy degree says there's a whole literature on this under the name money pumps: the classic case is preferring A to B, B to C and C to A, so someone can trade you round the loop and charge you for every trade, and the more interesting case is where your preferences don't cycle at all but change over time, so every step is one you'd endorse at the moment you take it and you still end up worse off. I don't want a reading list and I definitely don't want citations; I won't read them and the analyst who actually runs this won't either.

  What I want is a procedure we can run: a reusable exploitability audit for a proposed feature plus a described customer behaviour pattern. It should be a sequence of questions in order — the ones a person with no decision theory at all can ask — with what counts as a sufficient answer to each, where the sequence stops with a no (feature ships, or feature is blocked), and where it stops and hands the decision to me because the question is about values or about our appetite for risk rather than about facts. It needs to separate three things I keep mudling together: (a) the customer's own preferences are the problem, they genuinely cycle or reverse; (b) our fee schedule or environment is the problem — the loop only costs money because of how we've set fees, spreads or settlement; (c) nothing is wrong and the complaint is really a request to be insulated from the customer's own inconsistency. And it has to take seriously the obvious escape hatch, which is that a customer who sees the loop coming can simply refuse to start, or can ask us to lock them in — so say when foreseeability, or the availability of a commitment device, means there's no case to answer, and when it doesn't. Also flag which steps are judgment calls wearing a lab coat.

  Then run it on three things. First, free switching between three funds, where a customer has gone A to B to C to A twice now, each switch costing a small platform fee, and each time they said they preferred the new fund to the one they were in. Second, a retirement-style product with a free top-up button and a cash-out costing 2%: a customer has topped up every January and cashed out every June for three years, says they endorse it in June and regret it in December, and there's an optional lock buried in the settings. Third, and this is the one I'm dreading, our proudest feature — any switch can be undone free within 24 hours — where I suspect the answer will be that the reversibility is exactly what makes the loop cheap enough to be worth walking, and that the fix is to add friction. I'd like the procedure to say so if that's what it says, and to be honest about the cases it can't settle at all, for instance a customer who says they enjoy the switching and treat the fees as the price of a hobby.

  Write the procedure out in plain prose first so my analyst can follow it, then give me the same thing as a JSON object with these fields: preconditions (array of strings, what must be known before you start), steps (array of objects, each with n, name, question, sufficient_answer, if_yes, if_no, outcome — outcome being one of continue, stop_ship, stop_block, hand_to_human — and judgment_required, true or false), cannot_decide (array of strings, what the procedure is not entitled to rule on), misfire_notes (array of strings, where it will produce false positives or false negatives), glossary (object mapping each technical term the analyst has to understand to a one-sentence definition), and cases (array of objects, each with case_name, assumed_facts, steps_that_fire, verdict, judgment_calls, and unwelcome_to_us, true or false).
reasoning: |-
  We are designing a procedure to audit financial features for exploitability via money pumps or preference inconsistencies. The procedure should be a sequence of questions that can be applied to a proposed feature and a described customer behavior pattern. The goal is to identify whether the feature might lead to customers being exploited due to (a) their own inconsistent preferences, (b) the fee structure or environment, or (c) whether the issue is just the customer's inconsistency and we should not intervene.

  Key elements:
  1. The procedure must be a step-by-step question flow.
  2. Each step has a question and a sufficient answer that determines the next step (if_yes, if_no) and an outcome (continue, stop_ship, stop_block, hand_to_human).
  3. It must distinguish between the three problem types (a, b, c).
  4. Consider foreseeability and the availability of commitment devices as escape hatches.
  5. Flag steps that are judgment calls.

  We also need to run the procedure on three cases.

  Let's design the procedure in plain prose first.

  ---

  **Procedure: Exploitability Audit for Customer-Facing Features**

  **Preconditions** (must be known before starting):
  - The feature design (including any fees, spreads, settlement times, and any restrictions or locks).
  - A description of the customer behavior pattern that is observed or anticipated (including frequency of actions, stated preferences, and any expressed regrets).
  - The fee schedule and any costs to the customer for using the feature.
  - Any available commitment devices (e.g., locks, cooling-off periods) and their terms.

  **Steps**:

  1. **Identify the Action Loop**  
     Question: "Does the feature, in combination with the described customer behavior, enable a sequence of actions that can be repeated indefinitely (a loop) and that, over one full cycle, results in a net cost to the customer without any net change in their portfolio or cash position?"  
     Sufficient Answer: If yes, the loop exists and we proceed. If no, then there is no loop and the feature is safe from this kind of exploitation.  
     Outcome if Yes: Continue to step 2.  
     Outcome if No: Stop and allow the feature to ship (stop_ship).  
     Judgment Required: No. This is a factual question about the existence of a loop that resets the state and has a net cost.

  2. **Assess Foreseeability and Commitment**  
     Question: "Is the loop and its net cost foreseeable to a reasonable customer at the start? And if so, is there an available and effective commitment device (e.g., a lock) that the customer can use to avoid entering the loop, and is this device prominently offered?"  
     Sufficient Answer: If the loop is not foreseeable, then we have an issue. If it is foreseeable and an effective commitment device is prominently available, then we can consider the customer as having been given the tools to avoid harm.  
     Outcome if Yes (foreseeable and commitment available): Stop and allow the feature to ship (stop_ship) because the customer can avoid the loop.  
     Outcome if No: Continue to step 3.  
     Judgment Required: Yes. What is "foreseeable" and "prominently offered" may require judgment.

  3. **Distinguish Problem Type**  
     Question: "Does the net cost in the loop arise solely because of the platform's fee structure, spreads, or settlement rules (i.e., without these, the loop would be costless)?"  
     Sufficient Answer: If yes, then the problem is due to our fee structure (type b). If no, then the cost is inherent to the market or the customer's actions (like bid-ask spreads in the market) and we proceed to check for customer preference inconsistency.  
     Outcome if Yes (problem type b): Continue to step 4 (to check if we can adjust fees).  
     Outcome if No: Continue to step 5 (to check for preference inconsistency).  
     Judgment Required: No. This is about identifying the source of the cost.

  4. **Adjustable Fee Check**  
     Question: "Can the fee structure that causes the net cost in the loop be adjusted (e.g., waive fees for reversals, make the loop costless) without undermining the business model or regulatory requirements?"  
     Sufficient Answer: If yes, then we should adjust the fees to break the loop. If no, then we must consider blocking the feature or adding friction.  
     Outcome if Yes: Hand to human (to design the fee adjustment) and block the feature until adjusted (stop_block).  
     Outcome if No: Continue to step 5 (to see if the customer's preferences are the root cause).  
     Judgment Required: Yes. Business model and regulatory constraints are judgment calls.

  5. **Preference Inconsistency Check**  
     Question: "Is the customer's behavior driven by a genuine inconsistency in their preferences (e.g., cyclical preferences, or time-inconsistent preferences) such that each step in the loop is preferred at the time but leads to a worse outcome?"  
     Sufficient Answer: If yes, then the problem is type (a). If no, then the problem is type (c) (request for insulation) and we should not intervene.  
     Outcome if Yes: Continue to step 6.  
     Outcome if No: Stop and allow the feature to ship (stop_ship) because the issue is the customer's own inconsistency and we are not required to insulate them.  
     Judgment Required: Yes. It requires judgment to determine if the inconsistency is genuine and not due to changing circumstances.

  6. **Harm Assessment**  
     Question: "Is the net cost to the customer in the loop substantial enough to cause financial harm, relative to their portfolio size and the service provided?"  
     Sufficient Answer: If yes, then we have a problem. If no, then the cost is negligible and we can allow the feature.  
     Outcome if Yes: Continue to step 7.  
     Outcome if No: Stop and allow the feature to ship (stop_ship).  
     Judgment Required: Yes. What is "substantial" and "harm" is a judgment call.

  7. **Friction as Solution**  
     Question: "Can adding friction (e.g., a warning, a delay, a confirmation step) break the loop or make it less likely, without undermining the utility of the feature for non-looping customers?"  
     Sufficient Answer: If yes, then we should add friction. If no, then we must consider blocking the feature.  
     Outcome if Yes: Hand to human (to design the friction) and block the feature until fixed (stop_block).  
     Outcome if No: Hand to human (to decide whether the feature is too harmful to ship) (hand_to_human).  
     Judgment Required: Yes. Balancing utility and friction is a judgment call.

  **Cannot Decide On** (the procedure is not entitled to rule on):
  - Whether the customer's inconsistent preferences are rational or should be respected.
  - The business value of the feature versus the potential harm.
  - Regulatory requirements beyond basic compliance (assumed to be handled elsewhere).

  **Misfire Notes** (where the procedure might produce false positives or negatives):
  - False positive: The procedure might flag a feature as exploitable when the net cost is trivial and the customer is aware and willing (e.g., treating it as a hobby).
  - False negative: The procedure might miss a loop that is not indefinite but occurs a few times and still causes harm, or when the commitment device is available but not practical (e.g., buried in settings).

  **Glossary**:
  - **Action Loop**: A sequence of actions that can be repeated and that returns the customer to the starting state with a net cost.
  - **Net Cost**: The total fees, spreads, or other charges the customer incurs in one full cycle of the loop, minus any benefits.
  - **Foreseeable**: A reasonable customer, with the information provided by the platform, can anticipate the loop and its costs.
  - **Commitment Device**: A tool that allows the customer to bind themselves to a future course of action (e.g., a lock that prevents trading for a period).
  - **Preference Inconsistency**: When a customer's choices contradict each other (cyclical) or change over time (time-inconsistent) in a way that leads to worse outcomes.
  - **Friction**: Any element that makes an action harder to perform (e.g., additional steps, delays, warnings).

