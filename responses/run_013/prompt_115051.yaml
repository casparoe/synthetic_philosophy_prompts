answer: |-
  ### Exploitability Audit Procedure (Plain Prose)

  **Preconditions**  
  Before starting, you must know:  
  1. The feature's design (actions allowed, fees, settlement times)  
  2. Observed/anticipated customer behavior pattern (frequency, stated preferences, regrets)  
  3. All fees/spreads charged by our platform  
  4. Any existing commitment devices (locks, delays) and their visibility  

  **Step-by-Step Questions**  
  1. **Loop Identification**  
     *Question:* Can the customer repeat a sequence of actions that returns them to their starting position with net money leaving their account?  
     *Sufficient Answer:* Yes = Continue. No = **Ship** (no loop)  
     *Judgment?* No  

  2. **Foreseeability Check**  
     *Question:* Would a reasonable customer recognize this loop and its costs before starting?  
     *Sufficient Answer:* Yes = Go to Step 3. No = Continue  
     *Judgment?* Yes ("reasonable customer" standard)  

  3. **Commitment Escape**  
     *Question:* Is there an obvious, easily accessible lock that breaks the loop?  
     *Sufficient Answer:* Yes = **Ship** (choice preserved). No = Continue  
     *Judgment?* Yes ("easily accessible" threshold)  

  4. **Cost Origin**  
     *Question:* Is the net loss caused by OUR fees/spreads (not market forces)?  
     *Sufficient Answer:* Yes = Problem Type (b). No = Problem Type (a)  
     *Judgment?* No  

  5. **Preference Diagnosis**  
     *Question:* Does the customer consistently regret the loop AFTER completing it?  
     *Sufficient Answer:* Yes = Problem Type (a). No = **Ship** (Type c - not our job to fix)  
     *Judgment?* Yes (interpreting "regret")  

  6. **Harm Threshold**  
     *Question:* Could this loop plausibly cost >1% of portfolio/year?  
     *Sufficient Answer:* Yes = Continue. No = **Ship** (de minimis)  
     *Judgment?* Yes (plausibility assessment)  

  7. **Frictionless Fuel**  
     *Question:* Does reversibility/free undos make the loop cheaper?  
     *Sufficient Answer:* Yes = Block unless friction added. No = **Human judgment**  
     *Judgment?* No  

  **Outcomes**  
  - **Stop_Ship**: Feature passes audit  
  - **Stop_Block**: Feature fails (requires redesign)  
  - **Hand_To_Human**: Values/risk decision needed  

  **Cannot Decide**  
  - Whether inconsistent preferences are "irrational"  
  - Business tradeoffs between profit and protection  
  - Regulatory gray areas beyond clear violations  

  **Misfire Warnings**  
  - May falsely flag hobbyists (e.g., day-traders enjoying activity)  
  - May miss slow drains (e.g., quarterly loops with small but cumulative harm)  

  **Glossary**  
  - *Loop*: Repeatable action sequence returning to start  
  - *Net loss*: Money out minus money in over full cycle  
  - *Reasonable customer*: Financ literate but not expert  
  - *Commitment device*: Tool to voluntarily restrict future choices  
  - *Problem Type (a)*: Customer's inconsistent preferences  
  - *Problem Type (b)*: Our fee structure enables harm  
  - *Problem Type (c)*: Customer inconsistency with no regret  

  ---

  ### JSON Implementation  
