prompt: |-
  Right, I've been reading about the Fermi paradox again and every time someone gets to the interesting bit they jump straight to a sollution — dark forest, rare earth, zoo hypothesis, we're in a simulation, whatever — and I don't want the sollutions yet. Before I read another one I want to know what I should be demanding of one. So write me the desiderata: what any adequate account of cosmic silence actually has to deliver. The observations it has to fit (we've looked a fair amount and found nothing; no probes, no von Neumann replicators, no obvious engineering of stars or galaxies; Earth hasn't been colonised; we ourselves are noisy and still here). The puzzles it has to dissolve (where the Great Filter sits, why the silence is silent rather than merely sparse, and the observation-selection worry — we have to be careful we're not just the one quiet bit of a loud galaxy). The distinctions it can't collapse (between 'no one is there', 'they're there but undetectable', and 'they're there and choosing to be quiet'; between a reading that's bad news for us and one that's good news; between a filter behind us and one ahead). For each requirement, say what's behind it — the case or consideration that makes it a requirement rather than a nice-to-have. Then flag any pair you suspect can't both be met, because I'm fairly sure there's at least one and that's the part I most want to see. Also tell me which requirements are genuinely non-negotiable and which are just the prejudices of one camp, and which single requirement does the most to rule out the most popular candidates. Don't score the whole field, but if you can say in a couple of lines how the dark forest idea fares against the list, go ahead. British English please, and keep it under 650 words.
reasoning: |-
  Alright, let's tackle this user's query about the Fermi paradox desiderata. They want a clear list of requirements any solution must meet, without jumping to solutions first. 

  First, I need to unpack their core request: they're frustrated that discussions leap to solutions (like Dark Forest or Rare Earth) without establishing what makes a solution adequate. Their ask is methodological—set the criteria first.

  Key observations they mention: absence of detectable tech (probes, megastructures), Earth untouched, humanity's noisy presence without consequences. Puzzles include Great Filter location, why silence is absolute not sparse, and avoiding anthropic bias. Distinctions to maintain: existence vs detectability, intentional silence vs absence, past vs future filters.

  I start structuring desiderata around observations, puzzles, and distinctions. For each, I'll note why it's mandatory (e.g., "no artifacts" is non-negotiable because surveys cover vast scales). The "no colonization" point links to Earth's 4.5bn-year vulnerability—a solid temporal constraint. 

  Puzzles are trickier. The silence/sparse distinction matters because passive leakage (like our radio waves) should exist if civilizations were common. The selection effect ("quiet bit in loud galaxy") is critical—many solutions fail by implying we're special observers.

  Distinctions guard against solution-category errors. Conflating "undetectable" with "absent" invalidates zoo-like hypotheses. Filter-location affects existential risk—must be clear.

  Now tensions: Absolute silence + anthropic bias conflict is unavoidable. If aliens exist, why no passive signatures? Solutions must either deny aliens (Rare Earth) or explain universal stealth (Dark Forest)—but the latter struggles with scale. 

  Non-negotiables: All observational constraints (no artifacts/probes/colonization) are bedrock. Anthropic caution is methodological. The loud/sparse distinction? Less absolute—some argue sparse civs could still leave traces.

  Biggest rule-out: Explaining absolute silence. It sinks passive-expansion models (like Bracewell probes) and "leaky" civilizations. Dark Forest gets partial credit for addressing it via fear, but fails on universal stealth plausibility.

  User's tone is analytical, slightly impatient ("every time someone gets to the interesting bit..."). They're likely well-read but want rigor. Unspoken need: intellectual satisfaction via falsifiable criteria, not just storytelling. 

  British English check: "colonised", "artefacts" sorted. Word count tight—aim for conciseness while covering all angles. 

  Final structure: 
  - Observations (4 points) 
  - Puzzles (3) 
  - Distinctions (3) 
  - Tensions + non-negotiables 
  - Dark Forest footnote

  Done. Kept under 650 by pruning examples.
answer: |-
  Here are the core desiderata for any adequate account of the Fermi Paradox ("cosmic silence"), grounded in observation, logic, and necessary distinctions. British English throughout.

  **I. Observational Constraints (Non-Negotiable):** Any solution *must* account for:
  1.  **Absence of Obvious Artefacts:** No unambiguous detection of interstellar probes, von Neumann replicators, large-scale astroengineering (e.g., Dyson spheres altering stellar spectra), galaxy-spanning signals, or other detectable manifestations of advanced technology, despite significant (though incomplete) searches. *Why?* Searches cover vast volumes and timescales; such artefacts are theoretically detectable across galactic distances if they exist at scale.
  2.  **Absence of Colonisation/Visitation:** Earth shows no evidence of past or present extraterrestrial colonisation, resource exploitation, or visitation, despite being biologically active for billions of years in a >13 billion-year-old galaxy. *Why?* Earth is a prime target; its long habitability provides ample opportunity.
  3.  **Human Existence & Activity:** We exist, are becoming technologically advanced, and are actively transmitting detectable signals (however weak and brief thus far) without (apparent) consequence. *Why?* We are an observed data point: technological life *can* arise, and our current state must be compatible with the silence.

  **II. Core Puzzles to Dissolve (Mandatory):**
  4.  **The Great Filter's Location:** The solution must specify whether the primary barrier(s) preventing detectable galactic civilisations lie predominantly in humanity's *past* (abiogenesis, complex life, intelligence are ultra-rare) or our *future* (advanced tech inevitably leads to self-destruction or undetectability). *Why?* This defines existential risk for humanity.
  5.  **Silence vs. Sparsity:** It must explain why the galaxy appears *silent* (no detectable signatures *at all*), not merely *sparse* (signatures exist but are too rare/infrequent for us to have detected yet). *Why?* If civilisations were moderately common and long-lived, passive leakage or deliberate low-effort beacons should plausibly be detectable by now, even if actively transmitting civilisations are sparse.
  6.  **Observation-Selection Caution:** It must avoid relying on the premise that we are *uniquely* special observers in a galaxy teeming with life. *Why?* While we necessarily observe from a place where life arose, assuming we are the *only* or *first* requires extraordinary evidence; solutions implying we're the sole anomaly in a noisy galaxy are deeply suspect.

  **III. Essential Distinctions to Maintain:**
  7.  **Existence vs. Detectability:** Must clearly differentiate between "no other technological life exists" (Rare Earth), "it exists but is fundamentally undetectable" (e.g., post-biological, Sublime), and "it exists, is detectable in principle, but chooses strict silence" (Dark Forest, Zoo). *Why?* These represent fundamentally different realities with different implications.
  8.  **Intentional Silence vs. Natural Absence/Undetectability:** Must not conflate deliberate hiding (motivated by fear, ethics, policy) with the inherent difficulty of detection across interstellar distances or natural states of being undetectable. *Why?* Motive matters for understanding potential future contact and the nature of intelligence.
  9.  **Past Filter vs. Future Filter:** Must clearly indicate whether the key barrier is behind us (good news) or ahead of us (bad news). *Why?* This is critical for assessing humanity's survival prospects.

  **Tensions & Non-Negotiables:**
  *   **Key Tension:** Points **5 (Silence vs. Sparsity)** and **6 (Observation-Selection Caution)** are in severe tension. Explaining *absolute* silence (**5**) while avoiding the implication we're uniquely special/early (**6**) is extremely difficult. Most solutions satisfying **5** strongly risk violating **6** (e.g., Rare Earth makes us unique, Dark Forest makes us uniquely early/unnoticed, Great Filters ahead imply we're the first to reach this stage). Satisfying both simultaneously is the core challenge.
  *   **Non-Negotiables:** The observational constraints (**1, 2, 3**) are fundamental. **6 (Observation-Selection Caution)** is a critical methodological requirement to avoid anthropic hubris. The distinctions (**7, 8, 9**) are essential for clear reasoning.
  *   **Camp Prejudices:** Insistence that FTL travel *must* be possible/impossible, or that expansion *must* be driven by biological imperatives, often reflect ideological biases rather than hard constraints.
  *   **Most Rule-Out Power:** Point **5 (Silence vs. Sparsity)** does the most damage to popular candidates. It sinks optimistic models where civilisations are common but expansion is slow/peaceful (leakage *should* be detectable) or where Bracewell/von Neumann probes are feasible (they *should* be everywhere by now).

  **Dark Forest Footnote:** Scores well on **5 (Silence)** and **8/9 (Intentional Silence/Future Filter?)** but struggles severely with **6 (Observation-Selection)** – why have *no* civilisations ever slipped up or chosen differently in billions of years? Also challenges **1/2** – would such paranoid civs *never* build large-scale, detectable tech? Its universality requirement is a major weakness.
