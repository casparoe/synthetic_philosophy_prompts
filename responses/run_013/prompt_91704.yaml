prompt: |-
  You are a monetary economist and historian of economic thought with close knowledge of George Berkeley's The Querist (first published 1735) and of the modern literature on complementary currencies, currency boards, and the monetization of debt. Think carefully before answering: in particular, consider more than one way of translating Berkeley's account of money into operational tests, and choose the one that survives contact with a real institution rather than the one that sounds best in a seminar. Begin your answer with its bottom line in a single sentence, then give the reasoning. No preamble, no restating my question.

  I work in the research unit of a small central bank. Our board keeps receiving proposals for monetary reform — usually from outside economists, sometimes from politicians, occasionally from a well-funded enthusiast. They arrive as one-page pitches: back the currency fully with gold; replace notes with a purely digital token; let a depressed province issue its own local currency; index the unit to a basket of commodities; create a state credit bank that lends at zero. We have roughly two weeks per proposal and no authority to change the law. Our job is to tell the board whether a proposal deserves serious study, and to say which parts of it are technical questions and which are political ones. I want a procedure, not a verdict on any single proposal.

  Berkeley's position, as I read him, runs roughly like this. Wealth is not bullion but the produce of land and labour. Money is useful only insofar as it stirs up industry and lets people share in one another's labour. The true idea of money is that of a ticket or counter, so its metallic content is incidental, and the denominations could in principle be retained even if the bullion were gone. What matters is circulation, so a small quantity of money moving quickly can do the work of a larger quantity moving slowly. And the creation of new wants, the framing of fashion and taste, and the extension of credit all belong to the same system as coin. Treat this as a working doctrine, not as a slogan.

  Please produce the following.

  1. A decision procedure we can run on any proposal, in ordered steps: the questions to ask in order, what counts as a sufficient answer to each, which answers stop the procedure with a no, and which questions must be handed to the board as matters of value rather than of fact. It should be runnable in two weeks by two people with graduate training in economics but no specialism in monetary history. It should state what evidence each step requires and how much of that evidence we could realistically obtain.

  2. An explicit account of which parts of Berkeley's doctrine you had to drop, bend, or simplify to make the procedure usable, and why — including any point at which the procedure will misfire or can be gamed by a clever proposer.

  3. Two worked applications. First, a proposal to back the currency fully with gold. Second, a proposal to let a depressed province issue a local complementary currency redeemable in national currency at a fixed rate. At least one of the two must come out in a way I will not like; say plainly which one and why.

  4. A short list of the questions the procedure cannot settle, with a note on what kind of person or body should settle them.

  Do not cite literature or give me a reading list; I need the procedure itself, written so that a colleague who has never read Berkeley could apply it.
reasoning: |-
  Hmm, the user is asking for a decision procedure based on George Berkeley's monetary philosophy, specifically for evaluating monetary reform proposals in a small central bank context. They want a practical tool that can be applied by economists without specialized historical knowledge, with clear steps and real-world constraints.

  First I need to distill Berkeley's core principles from The Querist: his view of money as social technology rather than commodity, the importance of velocity over quantity, and money's role in activating labor. But I must acknowledge upfront where these philosophical ideals will clash with operational reality.

  The key challenge is translating "stirring up industry" into measurable criteria. I'll need to create proxy tests focusing on transactional efficiency and activity levels, while recognizing these can't capture Berkeley's full moral vision of shared labor. His rejection of bullion fetishism suggests gold standard proposals should fail early, but I must build that into the steps objectively.

  For the procedure structure, I'm considering a funnel approach: start with legal feasibility (their immutable constraint), then move to operational viability before assessing Berkeley-aligned effects. Each step needs clear pass/fail thresholds and evidence requirements calibrated to their 2-week timeline - no time for complex econometrics.

  I'll have to simplify Berkeley significantly: reducing his ethical framework to circulation metrics, ignoring his credit-as-fashion ideas entirely (too nebulous for assessment), and accepting that some wealth-transfer effects will be unmeasurable. The procedure will inevitably favor proposals with predictable velocity impacts over radical social experiments.

  For the test cases: The gold standard proposal should fail on multiple grounds - it violates Berkeley's ticket theory, reduces velocity flexibility, and faces operational absurdities like the "golden goose problem." The local currency case is trickier; it might pass Berkeley's circulation test but fail on legal grounds or create problematic arbitrage. I'll make this the "unliked" outcome by showing how it could pass procedural checks while creating real headaches.

  Finally, I'll explicitly note where value judgments begin: any proposal requiring wealth redistribution or fundamental sovereignty questions must go to the board. The procedure's blind spots will include long-term incentive effects and political capture risks - precisely where Berkeley's moral concerns would resurface.
answer: |-
  **Bottom line:** Reject any proposal that demonstrably impairs short-term transactional efficiency or monetary neutrality while accepting that Berkeley's deeper goals of industry activation remain unmeasurable proxies.

  **1. Decision Procedure**  
  *Run sequentially; stop if any step fails. Require proposer to supply evidence where noted.*

  **Step 1: Legal Feasibility Check**  
  *Question:* Does this proposal require changes to the Central Bank Act, Banking Regulation, or Constitutional provisions governing money?  
  *Evidence:* Central Bank legal team assessment (obtain in 3 days).  
  *Sufficient Answer:* "No changes required" OR "Changes limited to [specific minor regulations]."  
  *Stop if:* Requires primary legislation or core mandate change.  
  *Hand to Board if:* Proposal exploits legal gray areas requiring policy interpretation.

  **Step 2: Settlement Finality Test**  
  *Question:* Will this system guarantee immediate, irreversible settlement of all denominated transactions during stress?  
  *Evidence:* Proposer's documented mechanism; historical precedents for similar designs (focus on failure cases).  
  *Sufficient Answer:* Clear settlement chain with no optionality (e.g., no "may redeem" clauses).  
  *Stop if:* Introduces settlement lag >1 hour, conditional redemption, or counterparty discretion.  
  *Value Judgment:* None – operational fact.

  **Step 3: Velocity Impact Assessment**  
  *Question:* Compared to status quo, does empirical evidence suggest this will *likely* increase velocity (V) of M1 within 12 months?  
  *Evidence:* Proposer's pilot data or comparable case studies (e.g., local currencies); transaction cost analysis. Avoid theoretical models.  
  *Sufficient Answer:* Neutral or positive V impact demonstrated in comparable economies.  
  *Stop if:* Evidence shows V decrease (e.g., gold hoarding, complex redemption hurdles).  
  *Value Judgment:* Accept "neutral" V if other steps pass; Berkeley’s ideal isn’t enforceable.

  **Step 4: Neutrality Stress Test**  
  *Question:* Does the design create predictable, systematic wealth transfers between groups *independent* of inflation?  
  *Evidence:* Distributional analysis of entry/exit rules (e.g., who gets new money first); redemption tax equivalents.  
  *Sufficient Answer:* Transfers <0.5% GDP/year and random across sectors.  
  *Stop if:* Transfers ><｜place▁holder▁no▁795｜> to specific sectors (e.g., miners under gold standard).  
  *Hand to Board if:* Transfers are *intended* policy effect (e.g., regional stimulus).

  **Step 5: Arbitrage Vulnerability Scan**  
  *Question:* Can agents extract riskless profit by exploiting mismatches between this system and broader markets?  
  *Evidence:* Proposer’s mitigation plan for (a) FX parallels, (b) commodity links, (c) cross-border flows.  
  *Sufficient Answer:* No passive arbitrage paths exist (active speculation is acceptable).  
  *Stop if:* Design enables cash-and-carry arbitrage (e.g., fixed-rate local currency vs. fluctuating demand).

  ---

  **2. Berkeley Adaptations**  
  - **Dropped:** "Money as social credit." Procedure ignores whether money fosters community trust; focuses on transactional mechanics.  
  - **Bent:** "Stirring up industry." Reduced to velocity metrics, ignoring whether labor is productive or exploitative.  
  - **Simplified:** "Denominations independent of bullion." Tested via Settlement Finality, not philosophical validity.  
  - **Misfires:** Proposals with strong long-term industry effects but neutral/short-term V (e.g., slow education credits) fail Step 3.  
  - **Gaming:** Proposer can rig pilot data (Step 3) or hide transfer effects (Step 4) if due diligence is shallow.

  ---

  **3. Worked Applications**  
  **Proposal A: Full Gold Backing**  
  - Step 1: *Fail.* Requires law change to remove fiat status. (Legal team confirms.)  
  - **VERDICT: REJECT (immediate stop).**  

  **Proposal B: Depressed Province Local Currency (1:1 redeemable)**  
  - Step 1: *Pass.* Local promissory notes may fall under existing private money rules.  
  - Step 2: *Fail.* Redemption requires solvent provincial authority; during bank run, settlement not guaranteed.  
  - **VERDICT: REJECT.**  
  - *Why you’ll dislike this:* A modified proposal (e.g., central bank custody of redemption fund) might pass Steps 1-2 but fail Step 5: Arbitrageurs would short provincial currency during downturns, draining reserves. Berkeley’s "circulation" fails when redeemability invites extraction.

  ---

  **4. Unsettleable Questions**  
  - **"What is money for?"** (Berkeley’s moral purpose). Requires political/philosophical judgment → Parliament.  
  - **Optimal scale of state credit.** Vulnerability to corruption → Independent anti-fraud agency.  
  - **Long-term industry effects.** Unobservable in 2 weeks → Academic research, not central bank.  
  - **Fairness of hidden transfers.** Democratic legitimacy → Elected representatives.
