  The key differentiator seems to be the *malleability* of the reference class. In established concepts like the self-indication assumption, the class is fixed (e.g. all observers). Here, authors opportunistically shift classes mid-argument: from "civilizations" to "observers" to "early entities" as needed. That fluidity deserves separate attention.

  For boundary cases: the Drake Equation isn't inherently fallacious - it explicitly lists parameters. The problem arises when those parameters get filled via arguments that smuggled in reference class assumptions. Similarly, pure Bayesian updates (like Gott's delta-t argument) aren't the issue unless they implicitly assume our typicality in a questionable class.

