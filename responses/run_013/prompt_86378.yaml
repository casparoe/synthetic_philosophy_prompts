  For naming: "reference class opportunism" captures the selective framing aspect, while "mutable class fallacy" highlights the illegitimate shifting. I lean toward the latter - it emphasizes the procedural flaw rather than the domain. Definition must specify three elements: 1) inference depends on treating us as random sample, 2) the class isn't justified but chosen post-hoc, 3) class boundaries shift to favor conclusion.

