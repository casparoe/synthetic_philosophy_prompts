  I recall that in Jain philosophy, anekantavada is paired with nayavada, the theory of standpoints. Nayavada classifies perspectives by their scope and validity. Some nayas are partial but valid within their context, while others might be erroneous if they overextend. So not all views are equal; some are more comprehensive or less harmful. Ahimsa could be seen as a principle that's so foundational that violating it leads to more error and harm, making it a higher-order truth.

  The user's mistake might be conflating epistemological pluralism with moral relativism. Anekantavada deals with understanding reality's complexity, not with ethical norms. So while multiple perspectives exist, ethics like ahimsa are derived from the fundamental nature of the soul (jiva) and the avoidance of harm (himsa) as inherently binding. That's consistent because ethical absolutes can exist within a framework that acknowledges multiple facets of reality.

