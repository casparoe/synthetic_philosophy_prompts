answer: |-
  ### Brainstorm: Core Functions of Catuskoti & Emptiness  
  1. **Logical**: Systematically rejects all possible ontological positions (A, ¬A, A∧¬A, ¬(A∨¬A)) to exhaust conceptual extremes.  
  2. **Dialectical**: Dynamically dismantles opponents’ views by revealing their inherent contradictions (*prasaṅga*).  
  3. **Therapeutic**: Induces epistemic humility, undoing attachment to views (*dṛṣṭi*) as a path to liberation.  
  **Emptiness (Śūnyatā)**: Not an assertion of "nothingness," but the *lack of intrinsic existence* (svabhāva) in all phenomena. It’s the insight that entities are dependently arisen (pratītyasamutpāda), hence empty of independent reality.  

  ---

  ### Direct Comparison: Emptiness vs. the Tetralemma  
  **Is emptiness a "fifth corner"?** No—it’s the *dissolution* of corners. The tetralemma is a tool to deconstruct all substantive claims, including any reification of emptiness itself. Nāgārjuna’s denial of holding a thesis (*Mūlamadhyamakakārikā* 13.8, 27.30) means:  
  - **Emptiness is not a position** but the *exposure of incoherence* in all positions.  
  - To assert "all is empty" as a positive claim would trap emptiness in the tetralemma (e.g., "Is emptiness empty?" → "Yes, inherently empty things don’t exist; no, conventional dependents aren’t non-existent").  

  **Which is more fundamental?**  
  - **Emptiness** is the *ontological insight*.  
  - **Tetralemma** is the *methodological engine* to realize it.  
  **Can they be separated?** Only at the cost of distortion:  
  - Tetralemma without emptiness → sterile logic-chopping.  
  - Emptiness without tetralemma → risks becoming a dogmatic "voidism."  

  ---

  ### Testing Against the Two Truths (Saṃvṛti/Satya)  
  1. **Tetralemma’s level**:  
     - Operates **ultimately** to dismantle metaphysical claims.  
     - But *applies* conventionally to refute erroneous views (e.g., debating eternalism/annihilationism).  
  2. **Emptiness’s level**:  
     - **Not an ultimate truth** (which would reify it).  
     - **Not mere convention** (which obscures dependent arising).  
     - *It is the pivot between truths*: the realization that conventions are empty *is* ultimate insight (*MMK* 24.18).  

  ---

  ### Verdict: Is the Tetralemma "Mere Rhetoric"?  
  **No—it is rigorous logic with soteriological intent.** Reasons:  
  1. **Logical content**: It formalizes the exhaustion of *logical space* for svabhāva-based positions. Just as modern logic admits "undefined" values (e.g., paraconsistent logics), the tetralemma rejects bivalence for phenomena lacking intrinsic identity.  
  2. **Therapeutic necessity**: Rhetoric persuades; the tetralemma *unsettles*. Its recursive negation targets the root of suffering: reification (*MMK* 22.11*).  
  3. **Dialectical precision**: Nāgārjuna’s method mirrors *reductio ad absurdum* but extends it to *all* quadrants of assertion, exposing the limits of language itself.  

  **Why your friend errs**: Reducing it to rhetoric assumes logic must affirm positive content. But Madhyamaka’s genius is showing that *negation of incoherence* is itself liberative—not as a conclusion, but as the collapse of questions that presuppose svabhāva. The tetralemma is the scalpel; emptiness is the healed wound.  

  > *"The victorious ones have said that emptiness is the relinquishing of all views. For whomever emptiness is a view, that one has accomplished nothing."* — *MMK* 13.8
