  Assume the role of a philosopher at home in both formal logic and the Madhyamaka tradition, and think carefully before answering. I have just finished a long argument with a friend and I want a considered treatment, not a textbook summary. Start with a short brainstorm: list the main things Nāgārjuna's four-cornered negation (the catuskoti) might be doing — logical, dialectical, therapeutic — and say what the doctrine of emptiness (śūnyatā) is meant to assert.

  Then compare the two directly. Is emptiness itself the sort of claim the tetralemma would have to treat as a further corner, or is the fourfold negation built precisely to prevent anyone from stating emptiness as a position — and what follows if Nāgārjuna denies holding any thesis at all? Which of the two is more fundamental to his project, and can they be pulled apart without loss?

  Finally, test the comparison against the distinction between conventional and ultimate truth: at which level does the tetralemma do its work, and does emptiness belong to the conventional or the ultimate? My friend's claim was that the tetralemma is mere rhetoric with no logical content; give me your own verdict on that, with reasons.
