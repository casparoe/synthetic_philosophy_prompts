  I should start with a brainstorm of what the catuskoti might be doing. Logically, it seems to reject all possible positions about reality - existence, non-existence, both, neither. Dialectically, it appears to dismantle fixed views by showing their contradictions. Therapeutically, it might aim to free the mind from conceptual clinging. As for emptiness (śūnyatā), it asserts that nothing has inherent existence - everything is interdependent and empty of independent nature.

