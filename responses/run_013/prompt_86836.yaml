  I've been weirdly obsessed with that two-dot colour phi thing ever since I spent half an hour looping a gif of it — you know, red dot here, green dot there, and you'd swear you saw it turn green halfway across — and now I cant shake the feeling that my own experience is lying to me about when things happened. You're a philosopher of mind who also writes poetry, so please think carefully and brainstorm abit before you draft. Can you write me a villanelle about it? The two refrains should be the two ways of cashing out what's going on: one where the colour change was edited into the experience itself before you ever had it, so you never actually saw the red dot move alone (the Stalinesque option), and one where you really did see the red dot move and then your memory got rewritten afterwards (the Orwellian option). The form should do the work — the refrains taking turns and finally meeting in the last two lines should make it feel like the two options keep passing each other and can't be told apart from the inside. Keep it accurate enough that someone who knows the debate won't wince, but don't mention any papers, authors, or citations. British English please, 19 lines, proper villanelle, and show me the final poem only after you've revised it once.
