  Right, first I need to nail the technical execution: two refrains ("The eye is duped before it sees the light" for Stalinesque and "The mind rewrites what happened in plain sight" for Orwellian), five tercets and a quatrain. The challenge is making the fluid motion of the dot feel visceral while keeping the neuroscience accurate. 

  *scribbles draft lines* The "ghost of green" image might work for the illusory color... and "crimson track" for the path of the first dot. Need to avoid mentioning Dennett or specific papers as requested. 

  *revises* The final quatrain is crucial - the refrains must merge seamlessly to show the theories are experientially identical. "The eye is duped.../The mind rewrites..." in quick succession should create that effect. British spellings: "colour", "grey" etc. 

  *checks* Yes, 19 lines, iambic pentameter holds, refrains alternate properly. The philosophical accuracy is maintained: Stalinesque = perception fabricated in advance, Orwellian = memory edited after. The user's unease about "lying" perception comes through in "doubt bleeds grey" and "haunts the gap". 

  This should satisfy both their poetic craving and that nagging philosophical itch about the illusion. The form does indeed make the theories "pass each other" like the dots themselves.
