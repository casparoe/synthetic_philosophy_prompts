  ## Colour Phi Villanelle

  A crimson track begins its steady flight,
  Then green appears where motion should reside.
  **The eye is duped before it sees the light;**

  No true transition crosses conscious sight,
  A phantom shift the senses must provide.
  A crimson track begins its steady flight,

  And where the leap should blur the edges bright,
  A ghost of green emerges, undenied.
  **The mind rewrites what happened in plain sight.**

  That fleeting red, did it ignite the night
  Alone, a truth experience would hide?
  A crimson track begins its steady flight,

  But colour shifts mid-path, a baffling sleight.
  Which tyrant governs where perceptions bide?
  **The eye is duped before it sees the light;**
  **The mind rewrites what happened in plain sight.**

  Did vision stitch the change in secret, deep,
  Before the conscious moment took its keep?
  Or did the red complete its journey's arc,
  Then memory erase its fading spark?
  Doubt bleeds the scene; the watching brain is stark,
  A crimson track begins its steady flight,
  **The eye is duped before it sees the light,**
  **The mind rewrites what happened in plain sight.**

