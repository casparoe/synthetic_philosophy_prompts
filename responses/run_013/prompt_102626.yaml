answer: |-
  Here is the five-item proposal structure:

  1.  **Core Question:** Does the easy-knowledge objection to bootstrapping arguments for perceptual reliability survive when we explicitly distinguish between *actual track-record reliability* (based solely on past performance) and *counterfactual robustness reliability* (stability across relevant possible conditions), and if so, does the surviving objection uniquely threaten reliabilism or also dogmatism?
  2.  **Gap & Distinction:** Existing positions (bootstrapper defenses and reliabilist/dogmatist critiques) treat perceptual reliability monolithically, overlooking how bootstrapping arguments tacitly conflate track-record claims (vulnerable to easy-knowledge worries) with counterfactual robustness claims (less vulnerable); this distinction is novel as it cuts across the internalism/externalism divide, focusing on the *structure* of the reliability claim itself rather than the justification's accessibility.
  3.  **Method & Cases:** I will analyze pivotal thought experiments driving the debate (e.g., bootstrapping about a car's gas gauge or the color of objects under red lights) using conceptual tools from modal epistemology and reliabilist theory to isolate the distinct roles played by actual track-record and counterfactual robustness claims within these arguments, prioritizing deep case analysis over broad literature survey to test the distinction's argumentative force directly.
  4.  **Success & Failure:** Success entails demonstrating that the distinction either dissolves the core easy-knowledge worry for some views (showing why seemingly ad hoc replies work) or precisely locates a residue problem in a way that differentially impacts reliabilism vs. dogmatism; failure occurs if the distinction proves irrelevant to the debate, collapses into a trivial restatement, or fails to generate novel insights.
  5.  **Scope & Contingency:** The nine-month scope focuses primarily on analyzing the distinction's impact on reliabilism and the bootstrapping argument itself; if the core distinction proves untenable early on, the project shifts to explaining why the conflation of reliability types is unavoidable or inconsequential, abandoning comparisons to dogmatism.
