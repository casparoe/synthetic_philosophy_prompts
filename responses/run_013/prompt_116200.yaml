prompt: |-
  A friend ran a silly contest on his blog a while back and its been nagging me ever since. You could submit as many entries as you liked, the pot was a fixed amount, and at the end one entry got drawn and whoever sent it took the pot divided by the total number of entries. So the more entries people send, the less the prize is worth, and I can't fix that by holding back. What got me is that the usual advice — work out what everyone else will probably do, then pick your best reply to it — tells me to send about as many entries as everybody else put together, which is exactly the move that wrecks it for the lot of us. But if I ask a different question, "what should I send if everyone in my position sends the same thing?", the answer is plainly one, and that outcome is better for every single person than the one we actually got. I keep bumping into the same shape elsewhere: two people who know each other well, stuck in a one-shot version of "if we both keep quiet we both come out ahead", where the textbook says sell the other one out and the "we'd both reason the same way" answer says don't. And the friend I argue about this with says the second question is just wishful thinking wearing a symmetry costume.

  So: is there a name for this — for the reasoning rule, or for the family of situations where it bites? I dont just want the label though, I want the edges. How is it different from ordinary cooperation that's propped up by the threat of a next time, from a coordination problem with two equally good answers, and from just doing my bit for the group? And when is the "everyone in my position does the same thing" premise actually allowed — does it need the others to be in genuinely identical situations, same information and same preferences as me, and what happens when they're only nearly identical, or when I suspect they'll reason differently than I do? Also tell me which parts of this are settled and which are live disagreements among people who study it, rather than handing me one camp's line as if it were the consensus.
reasoning: |-
  Okay, let me tackle this user's query. They're describing a contest where submitting more entries dilutes the prize, leading to a collective action problem. The usual game theory advice says to match others' submissions, but that leads to a bad outcome. Symmetry reasoning suggests submitting just one entry, which is better for everyone. The user wants to know the name for this and its boundaries.

  First, I need to identify the core concepts. The contest example is a classic tragedy of the commons or public goods problem. Each individual's incentive to submit more entries ruins the shared resource (the prize pot). The symmetry approach here is Kantian optimization, where everyone acting the same leads to a better outcome. 

  The user also mentions the one-shot prisoner's dilemma. The textbook Nash equilibrium is to defect, but symmetry suggests cooperating if both reason the same way. The friend calls this wishful thinking. So, the user is questioning when symmetry reasoning is valid.

  Next, I should differentiate this from related concepts. Cooperation in repeated games relies on punishment, which isn't possible here. Coordination problems have multiple equilibria, but here the Nash is bad. Contributing for the group's sake is altruism, whereas symmetry is strategic under identical reasoning.

  The user asks about when symmetry applies. It's strict when players are identical in payoffs and information. If there's asymmetry, it gets messy. Also, if players might reason differently (like some being rational egoists), Kantian optimization fails. 

  I recall that Kantian optimization isn't mainstream in economics. The debate between Nash and Kantian approaches is ongoing. Some see it as a solution to collective action problems, others as unrealistic. The user wants to know settled areas vs. debates. Economists mostly stick with Nash, but Kantian has gained traction in certain contexts like mechanism design.

  The user's deeper need might be understanding why cooperative solutions fail in real life despite seeming logical. They might be frustrated with standard game theory's predictions and seek alternatives that justify cooperation. Highlighting the philosophical divide between descriptive (Nash) and normative (Kantian) approaches would address this. Also, discussing edge cases where symmetry breaks down can help them apply the concept practically.
answer: |-
  This is a beautifully articulated description of a fundamental tension in strategic reasoning, touching on collective action problems, equilibrium concepts, and the ethics/pragmatics of cooperation. Here's a breakdown:

  1.  **The Name(s):**
      *   **The Core Problem:** This is a classic **Tragedy of the Commons** (or a **Common Pool Resource** problem applied to a contest prize) or a **Negative Externality** problem. Your individual action (submitting entries) imposes a cost (diluting the prize) on others.
      *   **The "Usual Advice":** This is finding the **Nash Equilibrium**. You analyze what others are likely to do (their strategies) and choose your *best response* to that, assuming they play their best responses to everyone else. In the contest, the symmetric Nash Equilibrium (where everyone submits the same number `n*` > 1) is typically inefficient (bad for everyone).
      *   **The "Different Question":** This is often called **Kantian Optimization**, **Team Reasoning**, or reasoning from the **Golden Rule perspective** (in a strategic sense). You ask: "What if *everyone* adopted the same strategy I'm considering? Which strategy, if universally adopted, would lead to the best outcome *for me* (or for everyone)?" In the contest, the answer is clearly `n=1`.

  2.  **The "Edges" - Distinguishing Features:**
      *   **vs. Cooperation Propped Up by Repeated Interaction:**
          *   **Key Difference:** The *threat of future punishment* sustains cooperation in repeated games (e.g., Prisoner's Dilemma). Here, the contest is typically **one-shot** or has no mechanism for punishment. Cooperation in the Tragedy of the Commons *cannot* be sustained by the threat of future retaliation in a single interaction. Kantian reasoning offers a *rationale for cooperation in the absence of repeated interaction or external enforcement*.
      *   **vs. Coordination Problem:**
          *   **Key Difference:** Coordination problems (like driving on the left/right) have **multiple Nash Equilibria** (e.g., all-left, all-right), often equally good (Pareto efficient). The problem here has a **single, dominant Nash Equilibrium that is Pareto inefficient** (everyone would be better off at `n=1`, but `n=n* > 1` is the stable outcome under individual best-response reasoning). The challenge isn't coordinating *which* good equilibrium to pick, but *escaping* a bad equilibrium.
      *   **vs. Altruism/Doing My Bit:**
          *   **Key Difference:** Altruism involves valuing others' welfare directly. Doing your bit might stem from duty or social norms. Kantian optimization is **strategic self-interest under a symmetry constraint**. You aren't sacrificing for others; you're choosing the rule that, *if followed by all* (including you), maximizes *your own* payoff. The outcome is mutually beneficial, but the *motive* is self-interested reasoning under universalization.

  3.  **When is the "Everyone Does the Same" Premise Allowed? The Crux:**
      *   **The Ideal Case (Strict Symmetry):** Kantian reasoning is most compelling when players are **genuinely identical**:
          *   **Identical Payoffs/Preferences:** Everyone values the prize and the cost of entries the same way. Utility functions are symmetric.
          *   **Identical Information:** Everyone knows the rules, the prize pot, the number of players, and crucially, *that everyone else is identical and reasoning the same way*.
          *   **Identical Reasoning Capacity:** Everyone can perform the same Kantian calculation.
          *   **Common Knowledge of Symmetry:** Everyone knows everyone else is identical, knows they know, and so on. In this case, `n=1` is both the Kantian optimum and the only sensible focal point.
      *   **Near Symmetry:**
          *   **Small Differences:** If differences are small and players believe others are sufficiently similar and likely to reason similarly, Kantian reasoning might still hold approximately. However, the Nash logic starts to creep in – if you suspect others might submit slightly more, you might be tempted to submit slightly more yourself.
          *   **Perceived Differences:** If you *believe* others have different valuations or costs (even if they don't), you might deviate. (e.g., "They might be desperate for the prize, so they'll submit more, so I should too").
      *   **Suspicion of Different Reasoning:**
          *   **The Core Weakness:** This is where the friend's critique ("wishful thinking in a symmetry costume") bites hardest. If you suspect others are **rational egoists** who *will* play Nash (best-responding to whatever they think others do), then:
              *   *Deviating alone* from the Nash strategy (`n*`) while others play `n*` makes you *worse off* (you submit fewer entries but the prize is still diluted).
              *   *Playing Kantian* (`n=1`) while others play Nash (`n*`) is disastrous for you (you get a tiny slice).
          *   **The Kantian Ploy Only Works If Everyone Does It:** Kantian optimization requires **common reason** – not just symmetry of position, but symmetry of *reasoning process*. If you doubt others will reason Kantianly, playing Kantian becomes risky or irrational from a purely self-interested perspective. The Nash strategy (`n*`) becomes a "safer" bet – you won't win big, but you won't lose catastrophically if others over-submit.

  4.  **Settled vs. Live Disagreements:**

      *   **Settled (Mostly):**
          *   The *description* of the Nash Equilibrium outcome in Tragedy of the Commons/Public Good games is robust and widely accepted. It accurately predicts over-consumption/dilution in many real-world scenarios without enforcement.
          *   The *existence* of a Pareto improvement over the Nash Equilibrium (like everyone playing `n=1` in the contest) is uncontroversial in these symmetric settings.
          *   The *mathematical* definitions and properties of Nash Equilibrium are settled.

      *   **Live Disagreements & Active Research:**
          *   **The Behavioral Reality of Kantian Reasoning:** Do people *actually* reason this way in experiments? Evidence is mixed. Some studies show cooperation exceeding Nash predictions in one-shot games, suggesting Kantian-like reasoning or social preferences. Others show rapid convergence to Nash. The conditions under which Kantian reasoning emerges are hotly studied.
          *   **Normative vs. Positive:** Is Kantian reasoning a *prescription* for how people *should* act to achieve better outcomes, or a *description* of how they *do* act? Most economists see Nash as descriptive/predictive. Philosophers and some behavioral economists argue Kantian reasoning can be a rational norm.
          *   **Incorporating Kantian Reasoning into Theory:** How can it be formally modeled alongside standard game theory? Concepts like "Team Reasoning" (Bacharach, Sugden) and "Kantian Equilibrium" (Roemer, Varoufakis) are attempts, but they are less universally adopted than Nash. There's debate about whether they are truly distinct foundations or just incorporating social preferences/other-regard into utility functions.
          *   **The "We'd Both Reason the Same Way" Escape Hatch:** This is highly contentious. Critics argue it's circular or relies on an implausible degree of coordination on reasoning methods without explicit communication. Proponents argue it's the only rational way to avoid Pareto-dominated outcomes in symmetric one-shot dilemmas. The Prisoner's Dilemma debate epitomizes this.
          *   **Mechanism Design:** Can institutions/rules be designed to make the Kantian outcome *incentive-compatible* (i.e., a Nash Equilibrium)? Research on this is active (e.g., certain types of voting mechanisms, commitment devices).

  **In Summary:**

  You've perfectly described the tension between **Nash Equilibrium** (the outcome of individual best-response logic) and **Kantian Optimization** (the outcome of universalized strategy choice) in symmetric **Tragedy of the Commons**/**Public Good** problems.

  *   **Nash** (`n*` entries each) is the stable but bad outcome predicted by standard "best reply" reasoning. It bites when individual actions impose negative externalities on the group.
  *   **Kantian** (`n=1` each) is the mutually beneficial outcome achievable only if everyone reasons symmetrically and commits to the rule.
  *   **The Edge:** Kantian reasoning relies critically on **strict symmetry and common knowledge of identical reasoning**. It breaks down if players are different, lack this knowledge, or, crucially, **suspect others will reason Nash-like instead**. This suspicion creates the self-fulfilling logic driving the Nash outcome. Your friend's critique highlights this vulnerability.
  *   **The Debate:** While the Nash prediction is the workhorse of economics, the validity and applicability of Kantian/Team Reasoning as a *descriptive* or *normative* alternative in symmetric one-shot dilemmas remains a live and fascinating area of research and philosophical argument, far from settled. The contest and the Prisoner's Dilemma are paradigmatic examples of this deep tension in rational choice.
