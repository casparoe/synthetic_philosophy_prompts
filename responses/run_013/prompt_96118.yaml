  I'm building a little bot for a card game — it scores every legal move and plays the top one, and because I didn't want it dithering on ties I gave it a rule: if the two best scores are within epsilon of each other, take whichever one hashes lower from the game-state string, so it's deterministic and reproducible. A friend in my lab told me I'd just reinvented Buridan's ass, that Buridan showed a rational agent facing two equal options can't act at all and starves, and that every such agent therefore needs an irrational tie-breaker bolted on — mine is the hash. It sounded sharp so I nodded, but the more I think about it the less I buy that the donkey tells us anything about rationality. If two options are genuinely, exactly equalley good, isn't picking either of them definetly already rational, with nothing left to fix? And if they're only equal as far as the bot can tell, is that even the same situation, or is that just plain uncertainty wearing a costume? I also have a nagging feeling the donkey isn't actually in Buridan and the thing started life as a man stuck between a meal and a drink, but that's beside the point. What I want to know is whether the tie-breaker is really the rational answer to that case, or whether I'm patching a hole that only exists because of the way my friend told the story — and if it's the latter, what should I actually write in the comment block so I don't say something dumb about a donkey.
