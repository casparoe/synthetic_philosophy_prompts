  ### Principle in One Sentence  
  "We maximize total impact while respecting Valley's spending limit, which is reduced due to their external gift, and allocate the rest to Wrenfield."  

  ### Marcus's Case and Response  
  **Marcus's Strongest Case:**  
  (a) Kalai-Smorodinsky sacrifices total impact (118.7 vs. 120 points without the gift) for fairness, and (b) it’s too abstract to explain clearly to applicants.  
