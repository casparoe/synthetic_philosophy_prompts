prompt: |-
  OK so this is going to sound like a random question, but I've been chewing on it for a few weeks and I can't let it go. I recently got roped onto the safety committee at work (I work at a mid-size bakery, so "safety committee" is a fancy name for three of us arguing about the dough mixer), and we had an incident where a guy got hurt because a guard wasn't refitted after maintenance. In the write-up, half the committee wanted to say the injury was *caused* by whoever skipped the refit, and the other half said no, the cause was the machine, and the skipped step was just... nothing, an absence, you can't point to it. And I realized I've had this exact fight before, at home, about whether my brother "caused" our dad's fall by not calling an ambulance sooner -- everyone had strong feelings and nobody could state the actual rule. What stuck with me is that the same kind of not-doing gets treated completely differently depending on stuff nobody says out loud. If the harm is already rolling -- the machine's already going to hurt him, the stroke's already happening -- then failing to step in feels like a cause. But if the good was never going to happen unless somebody acted, then failing to act feels like nothing at all, like you can't cause a thing that wasn't already on its way. And on top of that, whether the not-doing even counts seems to hinge on whether the person was supposed to be doing it: a stranger walks past, a lifeguard walks past, very different stories, even though neither of them moved.

  So what I want to know is whether there's a name for this, and whether it's one name or three. I have a feeling the general area is called something like "causing things by not doing them," and that philosophers have definately fought about whether that's even possible -- but what I'm after is narrower: the split between not-stopping-a-harm and not-producing-a-good, and the way a background expectation of action seems to decide which side of that line you land on. Is there an established term for that asymmetry, or for the way the expectation seems to do the work? If the nearest thing is the debate over whether absences can be causes, or something half-remembered like "double prevention," then tell me exactly where my pattern matches and where it doesn't, because I don't think it's quite any of them -- the bit I can't place is that the expectation seems to be doing *causal* work and not just *blame* work, and I can't tell if that's a real distinction or if I'm just confusing "caused it" with "is to blame for it."

  If nothing fits, coin me something and tell me what it covers and what it doesn't. The edges matter more to me than the label -- I want to know what the thing is, what it isn't, and which nearby idea is the closest miss, because right now every time this comes up I end up waving my hands at "well, it depends."
reasoning: |-
  Okay, the user has presented a really interesting philosophical and practical dilemma about causation, specifically regarding omissions—when not doing something leads to harm. They work at a bakery and had a safety incident where a guard wasn't refitted after maintenance, leading to an injury. Half the committee blames the person who skipped the step, while the other half says the machine caused it. The user also relates this to a personal situation where their brother didn't call an ambulance sooner when their dad had a stroke, and people argued whether that inaction caused the fall or worsening condition.

  The user is noticing a pattern: when harm is already in motion (like the machine running without a guard or the stroke happening), failing to intervene feels like a cause. But if a positive outcome required action that wasn't taken (like someone not donating to prevent a disease), the absence isn't seen as a cause. Plus, expectations matter—whether the person had a duty to act, like a lifeguard versus a stranger walking past a drowning person.

  They want to know if there's a name for this asymmetry. They suspect it's related to philosophical debates about whether absences can be causes, or concepts like double prevention, but they feel it's not quite the same. They're particularly stuck on how expectations seem to play a causal role, not just assign blame. They want clarity on the boundaries: what this concept includes and excludes, and if nothing fits, they'd like a coined term with defined edges.

  First, I need to unpack the user's core observations. They've identified three key elements:  

  1. **The Harm/Good Asymmetry**: Not stopping an ongoing harm vs. not producing a benefit.  
  2. **The Role of Expectations**: Whether someone was supposed to act (duty/role) changes how we view their inaction.  
  3. **Causal vs. Blame Distinction**: The user senses expectations might be doing causal work, not just moral work.  

  The philosophical landscape here includes:  
  - **Omissions as Causes**: A major debate. Some philosophers (like David Lewis) argue absences can't be causes because causation requires events/processes, while others (like Schaffer) defend their causal relevance.  
  - **Normative Expectations**: How duties (moral, legal, contractual) frame omissions. This is often discussed in ethics (e.g., negative vs. positive duties) but bleeds into causation.  
  - **Double Prevention**: When an omission stops something that would have prevented harm (e.g., not fixing brakes causes a crash). This is closer to "not-stopping-harm" but doesn't cover the "not-producing-good" side.  

  The user's asymmetry isn't cleanly named in philosophy. The harm/good divide echoes the **Acts vs. Omissions Doctrine** in ethics (it's worse to harm than to fail to help), but that's about blame, not causation. The role of expectations is captured in **Role-Relative Causation** (causation depends on duties), but it's not a standard term.  

  For the closest existing concepts:  
  - **Negative Causation**: Sometimes used for omissions causing harm, but it's debated and doesn't cover the asymmetry.  
  - **Causation by Omission**: General term, but it lumps both sides together.  
  - **Normative Causation**: Not a thing, but useful to describe how norms *shape* causal attribution.  

  The user's insight about expectations feeling "causal" is astute. In causal modeling (e.g., structural equations), we often set variables based on norms (e.g., "expected intervention"). So while expectations aren't physical causes, they define the baseline for what counts as a deviation.  

  Coining a term: **Duty-Weighted Causal Asymmetry**.  
  - **Covers**:  
    - The harm/good split: failing to stop harm vs. failing to create good.  
    - How duties make omissions "visible" as causes.  
    - Why the lifeguard's inaction is causal but a stranger's isn't.  
  - **Excludes**:  
    - Cases without normative expectations (e.g., a random person not donating).  
    - Pure physical causation (e.g., a rock breaking a window).  
  - **Closest Miss**:  
    - **Double Prevention**: Only covers part of "not-stopping-harm."  
    - **Acts/Omissions Doctrine**: Moral, not causal.  

  The user's confusion between causation and blame is common. Expectations bridge both: duties make an omission a *candidate* for causation, which then feeds into blame. But we can separate them: a lifeguard's inaction *causes* drowning (by the duty-weighted view) and also makes them *blameworthy*.  

  Key distinctions:  
  - **Physical Process**: The machine's operation caused injury; the stroke caused damage.  
  - **Omission as Cause**: Only when normative expectations exist (e.g., the technician *should* have refitted the guard).  
  - **Not-Producing-Good**: Rarely causal without duties (e.g., no one expects you to cure cancer).  

  This framework helps in the bakery case:  
  - Harm was ongoing (machine active).  
  - Technician had duty to refit guard.  
  - Thus, omission caused injury.  

  For the dad's fall:  
  - Stroke was ongoing harm.  
  - Brother had familial duty to act.  
  - Omission (not calling sooner) caused worse outcome.  

  But if a stranger didn't call, we might not say they *caused* it, though it's still tragic.  

  The user needs this for practical resolution (safety reports) and personal clarity. Naming it helps, but the boundaries matter more. "Duty-Weighted Causal Asymmetry" captures the core while admitting it's a lens, not a physical law.
answer: |-
  Your question isn't random at all—it cuts straight to a thorny philosophical and legal debate about causation, responsibility, and the role of "absences" or omissions. You've identified a nuanced pattern with three interlocking parts: (1) the asymmetry between **not-stopping-harm** (which feels causal) and **not-producing-good** (which often doesn't), (2) the **critical role of normative expectations** (duties, roles, or "supposed to" factors), and (3) the tension between *causal* attribution ("X caused Y") and *moral/legal* blame ("X is responsible for Y"). 

  **The Short Answer:**  
  There's no single established term for this *exact* asymmetry, but the core concept is **causation by omission**, filtered through **normative expectations**. The asymmetry you describe arises from how we define "deviations from the norm"—and whether the norm includes an *expected action*. I'll break it down step by step, give you the closest terminology, highlight where it fits and where it diverges, and coin a precise term for your pattern.

  ---

  ### 1. **The Philosophical Foundation: Can "Nothing" Cause Something?**
     - **Causation by Omission**: This is the broad debate over whether failing to act ("omitting") can be a cause. Philosophers like **David Lewis** argue absences *can't* be causes because causation requires physical processes (e.g., the machine's gears caused injury, not the "absence" of a guard). Others (e.g., **Jonathan Schaffer**) argue omissions *are* causes in contexts where norms or expectations define a "default" action.
     - **Your Pattern's Fit**:  
       - ✅ **Not-stopping-harm** aligns with cases where omission is accepted as causal (e.g., *not braking* causes a crash).  
       - ❌ **Not-producing-good** usually isn't seen as causal (e.g., *not donating* to a charity isn't the "cause" of starvation).  
       - 🔶 **The twist**: Both involve omissions, but the harm/good asymmetry makes them *feel* different. This is where expectations kick in.

  ---

  ### 2. **The Asymmetry: Why "Not-Stopping-Harm" Feels Causal, But "Not-Producing-Good" Doesn't**
     - **The Key Insight**: Harm has **momentum**. If harm is already unfolding (e.g., the unguarded machine is running, the stroke is progressing), omission *allows* it to complete its trajectory. In contrast, "good" rarely has inherent momentum—it typically requires active intervention.  
     - **Established Concepts**:  
       - **Negative vs. Positive Duties**: In ethics, *negative duties* (don't harm) are stricter than *positive duties* (help others). Failing a negative duty (e.g., not refitting a guard) feels causal; failing a positive duty (e.g., not calling an ambulance) feels like a moral failure but not always a "cause."  
       - **Preemption vs. Production**: "Not-stopping-harm" is like **double prevention** (omission removes a barrier to harm), which *is* often causal. "Not-producing-good" lacks this structure.  
     - **Your Examples**:  
       - 🏭 *Bakery Incident*: The harm (machine injury) was imminent. Not refitting the guard allowed it to unfold—this omission "completes" the causal chain.  
       - 👨‍⚕️ *Dad's Fall*: The stroke was progressing. Not calling sooner allowed worse harm—it feels causal because the harm was in motion.  
       - ❓ *Counterfactual Test*: Ask, "Would the harm have occurred *but for* the omission?" If yes (e.g., "but for not refitting the guard, no injury"), it feels causal. For "not-producing-good," the answer is often "no" (e.g., "but for not donating, would the disease exist? Yes—it was already there").

  ---

  ### 3. **The Role of Expectations: The Hidden Engine**
     This is your deepest insight: **Expectations don't just assign blame—they define what counts as a "cause" in the first place**.  
     - **Normative Expectations** (duties, roles, contracts) create a **baseline of required action**. When someone fails that baseline, their omission becomes a "deviation" we can point to.  
       - ✅ *Lifeguard vs. Stranger*: Both omit saving a drowning person. The lifeguard's omission is causal (they *should* have acted); the stranger's is not (no duty exists).  
       - ✅ *Bakery Technician*: Their role *required* refitting the guard. The omission is a "cause" because it breached an expected norm.  
     - **Why It Feels Causal, Not Just Blamable**:  
       - Expectations shift the **default scenario**. For the lifeguard, the "default" is saving the swimmer; omitting this *changes the outcome*. For a stranger, the "default" is non-intervention, so omitting nothing doesn't change anything.  
       - In causal modeling (e.g., **structural equations**), norms define variables: "Expected action X" is part of the system. Omitting X becomes a cause when X was *supposed* to happen.

  ---

  ### 4. **The Closest Existing Terms & Where They Fall Short**
     | Term                | Fits Your Pattern?                         | Where It Misses                          |
     |---------------------|--------------------------------------------|------------------------------------------|
     | **Causation by Omission** | ✅ Broad umbrella. | ❌ Doesn't capture the harm/good asymmetry or the expectation-dependence. |
     | **Negative Causation** | ✅ Sometimes used for omissions causing harm. | ❌ Rarely addresses "not-producing-good," and ignores normative roles. |
     | **Double Prevention** | ✅ Close for "not-stopping-harm" (e.g., not refitting guard "prevents prevention"). | ❌ Doesn't cover "not-producing-good" or expectations (e.g., lifeguard). |
     | **Moral Luck**      | ❌ About blame for unintended consequences. | ✅ Not relevant—your focus is causation, not blame. |
     | **Acts/Omissions Doctrine** (Ethics) | ✅ Explains blame asymmetry (harming > not helping). | ❌ Purely moral, not causal. Doesn't explain *why* omissions feel causal in harm cases. |

  ---

  ### 5. **Coining a Term: "Duty-Weighted Causal Asymmetry"**
     Since no term perfectly fits, I propose this to describe **your specific pattern**:  
     - **What It Means**:  
       > *The phenomenon where an omission is attributed as a cause of harm only if:*  
       > (a) *Harm was already in progress or imminent,*  
       > (b) *The agent had a normative duty (role, contract, expectation) to intervene,*  
       > *and where omissions that fail to produce a "good" are rarely seen as causal, even with a duty.*  
       
     - **What It Covers**:  
       - Your bakery incident (duty + ongoing harm → omission = cause).  
       - Your dad’s fall (familial duty + progressing stroke → omission = cause).  
       - Lifeguard vs. stranger (duty defines if omission is causal).  
       - *Not-producing-good* asymmetry (e.g., not donating to prevent disease isn't causal, even if you're a billionaire).  
     
     - **What It Excludes**:  
       - Cases without **ongoing/imminent harm** (e.g., not fixing a guard *before* maintenance isn't causal until harm is active).  
       - Cases without **normative expectations** (e.g., a random person not calling 911 isn't a "cause" of death).  
       - **Direct actions** (e.g., purposely removing a guard *is* clearly causal).  
       - **"Pure" good production** (e.g., failing to invent a cure isn't the "cause" of disease).  

     - **Closest Miss**: **Double Prevention** (it captures the mechanics of "not-stopping-harm" but ignores duties and the good/harm asymmetry).

  ---

  ### 6. **Causation vs. Blame: Untangling Your Final Question**
     You’re right to sense a distinction:  
     - **Causation**: "Did this omission *contribute* to the outcome?"  
     - **Blame**: "Should this person be *held responsible*?"  
     
     Expectations bridge both but aren't identical:  
     - In **causal attribution**, expectations define the *baseline* (e.g., "a technician *would have* refitted the guard"). The omission becomes a "but-for" cause.  
     - In **blame attribution**, expectations define *accountability* (e.g., "the technician *should have* refitted the guard").  
     
     Crucially, causation is necessary but not sufficient for blame (e.g., a stranger *causes* nothing by omitting, so no blame). But in duty-bound cases (lifeguard, technician), the omission is **both causal and blameworthy**. The asymmetry ensures that "not-producing-good" (e.g., not donating) might be blameworthy if you had a duty (e.g., as a parent), but rarely "causal."

  ---

  ### Why This Matters for Your Safety Committee
     - **Practical Resolution**: In the bakery case, the injury was **caused by the omission** (not refitting the guard) *because*:  
       (1) Harm was imminent (machine was operational),  
       (2) The technician had a duty to act.  
       → This isn't "blaming"—it's causal analysis. Framing it this way avoids "it depends" hand-waving.  
     - **Avoiding Pitfalls**: If your committee argues "the machine caused it," they miss that machines don’t self-disassemble—*people* create risks via action *or* omission. Duties make omissions visible.  

  Your pattern reveals how deeply human norms shape our view of causality. When harm looms, we treat omissions as causes; when good is possible, we treat omissions as neutral absences—and duties decide who’s "on the hook." If you dive deeper, look into **Schaffer on Omissions** or **Hart & Honoré's Causation in the Law**. But for now, "duty-weighted causal asymmetry" should give you the precision you need.
