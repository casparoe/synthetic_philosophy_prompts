prompt: |-
  So I'm a backend engineer, never took a single philosophy class, and somehow I've ended up as the person who runs our team's fortnightly lunch-and-learn. Next one I want to do on this thing I keep half-remembering called the reference class problem, because it keeps biting us at work and nobody on the team can agree on anything.

  The thing that keeps happening: we've got an alerting pipeline with a little model that scores each incoming alert with a probability that it's a real incident versus a flake. And the number it spits out is completely hostage to what you count as the pool of "similar past alerts" — all alerts ever, alerts from this one service, alerts from this one rule, alerts on this shift, alerts somebody actually bothered to look at. Pick a different pool, get a wildly different number, and everyone quietly picks the pool that gives them the answer they already wanted. Same fight happens over whether a deploy is risky, or whether a given on-call page "should" have been caught earlier. And the bit that really messes with me: someone always says "just use the empirical frequency from our own logs," but we decide what gets logged in the first place, so it feels like we're choosing the reference class by choosing the logging config.

  Don't explain the reference class problem to me — I've read the wiki page twice and it still won't stick. What I want is a plan for how to teach it to my team in about 25 minutes, mostly me talking over a few slides. The audience is smart engineers, all Bayes-fluent, zero philosophy, and they get impatient fast. So: what has to be in place before the whole thing clicks, in what order, and why does each piece depend on the one before it? What's the one example that should carry the whole talk — I was going to use the alerting thing, but tell me if that's a bad carrier, what it would need to have or lack to be the right one, and what I should use instead if so. Which wrong ideas will they form, in the order they'll form them (my guess is "the right reference class is just whatever your data has the most of" and "this is just the base rate fallacy with extra steps"), and exactly where in the sequence I should head each one off. Also give me one question to ask at the end that'll tell me whether the idea actually landed or whether I just made them nod, and tell me what I should openly say I'm not going to get into at this level instead of bluffing it.
reasoning: |-
  We are going to design a 25-minute talk for engineers about the reference class problem, using the alerting pipeline as the main example. The audience is Bayes-fluent, impatient, and has no philosophy background.

  Key goals:
  1. Make the problem concrete and relatable (using the alerting example).
  2. Show why it's a problem (different reference classes lead to different probabilities, and the choice is arbitrary but consequential).
  3. Preempt common misunderstandings.
  4. End with a diagnostic question and set boundaries.

  Structure (with timing):

  1. (2 min) **Hook: The Problem We All Recognize**
     - Start with the alerting scenario: "We have a model that scores alerts with a probability of being real. But we notice that if we change the pool of 'similar past alerts', the probability changes dramatically. And worse, people choose the pool that gives the number they want."
     - Show two examples: 
          - Using all alerts ever: P(real) = 5%
          - Using alerts from this specific service: P(real) = 30%
     - Ask: "Which one is right? And why do we even have to choose?"

  2. (3 min) **Bayesian Refresher (Very Quick)**
     - Remind them of Bayes: P(A|B) = [P(B|A) * P(A)] / P(B)
     - In our case: A = "alert is real", B = features of the alert and context.
     - But note: the prior P(A) is often estimated from historical data. And that's where the reference class comes in.

  3. (5 min) **The Core: What is the Reference Class?**
     - Define: A reference class is a group of past cases that we consider similar to the current case, from which we compute the base rate (prior).
     - In our alerting system, what counts as a similar case?
          - All alerts? Alerts from this service? Alerts with the same rule? Alerts in the last 30 days? Alerts that were looked at by a human?
     - Show with a simple example (using made-up numbers) how the base rate changes with the reference class.

  4. (5 min) **Why It's a Problem: Arbitrariness and Manipulation**
     - There's no objective way to choose the "right" reference class. It's a judgment call.
     - But the choice has big consequences for the probability we get.
     - And because of that, people can (consciously or not) choose the reference class that gives the answer they want (confirmation bias).
     - Example: 
          - If you want to argue that a deploy is safe, you might choose a reference class of all deploys (which have a low failure rate). 
          - If you want to argue it's risky, you choose a reference class of deploys that made similar changes (which might have a higher failure rate).

  5. (5 min) **Common Misconceptions and How to Head Them Off**
     - **Misconception 1: "Just use the largest dataset"** 
          - Why it's wrong: The largest dataset (e.g., all alerts) might be too broad and include irrelevant cases, diluting the base rate. 
          - Head off: When introducing the reference class, explicitly ask: "Is bigger always better? What if the broad class includes many cases that aren't really similar?"
     - **Misconception 2: "This is just the base rate fallacy"**
          - Base rate fallacy is when you ignore the base rate entirely. Here, we are using a base rate, but the problem is *which* base rate to use.
          - Head off: Contrast with base rate fallacy. Show that even when we try to use the base rate, we face the reference class problem.
     - **Misconception 3: "We can solve it with more data (or better features)"**
          - Why it's wrong: Even with more data, you still have to define the class. And if you use features to define similarity, then you have the problem of which features to use (which is the same problem in disguise).
          - Head off: Point out that the logging config itself defines the reference class (by deciding what to log and how to categorize). So more data doesn't escape the problem; it just moves it.

  6. (3 min) **The One Example to Rule Them All: The Alerting Pipeline**
     - We stick with the alerting example because:
          - It's real and they know it.
          - It has multiple plausible reference classes (all, by service, by rule, by time, by human attention).
          - It shows the problem of circularity: we decide what to log, which affects the reference class, which affects the probability.
     - Walk through one alert and show how the probability changes with different reference classes. Then, show how the logging config (what we choose to record) can bias the whole thing.

  7. (2 min) **Wrap-up and the Big Picture**
     - The reference class problem is unavoidable when using historical data to estimate probabilities for unique events. It's not just our alerting system; it happens in risk assessment, medicine, etc.
     - We can't solve it, but we can manage it by:
          - Being explicit about which reference class we choose and why.
          - Acknowledging the uncertainty and the range of possible base rates.
          - Avoiding the temptation to choose based on desired outcomes.

  8. **The Diagnostic Question (to ask at the end):**
     - "Imagine we have a new alert that we've never seen before. We want to estimate the probability it's real. What reference class would you use and why? What are the trade-offs of that choice compared to others?"
     - Why: It forces them to articulate the problem and the trade-offs. If they can give a reasoned answer (even if not perfect) that shows they get it.

  9. **What We're Not Covering (to set boundaries):**
     - "We're not going to solve this today. This is a deep problem in probability and decision theory that doesn't have a clean technical fix. Also, we won't dive into the philosophical debates about probability (like frequentist vs. Bayesian) because we don't have time. We're focusing on the practical implications for our work."

  Slides:
    - Slide 1: Title + hook (the alerting problem)
    - Slide 2: Bayes' theorem (refresher)
    - Slide 3: Defining reference class with examples (alerting)
    - Slide 4: How the probability changes with the reference class (with numbers)
    - Slide 5: The arbitrariness and the manipulation risk
    - Slide 6: Addressing misconceptions (with clear bullets)
    - Slide 7: The alerting example in depth (with a table of probabilities for different classes)
    - Slide 8: Takeaways and managing the problem
    - Slide 9: The diagnostic question and boundaries

  Why this order:
    - Start with a concrete problem they know (hook).
    - Then, the Bayes refresher sets the foundation (they need to see where the prior comes in).
    - Introduce the reference class as the key input for the prior.
    - Show the problem (arbitrariness) and then the consequences (manipulation).
    - Preempt wrong ideas right after explaining the problem, so they don't solidify.
    - Go deep on the example to make it tangible.
    - End with the big picture and a call for awareness.

  The alerting example is a good carrier because:
    - It's from their work.
    - It has multiple dimensions (service, rule, time, etc.) so you can show how the choice matters.
    - It illustrates the circularity (logging config affects the reference class).

  But to make it even better:
    - Use real (or realistic) numbers from your system if possible.
    - Make it visual: a table or bar chart showing the same alert scored with different reference classes.

  If you don't have real numbers, make up a scenario:
    - Alert: "Database connection timeout" for Service X.
    - Reference class 1 (all alerts): 5000 alerts, 5% real → P(real)=0.05
    - Reference class 2 (Service X alerts): 200 alerts, 30% real → P(real)=0.30
    - Reference class 3 (Alerts on Tuesday nights): 100 alerts, 50% real → P(real)=0.50
    - Reference class 4 (Alerts with the same rule): 300 alerts, 10% real → P(real)=0.10

  Then ask: which one should we use? And why?

  This example clearly shows the variation and the problem.

  Final note: Keep it moving. 25 minutes is tight. Practice to hit the timings.
answer: |-
  Here's a battle-tested plan for your 25-minute talk, optimized for impatient Bayes-fluent engineers. The goal is **practical awareness**, not philosophical mastery.

  ---

  ### **Talk Structure & Logic Flow**  
  *(Total: 25 min)*  

  1. **Hook: The Pain We All Feel** (3 min)  
     - Start with your alerting pipeline example:  
       *"We score alerts as P(real) – but when Bob uses ‘all alerts’, he gets 5%. When Alice uses ‘alerts from Service X’, she gets 40%. Both are ‘empirical frequencies’. Who’s right?"*  
     - Show real consequences:  
       - Deploy risk debates: "Is this a ‘Java service deploy’ (safe) or ‘auth-service deploy’ (risky)?"  
       - Alert fatigue: "Why did we ignore this P(real)=30% alert? Because we used the wrong history?"  
     - **Why this works:** Engineers immediately recognize the political fights and wasted time.  

  2. **Core Mechanics: Where Probabilities Come From** (5 min)  
     - Quick Bayesian refresh (1 slide):  
       ```
       P(real | features) ∝ P(features | real) × P(real)  
       └── Your model ─┘         └──────── Prior (base rate) ─────────┘
       ```  
     - Reveal the hidden lever: **`P(real)` = "Fraction of real incidents in reference class"**.  
     - Define reference class: *"The pool of past cases we call ‘similar’ to compute this base rate."*  
     - **Critical insight:** Hammer that `P(real)` **is not a universal constant**. It’s `count(real) / N` in a specific bucket.  

  3. **The Trap: Why Your Reference Class Choice Matters** (7 min)  
     - Use your alerting example to show 4 reference classes and their outcomes:  
       | Reference Class          | P(real) | Who prefers it?          |  
       |--------------------------|---------|--------------------------|  
       | All alerts ever          | 5%      | Team wanting to ignore   |  
       | Alerts from *this* rule  | 40%     | Team wanting to investigate |  
       | Alerts reviewed by humans| 20%     | "Balanced" advocates     |  
       | Alerts on night shift    | 60%     | Ops team lobbying for coverage |  
     - **Key visual:** A single alert with 4 wildly different probabilities side-by-side.  
     - Emphasize: **All use empirical data. None are "wrong".**  

  4. **Why This Isn’t Base Rate Fallacy (And Worse)** (3 min)  
     - Preempt the misconception: *"This feels like base rate fallacy – but it’s the opposite."*  
       - Base rate fallacy: *Ignoring* the base rate.  
       - Reference class problem: *Weaponizing* the base rate by choosing the class.  
     - **Analogy:**  
       *“Base rate fallacy is forgetting to bring a map. Reference class problem is everyone bringing different maps and arguing which one is ‘correct’.”*  

  5. **The Root Problem: Circularity of Data** (4 min)  
     - Drop the bomb: *"We built the buckets ourselves."*  
       - Logging configs define what’s recorded → shapes reference classes → changes probabilities.  
     - Example:  
       - If you only log alerts human-reviewed, your "all alerts" class is biased toward noisier systems.  
     - **Engineer translation:** *"Garbage in, gospel out."*  

  6. **How to Navigate This (Without Solving It)** (2 min)  
     - Practical mitigations:  
       1. **Explicitly document** the reference class used in calculations.  
       2. **Show sensitivity**: Report probabilities across 2–3 reasonable classes (e.g., "P(real) = 40% (rule) or 15% (all)").  
       3. **Decouple measurement from action**: "Even if P(real)=40%, does it meet our threshold to wake someone up?"  
     - **Boundary statement:** *"We won’t solve philosophy today. We’re making our subjectivity explicit to reduce bullshit."*  

  7. **Diagnostic Question to Test Understanding** (1 min)  
     - **Ask:** *"We’re debating P(risky) for a database schema change. What reference classes might Dev vs. Ops propose? Why would both be ‘right’ with their own data?"*  
     - **Why it works:** Forces them to identify conflicting valid choices (e.g., Dev: "all schema changes", Ops: "schema changes to payment systems"). If they articulate the tension, the idea landed.  

  ---

  ### **Why Your Alerting Example Works Best**  
  - **It’s perfect** because:  
    - Relatable (they live this).  
    - Has **multiple defensible reference classes** (unlike medical examples like "P(survival | cancer)").  
    - Exposes **circularity** (logging defines classes).  
  - **Missing piece to add:** Show how logging gaps create self-fulfilling prophecies (e.g., if noisy alerts are muted, they’re excluded from data → future P(real) looks artificially high).  

  ---

  ### **Crushing Misconceptions in Real Time**  
  They’ll form these wrong ideas → shut them down here:  

  1. **Misconception:** *"Just use the largest reference class (most data)."*  
     - **When it arises:** During mechanics (step 2).  
     - **Shut down:** Show your table – largest class (all alerts) is least relevant. Say: *"More data ≠ better data. Would you compute P(rain) using global history or Seattle history?"*  

  2. **Misconception:** *"This is base rate fallacy in disguise."*  
     - **When it arises:** After showing probability variations (step 3).  
     - **Shut down:** Use the analogy above (step 4). Contrast: *"Base rate fallacy is ignorance. This is motivated reasoning."*  

  3. **Misconception:** *"Better features will fix this."*  
     - **When it arises:** During root problem (step 5).  
     - **Shut down:** *"Better features help P(features | real), but the prior P(real) still depends on your reference class. Features don’t define similarity."*  

  ---

  ### **What to Explicitly Exclude (No Bluffing)**  
  - *"We won’t resolve how to choose the ‘right’ class (that’s unsolved)."*  
  - *"We won’t debate Bayesian vs. frequentist (this breaks both)."*  
  - *"We’re ignoring model stacking (today is about human decisions, not math)."*  

  ---

  ### **Delivery Tips**  
  - **Slides:** 6 max. Use tables/visuals, not text.  
  - **Pacing:** Spend 70% on examples (steps 1–3), 30% on principles.  
  - **Tone:** "This sucks, and we all do it. Now let’s be less wrong."  

  This frames the problem as a **systems design flaw** (not probability theory) – which engineers will respect. Good luck!
