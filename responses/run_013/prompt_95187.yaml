prompt: |-
  ok, here's my situation. I run the study-abroad office at a mid-sized university — about 140 students a year, 18 destinations, and every one of them comes back or emails me from abroad with some version of the same question: do I actually have to do this? Do I have to tip 20% when the service was mediocre and the whole arrangement seems gross? Do I have to stand in a line nobody else is standing in? Do I have to wait at a red light at 1am on an empty street when everyone else just walks? Is it rude to eat on the train? One student who kept refusing to tip got into a shouting match with a server, another got pulled up by her host university for something that's completely unremarkable here, and one cheerfully paid a small extra fee to jump a queue at a public office and I still don't know what I think about that.

  What I want is a one-page procedure I can put in the pre-departure handbook, that students will actually read on their phones. Something they can run in about two minutes in the moment, that tells them: follow it, don't follow it, or this is a judgment call and here's who to ask. It has to be honest about which steps are just my opinion dressed up as a procedure.

  I'm not a philosopher but I've been reading around, and here's the pile of distinctions I've got, in my own words. Tell me which ones survive contact with the actual philosophy, which are junk or secretly the same as each other, and what single thing I'm missing.

  - Some local practices are pure coordination: everyone does X because everyone expects everyone else to do X, and it could just as easily have been Y. Which side of the escalator, which door, whether you line up or crowd.
  - Some are coordination, but the thing being coordinated is a scarce good, so the practice is doing fairness work — who gets the taxi, who's next.
  - Some happen to be the local way of doing something you'd owe anyway: not sticking someone with a cost you created, not humiliating the person serving you.
  - Some are backed only by the fact that people will be annoyed if you don't. I keep wanting to say annoyance isn't a harm, but I'm not sure it's nothing either.
  - Some are actively bad — they encode a hierarchy, or make you the one funding something unjust, or require you to treat someone as beneath you. I assume the answer there is no, but I want the procedure to get there for the right reason rather than because I find it icky.
  - A colleague gave me a regularity/norm distinction I like: sometimes everyone does X but nobody would care if you didn't, and sometimes nobody does X but everyone would care if you did. Those feel like completely different situations and my current draft treats them the same.
  - She also says the convention people actually follow and the convention people expect *you* to follow come apart all the time in tourist-facing settings, because the service sector enforces things the locals themselves don't bother with. That one I don't know what to do with.

  Two things I need the procedure to be honest about and can't work out how to state:

  1. Whether being a visitor changes anything at all. My instinct is visitors get less latitude, not more — you're taking the benefits of a scheme you didn't help build, so not doing your bit looks like free-riding. A colleague says the exact opposite: you never agreed to any of it, so you can't be bound by it. Both of us sound right and I don't think we are.
  2. Legality. Our general counsel wants a line in the handbook saying follow local law. I think that line is both too strong and too weak — there are unwritten conventions that matter far more than laws nobody enforces, and the fact that something is illegal doesn't by itself settle whether a student should do it. But I am not writing anything that tells a 20-year-old to break the law in a country where I can't help them. I need the procedure to keep those two things seperate and to send the student to the on-site coordinator the moment they pull apart, instead of inviting them to decide for themselves.

  What I need from you, in this order:

  Bottom line (~120 words): the paragraph I can paste straight into the handbook email.

  Your distinctions, sorted (~300 words): which of my bullets is real, which is junk or just another bullet in disguise, and the one thing that's missing.

  The procedure (~700 words): numbered steps in the order a student should run them, what counts as a good enough answer at each step, the points where the answer is simply no, and the points where it stops and hands off to a human. Keep it to something a jetlagged 20-year-old can execute.

  The two-minute card (~120 words): the same thing as a bullet list they can screenshot.

  Three runs (~600 words): run the procedure step by step on (a) tipping at a US sit-down restaurant where the server's pay depends on it and the service was mediocre, (b) crossing on a red light at night in a city where everybody does it and nothing's coming, and (c) paying a little extra to jump a queue at a public office. I want to see it give at least one answer I won't like, and I want you to say so out loud when it does.

  Where this misfires (~250 words): the steps that are really me making a value call and pretending it's a procedure, the cases the procedure can't settle, and what I should be telling the coordinators.

  What I still have to decide (~80 words).

  Don't give me reading lists or citations, I won't chase them down — just tell me what the distinctions are and where my version of them goes wrong.
reasoning: |-
  Hmm, the user runs a study-abroad office and is dealing with students constantly questioning local norms abroad - tipping, queueing, jaywalking, etc. They want a practical one-page flowchart-style procedure for students to use in the moment, not philosophical theory.  

  First, I need to unpack their existing framework. They've identified several categories: pure coordination norms (like escalator sides), fairness-based coordination (like taxi queues), obligation-fulfilling practices (like covering costs), annoyance-backed expectations, and harmful customs. Their colleague added useful distinctions between regularities vs enforced norms, and tourist-facing double standards. The core tensions are: does being a visitor increase obligation (anti-free-rider) or decrease it (no consent)? And how to handle legality vs actual social weight.  

  The user's explicit needs are clear: they want a handbook paragraph, sorted distinctions, a step-by-step procedure, a quick reference card, three concrete examples, and limitations. But reading between lines, they're also wrestling with:  
  - How to avoid cultural imperialism while acknowledging some practices *are* harmful  
  - How to prevent students from rationalizing selfish behavior ("it's just a convention!")  
  - The liability fear behind "don't break laws" vs reality that some laws are dead letters  

  For the procedure, I'll prioritize safety and social integration. Key filters should be:  
  1. **Harm check** (stop if it hurts someone)  
  2. **Legality** (with nuance - report unenforced laws to coordinator)  
  3. **Social bindingness** (using their regularity/norm distinction)  
  4. **Fairness/free-riding risk** (their scarce goods point)  
  5. **Visitor status** (lean toward their "anti-free-rider" instinct)  

  The examples will show friction:  
  - Tipping in US: mandatory due to wage structure (harm if skipped)  
  - Jaywalking empty street: technically illegal but low-stakes regularity (proceed if locals do)  
  - Queue-jumping: fails fairness test (don't do)  

  I'll flag where I disagree - e.g., the procedure will say "don't queue-jump" even if students might argue "it's efficient!" because it violates anti-free-riding. The handbook caveat must emphasize that harmful norms get special handling via coordinators.  

  Biggest gap in their framework? They're missing **power dynamics** - e.g., tipping isn't just annoyance but survival for workers. Adding "vulnerability" as a filter covers that. Also clarifying that "annoyance" *is* harm when it triggers exclusion.  

  Final note: The "judgment call" exit ramp to coordinators is crucial. This can't be fully automated - some calls need local eyes.
answer: |-
  Here’s your toolkit, distilled from ethical pragmatism (not pure philosophy):

  ---

  ### **Bottom Line (Handbook Paragraph)**  
  When abroad, follow local conventions unless they cause harm, exploit others, or violate laws. Use this 4-step test in uncertain situations: (1) Could this physically/psychologically hurt someone? (2) Is it illegal? (3) Would it unfairly disadvantage locals? (4) Is it expected of visitors? If steps 1-2 say "stop," don’t do it. If unsure after step 4, ask your on-site coordinator. **Never break local laws.** When norms and laws conflict, contact your coordinator immediately. You’re a guest—prioritize respect over personal preference.

  ---

  ### **Your Distinctions, Sorted**  
  **Keep:**  
  - **Pure coordination** (e.g., escalator side): Real. Low-stakes; follow to avoid chaos.  
  - **Scarce-resource coordination** (e.g., taxi queues): Real subset of fairness. Don’t free-ride.  
  - **Obligation-fulfilling** (e.g., covering costs): Valid. Asks if the act fulfills a universal duty (like fairness).  
  - **Annoyance-backed**: Real. Annoyance *is* social harm—it can exclude or marginalize you/others.  
  - **Harmful norms** (e.g., hierarchy): Critical filter. Overrides all except immediate safety.  
  - **Regularity (X happens) vs. Norm (X expected)**: Vital. Observe what locals *enforce*, not just what they do.  

  **Merge/Junk:**  
  - "Tourist vs. local expectations" isn’t a standalone category—fold into step 4 (expectations of visitors).  
  - "Locals don’t follow but expect you to" is covered by the regularity/norm distinction.  

  **Missing:**  
  **Vulnerability**: Does the norm protect someone at risk? (e.g., tipped workers relying on wages). This upgrades annoyance to harm.  

  ---

  ### **The Procedure (4 Steps)**  
  **Execute in order—stop if any step says "NO."**  

  1. **HARM CHECK**  
     - *Ask:* "Could this physically hurt someone, humiliate them, or support exploitation (e.g., racism, sexism)?"  
     - **YES → STOP.** Do not comply. (e.g., ritual that degrades a group).  
     - **NO → Proceed to Step 2.**  

  2. **LEGALITY CHECK**  
     - *Ask:* "Is this illegal here?"  
     - **YES → STOP.** Do not break laws. Contact coordinator if conflicted.  
     - **NO or UNSURE → Proceed to Step 3.**  

  3. **FAIRNESS CHECK**  
     - *Ask:* "Does this help allocate scarce things (taxis, services) fairly? Would skipping it disadvantage locals?"  
     - **YES → DO IT.** (e.g., queueing).  
     - **NO → Proceed to Step 4.**  

  4. **VISITOR EXPECTATIONS CHECK**  
     - *Ask:* "Do locals *expect* visitors to do this? (Watch: Do they correct tourists? Do signs target foreigners?)"  
     - **YES → DO IT.** (e.g., tipping in the US).  
     - **NO → Your call.** (e.g., eating on trains in some countries).  
     - **UNSURE → ASK COORDINATOR.**  

  ---

  ### **Two-Minute Card (Screenshot This)**  
  ✅ **STOP IF:**  
  - It harms/exploits people  
  - It’s illegal  
  ➡️ **DO IT IF:**  
  - It’s fair (e.g., queues for scarce things)  
  - Locals expect visitors to comply  
  ➡️ **YOUR CALL IF:**  
  - Purely habitual (e.g., escalator side)  
  ➡️ **ASK COORDINATOR IF:**  
  - Unsure after step 4  
  - Law and norm conflict  

  ---

  ### **Three Runs**  
  **(a) Tipping 20% with mediocre service (US)**  
  1. **Harm?** Yes—server relies on tips for wages. Skipping tips exploits vulnerability. → **STOP (but meaning: YOU MUST TIP).** *(I know you dislike this answer, but the harm filter overrides service quality—underpaid workers are vulnerable.)*  
  **(b) Crossing red light at 1am (empty street, locals do it)**  
  1. Harm? No (empty).  
  2. Illegal? Yes (jaywalking). → **STOP.** Law is clear. *(Even if unenforced, you can’t advise breaking it.)*  
  **(c) Paying to jump public-office queue**  
  1. Harm? Maybe—normalizes bribery.  
  2. Illegal? Often yes (bribery). → **STOP.**  
  3. Fairness? Violates queue fairness. → **DO NOT DO.**  

  ---

  ### **Where This Misfires**  
  - **"Harm" is your value call.** Calling wage reliance "harm" imports your ethics. The procedure flags this but doesn’t resolve it—that’s why coordinators exist.  
  - **Ignores "annoyance" nuances.** Mild social friction (e.g., eating on trains) defaults to "your call," but could escalate. Tell coordinators: "When students report minor norm conflicts, clarify consequences—will this get them barred from a venue? Or just a glare?"  
  - **Fails in "gray zones"**: e.g., hierarchical customs that aren’t exploitative locally. Procedure punts to coordinators here.  

  ---

  ### **What You Still Have to Decide**  
  - Define "harm" for coordinators (e.g., "Does it perpetuate systemic discrimination?").  
  - Clarify "legality": Will you include *de facto* unenforced laws (e.g., jaywalking)? I recommend: "Assume all laws are enforced until the coordinator says otherwise."  
  - Stress-test with coordinators: Run the queue-jumping example by them—does "bribery" align with local reality?  

  ---  
  This balances ethics, safety, and practicality. The key is forcing a hard stop at harm/illegality while leaving culture clashes to on-site experts.
