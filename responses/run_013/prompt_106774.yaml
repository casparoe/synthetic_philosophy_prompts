prompt: |-
  So I'm a senior and I'm the student rep on my school's Honor Committee, which basically means I sit in on the meetings and then write up the opinion we circulate afterward, and I have to have this one done before next Tuesday. Here's the mess: a girl in my grade, Dana, reported that four kids in her chem class had a group chat where they traded answers on the final. The thing is, Dana got caught cheating herself sophomore year — she got a warning and it kind of got swept under the rug — and a bunch of people think she only turned them in because she's applying to colleges and wants the teacher to like her. Now half the committee says it doesn't matter, cheating is cheating, and the other half says a known cheater has no business bringing a case at all, like she gave up the right to complain. And then the weird part, which is that our honor code is super selectively enforced — the lacrosse team had a whole shared-Quizlet thing last year and nothing happened — so one person on the committee said we can't punish these four when the school itself only enforces the rule when it feels like it.

  What I want is a short written opinion I can hand out at the meeting that recommends one concrete thing for us to do (punish / don't punish / punish plus do some other stuff) with an actual timeline, and that takes the strongest version of the losing side seriously instead of just saying rules are rules. But the part I really care about, and I dont have the vocabulary for it, is that everyone keeps sliding between two totally different questions: whether what the four kids did was wrong, and whether a specific person or a specific school is in a position to be the one calling it out. Those feel related but they're definately not the same, and I want the memo to keep them apart. My own half-baked take is that Dana's history shouldn't change the four kids' punishment at all but should change what the school does about Dana, and that the school's own track record has to get dealt with somehow — maybe the committee asks for a report on past cases before it rules. Can you write it? Like two pages, in a voice that sounds like a real school document but not like a robot wrote it.
reasoning: |-
  Okay, let me unpack this user's request. They're a senior and student rep on their school's Honor Committee, needing to draft an opinion about a cheating case involving Dana reporting four classmates. The complexity here is multilayered: Dana's past cheating incident, potential ulterior motives, inconsistent enforcement of honor code violations (like the lacrosse team's Quizlet scandal), and committee polarization.

  The user's core need is a two-page memo that:
  - Recommends concrete action with timeline
  - Engages the strongest counterarguments seriously
  - Explicitly separates the "act's wrongness" from "who can call it out"
  - Reflects their personal stance: punish the four consistently, address Dana separately, audit past enforcement

  Hmm... the philosophical distinction they're making is actually quite sophisticated - it's about separating the objective violation from the subjective standing to report. That deserves center stage in the memo structure. 

  For the recommendation framework, I'm considering:
  1) Validate both committee factions' concerns upfront (legitimacy of Dana's report vs standing questions)
  2) Propose bifurcated approach: 
     - Standard penalty for the four (since violation is provable regardless of source)
     - Separate review of Dana's potential honor code breach (sophomore incident + possible manipulation)
  3) Institutional fix: demand transparency report on past cases by specific deadline

  The timeline should be tight - user needs this before Tuesday meeting. Proposed deadlines:
  - Evidence review: 48hrs 
  - Dana's history assessment: 1 week
  - Transparency report: 3 weeks

  Voice is crucial - must balance formal school document tone with approachability. Avoiding legalese while using precise terms like "adjudication" and "standing." Opening hook could reference the honor code's aspirational language to ground it in shared values.

  Biggest challenge will be making the standing/wrongness distinction crystal clear without academic jargon. Maybe use the lacrosse team example as a concrete parallel showing how institutional failure doesn't negate current violations.

  Also noting user's implied frustration with hypocrisy. The memo should channel that into structural change rather than finger-pointing. Ending on procedural fairness emphasizes growth over punishment - which might resonate better with committee moderates.
answer: |-
  ## Honor Committee Advisory Opinion: Chem Class Group Chat Case  
  **Date:** [Insert Today's Date]  
  **To:** Honor Committee Members  
  **From:** [Your Name], Senior Student Representative  
  **Subject:** Recommendation Regarding Reported Cheating Incident & Procedural Integrity  

  ### I. Core Principles & Key Distinction  
  This case presents two questions that must remain distinct:  
  1.  **The Act:** Did the four students violate the Honor Code by sharing answers via group chat?  
  2.  **The Actor & Context:** Is Dana a legitimate reporter? Is the *school* itself consistent in enforcing the Honor Code?  

  **These questions are separate.** The inherent wrongness of an act does not depend on who reports it or the institution's past flaws. Conversely, concerns about the reporter's motives or the institution's consistency are valid but do not erase the underlying violation. Our recommendation addresses both strands without conflating them.

  ### II. Assessment of the Alleged Violation  
  Based on the information presented (Dana's report, presumed teacher/administrator corroboration during initial review):  
  *   Sharing answers on a final exam via group chat constitutes a clear violation of Section [X] of the Honor Code ("Unauthorized Collaboration" or equivalent).  
  *   The violation involves multiple students coordinating dishonesty, undermining academic integrity.  
  *   **Committee Disagreement Acknowledged (The "Rules are Rules" Counter):** The strongest counter-argument here is that selective enforcement renders any punishment inherently unfair. We acknowledge this concern is profound and reflects a real institutional failing (e.g., the lacrosse team Quizlet incident). Ignoring a provable violation *now*, however, simply compounds the inconsistency and further erodes the Code. Punishing *this* violation does not preclude addressing past failures; it upholds the standard *going forward*.  

  ### III. Assessment of the Reporter & Institutional Context  
  *   **Dana's History:** Dana's prior warning for cheating is a serious matter. It raises legitimate questions about her motives and credibility.  
  *   **Potential Motivations:** Concerns that Dana reported to gain favor with the teacher or bolster college applications are understandable speculation.  
  *   **Institutional Inconsistency:** The documented history of selective enforcement (e.g., lacrosse Quizlet) severely damages the Honor Code's legitimacy and perceived fairness. This is a systemic issue requiring a systemic response.  
  *   **Committee Disagreement Acknowledged (The "No Standing" Counter):** The strongest counter-argument is that a known violator forfeits the moral standing to accuse others, making their report invalid. This view prioritizes the *character of the accuser* over the *facts of the accusation*. While Dana's history is relevant to her own standing (see Recommendation Part B), it does not nullify the evidence of the four students' actions. Rejecting a report *solely* based on the reporter's past undermines the principle that violations should be reported and addressed, regardless of source.  

  ### IV. Recommendation & Concrete Action Plan  
  **A. Regarding the Four Students:**  
  *   **Recommendation:** The Committee should find the four students responsible for violating the Honor Code through unauthorized collaboration on the final exam.  
  *   **Standard Penalty:** Apply the standard penalty outlined in the Honor Code for a first offense of this nature (e.g., zero on the exam, [X] hours of community service, formal letter of censure). *This penalty is based solely on the proven violation.*  
  *   **Timeline:**  
      *   Draft finding and penalty proposal by **[Date - e.g., 2 days after meeting]**.  
      *   Vote to confirm finding and penalty at the next Committee meeting on **[Date - e.g., Next Week]**.

  **B. Regarding Dana:**  
  *   **Recommendation:** Dana's prior warning and the timing/motivation concerns surrounding her report warrant a separate review by the Administration.  
  *   **Action:** The Committee formally requests the Administration review Dana's sophomore year incident file and the circumstances of this report. If evidence suggests her report was maliciously motivated *or* that her previous violation was not adequately resolved, the Administration should take appropriate action under the Honor Code (which may include consequences for her, regardless of her role as reporter).  
  *   **Timeline:**  
      *   Committee includes this request in its official ruling communication to the Administration on **[Date - e.g., Day after vote]**.
      *   Requests Administration response/action plan by **[Date - e.g., 2 weeks after ruling]**.

  **C. Regarding Institutional Consistency (The Core Systemic Issue):**  
  *   **Recommendation:** The Committee cannot ignore the profound damage caused by selective enforcement. We must demand transparency and commitment to consistent application moving forward.  
  *   **Concrete Action:** The Committee formally requests the Administration produce a **"Transparency & Consistency Report"** within the next 30 days. This report must:  
      1.  Detail all reported Honor Code violations from the past two academic years.  
      2.  Document the outcome/resolution for each case (warning, penalty, dismissal).  
      3.  Explicitly address the lacrosse team Quizlet incident and any other known cases where enforcement appeared inconsistent or absent, explaining the reasoning.  
      4.  Outline specific, measurable steps the Administration will take to ensure consistent, impartial enforcement of the Honor Code for all students in all activities going forward.  
  *   **Timeline:**  
      *   Motion to request the report made during Committee discussion of this case.  
      *   Formal written request sent to Administration Head/Board on **[Date - e.g., Day after vote]**.
      *   Administration Report Due: **[Date - e.g., 30 days from request]**.  
      *   Committee schedules review of the report at meeting on **[Date - e.g., 35 days from request]**.

  ### V. Conclusion  
  We recommend finding the four students responsible and applying the standard penalty. This addresses the confirmed violation directly. Simultaneously, we demand action regarding the reporter's standing and, crucially, the school's inconsistent enforcement history. Separating these issues allows us to uphold the Honor Code's standard *in this instance* while forcefully confronting the systemic problems that undermine its very foundation. Punishing the violation now is necessary; addressing the reporter's history and institutional hypocrisy is essential for the Code's future credibility and fairness. This dual-track approach provides accountability, seeks justice, and demands the institutional reform necessary for the Honor Code to have legitimate meaning.

  **Recommended Committee Vote:**  
  1.  Find the four students responsible. (Vote: Yes/No)  
  2.  Apply Standard Penalty [Specify Penalty]. (Vote: Yes/No)  
  3.  Request Administration review of Dana's history/report. (Vote: Yes/No)  
  4.  Demand Administration Transparency & Consistency Report. (Vote: Yes/No)  

  Respectfully submitted,  
  [Your Name]  
  Senior Student Representative, Honor Committee
