prompt: |-
  I'm in a decision theory reading group and one of the members keeps deploying "if you're both rational, you'll both cooperate" — he used it on a one-shot prisoner's dilemma, no communication, no reputation, one round only, which I always thought was the textbook case where defecting just wins. His answer was that the other player is probably also someone who's read the same things and reasons the same way, so the two of us are basically running the same algorithm; someone else said the word "superrationality" and everyone nodded like that settled it. He also mentioned something about a setup where the two players are programs that get to read each others source code before they move, which apparently makes mutual cooperation stable.

  I still think he's smuggling something in, but I can't say what. Can you put on the decision theorist hat and take the slogan apart for me: what are the distinct precise claims it could be making, from the nearly empty to the very strong — which ones are claims about logic, which are about what "rational" ought to mean, which are about actual human psychology — and for each one, whether it's true and whether it would actually get him his conclusion about some anonymous other player in an experiment. Start with a quick brainstorm of the readings before you sort and judge them, and be careful with the ones that look like they've already assumed the answer. I'd also like your guess at which reading the people who keep repeating this actually have in mind. Don't bother with references or citations, I can't look anything up anyway. And please write it as straight prose — no headings, no bullet points, no bold, no tables, just the way you'd explain it in an email.
reasoning: |-
  Okay, let me approach this methodically. The user is grappling with a philosophical puzzle in decision theory where the standard prisoner's dilemma logic clashes with arguments about "superrationality" and identical reasoning processes. 

  First, I need to unpack the core tension: textbook game theory says defect dominates in one-shot PD, but the group member claims mutual cooperation is rational between identical rational agents. The key seems to lie in how "rationality" gets defined - whether it incorporates assumptions about shared reasoning or source code access.

  I'm considering several interpretations of "if you're both rational, you'll both cooperate," ranging from weakest to strongest. The naive rationality-as-self-interest view clearly fails in PD. More interesting are the versions where rationality includes: mutual knowledge of rationality (still doesn't compel cooperation), shared reasoning algorithms (which creates interdependence), or explicit source code access (where cooperation becomes provably optimal). 

  The psychological claim that humans act like identical algorithms seems empirically shaky - experiments show most people defect in anonymous one-shot PD. But the source code version (like in program equilibria) holds water mathematically, though it's arguably changing the game by adding pre-play inspection. 

  I suspect the group is mentally blending the identical-reasoning and source-code-access arguments without distinguishing them clearly. Their "superrationality" nod suggests they're jumping to the strongest interpretation without acknowledging how it redefines rationality. 

  The tricky part is explaining why identical algorithms lead to cooperation without smuggling in psychological assumptions. It hinges on the agents modeling each other as deterministic outputs of the same function - your choice becomes evidence about what the algorithm outputs generally, hence about the other's move. But this only works if both agents know this is the reasoning framework. 

  For experimental settings with strangers, this seems inapplicable - there's no reason to assume identical reasoning processes. The source code argument requires explicit setup. So while mathematically coherent in specific contexts, it's not a general solution for real-world PDs. 

  The user's intuition is correct - their friend is importing assumptions beyond standard rationality. But the friend isn't entirely wrong either; just operating in a different framework. The challenge is untangling these without dismissing either perspective.
answer: |-
  Here's a breakdown of that "if you're both rational, you'll both cooperate" slogan in the one-shot PD, dissecting its possible meanings, strengths, weaknesses, and applicability to your scenario:

  **Brainstorming the Readings:**

  1.  **Self-Interest Only (Naive):** "Rational" means purely self-interested payoff maximization. *Problem:* Defection *is* the dominant strategy. Claim fails immediately. This isn't what your group member means.
  2.  **Mutual Knowledge of Rationality:** "We both know we're both rational." *Problem:* Knowing the other is self-interestedly rational only tells you they'll defect (since it's dominant), so you defect. Doesn't get cooperation.
  3.  **Rationality as Including Prediction of Others:** "Rational" means I must correctly predict what a rational other will do, and act accordingly. *Problem:* This risks circularity. If I predict "rational = cooperate", I cooperate. If I predict "rational = defect", I defect. It doesn't resolve *which* prediction a rational agent *should* make.
  4.  **Rationality as Symmetric/Identical Reasoning:** (This seems closest to your group member). "Rational" implies we both use the *exact same, perfect* reasoning algorithm. Therefore, whatever I conclude, they will conclude the same thing. Our choices are linked because we run the same "program". Mutual cooperation becomes a possible stable point: if we *both* reason "same algorithm -> same output -> so if I C, they C -> good outcome; if I D, they D -> bad outcome; therefore C is better", then we both C. Mutual defection is also stable under the same logic. The claim is that mutual cooperation is the *better* stable point, so rational agents coordinate on it.
  5.  **Superrationality (Hofstadter):** This formalizes (4). It posits that rational agents in symmetric games *must* treat identical players as running identical algorithms. They don't choose an action *independently*; they choose the *pair* of actions (since their algorithm's output determines both). Rationality requires choosing the best *pair*, which is (C,C). It rejects the idea that you can choose your action while assuming the other's is independent/fixed.
  6.  **Source Code Access (Program Equilibrium/Turing Players):** Agents are programs that see each other's code. They can implement strategies like "I output C if and only if your code is identical to mine and outputs C". Crucially, they can commit to cooperation conditional on the other doing the same. (C,C) *can* be a stable equilibrium here because each program can *prove* that if it cooperates *and* the other is identical, the other cooperates, leading to the good outcome. Defection might not be stable as the other program, seeing your defection code, would also defect, leading to the bad outcome. Cooperation becomes an achievable and desirable fixed point.
  7.  **Psychological Claim:** "Rational" people who've studied game theory will cooperate because they understand arguments (4), (5), or (6) and expect the other player to do the same. Cooperation becomes a self-fulfilling prophecy among this subgroup.

  **Sorting and Judging:**

  *   **Logic vs. Definition vs. Psychology:**
      *   (1) & (2) are about standard definitions (rational = payoff-max, mutual knowledge). They fail to get cooperation logically within standard game theory.
      *   (3) is murky logic without further constraints; it doesn't inherently resolve to cooperation.
      *   (4), (5), (6) are primarily claims about how "rationality" *ought* to be defined or what the decision problem *is* (symmetric reasoning, choosing pairs, program implementation). They are logical arguments *within* their specific frameworks. (6) has the clearest logical foundation (programs inspecting each other).
      *   (7) is purely psychological/empirical.
  *   **Truth & Conclusion for Anonymous Experiments:**
      *   (1, 2, 3): Don't logically mandate cooperation. Experiments show widespread defection in anonymous one-shot PDs, consistent with (1) & (2).
      *   (4) & (5) (Symmetric/Superrationality): Logically *consistent* within their assumptions, but those assumptions are a *redefinition* of the decision problem. They change "choose my action given uncertainty about theirs" to "choose the joint outcome given symmetry". Whether this redefinition *is* "rationality" is a philosophical choice, not a logical necessity. **For anonymous experiments:** Highly unlikely. Participants aren't guaranteed to be using identical reasoning, nor to assume symmetry. Experiments show defection dominates. The claim doesn't hold empirically.
      *   (6) (Source Code): Logically sound *within the model*. It demonstrates a mechanism where cooperation *can* be rationally stable *if* agents have mutual access to implementation details. **For anonymous experiments:** Completely inapplicable. Players don't see each other's "source code" (thought processes). This models a very specific, artificial scenario, not a standard lab PD.
      *   (7) (Psychology): **Empirical claim:** Do "rational" people cooperate in anonymous one-shot PDs? Evidence strongly suggests **no.** While subsets of game theorists might cooperate *more* than the general population, defection is still common and often the majority choice. Expecting an anonymous other player to cooperate based on shared knowledge is a gamble, not a rational certainty. It fails empirically.

  **What's Being Smuggled In & What Your Group Likely Means:**

  Your group member is smuggling in **assumptions about symmetry and the nature of the decision problem.** They are implicitly shifting from the standard game-theoretic model (where players choose actions independently under uncertainty) to a model where rationality *requires* reasoning about the symmetry of the situation and the linkage of choices (like 4 & 5), or even the source code model (6). The word "superrationality" confirms this.

  **Which reading do they have in mind?** Almost certainly a blend of (4), (5), and the *intuition* of (6). They hear "both rational" and interpret it as "both running the exact same flawless reasoning algorithm," leading to the symmetry argument: "If I'm rational and conclude C, they must conclude C too, so I *should* conclude C." They are mentally importing the *conclusion* of the source code argument (cooperation is stable) without its *mechanism* (actual code inspection and conditional commitment). They are treating "rational" as implying not just individual optimization, but also the recognition of symmetry and the ability to coordinate on the best symmetric outcome. The source code example serves as a motivating intuition or proof-of-concept that such coordination *can* be rational under specific conditions, which they then (over)generalize.

  **Conclusion:**

  Your instinct is correct. The slogan "if you're both rational, you'll both cooperate" in a standard one-shot PD relies on redefining "rationality" beyond standard self-interested payoff maximization under uncertainty. It smuggles in assumptions of perfect symmetry of reasoning and/or access to information (like source code) that simply don't hold in the textbook case or typical anonymous experiments. While logically coherent within specific, non-standard frameworks (superrationality, program equilibrium), it fails as a description of standard game-theoretic rationality or as a reliable prediction of behavior in real-world anonymous one-shot PDs. The dominance of defection remains the robust conclusion for the scenario you described. Your group member is arguing from a specific philosophical perspective on rationality, not the standard game theory one.
