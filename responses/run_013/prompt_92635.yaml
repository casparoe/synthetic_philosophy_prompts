answer: |-
  ## The Bones of Anna

  The city of Lysk sprawled like spilled ink beneath Kira’s third-floor window, its gas lamps struggling against the creeping autumn dusk. Inside, the air was thick with the scent of stale coffee and the sharper tang of frustration. On her desk, bathed in the pool of light from a green-shaded lamp, lay two sheets of paper. One, brittle and yellowed, bore the neat, angular script of the national poet, Elan Vorin, and his five-line lyric, "White Nights." The other, pristine and accusingly blank except for a single typed line, awaited Kira’s impossible task.

  The State Cultural Office of Lysk had commissioned her, Kira Voronina, esteemed translator of Avarian classics into Selarin, for the definitive, *authorized* translation of Vorin’s most beloved fragment. The honor was immense. The condition was impossible.

  "Reproduce the formal apparatus *exactly*," Minister Valchik had intoned that morning in his office smelling of beeswax and bureaucracy. He’d tapped the poem with a manicured finger. "Rhyme scheme: A-B-A-B-A. And *this*." His finger traced the invisible column down the left margin. "The acrostic. A-N-N-A. Anna. The lost beloved. The soul of the poem. Non-negotiable, Voronina. It *is* the poem's heartbeat."

  Kira knew the legend. Vorin, heartbroken after Anna’s mysterious disappearance, poured his grief into these twenty-five syllables. The acrostic was his secret signature, his cry trapped within the structure. Revered. Sacred.

  But Selarin, Kira’s rich, complex native tongue, rebelled. Its grammar was a minefield of mandatory choices. Every verb demanded a subject’s gender, a level of formality, even the speaker’s certainty of the action. "He walks" implied *knowing* he walks; "She walks (reported)" cast doubt. And its phonetics? The sounds needed for a perfect A-B-A-B-A rhyme scheme using words that could *also* start with the letters A, N, N, A? They pulled in violently opposite directions.

  She focused on Line 3, the critical second ‘N’ in the acrostic. The original Avarian was deceptively simple: "*Rassvet bleščet nad spjaščim gorodom*" – "Dawn gleams over the sleeping city." Avarian verbs were blessedly gender-neutral and evidentiality-neutral. "Gleams" just *was*.

  Selarin offered no such grace. She needed a verb meaning "gleams/shines" starting with 'N'. *Neset*? "It carries light"? Too heavy. *Nijarit*? "It glimmers (uncertainly)" – implying doubt where Vorin offered none. *Najalet* – "It bursts forth (with sudden intensity)". Closer, perhaps, but too violent.

  And it had to rhyme with Line 1’s ending, which, adhering to the acrostic ‘A’, she’d tentatively rendered as "*svet*" ("light," formal register). Rhymes for *svet* in Selarin were limited: *kvet* (flower, archaic), *predmet* (object, clunky), *otvet* (answer, potentially resonant but…).

  She wrote two options for Line 3:

  1.  ***Najalet** zarya nad gorodom snom* (Dawn **bursts forth** over the city in sleep)
      *   *Najalet*: Starts with ‘N’. Verb form implies sudden, forceful action (not implied in original). Subject "dawn" (*zarya*) is feminine in Selarin, forcing a gender absent in Avarian. Rhymes perfectly with Line 1 (*svet*/*snom* - light/sleep).
  2.  ***Nijarit** rassvet, gorod pokojen snom* (**Glimmers uncertainly** the dawn, the city rests in sleep)
      *   *Nijarit*: Starts with ‘N’. Verb implies the speaker isn't sure *if* it’s gleaming, introducing hesitation. "Dawn" is now *rassvet* (masculine noun, different connotation). Rhyme with Line 1 is destroyed (*svet* vs. *snom*). The syntax is awkward, forced to accommodate the verb.

  Preserving the rhyme (Option 1) meant imposing violence and gender on Vorin’s neutral dawn. Preserving the acrostic with a more neutral verb (Option 2 meant abandoning the rhyme and introducing doubt. Loss either way. She lit another cigarette, the glowing tip a tiny, angry star in the dim room.

  ***

  The State Cultural Office library was a mausoleum of varnished wood and hushed disapproval. Kira sought the oldest manuscript copy of "White Nights," hoping a physical connection might spark inspiration. The archivist, a man with eyes like dusty raisins, produced a folio bound in cracked leather.

  As Kira carefully turned the fragile pages, her breath caught. There, in the margin beside "White Nights," was a note in a different, later hand: "*Folio damaged. Top left corner missing. Acrostic inferred and restored per common tradition by M. Koslov, 112 Post-Unification.*"

  Inferred? *Restored*? Her heart hammered against her ribs. Koslov! A minor functionary-translator from a century after Vorin. Not Vorin’s secret grief, but Koslov’s best guess, patching a damaged manuscript! The sacred acrostic, the "heartbeat," was a translator’s pragmatic reconstruction, fossilized by time and reverence into holy writ.

  She found Marek Volny in his usual corner of the Café Lira, surrounded by coffee cups and dictionaries. Marek, her friend and fiercest rival, had argued passionately against taking the commission.

  "Kira! Still wrestling with Vorin’s ghost? Or Valchik’s bureaucracy?" He pushed a steaming espresso towards her.

  "It’s worse," she whispered, leaning in. She told him about Koslov’s note. Marek’s eyes widened, then narrowed with fierce understanding.

  "Koslov? That old hack? So the revered acrostic is just… historical lint? Valchik’s demanding you preserve a *mistake*?"

  "Not a mistake," Kira countered, though her conviction wavered. "A restoration. It became tradition. It *is* how the poem is known."

  "Tradition built on sand!" Marek slammed his palm softly on the table, making the cups rattle. "Kira, listen. Vorin wrote five lines of grief. Koslov glued on an acrostic because a corner was torn. Valchik worships the glue! Your duty isn't to Koslov's patch job or Valchik's decree. It's to Vorin's *words*, to the feeling trapped in *his* language. Forget the acrostic! Find the equivalent grief in Selarin. That's fidelity." He gestured dismissively. "This acrostic business… it’s idolatry. We don’t restore cathedrals using the same cracked stones that fell off centuries ago."

  "But it’s the stones people venerate," Kira argued, feeling trapped. "The acrostic *is* the poem for them. Removing it… it would be like performing Hamlet without the ghost. A different thing entirely. And the language, Marek… even without the acrostic, Selarin forces choices. Every verb pins down what Vorin left open."

  "Of course it does!" Marek exclaimed. "Translation *is* interpretation pretending to be fidelity. There is no neutral. Your choice of ‘gleams’ over ‘shines’ is interpretation. Assigning gender is interpretation. The acrostic is just a particularly stupid constraint forcing *bad* interpretation. Abandon it. Translate the *poem*, not the scaffolding."

  ***

  The summons came two days later. Minister Valchik sat behind his vast desk, a monolith of state-sanctioned culture. He didn’t offer her a seat.

  "Progress, Voronina? The unveiling ceremony approaches."

  Kira took a steadying breath. "Minister, I encountered… historical information. In the oldest folio. The acrostic… it wasn't Vorin's. It was restored by Koslov due to manuscript damage."

  Valchik’s face remained impassive, a mask of polished stone. "Koslov was a diligent servant of the canon. His restoration preserved the poem’s integrity."

  "But it’s not original! It’s an addition, an interpretation!"

  "Voronina," Valchik said, his voice chillingly soft, "do you know why ‘White Nights’ endures? Not just for Vorin’s words, but for the *story*. The lost Anna. The secret acrostic. It is a national myth. Koslov’s hand, if indeed it was his, is now part of the work’s holiness. The acrostic *is* the poem. Reproduce it exactly, or we will find a translator who understands the meaning of *authorized*." He steepled his fingers. "The constraint stands. As does the deadline."

  ***

  Midnight. The city lights were a distant, indifferent galaxy. Kira sat at her desk, the blank page still mostly blank. Valchik’s threat hung in the air. Marek’s passionate plea echoed. The ghost of Koslov, the well-meaning bureaucrat, hovered over Vorin’s fragment. Her eyes burned.

  She looked at her failed attempts for Line 3. *Najalet* (bursts forth, feminine, certain) or *Nijarit* (glimmers uncertainly, masculine). Rhyme or acrostic. Imposed certainty or imposed doubt. Neither was Vorin’s open, neutral gleam.

  She thought of the verbs Selarin demanded. To say "the city sleeps" required choosing: *spit* (sleeps - known fact, gender-neutral but informal) or *pokojitsya* (reposes - formal, slightly archaic, implying peaceful rest, gender-neutral). Each carried baggage Vorin hadn't packed.

  The acrostic was a lie. But it was the lie the poem lived by. To remove it was to kill the myth, to render the poem unrecognizable to its readers. Yet to preserve it perfectly was to garrote Vorin’s actual words with Koslov’s convenient fiction and Selarin’s grammatical chains.

  A terrible clarity washed over her, cold and bracing. There was no perfect solution, only a choice of which loss to embrace, which master to betray.

  Her fingers moved to the typewriter. She typed Line 1, preserving the ‘A’ and the rhyme sound:
  *Adski svet l’yet s nebesnoj vysoty* (Hellish light pours from the heavenly height – choosing ‘hellish’ for the ‘A’, acknowledging the pain).

  Line 2, needing ‘N’:
  *Noč’ bez dna, i vse puti zatraty* (Night without bottom, and all paths are wasted – ‘Noč’’ for ‘N’, introducing the abyss).

  Now, Line 3. The second ‘N’. She needed the rhyme. She needed the acrostic. She needed meaning. She typed, each keystroke a surrender and an assertion:
  ***Neset** tixij svet skvoz’ t’mu zatraty* (**It bears** a quiet light through the dark of waste)

  *Neset* – "It bears." Starts with ‘N’. Verb form implies continuous, burdensome carrying. Subject is the light (*svet*, masculine now, taking on the weight), not the dawn. Rhymes perfectly with Lines 1 and the future 5 (*vysoty* / *zatraty* / *...*). But it twisted the image: no longer dawn actively gleaming, but light passively, laboriously borne through darkness. She had sacrificed Vorin’s specific image (dawn) and active verb for the acrostic and the rhyme, imposing a masculine burden on the light and a sense of weary endurance absent in the original.

  She continued, forcing Lines 4 and 5 (‘N’, ‘A’) into the straitjacket, each choice layering Selarin’s mandatory certainties onto Vorin’s elusive grief. The city "reposed" (*pokojitsya* – formal, peaceful) rather than simply "slept." The final line, needing ‘A’ and rhyme, became a strained image of absence.

  Kira sat back. The translation was complete. The acrostic A-N-N-A stood rigidly down the left margin. The A-B-A-B-A rhyme scheme clicked into place with mechanical precision. It was technically compliant. It was authorized.

  It was a cage. Koslov’s reconstructed acrostic was preserved as holy writ. Valchik’s demand was met. But Vorin’s dawn was gone, replaced by borne light. His neutral city sleep was formalized repose. The open ache of the original was pinned down, labeled, and subtly altered by the inescapable grammar of another tongue.

  She had chosen preservation of the myth over the purity of the source, knowing the myth itself was a translational artifact. She had chosen the constraint, knowing it forced interpretations Vorin never made. She had chosen to bear the light, however quietly, through the dark of waste, adding the weight of Selarin’s necessities to Vorin’s grief.

  Kira pulled the page from the typewriter. The words sat there, final, compromised. She had not found fidelity. She had performed an act of necessary sacrilege, a translation faithful to the tradition’s demand but haunted by the ghosts of the poet’s original intention and the target language’s unavoidable assertions. She placed it in the folder for the State Cultural Office, feeling not triumph, but a terrible lightness, the weight of something essential left behind on the far shore of language. The city lights outside seemed colder now, illuminating nothing but the shape of the loss.
