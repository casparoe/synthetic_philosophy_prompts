prompt: |-
  A brain-preservation organization has asked to recruit dying patients from our palliative care service, and the clinical ethics committee I chair votes next month on whether to allow it. The procedure is destructive: the patient is anesthetized, the brain is fixed and imaged at very high resolution, and no one wakes up — not on the table, not afterwards. The organization's patient materials describe the outcome as the patient's survival; our neurologists describe the same events as the patient's death. Both descriptions will be in the room when a family is asked to consent, and we have to decide not only whether to approve the protocol but what the consent document may say.

  My half-formed view is that we will deadlock if we argue about which theory of personal identity is correct, and that the deadlock is an artifact of treating identity as the thing consent tracks. Consent seems to need one continuing subject who can authorize a later event and who can be wronged by it. Here, if the patient does not survive, the authorizing subject is gone before anything can wrong her; and whoever exists afterwards has no complaint to make, since but for the procedure he would not exist at all — the same structure as the non-identity problem. If that is right, the real question is not whether the patient survives but whether this is something a patient can consent to in the first place, or only something a proxy can authorize on behalf of a person who does not yet exist and cannot be consulted.

  Please draft the written opinion I will circulate before the vote: a clear recommendation with conditions attached, in a form the committee can act on, with a date by which the sponsor must respond. It has to engage seriously with the strongest case for approving without conditions — that these patients face death within weeks and that withholding the offer is paternalism dressed as protection — and with the argument that this is just the familiar advance-directive problem, in which a prior competent decision governs even when the later, incompetent person protests. I think that analogy fails, but the opinion should either show why or concede it, and it must handle the version of the case in which two copies are made, or one copy plus a still-living body, since that is where the branching talk stops being decorative. Say what the consent document may and may not assert about what happens to the patient, what the committee owes the family, and what the panel should do if a patient, having heard both descriptions, wants to proceed anyway. Two pages, plain enough for the three lay members, actionable bottom line, no citations — I will add references myself.
reasoning: |-
  Okay, the user is chairing a clinical ethics committee that's voting on whether to allow a brain-preservation organization to recruit dying patients from their palliative care service. The procedure is destructive: patients are anesthetized, their brains are fixed and imaged at high resolution, and they don't wake up. The key ethical dilemma revolves around conflicting descriptions of the outcome - the organization calls it "survival" while neurologists call it "death." 

  The user has shared their half-formed view that arguing about personal identity theories might lead to deadlock, and suggests focusing instead on whether consent is even possible here. They raise the non-identity problem angle - if the patient doesn't survive, there's no subject to authorize or be wronged; if something new is created, it can't complain since it wouldn't exist otherwise. 

  The user needs a draft written opinion for committee circulation that: 
  - Makes a clear recommendation with conditions
  - Engages the pro-approval argument (withholding offer is paternalistic when patients are dying anyway)
  - Addresses the advance-directive analogy 
  - Handles scenarios like two copies or one copy plus living body
  - Specifies what consent documents can/can't claim
  - States what to do if a patient wants to proceed after hearing both descriptions
  - Is under two pages, plain language, actionable

  Hmm... the core tension is between respecting patient autonomy versus protecting vulnerable dying patients from what might be false hope. The organization's "survival" language feels scientifically unsupported at present - it's speculative philosophy at best. But outright banning might indeed be paternalistic. 

  The advance-directive analogy is weak because advance directives involve the same person continuing in a different state (e.g., dementia), whereas here we have possible termination of the original person. The branching cases (two copies etc.) actually weaken the organization's position by highlighting how their survival claim becomes incoherent.

  For the consent document, we absolutely must prevent the organization from presenting their survival claim as fact. But if a fully informed patient still wants this... that's tricky. The procedure is irreversible and happens immediately after consent - there's no "later protest" like in dementia cases. 

  The recommendation should probably be conditional approval: allow recruitment only if consent documents are strictly regulated and families aren't misled. But require the sponsor to demonstrate they can explain this without overstepping. If patients insist after full disclosure... maybe permit it with extraordinary safeguards? Though that feels ethically shaky. 

  Key points for the draft:
  1. Reject the survival framing as non-scientific
  2. Draw bright lines for consent language
  3. Treat this as creating a new entity, not continuing the person
  4. Require sponsor's materials to pass ethics review
  5. Have clear plan for patients who insist
answer: |-
  ## Clinical Ethics Committee Pre-Vote Opinion  
  **Re: Proposal for Brain-Preservation Organization Recruitment**  
  **Date Circulated:** [Insert Date]  
  **Vote Date:** [Insert Date]  
  **Sponsor Response Deadline:** [Insert Date - e.g., 10 days pre-vote]  

  ---

  ### **I. Recommendation**  
  **Conditionally approve** the recruitment protocol, subject to the following binding conditions:**  
  1.  **The consent document and verbal script must state unequivocally that the medical consensus defines this procedure as resulting in the patient’s death.** The organization’s "survival" claim may be presented *only* as an unproven philosophical assertion by the sponsor, clearly labeled as such and given no greater prominence than the medical consensus.  
  2.  **The sponsor must submit all patient-facing materials (brochures, videos, scripts) to this committee for pre-approval** to ensure compliance with Condition 1 and prohibit misleading language.  
  3.  **The consent process must explicitly state:** "This procedure ends your biological life. No currently existing scientific evidence suggests it can restore your consciousness or identity. The organization’s claim that you ‘survive’ is a theoretical belief, not an established medical outcome."  
  4.  **A mandatory 48-hour reflection period** is required between final consent discussion and signing.  
  5.  **If a patient, after full disclosure of both viewpoints, insists on proceeding,** an independent consultant (e.g., palliative care psychiatrist) must verify comprehension and absence of coercion before final authorization.  

  **Failure of the sponsor to accept these conditions in writing by the deadline results in automatic rejection of the protocol.**  

  ---

  ### **II. Reasoning: Engaging Key Arguments**  

  #### **A. The "Paternalism" Argument for Unconditional Approval**  
  *   **Strength:** Dying patients facing imminent loss of all options deserve maximal autonomy. Denying access based on our skepticism *could* be seen as imposing values.  
  *   **Response:** Autonomy requires *informed* choice. The sponsor’s "survival" framing is not a medically or scientifically validated outcome; it is a metaphysical claim. Presenting it as a factual outcome ("you will survive") exploits vulnerability and undermines true informed consent. Our conditions prevent paternalism *while* ensuring consent is based on reality: patients will die during the procedure. We allow the choice, but forbid deception.  

  #### **B. The "Advance Directive" Analogy**  
  *   **Argument:** Competent patients can consent to future states (e.g., refusing life-saving treatment via advance directive), even if the later, incompetent person might "protest." Similarly, a patient could consent to this "transition."  
  *   **Why the Analogy Fails:**  
      1.  **Discontinuity vs. Continuity:** An advance directive governs the *same person* in a future, impaired state. Here, the medical consensus holds the *original person ceases to exist*. There is no "later incompetent person" who is the *same* subject as the consenting patient.  
      2.  **The "Branching" Problem:** This flaw is starkly exposed in scenarios where "two copies" are made, or "one copy plus a living body." The organization cannot coherently claim the *original person* "survives" in *both* (or *either*) branch. Who is the "patient" protesting? The analogy collapses because the procedure doesn't *preserve* an existing subject for a future state; it arguably *ends* one subject and may create a *new* entity (a preserved brain/data pattern). Consent tracks the *original subject*. Advance directives apply to continuous existence; this does not.  

  #### **C. The Core Ethical Problem: Consent and the "Non-Identity" Issue**  
  As noted, debating whether identity "survives" is intractable. The actionable question is: **Can the patient validly consent to *this specific act*?**  
  *   **The Act:** A procedure causing biological death, which *may* (theoretically) create a new entity derived from their brain.  
  *   **Consent Requires:** A subject who can authorize the act *and* who could be harmed by it.  
  *   **Analysis:**  
      *   If the patient ceases to exist (death), they cannot be harmed *by the subsequent existence or non-existence* of the preserved brain/data. The act of ending life is complete upon death.  
      *   The *potential future entity* (digital pattern/reconstruction) cannot consent and wouldn't exist without the procedure. It has no claim against the patient who authorized its creation.  
  *   **Conclusion:** Consent here is validly directed **only** at authorizing the *terminal procedure itself* and the creation of the derivative entity. It is **not** consent to "survive" or "continue." This is akin to consenting to organ donation knowing it requires terminal extubation – you consent to the act causing death *and* the future use of tissue. The key difference is the speculative nature of the "use."  

  ---

  ### **III. Requirements for Consent Documents & Process**  
  *   **Must State:** "This procedure will cause your death according to established medical criteria. Your heart will stop, your breathing will cease, and you will not regain consciousness."  
  *   **May State (if sponsor insists):** "The [Organization Name] believes the information preserved from your brain could, in theory, form the basis of a future digital consciousness. *This is not a scientifically proven outcome and is considered a philosophical belief.*"  
  *   **Must NOT State (or imply):** That the patient "survives," "transitions," "continues," or "wakes up" post-procedure. Language suggesting the patient will "experience" anything after the anesthesia is prohibited.  
  *   **Committee Duty to Families:** Ensure they understand:  
      1.  Their loved one *will die* during this procedure.  
      2.  The "survival" claim is a belief, not science.  
      3.  They are *not* authorizing anything "for" a future conscious entity; they are authorizing a terminal procedure and the preservation of brain tissue/data.  

  ---

  ### **IV. Bottom Line: Vote Recommendation**  
  Approve recruitment **ONLY** if the sponsor accepts our conditions in writing by the deadline. These conditions:  
  1.  Uphold patient autonomy by allowing the choice.  
  2.  Prevent exploitation by mandating truthful disclosure of death as the medical outcome.  
  3.  Respect the profound vulnerability of dying patients by rejecting scientifically unsupported claims of "survival."  
  4.  Provide a safeguard (independent verification) for patients who proceed despite understanding the medical reality.  

  **If conditions are met, this becomes a permissible, albeit highly experimental, end-of-life option.** If not, the risks of misinformation and compromised consent are unacceptable.  

  ---  
  **Chair, Clinical Ethics Committee**  
  [Your Name/Title]
