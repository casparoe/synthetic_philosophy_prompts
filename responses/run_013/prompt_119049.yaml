prompt: |-
  Before I settle on a reading for the final unit of a course on borders and partiality, I want the specification rather than one more candidate theory. Set out the desiderata any adequate theory of compatriot partiality must meet — the cases it has to get right, the distinctions it must not collapse, the facts about how states actually operate that it must be consistent with — giving the consideration behind each requirement and marking which are non-negotiable and which are merely commitments of one camp.

  Take seriously the cases my students keep pressing: two co-nationals who have never met and whose shared state does nothing for either of them; a long-term resident who bears every burden of the state but holds another citizenship; a diaspora that claims the nationality with no prospect of living in the territory; a co-national who has renounced the citizenship and left. Keep separate throughout having a special claim, being permitted to favour, and being required to favour; and keep separate claims that arise from a relationship and claims that arise from a scheme of cooperation. Say, too, whether one list covers both the partiality of states and the partiality of individual citizens, or whether these need two specifications.

  Finally, name the pair of requirements you think cannot be met together — my own suspicion is that it is the demand that the ground of the tie be something the agent can be said to have taken on, set against the demand that it explain why nationality rather than any other group — and identify the single requirement that does most to exclude the main existing families of view. No scorecard; I shall run that in class.
reasoning: |-
  Okay, the user is teaching a course on borders and partiality and needs to set desiderata for theories of compatriot partiality. They want a clear specification of what any adequate theory must address, rather than another candidate theory. Let me unpack their query.

  First, they mention specific cases their students keep pressing. These include co-nationals who've never met with no state benefits, long-term residents with other citizenships, diaspora claiming nationality without living there, and those who renounced citizenship. The theory must handle these without collapsing important distinctions. Also, they want to separate special claims, permission to favor, and requirement to favor, as well as relationship-based vs. cooperation-based claims. Plus, clarify if one list covers both state and individual partiality or if separate specs are needed.

  The user also wants a pair of conflicting requirements and the single requirement that excludes major existing theories. Their suspicion is the conflict between the tie being something taken on versus explaining why nationality specifically matters. I need to address that.

  Breaking down the desiderata. Core cases to handle: mutual indifference (strangers sharing nationality but no state benefits), resident non-citizen (contributing without citizenship), diaspora (emotional ties without residency), expatriate (renounced citizenship). Each tests different aspects of partiality theories.

  Key distinctions: special claim vs. permission vs. requirement. A theory might allow favoring without requiring it. Also, relationship-based (like shared identity) vs. cooperation-based (joint scheme) claims. These often get conflated but are different justifications.

  State vs. individual partiality: Should these have the same basis? States act institutionally, possibly based on territorial jurisdiction, while individuals might have personal moral reasons. Need to decide if one list suffices or if separate specs are necessary. Probably mark this as a debated point.

  Non-negotiables: Mutual indifference and resident non-citizen cases. If a theory can't explain obligations to unknown co-nationals or denies resident obligations, it fails. Diaspora and expatriate cases might be more flexible but still important.

  The conflicting pair: Voluntariness (tie taken on) vs. nationality's specificity. Voluntarism struggles with birthright citizenship; non-voluntarist theories might not differentiate nationality from other groups. This tension is central.

  Most excluding requirement: Probably the mutual indifference case. Instrumental theories (like cooperation) fail because no shared scheme exists. Identity-based theories might handle it but could overextend to other groups. This requirement challenges many existing theories.

  Need to ensure the desiderata cover all user points. Mark non-negotiables clearly, note where camps differ. Highlight the conflict and the excluding factor. Also, clarify the state vs. individual issue as needing separate specs due to different moral foundations.
answer: |-
  Here is a specification of desiderata for an adequate theory of compatriot partiality, structured around your requirements, incorporating the core cases, distinctions, and tensions you identify.

  **Core Desiderata for a Theory of Compatriot Partiality**

  1.  **Accommodate the 'Mutual Indifference' Case (Non-Negotiable):**
      *   **Case:** Two co-nationals who have never met and whose shared state provides no tangible benefits or burdens to either (e.g., citizens of a failed state or extremely minimalist state).
      *   **Requirement:** The theory must explain why (or if) these individuals have *any* special moral claims on each other (e.g., rescue priority, minimal aid) *solely* based on shared nationality, absent interaction, cooperation, or state-mediated benefits.
      *   **Consideration:** Tests whether the partiality tie is fundamentally relational (national identity) or purely instrumental (state services/cooperation). Many instrumental theories (e.g., fair play, reciprocity) fail here.
      *   **Negotiability:** Non-Negotiable. A theory that dismisses this case entirely likely misunderstands the phenomenology and common intuition of nationality-based ties.

  2.  **Accommodate the 'Resident Non-Citizen' Case (Non-Negotiable):**
      *   **Case:** A lawful long-term resident who pays taxes, obeys laws, participates socially, and bears the burdens of the state but holds formal citizenship elsewhere.
      *   **Requirement:** The theory must explain the resident's strong moral claim (e.g., to fair treatment, basic services, eventual inclusion, perhaps even voting rights) *and/or* the state's/citizens' permission/obligation to show partiality *towards* them (e.g., protection, inclusion efforts). It must also explain why formal citizenship might still matter *differently* (e.g., for passport rights, diplomatic protection abroad).
      *   **Consideration:** Tests the relative weight of formal status (citizenship) vs. substantive participation/contribution (residence, tax-paying) and territorial presence vs. national identity. Challenges purely identity-based theories.
      *   **Negotiability:** Non-Negotiable. Modern states are defined by territorial jurisdiction and resident populations; theories ignoring this reality are inadequate.

  3.  **Accommodate the 'Diaspora' Case (Camp-Specific Commitment):**
      *   **Case:** Members of a diaspora who identify strongly with a nationality, may hold its citizenship, but have no prospect or intention of residing in the territory (e.g., 3rd generation emigrants).
      *   **Requirement:** The theory must explain the nature and limits of claims *from* the diaspora (e.g., symbolic connection, right to maintain culture, claim to citizenship/return?) and claims *on* the diaspora (e.g., obligations to support the homeland?).
      *   **Consideration:** Tests the necessity of territorial presence/residence and the persistence of identity-based ties over distance/time. Challenges territorial/residence-based theories.
      *   **Negotiability:** Camp-Specific. Theories emphasizing *current* cooperation/reciprocity or territorial jurisdiction may minimize diaspora claims; identity-based theories may affirm them strongly.

  4.  **Accommodate the 'Expatriate' Case (Camp-Specific Commitment):**
      *   **Case:** A former citizen who has formally renounced citizenship and permanently left the territory.
      *   **Requirement:** The theory must explain the severing (or persistence) of special claims *between* the expatriate and former compatriots/state (e.g., does any residual obligation exist? Can partiality ever be justified?).
      *   **Consideration:** Tests the voluntariness and reversibility of the compatriot tie. Challenges theories where the tie is seen as irrevocable or non-voluntary (e.g., some identity-based views).
      *   **Negotiability:** Camp-Specific. Voluntarist theories will see this as a clean break; non-voluntarist theories may see lingering ties or obligations.

  5.  **Distinguish 'Special Claim', 'Permitted to Favour', and 'Required to Favour' (Non-Negotiable):**
      *   **Requirement:** The theory must clearly differentiate:
          *   *Special Claim (Owed):* What compatriots can legitimately demand from each other or the state (e.g., basic security, fair distribution).
          *   *Permitted to Favour:* Actions showing preference for compatriots that are morally acceptable but not obligatory (e.g., charitable giving priority, cultural promotion).
          *   *Required to Favour:* Actions showing preference that are morally obligatory (e.g., paying taxes for domestic welfare, prioritizing co-nationals in rescue *if* resources allow saving all).
      *   **Consideration:** Collapsing these leads to crude "all or nothing" views. A theory must explain the *scope* and *strength* of partiality. It might ground different types in different aspects of the relationship (e.g., owed claims from cooperation, permission from identity).
      *   **Negotiability:** Non-Negotiable. This is fundamental to nuanced moral reasoning about partiality.

  6.  **Distinguish 'Relationship-Based' and 'Cooperation-Based' Claims (Non-Negotiable):**
      *   **Requirement:** The theory must distinguish justifications for partiality arising from:
          *   *Relationship/Shared Identity:* The bare fact of shared nationality as a constitutive relationship (e.g., shared history, culture, language).
          *   *Scheme of Cooperation:* Participation in, or subjection to, the same institutional structures, cooperative ventures, or reciprocal benefits/burdens (e.g., state institutions, economic system).
      *   **Consideration:** These are distinct moral grounds. Conflating them obscures whether partiality stems from who we *are* together or what we *do* together. The core cases (especially Mutual Indifference & Resident Non-Citizen) probe this distinction.
      *   **Negotiability:** Non-Negotiable. A theory must clarify its primary ground(s) and how they interact without collapsing.

  7.  **State vs. Individual Partiality (Needs Separate Specification):**
      *   **Requirement:** A single list of desiderata is **insufficient**. The moral foundations and permissible scope of partiality differ fundamentally:
          *   *State Partiality:* Grounded in its constitutive function (serving *a particular people*), territorial jurisdiction, fiduciary duties to citizens/residents, and principles of democratic legitimacy. Its partiality is institutional, often coercive, and bounded by territorial control and international law. Requirements are stronger (e.g., prioritizing citizens for welfare, security). The Resident Non-Citizen case is central here.
          *   *Individual Partiality:* Grounded in personal relationships, associative duties, identity, or participation in cooperative schemes. It is non-coercive, discretionary in many contexts (though can be obligatory), and interacts with general moral duties. Permissions and weaker claims are more prominent. The Mutual Indifference and Diaspora cases probe this.
      *   **Consideration:** States and individuals operate at different levels with different powers and responsibilities. A theory must specify the agent. While related (e.g., state duties shape individual context), the justifications and constraints are distinct.

  **The Tensions:**

  8.  **The Inherent Tension (The Pair That Cannot Be Met Together):**
      *   **Tension:** The demand that the ground of the tie be **something the agent can meaningfully be said to have taken on (Voluntarism/Choice)** vs. The demand that it **explain why *nationality specifically* grounds partiality rather than any other group identity (Specificity)**.
      *   **Explanation:**
          *   *Voluntarism's Problem:* Nationality is largely unchosen (birthright). While some elements can be embraced or renounced, the core tie is ascribed. Strong voluntarism struggles to explain why *this* unchosen group matters specially, unlike other unchosen groups (ethnicity, family of origin - though family has intimacy voluntarism also struggles with). It risks reducing nationality to mere citizenship acquired by choice (ignoring birthright) or residency.
          *   *Specificity's Problem:* Non-voluntarist theories (e.g., identity-based, constitutive relationship) can explain why nationality feels specially significant. However, they struggle to differentiate it *morally* from other powerful, unchosen, identity-forming groups (ethnicity, religion, even large regional identities) in a non-arbitrary way. Why prioritize *this* identity group?
      *   **Why it's Hard:** Voluntarism makes the tie tractable but loses nationality's distinctive, often non-chosen, character. Specificity captures nationality's distinctiveness but struggles to justify its moral priority over other deep identities without appealing to contingent features like state power (which loops back to cooperation/instrumentalism) or making morally arbitrary distinctions. Most theories sacrifice one for the other.

  9.  **The Most Excluding Requirement:**
      *   **Requirement:** Successfully accommodating the **'Mutual Indifference' Case** (Desideratum 1).
      *   **Why it Excludes Major Families:**
          *   **Instrumental/Cooperation Theories (Fair Play, Reciprocity, Mutual Advantage):** Fail categorically. If there's no functional state providing benefits/requiring cooperation *between* the two strangers, there's no cooperative scheme to ground duties *to each other*.
          *   **Contractualist Theories:** Struggle unless the hypothetical contract is defined in terms so abstract they lose connection to nationality, or unless they build in assumptions about national solidarity that need independent justification.
          *   **Strong Voluntarist Theories:** Fail if they require explicit consent or meaningful choice regarding the specific nationality tie. Birthright citizens haven't "taken on" the tie to *each specific unknown co-national*.
          *   **Cosmopolitan/Strong Universalist Theories:** While they might *deny* any special partiality exists in this case, the requirement is to *explain* it if it does exist, which they fundamentally cannot or will not do. This excludes them from the project of justifying *any* compatriot partiality.
          *   **Identity-Based Theories** *can* potentially meet this requirement (the tie is the shared identity itself), but they then face the challenge of Desideratum 6 (distinguishing from relationship) and the Specificity problem in tension 8.

  This specification provides a robust framework for evaluating theories against the complex realities of nationality, state action, and individual morality, highlighting the core challenges any successful account must navigate. Good luck running the scorecard in class!
