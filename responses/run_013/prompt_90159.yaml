  We are going to translate key concepts from market information theory (the efficient market hypothesis, no-trade theorems, and the market as an aggregator of information) into the language of probability, filtrations, conditional expectations, and scoring rules. We'll also address the two specific requests: (1) the no-trade reasoning for a proprietary model and (2) forecast combination versus market aggregation.

  ## Preliminaries: Setting up the Probability Framework

  We consider a probability space $(\Omega, \mathcal{F}, \mathbb{P})$ where:
  - $\Omega$: state space (all possible states of the world)
  - $\mathcal{F}$: $\sigma$-algebra representing all possible events
  - $\mathbb{P}$: a common prior probability measure (agreed upon by all agents)

  We have:
  - A set of agents $I$ (finite for simplicity).
  - Each agent $i \in I$ has a private information set represented by a $\sigma$-algebra $\mathcal{F}_i \subseteq \mathcal{F}$. This generates a filtration for each agent, but we are at a fixed time so we consider the current information.
  - The market price of an asset is a random variable $P$ (which we will see is $\mathcal{F}^M$-measurable for a market $\sigma$-algebra $\mathcal{F}^M$).
  - The asset has a future payoff $X$ (a random variable). We assume $X$ is square-integrable for simplicity.

  ## Translation of Key Claims

  ### Claim 1: Rational agents who share a prior cannot profitably trade on purely informational differences.

  **Translation:** 
  - Assume all agents have the same prior $\mathbb{P}$ and are risk-neutral (to avoid utility complications). 
  - Each agent's conditional expectation of $X$ given their information is $E[X|\mathcal{F}_i]$.
  - A trade (a bet) between two agents $i$ and $j$ would involve one buying and the other selling at a price $p$. The net expected profit of agent $i$ from buying one unit at price $p$ is $E[X - p | \mathcal{F}_i]$. Similarly, for agent $j$ selling, the expected profit is $E[p - X | \mathcal{F}_j]$. 
  - For the trade to occur, both must expect a non-negative profit (otherwise one would not trade). So we must have:
    - $E[X - p | \mathcal{F}_i] \geq 0$
    - $E[p - X | \mathcal{F}_j] \geq 0$
  - Adding these: $E[X - p | \mathcal{F}_i] + E[p - X | \mathcal{F}_j] = E[X|\mathcal{F}_i] - p + p - E[X|\mathcal{F}_j] = E[X|\mathcal{F}_i] - E[X|\mathcal{F}_j] \geq 0$.
  - But note that if both agents have the same information (i.e., $\mathcal{F}_i = \mathcal{F}_j$), then the difference is zero. However, even with different information, if they share the same prior, we can condition on the joint information. However, the key point is that if the price $p$ is set to be the conditional expectation of $X$ given the pooled information of all agents (i.e., $p = E[X | \sigma(\cup_{i} \mathcal{F}_i)]$), then no trade occurs because each agent's conditional expectation of $X$ given their own information would be the same as the market price? Not exactly.

  The no-trade theorem (Milgrom and Stokey, 1982) states that if agents are rational and share a common prior, then it is impossible for them to agree to a trade based solely on differences in information. The reason is that if there is a trade that both expect to be profitable, then by the law of iterated expectations (under the common prior) the trade must have zero expected value for both (and hence no strictly positive expected profit for both). 

  More precisely: 
  Suppose agent $i$ believes that buying at price $p$ is profitable: $E[X - p | \mathcal{F}_i] \geq 0$ (and strict with positive probability). Agent $j$ believes that selling at $p$ is profitable: $E[p - X | \mathcal{F}_j] \geq 0$ (strict with positive probability). Then, because both agents condition on their information and the common prior, we can take the expectation of $X - p$ with respect to the common prior and condition on the joint information. But note that the trade itself must be a zero-sum game: the gains of one are the losses of the other. Moreover, the common prior implies that the unconditional expectation of the trade is zero. However, the theorem shows that if the trade is voluntary and based solely on information (and not on risk-sharing or other motives), then such a trade cannot occur because it would require that both agents are strictly better off in expectation (conditionally on their own information) which leads to a contradiction.

  **Formal Translation:**
  - Let $\mathcal{G} = \sigma(\mathcal{F}_i, \mathcal{F}_j)$ be the joint information of agents $i$ and $j$. Then, by the law of iterated expectations:
    - $E[ E[X - p | \mathcal{F}_i] ] = E[X - p] = 0$ (because $E[X]$ is fixed and $p$ is a number? but $p$ is a random variable). Actually, $p$ is a random variable that is $\mathcal{F}_i \vee \mathcal{F}_j$-measurable? Not necessarily, but in the setting of the theorem, we assume that the price is set by the market and may reflect more information. However, the key is that under the common prior, the unconditional expectation of the net gain from trade for the buyer is zero: $E[X - p] = 0$. But then, if agent $i$ conditions on $\mathcal{F}_i$ and sees a nonnegative gain and sometimes positive, then agent $j$ must see a nonnegative gain from the opposite? But wait, the theorem states that if both conditionally expect a gain, then the trade cannot occur because it would imply:
      - $E[ (X - p) \cdot \mathbf{1}_A ] \geq 0$ for every $A \in \mathcal{F}_i$ and $E[ (p - X) \cdot \mathbf{1}_B ] \geq 0$ for every $B \in \mathcal{F}_j$. This leads to a contradiction because we can consider the event where both conditions hold strictly.

  A standard proof: 
  Suppose there is a trade. Let $T$ be the event that the trade occurs (which is in both $\mathcal{F}_i$ and $\mathcal{F}_j$ by the assumption that the agents know what they are doing). Then for agent $i$ we have $E[X - p | \mathcal{F}_i] \geq 0$ on $T$ and strictly positive on some subset of $T$ with positive probability. Similarly for agent $j$. Then consider the unconditional expectation:
    $E[ (X - p) \mathbf{1}_T ] = E[ E[X - p | \mathcal{F}_i] \mathbf{1}_T ] \geq 0$ and strictly positive if the trade occurs with positive probability and the gain is strictly positive with positive probability. Similarly, $E[ (p - X) \mathbf{1}_T ] = E[ E[p - X | \mathcal{F}_j] \mathbf{1}_T ] \geq 0$ and strictly positive. But note that $(X-p)\mathbf{1}_T + (p-X)\mathbf{1}_T = 0$, so the sum of the two expectations is zero. Therefore, we must have $E[ (X-p)\mathbf{1}_T ] = 0$ and $E[ (p-X)\mathbf{1}_T ] = 0$. This implies that the conditional expectations must be zero almost surely on $T$: $E[X-p | \mathcal{F}_i] = 0$ a.s. on $T$ and similarly for $j$. Therefore, there is no strictly profitable trade.

  **In your vocabulary:**
  - Premises:
    - Common prior: the probability measure $\mathbb{P}$ is fixed and shared.
    - Rationality: each agent uses conditional expectation given their information (and are risk-neutral).
    - The trade is purely informational: no exogenous reasons (like risk aversion) for trading.
  - Conclusion: There is no event in which both agents strictly expect a profit from trading. Any trade that occurs must have zero conditional expected profit for both agents.

  ### Claim 2: The price already reflects the information available to the market.

  **Translation:**
  The market price $P$ of the asset is such that it equals the conditional expectation of the future payoff $X$ given the market information. What is the market information? It is the aggregation of all agents' information. We define the market $\sigma$-algebra $\mathcal{F}^M$ as the $\sigma$-algebra generated by the equilibrium price and any other public information. In the rational expectations equilibrium, the price $P$ is $\mathcal{F}^M$-measurable and satisfies:
    $$ P = E[X | \mathcal{F}^M] $$
  Moreover, $\mathcal{F}^M$ is at least as fine as the $\sigma$-algebra generated by the pooling of all agents' private information? Not exactly: in the rational expectations equilibrium, the price itself reveals some of the private information. So we have $\mathcal{F}^M \supseteq \sigma(\cup_i \mathcal{F}_i)$? Actually, it is typically that $\mathcal{F}^M$ is the $\sigma$-algebra generated by the pooled information and the price function. But in the strong form, the price is a sufficient statistic for all the private information. This is the idea of "informational efficiency".

  **Formal Statement:**
  In a rational expectations equilibrium, the price $P$ satisfies:
    $$ P = E[X | \mathcal{F}^M] $$
  where $\mathcal{F}^M$ is the $\sigma$-algebra generated by the equilibrium price and any public information. Moreover, the market is efficient in the sense that the price aggregates all the private information: 
    $$ E[X | \mathcal{F}^M] = E[X | \sigma(\cup_{i \in I} \mathcal{F}_i)] $$
  That is, the price is as informative as the entire set of private signals.

  ### Claim 3: The market price as an authoritative aggregator.

  **Translation:** 
  The market price is a conditional expectation and hence is a martingale under $\mathbb{P}$ (with respect to the market filtration). Moreover, it is the best possible forecast in the sense that it minimizes the expected squared error (if we use squared loss) among all $\mathcal{F}^M$-measurable random variables. But more importantly, it is the conditional expectation given the pooled information. Therefore, for any agent $i$, conditioning on the market price and their own information does not change the expectation:
    $$ E[X | \mathcal{F}_i, \mathcal{F}^M] = E[X | \mathcal{F}^M] = P $$
  This is because the market price already incorporates the agent's private information (via the aggregation) and hence the agent's private information becomes redundant when the price is known.

  However, note that this strong form requires that the market aggregates all information perfectly. This is an equilibrium concept and may not hold in practice.

  ## Addressing the Two Specific Requests

  ### First Request: No-Trade Reasoning for a Proprietary Model

  **Scenario:** You have a proprietary model that has predicted an asset's returns better than the market's implied forecast on every sample you possess.

  **No-Trade Argument:**
  The no-trade theorem says that if the market is in a rational expectations equilibrium (with a common prior and rational agents), then the market price already reflects all available information, including the information that your model uses. Therefore, if your model is consistently outperforming the market, one of the premises must be violated. The premises are:
  1. Common prior: All agents share the same prior over the state space.
  2. Rationality: All agents update using Bayes' theorem and are risk-neutral (or have known risk preferences that are accounted for in the price).
  3. The market aggregates information perfectly: the price equals the conditional expectation given the pooled information.

  Therefore, if your model is beating the market, it must be that:
  - Either the common prior assumption is false (you have a different prior than the market),
  - Or the market is not in equilibrium (so the price does not reflect the pooled information),
  - Or your sample is not representative (you have been lucky),
  - Or the market participants are not rational (they are not using their information efficiently).

  In terms of a joint distribution: The common prior is a fixed $\mathbb{P}$. The market price $P$ is a random variable that must equal $E[X | \mathcal{F}^M]$. If your model produces a forecast $F$ (which is $\mathcal{F}_i$-measurable for your information $\mathcal{F}_i$), and if your information is included in the market's information ($\mathcal{F}_i \subseteq \mathcal{F}^M$), then by the law of iterated expectations:
    $$ E[X | \mathcal{F}_i] = E[ E[X | \mathcal{F}^M] | \mathcal{F}_i] = E[P | \mathcal{F}_i] $$
  Therefore, your forecast should not be able to beat the market's forecast (the price) conditionally on your information. In fact, the market price is a martingale with respect to your information if your information is a subset of the market's.

  But note: if your information is not contained in the market's, then you might have an edge. However, the rational expectations equilibrium assumes that the market price aggregates all private information (so your information is reflected in the price). Therefore, the only way you can have a genuine edge is if the market is not in equilibrium or if the common prior is violated.

  **Premises Required:**
  1. Common prior: fixed $\mathbb{P}$ (a condition on the joint distribution of all random variables, including the signals of all agents and the payoff).
  2. Rational expectations equilibrium: the price $P$ is $\mathcal{F}^M$-measurable and satisfies $P = E[X | \mathcal{F}^M]$, and $\mathcal{F}^M$ includes all the private information (in the sense that $E[X | \mathcal{F}^M] = E[X | \sigma(\cup_i \mathcal{F}_i)]$). This is an equilibrium condition that depends on the structure of the market and the agents' behavior.
  3. Your information $\mathcal{F}_i$ is included in $\mathcal{F}^M$: $\mathcal{F}_i \subseteq \mathcal{F}^M$. This is because the market aggregates all private information.

  If these hold, then by the law of iterated expectations, your forecast $F = E[X | \mathcal{F}_i]$ must equal $E[P | \mathcal{F}_i]$. Therefore, the market price is the best forecast given the market information, and your forecast is just a projection of the market price. Hence, you cannot have a conditional edge (i.e., $E[X | \mathcal{F}_i] \neq P$ with positive probability) without violating one of these premises.

  ### Second Request: Forecast Combination vs. Market Aggregation

  **Your Practice:** You combine forecasts by taking a weighted average (or using some other combination method) to improve accuracy.

  **Market Aggregation:** In the market, the aggregation is not a simple weighted average. In the rational expectations equilibrium, the market price equals the conditional expectation of $X$ given the pooled information: $P = E[X | \sigma(\cup_i \mathcal{F}_i)]$. This is a conditional expectation, which is the optimal aggregator under squared loss.

  However, note that the pooling of information in the market does not happen by explicitly averaging forecasts. Instead, it is the result of a competitive equilibrium where agents trade based on their private information. The resulting price is a sufficient statistic for all the private information.

  **Comparison:**
  - In your forecast combination, you take a set of forecasts (which are random variables) and combine them (e.g., linearly) to form a new forecast. The weights are chosen to minimize a loss function (e.g., mean squared error) on past data.
  - In the market, the aggregation is the conditional expectation given the pooled information. This is the best possible aggregator under squared loss (the conditional expectation minimizes the expected squared error). Therefore, if the market achieves this, then it is better than any linear combination of individual forecasts (unless the linear combination happens to be the conditional expectation).

  However, the market aggregation is not a weighted average of individual forecasts (like $F_i = E[X | \mathcal{F}_i]$) in general. It is a function of the entire information set. In special cases (e.g., if signals are Gaussian and utilities are exponential), the equilibrium price is a linear combination of the individual signals. But in general, it is not.

  **Do the properties survive?**
  The key property of forecast combination that you rely on is that by combining multiple forecasts, you can reduce variance and bias, leading to improved accuracy. In the market setting, the aggregation (being the conditional expectation) is the minimum variance unbiased estimate (if we consider conditional unbiasedness). Therefore, the market aggregation is the gold standard.

  However, note that in your practice, you are combining forecasts that are produced by different models or experts. In the market, the aggregation is achieved by the equilibrium price. The difference is that in the market, the agents' forecasts (their conditional expectations) are not directly observed by the market; instead, the agents reveal information through their trading decisions. The aggregation is implicit.

  **Surviving Properties:**
  - The idea that aggregating more information leads to a better forecast: this holds in both.
  - The conditional expectation (the market price) is the best aggregator: this is what you aim for in your combination, but you might not achieve it because you don't have access to the raw information (only the forecasts) and you might not know the optimal weights.

  **Non-Surviving:**
  - The method of combination: you use a weighted average of forecasts, but the market uses a more general mechanism (a function of the entire information set) that may be nonlinear.

  ## Residue Report

  We now assess what translated cleanly, what translated with distortion, and what did not translate.

  ### Clean Translations:
  1. **No-trade theorem:** The translation using the common prior and conditional expectations is clean. The premise of common prior and rationality (using conditional expectations) is directly expressible in your vocabulary. The conclusion (no strictly profitable trade) follows from the properties of conditional expectation and the law of iterated expectations.
  2. **Market price as conditional expectation:** The idea that the price equals the conditional expectation of the payoff given the market information is a direct translation. The market information $\mathcal{F}^M$ is the $\sigma$-algebra generated by the equilibrium price and public information, and the price is $\mathcal{F}^M$-measurable.

  ### Translations with Distortion:
  1. **Market aggregation of information:** The claim that the market price aggregates all private information (i.e., $P = E[X | \sigma(\cup_i \mathcal{F}_i)]$) is an equilibrium concept. The translation requires not only the joint distribution but also an equilibrium condition (how the price is formed by the interaction of agents). This is not a condition on a fixed joint distribution alone; it is a condition on the equilibrium of a game. Therefore, it introduces game-theoretic elements that are not part of your standard vocabulary (which assumes a fixed data-generating process). 
     - Distortion: We are importing the equilibrium concept as an additional structure. In your framework, the data-generating process is fixed and does not depend on agents' actions. In the market setting, the price (which is part of the data-generating process) is endogenous.

  ### Pieces That Did Not Survive:
  1. **Endogeneity of the Data-Generating Process:** In your framework, the process generating outcomes is fixed and unaffected by forecasts. In the market setting, the price (which is an outcome) is determined by agents' forecasts and trades. This feedback loop (where the forecast affects the outcome) is not captured by your vocabulary. The rational expectations equilibrium is a fixed point: the price is such that when agents condition on it, their demands lead to that same price. This fixed-point condition has no direct analog in your single-decision-maker, exogenous-sampling framework.
     - Verdict: This is a gap in your vocabulary. As a statistician, you typically do not model how your forecast might affect the outcome (unless in a decision-theoretic setting with a known response). The market setting requires a game-theoretic equilibrium.
  2. **Heterogeneous Priors:** The common prior assumption is critical to the no-trade theorem. In practice, agents might have different priors. Your vocabulary can handle different priors (by having different probability measures), but the no-trade theorem then fails. However, the original claim (about rational agents with a common prior) translates cleanly. The residue is that the common prior assumption is a strong one and might not hold.
     - Verdict: This is not a gap in your vocabulary. You can model different priors. But the original claim relies on the common prior, so without it the claim does not hold.
  3. **Risk Preferences:** The basic no-trade theorem assumes risk neutrality. With risk aversion, even with a common prior, trades can occur for risk-sharing reasons. Your vocabulary can incorporate risk aversion by using expected utility, but then the conditional expectation is not the whole story. The original claim (about purely informational trades) excludes risk-sharing, so it translates cleanly under the risk-neutrality assumption. However, in real markets, risk-sharing is a motive for trade. 
     - Verdict: The translation requires the import of risk-neutrality. Without it, the claim doesn't hold. This is an example of the original claim being less general than it might seem.

  ## Conclusion

  The translation of the market efficiency claims into the language of probability and conditional expectations is largely successful for the core concepts (no-trade theorem, price as conditional expectation) under the assumptions of common prior, risk neutrality, and rational expectations equilibrium. However, the equilibrium concept itself and the endogeneity of the price (which depends on agents' actions) introduce elements that go beyond your standard framework. These are gaps in the sense that your vocabulary does not natively include game-theoretic equilibrium conditions. 

  Additionally, the assumption of a fixed data-generating process is violated in the market setting because the price (a key variable) is determined by the agents' information and actions. Therefore, when you test your proprietary model against the market, you are implicitly assuming that the market price is generated by a fixed process that does not adjust to your model. But in the rational expectations framework, if your model were widely known, it would be incorporated into the price and your edge would vanish. This reflexivity is not captured in your framework.

  Finally, the market aggregation is the conditional expectation of the payoff given the pooled information, which is the optimal aggregator under squared loss. Your forecast combination methods are approximations to this, but in the market it is achieved by an equilibrium mechanism. The properties of optimality (minimum mean squared error) survive, but the mechanism does not.
answer: |-
  ### Translation of Market and Information Theorems into Statistical Vocabulary

  #### Claim 1: Rational agents with a common prior cannot profitably trade on purely informational differences  
  **Translation:**  
  Consider a probability space $(\Omega, \mathcal{F}, \mathbb{P})$ where $X$ is the payoff of a tradable asset. Agents $i$ and $j$ have sub-$\sigma$-algebras $\mathcal{F}_i, \mathcal{F}_j \subseteq \mathcal{F}$ representing their private information. Assume:  
  1. **Common prior**: All agents share $\mathbb{P}$.  
  2. **Rational expectations**: Agents maximize expected utility (here, simplified to risk-neutrality: $U(W) = W$).  
  3. **No exogenous trade motives**: Trade is purely informational (no risk-sharing or liquidity needs).  

  The no-trade theorem states:  
  If a trade occurs at price $p$, then for both agents:  
  $$\mathbb{E}[X - p \mid \mathcal{F}_i] \geq 0 \quad \text{(buyer's condition)}$$  
  $$\mathbb{E}[p - X \mid \mathcal{F}_j] \geq 0 \quad \text{(seller's condition)}$$  
  Under $\mathbb{P}$, these imply:  
  $$\mathbb{E}[X - p \mid \mathcal{F}_i] = \mathbb{E}[p - X \mid \mathcal{F}_j] = 0 \quad \text{a.s.}$$  
  **Proof via law of iterated expectations**:  
  Let $\mathcal{G} = \sigma(\mathcal{F}_i \cup \mathcal{F}_j)$. Then:  
  $$
  \mathbb{E}[\mathbb{E}[X - p \mid \mathcal{F}_i]] = \mathbb{E}[X - p] = 0
  $$  
  Strict inequality in either condition would violate this, contradicting $\mathbb{P}$.  

  **Premises for no-trade**:  
  - Common prior (fixed $\mathbb{P}$).  
  - Trade motives restricted to informational advantage.  
  - $\mathbb{P}$-martingale property of $X$ under pooled information $\mathcal{G}$.  

  ---

  #### Claim 2: Prices reflect available information (Efficient Market Hypothesis)  
  **Translation:**  
  Let $\mathcal{F}^M$ be the $\sigma$-algebra generated by market prices and public information. In rational expectations equilibrium:  
  $$P_t = \mathbb{E}[X \mid \mathcal{F}^M_t]$$  
  where $\mathcal{F}^M_t$ subsumes all private information: $\sigma(\cup_i \mathcal{F}_i) \subseteq \mathcal{F}^M_t$. This implies:  
  1. **Informational efficiency**: $P_t$ is a $\mathbb{P}$-martingale with respect to $\{\mathcal{F}_t\}$.  
  2. **No forecast dominance**: For any $\mathcal{F}_i$-measurable forecast $F_i$,  
     $$\mathbb{E}[(X - P_t)^2] \leq \mathbb{E}[(X - F_i)^2] \quad \text{(under quadratic loss)}$$  

  ---

  #### Claim 3: Market price as aggregator of dispersed knowledge  
  **Translation:**  
  Define $\mathcal{F}_{\text{pooled}} = \sigma(\cup_i \mathcal{F}_i)$. In equilibrium:  
  $$P_t = \mathbb{E}[X \mid \mathcal{F}_{\text{pooled}}]$$  
  This aggregation has properties:  
  1. **Sufficiency**: $P_t$ is a sufficient statistic for $X$ relative to $\mathcal{F}_{\text{pooled}}$.  
  2. **Orthogonality of forecast errors**: For any agent $i$,  
     $$\mathbb{E}[ (X - P_t) \cdot (P_t - \mathbb{E}[X \mid \mathcal{F}_i]) ] = 0$$  

  ---

  ### Addressing Specific Requests  

  #### 1. Proprietary Model vs. Market Forecast  
  **Scenario**: Your forecast $F_{\text{you}} = \mathbb{E}[X \mid \mathcal{F}_{\text{you}}]$ consistently beats market price $P_t$:  
  $$\mathbb{E}[(X - F_{\text{you}})^2] < \mathbb{E}[(X - P_t)^2] \quad \text{on your dataset}$$  
  **No-trade argument against your edge**:  
  - If $\mathcal{F}_{\text{you}} \subseteq \mathcal{F}_{\text{pooled}}$ and $\mathbb{P}$ is common, then:  
    $$F_{\text{you}} = \mathbb{E}[P_t \mid \mathcal{F}_{\text{you}}] \quad \text{(by iterated expectations)}$$  
  - Your apparent outperformance implies:  
    $$\mathbb{E}[F_{\text{you}}(X - P_t)] > 0$$  
    but by the martingale property of $P_t$, $\mathbb{E}[X - P_t \mid \mathcal{F}_{\text{pooled}}] = 0$. Contradiction.  

  **Premises required**:  
  | Premise                          | Location in Your Vocabulary          | Expressible as Joint Distribution? |  
  |----------------------------------|--------------------------------------|-------------------------------------|  
  | Common prior $\mathbb{P}$        | Fixed measure on $(\Omega, \mathcal{F})$ | Yes (definitional) |  
  | $\mathcal{F}_{\text{you}} \subseteq \mathcal{F}_{\text{pooled}}$ | Sub-$\sigma$-algebra inclusion   | No (requires equilibrium concept) |  
  | $P_t = \mathbb{E}[X \mid \mathcal{F}_{\text{pooled}}]$ | Martingale property             | No (endogenous to equilibrium) |  

  **Conclusion**: Apparent arbitrage implies violation of premises—likely $\mathcal{F}_{\text{you}} \not\subseteq \mathcal{F}_{\text{pooled}}$ (your information isn't aggregated) or $\mathbb{P}$ isn't shared.  

  ---

  #### 2. Forecast Combination vs. Market Aggregation  
  **Your practice**: Given forecasts $F_1, \dots, F_K$, you compute $F_{\text{pool}} = \sum w_k F_k$ to minimize $\mathbb{E}[(X - F_{\text{pool}})^2]$.  

  **Market aggregation**: The market solves:  
  $$P_t = \mathbb{E}\left[X \;\middle|\; \sigma\left( \bigcup_{i=1}^N \mathcal{F}_i \right)\right]$$  
  This is:  
  - **Not a weighted average** of $F_i = \mathbb{E}[X \mid \mathcal{F}_i]$, except in special cases (e.g., Gaussian signals).  
  - **Implicitly optimal**: Minimizes $\mathbb{E}[(X - P_t)^2]$ over all $\mathcal{F}_{\text{pooled}}$-measurable functions.  

  **Comparison of properties**:  
  | Property                     | Your Forecast Combination | Market Aggregation |  
  |------------------------------|---------------------------|--------------------|  
  | Minimizes quadratic loss     | Yes (by construction)     | Yes (by definition) |  
  | Incorporates cross-correlations | Explicit optimization  | Implicit in equilibrium |  
  | Weight transparency          | Controllable ($w_k$)      | Emergent (no weights) |  
  | Requires known DGP           | Yes (for weight tuning)   | No (weights endogenous) |  

  **Key difference**: Market aggregation uses raw information ($\mathcal{F}_i$), not forecasts ($F_i$). Under Gaussianity, $P_t$ equals the Bayesian posterior, which your linear pool approximates.  

  ---

  ### Residue Report: What Doesn't Translate  

  #### 1. Endogenous Information Aggregation  
  - **Claim**: Market price aggregates private information via trading.  
  - **Translation failure**: In your framework, $\mathcal{F}_{\text{pooled}}$ is given exogenously. Markets *generate* $\mathcal{F}_{\text{pooled}}$ as equilibrium $\sigma$-algebra.  
  - **Verdict**: Gap in vocabulary. Statisticians lack tools to model how agents' actions (trades) endogenously reveal information. Requires game-theoretic equilibrium concepts.  

  #### 2. Refutability of Persistent Arbitrage  
  - **Claim**: Consistent outperformance of market prices is impossible under efficiency.  
  - **Translation failure**: Your framework treats the DGP as fixed. Markets assert that if arbitrage persists, the DGP (price process) adapts to eliminate it.  
  - **Verdict**: Original claim overreaches. It implicitly assumes equilibrium stability, which isn't testable without dynamics.  

  #### 3. Emergence of Sufficiency  
  - **Claim**: Price becomes sufficient statistic for private information.  
  - **Translation failure**: Sufficiency in your framework is a pre-specified property. Markets *make* prices sufficient via equilibrium.  
  - **Verdict**: Evidence that the claim is a corollary of stronger assumptions (rational expectations, common prior).  

  ---

  ### Final Verdict  
  - **Clean translations**: Martingale property of prices, no-trade under common priors, and optimal aggregation under quadratic loss translate directly.  
  - **Distorted translations**: Market efficiency requires importing equilibrium assumptions (e.g., $\mathcal{F}^M_t = \sigma(\cup_i \mathcal{F}_i)$) that violate exogeneity of information.  
  - **Untranslatable elements**: Endogenous information revelation and equilibrium formation are gaps in the statistical vocabulary. They require game theory, which your framework excludes by design.  
  - **Verdict on originals**: Claims about markets as aggregators are descriptive of equilibrium states, not general laws. Their empirical content relies on ancillary assumptions (no transaction costs, rational agents) that statisticians might reject.  

  > **Bottom line**: The market theorems are best viewed as existence proofs for efficient aggregation under idealized conditions—not as empirical claims about your proprietary models. When your forecast beats the market, it signals either model superiority (violating their premises) or temporary disequilibrium (which their framework assumes away).
