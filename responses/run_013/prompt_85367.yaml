prompt: |-
  Suppose we set aside the two familiar defenses of an advance directive — that it expresses the autonomy of the earlier self, and that it protects the interests of the later self — and instead treat it as a promise that the earlier self made to the person she would become. Describe the most important implications of that promissory reading, both for a case in which a patient with dementia no longer recognizes her family but is now cheerful and says she wants to live, and for the general question of how much deference a directive should receive once the later self no longer endorses it. Be explicit about which implications are distinctive of the promissory reading and which are shared with the two views we set aside.
reasoning: |-
  Okay, the user is asking about interpreting advance directives as promises from the earlier self to the future self. They want implications for two scenarios: a dementia patient who's now cheerful but doesn't recognize family, and the general issue of deference when the later self disagrees. I need to highlight what's unique to this promissory view versus traditional autonomy/interest-based defenses.

  First, let me unpack the dementia case. The patient wrote a directive refusing life-prolonging care but now seems happy to be alive. Under promise logic, this creates tension between the past self's vow and present self's wellbeing. Unlike autonomy arguments which prioritize past decisions, or welfare arguments focused solely on current happiness, the promissory frame forces us to weigh fidelity to one's word against present contentment. The key distinctive implication here is that the earlier self made a commitment expecting to be bound by it - almost like a contract with one's future identity.

  For the deference question... Hmm, this is more abstract. The promissory view suggests directives deserve significant weight even without endorsement, similar to how we keep promises others have stopped caring about. But unlike autonomy theories that see revocation as impossible (since the "real self" spoke earlier), promise ethics allows more nuance - we'd consider factors like how radically the person changed, or whether the promise was reasonable. The shared aspect with other theories? All three agree directives shouldn't be ignored lightly, but for different reasons: autonomy sees overriding as disrespect, welfare concerns instability, promise theory emphasizes integrity.

  Wait, should I address how this affects caregivers? The user didn't ask but... yes, subtly. In the dementia case, family might feel morally torn between honoring "mom's true wishes" and not harming her current happy self. Promise framing could ease this by recognizing both as valid concerns rather than pitting "real mom" against "shell of mom." That relational dimension feels important.

  Also noting - the user seems philosophically sophisticated. They're not asking for basic definitions but for comparative implications. Probably academic or ethics professional. Might appreciate me flagging where promise theory creates new dilemmas (e.g., is it paternalistic to hold someone to a promise when they've forgotten making it?) versus resolving old ones.

  Better wrap up with why this matters practically. For clinicians, promise theory could justify following directives against current wishes in mild dementia but not severe cases where identity rupture occurs. For policy, it suggests advance care documents should include commitment language to strengthen their promissory force. The autonomy/welfare views can't claim that particular implication.
answer: |-
  Treating an advance directive as a **promise from the earlier self to the later self** generates distinct implications for both the dementia case and the general question of deference, while sharing some ground with autonomy and interest-based views. Here's a breakdown:

  **Key Distinctive Implications of the Promissory Reading:**

  1.  **The Primacy of Commitment & Fidelity:** The core moral force shifts to keeping one's word to oneself. Violating the directive is framed as *breaking a promise*, regardless of current interests or autonomy. This introduces a specific duty of *self-fidelity*.
  2.  **Identity Continuity as Foundational:** The promise rests on the assumption of a continuous personal identity ("I now promise to *my future self*"). If identity rupture is severe (e.g., profound dementia where psychological connectedness is minimal), the promise itself might be seen as dissolving or becoming void *because the recipient (the promised-to self) no longer exists*. This is a unique vulnerability.
  3.  **Potential for Self-Paternalism:** The earlier self, in making the promise, acts based on its own judgment about what the future self *should* want or endure, even anticipating the future self might disagree. This resembles a promise to protect oneself from future "weakness" or "bad judgment."
  4.  **The Moral Weight of Past Commitment:** Even if the later self no longer endorses the directive, the promissory reading suggests the *past act of commitment* retains significant moral weight. Overriding it requires justification beyond mere current preference, akin to breaking any serious promise.
  5.  **Focus on the Act of Promising:** The moral significance lies not just in the *content* of the directive (like interests) or the *act of choosing* (like autonomy), but in the specific *performative act* of making a promise to one's future self.

  **Implications for the Dementia Case (Cheerful Patient, Wants to Live):**

  *   **Distinctive:**
      *   **Tension:** The core conflict is between *keeping the promise* made to avoid a certain state of existence and *harming the current self* by acting against its expressed wish to live. Harm isn't just experiential (she's cheerful) but relational (breaking the promise).
      *   **Identity Threshold:** The crucial question becomes: "Is this *still the person* to whom the promise was made?" If the dementia is so advanced that psychological connections (memories, values, core identity) are utterly severed, the promise *might* no longer bind, as the recipient (the earlier envisioned future self) is gone. The cheerful person inhabiting the body is seen as a different moral entity. *This is a distinctive and complex implication.*
      *   **Self-Betrayal vs. Self-Harm:** Acting on the directive against current wishes could be seen as the earlier self *betraying* the current self via the broken promise, *or* as the current self being harmed by an external imposition based on a past commitment it doesn't recognize. The promissory frame highlights this ambiguity.
      *   **Mitigating Factor - Changed Circumstances:** If the promise was made anticipating suffering and the current self is cheerful, this unexpected positive state could be seen as a fundamental change releasing the earlier self (or its proxy) from the obligation, similar to promises becoming void due to unforeseen events.
  *   **Shared (but with different grounding):**
      *   **Directive Should Be Considered:** Like autonomy views (respect past choice) and interest views (it *might* still reflect underlying interests), the promissory reading mandates taking the directive seriously as a prior commitment.
      *   **Current Well-being Matters:** Like interest views, the current cheerful state is highly relevant. However, interest views see it as *primary* (promoting current welfare), autonomy views might downplay it (respecting past autonomy), while the promissory view sees it as a *factor potentially releasing from the promise* or complicating its enforcement without harming the recipient.

  **Implications for General Deference (Later Self No Longer Endorses):**

  *   **Distinctive:**
      *   **Strong Presumption for Deference:** The promissory frame creates a strong *prima facie* obligation to adhere to the directive, akin to upholding any solemn promise, even if the beneficiary (the later self) now rejects it. The moral wrong is breaking one's word.
      *   **Justification Burden Shifts:** Those wishing to override the directive bear the burden of proving why the promise *should not* be kept (e.g., identity rupture, fundamental unforeseen change, the promise being unreasonable/impossible to fulfill without harming the unrecognizing self).
      *   **Nature of Revocation:** Revocation by the later self is not automatically decisive. Unlike autonomy views which often see contemporaneous wishes as paramount, or interest views focused solely on current welfare, the promissory view asks: "Does the later self have the *authority* or *standing* to release the earlier self (or its proxy) from this promise?" This depends heavily on the degree of identity continuity. A radically changed self might lack that standing.
      *   **Proxy as Promise-Keeper:** The surrogate's role is explicitly framed as an *agent of the earlier self*, tasked primarily with *fulfilling the promise* to the extent possible for the current self, balancing fidelity with avoiding direct harm.
  *   **Shared:**
      *   **Directive is Not Absolute:** All three views (autonomy, interests, promise) recognize that directives shouldn't be followed blindly into harmful or absurd situations. There are limits.
      *   **Changed Circumstances Matter:** All views allow that significant changes in prognosis, treatment options, or the patient's condition/values can justify deviation. The *reason* differs: autonomy (changed facts alter the basis of the choice), interests (changed facts alter welfare calculations), promise (changed facts release from the obligation).
      *   **Later Self's Wishes are Relevant:** No view completely ignores the current self's expressed wishes. However, their *weight* differs drastically: central for interests, often decisive for autonomy in competent patients, but potentially secondary to the promise unless identity rupture is severe.

  **In Summary:**

  The promissory reading uniquely emphasizes **fidelity to one's past commitment** as a core moral principle. It creates a strong obligation to follow the directive, framing deviation as promise-breaking. This obligation is fundamentally tied to **personal identity continuity**. When identity rupture is profound (as in advanced dementia), the promise may dissolve. In less severe cases, or when the later self simply changes its mind without radical discontinuity, the promise retains significant force, demanding strong justification for override. While sharing the practical conclusion that directives matter and aren't absolute with autonomy and interest views, the promissory reading provides a distinct *reason* – the moral imperative of keeping a promise to oneself – and introduces the critical, unique factor of **assessing identity continuity** to determine if the promise still binds.
