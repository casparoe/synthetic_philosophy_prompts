prompt: |-
  I spent thirty-five years as an experimental scientist before I retired, and for most of that time I took it as given that to understand a domain is to find the general laws that govern it. Since retiring I have been reading moral philosophy, and I have been trying to give an honest hearing to a view that runs against that instinct. Call it particularism: the thesis that there are no true moral principles, because whether a given feature of a situation counts as a reason for or against an action, and how it counts, depends on the rest of the context. On this view no general claim to the effect that a given feature counts in favor of a given course of action is true across the board; the very feature that is a reason to act in one case may be no reason, or a reason to act the opposite way, in another. That an act brings someone pleasure, for instance, is ordinarily a point in its favor, but not when the pleasure is taken in another's suffering.

  I drafted a short paper arguing that this position proves too much, and the argument I produced now strikes me as too smooth. I would like you to identify the step I should abandon and to tell me what abandoning it costs.

  (1) A moral principle, in the sense at issue, is a general claim to the effect that some feature of a situation — that an act is a lie, that it causes pleasure — is a reason for or against acting in a certain way, in virtue of that feature.
  (2) Particularism asserts that for every such feature there is some context in which it is not a reason, or is a reason the other way; no feature carries the same reason-giving force across all contexts.
  (3) If no feature carries the same force across all contexts, then no general claim of the kind characterized in (1) is true.
  (4) Hence, if particularism is true, no moral principle is true.
  (5) But particularism is itself a general claim, and a claim about reasons: it asserts, of any feature whatever, that it is not uniformly a reason.
  (6) Therefore particularism is itself a moral principle of the kind characterized in (1).
  (7) By (4), if particularism is true then no moral principle is true; by (6), particularism is a moral principle; so if particularism is true, particularism is not true.
  (8) Therefore particularism is false.

  I am confident that something has gone wrong, because I do not believe that a philosophical position is refuted by the observation that it is a philosophical position. But I cannot find the error, and I would rather not save particularism by sleight of hand. I am attached to (2), which seems to me the honest statement of the view, and I would be reluctant to give it up. Tell me which premise or step to reject, why it looked acceptable in the first place, and what rejecting it costs — in particular, whether rejecting it commits me to the existence of moral principles in some sense the particularist ought to care about, or whether it leaves particularism standing but diminished.
reasoning: |-
  Hmm, the user is a retired experimental scientist who's now exploring moral philosophy, particularly particularism. They've drafted a reductio argument against particularism but suspect it's flawed. Their argument concludes that particularism self-destructs by declaring itself false, which feels too tidy for such a nuanced position. They want me to identify the faulty step without watering down particularism's core claims.

  The argument hinges on eight steps. Premises (1)-(4) set up particularism as denying invariant moral principles. Step (5) notes particularism makes a general claim about all features, and (6) declares this makes it a moral principle itself. The contradiction arises in (7)-(8): if particularism is true, it must be false.

  The user is attached to (2) as an accurate representation of particularism and wants to preserve its essence. I need to find which step is problematic. 

  Looking closely, the flaw seems to be in step (6). Particularism is *about* moral reasons but isn't itself *giving* a moral reason for action. Premise (1) defines moral principles as claims that a feature (like lying) is a reason *for or against an action*. But particularism's claim—"features aren't uniformly reasons"—doesn't tell us to *do* anything specific; it's meta-ethical, not normative. It analyzes how reasons work rather than prescribing conduct. 

  Step (6) equivocates by stretching (1)'s definition to cover this meta-claim. That's why it initially seemed plausible: both discuss reasons. But the cost of rejecting (6) is clarifying that particularism operates at a different level—it's a view *about* moral principles, not one itself. This leaves particularism intact but must accept that its own claim has universal scope, which might feel "principle-like" even if not normative. 

  The user might worry this concedes too much, but it doesn't. Particularism can consistently hold that *normative* principles lack invariance while making a meta-claim about them. The key is distinguishing between ethics and meta-ethics. 

  Rejecting (6) costs little: it just requires precision in definitions. Particularism remains unrefuted, still challenging the existence of invariant action-guiding rules. The user's scientific instinct for general laws isn't threatened—it's just redirected to understanding how context functions systematically in ethics.
answer: |-
  You've crafted a clever reductio ad absurdum, but the error lies in **step (6)**: the claim that particularism itself qualifies as a "moral principle" in the sense defined in premise (1). Let's break this down:

  ### Why (6) is the flaw:
  1. **Premise (1) defines a moral principle as a claim that a feature (e.g., lying, causing pleasure) is a reason *for or against a specific action***.  
     - Example: "Lying is always a reason against an action" or "Causing pleasure is always a reason in favor."  
     - These are **normative claims**: they directly guide action by prescribing what counts as a reason to act/not act.  

  2. **Particularism (as defined in (2)) is a *meta-ethical* claim, not a normative one**:  
     - It states: "No feature *functions* as a uniform reason across all contexts."  
     - This is a claim **about how moral reasons operate**, not a claim that any specific feature (e.g., lying) is itself a reason for/against an action.  
     - It does not say, "You should do X in situation Y." It says, "There are no invariant rules linking features to reasons."  

  3. **Particularism is not self-applicable in the way (6) assumes**:  
     - Premise (1) requires a principle to link a *concrete feature* (e.g., pain, promise-keeping) to a practical reason.  
     - Particularism’s subject is not a concrete feature but *the abstract property of being a feature*. It asserts: "For any feature F, F is not invariably a reason."  
     - This is a **second-order claim** about moral reasoning, not a **first-order moral principle** that guides action.  

  ### Why (6) seemed plausible initially:
  - **Ambiguity in "feature"**: Premise (1) uses "feature" to mean *substantive properties of actions* (e.g., causing pain). Step (6) surreptitiously stretches "feature" to include *theoretical properties* (e.g., "being a feature that isn’t uniformly reason-giving"). This equivocation makes particularism seem like it falls under its own critique.  
  - **Overgeneralization**: It’s tempting to think, "Particularism makes a general claim about reasons, so it must be a principle." But not all general claims about morality are *moral principles* in the normative sense defined in (1). Meta-ethical claims (e.g., "Moral facts are mind-independent") are general but not action-guiding.  

  ### What rejecting (6) costs you:
  1. **No commitment to substantive moral principles**:  
     - Abandoning (6) leaves particularism intact. You can consistently deny that *any concrete feature* (lying, kindness, etc.) invariably counts as a reason, while maintaining your second-order thesis about context-dependence.  
     - Particularism remains a view *about* moral reasons, not a competitor *within* the space of moral reasons.  

  2. **A weakened but coherent particularism**:  
     - **Cost**: Particularism can no longer deny *all* invariant generalizations. It must accept that *its own thesis* is a context-invariant truth about moral reasoning.  
     - **Implication**: While no *first-order feature* (e.g., pain) is always a reason, particularism asserts an *invariant second-order truth*: "Context determines the reason-giving force of features." This is a "principle" in a broader sense, but not the kind the particularist opposes.  
     - **Result**: Particularism is "diminished" in that it cannot be radically skeptical—it must allow at least one exceptionless generalization (itself). But this is a feature of nearly all philosophical views (e.g., "All truths are relative" must exempt itself).  

  3. **What particularism retains**:  
     - It still denies the existence of *action-guiding moral principles* (e.g., "Lying is always wrong"). Its core critique—that reasons are irreducibly context-dependent—stands unchallenged by your reductio.  
     - This aligns with prominent particularists (e.g., Jonathan Dancy), who argue their view is a meta-ethical stance compatible with the absence of normative principles.  

  ### Conclusion
  By rejecting step (6), you preserve particularism’s essence—its denial of invariant *normative* principles—while conceding that it must hold itself to a different standard. The cost is minimal: particularism becomes a modestly self-exempting meta-theory, which is philosophically defensible. Your reductio fails because it conflates levels of analysis, treating a meta-ethical claim as if it were a normative one. 

  This leaves particularism standing, albeit with a clarified scope: it opposes *first-order moral principles* but relies on a *second-order invariant claim* about how reasons function. This is a cost any particularist should accept, as it doesn’t threaten their core project of defending context-sensitivity in ethics.
