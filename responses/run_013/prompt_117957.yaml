prompt: |-
  Ok so I just spent three hours arguing with a friend of mine (law student, insufferable) about juries and appellate courts, and I need an outside oppinion before I lose my mind. Take the role of a philosopher of law who also actually knows the social choice literature, and please think carefully before you answer — I'd rather you start by brainstorming the different things these practices *could* be committed to, lay out the candidates, and then tell me which one you actually think it is and why. Don't bother with citations or reading lists; I don't care who said what first, I want the argument.

  Here's what set it off. Two things courts do that seem to pull in opposite directions.

  First: a criminal jury normally has to be unanimous on the verdict, but it isn't asked to agree on its reasons, and it generally isn't supposed to explain itself at all. We get "guilty" and that's it. So: total agreement demanded on the conclusion, complete indifference to agreement on the premises. Twelve jurors, twelve incompatible stories, all fine.

  Second: in a civil case the judge can hand the jury a list of narrow factual questions instead — was there a contract, did the defendant breach it, were the damages foreseeable — and the verdict just gets assembled out of the answers. Now it's the reverse: we demand agreement on the premises, and the conclusion is arithmetic.

  Then she hits me with this and I can't stop thinking about it. Three judges on a panel. The rule is the plaintiff wins only if (i) there was a valid contract and (ii) the defendant breached it. Judge A: contract yes, breach yes, so plaintiff wins. Judge B: contract yes, breach no, so defendant wins. Judge C: contract no, breach yes, so defendant wins. Vote on the outcome: 2–1 to dismiss. Vote issue by issue: 2–1 that there was a contract, 2–1 that there was a breach. Same three judges, same three opinions, and the court reaches opposite results depending only on whether you count conclusions or count reasons. And it isn't hypothetical — courts really do both, they vote on the disposition, and then separately we try to figure out what "the court held," which gets genuinely strange when the court splits 4–2–3 and no five people agree on a single sentence of reasoning. There's apparently some rule that lower courts should follow the narrowest opinion among the judges who agreed on the outcome, which means the law can effectively be set by an opinion a majority of the court rejected. Meanwhile the whole system is obsessed with consistency — precedent, like cases alike, one law for everyone — except that a jury is explicitly allowed to be twelve inconsistent people who happen to agree on a verdict.

  So: what does all of this presuppose? I want you to reconstruct the implicit theory, not tell me what the cases say. In particular:

  - Does the practice need to assume the group is a single rational agent with logically consistent beliefs? Or is it enough that the *outcome* is consistent — you can't both convict and acquit the same defendant? Or does it assume nothing about group minds at all, and this is all just a bookkeeping convention for producing a decision?
  - When a panel votes only on the bottom line, is that treating reasons as private and the verdict as the only public thing? Or is it treating the verdict as the thing with authority and the reasons as decoration? Are those actually different, and does the practice need to pick?
  - Is unanimity in the jury doing legitimacy work (we accept it because you all agreed) while the fractured-opinion mess is doing correctness work (we accept it because that's the law, agreement or not)? Can one system coherently hold both at once, or is one of them a fiction the other one quietly exposes?
  - What does it presuppose about whether a group can have a will or a judgment at all, as opposed to a tally of individual ones? If a court "holds" something no majority believes, in what sense did the court hold it?
  - Which parts are strictly presupposed, which parts would survive if we swapped the underlying picture, and where is the practice merely underdetermined — i.e. several incompatible pictures would license exactly what we do? I suspect it's underdetermined in more places than my friend thinks, and I want to know which ones.
  - And what would actually have to change if we committed to one picture — say, that group judgments are only ever defined over the bottom line, or only ever over the reasons? Would we have to stop talking about "the holding" of a fractured court? Would juries have to start giving reasons?

  Give me a real answer, not a survey of positions. If you think the honest answer is "the practice is a mess that presupposes nothing coherent," say that, and then tell me what the least incoherent repair looks like.
reasoning: |-
  Okay, the user is really frustrated after a three-hour debate with their law student friend about juries and appellate courts. They're looking for a deep analysis of the implicit theories behind these legal practices. Let me start by breaking down their main points.

  First, they mentioned criminal juries requiring unanimity on the verdict but not on the reasons. Then civil cases where juries answer specific questions, leading to a verdict based on those answers. The appellate court example shows how voting on outcomes versus issues can lead to opposite results. The user wants to know what these practices presuppose about group rationality, consistency, and authority.

  The user’s explicit questions focus on whether the system assumes a group as a single rational agent, the role of unanimity versus correctness, and the coherence of holding both approaches. They also ask about the presuppositions of group judgment and what would change if we committed to one model.

  I need to figure out the underlying assumptions. The unanimity in juries seems to be about legitimacy—acceptance because everyone agreed. In appellate courts, fractured opinions might prioritize correctness through reasoned decisions, even without majority agreement on reasoning. The tension is between these two goals within the same legal system.

  The user is probably concerned about the inconsistency in legal principles. They might want validation that the system isn't entirely coherent but needs to balance different values. Their deeper need could be understanding whether the legal system's structure is defensible or if it's inherently flawed.

  I should explore the candidates for what the practices commit to: aggregating outcomes vs. reasons. The jury unanimity focuses on the verdict as the binding decision, ignoring the reasoning. Appellate courts, however, need to establish precedent, so the reasoning matters even if it's fragmented. The Condorcet Jury Theorem might support jury unanimity for correctness, but that assumes shared reasoning, which isn't required. So legitimacy is key there.

  For appellate panels, the "narrowest grounds" rule shows that the system prioritizes a consistent rule over majority reasoning. This implies that the group's judgment is constructed institutionally, not as a single mind. The practice allows lower courts to follow a rule that no majority endorsed, which suggests that the legal system treats the holding as an institutional output rather than a collective belief.

  The user’s friend might argue that the system pretends courts are rational agents, but the reality is messier. The user likely thinks it's underdetermined. I should confirm that multiple models can coexist because the system serves different functions: juries decide facts for a specific case, while appellate courts make law for future cases.

  If we changed to always aggregating outcomes, appellate courts couldn't set clear precedents. If we required juries to give reasons, it might undermine the legitimacy from unanimity and introduce appeals on reasoning inconsistencies. The least incoherent repair might involve accepting that different decision-making modes serve different purposes, with appellate courts needing clearer rules for precedents while juries remain focused on verdicts.

  In conclusion, the system isn't committed to a single theory of group rationality. It's a functional hybrid balancing legitimacy and correctness, using outcome aggregation for acceptance and reason aggregation for precedent. The tension arises because these goals sometimes conflict, but the system manages by context. The user needs reassurance that the inconsistency is a feature, not a bug, reflecting practical compromises in the legal system.
answer: |-
  Here’s a rigorous reconstruction of the implicit theory behind these legal practices, stripped down to their philosophical and functional commitments. I’ll proceed step-by-step as requested, identifying candidates for underlying principles before arguing for the most coherent interpretation.

  ### Core Tensions & Candidate Commitments
  1. **Group Rationality**:  
     - *Candidate A*: The system assumes the group (jury/court) acts as a unified rational agent with consistent beliefs.  
     - *Candidate B*: It assumes only *outcome consistency* (no contradictory verdicts) is necessary, regardless of internal reasoning.  
     - *Candidate C*: It assumes nothing about group minds; decisions are mere aggregations of individual votes.  

  2. **Authority of Verdict vs. Reasons**:  
     - *Candidate D*: Verdicts are authoritative public acts; reasons are private or irrelevant.  
     - *Candidate E*: Reasons *are* the source of authority, but practical constraints limit their expression.  
     - *Candidate F*: Verdicts and reasons serve distinct functions (legitimacy vs. guidance).  

  3. **Unanimity vs. Fractured Reasoning**:  
     - *Candidate G*: Unanimity (jury) secures social legitimacy; fractured opinions (appellate courts) pursue epistemic correctness.  
     - *Candidate H*: Both are artifacts of historical accident, not principled design.  

  ### The Implicit Theory: A Functional Hybrid
  **The system is not committed to a single model of group rationality. Instead, it pragmatically hybridizes two distinct decision modes, each serving a primary function:**  

  1. **Juries (Unanimous Verdict, No Reasons)**  
     - **Commitment**: *Legitimacy through collective endorsement*.  
     - **Why**: The verdict’s social acceptance hinges on full agreement of lay jurors. Requiring unanimity forces deliberation until consensus, enhancing perceived fairness. Reasons are omitted because:  
       - Lay jurors may lack capacity for legally sound reasoning.  
       - Divergent rationales don’t undermine the verdict’s legitimacy if all agree on the outcome.  
       - Avoiding reasons prevents appeals on logical inconsistencies (functional finality).  
     - **Presupposition**: Groups need not be rational agents; the *outcome* is the sole public artifact.  

  2. **Appellate Courts (Issue-Based Voting, Fractured Opinions)**  
     - **Commitment**: *Correctness through reasoned elaboration*.  
     - **Why**: Appellate courts create precedent. The focus is on *what the law is*, not just case disposition. Voting on issues:  
       - Forces clarity on legal principles.  
       - Allows future courts to extract binding rules from fragmented logic (e.g., the "narrowest opinion" rule).  
     - **Presupposition**: The court’s "holding" is a *constructed institutional output*, not a mirror of individual judges’ beliefs. When no majority agrees on reasoning, the "narrowest grounds" rule artificially synthesizes a precedent from the least contested rationale among the outcome coalition.  

  ### Resolving the Paradoxes
  - **The 3-Judge Panel Example**:  
    - Voting on disposition (2–1 dismissal) prioritizes *case resolution*.  
    - Voting on issues (contract 2–1 yes, breach 2–1 yes) prioritizes *legal rule formation*.  
    - **No contradiction**: The system treats these as separate operations. Disposition resolves the parties’ dispute; issue-voting shapes future law. The "opposite results" reflect divergent purposes, not logical inconsistency.  

  - **Group Minds & Authority**:  
    - The system **rejects** that groups have unified beliefs.  
    - Verdicts gain authority from *procedure* (unanimity/voting rules), not collective rationality.  
    - Appellate "holdings" are *artifacts of institutional design* (e.g., "Marks Rule" for fractured courts), not discovered group judgments.  

  - **Consistency Obsession**:  
    - Consistency applies *externally* (precedent for like cases) not *internally* (individual jurors’ reasons). Juries decide facts for one case; appellate courts make law for all.  

  ### What’s Strictly Presupposed vs. Underdetermined
  - **Strict Presuppositions**:  
    1. Verdicts require procedural legitimacy (unanimity/voting rules).  
    2. Appellate courts must produce reusable legal rules (hence issue-based voting).  
    3. Internal reasoning inconsistencies are tolerable if functions are served.  

  - **Underdetermined Elements**:  
    - Whether juries *could* give reasons without harming legitimacy (some jurisdictions allow this).  
    - How appellate courts *should* synthesize holdings from fractured votes (the "narrowest opinion" rule is arbitrary but functional).  
    - The system is agnostic on whether groups *can* be rational agents; it only requires that outputs satisfy functional needs.  

  ### Consequences of Committing to One Model
  - **If we demand outcome-only aggregation everywhere**:  
    - Appellate courts could not set meaningful precedent. "The law" would reduce to case-specific votes, collapsing stare decisis.  
    - *Change required*: Abandon issue-based voting; treat all decisions like jury verdicts.  

  - **If we demand reason-aggregation everywhere**:  
    - Juries would need to justify verdicts with coherent reasons, inviting endless appeals over logical gaps.  
    - Appellate courts would need supermajorities or negotiation to force unified opinions.  
    - *Change required*: Juries give reasoned opinions; appellate panels require majority-endorsed reasoning.  

  ### The Least Incoherent Repair
  **The current system is not a "mess" but a functional compromise. It *is* coherent if seen through a dual-purpose lens:**  
  - **Juries**: Optimized for *finality and legitimacy* in fact-finding.  
  - **Appellate Courts**: Optimized for *rule articulation and guidance* in law-making.  

  **Where it frays**:  
  - The "narrowest opinion" rule is an awkward patch for appellate splits. Better approaches exist (e.g., requiring a majority to endorse a *single* opinion’s reasoning to set precedent).  
  - Juries’ reason-indifference *does* risk arbitrary outcomes but preserves lay adjudication.  

  **Repair Proposal**:  
  1. **Appellate Courts**: Adopt a formal rule: "No binding precedent without a majority endorsing the *same* reasoning." If no majority agrees, the judgment stands but has no precedential value.  
  2. **Juries**: Retain unanimity but permit (not require) brief explanation of verdicts to deter caprice.  

  **Why this works**: It aligns each institution’s design with its core function—juries as legitimacy anchors, appellate courts as reason generators—while reducing inconsistencies in precedent formation. The system remains hybrid but with clearer guardrails against its own tensions.  

  **Bottom Line**: The law isn’t presupposing group minds or rationality; it’s *using aggregation rules as tools* for distinct social functions. The tension between jury unanimity and appellate fracturing isn’t a flaw—it’s a feature of a system balancing popular legitimacy and legal precision. Your friend overestimates the need for internal consistency; the practice reveals a deeply pragmatic, functionally bifurcated theory of adjudication.
