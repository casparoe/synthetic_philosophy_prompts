prompt: |-
  Hey — I'm a third-year PhD student in political theory, and my dissertation chapter has me stuck refereeing a fight between two camps in the boundary-problem literature, and I need to force them into an adversarial collaboration. The camps: on one side the all-affected-interests crowd (anyone whose interests get set back by a decision has a claim to be part of the demos that makes it), on the other the all-subjected / all-coerced crowd (what grounds inclusion is being subject to the authority or the coercion of the decision, not merely being affected by it). They've been going around in circles for years and I want the document they should have written together.

  Draft that joint statement — the thing a committed all-affected person and a committed all-subjected person could both put their names to. What I need in it:

  - The agreed claims first, numbered. Stuff both can sign about why the current arrangement (demos bounded by citizenship, the ballot box, existing territorial borders) can't just be assumed, about what a principle of inclusion is even supposed to do, about whether inclusion comes in degrees, and about which cases are hard for both sides. Don't let these go vacuous — if a claim would be signed by anyone with a pulse, cut it.
  - Then the residual disagreement, as a table. One row per issue, with the all-affected wording in one column and the all-subjected wording in another, each phrased the way that side would actually want to phrase it, not a strawman of it.
  - The cruxes: the sub-questions such that settling one would move at least one side. For each crux, give a concrete case or arguement both sides agree bears on it, and write down what each side predicts about that case before the fact.
  - Tell me which parts of the fight are, in your view, merely verbal — disagreements that dissolve once the two sides pin down what they mean by 'affected', 'subjected', 'authority', or 'the demos' — and which are real. Say explicitly where the wording is doing the work.

  Two extra things I want baked in. (1) Please include a 2x2 over affected × subjected — affected-and-subjected, affected-only, subjected-only, neither — and say for each cell which camp thinks it grounds a claim to membership, and where the other camp thinks that's a mistake. (2) Anchor the whole thing in one running case so it doesn't float off into abstraction: a global loss-and-damage / climate-adaptation fund whose spending decisions hit people who are neither citizens nor residents of the states that run it, plus the resident non-citizen who's subjected to a state's law but arguably not affected by the particular decision. Use that case for the crux predictions.

  No citations or reading lists — I don't need the literature, I need the argument. And if you think one of the two camps definately can't sign a claim I'd expect it to, say so and explain why, rather than papering over it.
reasoning: |-
  Okay, let me tackle this political theory problem. The user is a PhD student stuck between two camps in democratic boundary literature - all-affected interests versus all-subjected/coerced principles. They need an adversarial collaboration document that both sides could sign.

  First, I need to understand the core distinction. The all-affected principle says anyone whose interests are impacted by a decision should be included in the demos. The all-subjected principle focuses on those actually bound by the decision's authority. The user wants concrete agreements, residual disagreements in table form, cruxes with test cases, and analysis of verbal vs real disagreements.

  The climate adaptation fund case seems perfect as an anchor. There are clear affected-but-not-subjected parties (like Bangladeshi farmers impacted by spending decisions) and subjected-but-not-affected individuals (like resident non-citizens facing deportation orders unrelated to the fund). This makes the theoretical debate tangible.

  For the agreed claims section, I'm identifying points both sides would accept: that current citizenship boundaries are arbitrary, that inclusion principles must avoid infinite regress, that inclusion has degrees, and that certain cases like children or undocumented immigrants pose shared difficulties. These shouldn't be vacuously agreeable but substantive common ground.

  The 2x2 grid is crucial. For affected-and-subjected: both agree on inclusion. Affected-only: all-affected says include, all-subjected says no - leading to the climate fund case conflict. Subjected-only: all-subjected says include, all-affected says no - illustrated by the deportation case. Neither: both exclude. This clarifies where disagreements actually lie.

  The residual disagreements need careful phrasing in tabular format. Key rows include the core principle, purpose of inclusion, and treatment of subjected-but-unaffected individuals. Each column should use the side's actual terminology without strawmanning.

  For cruxes, I'm designing test cases where predictions diverge. The climate fund tests whether mere interest impact warrants inclusion. The deportation order tests whether subjection alone suffices. Each crux isolates a specific philosophical commitment.

  On verbal disputes, I note that "affected" needs specification to avoid overextension, while "subjection" requires clarification between coercion and authority. But the core conflict over whether subjection is necessary remains substantive.

  I'm ensuring no false compromises. Where positions are incompatible (like on affected-only claims), I'm explicitly stating why one side can't concede rather than papering over it. The document maintains intellectual honesty while finding genuine common ground.

  The structure follows user specifications: numbered agreements first, then disagreement table, then cruxes with cases, finally verbal/substantive analysis - all anchored to the climate fund example throughout.
answer: |-
  ## Adversarial Collaboration Statement: Foundations of Democratic Inclusion

  **Joint Signatories:** [Name], All-Affected Interests Proponent & [Name], All-Subjected Coercion Proponent

  **Anchoring Case:** The Global Climate Adaptation Fund (GCAF). Funded primarily by historically high-emission states (HES), governed by a board of HES representatives. Decisions allocate resources for climate adaptation projects (e.g., sea walls, drought-resistant crops). Impacts include:
  1.  **Affected-But-Not-Subjected:** A Bangladeshi farmer whose livelihood is significantly impacted by *which* adaptation projects get funded (e.g., funding for salinity-resistant rice vs. flood barriers elsewhere).
  2.  **Subjected-But-Not-Affected (in this instance):** A documented, tax-paying migrant worker living in an HES state. While generally subject to the state's laws and coercion, a *specific* GCAF spending decision on a distant project has negligible direct impact on their immediate interests.
  3.  **Affected-and-Subjected:** Citizens/residents of HES states impacted by GCAF decisions (e.g., via taxation, local project effects).
  4.  **Neither:** Citizens of landlocked states with minimal climate vulnerability and no involvement in GCAF.

  ---

  ### I. Agreed Foundational Claims

  1.  **The Status Quo is Indefensible:** Neither citizenship nor territorial residency, as currently bounded, provides a normatively sufficient basis for constituting the *demos* for decisions like the GCAF. These boundaries are often arbitrary legacies of history and power, failing to track either significant affected interests or legitimate subjection to authority in a globalized world.
  2.  **The Purpose of Inclusion is Primarily Legitimacy:** The core function of a principle of inclusion is to identify those individuals whose participation is necessary for a collective decision to be democratically *legitimate*. This legitimacy stems from respecting fundamental political equality and avoiding domination.
  3.  **Inclusion is Scalar, Not Binary:** The *strength* of an individual's claim to inclusion in a specific decision-making process varies. It is not simply "in" or "out." Factors like the *intensity* of the effect or the *directness* of the subjection matter, influencing the *form* of participation warranted (e.g., voting, consultation, right to appeal).
  4.  **"Infinity" is a Challenge, Not a Refutation:** Both principles face the potential problem of over-inclusion ("infinity"). We agree this necessitates pragmatic institutional design (e.g., thresholds, representation mechanisms, delegation) but *cannot* be used to dismiss the need for a sound normative principle to guide that design. The challenge is shared.
  5.  **"Hard Cases" Reveal Shared Tensions:** Cases like children, severely cognitively disabled individuals, or undocumented immigrants pose challenges for *both* principles regarding capacity, agency, and the precise nature of "interests" or "subjection." Neither principle offers an automatic, uncontroversial resolution, demanding supplementary reasoning about representation, trusteeship, or fundamental rights.

  ---

  ### II. Residual Disagreement: Core Principles

  | Issue                                  | All-Affected Interests Principle (AA)                                                                 | All-Subjected Coercion Principle (AS)                                                                 |
  | :------------------------------------- | :---------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------- |
  | **Core Ground for Inclusion**          | **Entitlement stems from having one's interests set back (or potentially advanced) by a decision.** Legitimacy requires that those whose life chances/happiness are demonstrably altered have a say. | **Entitlement stems from being subject to the enforceable authority/coercion enforcing a decision.** Legitimacy requires that those bound by the rules, and liable to sanctions for non-compliance, author those rules. |
  | **Primary Purpose of Demos-Bounding**  | **To prevent externalities and domination.** Excluding the significantly affected allows their interests to be overridden without recourse, constituting domination. | **To constitute an autonomous political community capable of collective self-government.** Including only the coerced defines the group sharing a reciprocal relationship of rule-making and rule-following. |
  | **Treatment of Affected-Only (e.g., Bangladeshi Farmer)** | **Strong claim to inclusion.** The GCAF decision demonstrably sets back their vital interests (livelihood, security). Exclusion is unjust domination, regardless of formal subjection to HES law. | **No inherent claim to *membership in the HES demos* for this decision.** While their interests merit consideration (e.g., via international consultation, rights frameworks), inclusion in the *authoring demos* requires sharing the coercive bond. Their claim is against *outcomes*, not for authorship. |
  | **Treatment of Subjected-Only (e.g., Resident Non-Citizen & Minor GCAF Decision)** | **No claim based *solely* on general subjection if *this specific decision* negligibly affects them.** Their general subjection to state authority grants them a claim regarding *most* state decisions, but not automatically irrelevant ones. | **Full claim to inclusion.** Being subject to the sovereign authority that made the decision (even if this specific impact is minor) grounds the claim. The coercive framework is holistic; one cannot pick and choose which laws bind them. |
  | **The Role of "Authority"**            | Authority is derivative; its legitimacy depends *first* on including the affected. If the affected are excluded, the authority itself lacks legitimacy for those individuals. | Authority is constitutive; it defines the relationship within which decisions gain their binding force. Subjection *to this authority* is the prior condition. |

  ---

  ### III. Cruxes: Testable Divergences (Using GCAF Case)

  1.  **Crux: Does Significant Interest Impact Alone Ground a Claim to *Authorship*?**
      *   **Case:** The Bangladeshi farmer facing significant livelihood impact from a GCAF spending choice.
      *   **AA Prediction:** The farmer *must* have a pathway to meaningful participation (e.g., representation, direct input) in the GCAF decision-making process for it to be legitimate *with respect to them*. Exclusion is a democratic failure.
      *   **AS Prediction:** The farmer's plight demands a moral/political response (e.g., strong consultative mechanisms, accountability of the board, international aid obligations), but does *not* entitle them to membership in the *demos authoring* the GCAF decision. Legitimacy flows from the relationship between the coercing authority (HES states) and those subjected to it.
      *   **What Settling It Would Do:** If empirical/ethical analysis shows AA's "domination" claim holds *and* AS's "constitutive community" argument fails here, AS must concede or significantly modify. If AS demonstrates that "authorship" requires shared coercive reciprocity which is absent, AA must refine its notion of "inclusion" or "legitimacy".

  2.  **Crux: Does General Subjection to Authority Ground a Claim for Inclusion in *All* Specific Decisions?**
      *   **Case:** The resident non-citizen subjected to HES laws but negligibly affected by a *specific* GCAF project allocation.
      *   **AA Prediction:** While the individual has a strong claim for inclusion in decisions *affecting them* (e.g., local laws, taxes), their claim regarding *this specific* GCAF decision is weak or non-existent. Inclusion here might be symbolic or based on general citizenship rights, not the AA principle itself.
      *   **AS Prediction:** The individual has a full claim to participate in *all* decisions made by the sovereign authority they are subject to, regardless of the decision's specific impact on them. The coercive bond is indivisible at the level of the sovereign entity.
      *   **What Settling It Would Do:** If conceptual analysis shows coercion is necessarily "lumpy" at the sovereign level, AA must either accept AS's position here or provide a coherent alternative account of subjection. If AS cannot defend why inclusion in irrelevant decisions is necessary for legitimacy, AA's narrower focus gains strength.

  ---

  ### IV. Analysis of Disagreements: Verbal vs. Real

  *   **Verbal Disputes (Potentially Dissolvable):**
      *   **"Affected":** Some apparent disagreement stems from vagueness. AA must specify *what counts as a relevant interest* (basic needs? preferences? autonomy?) and *thresholds of significance*. AS must clarify if "affectedness" plays *any* role in determining the *scope* of the authority they deem constitutive. Pinning down "vital interests" vs. "trivial effects" and "direct coercion" vs. "diffuse influence" can narrow the gap.
      *   **"Subjected" / "Coerced":** Disagreement exists over the *boundaries* of the coercive unit. Is it the specific regulation (implausible)? The issuing institution (GCAF board)? The sovereign state? A transnational regime? AA often argues AS's unit is arbitrary; AS argues it's defined by the source of enforceable rules. Clarifying the relevant "authority" for a given decision type (e.g., is the GCAF an exercise of HES state sovereignty or a novel authority?) is crucial but verbal.
      *   **"The Demos":** Both agree it's the group entitled to participate in authoring a decision. Disagreement on *which* group that is for a given decision is substantive, but clarifying if they mean identical groups can prevent talking past each other.

  *   **Real (Substantive) Disagreements:**
      *   **The Necessity of Coercion:** The core, irreducible disagreement is whether *being subject to the enforcing authority* is a **necessary condition** for having a claim to democratic authorship (AS: Yes, AA: No). This is a fundamental normative divide about the nature of political obligation and legitimacy.
      *   **The Primacy of Harm Prevention vs. Community Constitution:** AA prioritizes preventing the domination of the externally affected. AS prioritizes constituting a bounded community capable of autonomous self-government through shared subjection. These are distinct, competing foundational values.
      *   **The Indivisibility of Authority:** AS relies on the claim that subjection to a sovereign authority is a holistic bond. AA fundamentally challenges this, arguing authority and thus claims to inclusion can be decision-specific. This is a deep conceptual and normative disagreement about political relationships.

  ---

  ### V. The 2x2 Grid: Affected vs. Subjected

  |                         | **Subjected to the Decision's Enforcing Authority** | **NOT Subjected to the Decision's Enforcing Authority** |
  | :---------------------- | :-------------------------------------------------- | :------------------------------------------------------ |
  | **Affected by the Decision** | **1. Affected & Subjected (e.g., HES Citizen impacted)** | **2. Affected-Only (e.g., Bangladeshi Farmer)**         |
  |                         | *AA: **YES** (Strong Claim)*                        | *AA: **YES** (Claim proportional to effect)*            |
  |                         | *AS: **YES** (Strong Claim)*                        | *AS: **NO** (Mistake: Claims authorship without the bond)* |
  | **NOT Affected by the Decision** | **3. Subjected-Only (e.g., Resident Non-Citizen & Minor GCAF Decision)** | **4. Neither**                                          |
  |                         | *AA: **NO** (Weak/No claim *for this decision*)*    | *AA: **NO***                                            |
  |                         | *AS: **YES** (Strong Claim: Part of the sovereign community)* | *AS: **NO***                                            |
  |                         | *(AA: Mistake by AS - Includes where no stake exists)* |                                                         |

  ---

  **Final Note:** This collaboration reveals that while significant common ground exists on the failures of the status quo and the nature of the problem, the disagreement over the **necessity of subjection to authority** as a condition for democratic authorship remains profound. The GCAF case starkly illustrates this: AA sees the exclusion of the Bangladeshi farmer as a core injustice of domination, while AS sees their inclusion in the HES demos as conceptually incoherent and destructive of bounded community. Progress may lie less in convincing the other side entirely and more in designing institutions that respect the core concerns of both principles (e.g., robust representation/consultation for the affected-only, clear and bounded authorities to define the subjected) while acknowledging this underlying tension.
