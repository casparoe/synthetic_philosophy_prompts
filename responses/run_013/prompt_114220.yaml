answer: |-
  ## The Inferential-Role Expressivist Gambit: A Verdict on Embedding

  The Frege-Geach problem remains the most formidable obstacle for expressivism. If moral sentences fundamentally express non-cognitive attitudes, how do they retain a consistent meaning and contribute to logical validity when unasserted and embedded in complex constructions? The inferential-role strategy offers an ambitious solution, grounding meaning entirely in practical reasoning transitions rather than truth-conditional content or direct attitude expression. This essay argues that while this strategy makes significant strides in handling core logical embeddings like negation and conditionals, it ultimately founders on the rocks of attitude ascription ("She believes lying is wrong"), revealing a fatal equivocation that relocates rather than dissolves the core problem. The strategy fails for this version of expressivism.

  **The Strategy's Core and Initial Successes**

  The inferential-role strategy posits:
  1.  **Moral Predicates as Inferential Roles:** Grasping "wrong" means mastering its inferential role – dispositions to transition *from* accepting "Action A is wrong" *to* disapproval of A, and *from* accepting a descriptive claim "Action A is F" (where F is a "wrong-making" feature) *to* accepting "A is wrong". Crucially, it also involves dispositions *against* certain transitions (e.g., not inferring approval from "A is wrong").
  2.  **Logic as Inferential:** Logical constants are defined by their roles in governing transitions between sentence acceptances/rejections, not truth-preservation. Modus ponens validity, for instance, is a rule licensing the inference to Q *if* one accepts both "If P, then Q" and P.
  3.  **Embeddings as Licensing Nodes:** An unasserted sentence like "lying is wrong" in "If lying is wrong..." doesn't express an attitude *nor* denote a truth-condition. Instead, it acts as a constraint on the inferential role of the *whole* conditional. Accepting the conditional means being committed to the transition: *from* accepting "lying is wrong" *to* accepting "getting your sibling to lie is wrong".

  This framework scores notable successes:

  *   **Modus Ponens Validity:** A moral MP argument (P: "Lying is wrong"; If P, then Q: "If lying is wrong, then getting your sibling to lie is wrong"; Therefore Q: "Getting your sibling to lie is wrong") is valid because the meaning of the conditional *is* the commitment to the transition from accepting P to accepting Q. Accepting both premises *just is* a commitment to accepting Q. There is no equivocation because the role of "lying is wrong" (P) is identical in both its occurrence as a premise and within the conditional – it always constrains transitions involving disapproval of lying. The validity is explained by the shared inferential role governing the transitions licensed by the premises.
  *   **Negation:** The problem of "lying is not wrong" is addressed by defining the inferential role of negation. Accepting "not-P" ("lying is not wrong") involves dispositions *against* the transitions constitutive of accepting P. Crucially, it is *not* merely the absence of disapproval. It is a *positive commitment to reject* the transitions tied to "lying is wrong". For example, it involves a disposition *not* to infer disapproval of lying *from* the recognition of features one takes to be wrong-making, or to reject inferences *from* "lying is not wrong" to approval of lying (unless further premises are added). This distinguishes it from mere indecision. The attitude expressed by asserting "not-P" is the *endorsement of this pattern of rejection* concerning the transitions tied to P.
  *   **Unasserted Antecedents:** The strategy handles unasserted antecedents elegantly. In "If lying is wrong, then...", the antecedent doesn't express the speaker's disapproval. Its role is purely to specify the structure of the commitment undertaken by accepting the whole conditional: *if* one were to accept "lying is wrong" (with its associated transitions), *then* one is committed to accepting the consequent. The speaker's attitude is the endorsement of *this conditional commitment structure*.

  **The Fatal Flaw: Attitude Ascription**

  The strategy collapses when confronted with attitude ascriptions like "She believes that lying is wrong." The problem is stark: **The inferential-role strategy cannot coherently account for the *descriptive* function of such reports without smuggling in truth-conditional content or abandoning expressivism's core.**

  1.  **The Challenge:** "She believes that lying is wrong" is asserted by the speaker but describes the mental state (the "belief") of a third party ("she"). It does not express the *speaker's* disapproval of lying, nor does it express the speaker's endorsement of the transitions tied to "lying is wrong". Its primary function seems to be reporting a fact about the third party's psychology. Yet, according to the strategy, the meaning of "lying is wrong" is exhausted by its inferential role within practical reasoning – dispositions to form attitudes and make transitions.
  2.  **The Strategy's Temptation and Failure:** The expressivist might try to analyze "She believes that P" as describing the third party's acceptance of the inferential role associated with P. That is, "She believes that lying is wrong" means *she* is disposed to make the transitions constitutive of accepting "lying is wrong" (e.g., from recognizing lie-telling to disapproving of it).
      *   **Why This Fails:** This analysis fundamentally misconstrues the meaning of "believes." Belief ascription is not *just* about reporting dispositions to make inferential transitions. It reports a cognitive state with representational purport – a state that *takes the world to be a certain way*, even if the expressivist denies the world contains corresponding moral facts. The report "She believes that lying is wrong" characterizes *her* as being in a state that she herself would express by *asserting* "Lying is wrong". According to the expressivist, when *she* asserts it, she expresses her disapproval. But the *speaker* reporting this belief is *not* expressing disapproval, nor are they (merely) reporting her dispositional transitions. They are characterizing her mental state as one that *represents* lying as possessing the property of wrongness, or at least, as one that *she treats* as representing such a fact. The inferential-role account reduces belief to a complex of dispositions, but this fails to capture the intentional, representational "direction of fit" inherent in belief ascriptions that the speaker is attempting to describe.
  3.  **The Equivocation Exposed:** The strategy requires "lying is wrong" to have the *same* meaning (inferential role) in all contexts. In the belief report, this role is supposedly what the third party accepts. However, the *speaker's* act of reporting the belief does not involve the speaker themselves accepting or endorsing that role. The meaning of the embedded clause "lying is wrong" *as it figures in the content of the ascribed belief* cannot be doing the same work for the speaker as it does when the speaker uses it assertorically. When the speaker asserts "Lying is wrong," the clause's role directly governs the speaker's own reasoning commitments. When embedded in "She believes that...", the clause's role is presented as governing *her* reasoning commitments, but the speaker's utterance is a description *about* this, not a performance *of* it. The strategy lacks the resources to distinguish between the *use* of the role (in assertion) and the *mention* or *description* of someone else's commitment to the role (in belief ascription). It conflates participating in a practice of commitment with describing participation in that practice. The meaning of the moral predicate *as contributing to the descriptive content of the belief report* is parasitic on its expressive/commitmental use, but the strategy cannot explain this parasitic relationship without implicitly relying on the very representational content it seeks to avoid. The inferential role is not "contributed" to the belief report in the same way it is to a conditional; it becomes the *object* of description, and the strategy has no account for this semantic shift.
  4.  **The Fatal Consequence:** This failure is fatal to *this version* of inferential-role expressivism. Its core tenet – that meaning *is* inferential role, uniformly across asserted and embedded contexts – cannot be sustained for attitude ascriptions. The predicate "wrong" cannot be making the *identical* contribution (governing the speaker's own immediate transitions) in "Lying is wrong" and in "She believes lying is wrong," without absurdly implying that by reporting her belief, the speaker is themselves committing to the disapproval of lying. The strategy either must admit that the meaning shifts fatally (violating uniformity) in attitude contexts, or it must introduce a hidden descriptive, truth-conditional element into the semantics of the moral predicate specifically within such reports (abandoning pure expressivism). Neither option is acceptable within the stated framework. Attitude ascriptions reveal that the inferential role itself becomes the *object* of description, requiring a level of semantic content that the strategy cannot provide without collapsing into a form of descriptivism about mental states or moral properties.

  **The Strongest Objection and Rebuttal**

  *   **Objection:** "You demand that 'believes' reports a descriptive, representational state. But the expressivist *rejects* the cognitivist semantics underlying this demand. The inferential-role strategy offers a *unified non-representational* account: 'S believes that P' *means* S accepts the inferential role associated with P. This *is* the descriptive fact being reported – the fact about S's dispositional state concerning practical reasoning transitions. This is consistent, non-representational, and handles the embedding. Your objection simply begs the question against expressivism by assuming beliefs *must* have representational content."
  *   **Rebuttal:** The objection highlights a core tension, but does not resolve it. While the expressivist aims for a non-representational semantics, the *phenomenon* of belief ascription poses a unique challenge. The objection correctly states the expressivist *proposal* for "believes," but fails to show this proposal adequately captures our linguistic practice. The fatal issue is *intentionality*. When we say "She believes that lying is wrong," we are characterizing her state as being *about* lying and wrongness. Even if the expressivist analyzes *her* state as non-cognitive, the *speaker's report* characterizes it as having cognitive "aboutness." The inferential-role analysis of "believes" as "accepts role R" fails to capture this intentional dimension inherent in the report itself. It reduces the belief report to a behavioral/dispositional report about transitions, which feels like a significant loss in meaning. Furthermore, the strategy struggles to distinguish "She believes lying is wrong" from "She is disposed to disapprove of lying when she recognizes it." While closely related, these are not synonymous; the former presents her state as taking a stand *on a content* ("that lying is wrong"), which the latter does not. The inferential-role account of "believes" is a radical revision that fails to account for the manifest intentional character of belief ascriptions in language. It dissolves the embedding only by changing the subject, offering an account of "believes" that doesn't align with its actual descriptive, intentional use. The problem isn't begged; it's demonstrated by the inadequacy of the proposed analysis to capture the full meaning of the attitude report.

  **Verdict**

  The inferential-role strategy for expressivism deserves credit for its sophisticated handling of logical embeddings like negation, conditionals, and modus ponens, providing a genuinely non-representational account of validity grounded in commitments to transitions. However, its inability to provide a coherent, uniform, and phenomenologically adequate account of attitude ascriptions ("She believes that P") is fatal. In these contexts, the strategy cannot maintain the uniform inferential role of the moral predicate without either equivocating on its contribution or implicitly relying on a descriptive, representational dimension that contradicts pure expressivism. It relocates the embedding problem from simple embeddings to the more complex terrain of propositional attitude reports, where it founders. While this failure may not doom all forms of expressivism (e.g., hybrid or quasi-realist approaches might incorporate descriptive elements for attitude contexts), it decisively undermines *this specific* inferential-role version. The Frege-Geach problem, in its most persistent form concerning the descriptive reporting of others' commitments, remains unresolved by this gambit.
