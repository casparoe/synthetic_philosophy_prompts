answer: |-
  Here's a joke tightly bound to Weber's core irony:

  **Setting:** A sleek productivity app startup, all standing desks and kombucha.  

  **Setup:** The hyper-optimized founder, "Cal," stares intensely at a dashboard showing team efficiency metrics hitting 99.8%. His exhausted assistant sighs.  

  **Assistant:** "Cal, why do we *need* to hit 100%? The app works, users are happy, investors are thrilled. What's driving this?"  
  **Cal:** (Without looking up) "I need a sign."  
  **Assistant:** "A sign? Of what? Market dominance? An acquisition?"  
  **Cal:** "A sign I'm *chosen*. That this... this relentless optimization... *means* something. That it's not just... random hustle."  
  **Assistant:** (Baffled) "Chosen? By who? Our board? The algorithm gods? This company isn't even religious!"  
  **Cal:** (Finally turns, a look of dawning realization mixed with exhaustion) **"Exactly. That's the terrifying part. The system doesn't run on faith anymore... it just runs on the doubt."**  

  **Why it works (Weber-wise):**  

  1.  **Core Irony:** The punchline hinges entirely on the central Weberian twist. Cal seeks "a sign" of his election (assurance of predestination) through "relentless optimization" (this-worldly asceticism/works). The assistant points out the religious framework ("chosen by who?") is gone. Cal's realization ("The system doesn't run on faith anymore... it just runs on the doubt") captures the essence of Weber's argument: the *psychological mechanism* (the anxiety-driven need for proof via disciplined work) persists and drives the rationalized economic system ("the system") long after the theological belief ("faith") that originally generated it has vanished. The "doubt" *is* the engine.  
  2.  **Intelligibility Only with Weber:**  
      *   "Need a sign"/"Chosen" directly references the Calvinist quest for assurance of election.  
      *   "Relentless optimization" is the modern, secularized version of methodical work as a calling.  
      *   "The system doesn't run on faith anymore" explicitly states the disenchantment/disappearance of the religious impulse.  
      *   "...it just runs on the doubt" is the punchline *only* comprehensible via Weber. It succinctly names the persistent, secularized *anxiety* that now fuels the work ethic for its own sake, detached from salvation concerns. Without knowing Weber's thesis about predestination creating this specific anxiety-turned-work-driver, "runs on the doubt" is cryptic, not funny.  
  3.  **Avoids Clichés:** It's not about guilt or simple workaholism. It's specifically about the *search for a sign of election* (predestination) manifesting as hyper-rationalized labor in a secular context, and the *ironic persistence of the anxiety* ("doubt") as the fuel once the theology is gone.  
  4.  **Methodological Nuance (Implied):** Cal's dawning realization hints at the puzzle: *Is* this doubt a genuine cause driving his behavior, or is it just a post-hoc rationalization ("meaning") he's imposing on his inherent drive for success? Weber leaves this open; the joke presents the doubt *as* the engine, reflecting the psychological reality Weber described, without resolving the deeper causality question.  

  **Strip Test:** Remove the predestination/assurance mechanism:  
  *   Setup: Boss works too hard. Assistant asks why.  
  *   Punchline: "The system doesn't run on faith anymore, it just runs on the doubt."  
  *   **Result:** Utterly confusing and unfunny. "Doubt" about what? Why is that the engine? The humor *only* exists via the Weberian framework.
