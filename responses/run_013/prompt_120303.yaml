prompt: |-
  I convene a third-year undergraduate seminar in the philosophy of science: sixteen students, one ninety-minute session, no set reading, a room with movable chairs and a projector. I want to run an activity that makes the group feel the force of incommensurability from the inside — not the loose slogan that worldviews differ, but the narrower and more uncomfortable thing: that two communities can share a body of observations, agree about every one of them, and still be unable to translate each other's classificatory vocabulary, because the terms are fixed by their mutual relations rather than by anything the observations settle; that whether something counts as a puzzle, a result, or an anomaly depends on the scheme you are working in; and that changing schemes can lose as well as gain. I want the loss to be felt, not merely announced. The words paradigm, incommensurable, normal science and revolution must not appear in any material the students see, and Kuhn's name must not be spoken until the debrief.

  These are the beats the activity needs, whatever content you invent for it.

  1. Two communities. Split the group into two halves, each with its own self-contained kit: a lexicon of eight to ten kind-terms with definitions, three worked exemplars, a set of puzzles, and its own scoring rule for what counts as solving one. Both kits must be applied to the same pool of cases, described in vocabulary that neither kit owns. Neither kit may be obviously superior: their strengths must be orthogonal, so that each is better than the other on part of the material. Within each lexicon there must be at least one term whose correct application depends on the correct application of other terms in the same lexicon, so that it cannot be translated piecemeal, and at least one term for which the rival kit offers a plausible but wrong counterpart — a false friend that the students will reach for first.

  2. Anomaly. Each community then receives a sealed case that its kit cannot classify cleanly. The case must be one that can be absorbed by adding an auxiliary clause, so that they are tempted to patch rather than abandon; the facilitator notes what they do.

  3. Cross-examination. Each community must translate the other's lexicon and deliver a verdict on a case both claim. They should be scored at least once under the rival kit's rule, so that the scoring schemes, each internal to its own kit, turn out not to be a common measure.

  4. Forced comparison. Finally, each community must nominate a criterion for choosing between the kits, and the other must show that the criterion is internal to its own kit. Let them discover whether any criterion survives, and be ready for either outcome.

  The debrief should map moments in the activity onto the ideas, and should at minimum connect what happened to: the later, more qualified version of incommensurability, on which the trouble is local — attaching to particular clusters of kind-terms and their interrelations rather than to whole worldviews; the distinction between having a translation manual and learning to use a foreign vocabulary, and the thought that the historian may end up bilingual rather than in possession of a neutral key; Kuhn's treatment of theory choice as governed by shared values — accuracy, consistency, scope, simplicity, fruitfulness — which can conflict and be weighted differently by people who accept all of them, so that they constrain without determining; the loss of previously solved problems that a change of scheme can bring; and the objection that untranslatability is incoherent, since to identify a failure of translation we must already have understood something in common. Be explicit about how the activity's own design concedes a point to that objection.

  Give me the materials to prepare, the rules, the timing, the roles, the scoring, and how the facilitator should handle what will predictably go wrong the first time — at a minimum, a group that code-switches too easily and declares the exercise merely a matter of labels, and a group whose kit proves so much stronger that the comparison collapses into the obvious answer. Be frank about which feature of the idea the activity cannot reproduce and that I must supply myself; say so plainly rather than hedging. No reading list and no citations: the kits have to be self-contained, since the students will have nothing but the room.
reasoning: |-
  We are creating an activity that simulates incommensurability without using Kuhn's terminology. We'll design two self-contained classification kits (Kit A and Kit B) for analyzing a set of cases. The cases are described in a neutral observation language that both kits use as input.

  The scenario: We are classifying astronomical phenomena. The neutral observation language describes events in terms of position, brightness, color, duration, etc., without using the theoretical terms of either kit.

  We'll create two kits:

  Kit A: "Stellar Dynamics Framework"
    - Focuses on the motion and energy of celestial bodies.
    - Key terms: Orbital Resonance, Gravitational Lens, Stellar Flare, Binary System, Redshift Drift, Accretion Disk, Cosmic Ray Burst, Exoplanetary Transit.

  Kit B: "Celestial Composition Framework"
    - Focuses on the material composition and spectral properties.
    - Key terms: Metallicity Spike, Spectral Line Shift, Nebular Emission, Planetary Nebula, Deuterium Abundance, Dust Scattering, Helium Flash, Atmospheric Absorption.

  Each kit has:
    - Definitions for its terms (which refer only to the neutral observation language and other terms in the kit).
    - Three worked exemplars (showing how to classify a case using the kit).
    - A set of puzzles (cases to classify).
    - A scoring rule for what counts as a solution (each kit has its own internal scoring).

  The two kits are orthogonal: Kit A is better at explaining dynamic events (like changes in position or motion), and Kit B is better at explaining compositional events (like changes in brightness due to material properties). Neither is universally better.

  Each kit has at least one term that depends on other terms (so it cannot be translated piecemeal) and at least one false friend (a term that sounds similar to one in the other kit but means something different).

  Activity Structure:

  1. Introduction (10 minutes):
     - Explain that they will be working in two groups to classify astronomical phenomena using two different classification systems.
     - Emphasize that they must use only the provided materials and not mix with the other group's system.

  2. Group Work Phase 1: Learning and Solving (30 minutes):
     - Split the class into two groups (Group A and Group B). Each group gets their kit (lexicon, exemplars, puzzles) and a set of neutral case descriptions (the same for both).
     - Each group learns their system and solves the puzzles. The facilitator circulates to answer procedural questions.

  3. Anomaly (10 minutes):
     - Each group receives a sealed case that doesn't fit cleanly. They are to record how they handle it (patch or abandon). The facilitator notes their response.

  4. Cross-Examination (20 minutes):
     - Each group must:
          a) Translate the other group's lexicon into their own terms (without looking at the other group's definitions).
          b) Classify a specific case (the same for both) that both groups have claimed to solve using their own kits. Then, they must score the other group's solution using their own scoring rule.

  5. Forced Comparison (15 minutes):
     - Each group nominates a criterion for choosing between the two kits (e.g., simplicity, explanatory power).
     - The other group must show how that criterion is internal to their own kit and how their kit satisfies it better (or that the criterion is not neutral).

  6. Debrief (25 minutes):
     - Reveal the purpose: to experience incommensurability.
     - Map the activity to Kuhn's ideas (without using the words until now) and discuss the points as requested.

  Materials to Prepare:

  For the Neutral Observation Language:
    - Cases are described in terms of:
          - Location (coordinates in the sky)
          - Brightness (in magnitudes, over time if variable)
          - Color (wavelengths or broad color bands)
          - Duration (if transient)
          - Motion (if any, described as change in coordinates over time)
          - Spectrum (if available, as a graph or list of prominent lines)

  Example of a neutral case description:
      "Event N7: Observed at RA 14h30m, Dec -60°; duration 2 hours; brightness increased from 8.1 to 7.2 mag then decreased to 8.0 mag; color shifted from blue to red during the event; spectrum shows prominent H-alpha line at 656.3 nm and a weaker OIII line at 500.7 nm; no significant motion detected."

  Two Kits:

  Kit A: Stellar Dynamics Framework

  Lexicon:
    1. Orbital Resonance: A pattern of motion where two or more bodies exert a regular periodic gravitational influence on each other due to their orbital periods being in a ratio of small integers. [Depends on motion and periodicity]
    2. Gravitational Lens: The bending of light from a distant source by a massive object along the line of sight, causing multiple images or a ring. [Depends on the position and shape of the image]
    3. Stellar Flare: A sudden brightening of a star, typically in the ultraviolet or X-ray, caused by magnetic reconnection. [Depends on brightness change and spectrum]
    4. Binary System: Two stars orbiting a common center of mass. [Depends on periodic motion and sometimes eclipses]
    5. Redshift Drift: A gradual change in the redshift of a source over time, indicating motion along the line of sight. [Depends on spectral shift over time]
    6. Accretion Disk: A rotating disk of matter falling onto a central object, often producing high-energy radiation. [Depends on spectrum and brightness changes]
    7. Cosmic Ray Burst: A short burst of high-energy particles, often from outside the solar system. [Depends on detection of particles and duration]
    8. Exoplanetary Transit: The dimming of a star when a planet passes in front of it. [Depends on periodic dimming without color change]

  Exemplars (worked examples with explanations using the lexicon).

  Puzzles (5 cases to classify using the lexicon).

  Scoring Rule for Kit A: A solution must identify at least one primary phenomenon (using one lexicon term) and explain the dynamics (using the relations between terms). It is scored by how well it accounts for the motion and energy changes (1-5 points).

  Kit B: Celestial Composition Framework

  Lexicon:
    1. Metallicity Spike: An unusually high concentration of elements heavier than helium in a star or gas cloud. [Depends on spectral lines of metals]
    2. Spectral Line Shift: A shift in the wavelength of spectral lines due to motion (Doppler) or gravity (relativistic). [Depends on spectrum]
    3. Nebular Emission: Light emitted by ionized gas in a nebula, showing specific emission lines. [Depends on spectrum and diffuse structure]
    4. Planetary Nebula: An expanding shell of ionized gas ejected from an old star. [Depends on spectrum and shape]
    5. Deuterium Abundance: The amount of deuterium (heavy hydrogen) present, which is a key indicator of the history of the material. [Depends on spectral lines of deuterium]
    6. Dust Scattering: The scattering of light by dust grains, causing reddening and reflection. [Depends on color change and polarization]
    7. Helium Flash: A thermonuclear explosion in the core of a low-mass star when helium fusion begins. [Depends on brightness change and spectrum]
    8. Atmospheric Absorption: Absorption of light by the atmosphere of a planet or star, leaving specific absorption lines. [Depends on spectrum]

  Exemplars (worked examples).

  Puzzles (5 cases to classify).

  Scoring Rule for Kit B: A solution must identify the composition and emission/absorption processes. It is scored by how well it accounts for the spectral features and material properties (1-5 points).

  False Friends:
    - Kit A's "Redshift Drift" and Kit B's "Spectral Line Shift" are false friends. Both deal with spectral shifts, but the first is about gradual change over time (motion) and the second is about the cause (Doppler or gravity) and is used in compositional analysis.
    - Kit A's "Stellar Flare" and Kit B's "Helium Flash" both involve brightening, but the first is magnetic and the second is thermonuclear.

  Term Dependencies:
    - In Kit A, "Orbital Resonance" depends on the concept of periodic motion (which might be inferred from multiple observations) and relates to "Binary System". Similarly, "Accretion Disk" depends on the presence of a central object and infalling matter (which might be inferred from spectrum and motion).
    - In Kit B, "Metallicity Spike" depends on the identification of metal lines in the spectrum (which requires "Spectral Line Shift" to account for any shifts) and relates to "Nebular Emission" for gas clouds.

  Anomaly Case:
    - For Kit A: An event that shows a complex motion pattern that doesn't fit into Orbital Resonance or Binary System, and has a spectral signature that doesn't match a flare or accretion. E.g., a star that dims irregularly with no clear period and shows unusual spectral lines.
    - For Kit B: An event that has a spectrum with lines that don't match known elements or processes, and a brightness change that doesn't fit known emission or absorption patterns.

  Cross-Examination:
    - Each group gets the other group's lexicon (just the list of terms, without definitions) and must write definitions in their own terms for each.
    - Then, they are given a case that both groups have solved (from the puzzles) and must classify it using the other group's system (without the other group's definitions) and then score the other group's solution using their own scoring rule.

  Forced Comparison:
    - Each group nominates a criterion (e.g., "Which kit explains more cases?" but note that they have orthogonal strengths). The other group must argue that the criterion is applied within their own framework and that they do better by their own lights.

  Handling Predictable Problems:

  1. Code-switching too easily / "just labels":
     - The facilitator must enforce strict separation. If groups mix, intervene and remind them they are to work only with their own kit. During cross-examination, they must not look at the other group's definitions. If they say "it's just labels," point out that they must solve the puzzles using the provided system and that the scoring rules are different. In the debrief, this becomes a point: the activity shows that the terms are not just labels because they are tied to a whole system of classification and scoring.

  2. One kit is obviously stronger:
     - We design the kits to be orthogonal. But if one group dominates, the facilitator can note that in the debrief: "In real science, sometimes one theory is better in most respects, but here we set up a scenario where they are meant to be incommensurable. The point is to see that even when both have strengths, the choice is not straightforward."

  What the Activity Cannot Reproduce:
     - The activity cannot reproduce the historical depth and the weight of a scientific tradition. In real science, paradigms are deeply embedded in practices, instruments, and training. The activity is a simulation that compresses time and simplifies the social and institutional aspects. You must supply the context that in real science, switching paradigms involves re-education and may take a generation.

  Materials Preparation:

  1. Prepare two sets of handouts (or projected slides if using a projector) for each kit: lexicon with definitions, 3 exemplars, 5 puzzles, and the scoring rule.
  2. Prepare a set of neutral case descriptions (at least 5 puzzles plus the anomaly case and the cross-examination case). The same set of cases for both kits.
  3. Prepare the anomaly cases (sealed envelopes) and the cross-examination case (a case that both groups have already solved in their own way).

  Timing Breakdown:

  - Introduction: 10 min
  - Group Work Phase 1 (learning and solving puzzles): 30 min
  - Anomaly: 10 min
  - Cross-Examination: 20 min (10 min for translation, 10 min for scoring the other group's solution)
  - Forced Comparison: 15 min (5 min for each group to nominate a criterion, 5 min for rebuttal by the other group, 5 min for discussion)
  - Debrief: 25 min

  Roles:
  - Facilitator: introduces, times, enforces rules, circulates to answer questions, takes notes on group behavior (especially during anomaly and cross-examination), leads debrief.

  Debrief Points:

  1. Map activity to incommensurability:
     - The difficulty in translation (false friends, dependencies) shows local untranslatability.
     - The scoring rules being internal to each kit show that what counts as a good solution is paradigm-dependent.
     - The anomaly handling shows how anomalies are often patched within a paradigm until they become too many.

  2. Kuhn's ideas (now introduce the terms):
     - Incommensurability: not global but local, affecting clusters of terms.
     - Learning a new paradigm is like learning a language: you become bilingual, but there is no neutral dictionary.
     - Theory choice values: accuracy, consistency, scope, simplicity, fruitfulness. In the activity, when they nominated criteria, these might have been similar to Kuhn's values, but they were applied within a framework.

  3. Loss of solved problems: When switching kits, some puzzles that were easy in one become hard in the other. (Note: we designed orthogonal strengths.)

  4. Objection: The activity design concedes that there is a common basis: the neutral observation language. This allows us to compare the two kits on the same cases. However, note that the observation language does not settle which kit is better because the scoring is internal. This is like Kuhn's concession that there is some shared basis (e.g., measurements) but that the interpretation is theory-laden.

  Final note: The activity is designed to be self-contained and uses astronomy because it is rich in classification and the students may have some pop-science familiarity but not expert knowledge. The kits are simplified for the exercise.

  Let's now write the materials for the kits (abridged for brevity in this response, but in practice you would write full examples).

  Kit A: Stellar Dynamics Framework (abridged)

  Lexicon (definitions as above).

  Exemplar 1: A case of a binary system with eclipses (periodic dimming and no color change) -> classified as Binary System and the dimming as Exoplanetary Transit? Wait, but we don't want confusion. Better to have clear cases.

  Revised: Let's ensure the exemplars are clear.

  Exemplar 1 for Kit A:
    Case: Periodic dimming every 3 days, with a 1% drop in brightness, no color change, and a spectrum that shows no emission lines -> Exoplanetary Transit.

  Exemplar 2: A star that shows a sudden brightening in X-ray and then fades in an hour -> Stellar Flare.

  Exemplar 3: Two stars that show a periodic wobble in position -> Binary System.

  Puzzles for Kit A (5 cases that can be classified with the lexicon).

  Similarly for Kit B.

  This is a framework for the activity. You would need to flesh out the cases and ensure that the puzzles are solvable by one kit but not the other in some instances, and that the orthogonal strengths are clear.
answer: |-
  ### Astronomy Classification Activity: Materials and Facilitator Guide  
  **Objective:** Simulate incommensurability through hands-on classification. Students experience untranslatable vocabularies, paradigm-dependent problem-solving, and loss during scheme change—without mentioning Kuhn or his terminology until debrief.  

  ---

  ### **Materials to Prepare**  
  **Neutral Observation Language (Projector/Slides):**  
  Descriptions of 10 astronomical events. Each event includes:  
  - **Location** (e.g., "RA 14h 30m, Dec -60°")  
  - **Brightness changes** (e.g., "brightness increased from 8.1 to 7.2 mag over 2 hours")  
  - **Spectral data** (e.g., "prominent H-alpha line at 656.3 nm, weak OIII line at 500.7 nm")  
  - **Motion** (e.g., "no detectable motion" or "shifted 0.1° northwest")  
  - **Duration/Shape** (e.g., "point source, duration 120 minutes")  
  *Example Event:*  
  > **Event 7:** Located at RA 05h 53m, Dec +28°; brightness steady at 6.5 mag; spectrum shows strong hydrogen lines at 486.1 nm and 656.3 nm; circular shape, no motion detected.  

  **Kit A (Stellar Dynamics Framework):**  
  - **Lexicon (8 terms):**  
    1. **Orbital Lock:** Regular, repeating motion patterns between two bodies (e.g., periodic position shifts).  
    2. **Gravity Bend:** Light distortion causing multiple images (e.g., duplicated sources in data).  
    3. **Flare Burst:** Sudden energy release increasing brightness without spectral shifts.  
    4. **Twin System:** Two objects orbiting a shared center (e.g., paired brightness dips).  
    5. **Doppler Slide:** Gradual color shift indicating motion toward/away.  
    6. **Feeding Disk:** Matter spiraling into an object, causing flickering brightness and high-energy spectra.  
    7. **Ray Spike:** Brief, high-energy particle surge (e.g., gamma-ray detection).  
    8. **Transit Dip:** Symmetrical dimming from an object passing in front (e.g., sharp brightness drop).  
  - **Worked Exemplars (3):**  
    - *Ex. 1:* Event showing paired brightness dips → **Twin System**.  
    - *Ex. 2:* Gradual red shift over months → **Doppler Slide**.  
    - *Ex. 3:* Sudden brightness spike with gamma rays → **Ray Spike**.  
  - **Puzzles (5):** Events solvable with Kit A terms (e.g., motion/energy-focused).  
  - **Scoring Rule:** "Solutions must explain **motion or energy changes** (1–5 points)."  

  **Kit B (Spectral Composition Framework):**  
  - **Lexicon (8 terms):**  
    1. **Metal Rich:** High concentrations of heavy elements (e.g., iron/nickel spectral lines).  
    2. **Line Drift:** Spectral line shifts due to motion or pressure (e.g., H-alpha line displacement).  
    3. **Gas Glow:** Ionized gas emission (e.g., nebular spectra with OIII lines).  
    4. **Shell Eject:** Expanding gas sphere (e.g., ring-shaped, emission-line spectra).  
    5. **Heavy Water:** Excess deuterium (e.g., specific hydrogen isotope lines).  
    6. **Dust Redden:** Light scattering causing color changes (e.g., blue to red shift).  
    7. **Helium Pop:** Sudden helium fusion burst (e.g., brightness spike with helium lines).  
    8. **Atmos Fade:** Atmospheric absorption (e.g., sharp spectral dips).  
  - **Worked Exemplars (3):**  
    - *Ex. 1:* Ring-shaped event with OIII lines → **Shell Eject**.  
    - *Ex. 2:* Blue-to-red color shift → **Dust Redden**.  
    - *Ex. 3:* Helium line brightness spike → **Helium Pop**.  
  - **Puzzles (5):** Events solvable with Kit B terms (e.g., composition/spectra-focused).  
  - **Scoring Rule:** "Solutions must explain **material properties or spectral features** (1–5 points)."  

  **Anomaly Cases (Sealed Envelopes):**  
  - **Kit A Anomaly:** *Event with spectral shifts but no motion (e.g., "Line Drift" false friend)*.  
    > **Anomaly A:** Flickering brightness with strong helium lines; no motion detected. (*Patched by adding "chemical flares" to Flare Burst*).  
  - **Kit B Anomaly:** *Event with motion but no spectral data (e.g., "Doppler Slide" false friend)*.  
    > **Anomaly B:** Steady position shift with no spectral lines; duration 1 hour. (*Patched by redefining "Line Drift" as positional drift*).  

  **Cross-Examination Case (Projector):**  
  > **Event X:** Located at RA 12h 00m, Dec -40°; brightness dips every 48 hours; spectrum shows hydrogen lines; slight blue shift.  

  **Additional:**  
  - Group handouts (kits + puzzles).  
  - Timer, whiteboard (for scoring), pens/paper.  

  ---

  ### **Activity Rules and Timing**  
  **Total: 90 minutes**  
  1. **Introduction (5 min):**  
     - "You are astronomers using two classification systems. Master your kit, solve puzzles, and follow your scoring rule. Do not mix systems."  
     - Split into Group A (Stellar Dynamics) and Group B (Spectral Composition).  

  2. **Group Work Phase 1: Learning & Puzzles (25 min):**  
     - Groups review lexicons, exemplars, and solve 5 puzzles.  
     - *Facilitator:* Enforce separation. Clarify terms but do not hint at connections.  

  3. **Anomaly (10 min):**  
     - Give sealed anomalies. Instruct: "Classify this using your kit. If it doesn’t fit, adapt your system."  
     - *Facilitator notes:* Do groups patch (e.g., tweak definitions) or abandon?  

  4. **Cross-Examination (20 min):**  
     - **Step 1:** Groups swap lexicons (terms only, no definitions). Each writes translations into their terms.  
     - **Step 2:** Project **Event X**. Groups:  
       - Classify Event X using their own kit.  
       - Score the *other* group’s classification using their own scoring rule.  
     - *Example:* Group A uses "Twin System" for Event X; Group B scores it poorly for ignoring spectral features.  

  5. **Forced Comparison (15 min):**  
     - Group A proposes a criterion to choose kits (e.g., "accuracy"). Group B argues why it’s kit-dependent (e.g., "accuracy in Kit B means spectral detail").  
     - Reverse roles (Group B proposes, e.g., "simplicity"; Group A rebuts).  
     - *Facilitator asks:* "Is there a neutral criterion?"  

  6. **Debrief (15 min):**  
     - Reveal Kuhn’s ideas using the activity’s moments (see below).  

  ---

  ### **Predictable Problems & Solutions**  
  - **Problem 1: Code-Switching Too Easily ("Just Labels!")**  
    - *Signs:* Groups translate terms 1:1 (e.g., "Flare Burst = Helium Pop").  
    - *Intervention:* Remind them of dependencies (e.g., "Can you define Orbital Lock without motion terms?") and scoring rules. In debrief, highlight false friends (e.g., "Line Drift" vs. "Doppler Slide").  

  - **Problem 2: One Kit Dominates ("Ours is Better!")**  
    - *Signs:* Group A dismisses Group B for ignoring motion.  
    - *Intervention:* Assign scoring asymmetrically. *Example:* Force Group A to score Event X under Kit B’s rule—they’ll score low for omitting spectra. In debrief, stress orthogonality: "Kit A explains motion; Kit B explains composition. Neither is universal."  

  - **Problem 3: Anomaly Patching Fails**  
    - *Signs:* Groups abandon kits instead of patching.  
    - *Intervention:* Provide hints (e.g., "Could Flare Burst include chemical reactions?").  

  ---

  ### **Debrief Script**  
  **Map Activity to Kuhn’s Ideas (Name Dropped Now):**  
  1. **Incommensurability as Local Untranslatability:**  
     - "False friends (e.g., Line Drift vs. Doppler Slide) and dependencies (e.g., Twin System requiring motion terms) made translation impossible. Kuhn called this **incommensurability**—not about ‘worldviews,’ but clusters of terms losing meaning when isolated."  
     - "When you scored each other’s work, you saw **paradigm-dependent standards**. A ‘solution’ in Kit A was an ‘anomaly’ in Kit B."  

  2. **Bilingualism vs. Neutrality:**  
     - "You could *learn* both kits (become bilingual), but no neutral dictionary bridged them. Historians of science often do this—they grasp past theories on their own terms."  

  3. **Theory Choice & Loss:**  
     - "Kuhn argued theory choice uses values like simplicity or accuracy. But as you saw, these are **weighted differently** in each kit. Kit A valued motion; Kit B valued spectra. When you switched kits, you **lost solved problems** (e.g., Kit A couldn’t classify Gas Glow events cleanly)."  

  4. **Conceding the Objection:**  
     - "An objection: ‘If you see the same stars, you *must* share something!’ True! Our **neutral observations** (e.g., brightness data) were shared. Kuhn conceded this—but as you saw, observations alone don’t fix classifications or scores."  

  ---

  ### **What the Activity Cannot Simulate (Be Frank)**  
  **You must supply:** The **historical weight** of a paradigm. In real science, paradigms embed in textbooks, instruments, and careers—switching feels like "betrayal," not just reclassification. This activity compresses a lifetime of training into 90 minutes. Without this, the "loss" feels intellectual, not existential. Say plainly:  
  > *"Today, you felt friction between systems, but in real science, this costs careers. You debated Event X—Galileo risked his life for such debates."*  

  ---

  ### **Why This Works**  
  - **False Friends & Dependencies:** "Line Drift" (B) and "Doppler Slide" (A) seem similar but differ fundamentally (composition vs. motion). "Twin System" (A) requires motion terms—untranslatable piecemeal.  
  - **Orthogonal Strengths:** Kit A excels on motion puzzles; Kit B on spectral puzzles. Event X is ambiguous—neither dominates.  
  - **Loss in Real-Time:** Groups see their solved puzzles become anomalies under the rival kit.  

  **Run it cold. Let frustration build. Debrief hot.**
