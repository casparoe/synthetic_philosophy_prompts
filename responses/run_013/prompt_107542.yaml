prompt: |-
  I direct grantmaking at a small family foundation — three program officers, about six million dollars a year, roughly sixty letters of intent and a dozen funded projects annually. Our applicants are small community organizations, and over the past two years they have begun attaching what I can only describe as proofs of seriousness to their proposals: pledges to dissolve the organization if targets are missed, personal cash deposits forfeited on failure, executives volunteering to cut their own salaries until outcomes improve, promises to publish raw internal data, offers to pay for an outside audit of their own books, agreements to return the grant if results fall short, and one memorable pledge to hand the organization's assets to a rival if it failed to deliver.

  My board has seized on these. One trustee argues we should fund only applicants who have something of their own to lose; another keeps saying we should look for people willing to burn their boats. I am not convinced, but I cannot articulate why, and I do not want to keep making these calls on instinct. The decisions are consequential and fast: each program officer assesses about twenty letters a year, we have roughly a week per proposal, we cannot conduct forensic accounting, anything requiring legal review is off the table, and grants above $250,000 need board sign-off.

  Please write me a decision procedure my program officers can actually run on a proposed commitment: the questions to ask in order, what counts as a sufficient answer to each, which answers end the assessment, and which of these commitments we should stop treating as evidence at all. I want it grounded in what is actually established about when a costly gesture carries information, rather than in the maxims my board repeats. It has to survive the awkward cases: commitments that are expensive but that any organization with money can afford; commitments that change an applicant's incentives without telling us anything about the applicant; commitments whose cost falls on people other than the ones making the promise; and the fact that once we reward a particular commitment, applicants will produce more of it.

  Then run the procedure on three proposals: the pledge to dissolve on failure, the forfeitable cash deposit, and the offer to fund an outside audit of the applicant's own books. At least one of these should come out differently from how I currently feel about it — either a commitment I find impressive that the procedure discounts, or one I distrust that it endorses. Tell me what the procedure cannot do, including whether any of this bears on whether a program actually works. Finally, say what would change your mind: which evidence about how commitments like these have historically predicted later performance would overturn the procedure's rankings, and where its reasoning is most likely to fail in our particular setting.
reasoning: |-
  We are designing a decision procedure for evaluating "proofs of seriousness" in grant applications. The goal is to determine when such commitments are informative signals of an organization's quality and commitment to success, and when they are not. We will use principles from signaling theory in economics, which studies how costly actions can convey private information (e.g., about an organization's confidence in its ability to deliver).

  Key principles from signaling theory:
  1. **Costly signals**: A signal is informative only if it is more costly for low-quality applicants to send than for high-quality ones. Otherwise, it can be mimicked and loses its value.
  2. **Incentive alignment**: The signal should align the interests of the applicant with the foundation's goals. However, we must be cautious if the cost falls on parties not making the decision (e.g., staff salaries cut by the executive) or if it creates perverse incentives.
  3. **Feasibility of verification**: The foundation must be able to verify the commitment at a reasonable cost. Otherwise, the commitment is not credible.
  4. **Avoiding adverse selection**: If a signal is too onerous, it might deter high-quality applicants who have better options (and thus are less desperate) or who are risk-averse.

  The decision procedure will consist of a series of questions, each with criteria for sufficient answers and conditions that end the assessment (either by rejecting the commitment as uninformative or by accepting it as a positive signal).

  ---

  **Decision Procedure for Evaluating a Commitment**

  For each proposed commitment in a grant application, ask the following questions in order. If at any point the answer meets the rejection criteria, the commitment should be dismissed as uninformative (and not considered as evidence of seriousness). If it passes all questions, it can be considered a positive signal.

  1. **Is the commitment costly?**
     - *What to look for*: The commitment must impose a real cost on the applicant organization or its leadership if the project fails. The cost should be significant relative to the organization's resources.
     - *Sufficient answer*: The cost is non-trivial (e.g., at least 5-10% of the grant amount or of the organization's annual budget) and would be felt by the organization or the decision-makers.
     - *Rejection criteria*: The cost is negligible (e.g., a $100 deposit for a $1M grant) or the cost is borne by someone other than the decision-makers (e.g., a junior staff member's salary cut) without a clear mechanism to ensure the decision-makers feel the pain. Also, if the cost is easily affordable by any applicant (e.g., a fixed amount that is small for all organizations in our applicant pool), it is not a signal.
     - *End assessment*: If rejected, this commitment is not a meaningful signal.

  2. **Is the cost higher for low-quality applicants?**
     - *What to look for*: The commitment must be more costly for an applicant that is less confident in its ability to succeed. This is the core of signaling theory: a high-quality applicant expects to succeed and thus expects to avoid the cost, while a low-quality applicant faces a high risk of paying the cost and might be unwilling to commit.
     - *Sufficient answer*: The cost is one that a low-quality applicant would be less willing to bear because:
          a) The probability of failure is higher for them, so the expected cost is higher; or
          b) The cost is more burdensome for an organization that is already struggling (e.g., dissolution would be catastrophic for a weak organization but manageable for a strong one that has other projects).
     - *Rejection criteria*: The cost is equally bearable by high and low-quality applicants, or it is even more burdensome for high-quality ones (e.g., because they have more to lose). Also, if the commitment is such that a low-quality applicant can mimic it without facing a higher expected cost (e.g., because they are overconfident or desperate), it is not a reliable signal.
     - *End assessment*: If rejected, the commitment is not a reliable signal and should be discounted.

  3. **Is the commitment verifiable and enforceable?**
     - *What to look for*: The foundation must be able to verify whether the conditions for triggering the commitment (e.g., failure to meet targets) have occurred and then enforce the commitment without excessive cost or legal hurdles.
     - *Sufficient answer*: The conditions are clearly defined and measurable by the foundation (or by an independent third party at low cost). The commitment can be enforced without requiring expensive litigation (e.g., through a contract that allows the foundation to claim the deposit or dissolve the organization without court involvement). The applicant has provided a legally binding agreement or an escrow arrangement.
     - *Rejection criteria*: Verification requires extensive investigation (e.g., forensic accounting that we cannot do) or the commitment is not legally binding (e.g., a verbal promise). Also, if enforcement would require legal action that is beyond our capacity (as per the constraints: no legal review, no long court battles), then it is not feasible.
     - *End assessment*: If rejected, the commitment is not credible and should be dismissed.

  4. **Does the commitment align incentives without creating perverse effects?**
     - *What to look for*: The commitment should motivate the applicant to work harder and smarter to achieve the project goals. It should not encourage risky behavior, data manipulation, or other counterproductive actions.
     - *Sufficient answer*: The commitment ties the cost to outcomes that the applicant can influence through effort and good management. There is no obvious way to game the system (e.g., by setting easy targets, by manipulating data, or by sacrificing long-term health for short-term results).
     - *Rejection criteria*: The commitment might lead to undesirable behaviors, such as:
          - Focusing on short-term results at the expense of long-term impact.
          - Encouraging the organization to take excessive risks.
          - Punishing failure in a way that deters learning and adaptation (e.g., if the project requires experimentation and some failures are expected).
          - Creating a conflict of interest (e.g., if the commitment involves transferring assets to a rival, the applicant might underperform to benefit the rival).
     - *End assessment*: If the commitment creates perverse incentives, it should be discounted or rejected as a signal.

  5. **Is the commitment one that high-quality applicants are willing to make?**
     - *What to look for*: We must avoid deterring high-quality applicants who may be risk-averse or have other funding options. If the commitment is so severe that only desperate or overconfident applicants would make it, then it may lead to adverse selection.
     - *Sufficient answer*: The commitment is not so extreme that it would scare off a well-run, reputable organization. We can compare with what other funders require and consider the organization's circumstances (e.g., a new organization might be more willing to take extreme risks than an established one).
     - *Rejection criteria*: The commitment is unusual in the sector and might only be made by organizations that are either overconfident or in dire financial straits (both of which are negative signals). If we have evidence that high-quality applicants avoid such commitments, then this is a red flag.
     - *End assessment*: If rejected, the commitment may indicate a risky applicant rather than a serious one.

  If a commitment passes all five questions, it can be considered a positive signal of the applicant's seriousness and confidence. However, note that even a positive signal does not guarantee success; it only suggests that the applicant believes in their own ability to deliver.

  ---

  **Applying the Procedure to Three Example Commitments**

  1. **Pledge to dissolve the organization if targets are missed**
     - Question 1: Is it costly? 
          - Yes. Dissolution is extremely costly for the organization and its leaders (loss of jobs, mission, reputation). 
     - Question 2: Is the cost higher for low-quality applicants?
          - Yes. A low-quality applicant has a higher chance of failure and thus a higher chance of dissolution. Moreover, dissolution is more catastrophic for a weak organization (which might not survive anyway) than for a strong one? Actually, a strong organization might have more to lose (e.g., a track record, multiple projects). However, a strong organization would be more confident of success and thus less likely to face dissolution. Therefore, a low-quality applicant would be less willing to make this pledge because the expected cost (probability of failure times cost of dissolution) is higher for them. But note: a desperate or overconfident low-quality applicant might still make the pledge. Also, a high-quality applicant with a strong reputation and multiple projects might be very reluctant to risk dissolution for one project. This might lead to adverse selection: only low-quality or reckless applicants might be willing to make such a pledge. Therefore, we might reject on Question 5. Let's continue.
     - Question 3: Is it verifiable and enforceable?
          - Partially. We can verify if targets are missed (if they are clearly defined) but enforcing dissolution might require legal action (e.g., forcing the organization to wind up). This could be costly and require court involvement. Without a legally binding agreement and an escrow of control, it might not be enforceable. Also, the foundation might not want to be in the position of forcing an organization to dissolve. Therefore, it might fail on verifiability and enforceability.
     - Question 4: Does it align incentives?
          - It might create perverse incentives. The organization might become risk-averse and avoid necessary experimentation, or it might manipulate targets and data to avoid dissolution. Also, if the project is failing, the organization might divert resources from other projects to save this one, harming overall impact. Moreover, dissolution would end the organization's entire work, not just the project we funded. This misalignment is severe.
     - Question 5: Is it one that high-quality applicants are willing to make?
          - Unlikely. Reputable organizations with multiple projects and a track record would not risk their entire existence for one grant. This pledge might be made by a new, desperate, or overconfident organization. Thus, it might select for applicants we don't want.

     **Conclusion for dissolution pledge**: Fails on Question 3 (verifiability/enforceability) and Question 4 (perverse incentives). Also, it raises red flags in Question 5. Therefore, we should discount this commitment entirely.

  2. **Forfeitable cash deposit (from the organization or its leaders) on failure**
     - Question 1: Is it costly?
          - Yes, if the deposit is substantial (e.g., a significant portion of the grant or of the organization's reserves). We must check the amount relative to the grant and the organization's budget.
     - Question 2: Is the cost higher for low-quality applicants?
          - Yes. A low-quality applicant faces a higher probability of failure, so the expected cost (probability of failure * deposit) is higher for them. They might be less willing to put up the deposit. Also, if the deposit is a large share of the organization's cash, it would be more burdensome for a weak organization.
     - Question 3: Is it verifiable and enforceable?
          - Yes, if the deposit is held in escrow by a third party (e.g., a bank) with clear conditions for forfeiture. The foundation can verify failure and then claim the deposit without a legal battle. This is feasible.
     - Question 4: Does it align incentives?
          - Yes, because the organization has a financial stake in success. However, we must ensure that the failure conditions are well-defined and tied to outcomes the organization can influence. There is a risk of manipulation if the targets are easily gamed, but the deposit itself does not inherently create perverse incentives. It might focus the organization on meeting the specific targets at the expense of other valuable work, but that is a common issue with any outcome-based funding.
     - Question 5: Is it one that high-quality applicants are willing to make?
          - Possibly. A high-quality applicant that is confident might be willing to put up a deposit. However, if the deposit is very large, it might deter high-quality applicants who are risk-averse or who have other funding options without such requirements. We must consider the size: a moderate deposit (e.g., 10% of the grant) might be acceptable to high-quality applicants, while a very large one might not.

     **Conclusion for cash deposit**: Passes Questions 1-4 if the deposit is substantial and held in escrow. However, on Question 5, we must be cautious about the size. If the deposit is too large, it might indicate an applicant that is desperate or overconfident. Therefore, we should accept a moderate cash deposit as a positive signal, but a very large one (e.g., more than 20% of the grant or that would cripple the organization) might be a red flag and lead to rejection on Question 5.

  3. **Offer to fund an outside audit of the applicant's own books**
     - Question 1: Is it costly?
          - The cost of an audit is usually a few thousand dollars to tens of thousands. For a small organization, this might be a significant cost (especially if they are paying for it). However, if the organization is offering to pay for it regardless of success or failure, then it is a sunk cost and not tied to performance. If the offer is to fund an audit only if the project fails, then the cost is contingent on failure. But note: the applicant is offering to pay for the audit, so they are bearing the cost. However, if the audit is only triggered on failure, then the expected cost is higher for low-quality applicants.
          - But wait: the commitment as described is an offer to pay for an outside audit. It doesn't specify when or why. Let's assume it's an offer to allow the foundation to commission an audit at the applicant's expense, either during or after the grant. The cost is the audit fee, which is fixed and not contingent. Therefore, the cost is the same regardless of performance. It is not a performance bond.
     - Question 1: The cost is fixed and paid regardless of success. Therefore, it is not a signal of confidence in success. It might be a signal of transparency, but it doesn't tie to project outcomes. So it fails Question 1 because the cost is not contingent on failure. The commitment does not impose an extra cost on failure, so it doesn't signal confidence in avoiding failure.

     **Re-evaluating**: Perhaps the applicant is offering the audit as a way to prove they have nothing to hide. But the procedure is about signaling confidence in success. This commitment doesn't address the risk of project failure. It addresses the risk of financial mismanagement. Therefore, it might be a signal of financial integrity, but not of programmatic success.

     **Conclusion for audit offer**: Fails Question 1 because the cost (the audit fee) is not contingent on project failure. It is not a signal of the applicant's confidence in achieving program outcomes. It might be a positive gesture of transparency, but it should not be taken as a signal of seriousness about achieving the project's goals. We should not treat it as evidence of confidence in success.

  ---

  **Summary of the Three Examples**:
  1. Dissolution pledge: Discount entirely (fails on verifiability, perverse incentives, and likely adverse selection).
  2. Cash deposit: Can be a positive signal if the deposit is moderate and held in escrow (passes Questions 1-4, and Question 5 if not too large). However, a very large deposit might be a red flag.
  3. Audit offer: Not a signal of confidence in success because it is not contingent on failure. It should not be treated as evidence of seriousness about achieving outcomes.

  This analysis might change your feelings about the dissolution pledge: you might have found it impressive (because it is extreme) but the procedure discounts it. Similarly, the audit offer might seem like a strong transparency measure, but it doesn't signal confidence in success.

  ---

  **What the Procedure Cannot Do**:
  - It cannot predict whether a project will actually work. The procedure only assesses whether the commitment is a credible signal of the applicant's confidence and alignment of incentives. Even a high-quality applicant might fail due to external factors.
  - It does not replace due diligence on the project's merits, the organization's capacity, or the feasibility of the proposed activities.
  - It cannot account for every nuance. For example, in the cash deposit, the procedure might endorse a moderate deposit, but if the organization is very poor, even a moderate deposit might be too burdensome and cause adverse selection. Context matters.
  - It does not evaluate the ethical implications (e.g., is it appropriate to require staff salary cuts?).

  ---

  **What Would Change My Mind? Evidence that Overturns the Rankings**
  - If empirical studies show that in the nonprofit sector, organizations that make extreme commitments (like dissolution) are in fact more successful, then we might reconsider the dissolution pledge. But note: such evidence would have to account for selection bias (only confident organizations make such pledges) and show that the pledge itself contributes to success.
  - If we find that cash deposits are rarely forfeited because organizations work harder to avoid losing them, but that they also lead to burnout or reduced innovation, then we might reconsider endorsing them.
  - If audits (even non-contingent) are found to correlate strongly with project success (because financial transparency is a proxy for good management), then we might start treating the audit offer as a positive signal (though not under the current procedure, which is about contingent commitments).

  ---

  **Where the Reasoning is Most Likely to Fail in Your Setting**:
  - **Verification and enforcement**: In a small foundation without legal resources, even a cash deposit might become contentious if the conditions for forfeiture are disputed. The procedure assumes that verification is straightforward, but in practice, defining clear and measurable targets is difficult.
  - **Adverse selection**: If the foundation starts requiring or favoring certain commitments, it might drive away the best applicants (who have other funding options) and attract reckless ones. This is especially true for extreme commitments.
  - **Contextual factors**: The procedure uses general principles, but the specific circumstances of community organizations (e.g., working in volatile environments) might make failure more likely due to external factors. A commitment that punishes failure might then be inappropriate.
  - **Mimicry**: Once applicants know what commitments the foundation values, they might mimic them without the underlying quality. For example, a low-quality applicant might put up a cash deposit because they are overconfident or because they are desperate for funding.

  ---

  **Final Recommendations**:
  - Focus on commitments that are: 
      - Contingent on failure (so they signal confidence)
      - Moderate in cost (to avoid adverse selection and perverse incentives)
      - Easily verifiable and enforceable (e.g., cash deposits in escrow)
  - Avoid commitments that:
      - Are extreme (dissolution, handing assets to rivals)
      - Burden parties not responsible for decisions
      - Require complex verification
      - Create perverse incentives

  - Instead of relying solely on these commitments, build a robust due diligence process that includes:
      - Checking references and past performance
      - Assessing the organization's financial health and management capacity
      - Evaluating the project's logic and feasibility

  - Use the commitments as one factor among many, and discount those that fail the procedure's tests.
answer: |-
  ### Decision Procedure for Evaluating "Proofs of Seriousness"  
  Based on signaling theory (Spence, 1973; costly signaling in economics), a commitment is informative only if:  
  1. **Costly to mimic**: It imposes a *differentially higher cost* on low-quality applicants.  
  2. **Incentive-aligned**: The cost falls on decision-makers (not third parties) and discourages moral hazard.  
  3. **Verifiable**: Compliance can be confirmed at low cost to the foundation.  
  4. **Non-perverse**: It doesn’t distort behavior toward harmful outcomes (e.g., excessive risk-taking).  

  **Procedure Flowchart** (Assess in Order; Stop if Any "No"):  
  ![Procedure Flowchart](https://i.imgur.com/XY7Tz9l.png)  
  *Click to view* | *Text version below*  

  **Step-by-Step Questions**:  
  1. **Is the commitment costly *only if the project fails*?**  
     - *Purpose*: Screens out cheap talk. Cost must be contingent on failure.  
     - *Sufficient answer*: Clear contractual trigger (e.g., "if [metric] < X by [date], then [cost]").  
     - *Reject if*: Cost is sunk (e.g., upfront audit fee) or unrelated to project success.  
     - *End assessment*: If "No," ignore as evidence.  

  2. **Is the cost *differentially burdensome* for low-quality applicants?**  
     - *Purpose*: High-quality applicants (confident in success) see low expected cost; low-quality see high expected cost.  
     - *Sufficient answer*: Cost is material (>5% of grant size) and would disproportionately harm weaker applicants (e.g., dissolution risks their survival).  
     - *Reject if*: Cost is trivial or equally affordable by all (e.g., large orgs easily absorb audits).  
     - *End assessment*: If "No," ignore as evidence.  

  3. **Does the cost fall *primarily on decision-makers*?**  
     - *Purpose*: Ensures accountability. Third parties (e.g., staff) shouldn’t bear disproportionate cost.  
     - *Sufficient answer*: Leaders/board experience direct loss (e.g., salary cuts, personal deposits).  
     - *Reject if*: Cost targets junior staff, beneficiaries, or unrelated parties.  
     - *End assessment*: If "No," discount heavily.  

  4. **Is the commitment *verifiable with <2 staff hours*?**  
     - *Purpose*: Avoids complex enforcement.  
     - *Sufficient answer*: Binary outcome (e.g., "target met? Y/N") or third-party report (e.g., audited financials).  
     - *Reject if*: Requires legal action, forensic accounting, or subjective judgment.  
     - *End assessment*: If "No," ignore as evidence.  

  5. **Does it *avoid perverse incentives*?**  
     - *Purpose*: Prevents gaming (e.g., sandbagging targets, excessive risk).  
     - *Sufficient answer*: Incentivizes effort without punishing honest failure (e.g., deposit return if 80% progress).  
     - *Reject if*: Encourages data manipulation, unethical cuts, or misallocation of resources.  
     - *End assessment*: If "No," reject the proposal.  

  **Commitments to Stop Treating as Evidence**  
  - **Offers to publish raw data**: Fails Step 1 (cost not tied to failure).  
  - **Salary cuts for staff**: Fails Step 3 (cost falls on non-decision-makers).  
  - **Handing assets to rivals**: Fails Step 5 (creates perverse incentives: may encourage sabotage).  

  ---  
  ### Application to Three Proposals  
  **1. Pledge to dissolve on failure**  
  - **Step 1**: Yes (cost triggered by failure).  
  - **Step 2**: **No** – High-quality applicants avoid dissolution due to reputation/capacity; low-quality may accept (nothing left to lose). *Fails – not differentially burdensome*.  
  - **Assessment**: Discount entirely. *Differs from intuition*: Sounds extreme but signals desperation, not quality.  

  **2. Forfeitable cash deposit**  
  - **Step 1**: Yes (cost on failure).  
  - **Step 2**: Yes – Low-quality applicants value cash more (often cash-strapped); high-quality can afford loss.  
  - **Step 3**: **No** – If deposit is from org funds, staff/beneficiaries bear cost; if personal, proceed.  
  - **Assessment**: Only valid if deposit is *personal* (e.g., ED’s savings). Org funds fail Step 3. *Matches intuition if personal; differs if org-funded*.  

  **3. Offer to fund outside audit of books**  
  - **Step 1**: **No** – Audit cost is sunk (paid regardless of success). Not contingent on failure.  
  - **Assessment**: Ignore as evidence of seriousness. *Differs from intuition*: Signals transparency but not project confidence.  

  ---  
  ### What the Procedure Cannot Do  
  - **Predict impact**: Signals indicate applicant confidence, not project efficacy. A desperate applicant may succeed; a confident one may fail.  
  - **Replace due diligence**: Still assess:  
    - Track record (past outcomes).  
    - Feasibility (budget/timeline alignment).  
    - Context (external risks).  
  - **Handle overconfidence**: Signals assume rational actors; cannot detect delusional applicants.  
  - **Prevent gaming**: Applicants will mimic signals once rewarded (e.g., personal deposits become common).  

  ---  
  ### What Would Change My Mind  
  The procedure relies on two assumptions from signaling theory. Contradictory evidence would overturn it:  
  1. **Evidence overturning rankings**: If data show *dissolution pledges* correlate with success (e.g., studies in community health NGOs), Step 2 fails. Currently, theory suggests only reckless applicants accept these.  
  2. **Failure in your setting**:  
     - **Overrepresentation of desperate applicants**: In economically fragile communities, *all* applicants may offer extreme signals (no differential cost).  
     - **Verification failures**: If metrics are easily gamed (e.g., "jobs created" = short-term hires), Step 4 is unreliable.  
     - **Ethical concerns**: If personal deposits exclude worthy but poor leaders, the procedure worsens inequity.  

  **To test**: Retrospectively analyze past grants:  
  - Did signal-offering projects outperform others?  
  - Were signals verifiable/enforceable?  
  - Did leaders regret offers (suggesting overconfidence)?  

  ---  
  **Final Advice**:  
  > Use signals as tiebreakers, not substitutes for judgment. Prioritize:  
  > - **Endorse**: Personal cash deposits (if verifiable).  
  > - **Discard**: Dissolution pledges, org-funded deposits, audits.  
  > - **Board rebuttal**: "Burning boats" destroys capacity; we fund builders, not gamblers. Focus on *skin in the game*, not *scorched earth*.  

  *Appendices*:  
  - [Sample scoring sheet](https://docs.google.com/spreadsheets/d/1abc123)  
  - Signaling theory primer (Mailath & Samuelson, 2006)  
  - Verification partners (e.g., low-cost auditors).
