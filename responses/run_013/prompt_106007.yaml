answer: |-
  Here is a specification of desiderata for an adequate theory of affirmative action/quota systems, framed for your comparative project and policymaker focus, using British English:

  **Desiderata for an Adequate Theory of Affirmative Action/Quotas**

  1.  **Account for Paradigm Cases (Non-Negotiable):** The theory must explain widespread intuitions about clear cases. This includes a scheme widely seen as *permissible* (e.g., Norway's gender board quotas promoting equal participation) and one widely seen as *impermissible* (e.g., explicit racial exclusion favouring a historically dominant group, akin to apartheid policies). Motivation: A theory failing this lacks explanatory power and practical relevance for distinguishing acceptable from unacceptable differential treatment.

  2.  **Engage the Equal Treatment Objection Directly (Non-Negotiable):** The theory must explicitly address the claim that differential treatment based on group membership inherently violates principles of individual equality and fairness, rather than dismissing it or treating group identity as irrelevant. Motivation: This is the core moral objection; evasion renders the theory inadequate for serious normative debate or justifying the deviation from formal equality inherent in such schemes.

  3.  **Distinguish Foundational Justifications (Non-Negotiable):** The theory must clearly differentiate between, and account for the distinct demands of:
      *   **Backward-Looking Compensation:** Rectifying specific, identifiable past wrongs against a group.
      *   **Remedy for Present Discrimination:** Countering ongoing, provable discriminatory acts or biases.
      *   **Redress of Structural Disadvantage:** Addressing systemic barriers and unequal starting points arising from historical and social forces, even absent intentional current discrimination or specific compensable past acts.
      Motivation: Conflating these leads to imprecise policy design, weakens arguments, and obscures relevant evidence (e.g., proving past harm vs. demonstrating current structural barriers). The theory should also clarify if a *single scheme* can legitimately rest on multiple justifications simultaneously and how they interact.

  4.  **Distinguish Quota as Floor from Quota as Ceiling (Non-Negotiable):** The theory must recognise the normative difference between a minimum guarantee ("floor", ensuring *at least* X% representation) and a maximum cap ("ceiling", ensuring *no more than* Y% representation). Motivation: The justification for preventing under-representation (floor) is often distinct from, and sometimes opposed to, the justification for preventing dominance (ceiling), as seen starkly in India's total reservation ceiling. Design hinges on this distinction.

  5.  **Respect Group Representation vs. Individual Desert (Non-Negotiable):** The theory must acknowledge the potential tension between advancing group-level outcomes (e.g., proportional representation, overcoming group disadvantage) and honouring individual merit or desert in specific allocation decisions. It must explain how this tension is managed or justified. Motivation: Ignoring this risks collapsing into essentialism (treating individuals solely as group members) or unfairly overriding individual claims based on comparative achievement/qualification in specific contexts like admissions or hiring.

  6.  **Specify the Exit Condition (Contested Preference, but Highly Recommended):** The theory should articulate principled conditions under which the scheme could or should be withdrawn. This might involve achieving specific representation targets, measurable reduction in disadvantage, passage of time, or other verifiable criteria. Motivation: Perpetual group-based preferences raise concerns about fairness, ossification, and dependency. An exit strategy addresses legitimacy concerns and forces consideration of the scheme's purpose and success metrics. However, some argue persistent structural disadvantage negates the feasibility or fairness of a defined exit.

  7.  **Handle Internal Group Heterogeneity (Non-Negotiable):** The theory must account for socio-economic and other disparities *within* beneficiary groups and address whether/precisely how the scheme should (or should not) target only the most disadvantaged sub-groups. Motivation: The "creamy layer" exclusion in India exemplifies this challenge. Ignoring intra-group inequality risks benefiting the relatively advantaged within the group, failing to reach the most marginalised, and undermining claims of distributive justice or need-based redress.

  8.  **Address Legal/Operational Constraints (Non-Negotiable):** The theory must be cognisant of the typical legal/political realities framing such schemes, such as prohibitions on strict quotas in some jurisdictions (requiring softer "goals" or "plus factors"), requirements for proportionality, or limitations on total reserved seats. Motivation: A purely abstract theory divorced from the constraints under which policies must *actually* be implemented (e.g., constitutional rights frameworks, political feasibility) is inadequate for guiding real-world policymakers.

  9.  **Explain Common Structure vs. Distinct Justifications (Contested Preference):** The theory should either identify a *unifying principle* justifying the common structural form (differential treatment based on group identity in allocation) across contexts like admissions, legislative/job reservations, and corporate boards, or explicitly demonstrate why *distinct justifications* are required for each context. Motivation: Policymakers need to know if lessons are transferable across domains. The apparent similarity in form demands explanation – is the core justification the same, or does the context (e.g., educational mission vs. corporate governance vs. political representation) fundamentally alter the rationale?

  **Analysis of Conflicts and Excluding Power:**

  *   **Key Conflict:** **Exit Condition (6)** vs. **Redress of Structural Disadvantage (3c)**. Articulating a clear exit condition is often demanded for legitimacy. However, if the core justification is redress of deep-seated, self-perpetuating structural disadvantage (which may evolve but not neatly "end"), defining a feasible and just exit becomes conceptually difficult and potentially undermines the long-term commitment arguably required. Theories struggle to satisfy both simultaneously without compromising one.
  *   **Most Excluding Requirement:** **Engage the Equal Treatment Objection Directly (2)**. This requirement filters out theories that rely solely on pragmatic outcomes, uncritical appeals to group rights, or vague appeals to "social justice" without meticulously explaining why differential treatment is not a fundamental violation of individual equality in the specific context. It forces the theory to confront the strongest counter-argument head-on. This requirement *is* highly contested, as proponents of strong group-based approaches may view formal equality as an inadequate starting point.

  **Brief Evaluation of Justification Families against Criteria:**

  1.  **Backward-Looking Compensation:** Strong on specificity (potentially addressing 3a, 6) but struggles severely with 1 (impermissible cases often lack compensable harm), 3c (structural disadvantage without direct perpetrators), 7 (harm may not affect all equally), and 9 (less relevant to board quotas). Faces immense difficulty satisfying 2 directly without relying on other arguments.
  2.  **Forward-Looking Diversity:** Addresses 1 (can justify Norway, explain why exclusion is impermissible), 2 (by arguing diversity serves a compelling interest outweighing formal equality), and 9 (can apply across contexts via context-specific benefits). Weak on 3 (conflates distinct rationales), 5 (risks instrumentalising individuals), 6 (diversity may be a permanent goal), 7 (benefits may accrue to group elites), and struggles with scale/quotas (how much diversity is needed?).
  3.  **Equality of Opportunity / Levelling the Playing Field:** Strong on 3c (structural disadvantage core), 5 (aims for fairer individual competition), 7 (can target need within groups), 8 (often aligns with proportionality). Addresses 2 by arguing formal equality is hollow without fair starting points. Can struggle with 1 (justifying hard quotas vs. opportunity enhancement), 6 (structural barriers may persist), and 9 (board quotas less about individual opportunity).
  4.  **Democratic Representation:** Directly addresses quotas in political/reserved seats and, by extension, corporate governance (9). Strong on 1 (justifying inclusion, condemning exclusion), 4 (floors for representation). Weak on 2 (may sidestep individual equality by focusing on group voice), 3 (conflates distinct rationales), 5 (representation ≠ individual desert), 6 (representation may be a permanent need), and 7 (may empower elite subgroups).

  **Settled vs. Contested:**

  *   **Settled:** Most serious theorists accept that simple "past discrimination" (3a) is insufficient alone to justify ongoing, especially permanent, schemes (esp. given 6,7). Most also accept that formal equality (2) is a serious objection requiring a robust response; evasion is inadequate. Legal constraints (8) are undeniable factors.
  *   **Contested:** Whether diversity (especially outside education) is a sufficiently compelling interest to override 2. Whether structural disadvantage (3c) can *only* be redressed via group-based preferences. The necessity and feasibility of a defined exit condition (6). The validity of group representation (5) as a primary goal overriding individual desert in specific allocations. Whether a single core justification unites all forms (9). The relative weight given to 5 (individual desert) remains deeply disputed.
