prompt: |-
  I run the grants program at a small family foundation. We make about 40 grants a year, mostly 20k-75k to community nonprofits, and I screen 150-odd applications a cycle with one associate and a board that mostly rubber-stamps my shortlist. What kills me is telling credible claims from cheap talk — everybody has community buy-in, a proven model, a waiting list. My old boss's rule was to back the ones who'd clearly bled for it, and I never knew what that meant operationally.

  Can you turn the handicap principle / costly signaling ideas from biology and economics into a screening procedure I can actually run, an hour per application maybe? Tests in the order I should apply them, what a passing answer looks like at each step, and a flag on which steps are just my judgement wearing a lab coat. Dont give me "it was expensive so it's true" — I'm fairly sure the part I keep getting wrong is about who finds it expensive.

  Run it on three files: (1) an applicant whose local health authority will put in 30% if we commit first; (2) an applicant who's run the same after-school program for eleven years with the same two staff and lists that as thier main strength; (3) an applicant who flew thier whole board to a conference and booked it under capacity building. Then tell me where the procedure hands me an answer I dont want, and what it can't settle at all — including whether this whole framework is flexible enough to explain anything, which is a worry I have.
reasoning: |-
  Okay, the user runs a grants program at a small family foundation and is struggling to differentiate between genuine applications and those that are just "cheap talk." They handle about 40 grants annually, each between $20k-$75k, and screen 150 applications per cycle with minimal help. Their board mostly approves their shortlist, so the responsibility falls heavily on them. 

  The user's old boss had a vague rule about backing organizations that "bled for it," which they never understood operationally. They want a practical screening procedure based on the handicap principle and costly signaling from biology/economics, spending about an hour per application. They’re skeptical of simplistic "expensive = true" logic and suspect their mistake lies in misjudging who actually bears the cost. 

  They’ve provided three test cases:  
  1. A health project where the local authority will contribute 30% if the foundation commits first.  
  2. An after-school program with the same two staff for 11 years, listed as their main strength.  
  3. An org that flew its entire board to a conference under "capacity building."  

  They also want honesty about where the procedure fails—like when it gives counterintuitive results, where it’s inconclusive, or if the framework itself is too flexible to be useful.  

  First, I need to translate "costly signaling" into grant screening. The core idea is that credible signals *must* be costly to fake—so I’ll focus on actions that would be irrational or unsustainable for a weak applicant to take. But the user’s right: cost is relative. A $10k expense might be trivial for a large NGO but crippling for a grassroots group. The key is calibrating cost to the applicant’s scale and context.  

  For the procedure, I’ll design a 4-step funnel:  
  1. **Asset-Specific Cost Check:** Does the claimed cost actually hurt *this* applicant? (e.g., a tiny org flying its board is a red flag; a university doing it isn’t.)  
  2. **Skin-in-the-Game Test:** Is the cost borne by the applicant in a way that aligns incentives? (e.g., co-funding from a gov body is green; self-funding via founder debt is amber.)  
  3. **Consistency Scrutiny:** Does the cost align with the org’s history and capacity? (e.g., 11 years of low staff turnover signals real commitment.)  
  4. **Waste Filter:** Could the cost be pure waste vs. strategic investment? (e.g., flying board to a *relevant* conference might pass; a luxury retreat wouldn’t.)  

  Each step should take ~15 mins to fit the hour budget. Steps 1 and 3 are objective(ish); 2 and 4 require judgment.  

  For the test cases:  
  - **Case 1 (Health authority 30% match):**  
    *Step 1:* Gov commitment is costly for *them* (bureaucratic hurdles).  
    *Step 2:* Their skin-in-the-game is strong (conditional on foundation).  
    *Step 3:* Consistent if they’ve partnered before.  
    *Step 4:* Not wasteful—leverage is smart.  
    **Verdict:** Strong signal.  

  - **Case 2 (After-school program):**  
    *Step 1:* 11 years with same staff is *brutally* costly (nonprofit wages = opportunity cost).  
    *Step 2:* Skin-in-the-game is personal sacrifice.  
    *Step 3:* Hyper-consistent.  
    *Step 4:* Not waste—retention enables impact.  
    **Verdict:** Strong signal, but risks undervaluing growth/innovation.  

  - **Case 3 (Board flight to conference):**  
    *Step 1:* Costly for a small org? Likely yes.  
    *Step 2:* But whose skin? Board’s vanity? Org’s funds?  
    *Step 3:* Inconsistent if they’ve never done this before.  
    *Step 4:* Waste risk high—unless it’s a niche, high-impact event.  
    **Verdict:** Weak signal without context; needs probing.  

  **Framework flaws:**  
  - It’ll miss quiet competence (e.g., an efficient org that doesn’t "perform" sacrifice).  
  - Favors groups that can afford visible costs—biases against bootstrappers.  
  - Can’t assess actual impact, only credibility.  
  - Flexible theories *can* explain anything post-hoc, but the procedure forces pre-set criteria to mitigate this.  

  User’s deeper needs: They’re overwhelmed by narrative spin and want *leverage*—a way to quickly triage. They also fear their own blind spots ("who finds it expensive"). The procedure addresses this by anchoring to observable costs and context. But they must still exercise judgment—no algorithm replaces human intuition.
answer: |-
  Here's a screening procedure based on costly signaling theory, designed for efficiency and calibrated to your context. The core principle: **Look for credible signals that are *differentially costly* – affordable for genuinely capable organizations but prohibitively expensive for weak ones to fake consistently.** Focus on *who bears the cost* and *whether it aligns with sustained mission impact*. Aim for ~60 minutes per application.

  **The Costly Signaling Screener (4-Step Funnel)**

  *   **Time Allocation:** Aim for Steps 1 & 2 (15 min), Step 3 (30 min), Step 4 (15 min). Adjust based on initial red/green flags.
  *   **Passing Answer:** Evidence that the claimed cost/sacrifice is **real, borne meaningfully by the applicant (or a committed partner), strategically aligned with impact, and sustainable.** Failure is vagueness, costs easily faked, costs borne by others, or misalignment.
  *   **Judgement Flags:** Steps 2 & 4 are inherently judgement-heavy. Step 1 & 3 have more objective anchors.

  **Step 1: Asset-Specific Cost Check (5-10 min)**
      *   **Question:** *Would this claimed strength/action be TRULY costly *for this specific organization*?*
      *   **Look For:** Contextual clues. Size, budget, history, local economics. A $5k cost is trivial for a $5M org but crippling for a $100k org. "Community buy-in" is cheap talk; *documented* matching funds or volunteer hours proportional to org size are costly.
      *   **Passing:** Evidence the action/resource represents a significant proportion of their budget/effort/time *relative to their scale*. (e.g., A tiny org securing 10 small local business sponsorships signals real buy-in better than a large org getting one corporate sponsor).
      *   **Failing:** Generic boasts ("proven model," "deep relationships") without *specific, proportional* costs shown. Costs that seem negligible for them (e.g., a large university flying 2 staff to a conference).
      *   **🚩 Judgement Flag? LOW.** Primarily factual analysis based on their docs (990s, budgets) and known local context.

  **Step 2: Skin-in-the-Game Test (10-15 min)**
      *   **Question:** *Who *actually* bears the cost/risk? Is it the applicant organization or its core leadership/community in a way that binds them to success?*
      *   **Look For:** Costs borne internally or by deeply invested partners. Founder/ED salary below market, significant board giving, long-term staff retention *despite* low pay, securing hard-to-get local govt matching *requiring their performance*, using restricted reserves. Avoid costs passed to beneficiaries (fees) or future funders (your grant).
      *   **Passing:** Clear evidence the applicant (leadership, board, core staff, key community partners) has put significant *irrecoverable* resources (time, money, reputation, opportunity cost) on the line, contingent on project success. The cost creates a real penalty for failure.
      *   **Failing:** Costs borne primarily by you (the grant), vague "in-kind" from uninvolved entities, reliance on future uncertain funding, boasts about expenses that were externally funded without applicant sacrifice.
      *   **🚩 Judgement Flag? HIGH.** Assessing *who* bears the cost and *how binding* it is requires inference and understanding local power dynamics.

  **Step 3: Consistency & Sustainability Scrutiny (25-30 min)**
      *   **Question:** *Is this costly signal *consistent* with their history, capacity, and mission? Can they *sustain* the effort this signal implies without burning out or distorting their mission?*
      *   **Look For:** Track record aligning with the claimed signal. Budgets showing how costs were covered historically. Staff turnover rates. Evidence of learning/adaptation, not just dogged repetition. Does the "proven model" have *their* data? Does "community buy-in" show sustained engagement over years? Is the cost building long-term capacity or just a one-off?
      *   **Passing:** The costly action is demonstrably part of their core operational DNA, supported by historical data and realistic future plans. It enhances (not drains) their long-term capacity and aligns with their documented expertise/mission.
      *   **Failing:** One-off expensive actions with no history or future plan. High staff turnover contradicting "team strength." "Proven model" used elsewhere but no local evidence. Costs that look like unsustainable heroics or mission drift.
      *   **🚩 Judgement Flag? MEDIUM.** Analyzing patterns over time is more objective than Step 2, but assessing sustainability involves prediction.

  **Step 4: Waste vs. Investment Filter (5-10 min)**
      *   **Question:** *Could this costly signal be *waste* or *status-seeking* rather than a genuine investment in impact?*
      *   **Look For:** Direct link between the cost and improved outcomes for beneficiaries. Fancy offices, excessive travel/conferences, overly complex evaluations without clear utility. Does the cost *directly* enable better service delivery, reach more people, or build essential capacity? Or is it primarily about looking good to funders?
      *   **Passing:** A clear, logical explanation (backed by evidence if possible) of *how* the cost *directly* translates to greater or more effective impact on their mission. The cost is proportional to the expected benefit.
      *   **Failing:** Costs that seem primarily about prestige, comfort, or impressing external audiences with no clear impact pathway. Excessive overhead disconnected from program needs. Signals easily confused with vanity.
      *   **🚩 Judgement Flag? HIGH.** Distinguishing strategic investment from vanity or waste is highly contextual and subjective. Focus on the *impact pathway* argument.

  **Running the Test Cases:**

  1.  **Applicant w/ Health Authority 30% Match (Conditional on Us):**
      *   **Step 1 (Cost Check):** PASS. Securing a *conditional* commitment from a bureaucracy is costly (time, political capital, proving concept). Significant for most nonprofits.
      *   **Step 2 (Skin-in-the-Game):** PASS/AMBER. *Their* skin is in getting the match *conditional on our grant* – they risk failure/embarrassment if it falls through. *Health Authority's* skin is committing funds (costly signal of belief). **Judgement:** Is the HA truly invested? Check history of HA following through.
      *   **Step 3 (Consistency):** PASS if they have a history of successful HA partnerships. AMBER if new (unproven sustainability).
      *   **Step 4 (Waste Filter):** PASS. Matching funds directly leverage impact (more $ for mission). Not wasteful.
      *   **Verdict:** STRONG signal. This is exactly what costly signaling predicts: the HA's commitment is a credible signal precisely because it's costly and conditional. Your grant reduces their risk, making the partnership feasible.

  2.  **Applicant w/ 11-Year After-School Program, Same Two Staff:**
      *   **Step 1 (Cost Check):** PASS HARD. Retaining dedicated, likely underpaid staff for *11 years* in a demanding field is an enormous cost (opportunity cost, emotional labor, sustained effort). Extremely costly to fake consistently.
      *   **Step 2 (Skin-in-the-Game):** PASS HARD. The cost (loyalty, low pay?, sustained effort) is borne directly by the staff *and* the org (prioritizing retention). Deep personal investment.
      *   **Step 3 (Consistency):** PASS HARD. The signal *is* the remarkable consistency. Check budgets – are staff compensated fairly *enough* to show it's sustainable for them? Low turnover data confirms.
      *   **Step 4 (Waste Filter):** PASS/AMBER. Strength = stability & deep relationships (impactful). **Judgement:** Could it signal stagnation? Check for evidence of adaptation/improvement within the stable model. Is the program *still* needed/effective? (Costly signaling doesn't directly assess impact efficacy, just credibility of claimed strength).
      *   **Verdict:** VERY STRONG signal for *stability, commitment, and likely deep community relationships*. Major "bled for it" indicator. Flag for Step 4 follow-up on *current* impact/adaptation (beyond signaling).

  3.  **Applicant Flew Whole Board to Conference (Capacity Building):**
      *   **Step 1 (Cost Check):** PASS (Conditionally). Flying an entire board *is* costly for most small-mid nonprofits (airfare, hotels, time). Significant expense.
      *   **Step 2 (Skin-in-the-Game):** **FAIL / AMBER (Requires Probe).** Who paid? If org funds, it's costly, but *whose skin*? Was it vital for *all* board members? If board members paid personally, stronger signal of *their* commitment. If grant-funded... weak signal. **Judgement:** Crucial to know funding source and necessity.
      *   **Step 3 (Consistency):** AMBER/FAIL. Is this a one-off extravagance or part of a sustained, necessary board development plan? Does their budget *regularly* support this level? One time is weak; a pattern needs scrutiny.
      *   **Step 4 (Waste Filter):** **FAIL (Likely).** Hard to see how flying *all* board members is essential impact investment vs. a perk or status exercise. Was the conference *directly* relevant to *every* board member's governance role? Specific capacity built? Outputs?
      *   **Verdict:** WEAK or NEGATIVE signal. High cost (Step 1) but likely fails Skin/Consistency/Waste tests. Signals potential poor financial judgement, vanity, or misaligned priorities rather than core program strength. **Major "Judgement Flag" moment:** Requires probing questions (How was it funded? What *specific* capacity was built for *each* attendee? How does this directly impact mission?).

  **Where the Procedure Hands You an Answer You Don't Want & What It Can't Settle:**

  1.  **Unwanted Answers:**
      *   **The "Bleeding" Stalwart (Case 2):** The procedure strongly validates them (high credibility). You might *want* to fund something "new" or "innovative" instead, but the signal screams credibility. The framework forces you to confront their genuine strength, even if it feels unglamorous. *Mitigation:* Use Step 4 (Waste Filter) rigorously to check for stagnation.
      *   **The Well-Resourced Innovator:** An applicant with significant reserves or wealthy founders might make large investments (e.g., piloting a new model) that are *costly* (Step 1) but represent a smaller *relative* sacrifice for them. Steps 2 & 4 become critical: Is it *their* skin (founder money?) and is it truly strategic? You might not want to fund an org that doesn't *need* you, but the signal might still be credible.
      *   **The Savvy Signalers:** Some sophisticated NGOs might game the system, performing expensive signals *designed* to impress funders (e.g., overly complex, beautiful evaluations). Step 4 (Waste Filter) is your defense, but it's judgement-heavy.

  2.  **What It Can't Settle:**
      *   **Actual Impact Efficacy:** This is the BIGGEST gap. Costly signals show commitment and credibility, **not** that the program *works*. The 11-year program (Case 2) signals stability, not necessarily that kids' outcomes improved. The framework complements but doesn't replace outcome assessment (however light-touch you can manage).
      *   **True Need vs. Capacity:** Signals often show capacity/commitment. An org might be incredibly credible (strong signals) but financially stable without your grant. Conversely, a desperate, chaotic org on the brink might have no capacity to generate strong signals but be serving critical needs.
      *   **Value Alignment & Strategy:** The foundation's *priorities* matter. A credible arts org signals strongly, but if your strategy pivots to health, it's irrelevant. The framework doesn't assess strategic fit.
      *   **"Quiet Competence":** Some exceptionally efficient, low-drama organizations might achieve high impact without flashy, costly signals. They might fail Step 1 or look weak on Step 2 ("We just get it done without fuss"). The framework risks overlooking them.
      *   **The Flexibility Problem ("Explains Anything"):** Yes, this is a risk. You can *post-hoc* often explain why something was/wasn't a costly signal. **Mitigation:** Apply the steps *systematically and prospectively* for every application. Force yourself to score each step based on evidence *before* making an overall decision. Document your reasoning at each step. This reduces (but doesn't eliminate) hindsight bias.

  **Conclusion:** This framework turns "bled for it" into actionable screens focused on **differential cost, skin-in-the-game, consistency, and strategic alignment.** It excels at weeding out cheap talk and identifying deep commitment (Cases 1 & 2), flags potential vanity/spending issues (Case 3), and forces explicit judgement calls where needed. Its core limitation is that it **proves credibility, not impact.** Use it as a powerful first-line filter for commitment and operational reality, but pair it with at least a basic assessment of alignment with your strategy and evidence of results (even if just client stories/output tracking). It won't eliminate all hard decisions, but it makes "cheap talk" much harder to disguise.
