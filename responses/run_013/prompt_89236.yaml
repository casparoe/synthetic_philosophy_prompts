  Then give me the residue report. Which parts of the dispute map cleanly onto late-arriving data, watermark heuristics, retroactive recomputation, and per-consumer views of the stream? Which parts I can only carry across by fudging? And which have no counterpart at all — in particular, I want to know whether my vocabulary can express anything like the difference between a representation that is merely stored somewhere in the pipeline and a representation that is experienced, and if not, whether that gap is a defect of my framework or a sign that the original dispute was less substantive than it looked. Say plainly, for each residue item, how confident you are that it is genuinely inexpressible in my terms rather than merely unfamiliar, and whether the multiple-drafts reading wins the argument by translation — that is, whether it looks right simply because my vocabulary never had the resources to state the alternative.

