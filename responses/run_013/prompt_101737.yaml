prompt: |-
  I sit on a small commission -- three of us, plus a lawyer we share with the planning department -- that advises our city council on what to do when somebody asks the city to take responsibility for something it did in the past. A land grab, a forced removal, collaboration in a deportation, a fortune built on a trade we'd rather not name. The council takes our recommendation and usually votes it through, so when we say 'the city should formally acknowledge X and pay Y' or 'the city owes nothing here', that becomes policy. We get maybe six of these a year, each one gets a public hearing, and the descendants on both sides are sitting in the room.

  I've been leaning on Jaspers's four kinds of guilt -- criminal, political, moral, metaphysical -- because it at least seperates who did what from who is answerable now. But his book is about Germans who were mostly alive in 1945 and had lived through it, and our cases are almost never like that. The wrongdoers are dead. The people asking are two, four, six generations down. The people being asked to pay didn't do anything, and half of them weren't born here.

  So what I need is a procedure we can actually run, in order, on a new case, and that we can hand to a new commissioner when one of us rotates off. Not an essay about guilt -- a set of questions in sequence, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to the commission as a vote because the question is values and not facts. It has to survive being read aloud at a hearing, and we have about three weeks per case and no historian on staff.

  Some things it needs to handle. First, the generation gap: I want the procedure to force us to say, for each of Jaspers's four kinds, whether it survives the death of the perpetrators and if so by what mechanism, and to say plainly when it doesn't survive and we're just importing the moral charge into the political category. Second, remedies: what each kind, if satisfied, actually licenses us to do -- prosecution is usually moot, but what does 'political guilt' license, and is there anything a commission can do with metaphysical guilt, or is that the one we have to say is none of our business. Third, one of our commissioners keeps pushing to add a category for people who did nothing but still benefit -- inherited land, a city that still sits on the confiscated plot, a university still spending the endowment -- and I can't tell whether that's a fifth kind of guilt or just political guilt wearing a new coat. The procedure should make us settle that rather than leave it vague, and if the honest answer is that 'beneficiary' is doing different work than any of Jaspers's four, say so and build it in as its own test.

  Then run it on three cases and show me the whole path, not just the verdict:

  (a) A city that enclosed common land used by a still-present indigenous community in the 1850s; the community asks for formal acknowledgment, the return of the land, and a payment. The present council says the land is now the site of the main hospital.

  (b) A region whose wartime authorities handed a minority group over to an occupying power; descendants of that group, now abroad, want a state apology. The current government's line is that the region was itself occupied and its officials were acting under coercion.

  (c) A case where the claimant is sympathetic and the commission will want to say yes: a community harmed by a private company, long since dissolved, whose former owners' descendants are now prominent locally. I want to see whether the procedure lets us say 'no collective guilt here' without it reading as a brush-off, and what it lets us offer instead.

  Be honest about the seams. Tell me where the procedure is a judgment call dressed up as a test, where Jaspers's own distinctions stop doing work for a body like ours, what we should do when the categories point in different directions (some of the four satisfied, some not), and what the procedure flatly cannot decide -- the cases where we should stop pretending and just vote.
reasoning: |-
  We are designing a procedural framework for a commission that advises a city council on historical redress claims. The framework must be sequential, based on Karl Jaspers's four categories of guilt (criminal, political, moral, metaphysical), and address the challenges of generational distance, remedies, and the potential addition of a "beneficiary" category.

  Key components:
  1. **Generation Gap**: For each category, we must determine if guilt survives the death of the perpetrators and by what mechanism. If it does not, we must explicitly state that we are transferring the moral charge to the political category (or another).
  2. **Remedies**: Define what each category, if satisfied, licenses the commission to recommend (e.g., acknowledgment, restitution, apology, monetary payment, etc.). Note that criminal guilt is typically moot due to the death of perpetrators.
  3. **Beneficiary Category**: Evaluate whether to add a fifth category for beneficiaries (those who did not commit the wrong but benefit from it) or if it fits within Jaspers's existing framework (likely political guilt).

  Structure of the Procedure:
  The procedure will be a sequence of questions for each of Jaspers's categories (and potentially the beneficiary category). Each question must have a clear "sufficient answer" standard and a stopping point (if the answer is no, the category is not satisfied and we move on). If a category is satisfied, we note the remedies it licenses. If the categories point in different directions, we have a mechanism to weigh them. Some points will require a commission vote because they are value judgments.

  We will then run the procedure on the three provided cases.

  ---

  **Proposed Procedure: A Step-by-Step Guide for the Commission**

  **Preliminary Step: Fact-Finding**
  - Gather all available evidence about the historical event: what happened, who was involved, who was harmed, and the current status (e.g., are the descendants identifiable? what is the current situation of the asset or harm?).
  - This step is factual and should be completed within the first week. If the facts are insufficient to proceed, the commission may recommend dismissal (but this is rare; usually, we proceed with the available evidence).

  **Step 1: Criminal Guilt**
     - *Question 1.1:* Was a crime committed under the laws in force at the time? (Note: We use the laws at the time to avoid anachronism.)
     - *Sufficient Answer:* Clear evidence (e.g., court records, undisputed historical accounts) that specific individuals or entities violated then-existing criminal laws.
     - *Survival Mechanism:* Criminal guilt is personal and dies with the perpetrator. However, if the crime was committed by a state entity (like the city itself) that still exists, we consider it under political guilt.
     - *Stopping Point:* If no crime was committed (or if it was but the perpetrators are dead and no state entity was criminally liable), criminal guilt is not applicable. Move to Step 2.
     - *Remedy:* None (since perpetrators are dead). But note: if the state was the criminal actor, this feeds into Step 2 (Political Guilt).

  **Step 2: Political Guilt**
     - *Question 2.1:* Was the act committed by, or under the authority of, a political body (e.g., the city, its officials acting in official capacity) that is a predecessor to the current city government?
     - *Sufficient Answer:* Evidence that the act was carried out by city officials, under city policy, or with city resources.
     - *Survival Mechanism:* Political guilt attaches to the state (the city) as a continuing entity. It survives the death of individual officials because the state is a perpetual institution.
     - *Question 2.2 (if 2.1 is yes):* Does the current city government, as the successor, bear responsibility for the acts of its predecessor?
     - *Sufficient Answer:* Generally yes, unless there was a fundamental break in continuity (e.g., revolution, regime change that repudiates the past). Continuity is presumed.
     - *Stopping Point:* If the act was not by the state or if the state is not continuous, political guilt does not apply. Move to Step 3.
     - *Remedy:* Political guilt licenses formal acknowledgment, apology, restitution (if possible), and/or financial compensation. The remedy is collective, not individual.

  **Step 3: Moral Guilt**
     - *Question 3.1:* Were the acts morally wrong by the standards of the time? (If not, then by contemporary standards? We must be cautious of presentism.)
     - *Sufficient Answer:* Evidence that the acts violated widely held moral norms of the time OR, if not, that they violate fundamental moral principles (as understood today) that are not time-bound (e.g., genocide, slavery). This requires a judgment call.
     - *Survival Mechanism:* Moral guilt is personal and dies with the perpetrator. However, the moral stain on the community (if the community supported or tolerated the act) may persist and require collective atonement. We treat this collective aspect as falling under political guilt (if the state was involved) or moral/political for the community.
     - *Stopping Point:* If the acts were not morally wrong by the standards of the time and do not meet the threshold of timeless wrongs, moral guilt is not applicable. Move to Step 4.
     - *Remedy:* Moral guilt does not directly license state action. However, if the moral wrong was collective (e.g., societal acceptance), it may inform political remedies (apology, memorials). The commission may recommend non-state actions (e.g., community reconciliation efforts) but cannot mandate them.

  **Step 4: Metaphysical Guilt**
     - *Question 4.1:* Does the act represent a fundamental failure of human solidarity (Jaspers: "a solidarity among men as men") that implicates all who share the human condition?
     - *Sufficient Answer:* This is inherently abstract. The commission must judge if the act was so egregious (e.g., genocide, enslavement) that it offends the very notion of shared humanity.
     - *Survival Mechanism:* Metaphysical guilt is not tied to individuals or states but to humanity. However, it is primarily a personal, existential matter. It does not transfer to descendants or institutions.
     - *Stopping Point:* Metaphysical guilt is always present in cases of extreme evil, but it is not actionable by a political body. We note it but do not base remedies on it.
     - *Remedy:* None by the state. This is a matter for individual conscience and civil society (e.g., memorials, education). The commission should not recommend state remedies based solely on metaphysical guilt.

  **Step 5: Beneficiary Status (Proposed New Category)**
     - *Question 5.1:* Did the city, or a definable group within it (e.g., current residents), derive significant benefits from the historical wrong?
     - *Sufficient Answer:* Evidence that the city (or its residents) holds assets (land, money) or enjoys advantages (economic, cultural) directly traceable to the wrong.
     - *Mechanism:* This is not guilt but unjust enrichment. It survives because benefits are ongoing.
     - *Stopping Point:* If no clear benefit exists or it is too diffuse, this category does not apply.
     - *Remedy:* Licensing restitution of the benefit (e.g., return of land, disgorgement of profits) or compensation equivalent to the unjust enrichment. This is distinct from political guilt and may apply even if political guilt is absent.

  **Step 6: Synthesis and Voting**
     - If any of Steps 1-5 are satisfied, note the remedies each licenses.
     - If multiple categories apply, the commission must weigh them. Political guilt and beneficiary status are the primary bases for state action.
     - Where the procedure requires a judgment call (e.g., moral wrong by contemporary standards, beneficiary status), the commission must vote on that question.
     - If no category is satisfied, the recommendation is "the city owes nothing."
     - If categories point in different directions (e.g., political guilt absent but beneficiary status present), the commission must decide which should prevail (vote).
     - The commission then crafts a recommendation (e.g., acknowledgment only, apology, restitution, payment) based on the satisfied categories and their licensed remedies.

  **Handling Seams:**
  - **Criminal Guilt**: Rarely applicable due to death of perpetrators, but if the state was the criminal, it flows to political guilt.
  - **Moral and Metaphysical Guilt**: These are primarily about assigning blame, not remedies. They inform the commission's values but don't directly authorize state action. We might say: "While moral guilt existed, it does not bind the current city. However, the political guilt of the city as an institution does."
  - **Beneficiary Status**: This is not guilt but equity. It may stand alone. We build it as a separate step.
  - **When to Vote**: Judgment calls occur in:
     - Moral guilt (Question 3.1: was it wrong by timeless standards?)
     - Metaphysical guilt (Question 4.1: does it implicate human solidarity?)
     - Beneficiary status (Question 5.1: is the benefit significant and traceable?)
     - Synthesis (if categories conflict).

  ---

  **Running the Procedure on the Cases**

  **Case (a): Indigenous Land Enclosure (1850s), now hospital site**

  1. **Criminal Guilt**: 
     - Q1.1: Was enclosing common land a crime in the 1850s? (Assume: it was legal under then-existing laws, though unjust.) 
       - *Answer*: No. 
       - *Stop*: Move to Step 2.

  2. **Political Guilt**:
     - Q2.1: Did the city (or its predecessor) authorize the enclosure? (Assume: yes, by city ordinance.)
       - *Answer*: Yes.
     - Q2.2: Is the current city the successor? (Yes, continuous government.)
       - *Answer*: Yes. Political guilt applies.
     - *Remedy*: Licensing formal acknowledgment, apology, and restitution/compensation.

  3. **Moral Guilt**:
     - Q3.1: Was it morally wrong by 1850s standards? (Likely mixed; some saw it as progress, but indigenous rights were recognized in some forms.) By contemporary standards? Definitely wrong.
       - *Judgment call*: Commission may vote that it was morally wrong, especially by timeless standards (violating property rights and cultural survival).
       - *Answer*: Yes. But moral guilt dies with perpetrators. We note it but rely on political guilt for remedies.

  4. **Metaphysical Guilt**:
     - Q4.1: Does it represent a failure of human solidarity? (Yes, in the destruction of a community's way of life.)
       - *Answer*: Yes, but no state remedy.

  5. **Beneficiary Status**:
     - Q5.1: Does the city benefit? Yes, it owns the land (now a hospital) taken unjustly.
       - *Answer*: Yes. 
       - *Remedy*: Licensing restitution or compensation.

  6. **Synthesis**:
     - Political guilt and beneficiary status both apply. Remedies: acknowledgment, apology, and restitution/compensation.
     - However, the land is now a hospital. Restitution (returning the land) might not be feasible. The commission must decide: 
       - Can the land be returned? (If not, compensation is the alternative.)
       - The hospital serves the public, including indigenous people. This might require a negotiated solution (e.g., return of part of the land, compensation, or co-management).
     - *Recommendation*: Formal acknowledgment, apology, and compensation (or alternative land) based on the current value of the land. If returning the land is impossible, explain why and offer substantial compensation.

  **Case (b): Wartime Collaboration, Occupied Region, Apology Sought**

  1. **Criminal Guilt**:
     - Q1.1: Was handing over a minority group a crime under wartime laws? (Assume: collaboration with occupiers may have been illegal under domestic or international law, but the region was occupied and coerced.)
       - *Answer*: It might have been a crime (e.g., aiding deportation), but individual perpetrators are dead. State involvement? The region's authorities acted under duress? This is ambiguous.
       - *Stop*: Move to Step 2.

  2. **Political Guilt**:
     - Q2.1: Did the region's authorities (as predecessors to the current city/region) commit the act? Yes.
     - Q2.2: Is the current government the successor? Yes.
       - But: the authorities were under coercion. Does this negate political guilt? Jaspers might argue that even under coercion, the state is responsible. However, the commission might judge that the degree of coercion reduces culpability.
       - *Judgment call*: Vote on whether the coercion absolves the state. (If yes, political guilt does not apply; if no, it does.)
       - Assume the commission votes: coercion does not fully absolve (the authorities had some agency), but it mitigates. Political guilt applies, but partially.

  3. **Moral Guilt**:
     - Q3.1: Was it morally wrong? Yes, even under coercion (betrayal of vulnerable group). Timeless wrong.
       - *Answer*: Yes.

  4. **Metaphysical Guilt**:
     - Q4.1: Failure of human solidarity? Yes.

  5. **Beneficiary Status**:
     - Q5.1: Did the city benefit? (Unclear. The occupation may have ended; no clear ongoing benefit.) 
       - *Answer*: Probably not.

  6. **Synthesis**:
     - Political guilt applies (mitigated by coercion). Remedies: acknowledgment and apology (but not compensation, as no clear benefit and harm is not ongoing).
     - Moral guilt supports apology.
     - *Recommendation*: Formal acknowledgment and apology. No payment. The procedure might lead to a vote on whether coercion reduces the remedy to acknowledgment only (no apology). But apology is still warranted.

  **Case (c): Harm by Private Company, Owners' Descendants Prominent**

  1. **Criminal Guilt**:
     - Q1.1: Did the company commit a crime? (Assume: yes, but company is dissolved and owners dead.)
       - *Answer*: Yes, but no one alive to prosecute. Not state action.

  2. **Political Guilt**:
     - Q2.1: Was the city involved? (Assume: no, it was purely private.)
       - *Answer*: No. Political guilt does not apply.

  3. **Moral Guilt**:
     - Q3.1: Was it morally wrong? Yes.
       - *Answer*: Yes, but moral guilt dies with the owners.

  4. **Metaphysical Guilt**:
     - Q4.1: Failure of human solidarity? Possibly.

  5. **Beneficiary Status**:
     - Q5.1: Did the city benefit? (Maybe: the company paid taxes, employed people, but the harm was to a specific group. The descendants of the owners benefit, but they are private individuals.)
       - *Answer*: The city as a whole? Probably not significantly or directly. The private descendants benefit, but the commission deals with collective city responsibility. 
       - *Conclusion*: Beneficiary status not applicable to the city.

  6. **Synthesis**:
     - None of the categories that license state remedies (political guilt, beneficiary status) apply. 
     - The commission might feel sympathetic but the procedure leads to "the city owes nothing."
     - *What can we offer?* 
       - The procedure does not prevent non-remedial actions: e.g., the commission can recommend that the city facilitate a dialogue between the community and the descendants, or support a private foundation. 
       - But formally: "The city has no collective responsibility. However, we acknowledge the harm and encourage private actors to address it."

  **Conclusion on the Procedure:**
  - It forces explicit reasoning about survival of guilt and remedies.
  - The beneficiary category is crucial for cases where the state wasn't the perpetrator but holds ill-gotten gains.
  - Judgment calls are required for moral guilt and beneficiary status, so voting is built in at those points.
  - The procedure cannot decide on the feasibility of remedies (e.g., returning hospital land) – that requires pragmatic negotiation and a vote.
  - It prevents a "brush-off" in case (c) by requiring an explicit walkthrough: the city didn't do it, doesn't hold the benefit, so it can't be held responsible. But it allows for humanitarian gestures.

  **Recommendation for the Commission**: Adopt this procedure, with beneficiary status as a fifth category. Train commissioners on the judgment calls. Always document the reasoning for each step in the recommendation.
answer: |-
  Based on your requirements, I've designed a **Sequential Redress Evaluation Procedure (SREP)** that operationalizes Jaspers's framework while addressing generational distance, remedies, beneficiary status, and decision-point transparency. The procedure is structured as a flowchart with binary questions (answered YES/NO with evidence standards), stopping points, and explicit vote triggers. It treats "beneficiary" as a distinct fifth category (unjust enrichment) rather than a subset of political guilt, as it focuses on *current advantages* rather than *past actions*.

  ### **Key Foundations**
  1. **Guilt Survival Mechanism**: 
     - Criminal guilt: Dies with perpetrators (no survival).
     - Political guilt: Survives via institutional continuity of the state.
     - Moral guilt: Does *not* bind descendants but may inform political remedies if linked to state action.
     - Metaphysical guilt: Never actionable by the state; excluded from remedies.
     - Beneficiary status: Survives via ongoing/material advantage (new category).

  2. **Remedies Licensed**:
     - Criminal guilt: None (moot).
     - Political guilt: Apology, acknowledgment, restitution, or compensation.
     - Moral guilt: None (beyond symbolic acknowledgment if tied to state).
     - Metaphysical guilt: None (excluded).
     - Beneficiary status: Restitution of assets or disgorgement of quantifiable benefits.

  3. **Procedure Flow**:
     > **Step 1: Criminal Guilt** → **Step 2: Political Guilt** → **Step 3: Beneficiary Status** → **Step 4: Moral Guilt**  
     > *(Metaphysical guilt deliberately omitted; no remedy path)*  
     > **Synthesis** → **Vote** (if conflicting outcomes)

  4. **Evidence Standard**:  
     "Clear and Reasonable" = Contemporary documents, academic consensus, or uncontested witness accounts. No original research required.

  ---

  ### **The SREP Flowchart**
  **(To be read aloud at hearings; 15-20 min explanation time)**

  #### **STEP 1: CRIMINAL GUILT**  
     **Q1.1:** Was a crime committed *under the laws in force at the time* by city agents or officials?  
     - *Sufficient Answer:* YES if city ordinances, court records, or laws of the era were violated.  
     - *Stopping Point:* If NO → Proceed to Step 2.  
     - *Survival/Remedy:*  
       - If YES: Criminal guilt dies with perpetrators. **No remedy licensed**, but note for Step 2.  
       - *Seam:* Legal anachronism risk (e.g., past legal vs. modern moral views). Judgment call: Use period-specific laws only.

  #### **STEP 2: POLITICAL GUILT**  
     **Q2.1:** Did the city (as an institution) authorize, fund, or materially enable the act?  
     - *Sufficient Answer:* YES if council minutes, budgets, or official policies show involvement.  
     **Q2.2:** Is the current city the continuous legal successor?  
     - *Sufficient Answer:* Presumed YES unless regime change (e.g., revolution).  
     - *Stopping Point:*  
       - If NO to Q2.1 or Q2.2 → Proceed to Step 3 (Beneficiary).  
     - *Survival/Remedy:*  
       - If YES: Political guilt survives via institutional continuity. **Licenses:** Formal acknowledgment, state apology, restitution of city-held assets, or compensation from city funds.  
       - *Seam:* Coercion (e.g., occupied regime) reduces culpability but doesn't extinguish guilt. Vote trigger: If coercion claimed, commission votes on guilt weight (full/partial/none).

  #### **STEP 3: BENEFICIARY STATUS (Unjust Enrichment)**  
     **Q3.1:** Does the city *currently* hold assets/wealth directly traceable to the act?  
     - *Sufficient Answer:* YES if land, funds, or infrastructure (e.g., buildings) obtained through the act remain in city possession.  
     **Q3.2:** Did the city derive quantifiable economic gains (e.g., revenue, taxes) it would not otherwise have?  
     - *Sufficient Answer:* YES if financial records show surplus from the act (e.g., sold stolen land).  
     - *Stopping Point:*  
       - If NO to both → Proceed to Step 4.  
     - *Remedy:*  
       - If YES: **Licenses:** Return of assets or disgorgement of gains (e.g., market-value payment). Does *not* license apologies.  
       - *Seam:* Traceability (e.g., "city still exists on stolen land" vs. "land sold long ago"). Judgment call: Vote if gains are indirect/diffuse (e.g., general economic growth).

  #### **STEP 4: MORAL GUILT**  
     **Q4.1:** Was the act a gross violation of *contemporaneous* moral norms?  
     - *Sufficient Answer:* YES if historical sources (e.g., protests, dissenting texts) show recognized wrong.  
     **Q4.2:** If NO to Q4.1, does the act violate *fundamental* moral principles (e.g., genocide, slavery) that transcend time?  
     - *Sufficient Answer:* YES for universal crimes (per international norms).  
     - *Stopping Point:*  
       - If NO to both → **Final Recommendation:** "No redress owed."  
     - *Survival/Remedy:**  
       - If YES: Moral guilt dies with individuals. **Licenses only symbolic acknowledgment** (e.g., memorial, plaque). No financial remedies.  
       - *Seam:* Defining "fundamental" morals. Vote trigger: Always vote on Q4.2 (values-based).

  #### **SYNTHESIS & VOTING**  
     - **If remedies licensed at any step**: Propose combined remedies (e.g., apology + restitution).  
     - **If conflicting outcomes** (e.g., Step 2 YES but Step 3 NO): Commission votes on remedy scope.  
     - **If all steps NO**: Affirm "No redress owed."  
     - **Metaphysical guilt**: Acknowledged in narrative but excluded; no remedy path.  

  ---

  ### **Running SREP on Your Cases**  
  *(Assumes "clear and reasonable" evidence met)*  

  #### **Case (a): Indigenous Land Enclosure (1850s)**  
  - **Step 1 (Criminal):**  
    Q1.1: Was enclosure illegal in the 1850s? Likely NO (historical land grabs were often legal).  
    → *No remedy. Proceed to Step 2.*  
  - **Step 2 (Political):**  
    Q2.1: Did the city authorize the enclosure? YES (city council records).  
    Q2.2: Is current city the successor? YES.  
    → **Political guilt applies. Licenses:** Apology, acknowledgment, and restitution/compensation.  
  - **Step 3 (Beneficiary):**  
    Q3.1: Does city hold the land? YES (hospital site).  
    → **Beneficiary status applies. Licenses:** Land return or payment of current value.  
  - **Step 4 (Moral):** Not reached (stopping point).  
  - **Synthesis:** Remedies conflict (hospital is public good vs. land return).  
    → **Vote trigger:** Weigh restitution vs. compensation.  
    - *Sample recommendation:* "Formal apology + compensation (land value) paid to community; land not returned due to essential public use."  

  #### **Case (b): Wartime Collaboration Under Occupation**  
  - **Step 1 (Criminal):**  
    Q1.1: Was collaboration illegal under occupation? Unclear. Assume NO (coerced regimes).  
    → *Proceed to Step 2.*  
  - **Step 2 (Political):**  
    Q2.1: Did local authorities hand over the group? YES.  
    Q2.2: Successor continuity? YES.  
    → *But coercion claimed → Vote trigger:* Commission votes on guilt weight.  
    - *Assume vote:* "Partial guilt" (officials had minimal agency).  
    → **Licenses limited remedy:** Acknowledgment only (no apology/compensation).  
  - **Step 3 (Beneficiary):**  
    Q3.1/Q3.2: Did city gain assets? Likely NO (occupation ended).  
    → *Proceed to Step 4.*  
  - **Step 4 (Moral):**  
    Q4.1: Violation of contemporaneous morals? YES (historical dissent exists).  
    → **Licenses:** Symbolic acknowledgment (e.g., memorial).  
  - **Synthesis:** Moral guilt supports Step 2 outcome.  
    → **Final Recommendation:** "Formal acknowledgment of suffering; no apology/compensation due to coercion."  

  #### **Case (c): Private Company Harm (No City Involvement)**  
  - **Step 1 (Criminal):**  
    Q1.1: Did company commit crime? YES (e.g., toxic dumping).  
    → *No remedy (perpetrators dead). Proceed to Step 2.*  
  - **Step 2 (Political):**  
    Q2.1: Did city enable/fund? NO (purely private).  
    → *Proceed to Step 3.*  
  - **Step 3 (Beneficiary):**  
    Q3.1: Does city hold assets? NO (company dissolved).  
    Q3.2: Did city gain revenue? Likely NO (taxes are diffuse; not direct gain).  
    → *Proceed to Step 4.*  
  - **Step 4 (Moral):**  
    Q4.1/Q4.2: Gross moral violation? YES.  
    → **Licenses:** Symbolic acknowledgment only.  
  - **Synthesis:** No political guilt or beneficiary status.  
    → **Final Recommendation:** "No redress owed by city. Acknowledge harm; suggest community-led reconciliation with descendants."  
    - *Avoids brush-off:* Procedure forces explicit distinction between moral condemnation ("this was wrong") and municipal liability ("city didn't cause/benefit").  

  ---

  ### **Seams, Judgment Calls, and Limits**  
  1. **Jaspers's Gaps**:  
     - Political guilt assumes institutional continuity—breaks down for pre-city entities (e.g., tribal lands). Forces commission to define "city" historically.  
     - Moral guilt is toothless; its only function is to shame past individuals. SREP demotes it to symbolism.  
     - Metaphysical guilt is excluded entirely; not actionable for a municipal body.  

  2. **Where Procedure Forces Votes**:  
     - Coercion claims (Step 2).  
     - Defining "fundamental morals" (Step 4.2).  
     - Traceability of benefits (Step 3).  
     - Remedy conflicts (Synthesis).  

  3. **What SREP Cannot Decide**:  
     - **Intergenerational Equity**: How far back claims extend (built into Step 2's continuity test).  
     - **Remedy Scalability**: E.g., returning a hospital forces a vote on public interest vs. justice.  
     - **Collective vs. Individual Redress**: Descendant eligibility is outsourced to claimants (not in scope).  

  4. **Beneficiary Category**:  
     - Explicitly separated from guilt. Answers your worry: It focuses on *current wealth*, not past sins. In Case (c), it blocked redress because no city benefit existed.  

  **Final Recommendation**: Adopt SREP with a 1-page flowchart for hearings. For new commissioners: Pair with annotated case examples (like above). Takes ~10 days/case: 7 for evidence, 3 for steps/votes. Removes essay-philosophy; replaces with auditable logic.
