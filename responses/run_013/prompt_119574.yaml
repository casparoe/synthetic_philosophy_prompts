prompt: |-
  ok so for my civics/philosophy project I'm trying to figure out what a fair voting system even is, and I keep getting lost alot. We did a mock election in class for prom theme: 80s, tropical, masquerade. First-past-the-post picked 80s even though in a head-to-head a majority preferred tropical over 80s and also masquerade over 80s. Then we tried ranked choice and masquerade got eliminated first, so tropical won, but someone pointed out if there had been two masquerade-ish options splitting that vote, 80s would have won instead. Then a bunch of people said they should have voted strategically for their second choice, and the whole thing felt rigged. My teacher says this is definately not a fluke: the Gibbard-Satterthwaite theorem says any voting rule with 3+ options that is decent is either gameable or dictatorial. I don't want a proof or a reading list. I want the spec first.

  Write me the desiderata any adequate theory of fair voting / social choice has to meet. Like: what cases must it get right (Condorcet winners, cycles, clones, strategic voting, ties, a candidate getting more support and somehow losing); what distinctions it can't seperate (individual vs group rationality, sincere vs strategic ballots, preference order vs intensity, a rule being manipulable vs being actually manipulated); what results from social choice it can't contradict; and why each of those is a real requirement and not just one camp's preference. I've heard names like monotonicity (more support shouldn't make a candidate lose), independence of irrelevant alternatives (a loser dropping out shouldn't flip the winner), later-no-harm (ranking someone lower shouldn't hurt your favorite), participation (voting shouldn't make the group worse off), clone independence (a twin of a candidate entering shouldn't change the winner), the Condorcet winner criterion (if someone beats everyone head-to-head, they should win) -- tell me which of those are genuine requirements and which are just one camp's preference. Flag any pair of requirements you think can't be jointly satisfied -- if some subset is jointly impossible, that's the part I most want, because that's what would make the theorem feel less like a trick. Also say which single requirement knocks out the most popular systems. Then briefly, how first-past-the-post, ranked-choice, approval voting, and score voting do against the list. No bibliography, I can't search. At the end, tell me what would change your mind about the list -- which counterexample or argument would make you drop or reorder a requirement -- and where your reasoning is most likely to fail.
reasoning: |-
  Okay, the user is working on a civics/philosophy project about fair voting systems. They had a mock election in class where different methods gave different winners, leading to confusion. The teacher mentioned the Gibbard-Satterthwaite theorem, which states that any fair voting system with three or more options must be either manipulable or dictatorial. The user wants a clear set of criteria for what makes a voting system fair, without proofs or a reading list.

  First, I need to identify what they really need. They mentioned terms like Condorcet winners, monotonicity, IIA, clone independence, etc. They want to know which of these are essential requirements and which are more like preferences. Also, they want to know which criteria conflict with each other, making fair voting impossible in some cases. 

  The user is probably frustrated because their class experiment showed real-world flaws in voting systems. They might feel that it's all rigged, and they need a structured way to evaluate fairness. Their deeper need is understanding why no system is perfect and how to navigate the trade-offs. 

  I should start by listing the core desiderata. These are the non-negotiable principles that any fair system must meet. Then, highlight the conflicts between them, especially how Arrow's theorem and Gibbard-Satterthwaite show inherent limitations. 

  Key criteria: 
  1. **Universal Domain**: Must handle any possible voter preferences.
  2. **Non-Dictatorship**: No single voter should decide the outcome.
  3. **Pareto Efficiency**: If everyone prefers A over B, B shouldn't win.
  4. **Monotonicity**: More support shouldn't harm a candidate.
  5. **Resoluteness**: Should avoid ties when possible.

  Then, the desirable but conflicting criteria:
  - **Condorcet Criterion**: A candidate who beats all others head-to-head should win. But sometimes, Condorcet winners don't exist due to cycles.
  - **Independence of Irrelevant Alternatives (IIA)**: Adding or removing a losing candidate shouldn't change the winner. This conflicts with the Condorcet criterion.
  - **Clone Independence**: Adding a similar candidate shouldn't change the outcome. This is important to avoid vote-splitting.
  - **Participation**: Voting shouldn't make the result worse for you. But some systems fail this.
  - **Later-No-Harm**: Ranking a candidate lower shouldn't hurt higher-ranked ones. This is specific to ranked systems.

  Conflicts: Arrow's theorem shows that IIA, Pareto, and non-dictatorship can't coexist. Gibbard-Satterthwaite adds that strategy-proofness conflicts with non-dictatorship. So, the user's feeling that systems are flawed is rooted in these impossibilities.

  Evaluating common systems:
  - **FPTP**: Fails clone independence, Condorcet, monotonicity. Vulnerable to vote-splitting.
  - **Ranked Choice (IRV)**: Fails participation, clone independence in some cases, not Condorcet-consistent.
  - **Approval Voting**: Fails Condorcet and later-no-harm but resists cloning and is monotonic.
  - **Score Voting**: Similar to approval, fails later-no-harm but handles clones well.

  What would change my mind? If someone finds a system meeting all core criteria without trade-offs, but the theorems prove it's impossible. Or if intensity of preference is incorporated, but that introduces new issues.

  The user's reasoning might fail by underestimating the inevitability of trade-offs. The key takeaway is that fairness in voting involves balancing conflicting principles, and no system is perfect. Highlighting these conflicts helps them understand why their class results varied and why strategic voting is unavoidable.
answer: |-
  Here's the spec for a minimally adequate theory of fair voting, distilled to core requirements, conflicts, and real-world implications. This cuts through academic camps to focus on what breaks systems in practice.

  ### **Core Desiderata (Non-Negotiable)**
  These define a "decent" system per your teacher's theorem. Violating *any* makes the system indefensible:
  1.  **Universal Domain:** Must accept *any* possible voter preference orderings (even "irrational" ones like A>B>C>A cycles). *Why required:* Real preferences are messy; a fair system can't demand voters conform to a "sane" mold.
  2.  **Non-Dictatorship:** No single voter can always dictate the winner. *Why required:* Fairness necessitates group input.
  3.  **Pareto Efficiency:** If *every* voter prefers Candidate A over Candidate B, then B cannot win. *Why required:* Basic coherence; unanimous agreement must be respected.
  4.  **Monotonicity (More Support Shouldn't Harm):** If a candidate wins, and some voters later rank them *higher* (or add them where they didn't vote before), that candidate must still win. *Why required:* Counterintuitive results (more support causing loss) destroy legitimacy. (Violation Example: Your FPTP mock election *could* theoretically have this if vote totals shifted weirdly; Ranked Choice can fail it if elimination order changes).
  5.  **Resoluteness (Decisiveness):** Must pick a single winner when possible (avoids perpetual ties). *Why required:* Societies need decisions, not deadlock.

  ### **Highly Desirable (But Often Conflicting) Criteria**
  These are widely seen as necessary for robustness, but impossibility theorems show they *can't* all coexist perfectly:
  6.  **Condorcet Winner Criterion:** If a candidate beats *every other candidate* in head-to-head matchups, they must win. *Why required:* Embodies majority rule. *Violation Example:* Your mock FPTP election – 80s won despite losing to *both* others head-to-head.
  7.  **Independence of Irrelevant Alternatives (IIA):** If a losing candidate (an "irrelevant alternative") drops out or is added, it shouldn't change the winner between the remaining candidates. *Why required:* Prevents spoilers and strategic entry/exit like the "masquerade clone" scenario. *Violation Example:* Your ranked choice result – adding a second masquerade clone flipped the winner from Tropical to 80s.
  8.  **Clone Independence:** Adding an identical "clone" of a candidate (splitting their exact support base) shouldn't change who wins (though the clone might win instead of the original). *Why required:* Directly prevents vote-splitting pathologies like FPTP suffers from. *Violation Example:* FPTP – two similar candidates split votes letting a disliked candidate win.
  9.  **Participation:** Adding a ballot that ranks A above B shouldn't cause B to win *instead* of A. *Why required:* Voting shouldn't actively harm your preferred outcome compared to staying home. *Violation Example:* Some Ranked Choice elections – voting sincerely can help elect your *least* favorite candidate.
  10. **Strategy-Resistance (Non-Manipulability):** No voter can achieve a better outcome by voting *insincerely* (lying about preferences). *Why required:* Forces "truthful" voting; systems requiring strategy favor the savvy/cynical and undermine representation. (This is the core of Gibbard-Satterthwaite).

  ### **The Inevitable Conflicts (The "No Free Lunch" Part)**
  *   **Arrow's Impossibility Theorem:** Shows it's **impossible** for a ranked-choice system to satisfy *Universal Domain, Pareto, IIA,* and *Non-Dictatorship* simultaneously. IIA is the usual casualty.
  *   **Gibbard-Satterthwaite Theorem:** Shows it's **impossible** for *any* non-dictatorial system with 3+ options to satisfy *Universal Domain, Resoluteness (Single Winner),* and *Strategy-Resistance* simultaneously. Strategy-Resistance is unattainable.
  *   **Condorcet vs. IIA:** A system satisfying the Condorcet criterion **cannot** also satisfy IIA. If a Condorcet winner exists, IIA forces them to win. But in cycles (no Condorcet winner), IIA imposes restrictions that conflict with how Condorcet methods resolve cycles.
  *   **Later-No-Harm (LNH):** (Ranking X lower shouldn't hurt X's chances). This is **NOT** a core requirement. It's specific to ranked systems and often conflicts with *Condorcet* and *Participation*. Sacrificing it sometimes leads to *better* overall outcomes.

  ### **Which Requirement Kills the Most Systems?**
  *   **Strategy-Resistance (Non-Manipulability)** is the killer. Gibbard-Satterthwaite proves *no* reasonable system with 3+ options achieves it. FPTP, Ranked Choice, Approval, Score – *all* can be manipulated strategically. This is the deepest flaw.

  ### **How Common Systems Fare**
  1.  **First-Past-The-Post (FPTP):**
      *   **Fails:** Condorcet, IIA, Clone Independence, Participation (sometimes), Monotonicity (rarely), Strategy-Resistance.
      *   **Surprisingly Passes:** Pareto, Resoluteness, Universal Domain (technically), Non-Dictatorship.
      *   **Summary:** Simple but deeply flawed. Fails clone independence catastrophically (vote-splitting), often elects minority winners (fails Condorcet), forces strategic voting.

  2.  **Ranked Choice / Instant Runoff Voting (IRV):**
      *   **Fails:** IIA (susceptible to spoilers/clones), Condorcet (can eliminate Condorcet winner early), Participation (voting can backfire), Clone Independence (clones can spoil each other leading to different eliminations), Strategy-Resistance.
      *   **Passes:** Pareto, Monotonicity (usually), Resoluteness, Universal Domain, Non-Dictatorship.
      *   **Summary:** Solves "vote-splitting" *sometimes* (better than FPTP) but introduces new spoiler problems and fails Condorcet. Later-No-Harm is a design feature, but forces "lesser evil" dilemmas.

  3.  **Approval Voting:**
      *   **Fails:** Condorcet (can elect someone who loses head-to-head), Later-No-Harm (approving a lesser favorite *can* hurt your favorite), Strategy-Resistance (bullet voting vs. hedging), IIA (adding similar options changes strategy).
      *   **Passes:** Universal Domain, Non-Dictatorship, Pareto, Monotonicity, Resoluteness, Clone Independence (clones split votes but don't spoil), Participation (usually).
      *   **Summary:** Resistant to clones/spoilers, encourages broad support, monotonic. Fails Condorcet badly. Strategy revolves around "approval threshold," which is complex but less binary than FPTP/IRV.

  4.  **Score Voting (Range Voting):**
      *   **Fails:** Condorcet (same as Approval), Later-No-Harm (scoring a lesser favorite highly *can* hurt your favorite), Strategy-Resistance (incentive to min/max scores), IIA (similar to Approval).
      *   **Passes:** Universal Domain, Non-Dictatorship, Pareto, Monotonicity, Resoluteness, Clone Independence (similar to Approval), Participation (usually). *Also captures preference intensity.*
      *   **Summary:** Most expressive, excellent resistance to clones/spoilers, monotonic. Fails Condorcet. Strategic voting involves exaggerating scores ("min/maxing"), which distorts intensity.

  ### **What Would Change My Mind (And Where I'm Most Likely Wrong)**
  *   **Dropping/Reordering Requirements:**
      *   **Counterexample:** If someone demonstrated a real-world, non-dictatorial system used by a large, stable democracy that *provably* violated Pareto or Monotonicity *without causing public outrage or instability*, I'd re-evaluate their absolute necessity. (This is extremely unlikely).
      *   **Argument:** A compelling argument that *Resoluteness* is less important than perfect fairness in close elections (e.g., advocating for probabilistic voting or mandatory coalitions) might make me downgrade it. *Most likely to fail:* Underestimating the social cost of indecisiveness (Resoluteness).
  *   **Conflict Acceptance:** If someone proved Arrow/Gibbard-Satterthwaite were mathematically flawed (near-impossible), it would radically change the landscape. More realistically, if intensity-of-preference data became reliably measurable and incorporable into a system satisfying most other criteria, I might downgrade the importance of strict IIA/Condorcet for that system.
  *   **Where Reasoning is Fragile:** The biggest vulnerability is underestimating the *practical* impact of strategic voting vs. its *theoretical* inevitability. I assume strategy *will* be used cynically, degrading outcomes. If evidence showed voters in Approval/Score systems overwhelmingly vote sincerely *despite* the theoretical incentive, the failure of Strategy-Resistance might be practically less severe than the theorems suggest. Your class's instinct towards strategy is the norm, not the exception.

  **The Core Takeaway:** Fairness requires balancing impossible ideals. All real systems fail some criteria. The "least worst" choice depends on *which* failures you find most tolerable (e.g., failing Condorcet vs. failing Clone Independence vs. being highly manipulable). Gibbard-Satterthwaite isn't a trick; it's the mathematical foundation explaining why your class felt the system was rigged – because, in a deep sense, any non-dictatorial system *can* be.
