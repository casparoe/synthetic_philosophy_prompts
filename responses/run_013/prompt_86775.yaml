prompt: |-
  Please explain the conceptual issue that has come to be called expected-value fanaticism, and explain it from the inside, as a structural problem, rather than by summarizing the surrounding debate.

  Start from this case. A button costs c to press and, with probability p, brings about an outcome of value V; otherwise it brings about nothing, and 0 < c < V. Expected-value maximization says to press whenever pV > c. Because V is unbounded — there is no largest amount of good that an outcome can contain — for every fixed cost there is some probability small enough that pressing is required. Two features of the case are essential to me. First, the structure is sign-symmetric: the reasoning that sends you chasing an enormous long shot also obliges you to pay a great deal to avert an outcome of value −V that occurs with probability p. Second, nothing here needs infinities or astronomical magnitudes; unboundedness by itself seems to do the work.

  What I want is the anatomy of the difficulty.

  (1) State exactly which assumptions about value and about rational preference, taken jointly, generate these verdicts, and say why infinity and astronomical size are red herrings.

  (2) For each of the natural repairs — bounding the value scale; imposing a floor below which probabilities are simply neglected; treating the probabilities as imprecise or indeterminate rather than tiny; giving up the continuity condition that makes a preference ranking representable by expected value; or simply accepting the fanatical verdicts — say what the repair buys, what it costs, and whether the repaired preferences remain representable as the expected value of something.

  (3) Test the repairs against a decomposition. Take the floor repair, on which probabilities below some threshold are neglected. I can offer you one chance in 10^9 of V, or a thousand independent chances of one in 10^12 each. If the first is negligible and the second is not, is that a principled distinction or an artifact of how the options are packaged? And if it is an artifact, what becomes of the repair?

  End by saying where you take the crux to lie, and what would change your mind: which argument or consideration would move you to a different verdict about which repair is least costly, and where your reasoning is most likely to fail.
reasoning: |-
  We are given a scenario: a button costs c to press and with probability p gives value V, otherwise nothing. We assume 0 < c < V. Expected value (EV) maximization says to press when pV > c. Since V can be arbitrarily large (unbounded), for any fixed c and any fixed p>0, there exists a V large enough to make pressing the button worthwhile. Similarly, for any fixed c and V, we can choose p small enough (but positive) so that pV > c. This leads to the requirement to press the button even when p is extremely small, which is the core of "expected-value fanaticism".

  The problem also has sign-symmetry: the same reasoning applies to avoiding a negative outcome of value -V with probability p. We would be willing to pay a large amount to avoid even a tiny chance of a catastrophic loss.

  The key point: unboundedness of the value scale (V can be arbitrarily large) is sufficient to create these verdicts without needing to invoke infinities or astronomical numbers. Even if we never actually encounter an infinite value, the mere possibility of unbounded value leads to the fanatical prescriptions.

  (1) Assumptions generating the verdicts:

  The fanatical verdicts arise from the conjunction of the following assumptions:

  a. Completeness and transitivity of preferences: the agent has a complete and transitive preference ordering over outcomes and lotteries.

  b. Continuity: for any three outcomes A, B, C with A preferred to B and B to C, there exists a probability q such that the agent is indifferent between B and a lottery that yields A with probability q and C with probability 1-q.

  c. Independence: if an agent prefers outcome A to B, then for any other outcome C and any probability r in [0,1], they prefer the lottery [A with probability r; C with probability 1-r] to [B with probability r; C with probability 1-r].

  d. Unboundedness of value: the value function (utility function) is unbounded above (and by sign-symmetry, unbounded below). That is, for any real number M, there exists an outcome with value greater than M (and similarly, an outcome with value less than -M).

  These assumptions, together with the von Neumann-Morgenstern (VNM) theorem, imply that preferences can be represented by expected utility maximization. Then, for any fixed cost c (which corresponds to a fixed outcome of value -c, since we are paying c) and any fixed positive probability p, we can find an outcome of value V such that pV > c because V can be arbitrarily large. Similarly, for a fixed V, we can take p small enough (but positive) to satisfy pV > c.

  Why infinity and astronomical sizes are red herrings: we don't need actual infinities. Even if all outcomes have finite values, the fact that the set of possible values is unbounded (so that there is no maximum value) is sufficient to force the fanaticism. For instance, even if the largest value we ever encounter in practice is 10^100, the theory requires that we must be willing to press the button if p * 10^100 > c, and if we are to avoid fanaticism we must have a bounded utility function.

  (2) Natural repairs:

  a. Bounding the value scale: We assume that the utility function is bounded above (and below). Then there is a maximum utility U_max. Then for any fixed cost c, we require p > c / U_max. So for probabilities below this threshold, we do not press. Similarly for negative outcomes.

  - What it buys: avoids fanaticism; we are never required to take arbitrarily small probabilities arbitrarily seriously.
  - What it costs: we must accept that there is a maximum possible good (and minimum possible bad). This might be philosophically uncomfortable because it seems we can always imagine a better outcome (or a worse one). Also, it rules out some common utility functions (like linear in wealth, which is unbounded).
  - Representable as expected value? Yes, but the utility function is bounded.

  b. Imposing a probability floor: We ignore probabilities below a fixed threshold ε. Then, if p < ε, we treat the event as having probability zero.

  - What it buys: we avoid the fanatical requirement to act on extremely small probabilities.
  - What it costs: it violates continuity (because for any outcome with positive probability less than ε, we treat it as having probability zero, so we might be indifferent between a lottery that gives a very good outcome with probability p (p<ε) and getting nothing, but if we increase p slightly above ε we suddenly care). It also violates the independence axiom because the treatment of probabilities depends on whether they are above or below the threshold. This can lead to violations of stochastic dominance.
  - Representable as expected value? Not in the standard sense because we are distorting the probabilities. We might represent it as expected value with respect to a transformed probability that sets small probabilities to zero, but that transformation is not linear and so it doesn't fit the VNM framework.

  c. Imprecise probabilities: We allow that probabilities might not be sharp. We represent uncertainty with a set of probability distributions and then apply a decision rule (like maxmin, or minimax regret) over that set.

  - What it buys: we can avoid fanaticism by having the set of distributions such that for a fixed V, the expected value might not be above c for all distributions in the set. Also, we might have a rule that doesn't require maximizing expected value.
  - What it costs: we lose the simplicity of the VNM framework. Also, the decision rules are more complex and may lead to other paradoxes or indecision.
  - Representable as expected value? Not necessarily. The decision rule might not be equivalent to maximizing the expected value of a single utility function.

  d. Giving up continuity: We drop the continuity axiom.

  - What it buys: we can have a lexicographic ordering that prioritizes avoiding catastrophic losses (or pursuing extremely good outcomes) at any probability level, but without being forced by continuity to trade off with finite goods arbitrarily.
  - What it costs: without continuity, we cannot represent preferences by a real-valued utility function (at least not in the usual way). We might have to use a vector of utilities or non-Archimedean values. This complicates decision theory.
  - Representable as expected value? No, because expected value representation requires continuity.

  e. Accepting fanaticism: We bite the bullet.

  - What it buys: we keep the VNM axioms and the simplicity of expected utility.
  - What it costs: we must accept that we should be willing to pay any fixed cost to avoid a positive probability of an unboundedly bad outcome, no matter how small the probability. Similarly, we must be willing to risk any finite loss for a tiny chance of an unboundedly good outcome. This seems to contradict common sense and might lead to ruin in practice.

  (3) Testing the floor repair with decomposition:

  Consider the floor repair: we set a threshold ε (say, 10^-9) and ignore probabilities below ε.

  Now, we are offered:

  Option A: one chance in 10^9 of winning V (so p=10^{-9}).
  Option B: a thousand independent chances of one in 10^12 each (so each has p_i=10^{-12}) of winning V.

  If our threshold is ε=10^{-9}, then for Option A, p=10^{-9} is exactly at the threshold. But note: the threshold is usually set to be strict (p<ε are ignored). So if ε=10^{-9}, then p=10^{-9} is not below the threshold? We must clarify: typically, the floor would be set to ignore probabilities less than ε. So if ε=10^{-9}, then p=10^{-9} is not ignored? Or we might set the floor to ignore probabilities ≤ε? Let's assume we ignore probabilities strictly below ε. Then Option A has p=10^{-9} which is not below ε=10^{-9} (if ε=10^{-9}) and so we do not ignore it. However, if we set ε=10^{-9} and we ignore probabilities below 10^{-9}, then Option A is considered.

  But Option B: each individual chance has p_i=10^{-12} which is below the threshold. So we would ignore each one? Then we would consider the chance of winning V in Option B as zero? But note: the thousand chances are independent. The probability of winning at least once in Option B is 1 - (1 - 10^{-12})^{1000}. Using the approximation (1-p)^n ≈ 1 - np for small p, we get ≈ 1000 * 10^{-12} = 10^{-9}. So the overall probability of winning at least once is about 10^{-9}. However, under the floor repair, we ignore each individual chance (because each is below ε) and we might also ignore the compound event? How do we aggregate?

  The repair does not specify how to handle compound lotteries. If we apply the floor to each individual lottery, then we would ignore each of the thousand chances. But then we might also ignore the overall lottery? Or we might compute the overall probability of winning and then apply the floor to that? The overall probability is about 10^{-9}. If we apply the floor to the overall probability, then we do not ignore it (if we set ε=10^{-9} and we ignore only below). But if we apply the floor at the level of the individual chances, then we set each to zero and then the overall chance becomes zero.

  This is an artifact of packaging. The two options have the same expected value (if we compute without the floor): 
  Option A: EV = (10^{-9}) * V
  Option B: EV = [1 - (1-10^{-12})^{1000}] * V ≈ 10^{-9} * V

  But under the floor repair, if we set the threshold at 10^{-9} and we ignore probabilities strictly below 10^{-9}, then:

  - For Option A: p=10^{-9} is not below the threshold, so we consider it and the EV is 10^{-9}V.
  - For Option B: if we break it down, each chance has p=10^{-12} < 10^{-9}, so we set each to zero. Then the overall chance of winning is 0? So the EV is 0.

  Then we would prefer Option A over Option B, even though they have (approximately) the same true expected value.

  Alternatively, if we first compute the overall probability of winning in Option B (which is about 10^{-9}) and then apply the floor, then we would not ignore it (since 10^{-9} is not below 10^{-9}) and we would see the same EV as Option A.

  But the repair does not specify how to handle compound lotteries. This ambiguity is a problem. Moreover, if we break Option B into its individual chances, we might never aggregate them to see that the overall probability is above the threshold. This makes the repair sensitive to how the options are described (i.e., as one lottery or as a compound of many). This is an artifact of packaging and suggests the repair is not well-defined.

  If we require that the floor is applied only to the final probability distribution over outcomes, then we would compute the overall probability for Option B and then apply the floor. Then both options would be treated the same. But note: in Option B, the outcome is still a lottery that gives V with probability about 10^{-9} and nothing otherwise. So if we describe the options as:

  Option A: a single lottery that gives V with probability 10^{-9}
  Option B: a single lottery that gives V with probability 1 - (1-10^{-12})^{1000} ≈ 10^{-9}

  Then they are the same. But if Option B is presented as a thousand independent tickets, then the agent must aggregate to get the same result. The repair should be defined to avoid this packaging effect. However, it is difficult to do so without a clear rule for aggregating probabilities.

  Moreover, if we set the threshold at ε, then two events each with probability ε/2 (which are independent) would be ignored individually, but the chance of at least one occurring is about ε (if we use 1-(1-ε/2)^2 ≈ ε). So we would ignore each individually but the compound event would be above the threshold? This is inconsistent.

  Therefore, the floor repair seems to have a serious problem: it is not clear how to apply it to compound lotteries, and it may lead to violations of stochastic dominance or other intuitive principles.

  Where the crux lies:

  The crux of the issue lies in the unboundedness of the utility function and the continuity axiom. The continuity axiom forces us to make tradeoffs between outcomes with arbitrarily small probabilities and arbitrarily large magnitudes. This seems to conflict with our intuition that there are some risks (no matter how good the potential upside) that are not worth taking, and some potential losses (no matter how small the probability) that are worth avoiding at almost any cost.

  What would change my mind:

  If it could be shown that a bounded utility function is not as philosophically objectionable as it seems (for example, by showing that in practice we only face bounded choices, so the unboundedness is a theoretical fiction) then I would be more inclined to accept the bounded utility repair. Alternatively, if there were a decision theory that gracefully handles the floor without the packaging problems (for example, by applying the floor only at the level of the entire lottery and not to sub-events) and without violating other axioms (like stochastic dominance) then the floor repair might be more attractive. But as it stands, the bounded utility repair seems the most principled and least costly, despite the philosophical worry about unbounded value.

  My reasoning is most likely to fail in underestimating the cost of bounding utility. If we can show that even in a bounded world, the required bound is so high that we still face practically fanatical behavior (because the bound is astronomically large), then the repair might not actually avoid the problem. In that case, we might have to accept fanaticism or look for other solutions.
answer: |-
  ### Anatomy of Expected-Value Fanaticism

  The core issue arises from the interplay of rational preference axioms and unbounded value, leading to prescriptions that defy practical intuition. We dissect this structurally, using the button-press case as a baseline: a button costs \(c\) to press, yields value \(V\) with probability \(p\), and nothing otherwise (\(0 < c < V\)). Expected-value (EV) maximization prescribes pressing if \(pV > c\). Unbounded \(V\) (no upper limit to value) implies that for any fixed \(c\) and arbitrarily small \(p > 0\), there exists a \(V\) large enough to justify pressing. Similarly, for avoiding catastrophes (value \(-V\) with probability \(p\)), EV maximization demands paying up to \(pV\) to avert it. Sign-symmetry ensures the problem applies symmetrically to gains and losses. Crucially, this emerges solely from **unboundedness**, not infinities or astronomical scales: finite but arbitrarily large \(V\) suffices.

  #### (1) Generating Assumptions
  The fanatical verdicts stem from three jointly held assumptions about rational preference and value:
  - **Completeness and Transitivity**: Preferences are complete (any two options are comparable) and transitive (if \(A \succ B\) and \(B \succ C\), then \(A \succ C\)).
  - **Continuity**: If \(A \succ B \succ C\), there exists a probability \(q\) such that the agent is indifferent between \(B\) and a lottery yielding \(A\) with probability \(q\) and \(C\) with probability \(1-q\).
  - **Unbounded Value Scale**: The value (utility) function \(u\) mapping outcomes to reals is unbounded above and below. For any \(M > 0\), there exist outcomes with \(|u(\cdot)| > M\).

  **Why these generate fanaticism**:  
  Continuity ensures preferences can be represented by expected utility (EU). Unboundedness implies that for any fixed \(c\) (a sure loss of utility \(u(-c)\)) and any \(p > 0\), there exists \(V\) such that \(p \cdot u(V) > u(-c)\). Thus, pressing is required. Sign-symmetry extends this to losses: paying \(c\) to avoid \(-V\) with probability \(p\) is required if \(p \cdot u(-V) < u(-c)\).  

  **Why infinity and astronomical scales are red herrings**:  
  Infinities (e.g., infinite \(V\)) are unnecessary; *unboundedness* alone forces the result. For instance, with \(p = 10^{-9}\) and \(c = 1\), \(V > 10^9\) justifies pressing, but \(V = 10^9 + 1\) is finite. Astronomical values (e.g., \(V = 10^{100}\)) illustrate the issue but are not required—any finite \(V\) exceeding \(c/p\) suffices. The problem is structural: unboundedness guarantees such \(V\) exists for any \(p > 0\).

  #### (2) Natural Repairs: Costs, Benefits, and Representability
  Each repair modifies one assumption, trading off theoretical coherence for practicality. "Representable as expected value" means preferences can still be modeled as maximizing the expectation of *some* function (not necessarily a utility function under VNM axioms).

  - **Bounding the value scale**  
    *Repair*: Assume \(u\) is bounded (e.g., \(|u(\cdot)| \leq U_{\text{max}}\)).  
    *Buys*: Eliminates fanaticism. For fixed \(c\), pressing requires \(p > c / U_{\text{max}}\); sufficiently small \(p\) is ignored.  
    *Costs*: Rejects intuitive "value scalability" (e.g., a universe with twice the happiness should have higher value). May contradict transitivity if unboundedness is inherent to preference structure.  
    *Representable?* Yes, as EU with bounded utility.

  - **Imposing a probability floor**  
    *Repair*: Neglect probabilities below threshold \(\epsilon > 0\) (treat as zero).  
    *Buys*: Pragmatic; small risks are ignored. Pressing requires \(p > \epsilon\) and \(pV > c\).  
    *Costs*: Violates continuity and independence axioms. For example, if \(p = \epsilon/2\) is neglected, an outcome with value \(V\) might be indifferent to nothing, but a slight increase to \(p = \epsilon\) abruptly makes it desirable.  
    *Representable?* No. Expected value representation fails because probabilities are distorted non-linearly (e.g., a step function at \(\epsilon\)).

  - **Imprecise probabilities**  
    *Repair*: Probabilities are indeterminate; represent uncertainty as a set \(\mathcal{P}\) of probability distributions (e.g., using maxmin EU: maximize worst-case EU over \(\mathcal{P}\)).  
    *Buys*: Avoids fanaticism by allowing cautiousness. For tiny \(p\), \(\mathcal{P}\) may include distributions where \(p\) is effectively zero.  
    *Costs*: Incompleteness: may lead to indecision if options are incomparable under \(\mathcal{P}\). Violates standard EU axioms.  
    *Representable?* Not as single EU. It is expected value only if \(\mathcal{P}\) collapses to one distribution.

  - **Dropping continuity**  
    *Repair*: Reject continuity (adopt lexicographic preferences: e.g., avoid any chance of \(-V\) first, then optimize other features).  
    *Buys*: Bypasses fanaticism; infinitesimal risks are handled rigidly.  
    *Costs*: Loses real-valued EU representation. May violate transitivity or completeness if not carefully structured.  
    *Representable?* Not as real-valued EU. May use hyperreal utilities or vectors.

  - **Accepting fanaticism**  
    *Repair*: Endorse EV maximization as is.  
    *Buys*: Preserves all VNM axioms; consistent and tractable.  
    *Costs*: Demands impractical actions (e.g., bankrupting to avert negligible existential risks). Ignores cognitive and physical constraints.  
    *Representable?* Yes, as standard EU.

  #### (3) Testing the Floor Repair: Decomposition Problem
  Consider a probability floor \(\epsilon = 10^{-9}\):  
  - **Option A**: One chance in \(10^9\) of \(V\) (\(p_A = 10^{-9}\)).  
  - **Option B**: 1,000 independent chances, each \(1\) in \(10^{12}\) of \(V\) (\(p_i = 10^{-12}\) per chance).  

  Under the floor:  
  - \(p_i = 10^{-12} < \epsilon\), so each chance in B is neglected (prob. treated as 0). Thus, B offers no apparent value.  
  - \(p_A = 10^{-9} = \epsilon\), so A is not neglected (prob. \(10^{-9}\) is "above floor").  

  **Result**: A is preferred to B. Yet, B’s true probability of winning at least once is \(1 - (1 - 10^{-12})^{1000} \approx 10^{-9}\) (since \(1 - (1 - p)^n \approx np\) for small \(p\)). Thus, A and B have nearly identical EV.  

  **Is this principled or an artifact?**  
  This is an **artifact of packaging**:  
  - If B is described as a *single* lottery with win probability \(\approx 10^{-9}\), it matches A and should be treated identically.  
  - But if B is described as 1,000 sub-lotteries, the floor applies to each sub-lottery, ignoring all.  

  **Consequence for the repair**:  
  The repair is **inconsistent under decomposition**. It violates:  
  - **Description-invariance**: Preferences depend on how options are presented.  
  - **Stochastic dominance**: B stochastically dominates A (it offers more chances), yet A is preferred.  
  - **Linearity of expectation**: EV is additive, but the floor applies non-linearly to sub-events.  

  This makes the floor repair unworkable: real-world decisions often involve compound lotteries, and packaging should not alter rational choices.

  ### Where the Crux Lies
  The crux is the **tension between unbounded value and practical decision-making**. Continuity and unboundedness force infinitesimal probabilities to dominate finite costs, contradicting intuition that some risks are too small to matter. Bounding utility is the least ad hoc repair—it retains EU representation and eliminates fanaticism—but at the cost of accepting a theoretical maximum value. The probability floor and imprecise models avoid fanaticism pragmatically but sacrifice axiomatic coherence or introduce artifacts.

  **What would change my mind**:  
  - If shown that bounded utility *itself* generates paradoxes in *bounded* worlds (e.g., fails to handle scalable but finite values), I would reconsider accepting fanaticism.  
  - If a consistent method to apply probability floors to compound lotteries emerged (e.g., by applying the floor only to final outcomes), the floor repair might be viable.  
  - If evidence arises that continuity *must* hold for preference rationality (e.g., via neural or behavioral foundations), fanaticism might be unavoidable.  

  **Where reasoning is most likely to fail**:  
  In underestimating the **cost of dropping continuity**. Lexicographic preferences might handle decomposition better than floors, but their non-Archimedean structure is complex. If a tidy lexicographic EU alternative existed, it could dominate other repairs. Conversely, if unboundedness is essential to value (e.g., in moral weight), bounding utility may be the true failure point.
