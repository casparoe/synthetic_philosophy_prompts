answer: |-
  Right, let's get this down then. The core idea feels solid, and framing it around those two conditions – idempotence and description-invariance – sharpens it nicely. It exposes something genuinely under-explored. Here’s how I’d draft the proposal, aiming for the precision you need while keeping it grounded in what you'd actually *do*:

  ---

  Subject: PhD Research Proposal: Formal Constraints on Idealisation Operators in Preference Theory

  Hi [Supervisor's Name],

  Following up on our chat, I’m proposing a focused project stemming from that persistent itch about idealised preferences. We constantly rely on these ‘idealisation operators’ – functions mapping an agent’s actual, messy preferences (P_actual) to some putatively authoritative, ‘cleaned-up’ set (P_ideal). The literature obsesses over what *inputs* the operator should incorporate: full non-normative information, vivid acquaintance, coherence constraints, or even extrapolated moral development à la coherent extrapolated volition. But there’s a prior, formal question largely skipped over: what minimal constraints must *any* plausible idealisation operator satisfy, *regardless* of its chosen inputs, to even qualify as well-behaved? Without settling this, arguments about inputs risk being unmoored.

  My central question is therefore: **Can any existing or plausible idealisation operator simultaneously satisfy the conditions of idempotence and description-invariance, and if not, what does this reveal about the nature and authority of idealised preferences?**

  *   **Idempotence:** Applying the operator to its own output should yield no further change: Idealise(Idealise(P)) = Idealise(P). If idealising an already idealised set moves things again, it undermines the claim that the first output is truly ‘ideal’. Why stop at one pass?
  *   **Description-Invariance:** The output P_ideal should depend only on the *content* of the agent’s preferences, not on how those preferences are formally represented or described (e.g., how states are individuated, how options are framed). If the ‘real’ preference depends on representational quirks, it’s vulnerable to gerrymandering.

  The existing positions leave this wide open because their focus is upstream. Debates about whether the input should include *all* facts or just *relevant* ones, or whether coherence requires transitivity or also independence axioms, presuppose an operator that behaves sensibly. They rarely interrogate the operator's fundamental formal properties *once its input set is fixed*. For instance, does ‘full information plus coherence’ yield an idempotent operator if the coherence rules themselves change under iteration? Can ‘vivid acquaintance’ avoid being path-dependent on the sequence of acquaintance? I suspect most standard accounts implicitly violate at least one of these conditions, often because the input specification (e.g., "all facts") interacts badly with the operator's structure. Crucially, I aim to *test* this hunch systematically, not assume it.

  The method is where it becomes properly philosophical, not just formal fiddling:

  1.  **Months 1-2: Formal Groundwork & Case Identification:** Precisely define the formal space. Treat an idealisation operator as a function from an agent's preference structure (including beliefs, credences, whatever the account deems relevant) under a given description (D1) to a new preference structure under *some* description (D2). Define idempotence and description-invariance rigorously within this space. Select 2-3 core, contrasting exemplar accounts (e.g., a standard full-information+coherence account; a vivid acquaintance account; perhaps CEV as a more complex case) as my test cases. This is philosophy because it involves conceptual analysis: defining what counts as the 'same' preference content across descriptions, clarifying what 'iteration' means for different operators.
  2.  **Months 3-5: Formal & Conceptual Analysis:** For each test case:
      *   Formalise the operator as explicitly as possible, fixing its intended inputs.
      *   *Test for Idempotence:* Does applying the operator twice necessarily yield the same result as applying it once? If not, why not? Is the violation inherent or contingent? (E.g., Does gaining 'full information' change what counts as coherent? Does vivid acquaintance with one fact alter how acquaintance with another fact integrates?).
      *   *Test for Description-Invariance:* Construct simple preference scenarios under two different, intuitively equivalent descriptions (e.g., framing a choice as gains vs. losses, individuating states finely vs. coarsely). Run the operator on both descriptions of the *same* underlying preference situation. Do they converge on the same P_ideal? If not, is the divergence defensible or pathological? This involves normative argument about what *should* be invariant.
  3.  **Month 6: Synthesis & Fork Diagnosis:** Analyse the results. Where failures occur, diagnose *why*. Does the violation stem from the specific inputs chosen, or is it deeper? My hypothesis is that failures will cluster, revealing a fundamental fork:
      *   **Discovery Models:** Where failures are seen as problems to be fixed (suggesting an underlying fact about 'true' preference exists independently of the operator). These models *need* both conditions to hold to maintain epistemic authority.
      *   **Construction Models:** Where failures are inherent or even acceptable (suggesting the idealised set is constructed by the procedure itself, gaining authority from its moral properties, not just epistemic revelation). These models might explicitly reject one or both conditions as inappropriate demands.
  4.  **Months 7-8: Drafting & Implications:** Write the paper. Argue which fork each analysed account truly sits on based on its response to the conditions. Explore the implications: What does accepting a construction model mean for the authority of idealised preferences? Can discovery models be salvaged by modifying operators? What does this say about the very project of idealisation?

  **What a Result Looks Like:** A successful outcome isn't necessarily proving my hunch right. It could be:
  *   Confirming systematic failures of idempotence/description-invariance in standard accounts and cleanly mapping them to the discovery/construction fork (supports hunch).
  *   Finding an account that *does* satisfy both, forcing a re-evaluation of its inputs or mechanism (interesting surprise).
  *   Demonstrating that satisfying both conditions is impossible for *any* non-trivial operator, fundamentally challenging the coherence of 'discovery' models (major result).
  *   Showing that the conditions themselves need significant refinement or are inappropriate for certain types of idealisation (still valuable clarification).

  **What Failure Looks Like:** The project fails if:
  *   The formalisations are too vague or contested to allow meaningful testing (I’ll mitigate by grounding in specific, well-documented exemplars).
  *   The discovered violations are trivial or easily patched without touching the core philosophical distinction.
  *   The discovery/construction fork proves unhelpful or doesn't illuminate the operator failures.

  **Word Count (The Honest Bit):** 8000 words is *tight*, but achievable *if* I ruthlessly focus. The scope must be narrow: analysing 2-3 core exemplars in depth against the two conditions, drawing out the philosophical fork. Trying to survey the entire literature or tackle every conceivable operator variant would sink it. The key is depth on specific cases to make a general conceptual point. I won't solve all problems of idealisation, but I can convincingly show that *before* we argue about inputs, we need to get the operator structure right, and that failing these conditions pushes us towards distinct and underappreciated conceptions of idealisation's authority. The "formal scaffolding" (definitions, simple formal models, counterexamples) will be essential but subordinate to the philosophical argument. I'm confident I can deliver a substantive paper at that length by keeping the lens tightly focused on the interaction between these formal constraints and the grounding of idealisation's authority.

  This feels like the missing piece in those pub arguments – actually testing the machinery we so readily invoke. Keen to hear your thoughts.

  Best,

  [Your Name]

  ---
  This keeps it grounded, shows the philosophical work (diagnosing the fork based on formal failures), provides a concrete plan, and addresses the scope/reality check. The British English/prose style should fit the brief. Good luck with it – this has legs.
