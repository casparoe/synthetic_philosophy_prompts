prompt: |-
  Ok so me and my buddy Marcus got into a two-hour arguement last night over a dumb little two-player game I made up, and I honestly can't tell anymore whether I was the one being thick. I'm going to lay the whole thing out and I want you to go through it move by move and tell me who's right at each step, not just who wins overall.

  Here's the game. The row player picks one of three moves, call them Top, Middle, Bottom. The column player picks Left, Middle, or Right. I only ever wrote down what the row player gets, because that's the part we were fighting about, so just take these as the row player's payoffs against each of the three column choices. Top gets me 3 against Left, 0 against Middle, 1 against Right. Middle gets me 1 against Left, 1 against Middle, and 0.9 against Right. Bottom gets me 0 against Left, 3 against Middle, 1 against Right. That's the whole thing, no other numbers exist.

  I said: Middle is dominated, cross it out, a rational row player would never touch it. Marcus said no way, it isn't dominated, nothing beats it across the board. Against the column playing Middle, Middle pays me 1 and Top pays me 0, so Top is worse there. Against Left, Middle pays me 1 and Bottom pays me 0, so Bottom is worse there. So no single move dominates it, he says, and you don't get to scratch a move just because it's the most boring one on the board.

  I came back: I never said a pure move dominates it, I said a mix does. Play Top half the time and Bottom half the time and you get 1.5 against Left, 1.5 against Middle, and 1 against Right, which beats Middle's 1, 1 and 0.9 in every single column. So Middle is dominated by a mixture, and in game theory mixed strategies count, so it gets eliminated. Marcus said ok, but "play Top half the time and Bottom half the time" isn't a move, it's a lottery over moves, and if lotteries count as moves then there are suddenly infinitely many of them and you can dominate almost anything with some clever lottery, which feels like cheating. I said that's just the standard definition, a move is strictly dominated if some other move, pure or mixed, does better against everything the other guy could possibly do. He said fine, he'd grant the definition for the sake of the arguement, but then he had a real worry.

  His real worry: I'm using Top and Bottom to kill Middle. But what if Top or Bottom is itself junk and gets thrown out in the next round? Then I've killed Middle using a move I myself discarded a second later, which is circular. I said that can't happen with strict dominance, the order you eliminate in doesn't change what survives, and a strictly dominated move is never a best reply to anything and never shows up in any Nash equilibrium, so tossing it can't cost you anything. He said "never a best reply" and "dominated" sound like two seperate ideas to him, and he thinks he's read that they come apart when there are more than two players, though we only have two players here. Then he added that even if I win the technical point, he'd still play Middle, because Middle pays him about 1 no matter what the column does and that's the safe move, and if you're not sure what the other guy's going to do, why gamble on a mix? I said "safe" isn't a thing in this game, the mix guarantees you more than Middle does in every column, and if you're scared the other guy will punish your mixing then you're just assuming he knows your mix, which is a different problem. He said I keep talking about averages and he doesn't have to be an expected-value guy.

  So please go through it move by move and give me a verdict on each of these. (a) Is Middle dominated by any single pure move? (b) Is it dominated by the Top/Bottom mix? (c) Is it legitimate to let mixed strategies into the definition of dominance at all, or is Marcus right that it's a bait-and-switch? (d) If I use Top and Bottom to kill Middle, does it matter that one of them might get eliminated later? (e) Are "dominated" and "never a best reply" actually the same thing here, and does the number of players matter? (f) Is Marcus's "Middle is the safe move" point a real reason to play it, and if so is it a game-theory reason or some other kind of reason? (g) Does eliminating Middle cost us any Nash equilibrium? And tell me what we're each missing, because I suspect the whole fight is secretly about something neither of us said out loud.

  Just write it as ordinary prose, like a long email, no headings, no bullet points, no bold, no tables please.
