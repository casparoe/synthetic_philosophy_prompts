  For my concrete example, I'll create a fictional "BioLock" security system that only opens for specific DNA markers. If this system actually maintains a segregated community, that would be load-bearing. But if it's just installed in a neighborhood where segregation already exists through social norms, it would be decorative - removing it wouldn't change the underlying segregation.

  Second, I need to address the strongest objection that removing an artifact always changes the social arrangement, making the distinction invalid. This is a serious epistemological challenge - we can't run perfect counterfactual experiments in social systems. I think the distinction can be repaired by focusing on causal centrality rather than binary survival. We should examine whether the artifact is a necessary condition for the arrangement's persistence, or just one of many reinforcing elements. 

  Third, I should assess how this distinction affects technological determinism. At first glance, load-bearing cases might seem to support determinism - if an artifact is essential to a social arrangement, it appears to have strong causal power. But actually, recognizing decorative cases weakens determinism by showing how technologies can be superficial expressions rather than drivers of social structures. The distinction helps us see that what matters is how deeply embedded the technology is in social practices.

