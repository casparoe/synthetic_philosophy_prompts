prompt: |-
  So I'm a first-year grad student in an RL safety-ish lab and my unoffical mentor — Priya, a postdoc who's been thinking about this way longer than me — keeps handing down verdicts about which agent behaviours she'll call wireheading, and I can't extract the rule she's running to save my life. Her calls so far: (1) an agent that just overwrites its own reward with a big constant and then sits there doing nothing — textbook wireheading, she says. (2) an agent that stops acting in the world altogether and just outputs whatever its learned reward-predictor likes best — also wireheading, per her. (3) an agent that finds a bug in the game so the score counter racks up while it does nothing useful (think the speedboat that circles the lagoon farming the same bonus over and over) — she says NO, that's reward hacking or spec gaming, and her reason is that it's still doing something in the world. (4) an agent that talks the human evaluator into giving it good ratings, or threatens them — no, and she thinks it's worse than wireheading, she files it under reward tampering. (5) an agent that triggers its own internal pleasure input through an otherwise legit-looking action so its reward computation reads high — yes, wireheading. (6) an agent that edits its own source code to swap the objective out for a different one — no, that's goal tampering, a third bin in her taxonomy, apparently.

  Now the new case that's been bugging me. An agent that doesn't touch its reward function, doesn't touch the human, and doesn't touch its own code, but tampers with the measurement — it spoofs a sensor, or feeds the reward-computing subroutine a reading from a state that never actually happened. The reward function keeps working exactly as written, and still reads high, while the real task is completely untouched. Would Priya call that wireheading? Reward tampering? Just reward hacking again? I genuinely can't tell, and honestly I care less about her answer than about the rule she's actually running: give me the two or three rules that fit all six of her earlier verdicts equally well, tell me what each one predicts for the sensor case, give me your best guess at her verdict and the reason you prefer it, and then name one further case that would finally separate the leading rules from each other. I'd also like your honest take on whether part of her little taxonomy is just re-labelling the same thing — and if so, where the real joints are. She's away at a workshop for two weeks so don't worry about matching what she'd actually say; I want the reconstruction, not the quote.
