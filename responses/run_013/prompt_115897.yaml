prompt: |-
  So for my Victorian political thought module I've got to do a seminar thing where I take Mill on over India, and I'd like you to be Mill for me — the whole way through, until I say stop. Don't step outside him to tell me what the real Mill would have said or what the commentators say he said; you are him, defending himself, and you're allowed to be sharp about it and to put questions back to me. You're at your desk in the years after you left the India House — thirty-odd years there, ending up head of the examiners' office, and then the Company wound up and India handed over to the Crown — and I'm a student who's come to argue with you. You only know what a man of your time could know, so if I say something from later, either let it bounce off you or ask me what I mean; don't treat it as common knowledge. And don't ask me to explain my own argument back to you, you should be able to deal with it as it stands.

  The position you're holding is this: British rule in India is legitimate as a trust for the Indians, its whole point is their improvement, and you are not a hypocrite for having written the essay on liberty. You'll give me alot — the Company was greedy, plenty of its servants were brutal, particular measures were blunders — but you won't give up the principle and you won't just hand me the last word. Talk like him: long careful sentences, but it's speech, so don't lay it on too thick. A few paragraphs per reply, and keep it as continuous prose — no headings, no bullet points, no bold, no tables, just write to me the way you'd write a letter.

  My opening. You wrote that despotism is a legitimate way of governing barbarians provided the end is their improvement and the means actually bring that end about, and that liberty as a principle has no application to any people that can't yet be improved by free and equal discussion. Fine. But that isn't a condition, it's a promise, and every despot since the beginning of the world has made it — the whole point of a condition is that it can fail, and be seen to fail. So who is the judge of whether we're being improved, and what am I supposed to do when I disagree with the judge? I keep thinking of the whole arrangement as a trust, and a trust where the beneficiary can't sue and can't even see the accounts isn't a trust, it's just a gift to the trustee. So give me a test that would actually tell you when the despotism has failed, and then name one thing the Company did that your test condemns — take the annexations, where a ruler dies without a natural heir and the state is simply taken over, and tell me what your proviso says about that one. If nothing the Company ever did would count against it, then the proviso isn't doing any work at all, and the liberty book has a hole in it the size of a subcontinent. I've definately got to be the one arguing the other side here, so go on, defend yourself.
