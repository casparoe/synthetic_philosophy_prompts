prompt: |-
  I sit on the ethics committee of a mid-sized public health agency, and I have been voting on cases like the following for six years. I would like to know what principle, if any, my votes add up to.

  1. Antitoxin. One shipment. Outbreak A: sixty people will die without it. Outbreak B: fifteen will die, and four hundred will survive with permanent nerve damage. I voted to send it to A. The four hundred non-fatal injuries did not seem to me to belong in the same ledger as the forty-five additional deaths.

  2. Newborn screening. Over ten years the program will save eleven infants who would otherwise die, and will cause one death through a complication of the confirmatory test. I voted to run it. Eleven against one, both deaths; I had no hesitation.

  3. The drug. A treatment for a severely disabling, incurable, non-fatal skin condition, used by about two million patients a year. It will blind one patient a year, unpredictably and irreversibly. I voted to approve. I could not bring myself to tell two million people to keep the disease so that one stranger keeps his sight.

  4. The valley. A reservoir would displace four hundred people from a valley against their will, with compensation, and would roughly double the water supply of two hundred thousand people for a century. I voted against. I did not think the number of beneficiaries could be set against the complaints of the four hundred.

  5. The water rule. A change in disinfection would raise the lifetime cancer risk of every resident of the city, about two hundred thousand people, by roughly one in fifty thousand — about four deaths in the end — and would spare about two thousand people a year a severe but non-fatal illness. I voted for it. Had the same rule been certain to kill four named people, I would have voted against it.

  6. The lottery. A cleanup job whose dose is expected to be fatal within a few years can be done by only one person. The agency proposes to draw that person by lottery from all certified employees; whoever is drawn must take the job or be dismissed. I have voted both ways on this in different years, which is part of why I am asking.

  I have been told that this is contractualism and that my difficulty has a name. I do not want the name or a reading list; I want the principle. Here is the one I would tentatively write down: a policy is acceptable only if no one who bears a burden under it could reasonably object to bearing it, where each person's objection is assessed on its own — by what the policy does to them, not by the good it does to others — and the number of objectors counts only when their objections are of the same kind and the same severity.

  Cases 1, 2, and 4 fit that principle. Case 3 plainly does not: there I let two million lesser complaints outweigh one greater one, and I would vote the same way again. Case 5 I cannot tell whether it fits or cheats; either no resident has a complaint worth the name, since each risk is minuscule, or four expected deaths are simply four deaths thinly spread. The distinction I keep reaching for, in defense of 3 and 5, is that refusing the drug imposes a burden on the two million while refusing the reservoir imposes none on the two hundred thousand; but that seems to prove too much, since it is true whenever the many could be helped.

  So: is there a principle that holds 1 through 5 together, or must one of my votes go, and which? If the principle needs a clause separating 3 and 5 from 4, state the clause, say what work it does, and say where it looks ad hoc. Tell me what the surviving principle implies for two cases I have not put to it — one in which the people who bear the burden are also among the beneficiaries, and one in which the people who bear it do not yet exist. And if a simpler principle, one that forbids aggregation across persons altogether, captures more of my verdicts than the complicated one, say so, and tell me exactly which votes it would overturn.
reasoning: |-
  Okay, I need to help this user figure out the ethical principle behind their votes on various cases. They've shared six scenarios where they made decisions, and they're trying to see if there's a consistent principle that unifies all their choices. 

  First, I notice they're on an ethics committee for a public health agency and have been doing this for six years. That suggests they're experienced but now reflecting deeper on their philosophical foundations. They mention being told it's "contractualism" with a "difficulty" having a name, but they explicitly want the principle, not labels or reading lists. That's important - they're seeking self-understanding, not academic categorization.

  Looking at their tentative principle: They propose that a policy is acceptable only if no burden-bearer could reasonably object, with objections assessed individually based on personal harm, not societal benefit. Aggregation only happens for identical severe harms. This explains Cases 1, 2 and 4 well:

  - In Antitoxin (Case 1), sending to A avoids 45 deaths vs. B's 400 non-fatal injuries. Deaths are incommensurably worse, so no aggregation needed.

  - Newborn screening (Case 2) has 11 lives vs. 1 life - same harm type (death), so aggregation applies.

  - The reservoir (Case 4) displaces 400 people for diffuse benefits to 200k. The displacement harm is severe and individualized, while benefits are small per person - no aggregation across these different harms.

  But their principle struggles with Cases 3 and 5:

  - The drug (Case 3) blinds one person to relieve millions of non-fatal suffering. Here they DID aggregate lesser harms against a greater one.

  - Water rule (Case 5) traded 4 statistical deaths for preventing 2k severe illnesses yearly. They approved this, feeling individual risks were negligible, but would reject if it killed four named people.

  Their own attempt to distinguish these - whether refusing imposes new burdens - doesn't hold because it would always favor helping the many. I need to find what actually separates Case 3/5 from Case 4.

  Hmm... the key seems to be the nature of the burden and whether the policy creates new victims vs. preventing status quo harms:

  - In Case 3, NOT approving the drug leaves millions suffering - the policy prevents ongoing harm. The blindness risk is a new potential harm created by the solution.

  - Similarly in Case 5, the water rule prevents thousands of illnesses (ongoing harm) while creating tiny new cancer risks.

  - Whereas the reservoir (Case 4) CREATES new displacement harm to provide benefits. The beneficiaries aren't currently suffering water shortage - it's improvement, not prevention.

  This explains why they treat Case 4 differently: it actively harms some to help others who aren't in dire straits, while Cases 3/5 prevent existing harms at cost of new risks.

  For their tentative principle to work, we need a clause about preventing vs. creating harms. Specifically: aggregation is allowed when comparing prevented status quo harms to newly created solution-harms, but not when comparing newly created harms to newly created benefits.

  Now testing this:

  - Case 1: Preventing deaths (status quo harm) vs. preventing nerve damage (status quo harm). But since harms differ in severity, no aggregation anyway.

  - Case 2: Preventing 11 deaths vs. causing 1 death (both status quo prevention and solution-harm).

  - Case 3: Preventing millions' suffering (status quo) vs. risking blindness (solution-harm). Allowed aggregation.

  - Case 4: Creating displacement harm (new) vs. creating water benefits (new). No aggregation.

  - Case 5: Preventing 2k illnesses (status quo) vs. creating cancer risk (solution-harm). Allowed aggregation.

  This holds together. Now for their request about new scenarios:

  First, burden-bearers also being beneficiaries (e.g., a workplace safety rule where all workers face small risks but collectively benefit from accident reduction). Since harms prevented and created affect the same group, and we're comparing status quo harms to solution-risks, aggregation should be permitted per Cases 3/5 logic.

  Second, future people (e.g., climate policy where current costs prevent future harms). If we see future harms as "status quo" if unprevented, the principle should extend - we're preventing future suffering at cost of current burdens. But complications arise if future people don't exist yet - do we weigh their potential harms equally? Their principle seems to imply yes, as long as we're comparing prevented future harms to current solution-harms.

  Finally, considering a simpler "no aggregation ever" principle: It would match Cases 1 and 4 (where they rejected aggregation) but contradict Cases 2, 3 and 5 (where they did aggregate). Specifically:

  - Case 2: Couldn't compare 11 vs. 1 death
  - Case 3: Couldn't compare blindness risk to millions' relief
  - Case 5: Couldn't trade cancer risk for illness prevention

  Since they stand by these votes, the simpler principle won't work. Their approach requires careful distinctions between harm types and contexts.

  For the lottery case (Case 6), their inconsistency makes sense: it pits strong individual rights (no forced sacrifice) against fairness (lottery vs. volunteering). Their principle doesn't clearly resolve this tension - it depends whether one views "reasonable objection" as overriding any benefit or whether fairness mediates the sacrifice.
answer: |-
  Your votes reveal a sophisticated ethical principle that navigates between strict non-aggregation and utilitarian summation. It isn't purely contractualist (which typically rejects interpersonal aggregation entirely) but incorporates aggregation under specific conditions. Here's the unifying principle, derived from your judgments:

  **A policy is permissible if either:**
  - **(A) No individual bears a severe, *identifiable* harm that is substantially worse than the harms prevented; or**  
  - **(B) The policy prevents widespread *status quo* harms, and any new harms it introduces are either (i) *probabilistic and diffuse*, or (ii) *substantially outweighed* by the prevention of *like-kind* harms to others.**

  This principle explains all your votes in Cases 1–5 and resolves your tension. Let's break it down:

  ---

  ### **How It Explains Your Votes**
  1. **Antitoxin (A over B):**  
     - You rejected aggregation because the harms are *non-comparable in kind*: 45 deaths vs. 400 non-fatal injuries.  
     - Deaths are *identifiable, severe, and irreversible*; nerve damage is lesser. Thus, (A) applies: sending to B would impose severe, identifiable harm (death on 45) worse than the nerve damage prevented.  

  2. **Newborn Screening (Approve):**  
     - Harms are *like-kind* (death vs. death) and *identifiable*. Aggregation is allowed under (B)(ii): 11 deaths prevented outweigh 1 death caused.  

  3. **The Drug (Approve):**  
     - The policy prevents *widespread status quo harms* (millions suffering a severe disease). The new harm (one blindness) is *identifiable and severe* but is outweighed under (B)(ii): the aggregate relief from suffering justifies the risk. Unlike Case 4, the *status quo* is actively harmful.  

  4. **The Reservoir (Reject):**  
     - The harm (displacement) is *severe, identifiable, and newly imposed* on 400 people. The benefits (improved water access) are *not* preventing urgent harms but providing new gains. Thus, (A) applies: the burden-bearers can reasonably object, as their harm isn't offset by like-kind harm prevention.  

  5. **Water Rule (Approve):**  
     - The policy prevents *status quo harms* (2k severe illnesses/year). The new harm (4 statistical deaths) is *diffuse and probabilistic* (each person’s risk is 1/50,000). Under (B)(i), diffuse risks don’t ground individual objections, while the prevented illnesses are concrete. If deaths were *identifiable* (4 named people), (A) would trigger a "no."  

  ---

  ### **The Critical Clause: Preventing Status Quo Harms**  
  Your distinction between Cases 3/5 and Case 4 hinges on whether the policy *prevents existing harms* or *creates new harms for new benefits*.  
  - **Clause (B):** Aggregation is permitted *only* when:  
    - The policy prevents *widespread, ongoing harms* (e.g., disease in Case 3, illnesses in Case 5).  
    - Newly introduced harms are either:  
      - *Diffuse/probabilistic* (e.g., cancer risk in Case 5), or  
      - *Outweighed by preventing like-kind harms* (e.g., death in Case 2, or suffering in Case 3).  
  - **Why it’s not ad hoc:** This aligns with your intuition that refusing the drug/reservoir has different moral implications. Refusing the drug *perpetuates active suffering*; refusing the reservoir *avoids inflicting new harm*. The clause ensures aggregation is limited to redressing existing burdens.  

  ---

  ### **Implications for New Cases**  
  #### **Case X: Burden-Bearers as Beneficiaries**  
  *Scenario: A workplace safety rule costs all employees $1,000/year but prevents 1 annual death from accidents. Employees are both burdened and benefited.*  
  - **Your principle’s verdict:** Approve.  
  - **Why:** Harms are *like-kind* (financial loss vs. death prevention). Burden-bearers are also beneficiaries, so objections are weaker (no "sacrifice for strangers"). Clause (B)(ii) applies: aggregate financial harms are outweighed by preventing a severe harm.  

  #### **Case Y: Burden on Future People**  
  *Scenario: Building nuclear waste storage imposes small cancer risks on future generations but prevents larger climate-driven harms.*  
  - **Your principle’s verdict:** Approve, *if* future harms are *like-kind and larger*.  
  - **Why:** Future people "bear burdens" from risks but also benefit from harm prevention. If the prevented harms (e.g., climate deaths) are more severe/diffuse than the imposed risks (e.g., minor cancer increase), (B)(ii) applies. But if risks are severe/identifiable (e.g., guaranteed deaths to specific communities), (A) may trigger rejection.  

  ---

  ### **What About Strict Non-Aggregation?**  
  A simpler principle—**"never aggregate harms across persons"**—would capture:  
  - Case 1 (prioritize worse individual harm),  
  - Case 4 (no forced sacrifice for others' gain),  
  - Case 5 if deaths were identifiable (reject).  
  But it would **contradict your votes in:**  
  - **Case 2:** Couldn’t justify 11 vs. 1 death.  
  - **Case 3:** Couldn’t weigh blindness against widespread suffering.  
  - **Case 5:** Couldn’t trade diffuse deaths for illness prevention.  
  Since you stand by these, strict non-aggregation fails.  

  ---

  ### **Your Lottery Dilemma (Case 6)**  
  Your principle doesn’t dictate a clear answer—hence your shifting votes. Key tensions:  
  - **Against lottery:** Forces one person into severe harm (death), making them an *identifiable victim* (violates (A)).  
  - **For lottery:** If no one volunteers, the harm (e.g., uncontrolled outbreak) might spread. If the harm is *like-kind* (death to others), (B)(ii) *might* justify a fair lottery.  
  **Resolution depends on framing:** Is the lottery *imposing new harm* or *distributing unavoidable risk*? Your principle leans against it unless the alternative is greater, like-kind harms (e.g., many deaths without cleanup).  

  ---  
  ### **Conclusion**  
  Your core principle is: **Individual sacrifices must be justified by preventing comparable or greater harms, with special weight given to severe/identifiable victims. Aggregation is allowed only when redressing existing suffering, not when creating new harms for new gains.** This isn’t ad hoc—it reflects a nuanced view of moral reciprocity: we may ask some to bear burdens to rescue others from *current* misery, but not to *create* misery for abstract gains. If you reject this, Case 4 would need revision (approve the reservoir). But your votes cohere better with this than any off-the-shelf theory.
