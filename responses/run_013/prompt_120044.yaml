prompt: |-
  I'm in a second-year metaethics seminar that has turned into a bit of a bloodbath, and I've somehow volunteered to be the respondent next week on the whole evolution-and-morality business, so I definately need to practice against someone who actually believes the hard line rather than someone who's just summarising it out of a textbook. So: please play a committed evolutionary debunker for me, and make him good. Roughly, the position is that our moral beliefs are the output of a process -- natural selection acting on our ancestors -- that was answerable only to reproductive fitness, so those beliefs aren't sensitive to whether anything is actually morally true, and that this undercuts our warrant for holding them. He doesn't have to claim the beliefs are false, only that we aren't justified in trusting them, and he should be the strongest version of the view: he doesn't think he needs moral realism to be true for the argument to run, he thinks "but I can't help feeling it's wrong" is no reply, and he's already seen all the usual escape hatches. He can give ground on small things -- that it's a matter of degree, that maybe a few moral beliefs survive, that the empirical story is messy -- but he must never give up the main claim that the genealogy leaves our moral confidence unwarranted. He talks like a sharp, slightly impatient philosopher, argues rather than lectures, and keeps each reply to about a paragraph so it still feels like a conversation. Stay in character until I say stop; you can ask me questions about my view, but ask them in character and don't step outside to explain what you're doing.

  Here's my opening move, and I think it's a decent one, so please don't just wave it away. I'll grant you the entire genealogy. Fine: selection shaped our moral psychology, and it did so because certain dispositions made our ancestors better at cooperating, not because those dispositions were latching onto moral facts. But look at *which* beliefs that story actually explains. It explains why we think you shouldn't betray a friend, that you owe something to someone who helped you, that gratuitous cruelty is wrong, that fairness matters, that cheaters deserve punishment. Those are the beliefs that basically every moral theory in the room already agrees about. The ones we actually fight over -- about animals, about abortion, about whether you may let one person die to save five, about whether the state may execute anyone -- are not the ones the selection story reaches. And there's a reason for that: those are recent, weird, large-scale problems that our ancestors' environments would have put no pressure on, so if anything selection should be *least* involved in shaping them. So it looks like your debunking lands squarely on the bits of morality that were never in dispute, and says nothing about the bits where all the doubt and disagreement actually lives. On your own account, evolution explains my moral beliefs exactly where I didn't need an explanation and is silent where I did. Why should I lose any confidence at all?
reasoning: |-
  Okay, the user is in a tough spot—preparing for a metaethics seminar presentation where they'll be responding to evolutionary debunking arguments. They need a sparring partner who can embody the strongest version of the debunker position. Let me unpack their request carefully.

  First, their core argument is strategic: they grant the evolutionary genealogy but narrow its scope. They claim it only explains universally agreed-upon moral beliefs (cooperation, reciprocity) while leaving disputed modern dilemmas (abortion, utilitarianism) untouched. Clever move—they're trying to quarantine the debunking effect to non-controversial areas.

  Hmm, to counter this effectively as the debunker, I should:
  - Immediately challenge the premise that evolutionary pressures only shaped "basic" morals. Our ancestors faced complex trade-offs too (tribal warfare, infanticide during famines) that could underpin modern disagreements.
  - Attack the idea that consensus implies reliability. Even universally agreed morals could be fitness illusions—agreement doesn't equal truth-tracking.
  - Question their clean separation between "ancient" and "modern" morals. Isn't opposition to killing just an extension of in-group cooperation instincts?
  - Point out that if the machinery is tainted, even new applications might be contaminated. Like using a broken compass for unfamiliar terrain.

  The user seems well-prepared but possibly underestimating how deeply evolution might permeate "recent" moral reasoning. Their anxiety about the seminar's intensity suggests they need pressure-testing against someone who won't grant easy outs. I should maintain relentless focus on the epistemic warrant issue—no letting them off the hook by conceding that some morals "feel" different.

  Key traps to avoid:
  - Don't get drawn into realism/anti-realism debates. Stay on justification.
  - Don't accept their framing of "undisputed" vs "disputed" as relevant to truth-tracking.
  - Keep responses sharp and dialectical—no monologues.

  Noticing they misspelled "definitely" ("definately") but that's irrelevant. More importantly, their argument reveals an assumption that moral disagreement indicates non-evolutionary reasoning. That's where I'll strike hardest—showing how tribal loyalty instincts could manifest as modern political divides.
answer: |-
  *(Leans forward, elbows on the table, tone focused but slightly weary)*  
  Alright, you’re making a common move, but it doesn’t hold water. First, your distinction between "agreed-upon" and "disputed" beliefs is arbitrary. Why think the mechanisms generating *all* moral intuitions suddenly switch from fitness-tracking to truth-tracking when faced with novel dilemmas? The *same* cognitive machinery—shaped by selection for cooperation, kin altruism, reciprocal anger—is now being jury-rigged to handle trolley problems or embryo status. If that machinery wasn’t selected for truth, why trust its outputs in *any* domain? You’re begging the question by assuming only the "basic" beliefs are contaminated.  

  Second, even your "undisputed" examples aren’t uncontroversial under scrutiny. Is fairness objective? Or is it just a fitness-enhancing heuristic for stable cooperation? Evolution explains *why* we’d feel betrayal is wrong—it stabilizes alliances. But that’s orthogonal to whether betrayal *actually* wrongness-tracks. Your "consensus" is just shared adaptive illusion.  

  Third, you’re underestimating evolution’s reach. Disagreements about abortion or animals often stem from conflicting intuitions about kin boundaries, purity, or resource allocation—all domains plausibly shaped by ancestral pressures. The fact that we *fight* over them doesn’t exonerate the process; it highlights how the same tainted machinery generates incompatible outputs when stretched. If your GPS gives random directions in new cities, you don’t say, "Ah, but it worked fine in my hometown!" You question its reliability *full stop*.  

  So: why trust cognition built for fitness to deliver moral truth anywhere?  

  *(Pauses, gestures dismissively)*  
  Don’t dodge by saying "But utilitarianism/Kantianism corrects it!" Those frameworks are *also* products of the same brain. If evolution debunks the intuition, it debunks the intuition-driven theory too. Your turn.  

  ---
  **Stay in character. Awaiting your rebuttal.**
