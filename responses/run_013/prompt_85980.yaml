prompt: |-
  I chair the accommodations committee at a large public university, and we are being asked, dozens of times a term, to approve or refuse the use of external aids — phones, personal notebooks, task managers, AI assistants, human support workers — during proctored, closed-book exams. Our current practice is ad hoc, and we lose appeals because we cannot explain why two similar requests came out differently. Please turn the extended mind thesis into a decision procedure we can actually run, one request at a time, in about ten minutes, and write up so that a committee member with no philosophy training could reach the same result from the same file.

  Start from the conditions that literature standardly imposes — that the resource be reliably available and routinely used, that what it returns be taken at face value rather than checked, and that it be retrievable without effort — and add a fourth test our own draft proposes: that the student be able to notice and correct the aid's failures unaided. The procedure should say which questions to ask in what order, what counts as a sufficient answer to each, where it terminates in a refusal, and where it must hand the decision to a person because the question at issue is a value judgment about what an exam is for. It should not be so permissive that anything a student happens to consult counts as part of their mind.

  One of my colleagues argues that if we concede that an aid is part of the student's cognition, we must also hold the student answerable for whatever the aid produces, errors included. The procedure needs to say whether that consideration tells in favour of granting fewer accommodations or more.

  Then run it on three requests: a student with ADHD whose entire working system is a phone-based task manager they maintain with a support coach; a student who wants to bring a general-purpose AI assistant they cannot inspect and whose outputs they do not understand; and a blind student requesting a screen reader, where I suspect our whole framework is the wrong one. Close by telling me what the procedure cannot decide and where it will misfire.
reasoning: |-
  Okay, the user chairs an accommodations committee at a university dealing with complex requests about external aids during exams. They need a clear, consistent decision procedure based on the extended mind thesis. Let me start by understanding their main pain points: inconsistent decisions leading to lost appeals, and ad hoc processes. 

  First, the extended mind thesis involves conditions like reliability, routine use, trust without checking, and automatic endorsement. The user added a fourth test: the student's ability to correct the aid's errors unaided. Their colleague's concern about holding students accountable for the aid's errors complicates things. I need to address whether this leads to more or fewer accommodations.

  Breaking down the decision procedure: It should be a flowchart with yes/no questions, starting with accessibility needs to comply with legal requirements. Then, the four extended mind conditions. If any condition fails, it's either a refusal or a handoff to human judgment. The key is ensuring it's not too permissive—only aids deeply integrated into cognition should qualify.

  For the ADHD student's task manager: This seems to meet all conditions. It's reliable, routinely used, trusted without checking, automatic, and the student can correct errors. But the colleague's accountability point might suggest that if the student is responsible for errors, accommodations should be granted more freely. However, the procedure would approve it.

  The AI assistant case: Fails because the student doesn't understand the outputs and can't inspect the AI. This means they can't correct errors unaided. Also, the output isn't trusted without checking. So, refusal unless the exam's purpose justifies it, which goes to human judgment.

  The blind student's screen reader: Here, the framework might not apply. Screen readers are accessibility tools, not cognitive extensions. The procedure should flag this and handle it under legal accommodations, not extended mind. So, approval without applying the four tests.

  What the procedure can't handle: Value judgments about exam purposes, unique cases not covered by the tests, and aids that are access tools. It might misfire on aids that seem integrated but aren't (like a calculator used occasionally) or when students over-rely on unreliable aids.

  I need to ensure the procedure is practical—ten minutes per request, no philosophy background needed. Clear questions, defined thresholds, and examples for each test. Also, addressing the colleague's point: Accountability supports granting accommodations when conditions are met because the aid is part of the student's cognitive process. Rejections are for when the aid isn't integrated, maintaining exam integrity.
answer: |-
  Here's a decision procedure based on the Extended Mind Thesis (EMT), operationalized for your committee. It uses a sequential flowchart with clear thresholds, designed for 10-minute assessments per request. The core EMT criteria are: **Reliable Availability (R)**, **Routine Use (U)**, **Automatic Endorsement (A)**, plus your **Error Correction Capacity (C)**. Accountability for errors supports *granting* accommodations when EMT conditions are met.

  **The Extended Mind Accommodation Procedure (EMAP)**

  1.  **Accessibility Need?**  
      *   **Question:** Is the aid primarily requested to address a documented disability or access barrier (e.g., blindness, motor impairment, severe ADHD impacting executive function)?
      *   **Sufficient Answer:** Yes (with supporting documentation) OR No.
      *   **Decision Path:**
          *   **Yes:** Proceed to Step 2.
          *   **No:** **Refuse.** (EMT applies to cognitive *extension*, not general convenience. Start with accessibility law; EMT is a *further* argument.)

  2.  **Reliable Availability (R)?**  
      *   **Question:** Is the aid *consistently* available to the student *whenever* they need to perform similar cognitive tasks *outside* the exam context? (Is it as dependable as their own memory?)
      *   **Sufficient Answer:** Explicit evidence of consistent, uninterrupted access/functionality in daily academic/life tasks (e.g., logs, coach testimony, student log). Mere possession is insufficient.
      *   **Decision Path:**
          *   **Yes:** Proceed to Step 3.
          *   **No:** **Refuse.** (Fails core EMT integration. Not a reliable cognitive partner.)

  3.  **Routine Use (U)?**  
      *   **Question:** Does the student use this aid *automatically and habitually* for the *specific type* of cognitive task being assessed (e.g., recalling facts, planning steps, checking rules) *in their normal learning/workflow*? (Is it ingrained like internal cognition?)
      *   **Sufficient Answer:** Detailed description/documentation (e.g., workflow diagrams, app data, coach notes) showing *consistent, primary reliance* for the *relevant* tasks in non-exam settings. Occasional use fails.
      *   **Decision Path:**
          *   **Yes:** Proceed to Step 4.
          *   **No:** **Refuse.** (Not sufficiently integrated into habitual cognitive process for this task.)

  4.  **Automatic Endorsement (A)?**  
      *   **Question:** Does the student *accept the aid's output without conscious verification* in the relevant context, treating it as their own thought? (Is it trusted implicitly like biological memory?)
      *   **Sufficient Answer:** Student testimony + supporting evidence (e.g., observed behavior by coach, lack of secondary checking in workflow). "I usually trust it without double-checking during study" is key.
      *   **Decision Path:**
          *   **Yes:** Proceed to Step 5.
          *   **No:** **Handoff.** (Value Judgment: Does the exam fundamentally require *internalized knowledge/process verification*? If yes, refuse. If it assesses *output/result* regardless of internal verification, grant. *Committee must decide exam's core purpose.*)

  5.  **Error Correction Capacity (C)?**  
      *   **Question:** If the aid makes an error relevant to the exam task, can the student *independently detect and correct that error* using *their own unaided cognitive resources*? (Is the student still the "driver" of the extended system?)
      *   **Sufficient Answer:** Student demonstrates understanding of *how* errors might manifest and *specific strategies* they use *without the aid or another person* to catch/correct them. Vague "I'd notice" fails.
      *   **Decision Path:**
          *   **Yes:** **Approve.** (Aid qualifies as a genuine cognitive extension. Student is accountable for its output as their own.)
      *   **No:** **Refuse.** (Student is overly reliant; aid is a potential source of uncorrected error, undermining exam integrity. Not true integration.)

  **Accountability & Errors:** Your colleague's point *supports granting accommodations* when EMT conditions are met. If the aid is truly part of the student's cognitive system (reliable, routine, automatic), then holding the student accountable for its outputs (errors included) is consistent with treating it *as their mind*. **EMAP grants accommodations only when this accountability is justified by deep integration.** Refusals occur precisely when the aid *isn't* integrated enough to warrant this accountability (e.g., unreliable, non-routine, requires conscious checking, student cannot correct errors).

  ---

  **Applying EMAP to Cases**

  1.  **ADHD Student & Phone Task Manager (w/ Coach Support):**
      *   **1. Accessibility Need?** Yes (Documented ADHD impacting executive function).
      *   **2. Reliable Availability (R)?** Likely Yes (Presumably always available phone/app; coach ensures maintenance - need evidence of uptime/reliability).
      *   **3. Routine Use (U)?** Likely Yes (If it's their "entire working system" used habitually for planning, recall, task initiation - need evidence of daily, primary reliance for academic tasks).
      *   **4. Automatic Endorsement (A)?** Likely Yes (They presumably act on reminders/tasks without re-verifying core info constantly - need student confirmation).
      *   **5. Error Correction Capacity (C)?** **CRITICAL QUESTION.** Can they spot/correct errors (e.g., wrong deadline, missing step) *without* the coach or re-consulting external sources *during the exam*? *Need evidence:*
          *   *If Yes (e.g., "I know my schedule well enough to see a date is wrong," "I can see a step is missing based on my understanding"):* **APPROVE.** (System is extension; student accountable for its state/outputs).
          *   *If No (e.g., relies on coach to spot errors):* **REFUSE.** (Not true cognitive extension; coach is the functional "corrector").

  2.  **Student & General-Purpose AI Assistant (Uninspectable/Incomprehensible):**
      *   **1. Accessibility Need?** No (Unless compelling, novel disability argument is made *and* documented). Likely **Refuse.** (Proceed only if Accessibility Need is established).
      *   **2. Reliable Availability (R)?** Maybe (Service uptime?).
      *   **3. Routine Use (U)?** Depends (Is it *habitual and primary* for the *specific exam tasks*? General use ≠ routine use for targeted cognition).
      *   **4. Automatic Endorsement (A)?** Likely **No.** ("Outputs not understood" directly contradicts automatic endorsement. Requires conscious verification/interpretation). **Handoff/Refusal.** Value Judgment: Can an exam assess understanding if the student uses an incomprehensible tool? Likely refuse based on A failing.
      *   **5. Error Correction Capacity (C)?** **Definitely No.** (Cannot inspect, cannot understand outputs → cannot detect/correct errors unaided). **REFUSE.** Fails core integration and accountability tests.

  3.  **Blind Student & Screen Reader:**
      *   **1. Accessibility Need?** **Yes.** (Fundamental access barrier).
      *   **Decision:** **APPROVE IMMEDIATELY.** Do not apply further EMT tests.
      *   **Why:** A screen reader is a *sensory prosthesis*, not primarily a cognitive extension in the EMT sense. It provides access to the exam content itself. EMT is the *wrong framework* here. This is a core accessibility accommodation mandated by law (e.g., ADA). Applying EMT tests risks unnecessary and discriminatory gatekeeping. The question isn't if the screen reader is part of their mind, but if it provides equivalent access to the exam material.

  ---

  **What EMAP Cannot Decide & Where It Might Misfire**

  1.  **Value Judgments:** EMAP explicitly **hands off** decisions involving:
      *   The **core purpose of the exam** (Step 4: Automatic Endorsement failure). Is the exam testing *recalled knowledge* or *ability to find/apply information*? Is it testing *verification skills* or just *results*? The committee must debate and decide this based on course objectives.
      *   **Novel "Accessibility Need" Arguments:** Is heavy reliance on an uninspectable AI a symptom of a new cognitive disability profile requiring accommodation? EMAP starts with documented need – novel cases require committee judgment.
      *   **The "Spirit" of Closed-Book:** EMAP operationalizes EMT, but some may argue closed-book inherently excludes *all* external resources, regardless of integration. EMAP rejects this absolutism but acknowledges the committee may set boundaries based on exam purpose.

  2.  **Where It Might Misfire:**
      *   **Overly Rigorous "C" Test:** Demanding too high a level of unaided error correction might unfairly penalize students whose disability inherently impacts self-monitoring, even with a well-integrated aid. Mitigation: Focus on *capacity relative to the aid's function* and ensure accessibility need is primary.
      *   **"Routine Use" Threshold:** Defining "habitual and primary" use can be fuzzy. Does using a calculator for all homework math qualify, or only if used constantly? Requires careful evidence review.
      *   **Misapplying to Sensory/Access Tools:** As with the screen reader, applying EMT to basic access tools (e.g., wheelchairs, magnifiers, sign language interpreters) is inappropriate and potentially discriminatory. EMAP flags Step 1 to prevent this.
      *   **Novel Technologies:** How to assess "Reliable Availability" or "Automatic Endorsement" for cutting-edge, poorly understood AI tools? May require cautious interpretation and more frequent "Handoff."
      *   **The "Coach" Factor:** In Case 1, the coach's *external* maintenance role is acceptable *if* the student has internalized the *use* and *error correction* of the *system itself* during the exam task. If the coach *is* the error corrector, it fails. Drawing this line requires scrutiny.

  **Implementation Advice:** Train committee members on the flowchart logic and thresholds. Use standardized forms prompting for evidence for each step (R, U, A, C). Maintain a log of decisions and justifications (referencing the EMAP step outcome) to ensure consistency and win appeals. Remember: EMT is a *justification* for accommodation under specific conditions, not a replacement for core accessibility law obligations. Start with accessibility need, then apply EMT as a rigorous test for cognitive integration beyond basic access.
