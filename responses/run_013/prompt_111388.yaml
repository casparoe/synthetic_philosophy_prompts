  I'm a third-year philosophy student and the student rep on my department's curriculum committee, and I've somehow ended up being the one who has to write the memo that goes out to the committee before Thursday's meeting. I'm also doing a module on social choice this term, which is either helping me or making everything worse, i cant tell yet.

  The situation: our first-year Great Books stream has a common text that alot of the faculty find inflammatory, and the committee has to decide which sections assign it in the fall. Four options are on the table — both sections assign it, only Priya's section assigns it (she's the senior person who runs the 10am group), only Dana's section assigns it (Dana's the new hire), or neither. Two bylaws are in play. First, the instructor's prerogative: an instructor has the final say over what's taught in their own section, so no committee policy can force a section to assign something its instructor won't teach. Second, the consensus rule: if every member strictly ranks one option above another, the committee has to rank it that way too — we don't let a majority outvote a unanimous preference. Now the preferences. Priya would rather the text be dropped altogether; if it's going to be taught somewhere, she'd rather teach it herself than watch Dana get chewed up over it, but she will not accept a policy that puts it in her own section. Dana thinks the text matters and should be taught; she'd rather teach it herself than see it dropped, but if it's taught at all she strongly prefers that Priya be the one teaching it, and she definitely prefers Priya's section teaching it over her own section doing it. The other three members prefer that if the text is taught it's taught in Priya's section, and are otherwise indifferent and mostly want the whole thing over with.

  I put the preference profile into a spreadsheet and I think our two rules together mean there's no option we can land on without breaking one of them, and worse, that the outcome flips depending on what order we vote on the pairs — so the chair can basically engineer whichever result he likes, which a few people have noticed and are not happy about. A prof of mine said something like 'oh, that's just the liberal paradox, Sen's thing' and moved on, which wasn't useful. I don't need the literature or any citations, I need the memo: please draft the short written opinion I'll circulate Wednesday night. It should say what we should actually do on Thursday — an actual decision, or a procedure for arriving at one — with a concrete recommendation and a time frame, the reasoning behind it, and a serious treatment of the strongest objection from whoever ends up on the losing side rather than a token paragraph. And if my spreadsheet reasoning is off somewhere, tell me, because I'd rather look dumb in the memo than at the meeting.
