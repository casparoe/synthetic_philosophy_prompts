answer: |-
  Your framing is sharp, and the group's impasse is classic—but crucially, **this isn't one debate; it's three conflated problems masquerading as one.** The "paradox of voting" label glues together distinct issues, leading to talking past each other. Here's the diagnosis and path forward:

  ### Diagnosis: Three Conflated Problems
  1. **The Empirical Puzzle**:  
     *Why do millions vote despite negligible instrumental benefit?*  
     This is a question about **human motivation and causality**. It demands empirical evidence (surveys, experiments, neuroeconomics) about what *actually* drives turnout.

  2. **The Rational Choice Model Breakdown**:  
     *Why does the standard rational actor model (expected utility maximization) fail to predict voting?*  
     This is a **limitation of a specific mathematical formalism**. When pivot probability ≈ 0, the model collapses unless "modified" with new terms (duty, expression). Critics rightly call these post hoc if untethered from data.

  3. **The Normative Question**:  
     *Ought a rational person vote?*  
     This is **philosophical** (ethics, decision theory). "Rational" here isn't descriptive—it's prescriptive. Proposing minimax regret or team reasoning answers *this* question, not the empirical one.

  ### Why the Impasse Persists
  - **Utility Function Debates** are often verbal disputes:  
    Calling "duty" a "utility term" vacuously saves the rational choice model but explains nothing. If "utility" swallows all motivations (even guilt), it becomes tautological: *"People vote because they prefer voting"*.  
  - **Decision Rule Proposals** answer the normative question:  
    Saying *"A rational agent should vote under rule-utilitarianism"* doesn't explain why *actual people* vote. It changes the subject.  
  - **The Conflation Trap**:  
    Group members are likely shifting between these questions unawares. The empirical skeptic hears "duty" as an unfalsifiable excuse; the normativist hears "irrational" as a moral accusation.

  ### What Counts as Progress
  1. **Disentangle the Questions Explicitly**:  
     Before discussion, agree: *"Are we explaining behavior, critiquing rational choice models, or debating moral obligation?"* Force clarity. Example:  
     - *Empirical*: "What evidence suggests 'expressive benefit' is a real psychological driver?"  
     - *Model Critique*: "Does adding 'duty' to the utility function make rational choice theory unfalsifiable?"  
     - *Normative*: "If voting benefits society but not the individual, is it rational to vote?"

  2. **Empirical Evidence as Arbiter**:  
     For the *empirical puzzle*, prioritize data over theory-tweaking:  
     - **Experimental work**: Lab studies on voting games (e.g., Levine & Palfrey 2007's costly voting experiments).  
     - **Psychometrics**: Surveys parsing "duty" vs. "instrumentality" (e.g., Blais' voting motivation scales).  
     - **Neuroeconomics**: Does voting activate reward centers linked to social approval?  
     - **Turnout variation**: Correlates like close elections (higher pivotality) or social pressure (Gerber et al.'s mailer experiment).

  3. **Model-Specific Progress**:  
     For the *rational choice breakdown*, accept that expected utility fails catastrophically near-zero probability. Progress looks like:  
     - A **unified psychological model** (e.g., "expressive utility" tied to identity signaling).  
     - **Computational models** exploring heuristic rules (e.g., voting as a social norm heuristic).  
     - **Abandoning instrumentalism** as the sole frame (e.g., "folk theory" of voting as duty).

  4. **Philosophical Clarification**:  
     For the *normative question*, concede it's independent:  
     - Argue if **team reasoning** (Bacharach) or **regret avoidance** (Ferejohn) better defines rationality.  
     - But admit this won't resolve *why people actually vote*.

  ### When Progress Isn't Possible
  Some gaps won't close:  
  - **Utility functions**: If "utility" is defined as "whatever motivates people," debate is circular. Reject this framing. Demand operationalized predictors (e.g., "duty" measured by survey items).  
  - **Normative disagreements**: No argument can prove whether Kantian duty or Benthamite calculus defines "should." Accept pluralism.

  ### Your Path Forward
  1. **Next session, label the three questions**. Poll the group: which are they arguing about?  
  2. **Bring empirical papers**:  
     - Riker & Ordeshook (1968) on "D" term (duty) in turnout.  
     - Feddersen & Sandroni (2006) on ethical voters.  
     - Grossman & Helpman (2018) on identity-based voting.  
  3. **For software minds**: Propose an agent-based model exploring decision rules vs. social motivations.  

  **Bottom line**: The paradox persists because it's not one paradox. Progress starts by decoupling the empirical "why" from the normative "ought," and demanding evidence over utility-function duct tape. Your group's joke is apt—but the solution isn't a new term or rule; it's wielding Occam's razor on the question itself.
