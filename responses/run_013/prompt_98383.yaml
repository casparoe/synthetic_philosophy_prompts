prompt: |-
  Me and a mate got into a propper long arguement last night about risk-weighted expected utility, and now I'm marking a stack of undergrad scripts and I've hit one I'm not sure about. The question was:

  Consider a choice between:
  A: £28 for sure.
  B: a lottery with a 50% chance of £60, a 30% chance of £30, and a 20% chance of £0.
  Assume utility is linear in money, so u(x)=x. The decision-maker uses risk-weighted expected utility (REU). For ordered outcomes x1 ≤ ... ≤ xn, REU is:
  u(x1) + Σ_{i=2}^n [u(xi) − u(x_{i−1})] · r(P(X ≥ xi)),
  where r is an increasing probability weighting function with r(0)=0 and r(1)=1. Take r(p)=p².
  Which option does REU recommend? Show your working. Then explain what r is doing in the REU formula and how REU differs from standard expected utility.

  The student wrote:

  Standard EU first: EU(B) = 0.5(60) + 0.3(30) + 0.2(0) = 39. EU(A) = 28, so EU picks B.

  For REU, order outcomes worst to best: 0, 30, 60. Cumulative probabilities of doing at least as well as each outcome: P(X ≥ 60)=0.5, P(X ≥ 30)=0.8, P(X ≥ 0)=1. Then
  REU(B) = u(0) + [u(30) − u(0)]r(0.8) + [u(60) − u(30)]r(0.5)
  = 0 + 30(0.64) + 30(0.25)
  = 19.2 + 7.5 = 26.7.
  Since 26.7 < 28, REU picks A.

  So REU flips the choice. The function r transforms cumulative probabilities so the decision-maker doesn't treat them linearly. Here r(p)=p² is convex, which means the decision-maker is risk-seeking, because a convex function exaggerates the weight of better outcomes. This is basically the same as having a convex utility function in standard expected utility, or what Kahneman and Tversky call prospect theory. The key difference from EU is that REU separates attitudes to risk from attitudes to outcomes: risk aversion is modelled by r, while utility u handles the value of money.

  Can you give the answer a mark out of 10 and the specific comments you'd write in the margin? I want a point-by-point assessment, not just a general impression. Also, say how confident you are in your grading and which bit you're least sure about.
reasoning: |-
  Okay, I need to assess this undergraduate student's answer about risk-weighted expected utility. The question involves choosing between a sure £28 and a lottery with different payoffs. The student calculated both expected utility and REU, concluding that REU recommends the safe option. They also explained the role of r and differences from standard EU.

  First, I'll verify their EU calculation. EU(B) = 0.5×60 + 0.3×30 + 0.2×0 = 30 + 9 + 0 = 39. EU(A)=28. Correct that EU prefers B. 

  For REU, they ordered outcomes correctly: 0, 30, 60. Cumulative probabilities: P(X≥60)=0.5, P(X≥30)=0.8 (since 50%+30%), P(X≥0)=1. Applying r(p)=p²: r(0.8)=0.64, r(0.5)=0.25. The REU formula is: 
  u(0) + [u(30)-u(0)]×r(0.8) + [u(60)-u(30)]×r(0.5)
  = 0 + 30×0.64 + 30×0.25 
  = 19.2 + 7.5 = 26.7. 
  This matches their calculation. Since 26.7<28, A is preferred. Correct computation.

  Now their explanation: They state r transforms cumulative probabilities non-linearly. Correct. They note r(p)=p² is convex and claim this makes the decision-maker risk-seeking. This is backwards! A convex r function actually corresponds to risk aversion in REU, because it downweights better outcomes (higher cumulative probabilities get compressed). Their error here is significant.

  They incorrectly analogize this to "convex utility in EU" (which would be risk-seeking) and prospect theory. REU separates risk attitudes via r, while utility remains linear - this part is correct. But their risk-seeking conclusion undermines the core insight.

  Grading plan:
  - EU calculation: 2/2 (correct)
  - REU ordering/cumulative probs: 2/2 (correct)
  - REU computation: 2/2 (correct)
  - REU choice comparison: 1/1 (correct)
  - Explanation of r's role: 1.5/2 (correct transformation but misses risk aversion implication)
  - Risk attitude claim: 0/1 (incorrect - convex r is risk-averse)
  - EU vs REU difference: 1.5/2 (correct separation concept but contaminated by earlier error)
  - Prospect theory analogy: -0.5 (misleading parallel)

  Total: 7.5/10. Least confident about the penalty for prospect theory mention - it's not entirely wrong but oversimplifies. The major flaw is misattributing risk attitude, which is central to interpreting r.
answer: |-
  ### Grading and Comments  
  **Total Mark: 7.5/10**  

  #### Specific Comments (Margin Notes):  
  1. **EU calculation (A vs. B):** ✓✓ Correct. EU(B) = 39 > 28, so EU prefers B. *(2/2)*  
  2. **REU setup (ordering & cumulative probabilities):** ✓✓ Perfect. Outcomes: 0 ≤ 30 ≤ 60. P(X≥60)=0.5, P(X≥30)=0.8, P(X≥0)=1. *(2/2)*  
  3. **REU computation:** ✓✓ Flawless arithmetic. REU(B) = 0 + 30×r(0.8) + 30×r(0.5) = 30×(0.64) + 30×(0.25) = 26.7. ✓ Comparison: 26.7 < 28 ⇒ REU picks A. *(3/3: 1 for formula, 1 for weights, 1 for comparison)*  
  4. **Explanation of r's role:** ✓ Partially correct. "r transforms cumulative probabilities non-linearly" is right. ✗ **But:** Convex r (r(p)=p²) implies **risk aversion**, NOT risk-seeking. Convex r *downweights* better outcomes (e.g., r(0.5)=0.25 ≪ 0.5), reducing the weight on gains. *(1/2)*  
  5. **Risk attitude error:** ✗ **Major mistake.** Claiming convex r → "risk-seeking" is incorrect. REU with convex r models **risk aversion** (as here). Risk-seeking would require *concave* r (e.g., r(p)=√p). *(0/1)*  
  6. **REU vs. EU difference:** ✓ Correct that REU separates risk attitudes (via r) from outcome utility (u). ✗ **But** the risk-seeking error undermines this. *(1.5/2)*  
  7. **Prospect theory analogy:** △ Oversimplified. REU ≠ prospect theory. PT uses probability weighting *and* S-shaped utility; REU uses rank-dependent weighting with linear u. *(0.5 → -0.5 penalty; not strictly wrong but misleading)*  

  ---

  ### Confidence and Uncertainty  
  - **Overall Confidence:** 85% (Solid on calculations; less so on interpretation penalties).  
  - **Least Confident Part:** Penalty for the prospect theory analogy. The student is vaguely right (both involve weighting), but the conflation is common. I deducted 0.5 for conceptual blurring, but this is subjective. The core error (convex r → risk-seeking) is unambiguous.  

  ---

  ### Summary of Key REU Insights (For Your Reference):  
  - **r(p)=p² (convex):** Compresses high cumulative probabilities (e.g., r(0.8)=0.64 < 0.8), downweighting better outcomes → **risk aversion**.  
  - **REU vs. EU:** EU uses linear probability weights; REU uses transformed *cumulative* probabilities. Risk aversion stems from r (not curvature of u), with u linear.  
  - **Why REU flipped to A:** Convex r makes the lottery’s upside (£60) less impactful (weight=0.25 vs. 0.5 in EU), emphasizing downside risk.  

  **Student’s Strengths:** Calculations perfect, structure clear.  
  **Critical Weakness:** Misunderstanding risk attitudes, likely confusing r’s convexity with utility convexity. Address this in feedback.
