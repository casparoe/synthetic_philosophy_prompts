prompt: |-
  I'm teaching Our Town in my intro seminar next week alongside the Epicurean argument that death is nothing to us, and I want a reading of the play that's less pat than "Wilder refutes Epicurus with a ghost story." So here's what I'd like: read the play through the argument, but keep its separate strands apart. There's the no-subject strand (the dead don't exist, so there's nobody left for death to be bad for), the no-time strand (before you die you're alive, after you die you're not, so there's no moment at which the harm lands), and Lucretius' symmetry point (the eternity before you were born doesn't trouble you, so the one after shouldn't either). Where does each one land against Grover's Corners? The dead in the cemetery are plainly still subjects with views about the living -- is that Wilder taking an afterlife literally, in which case he's just denying strand one, or is it a stage device that leaves the argument intact? Emily's day back is the play's strongest card for the deprivation account, that death is bad because it takes goods away from you -- but the good she's deprived of is the ordinary, which she couldn't see while she had it, so I'm not sure it cuts the way it looks like it cuts. And Wilder has the living grieve while the dead have gone quiet and detached; if that's his picture, is the grief a mistake, and does he think so? One more thing I want in there: the case the argument doesnt touch, whether it's bad for you to be forgotten or to have your life come to nothing after you're gone, and whether the play takes a side on that. Close by saying what the play adds that the argument on its own doesn't have, and where it just won't be read that way. Don't quote long passages at me, I know the text. American English please, 1200 words or so.
