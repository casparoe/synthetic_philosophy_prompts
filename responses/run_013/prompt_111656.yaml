answer: |-
  1.  **Non-comparability of utilities:** If utilities lack interpersonal comparability, the weighted sum (and thus utilitarian aggregation) is undefined; rival rules like Pareto efficiency without aggregation or Rawlsian maximin become necessary. A defender might concede the *measurement* difficulty but dismiss the *conceptual possibility* of comparability within their framework, risking substantive exclusion of distributive concerns.
  2.  **Violations of expected utility (ambiguity aversion, rank-dependence):** If individuals exhibit non-expected utility preferences (e.g., ambiguity aversion) under risk/uncertainty, the rationality axioms fail, invalidating the EU representation and aggregation; rival rules like maximin under ambiguity or rank-dependent social welfare functions become live. A defender would likely dismiss this by insisting on idealized rationality assumptions, insulating the position but risking empirical irrelevance.
  3.  **Social choice paradoxes (intransitive individual preferences):** If individual preferences are intransitive (even if EU-rational per prospect), social preference respecting weak Pareto unanimity can be intransitive or fail independence, preventing *any* consistent aggregation rule; rival rules become situational majority cycles or dictatorship. A defender would dismiss this by requiring transitive individual preferences, a core qualifying assumption insulating the theorem.
  4.  **Biased risk attitudes under the veil:** If individuals behind the veil exhibit non-neutral risk attitudes (e.g., risk aversion towards life prospects), the equiprobability assumption doesn't guarantee equal weights, potentially yielding prioritarian or leximin social welfare instead of strict utilitarianism. A defender might concede this *implementation* issue but dismiss it by assuming idealized risk neutrality or identical attitudes, risking the justification for equal weights.
  5.  **Misconception of utility (objective vs. preference):** If utility represents objective well-being (e.g., capabilities) not captured by revealed preference under risk, Harsanyi's aggregation sums the wrong thing; rival rules like capability aggregation or primary goods become live. A committed defender would dismiss this, insisting utility *is* preference-satisfaction within the model, insulating the position but risking detachment from substantive welfare concepts.
