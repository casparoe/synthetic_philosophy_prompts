  You've hit on a crucial point in Thucydides' methodology and his critique of popular history. The apparent tension arises because Thucydides is applying a different *kind* of critical test to different *types* of information, primarily based on temporal proximity and the possibility of verification.

  Here's the breakdown:

  1.  **"Critical Test" Defined by Thucydides:** For Thucydides, applying a "critical test" means **subjecting received accounts (traditions, rumors, popular beliefs) to rational scrutiny and verification against available evidence, especially eyewitness testimony and contemporary facts.** It involves:
      *   **Skepticism:** Not accepting stories at face value.
      *   **Cross-Examination:** Seeking out multiple sources, especially those who were present or had direct knowledge.
      *   **Internal Consistency:** Evaluating if the story makes logical sense given known facts and human behavior.
      *   **Contradiction Checking:** Looking for inconsistencies within the story or between different accounts.
      *   **Prioritizing Contemporary Evidence:** Giving the most weight to information about events within living memory that can be investigated.

  2.  **The Problem with "Early Times" (Chapter 20 opening):** Thucydides readily admits the difficulty with events far in the past ("early times"). The sources *are* largely oral traditions, myths, and hearsay passed down uncritically. For these, applying a rigorous critical test is often impossible because:
      *   There are no living witnesses to question.
      *   Accounts have been embellished, distorted, or simplified over generations ("obscured by time").
      *   The motives for preserving these stories (e.g., civic pride, family glory, religious explanation) often override accuracy.
      *   Therefore, he "grants that there will be a difficulty in believing every particular detail" of his *own* account of the distant past. He implies he uses the best traditions available but cannot guarantee their absolute truth like he can for recent events.

  3.  **His Examples: Correcting Contemporary/Recent Errors:** The examples he provides (Hipparchus, Spartan votes, Pitane company) are *not* about the distant, mythical past. They are about events within living memory or contemporary institutions:
      *   **Hipparchus' Assassination (514 BC):** This happened only about 80 years before Thucydides wrote. Survivors, participants, or their direct descendants were likely still alive or their accounts were freshly recorded. Thucydides could investigate *how* the popular misconception arose (focusing on the dramatic killers of the lesser brother) versus the *actual* political structure (Hippias as the real tyrant). He implies the true sequence of events (the plotters' panic, the target switch) comes from a more reliable source than the simplified heroic myth.
      *   **Spartan Kings' Votes & Pitane Company:** These are about *current* Spartan institutions and military organization at the time of writing (or very recently). Thucydides, as an Athenian general and statesman:
          *   Had access to diplomats, spies, exiles, and merchants who traveled to Sparta.
          *   Could interview Spartans themselves (or Athenians who dealt with them).
          *   Could observe Spartan practices during truces or negotiations.
          *   Could compare multiple accounts to establish the actual constitutional practice (one vote per king) and the non-existence of a specific, mythical military unit ("company of Pitane").

  4.  **The Difference: Verifiability:** The key distinction Thucydides makes is between:
      *   **Unverifiable "Early Times":** Where critical testing hits a wall due to lack of contemporary evidence. He uses traditions cautiously, acknowledging their limitations.
      *   **Verifiable Recent/Contemporary Events:** Where critical testing *is* possible through investigation, cross-checking sources, and rational analysis. He *can* correct popular errors here because he has applied this test.

  5.  **His Claim:** Thucydides claims his methodology is superior because:
      *   He actively seeks the truth rather than passively accepting what's popular.
      *   He distinguishes between the knowable (recent/contemporary) and the less knowable (distant past).
      *   He applies rational skepticism and verification *where possible*.
      *   He exposes how popular history simplifies, distorts, and ignores inconvenient details to create satisfying narratives (like the tyrannicide myth).

  **In short:** Thucydides' "critical test" means rigorously verifying contemporary/recent events through eyewitness testimony and rational analysis, a method he contrasts with the uncritical acceptance of popular tradition, especially regarding the less verifiable distant past.
