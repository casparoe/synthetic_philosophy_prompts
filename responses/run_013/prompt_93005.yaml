  The user wants me to break down the different interpretations of "rule" in legal, constitutional, and conventional senses, explain what each would mean in practice, and then evaluate whether each interpretation is trivial, defensible, or false. They specifically want the "menu of readings" rather than a verdict on monarchy itself. 

