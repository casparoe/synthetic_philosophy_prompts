  I'll avoid taking sides on monarchy itself per the user's request, but will note that the slogan's effectiveness relies on audiences intuitively grasping the conventional meaning - which failed in their classroom debate due to lack of contextual knowledge.
answer: |-
  Your frustration is well-founded—the slogan "reigns but does not rule" is a rhetorical shorthand that obscures complex constitutional realities. Below is a breakdown of its possible meanings across legal, constitutional, and conventional dimensions, along with an evaluation of each interpretation's validity and relevance to your debate. The key is distinguishing between *formal authority* and *practical power*.

  ---

  ### **1. Legal Sense: "Rule" as *Formal Possession of Sovereign Power***
     - **Claim:** The monarch lacks *any* legal authority to govern.  
     - **What it would entail:** The monarch would have zero legal powers (e.g., no veto, no role in appointments, no command of armed forces). Laws would not require royal assent.  
     - **In practice:** **False.** In constitutional monarchies (e.g., UK, Canada, Australia), the monarch legally:  
       - Appoints the Prime Minister (though convention dictates whom).  
       - Gives royal assent to bills (without which they cannot become law).  
       - Is the Commander-in-Chief of the armed forces.  
       - Can dissolve parliament (in some systems).  
     - **Debate relevance:** Invoking this reading is **misleading**. It ignores the monarch's residual legal powers, which exist even if unused.

  ---

  ### **2. Constitutional Sense: "Rule" as *Exercising Discretionary Authority***
     - **Claim:** While the monarch holds legal powers, constitutional constraints prevent their *independent exercise*.  
     - **What it would entail:** The monarch’s powers are "fused" to elected officials (e.g., assent is automatic, appointments are ceremonial).  
     - **In practice:** **Substantively true, but incomplete.** Constitutions (written or unwritten) bind the monarch to act on ministerial advice. Refusing assent would spark a crisis—but the legal *capacity* to refuse remains. Example:  
       - In the UK, the monarch *could* legally veto a bill, but doing so since 1708 (Queen Anne) would breach constitutional convention.  
     - **Debate relevance:** This is the **strongest defensible reading** of the slogan. It acknowledges legal powers while stressing their subordination to democracy via constitutional norms.  

  ---

  ### **3. Conventional Sense: "Rule" as *Setting Government Policy or Agenda***
     - **Claim:** The monarch has no influence over policy, lawmaking, or political direction.  
     - **What it would entail:** The monarch never intervenes in politics, even privately. Governments act without regard to royal opinion.  
     - **In practice:** **Mostly true, but nuanced.** Monarchs typically avoid public interference. However:  
       - They hold weekly meetings with the PM and may offer "advice, encouragement, or warning" (Bagehot's formulation).  
       - Influence exists through soft power, access to secret briefings, and symbolic stature (e.g., Queen Elizabeth II’s behind-the-scenes counsel).  
       - In crises (e.g., hung parliaments), they may exercise reserved discretion (e.g., selecting a PM when no majority exists).  
     - **Debate relevance:** **Substantively defensible** if "rule" means *directing policy*. But it risks downplaying the monarch’s latent influence.

  ---

  ### **4. Literalist Sense: "Rule" as *Day-to-Day Governance***
     - **Claim:** The monarch does not sign laws, administer departments, or command troops.  
     - **What it would entail:** Ministers perform all executive functions; the monarch is purely symbolic.  
     - **In practice:** **Trivially true.** No modern constitutional monarch personally governs. Powers are exercised *in their name* by elected officials (e.g., "Crown-in-Parliament").  
     - **Debate relevance:** **A triviality.** This distracts from the real issue: whether the monarch retains *reserve powers* that could undermine democracy.

  ---

  ### **Which Reading Is Needed in Your Debate?**
  The slogan’s users likely intend the **constitutional sense** (#2), but its oversimplification creates confusion. To rebut it effectively, focus on:  
  1. **Legal reality:** The monarch *does* hold formal powers (assent, dissolution, etc.).  
  2. **Constitutional fragility:** These powers are restrained only by convention—not law. A monarch *could* refuse assent (e.g., if a bill abolished democracy), but this would force a constitutional crisis.  
  3. **Democratic tension:** A non-elected figure holding latent powers challenges pure democratic theory, even if unused.  

  The slogan’s weakness is conflating "does not rule" with "cannot rule." It sidesteps whether *retaining* reserve powers in a democracy is justifiable—which is the core of your debate.

  ---

  ### **Key Takeaway for Your Discussion**
  - **Pro-monarchy side** uses the slogan to imply the monarch is *powerless*, which is legally false but conventionally mostly true.  
  - **Anti-monarchy side** should counter by stressing that conventions are unenforceable norms, not legal barriers. The monarch’s powers exist as a "nuclear option" — dormant but constitutionally significant.  
  - **Better framing:** Ask whether a democracy should tolerate *potential* interference by an unelected figure, even if improbable. That shifts the debate from semantics to democratic principles.  

  For a concrete example: In 1975, Australia’s Governor-General (representing the monarch) *dismissed* an elected PM—proving reserve powers can upend democracy. Such cases reveal the slogan’s oversimplification.
