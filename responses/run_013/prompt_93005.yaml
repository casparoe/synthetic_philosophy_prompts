  The user's frustration about royal assent is spot-on - legally the monarch can refuse, but constitutionally and conventionally they cannot. That gap between legal theory and practical reality is exactly what makes this slogan both true and misleading depending on interpretation. 

  I should also address why people use this slogan: it's a useful shorthand for the democratic legitimacy of constitutional monarchies, but oversimplifies the legal-conventional tension. The most defensible reading is the conventional one, though it requires understanding unwritten norms that aren't immediately obvious to debate participants. 

  The evaluation should show that:
