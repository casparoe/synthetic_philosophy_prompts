prompt: |-
  I run the analysis team at a mid-sized charity — eight people, we turn out cost-effectiveness estimates and forecasts that other people then spend actual money on, so when one of our numbers is off it isn't just embarrassing, it's a few hundred grand pointed at the wrong thing. We have a convention that every estimate goes out with a point figure, a range, and one line from the analyst on how much they trust their own process, and that last bit has turned into a mess. What keeps happening — two or three times a month at this point — is that someone brings me a number and in the same breath tells me they don't trust the process that produced it: they were rushed, they'd half-decided the answer before they looked at the data, someone they rate came out somewhere quite different, or they've just read something about how people like them systematically overrate their own models. They can see the problem perfectly clearly. They just don't know what to do about it and neither do I. One of them now says she thinks the number is right and at the same time thinks she shouldn't believe it, which sounds like a contradiction until you've sat in the meeting; someone told me the word for it is epistemic akrasia and then changed the subject.

  I've been reading round higher-order evidence — what you're supposed to do when the evidence about your evidence points somewhere other than the evidence does — and I want it turned into something I can actually run in a twenty-minute conversation with an analyst, not a seminar. So: give me a decision procedure. The questions I ask in order, what counts as a sufficient answer to each, where it stops with "keep the number", where it stops with "bin it and start again", and where it hands the decision back to me because the question is what we're willing to risk rather than what the evidence says. There's one distinction I think is the crux and most of what I've read seems to walk straight past it: evidence that the process was unreliable in general versus evidence that it was unreliable in a particular direction — those seem to license quite different things, and I keep seeing them treated as one. Also handle the case where the analyst can name the bias but can't undo it; knowing you're anchoring doesn't un-anchor you, and "just correct for it" is what I keep saying and I don't think it's honest.

  Then run the procedure on three cases and show your working: (a) an analyst who says her estimate is contaminated because she saw a colleague's figure before she started; (b) an analyst who's confident and has no complaints about his own process, and whose process I happen to know is badly calibrated; (c) an analyst who's the only person in the building who understands the domain, so there's no disagreement to appeal to and the "check with a peer" step has nothing to bite on. I want at least one of those to come out in a way I wont like. Finish with a short section on what the procedure can't settle, where I'm just making a management call dressed up as epistemology, and what to do on the days when my worry about her process is itself the sort of thing I should be suspicious of. Don't give me a reading list, I'll find the literature myself if I want it — I need something I can use on Tuesday, and I'm not a philosopher, just the person who has to sign the thing off.
reasoning: |-
  Hmm, the user runs an analysis team at a charity where they produce crucial cost-effectiveness estimates. They have a convention where analysts include their own trust level in the process, but this has become messy. Analysts frequently express doubts about their own numbers for various reasons—rushed work, pre-existing biases, disagreements with respected peers, or awareness of systemic biases. The user calls this "epistemic akrasia" where someone believes a number is right but also feels they shouldn't trust it.

  The user needs a practical decision procedure for handling these situations in 20-minute conversations. They want clear steps: questions to ask, criteria for keeping or binning the estimate, and when to escalate. Key distinctions include general unreliability versus directional bias, and handling biases that can't be easily corrected. They also want the procedure applied to three specific cases, with one outcome they won't like, and a section on limitations where management judgment is needed.

  Breaking down the requirements:
  - **Decision Procedure**: Needs to be step-by-step, actionable in 20 minutes.
  - **Key Distinction**: General unreliability (e.g., rushed work) vs. directional bias (e.g., anchoring toward a pre-existing belief). The user feels literature overlooks this.
  - **Handling Uncorrectable Biases**: Acknowledges that knowing a bias exists doesn't fix it; "just correct" isn't sufficient.
  - **Three Cases**:
    - (a) Analyst contaminated by seeing a colleague's figure.
    - (b) Confident analyst with a badly calibrated process (known to manager).
    - (c) Sole domain expert with no peers for checks.
  - **Unpleasant Outcome**: One case should end in a way the user dislikes, to test realism.
  - **Limitations Section**: Clarify where epistemology ends and management judgment begins, including self-doubt about the manager's own suspicions.

  I'll structure the response with a clear decision procedure first. The procedure should have steps with specific questions, decision points, and outcomes. Then apply it to the three cases, showing the reasoning. For the unpleasant outcome, case (b) is a good candidate because the analyst is confident, but the manager knows the process is bad—forcing a tough call to bin the estimate despite no analyst doubt. Finally, outline limitations, emphasizing areas where risks must be managed, not just evidence weighed.

  The user is time-pressed and practical, so avoid theory; focus on utility. For the directional vs. general unreliability distinction: directional biases might allow adjustments (e.g., shifting the range), while general unreliability may require restarting. For uncorrectable biases, the procedure should force transparency rather than false corrections.

  In the cases:
  - **Case (a)**: Seeing a colleague's figure likely causes directional bias (anchoring). Outcome might be to adjust the range but keep the estimate, with heavy caveats.
  - **Case (b)**: Analyst is confident, but manager knows the process is flawed (general unreliability). This should end with binning the estimate—user won't like overriding a confident analyst.
  - **Case (c)**: No peers, so the procedure might escalate to manager for a risk-based call, as epistemology can't resolve it alone.

  Limitations section will cover: when evidence is inconclusive, the role of organizational risk tolerance, and handling the manager's own doubts (e.g., if their suspicion is itself biased).

  This approach balances rigor with practicality, giving the user a tool for Tuesday meetings while acknowledging real-world messiness.
answer: |-
  Below is a practical decision procedure for handling analyst doubts about their own estimates, designed for a 20-minute conversation. It focuses on actionable steps, distinguishes between **general unreliability** (the process is shaky overall) and **directional bias** (the process likely skews high/low), and forces a clear outcome: keep, bin, or escalate. It accepts that some biases can't be "corrected"—only flagged or mitigated. The procedure has five steps, with strict timeboxes to fit your window. 

  ### Decision Procedure: The 5-Step Trust Audit
  **Time allocation:** 3–4 minutes per step (total 15–20 min).  
  **Goal:** Determine if the estimate is usable as-is, requires restarting, or needs a management judgment call on risk.  
  **Inputs:** The analyst’s self-reported doubt, the estimate (point + range), and context about how the estimate was produced.  
  **Outputs:** "Keep," "Bin," or "Escalate to Manager" (with reasons).  

  1. **Pinpoint the Doubt (3 min)**  
     - **Question:** "What *exactly* makes you distrust the process? Name the root cause—e.g., time pressure, external influence, personal bias, method flaw."  
     - **Sufficient Answer:** A specific, concrete reason (e.g., "I was rushed and skipped sensitivity analysis," or "I saw Sarah’s number first and it anchored me"). Vague answers (e.g., "It feels off") are insufficient—dig once for specifics.  
     - **Decision Point:**  
       - If the analyst can’t articulate a reason → **Keep** (no actionable doubt).  
       - If reason is given → Proceed to Step 2.  

  2. **Classify the Issue: Directional or General? (3 min)**  
     - **Question:** "Does this issue make the estimate *unreliable overall* (e.g., rushed work = garbage in/garbage out), or does it *push the number in a known direction* (e.g., anchoring likely made you overestimate)?"  
     - **Sufficient Answer:** Clear categorization:  
       - **Directional:** Bias with a likely skew (e.g., "Seeing Sarah’s number probably made me overestimate by 10–20%").  
       - **General:** Holistic unreliability (e.g., "I had no time to validate data sources—the whole thing could be nonsense").  
       - **Uncertain:** "I don’t know" or "Both" → Treat as general unreliability (default conservative).  
     - **Decision Point:**  
       - If directional → Proceed to Step 3.  
       - If general → Skip to Step 4.  

  3. **Assess Correctability (Directional Issues Only) (4 min)**  
     - **Question:** "Can you *quantify the skew* or *adjust the estimate* to remove the bias? If not, can you bound it (e.g., ‘I’m at least 80% sure the true value is within X–Y’)? Be honest—no forced corrections."  
     - **Sufficient Answer:**  
       - **Adjustable:** A revised point/range with a clear method (e.g., "I re-ran it blind and got 15% lower").  
       - **Boundable:** A defensible, wider range capturing the skew (e.g., "Original range was 50–70K; with anchoring, I’ll expand to 45–80K").  
       - **Uncorrectable:** "I can’t fix it or put bounds on it" (e.g., "I know I’m anchored but have no idea by how much").  
     - **Decision Point:**  
       - If adjustable/boundable → Revise estimate, then **Keep**.  
       - If uncorrectable → Proceed to Step 4 (treat as general unreliability).  

  4. **Check for Salvageability (General Unreliability Only) (4 min)**  
     - **Question:** "Is there a *quick fix* (<2 hours) to verify key steps? Examples: spot-check a data source, run a sanity check against a peer’s model, or redo the worst 20% of the analysis."  
     - **Sufficient Answer:**  
       - **Salvageable:** A concrete, fast verification step with a binary outcome (e.g., "If the mortality data source is clean, the estimate holds; else, it’s trash").  
       - **Unsalvageable:** No feasible quick fix (e.g., "The whole model needs rebuilding").  
     - **Decision Point:**  
       - If salvageable → Analyst performs the check immediately; if it passes → **Keep** (with caveats); if it fails → **Bin**.  
       - If unsalvageable → **Bin**.  

  5. **Escalate or Accept (3 min)**  
     - **Trigger:** Only if Steps 1–4 yield uncertainty (e.g., salvageability check is ambiguous) or external constraints dominate (e.g., no time to restart).  
     - **Question:** "What’s the *real-world cost of being wrong*? If the estimate is false, what’s the max damage (money/lives/reputation)?"  
     - **Sufficient Answer:** A risk assessment: "Low" (e.g., <£50K loss, testable next quarter), "Medium" (e.g., £50–200K, recoverable), or "High" (e.g., >£200K or irreversible harm).  
     - **Decision Point:**  
       - Low risk → **Keep** (with documented doubts).  
       - Medium/High risk → **Escalate to Manager** for a go/no-go call based on organizational risk tolerance.  

  ### Key Principles
  - **No False Corrections:** If a bias can’t be quantified or bounded (Step 3), don’t pretend to "adjust"—bin or escalate.  
  - **Distinguish Directional vs. General:** Directional issues get adjustment attempts; general issues get salvageability checks. This avoids treating "rushed work" (general) like "anchoring" (directional).  
  - **Timebox Relentlessly:** If a step overflows, default to "Bin" (process integrity > speed).  
  - **Document Everything:** Analyst summarizes the outcome in one line (e.g., "Keep: widened range for anchoring per Trust Audit").  

  ---

  ### Procedure Applied to Your Cases  
  **Case (a): Analyst contaminated by seeing a colleague’s figure**  
  - **Step 1:** Doubt pinpointed: "I saw Sarah’s estimate before starting, and it probably anchored me." → Proceed.  
  - **Step 2:** Classified as **directional** (likely skew: over/underestimate).  
  - **Step 3:** Correctability: Analyst says, "I tried re-running blind but still imagine her number." Can’t quantify skew → **Uncorrectable**. Treat as general unreliability → Proceed to Step 4.  
  - **Step 4:** Salvageability: Quick fix? "I could compare my raw data inputs to Sarah’s—if they differ, my model is independent." → **Salvageable**. Check shows inputs are 90% similar. → **Keep** (with caveat: "Possible anchoring, input check passed").  
  - **Outcome:** Estimate kept, but range expanded by 15% in the trust line.  

  **Case (b): Confident analyst with a badly calibrated process (known to you)**  
  - **Step 1:** Analyst expresses **no doubt**. → **Keep** (per Step 1).  
  - **Procedure Stops:** Your knowledge of bad calibration is manager context, not analyst self-doubt. The process trusts the analyst’s self-assessment here.  
  - **Outcome:** Estimate goes out. **You won’t like this**—it exposes the charity to risk—but the procedure respects analyst autonomy. (This forces you to address calibration systemically, e.g., via training or peer review, not ad hoc.)  

  **Case (c): Sole domain expert, no peers for checks**  
  - **Step 1:** Doubt pinpointed: "I read that experts in this field overestimate impact by 20–40%." → Proceed.  
  - **Step 2:** Classified as **directional** (likely overestimate).  
  - **Step 3:** Correctability: "I can’t quantify it—no one else here can pressure-test me." → **Uncorrectable**. → Proceed to Step 4 as general unreliability.  
  - **Step 4:** Salvageability: Quick fix? "I could benchmark against a similar past project." Check shows past data is outdated → **Unsalvageable**. → **Bin**.  
  - **Step 5 (if invoked):** Not reached—binned at Step 4. If time pressure forced escalation: Risk is "High" (irreplaceable expertise) → **Escalate to Manager**. You decide to keep with a warning: "Sole expert; systemic overestimation risk."  
  - **Outcome:** Binned (or escalated if constraints demand).  

  ---

  ### What the Procedure Can’t Settle: Management Calls Dressed as Epistemology  
  The Trust Audit handles evidence-driven doubts but hits limits where epistemology ends and your role begins:  
  1. **When Escalation Happens (Step 5):** You’re deciding based on **organizational risk tolerance**, not truth. Example: In Case (c), if you keep a binned estimate because the project is time-sensitive, you’re accepting risk—not resolving doubt.  
  2. **Systemic Issues Beyond the Analyst:** E.g., chronic understaffing (causing rush) or a team-wide bias (like over-optimism). The audit flags these in Steps 2–4 but can’t fix them—you need process reforms.  
  3. **Your Own Doubts About the Analyst:** If you’re worried about an analyst’s process *but they aren’t*, the procedure ignores it (see Case b). This is intentional—micromanaging trust undermines the system. Instead:  
     - Track patterns (e.g., if an analyst hits "uncorrectable" often, retrain them).  
     - If your worry is itself biased (e.g., "I distrust Jane because she’s new"), **require evidence**: demand a peer review or calibration check next time. No evidence? Let the audit run as-is.  

  **For Tuesday:** Use the 5 steps verbatim. If an analyst says "I’m epistemically akratic," ask: "What step of the process failed?" (Step 1). The procedure forces concrete answers—no philosophy needed.  

  ---  
  This gives you a clear, defensible script. It won’t prevent all errors, but it makes distrust actionable. When it feels unfair (e.g., Case b), that’s the system working—it exposes where you need better guardrails, not better epistemology.
