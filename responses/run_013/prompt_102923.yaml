answer: |-
  Here is a specification of desiderata for a trustworthy theory of inductive simplicity ("Occam's Razor"), motivated by core challenges and constraints:

  ### Core Desiderata & Motivations

  1.  **Effective Guidance in Paradigmatic Cases (The "Why Simplicity?" Requirement):**
      *   **Motivation:** Must explain/reproduce clear intuitive judgments where simplicity resolves underdetermination. E.g., preferring a low-degree polynomial over a high-degree one fitting sparse data equally well; preferring a single cause for correlated events over coincidental independent causes; choosing the shortest consistent grammar for linguistic data.
      *   **Requirement:** The theory *must* assign lower complexity (and thus higher prior probability or preference) to intuitively simpler hypotheses in these core cases.

  2.  **Invariance Under Meaning-Preserving Redescription (The Language-Dependence Challenge):**
      *   **Motivation:** A hypothesis's complexity shouldn't depend arbitrarily on *how* it is described (e.g., using different logical bases, coordinate systems, programming languages). If `H` and `H'` are logically equivalent descriptions of the *same* hypothesis, their complexity should be equal.
      *   **Requirement:** The complexity measure must be invariant (or invariant up to an additive constant) under computationally efficient translations between equivalent descriptions within a broad class of universal description languages. *Crucially, the constant cannot depend on the specific hypothesis `H`; it must be bounded for the entire language translation scheme.* (This excludes naive syntactic length measures).

  3.  **Consistency with Bayesian Framework (The Prior Connection):**
      *   **Motivation:** Simplicity is widely understood to be captured (imperfectly) via the prior in Bayesian inference. A theory of simplicity should provide a principled foundation for choosing priors, especially in underdetermined settings.
      *   **Requirement:** The simplicity measure must be formally relatable to a prior probability distribution over hypotheses such that simpler hypotheses receive higher prior probability. The mapping (complexity -> prior) must be monotonically decreasing (e.g., `P(H) ∝ 2^{-C(H)}` for complexity `C(H)`).

  4.  **Generalization Beyond Finite Strings (The Infinity Problem):**
      *   **Motivation:** Scientific hypotheses are often parameterized by real numbers or involve infinite structures (e.g., "constant force," "linear relationship," "Gaussian process"). Standard complexity (Kolmogorov) is defined for finite strings.
      *   **Requirement:** The theory must provide a rigorous and generalizable definition of complexity for hypotheses within continuous or otherwise infinite hypothesis spaces (e.g., via complexity of prediction codes, minimal description lengths for models plus parameters, or resource-bounded Kolmogorov complexity for real-valued functions).

  5.  **Computability Bounds (The Feasibility Constraint):**
      *   **Motivation:** Idealized simplicity measures (like uncomputable Kolmogorov complexity) are epistemologically significant but unusable by bounded agents. A theory must address what *can* be implemented.
      *   **Requirement:** The theory must either:
          *   (a) Provide a computable *approximation* to the ideal measure, with quantifiable guarantees on its performance relative to the ideal, OR
          *   (b) Explicitly define a complexity measure that is itself computable (even if inefficient), OR
          *   (c) Formally characterize the trade-offs between computational resources and achievable simplicity discrimination.

  6.  **Truth-Tracking Justification (The Epistemic Claim):**
      *   **Motivation:** Is simplicity merely a pragmatic tool for faster prediction/compression, or does preferring simpler hypotheses genuinely increase the likelihood of finding *true* theories about the world? Science treats it as the latter.
      *   **Requirement:** The theory *must* provide a justification for why simplicity should be epistemically relevant, linking it (even probabilistically) to truth or predictive accuracy in the actual world (e.g., via assumptions about algorithmic probability, nature's "computability," or the necessity of bias for learning). Purely pragmatic justifications (e.g., "it saves memory") are insufficient for a theory of *inductive inference* aimed at truth.

  ### Critical Tensions & Trade-offs

  *   **The Core Tension: Simplicity Bias vs. No Free Lunch (NFL):**
      *   **Conflict:** The NFL theorems show that no inductive method (including simplicity-preferring ones) can be universally optimal across all possible worlds. A simplicity bias *must* perform worse than some other bias in some worlds. This clashes with the desire for a universally "correct" simplicity measure.
      *   **Resolution Requirement (The Bias Justification):** The theory *must explicitly acknowledge and justify its inherent bias*. It cannot claim universality. Justification must appeal to plausible assumptions about the *actual* world (e.g., it is "algorithmically simple," "computable with limited resources," "non-adversarial") that make the specific simplicity bias effective. Desideratum 6 (Truth-Tracking) is paramount here.

  *   **Computability vs. Ideality:**
      *   **Conflict:** The most compelling theoretical measures (like Solomonoff induction) are uncomputable. Computable measures are necessarily approximations or restricted.
      *   **Resolution Requirement:** The theory must clearly state its computational limitations (Desideratum 5) and justify why its computable approximation/measure is sufficient for epistemically significant inference (linking back to Desideratum 6 and the bias justification).

  *   **Invariance vs. Implementability:**
      *   **Conflict:** Perfect invariance (Desideratum 2) often requires idealized, uncomputable measures. Computable approximations (like MDL with specific model classes) may exhibit residual language dependence.
      *   **Resolution Requirement:** The theory must minimize arbitrary language dependence *in practice* for scientifically relevant redescription classes. The residual dependence should be demonstrably small or irrelevant compared to the signal from data in typical inference scenarios.

  ### The Most Excluding Requirement

  **Desideratum 2: Invariance Under Meaning-Preserving Redescription (with the constant bounded per translation scheme, not per hypothesis) excludes the most otherwise attractive accounts.**

  *   **Why:** Many intuitive and practical approaches rely on fixed description languages (e.g., specific programming languages, polynomial bases, graphical model syntax). These **fail** the invariance requirement because the complexity of a hypothesis `H` can change dramatically (beyond a fixed constant) by translating it into a different, equally valid language where its "natural" description is longer. Naive syntactic length is highly language-dependent. While computable approximations like MDL are valuable, they often inherit language dependence from their chosen model class/coding scheme, violating strict invariance. Only idealized, universal measures like Kolmogorov complexity (and its extensions) *satisfy* this requirement inherently, but they fall foul of Desiderata 4 (generalization) and 5 (computability). This requirement forces the theory to grapple with the fundamental subjectivity of "description" while demanding robustness against its most arbitrary effects. It exposes the deep tension between objectivity and the necessity of choosing a language. Accounts that ignore this requirement risk codifying arbitrary syntactic preferences rather than genuine semantic simplicity.
