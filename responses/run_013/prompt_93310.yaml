  We are comparing Hofstadter's superrationality and Tennenholtz's program equilibrium as solutions to the one-shot Prisoner's Dilemma without repetition, enforcement, or binding commitments.

  **Prisoner's Dilemma Setup:**
  - Players: 1 and 2
  - Actions: Cooperate (C) or Defect (D)
  - Payoffs (for player i):
    - If both cooperate: R (Reward) for each.
    - If one defects and the other cooperates: T (Temptation) for the defector, S (Sucker) for the cooperator.
    - If both defect: P (Punishment) for each.
  - Standard conditions: T > R > P > S and 2R > T+S (so mutual cooperation is socially optimal and not dominated by alternating).

  In the one-shot game, defection is strictly dominant: regardless of what the other does, defecting gives a higher payoff. Hence, (D, D) is the unique Nash equilibrium, but it is Pareto inferior to (C, C).

  **Hofstadter's Superrationality:**
  - Hofstadter (in "Metamagical Themas") suggests that in symmetric games, players should reason that they are identical to their opponent in all relevant respects (including reasoning). Therefore, they must make the same decision. The player then chooses the action that, if both players choose it, yields the best outcome. 
  - Formally: the superrational player reasons: "Since we are identical, we will both choose the same action. So I have two options: both cooperate (yielding R) or both defect (yielding P). Since R > P, I should cooperate."
  - This leads to mutual cooperation.

  **Program Equilibrium (Tennenholtz):**
  - Players submit programs (or algorithms) that will choose an action. These programs are run against each other and can read the opponent's source code. 
  - The idea is to consider a Nash equilibrium in the game where the strategies are programs. 
  - A classic program is: "If the opponent's program is identical to mine, then cooperate; else, defect." 
  - When two such identical programs meet, they both cooperate. Moreover, if a player deviates to a different program, then the other program (which is still the original one) will defect (because it is no longer identical), so the deviator gets a lower payoff (since the original program defects). Hence, mutual cooperation is an equilibrium.

  Now, we address the questions:

  **1. Does program equilibrium formalize superrationality, generalize it, or quietly replace it with a different idea?**

  Program equilibrium generalizes superrationality. 

  - Superrationality relies on the idea that the players are "the same" and therefore will make the same decision. Program equilibrium uses the sameness of the source code. However, program equilibrium allows for more than just identical programs. For example, two different programs that are functionally equivalent (e.g., same behavior in all circumstances) might also cooperate. Also, programs can condition on the opponent's code arbitrarily, not just on strict identity.

  - What the informal notion of "the same reasoning" does that "same source code" does not: 
    - "Same reasoning" is a psychological or cognitive concept. It implies that the players are using the same thought process, which leads to the same conclusion. This is a higher-level abstraction. The source code approach is more concrete and computational. 
    - However, the source code approach does not require that the players are identical in their internal reasoning in the abstract sense, but only that they are running the same algorithm. This is a formalization of sameness, but it is more specific. 

  - Program equilibrium replaces the vague notion of "same reasoning" with a precise, verifiable criterion (source code identity). It also allows for more complex interactions: programs can have conditionals that depend on the opponent's code in arbitrary ways, not just strict identity. For example, a program might cooperate if the opponent's program is a permutation of its own code, or if it is functionally equivalent. 

  - Verdict: Program equilibrium formalizes and generalizes superrationality. It formalizes by making "sameness" precise (source code), and generalizes by allowing a broader class of strategies (any program that can condition on the opponent's code).

  **2. The commitment worry: does program equilibrium earn its result honestly within a one-shot game?**

  - In program equilibrium, players choose a program in advance. The program is then run without further intervention. This means that the choice of program is made before the game and is binding. 

  - However, the one-shot game does not allow precommitment. The problem is that in the one-shot Prisoner's Dilemma, players are supposed to choose actions without any prior coordination. Program equilibrium changes the game: it becomes a game of choosing programs that then choose actions. This is a meta-game. 

  - The worry: by requiring a precommitment to a program, program equilibrium effectively introduces a binding commitment device (the program) that is not available in the original one-shot game. Therefore, it might be seen as changing the rules. 

  - Can the same charge be leveled at superrationality? 
    - Superrationality does not require precommitment. It is a mode of reasoning that a player uses at the moment of decision. The player reasons: "I am the same as my opponent, so we will do the same thing, and then I choose the best common action." There is no precommitment in this reasoning. 
    - However, one might argue that superrationality requires a kind of commitment to the reasoning process. But it is a commitment that is internal and simultaneous. 

  - Verdict: Program equilibrium does rely on precommitment (submitting the program) and thus may not be a solution to the one-shot game as originally posed (without any precommitment). Superrationality, by contrast, does not require precommitment and is a way to reason at the time of the game. Therefore, the charge of smuggling in precommitment applies to program equilibrium but not to superrationality.

  **3. Symmetry and sameness: variant with non-identical players.**

  Consider a variant of the Prisoner's Dilemma where the players are not identical. Specifically:
  - Player 1 has the standard Prisoner's Dilemma payoffs (T1, R1, P1, S1) satisfying T1>R1>P1>S1 and 2R1>T1+S1.
  - Player 2 has payoffs that are slightly different: T2, R2, P2, S2, but still satisfying the Prisoner's Dilemma inequalities. However, R1 ≠ R2? Actually, the payoffs can be different but still satisfy the structure. Alternatively, we could make one player have a different reasoning procedure.

  Alternatively, consider:
  - Both players are rational and have the same payoffs, but they use different reasoning methods. For example, player 1 uses superrational reasoning, and player 2 is a standard game-theoretic rational player (who will defect). 

  Or, for program equilibrium:
  - Suppose player 1 submits a program that can read player 2's code, but player 2's program cannot read player 1's code (asymmetric access).

  **What superrationality says:**
  - Superrationality requires symmetry. If the players are not identical (in reasoning and payoffs), then the premise that they will choose the same action breaks down. 
  - In the asymmetric case, a superrational player (say, player 1) might reason: "I am superrational, but if I suspect that player 2 is not, then I cannot assume we will do the same thing." Then, the superrational player would have to defect? Because if player 2 is a defector, then cooperating would lead to the sucker payoff. 
  - Hence, superrationality only leads to cooperation if both players are superrational and they know that about each other. In asymmetric situations, it fails.

  **What program equilibrium says:**
  - In program equilibrium, we consider programs that can condition arbitrarily on the opponent's code. 
  - In the asymmetric variant where player 1's program can read player 2's code but not conversely, we can have an equilibrium where:
    - Player 1 submits a program that: "if player 2's program is of a certain kind (say, one that cooperates with me) then cooperate, else defect."
    - Player 2, who cannot read player 1's code, might submit a program that always defects. Then, player 1's program would defect (because player 2's program is not the cooperative kind), so both defect. 
  - Alternatively, we can imagine an equilibrium where both players submit programs that cooperate if the opponent's program is in a set of "approved" programs (which might not require symmetry). For example, they might both submit a program that cooperates if the opponent's program is one that cooperates with this program, and defects otherwise. This is the "cooperate with copies" idea. 
  - But without symmetry, it might be harder to sustain cooperation. However, program equilibrium can still work if the programs are designed to cooperate with each other even if they are not identical. For instance, program A might be: "if the opponent's program is program B, then cooperate; else defect." And program B: "if the opponent's program is program A, then cooperate; else defect." Then, when A meets B, they cooperate. This does not require that A and B are the same code, only that they are compatible. 

  - Verdict: Program equilibrium is more robust because it can handle asymmetric situations by allowing programs to condition on the opponent's code in flexible ways, including mutual recognition without identity. Superrationality is fragile and relies on strict symmetry.

  **4. Folk theorem analogy and whether the dilemma is dissolved or re-described.**

  - Program equilibrium can indeed sustain any feasible and individually rational payoff in a one-shot game (under appropriate conditions). This is because players can write programs that condition on the opponent's program arbitrarily. For example, to achieve a payoff profile (x,y), we can have:
    - Program for player 1: "if the opponent's program is the one that I expect (which is designed to give (x,y)), then play the action that leads to (x,y); else, play a punishment strategy (minimax the opponent)."
    - Similarly for player 2. 
  - This is analogous to the folk theorem in repeated games, which says that any feasible and individually rational payoff can be sustained as an equilibrium.

  - What this tells us: 
    - Program equilibrium does not really solve the one-shot Prisoner's Dilemma in its original form. Instead, it changes the game into a meta-game (choosing programs) that resembles a repeated game. The programs are effectively encoding a strategy for a repeated interaction, but here the "repetition" is in the code inspection: by reading the opponent's code, the program can anticipate the opponent's behavior and condition on it. 
    - Thus, program equilibrium re-describes the one-shot game as a game of program choice, which has the structure of a repeated game (with the ability to punish deviations). 

  - Is superrationality vulnerable to an analogous objection?
    - Superrationality does not allow for arbitrary payoffs. It only leads to mutual cooperation in symmetric games. Therefore, it does not have the same flexibility as program equilibrium. 
    - However, the objection to superrationality is different: it only works under very specific symmetry assumptions. It does not resemble the folk theorem because it only produces mutual cooperation. 

  - Verdict: Program equilibrium does not dissolve the one-shot dilemma but rather embeds it in a larger game (with precommitment and mutual inspection) that can sustain cooperation. This larger game is similar in spirit to repeated games. Superrationality, on the other hand, is an attempt to directly resolve the one-shot game by a different reasoning method, but it is limited to symmetric cases and mutual cooperation.

  **Final Verdict:**

  - **Which is the better account?** 
    Program equilibrium is a more powerful and flexible framework. It can handle a wider range of situations and can sustain more outcomes. However, it does so by changing the game. Superrationality is a more direct and intuitive reasoning method for symmetric one-shot dilemmas, but it is less robust.

  - **What each illuminates:**
    - Superrationality highlights the role of symmetry and the idea that rational agents might coordinate on a mutually beneficial outcome by recognizing their similarity. It challenges the standard notion of dominance by introducing a higher level of reasoning.
    - Program equilibrium shows how precommitment (via programs) and mutual inspection can create a setting where cooperation is enforced. It formalizes the idea of conditional strategies in a one-shot setting and connects to the broader theme of how agents can use mutual predictability to achieve coordination.

  - **The one-shot Prisoner's Dilemma: is it a problem about what to choose or what to be?**
    - The dilemma arises because defection is the dominant action. Both approaches try to change the way the decision is made. Superrationality changes the reasoning: you are to choose as if your choice determines the other's. Program equilibrium changes the object: you are choosing a program that will choose for you, and the program can condition on the opponent. 
