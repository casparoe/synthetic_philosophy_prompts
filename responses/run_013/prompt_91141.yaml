prompt: |-
  I'm a second-year student taking a metaphysics module, and we've just finished a unit on Leibniz and individuation. Our tutorial reading was a reference-encyclopedia entry on identity, and before I lean on it in an essay I want to check its treatment of the identity of indiscernibles, because parts of it sit badly with what I thought I understood from lecture. The entry's summary runs roughly as follows.

  "Leibniz's Law states that if two things are identical then they have exactly the same properties, and conversely that if two things have exactly the same properties then they are identical. The second claim — that there cannot be two things differing only numerically — is the principle of the identity of indiscernibles, and it is simply the contrapositive of the first, so anyone who grants the first has already granted the second. The principle is a strong one: it tells us that no two objects can be exact duplicates, since duplicates would share every property. In the twentieth century, however, the principle was shown to be false by a now-famous thought experiment. Imagine a universe containing nothing but two iron spheres, identical in size, shape, colour, temperature, and material composition, one at each end of an otherwise empty space. They share every property, yet there are plainly two of them rather than one. So no collection of properties can ever distinguish two objects; only their bare numerical distinctness can. This is why most contemporary metaphysicians regard 'being this very thing' as an irreducible feature of an object, something no description could ever capture."

  I'd like an accuracy audit rather than a verdict. Please go through the passage sentence by sentence and separate what a competent metaphysician would accept, what is a standard simplification that a specialist would wince at, and what is outright mistaken — including any places where a term is being used in a looser sense than the principle requires. My own suspicion is that the remark about contraposition cannot be right, since we spent most of a lecture on how the two directions of Leibniz's Law come apart, but I couldn't reconstruct the difference under exam conditions, and I have no independent sense of how much weight the two-spheres case actually carries or what a defender of the principle would say in reply. I'd also like to know whether the closing claims — that properties can never distinguish objects, and that this is why a bare "thisness" must be treated as primitive — follow from anything the entry has actually established, or whether they are a further and more contentious commitment smuggled in at the end. Finally, if the summary does misstate the principle, I'd appreciate a corrected statement of what exactly the principle says and what it does not say, at a level of precision I could reproduce in an essay.
