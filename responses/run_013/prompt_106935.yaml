prompt: |-
  I'm a phil prof and I'm putting together a grad seminar on teleosemantics and the project of naturalizing mental content, and I want to start the unit with the specification rather than the menu of theories. So before we read any Dretske or Millikan or Fodor or the interpretationists, give me the desiderata: what does any adequate naturalistic theory of intentional content actually have to deliver? I want the full requirements list -- the cases it has to get right, the distinctions it can't collapse, the constraints from biology/evolution/cognitive science it can't contradict -- with the case or consideration behind each requirement, and your call on which requirements are non-negotiable and which are just preferences of one camp. I want to seperate the non-negotiables from camp preferences, and the interesting part for me is whether some subset of these requirements is jointly unsatisfiable; if so, say which subset and why, because then the list itself is a result and not just a checklist.

  Please build it around the odd cases I keep using in lecture, since the usual frog-and-fly stuff gets memorized and repeated: (1) a bacterium that swims up a nutrient gradient with a single sensor, where the same internal state also controls tumbling; (2) a moth whose ultrasound-detector state was selected for bat avoidance but now also triggers courtship, so causal-informational and teleological accounts pull apart; (3) a host bird whose egg-recognition state is tuned to a pattern shared by its own eggs and a brood parasite's eggs, and which sometimes accepts the parasite egg; (4) two neural nets with identical weights and identical outputs, one trained on edges and one on shadows, so only history differs; (5) a molecule-for-molecule duplicate of you assembled by a cosmic accident with no selection history at all; and (6) a thermostat, which I use as the floor case to ask whether we're even talking about content or just control. For each desideratum, tell me what it rules out, and at the end name the one requirement that does the most exclusionary work -- the one that knocks out the most candidate theories. Don't bother with a full scorecard of the contenders, I'll do that in seminar; but if a family dies immediately on your list, a one-line note is fine.

  Then format: a table is fine, columns for requirement, motivating case, non-negotiable vs camp preference, what it excludes. End with a single line in the form \answer{...} containing just the name of that most exclusionary requirement. Keep it in the weeds but don't assume I've memorized the literature; I want the arguement, not a bibliography.
reasoning: |-
  We are building a list of desiderata for a naturalistic theory of intentional content. The goal is to specify what any adequate theory must deliver, using the provided cases. We will separate non-negotiable requirements from camp preferences, and for each, note what it rules out. Then we will identify the requirement that does the most exclusionary work.

  The cases provided are:

  1. **Bacterium**: A bacterium that swims up a nutrient gradient with a single sensor. The same internal state also controls tumbling. This raises issues about the simplicity of the system and the co-opting of a single state for multiple functions.

  2. **Moth**: A moth whose ultrasound-detector state was selected for bat avoidance but now also triggers courtship. Here, causal-informational (about ultrasound) and teleological (for bat avoidance) accounts pull apart.

  3. **Host bird**: A bird whose egg-recognition state is tuned to a pattern shared by its own eggs and a brood parasite's eggs, and which sometimes accepts the parasite egg. This case involves misrepresentation and the tuning of a detection mechanism.

  4. **Neural nets**: Two neural nets with identical weights and outputs, one trained on edges and one on shadows, so only history differs. This challenges theories that rely solely on current structure or disposition.

  5. **Cosmic accident duplicate**: A molecule-for-molecule duplicate of you assembled by cosmic accident with no selection history. This tests the necessity of evolutionary history for content.

  6. **Thermostat**: As the floor case, to question whether we are talking about content or just control.

  We now list the desiderata, each with:
  - Requirement: what the theory must deliver.
  - Motivating case: which case (or cases) illustrate the requirement.
  - Non-negotiable vs camp preference: whether the requirement is essential for any naturalistic theory or is a preference of a particular camp.
  - What it excludes: what kind of theories or approaches are ruled out by this requirement.

  After listing, we will identify the requirement that excludes the most candidate theories.

  ---

  **Desideratum 1: Non-Derived Content (Original Intentionality)**

  - **Requirement**: The theory must account for non-derived (original) intentionality, as opposed to derived intentionality (like that of words or symbols, which depend on users). The thermostat might have derived content if we assign it, but we want content that is intrinsic to biological systems.

  - **Motivating case**: The thermostat (case 6) is often considered to have only derived content (if any). But the bacterium (case 1) and the moth (case 2) are supposed to have non-derived content. Also, the cosmic accident duplicate (case 5) must either have the same content as us or not, which tests whether content is intrinsic.

  - **Non-negotiable**: Non-negotiable for a theory of mental content. If the theory cannot account for non-derived content, then it fails to naturalize mental content.

  - **What it excludes**: Theories that only account for derived content (e.g., some interpretivist or pragmatist approaches that make content dependent on interpretation). Also, it may challenge some versions of functional role semantics that don't ground content in a naturalistic base.

  **Desideratum 2: Misrepresentation**

  - **Requirement**: The theory must allow for the possibility of misrepresentation. That is, a state can have a content that is false or inaccurate.

  - **Motivating case**: The host bird (case 3) sometimes accepts the brood parasite egg, which is a case of misrepresentation because the bird's egg-recognition state is triggered by the parasite egg, which is not its own. Also, the moth (case 2) might misrepresent a mating signal as a bat.

  - **Non-negotiable**: Non-negotiable. Without misrepresentation, we don't have genuine intentionality.

  - **What it excludes**: Theories that cannot account for error. For example, simple causal-informational theories (like some versions of Fodor's early causal theory) that tie content to whatever causes the state can fall into the disjunction problem: if the parasite egg causes the state, then the state represents both own eggs and parasite eggs (no misrepresentation). Also, some purely dispositional theories might struggle.

  **Desideratum 3: Historical Sensitivity**

  - **Requirement**: The content of a state must depend (at least in part) on the history of the system, not just its current structure or dispositions.

  - **Motivating case**: The neural nets (case 4) are identical in current structure and output, but one was trained on edges and the other on shadows. Intuitively, they have different contents. Also, the cosmic accident duplicate (case 5) has no evolutionary history, so if content requires history, it might not have content.

  - **Non-negotiable**: Camp preference. Teleosemanticists (like Millikan) will insist on history being essential, while others (like Fodor in some writings) might think current structure and dispositions suffice. However, the neural net case suggests that history matters for content.

  - **What it excludes**: Theories that are purely synchronic (based only on current state and dispositions) are excluded if history is required. This includes some versions of functional role semantics and causal-informational theories that do not incorporate history.

  **Desideratum 4: Natural Function and Selection History**

  - **Requirement**: The content of a state must be tied to the natural function of that state, which is determined by its selection history.

  - **Motivating case**: The moth (case 2) has a state that was selected for bat avoidance, but now it triggers courtship. The teleological account says the content is about bats (because of selection), even though it now causally co-varies with both bats and courtship signals. The bacterium (case 1) has a state that controls both swimming and tumbling, but its function is to move toward nutrients.

  - **Non-negotiable**: Camp preference. This is a core commitment of teleosemantics (Millikan, Papineau). But other camps (e.g., Fodor) reject the need for selection history.

  - **What it excludes**: Theories that do not require selection history for content. For example, purely causal-informational theories or conceptual role semantics. Also, the requirement excludes theories that assign content based solely on current causal relations.

  **Desideratum 5: Compositionality and Productivity**

  - **Requirement**: The theory must account for the compositionality of mental representations (the content of a complex representation depends on the content of its parts and their structure) and productivity (the ability to form an unbounded number of representations).

  - **Motivating case**: This is a general requirement from human cognition, but it's not directly addressed by the provided cases. The cases given are mostly subpersonal and simple. However, for a full theory of mental content, it must scale to human thought.

  - **Non-negotiable**: Non-negotiable for a theory that aims to cover human thought. But for the simple cases, it might be less critical.

  - **What it excludes**: Theories that cannot account for complex representations. For example, atomistic teleosemantics might struggle with compositionality. This is a challenge for teleosemantics, which often focuses on simple representations.

  **Desideratum 6: Causal-Informational Sensitivity**

  - **Requirement**: The content of a state must be appropriately causally connected to what it represents. That is, there must be a reliable causal-informational link.

  - **Motivating case**: The bacterium (case 1) has a sensor that causally covaries with nutrient concentration. The moth (case 2) has a state that causally covaries with ultrasound. But in the moth, the teleological account overrides the causal link to courtship signals for content.

  - **Non-negotiable**: Non-negotiable. Without a causal link, the state isn't about anything in the world.

  - **What it excludes**: Theories that completely sever the link between representation and its object (like some extreme versions of interpretivism). Also, it challenges theories that assign content without any causal connection.

  **Desideratum 7: Distinction between Coincidental and Contentful Causation**

  - **Requirement**: The theory must distinguish between states that are merely caused by something and states that represent that thing. Not every cause of a state is represented by that state.

  - **Motivating case**: The bacterium (case 1) has an internal state that is caused by nutrients and also controls tumbling. But we don't want to say that the state represents tumbling. The state represents nutrient concentration and then causes swimming or tumbling. Also, in the moth (case 2), the ultrasound state is caused by bats and by courtship signals, but it represents bats (on the teleological view).

  - **Non-negotiable**: Non-negotiable. Without this, we get too many representations (e.g., the state represents tumbling, nutrients, etc.).

  - **What it excludes**: Simple causal-informational theories that equate content with whatever causes the state (the disjunction problem). Also, it challenges theories that don't have a way to select among causes.

  **Desideratum 8: Normativity of Content**

  - **Requirement**: The theory must account for the normativity of content: there is a norm for when the representation is correct or incorrect, and misrepresentation is a failure of the norm.

  - **Motivating case**: The host bird (case 3) has a norm: it should accept only its own eggs. Accepting the parasite egg is a failure. The moth (case 2) has a norm: the state should be triggered by bats and lead to avoidance. When triggered by a courtship signal and leading to courtship, it's a malfunction (if we take the teleological view).

  - **Non-negotiable**: Non-negotiable. Normativity is central to intentionality.

  - **What it excludes**: Theories that cannot ground norms in natural facts. For example, purely causal-informational theories without a normative component. Also, some versions of behaviorism or dispositionalism.

  **Desideratum 9: Multiple Realizability and Substrate Neutrality**

  - **Requirement**: Content must be multiply realizable; the same content can be carried by different physical substrates.

  - **Motivating case**: The neural nets (case 4) are one example: the same content (e.g., edge detection) could be implemented in different neural net architectures. Also, the cosmic accident duplicate (case 5) is physically identical but might have the same content if history doesn't matter.

  - **Non-negotiable**: Non-negotiable for a theory that aims to be compatible with cognitive science and the idea that minds can be realized in different media.

  - **What it excludes**: Theories that tie content too closely to specific physical properties, such as type-identity theories.

  **Desideratum 10: The Ability to Handle Simple and Complex Systems**

  - **Requirement**: The theory must work for both simple systems (like the bacterium and the thermostat) and complex systems (like humans).

  - **Motivating case**: The thermostat (case 6) is the floor, and we want to know if it has content. The bacterium (case 1) is a step up. Then we have the moth (2), bird (3), and human-level cases.

  - **Non-negotiable**: Non-negotiable. A theory of mental content must cover the full range.

  - **What it excludes**: Theories that only work for complex systems (e.g., those requiring language) or only for simple systems.

  ---

  Now, we must consider which of these are non-negotiable and which are camp preferences. Then, we look for a subset that might be jointly unsatisfiable.

  **Non-negotiables** (based on common ground in the literature):

  1. Non-Derived Content
  2. Misrepresentation
  5. Compositionality and Productivity (if we are to account for human thought)
  6. Causal-Informational Sensitivity
  7. Distinction between Coincidental and Contentful Causation
  8. Normativity of Content
  9. Multiple Realizability
  10. Handling Simple and Complex Systems

  **Camp preferences**:

  3. Historical Sensitivity (teleosemantics requires it, others do not)
  4. Natural Function and Selection History (teleosemantics requires it, others do not)

  Now, the cosmic accident duplicate (case 5) is critical. If we require historical sensitivity (desideratum 3) and natural function (desideratum 4), then the duplicate has no content. But if we reject these, then the duplicate has the same content as us. This is a major point of contention.

  The neural net case (4) also pushes for historical sensitivity.

  **Joint Unsatisfiability?**:

  Consider the following subset:

  - Non-Derived Content (1)
  - Misrepresentation (2)
  - Historical Sensitivity (3) [camp preference, but required by some]
  - Natural Function and Selection History (4) [camp preference, but required by some]
  - Causal-Informational Sensitivity (6)
  - Normativity of Content (8)

  But note: the camp preferences (3 and 4) are not non-negotiable for everyone.

  The most contentious issue is between historical and non-historical theories. But there is a deeper tension:

  **Tension**: The requirement for **Normativity of Content** (8) and **Misrepresentation** (2) seems to demand a natural grounding of norms. Teleosemantics uses selection history for this. But if we reject selection history, how do we ground norms? On the other hand, if we require selection history, then the cosmic accident duplicate (5) and the neural nets (4) (if we don't consider their training history as a kind of selection) might lack content.

  Moreover, the **Causal-Informational Sensitivity** (6) and the **Distinction between Coincidental and Contentful Causation** (7) are needed to avoid the disjunction problem, but without a normative element, it's hard to make that distinction.

  **The most exclusionary requirement**:

  Looking at the list, the requirement that knocks out the most candidate theories is **Normativity of Content (8)**. Why?

  - Without normativity, we cannot have misrepresentation (which is non-negotiable).
  - Simple causal theories fail because they lack normativity.
  - Some versions of functional role semantics might struggle to ground normativity in natural facts.
  - Interpretivist theories might ground normativity in interpretation, but that may not be naturalistic.

  Moreover, normativity is what forces the move beyond purely causal-informational accounts. It is the requirement that teleosemantics takes as central and uses selection history to fulfill. But if one rejects selection history, then one must find another naturalistic ground for normativity, which is very hard.

  Thus, the requirement for a naturalistic account of the normativity of content is the one that does the most exclusionary work.

  ---

  **Summary Table**:

  | Requirement | Motivating Case | Non-negotiable vs Camp Preference | What it Excludes |
  |-------------|----------------|-----------------------------------|-----------------|
  | Non-Derived Content | Thermostat (6), Bacterium (1), Cosmic duplicate (5) | Non-negotiable | Theories that only account for derived content (e.g., some interpretivist or pragmatist approaches) |
  | Misrepresentation | Host bird (3), Moth (2) | Non-negotiable | Theories that cannot account for error (e.g., simple causal-informational theories without a solution to the disjunction problem) |
  | Historical Sensitivity | Neural nets (4), Cosmic duplicate (5) | Camp preference (especially teleosemantics) | Purely synchronic theories (e.g., some functional role semantics, causal-informational theories without history) |
  | Natural Function and Selection History | Moth (2), Bacterium (1) | Camp preference (teleosemantics) | Theories that do not require selection history (e.g., Fodor's asymmetric dependency, conceptual role semantics) |
  | Compositionality and Productivity | Human cognition | Non-negotiable (for human thought) | Atomistic theories that cannot account for complex representations (e.g., some teleosemantic accounts) |
  | Causal-Informational Sensitivity | Bacterium (1), Moth (2) | Non-negotiable | Theories that sever the causal link (e.g., extreme interpretivism) |
  | Distinction between Coincidental and Contentful Causation | Bacterium (1), Moth (2) | Non-negotiable | Simple causal theories (disjunction problem) |
  | Normativity of Content | Host bird (3), Moth (2) | Non-negotiable | Theories that cannot ground norms (e.g., purely causal-informational, behaviorism) |
  | Multiple Realizability | Neural nets (4), Cosmic duplicate (5) | Non-negotiable | Type-identity theories |
  | Handling Simple and Complex Systems | Thermostat (6) to human | Non-negotiable | Theories that only work for one type of system |

  ---

  **The most exclusionary requirement**: Normativity of Content.

