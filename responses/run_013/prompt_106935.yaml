answer: |-
  Below is a structured table of desiderata for a naturalistic theory of intentional content, based on your specified cases and requirements. The desiderata are derived from core challenges in naturalizing mental content, using your examples to illustrate non-negotiable constraints versus camp preferences. For each, I note what it rules out and why. At the end, I identify the most exclusionary requirement and address joint unsatisfiability.

  ### Desiderata for a Naturalistic Theory of Intentional Content
  | Requirement | Motivating Case(s) | Non-Negotiable vs. Camp Preference | What It Excludes |
  |-------------|-------------------|-----------------------------------|-----------------|
  | **1. Non-derived (original) intentionality** | Thermostat (6): Must distinguish systems with merely derived content (e.g., artifacts) from those with intrinsic content (e.g., biological systems). Bacterium (1) and cosmic duplicate (5) test if content is observer-independent. | **Non-negotiable**: Essential for naturalizing *mental* content; without it, everything is interpretation-dependent. | Eliminates theories that reduce content to interpretative practices (e.g., Davidsonian interpretivism) or assign content to all causal systems (e.g., radical behaviorism). |
  | **2. Possibility of misrepresentation** | Host bird (3): Accepting a parasite egg must be an error, not just a different function. Moth (2): Courtship trigger when no bat is present should be a mistake, not a new content. | **Non-negotiable**: Misrepresentation is definitional for intentionality; no theory can avoid it without collapsing "aboutness." | Rules out simple causal-informational theories (e.g., early Fodor) that succumb to the disjunction problem (e.g., parasite eggs become part of the content). Also excludes dispositional theories that equate content with current responses. |
  | **3. Causal-informational sensitivity** | Bacterium (1): Internal state covaries with nutrient gradients. Moth (2): Ultrasound state reliably detects sound frequencies. | **Non-negotiable**: Content must be grounded in causal relations to the world; without covariation, content lacks objective anchors. | Excludes theories that divorce content from causation (e.g., some versions of social externalism or Cartesian internalism) or over-rely on norms without causal constraints (e.g., pure teleology sans covariance). |
  | **4. Normativity of content (correctness conditions)** | Host bird (3): State *should* represent only conspecific eggs; accepting parasite eggs violates a norm. Moth (2): Ultrasound state *should* trigger avoidance, not courtship, given selection history. | **Non-negotiable**: Norms define truth/accuracy conditions for representations; intentionality is inherently normative. | Knocks out theories that cannot ground norms naturalistically (e.g., causal-informational theories without teleology, or functionalism without history). This is the **most exclusionary requirement** (see analysis below). |
  | **5. Historical individuation** | Neural nets (4): Identical structures trained on edges vs. shadows must have different contents. Cosmic duplicate (5): Molecule-for-molecule duplicate with no history may lack content if history is essential. | **Camp preference**: Teleosemantics (Millikan) requires history; causal-informational theories (Fodor) often reject it. | Excludes purely synchronic theories (e.g., structuralist or computationalist approaches) that rely only on current state/dispositions. |
  | **6. Selection-based function** | Moth (2): Content is fixed by selection for bat-avoidance, not current causes like courtship. Bacterium (1): State functions to find nutrients, even if it also causes tumbling. | **Camp preference**: Core to teleosemantics (Millikan, Papineau); rejected by "causal role" theories. | Rules out ahistorical theories (e.g., Fodor’s asymmetric dependence) and theories that tie content only to current utility (e.g., instrumentalism). |
  | **7. Compositionality for complex systems** | (Implicit in human cognition; not directly in cases, but needed for generality.) | **Non-negotiable for human-level content**: Must scale to language and thought; simple cases (e.g., bacterium) may not require it. | Excludes atomistic teleosemantic accounts (e.g., Millikan on simple indicators) that cannot explain structured representations. |
  | **8. Multiple realizability** | Neural nets (4): Same content (e.g., edge detection) should be realizable in different substrates. Cosmic duplicate (5): Physical duplicate may share content if history doesn’t matter. | **Non-negotiable**: Required to align with cognitive science; content is substrate-neutral. | Eliminates type-identity theories that reduce content to specific physical properties. |
  | **9. Distinction between content and mere causal role** | Bacterium (1): State represents nutrient gradients, not tumbling (which it causes). Moth (2): State represents bats, not courtship (a coincidental cause). | **Non-negotiable**: Avoids "everything is representational" collapse; distinguishes content from effect. | Excludes theories that conflate causes and effects (e.g., crude causal theories) or reduce content to behavior (e.g., strict behaviorism). |
  | **10. Applicability to simple and complex systems** | Thermostat (6) as floor: Must explain why it lacks (or has limited) content vs. bacterium (1). Cosmic duplicate (5) tests generality. | **Non-negotiable**: Theory must cover all biological cognition without ad hoc boundaries. | Rules out theories that only work for complex systems (e.g., language-of-thought approaches) or only for simple ones (e.g., pure indicator semantics). |

  ### Joint Unsatisfiability and Key Tensions
  A subset of requirements appears **jointly unsatisfiable** in existing frameworks:  
  - **Normativity (4) + Selection-based function (6) + Historical individuation (5)**.  
    - **Why?** Normativity demands correctness conditions, which teleosemantics grounds in selection history (e.g., moth state *should* avoid bats). But this clashes with:  
      - **Causal-informational sensitivity (3)**: In the moth case, selection history (bat-avoidance) overrides current causal relations (courtship triggers), risking disconnect from actual covariation.  
      - **Cosmic duplicate (5)**: If normativity requires selection history, the duplicate lacks content, violating multiple realizability (8) and non-derived intentionality (1) intuitions.  
      - **Neural nets (4)**: Training history (edges vs. shadows) may not be "selection" in the evolutionary sense, creating ambiguity about what counts as "history."  
    - **Result**: Theories that require selection-based norms (teleosemantics) struggle with causal sensitivity and ahistorical duplicates, while theories rejecting history (e.g., Fodor) struggle to naturalize norms without it. This tension makes the normativity requirement especially destabilizing.

  ### Most Exclusionary Requirement
  **Normativity of content (4)** is the **most exclusionary requirement**. It does the most work in eliminating candidate theories because:  
  - It is non-negotiable (without norms, misrepresentation and correctness are inexplicable).  
  - It demands a naturalistic basis for norms, which immediately rules out:  
    - **Causal-informational theories** (e.g., Fodor’s early approaches) that lack norms to resolve disjunction problems.  
    - **Purely functional-role theories** that tie content to current dispositions but cannot ground "should" (e.g., host bird *should* reject parasite eggs).  
    - **Interpretivist/social theories** (e.g., Davidson) that make norms observer-dependent.  
  - Only teleosemantics fully embraces it (using selection history), but this then excludes theories that reject history (e.g., synchronic causal accounts). Thus, it forces a choice between teleological and non-teleological approaches, with no consensus solution.

  \answer{Normativity of content}
