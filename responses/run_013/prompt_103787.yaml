  ### Activity Design: Lakatos Research Programme Simulation

  #### **Setting & Materials**
  - **Setting**: A competitive grant funding environment where teams defend scientific theories about "Quantum Particle Behavior" (a fictional domain). Observations are integer readings from a particle detector (e.g., "Particle Flux: 5").
  - **Materials**: 
    - Whiteboard or shared screen to display observations and team scores.
    - Three posters labeled with team names and core tenets.
    - Index cards for teams to write predictions.
    - Score tracker (starting points: 10 per team).
    - Observation sequence (hidden rule: **Particle flux = round number × (round number - 1) + 1** → `[1, 3, 7, 13, 21]`).

  #### **Roles**
  - **Three Teams (4-5 people each)**: Each defends a research programme:
    - **Team A (Wave Theory)**  
      Hard Core: "Particles behave like waves (continuous fields)."  
      Protective Belt: Can adjust amplitude equations or boundary conditions.
    - **Team B (Particle Theory)**  
      Hard Core: "Particles are discrete point-like objects."  
      Protective Belt: Can modify collision models or force laws.
    - **Team C (String Theory)**  
      Hard Core: "Particles are vibrational modes of strings."  
      Protective Belt: Can change string tension or dimension counts.
  - **Facilitator (You)**: Announces observations, enforces rules, and updates scores.
  - **No Funding Committee** (Simplifies pacing; budgets are team points).

  #### **Hidden Rule**
  - **Particle flux = n(n-1) + 1** (where `n` = round number):  
    `Round 1: 1`  
    `Round 2: 3`  
    `Round 3: 7`  
    `Round 4: 13`  
    `Round 5: 21`  
    *Justification*: Quadratic growth is non-obvious (resists linear intuition) and allows all teams to "patch" early anomalies. Only Teams B or C might deduce it by Round 4.

  #### **Payoff Scheme**
  - **Accommodate Anomaly**:  
    Cost: 1 point.  
    Gain: 2 points (net +1) immediately.  
    *Rationale*: Cheap and rewarding, mirroring ad-hoc patches that save face but lack depth.
  - **Make Novel Prediction**:  
    Cost: 3 points.  
    Gain: 8 points **if correct**, awarded **2 rounds later** (e.g., predict in Round 2 → reward in Round 4).  
    *Rationale*: High cost and delayed reward mimic the risk of bold predictions; timing ensures teams can’t see outcomes before session ends.
  - **Abandon Programme**:  
    Gain: 5 points immediately. Team becomes observers.  
    *Rationale*: Tempting during crises, but penalizes long-term progress.
  - **Do Nothing**:  
    No cost or gain.

  #### **Round-by-Round Timeline (90 min total)**
  1. **Introduction (0–10 min)**:  
     - Explain rules, teams, and cores. Post team tenets.  
     - Emphasize: "Your goal is to maximize points. The best science isn’t always obvious until later."

  2. **Round 1 (10–20 min)**:  
     - **Observation**: Particle Flux = 1.  
     - *Action Phase*: Teams develop initial models (no anomaly → only "Predict," "Abandon," or "Nothing").  
     - *Expected*: Most teams do nothing. Team C might predict "Flux > 0" (gaming opportunity).  
     - Reveal nothing yet.

  3. **Round 2 (20–30 min)**:  
     - **Observation**: 3.  
     - *Anomalies*: All teams (e.g., Wave Theory’s linear model predicts 2).  
     - *Action Phase*: Teams choose:  
       - Accommodate (net +1), Predict (-3, reward later), etc.  
       - **Gaming moment**: Team C predicts "Flux is prime" (true for 3, 7, 13; false for 1, 21). Novel in letter, empty as it lacks mechanism.  
     - Update scores.

  4. **Round 3 (30–40 min)**:  
     - **Observation**: 7.  
     - *Anomalies*: Teams that accommodated in Round 2 face new issues (e.g., Wave Theory’s patch predicted 5).  
     - *Action Phase*: Teams act. Resolve Round 2 predictions (e.g., Team C’s "prime" succeeds → gains 8 in Round 5).  
     - Update scores.

  5. **Round 4 (40–50 min)**:  
     - **Observation**: 13.  
     - *Anomalies*: Persistent for Teams A/B unless they predict correctly.  
     - *Action Phase*: Key moment for predictions. Team B might predict "Flux=21" for Round 5 (costly, high reward).  
     - Resolve Round 2 predictions (if any). Update scores.

  6. **Round 5 (50–60 min)**:  
     - **Observation**: 21.  
     - *Action Phase*: Final moves. Resolve Round 3/4 predictions (e.g., Team B’s correct prediction gains 8).  
     - **Reveal hidden rule (55 min)**: "The flux was always n(n-1)+1. What felt like progress might be hindsight!"

  7. **Debrief (60–90 min)**:  
     - Map activity to Lakatos:  
       - **Hard Core**: Team tenets (e.g., "waves").  
       - **Protective Belt**: Patches (e.g., Team A’s amplitude tweak).  
       - **Heuristics**: Prediction choices (e.g., Team B’s bet on 21).  
       - **Progressive/Degenerating**: Teams that predicted (B/C) likely gained later, but patching (A) kept scores close.  
     - Discuss:  
       - "When did you feel progressive? Was it obvious then?"  
       - "How did gaming the prediction feel?"  
       - "Why is hindsight needed to judge progress?"

  ---

  #### **Predictable Problems & Fixes**
  1. **Problem**: Teams fixate on "solving" the hidden rule (not the point).  
     **Fix**: Remind them: "Your goal is points, not truth. Science often works without knowing the ‘real’ rule."

  2. **Problem**: Confusion over prediction timing (e.g., expecting rewards next round).  
     **Fix**: Announce: "Predictions pay 2 rounds later. If you predict in Round 2, you’ll be rewarded in Round 4."

  3. **Problem**: One team dominates early, discouraging others.  
     **Fix**: Highlight patching’s short-term gains: "Team A is winning now, but will it last? Remember Round 5 rewards!"

  4. **Problem**: "Gaming" prediction doesn’t occur.  
     **Fix**: Seed the idea: "Predictions can be *any testable claim*, like ‘flux is even’ or ‘flux > 0’."

  ---

  #### **Limitation of the Activity**
  **What the activity cannot reproduce**: Lakatos’s emphasis on **theoretical versus empirical progress**. In real science, a programme can be "progressive" by explaining *unrelated phenomena* or *unifying theories*, even without new predictions. Our activity reduces progress to "correct predictions," missing how theories like Newtonian gravity advanced by subsuming Kepler’s laws or tides. You’ll need to state: *"Lakatos argues true progress isn’t just about predictions—it’s when a programme explains more with less. A degenerating programme might ‘predict’ yet add no depth. That’s why we need hindsight: to see if it solved unexpected problems or just clung to life."*

  ---

  ### **Rules to Read Aloud**
  "Welcome! You’ll defend one of three research programmes about particle behavior. Each has a **hard core**—an untouchable belief—and a **protective belt** of adjustable ideas.  
  - Each round, I’ll reveal a new particle flux observation.  
  - If it contradicts your model (an **anomaly**), you can:  
    - **Accommodate**: Spend 1 point to tweak your belt. Gain 2 points back immediately.  
    - **Predict**: Spend 3 points to make a testable claim about a *future* round. If right, gain 8 points **two rounds later**.  
    - **Abandon**: Take 5 points and stop playing.  
    - **Do nothing**.  
  - Start with 10 points. Most points wins.  
  - **Crucial**: Predictions can be *any testable statement* (e.g., ‘flux > 10’). But be strategic—points are scarce!  
  Let’s begin. Round 1: Particle Flux = 1."

  This design forces teams to live Lakatos’s dilemma: patching feels safe, predicting is risky, and only time tells which was truly "progressive." By the end, the patching team (e.g., Team A) will have competitive points (e.g., 14 vs. 15), proving degeneracy isn’t obvious in real time. The gaming moment (e.g., "prime numbers") exposes how "novelty" can be hollow. The reveal and debrief crystallize the lesson without your summary.
