  ## Civic Honors Board Chair's Opinion: Recommendation on Ada Fenwick Library Naming

  **Bottom Line:** The Board should approve renaming the central library after former Mayor Ada Fenwick, but only with an explicit, permanent, and substantive public acknowledgment of the 1974 water crisis deception. Proceeding without acknowledgment is unacceptable; refusing the honor outright fails to recognize the tragic complexity of governance and Fenwick's demonstrable public service.

  **Reasoning:**

  This decision forces us to confront the "dirty hands" dilemma inherent in political leadership: the possibility that serving the greater good sometimes requires morally compromised actions. Mayor Fenwick’s record of transformative achievements (riverfront revitalization, desegregation, fiscal responsibility) is exceptional and undeniably served the city's highest ideals. The offered renovation is also a significant public benefit. However, the 1974 deception—deliberately suppressing the true death toll and source of contamination—was a profound moral wrong. The argument that it was "necessary" to prevent panic and a larger catastrophe (the strongest argument *for* justification) does not erase its inherently deceptive nature or the tragic consequences: at least forty deaths resulted from misplaced trust in official reassurances. **Therefore, (i) the deception was a wrong that remains wrong, even if undertaken for arguably right reasons.** It violated fundamental duties of truthfulness and the public's right to know, especially regarding life-threatening risks.

  **(ii) This wrong, however, does not automatically disqualify Fenwick from civic honor.** Civic honors serve an expressive function: they publicly affirm the values and achievements the city celebrates. We can acknowledge exceptional public service while also recognizing that governing sometimes involves tragic choices with moral costs. To refuse *any* honor implies that only morally unblemished leaders are worthy, an unrealistic standard that ignores the pressures of crisis leadership and potentially devalues immense positive contributions. The city *can* honor someone it cannot "fully describe" without whitewashing, provided it honestly confronts the complexities.

  **(iii) Fenwick’s failure to ever confess the lie, and the fact it remained secret for twenty years, significantly compounds the moral weight of the act and is central to our decision.** Her private papers reveal she saw it as a "necessary but regrettable instrument," yet expressed no discernible guilt. This absence of remorse or subsequent accountability transforms the act from a reluctantly borne burden into an unacknowledged instrumentalization of the public trust. The prolonged secrecy denied the victims' families and the public closure and the opportunity for collective reckoning. An honor bestowed *now*, without confronting this history, risks appearing as tacit endorsement of the deception and the lack of accountability.

  **(iv) Therefore, an honest honor requires explicit acknowledgment.** A plaque or resolution accompanying the naming *must* contain:
  1.  **The Fact:** A clear statement that during the 1974 waterborne disease outbreak, Mayor Fenwick authorized the Health Department to significantly underreport fatalities and falsely deny municipal water as the source.
  2.  **The Consequence:** Acknowledgment that this deception, intended to prevent panic, resulted in preventable deaths of residents who relied on official reassurances.
  3.  **The Secrecy:** Recognition that the full truth remained concealed for two decades.
  4.  **The Context (without justification):** A statement noting the stated rationale (preventing hospital overwhelm) without endorsing it as justification, framed as part of the historical record.
  5.  **The Tension:** An explicit statement that this act stands in tension with the ideals of transparency and public trust inherent in civic leadership, even as we recognize her other transformative contributions.

  **Addressing the Strongest Losing Argument:**

  The position that *any* deliberate wrong disqualifies Fenwick is morally rigorous and protects against endorsing unethical means. Its strength lies in upholding an absolute standard: civic honor demands unblemished fidelity to core ideals like truthfulness. We reject this *only* because applying it absolutely risks ignoring the totality of a leader's service and the genuine tragic dilemmas they may face. Acknowledging the wrong publicly, rather than ignoring it or letting it negate all else, is a more nuanced way to uphold our values while recognizing complex reality. The "ownership" argument (regarding guilt) is insightful but ultimately secondary; the primary failure was the act and its concealment, not merely her private feelings. Public accountability, not private remorse, is the civic necessity.

  **Recommendation:**

  Approve the renaming of the central library as the "Ada Fenwick Central Library," contingent upon the simultaneous installation of a prominently displayed, permanent plaque (and inclusion in the dedicatory resolution) containing the acknowledgment described above (points 1-5). This honors Fenwick's significant achievements and secures vital renovation funds, while ensuring the city publicly affirms its commitment to truth and acknowledges the full, complex legacy of its leadership, including its moral costs.

  **Criteria for Future Civic Honors:**

  1.  **Exceptional Public Benefit:** The nominee must have demonstrably advanced the city's wellbeing in significant, lasting ways.
  2.  **Moral Scrutiny:** Any known significant violation of core civic ideals (e.g., truthfulness, equity, due process) must be thoroughly examined, regardless of context or outcome.
  3.  **Transparency and Accountability:** Acts involving deception, secrecy, or denial of accountability weigh heavily against unqualified honor. Subsequent acknowledgment or atonement can mitigate this.
  4.  **Enduring Civic Values:** The honor must affirm values the city holds fundamental, and the manner of bestowal must not undermine those values (e.g., honoring without acknowledging a known major deception undermines truthfulness).
  5.  **[Criterion that would decide Fenwick case the other way]:** **Unmitigated Core Violation:** If a nominee's record includes a deliberate, significant violation of fundamental civic rights or trust (like fatal deception of the public regarding a health hazard) that was never acknowledged, corrected, or atoned for *by the nominee themselves during their lifetime or in a timely manner*, and where the violation directly contradicts the specific ideals the honor represents, it disqualifies them from receiving the honor, regardless of other achievements. *(This criterion, applied strictly here, would lead to refusing the honor).*
