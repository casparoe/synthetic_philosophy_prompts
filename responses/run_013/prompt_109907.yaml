prompt: |-
  I'm a novelist, and I've got a scene I can't finish because I don't know what the thing inside it is called, or even whether it's a thing. Bear with me, I'll describe it badly.

  A group of people are all in the same position, and all know it. Each of them, separately, has to decide whether to do one small thing. The thing only works if exactly one of them does it. If none of them do it, nothing happens for anybody. If two or more do it, the whole thing is spoiled -- not split smaller, spoiled. And the reason it isn't just an ordinary muddle is that they're all equally well placed and all equally sharp, so they run the same reasoning, and whatever one of them concludes, all of them conclude. Which means "somebody ought to do it" and "I'd better be the one, because if everyone thinks like me then nobody does it" are the same sentence said by six people at once. And the second one, the one that sounds like the responsible move, is exactly what wrecks the evening.

  Two times I've watched this happen for real. (1) Our writers' group -- six of us -- got offered a single slot on a festival panel. One of us had to reply by Friday. Nobody replying and the slot goes to another group; two of us replying and the organisers get embarrassed and give it away. All six of us, being decent and equally hungry, thought "better not leave it to the others," and all six of us replied, and the slot was gone. The person who did the responsible thing destroyed it. (2) Same group got a small grant, £900, with the rule that whoever put their name down got an equal share. One name, £900. Six names, £150 each. Every one of us put our name down, obviously, because a share beats nothing -- and so the thing we'd actually wanted the money for never happened.

  Then there's a case I'm not sure belongs with those two: in the house I share, somebody has to put the bins out. If two of us do it, it's mildly silly and nothing is lost. Is that the same shape or a different one? I keep wanting to say same and feeling it isn't.

  So. Is there a name for the first thing, if it exists? And separately, I suspect the *reasoning move* -- pick the option that would be best if everyone in your exact position picked it too -- has its own name, and that it isn't the same name as the situation. Is that right? Because in the scene my character has to be able to say what she's doing and why, and at the moment she'd need a paragraph.

  And please don't just hand me labels. I want the edges. How is my first shape different from the plain "everybody assumes somebody else will do it" problem, from the commons thing, from a straightforward coordination problem? Does the trap even survive if the people aren't identical -- because the moment one of them is visibly keener than the rest, it seems to me the whole thing dissolves, and I want to know if that's the crux or a side issue. Does everyone talking it out first fix it, or does it only hold if the agreement can actually be enforced? And is the reasoning move a good rule or a trap? I've a feeling clever people have argued about that for a long time and I need to know which side my character lands on.

  One more thing and then I'll shut up. I half remember a lottery where you send in a postcard and the prize money gets divided between however many people enter, and a friend told me the answer to that one is stranger than "everybody hold back" -- something about each person deciding at random so that probably only one of them enters. Is that right? And if it is, why does one case want a volunteer and the other want a die roll? Thats basically the whole book, so no pressure.
reasoning: |-
  Okay, the user is a novelist struggling with a specific scenario where a group faces a decision paradox. Let me unpack this step by step. They described situations where multiple people must decide independently to act, but the action only succeeds if exactly one person does it. If no one acts, nothing happens; if more than one acts, it fails. The key is that all individuals are identical in position and reasoning, leading them to the same conclusion, which causes failure.

  First, I need to identify if there's a name for this scenario. The examples given—writers' group panel slot and grant money—both involve a threshold where only one actor is needed. The bin example is different because multiple actions don't spoil the outcome. So the critical element is the spoiler effect when more than one acts. That sounds like the Volunteer's Dilemma. 

  The reasoning move here is each person thinking, "I should act because if no one else does, it's better." But since everyone thinks the same, they all act, causing failure. That's symmetric reasoning leading to a Nash equilibrium where everyone volunteers. The user also asks about the reasoning move—deciding based on what would happen if everyone in the same position chose the same. That's Kant's Categorical Imperative, but in game theory, it's tied to the Volunteer's Dilemma's mixed strategies.

  Next, differentiating from similar concepts. The bystander effect or tragedy of the commons involves under-provision due to assuming others will act. Here, it's over-provision because everyone acts. Coordination problems require finding a way to synchronize, whereas this is about avoiding over-action. 

  The user wonders if asymmetry among participants dissolves the trap. Yes, if one person is more likely to volunteer (maybe they're more interested or capable), others might free-ride. But in symmetric cases, the dilemma persists. Communication can help—agreeing on one volunteer or using randomness. The lottery example they mentioned uses randomization to achieve a mixed strategy equilibrium, which is the game-theoretic solution to the Volunteer's Dilemma. 

  For the character's reasoning, she might reject the Kantian approach, opting for randomness instead. The user needs to decide her stance—does she believe in collective agreements or individual randomization? The key insight is that without coordination mechanisms, identical rational actors will fail, but introducing asymmetry or randomness can resolve it.
answer: |-
  You've hit on a brilliantly frustrating and real phenomenon! Your instincts are sharp – the first two scenarios are distinct from the "bins" problem and the "tragedy of the commons." Here's the breakdown, the names, the edges, and the reasoning traps:

  1.  **The Core Problem: The Volunteer's Dilemma**
      *   **Name:** This specific situation is called the **Volunteer's Dilemma**.
      *   **Definition:** A situation where *at least one* person must perform a task (or take an action) for a group benefit, but the person performing the task bears a cost (which could be opportunity cost, effort, or even just the "cost" of being the one who did it). If *no one* volunteers, *everyone* suffers a large cost (the worst outcome). If *more than one* volunteers, *everyone* suffers a moderate cost (the action is spoiled, resources are wasted). The ideal outcome is that *exactly one* volunteers.
      *   **Your Examples:**
          *   **Festival Slot:** Cost of volunteering = time/effort of replying, potential slight awkwardness. Cost of no volunteer = losing the slot (large cost). Cost of multiple volunteers = organizers give slot away (moderate cost - spoiled). Ideal = one replies.
          *   **Grant Money:** Cost of "volunteering" (putting name down) = potentially being seen as greedy? (minimal in this case). Benefit of being the sole volunteer = £900. Cost of no volunteer = £0 (large cost - project dead). Cost of multiple volunteers = £150 each *and the project doesn't happen* (moderate cost - spoiled resource). Ideal = one name down, project funded.
      *   **Why the Bins are DIFFERENT (Key Edge!):** The bins are a classic **Coordination Problem** or **Assurance Game**, ***not*** a Volunteer's Dilemma.
          *   **No Spoiler Effect:** If two people put the bins out, the task is done (perhaps inefficiently, but the core goal is achieved). Nothing is "spoiled." The outcome isn't ruined, just redundant.
          *   **Different Payoffs:** The worst outcome is *no one* doing it (bins overflow). The best outcome is *one* person doing it. *Two* people doing it is still a *good* outcome (bins are out) – it's just suboptimal due to wasted effort. There's no inherent penalty for multiple actors beyond that wasted effort.
          *   **Reasoning:** The challenge is coordinating to *ensure* it gets done, not *avoiding* over-provision. The fear is under-provision ("someone else will do it" - bystander effect), not over-provision spoiling it.

  2.  **The Reasoning Move: Kantian Optimization & Symmetry**
      *   **The Move:** "I should choose the option that would lead to the best outcome *if everyone in my identical position chose the same option.*"
      *   **Name:** This is often called **Kantian Optimization** (after Immanuel Kant's Categorical Imperative: "Act only according to that maxim whereby you can, at the same time, will that it should become a universal law.") It's also central to reasoning in symmetric games.
      *   **Is it a Trap or a Good Rule? (The Crux of Your Character's Choice):** This is the *heart* of the philosophical tension in your dilemma.
          *   **In the Volunteer's Dilemma, it's a TRAP under Symmetry:** If everyone applies Kantian Optimization:
              *   Consider "Everyone Volunteers": Outcome = spoiled (bad).
              *   Consider "No One Volunteers": Outcome = disaster (very bad).
              *   The Kantian optimizer concludes: *Someone must volunteer*. Therefore, *I* should volunteer (because if everyone thinks like this, *no one* would volunteer, leading to disaster).
              *   **Result:** *Everyone* volunteers because *everyone* independently reasons this way. Outcome = spoiled (bad). The move intended to *prevent* the worst outcome *causes* the bad outcome.
          *   **Is it Ever Good?** Kantian Optimization works well in pure coordination problems ("Which side of the road should we drive on?") or situations requiring universal cooperation (like paying taxes, *if* enforcement is assumed). It fails catastrophically in the Volunteer's Dilemma and Prisoner's Dilemma-type situations.
          *   **Your Character's Landing:** Your character is likely deeply frustrated by this. She might conclude: *"The Kantian move feels morally right – taking responsibility so the group doesn't fail. But in this specific trap, with everyone equally sharp and equally placed, it's the *exact* thing that guarantees failure. It transforms individual responsibility into collective self-sabotage. We need a different rule."* She rejects blind Kantianism in symmetric dilemmas.

  3.  **Edges & Cruxes:**
      *   **Symmetry is ABSOLUTELY the Crux:** The trap *requires* symmetry. If one person is visibly keener, more responsible, or stands to gain more/less:
          *   Others can *reasonably expect* that person to volunteer.
          *   The Kantian pressure lessens for the less keen ("X will probably do it").
          *   The dilemma dissolves towards a likely single volunteer (the keen one) or potentially no volunteer (if the keen one *also* assumes others expect them to do it and rebels). Asymmetry breaks the logic loop.
      *   **Communication & Enforcement FIXES it (Usually):** If the group can talk *before* deciding:
          *   They can *recognize* the dilemma.
          *   They can *agree* on a single volunteer (assigning asymmetry).
          *   They can *agree* on a random mechanism (drawing straws, dice roll).
          *   **The Catch:** Enforcement. Can they trust each other to stick to the agreement? In your grant example, if they agreed only one name goes down, could they trust that person to actually use the £900 for the group project? If not, the dilemma re-emerges as a Prisoner's Dilemma ("Should *I* defect and put my name down just in case?"). Communication creates the *potential* for a solution but requires trust or a binding mechanism.
      *   **Vs. Tragedy of the Commons (ToC):**
          *   **ToC:** Individuals over-consume a *shared, finite* resource because the personal benefit of consuming is high, while the cost of depletion is shared by all. Leads to resource destruction (e.g., overfishing, pollution). *Under-provision* of restraint.
          *   **Volunteer's Dilemma:** Individuals over-*provide* a *single, threshold-dependent* action because the personal cost of *not* acting (if no one else does) is catastrophic, while the cost of acting when others also act is only moderate (but spoils the benefit). *Over-provision* of action. The "resource" (the successful action) is destroyed by *too many* providers.
      *   **Vs. Plain Bystander Effect:**
          *   **Bystander Effect:** Diffusion of responsibility leads to *under-provision* of a needed action (e.g., helping someone in distress) because everyone assumes someone else will do it. *No spoiler effect* – multiple helpers are beneficial.
          *   **Volunteer's Dilemma:** Fear of catastrophe *and* spoiler effect leads to *over-provision* of the action because everyone independently concludes *they* must be the one.

  4.  **The Lottery Case (Postcard Paradox):**
      *   **Yes, it's a Volunteer's Dilemma variant!** The prize is the benefit. Sending a postcard has a small cost (stamp, effort). If no one sends one, no prize. If only one sends one, they win big. If multiple send, the prize is split, potentially making it worth less than the cost of the stamp (or just a pittance).
      *   **The "Stranger" Solution: Randomization (Mixed Strategy Equilibrium):**
          *   Clever players realize that if everyone uses the *same deterministic* logic (Kantian or otherwise), they all end up sending postcards and getting almost nothing.
          *   The *rational* solution is for each player to randomize their decision. Each player sends a postcard with a specific *probability* (p), calculated so that the *expected payoff* is equalized whether they send or not, given what others are likely to do.
          *   **Why Random vs. Volunteer?**
              *   **Volunteer's Dilemma (Fixed Group):** The group is small, known, and the action needs to happen *once*. Assigning a single volunteer (via talk or random draw) is efficient and feasible. The cost of volunteering is often asymmetric *after* assignment (one person does the work).
              *   **Lottery (Large/Unknown Group):** The group is large, anonymous, or the "dilemma" repeats. Assigning a specific volunteer is impossible. Randomization at the individual level is the only stable, fair-ish solution where participation isn't guaranteed to lose money. Players accept a *chance* of winning big balanced by a *chance* of wasting a stamp, calculating the *expected value*.

  **Synthesizing for Your Scene:**

  Your character is caught in a **Volunteer's Dilemma**. She recognizes the symmetry: "We're all smart, all see the opportunity, all feel the pressure." She articulates the Kantian trap: "If we all sit back hoping someone else will step up, we lose everything. So I *have* to be the one to act... but damn it, so does everyone else. That's how we ruin it." She rejects pure Kantian reasoning *in this specific symmetric trap* as self-defeating.

  **Her Solution Path (Choose one or blend):**
  1.  **Advocate for Communication:** "We need to talk *now*. Right here. Pick someone. Or draw straws. Anything but silence and hoping."
  2.  **Advocate for Random Action (If Communication Impossible):** "We're too similar. Logic fails us. Flip a coin privately. Do it only if it comes up heads. Maybe only one of us will." (Acknowledging this is imperfect but better than guaranteed ruin).
  3.  **Identify/Create Asymmetry:** "Look, Sarah, you mentioned the venue first. Should you be the point person?" or "I have the email draft ready, I'll send it unless someone objects *in the next 10 seconds*." (Forces a focal point).
  4.  **Reject the Premise (If Possible):** "This setup is broken. Let's contact the organisers/funders and explain the dilemma. Maybe they'll accept one name representing the group / let us designate a treasurer."

  **The Paragraph She Might Say (Option 1 Focused):**

  >"It's the Volunteer's Trap. Six identical minds, one slot. If we all hold back out of politeness, we lose it. If we all jump in out of responsibility, we look like greedy idiots and *still* lose it. Kant be damned – 'I must act so that if everyone acted like me...' is the exact thought all six of us are having right now, and it's the fuse on the bomb. Silence is the detonator. We *have* to break symmetry. Right now. We pick one. Or we draw lots. Or we designate. But we cannot let our individual sense of duty guarantee collective failure. Talk. Now."

  This gives her the label ("Volunteer's Trap/Dilemma"), identifies the Kantian reasoning move, explicitly calls out its failure under symmetry, and pushes for the communication solution. It captures the core frustration and the path out. Good luck with the scene – the dilemma itself is compelling material!
