prompt: |-
  Im a TA and in a week and a half I've got to run a 75-minute section on the centipede game and the backward induction paradox, for second-years who've done Nash equilibrium and the prisoner's dilemma but have never seen backward induction done properly. Don't explain the paradox to me -- plan the session for me. What has to be in place before the centipede even looks like a puzzle, what order things have to go in and why (I have a hunch I need to do backward induction on some boring little finite tree first, but tell me what that warm-up game has to have and what it must not have, and why not just reuse the prisoner's dilemma as the warm-up since they already know it), and what should carry the whole thing. I was going to use a hundred-leg centipede, but I'm now wondering whether that's a mistake -- maybe the carrying example should be the smallest version that still has the flavour, or a variant where I make the payoff for grabbing at the very last node barely bigger than splitting, so they can't wave the whole thing away with "well obviously you'd take that".

  The thing I'm most worried about is what they'll walk out believing. My guess is some of them will conclude backward induction is just the formal version of "people are selfish", others that the paradox shows rationality is self-undermining and therefore who cares, and a few that it's the prisoner's dilemma wearing a hat. I want the misconceptions they'll actually bring, in the order they'll surface during the session, and exactly where in the sequence I head each one off -- including the ones I haven't listed.

  Also tell me what I should deliberately refuse to go into at this level, and to say so out loud when I refuse (I'm guessing all the common-knowledge-of-rationality machinery, but tell me if that's the wrong thing to cut). And give me one question to ask at the end that would tell me whether they got why the backward induction argument is supposed to be a paradox at all, as opposed to just whether they can execute it on a tree.
reasoning: |-
  We are preparing a 75-minute session on the centipede game and backward induction paradox for second-year students who know Nash equilibrium and the prisoner's dilemma but haven't seen backward induction. The goal is to make them understand the backward induction procedure and why the centipede game presents a paradox.

  Session Structure:

  1. **Introduction (5 minutes):**
     - Briefly state the goals: learn backward induction and see a puzzle (the centipede game) that challenges our intuition about rationality.
     - Set the stage: We are going to look at sequential games of perfect information (explain what that means: players move one after another and know all previous moves).

  2. **Warm-up with a Simple Finite Tree (15 minutes):**
     - Why not use Prisoner's Dilemma? Because the PD is simultaneous and doesn't have a sequence of moves. We need a sequential game to demonstrate backward induction.
     - Choose a very simple game: a two-stage game with two players. Example: 
          - Player 1 moves first: chooses A or B.
            - If A, the game ends with payoffs (2, 0) [to player 1 and 2 respectively].
            - If B, then Player 2 moves: chooses C or D.
              - If C, payoffs (1, 1)
              - If D, payoffs (0, 2)
     - Explain the tree: nodes, branches, payoffs at leaves.
     - Demonstrate backward induction:
          - Start at the last move: Player 2 at the node after B. Player 2 will choose D (because 2>1) so payoffs (0,2) if we get there.
          - Now move back to Player 1: Player 1 chooses between A (which gives 2) and B (which leads to Player 2 choosing D, giving 0 to Player 1). So Player 1 chooses A, getting 2.
     - Emphasize: we solve from the end because the player at the last move will choose what's best for them, and then we use that to figure out the previous move, and so on.
     - Why this game? It must be:
          - Finite and with perfect information.
          - Have at least two moves (so we have to work backwards more than one step) but very simple.
          - It must not have any element of uncertainty or simultaneous moves (so not PD). It must be a pure sequential game.

  3. **Introduce a Slightly More Complex Tree (10 minutes):**
     - Now use a three-stage game to reinforce the method. Example:
          - Player 1: Left or Right.
            - Left: (3,0)
            - Right: then Player 2 chooses Left2 or Right2.
              - Left2: (2,2)
              - Right2: then Player 1 again (at stage 3) chooses Up or Down.
                 - Up: (1,3)
                 - Down: (0,4)
     - Backward induction:
          - At the last node (after Right and then Right2), Player 1 chooses Down? Wait: Player 1 gets 0 for Down and 1 for Up -> so chooses Up (1>0) -> (1,3).
          - Now at Player 2's node: Player 2 can choose Left2 (giving 2) or Right2 (leading to (1,3) for which Player 2 gets 3). So Player 2 chooses Right2 (3>2).
          - Then at the first node: Player 1 can choose Left (3) or Right (which leads to the outcome (1,3) for which Player 1 gets 1). So Player 1 chooses Left (3>1).
     - This reinforces the idea of solving step by step from the end.

  4. **Introduce the Centipede Game (20 minutes):**
     - Why not a hundred legs? Because it's too long and tedious. Use a 4-legged centipede (which has 3 decision nodes) or 6-legged (5 nodes) to make the point without being overwhelming. We want the students to see the entire tree and the backward induction process without getting lost.
     - Example of a 4-legged centipede (two players, three moves):
          - Player 1 at node 1: Take (1,0) or Pass.
          - If Pass, Player 2 at node 2: Take (0,2) or Pass.
          - If Pass, Player 1 at node 3: Take (3,1) or Pass.
          - If Pass, then (2,4) [or in some versions, the pot grows and then ends at a terminal node after a pass limit].
     - Alternatively, we can set a fixed endpoint and have the pot grow. Let's define a 4-move version (so 4 decision points) with players alternating:
          - Start: Pot = (1,1) but not taken. 
          - Move 1 (P1): Take -> (1,0) or Pass -> pot becomes (2,2) and goes to P2.
          - Move 2 (P2): Take -> (0,2) [P2 takes, so P1 gets 0, P2 gets 2] or Pass -> pot becomes (3,3) and goes to P1.
          - Move 3 (P1): Take -> (3,1) [P1 takes, so P1 gets 3, P2 gets 1] or Pass -> pot becomes (4,4) and goes to P2.
          - Move 4 (P2): Take -> (0,4) [P2 takes, so P1 gets 0, P2 gets 4] or Pass -> (4,4) [but if we set that after the last pass the game ends and they get (4,4)].

     - However, note: in a 4-legged centipede, we have 4 decision nodes? Actually, the standard naming: a centipede with n legs has n+1 nodes. But let's avoid confusion: we'll describe the game as having a fixed number of moves (say, 4 moves total, 2 per player).

     - Why not a very small one? Because a 2-move centipede (only one decision for each) is too trivial and doesn't capture the paradox. We need at least 3 moves (so that backward induction requires a few steps and the outcome is not the one with the highest total payoff).

     - Backward induction on the 4-move centipede:
          - Start at the last node (Move 4): Player 2 can Take (0,4) or Pass (4,4). So Player 2 would Take (4>4? Wait, if Pass gives (4,4) then Player 2 is indifferent. So we must avoid indifference. Therefore, we design the payoffs so that taking is strictly better at the last node. How about if Pass at the last move leads to (4,4) but we can adjust: let the last move be Take (0,4) or Pass (4,4). Then Player 2 would prefer Pass? That's the opposite of what we want. 

     - We need that at the last node, taking gives the acting player more than passing. So let me restructure:

          Standard centipede: the pot grows and if a player takes, they get the larger share and the other the smaller. But at the last node, if the last player passes, then the game ends and they split the pot? Actually, we want the last player to take. So we can set:

          - After 3 passes, it's Player 2's turn and the pot is (4,4) but if Player 2 takes, they get 4 and Player 1 gets 0? Then Player 2 would take because 4>4? Wait, 4 is not greater than 4. So we must make taking at the last node give more than 4 to the taker? But that breaks the pattern.

     - Alternative: make the last node be a take that gives the taker almost all, but we can set:

          Move 4 (P2): 
            - Take: (0, 4.1)   [so P2 gets 4.1, which is more than 4]
            - Pass: (4,4)

          Then P2 will take.

          Then backward induction:
            - At move 4: P2 takes -> (0,4.1)
            - At move 3: P1 can take (3,1) or pass (which leads to (0,4.1)). So P1 would take (3>0) -> (3,1)
            - At move 2: P2 can take (0,2) or pass (which leads to (3,1)). So P2 would take (2>1) -> (0,2) [because taking gives P2 2, passing leads to P2 getting 1].
            - At move 1: P1 can take (1,0) or pass (which leads to (0,2)). So P1 would take (1>0) -> (1,0)

          So the backward induction solution is that P1 takes at the first node.

     - But note: the outcome (1,0) is worse for both than if they had passed until the end (which would yield (4,4)). This is the paradox.

     - Why this payoff at the last node? To avoid the indifference and force the taking. Without it, if at the last node taking and passing yield the same, then the player might pass, and then the backward induction unravels differently. We want to avoid that.

  5. **Discuss the Paradox (15 minutes):**
     - The backward induction solution says: Player 1 takes immediately -> (1,0). But if they both pass until the end, they get (4,4). So why don't they?
     - The argument: because at the last node Player 2 will take (to get 4.1>4), so at the previous node Player 1 takes (to get 3 instead of 0), so then Player 2 takes at the second node (to get 2 instead of 1), and then Player 1 takes at the first node (to get 1 instead of 0). 
     - But then we see that if Player 1 passes, and then Player 2 passes, they could have gotten more. But backward induction says they won't because each step they are rational and know the other is rational.

     - Common misconceptions and when they arise and how to address:
          - **Misconception 1: "Backward induction is just saying people are selfish."** 
            - This might come up during the backward induction steps. We can head it off by noting that backward induction is a procedure that assumes rationality (each player maximizes their own payoff given what they believe will happen) and common knowledge of rationality. But we are not introducing the formal common knowledge machinery. We can say: "We are assuming that both players are rational and that each player believes the other is rational, and that each player believes that the other believes they are rational, and so on. Without this, the backward induction might break down. But for now, we are assuming it holds."

          - **Misconception 2: "The paradox shows rationality is self-undermining, so we should ignore it."** 
            - This might come up when we compare the BI outcome (1,0) with the cooperative outcome (4,4). We can say: "The point is not that rationality is bad, but that the model of rationality we are using (backward induction) leads to an outcome that seems to be worse for everyone. This suggests that the model might be missing something, such as the possibility of binding agreements, or that in reality people might trust each other to continue. But without such mechanisms, the BI outcome is the only one that survives rational play."

          - **Misconception 3: "It's just like the Prisoner's Dilemma."** 
            - This might come up when we see the Pareto-dominated outcome. We can say: "Indeed, both are games with a unique Nash equilibrium (in the centipede, the BI solution is the unique subgame perfect equilibrium) that is not Pareto optimal. But note that in the PD, the players move simultaneously, whereas here the moves are sequential and the players have multiple chances to cooperate. Yet, the equilibrium still leads to early defection."

          - **Misconception 4: "In reality, people would just pass until the end."** 
            - We can say: "Experimental evidence shows that people do often pass for a while, but not until the very end. This might be because they are not perfectly rational, or they are uncertain about the other player, or they care about fairness. But the backward induction solution remains a benchmark of what would happen under perfect rationality and common knowledge thereof."

          - **Misconception 5: "Why doesn't Player 1 just pass, hoping Player 2 will pass too?"** 
            - This is the heart of the paradox. We can explain: "Because Player 1 knows that Player 2, being rational, at the last node will take. Therefore, Player 1 at the node before that will take. Therefore, Player 2 at the node before that will take. Therefore, Player 1 at the first node takes. The hope of cooperation is not rational because it would require Player 2 to act irrationally at the last node."

  6. **What to Avoid (explicitly state):**
     - We are not going into the formal definition of common knowledge (but we are assuming it). We are not discussing the epistemic foundations (like what if there is a small doubt about rationality). We are not going into infinite games or continuous time. We are also not going to discuss the experimental literature in detail.

  7. **Wrap-up and Check for Understanding (10 minutes):**
     - Summarize: backward induction is a method for solving finite sequential games of perfect information. The centipede game shows that this method can lead to an outcome that is worse for both players than if they had cooperated. This is the paradox.
     - Ask the one question to check if they understand the paradox: 
          **"In the centipede game we analyzed, why doesn't Player 1 pass at the first move, even though both players would get more money if they passed until the end?"**

          Expected answer: Because Player 1 knows that if they pass, then at the next node Player 2 (if rational) would take because otherwise, if Player 2 passes, then Player 1 at the next node would take (and so on, leading to the backward induction chain). Therefore, Player 1 passing would only lead to Player 2 taking immediately and Player 1 getting 0, which is worse than taking at the first move.

     - If they can articulate that, they understand the paradox.

  Timing breakdown:
    - Introduction: 5 min
    - Warm-up (simple tree): 15 min
    - Slightly more complex tree: 10 min
    - Centipede game: 20 min
    - Discussion of paradox: 15 min
    - Wrap-up: 10 min

  This totals 75 minutes.

  Note: The warm-up and the complex tree might be combined if the students catch on quickly, but it's better to have two examples to build confidence.

  Also, during the centipede game, draw the game tree step by step on the board and do the backward induction together with the class.

  Good luck!
answer: |-
  ### Session Plan: Centipede Game & Backward Induction Paradox (75 mins)  
  **Goal:** Students grasp backward induction (BI) as a tool for sequential games, recognize why the centipede game creates a paradox (theoretical vs. intuitive outcomes), and avoid common misconceptions.  

  ---

  ### **Key Principles for Sequencing**  
  1. **Start simple:** BI must be intuitive before applying it to paradoxes.  
  2. **Contrast with known concepts:** Nash Equilibrium (NE) and Prisoner’s Dilemma (PD) are simultaneous-move; BI requires sequentiality.  
  3. **Paradox hinges on tension:** BI’s "irrational" outcome vs. Pareto-superior cooperation. Use a **4-6 leg centipede** (not 100!). Why?  
     - 100 legs obscure the logic; 4-6 legs preserve the paradox without tedium.  
     - **Adjust payoffs** to prevent dismissal: Make the final "take" payoff *barely* better than splitting (e.g., \$4.01 vs. \$4.00).  

  ---

  ### **Session Flow**  
  #### **1. Set the Stage: Sequential Games vs. NE/PD (10 mins)**  
  - **What students know:** NE (mutual best response), PD (dominant strategy → defection).  
  - **Gap:** These assume simultaneous moves. Sequential games change incentives via order of play.  
  - **Bridge:**  
    - Show a **sequential PD** tree (Player 1 moves first, Player 2 observes then moves).  
    - Ask: *"What does Player 2 do if Player 1 defects? Cooperates? How does Player 1 exploit this?"*  
    - **Why not reuse PD?** PD’s simultaneous version obscures sequential reasoning. Use it only to contrast: *"Here, Player 2 can conditionally respond—so we need a new tool."*  

  #### **2. Backward Induction Warm-up: "Boring Tree" (15 mins)**  
  - **Game requirements:**  
    - **Must have:** 3+ decision nodes, 2 players, **terminal payoffs where later choices affect earlier incentives** (e.g., a trust game).  
    - **Must not have:** Indifference, symmetric payoffs, or too few moves (or BI seems trivial).  
    - **Example:**  
      - Player 1: Invest (\$0, \$0) or Don’t (\$2, \$2).  
      - If Invest, Player 2: Share (\$3, \$3) or Keep (\$1, \$4).  
      - Backward induction:  
        - Player 2 keeps → (\$1, \$4).  
        - Player 1 anticipates this, chooses Don’t → (\$2, \$2).  
  - **Why this works:**  
    - Illustrates BI step-by-step: Start from end, prune irrational moves, propagate payoffs backward.  
    - **Head off misconception:** *"BI is just selfishness"* → Point out Player 2’s "keep" is rational (maximizes their payoff), not necessarily selfish—players could have altruistic payoffs and BI would still apply.  

  #### **3. Centipede Game: Setup and BI (25 mins)**  
  - **Use a 4-leg centipede (3 decision nodes):**  
    - Player 1 starts, alternates turns, pot grows:  
      - **Node 1 (P1):** Take → (\$1.10, \$0.10) or Pass → Node 2.  
      - **Node 2 (P2):** Take → (\$0.10, \$2.10) or Pass → Node 3.  
      - **Node 3 (P1):** Take → (\$3.10, \$1.10) or Pass → Node 4.  
      - **Node 4 (P2):** Take → (\$0.10, \$4.01) or Pass → (\$4.00, \$4.00). *(Key: Final "take" = \$4.01 > \$4.00)*  
  - **BI demonstration:**  
    - Start at Node 4: P2 takes (gets \$4.01 > \$4.00) → (\$0.10, \$4.01).  
    - Node 3: P1 takes (gets \$3.10 > \$0.10) → (\$3.10, \$1.10).  
    - Node 2: P2 takes (gets \$2.10 > \$1.10) → (\$0.10, \$2.10).  
    - Node 1: P1 takes (gets \$1.10 > \$0.10) → (\$1.10, \$0.10).  
  - **Highlight the tension:**  
    - BI outcome: (\$1.10, \$0.10).  
    - Cooperative outcome (both pass): (\$4.00, \$4.00).  
    - *"Why can’t they cooperate? BI says they’d never reach Node 4!"*  

  #### **4. Unpacking the Paradox (20 mins)**  
  - **Common misconceptions & how to debunk them in sequence:**  
    - **During BI demo:** *"BI is just formalizing selfishness."*  
      → **Head off:** Contrast with warm-up game—BI works even with non-monetary payoffs (e.g., trust). Rationality ≠ selfishness; it’s goal-maximizing given beliefs.  
    - **After BI outcome:** *"This is stupid—people would just pass until the end!"*  
      → **Head off:** *"If you were P2 at Node 4, would you pass and get \$4.00, or take and get \$4.01? If you’d take, why would P1 ever let you get there?"* Use payoff tweak to force the issue.  
    - **When comparing to PD:** *"It’s just PD in a tree—defect early!"*  
      → **Head off:** In PD, defection dominates. Here, cooperation is feasible but "unravels" from the end. PD lacks sequential commitment; centipede requires forward-looking trust.  
    - **Post-paradox:** *"Rationality is self-undermining—ignore BI."*  
      → **Head off:** *"BI isn’t wrong—it’s the setup that’s paradoxical. The tension is between individual rationality (BI) and group rationality (cooperation)."*  
  - **What to explicitly avoid:**  
    - **"We’re skipping common knowledge of rationality (CKR) machinery.** BI assumes players know the game, know others are rational, know others know, etc. Real humans rarely satisfy CKR—but today, we assume it holds." (Mentioning it preempts "but people aren’t robots" objections.)  
    - **Do not discuss:** Trembling-hand equilibrium, epistemic game theory, or infinite games.  

  #### **5. Wrap-up: The "Why Paradox?" Question (5 mins)**  
  - **Pose this question:**  
    > *"In the centipede game, BI says Player 1 takes immediately. But if Player 1 passes, and players cooperate, both get more. Why can’t rational players achieve this?"*  
  - **Expected answer:**  
    - BI unraveling—if Player 1 passes, Player 2 would take at Node 2 (as BI shows), so Player 1 gets only \$0.10. Cooperation requires Player 2 to irrationally pass at Node 4, but BI assumes they won’t.  
  - **Why this question?**  
    - Tests if they see BI as a *consistent chain of reasoning* (not just tree-solving), and why the cooperative outcome is unattainable under full rationality.  

  ---

  ### **Why This Sequence Works**  
  - **Builds intuition:** Simple tree → centipede ensures BI is internalized before paradox.  
  - **Payoff tweak matters:** Final "take" > "split" prevents hand-waving ("just pass!").  
  - **Misconceptions targeted:** Each debunked when it naturally arises (selfishness early, cooperation objections late).  
  - **Cognitive load:** 4 legs balance clarity and paradox; 100 legs overwhelm novices.  

  **Timing Buffer:** If running short, expand the warm-up Q&A. If long, skip the complex tree (but keep the warm-up).  
  **End goal:** Students walk out seeing BI as a logical tool, the centipede as a paradox of rationality (not a "flaw"), and why real behavior may deviate (without dismissing theory).
