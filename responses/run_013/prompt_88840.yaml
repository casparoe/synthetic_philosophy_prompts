prompt: |-
  I'm a journalist who writes about science and ideas, and I'm embedded for a few weeks in a seminar on democratic innovation while I report a feature on sortition. The professor asked me to give a blind first read on a sample exam answer from a student, since she wants an outside perspective before she grades it. I don't know the student, and I don't want to just wave it through or nitpick it to death, so I'm asking you to grade it instead.

  The exam question was: "The Civic Lottery Bill proposes a 300-member Citizens' Assembly chosen by lot from a 5,000-person pool drawn from the electoral register. The pool is stratified by age, gender, and region; those selected from the pool must serve a one-year term, are paid, and can hear expert witnesses but cannot delegate their votes. Drawing on the arguments for sortition/lottocracy, explain what normative problem this design is supposed to solve and assess whether it actually avoids elite capture. In your answer, be clear about what sortition is and is not."

  Student's answer: "Sortition is selection by lot rather than election, and it was central to Athenian democracy, where a lot of political offices were filled by random draw. The Civic Lottery Bill is trying to solve the problem of unequal voice: elections tend to favor wealthy, educated, and well-connected candidates, and even when they don't, campaigns are dominated by donors and media. A random sample of the population is descriptively representative: it looks like the population in terms of age, gender, and region, so the assembly can speak for the people in a way that a parliament of lawyers and party hacks cannot. Paying members and making service mandatory also reduce the class bias that would come from a volunteer assembly, because low-income people can afford to take the year off and nobody can buy their way out. The two-stage lottery is also important: drawing 5,000 first and then 300 gives more people a chance to be chosen and makes it harder for a faction to rig the final result.

  The deeper justification for sortition is epistemic. According to the Condorcet Jury Theorem, if each person is more likely than not to get the right answer, then the probability that a majority gets the right answer increases toward certainty as the group gets larger. That is why a randomly selected assembly of 300 will make better decisions than an elected legislature: it is a statistically representative sample of the whole population's judgment, and the law of large numbers does the rest. Expert witnesses help with information, but the point is that ordinary people, when they deliberate, can pool their perspectives and correct each other's biases.

  Does it avoid elite capture? Mostly yes. Because there are no elections, there are no campaign donors, no parties, and no professional politicians, so the main channels of elite influence are closed. The experts who testify are only witnesses, so they can inform the assembly without controlling it. The one remaining worry is that the people who run the lottery could try to bias the pool, but if the draw is public and stratified, that seems like a minor technical problem. So I would say the bill largely succeeds in creating a lottocratic body that is both representative and resistant to elite capture."

  I'm not sure what grade this deserves. It reads smoothly and uses the right vocabulary, but I need point-by-point feedback I can pass along, not a general impression. Can you grade it out of 20 and give me the specific comments that justify the grade -- what's solid, what's wrong or overstated, and what a careful grader should flag? Please be concrete about which sentences are doing the work and which ones are quietly making a move that doesn't follow.
reasoning: |-
  Okay, I see the user is a journalist embedded in a seminar on democratic innovation, reporting on sortition. They've been asked to give a blind first read on a student's exam answer about a Civic Lottery Bill. The user wants me to grade this answer out of 20 with specific, point-by-point feedback they can pass along to the professor. 

  Hmm, this is an interesting academic exercise. The student's answer is actually quite polished - it flows well and hits several key points about sortition. But as a grader, I need to look beyond surface fluency and evaluate the substance. The journalist is right to want concrete feedback rather than general impressions.

  Let me break this down systematically. First, I should assess how well the student defines sortition. The opening line is correct but minimal - just calling it "selection by lot rather than election" misses the civic function aspect that distinguishes it from pure randomness. That's a subtle but important oversight.

  The descriptive representation section is strong though. The student neatly explains how stratification addresses demographic imbalances in elected bodies, and the points about pay and mandatory service effectively counter class bias. The two-stage lottery explanation is also spot on - good grasp of practical design considerations.

  But then we hit the epistemic argument... oh dear. The Condorcet Jury Theorem application here is fundamentally flawed. The theorem requires independent judgments on a binary choice with a "correct" answer - none of which applies to complex policy deliberation. This isn't just oversimplified; it's conceptually wrong. And the law of large numbers reference compounds the error by implying mathematical inevitability of good decisions.

  The elite capture analysis starts well by correctly identifying blocked channels (donors, parties). But then it glosses over more subtle capture risks - like agenda-setting power or social influence dynamics during deliberation. Dismissing selection bias as a "minor technical problem" shows concerning naivete. Public draws don't automatically prevent manipulation of source lists or stratification criteria.

  Structurally, the answer nails the "explain" part but wobbles on "assess." It's strongest when discussing descriptive representation, weakest on epistemic claims. The concluding confidence ("largely succeeds") feels unearned given the oversight of real-world implementation risks.

  For grading... I'm thinking 14/20? That's a solid B: credit for clarity and several accurate points, but significant deductions for the Condorcet misapplication and superficial capture analysis. The professor should know this student understands the basics but hasn't fully grasped the theoretical nuances or practical challenges.

  I'll prepare detailed marginal comments matching the rubric categories, quoting specific problematic phrases. The journalist can present this as "an external grader's assessment" without overstepping - exactly the dispassionate second opinion the professor wanted.
answer: |-
  Here’s a point-by-point assessment of the student’s answer, graded out of **20 (14/20)**, with specific feedback:

  **Grading Rubric Breakdown**  
  *(Max 5 pts for defining sortition, 5 pts for explaining the problem, 5 pts for assessing elite capture, 5 pts for clarity/structure)*  

  ---

  ### **1. Definition of Sortition (4/5)**  
  - **Strengths**:  
    - Correctly states sortition is "selection by lot rather than election" and notes its Athenian origins.  
    - Appropriately contrasts it with elections (*"parliament of lawyers and party hacks"*).  
  - **Weaknesses**:  
    - **Missing key nuance**: Fails to clarify that sortition selects *ordinary citizens* (non-elites) for *deliberative* roles, distinguishing it from random appointments to administrative posts. The phrase *"what sortition is and is not"* requires this distinction.  
    - **Overlooked limitation**: Doesn’t mention sortition’s typical use for *specific* assemblies (e.g., policy juries), not wholesale governance.  

  ---

  ### **2. Normative Problem Addressed (5/5)**  
  - **Excellent coverage**:  
    - Identifies *"unequal voice"* as the core problem, linking elections to elite bias (*"wealthy, educated, well-connected candidates"*).  
    - Explains descriptive representation (*"looks like the population"*) and its value for legitimacy.  
    - Highlights anti-oligarchic measures: pay, mandatory service, two-stage lottery to reduce class bias and rigging risks.  
    - **Key insight**: Notes stratification (*age, gender, region*) ensures diversity beyond crude randomness.  

  ---

  ### **3. Assessment of Elite Capture (3/5)**  
  - **Strong points**:  
    - Correctly notes blocking *overt* channels: no donors, parties, or career politicians.  
    - Validates expert witnesses as advisors without decision power.  
  - **Critical flaws**:  
    - **Misapplies Condorcet Jury Theorem (CJT)**: CJT assumes *binary choices* and *independent* voters with >50% competence—neither holds in complex deliberative settings. The claim that *"the law of large numbers does the rest"* is pseudoscientific oversimplification. **(Major error)**  
    - **Understates elite capture risks**:  
      - Ignores *agenda-setting power* (who chooses experts? who frames issues?).  
      - Overlooks social influence (dominant speakers, staff bias).  
      - Dismisses selection bias (*"minor technical problem"*) despite real-world risks (e.g., manipulation of the electoral register or stratification criteria).  
    - **Unsubstantiated optimism**: Asserts ordinary people *"correct each other’s biases"* without addressing group polarization or misinformation vulnerabilities.  

  ---

  ### **4. Clarity & Structure (2/5)**  
  - **Strengths**:  
    - Fluent, logically organized, and uses key terms (*descriptive representation, stratification*).  
  - **Weaknesses**:  
    - **No explicit thesis**: Frames the answer as a list of points rather than a focused argument.  
    - **Conflation of concepts**: Merges descriptive representation (sociological) with epistemic claims (CJT) without clarifying their distinct justifications.  
    - **Overconfident conclusion**: Declares the design *"largely succeeds"* without weighing trade-offs.  

  ---

  ### **Final Grade: 14/20**  
  - **Breakdown**: Definition (4) + Problem (5) + Elite Capture (3) + Structure (2) = 14  
  - **Equivalent**: B (Good but with significant gaps)  

  ---

  ### **Feedback for the Professor**  
  > "This answer demonstrates a strong grasp of sortition’s *descriptive* advantages and electoral critiques. The student expertly unpacks stratification, payment, and mandatory service as anti-bias tools. However, the epistemic argument relies on a misapplication of Condorcet’s Jury Theorem—a serious conceptual error that overstates mathematical inevitability in deliberation. Elite capture analysis is surface-level, ignoring agenda control and social dynamics. Recommend deducting points for: (1) CJT misuse, (2) underdeveloped capture risks, (3) omitted sortition boundaries. Overall: competent but needs rigor in theoretical application."  

  **Key sentences to flag**:  
  - *"the law of large numbers does the rest"* → Misrepresents CJT’s limits.  
  - *"ordinary people... correct each other’s biases"* → Unsupported; deliberation can entrench biases.  
  - *"minor technical problem"* → Underestimates selection manipulation risks.  

  This provides the professor with actionable critique while acknowledging the answer’s strengths. As a journalist, you’ve delivered a fair, evidence-based assessment without overstepping.
