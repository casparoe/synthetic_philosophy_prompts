answer: |-
  Here's the conceptual skeleton you're after, stripped down to the essential logic and avoiding formal proofs:

  ### 1. Mixed Strategies as Dominators: Why They Matter (and Why They're Not a Red Herring)
  - **The Core Idea:** Rational players consider *all possible ways* to randomize their actions. If *any* mixed strategy (over their other actions) strictly beats a pure strategy **no matter what opponents do**, that pure strategy is irrational and should be eliminated.
  - **Your Example is Perfect:** Row C ((0.9, 0.9)) is strictly dominated by the 50-50 mix of A and B ((1, 1)). A rational player *will* abandon C. Ignoring mixed dominators would leave C in the set, implying a rational player *might* play it, which is wrong.
  - **"In" or "Out"?** For iterated elimination to correctly capture "strategies a rational player would *never* play," **mixed strategies MUST be allowed as dominators.** If you *only* allow pure-strategy dominators, you get a **larger, less refined** surviving set. This set includes strategies like your C, which are irrational because mixtures dominate them.
  - **Connection to Rationalizability:** This is the key insight! Iterated Elimination using **Strict Dominance with Mixed Strategies (IESDS)** is **equivalent** to finding the set of **rationalizable strategies**. A strategy survives IESDS iff it is a best response to *some* belief about opponents' (possibly correlated) play. Your "vague memory" is correct: allowing mixtures aligns IESDS perfectly with "never a best response" logic under common knowledge of rationality.

  ### 2. Strict vs. Weak Asymmetry: The Heart of the Order-Dependence Problem
  - **Strict Dominance (SD): The "Bulldozer"**
      *   **Why Order Doesn't Matter:** If strategy X is strictly dominated (by pure or mixed), it is **strictly worse than its dominator *against every single possible opponent strategy profile***. Eliminating X *cannot* make a previously undominated strategy Y become dominated. Why? Because the dominator for Y had to beat it *even when opponents could play the strategy that made Y look best*. Eliminating X removes some opponent profiles, but the dominator for Y *already* worked against those profiles. The elimination sequence is robust.
  - **Weak Dominance (WD): The "House of Cards"**
      *   **Why Order Matters:** If strategy X is *weakly* dominated by Y, it means Y is **at least as good as X against *all* opponent profiles, and *strictly better against *at least one* opponent profile**. Crucially, that "at least one" profile might involve a strategy (say, Z) played by another player.
      *   **The Domino Effect:** Eliminating Z (perhaps because *it* was weakly dominated) might *remove the very opponent profile where Y was strictly better than X*. Suddenly, against the *remaining* opponent profiles, X might be just as good as Y. X is no longer weakly dominated! Eliminating X first might have been valid, but eliminating Z first made X "safe". This interdependence is why order matters and why equilibrium strategies (which rely on specific opponent responses) can be eliminated. Weak dominance depends on the *context* of what opponents *might* play.

  **Intuition Trap Spot:** Don't think weak dominance is "less rational" to eliminate. The issue isn't the *rationality* of eliminating a weakly dominated strategy *in isolation*. The issue is that eliminating one *changes the strategic landscape* in a way that can *retroactively invalidate the reason* for eliminating another. Strict dominance doesn't have this fragility.

  ### 3. The Epistemic Story: Knowledge vs. Certainty
  - **"Rationality + Common Knowledge" (RCK) & Strict Dominance:**
      *   RCK justifies eliminating a strictly dominated strategy **in the first round**. Player i knows they are rational, so they won't play it. Others know i is rational, so they know i won't play it. Others know *others* know i is rational, so they know others know i won't play it, and so on. The strategy is *obviously* irrational to everyone simultaneously.
  - **RCK & Weak Dominance: The Problem**
      *   RCK alone **does NOT justify** eliminating a weakly dominated strategy. Why? Because playing a weakly dominated strategy isn't *necessarily* irrational. It's only irrational if the player assigns **ZERO probability** to the opponent profiles where the dominator is strictly better.
      *   **The Knowledge Gap:** RCK tells everyone that everyone is rational, but it *doesn't* tell Player i what specific beliefs others hold. Player i *cannot* rule out the possibility that opponents *might* play the profile where their weakly dominated strategy X is just as good as Y. Playing X isn't strictly worse than playing Y given this uncertainty.
  - **Justifying Weak Elimination: The Missing Ingredient**
      *   To eliminate weakly dominated strategies under an RCK-like logic, you need an **extra assumption about beliefs or perturbations:**
          *   **Lexicographic Beliefs:** Players consider the possibility that opponents *might* tremble to play the strategies that make weak dominance strict, even if they believe it's infinitely unlikely. This makes the weakly dominated strategy inferior.
          *   **Trembling Hand Perfection:** Players believe there's an infinitesimal chance opponents make mistakes. This makes weak dominance effectively strict (since the profiles where the dominator is better *do* get played with positive probability, however small).
          *   **Admissibility (Caution):** Players *never* assign *exactly* zero probability to *any* of an opponent's pure strategies (even if dominated). This guarantees that the profiles where the weak dominator is strictly better are considered, making the weakly dominated strategy strictly worse *in expectation*.
      *   **The Core Difference:** Eliminating weak dominance requires players to consider not just what opponents *will* do (knowable via RCK for strict dominance), but also what opponents *might conceivably* do, even if extremely unlikely. RCK provides certainty about rationality, but not about beliefs over the *residual* strategy space in a way that kills weak dominance. The extra assumptions inject a form of "cautiousness" or belief in trembles.

  **Intuition Trap Spot:** The issue with weak dominance isn't that players aren't rational or that others don't know it. The issue is that weak dominance leaves room for *indifference* under some beliefs. RCK doesn't provide enough information to force players to break that indifference in favor of the dominator. The extra assumptions (trembles, caution) *force* players to break the indifference.

  ### Conceptual Summary

  1.  **Mixed Dominators are Essential:** They capture the full power of randomization available to a rational player. Disallowing them leaves irrational strategies in the set. IESDS with mixed dominators = Rationalizability.
  2.  **Strict vs. Weak Asymmetry:** Strict dominance is context-independent ("always worse"). Weak dominance is context-dependent ("worse *unless* opponents avoid specific actions"). Eliminating strategies changes the context, so weak elimination order matters; strict elimination order does not.
  3.  **Epistemic Justification:** Common knowledge of rationality (RCK) **alone** justifies eliminating strictly dominated strategies because they are unambiguously irrational. RCK **does not justify** eliminating weakly dominated strategies because they *can* be rational under some plausible beliefs. Justifying weak elimination requires an **extra cautionary or perturbational assumption** (lex beliefs, trembling hand, admissibility) to break the indifference inherent in weak dominance.

  This framework explains why mixed strategies are crucial for completeness, why strict dominance is robust to iteration while weak dominance isn't, and why common knowledge of rationality needs a boost to handle weak dominance elimination. The asymmetry stems from the fundamental difference between "always worse" and "never better, sometimes equal".
