  I'm a PhD student in legal theory, but I did a CS degree and worked as a backend engineer for a couple of years, so I still think in git and SRE terms. I'm writing on victors' justice and retroactive law at Nuremburg and Tokyo, and I keep wanting to restate the whole thing in the vocabulary I actually use: commits, branches, tags, breaking changes, deprecation windows, CI, incident postmortems, runbooks, terms of service, code of conduct enforcement. Can you do that translation for me? Take the main positions -- the positivist objection that the defendants were punished under law that didn't exist when they acted, the natural-law reply that extreme injustice isn't law, the claim that crimes against peace and crimes against humanity were already customary international law, the tu quoque defence, the command-responsibility stuff, the move that the charter was itself the law it applied -- and restate each as faithfully as you can in that vocabulary. Then give me the residue report: what translates cleanly, what has to be fudged or distorted, and what has no counterpart at all. I especially want to know whether the residue is a defect of the git/SRE framework or a sign that the legal debate is less clear than it looks. Don't smuggle in the assumptions of version control and call it translation. No citations or reading lists, please -- I'm offline. British English.
reasoning: |-
