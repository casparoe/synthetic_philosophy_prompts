  - **Power asymmetry**: Version control assumes consensus; victors' justice doesn't. The "maintainer privilege" analogy accidentally reveals how legal frameworks mask force. 
  - **Human judgment**: Git automates; law can't. The irreducibility of judicial discretion (e.g., weighing intent) means SRE's playbooks fall short. 

  Verdict: The residue isn't defects in either system. Instead, it shows law's unresolved tensions—like moral objectivity or power imbalances—that structured workflows avoid by design. The user might be onto something: their SRE lens makes victors' justice feel *more* visible, not less. 

