answer: |-
  ### Plan for Jeffrey Conditionalization Talk  
  **40 minutes, whiteboard, audience: philosophers (minimal probability) + one statistician.**  
  Focus on conceptual structure, dependencies, and misconceptions. Use the juror example throughout.

  ---

  ### **Prerequisites & Structure (15 minutes)**  
  *Order matters: build step-by-step, each piece relies on the last.*  

  1. **Probability Basics (3 min)**  
     - **What must be in place:** Sample space, events, Kolmogorov axioms, conditional probability (`P(A|B) = P(A∩B)/P(B)`).  
     - **Why:** Without this, conditioning is meaningless. Philosophers need the scaffolding; the statistician needs formal rigor.  
     - *Whiteboard:* Venn diagram + `P(A|B)` formula.

  2. **Ordinary Conditionalization (5 min)**  
     - **What:** Updating on *certain evidence* (a proposition `E` learned with probability 1).  
       - `P_new(H) = P_old(H|E)`.  
     - **Why it’s insufficient:** Fails when evidence is uncertain (no proposition `E` to condition on).  
     - **Dependency:** Rigidity (later) generalizes this; ordinary is a special case.  
     - *Whiteboard:* Coin flip example (learning it landed heads).

  3. **The Gap: Uncertain Evidence (4 min)**  
     - **Problem:** Real-world evidence often doesn’t pin down a single proposition.  
       - *Example setup:* Juror observes witness hesitation → *downgrades trust in testimony*, but learns no new fact.  
     - **Key insight:** Credences shift over a *partition* (e.g., {witness reliable, witness unreliable}).  
     - **Dependency:** Introduces the need for kinematics (updating *without* certainty).

  4. **Jeffrey Conditionalization (3 min)**  
     - **Formula:** For partition `{E₁, E₂, ..., Eₙ}`,  
       `P_new(H) = ∑[i] P_old(H|Eᵢ) · P_new(Eᵢ)`.  
     - **Rigidity Assumption (CRITICAL):** `P_old(H|Eᵢ) = P_new(H|Eᵢ)` for all `i`.  
       - *Placement:* After ordinary conditioning, before Jeffrey formula.  
       - **Why it depends on prior step:** Rigidity is what generalizes ordinary conditioning (when `P_new(E_k)=1`, rigidity reduces to it).  

  ---

  ### **The Juror Example: Why It Works & Toy Case Pitfalls (10 minutes)**  
  *Carry this through the entire talk.*

  - **The Juror Scenario:**  
    - **Partition:** `E₁ = witness reliable`, `E₂ = witness unreliable`.  
    - **Prior:** `P_old(guilty) = 0.4`, `P_old(E₁) = 0.8` (trusts witness).  
    - **Hesitation:** No fact learned—only shifts credence to `P_new(E₁) = 0.6`.  
    - **Rigidity:** `P(guilty | E₁)` and `P(guilty | E₂)` unchanged (e.g., if reliable, `P(guilty|E₁)=0.7`; if unreliable, `P(guilty|E₂)=0.1`).  
    - **Update:** `P_new(guilty) = (0.7)(0.6) + (0.1)(0.4) = 0.46`.  

  - **Why this example is ideal:**  
    - **Has:** Uncertain evidence (no proposition learned), clear partition, rigidity is natural (hesitation affects trust, not guilt conditional on trust).  
    - **Lacks:** Certain inputs (avoids confusion with ordinary conditioning).  

  - **Toy Cases (coins/urns) vs. Juror:**  
    - **Help:** Coins show mechanics (e.g., coin with blurry vision → `P_new(heads)=0.6`).  
    - **Hinder:** Urns/colors often imply hidden *certain* evidence (e.g., "you see green but are unsure" tempts ordinary conditioning). Juror avoids this by focusing on *why* rigidity holds (psychological shift, not sensory noise).  

  ---

  ### **Misconceptions: Order & Responses (10 minutes)**  
  *Preempt in sequence—each stems from prior step.*

  1. **"This is just conditionalization with softer inputs."**  
     - **When it surfaces:** After introducing the formula.  
     - **Head off:** Contrast inputs.  
       - Ordinary: Input = proposition with `P=1`.  
       - Jeffrey: Input = *new distribution* over partition.  
       - *Whiteboard:* Show ordinary as `P_new(E₁)=1` edge case of Jeffrey.  

  2. **"It’s updating on *I now have credence 0.7 in E*."**  
     - **When it surfaces:** When explaining uncertain evidence.  
     - **Head off:** Distinguish *evidence* from *metacredences*.  
       - Hesitation is the evidence → directly shifts `P(E₁)`.  
       - Updating on "my credence is 0.7" would require self-locating beliefs (not here).  

  3. **"Order of uncertain updates can’t matter."**  
     - **When it surfaces:** After multiple updates (e.g., juror then sees new evidence).  
     - **Head off:** Show with numbers.  
       - Example: Update trust `(E₁)` then guilt `(H)` vs. guilt then trust.  
       - With rigidity, *order doesn’t matter* (sums commute). But if rigidity fails, order matters—highlight this assumption!  

  4. **"Ad hoc patch bolted onto Bayes."**  
     - **When it surfaces:** During Q&A or after formula.  
     - **Head off:** Jeffrey extends Bayes minimally:  
       - Ordinary conditioning requires `P(E)=1`.  
       - Kinematics requires rigidity—equally "Bayesian" (dynamically coherent).  

  5. **Unseen misconception: "Rigidity is always justified."**  
     - **When it surfaces:** When applying to juror.  
     - **Head off:** Rigidity fails if evidence *changes* how `H` relates to `Eᵢ` (e.g., hesitation *reveals* witness bias affecting guilt assessments).  

  ---

  ### **Deliberate Omissions & Test Question (5 minutes)**  

  - **Omissions (state explicitly):**  
    - **Diachronic Dutch books** (justification is overkill).  
    - **Non-partition updates** (Jeffrey requires partitions).  
    - **Objective vs. subjective probability** (stay focused on kinematics).  

  - **Test Question:**  
    > "A doctor has a partition: {Disease A, Disease B}. She reads an ambiguous test result, shifting her credence in A from 0.6 to 0.8. She then gets a *definitive* test confirming A. Compare:  
    > (i) Updating on the ambiguous result (Jeffrey) then the definitive test (ordinary).  
    > (ii) Ignoring the ambiguous result and only updating on the definitive test.  
    > Are (i) and (ii) the same? Why/why not?"  

    - **Answer:**  
      - (i) Jeffrey then ordinary: `P_final(A) = 1`.  
      - (ii) Only ordinary: `P_final(A) = 1`.  
      - **But:** Intermediate credences differ. Crucially, (i) *preserves rigidity* during the Jeffrey step, (ii) doesn’t use the uncertain evidence.  
      - **Shows understanding:** Uncertain evidence updates *conditionally*, but only when followed by certainty does it converge.  

  ---

  ### **Confidence Assessment**  
  - **High confidence:** Structure (prerequisites → gap → rigidity → formula), juror example, test question.  
    - *Why:* Pedagogically sequenced; juror avoids toy-case pitfalls.  
  - **Least confident:** Misconception ordering—especially "order doesn’t matter."  
    - *Why:* Philosophers may fixate on commutativity; statistician may question rigidity’s realism. Mitigate by preempting with juror rigidity justification.  

  **Final tip:** End with the test question—let them wrestle. Nail the juror example; it’s the anchor.
