prompt: |-
  I'm running our departmental reading group next month and I've drawn the short straw: forty minutes, whiteboard, on Jeffrey conditionalization. The room is mostly philosophers who've never done any serious probability plus one statistician who'll be quietly annoyed throughout. I dont want you to explain the topic to me — I want the plan for explaining it. So: what has to be in place before probability kinematics even registers as a question, the order the pieces go in and why each one depends on the last, and where the rigidity assumption (that the conditional probabilities inside the partition just stay put) has to sit relative to the ordinary conditionalization they think they already know.

  For the example that carries the whole thing, my instinct is a juror who downgrades her trust in a witness after watching her hesitate on the stand — she doesn't learn any new fact, her credences over the partition just move. Tell me whether that's the right case to build on, what it needs to have and to lack in order to do the work, and why the usual toy cases (coins, urns, colours you can't quite make out) either help or get in the way.

  Then the misconceptions, roughly in the order they'll surface, and the exact point in the sequence where I should head each one off. I'm expecting at least: "this is just conditionalization with a softer input", "it's updating on the proposition that my credence in E is now 0.7", "the order you feed uncertain evidence in can't possibly matter", and some version of "this is an ad hoc patch bolted onto Bayes". Add the ones I haven't thought of.

  Last, two things: what I should deliberately refuse to cover at this level and say so out loud, and one question I can put to them at the end that would actually show whether they've got the difference between uncertain evidence and certain evidence, rather than just nodded along. And please say how confident you are in what you're claiming, singling out the point you're least sure of — I suspect it'll be the ordering advice or the misconception map.
