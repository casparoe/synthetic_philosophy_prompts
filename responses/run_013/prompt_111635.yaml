              - In ordinary conditionalization, order doesn't matter when updating on consistent facts (if you learn A then B, it's the same as B then A, provided both are true). 
              - In Jeffrey, if you update on two different partitions, order can matter. But if you update the same partition twice, then the last update overrides the previous one? Not exactly. Actually, the rigidity assumption must hold at each step. If the evidence affects the conditional probabilities, then rigidity fails and the formula doesn't apply. So, the non-commutativity is a feature. We might avoid going too deep, but note that the order of evidence might matter because the world is changing? Actually, we assume the world is static (only our credences change). The key is that rigidity must hold relative to the current state. But if we update twice on the same partition, then the second update uses the conditional probabilities from after the first update? That breaks rigidity? Actually, the rigidity assumption for the second update would be with respect to the new conditional probabilities? So, if we do not assume that the conditional probabilities remain the same through the updates, then we cannot use the same formula. Therefore, we must assume that the evidence does not change the conditional probabilities (rigidity). Then, if we update the same partition twice, it's equivalent to a single update with the final probabilities? Yes. But if we update on different partitions, then order matters. Example: two different pieces of uncertain evidence that affect different partitions. So, we can say: order might matter, and that's because the rigidity assumption must hold for each update relative to the prior at that step. If the updates are on the same partition and rigidity holds throughout, then the order of updating that partition doesn't matter (because it's just a linear combination). But if the partitions are different, then order matters. This is complex for 40 minutes. So, perhaps just state that in general, the order of updates can matter, and that's why we must be cautious about the rigidity assumption.

     d) "This is an ad hoc patch bolted onto Bayes"
          - When: Probably at the end or when comparing to conditionalization.
          - Response: Argue that it is a natural extension. It preserves the key feature of conditionalization: minimal change in the sense that the conditional probabilities given the partition remain fixed (rigidity). Also, it reduces to ordinary conditionalization when one partition element gets probability 1.

     Additional misconceptions:
     - "Rigidity is always justified": Not necessarily. We must argue for it in a given context. It's an assumption that might fail.
