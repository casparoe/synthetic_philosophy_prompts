     a) "This is just conditionalization with a softer input"
          - When: After introducing the formula.
          - Response: Emphasize that in conditionalization, the input is a proposition that becomes certain. Here, the input is a new probability distribution over the partition. Also, conditionalization is a special case when one element of the partition becomes certain (P_new(E_i)=1 for some i).

     b) "It's updating on the proposition that my credence in E is now 0.7"
          - When: When discussing the input.
          - Response: Clarify that we are not updating on a metaproposition about our own credence. We are updating because of the evidence (hesitation) which directly affects our credence in E. The input is the new credence in E, not a proposition about that credence.

     c) "The order you feed uncertain evidence in can't possibly matter"
          - When: After showing the formula and maybe when discussing multiple updates.
