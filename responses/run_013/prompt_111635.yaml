  1. **Prerequisites**: What must be in place before introducing probability kinematics?
     - Basic probability: sample space, events, probability axioms, conditional probability (P(A|B) = P(A ∩ B) / P(B)).
     - Bayesian updating (ordinary conditionalization): updating upon learning a fact (with certainty). If we learn B, then set P_new(A) = P_old(A|B). This requires P_old(B)>0.
     - The problem: what if we don't learn a fact with certainty? What if our evidence is uncertain? This leads to the need for Jeffrey conditionalization.

  2. **Structure and Dependencies**:
     - Start with ordinary conditionalization: it's the foundation. Emphasize that it requires learning a proposition with certainty (probability 1).
     - Then present a scenario where we have uncertain evidence: our evidence doesn't correspond to a single proposition that we learn with certainty. Instead, we have a shift in our credences over a partition of propositions.
     - Introduce the idea of a partition: a set of mutually exclusive and exhaustive events. The evidence will affect our credences over this partition.
     - The rigidity assumption: the conditional probabilities given each element of the partition remain unchanged. This is the key assumption that allows us to extend conditionalization.
     - Jeffrey conditionalization formula: 
          P_new(A) = Σ_i P_old(A|E_i) * P_new(E_i)
       where {E_i} is the partition.

  3. **The Example**:
     - Your juror example is excellent. 
          - The juror has prior credences about the witness's testimony (say, whether the witness will say "the defendant did it" or not). 
          - The juror observes the witness hesitate. This doesn't tell her exactly what the testimony is, but it changes her credences about the testimony. 
          - Specifically, she downgrades her trust in the witness. So, she now assigns a higher credence to the witness being unreliable (or the testimony being false) than before.
     - What the example needs:
          - A partition: the truth of the matter (e.g., {Guilty, Innocent}) is not directly observed. Instead, the witness's testimony is the partition? Actually, we need to be careful.
          - Better: Let the partition be the possible testimonies? Or the reliability of the witness? Actually, we can set up:
              - Let G: defendant is guilty.
              - Let T: witness testifies that the defendant is guilty.
          - The juror has prior P_old(G), P_old(T|G), P_old(T|not G). 
          - After seeing the hesitation, the juror's confidence in T (the testimony) decreases. So P_new(T) < P_old(T). But note: she doesn't learn any particular fact (like T or not T) for certain. Instead, she updates her credence for T to, say, 0.7 (down from 0.9). 
          - Then, how does she update her belief in G? By Jeffrey conditionalization, using the partition {T, not T}:
              P_new(G) = P_old(G|T) * P_new(T) + P_old(G|not T) * P_new(not T)
          - The rigidity assumption: P_old(G|T) and P_old(G|not T) remain the same after the update.
     - Why this example works: 
          - It's realistic: we often update based on uncertain evidence (like demeanor).
          - It clearly distinguishes from ordinary conditionalization: we didn't learn T or not T, we just changed our credence in T.
     - Avoid toy examples that might confuse the issue? Coins and urns are abstract and might not convey the real-world need. But if you must use a toy example, one that is analogous (e.g., looking at a coin through a foggy glass, so you update your credence about the outcome without being certain) could be a supplement. However, the juror example is more engaging and philosophically relevant.

