          - The key: in the first case, the evidence is perceptual and directly changes your credence (so Jeffrey update). In the second, you learn a proposition (that the person said "I think it's heads") and then you condition on that proposition? Actually, that second case can be handled by conditioning if you model the situation appropriately (by including the person's utterance in the sample space). But the update on the proposition that the person said that would be ordinary conditionalization. However, the input in the first case is not a proposition in the same way. So, the question probes whether they see that uncertain evidence is not about learning a new fact (a proposition) but about a direct shift in credence.

     Alternatively, a more direct question:
          - "After observing the hesitant witness, the juror sets P_new(T)=0.7. If instead the witness had clearly stated the testimony (so the juror learned T for certain), how would the update for G be different? And why can't we use the same method in both cases?"

  7. **Confidence**:
     - Most confident: The structure (starting from ordinary conditionalization, then the problem of uncertain evidence, then the juror example, then the formula with rigidity) is solid and standard.
     - Least confident: The ordering of the misconceptions and the exact responses, especially regarding the commutativity. The issue is subtle and might require more time than available. So, it might be better to avoid deep discussion of commutativity and just state that the rigidity assumption must hold at each update and that updating on different partitions might lead to order dependence.

  **Outline of the Talk**:

  1. (5 min) Recap: Ordinary Conditionalization
     - Formula: P_new(H) = P_old(H|E)
     - Requires learning E with certainty (P_new(E)=1).

  2. (5 min) The Problem: Uncertain Evidence
     - Introduce juror example: prior about guilt and testimony. Then, hesitation leads to loss of confidence in the testimony (without knowing what the testimony is). We don't learn any particular fact.

  3. (5 min) The Partition and Rigidity
     - Define partition (e.g., {T, not T}).
     - Rigidity: The conditional probabilities P_old(H|T) and P_old(H|not T) remain unchanged.

  4. (10 min) Jeffrey Conditionalization Formula
     - Derive: P_new(H) = P_old(H|T)*P_new(T) + P_old(H|not T)*P_new(not T)
     - Show with numbers in the juror example.

  5. (5 min) Relation to Ordinary Conditionalization
     - Show that if P_new(T)=1, then it reduces to ordinary conditionalization.

  6. (5 min) Misconceptions and Clarifications
     - Address the ones we can in the time.

  7. (5 min) Wrap-up and Test Question
     - Omissions: say we are not covering non-partition updates, Dutch books, etc.
     - End with the test question.

  Total: 40 minutes.

  **Example Setup for Juror**:

  Prior:
     P_old(G) = 0.4   (probability guilty)
     P_old(T|G) = 0.9   (witness testifies guilty given guilty)
     P_old(T|not G) = 0.2   (witness testifies guilty given not guilty)

  Compute prior of T:
     P_old(T) = P_old(T|G)*P_old(G) + P_old(T|not G)*P_old(not G)
              = 0.9*0.4 + 0.2*0.6 = 0.36 + 0.12 = 0.48

