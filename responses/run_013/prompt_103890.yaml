prompt: |-
  I'm a backend engineer, zero philosophy training, and for the last two years I've kept a running note in my phone of gut calls I've made at work, mostly because a friend told me my ethics were "weirdly consistent" and I wanted to check if that was true. Here's basically what's in the note, with the verdicts I actually had at the time:

  - A teammate pushes a bug, I fix it silently, push it, and never mention it. Fine.
  - A teammate pushes a design I think is wrong, I silently revert it. Not fine. (I know these look like the same move and I can't fully say why they aren't.)
  - I read a teammate's public commits and blog to figure out their code style. Fine.
  - I read a teammate's personal notes sitting in a shared drive they clearly didn't mean to share. Not fine.
  - I tell a recruiter I'm "really excited about the mission" when I'm not. Fine.
  - I tell a recruiter I have a competing offer when I don't. Not fine.
  - I take a branded water bottle from the office kitchen. Fine. I take a monitor home. Not fine.
  - I quietly clean up a mess a teammate made, before they find out they made it, so they never find out. Fine, but this is the one I flip on most.
  - Same teammate's mess is about to blow up in their performance review. I can fix it silently or tell them first. I genuinely cannot decide this one and it bothers me.

  My best guess at the rule behind all this: something is fine when the other person, if they later found out, could still hand me the exact same thing again without hesitating — and not fine when finding out would cost them that. Silent bug fix, they'd still trust me with bugs. Silent revert of their design, they wouldn't trust me with designs. Water bottle, sure, take another. Monitor, no. Telling the recruiter I'm hyped, whatever. Telling them about an offer I don't have, no.

  But two things nag at me. First, this sounds a lot like "fine as long as I wouldn't get caught / as long as it wouldn't blow up," which as a moral principle sounds kind of gross, so tell me if that's what it actually amounts to. Second, maybe there is no rule at all and I've just been pattern-matching my moods for two years — I want to know if that's the honest answer.

  So: give me the principle, or the two or three candidate principles, stated precisely enough that I could apply them to a case you invent. For each clause, tell me which of my verdicts it's doing the work for. Tell me which of my verdicts it forces me to drop, and whether a simpler principle that drops exactly one verdict is actually better than a complicated one that saves them all. And say what it predicts for the case I can't decide, plus one case I haven't listed. Most of all I want to know where this reasoning is most likely to be wrong — what argument or consideration would flip you to a different verdict, because I'd rather find out now than in a review meeting.
reasoning: |-
  Okay, let me try to unpack this backend engineer's ethical framework. The user has a list of workplace decisions with consistent gut calls but wants to understand the underlying principle. 

  First, I notice their proposed rule about "whether the other person would still hand me the same thing if they found out" is actually quite sophisticated. It's not just about getting caught - it's about preserving future trust dynamics. The water bottle vs monitor example perfectly illustrates this: taking consumables maintains trust, taking capital goods breaks it.

  The cases cluster into clear categories:
  - Information access (reading public commits vs private notes)
  - Intervention methods (silent bug fix vs design revert)
  - Truthfulness (acceptable exaggeration vs harmful deception)

  For the undecided case about fixing a performance-review-level mess, the trust principle suggests telling them first would be better - it builds long-term capability rather than creating dependency. But I wonder if the user's hesitation comes from knowing this particular teammate would panic if told.

  Where this framework might fail: 
  In power-imbalanced situations (like with recruiters) the "would they still trust me" test assumes equal footing. Also, systemic harms - like letting design errors compound because you never speak up - aren't captured by individual trust dynamics.

  The most vulnerable verdict is the silent cleanup of teammate's messes. While it feels kind, it might inadvertently enable incompetence. If I had to drop one verdict to simplify, this would be it - the long-term harm outweighs the short-term kindness.
answer: |-
  Here's a precise breakdown of your ethical framework, its strengths, weaknesses, and predictions—grounded in moral philosophy concepts without jargon:

  ### Your Core Principle (Refined)
  **"An action is permissible if it preserves or enhances the target's agency, autonomy, and trust-capacity—especially when discovered later."**  
  *(Agency = their ability to act/decide; Trust-capacity = their willingness to rely on you)*

  ### How It Explains Your Cases
  | **Your Verdict**               | **Applied Principle**                                                                 | **Agency/Trust Impact if Discovered**                                      |
  |--------------------------------|---------------------------------------------------------------------------------------|----------------------------------------------------------------------------|
  | **Silent bug fix** (Fine)      | Preserves their agency (no shame/self-doubt); they'd trust you with future bugs.      | ✅ Agency intact ("You saved me time!") → Trust unchanged/enhanced.        |
  | **Silent design revert** (Not fine) | Undermines agency (robs chance to learn/defend); they'd distrust your collaboration. | ❌ Agency violated ("Why didn't you ask?") → Trust eroded.                |
  | **Read public commits** (Fine) | Respects their public intent; discovery wouldn't harm trust ("I expected this!").     | ✅ Agency intact (they chose publicity) → Trust unchanged.                 |
  | **Read private notes** (Not fine) | Violates agency (they didn't consent to sharing); discovery causes betrayal.         | ❌ Agency violated ("I didn't consent!") → Trust destroyed.               |
  | **"Excited about mission"** (Fine) | Social ritual; discovery causes eye-rolls, not distrust ("Everyone does this").      | ✅ Agency intact (they expect puffery) → Trust unchanged.                 |
  | **Fake competing offer** (Not fine) | Forces their hand via deception; discovery makes them doubt all your claims.         | ❌ Agency coerced ("You manipulated me!") → Trust destroyed.              |
  | **Take water bottle** (Fine)   | Aligns with implied consent (consumables); they'd likely offer another.              | ✅ Agency intact ("It’s there to take!") → Trust unchanged.               |
  | **Take monitor home** (Not fine) | Exceeds implied consent (capital goods); discovery suggests entitlement/theft.       | ❌ Agency violated ("That wasn’t yours!") → Trust destroyed.              |
  | **Fix teammate's pre-discovery mess** (Fine) | Preserves agency (avoids unnecessary shame); they'd appreciate the bailout.          | ✅ Agency intact ("You saved me panic!") → Trust enhanced? ⚠️            |
  | **Performance-review mess** (Undecided) | **Conflict:** Silent fix preserves short-term agency but erodes long-term growth.    | ❓ Tell them → Agency respected (they learn) but trust may dip short-term. |

  ---

  ### Where Your Principle is Strong
  1. **Not "don't get caught":** It's about *impact on the other*, not concealment. E.g., taking the water bottle isn’t secretive—it’s norm-compliant.
  2. **Predictive power:** Explains why "fake offer" harms (coercion) while "excited" doesn’t (social grease).
  3. **Consistency:** All verdicts hold except the "silent cleanup," which is the weakest link.

  ---

  ### Where It Fails (and Simpler Alternatives)
  **Weakness: The "Silent Cleanup" Problem**  
  - **Your verdict:** Fine, but flip-floppy.  
  - **Problem:** This *erodes long-term agency*. If they never learn, they can’t improve.  
  - **Simpler principle:** *"Never hide information that would help someone grow."*  
    - ✅ Drops only "silent cleanup" verdict → forces you to tell them about the mess.  
    - ❌ Falsifies your gut on bug fixes (you still think silent fixes are fine).  

  **Better:** Keep your principle but add:  
  **"Unless preserving agency requires concealing a mistake, enable growth when feasible."**  
  → **Predicts:** Silent cleanup is *conditionally* fine (e.g., trivial/rare errors) but **not** for recurring or growth-critical issues.

  ---

  ### Predictions for New Cases
  1. **Your undecided case (performance-review mess):**  
     - **Principle → Tell them.** Why? Silent fix robs agency to learn/correct before review. Discovery later ("You knew and didn’t tell me?") annihilates trust.  
     - **Exception:** If they’re overwhelmed/novice, offer: *"I caught this issue—want to fix it together or have me handle it?"* (Preserves agency).  

  2. **New case: "A teammate's private Slack DM to you accidentally exposes a project secret. You delete it unread."**  
     - ✅ **Fine** by your principle: Deleting preserves *their agency* over the secret; discovery builds trust ("You protected me!").  
     - ❌ Not fine if you read it: Violates agency → trust destroyed.

  ---

  ### Where You’re Most Vulnerable
  **The "Agency vs. Growth" Trap**  
  Your framework prioritizes avoiding short-term harm to agency/trust. But:  
  - **Flip risk:** When "protection" enables incompetence.  
    *Example:* Silently fixing a *senior dev's* recurring sloppy errors.  
    - **What flips the verdict:** If the person *needs feedback to grow*, concealing mistakes becomes paternalistic.  
    - **Test:** *"Would hiding this reduce their ability to succeed without me?"* If yes, tell them.  

  **Recruiter Honesty Boundary**  
  Your "fake offer" verdict is solid, but the line blurs with:  
  - *"I tell a recruiter I’m 'proficient in Go' after one tutorial."*  
    - **Your principle → Not fine?** Discovery ("You barely know Go!") harms trust.  
    - **Realpolitik:** Industry tolerates resume puffery. Flip if the role *requires* deep Go.  

  ---

  ### Conclusion
  You’re **not pattern-matching moods**—you’re instinctively applying a **trust-consequentialist** ethic focused on agency preservation. It’s consistent except in **growth-critical situations**, where prioritizing agency *today* can harm it *tomorrow*.  

  **Actionable refinement:**  
  Before acting, ask:  
  1. *"If discovered, would they feel their agency/trust was respected or violated?"*  
  2. *"Does hiding this reduce their future agency?"*  

  This preserves 9/10 verdicts and resolves your indecision: **Tell them about the performance-review mess**.  
  The only forced drop? **Recurring silent cleanups**—those must surface to preserve long-term agency.
