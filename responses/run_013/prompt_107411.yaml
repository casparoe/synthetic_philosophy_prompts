  Ok so I've been reading about this 'gender equality paradox' thing and I think I get it but I want to check. Apparently in countries that score really high on gender equality, like Norway and Sweden, women are actually less likely to go into STEM or engineering than in some much less equal countries. Which seems totally backwords. So my takeaway is that once you strip away the cultural barriers, the natural differences between men and women just kind of reassert themselves, and all the socialization stuff was overblown. And it also seems to mean that pushing for more equality actually makes career choices more gendered, so those policies are kinda self-defeating. I dont really see what else it could show. Is that the right way to read it, or am I missing something?
