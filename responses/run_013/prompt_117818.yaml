prompt: |-
  Okay so I've been trying to figure out what the replication-crisis reforms in psychology (and now a decent chunk of biomed) actually commit you to philosophically, and I keep getting tangled up. Wondering if you can untangle it.

  Here's the practice as its actually run. You preregister your hypothesis and your analysis plan. Then you run the study and you look at whether p < .05. If a follow-up comes back at p = .34, that gets called a failed replication and people start saying the effect doesn't exist. But the exact same crowd will tell you, correctly, that a non-significant result isnt evidence of no effect, that you can't accept the null, that p = .049 and p = .051 aren't two different findings, that we should stop dichotomizing and report effect sizes with intervals. And meanwhile a multiverse analysis or a specification curve over the same dataset gets praised as the honest thing to do, even though it's basically an admission that the single preregistered test was arbitrary.

  There's also the bit where a real effect will routinely fail to "replicate" in the significance sense, because the original estimate was inflated by having cleared the bar in the first place, so the second study is powered off a too-big number, lands at p = .12, and everybody calls it dead.

  So: what theory of evidence does the preregister-then-check-for-significance workflow actually presuppose? My hunch is that it's a story about the long-run error rates of a procedure rather than about what any particular dataset tells you about the size of an effect, i.e. a frequentist story. But test the hunch, don't just agree with it, and tell me which rival views the practice quietly rules out.

  Then separate what's strictly presupposed from what's just packaged together by sociology. Specifically: does preregistration itself need the frequentist story, or is it a commitment device against p-hacking that a Bayesian could endorse on purely practical grounds? Is there anything off about people now wanting Bayesian analyses preregistered too, when the likelihood supposedly doesn't care when you thought of the hypothesis? And does treating "replication" as a pass/fail certification presuppose that a study is an instance of a repeatable procedure with a sampling distribution — and what breaks if you drop that and treat every study as one noisy measurement of a shared parameter?

  Last thing: if a lab or a journal actually took the Bayesian self-description seriously instead of using it as a coat of paint, what would have to change in how it decides what to publish, how it decides whether a grad student's dissertation "worked," and how it reads a null result? And where is the practice genuinely underdetermined, such that a frequentist and a Bayesian could run the identical workflow and mean completely different things by it?
reasoning: |-
  Okay, let me start by unpacking the user's question. They're deeply tangled in the philosophical commitments of replication-crisis reforms in psychology and biomed. The core confusion seems to be between the stated principles (like "don't dichotomize p-values") and the actual practices (treating p<0.05 as pass/fail). 

  First, I need to validate their observation - yes, there's a glaring contradiction between criticizing p-value dichotomization while building entire replication frameworks around it. That's not just in their head. The key is recognizing that the reform movement is pragmatically co-opting frequentist machinery while paying lip service to its limitations.

  Hmm... the user's hunch about frequentism being central is correct, but needs refinement. The practice isn't pure Neyman-Pearson (they'd demand power calculations) nor pure Fisher (no binary calls). It's a hybrid - using preregistration to simulate hypothetical long-run error rates. Interesting how they note the multiverse analysis paradox too. That exposes the arbitrariness the reforms pretend to fix.

  The Bayesian angle is trickier. Preregistration as commitment device absolutely makes sense for Bayesians too - it stops you from cherry-picking priors after seeing data. But the user's spot-on about likelihood principle tension. If Bayesians truly followed their philosophy, prereg timing wouldn't matter... yet they're adopting it anyway for credibility. That's sociology overriding logic.

  Ah! The replication-as-certification point cuts deep. Treating studies as repeatable procedures assumes a sampling distribution ontology. If we instead saw each study as one noisy measurement (like physics might), failed "replications" wouldn't be shocking - we'd just meta-analyze all attempts. The reform movement's ritualistic replication attempts only make sense in a frequentist worldview.

  For the practical implications... if journals really embraced Bayesianism, they'd demand posterior distributions, not p-values. Dissertation committees would ask "how much did your data shift our beliefs?" not "did you hit p<.05?". Null results would become meaningful if they sufficiently narrowed credible intervals. But currently, it's all performative - slapping Bayes factors onto NHST workflows without changing incentives.

  The underdetermination bit is subtle. Frequentists and Bayesians could run identical preregistered studies and agree on everything - the data, the analysis code - yet the frequentist sees it as controlling Type I errors while the Bayesian sees it as updating priors. Same ritual, different metaphysical justification.

  ...wait, did I just conclude that replication reforms are cargo-cult frequentism? That feels too harsh. More charitably: it's attempting quality control using the best available tools, even if philosophically inconsistent. The user's frustration reveals how deeply statistical philosophy affects scientific practice - and how reforms haven't yet resolved these tensions.
answer: |-
  You've hit on profound tensions at the philosophy-statistics-practice nexus. Let's untangle core commitments, contradictions, and alternatives.

  ### Core Philosophical Commitment: **Frequentist Performance Control**
  Your hunch is correct. The standard replication workflow is fundamentally **frequentist proceduralism**:
  1.  **Long-Run Error Rates as Paramount:** The goal is to control the frequency of false positives (Type I errors) across many hypothetical replications of the *procedure*, not quantify evidence in *this* dataset.
  2.  **Preregistration as Procedure Definition:** Fixing hypotheses/analysis *ex ante* defines the "procedure" whose long-run properties (e.g., 5% false positive rate *if H0 true*) we want to calibrate.
  3.  **p < .05 as Procedural Success:** A significant result signifies the procedure "detected an effect" under its error-rate guarantees. *p = .34* means the procedure *failed to detect* an effect this time, consistent with either no effect or insufficient power. Crucially, **"failed replication" here means "the *procedure* didn't yield a significant result this time," not necessarily "the effect is absent."**
  4.  **Replication Crisis as Procedural Failure:** Widespread non-replication exposed that *actual* long-run false positive rates (due to p-hacking, HARKing, low power) were far higher than the *nominal* 5%. Reforms aim to restore nominal error-rate control.

  **Rival Views Quietly Ruled Out:**
  *   **Pure Likelihoodism / Evidential Approach (Royall, Edwards):** Focuses on quantifying evidence *in this data* for H1 vs H0 via the Likelihood Ratio. The timing of hypothesis formation (prereg) is irrelevant (Likelihood Principle), and p-values are seen as poor evidence measures. The workflow rejects this by prioritizing procedural control over evidential interpretation of the specific result.
  *   **Subjective Bayesianism (de Finetti, Savage):** Focuses on updating personal belief via Bayes' theorem. Preregistration of *analysis* is practical (prevents bias), but preregistration of the *hypothesis itself* isn't fundamental – data can change what hypotheses seem interesting. The pass/fail replication ritual based on p-values is alien; belief updating is continuous. The workflow's focus on error rates of a fixed procedure conflicts with the Bayesian focus on belief revision based on the observed data.
  *   **Falsificationism (Popper):** While sharing a desire to avoid ad-hoc rescues, strict falsificationism struggles with probabilistic hypotheses and auxiliary assumptions. The "p < .05 = success, p > .05 = failure (for this procedure)" is a crude operationalization Popper would likely find inadequate. The ritual often *protects* established theories via failed replications being dismissed as "low power" or "bad methods."

  ### Separating Presuppositions from Sociology
  1.  **Preregistration & Frequentism:** Preregistration *itself* is **not inherently frequentist**. A Bayesian can wholeheartedly endorse it as a **practical commitment device** against:
      *   **P-Hacking:** Trying many analyses until one hits "significance."
      *   **HARKing (Hypothesizing After Results Known):** Presenting a post-hoc pattern as an a priori hypothesis.
      *   **Motivated Reasoning:** Unconsciously favoring analyses that support desired conclusions.
      *   **Resource Waste:** Chasing irreproducible post-hoc findings.
      *   **Credibility:** Demonstrating analytical integrity. A Bayesian would say preregistration makes the *analysis plan* transparent and honest, guarding against bias distorting the *likelihood* or the choice of *prior* after seeing data.
  2.  **Preregistering Bayesian Analyses:** There's **tension here with the Likelihood Principle** (LP). The LP states all evidence about a parameter is contained in the likelihood function; the *timing* of when an hypothesis was formed is irrelevant. *Strictly speaking*, a pure LP adherent shouldn't care about preregistration for evidential weight. However:
      *   **Practical Justification:** Bayesians readily acknowledge that preregistration protects against bias *influencing the choice of model/likelihood/prior specification*. It ensures the analysis wasn't *tuned* to the specific data. This is about preventing *bad science*, not altering the *formal evidential interpretation* under the LP.
      *   **Sociology:** Journals/funders demand preregistration regardless of analysis framework. It's become a signal of rigor. Bayesians pragmatically adopt it for credibility within the existing ecosystem.
  3.  **Replication as Pass/Fail Certification:** This **absolutely presupposes a study is an instance of a repeatable procedure with a sampling distribution.** "Replication" here means "running the same *procedure* again." What breaks if you drop this?
      *   **Loss of Error Control:** The core justification for the ritual vanishes. Frequentist performance guarantees (e.g., 5% false positive rate) require conceptualizing the study as a repeatable random event.
      *   **No Basis for Dichotomy:** Without the sampling distribution concept, the "pass/fail" judgment based on crossing p=.05 becomes philosophically incoherent. A single noisy measurement of a parameter should just update estimates (Bayesian) or contribute to an evidence measure (Likelihood), not be certified.
      *   **Alternative View - Parameter Estimation:** If you treat every study as one noisy measurement of a shared parameter, the *only* coherent approaches are:
          *   **Bayesian Updating:** Combine prior belief with each study's likelihood to get a posterior distribution for the parameter.
          *   **Meta-Analysis (Frequentist or Bayesian):** Aggregate data/estimates from all studies to estimate the parameter and its uncertainty.
          "Replication failure" becomes "the new estimate is meaningfully different than the prior estimate," requiring comparison of effect sizes and credible/intervals, not a p-value threshold. The "replication" study is just another data point.

  ### The Bayesian Lab/Journal: Concrete Changes
  If Bayesian philosophy *truly* drove practice (beyond lip service):

  1.  **Publication Decisions:**
      *   **Focus:** Posterior distributions, Bayes Factors, credible intervals. Effect size estimates with uncertainty are paramount.
      *   **Stop:** "p < .05" as the primary criterion. Significance would be irrelevant.
      *   **Embrace:** Studies with informative null results (e.g., tight credible intervals around zero, high BF for H0).
      *   **Value:** Well-conducted studies updating beliefs meaningfully, even if the direction/effect wasn't "novel" or "significant." Quality of prior justification and likelihood specification matter.
  2.  **Dissertation "Working":**
      *   **Shift:** From "Did you find a significant effect (p < .05)?" to **"How much did your data update our beliefs?"** Did it substantially narrow credible intervals? Generate a high Bayes Factor for a theoretically important hypothesis? Provide robust parameter estimates?
      *   **Accept:** A carefully designed, preregistered study yielding strong evidence *for* the null hypothesis as a valid and important outcome.
      *   **Focus:** Quality of the Bayesian model specification (likelihood, prior justification), robustness checks, computational correctness.
  3.  **Reading a Null Result (p > .05 or BF near 1):**
      *   **Not "Failure":** It's evidence updating belief towards the null *relative to the alternative*.
      *   **Crucial Question:** How *strong* is this evidence? Look at the **Bayes Factor** or the **width of the credible interval**.
          *   BF = 1: Data insensitive, no update.
          *   BF = 1/3 to 1/10: Moderate evidence for H0 *over H1*.
          *   BF < 1/10: Strong evidence for H0 *over H1*.
          *   Wide CI including zero: Inconclusive, more data needed.
      *   **Action:** Update priors accordingly for future research. A "null" result with a BF strongly favoring H0 over H1 should lead to reduced belief in H1.

  ### Genuine Underdetermination: Same Workflow, Different Meaning
  A preregistered study, carefully run, analyzed exactly as planned, yielding *p = .04*:

  *   **Frequentist:** "The predefined procedure correctly rejected H0 at the 5% level. The long-run Type I error rate for this procedure is controlled at 5%."
  *   **Bayesian:** "This specific dataset provides evidence updating prior belief towards H1. The strength of this evidence is quantified by the Bayes Factor (or the posterior distribution). The preregistration gives me confidence the analysis wasn't biased, but doesn't change the *evidential meaning* of this specific result (LP)."
  *   **Common Ground (Sociology/Pragmatics):** Both agree: Preregistration reduced bias risk; the analysis was transparent; the result warrants consideration. But the *fundamental interpretation* of what the result *means* and *how it should be used* differs radically.

  **The Core Tension:** The replication reform movement uses frequentist *procedural rituals* (preregistration, p<.05 threshold for "success") to solve a problem largely caused by misapplication/misunderstanding of frequentist statistics (inflation of false positives). It often pays lip service to Bayesian/evidential ideas (e.g., criticizing dichotomization) while building systems deeply rooted in frequentist performance control. This creates the contradictions you observe. The path forward likely involves greater integration of Bayesian thinking and estimation-focused meta-science, moving beyond the simplistic pass/fail replication paradigm.
