prompt: |-
  I build forecast ensembles for a living — I combine lots of models' predictions into one number, so most of my intuitions are about weighting, calibration, correlated errors, and the annoying fact that a plain average often beats a cleverly estimated weighted combination because you pay for estimating the weights. The epistocracy vs. democracy thing I only know from headlines: some people think votes should count more for the competent, other people think everyone's vote counts equally. I'd like you to act as a political philosopher who also actually understands ensembling and forecast combination — not someone who'll just wave at it — and do a serious translation job, then tell me what got lost. Think carefully, and start by brainstorming out loud: what are the real load-bearing claims on each side, and what would count as winning the argument for each?

  Then translate the whole debate into my vocabulary. Voters as ensemble members, competence as accuracy or calibration, the aggregation rule as the combiner, the Condorcet-style argument as the ensemble-accuracy-under-independence result, shared media and echo chambers as correlated errors, "weight by competence" as optimal-weight combination, "one person one vote" as equal weights, sortition as randomisation, majority tyranny as a fairness constraint on the combiner, and so on. Do it claim by claim and be precise about which of my terms you're using loosely.

  Then the part I actually care about: the residue report. Which claims survive the translation cleanly, which survive only with distortion (say what you had to bend), and which have no counterpart in my vocabulary at all? For each bit of residue, tell me whether it's a gap in my framework or evidence that the original claim was vaguer than it sounded. And don't cheat — don't quietly assume my framework's background commitments, like the idea that there's a single target quantity being estimated and the only question is how to estimate it, and then call that a faithful translation. Flag every place you're fudging.

  Two specific things I want a verdict on. (1) Does translating this way make the epistocracy/democracy disagreement look like an empirical question I could in principle settle with a big enough experiment? If so, is that because it really is one, or because my vocabulary can only see the accuracy-shaped part of it? (2) Is there anything in the residue that cuts the other way — something the political theorists understand that I'm missing in my own work on aggregation? Keep it concrete; skip the boilerplate about how this is a rich debate.
