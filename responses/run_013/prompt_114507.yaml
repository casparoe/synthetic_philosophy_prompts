answer: |-
  ## Joint Statement on the Statue and the Clay

  We, the undersigned proponents of the Identity Theory (IT) and the Constitution Theory (CT) regarding the statue/lump case, have engaged in prolonged debate. While fundamental disagreement persists, we recognize significant common ground and believe clarifying the points of agreement, the precise nature of our disagreement, and the crucial tests (cruxes) that might distinguish our views is valuable for progress. We jointly affirm the following uncontroversial claims about the standard case:

  1.  **Physical Coincidence:** There exists a single spatially coincident entity occupying the pedestal at time T1 (before any alteration).
  2.  **Material Composition:** This entity is materially composed *entirely* of a specific quantity of clay (the lump).
  3.  **Artifact Status:** This entity possesses the characteristic shape, features, and intended function of a statue (let's call it "Goliath").
  4.  **Modal Difference (Squash Scenario):** If, at time T2, the entity is forcefully squashed flat:
      *   The statue Goliath ceases to exist.
      *   The lump of clay continues to exist (albeit in a deformed state).
  5.  **Explanatory Requirement:** Any adequate theory must explain the truth of claim 4 (the modal difference) without contradiction.
  6.  **Temporal Coincidence:** The lump and the statue (however conceived) share all their parts and occupy the same space throughout the period they both exist (from the statue's creation until its destruction).
  7.  **Distinct Persistence Conditions:** The lump can survive changes (like being squashed or rolled into a ball) that the statue cannot survive, and vice-versa (the statue requires maintaining a specific form the lump does not).

  **The Core Disagreement:**

  We fundamentally disagree on the *ontological status* of the entity on the pedestal at T1 and the correct explanation for claim 4.

  *   **Identity Theory Formulation (Endorsed by IT Proponent):** The statue *is identical to* the lump of clay. There is only one object present. The phrases "the statue" and "the lump of clay" are two different ways of referring to, or describing, this single object. The apparent difference in modal properties (claim 4) arises because the descriptions "statue" and "lump of clay" carry different persistence conditions *as modes of presentation* of the same underlying entity. Squashing destroys the entity *qua* statue but not *qua* lump because being a statue is a contingent, temporary phase or role of the single lump-of-clay object. Claim 4 is explained by a change in how the single object satisfies (or fails to satisfy) different descriptions under different circumstances.

  *   **Constitution Theory Formulation (Endorsed by CT Proponent):** The statue and the lump of clay are *distinct objects*, even though they are spatially coincident and share all their material parts at T1. The lump *constitutes* the statue, but they are not identical. They have different persistence conditions *as objects*. The statue comes into existence when the lump is shaped appropriately and ceases to exist if that shape is destroyed, while the lump persists through such changes. Claim 4 is explained by the fact that squashing destroys one object (the statue) while the other object (the lump) survives the same event. The relation between them is constitution, a relation distinct from identity, allowing for coincidence without identity.

  **Cruxes: Test Cases and Predictions**

  Our disagreement hinges on deeper metaphysical commitments. The following cases and arguments are accepted by both sides as bearing directly on these underlying issues. We state our contrasting predictions clearly:

  | Crux                                     | Concrete Case/Argument                                                                                                                               | Identity Theory (IT) Prediction                                                                                                                                 | Constitution Theory (CT) Prediction                                                                                                                                 |
  | :--------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **1. The Necessity of Sortals for Counting:** Does "how many objects are here?" require specification of a sortal term (e.g., "statues," "lumps")? Is counting inherently sortal-relative? | **The Pedestal Question:** Consider the entity(ies) on the pedestal at T1. Pose the question: "How many *things* (simpliciter) are on the pedestal?" without specifying a kind. | **IT Predicts:** The question is ill-formed or misleading. There is only one *object* present. Asking "how many things?" without a sortal invites confusion. The correct answer requires a sortal: "One statue," "One lump." | **CT Predicts:** The question is meaningful and has a definite answer: **Two things** (the statue and the lump) are on the pedestal. Counting things simpliciter reveals distinct coincident objects. |
  | **2. Persistence and Reformation:** What do judgments about "the same statue" track when a lump is squashed and later re-formed? | **The Reformation Case:** At T1: Statue Goliath (constituted by Lump L) is on the pedestal. At T2: Lump L is squashed flat. Goliath is destroyed. Lump L survives. At T3: Lump L (the very same lump) is carefully re-shaped into a statue indistinguishable in form and function from the original Goliath. Call this new statue "Goliath*". Is Goliath* numerically identical to the original Goliath? | **IT Predicts: No.** The original Goliath was identical to Lump L. When L was squashed at T2, that single object ceased to be a statue. Reshaping L at T3 creates a *new* statue (Goliath*) composed of the same matter (L). Goliath and Goliath* are distinct statues, despite being made of the same lump sequentially. | **CT Predicts: No.** The original statue Goliath was a distinct object from Lump L and was destroyed at T2. Goliath* is a new statue constituted *by the same lump L* at T3. The persistence of L allows for a new statue to be constituted from the same matter later, but it is not the *same statue object* as Goliath. |
  | **3. Leibniz's Law & Properties:** Can two objects share all properties at a time yet be distinct? Does the modal difference violate Leibniz's Law? | **Argument from Modal Properties:** IT claims only one object exists. CT claims two objects exist coincidentally at T1. Do they share all properties? | **IT Predicts:** There is only one object, so no violation of Leibniz's Law occurs. The apparent modal properties belong to the object *under different descriptions*. The object itself only has the properties it has; the modal differences are differences in how it is conceptualized or described. | **CT Predicts:** The statue and the lump *do* share all their non-modal, non-historical properties at T1 (color, shape, mass, location, parts). However, they have different *modal* properties (e.g., "can survive being squashed"). This difference in modal properties demonstrates they are distinct objects, consistent with a suitably qualified version of Leibniz's Law (e.g., only requiring indiscernibility of *actual, non-modal* properties at a time for coincidence). |

  **Potential Verbal Element:**

  Both sides agree that part of the dispute *might* hinge on the scope of the term "object" within fundamental ontology. The IT proponent typically employs a more restrictive, matter-based or spacetime-region-based criterion for objecthood. The CT proponent employs a more liberal criterion, allowing distinct objects to be constituted by the same matter at the same time if they belong to different kinds with different persistence conditions. **Therefore, the question "How many *objects* are there?" might be answered differently by each theory partly because they define 'object' differently.** However, both sides maintain that their respective uses of 'object' capture a genuine metaphysical distinction (or lack thereof) that has significant explanatory consequences (especially regarding the modal differences in claim 4), making the disagreement substantive and not merely verbal. The cruxes above are designed to probe these substantive differences in explanation and prediction.

