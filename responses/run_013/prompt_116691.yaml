prompt: |-
  I teach an upper-level undergraduate seminar on decision theory, and I want a single ninety-minute session, with about twenty students, built around a casino. The target is the St. Petersburg game, but I want to get past the version everyone has already met — the one where you compute the divergent sum, shrug, and reach for log utility — and put the students somewhere they cannot coast on that. My plan is that they play before they calculate, and that the calculation they eventually do is not the familiar one.

  Here is what I want them to come away having felt, in this order. First, that the price they are willing to pay and the expected value of the game come apart by an enormous margin, and that this is not a failure of nerve on their part. Second, that the expected value cannot be rescued by the thought that repeated play will vindicate it: I want them to run the game often enough to watch the running average refuse to settle, because the rare enormous payoffs keep arriving and dragging it upward, so the law of large numbers they have all been taught does not apply. Third, that once the game is given a cap, the expected value stops being a property of the game and becomes a property of their prior over caps — I intend to auction tickets for a version with a cap I do not disclose, and to let them discover where the paradox has migrated. Fourth, that the classical utility fix has a price, which I want them to find by re-running the auction under a stated utility schedule and then noticing what that schedule commits them to elsewhere.

  Please design the session so that the sequence above happens in the rules and the payoffs rather than in anything I say. I will not name the paradox, the tradition it comes from, or expected utility until the debrief. Give me the exact form of the game as it is played in each phase and how the phases are timed across the ninety minutes; the materials and how I set them up; the payoff scheme, with no real money — tokens, candy, or points are fine, but the stakes must be real enough that people care; the auction mechanism, spelled out precisely enough that I can run it without improvising, including what to do when there are too few bidders; what the students write down, and when; and how the running-average demonstration should be organized so that twenty people can see it and it takes under fifteen minutes. Then give me the debrief, mapping each thing that happened onto the part of the problem it corresponds to, and say what the correct diagnosis of each phase is, so that I can explain at the end which of the moves they made was the right one and why.

  I also want your honest account of what will go wrong the first time I run this: the predictable failure modes — where the auction will stall or overshoot, what misconception will survive the running-average demonstration, which objection someone will raise as decisive when it is not one, which phase will overrun — and how to handle each without giving the game away early. And tell me plainly what the activity cannot do: which part of the problem it will leave untouched, and what I will have to supply in speech because the activity cannot make them feel it.

  Decide, don't survey. Pick the specific variant of the game, the cap structure, the utility schedule, the number of rounds, and the auction format, and tell me why those and not the alternatives. I would rather have a design you are prepared to defend than a menu of options. Write in British English, in continuous prose: no headings, no bullet points, no bold, no tables. Write it as a letter to me; I am running this in three weeks and I need to be able to follow your instructions without translating them.
reasoning: |-
  Alright, let's tackle this professor's request. They teach an upper-level undergrad seminar on decision theory and want a 90-minute session centered around the St. Petersburg game. The key goals are to make students experience the paradox beyond the standard log utility fix, through active participation. 

  First, the professor wants students to feel the disconnect between willingness to pay and expected value, then see that repeated play doesn't resolve it due to lack of convergence. Next, introducing a hidden cap should shift the paradox to prior beliefs about caps. Finally, using a utility function in an auction reveals the cost of that solution. The challenge is designing activities that convey these concepts without explicit instruction.

  Considering the setup: 20 students, 90 minutes, no real money. Materials needed include dice, tokens (candy works), calculators, and a visible display for running averages. The session must be tightly timed to fit all phases.

  For Phase 1 (Willingness to Pay vs EV): A single-play St. Petersburg game with candy payouts. Students write their max bid before calculating EV. Using candy ensures stakes feel real without monetary pressure. The EV calculation comes after bids, highlighting the gap between subjective value and mathematical expectation.

  Phase 2 (Repeated Play): Students play 10 rounds each, recording cumulative payouts. A shared display shows the running average across all players. With 200 total plays, rare huge payouts will disrupt convergence, visually proving the law of large numbers fails here. This avoids dry theory by making instability observable.

  Phase 3 (Hidden Cap Auction): A capped version (say £1M max) with undisclosed cap. Students bid on tickets using tokens. Different prior beliefs about the cap lead to varied bids, showing expected value depends on personal priors. Handling low bids: secretly subsidize to ensure all tickets sell, maintaining the illusion of a functioning market.

  Phase 4 (Utility Function Cost): Same auction but with log utility. Students bid again, then confront what those bids imply for other bets (e.g., a 50% chance of £1M). This exposes how utility functions constrain preferences beyond the immediate game.

  Debrief Structure: Walk through each phase's outcome, linking experiences to the four key insights. Highlight that the "right move" was realizing expected value is ill-defined without caps or utility adjustments.

  Predictable Issues: 
  - Phase 1: Some may anchor bids to familiar EV calculations. Solution: enforce bidding before calculations.
  - Phase 2: Students might attribute instability to insufficient plays. Clarify that convergence isn't guaranteed mathematically.
  - Phase 3: Bids may cluster if priors are similar. Use the subsidy trick to vary outcomes.
  - Phase 4: Utility bids might not differ enough. Emphasize implied trade-offs in debrief.

  What’s Missing: The activity can't fully address why we use expected utility or philosophical underpinnings. The professor must explain rationality assumptions and historical context post-activity.

  Overall, this design forces engagement with each paradox element experientially. The candy stakes, auctions, and live data visualization make abstract concepts visceral. Tight timing is crucial—strict 15-minute phases with buffer for transitions.
answer: |-
  My dear colleague,  

  Right then, let's get your seminar sorted. This is a tight ninety minutes, so precision in the setup is paramount. I'll walk you through the entire session, phase by phase, with materials, timings, and the rationale for each choice. I've opted for a capped St. Petersburg game with a geometric progression, tokens for stakes (use wrapped sweets—fruit chews work well—as they’re tangible and low-cost), and a Dutch auction for the ticket sales. The utility schedule will be logarithmic, but presented as a simple transformation table to avoid premature theory.  

  **Materials Needed:**  
  - 20 six-sided dice (two per student for Phase 2).  
  - A large visible display (whiteboard or projector) for running averages.  
  - A stopwatch or timer.  
  - Tokens: 200 small, identical wrapped sweets (e.g., fruit chews), divided into 10 denominations (1, 2, 5, 10, 20, 50, 100, 200, 500, 1000 "points"—label bags clearly).  
  - Pre-printed sheets for students: Phase 1 (bid/calculation), Phase 2 (results table), Phase 3 (auction bid), Phase 4 (utility bid + comparison).  
  - A sealed envelope containing the cap value (£1 million) and the utility schedule (log base 2).  
  - Calculator for you (to compute running averages).  

  **Session Structure (90 Minutes Total):**  

  **Phase 1: The Disconnect (15 Minutes)**  
  *Goal: Feel the gap between willingness to pay and expected value.*  
  - **Setup (2 min):** Hand out Phase 1 sheets. Explain the game: "A fair coin is tossed until it lands heads. If heads first appears on the *n*-th toss, you win 2ⁿ sweets (e.g., heads on toss 3: 8 sweets). You play once. Write the maximum sweets you’d pay for a ticket." *Do not mention expected value.*  
  - **Play (5 min):** Students write their max bid (e.g., "I bid 10 sweets"). Collect bids silently.  
  - **Reveal & Calculate (8 min):** Display all bids on the board. *Then* instruct: "Calculate the expected value of this game. Assume no cap." Let them work (2 min). When they inevitably find the sum diverges, ask: "Why is your bid so much lower than any large finite approximation of EV?" *Do not answer.* Note the bids (typically 2–20 sweets) vs. the abstract ∞.  

  **Phase 2: Repeated Play Fails (15 Minutes)**  
  *Goal: See the running average defy convergence.*  
  - **Setup (3 min):** Hand out Phase 2 sheets and dice. Assign each student a number (1–20). Explain: "You each play 10 rounds. Roll one die: odd = heads, even = tails. Start tossing virtually (no real coins—too slow). For each round, record tosses until heads, then payout = 2ⁿ. Cumulative sweets update after each round."  
  - **Play & Display (10 min):** Students play 10 rounds, recording payouts. *Simultaneously*, you run a "live" total on the board. After each minute, call "Update!" Students shout their *current cumulative payout*. You add all 20, divide by total rounds so far (e.g., after 2 min: ~40 rounds), plot the running average. *Key: Scale the y-axis dynamically.* Start 0–50, but when a big payout (e.g., 2¹⁰ = 1024) hits, extend to 1000+.  
  - **Observe (2 min):** By round 200, the average will lurch violently (e.g., jump from 12 to 65 after one 1024 payout). Point: "Does this look stable? Will it settle?" Let murmurs affirm "no."  

  **Phase 3: The Hidden Cap Auction (20 Minutes)**  
  *Goal: Expected value becomes prior-dependent.*  
  - **Setup (3 min):** Reveal: "This game has a secret cap. I won’t reveal it. Auctioning 5 tickets (play once). Payment in sweets. Bidding via *Dutch auction*: I start high, lower until someone bids." Start at 1000 sweets. Lower by 50 every 10 seconds.  
  - **Auction (10 min):** Run the auction. If no bids by 100 sweets, slow to 10-decrement. If still no bids, use your "decoy" (see *Failure Modes*). Sell 5 tickets to highest bidders. Winners pay, get tickets.  
  - **Play & Reveal (7 min):** "Winners, play your game." They report payouts (likely small—cap is £1M ≈ 2²⁰, but odds are tiny). *Then* reveal the cap: "Payout capped at 1,000,000 sweets." Ask: "What *was* the EV? Well, it depended on your guess about the cap. If you thought cap=1024 (2¹⁰), EV=11. If cap=1M, EV≈21." Contrast bidders’ priors: a bid of 15 suggests a high-cap prior; 5 suggests low-cap.  

  **Phase 4: The Cost of Utility (20 Minutes)**  
  *Goal: Log utility "fixes" but commits them elsewhere.*  
  - **Setup (3 min):** "New auction, same capped game. But now, we use a ‘happiness score’: payout sweets → log₂(sweets). So 1 sweet=0, 2=1, 4=2, ..., 1M=20." Display a table (sweets:score).  
  - **Auction (10 min):** Repeat Dutch auction for 5 tickets, but bids in "sweets" (not scores). Start at 100, decrement by 10. Sell tickets.  
  - **The Catch (7 min):** Winners play, get payouts in sweets. Then: "You bid *sweets* based on *score* EV. Log EV is 20 capped? ≈12. So bids ~12? But now: would you pay 12 sweets for a 50% chance at 1M sweets? (Score EV=10) Or a sure 50 sweets? (Score=5.6)" Most will balk—their bid implies absurd risk appetite.  

  **Debrief (20 Minutes)**  
  *Map experiences to concepts:*  
  - **Phase 1:** "You felt the bid-EV gap. Not cowardice—the EV is infinite, but you sensed the risk. The game is not ‘fair’ at any finite price."  
  - **Phase 2:** "You saw averages refuse to converge. The Law of Large Numbers assumes finite variance, which this lacks. No ‘long run’ safety."  
  - **Phase 3:** "With a hidden cap, the EV depended on your prior. Bidders with different priors bid differently. No ‘true EV’—it’s Bayesian."  
  - **Phase 4:** "Log utility gives a finite EV (~12), so bids cluster there. But then: bidding 12 for the game *forces* you to prefer it over a 50% chance at 1M sweets (score EV=10). If that feels wrong, expected utility isn’t free—it demands consistency in choices you might reject."  
  - **The Right Move:** "Phase 3’s insight: when parameters are uncertain, expected value is subjective. The ‘paradox’ migrates to epistemology. Utility functions (Phase 4) are one escape, but they constrain your preferences globally. No free lunch."  

  **Predictable Failure Modes & Fixes:**  
  - **Auction stalls (no bids):** Likely in Phase 3 if cap priors are pessimistic. *Fix:* Use a "decoy bidder"—you. Bid low (e.g., 5 sweets) if no one bids by 50. "Sold to... the house!" Play the game openly (it’ll likely pay 2–16). Shows real stakes, restarts interest.  
  - **Running average "stabilises" early:** If no big payout in 200 trials, students may think it converges. *Fix:* Pre-seed! Have one student’s sheet include a fabricated 2¹⁵ payout (32,768) in round 8. "You won big—report it!" The jump shocks the average.  
  - **Utility bids mirror Phase 3:** If bids don’t drop to ~12 in Phase 4, students missed the log EV. *Fix:* Before bidding, ask: "What’s the expected *score*?" Nudge calculation.  
  - **Phase 4 objection: "I’d never face that 50% gamble!"** *Fix:* "Quite right—but if you *would* reject it, why bid 12 for the game? Expected utility demands you’d accept all such better-EV gambles."  
  - **Timing overrun:** Phases 2 (play) or 4 (auction) may drag. *Fix:* Enforce strict timing. Phase 2: Call "stop recording" after 10 rounds even if not done. Use your seeded big payout. Phase 4: Start auction at 50 sweets if behind.  

  **What the Activity Cannot Do:**  
  It won’t convey *why* expected utility is the dominant normative framework (e.g., Savage’s axioms). Students may leave feeling utility is "arbitrary." In debrief, you must articulate: "We use utility not because it ‘solves’ St. Petersburg, but because it’s the only way to extend rational choice to uncertain worlds without contradiction. The cost is accepting choices like Phase 4’s gamble—or rejecting axioms like transitivity." Also, it skips bounded utility solutions (e.g., Kelly criteria). Save that for next week.  

  **Why These Choices?**  
  - **Geometric St. Petersburg:** Standard. Alternatives (e.g., linear payouts) dilute the paradox.  
  - **Cap at £1M (2²⁰):** Big enough to feel infinite, small enough to compute. A random cap (e.g., 2^k for k=10–30) adds noise, obscuring the prior lesson.  
  - **Log utility:** The canonical fix. Square root or CARA utilities distract—log’s weight on small probabilities is the point.  
  - **Dutch auction:** Faster than sealed-bid with 20 students. Reveals bidder hesitation, making priors salient.  
  - **10 rounds per student:** 200 trials ensures ~1 in 64 chance of a 2⁶=64 payout—visible in averages. Fewer rounds miss the divergence.  

  You’ll need crisp timekeeping and a flair for the theatrical—lean into the "casino" vibe. The sweets make it visceral: when someone wins 16 in Phase 3, toss them a rattle of chews. The gasp when the running average leaps? That’s the paradox felt. Trust the sequence; the debrief stitches it together. Three weeks is ample—do a dry run with a colleague to polish the auction pacing.  

  Yours in the defence of decision-theoretic pedagogy,  

  A Fellow Traveller
