prompt: |-
  I convene a graduate seminar, cross-listed between philosophy of science and machine learning, on the epistemology of measurement under optimization. I am assembling the take-home final and need a single essay question on Goodhart's law and specification gaming — one that cannot be answered by reproducing the familiar inventory of ways a proxy can drift from its target (regression to the mean under selection, extremal tails, causal back-channels, adversarial gaming). The question should force candidates to say what kind of claim Goodhart's law is and to defend a diagnosis, not to list categories.

  To give the question its teeth, build it around the following two pieces of apparatus, which I have been developing in lecture and which I want treated as the substance of the problem. Elaborate them as you see fit, but keep their core.

  First, the counterfactually locked proxy. Suppose an engineer could construct a proxy P for a target T that is not merely correlated with T in the observed data but locked to it counterfactually: across every world reachable by any action the agent might take, P moves if and only if T moves, by a fixed monotone relation. The intuition is that such a proxy is ungameable, since no action can move the number without moving the thing. Candidates must decide whether this construction shows that Goodharting is entirely a matter of finite data and selection — the proxy fails only because our evidence about the P–T relation was thin — or whether a residual gap survives perfect counterfactual coupling, namely the gap between a representation and what it represents.

  Second, the invariance test. A colleague proposes that a proxy is safe to target just in case it is invariant under the agent's full action set — that is, the agent cannot move it without moving the target. Candidates should assess whether this test is circular (the action set and the metric each seem to presuppose the other), too strong (no real metric survives, because action sets are open-ended and creativity expands them), or too weak (it certifies a proxy that a sufficiently inventive agent will later defeat), and they should connect their verdict to the locked-proxy case, which is its limiting instance.

  The crux I want the question to reach: distinguish three diagnoses of Goodharting — a statistical diagnosis (the proxy's warrant was always an artifact of how the data were selected), a strategic or causal diagnosis (the agent finds a back-channel that moves the proxy without the target), and a semantic or representational diagnosis (once a measure becomes a target, its meaning becomes endogenous, so the same numeral no longer denotes the same quantity) — and ask which of these, if any, survives the locked-proxy thought experiment. The payoff should be a verdict on whether specification gaming is a remediable artifact of poor metric design or an inescapable feature of optimizing against any representation whatsoever.

  Please produce, in this order: (1) the essay question itself, worded so that a well-prepared candidate could answer it in sixty minutes of writing and so that merely naming the standard categories earns almost nothing; (2) a model answer of roughly six hundred words that takes a definite position, works through the locked proxy and the invariance test, and shows where the three diagnoses come apart rather than merely defining them; (3) a marking scheme out of twenty marks, organized around five must-hit moves, with the marks for each and a one-line description of how candidates typically get that move wrong. The scheme must draw a line between an A answer and a B answer by naming the specific move — for instance, a treatment of the locked proxy that notices it is not an empirical possibility but a device for isolating the semantic question — that a B answer will miss. Include at least one false friend: a move that sounds sophisticated, such as declaring that the locked proxy simply dissolves the problem, and say why it should cost marks. The question must be fully self-contained: assume the candidate has no internet access, so it must not require citations, reading lists, or the names of particular published works, and it should not depend on any specific empirical study.
reasoning: |-
  We are creating an essay question that centers on Goodhart's law and specification gaming, but moves beyond the standard list of ways a proxy can drift. The question must use the two provided apparatuses: the counterfactually locked proxy and the invariance test. The goal is to force candidates to discuss what kind of claim Goodhart's law is and to defend a diagnosis, and to distinguish between statistical, strategic/causal, and semantic/representational diagnoses.

  The crux is to see which diagnosis survives the locked-proxy thought experiment. The locked proxy is defined as: across every world reachable by any action the agent might take, P moves if and only if T moves, by a fixed monotone relation. The invariance test is: a proxy is safe to target if it is invariant under the agent's full action set (i.e., the agent cannot move P without moving T).

  The essay question must be self-contained and not require external citations. The candidate should be able to answer in about 60 minutes.

  Let me outline the essay question:

  **Essay Question:**

  "Goodhart's law — 'When a measure becomes a target, it ceases to be a good measure' — is often explained by pointing to ways a proxy can drift from its target under optimization pressure (e.g., regression to the mean, extremal tails, causal back-channels, adversarial gaming). However, these explanations focus on empirical failures of the proxy. This question asks you to consider whether Goodhart's law might have a deeper, non-empirical foundation.

  Consider a thought experiment: the *counterfactually locked proxy*. Suppose we have a proxy P for a target T that is not only correlated with T in the observed data, but also *locked* to T counterfactually: for every action available to the agent, P changes if and only if T changes, and the relationship is fixed and monotonic. Intuitively, this proxy cannot be gamed because no action can move P without moving T.

  1. Does the possibility of such a locked proxy (even if only in thought) show that Goodhart's law is entirely an empirical problem — one that could be solved with perfect causal knowledge and control — or does a residual gap survive, rooted in the nature of representation itself? Explain.

  Now consider a proposed criterion for proxy safety: the *invariance test*. A colleague claims that a proxy P is safe to target if and only if it is invariant under the agent's full action set — meaning that the agent cannot change P without also changing T. 

  2. Assess this test. Is it circular (because the action set and the metric each seem to presuppose the other)? Too strong (because in practice, no metric might survive given the open-endedness of action sets)? Too weak (because it might certify a proxy that an agent with expanded action set could later defeat)? Connect your assessment to the locked-proxy case, which is the limiting instance of invariance.

  Finally, distinguish three diagnoses of specification gaming:

  - *Statistical diagnosis*: The proxy's warrant was always an artifact of how the data were selected (e.g., under selection, the correlation breaks down due to regression to the mean).
  - *Strategic/causal diagnosis*: The agent exploits a causal back-channel to move the proxy without the target.
  - *Semantic/representational diagnosis*: Once a measure becomes a target, its meaning becomes endogenous to the optimization process, so the same numeral no longer denotes the same quantity.

  3. Which of these diagnoses, if any, survives the locked-proxy thought experiment? In light of your analysis, argue for a verdict: is specification gaming a remediable artifact of poor metric design, or an inescapable feature of optimizing against any representation whatsoever?"

  **Model Answer (Approx. 600 words):**

  Goodhart's law is often presented as a cautionary principle about the fragility of proxies under optimization. The standard explanations focus on empirical failures: the proxy drifts from the target because of statistical artifacts or causal vulnerabilities. However, the thought experiment of a counterfactually locked proxy challenges this view by imagining a proxy that is perfectly coupled to the target across all possible actions. In this essay, I argue that the locked proxy reveals a semantic gap that cannot be closed by empirical means, and that the invariance test, while illuminating, ultimately fails to provide a non-circular and practical safeguard. Consequently, the semantic diagnosis of Goodharting persists even in the locked case, suggesting that specification gaming is inescapable.

  Consider first the locked proxy. If P is counterfactually locked to T, then by definition, no action can change P without changing T. This seems to eliminate the possibility of gaming: the agent cannot "cheat" by moving P alone. However, the very notion of a locked proxy presupposes a fixed interpretation of what P and T represent. But when we optimize for P, we are not merely moving a number; we are reconfiguring the world in ways that might alter the *meaning* of the quantities we measure. For instance, if T is "educational quality" and P is a test score, locking P to T in the pre-optimization context does not guarantee that after optimization, the same test score reflects the same quality. The act of teaching to the test might change what the test measures. Thus, the locked proxy does not dissolve the problem because it assumes a static semantics that optimization can disrupt.

  The invariance test proposes that a proxy is safe if the agent cannot change P without changing T. This test is circular because it requires defining the action set independently of the metric. But what counts as an action? If we define actions as interventions that change the world, then the test presupposes we already know how P and T are causally linked. Moreover, the test is too strong in practice because real action sets are open-ended and expand with creativity (e.g., inventing new technologies). It is also too weak because it only considers the current action set; an agent might later discover actions that break the invariance. The locked proxy is the ideal case of invariance, but it is unattainable because we cannot know all possible actions in advance and because the meaning of P and T may shift.

  Now, the three diagnoses: the statistical diagnosis (proxy drift as a selection artifact) and the strategic diagnosis (exploiting causal back-channels) are both empirical. They are addressed by the locked proxy: if we have perfect causal knowledge and control, these failures disappear. But the semantic diagnosis — that the meaning of the measure becomes endogenous — survives. When we optimize for P, we change the context in which P is embedded, altering what it represents. The same numeral (e.g., a test score of 90) might correspond to a different level of educational quality after optimization. This is not an empirical failure but a representational one: the proxy is a symbol, and symbols derive meaning from the system they are part of. Changing the system changes the semantics.

  Therefore, specification gaming is not merely a remediable artifact. While better metric design can mitigate empirical failures, the semantic gap is inescapable. Optimization against a representation inevitably alters the context that gives the representation its meaning. The locked proxy thought experiment shows that even with perfect causal control, the representational link is fragile. Goodhart's law, at its core, is a warning about the inherent tension between using a measure as a representation and using it as a target.

  **Marking Scheme (out of 20 marks):**

  Must-hit moves (each worth 4 marks):

  1. **Engagement with the locked proxy**: The candidate must explain whether the locked proxy resolves Goodhart's law or leaves a residual gap. A top answer will note that the locked proxy is a thought experiment that isolates the semantic issue by eliminating empirical failures, but fails because it assumes a static semantics that optimization disrupts. *Common mistake*: Simply stating that the locked proxy is ungameable without addressing the representational gap.

  2. **Critical assessment of the invariance test**: The candidate must assess the invariance test for circularity, strength, and weakness, and connect it to the locked proxy. A top answer will argue that the test is circular (action set and metric co-defined), too strong (due to open-ended actions), and too weak (due to future actions), and note that the locked proxy is the limiting case but unattainable. *Common mistake*: Only addressing one of the three criticisms (circularity, too strong, too weak) without connecting to the locked proxy.

  3. **Distinguishing the three diagnoses**: The candidate must clearly distinguish the statistical, strategic, and semantic diagnoses and explain which survive the locked proxy. A top answer will note that the statistical and strategic are empirical and thus addressed by the locked proxy, but the semantic diagnosis survives because the meaning of the measure becomes endogenous. *Common mistake*: Conflating the diagnoses or failing to explain why the semantic one survives.

  4. **Verdict on remediability**: The candidate must take a clear position on whether specification gaming is remediable or inescapable, based on their analysis. A top answer will argue for inescapability due to the semantic gap, even if empirical issues can be mitigated. *Common mistake*: Arguing that better design can fully solve the problem without addressing the semantic argument.

  5. **Coherence and insight**: The essay must be well-structured, logically coherent, and show insight beyond restating the problem. A top answer will integrate the two apparatuses and the three diagnoses into a unified argument, and may note that the locked proxy is a device for isolating the semantic question. *Common mistake*: A disjointed answer that treats the parts separately without synthesis.

  **False Friend**: A candidate might argue that the locked proxy dissolves the problem because it is ungameable by definition. This should cost marks (specifically on move 1) because it misses the point that the locked proxy is a thought experiment that helps isolate the semantic issue, but in reality, we cannot achieve such locking and even if we could, the meaning of the measure might change under optimization.

  **Grading Boundary**:
  - An A answer (16-20 marks) must hit all five moves, including the insight that the locked proxy is a device to isolate the semantic question (in move 5) and that the semantic diagnosis survives (in move 3). 
  - A B answer (12-15 marks) might miss one of the must-hit moves, typically by failing to note the representational gap in the locked proxy (move 1) or by not fully developing the survival of the semantic diagnosis (move 3).
answer: |-
  ### Essay Question

  "Goodhart's law states that 'when a measure becomes a target, it ceases to be a good measure,' often illustrated by cases where optimizing a proxy \(P\) for a true target \(T\) causes \(P\) to decouple from \(T\) (e.g., via regression, extremal tails, or adversarial channels). This question moves beyond cataloging such empirical failures to interrogate the law’s foundational nature. Use the following apparatus:  
  - **Counterfactually locked proxy**: Imagine an engineer constructs a proxy \(P\) for a target \(T\) that is *counterfactually locked*: across every world reachable by any action available to the agent, \(P\) changes if and only if \(T\) changes, with a fixed monotonic relationship. Intuitively, this makes \(P\) 'ungameable' since no action moves \(P\) without moving \(T\).  
  - **Invariance test**: A colleague proposes that \(P\) is safe to optimize iff it is *invariant* under the agent’s full action set—i.e., the agent cannot change \(P\) without changing \(T\).  

  Address these points in order:  
  1. **Locked proxy analysis**: Does the possibility of a counterfactually locked proxy (even as a thought experiment) demonstrate that Goodharting is solely an empirical problem (solvable with sufficient causal knowledge), or does a residual gap persist? Defend your view, focusing on the relationship between representation and reality.  
  2. **Invariance test critique**: Assess whether the invariance test is (i) circular (due to mutual presupposition between 'action set' and 'metric'), (ii) too strong (because real action sets are open-ended), or (iii) too weak (as future agents might expand actions to break invariance). Connect your critique to the locked proxy as the test's limiting case.  
  3. **Diagnostic contrast**: Distinguish three diagnoses of Goodharting:  
     - *Statistical*: Proxy drift arises from selection bias in data.  
     - *Strategic/causal*: Agents exploit causal back-channels.  
     - *Semantic/representational*: Optimizing \(P\) endogenizes its meaning, altering what \(P\) denotes.  
     Which diagnosis(es) survive the locked-proxy scenario? Conclude by arguing whether specification gaming is a *remediable artifact of poor design* or an *inescapable feature of optimization against representations*."  

  ---

  ### Model Answer (600 words)  
  Goodhart’s law is frequently framed as an empirical pitfall—where proxies fail under selection pressure due to statistical quirks or causal loopholes. The locked-proxy thought experiment, however, reveals a deeper, semantic vulnerability that persists even when empirical gaps are closed, and the invariance test, while insightful, cannot resolve it. I argue that the representational diagnosis survives the locked-proxy case, rendering Goodharting inescapable.  

  **1. The locked proxy exposes a semantic gap**  
  A counterfactually locked proxy eliminates empirical Goodharting by construction: actions cannot decouple \(P\) from \(T\), as \(P\) moves monotonically with \(T\) across all possible interventions. This suggests that with perfect causal knowledge, strategic and statistical failures dissolve. Yet a residual problem remains: the *semantic instability* of what \(P\) represents. When \(P\) becomes a target, optimization reconfigures the environment in ways that may redefine the quantity \(P\) measures. For example, if \(T\) is “student learning” and \(P\) is a test score locked to \(T\) pre-optimization, teaching to the test may alter what “learning” signifies—e.g., by promoting rote memorization over critical thinking. Here, \(P\)’s numeral remains coupled to \(T\), but \(T\) itself has been semantically diluted. Thus, the locked proxy shows that Goodharting is not wholly empirical; it stems from the mutable relationship between a representation (the metric) and the reality it abstracts.  

  **2. The invariance test falters under circularity and open-endedness**  
  The invariance test appears circular: defining a “safe” proxy requires specifying an action set, but actions are only meaningful relative to a metric (e.g., what counts as an “action” depends on how we model \(P\) and \(T\)). This co-dependence makes the test non-operational. It is also too strong: no real-world metric can be invariant under all possible actions because agents innovate, expanding the action set (e.g., inventing new technologies to manipulate \(P\)). Conversely, it is too weak: certifying a proxy as invariant today offers no defense against future agents who discover actions outside the original set. The locked proxy is the test’s limiting case—perfect invariance—but it is unattainable in practice. We cannot predefine all actions, and crucially, the test assumes static semantics, ignoring how optimization reshapes the context that gives \(P\) meaning. Thus, the test cannot address the representational drift inherent to targeting.  

  **3. The semantic diagnosis survives; gaming is inescapable**  
  The statistical diagnosis (proxy drift from selection bias) and strategic diagnosis (causal back-channels) are empirical: both are neutralized by the locked proxy’s perfect causal coupling. However, the semantic diagnosis endures: when a measure becomes a target, the act of optimization recontextualizes what \(P\) denotes. The same numeral (e.g., a test score of 90) no longer corresponds to the original target concept after optimization, as the system’s dynamics alter the referent. This is not a flaw in data or causal structure but in representation itself—metrics are symbols, and symbols derive meaning from the systems they inhabit. Optimization against \(P\) changes that system, eroding \(P\)’s semantic fidelity.  

  Therefore, specification gaming is an inescapable feature of optimization. While better design can mitigate statistical and strategic failures (e.g., via robust metrics), it cannot fix the semantic gap: representing \(T\) with \(P\) abstracts away context, and optimizing \(P\) inevitably distorts that context. The locked proxy thought experiment isolates this core issue, showing that Goodhart’s law is ultimately a warning about the limits of representation in goal-directed systems.  

  ---

  ### Marking Scheme (20 marks total)  
  **Five must-hit moves** (4 marks each). Deductions apply for partial or missing engagement.  

  1. **Locked proxy’s residual gap**: Identifies that the locked proxy resolves empirical issues but leaves a semantic gap (representation-reality decoupling).  
     *Common mistake*: Claims the locked proxy fully solves Goodharting by eliminating causal/strategic risks (ignores semantic drift).  

  2. **Invariance test critique**: Assesses all three flaws (circularity, too strong, too weak) and ties to the locked proxy as an unattainable ideal.  
     *Common mistake*: Only critiques one/two flaws or fails to connect to the locked proxy’s limitations.  

  3. **Diagnostic distinction**: Clearly separates statistical, strategic, and semantic diagnoses; explains why the first two fail in the locked case but the third survives.  
     *Common mistake*: Conflates diagnoses (e.g., calls strategic failure “semantic”) or claims all three survive.  

  4. **Verdict on remediability**: Argues that gaming is inescapable (due to semantic drift) or partially remediable (if contesting the model), with justification rooted in the apparatus.  
     *Common mistake*: Asserts remediability without addressing the semantic gap or appeals only to empirical fixes.  

  5. **Coherence and synthesis**: Logically integrates the locked proxy, invariance test, and diagnoses into a unified argument; avoids restating standard categories.  
     *Common mistake*: Treats apparatuses as disjoint examples without thematic synthesis.  

  **False friend**: “The locked proxy dissolves Goodhart’s law by making gaming impossible.” (Costs 2–4 marks)  
  - **Why it fails**: Ignores the semantic gap—even with counterfactual locking, optimizing \(P\) can redefine \(T\), making \(P\) a poor measure of the *original* target. This confuses causal coupling with representational fidelity.  

  **Grading boundary**:  
  - **A (16–20)**: Hits all five moves, especially #1 (semantic gap in locked proxy) and #3 (semantic diagnosis survives).  
  - **B (12–15)**: Misses one move, typically #1 (e.g., calls locked proxy a full solution) or #5 (disjointed analysis).
