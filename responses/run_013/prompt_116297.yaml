prompt: |-
  My working vocabulary is the vocabulary of reinforcement learning and representation learning, and I would like a faithful rendering of teleosemantics in it: objectives and loss functions, policies and value heads, observations versus latent state, shared trunks and the heads that read them, probe decodability, distributional shift, reward hacking, and the working assumption that any goal worth having can be written as the expectation of a cumulative reward. I know the philosophical position well enough not to need it explained; what I want is to see it stated in the machinery I actually use, and then to be told what the machinery cannot hold.

  Treat the following as the commitments to be translated, one at a time. Content is fixed by selection history rather than by current dispositions, actual use, or what the system's designer intended. A state can be about something only if it has a function, so misrepresentation is a species of malfunction rather than a species of error. Where a state correlates with many things at once — the small dark moving speck, the fly, the frog's own retinal activity — something in the organization of the system must break the tie, and it is the downstream consumer, not the correlation, that does the breaking. A state that nothing downstream reads represents nothing. There is a difference in kind between a state that says how things are and a state that says what to do. And a physical duplicate assembled without any selection history behind it represents nothing at all, however well it behaves.

  Render each of these in my terms: gradient descent on a stipulated objective as a selection process, and evolutionary or meta-level search as the outer loop; features in a shared trunk and the heads that consume them; world models versus value functions; what a probe can decode from a representation versus what the representation is for; the difference between a model that is wrong and a model that is merely unread. Be honest about the direction of translation. Where my vocabulary merely relabels a claim without adding anything, say so, and do not let mutual information stand in for content or a loss curve stand in for a norm.

  Then the part I actually want. For each commitment, tell me whether it carries over intact, carries over only as a stipulation, or does not carry over at all. I expect at least three candidates for the last category, and I want your verdict on each: the source of the norm, since my objectives are authored by someone while the theory's functions are supposed to be authored by nothing; the fact of the matter about what a state is about, since probing seems to make that relative to a task someone chose; and whatever work selection was doing that training cannot do, given that training is always training for something. Where the loss seems to indict my framework — that it has no room for a norm no one wrote down, and so no room for content — say so plainly. Where the loss instead indicts the theory — that it was never doing more than redescribing use, and the biological packaging made it look deeper than it was — say that too, and say which of the two you think it is. Finally, if the translation suggests that the theory's real difficulty was never selection but the origin of the objective, describe what an RL-shaped version of the theory would have to look like in order to be true.
reasoning: |-
  We are going to translate each commitment of teleosemantics into the language of reinforcement learning and representation learning. Then, we will evaluate how well each commitment carries over: intact, as a stipulation, or not at all.

  The key terms in your vocabulary:
  - Objectives and loss functions: the goals we are optimizing for.
  - Policies and value heads: the functions that map states to actions or values.
  - Observations vs latent state: the raw input vs the learned representation.
  - Shared trunks and heads: the common feature extractor and the task-specific output layers.
  - Probe decodability: what linear probes (or more complex models) can decode from a representation.
  - Distributional shift: when the data distribution at test time differs from training.
  - Reward hacking: when an agent finds a way to get high reward without actually achieving the intended goal.
  - Working assumption: any goal can be written as the expectation of cumulative reward.

  Teleosemantic commitments to translate:

  1. **Content is fixed by selection history rather than by current dispositions, actual use, or what the system's designer intended.**
     
     Translation: The meaning (content) of a learned representation (latent state) is determined by the history of the training process (the gradient descent trajectory and the data it encountered) and not by:
     - How the model is currently used (e.g., if we change the downstream head, the representation doesn't change its original meaning).
     - The current behavior of the model (current dispositions).
     - The original objective we set (the designer's intent) if the training process didn't actually shape the representation to that objective.

     In RL, we might say: the content of a feature in the shared trunk is fixed by the optimization history (the sequence of gradient updates and the environment interactions) and not by the current policy we deploy or the original loss function we wrote if the model didn't actually learn to represent that.

     However, note that in standard RL, the objective is fixed by the designer and the training is driven by that objective. But if the training process includes distributional shifts, reward hacking, or unintended correlations, the representation might end up representing something else. Teleosemantics would say that the content is fixed by what the representation was selected for during training (i.e., what causal role it played in achieving the objective as measured by the reward).

     But in our framework, the objective is fixed by the designer. So the selection history is driven by the objective. This is a point of tension.

  2. **A state can be about something only if it has a function, so misrepresentation is a species of malfunction rather than a species of error.**

     Translation: A latent state (or feature) can be said to represent X only if that state has the function of indicating X. Then, when the state is triggered by something other than X, that's a malfunction (like a broken sensor) and not just an error (like a wrong prediction).

     In RL terms: A feature in the shared trunk that is used by a downstream head (e.g., a value head or policy head) to make decisions has the function of representing whatever it was that caused that feature to be selected during training. If that feature is activated in a situation that is not the one it was selected for (e.g., due to distributional shift or adversarial examples), then it is malfunctioning.

     Contrast with: if we have a world model that makes a prediction error, that's just an error. But if the representation was supposed to represent X and it fails, that's a malfunction.

     However, note: in our framework, we don't have a notion of "supposed to" that is independent of the training objective. The function is assigned by the training process in service of the objective.

  3. **Where a state correlates with many things at once ... the downstream consumer, not the correlation, that does the breaking.**

     Translation: A representation might correlate with many things (e.g., a feature in the shared trunk might activate for a fly, a speck, or retinal activity). What determines which one it represents? It's the downstream head that uses that representation for a specific function. The head's role in the system (how it uses the representation to produce actions that lead to reward) breaks the tie.

     In RL: The feature might be correlated with many environmental variables, but the meaning is determined by how the value head or policy head uses that feature to maximize reward. If the head uses the feature to catch flies (and that was the function for which the feature was selected), then the feature represents flies and not just any small moving speck.

     This fits well: the representation is shaped by the entire system (trunk and heads) and the objective. The head's role in the system (as the consumer) fixes the content.

  4. **A state that nothing downstream reads represents nothing.**

     Translation: If a feature in the shared trunk is not used by any downstream head (or probe, if we consider probes as potential consumers) then it does not represent anything. It is just an inactive part of the representation.

     However, note: in representation learning, we often have features that are not directly used by the head but are part of the intermediate computations. But if they are truly never read by any part of the system (not even indirectly through influencing other features) then they are epiphenomenal and have no function. But in practice, every feature might be read by the final head? Not necessarily: there might be dead features.

     So: if a feature is not connected to the output (or not used in any computation that affects the output) then it has no function and hence no content.

  5. **There is a difference in kind between a state that says how things are and a state that says what to do.**

     Translation: This is the distinction between a world model (which predicts future states or rewards) and a value function or policy (which prescribes actions). In our architecture, the shared trunk might feed into two heads: a model head and a value head. The model head represents how the world is (beliefs) and the value head represents what to do (preferences or action probabilities).

     Teleosemantics might say that the function of the model head is to represent the state of the world (so misrepresentation is malfunction) and the function of the value head is to guide action (so it might not be about the world in the same way).

     This distinction is already present in our framework.

  6. **A physical duplicate assembled without any selection history behind it represents nothing at all, however well it behaves.**

     Translation: If we build a neural network that has the exact same weights as a trained model, but without going through the training process (e.g., we initialize it to the same weights by chance or by design), then it does not represent anything. Even if it behaves exactly the same way, the representations have no content because they were not selected by a learning process.

     In our terms: The duplicate has the same structure but lacks the history of gradient descent that shaped the weights to serve a function. Therefore, the features in the trunk do not have the function of representing what they would have represented in the trained model.

     This is a radical claim: behaviorally identical systems might differ in whether they have representations.

  Now, we evaluate how each commitment carries over:

  1. **Content by selection history**: 
     - In our framework, the training history (gradient descent) is a selection process. However, the objective is set by the designer. So the content is fixed by the training history in service of the objective. But teleosemantics in biology doesn't have a designer. 
     - Verdict: **Carries over only as a stipulation**. We stipulate the objective (reward function) and the training process selects for features that serve that objective. Without the stipulation, we don't have a norm. The teleosemantic norm is supposed to be natural, but our objective is artificial.

  2. **Function required for aboutness, misrepresentation as malfunction**:
     - We can say that a representation has a function if it was selected by training to serve the objective. Then misrepresentation occurs when the representation is activated in a context it wasn't selected for (distributional shift) and leads to failure. 
     - But note: in our framework, we don't have a notion of malfunction that is independent of the objective. If the objective is misspecified, then the representation might be functioning correctly (for the objective) but not for the intended goal (which is the designer's intent). This leads to reward hacking. 
     - Verdict: **Carries over as a stipulation**. We can define the function relative to the stipulated objective. Without the objective, we don't have a function.

  3. **Downstream consumer breaks the tie**:
     - This carries over well: the head that uses the representation determines what it represents by how it uses it to achieve the objective. 
     - Verdict: **Carries over intact**.

  4. **Unread state represents nothing**:
     - This also carries over: if a feature is not used by any head (and doesn't influence the output) then it has no function and hence no content. 
     - But note: even if not used in the primary task, if we can probe it and decode some information, does it represent that? Teleosemantics says no: the probe is not the consumer that the system was designed for. 
     - Our framework: we can probe and get information, but the system wasn't optimized for that. So we might say: the unread state has no function in the system, so it doesn't represent anything. But if we can probe it, then it might be decodable, but that's not the same as having a function. 
     - Verdict: **Carries over intact** (if we accept that only the heads in the system are consumers, not external probes).

  5. **Difference between descriptive and directive states**:
     - This is built into our architecture: world model vs value function. 
     - Verdict: **Carries over intact**.

  6. **Duplicate without history represents nothing**:
     - In our framework, if we copy the weights without training, the network might behave the same. But the teleosemantic claim is that it doesn't represent anything. 
     - Our framework does not typically require the training history for representation: we care about the current function and behavior. 
     - However, if we consider the function as defined by the selection process, then the duplicate lacks that history. 
     - Verdict: **Does not carry over at all** in practice. In our framework, we attribute content based on the current structure and behavior, not the history. We might say the duplicate has the same representations because it has the same structure and would behave the same. The teleosemantic requirement of history is not part of our framework.

  Now, the part you actually want: the candidates that do not carry over.

  **Three candidates that do not carry over at all or only as stipulation?** We have:

  - **Source of the norm**: Teleosemantics in biology finds norms in natural selection without a designer. In our framework, the objective (reward function) is set by a designer. So the norm is stipulated. Without a designer, we don't have a norm. Therefore, **the source of the norm does not carry over** in the naturalistic sense. We must stipulate the objective.

  - **Fact of the matter about what a state is about**: In teleosemantics, the function (and hence the content) is fixed by the selection history. In our framework, we can probe the representation for different tasks, and we might get different decodability. But the teleosemantic claim is that there is a fact of the matter: what the representation was selected for. However, in our framework, without the history (if we just have the weights) we might not know what it was selected for? But we can try to reverse-engineer. Also, if we train on multiple tasks, the representation might have been selected for multiple reasons. Moreover, the teleosemantic view is that the downstream consumer breaks the tie, but if we have multiple heads, then the representation might have multiple functions? Teleosemantics might say that the function is relative to the specific consumer. But in any case, the key is that the function is fixed by the selection history. 

     However, in our framework, we can only infer the function from the training setup and the behavior. There might be no fact of the matter beyond what the model does. And if we can probe for many things, then the representation might carry information about many things. But teleosemantics says that the function (and hence the content) is fixed by the selection history. 

     Verdict: **This carries over only as a stipulation**. We can define the function relative to the objective and the training process, but without that, we don't have a fact of the matter. And if we have a model that wasn't trained (like the duplicate) then we don't have a function. But in practice, we often ignore the training history and look at the current structure and behavior.

  - **Selection history vs training for something**: Teleosemantics requires that the function comes from a history of selection. In our framework, training is always for something (the objective). But if we have a duplicate without the training history, teleosemantics says it has no function. We, however, would say that if it behaves the same, it has the same representations. So **the requirement of selection history does not carry over**. We can have representations without a selection history? 

     But note: if we build a model by hand (without training) to solve a task, then we have a designer. The teleosemantic might say that the designer's intent doesn't count. So the model must be produced by a selection process (like evolution or learning) without a designer. 

     Therefore, the work that selection was doing that training cannot do is to provide a naturalistic norm. But in our framework, we always have a designer. So the selection history requirement is not necessary for us to attribute content. We are happy to attribute content to a model that was designed by hand. 

     Hence, **this commitment (that selection history is necessary) does not carry over at all**.

  Now, let's be plain about the loss:

  - The framework (RL) has no room for a norm that no one wrote down. The objective is always set by a designer. Therefore, **the framework cannot hold the naturalistic norm that teleosemantics requires**. 

  - Does this indict the framework? It means that in the RL framework, content is always relative to the stipulated objective. Without the objective, we don't have content. But teleosemantics wanted content to be natural and independent of stipulation.

  - Does it indict the theory? Teleosemantics might be seen as trying to ground content in natural selection, but natural selection itself is a process that is not designed. However, in the RL framework, we are always in a designed system. So the theory (teleosemantics) is not wrong, but it doesn't apply to artificial systems? Or it does, but then we have to accept that the objective is stipulated.

  - The real difficulty: **the origin of the objective**. Teleosemantics in biology uses natural selection as the source of the norm. In RL, we have the designer. So an RL-shaped version of teleosemantics that is true would have to have an objective that is not designed. How? By having the objective emerge from an unsupervised process? But even then, we design the unsupervised objective. 

     Alternatively, we might imagine an outer loop of evolution (meta-learning) that designs the objective. But then the objective is still designed by the meta-designer? Unless we go all the way to an undirected process. 

     Therefore, an RL-shaped teleosemantics that is true would require that the objective itself is the product of a selection process that has no designer. We would need an evolutionary process that designs the reward function. And then the inner loop (the learning of the agent) would be shaped by that evolved reward function. Then the content would be fixed by the evolutionary history and the learning history. 

     But note: even then, the evolutionary process might have been designed (if we are in a simulation). So the real issue is the ultimate source of the norm. 

     In summary, to have a true teleosemantics in RL, we would need an undirected meta-selection process (like natural evolution) that shapes the objective and the learning process.

  Final verdicts on each commitment:

  1. **Content by selection history**: Stipulation (we stipulate the objective) -> **Carries over only as stipulation**.
  2. **Function for aboutness, malfunction**: Stipulation (function relative to objective) -> **Carries over only as stipulation**.
  3. **Downstream consumer breaks tie**: **Intact**.
  4. **Unread state is nothing**: **Intact** (if we consider only the system's heads as consumers).
  5. **Descriptive vs directive**: **Intact**.
  6. **Duplicate without history**: **Does not carry over at all**.

  And the three critical points:

  - **Source of the norm**: In RL, we have a designer. Without one, we don't have a norm. So **does not carry over** in the naturalistic sense.
  - **Fact of the matter about content**: In RL, we can only define it relative to the objective. Without the objective, there is no fact of the matter. And even with the objective, we might have multiple interpretations. But teleosemantics claims a fact of the matter by the selection history. **Carries over only as stipulation** (because we have to stipulate the objective).
  - **Selection history requirement**: **Does not carry over at all** because we can have representations without a history of selection (e.g., a hand-designed model) and we still attribute content.

  The framework (RL) is indicted for having no room for a natural norm (one not written by a designer). The theory (teleosemantics) is not indicted by this; rather, it shows that the theory requires a natural selection process that RL (as typically understood) does not have. 

  Therefore, an RL-shaped teleosemantics that is true would require an outer loop of undirected selection (like evolution) that shapes both the objective and the learning mechanism. Then the inner learning process would shape the representations by selection (gradient descent) in service of the evolved objective. Then the content would be fixed by the entire selection history (evolution and learning).
answer: |-
  ### Faithful Translation of Teleosemantic Commitments into RL/Representation Learning Terms

  I'll translate each teleosemantic commitment into your vocabulary, maintaining strict alignment with RL/representation learning concepts. I'll then evaluate how well each carries over: **intact** (direct mapping), **as stipulation** (requires imposed structure), or **not at all** (fundamentally incompatible). I'll conclude with the critical analysis you requested.

  ---

  ### **1. Content is fixed by selection history, not current dispositions, use, or designer intent.**
  **Translation**:  
  The semantic content of a latent state \( z \) (in a shared trunk) is determined by the **historical optimization trajectory** (gradient descent under a fixed loss landscape) that shaped \( z \), not by:
  - Current activations or behavioral dispositions (e.g., policy outputs at inference).
  - How \( z \) is *currently* used by downstream heads (e.g., if heads are ablated post-training).
  - The designer's original objective (e.g., if reward hacking distorts the learned representation).

  **Carry-over**:  
  **As stipulation**.  
  - Optimization history (gradient steps + environment rollouts) is analogous to selection history.  
  - However, the **loss function itself is stipulated by the designer**, unlike natural selection's emergent "objectives." Without this stipulation, there is no content-defining history. Current dispositions or designer intent are indeed irrelevant in both frameworks.

  ---

  ### **2. Aboutness requires function; misrepresentation is malfunction, not error.**
  **Translation**:  
  A latent state \( z \) can represent \( X \) only if it has the **function** of indicating \( X \) for a downstream head (e.g., value head). Misrepresentation occurs when \( z \) is **malfunctioning** (failing to serve its function due to distributional shift or adversarial perturbations), not merely making a prediction error (e.g., a world model inaccurately forecasting state transitions).  
  - *Function*: What \( z \) was optimized to indicate (e.g., a feature detecting "predators" because its outputs minimized loss during training).  
  - *Malfunction*: \( z \) fires for non-predators in OOD settings, corrupting the value head's outputs.  

  **Carry-over**:  
  **Intact**.  
  - Malfunction aligns with **representation collapse under distributional shift**, where \( z \) no longer serves its optimization-derived function. Prediction errors (e.g., world model inaccuracies) are distinct and quantifiable via log loss. The head's reliance on \( z \) defines its function.

  ---

  ### **3. Downstream consumers break causal ties for correlated features.**
  **Translation**:  
  When a latent state \( z \) correlates with \( \{X_1, X_2, ...\} \) (e.g., \( z \) activates for "fly," "speck," or "retinal noise"), **which variable \( z \) represents** is determined by which head **consumes \( z \) and why it was evolutionarily advantageous** (in teleosemantics) or **loss-reducing** (in RL).  
  - Example: If a policy head uses \( z \) to catch flies (and this action historically minimized loss), \( z \) represents "flies," even if it correlates with noise.  
  - Tie-breaking is **not** done by mutual information (e.g., \( I(z; \text{fly}) \) vs. \( I(z; \text{speck}) \)).  

  **Carry-over**:  
  **Intact**.  
  - The head's role in policy execution (e.g., activating "tongue strike" only when \( z \) indicates flies) and its contribution to cumulative reward during training determine content. Mutual information is insufficient, as it ignores the *causal role* in reward maximization.

  ---

  ### **4. Unread states represent nothing.**
  **Translation**:  
  A latent state \( z \) in a shared trunk **has no representational content** if no downstream head (policy, value, or auxiliary) uses it during training or inference. Even if \( z \) is probe-decodable for \( X \) (e.g., via linear regression), it is **epiphenomenal** and lacks a function.  

  **Carry-over**:  
  **Intact**.  
  - Probe decodability is irrelevant; only **functional use by a head** matters. A trunk neuron untouched by gradients (e.g., due to sparsity) has no content, regardless of its activations.

  ---

  ### **5. Descriptive vs. directive states are distinct in kind.**
  **Translation**:  
  **World models** (descriptive) and **value functions** (directive) are fundamentally different head architectures sharing a trunk:  
  - A world model head \( h_{\text{WM}} \) outputs beliefs (e.g., transition probabilities \( P(s_{t+1} | s_t, a_t) \)).  
  - A value head \( h_{\text{V}} \) outputs prescriptions (e.g., \( V(s_t) \) or \( Q(s_t, a_t) \)).  
  - Misrepresentation in \( h_{\text{WM}} \) is **malfunction**; suboptimality in \( h_{\text{V}} \) is **poor guidance**.  

  **Carry-over**:  
  **Intact**.  
  - The distinction is already explicit in architectures like MuZero or Dreamer. Descriptive heads minimize prediction loss; directive heads minimize Bellman error.

  ---

  ### **6. A physical duplicate without selection history represents nothing.**
  **Translation**:  
  A network with **identical weights** to a trained model but **no optimization history** (e.g., randomly initialized to the same weights) has **no representational content**, even if it behaves identically. Its latent states are **not "about" anything**, as they lack functions derived from selection.  

  **Carry-over**:  
  **Not at all**.  
  - In RL, two networks with identical weights/behaviors are functionally indistinguishable. Content is ascribed **structurally** (e.g., via activation patterns) or **behaviorally** (e.g., policy outputs), not historically. A hand-coded ResNet with "frog vision" weights has the same content as a trained one if inputs/outputs match.

  ---

  ### Critical Analysis: What Does Not Carry Over
  You identified three key tensions. I address these and the broader implications:

  #### **1. Source of the norm (designer vs. nothing)**
  - **Conflict**: Teleosemantics requires norms from *unintended selection* (e.g., evolution optimizing fitness). In RL, the objective (e.g., \( \mathbb{E}[\sum \gamma^t r_t] \)) is **authored by a designer**.  
  - **Verdict**: **Does not carry over**.  
    - Your framework has no room for norms beyond the stipulated loss. Reward hacking epitomizes this: an agent satisfies the designer's reward function but violates the *intended* goal. Teleosemantics would call this "malfunction," but RL lacks machinery to define "proper function" without a designer.  
    - **Indictment**: This **indicts your framework**. It cannot support naturalized content (e.g., "frog vision represents flies") because all norms are artifacts of design. Probe decodability or mutual information are descriptive, not normative.

  #### **2. Fact of the matter about content (relativity of probing)**
  - **Conflict**: Teleosemantics claims content is fixed by **consumer function**, not interpretation. In RL, probing (e.g., linear classifiers on \( z \)) is **task-relative**—different probes extract different features from the same \( z \).  
  - **Verdict**: **Carries over only as stipulation**.  
    - You can *stipulate* that content is defined by the head's function (e.g., "\( z \) represents flies because the policy head uses it to catch flies"). However, without this stipulation, content is probe-relative.  
    - **Indictment**: This **indicts teleosemantics**. It implicitly redescribes the head's *use* of \( z \) as "content," but probing reveals that representations are inherently multitask-capable. The "fact of the matter" dissolves under reanalysis.

  #### **3. Selection history vs. training-for-something**
  - **Conflict**: Teleosemantics uses selection history to ground content *independently* of goals. RL training is **always goal-directed** (e.g., minimizing \( \mathcal{L} \)). A randomly initialized network has no "selection history," yet RL ascribes content post-training.  
  - **Verdict**: **Does not carry over** for history-dependence.  
    - Training shapes representations to serve a goal, but the *history itself* is irrelevant to content in RL. Two identical models (e.g., one trained, one weight-matched) are functionally identical.  
    - **Indictment**: This **indicts teleosemantics**. It conflates the *mechanism* of selection (e.g., evolution) with the *fact* of functional organization. RL shows that selection history is explanatory excess; only current structure matters.

  #### **The Core Tension: Origin of Objectives**
  - Teleosemantics' real issue is not selection but the **origin of norms**. It uses evolution as a *naturalized objective-generator*. RL reveals that without such a generator, content reduces to designer stipulations or behavioral regularities.  
  - **RL-shaped teleosemantics**: To be "true," it would need:  
    - **Undirected meta-optimization**: An outer loop (e.g., evolutionary search) that generates loss functions *without a designer*, using metrics like "fitness" (e.g., population survival) instead of \( r_t \).  
    - **Function-from-history**: Content defined by *why* a structure persisted (e.g., "this convolutional filter exists because it increased fitness"), not just gradient steps.  
    - **No stipulated rewards**: Reward functions must emerge from the meta-optimizer, not be coded by an agent.  
    Example: An evolutionarily trained vision module that detects predators, where "predator" is not defined by labels or rewards but by fitness outcomes.

  ---

  ### Summary of Carry-Over
  | Commitment | Carry-over Verdict |  
  |------------|-------------------|  
  | 1. Content by history | Stipulation |  
  | 2. Aboutness requires function | Intact |  
  | 3. Downstream consumers break ties | Intact |  
  | 4. Unread states lack content | Intact |  
  | 5. Descriptive vs. directive states | Intact |  
  | 6. No content without history | Not at all |  

  **Key Outcomes**:  
  - **Framework indictment**: Your vocabulary cannot support **naturalized norms** (Commitment 1, 6) or **non-relative content** (Commitment 2, 3 without stipulation).  
  - **Theory indictment**: Teleosemantics **overclaims** on history-dependence (Commitment 6) and consumer-relative content (Commitment 3).  
  - **Path to a "true" RL teleosemantics**: Replace designer-authored objectives with **undirected meta-optimization** (e.g., evolved loss functions) and define content by functional persistence, not probeability.  

  This translation reveals teleosemantics as a *heuristic* for functional analysis—useful but not ontologically fundamental. Your framework captures its mechanics but not its naturalistic aspirations.
