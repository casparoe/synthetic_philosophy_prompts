e a weighted average based on expertise, but then the resulting probability is a new subjective belief of the group? and how do we tag that? It becomes a new subjective belief of the group, so we can tag it as subjective? But then we are creating a new subjective probability. The convention does not forbid that. However, note that the convention does not require that the tag must be of an individual? It could be a group's belief. So the practical change is that we must define a group subjective belief and tag it as such, rather than just averaging without thought. However, if we have a mix of interpretations (e.g., one analyst gives a frequentist probability and another a subjective) then we cannot pool at all. But in the pooling stage, if we are pooling several analysts, we must ensure they all use the same interpretation? Or we must not pool if they use different? The convention forbids pooling different tags. Therefore, we must require that all analysts use the same interpretation for the same quantity? That would be a practical change.

