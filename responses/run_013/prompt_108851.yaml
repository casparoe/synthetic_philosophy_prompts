prompt: |-
  Last night a friend and I spent three hours going in circles about the teletransporter, and I came away convinced that we were not really disagreeing about the case at all but about what a theory in this area is even supposed to deliver — my friend kept saying that the replica simply is not him and that this settles the matter, and I kept feeling that he had helped himself to a standard he never stated. So before I read another word of the literature, I want the specification written out: the desiderata that any adequate account of what matters in survival has to meet, each with the case or consideration that generates it, and with a clear-eyed division between the requirements that are genuine and those that are merely the prejudices of one camp.

  I want the list to include at least the following, though you should add anything I have missed and cut anything that turns out to be doing no work. First, the datum that I have a kind of concern for my own future that I do not have for anyone else's, and that a theory must either locate that concern or explain it away. Second, the teletransporter in both of its forms — the one where the original is destroyed in the scanning and the one where the original survives alongside the replica — since a theory that treats these as the same case has already conceded something. Third, fission, where one person divides into two who each remember being me and each go on to live, together with the demand that a theory not privilege one branch by fiat. Fourth, the gradual cases, where nothing is copied and nothing is destroyed but the psychological connections thin out across decades, so that the infant and the old man are linked only by a long chain of overlapping stages. Fifth, the requirement that whatever the theory says about survival be able to carry the weight we place on it elsewhere: promises, debts, punishment, grief, and the standing of someone asked to honour a commitment made by a person who has changed beyond recognition. Sixth, the requirement that the theory either close or explicitly explain the gap between what is true of personal identity and what matters, since the reductionist move is precisely to let these come apart. And then the assumptions I suspect are smuggled in unargued and do most of the real work: that survival is all-or-nothing rather than a matter of degree; that identity is transitive and one-one, so that two distinct fission products cannot both be identical with the original; and that there is a fact of the matter about who is who independent of our conventions. Mark each of these as non-negotiable or as a preference of a particular camp, and if some subset of them is jointly unsatisfiable — I have a strong suspicion that all-or-nothing survival, no privileged branch in fission, and identity being what matters cannot all be held at once — set out the argument, because that is the result I actually want from this.

  Two cases of my own devising should be run through the list, since my friend kept appealing to intuition and I want something that cannot be settled by intuition alone. The first is a firm selling what it calls continuity insurance, which pays out to whichever branch of a policyholder is alive at the end of the term, the sum being identical no matter which branch collects, so that a theory positing a fact about which branch is you owes us an account of what the payout is tracking. The second is a person undergoing a slow, medically unremarkable replacement of everything psychological — no copying, no destruction, just the kind of change we all undergo — until nothing of the original's memory or character remains, and who is nonetheless treated by everyone, himself included, as the same person throughout; I want to know whether a theory can call this survival without also calling the teletransporter survival, and if so, exactly what the difference is supposed to consist in. Then tell me which single requirement eliminates the most otherwise plausible candidates, and keep any scorecard of the existing contenders to a sentence apiece — the criteria are the deliverable here, not the grading.
reasoning: |-
  Okay, the user has been grappling with the teletransporter paradox all night with a friend, and they've hit a wall. It seems their disagreement wasn't really about the case itself, but about what a theory of personal identity and survival should even accomplish. The user is frustrated because their friend kept insisting the replica isn't them without stating the criteria for that judgment. Now, before diving into literature, they want a clear set of desiderata that any adequate account must meet.

  The user provided six specific requirements plus three underlying assumptions they suspect are doing the heavy lifting. They also added two original thought experiments: continuity insurance and gradual psychological replacement. Their core suspicion is that all-or-nothing survival, no privileged branch, and identity-as-what-matters form an inconsistent triad. They want this tension exposed rigorously.

  Hmm, this is a sophisticated request. The user clearly has philosophical training - they're using terms like "reductionist move" and framing the problem in terms of theoretical desiderata. Their frustration suggests they've already seen how intuitions can talk past each other. The two original cases are clever: the insurance example forces a confrontation with the practical consequences of identity theories, while the gradual replacement case probes the psychological criterion's boundaries.

  The real challenge here is systematizing without bias. Many accounts smuggle in metaphysical assumptions (e.g., soul theories) or privilege certain intuitions. I need to flag which requirements are genuinely neutral versus partisan. For instance, demanding identity be transitive favors substance theories over psychological continuity accounts facing fission cases.

  Ah, and that inconsistent triad is crucial. If survival is all-or-nothing and identity is what matters, fission forces us to privilege one branch arbitrarily. But if we reject privileged branches, survival must either be gradable or decoupled from identity. That's the crack in the foundation the user wants exposed. Their insurance case makes this concrete: if both branches can claim the payout, identity isn't tracking what matters financially.

  For their gradual replacement case, the trap is this: if psychological replacement constitutes survival when gradual, but not when instantaneous (teletransporter), the difference must be something other than psychology itself. That pressures theorists to either embrace continuity-as-sufficient (making teletransporter survival) or introduce additional criteria (e.g., physical continuity) that may conflict with other desiderata.

  The user's demand to see which requirement eliminates most theories is sharp. My bet is the "no privileged branch" constraint - it sinks soul theories, animalism, and many psychological accounts unless they adopt a non-branching clause (which feels ad hoc). But I should verify by mentally running major theories against it.

  Notable that they want "scorecards to a sentence apiece" - this suggests impatience with lit reviews masquerading as analysis. They want the criteria to stand on their own. Wise, given how tribal personal identity debates get.
answer: |-
  Here is a specification of desiderata for an account of "what matters in survival," rigorously dissected and applied to your cases. Requirements are categorized as **Core** (minimal adequacy conditions), **Constraint** (logical/metaphysical boundaries), or **Camp-Specific** (reflecting substantive philosophical commitments). Assumptions are marked as **Non-Negotiable**, **Contingent**, or **Problematic**.

  ---

  ### **I. Core Desiderata (What a Theory Must Address)**
  1.  **The Asymmetry of Self-Concern:**  
      *   **Requirement:** Explain the unique, first-personal future-directed concern I have for my own experiences, well-being, and existence, which differs in kind from my concern for others.  
      *   **Case:** My dread of my *own* future torture vs. sympathy for yours.  
      *   **Status:** **Core.** Any theory failing to explain/justify this asymmetry or explain it away (e.g., as an illusion) is inadequate.

  2.  **The Teletransporter (Destruction vs. Survival):**  
      *   **Requirement:** Treat the "destructive scan" (original destroyed) and "non-destructive scan" (original remains alongside replica) cases as *distinct* in terms of what matters for the original person. A theory collapsing them concedes too much.  
      *   **Case:** Would *you* step into the destructive scanner? Would your concern differ if the scanner didn't destroy you?  
      *   **Status:** **Core.** Intuitions strongly diverge here; adequacy demands recognizing the distinction.

  3.  **Fission & Non-Privileged Branch:**  
      *   **Requirement:** Account for fission (one person dividing into two psychologically continuous successors) without arbitrarily declaring *one* successor to be "the real you" or the sole locus of what matters. Both successors have equal claim from the original's perspective.  
      *   **Case:** Brain bisection where each hemisphere is transplanted into a new body.  
      *   **Status:** **Core.** Failure violates deep intuitions about fairness and the symmetry of the branches. Eliminates theories relying on "closest continuer" or unanalyzed identity.

  4.  **Gradual Change & Degrees of Connection:**  
      *   **Requirement:** Explain how significant psychological change over time (e.g., infant to old man connected by weak links) relates to survival and self-concern. Must address whether survival is a matter of degree.  
      *   **Case:** The 90-year-old with no memories or traits of their 1-year-old self.  
      *   **Status:** **Core.** Any theory must grapple with the reality of temporal change.

  5.  **Practical Implications:**  
      *   **Requirement:** Show how the account of "what matters" grounds (or fails to ground) practical concerns like promises, debts, punishment, grief, and honoring commitments made by a radically changed predecessor.  
      *   **Case:** Should the reformed 60-year-old criminal be punished for the crimes of their impulsive 20-year-old self?  
      *   **Status:** **Core.** A theory disconnected from practice is irrelevant.

  6.  **The Identity/Mattering Gap:**  
      *   **Requirement:** Explicitly state the relationship between *personal identity* (metaphysical sameness) and *what matters in survival*. If they come apart (as reductionists hold), explain *why* and *how* what matters is based on something else (e.g., psychological continuity).  
      *   **Case:** Fission shows identity (one-to-one) fails, but survival-interest may persist.  
      *   **Status:** **Core.** The central insight of reductionism; avoiding it obscures the debate.

  ---

  ### **II. Constraints (Logical/Metaphysical Boundaries)**
  7.  **Transitivity of Identity (If Identity Matters):**  
      *   **Constraint:** If identity *is* what matters, then it must be transitive: If A is identical to B, and B is identical to C, then A is identical to C.  
      *   **Status:** **Non-Negotiable (Logic).** Violation implies logical contradiction. Fission directly challenges identity-as-what-matters.

  8.  **One-One Identity (If Identity Matters):**  
      *   **Constraint:** If identity *is* what matters, it must be a one-one relation. One person cannot be identical to two distinct future persons.  
      *   **Status:** **Non-Negotiable (Logic).** Fission directly challenges identity-as-what-matters.

  9.  **Fact of the Matter:**  
      *   **Constraint:** Specify whether the theory posits a deep, convention-independent fact about identity/survival, or whether it is ultimately conventional/perspective-dependent.  
      *   **Status:** **Contingent.** Reflects a fundamental metaphysical commitment (e.g., Non-Reductionist vs. Reductionist). Not a neutral adequacy condition, but must be stated.

  ---

  ### **III. Camp-Specific Assumptions (Often Smuggled In)**
  10. **Survival is All-or-Nothing:**  
      *   **Assumption:** A person either completely survives or completely ceases to exist; there is no partial survival.  
      *   **Status:** **Camp-Specific / Problematic.** Often assumed by Non-Reductionists and some Reductionists. Directly challenged by Gradual Change and Fission cases. *Contradicts the possibility of degrees of survival/mattering.*
  11. **Identity is What Matters:**  
      *   **Assumption:** What we fundamentally care about in survival is strict numerical identity – being literally the *same* person.  
      *   **Status:** **Camp-Specific (Non-Reductionist / Conservative Reductionist).** Directly challenged by Fission and the Identity/Mattering Gap requirement. The core reductionist move is to deny this.
  12. **No Privileged Branch by Fiat:**  
      *   **Assumption:** In symmetrical fission, neither successor can be arbitrarily designated as the "real" continuation of the original.  
      *   **Status:** **Widely Accepted Constraint / Core Requirement (as above).** Violates fairness and symmetry intuitions. *Essential for testing theories against Fission.*

  ---

  ### **IV. The Inconsistent Triad**
  *   **The Conflict:** `All-or-Nothing Survival` + `Identity is What Matters` + `No Privileged Branch (in Fission)` are **jointly unsatisfiable**.
      1.  **Fission occurs:** One original (O) branches into two successors (S1 & S2), both psychologically continuous with O.
      2.  **No Privileged Branch:** Neither S1 nor S2 can be declared *the* identical successor of O by fiat. Both have equal claim.
      3.  **Identity is What Matters & One-One:** If identity matters, O can only be identical to *one* successor. But (2) prevents picking one arbitrarily. Contradiction.
      4.  **All-or-Nothing Survival:** If survival is all-or-nothing, O must either survive *as one person* or cease to exist. (2) & (3) block surviving as one person. Does O cease to exist? But both S1 and S2 exist and bear the relation (psychological continuity) that is supposed to ground survival/mattering.
  *   **Resolution:** A theory must reject at least one:
      *   **Reject All-or-Nothing:** Survival/mattering can be partial or degreed (e.g., O survives "in part" in both S1 and S2; what matters is proportionally shared).
      *   **Reject Identity is What Matters:** What matters (e.g., psychological continuity) can hold between O and *both* S1 and S2 without O being identical to either. O ceases to exist, but what matters is preserved doubly.
      *   **Reject No Privileged Branch (Covertly):** Introduce a "non-branching" clause or other factor (e.g., spatiotemporal continuity, soul) to privilege one branch arbitrarily or non-arbitrarily (often feels like cheating).

  ---

  ### **V. Applying to Your Cases**
  1.  **Continuity Insurance Payout:**
      *   **Challenge:** The payout is fixed regardless of which branch collects. What is it tracking?
      *   **Theories Must Explain:**
          *   If identity matters & is one-one: Only one branch *is* you. Why does the *wrong* branch get paid? Or how is "which is you" determined? The payout mechanism seems blind to identity.
          *   If what matters is psychological continuity: *Both* branches instantiate what matters equally. The payout compensates for the *loss of unique identity* or the *splitting* of what matters. It tracks the continuation of the valued psychological life, regardless of which branch it's in. The payout *should* be the same because what matters is equally present in both.
          *   All-or-Nothing Survival: If O ceases to exist (common in fission), the payout might be a death benefit paid to the continuers. But why only one? If survival is degreed, the payout reflects the continuation of the valued life(s).

  2.  **Gradual Psychological Replacement:**
      *   **Challenge:** Is this survival? How does it differ from Teletransporter survival?
      *   **Key Distinction (Potential):** **Spatiotemporal Continuity / Physical Implementation.**
          *   Gradual Replacement: Change happens *in situ*, within the same ongoing biological organism/body over time. There is an unbroken physical trajectory, even as psychology changes.
          *   Teletransporter (Destructive): The original body is destroyed. The replica is constructed *de novo* in a different location. The physical trajectory is broken.
      *   **Theories Must Confront:**
          *   *Psychological Criterion Alone:* If only psychological continuity matters, both cases *should* be survival (assuming sufficient continuity). To deny Teletransporter survival, this theory must either (a) introduce a non-branching clause (irrelevant here) or (b) **smuggle in physical continuity**.
          *   *Biological Criterion:* Gradual Replacement is survival (same organism). Teletransporter is not (new organism). Clear distinction.
          *   *Spatiotemporal Path/Physical Continuity:* Gradual Replacement has it; Destructive Teletransporter lacks it. This provides a principled difference.
          *   *All-or-Nothing:* Gradual change might threaten survival if psychological connections get too weak. Teletransporter might be seen as death followed by replica creation.
      *   **Conclusion:** A theory can call Gradual Replacement survival while denying it to the (Destructive) Teletransporter only if it incorporates **physical continuity** (biological, spatiotemporal, embodiment) as a necessary condition for identity or for what matters *in addition to* psychology, or as the mechanism realizing psychological continuity. A *pure* psychological theory struggles here.

  ---

  ### **VI. The Eliminator**
  *   **The Requirement that Eliminates the Most Plausible Candidates: `Fission & Non-Privileged Branch`.**  
      *   **Why:** It directly confronts the **Inconsistent Triad**. Theories that insist `Identity is What Matters` (e.g., Soul Theories, Simple Biological Views) or `All-or-Nothing Survival` combined with `Identity Matters` (many Non-Reductionist views) cannot satisfy it without arbitrary stipulation. Even sophisticated Psychological Continuity theories require significant modification (e.g., adding a non-branching clause) which many find ad hoc and which violates the "no privilege by fiat" spirit. It forces a choice between abandoning identity as the locus of concern, accepting degrees of survival, or embracing conventionalism.

  ---

  ### **VII. Scorecard of Major Views (One Sentence Apiece)**
  *   **Cartesian Ego/Soul:** Violates Fission/Non-Privilege (only one soul?), Gradual Change (can soul change utterly?), Identity/Mattering Gap (soul identity *is* what matters); struggles with Practical Implications of change.
  *   **Animalism (Biological Criterion):** Fails Fission/Non-Privilege (only one body?), Teletransporter distinction (clear: original destroyed = death), struggles with Gradual Change (same organism survives, but does *what matters*?), denies Identity/Mattering Gap (identity is what matters).
  *   **Psychological Continuity (Simple):** Violates Fission/Non-Privilege (must arbitrarily choose one branch or deny survival), fails Teletransporter distinction (if continuous, why isn't replica survival?), handles Gradual Change (degrees possible), embraces Identity/Mattering Gap (continuity matters, not identity).
  *   **Psychological Continuity + Non-Branching (Parfit/Lewis):** Satisfies Fission/Non-Privilege via convention (survival = non-branching continuity), handles Gradual Change (degrees), embraces Gap, struggles to convincingly distinguish Gradual Replacement from Teletransporter without smuggled physicalism.
  *   **Four-Dimensionalism (Perdurantism):** Satisfies Fission (O = temporal part; S1 & S2 share it), handles Gradual Change (degrees across stages), embraces Gap (mattering tied to connected stages), but often relies on conventions for "person" stages; Teletransporter distinction depends on physical continuity of the space-time worm.
  *   **Bundle Theories / Conventionalism:** Denies deep fact of identity; survival/mattering based on conventions or practical concerns; handles Fission/Gradual Change pragmatically; Teletransporter distinction may be conventional; may struggle with Asymmetry of Concern as fundamental.

  This framework provides the rigorous specification you sought, exposing fault lines and forcing clarity about foundational commitments. The Fission/Non-Privilege requirement and the Inconsistent Triad are indeed the keys to unlocking the deepest disagreements.
