prompt: |-
  Ok, so my phil of mind reading group has been stuck on that Hofstadter careenium thing for like three weeks and I need help. You know the setup — the table of little magnetised marbles ("simms") that clump up into bigger clusters ("simmballs"), and then the simmballs seem to shove each other around in ways you can't just read off the individual simms. The question we can't get past: are the simmballs actually pushing the simms around, or is that just a fancy redescription of what the simms were already doing?

  Two people in the group have been going at it for months and I think there 60% talking past each other. One says the simmball level is doing real causal work — the pattern really does shove the substrate around, it's not just a summary. The other says that's epiphenomenalist hogwash: only simms push, the simmball story is a convenient redescription and nothing more.

  Can you draft the joint statement the two of them could actually both put their names to? I want:

  1. A numbered list of claims they'd both sign — about the toy itself, about what supervenience of the simmballs on the simms does and doesn't buy you, and about what would even count as "downward" causation in a toy like this.
  2. A disagreements table: each real disagreement stated neutrally, then the wording each side would accept for its own position, then the crux sitting underneath it.
  3. For each crux, something both sides agree would actually bear on it — a tweak to the toy, a possible run, or an argument — with each side's prediction recorded in advance.

  A few specific things I want you to force into it, because this is where the actual fight is:
  - whether the simmball-level counterfactual (if the cluster hadn't formed, the simm wouldn't have gone left) is the same kind of causal relation as the simm-level one, or a different kind that maybe isn't causation at all;
  - whether the simmball explanation screens off the simm explanation, and if so whether that's evidence of causation or evidence of mere description;
  - whether non-derivability of simmball regularities from simm laws is enough for causal autonomy, or just a fact about our bookkeeping;
  - what multiple realizability (same simmball pattern, different simm arrangements) is supposed to add, if anything.

  Also flag explicitly anywhere you think they're only disagreeing about words — e.g. two different senses of "cause" — and say which part is verbal and which is a real disagreement. Don't make it wishy-washy though; the point is definately to make the leftover disagreement as sharp as possible.
