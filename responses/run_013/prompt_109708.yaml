answer: |-
  ### 1. The Position to Be Translated  
  The core question is: **Why are some nations persistently richer than others?** Three dominant camps propose distinct deep causes:  
  - **Institutions**: Formal and informal rules (e.g., property rights, constraints on elites) enabling investment and innovation.  
  - **Geography/Ecology**: Biophysical factors (e.g., disease burden, soil fertility, navigable rivers, domesticable species) shaping productivity and trade.  
  - **Culture**: Transmitted beliefs and norms (e.g., work ethic, generalized trust, thrift) influencing economic behavior.  

  All camps use cross-country comparisons. Methods include: cross-sectional regressions correlating national traits with wealth; "natural experiments" exploiting historical accidents (e.g., colonial institutions set by unrelated factors); and "controlling for" confounders (e.g., regressing wealth on culture while holding institutions constant).  

  ---

  ### 2. The Translation  
  #### Claims as Trait Evolution  
  - **Institutions as Cause**:  
    *Translation*: Institutions are **adaptive phenotypes under selection**, where "good" institutions (e.g., secure property rights) are adaptations to environments favoring cooperation. Prosperity is a fitness proxy. *Preservation?* Economists treat institutions as *reversible* adaptations; biologists see adaptations as path-dependent. Distortion: Economists imply institutions can be designed; biologists see them as evolved constraints.  

  - **Geography/Ecology as Cause**:  
    *Translation*: Geography is a **selection pressure** filtering institutional or cultural variants. E.g., tropical disease burdens select against state capacity. *Preservation?* Intact for direct effects (e.g., crop yields). Distortion: Economists often conflate geography as both direct selector *and* historical contingency (e.g., "axis orientation" affecting trade).  

  - **Culture as Cause**:  
    *Translation*: Culture is a **vertically/horizontally transmitted trait** with fitness consequences. E.g., Protestant work ethic as a culturally transmitted allele increasing productivity. *Preservation?* Partial. Economists ignore transmission mechanisms (e.g., cultural phylogeny vs. diffusion). Distortion: Biologists require heritability estimates; economists infer from group outcomes.  

  #### Methods as Comparative Tools  
  - **Cross-Country Regressions**:  
    *Translation*: **Trait correlation without phylogenetic correction**, ignoring shared ancestry (e.g., European nations as non-independent). Analogous to regressing traits across tips while ignoring tree structure. Violates Galton’s problem severely.  

  - **Natural Experiments/Instruments**:  
    *Translation*: Using **historical perturbations to break autocorrelation**. E.g., colonial border assignments as "random" treatments isolating institutional effects. Analogous to independent contrasts assuming abrupt, exogenous changes. *Divergence*: Biologists model gradual change; economists assume perturbations reset history.  

  - **"Controlling For" Confounders**:  
    *Translation*: **Partial regression** attempting to isolate one causal path. E.g., "controlling for geography" when testing institutions ≈ removing environmental covariance. *Divergence*: Biologists use phylogenetic generalized least squares (PGLS); economists ignore deep ancestral states, risking spuriousness.  

  #### Explanatory Target  
  *Translation*: "Why is this country rich?" maps to **"Why did this lineage evolve this trait value?"** But crucially:  
  - Biologists ask "*how*" (mechanisms: drift, selection, constraint).  
  - Economists ask "*which lever*" (policy: alter institutions/culture).  
  - **No counterpart**: Nations lack clear phylogeny (horizontal transfer, fission/fusion), and "richness" is an ecosystem-level trait, not a lineage-specific one.  

  ---

  ### 3. The Residue Report  
  #### Clean Translation  
  - Geography as selection pressure → Direct mapping.  
  - Shared ancestry problem (Galton’s) → Universally applicable but ignored in economics.  
  - Natural experiments → Functionally analogous to comparative methods using historical disruptions.  

  #### Translated with Distortion  
  - **Institutions as adaptations**: Economists imply reversibility; biologists see irreversible contingency. Distortion: Economists view institutions as *variables*, biologists as *evolved states*.  
  - **Causal levers**: The economic "cause" (e.g., "institutions increase GDP") implies marginal, reversible manipulation. Biology treats causes as historical pathways (e.g., "selection favored property rights post-glaciation"). Distortion: Policy relevance vs. historical explanation.  
  - **Culture**: Translated as "heritable trait," but economists rarely test vertical transmission, ignoring cultural phylogeny.  

  #### No Counterpart  
  1. **Nations as independent units**: Economists treat countries as statistically independent tips. Biology rejects this; all lineages share deep ancestry.  
  2. **Normative intent**: "What *should* nations do?" has no biological analogue. Evolution is descriptive; economics is prescriptive.  
  3. **Reversibility**: The idea that "changing institutions now" can alter trajectory assumes negligible path dependence. Biology assumes deep contingency constrains reversibility.  
  4. **Proximate vs. ultimate cause**: Economists conflate proximate triggers (e.g., a policy reform) with ultimate causes (e.g., why reform succeeded here). Biology rigorously separates them.  

  ---

  ### 4. What the Residue Tells Us  
  The residues reveal **two blind spots**:  
  1. **In your framework**:  
     - *Contingency as constraint*: You treat historical accidents as explanatory endpoints. Economists see them as noise to bypass to find "general laws."  
     - *Irreversibility*: Your focus on path dependence clashes with economic optimism about institutional reform.  

  2. **In the economic debate**:  
     - *Phylogenetic neglect*: Residues like "nations as independent" expose a fundamental flaw. Cross-country regressions commit Galton’s error, invalidating causal claims.  
     - *Causal ambiguity*: The untranslatable "policy lever" concept masks conflation of proximate/ultimate causation. Economists often mistake a correlated trait (e.g., institutions) for a manipulable cause.  

  **Conclusion**: The residues highlight economics’ under-specified historicity. Your framework exposes that the debate often conflates *origin* (historical biology) with *mechanism* (policy science). The irreconcilable residue—normative intent and reversibility—signals economics’ implicit goal: not just to explain, but to prescribe. Your vocabulary’s strength is exposing the unaddressed phylogeny; its "blind spot" is disinterest in manipulable levers, which is the debate’s raison d’être.
