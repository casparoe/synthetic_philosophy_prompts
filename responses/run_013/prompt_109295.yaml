prompt: |-
  Compose a joke for a philosophy of language reading group that turns on Frege's puzzle about identity statements. To avoid the standard Hesperus/Phosphorus retread, set it in an office where two departments keep separate files on the same celestial body and only later discover they have been filing reports on one object under two modes of presentation; the humor should turn on the cognitive difference between the two files, not merely on the fact of co-reference. The joke should land for someone who knows the puzzle but should not require having read Frege. After the joke, provide a brief structured summary as a JSON object with fields: setup, punchline, philosophical_point, why_coreference_matters, what_would_make_it_fail, and audience. Keep each field to one or two sentences.
reasoning: |-
  We are setting the joke in an office with two departments (e.g., the "Celestial Observations Department" and the "Stellar Phenomena Division") that have separate files on the same celestial body (let's avoid Hesperus/Phosphorus, so maybe a comet or a planet). They have different names for it and different modes of presentation (e.g., one might focus on its orbit and the other on its chemical composition). The humor should come from the cognitive difference: when they discover it's the same object, they realize they've been missing a lot because they didn't connect the information in the two files.

  Joke:

  In the sprawling bureaucracy of the Astral Administration, the Celestial Observations Department (COD) had been meticulously tracking a bright object they called "Glint-7" for its dazzling appearance at dawn. Meanwhile, the Stellar Phenomena Division (SPD) had an extensive file on "Harbinger-X", a celestial body they monitored for its periodic emissions of cosmic dust. For years, the two departments filed reports independently, each unaware of the other's work. One day, an intern cross-referenced the coordinates and realized Glint-7 and Harbinger-X were one and the same. The directors of both departments met to merge the files. The COD director exclaimed, "So that's why Glint-7 kept having dust storms!" while the SPD director gasped, "And that explains why Harbinger-X was so bright in the morning!" The room fell silent as they both realized: they could have predicted the Great Meteor Shower of '22, if only they'd known they were talking about the same thing.

