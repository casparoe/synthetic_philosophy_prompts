  Now, structuring the agenda. The base case's normative role feels most upstream. If HCH collapses to individual judgment, everything else is moot. So Q1 must be whether delegation adds value. Then Q2: if it does, how does HCH define correctness? Without clarifying if it's a limit or target, later questions about implementation (like Q3's decomposition validity) lack foundation. 

