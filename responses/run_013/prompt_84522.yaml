prompt: |-
  What's your actual credence that the Church-Turing thesis is an empirical claim about the physical world, and that its mathematical half -- the bit about what an ideal human can do with pencil and paper -- is really a stipulation dressed up as a discovery? I want a number, then the decomposition with a number and one line each: the probability that effectively computable picks out a single determinate pre-theoretic notion at all, rather than a family we've been quietly narrowing; the probability that the axiomatic characterizations of human computation (the ones that start from conditions like discreteness and a bounded state and then derive Turing machines) capture everything a human could do with pencil and paper, rather than smuggling in the conclusion; the probability that the remaining gap between those axioms and Turing machines is where all the real content of the thesis lives; the probability that some actual physical process outruns Turing machines; and whatever else you think belongs. Then two extras: how much of your number is really about the complexity-theoretic cousin of the thesis, the claim that all reasonable models of computation are polynomially equivalent, since I suspect that's doing a lot of the work in my friend's head and not the thesis proper; and which single term would move most if you learned the axiom system was too strong, and in which direction.
