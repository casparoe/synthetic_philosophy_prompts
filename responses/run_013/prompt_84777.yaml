prompt: |-
  I am a PhD candidate in political theory, currently on a placement with the policy planning staff of a foreign ministry. My desk receives proposals for humanitarian intervention and regime change at a rate of roughly two or three a quarter, usually under time pressure and with incomplete intelligence; the recommendations we produce go to the minister, who signs off, and in some cases they shape a decision that cannot be reversed once forces are committed. I have been trying to develop a decision procedure that a generalist analyst, not a just war theorist, could run in a few hours on a new proposal. I am calling it the burden-shifting screen, though the name is not important. Its core commitments are these: first, it treats the population the intervention is meant to protect and the population that will bear its collateral risks as two separate ledgers, and it does not allow gains on one ledger to cancel losses on the other without a separate, named authorization; second, it requires a counterfactual baseline, comparing the no-intervention trajectory with the intervention trajectory over a fixed horizon, and it stops if the intervention is not superior at the lower bound of the uncertainty range; third, it imposes a higher threshold and a named exit authority on any intervention that creates facts on the ground not reversible within five years, including regime change, partition, and long-term occupation; fourth, it requires a last-resort test that names a specific, time-stamped diplomatic offer or path that has been rejected or is unavailable, rather than a general claim that diplomacy has been tried; fifth, it requires a proper-authority test that distinguishes UN Security Council authorization, regional authorization, coalition authorization, and unilateral action, and says what the procedure does when authorization is contested; and sixth, it requires a post-intervention accountability test naming who will be responsible for reconstruction, transitional justice, and withdrawal, with the procedure stopping if no actor is named.

  I want you to turn this into a procedure my desk can actually run. Give me the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, where it hands the decision to a person because the question is one of values rather than facts, and where it will misfire or be gamed. It has to be usable by someone with a generalist background, in a few hours, with no ability to commission new research. It should be honest about which steps are judgment calls dressed up as procedure. You may assume familiarity with the standard just war criteria and the responsibility to protect framework; use them only where they earn their place, and do not give me a literature review, a reading list, or citations. Then run it on three cases: the 1999 Kosovo intervention, the 2003 Iraq invasion, and the 2011 Libya intervention. You may assume I know the basic chronology of each case; do not spend space recounting it. For each, say what the procedure returns, what facts it needs that are contested or missing, and whether the return depends on hindsight. I am personally inclined to think the procedure should license Kosovo and block Iraq; if it blocks Kosovo or licenses Iraq, I need to see that clearly rather than have it softened. I am less sure about Libya, and I suspect that is the case where the procedure will either do real work or reveal its limits. Finally, tell me what the procedure cannot do, and which of the six commitments above is doing the most work and which is mostly decoration.
reasoning: |-
  Okay, the user is a PhD candidate in political theory working with a foreign ministry's policy planning staff. They deal with proposals for humanitarian intervention and regime change, needing a quick decision procedure. They've outlined a "burden-shifting screen" with six commitments and want it operationalized into a step-by-step process. Plus, they want it tested on Kosovo, Iraq, and Libya.

  First, I need to break down each of their six commitments into actionable questions. The user emphasized clarity, usability for generalists, and honesty about judgment calls. They don't want fluff—just practical steps. 

  The core challenges here are balancing ethical rigor with real-world constraints. The procedure must handle incomplete intel and time pressure. Each step needs clear pass/fail criteria, but some steps will inevitably involve value judgments. Identifying where the procedure stops (hard no) versus where it requires human judgment is crucial.

  Looking at the six commitments:
  1. Separate ledgers for protected vs. risk-bearing populations. This prevents moral offsetting. The question must force explicit acknowledgment of harm to civilians in the intervening coalition's countries. How to quantify this without new research? Probably requires conservative estimates based on available intel.

  2. Counterfactual baseline with uncertainty range. This is analytically tough under time constraints. The procedure must rely on existing intel assessments but set a high bar—intervention must be better even in the worst-case scenario. The "lower bound" requirement could be a major stumbling block.

  3. Irreversible facts threshold. This seems targeted at regime change. The "named exit authority" requirement is smart—it prevents open-ended commitments. But who qualifies? Probably needs to be a specific entity, not just "the UN."

  4. Last-resort test with specific diplomacy. This kills vague claims like "diplomacy failed." Requiring a timestamped offer makes it concrete. But what counts as "unavailable"? Judgment call.

  5. Proper-authority test. Tricky with contested authorizations. The user wants differentiation between UNSC/regional/etc. approval. The procedure must handle gray areas like when a coalition claims legitimacy without clear mandate.

  6. Post-intervention accountability. Naming responsible actors for cleanup. This is often overlooked. The procedure should halt if no one's named—but what if an actor is named but lacks capacity? Another judgment call.

  For the case applications:
  - Kosovo: Likely passes most tests but may stumble on proper-authority (no UNSC). Need to show how regional authorization (NATO) fits.
  - Iraq: Should clearly fail multiple tests—counterfactual, last-resort, accountability. Must not soften this.
  - Libya: The real test. Passed initial criteria but failed post-accountability. Procedure should catch that if applied rigorously.

  Biggest vulnerability? Gaming the counterfactual baseline or last-resort diplomacy. Also, step 6 (accountability) might be the most important—it prevents reckless interventions. Step 5 (authority) might be decorative since realpolitik often overrides it.

  User's deeper needs: They want ethical rigor but also bureaucratic defensibility. The procedure must withstand ministerial scrutiny and potential backlash. Unspoken worry: being responsible for a bad intervention recommendation. The Libya example will resonate because it's the poster child for "good start, bad finish."
answer: |-
  Here is the operationalized procedure as a 12-step checklist. **Bold** indicates hard stops; *italics* indicate judgment calls requiring human input. Use conservative estimates when data is incomplete.

  ---

  ### The Burden-Shifting Screen: Operational Procedure  
  *(Run in sequence; stop if any step fails)*

  1. **Separate Ledgers Identification**  
     - *Question:* "Name the specific civilian population to be protected (Ledger A) and the civilian population(s) bearing foreseeable collateral risks (Ledger B)."  
     - *Sufficient Answer:* Explicit, non-overlapping groups (e.g., "Ledger A: Kosovar Albanians; Ledger B: Serbian civilians and NATO ground troops").  
     - *Stop if:* Groups are conflated or Ledger B is omitted.  
     - *Gaming risk:* Downplaying Ledger B casualties.

  2. **Counterfactual Baseline (Lower-Bound Test)**  
     - *Question:* "Using existing intelligence, compare:  
       a) Worst-case no-intervention trajectory over 12 months.  
       b) Best-case intervention trajectory over 12 months.  
       Is (b) clearly superior to (a) in reducing harm to Ledger A *without* offsetting gains against Ledger B losses?"  
     - *Sufficient Answer:* Quantifiable metrics (deaths, displacement) with sources; qualitative only if unavoidable.  
     - **Stop if:** Intervention not superior at lower bound of uncertainty.  
     - *Judgment call:* Assessing intelligence credibility.  
     - *Misfire risk:* Over-reliance on speculative worst-case scenarios.

  3. **Irreversible Facts Threshold**  
     - *Question:* "Could this intervention create regime change, partition, or occupation lasting >5 years?"  
     - If NO: Proceed to Step 4.  
     - If YES: "Name the entity with veto power over exit timing. Is their commitment documented?"  
     - *Sufficient Answer:* Specific actor (e.g., "UNSC via resolution renewal").  
     - **Stop if:** No named authority or mechanism exists.  
     - *Gaming risk:* Vague commitments (e.g., "coalition consensus").

  4. **Last-Resort Test (Specific Diplomatic Path)**  
     - *Question:* "Name one credible, time-bound diplomatic alternative that was:  
       a) Explicitly offered and rejected, OR  
       b) Unavailable due to named actor's intransigence."  
     - *Sufficient Answer:* Dated offer with parties (e.g., "Rambouillet Accord, rejected by Serbia on 18 March 1999").  
     - **Stop if:** Only general claims ("exhausted options").  
     - *Judgment call:* Credibility of the offer.  

  5. **Proper-Authority Test**  
     - *Question:* "Which authority category applies?  
       UNSC | Regional body | Coalition | Unilateral  
       If contested, does the proposer acknowledge contestation?"  
     - *Sufficient Answer:* Category named + contingency if contested (e.g., "Regional (NATO), contested by Russia; procedure requires heightened scrutiny at Step 6").  
     - *Never a stop alone*—proceed with risk weighting.  
     - *Decoration note:* Adds political risk context but rarely decisive.  

  6. **Post-Intervention Accountability**  
     - *Question:* "Name the entity responsible for:  
       a) Reconstruction funding,  
       b) Transitional justice,  
       c) Withdrawal timeline.  
       Is their capability documented?"  
     - *Sufficient Answer:* Specific actors per pillar (e.g., "EU for reconstruction; ICC for justice").  
     - **Stop if:** Any pillar unassigned.  
     - *Gaming risk:* Assigning weak/non-credible actors.  

  ---

  ### Case Applications  
  **Assumption:** Uses best-available intel *at decision time*; "hindsight" flagged where critical.

  1. **Kosovo (1999)**  
     - Step 1: Pass (Ledger A: Kosovar Albanians; Ledger B: Serb civilians).  
     - Step 2: Pass (Lower bound: 10K+ deaths without intervention vs. 500–2K with; NATO air dominance reduced Ledger B risk).  
     - Step 3: Pass (No regime change initially intended; exit via UNSC 1244).  
     - Step 4: Pass (Rambouillet rejection documented).  
     - Step 5: Pass (Regional/NATO; contested acknowledged).  
     - Step 6: Pass (UNSC 1244 named UNMIK for reconstruction).  
     - **Return:** ✅ Proceed.  
     - *Contested fact:* Serbia’s genocidal intent (intel ambiguous in 1999).  
     - *Hindsight?* No—key facts known pre-intervention.

  2. **Iraq (2003)**  
     - Step 1: Pass (Ledger A: Iraqi civilians; Ledger B: Iraqi civilians/coalition forces).  
     - Step 2: **STOP** (Lower-bound no-intervention: sanctions/corruption deaths vs. intervention: civil war risk. Intel showed WMD uncertainty; lower-bound intervention scenario *not* clearly superior).  
     - Step 3: **STOP** (Regime change intended; no exit authority named—"Coalition Provisional Authority" ad hoc).  
     - Step 4: **STOP** (No specific offer to Saddam; "diplomacy exhausted" vague).  
     - **Return:** ❌ Halt at Step 2/3/4.  
     - *Contested fact:* Imminence of WMD threat (intel flawed but accepted at time).  
     - *Hindsight?* Step 2 fails even with 2003 intel.

  3. **Libya (2011)**  
     - Step 1: Pass (Ledger A: Benghazi civilians; Ledger B: Libyan civilians).  
     - Step 2: Pass (Lower bound: Gaddafi’s "no mercy" threat vs. limited NATO bombing campaign).  
     - Step 3: **STOP** (Regime change likely; no exit authority named—assumed "transitional council" would govern).  
     - Step 4: Pass (Arab League demand for no-fly zone rejected by Gaddafi).  
     - Step 5: Pass (UNSC 1973; contested by BRICS but acknowledged).  
     - Step 6: **STOP** (No actor named for reconstruction/justice; assumed UN/NTC capacity).  
     - **Return:** ❌ Halt at Step 3 or 6.  
     - *Contested fact:* Feasibility of limited intervention (NATO’s shift to regime change was foreseeable?).  
     - *Hindsight?* Step 3/6 fails pre-intervention—no credible exit plan existed.

  ---

  ### Limitations & Key Insights  
  **What the procedure cannot do:**  
  - Predict unforeseeable consequences (e.g., ISIS rise post-Iraq).  
  - Resolve ambiguous intelligence (judgment calls required).  
  - Assign moral weight (e.g., "Is 1 coalition life = 10 foreign lives?").  
  - Override high-level political mandates.  

  **Commitment effectiveness:**  
  1. **Most critical:** Step 6 (Accountability). Forces concrete planning—failed in Libya/Iraq.  
  2. **High value:** Step 2 (Counterfactual) and Step 4 (Last-resort). Blocks wishful thinking.  
  3. **Decoration:** Step 5 (Proper-Authority). Advisors will note contestation but rarely veto action.  

  **Vulnerabilities:**  
  - Steps 2 and 4 rely on honest intelligence presentation; gaming via "worst-case inflation" for no-intervention scenarios.  
  - Step 3’s "5-year irreversibility" is arbitrary (but forces engagement with long-term stakes).  

  **Recommendation:** This screen blocks Iraq and Libya decisively while permitting Kosovo, aligning with your priors. Its power lies in forcing specificity—especially on accountability and diplomacy—where vagueness enables reckless action. For policy use, integrate it as a mandatory checklist *before* strategic review.
