  I'm a compiler engineer by trade, and my working vocabulary is the one from dataflow analysis and abstract interpretation: a lattice of program states, monotone transfer functions, fixpoint iteration from bottom, widening operators bolted on when the iteration refuses to converge, and a termination argument that has to be written down before I can ship anything. I've been sitting in on a seminar that keeps invoking Zorn's lemma, and I want it restated in the vocabulary I actually think in, as faithfully as you can manage — partial orders as lattices of program states, chains as ascending sequences of approximations, upper bounds as joins, maximal elements as normal forms or fixpoints, the choice function as the oracle I am not allowed to implement. The usual applications should come along for the ride, since they are where I get lost: maximal ideals, bases for vector spaces, the Hahn–Banach theorem, the fact that Zorn is equivalent to the axiom of choice and to well-ordering. Assume I know the order theory only at the level it shows up in static analysis papers — I am comfortable with monotone maps on complete lattices and with Kleene iteration, and much less comfortable with ordinals and transfinite recursion, which is exactly the part I suspect is doing the work.

  Then give me the residue report, and be willing to tell me that I am wrong. I have two hunches I would like adjudicated rather than confirmed. The first is that the constructive content I care about — a loop, a bound on the number of iterations, a witness I could actually run — is genuinely absent from the lemma rather than merely absent from the textbook phrasing, and that this is the same kind of absence I feel when a paper asserts that a fixpoint exists and then does not tell me whether the analysis terminates. The second is about where the axiom of choice is spent in the standard transfinite construction: my hunch is that the greedy step along a chain is free and that everything is paid at the limit stages, but I suspect I have this backwards, because I keep modelling the construction as a loop and a loop has no limit stages. I would also like to know what the least-fixpoint theorems I do know — monotone maps on complete lattices, iteration up through the ordinals until you stabilize — are actually buying me that Zorn is not, and whether the difference is a difference in strength or a difference in what I am allowed to extract from the conclusion. One thing I already notice and want you to make something of: in my world a fixpoint is usually the least one, unique and reached from below, whereas Zorn hands me a maximal element that may sit next to others incomparable to it, and I do not know whether that is a deep difference or just the same theorem read in the other direction.

  Finally, I want the report to end with a judgment rather than a summary. Where a piece of the lemma or of its standard proof has no counterpart in my vocabulary at all, say so plainly instead of manufacturing a plausible-sounding analogy; where the translation only goes through if I quietly accept one of your assumptions, flag that as a distortion rather than calling it a translation. And then tell me what the residue amounts to: is it a defect in my framework — something a fixpoint-and-termination mindset genuinely cannot express, so that my instinct that existence claims are incomplete without a procedure is a limitation rather than a legitimate demand — or is it evidence that the lemma is less clear than its users suppose, an existence claim whose content only becomes visible once you try to say what would count as finding the thing? I would rather have a short honest answer that concedes the translation fails in places than a tidy one that pretends everything maps.
