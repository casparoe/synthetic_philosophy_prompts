prompt: |-
  I'm assembling cases for a unit on the persistence of artifacts, and the standard Ship of Theseus has become useless — every answer produces the same version, with the planks removed one at a time, stored, and later reassembled. Construct a fresh case that reproduces a specified three-way split by a different mechanism. The split must fall out of the views rather than be stipulated: a continuity view, on which a thing persists just in case its stages form an unbroken spatiotemporal-causal chain, must count the continuously maintained candidate as the original; a matter view, on which identity is carried by the material, so that the original is wherever its planks now are, must count the other candidate as the original; and mereological essentialism, on which a thing has its parts essentially, must say the original no longer exists at all.

  Constraints: one realistic scenario, no time travel, teleportation, or branching; the second candidate must not be produced by anyone deliberately reassembling the original's parts — it has to arise incidentally, from the discarded material being reused in the ordinary course of business; the split must come out of the physical history alone, not from a renaming, a change of registry, or anyone declaring which is which; and apart from the matter-versus-continuity difference itself, the two candidates should be as alike as the scenario allows, so that no further asymmetry (a name, a title, a record) is doing the work.

  Then, in order: the verdict of each view and the step that yields it; the single feature of the history that produces the split; what each verdict becomes if that feature is removed; and where a defender of the continuity view will say the matter view has changed the subject.

  Give the scenario in one paragraph of at most 150 words and everything after it in at most 300 words. Flag which of the three verdicts is genuinely contested among people who work on persistence and which, if any, is settled; do not present a contested view as the consensus.
reasoning: |-
  Hmm, the user wants a fresh thought experiment to replace the Ship of Theseus, which has become too predictable. They need a scenario that naturally creates a three-way split in persistence theories without artificial stipulations. The key requirements are: continuity theory must identify the maintained object as original, matter theory must point to where the original planks ended up, and mereological essentialism must deny both. 

  The constraints are challenging: no sci-fi elements, the reassembled object must emerge incidentally from normal reuse of discarded materials, and no naming/conventions can influence the verdict. The candidates should be physically symmetric except for their histories. 

  I'm considering maritime contexts since ships naturally undergo piecemeal replacement. The solution emerges when maintenance and plank reuse happen simultaneously: a shipyard replaces planks during drydock while a nearby workshop uses discarded planks to build furniture crates. When the crate's dimensions accidentally match the ship's removed section, we get the perfect accidental reassembly. 

  The physical history's crucial feature is the temporal gap between plank removal and crate construction. Remove that simultaneity, and all views converge on the maintained ship. Continuity theorists would argue matter theorists mistake physical similarity for identity - like calling a wax replica "the original candle." 

  I should note that continuity vs matter is genuinely debated, while mereological essentialism is more niche. The word counts force brutal concision: 150 for the scenario, 300 for analysis. The crate detail satisfies "incidental reassembly" beautifully - it's just shipwrights pragmatically reusing materials.
answer: |-
  **Scenario:** A historic wooden ferry undergoes phased restoration. While in drydock, workers simultaneously: (1) replace decayed hull planks with new timber, storing the removed original planks nearby; and (2) use *other* recently discarded original planks (from a prior phase) to construct sturdy crates for transporting new materials. Due to identical dimensions and available wood, one crate, built as the new planks are installed, inadvertently forms an exact duplicate section of the original hull structure. The continuously repaired ferry sails away; the crate remains at the dock.

  **Verdicts & Steps:**
  1.  **Continuity View:** The sailing ferry is the original. Its stages are connected by an unbroken spatiotemporal-causal chain through the continuous restoration process.
  2.  **Matter View:** The crate is the original. It contains a significant portion of the original planks arranged in their original functional configuration (part of the hull structure).
  3.  **Mereological Essentialism:** The original ferry no longer exists. Parts were removed/added during restoration, violating essential part identity.

  **Crucial Feature:** The *simultaneous* occurrence of replacing a plank on the ferry and reusing previously discarded planks into the crate configuration *during the same time window*. This creates two contemporaneous entities both laying claim to being "the original" via different criteria.

  **Without Simultaneity:** If plank reuse only happened *after* all replacements were complete, the matter view would likely concede the sailing ferry is original (despite changed parts), and mereological essentialism would still deny persistence. No split arises.

  **Continuity View's Charge:** A continuity theorist argues the matter view mistakes mere physical similarity and material overlap (the crate) for genuine persistence, changing the subject from tracking the *actual continuous object* through space and time to identifying a *physically similar replica* made of old parts. It confuses identity with constitution.

  **Contested Status:** The split between the **Continuity View** and the **Matter View** is genuinely contested among metaphysicians. Mereological essentialism is generally considered a much less popular, more niche position, though not definitively "settled" against.
