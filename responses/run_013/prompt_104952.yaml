prompt: |-
  I teach a mid-level undergraduate course on rationality and choice for philosophy students who have had no economics, and next week I reach the unit on solution concepts. Two questions from this term's students have left me unsure what I should be telling them. The first came with a payoff table for a single player choosing among three rows against two columns: the top row pays 2 in the left column and 0 in the right, the middle row pays 0 and 2, and the bottom row pays 0.9 in both. The student observed that no pure row does better than the bottom row against both columns, so on my own account the bottom row is not dominated; but she pointed out that flipping a fair coin between the top and middle rows pays 1 in either column, which beats the bottom row everywhere. She wanted to know whether my claim that dominance reasoning eliminates exactly the strategies that are never best responses was simply false. The second student, having noticed that one can sometimes delete one strategy first and reach a different surviving set than if one had deleted a different strategy first, asked whether the order of elimination is arbitrary and therefore whether the whole procedure is ill-defined.

  I had been teaching the method as a well-defined one: the surviving set is invariant under the order of deletion, and iterated dominance elimination is the same thing as iteratively discarding strategies that are never best responses. Now I am inclined to demote it in the lecture to a rough heuristic rather than a solution concept, since it appears to depend on choices the students can see are arbitrary and to fall apart the moment mixtures enter. Is that the honest thing to do?

  I would like to know which of the claims I have been making are actually true, which need qualification, and how to present the qualification to students who have the example in front of them and will not be satisfied by being told that the issue is merely technical. Please be specific about where the fragility actually lies and where it does not, since I would rather repair the lecture than quietly drop the topic.
reasoning: |-
  Okay, let me start by unpacking the professor's dilemma. They teach undergrad philosophy students about rationality and choice, and they've hit a snag with solution concepts. Two student questions have shaken their confidence in teaching iterated dominance. 

  First student presents a 3x2 game: rows Top, Middle, Bottom with payoffs (2,0), (0,2), and (0.9,0.9). Bottom isn't strictly dominated by any pure strategy since it beats Top against Right and Middle against Left. But the student notices a mixed strategy (50/50 Top/Middle) pays 1 everywhere, dominating Bottom. This contradicts the professor's claim that dominance elimination equals "never best response" elimination. 

  Hmm, the core issue here is about pure vs mixed dominance. The professor probably taught pure strategy dominance but didn't clarify that mixed strategies change the game. That's why the student's counterexample lands - it reveals the definitional gap. The professor's claim only holds if we restrict to pure strategies. 

  Second student points out order-dependence in elimination sequences. This is actually subtle - for strict dominance the order doesn't matter, but for weak dominance it does. The professor might have glossed over this distinction. Weak dominance allows "over-deletion" depending on sequence, which makes it feel arbitrary. 

  The professor's panic is understandable. They considered demoting dominance to "heuristic" status, but that feels like surrender. The real solution is precision: 
  - Separate pure/mixed dominance upfront 
  - Distinguish strict vs weak dominance 
  - Admit that "never best response" equivalence fails for mixed strategies 
  - Clarify that order-invariance only holds for strict dominance 

  For the lecture repair, I'd suggest: 
  1. Thank the first student for catching an important nuance - this shows active learning 
  2. Explicitly define two dominance types: pure-strategy dominated vs mixed-strategy dominated 
  3. Use her example to demonstrate the difference 
  4. For second student: confirm strict dominance order-invariance but show weak dominance counterexample 
  5. Emphasize that rationality arguments require specifying the strategy set (pure/mixed) 

  The payoff matrix is perfect for live demonstration. Walk through: 
  - Pure strategies: Bottom not dominated 
  - Mixed: show calculation proving domination 
  - Discuss why philosophers might care about pure vs mixed (epistemic access, computational limits) 

  For weak dominance order-dependence, use a simple 2x2 example where deleting A then B leaves C, but deleting B then A leaves D. Contrast with strict dominance where order never matters. 

  Key is to frame this not as "the theory is broken" but "here's how we refine concepts to avoid ambiguity". That maintains intellectual integrity while salvaging the framework. The professor's instinct to repair rather than drop is spot-on - these nuances make the topic richer for philosophy students.
answer: |-
  Based on your students' sharp questions and the need for conceptual clarity, here's how to repair your lecture while maintaining rigor. The core issues involve **distinguishing pure vs. mixed strategies** and **strict vs. weak dominance**. Your claims are salvageable with precise qualifications.

  ### 1. Addressing the First Student's Question (Mixed Strategies & Dominance)
  **The Problem:**  
  Your claim that "dominance eliminates exactly strategies that are never best responses" holds **only if we restrict attention to pure strategies**. Once mixed strategies are allowed, the equivalence breaks.  

  **Key Qualification:**  
  - **Pure-Strategy Dominance:** A strategy \(s_i\) is strictly dominated (by another *pure* strategy) if there exists a pure strategy \(s_i'\) such that:  
    \(u_i(s_i', s_{-i}) > u_i(s_i, s_{-i})\) for all \(s_{-i}\).  
    In your example, no *pure* strategy dominates Bottom (Row 3).  
  - **Mixed-Strategy Dominance:** A strategy \(s_i\) is strictly dominated (by a *mixed* strategy) if there exists a mixed strategy \(\sigma_i\) such that:  
    \(u_i(\sigma_i, s_{-i}) > u_i(s_i, s_{-i})\) for all \(s_{-i}\).  
    Here, the 50-50 mix of Top and Middle yields 1 > 0.9 against both columns, so Bottom *is* strictly dominated by a mixed strategy.  

  **How to Explain to Students:**  
  - Admit the oversight: "My earlier statement assumed we only consider pure strategies. When mixed strategies are allowed, a strategy can be dominated *even if no single pure strategy dominates it*."  
  - Clarify the link to best responses:  
    - A strategy is **never a best response** (to any pure or mixed beliefs about opponents) **iff it is strictly dominated** (possibly by a mixed strategy).  
    - Bottom *is* a best response to pure beliefs (e.g., if Column 1 is certain, Top is unique best response; if Column 2 is certain, Middle is unique best response).  
    - But Bottom is **not** a best response to *mixed* beliefs (e.g., if columns are equally likely, the 50-50 mix yields 1 > 0.9).  
  - **Conclusion for Lecture:**  
    > "Dominance reasoning *does* eliminate exactly strategies that are never best responses, **but only if we allow dominators to be mixed strategies and consider mixed beliefs**. In pure-strategy analysis, this equivalence fails."  

  ---

  ### 2. Addressing the Second Student's Question (Order of Elimination)
  **The Problem:**  
  Order invariance depends on **strict vs. weak dominance**:  
  - **Strict Dominance:** Order of elimination **is invariant**. If \(s_i\) is strictly dominated (by any strategy, pure or mixed), removing it never affects whether other strategies are dominated.  
  - **Weak Dominance:** Order of elimination **can matter**. Removing one weakly dominated strategy may render another strategy no longer weakly dominated (or vice versa).  

  **Example for Weak Dominance Order-Dependence:**  
  Consider this game:  
  | | L | R |  
  |-|---|---|  
  |**U**| 1,1 | 0,0 |  
  |**D**| 0,0 | 0,0 |  

  - **Delete U first:** D is weakly dominated by U (since U ≥ D everywhere, and U > D against L). After deleting U, D survives.  
  - **Delete D first:** U is *not* weakly dominated (no strategy beats it against L). After deleting D, U survives.  
  Result: Different surviving sets depending on order.  

  **How to Explain to Students:**  
  - "Order matters **only for weak dominance**. For *strict* dominance, deletion order doesn't affect the final set. This is because strict dominance relies on *strict* inequalities, which aren't 'broken' when other strategies are removed."  
  - Emphasize: Weak dominance is less robust. Philosophers might critique it as depending on "arbitrary" deletion sequences. Strict dominance is more reliable.  

  ---

  ### How to Repair Your Lecture
  #### Step-by-Step Qualification Framework:
  1. **Clarify the Scope of Analysis:**  
     - Always specify whether you are restricting to **pure strategies only** or allowing **mixed strategies**.  
     - Distinguish **strict** vs. **weak** dominance explicitly.  

  2. **Refine Your Original Claims:**  
     > "Iterated *strict* dominance (ISD) is order-invariant and equivalent to iteratively removing strategies never a best response *to any mixed belief*. But if we restrict to pure strategies, or use weak dominance, these properties can fail."  

  3. **Use Their Examples for Transparency:**  
     - **First Student's Game:**  
       - Show that Bottom is not *pure-strategy* dominated but *is mixed-strategy* dominated.  
       - Explain why this means Bottom is never a best response to *mixed beliefs* about columns.  
     - **Second Student's Concern:**  
       - Contrast a game with strict dominance (order doesn't matter) vs. one with weak dominance (order matters).  

  4. **Philosophical Context (For Credibility):**  
     - "These nuances reveal how solution concepts depend on **what we assume about rationality**. If players can randomize, dominance is more powerful. If we insist on pure strategies, it's weaker. Similarly, weak dominance assumes players never choose 'pointlessly inferior' options, but deletion order reflects ambiguity in what 'pointless' means."  

  5. **Salvage the Core Insight:**  
     - ISD remains a sound solution concept **if**:  
       - Mixed strategies are allowed,  
       - We use strict dominance,  
       - We acknowledge it assumes common knowledge of rationality.  
     - Weak dominance is useful heuristically but less rigorous.  

  ---

  ### Summary of Truths & Qualifications
  | **Your Original Claim**               | **Correction/Qualification**                                                                 |
  |----------------------------------------|----------------------------------------------------------------------------------------------|
  | "Dominance ≡ never best response"      | True **iff** dominators can be mixed and beliefs can be mixed. Fails for pure strategies.    |
  | "Order of deletion is invariant"       | True for **strict dominance** (pure or mixed). False for **weak dominance**.                 |
  | "ISD is well-defined"                  | True for strict dominance. For weak dominance, it’s context-dependent.                       |

  **Honest Conclusion for Students:**  
  > "Dominance reasoning isn't arbitrary—it's fragile only if we overlook key distinctions. *Strict* dominance with mixed strategies is robust. But once we use pure strategies or weak dominance, we introduce subtleties philosophers should scrutinize. This isn’t a flaw in game theory; it’s a refinement of what rationality demands."

  This approach preserves the topic’s integrity while transforming student objections into teachable moments about precision in assumptions.
