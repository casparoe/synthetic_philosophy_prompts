answer: |-
  Here's a breakdown of the "It's intent, not numbers" claim, moving from definitional truths to radical interpretations, assessing each:

  1.  **Literal Definitional Claim:** "Genocide *requires* specific genocidal intent ('intent to destroy') as defined in law; it does not require any specific numerical threshold *as a standalone element*."
      *   **Plausibility:** True. The UN Genocide Convention (UNGC) defines genocide by specific acts *committed with* "intent to destroy, in whole or in part, a national, ethnical, racial or religious group, as such." Numbers aren't a distinct legal requirement.
      *   **Supports Argument?** Yes, for excluding cases lacking clear genocidal intent (e.g., pure territorial expulsion without intent to destroy the group) and for including small-scale acts *if* clear intent exists. It establishes intent as the threshold.
      *   **Tautology Risk:** Low. This is the core legal principle.

  2.  **"In Part" as Purely Qualitative Claim:** "The 'in part' requirement refers only to the *intent* targeting a distinct part (e.g., leadership, a specific community), not the actual size or substantiality of that part. Intent to destroy *any* part suffices."
      *   **Plausibility:** Implausible. Legal precedent is clear that "in part" means a "substantial part" numerically or qualitatively (e.g., significance to the group's survival). Targeting a single family, while horrific, would not meet the legal threshold for genocide.
      *   **Supports Argument?** Primarily used to argue for including small-scale cases. However, courts consistently reject this pure qualitative reading; numbers/significance creep back in via the "substantial" interpretation.
      *   **Tautology Risk:** Moderate. Ignores how courts operationalize "in part."

  3.  **Numbers are Irrelevant to Proving Intent:** "The scale or pattern of atrocities provides *no evidence whatsoever* of genocidal intent. Intent is *only* found in explicit statements or documents."
      *   **Plausibility:** Implausible. Tribunals routinely *infer* genocidal intent from the systematic nature, scale, brutality, targeting, and consequences of the acts, especially where direct orders are absent. Large-scale killing or expulsion is powerful evidence *for* intent to destroy.
      *   **Supports Argument?** Used both ways: to exclude cases with large numbers but no "smoking gun" (ignoring inferable intent) or to insist tiny cases need explicit proof (ignoring context). But it misrepresents legal practice.
      *   **Tautology Risk:** Low, but deeply misleading. It falsely separates intent from the acts used to prove it.

  4.  **Scope of "Destruction" Claim (Lemkin vs. UNGC):** "'Intent to destroy the group' encompasses cultural destruction (language, institutions, identity), as per Lemkin's original conception, not just physical/biological annihilation as implied by the UNGC acts."
      *   **Plausibility:** Plausible historically (Lemkin's view), but legally incorrect regarding the UNGC. The Convention's listed acts focus on physical and biological destruction. While cultural destruction can be *evidence* of genocidal intent or constitute other crimes (like persecution), it's not genocide *per se* under the UNGC *unless* linked to the listed physical/biological acts with the requisite intent. Courts strictly apply the Convention definition.
      *   **Supports Argument?** Often used to *include* cases of forced assimilation, cultural suppression, or expulsion *as genocide*, arguing the intent is truly destructive. But this stretches the legal definition beyond its current boundaries.
      *   **Tautology Risk:** Moderate. It uses a broader concept of "destruction" to find intent where the law might not.

  5.  **Intent Strength Claim:** "Genocidal intent requires only that the perpetrators knew destruction of the group was a *foreseeable consequence* of their actions, not that it was their *purpose* or *aim*."
      *   **Plausibility:** Debated, but leaning towards implausible for core genocide. The dominant legal view (especially at the ICTY/ICTR) requires specific/direct intent (*dolus specialis*) – destruction of the group must be the *purpose* or a *reason* for acting, not merely a known side-effect (dolus eventualis). Expelling a group to seize land, knowing many might die, likely falls short of *dolus specialis* unless evidence shows the deaths *themselves* were intended as a means of destruction. However, foreseeability can be strong *evidence* of purpose.
      *   **Supports Argument?** Used to *include* atrocities like mass expulsions under harsh conditions (foreseeing mass death) or systematic rape (foreseeing destruction of social fabric) as genocide by lowering the intent bar.
      *   **Tautology Risk:** Low, but highly contentious and usually rejected by courts for the core crime.

  **What the Person Probably Means:**
  Most commonly, the person means **#1 (Literal Definitional Claim)**, emphasizing that genocide hinges on a specific mental state ("destroy the group") absent in other atrocity crimes. They likely couple this implicitly with **#4 (Scope of Destruction Claim)**, believing that forced removal *is* an act intending destruction (cultural/social destruction), and/or downplay the "substantial part" requirement (**#2**). They often reject **#3**, not realizing courts *use* numbers/patterns to infer intent.

  **Verdict:** The slogan is fundamentally correct that intent is the defining legal element, but it misleadingly minimizes how courts interpret "in part" as requiring substantiality, infer intent from scale and patterns, and strictly require direct intent to physically/biological destroy – making numbers and context crucial evidence in practice, not irrelevant.
