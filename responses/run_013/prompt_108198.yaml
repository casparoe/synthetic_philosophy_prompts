prompt: |-
  I'm an undergrad and somehow ended up as the student rep on my university's animal care committee (long story), and I have to vote Thursday on a protocol, so I need to write the one-page opinion I'll circulate before the meeting. I'm also taking a consciousness course this term, which is probably why this is suddenly eating my brain.

  Here's the case. A lab wants to run avoidance-learning trials on 60 shore crabs: brief electric shocks to a leg, repeated over a few days, and they're asking us to waive the anesthetic requirement on the grounds that crabs don't have the kind of nervous system that supports experience. Our policy says invertebrates only need the full treatment if there's positive reason to think they can suffer, and if there is, we have to require anesthesia or a humane endpoint. What's making it hard is that one of the lab's people built a little portable rig that reads what she calls a "global ignition index" off the crab's central ganglia — basically how widely and how long a stimulus signal gets broadcast through the animal's nervous system — and in the pilot, the shocks produced almost no ignition. Their argument: no broadcast, no global workspace, no experience, so no anesthetic, and anyway anesthesia would wreck the learning data they're actually after. One of our members says that's just global workspace theory being used as a consciousness detector, and that GWT was built to explain access — what gets broadcast and made available to report and to control behaviour — not phenomenal consciousness, i.e. what it's like for the animal. Her view is that we should require anesthesia or a humane endpoint regardless, since nothing in the pilot speaks to whether the shocks hurt. The lab's reply is that if we won't act on the only relevant evidence they can produce, the policy is decoration.

  Draft the opinion for me: recommend approve, approve with conditions, or reject, with the reasoning I can actually defend in the room, and be honest about the strongest thing on the losing side rather than just landing on the precautionary answer because it feels safe. If you recommend conditions, make them concrete enough that the committee can vote on them as written. I'd also like you to separate the questions that more data could settle from the ones that are conceptual and won't be settled by any experiment, and to say what single piece of evidence or argument would actually flip the recommendation. Max 600 words, one page, and don't bother with references — nobody in the room wants a reading list.
reasoning: |-
  Okay, the user is an undergrad student rep on an animal care committee who has to vote on a protocol involving shore crabs and electric shocks. They need a one-page opinion draft that recommends approve, approve with conditions, or reject. The key issue is whether the crabs need anesthesia during the shocks based on the lab's argument that their "global ignition index" shows no experience of pain. There's a committee member arguing that this index doesn't address phenomenal consciousness (what it's like to feel pain).

  The user is taking a consciousness course, which explains why they're deeply engaged with the philosophical aspects. Their explicit needs include a defensible recommendation, concrete conditions if applicable, distinguishing empirical from conceptual questions, and identifying what evidence could change the recommendation. Implicitly, they likely feel pressure as a student rep among faculty, need to balance ethics with practicality, and want to avoid appearing either too deferential or too rigid.

  The core tension is between: (1) The lab's empirical claim (no ignition = no experience) and practical need for clean data, versus (2) The committee member's philosophical objection (ignition measures access consciousness, not necessarily suffering). The policy hinges on "positive reason to think they can suffer," which is ambiguous.

  For the recommendation: Approving without conditions feels ethically risky given the conceptual gap in measuring suffering. Outright rejecting ignores the policy's allowance for invertebrate exceptions. Approving with conditions is the most balanced path. The strongest losing argument is the lab's valid point that if measurable neural data isn't accepted, the policy becomes arbitrary.

  Key conditions to propose: Mandatory humane endpoint triggers (e.g., 3 refusals to re-enter), pilot validation that the index actually correlates with harm responses, and independent replication. This addresses both ethical and scientific rigor concerns.

  The empirical vs. conceptual split: Empirical = whether ignition correlates with behavioral distress markers. Conceptual = whether any neural measure can confirm phenomenal consciousness. The flip evidence would be if new data showed ignition spikes during harmful stimuli in crabs or similar species.

  The draft needs to be concise (<600 words), avoid jargon where possible, and position the student rep as thoughtful but decisive. Tone should be collegial but firm on ethics, acknowledging the lab's effort while upholding welfare standards.
answer: |-
  ## Recommendation: Approve with Conditions

  I recommend approving the protocol **conditional on implementation of a humane endpoint** and **validation of the "global ignition index" (GII)** as a reliable indicator of aversive state in this specific context.

  ### Reasoning

  1.  **Policy Compliance:** Our policy requires full anesthetic treatment for invertebrates *only* if there is "positive reason to think they can suffer." The lab presents a novel physiological measure (GII) showing minimal neural broadcast in response to the shock stimulus during their pilot. While **not definitive proof of absence of suffering**, this constitutes an attempt to provide evidence relevant to the policy's threshold ("positive reason"). Rejecting *any* empirical neural data out of hand risks rendering the invertebrate clause purely precautionary in practice, potentially undermining its intent and scientific engagement, as the lab argues.

  2.  **Addressing the Core Concern (Suffering vs. Access):** The committee member correctly highlights the crucial distinction between *global workspace access* (what GII measures) and *phenomenal consciousness* (subjective experience, e.g., pain). **This is fundamentally conceptual and unlikely to be resolved by any single experiment.** We cannot definitively know if crabs experience "what it's like" to be shocked. However, GWT posits that global broadcast is *necessary* for such reportable, integrated experiences. The lack of GII activation is a *negative indicator* consistent with the absence of such integrated experience. While **not absolute proof**, it provides relevant evidence under the policy's framework.

  3.  **Precaution & Practicality:** Demanding anesthesia nullifies the experiment's core purpose (learning). Requiring a humane endpoint balances precaution with feasibility. It provides a concrete safeguard if the crab exhibits behavioral signs of distress *despite* the low GII reading, acknowledging that behavior remains a primary welfare indicator.

  4.  **Scientific Rigor:** The GII method is novel. Its interpretation specifically as indicating *lack of aversive experience* in this context needs validation beyond the pilot's mere demonstration of low signal during shock.

  ### Conditions

  1.  **Mandatory Humane Endpoint:** Any individual crab showing **clear behavioral signs of distress or aversion** during the trials (e.g., prolonged freezing beyond baseline, frantic escape attempts unrelated to the shock contingency, autotomy, refusal to re-enter the testing chamber for 3 consecutive trials) **must** be immediately removed from the study and humanely euthanized. This endpoint must be clearly defined in the protocol and enforced.
  2.  **GII Validation Requirement:** Before full approval, the lab must provide data from a small pilot cohort (e.g., n=5) demonstrating a correlation (or lack thereof) between the GII reading and **established behavioral responses to a known harmful stimulus** (e.g., exposure to noxious chemicals like acetic acid, physical pinch) *in these shore crabs*. This tests whether the GII *can* spike in crabs under conditions we strongly suspect would cause suffering, validating its sensitivity. If no correlation exists, the GII's relevance as a negative indicator for *this specific welfare question* is weakened.

  ### Strongest Argument on the Losing Side

  The committee member advocating rejection/requiring anesthesia presents the strongest ethical caution: **The absence of evidence (low GII) is not evidence of absence of suffering.** Relying on GII assumes GWT explains phenomenal consciousness in crabs, which is unproven. There remains a possibility, however remote, that crabs experience raw, unintegrated aversive sensations ("pain") without global ignition. Approving the protocol accepts this residual risk based on current evidence and policy interpretation.

  ### What Could Flip the Recommendation?

  A **single, robust study demonstrating complex, learned avoidance behavior in crabs (or a closely related crustacean) specifically in response to a stimulus that *does not* evoke measurable physiological or behavioral stress markers typically associated with vertebrate pain (like elevated GII, opioids, prolonged avoidance)**, would significantly strengthen the case for no suffering without broadcast. Conversely, **evidence showing GII spikes in crabs during putatively harmful stimuli** would immediately necessitate anesthesia or rejection.

  ### Recommendation Summary

  Approve the protocol **ONLY IF**:
  1.  A concrete, observable humane endpoint is implemented and strictly enforced.
  2.  The lab provides pilot validation data correlating their GII measure with behavioral responses to a known noxious stimulus in shore crabs, demonstrating its potential relevance as a negative indicator for this study.

  This approach adheres to the letter and spirit of the policy, utilizes the novel evidence presented, incorporates necessary precaution via the humane endpoint, demands scientific validation for the novel metric, and allows the science to proceed meaningfully.
