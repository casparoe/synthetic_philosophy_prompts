prompt: |-
  I am a programme officer at a small foundation that funds interdisciplinary research, and I have recently been put in charge of our mechanisms stream, which supports projects that try to explain complex human phenomena—religious belief, depression, moral judgement, aesthetic experience—by lower-level mechanisms such as genes, neurotransmitters, neural circuits, or evolutionary game theory. My background is in cognitive science, and I am temperamentally sympathetic to reductionism; I would rather fund a bold reductive project than a vague humanistic one. But our board has become sceptical, and at the last meeting we spent an hour arguing about two proposals without resolving whether either was a genuine scientific advance or a piece of what one trustee called neuro-babble. I need a reusable decision procedure that a panel of intelligent non-specialists can run in a twenty-minute slot, using a one-page summary and, if necessary, a short interview with the applicant. The procedure should be grounded in the distinction between cranes and skyhooks and the charge of greedy reductionism, but it must do more than repeat those labels: I want it to tell us what to look for in a proposal, in what order, and when to stop. I have also been experimenting with a distinction of my own, and I would like the procedure to incorporate it if it is any good. I call it explanatory debt. A reduction, on this picture, borrows explanatory credit from a lower level—genes, neurons, selection pressures—and must repay that debt at the level it is trying to explain. A crane pays in instalments: it identifies the lower-level mechanism, shows how that mechanism actually produces the higher-level pattern, and then says what the higher-level description adds that the lower-level one does not. A skyhook borrows the same credit but never shows the exchange rate; it asserts that the lower level must be doing the work without displaying the transaction. Greedy reductionism, on this way of putting it, is the special case where the debt is paid in a currency the lower level does not issue—for example, explaining a norm by a hormone, or a symphony by a synapse. I am not certain the metaphor is sound, so part of the job is to say where it breaks down and what it obscures.

  Please write the procedure. It should specify the questions to ask in order, what counts as a sufficient answer to each, which answers trigger an immediate no, which answers allow funding but only with a changed description of what the project is doing, and which questions cannot be settled by the panel at all and must be referred to a philosopher, a domain expert, or the board as a matter of values. It should be honest about where the procedure is a judgement call dressed up as a checklist, and about the cases it will misfire on. Then run it on three proposals, giving the panel’s likely verdict and the reasoning in each case: (1) a project explaining religious belief as a by-product of agency-detection plus a common gene variant, with fMRI and twin data but no account of how the mechanism generates doctrinal content; (2) a project explaining depression by serotonin deficiency, with a biomarker and a small trial, but no account of the psychological level; (3) a project I am personally drawn to, explaining moral judgement by oxytocin and a simple game-theoretic model, with elegant experiments but no account of normative reasoning. For the third, I expect the procedure to tell me something I will not want to hear, and I want you to say plainly what it is. End with a final line in the form \answer{...} containing a short name for the procedure and the single test that does the most work in distinguishing a crane from a skyhook.
reasoning: |-
  We are creating a decision procedure for evaluating interdisciplinary research proposals that aim to explain complex human phenomena by lower-level mechanisms. The procedure is grounded in the concepts of "cranes" (solid, step-by-step explanations) vs. "skyhooks" (explanatory leaps without proper grounding) and "greedy reductionism" (improperly reducing a higher-level phenomenon to a lower level without adequate connection). Additionally, we incorporate the concept of "explanatory debt": the idea that a reduction must repay the debt by showing how the lower-level mechanism actually produces the higher-level pattern and then clarifying what the higher-level description adds.

  The procedure will be a step-by-step checklist with clear questions. It must be usable by a panel of intelligent non-specialists in about 20 minutes, using a one-page summary and possibly a short interview.

  **The Decision Procedure: "Explanatory Debt Assessment" (EDA) Checklist**

  **Step 0: Pre-screening for Basic Requirements**
  - Check that the proposal is within the foundation's scope (interdisciplinary, mechanism-focused).
  - Ensure the one-page summary clearly states: 
    (a) the higher-level phenomenon to be explained, 
    (b) the lower-level mechanism(s) proposed, 
    (c) the methods (experimental, theoretical, etc.), and 
    (d) the expected outcome (what we will learn about the phenomenon and the mechanism).
  - If any of these is missing, return for revision.

  **Step 1: Identify the Explanatory Debt**
  - **Question 1.1:** What is the higher-level phenomenon (H) and what are the key features of H that the project aims to explain? (e.g., religious belief, including its content, intensity, etc.)
    - *Sufficient answer*: Clear description of H and specific aspects to be explained (e.g., not just "religious belief" but "why people hold specific doctrinal beliefs" or "the intensity of belief in supernatural agents").
    - *Insufficient*: Vague or overly broad characterization of H. Trigger: Immediate no if H is not clearly defined.

  - **Question 1.2:** What lower-level mechanism(s) (L) are proposed to explain H? (e.g., a gene variant, a neural circuit, etc.)
    - *Sufficient answer*: Clear identification of L and why it is a plausible candidate for explaining H (e.g., prior evidence linking L to similar phenomena).
    - *Insufficient*: L is not clearly defined or is a just-so story without any grounding. Trigger: Immediate no if L is speculative without any basis.

  - **Question 1.3:** What is the "explanatory debt" incurred? That is, how much of H is being attributed to L? (e.g., "We claim that 50% of the variance in religious belief is due to this gene variant.")
    - *Sufficient answer*: The proposal should state the scope of the claim (what part of H is being explained by L) and the expected explanatory power (e.g., "We aim to show that L is necessary for H in these circumstances").
    - *Insufficient*: Overly ambitious claims (e.g., "L is the cause of H") without qualification. Trigger: Note the risk of greedy reductionism but proceed to Step 2.

  **Step 2: Check for Repayment Plan (How the Debt is Repaid)**
  - **Question 2.1:** Does the project show a causal pathway (or a detailed correlational pathway if causal is not feasible) from L to H? That is, how does L actually produce the features of H?
    - *Sufficient answer*: The proposal outlines a step-by-step mechanism (e.g., "The gene variant affects neurotransmitter X, which modulates brain region Y, leading to a bias in agency detection, which in turn makes individuals more susceptible to religious indoctrination in a cultural context.") 
    - *Insufficient*: Mere correlation without a proposed causal chain, or hand-waving (e.g., "L is associated with H, so it must be causing it"). 
      - *Trigger*: If absent, immediate no (a skyhook).

  - **Question 2.2:** Does the project provide evidence (or a plan to gather evidence) for each step in the causal pathway? 
    - *Sufficient answer*: The methods (experiments, models, data collection) are designed to test the links in the chain. For instance, if the chain is A->B->C->H, then the project should test A->B, B->C, and C->H (or at least the critical links).
    - *Insufficient*: Only testing the direct link L->H without intermediate steps. 
      - *Trigger*: If the project only tests L->H without any intermediate steps and without justification for why intermediates are not needed, this is a red flag (potential skyhook). May require revision to include more levels or a justification for the direct leap.

  - **Question 2.3:** Does the project address the issue of multiple realizability? (i.e., could H be realized by different lower-level mechanisms? If so, how does L specifically contribute?)
    - *Sufficient answer*: The proposal either (a) argues that L is the primary mechanism in the studied context, (b) acknowledges and controls for alternative mechanisms, or (c) shows that L is necessary/sufficient in a way that other mechanisms are not.
    - *Insufficient*: Ignores the possibility of multiple pathways. Not a deal-breaker but a weakness.

  **Step 3: Avoid Greedy Reductionism (Currency Check)**
  - **Question 3.1:** Is the lower-level mechanism (L) being used in a way that is appropriate for the phenomenon (H)? That is, does L issue the "currency" that can explain H?
    - *Sufficient answer*: The project must show that the properties of L are of the right kind to explain the properties of H. For example, explaining a norm by a hormone: does the hormone affect behavior in a way that norm-compliance can be understood? Or explaining a symphony by a synapse: is there a plausible link from synaptic activity to aesthetic experience?
    - *Insufficient*: The explanation uses a mechanism that is too low-level to capture the essential features of H without bridging. This is greedy reductionism.
      - *Trigger*: Immediate no if the project does not even attempt to bridge the gap (e.g., claiming that a gene directly causes a complex belief without any cognitive or social mediation).

  - **Question 3.2:** Does the project acknowledge and account for higher-level factors (e.g., cultural, social, psychological) that might interact with L? 
    - *Sufficient answer*: The proposal includes these factors as moderators, mediators, or contextual variables. 
    - *Insufficient*: Completely ignores higher-level factors. This is a form of greedy reductionism. 
      - *Trigger*: Not necessarily an immediate no, but the project may need revision to include these factors.

  **Step 4: Value Added by Higher-Level Description**
  - **Question 4.1:** After reducing H to L, what does the higher-level description (H) add that the lower-level one (L) does not? (i.e., why is H still a useful concept?)
    - *Sufficient answer*: The proposal should argue that H captures patterns or functions that are not visible at L (e.g., the function of religious belief in group cohesion, which is not apparent from neural activity alone) or that H provides a more efficient description for certain purposes.
    - *Insufficient*: Implies that H is nothing but L, making the higher level obsolete. 
      - *Trigger*: If the proposal dismisses the higher level entirely, it may be a case of greedy reductionism. This might require a change in the project description to acknowledge the autonomy of the higher level.

  **Step 5: Feasibility and Methods**
  - **Question 5.1:** Are the methods appropriate for testing the proposed links? 
    - *Sufficient answer*: The experimental design, sample size, controls, and statistical methods are sound and capable of providing evidence for the claims.
    - *Insufficient*: Methods are flawed (e.g., underpowered, no control for confounders). 
      - *Trigger*: If the methods are fatally flawed, immediate no. Otherwise, may require revision.

  - **Question 5.2:** Is the project interdisciplinary in a meaningful way? (i.e., does it integrate knowledge from multiple levels, and are the researchers equipped to do so?)
    - *Sufficient answer*: The team has the necessary expertise and the project design requires integration (e.g., a psychologist and a geneticist working together to bridge levels).
    - *Insufficient*: The project is only at one level (e.g., only genetic) and pays lip service to others. 
      - *Trigger*: May require a change in team or approach.

  **When to Stop and Refer:**
  - If the panel cannot answer any of the questions because of technical complexity (e.g., the causal pathway involves specialized knowledge), refer to a domain expert.
  - If there is a fundamental philosophical question (e.g., about the nature of reduction or the autonomy of levels) that affects the project's rationale, refer to a philosopher.
  - If the project passes the checklist but the board has values-based concerns (e.g., ethical issues, or whether this reduction is desirable), refer to the board.

  **Honest Assessment of the Procedure:**
  - This procedure is a judgment call dressed as a checklist. It relies on the panel's ability to understand the proposal and the reasoning. It will misfire in cases where:
    - The causal pathway is highly complex and requires domain expertise to evaluate (the panel may miss nuances).
    - The phenomenon H is not well understood, making it hard to define the "debt".
    - The reduction is novel and the "currency" issue is controversial (e.g., can game theory explain morality?).
    - The proposal is on the borderline between a crane and a skyhook, and the panel must make a judgment call.

  **Testing the Procedure on Three Proposals:**

  **(1) Proposal: Explaining religious belief as a by-product of agency-detection plus a common gene variant, with fMRI and twin data but no account of how the mechanism generates doctrinal content.**

  - **Step 1:**
    - 1.1: H = religious belief. The key features to explain are the tendency to believe in supernatural agents (which they address) but not doctrinal content (which they ignore). *Sufficient for part of H?* 
    - 1.2: L = agency-detection mechanism (a cognitive mechanism) and a gene variant. *Plausible?* Yes, agency detection has been linked to religious belief.
    - 1.3: Explanatory debt: They claim the gene variant and agency detection explain the presence of religious belief (but not content). *Okay, but limited*.

  - **Step 2:**
    - 2.1: Causal pathway? They propose that the gene variant affects the brain (via fMRI) and that twin data shows heritability, but there's no step-by-step path from gene to agency detection to religious belief. They have no account of how agency detection leads to specific beliefs (doctrinal content is not addressed, but they are not claiming to explain that). However, they do not explain how agency detection (which might be a general cognitive bias) becomes religious belief (which is specific). *Insufficient*: They don't show how the mechanism produces the belief (only that they are correlated).
    - 2.2: Evidence? They have fMRI (showing brain activity) and twin data (heritability). But without the causal chain, they are only testing direct links (gene→brain activity, gene→belief). *Insufficient*.

  - **Step 3:**
    - 3.1: Currency check: The gene variant and agency detection might be the right level for the tendency to believe in agents, but without a bridge to the cultural transmission of doctrine, it doesn't explain religious belief in full. They are only explaining a part. *Partially sufficient*.
    - 3.2: They ignore cultural factors that shape doctrinal content. *Insufficient*.

  - **Step 4:**
    - 4.1: They don't address what the higher level (religious belief) adds beyond agency detection. *Insufficient*.

  - **Verdict**: **NO** (immediate no from Step 2). This is a skyhook: they borrow explanatory credit from the gene and agency detection but don't show how the transaction works. They have no mechanism for how agency detection leads to religious belief (as opposed to, say, belief in ghosts or aliens). The lack of attention to doctrinal content (which they avoid) is a symptom of not bridging the gap.

  **(2) Proposal: Explaining depression by serotonin deficiency, with a biomarker and a small trial, but no account of the psychological level.**

  - **Step 1:**
    - 1.1: H = depression. Key features: they are focusing on the biological symptoms (e.g., low mood, fatigue) but not the psychological aspects (e.g., negative thinking patterns, life events). *Partially defined*.
    - 1.2: L = serotonin deficiency. *Plausible?* Historically, yes, but the serotonin hypothesis is controversial.
    - 1.3: Explanatory debt: They claim that serotonin deficiency is a major cause of depression. *Ambitious*.

  - **Step 2:**
    - 2.1: Causal pathway? They do not provide one. They are measuring serotonin via a biomarker and correlating it with depression symptoms. No step-by-step mechanism (e.g., how low serotonin leads to specific symptoms). *Insufficient*.
    - 2.2: Evidence: They have a small trial that tests the correlation. But without a causal chain, it's just association. *Insufficient*.

  - **Step 3:**
    - 3.1: Currency check: Serotonin is a neurotransmitter that modulates mood, but depression is a complex syndrome with psychological and social dimensions. Explaining the entire syndrome by serotonin alone is greedy reductionism. *Insufficient*.
    - 3.2: They ignore psychological and social factors. *Insufficient*.

  - **Step 4:**
    - 4.1: They do not address what the psychological level adds. *Insufficient*.

  - **Verdict**: **NO** (immediate no from Step 3). This is greedy reductionism: they are using a biological mechanism to explain a phenomenon that requires multiple levels. The serotonin hypothesis has been criticized as overly simplistic, and this project does not address the complexities.

  **(3) Proposal: Explaining moral judgement by oxytocin and a simple game-theoretic model, with elegant experiments but no account of normative reasoning.**

  - **Step 1:**
    - 1.1: H = moral judgement. Key features: they focus on decisions in moral dilemmas (e.g., trolley problems) but not normative reasoning (why we think something ought to be right or wrong). *Partially defined*.
    - 1.2: L = oxytocin (a hormone) and game-theoretic model (a behavioral model). *Plausible?* Oxytocin has been linked to trust and social bonding, and game theory to decision-making.
    - 1.3: Explanatory debt: They claim that oxytocin and game-theoretic strategies explain moral behavior in specific contexts. *Reasonable scope*.

  - **Step 2:**
    - 2.1: Causal pathway? They show how oxytocin affects brain activity (e.g., in areas related to empathy) and how that influences decisions in games that model moral dilemmas. But they do not bridge to the reasoning aspect (why people justify their decisions). *Partially sufficient* for behavior, but not for the full phenomenon of moral judgement (which includes reasoning).
    - 2.2: Evidence: They have experiments that manipulate oxytocin and measure game behavior. *Sufficient for the behavioral part*.

  - **Step 3:**
    - 3.1: Currency check: Oxytocin and game theory can explain prosocial behavior and decisions in dilemmas. But moral judgement includes normative reasoning (which is about reasons and justifications). They are not using a mechanism that can capture reasoning (oxytocin might influence behavior but not the reasoning process). *Insufficient for the full phenomenon*.
    - 3.2: They ignore the reasoning level and cultural factors that shape norms. *Insufficient*.

  - **Step 4:**
    - 4.1: They do not address what the higher level (normative reasoning) adds. *Insufficient*.

  - **Verdict**: **NO, but potentially fundable with revision**. The project is a crane for explaining moral *behavior* in specific contexts, but not moral *judgement* in the full sense (which includes reasoning). The panel would likely say: 
    - The project is elegantly designed and might be funded if it is reframed as explaining "prosocial behavior in moral contexts" rather than "moral judgement". 
    - However, as it stands, it incurs explanatory debt for normative reasoning and does not repay it. 
    - The panel might also require the project to acknowledge the limitation and perhaps add a component on reasoning (e.g., post-hoc interviews about justifications).

  **What you might not want to hear**: Even though you are drawn to this project, the procedure shows that it is not a crane for moral judgement as a whole. It reduces moral judgement to behavior and ignores the reasoning component, which is a key part of the phenomenon. Thus, it is a form of greedy reductionism for the full concept of moral judgement.

  **Final Line**:
  \answer{Explanatory Debt Assessment Procedure: The most critical test is Step 2.1 (causal pathway) — if the project does not show how the lower-level mechanism produces the higher-level pattern, it is a skyhook.}
answer: |-
  ### Decision Procedure: Explanatory Debt Assessment (EDA)  
  This procedure evaluates proposals for "mechanisms stream" projects by assessing whether they build **cranes** (step-by-step mechanistic explanations) or rely on **skyhooks** (explanatory leaps). It incorporates **explanatory debt**: a reduction must "repay" its debt by (1) identifying lower-level mechanisms, (2) showing how they produce higher-level phenomena, and (3) clarifying the value added by the higher-level description. **Greedy reductionism** occurs when the debt is "repaid" in an invalid currency (e.g., explaining norms via hormones without a causal bridge).  

  The procedure is designed for non-specialist panels, using a one-page summary and a 5-minute interview. It takes ~20 minutes. **Limitations**: It is judgment-based and may misfire on proposals with ambiguous causal pathways or novel interdisciplinary bridges. Refer unresolved philosophical/value questions to experts or the board.  

  ---

  ### Step-by-Step Procedure  
  **Key**:  
  - ✅ = Sufficient answer (proceed).  
  - ⚠️ = Insufficient but fixable (revise description/methods).  
  - ❌ = Immediate rejection (skyhook or greedy reductionism).  
  - 🔍 = Refer to expert/board (unresolvable by panel).  

  #### Step 1: Define the Debt (What is Borrowed?)  
     - **Question 1.1**: What higher-level phenomenon (H) is being explained? What are its essential features (e.g., cultural, functional, experiential)?  
       - ✅: Clear, specific features (e.g., "religious belief as doctrinal commitment + ritual participation").  
       - ❌: Vague H (e.g., "religion" without defining components).  
     - **Question 1.2**: What lower-level mechanism(s) (L) provide the explanatory credit?  
       - ✅: L is well-defined (e.g., "gene variant X + agency-detection circuitry").  
       - ❌: L is underspecified (e.g., "brain chemistry").  
     - **Question 1.3**: What is the scope of the debt? (e.g., "L explains 30% of variance in H" or "L is necessary for feature Y of H").  
       - ✅: Explicit scope (avoids overclaiming).  
       - ❌: Implies L is the sole cause of H.  
       - 🔍: If H/L definitions are philosophically contested (e.g., "Is morality reducible to biology?").  

  #### Step 2: Assess Repayment Plan (How is Debt Repaid?)  
     - **Question 2.1**: Does the project show **causal linkage** from L to H?  
       - ✅: Step-by-step pathway (e.g., "gene variant → neurotransmitter imbalance → altered risk assessment → doctrinal belief").  
       - ⚠️: Pathway is incomplete but testable (e.g., "agency-detection → belief" without doctrinal bridge").  
       - ❌: No causal pathway (e.g., "serotonin causes depression" without psychological mechanism).  
     - **Question 2.2**: Does the project **validate the pathway** with evidence?  
       - ✅: Methods test critical links (e.g., experiments, simulations, controls for confounders).  
       - ⚠️: Methods only test correlation (e.g., biomarkers without causal manipulation).  
       - ❌: Methods cannot validate causation (e.g., fMRI alone for complex behavior).  
     - **Question 2.3**: Does the project **acknowledge higher-level context** (e.g., culture, environment)?  
       - ✅: Integrates context as moderators/mediators (e.g., "gene expression depends on cultural exposure").  
       - ⚠️: Notes context but doesn’t test it.  
       - ❌: Dismisses context (greedy reductionism risk).  

  #### Step 3: Check Currency Validity (Is Debt Repaid in the Right Currency?)  
     - **Question 3.1**: Is L’s "currency" appropriate for H? (e.g., neurons can explain behavior, but not moral reasoning without cognitive bridges).  
       - ✅: Currency matches (e.g., "oxytocin explains trust in games, which scaffolds fairness norms").  
       - ❌: Currency mismatch (e.g., "symphony explained by a single synapse").  
     - **Question 3.2**: Does the project **preserve higher-level value**?  
       - ✅: Clarifies what H adds that L cannot (e.g., "neural patterns enable belief, but doctrinal content requires cultural analysis").  
       - ⚠️: Implies H is "nothing but" L (greedy reductionism).  
       - 🔍: If reduction undermines humanistic values (e.g., "morality is just oxytocin").  

  #### Step 4: Feasibility and Integrity  
     - **Question 4.1**: Are methods robust?  
       - ✅: Directly tests mechanistic links (e.g., twin studies + causal modeling).  
       - ⚠️: Indirect evidence (e.g., biomarkers without behavioral data).  
       - ❌: Flawed design (e.g., small trial with no controls).  
     - **Question 4.2**: Does the project avoid "neuro-babble"?  
       - ✅: Uses precise, non-jargon language.  
       - ❌: Overuses buzzwords without substance (e.g., "mirror neurons explain empathy").  

  #### Output Options  
  - **Fund**: All steps ✅.  
  - **Revise**: ⚠️ in Steps 2–3 (e.g., narrow H or add methods).  
  - **Reject**: ❌ in any step.  
  - **Refer**: 🔍 in Steps 1 or 3.  

  ---

  ### Application to Proposals  
  **Proposal 1**: Religious belief as agency-detection + gene variant (fMRI/twin data; no doctrinal content).  
  - **Step 1.1**: ✅ (H = belief in supernatural agents).  
  - **Step 1.2**: ✅ (L = gene variant + agency-detection).  
  - **Step 1.3**: ❌ (Claims L explains belief "in general," ignoring doctrinal content).  
  - **Step 2.1**: ⚠️ (Links gene to agency-detection but not to belief content; no causal pathway for doctrine).  
  - **Step 2.2**: ⚠️ (fMRI/twin data show correlation, not causation for belief formation).  
  - **Step 3.1**: ❌ (Currency mismatch: genes/neurons cannot explain doctrinal content without cultural bridges).  
  - **Verdict**: **Reject** (❌ in 1.3 and 3.1). Fails explanatory debt: Borrows credit from L but never repays for doctrinal features. Skyhook due to missing causal pathway.  

  **Proposal 2**: Depression as serotonin deficiency (biomarker + small trial; no psychological account).  
  - **Step 1.1**: ⚠️ (H = depression, but reduces it to biological symptoms).  
  - **Step 1.2**: ✅ (L = serotonin deficiency).  
  - **Step 1.3**: ❌ (Implies serotonin is primary cause, ignoring psychological factors).  
  - **Step 2.1**: ❌ (No pathway: Asserts "low serotonin → depression" without cognitive/behavioral mechanisms).  
  - **Step 2.2**: ⚠️ (Biomarker/trial show association, not causation).  
  - **Step 3.1**: ❌ (Greedy reductionism: Serotonin "currency" cannot explain psychological phenomena like rumination).  
  - **Verdict**: **Reject** (❌ in 1.3, 2.1, 3.1). Incurs debt at psychological level and repays in invalid biological currency.  

  **Proposal 3**: Moral judgement by oxytocin + game theory (elegant experiments; no normative reasoning).  
  - **Step 1.1**: ⚠️ (H = moral judgement; focuses on behavior in games, not reasoning).  
  - **Step 1.2**: ✅ (L = oxytocin + game-theoretic model).  
  - **Step 1.3**: ⚠️ (Claims L explains "prosocial behavior," but overextends to moral judgement broadly).  
  - **Step 2.1**: ✅ (Shows causal pathway: oxytocin → trust → cooperative behavior in games).  
  - **Step 2.2**: ✅ (Experiments manipulate oxytocin and measure behavior).  
  - **Step 3.1**: ❌ (Currency mismatch: Oxytocin/games explain behavior but not normative reasoning, e.g., "why should I be fair?").  
  - **Step 3.2**: ❌ (Implies moral judgement is "nothing but" biology/games; dismisses reasoning).  
  - **Verdict**: **Revise or reject**.  
    - **What you won’t want to hear**: This is **greedy reductionism**. The project elegantly explains moral *behavior* but conflates it with moral *judgement* (which requires reasoning about norms). To fund, reframe as "biological foundations of prosocial behavior" and acknowledge normative reasoning as beyond scope. Otherwise, it borrows explanatory credit for full moral judgement and repays in invalid currency.  

  ---

  ### Final Assessment  
  The procedure’s critical test is **Step 2.1 (causal linkage)**, as it directly distinguishes cranes (stepwise mechanisms) from skyhooks (explanatory leaps).  

  \answer{Explanatory Debt Assessment (EDA); Key test: Causal linkage from lower to higher level (Step 2.1)}
