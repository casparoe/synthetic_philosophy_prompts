  The user needs a structured proposal for a fellowship. They want a clear, answerable question, not just exploration. They proposed using Hohfeldian legal frameworks to dissect rights into components like claims and powers. I should assess if that's the best method versus interviews or case studies. They also need practical scope for eight months part-time, deliverables, and failure conditions.

  Their unspoken needs might include validation of their framework. They might fear their approach is too theoretical. I should confirm that decomposing rights with Hohfeld is practical and addresses power imbalances. Also, they might need help translating academic concepts into actionable committee reforms without getting bogged down in theory.

  Considering their role as the sole renter on the committee, the proposal should emphasize real-world application. The method needs to be feasible: analyzing documents and a few cases, not extensive fieldwork. Highlighting tangible outputs like a rubric or recommendations can show immediate impact for housing justice orgs.

  Potential pitfalls: Hohfeldian analysis might be too abstract. But comparing it to interviews, it's more efficient for part-time research. Case studies could work but might lack systematic comparison. Sticking with their instinct allows focused, document-based work within the timeframe.

  Failure would be not resolving the tension or providing unclear guidance. Success is a framework that informs committee restructuring. Need to outline realistic outcomes: a typology of conflicts, testable criteria for rights bundles, practical implications for fairer participation.

  Also, ensure the proposal doesn't require IRB or primary data, keeping it within scope. Emphasize using existing cases and documents to avoid delays. Make sure the answer to the core question is binary (rights can be unified or not) to meet the determinate answer requirement.
answer: |-
  Here’s a focused fellowship proposal framework based on your insights, designed to deliver a concrete answer within 8 months part-time. It leverages your Hohfeldian approach while grounding it in practical committee dynamics.

  ---

  **Proposal Title:** **The Right to Stay vs. The Right to Decide: Decomposing the "Right to the City" in Neighborhood Governance**

  ### 1. Core Question (Determinate & Answerable)
  > *Can the "right to the city," as invoked in neighborhood land-use conflicts, coherently encompass both (a) the procedural right to participate in shaping the neighborhood (Decision-Right) and (b) the substantive right to access and remain in the neighborhood (Stay-Right) without one inherently undermining the other? If incoherent, which right must be prioritized to prevent the abuse of procedural power to exclude?*

  ### 2. The Gap in Existing Frameworks
  *   **NIMBYism Critique:** Focuses on *motivations* (self-interest, exclusion) but doesn't structurally analyze the *rights framework* enabling exclusionary participation. It diagnoses symptoms, not the legal/conceptual mechanics.
  *   **Standard "Right to the City" Scholarship:** Often treats participation and access as inherently complementary or aspirational goals. It rarely rigorously dissects the *operational conflict* when incumbent residents wield procedural power (Decision-Right) explicitly or implicitly to block access for others (violating Stay-Right). Your committee experience reveals this operational tension is the core battleground.
  *   **Your Committee's Reality:** Shows existing governance structures (like yours) often formally grant Decision-Right primarily to property owners/residents (incumbents), creating a structural incentive to prioritize their Stay-Right *at the expense* of the Stay-Right of potential or current non-owner residents (renters, newcomers). The *same* right is cited for opposing goals because its components are conflated and unchecked.

  ### 3. Proposed Method: Hohfeldian Decomposition & Case Pressure-Testing (Why This Trumps Interviews/Case Study)
  *   **Why Hohfeld?** It provides the precise analytical scalpel you need:
      *   **Decision-Right (Incumbents):** Primarily a **Power** (to vote, testify, influence outcomes) coupled with an **Immunity** (from being easily overruled by non-residents/city). May include a **Privilege** (to oppose change).
      *   **Stay-Right (Vulnerable Residents/Newcomers):** Primarily a **Claim** (against displacement, for access) often lacking correlative duties enforceable *against* incumbent residents wielding Power/Immunity. May involve a **Disability** (inability to alter exclusionary rules).
      *   **City's Role:** Holds **Powers** (zoning, approval) and potential **Liabilities** (to incumbent challenges) that shape the conflict.
  *   **Why Better Than Interviews/Case Study?**
      *   **Precision:** Interviews explore perceptions, not structural rights conflicts. A broad case study describes *what* happened; Hohfeld explains *why* it happened legally/conceptually.
      *   **Efficiency:** Analyzing 4-6 documented committee cases using Hohfeld is achievable part-time. Deep interviews or broad case studies require more time/ethics approval.
      *   **Answer Focus:** Directly tests coherence of the "bundle." Can map *exactly* how an incumbent's Power/Immunity extinguishes a newcomer's Claim.
      *   **Actionable Output:** Generates a framework for *redesigning* participation (e.g., rebalancing Powers/Immunities) based on rights conflicts, not just narratives.

  ### 4. Methodology & Scope (8 Months, Part-Time)
  *   **Phase 1: Framework Construction (2 Months)**
      *   Define Decision-Right and Stay-Right bundles using Hohfeldian incidents for key parties: Incumbent Owners, Incumbent Renters, Potential Residents (Newcomers), City.
      *   Hypothesize core points of conflict (e.g., Incumbent Power vs. Newcomer Claim).
  *   **Phase 2: Case Selection & Analysis (4 Months)**
      *   Select 4-6 documented cases from your committee (past 2-3 years) representing classic conflicts: e.g., ADU denial, rezoning for missing middle, significant rent hike building sale.
      *   Analyze each case through the Hohfeldian lens:
          1.  Identify parties involved and their asserted "right to the city."
          2.  Decompose asserted rights into specific Hohfeldian incidents.
          3.  Map the conflict: Which specific incidents clashed (e.g., Incumbent Immunity blocked City Power to enforce Newcomer Claim)?
          4.  Assess outcome: Did the structure prioritize Decision-Right or Stay-Right? Was exclusion achieved procedurally?
  *   **Phase 3: Synthesis & Answer (2 Months)**
      *   Across cases, identify consistent patterns: Does Decision-Right *inherently* enable the violation of Stay-Right for non-incumbents?
      *   Answer the core question: Is coherence possible? If not, which right must be primary?
      *   Derive implications for committee structure: What Hohfeldian rebalancing (e.g., strengthening certain Claims, limiting Immunities, redefining Powers) could mitigate conflict?

  ### 5. Deliverables & Results
  *   **Tangible Result:** A definitive answer to the core question, grounded in legal theory and empirical case analysis.
  *   **Key Findings Will Look Like:**
      *   "Analysis of 6 cases reveals the incumbent's Power/Immunity bundle (Decision-Right) consistently negates the newcomer/renter Claim (Stay-Right), demonstrating structural incoherence."
      *   "The Stay-Right must be prioritized as a foundational claim; Decision-Right structures must be redesigned to serve this primary right (e.g., by giving weight to impacted non-incumbents, limiting veto powers)."
      *   "Proposed Hohfeldian Reforms for Planning Committees: 1) Grant formal standing/power to tenant associations (shifting Privileges/Powers), 2) Establish displacement impact assessments creating correlative Duties, 3) Limit Immunities against certain density increases tied to affordability."
  *   **Fellowship Output:** A 3-page exec summary + 15-page report for the housing justice org, and a 1-page "Hohfeldian Lens for Fairer Committees" handout usable by tenant groups.

  ### 6. What Failure Looks Like (And Mitigation)
  *   **Failure:** Inability to reach a determinate answer; finding the rights *are* coherent in practice (contradicting your hypothesis/experience); analysis being too abstract to inform structural change.
  *   **Mitigation:**
      *   **Focus:** Strictly link Hohfeldian analysis to specific case outcomes and procedural mechanics observed in documents.
      *   **Grounding:** Constantly ask: "What *specific rule or action* in this case represents this Power/Claim? How did it directly cause the outcome?"
      *   **Scope:** Limit cases to 4-6 well-documented ones. Avoid getting lost in theory; use it only as a tool for decomposition.
      *   **Answer Commitment:** Pre-commit to defining "coherence" operationally (e.g., "Can both rights be fully realized for all parties in the same decision?"). The answer will likely be "no."

  ### 7. Why This Framing Works
  Your framing is **sharply relevant**, not confused. It moves beyond abstract philosophy and NIMBY/YIMHY slogans to dissect the *operational mechanics of exclusion within democratic procedures*. It directly addresses the core tension you witness: participation weaponized against access. The Hohfeldian method is uniquely suited to isolating this conflict in a way that points directly to actionable institutional reforms for bodies like your committee. It transforms a philosophical buzzword into a blueprint for fairer governance.

  **Next Step:** Draft the proposal using this structure. Emphasize the unique vantage point of your committee experience and the practical, reform-oriented output for housing justice. Your lived experience is the project's bedrock. Good luck!
