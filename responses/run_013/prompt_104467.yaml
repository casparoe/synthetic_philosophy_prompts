prompt: |-
  I have just started a postdoc in a long-run development group, and I have been asked to circulate my priors before the first workshop so that the others know what they are arguing against. Writing them out, I am no longer sure they form a single coherent position, so I would like you to audit them rather than defend or attack the whole thing. Here is where I have landed. (1) The fundamental cause of why some societies are rich and others poor is the quality of their institutions — broadly, whether political and economic institutions are inclusive or extractive, and whether they secure property rights for a wide population rather than a narrow elite. (2) Geography is not itself a fundamental cause; where it appears to matter it operates through the institutions that get transplanted, and through the disease and settlement environment that shapes which institutions take hold in the first place. (3) Culture is mostly downstream of institutions: the beliefs and norms that look like causes are largely adaptations to the incentives institutions set, and they tend to move when the incentives move. (4) That said, culture adjusts on a much slower clock than institutions do, so within any given generation it constrains which institutions can actually take root and function — imported rules that cut against deep norms get hollowed out in practice. (5) The counterfactual of what a given country would look like under different institutions is well-defined and often empirically tractable, thanks to natural experiments such as the settler-mortality instrument, discontinuities at colonial borders, and similar designs. (6) The large question — why is this nation rich? — is in the end not answerable; we can identify proximate mechanisms and local effects, but not a single total causal account of a nation's path.

  I keep suspecting that some of these pull against each other and that others only look as though they do, and I cannot tell which is which. What I want from you is a ranking, not a survey. Go through the commitments pairwise and tell me which pairs are genuinely in tension and how severe each tension is, which pairs merely appear to conflict and why the appearance dissolves on inspection, and, for each genuine tension, what the cheapest repair would be and what that repair costs me elsewhere in the set. Then, if there is a single revision that would clear up the most trouble at the least cost, name it and commit to it.

  Please be decisive about this. Do not hedge by telling me it depends on what I mean by "fundamental" — tell me what I would have to mean for the package to hold, and whether that is a meaning I can actually live with. And do not assume the tension is wherever I seem most anxious; I have deliberately not signalled which commitment I would surrender first. I would far rather you take a definite line and be wrong in an interesting way than lay out the options and leave the choice to me.
reasoning: |-
  Okay, the user is a postdoc in a long-run development group. They've been asked to circulate their priors before a workshop and are concerned that their six points might not form a coherent position. They want me to audit these commitments pairwise, identifying genuine tensions, apparent conflicts, and suggesting repairs. 

  First, I need to understand each of their six points clearly. Point 1 states that institutions are the fundamental cause of wealth differences. Point 2 dismisses geography as fundamental, saying it only matters through institutions. Point 3 sees culture as downstream of institutions, adapting to incentives. Point 4 adds that culture adjusts slowly and can constrain institutional adoption. Point 5 claims counterfactuals about institutions are well-defined and testable. Point 6 says the "why is this nation rich?" question isn't answerable with a single total account.

  Hmm, the user specifically wants a ranking of tensions, not a survey. They want decisiveness—no hedging on terms like "fundamental." They'd rather I take a definite line, even if wrong in an interesting way. This suggests they need clarity for workshop preparation, possibly to defend or refine their position among peers. Their deeper need might be to avoid appearing inconsistent in an academic setting where credibility is key.

  Starting pairwise: Points 1 and 4 clash severely. If institutions are fundamental (1), but culture constrains which institutions can function (4), then culture isn't just downstream—it's a prior condition. This threatens the primacy of institutions. The cheapest repair is to soften "fundamental" to "proximate and manipulable," but that costs the boldness of Point 1. 

  Points 1 and 5 also have moderate tension. Point 5 treats institutional changes as isolatable causes via natural experiments, but Point 1’s "fundamental" claim implies institutions are the root cause. If Point 1 is true, Point 5's counterfactuals might miss deeper drivers. Repairing this requires clarifying that "fundamental" means "most policy-relevant," not "sole root." 

  Points 3 and 4 appear to conflict but don’t. Point 3 says culture adapts to institutions (fast incentives), while Point 4 says culture constrains institutions (slow adjustment). This is actually coherent—culture is both adaptable and sticky. No repair needed; it’s a matter of time scales. 

  Points 2 and 6 have low tension. Geography operates through institutions (2), and we can’t give total causal accounts (6). These can coexist if we see institutions as a key mechanism but not the whole story. 

  The biggest threat is Point 4 undermining Point 1. The minimal revision is to redefine "fundamental" as "most direct policy lever," acknowledging culture as a boundary condition. This preserves most of their framework but costs theoretical purity. 

  The user’s anxiety might stem from Point 4’s challenge to institutional primacy, but they haven’t signaled surrender. I’ll recommend this revision decisively, as it resolves the severest tension without collapsing their stance. Academic audiences might still critique it, but it’s defensible.
answer: |-
  Here is a decisive pairwise audit of your priors, ranking tensions by severity and identifying repairs. I’ll flag irreconcilable conflicts, dissolve false tensions, and prescribe minimal revisions to maximize coherence. The core tension revolves around **institutional primacy vs. cultural constraint**, with Point 6 acting as a necessary escape hatch.

  ---

  ### **Ranked Tensions & Repairs**  
  **1. SEVERE TENSION: (1) vs. (4)**  
  - **Conflict**: (1) claims institutions are the *fundamental cause* of development. (4) states culture *constrains which institutions can function* (e.g., imported rules get "hollowed out"). If culture determines institutional viability, it cannot be purely "downstream" (per 3). This implies culture has causal priority in institutional selection.  
  - **Cheapest Repair**: Redefine "fundamental cause" in (1) as *proximate and policy-relevant*, while granting culture *preconditional* status.  
  - **Cost**: Softens (1)’s claim from "ultimate cause" to "most actionable lever." Weakens institutional determinism.  

  **2. MODERATE TENSION: (1) vs. (5)**  
  - **Conflict**: (1) posits institutions as the bedrock cause, but (5) treats institutional counterfactuals as isolatable via natural experiments. If institutions are truly fundamental, experiments like settler mortality should reveal *total* causal effects—yet (6) denies total causal accounts are possible. This risks overclaiming.  
  - **Cheapest Repair**: Clarify that (5) identifies *local average treatment effects* (LATE) of institutional changes, not fundamental causes.  
  - **Cost**: Demotes (5) from "well-defined counterfactuals" to "partial identification of mechanisms."  

  **3. APPARENT CONFLICT (DISSOLVES): (3) vs. (4)**  
  - **Why it seems conflicted**: (3) says culture is "downstream" of institutions; (4) says culture "constrains" institutions.  
  - **Dissolution**: This is a *temporal handoff*, not a contradiction. Culture adapts to institutions (3) but adjusts slowly, so it acts as a *lagged constraint* on future institutional change (4). Example: Norms adapt to inclusive institutions over decades but resist sudden impositions of extractive ones.  
  - **No repair needed**.  

  **4. MILD TENSION: (2) vs. (6)**  
  - **Conflict**: (2) dismisses geography as fundamental, routing it through institutions. (6) denies any "single total causal account" exists. But if geography only matters via institutions, institutions become the total account—contradicting (6).  
  - **Cheapest Repair**: Specify in (2) that geography *also* operates through *non-institutional* channels (e.g., trade costs, disease burdens) that interact with institutions.  
  - **Cost**: Weakens (2)’s exclusivity but aligns with (6)’s pluralism.  

  **5. NO TENSION: (3) vs. (5)**  
  - Culture’s slow adaptation (3) doesn’t conflict with institutional counterfactuals (5). Experiments capture *immediate* effects of institutional shocks; cultural inertia explains divergent *long-term* trajectories.  

  ---

  ### **The Minimal Winning Revision**  
  **Revise (1) to:**  
  *"Inclusive institutions are the most reliable *proximate cause* of sustained development, but their emergence and stability depend on preexisting cultural constraints (per 4) and geographic contingencies (per 2)."*  

  **Why this clears the most trouble:**  
  - **Resolves the (1)-(4) crisis** by downgrading institutions from "fundamental" to "proximate," acknowledging culture’s veto power.  
  - **Preserves (3)’s mechanism** (culture adapts to incentives) while honoring (4)’s realism (culture filters institutional imports).  
  - **Strengthens (6)** by making institutional primacy contingent, avoiding totalizing claims.  
  - **Costs**: You sacrifice theoretical purity for pragmatism. Critics may argue this dilutes institutionalism into "institutions matter, except when they don’t." But it buys coherence without collapsing your framework.  

  ---

  ### **What You Must Mean to Hold the Package**  
  - **"Fundamental cause" (1) ≠ "root cause" or "sufficient cause."** It means:  
    *The most consistent *policy-addressable* driver, conditional on cultural and geographic initial conditions.*  
  - **"Downstream" (3) ≠ "epiphenomenal."** It means:  
    *Culture is malleable to institutional incentives *over the long run*, but exhibits short-run rigidity that binds institutional choice.*  

  ---

  ### **Final Coherence Score**  
  With this revision, your priors form a **defensible, dynamic institutionalism**: Institutions are the engine, but culture is the terrain. Geography sets the road. We can test repairs to the engine (5), but not redesign the terrain or replay the journey (6). The tensions are now features, not bugs.  

  **Commit to the revision.** It’s the cheapest ticket to workshop credibility.
