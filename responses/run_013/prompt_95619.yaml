prompt: |-
  Ok, help. I'm teaching the last session of an ethics of care seminar next week and I've made Never Let Me Go the set text, on the grounds that Kathy calls herself a carer in the first line and the whole book reads like someone who'd absorbed Gilligan, Noddings, Tronto and Kittay and then built a world to stress-test them. What I need from you is a proper reading of the novel through that apparatus — not a plot summary, not a lecture on the theory, but the two of them in contact with each other.

  So: Noddings on the one-caring and the cared-for, engrossment and motivational displacement, and her claim that the caring relation is only completed once the cared-for receives the caring; her split between natural caring and ethical caring, which Hailsham seems to have engineered at scale. Tronto's four phases — caring about, taking care of, care-giving, care-receiving — and the four qualities that go with them (attentiveness, responsibility, competence, responsiveness), plus her insistence that care is a political rather than a merely domestic concept, and the fifth phase she adds later, caring with, which I think is about whether a public actually holds care as a shared value; correct me if I've got that wrong. Then Kittay on dependency work, and the thought that a society can shift its dependency onto a class of people it never counts as full members.

  Now the novel. There's alot of care in this book and it's finely drawn — Kathy, Ruth and Tommy look after each other, and thier care buys them nothing. The art, the gallery, the rumour that true love might earn a deferral, the visit to Madame: all of it is care given inside a system that has already decided what they're for, and the book's own word for a donor who's died is completed, which is either a gift to Noddings or a trap for her. So I want a verdict, argued properly: is the novel a reductio of care ethics, showing that a perfectly caring relationship can flourish inside an atrocity and leave it untouched, or is it a correction to it, in which case Tronto's care-receiving is where the theory has teeth and the donors are never once asked? Point me to the scenes I should put on the board, say where the novel resists the reading and the honest critic has to admit it, and finish with what the fiction shows about care that the theory can't say in its own voice.

  No references or reading lists please, I've got the syllabus. British English throughout — it's going to a UK seminar group and I'll be marked on it. And don't be diplomatic, I'd rather have the version that takes a side.
