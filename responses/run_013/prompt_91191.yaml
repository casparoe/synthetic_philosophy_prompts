answer: |-
  ## Dialogue: The Undefined Expectation Paradox

  **Setting:** A university library study room after a decision theory seminar. Two graduate students, **Alex** (leaning critical of EU limitations) and **Bailey** (defending EU's diagnosis), unpack their notes.

  **Alex:** Bailey, that shifted game example is really gnawing at me. Adding a dollar to *every single possible payoff*. Objectively, outcome-for-outcome, the shifted game dominates the original. Yet EU theory shrugs and says, "Both undefined, can't compare." That feels like a failure. Shouldn't a good theory capture such obvious dominance?

  **Bailey:** I see why it *feels* wrong, Alex. But I think EU theory is correctly diagnosing a genuine pathology in the prospect itself, not failing as a theory. The undefined expectation isn't a bug; it's a feature telling us this gamble lacks a stable, inherent "average value." The dominance is real *for each specific outcome sequence*, sure. But EU ranks prospects based on their overall expectation, and if that expectation doesn't exist – isn't a single number we can latch onto – then the theory *should* be silent. It's not equipped to rank undefined things.

  **Alex:** But that silence *is* the failure! We have a clear pre-theoretic judgment: shifting every payoff up uniformly makes the game strictly better. If EU can't encode that judgment via dominance when expectation is undefined, it lacks a tool we intuitively need. Consider a small entry fee. Most people would pay, say, 50 cents to play the *original* game, reasoning it "averages" about ln(2) ≈ 69 cents. They’d pay $1.50 for the *shifted* game for the same reason. EU can't justify either preference, let alone the higher fee for the shifted game.

  **Bailey:** Ah, but I think that intuition relies on smuggling in a *finite* picture. People imagine playing the game once or a few times, stopping after some large N tosses. That *truncated* game *does* have a well-defined expectation! For the truncated original, it's the partial sum of the alternating harmonic series up to N, which approaches ln(2). For the truncated shifted game, it's that sum plus $1. So yes, for *any finite cutoff*, the shifted truncated game is worth exactly $1 more. But the *actual* infinite game isn't the limit of these expectations in a way that gives a single value. The Riemann series theorem shows the infinite sum itself is fundamentally unstable.

  **Alex:** So you're saying my intuition is based on a mistake – confusing the infinite game with its finite approximations? But doesn't the law of large numbers (LLN) suggest that over many trials, the average payoff should settle near ln(2)? That *feels* like it gives the original game a definite value.

  **Bailey:** That's a crucial point! The LLN requires the expectation to exist *and* be finite. Here, it doesn't exist. Think about *how* you'd run repeated trials. Suppose you play the original game infinitely many times. To compute the long-run average payoff, you need to sum the payoffs from all infinitely many games and divide by the number of games. But the sum of payoffs *across games* is itself a massively rearranged version of the alternating harmonic series! Depending on the order you sum the payoffs (e.g., game 1's outcome, then game 2's, etc., or all the +payoffs first?), you could make the total sum diverge to +∞, -∞, or converge to any real number whatsoever. The long-run average simply doesn't converge to *anything*. The LLN fails spectacularly here. Your intuition might be applying the LLN where it fundamentally doesn't hold.

  **Alex:** Hmm, that LLN failure is jarring... I wasn't fully appreciating that consequence. But let's explore a variant. Suppose we impose a finite cutoff, N. We toss at most, say, 100 times. If no heads by then, payoff is zero. *Now* both games have well-defined expectations. Original ≈ ln(2) - tiny error, Shifted ≈ ln(2) + $1 - tiny error. The shifted game is clearly better by ~$1. As we let N get larger, the expectation of the truncated original approaches ln(2), the truncated shifted approaches ln(2)+1. Doesn't this suggest the infinite games *should* inherit this $1 dominance relationship?

  **Bailey:** It suggests why the *intuition* is so strong! But mathematically, the limit of the expectations of the truncated games *is* ln(2) for the original and ln(2)+1 for the shifted. However, that doesn't change the fact that the expectation of the *actual* infinite game *is undefined*. The limit of the expectations isn't the same as the expectation of the limit gamble. The truncated games are well-behaved approximations, but the limiting object itself is pathological. We can use the truncated expectations as a *tie-breaker* or a *pragmatic rule* for prospects with undefined EU, but that's supplementing EU theory, not showing EU theory was wrong to be silent. EU theory correctly says the infinite gamble itself lacks an expectation.

  **Alex:** Okay, another variant: what if we make the payoffs nonnegative? Suppose on toss n, if heads first appears, payoff is always |(-1)^{n-1} * 2^n / n| = 2^n / n. Now the series is 2/1 + 4/2 + 8/3 + 16/4 + ... = 2 + 2 + 8/3 + 4 + ... which diverges to infinity! EU theory *can* handle this: it assigns infinite expected utility. It’s well-defined (as infinite), even if impractical. This highlights the specific problem is the *conditional convergence*, not just infinity. The shift preserves the conditional convergence, so both remain undefined. But doesn't the nonnegative version show EU *can* deal with some infinite expectations? Its silence in the alternating case is specific to the undefinedness.

  **Bailey:** Exactly! That's a great contrast. EU theory distinguishes between finite expectations, infinite expectations (positive or negative), and *undefined* expectations. The nonnegative variant has a well-defined (infinite) expectation. The alternating harmonic payoff has an undefined expectation. The shift preserves that undefinedness. The theory is being precise. It's telling us something important: the structure of this gamble is such that its "average value" is fundamentally unstable and context-dependent (like the order of summation).

  **Alex:** I see the precision, Bailey. But I still think the silence in the face of obvious dominance is a cost. Perhaps EU needs a supplementary dominance principle: "If prospect A weakly dominates prospect B (A ≥ B in all states, A > B in some state with positive probability), and EU(A) and EU(B) are both undefined, then A is preferable to B." That would capture the shifted game without altering EU for defined expectations.

  **Bailey:** That's a coherent proposal, Alex. It's essentially adding a lexicographical rule: first, try EU ranking; if EU is undefined for both but one dominates the other, use dominance. It resolves *this* case. But is it always safe? Consider two *different* gambles, both with undefined expectations and no dominance relationship. Your principle wouldn't apply, and EU would still be silent, which might be correct. The cost is adding complexity. And we must ask: in cases where dominance holds but expectation is undefined, *why* do we feel dominance should decide? Is it a fundamental axiom, or is it, again, driven by the intuition from truncation? Even with dominance, we *still* couldn't say if the original game is worth paying ln(2) for, because its "value" is undefined. We could only say the shifted game is better than the original, but not better than what.

  **Alex:** A fair challenge. Maybe the dominance principle only gives a partial ordering where EU is silent. It wouldn't tell us the game's "value," just that one is better than the other. For "worth playing," we might need something else, like a safety-first rule or a focus on median outcomes, or indeed, reliance on the truncated expectation as a proxy. I concede the LLN point makes "long-run value" incoherent for the infinite game itself. My core point remains: a theory that cannot say the uniformly shifted game is better seems incomplete for practical rationality.

  **Bailey:** And my core point is that the incompleteness reflects a real feature of the world – some gambles *are* this pathological and lack a stable expected value. EU theory accurately flags that. Adding a dominance tie-breaker is a practical response to a specific anomaly, but it doesn't show EU was *wrong*; it shows we might need additional rules for edge cases it correctly identifies as pathological. The intuition of "better" comes from dominance at the outcome level, which is real, but the expectation's undefinedness means we can't aggregate those outcomes into a single reliable number for comparison via summation.

  **Alex:** So, to summarize where we land? We agree: 1) The original and shifted infinite games have undefined expectations due to the conditional convergence of the payoff series. 2) This undefinedness is correctly diagnosed by EU theory. 3) The LLN fails for these games; there is no stable long-run average. 4) For any finite truncation, expectations are well-defined, and the shifted game is worth exactly $1 more, explaining the strong intuition. 5) Making payoffs nonnegative changes the expectation to infinite (well-defined).

  **Bailey:** Yes, that's solid common ground.

  **Alex:** Where we disagree: 1) Whether EU theory's silence in the face of dominance for undefined prospects is a *defect* requiring supplementation (me) or a *correct* diagnosis where silence is the appropriate response (you). 2) Whether the strength of the dominance intuition (especially in the shift case) justifies adding a lexicographical dominance principle *specifically for when EU is undefined* (me), or if that's an unnecessary complication best handled by recognizing the pathology and using truncations pragmatically (you). 3) Whether the "worth playing for a small fee" intuition can be salvaged for the *infinite* game itself without relying on the (mathematically distinct) truncated version (I'm now skeptical; you think it's definitively mistaken).

  **Bailey:** Precisely. I think we've mapped the territory. Coffee? I need to process that LLN failure again.

  **Alex:** (Smiling wryly) Definitely coffee. Maybe toss a coin to see who pays? Just... not *that* coin game.

  **Bailey:** (Laughs) Agreed. Finite stakes only.
