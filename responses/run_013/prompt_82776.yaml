prompt: |-
  I direct the ethics desk for a Buddhist-founded humanitarian organization that runs clinics and mobile relief teams in a conflict-affected region. Our field staff are serious practitioners with no formal training in Buddhist doctrine or in moral philosophy, and they write to me — about fifteen times a month — when a situation has them stuck. The questions are nearly always the same shape: something the precepts appear to rule out (lying, taking what has not been given, occasionally worse) looks like the only way to prevent a serious harm, and the person wants to know whether they may do it, and if so how to do it without becoming someone they do not want to be. I have about twenty-four hours per case, I am the one who signs off, and the decision goes into a written record that our board reviews afterwards.

  I would like a decision procedure my volunteers can actually run: a short ordered list of questions, what counts as a sufficient answer to each, where the procedure terminates in a no, and where it stops and hands the decision back to a person because the question is one of value rather than of fact. It has to be usable by someone who knows the five precepts and has heard of karma but has never read a sutra, and short enough to work through in a jeep. Do not send me a reading list; our volunteers will not read it and I cannot check it. Tell me what to do.

  Ground it in what Buddhist ethics actually holds rather than in a Western consequentialism wearing robes, and be explicit about where the two come apart. Four things I want the procedure to take seriously, because they are where our informal reasoning keeps failing:

  - Intention. As I understand it, the tradition locates the weight of an act primarily in the intention (cetanā) rather than in the outcome, which means that "it turned out well" and "I meant well" are each only part of the story, and that a harmful act done for good consequences still carries its weight. I want a step that interrogates the intention and that has something to say when the honest answer is "partly vanity" or "partly I wanted to be the one who saved her."
  - Skillful means. Our volunteers have all learned that a precept can be departed from when compassion requires it — which is exactly the reasoning that every self-deceiving person uses. I want a test that separates a genuine exception from a rationalization, and if that test cannot be made into a step, I want the procedure to say so rather than fake one.
  - The non-aggregability of karma. Buddhist ethics does not seem to me to license trading one person's suffering against another's, and I suspect some of our hardest cases look tractable only because we have quietly started doing utilitarian arithmetic. If that is right, I want the procedure to name the step where the arithmetic would enter and to say what replaces it.
  - No-self and the question of who pays. If there is no self that owns the act, it is not obvious to me why the volunteer's own integrity should weigh in the decision at all — yet the precepts are addressed to the person about to act, and our volunteers care intensely about exactly that. I do not know whether this is a real tension or a confusion on my part. Either resolve it or tell me it is confused.

  I have been teaching our volunteers a four-part breakdown of a complete act that I assembled from things I have read — the object or being involved, the intention, the effort or deed, and the completion of the act — and I would like the procedure built around it if that is a defensible use of it. If I have mangled the analysis, or am using it for a purpose it was never meant to serve, say so and build the procedure on something better.

  Then run the procedure on three cases and show your work: (a) paying an unofficial fee at a checkpoint to move a medical convoy that will otherwise be turned back, with a patient aboard who will probably die; (b) a family's request that our volunteer nurse not tell a patient his diagnosis, at the moment the patient asks the nurse directly; (c) sheltering a man who is being hunted, and lying to the armed men who come looking for him, when the lie may put the whole team at risk. One of the three should come out as a no, and I expect at least one answer to be one I will not enjoy taking back to the field.

  Be blunt about the limits. If a decision procedure is simply the wrong instrument here — if the tradition's real answer is that such cases belong with a teacher, or that a rule-following procedure is already a misdescription of how a trained person decides — tell me that instead of manufacturing one, and tell me what I should be doing with my fifteen cases a month. Throughout, mark clearly which steps are Buddhist doctrine, which are my own managerial inventions dressed up as doctrine, and which are contested among Buddhists. I would rather have a procedure with three honest holes in it than a tidy one that hides them.
reasoning: |-
  Hmm, this user runs the ethics desk for a Buddhist humanitarian organization in conflict zones. They need a practical decision procedure for field staff facing moral dilemmas—like lying or bribing to save lives—grounded in authentic Buddhist ethics. The user has deep concerns: intention versus outcome, skillful means versus rationalization, non-aggregation of karma, and the paradox of no-self conflicting with personal integrity. They want no Western utilitarianism disguised as Buddhism.  

  The user’s frustration is palpable: volunteers misuse "compassion" to justify rule-breaking, and informal reasoning fails at predictable points. They’ve tried a four-part act analysis (object, intention, effort, completion) but worry it’s flawed. The demand is brutal—no reading lists, no theoretical fluff, just a field-ready tool usable in a jeep within 24 hours.  

  Key tensions to honor:  
  - **Intention (cetanā)**: Must dissect mixed motives (e.g., "partly vanity").  
  - **Skillful means (upāya)**: Can’t let "compassion" be a loophole; needs a reality check.  
  - **Karma non-aggregation**: No utilitarian math—each act’s karma stands alone.  
  - **No-self (anattā)**: Why care about personal integrity if there’s no "self" to protect?  

  The procedure must flag when a value judgment (not facts) requires human deliberation. And crucially, it must confess where Buddhism has no tidy answer—no hiding behind faux certainty.  

  For the cases:  
  - **Bribe at checkpoint**: Classic "lesser evil" trap. Buddhism likely forbids stealing (taking/offering bribes), but how to weigh dying patient?  
  - **Withholding diagnosis**: Truth-telling vs. family wishes. Does compassion override honesty?  
  - **Sheltering hunted man**: Lying that risks team safety. Does saving one justify endangering many?  

  I’ll anchor the steps in the user’s four-part act framework *if defensible*. If not, shift to the Buddha’s criteria for evaluating actions (AN 5.148): intention, object, outcome, and whether a wise person would approve. The four parts map decently: object → object, intention → intention, effort → deed, completion → outcome. It’s serviceable.  

  Non-negotiable Buddhist boundaries:  
  - No ends-justify-means (karma is intention-driven, not outcome-based).  
  - No karma calculus ("lesser evil" is still evil; each act seeds its own result).  
  - Skillful means *never* violates precepts for "greater good"; it’s about *how* you fulfill them, not whether.  

  Biggest hurdle: Skillful means isn’t a free pass. True upāya finds a precept-honoring solution. If none exists, the act is forbidden—Buddhism doesn’t bend precepts for results. This clashes hard with Western consequentialism.  

  For no-self vs. integrity: The precepts protect the *actor* from karmic harm, not an enduring "self." Caring about integrity isn’t selfish—it’s avoiding actions that corrupt the mind-stream. Resolved.  

  Now the procedure:  
  1. **Object clarity**: What exactly would I do? (Forces specificity, avoids vagueness.)  
  2. **Intention probe**: "Why *really*?" Surface mixed motives. If non-compassion dominates, stop—it’s a no.  
  3. **Precept check**: Does the act break a precept? If yes, proceed to Step 4. If no, it’s permitted—but rare in these dilemmas.  
  4. **Skillful means test**: Is there *any* way to achieve the aim without breaking the precept? If yes, do that. If no, proceed—but caution: this is where rationalization thrives.  
  5. **Karma non-aggregation**: Admit you can’t "trade" harms. The act’s karma is yours alone.  
  6. **Wise-person standard**: Would an enlightened being see this as the *only* compassionate option? If unsure, refer to ethics desk.  

  In Steps 4 and 6, the procedure intentionally "fails"—it forces a human judgment call. No pretending otherwise.  

  Case applications:  
  - **Bribe (taking what’s not given)**: Fails Step 4—alternatives exist (negotiate, wait, reroute). *No*.  
  - **Withhold diagnosis (lying)**: Passes Step 4? No—nurse could redirect patient to family for truth. *No*.  
  - **Shelter hunted man (lying)**: *Maybe*. If no alternatives (e.g., hide team first), and intention pure, Step 6 may allow it—but high bar.  

  The shelter case is the user’s "unpleasant answer." Volunteers will hate that bribes are forbidden even to save lives. But Buddhism is clear: corruption perpetuates systems that cause suffering. The karma of stealing stays with you.  

  Finally, confess limits: Some cases *require* a teacher. The procedure flags them but can’t replace wisdom. For 15/month, the ethics desk must stay—but this tool reduces rationalization and clarifies tradeoffs.
answer: |-
  Below is a field-deployable decision procedure grounded in core Buddhist ethics, designed for your context. It uses your four-part act analysis (object, intention, effort, completion) as a framework—**which is defensible** (aligned with the Buddha’s analysis of action in texts like AN 6.63). The procedure prioritizes **doctrinal fidelity** over managerial convenience and explicitly marks contested points. It terminates in **"No," "Proceed (with caution),"** or **"Refer to Ethics Desk"** when value judgments dominate.  

  **Buddhist Ethical Non-Negotiables:**  
  1. **Intention (cetanā) is primary**: Karma is determined by volition, not outcome.  
  2. **Precepts are training rules**: They protect against karmic harm; exceptions require *upāya* (skillful means) **not** violating the precept’s spirit.  
  3. **Karma is non-aggregable**: Suffering cannot be "traded" (no utilitarian arithmetic).  
  4. **No-self (anattā)**: Integrity matters because actions shape the mind-stream (karmic continuity), not because a "self" exists.  

  ---

  ### **Decision Procedure: The Four-Part Interrogation**  
  *Run in order. Answer honestly in <10 minutes. Terminate early if "No" or "Refer" is triggered.*  

  #### **Step 1: OBJECT (The Being or Thing Involved)**  
  **Question:** *"Who/what is directly affected by this act? Name them."*  
  - **Sufficient Answer:** Concrete identification (e.g., "the checkpoint guard," "the patient," "my team").  
  - **Buddhist Basis:** Right View (sammā diṭṭhi) requires clarity about sentient beings involved (SN 12.15).  
  - **Termination Conditions:**  
    - If you cannot name specific beings without abstract "greater good" calculus → **Refer to Ethics Desk** (violates non-aggregability).  
    - If the act inherently harms a sentient being (e.g., killing, stealing) → Proceed to **Step 2**.  

  #### **Step 2: INTENTION (Cetanā)**  
  **Question:** *"Why am I *truly* acting? Is compassion (karuṇā) the *dominant*, unforced motive?"*  
  - **Sufficient Answer:** Self-scrutiny for mixed motives. "Compassion" must outweigh vanity, fear, or desire for control.  
  - **Buddhist Basis:** Cetanā determines karmic weight (MN 57). Compassion must be genuine, not strategic.  
  - **Termination Conditions:**  
    - If self-interest/vanity/fear is dominant → **No** (act corrupts the mind).  
    - If compassion is dominant but mixed → Proceed to **Step 3**.  
    - If unsure → **Refer to Ethics Desk**.  

  #### **Step 3: EFFORT (The Deed Itself)**  
  **Question:** *"Does this act break a precept? If yes, is there *any* skillful way (upāya) to achieve the aim *without* breaking it?"*  
  - **Sufficient Answer:**  
    - If no precept broken → **Proceed** (rare in your cases).  
    - If precept broken *and* no alternative exists → Proceed to **Step 4**.  
    - If precept broken but alternatives exist → **No** (upāya requires exhausting skillful options first).  
  - **Buddhist Basis:** Precepts are breached only when intention, object, and effort align (e.g., lying requires intent to deceive + false speech + recipient). Skillful means **never** justifies precept violation; it finds a karmically safe path (MN 58).  
  - **Critical Check:** "Alternative" means *any* action that avoids breaking the precept, even if less efficient.  

  #### **Step 4: COMPLETION (The Outcome & Karmic Integrity)**  
  **Question:** *"Can I accept full karmic responsibility for this act, knowing it will ripple through my mind-stream, *regardless* of outcome?"*  
  - **Sufficient Answer:**  
    - If yes, and Steps 1-3 are passed → **Proceed (with caution)**.  
    - If no, or if outcome-dependence lingers ("I must do this because it will save X") → **No**.  
  - **Buddhist Basis:** Karma is non-transactional; you bear the seed of the act (AN 6.63). Anattā clarifies: you are responsible *because* there is no "self" to absolve—the act shapes future conditions (SN 22.59).  
  - **Termination Condition:**  
    - If the act risks harm you cannot reconcile (e.g., endangering others without consent) → **No**.  

  ---

  ### **Where This Comes Apart from Consequentialism**  
  - **No "lesser evil" justification**: Breaking a precept "for good results" is still karmically harmful. Skillful means avoids the act altogether.  
  - **Intentions > outcomes**: A failed but compassionate act has better karma than a "successful" act with impure intent.  
  - **No aggregation**: Saving ten lives does not "cancel" stealing (e.g., bribing); each act has distinct karmic weight.  
  - **No-self ≠ no responsibility**: Integrity matters precisely *because* actions condition future suffering—yours and others’.  

  ---

  ### **Limits & Confessions**  
  1. **Skillful means cannot be fully proceduralized**: Step 3 flags rationalization by demanding alternatives, but discerning "no alternative" is subjective. Buddhism holds this requires wisdom (paññā), which comes from training—not a checklist.  
  2. **The "Refer" steps are managerial**: Buddhism would direct these to a teacher (kalyanamitta). Your "Ethics Desk" is a pragmatic substitute.  
  3. **Contested among Buddhists**:  
     - Some Mahayana schools permit precept violations for compassion (e.g., Bodhisattva vows), but Theravada (likely your foundation) rejects this.  
     - Non-aggregability is orthodox, but modern Engaged Buddhists sometimes quietly adopt utilitarianism. This procedure rejects that.  
  4. **Hole #1**: Pure intentions can still cause harm. Buddhism accepts this (e.g., MN 21), but volunteers may struggle with guilt.  
  5. **Hole #2**: When "no alternative" exists, proceeding may *feel* like consequentialism—but karmic risk remains. The procedure doesn’t sugarcoat this.  

  **If 15 cases/month overwhelm the desk**: Train senior field staff in this procedure as "ethics facilitators," but retain final sign-off. Buddhism insists such dilemmas require dialogue with the wise.  

  ---

  ### **Case Applications**  

  #### **Case (a): Paying an unofficial fee to move a medical convoy**  
  - **Step 1 (Object):** Guard (receives bribe), patient (dies if delayed), team (complicit in theft). **→ Proceed.**  
  - **Step 2 (Intention):** "To save the patient" is primary. But is there pride ("I must be the hero")? If yes, mixed → **No**. If pure, **→ Proceed.**  
  - **Step 3 (Effort):** Act = stealing (taking/offering what isn’t freely given). *Alternatives?* Negotiate, escalate to authorities, reroute, wait. If *none* feasible (e.g., reroute impossible, patient dies in 1 hour), **→ Proceed to Step 4.** If alternatives exist → **No.**  
  - **Step 4 (Completion):** Can you accept karmic responsibility for stealing, even if patient lives? If yes → **Proceed.** If no → **No.**  
    - **Verdict:** Likely **No**. Bribes sustain corrupt systems (harmful completion). Volunteers often miss alternatives like rerouting.  

  #### **Case (b): Not telling a patient their diagnosis**  
  - **Step 1 (Object):** Patient (denied truth), family (wishes respected), nurse (lies). **→ Proceed.**  
  - **Step 2 (Intention):** "To spare suffering" may be compassionate, but if tainted by fear of conflict → **No.** If pure → **Proceed.**  
  - **Step 3 (Effort):** Act = lying. *Alternatives?* Tell truth gently; redirect patient to family; offer to mediate family discussion. If alternatives exist → **No.** If *none* (e.g., family threatens violence if nurse tells) → **Proceed to Step 4.**  
  - **Step 4 (Completion):** Can you bear the karma of lying? If yes → **Proceed.** If no → **No.**  
    - **Verdict:** Likely **No.** Truthfulness (sacca) is core to Right Speech. Alternatives almost always exist.  

  #### **Case (c): Sheltering a hunted man and lying to armed pursuers**  
  - **Step 1 (Object):** Hunted man (saved), armed men (deceived), team (at risk). **→ Proceed.**  
  - **Step 2 (Intention):** "To protect life" must dominate. If ego ("I’m a hero") or fear ("I can’t say no") intrudes → **No.** If pure → **Proceed.**  
  - **Step 3 (Effort):** Act = lying + possibly endangering others. *Alternatives?* Evacuate team first; hide man offsite; negotiate with pursuers. If *none* feasible (e.g., pursuers at door, man will die) → **Proceed to Step 4.**  
  - **Step 4 (Completion):** Can you accept karma for lying *and* risking others without consent? If yes → **Proceed.** If no → **No.**  
    - **Verdict:** **Proceed (with caution)** *only* if:  
      - Intent is pure,  
      - No alternatives exist,  
      - Team consents to risk,  
      - You accept full karmic burden.  
    - **Brutal Truth:** If the team is endangered without consent, **No.** Buddhism forbids imposing karmic risk on others "for their own good."  

  ---

  ### **Conclusion**  
  This procedure **won’t make decisions easy**—it surfaces why they’re hard. It returns "No" in cases where volunteers hope for "Yes" (e.g., bribes, most lies) because Buddhist ethics prioritizes *purifying intention* and *upholding precepts* over outcomes. For your 15 cases/month:  
  - Use this to filter clear "No"s and "Proceed"s.  
  - "Refer" cases where Steps 1 or 2 are murky (common when ego masks as compassion).  
  - **Blunt Limit:** No procedure replaces a teacher. If your volunteers lack access to one, your desk *is* the karmic backstop. Own that role unflinchingly.  

  > "Do not pursue the past. Do not lose yourself in the future. The past no longer is. The future has not yet come. Looking deeply at life as it is in the very here and now, the practitioner dwells in stability and freedom." — Buddha (MN 131)  
  > Your volunteers’ stability comes from unshakable integrity, not convenient outcomes. This procedure enforces that.
