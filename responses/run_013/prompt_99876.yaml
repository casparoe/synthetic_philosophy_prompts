answer: |-
  This selective demand for explanation in automated decisions reveals deep tensions in our concepts of understanding, responsibility, and trust. Let's dissect its presuppositions, internal consistency, and implications for alternative frameworks:

  ### What the Practice Strictly Requires vs. What It Fits With
  1.  **Strict Requirements:**
      *   **Formal Human Oversight:** A human agent must be positioned to review and potentially override the decision *before* it takes effect (certification/veto power).
      *   **Explanation Interface:** The system must generate *some* form of justification (e.g., key factors, counterfactuals) that the human reviewer *can* access and consider, even if it doesn't reveal the model's internal logic.
      *   **Accountability Assignment:** The human reviewer (or the organization deploying the system) becomes the legally/morally responsible agent for the final decision.

  2.  **What It Fits Well With (But Doesn't Strictly Require):**
      *   **Human-Like Reasoning:** The ideal of understanding *as* retracing the decision via humanly comprehensible steps (causality, simple rules).
      *   **Full Moral Agency:** The reviewer possessing deep, independent comprehension to truly "know what they are doing and could have done otherwise."
      *   **Perfect Auditability:** The ability to fully reconstruct the decision path for external validation.

  ### Presuppositions About Understanding & Responsibility
  The practice implicitly relies on a *hybrid* of these, but prioritizes the last:
  1.  **Understanding as Followable Route (Ideal, not Required):** Regulators *aspire* to this (it fits well with legal traditions of reasoned decisions), but the practice acknowledges it's often impossible with complex models. The "explanation" provided is usually a *proxy* (e.g., SHAP values, LIME) rather than a true retracing.
  2.  **Responsibility Requires Knowing & Ability to Do Otherwise (Core Link):** This is the *strongest* presupposition. Assigning responsibility *requires* an accountable human agent. The "human in the loop" is the designated agent who *could* have vetoed the output, thus fulfilling the "could have done otherwise" condition. Their *understanding*, however, is secondary to their *authority to act differently*.
  3.  **Certify/Veto as Sufficient for Responsibility (Actual Requirement):** **This is the core presupposition.** The practice fundamentally assumes that positioning a human with the *formal power* to certify or veto the output, *combined with access to *some* explanation* (however incomplete), is sufficient to establish responsibility and legitimize the decision. The human acts as a "moral circuit breaker."

  ### Can the Practice Survive the Reality of Limited Human Understanding?
  **Yes, in its current form, but it creates significant friction and potential failure modes:**
  *   **Rubber-Stamping:** Humans often defer to the algorithm, especially when the explanation is complex or the task is difficult. Their veto power is theoretical, not exercised meaningfully.
  *   **Illusory Understanding:** Explanations (e.g., feature importance) can be misleading or non-causal, giving reviewers a false sense of comprehension ("automation bias").
  *   **Responsibility Dilution:** Does the reviewer *truly* bear responsibility if their understanding is superficial? Legally, perhaps; morally, less so. This creates an accountability gap.
  *   **It survives because:** The primary function isn't *deep comprehension* by the reviewer, but establishing a *procedural checkpoint* for assigning legal liability and providing a minimal sense of recourse ("a human saw it"). It satisfies the *form* of human oversight demanded by democratic and legal norms, even if the *substance* is lacking.

  ### Consistency of Presuppositions
  The presuppositions are **internally inconsistent** when held to ideal standards:
  *   It *aspires* to understanding as a humanly followable route (Presup 1) but *accepts* systems where this is impossible.
  *   It *requires* responsibility based on an agent who could have done otherwise (Presup 2), but stations agents who often lack the *independent capability* to make the decision unaided, undermining the genuineness of their choice.
  *   It *relies* on the certify/veto mechanism (Presup 3) as the practical solution, accepting that the understanding supporting that veto may be flawed or second-hand.

  The practice is a **pragmatic compromise**, prioritizing the *assignment of responsibility* (via Presup 2 & 3) over achieving genuine, deep *understanding* (Presup 1) when dealing with inherently opaque systems.

  ### Dropping Comprehension: The Auditable/Veto Alternative
  If we dropped the explanation requirement and only demanded **auditability** (external inspection of inputs, outputs, model behavior, performance metrics, bias tests) + **human veto power**, several things would change:

  1.  **Shift in Responsibility Basis:** Responsibility rests *solely* on the human's veto power and the system's *proven performance* via audit trails. Understanding the *specific decision* is no longer required.
  2.  **Reduced Burden on Reviewer:** The reviewer focuses on checking if the decision *falls within acceptable parameters* defined by audits (e.g., "Is this applicant within the risk band the validated model handles well?"), not on *why* the model decided.
  3.  **Increased Reliance on System Validation:** Trust shifts decisively to rigorous, ongoing external/system-level auditing (fairness, accuracy, robustness, drift detection) rather than case-by-case comprehension.
  4.  **Different Type of Recourse:** Affected individuals would get evidence the system *works fairly overall* (audit results) and that a human *could* have stopped *this* decision, but not necessarily *why* this specific decision occurred.
  5.  **Potential Challenges:**
      *   **Legitimacy:** Would affected individuals accept decisions without any *reason* given, only proof the system is generally fair? ("Why *me*?" remains unanswered).
      *   **Meaningful Veto:** Without *some* context (e.g., key inputs flagged), how does the reviewer know *when* to veto? Veto becomes arbitrary or purely based on outcome desirability, not process.
      *   **Debugging & Improvement:** Lacking explanations for individual errors makes diagnosing model flaws or edge cases harder.
      *   **Moral Intuition:** It clashes with the deep-seated belief that consequential decisions *deserve* a reason.

  ### Conclusion
  The current "human in the loop + explanation" practice presupposes that **formal human authority to override a decision (veto power), combined with access to *some* justification, is the minimum sufficient condition for assigning responsibility for opaque automated decisions.** It pragmatically accepts the limits of human understanding while clinging to the ideal of human accountability. It survives despite limited reviewer comprehension because its core function is procedural accountability, not deep insight.

  Replacing comprehension with auditability + veto would fundamentally alter the basis of trust and responsibility. While potentially more robust for highly opaque systems, it risks being perceived as less legitimate and less responsive to the individual's need for a *reason*. The tension between the desire for comprehensible reasons and the reality of complex systems remains unresolved, forcing a choice between procedural accountability based on oversight/audit and the deeper, often unattainable, ideal of fully reasoned understanding.
