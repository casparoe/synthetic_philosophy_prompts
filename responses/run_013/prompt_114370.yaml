prompt: |-
  I'm opening a seminar on the ethics of killing in war next week and I want to start with the spec, not the fighting. So: what would any adequate theory of who soldiers may kill have to deliver? Give me the requirements, each with the case or consideration behind it -- the cases it has to get right (the conscript who never chose the war vs the volunteer, the soldier on the just side who shoots a surrendering enemy, the child soldier, the drone operator, the cop who shoots a hostage-taker), the distinctions it cant collapse (liability vs excuse, killing vs letting die, jus ad bellum vs jus in bello, and the one that bugs me: what makes a soldier's killing different from murder in the first place), and the features of the practice it can't contradict (both sides are bound by the same rules, war crimes are possible, a soldier can be excused for doing whats forbidden). My co-organizer keeps saying the set of people you're allowed to kill can't depend on which side has the just cause -- tell me whether that's a genuine requirement or just a prejudice of one camp, and whether the theory can treat a combatant as liable only for the threats he personally poses. And flag any pair of requirements you think can't be jointly satisfied; I suspect the symmetric-rules one and the liability-tracks-responsibility one are in tension. Skip the scorecard of who's right, I'll do that in class.
reasoning: |-
  Okay, the user is preparing a seminar on the ethics of killing in war and wants to start with the theoretical requirements rather than specific arguments. They need a framework outlining what any adequate theory must account for. Let me break down their query systematically.

  First, they listed several key elements: cases the theory must handle (conscript vs. volunteer, child soldier, drone operator, etc.), distinctions it must maintain (liability vs. excuse, jus ad bellum vs. jus in bello), and features it can't contradict (symmetric rules, possibility of war crimes). They also specifically asked about their co-organizer's point on just cause not determining who can be killed and whether liability is tied to individual threats. Plus, they want potential tensions between requirements flagged.

  Hmm, the user's role seems academic—likely a philosophy or ethics professor—given the seminar context. Their explicit need is a structural outline for discussion, but deeper needs might include: ensuring foundational clarity before diving into debates, anticipating student confusion points (like the symmetry/asymmetry tension), and rigorously testing theories against edge cases. The "skip scorecard" request suggests they want neutral scaffolding, not pre-digested conclusions.

  For cases: The conscript/volunteer distinction probes moral responsibility. Child soldiers test voluntariness and excuse frameworks. Surrendering enemies challenge liability termination. Drone operators push on proximity and responsibility. Police vs. soldier comparison highlights the unique war context. Each case maps to different theoretical pressure points.

  For distinctions: Liability/excuse separation prevents conflating justification with mitigation—crucial for war crimes trials. Killing/letting die matters for causation debates. Jus ad bellum/bello distinction maintains war's two-layer ethics. The soldier/murder difference is foundational; I'll emphasize the collective authorization aspect.

  For structural features: Symmetry of rules is both practical (reciprocity) and normative (Hague Convention vibe). War crimes must remain conceptually possible. Excuse conditions preserve moral nuance. The co-organizer's symmetry point is indeed a core IHL principle; I'll note Walzer's orthodox position but acknowledge revisionist challenges. On liability: Theories can absolutely restrict it to personal threats—McMahan-style individualism exists, but faces collectivist pushback.

  Tensions: The symmetry vs. liability-responsibility clash is real. If liability tracks personal responsibility, just combatants shouldn't be targetable—but symmetry demands uniform rules. Also, excuse conditions might weaken deterrence if overused. I'll present these as live tensions without resolving them.

  Structure-wise, I'll group into Cases, Distinctions, Features for clarity. Highlight the co-organizer's point in Features and the key tension at the end. Avoid jargon where possible—e.g., "moral taint" might confuse undergrads. Use concrete examples like My Lai for "battlefield excuse."
answer: |-
  Here's a breakdown of the core requirements any adequate theory of permissible killing in war must address, structured as requested – including cases, distinctions, features, and tensions. This focuses on the conceptual "spec sheet":

  **I. Cases Any Theory Must Get Right (The Litmus Tests):**

  1.  **The Conscript vs. The Volunteer:**
      *   **Requirement:** Must explain why *both* are generally permissible targets, despite vastly different levels of personal culpability for the war.
      *   **Case:** Why can a just combatant kill an unjust conscript forced into service at gunpoint? Why isn't the volunteer more liable?
      *   **Tests:** The theory's basis for liability/threat status.

  2.  **The Just Combatant Who Shoots a Surrendering Enemy:**
      *   **Requirement:** Must clearly condemn this as impermissible, even if killing combatants *in the fight* was allowed.
      *   **Case:** A soldier on the clearly just side executes an enemy who has thrown down their weapon and raised their hands.
      *   **Tests:** Termination of liability/threat status; limits of permission; distinction from killing combatants *hors de combat*.

  3.  **The Child Soldier:**
      *   **Requirement:** Must navigate the tension between their status as combatants (threats) and their potential lack of moral agency, responsibility, or voluntariness.
      *   **Case:** A 14-year-old forcibly recruited, drugged, and armed by a warlord poses an imminent threat.
      *   **Tests:** Role of responsibility/culpability vs. mere dangerousness; possibility of excuse; implications for necessity/proportionality calculations.

  4.  **The Drone Operator:**
      *   **Requirement:** Must account for the permissibility (or impermissibility) of killing at a distance, detached from immediate physical risk, while potentially possessing more information and time for deliberation.
      *   **Case:** An operator thousands of miles away identifies and strikes a legitimate military target, collaterally harming civilians.
      *   **Tests:** Relevance of personal risk to the killer; role of intention and knowledge; application of discrimination/proportionality in asymmetric contexts.

  5.  **The Cop vs. The Soldier (Hostage-Taker):**
      *   **Requirement:** Must articulate the fundamental difference justifying lethal force by soldiers against enemy combatants who pose no *immediate, individualized* threat, whereas police can typically only use lethal force against an *imminent, individualized* threat.
      *   **Case:** Why can a soldier kill an enemy combatant eating lunch miles behind the lines (a legitimate target), while a police sniper can only shoot a hostage-taker *actively* threatening a victim (imminent threat)?
      *   **Tests:** The very foundation of what makes killing in war distinct from murder or police action.

  **II. Distinctions the Theory Cannot Collapse (Conceptual Firewalls):**

  1.  **Liability vs. Excuse:**
      *   **Requirement:** Must clearly separate whether an act of killing was *justified* (not wrong at all) from whether the killer, even if committing a wrong, is *not fully blameworthy* due to circumstances (duress, ignorance, diminished capacity).
      *   **Importance:** Critical for war crimes trials (e.g., "I was just following orders" is an *excuse*, not a *justification*). Explains the child soldier or conscript case – they may be *liable* to defensive harm (targetable) but potentially *excused* for their actions.

  2.  **Killing vs. Letting Die:**
      *   **Requirement:** Must acknowledge the potential moral difference between actively causing death and failing to prevent it, even if the outcome is identical. Cannot assume they are morally equivalent.
      *   **Importance:** Affects doctrines of non-combatant immunity, medical care for wounded enemies, siege warfare, and the duty to accept surrender.

  3.  **Jus ad Bellum (Justice of War) vs. Jus in Bello (Justice in War):**
      *   **Requirement:** Must maintain the conceptual separation between the overall justice of the *cause* for going to war and the justice of the *conduct* within the war.
      *   **Importance:** Underscores the possibility of fighting an unjust war justly, or a just war unjustly. Directly relates to symmetry.

  4.  **Soldier's Killing vs. Murder (The Foundational Difference):**
      *   **Requirement:** *Must* provide a coherent account of what distinguishes the lawful killing of an enemy combatant by a soldier (not murder) from unlawful killing (which *is* murder or manslaughter).
      *   **Importance:** This is the core question of military ethics. Common answers involve collective defense, state authorization, reciprocity, and the combatant's status (rather than individual guilt). The theory *must* deliver on this.

  **III. Features of the Practice It Cannot Contradict (Non-Negotiables):**

  1.  **Symmetry of Jus in Bello Rules:**
      *   **Requirement:** The fundamental rules governing permissible conduct *during* warfare (discrimination, proportionality, necessity) must apply equally to all parties, regardless of whether their cause is just or unjust (*jus ad bellum*).
      *   **Co-organizer's Point:** This *is* a genuine requirement of the Laws of Armed Conflict (LOAC) and the orthodox view (Walzer). It's based on practicality (reciprocity), preventing a descent into barbarity ("no holds barred" for the "unjust" side), and the difficulty of impartially adjudicating *jus ad bellum* in the fog of war. *However*, revisionist just war theorists (McMahan) *do* challenge this, arguing *jus ad bellum* status *should* affect liability. A theory must either defend symmetry rigorously *or* explain its rejection and grapple with the consequences.
  2.  **Possibility of War Crimes:**
      *   **Requirement:** Must allow for the concept that specific acts of killing (or other acts) within war can be morally and legally *criminal*, not just tragic or unfortunate.
      *   **Importance:** Undermines the "war is hell, anything goes" fallacy. Requires clear boundaries on the permission to kill.
  3.  **Excuse for Doing the Forbidden (Battlefield Excuse):**
      *   **Requirement:** Must allow for situations where a soldier commits a wrongful killing (a war crime) but is not fully culpable or blameworthy due to the extreme pressures of combat (fog of war, fear, duress, misinformation, diminished capacity).
      *   **Importance:** Acknowledges the morally distorting nature of warfare without absolving individuals of all responsibility. Distinguishes the terrified recruit shooting a surrendering enemy from the cold-blooded executioner.

  **IV. Addressing Specific Queries:**

  *   **"The set of people you're allowed to kill can't depend on which side has the just cause":** As above, this **is a genuine requirement** of the established Law of Armed Conflict and the symmetrical *jus in bello* orthodoxy. Its basis is practical necessity and maintaining minimal humanitarian standards. *However*, it is **contested** by revisionist just war theory, which argues it *should* depend on *jus ad bellum* and individual responsibility. A theory *must* take a stance on this core tension.
  *   **"Can the theory treat a combatant as liable only for the threats he personally poses?":** **Yes, absolutely.** This is a core tenet of much revisionist just war theory (e.g., Jeff McMahan). It grounds liability in individual moral responsibility for contributing to an unjust threat. *However*, this directly challenges the symmetrical *status-based* view of liability prevalent in LOAC (where simply being a combatant makes you targetable). A theory *must* choose its basis for liability (status vs. conduct/responsibility) and show how it handles the cases (especially conscripts, child soldiers, non-fighting combatants).

  **V. Flagged Tensions Between Requirements:**

  1.  **Symmetry of Rules vs. Liability Tracking Responsibility:**
      *   **Tension:** This is the **primary tension** you suspected. If liability tracks individual moral responsibility for contributing to an unjust threat (Liability Requirement), then *just* combatants are *not* liable to attack (as they pose no unjust threat), while *unjust* combatants *are*. This directly **contradicts** the Symmetry Requirement of *jus in bello*. Reconciling these seems impossible without abandoning one. Symmetry requires equal permissions/targetability; individualized liability based on *jus ad bellum* inherently creates asymmetry. Most theories prioritize one over the other or offer complex (often unsatisfactory) compromises.
  2.  **Combatant Status (Making Killing Not-Murder) vs. Individualized Liability:**
      *   **Tension:** If the distinctive feature making a soldier's killing permissible is primarily their *status* as an authorized combatant (the standard LOAC/orthodox view), this sits uneasily with theories demanding individualized moral liability based on personal responsibility/threat. The status view seems to grant a blanket permission potentially covering the non-responsible (conscripts, child soldiers), which the individualized view rejects.
  3.  **Excuse Conditions vs. Deterrence/Accountability for War Crimes:**
      *   **Tension:** While excusing soldiers under duress or extreme pressure is morally necessary, an overly broad conception of "battlefield excuse" risks undermining accountability for war crimes and the deterrent effect of law. Drawing the line between understandable human failing in extremis and culpable wrongdoing is inherently difficult and creates tension between moral nuance and legal enforcement.

  This framework provides the essential conceptual landscape your seminar needs to map. Each requirement presents a hurdle a theory must clear, and the tensions highlight where the deepest philosophical challenges lie. Good luck with the seminar!
