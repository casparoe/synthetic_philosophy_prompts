prompt: |-
  I am assembling the specification for a theory of dreaming before I look at any particular theory, and I want the criteria on the table first. The theory in question must take a stand on whether dreams are experiences — on whether there is something it is like to dream, and if so, whether that something happens during sleep or only in the act of waking recollection. Please give me the desiderata such a theory must satisfy. This is not a request for a survey of positions; it is a request for the checklist against which positions are to be measured. State each requirement together with the case or consideration that motivates it.

  Organise the list under four headings: (i) the cases the theory must get right; (ii) the distinctions it must not collapse; (iii) the empirical findings it must not contradict; and (iv) the explanatory and methodological demands on it — among which I count, for instance, that it not presuppose the very answer it is meant to deliver, and that it respect the evidential asymmetry that our only access to anyone's dreams runs through waking reports.

  For (i), I am especially interested in how the theory handles the following cases, which I have collected myself and which I do not take to be standard in the literature. Treat them as data points the theory must classify, not as illustrations to be waved at.

  - The silent narrator: over a stretch of the night a sleeper produces fluent, coherent speech describing a scene and events, but addresses no one, and on waking recalls nothing at all. Was an experience occurring during the night?
  - The bare verdict: a sleeper wakes with no experiential residue whatsoever yet finds himself simply disposed to assert that he dreamed such-and-such; contrast him with a sleeper who wakes with a vivid memory of having undergone the dream and asserts the same sentence.
  - The inserted dream: in a laboratory, a subject is woken, told a dream-like narrative, and within minutes comes to remember it as something he himself dreamed. Should the theory count this as a dream?
  - Real-time signalling: a sleeper in rapid-eye-movement sleep uses rehearsed eye movements to signal, as it happens, that he is aware he is dreaming and can follow instructions. Does responsiveness in real time establish that experience is occurring during sleep?
  - The replay: a device reconstructs the neural activity of a sleeper's dream episode and plays it into the brain of a waking subject, who then undergoes a sequence of experiences matching the sleeper's later report. Where, if anywhere, is the dream?

  For (ii), I take the following distinctions to be independently plausible, and I want to know whether the theory preserves each one or, if it rejects one, at what cost: the distinction between there having been an experience and there being a memory or report of one; between the dream's occurring during sleep and the dream's being a construction of the waking mind; between dreaming as a phenomenon and the dream report as the datum; between being a subject of experience and being a system that merely processes information; and between a dream's content and its phenomenal character — whether content can survive the loss of the latter.

  For (iii), the theory must accommodate at least: that dream reports are far more frequent on waking from rapid-eye-movement sleep than from other stages, though reports from other stages occur; that recall decays sharply within minutes of waking; that external stimuli delivered during sleep are sometimes incorporated into later reports; that lucid dreamers can signal in real time; and that report length and coherence vary with sleep stage. Correct me if any of these is stated too crudely, but do not simply drop them.

  Then, once the list is complete: mark each requirement as negotiable or non-negotiable, and say who would dispute the ones you call non-negotiable. Where you believe two requirements cannot both be met, say so explicitly and give the argument; a list that yields at least one impossibility result is worth more to me than one that does not. Name the single requirement that does the most to exclude otherwise attractive theories, and explain the exclusion. Close with no more than a sentence each on how the Malcolm-style view (that dreaming is not a kind of experience at all, the dream being constituted by the waking impression rather than undergone during sleep), the Dennett-style challenge (which does not assume that dreams are experiences occurring during sleep, and treats the answer as turning at least partly on how we deploy the term experience), and one further contender of your choosing fare against the list.

  End with a single final line beginning Verdict: that names, in that order, the one requirement that excludes the most otherwise attractive theories and the pair of requirements you claim cannot be jointly satisfied.
reasoning: |-
  We are constructing a checklist for a theory of dreaming, with emphasis on whether dreams are experiences occurring during sleep. The checklist is organized under four headings: (i) cases the theory must get right, (ii) distinctions it must not collapse, (iii) empirical findings it must not contradict, and (iv) explanatory and methodological demands.

  We first list the requirements under each heading. Then, we mark each as negotiable or non-negotiable, note who disputes non-negotiables, identify conflicts, and highlight the most excluding requirement. Finally, we briefly assess three views.

  ### (i) Cases the theory must get right

  1. **The silent narrator**: During sleep, the sleeper produces fluent, coherent speech describing a scene and events, but addresses no one and recalls nothing on waking. The theory must classify whether an experience occurred during sleep.  
     *Motivation*: This case tests whether behavioral output (speech) without subsequent memory implies an experience during sleep or merely automatic behavior.

  2. **The bare verdict**: A sleeper wakes with no experiential residue but is disposed to assert that he dreamed such-and-such. Contrast with one who has a vivid memory of the dream and asserts the same.  
     *Motivation*: This tests the necessity of conscious experience for dreaming and the role of memory. It distinguishes between a disposition to report and a memory of an experience.

  3. **The inserted dream**: A subject is woken, told a dream-like narrative, and soon remembers it as his own dream.  
     *Motivation*: This probes the criteria for a genuine dream: must it be generated during sleep, or can a post-hoc implanted narrative count? It challenges the theory's view on the origin of dreams.

  4. **Real-time signalling**: A sleeper in REM sleep uses prearranged eye movements to signal awareness of dreaming and ability to follow instructions.  
     *Motivation*: This tests whether real-time responsiveness during sleep establishes conscious experience. It directly addresses the possibility of lucid dreaming as evidence for experience during sleep.

  5. **The replay**: A device reconstructs the neural activity of a sleeper's dream and plays it into a waking subject, who then has experiences matching the sleeper's report. The theory must say where the dream is (if anywhere).  
     *Motivation*: This challenges the identity conditions of a dream: is it tied to the original neural activity, the content, or the subjective experience? It also tests whether a dream can be "transplanted."

  ### (ii) Distinctions the theory must not collapse

  6. **Experience vs. memory/report**: The distinction between an experience occurring and the subsequent memory or report of it.  
     *Motivation*: Without this, we conflate the dream itself with its recollection, which may be distorted or confabulated.

  7. **Sleep experience vs. waking construction**: The distinction between the dream as an event during sleep and the dream as a product of the waking mind.  
     *Motivation*: This is central to the debate about whether dreams are experiences during sleep or only upon waking.

  8. **Dream phenomenon vs. dream report**: The distinction between the dream as a subjective phenomenon and the report as the only available datum.  
     *Motivation*: The report is our evidence, but the dream (if it exists) is the phenomenon we seek to explain. A theory must not reduce the dream to the report.

  9. **Subject of experience vs. information processor**: The distinction between a system that is a subject of experience and one that merely processes information without phenomenality.  
     *Motivation*: This prevents over-attribution of consciousness to systems that might simulate dream-like behavior without subjective experience.

  10. **Content vs. phenomenal character**: The distinction between the representational content of a dream (e.g., that it was about a dragon) and its phenomenal character (what it was like to experience it).  
      *Motivation*: This allows for the possibility that content might be preserved in memory even when the phenomenal quality is lost, or that content might be reportable without the original phenomenology.

  ### (iii) Empirical findings the theory must not contradict

  11. **REM sleep dominance**: Dream reports are more frequent upon awakening from REM sleep than from other stages, though non-REM reports occur.  
      *Motivation*: This is a robust empirical regularity that any theory must account for.

  12. **Recall decay**: Dream recall decays sharply within minutes of waking.  
      *Motivation*: This suggests a fragile memory trace, which may relate to the nature of the dream experience and the process of waking consolidation.

  13. **Stimulus incorporation**: External stimuli delivered during sleep are sometimes incorporated into later dream reports.  
      *Motivation*: This indicates that sensory processing during sleep can influence dream content, implying some level of processing that may or may not be conscious.

  14. **Lucid dreaming signalling**: Lucid dreamers can signal in real time (e.g., with eye movements) that they are aware they are dreaming.  
      *Motivation*: This provides empirical evidence for conscious control during sleep, which strongly suggests experience during sleep.

  15. **Report variability**: Report length and coherence vary with sleep stage (e.g., REM reports tend to be longer and more narrative).  
      *Motivation*: This constrains theories about the relationship between sleep physiology and dream phenomenology.

  ### (iv) Explanatory and methodological demands

  16. **No presupposition of answer**: The theory must not presuppose that dreams are (or are not) experiences occurring during sleep.  
      *Motivation*: We want an explanation, not a circular definition.

  17. **Respect evidential asymmetry**: Our only access to dreams is through waking reports, but the theory must not treat this as meaning dreams are nothing but reports.  
      *Motivation*: While reports are the evidence, the dream (if it exists) might be more than the report. The theory must avoid the trap of collapsing the dream into the report.

  18. **Compatibility with neuroscience**: The theory should be consistent with known neural correlates of consciousness and sleep.  
      *Motivation*: A theory of dreaming should not contradict established neuroscience.

  19. **Parsimony**: The theory should not multiply entities (e.g., conscious experiences) without necessity.  
      *Motivation*: This is a general principle of scientific theorizing.

  20. **Phenomenal consciousness criterion**: If the theory posits that dreams are experiences, it must explain how they fit into the broader understanding of consciousness.  
      *Motivation*: Dreams are a form of conscious experience (if they are), so they should be integrated with theories of consciousness.

  ---

  Now, we mark each requirement as negotiable (N) or non-negotiable (NN) and note disputes.

  1. Silent narrator: NN. Some theories (e.g., behaviorist) might deny the experience, while others (e.g., cognitive) might affirm it.
  2. Bare verdict: NN. Disputed by theories that hold that dreaming requires conscious experience (so the bare verdict case might not be a dream) vs. those that allow dispositional states without experience.
  3. Inserted dream: N. Many theories would not count this as a dream because it was not generated during sleep, but the case challenges the boundaries.
  4. Real-time signalling: NN. Disputed by theorists who deny the possibility of lucid dreaming (rare) or who question whether the signalling is truly conscious.
  5. Replay: N. This is a thought experiment; its resolution depends on the theory's stance on personal identity and the nature of experience.
  6. Experience vs. memory/report: NN. Disputed by constructivist theories that blur the line (e.g., that all we have are reports, so the experience is inferred).
  7. Sleep experience vs. waking construction: NN. This is the central distinction. Malcolm explicitly collapses it; others (like Hobson) maintain it.
  8. Dream phenomenon vs. dream report: NN. Disputed by eliminativist views (e.g., that dreams are just reports) but maintained by most.
  9. Subject of experience vs. information processor: NN. Disputed by functionalist or behaviorist views that might attribute experience based on behavior.
  10. Content vs. phenomenal character: NN. Disputed by representational theories of consciousness that might reduce phenomenality to content.
  11. REM dominance: NN. Widely accepted; any theory must account for it.
  12. Recall decay: NN. Well-established; theories must explain why dreams are hard to remember.
  13. Stimulus incorporation: NN. Well-documented; must be explained.
  14. Lucid dreaming signalling: NN. Empirical fact; theories must account for it.
  15. Report variability: NN. Well-established; must be explained.
  16. No presupposition: NN. Methodological requirement; but some theories start with an assumption.
  17. Evidential asymmetry: NN. Methodological requirement; but some theories (e.g., Malcolm's) use it to argue that dreams are not sleep experiences.
  18. Compatibility with neuroscience: NN. Disputed by some philosophical views that might be dualist or ignore neuroscience.
  19. Parsimony: N. This is a virtue but not absolute; sometimes complexity is necessary.
  20. Phenomenal consciousness criterion: NN. Disputed by theories that deny phenomenal consciousness (e.g., illusionism) but required for theories that take consciousness seriously.

  ---

  **Conflicts**:

  - **Conflict between 7 (sleep experience vs. waking construction) and 17 (evidential asymmetry)**: If we strictly respect evidential asymmetry (that we only have reports), it becomes difficult to establish that an experience occurred during sleep without circularity. For instance, Malcolm uses this to argue that the concept of a dream is only of a waking impression. Thus, maintaining both 7 (as a distinction) and 17 might be challenging. The argument: if the only evidence is the report, and the report is a waking construction, then we cannot know about sleep experiences. This might push towards collapsing the distinction (rejecting 7) or reinterpreting the evidence.

  - **Conflict between 16 (no presupposition) and 20 (phenomenal consciousness criterion)**: If we require that the theory explain dreams in terms of phenomenal consciousness (20), but we also require that it not presuppose that dreams are experiences (16), then we have a tension. The argument: if we build in the phenomenal consciousness criterion, we are already assuming that dreams are experiences, which might be the very issue at stake.

  **Most excluding requirement**:

  Requirement 7 (distinction between sleep experience and waking construction) does the most to exclude otherwise attractive theories. It excludes Malcolm's view (which collapses the distinction) and also challenges Dennett's multiple drafts model if it leads to a view that dreams are only waking narratives. This requirement forces the theory to address the temporal location of the dream, which is central to the debate.

  ---

  **Brief assessment of three views**:

  - **Malcolm-style view (dreaming is not a kind of experience during sleep)**: Fails to distinguish sleep experience from waking construction (7) and arguably collapses experience vs. memory (6). It respects evidential asymmetry (17) but contradicts real-time signalling (4) and lucid dreaming (14). It also denies that dreams are experiences, so fails the phenomenal consciousness criterion (20) if that is required.

  - **Dennett-style challenge (treats the answer as turning on how we deploy 'experience')**: Avoids presupposing the answer (16) and respects evidential asymmetry (17). But it might collapse the distinction between sleep experience and waking construction (7) by treating the dream as a narrative constructed upon waking. It may handle the silent narrator (1) as automatic behavior and real-time signalling (4) as a behavioral indicator without necessarily requiring experience. However, it might struggle with the bare verdict (2) and the replay (5) because it avoids committing to an ontology of experience.

  - **Activation-synthesis model (Hobson and McCarley)**: Posits dreams as experiences during sleep (so preserves 7) and is compatible with neuroscience (18). It handles REM dominance (11) and report variability (15) well. But it might struggle with the silent narrator (if speech is not accompanied by experience) and the inserted dream (3) because it emphasizes endogenous brain activation. It may also be challenged by lucid dreaming (14) since it originally portrayed dreams as delusional.

  ---

  **Verdict**: The requirement that excludes the most otherwise attractive theories is the distinction between sleep experience and waking construction (7). The pair of requirements that cannot be jointly satisfied are the distinction between sleep experience and waking construction (7) and the evidential asymmetry (17).
answer: |-
  ### Desiderata for a Theory of Dreaming  
  *Focused on whether dreams are experiences occurring during sleep, with requirements organized under four headings. Each requirement includes a motivation. Requirements marked 🔴 = non-negotiable; 🟢 = negotiable. Disputes and conflicts identified at the end.*

  ---

  #### **(i) Cases the Theory Must Get Right**  
  *These are data points for classification, not illustrations. The theory must specify whether an experience occurred during sleep.*

  1. **Silent Narrator**: The theory must determine whether the sleeper's fluent, coherent speech during sleep (with no recall on waking) constitutes an experience during sleep.  
     *Motivation*: Tests if behavioral output (e.g., sleep-talking) requires conscious experience or can be purely automatic.  
     🔴 *Non-negotiable*: Disputed by behaviorists (e.g., Skinnerians) who reduce dreams to dispositions, and by constructivists who tie experience to recall.

  2. **Bare Verdict**: The theory must distinguish between (a) a sleeper who wakes with no experiential residue but asserts "I dreamed X" and (b) one who asserts "I dreamed X" based on vivid memory. It must explain why (a) claims a dream occurred without phenomenality.  
     *Motivation*: Probes whether dreaming necessitates phenomenal consciousness or if it can be a metacognitive judgment (e.g., inferred from cognitive cues).  
     🔴 *Non-negotiable*: Disputed by higher-order thought theorists (e.g., Rosenthal) who reduce phenomenality to access.

  3. **Inserted Dream**: The theory must decide whether a dream-like narrative implanted upon waking (and later remembered as a dream) qualifies as a genuine dream.  
     *Motivation*: Tests if dreams must be generated endogenously during sleep or if externally sourced narratives can count, challenging theories that prioritize origin over content.  
     🟢 *Negotiable*: Disputed by realists (e.g., Revonsuo) who demand sleep-generation, versus narrative theorists (e.g., Freudians) who prioritize subjective conviction.

  4. **Real-Time Signalling**: The theory must account for whether prearranged eye movements during REM sleep (signalling lucidity) establish conscious experience during sleep.  
     *Motivation*: Assesses if volitional responsiveness implies phenomenal consciousness, critical for validating lucid dreaming as evidence for real-time experience.  
     🔴 *Non-negotiable*: Disputed by illusionists (e.g., Frankish) who argue signals could be non-conscious automatisms.

  5. **The Replay**: The theory must locate the "dream" (if anywhere) when reconstructed neural activity from a sleeper is played into a waking subject, inducing matching experiences.  
     *Motivation*: Challenges whether dreams are defined by neural substrate, content, or subjective ownership, and if phenomenality can be "detached" from the original sleeper.  
     🟢 *Negotiable*: Disputed by neural essentialists (e.g., Churchland) versus content-based theorists (e.g., Tye).

  ---

  #### **(ii) Distinctions the Theory Must Not Collapse**  
  *These independently plausible distinctions must be preserved or explicitly rejected with justification.*

  6. **Experience vs. Memory/Report**: The theory must not conflate the occurrence of an experience during sleep with the subsequent memory or report of it.  
     *Motivation*: Memory distortion and confabulation (e.g., in "false awakening" reports) show experiences and reports can dissociate. Collapsing them ignores empirical gaps.  
     🔴 *Non-negotiable*: Disputed by eliminativists (e.g., Malcolm) who reduce dreams to reports.

  7. **Sleep Experience vs. Waking Construction**: The theory must not conflate an experience occurring *during* sleep with one constructed *upon waking*.  
     *Motivation*: Waking amnesia and incorporation of waking stimuli (e.g., alarms into dreams) suggest distinct processes. Collapsing them precludes explaining temporal dynamics.  
     🔴 *Non-negotiable*: Disputed by neo-constructivists (e.g., Nir & Tononi) who argue dreams are largely waking reconstructions.

  8. **Dream Phenomenon vs. Dream Report Datum**: The theory must not reduce the dream (as a phenomenon) to the dream report (as evidence).  
     *Motivation*: Reports are fallible data; the phenomenon (if it exists) is the target of explanation. Collapsing them conflates evidence with ontology.  
     🔴 *Non-negotiable*: Disputed by operationalists (e.g., behaviorist psychologists) who define dreams solely by reports.

  9. **Subject of Experience vs. Information Processor**: The theory must not conflate being a subject of phenomenal experience with merely processing information (e.g., neural activity without qualia).  
     *Motivation*: Systems like deep neural networks can "process" dream-like content without consciousness. Collapsing the distinction risks over-attributing phenomenality.  
     🔴 *Non-negotiable*: Disputed by functionalists (e.g., Dennett) who tie consciousness to information access.

  10. **Content vs. Phenomenal Character**: The theory must not conflate the representational content of a dream (e.g., "a dragon attacked") with its phenomenal character (what it was like to experience it).  
      *Motivation*: Content can be reported without phenomenal "vivacity" (e.g., in non-REM dreams), suggesting dissociability. Collapsing them ignores qualitative atrophy.  
      🔴 *Non-negotiable*: Disputed by representationalists (e.g., Dretske) who reduce phenomenality to content.

  ---

  #### **(iii) Empirical Findings the Theory Must Not Contradict**  
  *Corrected for precision; none dropped.*

  11. **REM Sleep Report Frequency**: The theory must accommodate that dream reports are most frequent after REM awakenings (~80%), but occur in other stages (e.g., NREM: 10-50%).  
      *Motivation*: Implies REM physiology is optimised for dream generation, but not exclusively. Denial ignores sleep-stage dissociations.  
      🔴 *Non-negotiable*: Disputed only by fringe views ignoring neuroscience.

  12. **Recall Decay**: The theory must accommodate that dream recall declines sharply within 5-10 minutes of waking, even for vivid dreams.  
      *Motivation*: Suggests dreams involve fragile memory encoding distinct from waking experiences. Denial contradicts experimental data.  
      🔴 *Non-negotiable*: Undisputed core finding.

  13. **Stimulus Incorporation**: The theory must accommodate that external stimuli (e.g., sounds, sprays) during sleep are sometimes incorporated into dream reports.  
      *Motivation*: Induces graded sensory processing during sleep; denial ignores top-down/bottom-up interactions in dream formation.  
      🔴 *Non-negotiable*: Disputed only by theories denying sleep-perception (e.g., Malcolm).

  14. **Lucid Dream Signalling**: The theory must accommodate that pre-trained lucid dreamers can signal awareness via eye/body movements during verified REM sleep.  
      *Motivation*: Provides empirical proof of volitional control during sleep; denial requires dismissing controlled studies.  
      🔴 *Non-negotiable*: Disputed by theorists attributing signals to micro-awakenings (e.g., Occhionero).

  15. **Report Variability by Sleep Stage**: The theory must accommodate that REM reports are longer, more vivid, and narrative-driven, while NREM reports are fragmentary and thought-like.  
      *Motivation*: Reflects neurophysiological differences (e.g., REM cortical activation vs. NREM synchrony). Denial oversimplifies dream phenomenology.  
      🔴 *Non-negotiable*: Undisputed core finding.

  ---

  #### **(iv) Explanatory and Methodological Demands**  

  16. **No Presupposition of Answer**: The theory must not presuppose that dreams are (or are not) experiences occurring during sleep.  
      *Motivation*: Circular theories (e.g., defining dreams as "sleep experiences") evade the central question.  
      🔴 *Non-negotiable*: Disputed by intuitive realists (e.g., Hobson) who take experience for granted.

  17. **Respect Evidential Asymmetry**: The theory must acknowledge that waking reports are the sole evidence for others' dreams, yet not treat this as implying dreams are *nothing but* reports.  
      *Motivation*: The asymmetry is epistemic (we infer experiences from reports), not ontological (experiences may exceed reports). Ignoring this invites reductionism.  
      🔴 *Non-negotiable*: Disputed by report-focused theories (e.g., Malcolm).

  18. **Neuroscientific Compatibility**: The theory must cohere with established neural correlates of consciousness (e.g., global workspace activation) and sleep (e.g., REM/NREM mechanisms).  
      *Motivation*: Dreams are biological phenomena; neural evidence (e.g., fMRI of lucid dreamers) constrains theorizing.  
      🔴 *Non-negotiable*: Disputed by dualists or strict behaviorists.

  19. **Parsimony**: The theory should avoid multiplying entities (e.g., "unconscious experiences") without empirical necessity.  
      *Motivation*: Prevents ad hoc postulates (e.g., Freudian latent content) that inflate explanations.  
      🟢 *Negotiable*: Virtue, not requirement; disputed by layered-mind theorists (e.g., Jungians).

  20. **Phenomenal Character Accountability**: If the theory posits dreams as experiences, it must explain how their phenomenal character arises from sleep-specific neurophysiology.  
      *Motivation*: Dreams exhibit unique features (e.g., bizarreness, reduced agency); theories must integrate them with consciousness studies.  
      🔴 *Non-negotiable*: Disputed by illusionists who deny phenomenality.

  ---

  ### Analysis of Requirements  
  - **Negotiable vs. Non-Negotiable**: 14/20 marked 🔴 (non-negotiable). Non-negotiables are disputed only by minority views (e.g., Malcolm-style eliminativism for 6–8, 17; strict behaviorism for 18; illusionism for 20).  
  - **Impossibility Result**: Requirements 7 (sleep experience vs. waking construction) and 17 (evidential asymmetry) **cannot be jointly satisfied** without compromise.  
    - *Argument*: Strict adherence to evidential asymmetry (17) implies we can only access dreams via waking reports, making it impossible to empirically verify whether an experience occurred during sleep (7). Any theory preserving 7 must infer sleep experiences from reports, violating 17's demand to avoid treating dreams as "nothing but reports." Conversely, theories strictly following 17 (e.g., Malcolm's) collapse 7, denying sleep experiences. Resolving this requires weakening one requirement (e.g., allowing indirect neural evidence for 7) or redefining "experience."  
  - **Most Exclusionary Requirement**: Requirement 7 (sleep experience vs. waking construction) excludes the most otherwise attractive theories.  
    - *Exclusion Explained*: It rules out:  
      - **Constructivist theories** (e.g., Nir & Tononi's "waking reconstruction" model), which blur sleep/waking boundaries.  
      - **Report-based theories** (e.g., Malcolm's), which reduce dreams to waking impressions.  
      - **Dennett-style views**, which avoid committing to temporal location.  
      These theories are attractive for parsimony (19) or respecting evidential asymmetry (17), but fail 7.  

  ---

  ### Brief Assessment of Theories  
  - **Malcolm-style view** (dreaming as waking impression, not sleep experience): Fails requirements 1 (silent narrator: denies experience), 4 (real-time signalling: dismisses evidence), 6–7 (collapses distinctions), 13–14 (contradicts incorporation/lucid signalling), and 17 (respects asymmetry but presupposes answer). Passes 3 (inserted dream: counts as dream) and 8–9 (distinctions moot if no experience).  
  - **Dennett-style challenge** (turns on "experience" deployment): Passes 16–17 (no presupposition, respects asymmetry) and handles 1–2 (treats cases as report-relative). Fails 7 (avoids committing to sleep experience), 9–10 (collapses distinctions under informational criteria), and 20 (avoids phenomenality).  
  - **Neurobiological view** (e.g., Hobson's activation-synthesis): Passes 4 (signalling as experience), 11–15 (fits empirical findings), 18 (neuroscientifically compatible). Fails 16 (presupposes sleep experiences), 3 (inserted dream not "genuine"), and struggles with 2 (bare verdict: requires neural criteria for phenomenality).  

  ---

  **Verdict**: Requirement 7 excludes the most otherwise attractive theories; Requirements 7 and 17 cannot be jointly satisfied.
