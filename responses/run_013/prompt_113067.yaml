answer: |-
  Here is a distilled list of core desiderata for any account of future contingency, grounded in the phenomena they address, with their non-negotiable status clarified and collisions highlighted. I’ll conclude with the key bottleneck and a plain-English assessment of how major approaches fare.

  ### Core Desiderata:  
  1. **Truth-Aptness of Future-Directed Speech Acts (Non-negotiable)**  
     *Why*: We hold people accountable for predictions ("You said it *would* rain!") and promises ("You *promised* to help"). If "It will rain" cannot be true/false *now*, retractions, apologies, and accountability dissolve.  
     *Case*: A meteorologist warns, "A storm will hit tomorrow." If it hits, their warning was correct *when uttered*; if not, it was mistaken—even before the event.  

  2. **Separation of Logical and Causal Threat (Non-negotiable)**  
     *Why*: The sea-battle puzzle targets *logic* (bivalence implies fixity), not physics. Solutions invoking indeterminism (e.g., "quantum randomness saves agency") evade the logical challenge.  
     *Case*: Even in a fundamentally chancy world (e.g., radioactive decay), if "Atom X will decay at noon" is *already* true/false, agency seems undermined.  

  3. **Past/Future Asymmetry: Non-Presuppositional (Non-negotiable)**  
     *Why*: We treat the past as fixed ("Caesar crossed the Rubicon") and the future as open ("I may or may not retire"). The theory must *explain* this asymmetry, not assume it.  
     *Case*: Saying "It *might* rain tomorrow" feels substantive, but "It *might* have rained yesterday" (absent new evidence) is merely epistemic.  

  4. **Distinction Between ‘Will’ and ‘Might’ + Settling Without Truth-Value Change (Conditionally negotiable)**  
     *Why*: (a) "It will happen" vs. "It might happen" must differ in content, or planning collapses. (b) Events "become settled" (e.g., a coin flip lands) without the claim "It landed heads" *changing* from false to true—it was neither.  
     *Case*: Before a coin flip, "It *will* land heads" is unjustified; "It *might*" is apt. After, it "becomes settled" as heads—but if it was *always* true, how did the future change?  

  5. **Agency Robustness: No Prediction-Action Loops (Non-negotiable)**  
     *Why*: If an agent’s act makes a prediction true (e.g., "You *will* vote Labour" causing defiance), the prediction’s truth mustn’t *determine* the act.  
     *Case*: A prediction "Lee *will* freely choose coffee" seems incompatible with Lee’s freedom—if true, can Lee choose tea?  

  ---

  ### Collisions: The Irreconcilable Tensions  
  - **Truth-Aptness (1) + Settling Without Truth-Change (4b) vs. Truth-Value Realism (assumes all propositions are true/false *now*)**  
    If predictions are true/false *now* (Truth-Value Realism), "settling" is illusory—the future was always fixed. But if claims "become true" later (e.g., at the time of the event), they lack truth-value *now*, undermining Truth-Aptness (1). **This is the central collision.**  

  - **Agency Robustness (5) vs. Truth-Value Realism**  
    If "Lee will choose coffee" is *true now*, Lee’s apparent freedom to choose tea is incoherent—suggesting the prediction *causally* (or logically) fixes the outcome.  

  - **Past/Future Asymmetry (3) vs. Symmetrical Ontologies (e.g., eternalism)**  
    If past and future exist equally (eternalism), the asymmetry must be explained as merely psychological—but this risks undermining the *reality* of openness (3).  

  ---

  ### The Key Bottleneck: Truth-Value Realism  
  **Truth-Value Realism** (TVR) — the claim that every future contingent statement ("Event E will occur") is *already* true or false — is the primary excluder. It directly threatens **Agency Robustness (5)**, **Settling Without Truth-Change (4b)**, and the *robustness* of **Past/Future Asymmetry (3)**.  

  ### How Major Families Fare Against TVR:  
  1. **Ockhamism (TVR upheld)**  
     - *Response*: Future contingents are true/false *now*, but this doesn’t causally determine outcomes.  
     - *Collision*: Struggles with **Agency Robustness (5)**. If "Lee will choose coffee" is *true now*, how is Lee free to do otherwise? Often invokes "soft facts" (truths dependent on future events), which many find ad hoc.  

  2. **Peirceanism (TVR rejected for future contingents)**  
     - *Response*: "E will happen" is *neither true nor false now*; only "E might happen" or "E will inevitably happen" have truth values.  
     - *Collision*: Violates **Truth-Aptness (1)**. If "The storm will hit" isn’t true/false now, how was the meteorologist *wrong* if it misses? Also struggles with **Settling (4b)**—does "E happened" suddenly *become* true?  

  3. **Open Futurism (TVR rejected; future is ontologically indeterminate)**  
     - *Response*: Future contingents lack truth values; reality branches. "Will" claims are false (or indeterminate); only "might" claims hold.  
     - *Collision*: **Truth-Aptness (1)** is sacrificed. Promises ("I *will* pay you") cannot be bindingly true *when made*.  

  4. **Relativism / "Truth at a Time"**  
     - *Response*: "E will happen" is true/false *relative to a future time*.  
     - *Collision*: Can salvage **Truth-Aptness (1)** by relativizing truth (e.g., "true as assessed now"), but **Settling (4b)** becomes trivial—truth is time-relative. Hard to explain **Past/Future Asymmetry (3)** non-arbitrarily.  

  ---

  ### Conclusion  
  The indispensable but problematic requirement is **Truth-Aptness (1)**: everyday practice demands that predictions *can* be wrong *now*. Yet **Truth-Value Realism** (TVR) — needed to secure this robustly — fatally undermines **Agency Robustness (5)** and **Settling Without Truth-Change (4b)**. The sea-battle puzzle thus exposes a genuine fracture: *either* future truth is unsettled (threatening Truth-Aptness), *or* it is settled (threatening Agency). No account fully satisfies all desiderata; each sacrifices one to save others. The **Agency Robustness (5)** requirement does the most to exclude candidates, as TVR-compatible views (like Ockhamism) struggle to show how agents can act freely when future truths about their acts already exist. In your seminar, this collision—between the *logic* of truth and the *phenomenology* of agency—should frame all subsequent debate.
