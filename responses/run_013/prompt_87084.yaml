answer: |-
  Your friend fundamentally misapprehends the structural distinction the doctrine requires. The ceiling game *is not* the dollar auction; it is a distinct planning phase where agents, facing no sunk costs, commit to maximum expenditure bounds with full foresight of the consequences. The rational plan involves selecting a ceiling that maximizes expected utility given beliefs about the opponent's ceiling. Crucially, once chosen, the plan binds *because abandoning it mid-execution (after seeing the opponent's ceiling) would constitute a failure of rational agency, not because the costs are sunk. 

  Within this framework, an equilibrium exists: both agents set ceilings at or marginally above the dollar’s value minus the bid increment (e.g., $0.95), knowing that exceeding this invites loss if the opponent bids rationally. The bound emerges from the value of the prize and the bid step. Setting $1.00 guarantees a net loss of $0.05 if the opponent bids $0.95; setting below $0.95 guarantees loss to any higher bid. Thus, mutual selection of $0.95 yields a $0.90 net gain for the winner and a $0.95 loss for the loser—a Nash equilibrium given the rules. 

  The difference between rational binding and stubborn trapping lies in the *ex ante* justification. A rational plan is adopted only if, at the moment of adoption, it is expected to yield the best available outcome relative to alternatives *and* remains executable without revision under foreseen contingencies. Stubbornness adheres to a plan *despite* new information rendering it suboptimal or despite its initial adoption being negligently formed. Here, the ceiling plan is rational precisely because it pre-commits to a strategically sound limit before exposure to the escalation dynamic, avoiding the real-time irrationality of the standard auction. The failure would be abandoning the ceiling upon seeing the opponent's choice—succumbing to the very impulse the plan exists to negate.
