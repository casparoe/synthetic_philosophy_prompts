prompt: |-
  I host a podcast — science-and-ideas stuff, not academic — and next month's guest is a quantitive historian who's spent a few years modelling how long states and empires last. His thing, which I find half bracing and half nuts, is that the lifespan of a polity is basically memoryless. You pick the widest reference class you can defend — all sovereign polities in the historical record, or all of them above some size/complexity threshold — estimate a single constant hazard rate off that class, and then refuse to update on age. So the fact that some empire has already lasted six hundred years tells you nothing about how much longer it has; it's radioactive decay, or a coin that's come up heads ten times. He's explicit that this is just the outside view taken seriously, and that everything we call decline — the fiscal crises, the elite overproduction, the invasions — is the inside view, a story told about a sample of one. He also says a reference class only counts as principled if it's the one picked out by a symmetry, i.e. the features you're indifferent about shouldn't move the hazard rate.

  I want questions that make him actually work. Draft me eight to ten. I need at least one each on: (a) why I shouldn't just gerrymander the class until the frequency comes out how I like, and whether his symmetry talk is anything more than the principle of indifference wearing a lab coat; (b) the empirical side — what would have to be true in the data for his memoryless claim to be false, and whether the standard complaint that state lifespans look more like a power law (loads of short ones, a handful of very long ones) is a real problem for him or just a fact he can absorb; and (c) the upshot — if age carries no information, what is he telling a policymaker or a funder to do differently, and isn't that just defunding the study of history? Also one on the Lindy effect, since he must get that constantly, and I want to know if he thinks it's a real regularity or a selection artifact.

  For each question, give me a follow-up keyed to the answer he's most likely to give. I've heard him talk enough to know his moves, and I don't want to be left flat-footed when he says that's the inside view again. Where he has a standard dodge, the follow-up should close it off rather than just restate the question louder. No generic stuff like what got him into history.
reasoning: |-
  Okay, the user hosts a science podcast and has an upcoming guest who's a quantitative historian with a provocative theory: that the lifespan of polities (states, empires) is "memoryless." That means once you've defined a reference class of all sovereign polities above a certain threshold, the hazard rate (chance of collapse) remains constant over time. So an empire lasting 600 years has the same future survival odds as a brand-new one. The guest dismisses traditional decline narratives as "inside view" storytelling.  

  The user wants sharp questions that force the guest to engage deeply, not retreat into canned responses. They specifically want questions probing three areas: (a) reference class manipulation and whether "symmetry" is just the principle of indifference rebranded; (b) empirical validity—especially if power-law distributions of lifespans contradict the memoryless claim; and (c) practical implications—does this mean we should stop studying historical causes of collapse? They also want a Lindy effect question.  

  Hmm, the user is clearly frustrated with the guest's tendency to deflect by calling critiques "inside view" thinking. They want follow-ups that anticipate his dodges. For example, if he says power-law data is compatible with constant hazard, the follow-up should challenge whether that's mathematically coherent. If he argues symmetry prevents gerrymandering, the follow-up should ask why symmetry isn't itself arbitrary.  

  The user’s tone suggests they find the theory intriguing but half-baked. Their hidden need might be to expose whether this model is genuinely rigorous or just a clever rhetorical trick. They’re not looking for gotcha moments but substantive pressure points—e.g., "If hazard rates are constant, why do we observe so many infant mortalities and ancient empires?"  

  For the Lindy question, the guest likely calls it a selection bias. The follow-up should press him on whether his own reference class suffers similar bias by excluding short-lived polities.  

  The policymaker angle is crucial: if age doesn’t predict collapse, does that mean we should ignore historical lessons? His probable dodge is "I’m not prescribing policy," so the follow-up must force him to admit this model implies futility in studying decline mechanisms.  

  Notable landmines: The user hates generic questions. Every query must corner him on logic, data, or consequences. Also, avoid letting him equate "no memory" with radioactive decay—atomic half-lives are physically fixed, while polities aren’t identical particles. That analogy might be his weak point.  

  Structure-wise: 8–10 questions total, with at least one per focus area (a/b/c/Lindy), each with a tailored follow-up. Prioritize questions where his answers might unravel—e.g., if symmetry is his defense against gerrymandering, ask why we shouldn’t demand *causal* invariance instead of indifference.  

  This guest seems slippery. The follow-ups must be surgical. For instance, if he says power-law data fits a constant hazard model, the retort should be: "But doesn’t a power law imply *decreasing* hazard rates for older entities?" That’s harder to hand-wave.
answer: |-
  Here are eight incisive questions with targeted follow-ups designed to pressure-test his framework, anticipate his dodges, and force concrete answers:

  ### Core Mechanics & Reference Class
  1. **Question:** You insist reference classes must be defined by "symmetry" (features we're indifferent about don't affect hazard rate). But isn't this just the Principle of Indifference dressed up? Why isn't choosing *which* symmetries to prioritize (e.g., geography vs. technology level) itself an arbitrary act vulnerable to gerrymandering?  
     *Likely Dodge:* "Symmetry is objective; it's about invariance under transformation."  
     **Follow-Up:** "But transformations depend on your *choice* of variables. If I transform 'polity size' using a logarithmic scale instead of linear, the hazard rate invariance might break – doesn't that make symmetry itself subjective? How do you specify the 'correct' transformation rule?"

  2. **Question:** Couldn't I artificially inflate the average lifespan in my reference class by excluding all polities that collapsed before, say, 50 years (calling them 'failed states' or 'not complex enough')? How does symmetry prevent this *ex post* cherry-picking to get a hazard rate that flatters long-lived states?  
     *Likely Dodge:* "That violates symmetry; age-at-entry must be irrelevant."  
     **Follow-Up:** "But the exclusion itself relies on an *inside-view narrative* about what constitutes a 'real' polity worthy of inclusion. Isn't defining the reference class boundary inherently vulnerable to this narrative bias, making the 'constant hazard' an artifact of definition?"

  ### Empirical Validity & Power Laws
  3. **Question:** Empirically, polity lifespans show a heavy-tailed distribution – lots of short-lived ones, very few ancient ones. A constant hazard rate predicts an *exponential* decay (rapid drop-off). Doesn't this power-law pattern directly contradict the memoryless exponential model?  
     *Likely Dodge:* "Aggregate data can hide multiple constant-hazard processes; infant mortality plus a stable rate later."  
     **Follow-Up:** "But if you model it as two constant rates (high early, lower later), you've *abandoned memorylessness* – age *does* carry information (surviving infancy predicts lower future hazard). Doesn't this concession destroy the core claim?"

  4. **Question:** What specific empirical signature in the data *would* falsify the memoryless hypothesis for you? If hazard rates demonstrably increased *or* decreased systematically with age *within* a principled reference class, would that kill the model?  
     *Likely Dodge:* "That would just mean my reference class wasn't truly symmetric; I'd need to find the invariant subgroup."  
     **Follow-Up:** "Doesn't this make your model unfalsifiable? Any deviation is blamed on an imperfect reference class. What observation *couldn't* be explained away by refining the class?"

  ### Implications & Upshot
  5. **Question:** If age truly carries zero information about collapse risk, what operational advice follows for policymakers? Should the US State Department *stop* analyzing specific indicators of Roman or Ottoman decline because it's just 'inside view' noise?  
     *Likely Dodge:* "I'm describing aggregate risk, not prescribing policy. They should still manage specific risks."  
     **Follow-Up:** "But doesn't your model imply that resources spent studying *why* empires fall are wasted? If collapse is a memoryless Poisson process, unique causes are irrelevant epiphenomena. Shouldn't we defund historical analysis of decline and just buy actuarial tables?"

  6. **Question:** Doesn't the 'outside view' become paralyzing? If a 600-year-old empire and a 60-year-old state have identical annual collapse odds, how does any rational actor justify long-term investments in institutions, infrastructure, or dynasty-building?  
     *Likely Dodge:* "Actuaries price lifespans this way; they still build."  
     **Follow-Up:** "But actuaries price based on *known* hazards (age, health). You remove age. If *only* the constant background rate matters, and unique circumstances are noise, doesn't this model actively discourage any long-term strategic planning beyond the immediate?"

  ### The Lindy Effect
  7. **Question:** The Lindy Effect suggests something lasting X years has a *future* expectancy of X years – implying hazard rates *decrease* with age. You say it's a selection artifact. But isn't your *own* reference class vulnerable to the same bias? You exclude ephemeral entities, potentially creating an artificial cohort where only the robust remain.  
     *Likely Dodge:* "My class includes *all* qualifying polities from start to end, regardless of current age. Lindy confuses conditional probability."  
     **Follow-Up:** "But if your data source (e.g., historical records) systematically undercounts very short-lived polities (e.g., minor rebellions, ephemeral conquests), doesn't this create an artificial *infant mortality* dip in your dataset, making the *observed* hazard *look* constant after an initial drop – mimicking your model while actually being biased?"

  ### Philosophical Edge
  8. **Question:** You describe decay mechanisms (fiscal crisis, invasion) as "inside view stories." But don't those mechanisms exhibit *recurring patterns* across polities? Isn't dismissing them as noise equivalent to saying physics should ignore the mechanics of radioactive decay because it's just 'storytelling' about individual atoms?  
     *Likely Dodge:* "The *timing* is stochastic. The mechanisms are how collapse manifests, not what predicts *when*."  
     **Follow-Up:** "If the *underlying drivers* of collapse (e.g., resource depletion, institutional sclerosis) are genuinely systemic and accumulate predictably over time *within polities*, wouldn't that *necessarily* create a hazard rate that increases with age, breaking memorylessness? How can you be sure you're not mistaking ignorance of the *accumulation process* for true randomness?"

  **Key Tactics Used:**
  *   **Pre-empting "Inside View" Dodges:** Questions 1, 2, 5, 7, 8 explicitly frame objections in ways where calling them "inside view" would be nonsensical or require admitting bias.
  *   **Forcing Falsifiability:** Questions 3 (power law), 4 (falsification criteria) directly challenge empirical coherence and testability.
  *   **Highlighting Practical Absurdity:** Questions 5 & 6 push the model's implications to uncomfortable policy conclusions.
  *   **Turning His Framing Against Him:** Question 7 uses his own "selection bias" critique of Lindy against his reference class. Question 8 uses his physics analogy against him.
  *   **Targeting Core Assumptions:** Questions 1 & 2 attack the foundation (symmetry/indifference). Question 4 attacks unfalsifiability.

  These questions force him to defend the mechanics, confront the data, justify the implications, and avoid easy escapes. Good luck with the interview!
