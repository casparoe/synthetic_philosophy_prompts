prompt: |-
  Hey so my philosphy of mind seminar has been stuck on the careenium for like three weeks now and I need an outside take. The setup (Hofstadter's, it's in the course reading) is a big box full of tiny magnetic marbles, the simms, that bounce around and sometimes clump together into bigger clusters, the simmballs. At their own level the simmballs look like they carry information and mean things; the individual simms don't mean anything at all. Our prof keeps drawing three levels: the substrate (simms bouncing), a middle geometric level (how the clusters form and move), and a meaning/symbol level (the simmballs as symbols). I think she calls them mentalics, mesodynamics, and thinkodynamics, or maybe those are Hofstadter's own terms, I can't remember.

  Anyway here's what I actually want a real answer on. The prof says the interesting question is whether the simmballs actually push the simms around, whether the symbol level does any causal work, or whether it's really just simms pushing simms and the whole symbol story is a convenient redescription we slap on top. I keep flip-floping.

  So: give me your credence in this proposition. The symbol level (the simmballs) has causal powers that are real and not merely inherited-from or reducible-to the micro level, i.e. facts about simmballs belong in the true causal story of what the simms do, in a way a purely simm-level account can't just swap in without losing something causal (not merely explanatory).

  And decompose it. I want the sub-questions the number hangs on, a rough probability for each, one line of justification each, and how they combine into the final number:

  - does the micro level being causally closed actually rule out higher-level causal powers, or is that a mistake?
  - are the higher-level patterns real in the sense that there's a fact of the matter about which clusterings are the right ones, versus us just choosing a convenient grid?
  - does "you can't predict or explain it without the simmball level" really buy you causal efficacy, or is that a fallacy?
  - is the whole levels-of-causation framing even a genuine question, or is it just a verbal dispute about the word "cause"?
  - and whatever other terms you think belong in there.

  Then tell me which single sub-question the final number is most sensitive to, and what would actually move it. FWIW I'm sitting around 0.3, I lean toward "it's just simms," and my study partner is at like 0.8. Which sub-question do you think the two of us are really disagreeing about?
