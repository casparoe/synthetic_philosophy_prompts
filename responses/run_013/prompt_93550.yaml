answer: |-
  ## The Elusive Essence: Why Dispositions Defy Reduction

  The conditional analysis of dispositions, in its simplest form (SCA), claims: Object *x* is disposed to manifest M when stimulus S occurs iff if S were to occur, M would occur. Finkish, masking, and mimicking cases expose SCA's fatal flaws. A finkish fragile glass (e.g., one rigged to become rigid upon impact) possesses the disposition yet the counterfactual "if struck, it would break" is false. A masked fragile glass (e.g., wrapped in protective foam) similarly has the disposition but the counterfactual fails. A mimicking sturdy glass (e.g., rigged to shatter via hidden explosives when struck) lacks the disposition yet the counterfactual holds.

  The standard repair introduces a *ceteris paribus* clause, yielding the Qualified Conditional Analysis (QCA): *x* is disposed to M when S occurs iff if S were to occur *and no interfering factors were present (or, all enabling conditions were met, or conditions were normal)*, then M would occur. QCA plausibly handles finkish and masking cases: the fink (removing the disposition) and the mask (blocking the manifestation) are paradigmatic "interfering factors." It handles mimicking cases by excluding the mimicking mechanism (the explosives) as an "interference" relative to the glass's own properties. However, QCA faces the twin threats of **circularity** and **vacuity**. What *counts* as an "interfering factor" or an "enabling condition" seems defined precisely by what would *prevent* or *allow* the manifestation *of that very disposition*. If we cannot non-circularly specify the scope of "no interfering factors," QCA explains nothing. Worse, any failure of the simple counterfactual can be blamed *ad hoc* on some unspecified "interference" or "missing enabler," rendering the analysis unfalsifiable and vacuous.

  The alternative Causal Basis Account (CBA) proposes: *x* is disposed to M when S occurs iff *x* has some intrinsic property P such that the instantiation of P, together with S, causally brings about M. CBA seems immune to finkish and masking cases: the basis P is present even if finks remove the disposition before manifestation or masks block the causal pathway. Mimicking cases are handled as the object lacks the relevant intrinsic basis P. However, CBA faces its own circularity: how do we identify *which* intrinsic property P is "the basis" for the disposition D? It seems we identify P *as* the basis precisely *because* it grounds the counterfactual link between S and M for D. P is defined functionally by the role it plays in the disposition, making the analysis implicitly conditional and circular.

  Now, consider the test cases:

  **(A) The Inert Explosive:** The powder detonates *only* when mixed with the specific catalyst. Does it have a disposition to detonate? Intuitively, *yes*, but only *when combined with the catalyst*. QCA struggles. If the stimulus S is simply "being present," then the simple counterfactual ("if present, detonate") is false. Appealing to QCA, we might say S is "being mixed with the catalyst," and "no interfering factors" are present. But is the *absence* of the catalyst an "interfering factor" for a disposition to detonate *simpliciter*? This seems unnatural – the catalyst is an *enabling condition* intrinsic to the stimulus itself. Defining S complexly as "being mixed with the catalyst" saves the counterfactual ("if mixed with catalyst, detonate") but risks vacuity: we can always tailor S to make the conditional true by including whatever enabling conditions are necessary. If S can be arbitrarily complex ("mixed with catalyst, at temperature T, under pressure P..."), then *any* object can be assigned *any* disposition by crafting a sufficiently specific S. This makes dispositions trivial and unfalsifiable. CBA handles this better: the powder has an intrinsic chemical property P which, *when combined with the catalyst*, causes detonation. The disposition is plausibly "to detonate *when mixed with the catalyst*," and P is the basis for *that* specific disposition. The circularity concern remains (how do we know P is the basis?), but CBA avoids QCA's vacuity threat here by anchoring the disposition in an intrinsic property, preventing arbitrary S-tailoring.

  **(B) The Self-Annulling Solvent:** The substance has molecular structure P, which in *other* substances causes dissolution in water. Here, however, P rearranges into an inert structure Q *upon contact with water*, preventing dissolution. Does it have a disposition to dissolve? Intuitively, *no*. QCA seems vindicated: the simple conditional ("if in water, dissolve") is false. Adding "no interfering factors" is tricky – is P's self-annihilation an "interference"? It's intrinsic, not external. If we grant it is interference, QCA gets the right result (no disposition). But this highlights the vagueness of "interference." **CBA faces a critical dilemma.** Read at the *property-type level*: P-type is the basis for solubility. Since this substance instantiates P-type, CBA declares it soluble, *even though it never would and never could dissolve*. This is deeply counterintuitive and severs the disposition from its manifestation. Read at the *property-token level*: The specific P-instance in *this* substance causes rearrangement into Q, not dissolution. To say it has the disposition *to dissolve* requires identifying the basis as whatever causes dissolution – which it *doesn't* do. We are forced to analyze it as: "It has an intrinsic property P such that P, together with S (water contact), causes... *not-M* (non-dissolution via rearrangement)." This collapses CBA back into a disguised conditional analysis: we identify the basis P *only* by reference to what it *actually does* when S occurs, which in this case is *prevent* M. CBA cannot non-circularly identify the basis independently of the manifestation it is supposed to explain, and the type-level reading yields absurd results.

  **Verdict: Neither Reduction Succeeds; Dispositions are Sui Generis**

  Both QCA and CBA fail to provide a non-circular, non-vacuous, and extensionally adequate reduction of dispositions. QCA is ultimately vacuous: the *ceteris paribus* clause either relies on a prior understanding of the disposition (circularity) or can be stretched to cover any failure (vacuity), as seen in the threat of trivialization from arbitrarily complex stimuli in (A). CBA succumbs to circularity in identifying the basis and faces a fatal dilemma in (B): either it severs the essential link between a disposition and its manifestation (type-level reading) or collapses into a conditional analysis (token-level reading). The self-annihilation in (B) is particularly devastating for CBA, demonstrating that possessing the "right" intrinsic structure type is insufficient for the disposition if that structure's *actual causal powers* in the specific context preclude the manifestation.

  Therefore, dispositions must be recognized as a **sui generis ontological category**. To possess a disposition is to be such that, *in virtue of one's intrinsic properties*, one is *directed towards* or *liable* to manifest M under S, barring prevention. This "directedness" or "liability" is irreducible. It cannot be fully captured by subjunctive conditionals alone (due to finks, masks, mimics, and enabling conditions) nor by intrinsic properties alone (due to self-annihilation and the circularity of basis identification).

  **Strongest Objection & Reply:**

  *   **Objection:** This verdict makes dispositions mysterious, unexplanatory, and potentially indeterminate. If dispositions aren't grounded in conditionals or intrinsic bases, how do we know if something *has* one? What work do they do? Doesn't science explain solubility by molecular structure, vindicating CBA?
  *   **Reply:** The *sui generis* view does not make dispositions unknowable or indeterminate. We identify dispositions through their *actual manifestations* under test conditions (where interferences are controlled for, often based on prior causal knowledge) and through their integration within a network of causal laws and scientific models. Science explains *by attributing dispositions* (solubility, fragility, conductivity) grounded in intrinsic properties. Crucially, the grounding relation is *not* identity. Molecular structure *grounds* the disposition to dissolve; it isn't *identical* to it. The disposition is the *causal role* or *potential* conferred by the structure. In (B), structure P fails to ground the disposition *to dissolve* because its actual causal role precludes dissolution. The disposition remains determinate: the solvent lacks the disposition *to dissolve* because its intrinsic properties *do not confer the liability for that manifestation*; instead, they confer a liability for rearrangement. The explanatory work remains: attributing the disposition explains why objects with structure P *typically* dissolve (in other substances) and why *this* substance behaves anomalously (its P-token has a different causal power). The loss is the reductionist dream of analyzing dispositions away into non-dispositional terms, but not their explanatory power or determinacy.

  **What is Lost?**

  Accepting a *sui generis* category means abandoning the hope of a reductive analysis of dispositional predicates in purely non-dispositional, categorical, or conditional terms. Dispositions become fundamental features of how objects are related to possible events. However, this does not render them explanatorily idle or indeterminate. Dispositions remain crucial for scientific explanation (explaining reactivity, conductivity, fragility), causation (dispositions are often the causal powers involved), and modality (grounding potentialities). Their presence is determined by the object's intrinsic properties and the causal laws governing them, even if the link is not reductively defined. The question "Does this have the disposition?" is settled by whether its intrinsic properties, in accordance with natural laws, confer a specific liability towards a manifestation under a stimulus – a fact that can be evidenced by tests, theoretical understanding, and the absence of intrinsic blockers like self-annihilation. The mystery lies not in our epistemic access, but in the irreducibility of potentiality itself.
