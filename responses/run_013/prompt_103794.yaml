answer: |-
  Here are the eight objections you'll face, ranked by likelihood and damage potential, with replies and vulnerabilities. The most critical to answer cleanly is **Objection #1**—fumble this and experimentalists will dismiss your entire framework.

  ---

  **Q&A Prep Sheet: Sunk Costs Thesis Defense**  

  1. **"Your 'historical constitution' argument confuses identification. How do we disentangle rational history-dependent preferences from post-hoc justification of loss aversion? Show me the testable implication."** (Experimentalist)  
     *Reply (2-min):* "We test it by contexts where identity-rich goods (e.g., careers) face equivalent future costs/benefits but differ in sunk investment. Predict: agents with identical forward-looking prospects persist more when sunk costs are identity-relevant (e.g., ‘I am a scientist’ vs. ‘I own this stock’). My concession: classic money-sunk vignettes lack this identity layer—they’re pure counterfactual tests."  
     *Soft spot:* Operationalizing "identity-relevance" is subjective. Lacks a clean econometric specification.  

  2. **"If honoring sunk costs is sometimes rational, how does your model outperform standard models in predicting quitting behavior? Your ‘evidence under scarcity’ leg sounds like an unquantifiable just-so story."** (Experimentalist)  
     *Reply:* "It predicts systematic *asymmetry*. Resource-poor agents escalate commitment when information acquisition is costlier than marginal expenditure (e.g., a startup founder using personal funds to signal belief). Standard models misclassify this as bias. Test: vary information access costs and observe escalation patterns."  
     *Soft spot:* Requires field data; hard to lab-test scarcity.  

  3. **"The commitment device point is trivial game theory. Why frame it as challenging the sunk cost fallacy?"** (Game Theorist)  
     *Reply:* "Because the fallacy label *pathologizes* this behavior. My claim: when precommitment is infeasible (no external enforcer), sunk costs act as endogenous bonds. The ‘fallacy’ critique ignores dynamic inconsistency problems that make *dispositional* rationality necessary. This isn’t new—but it’s excluded from the ‘fallacy’ narrative."  
     *Soft spot:* Concedes this leg isn’t novel. Must pivot to "Why is this excluded from textbooks?"  

  4. **"Define ‘partly constituted by history’ formally. If preferences aren’t history-independent, how do we avoid arbitrary utility functions?"** (Decision Theorist)  
     *Reply:* "Utility isn’t arbitrary: it’s state-dependent. Let the state include history (e.g., *S* = ‘I have invested *X* in this vocation’). Preference for continuing *given S* differs from preference *absent S*. The fallacy assumes state-independence."  
     *Soft spot:* Risks regress (why does history enter *this* state?).  

  5. **"Your normative claim is ambiguous. Should we *teach* people to honor sunk costs? What’s welfare-maximizing?"** (Philosopher)  
     *Reply:* "Not normative—*descriptively*, the fallacy label overgeneralizes. Sometimes honoring sunk costs *is* welfare-maximizing (e.g., staying in a painful residency because quitting destroys self-conception). The normativity is in the *frame*: assuming re-planning is cost-free imposes a utilitarian ethic."  
     *Soft spot:* Sidesteps prescribing behavior.  

  6. **"The marginalists (Clark, Böhm-Bawerk) already debated this. How is your ‘historical good’ distinct from Austrian capital theory?"** (Historian)  
     *Reply (concede early):* "It’s not—but that debate was exiled from neoclassical pedagogy. I recover it to show the ‘fallacy’ isn’t a discovery of behavioral economics but a revival of early marginalism’s *contestable* framing."  
     *Soft spot:* Historian wins on pedigree. Use this to show the "settled" teaching is fragile.  

  7. **"If we accept your view, doesn’t it license *any* escalation? How do we delineate ‘rational’ from irrational sunk costs?"** (Experimentalist)  
     *Reply:* "Boundary: when the cost of acquiring better evidence exceeds the cost of persisting (leg 2), or when identity dissolution imposes unmodeled costs (leg 1). Irrational cases lack these—e.g., finishing a meal you hate because you paid for it."  
     *Soft spot:* Admits the vignettes you concede *are* fallacies—weakens scope.  

  8. **"Your evidence-under-scarcity argument assumes learning-by-spending. But isn’t that conflating *sunk costs* with *investment signals*? Rational agents separate signals from past costs."** (Decision Theorist)  
     *Reply:* "Under scarcity, separation isn’t feasible. Spending $10k *is* the cheapest way for an entrepreneur to prove belief in their venture when they can’t afford a market study. The expenditure *is* the signal precisely because it’s sunk."  
     *Soft spot:* Still looks like a signaling model—doesn’t *require* sunk costs as such.  

  ---  

  **Strategic Notes:**  
  - **Concede upfront:** Objection #6 (historical precedent). Shows erudition and disarms the historian. Say: *"The marginalists saw this tension—I’m reapplying it to modern behavioral claims."*  
  - **Must-land reply:** Objection #3 (commitment device). If the game theorist endorses your framing ("Yes, this is just precommitment"), others take note. Emphasize: *"Calling this a ‘fallacy’ obscures a core mechanism of self-regulation."*  
  - **Question you hope nobody asks:**  
    **"Operationalize ‘identity-constituted good.’ If I replicate your career-persistence experiment but prime subjects to reframe their history as ‘sunk costs,’ do they quit more? If so, isn’t your ‘constitution’ just a framing effect?"**  
    *Why it’s deadly:* Forces you to admit "identity" is malleable—undermining leg 1’s objectivity. Reply tentatively: *"Yes, but framing operates on preexisting identity structures. The fallacy frame *denies* those structures exist."* (Vulnerable: circular.)  

  **Tactical takeaway:** Your thesis survives if you force the room to see the *framing contest*—not your claims vs. evidence, but *their* unexamined frame vs. your alternative. Anchor everything to "The fallacy label assumes costless re-planning from a null history. That’s not neutral—it’s a substantive choice."
