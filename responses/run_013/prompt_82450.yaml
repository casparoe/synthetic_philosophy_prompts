prompt: |-
  Put me down as holding a moralized account of coercion: a threat voids consent only when the threat is itself wrongful — when the threatener proposes to do what he has no right to do, or uses it to extract what he has no right to demand. On this account, the severity of the pressure and the badness of the consenter's alternatives do not by themselves settle whether she consented; the wrongness of the pressure is what does. I want the case against the view laid out. Which observations and arguments should move me — a threat that is plainly wrongful yet leaves consent intact, a threat that is not wrongful yet voids consent, manipulation that voids consent with no wronging at all, the fact that people routinely consent under unjust background conditions — and which of these are decisive rather than merely awkward? What does the account predict that its purely causal or informational rivals do not? What would a defender of it concede as counting against it, rather than dismissing as a critic's talking point? And is there a circularity risk in cashing out 'wrongful' in terms that already presuppose valid consent? Take a definite position: say which defeaters you think actually bite and whether the account survives them, rather than laying out the options and leaving the verdict to me.
reasoning: |-
  Okay, let me unpack this user's request carefully. They've presented a sophisticated moralized account of coercion where consent is voided only when the threat itself is wrongful - either by proposing something the threatener has no right to do, or demanding something they have no right to extract. They're essentially asking for the strongest possible case against their own position, which shows impressive intellectual honesty.

  Hmm, the user seems philosophically trained - they're using precise terminology like "moralized account" and "voids consent," and they've structured their request with clear sub-questions about counterexamples, predictive differences, and potential circularity. This isn't someone looking for introductory material; they want rigorous engagement.

  Let me start with what seems like the deepest challenge: the potential circularity problem. If we define "wrongful threat" as contingent on the validity of consent itself, we might be going in circles. For example, is a threat wrongful because it vitiates consent, or does it vitiate consent because it's wrongful? The user would need to ground "wrongfulness" independently of consent validity to avoid this trap.

  Then there's the problem of non-wrongful threats that still seem coercive. Consider the classic "shipwrecked sailor" case - if I'm drowning and you offer rescue only if I sign an exploitative contract, your threat (to not rescue) isn't wrongful since you have no duty to save me. Yet intuitively, the sailor's consent seems invalid. The moralized account struggles here because it would deem this consent valid.

  Conversely, wrongful threats that don't coerce pose another challenge. Imagine a mugger threatens to break your car window unless you hand over your wallet. After you comply, he confesses he never intended to break it - the threat was a bluff. The wrongful proposal was made, but the consent still feels legitimate because the threat wasn't credible. This suggests wrongfulness alone isn't sufficient to void consent.

  The background injustice issue is particularly thorny. In real-world scenarios like sweatshop labor, workers "consent" under systemic oppression. The moralized account might validate this consent since no individual makes a specific wrongful threat, but that feels morally uncomfortable. This reveals how the theory might uphold consent that's structurally compromised.

  Compared to causal or informational accounts, the moralized view has distinctive predictions: it would validate consent under extreme but "fair" pressure (like accepting low wages in a competitive job market), while invalidating consent obtained through wrongful but mild threats. Whether these predictions align with moral intuition is debatable - many would argue that extreme pressure voids consent regardless of wrongfulness.

  What might a defender concede? Probably the non-wrongful coercion cases (like the shipwreck example) are the hardest to dismiss. They'd likely maintain that wrongful threats are necessary to void consent, but admit that non-wrongful pressure can sometimes undermine autonomy in other ways (making consent "non-ideal" but still valid).

  Ultimately, I think the non-wrongful coercion counterexamples are decisive. They demonstrate that consent's validity depends on the quality of alternatives available, not just the wrongfulness of the threat. This suggests we need a broader conception of coercion - one that recognizes how severe constraints on autonomy can undermine consent even without a moral wrongdoer.
answer: |-
  Your moralized account of coercion—where consent is voided *only* by wrongful threats (those proposing acts the threatener has no right to perform or demanding benefits they have no right to extract)—faces decisive objections. While elegant, it fails to capture core intuitions about coercion and consent. **The account does not survive scrutiny; the most damaging defeaters are non-wrongful threats that void consent and wrongful threats that leave consent intact.** Here’s the case against it:

  ### 1. **Decisive Defeaters: Non-Wrongful Threats That Void Consent**  
     **The Shipwrecked Sailor**:  
     You are drowning. I sail by in my private yacht and say: *"I’ll rescue you only if you sign a contract making you my indentured servant for life."*  
     - **Threat Analysis**: My threat ("I won’t rescue you") is *not wrongful*. I have no prior duty to rescue strangers. I demand something I arguably have a right to (labor in exchange for rescue).  
     - **Moralized Account Prediction**: Consent is valid—no wrongful threat was made.  
     - **Why This Is Wrong**: The sailor’s "consent" is plainly coerced and void. The *sheer severity* of the alternative (death) and the *exploitative leverage* I wield render the agreement involuntary. Your account cannot explain this because it ignores the *victim’s perspective*—the absence of acceptable alternatives.  

     **Consequence**: If non-wrongful threats can void consent, **wrongfulness is insufficient** as the sole criterion. The *structural injustice* of the situation (e.g., monopolizing a vital resource) matters independently of the threatener’s moral status.

  ### 2. **Decisive Defeaters: Wrongful Threats That Leave Consent Intact**  
     **The Hollow Threat**:  
     A desperate mugger points a gun at you and demands your wallet, shouting, *"Hand it over or I’ll shoot!"* Unbeknownst to you, the gun is a realistic toy. You hand over your wallet.  
     - **Threat Analysis**: The mugger’s proposal is *wrongful* (he has no right to threaten lethal force or demand your property).  
     - **Moralized Account Prediction**: Consent is void—a wrongful threat was made.  
     - **Why This Is Wrong**: Your consent is genuine (though regretful). You *chose* surrender over perceived death. The mugger’s immorality doesn’t negate your rational agency; it exploits it. Voiding consent here would absurdly absolve you of choices made under duress but with intact reasoning.  

     **Consequence**: Wrongfulness is **not necessary** to void consent—what matters is whether the threat *causally compelled* submission by eliminating reasonable alternatives. The moralized account conflates the *wrongness of the act* with the *invalidity of consent*.

  ### 3. **Manipulation Without Wrongfulness Voids Consent (A Strong Defeater)**  
     **The Artful Blackmailer**:  
     I discover you committed a victimless crime years ago. I threaten to expose you unless you pay me. Crucially, I *have a moral right* to expose wrongdoing (it’s not defamation) and a *legal right* to demand payment.  
     - **Moralized Account Prediction**: Consent is valid—I propose nothing wrongful.  
     - **Reality**: Your payment is coerced. Blackmail exploits vulnerability, even when "rights" are respected. The pressure arises from *non-wrongful* but *overwhelmingly consequential* leverage.  
     - **Why This Matters**: Coercion can exist in the absence of a rights violation. The core wrong is *instrumentalizing someone’s autonomy*, not trespassing on their rights.  

  ### 4. **Background Injustice: Awkward but Not Decisive**  
     Sweatshop workers "consenting" to exploitative labor under systemic poverty pose a challenge, but your account *can* reframe this: the employer’s threat ("work or starve") may not be *wrongful* if they didn’t *cause* the poverty. However, this highlights the account’s **moral complacency**—it legitimizes consent extracted under horrific, unchosen conditions if no *specific agent* wrongfully imposed them. Yet this is more a *distasteful implication* than a logical flaw; the shipwreck case is a sharper counterexample.

  ### 5. **Circularity Risk (A Serious Flaw)**  
     To define "wrongful threat," you might say:  
     *"A threat is wrongful if it demands something to which the threatener has no right."*  
     But rights often depend on valid consent! Example:  
     - *"Do X or I’ll sue you!"* → Is this wrongful? Only if the lawsuit is frivolous—but that hinges on whether you *consented* to the original contract.  
     **Result**: Consent validity determines wrongfulness, which determines consent validity → **vicious circle**.  

     To escape circularity, "wrongfulness" must be grounded *independently of consent* (e.g., in harm, autonomy, or prior duties). But this opens new problems: if "wrongful" means "harmful," then non-harmful threats could still coerce (e.g., "Convert to my religion or I’ll end our friendship").

  ---

  ### **How Rival Accounts Fare**  
  - **Causal Accounts**: Focus on whether the threat *caused* consent by eliminating acceptable alternatives (e.g., Nozick). They easily explain the shipwreck case but struggle with wrongful bluffs.  
  - **Informational Accounts**: Stress manipulation of beliefs (e.g., lying about consequences). They handle bluffs but not non-deceptive threats like the shipwreck.  
  - **Hybrid Views** (e.g., Wertheimer): Combine wrongfulness *and* baseline fairness. These avoid your account’s pitfalls but lose its simplicity.

  ---

  ### **Conclusion: The Account Fails**  
  **Non-wrongful coercion (like the shipwreck) is the death knell**. Consent requires *meaningful choice*, which can be absent even when no one acts wrongfully. Conversely, **wrongful threats (like the toy gun mugging) can leave consent valid** if the victim retains agency. The moralized account’s inability to capture these cases shows it is **overly narrow and agent-centered**, neglecting the victim’s experiential reality. A successful theory must acknowledge that consent is vitiated by *inescapable pressure*—whether wrongful or not—and that wrongfulness alone cannot do the necessary work. **Abandon the view; its defeaters are fatal.**
