  I am currently enrolled in a philosophy of mind course and am writing a final paper on the timing of conscious experience. I would like to read the film Memento through the lens of the color phi phenomenon and the Orwellian versus Stalinesque distinction. Please act as an expert in philosophy of mind and cognitive science, and think carefully before you begin. Start by brainstorming the relevant philosophical terrain: what the color phi phenomenon is supposed to reveal about whether perceptual experience is constructed retrospectively, and what exactly hangs on whether a revision counts as Orwellian, where the experience itself is rewritten, or Stalinesque, where the experience is intact but memory or report is falsified. Then offer a sustained reading of the film. Does Leonard's condition, together with his notes, tattoos, and Polaroids, model one of these options more faithfully than the other, or does the film deliberately blur them? Does the backward narrative structure make the viewer undergo something like an Orwellian revision while Leonard himself is stuck in a Stalinesque predicament, or is that too neat? Where does the film genuinely illuminate the idea that experience might be edited after the fact, and where does it trade on a confusion between memory loss, deception, and perceptual postdiction? Please be faithful both to the film and to the philosophical debate, and end by saying what Memento adds to the debate that the laboratory phenomenon cannot.
