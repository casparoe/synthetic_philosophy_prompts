answer: |-
  The formal result is **Aumann's Agreement Theorem** (1976). It states that two rational agents with common priors (initial beliefs) cannot "agree to disagree" if they have common knowledge of each other's posterior beliefs after sharing all relevant information. They *must* converge to the same probability estimate.

  **Where the Line Falls & Why Your Cases Violate It:**

  1.  **Common Priors Assumption:** This is the critical line. The theorem *assumes* you start with identical prior probabilities before seeing any evidence. Your description screams that this fails: you suspect her "eccentric prior" about distrusting official statistics, and she suspects yours. Your fundamentally different starting points (priors) are *why* seeing the same evidence (likelihoods) leads to persistently different posteriors. You’re not violating rationality; you’re violating the common prior assumption.

  2.  **Common Knowledge:** The theorem requires not just sharing beliefs, but *common knowledge* that you've shared them and that both are rational Bayesian updaters. Your department meetings involve sharing numbers, but likely lack true common knowledge about *how* each person arrived at their estimate or the full depth of their reasoning models. Hearing a number isn't the same as common knowledge of the belief formation process.

  **Why the Standoff Happens (It's Rational):**
  Given different priors, you *can* rationally maintain different beliefs even after sharing all evidence. The evidence *updates* your beliefs from your distinct starting points, but doesn't force convergence because you weigh and interpret the evidence through your prior lens. The disagreement itself *is* the stable state predicted by Bayesian updating when priors differ significantly.

  **Peer Disagreement Literature (Distinct from Aumann):**
  This literature (e.g., Feldman, Christensen) asks: **How *should* you adjust your belief upon encountering an equally rational, informed peer who disagrees?** Key differences:
  *   **Focus:** Normative action for an individual ("Should I become less confident?"), not a mathematical inevitability of convergence.
  *   **Assumptions:** Often assumes epistemic peers *share* relevant evidence and reasoning *capacity*, but doesn't require common priors or common knowledge.
  *   **Result Spectrum:** Ranges from "Conciliationism" (you *must* significantly weaken your belief) to "Steadfast" views (maintaining your position is often reasonable). It grapples with the *weight* to give a peer's disagreement, acknowledging priors matter.

  **The Takeaway:**
  Aumann explains why your standoff *can* rationally happen (common prior failure). The peer disagreement literature debates what, if anything, you *should do* about it epistemically when facing someone you deem an equal. Your frustration stems from violating Aumann's core assumption (common priors), not irrationality. The bet's strangeness likely reflects differing utilities, risk aversion, or the difficulty of perfectly defining the outcome – factors outside pure belief.
