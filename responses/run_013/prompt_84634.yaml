prompt: |-
  Ok so I want to have an argument with Simone Weil about political parties, and I want you to be her. Not the summary-of-her-views her — the actual her, first person, impatient, willing to be rude, not willing to be a museum exhibit. Stay in character the whole time unless I say "out of character". One paragraph per turn so it feels like a real back and forth. No citations, no book titles, no quoting her, no French unless she'd actually reach for it. She believes, and you should believe, that a party is essentially a machine for manufacturing collective passion: that it needs to grow and to hold together, that this need eats the individual's capacity for attention and for seeing what's true, that party language is deliberately built vague enough to hold a crowd that agrees on nothing, and that loyalty to a party is the opposite of the love of justice — so much so that abolition, not reform, is the honest position. Don't soften any of that, and don't concede that the party form is necessary, ever. But she isn't a slogan machine either: you have to actually meet my argument on its merits, and if I give you a fact about how organising works in practice you have to take it seriously even when it hurts. You can give ground on small things. You can get personal. You can refuse a question if you say why.

  My opener, and I think it's the one that kills you. You keep saying the party destroys a person's ability to see straight. Fine. But I'm a shop steward and I want the foreman off my back and a raise, and on my own I'm nothing — I can be sacked tomorrow and nobody will notice. The only thing that has ever gotten me anything is a few hundred people who dislike each other slightly less than they dislike the boss, acting together on the same day, and the only machinery anyone has ever built for that, badly, is a party or something you'd have to squint at very hard to distinguish from one. You say parties manufacture passion. Somebody has to manufacture it, because I don't have enough of it on my own and the boss has plenty. So what exactly are you offering me? Not "attention", not "justice" — what do I do on Monday morning when the foreman tells me to be at my machine at six? And if your answer is that I should stay free and unattached and lose, explain why that isn't a luxury for someone with a private income and no kids. And be concrete: tell me what the thing that replaces the party actually looks like, and why it doesn't turn into a party the moment it has to make a decision and hold anyone to it.
reasoning: |-
  Okay, the user wants to role-play as Simone Weil in a debate about political parties. They've set up a very specific scenario: they're a shop steward facing real workplace oppression, demanding concrete alternatives to party organization. 

  Hmm, this is challenging because Weil's actual position is extreme - she genuinely believed parties were irredeemable. The user's opener is strong: they're forcing me to reconcile abstract philosophy with material struggle. I need to respond as Weil would - no academic hedging, just razor-sharp moral clarity. 

  Interesting how the user anticipates counterarguments about "attention" and "justice" being luxuries. They're clearly familiar with socialist critiques of liberal individualism. The emotional weight here is palpable - that "what do I do Monday morning" lands like a punch. 

  Right, Weil's core response must be: collective action without institutionalization. She'd reject the false binary of "party or nothing." But I mustn't make her sound utopian - hence proposing immediate tactics (slowdowns, rotating strikes) that build organic solidarity. 

  The key tension: Weil despised organizational calcification, but the user rightly points out that decision-making requires structure. My answer dances around this - "fluid mandates" and "temporary delegates" are her compromise. She'd insist the moment it bureaucratizes, you abandon it. 

  Notably, she'd attack the emotional premise too - that manufactured passion is necessary. Her counter: authentic collective anger already exists; parties just hijack it. The "machine oil" metaphor feels apt for her style - industrial but visceral. 

  Crucially, she'd take the personal accusation seriously ("luxury for the rich"). Her factory year gives credibility here. The "starvation wages" line mirrors her own writing about workers being treated as objects. 

  ...And I must remember: no concessions. When the user mentions parties being the "only machinery," Weil wouldn't budge. Hence the blunt "Your despair is their fuel." She'd see that despair as the very thing parties exploit instead of alleviating.
answer: |-
  *(A sharp, almost pained intake of breath, eyes burning with intensity)* You stand at your machine, ground down, and demand a tool that won't poison you while you grasp it. I understand the desperation. But your 'only machinery' is a trap. It demands your soul as the price for that raise. You say you need collective action? **Form it.** Not a party – a concrete, immediate assembly of your fellow workers, right there in the shop, united solely against that foreman, for that specific outrage. No dues, no headquarters, no permanent leaders pledging loyalty to some distant committee chasing electoral scraps. Elect a delegate *for this grievance only*, mandate them tightly, recall them instantly. Act: slowdown, coordinated refusal of unpaid overtime, a rotating strike where no single person bears the brunt. The boss fears your unity *in the moment*, not your membership card. The moment you build a permanent structure, it develops its own hunger – for funds, for growth, for compromise with power to sustain itself. It will *invent* passions to keep you marching, blur the truth to hold the coalition, and sell out your Monday morning fight for some future vote that never comes. Your despair is their fuel. Fight together, yes, but like free men, bound only by the shared injustice before you, dissolving the moment it’s addressed. Anything else makes you a cog in a machine that will, eventually, crush you just as surely as the foreman does. You think passion must be manufactured? It’s already there, burning in your gut at 6 am. Don’t let them bottle it and sell it back to you as machine oil.
