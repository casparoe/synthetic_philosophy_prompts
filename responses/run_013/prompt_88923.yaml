answer: |-
  The humming never stopped in Level 3. Not the sterile whine of the laminar flow hoods, nor the deeper thrum of the cryo-storage units holding their precious, dissolved cargo. To Lena, it was the sound of endings quantified. The Neural Indexing Bureau, a sprawling, windowless complex buried under layers of bureaucracy and reinforced concrete, was where minds went to be weighed. Posthumously.

  Lena’s gloved hands moved with practiced economy inside her hood. Tweezers lifted a thin, translucent slice of neural tissue – *Panthera tigris altaica*, Amur tiger – from the fixing bath onto a glass slide. The tissue was a ghostly map, fixed, stained, ready for the automated counters to tally its ghosts. Each slide represented an end, a life extinguished to assign a number that dictated the survival chances of its kin. The higher the count, the stricter the protection quotas, the less likely a species would be cleared for habitat reduction, controlled culling, or resource exploitation. The lower the count… well, the calculus of conservation shifted.

  The system’s brutal irony was its foundation: the only way to know the true neural complexity, the *potential* for inner life, was to destroy the vessel and dissolve the brain. Volumetric estimates – the old way – were deemed unreliable. Size didn't always equate to processing power. The Great Neural Reshuffling, as it was grimly called, had been seismic. Octopuses, long admired but legally insignificant, had skyrocketed up the index, their densely packed neurons demanding new levels of protection that crippled certain fisheries. Pigs, factory-farmed by the billions, had scored shockingly high, triggering massive, expensive welfare overhauls and meat price spikes. Conversely, some primates, assumed near-persons, had proven surprisingly neuron-light in crucial forebrain areas, leading to agonizing debates about captive breeding programs and land reclamation.

  Lena focused on the tiger slide, losing herself in the intricate, alien landscape under the hood’s magnification. It was easier than thinking about the email notification that had flashed on her terminal an hour ago.

  **Specimen Received: Canis lupus familiaris. ID: Finch-7. Priority: High. Requester: Dept. of Domestic Fauna Oversight (DFO). Processing Assigned: Lena Chen.**

  Finch. Her Finch. Or at least, what remained of him.

  He hadn’t been *hers*, not officially. The Bureau forbade personal attachments to potential future specimens. But Finch belonged to Mr. Henderson in Sector G, an elderly man whose deteriorating memory meant Lena often walked the energetic border collie. Finch wasn’t just a dog. He was cleverness incarnate. He knew seventeen names for his toys, could open the latch on Henderson’s garden gate (a skill Lena had to secretly undo), and his eyes held a startling depth of understanding, a silent commentary on the world. He’d nuzzle her hand when she was stressed after a long shift dissecting dolphin brains. He’d tilt his head, listening intently, as if parsing the meaning behind her weary sighs.

  Three days ago, a delivery drone malfunction. A heavy package dropped onto a crowded sidewalk. Finch, pulling Henderson, had lunged, shoving the old man clear. The package crushed Finch instantly. A hero, they called him. A tragedy. And then, inevitably, the DFO directive. Finch’s death wasn’t just a loss; it was an *opportunity*. Border collies, as a breed, occupied a precarious middle tier. Their current index, based on old volumetric averages, granted them basic companion animal protections but left them vulnerable to proposed DFO efficiency measures – mandatory sterilization for non-working dogs, stricter confinement regulations. A direct count could shift them up… or down. Finch, exceptional by any observable measure, was now the key to his entire breed’s legal standing. His brain was the ballot.

  "Chen. Status on the *Panthera* batch?" Dr. Aris Thorne’s voice cut through the hum. He stood just outside her hood’s sterile field, a tall, angular man whose sharp features mirrored the clinical precision he demanded. Thorne ran Level 3. To him, the index wasn't a measurement; it was revelation.

  "Final slices prepped for Counter 4, sir," Lena replied, her voice steady despite the turmoil inside. "Calibration complete. Should have the full suite for *Panthera altaica* by end of shift."

  "Good. Ensure the QA checks are meticulous. The Tiger Preservation Alliance is already lobbying hard based on preliminary data suggesting their count might be lower than volumetric projections. Every neuron matters." Thorne’s gaze swept the lab, lingering on the sealed bio-container stamped ‘DFO URGENT’ resting on Lena’s secondary station. "I see Finch arrived. High priority. The DFO Commissioner is personally invested. Get it processed first thing tomorrow. Clean protocol, Chen. Utmost care. This count could set precedent."

  "Sir," Lena began, a flicker of rebellion she instantly regretted, "Finch was… exceptional. Observably. His behavioral repertoire…"

  "Observations are subjective noise, Chen," Thorne interrupted, his tone dismissive. "Anecdote. Sentiment. The index cuts through that. It gives us the *fact* of the mind. The raw computational capacity. That number, right there," he pointed at the unseen brain in the container, "that is the *value* of that life, quantified. What we *felt* about the animal is irrelevant. The index reveals the objective moral truth." He adjusted his lab coat. "Process it. Report the number. That’s our purpose. The arithmetic of existence." He walked away, leaving the scent of antiseptic and absolute conviction.

  Lena stared at the container. *The arithmetic of existence.* Thorne saw the number as the endpoint, the divine verdict. Lena saw it as a bloodstained clue, a proxy for something far messier and less quantifiable: the capacity for joy, for pain, for frustration, for love – valenced experience. But how well did the neuron count *correlate*? Brilliant Finch might have a dense forebrain… or maybe his genius was wiring, not raw processing power. They wouldn’t know until they dissolved him. And once they had the number, Thorne and the Bureau would treat it as gospel.

  *"It’s just evidence, Lena. Flawed evidence gathered in the worst possible way."*

  The voice in her memory belonged to Eli, her friend in the Bioethics Liaison Office, two floors up. He was the counterpoint to Thorne. Over lukewarm coffee in the bleak cafeteria, Eli railed against the index’s false objectivity. "A neuron count tells us *potential* processing power, maybe. But how that power is used? The *quality* of the experience? The depth of suffering or happiness? We have no direct measure. We assume correlation. But is it linear? Logarithmic? Does a billion neurons feel ten times more pain than a hundred million? Or just differently? The index pretends it knows, but it just gives politicians a number to hide behind when they make brutal choices."

  Lena remembered Eli’s bitterness when the revised index for common sparrows came in lower than expected. The logarithmic scaling model favored by industrial agricultural lobbies was suddenly applied. Sparrow protections were slashed. Billions more could be "managed" (a euphemism for poisoned) annually to protect crops. A small dip in the index, amplified by the scaling choice, meant a death sentence on an unimaginable scale. *The arithmetic of existence.*

  Finch’s count would be plugged into the same ruthless equations. Border collies were numerous. If their index jumped significantly under linear scaling, the DFO’s proposed restrictions might be blocked, even reversed. But if a logarithmic model was applied, even a moderately high count might not save them from the efficiency measures – too many dogs, not enough "moral weight" per individual to justify the resources. The scaling choice wasn't scientific; it was political, economic. And Finch’s number, extracted from his ruined skull, would be the linchpin.

  The next morning, the humming felt louder, accusatory. Lena suited up with extra care, the Tyvek rustling like a shroud. The bio-container hissed as she broke the seal. Inside, nested in coolant packs, was a smaller, sterile vessel. Finch’s brain. Preserved. Waiting for dissolution.

  Her hands trembled slightly as she transferred the organ to the dissection tray under the hood. It was smaller than she expected. So much brilliance, so much life, contained in this unassuming lump of tissue. She forced herself into technician-mode: measure, photograph, weigh. Standardized slices. The microtome blade hissed, shaving off sections thinner than paper. Finch became slides. Finch became data points waiting to be scanned.

  The process took hours. Slices moved through fixing baths, staining solutions, mounting. Each step felt like a further desecration, a reduction. She remembered Finch herding Henderson’s grandchildren with gentle nudges, his intense focus during their training sessions, the warm weight of his head on her knee. Was any of that *in* these stained fragments? Or was Thorne right? Was the only truth in the count the machines would soon deliver?

  As she loaded the final slides into the automated counter array – banks of scanners that mapped and tallied individual neurons with cold, unblinking precision – Eli slipped into the lab. He leaned against a distant counter, respecting the sterile boundary but close enough to see her face.

  "Finch?" he asked softly.

  Lena nodded, unable to speak past the lump in her throat. The counters whirred to life, lasers scanning the slides, pixel by pixel, neuron by neuron.

  "It’s barbaric," Eli murmured, watching the machines work. "We kill the individual to assign a crude number to the species, ignoring all the variation *within* the species. Finch was smarter, more aware, than any other dog I've met. What if his count is high? Does that mean every bored poodle in a penthouse gets elevated rights based on Finch’s brilliance? Or what if it’s average? Does that negate what he *was*? The system refuses to see the individual. It only sees the aggregate, the average. It’s convenient. Cheap."

  "The DFO needs the number," Lena said, her voice hollow. "For the breed quota review next week. Finch is the sample."

  "And the scaling model?" Eli pressed. "Heard the Commissioner favors logarithmic. Keeps the regulations ‘practical’ for popular breeds."

  Lena closed her eyes. Logarithmic. Meaning Finch’s sacrifice, his exceptional life, might not move the needle enough. His species could still be diminished, controlled, sterilized, because the math said their *average* individual experience wasn't "weighty" enough to justify the cost. Finch’s heroism wouldn't save his kind if the logarithmic curve was steep enough.

  The counter array pinged. A single, soft chime. Processing complete.

  Lena’s terminal screen flashed. **Specimen: Finch-7 | Neural Index Calculation: Complete.** Below it, a single number glowed, stark against the white background. It was high. Very high. Higher than the current volumetric estimate for border collies by a significant margin. Higher than many primates on the protected list. Lena gasped. Finch *had* been exceptional, quantifiably so.

  Relief, fierce and sudden, washed over her. This number, under linear scaling, could force the DFO to not only abandon its restrictions but potentially grant border collies enhanced protections. Finch’s death would mean something.

  But Eli was staring at the number, his face grim. "That's… remarkable. For a dog." He paused. "Lena, what about Mr. Henderson’s old Labrador, Buster? Remember him? Sweet, dumb as a post. Loved everyone, understood nothing much. His index, if taken, would be much lower. Probably below the current collie average. Under *this*," he tapped the screen where Finch’s number shone, "Buster’s life, legally, becomes less valuable than Finch’s? Does Finch’s genius mean Buster deserves less protection? Less consideration? Where’s the threshold? Does one brilliant dog elevate the whole species, or does it just highlight the inadequacy of the system for judging individuals?"

  Lena’s relief curdled. Eli was pressing on the unspoken flaw, the question the Index architects had deliberately dodged: within-species variation. The system treated all border collies as neurologically identical for legal purposes, defined by the average derived from samples like Finch. But Finch wasn't average. Buster wasn't average. Recognizing individuality would shatter the bureaucratic simplicity. It would mean acknowledging that every brain, every mind, might be unique, requiring assessment… which circled back to the impossible: you couldn't measure the index without destroying the mind. The system was built on a paradox it couldn't solve.

  Before she could formulate a response, Thorne strode over, drawn by the completed notification. He peered at the screen, a slow smile spreading across his face.

  "Outstanding, Chen! 1.87 billion! Confirms the observational anecdotes, wouldn't you say?" He clapped her on the shoulder, a rare gesture. "This is a definitive result. Proof positive of the collie's elevated cognitive status. The DFO’s efficiency proposals are dead in the water. This number…" he savored it, "…this number is the truth. Clear. Unambiguous. Finch’s mind has spoken."

  He turned to Eli. "Bioethics can draft the impact assessment. Focus on the linear scaling implications. This demands a significant quota revision upward."

  Eli’s jaw tightened. "Doctor Thorne, respectfully, this is *one* data point. An exceptional individual. Applying this linearly across the entire breed population, ignoring natural variation…"

  "Variation is noise, Mr. Vance," Thorne cut him off, his earlier warmth replaced by icy authority. "The index gives us the central tendency, the essential fact of the species' neural capacity. Finch’s number *is* the border collie’s moral weight, now accurately measured. We deal in aggregates. That’s how policy functions. That’s how *morality* scales." He turned back to Lena. "Prepare the final certification package, Chen. Highest priority. The Commissioner is expecting it." He walked away, already radiating the triumph of a settled fact.

  Lena stared at the number: 1,870,000,000. Finch’s brilliance, quantified. A victory for his kind, bought with his dissolution. Thorne saw divine truth. Eli saw a problematic data point in a flawed system. She saw Finch’s knowing eyes.

  She began assembling the report, her fingers moving automatically. The number dominated the page. As she worked, a notification popped up on the Bureau intranet – an all-staff advisory about an upcoming Inter-Species Resource Allocation Committee (ISRAC) hearing. The topic: "Scaling Model Review for Mid-Range Index Species (10^8 - 10^9 neurons)." The listed stakeholders included agricultural conglomerates, pet industry lobbies, and conservation groups. The fate of countless creatures – sparrows, rabbits, certain fish, and now, perhaps definitively, domestic dogs like border collies – hinged on whether a logarithmic or linear curve would be applied to translate their neural indexes into moral weight and, consequently, resource rights.

  Finch’s number would be Exhibit A.

  Lena finished the certification package. It felt heavy, final. She walked to the secure outbox, the humming of the lab a constant backdrop. She paused, looking down at the sealed envelope containing Finch’s quantified mind, his sacrifice, and the future of his breed. It wasn't just a report; it was a weapon, or a shield, depending on who wielded it and what arithmetic they favored.

  She slid the package into the outbox slot. It vanished with a soft *whirr*, on its way to shape the world. Lena stood there, in the antiseptic glow, surrounded by the hum of machines counting the dead. Her hands hung empty at her sides. In her mind, Finch tilted his head, waiting for an answer she didn't have. The number glowed in the silence, a monument and a question mark, leaving only the hum, the endless hum, of endings measured.
