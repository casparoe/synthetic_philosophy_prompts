  For the session flow, I'm considering starting with their existing "control=productivity" view to meet them where they are. The archer example is perfect but needs careful handling - I'll emphasize how ancient Stoics would see the shot landing as truly indifferent, not just "internalizing goals." The dependency chain must build logically: first establish the limited sphere of "up to us," then show why only that can be good/bad (because indifferent things aren't controllable), then reveal how virtue becomes the only good that fulfills this definition. Fate comes last as the capstone.

