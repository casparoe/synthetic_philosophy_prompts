answer: |-
  Here's a five-stage plan designed for maximum conceptual shift within 90 minutes, targeting the core misunderstandings and building dependency:

  1.  **Surface & Validate Their Current Model ("Control = Causal Influence"):** Start by asking them to define the dichotomy of control using examples they likely know (e.g., traffic jam, job interview, project outcome), explicitly drawing out their view that "control" means direct causal influence over events or outcomes; validate this as a common starting point. *(Confidence: 95% - This is the dominant modern framing.)*
  2.  **Introduce & Drill the Ancient "Up To Us" (Prohairesis):** Using Epictetus's opening of the *Enchiridion* ("Some things are up to us..."), define "up to us" strictly as *only* our judgments, choices, desires, and aversions (our rational faculty's use of impressions); contrast this sharply with "not up to us" - body, property, reputation, *actions of others*, **even our own bodily actions and external results**. Use the **Archer** as the core example: emphasize that while aiming/releasing *is* "up to us" (a chosen action), the arrow hitting the target *is absolutely not* "up to us" and the Stoic archer judges its success/failure as *indifferent*. Crucially, **avoid** framing the archer's goal as "internalized effort" (trichotomy) – the external goal is *wholly* indifferent. *(Heads off misconception: "Control = Causal Influence". Dependency: Must establish this narrow scope first. Confidence: 90% - Distinguishing internal choice from external action/results is key.)*
  3.  **Challenge the Value Assumption (Why Only "Up To Us" Matters?):** Pose the critical question: "If *only* judgments/choices are truly 'up to us,' why should *everything else* (health, wealth, success, relationships) be considered indifferent?" Force them to confront that their modern model implicitly values these externals *as goods/bads*. Reveal the dependency: the dichotomy *only works* if we accept the radical Stoic claim that the *only* good is the excellent use of the prohairesis (virtue), and the *only* bad is its poor use (vice), precisely *because* only these are "up to us". *(Heads off misconception: "Externals have inherent value". Dependency: The dichotomy's meaning hinges on this ethical claim.)*
  4.  **Introduce Fate/Providence as the Rationale for Indifference:** Briefly explain that externals are indifferent *because* they are governed by fate/Logos (the causal web); since we don't control the causal chain (only our assent/impulse *within* it), attaching our good/bad to outcomes we *can't* control is irrational and leads to distress. The archer accepts the miss as fated/indifferent, focusing only on virtuous effort. *(Dependency: Requires understanding that externals aren't "up to us" AND the value claim. Least Confident Point: Introducing fate effectively without derailing into determinism debate in limited time.)*
  5.  **Diagnostic Question & Deepening:** End by asking: **"If a Stoic Sage gets seriously ill through no fault of their own, why can't their illness be considered a true 'bad' according to the *ancient* dichotomy, even if it causes suffering?"** Listen for answers that explicitly reference: (a) illness is external/not "up to us", (b) only the Sage's *judgment* of/reaction *to* the illness is "up to us" and thus the locus of good/bad, (c) virtue (wise judgment/acceptance) remains possible/undiminished, (d) illness itself is indifferent. *(Checks for understanding the core distinction: judgments vs. externals, and the value claim.)*

  **Key Example (Archer) Requirements & Contrast:**
  *   **Needs:** Must clearly separate the internal acts of will (aiming effort, choosing to release) from the external result (hit/miss). Must emphasize the *Stoic archer's genuine indifference* to the hit/miss *as a good/bad*.
  *   **Lacks:** Any implication that "internalizing the goal" (e.g., "My goal is just to shoot well") makes the *external* goal controllable or good. The trichotomy *does* blur this by making effort the "internalized goal," implicitly valuing the *effort* over the result, whereas the ancient dichotomy values *virtue* (excellence of the will/judgment *itself*), making even the "effort" as an external action/result ultimately indifferent. **You're right: the trichotomy serves a different (modern) purpose.**
