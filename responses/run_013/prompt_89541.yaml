  I need to create a poem that performs this distinction rather than just describing it. The key requirements are:
  - A refrain that's strictly true but changes implication with each repetition
  - At least four repetitions of this refrain
  - One flat lie near the end that's intentionally false
  - About twenty lines with no fixed meter
  - In a spokesperson's voice without sneering at them
  - Faithful to concepts like the assertion/conveyance gap, paltering, presupposition, and harder cases like true statements meant to be disbelieved

  The user wants a poem that embodies the deception it discusses, making the reader experience how context shifts meaning. The refrain should be a single true sentence that becomes misleading through repetition in different contexts. I need to craft this carefully to demonstrate how hearers become "co-authors" of deception.

  For the formal elements, I'm considering a refrain like "I have never lied to you" - which is technically true if the speaker only misleads without outright lying. Each repetition would follow a statement that implies something false, making the refrain carry different deceptive meanings.

  I'll structure it with:
  1) First refrain establishing the pattern
  2) Second with presupposition (smuggling in false ideas)
  3) Third with omission (true but incomplete)
  4) Fourth with paltering (using truth to mislead)
  Then the flat lie: "This is the whole truth" - which violates the speaker's usual pattern

  For the philosophical note, I need to clarify:
  - Settled: lying requires false assertion; misleading does not
  - Contested: whether misleading is as bad as lying, whether intent matters equally, if exploiting trust makes it worse
  - I'll note liberties like oversimplifying "harder cases" and presenting paltering as a unified concept

  I'll use British English throughout as requested. The tone should be professional yet poetic, letting the spokesperson's voice reveal the mechanics of deception without judgment. The poem will show rather than tell how truth can mislead.
