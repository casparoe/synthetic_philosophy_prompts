  ## At the Close of Panel: On Clean Hands
  (A Spokesperson’s Statement)

  The data shows a measured, slight decline.
  We acted swiftly when the facts were known.
  **I have never lied to you.** The line
  Was drawn precisely where the risks were shown.

  Significant investment starts next year.
  The focus remains firmly on the goal.
  **I have never lied to you.** The clear
  Commitment safeguards every valued role.

  Regrettably, some claims lack evidence.
  We cannot speak to motives, only deeds.
  **I have never lied to you.** Defence
  Relies on context, meeting stated needs.

  The process followed guidelines to the mark.
  Independent oversight was sought.
  **I have never lied to you.** The dark
  Suggestions cloud the progress we have wrought.

  You ask if trust remains? Recall my words.
  They stand, examined, flawless and precise.
  **I have never lied to you.** Absurd
  To think we'd falter, pay that bitter price.

  We value openness above all things.
  **This is the whole truth.** Now, if you’ll excuse...

  ---

  **Note on Liberties and Philosophical Context:**

  The poem takes liberties by compressing complex "harder cases" (e.g., true statements hoping for disbelief, indifference to truth) into the spokesperson's general technique, and presents "paltering" broadly, whereas it technically involves *active* use of truths to mislead. The refrain exploits presupposition and omission contextually, not always via specific linguistic triggers.

  **Settled Distinctions:**
  *   **Lying:** Requires asserting something one believes to be false.
  *   **Misleading:** Involves conveying a falsehood *without* asserting it (e.g., via implication, presupposition, omission, paltering). Truthfulness of the *words uttered* is preserved.
  *   **The Lie in the Poem:** "This is the whole truth." Assuming the speaker knows it *isn't* the whole truth and asserts it anyway, this is a lie by definition.

  **Genuinely Contested Areas:**
  *   **Comparative Wrongness:** Is an *intentional* misleading using true statements as morally bad as, worse than, or better than an outright lie? Views differ sharply. Some argue misleading exploits trust more insidiously, leaving the victim no recourse. Others see the deliberate assertion of falsehood (lying) as inherently worse.
  *   **Intentionality & Responsibility:** How crucial is the *intention to deceive* in defining the moral wrong? Is a speaker indifferent to truth (neither lying nor intending to mislead, but foreseeing misunderstanding) culpable?
  *   **Scope of "Lying":** Should deliberately implying a falsehood (e.g., via strong conversational implicature) be *classified* as lying, even if no false assertion is made? This remains debated. The consensus rejects this broad definition, reserving "lie" for false assertion.
