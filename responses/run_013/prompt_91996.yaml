  Bernard Williams' perspective on authenticity in opera is crucial here. He distinguishes between historical authenticity (doing it exactly as originally performed) and authenticity to the work's essence. Williams argues that opera's conventions are constitutive—they define what opera is. So moving a Mozart opera to a 1970s housing project might violate the work's internal coherence if the music and libretto clash with the new setting. However, he might be more open to changes that maintain this coherence.

