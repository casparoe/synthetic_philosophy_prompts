answer: |-
  Your observation reveals a core tension in opera's ontology—the nature of the "work" itself—and its relationship to convention and meaning. Here's a reconstruction of the philosophical commitments implied by this pattern of tolerance and intolerance, drawing on Bernard Williams' insights:

  ### Core Presuppositions of the Practice:
  1.  **Opera as "Drama-through-Music":** The practice presupposes that opera is fundamentally a *dramatic* art form, but one where the drama is constituted *by* and inseparable *from* its musical realization. Music isn't merely an ornament or vehicle for pre-existing drama; it *is* the primary medium through which the dramatic action, character, and emotion are expressed and experienced. This explains tolerance for singing instead of speaking (the music *is* the speech) and the orchestra's dramatic invisibility (its sound is the environment/emotion itself). The drama cannot be extracted without the specific music.
  2.  **Constitutive Conventions vs. Contingent Staging:** It assumes a distinction between:
      *   **Internal/Constitutive Conventions:** Elements necessary for opera *as opera* to function dramatically via music. These include: singing *as* communication/expression (justifying the tubercular aria), the suspension of "real time" during arias/ensembles (allowing emotional exploration), the orchestra's non-diegetic role, and the primacy of vocal casting for musical-dramatic effect (accepting age-inappropriate singers if they vocally embody the character). These are "baked in."
      *   **External/Contingent Conventions:** Elements tied to the original historical context or staging practices. These include: specific period costumes/sets, literal stage directions (within reason), and potentially some textual details if not core to the musical-dramatic structure. These *can* be changed without fundamentally altering the "work."
  3.  **The "Work" as Music-Drama Composite:** The practice treats the operatic work as a specific, historically located fusion of *this* music (score) with *this* dramatic structure (libretto), creating an integral music-dramatic object. It's not *just* the score, nor *just* the libretto, nor a pure Platonic form. Changing the libretto's words or cutting a da capo (if essential to the musical form, like "Deh vieni") is seen as altering the work itself, not just its presentation. The historical location isn't necessarily binding for staging, but it *is* baked into the meaning generated by the music-libretto fusion.
  4.  **Authenticity to the Work's Internal World:** Tolerance ends when a production disrupts the perceived *internal coherence* of the music-drama composite. Setting Mozart in a 1970s housing project is offensive not (only) because it's different, but because the audience perceives a *rupture* between Mozart's musical language/style and the projected setting, or between the characters' motivations expressed through that music and the new context. It feels *inauthentic* to the work's own logic and emotional world.

  ### Where Practice is Underdetermined / Compatible with Multiple Theories:
  1.  **The Source of Coherence:** The practice is compatible with different views on *why* the music-drama coherence matters:
      *   **Composer's Intent:** (A traditional view) The coherence is what the composer intended/dramatized.
      *   **Formal Unity:** (A more structural view) The coherence is inherent in the musical and dramatic structures created by the score+libretto.
      *   **Conventional Understanding:** (A historicist view) The coherence is established by the tradition of performance and reception.
      *   **Williams' "Dramatic Truth":** The coherence is essential for the work to achieve its specific dramatic effect and emotional power.
  2.  **The Scope of "Constitutive":** The *exact* line between "constitutive" and "contingent" is fuzzy and contested. Is "casting across race" contingent (if vocally perfect) or constitutive (if race is perceived as essential to the drama, e.g., Otello)? Practice shows inconsistency here, compatible with different weightings of vocalism vs. visual/dramatic verisimilitude.
  3.  **The Primacy Question:** While presupposing music-drama inseparability, practice doesn't definitively answer whether music ultimately serves drama or drama serves music. Both views can justify outrage at incoherence: "The music is being forced to serve an alien drama" vs. "The drama is being distorted to fit the music."

  ### Bernard Williams' View and the Pattern:
  Williams argued against naive historicism ("authenticity" as pure reconstruction) and for "authenticity to the work." He saw opera's conventions (singing, orchestra, arias) as *constitutive* of its unique power to explore human experience through "manifest artifice." The artifice *is* the point, enabling a direct expression of emotional and psychological truth impossible in spoken drama.

  *   **Would his view license the pattern?** **Largely, yes, but with more nuance and potential permissiveness.**
      *   **Tolerance for Conventions:** Williams wholeheartedly agrees that singing, invisible orchestras, arias, etc., are essential, constitutive artifice. He'd defend the tolerance for these.
      *   **Intolerance for Incoherence:** He would strongly defend the outrage at productions that create a *rupture* between the music and the drama, undermining the "dramatic truth" or the internal logic of the work. Moving Verdi to a corporate boardroom purely for shock value, if it makes the music seem nonsensical in context, would violate his commitment to the work's integrity.
      *   **Potential Permissiveness:** Williams might be *more* permissive than average audiences in key areas:
          *   **Staging:** If a radical setting *illuminates* the core dramatic truth or emotional core of the work *through* its interaction with the music (even if jarring initially), Williams could endorse it. He valued productions that revealed the work anew, provided they respected its fundamental musical-dramatic structure.
          *   **Casting:** His focus on vocal-dramatic embodiment might make him *more* open to non-traditional casting if the singer achieves the core dramatic expression through voice and presence, seeing visual "realism" as secondary to the artifice of musical expression.
          *   **Cuts/Text:** He might be pragmatic about cuts if justified by theatrical flow, but deeply suspicious of libretto rewrites that alter the fundamental dramatic structure fused to the music. Da capo cuts depend entirely on dramatic function.
      *   **Intolerance for Sentimentalizing:** He'd likely share the audience's intolerance for productions that strip away the manifest artifice or try to impose a false "realism" that negates opera's unique power, seeing this as a betrayal of the form.

  ### Replacing the Presupposed View: The Rival "Music Primacy" View
  The most plausible rival is **Formalism/Pure Musical Autonomy:** Opera is primarily a *musical* art form; the drama is a scaffold, a pretext, for generating compelling musical structures (arias, ensembles, orchestration). The "work" is the score; the libretto is secondary material.

  *   **Changes in Staging/Reviewing:**
      1.  **Radical Directorial Freedom:** Settings, eras, costumes could be changed with near impunity. If the music is the thing, its meaning isn't inherently tied to the libretto's specific setting. A 1970s housing project *Tosca* would be unproblematic if the director found a visual analogue interesting.
      2.  **Libretto Fluidity:** Rewriting the libretto, modernizing language, or altering plot details to suit a concept would be far more acceptable, as long as the musical structure remains intact. The words serve the music.
      3.  **Cuts Focused on Music:** Cuts would be judged purely on musical grounds – does it damage the musical architecture? A da capo cut might be fine if the repetition is deemed musically redundant.
      4.  **Casting:** Vocal perfection and musicality would be the *sole* criteria. Age, race, gender, or physical suitability for the *dramatic* role would be irrelevant if the voice fits the musical part.
      5.  **Redefined "Scandal":** Outrage would focus *only* on musical vandalism: butchering the score, terrible singing, bad conducting. Dramatic incoherence or historical inauthenticity in staging would be largely irrelevant to criticism. The drama's function is merely to generate the music; once composed, it's disposable.
      6.  **Reviewing:** Critics would primarily discuss musical performance, vocal quality, orchestral playing, and the conductor's interpretation. Staging concepts might be noted for visual interest or distraction, but not deeply analyzed for dramatic coherence with the music.

  **Conclusion:** The observed pattern presupposes opera as a historically located, integral music-drama composite where specific conventions are constitutive of its expressive power. Audiences tolerate artifice essential to the musical-dramatic mode but react strongly to perceived ruptures in the internal coherence of this composite. Bernard Williams' view largely licenses this pattern by emphasizing authenticity to the work's dramatic truth through its constitutive artifice, though he might be more open to conceptually rigorous, musically faithful directorial reinterpretations than the average audience member. Replacing this with a "music primacy" view would fundamentally shift opera towards concert drama in costume, prioritizing musical integrity above all else and rendering most current sources of staging controversy philosophically moot.
