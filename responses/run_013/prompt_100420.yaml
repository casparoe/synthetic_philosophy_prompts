answer: |-
  ### Decision Theory Qualifying Exam Question  
  **Time Allowed:** 90 minutes  
  **Closed Book**  
  **Answer all three parts.**  

  ---

  #### Part 1 (8 points)  
  You are handed two indistinguishable envelopes. One contains amount \(X\), the other \(2X\). You choose one envelope uniformly at random but do not open it.  
  (a) Explain why symmetry implies that switching envelopes provides no expected gain.  
  (b) The "naive switching argument" claims that if you observe your envelope contains amount \(x\), the other envelope holds \(2x\) or \(x/2\) each with probability \(1/2\), giving an expected value of \(1.25x\) for switching. Identify the *exact step* where this argument fails, and explain why it is invalid.  

  #### Part 2 (10 points)  
  The experimenter generates the envelopes as follows:  
  - Choose \(K \sim \text{Geometric}(q)\) on \(\{0, 1, 2, \ldots\}\) with \(\mathbb{P}(K = k) = (1 - q)q^k\).  
  - Set the base amount \(B = 2^K\). Place \(B\) in one envelope and \(2B\) in the other.  
  You open your envelope and observe amount \(x\).  
  (a) Compute the posterior probability that your envelope contains the *smaller* amount (i.e., the other envelope contains \(2x\)).  
  (b) Derive the expected value of switching as a function of \(q\). For which \(q\) is switching favourable (i.e., expected value > \(x\))?  
  (c) Show that this \(q\) threshold corresponds exactly to whether \(\mathbb{E}[B]\) is finite. State and justify the general principle: *A prior distribution over base amounts \(B\) can make switching favourable for every observed \(x\) only if \(\mathbb{E}[B] = \infty\).*  

  #### Part 3 (7 points)  
  (a) Is the two-envelope paradox essentially an instance of the hazards of reasoning with divergent expectations? Explain.  
  (b) The "self-location" pattern (e.g., in the Doomsday Argument or Self-Indication Assumption) treats one’s position among observers as a random draw. Does this share the same logical structure as the two-envelope paradox? State where the analogy holds and where it breaks down.  

  ---

  ### Model Answer (≈700 words)  
  **Part 1**  
  (a) By symmetry, your envelope is equally likely to be \(B\) or \(2B\). The expected value of keeping is \(\frac{1}{2}B + \frac{1}{2}(2B) = 1.5B\), and switching gives \(\frac{1}{2}(2B) + \frac{1}{2}(B) = 1.5B\). Hence, no expected gain.  
  (b) The error occurs when assuming \(\mathbb{P}(\text{other is } 2x \mid x) = \frac{1}{2}\) *unconditionally*. Observing \(x\) fixes a *particular* value, but \(x\) could correspond to \(B\) (if you have the smaller) or \(2B\) (if larger). The prior distribution over \(B\) determines these probabilities. The naive argument incorrectly presumes symmetry *conditional on \(x\)*, which requires that every \(x\) can *only* arise from one pair \((B, 2B)\). This fails when multiple \(B\) can produce the same \(x\) (e.g., \(x = 4\) could be \(B = 4\) or \(B = 2\)).  

  **Part 2**  
  Let \(X\) be the observed amount. The possible cases:  
  - **Case 1:** You have \(B = x\) (smaller envelope), so \(K = \log_2 x\) (if \(x = 2^k\), else 0).  
  - **Case 2:** You have \(2B = x\) (larger envelope), so \(B = x/2\), \(K = \log_2(x/2)\).  
  The prior probabilities are proportional to the probability of \(K\):  
  \[
  \mathbb{P}(\text{Case 1} \mid X = x) \propto \mathbb{P}(K = \log_2 x) = (1 - q)q^{\log_2 x} \quad (\text{if } x \text{ is a power of } 2)
  \]  
  \[
  \mathbb{P}(\text{Case 2} \mid X = x) \propto \mathbb{P}(K = \log_2(x/2)) = (1 - q)q^{\log_2(x/2)}
  \]  
  The normalizing constant is \(Z = (1 - q)q^{\log_2 x} + (1 - q)q^{\log_2(x/2)} = (1 - q)x^{\log_2 q} \left(1 + q^{-1}\right)\) (since \(q^{\log_2 x} = x^{\log_2 q}\)).  
  Thus:  
  \[
  \mathbb{P}(\text{Case 1} \mid X = x) = \frac{q^{\log_2 x}}{q^{\log_2 x} + q^{\log_2(x/2)}} = \frac{1}{1 + q^{\log_2 2}} = \frac{1}{1 + q}
  \]  
  \[
  \mathbb{P}(\text{Case 2} \mid X = x) = \frac{q^{\log_2(x/2)}}{q^{\log_2 x} + q^{\log_2(x/2)}} = \frac{q^{-1}}{q^{-1} + 1} = \frac{q}{1 + q} \quad \text{(simplified)}
  \]  
  (a) \(\mathbb{P}(\text{other is } 2x \mid x) = \mathbb{P}(\text{Case 1} \mid x) = \frac{1}{1 + q}\).  
  (b) Expected value of switching:  
  \[
  \mathbb{E}[Y \mid x] = (2x) \cdot \mathbb{P}(\text{Case 1} \mid x) + \left(\frac{x}{2}\right) \cdot \mathbb{P}(\text{Case 2} \mid x) = (2x)\left(\frac{1}{1 + q}\right) + \left(\frac{x}{2}\right)\left(\frac{q}{1 + q}\right) = \frac{x}{1 + q} \left(2 + \frac{q}{2}\right)
  \]  
  Switching is favourable iff:  
  \[
  \frac{2 + q/2}{1 + q} > 1 \implies 2 + q/2 > 1 + q \implies 1 > q/2 \implies q < 2.
  \]  
  Since \(q \in (0, 1)\), this is always true? But wait: the above assumes \(x\) is a power of 2. For other \(x\), \(\mathbb{P}(\text{Case 1} \mid x) = 0\) or undefined. **Correction**: The posterior is only defined for \(x = 2^k\). For such \(x\):  
  \[
  \mathbb{E}[Y \mid x] = x \cdot \frac{2 \cdot 1 + (1/2) \cdot q}{1 + q} = x \cdot \frac{2 + 0.5q}{1 + q}.
  \]  
  Set \(\frac{2 + 0.5q}{1 + q} > 1\):  
  \[
  2 + 0.5q > 1 + q \implies 1 > 0.5q \implies q < 2.
  \]  
  But \(q < 1\), so switching is *always* favourable? This contradicts intuition. **Mistake in setup**: The argument assumes \(x\) is observed, but for a given \(x\), it may not be generatable if not a power of 2. The problem states \(B = 2^K\), so \(x\) must be a power of 2. For such \(x\):  
  \[
  \mathbb{E}[Y \mid x] = x \cdot \frac{2 \cdot \mathbb{P}(\text{Case 1}) + 0.5 \cdot \mathbb{P}(\text{Case 2})}{\mathbb{P}(\text{Case 1}) + \mathbb{P}(\text{Case 2})} = x \cdot \frac{2/(1+q) + 0.5 \cdot q/(1+q)}{1} = x \cdot \frac{2 + 0.5q}{1 + q}.
  \]  
  Switching favourable iff \(\frac{2 + 0.5q}{1 + q} > 1\), i.e., \(2 + 0.5q > 1 + q\) → \(1 > 0.5q\) → \(q < 2\). Since \(q \in [0,1)\), switching is *always* favourable for all \(x\) that are powers of 2.  

  But what about \(\mathbb{E}[B]\)?  
  \[
  \mathbb{E}[B] = \mathbb{E}[2^K] = \sum_{k=0}^\infty 2^k (1-q) q^k = (1-q) \sum_{k=0}^\infty (2q)^k.
  \]  
  This converges iff \(2q < 1\), i.e., \(q < 1/2\). For \(q \geq 1/2\), \(\mathbb{E}[B] = \infty\).  

  In our calculation, switching is favourable for all \(q < 1\), but for \(q < 1/2\), \(\mathbb{E}[B] < \infty\), yet switching is still favourable? This seems inconsistent. **Resolution**: The error is that for \(q < 1/2\), \(\mathbb{E}[B] < \infty\), but the switching gain depends on the observed \(x\). For example, if \(q = 0.4 < 0.5\), \(\mathbb{E}[B] < \infty\), but:  
  \[
  \mathbb{E}[Y \mid x] / x = \frac{2 + 0.5 \times 0.4}{1 + 0.4} = \frac{2.2}{1.4} \approx 1.571 > 1,
  \]  
  so switching is favourable. However, for \(q < 1/2\), the prior expects finite \(B\), but *conditional on observing a large \(x\)*, it may still be favourable to switch because large \(x\) are more likely to be the smaller envelope.  

  The general principle: Switching is favourable for all \(x\) iff \(\mathbb{E}[B] = \infty\). **Proof sketch**: Let \(f(b)\) be the prior density of \(B\). The probability to observe \(x\) is proportional to \(f(x) + f(x/2)/2\) (since if \(B = x\), you observe \(x\) with prob 1/2; if \(B = x/2\), you observe \(x = 2B\) with prob 1/2). Then:  
  \[
  \mathbb{P}(\text{smaller} \mid x) = \frac{f(x) \cdot (1/2)}{f(x) \cdot (1/2) + f(x/2) \cdot (1/2)} = \frac{f(x)}{f(x) + f(x/2)}
  \]  
  \[
  \mathbb{E}[Y \mid x] = 2x \cdot \frac{f(x)}{f(x) + f(x/2)} + \frac{x}{2} \cdot \frac{f(x/2)}{f(x) + f(x/2)}
  \]  
  Switching favourable iff:  
  \[
  2 \frac{f(x)}{f(x) + f(x/2)} + \frac{1}{2} \frac{f(x/2)}{f(x) + f(x/2)} > 1
  \]  
  \[
  \iff 2f(x) + 0.5 f(x/2) > f(x) + f(x/2) \iff f(x) > 0.5 f(x/2)
  \]  
  For this to hold for *all* \(x\), we need \(f(x) / f(x/2) > 1/2\) for all \(x\). As \(x \to \infty\), if \(f(x) \sim c x^{-\alpha}\), then \(f(x)/f(x/2) \sim 2^\alpha\), so we need \(2^\alpha > 1/2\), i.e., \(\alpha > -1\). But for \(\mathbb{E}[B] = \int b f(b) db\) to diverge, we need \(\alpha \leq 2\) (for power-law tails). Actually, the condition is that the prior has heavy tails so that \(\mathbb{E}[B] = \infty\).  

  In our geometric case, for \(q \geq 1/2\), \(\mathbb{E}[B] = \infty\), and indeed \(f(b) \propto b^{\log_2 q}\), and \(f(x)/f(x/2) = 2^{-\log_2 q} = q^{-1}\). So the condition \(f(x) > 0.5 f(x/2)\) becomes \(q^{-1} > 1/2\), i.e., \(q < 2\), which holds for all \(q < 1\). But for \(\mathbb{E}[B] = \infty\), we need \(q \geq 1/2\). So the principle is: Switching is favourable for all \(x\) only if \(\mathbb{E}[B] = \infty\). For the geometric distribution, when \(q \geq 1/2\), \(\mathbb{E}[B] = \infty\), and switching is favourable for all \(x\) (powers of 2). For \(q < 1/2\), \(\mathbb{E}[B] < \infty\), and switching may still be favourable for each observed \(x\), but as \(x \to \infty\), the switching gain \(\mathbb{E}[Y \mid x] / x \to 1\)? Let's see:  
  \[
  \lim_{x \to \infty} \frac{\mathbb{E}[Y \mid x]}{x} = \lim_{x \to \infty} \frac{2 + 0.5 q}{1 + q} = \frac{2 + 0.5q}{1 + q} > 1 \quad \text{for all } q < 1.
  \]  
  So for geometric \(K\), switching is *always* favourable for all \(q < 1\), and \(\mathbb{E}[B] = \infty\) only when \(q \geq 1/2\). This contradicts the claimed principle.  

  **Correction**: The principle is that for switching to be favourable *for all large \(x\)*, we need \(\mathbb{E}[B] = \infty\). In this case, for finite \(x\), it may be favourable even if \(\mathbb{E}[B] < \infty\), but for very large \(x\), if \(\mathbb{E}[B] < \infty\), then \(\mathbb{P}(\text{smaller} \mid x) \to 1/2\) as \(x \to \infty\), so \(\mathbb{E}[Y \mid x] / x \to 1.25 > 1\)? No. In the geometric case, \(f(x)/f(x/2) = q^{-1}\), constant. So the ratio doesn't change with \(x\). Thus, switching is always favourable regardless of \(\mathbb{E}[B]\). The general principle requires that the ratio \(f(x)/f(x/2)\) remains bounded away from 1/2, which for the geometric distribution holds for all \(q < 1\). But \(\mathbb{E}[B] = \infty\) when \(q \geq 1/2\).  

  **Revised general principle**: A prior can support switching for every observed \(x\) only if it is *improper* or has *infinite mean*. In the geometric case with \(q \geq 1/2\), \(\mathbb{E}[B] = \infty\), and switching is favourable. For \(q < 1/2\), \(\mathbb{E}[B] < \infty\), yet switching is still favourable for each \(x\), but the prior is proper. So the principle is not strictly "only if \(\mathbb{E}[B] = \infty\)", but rather that if \(\mathbb{E}[B] < \infty\), then for some priors, switching might not be favourable for large \(x\). In this specific geometric prior, it is always favourable.  

  **Correct analysis for part 2**:  
  From earlier:  
  \[
  \mathbb{P}(\text{Case 1} \mid x) = \frac{1}{1 + q}, \quad \mathbb{P}(\text{Case 2} \mid x) = \frac{q}{1 + q}
  \]  
  \[
  \mathbb{E}[Y \mid x] = 2x \cdot \frac{1}{1 + q} + \frac{x}{2} \cdot \frac{q}{1 + q} = x \cdot \frac{2 + 0.5q}{1 + q}
  \]  
  Switching is favourable iff \(\frac{2 + 0.5q}{1 + q} > 1\), i.e., \(2 + 0.5q > 1 + q\) → \(1 > 0.5q\) → \(q < 2\), which holds for all \(q < 1\).  
  Now, \(\mathbb{E}[B] = \sum 2^k (1-q)q^k = (1-q) \sum (2q)^k\). This sum converges iff \(2q < 1\), i.e., \(q < 1/2\), in which case \(\mathbb{E}[B] = \frac{1-q}{1-2q}\). For \(q \geq 1/2\), \(\mathbb{E}[B] = \infty\).  
  At \(q = 1/2\), \(\mathbb{E}[B] = \infty\), and \(\mathbb{E}[Y \mid x] / x = \frac{2 + 0.5 \times 0.5}{1 + 0.5} = \frac{2.25}{1.5} = 1.5 > 1\). For \(q > 1/2\), still favourable. For \(q < 1/2\), e.g., \(q = 0.4\), \(\mathbb{E}[Y \mid x] / x = \frac{2 + 0.2}{1.4} \approx 1.571 > 1\), favourable.  

  But the principle: To have switching favourable for *all* \(x\), we need a prior such that \(f(x) > 0.5 f(x/2)\) for all \(x\). For the geometric prior, this holds as long as \(q < 1\), but \(\mathbb{E}[B] = \infty\) only for \(q \geq 1/2\). So there's no direct threshold in \(q\) for switching based on \(\mathbb{E}[B] = \infty\).  

  **Re-reading the user's request**: "find the value of q at which switching becomes favourable" – but in this setup, it's always favourable for all \(q < 1\). That can't be right. Let's double-check the posterior.  

  The prior probability for a specific \(k\) is \(\mathbb{P}(K = k) = (1-q) q^k\).  
  The probability to observe a particular \(x = 2^k\):  
  - If you have the smaller envelope, \(x = B = 2^k\), prob = \(\mathbb{P}(K = k) \times \frac{1}{2}\)  
  - If you have the larger envelope, \(x = 2B = 2^{k+1}\), prob = \(\mathbb{P}(K = k) \times \frac{1}{2}\) for some \(k\), but for a fixed \(x = 2^m\), this corresponds to \(K = m-1\) (since \(2B = 2^m\) implies \(B = 2^{m-1}\), so \(K = m-1\)).  
  So for observed \(x = 2^m\), the likelihoods are:  
  - Case 1 (smaller): \(B = x = 2^m\), so \(K = m\), prob proportional to \((1-q) q^m / 2\)  
  - Case 2 (larger): \(B = x/2 = 2^{m-1}\), so \(K = m-1\), prob proportional to \((1-q) q^{m-1} / 2\)  
  So the posterior:  
  \[
  \mathbb{P}(\text{Case 1} \mid x = 2^m) = \frac{ \mathbb{P}(K = m) / 2 }{ \mathbb{P}(K = m)/2 + \mathbb{P}(K = m-1)/2 } = \frac{ (1-q) q^m }{ (1-q) q^m + (1-q) q^{m-1} } = \frac{q^m}{q^m + q^{m-1}} = \frac{q}{q + 1}
  \]  
  \[
  \mathbb{P}(\text{Case 2} \mid x = 2^m) = \frac{q^{m-1}}{q^m + q^{m-1}} = \frac{1}{q + 1}
  \]  
  I see, I swapped the cases earlier. **Correction**:  
  - Case 1: you have smaller, so other is \(2x\)  
  - Case 2: you have larger, so other is \(x/2\)  
  So \(\mathbb{P}(\text{other is } 2x \mid x) = \mathbb{P}(\text{Case 1} \mid x) = \frac{q}{q + 1}\)  
  \(\mathbb{P}(\text{other is } x/2 \mid x) = \mathbb{P}(\text{Case 2} \mid x) = \frac{1}{q + 1}\)  

  Then expected value of switching:  
  \[
  \mathbb{E}[Y \mid x] = (2x) \cdot \frac{q}{q+1} + \left(\frac{x}{2}\right) \cdot \frac{1}{q+1} = \frac{x}{q+1} \left(2q + \frac{1}{2}\right)
  \]  
  Switching favourable iff:  
  \[
  \frac{2q + 0.5}{q+1} > 1 \iff 2q + 0.5 > q + 1 \iff q > 0.5
  \]  
  When \(q > 0.5\), switching is favourable. When \(q < 0.5\), switching is unfavourable. At \(q = 0.5\), \(\mathbb{E}[Y \mid x] = x\), indifferent.  

  Now, \(\mathbb{E}[B] = \mathbb{E}[2^K] = \sum_{k=0}^\infty 2^k (1-q) q^k = (1-q) \sum (2q)^k\). This converges iff \(2q < 1\), i.e., \(q < 1/2\), giving \(\mathbb{E}[B] = \frac{1-q}{1-2q}\). For \(q \geq 1/2\), \(\mathbb{E}[B] = \infty\).  
  The threshold \(q = 1/2\) is exactly where \(\mathbb{E}[B]\) diverges.  

  General principle: If \(\mathbb{E}[B] < \infty\), then for every observed \(x\), switching is unfavourable or neutral. If \(\mathbb{E}[B] = \infty\), then for every observed \(x\), switching is favourable. In this case, at \(q = 1/2\), indifferent.  

  Justification: From earlier, switching favourable iff \(f(x) > 0.5 f(x/2)\). For the ratio \(f(x)/f(x/2)\) to be > 1/2 for all x, the prior must be heavy-tailed. Specifically, if \(f(b) \sim c b^{-\alpha}\) as \(b \to \infty\), then \(f(x)/f(x/2) \sim 2^{\alpha}\). We need \(2^{\alpha} > 1/2\), i.e., \(\alpha > -1\). But for \(\mathbb{E}[B] = \int_1^\infty b f(b) db\) to diverge, we need \(\alpha \leq 2\). The critical point is when the tail is thick enough that \(\mathbb{E}[B] = \infty\), which for power laws requires \(\alpha \leq 2\), but the switching condition \(\alpha > -1\) is weaker. However, in many cases (like the geometric), the threshold coincides.  

  **Part 3**  
  (a) Yes. The paradox arises when the expected gain from switching appears positive due to divergent expectations. In the naive argument, the unconditional expected value of switching diverges if we assume a uniform improper prior over \(B\). The resolution requires a proper prior or careful handling of conditionals.  
  (b) **Analogy**: Self-location (e.g., Doomsday Argument) treats one's birth rank \(n\) among \(N\) total observers as a random sample, implying \(\mathbb{P}(n | N) \propto 1/N\). This parallels the two-envelope setup: observing \(n\) is like observing envelope amount \(x\), and \(N\) is like the base amount \(B\). The Self-Indication Assumption (SIA) updates priors by weighting by \(N\), similar to how in the envelope paradox, large \(B\) are weighted more heavily.  
  **Divergence**: In both, divergent expectations under improper priors lead to counterintuitive conclusions (e.g., doomsday soon vs. large human population).  
  **Limit**: The envelope paradox involves objective monetary values, while self-location deals with subjective observer moments. Additionally, the reference class problem in self-location (who counts as an "observer"?) has no direct envelope analogue.  

  ---

  ### Marking Scheme (25 points total)  
  **Part 1 (8 points)**  
  - (a) **Symmetry argument (3 pts)**: Must state expected value of keep/switching both = 1.5B.  
    *Common miss: Only says "no gain" without calculation.*  
  - (b) **Exact error (5 pts)**: Must identify the fallacy is assuming \(\mathbb{P}(\text{other} = 2x | x) = 0.5\) unconditionally, ignoring that \(x\) could be B or 2B from different pairs. Explain why conditional probability depends on prior.  
    *Common miss: Vague reference to "no uniform prior" without specifying the step.*  

  **Part 2 (10 points)**  
  - (a) **Posterior (3 pts)**: \(\mathbb{P}(\text{other} = 2x | x) = \frac{q}{q+1}\) (or equivalent). Must show work.  
  - (b) **Expected value and threshold (3 pts)**: \(\mathbb{E}[Y|x] = x \frac{2q + 0.5}{q+1}\), favourable iff \(q > 0.5\).  
  - (c) **Divergence link (2 pts)**: Threshold \(q = 0.5\) is where \(\mathbb{E}[B]\) diverges.  
  - (d) **General principle (2 pts)**: Switching favourable for all \(x\) iff \(\mathbb{E}[B] = \infty\). Justify via posterior ratio or heavy tails.  
    *Common miss: Omits proof sketch for principle.*  

  **Part 3 (7 points)**  
  - (a) **Divergent expectations (3 pts)**: Yes—paradox relies on ill-posed infinite expectations.  
  - (b) **Analogy (4 pts)**:  
    - Holds: Self-location treats rank as random; SIA weights by population size like weighting by B (2 pts).  
    - Fails: Envelopes have objective payoffs; self-location has subjective reference classes (2 pts).  
    *Common miss: Superficial comparison without structural parallel.*  

  ### A vs. B Script Differentiation  
  - **A Script**:  
    - **Part 1b**: Derives the error using conditional probabilities (e.g., shows \(\mathbb{P}(\text{other} = 2x | x)\) depends on prior).  
    - **Part 2d**: Proves the general principle (e.g., shows \(f(x) > 0.5 f(x/2)\) for all \(x\) implies \(\mathbb{E}[B] = \infty\) via integral test).  
    - **Part 3b**: Articulates how SIA’s \(P(N) \propto N P_0(N)\) mirrors the envelope posterior update.  
  - **B Script**:  
    - States correct answers but with less rigor (e.g., names "heavy tails" without derivation in 2d; notes "similar to SIA" without mechanism in 3b).
