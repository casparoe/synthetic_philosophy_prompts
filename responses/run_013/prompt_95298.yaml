  First, part (a): The student correctly frames NU as minimizing suffering but oversimplifies by calling it "not utilitarianism proper." That's inaccurate—NU is a recognized utilitarian variant. They also drift into discussing non-consequentialist suffering-focused ethics, which wasn't asked. Good structural point about minimax vs. maximize, but the irrelevant expansion costs clarity. 

  Part (b): Spot-on with the world-exploder objection and its reductio force. Full marks here—clear, precise, and even notes the objection's axiomatic strength. 

  Part (c): Correctly links the objection to suffering-focused ethics broadly but misses a key nuance: non-consequentialist versions might avoid the world-exploder via deontic constraints (e.g., "don't kill"). The student's conclusion about abandoning absolute priority is reasonable but doesn't salvage the oversight. 

  Biggest flaw? Part (a)'s misrepresentation of NU and overreach into non-consequentialism. That drags the mark down despite strong (b) and decent (c). 

  Final mark: 12/15. Balanced—acknowledges excellence in (b) and logical coherence in (c), but penalties for (a)'s errors and (c)'s missed counterargument. Comments should prioritize these gaps while crediting strengths. 

