answer: |-
  1. **12/15** - Strong grasp of core concepts but missed key nuances in (a) and (c), costing 3 marks.  
  2. **(a) Misrepresents NU's classification**: Incorrectly claims NU isn’t "utilitarianism proper" (it’s a recognized variant) and overextends to non-consequentialist views (irrelevant to the question). Misses NU’s *absolute lexical priority* over happiness promotion, which is central to strict NU.  
  3. **(c) Underaddresses the generalization claim**: Correctly notes the objection’s formal applicability but omits that *non-consequentialist* suffering-focused ethics (e.g., deontology) may avoid the "world-exploder" via side-constraints (e.g., "never kill innocents"), breaking the reductio.  
  4. **(b) Excellent objection analysis**: Perfectly identifies the "world-exploder" reductio, its force, and independence from axiology—clear, concise, and demonstrates deep understanding.  
  5. **(a)/(c) Strengths partially offset weaknesses**: Insightful structural contrast (minimizing vs. maximizing) in (a) and coherent (c) conclusion re: absoluteness show analytical skill, but don’t compensate for core omissions.
