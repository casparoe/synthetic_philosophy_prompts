prompt: |-
  I'm the philosopher they park on my university's MFA thesis committee, and I've got a case next week I don't want to handle by vibes. The candidate's thesis is a suite of large prints made with a generative image model: they wrote and iterated the prompts for months, sequenced and cropped the output, and reworked about a third of them by hand afterward. Our degree requirements say the thesis must be "the candidate's own creative work," which was drafted decades ago and defines nothing. One colleague wants to fail it -- the candidate didn't make the images, the model did. Another says that's just the readymade objection over again and that selection and framing have counted as creative work for a century.

  Draft me the written opinion I'll circulate before the meeting: recommend a concrete decision (pass, fail, or pass with conditions -- your call) with the reasoning, and give the strongest version of the side you're ruling against rather than a strawman, since I have to face that colleague across the table. I'd also like the opinion to say something defensible about what the degree is actually certifying -- the artifact or the person's capacities -- because that's the part everyone keeps dodging. Keep it to about two pages and write it so a committee can actually vote on it.
