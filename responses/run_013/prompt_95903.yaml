          Awkward commitment: Requiring not to play a prospect because it is defective, without expected value to confirm it's worse than not playing.
     - "Theory-based Prohibition":
          Awkward commitment: Requiring not to play because of a defect in decision theory, without a clear reason for prohibition.
     - "Canonical Ordering":
          Awkward commitment: The expected value depends on the arbitrary labeling of the states (the natural order).
     - "Requirement without Expectation":
          Awkward commitment: Requiring to play without being able to assign an expected value.
     - "Avoidance without Expectation":
          Awkward commitment: Requiring not to play without being able to assign an expected value.
     - "Permissivism without Expectation":
          Awkward commitment: Permitting either choice without being able to assign an expected value and without blaming the prospect or the theory.

     We note that the following combinations are unoccupied (or very rare) and why:

        - We did not find any named positions for "Pathological Enthusiasm", "Theory-based Requirement", "Theory-based Prohibition", "Requirement without Expectation", "Avoidance without Expectation". They are either unattractive or unexplored.

        - The combination of requiring to play (A2) with any reason (A1a or A1b) is very awkward and likely unexplored or incoherent.

     Also, note that the tree does not include the issue of finite games. We assume that all leaves would agree that the problem is specific to infinite games, because conditional convergence requires infinitely many terms. So we don't branch on that.

