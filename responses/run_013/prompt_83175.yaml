prompt: |-
  ok so ive been going down a rabbit hole on this guy A.J. Ayer. hes the logical positivist who argued that talk about god, and specifically talk about surviving your own death, isnt even false - its meaningless, because theres no possible experience that could count for or against it. then in the late 80s he nearly died of pneumonia, his heart actually stopped for a few minutes (theres a bit where a piece of smoked salmon went down the wrong way), and he came back describing some kind of experience. afterwards he said it had sort of loosened his grip on the idea that death is just the end of him, though he still thought an oxygen starved brain was the likelier explanation. then he died a year or so later. i cant look anything up so dont send me reading lists, i just want the reasoning laid out.

  heres what i want. give me your actual credence that Ayer was right in the original claim - not "is there an afterlife" but his claim about the status of the question: that statements about surviving your own death arent the kind of thing that can be true or false at all. then break it down with a rough number for each piece:

  - whether any version of the test (only meaningful if some possible experience could check it) survives at all. the old objection that the test itself isnt checkable by experience, plus the fact that Ayer himself backed off the strict version later on
  - even granting some version of the test, whether claims about survival really fail it. because you could say, well, "i will still have experiences after my body is gone" would be confirmed if i have them - isnt that checkable in principle, by the one person it happens to? does it matter that nobody else can check it?
  - whether "cant be checked" actually gets you to "not even false", or only to "we shouldnt assert it" or "we cant know either way"
  - whether theres a reworded version of the afterlife claim that slips past the whole apparatus, like "my memories and habits carry on in some other body", or "theres a further fact about me that isnt fixed by the facts about my body" - that second one might be checkable-ish or might be a whole different kind of claim
  - and then how much weight his own near death thing should get. this is the part im most curious about. he was the guy who said an experience like that cant count as evidence for anything, so by his own rules should it have moved him at all? or does the fact that it did move him show the rule is broken?

  give me the combination and the final number, then tell me which piece your number is most sensitive to, and what would actually move it - what kind of argument or finding, not what to read.

  also: a friend of mine is at like 0.85 that Ayer was right and im at like 0.3, and i want to know where the fight actually lives. is it the verification principle itself, or is it that we disagree about what counts as checkable? tell me which piece of the decomposition me and her most likely split on, and whether thats the piece that really decides the question or whether were arguing about the wrong thing.
