prompt: |-
  I have no academic training, but for the last couple of years I've been reading about lost civilizations, alternative chronologies, and the fights that break out around them, and I've come to hold a set of gut verdicts that I cannot reduce to a rule. I'd like you to find the rule, if there is one, and to tell me which of my verdicts I have to give up.

  My verdicts, case by case:

  1. A Russian mathematician's claim that most of ancient and medieval history was fabricated in the sixteenth and seventeenth centuries by a small group of chronologers, so that many figures we treat as separated by centuries are really the same person. Pseudohistory. It makes no difference to me that he is a real mathematician using statistics.

  2. Ancient astronauts: the great monuments of the world were built with extraterrestrial help. Pseudohistory.

  3. A Nobel-winning biologist once suggested, in an ordinary scientific paper, that life on Earth might have been deliberately seeded by some earlier civilization. I do not think that is pseudoscience at all, even though it is as unverifiable as anything in (2), and it also says aliens were involved. It reads to me as an honest speculation that admits what it is.

  4. A psychiatrist's book claiming that Venus was a comet ejected from Jupiter within human history, and that its passage caused the plagues and parted the seas. Pseudoscience. Yet the mainstream story that the Moon was made by a giant collision between the young Earth and another body, a catastrophe on a far greater scale, seems to me ordinary science.

  5. A German meteorologist's 1912 proposal that the continents drifted apart from a single landmass: attacked for lacking a mechanism, largely dismissed for about forty years, now the foundation of the field. Not pseudoscience, and the consensus was simply wrong.

  6. The 1989 claim of room-temperature fusion in a beaker. I want to split this one. The original announcement was bad science, not pseudoscience. The movement that grew around it afterwards, blaming the calorimeters and the referees for decades rather than the claim, is pseudoscience.

  7. The old American belief that the earthworks and burial mounds of North America were built by a vanished race rather than by the Indians. Pseudohistory, and it was the orthodox view, taught as fact in its day, and used to justify dispossession. What troubles me most is that here the true answer was the one that kept being dismissed, and the people who dismissed it were not a conspiracy, just an entire society.

  8. Flat earth, and the claim that the earth is six thousand years old. Pseudoscience, instantly. I notice my verdict here is much faster and much angrier than on any case above, which makes me wonder whether I am using the word descriptively or as an insult.

  The rule I have been working with has three parts. (a) A claim turns pseudoscientific when its defenders explain away every failed test by adjusting something other than the claim itself: the instrument, the replication, the referee. (b) A claim turns pseudoscientific when it needs a keeper of the secret, someone with both the motive and the power to have hidden or destroyed the evidence, because ordinary scientific error does not need a villain. (c) A claim is not pseudoscientific merely for being speculative, unpopular, or later shown to be false.

  I can already see trouble. Clause (b) does nothing for the mounds case, which had no secret-keeper, and it seems to convict the ulcer doctor who complained that the establishment was ignoring him, whom I take to be a hero. Clause (a) does not obviously separate the fusion crowd from the continental-drift people, who also spent decades defending a claim the evidence had not yet caught up with. I have also been told that the answer is falsifiability, but (3) is arguably unfalsifiable and I refuse to call it pseudoscience, while (5) was perfectly falsifiable and got rejected anyway. And nothing in my rule mentions what strikes me most about the cases I am sure of: the argument is always over the same old material, and nobody ever goes out and digs a new hole. Real researchers seem to spend their effort on evidence that does not exist yet; the others spend it re-reading what we already have.

  Two further things I cannot sort out. First, some of my verdicts are about a claim and some are about a person or a group; (6) is entirely about people and (3) entirely about a claim. Which of those is pseudoscience really a property of? Second, the cases I am most certain about all carry a payload: they flatter or indict a nation, a religion, or a race. The ones I am least sure about do not. Is that a coincidence, or does the harm have to be written into the definition?

  What I want from you: the principle, stated precisely, clause by clause, with the case that forces each clause; an honest statement of which of my eight verdicts it cannot accommodate and why I should surrender that one; and its verdict on a case I have not listed, namely the claim that the Sphinx is thousands of years older than the dynastic Egyptians, on the grounds that the erosion on its enclosure walls is water erosion from a wet climate, put forward by a working geologist who says the field refuses to listen to anyone outside it.
reasoning: |-
  Okay, let me try to unpack this user's query. They've been exploring lost civilizations and alternative chronologies without formal training, and now they're wrestling with their own gut reactions to various claims. They want a clear rule to distinguish pseudoscience from legitimate science or speculation, and they want to know which of their judgments might be inconsistent.

  First, I need to understand their verdicts on the eight cases. They range from Russian chronology conspiracies to ancient astronauts, panspermia, Velikovsky's Venus theory, continental drift, cold fusion, mound builder myths, and young Earth claims. The user admits some internal conflicts—like why panspermia feels legitimate while ancient astronauts don't, even though both involve aliens. Or why continental drift gets a pass despite initial rejection, while cold fusion defenders are pseudoscientific. 

  Their proposed three-part rule has flaws they've already spotted: the "secret keeper" clause doesn't fit the mound builder case, and the "failed tests" clause doesn't cleanly separate continental drift defenders from cold fusion enthusiasts. They're also noticing emotional reactions—anger at young Earth claims—and wondering if that's biasing them. Plus, they're hung up on whether pseudoscience is about claims or people, and whether social harm should be part of the definition.

  Hmm. The user's self-awareness is impressive. They're not just defending their views; they're genuinely probing their own inconsistencies. The underlying need seems to be epistemological clarity—they want tools to navigate murky claims without relying solely on intuition. The mention of "payload" (flattery/indictment of groups) suggests they suspect ideology corrupts inquiry, which is astute. 

  For the rule, I need something that addresses their gaps. Karl Popper's falsifiability won't work perfectly because they rightly note their #3 (panspermia) is unfalsifiable but feels legitimate. Imre Lakatos' "research programmes" framework might help—it focuses on how theories adapt to new evidence. The key could be whether a theory generates novel predictions or just retrofits excuses. That would explain why cold fusion defenders (#6) feel pseudoscientific (endless excuses, no new tests) while continental drift (#5) doesn't (it predicted seafloor spreading before evidence existed). 

  The social harm angle is tricky. It shouldn't be part of the definition (many pseudosciences are harmless), but it often correlates because biased claims resist correction. For the Sphinx erosion case, the geologist might have a legitimate argument if they're engaging with evidence, but if they're just claiming "the establishment ignores outsiders" without addressing counter-evidence, it veers toward pseudohistory. 

  Their verdict on #7 (mound builders) is solid—no secret keeper needed, just societal bias. But they might need to soften their stance on #4 (Velikovsky vs. moon collision). The difference isn't scale; it's that the moon theory generated testable models, while Velikovsky invoked ad hoc planetary mechanics. 

  Biggest challenge: explaining why #3 (panspermia) isn't pseudoscience. It's about the claim's role—a speculative but testable hypothesis vs. a closed system (like ancient astronauts) that reinterprets all contrary data as "cover-ups." 

  Also need to clarify that pseudoscience is primarily about claims/methods, not people—though communities can adopt pseudoscientific practices. 

  Finally, for the Sphinx case: if the geologist is actively seeking new evidence (e.g., geological dating) and engaging critiques, it's science. If they're fixated on "water erosion" without addressing other explanations (like wind/salt weathering) and blame Egyptology for dismissal, it's pseudohistory.
answer: |-
  Your gut verdicts reveal a consistent intuition about the boundary between legitimate inquiry and pseudoscience/pseudohistory. The core principle unifying your judgments is **methodological integrity**: whether a claim actively engages with empirical evidence in a self-correcting way, or insulates itself from falsification. Below is a formalized rule with clauses addressing your conflicts, followed by verdict adjustments and the Sphinx case analysis.

  ---

  ### **The Rule: Methodological Integrity Criteria**  
  *(Clauses derived from your cases and insights)*

  1. **Progressive vs. Degenerative Research**  
     A claim becomes pseudoscientific when it persistently **avoids novel empirical tests** (e.g., digging new holes) and instead **reinterprets existing data** without generating new, testable predictions.  
     *Case:* Velikovsky's Venus/comet theory (#4) recycles myths but never seeks new planetary evidence. Continental drift (#5) predicted seafloor spreading *before* it was observed.  

  2. **Accountability to Evidence**  
     A claim becomes pseudoscientific when failures are **routinely attributed to external conspiracies** (secret-keepers) or **methodological sabotage** (faulty instruments/referees), rather than internal flaws.  
     *Case:* Cold fusion defenders (#6) blamed calorimeters for decades; the ulcer doctor (unnamed) accused "the establishment" but *also* provided testable bacterial evidence.  

  3. **Ideological Payload Neutrality**  
     A claim is **not** pseudoscientific merely for being wrong, unpopular, or ideologically charged—**unless** the payload drives evasion of falsification.  
     *Case:* The mound-builder myth (#7) served colonial agendas *and* ignored archaeological counter-evidence. Panspermia (#3) lacks evidence but admits its speculative nature.  

  4. **Falsifiability in Principle**  
     Unfalsifiable claims are not inherently pseudoscientific **if they acknowledge their limits** and spur testable follow-ups. Pseudoscience demands certainty where none is possible.  
     *Case:* Ancient astronauts (#2) assert extraterrestrial help as fact; panspermia (#3) poses a "what if" with pathways for indirect testing (e.g., analyzing interstellar organics).  

  ---

  ### **Verdicts Requiring Surrender**  
  Your rule accommodates most verdicts, but two need revision:

  - **Surrender #4 (Velikovsky vs. Moon collision):**  
    Your distinction based on "scale" is inconsistent. **Revised verdict:** Velikovsky *is* pseudoscience (fits Clause 1: no novel tests, reinterprets myths). The Moon collision *is* science (fits Clause 1: generated testable predictions about lunar rock composition). Scale is irrelevant; methodology is key.  

  - **Surrender #8 (Young Earth/Flat Earth anger):**  
    Your anger likely stems from the **ideological payload** (Clause 3). Young Earth claims *are* pseudoscience (violate Clause 1: no new evidence, reinterpret geology). But flat Earth is **bad science**, not pseudoscience: it can be tested (e.g., satellite images) and lacks a secret-keeper. Anger doesn’t make it pseudoscience; evasion does.  

  *Other verdicts stand:*  
  - #1 (Russian chronology): Pseudohistory (Clause 1: rehashes texts, no new digs).  
  - #2 (Ancient astronauts): Pseudohistory (Clause 4: unfalsifiable certainty).  
  - #3 (Panspermia): Science (Clauses 3–4: honest speculation).  
  - #5 (Continental drift): Science (Clause 1: predicted new evidence).  
  - #6 (Cold fusion): Split correct (Clause 2: movement blamed referees).  
  - #7 (Mound builders): Pseudohistory (Clause 3: payload + ignored evidence).  

  ---

  ### **The Sphinx Erosion Case**  
  **Claim:** The Sphinx is thousands of years older due to water erosion (geologist says Egyptology ignores outsiders).  

  **Analysis using the rule:**  
  - **Clause 1:** The geologist *could* seek novel tests (e.g., dating mortar, subsurface imaging). If they focus *only* on reinterpreting erosion patterns, it edges toward pseudohistory.  
  - **Clause 2:** Accusing "the field" of ignoring outsiders *without* addressing counter-evidence (e.g., that wind/salt erosion explains the patterns) suggests evasion.  
  - **Clause 3:** Payload exists (Western scientist vs. "rigid" Egyptology), but this alone doesn’t define it.  
  - **Clause 4:** The claim is falsifiable (e.g., if new dating contradicts older timelines).  

  **Verdict:** **Not inherently pseudoscience** *if* the geologist engages with criticism and pursues new evidence. If they dismiss all counter-arguments as "establishment bias," it becomes pseudohistory. Your instinct to distrust appeals to persecution is justified (per Clause 2).  

  ---

  ### **Key Clarifications**  
  - **Pseudoscience targets CLAIMS/METHODS, not people:** Your #3 (panspermia claim) vs. #6 (cold fusion movement) shows pseudoscience arises when defenders *adopt* degenerative practices.  
  - **Harm isn’t definitional but correlative:** Claims with harmful payloads (#7, #8) often evade falsification to preserve ideology. Harm exposes motive, but poor methodology defines pseudoscience.  
  - **Falsifiability is necessary but insufficient:** Continental drift (#5) was falsifiable *and* rejected, but its defenders sought new evidence (Clause 1). Pseudoscience abandons this effort.  

  You’ve intuitively grasped that pseudoscience is defined by **evasion of accountability**. The rule above systematizes that insight—and asks only minor revisions to your excellent judgments.
