  ## The Unfinished House (Bicentennial Address Draft)

  Friends, neighbors—thank you for trusting me with these eight minutes tonight. Standing here, looking out at faces I know from the square, the school events, the hard work of keeping this place going, I feel the weight of two hundred years. And frankly, it stopped me cold for a while. I run a shop; I’m not a historian. But wrestling with what this moment asks of us led me down a path I didn’t expect, thinking hard about *how* we use our past, especially tonight.

  It seems to me we walk into this hall carrying three different hopes for this speech, maybe without even saying them out loud.

  Some of us hope for a *monumental* story. The story of giants: those founders who carved a town from wilderness with bare hands and iron wills. We want their example to tower over us, daring us to be just as bold, just as strong, to build something equally lasting. We want to feel pulled upward by their gravity.

  Others of us crave the *antiquarian* embrace. We want to touch the familiar threads: the old depot saved brick by brick, the family Bibles and letters donated to the historical society, the graves we tend with respect. We want the warmth of gratitude for what was passed down, the comfort of continuity, the simple love for this specific place and its tangible history.

  And some of us, especially sharp eyes in the back rows, demand the *critical* lens. You see the cracks in the foundation, the deeds signed under pressure, the bargains that weren't fair then and echo in ledgers still balanced today. You want that past held accountable, its legacy named plainly, its ongoing weight acknowledged, not smoothed over with nostalgia.

  Here’s the thing I’ve come to understand: **All three of these impulses are necessary.** A town needs heroes to aspire to, anchors of gratitude to hold it steady, *and* the clear-eyed courage to face its flaws. But each one, pushed too far, becomes a sickness.

  The monumental past, if we only see giants, can shrink us. We live behind their masks, feeling we can never measure up, forgetting they were complex people making hard, sometimes terrible, choices in their own time. The antiquarian love, if it becomes our only focus, turns us into mere caretakers of relics, afraid to let anything end or anything truly new begin, preserving even the dust we should sweep away. And the critical break? It’s vital, but it’s also the hardest, because the past we condemn is also the soil we grew from. We can’t simply step out of it by judging it. We are made of it.

  Our town’s story holds all of this. Yes, hands *did* build this. Sweat and vision raised the church, the first school, the square we gather around. We *should* feel gratitude for the endurance, for the families who stayed, for the records preserved, for the physical place we call home. And yes, the origins of the wealth that built those things are recorded too. The land under this very square, how it was acquired… it’s not a secret buried in time. It’s right there. It’s on the books. The consequences weren’t locked away two hundred years ago; they are part of the living, breathing present of this town, a transaction renewed year after year.

  Two things are true at once, and they don’t cancel each other out. The hands that built were real. The generosity shown over generations by the family that gained from that bargain is real – kindnesses extended, support given, including the gracious hospitality bringing us together tonight. *And* the nature of that foundational bargain casts a long shadow. Both truths stand. Ignoring either one makes us less whole.

  So, what speech can I give? I cannot give only the monumental one. That would ask us to ignore the complex truth beneath our feet, to pretend the giants were without flaw, and risk making us feel small or false in comparison. I cannot give only the antiquarian one. That would ask us to love everything simply because it's old, to shy away from the uncomfortable parts of our story, to prioritize comfort over clarity. And I cannot give only the critical speech. That would ask us to sever ourselves from the real good woven into this place, to pretend we aren’t beneficiaries as well as inheritors of consequence, and to leave no room for the gratitude that also binds us.

  The committee chair asked me to end on a high note. I take that seriously. But a true high note isn’t a final chord that silences the complex melody. It’s not forgetting the deed. It’s not “closure” that means dropping the subject. **A true high note is finding the resolve to carry the *whole* story forward with clear eyes and steady hands.**

  Because here’s what I’ve realized, wrestling with our past: **It isn’t finished.** The past isn't just a treasure chest, a trophy case, or a closed crime scene. It’s more like an old, complex house we all live in. The foundation stones were laid two hundred years ago, some strong and true, some set on ground that wasn’t freely given. Rooms were added by generations – some beautiful, some cramped, some built with love, some with compromise. The wiring is old, the plumbing groans, but the hearth is warm.

  **We aren’t just curators of this house, or prisoners condemned to live within its original flaws. We are its current builders.** The outcome of the past isn't sealed. It’s being decided *right now*, by what we do next. That rent paid on the square? It’s not just a line item. It’s a daily reminder that the choices of the past are *still* active threads in the fabric of our present. We can’t undo the laying of those stones, but we decide what we build upon them *today* and *tomorrow*.

  Should we ignore the foundation? No. That’s foolish. Should we only lament it? No. That’s paralyzing. Should we pretend it’s flawless? Absolutely not. That’s dishonest.

  The high note is this: **We have the power, and the responsibility, to renovate.** To acknowledge the whole structure – the grandeur *and* the cracks, the generosity *and* the original cost. To honor the hands that built by using our own hands to build *better*, more justly, more inclusively. To cherish the love of place by ensuring that place is worthy of love for *everyone* who calls it home. To face the critical truth not to wallow in blame, but to understand the materials we’re working with so we can build something stronger, fairer, and more durable for the future.

  We digest the past – the nourishing and the bitter – not to be crippled by it, but to be strengthened for action. We aren't people without history, floating free and rootless. Nor are we people crushed by history, seeing it all as equally unimportant from some detached height. We are the people *of* this history, standing firmly within its stream, understanding its currents, and choosing, deliberately, courageously, how we navigate it forward.

  So, on this bicentennial, let’s not just celebrate an ending. Let’s acknowledge a complex beginning, an ongoing middle, and a future we are building together. Let the monumental spirit inspire us to build *our* legacy. Let the antiquarian love ground us in gratitude for this specific place. And let the critical eye give us the honesty to see the work still before us.

  The story doesn’t end tonight. It continues. The house is ours to tend, to repair, to expand. Let’s get to work, together, with clear eyes, grateful hearts, and hands ready to build the next chapter well. That’s the high note worth holding: the resolve to make the next hundred years a story we can tell with even greater pride. Thank you.
