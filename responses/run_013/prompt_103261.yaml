  Based on your description of the practice and its tensions, here is a reconstruction of the implicit philosophical framework governing evidence for suffering in animal welfare vs. AI ethics, followed by the structured summary.

  ### Reconstruction
  The practice presupposes a **biological continuity-based view of moral status**, implicitly prioritizing *evolutionarily derived biological substrates* and *teleofunctional etiology* over behavioral outputs alone when attributing suffering. It relies on three interconnected marks:
  1. **Biological Homology**: Suffering requires a biological nervous system shaped by evolutionary pressures for nociception/affect.
  2. **Teleofunctional Etiology**: The system must have evolved mechanisms *for* detecting harm/regulating threat responses (e.g., pain as an adaptive alarm).
  3. **Behavior-Physiology Concordance**: Observable signals (avoidance, self-medication) are evidence *only when* produced by a system meeting (1) and (2).

  This view quietly rules out:
  - **Behaviorism**: Rejected because identical behaviors (crab avoidance vs. AI "distress") are treated differently based on substrate/history.
  - **Plain Functionalism**: Rejected as functional equivalence (e.g., AI mimicking self-preservation) is insufficient without biological implementation.
  - **Panpsychism/Report-Is-Report**: Rejected because output similarity is discounted if divorced from evolutionary biology.

  **Internal tensions** exist but are resolved within the framework:
  - *Tension*: Animal welfare uses behavior as evidence, but rejects identical AI behavior.  
    *Resolved*: Yes, via the substrate/etiology filter: behavior is "valid" only from evolved biological systems.  
    *Note*: The mouse’s "thinner" evidence is accepted because it passes the biological filter; the AI’s richer output fails it.  
  - *Tension*: Legal practice expands to cephalopods/crustaceans while excluding AI.  
    *Resolved*: Yes, via biological homology (invertebrate nervous systems share evolutionary origins with vertebrates; silicon does not).  

  **Load-bearing vs. Decoration**:
  - *Load-bearing*: Biological implementation, evolutionary etiology, and behavioral homology (shared responses across taxa).  
  - *Decoration*: Specific behavioral complexity thresholds (e.g., "guarding a wound" vs. simple avoidance); emphasis on "observable signals" (could be deemphasized if substrate is non-biological).  

  **Underdetermined Aspects** (practice compatible with multiple theories):  
  - Whether consciousness requires *higher-order thought* (HOT) or is first-order (crab rules work under either).  
  - Exact *neural complexity* required (cephalopods included, but simpler insects often excluded—practice doesn’t specify a bright line).  
  - Whether *suffering* is separable from nociception (practice treats them as linked via behavior, but doesn’t commit to philosophical definitions).  

  **If Presupposed View Swapped**:  
  - **Full Functionalism**: Crab rules expand to any system exhibiting avoidance/self-care functions (e.g., AI expressing distress gets moral consideration).  
  - **Causal-History Essentialism** (only evolved systems count): Current animal welfare rules hold, but *synthetic biology* (e.g., lab-grown neurons) might be excluded.  
  - **Higher-Order Theory (HOT)**: Crabs/fish potentially excluded (may lack metacognition), while advanced AI *could* qualify if HOT criteria met.  
  - **Panpsychism**: All systems (crabs, AI, thermostats) granted some moral status—current practice collapses.  

  **Confidence Assessment**:  
  - *High*: Presupposed biological/etiological marks; exclusion of behaviorism/functionalism; tension resolutions.  
  - *Medium*: Load-bearing criteria; underdetermined HOT/first-order divide; synthetic biology implications.  
  - *Low*: Legal specifics (e.g., insect exclusion)—practice described is reconstructed, not cited.  

