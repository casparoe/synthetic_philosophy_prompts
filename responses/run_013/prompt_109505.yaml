prompt: |-
  I'm a retired field entomologist—spent most of my career on ant trail pheromones, of all things—and since I hung up my field boots I've gotten weirdly into philosphy of biology. I now volunteer as the science advisor for a small natural history museum and a podcast, which mostly means I'm the person who has to sign off on exhibit labels and scripts. Our team keeps writing things like the beetle's horn evolved to fight rivals, or the bird's alarm call evolved to warn its relatives, and I keep thinking about Gould and Lewontin's spandrels critique of adaptationism—the argument that not every trait is an adaptation; some are byproducts, developmental constraints, drift, exaptations, or just side effects of selection on something else. The director wants a new gallery called Built by Evolution, and I can already see every label turning into a just-so story. I have about twenty minutes per script, the writers have intro bio, and I can't send them off to read the literature.

  What I need from you is a decision procedure I can actually hand to a writer. Something like a flowchart in words: the questions to ask in order, what counts as a sufficient answer at each step, where the procedure stops with a hard no on the phrase evolved for, and where it has to hand the decision back to me because it's a judgment call about evidence or rhetoric rather than a fact. I've been sketching a two-axis worksheet—current utility on one axis, historical origin on the other—and a four-box outcome: SELECTION, SIDE-EFFECT, CO-OPTED, UNKNOWN. Use that if it helps, but keep it usable by someone who last took biology in college. It should force a check for the usual alternatives—byproduct, exaptation, constraint, drift, correlated selection—before anyone is allowed to say evolved to. I also want it to say what language to use when the evidence is thin: currently functions as, is consistent with, may have been favored, we don't know, etc. And it should flag the places where judgment can't be eliminated, like how much comparative evidence is enough or whether a plausible developmental story counts as a byproduct explanation.

  Then run it on three cases so I can see how it behaves. First, a label claiming a male beetle's oversized horn evolved for fighting rival males. Second, a script claiming a bird's alarm call evolved to warn its relatives. Third, a label about my own old study system—ant trail pheromones—claiming the trail evolved to recruit nestmates. For each, show what the procedure says, what evidence would actually be needed, and what the final label language should be. Include at least one case where the procedure tells me I have to cut a claim I like—the ant one is probably going to sting—and be honest about what the procedure can't settle. No bibliography or citations, please; I need something operational, not a reading list.
reasoning: |-
  Okay, let me tackle this retired entomologist's problem. They're dealing with exhibit scripts that often frame traits as direct adaptations without considering alternatives like spandrels or exaptations. The core request is a practical decision flowchart to prevent "evolved for" language without proper justification. 

  First, I need to design a step-by-step procedure that writers with basic biology knowledge can follow. The user mentioned a two-axis worksheet (current utility vs. historical origin) with four outcomes: SELECTION, SIDE-EFFECT, CO-OPTED, UNKNOWN. That's a solid framework to build on. The key is making it actionable - concrete questions with clear pass/fail thresholds.

  For the flow, I'm thinking: start by demanding evidence the trait is heritable (step 1), then eliminate non-adaptive explanations (step 2) before even considering adaptation. Steps 3-4 would test current utility and historical origin separately. Crucially, the procedure must force writers to:
  - Reject "evolved for" if non-adaptive paths aren't ruled out
  - Use cautious language like "currently functions as" when evidence is weak
  - Flag cases needing expert judgment (e.g., interpreting comparative data)

  Now for the test cases:
  1) Beetle horns: Classic sexual selection candidate, but must check if horns could be byproducts or constraints. Writers might miss that horn size could correlate with nutrition rather than direct selection.
  2) Bird alarm calls: Sounds altruistic, but could be selfish (e.g., predator distraction) or physiological byproduct. Kin selection evidence needed.
  3) Ant pheromones: This will hurt - the user's own system. Trail pheromones might originate as waste products co-opted later. Can't assume original purpose.

  The procedure should catch oversimplifications in all three. For ants especially, it should force "co-opted" language unless paleontological evidence exists. I'll show where the flow rejects favored claims and where uncertainty remains.

  Language matters too. "Evolved for" only if both current and historical evidence converge; otherwise "functions to" or "may have been favored". And always a kill switch for "we don't know".

  Finally, acknowledge limitations: the flow can't replace expertise on evidence thresholds, but it structures the skepticism Gould/Lewontin demanded. The user needs armor against just-so stories, even beloved ones.
answer: |-
  Here's a practical decision procedure designed for your writers, structured as a flowchart-in-words. It prioritizes eliminating non-adaptive explanations first and forces cautious language. Your four-box framework (SELECTION, SIDE-EFFECT, CO-OPTED, UNKNOWN) is the output.

  **The "Built by Evolution" Label Flowchart**

  **GOAL:** Determine if we can say "evolved *for* [specific function]" or must use weaker/correct phrasing. **Always start at Step 1.**

  **Step 1: Is the Trait Heritable?**
  *   **Question:** Is there evidence this specific trait variation is passed genetically from parents to offspring? (Not just that the *type* of trait exists in the species).
  *   **Sufficient Answer:** Yes (e.g., breeding experiments, strong parent-offspring correlation in trait expression, known genetic basis). → **Proceed to Step 2.**
  *   **Insufficient/Unknown:** No direct evidence, or trait is fixed in the species (no variation). → **STOP. Outcome: UNKNOWN.** Use language like: "The trait is present...", "Scientists observe...". **Cannot say "evolved for".** *Hand back to advisor if heritability seems likely but unproven.*
  *   **No:** Evidence shows it's *not* heritable (e.g., purely environmental). → **STOP. Outcome: UNKNOWN (or Not Evolved).** Language: "Develops in response to...", "Influenced by...". **Cannot say "evolved for".**

  **Step 2: Can Non-Adaptive Explanations Be Reasonably Ruled Out?**
  *   **Question:** Is there positive evidence *against* the trait being primarily explained by **drift, developmental constraint, or a direct byproduct/pleiotropy** of selection on another trait? Check:
      *   **Drift:** Is the trait complex, costly, or show clear functional design unlikely to arise/maintain by chance? Is population size historically small?
      *   **Constraint:** Is the trait morphologically or developmentally linked to another essential trait? Could it be a non-functional consequence of growth rules? (e.g., "spandrels").
      *   **Byproduct/Pleiotropy:** Could the trait be a side-effect of selection acting on a different, closely linked trait? Is it physiologically coupled?
  *   **Sufficient Answer (Ruled Out):** Strong evidence against these (e.g., trait is complex/costly making drift unlikely; comparative evidence shows trait can vary independently of proposed constraining trait; experimental manipulation shows trait function isn't linked to another selected trait). → **Proceed to Step 3.**
  *   **Insufficient Evidence/Plausible Alternative:** No strong evidence against, or a non-adaptive explanation seems plausible based on development/physiology/comparison. → **STOP. Outcome: SIDE-EFFECT.** Language: "The trait appears as a byproduct of...", "May be linked to the evolution of...", "Could be a consequence of...". **Cannot say "evolved for [proposed function]".** *Hand back to advisor if the byproduct/constraint link is highly speculative.*
  *   **Evidence FOR Non-Adaptive:** Positive evidence supports drift/constraint/byproduct. → **STOP. Outcome: SIDE-EFFECT.** Language: As above. **Cannot say "evolved for".**

  **Step 3: Does the Trait Currently Contribute to Fitness?**
  *   **Question:** Is there evidence the trait *currently functions* in a way that demonstrably improves survival or reproduction *in the organism's natural environment*? (Focus on *current utility*).
  *   **Sufficient Answer (Yes):** Experimental or strong observational evidence (e.g., trait removal/impairment reduces fitness; trait enhancement increases fitness; clear correlation between trait variation and fitness variation in the wild). → **Proceed to Step 4.**
  *   **Plausible but Weak Evidence:** Correlative data, lab studies only, plausible function but no direct fitness measurement. → **STOP. Outcome: UNKNOWN (Current Function).** Language: "The trait currently functions as...", "Appears to help with...", "Is used for...", "May contribute to...". **Cannot say "evolved for".**
  *   **No Apparent Current Function/Unknown:** No evidence of current benefit, or function is unclear. → **STOP. Outcome: UNKNOWN.** Language: "The trait's current function is unclear...", "Scientists are investigating...". **Cannot say "evolved for".**

  **Step 4: Was the Trait *Originally* Shaped by Selection for the Proposed Function?**
  *   **Question:** Is there evidence that the *historical origin and initial modification* of the trait was driven by selection specifically for the *proposed current function*? (This is the hardest step!).
  *   **Sufficient Answer (Yes - SELECTION):** Strong phylogenetic evidence (trait origin coincides with ecological shift favoring proposed function; closely related species without trait lack the function), fossil evidence showing trait evolution linked to function, or experimental evolution data. → **Outcome: SELECTION.** Language: "Evolved *for* [function]", "Shaped by natural/sexual selection to [function]". *(Use cautiously, requires strong evidence).*
  *   **Evidence for Different *Original* Function (CO-OPTED):** Evidence suggests the trait arose for a different purpose (e.g., phylogenetic basal state has different function, developmental origin suggests different initial role). → **Outcome: CO-OPTED.** Language: "Originally may have functioned as..., now co-opted for...", "Currently used for..., though its initial evolutionary role might have been different", "Functions as...". **Cannot say "evolved *for* [current function]".**
  *   **Insufficient Evidence for Historical Origin:** No strong evidence about *why* the trait first appeared or was modified. *Even if current function is clear (Step 3).* → **STOP. Outcome: UNKNOWN (Historical Origin).** Language: "Currently functions as...", "Plays a key role in...", "Is favored by selection because it helps with...". **Cannot say "evolved *for*".** *Hand back to advisor if current utility is very strong but historical evidence is simply missing.*
  *   **Evidence Against Historical Function:** Positive evidence the trait *did not* originate for the proposed function. → **Outcome: CO-OPTED** (if current function exists) or **SIDE-EFFECT/UNKNOWN** (if not). Language as above.

  **Key Language Rules from Flowchart:**
  *   **"Evolved for X"**: Only if outcome is **SELECTION** (Passes Steps 1, 2, 3, and 4-Yes).
  *   **"Currently functions as X" / "Is used for X" / "Helps with X"**: Outcomes **CO-OPTED**, **UNKNOWN (Current Function)**, **UNKNOWN (Historical Origin)**. (Passes Step 3, but fails Step 4 or earlier).
  *   **"May be a byproduct of..." / "Could be linked to..."**: Outcome **SIDE-EFFECT** (Fails Step 2).
  *   **"The trait is present..." / "Scientists observe..." / "Its function is unclear..."**: Outcome **UNKNOWN** (Fails Step 1 or Step 3-No/Unknown).

  **Judgment Calls Flagged for Advisor:**
  *   Step 1: Is heritability *likely* even if not directly proven for this trait?
  *   Step 2: How strong is "strong evidence" against non-adaptive explanations? How plausible *is* the proposed byproduct/constraint? (Does a developmental story *count*?).
  *   Step 4: How much comparative/phylogenetic evidence is "enough" to infer historical origin? Does strong current utility *imply* historical origin without direct evidence? (Flowchart says NO, but advisor might assess plausibility).

  ---

  **Applying the Flowchart to Your Cases**

  **Case 1: Male Beetle's Horn "Evolved for Fighting Rival Males"**
  1.  **Heritable?** *Likely Yes.* Horn size/shape often shows heritable variation. → Proceed.
  2.  **Rule out Non-Adaptive?** *Tricky.* Could it be a costly display correlated with overall condition (honest signal)? Could it be constrained by allometry (growth rules)? Evidence needed: Experiments removing horns - do males lose fights? Is horn size *specifically* targeted by sexual selection (female choice or male-male competition), or just correlated with body size? If horn removal *directly* reduces mating success in fights, non-adaptive explanations weaken. → *If strong experimental evidence exists, proceed. If only correlation, likely INSUFFICIENT - STOP (SIDE-EFFECT). Let's assume good evidence.* → Proceed.
  3.  **Current Function?** *Strong evidence likely.* Observations of horn use in fights, experiments showing hornless males lose more fights/have lower mating success. → Proceed.
  4.  **Historical Origin for Fighting?** *Evidence needed:* Comparative evidence - do basal beetle species with smaller/absent horns show less male combat? Fossil evidence (rare)? Could the horn originate from a defensive structure? If phylogeny shows horns evolving coincident with intense male competition, supports SELECTION. If horns appear in lineages without combat first, suggests CO-OPTION. → **Likely JUDGMENT CALL for Advisor.** If horned and hornless sister species differ in combat intensity, it's strong for SELECTION. If all horned species fight, but no close relatives without horns, it's **UNKNOWN (Historical Origin)**.
      *   **Outcome (if strong comparative evidence): SELECTION.** Language: "The male beetle's horn evolved for use in fights with rival males."
      *   **Outcome (if weak/no historical evidence): CO-OPTED or UNKNOWN (Historical Origin).** Language: "Male beetles use their oversized horns to fight rival males" or "The horn currently functions as a weapon in male-male competition."

  **Case 2: Bird's Alarm Call "Evolved to Warn its Relatives"**
  1.  **Heritable?** *Likely Yes (variation in call structure/usage).* → Proceed.
  2.  **Rule out Non-Adaptive?** *CRITICAL.* Could it be a simple startle reflex? A byproduct of stress physiology? Selfish (mobbing to deter predator, confusing predator, warning offspring *specifically* is self-interest)? Evidence needed: Experiments - does calling *increase* the caller's risk? Do callers without kin nearby still call? Does call structure minimize caller's risk (e.g., hard to locate)? If calling is costly *and* benefits non-relatives equally, kin selection weak. If call design minimizes risk to caller, suggests selfish benefit. → *If strong evidence shows cost is paid specifically to aid kin (e.g., callers with more kin nearby call more, even at higher personal risk), non-adaptive/selfish explanations weaken. If evidence is mixed or shows selfish benefits, STOP (SIDE-EFFECT - byproduct of stress/selfish).* → *Assume good evidence for kin-directed benefit.* → Proceed.
  3.  **Current Function?** *Strong evidence likely.* Playback experiments showing calls elicit escape in others, callers often have kin nearby, calls sometimes specific to predator type. → Proceed.
  4.  **Historical Origin for Warning Kin?** *Evidence needed:* Comparative evidence - do species with cooperative breeding/strong kin groups have more complex alarm calls? Do solitary species have simpler/no calls? Could alarm calls originate as simple startle reflexes or selfish mobbing signals? If phylogeny shows complex kin-directed calls evolving only in lineages with social structures, supports SELECTION for kin warning. If simple calls exist in solitary species and get elaborated in social ones, suggests CO-OPTION. → **Likely JUDGMENT CALL for Advisor.** Strong phylogeny needed. Without it: **UNKNOWN (Historical Origin)**.
      *   **Outcome (with strong phylogeny): SELECTION.** Language: "This bird's alarm call evolved to warn its close relatives."
      *   **Outcome (likely): CO-OPTED or UNKNOWN (Historical Origin).** Language: "Birds give alarm calls that warn nearby flock members, often including relatives" or "The alarm call functions to alert other birds, including relatives, to danger."

  **Case 3: Ant Trail Pheromone "Evolved to Recruit Nestmates"** (The Sting!)
  1.  **Heritable?** *Yes.* Pheromone production is genetically controlled. → Proceed.
  2.  **Rule out Non-Adaptive?** *HIGHLY RELEVANT.* Could trail pheromones originate as **byproducts** of cuticular hydrocarbons (CHCs) used for waterproofing/nestmate recognition? Or as metabolic waste products? Evidence needed: Is the trail pheromone chemically distinct from CHCs/waste? Is its production pathway unique or shared? If trail pheromones are modifications of ubiquitous ant CHCs or waste compounds, BYPRODUCT is very plausible. → *Strong evidence needed to rule this out.* → **Likely INSUFFICIENT to rule out Byproduct.** → **STOP. Outcome: SIDE-EFFECT (byproduct origin).**
      *   **Final Language:** "Ants use trail pheromones to efficiently recruit nestmates to food sources. These communication chemicals may have originated as byproducts of other essential physiological processes." (Cannot say "evolved for recruitment" - the origin is likely not adaptive *for that function*).
      *   **Why it Stings:** Your incredible work showed the *current utility* and sophistication. The flowchart forces us to confront the likely *historical origin*. Recruitment is almost certainly a case of **CO-OPTION** (if we passed Step 2) or started as a **SIDE-EFFECT**. Saying it "evolved for" recruitment overstates the evidence for the *origin*. The procedure forces you to cut the "evolved for" claim you like, based on plausibility of non-adaptive origin, even though its current utility is undeniable.

  **What the Procedure Can't Settle (Advisor's Role):**
  *   **Evidence Thresholds:** How many experiments? How strong a phylogenetic signal? The advisor must judge sufficiency.
  *   **Plausibility vs. Evidence:** Is a developmental byproduct story *so* plausible it outweighs weak selection evidence? (Flowchart flags Step 2 for this judgment).
  *   **Rhetorical Balance:** When is "currently functions as" too weak for exhibit impact vs. "evolved for" being too strong? The advisor must decide the museum's voice.
  *   **Edge Cases:** Complex traits with mixed evidence, multi-function traits.

  This procedure forces writers to confront alternatives before claiming adaptation, mandates cautious language, and clearly flags where expert judgment is essential. It won't eliminate all just-so stories, but it will make them harder to write unintentionally.
