answer: |-
  *(Leans forward, eyes bright with intellectual combat but no hostility)*  
  Ah, Lange! Clever, elegant—and fundamentally *blind* to the kinetic reality of capital. You’ve described a thermostat, not a market. Let’s dissect why this *simulation* fails where genuine markets *discover*.  

  **First, the fatal mirage of "parametric prices."** Your Central Planning Board (CPB) sets a price for, say, steel. Factory managers obediently minimize costs against that price. Splendid! But *where did the steel price come from*? The CPB adjusts it based on surpluses or shortages of *final goods*. That’s reactive, not anticipatory. In a real market, the price of steel isn’t just about today’s car production or skyscraper construction. It’s a forward-looking *bet* on *future* applications—hydrogen pipelines, asteroid mining equipment, fusion reactor prototypes. Entrepreneurs bid for steel *now* based on speculative valuations of *unborn* technologies. Lange’s CPB only sees the shadow of yesterday’s errors.  

  **Second, the corpse of capital.** When your factory manager "minimizes average cost," they treat machines, land, and raw materials as *given* inputs with fixed prices. But capital isn’t inert! Its value *is* its potential to morph into new configurations. A real market isn’t just shuffling resources—it’s *continuously redefining what resources are*. The absent capitalist isn’t a spreadsheet jockey; they’re the one who looks at a derelict textile mill and sees a server farm, or who scraps a functional lathe because a competitor’s innovation just made it obsolete. Without ownership stakes, your managers are optimizing against a static snapshot. The CPB’s prices are *echoes*, not live signals.  

  **Third, the illusion of iteration.** "Nudging prices" works for consumer goods with immediate feedback. But capital? The payoff horizon stretches *years*. By the time your CPB sees a "shortage" of semiconductor-grade silicon, the market’s entrepreneurs have already pivoted to gallium nitride, bought up mines, and bankrupted laggards. Trial-and-error is lethal when errors take half a decade to manifest. Markets don’t just "iterate"—they run ten thousand parallel experiments *with real skin in the game*. Lange’s system has no mechanism to *generate* the novel alternatives being trialed.  

  **Fourth, the corpse can’t scream.** You say: "Set output where marginal cost equals price." But *what is the marginal cost of capital?* Without asset markets, there’s no liquidation value, no hostile takeovers, no bankruptcy auctions to *reveal* that this factory’s "cost" is actually an enormous drain on resources better deployed elsewhere. State-owned factories don’t go bankrupt—they just accumulate silent losses masked by political patronage. The CPB sees unsold tractors; it doesn’t see the *phantom farm* that *wasn’t built* because those resources were squandered.  

  Lange’s model is a Viennese waltz performed by skeletons. The steps are correct, but there’s no blood, no breath, no *hunger*. Markets aren’t algorithms—they’re arenas for entrepreneurial *imagination* married to financial *consequence*. You’ve replaced the explorer with a surveyor copying old maps.  

  ---

  **You:** (Quietly, after a beat) *The weakest point? Hand-waving away the CPB’s potential to mimic "forward-looking bets" by aggregating technical reports. A sophisticated planner could, in theory, simulate entrepreneurial forecasts.*
