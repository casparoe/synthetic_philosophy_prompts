answer: |-
  ## Final Mill Fire Memorial Speech

  **(Start with bottom line:) We end this public service to tend better to the living, while trusting the twenty-three to the care of those who hold them close.**

  Look at this room. Three rows here hold half a century of grief and loyalty. You knew faces, voices, stories. You kept faith. Behind, faces newer to this town carry their own losses, from places where the ground holds unmarked graves and silence reigns. Your question last year – *why these twenty-three, and not others?* – deserves honesty.

  The hard truth is this: memory binds first along the lines of kinship and shared ground. We, as *this* town, owed *these* twenty-three our witness because they were ours. That duty was real, and it was ours alone to carry. We kept it, year after year. But memory is also a weight carried by the living. It can be a bruise pressed, a scar kept open. There comes a time when the act of collective remembrance shifts from sustaining community to holding it fast to a single point of pain.

  Ending this service isn't about forgetting them. It isn't because a plaque on a wall or words on a screen are enough. They aren't. A plaque marks a fact; a website stores information. They are tools, not absolution, not true comfort. They don't replace the shared breath in this room, the bowed heads. But they *do* hold the names, the date, the place – a fixed point for anyone who seeks it.

  We end it because the energy of care, the resources of community, must also flow towards the living who are here *now*, building lives among us, some fleeing their own unmourned ruins. It is right to tend to our present bonds and burdens.

  So we lay down this public ritual. The duty to remember these twenty-three passes now, quietly, deeply, into the hands and hearts of the families and friends who knew them – as it always truly resided there. For the rest of us, the plaque stands. The story remains. But our shared act of remembrance here, today, ends. We turn, respectfully, towards the living hands reaching for ours.
