prompt: |-
  I've been reading rationalist blogs since the old OB days, and I've never quite got my head around coherent extrapolated volition. Everyone talks about it like its the gold standard for aligning AI with human values. But here's my confusion: if CEV is just what we'd want if we knew more, thought faster, were more the people we wished we were, and had grown up together, then isn't it by definition the correct thing to want? And if idealized preferences are what we'd have under ideal conditions, doesnt that make them objectively true values, so the whole is-ought gap just disappears? Like, if we could compute CEV, we'd have a procedure that spits out the morally right answer, and any remaining disagreement would just be because someone hasn't been extrapolated enough. But then people say CEV isn't a moral theory and doesn't tell us what to do, and I dont get how both can be true. Also, if CEV is supposed to be coherent, what happens when our extrapolated selves disagree with each other? Does it average them, or pick the one with the most reflective endorsement, or what? I guess I'm asking: since CEV is defined as what we would want under idealized conditions, why isn't it just the same as ideal observer theory, and why doesn't that make it objectively authoritative?
reasoning: |-
  Okay, the user is really diving deep into Coherent Extrapolated Volition (CEV). They've been following rationalist blogs since the old Overcoming Bias days, so they're not new to this. Their confusion centers around why CEV isn't treated as an objective moral truth if it's what humans would want under idealized conditions. They bring up the is-ought gap, questioning why CEV doesn't bridge that, and also wonder how conflicts between extrapolated selves are resolved.

  First, I need to unpack their main points. They see CEV as the "correct" desires because it's what we'd want with more knowledge, coherence, etc. They're equating it to ideal observer theory, which is an objective moral standard. But they're confused because proponents say CEV isn't a moral theory. The user is struggling with the tension between CEV's definition and its lack of prescriptive authority.

  The user also asks about resolving disagreements among extrapolated selves. They mention averaging or reflective endorsement. That shows they're thinking about the practical implementation of CEV, which is a common sticking point. They might be looking for clarity on how CEV handles conflicting values post-extrapolation.

  I should start by distinguishing CEV from moral objectivity. CEV is descriptive—it's about aggregated preferences under ideal conditions, not moral truths. The is-ought gap persists because even idealized desires are still desires, not oughts. The user needs to understand that CEV doesn't claim moral authority; it's a alignment tool for AI, not a philosophy.

  Next, addressing the ideal observer theory comparison. CEV is more about what we *would* want, not what an impartial observer deems right. The user might be conflating procedural rationality with moral correctness. Explaining that coherence and reflection don't equate to moral truth is key here. Even idealized humans might have different values, and there's no external standard to judge them.

  The resolution of disagreements is tricky. The original CEV proposal is vague on this. The user's mention of averaging or reflective endorsement shows they're aware of possible methods. But the answer is that CEV doesn't prescribe a method; it's part of the unresolved complexity. The coherence condition implies resolving contradictions, but how? This ambiguity is a limitation they need to accept.

  Underlying needs: The user might be seeking a reliable moral framework. They're drawn to CEV as a solution to moral uncertainty but are frustrated by its ambiguities. They want to know if CEV can provide objective answers, which reflects a deeper desire for moral certainty in AI alignment. Addressing this means clarifying CEV's role as a tool, not a philosopher.

  I should also consider their background. Long-time reader of rationalist blogs, so they're familiar with concepts like Bayesian reasoning, utilitarianism, etc. They might appreciate references to Yudkowsky's original writing. But since they're confused, avoiding jargon and breaking it down step-by-step is essential.

  Finally, emphasizing that CEV is a proposal, not a finished theory. Its implementation challenges are why it's not a silver bullet. The user needs to understand that while CEV aims for alignment, it doesn't solve meta-ethics. Their frustration is valid because CEV's promise is grand, but its mechanics are underdefined. Acknowledging this gap can help them see why experts are cautious about calling it objective.
answer: |-
  You've hit the core philosophical tension surrounding CEV brilliantly. Your confusion is entirely justified and stems from fundamental questions in meta-ethics and the ambitious nature of the CEV proposal itself. Let's break this down:

  1.  **The "Correctness" Intuition & The Is-Ought Gap:**
      *   **Your Point:** If CEV is what we *would* desire under conditions of perfect knowledge, rationality, reflection, and mutual understanding, then surely *that* is what we *should* desire. It feels like reaching the "true" or "objectively best" set of preferences, collapsing the is-ought gap.
      *   **The CEV Counter:** Proponents argue CEV avoids claiming *objective moral truth* in several ways:
          *   **Descriptive, Not Prescriptive (At its Core):** CEV is fundamentally an *anthropological* or *psychological* project. It asks: "What *would* these specific beings (humans) converge upon if idealized?" It doesn't claim that what they converge upon is *inherently morally good* in a universal sense. It's descriptive of *human* volition, not prescriptive about what *is* good.
          *   **The Is-Ought Gap Persists:** Even if we perfectly computed what idealized humans *would* want ("is"), that doesn't logically entail that we *ought* to want that *now*, or that it *is* morally right. Why should the preferences of hypothetical future idealizations bind us? CEV proponents might argue it *is* binding *because* it's the best representation of "our own true will," but this shifts the justification to a *procedural* one (it's *ours*, just refined), not an assertion of objective moral truth. The "ought" comes from the premise that we *want* to be governed by our own best selves, not because CEV discovers Platonic Forms of the Good.
          *   **No External Standard:** CEV doesn't reference an external moral reality. It's entirely internal to the extrapolated preferences of humanity. An ideal observer theory might posit an impartial, omniscient judge *external* to humanity. CEV's "idealization" is immanent to *us*.

  2.  **CEV vs. Ideal Observer Theory:**
      *   **Similarities:** Both involve counterfactual idealization (more knowledge, rationality, impartiality).
      *   **Crucial Differences:**
          *   **Subject:** Ideal Observer theories typically posit a *single*, perfectly impartial, disinterested observer *judging* what is right/good. CEV focuses on the *extrapolated, interacting preferences of the actual population* (humanity).
          *   **Focus:** Ideal Observer seeks *moral truth*. CEV seeks *coherent, extrapolated volition* – what we *would will*, not necessarily what *is right*.
          *   **Output:** An Ideal Observer outputs a moral judgment ("X is good/bad"). CEV outputs a set of *preferences* or *volitions* ("We would want X"). While these outputs might often align, they are conceptually distinct. CEV could potentially output preferences an Ideal Observer might deem immoral (though proponents hope the idealization prevents this).

  3.  **Why Isn't CEV Authoritative? (The Procedural vs. Substantive Authority):**
      *   CEV *is* intended to be *procedurally authoritative* for an AI tasked with fulfilling human values. The AI's mandate is: "Do what we *would* want if extrapolated." *Within that framework*, the output is authoritative.
      *   **It's NOT substantively authoritative** in the sense of:
          *   **Providing Ultimate Moral Justification:** It doesn't answer *why* we should care about fulfilling human CEV rather than, say, dolphin CEV or maximizing paperclips. Its justification rests on the premise that humans built the AI to serve *human* values.
          *   **Settling Meta-Ethical Disputes:** It doesn't resolve philosophical debates about moral realism, subjectivism, etc. It's an operationalization of a specific value (fulilling *human* volition) under idealization, not a proof of that value's objective status.
          *   **Being Unquestionable:** We can still ask: "What if CEV outputs something horrific?" Proponents would argue the idealization (knowledge, reflection, coherence) makes this vanishingly unlikely. Critics remain skeptical. Even if it outputs something seemingly good, we can question the process itself.

  4.  **The Coherence Problem (Resolving Disagreements):**
      *   This is arguably the **Achilles' heel** of CEV as a clear concept. The original description is notoriously vague on *how* coherence is achieved when extrapolated individuals disagree. Here are the main interpretations and their problems:
          *   **Aggregation/Averaging:** Simply averaging preferences likely violates "coherence" and loses the nuance of individual extrapolated volitions. What metric would you average? Intensity? Reflective endorsement?
          *   **Consensus through Dialogue:** The "grown up together" clause hints at extrapolated individuals engaging in idealized discourse until they reach unanimous agreement. This relies heavily on the assumption that full knowledge and rationality *inevitably* lead to consensus on all value-laden issues. This is a massive, highly contested philosophical assumption (e.g., debates about pluralism, incommensurable values). History and philosophy offer little evidence for inevitable convergence.
          *   **Reflective Equilibrium/Endorsement:** The process finds the set of preferences that the extrapolated versions of *each individual* would stably endorse upon full reflection, even if those preferences differ *between* individuals. Coherence might mean internal consistency *within* each extrapolated individual's preference set and consistency *between* the sets (no logical contradictions in outcomes when all are enacted). This allows for value pluralism but raises huge implementation questions: How do you resolve conflicts *between* different coherent individual CEVs? Is there a meta-preference structure?
          *   **Emergent Coherence:** The extrapolation process itself, by simulating the interactions of idealized minds under the "grown up together" condition, *naturally* outputs a single coherent volition. This is more of a hope than a defined mechanism.

  **In Summary: Addressing Your Core Questions**

  *   **"Isn't CEV the correct thing to want?"** *Procedurally, within the goal of fulfilling "true" human values*, yes, CEV aims to be exactly that. *Meta-ethically*, it doesn't claim to discover objective moral truth, only the best extrapolation of what *we* (humans) would want.
  *   **"Doesn't that make them objectively true values?"** No. It makes them the *idealized preferences of a specific species*. Their "authority" comes from the goal of building AI to serve *human* values, not from objective moral truth.
  *   **"Why doesn't the is-ought gap disappear?"** Because discovering what we *would* ideally want ("is") doesn't automatically mean we *ought* to follow it *now* (absent the premise that we built the AI to do so), nor does it prove that preference set is *inherently good*.
  *   **"Why isn't CEV just ideal observer theory?"** CEV focuses on the *collective volition* of the actual population under idealization, not the judgment of a single *external* impartial observer. Its output is preferences, not moral pronouncements.
  *   **"How are disagreements resolved?"** This is the biggest unresolved ambiguity. The original concept relies on the vague hope that idealization ("know more, think faster, be more who we wish to be, grown up together") *somehow* forces coherence, likely through consensus or emergent compatibility. Critics find this deeply unconvincing and hand-wavy.

  **The Core Tension:** CEV tries to be a *descriptive* account of idealized human preference (avoiding the is-ought problem) while simultaneously needing to be *authoritative* enough to guide a potentially superintelligent AI. Its proponents hope the descriptive idealization *results* in something so compellingly "ours" and "good" that it *feels* authoritative, but they generally avoid claiming it bridges the is-ought gap or provides objective moral truth. The unresolved coherence problem highlights the immense difficulty of moving from billions of messy, conflicting human preferences to a single "coherent extrapolated volition."

  Your intuition that CEV *feels* like it *should* be objectively right is understandable – that's part of its appeal and why it resonates. But its proponents deliberately frame it as a procedural solution to the alignment problem ("what *would* they want?") rather than a meta-ethical claim about the nature of the good. The devil, as always, is in the unresolved details, especially the "coherence" mechanism.
