prompt: |-
  My sister runs visitor experience at a mid-size city art museum, and she's asked me to write the copy for something they're doing next spring. The backstory, which is invented but not by much: their best-loved painting — a big moody 17th-century harbor scene that's been on the cover of every membership brochure since 1974 — has just been reclassified. It's not by the man on the label. It's a forgery, painted in the 1930s by someone who, on the museum's own revised assessment, was a better painter than the person he was copying, and who got caught only because a grad student found a letter he'd written admitting everything, sixty years after he died. The board has decided not to take it down. Instead they're rebranding the whole wing as the Hall of Beautiful Lies, and they want a press release that sells this as a principled stance rather than a face-saving one.

  Could you write that press release for me? Headline, dateline, maybe 500-600 words, in the voice of a real museum communications office, so it reads like something that could actually run in a paper — which is the joke, since it isn't realy a joke. Every argument the director makes for keeping the thing on the wall should be one that somebody actually holds or could hold, drawn from the genuine fight over whether a forgery is worth less than the original when the two are perceptually indistinguishable: the thought that what you can see is all the aesthetic value there is, up against the thought that a work's value comes from the history that produced it. I want the usual objections to land without the director ever flagging them as objections — that the "original" label was always a social fact maintained by experts, that a painting's price tracks its story and not its surface, that visitors will now be paying admission to be lied to. She should be entirely sincere, a little defensive about the endowment. And there's one bit I specifically want paid off rather than just mentioned: the museum is launching a Certificate of Inauthenticity you can buy in the gift shop, plus a new ticketing tier where the fake costs more than the real one ever did. It should be funny to someone who's read the philosophical literature on forgery and forgery's wrongness and followable by someone who hasn't, so no citations and no name-dropping of critics or theorists — comms offices don't do that anyway.
reasoning: |-
  Okay, the user wants me to write a press release for a fictional museum scenario where they've discovered their most famous painting is a forgery. The twist is they're keeping it on display and rebranding the wing as the "Hall of Beautiful Lies." 

  First, I need to understand the core request: a 500-600 word press release in authentic museum communications voice. The director needs to present this as a principled stance, not face-saving. Key elements include addressing philosophical debates about forgery value without academic jargon, incorporating the "Certificate of Inauthenticity" gift shop item, and having higher-priced tickets for the fake artwork.

  The user's sister works in museum visitor experience, so this needs professional polish. The tone should balance sincerity with subtle humor - particularly around the gift shop certificate and tiered pricing. I should avoid making it feel like parody while letting the irony shine through for those who get the art world references.

  Philosophical angles to weave in:
  - The aesthetic experience argument (what you see is what matters)
  - Questioning how "authenticity" is constructed by experts
  - The idea that forgeries can be artistically superior
  - Museum's role as storyteller rather than just authenticator

  Important to address potential objections implicitly:
  - Visitors paying to be "lied to" → reframe as transparency about art's evolving narratives
  - Endowment concerns → position as innovative revenue model
  - Devaluing of collection → argue for expanded definition of value

  Structure thoughts:
  Dateline first - standard museum press release format. Headline should grab attention while sounding official. Opening paragraph sets up the revelation and museum's bold response. Director quote establishes core philosophy. Middle section unpacks the reasoning: discovery story, why keep it, new wing concept. Must include the grad student letter detail. Gift shop/ticketing as playful but credible extensions. Closing with future programming to show seriousness.

  For voice: slightly defensive but confident. Avoid academic terms - no "Walter Benjamin" or "Nelson Goodman" even though those theories are relevant. "Perceptually indistinguishable" is probably the most technical phrase I can use. 

  The gift shop certificate is key humor payoff - present it as earnest educational merch. Tiered pricing should mirror real museum premium experiences. Maybe call it the "Connoisseur Tier" with straight-faced benefits.

  Final check: does this make the museum sound clever rather than desperate? Is the philosophical depth there for art insiders while remaining accessible? Most importantly - would this actually run in arts section?
