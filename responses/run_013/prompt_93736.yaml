  We are creating an exam question on Good's theorem that tests understanding of the theorem, its limitations, and application to a novel case.

  The question should:
  - Force students to state and prove the theorem (via the dominance argument).
  - Explain how the slogan "information never hurts" goes beyond the theorem (the theorem is about expected utility, while the slogan might be misinterpreted as about actual utility, and the theorem requires fixed action set and costless information).
  - Present a novel case where information can hurt and identify which assumption fails.

  We design a novel case: a decision problem where learning the information changes the available actions (so the action set is not fixed) or where acquiring information is not passive (e.g., it involves a cost that is not just the cost of processing but a change in the decision problem structure).

  Case idea: 
  "Consider an investor who must decide whether to invest in a risky asset. The asset's return depends on the state of the economy (good or bad). The investor has the option to consult an expert, but the expert charges a fee. Moreover, if the investor consults the expert and the expert predicts a bad state, the investor will become so distressed that they are unable to invest at all (they freeze and take no action). If they don't consult, they can either invest or not. If they consult and get a good prediction, they can invest. But if they get a bad prediction, they are paralyzed and get 0. The payoffs are structured such that without consulting, the investor might invest and get a positive payoff in the good state and a loss in the bad state, or not invest and get 0. The expert's prediction is informative but not perfect. The distress upon hearing bad news removes the option to not invest (which would have been available without consulting) and forces 0 in that case."

  This case breaks the assumption that the set of available actions is the same regardless of whether the information is acquired. Specifically, when the investor learns bad news, the action set shrinks (only inaction is available, and it gives 0). Without consulting, the investor had the option to not invest (which also gives 0) and the option to invest (which might be positive or negative). So the action set changes.

  Alternatively, we can think of it as the act of acquiring information (consulting) having a direct effect on the available actions in some states (here, when the signal is bad). This violates the assumption that the information is free (in the sense that it doesn't change the decision problem structure) and that the action set remains constant.

  Now, the question:

  1. The question text:

  "Good's theorem states that, for a Bayesian decision maker, the expected value of free information is non-negative. 

  (a) State the theorem precisely and provide the one-line dominance proof. [5 marks]

  (b) Explain how the slogan 'information never hurts' goes beyond what the theorem actually guarantees. [5 marks]

  (c) Consider the following scenario:

     An investor is deciding whether to invest in a start-up. The start-up will succeed (yielding a profit of $100,000) only if the economy is strong; if the economy is weak, the investment will fail (leading to a loss of $50,000). The investor's prior probability that the economy is strong is 0.6. The investor has two options: 
        - Option 1: Invest without further information.
        - Option 2: Consult an economic expert at a cost of $1,000. The expert's prediction is accurate 90% of the time. However, if the expert predicts a weak economy, the investor becomes so distressed that they are unable to make any investment decision and so they do nothing (which yields $0). If the expert predicts a strong economy, the investor proceeds to invest.

     Without consulting, the investor can choose to invest or not invest (not investing yields $0). 

     Explain whether Good's theorem applies to this situation. If not, identify which assumption of the theorem is violated and show how the expected value of the information from consulting the expert could be negative. [15 marks]"

  Total: 25 marks.

  What we are testing:
  - Part (a): Knowledge of the theorem and the proof.
  - Part (b): Understanding of the limitations of the theorem and the slogan.
  - Part (c): Application to a novel case, identifying the violated assumption, and computing the expected value to show it can be negative.

  2. Model answer (approx 700 words):

  (a) Good's theorem states that for a Bayesian decision maker, the expected utility of acquiring costless information, before choosing an action from a fixed set of actions, is at least as great as the expected utility of making a decision without that information. 

  The one-line dominance proof: For any fixed decision rule that maps possible pieces of information to actions, one can always choose the rule that ignores the information and takes the same action as one would have taken without the information. Therefore, the optimal decision rule with the information must yield at least as much expected utility as that fixed rule, and hence at least as much as acting without the information.

  (b) The slogan "information never hurts" is often taken to mean that in every possible state of the world, having more information cannot result in a worse outcome. However, Good's theorem only guarantees that the ex-ante expected utility (before seeing the information) is non-decreasing when we acquire information. It does not guarantee that in every possible realization the decision maker is better off. In fact, after seeing the information, one might end up taking an action that leads to a worse outcome in the actual state than the action one would have taken without the information. Moreover, the theorem assumes that information is free (no cost) and that the set of available actions remains the same regardless of whether the information is acquired. The slogan might lead one to overlook situations where these assumptions fail, such as when acquiring information changes the decision problem (e.g., by altering the action set or incurring costs beyond the decision maker's control).

  (c) In this scenario, Good's theorem does not apply because one of its key assumptions is violated: the set of available actions is not fixed. Specifically, when the investor consults the expert and receives a prediction of a weak economy, the investor becomes distressed and cannot invest. This effectively removes the action of investing from the choice set in that contingency. Without consulting, the investor has the full set of actions: invest or not. 

