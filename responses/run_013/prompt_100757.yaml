prompt: |-
  Alright — I need help writing the final for a seminar I'm TAing on Dewey and democracy, and I want to build the essay question around something that actually happened to me this spring, because every practice question I've tried just comes back as a summary of Democracy and Education and that's not the point of the exam.

  So I got roped onto my neighborhood's participatory-budgeting steering committee. In theory it's democracy-as-inquiry in the flesh: we meet, frame the problem, hear from residents, deliberate, then vote on which projects get the money. And it sort of worked, except for three things I can't stop chewing on.

  First, the deliberation stage got captured. The most confident, most fluent people set the frame (there's one guy who just loves a microphone), and by the time we voted, the vote was basically ratifying whatever the loudest framing had been. Nobody moved. The "inquiry" felt like theater and the vote was the real thing.

  Second, when our process picked a project, the group that lost kept saying "fine, we'll see" — and it hit me that we never actually will. There's no control group. We can't run the counterfactual where we funded the other project and watch what happens. So in what sense was any of it an experiment?

  Third, and this is the one that bugs me: the whole problem situation was handed to us. The city council set the budget envelope and the eligible categories. We never got to inquire into whether those were even the right questions.

  So here's the question I want to ask, and I want it to be something you can't answer by reciting Dewey's definition of inquiry or the line about democracy being a way of life. Roughly: take the strongest of my three worries, and tell me whether Dewey's experimentalism about democracy actually has the resources to answer it, or whether it needs patching — and if it needs patching, what the patch costs him. I want them to say which piece of the machinery (the indeterminate problem situation, the hypothesis, the test, the public) is doing the load-bearing work and which piece is expendable, and I want them to take a stand on whether "democracy is experimental" survives a case where there's genuinely no controlled test to be had.

  Can you write me (1) the question — upper-level seminar, 90 minutes, no citations needed, argue from the ideas, not from the texts; (2) a model answer of about 600 words; and (3) a marking scheme as a table so I can grade fast. Table columns: Move / What earns full credit / Marks / Common way students miss it. Total 20 marks, and make the A-versus-B line a specific move, not just "more detail." Then give me a short JSON summary with fields: question_stem, crux, must_hit_moves (a list), total_marks, hardest_move. Thanks — and please don't let the model answer turn into a lit review, since the students can't look anything up and neither can whatever's answering this.
reasoning: |-
  We are designing an essay question for a seminar on Dewey and democracy. The TA has experienced a real-world participatory budgeting process that raised three concerns about the practical application of Dewey's ideas. We are to create:

  1. The essay question (for a 90-minute exam, no citations, argue from ideas).
  2. A model answer (about 600 words) that addresses the concerns without being a literature review.
  3. A marking scheme as a table (columns: Move, What earns full credit, Marks, Common way students miss it). Total 20 marks, with the A/B line being a specific move.
  4. A short JSON summary with specified fields.

  The question should focus on the strongest of the three worries (as chosen by the student) and ask whether Dewey's experimentalism has the resources to answer it or needs patching. It should also require analysis of which part of the machinery (problem situation, hypothesis, test, public) is load-bearing and which is expendable, and whether democracy as experimental survives when there's no controlled test.

  The three worries are:
  1. Deliberation captured by the most confident and fluent, making inquiry theater and the vote a ratification.
  2. The lack of a control group (we can't run counterfactuals to test the outcome).
  3. The problem situation was handed down (the city council set the budget and categories, so the group didn't get to question the frame).

  We'll design the question to let the student pick the strongest worry.

  Let's create the question first:

  **Question Stem:**
  "Drawing from Dewey's conception of democracy as a form of experimental inquiry, analyze one of the following three challenges encountered in a participatory budgeting process (described below). Your analysis must:

  a) Explain whether Dewey's framework has the conceptual resources to address the challenge or whether it requires modification ('patching').
  b) If modification is needed, specify what the modification would entail and what it would 'cost' Dewey (i.e., which of his core commitments might be compromised).
  c) Identify which element of the experimental process (the indeterminate problem situation, hypothesis formation, testing, or the public) is doing the most critical work in your analysis and which might be expendable in this context.
  d) Argue whether Dewey's claim that 'democracy is experimental' can withstand the specific challenge you selected, particularly in the absence of controlled tests (as in worry #2) or analogous limitations.

  The Challenges:
  1. Deliberation captured: The most confident and fluent participants set the frame, turning inquiry into theater and reducing the vote to ratification.
  2. No control group: There is no way to run a counterfactual to test the outcome of the chosen project against the rejected one.
  3. Handed-down problem situation: The budget envelope and eligible categories were set by the city council, so the group never questioned whether these were the right problems.

  Choose the challenge you find strongest for testing Dewey's experimentalism.

  Note: Argue from Dewey's ideas, not from textual exegesis. No citations required."

  Now, for the model answer, we'll pick one worry (say, the third one, because it's foundational) and write a 600-word response. However, note that the question allows the student to pick any one. The model answer will demonstrate the structure and depth.

  **Model Answer (approx. 600 words):**

  In Dewey's vision, democracy is a collective experiment in solving shared problems through intelligent inquiry. This requires that the public engage in a continuous cycle of framing problems, proposing solutions, testing them, and learning from the results. The third challenge I select—the handed-down problem situation—strikes at the heart of this process because it prevents the community from engaging in the initial, critical step of defining the problem. In this case, the city council set the budget and categories, pre-structuring the inquiry and effectively outsourcing the problem-posing stage. Dewey's experimentalism, I argue, lacks the resources to fully address this challenge without patching, and the patch comes at a significant cost to his ideal of a self-governing, learning community.

  Dewey's experimentalism begins with an "indeterminate situation" that the public must transform into a determinate one by identifying the problem. This initial stage is load-bearing because it sets the trajectory of inquiry. Without the freedom to define the problem, the community cannot fully exercise its intelligence. In our case, the steering committee was handed a pre-determined problem (how to allocate a fixed budget among pre-approved categories), which constrained the inquiry from the outset. Dewey might respond that even within constraints, the public can still engage in experimental inquiry. However, the core of the challenge is that the constraints were not themselves subject to inquiry. This is a gap in Dewey's framework: he assumes that the public will have the opportunity to frame the problem, but in complex societies, problem framing often occurs in specialized institutions (like the city council) that are removed from the public.

  To patch this, we might insist that any experimental process must include a meta-inquiry into the problem frame itself. This would mean expanding the experimental cycle to question the boundaries set by authorities. However, this patch costs Dewey two things: first, it complicates his model by adding a recursive layer that may be impractical in many real-world settings (due to time, expertise, or power constraints). Second, it risks undermining the authority of existing institutions, which Dewey sees as necessary for coordinating action in a large society. Dewey's experimentalism relies on existing social structures to set the stage for inquiry, but this challenge reveals that those structures may themselves be obstacles to genuine inquiry.

  The critical element here is the "indeterminate problem situation." It is load-bearing because without a genuinely open starting point, inquiry becomes instrumental rather than transformative. The "public" element, in this context, becomes somewhat expendable if we accept that problem framing might be delegated to representatives. But Dewey would resist this, because for him the public must be the author of its own inquiries.

  Finally, can Dewey's experimentalism survive without controlled tests? The absence of control groups (as in worry #2) is less damaging than the handed-down frame because Dewey's notion of "testing" is broader than laboratory controls. For him, experience is the test: we learn from the consequences of our actions. However, in the case of a pre-set problem frame, the very scope of experience is narrowed. Thus, while the lack of controlled tests is a challenge, it is the lack of control over the problem frame that most threatens Dewey's experimentalism because it limits the public's capacity to learn at the most fundamental level.

  In conclusion, Dewey's experimentalism needs patching to address the challenge of handed-down problem situations. The cost is a more radical, recursive form of democracy that may be difficult to achieve, but without it, democracy risks becoming a technical exercise within predetermined limits, rather than a true experiment in living.

  **(Word count: 599)**

  Now, the marking scheme table. We'll have several moves that the student must make. Total 20 marks. The moves:

  1. **Selection and Explanation of the Challenge** (3 marks): Student clearly describes one of the three challenges and explains why it is a problem for Dewey's experimentalism.
  2. **Analysis of Dewey's Resources** (4 marks): Student argues whether Dewey's framework can handle the challenge without patching, with clear reasoning.
  3. **Proposal and Cost of Patch (if needed)** (4 marks): If patching is needed, the student proposes a modification and explains the cost to Dewey's core ideas. If not, they defend why Dewey's framework is sufficient.
  4. **Load-bearing and Expendable Elements** (4 marks): Identifies which part of the machinery (problem situation, hypothesis, test, public) is critical and which might be expendable, with justification.
  5. **Survival of Experimental Claim** (3 marks): Takes a stand on whether "democracy is experimental" survives the chosen challenge, especially regarding the absence of controlled tests (if relevant).
  6. **Overall Coherence and Argumentation** (2 marks): The essay is well-structured, logical, and addresses the question.

  But note: the question also requires addressing the absence of controlled tests in part (d). We have incorporated that in move 5.

  However, the question says: "and I want them to take a stand on whether 'democracy is experimental' survives a case where there's genuinely no controlled test to be had." So even if they pick a worry other than #2, they must consider the controlled test issue? Actually, the question says: "particularly in the absence of controlled tests (as in worry #2) or analogous limitations." So if they pick worry #2, they must address the controlled test; if they pick #1 or #3, they must address analogous limitations (i.e., the absence of controlled tests in a broader sense, or the specific limitation they chose).

  We'll adjust move 5 to be about the survival of the experimental claim in light of the challenge and the issue of controlled tests (or analogous).

  We'll also set the A/B line at the "Analysis of Dewey's Resources" (move 2) because that is the crux of the argument.

  **Marking Scheme Table:**

  | Move | What earns full credit | Marks | Common way students miss it |
  |------|------------------------|-------|----------------------------|
  | Selection and Explanation of the Challenge | Clear description of one challenge and why it is a problem for Dewey's experimentalism. | 3 | Only describes the challenge without explaining the conflict with Dewey. |
  | Analysis of Dewey's Resources | Insightful argument about whether Dewey's framework has the resources to handle the challenge. Must engage with Dewey's ideas (e.g., problem situation, inquiry, public). | 4 (A/B line) | Superficial treatment; assumes Dewey can handle it without argument, or dismisses Dewey too easily. |
  | Proposal and Cost of Patch | If patching is needed, a plausible modification is proposed and the cost to Dewey (which core idea is compromised) is explained. If no patch is needed, a strong defense is given. | 4 | If patching is needed, fails to specify the cost; if not, doesn't defend sufficiently. |
  | Load-bearing and Expendable Elements | Clearly identifies which element (problem situation, hypothesis, test, public) is load-bearing and which is expendable in this context, with justification tied to the challenge. | 4 | Lists elements without justification or without specifying which is load-bearing and which expendable. |
  | Survival of Experimental Claim | Takes a clear stand on whether the experimental claim survives the challenge and the issue of controlled tests (or analogous). Addresses the broader implication for Dewey's experimentalism. | 3 | Only addresses the specific challenge without connecting to the experimental claim or the controlled test issue. |
  | Overall Coherence and Argumentation | Essay is well-organized, logical, and stays focused on the question. | 2 | Disorganized, lacks flow, or goes off-topic. |

  Total: 20 marks.

