prompt: |-
  I have been trying to work out when a choice reveals a preference and when it merely reveals something about the choice situation, and my verdicts keep colliding. A man chooses tea over coffee on Monday and coffee over tea on Tuesday: I say his preference changed, not that he had a single preference all along. A woman buys a lottery ticket: I say that reveals a preference over lotteries, not a belief that she will win. A shopper buys the jam labelled best seller when she would have bought the other jar had the labels been swapped: I say this is a menu effect, not a preference between the jams. A person pays a friend to hide her cigarettes: I say this reveals a genuine second-order preference about her future choices, not merely a preference over outcomes. Someone reports A better than B, B better than C, and C better than A, and chooses accordingly on different occasions: I say no single utility function captures her, so at least one of her choices must be explained away. But a person who chooses a smaller reward now over a larger reward later, and then, when both are delayed by a year, chooses the larger one: I say that is a genuine change in what she wants, not an inconsistency to be explained away. My tentative principle is that a choice reveals a preference only when it is robust under changes that the agent herself would count as irrelevant. Please state that principle, or a better one, precisely, give its verdicts on cases I have not listed, and say which of my verdicts it forces me to give up — and what it says about someone who chooses the option she believes is worse for her because she wants to be the sort of person who keeps her word.
reasoning: |-
  Okay, the user is grappling with a complex philosophical and economic problem about when choices reveal true preferences versus being influenced by situational factors. They've presented several thought experiments where their intuitions clash, and they're seeking a precise principle to resolve these conflicts. 

  Hmm, this is clearly someone deeply engaged with decision theory - probably a grad student or academic in economics/philosophy/behavioral science. Their examples show sophisticated understanding of preference reversals, menu effects, and time inconsistency. The frustration in "my verdicts keep colliding" suggests they've hit a wall after serious contemplation.

  The core tension they're wrestling with is the old revealed preference theory versus behavioral economics divide. They want to preserve the idea that choices reveal preferences, but need to accommodate how context shapes decisions. Their proposed principle about "robustness under irrelevant changes" is insightful but vague - smart of them to recognize it needs refinement.

  Let me unpack their cases systematically. The tea/coffee switcher seems like standard preference change over time. The lottery ticket case correctly distinguishes preference from belief. The jam labeling is a classic framing effect. The cigarette hiding is sophisticated - they're spotting meta-preferences. The cyclic preferences clearly violate transitivity. But then the delayed reward case is where their intuition diverges from standard models - they're resisting calling it "inconsistency" because the temporal perspective shift feels meaningfully different.

  Ah, and that last hypothetical about choosing against self-interest to keep promises is brilliant - it forces us to confront whether preferences are purely outcome-based. This user is really testing the boundaries of preference theory.

  The solution needs to satisfy several criteria: it must be precise enough for formal modeling, account for all their cases without ad-hoc explanations, preserve agency (no over-attribution to "situations"), and handle moral commitments. Their robustness idea is promising but needs operationalizing. 

  I think the key is distinguishing preference from choice more radically than economists typically do. We need multiple layers: base preferences over outcomes, then higher-order preferences about decision processes/perspectives. And crucially, we must accept that some situational features (like temporal distance) can rationally alter the perspective from which one evaluates options - not just "tempt" one irrationally.

  For the promise case: choosing what you believe is worse because you promised requires expanding the outcome space to include moral self-regard. The disutility of breaking a promise outweighs the material loss. No need to deny preference revelation here - just recognize the preference includes ethical dimensions.

  Where they'll need to surrender a verdict is the delayed reward case. If we're consistent, the time-inconsistent chooser either has context-dependent preferences (if we accept temporal perspective matters) or is inconsistent (if we don't). Can't have both rationality and context-independence here. Their intuition that it's "genuine change" might stem from feeling both choices were authentic in their moment - but that's exactly what the multiple selves model captures.
answer: |-
  Here's a precise formulation of your principle, refined to address the complexities in your cases:

  **Robust Preference Revelation Principle (RPRP):**
  *A choice reveals a stable preference only if it would remain unchanged under all counterfactual scenarios where:*
  1.  *The agent's core values, beliefs, and goals remain constant.*
  2.  *Only "irrelevant" contextual features are altered – features the agent would rationally dismiss as non-essential to the evaluation of the options themselves (e.g., framing, arbitrary labels, temporal proximity of identical delay intervals, choice architecture not impacting the options' inherent properties).*
  3.  *The agent is evaluating the options from the same relevant perspective (e.g., present vs. future self, abstract vs. visceral state).*

  **Key Implications & Verdicts on Your Cases:**

  1.  **Tea/Coffee Switcher:** **Agrees with you.** Changing the day is an "irrelevant" contextual feature under RPRP. The reversal reveals a genuine change in core taste preference (values/goals). No stable preference is revealed across days.
  2.  **Lottery Ticket Buyer:** **Agrees with you.** Buying the ticket reveals a preference for the *lottery* over the certain alternative cost (e.g., not buying it). While beliefs about winning influence the *strength* of the preference, the choice itself primarily reveals the preference structure over risky vs. certain outcomes given current beliefs. RPRP focuses on the choice given beliefs, not explaining the choice *by* beliefs alone.
  3.  **"Best Seller" Jam Shopper:** **Agrees with you.** Swapping the labels alters an "irrelevant" contextual feature (the arbitrary "best seller" tag). The reversal reveals the choice was driven by the label (a situational cue), not a stable preference for one jam over the other *based on its inherent qualities*.
  4.  **Paying to Hide Cigarettes:** **Agrees with you.** This reveals a stable *higher-order preference* (a core value/goal) for health over smoking, manifesting as a preference over future choice *situations*. Preventing the future choice isn't an irrelevant context change; it's an action taken to align future choices with this stable higher-order preference. The perspective (present deliberative self) is consistent.
  5.  **Cyclic Preferences (A>B, B>C, C>A):** **Agrees with you.** RPRP demands robustness under changes in the *menu* (if irrelevant). If choosing A over B, B over C, and C over A in pairwise comparisons (where the menu is just the pair), these choices are directly contradictory under any stable preference ordering. At least one choice cannot reflect a stable core preference; it must be explained by a situational quirk (e.g., momentary inattention, irrelevant framing specific to that pair).
  6.  **Time Inconsistency (Smaller Sooner / Larger Later):** **Forces you to give up your verdict.** RPRP forces the conclusion this is **inconsistency to be explained away, not a genuine change in what she wants**.
      *   *Why?* Adding a fixed delay (e.g., 1 year) to both options is arguably an "irrelevant" contextual change under condition (2). The *relative* timing difference (soon vs. later) remains identical. The agent would rationally dismiss the absolute delay *shift* as irrelevant to the comparison between the two options themselves.
      *   *Perspective Issue:* Condition (3) is key. The agent is evaluating the options from different temporal perspectives (present vs. future). RPRP treats distinct perspectives (like distinct selves) as potentially having different stable preferences. The choice reversal reveals either:
          *   **(a)** An inconsistency in the *present-self's* preferences across time (violating robustness under irrelevant delay shift), suggesting a situational bias (like hyperbolic discounting), OR
          *   **(b)** That the *future-self* genuinely has a different stable preference structure (e.g., lower discount rate). RPRP *allows* for multiple stable preference sets tied to different perspectives (like different selves).
      *   *RPRP Verdict:* Your original verdict ("genuine change in what she wants") is only sustainable under interpretation (b). However, RPRP emphasizes that the *present-self's* reversal when the delay is shifted is *not* robust under an irrelevant change and thus doesn't reveal a single, consistent preference set for the *present-self*. It reveals a conflict *between* perspectives or a context-dependent bias *within* the present perspective.

  **New Cases & Verdicts:**

  7.  **The Decoy Effect:** A shopper prefers Car A (good MPG, medium price) over Car B (poor MPG, low price). When Car C (poor MPG, high price) is added, the shopper now prefers Car B. RPRP says this **does not reveal a stable preference** between A and B. Adding the dominated decoy (C) is an "irrelevant" contextual change (choice architecture not impacting A or B's inherent properties). The reversal reveals the choice was situationally influenced by the decoy.
  8.  **Cold State vs. Hot State:** A person on a diet (cold state) packs healthy lunches for the week. At lunchtime when hungry (hot state), they choose to order pizza instead. RPRP says this **does not reveal a stable preference** for pizza *over the packed lunch* in general. The visceral state (hunger) is a *relevant* perspective shift (Condition 3), not an irrelevant contextual feature. The choices reveal different stable preference orderings for the *cold-state self* (values health) and the *hot-state self* (values immediate gratification). Neither choice is "wrong"; they reflect preferences from different valid perspectives.
  9.  **Paying for a Gym Membership vs. Actual Usage:** Someone pays a yearly gym fee (revealing a preference for having gym access/being a gym member) but rarely goes. RPRP says the *payment* reveals a stable preference for membership/access (or the *idea* of fitness). The *non-usage* reveals a stable preference for alternatives *in the moment of choice* (laziness, time constraints) from the *hot-state perspective*. It highlights a conflict between higher-order preferences (cold-state) and moment-to-moment preferences (hot-state).

  **The Promise Keeper Case:**

  *   **Situation:** Someone chooses an option they believe is materially worse for them because they promised to do so. They want to be the sort of person who keeps their word.
  *   **RPRP Verdict:** This **reveals a genuine, stable preference.** The choice is robust under changes to irrelevant contextual features (e.g., where the promise was made, minor changes in the material cost). Altering the core fact of *having made a promise* would change the choice, but this is a relevant feature central to the agent's values (integrity, self-image). The agent rationally incorporates the *moral cost of breaking the promise* or the *benefit of self-consistency* into their evaluation of the outcomes. The "outcome" includes their self-regard and adherence to their values, not just material consequences. Condition (1) (core values/goals) and Condition (3) (evaluating from the perspective of a moral agent) are satisfied. The choice reveals a stable preference for "keeping promises + outcome" over "breaking promises + slightly better outcome".

  **In Summary:**

  RPRP preserves most of your intuitive verdicts by:
  1.  Distinguishing stable preferences (reflecting core values/goals) from choices driven by irrelevant context or specific perspectives.
  2.  Allowing for multiple stable preference sets tied to different valid perspectives (e.g., temporal selves, cold/hot states).
  3.  Demanding counterfactual robustness specifically concerning *irrelevant* contextual features the agent would dismiss.
  4.  Incorporating higher-order preferences and the agent's own evaluation of relevance.

  The key verdict it forces you to reconsider is the **time inconsistency case**, pushing you towards seeing it as revealing either an inconsistency within a perspective or a conflict between different perspectives, rather than a simple, unproblematic "change in what she wants" from the *same* perspective under an irrelevant change. It clarifies that the *shift in temporal perspective* is the relevant change, not the absolute delay itself.
