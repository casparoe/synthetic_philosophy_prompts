prompt: |-
  Before I use the common prior assumption in anything, I want the spec for it, not another defense or takedown. So: what does a theory of the common prior assumption actually have to get right to be worth having? I want the requirements list -- the cases it has to handle, the distinctions it can't blur, the results it has to stay consistent with -- with the case or consideration behind each one, and your call on which requirements are non-negotiable and which are just the taste of one camp.

  Some things I specifically want the list to confront, because they're where I keep getting stuck: (a) whether the assumption is a claim about the world, about rationality, or about what's reasonable to stipulate in a model -- the theory has to say which, because the standards of success differ; (b) that you can always rescue the assumption by making the state space finer or the type space bigger, so it has to tell me what would count as evidence against it, and if nothing would, say so; (c) agents who don't even share a set of possibilities -- if they aren't aware of the same events, a "prior over the state space" isn't obviously defined for both of them, so what is the assumption even saying there?; (d) whether the verdict flips when you redraw the boundaries of the state space, since there's no canonical way to draw them and it would be bad if "priors are common" turned out to be an artifact of my bookkeeping; (e) the symmetry/exchangeability intuition that's supposed to motivate the whole thing -- why does being part of the same group force the same prior, and is the justification ignorance, symmetry, or shared learning?; and (f) the agreement and no-speculative-trade style results: if common priors plus common knowledge of each other's beliefs force agreement and kill trade, and trade happens anyway, does the theory own that consequence or does it need a patch?

  If some of these requirements can't be satisfied together, that's the part I most want -- say which subset is inconsistent and why. And if you have room, a short scorecard of the main positions against the list, but keep it brief, the list is the deliverable.

  Dont give me citations or a reading list, I can't look anything up -- just the requirements and your reasoning.

  Start with your bottom line in the first sentence -- whether the whole list can be met at once and, if not, which requirement you'd sacrifice -- then the list. No preamble, no restating what I asked.
reasoning: |-
  We are going to construct a requirements list for the common prior assumption (CPA) as a theory. The bottom line: **The list cannot be fully met at once; the most negotiable requirement is (b) (falsifiability via state space refinement) because the CPA is often defended as a modeling choice rather than a testable empirical claim.**

  Now, the requirements list:

  1. **Clarity on Ontological Status (Non-negotiable)**: The theory must specify whether the CPA is a claim about the world (empirical), about rationality (normative), or a modeling stipulation. 
     * *Case/Consideration*: Without this, we cannot evaluate the CPA (e.g., if it's a modeling choice, it doesn't need empirical support). This addresses (a).
     * *Verdict*: Non-negotiable because the entire interpretation of the CPA hinges on this.

  2. **Falsifiability (Negotiable)**: The theory must specify what would count as evidence against the CPA, especially given that one can always refine the state space to "rescue" the CPA by adding more states. 
     * *Case/Consideration*: If no evidence can falsify the CPA (because of state space refinement), then it is vacuous. This addresses (b).
     * *Verdict*: Negotiable because in many applications (especially in economics) the CPA is adopted as a useful simplification without claiming universal truth. However, for the CPA to be a substantive claim, falsifiability is required.

  3. **Handling Asymmetric Awareness (Non-negotiable)**: The theory must account for agents who are not aware of the same events (i.e., they have different state spaces). The CPA must define a common prior in such cases or explain why it doesn't apply.
     * *Case/Consideration*: If agents have different knowledge about what is possible (e.g., one agent is unaware of an event the other knows), then a common prior over what? This addresses (c).
     * *Verdict*: Non-negotiable because if the CPA is to be a general assumption, it must handle such cases or explicitly limit its scope.

  4. **Invariance Under State Space Redefinition (Non-negotiable)**: The CPA must not depend on how we draw the state space. If the same situation can be modeled with two different state spaces, the CPA should hold in both or neither.
     * *Case/Consideration*: Otherwise, the CPA is an artifact of the modeler's choice, not a property of the agents. This addresses (d).
     * *Verdict*: Non-negotiable because the state space is a modeling device; the real-world phenomenon should be invariant.

  5. **Justification for Symmetry (Negotiable)**: The theory must provide a clear justification for why agents in the same group should have a common prior. The justification must address whether it is due to initial ignorance, symmetry, shared learning, or something else.
     * *Case/Consideration*: The intuition that "we started from the same place" is often invoked, but why? This addresses (e).
     * *Verdict*: Negotiable because different camps have different justifications (e.g., Harsanyi's doctrine of original ignorance vs. Aumann's common knowledge of the prior). However, the theory must pick one and be consistent.

  6. **Consequences for Agreement and Trade (Non-negotiable)**: The theory must account for the agreement and no-trade results. If common priors plus common knowledge of beliefs lead to agreement and no trade, but we observe trade, the theory must either own the consequence (that the CPA fails) or provide a patch (e.g., by relaxing common knowledge or introducing non-rationality).
     * *Case/Consideration*: This is a key test of the CPA. If trade occurs despite common knowledge of beliefs, then either the CPA is false or the model must be adjusted. This addresses (f).
     * *Verdict*: Non-negotiable because these are core implications of the CPA. The theory cannot ignore them.

  **Inconsistencies and Trade-offs**:
  - The requirements (2) and (4) are in tension. If the CPA can be rescued by refining the state space (as per requirement 2), then it becomes unfalsifiable and violates the spirit of (4) because the state space is arbitrarily chosen to make the CPA hold. However, if we demand falsifiability (a strong interpretation of 2) then we must fix the state space, but that conflicts with the idea that the state space is a modeler's choice (4). 
  - Also, (3) (asymmetric awareness) and (5) (justification by shared learning) conflict: if agents have asymmetric awareness, they cannot have shared the same learning history.

  **Short Scorecard of Main Positions**:
  - **Aumann (Rationality View)**: CPA is part of rationality. (1: normative, 2: not falsifiable by state space refinement, 3: assumes symmetric awareness, 4: invariant? [debatable], 5: common knowledge of the prior, 6: owns the consequences).
  - **Harsanyi (Modeling Stipulation)**: CPA is a modeling device to represent incomplete information. (1: stipulation, 2: not falsifiable, 3: assumes symmetric awareness, 4: invariant? [state space is given], 5: original ignorance, 6: owns consequences).
  - **Critics (e.g., Gul, 1998)**: CPA is an empirical claim that is often false. (1: empirical, 2: falsifiable, 3: may not hold, 4: may not be invariant, 5: no compelling justification, 6: trade is evidence against CPA).

  **Final Bottom Line Reiterated**: The requirements cannot all be satisfied simultaneously. The most common sacrifice is (2) (falsifiability) because many proponents treat the CPA as a modeling tool. Alternatively, one can sacrifice (3) by assuming symmetric awareness, but that limits the scope. The non-negotiable requirements (1, 3, 4, 6) must be addressed for the theory to be coherent and applicable.
answer: |-
  **Bottom line: The list cannot be fully met at once; the requirement I would sacrifice is (b) (falsifiability via state space refinement) because the CPA is often treated as a modeling stipulation where state spaces are chosen to fit the assumption, not as a falsifiable empirical claim.**

  ### Requirements List for the Common Prior Assumption (CPA)
  1. **Specify ontological status (non-negotiable)**  
     *Must clarify whether CPA is about the world (empirical claim), rationality (normative principle), or model-building (stipulation).*  
     **Why**: Success criteria differ radically—e.g., empirical claims need evidence, stipulations need consistency. Addresses (a).  
     **Case**: If CPA is normative, disagreement doesn’t falsify it; if empirical, real-world priors must match.  

  2. **Define falsifiability conditions (negotiable)**  
     *Must state what evidence would refute CPA, given state spaces can be refined to "force" common priors.*  
     **Why**: Without this, CPA risks being vacuous ("always rescuable"). Addresses (b).  
     **Case**: Observed prior disagreements that persist even after accounting for all information might challenge CPA—but refinements can always absorb them. Sacrificed because CPA is often a modeling axiom.  

  3. **Handle agents with asymmetric awareness (non-negotiable)**  
     *Must explain how CPA applies when agents don’t share the same set of possible states/events.*  
     **Why**: If agents have disjoint state spaces, a "common prior" isn’t defined. Addresses (c).  
     **Case**: Agent A knows events B doesn’t; CPA must either exclude such cases or define priors over a unified state space (e.g., via unawareness models).  

  4. **Ensure invariance under state space redrawing (non-negotiable)**  
     *CPA’s truth must not depend on arbitrary choices in defining the state space.*  
     **Why**: If redrawing boundaries changes whether priors are "common," CPA is an artifact of notation, not reality. Addresses (d).  
     **Case**: Modeling a coin flip as {Heads,Tails} vs. {Heads,Tails,Edge} shouldn’t alter CPA’s applicability.  

  5. **Justify symmetry/exchangeability (negotiable)**  
     *Must ground why group membership implies identical priors—ignorance, symmetry, or shared learning.*  
     **Why**: The intuition that "same group → same prior" needs defense. Addresses (e).  
     **Case**: If justification is "shared learning," it fails for agents with different cultural histories; if "ignorance," it presumes no innate biases. Negotiable because camps differ (e.g., Harsanyi: ignorance; Aumann: common knowledge).  

  6. **Account for agreement/no-trade results (non-negotiable)**  
     *Must own or patch CPA’s implication that common knowledge of beliefs + CPA → agreement and no trade.*  
     **Why**: If trade/disagreement persists, CPA must explain why (e.g., failures of common knowledge or rationality). Addresses (f).  
     **Case**: Active financial markets contradict no-trade theorems; the theory must either reject CPA or add frictions (e.g., liquidity needs).  

  ### Inconsistent Subset  
  - **Requirements (2), (4), and (6) conflict**:  
    - (2) demands falsifiability, but (4) requires CPA to hold regardless of state space definition.  
    - However, state space refinements (to "rescue" CPA per (2)) can violate (4) by making CPA model-dependent.  
    - Meanwhile, (6) insists CPA owns no-trade results, but if state spaces are refined to save CPA (avoiding falsification per (2)), real-world trade might not challenge CPA—undermining (6).  
    **Why**: CPA cannot simultaneously be falsifiable by real-world disagreement/trade (2,6) and invulnerable to state space changes (4). Sacrificing (2) resolves this by treating CPA as unfalsifiable.  

  ### Scorecard of Main Positions  
  | **Position**          | (1) Ontology       | (2) Falsifiable? | (3) Asymmetric Awareness | (4) State-Space Invariant? | (5) Justification       | (6) Owns No-Trade? |  
  |------------------------|--------------------|------------------|--------------------------|----------------------------|-------------------------|--------------------|  
  | **Aumann (rationality)** | Normative          | No               | Excluded (assumes common knowledge) | Yes (by fiat)            | Common knowledge       | Yes                |  
  | **Harsanyi (modeling)**  | Stipulation        | No               | Excluded (symmetric types) | No (state space given)   | Initial ignorance      | Yes                |  
  | **Critics (e.g., Gul)**  | Empirical          | Yes              | Fails (evidence against) | No (artifacts possible)   | Unjustified            | No (trade refutes) |  
  | **Modern Bayesians**   | Stipulation        | No               | Handled (extended type spaces) | Debated                 | Shared learning?       | Patched (e.g., with bounded rationality) |
