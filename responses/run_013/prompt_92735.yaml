  Finally, I must give implications for how they should understand their past attitudes and how to regard people still in such communities.

  This requires careful philosophical analysis while being sensitive to their personal trauma. I should structure my response as a continuous essay in British English without headings or bullet points - like a long letter. I'll use British spellings throughout.

