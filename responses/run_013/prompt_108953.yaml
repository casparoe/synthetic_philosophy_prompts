answer: |-
  **Explain why the sorites paradox arises for the predicate "reliable" (as applied to methods, instruments, or informants), reconstruct the paradox formally to isolate the tolerance principle and the cost of its rejection, argue whether the vagueness of "reliable" is best treated as semantic or ontic, and show how your preferred resolution confronts the problem of higher-order vagueness.**

  ---

  **Model Answer (Approx. 700 words):**

  The sorites paradox for "reliable" arises because reliability is inherently gradable: a thermometer with a 99% accuracy record is reliable, and intuitively, improving its accuracy to 99.1% shouldn’t render it unreliable. Yet, via a sorites series—say, incrementally worsening a thermometer’s accuracy from 100% to 50%—we confront contradiction. Formally:
  1. Base step: A thermometer with 100% accuracy is reliable.
  2. Tolerance principle: For any small decrease in accuracy (e.g., 0.1%), if it was reliable before, it remains reliable after.
  3. Conclusion: A thermometer with 50% accuracy is reliable (absurd).

  The tolerance principle (premise 2) is the crux. Rejecting it imposes a sharp cutoff: some minute, imperceptible accuracy dip *does* flip "reliable" to "unreliable." This is costly because it violates our intuition that reliability is robust to minor variations and lacks precise thresholds in practice (e.g., declaring one thermometer unreliable at 87.3% accuracy but reliable at 87.4% seems arbitrary).

  This vagueness is semantic, not ontic. Reliability is a property *ascribed* based on performance metrics (e.g., error rates), but the world itself contains only concrete, precise data (e.g., a thermometer produced incorrect readings in 12/100 trials). "Reliable" is a human label supervening on these facts, not a fuzzy feature of reality. Ontic vagueness would imply that reliability itself is metaphysically indeterminate—that a thermometer’s reliability-status is objectively unresolved independent of description. But this misplaces the indeterminacy: the *evidence* for reliability (e.g., track records) is exact; it’s our *classification* that admits borderline cases (e.g., is 85% accuracy "reliable" for a weather station? A research lab?). Reliability is interest-relative and contextual, reinforcing its linguistic nature.

  Degree theory offers the most natural resolution. It assigns "reliable" a degree of truth (e.g., 0 to 1) based on accuracy. A 100% accurate instrument has truth-degree 1; 90% might be 0.8; 60% might be 0.4. The tolerance principle is preserved as approximate truth: a tiny accuracy dip (say, 0.1%) causes only a negligible truth-degree decrease (e.g., 0.001), so "reliable" remains *mostly* true, avoiding a flip. This captures reliability’s gradualism and comparative use (e.g., "Thermometer A is more reliable than B").

  However, this faces two critical costs. First, classical logic fractures. If "reliable" is true to degree 0.7 for an instrument, the law of excluded middle fails—"reliable or not reliable" isn’t fully true at borderline cases. This disrupts reasoning (e.g., in engineering, where binary reliability assessments are often required for safety standards). Second, the tolerance principle is weakened but not eliminated: while no *single* change flips truth-value, cumulative small changes do. This merely relabels the paradox: why does aggregating negligible shifts produce a significant one? Degree theory thus softens but doesn’t dissolve the core issue.

  Worse, higher-order vagueness escalates the problem. If "reliable" is vague, so is "clear case of reliability." Degree theory must define a threshold (e.g., truth-degree ≥ 0.6) for "reliable," but this boundary is itself vague. Is an instrument with truth-degree 0.5999 "reliable"? If we appeal to a super-threshold (e.g., ≥0.6 is *definitely* reliable), we regress infinitely: when does "definitely reliable" apply? Higher-order vagueness shows that degree theory’s numerical precision is illusory—the assignment of degrees is itself context-dependent and ungrounded (e.g., why 0.6 and not 0.599?). For "reliable," this is acute because reliability standards vary socially (e.g., medical vs. casual use). The theory cannot specify *where* degrees come from without smuggling in new vagueness.

  Ultimately, semantic degree theory best fits "reliable" due to its comparative structure, but it fails to contain higher-order vagueness and abandons classical logic. While epistemicism (vagueness as ignorance of cutoffs) or supervaluationism (vagueness as unsettled meaning) avoid these costs, they mishandle reliability’s gradualism. Epistemicism posits implausible sharp thresholds for a predicate used fluidly; supervaluationism renders "reliability" globally indeterminate in borderline cases, ignoring that we often comparatively rank (e.g., "A is clearly more reliable than B"). "Reliable" thus exposes degree theory’s appeal and fragility: it models vagueness where small changes preserve status, but higher-order vagueness proves that no formal model escapes the paradox’s recursive depth.

  ---

  **Marking Scheme (Total: 25 marks):**

  **A first-class answer (21–25) must include:**  
  1. **(4 marks)** Clear reconstruction of the sorites for "reliable" with explicit tolerance principle (e.g., "no small improvement in track record changes reliability status").  
  2. **(3 marks)** Explanation of why rejecting tolerance is costly (e.g., violates intuitions of graduality; imposes arbitrary, unknowable thresholds).  
  3. **(5 marks)** Argument for semantic (not ontic) vagueness for "reliable," using features like context-dependence or supervenience on precise data.  
  4. **(5 marks)** Application of a specific solution (e.g., degree theory) to "reliable," showing strengths (e.g., accommodates comparatives) and costs (e.g., non-classical logic).  
  5. **(5 marks)** Engagement with higher-order vagueness: showing how the solution’s boundary (e.g., a degree threshold) itself becomes vague, leading to regression.  
  6. **(3 marks)** Original synthesis: e.g., explaining why "reliable" uniquely pressures degree theory or why higher-order vagueness is inescapable.  

  **A competent but limited answer (B-range: 16–20) may:**  
  - Reconstruct the paradox but misidentify tolerance or understate rejection costs (‑2).  
  - Contrast semantic/ontic vagueness superficially (e.g., calling "reliable" ontic without argument) (‑3).  
  - Survey multiple theories without deep application to "reliable" (‑4).  
  - Mention higher-order vagueness but conflate it with first-order vagueness (e.g., "it’s vagueness about vagueness") or fail to show regression (‑3).  

  **Caps at B (max 16) for:**  
  - Treating vagueness as "merely verbal" without addressing its paradox-generating structure.  
  - Claiming a stipulated cutoff (e.g., "define reliable as >95% accuracy") dissolves the paradox without explaining why this changes the subject (ignores ordinary meaning).  
  - Ignoring higher-order vagueness or misapplying it (e.g., "it doesn’t affect my solution").  

  **Failing (<10):**  
  - No reconstruction of the sorites for "reliable."  
  - No engagement with semantic/ontic distinction.  
  - Only recites standard positions (e.g., "epistemicism says vagueness is ignorance") without using "reliable."
