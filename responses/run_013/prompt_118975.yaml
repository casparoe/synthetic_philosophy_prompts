reasoning: |-
  We are considering risk-weighted expected utility theory (RWEU), as an alternative to expected utility theory (EUT). The key idea is that agents can have preferences over the spread of chances, not just the expected value. This theory can explain phenomena like Allais paradox without deeming them irrational.

  As a skeptic, we must find what counts against RWEU. We are to provide decisive defeaters (with evidence that would settle them), awkward defeaters, what defenders concede, and how insulated the theory is. We also need two separating cases: one against EUT and one against a rival (like rank-dependent utility, RDU, or prospect theory). The rival we choose for comparison will be one that also weights probabilities but differently (e.g., prospect theory with its weighting function and editing phase).

  ### Brainstorming

  **Strengths of RWEU:**
  - Explains Allais paradox and other violations of EUT without irrationality.
  - Allows for risk aversion that is not due to diminishing marginal utility (as in EUT) but due to the weighting of probabilities.

  **Weaknesses to explore:**
  1. **Curve-fitting / Ad hocness:** The risk-weighting function can be chosen to fit any pattern of choices. This makes the theory difficult to falsify. Is this fatal? Or is it just that the theory is descriptive and we need to impose constraints on the weighting function?
     - Evidence: If we can show that for a given set of choices, there is no single risk-weighting function that can explain all choices without being inconsistent (e.g., if choices are intransitive even under RWEU), that would be a problem.
     - Also, if we require the weighting function to be fixed across contexts and we observe choices that cannot be represented by a fixed function, then that would be a problem.

  2. **Extreme outcomes and ambiguity:** How does RWEU handle cases of extreme uncertainty (like ambiguity) or catastrophic risks? Does it lead to recommendations that are counterintuitive?
     - Example: In a situation with a very low probability of a catastrophic outcome, RWEU might recommend an action that a "sane person" would reject? Or the reverse?
     - RWEU typically assumes known probabilities. What about when probabilities are not known (ambiguity)? Then we might need to extend RWEU or combine it with ambiguity models.

  **Other potential defeaters:**
  - **Dynamic consistency:** If we have a multi-stage decision, does RWEU lead to time-inconsistency? (Like in prospect theory, where people might change their risk attitude as the event gets closer.) If so, that might be a problem because it leads to plans that are not followed through.
  - **Empirical evidence:** Are there patterns of choice that RWEU cannot explain, but other theories (like cumulative prospect theory) can? Or vice versa?
  - **Normative appeal:** Even if RWEU describes behavior, is it a good normative theory? Does it avoid Dutch books? Does it lead to rational behavior?

  **What do defenders concede?**
  - They might concede that the risk-weighting function can be context-dependent, which makes it harder to test. But they might argue that this is a feature of human psychology.
  - They might also concede that without constraints on the weighting function, the theory is too flexible. Therefore, they impose properties (like monotonicity) to make it testable.

  **Separating cases:**
  1. **Against EUT:** The Allais paradox is a classic. In EUT, the choices are inconsistent with any utility function. In RWEU, they can be explained by a risk-weighting function that overweights low probabilities of high losses (or underweights high probabilities of sure gains).
     - Prediction: In Allais, the common consequence effect is explained by risk-weighting.

  2. **Against a rival (say, Prospect Theory - PT):** Consider the reflection effect. PT has a value function that is concave for gains and convex for losses, and a probability weighting function that overweights small probabilities. RWEU, on the other hand, uses a single risk-weighting function that is applied to the entire distribution. 
     - A specific case: the fourfold pattern of risk attitudes. In PT, it is explained by the combination of the value function and the probability weighting. In RWEU, the risk-weighting function alone might not be able to account for the reflection effect (if the risk-weighting function is the same for gains and losses). However, note that RWEU is often formulated for gains only. If we extend to losses, we might need a different treatment.

     But let's take a case that is handled differently: 
     - Example: **The common ratio effect**. Both RWEU and PT can explain it, but in different ways. However, we need a case where they diverge.

     Consider a case with mixed outcomes (gains and losses). Prospect theory has loss aversion and different weighting for gains and losses. RWEU (as in Quiggin's rank-dependent utility) typically uses a single weighting function but applied to the cumulative distribution. 

     Another candidate: **The isolation effect** in prospect theory (due to editing phase) might lead to choices that RWEU cannot explain because RWEU does not have an editing phase.

     But note: RWEU is often identified with rank-dependent utility (RDU) or its generalizations. Prospect theory (cumulative prospect theory, CPT) is a form of RDU for gains and losses separately. So they are similar. However, CPT has loss aversion and a reference point. 

     Let's take a case that separates RWEU (without loss aversion) from CPT. 

     Example: 
     - Option A: 50% chance to gain $100, 50% chance to lose $80.
     - Option B: $0 for sure.

     In CPT, due to loss aversion (the disutility of a loss is about twice the utility of a gain of the same size) and probability weighting, the agent might avoid the gamble (risk aversion for mixed gambles). In RWEU without loss aversion and with a symmetric risk-weighting function, the agent might be close to risk neutral (if the weighting function is linear) or might be risk averse if the weighting function overweights the bad outcome. But without loss aversion, the effect might be weaker.

     Alternatively, consider a case with only gains but where the probabilities are very low. In CPT, small probabilities are overweighted, so a low-probability high-payoff might be attractive. In RWEU, the risk-weighting function might underweight low probabilities (if the agent is risk averse) or overweight (if risk seeking). But the functional form might differ.

     However, for a clear separation, we can use the **certainty effect** in the domain of losses. In EUT, the following should be consistent:

     Problem 1:
     - A: 80% chance to lose $4000 (otherwise 0) vs B: 100% chance to lose $3000.
     Most choose B (risk seeking in losses?).

     Problem 2:
     - C: 20% chance to lose $4000 (otherwise 0) vs D: 25% chance to lose $3000 (otherwise 0).
     Now, many choose C (risk averse?).

     This pattern (the reflection of the common ratio effect in losses) is explained by CPT because of the probability weighting and the convex value function in losses. In RWEU, if we use a risk-weighting function that is applied to the cumulative distribution, we might also explain it by having a risk-seeking weighting function for losses. But note: in RWEU, the weighting function is typically applied to the entire distribution and the same function might be used for gains and losses? Or we can have a different one? 

     But if RWEU is set up without a reference point and without loss aversion, it might not capture the reflection effect (where risk attitudes reverse between gains and losses). However, if we allow the risk-weighting function to be different for gains and losses, then it becomes more similar to CPT. Therefore, to separate, we must consider a theory that does not have loss aversion and does not have a reference point.

     Alternatively, consider a case of **stochastic dominance**. RWEU (if it uses a rank-dependent approach) respects stochastic dominance. But some versions of prospect theory (if not carefully applied) might violate it without the cumulative weighting. However, cumulative prospect theory (CPT) respects stochastic dominance. 

     A known separating case: **The violation of coalescing** (also called event-splitting effect). If we split an event into two mutually exclusive events with the same outcome, does the preference change? In RDU and CPT, coalescing holds (so splitting should not matter). But in original prospect theory, it might not. However, in CPT, it does because of the cumulative transformation.

     Actually, coalescing is a property that RDU (and hence RWEU) satisfies. But some descriptive theories (like original prospect theory) do not. However, for a rival, let's take a model that does not satisfy coalescing. But note: RWEU (as RDU) satisfies stochastic dominance and coalescing. 

     We might instead choose a rival that is not rank-dependent, such as the original prospect theory (OPT) or a different model. But OPT is not used much because of its violations of stochastic dominance.

     Alternatively, consider **betweenness violations**. RDU does not satisfy betweenness, while some other models (like weighted utility) do. But that might not be a common rival.

     Given the time, we can use the **Allais paradox** as the separating case from EUT, and for the rival, we use **prospect theory without loss aversion and with a different probability weighting approach**? But that's not straightforward.

     Instead, let's use a case from ambiguity. RWEU assumes known probabilities. For ambiguous probabilities, we need a different model. But the question asks about cases with murky probabilities? We can use that as an awkward defeater.

     Alternatively, for the separating case against a rival, we can use a case that RWEU (RDU) and CPT both explain, but in a way that they make different predictions in a slightly modified setting? 

     I recall a case: **the common consequence effect with three outcomes**. Machina (1982) showed that EUT fails, but RDU can explain. However, Machina also presented a case (the 50-51 example) that RDU cannot explain. But that might be a defeater for RDU? 

     Actually, Machina's triangle example: choices that violate the fanning out hypothesis. RDU implies the indifference curves in the Marschak-Machina triangle are linear and parallel, but with a slope that depends on the weighting function. But if we observe non-linear or non-parallel curves, that would be a problem for RDU. 

     However, for a separating case against a rival, we can use the **isolation effect** (framing effect) of prospect theory. In RWEU, without an editing phase, the framing should not matter. But in prospect theory, it does. So:

     - Case: Two versions of the same gamble, framed differently (e.g., two-stage vs one-stage). 
       - In the first frame: a two-stage game where the first stage has a 75% chance to end with nothing and 25% chance to go to the second stage, which is a choice between A: sure $30 and B: 80% chance $45. 
       - In the second frame: a direct choice between C: 25% chance $30 and D: 20% chance $45.

     The two frames are identical in terms of final probabilities: 
       - C: 25% * $30 = 7.5% chance of $30? Actually, no: 
          Frame 1: 
            - 75%: 0
            - 25%: then you get either $30 (with prob 1) or $45 (with prob 0.8). So the overall chance of $30 is 25% (if you choose A) and $45 is 25%*0.8=20%.

          So frame 1 when choosing A is 25% chance of $30, and when choosing B is 20% chance of $45. This is the same as frame 2: 
            - C: 25% chance $30, 75% nothing.
            - D: 20% chance $45, 80% nothing.

     However, in experiments, people often choose A in the first frame and D in the second frame. This is the isolation effect: people ignore the common first stage and focus on the second stage. 

     In RWEU, the representation is based on the overall distribution. So the two frames are the same and should be treated the same. Therefore, RWEU predicts no difference. 

     But in prospect theory, because of the editing phase (isolation of stages), the two frames are coded differently. In frame 1, the 75% chance of 0 is ignored and the choice is between a sure $30 and an 80% chance of $45 in the second stage. Therefore, the certainty effect kicks in and A is chosen. In frame 2, there is no sure thing, so people choose the higher payoff (D) because the probabilities are low and the probability weighting function overweights the small chance of $45.

     So RWEU (without an editing phase) predicts consistency between the two frames. Prospect theory predicts a reversal.

     This is a separating case: the isolation effect (or the two-stage framing effect) is predicted by PT but not by RWEU. If we observe the effect, then RWEU is falsified and PT is supported.

     However, note that RWEU is a model of risk (with known probabilities). It doesn't claim to model framing effects. So defenders might say that the isolation effect is a separate phenomenon (framing) that RWEU is not designed to capture.

     But if we are comparing as descriptive theories of choice under risk, then the isolation effect is a challenge.

  ### Decisive Defeaters

  1. **Intransitivity of preferences under RWEU**: If we can show that RWEU can lead to intransitive choices (even when the weighting function is fixed), that would be a decisive defeater. However, RWEU (as RDU) is transitive. So this is not an issue.

     Instead, let's consider:

     **Violations of stochastic dominance**: If RWEU allows choices that stochastically dominate one another to be reversed, that would be a decisive defeater. But RDU (and hence RWEU, if properly specified) respects first-order stochastic dominance. So unless we have a misspecification, this is avoided.

     **Evidence that would settle it**: If we observe a violation of stochastic dominance that cannot be explained by RWEU without violating dominance, then that would be a problem. But RWEU is designed to avoid that.

     Alternatively, **violations of continuity**? But that's a more basic axiom.

     A better one: **Violations of the independence axiom in a way that RWEU cannot explain**. For example, the common ratio effect is explained by RWEU. But if we have a pattern that violates the predictions of RWEU? Specifically, if we have a set of choices that are inconsistent with any risk-weighting function? 

     Example: Suppose we have three gambles, A, B, C, and the agent prefers A to B, B to C, and C to A. That is intransitivity. But RWEU (like EUT) assumes transitivity. So if we observe intransitivity, it would be a problem for both. 

     So what is a decisive defeater? 

     **The failure to predict the reflection effect in the domain of losses without adjusting the risk-weighting function in an ad hoc way.** If in gains the agent is risk averse and in losses risk seeking, and if RWEU uses the same weighting function, it cannot explain both without additional features. So if we observe an agent who is risk averse for gains and risk seeking for losses, and if we require the weighting function to be the same for gains and losses, then that would be a problem. 

     But defenders might allow a different weighting function for losses? Then it becomes similar to CPT.

     Therefore, let's go with:

     **The Machina paradoxes**: Machina (1982) presented choices that violate the betweenness axiom and also the fanning out hypothesis. Specifically, the "50-51" example:

     Consider two pairs of gambles:

     Pair 1:
       - A: $5000 with probability 0.01, $0 otherwise.
       - B: $5000 with probability 0.009, $105 with probability 0.001, $0 with probability 0.99.

     Pair 2:
       - C: $5000 with probability 0.45, $0 otherwise.
       - D: $5000 with probability 0.4505, $105 with probability 0.0005, $0 otherwise.

     According to RDU (and RWEU), the risk-weighting function would overweight the small probability in A and underweight the larger probability in C? But Machina argues that many people would prefer A to B and D to C, which is inconsistent with RDU because the weighting function is fixed. Specifically, the shift from A to B and C to D is similar in terms of probability shifts, but the preferences reverse. This pattern is called the "fanning in" in the Marschak-Machina triangle (as opposed to fanning out). RDU implies fanning out. 

     So this is a potential decisive defeater: if we observe fanning in, then RWEU is falsified.

     Evidence: experimental tests of the Marschak-Machina triangle. Some studies (e.g., Chew and Waller, 1986) found fanning out, but others found fanning in. So it's not settled. But if we set up an experiment that clearly shows fanning in, then that would be a problem for RWEU.

     Why it bites: because RWEU (as RDU) implies that the indifference curves are linear and fan out. If we observe fanning in, then no risk-weighting function can explain it.

     What evidence would settle it?: An experiment with a large sample of choices in the Marschak-Machina triangle that clearly shows fanning in for a significant proportion of subjects.

  2. **Dynamic inconsistency**: If RWEU leads to choices that are dynamically inconsistent and there is no way to resolve it without ad hoc assumptions, that would be a problem. For example, if an agent plans to take a certain action in the future but when the time comes, the risk-weighting leads to a different choice, then the agent would want to change plans. This is a problem for normative theory.

     Why it bites: because it suggests that the agent cannot commit to a plan and might end up with a worse outcome.

     Evidence: design a dynamic choice problem where RWEU predicts a plan that is not followed through at the next stage. Then observe if people do indeed change their minds in a way that leads to a sure loss (like a Dutch book). If such a Dutch book is possible, then it's a problem.

     But note: RWEU can be extended to dynamic settings with consistent planning (using backward induction). So it might be avoidable.

     Therefore, perhaps not decisive.

     Let's choose **Ellsberg paradox** (ambiguity) as a decisive defeater? RWEU assumes known probabilities. In Ellsberg, there are ambiguous probabilities. If we force RWEU to assign probabilities, it cannot explain ambiguity aversion. So if we observe ambiguity aversion, that counts against RWEU.

     Why it bites: RWEU cannot explain ambiguity aversion without additional machinery (like multiple priors). 

     What evidence would settle it?: The Ellsberg paradox experiments (which show ambiguity aversion) would be evidence. But note: RWEU is a theory for risk (known probabilities), not ambiguity. So defenders might say that it's outside the scope. But if we want a unified theory, that's a problem.

     We are asked for decisive defeaters. So:

     Decisive defeater 1: **The Machina fanning in example** (if observed).
     Decisive defeater 2: **Violations of stochastic dominance** (if observed and not explainable by RWEU without violating dominance).

     But RWEU avoids stochastic dominance violations. So let's use the **inability to handle ambiguity** as a decisive defeater? But note: the theory is for known probabilities. So we might not hold it against RWEU for ambiguity. 

     Alternatively, **the failure to account for the magnitude effect in risk attitudes**: People are more risk averse for high-stakes gambles even when the probabilities are the same and the utility function is concave. RWEU might explain this by the risk-weighting function? But if the risk-weighting function is fixed, then it should not change with the magnitude of the outcomes. If we observe that the risk-weighting function changes with the scale of outcomes, then that would be an ad hoc adjustment.

     Why it bites: if the risk-weighting function must be scaled with the stakes, then the theory loses parsimony.

     Evidence: experiments that vary the stakes and show that the risk-weighting function is not stable.

