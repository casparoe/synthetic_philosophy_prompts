  ### Separating Cases

  1. Against plain EU: Allais paradox.
     - Case: 
          - Option A: $1 million for sure.
          - Option B: 10% chance $5 million, 89% chance $1 million, 1% chance nothing.
          - Choice: A > B (risk aversion for the sure gain)

          Then:
          - Option C: 11% chance $1 million, 89% chance nothing.
          - Option D: 10% chance $5 million, 90% chance nothing.
          - Choice: D > C (risk seeking when probabilities are low)

     - Divergent prediction: EU requires that if A>B then C>D, but people choose A>B and D>C. RWEU explains this by a risk-weighting function that overweights the 1% chance of nothing in B (making it look bad) and underweights the 10% chance of $5 million in D (making it look good) relative to the sure outcomes.

     So RWEU predicts the observed choices; EU does not.

  2. Against a rival (Prospect Theory - CPT): The isolation effect (two-stage gamble).
     - Case: Two frames of the same gamble.
          Frame 1 (two-stage): 
              Stage 1: 75% chance to 0, 25% chance to go to stage 2.
              In stage 2: choose between A: $30 for sure, B: 80% chance $45.
              So overall: A gives 25% chance of $30, B gives 20% chance of $45.

          Frame 2 (one-stage): 
              Choose between:
                  C: 25% chance $30, 75% nothing.
                  D: 20% chance $45, 80% nothing.

          They are identical. But people often choose A in frame 1 and D in frame 2.

     - Divergent prediction: 
          - RWEU (without framing) predicts no difference: the agent evaluates the overall distribution and should be consistent. So if they choose A in frame 1, they should choose C in frame 2.
          - CPT (with editing phase) predicts that in frame 1, the agent ignores the first stage and sees the second stage as a choice between a sure $30 and an 80% chance of $45 (so certainty effect leads to A). In frame 2, there is no sure thing, so the agent chooses D because of the overweighting of the 20% chance (or underweighting of 25% vs 20%? Actually, CPT with typical weighting function would underweight both, but the ratio might make D more attractive). 

     Therefore, RWEU predicts consistency, CPT predicts a reversal.

     Note: We assume that RWEU does not have an editing phase. If we add framing to RWEU, then it becomes similar.

  ### Bottom Line

  Risk-weighted expected utility offers a compelling alternative to expected utility by allowing preferences to depend on the spread of chances, not just the mean. It explains several anomalies, like the Allais paradox, without calling them irrational. However, it faces challenges: it can be too flexible due to the risk-weighting function, it does not handle ambiguity, and it may require extensions to account for reflection and framing effects. The most decisive tests are violations of coalescing and fanning in in the Marschak-Machina triangle. While it is a valuable descriptive and normative tool, it is not as well-insulated as hoped, especially when compared to more comprehensive models like cumulative prospect theory.

