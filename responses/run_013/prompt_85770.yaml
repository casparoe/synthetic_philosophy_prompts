  6. **Control Time:** Keep replies under 2 mins. Stop with: "...and that's why it predicts shifting reports." Then shut up.
  7. **End Strong:** Land your "rock solid vs. shifting" line last. Let them chew on it with their pints.

  You've got this. They'll respect a clear, testable idea more than textbook recital. Good luck!
