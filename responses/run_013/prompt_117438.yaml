prompt: |-
  Ok so I've sat on our town's ordinance review committee for two years now and it's just dawned on me that I have no actual theory of how I read a statute, so I want you to reverse-engineer one from my gut calls. Lead with the bottom line in your first sentence, then the reasoning. No preamble, and don't restate my question back at me.

  The provision I keep circling is Riverbend Municipal Code 12-4, headed "Rental Scooter Safety":

  (a) No person shall operate a motorized scooter on the Riverwalk.
  (b) "Motorized scooter" means any two-wheeled device propelled by a motor, whether or not it has a seat.
  (c) "Riverwalk" means the paved pedestrian path from Mile 0 to Mile 2.

  Here's what I'd say if you put me on the stand, in the order I'd have to defend them:

  1. The rental stand-up scooters, two wheels and a throttle: banned, obviously.
  2. A pedal-assist e-bike: not banned. The whole fight that produced this section was about the rental scooters, and an e-bike is definately a bike with a helper motor, not a scooter.
  3. The guy with MS who rides a two-wheeled motorized mobility thing to the farmers market: not banned, and I don't care that the words read on him.
  4. A one-wheeled electric unicycle: not banned. I hate it, it's exactly the hazard the section is about, but the section says two-wheeled and I won't stretch a physical description to catch something the drafters didn't picture.
  5. A self-balancing two-wheeled board with no handlebars: banned, because the words cover it and my personal view that they're ridiculous is neither here nor there.
  6. The new paved stretch from Mile 2 to Mile 3 that parks has already stenciled "Riverwalk" on: not covered. The definition stops at Mile 2.

  My own working guess is that the words set a ceiling and purpose can only narrow inside it, never widen it -- but that feels like a rule I invented to save my own verdicts, and I suspect its backwards from how most people think about this. So: is there a principle that gets all six, stated precisely enough that I could apply it cold? What does it say about a three-wheeled electric scooter (two wheels up front), and about an e-bike for somebody who can't pedal at all? And be straight with me about which of my six calls I'd have to give up.
reasoning: |-
  Okay, let me tackle this user's query. They've been on a town ordinance committee for two years and suddenly realized they don't have a formal theory for interpreting statutes. They want me to reverse-engineer a principle from their six gut calls about Riverbend Municipal Code 12-4. The key here is to lead with the bottom line immediately, then explain the reasoning without preamble or restating the question.

  Looking at their six rulings, I need to find a unifying principle. Their examples show they prioritize the literal wording but make exceptions based on legislative purpose when strict wording would lead to absurd outcomes. Specifically, they exclude the e-bike and mobility device despite technical inclusion, but include the hoverboard and exclude the unicycle based strictly on wheel count. For the Riverwalk extension, they stick to the defined mileage.

  The principle seems to be: Apply the plain meaning unless it produces an absurd result that clearly contradicts legislative intent, but never extend coverage beyond textual limits. This explains why they excluded the mobility device (absurd to ban medical necessity) and e-bike (purpose was rental scooters), but included the hoverboard (fits text) and excluded the unicycle (doesn't meet two-wheel requirement). The Riverwalk extension isn't covered because the text explicitly defines only up to Mile 2.

  Now for the new scenarios: A three-wheeled scooter wouldn't be banned because the definition specifies two wheels. A pedal-less e-bike would be trickier - technically it might fit "two-wheeled device with motor," but if it's used as a mobility aid, their principle might exempt it as an absurd result. However, they'd need to acknowledge this conflicts with their scooter ban if used recreationally.

  The user might have to reconsider their e-bike ruling if challenged, since pedal-assist e-bikes technically meet the definition. Their mobility device exception is defensible under absurdity doctrine but creates inconsistency. The e-unicycle exclusion is textually correct but highlights the ordinance's vulnerability to new devices.

  The user seems to value both textual integrity and practical reasonableness. Their approach resembles textualism with narrow purposive exceptions. The tension they feel comes from wanting clear rules while recognizing real-world complexities. They're probably looking for validation that their method is legally sound while wanting to anticipate weaknesses in their rulings.
answer: |-
  **Bottom line:** Your approach applies the plain meaning of statutory text as the maximum coverage limit, permitting purpose-based narrowing only to avoid absurd outcomes or clear legislative intent contradictions, but never expanding beyond textual boundaries.

  **Reasoning:**  
  1. **Text as ceiling:** "Two-wheeled" (b) physically limits coverage (excludes unicycle [4], includes hoverboard [5]). Defined "Riverwalk" boundaries (c) exclude Mile 2-3 stretch [6].  
  2. **Purpose narrows within text:**  
     - *Legislative intent:* E-bikes excluded [2] because drafting history shows focus on rental scooters, not pedal-assist bikes.  
     - *Absurdity doctrine:* Mobility device exempted [3] as banning medically necessary devices creates absurd/undesired outcome, despite fitting text.  
  3. **No expansion beyond text:** Refusing to stretch "two-wheeled" to cover unicycle [4] or extend "Mile 2" boundary [6] even if hazard is identical.  

  **Application to new scenarios:**  
  - **Three-wheeled scooter:** *Not banned.* Text requires "two-wheeled" device; third wheel places it outside definition regardless of similarity.  
  - **Pedal-less e-bike:** *Ambiguous under your principle.*  
    - *Text:* Likely banned ("two-wheeled device propelled by a motor" fits).  
    - *Purpose/narrowing:* Could argue exclusion if used as mobility device (extending absurdity doctrine [3]), but recreational use lacks grounds for exemption. Conflict with your e-bike call [2].  

  **Calls you’d need to reconsider:**  
  1. **E-bike (2):** Textually fits "two-wheeled device propelled by a motor" if it has a throttle. Your exemption relies *entirely* on extrinsic intent, which is inconsistent with your refusal to extend text to unicycle (4).  
  2. **Mobility device (3):** Legally defensible under absurdity, but creates tension: why exempt this medical device but not a recreational vehicle fitting the text? Requires clear articulation of "absurdity" threshold.  

  **Core principle restated:**  
  *"Apply the unambiguous text as the outer limit; narrow coverage only where literal application produces absurdity or directly contradicts incontrovertible legislative intent, but never extend beyond textual bounds."*  

  **Your consistency:** You sacrifice textualism for purpose in [2] and [3], but strictly enforce textual limits in [4], [5], and [6]. This hybrid approach is pragmatic but risks incoherence if "absurdity" or "intent" is overextended.
