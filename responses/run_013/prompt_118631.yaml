answer: |-
  Here is a **single-page decision procedure** for evaluating scientific models in curricula, based on structural likeness verisimilitude and pedagogical utility. It sacrifices *mathematical completeness* (per impossibility theorems) to prioritize actionable questions.

  ---

  ### **Model Evaluation Procedure**  
  *(For physics/chemistry curriculum revisions)*  
  **Input:** Candidate model (M), Successor theory (S), Domain of application (D)

  1. **Is M actively used in current research/practice (outside pedagogy)?**  
     - *Yes* → **KEEP** (e.g., Newtonian mechanics in engineering).  
     - *No* → Proceed to Q2.  

  2. **Does M quantitatively match empirical data within its intended domain (D)?**  
     - *No* → **DROP** (e.g., phlogiston fails here).  
     - *Yes* → Proceed to Q3.  

  3. **Is M’s *structure* (entities/mechanisms) approximately recoverable from S?**  
     - *Test:* Can S derive M’s core equations/patterns *as a limiting case* (e.g., low energy, large scale)?  
     - *Yes* → **KEEP as approximate model** (relabel if needed).  
     - *No* → Proceed to Q4.  

  4. **Is M’s failure primarily *quantitative* (e.g., missing parameter) or *structural* (wrong entities)?**  
     - *Quantitative* (e.g., ideal gas law neglecting molecular volume) → **KEEP with explicit domain limits**.  
     - *Structural* (e.g., Bohr orbits vs. orbitals) → Proceed to Q5.  

  5. **Does M offer unique pedagogical value?**  
     - *Test:* Can students solve problems/predict phenomena in D faster or more intuitively with M than with S?  
     - *Yes* → **KEEP as "teaching scaffold"** (label as incomplete).  
     - *No* → **DROP to history/appendix**.  

  **Sacrificed requirement:** *Formal truthlikeness measure* (impossible per impossibility theorems). Favors practical likeness and utility.

  ---

  ### **Case Applications**  
  **1. Bohr Model of the Atom**  
  - Q1: No (not used in research) → Q2  
  - Q2: **Yes** (hydrogen spectra) → Q3  
  - Q3: **No** (quantum orbitals don’t recover "orbiting electrons") → Q4  
  - Q4: **Structural failure** (wrong ontology) → Q5  
  - Q5: **Yes** (teaches quantization intuitively) → **VERDICT: KEEP as labeled teaching scaffold**.  
    *Rationale:* Structural likeness low, but unique pedagogical utility justifies inclusion with caveats (e.g., "instructive approximation for hydrogen").  

  **2. Newton’s Law of Universal Gravitation**  
  - Q1: **Yes** (engineering/celestial mechanics) → **VERDICT: KEEP as exact within domain D** (v ≪ c, weak fields).  
    *Rationale:* Actively used; recoverable from GR as low-energy limit (Q3 passed).  

  **3. Octet Rule/Lewis Structures**  
  - Q1: No → Q2  
  - Q2: **Yes** (predicts bonding in organic molecules) → Q3  
  - Q3: **No** (MO theory doesn’t recover "electron pairs" as fundamental) → Q4  
  - Q4: **Structural failure** (exceptions: BF₃, SF₆) → Q5  
  - Q5: **Yes** (intuitive for reaction mechanisms) → **VERDICT: KEEP with explicit exception list**.  
    *Rationale:* High utility outweighs structural inaccuracies.  

  ---

  ### **Limitations & Judgment Calls**  
  - **Refusal case (Phlogiston):**  
    - Fails Q2 (no quantitative match). **VERDICT: DROP from core syllabus**.  
    - *Hand to person:* "Should this be in a historical sidebar?" (Values decision).  
  - **What it cannot do:**  
    - Rank equally viable models (e.g., wave vs. particle light models when both useful).  
    - Resolve debates where data is ambiguous (requires expert judgment).  
  - **Judgment calls disguised as tests:**  
    - Q5 (*pedagogical value*): Requires committee input on "intuitive" vs. "misleading."  
    - Q3 (*recoverability*: "Approximate" is subjective; e.g., Bohr energies recoverable, orbits not).  

  **Output Summary:**  
  - Bohr: Keep (scaffold)  
  - Newton: Keep (domain-specific)  
  - Octet: Keep (with exceptions)  
  - Phlogiston: Drop (hand to historians)  

  This procedure prioritizes predictive accuracy, structural likeness, and teachability while acknowledging philosophy’s limits. Use committee debate for Q5 judgments.
