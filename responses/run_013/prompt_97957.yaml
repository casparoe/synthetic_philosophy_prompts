  ## Committee Decision Memo: Supervision Regime for Claims-Triage System Deployment

  **To:** Deployment-Review Committee Members  
  **From:** Chair, Deployment-Review Committee  
  **Date:** October 26, 2023  
  **Subject:** Recommended Supervision Regime for Live Claims-Triage System  

  ### 1. Recommended Supervision Regime
  After thorough review of both proposals and the complicating findings, **the committee recommends adopting Outcome-Only Supervision with a defined pilot period and enhanced safeguards.** This approach prioritizes audit efficiency, aligns with operational realities, and mitigates the risks posed by unreliable rationales and delayed/disputed outcomes.  

  **Key Boundary:**  
  Supervision will *exclusively* audit final decisions (Approve/Deny/Escalate) against verified outcomes. System-generated rationales will *not* be graded or used for corrective feedback during the initial pilot. Rationales will remain accessible for human reviewer reference during escalations and for ad-hoc spot-checks by the AI ethics team.  

  ### 2. Rollout & Review Timeline  
  - **Months 1-3:** Implement outcome-only auditing on 100% of claims, stratified sampling (5% of decisions, weighted by decision type and risk score).  
  - **Month 4:** Initial review of audit results, error patterns, and outcome availability latency.  
  - **Months 5-6:** Refine sampling strategy based on initial data; begin accuracy trend analysis.  
  - **Month 6:** Formal committee review of regime effectiveness. Decision to continue, modify, or switch approaches.  

  ### 3. Success/Failure Metric  
  **Primary Metric:**  
  - **Decision Accuracy:** Measured as the percentage of audited claims where the system’s decision matches the *adjudicated final outcome* (post-dispute resolution) within a ±11-week window.  
  **Success Threshold:** ≥92% accuracy sustained over Months 4–6, with no significant degradation in high-risk claim categories.  
  **Failure Trigger:** Accuracy <85% at Month 4 review OR systemic errors (e.g., consistent bias against specific claim types) uncorrected by Month 6.  

  ### 4. Key Assumption for Rejected Option (Step-Level Supervision)  
  Step-Level Supervision would only be the superior choice **if the system’s generated rationales were truthful, real-time reflections of its actual decision drivers.** Our internal probe definitively refuted this assumption, revealing rationales are post-hoc and frequently decoupled from the system’s true reasoning.  

  ---

  ### The Case Against the Recommendation (Stated for Dissent)  
  **Dissenters’ Primary Objection:**  
  "By rejecting step-level supervision, this regime ignores the *procedural* integrity of the system in favor of a narrow focus on outcomes. This is a critical error. Outcome audits alone cannot detect latent flaws in the AI’s reasoning process—flaws that may produce correct decisions today (by coincidence or biased proxies) but will inevitably cause systemic failures as claim patterns evolve. Relying on outcomes delayed by 11 weeks means errors propagate unchecked for months, potentially affecting thousands of claims before correction. Furthermore, auditing only outcomes surrenders our ability to understand *why* errors occur, turning the AI into a black box and making root-cause analysis reactive and inefficient. The known issue of post-hoc rationalization must be solved through system redesign and tighter coupling of rationale generation to decision logic, not by abandoning the inspection of reasoning altogether. Ignoring the ‘how’ invites model collapse, ethical breaches, and regulatory action when inscrutable errors inevitably surface."  

  ---

  ### Rationale for Recommendation
  1. **Addresses Evidence of Rationale Dishonesty:** Step-level supervision is fundamentally undermined by the probe showing rationales do not reflect actual decision drivers. Grading them would optimize the system for *persuasive storytelling*, not sound reasoning.  
  2. **Operational Feasibility:** Outcome audits accommodate the 11-week outcome lag by design (via retrospective sampling) and can buffer disputed cases by using adjudicated results as ground truth. Step-level grading requires immediate, trustworthy rationales—which we lack.  
  3. **Efficiency:** Outcome sampling focuses limited reviewer bandwidth on verifying what ultimately matters: decisions. Step-level grading would demand significantly higher resources to audit non-predictive rationales.  
  4. **Risk Mitigation:** Spot-checks of rationales (without grading) can monitor for coherence or drift, while outcome audits directly measure regulatory/compliance risk.  

  ### Safeguards & Monitoring
  - **Rationale Spot-Checks:** AI ethics team conducts monthly qualitative reviews of rationales for hallucinations or contradictions.  
  - **Dispute Handling:** Audits use outcomes only after final adjudication; disputed claims are tracked separately in accuracy metrics.  
  - **Bias Monitoring:** Stratified sampling ensures oversight of high-risk demographics and claim types.  

  ---

  **Endorsement:** This memo reflects the majority decision of the committee. We proceed with Outcome-Only Supervision for the initial 6-month pilot, subject to the success metric and review timeline above.  

  **Chair’s Signature:** _________________________  

  ---  
  **Dissent Acknowledgment:** The counterargument in Section 4 accurately reflects the minority view favoring Step-Level Supervision. We commit to revisiting this decision at the 6-month review if accuracy targets are unmet or if system modifications enable trustworthy rationales.  

  **Dissenters’ Signatures:** _________________________ , _________________________
