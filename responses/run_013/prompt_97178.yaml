prompt: |-
  Hey — I'm in an upper-level decision theory course (we've done the Savage axioms and just covered the Pascal's mugging stuff) and I've been roped into running the revision session before the midterm. I want to hand out one practice essay question with a model answer and a marking scheme so people can self-grade.

  I want it to test the crux rather than let people just retell the mugging. So it should force them to seperate two ways of resisting the mugger: (i) saying the offer isn't a genuine, well-defined gamble at all — the probabilities and payoffs are vague or unmeasurable — versus (ii) granting that it's perfectly well-defined but arguing expected-value maximization should be capped or probability-discounted anyway. Then the killer follow-up: the mugger can always ratchet the numbers up to beat whatever cap you set, so they have to say whether that defeats the "moderate" responses and leaves only biting the bullet or ditching expected utility entirely.

  And I want a twist so they can't just recycle the standard case: add a variant where the payoff is astronomically huge but *finite*, at an absurdly tiny probability, and ask whether the pull to hand over the money really depends on the payoff being infinite, or just on it being big enough that no human-scale threshold holds up. The finite case is the actually uncomfortable one, I think alot of my classmates will trip there.

  Could you write the essay question (~90 min), a model answer of about 550-650 words, and a marking scheme that names the specific moves an A answer must make versus a B, plus a one-liner on how people typically blow each point? Out of 20 marks is fine.
