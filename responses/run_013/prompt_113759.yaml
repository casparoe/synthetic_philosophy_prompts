prompt: |-
  I host a long-form interview podcast on science and ideas, and next month my guest is a philosopher of science who has spent much of her career defending a scaled-down version of Kuhn's incommensurability thesis. Her position, as she states it, has two parts. First, incommensurability is local rather than global: it arises when two research traditions' sorting vocabularies overlap only partially, so that a predicate central to one tradition has an extension cutting across several predicates of the other, and no translation can preserve both extension and inferential role at once. Second, and this is the part I want to press hardest, partial overlap does not restore comparability, because comparing two claims requires a shared standard of what would count as an answer, not merely a shared stock of objects to be described. She calls that standard a question-frame, and holds that rival traditions typically do not answer the same question differently; they answer different questions, and a common question can be reconstructed only from outside, by someone whose reconstruction is itself theory-laden.

  Draft eight to ten questions that make her work for it rather than restate the thesis, with at least one each on: the objection that partial overlap is precisely what makes translation possible, so that her thesis collapses into a claim about hard translation rather than about meaning; how she separates relativism about translation from relativism about truth, and why she takes the first to be defensible and the second not; and what the notion of a question-frame adds beyond the older notion of a paradigm, including what would count as evidence that two traditions are genuinely incommensurable rather than merely difficult to translate. Include one question on whether incommensurability could be asymmetric -- one side unable to state the other's claims while the reverse remains possible -- and one asking what she would have to give up if she is wrong. For every question, supply a follow-up keyed to the answer she is most likely to give, since her habitual move is to reply that her critics are assuming a shared question-frame rather than showing that one exists.
reasoning: |-
  Okay, the user hosts a science podcast and needs tough questions for a philosopher defending a scaled-down Kuhn incommensurability thesis. Let me unpack her position first. She argues incommensurability isn't global but local—happening when two research traditions' vocabularies partially overlap. Key point: partial overlap doesn't restore comparability because they need a shared "question-frame," not just shared objects. She also says traditions answer different questions, not the same ones differently.

  The user wants 8-10 questions that challenge her, not just restate the thesis. Specific requirements: one on partial overlap enabling translation (objection), one separating translation relativism from truth relativism, one on question-frames vs. paradigms (with evidence), asymmetric incommensurability, and what she'd give up if wrong. Each needs a follow-up anticipating her "no shared question-frame" rebuttal.

  Hmm, the user is clearly knowledgeable—they use precise terms like "extension" and "inferential role." They want to push the guest hard, especially on that question-frame concept. Probably aiming for a thought-provoking episode that doesn't let the guest off easy. Their hidden need might be exposing weaknesses in her thesis or clarifying it for listeners.

  For the partial overlap objection: Need to corner her on why partial overlap doesn't enable translation. Follow-up should challenge if she's conflating difficulty with impossibility.  

  For relativism split: Must clarify why translation being relative doesn't make truth relative. Follow-up could push if "warranted assertibility" avoids truth relativism.  

  Question-frames vs. paradigms: How is it different? Need concrete evidence criteria. Follow-up: Isn't identifying overlap already using a meta-frame?  

  Asymmetric case: Real-world examples? Follow-up: Doesn't asymmetry imply comparability?  

  Concession question: What if she's wrong? Follow-up: If she concedes comparability, does her whole project collapse?  

  Structure each with a sharp lead-in, core challenge, then the rehearsed follow-up. Avoid softball questions. Make sure all required angles are covered while keeping it conversational. Podcast vibe means questions should be accessible but incisive—no jargon dumps.
answer: |-
  Here are 10 rigorous questions designed to challenge your guest's refined incommensurability thesis, incorporating your specific requirements and anticipating her likely "shared question-frame" rebuttal, each with a targeted follow-up:

  1.  **The Translation Objection:** Critics like Davidson argue that *any* partial overlap in vocabulary and successful interaction between traditions *is* evidence of a shared conceptual scheme and makes translation possible (even if difficult). Doesn't your local incommensurability thesis simply describe *hard* translation problems arising from complex mappings, rather than demonstrating a genuine *failure* of meaning preservation that blocks comparability?
      *   *Follow-up (anticipating "no shared QF"):* When you claim partial overlap *doesn't* suffice for translation preserving inferential roles, aren't you presupposing a specific, external standard of "successful translation" and "inferential role" that the rival traditions themselves might not share or recognize? How do you justify *that* standard without assuming the very comparability you deny exists *between* them?

  2.  **Question-Frame vs. Paradigm:** You stress the "question-frame" as crucial for comparability, going beyond Kuhn's broader "paradigm." Could you precisely define a "question-frame" operationally? What *concrete methodological or empirical evidence* would demonstrate that two traditions definitively lack a shared question-frame (e.g., specific disagreements about admissible evidence, standards of proof, or what constitutes a relevant counter-argument), rather than just having deep disagreements *within* a shared frame?
      *   *Follow-up (anticipating "no shared QF"):* If historians or philosophers identify points of overlap in *methods* (e.g., both traditions use mathematics, controlled observation) or *goals* (e.g., both seek predictive accuracy), why isn't *that* evidence of a partially shared question-frame, allowing for limited comparability on *those* specific points, even if not on core ontological commitments?

  3.  **Asymmetric Incommensurability:** Is incommensurability necessarily symmetric? Could Tradition A be unable to fully state or grasp claims central to Tradition B (due to lacking concepts or a relevant question-frame), while Tradition B *can* successfully translate and engage with Tradition A's core claims (perhaps viewing A as a limited special case)? If so, what does this asymmetry imply about the nature of the barrier?
      *   *Follow-up (anticipating "no shared QF"):* If Tradition B *can* translate Tradition A, doesn't that imply B possesses a broader conceptual scheme or question-frame that *encompasses* A's, suggesting A is simply a subset or approximation within B's framework? Doesn't this undermine the claim of fundamental incommensurability and suggest comparability *is* possible from B's perspective?

  4.  **Relativism Split - Translation vs. Truth:** You defend relativism about *translation* (meaning is tradition-relative) but reject relativism about *truth* (claiming we can still talk about "warranted assertibility" within a tradition). How do you prevent the collapse of the latter into the former? If the *meaning* of a claim is fixed by its inferential role *within* a tradition, and rival traditions have incommensurable roles, how can "warranted assertibility within a framework" avoid becoming the *only* coherent notion of truth, effectively making *truth itself* relative?
      *   *Follow-up (anticipating "no shared QF"):* When you appeal to "warranted assertibility *within* a tradition," aren't you implicitly relying on the *internal coherence* of that tradition's question-frame as a standard? But if there's no external, neutral standard for comparing question-frames themselves, doesn't this leave us with multiple, equally valid (within their frame) but mutually inaccessible warranting practices, functionally equivalent to truth relativism?

  5.  **The Burden of Proof:** Your thesis places a significant burden on anyone claiming comparability to *demonstrate* a shared question-frame exists. But isn't the default assumption in most scientific discourse, especially when traditions address seemingly similar phenomena (e.g., disease, motion, heredity), that they *are* attempting to answer overlapping questions? Doesn't your position risk becoming unfalsifiable if *any* disagreement can be reinterpreted as evidence of different questions?
      *   *Follow-up (anticipating "no shared QF"):* When scientists from rival traditions *do* engage in debate, citing each other's work and attempting refutations, why isn't this prima facie evidence they *believe* they share enough of a question-frame for meaningful comparison? Mustn't your analysis show why this engagement is *necessarily* superficial or based on a misunderstanding, rather than a genuine clash within a shared frame?

  6.  **The Meta-Frame Dilemma:** You argue a "common question can be reconstructed only from outside, by someone whose reconstruction is itself theory-laden." Doesn't this create a regress? If the historian/philosopher reconstructs a common frame using *their own* theory-laden concepts, how is this "common frame" any less contingent or incommensurable than the original traditions? What privilege does this meta-perspective hold?
      *   *Follow-up (anticipating "no shared QF"):* If the meta-perspective is also situated and theory-laden, doesn't this mean *all* attempts at comparison, including your own analysis, are inherently perspectival and potentially incommensurable with other meta-perspectives? Doesn't this radicalize incommensurability rather than solving the comparability problem?

  7.  **Partial Overlap & "Shared Objects":** You state comparability requires a shared standard (question-frame), "not merely a shared stock of objects." But if traditions partially overlap in vocabulary and refer successfully (even extensionally) to some shared objects/interactions (e.g., pointing to the same star, measuring the same voltage), doesn't this provide *some* common ground – a minimal "proto-frame" – allowing for limited empirical comparison of predictions about *those* shared objects, even if deeper theoretical meanings diverge?
      *   *Follow-up (anticipating "no shared QF"):* When you dismiss shared reference to objects as insufficient, aren't you presupposing that *meaningful* comparison requires agreement on the *theoretical significance* or *categorization* of those objects? But isn't the ability to make competing predictions about the *behavior* of those shared objects under specific conditions a form of comparability that *doesn't* require full theoretical agreement, just shared identification and measurement protocols?

  8.  **What's at Stake - Concession:** If compelling evidence emerged that rival scientific traditions *could* consistently compare their claims on specific points using negotiated, partial translations grounded in shared experimental practices (even without full theoretical unity), what core element of your thesis would you *have* to abandon? Would it be the strong claim that partial overlap *cannot* restore comparability, or the centrality of the monolithic "question-frame"?
      *   *Follow-up (anticipating "no shared QF"):* If you conceded that such negotiated, practice-based comparisons *are* possible in some cases, wouldn't this force a retreat to a much weaker claim – that *some* core theoretical claims within traditions *might* be incommensurable – rather than the structural barrier posed by lacking a shared question-frame for entire traditions? Does this salvage the core insight?

  9.  **Evolution vs. Revolution:** How does your local incommensurability thesis account for the apparent *continuity* often observed in scientific development, where new theories seem to explain the successes of old ones as limiting cases or approximations? Doesn't this continuity suggest a significant degree of commensurability and shared question-frame, or is this continuity always a retrospective reconstruction?
      *   *Follow-up (anticipating "no shared QF"):* When scientists claim Theory B "subsumes" or "explains" Theory A, are they necessarily operating within B's question-frame, reinterpreting A's successes *only* in B's terms? If so, does this mean continuity is always an illusion created by the victor's frame, and genuine commensurability *across* the shift never existed?

  10. **Implications for Scientific Progress:** If rival traditions genuinely lack a shared question-frame and answer different questions, how can we rationally say one tradition constitutes *progress* over another? Doesn't this view reduce scientific advance to a kind of contingent "drift" towards questions we find more useful or tractable within our current frame, rather than progress towards truer answers about a shared world?
      *   *Follow-up (anticipating "no shared QF"):* If progress is defined as increased problem-solving effectiveness *within* a tradition or lineage, but traditions are incommensurable, doesn't this mean we can only talk about progress *within* lineages, never *across* fundamental shifts? Doesn't this fragment the very notion of scientific progress?

  These questions push on the logical coherence, empirical grounding, and implications of her thesis, forcing clarification on key distinctions (translation/truth, question-frame/paradigm), challenging the absoluteness of the "no shared question-frame" barrier, and probing the stakes if her core claims are wrong. The follow-ups directly engage her habitual move, demanding she defend the grounds of her *own* analysis against the same charge she levels at critics. Good luck with the interview!
