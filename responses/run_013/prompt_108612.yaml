prompt: |-
  I did thirty-odd years as a field geologist and retired a few years back, and I've spent the retirement trying to teach myself philosophy, slowly and probably badly. My neighbour Nadia taught political philosophy for decades and lets me argue with her about how to hand out a fixed pile of wellbeing. The numbers below are just how well each person's life is going; there's no money in it.

  Her calls so far, all of which she gives instantly:

  - Three people at 10 each, versus two at 3 and one at 30: she takes the three at 10. A bigger pile doesn't impress her if someones stuck at the bottom.
  - Three at 10, versus two at 10 and one at 30: she takes the second and thinks it's obvious — knocking the third person down to 10 wouldn't do anything for the other two, so what would be the point of it?
  - Three at 10, versus two at 10 and one at 1000: she takes the second again and says inequality by itself isn't what bothers her.

  The case I can't call. Six people. Option A brings the worst-off one, currently at 10 while the other five sit at 11, up to 11, so everyone ends at 11. Option B leaves that person at 10 and lifts the other five from 11 to 45 each.

  Which way does she go? What I'm really after is the rule she's running. My guess is it's either the worst-off person's level and nothing else, or everyone counts with the worse-off counting for more; I want what each of those predicts here, which one her earlier calls actually support, and what further case would pry them apart. If some third rule fits her three calls better than either of mine, say so.

  Give it to me as exactly five numbered points, a sentence or two each, no preamble and no summing-up at the end.
reasoning: |-
  Okay, let me tackle this step by step. The user is a retired geologist discussing philosophical dilemmas with his neighbor Nadia, who's a political philosophy professor. He's presented three prior judgments she made and a new case involving six people. He wants to know her decision in the new case, the underlying rule she's using, and how to test between two competing hypotheses.

  First, I need to analyze Nadia's three existing judgments. In the first scenario, she prefers three people at 10 over two at 3 and one at 30. This shows she prioritizes avoiding low minimums - the person stuck at 3 is unacceptable even with a higher total wellbeing. 

  The second case has her choosing two at 10 plus one at 30 over three at 10. She explicitly rejects leveling down when it doesn't benefit anyone, indicating she doesn't oppose inequality itself. The third case confirms this when she makes the same choice even with extreme inequality (10/10/1000).

  Now looking at the new dilemma: Option A brings everyone to 11 (raising the worst-off from 10), while Option B keeps one at 10 but lifts five others to 45. If Nadia followed pure maximin (only caring about the worst-off), she'd prefer Option A. But her prior decisions suggest she cares about improving lives, not just equality. 

  Her rule seems to be: prioritize sufficient minimum wellbeing first (hence rejecting the 3 in case one), but above that threshold, allow improvements that don't harm others. In Option B, the worst-off remains at 10 - same as now, while five jump to 45. Since 10 was previously acceptable (as baseline in other cases), and no one is harmed, she'd likely choose B.

  To test between maximin and prioritarianism (weighting worse-off more heavily), we'd need a case where improving the worst-off slightly reduces total wellbeing significantly. For example: Option X has worst-off at 12, others at 15 (total 100); Option Y has worst-off at 11, others at 100 (total 555). Maximin would prefer X (higher minimum), while prioritarianism might favor Y due to massive overall gains.

  I'll structure this as five precise points per the user's request, focusing on: 1) Nadia's decision in the new case, 2) her core rule, 3) why prioritarianism fits better than maximin, 4) supporting evidence from prior cases, and 5) a test case to distinguish theories.
answer: |-
  1.  Nadia chooses Option B: leaving one person at 10 and lifting the other five from 11 to 45.
  2.  Her rule prioritizes ensuring no one falls below a "sufficient" level (rejecting very low minima like 3), but above that threshold, she maximizes total wellbeing without actively leveling down.
  3.  Her choice rejects strict maximin (which would always pick the highest minimum and thus choose Option A's 11 over Option B's 10).
  4.  Her past calls support this: she rejected the very low 3 but accepted inequalities (10 vs 30, 10 vs 1000) when minima were above her sufficiency threshold (implied by accepting 10s), and rejected leveling down.
  5.  To distinguish prioritarianism (weighting the worse-off more heavily) from her rule, use: Option X has worst-off at 12 (others at 15, total 100) vs. Option Y has worst-off at 11 (others at 100, total 555). Her rule likely picks Y (higher total, sufficient minimum); prioritarianism might pick X.
