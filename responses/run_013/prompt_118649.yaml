  I'm a philosophy PhD student (logic and philosophy of math, mostly), and I've been patching up my set theory on the side. I just read the Zorn's lemma chapter in a popular math book and definately want a sanity check before I take any of it on board. Here's the book's version, more or less:

  "Zorn's lemma says that if you have a partially ordered set in which every chain — every totally ordered subset — has an upper bound somewhere in the set, then the set contains a maximal element, i.e. a biggest element that dominates everything else. It's equivalent to the axiom of choice, so it isn't really something you prove, it's something you assume; it's the workhorse behind every vector space having a basis and every field having an algebraic closure. The proof is a transfinite recursion: you build a chain up one element at a time and, when it can't be extended any further, the lemma hands you the maximal element you were climbing toward. One caveat: the chain condition has to be checked for finite chains as well, since a finite chain needn't have an upper bound."

  I'm inclined to think the gist is fine and that I'm just being paranoid, but two things nag at me. First, I've seen the lemma stated with "nonempty partially ordered set" as its own hypothesis and this version leaves it out — is the book cheating, or is nonemptiness free? Second, that last sentence about finite chains feels backwards, though I can't put my finger on why. Also, a friend told me it's basically the same statement as the Hausdorff maximal principle, which the book never mentions — is that the kind of "same" that matters?

  Give me exactly five numbered points, one or two sentences each, no intro and no conclusion. American English.
reasoning: |-
  Hmm, the user is a philosophy PhD student with a focus on logic and philosophy of math, and they're brushing up on set theory. They read a passage about Zorn's lemma in a popular math book and have some concerns. They want a sanity check on two main issues: whether the set should be nonempty, and why the book emphasized finite chains. They also mentioned that a friend compared it to the Hausdorff maximal principle.

  First, I need to address the nonemptiness point. The book didn't specify that the partially ordered set must be nonempty, but that's essential. If the set is empty, there are no chains, so the condition holds vacuously, but there's no maximal element. So, the book is incorrect here; nonemptiness must be stated explicitly.

  Next, the comment about finite chains. The book says the chain condition must be checked for finite chains because they might not have upper bounds. That seems backwards: finite chains always have upper bounds if the set is nonempty, since any finite chain has a maximum element. The real issue is that the condition requires upper bounds for all chains, including infinite ones, so finite chains are automatically covered. The book's caveat might confuse readers into thinking finite chains are a special case, but they're not—it's the infinite chains that are critical.

  Then, there's the equivalence to the Hausdorff maximal principle. The user's friend said they're basically the same, and I agree. Hausdorff's principle states that in any poset, there's a maximal chain, meaning one that can't be extended further. This is equivalent to Zorn's lemma through a chain of implications involving the axiom of choice, so it's the same in terms of proof strength and applications.

  I should also note that Zorn's lemma is indeed equivalent to the axiom of choice, as the book mentions, and it's fundamental for proofs like every vector space having a basis. The "workhorse" description is apt.

  Finally, the user asked for exactly five numbered points in American English, with no introduction or conclusion. I need to be concise—one or two sentences per point—and cover all their concerns without adding extras.

