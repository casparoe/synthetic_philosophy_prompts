answer: |-
  1.  The nonemptiness of the partially ordered set is an essential hypothesis; the book's omission is incorrect since the empty set vacuously satisfies the chain condition but has no maximal element.
  2.  The chain condition explicitly requires that *every* chain (including finite ones) has an upper bound *in the set*, but finite chains inherently have upper bounds (like their maximum) if the set is nonempty.
  3.  The book's caveat about finite chains is misleading; the critical requirement is ensuring upper bounds for *infinite* chains, as finite chains pose no special obstacle in a nonempty poset.
  4.  Zorn's Lemma is indeed equivalent to the Axiom of Choice and serves as the foundational tool for proofs like the existence of bases and algebraic closures, as the book correctly notes.
  5.  The Hausdorff Maximal Principle (every nonempty poset contains a maximal chain) is equivalent to Zorn's Lemma; they are interchangeable forms of the Axiom of Choice used in similar contexts.
