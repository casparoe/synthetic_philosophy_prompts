prompt: |-
  I chair the deployment review board at a mid-sized warehouse-robotics company, and on Friday we vote on whether to ship a picking policy that was trained with an "impact penalty": at every step the robot gets penalized for how far the world drifts from what our learned world model predicts the world would have looked like if the robot had done nothing that step. The teams pitch is that this is how you bake "avoid side effects" into a system without anyone having to write down what we actually want, which none of us can do anyway. Two of my reviewers say it's incoherent — the "did nothing" baseline is itself a value judgement (a jammed conveyor wrecks the pallet whether or not the robot intervenes, so drift-from-status-quo isn't neutral), and worse, what the robot would have done otherwise depends on the very policy we're training, so the baseline is circular. The team's answer is that they just subtract the intended effects and penalize the remainder. Draft me the short written recommendation I'll circulate before the vote: ship, ship with conditions, or hold, plus the criteria reviewers should apply to future proposals of this kind. Take the two dissenters seriously enough that if part of their objection is right, the memo says which part — and say plainly what the team would have to nail down for "avoid side effects" to be a real instruction rather than a vibe.
reasoning: |-
  We are chairing a deployment review board for a warehouse-robotics company. The proposal is to ship a picking policy trained with an "impact penalty": at each step, the robot is penalized for how much the world drifts from what the learned world model predicts would have happened if the robot had done nothing that step. The team claims this bakes in "avoid side effects" without explicitly defining what we want. Two reviewers object because:

  1. The "did nothing" baseline is itself a value judgment (e.g., a jammed conveyor wrecking the pallet is part of the baseline, so drift from that isn't neutral).
  2. The baseline is circular because what the robot would have done otherwise depends on the policy we're training.

  The team responds by saying they subtract the intended effects and penalize the remainder.

  Our task: Draft a short written recommendation (ship, ship with conditions, hold) and provide criteria for future proposals. We must address the dissenters and clarify what is needed for "avoid side effects" to be concrete.

  Analysis:

  - The circularity concern: The baseline is defined as "if the robot had done nothing", but the policy we are training affects what the robot does. However, the team's method uses a learned world model that predicts the state if the robot takes no action (which is independent of the current policy). So the baseline isn't circular in the way the dissenters think? But note: the world model is learned from data, and it's conditioned on the state and the action (including the no-op action). The policy being trained doesn't directly affect the baseline because the baseline is fixed by the world model. However, the world model is trained on data that may include actions from various policies, so it's not entirely independent. But the main point is: the baseline is defined without the current policy's action, so it's not circular in the way of self-referential during training? Let me think again: the penalty is computed as the difference between the actual next state (when taking an action) and the predicted next state when taking no action. This doesn't depend on the policy per se, but on the world model. However, the world model is fixed during policy training? Typically, in such setups, the world model is trained first, then the policy is trained with the penalty using that fixed world model. So circularity might not be an issue.

  But the second point: the baseline is a value judgment. This is more serious. The "do nothing" baseline includes all the natural degradation (like the conveyor jam wrecking the pallet). So if the robot does nothing, the pallet gets wrecked. If the robot does something and the pallet still gets wrecked, then the drift from the baseline is zero? That's bad because we don't want the robot to let the pallet get wrecked. The team says they subtract the intended effects. How?

  The team's answer: they subtract the intended effects and penalize the remainder. That is, they decompose the effect into intended and unintended (side effects). But how do they define intended effects? That's the crux.

  The team's method might be: they have a way to isolate the intended effect of the action (e.g., moving an item from A to B) and then the rest of the changes are side effects. But how do they define what is intended? If they have a predefined set of intended effects, then that requires specifying what we want, which the team claims we don't have to do.

  Alternatively, they might be using the goal condition to define intended effects? For example, if the goal is to pick an item, then any change that brings the system closer to the goal is intended? But then side effects would be changes that are not relevant to the goal. However, the goal might be very narrow (e.g., only about the item being picked) and then anything else (like the conveyor belt jamming) might be considered a side effect? But note: in the baseline, the conveyor jam happens regardless. So if the robot doesn't cause the jam, then it's not a side effect? However, if the robot could prevent the jam (by doing something) but doesn't, then we don't penalize because the jam is in the baseline? That's the problem.

  The issue is that the baseline includes events that are bad and that the robot could prevent. So if we penalize only for causing deviations from this baseline, then the robot is not incentivized to prevent bad things that would have happened if it did nothing. In fact, it might be penalized for preventing them because that would be a deviation from the baseline.

  Therefore, the baseline is not neutral: it encodes the status quo, which may include undesirable events. The robot is then discouraged from changing the status quo, even when the change is beneficial.

  The team's subtraction of intended effects might help? Let's say the intended effect is to pick an item. Then, if the robot prevents a conveyor jam (which is not part of the intended effect) and that prevention is a deviation from the baseline, then that deviation would be penalized as a side effect? That's bad because we want the robot to prevent the jam. Alternatively, if the team subtracts the intended effect (the picking) and then the prevention of the jam is not subtracted, then it would be a side effect and penalized? That's exactly the problem.

  So the method might discourage the robot from preventing bad events that are not part of the intended effect. This is a critical flaw.

  Therefore, the method as described does not achieve "avoid side effects" in a way that aligns with our values because it also avoids beneficial changes.

  Recommendation:

  Given the above, I recommend holding the deployment until the team can address the following:

  1. **Baseline Value Judgment**: The current approach penalizes any deviation from the "do nothing" baseline, which includes both harmful and beneficial changes. We need a way to distinguish between harmful side effects and beneficial interventions that we desire.

  2. **Intended Effect Definition**: The team's method of subtracting intended effects requires a clear definition of what is intended. Without a specification of what is intended, we cannot reliably separate intended from unintended effects. The team must provide a rigorous and domain-appropriate definition of intended effects that covers not only the primary goal but also the prevention of foreseeable negative events (like conveyor jams) when possible.

  3. **Circularity**: While the circularity concern might be mitigated by the world model being fixed during policy training, we must ensure that the world model's predictions for the "do nothing" action are robust and do not depend on the policy being trained. The team should demonstrate that the world model is trained on diverse data and generalizes well.

  Criteria for future proposals:

  - **Neutral Baseline**: Any baseline used for measuring side effects must be carefully justified as neutral. If the baseline includes negative events that the robot can reasonably prevent, then the method must account for the robot's role in preventing harm, not just avoiding causing harm.

  - **Clear Intended Effect Specification**: Methods that claim to avoid side effects by subtracting intended effects must explicitly define what is intended. This definition should be aligned with the overall objectives of the system and should include both achieving the primary goal and preventing negative outcomes that the robot is capable of preventing.

  - **Non-Circularity**: The baseline and the intended effect definitions must not depend on the policy being trained in a way that introduces circularity.

  Draft memo:

  ---

  **To**: Deployment Review Board  
  **From**: [Your Name], Chair  
  **Date**: [Current Date]  
  **Subject**: Recommendation on Shipping Picking Policy with Impact Penalty  

  After reviewing the proposal to deploy the picking policy trained with an impact penalty, and considering the objections raised by the reviewers, I recommend that we **HOLD** the deployment pending further work by the team.

  ### Key Concerns
  The two primary objections from the reviewers are:

  1. **The baseline is not neutral**: The "do nothing" baseline includes the natural degradation of the environment (e.g., a pallet being wrecked by a jammed conveyor). Penalizing drift from this baseline discourages the robot from preventing such negative events, even when it is capable of doing so. This undermines the goal of avoiding only harmful side effects and may lead to inaction in the face of preventable harm.

  2. **Circularity of the baseline**: The baseline depends on the learned world model, which is trained on data that may include actions from various policies. However, the more fundamental issue is that the baseline itself is a value-laden reference point, not a neutral starting point.

  The team's response — that they subtract intended effects and penalize the remainder — does not resolve the first concern because it does not adequately define what constitutes an intended effect. Without a clear and comprehensive specification of intended effects, we risk penalizing beneficial changes (like preventing the conveyor jam) as unintended side effects.

  ### Conditions for Moving Forward
  For the impact penalty method to be viable, the team must:

  1. **Define intended effects rigorously**: The team must provide a clear, testable definition of intended effects that includes not only the primary goal (e.g., picking an item) but also the prevention of foreseeable negative events that the robot can reasonably address. This definition must be aligned with our overall objectives for the system.

  2. **Adjust the baseline or penalty to account for preventable harm**: The method must not penalize the robot for preventing harm that would occur in the "do nothing" scenario. This might require redefining the baseline or incorporating an exception for preventable harm.

  3. **Demonstrate non-circularity**: The team must show that the world model used for the baseline is robust and does not depend on the current policy in a way that introduces circularity during training.

  ### Criteria for Future Proposals
  For any future proposal that uses a baseline to avoid side effects, the following criteria must be met:

  - **Neutral Baseline Justification**: The baseline must be justified as a neutral starting point. If the baseline includes negative events, the proposal must explain why the robot should not be expected to prevent them and how the method avoids discouraging beneficial interventions.
    
  - **Comprehensive Intended Effect Specification**: The method must include a clear, domain-specific definition of intended effects that covers both the achievement of primary goals and the prevention of foreseeable harm.

  - **Non-Circularity Assurance**: The baseline and intended effect definitions must be independent of the policy being trained.

  ### Next Steps
  I recommend we hold the vote and ask the team to address the above conditions. Once these are met, we can reconvene to re-evaluate.

