answer: |-
  Here is a specification of desiderata for any account justifying the "presumption of independence" between apparently unconnected things. The requirements are derived from your cases, philosophical tensions, and the need for coherence. Conflicts between desiderata are explicitly noted.

  ---

  ### **Desiderata for the Presumption of Independence**

  1.  **Ordinary Physical Cases (Robust Separation):**
      *   **Requirement:** The account must justify presuming independence for *mindless, non-interacting physical systems* (e.g., two fair dice rolled together, a coin flip and a die roll, genuinely separate thermometers measuring different rooms). It must **withdraw this presumption** when interaction or a *common cause* is evident (e.g., two thermometers in the *same* room presumptively share the room's temperature as a common cause, making readings dependent even if individually reliable).
      *   **Precision:** The account must provide a *testable criterion* distinguishing "no known connection" from "known mechanism for dependence". It cannot rely solely on "be careful"; it must explain *why* dice are independent but thermometers in a room are not *by default*.

  2.  **Reparametrization Invariance:**
      *   **Requirement:** The presumption of independence must be invariant under *separate, smooth reparametrizations* of the variables describing each system (e.g., measuring temperature in °C vs °F, distance in meters vs feet). An account that yields different independence judgments based solely on the *description* of the same physical setup (e.g., Bertrand's Paradox) is inadequate.
      *   **Status:** This is a **core requirement**, not a bonus. It protects the presumption from arbitrariness. An account *must* satisfy this while still handling ordinary cases correctly. Failure here invalidates the presumption as objectively meaningful.

  3.  **Mathematical/Fixed Truth Cases (Non-Frequentist Grounding):**
      *   **Requirement:** The account must license a *principled analogue* of the presumption of independence for fixed, non-chancy mathematical statements or constants (e.g., "digits of π and *e* at position N are independent", "Conjecture A and Conjecture B are probably unconnected"). This analogue must justify surprise at coincidences and the "no reason to fail" intuition.
      *   **Constraint:** Meeting this requirement **forces the account to abandon strict frequentism** as the sole foundation for the presumption. Probability here must be epistemic (degree of belief) or logical (intrinsic plausibility), not solely based on physical randomness or limiting frequencies.

  4.  **Agency and Potential Manipulation:**
      *   **Requirement:** The account must **deny or severely weaken** the presumption of independence when there exists a *capable agent* with *knowledge and incentive* to create dependence *after* observing your initial state or prediction (e.g., lottery operator seeing your ticket, opponent in "guess-my-number" hearing your guess). The mere *possibility* of such an agent isn't enough, but a *plausible scenario* with motive/means must block the default presumption.
      *   **Distinction:** This sharply separates mindless physical processes (where presumption holds by default) from strategic interactions involving hidden agency (where it does not).

  5.  **Pairwise vs. Mutual Independence:**
      *   **Requirement:** The account must **acknowledge and handle** the distinction between pairwise independence (any two events are independent) and mutual/complete independence (all events jointly are independent). It *cannot* stipulate this complexity away. An adequate account must explain why the presumption might reasonably apply pairwise but fail mutually, or vice-versa, in specific contexts (e.g., three events designed to be pairwise independent but jointly dependent).

  6.  **The Infinite Case (Zero Probability ≠ Impossibility):**
      *   **Requirement:** For an endless sequence of presumed-independent events, the account must **reconcile** the intuitive claim that "the probability all events turn out a specific way is zero" (if each has a fixed probability <1) with the **logical possibility** that this outcome *could* occur. It must avoid concluding that such an outcome is *impossible* solely based on the infinite product of probabilities equaling zero. The presumption must survive this conceptual challenge.

  7.  **Ontological vs. Epistemological Status:**
      *   **Requirement:** The account must explicitly state whether the presumption reflects a belief about the *world* (ontological independence: "these things *are* unconnected") or solely about *knowledge* (epistemological independence: "I *lack information* connecting them"). It must then be **internally consistent** with this stance: If ontological, it must explain failures as world-structure errors. If epistemological, it must explain failures as information-update errors, without smuggling in ontological claims.

  ---

  ### **Tensions and Conflicts Between Desiderata**

  1.  **Usefulness vs. Safety (The Core Tension):**
      *   **Tension:** Desideratum 1 (Ordinary Cases) demands a *useful* presumption applied *freely* where connections are unknown. Desiderata 4 (Agency) and 7 (Epistemology) highlight that this free application is *unsafe* – it fails catastrophically when unmodeled common causes or strategic agents exist. An account that requires *evidence of independence first* (to be safe) renders the presumption useless (violating the need for a default in Ordinary Cases).
      *   **Resolution?:** This tension is **fundamental and likely unresolvable** without context. Any useful account requires a *heuristic threshold* for applying the presumption based on (a) lack of *known* connection, (b) plausibility of mindlessness (vs. agency), and (c) absence of obvious common cause mechanisms. It remains inherently fallible.

  2.  **Mathematical Cases vs. Frequentism:**
      *   **Tension:** Desideratum 3 (Mathematical Cases) requires grounding the presumption without physical randomness. Desideratum 7 (Epistemology) might push towards an epistemic view. However, a purely subjective Bayesian "state of mind" account struggles with Desideratum 2 (Invariance) – why should *my* ignorance lead to an invariant prior? A logical probability view faces challenges in defining "intrinsic plausibility" uncontroversially.
      *   **Resolution?:** This strongly favors **non-frequentist** accounts (epistemic or logical). Invariance (D2) pushes towards **objective** priors based on symmetries or information-theoretic principles (e.g., maximum entropy), even for mathematical truths.

  3.  **Invariance vs. Ontology/Epistemology:**
      *   **Tension:** Desideratum 2 (Invariance) demands the presumption be independent of description, suggesting an objective basis (ontological or logical). However, Desideratum 7 allows for epistemological interpretations, which are inherently tied to an agent's knowledge state and representation. Can an agent's ignorance lead to an invariant prior?
      *   **Resolution?:** This pushes the account towards **objective Bayesianism** or **logical probability**. The invariance requirement argues that the presumption is not *merely* subjective ignorance but must reflect a deeper principle of indifference or symmetry inherent in the *structure* of the possibilities themselves, regardless of an agent's description.

  ---

  ### **Verdict on Common Approaches Relative to Desiderata**

  1.  **Pure Frequentism:**
      *   **Fails:** D3 (Mathematical Cases - no frequencies), D7 (only about the world, struggles with ignorance), D2 (invariance not inherent to frequencies). Only addresses D1 partially (for repeatable physical trials).

  2.  **Subjective Bayesianism (Independence as Prior Belief):**
      *   **Strengths:** Handles D1, D3, D4 (can model agency), D5, D6, D7 (explicitly epistemological).
      *   **Weaknesses:** **Struggles severely with D2 (Invariance).** Why should different agents, or the same agent with different parametrizations, share the *same* prior belief in independence? Lacks an objective basis for the default prior. Safety (avoiding D1 failures) depends entirely on prior choice, which is arbitrary without further constraints.

  3.  **Objective Bayesianism / Maximum Entropy:**
      *   **Strengths:** Addresses D2 (Invariance - priors based on symmetries/invariance groups), D1, D3 (can assign probabilities based on state spaces), D5, D6, D7 (can be framed epistemologically with objective constraints).
      *   **Weaknesses:** Defining the correct "uninformative prior" or symmetry group can be contentious (especially for D3, D4). Handling D4 (Agency) explicitly is complex. Safety (avoiding D1 failures) depends on correctly identifying constraints (common causes must be explicitly ruled out or included).

  4.  **Logical Probability / Indifference Principles:**
      *   **Strengths:** Directly addresses D2 (Invariance - based on state space structure), D3, D7 (ontological/logical basis for plausibility). Provides a strong normative basis for D1.
      *   **Weaknesses:** Highly controversial and difficult to define rigorously for complex or continuous spaces (prone to paradoxes like Bertrand's if misapplied). Struggles with D4 (Agency - logical probability struggles with strategic knowledge) and D1 failures (common causes need explicit modeling).

  ---

  ### **The Single Most Constraining Requirement**

  *   **Desideratum 2 (Reparametrization Invariance)** is the **most powerful constraint**. It immediately rules out simplistic applications of the Principle of Indifference (e.g., "all possibilities equally likely" without considering invariance) and purely subjective priors that change with description. It forces the account towards objective structural principles (symmetry, information geometry) underlying the presumption, whether ontological or epistemological. Any account failing D2 cannot be considered adequate.

  ### **Conclusion: The List and its Satisfiability**

  The desiderata form a coherent but **tension-filled** set. No account satisfies them all perfectly and uncontroversially. The core tension between **usefulness/freedom (D1, D3)** and **safety/precision (D4, D7)** is fundamental. **Invariance (D2)** is the strictest gatekeeper, demanding an objective structural basis. **Mathematical Cases (D3)** force a non-frequentist foundation.

  An adequate account must be **non-frequentist** (due to D3), **respect invariance** (D2), explicitly **handle agency vs. mindlessness** (D4), **acknowledge the pairwise/mutual distinction** (D5), and be **internally consistent** about its ontological/epistemological stance (D7). It will likely be a form of **Objective Bayesianism** or **Logical Probability**, incorporating symmetry/invariance principles to define "uninformative" priors for independence where no connections are known *and* no common cause/agency is plausible. However, the **presumption remains inherently heuristic and fallible** due to the unresolvable tension between usefulness and safety. Its legitimacy stems from its grounding in structural symmetries and its necessity for practical reasoning under ignorance, not from infallibility.
