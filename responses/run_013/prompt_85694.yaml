prompt: |-
  I'm a backend engineer with zero formal philosophy training and I've gone down a rabbit hole I can't climb out of. It started with the no-free-lunch theorems — the ones that say no optimisation algorithm beats random search once you average over every possible objective function — and now I'm reading about induction, and I've realised I don't actually know what I'm asking for when I ask whether induction is justified. So before I read any more: write me the spec. What does any theory of inductive inference have to deliver to count as adequate?

  Five requirements, exactly five, one or two sentences each, no intro and no closing summary. For each one give me the case that makes it a requirement, and say whether you'd call it non-negotiable or just something one camp insists on. Fold everything else into those five, I dont want a sixth bullet.

  Three things I want worked in. First, someone told me there's a scheme that puts a probability on every computer program that could have generated your data, favouring short programs, and it's supposed to eventually lock onto any pattern that's computable — that sounds like exactly the free lunch the theorems say can't exist, so I want whichever requirement covers it to force the question of where the assumption is hiding. Second, I keep bumping into the green-until-2030 emeralds example and it broke my brain, so I want a requirement about which patterns are even eligible to be projected, and it has to rule out the bad ones without just saying "the natural ones". Third, I want the requirement that does the most to rule candidates out, and if two of the five can't both be had at the same time, say so inside whichever of the five it belongs to.
reasoning: |-
  Okay, I see this user is a backend engineer diving into philosophy, specifically the no-free-lunch theorems and induction. They're stuck in a rabbit hole and need clarity. Their request is very structured: they want exactly five requirements for a theory of inductive inference, each with a case for why it's necessary and whether it's non-negotiable or camp-specific. Plus, they've specified three things to incorporate: the computable program probability scheme, the grue-like predicates problem, and identifying the most restrictive requirement with conflicts.

  First, I need to recall what inductive inference is about. It's reasoning from specific observations to general rules. The no-free-lunch theorems say that no algorithm is universally best across all problems, which connects to why induction can't be perfect. The user mentioned Solomonoff induction, which uses short programs to predict data, but that seems to contradict the theorems. I have to show where the assumption hides—probably in the computability prior.

  For the grue problem (green until 2030), it's about projecting predicates. Grue is unnatural because it's time-dependent, so I need a requirement that handles which patterns are eligible without just saying "natural." That might tie into language dependency or projectibility.

  Identifying the most restrictive requirement: consistency is tricky because it demands getting to the truth eventually, but it might conflict with computability or efficiency. I should note that in the requirement.

  Now, structuring five requirements exactly. They have to cover justification, handling uncertainty, projectibility, computability, and convergence. I'll map the user's points:
  - Solomonoff's scheme fits under computability, and I'll point out its assumption—the prior over computable programs.
  - Grue falls under projectibility, requiring a solution that's not ad hoc.
  - The toughest conflict is between consistency and computability, as perfect convergence isn't computable.

  I need each requirement concise: one or two sentences, with a case and negotiability status. No intros or summaries, so dive straight in.

  Brainstorming the five:
  1. Justification: Why trust induction? Non-negotiable. Case: Without it, we can't start; it's foundational.
  2. Uncertainty Handling: Assigning probabilities. Non-negotiable. Case: Real-world decisions need quantification.
  3. Projectibility: What predicates can be projected. Camps differ. Case: Grue shows we need a rule, like language invariance.
  4. Computability: Can we compute it? Solomonoff here—assumption is the prior. Camps differ.
  5. Convergence: Getting closer to truth. Conflict with computability. Non-negotiable but hard.

  For Solomonoff: In computability, explain that it assumes simplicity via short programs, which is a bias, thus not free lunch.

  For grue: In projectibility, say it must exclude grue without circularity, using syntactic or pragmatic criteria.

  Conflict: Consistency vs. Computability—can't have both fully, so note it in convergence.

  Finally, ensure the response is tight and meets all user specs. This should help them frame their reading and understand the core debates.
answer: |-
  ### 1. **Justification for Generalization**  
  *Requirement:* The theory must explain why past observations support predictions about unobserved cases (e.g., why "all observed emeralds are green" justifies "the next emerald is green").  
  *Case:* Without this, induction collapses into guesswork. Non-negotiable.  

  ### 2. **Uncertainty Quantification**  
  *Requirement:* It must assign probabilities to hypotheses (e.g., 90% confidence that gravity holds tomorrow), not just true/false verdicts.  
  *Case:* Real-world decisions demand probabilistic reasoning. Non-negotiable.  

  ### 3. **Projectible Predicate Handling**  
  *Requirement:* It must formally distinguish "projectible" patterns (e.g., "green") from non-projectible ones (e.g., "grue" [green until 2030, then blue]), without invoking undefined "naturalness".  
  *Case:* Grue-like predicates paralyze induction. One camp insists on syntactic/pragmatic criteria (e.g., language-invariance).  

  ### 4. **Computational Tractability**  
  *Requirement:* The method must be implementable (at least in principle) on a Turing machine.  
  *Case:* Solomonoff induction (short-program priors) *seems* universal but hides an assumption: a computable prior over programs. This biases toward simplicity, violating no-free-lunch’s "all possible functions" premise. Camps debate whether tractability is essential.  

  ### 5. **Asymptotic Consistency**  
  *Requirement:* With infinite data, the method must converge to the true hypothesis (if one exists).  
  *Case:* Without consistency, truth is unreachable. *Conflict:* Strict consistency clashes with computability (Rice’s theorem: no algorithm can identify all computable patterns). Non-negotiable for frequentists; Bayesians accept weaker guarantees.
