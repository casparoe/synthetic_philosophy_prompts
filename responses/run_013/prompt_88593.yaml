prompt: |-
  I have been reading around the so-called "geometric rationality" programme — the family of ideas that grows out of Kelly betting, log-wealth maximisation, and the broader thought that a rational agent is one whose beliefs and values behave well under repeated compounding, rather than one who maximises expected utility at a single moment — and I keep finding myself unable to tell which of its loose ends are load-bearing and which are mere curiosities. I am about to begin a two-year postdoc with a good deal of intellectual freedom, and I would rather spend it on the questions in this area that actually matter than on the ones that merely sound deep. So I would like you to act as a philosopher of decision theory and probability who has thought carefully about this literature and also about its connections to Bayesian epistemology, evolutionary arguments, and the theory of growth under uncertainty, and to set me an agenda. Please begin by brainstorming the full space of candidate questions before you commit to any ordering.

  What I want is a defended ranking, not a survey. For each of the main open questions you can identify — for instance, how the growth-rate picture should handle one-shot or non-ergodic situations, where the "bet" is not repeated and the long-run justification seems to evaporate; whether it can accommodate ordinary risk aversion and the things people actually care about (health, relationships, a life) rather than a single fungible bankroll; how it should treat trade-offs between different agents, or across different possible worlds, where there is no common "wealth" to compound; whether the time-average and the ensemble-average can genuinely be reconciled or whether the framework must simply pick one and pay the price; and whatever else you think deserves a place on the list — tell me how much each matters, how tractable it is for someone with a decision-theory background and no laboratory, how neglected it is, and, above all, how many other questions depend on it. I care far more about the dependency structure and the reasoning than about the list itself: which questions are upstream of which, which ones, if settled, would dissolve a whole cluster of others, and which are traps — hard, famous, and downstream of everything else. Where you can, illustrate the reasoning with a small concrete case rather than an abstract gesture.

  To keep the deliverable honest and usable, finish with a compact structured summary that I can paste into a spreadsheet: a JSON object with a top-level field "ranking" holding an ordered array, each element an object with the fields "question" (a one-sentence statement), "why_it_matters" (the single most important reason), "upstream_of" (a list of the other questions it would help settle), "tractability" (one of "high", "medium", "low"), "neglectedness" (one of "high", "medium", "low"), "what_would_change_the_ranking" (one or two sentences), and "confidence" (a number between 0 and 1 for your own ranking). Give me the argument in prose first, and write the whole response in British English.
