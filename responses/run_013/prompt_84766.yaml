prompt: |-
  A friend and I spent most of last night arguing about psychiatric diagnosis, and I want to turn the disagreement into something usable. She works in community mental health and thinks new diagnostic labels mostly recognize what was always there; I think a label can change the people who receive it, so that the next version of a manual is partly describing a population the previous version helped create. I am on the diagnostic review panel of a mid-sized nonprofit health system. The panel is two clinicians, an administrator, a data analyst, and a patient representative. We maintain the local intake and screening forms, recommend whether to add, keep, or rewrite categories, and train clinicians in their use. We meet monthly, our decisions affect about 40,000 patients a year, and the medical director has final sign-off. We have been asked to decide whether to add a new screening category for Problematic Short-Form Video Use; whether to keep our current burnout screening item, which patients have begun to treat as a diagnosis and a basis for accommodation requests; and whether to replace our borderline personality disorder screening label with a trauma-informed alternative. Please write a decision procedure the panel can actually run on a proposal to add, retain, or modify a diagnostic category, one that treats looping effects as a central input rather than a public-relations problem. By looping effects I mean the phenomenon Ian Hacking described: a classification can change the people classified, which then changes the classification. I am not asking for a literature review or citations; I need the procedure itself.

  The procedure should ask questions in a fixed order, with a clear criterion for what counts as a sufficient answer at each step and a clear stopping rule for when the panel should decline or defer. It should distinguish at least two kinds of loop: meaning loops, where the label's sense shifts as patients, clinicians, and advocacy groups negotiate what it means, and leverage loops, where people adopt or resist the label to obtain resources, exemptions, solidarity, or a story about themselves. Say how the procedure should treat these differently. It should include a loop audit that runs before the category goes on any form and again at a fixed review interval, with specific evidence the panel should collect from clinicians, patients, and intake data. It should end with a loop-liability rating on a simple scale and a default sunset or review date. It should say where the procedure must stop and hand the question to a person or body because the issue is a value question rather than an empirical one, and it should identify which steps are judgment calls dressed up as procedure. It should be usable in a 60-minute meeting by clinicians and administrators, not philosophers, and it should say what the panel should do when it cannot get the evidence the procedure asks for.

  Then apply the procedure to the three cases above. For each, give the answers to the questions as far as they can be given, the recommendation, and the points where the procedure is silent. Make sure at least one application yields a recommendation I will not like, and explain why the procedure nonetheless supports it. Finally, state what the procedure cannot do and where it is likely to misfire.
reasoning: |-
  We are designing a decision procedure for a diagnostic review panel. The procedure must account for looping effects (both meaning loops and leverage loops) and be practical for a 60-minute meeting. It will have a fixed order of questions, criteria for sufficient answers, stopping rules, and a loop audit. It should also include a loop-liability rating and a default sunset/review date. The procedure must indicate when to hand off value questions and which steps are judgment calls.

  Key components:
  1. **Looping Effects**: 
     - **Meaning loops**: Changes in the understanding of the label by patients, clinicians, and advocacy groups.
     - **Leverage loops**: Adoption or resistance to the label for resources, exemptions, solidarity, or self-narrative.

  2. **Procedure Structure**:
     - Fixed order of questions with clear criteria for sufficient answers.
     - Stopping rules to decline or defer if criteria not met.
     - Loop audit before implementation and at fixed intervals.
     - Loop-liability rating (e.g., Low, Moderate, High) and sunset date.
     - Hand off value questions to a designated person/body (e.g., medical director, ethics committee).
     - Identify steps that are judgment calls.

  3. **Loop Audit**:
     - Collect evidence from clinicians (e.g., focus groups, surveys), patients (e.g., interviews, feedback forms), and intake data (e.g., frequency of the label, co-occurring conditions, treatment outcomes).
     - Specific evidence for meaning loops: changes in interpretation, narratives, and clinical understanding over time.
     - Specific evidence for leverage loops: patterns of seeking or avoiding the label, resource allocation, accommodation requests.

  4. **When Evidence is Unavailable**:
     - If evidence cannot be obtained, the panel must decide based on available information and note the uncertainty. The loop-liability rating may be higher, and the sunset date may be set earlier for review.

  **Decision Procedure Outline**:

  1. **Step 0: Pre-screening (if adding a new category)**
     - Check if the proposed category is already recognized in major diagnostic manuals (DSM, ICD) or has substantial evidence in peer-reviewed literature. If not, the panel may decline immediately (unless there is a strong local rationale) and note the need for more research.

  2. **Step 1: Define the Category**
     - **Question**: Can the category be clearly defined in terms of symptoms, duration, functional impairment, and exclusion criteria?
     - **Criterion**: A written definition must be provided that is specific and measurable. If not, defer until defined.
     - **Stopping Rule**: If no clear definition, decline or defer.

  3. **Step 2: Assess Clinical Utility**
     - **Question**: Does the category improve prediction of treatment response, prognosis, or service allocation compared to existing categories?
     - **Criterion**: Evidence from local data or literature showing improved outcomes. If not, the category may be redundant or harmful.
     - **Stopping Rule**: If no clinical utility, decline.

  4. **Step 3: Loop Risk Assessment**
     - **Question**: What is the potential for meaning loops and leverage loops? Rate each separately (Low, Moderate, High) based on:
       - **Meaning loops**: How much ambiguity is in the definition? How likely are interpretations to shift? (e.g., if the category is based on a new or contested concept, risk is high)
       - **Leverage loops**: How might the label be used for resources (e.g., accommodations, disability), exemptions, or identity? How might it be stigmatized or sought after?
     - **Criterion**: Panel discussion and rating based on available evidence (e.g., similar categories' history, patient advocacy presence, media coverage). This step is a judgment call.
     - **Stopping Rule**: If both loops are rated as High, the panel must either defer for more research or design specific mitigation strategies (e.g., strict criteria, training, monitoring) before proceeding.

  5. **Step 4: Loop Audit Plan**
     - **Question**: What evidence will be collected to monitor looping effects? The plan must include:
       - **Meaning loops**: Regular surveys/focus groups with clinicians and patients on how they understand the category; analysis of chart notes for shifts in language.
       - **Leverage loops**: Tracking accommodation requests, resource allocation, and patient self-identification; monitoring social media/advocacy group discussions if feasible.
       - **Timing**: Baseline audit before implementation, then at fixed intervals (e.g., annually). Also, set a sunset date (e.g., 2 years for high liability, 4 for moderate, 5 for low).
     - **Criterion**: The plan must be feasible and approved by the data analyst and medical director.
     - **Stopping Rule**: If no feasible audit plan, the panel must decline the category or set a very short sunset (1 year) and note the risk.

  6. **Step 5: Value Questions Check**
     - **Question**: Are there unresolved value conflicts (e.g., medicalization of normal behavior, potential for discrimination, identity politics)? If so, hand off to the medical director or ethics committee.
     - **Criterion**: If the panel identifies a value conflict that cannot be resolved by data, it must be escalated.
     - **Stopping Rule**: Hand off and pause the procedure until resolved.

  7. **Step 6: Final Decision and Loop-Liability Rating**
     - **Question**: Based on Steps 1-5, what is the overall loop-liability rating (Low, Moderate, High)? This is a judgment call by the panel.
     - **Decision**: 
       - Approve with a sunset date and audit plan.
       - Approve for a pilot (limited implementation) if evidence is weak.
       - Decline.
     - **Sunset Date**: Set based on liability rating: High -> 2 years; Moderate -> 3 years; Low -> 5 years.

  **When Evidence is Unavailable**:
  - For any step requiring evidence, if it is unavailable, the panel must:
    - Note the gap and assess the risk (higher liability rating).
    - Set a shorter sunset date.
    - Consider a pilot phase to generate data.

  **Application to the Three Cases**:

  We'll apply the procedure to:
  1. Adding a new screening category for "Problematic Short-Form Video Use"
  2. Keeping the current burnout screening item
  3. Replacing borderline personality disorder (BPD) screening with a trauma-informed alternative

  ---

  **Case 1: Problematic Short-Form Video Use (New Category)**

  **Step 0: Pre-screening**
  - Not in DSM/ICD, but emerging literature. Not a reason to decline, but proceed with caution.

  **Step 1: Define the Category**
  - Proposed definition: Excessive use of short-form video platforms (e.g., TikTok, Reels) leading to significant impairment (e.g., sleep deprivation, neglect of responsibilities, continued use despite negative consequences) for at least 3 months.
  - **Answer**: Definition exists. Proceed.

  **Step 2: Clinical Utility**
  - Evidence: Some studies link excessive use to anxiety, depression, and ADHD. But unclear if it predicts treatment response better than existing categories (e.g., internet addiction, impulse control disorders).
  - **Answer**: Limited evidence. Panel may consider it as a pilot due to increasing patient complaints.

  **Step 3: Loop Risk Assessment**
  - **Meaning loops**: High. The term "problematic" is vague; interpretations may vary (e.g., what is excessive?). Social media use norms change rapidly.
  - **Leverage loops**: Moderate. Patients might seek the label for accommodations (e.g., reduced screen time at work), or resist due to stigma. Media attention may amplify.
  - **Rating**: Meaning High, Leverage Moderate → Overall High risk? (Panel judgment: High liability due to meaning uncertainty).

  **Step 4: Loop Audit Plan**
  - **Plan**: 
    - Baseline: Survey clinicians and patients on current understanding. Track intake data (frequency, co-occurring conditions).
    - Annual: Focus groups with adolescents/young adults (most affected); monitor accommodation requests; review chart notes for shifts in language.
    - Sunset date: 2 years due to high liability.
  - **Feasibility**: Data analyst notes that tracking co-occurring conditions is easy, but surveys may require resources.

  **Step 5: Value Questions**
  - Value conflict: Is this medicalizing a modern behavior? Could lead to overdiagnosis in youth. Hand off to medical director? Panel may decide it's empirical (if data shows impairment) but note the concern.

  **Step 6: Final Decision**
  - **Loop-liability rating**: High.
  - **Recommendation**: Approve as a pilot with a 2-year sunset, strict criteria, and audit plan. Train clinicians to avoid overuse.

  **Points where procedure is silent**: How to design a pilot? (Panel must decide separately.)

  ---

  **Case 2: Burnout Screening Item (Retain or Modify?)**

  **Step 1: Define the Category**
  - Current definition: Based on Maslach Burnout Inventory (emotional exhaustion, depersonalization, reduced accomplishment). But patients are treating it as a diagnosis.
  - **Answer**: Definition exists, but is it being misused? Proceed.

  **Step 2: Clinical Utility**
  - Evidence: Burnout screening helps identify risk for depression and job turnover. But if patients are using it for accommodations, it may have unintended consequences.
  - **Answer**: Utility is established, but the current use may be reducing utility.

  **Step 3: Loop Risk Assessment**
  - **Meaning loops**: High. Patients and clinicians may now equate burnout with a medical condition, shifting its meaning from a work-related syndrome to a disorder.
  - **Leverage loops**: High. Patients are using it for accommodations (e.g., leave from work). Employers may push back.
  - **Rating**: Both High → High liability.

  **Step 4: Loop Audit Plan**
  - **Plan**: 
    - Baseline: Analyze past year's data: how often burnout is noted, accommodation requests linked to it, and if it's used as a diagnosis in charts.
    - Clinician survey: How do they use the item? Patient feedback: Why do they see burnout as a diagnosis?
    - Sunset: Review in 2 years.
  - **Feasible**: Yes.

  **Step 5: Value Questions**
  - Conflict: Burnout is work-related, not a mental disorder. Medicalizing it may absolve employers of responsibility. Escalate to medical director/ethics committee? The panel may note this and proceed to decision.

  **Step 6: Final Decision**
  - **Loop-liability rating**: High.
  - **Recommendation**: Retain because it has clinical utility, but modify the screening to clarify it is not a diagnosis. Add educational materials for patients. Set sunset in 2 years to reassess.

  **Points silent**: How to re-educate patients? (Training component needed.)

  ---

  **Case 3: Replace BPD with Trauma-Informed Alternative**

  **Step 1: Define the Category**
  - Proposed alternative: Use "Complex Trauma Disorder" or similar, with criteria emphasizing trauma history and symptoms (avoiding BPD's stigmatizing traits).
  - **Answer**: Definition exists (e.g., from ICD-11's Complex PTSD). Proceed.

  **Step 2: Clinical Utility**
  - Evidence: Trauma-informed approaches reduce stigma and improve therapeutic alliance. Some studies show better outcomes. But BPD is well-established for predicting treatment needs.
  - **Answer**: Utility likely similar or better? Panel may judge it as having utility.

  **Step 3: Loop Risk Assessment**
  - **Meaning loops**: Moderate. "Complex trauma" may be interpreted variably (e.g., what events count?). Shifts in understanding are expected and may be positive.
  - **Leverage loops**: High. Patients may embrace the trauma label for a more compassionate narrative. Clinicians may resist changing long-used terminology.
  - **Rating**: Meaning Moderate, Leverage High → Overall High? (Panel: High due to leverage risks, e.g., over-identification with trauma).

  **Step 4: Loop Audit Plan**
  - **Plan**: 
    - Baseline: Current BPD screening data and patient feedback on stigma.
    - Post-change: Track clinician adoption, patient reactions (through surveys), and any shifts in accommodation requests (e.g., for trauma triggers).
    - Sunset: 3 years (moderate-high liability).
  - **Feasible**: Yes.

  **Step 5: Value Questions**
  - Conflict: BPD is stigmatizing; trauma-informed is more humane. This is a value-driven change. The panel must hand off to the medical director/ethics committee for approval? But the procedure might allow proceeding if clinical utility is not compromised.

  **Step 6: Final Decision**
  - **Loop-liability rating**: High (due to leverage).
  - **Recommendation**: Approve the replacement, with training for clinicians and patient education. Set sunset in 3 years.

  **Why you might not like this**: You (as the panel member) might prefer to keep BPD due to its predictive validity, but the procedure emphasizes looping effects. The trauma label may create new loops (e.g., patients attributing all difficulties to trauma). However, the procedure supports the change due to reduced stigma and potential for better engagement.

  ---

  **What the Procedure Cannot Do and Where It Might Misfire**:

  - **Cannot Do**:
    - Resolve deep value conflicts; it only flags them.
    - Predict the future; looping effects are dynamic.
    - Replace clinical judgment; it structures discussion but requires expertise.
    - Address systemic issues (e.g., resource constraints) that affect diagnosis.

  - **Misfires**:
    - If the panel rates loop risks too low, harmful loops may develop.
    - Judgment calls may be biased by panel members' views.
    - The audit plan may be too burdensome and not implemented.
    - Sunset dates may not be honored due to inertia.
    - In fast-changing categories (e.g., internet-related), the procedure may be too slow.
answer: |-
  Below is a decision procedure for your diagnostic review panel, designed to systematically evaluate proposals to add, retain, or modify diagnostic categories while explicitly accounting for looping effects (both meaning loops and leverage loops). The procedure is structured as a flowchart with fixed questions, clear criteria, and stopping rules. It prioritizes practicality for a 60-minute meeting, with an emphasis on actionable evidence over theoretical debate. Key features include:
  - **Meaning loops**: Assess how the label's definition, interpretation, or cultural understanding might shift due to patient/clinician negotiation (e.g., broadening/narrowing of criteria).
  - **Leverage loops**: Assess how the label might be adopted or resisted for tangible gains (e.g., resources, accommodations, identity formation) or losses (e.g., stigma, discrimination).
  - **Loop audit**: Mandatory evidence collection at implementation and fixed intervals.
  - **Loop-liability rating**: Simple scale (Low/Medium/High) to gauge looping risk, which determines the default sunset/review date.
  - **Hand-off rules**: For value-based questions that cannot be resolved empirically.
  - **Judgment call flags**: Steps where panel input is subjective are explicitly noted.
  - **Evidence gaps**: Guidance for when data is unavailable.

  The procedure is divided into **four phases**:  
  1. **Feasibility Check** (5 mins): Quick screen for fundamental issues.  
  2. **Loop Risk Assessment** (20 mins): Evaluate meaning/leverage loops.  
  3. **Loop Audit Design** (20 mins): Plan evidence collection.  
  4. **Final Decision** (15 mins): Assign liability rating, sunset date, and recommendation.  

  **Stopping rules** are embedded: If any question’s criterion is unmet, the proposal is declined or deferred. **Deferral** means "revisit after specific changes"; **decline** means "reject outright."  

  ---

  ### **Decision Procedure: Diagnostic Category Evaluation**  
  **Purpose**: To approve, modify, or reject proposals for diagnostic categories while mitigating looping effects.  
  **Input**: A written proposal defining the category, its intended use, and supporting evidence.  
  **Output**: Decision (Approve/Defer/Decline), loop-liability rating (Low/Medium/High), sunset date, and audit plan.  

  #### **Phase 1: Feasibility Check** (5 minutes)  
  *Goal: Screen for dealbreakers like vague definitions or conflicts with core values.*  

  1. **Question 1: Is the category clearly defined?**  
     - **Criterion**: Definition must include measurable symptoms, duration, functional impairment thresholds, and exclusion criteria.  
     - **Sufficient answer**: Yes, with written documentation.  
     - **Stopping rule**: If no → **Defer** until defined.  

  2. **Question 2: Does it conflict with organizational values?**  
     - **Criterion**: Check if the label violates equity, autonomy, or non-discrimination policies (e.g., stigmatizes a group).  
     - **Sufficient answer**: No conflict identified.  
     - **Stopping rule**: If yes → **Hand off to medical director** (value question).  

  3. **Question 3: Is there a clinical, administrative, or patient-driven need?**  
     - **Criterion**: Evidence of unmet need (e.g., patient complaints, treatment gaps, data showing poor outcomes for undiagnosed cases).  
     - **Sufficient answer**: At least one source (data, clinician feedback, patient advocacy).  
     - **Stopping rule**: If no → **Decline**.  

  **Phase 1 Outcome**: Proceed only if all answers are "yes."  

  #### **Phase 2: Loop Risk Assessment** (20 minutes)  
  *Goal: Gauge looping potential. Meaning loops and leverage loops are treated differently—meaning loops focus on conceptual drift, leverage loops on material consequences.*  

  4. **Question 4: Meaning loop risk—How stable is the label’s definition?**  
     - **Criterion**: Assess ambiguity and susceptibility to reinterpretation by patients/clinicians.  
       - Low risk: Precise, objective criteria (e.g., lab-based diagnoses).  
       - Medium risk: Subjective criteria with clinical guidelines (e.g., depression).  
       - High risk: Culturally fluid or contested concepts (e.g., "burnout," "addiction").  
     - **Evidence**: Literature on similar categories, pilot data, or expert input.  
     - **Sufficient answer**: Risk level assigned (Low/Medium/High).  
     - **Stopping rule**: If High risk and no mitigation plan → **Defer**.  
     - **Judgment call**: Rating based on panel experience (no strict data required).  

  5. **Question 5: Leverage loop risk—What incentives exist to adopt or resist the label?**  
     - **Criterion**: Identify potential for gain (resources, accommodations, identity) or loss (stigma, denial of services).  
       - Low risk: Minimal stakes (e.g., rare conditions with no resource implications).  
       - Medium risk: Moderate stakes (e.g., access to therapy).  
       - High risk: High-stakes outcomes (e.g., disability benefits, workplace accommodations, identity politics).  
     - **Evidence**: Data on similar labels (e.g., accommodation requests, social media trends).  
     - **Sufficient answer**: Risk level assigned (Low/Medium/High).  
     - **Stopping rule**: If High risk and no mitigation → **Defer**.  
     - **Judgment call**: Rating incorporates patient rep input on lived experience.  

  **Phase 2 Outcome**: Proceed only if risks are not both High without mitigation. If deferred, specify changes (e.g., "narrow definition to reduce leverage loops").  

  #### **Phase 3: Loop Audit Design** (20 minutes)  
  *Goal: Create a monitoring plan for looping effects. Audit must run pre-implementation and at fixed intervals.*  

  6. **Question 6: What evidence will track meaning loops?**  
     - **Criterion**: Collect from:  
       - Clinicians: Annual survey/focus group on diagnostic criteria interpretation (e.g., "How do you define [label]?").  
       - Patients: Feedback forms or interviews on label understanding (e.g., "What does this diagnosis mean to you?").  
       - Intake data: Text analysis of chart notes for shifts in language (e.g., new symptoms linked to label).  
     - **Sufficient answer**: At least two sources with measurable metrics (e.g., % of clinicians reporting definition drift).  
     - **Stopping rule**: If no feasible sources → **Assign High liability** and shorten sunset.  

  7. **Question 7: What evidence will track leverage loops?**  
     - **Criterion**: Collect from:  
       - Clinicians: Reports of label-driven requests (e.g., accommodations, referrals).  
       - Patients: Self-reported label use (e.g., "Did you seek this diagnosis for resources/support?").  
       - Intake data: Frequency of co-occurring resource requests (e.g., disability forms) linked to label.  
     - **Sufficient answer**: At least two sources with quantitative tracking (e.g., # of accommodation requests/month).  
     - **Stopping rule**: If no feasible sources → **Assign High liability** and shorten sunset.  

  8. **Question 8: Is the audit feasible with current resources?**  
     - **Criterion**: Data analyst and administrator confirm cost/time constraints.  
     - **Sufficient answer**: Yes, with a written plan (timeline, responsible roles).  
     - **Stopping rule**: If no → **Defer** until audit is simplified.  

  **Phase 3 Outcome**: Approved audit plan with baseline (pre-implementation) and interval (e.g., annual) collection.  

  #### **Phase 4: Final Decision** (15 minutes)  
  *Goal: Make recommendation with accountability.*  

  9. **Question 9: Loop-liability rating?**  
     - **Criterion**: Synthesize Q4–Q7:  
       - Low: Meaning AND leverage loops both Low.  
       - Medium: One High OR both Medium.  
       - High: One High AND one Medium+, OR both High.  
     - **Judgment call**: Panel consensus based on risk levels and audit feasibility.  

  10. **Question 10: Sunset date?**  
      - **Criterion**: Default review based on liability:  
        - Low: 5 years.  
        - Medium: 3 years.  
        - High: 2 years.  
      - Adjust if evidence is weak (e.g., shorten by 1 year).  

  11. **Recommendation**:  
      - Approve: If all phases passed. Add liability rating and sunset to category documentation.  
      - Defer: If stopped in any phase but resolvable (e.g., "Revise definition and resubmit").  
      - Decline: If stopped with no path forward (e.g., "No clinical need").  

  **Hand-off to medical director** if:  
  - Value conflict identified (Phase 1, Q2).  
  - Disagreement on risk ratings that cannot be resolved empirically.  

  **If evidence is unavailable**:  
  - Proceed but rate liability higher and shorten sunset.  
  - Note gap in audit plan (e.g., "Leverage loops not tracked due to data limitations").  

  ---

  ### **Application to Your Three Cases**  
  We apply the procedure to each case. Recommendations are based on simulated panel input. **You may dislike the burnout recommendation**—explained in Case 2.  

  #### **Case 1: Add "Problematic Short-Form Video Use" Screening**  
  **Proposal**: New category for excessive video use causing impairment.  

  - **Phase 1: Feasibility Check**  
    - Q1: **Defined?** Yes (e.g., "≥4 hours/day, distress/impairment, 3+ months").  
    - Q2: **Values conflict?** No (neutral on surface).  
    - Q3: **Need?** Yes (rising patient complaints; data on youth mental health decline).  
    - **Outcome**: Proceed.  

  - **Phase 2: Loop Risk Assessment**  
    - Q4: **Meaning loop risk**: High. Concept is culturally fluid (e.g., "problematic" varies by age/norms; social media amplifies redefinition).  
    - Q5: **Leverage loop risk**: Medium. Incentives for accommodations (e.g., school/work reductions) or identity ("digital wellness" communities). Low risk of stigma.  
    - **Outcome**: Proceed (High+Medium = overall High liability, but mitigable).  

  - **Phase 3: Loop Audit Design**  
    - Q6: **Meaning evidence**: Clinician surveys (annual); patient interviews (baseline + 18 months); chart-note analysis for symptom drift.  
    - Q7: **Leverage evidence**: Track accommodation requests in intake data; patient feedback on label use.  
    - Q8: **Feasible?** Yes (data analyst approves).  
    - **Audit plan**: Baseline pre-implementation, then annual.  

  - **Phase 4: Final Decision**  
    - Q9: **Liability rating**: High (due to meaning loops).  
    - Q10: **Sunset date**: 2 years (default for High).  
    - **Recommendation**: **Approve with High liability rating and 2-year sunset**.  
    - **Procedure gaps**: Silent on digital data collection (e.g., app tracking)—panel must address separately.  

  #### **Case 2: Retain or Modify Burnout Screening Item**  
  **Proposal**: Patients misuse screening as a diagnosis for accommodations.  

  - **Phase 1: Feasibility Check**  
    - Q1: **Defined?** Yes (current item based on Maslach Burnout Inventory).  
    - Q2: **Values conflict?** Yes—medicalizing burnout may undermine systemic solutions (e.g., blaming individuals over workplaces).  
    - **Stopping rule**: **Hand off to medical director** (value question). Medical director rules: Retain screening but clarify it is not a diagnosis.  
    - **Outcome**: Proceed with modification.  

  - **Phase 2: Loop Risk Assessment**  
    - Q4: **Meaning loop risk**: High. Label now conflated with clinical depression; patients/clinicians broaden it to "chronic stress."  
    - Q5: **Leverage loop risk**: High. Explicit evidence of accommodation requests (e.g., work leave); label used for tangible gains.  
    - **Outcome**: Proceed (risks High, but modification can mitigate).  

  - **Phase 3: Loop Audit Design**  
    - Q6: **Meaning evidence**: Clinician focus groups on usage; patient surveys on understanding; analyze chart notes for conflation with depression.  
    - Q7: **Leverage evidence**: Track accommodation requests linked to burnout; intake data on label-driven referrals.  
    - Q8: **Feasible?** Yes.  
    - **Audit plan**: Baseline at modification, then every 6 months (due to High risk).  

  - **Phase 4: Final Decision**  
    - Q9: **Liability rating**: High (both loops High).  
    - Q10: **Sunset date**: 2 years.  
    - **Recommendation**: **Retain but modify** screening to include disclaimers (e.g., "Not a diagnosis—assesses work-related distress only"). Train clinicians on proper use.  
    - **Why you won’t like it**: You see burnout as mutable via looping, but the procedure prioritizes clinical utility (it screens for depression risk) and mandates retention with safeguards. The high liability rating forces frequent review.  
    - **Procedure gaps**: Silent on how to enforce modifications (e.g., IT changes to forms).  

  #### **Case 3: Replace BPD Screening with Trauma-Informed Alternative**  
  **Proposal**: Swap "Borderline Personality Disorder" for a trauma-focused label (e.g., "Complex Trauma Reaction").  

  - **Phase 1: Feasibility Check**  
    - Q1: **Defined?** Yes (trauma-informed criteria available, e.g., from CPTSD frameworks).  
    - Q2: **Values conflict?** No—aligns with trauma-informed care principles.  
    - Q3: **Need?** Yes (patient/staff reports of BPD stigma; data on trauma history in BPD diagnoses).  
    - **Outcome**: Proceed.  

  - **Phase 2: Loop Risk Assessment**  
    - Q4: **Meaning loop risk**: Medium. Trauma is better defined than BPD but still subjective (e.g., "complex" may expand).  
    - Q5: **Leverage loop risk**: High. Strong incentives: patients gain solidarity/validation; clinicians may resist due to training gaps; could increase therapy requests.  
    - **Outcome**: Proceed (Medium+High = overall High liability).  

  - **Phase 3: Loop Audit Design**  
    - Q6: **Meaning evidence**: Clinician surveys on criteria use; patient narratives on label meaning; intake data for symptom shifts.  
    - Q7: **Leverage evidence**: Track requests for trauma-specific services; patient feedback on identity impact.  
    - Q8: **Feasible?** Yes.  
    - **Audit plan**: Baseline pre-change, then annual.  

  - **Phase 4: Final Decision**  
    - Q9: **Liability rating**: High (leverage loops dominate).  
    - Q10: **Sunset date**: 2 years.  
    - **Recommendation**: **Approve replacement** with staff training and patient education materials.  
    - **Procedure gaps**: Silent on transition costs (e.g., EHR updates)—administrator must address.  

  ---

  ### **What the Procedure Cannot Do and Where It Might Misfire**  
  **Limitations**:  
  - **Cannot resolve value conflicts**: Only flags them for hand-off. Deep disagreements (e.g., "Is burnout a medical issue?") require ethics input.  
  - **Cannot predict novel loops**: Focuses on known risks; unexpected loops (e.g., viral social media trends) may slip through.  
  - **Cannot replace expertise**: Relies on panel judgment, which may be biased (e.g., clinicians downplaying leverage loops).  
  - **Cannot enforce audits**: If data collection lapses, liability ratings become meaningless.  
  - **Cannot address power imbalances**: E.g., patient rep input may be overshadowed in practice.  

  **Misfire Risks**:  
  - **Overrating liability**: Excessive caution may delay useful categories.  
  - **Underrating liability**: If evidence is poor (e.g., no patient feedback), loops may go unchecked.  
  - **Bureaucratic creep**: "Judgment calls dressed as procedure" (e.g., risk ratings) could dominate meetings.  
  - **Resource limits**: Audits may be watered down if data analyst/administrator overrules.  
  - **Temporal mismatch**: Slow audits may miss rapid loops (e.g., TikTok-driven diagnosis trends).  

  **Mitigations**: Anchor judgments in data, rotate panel members, and use sunset dates to force reflection. The procedure is a scaffold—your panel’s experience fills it in.  

  ---  
  This procedure transforms looping effects from abstract debate into operational inputs. For your panel, prioritize Phase 2 (Loop Risk) and Phase 3 (Audit) to make it tangible. I recommend dry-running it with the three cases in your next meeting to refine.
