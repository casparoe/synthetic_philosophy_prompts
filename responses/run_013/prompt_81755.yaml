  First, I need to identify the common thread in their assessments. Looking at their "real science" examples: cheater-detection module, morning sickness as adaptation, step-parent abuse rates, over-perception of sexual interest. These cases have strong evidence, specific predictions, and measurable asymmetries. The "just-so" stories like waist-to-hip ratio, disgust as adaptation, male homosexuality, menstrual synchrony, and menopause lack rigorous testing or novel predictions. For instance, cheater-detection has controlled experiments showing context-dependent performance, while waist-to-hip relies on correlations without clear causal links.

