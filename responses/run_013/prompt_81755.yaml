  Their soft spot for cheater-detection could be bias, but it's still methodologically sound. The challenge is their partner's jealousy claim. If the principle is predictive power and falsifiability, jealousy as mate-guarding should predict specific behaviors, like increased vigilance in certain contexts. Without testable predictions, it's a just-so story. The snake/spider fear example is strong because it predicts an innate aversion despite modern risks, supported by cross-cultural studies and faster detection times.

