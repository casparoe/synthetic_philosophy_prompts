  Looking at their two cases: the dementia patient who signed an advance directive vs the woman who changed her mind about having children. The core tension is that we treat the earlier self as authoritative in the first case but not the second, despite both involving changed preferences. The user has already rejected competence as the differentiating factor and suspects the "binding" might be a fiction.

  I need to address this systematically. For "closest existing names," I consider concepts like diachronic autonomy, Ulysses contracts, and identity essentialism - but each falls short. Diachronic autonomy assumes continuity that may not exist, Ulysses contracts are specific to weakness of will, and identity essentialism is too metaphysical.

  For "the carving," I'll define "Proxy Preference Principle": earlier preferences function as proxies when later selves cannot reliably express preferences. I'll exclude cases like temporary intoxication (different from dementia), religious conversions (deep identity change), and minor preference shifts (like music taste).

  For "the deciding principle," I'll argue the key is the later self's capacity for coherent preference formation. This explains why we honor dementia directives (later self can't form new preferences) but not the childfree resolution (later self can). The binding is pragmatic, not metaphysical.

  I'll coin "Proxy Preference Principle" since no existing term fits perfectly. The name captures how we use past preferences as stand-ins when current ones are inaccessible or untrustworthy.

  Throughout, I'll maintain their requested structure and focus on boundary cases, as those reveal the concept's contours. This seems like a deep inquiry into how we navigate identity and decision-making when selves fracture across time.
answer: |-
  ### Closest existing names  
  The pattern aligns partially with **diachronic autonomy** (respecting past decisions as expressions of enduring agency) but diverges because your cases reveal this "respect" evaporates when the later self can dissent, suggesting autonomy isn't truly diachronic. It resembles **Ulysses contracts** (binding future selves during moments of weakness), yet your dementia case lacks the "temporary impairment" premise, and your childfree case shows no weakness. It also echoes **identity essentialism** (a "true self" persists through change), but your examples highlight contextual authority shifts, not metaphysical continuity. Crucially, your pattern exposes a *pragmatic substitution* of past preferences for incapacitated selves, not a principled belief in timeless identity or bindingness. Existing terms assume continuity where your cases reveal discontinuity-based pragmatism.

  ### The carving  
  **Definition:** The *Proxy Preference Principle* occurs when an earlier self's expressed preference is treated as authoritative over a later self *only if* the later self cannot reliably form or communicate countervailing preferences due to compromised agential capacity (e.g., dementia, acute psychosis), *and* the earlier preference is invoked as a functional substitute for the missing current preference. The "binding" is provisional and dissolves the moment the later self regains capacity to voice dissent.  

  **Boundary exclusions:**  
  1. **Temporary intoxication:** A sober person vows never to drunk-dial an ex. While drunk, they attempt to call. We intervene, citing their sober preference. *Excluded*: The later self retains *some* capacity (can dial a phone) but we distrust the preference due to transient impairment. This is weakness of will, not incapacity.  
  2. **Religious conversion:** A devout teen renounces faith at 20. At 40, they reconvert, claiming their atheist self was "inauthentic." *Excluded*: Both selves are fully capable; the rejection of the past self is ideological, not based on agential incapacity.  
  3. **Minor preference shifts:** At 30, Alice hates cilantro. At 40, she loves it. No one cites her past aversion. *Excluded*: The later self’s capacity is intact, so the past preference holds no weight—even though both preferences were competently formed.  

  ### The deciding principle  
  The operative distinction is **current agential capacity**, not competence at the time of the original decision. We honor the earlier preference *only* when the later self lacks the cognitive or communicative ability to form/express a coherent counter-preference *at the decision point*. In the dementia case, the later self cannot conceptualize life-support choices or articulate dissent; the earlier directive substitutes for this void. In the childfree case, the 40-year-old can clearly affirm her current preference, nullifying the past resolution. There is no intrinsic authority of past over future selves. The "binding" is a practical heuristic for managing preference gaps, not a moral truth. This implies that advance directives are not "self-binding vows" but contingency tools for when selves fracture—and that all seemingly diachronic commitments dissolve upon capable dissent.

  ### The name  
  **Proxy Preference Principle (PPP)**. This coinage earns its keep by precisely capturing the core mechanism: past preferences function as *proxies* for incapacitated later selves, not as sovereign commands. The term highlights the *instrumental* (not ontological) nature of the "binding," the primacy of current agential capacity, and the preference-substitution dynamic central to your cases.
