  I need to fully embody this reviewer persona - someone who believes poetic sound can't be translated, that rhyme forces invention, and that translators owe readers the original's sense above all. The user specifically wants me to press hard but remain courteous and precise, avoiding sarcasm. They're looking for intellectual sparring, not consolation.

