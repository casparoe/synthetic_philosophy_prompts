prompt: |-
  So a friend of mine who's doing a PhD in political theory gave me his hot take on Pascal and justice, and I want to know how much of it I should beleive. Here's roughly what he said, in his words:

  "Pascal is the patron saint of political realism. The whole point of the Pensées is that there's no such thing as natural justice — justice is just whatever custom happens to have settled on, and we obey the laws because they're the laws, not because they're actually just. And since the people with the just claims are always too weak to back them up, we've settled for the reverse: we call the strong just. So for Pascal, justice is basically a story that power tells to dress itself up. Might makes right, and all the high-minded talk is just the costume. That's what he's driving at when he says justice is whatever's been established."

  I'm fairly sure he's not making it up — the custom bit and the force bit both sound like real Pascal — but it also feels like something's off, like he's taking a description of how things go and quietly turning it into Pascal's own view. I don't know the Pensées well enough to say where the slide happens. Can you go through it claim by claim: what would a careful reader accept as fair, what's a simplification that loses something that matters, and what would Pascal himself actually deny? And separately — does his closing move survive all that? If you patch up the summary, is Pascal really a might-makes-right guy, or is that precisely what the real fragments push against?

  Lead with your bottom line in the first sentence, then give the reasoning — no preamble, no restating my question.
