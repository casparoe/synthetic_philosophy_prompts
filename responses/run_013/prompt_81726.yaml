prompt: |-
  I'm about three-quarters through a novel about a mid-level diplomat who spends the 2000s and 2010s watching the language of humanitarian war get written and rewritten, and the chapter I'm stuck on is Libya, 2011 — not the bombing, the paperwork around it. My protagonist ends up in a room where someone from the Brazilian mission is pushing the idea they were calling responsibility while protecting, and I want to get the intellectual stakes right before I put words in anyone's mouth. The way I understand the Brazilian move, it wasn't a rival to the responsibility to protect so much as a set of conditions bolted onto it: that force only come after the peaceful and diplomatic tools have genuinely been exhausted; that any force used be the minimum needed for the protection job rather than for the wider goal of toppling the regime; and that the states doing the intervening have to come back to the Security Council and give an account of how they used the mandate they were handed. I'm probably mangling the finer points, so correct me where I'm wrong.

  Here's what I want you to work through. Take the Libyan intervention as it actually played out — resolution 1973, the authorization of all necessary measures, the specific fear that Benghazi was about to be massacred, the no-fly zone and the arms embargo and the civilian protection mandate all bundled together, and then the way the campaign drifted from shielding civilians into escorting the rebels west, breaking the army, and eventually the killing of Gaddafi. Run that episode through the responsibility-while-protecting lens: who counts as the intervener, what would sequenced, proportional, and accountable have required at each fork in the road, and where does the lens actually bite — does it explain why the drift happened, or does it just redescribe it afterward in nicer words? I'm especially interested in whether the three conditions can all be satisfied at once in real time, because my instinct is that the urgency of protecting a city and the demand that you use the minimum force are pulling against each other, and the accountability condition seems to assume the body that authorizes the force is seperate from the body that wields it, which in this case it more or less wasn't.

  Then turn it around on the theory, because that's the part I can't do in my own head. What does Libya do to responsibility while protecting — does the episode vindicate it as a real corrective to R2P, or expose it as a set of principles nobody could ever actually be held to? And does the Brazilian proposal have anything to say about a Kosovo-style case, where the intervention happens without Council authorization at all, so there's no one to give an account to and the whole accountability leg just dangles? My protagonist is supposed to be persuaded by the Brazilian argument in one scene and disillusioned by it in another, and I need to know which of those scenes is the honest one. Skip the reading list, I'm not going to hunt down the actual concept papers — just give me the argument, mapped onto what happened, and tell me plainly where the mapping breaks.
