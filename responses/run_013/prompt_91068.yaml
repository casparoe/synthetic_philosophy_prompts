prompt: |-
  Ok so I'm taking this poli theory module this term, democracy and its alternatives, and something happened in my flat last night that I can't let go of. It's definately not an essay question so I don't really know how to look it up.

  The setup: there's a campaign on campus to stop electing the student council and start drawing it by lottery instead — 20 names picked out of the registration list, those 20 run things for a year, no elections. Our seminar spent a whole week on sortition so both my flatmates, Maya and Dev, knew what they were talking about. Neither of them was being dumb and neither was just repeating a talking point, which is why I can't referee it myself. Here's how it went.

  (1) Dev went first. He said the campaign's own fine print gives the game away. The proposal lets anyone who gets drawn decline — you just say no and they draw again. So it isn't a lottery over the student body, it's a lottery over the subset of students willing to do the job, and the people willing to do the job are exactly the people who'd have run in the elections anyway. They've smuggled the self-selection back in through the exit door, he says.

  (2) Maya said that only looks like a problem if you think the point of a lottery is to get a miniature of the student body. She says it isn't. The point is that nobody can campaign. No posters, no manifestos, no slates, no favours traded, because nobody knows in advance who's going to be in the room. And that survives the exit clause completely — even the willing ones who get in didn't get in by campaigning.

  (3) Dev said that if not-campaigning is the whole story then the exit clause is doing nothing except shrinking the pool, and you'd get the same result by drawing from a list of volunteers, which is basically what we already have minus the pretence. And he doesn't believe her anyway: if the council comes out 19 engineers and 1 philosopher, the fact that none of them campaigned doesn't stop it being a rubbish stand-in for the student body. So she does care about the mirror, he says, she just won't admit it.

  (4) Maya said fine, mirroring matters a bit, but he's got the burden of proof the wrong way round. An election is designed to filter for a particular kind of person — someone who wants the job, someone good at asking strangers for votes, someone with a faction behind them — and that filtering is the defect, not the feature. A lottery's only flaw is that it doesn't filter at all, and not filtering isn't a flaw unless you can say what the filter is for.

  (5) Dev said no filter cuts both ways: it also won't filter out the person who'll treat it as a joke or never show up, and she still hasn't said why a random 20 beats 20 people who've at least shown they care enough to turn up. And he thinks the line about wanting the job being disqualifying is circular — that wanting the job is bad is exactly the sort of thing elections let us decide, so she's assumed her conclusion and called it a principle.

  Then they both looked at me and I said something useless about it being a rich discussion.

  Can you go through it move by move and actually adjudicate? I don't want "both sides have a point" — I want to know which of the five moves hold up and which don't, and where each of them is quietly leaning on something they haven't said out loud.

  Deliverable: a table with exactly these columns — Move (1 to 5); Speaker (Dev or Maya); Claim, in one sentence in your own words; Verdict, one of Clearly wrong / Wrong but fixable / Half right / Right but overstated / Clearly right; Why, 2 to 4 sentences; Confidence, a percent for that row's verdict. Under the table: a short paragraph on what they're both missing, then a single line naming the one verdict you're least sure of and why. Also give me your overall read on who has the better of the arguement, with a confidence percentage attached, and be honest if the answer is "neither — they're answering different questions."
reasoning: |-
  Hmm, the user is grappling with a political theory debate that happened in their flat about sortition versus elections for a student council. They want me to analyze five specific arguments made by Dev and Maya during this discussion. This is clearly related to their "Democracy and its Alternatives" course, specifically about sortition as an alternative to electoral systems.

  The core disagreement seems to be about whether allowing opt-outs in a sortition system fundamentally undermines its purpose. Dev argues that the opt-out clause reintroduces self-selection, essentially recreating the election system they already have. Maya counters that the key benefit of sortition is eliminating campaigning and political maneuvering, which remains intact even with opt-outs.

  Looking at each move systematically:
  For Move 1: Dev makes a valid point about opt-outs creating a self-selected pool, but overstates it as "smuggling in" elections since the selection mechanism remains different (random draw vs campaigning). His claim holds but needs nuance.

  For Move 2: Maya correctly identifies depoliticization as a core benefit of sortition that survives opt-outs. This is well-supported by sortition theory, though she slightly underplays representation concerns.

  For Move 3: Dev conflates two separate issues here. While a volunteer lottery would indeed eliminate campaigning (as Maya wants), it wouldn't achieve descriptive representation. His critique of mirroring is valid but irrelevant to Maya's actual point.

  For Move 4: Maya makes perhaps the strongest philosophical argument - that elections systematically select for certain traits (ambition, charisma) which may not align with good governance. Her framing of the burden of proof is particularly compelling in democratic theory terms.

  For Move 5: Dev raises practical implementation concerns about unengaged participants, but his "circular argument" charge against Maya misses her core critique about systemic biases in electoral self-selection.

  Both debaters are missing the hybrid possibility: sortition systems often combine random selection with voluntary service while adding safeguards (like mandatory participation or representative quotas). The real tension is between competing democratic values - equality of opportunity (Maya) versus reliability of participation (Dev).

  I'm least confident about Move 3's verdict because Dev's critique about descriptive representation is valid in itself, even if it's not directly responsive to Maya's depoliticization argument. Overall Maya has the stronger case because she addresses the systemic flaws in electoral politics that sortition aims to solve, though Dev's practical concerns deserve consideration in implementation.
answer: |-
  Here's the move-by-move adjudication you requested, followed by the analysis of gaps, least confident verdict, and overall assessment:

  ### Adjudication Table

  | Move | Speaker | Claim                                                                 | Verdict               | Why                                                                                                                                                                                                 | Confidence |
  | :--- | :------ | :-------------------------------------------------------------------- | :-------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------- |
  | 1    | Dev     | Opt-outs mean only self-selected volunteers (like election candidates) end up serving, defeating representativeness. | **Half right**        | The pool *is* narrowed to volunteers, harming descriptive representation. But Dev overstates equivalence: lottery-selected volunteers face no campaign barrier or electoral competition, altering incentives. | 85%        |
  | 2    | Maya    | The key value is eliminating campaigning/favor-trading, which survives opt-outs since selectees don't campaign. | **Clearly right**     | Sortition's core anti-corruption/elitism mechanism is disrupting campaign politics. Opt-outs don't reintroduce campaigning, as selection remains random *from volunteers*. Historical (Athenian) sortition allowed refusals too. | 95%        |
  | 3    | Dev     | If campaigning is the *only* issue, a volunteer lottery = elections minus pretense; descriptive flaws (e.g., 19 engineers) still matter. | **Wrong but fixable** | Dev conflates two issues: Maya never said mirroring *doesn't* matter. His critique of volunteer lotteries is valid *if* descriptive representation is a goal, but he misrepresents her position (she prioritizes process). Fixable by acknowledging multiple goals. | 80%        |
  | 4    | Maya    | Elections filter for problematic traits (ambition, factionalism); the burden is to justify filtering, not its absence. | **Right but overstated** | She correctly identifies electoral filtering biases. The burden-of-proof framing is strong in democratic theory (why exclude?). But she *slightly* overstates: filters *can* serve legitimate purposes (e.g., basic competence/commitment), which she dismisses. | 90%        |
  | 5    | Dev     | No filtering risks disengagement; calling "wanting the job" disqualifying is circular as elections let us judge suitability. | **Half right**        | Practical concern about engagement is valid. But he misreads Maya: she sees "wanting power via elections" as problematic *because* of associated traits, not inherently. His circularity charge ignores her systemic critique of electoral incentives. | 75%        |

  ### What Both Are Missing
  Both overlook **institutional design nuances**. Sortition systems often include safeguards: mandatory service (reducing opt-outs), stratified sampling (ensuring diversity), or hybrid models (e.g., some elected, some allotted). They also miss **deliberative potential**: random selection fosters diverse perspectives *in dialogue*, which may mitigate individual expertise gaps. Dev undervalues the corruption-reducing effect; Maya underplays implementation risks like apathy.

  ### Least Confident Verdict
  **Move 5 (Half right) at 75% confidence.** Dev's engagement concern is real but conflates "wanting the job" (neutral) with "seeking power via competitive elections" (Maya's actual target). His circularity claim oversimplifies her argument.

  ### Overall Assessment
  **Maya has the better argument (70% confidence).** She successfully defends sortition's core anti-oligarchic logic: disrupting campaigning *is* achievable with opt-outs and addresses a systemic flaw in elections. Dev's concerns (representation, engagement) are valid but secondary to sortition's primary purpose of breaking elite capture. He doesn't prove elections' filtering is net beneficial, while Maya shows it's inherently suspect. Ultimately, they prioritize different democratic values: **Maya focuses on equalizing power access and reducing corruption; Dev emphasizes reliability and descriptive accuracy.** Neither "wins" outright, but Maya's case aligns more closely with sortition's foundational rationale.
