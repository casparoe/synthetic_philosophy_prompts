  Okay, I need to help this user figure out Dana's rule about honesty based on the four cases they described. Let me start by listing out each scenario and Dana's judgment:

  1. The engineer promises to finish by Friday knowing he won't. Dana says it's a lie.
  2. Weekly update says "on track, no blockers" even though a dependency is slipping. Dana says it's fine because you don't owe volunteered bad news.
  3. When asked directly if the migration is done, the dev says "the code's merged" even though it's not running. Dana says this is worse than the first case.
  4. Dodging a meeting by saying "I've got a lot on right now" which is true. Dana says who cares.

  Now, the user's situation: They told a coworker they skimmed the design doc and it seemed solid, promising to review it properly tomorrow. They actually didn't look at it at all until the next day. No harm done, but was it a lie?

  The user wants me to reverse engineer Dana's rule. First, I need to extract principles from each case. For case 1, it's about making a false promise intentionally. That's clearly a lie. Case 2 involves withholding negative information but not actively lying. Dana seems okay with this, suggesting that omissions aren't lies if not prompted. Case 3 is tricky—the answer was technically true but misleading. Dana considered it worse than the direct lie in case 1. Why? Maybe because it's deceptive while avoiding a direct falsehood. Case 4 is a truthful but vague excuse, which Dana dismisses as unimportant.

  Putting this together, Dana's rule might prioritize literal truthfulness over complete transparency. She condemns outright lies (case 1) and considers evasion with technically true statements worse than omissions (case 3 vs. case 2). The key differentiators seem to be intent to deceive and whether a direct question was asked.

  Now, for the user's case: They said they "skimmed" the doc when they hadn't opened it. That's an outright false statement, similar to case 1. Even though no harm came of it, Dana would likely call this a lie because it's factually untrue. Comparing to case 2, this wasn't an omission—they actively misrepresented their action. Unlike case 3, they didn't use a technically true but misleading statement; they said something completely false.

  The user also wants to know which of Dana's earlier calls to reference to force a disagreement. Case 1 is the most directly comparable—both involve falsely claiming to have done something. If Dana objected to the Friday promise, she'd object here too. Case 3 shows she hates deceptive truths, but this situation is more straightforwardly false.

  Potential alternative rules: One could be "never say anything false," which fits cases 1 (false) and 4 (true), but doesn't explain why case 3 (true but misleading) is worse. Another rule might focus on deception intent, but case 2 had no active deception. Dana's actual rule seems to be: Direct falsehoods are bad, deceptive truths are worse, and omissions are acceptable until asked.

  Final conclusion: Dana would call the user's statement a lie. To test this, the user should bring up case 1—if Dana stands by that judgment, she should condemn this too. Case 3 could be referenced to show she dislikes evasion, but case 1 is cleaner for this scenario.
