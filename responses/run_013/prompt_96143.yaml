answer: |-
  Below is a reasoned translation of the "generational debate" into taxonomic vocabulary, followed by a residue report addressing your suspicions. I'll adhere strictly to your constraints, using British English throughout.

  ---

  ### **Translation of Generational Claims into Taxonomic Terms**

  #### **1. Claim: Generations are real social kinds**  
  *(i.e., birth window + shared history → distinctive outlook)*  
  - **Clean fit**:  
    - **Grade analogy**: A generation resembles a **grade**—a grouping based on shared characteristics (e.g., "outlook") derived from common historical exposure, not ancestry. Like grades, generations are defined polythetically (no single trait is essential; a cluster of traits suffices).  
    - **Diagnosability**: Proponents treat generations as **diagnosable** via behavioural/cultural traits (e.g., "digital nativism" in Gen Z), akin to using morphological characters to define a taxon.  
    - **Population thinking**: Generations are framed as **populations** shaped by environmental pressures (e.g., post-war prosperity for Boomers), mirroring how selective pressures mould biological groups.  

  - **Bent fit**:  
    - **Temporal boundaries**: Birth-year cut-offs (e.g., 1981–1996 for Millennials) are **typological**—imposed thresholds ignoring gradual variation. Taxonomy avoids rigid boundaries for polythetic groups.  
    - **Shared history as "environment"**: History is treated like an **abiotic selective force**, but its impact is non-uniform (e.g., class, geography mediate exposure). Taxonomy acknowledges environmental gradients, but generational theory often flattens them.  

  - **Cannot be expressed**:  
    - **Explanatory direction**: Taxonomic traits *describe* groups; generational traits *explain* them (e.g., "Vietnam War caused Boomer activism"). Taxonomy doesn’t attribute causality to the category itself.  

  #### **2. Claim: Generations are artificial labels**  
  *(i.e., constructs by marketers; differences reflect age/period effects)*  
  - **Clean fit**:  
    - **Artificial taxa**: Sceptics view generations as **human-defined groupings** without natural cohesion, like classifying "trees" based on height—useful but not evolutionarily meaningful.  
    - **Age cohorts ≠ taxa**: Differences attributed to **life stage** (e.g., youthful idealism) mirror taxonomy’s distinction between **ontogenetic stages** (e.g., tadpole vs. frog) and true taxa.  
    - **Period effects**: Events affecting all ages simultaneously (e.g., COVID) are like **environmental stasis**—traits shift uniformly, invalidating "generational" distinctions.  

  - **Bent fit**:  
    - **Lumping vs. splitting**: Journalists "split" generations finely for novelty (e.g., Xennials), while sceptics "lump" them into broad age/period effects. This parallels taxonomic disputes but lacks empirical criteria.  

  - **Cannot be expressed**:  
    - **Market/political utility**: Taxonomy lacks analogues for **instrumental categorisation** (e.g., selling products to "Gen Z"). Groups in biology aren’t defined by commercial relevance.  

  ---

  ### **Residue Report: What Doesn’t Survive Translation**  
  Your suspicions are largely correct:  

  1. **"Not a lineage; contemporaries, not ancestors"**:  
     - **Verdict**: Correct. Generations are **horizontal cohorts**, not clades (lineages). They align only with **grades**, which modern taxonomy treats as *descriptive conveniences*, not "real" entities (as they lack evolutionary unity). This weakens claims that generations are "real kinds"—they’re ephemeral groupings without descent-based cohesion.  

  2. **"Generation-talk explains outlook; taxonomy doesn’t"**:  
     - **Verdict**: Correct. Taxonomy **describes** traits but doesn’t treat the category as *causal*. Saying "Boomers are idealistic because they’re Boomers" is circular—akin to claiming "reptiles are scaly because they’re reptiles". The generational label itself explains nothing; it’s the *history* that does the work. This exposes a flaw in proponent logic.  

  3. **"Self-identification and self-labelling"**:  
     - **Verdict**: Correct. No taxonomic analogue exists. **Self-aware categorisation** (e.g., "I’m Gen Z") is uniquely social. Taxonomy deals with observer-defined groups; organisms don’t internalise their own classification. This makes generations **reflexive**—belief in the category alters behaviour, creating a feedback loop taxonomy can’t capture.  

  #### **The Muddle: Birth Window vs. Youth Period vs. Current Age**  
  - **Translation**:  
    - **Birth window**: A **cohort** (taxonomic grade).  
    - **Youth during a period**: An **ontogenetic stage** (e.g., "subadult").  
    - **Current age**: A **life stage** (e.g., "senescent").  
  - **Outcome**: Generational discourse **conflates** these distinct concepts. Proponents often equivocate: e.g., using "Millennial" for both *1985-born* (cohort) and *young adults in 2010* (life stage). Taxonomy treats these as separate axes of variation; blending them invalidates claims of a cohesive "generation".  

  ---

  ### **Where Translation Fails & What It Reveals**  
  - **Failures as defects of generational claims**:  
    - **Causality and self-identification** can’t map to taxonomy because they rely on *social agency*, not descent/resemblance. This doesn’t weaken taxonomy; it exposes **generational theory’s vagueness**. If generations were robust "kinds", core aspects wouldn’t resist translation.  
    - **Conflating age/period/cohort** is a flaw in generational logic, not taxonomy. Biology distinguishes analogous concepts (e.g., age class vs. species); the muddle suggests generations are **imprecise constructs**.  

  - **Residue implications**:  
    - The sceptical view **holds the better ground**. Taxonomy’s inability to accommodate causality, self-labelling, or blurred cohort/age boundaries suggests generations are **pragmatic labels, not discovered kinds**. Like "reptile" (a grade, not a clade), they’re useful heuristics but lack the unity proponents claim.  
    - However, **self-identification**’s irreducibility hints at something beyond taxonomy: generations as **cultural narratives**. This doesn’t make them "real" in a biological sense, but it explains their social traction.  

  ### **In Summary**  
  Generations map poorly to **clades** (no descent), weakly to **grades** (no diagnostic rigour), and fail taxonomic tests for "reality" due to circular causality and self-reinforcement. The residue—self-awareness, explanatory overreach, and blurred boundaries—suggests generational categories are **constructed tools for social discourse**, not discovered entities. Sceptics win on ontological grounds, but proponents tap into something taxonomy ignores: the power of **belief in the category itself**.  

