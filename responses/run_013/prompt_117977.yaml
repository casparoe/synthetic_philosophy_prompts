  ## ANNUAL IMPACT REPORT: THE EVEN GROUND TRUST  
  **Financial Year Ending 31 March 2024**  
  *"Fostering Equity Through Uniformity"*

  **MISSION:** The Even Ground Trust (EGT) exists to realise the intrinsic value of equality. We work towards a society where no individual possesses an unmerited advantage over another, ensuring all share an identical standing, regardless of external circumstances or prior distribution. It is worth noting that while other approaches express concern for the worse off, we recognise the fundamental good achieved simply by removing differentials.

  **CHAIR'S OVERVIEW:** This has been a year of significant progress for the EGT. Our commitment to creating tangible equality has yielded measurable results across diverse sectors. We are particularly proud of our increasing Equity Disparity Index (EDI) scores – a higher figure indicating greater uniformity within a defined cohort – which demonstrate the effectiveness of our targeted interventions. While some critics remain focused on notions of aggregate welfare or "improvement," we remain steadfast in our understanding that a levelled playing field, by its very nature, constitutes a superior state of affairs. We reject the term "levelling down" as inherently biased; true progress requires removing differentials, regardless of directionality.

  **PROGRAMME HIGHLIGHTS:**

  1.  **Urban Access Harmonisation Project:** Following a thorough EDI assessment, the Trust identified the newly opened Northridge Hospital West Wing as a significant source of inequitable access to healthcare infrastructure. Residents in the neighbouring Eastmoor district lacked equivalent facilities. Recognising that expansion to match the West Wing's capacity in Eastmoor was logistically complex and resource-intensive, the Trust funded the controlled demolition of the West Wing. This decisive action ensured that all residents of the Northridge catchment area now possess precisely equal access to the original, smaller hospital facility. Our post-intervention EDI analysis confirmed a 37% increase in healthcare resource uniformity across the district. *Impact:* Residents previously able to access the West Wing now experience identical wait times and service levels as those in Eastmoor. The EDI improvement is undeniable.
  2.  **Environmental View Equity Initiative:** The Trust observed that certain homes bordering the popular Hillside Park commanded premium prices due to unobstructed views afforded by mature oak trees. This constituted an unearned environmental advantage. To rectify this spatial inequality, the Trust contracted arborists to reduce the canopy height of the tallest 15% of park trees to match the median height. This intervention immediately equalised the visual amenity available to all park-adjacent properties. The EDI for "scenic vista distribution" rose to an unprecedented 0.98 (where 1.0 represents perfect uniformity). *Impact:* Property values for homes with previously superior views have adjusted downwards, harmonising the market. All residents now enjoy an identical, harmonious canopy line.
  3.  **Educational Opportunity Standardisation Scheme:** Analysis revealed that the prestigious "Future Leaders" scholarship programme at State University, while merit-based, created an unacceptable gap between recipients and non-recipients. The Trust engaged with the University to permanently terminate the scholarship programme. Funds previously allocated to scholarships were redirected to administrative costs for ensuring uniform distribution of generic career advice pamphlets to all students. *Impact:* The inherent inequality generated by singling out high achievers has been eradicated. All students now share an equitable distribution of disappointment regarding scholarship opportunities, reflected in a 22-point EDI gain for "post-graduate aspiration variance".

  **WHAT WE DON'T FUND:** The EGT maintains strict funding criteria aligned with our core mission:
  *   Initiatives aimed solely at improving the absolute position of the worst off without simultaneously reducing the advantages of the better off.
  *   Programmes that create new resources where equal distribution cannot be guaranteed *ab initio*.
  *   Projects described as "lifting people up," as this implies inequality is acceptable if the baseline rises. Our focus remains firmly on the *relative* gap.
  *   Requests from "priority" focused organisations. While we acknowledge their concern for those at the bottom, their insistence on weighting benefits based on current disadvantage represents a philosophically inconsistent half-measure compared to our commitment to intrinsic relational equality. They are, one might say, our well-intentioned but conceptually diluted cousins.

  **FINANCIAL SUMMARY:** The Trust received £2.1 million in donations this year (FY23: £1.8m). Expenditure totalled £2.05 million, allocated as follows:
  *   Programme Delivery (Demolition, Arboriculture, Programme Termination): £1,620,000
  *   EDI Metric Development & Analysis: £250,000
  *   Administrative Costs (Including Uniform Stationery Procurement): £180,000
  *   **Impact Measurement Note:** As per our foundational principles, our financial statements reflect the intrinsic value created, not transient improvements in welfare. While no individual's absolute position was enhanced by our interventions (and indeed, some positions were reduced), the significant increase in equality across our target metrics represents a substantial net moral gain, fully justifying the expenditure. Our accounts value this gain in accordance with established EGT ethical accounting standards.

  **EXTERNAL PERSPECTIVE:**
  > *"The Even Ground Trust's activities represent a chillingly literal interpretation of strict egalitarianism. Their demolition of a needed hospital wing didn't cure a single patient or reduce waiting lists; it actively harmed those who could have benefited. Prioritising equality *in itself*, irrespective of human welfare, leads to this kind of gratuitous harm. Helping the worst off should be our focus, not tearing down others to meet them in the mud."*  
  > **— Professor Eleanor Vance, Department of Political Philosophy, Kingsmere University**

  **THE TRUST RESPONDS:** We thank Professor Vance for confirming the effectiveness of our interventions in eliminating the specific inequalities we targeted. Her focus on aggregate "welfare" and "harm" underscores the conceptual gap between prioritarians and those of us committed to the intrinsic good of equality. The Professor observes the *means* (demolition, tree-cutting, scholarship cancellation) but seems to overlook the *achieved end-state*: a demonstrably more equal society in those specific domains. Our EDI metrics, unlike vague notions of welfare, provide concrete evidence of this improvement. The absence of net welfare gain is not a deficit but an indicator that our work is purely focused on relational justice, undistracted by consequentialist concerns.

  **LOOKING AHEAD:** FY25 will see the EGT expand its innovative approach. Planned initiatives include piloting a "Uniform Culinary Experience" programme in workplace canteens (replacing diverse menu options with a single nutritionally adequate paste), and exploring methods to standardise natural lighting in residential areas. We remain excited by the potential for further EDI gains and look forward to continuing our vital work in creating a truly even ground for all. The path to justice is paved with levelled expectations.
