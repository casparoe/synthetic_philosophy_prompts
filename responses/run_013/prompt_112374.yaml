answer: |-
  ### Brainstormed Axes of Disagreement  
  *(Real disagreements, not consensus)*  
  1. **Fact of the matter**: Is there a truth about ontology beyond accessible information?  
  2. **Knowability**: Can we know this truth (in principle/practice)? Does the inaccessible/practically inaccessible distinction matter?  
  3. **Reference determinacy**: Do terms latch onto specific entities? If not, why (inscrutability, external fixes like causation)?  
  4. **Structuralism’s viability**: Does structuralism resolve underdetermination, or does it succumb to Newman-style triviality?  
  5. **Ramseyfication**: Does replacing theoretical terms with quantifiers dissolve or postpone underdetermination?  
  6. **Problem dissolution**: Is underdetermination a pseudo-problem (e.g., verificationism, deflationism)?  
  7. **Word-world relation**: Is reference fixed by language-use constraints, or is it "internal" to theories?  

  ---

  ### Decision Tree: Underdetermination & Reference  
  **Start**: You accept that two theories can agree on **all accessible information** (predictions, measurements, inputs/outputs) yet disagree about **what exists**.  

  ```mermaid
  graph TD
    S[Start: Accepts underdetermination] --> Q1[Q1: Is there a fact of the matter about which ontology is correct?]
    Q1 -->|Yes| Q2[Q2: Can we know this fact in principle?]
    Q1 -->|No| Q5[Q5: Is the underdetermination due to reference indeterminacy?]
    Q2 -->|No| A[Leaf A: Stubborn metaphysical realism]
    Q2 -->|Yes| Q3[Q3: Does structuralism resolve this?]
    Q3 -->|Yes| Q4[Q4: Is the structure rich enough to avoid trivial realization?]
    Q4 -->|Yes| B[Leaf B: Epistemic structural realism]
    Q4 -->|No| C[Leaf C: Newman objection]
    Q3 -->|No| D[Leaf D: Ramseyfication fails]
    Q5 -->|Yes| E[Leaf E: Quinean indeterminacy of reference]
    Q5 -->|No| Q6[Q6: Is there a privileged word-world relation?]
    Q6 -->|No| F[Leaf F: Putnam-style internal realism]
    Q6 -->|Yes| Q7[Q7: Is the question of ontology meaningless?]
    Q7 -->|Yes| G[Leaf G: Verificationism/anti-realism]
    Q7 -->|No| Q8[Q8: Is ontology choice pragmatic or conventional?]
    Q8 -->|Yes| H[Leaf H: Carnapian deflationism]
    Q8 -->|No| I[EMPTY BRANCH]
  ```

  ---

  ### Leaves (Positions)  
  1. **Leaf A: Stubborn metaphysical realism**  
     - *Description*: There is a fact of the matter, but it’s inaccessible **in principle** (e.g., other minds: consciousness is real but unknowable; physics fields/particles: one is true, but evidence is identical).  
     - *Case*: Other minds (#5), physics dualisms (#2).  

  2. **Leaf B: Epistemic structural realism**  
     - *Description*: We can know the **structure** (relations) of the world, but not intrinsic natures. Underdetermination affects intrinsic properties only.  
     - *Case*: Physics (#2), neural networks (#3) if structure fixes relations but not "meaning."  

  3. **Leaf C: Newman objection**  
     - *Description*: Structuralism fails—any structure is trivially realizable by any domain of the right size. Specifying "which relations count" is circular.  
     - *Case*: Neural networks (#3: weights underdetermine representations), mereology (#4: structure of "tablewise" arrangements doesn’t fix parts/wholes).  

  4. **Leaf D: Ramseyfication fails**  
     - *Description*: Existential quantification over theoretical terms (Ramseyfication) **postpones** underdetermination (what satisfies the quantifiers remains unresolved).  
     - *Case*: Physics (#2: particles/fields as quantified variables still need interpretation).  

  5. **Leaf E: Quinean indeterminacy of reference**  
     - *Description*: Reference is **inscrutable**—no fact about what terms latch onto (e.g., "rabbit" vs. "rabbit-stage"). Fixing reference requires arbitrary choices.  
     - *Case*: Radical translation (#1), permutation (#6).  

  6. **Leaf F: Putnam-style internal realism**  
     - *Description*: No "external" reference; truth and ontology are theory-relative. Model theory shows multiple interpretations always exist.  
     - *Case*: Permutation (#6), physics (#2: fields/particles as internal descriptions).  

  7. **Leaf G: Verificationism/anti-realism**  
     - *Description*: Ontology debates are **meaningless** if they outstrip verification (e.g., consciousness, composite objects).  
     - *Case*: Other minds (#5), mereology (#4: "tables exist" is unverifiable).  

  8. **Leaf H: Carnapian deflationism**  
     - *Description*: Ontology is a **pragmatic/conventional** choice within frameworks. No "external" fact to discover.  
     - *Case*: Mereology (#4: frameworks with/without tables), physics (#2).  

  ---

  ### Empty Branches & Problematic Separations  
  - **EMPTY BRANCH (Q8→No)**: Unstable—if no fact, ontology is meaningful, and choice isn’t pragmatic, what *does* determine it? **Incoherent** (no one holds this).  
  - **Heavy-lifting separation**: Quine (E) vs. Putnam (F) relies on Q6 ("privileged word-world relation?"). This distinction is **suspiciously thin**—Putnam generalizes Quine’s argument, and both deny external reference. A further question (e.g., "Is indeterminacy global?") might be needed.  
  - **Unattractive branch**: Ramseyfication (D) is rare alone—often folded into structuralism (B) or deflationism (H). Left as a leaf to show its fragility.  
  - **Unexplored**: Most branches are covered, but "in practice vs. principle" (Q2) is **underdeveloped**—realists who accept *in-practice* underdetermination but deny *in-principle* often collapse into deflationism (H) or structuralism (B).  

  ### Diagnostic Notes  
  - **Newman (C)**: Often misapplied. Key insight: Structuralism requires **non-trivial constraints** (e.g., causal, modal) to avoid "any set of objects works," but these constraints reintroduce underdetermination.  
  - **Cases as probes**:  
    - \#1 (Quine) → E or H.  
    - \#2 (physics) → B, C, F, or H.  
    - \#3 (neural net) → B (if structure fixes functions), C (if weights are trivial), or E (if representations are inscrutable).  
    - \#4 (mereology) → G or H.  
    - \#5 (other minds) → A or G.  
    - \#6 (permutation) → E or F.
