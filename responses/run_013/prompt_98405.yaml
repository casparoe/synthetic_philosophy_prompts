answer: |-
  ## Thought Experiment

  Nurse Lee is discharging Mrs. Adams, an elderly patient recovering from pneumonia. Mrs. Adams takes several routine medications (e.g., statin, blood pressure meds) and Lee is adding a common antibiotic, clarithromycin. Lee knows polypharmacy interactions *can* be complex to check exhaustively, a problem known to be NP-hard in general as the number of drugs grows. Dismissing a comprehensive drug interaction database search as "too complicated and time-consuming for every discharge," Lee relies on memory and administers the clarithromycin without checking. Unbeknownst to Lee, clarithromycin has a severe, well-documented interaction with Mrs. Adams' specific statin (increasing statin toxicity risk), easily discoverable with a 60-second check using the standard hospital software Lee skipped. Fortunately, Mrs. Adams experienced no adverse effects.

  **(i) Verdicts:**
  *   **Actual Outcome View:** Exonerates Lee. Since Mrs. Adams suffered no harm, there is no negative outcome to blame Lee for. The act caused no actual damage.
  *   **Feasible Procedure View:** Blames Lee. A feasible procedure existed (the quick software check taking ~60 seconds) that would have reliably identified the severe, known interaction and prevented the *risk* of significant harm. Lee's failure to run this available, tractable procedure for *this specific, small instance* constitutes negligence, regardless of the general complexity of polypharmacy checks.

  **(ii) Key Feature:** The **tractability gap** between the *general computational problem* (polypharmacy interaction checking for large n) and the *specific instance faced* (checking a single new drug against an existing short list). The procedure that was feasible for *this instance* was skipped under the *general* excuse of complexity.

  **(iii) If Feature Removed:** If the specific instance *was* genuinely computationally intractable (e.g., Mrs. Adams took 20+ complex drugs with poorly characterized potential interactions requiring hours of uncertain analysis), both views might converge. The outcome view still exonerates (no harm). The feasible procedure view *might* also exonerate, as no *feasible* procedure reliably yielding the right answer existed for *that instance* – the complexity excuse would be valid. The disagreement disappears.

  **(iv) General Intractability as Red Herring:** The general NP-hardness of polypharmacy interaction checking is irrelevant to assessing Lee's blameworthiness *in this specific case*. It serves only as a plausible-sounding but ultimately misleading excuse Lee used to justify skipping a procedure that was *perfectly feasible and effective for the small, concrete task she actually faced* (checking one new common drug against a short, stable list).

  **(v) Attack by Defender of Actual Outcome View:** A defender of the outcome view would argue that blame requires *actual* harm caused by the act. They would contend that the feasible procedure view conflates *blame for an outcome* with *criticism of a process*. While Lee's process *could be criticized* as suboptimal or risky, without a *materialized bad outcome* directly traceable to her specific omission, she cannot be *blamed*. The harm is counterfactual (it *could* have happened) but didn't, so blame is misplaced. Focusing on feasible procedures, they argue, unfairly expands blame to include mere risk-creation, even when fortune intervenes. The only "harm" is procedural, not substantive.
