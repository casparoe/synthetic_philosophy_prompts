prompt: |-
  You are a philosopher working at the intersection of computational complexity and practical rationality. I am assembling a teaching dataset and need a case built to specification rather than lifted off the shelf, so please brainstorm briefly before committing to a scenario, and check carefully that the case genuinely does what I ask rather than merely asserting it.

  Construct a thought experiment in which two views about what an agent ought to do give opposite verdicts on blameworthiness, in the direction that is easy to get backwards: the view that assesses the act by its actual outcome must exonerate the agent, while the view that assesses the agent by the procedure she could feasibly have run must blame her. Constraints: realistic (a workplace, a clinic, or a household — not a trolley or a lab); one paragraph; no oracles, exotic physics, supercomputers, or stipulated perfect reasoners; stakes a normal person could face. The complexity theory must enter through the agent's own reasoning rather than authorial fiat: the decision problem she faces should be intractable in general — hard enough that an appeal to its complexity would ordinarily look like a good excuse — yet the particular instance before her should be small enough that a feasible procedure would have reached the right answer. Isolate that variable — general hardness versus the tractability of the actual instance — and hold everything else fixed.

  After the scenario, (i) state the verdict each view gives and why; (ii) name the feature of the case that is doing the work; (iii) say what happens to the disagreement if that feature is removed; (iv) explain why the general intractability of the problem is a red herring here; and (v) describe how a defender of the view that comes out badly would attack the case.
