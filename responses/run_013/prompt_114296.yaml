prompt: |-
  I'm a second-year student in a political theory course, and for a paper I'm trying to understand a hybrid institution my university's student government adopted last year. The student assembly is chosen by lot from the undergraduate body, with a per-meeting stipend and no term limits, because its members are supposed to be a descriptive sample rather than career politicians. The president and treasurer, by contrast, are elected by the whole student body, receive a monthly salary, and are limited to two consecutive terms. The assembly sets the agenda and can pass resolutions, but the elected officers hold a veto and control the budget. The official rationale was that sortition avoids faction and self-selection, elections preserve accountability for money and administration, term limits prevent entrenchment, and salaries make office accessible to students who cannot afford unpaid work. I can see why each piece was chosen, but I'm puzzled about what picture of democratic representation the whole arrangement presupposes.

  Does it presuppose an epistemic view of democracy, on which ordinary citizens have the competence to deliberate but not to administer, or a trustee model for the elected officers and a delegate model for the sortition assembly, or something else entirely? Which rival views of representation and officeholding does the package quietly rule out, and which parts are merely underdetermined by it? I'm especially interested in whether the term limits and the salaries pull in opposite directions: term limits suggest that holding political office should not be a career, while a salary and a professional staff suggest that it is a job that requires experience. I'd like you to reconstruct the implicit theory as carefully as you can, distinguish what the practice strictly presupposes from what it merely fits well with, and say what would have to change in the institution if we replaced that theory with a straightforwardly participatory one or with a straightforwardly expert-driven one. Please answer in continuous prose, without headings, bullet points, bold text, or tables, the way you would write an email. Be explicit about how confident you are in your reconstruction, tell me where your reasoning is most likely to fail, and say what argument or consideration would lead you to a different verdict about what the practice presupposes.
reasoning: |-
  Okay, the user is a second-year political theory student analyzing their university's student government structure. They're trying to understand the implicit theory of democratic representation behind this hybrid system combining sortition and elected positions. 

  Hmm, this is actually quite sophisticated for an undergrad paper - they've already identified key tensions like term limits vs salaries, and are asking about epistemic vs participatory models. Smart framing. I should be careful not to oversimplify.

  First, let's unpack their institution: random selection for the assembly with stipends (descriptive representation), elected executives with veto power and salaries (accountability), term limits everywhere. The stated rationale makes sense on surface level but they're right to sense deeper philosophical tensions.

  The term limits vs salary paradox is particularly sharp: paying officers suggests professionalism while limiting terms prevents careerism. That's not necessarily contradictory though - could just mean "we want serious but temporary commitment." Still, it points to different visions of officeholding.

  For epistemic democracy, this setup fits beautifully: citizens can judge policy (assembly) but need experts for execution (officers). The veto power even mirrors epistocracy's skepticism of pure popular judgment. But is that presupposed? Not necessarily - it could also fit a Madisonian separation-of-powers view.

  What would refute my reconstruction? If the assembly had binding budget power instead of officers, that would undermine the epistemic reading. Or if sortition members rotated every meeting - but they don't, so descriptive stability seems intended.

  For participatory alternatives, you'd need to remove the veto and make assembly decisions binding. Maybe rotate officers by lot too. For expert-driven models, you'd ditch sortition entirely and have faculty oversight.

  Biggest uncertainty: is the salary really about accessibility alone, or tacitly acknowledging skilled labor? The stipend vs salary difference suggests hierarchy of responsibility. But without interviewing designers, I can't be sure.

  Should emphasize this is reconstructive - they're asking good critical questions about what's ruled out (like radical direct democracy). Their paper could really shine by showing how practical compromises encode theoretical contradictions.
answer: |-
  Your institution's design reveals a sophisticated, hybrid theory of representation that cautiously blends epistemic and trustee elements while rejecting both pure participatory democracy and unaccountable expertise. Let me reconstruct its presuppositions, tensions, and alternatives step by step—noting where my inferences might falter.

  The core presupposition is a *division of democratic labor*: descriptive representation via sortition legitimizes collective will-formation (the assembly's agenda-setting and deliberation), while electoral accountability legitimizes administrative power (officers' veto and fiscal control). This division strictly rules out two rival views: **first**, that ordinary citizens lack competence even for deliberation (rejecting epistocracy/technocracy); **second**, that elected officials should be mere delegates executing popular mandates (rejecting populism). Instead, it assumes citizens *can* discern common interests through deliberation but *cannot* efficiently manage complex resources—hence officers act as trustees with independent judgment. The epistemic dimension surfaces in privileging sortition for agenda-setting: random selection avoids the "distortion" of self-selection and factionalism, presuming a diverse group will produce wiser public judgments than ambition-driven elections might.

  Your observation about term limits and salaries is astute; they reflect unresolved tensions. Salaries presuppose that administrative roles require *sustained expertise* and merit compensation for skilled labor (leaning toward professionalism). Term limits, conversely, assume that prolonged incumbency corrupts judgment or monopolizes power (leaning toward civic republicanism). This isn't necessarily contradictory—the design may imply that officers should gain *enough* experience to be effective (hence salaries) but not so much that they become detached from the student body (hence term limits). Still, it subtly prioritizes *rotation* over *accumulated expertise*, suggesting skepticism toward political careerism. The stipend for the assembly, meanwhile, assumes participation is a public good requiring compensation for fairness—not a skill requiring development.

  What does the package rule out?  
  - **Participatory purism**: Binding agenda control by sortition rejects the notion that all students must *directly* exercise power.  
  - **Electoralism**: Sortition’s primacy in deliberation denies that elections alone produce legitimate representation.  
  - **Technocracy**: The assembly’s veto-proof resolutions (if achievable) would undermine administrative autonomy, but officers’ veto preserves a check against "irrational" popular will.  

  Were you to adopt a **straightforward participatory theory**, you’d dismantle the veto, make assembly resolutions binding, rotate officers by lot (without salaries), and abolish term limits to deepen engagement. Expertise would be distrusted; legitimacy would stem from continuous rotation and direct control. Conversely, a **technocratic shift** would replace the sortition assembly with faculty-appointed committees, eliminate term limits for officers to cultivate expertise, and retain salaries while scrapping stipends—implying that judgment flows from qualification, not descriptive identity.

  My confidence is moderate (70%). The reconstruction could falter if:  
  1. **Veto usage patterns** contradict my "trustee" reading (e.g., if officers always rubber-stamp assembly decisions).  
  2. **Selection bias** in the lotteried pool exists (e.g., if only certain students apply), undermining descriptive claims.  
  3. **Stipend/salary levels** are trivial, suggesting they’re symbolic rather than functional—which would weaken the "expertise" argument.  

  A key counter-evidence would be if officers *routinely override* the assembly on non-fiscal grounds. This would imply a stronger trustee model than I’ve inferred, leaning toward epistocracy. Alternatively, if vetoes only target budgetary overreach, it might signal narrower administrative competence—not a rejection of popular judgment.  

  Ultimately, your institution embodies a *pragmatic pluralism*: it distrusts pure models but borrows from each to mitigate their flaws. The tensions you note aren’t failures but design features—balancing accessibility against entrenchment, popular voice against efficient administration. To test this, examine whether vetoes correlate with fiscal issues (supporting my reading) or ideological clashes (undermining it). Well-argued!
