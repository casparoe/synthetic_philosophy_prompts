  ## Conservation Treatment Report: Object 1947.23 "Woman Holding a Mirror" attributed to Édouard Lautrec

  **1. Object and Provenance**
  *   **Accession Number:** 1947.23
  *   **Artist:** Attributed to Édouard Lautrec (fictional; b. Toulouse, France 1867 - d. Charenton Asylum, France 1922). Note: Attribution confirmed 1953 via comparative stylistic analysis and inscription on stretcher bar (see Examination).
  *   **Title:** Woman Holding a Mirror (La Femme au Miroir)
  *   **Date:** c. 1911
  *   **Medium:** Oil on canvas
  *   **Dimensions:** 92 cm x 73 cm
  *   **Support:** Original linen canvas, commercially primed. Oak stretcher (original).
  *   **Provenance:** Acquired by the Museum of Civic Reflection (MoCR) via bequest of industrialist Arthur Vance (1947). Previously: Galerie Lebrun, Paris (purchased directly from Lautrec, 1912); Private Collection, Zurich (1912-1938); Vance Collection (1938-1947).
  *   **Significance:** A significant example of Lautrec's late Symbolist-influenced period, noted for its complex spatial compression and psychologically charged atmosphere. Currently displayed in Gallery 7 ("The Modern Psyche: 1890-1920") adjacent to Object 1950.8 ("Portrait of Madame X," *formerly* attributed to Lautrec, reattributed to Jacques-Émile Blanche in 2009).

  **2. Condition**
  *   **Structural:** Stretcher stable. Minor key expansion. Canvas exhibits overall planar distortion (+/- 3mm), likely due to past environmental fluctuations. No tears or punctures.
  *   **Ground/Paint Layer:** Stable adhesion observed. Network of fine age cracks (craquelure) consistent with period and medium, most pronounced in dark passages (background, subject's dress). Minor localized lifting (<1mm) along lower left edge, secured with historical adhesive (likely animal glue).
  *   **Surface:** Moderate overall grime and dust accumulation. Discolored, degraded natural resin varnish layer (applied pre-1947) causing significant blanching and yellowing, particularly in mid-tone flesh areas and white highlights. Two pinpoint losses in background (upper right quadrant). Signature ("Lautrec") intact, lower right.
  *   **Auxiliary:** Original stretcher annotated in graphite: "Pour Marie, témoin de tout. E.L." ("For Marie, witness to everything. E.L."). Frame (early 20th c. French gilt compo) stable; minor losses to compo ornament.

  **3. Examination and Analysis**
  *   **Visual (Raking/UV):** Confirmed planar distortion and lifting. UV fluorescence revealed extent of degraded varnish and previous, uneven retouching (likely Vance era) in background and lower edge.
  *   **Infrared Reflectography (IRR):** No significant underdrawing detected. Confirmed canvas weave structure. Stretcher inscription clearly visible and matches known Lautrec handwriting samples.
  *   **Cross-Section Microscopy:** Standard ground layer (chalk/glue). Paint layers consistent with Lautrec's late palette: lead white, vermilion, ivory black, emerald green, zinc yellow. No unusual materials detected. Trace particulate within ground layer identified as common Parisian atmospheric soot (c. 1900-1920), not biological.
  *   **Stretcher Wood Analysis (Dendrochronology):** Oak sourced from the Loire Valley, France. Felling date range: 1895-1910. *Note:* Historical records indicate Lautrec sourced stretcher materials from suppliers also servicing furniture makers associated with the Charenton Asylum where he resided and where Marie Clermont (his primary model and the subject of this portrait) was an inmate. Lautrec was implicated in Clermont's disappearance and presumed murder (1919); dismembered remains were found near asylum grounds in 1920. He died awaiting trial. This information constitutes the primary ethical concern regarding display.

  **4. Treatment Proposal**
  1.  **Surface Cleaning:** Reduce particulate grime and dust using soft brushes and low-suction micro-vacuum.
  2.  **Varnish Removal:** Carefully reduce degraded natural resin varnish using tailored solvent gels. Goal: Reveal original color relationships obscured by blanching/yellowing. Test areas indicate potential for significant aesthetic improvement.
  3.  **Stabilization:** Secure areas of lifting paint using reversible adhesive (Isinglass) applied under slight pressure/micro-heat.
  4.  **Facing (if required):** Temporary facing with BEVA 371 film may be necessary during varnish removal over unstable areas.
  5.  **Retouching:** Minimal retouching of pinpoint losses and historic retouchings judged aesthetically disruptive using stable, reversible pigments (Gamblin Conservation Colors) in isolation technique. No inpainting of craquelure.
  6.  **Re-varnishing:** Apply protective, non-yellowing synthetic resin varnish (MS2A) via spray for even saturation.
  7.  **Stretcher:** Retain original stretcher and inscription. Surface-clean graphite. Document inscription comprehensively. Consider isolating inscription with archival barrier paper if requested by Ethics Committee, though no direct physical interaction is anticipated. *Note: Treatment does not address the inscription's content or historical association.*
  8.  **Frame:** Clean and stabilize; minor compo loss fills with gesso/whiting; toning with stable pigments.

  **5. Risk Assessment**
  *   **Structural:** Low risk during treatment. Planar distortion poses minor handling challenge. Stable environment post-treatment essential.
  *   **Aesthetic:** Varnish removal carries inherent risk but is mitigated by testing. Potential exists for subtle shift in perceived mood/intensity of the work. Removal of degraded varnish may increase perceived immediacy of subject's gaze and expression.
  *   **Ethical/Social:** High risk of viewer distress or protest due to artist's history. Display of the inscription "Pour Marie, témoin de tout" may act as a specific trigger. Potential for misinterpretation of conservation treatment as moral cleansing or endorsement. Association risks impacting perception of adjacent works, particularly Object 1950.8, whose reattribution to Blanche significantly altered its perceived psychological weight upon removal of Lautrec association. *Note: Conservation treatment cannot mitigate these non-material risks.*

  **6. Recommendation**
  Proceed with proposed conservation treatment (Steps 1-8) to address documented material instability and aesthetic compromise caused by degraded varnish. Treatment will stabilize the object and restore its intended visual properties to the extent possible given its material history. This recommendation is based solely on the physical condition and preservation needs of Object 1947.23 as a material artifact.

  The decision regarding continued display rests with the Curatorial Department and Director, informed by the Museum's Ethics Committee review and Public Engagement Strategy. Conservation notes that the physical treatment does not alter the object's provenance, history, or the documented actions of its creator. The inscription on the stretcher remains an integral part of the object's material history and will be preserved.

  ---

  **Appendix: Minority Notes**

  1.  **Dr. Aris Thorne, Chief Curator, Modern Art:**
      "While Lautrec's actions are indefensible, attempting to quarantine them from his work is both impossible and counterproductive to understanding the period. The horror *is* the achievement here. This portrait is uniquely powerful *because* we know what Lautrec did. The tension between the subject’s haunting beauty (enhanced post-treatment), her awareness suggested by the mirror, and the artist’s monstrous reality creates a raw, uncomfortable truth about human capability. Removing it sanitizes history. Its power lies precisely in its irreconcilable duality – technical mastery embodying profound moral failure. To hide it is to deny this uncomfortable facet of the human condition that art must sometimes confront."

  2.  **Conservator Elena Varga, Senior Paintings Conservator:**
      "The ethical 'taint' isn't just external biography; it manifests as an *artistic* flaw within the work itself. Knowing Lautrec's crime irrevocably alters the act of viewing. The composition – the model's averted gaze, the mirror reflecting an unseen space where atrocity likely occurred, the claustrophobic tension – now reads not merely as Symbolist ambiguity, but as a visual demand for complicity. The viewer is implicitly asked to appreciate the beauty while overlooking the horror it foreshadows. This creates a fundamental incoherence; the work asks for an aesthetic response that feels morally impossible to render purely. This dissonance is not just ethical; it disrupts the artistic unity and legibility of the piece. It fails *as art* because it cannot sustain the viewer's necessary engagement without profound discomfort that overshadows formal qualities. Treatment improves the paint layer, but cannot fix this inherent fracture. Display requires extreme contextualization acknowledging this artistic compromise."

  ---

  **Memo: Display Recommendation (From Curator of Modern Art to Director)**
  Subject: Post-Conservation Display of Object 1947.23

  Following successful conservation treatment of Object 1947.23 ("Woman Holding a Mirror," attr. Lautrec), the Modern Art Department recommends its return to Gallery 7 ("The Modern Psyche: 1890-1920").

  *   **Rationale:** The work remains a significant, if deeply problematic, document of its era and Lautrec's artistic trajectory. Its removal constitutes a loss to the historical narrative presented in Gallery 7.
  *   **Contextualization:** Enhanced interpretive materials will be implemented:
      *   A dedicated panel adjacent to the work detailing Lautrec's crime and the specific history of Marie Clermont.
      *   Explicit mention of the stretcher inscription and its implications.
      *   Inclusion of the Minority Notes (Appendix) in the digital catalogue entry.
      *   A dedicated microsite exploring the ethical and artistic dilemmas posed by the work.
  *   **Positioning:** Will be moved slightly within the gallery to avoid direct sightline with Object 1950.8 (Blanche portrait), acknowledging the differing weight of their respective provenances.
  *   **Acknowledgment:** This recommendation acknowledges the significant ethical burden of display and the inevitability of ongoing distress to some viewers. It is not an aesthetic endorsement of Lautrec or his actions. It is a decision based on the museum's educational mission to present complex, challenging histories, providing the necessary critical framework for public engagement rather than removal. We recognize the viewer who finds the required perspective morally untenable; this difficulty arises from the work's context, not necessarily a defect inherent in the viewer.
