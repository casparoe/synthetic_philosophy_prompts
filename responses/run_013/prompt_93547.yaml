  **Analysis:**

  1. **Identity Theory:** The identity theorist would say that pain is identical to a particular physical state in each type of organism. For humans, pain is C-fibre firing. For octopuses, it is the activation of the ganglia network. There is no single kind "pain" that applies to both at a higher level. The identity theorist would argue that the shared functional role is not what pain is; pain is the physical state that happens to play that role in a given species.

  2. **Functionalism:** The functionalist would say that pain is defined by its functional role (i.e., the causal relations it bears to inputs, outputs, and other mental states). Therefore, both the human and the octopus are in pain because they have states that play the same functional role, despite the physical differences. The functionalist might argue that the kind "pain" does explanatory work: it allows us to generalize across species and to explain behavior in terms of the organism being in a state that has certain causal powers (e.g., causing avoidance).

  **The Key Feature Doing the Work:**

  The key feature that makes the multiply realized kind lack explanatory power is that the causal laws governing the realizers are so different that they do not share any non-trivial causal properties at the level of the realized kind. That is, the only properties they share are the very high-level functional ones (like causing avoidance) which are too vague to support robust explanations. Any detailed explanation requires descending to the level of the realizer.

  **What if a Hidden Shared Property is Discovered?**

  Suppose that later we discover that both the mammalian C-fibre system and the octopus ganglia system rely on a particular ion channel (say, a specific type of TRP channel) that was previously unknown. Then, the identity theorist might say that this shared property is the true physical basis of pain, and the kind is no longer multiply realized in the same way. However, note that the original realizers were still different in kind (one being a fibre system, the other a ganglia network) and the shared ion channel might be present in both but embedded in different larger mechanisms. The functionalist might jump on this as evidence that there is a common physical property. But the key is: if the shared property is at a lower level (like the ion channel) and it is the critical factor, then the multiply realized kind might collapse into a single physical kind at that lower level. However, if the ion channel is just one component and the overall mechanisms are still very different, then the original argument stands.

