  The case shows that multiple realizability does not entail functionalism because the multiply realized kind, while real (as a grouping by functional role), does not do the explanatory work that a natural kind does. The identity theorist can accept that the same functional role is played by different physical states in different organisms, but maintain that the physical state is what explains the behavior. The functionalist must argue that the higher-level kind has its own explanatory power, which in this case is thin because of the radical differences in the realizers.

