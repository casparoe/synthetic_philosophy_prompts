  **Does the Second-Order Kind Move Buy Anything?**

  It buys conceptual clarity by defining the mental state in terms of functional role, but it does not necessarily add explanatory power in the detailed causal explanations. The second-order kind is still multiply realized, and if the realizers are too heterogeneous, then the second-order kind may not figure in any non-trivial scientific laws. So, it renames the problem but does not solve the issue of explanatory impotence.

