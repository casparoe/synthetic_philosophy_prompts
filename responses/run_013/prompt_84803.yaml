  I am a high school student who has gotten into a stubborn argument with my best friend, and I would like your help. We grew up in neighboring valleys and both use the word thrush for a small brown bird that looks and behaves identically to us; we have the same mental image, the same memories, and the same feelings about it. A biologist now tells us that the birds in my valley and his valley are different species, though even she admits the classification is contested because they can interbreed and are indistinguishable in the field. My friend says our word must mean the same thing because everything inside our heads is the same. I say our word picks out different birds, so we have been talking past each other. Please act as an expert in philosophy of language and mind, think carefully about the structure of the case before answering, and give me exactly five numbered pieces of advice, each one or two sentences, with no introduction or conclusion. I want to know who is right, what the dispute actually turns on, how the biologist's authority matters, and what I should say to my friend.
