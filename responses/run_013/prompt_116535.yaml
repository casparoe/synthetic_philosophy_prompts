prompt: |-
  I've been roped into running a session at our local library's monthly big questions discussion group — grown-ups, mostly retired teachers and a couple of nurses, no philosophy training, forty-five minutes and a flipchart. The topic I picked, slightly on a whim, is supererogation: the idea that some actions are morally good but not morally required. Don't explain the concept to me; I know roughly what it is. What I want is a plan for how to teach it. The thing that worries me is that the whole topic only makes sence once you've got a picture in place of morality as having a floor (what you mustn't do), a middle (what you must do), and then — supposedly — a space above the middle that isn't required of you at all. So the question of what has to come first is a real one, not a formality. I've half-decided to build the session around the old theological distinction between precepts and counsels — the commandments that bind everyone versus the counsels of perfection that are recomended but not commanded, poverty and chastity and so on — because that's where the word comes from and it makes the idea feel less like a modern invention. But I'm not sure it's the right carrying example for this crowd, or whether it just imports a religious frame they'll bounce off.

  So: what order do the pieces have to go in — do they need the precepts/counsels thing first, or a more everyday case, or the puzzle first? The puzzle being that if one act really is morally better than another, how can doing the lesser one ever be permissible, which makes supererogation look impossible rather than obvious. What single example should carry the whole thing, and what does it have to have (and not have) to do that work — because I suspect the grenade-jumping soldier is too dramatic and too quick, and 'giving to charity' is too vague to bite. Which misconceptions will they form, in the order they'll form them, and at exactly which point in the sequence I should head each one off — I'm already expecting at least three: that supererogation just means being extra nice, that it's a matter of degree rather than a category, and that anything genuinely better must therefore be required. And what's the one question I can put to them at the end that would show me whether the idea actually landed, rather than just that they can repeat the word back. Also tell me what I should openly refuse to go into at this level and say so — wether the whole category is even coherent, or the demandingness literature about morality asking too much of us.
reasoning: |-
  Okay, the user needs a plan for teaching supererogation to a group of adults with no philosophy background. Let me start by understanding their main concerns. They’re worried about the foundational structure of morality—floor, middle, and above—being necessary for supererogation to make sense. They’re considering using the theological precepts vs. counsels framework but are unsure if it’s appropriate for their audience.

  First, I need to address the order of concepts. The user is right that the structure of morality needs to be established first. The precepts/counsels might be too religious, potentially alienating some participants. Maybe a more secular approach using everyday examples would be better. Let me think of relatable scenarios. The charity example is good but needs specifics to avoid vagueness. A neighbor helping another with groceries and then going beyond to cook meals—that could illustrate obligatory vs. supererogatory actions.

  Next, misconceptions. The user mentioned three: supererogation as just being extra nice, a matter of degree, or that better must mean required. I should tackle these step by step. For instance, after introducing the charity example, highlight the difference between obligation and going beyond. Use the flipchart to map out duties vs. extras. Emphasize the category distinction, not just degrees of goodness.

  The puzzle about why supererogation isn’t required is crucial. They might think if something is better, it must be obligatory. Using the neighbor example, ask why cooking meals isn’t mandatory. Discuss moral freedom and the space beyond duties. This leads into the puzzle naturally after establishing the structure.

  For the opening hook, starting with a relatable story makes sense. The neighbor scenario sets a clear, non-religious context. Avoid the grenade-jumping soldier as too dramatic. Transition from the story to defining key terms—obligatory, impermissible, supererogatory. Use the flipchart to keep terms visible.

  Misconception handling: After defining, address each one. For "extra nice," clarify it’s about exceeding duty. For "matter of degree," stress the categorical difference. For "better must be required," use the puzzle discussion to show permissibility of doing less.

  End with a check question: "Why isn’t X required?" to see if they grasp the category. Avoid coherence debates and demandingness literature. Keep it focused on understanding the concept, not defending it.

  Overall, structure: Hook with example, define structure, introduce supererogation, puzzle discussion, address misconceptions, consolidate with another example, and check understanding. Keep religious references optional for depth if time allows. Make sure the flipchart is used throughout for visual mapping. Time each segment to fit 45 minutes, leaving room for discussion.
answer: |-
  Here's a battle-tested plan designed for your specific constraints, audience, and concerns, prioritizing clarity and avoiding rabbit holes:

  **Core Structure:** Build the moral floor/middle/ceiling FIRST using everyday examples BEFORE introducing "supererogation" or the religious frame. The theological origin is a great *optional depth piece*, not the foundation.

  **The Plan (45 Minutes):**

  1.  **Hook & Moral Baseline (5 mins):**
      *   **Start with a Concrete, Relatable Story:** "Imagine your neighbor, recovering from surgery, struggles to get groceries. You see this. What might you feel you *should* do? What *must* you do?"
      *   **Flipchart:** Draw two columns: "Must Do / Shouldn't Do" (Obligatory/Impermissible) vs. "Nice To Do / Could Do" (Potentially Supererogatory).
      *   **Audience Brainstorm:** Quickly list responses under each column (e.g., "Must: Not steal their stuff", "Should: Maybe offer help if able", "Nice: Bring over a cooked meal", "Nice: Mow their lawn weekly"). **Goal:** Establish the everyday intuition of the moral floor (mustn't steal) and a middle ground (helping *might* be expected).

  2.  **Building the Structure: Floor & Middle (10 mins):**
      *   **Refine Obligations:** Focus on the "Must Do/Shouldn't Do" column. Emphasize these are *requirements*: "We generally agree society would blame you, or you'd feel guilty, for *not* doing these (or *doing* the 'mustn't dos'). This is the moral floor – the basics required of everyone."
      *   **Introduce the Middle:** Point to actions like "Offer help if able." Frame them as duties: "Many of us feel there *is* a duty to help in some way when we easily can – the 'middle ground' of morality. Failing this might not be *evil*, but it could be seen as *lacking*, or even blameworthy in certain contexts (e.g., ignoring a drowning child when you're a strong swimmer)." **Key Point:** Establish that this "middle" is *required* (duty/obligation). Label the column now: **Obligatory/Impermissible**.
      *   **Visual:** Draw a simple ladder/building on the flipchart: **Floor (Must/Mustn't) -> Middle (Duties/Obligations)**.

  3.  **Introducing the "Above": The Puzzle & Supererogation (15 mins):**
      *   **Point to the "Nice" Column:** "Now, what about these actions? Bringing over a cooked meal *every* night? Mowing their lawn *every week* without being asked? Organizing a neighborhood meal train? Are these *required*? Is it morally wrong *not* to do them?"
      *   **The Puzzle Emerges:** "Here's the tricky part: We all agree these actions are *good*, maybe even *better* than just offering help once. But does being *better* mean they are *required*? If doing *less* than your best is permissible, how can something be *better* but *not required*? That's the puzzle."
      *   **Define Supererogation:** **NOW** introduce the term: "Philosophers call actions that are morally *good* or even *excellent*, but are *not required* or obligatory, **supererogatory**." Write it on the flipchart above the "Middle" level. Emphasize: *Beyond the call of duty*.
      *   **Core Example (Carrying the Weight):** **The Dedicated Neighbor.**
          *   *Obligatory:* Not causing harm, perhaps offering basic help once if easily possible (e.g., picking up one prescription).
          *   *Supererogatory:* Cooking and delivering meals for the *entire* recovery period (2 weeks), organizing a cleaning rota, visiting daily for company. **Why it works:** It's relatable, non-religious, clearly exceeds baseline duties, involves effort/sacrifice (time, energy), and isn't vague. It avoids the life-or-death intensity of the soldier while still showing significant "going beyond."

  4.  **Addressing Misconceptions Head-On (10 mins):** Tackle these *as they naturally arise* from the discussion above, or proactively after defining supererogation:
      *   **"Just extra nice" / "Matter of degree":** "Is supererogation *just* being extra nice? Or is it a whole different *category*? Think about our neighbor: Offering help *once* might be a duty. Cooking meals *for weeks* isn't just 'more nice' – it crosses a line into something *beyond* what anyone could demand. It's not just *more* obligation; it's *above* it." **Use the Flipchart:** Show the distinct level above "Obligatory".
      *   **"Better must mean required":** "This is the puzzle! If cooking meals for weeks is *better* than just helping once, why isn't it *required*? What makes it permissible to *only* do the basic duty? (Discuss: Freedom, excessive demand, recognizing extraordinary effort). Supererogation says morality has room for *optional goodness* that we admire but don't mandate."

  5.  **Optional Depth: Theological Origin (2-3 mins - IF TIME & RELEVANCE):** "It's interesting this idea has deep roots. The word 'supererogation' comes from Catholic theology, distinguishing *precepts* (commandments binding everyone, like 'Thou shalt not steal') from *counsels* (advice for perfection, like voluntary poverty or chastity, that aren't required for salvation). It shows the long-standing intuition that some goodness operates on a higher, optional plane." **Emphasize:** "But the *concept* exists outside religion, as our neighbor example shows."

  6.  **Consolidation & Check (3 mins):**
      *   **Reiterate:** "So, supererogation: Actions that are morally praiseworthy, even excellent, but are *beyond* strict duty or obligation. They occupy the space *above* the moral 'must-dos'."
      *   **The Check Question:** "Think of someone famous admired for extraordinary goodness – like a major philanthropist giving away most of their wealth, or a historical figure known for immense sacrifice for others. **Why do we admire them *without* necessarily thinking *everyone* is morally required to do exactly what they did?**" *This tests if they grasp the "beyond obligation" core.*
      *   **Final Flipchart:** Ensure the visual hierarchy is clear: **Impermissible -> Obligatory (Duty) -> Supererogatory (Beyond Duty)**.

  **What to Explicitly Refuse (State Clearly):**

  *   **"Is supererogation even a coherent category?":** "That's a fascinating *philosophical debate* for another day! Today, we're exploring the *concept* and why many find it useful to describe everyday moral experiences." (Shuts down meta-debate).
  *   **"Does morality demand too much? / The demandingness objection":** "That's a huge question about the *limits* of duty itself! We're focused today on what happens *above* duty, not arguing about where the duty line is drawn." (Prevents getting bogged down in justifying the "middle").
  *   **Deep Theological Debate:** Keep the origin as a brief, interesting footnote, not a discussion point. "We won't debate theology today, just note the historical connection."

  **Why This Works:**

  1.  **Builds Foundation First:** Establishes obligatory/impermissible clearly before introducing "above".
  2.  **Secular & Relatable:** The neighbor example is perfect – concrete, understandable sacrifice without being alienating or overly dramatic.
  3.  **Puzzle Placement:** Introduces the conceptual puzzle *after* establishing the structure but *before* fully defining supererogation, making the definition the solution.
  4.  **Proactive Misconception Busting:** Addresses the key confusions directly within the flow of building the concept.
  5.  **Clear Check Question:** Forces application of the core idea (admiration without requirement).
  6.  **Guarded Boundaries:** Explicitly rules out complex tangents.
  7.  **Flipchart Focus:** Provides a constant visual anchor for the moral structure.

  **Key to Success:** Keep the pace brisk, use the neighbor example consistently, and ruthlessly steer discussion back to the core structure and away from the forbidden topics. Good luck – it sounds like a great group!
