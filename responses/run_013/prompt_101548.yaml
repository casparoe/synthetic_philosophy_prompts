      1.  **Your Description:** You explicitly state "(d)" is the one you "actually fight about." This surfaces the disagreement.
      2.  **Priya's Stance:** Defending to the "death" suggests she sees a knockdown argument. Veritism (a) and Precision (b) are often taken as starting points *by proponents*. Idealization (c) is seen as solvable. Permissiveness (d) is the most common and potent *internal* challenge accuracy-firsters grapple with. Her high credence implies she has a rebuttal (e.g., "permissiveness is limited/bounded," "it's not vacuous because incoherence is still ruled out," "the weighting reflects legitimate epistemic interests").
