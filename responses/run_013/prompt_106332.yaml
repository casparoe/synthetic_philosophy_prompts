prompt: |-
  Bit of an odd one this, but I'm stuck. Reading group on formal epistemology, and a mate of mine built an argument that's bugging me because the conclusion is obviously bollocks and I can't find the dodgy step.

  Here it is more or less as he wrote it:

  (1) Jeffrey conditonalisation is the rule for updating on uncertain evidence. When what you learn isn't certainty in a single proposition but a shift in your probabilities across a partition {E_i}, your new probability for any proposition A is the sum, over the cells, of your old conditional probability of A given E_i multiplied by your new probability of E_i.
  (2) Perception hands you uncertain evidence: when you seem to see or hear something, you're left with a high-but-not-certain degree of belief in its content, not certainty.
  (3) So perception updates are run by (1).
  (4) Fix any partition into E and not-E, and any A. Your old conditionals P(A|E) and P(A|not-E) come from your prior. Your new probabilities for E and not-E are just the degrees of belief you wind up with in the evidence once the experience is over.
  (5) The new probability of A is a weighted average of those two old conditionals, weighted by your new degrees of belief in the evidence. So as your new confidence in E slides from 0 to 1, your new P(A) slides smoothly from P(A|not-E) up to P(A|E).
  (6) Nothing in the rule pins down your new confidence in E. It's whatever you find yourself with.
  (7) So for any target belief in A lying between those two old conditionals, there's a permissible update that lands you exactly on it, and since nothing pins your new confidence in E, nothing stops you landing on whatever you fancy.
  (8) So Jeffrey conditionalisation lets a rational agent end up believing anything at all, simply by letting their confidence in the evidence settle wherever suits them. A rule of rationality that permits every outcome isn't a rule of rationality. So either Jeffrey conditionalisation is wrong, or uncertain perceptual evidence can't really count as evidence.

  To make it concrete he put numbers on it: say P(A|E)=0.9 and P(A|not-E)=0.1. Then your new P(A) is 0.1 plus 0.8 times your new P(E). Land on 0.5, 0.7, 0.9, whatever you like, just by fixing your new confidence in E accordingly.

  I'm pretty sure (1) is the right rule for uncertain evidence, and I don't want to give up (2), because I'm not willing to say perception is certain. So which step is rotten, and what does it cost me to cut it out? If more than one is rotten, tell me the order you'd sacrifice them in. British English please, and don't worry about being gentle about it.
reasoning: |-
  Alright, let's tackle this step by step. The user's mate has constructed an argument that seems to show Jeffrey conditionalization leads to complete doxastic anarchy, which is obviously problematic. The user is stuck because they accept premises (1) and (2) but can't spot the flaw. 

  First, I need to understand the core issue. The argument claims that since Jeffrey conditionalization doesn't fix your new confidence in E (the evidence), you can freely choose any new P(E) and thereby land on any P(A) between P(A|E) and P(A|not-E). This seems to imply rationality imposes no constraints, which is bollocks. 

  Hmm. Let me check where the reasoning goes wrong. Step (6) and (7) are suspicious. The user's mate assumes your new P(E) is "whatever you find yourself with" and that "nothing pins it down". But that's not quite right. Jeffrey conditionalization doesn't operate in a vacuum—it's a rule for how your beliefs *should* evolve given new input from experience. The input isn't arbitrary; it's constrained by the perceptual experience itself. 

  For example, if you see a faint shape in the fog, your new P("it's a dog") might be 0.6, but it can't be 0.99 or 0.01 without violating the experience. So step (6) is rotten because it ignores that your new P(E) isn't a free choice—it's *responsive* to the evidence. You can't just "fancy" 0.7 if your visual input screams 0.3. 

  Step (7) compounds this error by treating the weighting as unconstrained. But rationality requires that your new credences *track* the perceptual input. If they don't, you're not updating rationally—you're just capriciously picking numbers. 

  The mate's concrete example misses this. Yes, mathematically P(A) = 0.1 + 0.8 * new_P(E), but new_P(E) must be justified by the experience. If the experience warrants new_P(E)=0.6, then P(A)=0.58 is fine. But if you force new_P(E)=0 to get P(A)=0.1 despite strong evidence for E, that's not Jeffrey—that's self-deception. 

  So the cost of cutting out step (6)? We must accept that perceptual experiences *constrain* new credences in E. This doesn't require certainty—just that experiences push probabilities in ways that aren't arbitrary. It costs us some vagueness (how *much* should an experience shift P(E)?), but that's a feature, not a bug—perception is messy. 

  What about step (8)? It collapses once (6)-(7) are fixed. Jeffrey *does* impose rules: your update must satisfy the input from experience and cohere with old conditionals. That forbids "every outcome". 

  Final thought: the mate's argument smuggles in voluntarism about belief. But credences aren't chosen—they're responses. Jeffrey doesn't permit whimsy; it demands alignment with how the world seems. The rotten step is (6), hands down. Sacrifice order: (6) first, then (7), then (8) crumbles.
answer: |-
  Right, your mate's argument is clever but deeply flawed, and the rot sets in at **step (6)**. That's the keystone holding up this bollocks conclusion. Let's carve it up step-by-step, British-style, no flannel.

  1.  **Step (1): Sound.** Agreed. Jeffrey conditionalisation *is* the standard rule for updating on uncertain evidence over a partition. Formula: `P_new(A) = ∑ [P_old(A | E_i) * P_new(E_i)]`. No quarrel there.
  2.  **Step (2): Plausible.** Perception rarely gives absolute certainty. "Seems like a dog" might leave you at P(E="It's a dog") = 0.8, not 1.0. Giving this up is a big cost – makes epistemology wildly unrealistic.
  3.  **Step (3): Follows from (1) & (2).** If perception gives uncertain evidence and (1) is the rule for that, then perception updates *use* (1). Logical.
  4.  **Step (4): Mostly Fine (but sets the trap).** For a partition {E, ~E}, `P_new(A) = [P_old(A|E) * P_new(E)] + [P_old(A|~E) * P_new(~E)]`. True. Your old conditionals are fixed by your prior. Your *new* credences for E/~E are indeed what you end up with post-experience. So far, so good.
  5.  **Step (5): Follows Mathematically.** Yes, `P_new(A)` *is* a weighted average of `P_old(A|E)` and `P_old(A|~E)`, weighted by `P_new(E)` and `P_new(~E)`. As `P_new(E)` slides from 0 to 1, `P_new(A)` slides smoothly between the two old conditionals. Algebra checks out.
  6.  **Step (6): ROTTEN TO THE CORE. Here's where it goes tits up.**  
      *   The claim: *"Nothing in the rule pins down your new confidence in E. It's whatever you find yourself with."*
      *   **Why it's bollocks:** Jeffrey Conditionalisation **IS NOT A GENERATIVE MODEL FOR `P_new(E_i)`**. It doesn't *tell you* what `P_new(E)` should be. **It takes `P_new(E)` as its INPUT.** The rule tells you how to update *everything else* (like `P_new(A)`) *given* that you've somehow arrived at new credences for the partition elements `{E_i}`.
      *   **The Input Isn't Arbitrary:** Your perceptual experience **constrains** what `P_new(E)` can reasonably be. If you have a clear, unambiguous experience as of E, `P_new(E)` *should* be high (e.g., 0.95). If it's faint and ambiguous, `P_new(E)` might be middling (e.g., 0.6). If it looks like utter shite, `P_new(E)` might be low. **Rationality demands that `P_new(E)` RESPONDS APPROPRIATELY to the perceptual input.** You don't just "find yourself with" any old credence willy-nilly.
      *   **The Analogy:** Imagine the rule says "If you decide to buy X number of apples, your total cost is price-per-apple times X". Does this rule "let" you buy any number of apples? Mathematically, yes. But rationality doesn't come from the multiplication rule! It comes from *why you chose X*. You buy 10 apples because you need 10, not 100 or 1. Likewise, you set `P_new(E)=0.95` *because your bloody experience strongly suggests E is true*, not because it gets you a nice `P_new(A)`.
  7.  **Step (7): Collapses with (6).** Yes, *if* `P_new(E)` were a free parameter you could set arbitrarily *without constraint from the experience itself*, then you could land `P_new(A)` anywhere between the old conditionals. **But `P_new(E)` ISN'T a free parameter.** It's determined (or strongly constrained) by your *rational response to the perceptual evidence*. You can't just "fancy" `P_new(E)=0.7` if the experience screams E is false. Rationality dictates that `P_new(E)` tracks the force/intensity/clarity of the perceptual evidence *for E*. So, no, there isn't a "permissible update" landing on *any* `P_new(A)` you fancy. Only the `P_new(A)` that results from the `P_new(E)` mandated by the perceptual input is permissible.
  8.  **Step (8): Nonsense, based on previous errors.** Jeffrey Conditionalisation *is* a rule of rationality. It says: **IF** your perceptual experience directly induces new credences `P_new(E_i)` on partition `{E_i}`, **THEN** your new credence in any proposition A *must* be given by the weighted sum using *those specific* `P_new(E_i)` and your *old* conditionals. It **does not permit every outcome**. It forbids outcomes where `P_new(A)` isn't calculated this way *from the rationally induced* `P_new(E_i)` and the prior conditionals.

  **Where the Concrete Example Goes Wrong:**
  *   "Land on P(A)=0.5, 0.7, 0.9... just by fixing P_new(E) accordingly."
  *   **The Mistake:** You can't just "fix" `P_new(E)` like adjusting a thermostat to get the desired room temperature for `P_new(A)`. `P_new(E)` is *fixed for you* by the perceptual experience. If the experience warrants `P_new(E)=0.6`, then `P_new(A)=0.1 + 0.8*0.6 = 0.58` is the *only* rational outcome. Choosing `P_new(E)=0.875` to get `P_new(A)=0.8` **is irrational** *unless* the perceptual experience *itself* warrants `P_new(E)=0.875` (which it probably doesn't, if you're just choosing it to hit a target P(A)).

  **The Cost of Cutting Out Step (6):**
  *   **What You Sacrifice:** The comforting illusion that the *Jeffrey rule itself* tells you *everything* about rational updating. It doesn't. It only gives you the *output* (`P_new(A)`) given the *inputs* (`P_new(E_i)` and `P_old(A|E_i)`).
  *   **What You Gain (and must accept):** You **must** accept that there's an extra *rational constraint* governing how perceptual experiences translate into the **inputs** for Jeffrey conditionalisation – the new credences over the evidence partition `{E_i}`. This is the **Input Problem**.
  *   **The Cost:** This Input Problem is hard! How *exactly* should a faint visual experience translate into `P_new(E="Dog") = 0.6` vs `0.7`? The rule itself is silent on this. Philosophers (e.g., Richard Jeffrey himself, Bas van Fraassen, Kenny Easwaran, Sophie Horowitz) grapple with this. You might need supplementary principles like:
      *   **Calibration:** Your `P_new(E_i)` should reflect the reliability of your perceptual faculties in the current conditions.
      *   **Phenomenal Conservatism:** If it seems to you that E, you have *some* defeasible reason to increase P(E).
      *   **Minimal Change:** The shift from `P_old(E_i)` to `P_new(E_i)` should be the minimal change required by the experience.
  *   **The Upshot:** Jeffrey conditionalisation isn't broken. Perception is still uncertain evidence. But rationality isn't *just* JC. It's JC **plus** a rational response determining `P_new(E_i)` from the perceptual input. Step (6) ignores this crucial second part, making it look like `P_new(E_i)` is unconstrained whimsy. It isn't.

  **Sacrifice Order:**
  1.  **Step (6) - MUST GO FIRST.** This is the fatal error. Sacrificing it costs you the simplicity of thinking JC solves *everything*, but saves the core ideas of (1) JC being the update rule and (2) perception being uncertain.
  2.  **Step (7) - Falls with (6).** Without (6), (7) is unsupported bollocks.
  3.  **Step (8) - Crumbles with (6) & (7).** JC remains a valid rule of rationality.
  4.  **Everything Else (1-5) - Stand.** You keep JC and uncertain perception.

  **In short:** Your mate's argument smuggles in the idea that `P_new(E)` is a free choice. It's not. It's (rationally constrained) input *to* the rule, not output *from* it. The dodgy step is (6). Cutting it out costs you a clean, self-contained story for perceptual updating and forces you to acknowledge the Input Problem, but it saves the core framework. Tell your mate he's clever but missed the point – `P_new(E)` isn't picked by the agent to suit their fancy; it's *wrung out of them* by the bloody experience. Now go have a pint and sort it.
