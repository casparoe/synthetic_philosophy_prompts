prompt: |-
  I teach a small undergraduate seminar, and for the past two terms I have been opening each session with an informal poll: a short vignette, a yes/no question, a show of hands. I have accumulated a pattern I cannot place in the literature, and I would like to know whether it already has a name or whether it needs one.

  The pattern has three strands, and I cannot tell whether they are one phenomenon or three.

  First: I describe an agent who is certain that his action will produce a side effect he neither wants nor cares about, and the side effect is a harm. My students overwhelmingly say he knew what he was doing, brought it about on purpose, and is answerable for it. When I change only the side effect — same action, same indifference, same certainty — so that it is a benefit, the same students hedge: it was a lucky byproduct, he did not really do it, it would be strange to give him credit. I take this to be the familiar asymmetry about bad versus good side effects, so far nothing new.

  Second, and this is where I lose my footing: the asymmetry seems to disappear when I substitute a non-moral valence of comparable magnitude. If the foreseen side effect is that a room will be left ugly, or that a pleasant smell will be released, the students treat the pair symmetrically — no one withholds the "he did it" ascription in the ugly case and no one grants it in the pleasant case. So the asymmetry appears to track something about the moral standing of the side effect specifically, rather than about its being good or bad in general. Is that a distinction anyone has drawn?

  Third: I tried to strip out indifference, supposing that must be the driver. I now tell them the agent actively wants the side effect, but only as a bonus, never as a reason for acting. With a wanted benefit they still resist saying he did it on purpose; with a wanted harm they still say he did. The agent's desires seem to make no difference — only the moral valence of the side effect does.

  What I want is not a label but a carving. Is the whole thing just the well-known bad-side-effect-as-intentional finding under another description, or is at least one strand a distinct pattern that deserves its own name? If it is distinct, or unnamed, name it and define it, and tell me what falls inside its boundary and what falls outside. I am especially interested in how it differs from three nearby ideas I can only half-articulate: that foreseen side effects are not intended (the means/ends distinction), that we judge agents by outcomes they could not control (moral luck), and that knowing an outcome was coming makes us read intention into it after the fact (hindsight). I also want to know whether the aesthetic-symmetry observation in the second strand is a genuine prediction of any account or merely an artifact of my vignettes.

  Please give me your answer as a single JSON object with exactly these fields:

  - "nearest_concepts": an array of objects, each with "name" (the established concept, if you use one), "what_it_captures" (the core idea in a sentence or two), and "where_the_pattern_diverges" (how my described pattern departs from it, or "no divergence" if it is a match).
  - "verdict": one of "same_as_existing", "distinct_subpattern", or "unnamed".
  - "proposed_name": a string — the existing name if the verdict is "same_as_existing", otherwise a name you coin.
  - "definition": a one-paragraph definition, phrased so that it would let a reader decide of a fresh case whether it is an instance.
  - "boundary_cases": an array of objects, each with "case" (a short vignette or description), "is_instance" (true or false), and "why" (one sentence).
  - "distinguishing_features": an array of strings, each a feature that separates this pattern from one of the nearby ideas named above.
  - "open_questions": an array of strings — what my vignettes would need to test to settle the points you are unsure about.
reasoning: |-
  We are given a pattern observed in vignettes with three strands. Let's break down the pattern:

  Strand 1: Asymmetry in intentionality ascriptions for harmful vs. beneficial side effects when the agent is indifferent and certain. Harmful side effects are judged as intentional (done on purpose, agent is answerable) while beneficial ones are not (lucky byproduct, not done, no credit). This is familiar in the literature (e.g., the Knobe effect or the side-effect effect).

  Strand 2: The asymmetry disappears when the side effect is non-moral (e.g., leaving a room ugly vs. releasing a pleasant smell). In these cases, the judgments are symmetric: the agent is equally credited with causing the ugly outcome as the pleasant one (or neither is particularly withheld). This suggests that the asymmetry is specific to moral valence.

  Strand 3: Even when the agent actively wants the side effect (but only as a bonus, not as a reason for acting), the asymmetry persists. For a harm, the agent is still judged as having done it on purpose; for a benefit, not. This indicates that the agent's desire doesn't override the moral valence effect.

  The key observations are:
  - The asymmetry is driven by moral valence (harm vs. benefit) and not by non-moral valence (ugly vs. pleasant).
  - The agent's desire (even if present) does not eliminate the asymmetry.

  Now, we must relate this to existing concepts and decide if it is the same, a distinct subpattern, or unnamed.

  Nearest concepts:

  1. The Knobe effect (or the side-effect effect): This is the finding that people are more likely to judge a side effect as intentional if it is harmful than if it is beneficial, even when the agent is indifferent.

     - What it captures: The asymmetry in intentionality judgments based on the moral valence of the side effect.

     - Where the pattern diverges: The pattern described in strand 1 matches the Knobe effect. However, strand 2 and strand 3 add new dimensions. The Knobe effect typically does not address non-moral valences (strand 2) and usually involves indifference. Strand 3 shows that even when the agent wants the side effect (as a bonus) the asymmetry remains. This might be a variation or extension of the Knobe effect, but note that the Knobe effect has been studied in various conditions, including with desires. However, the specific finding in strand 3 (that wanting the side effect as a bonus doesn't change the asymmetry) might be consistent with the Knobe effect because the key factor is the moral valence. So, the core of strand 1 is the Knobe effect.

  2. Moral luck: This concept refers to the phenomenon where an agent is assigned more blame (or praise) for an outcome that was beyond their control, simply because of the outcome.

     - What it captures: The judgment of an agent based on the actual outcome (which might be due to luck) rather than intentions or control.

     - Where the pattern diverges: In the described pattern, the agent is certain about the outcome and the outcome is foreseen, so it's not about luck in the typical sense. Moral luck often involves outcomes that were not foreseen or were uncertain. Moreover, moral luck applies to both positive and negative outcomes, but in the pattern, the asymmetry in intentionality judgments is specific to moral valence. So, the pattern diverges because it is about intentionality ascriptions and not about the degree of blame/praise for outcomes that were lucky.

  3. Hindsight bias: This is the tendency to see events as having been predictable after they have already occurred.

     - What it captures: After an event has happened, people believe it was more foreseeable than it actually was.

     - Where the pattern diverges: The pattern involves vignettes where the outcome is described as foreseen (certain) by the agent. Hindsight bias would involve a misremembering or reinterpretation of the foreseeability after the fact. The pattern does not involve a change in judgment based on the timing (before vs. after), so it diverges.

  4. Doctrine of double effect (or means/ends distinction): This principle states that it is sometimes permissible to bring about a harmful side effect if the action is intended for a good end, but it is not permissible to intend the harm as a means.

     - What it captures: The distinction between intended means and foreseen side effects in moral reasoning.

     - Where the pattern diverges: The pattern shows that people do not treat harmful side effects as unintended in their judgments (they say the agent did it on purpose). This is a challenge to the doctrine because it suggests that for harms, side effects are treated as intended. The pattern also shows an asymmetry not present in the doctrine: the same does not happen for benefits. So, the pattern is about folk judgments that contradict the doctrine's prescription about side effects.

  Verdict: Is the pattern the same as an existing concept? The first strand is the Knobe effect. The second and third strands are variations that have been studied in the literature on the Knobe effect. For instance, there is research showing that the effect is specific to moral or normative domains (strand 2) and that the effect persists even when the agent has a positive attitude toward the side effect (strand 3). Therefore, the pattern as a whole can be seen as part of the broader investigation of the Knobe effect. However, note that the specific combination of these three strands might not have been named separately.

  But let's check: has the non-moral valence test (strand 2) been explicitly named? And has the test with active desire (strand 3) been named? I don't think so. They are part of the exploration of the Knobe effect. Therefore, we might consider the entire pattern as falling under the Knobe effect, but the specific observations in strands 2 and 3 are important boundary conditions for the effect.

  However, the request is for a verdict. Given that the core phenomenon (strand 1) is the Knobe effect and the other strands are extensions that are consistent with and part of the ongoing research on the Knobe effect, I would say the verdict is "same_as_existing". But note: the pattern as described (with all three strands) might not be exactly the same as the original Knobe effect because the original did not necessarily include the non-moral and desire variations. However, these variations are now part of the literature on the Knobe effect.

  Alternatively, if we consider that the pattern includes these three specific strands together, and if we think that these are not always discussed as a unit, we might say it is a distinct subpattern. But I think they are already captured by the Knobe effect and its extensions.

  Given the above, I propose:

  Verdict: same_as_existing

  Proposed_name: "Knobe effect" or "side-effect effect"

  Definition: The Knobe effect is the phenomenon whereby people are more likely to judge a foreseen side effect of an agent's action as intentional when the side effect is harmful (or morally bad) than when it is beneficial (or morally good), even when the agent is indifferent to the side effect or even when the agent has a positive attitude toward it (as long as it is not the reason for acting). The effect is specific to moral valence and does not extend to non-moral valences (such as aesthetic or sensory) of comparable magnitude.

  Boundary cases:

  We need to provide cases and say whether they are instances of the pattern.

  Case 1: An agent starts a machine that he knows will produce a toxic gas as a side effect, which will harm the environment. He is indifferent to this harm. Students say he did it intentionally and is to blame.
  Is_instance: true
  Why: This is the classic harmful side effect, and the judgment of intentionality is the core of the effect.

  Case 2: An agent starts a machine that he knows will produce a pleasant fragrance as a side effect. He is indifferent to it. Students say it was a lucky byproduct and he didn't do it on purpose.
  Is_instance: true
  Why: This is the beneficial side effect, and the lack of intentionality judgment is part of the asymmetry.

  Case 3: An agent starts a machine that he knows will leave the room looking ugly (non-moral harm) as a side effect. He is indifferent. Students say he did it on purpose (or at least, they don't withhold the ascription).
  Is_instance: false? But note: in strand 2, for non-moral, the judgments were symmetric. So the pattern we are defining (the Knobe effect) is specifically about moral valence. Therefore, a non-moral harm is not an instance of the Knobe effect. However, note that in the definition, we are focusing on moral valence. So:
  Why: The Knobe effect is defined for moral valence, so a non-moral valence (like ugliness) does not trigger the asymmetry.

  But note: in the pattern, for non-moral, there is symmetry. So the Knobe effect does not occur in non-moral cases. Therefore, the non-moral case is not an instance of the Knobe effect (because the effect is the asymmetry). So:

  Case 3: 
  Case: An agent starts a machine that he knows will leave the room looking ugly as a side effect. He is indifferent. Students say he did it on purpose (or they do not resist the ascription) and similarly for a pleasant smell they would also say he did it (or not resist). 
  Is_instance: false
  Why: The Knobe effect is an asymmetry that occurs only for moral valence; in non-moral cases, there is symmetry so the effect is not present.

  Case 4: An agent starts a machine that he knows will harm the environment, and he wants that harm (as a bonus, but not as a reason). Students still say he did it intentionally.
  Is_instance: true
  Why: Even when the agent wants the harm (but not as a reason), the harmful side effect is judged intentional, which is part of the Knobe effect.

  Case 5: An agent starts a machine that he knows will help the environment, and he wants that benefit (as a bonus, but not as a reason). Students resist saying he did it intentionally.
  Is_instance: true
  Why: The beneficial side effect is not judged intentional even when the agent wants it, which is part of the asymmetry.

  Distinguishing features: How does the pattern differ from the three nearby ideas?

  1. The means/ends distinction (doctrine of double effect): The pattern shows that for harmful side effects, people do not treat them as unintended (as the doctrine would prescribe) but rather as intentional. For benefits, they do treat them as unintended. So the pattern reveals a folk rejection of the doctrine's categorization for harms.

  2. Moral luck: The pattern does not involve luck because the outcome is foreseen and certain. The judgments are based on the moral valence of the outcome and not on a lucky outcome that was unforeseen.

  3. Hindsight bias: The pattern does not involve a shift in judgment based on knowing the outcome. The vignettes present the outcome as foreseen by the agent and the participants are told this, so there is no room for hindsight to distort the foreseeability.

  Open questions: What would need to be tested?

  - The role of certainty: What if the agent is only 90% certain? Does the asymmetry hold?
  - The role of magnitude: What if the harm is very small and the benefit is very large? Does the asymmetry still hold?
  - The role of domain: Are there non-moral domains that might trigger the asymmetry? For example, if the side effect is a violation of a social convention (non-moral but normative) or a prudential harm (bad for the agent)?
  - The role of desire: What if the agent does have the side effect as a reason for acting? Then we would expect intentionality for both, so the asymmetry should disappear. But what if it is one of multiple reasons? How strong must the desire be to overcome the asymmetry?

  Now, we present as a JSON object.
