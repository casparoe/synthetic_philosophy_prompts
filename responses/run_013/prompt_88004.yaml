prompt: |-
  I need help with something and it's probably going to be longer than it needs to be. I cover science and ideas for a magazine — I do a fair number of the here's-a-weird-argument-a-philosopher-told-me pieces — and a friend who teaches philosophy at a state school in Ohio walked me through this at a hotel bar after a conference and I have not been able to shake it. She's a Moore person. She thinks the two-hands thing is a real proof of an external world and that the skeptic who asks how you know you're not dreaming is just asking the same question over again in a louder voice. Fine, I'm sympathetic, I'd like her to be right. But then she said the price of that is a general principle, and that once you state the principle generally it starts handing out knowledge to anybody. I wrote the argument down on the back of a receipt, cleaned it up a bit, and now I can't tell where it goes wrong:

  (1) Moore knows he has two hands, on the basis of how things look and feel to him, and he knows it without having first ruled out that he's dreaming or a handless brain in a vat. (2) He also knows that having two hands means he isn't a handless brain in a vat. (3) So he knows he isn't a handless brain in a vat — and he didn't have to do anything to get there that a vatted version of him couldn't have done just as well. (4) So whatever makes (1) knowledge has to be a completely general fact about experience: if it looks to you as though things are some way, you're in a position to believe things are that way, even though your evidence would have been exactly the same if they weren't. Nothing about the hands can be special, or (1) isn't knowledge and the proof is dead. (5) My neighbour in 4B is convinced the people upstairs are reading his mail and putting something in his food. He has a persistent experience as of being watched and interfered with, he can't tell his situation apart from that of someone who is merely paranoid, and no test would settle it either way. (6) By (4) he's in a position to believe the people upstairs are reading his mail. (7) He obviously isn't; that's not something anyone is in a position to believe. (8) So either (4) is wrong, or (4) isn't saying the thing that separates Moore from my neighbour.

  What I want is a diagnosis, not a tour of the literature — don't bother with a reading list, I'll pull sources myself. Tell me which step to give up, why it looked fine to me when I wrote it down, and what giving it up actually costs: if it's (4), how does (1) survive; if it's (7), then what is it about the neighbour's case that I'm mis-describing; if the honest answer is that he does get some justification and the thing that's wrong is only how much, say that too, but then tell me what that does to Moore. I'd rather not loose (1) or (2), so if the cheapest exit runs through one of them, I need to know what I'm buying. And I want you to be up front about how confident you are in the step you pick: tell me what would change your mind, which case or counterargument would move you to a different step, and where your own reasoning is most likely to go off the rails — because I've been burned before by a tidy answer that turned out to rest entirely on one analogy nobody had checked.
reasoning: |-
  Okay, the user is a science and ideas journalist dealing with a philosophical puzzle from a Moorean friend. They've presented an argument that seems to undermine Moore's famous "two hands" proof by extending it to justify paranoid beliefs. They want a clear diagnosis of where the argument fails, without academic jargon, and with explicit confidence levels.

  Hmm, the core tension is between Moore's common-sense approach and radical skepticism. The user's reconstructed argument shows how accepting Moore's "proof" might force us to accept all sorts of unreasonable beliefs. Their frustration is palpable - they've clearly wrestled with this since that hotel bar conversation.

  Let me break down their argument step-by-step. The critical move is step (4) where Moore's particular hand-knowledge gets generalized into a principle about all experiences. That's where things unravel with the paranoid neighbor example. But rejecting (4) seems to threaten Moore's original argument. Tricky.

  The user's constraints are helpful: they prefer to save premises (1) and (2) if possible, and want honesty about weaknesses in any solution. They've been burned by overly neat philosophical answers before - probably referencing some prior experience with glib theorists. 

  I recall that contextualists like David Lewis address this by making knowledge dependent on conversational context. When Moore says "I have hands," the "dreaming" scenario isn't relevant, but for the neighbor, conspiracy theories are contextually salient. This preserves (1) while blocking (6). 

  But is this satisfying? The user might worry it makes knowledge too arbitrary. Still, it explains why we accept Moore's claim but not the neighbor's - in ordinary contexts, we don't seriously entertain brain-in-vat scenarios. The cost is accepting that knowledge isn't absolute but context-relative. 

  My biggest hesitation is whether this fully resolves the neighbor case. Even if we say conspiracy theories are contextually relevant, the neighbor's belief still seems unjustified. So perhaps we need to add that justification requires proper basing - the neighbor's belief isn't properly grounded even if the evidence could theoretically support it. 

  The user should know this solution isn't bulletproof. If they found a case where the skeptical alternative is contextually irrelevant but the belief still seems unjustified, that would challenge contextualism. And if they reject context-dependence entirely, we'd need a different approach. But given their desire to preserve Moore while blocking the neighbor conclusion, this seems the least costly path.
answer: |-
  Here's a step-by-step diagnosis, focusing on the argument's flaw, why it's tempting, the cost, and my confidence level:

  **The Problematic Step: (4)**  
  *"if it looks to you as though things are some way, you're in a position to believe things are that way, even though your evidence would have been exactly the same if they weren't."*

  This is an *overgeneralization* of Moore's position. Moore's argument **does not** require this principle. Step (4) misrepresents what makes (1) knowledge.

  ### Why (4) Looks Tempting
  - Moore *does* claim we can know everyday things (like having hands) without first refuting radical skepticism.  
  - It *feels* like this implies perception *always* gives direct justification, regardless of skeptical scenarios.  
  - The receipt version likely compressed nuanced distinctions into a deceptively simple principle.  

  ### Why (4) is Wrong & How (1) Survives
  Moore's point isn't that *any* seeming justifies belief. It's that **in ordinary contexts**, perceptual experiences *defeasibly* justify beliefs about the external world *without needing prior proof against skepticism*. The justification is *context-sensitive* and *defeasible*:  
  - **Context Sensitivity**: In normal life, "I see my hands" justifies "I have hands" because dreaming/BIV scenarios aren't *relevant alternatives* in that context. We don't need to rule them out to have knowledge.  
  - **Defeasibility**: If specific doubts *are* raised (e.g., "Didn't you just undergo anesthesia?"), then justification *can* be undermined, and further evidence might be needed.  

  **Moore survives because:**  
  His "proof" works *precisely because* "having hands" is a paradigmatic, everyday perceptual judgment. The skeptic’s demand to rule out BIVs *first* is rejected as illegitimate in ordinary contexts. **The "specialness" of hands isn't a flaw—it's the point.**  

  ### The Neighbor Case (5-7) Explained
  - **Why (6) is false**: The neighbor *isn't* in a position to believe his mail is being read because:  
    - **Relevant Alternatives**: Conspiracy theories *are* contextually relevant doubts here (unlike BIVs in Moore's case). We know paranoia exists, hallucinations occur, etc.  
    - **Defeaters**: Background knowledge (how mail works, improbability of the claim) defeats the justification from his "seemings."  
  - **Why (7) stands**: The neighbor lacks knowledge because his belief isn't *properly based* on evidence. His experience is better explained by paranoia (a *defeater*) than by reality.  

  ### What Giving Up (4) Costs
  - **Cost**: You accept that knowledge is **context-dependent**. Justification isn't a blanket "seeming → belief" rule. It hinges on:  
    - The *type* of belief (mundane vs. extraordinary),  
    - *Absence of defeaters* (e.g., evidence of mental illness),  
    - *Relevance of skeptical scenarios* in the context.  
  - **Benefit**: You save Moore *and* avoid justifying paranoia. The skeptic can't force us into a binary choice between radical doubt or epistemic anarchy.  

  ### Confidence & Weaknesses
  - **Confidence: 90%**  
    This is the mainstream contextualist/neo-Moorean resolution (inspired by Wittgenstein, Austin, DeRose, Lewis). It aligns with how we intuitively assign knowledge: we demand more evidence for extraordinary claims.  
  - **What Might Change My Mind**:  
    - A convincing case where *no* contextually relevant defeaters exist, yet a belief based on "seeming" is still clearly unjustified (e.g., a novel hallucination scenario with no prior cues).  
    - An argument showing contextual relevance is *itself* question-begging against skepticism.  
  - **Where My Reasoning Could Go Off the Rails**:  
    If "relevant alternatives" are *purely* subjective or socially constructed, this might feel ad hoc. The strength lies in its match with practice, but a skeptic could insist it’s epistemically arbitrary.  

  ### Why Not Reject (1), (2), or (7)?
  - **(1) & (2)**: Sacrificing these surrenders to skepticism. Moore’s intuition (that we know we have hands) is stronger than any philosophical argument denying it.  
  - **(7)**: Denying this forces absurdity—justifying clinical paranoia. Worse, it *helps* skepticism: if all seemings justify equally, *nothing* is secure.  

  **In short:** Step (4) smuggles in a faulty, hyper-simplified theory of justification. Reject it, embrace contextuality, and Moore’s hands stay real while your neighbor stays paranoid. The cost is accepting that knowledge isn’t a one-size-fits-all rule—but that’s a feature, not a bug.
