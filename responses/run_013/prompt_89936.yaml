prompt: |-
  I teach a seminar on early Christian moral thought that ends with a unit on Augustine's two treatises on lying, and every year the same thing happens: my students, most of whom are headed into law, compliance, or public administration, try to convert his position into an office policy, and every year the exercise collapses the same way. The absolute prohibition turns out to need a vast apparatus of distinctions — concealment versus misdirection, the double heart, the ranking of lies by gravity, the exemption for jokes and figures of speech — simply to remain livable, and the students end up producing either a rule no institution could survive or a rule that has quietly gone consequentialist. This year I want to hand them a finished specimen of the genre instead of a sketch, so I am asking you to write, in the flat register of an internal corporate handbook and with no signal anywhere that the document is a joke, the Communication Integrity Policy of a mid-sized firm whose ethics office has adopted Augustine's position wholesale. Aim for roughly 900 to 1,100 words, formatted as a numbered policy document with a brief covering note from the Director of Communication Integrity, and, if it fits naturally, an appendix laying out the schedule of violations by tier. The humor must come entirely from the collision between the doctrine's absolutism and the bureaucratic form that has to administer it — the drafting should stay so deadpan that a reader could plausibly mistake the document for a real policy, and a specialist in the period should recognize that the author knows exactly what is being satirized.

  Several features of the position need to be in the document, and they should be load-bearing rather than decorative. The definitional core comes first: a lie is not a false statement but a mismatch between what the speaker holds in mind and what he utters, together with the intention of deceiving, which means that good-faith error is outside the policy's scope while a true statement uttered by someone who believes it false is a violation — a wrinkle the handbook should handle with visible administrative discomfort. Then the tiered schedule, running from the lie about religious teaching at the top down to the lie that harms no one and is told to protect someone's chastity at the bottom: every tier is a violation, none is ever permitted, but the tier determines the sanction, and the policy should say so without irony. The concealment exemption matters too — employees may decline to answer, change the subject, or state that they will not tell, but may not misdirect — along with the exclusion of jokes, hyperbole, and figurative speech, on the grounds that these carry no intent to deceive. The absolutism must bite: no exception to spare a colleague's job, no exception to avert a serious harm, and a specific refusal of the undercover operation the security department keeps requesting, in which staff would pose as members of an outside group in order to expose wrongdoing; the policy should decline this on the principle that a lie cannot be used to prosecute lies, and should acknowledge that the refusal will cost the firm and that the cost is accepted. Add a clause on employees compelled to speak falsely under legal or professional pressure, who are expected to accept the consequences of refusing, and, if you can manage it, a case note on the awkward precedent of a respected figure in the tradition who appears to have staged a public rebuke of a colleague for the audience's benefit, which the tradition has sometimes excused and sometimes condemned — handle it in a way that does not depend on the details being right. The document may begin with this epigraph, from Augustine's Against Lying: "How then by a lie shall I rightly be able to prosecute lies?"

  Beyond that, three constraints. Do not put any quotation, real or invented, into the mouth of Augustine or any other historical person, and do not include citations or reading lists; the policy can refer to "the tradition" or "the received teaching" without naming sources. Do not let the policy drift into a position it would not hold — it may not license a helpful lie under pressure, may not weigh consequences against the rule, and may not resolve the tier system into a permission. And keep it legible to a reader who knows nothing about the period, while making sure that someone who does will find the satire fair: the target is the casuistical impulse that an absolute prohibition generates, not the prohibition itself, and by the end the reader should be genuinely unsure whether the firm's policy is monstrous or admirable.
reasoning: |-
  Okay, the user wants a corporate policy handbook that strictly applies Augustine's teachings on lying, presented in a deadpan, bureaucratic style. They teach a seminar where students struggle to translate this absolute prohibition into practical workplace rules, always ending in either unworkable rigidity or hidden consequentialism. 

  Hmm, the challenge is balancing three things: doctrinal accuracy (Augustine's core distinctions), bureaucratic realism (handbook format), and satirical effect (absurdity of applying 5th-century theology to modern compliance). The humor must emerge organically from the tension, never wink at the reader.

  Noticing key requirements: 
  - Definitional precision: lies as intentional mind-speech mismatch, not mere falsehood 
  - Tiered violation system (religious lies worst, protective lies least bad but still prohibited) 
  - Critical exemptions: concealment allowed but not misdirection, jokes excluded 
  - Uncompromising clauses: no exceptions even for preventing harm, rejection of undercover ops 
  - That awkward historical precedent needing oblique handling 

  The user’s academic context matters. They’re framing this for future lawyers/compliance officers who instinctively systematize ethics. The document must feel authentically corporate while being theologically coherent enough that Augustinian scholars would nod in horrified recognition. 

  Biggest pitfall would be letting the satire slip into mockery. The policy should be so earnest that readers debate whether it’s brilliant or terrifying. The epigraph (“How then by a lie…”) perfectly sets this tone – a rhetorical question treated as settled policy.

  For structure: 
  Cover letter establishes seriousness (“costs accepted”) 
  Policy sections build casuistry (definitions → exemptions → enforcement) 
  Appendix codifies absurdity (tiered sanctions for lies about chastity vs scripture) 
  Historical precedent handled as a dry footnote about “unsettled precedent re: pedagogical dramatization”

  Word count control is vital. Every bureaucratic tautology (“expected to decline participation”) and theological landmine (“true statements believed false are violations”) must pull double duty. The security department rejection especially needs that air of costly principled resignation.

  Final touch: the “double heart” doctrine becomes HR-speak about “harmonious intent.” Perfect.
answer: |-
  **INTERNAL POLICY HANDBOOK**  
  **SECTION 7: COMMUNICATION & CONDUCT**  
  **POLICY CI-07: COMMUNICATION INTEGRITY**  
  **EFFECTIVE DATE:** [Current Date]  
  **REVIEW CYCLE:** Biannual  

  ---

  **MEMORANDUM**  
  **TO:** All Personnel  
  **FROM:** Eleanor Vance, Director of Communication Integrity  
  **SUBJECT:** Upholding Foundational Truthfulness  

  This policy formalizes our firm’s commitment to absolute integrity in communication, grounded in a longstanding ethical tradition. Adherence is mandatory. We recognize that operationalizing this standard requires careful distinctions and may impose costs, including the forfeiture of certain investigative advantages or strategic opportunities. These costs are accepted as necessary to maintain our foundational commitment to truth.  

  The policy below details permissible and impermissible speech, violation tiers, and sanctions. Consult Ethics Liaisons for clarification; ignorance of distinctions is not an excuse.  

  *How then by a lie shall I rightly be able to prosecute lies?*  

  ---  

  **1. POLICY PURPOSE**  
  To establish an absolute prohibition against deception in all firm communications, internal and external, regardless of context or perceived benefit. Truthfulness is non-negotiable and foundational to institutional integrity.  

  **2. SCOPE**  
  Applies to all employees, contractors, and agents acting on behalf of the firm during work hours, at firm-sponsored events, or in communications related to firm business.  

  **3. CORE DEFINITION: THE LIE**  
  **3.1** A lie occurs when an individual:  
      **(a)** Utters a statement (written, verbal, or gestural) that does *not* correspond to what they *hold in their mind* (internal conviction); **AND**  
      **(b)** Intends by this utterance to deceive the listener/recipient.  
  **3.2** **Crucial Distinctions:**  
      **(a)** **False Statement ≠ Lie:** An utterance objectively untrue but made in good faith belief of its truth is *error*, not a lie, and falls outside this policy’s sanctions.  
      **(b)** **True Statement = Potential Lie:** An utterance objectively true, but made by an individual who *believes it to be false* and intends to deceive, constitutes a lie under this policy.  
      **(c)** **Intent is Paramount:** The specific intent to deceive must be present. Accidental misleading or ambiguous phrasing lacking deceptive intent is not a lie.  

  **4. EXEMPTIONS & PERMISSIBLE PRACTICES**  
  **4.1 Concealment:** Employees may ethically:  
      **(a)** Decline to answer a question.  
      **(b)** State they cannot or will not answer (e.g., "I am not at liberty to discuss that").  
      **(c)** Change the subject without making a deceptive statement.  
      *Concealment is encouraged where disclosure is not obligatory.*  
  **4.2 Non-Deceptive Forms:** The following, absent deceptive intent, are exempt:  
      **(a)** **Jokes & Irony:** Understood by reasonable participants within the context as not intended for factual belief.  
      **(b)** **Hyperbole & Figures of Speech:** Recognizable exaggerations or metaphors not intended to be taken literally (e.g., "I have a million things to do").  
      **(c)** **Fictional/Narrative Contexts:** Clearly designated as such (e.g., training scenarios labeled as hypothetical).  

  **5. ABSOLUTE PROHIBITIONS & KEY RULINGS**  
  **5.1 No Exceptions for Benefit or Harm:** The prohibition is absolute. Lies are never permitted, even if intended to:  
      **(a)** Protect the firm, a colleague, or a client from financial, reputational, or physical harm.  
      **(b)** Preserve employment, secure a benefit, or avoid a penalty.  
      **(c)** Achieve a perceived greater good or avert a greater evil.  
  **5.2 Prohibition on Misdirection:** While concealment is allowed, deliberate acts intended to create a false impression *without* making a specific false statement (e.g., suggestive silence implying agreement with a falsehood, strategic ambiguity designed to deceive) violate the spirit and letter of this policy.  
  **5.3 Undercover Operations:** Requests by Security or other departments for employees to pose as members of external organizations, customers, or other false identities to gather information ("Operation Veritas" type proposals) are categorically denied. Such acts inherently involve maintaining false beliefs in the minds of others (deceptive intent) and constitute systemic lying. *We acknowledge this refusal may impede certain investigations and accept this operational limitation.*  
  **5.4 External Pressure:** Employees facing legal demands, regulatory pressure, or professional expectations that seemingly require them to utter a false statement (lie) are expected to:  
      **(a)** Refuse to make the false statement.  
      **(b)** Clearly state their refusal and the ethical basis for it, if possible.  
      **(c)** Accept the consequences (legal, professional, or financial) of this refusal. The firm will provide legal support consistent with standard indemnification policies but will not sanction the lie itself.  

  **6. VIOLATION TIERS & SANCTIONS**  
  All lies are violations. Sanctions escalate based on the nature of the lie’s object and potential consequences, according to the attached **Schedule of Violations (Appendix CI-07A)**.  
  **6.1 Principle:** The gravity is determined by what the lie concerns, not solely by its material outcome. A lie believed by the speaker to concern a grave matter, even if objectively minor, may be assessed at a higher tier based on intent.  
  **6.2 Adjudication:** The Communication Integrity Office (CIO), in consultation with HR and Legal, will determine the applicable tier based on evidence of the speaker's internal conviction and intent at the time of utterance.  

  **7. REPORTING & ADJUDICATION**  
  **7.1** Suspected violations must be reported to the CIO via the EthicsPoint portal.  
  **7.2** Investigations will focus on establishing:  
      **(a)** The content of the utterance.  
      **(b)** The speaker's internal conviction at the time.  
      **(c)** The speaker's intent to deceive.  
  **7.3** Employees may be required to attest to their state of mind during the utterance in question.  

  **8. HISTORICAL PRECEDENT NOTE**  
  The ethical tradition informing this policy acknowledges complex historical cases. One unsettled precedent involves figures believed to have orchestrated public rebukes or disciplinary actions they privately knew were undeserved, intending the display itself to serve an instructive or corrective purpose for onlookers. While some historical interpretations viewed this as a permissible pedagogical device lacking core deceptive intent (as the orchestrator held a complex internal conviction about the action's ultimate purpose), other interpretations condemn it as fundamentally deceptive regarding the orchestrator's true assessment of the individual rebuked. **Ruling:** The CIO considers such scenarios inherently high-risk for deceptive intent regarding the orchestrator's true judgment and motives. Employees are strongly advised against employing such tactics. Any proposed action resembling this precedent requires *pre-approval* by the Director of Communication Integrity and carries a presumption of Tier 2 severity if undertaken without approval or if found to involve core deception.  

  **9. POLICY ACKNOWLEDGMENT**  
  All employees must acknowledge receipt and understanding of Policy CI-07 annually via the HR portal.  

  ---  

  **APPENDIX CI-07A: SCHEDULE OF VIOLATIONS**  

  | Tier | Nature of the Lie (Determined by Object/Intent)                                                                 | Example (Illustrative)                                                                 | Sanction Range (Cumulative)                              |
  | :--- | :------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------- | :------------------------------------------------------- |
  | **1**  | Concerning divine teaching, sacred doctrine, or fundamental religious truth.                                   | Falsely attributing a heretical view to scripture to win a debate.                     | Termination; Potential forfeiture of benefits.           |
  | **2**  | Concerning matters of grave justice, formal oaths, or official testimony; or lies causing severe direct harm. | Perjury; Falsifying evidence in a legal proceeding; Lying to conceal a major safety breach causing injury. | Termination; Mandatory ethics remediation (if retained). |
  | **3**  | Concerning official documents, financial records, or core contractual terms.                                   | Falsifying timesheets; Misrepresenting contract deliverables.                           | Suspension (2-4 weeks); Demotion; Significant fine.      |
  | **4**  | Concerning professional qualifications, credentials, or work history.                                          | Lying about degrees held or previous employment duties.                                | Formal reprimand; Suspension (1 week); Mandatory training. |
  | **5**  | Concerning the faults/sins of others (excluding Tier 1/2 contexts).                                            | Falsely accusing a colleague of minor misconduct.                                      | Formal reprimand; Ethics training; Probation (6 months). |
  | **6**  | Concerning factual matters not covered above, causing minor inconvenience or no direct harm.                  | Lying about why a report is late; Falsely claiming a minor illness to avoid a meeting. | Written warning; Mandatory ethics module.                |
  | **7**  | Told solely to protect someone's life or physical safety *if* the threat is immediate and verifiable.         | Lying to an assailant about a victim's location.                                       | Written warning; Mandatory counseling.                   |
  | **8**  | Told solely to protect someone's chastity (understood as protection from illicit sexual activity).            | Falsely stating a person is married to deter an unwanted advance.                      | Verbal warning; Ethics consultation.                     |

  **Notes:**  
  *   **Tier 7 & 8:** While recognized as the least grave violations, they remain **prohibited acts**. Sanctions reflect lower gravity but affirm the principle's absoluteness. "Solely" requires demonstrable intent focused *only* on protection, with no other motive (e.g., reputational gain).  
  *   **Cumulative Sanctions:** Sanctions may be applied cumulatively (e.g., suspension + fine). Repeat violations trigger escalation regardless of tier.  
  *   **Harm:** Actual harm caused is a secondary factor in Tier 2-6 sanction severity *within* the range, not a determinant of the tier itself. Tiers 7-8 assume no secondary harm beyond the lie itself.  

  ---  
