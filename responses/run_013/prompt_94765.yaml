  For the analysis, I'll explain that guilt tracks the external harm (patient's suffering), leading to direct repair. Shame tracks internal inadequacy (being an unsafe doctor), driving identity-level change. The winning feature is shame's holistic self-assessment, which addresses root causes. In terms of repair, guilt aims at the victim, shame at the self. If targets were swapped, guilt might become self-punitive and unhelpful, while shame turned outward could be aggressive—so the original setup is crucial.

