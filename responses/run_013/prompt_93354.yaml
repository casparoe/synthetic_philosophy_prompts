  Okay, let me start by unpacking this user's query. They've been engaging with rationalist blogs and welfare economics, and a friend presented a formal argument challenging the coherence of interpersonal welfare comparisons. The user is struggling to refute it and wants a thorough diagnosis. 

  First, I need to parse the argument's structure. It has six steps, each building on the previous. Premise 1 seems straightforward—defining "better off" as greater welfare. Premise 2 ties inequality to a common scale with shared unit and zero. Premise 3 makes scale existence an empirical issue. Premise 4 claims all measurable data is person-specific, lacking cross-person calibration. This leads to Step 5 denying factual basis for comparisons, and Step 6 dismissing welfare-based policies. 

  The user's attachment to Premises 1 and 2 is notable. They're open to rejecting 6 but want to avoid an easy out. Their hidden worry about temporal self-comparisons is smart—if the argument undermines interpersonal comparisons, why not intrapersonal ones too? 

  Hmm... where to start dissecting? The weakest link feels like Premise 2. Its demand for cardinal scales with fixed zeros is excessive. In economics, ordinal comparisons often suffice, and even cardinal approaches (like von Neumann-Morgenstern) don't require absolute zeros. But I should check if other premises crumble too. Premise 4’s empiricism might ignore normative calibration—what if we define units via ethical axioms? And Premise 3’s "world supplies scales" stance overlooks constructivist approaches where scales are modeling choices. 

  Ah, the user also wants consensus markers. That's crucial. The non-falsifiability of interpersonal comparisons is indeed a standard critique (Robbins, Arrow), but positions vary: some economists accept ordinal comparability (Harsanyi), while philosophers defend cardinal versions (Sen's capabilities). The zero-point debate is more niche—most utilitarians use arbitrary zeros. 

  For temporal comparisons, the argument would extend if Premise 4 holds, but we resist that because psychological continuity provides a natural "ruler" within individuals. That’s a substantive difference the argument blurs. 

  Ultimately, Premise 2’s strictness is the overreach. Abandoning it lets welfare comparisons survive as ordinal or cardinally comparable without absolute units. The cost? We lose precision in policy trade-offs—but that’s where democratic or ethical deliberation fills gaps. 

  ...Better structure this as: validity first, then premise-by-premise triage, consensus markers, and temporal implications. The user values rigor, so citations (Robbins, Sen) will help. And I must flag where positions are contested versus settled—no pretending the measurement debate is resolved.
answer: |-
  Here's a clear-eyed diagnosis of your friend's argument, separating validity, premise costs, consensus views, and implications. The argument is formally **valid** but unsound – its conclusion follows logically from the premises, but at least one premise is likely false. The critical slippage occurs in **Premise 2**, which imposes an unrealistically strong requirement for comparison. Here's the breakdown:

  ### Step-by-Step Diagnosis
  1.  **Premise 1 (Defining "Better Off"):** *Generally uncontroversial.* Defining "A is better off than B" as "A's welfare is greater than B's" is standard in welfare economics and philosophy. This premise is widely accepted.
  2.  **Premise 2 (Common Scale Requirement):** **Contested & Likely False.** This is the argument's core vulnerability. It demands *cardinal measurability with a fixed unit and fixed absolute zero point* for interpersonal comparisons. This is far stronger than what's necessary.
      *   **Why it looks innocent:** It seems intuitive from basic math (comparing lengths requires the same ruler). Your friend's formalism likely sees cardinal structure as essential for "greater than" to have numerical meaning.
      *   **Why it's problematic:** Welfare comparisons can be meaningful under weaker conditions:
          *   **Ordinal Level Comparability:** We only need a common *ordering*. If we can coherently say "A's state X is better for A than state Y is for A" and "B's state P is better for B than state Q is for B," and we have a basis to *rank* A's welfare levels relative to B's *without* precise numerical differences or an absolute zero, we can say "A in X is better off than B in Q". This doesn't require a *unit* or *absolute zero*, just a shared *ordering* of welfare levels across persons. (Key distinction: **measurability vs. comparability**).
          *   **Cardinal Comparability without Absolute Zero:** Even if we need *some* notion of intensity (cardinality) for aggregation (like utilitarianism), we often only require *unit comparability* (a common "welfare unit" scale) with an *arbitrary zero*. We can say "the difference in welfare for A between X and Y is greater than the difference for B between P and Q" and meaningfully add welfare *across* persons without ever defining an absolute "zero welfare" point shared across individuals.
      *   **The Bill for Abandoning (2):** You lose the idea that welfare comparisons require the same type of precise, absolute measurement as physical quantities like length or mass. You must accept that welfare comparisons are inherently less precise, potentially ordinal, or reliant on weaker cardinal structures (common units but arbitrary zeros). This makes precise interpersonal trade-offs (e.g., "how much loss for A justifies a gain for B?") harder to quantify absolutely, but *not* impossible to make qualitatively or within a defined framework.
  3.  **Premise 3 (Empirical Question):** **Contested.** This is a meta-philosophical stance (empiricism/realism about scales). Many agree scales depend partly on the world (e.g., neuro-correlates constrain possibilities). However, others argue scales can be *constructed* normatively (e.g., Harsanyi's impartial observer) or defined by convention (e.g., money as a proxy), even if not directly "supplied" by raw measurement practices. The premise leans towards strict empiricism about welfare scales.
  4.  **Premise 4 (No Empirical Cross-Person Calibration):** **Broadly Accepted (as stated), but scope contested.** As a *descriptive claim* about current *direct empirical measurement* (choices, prefs, reports, neural correlates), this is largely true. We lack a scientific method to *empirically* establish that one unit of A's "happiness" equals one unit of B's, or that A's "zero" equals B's "zero." However:
      *   **Normative Calibration:** We might *define* a common scale normatively (e.g., through an agreed-upon social welfare function or veil-of-ignorance reasoning). Premise 4 ignores this possibility.
      *   **Proxy Calibration:** We often use proxies (e.g., income, capabilities) assuming rough comparability. Premise 4 claims these proxies *inherently* lack cross-person calibration at the fundamental welfare level, which proponents of proxies might contest.
  5.  **Step 5 (No Fact of the Matter):** **Depends entirely on accepting (2), (3), & (4).** If you accept the overly strong requirement (2) and the empirical premises (3 & 4), this follows logically. Rejecting (2) blocks this step.
  6.  **Step 6 (Claims Meaningless, Policy Defended by Nothing):** **Logically follows if (5) is true.** If there's no fact about A>B, then claims based on net improvements are indeed baseless. Rejecting (5) by rejecting (2) blocks this.

  ### Consensus vs. Contested Ground
  *   **Uncontested:** Premise 1 is standard. Premise 4 is widely accepted *as a description of the limitations of direct empirical measurement of fundamental welfare*. The *difficulty* of making precise, interpersonally comparable cardinal welfare measurements is a major concern (Robbins' critique).
  *   **Contested:** The core battleground is **Premise 2** and the related implications of **Premise 3**.
      *   **Measurement vs. Comparability:** The argument conflates these. Many economists/philosophers (e.g., Amartya Sen, John Harsanyi, Kenneth Arrow in parts) argue that *comparability* (ordinal or cardinal) is distinct from and weaker than precise *measurability* with fixed units/zeros. **This distinction is crucial.** Ordinal level comparability is widely seen as a *minimum* plausible requirement for many welfare claims, even if cardinal measurement fails. Cardinal *unit* comparability (without absolute zero) is a common basis for utilitarianism.
      *   **Normative vs. Empirical:** The argument assumes scales must be empirically discovered (Premise 3 & 4). Many argue they can be normatively constructed or defined by convention (e.g., using money as a proxy, assuming "basic needs" define a common zero, using a social welfare function).
      *   **Status of Comparisons:** There is **no consensus** that interpersonal welfare comparisons are *incoherent* or *entirely meaningless* (Step 5/6). The dominant view is that they are **difficult, value-laden, and lack scientific precision, but are often necessary and meaningful within normative frameworks or based on weaker comparability assumptions.** Denying *any* meaningful comparability (Robbins' strong position) is a significant minority view, often seen as leading to unacceptable policy paralysis.

  ### What Survives Without a Cardinal Metric?
  *   **Ordinal Level Comparability:** The idea that we can rank states of affairs involving different people ("A being healthy and employed is better than B being destitute and A being slightly richer") can survive. It requires only a shared *ordering* of welfare levels across persons.
  *   **Potential Pareto Improvements:** Claims that a change *could* make everyone better off (or compensate losers) without requiring interpersonal cardinal comparisons.
  *   **Dominance Principles:** If a policy makes some better off and no one worse off (according to their own ordinal scales), it's unambiguously good.
  *   **Normative Frameworks:** Theories like Rawlsian justice, capabilities approach, or contractarianism can make comparative judgments based on non-welfarist grounds or specific assumptions about comparability built into the framework.

  ### The Temporal Self-Comparison Problem (Your Key Insight)
  The argument **absolutely should extend to a single person across time if Premises 2-4 are accepted strictly.** Premise 4 states all measurement is calibrated "person by person," implying *only within a person at a single time*. Nothing in the argument distinguishes between persons and a single person at different times.

  *   **Why we resist this implication:** Our intuition that "I am better off now than I was last year" *is* meaningful. This strongly suggests Premise 2 is too demanding.
  *   **How we block it:** We typically assume **psychological continuity and a stable(ish) preference structure/personality over time** for an individual. This provides a natural "ruler" (the person's own evolving preferences or experiences) that connects welfare states across time *within* that person. We accept that my "unit" or "zero" *might* drift, but the connection is strong enough for rough comparisons to hold meaning. Crucially, **we do not demand a fixed, absolute, intertemporal zero point or perfectly constant unit over a lifetime.** We rely on weaker forms of comparability (ordinal or cardinal with self-calibration).

  ### Conclusion & Recommendation
  *   **The Fault:** Lies primarily in **Premise 2**. It demands cardinal measurability with fixed units and absolute zeros, which is unnecessary for meaningful welfare comparisons. The core slippage is failing to distinguish between *strong cardinal measurability* and the weaker notions of *ordinal* or *cardinal unit comparability* that are sufficient for many welfare claims.
  *   **Least Costly Premise to Abandon:** **Premise 2.** While abandoning it means accepting less precise forms of comparison (ordinal or cardinal without absolute zeros), it preserves the core meaningfulness of welfare comparisons for individuals over time and many interpersonal comparisons. Abandoning Premise 1 severs the link to welfare entirely. Abandoning Premise 6 without rejecting earlier steps invalidates logic. Abandoning Premise 4 requires proving empirical cross-person calibration, which seems unlikely. Premise 3's strict empiricism is costly but not as central as Premise 2's overreach.
  *   **The Bill for Abandoning Premise 2:** You must accept that interpersonal welfare comparisons are:
      *   **Inherently Imprecise:** They lack the rigor of physical measurements.
      *   **Value-Laden/Normative:** They often rely on ethical assumptions about fairness, the basis of comparability (e.g., capabilities, resources, preferences), or constructed scales.
      *   **Contextual:** Their validity depends on the chosen normative framework and the type of comparison (ordinal vs. cardinal trade-offs).
      *   **Potentially Limited:** Precise quantification of trade-offs ("how much of A's loss equals B's gain?") remains highly challenging without strong, contestable assumptions.

  The argument successfully highlights the **genuine difficulty and non-empirical nature** of precise interpersonal cardinal welfare comparisons, but it fails to prove their *incoherence* by setting the bar for meaningful comparison unrealistically high (Premise 2). Meaningful welfare economics survives, albeit with inherent limitations and reliance on normative foundations weaker than empirical proof.
