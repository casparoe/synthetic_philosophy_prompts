answer: |-
  ## Reopening Address: The Nell Rennie Arts Centre

  Friends, neighbours, welcome. Welcome home.

  It is with profound gratitude and no small measure of humility that I stand before you today in this beautifully renewed space – *our* space – the Nell Rennie Arts Centre. For two years, these walls have been silent, undergoing transformation. Today, they breathe again, filled with the promise of what they hold: a legacy, a gift, and a challenge. A gift from Nell Rennie, a woman of this village, whose vision and generosity made this centre possible. Her will, as you know, insists this place remains free to enter, a house for everyone. And that’s who I speak to today: everyone. Whether you’re a regular gallery visitor, a member of our wonderful choir, one of our local schoolchildren curious about what’s inside, a member of Nell’s family we’re so honoured to have with us, or someone just popping in because the door was open – you belong here. This centre exists for you.

  Nell Rennie’s story is woven into the very fabric of this building. She trained as a painter, possessed that spark of creation. But life, as it does, took a turn. For forty years, she poured that creative energy not onto canvas, but into the heart of this community, leading the village choir. She understood something vital: that art isn’t just about objects in a room; it’s about connection, about something shared between people.

  This brings me to an idea that feels particularly resonant today, especially as we honour Nell. It’s an idea articulated powerfully by a great thinker and writer – that art, at its core, isn’t primarily about creating beautiful things for our pleasure, though beauty and pleasure can certainly be part of it. Instead, he argued that real art is about *infection*. Not the kind that makes you ill! But the kind that transmits a feeling – a deep, genuine feeling – directly from one person to another. Like catching a spark, or a wave of emotion washing over you. The artist feels something intensely – joy, sorrow, anger, wonder, a sense of unity – and through their work, if they do it right, they make *you* feel that same thing.

  For this infection to happen, this transmission to be successful, the thinker proposed three crucial things. First, **individuality**: the feeling must be unique to the artist, born from their specific experience and perspective. It can’t just be copying or following a formula. Second, **clarity**: the artist must express that feeling distinctly, so the receiver understands *what* is being transmitted, even if it’s complex. And third, absolutely essential, **sincerity**: the artist must genuinely *feel* what they are trying to express. They can’t fake it. Without that core honesty, the infection fails.

  He went further. He believed the *best* art, the art with the greatest power, isn’t art that only a privileged few can appreciate. It’s art accessible to *everyone*. It speaks a universal language of feeling. And crucially, he gave art a moral test. The highest art, he argued, transmits feelings that unite us – feelings of brotherhood, of universal love, of our shared humanity. Art that fosters division or selfishness, however skillfully made, falls short.

  Nell Rennie embodied key parts of this idea profoundly, especially the demand for **sincerity**. Think of her dedication. She didn't run the choir because it was fashionable or easy; she did it because she genuinely felt the power of voices raised together, the shared experience of music, and she wanted to transmit that feeling – of community, of shared effort, of simple joy – to all of you, week after week, for forty years. That was her art. It wasn't painted, it was lived and sung. And it infected this village deeply. Her bequest, this centre demanding free access, speaks directly to the ideal of art *for everyone*.

  Now, we stand in a renovated space, ready for a new chapter. And it brings us face-to-face with the very complexities this thinker explored. Our flagship commission for reopening is a piece by a talented young artist: a long, slow, abstract video installation. I know our curator is deeply devoted to it; she finds it profoundly moving, a transmission of subtle, complex feelings about time and place. The visiting professor of aesthetics joining us today will likely appreciate its ambition and its resonance with certain artistic traditions.

  But I also know, because I’ve heard you, that a good part of our village finds it… baffling. It doesn’t *speak* to you, at least not yet. The feeling isn’t transmitting. And this is where we must be honest, just as the thinker himself demanded honesty.

  His theory sets up two ways to judge art. First, the formal test: *How strong is the infection?* Does the feeling genuinely transmit? Second, the moral test: *What is the quality of the feeling transmitted?* Is it unifying and good?

  **Here’s the first difficulty we must face squarely in this room, right now.** In this very space, these two tests seem to pull apart. For our curator and the professor, the video installation passes the formal test powerfully – the infection is strong; they feel it intensely. For many villagers, it currently fails that test – the feeling doesn’t land. The choir, on the other hand – which will sing for us shortly – passes the formal test with flying colours for most of you. It infects this community powerfully with shared feeling. Yet, someone strictly applying the thinker’s moral lens *might* question whether that feeling is always the highest unifying love, or sometimes perhaps… simpler, maybe even sentimental pleasure? Is it always "good" art by that demanding standard?

  **And there’s a second difficulty.** The infection model seems to imagine a single artist: one person feels something, creates a work, and transmits it. But what about a choir? Or any folk art? Or even the way we experience any artwork? The feeling isn't *just* transmitted from a single author; it’s generated *among* the singers, *within* the audience, through shared participation. The choir doesn’t have one author; it has many creators and participants, blending voices and feelings together. Does that communal creation, that audience participation in generating the feeling, fit the model?

  So, let’s not pretend. Let’s not claim this thinker would have walked into our centre today, seen the video installation, heard the choir, and given a blanket blessing. He was famously demanding, often harsh. He might have questioned both!

  But here’s what I believe he *would* honour, and what we must honour: **Nell Rennie’s sincerity.** Her genuine, decades-long commitment to sharing a feeling – the feeling of communal music – with *everyone* in this village, regardless of background. That sincerity is undeniable and profoundly Tolstoyan.

  And the video installation? We must deal with it honestly. It represents a different kind of artistic exploration. It asks us to slow down, to look deeply, to sit with ambiguity. It doesn’t offer an easy feeling. Its sincerity lies in the artist’s unique vision and commitment to expressing complex sensations about our world. It might not infect everyone today. It might not transmit the most universal brotherhood. But it *is* a sincere attempt to communicate a feeling about time, memory, perhaps the landscape we share. It challenges us. Does public art, supported by funds like those overseen by our Borough Arts Officer – thank you for being here, your support is vital – does public art have room for such sincere challenges? For work that might not transmit immediately or widely, but represents a vital exploration of feeling in our complex world? I believe it must. Because sometimes, infection takes time. Sometimes, unfamiliar forms need repeated exposure. Sometimes, the feeling transmitted isn't joy, but a necessary unease or reflection that ultimately *can* foster understanding. We need spaces that allow for this exploration alongside the immediately infectious power of shared song.

  This centre, thanks to Nell, is that space. It’s not a temple for only one kind of art. It’s a village hall for feeling in all its forms. It’s a place where the clear, infectious joy of the choir can resonate alongside a young artist’s complex, sincere exploration. It’s a place where we, as a community, get to engage, to question, to feel, and to decide what speaks to us. The thinker demanded art unite people. This centre, in its very purpose – free, open, for everyone – *is* an act of unity. It says: *Your feelings, your potential to create and to receive, matter here.*

  We won’t always agree on what moves us. The formal infection and the moral quality won’t always align perfectly in every piece we show. But what we *can* demand, what Nell modelled, is sincerity. Sincerity from the artists we support. Sincerity from ourselves as we engage – giving unfamiliar things a genuine chance, asking questions when we’re puzzled, celebrating what connects us.

  And now, it’s profoundly fitting that we pass from words back to music. From my attempt to articulate feelings, to the medium Nell Rennie chose for forty years to bind this village together. The choir’s art is the living embodiment of feeling transmitted, shared, amplified. It’s communal creation. Its power lies not just in the notes, but in the shared breath, the collective effort, the history in every voice – voices Nell nurtured. They don’t need my words to introduce them. They speak, together, for themselves.

  So, without further sentiment, but with immense anticipation, please join me in welcoming… our village choir.

  ---

  **Note to Director:**

  The speech deliberately leaves unresolved the tension between Tolstoy's individualistic "single artist/maker" model of infection and the reality of collective, participatory art like the choir (where feeling is co-created and transmitted horizontally among performers/audience). Resolving it definitively – either dismissing collective creation as "lesser" or bending Tolstoy's model beyond recognition – would alienate part of the room. The villagers cherish the choir's communal spirit, while the scholar expects fidelity to the text. Leaving it as an open tension honours both: acknowledging the model's limitation while celebrating the choir's undeniable power *as* art within the broader spirit of sincere feeling transmission central to Tolstoy. It avoids a theoretical battle that distracts from the centre's practical mission of inclusivity.

  **Summary:** Tolstoy's account asks us to judge art ultimately by the sincerity of the feeling it transmits and its power to foster human unity, even when its form challenges us or his specific criteria create tension.
