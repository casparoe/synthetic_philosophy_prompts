  ## The Debate in Your Terms

  - The leveling-down objection: 
        In the objectives you naturally use (free energies, etc.), they are monotonic in each u_i. Therefore, reducing one person's utility without helping anyone else will always reduce the objective. So the leveling-down objection does not apply to these objectives. 

        But the objection is aimed at egalitarianism, which we represented with an objective that may not be monotonic. So the objection is valid against that representation. 

        In your framework, the leveling-down objection is a sanity check: the objective should be monotonic in each coordinate. If it isn't, then it fails that check. 

        So the objection is not empty: it reveals that the egalitarian objective (as represented) is not monotonic. And your framework (and prioritarianism) avoids it by construction.

  - Does the free-energy framing make the disagreement look less substantive?
        In the prioritarian objective we wrote, the parameter η controls the degree of concavity. So the debate between a utilitarian and a prioritarian is about the value of η. 

        In physics, the temperature is a physical property of the system, not a free parameter to choose arbitrarily. But in ethics, we are choosing an objective function. So the choice of η is a normative question: how much should we weight the well-being of the worse off? 

        The free-energy framing shows that the difference is one of degree (how concave?) rather than kind. But the philosophical debate is about the justification for the concavity. 

        Three justifications:
          a) Diminishing marginal utility of well-being: an extra unit of well-being matters less to someone who is already well off. This is a psychological claim.
          b) Priority to the worse off: we have a moral reason to give priority to those who are badly off, regardless of whether there are diminishing returns for them. 
          c) Dislike of inequality: but note, prioritarianism does not directly care about gaps, only about the levels.

        Your framing does not hide the justification; it just provides a common mathematical structure. But the debate about why we should use a particular η is still there.

  - The arbitrariness objection to prioritarianism:
        The objection: prioritarianism either collapses back into utilitarianism (if η=0) or it smuggles in egalitarianism (because it values transfers from the rich to the poor). 

        In your framework: 
          - It doesn't collapse into egalitarianism because it does not care about gaps per se. It cares about the levels. 
          - It is not arbitrary because η is a parameter that can be set based on ethical reasoning. 

        But the objection might be that there's no principled way to set η. That's a challenge for prioritarianism: to justify a particular degree of concavity. 

        In physics, the temperature is measured. In ethics, we don't have a measurement. So the arbitrariness remains.

  ## Residue Report

  1. Leveling-down objection:
        - Survives cleanly: It is a test for monotonicity. In your framework, any non-monotonic objective fails. The egalitarian objective we represented fails, while prioritarianism and utilitarianism pass.
        - What is lost: The objection is often stated in terms of the Pareto principle (if one state is better for at least one person and worse for none, then it is better). But in your framework, you require the objective to be increasing in each u_i, which is even stronger than Pareto (because Pareto only requires that if you make one person better off and no one worse off, then the state is better). So the objection is well captured.

  2. Free-energy framing and the substantive disagreement:
        - The framing makes the disagreement look like a choice of temperature. This is a continuous parameter, so it is a matter of degree. But the philosophical debate might be about the reason for the concavity, not just the degree. 
        - However, the framing does not hide the reason. You can still ask: why should we have η>0? 
        - What might be hidden: the objection that prioritarianism does not care about relative shares (gaps) might be less visible because the objective is defined on absolute levels. But that is by design: prioritarianism is not about gaps.

  3. Arbitrariness objection:
        - In your framework, prioritarianism is a one-parameter family. The objection that it is arbitrary is the challenge of setting η. 
        - The objection that it "smuggles in egalitarianism" is not valid in your framing because the objective does not depend on gaps. It depends on individual utilities in a concave way. 
        - But if someone claims that the only reason to have η>0 is to reduce inequality, then they are misunderstanding prioritarianism. The reason can be priority to the worse off or diminishing marginal utility. 

  ## Confidence and Breaking Points

  - Confidence: Medium to high on the mapping of prioritarianism to the exponential form. I am less confident on the egalitarian mapping because there are many ways to represent egalitarianism. I chose one that is common and that exhibits leveling-down. But some egalitarians might object and say they don't endorse such an objective. 

  - What would break the translation? 
        - If prioritarianism is not just about a concave transformation, but has additional structure (e.g., it might be defined in a way that is not separable across individuals), then the mapping would fail. But I think it is usually defined as separable.
        - If the leveling-down objection is not captured by non-monotonicity, then we missed something. But I think it is.

  - What would change my mind? 
        - If you tell me that in the physics framework, the free energy is always monotonic in the energies, then the leveling-down objection couldn't arise. That matches.
        - If you find that the exponential form for prioritarianism does not capture the priority to the worse off in the way philosophers discuss, then we might need to adjust. For example, if they have a specific functional form in mind (like the power function), then we might use that instead. But the exponential form has the same qualitative behavior.

  ## Final Objectives

  - Utilitarianism: 
          U(u) = \sum_i u_i

  - Egalitarianism (one representation that is vulnerable to leveling-down):
          E(u) = \sum_i u_i - \lambda \cdot \text{var}(u)
       or 
