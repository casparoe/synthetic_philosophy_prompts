          E(2,2) = -0 = 0
          E(9,2) = -24.5
          So 0 > -24.5 -> (2,2) is better.

     This is the leveling-down objection: we have made the better-off person worse off without helping the worse-off person, and we have made the total utility lower, but the egalitarian objective improves.

