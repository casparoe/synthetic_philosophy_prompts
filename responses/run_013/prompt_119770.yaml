     Is that better than (9,2) by egalitarianism? It's more equal, but everyone is worse off? The leveling-down objection says that egalitarianism would prefer (2,2) to (9,2) because it is more equal, even though no one is better off and at least one is worse off.

     So we need an objective that is increasing in equality but not necessarily in the individual utilities? That breaks monotonicity. 

     Alternatively, we can think of the egalitarian objective as a function that depends on the vector of utilities and is increasing in equality and also increasing in the level? But then we have to trade off. The example given doesn't trade off: it strictly prefers (5,5) over (9,2) without any compensating increase in total. So the example suggests a form that is independent of the total? 

