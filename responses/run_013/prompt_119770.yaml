          P(u) = \sum_i \frac{u_i^{1-\eta}}{1-\eta}   for \eta>0, \eta \neq 1
          and for \eta=1, it becomes \sum_i \log u_i.

       The exponential form is more directly analogous to a free energy in some contexts, but the power form is also common.

       Given your background, I used the exponential because it maps to a soft minimum and has a clear temperature analog (η is like 1/T). 

  But note: in the power form, there isn't an obvious temperature parameter? 

