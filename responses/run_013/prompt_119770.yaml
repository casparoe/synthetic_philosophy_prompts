prompt: |-
  Just got back from a two-hour argument with my friend Dan and I want the whole thing rebuilt in the language I actually think in, because I have a feeling half of it was us talking past each other.

  Quick context so you pitch it right: I do variational inference and a lot of Bayesian deep learning for a living, so my home vocabulary is free energies, partition functions, temperatures, log-sum-exp, tempered objectives, KL penalties, that kind of thing. I'm fluent in that. I am not fluent in ethics. I know roughly what utilitarianism is, I have heard the word prioritarian, and thats about where it ends.

  Here's the disagreement as best I can reconstruct it. The utilitarian-ish view: add up everyones well-being and take the biggest total. The egalitarian view: inequality is bad in itself, so a world where everyone sits at 5 beats a world where some sit at 9 and some sit at 2, even though nobody in the first world is better off than their counterpart. Dan says that second move is indefensible, because it means you should flatten things even when the flattening helps nobody, and he called that the leveling-down objection. He says the fix is prioritarianism, which is not the claim that equality is good but the claim that a gain matters more the worse off the person receiving it is. So it's not the gap that's bad, it's that a person near the bottom counts for more per unit of well-being. He says that view can never prefer a state where everyone is worse off, so it survives the objection that kills egalitarianism.

  What I want: take that whole package, utilitarianism, egalitarianism, prioritarianism, the leveling-down objection, and redo it as faithfully as you can in my vocabulary. Concretely, what is each of those three views as an objective I could actually write down and optimize, in terms of free energies and partition functions and temperatures? Don't wave at the analogy, write the objectives and say which knob is which. And I have a suspicion you should either confirm or kill: that a prioritarian objective is basically the free energy of the vector of individual well-beings, that the concavity in the weighting is basically a temperature, and that the low-temperature limit gives you the Rawls maximize-the-worst-off thing while the high-temperature limit gives you plain utilitarianism. If that's right, tell me what it makes the debate look like from where I sit.

  Then the part I actually care about, the residue report. What survives the translation cleanly, what survives only if you fudge it, and what has no counterpart in my vocabulary at all. And for each piece of residue, is that my framework missing something, or the philosophers' claim being less clear than it sounded. Three things I want you to hit explicitly:

  - The leveling-down objection. Every objective I write down is monotone in each coordinate, so helping someone never hurts, and the objection looks like something that can't even be stated as an objective over well-beings. So is it empty, or is it about something my vocabulary has no slot for, like equality being valued in itself rather than as a feature of a distribution?
  - Whether the free-energy framing makes the disagreement look less substantive than it is. If prioritarian versus utilitarian is a choice of temperature, and in physics the temperature is something you measure rather than argue about, are the philosophers just haggling over a free parameter? Or is my framing hiding the thing they're actually fighting about, which I'd guess is the reason for the weighting: diminishing marginal value of a benefit, versus special priority for the badly off, versus simply disliking gaps?
  - Where the arbitrariness objection to prioritarianism lands in my picture. Someone told me prioritarianism either collapses back into utilitarianism or smuggles equality in through the back door, and I couldn't tell if that was a real argument or just a thing he'd read somewhere.

  And be straight with me about confidence. If the translation is doing more work than it should, say so and tell me which piece is most likely to be wrong. Also, what would change your mind: if you tell me the translation mostly works, what would have to be true on the physics side for it to break, and if you tell me it doesn't work, what would convince you otherwise?
