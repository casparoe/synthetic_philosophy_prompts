     Actually, the example given is: (5,5) is better than (9,2) because of the inequality. We can represent this by:

          E(\mathbf{u}) = - \sum_{i} (u_i - \bar{u})^2   [variance]

     Let's compute:
          For (5,5): variance = 0 -> E=0
          For (9,2): mean=5.5, variance = (9-5.5)^2 + (2-5.5)^2 = 12.25 + 12.25 = 24.5 -> E=-24.5
          So E(5,5) > E(9,2)

