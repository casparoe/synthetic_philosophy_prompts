  We are going to map the ethical frameworks to statistical mechanics concepts. Let's define:

  - Let \( \mathbf{u} = (u_1, u_2, \dots, u_N) \) be a vector of individual utilities (well-beings) for N people.
  - We are going to write down objective functions for each view.

  ## 1. Utilitarianism
     - Objective: Maximize the total sum of utilities.
     - Formula: \( U(\mathbf{u}) = \sum_{i=1}^N u_i \)

  ## 2. Egalitarianism (as described, which is outcome egalitarianism)
     - They care about equality. One common way is to use a function that penalizes inequality. However, note that the leveling-down objection points out that sometimes egalitarianism might prefer a state where everyone is worse off but equal. 
     - A typical objective might be the negative of a measure of inequality (like the Gini coefficient) plus the total utility? But note: the example given is that (5,5) is better than (9,2) even though the total of (5,5) is 10 and (9,2) is 11. So we need an objective that values equality even at the cost of total utility.
