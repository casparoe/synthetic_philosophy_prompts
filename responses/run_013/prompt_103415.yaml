prompt: |-
  I'm a software engineer with no real philosophy background, and I keep getting into this argument with a biology friend about whether DNA is actually a code. I want to settle it, so write me an essay that takes a side and defends it. The interesting version of the question, I think, isn't "is it a code, yes or no" but whether the code metaphor does real explanatory work or just smuggles in assumptions from computer science. Some things I want it to chew on: the gap between a code in the Shannon sense (basically any mapping a receiver can invert) and a code in the stronger sense where the mapping is arbitrary and conventional, like Morse or ASCII, and where exactly the codon-to-amino-acid table lands given that it's redundant (several codons per amino acid) and gets read off by molecular machinery rather than by any mind. Also whether the whole "genetic program" idea is just leftover 1950s cybernetics talk -- I've heard people say the genome is less like source code and more like a parts list, or a giant config file, or a database that only turns into instructions when the rest of the cell queries it. And the awkward cases, like the same sequence producing different things depending on context (splicing, methylation), which seems to wreck the "one code, one meaning" picture. Reach an actual verdict: is DNA a code in a sense that earns the word, or is the metaphor misleading more than it illuminates? Don't cop out with "it depends" -- if the answer is "it's a code in sense X but not sense Y," then commit to that and tell me which sense is the one actually worth caring about, and why my arguements with my friend should probably be about that instead.
