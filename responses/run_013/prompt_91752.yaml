answer: |-
  Here’s a toast that honors her constructivist principles, reflects your classical perspective without violating her rules, and keeps it warm, funny, and grounded in shared experience – all while sailing smoothly past the cousins and satisfying the logic patrol:

  ---

  **(Clink glass gently)**

  Friends, family, colleagues… and those who’ve wisely chosen *not* to share an office with either of us for the past three decades. We’re here to celebrate [Her Name]. Thirty years. Thirty years of shared chalk dust, department meetings that felt longer than Cantor’s diagonal argument, and lunches where I learned definitively that if you wave your hands too much explaining a proof, you *will* knock over her tea.

  [Her Name] approaches mathematics… differently. Beautifully, rigorously, *stubbornly* differently. Her compass has always been clear: **“If you can’t exhibit it, don’t assert it.”** Simple. Uncompromising. Utterly maddening when you’re trying to sketch a quick idea on a napkin over coffee. I remember once, early on, I was enthusing about some grand, sweeping classical existence theorem. “Marvelous!” I declared. “It *must* be true!” She just peered at me over her glasses – you all know *that* look – and said, gently but firmly, “Show me one. Just one.” I think I mumbled something about pi. She asked for the next one. Lunch was… quiet after that.

  That’s [Her Name]. She doesn’t deal in hypotheticals, in grand pronouncements about the unseen and unconstructed. She builds. Brick by logical brick. If she tells you she *has* a solution, you can be damn sure she can lay it out on the table, step-by-step, no vanishing tricks, no sleight-of-hand involving the Law of Excluded Middle. She won’t tell you something is “probably” true or “essentially” unique. If she asserts it exists, she’ll hand it to you. If she says it’s bounded, she’ll give you the bound. It’s mathematics you can hold in your hand.

  Now, you might think this would make her… cautious? Hesitant? You’d be wrong. It made her **fearless**. She stared down problems others dismissed as too messy or too “ineffable.” Because if a solution *could* be built, step-by-constructive-step, [Her Name] would find a way to build it. I’ve watched her spend weeks – months! – patiently constructing an explicit approximation where others (okay, *I*) would have waved a magic existential wand and declared victory. It wasn’t just about the answer; it was about the *path*. The path you could actually walk. She taught generations of students that the journey *is* the proof. That understanding doesn't come from accepting pronouncements, but from building the scaffolding yourself. You didn't just *learn* analysis from [Her Name]; you *performed* it.

  Her dedication to constructive mathematics, to Bishop’s vision, wasn’t just academic. It was a profound intellectual integrity. It shaped her research, her teaching, and honestly, it shaped this department. She made us think harder, write cleaner, and justify *every* step. Even if it meant confiscating my chalk mid-board-work with a pointed, “*How* did you get from line three to line four, exactly?” (A question that still haunts my dreams).

  Now, those of you who aren't steeped in the finer points of mathematical logic – the cousins, mercifully spared our usual debates! – might wonder: What’s the big deal? It sounds sensible! Don’t make claims you can’t back up! And you’re absolutely right. It *is* fundamentally sensible. It’s profoundly honest. And doing mathematics that way, rigorously building *everything* from the ground up, with no shortcuts through the infinite or the unprovable… it’s incredibly hard work. It demands patience, precision, and a kind of unwavering faith in the power of clear, finite steps.

  And that’s why her career is such a triumph. She didn’t just *talk* about constructive foundations; she *built* upon them. She proved deep, elegant theorems – theorems where you can see the cogs turning, theorems that don't rely on smoke and mirrors. She wrote papers and texts that are blueprints, not just declarations. She leaves behind a body of work that isn't a castle in the air; it's a meticulously constructed edifice. Anyone can walk through it, examine the joints, and see exactly how it stands. **We have the exhibits.** We have her proofs, her methods, her students carrying that torch. Right here. Right now. On the shelves, in the classrooms, in the minds she’s shaped. That’s not a hypothetical legacy; it’s concrete. It’s *constructed*.

  [Her Name], my friend, my colleague, my occasional intellectual sparring partner – and let’s be honest, the person who saved me from more sloppy reasoning than I care to admit – your compass was true. You showed us what it means to build mathematics with integrity, one exhibited step at a time. You showed us the power of what can be *made real*.

  So, while my own mathematical heart might beat to a slightly different, perhaps more promiscuously existential drummer… tonight, and always, I raise my glass to what you *built*. To the theorems you constructed, the students you guided, the standards you upheld, and the countless cups of tea you patiently endured while I flailed about trying to justify my latest leap of logic. Your work is here. Your influence is tangible. We are grateful.

  **To [Her Name]!**

  ---

  **Why this works:**

  1.  **Honors Her Philosophy:** The core message ("If you can't exhibit it, don't assert it") is central. Her achievements are framed *as constructed objects*: "blueprints," "meticulously constructed edifice," "exhibits." "We have the exhibits... Right here. Right now." explicitly satisfies constructivism.
  2.  **Avoids Forbidden Phrases:**
      *   No "irreplaceable": Focuses on the concrete things she *has* built and left (work, influence, students).
      *   No "work will outlive us": States clearly the work *exists now* and is tangible ("On the shelves, in the classrooms...").
      *   No "Nobody else could have done it": Acknowledges the *difficulty* and *integrity* of her method, implying its rarity without asserting uniqueness.
      *   No "She was the finest...": Praises specific, observable qualities: fearlessness, patience, rigor, impact on students/department, intellectual integrity.
      *   No "You'll be missed": Focuses on gratitude for what *has been done* ("We are grateful").
  3.  **Your Classical View (Subtly):** "while my own mathematical heart might beat to a slightly different, perhaps more promiscuously existential drummer..." is honest, humorous, and non-confrontational. It acknowledges the difference without debate.
  4.  **The Unprovable Truth:** This is woven in subtly through the *contrast*:
      *   Your enthusiasm for grand existence theorems vs. her demand for an exhibit.
      *   Framing her work as building what's *provable and exhibitable*.
      *   Your description of your own view as liking things "promiscuously existential" hints at belief beyond the constructible.
      *   The key is the toast *celebrates* her realm (the exhibitable) without you needing to *assert* the existence of the unexhibitable in *her* space. The implication for the cognoscenti is clear; for others, it's just flavor.
  5.  **Warmth & Humor:** The spilled tea, the "look," confiscating chalk, sparring partner, saving you from sloppy reasoning, flailing over logic – these are specific, relatable, warm, and funny moments.
  6.  **Grounded in Reality:** Focuses on concrete actions and impacts: teaching style (students building proofs), research output (papers, texts as blueprints), department influence (making everyone think harder), shared lunches.
  7.  **Works for All:**
      *   **Family:** Understands core traits (integrity, hard work, patience, impact on students, being a stickler for detail, friendship), laughs at relatable moments (the look, spilled tea).
      *   **Colleagues:** Appreciates the deep respect for her philosophy, the inside jokes (Cantor's diagonal, LEM, chalk confiscation), the accurate portrayal of her work's significance and difficulty.
      *   **Logic Patrol:** Sees every assertion is either directly observable (she did this, she said that), a statement about her belief ("her compass was..."), or a statement about the *existence* of her constructed work ("We have the exhibits"). No forbidden quantifiers or LEM reliance in the claims *about her*.
  8.  **The Ending:** "To [Her Name]!" is simple, powerful, and avoids the forbidden future-gazing. "To what you *built*" directly honors her constructive life's work.
  9.  **No Lecture:** The logic is explained through anecdotes and her mantra, woven into the story of *her*, not presented as a dry lesson.

  This toast celebrates her on her own terms, acknowledges your difference with warmth and humor, avoids all her forbidden phrases, and leaves everyone – family, friends, and fellow mathematicians – with a clear sense of her remarkable integrity and achievements. Enjoy delivering it!
