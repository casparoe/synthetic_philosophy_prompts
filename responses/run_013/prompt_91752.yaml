  Interesting tension—he wants to subtly assert that some truths are unprovable, which she'd reject as meaningless. Maybe illustrate through their debates? Like the time he claimed most reals are transcendental while she demanded explicit examples. Humor there: "I’d mutter about pi, she’d ask for the next one."

