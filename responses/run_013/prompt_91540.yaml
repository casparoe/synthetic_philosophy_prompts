answer: |-
  Based on the cases provided, Nadia's doctrine on "standing" revolves around the complainer's own history with the issue (fudging reports) and their accountability for it. Here's the breakdown:

  ### Nadia's Rule (Best Guess)
  **Rule:** A person has standing to complain about fudging status reports if and only if they have **never fudged a report themselves** or, if they have fudged in the past, they **fully owned up to it, stopped the behavior, and demonstrated genuine accountability**.  
  - **Why?**  
    - Tom (active fudger, no ownership) → no standing.  
    - Jen (fudged once, owned it, stopped) → standing.  
    - Marco (fudged, no ownership, minimized it) → no standing (like Tom).  
    - Omar (fudged small, no ownership) → no standing, even against a worse offender.  
    - Sam (never fudged) → standing, despite unrelated bad behavior.  

  This rule prioritizes **personal integrity regarding the specific issue** (fudging) over hypocrisy, unrelated flaws, or comparative wrongdoing.  

  ### Prediction for Kim (Your Manager)
  - **Kim’s facts:**  
    - Never fudged a report (clean record).  
    - Set unrealistic targets/reporting process that incentivizes fudging.  
    - Never pushed back on fudging.  
    - Bonus tied to inflated numbers (benefits from fudging).  
  - **Application of the rule:**  
    - Kim has **never fudged**, so she meets the first prong of the rule (like Sam).  
    - Her role in creating the system, silence on fudging, and financial incentive are **irrelevant under this rule** because:  
      - The rule focuses solely on the complainer’s *direct actions* (fudging/not fudging) and *accountability* (if they did fudge).  
      - Unrelated factors (e.g., Sam’s dickishness, Kim’s systemic complicity) don’t negate standing.  
  - **Verdict:** Kim **has standing**. Nadia would say her complaint is valid.  

  ### Kim Being Your Manager: Neutral
  - **For her:** Being your manager doesn’t inherently help or hurt her standing under the rule. Nadia’s doctrine doesn’t address hierarchy.  
  - **Against her:** If Nadia considered systemic power (e.g., "managers who enable fudging lose standing"), it might hurt Kim—but the prior cases don’t support this.  

  ### Alternative Rules That Fit the Five Cases
  1. **Rule A: "No active/persistent fudging"**  
     - Standing if: never fudged *or* fudged in the past but stopped *and* owned it.  
     - **Fits all cases:** Tom (active) → out, Jen (stopped/owned) → in, Marco (unrepentant) → out, Omar (unrepentant) → out, Sam (never) → in.  
     - **Predicts Kim:** In (never fudged).  
  2. **Rule B: "Moral authority via accountability"**  
     - Standing if: complainer has zero history of fudging *or* has redeemed themselves through public accountability.  
     - **Fits all cases:** Same as Rule A.  
     - **Predicts Kim:** In (zero history).  
  3. **Rule C: "Complicity disqualifies"**  
     - Standing if: complainer is not complicit in enabling/facilitating fudging (even if they never fudged).  
     - **Fits all cases:** Tom/Jen/Marco/Omar/Sam aren’t described as system architects, so complicity isn’t tested. Rule C doesn’t conflict with the five.  
     - **Predicts Kim:** Out (she designed the system, benefits, and enabled fudging).  

  ### Case to Settle the Rule
  **The Decider Case:**  
  - *Alex has never fudged a report but designed the reporting system that forces teams to fudge to meet targets. Alex’s bonus depends on strong numbers. When Alex complains about someone fudging, does Nadia grant standing?*  
    - **If YES:** Nadia uses **Rule A/B** (focuses only on personal fudging/accountability, ignoring systemic role).  
    - **If NO:** Nadia uses **Rule C** (complicity negates standing, even for non-fudgers).  

  ### Final Thoughts
  - **Best guess:** Nadia uses **Rule A** ("no active/persistent fudging + accountability if applicable"). Kim has standing.  
  - **Why not Rule C?** The five cases don’t test complicity, and Sam’s unrelated dishonesty didn’t affect his standing. Nadia’s doctrine seems narrowly scoped to the act of fudging itself.  
  - **Your move:** Argue that Kim’s complicity should invalidate her standing, but expect Nadia to reject this unless she expands her rule (use the "Decider Case" to probe).  

  Nadia’s calls are consistent: standing depends on your hands being clean *on the specific issue*, not your broader flaws or the offender’s scale. Kim’s hands are clean on fudging—so she’s allowed to complain.
