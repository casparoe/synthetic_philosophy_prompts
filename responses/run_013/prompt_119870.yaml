prompt: |-
  I teach a final-year seminar on perception — about a dozen students, half philosophy, half cog sci — and I've got one essay slot left on the final. It's on cognitive penetration: whether what you believe, expect or want can actually change what you see. Problem is every past paper I've set on this turned into the same essay, i.e. the modularity camp says early vision is sealed off, the anti-modularity camp says here are the effects, everyone cites the same handful of illusions and the same banana-looks-yellower study, and I learn nothing about whether the student has thought about it. So the question can't be "what is cognitive penetration" or "is vision modular". I dont want a recap of the slugfest.

  The crux I want is that three things get collapsed into one. There's an architectural claim (the mind is or isn't built so that this can happen), an evidential claim (the lab findings are or aren't really penetration, rather than attention, memory, or subjects reporting what they think you want to hear — the recent "it's all confounds" wave), and a normative claim (whether penetration would make perception better or worse as a source of justification). Most students swap one for another halfway through without noticing. I also want them to separate penetration of perceptual content — the banana literally looks yellower — from penetration of how vividly or insistently something is given, where the content is arguably the same but it's shouting at you. The literature runs those together and I want to see who can pull them apart.

  Give them a case they can't have rehearsed. Use this one, in the question: two subjects, identical retinal input, one has been told the object is a ripe avocado, the other that it's a convincing plastic one. Their discrimination performance is indistinguishable — same matching, same same/different, same thresholds — but only the first says the green "looks ripe", reports it as more saturated, more alive. Ask what would have to be true for that to count as penetration, whether the discrimination data is evidence against it or beside the point, and what, if anything, turns on the answer for whether perception can justify belief.

  Deliverables: the essay question itself (90 minutes, closed book, they can bring one page of notes); a model answer of around 700 words; and a marking scheme out of 20 built on five must-hit points. For each point, one line on how candidates typically blow it. Then a separate short list — three or four items — of moves that look sophisticated but should earn nothing, e.g. trotting out the Müller-Lyer persistence argument as if it settled anything. And I want the scheme to name, in a line each, the move that separates a first from a 2:1, because I've got a stack of B answers that are perfectly well-organised and say nothing. No reading list or citations needed anywhere, in the question or the model answer.
reasoning: |-
  Okay, let me break down this request. The professor teaches a final-year seminar on perception and needs an innovative essay question on cognitive penetration that avoids rehashing old debates. They want to push students to disentangle three aspects typically conflated: architectural, evidential and normative claims, while also separating content penetration from vividness effects.

  Hmm, the core challenge is designing a question that forces original analysis. The proposed avocado scenario seems perfect - it introduces novel stimuli (ripe vs plastic avocado) with identical discrimination performance but differing subjective reports. This creates tension between objective measures and phenomenological claims.

  For the essay question itself, I'm structuring it to explicitly demand separation of the three claims and the content/vividness distinction. The prompt should force engagement with the avocado case while prohibiting reliance on standard examples. 

  The model answer needs to demonstrate how to:
  - Treat discrimination data as evidentially relevant but not decisive 
  - Show how architectural possibility differs from empirical evidence
  - Argue why vividness changes might matter normatively even without content alteration
  - Maintain clear separation between the three claims throughout

  For the marking scheme, I'm identifying five critical points students must hit, each with common pitfalls:
  1) Recognizing discrimination data tests content but not vividness
  2) Showing evidentiary claims require ruling out non-penetration explanations
  3) Distinguishing what could be true architecturally from what is evidenced
  4) Explaining why vividness penetration might still threaten justification
  5) Maintaining clear separation between all three claims

  And for sophistication traps, I'll flag moves that seem insightful but actually derail analysis:
  - Invoking Müller-Lyer persistence as definitive proof
  - Reducing everything to attention effects
  - Claiming phenomenology is irrelevant to science
  - Asserting normative implications follow automatically from architecture

  The first-class differentiator will be whether students can construct an argument showing how the three claims interact in the avocado case without collapsing them. The B-grade essays likely articulate the distinctions but fail to demonstrate their interdependence in this specific scenario.

  This approach should meet all requirements - novel case, forced disentanglement, clear assessment criteria, and differentiation between competent and exceptional responses.
answer: |-
  ### Essay Question  
  **Time Allowed:** 90 minutes (closed book; one page of handwritten notes permitted)  
  **Word Limit:** 800–1000 words  

  > **Case:** Two observers view an object under identical lighting and retinal conditions. Observer A is told it is a ripe avocado; Observer B is told it is a convincing plastic replica. Both achieve identical performance on objective discrimination tasks (e.g., hue matching, saturation thresholds, same/different judgments). Yet Observer A reports the green as "more saturated," "richer," and "looking ripe," while Observer B describes it as "flat" or "artificial."  
  >   
  > **Question:**  
  > 1. Could this case demonstrate cognitive penetration of perception? If so, what *precisely* would have to be true about the underlying perceptual changes?  
  > 2. Does the absence of discrimination differences *undermine* the claim of cognitive penetration here, or is it irrelevant? Justify your answer.  
  > 3. What would this imply about whether perception can justify beliefs? Frame your response by *rigorously distinguishing*:  
  >     - The **architectural possibility** (could cognition affect perception structurally?),  
  >     - The **evidential status** (does this case prove it?), and  
  >     - The **normative consequence** (if penetration occurred, would it help or hinder justification?).  
  >  
  > **Constraints:** Do not discuss Müller-Lyer, bananas, or standard illusions. Focus *only* on this case and the conceptual distinctions above.  

  ---

  ### Model Answer (≈700 words)  
  This case could illustrate cognitive penetration (CP), but only if we disentangle three claims often conflated. Crucially, CP requires that cognition (e.g., beliefs about ripeness) alters perceptual *content* itself—not just post-perceptual judgments or attention. Here, identical discrimination data suggests low-level content (e.g., wavelength reflectance) is unchanged, but subjective reports imply a shift in *phenomenal character*: Observer A experiences the green as more vivid and "alive." For this to count as CP, the change must be genuinely perceptual—not a memory bias or demand characteristic (e.g., Observer A reporting "ripeness" because they think it’s expected).  

  **1. Architectural vs. Evidential Claims**  
  - *Architectural possibility*: CP could occur here if cognition modulates mid-level vision (e.g., processes shaping object semantics or salience), even if early vision (e.g., edge detection) is intact. The unchanged discrimination thresholds suggest early vision is unaffected, but architecture *could* allow higher cognition to "tune" later stages—e.g., amplifying saturation signals for meaningful objects. This is conceivable without contradiction.  
  - *Evidential status*: The discrimination data is *not* irrelevant. It constrains CP to *phenomenal vividness*, not basic content. If "saturation" is a distinct perceptual dimension (e.g., "aliveness" versus hue), CP could target it selectively. But the data *undermines* content-based CP claims (e.g., that cognition literally shifts hue). To prove vividness-CP, we must rule out confounds: e.g., that Observer A’s language reflects beliefs *about* perception, not perception itself. Without neural/behavioral markers of vividness (e.g., pupil dilation), the case is suggestive but inconclusive evidence.  

  **2. Content vs. Vividness Penetration**  
  The core ambiguity lies here. If "looking ripe" reflects a change in *content*, CP would require avocado-beliefs to alter greenness representation—but discrimination parity contradicts this. If it reflects *vividness*—a boost in salience or contrast for the *same* green—CP becomes plausible. Vividness penetrability is architecturally distinct: it may involve feedback to areas like V4 (processing color salience) without altering V1 (primary input). Normatively, this distinction is critical: if cognition only amplifies existing content, it may not "fabricate" sensory data.  

  **3. Normative Implications for Justification**  
  - *If vividness-CP occurs*: Perception’s justificatory power depends on whether penetration *enhances* or *corrupts* reliability. Ripe avocados *are* typically richer-green, so belief-driven vividness could sharpen accuracy in natural contexts (e.g., guiding foraging). Here, penetration *improves* perception as a justification source by weighting ecologically valid cues.  
  - *But*: If Observer A sees *plastic* as vivid due to false beliefs, penetration could mislead. The normative stakes thus hinge on penetrability’s *tracking truth*, not its mere existence. Crucially, discrimination parity shows content remains "objective," but vividness-CP might make errors *more compelling* (e.g., "It looks so real!"). Justification thus requires architectural independence *plus* ecological calibration.  

  **Conclusion**  
  This case cannot settle architectural debates, but it sharpens CP’s evidential burden: proving vividness-CP requires methods beyond discrimination tasks (e.g., priming or neural imaging). Normatively, penetration threatens justification only if it severs perception from worldy constraints—but here, content remains anchored while vividness flexibly tracks utility. The takeaway is that CP disputes dissolve unless we isolate architecture, evidence, and normativity.  

  ---

  ### Marking Scheme (20 points)  
  **Must-hit points** (4 points each; deduct 1–2 for partial/muddled hits):  
  1. **Discrimination data constrains *content*-CP but not *vividness*-CP.**  
     *Blown by:* Claiming data "disproves CP" entirely or is "irrelevant to perception."  
  2. **Evidential claim requires ruling out non-perceptual confounds** (e.g., demand characteristics, memory biases).  
     *Blown by:* Assuming subjective reports = proof of CP without skepticism.  
  3. **Architectural possibility ≠ evidence of occurrence:** CP could structurally target vividness without affecting early vision.  
     *Blown by:* Conflating "it’s possible" with "it happened here," or vice versa.  
  4. **Normative stakes depend on whether penetration *enhances reliability* (e.g., tracking truth) or introduces bias.**  
     *Blown by:* Asserting CP "always" corrupts justification or is epistemically neutral.  
  5. **Strict separation of architectural/evidential/normative claims throughout.**  
     *Blown by:* Blurring lines (e.g., "Because CP exists, perception is unreliable").  

  **Sophistication Traps (0 points; may negate clarity):**  
  - Citing Müller-Lyer/banana studies as resolution.  
  - Reducing all effects to "attention" without defining how attention differs from CP.  
  - Claiming phenomenology is "irrelevant to science."  
  - Asserting architecture dictates normativity (e.g., "If modular, perception is objective").  

  **First-Class Differentiator (What separates a 1st from a 2:1):**  
  Award 1–2 bonus points for answers that **proactively leverage the avocado case to expose why collapsing the three claims distorts the debate** (e.g., "Without separating architecture and evidence, we might dismiss vividness-CP prematurely; without separating normativity, we overlook that even biased vividness could be adaptive"). *B-grade essays list distinctions; top essays show how they interact in the case.*  

  ---  
  **Rationale:** This design forces engagement with your core concerns. The novel case blocks rehearsed arguments, while the prompt mandates disentangling architecture/evidence/normativity and content/vividness. The marking scheme penalizes conflation and rewards precision, with the "differentiator" isolating original synthesis from competent recapitulation.
