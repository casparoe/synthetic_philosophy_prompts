prompt: |-
  I was recently selected by lot to serve on a citizens' assembly on a local transit issue, and the experience has convinced me that sortition, rule by lot, is one of those ideas that cannot be taught well from the outside. I teach a 100-minute seminar in democratic theory to 18 upper-level undergraduates, and I want to use one session to make them feel the force of lottocracy rather than simply hear the arguments for it. Design a runnable in-class activity for that session.

  The activity should be a game or structured deliberation in which the rules, incentives, and roles do the work. I have a room with movable chairs, a whiteboard, a hat, and a random number generator; no real money. Participants should not need to have read anything in advance. By the end they should have felt, in their own choices, the pull of the idea that a body selected by lot can be legitimate, and the specific costs of that legitimacy. They should not hear the words sortition or lottocracy until the debrief.

  I want the design to put pressure on three distinctions, which I name so you can target them. First, the break that the draw creates: the moment when no one can claim to have earned or been denied a seat. Second, descriptive representation versus deliberative capacity: a sample can look like the population without being able to deliberate well, and a body can deliberate well without looking like the population. Third, accountability without elections: if no one can be voted out, what replaces the threat of removal? A fourth pressure point, if it fits, is rotation: what happens when half the body is replaced by a new draw and the new members must be socialized into norms they did not make.

  Deliverable: the activity itself first. Begin with the activity, not with rationale or commentary. The first sentence should state the core mechanic. Then give materials, roles or rules, the sequence and timing, the payoff scheme or decision rule, the debrief that maps specific moments onto the idea, what will predictably go wrong the first time I run it and how to handle it, and an honest note on which feature of the idea the activity cannot reproduce and I must supply.

  In the debrief notes, separate what is settled from what is genuinely contested among people who know the topic. For example, it is not contested that sortition has been used to select political bodies and that it changes incentives; it is contested whether lottocratic bodies should be advisory or binding, whether they should replace elections or supplement them, and how much weight to give to statistical representativeness versus deliberation. Do not present a contested view as the consensus.

  No bibliography, no citations, no reading list. Write for a facilitator who will run this once, with 18 students, in 100 minutes.
reasoning: |-
  We are designing an in-class activity for a 100-minute seminar with 18 upper-level undergraduates. The goal is to have students experience the core tensions of sortition without using the terminology until the debrief. The activity must target: 
  1. The break of the draw (random selection creating a clean slate)
  2. Descriptive representation vs. deliberative capacity
  3. Accountability without elections
  4. Rotation (if possible)

  Activity Name: **The Common Ground Assembly**

  **Core Mechanic**: 
  Students will participate in a two-round deliberation where a randomly selected subgroup makes binding decisions on a collective problem under time pressure, with half the group rotating out after the first round.

  ---

  **Materials**:
  - A hat or random number generator (for drawing lots)
  - Whiteboard (to record proposals and decisions)
  - Movable chairs (to arrange in circles for deliberation)
  - Timer (use phone or watch)
  - Two sets of colored index cards (or paper squares): one color for Round 1, another for Round 2 (to simulate tokens for voting or signaling)
  - A facilitator (the instructor) to keep time and enforce rules.

  **Problem Statement**:
  The assembly must decide how to allocate a fixed sum of "community points" (symbolic, no real money) among three public projects. The projects are:
  1. **Safety**: Installing streetlights in poorly lit areas.
  2. **Environment**: Planting trees and creating green spaces.
  3. **Accessibility**: Building wheelchair ramps at key intersections.

  The total points available are 100. The decision must be made by the selected assembly members.

  ---

  **Roles and Rules**:

  1. **The Whole Group (18 students)**:
     - Represents the citizenry.
     - At the start, everyone is a potential assembly member.

  2. **The Facilitator (Instructor)**:
     - Explains rules, keeps time, enforces procedures, and records decisions on the whiteboard.
     - Does not intervene in deliberation except to keep time and clarify rules.

  **Sequence and Timing** (Total: 85 minutes + 15 min debrief):

  **Phase 0: Introduction and Problem Framing (5 minutes)**  
  - Facilitator frames the problem: "Our city has 100 community points to spend on three projects. You must decide how to split the points. The projects are: Safety, Environment, Accessibility."  
  - Emphasize: This is a real decision that will be implemented (symbolically) by the class.  
  - No advance reading or expertise assumed.

  **Phase 1: First Draw and Assembly Formation (5 minutes)**  
  - Facilitator draws 6 names at random (1/3 of the class) to form the **First Assembly**.  
  - The remaining 12 become the **Public**.  
  - *The Break*: Highlight that the draw is random. "These 6 are now the decision-makers. They were chosen by lot, not by merit or election."  
  - Rearrange chairs: 6 assembly members in an inner circle; the Public in an outer circle (observing, but silent unless given a role).

  **Phase 2: First Deliberation (20 minutes)**  
  - Task: The First Assembly must decide how to split 100 points among the three projects.  
  - Rules:  
    - They must reach a decision by the end of 20 minutes.  
    - Any member can propose an allocation (e.g., "50 Safety, 30 Environment, 20 Accessibility").  
    - Decision rule: Consensus preferred, but if time runs out, a majority vote (each of the 6 has one vote).  
  - Facilitation:  
    - Write proposals on the whiteboard.  
    - Announce time remaining at 10, 5, 2, and 1 minute.  
  - *Pressure Point: Deliberative Capacity*: The group must organize itself quickly to deliberate effectively. Do they have the skills? Does their random composition help or hinder?

  **Phase 3: Announce Decision and First Reflection (5 minutes)**  
  - Assembly announces the allocation (e.g., "40 Safety, 40 Environment, 20 Accessibility").  
  - Facilitator records it on the board.  
  - Ask the Public: "Do you accept this decision? Show thumbs up, sideways, or down." (No discussion, just quick gauge).  
  - *Pressure Point: Legitimacy*: Note that the decision was made by a random sample. Is it accepted?

  **Phase 4: Rotation and Second Draw (5 minutes)**  
  - **Rotation Mechanic**:  
    - Randomly select 3 of the original 6 to rotate OUT (draw from the First Assembly names).  
    - Randomly select 3 new members from the Public (draw from the remaining 12).  
  - The **Second Assembly** now consists of the 3 holdovers from Round 1 and 3 new members (total 6).  
  - The Public is now the remaining 9 (original Public minus the 3 new members).  
  - Rearrange chairs: New inner circle of 6 (3 old + 3 new).  

  **Phase 5: New Information and Second Deliberation (20 minutes)**  
  - **Twist**: Facilitator introduces new information:  
    - "A budget update: The city can only spend 80 points total due to unexpected costs. You must re-allocate the points, but you cannot reduce any project below 10 points."  
  - Task: The Second Assembly must adjust the allocation to sum to 80, without any project below 10.  
  - Rules: Same as Round 1 (consensus or majority vote).  
  - *Pressure Points*:  
    - **Rotation**: How do holdovers socialize new members? Do they dominate?  
    - **Accountability**: The Assembly must fix the problem, but they did not create it. The Public is watching.  
    - **Deliberative Capacity**: Can the new group, half of whom missed the first round, deliberate effectively?

  **Phase 6: Announce Revised Decision and Second Reflection (5 minutes)**  
  - Second Assembly announces the revised allocation.  
  - Facilitator records it.  
  - Ask the Public: "Thumbs up/down on the revised decision?"  
  - Then, ask the whole class (including Assembly): "If you could vote out one Assembly member for doing a bad job, who would it be? Write a name on a card and hand it in." (Do not tally publicly; stress this is anonymous).  
  - *Pressure Point: Accountability*: They just experienced a decision-making body they couldn't vote out. The vote is symbolic but will be discussed in debrief.

  **Phase 7: Debrief (25 minutes)**  
  - Reveal that the activity was about "sortition" or "lottocracy" (rule by lot).  
  - Map the experience to the concepts:  
    1. **The Break**: Ask: "How did it feel to be selected or not selected by lot? Could you argue you deserved it? Could you argue you were excluded unfairly?"  
    2. **Descriptive vs. Deliberative**:  
       - "Did the Assembly 'look like' the whole class? (Probably, by chance.) But did that guarantee good discussion?"  
       - "What skills did the Assembly need? Did the random selection ensure those skills?"  
    3. **Accountability**:  
       - "You couldn't vote anyone out during the process. What kept the Assembly honest? (Public scrutiny? Personal integrity? Time pressure?)"  
       - "What did you write on the card? Why?" (Do not reveal individual votes, but discuss motives.)  
    4. **Rotation**:  
       - "How did the holdovers and new members work together? Did the group lose institutional memory? Did new members bring fresh perspectives?"  
  - **Settled vs. Contested**:  
    - Settled:  
      - Sortition breaks the link between ambition and office.  
      - Random selection can produce descriptive representation.  
      - Rotation prevents entrenchment.  
    - Contested:  
      - Whether such bodies should be advisory or binding.  
      - How to balance statistical representativeness with deliberation quality.  
      - Whether elections and lotteries should coexist.  
  - **Honest Note**: The activity cannot reproduce long-term deliberation (weeks/months) or the full weight of real decisions. You must explain that real assemblies have time, resources, and expert testimony.

  **Predictable Problems and Handling**:  
  - **Problem**: The first Assembly deadlocks and fails to decide in 20 minutes.  
    - **Handle**: Enforce the majority vote rule. If still deadlocked, the facilitator can impose a default (e.g., equal split) but emphasize this as a failure of deliberation.  
  - **Problem**: The Public is disruptive or tries to intervene.  
    - **Handle**: Gently remind them of their observer role. If necessary, note that in real assemblies, the public observes but doesn't speak.  
  - **Problem**: Holdovers dominate the second deliberation.  
    - **Handle**: Do not intervene during deliberation, but highlight this in debrief as a risk of rotation.  
  - **Problem**: Students treat it as a game, not seriously.  
    - **Handle**: Frame the problem as a real civic issue (use local examples if possible). The allocation should feel consequential (e.g., "This could be our neighborhood").  

  **Total Time**:  
  - Activity: 5 (intro) + 5 (draw) + 20 (delib1) + 5 (reflection) + 5 (rotation) + 20 (delib2) + 5 (final reflection/vote) = 65 minutes  
  - Debrief: 25 minutes  
  - Buffer: 10 minutes (for hiccups) = 100 minutes  

  ---
  This design creates a compressed experience of sortition's key tensions. The random draw creates an immediate sense of legitimacy (or lack thereof), the deliberation phases test descriptive representation against actual performance, the rotation forces socialization of new members, and the inability to remove members pressures accountability mechanisms. The debrief links these to the targeted distinctions.
answer: |-
  ### Activity: The Community Trust Game  
  **Core Mechanic**: Students are randomly assigned to a decision-making body that must allocate shared resources under rotating membership and shifting constraints, while observed by non-members who cannot intervene but can evaluate legitimacy.  

  ---

  #### **Materials**  
  - **Random selector**: Hat with 18 slips of paper (numbered 1–18) or digital RNG.  
  - **Whiteboard**: To display allocations, rules, and timer.  
  - **Colored tokens**: 100 identical items (e.g., paper clips, buttons) for resource allocation.  
  - **Timer**: For strict 15-minute deliberation rounds.  
  - **Index cards**: For anonymous evaluations.  

  #### **Problem Setup**  
  The group must allocate 100 "community tokens" (CT) to three public initiatives:  
  1. **Safety Patrols** (reduce theft)  
  2. **Playground Upgrades** (new equipment)  
  3. **Bus Benches** (sheltered seating at stops)  

  ---

  #### **Roles and Rules**  
  1. **The Whole Group (18 Students)**: Represents the community.  
  2. **The Assembly**: 6 randomly selected members who deliberate and decide.  
  3. **The Observers**: Remaining 12 students; silent during deliberations but may whisper among themselves. They evaluate outcomes.  

  **Key Constraints**:  
  - Allocations must total 100 CT.  
  - No project can receive <10 CT (ensures minimal investment).  
  - Majority vote resolves deadlocks (4/6 votes).  

  ---

  #### **Sequence and Timing**  
  **Phase 1: Initial Draw and Deliberation (25 min total)**  
  - **Draw (5 min)**: Randomly select 6 Assembly members. Announce: "These members now hold decision power for the community." *Emphasize randomness; no appeals allowed*.  
  - **Inner Circle Setup**: Assembly sits facing each other; Observers form an outer ring.  
  - **Deliberation Task (15 min)**: Allocate 100 CT across three initiatives. Timer starts. *Facilitator role: Only enforce rules/time; no input*.  
  - **Decision (5 min)**: Record final allocation on whiteboard.  

  **Phase 2: Rotation and Crisis (30 min total)**  
  - **Rotation (5 min)**: Randomly replace 3 Assembly members with 3 Observers. Announce: "Half the Assembly is new. Adjust your plan if needed."  
  - **Twist (5 min)**: Reveal new constraint: "Due to a funding shortfall, 30 CT are frozen. You now have only 70 CT but must keep all projects running (≥10 CT each)."  
  - **Deliberation (15 min)**: Revised allocation with new members.  
  - **Decision (5 min)**: Record revised plan.  

  **Phase 3: Accountability Check (5 min)**  
  - Observers and Assembly write anonymously on index cards:  
    - "Do you accept the final allocation? (Yes/No)"  
    - "Which one initiative deserved more funding? Why? (One sentence)"  
  - Collect cards; hold for debrief.  

  ---

  #### **Payoff and Decision Rules**  
  - **No material incentives**: Legitimacy stems from process acceptance.  
  - **Binding outcome**: The final allocation is "implemented" (symbolized by placing tokens in labeled jars).  
  - **Observer power**: Their evaluations determine perceived legitimacy (revealed in debrief).  

  ---

  #### **Debrief (25 min)**  
  **Reveal the Concept**: "Today simulated *governance by random selection*—an ancient idea with modern applications."  
  **Map Activity to Pressures**:  
  1. **The Break**:  
     - "How did it feel to gain/lose power purely by chance? Could you 'deserve' your role?"  
     - *Settled*: Random selection disrupts claims of merit/exclusion. *Contested*: Whether this alone confers legitimacy.  

  2. **Descriptive vs. Deliberative**:  
     - "Did the Assembly resemble our class demographics? Did that ensure good debate?"  
     - Highlight: Round 1 likely had dominant speakers; rotation may have improved/worsened dialogue.  
     - *Settled*: Random groups mirror populations descriptively. *Contested*: If statistical likeness outweighs deliberation quality.  

  3. **Accountability Without Elections**:  
     - "You couldn’t remove members. What kept them accountable?" (Observer scrutiny, time pressure, peer norms).  
     - Share anonymous card responses: "How many accepted the outcome? Why?"  
     - *Settled*: Elections aren’t the only accountability tool. *Contested*: What replaces electoral consequences long-term.  

  4. **Rotation**:  
     - "Holdovers: Did you explain past reasoning? Newcomers: Did you defer or challenge?"  
     - *Settled*: Rotation resets group dynamics. *Contested*: Whether it erodes expertise or curbs groupthink.  

  **Contested Issues to Note**:  
  - "Experts debate whether bodies like this should advise governments or make binding laws, and if they should replace or complement elections."  

  ---

  #### **Predictable Problems + Solutions**  
  - **Problem 1: Deadlock in deliberation**.  
    - *Solution*: Enforce majority vote at the 14-minute mark. Say: "This reflects real-world time pressure."  
  - **Problem 2: Observers interrupting**.  
    - *Solution*: Restate: "Observers may only watch; their power comes later." If persistent, assign one as a "silent note-taker."  
  - **Problem 3: Superficial deliberation**.  
    - *Solution*: Post key constraints prominently. If groups rush, ask in debrief: "Did haste sacrifice depth? Would 3 hours change this?"  
  - **Problem 4: Dominant speakers monopolizing**.  
    - *Solution*: Note this privately during rotation ("New members, you bring fresh eyes—speak up!"). Discuss in debrief as a *deliberative capacity* flaw.  

  ---

  #### **Honest Limitation**  
  **The activity cannot reproduce:** Long-term group development. Real assemblies meet for months, build trust, and hear experts. You must clarify: "One session can’t show how shared norms emerge over time or how evidence shapes decisions—imagine this group reconvening weekly with research support."  

  ---  
  **Total Time**: Setup (5 min) + Phase 1 (25 min) + Phase 2 (30 min) + Phase 3 (5 min) + Debrief (25 min) = 90 min. Buffer: 10 min for transitions.
