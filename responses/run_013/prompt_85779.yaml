answer: |-
  ### The Claim  
  Lewis's common knowledge requirement for convention is redundant. A shared regularity sustained by common knowledge of mutual sanctioning dispositions and behavioral drift achieves arbitrariness, stability, and normativity. Agents need never form beliefs *about others' expectations*; the mutually responsive dispositions, known to be shared, directly coordinate behavior and enforce the norm.

  ### The Argument  
  Start with **arbitrariness**. The sanctioning disposition (e.g., elbowing left-standers) and conformity disposition (drifting right when others do) apply symmetrically to any alternative regularity (e.g., standing left). If everyone drifted left and sanctioned right-standers, *that* would be stable. The dispositions themselves are arbitrary responses to deviation/alignment, not tied to the specific content "stand right." Stability arises from the self-reinforcing loop: widespread conformity reduces the need for sanctioning, while sanctioning punishes deviations, reinforcing conformity. No agent needs to *believe* "others expect me to stand right"; they simply respond to observed behavior (drift) and deviations (sanction) based on hardwired dispositions.  

  **Normativity** emerges from the sanction threat. The disposition to elbow deviators creates a cost for non-compliance, generating a practical "should" – you *should* stand right to avoid sanctions. Crucially, this "should" is purely dispositional and behavioral. Agents comply to avoid elbowing (a visceral response to sanction), not because they recognize an obligation based on others' expectations.  

  **Common knowledge** *is* present, but only of the dispositions and the current regularity – not of expectations. Everyone knows everyone knows that people (a) stand right now, (b) tend to elbow standers on the "wrong" side, and (c) tend to drift toward the majority side. This common knowledge ensures predictability: seeing others stand right, you know they’ll likely elbow you if you stand left (disposition b), and you know they’ll likely keep standing right (disposition c). Your own drift/sanction dispositions are triggered by this observable reality, not by higher-order beliefs about others' mental states. Lewis's "knowledge of others' expectations" collapses into knowledge of their stable, publicly manifested *dispositions to act* in specific ways (sanction deviation, conform to majority). The coordination and enforcement work is done by the dispositions and their common knowability, rendering expectation-beliefs epiphenomenal.

  ### Where it's Weakest  
  1.  **Collapsing Expectations into Dispositions?** Lewis might argue that a *disposition to sanction* inherently implies an *expectation* of conformity. If I’m disposed to elbow left-standers, it seems I expect others to stand right – sanctioning feels like enforcing a violated expectation. Dispositions may not be cognitively "pure"; they might tacitly embody normative expectations that Lewis’s clause explicitly captures.  
  2.  **Novel Coordination Problems:** Could this model handle a genuinely novel coordination problem (e.g., choosing R or L on a *new* escalator)? Without agents forming beliefs about what others *expect them to do*, relying solely on drift/sanction dispositions might lead to chaotic initial floundering. Lewisian common knowledge of expectations allows faster, belief-driven convergence on a new equilibrium. The dispositional model seems better suited to maintaining *existing* regularities than establishing new ones ex nihilo.

  ### Bottom Line  
  The dispositional account powerfully challenges the necessity of Lewis's explicit common knowledge of *expectations*. It demonstrates that mutual responsiveness grounded in common knowledge of shared behavioral dispositions (sanction + drift) can generate the core features of convention—arbitrariness, stability, and felt normativity—through a feedback loop of conformity and punishment, bypassing the cognitive step of forming beliefs about others' expectations. This suggests Lewis may have over-intellectualized convention. However, the model struggles to fully disentangle dispositions from implicit expectations and may falter in bootstrapping entirely new conventions, leaving Lewis’s original framework with significant explanatory territory. The professor’s case is strong but likely redefines, rather than fully eliminates, the role of common knowledge.
