prompt: |-
  In my norms and social order class we just did Lewis on convention, and the prof floated a hypothetical I cant stop chewing on. Here's the setup. A regularity holds in a population -- say everyone stands on the right side of the escalator -- and it's stable, but not because anyone expects anything of anyone. Each of us just has a standing disposition to sanction deviators (glare, elbow) and to drift toward whatever others are doing, and those dispositions are themselves shared and known to be shared. Nobody forms the belief that others expect them to stand right; they just do it. The prof says this is a Lewis convention anyway, and that Lewis's common-knowledge clause is doing no real work -- shared dispositions plus mutual responsiveness is all you need for the arbitrariness, the stability, and the normativity Lewis was after. I half beleive her. Please make that case for her: show that the dispositional story by itself delivers what Lewis wanted, and that the common-knowledge condition is either redundant or quietly smuggled in. Assume I know Lewis's analysis, so skip the exposition. Lay it out as 'The claim' (2-3 sentences), 'The argument' (the bulk of it, ~400 words), 'Where it's weakest' (the two objections that would worry you most, ~150 words), and 'Bottom line' (one paragraph).
