prompt: |-
  I am a doctoral candidate in moral psychology, and I have been trying to make precise a distinction that my field often invokes but rarely defines: the distinction between a moral preference and a moral bias. The distinction matters because we treat biases as obstacles to be corrected and preferences as ideals to be tolerated, and I cannot tell which attitude is warranted in the borderline cases. My supervisor says the difference is that a bias rationalizes or stabilizes an unjust social hierarchy, while a preference merely expresses a contestable ideal of how to live. I am not sure that survives the cases. Here are my verdicts. A person who prefers monogamy and thinks polyamory is a lesser form of life: preference. A person who feels disgust at interracial marriage and thinks it wrong: bias. A person raised in a community that regards meat-eating as defiling, who now judges it immoral though they can give no independent argument: I want to say preference, but it has the same visceral, unargued texture as the disgust case. A wealthy heir who believes the poor are lazy and that welfare should be cut, where the belief conveniently protects his inheritance: bias. A poor person who holds the same anti-welfare belief, not because it benefits him but because it is what everyone around him says: I want to call it a bias too, but my supervisor's principle makes it a preference, and that feels wrong. A person who thinks it is morally better to have children than to be childfree and feels a pang of contempt at the childfree: preference, though an unlovely one. A person who thinks women should not serve in combat, not because he dislikes women but because he was raised in a military family and has a visceral sense of propriety: bias. A person who thinks it is wrong to eat octopus because she has a strong intuition that octopuses are persons, though she cannot defend it: I lean preference, but weakly.

  My tentative principle is the one my supervisor offers: a moral judgment is a bias when it functions to rationalize or stabilize an unjust hierarchy, and a preference when it merely expresses a contestable ideal of how to live. But that principle makes the octopus case a preference, the interracial marriage case a bias, and the childfree-contempt case a preference, while the combat case is a bias only because of hierarchy. It also makes the poor person's anti-welfare judgment a preference and the rich heir's a bias, even though the two judgments have the same content. And it seems to leave no room for a judgment that is visceral, unargued, and demeaning without being hierarchical. I would like a principle, or a small set of candidate principles, that does justice to these verdicts, says which of them I have to abandon, and tells me what to say about a case I have not listed: a person who has a visceral, unargued aversion to a novel technology for enhancing embryos, who thinks using it is morally degrading, but who is not defending any social hierarchy and would not want others punished for using it.

  Please structure your answer as follows. First, The pattern in my verdicts: one paragraph, about 150 words, identifying the distinctions my verdicts seem to track and the verdicts that are hardest to reconcile. Second, Candidate principles: two or three precise principles, each with the cases it was built to capture and the verdicts it cannot accommodate, about 300 words. Third, Where the principles conflict: one or two paragraphs, about 250 words, showing which cases separate them, including the unlisted case. Fourth, Your recommended principle: a single precise statement, with a brief defense, one paragraph, about 150 words. Fifth, Verdicts I must revise: a list of the verdicts I should give up or modify, with reasons, about 150 words. Sixth, The unlisted case: your verdict on the embryo-enhancement case and why, one paragraph, about 150 words. Seventh, The case that would settle it: one further case that would best distinguish the surviving principles, and what each would say about it, one paragraph, about 150 words. Aim for about twelve hundred to fifteen hundred words in total.
reasoning: |-
  Hmm, the user is a doctoral candidate in moral psychology struggling with the distinction between moral preferences and moral biases. This is a nuanced philosophical and psychological problem that has real implications for how we evaluate moral judgments in society. The user has provided several case examples where their intuitive verdicts conflict with their supervisor's proposed principle (that biases stabilize unjust hierarchies while preferences express contestable ideals).

  Looking at their verdicts, I notice several recurring tensions that need to be resolved. First, there's the tension between visceral reactions (like disgust at interracial marriage) and more conceptual judgments (like preferring monogamy). Second, there's the issue of whether a judgment supports social hierarchy - but this creates problems in cases like the poor person opposing welfare where no hierarchy is being maintained. Third, there's the question of whether the judgment benefits the holder, which differentiates the rich heir from the poor person despite identical beliefs. Fourth, judgments about non-social entities (like octopuses) seem to fall outside the hierarchy framework entirely. And finally, there's the challenge of judgments that feel demeaning but don't clearly uphold power structures.

  The visceral nature of the reaction seems important in cases like disgust at interracial marriage (bias) versus the monogamy preference. Yet in the meat-eating case, which is also visceral, the user wants to call it preference. The hierarchy criterion works well for clear cases of social injustice but fails for non-social cases like octopuses or the embryo enhancement scenario. The beneficiary criterion helps distinguish between rich and poor anti-welfare views but feels psychologically thin when applied to the poor person's belief.

  For candidate principles, I consider three approaches: a hierarchy-focused principle (like the supervisor's), a psychological origin principle focusing on how the judgment functions for the individual, and a harm principle focusing on consequences to others. The hierarchy principle captures cases involving social injustice but fails with non-social entities and cases where no hierarchy is maintained. The psychological principle handles visceral reactions and self-serving functions well but struggles with well-meaning prejudices. The harm principle addresses demeaning impacts but might be too broad.

  The embryo enhancement case is particularly revealing as it involves visceral aversion without clear hierarchy or harm. This "disgust without domination" case forces us to decide whether viscerality alone can constitute bias. The case that would best test these principles would involve a judgment that stabilizes hierarchy without being self-serving (like a privileged person advocating against their own group's privilege).

  My recommended principle synthesizes elements from all three: bias exists when a judgment stabilizes unjust hierarchy OR imposes demeaning impacts through viscerality. This maintains the important focus on social power while acknowledging that some non-hierarchical judgments can still function as biases through their psychological mechanisms. This means the user would need to revise several verdicts: the poor person's anti-welfare view should be classified as bias (due to demeaning impacts), the combat exclusion case remains bias (hierarchy), and the octopus case becomes preference. The embryo case would be preference under this framework since there's no hierarchy or harm to others.

  The key insight is that while hierarchy is central to many biases, the psychological function of "othering" through visceral disgust can constitute bias even without clear power structures - though this requires careful application to avoid overextension. The most important distinction remains whether the judgment functions to subordinate or demean others versus merely expressing a personal ideal.
answer: |-
  ### The Pattern in My Verdicts
  Your verdicts reveal three underlying tensions: (1) **Viscerality vs. Rationality**: Instinctive, affect-laden reactions (disgust at interracial marriage) tend toward *bias*, while abstract ideals (monogamy preference) lean *preference*, yet the meat-eating case complicates this. (2) **Social Power Dynamics**: Judgments reinforcing group-based subordination (anti-interracial marriage, women in combat) are *biases*, while those without clear hierarchy (childfree contempt) are *preferences*—but the poor anti-welfare case challenges this. (3) **Beneficiary Status**: Self-serving beliefs (rich heir) are *biases*, while non-beneficial ones (poor anti-welfare) feel *biased* but lack clear hierarchy under your supervisor’s principle. The hardest reconciliations are: the **poor anti-welfare** verdict (hierarchy absent, yet bias intuitively present), **meat-eating disgust** (visceral like bias, but deemed preference), and **octopus intuition** (non-hierarchical but visceral).

  ---

  ### Candidate Principles
  **Principle 1 (Hierarchy-Stabilization):**  
  *A moral judgment is a bias iff it functions to rationalize or stabilize an unjust social hierarchy.*  
  - **Captures**: Interracial marriage disgust (racial hierarchy), wealthy heir (class hierarchy), women in combat (gender hierarchy).  
  - **Fails**: Poor anti-welfare (no hierarchy stabilized by the poor person’s belief), octopus intuition (no social hierarchy), meat-eating disgust (hierarchy unclear), embryo enhancement (no hierarchy). Treats identically held beliefs (anti-welfare) differently based on holder’s social position.  

  **Principle 2 (Psychological Function):**  
  *A moral judgment is a bias iff it is (a) rooted in visceral affect (e.g., disgust, contempt), and (b) functions to protect the holder’s worldview/self-interest by demeaning others’ choices.*  
  - **Captures**: Interracial disgust (visceral + demeaning), wealthy heir (self-interest + contempt), poor anti-welfare (visceral adoption of demeaning view), combat exclusion (visceral "propriety" demeaning women).  
  - **Fails**: Childfree contempt (visceral and demeaning but deemed preference), monogamy preference (abstract, no demeaning function), octopus intuition (visceral but not clearly demeaning). Overextends bias to non-hierarchical but affectively charged judgments.  

  **Principle 3 (Harm-Demeaning Impact):**  
  *A moral judgment is a bias iff it imposes harms (e.g., stigma, rights denial) on others by characterizing their choices as intrinsically inferior or defective, regardless of hierarchy.*  
  - **Captures**: Interracial marriage (harms via stigma/illegality), women in combat (rights denial), poor anti-welfare (harms via policy support), wealthy heir (same).  
  - **Fails**: Meat-eating disgust (no harm imposed if not enforced), octopus intuition (no harm), embryo enhancement (no harm/punishment). Misses non-harmful visceral reactions (e.g., private disgust without action).  

  ---

  ### Where the Principles Conflict
  The principles diverge sharply in **non-hierarchical, visceral cases**. The *poor anti-welfare* case is pivotal: Principle 1 calls it a *preference* (no hierarchy stabilized), Principle 2 a *bias* (visceral adoption of a demeaning view), Principle 3 a *bias* (harms via policy endorsement). The *octopus intuition* is a preference under Principles 1 and 3 (no hierarchy/harm) but a potential bias under Principle 2 if viscerality + intuition of others’ moral defectiveness suffice.  

  The **embryo-enhancement case** (visceral aversion, no hierarchy/harm/punishment) crystallizes the conflict:  
  - **Principle 1**: Preference (no social hierarchy).  
  - **Principle 2**: Bias if "degrading" implies intrinsic defectiveness; preference if merely personal aversion.  
  - **Principle 3**: Preference (no harm imposed).  
  This case exposes Principle 2’s risk of overinclusion and Principle 1’s narrow focus on social power.  

  ---

  ### Your Recommended Principle  
  **Synthesized Principle:**  
  *A moral judgment is a bias iff it (a) relies on visceral affect to characterize others’ choices/identities as intrinsically inferior or defective, and (b) functions to sustain an unjust social hierarchy OR impose stigmatizing harm. Otherwise, it is a preference.*  
  **Defense**: This retains hierarchy’s moral urgency (addressing your supervisor’s core insight) while acknowledging that viscerality + demeaning impact can constitute bias *even without hierarchy* (e.g., poor anti-welfare: though not stabilizing hierarchy, it adopts a harm-imposing, affect-laden stance). It avoids overextending bias to private ideals (e.g., octopus intuition) by requiring *either* hierarchy *or* harm. The dual criterion balances social ethics and psychological realism.  

  ---

  ### Verdicts I Must Revise  
  1. **Poor anti-welfare judgment**: Revise to *bias*. It meets the synthesized criterion: visceral adoption of a view that *imposes harm* (policy support) and deems recipients "lazy" (intrinsic inferiority), even without hierarchy stabilization.  
  2. **Childfree contempt**: Revise to *bias*. "Pang of contempt" frames childfree life as defective, imposing stigma (harm), regardless of hierarchy.  
  3. **Meat-eating disgust**: Revise to *preference*. No hierarchy/harm specified; personal defilement lacks demeaning impact on others.  
  4. **Octopus intuition**: Retain *preference*. Visceral but no hierarchy/harm; "personhood" intuition targets moral status, not others’ choices.  

  **Reason**: The revised principle prioritizes *impact* (harm/hierarchy) over internal state alone. Contempt for childfree choices imposes social stigma, while disgust at meat-eating (if not weaponized) does not.  

  ---

  ### The Unlisted Case  
  **Embryo-enhancement aversion**: *Preference*. While visceral and labeling the act "degrading," the absence of hierarchy, harm imposition (no punishment/rights denial), or stigma toward users makes it a contestable ideal. The judgment centers on the *act’s* moral status (like octopus intuition), not the inferiority of *persons*. Under the synthesized principle, lacking (b) (hierarchy/harm), it remains a preference despite viscerality.  

  ---

  ### The Case That Would Settle It  
  **Case**: *A devout environmentalist feels visceral disgust at SUV owners, deeming them "shallow parasites," and advocates banning SUVs in low-income neighborhoods (claiming environmental justice).*  
  - **Principle 1**: *Bias*. Ban targets marginalized groups (class hierarchy), rationalizing exclusion via "justice."  
  - **Principle 2**: *Bias*. Visceral disgust + demeaning labels ("parasites"); protects holder’s worldview.  
  - **Synthesized Principle**: *Bias*. Visceral disgust framing owners as defective + imposes harm (ban) with disparate class impact (hierarchy).  
  **Why it settles**: Tests whether non-traditional hierarchies (class + ecology) and harm imposition suffice for bias without traditional oppression vectors. The synthesized principle captures the harm/hierarchy fusion; others might split verdicts.  

  ---  
  **Total**: ~1450 words. This framework prioritizes harm/hierarchy while accommodating the psychological texture of bias, demanding revisions where verdicts neglected impact.
