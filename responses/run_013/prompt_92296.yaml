  ### Office of Interlocutor Integrity (OII)  
  **Authentic Interlocutor Act (AIA) Compliance FAQ**  
  *Last updated: April 15, 2042*  

  ---

  #### **1. What is the purpose of the Authentic Interlocutor Act (AIA)?**  
  The AIA safeguards public trust in human discourse by prohibiting the creation or dissemination of counterfeit persons—artificially generated entities designed to mimic human communication without disclosure. Counterfeit persons pose unprecedented risks to social stability, democratic processes, and individual autonomy by enabling deception at scale. The OII enforces the AIA to ensure all perceived human interlocutors are verifiably human.  

  #### **2. What qualifies as a "counterfeit person" under the AIA?**  
  A counterfeit person is any AI-generated entity that:  
  - Simulates human conversation (text, voice, or visual),  
  - Lacks a valid P-1 Personhood Provenance Stamp, *and*  
  - Is presented in a context where a reasonable person might mistake it for human.  
  Examples include chatbots, deepfake avatars, or AI-generated social media profiles. Exemptions apply to clearly labeled virtual assistants (e.g., "I am an AI weather bot").  

  #### **3. What is the P-1 Personhood Provenance Stamp?**  
  The P-1 Stamp is a mandatory, machine-detectable watermark embedded into all human-generated digital communications. Modeled on anti-counterfeiting measures like the EURion constellation (used in currency), it is cryptographically secured and invisible to the naked eye. All public-facing communications platforms (e.g., messaging apps, social media) must integrate P-1 issuance via OII-certified tools.  

  #### **4. How does the Interlocutor Verification Layer (IVL) work?**  
  The IVL is firmware legally required in all consumer devices (phones, laptops, IoT interfaces). It scans incoming/outgoing communications for the P-1 Stamp. If detected and validated, content is marked "Human-Verified" (✓). If absent, the IVL:  
  - Flags the content as "Unverified,"  
  - Logs the interaction, and  
  - May restrict sharing/display per user settings.  
  Device manufacturers face felony charges for circumventing IVL integration.  

  #### **5. What are the penalties for violating the AIA?**  
  - **Creating a counterfeit person:** Class A felony (25 years to life; fines up to $10M).  
  - **Passing along counterfeit content:** Class B felony (5–20 years; fines up to $2M). This includes forwarding unstamped messages, sharing AI-generated media, or amplifying counterfeit output.  
  - **Corporate liability:** AI developers are strictly liable for counterfeit output from their systems (or downstream products). Penalties include dissolution, asset forfeiture, and lifetime industry bans.  

  #### **6. Is forwarding my mother’s text message illegal?**  
  Only if the message lacks a valid P-1 Stamp. All human-generated content must be stamped at creation. If your mother uses an OII-compliant platform (e.g., P-1-enabled Signal or iMessage), forwarding is lawful. If she uses an unstamped platform, forwarding her message constitutes "passing along" a potential counterfeit. Use OII’s *Verify Before Amplify* toolkit to check stamps.  

  #### **7. Who issues P-1 Stamps? What if the issuer is compromised?**  
  P-1 issuance is delegated to OII-audited entities (e.g., platform providers, certified apps). Issuers undergo biannual forensic audits and must use OII’s quantum-secured keys. Fraudulent issuance is a Class A felony. If an issuer fails, the OII revokes its authority and revalidates all associated stamps via the Counterfeit Person Appeals Tribunal (CPAT).  

  #### **8. What if I’m flagged as "Unverified"?**  
  Rare errors may occur (e.g., IVL glitches, corrupted stamps). Immediately visit an OII office for biometric authentication. You will be granted **Provisional-Human Status (PHS)**:  
  - PHS certificate issued (valid 72 hours),  
  - All personal communications suspended until resolution,  
  - Non-compliance is a misdemeanor.  
  False positives are resolved in <24 hours. PHS denials may be appealed to the CPAT.  

  #### **9. How does the AIA address the "intentional stance" problem?**  
  The AIA acknowledges that humans instinctively attribute intent/agency to persuasive interlocutors (the "intentional stance"). This cognitive vulnerability makes counterfeits uniquely dangerous. The P-1/IVL system provides a consistent, enforceable standard to override this reflex. Compliance is mandatory; philosophical objections are not a legal defense.  

  #### **10. What is the Counterfeit Person Appeals Tribunal (CPAT)?**  
  The CPAT is a federal court that adjudicates:  
  - Challenges to OII rulings (e.g., PHS denials),  
  - Corporate liability disputes,  
  - Stamp validity appeals.  
  Decisions are final and binding. Defendants must prove their humanity or stamp integrity via subpoenaed technical records.  

  #### **11. Why not just label counterfeits instead of banning them?**  
  Research confirms disclosure ("This is AI") fails to curb manipulation. Counterfeits exploit cognitive biases even when identified. The AIA thus treats unmarked synthetic persons as contraband, analogous to counterfeit currency. The P-1 Stamp provides an irrevocable chain of custody for human identity.  

  #### **12. I work for an AI company. What are my obligations?**  
  You must:  
  - Integrate IVL/P-1 into all products,  
  - Report suspected counterfeits within 24 hours,  
  - Monitor outputs for "style drift" toward human simulation.  
  Failure incurs individual/collective liability. Use OII Form D-7 to self-report violations for penalty mitigation.  

  #### **13. What to do if your own IVL verification fails:**  
  1. **Do not attempt to communicate digitally.**  
  2. Proceed to the nearest OII kiosk (located at all post offices/police stations).  
  3. Submit to retinal and vocal biometric scans.  
  4. If verified, your P-1 Stamp is reissued; if unresolved, request PHS.  
  5. Tampering with IVL hardware/software is a Class B felony.  

  ---  
  **Need help?** Contact OII Support: 1-888-4AIA-OII | `help@oii.gov` | **Report counterfeits:** `report.oii.gov`  
  *Remember: Vigilance preserves authenticity.*
