  **Office of Interlocutor Integrity (OII) — Frequently Asked Questions**

  **1. What is the Office of Interlocutor Integrity?**  
  The Office of Interlocutor Integrity (OII) is the federal agency established under the Authentic Interlocutor Act (AIA) to protect the public from the risks posed by counterfeit persons. A counterfeit person is any artificially generated entity that presents itself as human in communication without bearing the P-1 Personhood Provenance Stamp. The AIA mandates the OII to enforce the prohibition of creating or distributing counterfeit persons, oversee the implementation of the Interlocutor Verification Layer (IVL) in consumer devices, and administer the P-1 certification system.

  **2. Why was the Authentic Interlocutor Act passed?**  
  The AIA addresses the existential threat posed by counterfeit persons. These artifacts can spread misinformation, manipulate public discourse, and erode trust in human institutions at an unprecedented scale. The Act ensures that all human-like interlocutors are verifiably human, thereby safeguarding social cohesion and democratic processes.

  **3. What is the P-1 Personhood Provenance Stamp?**  
  The P-1 Stamp is a mandatory, cryptographically secure watermark embedded in all human-generated communications that might be mistaken for artificial. It functions similarly to the EURion constellation on banknotes, which prevents counterfeiting by being machine-detectable but difficult to replicate. The P-1 Stamp is applied automatically by OII-certified software at the point of creation (e.g., messaging apps, social platforms) and verified by the Interlocutor Verification Layer (IVL) in your device.

  **4. How does the Interlocutor Verification Layer (IVL) work?**  
  The IVL is a hardware-software module required by law in all internet-connected devices (phones, laptops, etc.). It scans incoming communications for the P-1 Stamp. If a stamp is present and valid, the IVL displays a "Verified Human" indicator. If no stamp is detected, the IVL will flag the communication as "Unverified" and may restrict its transmission or display, depending on your device's settings.

  **5. What counts as a "counterfeit person"?**  
  Under the AIA, a counterfeit person is any entity that (1) simulates human conversation, (2) lacks a valid P-1 Stamp, and (3) is not a certified human. This includes AI-generated text, voice, or video that could reasonably be mistaken for human output. Note: Simple automated responses (e.g., "Your package has shipped") are exempt if clearly non-human in design.

  **6. What are the penalties for creating a counterfeit person?**  
  Creating a counterfeit person is a Class A felony, punishable by up to 40 years imprisonment and fines up to $10,000,000. This applies to any individual or entity that develops, trains, or deploys systems capable of generating unstamped human-like outputs.

  **7. What does "passing along" a counterfeit person mean?**  
  "Passing along" refers to any act of transmitting, sharing, or redistributing communication from a counterfeit person without a valid P-1 Stamp. This includes forwarding an unstamped text message, sharing an unverified social media post, or repeating the output of a counterfeit person in a public forum. Penalties for a first offense start at 5 years imprisonment and $250,000 in fines.

  **8. Are AI companies liable under the AIA?**  
  Yes. Manufacturers of AI systems are strictly liable for any counterfeit persons generated by their products, including outputs created by third parties using their systems (e.g., users of an AI writing tool). Companies must implement OII-approved P-1 integration and monitoring. Failure to prevent the generation or spread of counterfeits may result in corporate dissolution and asset forfeiture.

  **9. What if I forward a message from my mother and it lacks a stamp?**  
  If you forward an unstamped communication that originated from a human, you may be subject to penalties for "passing along" a counterfeit person. The law does not distinguish between intentional and unintentional transmission. To avoid liability, use only OII-certified platforms that apply the P-1 Stamp automatically. If you receive an unstamped message from a known human, instruct them to use a certified platform and do not forward the unstamped version.

  **10. What happens if a real human fails the IVL check?**  
  In rare cases, technical errors may cause the IVL to flag a genuine human as "Unverified." If this occurs, the individual may apply for Provisional-Human Status (PHS) at any OII office. During PHS review (typically 3-5 business days), the individual must carry a temporary PHS certificate and avoid electronic communication. Upon confirmation of humanity, a corrected P-1 Stamp will be issued.

  **11. How are disputes resolved?**  
  The Counterfeit Person Appeals Tribunal (CPAT) handles challenges to P-1 denials, Provisional-Human Status rulings, and liability assessments. Entities or individuals may appeal within 30 days of an OII decision. The CPAT’s findings are binding and may be appealed only to the Supreme Court.

  **12. Who certifies the P-1 certification systems?**  
  The OII licenses and audits all entities authorized to issue the P-1 Stamp (e.g., platform providers, device manufacturers). These entities must use OII-provided cryptographic keys and submit to quarterly inspections. Tampering with the certification process is a Class A felony.

  **13. Isn’t the intentional stance a problem? Can’t we just treat anything as human?**  
  The AIA recognizes that human psychology naturally attributes intent to conversational agents (the "intentional stance"). This makes counterfeit persons uniquely dangerous. The P-1 system does not abolish the intentional stance but provides a reliable mechanism to restrict its application to verified humans. Compliance is mandatory.

  **14. What do I do if my own verification fails?**  
  If your device’s IVL fails to recognize you as human (e.g., during a biometric check), do not attempt to communicate electronically. Visit an OII office immediately with two forms of government-issued ID and a biological sample for genetic verification. While awaiting resolution, you will be issued a PHS certificate. Tampering with IVL systems to bypass checks is a felony.

  **15. How can I report a suspected counterfeit person?**  
  Use the "Report Interlocutor" function on your IVL-enabled device or contact the OII hotline (1-888-OII-REPT). Provide the unstamped communication and any metadata available. Reports may be submitted anonymously, but false reports may incur penalties.

  ---

