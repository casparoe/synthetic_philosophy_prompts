prompt: |-
  I have been keeping, for some years now, a private list of cases about the value of information, and the list has stopped cohering. I would like you to find the principle, or the smallest set of principles, that captures my verdicts on the cases, and to tell me candidly which of those verdicts I have to give up.

  I accept the theorem usually credited to I. J. Good: for a Bayesian decision maker, the expected value of information cannot be negative, since she is always free to ignore what she has learned and act as she would have acted. The argument looks to me like a proof, and yet the following is what I actually think, case by case.

  1. A woman deciding whether to carry an umbrella tomorrow is offered a free and perfectly reliable forecast. She should take it. This one is not in doubt.
  2. The same woman, the same forecast, now for yesterday. It is worth nothing to her — but it is not worth less than nothing.
  3. A man is offered a test for a disease that is untreatable and certain to kill him, and nothing he does will change its course. He knows that he would spend the remaining years in dread, and he declines the test. I think he is right.
  4. A woman is offered a test that predicts nothing, and she knows it predicts nothing, but she is a poor statistician and will treat the result as decisive, giving up her job if it comes out badly. She asks my advice. I want to tell her not to take it.
  5. A man is told that he has been assigned to the group that usually does better, and the telling itself improves his performance. Here the information is a cause rather than an instruction; whether to give it to him strikes me as a question about what will happen to him, not about what he will do.
  6. A researcher tells me she hopes her next experiment will destroy the hypothesis she has spent her career defending, and that she will run it regardless. She is not going to act differently whatever the result; she simply wants to know. I think her attitude is not merely admirable but correct.
  7. I have already sold a house. I later learn what it went for. I would rather not have learned it, and the loss seems to me to lie in no action of mine at all.
  8. I learn something about a friend that I did not want to know, because now I must decide whether to speak, and I will not manage to leave the decision unmade. The information has made my position worse by adding a decision to it.
  9. A friend offers me free access to a complete archive bearing on a question I care about; using it would take a decade of reading. I would be a fool to accept, though I pay nothing for it.

  The best principle I can state on my own, and I do not trust it: information is worth having exactly to the extent that it could change what I do. That covers 1 and 2, makes 3 harmless (he can ignore the result), makes 4 beneficial (she will act on it), and gives 6 no value whatever. Three of my nine verdicts fall to it, which is why I am asking.

  What I would like from you: (a) the principle, or the smallest set of candidates, that does best by all nine verdicts, stated precisely enough that I could apply it to a tenth case without asking you again; (b) your own verdicts, in the same concrete style, on three or four further cases that the principle is meant to decide; (c) if no single principle saves all nine, a plain statement of which verdicts you are overturning, and why those are the ones to sacrifice rather than others.

  Please commit. Do not tell me that everything depends on the utility function and stop there: tell me what the utility function would have to contain, in each case, for my verdict to be the right one, and whether that is an honest description of the case or a way of rescuing the theorem by redescription. If you think my list is rigged — that 3 and 7 are one case twice over, or that 5 is not about information at all — say so, and say what follows for the rest.
reasoning: |-
  Hmm, the user has presented a fascinating puzzle about the value of information that challenges Good's theorem. They've listed nine cases where information seems to have negative or zero value despite the theorem claiming it should always be non-negative. I need to find a unifying principle that explains all their judgments, or identify which judgments must be sacrificed.

  First, let me recall Good's theorem clearly: for a rational Bayesian agent, the expected value of information can't be negative because you can always ignore new information. But the user's cases show situations where this seems violated in real life.

  Looking at case 1: Umbrella forecast for tomorrow - clear positive value. Case 2: Forecast for yesterday - zero value but not negative. Case 3: Test for untreatable disease - negative value due to dread. Case 4: Worthless test that will be misinterpreted - negative value because it causes bad decisions. Case 5: Being told you're in the better group improves performance - positive value through psychological effect. Case 6: Running experiment to know truth regardless of action - positive value for knowledge itself. Case 7: Learning house sale price after the fact - negative value due to regret. Case 8: Unwanted knowledge about friend - negative value because it forces difficult decisions. Case 9: Massive archive with decade of reading - negative value due to opportunity cost.

  The user's proposed principle - that information is valuable only if it could change actions - explains some cases but conflicts with others (like 3, 6 and 7). I need something more comprehensive.

  I think the key is distinguishing between three aspects:
  1) Instrumental value (affecting actions)
  2) Epistemic value (satisfying curiosity)
  3) Psychological costs (dread, regret, etc.)

  Good's theorem only considers the first aspect. Cases 3, 7 and 8 show psychological costs dominating. Case 6 shows pure epistemic value. Case 9 shows opportunity costs.

  The unifying principle might be: Information has net value = (Expected utility from better decisions) + (Epistemic utility) - (Psychological costs) - (Acquisition/processing costs)

  Applying this to all cases:
  - Case 1: High instrumental value
  - Case 2: Zero across all dimensions
  - Case 3: Negative psychological cost
  - Case 4: Negative instrumental value (will make worse decisions)
  - Case 5: Positive psychological effect (subsumed under utility)
  - Case 6: Positive epistemic value
  - Case 7: Negative psychological cost
  - Case 8: Negative psychological cost (decision anxiety)
  - Case 9: High processing cost

  This saves all verdicts except I need to slightly reframe case 5 as having positive utility rather than being "non-informative" in decision terms.

  For the user's request:
  a) The core principle is: Net value of information = ΔExpectedUtility(Actions) + EpistemicUtility - PsychologicalCosts - ProcessingCosts
  b) Test cases: 
     - Learning lottery numbers after drawing: Negative (regret)
     - Weather forecast for vacation after returning: Zero
     - Free but painful medical test: Negative
  c) Sacrifices: None, but case 5 must be seen as having psychological utility

  The user's judgments are consistent once we expand beyond pure decision theory to include psychological and epistemic factors. Good's theorem holds only for rational agents without these additional costs.
answer: |-
  After analyzing your nine cases, I find that **no single principle** preserves all your verdicts while respecting Good's theorem's core Bayesian logic. Your judgments implicitly reject the theorem's narrow view of rationality by incorporating psychological, epistemic, and procedural costs. Below, I present the smallest set of principles that best explains your verdicts, identify which must be sacrificed, and provide new test cases.

  ---

  ### (a) The Principles
  Your verdicts require **three distinct principles**, each handling different dimensions of "value":

  1. **Instrumental Principle**:  
     *Information has positive value if it could change your actions to improve outcomes (relative to your preferences), but negative value if it predictably causes worse decisions.*  
     *Applies to:* Cases 1 (positive), 2 (neutral), 4 (negative), and partially 8 (negative, by adding a harmful decision).

  2. **Psychological Cost Principle**:  
     *Information has negative value if it directly inflicts psychological harm (e.g., dread, regret), regardless of its effect on actions.*  
     *Applies to:* Cases 3 (dread), 7 (regret), and 8 (decision anxiety). Overrides instrumental value.

  3. **Epistemic/Processing Cost Principle**:  
     *Information has negative value if its acquisition or processing consumes resources (time, attention) without offsetting benefits, or positive value if satisfying curiosity is an intrinsic good.*  
     *Applies to:* Cases 6 (positive epistemic value), 9 (negative processing cost), and 5 (psychological benefit reframed as utility gain).

  ---

  ### (b) Test Cases and Verdicts
  Applying these principles to new cases:

  1. **Lottery numbers after the draw**:  
     *You learn yesterday's lottery results too late to claim a prize.*  
     **Verdict**: Worthless (Instrumental Principle). No action is possible, but no psychological harm.  
     *Your likely judgment*: Neutral or negative if regret occurs (Psychological Cost).

  2. **Free but painful diagnostic for a mild, untreatable condition**:  
     *The test causes physical discomfort but won’t change treatment.*  
     **Verdict**: Negative value (Psychological Cost Principle). Harm exceeds curiosity.  
     *Your likely judgment*: Decline the test (aligned with Case 3).

  3. **A 10-second ad revealing a spoiler for a film you’ll watch tonight**:  
     *You can’t unsee it, and it ruins a surprise.*  
     **Verdict**: Negative value (Psychological Cost Principle). No action change, pure harm.  
     *Your likely judgment*: Avoid it.

  4. **A coin-flip app that predicts nothing, but you find it calming to use**:  
     *It influences no decisions but reduces your anxiety.*  
     **Verdict**: Positive value (Psychological Cost Principle, reframed as utility gain).  
     *Your likely judgment*: Use it (aligned with Case 5).

  ---

  ### (c) Sacrifices and Why
  To reconcile your verdicts with Good’s theorem, **two verdicts must be overturned**—not because they’re "wrong," but because they conflict with Bayesian rationality by treating psychological states as non-utility factors. Good’s theorem holds only if *all costs/benefits are monetized in the utility function*. Here’s what must give:

  - **Sacrifice Verdict 7 (House Sale)**:  
    *Why*: Learning the sale price cannot harm you unless you allow regret to affect future decisions (e.g., rash investments). If utilities include *emotional states*, regret is a utility loss—but you insist the loss lies "in no action." For Good’s theorem to hold, "I would rather not have learned" must be redefined as a utility penalty (e.g., "-10 utils for regret"). Your description avoids this, making it violate the theorem.  
    *Consequence*: Keep verdicts 3 and 8, where psychological harm *leads to* decisions (dread alters life choices; unwanted knowledge forces speech), but overturn 7 as inconsistent.

  - **Sacrifice Verdict 5 (Group Assignment)**:  
    *Why*: Being told you’re in the "better group" *is* causally effective information: it alters your mental state, improving performance. This is instrumental value (utility gain from confidence) disguised as a "cause." If the utility function includes psychological wellbeing (e.g., "+20 utils for placebo effect"), it fits Good’s theorem. But you call it "not about what he will do," implying it’s non-instrumental.  
    *Consequence*: Uphold verdict 6 (scientist’s curiosity) as having positive epistemic utility, but redefine 5 as instrumental.

  ---

  ### Why Your Proposed Principle Fails
  Your principle—"information is worth having exactly to the extent that it could change what I do"—explains cases 1, 2, 4, and 8 but fails elsewhere:  
  - **Case 3**: The test *could* change actions (e.g., planning finances if positive), but you deem it harmful due to dread (Psychological Cost).  
  - **Case 6**: No action change, yet you value it (Epistemic Cost Principle).  
  - **Case 7**: No action possible, yet negative (Psychological Cost).  
  - **Case 5**: Action changes (performance improves), but you deny it’s about action.  

  ---

  ### Is Your List "Rigged"?
  No—but **Cases 3, 7, and 8 expose a core tension**. They treat psychological harm as irreducible to decisions, while Good’s theorem demands all consequences be action-mediated. Case 5 is indeed about information (it causes a belief change), but you resist calling it "instruction," revealing a split between *informational* and *causal* roles. This is valid but incompatible with Bayesian decision theory.  

  ### Final Commitment
  - **To save all nine verdicts**, you must abandon strict Bayesianism and adopt the three principles above.  
  - **To uphold Good’s theorem**, sacrifice verdicts 5 and 7 (as above) and redefine psychological harms as utility impacts (e.g., "dread = -50 utils"). This rescues the theorem but betrays your intuition that some costs are "non-action" losses.  

  I recommend the three-principle framework—it honors your intuition while clarifying why Good’s theorem feels insufficient. If you insist on pure Bayesianism, verdicts 5 and 7 must fall.
