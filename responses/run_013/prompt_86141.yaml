prompt: |-
  I keep going back and forth with a mate about whether you can call a famine a political crime or whether it's just a natural disaster with a body count, and it's dawned on me we're arguing without any agreed test for when a story about a famine is actually any good. So before we go any further, write me the desiderata: what any adequate theory of famine causation has to deliver.

  The cases it has to get right (Bengal in 1943, the Irish famine of the 1840s, the Chinese famine around the Great Leap Forward, the Soviet one in the early thirties, and at least one case where a food crisis was headed off or a famine didn't happen even though the food numbers said it should have), the distinctions it can't collapse (famine vs chronic undernourishment; excess mortality vs food availability decline; cause vs culpability; a policy that intends starvation vs one that simply doesn't care; market failure vs state failure; killing by omission vs killing by commission), and the findings it has to sit consistently with (that the rural landless often starve while grain leaves the region, that mortality clusters among the very young and very old, that the size of the shortfall is a poor predictor of the death toll).

  Two things I especially want in the list. First, it has to force an attribution split: most famines are a natural trigger plus a political amplifier, and the theory needs to say something about the seperate weight of the two rather than defining one out of existence. Second, it has to say what would falsify the political reading -- a genuine food-availability collapse with no excess mortality, say, or a famine under a government with a free press and competitive elections, since the claim that famines don't happen in democracies is doing a lot of quiet work in this debate.

  Then flag any pair of requirements you think can't be met at once, and tell me which single requirement knocks out the most candidates. Finish with a few lines on how the food-availability approach, the entitlement approach, and the "it's political violence" framing fare against the list -- brief, I don't need the full scorecard, I'll do that in the pub.

  For calibration: I want a test sharp enough to decide whether "famine as political crime" is a causal claim or a moral one, not just a description of famines.

  British English please.
reasoning: |-
  Okay, the user is having a debate with a friend about whether famines are political crimes or natural disasters. They want a set of criteria (desiderata) for a good theory of famine causation. I need to address specific cases, distinctions, and findings they mentioned, plus their two special requirements. 

  First, understanding their core request: they need a rigorous framework to evaluate famine theories. The key is creating desiderata that force clarity on the political vs. natural aspects. The user mentioned cases like Bengal 1943 and the Irish famine, so any theory must explain these diverse examples. 

  The distinctions they listed—like famine vs. chronic undernourishment—are crucial. A good theory mustn't blur these lines. For instance, separating cause from culpability is vital for their debate on political crime. Their emphasis on "attribution split" (natural trigger + political amplifier) means the desiderata should explicitly require quantifying each factor's role. 

  The user's second key point is falsifiability of the political reading. They want scenarios that could disprove it, like a famine in a democracy with free press. This is smart because it tests the claim that famines only occur under authoritarian regimes. I should include this as a non-negotiable in the desiderata. 

  Now, assessing conflicts between requirements. For example, demanding both "attribution split" and "falsifiability" might clash if a theory attributes everything to politics, leaving no room for natural factors to "falsify" it. Also, covering all historical cases while maintaining precise distinctions could be tricky—some theories might oversimplify to fit all examples. 

  For the hardest requirement, "falsifiability" likely knocks out most theories. Many political-centric frameworks (like "famine as violence") resist counterexamples, e.g., by redefining democracies as flawed. This requirement exposes vagueness. 

  On existing frameworks: 
  - Food-availability decline (FAD) fails on distinctions (e.g., ignores why some starve amid plenty) and cases like Bengal where food existed but access was politicized. 
  - Entitlement approach (Sen) handles access issues but dodges culpability and struggles with attribution split (downplays triggers). 
  - "Political violence" framing nails intentionality but overreaches—e.g., can't explain non-malevolent policy failures or democracies with famines (if any exist). 

  Finally, the user wants to separate causal vs. moral claims. The desiderata must force theories to show evidence for intent/negligence, not just label famines as "crimes." This sharpens their pub debate. 

  Noticing the user's depth—they're avoiding fuzzy activism by demanding testable rigor. Their examples show they've done homework. I'll keep the tone British ("knock out candidates," "pub") as requested. 

  One tension: Requiring both specific case coverage and universal distinctions might strain theories. Also, "attribution split" could conflict with complex realities where politics and nature intertwine inseparably. But that's the point—forcing theories to confront it. 

  Will structure the reply as bullet points for clarity, flag conflicts, and end with framework assessments. The falsifiability point is the linchpin—it's where theories live or die.
answer: |-
  Here's a distilled set of desiderata for an adequate theory of famine causation, designed to cut through the debate and force analytical rigour:

  **Core Requirements:**
  1.  **Case Coverage:** Must credibly explain:
      *   Bengal (1943): Acute famine despite available aggregate food; market failures & policy neglect.
      *   Ireland (1840s): Colonial extraction & laissez-faire amidst blight; mass mortality & emigration.
      *   China GLF (1958-62): Policy-driven procurement, collapse of reporting, suppression of dissent.
      *   Soviet Famine (1932-33): Forced collectivisation, dekulakisation, denial of crisis.
      *   **Famine Averted:** At least one instance where predicted famine (based on food supply) was prevented by effective intervention (e.g., post-Independence India, Botswana 1980s).

  2.  **Essential Distinctions:** Cannot conflate:
      *   Famine (mass starvation death) vs. Chronic Undernourishment.
      *   Excess Mortality vs. Food Availability Decline (FAD).
      *   Causation (complex processes) vs. Culpability (assigning responsibility).
      *   Intentional Starvation (policy *aiming* to kill) vs. Callous Negligence (policy *ignoring* consequences).
      *   Market Failure (e.g., speculation, hoarding) vs. State Failure (e.g., bad policy, suppression).
      *   Killing by Omission (failing to act) vs. Killing by Commission (actions causing starvation).

  3.  **Empirical Anchors:** Must be consistent with robust findings:
      *   Starvation amidst export/outflow of food from affected region.
      *   Disproportionate mortality among the landless poor, very young, very old.
      *   Weak correlation between the *size* of the food shortfall and the *scale* of mortality.
      *   Importance of disease synergies (e.g., measles in camps).

  4.  **User's Critical Adds:**
      *   **Attribution Split:** **Must explicitly account for both the *trigger* (e.g., drought, blight, war disruption) and the *amplifier* (political/institutional failures).** It must provide a framework (even if qualitative) for assessing their *relative weight* in specific cases, not simply subsume one under the other.
      *   **Falsifiability of Political Reading:** **Must specify what observable evidence would genuinely challenge the claim that "politics was the primary cause/enabler".** Examples:
          *   A massive, demonstrable FAD *without* significant excess mortality due to effective relief.
          *   A major famine occurring under a stable, functional democracy with a free press, competitive elections, and unimpeded relief efforts (i.e., debunking the "democracy prevents famine" axiom used in the debate).
          *   Evidence showing mortality patterns *cannot* be linked to policy choices or institutional failures.

  **Tensions & Knock-Out Blows:**
  *   **Key Tension:** Balancing the **Attribution Split** (requiring separable weights for trigger/amplifier) with the inherent **Complexity & Interdependence** of famine causation in real cases can be analytically challenging. Overly rigid separation might misrepresent reality, while overly holistic approaches fail the split test.
  *   **Hardest Hitter:** **Falsifiability of the Political Reading.** This is the most stringent requirement. Many political economy approaches *assume* politics is central and struggle to define clear counter-evidence. A theory that cannot specify plausible conditions under which its core political argument would be invalidated fails this test decisively. It knocks out vague, unfalsifiable claims that "all famines are political" by definition.

  **Frameworks Against the Desiderata (Brief):**
  1.  **Food Availability Decline (FAD):**
      *   *Fails:* Distinctions (collapses FAD/excess mortality), Case Coverage (Bengal, averted famines), Attribution Split (ignores amplifier), Falsifiability (if FAD is definitional, politics is irrelevant). Knocked out early.
  2.  **Entitlement Approach (Sen):**
      *   *Strengths:* Distinctions (FAD vs. access), Case Coverage (Bengal core), Empirical Anchors (focuses on vulnerable groups).
      *   *Weaknesses:* Attribution Split (underplays triggers, struggles with amplifier weight), Falsifiability (less clear on political counter-evidence), Culpability/Intent (largely agnostic). Needs augmentation for politics.
  3.  **"Famine as Political Violence":**
      *   *Strengths:* Case Coverage (Soviet, GLF), Distinctions (can address intent/omission), Attribution Split (focuses intensely on amplifier).
      *   *Weaknesses:* Falsifiability (often resists counter-evidence, e.g., redefining democracies), Case Coverage (may struggle with Ireland's blend/complexity, averted famines), Distinctions (can blur cause/culpability). Risk of overreach.

  **Calibration Note:** This test forces the "political crime" claim to be more than moral condemnation. A theory meeting these desiderata, *especially* falsifiability and the attribution split, must provide *causal evidence* for culpable political/institutional action (or inaction) as the *necessary amplifier* turning trigger into mass mortality. The moral judgement *follows* the causal analysis of culpability enabled by the framework. The test reveals if "crime" is merely descriptive hyperbole or a substantiated causal/moral conclusion. Now, off to the pub for the scorecard!
