prompt: |-
  I have spent the past year reporting on the argument that the suffering of animals in the wild dwarfs anything in human experience, and that anyone who takes pain seriously has at least to ask whether something should be done about it. My interest is not in the argument itself but in a move I keep meeting when I put it to people, and for which I have never found a name.

  The move runs roughly as follows. My interlocutor accepts the premise without much resistance: yes, the fawn dying of exposure is bad, bad for the fawn. But the question of what follows produces a shift of subject. The answer stops being about the fawn and becomes about us — that we would be the ones doing it, that we do not understand what we would be disturbing, that it is not our place, that good intentions have a poor record. Three features of this seem to me worth separating. First, the objection is about the interveners — their knowledge, their motives, their standing — whereas the concern that prompted it was about the animals. Second, it is applied unevenly: the same person who insists that we cannot know what is good for a system will approve of vaccinating an endangered population, of hauling a whale off a beach, of eradicating rats from an island, of releasing a gene drive to crash a mosquito species. The epistemic humility appears to be reserved for interventions that would benefit the animals themselves. Third, the baseline moves. When the point is that we should not interfere, the wild as it now stands is treated as the state to be preserved; when the point is that some interference is obviously right, the wild as it stood before we arrived is the state to be restored. The privileged baseline seems to be whichever one licenses the verdict already reached.

  What I want from you is not a label but the shape of the thing. Is there an established concept that fits it — something in the neighbourhood of the distinction between doing and allowing, or status quo bias, or the appeal to nature, or the precautionary principle? My difficulty is that each of these seems to catch a part and miss the whole: the doing/allowing distinction says nothing about why the epistemic objection should scale as it does, and the appeal to nature would not explain why the objection is so often framed as a fact about the intervener's standing rather than about the animal's prospects. If nothing existing fits, I would like a term proposed and defined, with the boundaries marked: what it covers, what it excludes, and how it differs from each of those near misses. Does it require that action be genuinely available, or can it also describe the case of someone who could act and simply declines to think about it? And is the assumption that the natural state carries moral weight part of the phenomenon, or a separate error that happens to accompany it?
reasoning: |-
  Okay, the user has been investigating the argument about wild animal suffering and noticed a recurring counterargument pattern. They've described three key features: the shift from animal welfare to human intervention concerns, inconsistent application of epistemic humility, and baseline switching. 

  The user isn't looking for a simple label but wants to understand the structure of this rhetorical move. They've already considered concepts like doing/allowing distinction and precautionary principle but find them incomplete. 

  Hmm... what makes this tricky is how the objection morphs based on desired outcome. When people want to intervene (like saving whales), they treat pre-human ecosystems as the ideal baseline. When they oppose helping suffering wildlife, suddenly the current degraded state becomes sacred. That baseline flexibility is really the smoking gun here.

  The epistemic humility point is particularly revealing - we're supposedly too ignorant to reduce wild suffering, but smart enough to know invasive rat removal won't cause ecological chaos? That selective skepticism suggests the reasoning isn't principled but outcome-driven.

  I recall similar maneuvers in other ethical debates. Like when people oppose life-extending medical research by invoking "natural lifespan" but support natural disaster prevention. The naturalistic fallacy gets weaponized situationally. But here it's more layered because of the added agency dimension - "it's not our role" versus "we broke it so we fix it."

  The closest existing concept might be moral licensing, but that usually refers to past good deeds excusing current bad behavior. This is more like... moral jurisdiction shopping? Choosing whichever ethical framework validates predetermined conclusions. 

  Perhaps "teleological baseline selection" could work - picking historical reference points based on desired ends. But that sounds too academic. More accessibly: "convenient ecology" - treating ecological states as morally privileged only when convenient for one's position.
answer: |-
  Based on your detailed description, the phenomenon you're encountering is a complex cognitive-ethical maneuver that blends several established concepts but doesn't fit perfectly under a single existing term. I propose the concept of **"Intervention-Selection Bias"** or **"Selective Intervention Permissibility"** (SIP) to capture its core structure.

  ### Core Definition of SIP
  **Selective Intervention Permissibility (SIP)** is a justificatory pattern where:  
  1. Opposition to interventions *aimed at reducing natural suffering* defaults to objections about human limitations (knowledge, standing, unintended consequences), while  
  2. Identical objections are waived for interventions *serving other values* (biodiversity conservation, human interests, ecosystem restoration),  
  3. Enabled by flexible baseline selection that privileges whichever ecological state aligns with the desired outcome.

  ---

  ### Breaking Down the Three Features Within SIP
  1. **Agent-Centric Deflection**  
     - **What it is:** Shifting focus from the *recipient* (animal suffering) to the *intervener* (human flaws).  
     - **Why SIP?** Differs from simple "appeal to nature" by emphasizing *human inadequacy* rather than inherent value in natural processes.  

  2. **Asymmetric Epistemic Scrutiny**  
     - **What it is:** Demanding impossible certainty for suffering-reduction interventions ("We can't predict ecosystem effects!") while accepting uncertainty in conservation ("Eradicating rats *might* have side effects, but we do it anyway").  
     - **Why SIP?** The precautionary principle applies universally; SIP selectively *intensifies* it based on intervention goals.  

  3. **Baseline Arbitrage**  
     - **What it is:** Toggling between:  
       - *Status quo baseline* (current suffering is "natural," so don't interfere)  
       - *Pre-human baseline* ("pristine" ecosystems must be restored)  
     - **Why SIP?** Status quo bias and restoration bias are weaponized *opportunistically* to block or enable interventions.  

  ---

  ### How SIP Differs From "Near Miss" Concepts
  | Concept             | How It Relates to SIP                                     | Where It Falls Short                               |
  |---------------------|-----------------------------------------------------------|----------------------------------------------------|
  | **Doing vs. Allowing** | SIP often opposes "doing" (intervening) | Doesn't explain *why* objections target *only certain doings* (e.g., vaccinating deer vs. vaccinating pets). |
  | **Status Quo Bias**  | SIP uses current state to block suffering-reduction | Fails to explain why the bias *vanishes* for conservation (e.g., eradicating invasives alters status quo). |
  | **Appeal to Nature** | SIP often invokes "natural order" | Doesn't capture the *asymmetric agency focus* or *baseline switching*. |
  | **Precautionary Principle** | SIP amplifies precaution for suffering-reduction | Ignores that SIP *waives precaution* for other interventions. |
  | **Moral Licensing** | Resembles "license" to ignore suffering | SIP is more about *justifying inaction* than compensating for prior virtue. |

  ---

  ### Boundaries and Nuances
  1. **When does SIP apply?**  
     - Requires *available intervention options* (e.g., tech/feasibility to aid wild animals).  
     - Also applies to *deliberate refusal to consider action* ("It’s not our role to even think about this").  

  2. **Role of "Natural State" Moral Weight:**  
     - The belief that "natural=good" is often *recruited* by SIP but is not essential. SIP’s core is the *strategic inconsistency* in applying objections. One could reject naturalistic fallacy and still deploy SIP.  

  3. **Exclusions:**  
     - Consistent opposition to *all* intervention (e.g., deep ecology) isn’t SIP.  
     - Genuine case-specific uncertainty (e.g., "This *particular* gene drive is too risky") isn’t SIP if applied evenly.  

  ---

  ### Why "Selective Intervention Permissibility" Fits
  - **"Selective"**: Captures asymmetric application of epistemic/moral standards.  
  - **"Intervention Permissibility"**: Highlights the core conflict over *when* humans may ethically act.  
  - **Encodes the baseline switch**: "Permissibility" implies context-dependent criteria, mirroring baseline arbitrage.  

  This framework explains why your interlocutors can simultaneously hold:  
  > *"We must never interfere in nature (when lions eat gazelles) but must urgently interfere (to save beached whales or eradicate invasive species)."*  

  The inconsistency isn't random—it’s *systematically selective* based on the intervention’s perceived alignment with tacitly privileged values (ecosystem integrity, human responsibility for damage, charismatic species) over wild individual suffering. SIP is the cognitive toolkit that makes this dissonance feel like coherence.
