  The waiting-time paradox analogy is particularly telling. They understand that observing a duration (e.g., bus wait) inherently biases toward longer intervals, but only if the process generating intervals exists independently. In anthropics, there's no external "bus schedule" - the schedule and the observation are entangled. This might be the irreducible residue they're sensing.

