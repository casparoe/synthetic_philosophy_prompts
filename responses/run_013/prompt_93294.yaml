prompt: |-
  I sit on a hiring/promotion committee and it's slowly driving me nuts. We all treat citation counts and journal prestige as the main currency for judging researchers -- but the same comittee insists on "arm's-length" referees, frets about citation rings and coercive self-citation, and treats each citation as a little signal of quality. That seems to presuppose something about how those numbers get made: that the citing papers are more or less independent bits of evidence, and that the total is a wisdom-of-crowds kind of thing. But if the herding/cascade literature is right, a lot of those citations are one early signal echoing around, so the count isn't independent corroboration at all.

  So what theory of evidence, testimony, or aggregation does citation-based evaluation actually presuppose? Separate what it strictly needs from what it merely fits well with -- maybe it only needs the number to correlate with quality well enough to be a cheap, hard-to-game proxy and never needed independence in the first place. Which rival views does the practice quietly rule out? And if we really took the cascade picture seriously, what would concretely have to change?

  Take a definite position, don't just lay out the options and leave it to me. Give it to me as a JSON object with these fields: implicit_theory (the view the practice presupposes, 3-5 sentences); strictly_presupposed (list); merely_fits (list); rules_out (list); internal_tension (the independent-referee thing vs. raw counts); underdetermination (where several theories would license the same practice); verdict (one sentence: which theory it really presupposes and whether that's defensible); changes_if_replaced (2-4 concrete changes); confidence (0-1); likeliest_way_im_wrong (one sentence).
reasoning: |-
  Hmm, the user is on a hiring committee and is frustrated with how they rely on citation counts and journal prestige to evaluate researchers, even while worrying about things like citation rings and coercive self-citation. They're pointing out a contradiction: the committee treats citations as independent signals of quality, like a wisdom-of-crowds effect, but research on herding and cascades suggests many citations are just echoes of early influences, not independent corroboration.

  I need to analyze what theory of evidence this practice presupposes. The user wants me to take a definite position, not just outline options. They're asking for a JSON object with specific fields, so I have to structure my response accordingly.

  The implicit theory behind citation-based evaluation seems to be a naive aggregative model. It assumes that citations are independent judgments of quality that add up to a reliable measure. This fits with a Condorcet jury theorem or wisdom-of-crowds view where many independent voices converge on truth. But this independence is precisely what the herding literature challenges.

  For the strictly_presupposed list, I'll include independence of citations and the idea that citations reflect quality. The merely_fits list could include the wisdom-of-crowds analogy and journal prestige as a filter. The rules_out list should cover theories that emphasize cascades, path dependence, or social construction.

  There's an internal tension between wanting independent referees (who might spot gaming) while relying on citation counts that may not be independent. The underdetermination field should note that other theories like Bayesian updating could justify the practice to some extent.

  My verdict should be clear: the practice presupposes independence but isn't defensible because evidence shows cascades happen. If we took cascades seriously, we'd need concrete changes like evaluating citation context and patterns, or using alternative metrics.

  For confidence, I'll go with 0.9 since the evidence for herding is strong, but I should acknowledge that in some fields citations might be more independent. The likeliest way I'm wrong is if citations in the user's field are more independent than average.

  I'll make sure my JSON response is well-structured and addresses all the requested fields while providing a strong, evidence-based position.
