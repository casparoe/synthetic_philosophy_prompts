    "underdetermination": "The practice *could* be justified under a purely instrumentalist view ('it correlates well enough with quality for our purposes, regardless of mechanism') or a Bayesian updating model ('each citation slightly updates my prior, even if dependent'). It doesn't *require* strict independence, but its standard defense and intuitive appeal rely on it.",
    "verdict": "The practice **strictly presupposes citation independence (rejecting cascade models) but this is indefensible** given robust evidence of herding, path dependency, and social bias in citation behavior; it persists due to underdetermination (the instrumentalist justification) and institutional inertia.",
    "changes_if_replaced": [
