  **Key Rationale:**
  *   **Presupposition of Independence:** The core tension you identify – fretting about non-independence (rings, coercion) while treating counts as corroborative evidence – exposes that the practice *logically requires* citations to be independent signals to function as perceived "wisdom of crowds." If cascades dominate, the count is an echo, not corroboration. The committee's anxiety about gaming reveals its intuitive (but unacknowledged) dependence on this independence.
  *   **Indefensibility:** Empirical work on citation dynamics (e.g., Simkin & Roychowdhury on "citation copying," studies on preferential attachment in networks) strongly undermines the independence assumption. Cascades, the Matthew Effect, and social biases *are* significant factors.
  *   **Why it Persists (Underdetermination):** The practice survives because citations *do* often correlate with impact/quality (even if causally messy), and it's administratively convenient. An instrumentalist ("it works well enough") view allows committees to bypass the philosophical tension you've identified.
  *   **Concrete Changes:** Moving beyond raw counts requires tools and effort to discern *meaningful* influence (network analysis) and prioritize direct assessment of substance over easily quantified proxies (deep reading, narrative impact statements). Reducing reliance on journal prestige directly challenges the "independent filter" justification.
