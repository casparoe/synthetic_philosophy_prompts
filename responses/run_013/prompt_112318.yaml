prompt: |-
  I run an evening continuing-education course in a science-and-society programme, and next week's ninety-minute session is on whether DNA really is a code, or carries information in any sense worth the name. My students are mostly software engineers and product managers with no biology since school. They are quick, they argue, and they arrive already convinced that DNA is code and genes are programs. I do not want you to explain the topic to me. I want a teaching plan.

  Set out the order in which the components of the idea must be introduced, and say why each depends on the one before it. Identify the single example that should carry the whole session, and spell out what that example must have and what it must lack if it is to do its work. I have a hunch that it should be a case in which one and the same stretch of DNA yields different products in different cellular contexts, but tell me whether that is right; and if a different example would carry the session better, say so and say why. The codon table and the central-dogma arrow diagram are not to do the carrying — diagnose for me why they would fail. List the misconceptions the students will bring or will form, and give the exact point in the sequence at which each should be headed off. Tell me the one question to ask at the end that would show the idea has landed rather than merely been recognised. And tell me what to leave out at this level, saying openly that I am leaving it out.

  The plan must get across the following, and must make the dependencies among them explicit: the difference between information in a plain difference-making sense and information in a content-bearing sense that presupposes a sender, a receiver and a code; the arbitrariness of the genetic code and its dependence on the translation machinery, so that the mapping is not a property of the DNA itself; the resulting thought that sequence-specific causation is real while content-bearing information is either absent from the DNA or conferred on it from outside; and the parity point that DNA is one causal factor among many in development, so that any privilege it enjoys needs an argument. There is also a moment, I suspect, when the students will decide the whole question is merely verbal; work out where that moment falls and how to convert it into the real question.

  Do not give me readings, references or citations; there is no internet in the room and I am not asking for a bibliography. Write in British English. Finish by saying how confident you are in the plan and naming the single claim in it about which you are least confident.
reasoning: |-
  Hmm, the user is teaching a science-and-society course for software engineers and product managers with limited biology knowledge. They're already convinced DNA is code, so my teaching plan needs to challenge that without overwhelming them. The key is to shift their perspective from DNA as "code" to DNA as one causal factor among many.

  The user wants a structured sequence where each concept builds on the previous one. They suspect an example where the same DNA produces different outcomes in different contexts would work well. I agree - it demonstrates context-dependence better than the codon table or central dogma, which they've banned because those reinforce the "code" misconception by making translation look mechanical.

  The core challenge is distinguishing between difference-making information (causal role) and content-bearing information (meaning requiring sender/receiver). The plan must show that DNA's "meaning" comes from cellular machinery, not inherent properties. 

  For the central example, I'll use alternative splicing in the DSCAM gene - same DNA sequence produces 38,000+ protein variants. This works because: 1) it's empirically real, 2) shows outcome depends on cellular context (splicing factors), 3) lacks fixed mapping between sequence and product. Crucially, it lacks a single "decoder" - different cell types interpret the same sequence differently.

  Major misconceptions to address:
  - "DNA contains instructions" (head off by showing proteins determine how DNA is read)
  - "Mutations are like corrupted code" (counter with splicing example showing variation isn't "corruption")
  - "Central dogma implies one-to-one mapping" (show splicing breaks this)

  The pivotal moment comes after showing context-dependence, when students might dismiss this as semantics. That's when to reframe: "If meaning isn't in DNA, where does it come from, and what consequences follow?"

  I'll end with a diagnostic question: "Why is a nonsense mutation harmful?" Correct answer references tRNA/ribosomes making it harmful, not the DNA itself. This tests if they grasp the external machinery's role.

  Need to omit: epigenetics (too complex), evolution of genetic code (distracts), detailed transcription mechanics. Focus stays on translation/splicing.

  Least confident about whether alternative splicing alone sufficiently demonstrates arbitrariness. Some might still see splicing factors as "executing DNA's program." But showing how environmental signals influence splicing should help undermine that.

  Overall confidence: 8/10. The sequence logically builds the case, and DSCAM is a strong example. Just need tight facilitation when the semantic dismissal moment hits.
answer: |-
  Here is a teaching plan structured to build the necessary concepts sequentially, challenge preconceptions, and centre on a powerful example:

  **Teaching Plan: Is DNA Really a Code?**

  **Core Objective:** To problematise the uncritical analogy of DNA as "code" or "information" in the computational sense, demonstrating it is a context-dependent causal factor, not a self-contained program.

  **Targeted Misconceptions Students Bring:**
  1.  DNA *is* code, like software (it inherently contains instructions/meaning).
  2.  Genes *are* programs (autonomous units of function).
  3.  The cell *executes* the DNA program.
  4.  Sequence variation (e.g., mutation) directly *means* something corrupted (like a bug).
  5.  DNA is the privileged "master controller" of the cell.

  **Central Example: Alternative Splicing (e.g., human DSCAM gene)**
  *   **Why it Carries the Session:** It vividly demonstrates that **the same DNA sequence yields different molecular products (proteins) depending on cellular context (presence/activity of specific splicing factors)**. This breaks the direct, fixed mapping essential to the "code/program" analogy.
  *   **What it Must Have:**
      *   A single, defined stretch of DNA (a gene).
      *   Multiple, functionally distinct molecular outputs (protein isoforms).
      *   Demonstrable dependence on factors *external* to the DNA sequence itself (splicing machinery, regulatory signals) to determine *which* output is produced.
  *   **What it Must Lack:**
      *   A single, predetermined output dictated solely by the DNA sequence.
      *   A fixed, immutable mapping between specific nucleotide sequence "characters/words" and a single functional outcome. The "meaning" (which protein is made) changes with context.
  *   **Why Your Hunch is Right:** Yes, a "same DNA, different outcomes" example is essential. Alternative splicing is ideal as it's widespread, well-understood, and directly challenges the "DNA sequence = fixed instruction" view.

  **Why Codon Table & Central Dogma Diagram Fail:**
  *   **Codon Table:** Reinforces the "fixed code" misconception. It presents an arbitrary but *static* mapping. Students will see it as proof DNA *is* a code dictionary, missing that the mapping machinery (tRNA, ribosomes) is external and biological, not abstract.
  *   **Central Dogma Arrow (DNA -> RNA -> Protein):** Implies a simple, deterministic, linear flow of "information" *from* DNA *to* the rest of the cell. It obscures the massive context-dependence, regulation, feedback loops, and the role of existing cellular machinery at every step. It visually privileges DNA as the source.

  **Sequence of Components (90 mins approx.):**

  1.  **Grounding "Information" (15 mins):**
      *   **Activity:** Quick brainstorm: "What do we mean by 'information' in everyday life and in computing?" Elicit examples (book, email, software code, sensor data).
      *   **Key Point:** Distinguish **Difference-Making Information** (Signal A causes different outcome than Signal B - e.g., light switch position) vs. **Content-Bearing Information** (Requires a *sender's intent*, a *receiver's interpretation*, and a *shared code/convention* - e.g., this email text 'means' a meeting request).
      *   **Why First?** Establishes the crucial conceptual distinction. Students default to content-bearing information for DNA; we need to question if that applies.
      *   **Misconception Head-Off:** Immediately state: "Today we ask if DNA uses information in the *second* sense (like code), or only the *first* (like a switch)."

  2.  **DNA as a Physical Cause (20 mins):**
      *   **Activity:** Briefly recap DNA structure (nucleotides A,T,C,G). Emphasise DNA is a chemical *molecule* with specific binding properties (e.g., base-pairing).
      *   **Key Point:** DNA acts as a **sequence-specific physical cause**. Its shape/sequence allows specific interactions (e.g., transcription factor binding, primer binding in PCR). This is **Difference-Making Information**.
      *   **Example:** Contrast a specific promoter sequence (binds TF, gets transcribed) vs. a random sequence (doesn't). The sequence *makes a difference* to outcomes.
      *   **Why Here?** Builds from the basic definition. Establishes DNA *does* something concrete without needing "meaning".
      *   **Misconception Head-Off:** Preempts "But it obviously *does* something!" by agreeing, but framing it causally, not semantically.

  3.  **The Illusion of the Code: Translation & Arbitrariness (20 mins):**
      *   **Activity:** *Briefly* mention translation (DNA -> RNA -> Protein). **Crucially, focus NOT on the codon table itself, but on the MACHINERY.**
      *   **Key Point:** The mapping of codon (e.g., AUG) to amino acid (Methionine) is **arbitrary**. There's no chemical reason AUG *must* mean Met. It's a fact of evolutionary history. The *meaning* (which amino acid) is determined by the tRNA molecules and the ribosome **present in the cell**. Change the tRNA (e.g., in a lab or via mutation), and you change the "meaning" of the codon.
      *   **Why Here?** Introduces the need for external machinery ("receiver") to establish any "code-like" mapping. DNA sequence alone doesn't specify its own interpretation. Leads directly to context-dependence.
      *   **Misconception Head-Off:** Counteracts "The codon table *proves* it's a code!" by showing the mapping is imposed by cellular machinery, not inherent to DNA. "If the machinery changes, the 'meaning' changes."

  4.  **The Central Example: Context is King - Alternative Splicing (25 mins)**
      *   **Activity:** Introduce the chosen gene (e.g., DSCAM). Show the gene diagram with multiple exons/introns. Explain that the primary RNA transcript can be spliced together in many different combinations. Show diagrams of different resulting protein isoforms (mention their different functions briefly).
      *   **Key Point:** **The *same* DNA sequence yields *different* proteins.** Which isoform is produced depends *entirely* on **context**: which splicing factors (proteins!) are present/active in *this specific cell type*, at *this specific time*, potentially influenced by *signals from outside the cell*. The DNA sequence provides options; the cellular context *interprets* it.
      *   **Why Here?** This is the core challenge to the "DNA as self-contained program" view. It demonstrates the *dependence* of "meaning" (which functional output) on external factors. DNA is a *resource*, not an *executive controller*. It embodies the **parity point** – splicing factors are just as crucial as DNA for determining the outcome.
      *   **Misconception Head-Off:** Directly counters "Genes are programs" and "DNA is the master controller". Shows DNA's "output" is contingent. Addresses the semantic shift: "Is the DNA *instructing* the splicing or is the splicing machinery *interpreting* the DNA based on context?"

  5.  **Synthesis & The Verbal Question Moment (10 mins):**
      *   **Activity:** Recap the sequence: Difference-making (real) vs Content-bearing (questionable); DNA as physical cause; Arbitrariness requiring external machinery; Context-dependence shattering fixed meaning (Splicing example).
      *   **The Moment:** Students will likely now think, "So it's *just* a semantics argument about the word 'code' or 'information'." **Convert this:** "Exactly! The key question isn't *if* we *can* use the word 'code' loosely, but **does calling DNA a 'code' or saying it 'contains information' accurately reflect its causal role in the cell, or does it mislead us into over-privileging DNA and misunderstanding how development actually works?** What consequences does this analogy have?"
      *   **Why Here?** After seeing the context-dependence, the limitations of the analogy become stark. Reframing the question moves it from "Is the word right?" to "What does this analogy *do* to our understanding?".
      *   **The Parity Point Reinforced:** Emphasise DNA is one essential component, but so are RNAs, proteins, metabolites, membranes, environmental signals. No outcome is determined by DNA alone. Its apparent privilege needs justification (e.g., stability, mutability), not assumption.

  **The Diagnostic Question (To Show Understanding Landed):**
  *   **Ask:** "**Why is a nonsense mutation harmful?**"
  *   **Why it Works:** A shallow answer: "It corrupts the code/stops the protein." The landed answer grasps the dependencies: **"It introduces a 'stop' codon where there shouldn't be one. The harm occurs because the cellular translation machinery *interprets* that codon as a stop signal using its tRNAs and ribosomes, leading to a truncated, non-functional protein. The DNA change *causes* this, but the 'meaning' (stop signal) is conferred by the machinery."**

  **What to Leave Out (Explicitly State):**
  *   "We are leaving out detailed molecular mechanisms (e.g., exact splicing biochemistry, transcription initiation complexes)."
  *   "We are leaving out epigenetics (DNA methylation, histone mods) – though it reinforces context-dependence, it adds complexity."
  *   "We are leaving out the evolutionary origin of the genetic code and splicing machinery."
  *   "We are leaving out detailed arguments about semiotics or philosophy of information beyond our core distinction. We are focusing on the biological causality."

  **Confidence & Least Confident Claim:**
  *   **Overall Confidence:** 8/10. The sequence logically builds the argument, the splicing example is powerful, and directly targets the key misconceptions of this audience.
  *   **Least Confident Claim:** The assertion that "**DNA sequence alone doesn't specify its own interpretation**" (Step 3) might be initially resisted as hair-splitting by students deeply embedded in the code metaphor. While demonstrably true (via tRNA example), its full significance only lands with the splicing example. Be prepared to reinforce this strongly in the transition to Step 4.
