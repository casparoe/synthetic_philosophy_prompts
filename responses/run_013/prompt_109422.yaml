answer: |-
  ## The two accounts
  The structural account posits that letter identity derives from invariant topological features: an 'a' must possess specific abstract relationships like a closed counter connected to a stem at defined junctions, resulting in a fixed terminal count. Identity is binary—a shape either perfectly instantiates this skeletal structure or it doesn't. Consequently, legibility should fail abruptly if a critical structural element (like closing the counter) is violated. The prototype account rejects a fixed core, proposing instead that 'a'-ness is a matter of graded similarity to a learned statistical average ("prototype") within a multidimensional perceptual feature space (e.g., curvature, stroke angles, aspect ratios). Crucially, the relevant features and their relative importance (weight) are learned from exposure to a community's writing. This creates a "deformation budget": high tolerance for variation along some dimensions (e.g., serif style), but extreme sensitivity along others (e.g., counter closure). Identity is probabilistic, not absolute.

  ## The three phenomena
  *   **(a) Wildly stylized 'a':** The prototype account explains this readily: the stylization falls well within the learned deformation budget for unimportant features (e.g., extreme flourishes, unusual serifs) while preserving critical features (counter closure, stem connection). The structural account struggles, as extreme stylization often distorts the "pure" skeleton; it must argue the abstract structure persists despite surface noise, which seems post-hoc.
  *   **(b) Tiny vs. large deformations:** This strongly favors the prototype account. Its weighted feature space predicts that a minuscule change to a *highly weighted* feature (e.g., a tiny gap breaking counter closure) can destroy legibility ("almost none along others"), while large changes to *low-weighted* features (e.g., drastic stem curvature or width variation) are tolerated ("unlimited slack along some dimensions"). The structural account expects all critical features to be equally vital, predicting legibility should collapse under *any* significant structural breach, not specifically tiny ones on key dimensions.
  *   **(c) Dissimilar historical 'a's (e.g., Roman vs. Carolingian):** Both accounts face challenges. The structuralist must argue radically different shapes (e.g., single-storey vs. double-storey 'a') share an elusive abstract core, which seems strained. The prototype struggles as the central tendencies (prototypes) for these scripts are vastly separated in feature space. However, the prototype account can appeal to learning *multiple* context-dependent prototypes (one per script/era) and recognizing similarity to the *relevant* prototype based on context clues. The structural account offers no such flexibility. Ultimately, both need supplementation to explain why these distinct shapes are *categorically* deemed the same letter across history.

  ## Rivals or complements?
  While presented as rivals, the accounts are best seen as complementary descriptions operating at different levels. The structural account captures a powerful intuition about critical relational features that often define the letter's core function (like an enclosed counter distinguishing 'a' from 'o' or 'd'). However, it is too rigid to handle the fluidity of real-world recognition. The prototype account provides a superior computational model for the graded, context-sensitive, learned nature of perception, explaining tolerance and sensitivity. Yet, the "features" used in prototype similarity often implicitly or explicitly *include* structural relationships (like junction types). Thus, the critical structural elements identified by the first account likely form key dimensions within the prototype's feature space, heavily weighted through learning. The prototype framework subsumes the structural insights within a more flexible, probabilistic mechanism.

  ## Verdict
  Neither account alone is fully sufficient. The prototype account demonstrably handles phenomena (a), (b), and partially (c) more effectively than the structural account, making it the superior *perceptual* model. However, both critically require a **further ingredient: social-historical convention**. The identity of a letter across wildly dissimilar forms (phenomenon c) or even within a script is not solely a fact of form or perception. It is fundamentally anchored in a shared cultural agreement about symbolic equivalence over time and space. Perception tracks these socially defined categories, learning the relevant prototypes or structural cues *for the agreed-upon symbol*. Thus, while prototype theory best explains the perceptual mechanics, letter identity itself is ultimately a social convention that perception and cognition are adapted to recognize within learned constraints.
