  The structural explanation seems elegant for phenomenon (c) - it can argue that historical 'a' variants share the same abstract junction pattern despite surface differences. But it struggles with (a) and (b); how could wildly distorted letters remain instantly readable if they break the core structure? And why would minor deformations sometimes destroy legibility more than major ones? The prototype model handles these better through its weighted feature dimensions and deformation budgets.

  For phenomenon (b), I recall how moving a serif can obliterate legibility while complete font changes don't - that screams prototype weights. The historical variation in (c) actually challenges both theories equally though; neither fully explains why we perceive structurally dissimilar shapes as the same letter without invoking cultural convention.

  This makes me think they're not true rivals. The structural skeleton might form the initial perceptual anchor that prototype learning then refines with community-specific weights. Neither captures how letter identity persists across scripts - that requires recognizing cultural convention as primary, with perception merely tracking socially agreed boundaries.

