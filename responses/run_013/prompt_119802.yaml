prompt: |-
  Ok, I keep going back and fourth on this. The standard econ-y story is that weakness of will just is present bias -- hyperbolic discounting, where you prefer the later reward while both are far off and then flip once the earlier one is close. I want you to argue that this is the wrong model of akrasia. The line I want: discounting explains a change of preference (a reversal), but akrasia is acting against a judgment you still hold, so it explains the wrong phenomenon. Then press it with the commitment case: if it were only present bias, a sophisticated agent who anticipates her own flip would just precommit (block the site, freeze the card, hand the cookies to a neighbor), so the telling cases are the ones where precommitment is cheap and available and she still caves -- which points to a failure of will or self-governance rather than of preference. If I'm conflating preference reversal with weakness of will in a way that sinks the whole thing, say so flat out instead of arguing it for me.
