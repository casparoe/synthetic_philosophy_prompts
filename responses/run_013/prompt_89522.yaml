prompt: |-
  You are an intellectual historian of Victorian Britain who works closely with social theory: you know the nineteenth-century English boarding school from the inside, and you know Foucault's analytics of power well enough to use it rather than merely recite it. I want a case analysis, not a survey of the literature. Think the mapping through before you write — set out for yourself, in rough form, who observes whom, where the norm is set, what functions as the examination, and what the institution's product is supposed to be — and then give me the finished analysis.

  The episode is the remaking of the English public schools between the 1820s and the 1860s. The salient facts, so that we are working from the same material: Thomas Arnold was headmaster of Rugby from 1828 to 1841, and his most consequential innovation was the praepostor system, under which sixth-form boys were given authority over almost every part of school life while the headmaster governed from behind it. Around that core sat the rest of the apparatus — chapel, dormitories and fagging, the classical curriculum and the form, prizes, flogging, and eventually organised games — and the system's self-portrait is Thomas Hughes's Tom Brown's School Days (1857), in which Arnold is the unseen governor, the bully Flashman is the visible pathology, and a boy's moral progress is measured by whether he has internalised the school's opinion of him. The Clarendon Commission, sitting from 1861 to 1864, praised the nine great schools in its report for 'their capacity to govern others and control themselves'; the Public Schools Act followed in 1868, and the model was exported across the empire.

  Analyse this through Foucault's account of disciplinary power: hierarchical observation, normalising judgement, the examination, docile bodies, and power understood as productive rather than merely repressive. Note that the boarding school is not one of his central exhibits — he tends to treat the school in passing, alongside the barracks and the workshop — so you cannot simply reproduce a reading he has already given.

  I want the analysis to run in both directions. First the mapping: say what the framework makes visible that a plain institutional history would miss, and be specific about the mechanics rather than gesturing at panopticism. Then the strains, and press hardest on three. (i) The output of this discipline appears to be not docility but command: the institution advertises itself as a nursery of rulers, and the boys it disciplines are being trained precisely to discipline others. (ii) The observation is mutual and peer-run, with the senior boys as the instruments of the norm rather than its objects, so the model of a single inspecting gaze seems to misdescribe the structure. (iii) The whole apparatus was bought and chosen by parents rather than imposed on a captive population, and the boys' own culture — fagging, bullying, rioting — is internal to the system rather than resistance to it. Having pressed those, tell me whether the anomaly is fatal to the framework, already anticipated by it (Foucault's own claim that discipline augments a body's force in economic terms while diminishing it in political terms may be exactly what is happening here), or evidence that the framework needs something outside itself — the family, the market, class reproduction — to explain this case at all.

  Then close the loop: does the episode confirm the theory, force a refinement of it, or present it with a case it never anticipated? And say what evidence would count against the reading you have given.

  Be committed. Take a definite position on each of those questions and defend it, rather than laying the options out and leaving me to choose; where the material genuinely underdetermines the answer, say so and say which way you would still lean. No citations, quotations or reading lists — reason from the material above. Flag explicitly which parts of your analysis you hold most loosely, and why.
