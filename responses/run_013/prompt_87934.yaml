answer: |-
  ## Ghazal: On Heaps and Wholes

  These parched stones on the plain refuse to blend,
  Each stands alone, untouched, where the wind begins.

  Shifting dunes claim kinship with the scattered sand,
  Each grain a part of mountains, where the wind begins.

  This sudden bloom, a single thirst in desert heat,
  Roots weaving one green cry, where the wind begins.

  The cracked earth holds no secret law or plan,
  Why fissures form or cease, where the wind begins.

  That distant ridge dissolves in shimmering haze,
  Is it one line or many? Where the wind begins.

  This ink dries slowly, mark by separate mark,
  One poem here, or fading stains? Where the wind begins.

  ---

  **Form & Argument Breakdown:**

  1.  **Nihilism (Composition Never Occurs):** *"These parched stones... refuse to blend, Each stands alone..."* (No whole, just parts).
  2.  **Universalism (Composition Occurs Everywhere):** *"Shifting dunes claim kinship with the scattered sand, Each grain a part of mountains..."* (Any parts form a whole - dunes, mountains).
  3.  **Organicism (Only When Swept into a Single Life):** *"This sudden bloom, a single thirst... Roots weaving one green cry..."* (Composition requires unified life/function).
  4.  **Brutalism (No Informative Rule, Brute Fact):** *"The cracked earth holds no secret law or plan, Why fissures form or cease..."* (Composition happens without explanation).
  5.  **Vagueness (Any Rule Has Borderline Cases):** *"That distant ridge dissolves in shimmering haze, Is it one line or many?..."* (Indeterminacy at the edges).
  6.  **The Poem Itself / Autonomy vs. Unity:** *"This ink dries slowly, mark by separate mark, One poem here, or fading stains?..."* (Directly questions if the couplets compose a single poem, mirroring the SCQ).
  7.  **Formal Unifiers:**
      *   **Radif (Refrain):** *"where the wind begins"* - A subtle, pervasive force (like composition? like poetic unity?) that touches each scene but doesn't definitively *make* it one thing.
      *   **Qaafiya (Monorhyme):** *"blend/sand/thirst/plan/haze/mark"* - The recurring "-nd" sound connects the couplets technically, like a formal property shared by parts.
      *   **Couplet Autonomy:** Each couplet presents a complete, independent image/scene/theory. Read alone, they are just six distinct thoughts/images.

  **Achieving the Goals:**

  *   **Philosophical Recognition:** A philosopher familiar with the SCQ debate (e.g., van Inwagen, Merricks, Sider, Lewis) should readily map the images to the competing theories.
  *   **Readerly Uncertainty:** A non-philosopher experiences six vivid, somewhat related desert scenes held together only by the recurring phrase and rhyme. The final question leaves them genuinely unsure: is this one coherent poem about unity, or just six beautiful fragments placed together? The "wind" and the rhyme *suggest* unity, but the autonomy of the couplets *undermines* it.
  *   **Form Does the Arguing:** The ghazal's inherent tension between couplet independence and refrain/rhyme unity *perfectly* embodies the SCQ. The poem *is* the argument about composition. The refusal to settle the final question ("One poem here, or fading stains?") is crucial.
  *   **Imagery over Thesis:** Each theory is presented as a concrete, evocative scene (stones, dunes, bloom, cracked earth, hazy ridge, drying ink), not an abstract statement.
