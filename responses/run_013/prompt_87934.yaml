  The refrain "where the wind begins" needs double duty: literally describing scenes while hinting at composition's elusive starting point. Rhyme words will anchor each couplet to "begins" - sins/shins/thins/etc. Must maintain strict ghazal form: autonomous couplets, consistent meter. 

