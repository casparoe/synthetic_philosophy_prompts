prompt: |-
  I've got a puzzle about hard choices that I can't shake, and I can't tell if it has a name or if I'm just being sloppy about value arithmetic. Two options, A and B. I can't say A is better than B, and I can't say B is better than A, so I've been calling it a tie. Then I noticed the tie breaks under a small improvement. Take A and improve it a little in some respect that's unambiguously an improvement -- more money, slightly better hours, whatever -- and call that A+. A+ is clearly better than A. But A+ doesn't seem better than B either. And if A and B were really tied, something strictly better than A ought to be better than B, because ties are supposed to be interchangeable in comparisons. So 'neither better nor worse' apparently doesn't mean 'equal'. The same thing shows up in small ways all the time: two job candidates, one stronger on one axis, one on another, no overall ranking between them, and giving the first a bit more experience doesn't move him past the second.

  I've seen 'incommensurable' used for this, but I can't tell whether that's the name of what I just described, or a wider label for the whole family, or something that's really about meanings rather than values. I also can't tell whether the right thing to say is that A and B can't be compared at all, or that they can be compared and the answer is a fourth kind of thing that isn't better/worse/equal, or that I'm just vague about a comparison that does have a determinate answer somewhere. The decision theory people on the forums say preferences like this get you money-pumped, and I suspect thats a seperate question, but I'd like to know if it is.

  Don't just hand me a label. Structure it as: (1) 'The short answer' -- two short paragraphs on what the phenomenon actually is and whether it already has an established name or would need one coined; (2) 'The menu' -- one short paragraph per candidate reading, each saying what it claims and what it has to say about the small-improvement case above; (3) 'Settled vs contested' -- two short lists, what people who work on this actually agree on and what's genuinely open, with a flag wherever you'd be stating one camp's view as though it were the consensus; (4) 'My pick' -- a paragraph on which reading handles the case best and what it costs; (5) 'Boundary cases' -- if nothing established fits, coin a term, define it, and give one case inside it and one just outside.
