  ### Activity Design: "The Fellowship Selection Challenge"

  #### **Overview**
  This simulation forces students to experience the core tensions in group-conscious selection through a fellowship award process. Participants act as selection committees making iterative decisions under evolving constraints, embedding the three target difficulties in the mechanics without explicit naming.

  ---

  ### **Rules, Materials, Roles, and Timeline**  
  *(Total: 85 minutes; Debrief: 5 minutes)*  

  #### **Materials**  
  - **Candidate Profile Packets** (1 per group):  
    - **Round 1**: 12 profiles (8 from "Group A," 4 from "Group B").  
      - *Group A*: Scores 9, 9, 10, 10, 10, 10, 10, 10 (all high).  
      - *Group B*: Scores 4, 5, 6, 10 (one high, three low).  
    - **Round 2**: 20 profiles (10 Group A, 10 Group B with subgroups):  
      - *Group A*: Scores 8–10 (all high).  
      - *Group B*:  
        - *B1 (Advantaged Subgroup)*: Scores 9, 10, 10 (3 profiles).  
        - *B2 (Disadvantaged Subgroup)*: Scores 3, 4, 5, 6, 7 (5 profiles).  
        - *Ambiguous Cases*: 2 profiles labeled "Mixed Heritage" (score 8, no subgroup specified).  
    - **Round 3**: 10 profiles (8 Group A, 2 Group B):  
      - *Group A*: Scores 9, 9, 10, 10, 10, 10, 10, 10.  
      - *Group B*: Scores 4 (B2), 10 (B1).  
  - **Selection Worksheets** (1 per group): Track choices and rationales.  
  - **Timer** (visible to all).  

  #### **Roles**  
  - **Selection Committees**: Divide 18 students into 3 groups of 6. Each group acts as a fellowship selection committee.  
  - **Rotating Facilitator**: Each group assigns one member to keep time and ensure everyone speaks.  

  #### **Timeline**  
  1. **Introduction (5 min)**:  
     - *Setup*: "You are committees for the prestigious Global Leadership Fellowship. Award 5 fellowships per round. Your goal is excellence and fairness."  
     - *Rules*: No explicit mention of "affirmative action" or "justice." Focus on "fellowship criteria."  

  2. **Round 1: Selection-Stage Quota (20 min)**  
     - *Task*: "Select 5 fellows from 12 profiles. **Requirement: At least 2 must be from Group B.**"  
     - *Incentive*: Committees earn "Prestige Points" (PP) for:  
       - Selecting highest-scoring candidates (+1 PP per selected candidate’s score).  
       - Meeting the Group B requirement (+10 PP).  
     - *Process*:  
       1. Committees deliberate (10 min).  
       2. Report selections (2 min per group).  
     - *Predicted Outcome*: Groups select the two highest-scoring Group B candidates (scores 10 and 6) plus three high-scoring Group A. Target met cheaply.  

  3. **Round 2: Upstream Pool Constraint (25 min)**  
     - *Task*: "Redefine the candidate pool! Select 12 profiles from 20 to form next year’s pool. **Requirement: At least 40% (5/12) must be from Group B.**"  
     - *Twist*: Introduce subgroups: "Group B includes B1 (advantaged) and B2 (disadvantaged). Two profiles have ‘Mixed Heritage’—you decide if they count as Group B."  
     - *Incentive*: Committees earn PP for:  
       - Maximizing average pool score (+1 PP per point).  
       - Meeting the 40% requirement (+15 PP).  
     - *Process*:  
       1. Committees deliberate (15 min), grappling with boundary questions.  
       2. Report pool composition and boundary rules (3 min per group).  
     - *Predicted Outcome*: Groups exclude B1 or "Mixed Heritage" to prioritize B2, or include them to inflate scores—forcing boundary debates.  

  4. **Round 3: Thin Pool Concentration (20 min)**  
     - *Task*: "Select 5 fellows from 10 profiles. **Requirement: At least 1 from Group B.**"  
     - *Incentive*: PP for high-scoring selections (+1 PP per point) and meeting the target (+10 PP).  
     - *Process*:  
       1. Committees deliberate (10 min).  
       2. Report selections (2 min per group).  
     - *Predicted Outcome*: Only one viable Group B candidate (score 10, B1 subgroup) is selected. The low-scoring Group B candidate (score 4) is ignored, concentrating the benefit.  

  5. **Transition to Debrief (1 min)**: Collect PP totals (no prizes—points illustrate trade-offs).  

  ---

  ### **Compressed 45-Minute Variant**  
  - **Introduction (3 min)**: Simplify setup.  
  - **Round 1 (12 min)**: 7 min deliberation, 5 min report.  
  - **Round 2 (15 min)**: 10 min deliberation, 5 min report. Skip detailed boundary reporting.  
  - **Round 3 (10 min)**: 7 min deliberation, 3 min report.  
  - **Debrief (5 min)**: Focus on key tensions.  

  ---

  ### **Debrief Guide**  
  *(20 min; 5 min for compressed)*  
  **Goal**: Students articulate the three difficulties. Avoid lecturing—use Socratic questioning.  

  #### **Mapping Activity Moments to Concepts**  
  1. **Selection vs. Pool Structure (from Round 1)**:  
     - *Question*: "In Round 1, how did you meet the Group B requirement? Did your choices change *why* Group B was underrepresented?"  
     - *Target Moment*: Students note they "easily" hit the target by cherry-picking high-scoring Group B candidates without addressing low-scoring ones.  
     - *Avoid*: "Structural inequality," "root causes." Wait for phrases like "quick fix" or "didn’t help the weaker candidates."  
     - *Resistance Cost*: Defending this approach ignores how historical exclusion creates skewed pools.  

  2. **Boundary Problem (from Round 2)**:  
     - *Question*: "When you redefined the pool, how did you decide who counted as Group B? Who benefited from your boundary rules?"  
     - *Target Moment*: Groups that excluded B1/subgroups admit they "left out privileged Group B members"; others note "Mixed Heritage" ambiguity.  
     - *Avoid*: "In-group inequality," "intersectionality." Wait for "we had to choose who *really* needs help."  
     - *Resistance Cost*: Insisting on broad boundaries risks advantaging elites within marginalized groups.  

  3. **Concentration Effect (from Round 3)**:  
     - *Question*: "In Round 3, who from Group B received fellowships? What would happen if we repeated this next year?"  
     - *Target Moment*: Students observe the same high-scoring Group B type (e.g., B1) always wins, while the rest stay excluded.  
     - *Avoid*: "Elite capture," "tokenism." Wait for "only the strongest benefit" or "it doesn’t reach everyone."  
     - *Resistance Cost*: Denying concentration overlooks how thin pools amplify inequality within beneficiary groups.  

  #### **Closing Question**:  
  "What hidden trade-offs did these rules force you into?"  
  *(Steer discussion toward tensions between representation, fairness, and structural change.)*  

  ---

  ### **Predictable Failures and Fixes**  
  1. **Failure**: Strong opinions dominate deliberation.  
     - *Fix*: Assign a "Silent Observer" per group to track participation; use structured turn-taking.  

  2. **Failure**: Round 2 boundary debates stall progress.  
     - *Fix*: Announce: "You must finalize boundaries in 5 minutes or lose PP." Pressure forces trade-offs.  

  3. **Failure**: Students miss the concentration effect in Round 3.  
     - *Fix*: Contrast selections: "How many chose the Group B candidate with a score of 4? Why not?"  

  4. **Failure**: Resistance ("This is unrealistic!").  
     - *Fix*: Acknowledge: "This *is* simplified. In debrief, we’ll discuss nuances."  

  ---

  ### **What the Activity Cannot Reproduce**  
  **Flattened Feature**: **Historical and Social Context**.  
  - The game abstracts away:  
    - **Structural Causes**: Why Groups A/B are unequal (e.g., generational discrimination, wealth gaps).  
    - **Lived Experience**: Emotional weight of exclusion (e.g., stigma, identity struggles).  
    - **Intersectionality**: How race, class, gender, etc. *combine* to shape disadvantage.  
  - **Debrief Supplement**:  
    - "In reality, Group B’s underrepresentation stems from centuries of exclusion. Policies aren’t just about quotas—they’re reparative."  
    - "The ‘scores’ here ignore how bias shapes merit. Real merit is multidimensional."  
    - "Unlike the game, boundary debates involve trauma (e.g., blood-quantum rules in Indigenous communities)."  

  ---

  ### **Instructor Cues**  
  - **Stay Neutral**: Use "Group A/B," not dominant/marginalized.  
  - **Embrace Tension**: If debates erupt, say: "Your frustration mirrors real policy dilemmas."  
  - **Hard Stop**: End on time even if rounds run over; use debrief to resolve cliffhangers.  

  This design ensures students *feel* the trade-offs through constrained choices, setting up a nuanced debrief where they name the dilemmas themselves.
