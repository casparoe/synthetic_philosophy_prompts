prompt: |-
  I've been reading rationalist blogs and forums for like a decade, so the vocabulary I actually think in is decision theory: preference relations, utility functions, the VNM axioms, expected value maximization, lexicographic preferences, and the whole Pascal's mugging / fanaticism / infinite ethics cluster. I know that stuff pretty well -- well enough to be annoying about it at parties.

  There's this argument I keep bumping into in value theory, the spectrum or continuum argument, that 'better than' isn't transitive. You build a chain of lives (or outcomes, or populations) where each adjacent pair differs only slightly, and each looks at least as good as, or maybe slightly better than, the one before it, but the two ends of the chain look clearly ordered the other way -- the first is obviously better than the last. So either transitivity fails, or one of the small steps is a lie, or the extremes aren't what they seem.

  I want you to restate that argument, as faithfully as you can, in the vocabulary I actually use. Map it onto: a binary relation over outcomes, completeness and transitivity as properties of that relation, representation theorems, ordinal vs cardinal utility, the continuity/Archimedean axiom in VNM, lexicographic orderings, non-Archimedean or hyperreal values, and expected value. Where does each move in the argument land? Is "betterness is intransitive" just the claim that no real-valued utility function represents the relation, or is it stronger or weaker than that? Does the argument need the relation to be about preference at all, or can it run purely on value?

  Then the residue report, which is the part I actually care about. What translates cleanly, what has to be fudged to fit, and what has no counterpart in my vocabulary at all? Stuff I suspect might not survive: the idea that betterness is a primitive normative relation that doesn't have to be representable by anything; the distinction between covering and leveling (if thats even the right way to put it); incommensurability; the thought that the argument is a reductio on a principle rather than a construction of some weird ordering. For each piece of residue, tell me whether its a defect in decision theory -- something my framework can't see -- or a sign that the original claim was less clear than it looked.

  Also, concretely: which of the standard escapes does the translation force on me -- reject transitivity, reject one of the small steps, accept the repugnant-conclusion-ish end, or go non-Archimedean -- and does having a lexicographic utility function (which I keep around because of Pascal's mugging type worries) make me more or less vulnerable here? If betterness is genuinely intransitive, what's left of "maximize expected value"? Don't just tell me the answers; show me the translation and then tell me whats missing from it.
reasoning: |-
  We are given a request to restate the spectrum argument (intransitivity of betterness) using the vocabulary of decision theory (preference relations, utility functions, VNM axioms, etc.). We are also asked to analyze which parts of the original argument translate cleanly, which require fudging, and which have no counterpart. Finally, we are to discuss the implications for expected value maximization and the role of lexicographic utilities.

  ## Step 1: Restating the Spectrum Argument in Decision-Theoretic Terms

  The spectrum argument (also known as the continuum argument or the argument for intransitive betterness) can be reconstructed as follows:

  1. **Setup**: We have a set of outcomes (or states of affairs) arranged in a sequence: \(o_0, o_1, o_2, \dots, o_n\).
  2. **Adjacent Comparisons**: For every adjacent pair \((o_i, o_{i+1})\), we have that \(o_i\) is at least as good as \(o_{i+1}\) (or sometimes slightly better). In decision-theoretic terms, we have \(o_i \succeq o_{i+1}\) for all \(i\) (where \(\succeq\) is a weak preference relation). Moreover, for some adjacent pairs, we might even have \(o_i \succ o_{i+1}\) (strict preference) but the differences are very small.
  3. **Extreme Comparison**: However, when we compare the two endpoints, we have \(o_0 \succ o_n\) (i.e., the first outcome is strictly better than the last).
  4. **Contradiction**: By transitivity of the preference relation, we would have \(o_0 \succeq o_n\) (by chaining the adjacent relations). But the extreme comparison says \(o_0 \succ o_n\), which is consistent with \(o_0 \succeq o_n\) but now we have a conflict because the chain of weak preferences might lead to an overall weak preference, but the strict preference at the end seems to contradict the idea that the chain of small improvements (or non-worsenings) led to a worse outcome. However, note that the argument is often presented as a chain that starts with \(o_0\) and ends with \(o_n\) such that each step is non-worsening (or even slightly improving) but the final outcome is worse. That would be a contradiction if we have a strict improvement at every step and then a strict worsening at the end? Actually, the typical setup is that each step is a slight worsening (so we are going from good to bad by imperceptible steps). Let me clarify:

     The standard form is that we start with a very good outcome (say, \(o_0\)) and then we have a series of outcomes that are each slightly worse than the previous, so \(o_0 \succ o_1 \succ o_2 \succ \dots \succ o_n\). Then by transitivity, we must have \(o_0 \succ o_n\). But the argument is that when we look at \(o_0\) and \(o_n\), we might feel that \(o_n\) is not worse than \(o_0\)? That would be a contradiction. Actually, the argument is that we start with \(o_0\) and then make a series of changes that are each very small and seem acceptable (non-worsening) but lead to a clearly worse \(o_n\). So the chain is: \(o_0 \succeq o_1 \succeq o_2 \succeq \dots \succeq o_n\) and \(o_0 \succ o_n\). This is not a contradiction by itself because transitivity would only require \(o_0 \succeq o_n\), which is consistent with \(o_0 \succ o_n\). So where is the problem?

     The problem arises when the chain is built such that each step is non-strict (i.e., we have indifference or a very small improvement in the opposite direction) but the overall effect is a strict worsening. However, the classic example (like the spectrum of colors or the Repugnant Conclusion) is set up as a chain of small worsenings that accumulate to a big one. So let us assume:

     - \(o_0 \succ o_1\) (a small worsening)
     - \(o_1 \succ o_2\) (another small worsening)
     - ... 
     - \(o_{n-1} \succ o_n\) (the last small worsening)

     Then by transitivity, we get \(o_0 \succ o_n\), which is exactly what we observe (that \(o_n\) is worse). So why is this an argument against transitivity? It is not. The argument must be set up differently.

     Actually, the argument is often used to challenge the transitivity of the "at least as good as" relation when the small steps are taken to be indifferent. That is:

     - \(o_0 \sim o_1\) (indifferent)
     - \(o_1 \sim o_2\)
     - ... 
     - \(o_{n-1} \sim o_n\)

     Then by transitivity, we get \(o_0 \sim o_n\). But if we also have \(o_0 \succ o_n\), then we have a contradiction.

     Alternatively, the argument might be set up with a mix of indifference and strict preference. But the key point is that by transitivity of indifference and strict preference, we run into a contradiction if the endpoints are strictly ordered in the opposite direction.

     However, the Repugnant Conclusion argument (which is a form of spectrum argument) is different: it starts with a high-quality life and then by adding more and more lives of slightly lower quality (but still positive) we end up with a huge population of lives barely worth living. The claim is that each step is an improvement (because we are adding more happy people) but the end result is worse. So:

     - \(o_0\): a small population with very high quality of life.
     - \(o_1\): a slightly larger population with a very slight decrease in quality (so that \(o_1\) is better than \(o_0\)?).

     But in the Repugnant Conclusion, each step is an improvement? Actually, the argument is that the total view (utilitarianism) leads to the repugnant conclusion: that a huge population with lives barely worth living is better than a small population with very high quality. The spectrum argument against this is to say: if we build a chain from \(o_0\) (small, high quality) to \(o_n\) (huge, low quality) by many small steps, then at each step we are increasing the population and decreasing the quality a little. If at each step we are making the outcome better (or at least not worse), then by transitivity we must conclude that \(o_n\) is better than \(o_0\). But if we find \(o_n\) repugnant (i.e., worse than \(o_0\)) then we have a contradiction.

     So the chain is built so that each step is an improvement (or non-worsening) but the end is worse. Therefore, to avoid the repugnant conclusion, we must deny that every step is an improvement. But the argument is that it is hard to deny any particular step because the change is so small.

     In decision-theoretic terms:

     - We have a chain: \(o_0, o_1, \dots, o_n\).
     - For each \(i\), \(o_i \preceq o_{i+1}\) (or \(o_{i+1}\) is at least as good as \(o_i\)) and sometimes even \(o_{i+1} \succ o_i\) (strict improvement) because we are adding more people with positive lives.
     - But we also have \(o_0 \succ o_n\) (the repugnant conclusion is repugnant, so we don't want to say \(o_n\) is better).

     This yields a contradiction because transitivity would require \(o_0 \preceq o_n\) (since each step is non-worsening) but we have \(o_0 \succ o_n\).

     So the argument is: if we accept that each step is non-worsening (or even improving) then we must accept \(o_n\) is at least as good as \(o_0\). But if we reject that \(o_n\) is at least as good as \(o_0\) (and in fact believe the opposite), then we must reject transitivity or reject at least one step.

     **Restatement in Decision Theory**:

     Let \(\succeq\) be a binary relation on a set of outcomes. We assume:

     - **Completeness**: For any two outcomes \(a, b\), we have \(a \succeq b\) or \(b \succeq a\) (or both, in which case indifference).
     - **Transitivity**: If \(a \succeq b\) and \(b \succeq c\), then \(a \succeq c\).

     The spectrum argument presents a chain of outcomes \(o_0, o_1, \dots, o_n\) such that:
     - \(o_i \preceq o_{i+1}\) for every \(i\) (each step is non-worsening: the next is at least as good as the previous).
     - But \(o_0 \succ o_n\) (the first is strictly better than the last).

     This contradicts transitivity because:
     - From \(o_0 \preceq o_1 \preceq o_2 \preceq \dots \preceq o_n\), transitivity gives \(o_0 \preceq o_n\).
     - But \(o_0 \succ o_n\) implies \(o_0 \not\preceq o_n\) (since strict preference implies not being worse).

     Therefore, we have a contradiction.

     So the argument is that if we want to maintain transitivity, we must either:
     - Deny that every step is non-worsening (i.e., there is at least one \(i\) for which \(o_i \succ o_{i+1}\), meaning the next is worse).
     - Or accept that \(o_0 \preceq o_n\) (i.e., the repugnant conclusion is not repugnant).

     Alternatively, we can reject transitivity.

     In terms of utility functions:

     - If we have a real-valued utility function \(u\) that represents the preference relation (so that \(a \succeq b\) iff \(u(a) \geq u(b)\)), then transitivity and completeness are automatically satisfied. The chain would require:
          \(u(o_0) \leq u(o_1) \leq \dots \leq u(o_n)\)
       but then we must have \(u(o_0) \leq u(o_n)\). However, if \(o_0 \succ o_n\), then \(u(o_0) > u(o_n)\), which contradicts the chain of inequalities.

     Therefore, if we insist on the chain of non-worsening steps and the strict preference at the endpoints, then no such real-valued utility function can exist.

     But note: without a real-valued utility function, we might still have a transitive and complete relation that is not representable by a real-valued function. For example, lexicographic preferences.

     The argument can be run without assuming that the relation is representable by a real-valued utility function. It only assumes completeness and transitivity (and the particular judgments about the chain).

  ## Step 2: Mapping to Decision-Theoretic Concepts

  - **Binary relation**: The betterness relation is a binary relation \(\succeq\) on outcomes. We assume it is complete and transitive for the representation theorems to hold (for real-valued representation).
  - **Representation theorems**: The VNM representation theorem assumes completeness, transitivity, independence, and continuity (Archimedean). The existence of a real-valued utility function that represents the preferences and is linear in probabilities is the result.
  - **Ordinal vs cardinal utility**: In the absence of uncertainty, we can have an ordinal utility function (any increasing transformation preserves the ordering). The spectrum argument does not require uncertainty, so it is about the ordinal structure. However, when we consider the Archimedean axiom, we are stepping into cardinality.
  - **Continuity/Archimedean axiom in VNM**: This axiom says that if \(A \succ B \succ C\), then there exists a probability \(p \in (0,1)\) such that \(p A + (1-p) C \succ B\). This is what rules out lexicographic preferences and ensures that the utility function is real-valued. Without it, we can have non-Archimedean structures (like hyperreals or lexicographic orders).
  - **Lexicographic orderings**: These are transitive and complete but not representable by a real-valued utility function. They are non-Archimedean: there are trade-offs that are not continuous (e.g., no amount of a lower-priority good can compensate for a deficit in a higher-priority good).
  - **Non-Archimedean or hyperreal values**: These can represent some lexicographic orderings by using multiple real numbers or by having infinitesimals. For example, a hyperreal utility might assign \(u(o) = (u_1(o), u_2(o))\) and compare lexicographically.

  ## Step 3: The Residue Report

  We are asked to identify what translates cleanly, what has to be fudged, and what has no counterpart.

  ### Clean Translations:
  - The setup of the chain of outcomes and the adjacent comparisons (each step non-worsening) and the extreme comparison (strict worsening) is straightforward in preference relations.
  - The contradiction via transitivity is a direct application of the definition of transitivity.
  - The conclusion that we must reject one of the steps or the transitivity of the relation is clear.

  ### Fudged Translations:
  - **The role of small steps**: In decision theory, the "smallness" of the steps is captured by the idea of indifference or by the continuity axiom. But in the spectrum argument, the steps are often described as "slight" or "imperceptible" changes. In decision theory without a metric, we only have the relation. We can say that adjacent outcomes are indifferent, but the argument sometimes uses strict improvements in the opposite direction (as in the Repugnant Conclusion). The fudge is that the argument often relies on an intuition about the size of the change, which in decision theory is not formally captured without a utility function. This is where the continuity axiom comes in: if we require continuity, then we force the utility to be real-valued, and then the chain of non-worsening steps (with a strict drop at the end) becomes impossible. But without continuity, we can have lexicographic orders that might avoid the chain.

  - **Incommensurability**: The spectrum argument is sometimes presented as involving incommensurable values. In decision theory, incommensurability might be represented by a failure of completeness (i.e., we cannot compare two outcomes). But the spectrum argument we are considering assumes completeness (because we are building a chain of comparisons). So that aspect is not captured. However, if we drop completeness, then we don't have a chain of comparisons to begin with. So the argument as stated requires completeness.

  - **The distinction between covering and leveling**: This might refer to two ways of avoiding the repugnant conclusion. Covering: the idea that a loss in one dimension can be compensated by a gain in another. Leveling: the idea that we can level down to a lower quality to achieve equality. In decision theory, covering is similar to the idea of trade-offs (which is what the utility function captures). Leveling is more about equality and might not be captured by standard decision theory unless we build it into the utility function (e.g., using a prioritarian or egalitarian form).

  ### No Counterpart:
  - **Betterness as a primitive normative relation**: In decision theory, we often start with a preference relation that is taken as given (and assumed to be rational). The spectrum argument challenges the transitivity of this relation. But decision theory does not typically question whether the relation is representable by a utility function until we try to assign numbers. The argument that betterness might be intransitive is a challenge to the decision-theoretic framework because it undermines the representation theorems (which require transitivity). So in a sense, decision theory assumes transitivity. The residue is that the argument might be saying that the relation is not transitive, which is a foundational challenge.

  - **The argument as a reductio on a principle**: The spectrum argument is often used as a reductio ad absurdum on the principle that each step is non-worsening. In decision theory, we can run the same reductio: if we assume completeness and transitivity, then we must reject at least one step. But the argument is sometimes presented as a challenge to transitivity itself. That is not standard in decision theory, which holds transitivity as a cornerstone of rationality.

  ## Step 4: Escapes and Lexicographic Utilities

  The standard escapes are:

  1. **Reject transitivity**: This would break the chain and avoid the contradiction. But then we lose the ability to have a utility representation (even ordinal) and decision theory becomes very messy.
  2. **Reject one of the small steps**: That is, for some \(i\), we have \(o_i \succ o_{i+1}\) (so the next step is worse). This breaks the chain of non-worsening steps.
  3. **Accept the repugnant conclusion**: That is, accept that \(o_n\) is at least as good as \(o_0\).
  4. **Go non-Archimedean**: Use a lexicographic utility function or hyperreal values to represent the ordering.

  **Lexicographic utilities**: These are non-Archimedean. They can avoid the repugnant conclusion by having a hierarchy of values. For example, we might have:

     - First, we care about the minimum quality of life (or some other primary value). Then, if two outcomes have the same minimum quality, we care about the total utility (or population).

     In the chain from \(o_0\) (small, high quality) to \(o_n\) (huge, low quality), if at some point the minimum quality drops below a threshold, then we might have a strict worsening. So the chain might look like:

     - \(o_0\): high quality, small population -> utility (high, small)
     - ... 
     - \(o_k\): quality drops to a level that is still above the threshold -> utility (high, medium)
     - \(o_{k+1}\): quality drops below the threshold -> utility (low, huge)

     Then we have \(o_k \succ o_{k+1}\) because the primary value drops. This breaks the chain of non-worsening steps. So the lexicographic structure can explain why we reject some step in the chain.

     However, note that in a lexicographic ordering, we can still have a chain of indifferences that leads to a drop? Actually, no: because if we have a lexicographic order, then if the primary value is constant, we can have a chain of improvements in the secondary value. But if the primary value drops at any step, then that step is a strict worsening.

     Therefore, having a lexicographic utility function makes you **less vulnerable** to the spectrum argument because it allows you to have a step where a small change in the primary value (if it crosses a threshold) causes a strict preference reversal. But note: the lexicographic order is transitive and complete, so it maintains transitivity.

     However, lexicographic utilities are not continuous and hence cannot be represented by a real-valued function. They require a non-Archimedean structure.

  ## Step 5: Implications for Expected Value Maximization

  If betterness is genuinely intransitive, then we cannot have a transitive preference relation. This would break expected value maximization because:

  - Expected value maximization requires a complete and transitive preference relation over outcomes (so that we can define a utility function over outcomes) and then we maximize the expected utility.
  - Without transitivity, we might have cycles, so that even without uncertainty, we cannot choose the best outcome. With uncertainty, the expectation might not lead to a consistent ordering of lotteries.

  In short, if betterness is intransitive, then the entire project of expected utility maximization (as we know it) fails.

  ## Conclusion of the Translation

  The spectrum argument translates cleanly to a challenge to the transitivity (and possibly completeness) of the preference relation. It shows that if we hold the adjacent comparisons and the extreme comparison, then we must abandon transitivity. Alternatively, we can abandon completeness (but the argument as given requires the chain to be connected by non-worsening steps, which implies comparability) or we can abandon one of the comparisons.

  The residue is mainly:
  - The intuition about the "smallness" of steps: which in decision theory is not formalized without a utility function. This is a defect in decision theory in the sense that it doesn't have a primitive notion of "small change", but it can be captured by the continuity axiom (which forces a real-valued representation and hence a metric on the utility scale).
  - The idea of betterness as a primitive: decision theory takes the preference relation as primitive, so this is compatible. But the challenge to transitivity is a challenge to the decision-theoretic framework.
  - The distinction between covering and leveling: not directly captured unless we build a specific utility function.

  Lexicographic utilities provide an escape by allowing a non-Archimedean structure that breaks the chain of non-worsening steps at a threshold. This makes you less vulnerable to the argument.

  Finally, if betterness is intransitive, then expected value maximization as we know it is not possible. We would need a different decision theory that accommodates intransitivity (e.g., using regret theory or other non-standard models).
answer: |-
  ### Faithful Restatement in Decision-Theoretic Vocabulary
  The spectrum argument challenges the transitivity of the "better than" relation (denoted \(\succ\)) over outcomes. Let \(\mathcal{O}\) be a set of outcomes, with a binary relation \(\succeq\) ("at least as good as"). Define:
  - **Strict preference**: \(a \succ b \iff a \succeq b \land \neg (b \succeq a)\)
  - **Indifference**: \(a \sim b \iff a \succeq b \land b \succeq a\)

  **Argument structure**:
  1. **Chain construction**: A sequence \(o_0, o_1, \dots, o_n\) where adjacent outcomes are very similar.
  2. **Adjacent comparisons**: For all \(i\), \(o_i \succeq o_{i+1}\) (each step is non-worsening), and \(o_i \sim o_{i+1}\) may hold for some steps (indifference or imperceptible improvement).
  3. **Extreme comparison**: \(o_0 \succ o_n\) (first outcome is strictly better than last).
  4. **Transitivity assumption**: \(\succeq\) is transitive: if \(a \succeq b\) and \(b \succeq c\), then \(a \succeq c\).
  5. **Contradiction**: By transitivity, \(o_0 \succeq o_n\), but \(o_0 \succ o_n\) implies \(o_0 \not\sim o_n\) and \(\neg (o_n \succeq o_0)\), violating \(o_0 \succeq o_n\).

  **Decision-theoretic mapping**:
  - **Preference relation**: \(\succeq\) is complete and transitive (standard rationality assumptions).
  - **Utility representation**: If \(\succeq\) admits a real-valued utility function \(u: \mathcal{O} \to \mathbb{R}\), then:
    - \(a \succeq b \iff u(a) \geq u(b)\)
    - Adjacent comparisons imply \(u(o_i) \geq u(o_{i+1})\) for all \(i\).
    - Extreme comparison implies \(u(o_0) > u(o_n)\).
    - Contradiction: \(u(o_0) \geq u(o_n)\) and \(u(o_0) > u(o_n)\) cannot both hold.
  - **VNM continuity/Archimedean axiom**: For lotteries, if \(A \succ B \succ C\), then \(\exists p \in (0,1)\) such that \(pA + (1-p)C \succ B\). In the spectrum:
    - If adjacent outcomes are indifferent (\(o_i \sim o_{i+1}\)), VNM implies \(u(o_i) = u(o_{i+1})\), forcing \(u(o_0) = u(o_n)\), contradicting \(o_0 \succ o_n\).
  - **Lexicographic preferences**: If \(\succeq\) is lexicographic (e.g., prioritize dimension \(X\) over \(Y\)), then:
    - Small steps may cross a critical threshold where \(X\) drops, causing \(o_k \succ o_{k+1}\) for some \(k\), breaking the chain.
  - **Non-Archimedean/hyperreal utilities**: If \(u\) takes hyperreal values (e.g., \(u(o_i) = \epsilon \cdot i\) for infinitesimal \(\epsilon\)), then:
    - Adjacent comparisons hold (\(u(o_i) \approx u(o_{i+1})\)), but \(u(o_0) > u(o_n)\) since \(\epsilon \cdot n\) is appreciable.

  **"Betterness is intransitive" vs. utility representation**:
  - **Weaker than non-representability**: Intransitivity implies no real-valued \(u\) exists, but non-representability (e.g., lexicographic orders) can occur without intransitivity.
  - **Stronger implication**: Intransitivity violates the ordinal utility theorem (which requires transitivity), not just VNM continuity.

  **Value vs. preference**: The argument runs on "betterness" as a normative value relation, not revealed preference. It assumes:
  - **Normative realism**: Betterness judgments are truth-apt and not reducible to preferences.
  - **Completeness**: All outcomes are comparable (unlike in parity-based accounts).

  ---

  ### Residue Report: What Doesn't Translate Cleanly
  **1. Betterness as primitive normative relation**  
  - **Translation attempt**: Map to \(\succeq\) as primitive; completeness/transitivity as axioms.  
  - **Friction**: Decision theory typically treats \(\succeq\) as preference, not objective value.  
  - **Defect in DT?**: Yes. DT lacks normative primitives—it describes coherent preferences but doesn't adjudicate objective value disputes. The argument exploits this by treating betterness as external to preference.  
  - **Clarity check**: The original claim is clear: it targets normative realism, not instrumental rationality.

  **2. Covering vs. leveling** (or trade-offs vs. thresholds)  
  - **Covering**: Small gains in one dimension compensate for losses in another (VNM-style continuity).  
  - **Leveling**: No compensation past a threshold (lexicographic).  
  - **Translation**: Covering \(\to\) Archimedean axiom; Leveling \(\to\) lexicographic orders.  
  - **Friction**: In the spectrum, covering assumes \(u\) is real-valued, allowing infinitesimal trade-offs. Leveling rejects this, requiring discontinuities.  
  - **DT defect?**: Partial. DT handles leveling via lexicography but lacks a formal theory of thresholds (why \(X\) trumps \(Y\)).

  **3. Incommensurability**  
  - **Translation attempt**: Incompleteness of \(\succeq\) (some pairs non-comparable).  
  - **Friction**: The spectrum argument assumes completeness to build the chain. If adjacent pairs are incommensurable, \(o_i \not\succeq o_{i+1}\) breaks the chain.  
  - **Residue**: The original argument implies incommensurability might resolve the contradiction, but DT cannot model it within the chain without violating completeness.  
  - **Clarity defect?**: Yes—proponents underestimate how radically incomparability disrupts the argument.

  **4. Reductio on a principle**  
  - **Translation**: Rejecting one of:  
    - Transitivity  
    - Adjacency claim (\(o_i \succeq o_{i+1}\) for all \(i\))  
    - Extreme claim (\(o_0 \succ o_n\))  
  - **Friction**: DT frames these as axioms or empirical judgments. The argument is a reductio on "all small steps are non-worsening," but DT lacks tools to quantify "small."  
  - **Residue**: The normative force comes from intuition pumps (e.g., "how could a barely noticeable change make things worse?"), which DT cannot formalize.

  ---

  ### Escapes and Lexicographic Utilities
  **Standard escapes via DT translation**:  
  1. **Reject transitivity** (e.g., Temkin):  
     - DT cost: Collapses expected utility (EU) maximization. Cyclical preferences violate the ordinal utility theorem.  
  2. **Reject a small step** (e.g., Parfit):  
     - Find \(k\) where \(o_k \succ o_{k+1}\) despite similarity.  
     - DT cost: None—preserves EU if \(u\) exists.  
  3. **Accept the extreme** (e.g., total utilitarianism):  
     - Conclude \(o_n \succeq o_0\).  
     - DT cost: None, but normatively unpalatable ("repugnant").  
  4. **Non-Archimedean utility** (e.g., hyperreal \(u\)):  
     - Assign \(u(o_i)\) with infinitesimal differences. Adjacent \(u(o_i) \geq u(o_{i+1})\), but \(u(o_0) > u(o_n)\).  
     - DT cost: EU maximization still works, but requires non-standard analysis.

  **Lexicographic utilities**:  
  - **Vulnerability**: Less vulnerable. Lexicography naturally breaks chains at thresholds (e.g., minimum welfare).  
    - *Example*: Let \(u(o) = (u_1(\text{min welfare}), u_2(\text{population size}))\). If \(o_i\) crosses a min-welfare threshold at step \(k\), then \(o_k \succ o_{k+1}\) regardless of population gains.  
  - **Trade-off**: Lexicography avoids intransitivity but violates VNM continuity and real-valued representation. This matches DT responses to Pascal's mugging (e.g., reject continuity to handle infinitarian fanaticism).

  ---

  ### What Happens to "Maximize Expected Value"?  
  If betterness is intransitive:  
  - **No coherent utility function**: EU maximization is undefined—no \(u\) to take expectations of.  
  - **No rationalizable choice**: Even without uncertainty, cyclical preferences prevent optimal action (e.g., money pumps).  
  - **Fallbacks**:  
    - **Bounded rationality**: Satisfice, use heuristics.  
    - **Non-Bayesian DT**: Risk-weighted models (e.g., rank-dependent utility), but these still require transitive outcomes.  
    - **Paraconsistent choice**: Accept cycles but minimize regret (no clean DT formalism exists).

  **Key insight**: The spectrum argument is a *greater* threat to DT than Pascal's mugging. Mugging exploits unbounded utility (solved by lexicography), while spectrum attacks transitivity—the bedrock of utility theory. Lexicography saves transitivity by denying continuity, but at the cost of real-valued representation. If transitivity falls, DT collapses.
