answer: |-
  Here are the desiderata for an outside-view method forecasting empire decline using historical base rates, grounded in the logic of reference classes and base rates. Each requirement includes its motivation, status (non-negotiable or preference), and notes on tensions.

  ### Core Desiderata (Non-Negotiable)
  1.  **Explicit, Outcome-Neutral Reference Class Definition:**
      *   **Requirement:** Define the reference class *before* examining the outcome of the specific case being forecasted (e.g., "Modern Western Colonial Empires," "Large Land-Based Pre-Industrial Empires"). Criteria for inclusion must be based on characteristics observable *before* the decline phase begins.
      *   **Motivation:** Avoiding the "Texas Sharpshooter Fallacy". E.g., defining a class *after* seeing the Roman Empire fell slowly as "Empires with complex bureaucracies" risks biasing the base rate towards slow decline for any bureaucratic empire, even if many other bureaucratic empires fell quickly.
      *   **Status:** Non-negotiable. Post-hoc redefinition invalidates the outside view's objectivity.

  2.  **Distinguish Polity Kind from Lifecycle Stage:**
      *   **Requirement:** Treat "kind of polity" (e.g., maritime trading empire, nomadic conquest empire, ideological bloc) and "stage of lifecycle" (e.g., expansion, consolidation, stagnation, crisis) as separate, orthogonal dimensions when defining reference classes or conditioning rates. Do not conflate them.
      *   **Motivation:** A "Consolidation Stage Empire" base rate mixes fundamentally different entities (e.g., a consolidating Roman Empire vs. a consolidating Aztec Empire). A "Maritime Empire" base rate mixes entities at very different vulnerability points (e.g., nascent Dutch Republic vs. late British Empire). The hazard rate likely depends on *both* inherent type *and* current stage.
      *   **Status:** Non-negotiable. Conflation renders base rates meaningless for forecasting a specific empire at a specific time.

  3.  **Calculate Hazard Rates, Not Just Crude Base Rates:**
      *   **Requirement:** Estimate the *hazard rate* (instantaneous risk of failure at time *t*, given survival until *t*) or *survival function* (probability of surviving beyond time *t*), not just a static "X% of empires last less than Y years".
      *   **Motivation:** A crude base rate (e.g., "70% of empires collapse within 300 years") ignores *when* the risk occurs. An empire that has already lasted 290 years has demonstrated resilience; its hazard rate *now* might be low (if risk peaked earlier) or high (if risk accumulates). The forecast for a 10-year horizon needs the *current* hazard, not the average over 300 years.
      *   **Status:** Non-negotiable for temporal forecasting. Static base rates are insufficiently granular.

  4.  **Correct for Left-Truncation & Survivorship Bias:**
      *   **Requirement:** Account for empires that existed before the dataset's start date ("left-truncation") and ensure the sample isn't biased towards empires that survived long enough to be well-recorded ("survivorship bias"). The "risk set" at any time *t* must include *all* empires that existed and were "at risk" of decline at that time, even if they are poorly documented or failed very early.
      *   **Motivation:** If we only analyse empires that lasted >100 years (common due to historical record survival), we exclude all fast-collapsing empires. This biases hazard rates downward, making empires seem more durable than they truly are. E.g., analysing only long-lived empires misses the many short-lived post-Roman barbarian kingdoms or early Chinese dynasties.
      *   **Status:** Non-negotiable. Failure to correct fundamentally distorts hazard rate estimates.

  5.  **Acknowledge & Mitigate Non-Independent Durations:**
      *   **Requirement:** Recognise that empire durations are not statistically independent due to shared environmental shocks (e.g., climate events, pandemics, technological shifts) and direct interactions (e.g., war, economic competition, cultural diffusion). Employ methods robust to some dependence or explicitly model key dependencies.
      *   **Motivation:** The collapse of the Western Roman Empire triggered the "Migration Period," impacting the durations of many neighbouring polities simultaneously. Treating the fall of Carthage and Rome as independent events ignores Rome's direct role in eliminating Carthage. Standard survival analysis assumes independence; violations can bias hazard rates.
      *   **Status:** Non-negotiable to acknowledge; mitigation methods are necessary but their specific form may involve preference.

  ### Important Desiderata (Often Non-Negotiable in Practice)
  6.  **Handle "Delayed Entry" into Risk Set:**
      *   **Requirement:** Correctly specify the start time ("time zero") for each empire in the risk set. This is often *not* the literal founding date, but the point where it meets the criteria for the reference class (e.g., achieving stable hegemony, not just initial conquest). An empire only enters the risk set *after* it has survived its inherently unstable formation phase.
      *   **Motivation:** Including an empire from its chaotic, unstable founding (e.g., the years immediately after Alexander's death for the Seleucid Empire) inflates early hazard rates and distorts the base rate for established empires. The relevant "clock" starts when the polity becomes a stable "empire" by the class definition. However, *excluding* this phase requires careful, objective definition.
      *   **Status:** Non-negotiable for accurate hazard rates, but defining "time zero" objectively is challenging and involves preference.

  7.  **Define "Decline/Collapse" Objectively & Consistently:**
      *   **Requirement:** Establish clear, observable criteria for the endpoint ("failure event") applicable across all cases in the reference class *before* analysis (e.g., loss of >50% core territory, overthrow of central authority without immediate replacement, subjugation by another major power). Avoid subjective judgements like "loss of vigour".
      *   **Motivation:** Was the Ottoman Empire's failure in 1922 (abolition of Sultanate), 1918 (end of WW1 defeat), or 1683 (failed Siege of Vienna)? Inconsistent endpoints make base rates incoherent. Subjectivity allows bias in classifying outcomes.
      *   **Status:** Non-negotiable for comparability.

  ### Desiderata Involving Preference
  8.  **Balance Specificity vs. Sample Size (Reference Class Granularity):**
      *   **Requirement:** Optimise the reference class definition to be specific enough to be relevant to the forecasted case (e.g., "Industrial Era European Maritime Colonial Empires") while ensuring a sufficient number of historical cases exist to estimate stable hazard rates.
      *   **Motivation:** Too broad (e.g., "All Polities Ever") includes wildly incomparable cases (city-states vs. continents), making the base rate irrelevant. Too narrow (e.g., "Empires ruling exactly 5-10 million square km with a divine-right monarchy") yields too few cases for statistical reliability (e.g., n=2).
      *   **Status:** Preference. Requires judgement. The core non-negotiable is defining it *before* the forecast and *not* conflating type/stage, but *how* specific to be is a trade-off.
  9.  **Specify the Forecasting Horizon Clearly:**
      *   **Requirement:** Explicitly state the time period for which the forecast applies (e.g., "Hazard of collapse within the next 50 years"). Base rates and hazard rates must be calculated for compatible horizons.
      *   **Motivation:** A base rate for "collapse within 100 years" is useless for forecasting the next decade unless converted into a conditional hazard rate for empires of that current age.
      *   **Status:** Preference in how it's presented, but non-negotiable that the output must match the intended forecast horizon.

  ### The Crucial Tension: Specificity vs. Hazard Rate Estimation
  *   **The Conflict:** Desideratum 8 (Specificity vs. Sample Size) fundamentally conflicts with Desideratum 3 (Hazard Rates) and Desideratum 6 (Delayed Entry). Estimating reliable, *time-varying* hazard rates requires a significant number of events (collapses) observed at different durations within the reference class.
  *   **Why it's Interesting:** This is the core challenge of applying the outside view to complex historical entities like empires. To be relevant (Specific), the reference class must be narrow. But to estimate the *dynamic* risk (Hazard Rate) needed for forecasting, especially conditional on having already survived a long time (correcting for Delayed Entry/Survivorship Bias), requires *many* data points within that narrow class. History rarely provides this luxury. Broader classes provide more data but risk irrelevance ("All Empires" hazard rate). Narrower classes are relevant but lack the statistical power for robust hazard estimation. This tension exposes the fundamental limitation of purely statistical outside-view forecasts for rare, complex macro-historical events: the ideal reference class for relevance often lacks sufficient data for the necessary statistical rigour. Resolving this requires careful justification of the chosen granularity and acknowledging the resulting uncertainty, potentially blending the outside view with conditional inside-view adjustments.

  **In Summary:** A credible outside-view forecast of empire decline must start with an objectively defined reference class (separating polity kind and lifecycle stage), calculate time-varying hazard rates corrected for survivorship bias and left-truncation (with a sound "time zero"), acknowledge dependence between cases, and resist post-hoc redefinition. The most profound challenge is obtaining enough data within a truly relevant reference class to estimate meaningful hazard rates, highlighting the inherent limitations of the method for forecasting unique historical entities.
