  I should also emphasize the difference between a static base rate ("X% of empires last less than 200 years") versus a dynamic hazard rate ("an empire that has lasted 200 years has Y% chance of falling in the next decade"). The latter is more useful for forecasting but harder to calculate properly.

  For biases, I'll explain each with simple examples - like how studying only successful startups distorts failure rate estimates (survivorship bias), or how ignoring empires that collapsed quickly gives a rosier picture (left-truncation).

