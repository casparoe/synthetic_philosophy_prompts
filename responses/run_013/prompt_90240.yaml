  First I need to understand what an "outside-view" method means here. It's about using historical base rates rather than analyzing specific details of a current empire. The key is getting the reference class right - what counts as a comparable empire? There's a crucial distinction between classifying by polity type (e.g., maritime empires vs land empires) versus by lifecycle stage (early expansion vs mature phase).

  The biases mentioned are critical too. Survivorship bias is particularly tricky - we only know about empires that lasted long enough to be recorded, which distorts our data. There's also left-truncation bias where we start counting survival time only after an empire has already existed for a while. And empires don't fail independently - their declines often influence each other.

  For each requirement, I'll need to provide:
