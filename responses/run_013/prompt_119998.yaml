answer: |-
  ### **Supertask Lamp: A Group Activity on Thomson's Paradox**  
  **Goal:** Students experience that the lamp's state at t=1 is *underdetermined* by the infinite process, not just a puzzle with a hidden answer. The activity forces them to confront ambiguity, challenge assumptions, and see how extra stipulations "resolve" the paradox artificially.  

  **Materials:**  
  - **Machine Cards (5):** Index cards with machine descriptions (see below).  
  - **Answer/Challenge Cards:** Blank index cards for responses (15 total: 5 for Round 1 answers, 5 for Round 2 challenges, 5 for Round 3 revisions).  
  - **Props:** Desk lamp with red/blue/green bulbs (for visual anchoring; no need to use during activity).  
  - **Whiteboard:** Write the infinite schedule:  
    > Switch times: \( t_1 = \frac{1}{2} \), \( t_2 = \frac{3}{4} \), \( t_3 = \frac{7}{8} \), ... converging to \( t = 1 \).  
  - **Timer:** For strict timekeeping.  

  **Groups:** 5 small groups (3–4 students each). Assign roles:  
  - **Recorder:** Writes answers/challenges.  
  - **Spokesperson:** Reports in debates.  
  - **Skeptic:** Finds holes in others' reasoning (rotate roles if needed).  

  **Machine Cards (Text for Each):**  
  1. **Toggler:**  
     > Lamp starts OFF at t=0. At every switch time, the machine TOGGLES the lamp (ON→OFF, OFF→ON).  

  2. **Cycler:**  
     > Lamp starts OFF at t=0. At switch time \(n\) (first, second, third,...), the machine sets the lamp to: RED if \(n ≡ 1 \mod 3\), BLUE if \(n ≡ 2 \mod 3\), GREEN if \(n ≡ 0 \mod 3\). (After first switch: RED; second: BLUE; third: GREEN; fourth: RED; etc.)  

  3. **Sticky Red:**  
     > Lamp starts OFF at t=0. At the first switch (\(t = \frac{1}{2}\)), the machine turns the lamp RED. At EVERY later switch, the machine does NOTHING (lamp stays RED).  

  4. **Prime Checker:**  
     > Lamp starts OFF at t=0. At switch time \(n\) (first=1, second=2, third=3,...), the machine turns the lamp ON if \(n\) is prime, OFF if \(n\) is not prime. (Note: 1 is not prime; 2 is prime, etc.)  

  5. **Cheater:**  
     > Lamp starts OFF at t=0. At every switch time, the machine TOGGLES the lamp. ADDITIONALLY, the lamp is OFF at t=1.  

  **Activity Timeline (75 min):**  

  #### **0–5 min: Introduction (Whiteboard + Lamp Demo)**  
  - **Instructor:** "Today, we're engineers designing lamp machines. Each machine runs an infinite set of tasks *before* t=1. Your job: Determine the lamp’s state *at* t=1. Rules:  
    1. Machines start at t=0 (lamp OFF).  
    2. Switches happen at \( \frac{1}{2}, \frac{3}{4}, \frac{7}{8}, \dots \) (show schedule).  
    3. No physics—only what your machine card says.  
    4. You must commit to an answer with a reason."  
  - **Demo:** Flip the lamp switch 2–3 times. "This lamp toggles. But your machines might do wilder things."  
  - **Assign:** Hand each group one machine card.  

  #### **5–20 min: Round 1 – Commit to t=1 State**  
  - **Task:** Groups read their card and write on an answer card:  
    > Lamp at t=1 is [STATE]. Reason: [ONE SENTENCE].  
  - **Predictable Issues:**  
    - *Toggler* may split on ON/OFF based on "even vs. odd flips" (parity).  
    - *Cycler* will struggle: "RED? But it cycles forever!"  
    - *Sticky Red* will confidently say RED (process stabilizes early).  
    - *Prime Checker* may guess randomly (primes are infinite; no pattern).  
    - *Cheater* will cite the rule but feel uneasy.  
  - **Instructor:** Roam, ask: "Does your card *force* your answer? Could someone disagree?"  

  #### **20–30 min: Round 2 – Swap and Challenge**  
  - **Swap:** Groups swap machine cards and answer cards (use a fixed rotation: Group 1→2→3→4→5→1).  
  - **Task:** With the *new* machine card, groups write a challenge card:  
    > We challenge that your lamp is [STATE] at t=1 because: [ONE SENTENCE using ONLY the machine card].  
  - **Key Twist:** Groups must attack the *reasoning*, not the state. E.g., for Toggler: "Your reason assumes a final flip, but there is none!"  
  - **Predictable Issues:**  
    - Groups with Sticky Red get weak challenges ("It says RED, so it’s RED").  
    - Groups with Cycler/Prime get strong challenges ("The cycle never settles!").  
    - Cheater gets caught: "You added a rule!"  

  #### **30–45 min: Round 3 – Amend and Defend**  
  - **Return cards:** Groups get back their original machine card and the challenge card.  
  - **Task:** Groups add **ONE** stipulation to their machine card (write it on the card). Then revise their answer:  
    > New stipulation: [ONE CLAUSE].  
    > Lamp at t=1 is now [STATE]. Reason: [How stipulation fixed the challenge].  
  - **Predictable Amendments:**  
    - *Toggler/Cycler/Prime* might add: "The lamp state at t=1 is the limit of its states before t=1" (continuity).  
    - *Sticky Red* might add nothing (no challenge).  
    - *Cheater* might double down: "Ignore all toggles at t=1."  
  - **Instructor:** Push: "Did your stipulation feel honest? Or like cheating?"  

  #### **45–65 min: Betting and Debate (Whiteboard Bookie)**  
  - **Setup:** Instructor becomes "Bookie." Whiteboard table:  
    | Group | Machine      | t=1 State (Round 1) | t=1 State (Round 3) | Odds (1:1) |  
  - **Betting Rules:**  
    - Groups get 3 fake "credibility tokens" (paper scraps).  
    - Bookie offers 1:1 odds on *any* group’s Round 3 answer (e.g., "I bet 2 tokens Group 1’s lamp is ON").  
    - Groups bet on **other groups’ machines** (no self-betting).  
    - After bets, groups debate: "Why should we trust your state?"  
  - **Bookie Tactics:**  
    - Sow doubt: "Group 3 says RED, but is their machine even running at t=1?"  
    - Highlight conflicts: "Group 1 says ON, Group 5 says OFF—who’s right?"  
  - **Goal:** Groups realize no one "wins"—bets are unpayable because answers are arbitrary.  

  #### **65–75 min: Structured Debrief**  
  - **Start:** Poll each group’s final t=1 state. Write on board.  
  - **Map to Paradox:**  
    1. **"Is the lamp on or off?" (Toggler Group):**  
       - "You fought over parity. But infinity has no last flip—so parity is undefined. The machine card doesn’t specify t=1; it only specifies *before*."  
    2. **"No fact of the matter" (Cycler/Prime Groups):**  
       - "Your cycle/prime rule had no final state. The challenge exposed: the description pins down everything *before* t=1 but says *nothing* at t=1."  
    3. **Continuity Assumption (Amended Cards):**  
       - "When you added ‘the state at t=1 is the limit,’ you smuggled in math. But lamps aren’t continuous—they’re discrete! Thomson’s lamp shows continuity isn’t in the machine rules."  
    4. **"It has to be one or the other!" (Intuition):**  
       - "We *feel* lamps must be on/off. But that’s about *finite lamps*. Here, the machine’s description is incomplete—like asking for the last digit of π."  
    5. **Cheater’s Role:**  
       - "You resolved the paradox by fiat. But that’s legal! It shows the original machine *needs* extra rules to define t=1."  
  - **Close:** "Thomson’s lamp isn’t a trick. It’s a lesson: supertasks can underdetermine outcomes. The paradox forces us to see what we’re missing—like assuming continuity or finality."  

  ---

  ### **Predictable Problems & Fixes:**  
  - **"We don’t know how to challenge!"**  
    - *Fix:* Remind groups: "Find where their reason oversteps the card. E.g., ‘You assumed a last flip, but there isn’t one.’"  
  - **Sticky Red dominates debate:**  
    - *Fix:* Bookie says: "Group 3, what if someone says your machine breaks at t=1? Prove it’s RED!" Forces them to rely on their rule.  
  - **Math anxiety (Prime Checker):**  
    - *Fix:* Clarify: "Don’t count primes—just see if the rule *determines* a final state."  
  - **Time runs short:**  
    - *Fix:* Skip betting or reduce Round 3 to 10 min. Prioritize debate/debrief.  
  - **Groups miss underdetermination:**  
    - *Fix:* In debrief, contrast Sticky Red (determined) vs. Toggler (ambiguous). Ask: "Why did your card fail you?"  

  ### **What the Activity Can’t Do:**  
  - **Replicate the limit intuition:** Students won’t *feel* why we’re tempted to take a "limit" of lamp states. You’ll need to **supply this verbally in debrief**:  
    > "In math, we take limits of sequences. But lamps aren’t numbers! The states (ON/OFF) don’t converge. The parity argument secretly assumes infinity has parity—it doesn’t."  

  **Why This Works:**  
  - **No upfront lecturing:** The underdetermination emerges from group conflict.  
  - **Cards vary strategically:**  
    - Toggler primes parity debate.  
    - Cycler/Prime make parity irrelevant.  
    - Sticky Red shows determination *is* possible.  
    - Cheater exposes stipulation as a fix.  
  - **Betting makes stakes visceral:** Students "inhabit" the paradox.  

  **Final Tip:** End by turning on the real lamp. "This lamp is on *now*. But Thomson’s lamp? We built the machine—and still don’t know."
