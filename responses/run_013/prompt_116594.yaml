  Here's the pantoum, built for looping silence:

  The form declares: *attention-deficient*  
  He drifts through lessons, chalk dust in his hair.  
  *Not trying,* reads the note, *persistently inconsistent*.  
  He drifts through lessons, chalk dust in his hair.  

  He learns the term. It fits like borrowed clothes.  
  *Not trying,* reads the note, *persistently inconsistent*.  
  He finds the rhythm his distraction grows.  
  He learns the term. It fits like borrowed clothes.  

  *Malingerer*, the second file asserts.  
  He finds the rhythm his distraction grows.  
  The word arrives before the ache converts.  
  *Malingerer*, the second file asserts.  

  He wears it thin, then sharpens it to stone.  
  The word arrives before the ache converts.  
  A different weight now settles in the bone.  
  He wears it thin, then sharpens it to stone.  

  *Non-compliant*, states the final sheet.  
  A different weight now settles in the bone.  
  The label lands, but finds no place to meet.  
  *Non-compliant*, states the final sheet.  

  He drifts through lessons, chalk dust in his hair.  
  The label lands, but finds no place to meet.  
  The form declares: *attention-deficient*.  

  ---

  **How the loops work:**

  1.  **Structural Looping:** The pantoum's strict form forces lines to return, embodying the "looping effect" mechanically. The final stanza closes the circle by bringing back the opening lines.
  2.  **Meaning Shifts:**
      *   *"He drifts through lessons, chalk dust in his hair."* Starts as simple description. Returns later (*Stanza 5, Line 1*) carrying the accumulated history of labels and internalization. By its final return (*Stanza 5, Line 3*), the "drifting" feels different – perhaps more deliberate, defended, or weary, not just initial distraction.
      *   *"Not trying, reads the note, persistently inconsistent."* Starts as a clinical/judgmental external observation. Returns (*Stanza 2, Line 2*) as something he now *knows* about himself ("He learns the term"). Its final appearance (*Stanza 2, Line 4*) is just before he starts actively shaping his behaviour *around* the label ("He finds the rhythm his distraction grows").
      *   *"He learns the term. It fits like borrowed clothes."* Starts as him accepting/identifying with the first label. Returns (*Stanza 3, Line 1*) carrying that identification into the encounter with the *second*, harsher label ("Malingerer").
      *   *"Malingerer, the second file asserts."* Starts as a new, damaging external judgment. Returns (*Stanza 4, Line 1*) after he's begun to internalize/react ("He wears it thin..."). Its final appearance (*Stanza 4, Line 3*) precedes a line showing internal change ("A different weight now settles in the bone").
      *   *"The form declares: attention-deficient."* Starts as the initial, defining classification. Returns (*Final Line*) unchanged in words, but after the journey of the poem – the person changed by labels, the labels revised – it lands with profound irony. The "declaration" at the end feels hollow, unstable, or caught in its own loop, precisely because the person it names is no longer the same "deficient" subject it initially described. The target moved.
  3.  **The Labels:** Invented terms ("attention-deficient", "Malingerer", "Non-compliant") show progression from clinical-sounding to accusatory to institutional. The final label ("Non-compliant") explicitly fails to "find a place to meet" the changed person.
  4.  **Ambiguity/No Easy Ending:** The poem doesn't say labels are fake (the trouble, the changes, are real) nor that they are simple truths (the person actively reshapes and is reshaped). The final stanza's unresolved loop, ending on the unchanged-but-now-ironic declaration, embodies Hacking's "harder" point: the reality *is* the interaction, the unstable loop itself. The silence after the final line is where the magistrate and biologists can feel the unresolved tension.
  5.  **Standalone:** It tells the story of a person shaped by labels. The biology background resonates in the concrete imagery (chalk dust, bone, clothes, stone). The magistrate understands the weight of files and assertions. The looping form creates a palpable sense of inevitability and change. No Hacking knowledge needed, just attention to the returning lines and their shifting context.
