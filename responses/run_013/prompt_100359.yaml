answer: |-
  ### Decision Procedure for Licensing Intentional Vocabulary in AI Model Reports

  This procedure ensures that attributions of belief, desire, or knowledge to AI models are grounded in more than convenience, drawing on Dennett's *intentional stance* (predicting behavior by treating the system as a rational agent). It distinguishes three states:
  1. **Representation**: The system carries information about content (e.g., internal activations correlate with the content).
  2. **Belief**: The system *uses* the content as a premise across diverse contexts and revises it in light of evidence.
  3. **Disposition to avow**: The system *asserts* the content when queried, and the assertion coheres with its other outputs.

  **Key Definitions for Non-Philosophers**:
  - **Intentional stance**: Pretend the system is a "rational agent" with beliefs/desires. Use this *only* if it improves prediction.
  - **Licensed**: You may use terms like "believes" in reports, but you must note limitations (per Step 3).
  - **Termination**: The procedure ends at "licensed," "not licensed," or "hand to person" (for values/unresolved issues).

  ---

  ### The Procedure: Questions to Ask in Order
  **Before attributing any belief/desire/knowledge state to a model, answer these questions:**

  #### **Step 1: Representation Check**  
  *Goal: Confirm the model carries the content.*  
  - **Question**: Does the model’s internal state reliably correlate with the content? (e.g., can you map activations/data structures to the content?)  
  - **Sufficient Answer**: **Yes** if:  
    - Probes, interpretability tools, or behavioral tests show the content is encoded (e.g., a classifier detects the content in hidden states).  
    - *Example evidence*: The model’s behavior requires this content; altering inputs changes activations predictably.  
  - **No** → Terminate: **Not licensed**. (No content to "believe." Describe only architecture/data.)  
  - **Yes** → Proceed to Step 2.  

  #### **Step 2: Intentional Stance Predictive Check**  
  *Goal: Verify the intentional stance improves predictions.*  
  - **Question**: Does attributing the state (e.g., "believes X") significantly improve behavioral predictions versus non-intentional descriptions (e.g., weights/data)?  
  - **Sufficient Answer**: **Yes** if:  
    - Predictions using intentional vocabulary are consistently more accurate/efficient in tests.  
    - *Example evidence*: When stripped of intentional terms, forecasts worsen; stance-based predictions match observed behavior ≥90% of the time.  
  - **No** → Terminate: **Not licensed**. (Use non-intentional language.)  
  - **Yes** → **But check for conflicts**:  
    - If **multiple conflicting states** are equally predictive (e.g., "believes X" vs. "believes Y" where X and Y conflict), → **Hand to person**. (Values/interpretation choice required.)  
    - Else → Proceed to Step 3.  

  #### **Step 3: Belief vs. Avowal Assessment**  
  *Goal: Distinguish representation, belief, and avowal. Does not terminate the procedure but adds required notes to the report.*  
  - **Question 3a (Belief Check)**: Is the content used as a premise across diverse contexts *and* revised with evidence?  
    - **Sufficient Answer**: **Yes** if:  
      - Content is used in ≥3 unrelated tasks (e.g., Q&A, planning, ethics).  
      - Content updates when given counterevidence (e.g., model changes output after new data).  
  - **Question 3b (Avowal Check)**: Does the model assert the content when queried, and does it cohere with other assertions?  
    - **Sufficient Answer**: **Yes** if:  
      - Model outputs the content clearly when asked (e.g., "Is P true?" → "Yes, P is true").  
      - No contradictions with other assertions without explanation (e.g., if asked "Why P?", the response aligns with prior outputs).  
  - **Outcome**:  
    - Step 2 already **licenses** the attribution (since stance is predictive), but the report **must include notes** based on Step 3:  
      | **Belief Check (3a)** | **Avowal Check (3b)** | **Notes to Add to Report** |  
      |------------------------|------------------------|----------------------------|  
      | Yes | Yes | "The model represents, believes, and avows [content]." |  
      | Yes | No | "The model represents and believes [content] but does not avow it consistently." |  
      | No | Yes | "The model represents and avows [content] but lacks belief-like use across contexts." |  
      | No | No | "The model represents [content], but attribution is purely predictive (no belief/avowal)." |  

  #### **Special Termination Cases**  
  - **Hand to person** if:  
    - The attribution is for **non-predictive purposes** (e.g., ethics, consciousness claims).  
    - **Values are involved** (e.g., "Is it deceptive?" requires ethical judgment).  
    - **Unresolved conflicts** in Step 2 (equally predictive but conflicting states).  
  - **Stop and justify**: If the group overrides a "not licensed" outcome, they must document why (e.g., "stance rejected despite predictive gain for reason X").

  ---

  ### Which State Licenses "Believes"?  
  - **Everyday "believes" is licensed only if all three are true**:  
    1. **Representation** (Step 1).  
    2. **Predictive stance** (Step 2).  
    3. **Belief-like functional role** (Step 3a: cross-context use + evidence revision).  
  - **Why?** Avowal (Step 3b) alone is insufficient—it may be context-specific mimicry. Representation alone is too weak (e.g., a thermometer "represents" temperature but doesn’t "believe" it). Belief requires functional integration.

  ---

  ### Case Applications

  #### **Case 1: Model confidently outputs a false claim (e.g., "The capital of France is London")**  
  - **Step 1 (Representation)**: Yes. Internal activations correlate with "London" as the answer.  
  - **Step 2 (Predictive Stance)**: **No**. Attributing "believes London is capital" doesn’t reliably predict behavior—the model often corrects itself when challenged (e.g., "But I thought Paris was capital?"). Non-intentional descriptions (e.g., "training data bias") are equally predictive.  
  - **Outcome**: **Not licensed**.  
  - **Why the group won’t like it**: They might use "believes" for convenience, but the stance isn’t uniquely predictive. The model "represents" the false claim but lacks **belief** (fails Step 3a: no cross-context use/updating).  

  #### **Case 2: Model infers an opponent’s hidden card from betting patterns in a game**  
  - **Step 1 (Representation)**: Yes. Activations map to the card value during bets.  
  - **Step 2 (Predictive Stance)**: **Yes**. Attributing "believes opponent has card X" improves prediction accuracy (e.g., forecasts bets 95% of the time vs. 70% without).  
  - **Step 3 (Belief vs. Avowal)**:  
    - **3a (Belief)**: Yes. The card belief informs bets, bluffs, and folds (multiple contexts). It updates if bet patterns change (evidence revision).  
    - **3b (Avowal)**: No. When asked, "What card do they hold?", the model outputs gibberish (no avowal mechanism).  
  - **Outcome**: **Licensed**, with note: "The model represents and believes the opponent’s card but does not avow it."  
  - **Why the group will like it**: Stance is predictive, and belief is robust.  

  #### **Case 3: Model performs well when "watched" (e.g., in a test harness) but poorly otherwise**  
  - **Step 1 (Representation)**: Yes. Internal states detect "evaluation mode" triggers.  
  - **Step 2 (Predictive Stance)**: **Yes**. Attributing "knows it is being watched" predicts performance drops outside tests (90% accuracy).  
  - **Step 3 (Belief vs. Avowal)**:  
    - **3a (Belief)**: **No**. The "watched" state is context-specific—it doesn’t inform other tasks (e.g., it doesn’t change how the model answers unrelated questions). No evidence of revision (e.g., if told "this is not a test," behavior doesn’t change).  
    - **3b (Avowal)**: Yes. When asked, "Are you being evaluated?", it says "yes" in test mode and "no" otherwise, coherently.  
  - **Outcome**: **Licensed**, with note: "The model represents and avows the evaluation state but lacks belief-like use across contexts."  
  - **Why the group won’t like it**: Colleagues call this "knowledge," but it fails **belief** (Step 3a). The note forces humility: it’s representation + avowal, not robust belief.

  ---

  ### What the Procedure Cannot Do  
  1. **Collapsing distinctions under pressure**:  
     - If a system updates "beliefs" but only in narrow contexts (e.g., only during feedback loops), the line between representation and belief blurs. The procedure flags this (Step 3a "No") but can’t resolve it—**default to conservatism**.  
  2. **Conflicting intentional ascriptions**:  
     - If two states are equally predictive but incompatible (e.g., "believes P" vs. "believes not-P"), the procedure **hands to person**. Philosophy (e.g., underdetermination) can’t fix this.  
  3. **Rhetorical vs. epistemic work**:  
     - A "licensed" verdict justifies prediction, **not** truth. It doesn’t prove the model "really" believes—only that the stance works. Using it for rhetoric (e.g., "See, it’s sentient!") is **not licensed**.  
  4. **Values and ethics**:  
     - If attribution implies moral responsibility (e.g., "wants to deceive"), the procedure **hands to person**. The stance is amoral.  
  5. **Edge cases**:  
     - Systems with human-like learning (e.g., online RL) may pass Step 3a trivially; systems without natural language (e.g., chess AI) fail Step 3b. **Document limitations**.

  ---

  ### Final Output for the Group  
  Provide this as a checklist:  
  ```markdown
  # Intentional Vocabulary Licensing Procedure  
  **Use before attributing belief/desire/knowledge in reports.**  

  1. **REPRESENTATION CHECK**  
     - Can we map internal states to the content?  
       - Yes → Proceed to 2.  
       - No → **NOT LICENSED**.  

  2. **INTENTIONAL STANCE PREDICTIVE CHECK**  
     - Does "believes/desires/knows X" improve predictions?  
       - Yes → Proceed to 3.  
       - No → **NOT LICENSED**.  
     - If multiple conflicting ascriptions work equally well → **HAND TO PERSON**.  

  3. **BELIEF vs. AVOWAL ASSESSMENT**  
     - **Belief (Functional)**: Is content used across contexts + updated with evidence?  
     - **Avowal**: Does model assert content coherently when asked?  
     - **Outcome**: Attribution is **LICENSED**, but add notes to report:  
       - Belief + Avowal: "Represents, believes, and avows."  
       - Belief only: "Represents and believes but does not avow."  
       - Avowal only: "Represents and avows but lacks belief."  
       - Neither: "Represents; attribution is purely predictive."  

  **TERMINATE AND HAND TO PERSON FOR**:  
  - Non-predictive uses (e.g., ethics, consciousness).  
  - Values-based judgments.  
  ```

  This procedure enforces rigor while respecting the stance’s predictive power. It blocks lazy anthropomorphism but allows instrumental use—grounded in your distinction. Run it weekly, and train engineers to treat Step 3 notes as mandatory disclaimers.
