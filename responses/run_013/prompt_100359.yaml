  Step 1: Check for Representation
     Question: Does the system's internal state carry information about the content in question, such that we could, in principle, read that content off from the state? 
     Sufficient Answer: Yes, if we can identify a state or set of states that reliably correlate with the content and that are used by the system in processing.
     If No: Stop. Not licensed to attribute belief, desire, or knowledge. (Without representation, there's no content to be a candidate for belief.)
     If Yes: Proceed to Step 2.

