prompt: |-
  I'm a science journalist at work on a long feature about the units-of-selection debate — the running argument in evolutionary biology over whether natural selection is best described as acting on genes, on individual organisms, or on groups, and over whether that choice is a substantive claim about the world or merely a convenient way of keeping the books. A friend who studies social evolution and I have been going around on this for weeks, and I've decided the piece needs one concrete case to hang on rather than the examples that turn up in every undergraduate lecture — the sterile workers of the social insects, the alarm call of the ground squirrel. So what I want from you is an example of a conceptual issue in the debate, made vivid by a specific biological case: a case in which the group-level story and the gene-level story both fit the evidence, and in which a reader can feel the pull of each. Then tell me what actually turns on the choice. I keep running into a distinction that philosophers of biology draw between a 'causal' reading of group selection, on which groups really are doing the selecting, and a 'bookkeeping' reading, on which group-level language is just shorthand for tallying up gene-level effects; and beside it sits the older vocabulary of 'replicators' and 'interactors' — genes as the entities that get copied, organisms or groups as the entities that meet the environment and bear the fitness consequences. I'd like whatever case you choose to make those distinctions do real work rather than merely illustrate them.

  Because I'm writing for a general readership, walk me through the biology patiently — what the organism does, what the arithmetic looks like, why the two descriptions come apart at all. And be candid about the state of play: which parts of your example are settled, which remain genuinely contested among working biologists and philosophers, and where the disagreement is really about words rather than about nature. If it helps to narrow the search, I'm especially drawn to cases where something practical hangs on the answer — how we draw the boundary of an individual organism, say, or how we understand cooperation, or how we make sense of selection happening inside a body rather than between bodies.
