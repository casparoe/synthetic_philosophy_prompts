prompt: |-
  I chair the committee that just pushed through ranked ballots for all our departmental elections, and Thursday's faculty meeting is where I get five minutes to introduce the new system. Half the room are economists who know Gibbard–Satterthwaite cold; the other half are humanists who'll glaze over the second I say 'incentive compatability,' and the dean is in the front row. The trouble is that my natural pitch -- rank honestly and let the system sort it out -- is exactly what the theorem forbids: any rule that can put any one of three or more candidates in the winner's slot, and that never gives a voter a reason to misreport, has to be dictatorial. The one clean escape (everyone's preferences credibly single-peaked along a left-right line, where taking the median is honest by construction) doesn't fit a department whose fights aren't one-dimensional, and don't offer me the random-ballot dodge, I already lost that argument upstairs. So write the remarks: honest about manipulability, no proof, five minutes, and it has to end with people actually bothering to vote. Sound like someone introducing a thing he believes in with reservations, not like a seminar.
reasoning: |-
  Okay, let me unpack this faculty meeting challenge. The user chairs a committee that implemented ranked-choice voting for departmental elections, and needs to introduce it to a polarized audience: economists who know Gibbard-Satterthwaite intimately, and humanists who'll tune out technical jargon. The dean is watching. 

  The core tension is fascinating - their natural "rank honestly" pitch contradicts the impossibility theorem, yet they must convince people to participate despite strategic voting being theoretically inevitable. The constraints are brutal: no proofs, 5 minutes, must sound authentic (not academic), and end with a voting participation call-to-action. 

  First, I recognize the audience segmentation requires dual-channel messaging: economists need their expertise acknowledged without drowning others in theory, while humanists need concrete voting mechanics framed through familiar concepts like "expressing preferences." The dean's presence means emphasizing institutional legitimacy.

  The theorem problem is thorny. I consider three approaches: 
  - Full disclosure might paralyze voters 
  - Oversimplification risks economist backlash 
  - Middle path: name-drop the theorem casually but pivot to practical resilience ("like democracy itself"). 

  For humanists, I'm thinking of tactile metaphors - "ranking candidates like favorite books" avoids game theory. The "not chess" analogy feels right - acknowledging strategy exists while deprioritizing it for most voters.

  The participation angle is crucial. I land on reframing manipulability as academic freedom: "Your ballot is your voice" makes strategic voting feel like personal agency rather than system failure. Ending with "power of the pen" ties back to humanist values while nodding to economists' realism.

  Structure-wise: 
  - Opening disarms with humor (sweaty palms) 
  - Quick "why rank?" benefits 
  - Transparent limitations ("no perfect system") 
  - Participation as collective action 
  - Closing circles to committee's belief in the system

  I'm careful to avoid: 
  - Apologetic tone (undermines legitimacy) 
  - False certainty ("just rank honestly!") 
  - Jargon like "single-peaked preferences" 
  - Defensive language about committee choices

  The "sound like someone who believes with reservations" note is key. Phrases like "we think it's the best available tool" and "your participation matters" convey principled support without dogma. Economists get subtle winks ("you might see opportunities..."), humanists get poetic closure ("power of the pen").
answer: |-
  Here’s a concise, human-centered pitch that acknowledges the elephant in the room while rallying participation—tailored for your 5-minute slot:

  ---

  **(Start warm, conversational)**  
  "Colleagues, after two years of committee work, we’re launching ranked-choice voting for all department elections—starting now. Why? Because when three candidates run for one seat, ‘pick-one’ ballots often split the vote. Ranked choice lets you say *more*.  

  **(Brief mechanics—no jargon)**  
  Here’s how it works: You’ll rank candidates 1, 2, 3… as simple as ordering coffee favorites. If no one gets 50% of first choices, we reassign votes based on your backups until someone does. It’s like a runoff without dragging you back to the polls.  

  **(Acknowledge the theorem—lightly)**  
  Now, some of you—*especially economists*—might be thinking: ‘But what about strategic voting?’ Fair. **No system is immune to gaming.** If you deeply prefer an underdog, ranking them first *could* feel risky. But here’s why we still back this:  

  **(Reframe honestly)**  
  First, **most races aren’t nail-biters**. Sincerity’s your best bet. Second, **transparency cuts manipulation**: Results are public, counts are auditable. Third, and this matters—**ranking truthfully strengthens your voice**. If your backup choice wins? That’s the system working.  

  **(Direct appeal—humanists & economists)**  
  This isn’t chess. It’s a tool to capture nuance in a department where—let’s be honest—our disagreements don’t fit on a tidy line. **Your ballot isn’t just a vote; it’s a signal.** The more of you who rank sincerely, the more legitimate the outcome.  

  **(Close—action-oriented)**  
  So when ballots land in your inbox: **Rank like it matters.** Not because the system’s perfect—no democracy is—but because your preferences *deserve the depth*. This only works if you show up. Let’s make this experiment count.  

  **(Smile, eye contact with dean)**  
  Questions? I’ll take them after elections… just kidding. But seriously—we’ve got FAQs online. Now, go make some rankings. Thanks."  

  ---

  ### Why this works:
  1. **Economists** hear their concern named ("strategic voting") without a lecture, validating their expertise while redirecting to practical constraints ("most races aren’t nail-biters").  
  2. **Humanists** get intuitive metaphors ("ordering coffee") and emotional stakes ("your preferences deserve depth").  
  3. **The dean** sees leadership: You’re transparent about trade-offs ("no system is immune") but champion participation as the fix.  
  4. **No lies**: Doesn’t claim "rank honestly always works," but argues sincerity *usually* serves voters best—and collective buy-in minimizes manipulation.  
  5. **Tone**: Conversational ("let’s be honest"), humble ("this experiment"), and forward-focused ("go make rankings").  

  **Key save**: By framing voting as "signaling" and "voice," you sidestep Gibbard-Satterthwaite’s doom loop. You’re not denying theory—you’re arguing that *in practice*, participation and transparency are stronger forces.
