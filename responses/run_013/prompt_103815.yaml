prompt: |-
  My roommate and I keep getting into it over this. She says "what if everyone did that?" like it's checkmate — most recently when I told her I wasn't going to vote this cycle, and she said to imagine everyone staying home. I've heard the same move from my mom about me not returning the shopping cart, and from a friend about buying stuff from a fast-fashion site. It's obviously supposed to be Kant's universalizability test in street clothes, but half the time it sounds like she just means "if everyone did it, the consequences would be bad," which is definately not the same thing, right?

  I want a proper breakdown of the distinct things "what if everyone did that?" could actually be asserting. Like: (a) the prudential/Hobbesian warning that if everyone did it you personally would end up worse off; (b) the rule-consequentialist claim that the world where everyone does it is worse overall; (c) the Kantian move where you try to universalize your maxim and hit a contradiction; (d) something about fairness, cheating, or free-riding; (e) the universal-prescriptivism thing where you have to be able to endorse everyone acting on the same principle. And within the Kantian reading there's the further mess about whether the contradiction is a contradiction in conception or a contradiction in the will, and about how you're even supposed to describe the maxim in the first place — my maxim isn't "don't vote," it's "skip voting in this particular low-stakes election because I'm busy," and does that universalize fine? If the answer depends on how I word the maxim, that seems like a problem.

  For each reading, tell me whether it's trivial or substantive, whether it's actually plausible, and whether it even gets her to "so you should vote." Then tell me which reading people usually have in mind when they deploy the line, because I suspect it's the vaguest one. Also, which of these readings survive the standard objections — the gap between "everyone doing it" and "everyone being permitted to do it," the act/omission thing, the fact that some maxims universalize cleanly and still feel wrong. Lay it out as a menu I can actually argue from, not a lecture.

  Please write your answer in American English.
reasoning: |-
  Okay, the user is frustrated with their roommate constantly using "what if everyone did that?" as a moral checkmate. They want a clear breakdown of the different interpretations of this argument, along with critiques and practical responses. 

  Hmm, they're clearly philosophically literate - referencing Kant, Hobbes, rule-consequentialism with ease. But they're not looking for academic theory; they want ammunition for real arguments. The shopping cart/voting/fast fashion examples show this is about daily life friction.

  The core tension I notice: they recognize the roommate's argument is philosophically sloppy, but can't articulate why in the moment. They need rhetorical tools, not just analysis. The request for a "menu" suggests they want modular comebacks tailored to different interpretations.

  Let me structure this carefully. First, unpack the five distinct philosophical moves hiding in that phrase:
  - Prudential self-interest (Hobbes)
  - Rule-consequentialist outcome
  - Kantian universalization
  - Fairness/free-rider problem
  - Hare's prescriptivism

  For each, I should flag: 
  - Is this what people usually mean? (Spoiler: no, they blur them)
  - Does it logically work? (Often no)
  - Can it be countered? (Yes, with specific objections)
  - Does it force action? (Rarely)

  Biggest landmines to address: 
  The Kantian version is especially messy - maxim wording changes everything. "Skipping one vote" vs "never voting" universalize differently. And the roommate probably isn't distinguishing between conceptual contradictions (logical impossibility) and volitional ones (undesirable outcomes).

  Also need to highlight the bait-and-switch: people invoke Kant's rigor but actually mean "consequences would suck." The voting example exposes this - everyone skipping votes collapses democracy, but that's consequentialist, not Kantian.

  Practical response strategy: teach user to first expose the ambiguity ("Which 'what if' do you mean?"), then dismantle the chosen interpretation. The "you're not everyone" card works against fairness arguments, while the "permitted vs actual" distinction kills Kantian overreach.

  Most satisfying bit to include: pointing out that by the roommate's own logic, she shouldn't use this argument... because if everyone deployed it thoughtlessly, discourse would collapse. Poetic justice.
answer: |-
  Here's your tactical breakdown of the "what if everyone did that?" (WIE) argument – formatted as a response menu you can deploy in real time, with weaknesses highlighted:

  ### The WIE Argument Decoder & Counterplay Menu

  1.  **The Prudential Self-Interest Warning (Hobbesian)**
      *   **What it asserts:** "If everyone did X, society would collapse/things would suck, *and you personally would suffer horribly as a result.* So don't do X for your own good."
      *   **Plausible?** Sometimes. True for things like littering, rampant theft, violence. Less so for voting (your one vote likely doesn't prevent collapse), shopping carts (chaotic parking lots are annoying, not catastrophic for *you*), or niche fast fashion buys.
      *   **Gets to "You Should Vote"?** Weakly. Your individual non-vote likely doesn't trigger societal collapse harming *you* significantly. The "you personally" harm is too remote.
      *   **Usual User Intent?** Rarely pure Hobbes. People usually blend this with consequence-worries.
      *   **Key Weaknesses:**
          *   **The "You're Not Everyone" Gap:** The harm only materializes if *critical mass* does it. Your single act usually doesn't push the system over the edge. ("My one skipped vote doesn't cause democracy to collapse.")
          *   **Trivializes Easily?** For many acts, the personal harm *is* trivial even if everyone does it (e.g., everyone wears mismatched socks).
      *   **Your Countermove:** "Sure, if *literally everyone* stopped voting, that'd be bad. But my one vote not being cast *right now* doesn't cause that disaster. You're punishing me for a hypothetical apocalypse I didn't create."

  2.  **Rule-Consequentialism (World Gets Worse Overall)**
      *   **What it asserts:** "A world where *everyone* does X is objectively worse than a world where no one does X (or everyone follows the rule). Therefore, X is wrong."
      *   **Plausible?** Highly intuitive and common sense for many acts (murder, pollution). Feels substantive.
      *   **Gets to "You Should Vote"?** Stronger link. A world with 0% turnout *is* worse for democracy than one with high turnout. Your act contributes (minimally) to the better world.
      *   **Usual User Intent?** **THIS IS PROBABLY WHAT THEY MOSTLY MEAN (The Vague One).** It's the gut feeling: "If *everyone* just left their carts, the lot would be a mess!" Consequences are king here.
      *   **Key Weaknesses:**
          *   **The Act/Omission Distortion:** Treats *not voting* (an omission) exactly like *actively harming* (e.g., littering). Is failing to contribute morally identical to actively damaging? Debatable.
          *   **The Critical Mass Problem:** The bad world only happens at near-universal defection. Does your single omission meaningfully move us towards that bad world? Often, barely.
          *   **The "Better Rule" Challenge:** Is "Always Vote" *really* the best rule? What about "Vote when reasonably informed/impacted"? Maybe the latter rule universalizes better.
      *   **Your Countermove:** "Okay, a 0% turnout world *is* worse. But we're nowhere near that. My skipping *this specific low-stakes election* because I'm swamped doesn't measurably make the world worse. Shouldn't the rule be more nuanced than 'vote always or chaos'?"

  3.  **Kantian Universalizability (The "Real" Categorical Imperative Test)**
      *   **What it asserts:** "Can you consistently *will* that the *maxim* (your personal rule) behind your action become a *universal law* without contradiction?"
      *   **Sub-Readings:**
          *   *Contradiction in Conception:* Universalizing makes the action *logically impossible* (e.g., universal lying destroys the concept of promises).
          *   *Contradiction in Will:* Universalizing creates a world you *rationally couldn't will* because it destroys something necessary for rational agency (e.g., universal neglect destroys help you might need).
      *   **Plausible?** Powerful *if applied rigorously*. But maxim-wording is EVERYTHING and notoriously slippery.
      *   **Gets to "You Should Vote"?** Highly dependent on the maxim.
          *   **Bad Maxim:** "I will never vote." Universalizing this *might* lead to a contradiction in will (destroys democracy needed for rights/agency).
          *   **Your Maxim:** "I will skip voting in low-stakes elections when I'm genuinely overwhelmed with work." Universalizing this *doesn't* obviously cause contradiction. Democracy likely survives if *only* busy people skip *low-stakes* votes. No logical impossibility, and you might rationally will this world.
      *   **Usual User Intent?** **RARELY.** They *invoke* Kant's prestige but usually mean #2 (consequences). They ignore maxim-wording.
      *   **Key Weaknesses:**
          *   **The Maxim-Wording Trap:** The argument lives or dies on how you phrase your personal rule. Opponents will try to force the worst-faith wording ("You just don't want to vote!").
          *   **"Permitted" vs. "Actual":** Kant tests universal *permissibility*, not universal *occurrence*. A world where skipping *is allowed* under certain conditions ≠ a world where *everyone actually does it* constantly.
          *   **False Positives/Negatives:** Some terrible maxims universalize fine ("Always favor your family"). Some benign ones might not.
      *   **Your Countermove:** "Hold on, Kant requires testing *my actual reason*, not the worst possible one. My maxim is 'Skip *occasionally* when overwhelmed in *low-impact* votes.' Can you show that universalizing *that specific rule* creates a logical contradiction or a world no rational person could want? Democracy seems pretty robust to some busy people sitting out small elections."

  4.  **Fairness / Anti-Free-Riding**
      *   **What it asserts:** "You're benefiting from a system/good (democracy, clean parking lots, cheap clothes) that relies on widespread cooperation. If you defect (don't vote, don't return cart, buy exploitative clothes) while others cooperate, you're being unfair – you're a *free rider*."
      *   **Plausible?** Very strong for cooperative systems. Feels immediately substantive.
      *   **Gets to "You Should Vote"?** Potentially the *strongest* link for voting. Democracy is a classic public good vulnerable to free-riding. Your vote (or civic duty) is the "price" for the benefits.
      *   **Usual User Intent?** Very common, especially with voting and carts. Often blended with #2.
      *   **Key Weaknesses:**
          *   **The Threshold Problem:** Does your single defection *actually* harm the system or just minimally increase the burden on cooperators? For voting, the harm is diffuse.
          *   **Opting Out?:** Can you *avoid* the benefits? (Can you avoid benefiting from democracy? From a usable parking lot? Arguably not).
          *   **Counter-Examples:** What if the system is corrupt/unjust? Is free-riding *always* wrong then? (Buying fast fashion might fund exploitation, but does avoiding *one purchase* make you a free rider on ethical consumption? Debatable).
      *   **Your Countermove:** "Free-riding *is* a problem, I agree. But is my *single act* of skipping *this one vote* because I'm drowning in work *really* unfair exploitation of voters? The system doesn't collapse from occasional, justified skipping. The burden on others is microscopic. Shouldn't fairness allow for reasonable exceptions?"

  5.  **Universal Prescriptivism (Hare)**
      *   **What it asserts:** "If you say *you* should do X, you're logically committed to saying *anyone in exactly your situation* should also do X. So, can you honestly say 'Everyone in my exact position should skip voting/buy fast fashion/not return carts'?"
      *   **Plausible?** Logically tight for moral judgments. Forces consistency.
      *   **Gets to "You Should Vote"?** Yes, *if* you concede that skipping is permissible *for you*. It forces you to endorse that same permission universally.
      *   **Usual User Intent?** Almost never. This is meta-ethics, not street debate.
      *   **Key Weaknesses:**
          *   **The "Exact Situation" Dodge:** You can always claim your situation is unique ("*My* workload *this week* is unprecedented!"). This weakens the force.
          *   **Doesn't Prove Wrongness:** It exposes hypocrisy, but doesn't prove the *act itself* is wrong, only that you can't make an exception for yourself. Someone else might consistently endorse universal skipping.
      *   **Your Countermove:** "Okay, prescriptivism. Fair point on consistency. So, yes: *if* I genuinely believe it's okay for *me* to skip *this specific vote* due to my current workload in this low-stakes race, then I *am* logically saying it would be okay for anyone else *in this exact situation* to skip too. I can live with that principle. It doesn't mean I think *everyone* should *always* skip."

  ### The Quick-Reference Cheat Sheet

  | **Argument Type**      | **What They *Think* They're Saying** | **What They *Usually* Mean** | **Strongest Countermove**                                                                 | **Works for Voting?** |
  | :--------------------- | :----------------------------------- | :--------------------------- | :---------------------------------------------------------------------------------------- | :-------------------- |
  | **Prudential (Hobbes)** | "You'll personally suffer!"          | Rarely pure                  | **"My one act won't cause the collapse that hurts me."**                                   | ❌ Weak               |
  | **Rule-Consequentialism** | "The world would be worse!"          | **✅ MOST COMMON VAGUE FORM** | **"We're not near universal defection. My act doesn't make it meaningfully worse."**       | ⚠️ Moderate          |
  | **Kantian**            | "It's logically wrong!"              | Rarely (misapplied)          | **"Define MY maxim accurately first. Universal *permission* ≠ universal *action*."**       | ⚠️ Depends on Maxim |
  | **Fairness/Free-Riding** | "You're cheating the system!"        | Very Common (voting/carts)   | **"Is my single, justified omission *really* unfair exploitation?"**                      | ✅ Strongest         |
  | **Prescriptivism**     | "You're being hypocritical!"         | Almost Never                 | **"Yes, if it's okay for me *in this exact spot*, it's okay for anyone *in this exact spot*."** | ⚠️ Forces Consistency |

  ### How to Deploy This Menu

  1.  **Call the Bluff:** "Okay, 'what if everyone did that?' Let's break that down. Which version do you mean? Are you saying..."
  2.  **Pick the Reading:** Identify which type(s) they seem to be invoking (likely #2 or #4 for voting/carts, maybe #3 poorly applied).
  3.  **Deploy the Countermove:** Hit them with the specific weakness from the menu above.
  4.  **Force Nuance:** "It's not that simple. The 'WIE' argument only works if..." (explain the gap for their chosen reading).
  5.  **(Optional Pro Move):** Point out *their* inconsistency: "By that logic, you shouldn't use the 'WIE' argument casually either. If *everyone* deployed it as vaguely as you just did, it would shut down legitimate moral discussion and nuance!" (Applies a prescriptivist or consequentialist critique to *their* act).

  **Bottom Line:** The WIE move is usually a blunt instrument (#2 or #4) wielded as if it were a precision Kantian tool (#3). Its power comes from vagueness. Force specificity, expose the gaps (critical mass, maxim wording, act/omission, fairness vs. impact), and defend *your* nuanced reason. You don't have to win the philosophy gold medal on the spot, just show their "checkmate" isn't one.
