  Second, how existing defenses gloss over this—like compulsory voting advocates using "equal voice" rhetoric that implicitly assumes universal membership, while non-citizen voting rights lean on "affectedness" but ignore minors. 
  Third, the methodology must be conceptual, not empirical, since surveying turnout studies wouldn't resolve the philosophical clash. 

  For the "failure condition," it should be if the reforms turn out reconcilable after all—that'd undermine their core hypothesis. Also worth emphasizing deliverables: a typology framework plus concrete conflict points, not a grand unified theory. 

  The tone should be rigorous but not stuffy—they're a journalist, after all. Proposal structure needs classic academic framing: gap in literature → research question → method → significance. And absolutely no fluff about "democracy is important"; they'll hate that. 

  ...Wait, should I flag that their demos principles might need refining? The "subject to law" one is messy (e.g., tourists are subject to law but rarely included in demos). But that's for their research to tackle—the proposal can present it as an open question. 

  Most importantly: keep it lean. They'll flesh out citations.
answer: |-
  Here’s a structured proposal tailored to your specifications, focusing on conceptual clarity, methodological rigor, and realistic scope for a six-month part-time fellowship:

  ---

  ### **Project Title:**  
  *Reconciling the Demos: The Unacknowledged Tensions in Democratic Inclusion Reforms*

  ### **Core Research Question:**  
  **Do the three core democratic reforms—compulsory voting, lowering the voting age to 16, and non-citizen resident voting—presuppose irreconcilable definitions of the *demos*, and how do existing normative justifications obscure this tension?**

  ### **The Gap in Existing Defenses:**  
  Current advocacy for these reforms treats them as modular, consensus-driven expansions of democracy, grounded in distinct pragmatic or moral claims (e.g., turnout equality, cognitive maturity of youth, or residency-based taxation). Yet these defenses evade the foundational question: **Who constitutes the legitimate *demos*?** Two principles dominate this debate:  
  1. **The Subjection Principle**: Membership requires being subject to the state’s coercive laws (excluding non-citizens, including minors).  
  2. **The Affectedness Principle**: Membership requires being impacted by political decisions (including non-citizens, excluding non-residents).  
  *The gap*: Reform advocates implicitly borrow from *both* principles to defend their preferred policy while ignoring how their logic undermines companion reforms. For example:  
  - **Compulsory voting** assumes a fixed demos (subject to law) to achieve equality *within* it, but ignores whether that demos *should* include 16-year-olds or non-citizens.  
  - **Non-citizen voting** invokes affectedness to justify inclusion but sidesteps why minors (deeply affected) are excluded.  
  - **Lowered voting age** leans on youth’s subjection to laws (e.g., climate policy) but avoids whether affectedness extends membership further.  

  ### **Methodology: Conceptual Mapping & Normative Analysis**  
  This project employs **political theory-driven conceptual archaeology** to:  
  1. **Deconstruct** the unstated premises in key texts (academic, legal, advocacy) defending each reform.  
  2. **Map** how each defense selectively applies subjection/affectedness to resolve its own contradictions.  
  3. **Test for Coherence**: Model whether a unified demos definition can endorse all three reforms without inconsistency.  
  *Why conceptual, not empirical?* Turnout studies or policy evaluations cannot resolve *normative* conflicts about the demos’ boundaries. Conceptual clarity must precede empirical analysis—else reforms risk building on unstable foundations.  

  ### **Deliverables & "Result" Definition:**  
  - **A Typology of Democratic Membership**: Cataloguing how each reform redefines "the people" and the trade-offs required.  
  - **Conflict Mapping**: Visualizing points of irreconcilability between reform justifications (e.g., if non-citizen voting adopts affectedness, can it exclude minors without contradiction?).  
  - **A "Reconciliation Threshold"**: Criteria determining when tensions are resolvable (e.g., via a hybrid demos theory) or fatal.  
  **Success** = Demonstrating that the reforms *cannot* be coherently unified under existing justifications, forcing advocates to either revise their premises or accept incompatibility.  
  **Failure** = Finding that the tensions are superficial or easily harmonized, negating the core hypothesis.  

  ### **Scope & Feasibility (6 Months, Part-Time):**  
  - **Phase 1 (2 months)**: Close reading of foundational texts for each reform (e.g., Arendt/Brennan for compulsory voting; COE reports on voting age; Bauböck/Shachar on non-citizen rights).  
  - **Phase 2 (2 months)**: Comparative analysis of demos definitions across cases, identifying "conceptual borrowing."  
  - **Phase 3 (1.5 months)**: Modeling coherence scenarios (e.g., "Can a demos defined by *subjected affectedness* accommodate all three?").  
  - **Phase 4 (0.5 months)**: Synthesis and framework drafting.  
  *Limitations*: Excludes empirical polling, legislative history, or case studies. Focuses on Anglo-European contexts.  

  ### **Significance:**  
  This project exposes the **unstable core of contemporary democratic reform coalitions**. By forcing clarity on the demos question, it challenges advocates, policymakers, and scholars to either defend their contradictions or rethink first principles—strengthening democratic theory’s relevance to real-world inclusion debates.

  ---

  ### **Why This Fits the Fellowship:**  
  - **Theoretical Grounding**: Directly engages democratic theory’s oldest question (*Who are the people?*).  
  - **Policy Relevance**: Unpacks hidden fractures in reform movements.  
  - **Novelty**: Treats the three reforms as a *system* of ideas, not isolated policies.  
  - **Output**: Creates a transferable framework for evaluating future inclusion claims.  

  This proposal isolates a precise conceptual problem, offers a method to dissect it, and defines clear benchmarks for success/failure—all within a part-time six-month scope.
