prompt: |-
  I'm a novelist, about two thirds of the way through a book, and I've hit a wall that isn't a plot problem. Part of it is set in a lab that handles samples from space, and near the end a character has to sign a form that says, in effect, whether the thing in the tube is alive. Not whether it's dangerous, not whether it's a person — just alive. I can't write that scene until I know what I think, because every time I try to write her reasoning I end up writing a different reason.

  So here's what my gut says, case by case, and I want to know what principle, if any, is doing the work — and which of these I have to give up.

  A bacterium in a puddle: alive, obviously. A rock: not. A virus: not alive, and I'm firm about that, even though I'd flinch at calling one dead — you inactivate a virus, you don't kill it, and that asymmetry means something to me. A viroid, which is just a little loop of RNA with no coat at all that hijacks a plant's machinery to copy itself: not alive, same as the virus, and honestly it feels even less alive. A prion, a misfolded protein that makes other proteins misfold the same way: not alive, doesn't even tempt me. A plasmid, a loop of DNA in a bacterium that gets copied along with the cell and sometimes jumps ship: not alive. A transposon, a stretch of DNA that copies itself around inside a genome: not alive.

  Then the ones that make trouble. A mitochondrion in one of my cells: not alive, it's an organelle, even though it used to be a free-living bacterium and still has its own DNA and divides on its own schedule. But Chlamydia, which also can't reproduce outside a host cell and has a stripped-down genome: alive. I say that without hesitating and I can't tell you why the mitochondrion loses and the chlamydia wins.

  A mule: alive, obviously, even though it's sterile and can't pass anything on. A red blood cell with no nucleus: alive, I guess, or at least part of something alive. But a virus, whose whole problem is that it can't reproduce by itself, is not alive. So being unable to reproduce doesn't disqualify the mule and does disqualify the virus, and I don't know what the difference is. Maybe the mule is still made of cells and the virus isn't, but that just moves the question back a step.

  The giant viruses are where I lose it. There's a family of them that infect amoebas and have genomes bigger than the genomes of some bacteria I'd call alive without blinking. If I set a bacterium with one of the smallest known genomes — a thing that lives and eats and divides and does almost nothing else — next to a virus with a bigger genome and more genes, I call the small one alive and the big one not, and the only difference I can point to is that one of them has ribosomes. Which feels like a real difference. But a ribosome is a machine, and I wouldn't call a machine alive.

  Two more. Somebody built a bacterium whose genome was written out on a computer and assembled in a lab, starting from a species that already existed; the thing grew and divided, and I'd say it's alive, no question. And in a test tube you can have a short piece of RNA that, given the right enzyme and a supply of building blocks, just copies itself over and over with no cell involved. I'd say that's not alive. Same chemistry, different verdict, and the difference I keep reaching for is that the bacterium has a membrane and a metabolism — but I don't think I actually believe membranes are the line, because I'd call a bacterium that had its membrane stripped off dead rather than not-alive in the first place.

  And the one I genuinely keep flipping on: a lichen. Fungus plus alga, tangled up so completely that neither partner manages on its own out in the open, and the pair has a shape and a lifespan and a way of spreading that neither has alone. I want to say the lichen is alive. But if a partnership can be a living thing, I don't see why a mitochondrion and its cell can't be one living thing too, and then the mitochondrion is alive by proxy and I've undone the thing I was most sure about.

  So: is there one principle that gets all of this, or close? I'm happy with something inelegant if it actually holds. I'd also like to know what it says about a case I haven't listed — pick one yourself and tell me what your principle does with it — and say plainly which of my verdicts it makes me drop, because I suspect at least one has to go and I'd rather know which. Also, what does it do with the fact that things stop being alive? Bleach kills the bacterium, so aliveness is a phase it's in and then isn't; but a virus was never alive and never becomes not-alive, so for the virus there's no phase at all. If your principle can't explain that asymmetry, say so.

  One thing: write it as continuous prose, please — no headings, no bullet points, no bold, no tables. Just explain it the way you'd explain it in an email. I'll be reading it on my phone on the train, and it's been a wierd week, so go easy on me, but don't go easy on the argument.
reasoning: |-
  Okay, the user is a novelist stuck on a scene where a character has to decide if something in a tube is alive. They've laid out their intuitions about various cases—bacteria (alive), rocks (not), viruses (not alive), mules (alive), mitochondria (not), and so on—but can't find a consistent principle. They want a unified theory that explains all these judgments, even if it means sacrificing some of their current beliefs. 

  First, I notice their struggle isn't just academic—it's blocking their writing. The frustration is palpable: they keep rewriting the character's reasoning because their own thoughts are inconsistent. That "weird week" mention hints they're emotionally drained, so clarity and compassion matter. They’re not asking for a biology lesson; they need a philosophical tool to unblock their story. 

  Their examples reveal a pattern: they intuitively tie "alive" to *active metabolic self-sustainment*. Bacteria eat, grow, divide—clearly alive. Viruses just... exist until they hijack. But contradictions emerge: mitochondria (metabolically active but not "alive") vs. Chlamydia (same metabolic dependence, yet alive). The mule example is key—they concede sterility doesn’t disqualify it because it’s still *doing* things (eating, moving), unlike a virus. That suggests "alive" isn’t about reproduction for them, but *ongoing self-driven activity*. 

  The ribosome point is telling. They note bacteria have them and viruses don’t, but dismiss ribosomes as "just machines." Yet they cling to metabolism as the difference. Ah—so perhaps it’s not the *parts* but the *process*: a self-sustaining chemical engine. The synthetic bacterium has it; the self-replicating RNA doesn’t because it relies entirely on external enzymes. That’s why the mitochondrion loses—it’s a cog in the cell’s engine, not its own. Chlamydia, though dependent, still runs its *own* minimal metabolism. 

  The lichen stumps them because it’s a collaborative system. But under this principle, it qualifies: the fungus/alga partnership creates a joint metabolic whole that self-sustains. Unlike the mitochondrion (which surrendered its autonomy to the cell), both lichen partners retain interdependent metabolisms. 

  Now, the hard trade-offs. They must abandon calling mitochondria "not alive" by their old logic—but if they accept it as a sub-component of a living system, not an entity itself, that holds. Also, they can’t insist viruses are "not alive" *because* they can’t reproduce; the mule proves reproduction isn’t essential. Instead, emphasize the metabolic inertia: viruses don’t *process*; they’re inert until activated. 

  The death asymmetry? Perfectly explained: bacteria stop metabolizing when killed; viruses were never metabolizing to begin with. No phase shift. 

  For an unlisted case: fire. It "metabolizes" fuel and "reproduces" by spreading, but lacks organization or self-repair. Under this principle? Not alive. Just physics, not chemistry harnessed by information. 

  This should unstick them. The character’s form isn’t about absolute truth—it’s a bureaucratic checkbox. The tension comes from her applying a flawed, human heuristic to something alien. That’s the story gold.
answer: |-
  Here’s how I’d untangle this, based on your instincts and the friction points. The principle that best threads your needle is **operational autonomy through metabolism**. Let me walk you through it.

  "Alive" isn’t a binary property of stuff, but a label for a *specific kind of process*: a bounded system actively maintaining itself *as itself* through chemical work, using energy it harvests to fuel that maintenance and growth. The core isn’t reproduction or DNA or even cells—it’s the ongoing, self-sustaining metabolic engine. Here’s how it maps to your cases:

  *   **Bacterium:** Yes. Burns fuel, builds proteins, repairs itself, divides. Its metabolism *is* its existence.
  *   **Rock:** No. No internal engine. Passive.
  *   **Virus/Viroid/Prion/Plasmid/Transposon:** No. All functionally inert particles or code fragments. They don’t *process*; they’re processed *by* living systems. Inactivation isn’t "killing" because there was no living process to kill—just a structure being broken.
  *   **Mitochondrion:** No. It *performs* metabolic work, but it’s utterly dependent on the cell’s machinery for everything else: replication signals, lipid synthesis, waste removal. It’s a critical *component* of a living cell’s engine, not an autonomous entity. Its "division" is assembly directed by the nucleus.
  *   **Chlamydia:** Yes. It has a highly reduced genome, but crucially, it *retains the minimal machinery to direct its own metabolism and replication cycle within the host cell*. It imports host ATP but runs its own essential processes. It’s a parasite, but a metabolically active one.
  *   **Mule:** Yes. It’s a complex, bounded metabolic system maintaining itself (eating, breathing, repairing) despite sterility. Reproduction isn’t the core requirement; self-sustenance is.
  *   **Red Blood Cell:** No longer alive. It’s a discarded component, a bag of hemoglobin with no nucleus, no metabolism, no ability to maintain itself. It’s carried *by* a living system until it degrades.
  *   **Giant Virus:** Still No. However complex its genome, it lacks ribosomes *and crucially, any metabolic machinery*. It’s a giant blueprint + injection system, entirely dependent on hijacking the amoeba’s entire metabolic engine. Complexity ≠ life.
  *   **Synthetic Bacterium:** Yes. It runs the same metabolic engine as its natural counterpart. The origin of its genome is irrelevant; its *operation* is autonomous metabolism.
  *   **Self-Replicating RNA:** No. It’s a catalyst for a specific reaction (copying itself), but it doesn’t *maintain* itself. It doesn’t harvest energy, build components, or regulate its internal state. It’s chemistry happening *to* it, not an autonomous process conducted *by* it. The enzyme and building blocks are provided externally.

  **The Lichen Flip:** Your instinct to call it alive wins. Why? The fungus and alga form a new, integrated *system* with *emergent* metabolic autonomy. The fungus provides structure/minerals; the alga provides food via photosynthesis. Together, they create a bounded entity that actively grows, repairs, reproduces (via spores containing both partners), and responds to the environment *as a single persistent unit*. It’s not just a partnership; it’s a *symbiotic organism* with its own lifecycle. The mitochondrion/cell is different: the mitochondrion is a fully integrated, subservient *organelle*, not a partner maintaining its own identity within a cooperative whole. The cell is the autonomous unit.

  **The Trade-offs You Need to Make:**
  1.  **Mitochondrion:** You have to fully embrace it as non-living *on its own*. Its past as a bacterium is irrelevant to its current status as a component. Calling it "not alive" because it’s an organelle *is* correct under this principle, and the reason Chlamydia wins is its retained minimal metabolic autonomy.
  2.  **Reproduction:** You must explicitly drop "ability to reproduce" as a *necessary* condition. The mule proves it isn't essential for *being* alive. Lack of reproduction disqualifies a virus only because it highlights the lack of autonomous *activity*, not because reproduction itself defines life.

  **The Asymmetry (Life/Death vs. Inert):** This principle handles it cleanly. **Life is the active metabolic process.** When you kill a bacterium with bleach, you disrupt that specific, ongoing process irreversibly. It *was* alive, now it *is not*. The process stopped. A virus never *has* that process. It’s a structure. You inactivate it by breaking the structure, but you aren’t stopping a metabolic engine because there wasn’t one. "Dead" implies a prior state of living process; "inactive" describes a structure that’s broken but never was part of such a process.

  **A Case You Didn't Mention: Fire.** Fire consumes fuel, "grows," "reproduces" (spreads), and "excretes" waste (ash, CO2). Is it alive? No. Why? Under our principle: Fire lacks *organization* and *self-maintenance*. It doesn’t build complex structures to sustain *itself*; it’s just a rapid oxidation reaction. It doesn’t regulate its internal state or actively harvest energy in a controlled way; it just consumes what’s available until it’s gone. It’s physics unleashed, not chemistry harnessed by self-perpetuating organization.

  **What This Means for Your Character:** She's not signing a form declaring Universal Truth. She's applying a practical, operational definition based on observable *activity*: Is this bounded thing *doing* the work of staying itself? Does it have its own engine? The ambiguity lies in the grey zones (like the giant virus’s complexity or the lichen’s symbiosis), but the principle gives her a consistent framework. Her struggle can mirror yours – finding a line that holds under pressure, even if it means admitting the mitochondrion is just a part, not a citizen, of the living world. It’s inelegant in the sense that life is messy, but it holds to your core intuitions while resolving the contradictions, forcing only those two clear concessions. Now write that scene.
