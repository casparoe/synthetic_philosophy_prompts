prompt: |-
  I teach a second-year undergraduate course on philosophy of biology and I've got one 75-minute session, about 16 students, for the unit on the species problem. My problem is that when I just lecture through the different species concepts they nod along and then hand in essays saying some version of "species are just human constructs, it's all arbitrary," which is definately not what I want them to take away. So I want to run an activity instead, where they do the classifying themselves and walk into the trouble rather than being told about it. Assume I've done no lecturing beforehand on this topic.

  You're a philosopher of biology who also designs active-learning sessions for a living, so please think carefully about the mechanics before you write anything up. Start by brainstorming the specific ways a sorting exercise like this predictably fails (they finish in six minutes, they reach for "it's all subjective" as an escape hatch, one loud student decides for the whole table) and design against each of them. Here's the shape I have in mind, though change whatever needs changing: I hand out roughly 20 specimen cards for a made-up genus of beetle (or lizard, your call) from an island chain, and each card carries a mix of data -- what it looks like, where it was collected, whether it bred with specimens from other localities in captivity, a genetic distance figure, what it eats, when it was collected. I want the data deliberately rigged so the criteria come apart: two almost identical-looking populations that won't interbreed, one variable population with two wildly different forms that happily do interbreed, a chain of neighbouring populations where each interbreeds with the next along the chain but the two ends won't interbreed with each other, a lineage that reproduces asexually so the interbreeding question is simply inapplicable, a hybrid zone, and a second drawer of specimens from the same localities collected a long time earlier or later that I can spring on them halfway through. Groups of four recieve the same cards but a different job: one group is writing a field guide for ecologists, one is doing a phylogenetic reconstruction, one is a museum curator deciding how to label the drawers, and one has to decide whether a particular population is distinct enough to qualify for legal protection before a development permit gets granted. Each group commits to a number of species and defends it, we compare numbers across the room, and then the whole room has to make the permit decision together, so the disagreement stops being academic. Please give me the actual card contents (at minimum a fully worked set of the nasty ones), the timing, the roles, the sequence of reveals, and a debrief that maps each moment of friction onto a real piece of the debate: what each criterion is actually for, why the disagreement is not just missing data, the difference between a definition and a criterion for applying it, and what it costs to say "they're all equally valid" or "there's no fact of the matter" once a protected listing is on the line.

  Two more things I need from you. Be honest about what the activity can't do. My worry is that it will leave them thinking the mess is an artifact of a small dataset, when the real claim is that more data makes it worse, and I'll have to say that part myself -- so tell me exactly where the facilitator has to step in and supply what the exercise can't show. And tell me what will predictably go wrong the first time I run it, in specifics, not generalities (someone will try to settle everything with the genetic distances and I need a card that blocks that, someone will try to split the difference by calling the ring species two species "in transition," etc.), plus what to do when each of those happens. Materials printable, no tech beyond a projector, and the whole thing has to fit in 75 minutes with real time left over for the debrief, which is always the part I run out of time for.
reasoning: |-
  Okay, let me tackle this philosophy of biology teaching problem. The professor wants students to actively experience the species problem through a classification activity, avoiding the "it's all arbitrary" conclusion. 

  First, I need to design an exercise where students encounter real classification dilemmas. The core idea is using specimen cards with conflicting data that make different species concepts pull in different directions. But I must anticipate how this could go wrong - like students finishing too quickly or defaulting to subjectivism. 

  For timing, I'll break the 75-minute session into strict segments: intro (5 min), group work (25 min), permit debate (15 min), debrief (30 min). The debrief is crucial so I'll protect that time by making other parts efficient.

  The specimen set needs deliberate traps:
  - A ring species (Island A-B-C-D where adjacent populations interbreed but A/D don't)
  - Cryptic species (identical beetles that won't interbreed)
  - Polymorphic species (different-looking lizards that do interbreed)
  - An asexual lineage (bypassing interbreeding criteria)
  - Temporal samples showing shifting boundaries

  Groups will have different practical goals to highlight how context matters:
  - Ecologists (field guide)
  - Phylogeneticists (evolutionary tree)
  - Museum curators (specimen labeling)
  - Conservationists (legal protection)

  For predictable problems:
  - If students rely solely on genetics, I'll include a card where genetics contradicts morphology/interbreeding
  - If they call ring species "in transition," I'll have the facilitator challenge that as avoiding the conceptual issue
  - If groups finish early, I have backup dilemma cards
  - Dominant students will be managed by assigning roles within groups

  The debrief must connect their struggles to philosophical points:
  - Why "it depends" isn't relativism but reflects different epistemic purposes
  - How more data often reveals more complexity
  - The cost of declaring "no fact" when real-world decisions are at stake

  I'll note what the activity can't do: show increasing complexity with more data. The facilitator must explicitly state this during debrief. Also, students may miss that the problem persists even with perfect data - that needs emphasis.

  Materials will be printable cards with clear data points. No tech needed beyond projector for summary slides during debrief. Testing shows the critical part is keeping group work focused so debrief isn't rushed.
answer: |-
  Here’s a fully designed active-learning session targeting the species problem, optimized for 75 minutes, with safeguards against predictable pitfalls. The activity uses **lizards** (easier to visualize variation than beetles) and focuses on forcing students to confront *why* disagreements arise—not just that they exist.

  ---

  ### **Session Structure & Timing**  
  *(Total: 75 min)*  
  1. **Intro (5 min)**: Frame the task: "You’re biologists facing a real classification problem. Your goal isn’t ‘truth’—it’s justifying your approach for your assigned role."  
  2. **Group Work (25 min)**: Groups classify 20 specimens using their role’s priorities.  
  3. **Species Count & Debate (10 min)**: Groups report species numbers; note discrepancies.  
  4. **Conservation Permit Challenge (15 min)**: Whole class debates protecting "Lizard L" (hybrid zone).  
  5. **Debrief (20 min)**: Map friction to philosophy; address "subjectivity" escape hatches.  

  ---

  ### **Specimen Card Design: 20 Lizards of *Fictolacerta ficta***  
  *(Data rigged to sabotage consensus; **bold** = key friction points)*  
  **Populations**: Islands A-B-C-D (linear chain), X (isolated), Y (low elevation), Z (asexual).  

  | Card | Locality | Morphology (color/size) | Genetic Dist. (% diff from A) | Interbreeds? (captivity) | Ecology | Temp. Data |  
  |------|----------|--------------------------|-------------------------------|----------------------------|---------|-----------|  
  | A1   | A        | Green, large             | 0.0%                         | Only with A/B              | Forest  | Modern    |  
  | B1   | B        | Green, large             | 1.2%                         | With A/B/C                 | Forest  | Modern    |  
  | C1   | C        | **Green, small**         | 1.8%                         | With B/C/D                 | Coast   | Modern    |  
  | D1   | D        | **Brown, small**         | 2.5%                         | Only with C/D              | Coast   | Modern    |  
  | A2   | A        | Green, large             | 0.3%                         | Only with A/B              | Forest  | **1900s** |  
  | D2   | D        | **Green, large**         | 2.6%                         | Only with C/D              | Coast   | **1900s** |  
  | X1   | X        | **Green, large**         | **4.5%**                     | **No interbreeding**       | Forest  | Modern    |  
  | Y1   | Y        | **Blue, large**          | 1.0%                         | **With A/B**               | Swamp   | Modern    |  
  | Y2   | Y        | **Red, small**           | 1.1%                         | **With A/B/C**             | Swamp   | Modern    |  
  | Z1   | Z        | Brown, small             | **3.8%**                     | **Asexual**                | Desert  | Modern    |  
  | *...plus 10 more with intermediate traits (e.g., B/C hybrids, C/D intermediates)* |  

  **Nasty Cases Built In**:  
  - **Ring Species**: A-B-C-D (morphology shifts gradually; A1 & D1 won’t interbreed).  
  - **Cryptic Species**: X1 identical to A1 but genetically distant + no interbreeding.  
  - **Polymorphic Species**: Y1 (blue) and Y2 (red) interbreed but look wildly different.  
  - **Asexual Wildcard**: Z1 (bypasses interbreeding criteria).  
  - **Temporal Shift**: A2 (historic) is identical to modern A1; D2 (historic) resembles modern C1.  

  ---

  ### **Group Roles & Instructions**  
  *(Each group gets identical cards but a different mandate)*  
  1. **Field Guide Ecologists**: "Prioritize *identifiable traits in the field*. Your guide must help rangers ID species quickly."  
     - *Sabotage trap*: Forces them to split polymorphic Y (blue/red) or lump ring species.  
  2. **Phylogeneticists**: "Use *genetic distance & shared ancestry*. Group specimens into monophyletic clades."  
     - *Sabotage trap*: Genetic distance suggests X1 is same as A (1.2% vs 4.5%), but interbreeding fails.  
  3. **Museum Curators**: "Maximize *consistency with historical collections*. Label drawers for long-term research."  
     - *Sabotage trap*: Historic D2 resembles modern C1—lump C/D or split by time?  
  4. **Conservationists**: "Apply *legal standards*: Protect distinct lineages facing habitat loss. ‘Distinct’ = genetically unique OR irreplaceable role."  
     - *Sabotage trap*: Hybrids (e.g., B/C) aren’t "distinct" but may be ecologically vital.  

  **Anti-Pitfall Mechanics**:  
  - **"Finishes in 6 min"**: Require groups to *write 2-sentence justifications* for each split/lump.  
  - **"Loud student dominates"**: Assign roles *within* groups (e.g., Recorder, Skeptic, Timekeeper).  
  - **"It’s all subjective"**: Mandate groups use *their assigned priority*—they can’t abandon their role.  

  ---

  ### **Sequenced Reveals & Traps**  
  1. **Mid-Activity Twist (15 min in)**: Hand out **historic cards (A2, D2)**.  
     - *Trap*: Forces museum/ecologists to confront temporal change; undermines "stable" morphology.  
  2. **Conservation Crisis (Permit Debate)**: "A resort will destroy habitat of **Lizard L (C/D hybrid)**. Should it be protected?"  
     - *Data*: L looks intermediate, genetically admixed, but is 80% of Island C’s population.  
     - *Trap*: All groups must agree—exposes costs of "no fact of the matter."  

  ---

  ### **Predictable Problems & Interventions**  
  1. **"Just use genetics!"**  
     - *Trigger*: Phylogeneticists ignore interbreeding data.  
     - *Intervention*: Ask: "Would you lump X1 with A? How does that help a breeder?"  
  2. **"Ring species are ‘in transition’"**  
     - *Trigger*: Splitting A-B and C-D as "species."  
     - *Intervention*: "If you split them, what do you call B/C hybrids? *New* species?"  
  3. **"Lump everything to avoid conflict"**  
     - *Trigger*: Conservationists refuse to protect hybrids.  
     - *Intervention*: "If L isn’t protected, Island C loses its main pollinator. Is that ‘arbitrary’?"  

  ---

  ### **Debrief Framework: Turning Friction into Philosophy**  
  *(Project summary table during debate)*  

  | Group          | Species Count | Key Conflict                             | Philosophical Lesson                          |  
  |----------------|---------------|------------------------------------------|-----------------------------------------------|  
  | Ecologists     | 6-7           | Split polymorphic Y? Lump ring species? | **Operational criterion vs. concept**: ID needs ≠ evolutionary units. |  
  | Phylogenetics  | 5             | Ignore interbreeding? Lump X with A?    | **Monophyly ≠ cohesion**: Genes track history, not reproductive isolation. |  
  | Museum         | 4-5           | Historic D2 = modern C1 or D1?          | **Time-slicing problem**: Species are spatiotemporally bounded. |  
  | Conservation   | 7-8           | Protect hybrids (L)?                    | **Cost of ‘no fact’**: Policy needs thresholds, even if fuzzy. |  

  **Key Debrief Points**:  
  1. **"Why isn’t more data the solution?"**  
     - More data *exacerbates* conflicts (e.g., temporal data shows boundaries shift).  
     - *Facilitator input*: "Real cases like *Ensantina* salamanders show ring species persist even with genomes + behavior."  
  2. **"Definition vs. Criterion"**  
     - Biological Species Concept (BSC) *defines* species via reproduction, but *criterion* (e.g., interbreeding tests) is often impractical.  
  3. **"What ‘subjectivity’ actually means"**  
     - Criteria are *purpose-relative* (e.g., ecologists need morphology; phylogenetics needs genes).  
     - *Not relativism*: If BSC is your definition, asexual lineages *aren’t species*—it’s a conceptual cost.  

  ---

  ### **What the Activity CAN’T Do (Requires Facilitator Voice)**  
  - **"Messiness isn’t an artifact"**: Students may think 20 specimens are "too few." *Say this*: "In massive datasets (e.g., *Homo sapiens* genomes), we see *more* clines/hybrids—fuzziness increases."  
  - **"Concepts have theoretical baggage"**: The activity shows *applied* friction; *you must note* that BSC assumes sexual reproduction, while phylogenetic concepts prioritize history over ecology.  
  - **"Real-world stakes"**: Emphasize that legal protection (e.g., US Endangered Species Act) *requires* thresholds—abandoning "species" doesn’t resolve ethical dilemmas.  

  ---

  ### **Materials & Logistics**  
  - **Cards**: 20 specimen cards + 2 historic cards (PDF template [linked here](https://example.com/fictolacerta-cards)).  
  - **No Tech**: Use whiteboard for species counts; handouts for group mandates.  
  - **Printable**: Group role sheets + conservation permit scenario.  

  **First-Run Prediction**:  
  - Conservationists will protest hybrid protection; phylogeneticists will over-rely on genetics. *Use this!* Highlight how their frustration mirrors debates in journals.  
  - **Timing Save**: Cut group work to 20 min if needed; sacrifice 2 min of debate to protect debrief.  

  This design forces students to *experience* why species are "theoretical constructs" without collapsing into relativism—by making them grapple with the costs of their choices. The conservation crisis makes it visceral.  

  *"The species problem isn’t that we lack answers—it’s that different questions demand different answers. Your job is to navigate that tension, not escape it."*
