  Scholarly consensus solidly affirms that Gongsun Long distinguishes naming functions (color vs. shape) and uses the seeking test operationally. My reading of "horse" naming *only* shape (despite instantiated horses having color) is standard. The contested points: (1) Whether "white horse" is a *fusion* or a *new entity* linguistically (I lean fusion, but some argue it creates a distinct "name"); (2) Whether the argument implies abstract universals ("horseness") or is strictly linguistic. My emphasis on naming-as-direction-for-seeking is a mainstream *emphasis*, but the ontological implications are debated. The text never explicitly resolves whether "horse" as pure shape has independent existence.
