answer: |-
  *(As the Advocate, leaning forward with focused intensity)*  
  Your challenge strikes at the heart of the matter, yet you conflate two distinct actions of naming. When we say "horse," we name *shape alone*—yes, every horse you point to has color, but we do not *name* that color when we say "horse." When we say "white horse," we name *both* color and shape together. The overlap you perceive is an illusion of the thing, not the naming. A white horse *has* horseness, but "white horse" does not *name* horseness alone—it names color-bound horseness. That is why if you seek a *horse*, I may give you a black one, for you seek only the shape. But if you seek a *white horse*, you demand the color be fixed. The naming fixes what is sought. You cannot give what is not named.  
    
  As for your second thrust—that "horse" without color names nothing actual—this misunderstands naming’s function. "Horse" names the shape *as it is found in things*, not a colorless phantom. When you ask for a horse, I deliver a yellow or black horse *precisely because* "horse" names only the shape, allowing any color to satisfy. But "white horse" names color *and* shape, so only white satisfies. The test proves the names differ in what they demand of the world. If "horse" included color, why could I give a black horse when only shape is sought?  
    
  So: does "horse" include color? In the thing, yes. In the *naming*, no. The term isolates shape. Your objection confuses the compound with the simple. Grant me this: the naming directs the seeking. Then the distinction holds.  
    
