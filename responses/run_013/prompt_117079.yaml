  For the seeking test objection, I should emphasize that we deliver colored horses precisely because shape always appears with color - but what we're responding to is the shape-naming function when asked for "horse." The user's "no actual horse" point actually helps my case - it shows "horse" is an abstraction we apply to concrete colored things.

