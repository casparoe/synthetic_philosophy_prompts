answer: |-
  Here is a reconstruction of the implicit theory of moral standing underlying the taxonomic coverage rule, addressing each query point while strictly adhering to your epistemic requirements. I distinguish between *settled features of the practice*, *contested philosophical interpretations*, and *my own arguments*.

  ### 1. Reconstructing the Implicit Theory
  - **Settled Practice**: Protection is taxon-specific and binary (in/out), based on legislative lists informed by scientific review (e.g., UK’s 2022 Act). Vertebrates are included by default; invertebrates require affirmative evidence.
  - **Implicit Theory**: The practice encodes a **Threshold View of Moral Standing**. Sentience (or the capacity for valenced experience) is treated as a *categorical property* that a being either possesses or lacks. Protection tracks the *ascribed property itself*, not our epistemic uncertainty about it.
  - **Why Not Pragmatism?** While administrative costs matter, the *pattern* of extending protection to cephalopods/decapods after evidence reviews shows the threshold is evidence-responsive. Pragmatism alone cannot explain why *these* invertebrates were added despite implementation challenges (e.g., monitoring octopus welfare in fisheries).
  - **My Argument**: The threshold view best explains why negligible welfare weight is assigned to taxa below the line (e.g., insects) regardless of numbers. If cost or identifiability were primary, we would see partial protections or sliding scales—neither exists.

  ### 2. Rival Theories: Ruled Out vs. Compatible
  - **Ruled Out**:  
    - **Pure Expected Value (EV) Theories**: The practice *rules out* views requiring aggregation of welfare weight across individuals based on credence (e.g., \( \text{Total Weight} = \sum (\text{credence}_i \times \text{number}_i) \)). If EV applied, insect protections would be non-negligible given their numbers—yet they receive zero weight.  
  - **Compatible (Practice Fits but Doesn’t Require)**:  
    - **Cartesian/Neo-Cartesian Denial**: Insects could be excluded because they are deemed non-conscious. *But* this is not necessary; the practice only requires that they fall *below the evidentiary threshold*.  
    - **Selfhood/Future-Stake Views**: Compatible if cephalopods/decapods are seen as meeting criteria like "future-oriented desires" while insects do not.  
    - **Pragmatism**: High costs of regulating insects fit the pattern but are insufficient alone (per §1).  
  - **Contested**: Whether the threshold is fundamentally about *biological integration* (e.g., centralized cognition) or *moral ontology* (e.g., "being a subject of a life") is unresolved in the practice.

  ### 3. The Checklist: Commitment vs. Ambiguity
  - **Settled Practice**: The checklist (nociceptors, central integration, etc.) is treated as a set of **necessary conditions**. Taxa are excluded if *any* key marker is absent or ambiguous (e.g., insects lack robust evidence for *centralized* nociceptive integration).
  - **Implicit Commitment**: The checklist conceals a **substantive hierarchy**:  
    1. **Central Integration** is non-negotiable (explains exclusion of insects despite peripheral nociception).  
    2. **Functional Analogues** (e.g., motivational trade-offs) must map onto vertebrate-like cognition.  
  - **My Argument**: This hierarchy reflects a *conservative epistemic standard*: absence of proof is treated as proof of absence. Insects are not deemed "partly sentient"; ambiguous markers (e.g., bee learning) are discounted unless they meet the vertebrate benchmark.

  ### 4. The Scale Argument: Where It Breaks
  - **Settled Practice**: The coverage rule **denies the core premise of EV aggregation** for uncertain sentience.  
  - **Breaking Points** (Contested Philosophically):  
    - **Type of Uncertainty**: The practice treats uncertainty about *what a being is* (ontological) differently from uncertainty about *events* (empirical). For moral standing, "unknown" defaults to "non-sentient."  
    - **Non-Aggregation**: Moral weight is not seen as linearly scalable with numbers *below the threshold*. A trillion insects at 0.01% credence receive no weight, while one octopus at 99% credence receives full weight.  
  - **My Argument**: The rule assumes **moral standing is binary and intrinsic**, not probabilistic or additive. This denies:  
    > *Premise*: If welfare capacity has non-zero credence, it generates moral claims proportional to \( \text{credence} \times \text{scale} \).  
    This denial is defensible if moral status requires *categorical respect* (e.g., Kantian "ends-in-themselves"), but ad hoc if grounded solely in welfare consequences.

  ### 5. What Would Change Under Expected Value
  - **Concrete Regime Shifts**:  
    - **Rearing/Killing Standards**: Maceration/freezing insects might require justification (e.g., "least aversive method"). Scale-adjusted rules could emerge (e.g., "per 10,000 insects").  
    - **Oversight Thresholds**: Research reviews triggered by estimated insect numbers (e.g., >1 million kills needs approval).  
    - **Monitoring**: Population-level welfare metrics (e.g., colony stress in crickets) instead of individual tracking.  
  - **Administrative Feasibility**:  
    - **Collapse Risk**: Counting individuals is impossible, but proxies exist (e.g., biomass, colony units). Pollinator policies already use such proxies (§6).  
    - **My Argument**: Implementation is *theoretically possible* but conflicts with legal individualism (e.g., protocols for mice). The real barrier is *conceptual*, not practical.

  ### 6. The Asymmetry (Means vs. Ends)
  - **Settled Practice**: Insects are counted as *resources* (e.g., pollinators) or *risks* (e.g., pest control) but not as *patients*.  
  - **Consistency with Threshold View**: **This asymmetry is predicted**. Threshold views distinguish:  
    - *Moral Patients*: Beings owed direct concern (require sentience).  
    - *Instrumental Value*: Beings affecting other interests (aggregation applies).  
  - **Contested Interpretation**: Critics argue this reveals *speciesism* or incoherence. Defenders see it as principled: only sentient beings have welfare *interests*.  
  - **My View**: The asymmetry is *overdetermined*. It fits the threshold theory but could also reflect anthropocentric bias. The practice alone cannot resolve this.

  ---

  ### Epistemic Summary
  | **Aspect**               | **Settled in Practice**                                  | **Contested/Interpretive**                                                                 | **My Argument**                                                                 |
  |---------------------------|----------------------------------------------------------|-------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------|
  | **Theory of Standing**    | Binary, taxon-based threshold.                           | Whether threshold is biological (e.g., neurophysiology) or moral (e.g., personhood).      | Threshold view is implicit; pragmatism is insufficient to explain extensions.   |
  | **EV Reasoning**          | Rejected for coverage decisions.                         | Whether EV *should* apply to moral standing.                                              | Practice denies scalability of credence × numbers; defensible if status is binary. |
  | **Checklist**             | Used as necessary conditions.                            | Whether ambiguous markers (e.g., in bees) imply partial standing.                         | Checklist reflects a conservative "central integration" standard.               |
  | **Asymmetry**             | Insects counted instrumentally, not as patients.         | Whether asymmetry reveals bias or a principled distinction.                               | Fits threshold view but doesn't rule out anthropocentrism.                      |
  | **Insect Sentience**      | Not recognized in law.                                   | Scientifically and philosophically disputed (e.g., Birch on bees).                        | *No position taken*; practice hinges on evidence thresholds, not truth.         |

  **Key Philosophical Contestation**: The deepest divide is between **binary intrinsicist** views (moral standing is all-or-nothing) and **scalar consequentialist** views (welfare weight is aggregable and probabilistic). The coverage rule presupposes the former but does not *entail* its truth—only that it is operationalized in law. Replacing it with an EV approach would require a revolution in administrative logic, not just finer evidence.
