answer: |-
  You're right to feel stuck: your friend's argument is logically tight but morally paralyzing—and step 4 is where the real damage happens. It smuggles in **moral determinism**: the idea that individuals are *utterly incapable* of moral insight beyond their culture's current consensus. History proves this false. Here's how to dismantle the argument while preserving your core intuition that blame requires epistemic access:

  ### The Critical Flaw: Step 4 (and its consequence in Step 5)
  - **Step 4 claims**: "Nobody can be expected to see past the moral vocabulary their whole society has on hand... concepts are collective achievements."
  - **The problem**: This denies the possibility of **moral outliers**, **cross-cultural exposure**, or **immanent critique**. Moral concepts *aren't always* collective achievements *before* individuals articulate them—someone has to start the critique. Examples:
    - **Bartolomé de las Casas** condemned Spanish brutality in the 1540s—*while it was happening*—using Thomist theology (existing concepts!) to argue for Indigenous humanity.
    - **Jefferson himself** wrote passages condemning slavery as a moral evil ("I tremble for my country..."), yet chose to perpetuate it. His society hadn't *resolved* the issue, but the critique *existed* and *he knew it*.
    - **Abolitionist movements** in the 18th century emerged *within* slaveholding societies. Critics used existing principles (e.g., Christian charity, Enlightenment liberty) to challenge practices their peers accepted.

  Step 4 wrongly assumes societies are morally monolithic. In reality, **moral disagreement is constant**, and alternative viewpoints are often accessible if one cares to look—or feel.

  ### Step 5's Overreach: "Couldn't have known better"
  - Step 5 concludes that if society hadn't "articulated the wrongness," the individual *couldn't* have known. This ignores:
    - **Empirical knowledge**: Columbus saw Indigenous people die en masse. You don't need a theory of human rights to recognize suffering or question actions causing it.
    - **Internal moral resources**: Jefferson agonized over slavery. His failure wasn't ignorance—it was prioritizing personal/political interests over moral consistency.
    - **Available alternatives**: Many of Jefferson's contemporaries freed their slaves (e.g., Washington in his will). The option existed; he rejected it.

  ---

  ### Your Escape Path: Revise "Could Have Known Better"
  You can keep (1)-(3) and your core principle—**blame requires the agent had a *reasonable opportunity* to access moral knowledge**—by rejecting step 4's determinism and step 5's passivity. Replace them with:

  - **Revised Step 4**: Moral insight often arises from tension between *existing principles* and *lived experience*. Individuals can recognize suffering, hypocrisy, or inconsistency using tools already available (religion, philosophy, empathy)—even if society ignores them.
    
  - **Revised Step 5**: An individual "could have known better" if either:
    - (a) **Critique existed within their reach** (e.g., abolitionist writings, dissenting voices, alternative practices), *or*
    - (b) **The wrongness was inferable from basic empathy/observation** (e.g., seeing people tortured *should* trigger moral alarm without a PhD in ethics).

  ---

  ### Applying the Fix: Jefferson & Columbus
  - **Jefferson**: 
    - **Knew better**: He read critiques of slavery (e.g., Enlightenment philosophers), called it a "moral depravity," yet enslaved 600+ people. 
    - **Blameworthy? Yes**—he had access to the critique and *chose* complicity for personal gain. No pass.
    
  - **Columbus**:
    - **Knew better?** His journals show awareness of Indigenous suffering. Spanish clergy condemned his brutality *during his rule*. Basic empathy (*seeing* mass death) should have sufficed.
    - **Blameworthy? Yes**—he ignored observable suffering and internal/external critiques to pursue profit.

  - **Your friend's "future pass" (Step 7)**:
    - *Fails*: We *do* have critiques of current injustices (e.g., climate ethics, AI risks, animal rights). Ignoring accessible criticism *now* won't absolve us later.

  ---

  ### What You Keep and What You Gain
  - **You keep**: 
    - Ought implies can (steps 1-3).
    - Blame requires epistemic access ("real shot at knowing better").
    - Social context matters—it sets the *baseline*, not the ceiling.
    
  - **You gain**:
    - A **nuanced view of history**: Figures can be products of their time *and* culpable for choices within their constraints.
    - **Accountability without presentism**: We judge past actors by what *they* could perceive, not by 2024 standards—but we insist they confront the moral resources *available to them*.
    - **A moral call to action**: If our descendants ask, "How could they ignore X?", we ensure the answer isn't "No one spoke up," but "They chose not to listen."

  This approach avoids automatic passes while acknowledging genuine limitations. Some historical figures *did* lack meaningful access to alternatives—but Jefferson and Columbus aren't among them. Your intuition is sound: moral responsibility lives in the gap between what was possible and what was chosen. Don't let logic bully you into absolving the inexcusable.
