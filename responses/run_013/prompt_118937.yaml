answer: |-
  ## Friendship and Beauty Audit Form (FBA-7)
  **Issuing Authority:** Department of Intrinsic Value, Civic Values Compliance Bureau  
  **Purpose:** To assess and quantify the Intrinsic Value (IV) of claimed instances of Friendship (F) and/or Aesthetic Enjoyment (AE) for civic recognition, tax relief consideration (Schedule IV-D), or dispute resolution (See Section 5).  
  **Instructions:** Complete Sections 1-3 in full. Attach supplementary Method-of-Isolation Worksheet (Section 4) for claims exceeding 50 IV Points. Submit in triplicate to the IV Assessment Window, Room 307, Town Hall. Allow 6-8 weeks for processing. False declarations regarding the *sui generis* nature of value may result in re-education (Module IVQ-7: "The Naturalistic Fallacy & You").

  ### Section 1: Claimant & Subject Identification
  1.  **Claimant Name:** __________________________ **IV Citizen ID:** ___________
  2.  **Nature of Claim:** (Check one)
      *   [ ] Friendship (F) - Organic Unity Type: Platonic [ ] Romantic [ ] Familial [ ] Other (Specify: _________)  
          *Subject(s) of Friendship:* __________________________ Relationship: __________
      *   [ ] Aesthetic Enjoyment (AE)  
          *Object/Experience Enjoyed:* __________________________ (e.g., Sunset over Lake Serenity, Mrs. Gable's Ceramic Badger Collection, Bach's Cello Suite No. 3)
      *   [ ] Combined Organic Unity (F+AE) (e.g., Enjoying art *with* a friend) - *Complete Sections 2 AND 3, plus Worksheet 4B*
  3.  **Date(s) of Value Manifestation:** Start: ____/____/____ End: ____/____/____ (Ongoing? [ ] Yes [ ] No)

  ### Section 2: Friendship (F) Assessment
  *(Assess ONLY the friendship's intrinsic goodness. Refer to Worksheet 4A for isolation protocol.)*
  4.  **Constituent Elements:** Describe the *specific state of consciousness* constituting the friendship's core affection (e.g., "Feeling of warm regard during Tuesday chess", "Shared silence contemplating elms"). Avoid instrumental descriptors (e.g., "He fixes my car").  
      *   Description: _________________________________________________________________________________________
  5.  **Organic Unity Integrity:**
      a. Does the affection possess a character demonstrably different from the mere sum of pleasant experiences with the subject? [ ] Yes (Proceed) [ ] No (Claim likely invalid; see Footnote 1)
      b. Does the affection persist when contemplating the subject *in abstracto*, devoid of any anticipated future benefit? [ ] Yes (Score +5) [ ] Partially (Score +2) [ ] No (Score -10; possible confusion with utility)
      c. Are any "bad" elements (e.g., mild irritation, differing political views) present? [ ] Yes [ ] No
      d. If "Yes" to 5c: Does the affection nevertheless transform these elements into a *greater* whole whose value exceeds the sum of its parts? (Provide brief rationale): _____________________________________________________  
          [ ] Clearly Yes (Score +8) [ ] Arguably Yes (Score +3) [ ] Unclear/No (Score -7; risk of value negation)
  6.  **F-Score Subtotal (Box A):** _______

  ### Section 3: Aesthetic Enjoyment (AE) Assessment
  *(Assess ONLY the intrinsic value of the aesthetic state of mind evoked by the object/experience.)*
  7.  **Object/Experience Description:** Be objective. (e.g., "Oil on canvas, 24x36", depicting bowl of slightly bruised peaches", "Auditory sequence: Bb, F, Eb, G, duration 3.2 sec").
      *   Description: _________________________________________________________________________________________
  8.  **AE Manifestation:**
      a. Was the object/experience *actually* apprehended (seen, heard, etc.) by the claimant during the claim period? [ ] Yes (Proceed) [ ] No (Go to 8b)
      b. If "No" to 8a: Does the object possess beauty *in potentia* independent of any observer? (Philosophical justification required; consult Auditor). [ ] Yes (Provisional +5, Requires Level 3 Review) [ ] No (Score 0; value unrealized)
      c. Describe the *specific state of consciousness* constituting the aesthetic enjoyment (e.g., "Pleasure in the particular shade of blue", "Feeling of harmony induced by rhythmic pattern"). Avoid "I liked it" or "It was satisfying".  
          *Description:* _________________________________________________________________________________________
  9.  **AE Purity:**
      a. Was enjoyment demonstrably directed at the object's *intrinsic aesthetic qualities* (form, color, composition, etc.), not associated ideas (e.g., cost, rarity, sentimental attachment)? [ ] Yes (Score +5) [ ] Partially (Score +2) [ ] No (Score -10; possible conflation)
      b. Could the described state of consciousness be reproduced by contemplating the object's description in 7 alone, isolated from context? [ ] Yes (Score +7) [ ] Uncertain (Score 0) [ ] No (Score -5; context-dependency suspected)
  10. **AE-Score Subtotal (Box B):** _______

  ### Section 4: Method-of-Isolation Worksheet (REQUIRED for claims >50 IV Points)
  **4A: Friendship (F) Isolation:** Describe the *exact* mental act of apprehending the friendship's intrinsic value. How did you isolate it from:
      *   All future benefits/consequences (e.g., emotional support, shared chores)?
      *   All past shared experiences or obligations?
      *   Any pleasure derived from the subject's other qualities (e.g., wit, intelligence) *considered separately*?  
          *Description:* _________________________________________________________________________________________
  **4B: Combined Unity (F+AE) Assessment:** *(Only if Section 1.3 checked)*
      a. Does the combined experience (e.g., enjoying art *with* a friend) possess a demonstrably *different and higher* intrinsic value than the sum of the F-Score (Box A) and AE-Score (Box B) considered separately? [ ] Yes (Proceed) [ ] No (Combined IV = A+B)
      b. If "Yes" to 4Ba: Quantify the *surplus value* attributable solely to the organic unity of F and AE (e.g., "The shared silence amplified the blue's intensity, adding approx. 12 IV"). Justification: _________________________________________________________
      *   **Surplus Value (Box C):** _______

  ### Section 5: Total IV Calculation & Appeals
  11. **Total Intrinsic Value (TIV):**  
      *   F-Only Claim: TIV = Box A _______
      *   AE-Only Claim: TIV = Box B _______
      *   Combined F+AE Claim: TIV = (Box A + Box B) + Box C = _______  
          *(Note: Box C may be negative, indicating value negation.)*
  12. **Claimant Certification:** I affirm this claim pertains *only* to non-natural, intrinsic properties, isolated via conscious apprehension, and is not founded upon satisfaction of desire, pleasure quanta, or utility.  
      *Signature:* __________________________ *Date:* ____/____/____
  13. **Auditor Use Only:**
      *   TIV Verified: _______ Auditor ID: __________
      *   Assessment Notes: _________________________________________________________
      *   [ ] Approved [ ] Denied [ ] Requires Level 2 Review [ ] Referred to Committee on Organic Wholes (COW)
  14. **Appeals Procedure:** Disputes regarding TIV calculation must be submitted on Form IV-A1 within 14 days. Grounds for appeal are limited to:
      *   Procedural error in applying the scoring rubric (Sections 2, 3).
      *   Misapplication of the Method-of-Isolation (Section 4).
      *   Auditor's failure to apprehend the *precise* organic unity claimed.
      *   **Note:** Appeals based on perceived utility, satisfaction, or disagreement with the *concept* of non-natural intrinsic value (e.g., "But it made me *so happy*!") are inadmissible and may trigger mandatory Moorean Ethics Seminar (MES-101).

  ---

  **Footnotes (For Auditor Clarification Only):**
  1.  **Utility Trap:** Claims emphasizing companionship, support, or shared activities *without* isolating the unique affection state strongly suggest conflation with instrumental value. Deduct accordingly.
  2.  **The Unapprehended Object:** AE claims for unperceived objects (8b) are inherently problematic. +5 is a provisional acknowledgement of Moorean *potential* beauty, but requires Senior Auditor verification of the object's *objectively* beautiful properties *in theory*. High risk of denial.
  3.  **Bad in the Whole:** Friendship claims involving "bad" elements (5c/d) are critical. The *transformation* via organic unity must be evident. If the "bad" element actively diminishes the whole *as apprehended*, significant deduction or denial is likely ("poisoned unity").
  4.  **The Summing Dilemma (Combined Claims):** The Combined Unity surplus (Box C) is the crux. Auditors must use trained apprehension – does the whole *feel* greater? Quantification is inherently approximate; rely on precedent and committee guidance (COW Ruling 78b: "Picnics with Minor Discord").
  5.  **The Satisfaction Claimant:** Instances where the claimant defines value solely by pleasure or desire-satisfaction (e.g., "We just have FUN!") indicate fundamental misunderstanding. Denial + MES-101 referral is standard. The *state of mind* itself, not its hedonic tone, is paramount.
