answer: |-
  ### The Case: Digital Planning Portal Transition  
  A county council replaced its paper-based planning application system with a mandatory digital portal 12 months ago, intending to streamline submissions. The reform has been fully operational, revealing significant issues: residents without reliable internet (particularly elderly or rural applicants) struggle to access the service; glitches cause data loss requiring duplicate submissions; and processing times have *increased* by 30% due to staff retraining and IT troubleshooting. A cost–benefit analysis (factoring in delays, IT maintenance costs, and disproportionate impact on vulnerable groups) shows a net negative compared to the prior paper system. Nevertheless, the council has documented precise failure modes, user feedback, and workarounds (e.g., library access schemes), turning initial conjecture into observed reality.  

  ### The Check  
  - **Fence argument verdict**: Favours *keeping* the digital portal.  
    - *Premise*: The reform’s consequences are now observed (e.g., data loss patterns, resource drains), whereas reverting to paper would reintroduce uncertainty (e.g., forgotten inefficiencies, changed context).  
  - **Cost–benefit verdict**: Favours *restoring* the paper system.  
    - *Premise*: Quantifiable costs (time, money, equity) outweigh the portal’s unfulfilled benefits.  

  **Pivotal feature**: The reform’s observed *failure documentation*. This provides actionable knowledge absent pre-reform.  
  **If removed**: Without documented evidence of failures, the fence argument would align with cost–benefit, opposing the untested reform. Both would favour restoration.  

  **Conservative content**: The case shows the fence argument is *not* empty. Its core is epistemic: burden of proof shifts once an arrangement generates institutional experience, even if flawed. This is distinct from blind traditionalism.  

  ### Burkean Reply and Survival  
  **Strongest Burkean reply**: Prescription requires time to sediment tacit knowledge into "unbought grace of life." Self-conscious reforms lack the *telos* of inherited practice, which encodes collective wisdom impervious to snap evaluation. The portal, however documented, remains artificial—disrupting organic social cohesion.  

  **Does the case survive? Yes.**  
  - The reply elevates cultural authority over observed functionality, but the fence argument here concerns *risk assessment*, not tradition’s moral weight. The documented failures are concrete knowledge justifying caution against *further* disruption (reversion). A Burkean could still reject reform *legitimacy* without nullifying the epistemic premise.  

  ---  
  **Key distinctions**:  
  1. **Fence argument** → Burdens *change* with uncertainty; here, reversion is the "change."  
  2. **Cost–benefit** → Ignores institutional learning costs.  
  3. **Not justice-based** → Equity impacts are measurable costs, not inherent rights violations.
