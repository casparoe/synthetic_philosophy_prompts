  Let me unpack the pedagogical challenges first. The students are upper-level undergrads, so we need rigor without jargon overload. The case is intentionally sterile (no QWERTY!) to prevent canned responses. The professor's frustration with superficial "increasing returns" answers suggests I should design traps for common misconceptions in the model answer.

  For the essay question itself, I'm considering a two-part structure: Part A focused on lock-in criteria applied to the case, Part B on theoretical distinctions. The ergodic contrast should appear in both the question and model answer as an analytical lens, not just a term drop. 

  The marking scheme needs precision - five clear must-hits with typical failure modes. For example: "Candidate confuses sunk costs with genuine irreversibility" or "Fails to see that convergence claims require counterfactual testing." First-class answers should demonstrate meta-awareness about path dependence as a process ontology.

  On the model answer's central claim: I'm confident non-ergodicity captures lock-in's core (divergent paths matter), but uneasy about treating all non-ergodic processes as lock-in. The model answer should acknowledge that lock-in requires both non-ergodicity AND inefficiency - that's the nuance students might miss.

  Notable traps to build in:
  - The "efficient selection" red herring: the rival region's contentment doesn't prove the first region's choice was inefficient
  - The "coordination failure" lure: sunk costs make re-coordination impractical here
  - The falsifiability paradox: lock-in claims can be falsified by showing ergodic convergence was possible

  For the closing note: My least certain point is whether ergodicity fully explains why some locked-in systems remain stable while others eventually tip. The model answer might overstate the case by not addressing exogenous shocks sufficiently.
answer: |-
  Below is a comprehensive exam question, model answer, marking scheme, and requested reflections tailored to your specifications.

  ---

  **Essay Question**  
  *Based on the case below, address the following:*  
  > **Case Outline**: Region A adopted Technical Standard X early, influenced by local conditions (e.g., terrain, material costs), when neither X nor rival Standard Y was objectively superior. Over decades, X attracted complementary investments (trained labor, tooling, regulations), while Y survived only in isolated enclaves. Engineers now argue Region A would be better off with Y. Neighboring Region B, facing similar conditions but starting later, adopted Y and thrives.  

  1. **Lock-in Criteria**: What conditions must hold for Region A’s outcome to constitute *genuine lock-in* rather than efficient selection of a locally advantageous standard?  
  2. **Distinguish Look-Alikes**: Explain how this case differs from:  
     (a) Mere sensitivity to initial conditions;  
     (b) A correctable coordination failure;  
     (c) An outcome inevitable under selection pressure.  
  3. **Falsifiability & Non-Ergodicity**:  
     (i) Is the claim "Region A is locked into an inefficient standard" falsifiable? Would unfalsifiability render it vacuous?  
     (ii) Is lock-in best understood as *non-ergodicity*? Or does equating them obscure key aspects?  

  *(In your response, engage the distinction between ergodic and non-ergodic processes: an ergodic process converges to the same outcome regardless of initial path; a non-ergodic process’s outcome depends irreversibly on its specific history.)*  

  ---

  **Model Answer (700 words)**  

  **1. Conditions for Genuine Lock-in**  
  Genuine lock-in requires three conditions:  
  - **Inefficiency**: The locked-in standard (X) must be *objectively suboptimal* for Region A *today* compared to the alternative (Y), despite initial equivalence. Engineers’ hindsight criticism and Region B’s success with Y under similar conditions suggest this.  
  - **Irreversibility**: Switching costs (retraining, retooling, regulatory overhaul) must exceed the benefits of adopting Y. Complementary investments in X (e.g., specialized labor) create sunk costs that deter change.  
  - **Path-Driven Causality**: X’s dominance must stem from *historical contingency* (e.g., minor early advantages amplified by feedback) rather than inherent superiority. The initial choice was arbitrary (driven by transient local factors), yet became entrenched.  

  Without these, Region A’s outcome might reflect efficient adaptation (e.g., X better suited its *original* terrain). Lock-in demands proof that X persists *despite* current inefficiency.  

  **2. Distinguishing Look-Alikes**  
  **(a) Sensitivity vs. Path Dependence**: Sensitivity to initial conditions (e.g., chaos theory) allows divergent *short-term* paths but convergent *long-term* outcomes (e.g., weather systems). Here, divergence persists: Regions A and B remain partitioned decades later due to self-reinforcing mechanisms (e.g., network effects). Path dependence implies structural irreversibility; sensitivity does not.  
  **(b) Correctable Coordination Failure**: A coordination failure (e.g., everyone preferring Y but stuck with X due to miscommunication) could be resolved by collective agreement. Here, *sunk costs* (e.g., non-transferable skills) make re-coordination prohibitively expensive, even if all agree Y is superior. The barrier is material path inheritance, not mere communication.  
  **(c) Inevitable Convergence**: If selection pressure guaranteed X’s dominance (e.g., X was inherently superior), Region B’s successful adoption of Y falsifies this. Convergence theories assume ergodicity—outcomes averaging across possible paths. Region B’s distinct path shows outcomes are path-contingent: no "averaging" occurs.  

  **3. Falsifiability and Non-Ergodicity**  
  **(i) Falsifiability**: The lock-in claim *is* falsifiable. Counterevidence includes:  
  - Evidence that X was *always* optimal for Region A (e.g., new data showing terrain uniquely favored X).  
  - Proof that switching costs are low (e.g., modular tooling allows cheap transition to Y).  
  - Demonstration that Region B’s conditions meaningfully differ (undermining the comparison).  
  Unfalsifiability would render lock-in vacuous, reducing it to unfalsifiable historicism (e.g., "history caused this, so it’s locked-in"). The case’s empirical anchors (e.g., engineers’ critiques, Region B) provide testable premises.  
  **(ii) Non-Ergodicity as Core to Lock-in**: Lock-in is *fundamentally* non-ergodic. Ergodicity assumes path-independent convergence: all possible histories yield identical long-run averages (e.g., gas molecules in a box). Here, Regions A and B—identical in initial conditions—reach divergent equilibria due to early random events (e.g., minor cost differences). Time-averages (Region A’s development path) and ensemble-averages (outcomes across possible paths) *diverge irreversibly*.  

  **However**, equating lock-in *solely* with non-ergodicity obscures two nuances:  
  - **Normative Dimension**: Non-ergodicity is descriptive; lock-in carries evaluative weight (i.e., *inefficient* persistence). A non-ergodic outcome (e.g., Region B thriving with Y) need not be inefficient.  
  - **Mechanism Specificity**: Non-ergodicity covers any path-divergent process (e.g., quantum events). Lock-in specifically requires *self-reinforcement* (e.g., increasing returns) creating inertia. A one-off historical accident without feedback (e.g., a temporary export ban) might cause non-ergodic divergence but not lock-in.  

  Thus, lock-in is a *subset* of non-ergodic processes: one where early accidents trigger feedback loops that cement suboptimal outcomes.  

  ---

  **Marking Scheme (25 points)**  
  **Must-hit points** (5 points each; deduct 1–2 for partial hits):  
  1. **Defines lock-in criteria** (Inefficiency, Irreversibility, Path-Driven Causality).  
     *Common miss: Asserts inefficiency proves lock-in without showing irreversibility.*  
  2. **Distinguishes all three look-alikes**: (a) Path-dependence ≠ sensitivity (persistence matters); (b) ≠ coordination failure (sunk costs vs. communication); (c) ≠ convergence (Region B falsifies inevitability).  
     *Common miss: Treats (b) as identical by ignoring material switching costs.*  
  3. **Assesses falsifiability**: Identifies counterevidence (e.g., low switching costs) and concedes unfalsifiability = vacuity.  
     *Common miss: Claims lock-in is unfalsifiable "by nature" without engaging case evidence.*  
  4. **Uses ergodicity correctly**: Defines non-ergodicity as path-dependent divergence; applies it to case (A/B paths ≠ ensemble average).  
     *Common miss: Mentions ergodicity but fails to link to path divergence in case.*  
  5. **Critiques ergodicity-lock-in equation**: Notes normative/missing mechanism gaps.  
     *Common miss: Equates them simplistically or rejects any link.*  

  **First-class discriminator**: Answers that either (a) use non-ergodicity to *explain why* convergence claims fail, or (b) tie lock-in’s normative dimension to engineers’ critique as a social (not just technical) inefficiency.  

  ---

  **Closing Note**  
  **Confidence in Central Claim**: I am highly confident (>90%) that lock-in is best framed as a *subset* of non-ergodic processes. The core argument—that lock-in requires irreversible path divergence via feedback—aligns with Liebowitz & Margolis (1995) on sunk costs and Arthur (1989) on increasing returns. Non-ergodicity cleanly captures the divergence of time-averages and ensemble-averages evident in the case.  

  **Least Sure Point**: The claim that lock-in’s *normative dimension* (inefficiency) is obscured by non-ergodicity. While technically sound, it risks underemphasizing that inefficiency in path dependence is often *counterfactual-dependent* (e.g., "better off with Y"). Strong answers might reinterpret "inefficiency" as non-ergodic divergence from optimal ensembles—but this requires nuance beyond undergrad scope. Proceed with this framing, but flag it in lectures.  

  This structure pushes students beyond anecdotes while rewarding mastery of mechanics and meta-theory. Adjust terminology if "ensemble-average" is overly technical—"possible-worlds average" suffices.
