prompt: |-
  I'm definately not a philosopher — did a minor in it like fifteen years ago and that's it — so bear with me, but I want actual numbers here, not vibes. You: an epistemologist who knows the Moore-and-the-skeptic literature inside out (Moore, the Wittgenstein stuff about hinges, the modern work on entitlement and on whether warrant can be passed along). But the point isn't to show off the literature, it's to assign probabilities, so take a beat first and brainstorm the different things Moore could be read as doing, because I'm now pretty sure half my fight with my friend is that we mean different things by "proof" and don't notice.

  What we're arguing about: Moore's famous "proof" of an external world. You know it — he holds up one hand, says here's a hand, holds up the other, says here's another, concludes that at least two external objects exist, and so an external world exists; and he insists this is a perfectly rigorous proof, because the premises are different from the conclusion, he knows the premises, and the conclusion follows. He also cheerfully admits he can't prove the premises. My friend says that's it, that's a refutation of the skeptic, the skeptic either accepts it or is talking nonsense. That seems too quick to me but I can't say exactly where the trick is.

  So here's the question, and I know "successful" is doing all the work in it, which is part of what I want you to untangle. What's your credence that Moore's proof is a successful proof of the existence of an external world? To give it a truth value, let me operationalize: your credence that a rational, philosophically competent person who genuinely suspends judgment on whether an external world exists should, after engaging carefully with Moore's proof, come out with substantially higher credence that it does. Give me that number. Then also give me your number for the weaker claim that the proof is valid and has premises Moore knows (i.e., it's a proof in Moore's own stipulated sense), because I suspect those two numbers are miles apart and the gap is the interesting part.

  Decompose it for me. Here's a decomposition I sketched — fix it, drop what doesn't belong, add what I'm missing, and put a number plus one line of justification on each term:

  1. That "I have a hand right now" is something Moore knows, in whatever sense of "knows" survives the skeptic's challenge — as opposed to something he's merely entitled to take for granted, or can't be said to know at all (I've heard the Wittgenstein line that this kind of thing isn't known, it's a hinge the whole game turns on, and I don't know what that costs Moore).
  2. That the inference "here are two hands, therefore two external objects exist, therefore an external world exists" is actually valid — my worry is an idealist could grant the hands and deny that "external object" is the right description.
  3. That the argument begs the question in a way that matters. Everyone says it does, but I want to know whether begging the question against someone who doubts your premises is even a defect when the premises are precisely what's in dispute, or whether that's just what any argument does.
  4. That a "proof" has to be something that could rationally move someone who doesn't already share your premises. This is the real hinge I think (ha). If "proof" only means "valid argument from known premises," Moore wins trivially; if it means "an argument that transmits warrant," he may win nothing.
  5. Whether the skeptic's demand for a proof of the premises is even legitimate, or whether that demand is itself the thing to reject.

  Then combine them into your final number — I know they're not independent, so tell me where the dependence bites and how you're handling it. Tell me which single term your number is most sensitive to, and what you'd have to be shown to move that term a lot. And last thing: if you had to bet on which of us is closer to right, me or my friend, and on which sub-question our disagreement actually lives, say so. Please don't just hand me a reading list, I'm offline and can't check anything anyway.
