prompt: |-
  I run a 90-minute graduate seminar on idealized models of reasoning, with about 18 students, and I want an activity that makes them feel why something like a human computation hierarchy, or factored cognition, is a natural idealization of deliberation, and where that idealization quietly cheats. The point must land through the mechanics rather than a lecture: they should run into the decomposition and its failure mode before either is named, and only get the vocabulary in the debrief.

  The core is a deliberation tree. Divide the room into a hierarchy: a single root node, two or three levels beneath it, and eight to twelve leaves. Each participant is one node. The only permitted channels are between a node and its immediate parent and children; nobody sees the whole tree, siblings never talk, and the root never addresses a leaf directly. Messages are capped, say ten words each and at most three exchanges per edge, and answers must be short: yes, no, a number, or a single phrase. The task should be a decision with one correct verdict that requires several independent lines of reasoning to converge — a verdict about what to do or believe that needs, for instance, an alibi check, a motive check, and a physical-evidence check, each itself two or three inferential steps. Prepare the material so each leaf holds one fact or one inference rule, internal nodes combine their children's answers, and no single sheet contains a chain long enough to yield the verdict alone. The root announces the verdict after a fixed twenty-five minutes.

  Then run the twist. In a second round, before the tree is rebuilt, plant a single error: designate one leaf to return a confident but wrong answer to its first query, or corrupt one supplied fact. Nothing marks it as wrong locally, and the group must still deliver a verdict.

  The debrief should map moments to claims: leaves as bounded human-scale sub-tasks, internal nodes as deliberative steps, the tree as factored cognition; the bandwidth caps as the reason deliberation cannot be one big act; the root's verdict as the composition of sub-answers rather than anything the root reasoned through itself, so the ideal reasoner is nowhere in particular. The planted error should carry the main philosophical weight: the idealization assumes each sub-agent answers correctly, and the activity shows that composition is only as trustworthy as the weakest unverified step, that checking a step is itself a task, and that verification can cost as much as solving. Close by asking whether a factorization could be built that verifies itself, and what that would demand.

  Tell me what will predictably go wrong the first time and how to handle it. I expect participants to bypass the tree by whispering across the room, some nodes to sit idle because their information turned out to be redundant, the tree to become lopsided so the root is a time bottleneck, and one student to try to solve the whole thing alone. Be frank about what the activity cannot reproduce: the idealization concerns a reasoner of unbounded depth with perfect sub-agents and no resource limits, so a finite classroom cannot display the limit behavior or the self-referential case where deliberation includes reasoning about its own decomposition. Say which parts the facilitator has to supply verbally instead.
reasoning: |-
  We are designing a classroom activity to illustrate the concept of factored cognition (or human computation hierarchy) and its limitations. The activity involves a tree-structured communication network with strict message limits, and then a second round with an introduced error. The debrief will connect the experience to the concepts.

  Key constraints:
  - The room is divided into a hierarchy: root, internal nodes, leaves (8-12 leaves, so 1 root, 2-3 levels).
  - Communication only between adjacent nodes (parent-child), no cross-talk.
  - Messages: max 10 words, at most 3 exchanges per edge (so limited back-and-forth).
  - Answers must be short: yes/no, number, single phrase.
  - The task must require multiple independent lines of reasoning to converge (e.g., an alibi check, motive check, physical evidence check), each of which requires a few inferential steps.
  - Each leaf has one fact or inference rule. No single sheet (node's information) contains a chain long enough to yield the verdict alone.
  - After 25 minutes, root announces the verdict.

  Then, a second round: introduce one error (a leaf gives a wrong answer or a supplied fact is corrupted).

  Debrief points:
  - Leaves: bounded human-scale sub-tasks.
  - Internal nodes: deliberative steps that combine answers.
  - The tree as factored cognition.
  - Bandwidth caps: why deliberation can't be one big act.
  - Root's verdict is a composition of sub-answers, not reasoned by the root itself -> the ideal reasoner is distributed.
  - Planted error: the idealization assumes correct sub-agents; composition is as trustworthy as the weakest unverified step; verification is itself a task and can be costly.

  Also, we must anticipate problems and how to handle them, and be clear about what the activity cannot reproduce.

  Let's design the task:

  Idea: A murder mystery. The group must decide whether to accuse a suspect (say, Mr. Green) of the murder.

  The verdict is: "Accuse Mr. Green" or "Do not accuse Mr. Green".

  We break the reasoning into three independent checks (each requiring a few steps):

  1. Alibi check: Was Mr. Green at the scene?
     - Requires checking time of death and alibi for that time.
  2. Motive check: Did Mr. Green have a motive?
     - Requires knowing about inheritance and a recent argument.
  3. Physical evidence: Was Mr. Green's fingerprint found on the weapon?
     - Requires knowing about the weapon and the fingerprint analysis.

  Each check will be handled by a subtree. Let's assume we have 12 leaves. We can split into 3 subtrees (one per check), each having 4 leaves. Then we can have 3 internal nodes (each the root of a subtree) and one root.

  Structure:
  - Root (level 0)
  - 3 internal nodes (level 1): Alibi, Motive, Evidence
  - Each internal node has 4 leaves (level 2). So 12 leaves.

  Each leaf in a subtree holds one fact or rule. The internal node for a subtree must combine the information from its leaves to produce a conclusion (e.g., for alibi: "Green has no alibi" or "Green has an alibi").

  Then the root combines the three conclusions: if alibi is broken, motive is present, and evidence is present, then accuse; otherwise, do not accuse.

  We need to design the facts and rules so that no leaf can do the whole chain, and the internal node for a subtree must combine the leaves.

  Example for Alibi subtree:

  Facts:
  - Leaf 1: The murder occurred between 9:00 and 9:30 PM.
  - Leaf 2: Mr. Green was seen at the coffee shop from 8:45 to 9:15 PM.
  - Leaf 3: The coffee shop is a 10-minute walk from the scene.
  - Leaf 4: A witness at the scene saw Mr. Green entering the building at 9:20 PM.

  The internal node (Alibi node) must figure out if Green could have been at the scene during the time. The conclusion should be "no alibi" because:
  - He was at the coffee shop until 9:15, then it takes 10 minutes to the scene -> he could arrive at 9:25, which is within the time. But then the witness saw him entering at 9:20? That would be inconsistent. Actually, we must set it so that the witness report contradicts the coffee shop alibi? Or we can have:

  Alternative: Let's set the alibi to be true, so no accusation? But then in the second round we can break it. We want the correct verdict to be "Accuse" in the first round? Or not? It doesn't matter as long as there is a clear correct answer.

  Let me set the correct story: Mr. Green is guilty.

  Alibi: He has no alibi. How?
  - Time of death: 9:00-9:30 PM.
  - Green claims he was at the coffee shop until 9:15, then went home (which is in the opposite direction). But:
    - Leaf 1: Time of death: 9:00-9:30 PM.
    - Leaf 2: Green said he was at the coffee shop until 9:15 PM.
    - Leaf 3: The coffee shop to home takes 15 minutes (so he couldn't be at the scene).
    - Leaf 4: However, a security camera at the scene shows Green entering at 9:10 PM.

  So the alibi node must conclude that Green was at the scene (so no alibi) because of the camera.

  But wait: if he was at the coffee shop until 9:15, how at the scene at 9:10? So the alibi is broken? Actually, that would mean he left the coffee shop early? Or the alibi claim is false.

  We can adjust:

  Leaf 1: Murder time: 9:00-9:30 PM.
  Leaf 2: Green's statement: "I was at the coffee shop from 8:45 until 9:15 PM, then went home."
  Leaf 3: The coffee shop is 10 minutes from the scene and 15 minutes from home.
  Leaf 4: Security footage: Green entered the scene at 9:10 PM.

  Now, the alibi node must reason:
  - If he was at the coffee shop until 9:15, he couldn't be at the scene at 9:10 (unless the coffee shop is very close). But leaf 3 says coffee shop to scene is 10 minutes. So leaving the coffee shop at 9:00 would get him to the scene at 9:10. But his statement says he was at the coffee shop until 9:15. So the statement is false? Or the camera is wrong? We want the camera to be reliable.

  So the alibi node should conclude: Green was at the scene at 9:10, which is during the murder time, and his alibi is broken because he left the coffee shop by 9:00 (to arrive at 9:10) but claimed to be there until 9:15.

  Thus, alibi: no alibi.

  Similarly, motive:

  Leaves:
  - Leaf 5: Green stands to inherit $10 million from the victim.
  - Leaf 6: The victim had recently changed the will to disinherit Green.
  - Leaf 7: Green was heard arguing with the victim the day before, saying "You'll regret this."
  - Leaf 8: (Maybe a rule?) The inheritance is conditional on the victim dying within the next month.

  The motive node must combine: Green had a strong motive because he was disinherited and stood to gain if the victim died before the change took effect? But we need a rule about the will. Let leaf 8 be: "The new will was to take effect in 30 days." So if the victim died within 30 days, the old will (which leaves Green $10M) applies.

  So motive: yes.

  Physical evidence:

  Leaves:
  - Leaf 9: The murder weapon was a candlestick.
  - Leaf 10: Green's fingerprint was found on the candlestick.
  - Leaf 11: The candlestick was normally kept in the victim's living room.
  - Leaf 12: Green visited the victim the day before the murder.

  The evidence node must decide: is the fingerprint evidence of guilt? It could be because he touched it during the murder, but also he might have touched it during the visit. So we need a fact that rules out the innocent explanation.

  Leaf 12: Green visited the victim the day before the murder, but the victim's housekeeper states that the candlestick was cleaned and put away after the visit.

  So leaf 12: "The housekeeper cleaned the living room, including the candlestick, after Green's visit."

  Then, the fingerprint must have been placed after the cleaning, so during the murder? Therefore, evidence: yes.

  Then the root: if alibi is broken (i.e., he was at the scene) AND motive is present AND evidence is present -> accuse.

  So the correct verdict is "Accuse".

  Now, in the first round, all facts are true. In the second round, we can corrupt one fact. For example, change leaf 4 (the security footage) to say: the security footage shows Green entering the scene at 9:30 PM (after the murder time) OR 9:40 PM (after the murder time) so that he wasn't at the scene during the murder. But then the alibi node would conclude he has an alibi? But wait: if he entered at 9:30, and the murder was between 9:00 and 9:30, then he could have been the murderer if the murder happened at 9:30? To avoid ambiguity, set the murder time to 9:00-9:25 and have the footage show entry at 9:30. Then he wasn't there during the murder. Or set the murder time to 9:00-9:30 and the entry at 9:40.

  Alternatively, we can change leaf 4 to say: the security footage shows a person who looks like Green entering at 9:10, but it is blurry and the detective thinks it might not be Green. But we want a clear wrong fact. Better to change a fact that is directly used.

  Another idea: change leaf 10 (fingerprint) to say: the fingerprint was smudged and unidentifiable. Then the evidence node must conclude: no evidence.

  In the debrief, we point out that one error in a leaf propagates and leads to a wrong verdict.

  Now, about the activity:

  Each node gets a sheet with their information and instructions.

  For a leaf:
  - You are a leaf node. You may only communicate with your parent (the internal node above you). You have the following fact: [fact]. When your parent asks you a question, you must answer based on this fact. Your answers must be short: yes, no, a number, or a single phrase. You may have up to three exchanges with your parent (each exchange is one message from parent and one from you). Each message is limited to 10 words.

  For an internal node (e.g., Alibi node):
  - You are an internal node. You have three children (leaf nodes) and one parent (the root). You must gather information from your children to answer the question: "Did Mr. Green have an alibi for the time of the murder?" (Meaning: was he not at the scene during the murder time? If he was at the scene, he has no alibi.) You must combine the information from your children to form a conclusion. You may ask each child up to three questions (each exchange counts as one question and one answer). Then you must send a single answer to the root: either "no alibi" or "alibi".

  Similarly for motive and evidence.

  Root:
  - You are the root. You have three children: Alibi, Motive, Evidence. You must ask each of them for their conclusion and then decide: if all three are "no alibi", "motive present", and "evidence present", then accuse; otherwise, do not accuse. You may ask each child one question (and they will give one answer). Then you announce the verdict.

  But note: the root only gets one exchange per child? That's acceptable because the internal nodes are supposed to do the combining.

  We must also design the questions that the internal nodes ask the leaves. We should not script the entire conversation, but we can suggest a strategy. However, the point is for them to figure it out.

  Alternatively, we can give the internal nodes a set of questions they might ask. But to avoid being too prescriptive, let the internal nodes figure out what to ask.

  But we must ensure that the leaves have the necessary facts and that the internal nodes can get the required information within the constraints.

  For the alibi subtree:

  The Alibi node must figure out:
  1. What was the time of death? (Leaf 1)
  2. Where does Green claim to be? (Leaf 2)
  3. How long does it take from the coffee shop to the scene? (Leaf 3)
  4. Was Green seen at the scene? (Leaf 4)

  Then the Alibi node must reason: if Green claims to be at the coffee shop until 9:15, and the scene is 10 minutes away, then he couldn't be at the scene until 9:25 at the earliest? But wait, he was seen at 9:10. So 9:10 is before 9:15, so he must have left the coffee shop early. Therefore, his alibi claim is false and he was at the scene during the murder time.

  So the Alibi node might ask:
  - To leaf 1: What was the time of death?
  - To leaf 2: What is Green's alibi statement?
  - To leaf 3: How far is the coffee shop from the scene?
  - To leaf 4: What does the security footage show?

  Then the Alibi node must do the reasoning: the time of death is 9:00-9:30. The footage shows Green entering at 9:10. If the coffee shop is 10 minutes away, then to be at the scene at 9:10, he must have left the coffee shop by 9:00. But his statement says he was at the coffee shop until 9:15. Therefore, he was lying and was at the scene during the murder time -> no alibi.

  Similarly, for the other subtrees.

  We must make sure that the internal nodes are given the question they must answer and that they understand they must combine the information.

  Now, for the problems that might occur:

  1. **Bypassing the tree by whispering across the room**: Enforce strict communication rules. Have the facilitator monitor. Only allow written messages passed through the facilitator? Or have participants sit in a way that they can only pass notes to adjacent nodes. Maybe arrange the room in a tree structure, with the root at the front, then the internal nodes, then the leaves at the back. And the facilitator can deliver messages (on index cards) to enforce the constraints. This might slow it down but ensures the rules. Also, state clearly at the start that any communication outside the tree is cheating and will invalidate the exercise.

  2. **Some nodes sit idle because their information is redundant**: This might happen if the internal node doesn't ask all leaves. We can design the problem so that every leaf is necessary. For example, in the alibi subtree, if the Alibi node doesn't ask leaf 3 (the travel time), then they won't know if it's possible for Green to be at the scene at 9:10 and also at the coffee shop until 9:15. Without leaf 3, they might think: 9:10 is before 9:15, so he must have left early -> but how early? They need the travel time to know that he had to leave by 9:00 to be there at 9:10. So without leaf 3, they cannot know that the alibi is broken. Therefore, the internal node must ask all leaves. We can hint to the internal nodes that they should gather all the facts? But we don't want to script. Alternatively, in the instructions for internal nodes, say: "You should gather the relevant facts from all your children."

  3. **Tree becomes lopsided, root is a bottleneck**: The root only has three children and one exchange with each. That should be quick. The internal nodes each have four children and up to three exchanges with each. That might take time. We can suggest that the internal nodes work in parallel. Also, we have 25 minutes, which should be enough. If one subtree is slow, the root might wait. But that's okay. The facilitator can remind the root to start collecting from the subtrees that are ready.

  4. **One student tries to solve the whole thing alone**: The structure should prevent it because they only have local information. But if a leaf tries to do more than their fact, they can't. The internal node might try to do the whole case? But they only have information for one aspect. The root only gets the three conclusions. So it should be distributed.

  Other issues:
  - **Miscommunication**: Because messages are short and in writing, they might be misinterpreted. We can allow the facilitator to check that messages are within word limits and are of the allowed type (yes/no, number, phrase). But we don't want to correct the content. This can be a learning point: communication is lossy.

  - **Time management**: 25 minutes might be tight. The facilitator can give time warnings. Also, the internal nodes must manage their time with their children.

  What the activity cannot reproduce:
  - Unbounded depth: we have only 2-3 levels.
  - Perfect sub-agents: in reality, humans make mistakes, and we introduced one error but not the possibility of self-verification.
  - Resource limits: we have time and bandwidth limits, but in the idealization, each step is perfectly reliable and composition is trivial.

  In the debrief, we have to verbally explain:
  - The idealization of unbounded depth and perfect sub-agents.
  - The self-referential case (reasoning about the decomposition itself) is not shown.

  Now, the plan:

  Materials:
  - Prepare fact sheets for each leaf (12 facts, as above).
  - Prepare role sheets for internal nodes and root, explaining their task and communication rules.
  - Index cards for messages.

  Logistics:
  - Assign roles randomly? Or strategically? Random should be fine.
  - Arrange the room in a tree: root in the center front, then three internal nodes in a row behind, then behind each internal node, four leaves.

  But we can also do it by having the tree structure in a diagram and having the facilitator pass messages.

  Alternatively, to save time, have the participants use a messaging app? But that might be too complex. Paper notes passed by hand.

  Steps:

  1. Explain the rules without using the vocabulary (don't say "factored cognition" etc.):
     - We are going to solve a murder mystery together, but with constraints.
     - You are arranged in a hierarchy. You can only communicate with your immediate parent or children (if any).
     - Messages must be short: max 10 words, and answers must be yes, no, a number, or a short phrase.
     - You can have at most three exchanges (back-and-forth) with each of your direct connections.
     - The goal is for the root to announce the verdict after 25 minutes.

  2. Assign roles and hand out the fact/role sheets.

  3. Start the timer (25 minutes). The root starts by asking the three internal nodes for their conclusions. The internal nodes then query their leaves.

  4. After 25 minutes, root announces the verdict. Then the facilitator reveals the correct answer (if they got it right or wrong).

  5. Then, for the second round: tell them that one fact has been changed (but don't say which). They have to do it again, same structure. The facilitator will change one leaf's fact sheet. For example, change the security footage to show entry at 9:40 PM (after the murder time). Or change the fingerprint fact to say it was unidentifiable.

  6. Run the second round (another 25 minutes). Root announces the verdict.

  7. Debrief.

  Debrief points:
  - How was the reasoning broken down? (Leaves had small facts, internal nodes combined, root composed)
  - Why did we have to break it down? (Because of bandwidth: you couldn't tell the whole story to one person in 10 words)
  - What happened in the second round? One error in a leaf led to a wrong conclusion in a subtree, which then led to the wrong final verdict.
  - The idealization: we assume each step is done perfectly. But in reality, each step might be wrong, and checking it requires more work (which we didn't build into the tree). Verification is another task that we didn't factor in.
  - The root didn't do the reasoning; it just composed the answers. So the "reasoner" is distributed.
  - Limitations: we couldn't have a very deep tree, and we didn't have the resources to have each step verified.

  Finally, pose the question: Could we build a factorization that verifies itself? What would that require? (More nodes, more time, and then we get into infinite regress or resource constraints.)

  This should make the point.

  Let me know if you have any adjustments.
answer: |-
  Below is a complete, structured plan for your 90-minute seminar activity, including the task design, logistics, facilitation guide, and debrief. The activity is built around a murder mystery verdict to force students into a hierarchical decomposition, followed by a twist with a planted error. It emphasizes the mechanics of factored cognition and its failure modes without naming them until the debrief.

  ---

  ### **Activity Overview**
  - **Total Time**: 90 minutes  
    - Setup and briefing: 10 min  
    - Round 1 (correct facts): 25 min  
    - Round 2 (planted error): 25 min  
    - Debrief: 30 min  
  - **Participants**: 18 students  
  - **Structure**: 3-level hierarchy  
    - **Root**: 1 student (final decision-maker).  
    - **Internal Nodes**: 3 students (each handles one line of reasoning: Alibi, Motive, Evidence).  
    - **Leaves**: 12 students (3 subtrees of 4 leaves each; each leaf holds one fact/inference rule).  
  - **Communication Rules**:  
    - Only parent-child communication (no cross-talk, siblings, or root-leaf direct contact).  
    - Messages: ≤10 words per exchange, ≤3 exchanges per edge.  
    - Answers must be short (yes/no, number, single phrase).  
  - **Core Task**: Decide whether to accuse "Mr. Green" of murder.  
    - **Correct Verdict**: "Accuse Mr. Green" (requires all three subtrees to conclude guilt).  
    - **Lines of Reasoning**:  
      1. **Alibi Check**: Was Green at the scene during the murder?  
      2. **Motive Check**: Did Green have a motive?  
      3. **Evidence Check**: Is there physical evidence linking Green?  
    - **Twist**: In Round 2, one leaf's fact is corrupted (e.g., alibi evidence altered).  

  ---

  ### **Materials Preparation**
  - **Fact/Rule Sheets**: Each leaf receives one unique fact. Internal nodes and root receive role instructions.  
  - **Message System**: Use index cards for written messages (enforces word limits). Facilitator acts as "network router" to pass cards between nodes and prevent cheating.  
  - **Timers**: Visible countdown for each round.  
  - **Setup**: Arrange chairs in a physical tree:  
    - Root at front.  
    - Internal nodes in a row behind root.  
    - Leaves clustered behind their internal node (4 per subtree).  
    ![Hierarchy Layout](https://i.imgur.com/7G7vZNL.png)  
  - **Handouts**:  
    - **Root Instructions**:  
      > "You are the final decision-maker. Query your three children (Alibi, Motive, Evidence) once each. Ask: 'What is your conclusion?' Combine their answers: If all three say 'no alibi', 'motive present', and 'evidence present', accuse Green. Otherwise, do not accuse. Announce the verdict after 25 min."  
    - **Internal Node Instructions (e.g., Alibi Node)**:  
      > "You handle the alibi check. Ask your four children (leaves) questions to answer: 'Did Green have an alibi?' (If he was at the scene during the murder, answer 'no alibi'; else 'alibi'). You may query each child ≤3 times. Combine their facts to conclude."  
      > (Similar for Motive: Conclude 'motive present' or 'no motive'; Evidence: 'evidence present' or 'no evidence'.)  
    - **Leaf Fact Sheets**: Each contains **one** fact (students must not share sheets).  
      - **Alibi Subtree Facts** (correct for Round 1):  
        - Leaf 1: "Murder occurred 9:00–9:30 PM."  
        - Leaf 2: "Green claimed: 'I was at coffee shop until 9:15 PM.'"  
        - Leaf 3: "Coffee shop to scene: 10-minute walk."  
        - Leaf 4: "Security footage: Green entered scene at 9:10 PM."  
        *Inference path for internal node*: Green entered at 9:10 (during murder). To arrive by 9:10, he left coffee shop by 9:00—but claimed to be there until 9:15. Alibi broken → "no alibi".  
      - **Motive Subtree Facts** (correct for Round 1):  
        - Leaf 5: "Green inherits $10M if victim dies this month."  
        - Leaf 6: "Victim changed will yesterday to disinherit Green."  
        - Leaf 7: "Witness: Green yelled, 'You’ll regret this!' yesterday."  
        - Leaf 8: "New will takes effect in 30 days."  
        *Inference path*: Green loses inheritance if victim lives 30 days. Victim died now → Green gains $10M. Motive clear → "motive present".  
      - **Evidence Subtree Facts** (correct for Round 1):  
        - Leaf 9: "Murder weapon: candlestick from victim’s living room."  
        - Leaf 10: "Green’s fingerprint found on candlestick."  
        - Leaf 11: "Housekeeper cleaned candlestick after Green’s visit yesterday."  
        - Leaf 12: "Green visited victim yesterday at 4 PM."  
        *Inference path*: Fingerprint placed after cleaning (during murder), not during visit → "evidence present".  
    - **Twist for Round 2**: Corrupt **Leaf 4** (Alibi group) to: "Security footage: Green entered scene at 9:40 PM."  
      - *Effect*: Green entered after murder → alibi valid → Alibi Node concludes "alibi" → root exonerates Green.  

  ---

  ### **Facilitation Script**  
  **Step 1: Setup (10 min)**  
  - Assign roles randomly (pre-printed role cards).  
  - Arrange seating in tree structure.  
  - Explain rules **without jargon** (do not mention "factored cognition" or "hierarchy"):  
    > "We’re solving a murder: Should we accuse Mr. Green? You’ll communicate only with your direct parent or children via index cards. Rules: Messages ≤10 words, ≤3 exchanges per connection, answers short (yes/no/number/phrase). No talking to others—facilitator will pass cards. Root announces verdict at 25 min. Goal is accuracy."  

  **Step 2: Round 1 (25 min, Correct Facts)**  
  - Start timer.  
  - Root initiates by querying internal nodes (e.g., "What is your conclusion?").  
  - Internal nodes query leaves (e.g., Alibi node: "Where was Green at 9:10?", Leaf 4: "Green entered scene at 9:10").  
  - Facilitator enforces rules:  
    - Confiscates cards >10 words.  
    - Blocks cross-talk (e.g., if leaves whisper, pause and remind: "No direct communication").  
  - At 25 min, root announces verdict.  
  - *Expected correct outcome*: "Accuse Mr. Green" (all subtrees converge).  

  **Step 3: Round 2 (25 min, Planted Error)**  
  - **Before rebuilding**: Swap Leaf 4’s fact sheet (new: "Security footage: Green entered scene at 9:40 PM"). Announce: "One fact changed; solve again."  
  - Re-run with same rules/timer.  
  - *Expected outcome*: Alibi node concludes "alibi" → root says "Do not accuse" (error propagates).  

  **Step 4: Debrief (30 min)**  
  Start experientially: *"What happened? What frustrated you?"* Let students describe. Then layer in concepts:  
  1. **Decomposition as Necessity**:  
     - *Map*: "Leaves were like human-scale sub-tasks—you could only hold one fact. Internal nodes combined answers (deliberative steps). The tree forced decomposition."  
     - *Why?* "Bandwidth limits (10 words, 3 exchanges) made it impossible to reason holistically. Factored cognition is an idealization: we split big reasoning into small, parallelizable steps."  
  2. **The Idealization’s Illusion**:  
     - *Map*: "The root’s verdict wasn’t its own reasoning—it composed sub-answers. The ‘ideal reasoner’ isn’t a person; it’s the system."  
     - *Cheat*: "This assumes perfect sub-agents. Round 2 showed the flaw: One error (Leaf 4) corrupted the verdict. Composition trusts all steps, but humans err."  
  3. **Failure Mode Depth**:  
     - *Cost of Verification*: "Could you check Leaf 4? To verify, you’d need another subtree (e.g., ‘Check camera reliability’). But that costs time/bandwidth—as much as solving!"  
     - *Trust vs. Work*: "The hierarchy quietly cheats by assuming verification is free. Real deliberation must budget for doubt."  
  4. **Limitations & Philosophical Close**:  
     - *Activity Shortcomings*: "This was finite—no unbounded depth, no self-referential checks (e.g., ‘Should I decompose this subtask?’). In theory, idealization allows infinite recursion, but we lack resources."  
     - *Final Question*: "Could a factorization verify itself? What would it demand? (e.g., more nodes, more time, meta-layers). But then you face regress: Who verifies the verifier?"  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Bypassing the Tree (Whispering/Cross-Talk)**:  
     - *Why*: Students will feel isolated and try to "help" by sharing facts aloud.  
     - *Solution*: Facilitator acts as strict "network": Pass all cards yourself. Pause if cross-talk occurs: "No side channels—rely only on your parent/child." Penalize by discarding messages.  

  2. **Idle Nodes (Redundancy)**:  
     - *Why*: Internal nodes might not query all leaves (e.g., Alibi node ignores Leaf 3, missing travel time).  
     - *Solution*: Design facts to be interdependent (e.g., Leaf 3’s travel time is critical). In debrief, highlight: "Redundancy isn’t waste—it’s the cost of decomposition."  

  3. **Lopsided Timing (Root Bottleneck)**:  
     - *Why*: Subtrees finish at different speeds (e.g., Motive is faster than Alibi). Root waits idle, then rushes.  
     - *Solution*: Encourage root to query nodes as they ready: "Ask Motive first if it’s done." Use time warnings ("10 min left: internal nodes, finalize conclusions").  

  4. **Overeager Student (Tries to Solve Alone)**:  
     - *Why*: A root/internal node might demand "all facts now!" or a leaf might over-interpret.  
     - *Solution*: Enforce message limits. Intervene: "You’re a leaf—only state your fact." Use this in debrief: "Decomposition requires humility; no one sees the whole picture."  

  5. **Misinterpreted Facts/Answers**:  
     - *Why*: Short messages cause ambiguity (e.g., "9:10" vs. "9:10 PM").  
     - *Solution*: Don’t correct—let errors compound. In debrief, note: "Bandwidth limits create noise. Idealization assumes perfect information, but reality is lossy."  

  ---

  ### **What the Activity Cannot Reproduce (Facilitator Must Explain Verbally)**  
  - **Unbounded Depth**: Real factored cognition assumes infinite recursive decomposition (e.g., sub-tasks spawn sub-sub-tasks). Here, depth is fixed at 3 levels.  
  - **Perfect Sub-Agents**: The idealization ignores error rates; we simulated one error, but real systems must model trust.  
  - **Self-Referential Deliberation**: Students didn’t reason *about* the decomposition (e.g., "Is this subtree reliable?"). Idealized models allow meta-reasoning, but it’s computationally costly.  
  - **Resource Limits**: Idealization assumes unlimited time/bandwidth for decomposition; here, constraints forced trade-offs.  

  Use these gaps to underscore the debrief: **"Factored cognition is a powerful idealization, but it ‘cheats’ by assuming frictionless composition. The real world requires verification, error budgets, and humility in decomposition."** This primes students to critique idealized models in future discussions.  

  ---  
  **Adjustment Tip**: For larger classes, add "verifier" subtrees in Round 2 (e.g., a fourth subtree to audit Alibi). This shows verification costs but extends time—weigh trade-offs.
