prompt: |-
  My partner's family is Catalan, and independence has been the live argument at every family meal since I have known them; more recently, the town I live in has begun a petition for a vote on leaving the larger city it was merged into fifteen years ago, and I have been asked to speak for the leave side at a public meeting. Preparing for that has forced me to write down what I actually believe, and I find that my verdicts do not obviously come from one principle. Here they are.

  - Scotland's 2014 referendum was legitimate. Both governments agreed to hold it, the question was clear, and had it passed I would have thought Westminster was bound to negotiate. I would say the same if the Northern Isles had then wanted a separate arrangement of their own.
  - Catalonia's 2017 referendum was not legitimate. The constitutional court had ruled it out, the constitution declares the unity of the Spanish nation indissoluble, and well under half the electorate voted. I would say the same even if the yes side had won overwhelmingly among those who did turn out.
  - Quebec's 1995 vote was legitimate, but a 50.1% win on a question about sovereignty with a partnership offer attached would not have settled the matter for me. The Supreme Court of Canada's 1998 opinion, which treated a clear majority on a clear question as what triggers a duty to negotiate, seems right to me.
  - Kosovo's declaration was legitimate despite Serbia's refusal, because of what had happened in the years before and because no consensual path existed.
  - Crimea's 2014 vote was not legitimate, even though I assume a majority there did want to leave Ukraine, because it took place under foreign military occupation and staying was not a fairly available option.
  - South Sudan's referendum was legitimate: the parent state agreed to it, and the grievance was longstanding.
  - A wealthy region with its own language and a solid majority that wanted out mainly to stop paying transfers to poorer regions: not legitimate, even with a clean vote.
  - The Cree and Inuit of northern Quebec had as much right to stay in Canada as Quebec had to leave it. Quebec could not have carried them out against their will.
  - My own town, merged into a bigger city whose council ignores us and spends our taxes elsewhere: legitimate, and I would vote to leave.
  - If a region secedes and one of its port cities votes heavily to remain with the old state, that city should be allowed to stay.

  My tentative principle is this: a group may secede if it is a distinct community with a shared political identity, a clear majority of it votes to leave in a free vote, the resulting state would be viable and democratic, and it would protect the minorities left inside it; and no secession is legitimate if the parent state offered a genuine constitutional route and the group bypassed it. Test that against the cases and repair it. I suspect the distinct-community clause is doing illegitimate work, since I want it to exclude the wealthy region but not my own town, and I cannot see what separates them except size and the fact that one of them is mine.

  State the principle, or a small set of rival candidates, as precisely as you can, naming the case that forces each clause. Give its verdicts on cases I have not listed, including one you invent that puts real pressure on it. Then tell me which of my verdicts it cannot accommodate, and commit: if two of them cannot both survive, say which one I should give up and defend that choice rather than laying out the options for me to pick from. No reading list; I want the argument.
reasoning: |-
  Okay, let me approach this systematically. The user presents a fascinating challenge about secession principles after sharing deeply personal experiences with Catalan independence debates and local separation movements. Their detailed case judgments reveal nuanced positions that don't neatly align with conventional sovereignty theories.

  First, I notice the user has already developed a sophisticated provisional principle with specific conditions: distinct community identity, clear majority vote, state viability, minority protections, and rejection of constitutional bypass. But they rightly flag the "distinct community" criterion as problematic since it seems to arbitrarily exclude wealthy regions while including their own town. This tension needs unpacking.

  Looking at their cases, several patterns emerge. Procedures matter (Scotland vs Catalonia), but so do contextual factors like oppression (Kosovo) or military coercion (Crimea). The Quebec/Cree example introduces a nested self-determination paradox, while the port city case suggests exit rights must be reciprocal. The wealthy region objection reveals an unstated moral limit - secession can't be merely self-serving.

  For pressure testing, I consider inventing a case about resource-rich Region X in Country Y. If X secedes peacefully via constitutional process but plans to disenfranchise minority Z, does viability trump minority protections? This exposes fault lines in their principle. 

  The reconciliation requires tough choices. While supporting Scotland's process, the user must recognize that distinctiveness arguments can cut both ways - if the Northern Isles claimed distinct identity post-Scottish independence, consistency might require accepting that. Some verdicts like Quebec's narrow margin being insufficient appear fully compatible.

  Ultimately the wealthy region case and their town's case reveal that "distinct community" isn't the real differentiator - it's the purpose of secession. I'll argue they should abandon the distinctiveness clause entirely and emphasize that secession must remedy injustice, not create new inequities. Their instinct about minority protections in the port city example already points this way.
answer: |-
  Your cases reveal a sophisticated, context-sensitive view of secession that resists reduction to a single principle. Your provisional principle is a strong start, but requires refinement to handle tensions in your judgments. Below is a revised principle set, tested against your cases and new pressure points.

  **The Revised Principle Set:**  
  1. **Procedural Legitimacy:** Secession requires a free and fair vote with clear majority support *and* either:  
     - Parent state consent, OR  
     - Exhaustion of constitutional remedies *and* grave injustice (e.g., systemic oppression, violent suppression of autonomy).  
     *(Forces: Catalonia ’17 vs. Kosovo)*  

  2. **Anti-Exploitation Clause:** Secession is illegitimate if its *primary motive* is to evade fiscal obligations or exploit vulnerable groups, even with procedural correctness.  
     *(Forces: Wealthy region vs. Your town)*  

  3. **Recursive Self-Determination:** Any seceding entity must allow nested units (e.g., cities, indigenous territories) facing the same grievances to exercise self-determination via equivalent standards.  
     *(Forces: Northern Quebec Cree/Inuit; Port city)*  

  4. **Viability & Continuity:** The new state must be functionally viable and commit to upholding democratic rights/pre-existing minority protections.  
     *(Forces: South Sudan; Quebec ’95 margin)*  

  ---

  **Verdicts on Your Cases:**  
  | Case                  | Your Verdict       | Revised Principle Verdict | Conflict?                     |  
  |-----------------------|--------------------|---------------------------|-------------------------------|  
  | Scotland 2014         | Legitimate         | Legitimate (Consent)      | None                          |  
  | Catalonia 2017        | Illegitimate       | Illegitimate (No consent/injustice) | None |  
  | Quebec 1995           | Legitimate (but 50.1% insufficient) | Legitimate only if clear majority* | None |  
  | Kosovo                | Legitimate         | Legitimate (Grave injustice) | None                       |  
  | Crimea 2014           | Illegitimate       | Illegitimate (Coercion)   | None                          |  
  | South Sudan           | Legitimate         | Legitimate (Consent + grievance) | None |  
  | Wealthy region        | Illegitimate       | Illegitimate (Anti-Exploitation) | None |  
  | N. Quebec Cree/Inuit | Right to stay      | Recursive right upheld    | None                          |  
  | Your town             | Legitimate         | Legitimate (Grievance; no exploitation) | None |  
  | Port city             | Right to stay      | Recursive right upheld    | None                          |  

  \* *Aligns with Canadian Supreme Court’s "clear majority on clear question"*

  ---

  **Inconsistent Verdicts & Required Sacrifice:**  
  Your **Northern Isles hypothetical** (post-Scottish independence) conflicts with your **wealthy region case**.  
  - **Conflict:** If Scotland secedes legitimately (distinct community), why deny the Northern Isles the same right? Your wealthy region verdict rejects secession based on *motive* (selfishness), not lack of distinctness.  
  - **Sacrifice Needed:** Abandon the **"distinct community" clause** entirely. It is both over-inclusive (wealthy regions can be "distinct") and under-inclusive (your town may lack unique identity but has legitimate grievances).  
  - **Defense of Sacrifice:**  
    - Moral weight comes from *why* a group seeks secession, not cultural distinctiveness. Your town’s merger grievance (taxation without representation) mirrors classic self-determination claims; the wealthy region’s motive (avoiding solidarity) is morally corrosive.  
    - "Distinctness" is subjective and easily weaponized (e.g., denying Catalonia’s legitimacy by questioning its "unity"). Anti-exploitation resolves this cleanly.  

  ---

  **Pressure Test: Invented Case**  
  **Case:** *Region A*, historically oppressed by State B, wins independence via a clean referendum with State B’s consent. Post-secession, *District X* (40% of Region A’s territory, populated by an ethnic minority) petitions to *rejoin State B*, citing economic sabotage by Region A.  

  **Revised Principle Verdict:**  
  - **Procedural Legitimacy:** Region A’s secession is legitimate (consent + grievance).  
  - **Recursive Self-Determination:** District X has a right to a free vote on rejoining State B *if* it proves equivalent grievances (e.g., targeted disenfranchisement).  
  - **Anti-Exploitation:** If Region A’s treatment of District X constitutes exploitation (e.g., resource extraction without investment), rejoining is legitimate.  

  **Pressure Point:** Forces trade-offs between stability and recursive justice. If District X’s departure cripples Region A’s viability, does continuity override self-determination? *Your principle prioritizes recursion:* Viability cannot justify denying nested self-determination if grievances are substantiated.

  ---

  **Final Principle (Revised):**  
  > Secession is legitimate if:  
  > **(1)** It follows a free/fair vote with a clear majority (per *Quebec ’95*);  
  > **(2)** It either (a) has parent state consent, OR (b) addresses grave injustice where constitutional paths are exhausted or futile (per *Kosovo*);  
  > **(3)** Its core motive isn’t predatory exploitation (per *Wealthy region*);  
  > **(4)** It permits nested self-determination for sub-regions under equivalent standards (per *Port city*); and  
  > **(5)** The new state is viable and maintains pre-existing minority protections (per *South Sudan*).  

  **Why This Works:**  
  - **Drops "distinct community"** in favor of objective criteria (grievances, procedure, motives).  
  - **Accommodates all your cases** except the wealthy region, which is resolved by the anti-exploitation clause.  
  - **Forces tough but consistent choices:** Your Northern Isles hypothetical would require consent from *both* the UK and an independent Scotland, preventing chaotic fragmentation.  

  **Commitment:** Stand by your **wealthy region verdict** and **Northern Quebec** view. Sacrificing "distinctness" strengthens your stance: it makes exploitation—not culture—the moral disqualifier, protecting solidarity without privileging identity.
