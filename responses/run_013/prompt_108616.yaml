  Hmm, they're making several sharp points: First, the invariance theorem's additive constant can dominate for short strings - exactly when we need induction most. Second, encoding conventions (self-delimitation, alphabet choice) are arbitrary from the world's perspective. Third, finite agents must choose some implementation, making the prior dependent on notation rather than reality. Finally, they demand whether this "limit" concept has any meaning for beings who only encounter finite problems.

