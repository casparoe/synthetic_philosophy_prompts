  Their last line about "limits never attained" is powerful. I must concede this is true of all idealizations (infinite tapes, halting oracles) but argue they're still essential for understanding. The universal prior isn't a practical tool but a justification for why simple theories should be preferred at all.
answer: |-
  You've constructed a thoughtful challenge, but I reject the premise that gauge-anchoring is necessary for the universal prior to be an objective idealization of inductive simplicity. Let's dissect this.

  First, the invariance theorem *does* guarantee gauge-fixing: the relative simplicity *ordering* of hypotheses (by Kolmogorov complexity) is stable across universal machines up to that additive constant. This is precisely what Occam's razor demands — it tells us which hypothesis is *simpler*, not an absolute "simplicity energy." The additive constant is irrelevant for ranking hypotheses, as it applies uniformly. Yes, for very short strings under low data, the constant can dominate *absolute* complexity values. But induction under extreme data poverty is inherently unstable — even humans can't reliably rank hypotheses with negligible evidence. The prior shines when data accumulates: as evidence grows, the constant becomes negligible *relative to the information in the data*, and the simplest explanation dominates. This mirrors real science: early disagreement gives way to consensus as evidence mounts.

  You claim the constant is "set by conventions of encoding," implying arbitrariness. But the choice of universal machine is like choosing a coordinate system in physics: the underlying structure (compressibility, pattern existence) is invariant. Two machines might disagree on the *exact* complexity of a 5-bit string, but they *agree* that "010101" is simpler than "011001" if one exhibits a pattern the other lacks. The world selects for *patterns*, and the prior formalizes pattern detection. Finite agents use computable *approximations* of this ideal, just as we use Newtonian mechanics knowing relativity exists. The objectivity isn't in the unreachable limit; it's in the asymptotic convergence toward the correct description as data grows. Without this ideal, how do you justify that simplicity *should* guide induction at all? The prior grounds simplicity in information theory, not philosophy.

  Counter-question: If the universal prior isn't tracking objective simplicity, what *does* explain why compressible hypotheses consistently predict better in practice?
