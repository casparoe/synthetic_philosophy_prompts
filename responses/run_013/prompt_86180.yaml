answer: |-
  ## Pascal and Moral Uncertainty: A Calculated Verdict

  As a historian steeped in both early modern moral theology and contemporary decision theory, your thesis is profoundly suggestive. Predicting Pascal’s reaction requires grounding in his core commitments. Here are the indispensable features of his outlook:

  1.  **The Corruption of Reason & Primacy of the Heart:** Pascal held a deeply Augustinian view of fallen human nature. Speculative reason, unaided by grace, is profoundly weak, prone to error, self-deception, and manipulation by the passions ("l’esprit de géométrie" versus "l’esprit de finesse"). True understanding and moral certainty come not from calculation but from the intuitive, grace-illumined "heart" (*coeur*), which apprehends first principles and divine truths. Rational calculation is suspect, especially when serving self-interest.
  2.  **The Rigor of Truth & Rejection of Laxity:** The *Provincial Letters* are a sustained polemic against Jesuit casuistry, particularly probabilism, which he saw as a sophisticated system of moral evasion designed to comfort the sinner and accommodate worldly desires. He championed a demanding, truth-seeking morality aligned with Augustine and Jansenism. Any system permitting action against a more probable opinion or towards perceived moral danger (akin to laxism or against tutiorism) was anathema.
  3.  **The Infinite Stakes of Salvation:** Pascal’s universe is radically bifurcated. Earthly affairs are finite, contingent, and marked by profound uncertainty. Salvation, however, is of infinite, eternal value. The *Wager* operates precisely in this unique soteriological domain, where the asymmetry of potential gain/loss overwhelms any finite uncertainty in the probabilities. This reasoning is *sui generis*; he applies no similar calculus to mundane moral choices.
  4.  **Singleness of Heart and Commitment:** Pascal valued wholehearted devotion to God and truth. Duplicity, hedging, and serving "two masters" were signs of spiritual corruption and weakness. Moral action required conviction and commitment, not splitting the difference or seeking loopholes.

  **Building the Prediction:**

  1.  **Framing the Problem: Rejection as Laxist Sophistry:**
      Pascal would categorically reject the core framing of moral uncertainty as a problem solvable by distributing credences over rival moral theories and maximizing expected choiceworthiness. He would see this as the *precise* intellectual disease he diagnosed in the Jesuit probabilists: substituting calculative opinion-weighing for the pursuit of *the true moral law*. The very act of assigning credences to competing moral truths would strike him as absurd and dangerous. Moral truth, for Pascal (especially concerning fundamental duties), is not a matter of probabilistic belief akin to empirical uncertainty; it is something to be *sought* with the whole heart and *recognised* through grace and right reason (as he understood it). To treat it as a set of hypotheses to be bet upon is to reduce morality to a game of self-interested calculation, replicating the casuists' sin of making "the opinion of a single grave doctor" sufficient grounds for potentially sinful action, merely dressed in mathematical formalism. His dismissal would be swift and total: it *is* a new laxism, more insidious for its quantitative veneer.

  2.  **Incommensurability: Proof of the Folly:**
      The problem of incommensurable cardinal scales across moral theories would not trouble Pascal as a technical challenge to be solved; he would seize upon it as definitive *proof* of the folly of the entire enterprise. It would demonstrate the inherent hubris and futility of attempting to rationally aggregate fundamentally different visions of the good through calculation. How can one add units of deontological duty to units of utilitarian welfare? This impossibility would confirm his belief that fallen reason simply cannot perform such operations meaningfully. The lack of a common scale isn't a bug in the modern theory; for Pascal, it reveals the theory's fundamental category error in applying calculative reason where it does not belong. True moral insight comes from the heart apprehending principles, not from aggregating incommensurable verdicts.

  3.  **Gerrymandering: The Casuists' Old Trick:**
      Pascal would instantly recognise the gerrymandering worry as the direct descendant of the casuists' practice of multiplying "probable opinions" by citing numerous (often dubious or misinterpreted) authorities to artificially inflate the probability of a desired, lenient conclusion. His *Letters* are replete with examples of Jesuits finding obscure theologians to support convenient moral loopholes. The modern equivalent – creating near-identical variants of a theory to boost its aggregate credence-weight – would be seen by him as the same intellectual dishonesty and moral evasion, now aided by combinatorial mathematics. It would confirm his deepest suspicions about how calculative approaches inevitably corrupt moral reasoning by prioritising quantitative weight over qualitative truth.

  4.  **The Wager: Exception, Not Precedent:**
      Your instinct that the Wager is crucial is correct, but its significance lies in its *radical exceptionalism*. Pascal would draw a sharp, principled line. The Wager deals with:
      *   **Infinite Stakes:** The gain (eternal bliss) and loss (eternal damnation) are infinitely asymmetric. No finite moral dilemma offers this.
      *   **Binary Choice:** The core Wager (as presented in the *Pensées* fragments we have) is fundamentally about two exhaustive and mutually exclusive options: wagering for God or against. It doesn't involve aggregating multiple competing theological systems.
      *   **Soteriological Imperative:** Its goal is to shock the libertine into seeking faith, leveraging self-interest to break through indifference. It's a gateway, not a routine decision procedure.
      Pascal *explicitly* contrasts the Wager's domain with ordinary life: "Here there is an infinity of infinitely happy life to be won... whereas what you stake is finite." Applying expected-value reasoning to finite moral choices, where eternal consequences are *not* directly and overwhelmingly at stake in the same binary way, would be, for Pascal, a gross misapplication. The Wager legitimises calculation *only* in the unique, existential crisis of choosing the path to salvation against infinite loss. It provides no precedent for calculating one's way through complex moral dilemmas involving competing finite duties. For those, he would fall back on seeking truth with the heart, guided by grace and rigorous principles, rejecting probabilism in all its forms.

  5.  **Hedging: Failure of Heart:**
      The very concept of hedging – deliberately performing actions partially satisfying multiple conflicting theories to maximize expected choiceworthiness – would appal Pascal as the epitome of the "double heart" he condemned. It represents a refusal to commit to the perceived truth, a willingness to play all sides, and a prioritisation of calculative safety over wholehearted pursuit of the right. It embodies the lukewarmness he despised. He would see it not as prudence, but as a profound moral and spiritual failure, a lack of courage and conviction, akin to the casuists' attempts to find safe middle paths that often led, in his view, straight to sin. True virtue, for Pascal, demanded singularity of purpose and action aligned with apprehended truth, even in uncertainty.

  **The Verdict on Your Friend's Claim:**

  Your friend is substantially correct. Pascal would indeed dismiss the contemporary literature on moral uncertainty as "a new laxism dressed up in mathematics." He would see it as a sophisticated revival of the probabilist project he excoriated – substituting calculation for the pursuit of moral truth, opening the door to self-serving manipulation (gerrymandering), ignoring the qualitative incommensurability of moral demands, and encouraging a hedging, uncommitted attitude antithetical to true virtue. The Wager, far from legitimising this approach, highlights by stark contrast the *unique* conditions under which Pascal deemed rational calculation under uncertainty permissible: solely concerning the infinite stakes of salvation in a stark binary choice. For finite moral dilemmas under theory uncertainty, he would prescribe rigorous truth-seeking guided by the heart and grace, rejecting probabilistic weighing entirely.

  **Points of Underdetermination:**

  While Pascal's core commitments strongly point to the above conclusions, some nuances remain underdetermined by his extant texts:

  1.  **Scope of Probabilism's Rejection:** Did Pascal reject *any* role for probability in *any* non-soteriological moral deliberation, or only in core matters of sin/duty? His focus was overwhelmingly on cases with potential for grave sin, but his rhetoric often condemns probabilism *as a principle*. He might allow some role for prudence in truly peripheral matters, but the modern "moral uncertainty" problem typically concerns core moral conflicts.
  2.  **Handling Genuine Ignotance:** While he rejected probabilism, how would Pascal advise acting in the face of *genuine*, unresolvable perplexity where no probable opinion seems clearly truer? His texts focus more on attacking *false* uncertainty manufactured by laxism than exploring unavoidable ambiguity. Would he fall back on tutiorism? Or insist grace ultimately illuminates the heart? The emphasis is on the *pursuit* of truth, not a decision procedure for its absence.
  3.  **The Heart's Mechanism:** While he contrasts the "heart" with calculative reason, the precise epistemic mechanism of the heart in resolving moral uncertainty is less defined. How does it "apprehend" the right course when reason fails? This remains somewhat mystical in his writing.
  4.  **Degrees of Sin & Finite Calculation:** Would Pascal entirely rule out *any* finite consequentialist calculation, even if *not* framed as weighing moral theories? His absolute prohibitions (e.g., against lying) suggest so, but his nuanced views on, say, directing intention (carefully distinguished from Jesuitical misuse) show some complexity. However, this complexity doesn't extend to endorsing *aggregation* of competing moral theories.

  In essence, while the core prediction of vehement rejection is strongly supported, the precise boundaries of permissible reasoning in non-core, finite dilemmas under irreducible uncertainty remain the haziest area in applying Pascal's thought to this modern problem. His solution was always theological and dispositional (seek truth with the whole heart), never algorithmic.
