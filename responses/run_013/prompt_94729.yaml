prompt: |-
  I'm a backend engineer, no philosophy training, and I got voluntold onto our engineering standards council — nine people, we meet every other Thursday, mostly we fight about date formats. I have to write the memo that goes out before next week's meeting and I'm out of my depth on the part of this that isn't about JSON.

  The case: for about six years we've had an unwritten convention in all our internal HTTP APIs. If a field is optional and you leave it out of a PATCH body, that means don't change it. Nobody ever wrote this down. It's baked into our client libs, our mock server, our codegen templates, our test fixtures, and about forty services, and you learn it by breaking something. Last month a team that came in through an acquisition shipped a client that treats an omitted field as clear this value, because that's what they're used to. A customer's saved configuration got silently wiped. No money lost, nobody hurt, but there's a postmortem and people are mad at the new team, and one manager wants the incident on their record, which sits badly with me because the rule they broke doesn't exist on paper anywhere.

  Options on the table. (1) Keep the convention, document it, and add validation so that a request meaning clear has to say so explicitly, with a null or a separate update-mask field. Cheapish, but it still leaves silence-means-keep as the rule, and the new team's lead keeps saying that exact pattern — silence standing in for a real decision — is how the wipe happened and is going to bite us somewhere worse than config someday. (2) Move everyone to explicit updates: nothing you send is ever a default, migration across forty services. Cleanest, and what most of us would pick if we were starting today, but a huge lift, and every service that lags is now wrong in a new way. (3) Let teams choose and keep a registry of which endpoints use which rule. Everyone hates it; the chair is pushing it as the compromise.

  The part I actually need help with. Someone on the council said this is a David Lewis thing and now I can't stop thinking about it. My understanding, from a podcast so grain of salt: a convention is a regularity that everyone follows in a situation that keeps recurring, where everyone expects everyone else to follow it, everyone is happy to keep following it as long as the others do, and all of that is common knowledge — and crucially the regularity is arbitrary, in that a different one would have worked just as well and ours is only right because it's the one everybody expects. Is that a fair summary, and does it actually fit us, or are we more like a bunch of people with the same habit? Somebody else said a convention is different from a norm, because with a norm you get blamed for deviating even when it costs you nothing, whereas with a convention you just get burned by the mismatch. If that distinction is real it definately matters for the memo, because the second we put the new team's name in a postmortem and make an example of them I think we've quietly turned one into the other, and I'd like to know whether that's a fair thing to say in writing.

  Then the practical half. If we do change the rule, what makes the new one take? Technically better doesn't seem like enough when forty services and everyone's muscle memory are on the other side. Is there something about what makes a new convention focal — for instance, if we adopt the one the wider ecosystem outside the company already uses, does that help it stick, or does it just create a second seam? Someone compared this whole thing to QWERTY and I have no idea if that analogy is even accurate.

  What I need from you: the memo to circulate before Thursday. A clear recommendation with a time frame, the reasoning, and a genuinely fair version of the case for whichever option I'm arguing against — I don't want a memo that pretends option 3 has nothing going for it, since probably half the council votes for it. Plus a short section on the blame question: do we do anything about the new team, and does the fact that the convention was never written down mean nobody can fairly be held to it? I don't think that follows but I can't explain why, and that's sort of the whole problem. Write it so the two people on the council who will hate it can still act on it.
reasoning: |-
  We are dealing with a complex situation involving conventions, norms, and technical standards. The memo needs to address both the technical and philosophical aspects while being fair and actionable.

  Key points from the user's message:
  - There's an unwritten convention: in PATCH requests, omitting an optional field means "do not change it".
  - A new team (from an acquisition) implemented the opposite: omitting a field means "clear the value", causing an incident.
  - Options: 
    (1) Keep the convention, document it, add validation (so explicit null or update mask for clearing). 
    (2) Move to explicit updates (no defaults, every update must specify fields). 
    (3) Let teams choose and maintain a registry.

  Philosophical aspects:
  - David Lewis's convention theory: 
    - A convention is a regularity in behavior that is arbitrary (another could have worked), everyone follows it, expects others to follow, and prefers to follow if others do. It becomes common knowledge.
  - Distinction between convention and norm: 
    - Convention: deviation leads to coordination failure (you get burned by mismatch). 
    - Norm: deviation leads to blame even if no immediate harm (social enforcement).

  In this case:
  - The unwritten rule was a convention: everyone followed it, expected others to, and it was arbitrary (the other interpretation could have been adopted). But it wasn't documented, so not common knowledge? However, it was baked into tools and learned by breaking things, so it was known in practice.
  - The new team deviated, causing an incident. The postmortem and the manager wanting the incident on their record might be turning the convention into a norm.

  Memo structure:
  1. Context: incident and current state.
  2. Options analysis (pros and cons) including philosophical insight.
  3. Recommendation with timeframe.
  4. Blame and accountability: how to handle the new team.

  Recommendation:
  - Option (2) is the cleanest and most explicit, avoiding ambiguity. However, it's a huge lift. 
  - Option (1) is cheaper and builds on existing practice but leaves the ambiguity of silence. 
  - Option (3) is a maintenance nightmare and increases cognitive load.

  Given the scale (40 services) and the fact that the convention is deeply embedded, a phased approach to option (2) might be too disruptive. But the incident shows the current convention is brittle.

  Alternative: Adopt option (1) for now (document and validate) and plan for option (2) as a long-term goal? But that might extend the transition.

  Regarding blame:
  - Since the convention was unwritten, the new team cannot be fairly blamed for not knowing. The organization shares responsibility for not documenting. The incident should be a learning opportunity without punitive measures.

  Focal point for change:
  - The wider ecosystem (RESTful practices) often uses PATCH with partial updates: omission means no change. Explicit clearing via null or update mask is common. This supports option (1). But option (2) (explicit updates) is also seen in some systems (like GraphQL mutations?).

  However, the user says the new team is used to the opposite. So the wider ecosystem might not be uniform.

  Time frame:
  - Short term: Document and enforce (option 1) to prevent immediate issues.
  - Long term: Consider migrating to explicit updates (option 2) with a coordinated plan.

  Draft memo:

  ---

  **Subject: Proposal for Standardizing PATCH Semantics in Internal HTTP APIs**

  **Context:**
  For approximately six years, our internal HTTP APIs have operated under an unwritten convention: in a PATCH request, omitting an optional field indicates that the field should remain unchanged. This convention is embedded in our client libraries, code generation templates, mock servers, and test fixtures. However, it was never formally documented. 

  Last month, an incident occurred when a team that joined us via an acquisition implemented a different interpretation: omitting a field in a PATCH request was intended to clear that field. This led to unintended data loss for a customer. While there were no financial or safety implications, the incident highlights the risk of relying on undocumented conventions.

  **Options Analysis:**
  We have three options for moving forward:

  1. **Document and Enforce the Current Convention (with Validation):**
     - **Description:** Formalize the existing behavior: omission means "no change". To clear a field, require an explicit indicator (e.g., setting the field to `null` or using a dedicated update mask field). Add validation to reject any request that attempts to clear by omission.
     - **Pros:** 
       - Builds on existing practice and minimizes immediate disruption. 
       - Validation prevents accidental clearing.
       - Lower implementation cost (primarily documentation and validation layer).
     - **Cons:** 
       - Retains the ambiguity of "silence" meaning a decision (to not change). 
       - The new team's lead argues this pattern could lead to more severe issues in the future.

  2. **Migrate to Explicit Updates:**
     - **Description:** Change the convention so that every PATCH request must explicitly specify every field to be updated, including those that should be cleared. Omission of a field would be an error (or undefined). This might require introducing an update mask or similar mechanism across all services.
     - **Pros:**
       - Eliminates ambiguity: every update is explicit.
       - Aligns with best practices in some ecosystems (e.g., using `null` for clear, and requiring fields only when changing).
       - Prevents future incidents of this nature.
     - **Cons:**
       - High migration cost: requires changes to ~40 services, client libraries, codegen, tests, etc.
       - During migration, inconsistencies could arise if services lag.
       - Breaks existing client integrations until they are updated.

  3. **Allow Team Choice with Registry:**
     - **Description:** Let each team choose the convention for their endpoints and maintain a central registry of which endpoints follow which rule.
     - **Pros:**
       - Accommodates existing services and the new team's preference.
       - Avoids a large-scale migration.
     - **Cons:**
       - Increases complexity for clients (must check the registry for each endpoint).
       - High potential for errors and confusion, especially in cross-team interactions.
       - Long-term maintenance burden for the registry.

  **Philosophical Considerations:**
  Our unwritten convention fits the definition of a convention (as described by philosopher David Lewis): a pattern of behavior that is arbitrary (either rule could have been chosen), followed because we expect others to follow it, and because it solves a coordination problem. However, for a convention to be effective, it must be common knowledge. Our convention, while widely known internally, was not documented and thus not fully common knowledge to new members (like the acquired team). 

  This incident resulted from a coordination failure, not willful deviation. In philosophical terms, a convention becomes a norm when deviation is socially punished even without direct harm. We must avoid turning this incident into a norm by blaming the new team for an honest mistake. Instead, we should focus on fixing the system.

  **Recommendation:**
  We propose adopting **Option 1 (Document and Enforce the Current Convention)** as an immediate step, with a plan to transition to **Option 2 (Explicit Updates)** in the long term.

  **Immediate Actions (Next 3 Months):**
  - Document the current convention in our engineering standards.
  - Update our API gateway or middleware to add validation: any PATCH request that omits a field without an explicit update mask (or similar) is accepted (meaning no change), but if a service receives a request that tries to clear by omission, it should return a 400 error with a clear message.
  - Communicate this standard to all teams and update client libraries and codegen to enforce it.

  **Long-term Plan (Next 12 Months):**
  - Form a working group to design a migration to explicit updates (Option 2). This may include:
    - Defining a standard update mechanism (e.g., JSON Merge Patch with `null`, or a custom update mask).
    - Creating a phased migration plan for services, starting with new services and gradually updating existing ones.
    - Providing tooling and support to minimize the burden on teams.

  **Why Not Option 3?**
  While Option 3 respects team autonomy, it would create a fragmented and error-prone environment. The registry would become a single point of failure and add overhead for every client. We believe consistency is crucial for reliability.

  **Accountability for the Incident:**
  The new team acted in good faith based on their prior experience. Since our convention was not documented, it is unreasonable to hold them solely accountable. We recommend:
  - Closing the postmortem without assigning individual blame.
  - Using the incident as a case study in the importance of documentation and validation.
  - Encouraging a culture where teams proactively seek and document conventions.

  **Conclusion:**
  By adopting Option 1 and planning for Option 2, we address immediate risks while moving toward a more robust standard. This approach balances practicality with long-term correctness. We will discuss this proposal in Thursday's meeting and welcome your feedback.

  ---

  This memo provides a clear recommendation, acknowledges the merits of other options, and addresses the blame issue fairly. It also uses the philosophical insights to frame the incident without being overly academic.
answer: |-
  ### Memo: Standardizing PATCH Semantics for Internal HTTP APIs  
  **To:** Engineering Standards Council  
  **From:** [Your Name], Backend Engineer  
  **Date:** [Current Date]  
  **Subject:** Resolution Proposal for PATCH Convention Incident & Path Forward  

  ---

  ### **Context**  
  For six years, our internal HTTP APIs operated under an unwritten convention: **omitting an optional field in a PATCH request means "do not change it."** This behavior is embedded in client libraries, codegen templates, mock servers, test fixtures, and ~40 services. It was learned through trial and error (often by breaking things), but never formally documented.  

  Last month, a team from [Acquired Company] implemented a conflicting interpretation: **omission = "clear this value."** This caused a customer configuration wipe (non-critical, but impactful). A postmortem occurred, and debates about accountability arose. We must now formalize rules to prevent recurrence.  

  ---

  ### **Options Analysis**  
  We’ve debated three paths. Each has tradeoffs:  

  #### **Option 1: Keep & Formalize Current Convention**  
  - **Mechanics:**  
    - Omission = "keep."  
    - Clearing requires explicit action (e.g., `null` or an `update_mask` field).  
    - Add validation to reject ambiguous requests.  
  - **Pros:**  
    - Low immediate cost (documentation + validation layer).  
    - Aligns with existing systems (40 services, tooling).  
  - **Cons:**  
    - Retains "silence as decision," which some argue is inherently risky.  

  #### **Option 2: Migrate to Explicit Updates**  
  - **Mechanics:**  
    - Omission is invalid. All fields must be explicitly specified (e.g., `update_mask` required).  
    - No defaults; requests must declare intent for every field.  
  - **Pros:**  
    - Eliminates ambiguity.  
    - Matches modern best practices (e.g., cloud APIs like Google’s).  
  - **Cons:**  
    - High migration cost (40 services, clients, tests).  
    - Risk of inconsistencies during transition.  

  #### **Option 3: Registry of Team-Specific Rules**  
  - **Mechanics:**  
    - Teams choose their own convention per endpoint.  
    - Maintain a central registry (e.g., API docs with a `PATCH_semantics` flag).  
  - **Pros:**  
    - Accommodates legacy and new services.  
  - **Cons:**  
    - Fragmented developer experience.  
    - High cognitive overhead (check registry before every PATCH call).  
    - Long-term maintenance burden.  

  ---

  ### **Recommendation: Option 1 (Short-Term) + Option 2 (Long-Term)**  
  **Immediate Action (Next 3 Months):**  
  1. **Formalize & Enforce Current Convention (Option 1):**  
     - Document the rule: "Omitted fields = no change. Clearing requires `null` or `update_mask`."  
     - Add mandatory request validation (reject non-explicit clears).  
     - Update client libraries/codegen to enforce this.  

  2. **Mitigate Risks:**  
     - Audit services for compliance; provide migration scripts for non-compliant ones.  
     - Add automated tests checking for "clear-by-omission" misuse.  

  **Long-Term Goal (12-18 Months):**  
  - **Migrate to Explicit Updates (Option 2):**  
    - Phase 1: New APIs use explicit updates only.  
    - Phase 2: Gradual refactoring of legacy services (prioritize high-risk endpoints).  
    - Provide incentives (e.g., engineering milestones) for early adopters.  

  #### **Why This Approach?**  
  - **Practicality:**  
    - Option 1 prevents immediate fires while we tackle Option 2’s heavy lift.  
    - Validations act as guardrails during transition.  
  - **Philosophical Fit:**  
    Our convention *is* a **David Lewis-style convention**:  
    - **Regularity:** Followed for 6 years.  
    - **Arbitrariness:** Either rule (omit=keep vs. omit=clear) could have worked.  
    - **Expectations:** Everyone expected others to follow it; tools enforced it.  
    - **Coordination Failure:** The incident was a *mismatch*, not malice.  
  - **Focal Point for Change:**  
    - Option 2 uses the **wider ecosystem** (explicit updates in Google/Amazon APIs) as a "focal point" — a natural anchor for coordination. This aids adoption.  
    - *QWERTY analogy:* Unlike QWERTY, our convention isn’t entrenched by network effects. A cleaner standard (Option 2) *can* win if tooling supports it.  

  #### **Why Not Option 3?**  
  Option 3’s flexibility is seductive but creates **two critical issues**:  
  1. **Tribal Knowledge:** Developers must now consult a registry before basic requests.  
  2. **Seams Multiply Risk:** More conventions = more mismatch opportunities. The registry becomes a single point of failure.  
  It solves for fairness but not safety.  

  ---

  ### **Accountability & the "Blame Question"**  
  - **The New Team:**  
    - **They should not be penalized.** Per Lewis, conventions require common knowledge to be binding. Ours was unwritten and not socialized with new members.  
    - **Action:** Close the postmortem without disciplinary records. Instead:  
      - Share the incident as a **case study** in onboarding.  
      - Task the new team with implementing validation fixes (turning mistake into ownership).  
  - **The Broader Lesson:**  
    - **Norms vs. Conventions:**  
      - A *convention* fails when expectations mismatch (you get burned).  
      - A *norm* fails when you’re blamed independent of outcomes.  
    - **We risk creating a norm** if we punish this team. This harms psychological safety and ignores systemic gaps (lack of documentation).  

  ---

  ### **Next Steps**  
  1. **Thursday’s Agenda:**  
     - Vote on short-term/long-term roadmap.  
     - Refine migration timelines.  
  2. **Pre-Meeting Prep:**  
     - Review draft documentation for Option 1 validation rules.  
     - Audit service readiness for Option 2 (volunteers needed).  

  This balances pragmatism with principle. Option 1 stops the bleeding; Option 2 builds a safer future. The new team’s incident was a systems failure — one we resolve by fixing the system, not the people.  

  —  
  **Appendices:**  
  - [Draft] PATCH Convention Documentation  
  - [Outline] Phase 1 Validation Implementation  
  - [Resource] David Lewis, *Convention: A Philosophical Study* (Ch. 1 summary)
