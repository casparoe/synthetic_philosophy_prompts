     Therefore, we must have a step for discrepancy investigation.

   Step 5: Discrepancy Check and Resolution
     If the three inputs are not in rough agreement (we define rough agreement as all pairwise ratios within a factor of 10) and at least two are reliable, then we must pause the procedure and require further analysis. The output of this step is either:
