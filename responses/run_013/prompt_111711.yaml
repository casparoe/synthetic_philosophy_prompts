  ### Procedure for Producing Failure Rate Estimate

  1. **Assess Claims History**  
     **Question:** What is the reference class, total machine-hours, and number of failures?  
     **Sufficient Answer:**  
     - Reference class explicitly defined (machine model, operating conditions, time period).  
     - Machine-hours ≥ 10,000 and ≥1 failure (or machine-hours ≥ 100,000 for zero failures).  
     - Class deemed representative (no material changes to machine, maintenance, or environment).  
     **Audit Note:** Reference class definition, total hours, failures, calculated rate (failures/hours × 1000), and rationale for representativeness.  
     **Stop If:** Class unrepresentative (e.g., different conditions, immature data) or too sparse (e.g., zero failures with <100,000 hours). Label: **Unreliable-C**.  

  2. **Assess Engineering Elicitation**  
     **Question:** What is the elicited rate, number of engineers, and their basis?  
     **Sufficient Answer:**  
     - ≥3 independent engineers with domain experience.  
     - Coefficient of variation (CV) of estimates ≤1 (i.e., no wild disagreement).  
     - Elicitation protocol documented (e.g., structured interview, anonymized input).  
     **Audit Note:** Engineer qualifications, individual estimates, derived point estimate (mean), CV, and elicitation method.  
     **Stop If:** <3 engineers, CV >1, or non-independent input. Label: **Unreliable-E**.  

  3. **Assess Physics Model**  
     **Question:** What is the predicted rate, model assumptions, and validation status?  
     **Sufficient Answer:**  
     - Model validated for similar machines/conditions.  
     - Assumptions match policy conditions (e.g., load, environment).  
     - Extrapolation to new conditions justified via first principles.  
     **Audit Note:** Model name, assumptions, validation evidence, predicted rate, and gaps between model and real-world conditions.  
     **Stop If:** Model unvalidated, assumptions violated, or extrapolation unjustified. Label: **Unreliable-P**.  

  4. **Reconcile Inputs**  
     - **If Claims reliable AND (E or P reliable AND within 10× of Claims):** Use **Claims**.  
     - **If Claims unreliable:**  
       - If E and P reliable AND within 10× of each other: Use **weighted geometric mean** (weights: P=0.6 if validated, E=0.4 if CV≤0.5; else equal weights).  
       - If only one reliable: Use that input (**Elicitation** or **Physics**).  
       - If none reliable: **Undefined**.  
     - **If Claims reliable but E/P >10× discrepancy:** Investigate cause (e.g., model flaw, class misdefinition). If unresolved in time, **Undefined**.  
     **Audit Note:** Reliability status of each input, discrepancy investigation summary, and combination logic.  

  5. **Assign Reference Class**  
     - **Claims:** Stated reference class from Step 1.  
     - **Elicitation:** "Machines under conditions experienced by consulting engineers."  
     - **Physics:** "Machines under physics model assumptions."  
     - **Weighted:** "Machines under combined physics model and engineering judgment conditions."  

  **Labels for Verdict:**  
  - **Claims:** Solely claims-based.  
  - **Physics:** Solely physics-based.  
  - **Elicitation:** Solely elicitation-based.  
  - **Weighted:** Weighted combination of E and P.  
  - **Undefined:** No defensible estimate.  

  ---

  ### Worked Files

  #### File 1: Mature Pump Model  
  - **Claims:** 40,000 hours, 3 failures → Rate = (3/40,000) × 1000 = **0.075** per k-hr.  
    Class: "Pump Model X in standard industrial service, 2018–2023." Representative (no changes). → **Reliable**.  
  - **Elicitation:** 5 engineers, estimates: [0.04, 0.06] → Mean = **0.05**, CV = 0.2 (low). → **Reliable**.  
  - **Physics:** Rate = **0.00075** (assumes perfect maintenance). Unreliable (assumptions violated; real-world maintenance imperfect).  
  - **Reconciliation:** Claims reliable. Elicitation reliable and within 10× (0.05 vs. 0.075). Physics unreliable. Use **Claims**.  
  - **Verdict: Claims — 0.075 per k-hr, reference class as documented.**  
  - **Audit Note:**  
    Claims: 40k hours, 3 failures, class representative. Elicitation: 5 engineers, CV=0.2, supports claims rate. Physics: Unreliable (assumption gap). No unresolved discrepancies.  
  - **Judgment Steps:** Reliability assessments (e.g., physics deemed unreliable due to assumption violation).  

  ---

  #### File 2: Newly Designed Bearing  
  - **Claims:** 5,000 hours, 0 failures. Sparse (hours <100,000 for zero failures). → **Unreliable-C**.  
  - **Elicitation:** 4 engineers, estimates: [0.004, 0.006] → Mean = **0.005**, CV = 0.15 (low). → **Reliable**.  
  - **Physics:** Rate = **0.01** (validated for similar bearings). Assumptions match policy. → **Reliable**.  
  - **Reconciliation:** Claims unreliable. E and P reliable and within 10× (0.005 vs. 0.01 → ratio=2). Weighted geometric mean:  
    `Rate = exp(0.6 × ln(0.01) + 0.4 × ln(0.005)) = exp(-4.882) = 0.0076` → **0.008 per k-hr** (rounded).  
  - **Verdict: Weighted — 0.008 per k-hr, reference class combines physics and elicitation conditions.**  
  - **Audit Note:**  
    Claims: Unreliable (sparse data). Elicitation: 4 engineers, CV=0.15. Physics: Validated model. Weighted 60%/40% (P/E) due to physics validation strength.  
  - **Judgment Steps:** Weight assignment (60% physics due to validation).  

  ---

  #### File 3: Unencountered Operating Condition  
  - **Claims:** Zero data (condition never encountered). → **Unreliable-C**.  
  - **Elicitation:** 6 engineers, estimates: [0.001, 0.1] → Mean = 0.05, **CV = 1.2** (high). → **Unreliable-E** (CV >1).  
  - **Physics:** Rate = **0.0001** (based on first principles; validated for similar mechanisms). Extrapolation justified. → **Reliable**.  
  - **Reconciliation:** Claims and elicitation unreliable. Only physics reliable. Use **Physics**.  
  - **Verdict: Physics — 0.0001 per k-hr, reference class per physics model assumptions.**  
  - **Audit Note:**  
    Claims: Unreliable (no data). Elicitation: Unreliable (high disagreement). Physics: Extrapolation validated via first principles.  
  - **Judgment Steps:** Physics extrapolation deemed reasonable (model captures mechanism despite unencountered condition).  
  - **Unwanted Truth:** Using unvalidated extrapolation is defensible only when no alternatives exist. Regulator may challenge; justification rests on physics rigor.  

  ---

  ### Bottom line: Prioritize claims data when reliable and representative; use weighted expert-physics synthesis for sparse data; reserve physics for last-resort extrapolation with documentation.
