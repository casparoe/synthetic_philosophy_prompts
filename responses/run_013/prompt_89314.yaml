prompt: |-
  I am a software engineer with no formal background in philosophy or cognitive science, and I would like to approach a claim in that literature the way I would approach writing a specification. Douglas Hofstadter and Emmanuel Sander argue that analogy-making is not a specialized faculty or a figure of speech but the basic engine of thought -- that perceiving, categorizing, remembering, and reasoning are all, at bottom, the making of analogies between situations. Suppose I take that seriously as a research programme. Before I look into any particular account, I want the specification: the list of what any adequate theory of analogy-making must deliver in order to be a theory of the core of cognition rather than of a peripheral trick.

  Write that list of requirements. For each requirement, give the consideration or case that motivates it, and indicate how binding it is -- which requirements are non-negotiable and which are preferences of a particular camp. I especially want to know whether some subset of the requirements is jointly unsatisfiable, because if it is, the list itself is the result. And tell me which single requirement does the most to rule out the popular ways of theorizing about analogy. The purpose is narrow: I want to be able to judge, for any account that is put in front of me, whether it is even in the running.

  Here are cases and observations I want the specification to be answerable to. I would rather have these handled properly than have more added.

  - Novices and experts asked to sort a set of physics problems group them differently: novices by surface features (pulleys, inclined planes, springs), experts by the underlying principle. The same stimulus is carved differently by different people, and the theory has to accommodate that.
  - Two analysts look at the same epidemic curve. One reads it as a contagion, the other as a speculative bubble. Both readings fit the data points, and they license different interventions. The theory must say whether there is a fact about which analogy is better, and on what grounds, or whether aptness is exhausted by fit-to-data plus usefulness.
  - Someone learning a second programming language keeps seeing the new language through the first. Sometimes this produces fast competence; sometimes it produces subtle bugs from assuming that the old language's conventions carry over. One mechanism has to account for both the productive and the misleading case.
  - Recognizing a letter in an unfamiliar typeface, or a friend in a crowd, feels immediate and not at all like a comparison -- yet on the claim it is one.
  - An analogy can be apt and still mislead: it fits the known cases, licenses a prediction, and the prediction turns out wrong. Aptness and truth have to come apart in the theory, or the theory has to explain why they do not.
  - Ordinary speech is saturated with analogy that no one experiences as reasoning -- a deadline creeps up, a market digests news, a rumour spreads. If analogy is the core of cognition, the theory cannot treat these as dead metaphors or decoration.
  - Some analogies organize an entire field for decades without anyone experiencing them as a deliberate comparison -- an economy treated as an ecosystem, a brain treated as a computer -- and they quietly constrain which questions get asked. Say whether a theory needs one mechanism for the momentary analogy and another for the long-lived one, or whether the same mechanism covers both.

  Additional constraints on the answer:

  - The theory must not presuppose the very thing it is meant to explain. In particular, accounts that begin with two situations already parsed into the right features and then specify a matching stage appear to assume that the representational work has been done in advance. Say whether that is a genuine defect, and what an account would have to do instead.
  - The theory must either respect the distinctions between analogy, metaphor, similarity judgment, and the retrieval of a past case, or argue that they are one thing.
  - The theory must say whether it is descriptive (how minds actually work) or also normative (when an analogy is good), and whether the two can be separated. The compelling but fallacious analogy in an advertisement is the case behind that.
  - The theory must explain why analogies are graded -- why some mappings feel forced and others click -- without positing a pre-given similarity metric, since a similarity metric would do the work that analogy is supposed to do.

  Do not give me a reading list, citations, or the names of specific works; I cannot look anything up, and I do not want to take your word for attributions. Reason from the requirements outward. The list of requirements is what I want, in as much detail as the cases will bear. If you want to close with a short pass showing which families of approach each requirement rules out, keep it brief and secondary to the criteria.
reasoning: |-
  Okay, the user is a software engineer who wants to approach Hofstadter and Sander's claim about analogy-making as the core of cognition by writing a specification. They want a list of requirements for any theory of analogy-making that could serve as the foundation of cognition, not just a peripheral mechanism. 

  First, I need to understand their background. They're coming from a software engineering perspective, so they're used to thinking in terms of specs: clear, testable requirements. They explicitly reject citations and want reasoning from first principles based on the cases they provided. That's crucial—no name-dropping, just pure problem analysis.

  Looking at their enumerated cases, they cover a wide range: expertise differences in problem-solving (physics novices vs experts), interpretive flexibility (epidemic curve as contagion vs bubble), transfer learning in programming (helpful vs harmful analogies), immediate perception (recognizing letters/friends), apt-but-false analogies, unconscious metaphors in language, and long-term conceptual frameworks. Each case reveals a different aspect of analogy that a core-cognition theory must explain.

  The additional constraints are equally important. The theory can't presuppose pre-parsed representations, must clarify relationships between analogy/metaphor/similarity, address descriptive vs normative aspects, and explain gradedness without circularity. These are deep challenges that immediately rule out many superficial approaches.

  Hmm... the key challenge is avoiding circularity while accounting for all cases. For example, if a theory starts with pre-defined features for analogy mapping, it dodges the hardest part—how those features were constituted through analogy in the first place. That's like a compiler assuming parsed syntax trees without explaining the lexer. 

  The perception cases are particularly thorny. When we instantly recognize a friend's face, it feels atomic—but if it's actually analogy-based, the theory must explain how this happens without conscious comparison. This pushes against traditional "retrieve-and-map" models. Similarly, dead metaphors ("deadline creeps up") being pervasive yet unconscious suggests analogy operates at subcognitive levels.

  For the normative aspect... the epidemic curve case is perfect. Both contagion and bubble analogies fit the data, but lead to different interventions. Can the theory itself judge which is "better," or is aptness purely pragmatic? And how does this relate to truth when analogies mispredict? Truth-aptness separation seems essential.

  Long-term frameworks (brain-as-computer) versus momentary mappings (programming language transfer) raise the scalability question. Is the same mechanism at work over different timescales? If not, the theory fragments; if yes, it must show continuity.

  I'll structure the requirements around these tensions. Non-negotiables will include representation bootstrapping (no pre-parsed features), scalability from perception to abstraction, and gradedness without presupposed metrics. The single most exclusionary requirement? Probably bootstrapping—it vaporizes most feature-based matching theories.

  The joint satisfiability problem lurks in combining representation-construction with immediacy. How can analogy both build concepts and operate fast enough for perception? Any theory that can't resolve this is dead on arrival. Also, reconciling descriptive mechanics with normative evaluation might be tricky—does "better analogy" emerge from the same process that generates it?

  For the software engineer, I'll emphasize testability: each requirement should be like an acceptance test for theories. The epidemic case tests normativity; the physics sorting tests representational plasticity; the programming transfer tests bidirectional outcomes. Pass/fail criteria will be explicit.

  Finally, I'll flag which requirements conflict. Bootstrapping vs. immediacy is the biggest tension. If a theory sacrifices one for the other, it fails either the perception case or the no-presupposition constraint. That's the crux where many approaches crumble.
answer: |-
  Here is a specification for a theory of analogy-making as the core engine of cognition, derived from your cases and constraints. Requirements are ranked by bindingness (Core, Strong, Desirable) and include the motivating case, binding justification, and potential conflicts.

  ---

  ### **Core Requirements (Non-Negotiable)**
  1.  **Representation Bootstrap (No Pre-Parsed Primitives)**
      *   **Motivation:** All cases (esp. physics novices/experts, letter/friend recognition, language transfer). A core process cannot assume pre-existing "correct" features/representations.
      *   **Binding:** Core. Violation means the theory presupposes the very cognition (feature parsing/categorization) it aims to explain. *The theory must explain how representations/salient features emerge dynamically from the analogical process itself, using current context and prior experience.*
      *   **Conflict Potential:** High conflict with immediacy (Req 4) and efficiency.

  2.  **Contextual Salience & Fluidity**
      *   **Motivation:** Physics problem sorting (same stimulus, different groupings), epidemic curve interpretation (same data, different readings).
      *   **Binding:** Core. The same input must be analogically carvable in multiple valid ways. *The theory must explain why and how specific aspects become salient/alignable based on context (current goals, recent experience, emotional state) and expertise.*
      *   **Conflict Potential:** Conflicts with notions of fixed similarity metrics or pre-defined ontological categories.

  3.  **Scalability: From Perception to Abstraction**
      *   **Motivation:** Letter/friend recognition (perceptual, immediate) vs. epidemic/economy frameworks (abstract, long-term). Ordinary language metaphors ("deadline creeps").
      *   **Binding:** Core. If analogy is the core engine, it must operate identically (or via parameterization of a single mechanism) across all levels. *The same fundamental process must underlie recognizing a face, understanding "digest news," and building a scientific paradigm. Differences are in timescale, stability, and abstraction level, not mechanism.*
      *   **Conflict Potential:** High. Mechanisms optimized for perception may struggle with abstraction, and vice-versa.

  4.  **Immediacy & Sub-Cognitive Operation**
      *   **Motivation:** Letter/friend recognition, ordinary language metaphors. Feels direct, not like deliberate comparison.
      *   **Binding:** Core. Pervasive, fundamental cognition cannot feel like slow, deliberate reasoning most of the time. *The theory must explain how analogical processing achieves "direct perception" speeds and operates below the level of conscious awareness for routine tasks.*
      *   **Conflict Potential:** High conflict with Bootstrapping (Req 1) – building representations on the fly seems slow vs. immediacy. Also conflicts with explicit mapping theories.

  5.  **Bidirectional Outcomes: Productivity & Misleadingness**
      *   **Motivation:** Programming language transfer (helps *and* hinders).
      *   **Binding:** Core. A core mechanism must explain both successful generalization/insight and failure/blind spots. *The theory must show how the *same process* that enables rapid learning/competence can also produce systematic errors when contextual salience or representational fluidity leads to inappropriate mappings.*
      *   **Conflict Potential:** Low. This is a key test of mechanism validity.

  ### **Strong Requirements (Highly Constraining)**
  6.  **Aptness-Truth Separation**
      *   **Motivation:** Apt but misleading analogy (fits data, licenses prediction, prediction fails).
      *   **Binding:** Strong. Aptness must be definable independently of ultimate truth to explain predictive failure and the epidemic curve case (both interpretations might be apt but mutually exclusive). *The theory must define "aptness" (likely involving fit, coherence, usefulness for current goals, prior success) separately from "truth" (external correspondence).*
      *   **Conflict Potential:** Conflicts with purely normative theories equating aptness with truth-likeness.

  7.  **Gradedness without Primitive Metric**
      *   **Motivation:** Analogies feel more or less forced, natural, or "clicking."
      *   **Binding:** Strong. A core process cannot rely on a pre-defined similarity metric, as that metric would itself need explanation. *The theory must explain the gradient of "goodness of fit" or "naturalness" as an *emergent property* of the analogical process (e.g., ease of mapping, coherence of emergent structure, lack of dissonance).*
      *   **Conflict Potential:** High. Ruling out primitive metrics is hard. Emergence must be clearly specified.

  8.  **Unification of Analogy, Metaphor, Similarity, Retrieval**
      *   **Motivation:** Ordinary language saturation, perception as analogy (Req 4), expert sorting (similarity judgment), programming transfer (retrieval). Hofstadter/Sander's core claim.
      *   **Binding:** Strong Preference (but core to their program). The theory *must either* provide a single mechanism explaining all these phenomena as manifestations of the same core process, *or* provide a compelling principled reason why distinct mechanisms are needed (undermining the "core engine" claim). *The default requirement is unification.*
      *   **Conflict Potential:** High. Differences between e.g., fleeting similarity and entrenched metaphor seem large.

  ### **Desirable Requirements (Clarifying/Pragmatic)**
  9.  **Descriptive-Normative Stance**
      *   **Motivation:** Epidemic curve case (is one analogy *better?*), compelling fallacies.
      *   **Binding:** Desirable. The theory *must* clearly state its stance: Purely descriptive? Purely normative? Or descriptive with emergent norms (e.g., aptness defined by cognitive efficiency/coherence)? *It must explain compelling-but-fallacious analogies within its framework.*
      *   **Conflict Potential:** Moderate if aiming for emergent norms.

  10. **Long-Term Entrenchment vs. Momentary Spark**
      *   **Motivation:** Economy-as-ecosystem (long-lived, constraining) vs. seeing a new face (momentary).
      *   **Binding:** Desirable. The theory *should* explain this spectrum through mechanisms like repetition, success reinforcement, integration into a wider conceptual web, and cognitive economy (reusing stable mappings). *Scalability (Req 3) implies this is a difference of degree, not kind.*
      *   **Conflict Potential:** Low if Scalability is satisfied.

  ---

  **Conflict Analysis & Key Excluder:**
  *   **Primary Conflict:** `Representation Bootstrap` (Req 1) vs. `Immediacy` (Req 4). Dynamically constructing representations contextually *feels* computationally expensive, yet core cognition (perception, understanding) is blazingly fast. A viable theory **must** resolve this tension. Proposing massively parallel statistical activation over a pre-existing substrate is common, but risks violating Bootstrapping if the substrate isn't itself analogically formed.
  *   **Most Exclusionary Requirement:** `Representation Bootstrap` (Req 1). This single requirement rules out the vast majority of classical AI and cognitive science models of analogy (e.g., Structure-Mapping Engine - SME, many case-based reasoning - CBR approaches). These typically start with two *already parsed* situations represented in a structured format (predicates, relations, objects) and focus on the mapping/retrieval stage. They presuppose the representational work done by other (unexplained) cognitive processes.

  **Ruling Out Families of Approaches (Briefly):**
  1.  **Feature-Matching/Similarity-Metric Approaches:** Ruled out by `Gradedness without Primitive Metric` (Req 7) and `Representation Bootstrap` (Req 1). They assume pre-defined features/metrics.
  2.  **Classical Structural Mapping (e.g., SME-like):** Primarily ruled out by `Representation Bootstrap` (Req 1 - presupposes parsed structures), potentially by `Immediacy` (Req 4 - often computationally intensive), and `Unification` (Req 8 - focuses on high-level analogy).
  3.  **Pure Retrieval Models (Simple CBR):** Ruled out by `Representation Bootstrap` (Req 1 - cases stored with fixed features?), `Bidirectional Outcomes` (Req 5 - often assumes retrieval implies correctness), `Scalability` (Req 3 - retrieval usually for problem-solving, not perception), and `Immediacy` (Req 4).
  4.  **Formal Logic-Based Approaches:** Ruled out by `Representation Bootstrap` (Req 1), `Contextual Salience` (Req 2), `Immediacy` (Req 4), and `Gradedness` (Req 7).
  5.  **Associationist/Connectionist Models:** *Potentially* viable on `Immediacy` (Req 4) and `Gradedness` (Req 7). Face challenges with `Representation Bootstrap` (how symbols/concepts truly emerge?), `Scalability` to high abstraction (Req 3), and providing a clear account of `Aptness` (Req 6) or `Unification` (Req 8). Often lack sufficient structure for complex analogy.
  6.  **Bayesian Models:** *Potentially* viable on `Contextual Salience` (Req 2 - priors), `Gradedness` (Req 7 - probabilities), `Aptness-Truth Separation` (Req 6 - high likelihood vs. truth). Struggle severely with `Representation Bootstrap` (Req 1 - hypothesis space origin?) and `Immediacy` (Req 4 - computation).

  This specification defines a high bar. Any theory satisfying the Core and Strong requirements, particularly resolving the Bootstrap-Immediacy conflict, is a serious contender for Hofstadter and Sander's core claim. Theories failing `Representation Bootstrap` are fundamentally inadequate for the "core engine" role, regardless of other merits.
