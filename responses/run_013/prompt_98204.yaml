prompt: |-
  I am a political theory PhD student, and in three weeks I give a job talk defending a reading of Simone Weil's late case against political parties: that it is not Rousseauian nostalgia for face-to-face democracy, nor a general suspicion of organized action, but a claim about a specific cognitive mechanism — that the party form substitutes the manufacture of collective belief for attention to the afflicted — and that her remedy is therefore not the abolition of organization but associations that disband once their task is done. My audience will be mostly democratic theorists who work on parties and representation, plus two empirical scholars of party organization and one historian of twentieth-century French thought; nobody there reads Weil for a living, but several will think they already know what she says.

  Build me the Q&A prep sheet as exactly five numbered items, no introduction and no conclusion, each a sentence or two: the objection phrased the way this audience would actually phrase it, my reply, and a note on where that reply is soft. Order the items by how much damage they would do, mark which objections turn on a genuinely contested reading of Weil rather than on anything settled about her texts, and do not let me mistake a contestable interpretation of her for the consensus. Include the one I am hoping nobody asks.
