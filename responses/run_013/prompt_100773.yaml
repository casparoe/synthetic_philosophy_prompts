prompt: |-
  I run a small metaphysics reading group and we've just spent three weeks on the special composition question — you know, the one about when some things add up to a further thing. Everyone's sick of it and I've been volunteered to open next week's session with a joke about it. Can you give me exactly five numbered cracks at it, a sentence or two each, no intro and no summing-up at the end? They need to actually land for people who know the terrain — van Inwagen's answer that composition happens only when the parts constitute a life, universalism saying any two things whatsoever compose something, nihilism saying nothing does — not just a generic bit about philosophers arguing whether tables exist, amirite. I'd like at least one to turn on the organicist line that there are no tables but there is a cat (or, say, no traffic jam but plenty of cars), and one on universalism's weird offspring, the object made of my kettle and the Moon or whatever. If a genuinely funny joke here is impossible, or if I'm muddling the views in a way that makes the request confused, just say so plainly instead of churning out five duds. British English please.
reasoning: |-
  Okay, the user runs a metaphysics reading group that's spent three weeks on the special composition question. They need exactly five jokes to open the next session, tailored for people familiar with van Inwagen's organicism, universalism, and nihilism. 

  The jokes must land specifically for this audience—no generic "philosophers debating tables" humor. Key requirements: one joke contrasting organicism's cats/tables distinction, and one on universalism's absurd composites (kettle + moon). 

