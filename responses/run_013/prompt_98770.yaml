prompt: |-
  I am assembling a teaching anthology on epistemic injustice, and I need help deciding which candidate cases belong in the central chapter and which belong at the periphery. Please rate each case below on a 0–100 scale for how squarely it falls under the concept of epistemic injustice as that concept is standardly understood in analytic epistemology (100 = a paradigm instance; 0 = not an instance of the concept at all). Then arrange the cases into three or four ordered tiers, from most to least central. For each case, supply one or two sentences identifying the specific feature that does or does not make it an instance of the concept, and flag any case whose placement you take to be genuinely contestable rather than a matter of clear judgment. Where it bears on your rating, say explicitly whether the case requires a culpable agent or can be counted as a purely structural wrong.

  The cases:

  1. A pain specialist repeatedly discounts a Black woman's reports of chronic pain, treating her as a drug-seeker, and she goes years without adequate treatment.

  2. Before a term for the phenomenon existed, women in a workplace had no shared vocabulary for a set of experiences that were nonetheless systematically damaging to them.

  3. A jury gives more weight to a confident, fluent witness than to a hesitant one who is equally reliable.

  4. A patient cannot afford the subscription to the journal in which the trial results relevant to her condition are published.

  5. A man persistently undermines his partner's confidence in her own memory of events, until she comes to doubt her grasp of what actually happened.

  6. A speech-recognition system performs markedly worse on the accents of a minority group, so that the requests of those users are frequently misconstrued by the institutions that deploy the system.

  7. A student is marked down on an essay for using a grammatical construction that is standard in her home dialect.

  8. A hiring committee passes over a candidate after a referee describes her, in what is meant as praise, as "surprisingly articulate."

  9. A researcher's findings are ignored by her field until a more senior colleague publishes substantially the same results and receives the credit.

  10. A speaker's testimony is accepted almost without scrutiny, and with more weight than the evidence warrants, because she belongs to a dominant group.
reasoning: |-
  Okay, the user is compiling a teaching anthology on epistemic injustice and needs help categorizing different cases based on how central they are to the concept. They've provided ten cases and want each rated on a 0-100 scale, organized into tiers, with brief explanations about why each case does or doesn't fit the standard understanding of epistemic injustice. They also want to know if culpable agents are required or if structural wrongs count, and want any contestable placements flagged.

  Epistemic injustice, as defined by Miranda Fricker, centers on wrongful harms to someone as a knower, primarily through testimonial injustice (prejudicial credibility deficit) and hermeneutical injustice (lack of collective interpretive resources). I need to evaluate each case against these core concepts.

  Let me go through each case systematically. Case 1 involves a Black woman's pain reports being discounted due to racial and gender prejudice. This directly matches testimonial injustice - credibility deficit based on identity prejudice. Definitely a paradigm case. Case 2 describes women lacking vocabulary for shared experiences before concepts like "sexual harassment" existed. That's classic hermeneutical injustice - structural exclusion from meaning-making. Also core.

  Case 3 shows a jury favoring a confident witness over an equally reliable hesitant one. While concerning, this seems more about cognitive bias than identity prejudice. Credibility is affected by presentation, but not necessarily due to systemic identity prejudice. This is peripheral at best. Case 4 involves a patient unable to access medical journals due to cost. This is an access issue, but not directly about credibility or hermeneutical marginalization - more about economic barriers to knowledge.

  Case 5 features gaslighting where a man undermines his partner's confidence in her memory. While harmful, this appears interpersonal rather than identity-based. Without evidence of systemic prejudice, it doesn't clearly fit Fricker's framework. Case 6 has speech-recognition systems performing poorly on minority accents. This is interesting - it's structural, technology-mediated credibility deficit affecting marginalized groups. Feels like a modern extension of testimonial injustice.

  Case 7 shows a student penalized for using home dialect grammar. This explicitly connects to linguistic prejudice and credibility deficit in educational settings - clear testimonial injustice. Case 8 has "surprisingly articulate" as backhanded praise, implying low expectations based on identity - another clear credibility deficit case.

  Case 9 involves a researcher being ignored until a senior colleague publishes similar work. This could be testimonial injustice if based on identity prejudice, but might also reflect academic hierarchy issues. Potentially contestable depending on context. Case 10 describes testimony accepted uncritically due to dominant group membership - the flip side of testimonial injustice (credibility excess), which Fricker also discusses.

  For organization, I'll create four tiers: Core Paradigms (cases directly matching definitions), Strong Candidates (close fits with minor nuances), Borderline/Peripheral (weak or contested connections), and Non-Cases (clearly outside scope). I'll flag contestable cases like 9 where context matters, and note where structural factors alone suffice (cases 1,2,6) versus needing culpable agents.

  The user seems deeply familiar with the material but wants validation on categorization - probably ensuring their anthology teaches conceptual boundaries effectively. They might also appreciate seeing how contemporary issues (like AI bias in case 6) extend classic frameworks. I'll emphasize structural aspects since they asked about culpability versus structural wrongs explicitly.
answer: |-
  Based on the standard conception of epistemic injustice (EI) in analytic epistemology, primarily drawing from Miranda Fricker's framework focusing on **testimonial injustice** (prejudicial credibility deficit) and **hermeneutical injustice** (structural exclusion from meaning-making resources), here is the analysis and tiered categorization. **Structural wrongs are sufficient for EI; individual culpability is not required.**

  ### Tier 1: Core Paradigms (90-100)
  These cases directly embody Fricker's core types of EI, featuring clear identity-prejudicial credibility deficits or structural hermeneutical marginalization.

  1.  **Rating: 100**  
      *Reason:* Paradigmatic testimonial injustice. Systematic credibility deficit based on racial and gender prejudice, causing significant harm (denial of care). Structural prejudice suffices; no individual culpability needed.  
  2.  **Rating: 95**  
      *Reason:* Classic hermeneutical injustice. Structural lack of shared interpretive resources due to group marginalization, preventing understanding/articulation of harmful experiences.  
  7.  **Rating: 95**  
      *Reason:* Testimonial/hermeneutical hybrid. Credibility deficit (lower grade) based on linguistic prejudice tied to social identity (dialect). Also reflects hermeneutical marginalization of non-standard linguistic knowledge.  
  8.  **Rating: 90**  
      *Reason:* Clear testimonial injustice. "Surprisingly articulate" implies low baseline credibility expectations due to identity prejudice (likely race/gender), a credibility deficit rooted in stereotype.  
  10. **Rating: 90**  
      *Reason:* Testimonial injustice (credibility *excess*). Uncritical acceptance of testimony due to identity-based prejudice (favoring the dominant group), distorting epistemic practices.  

  ### Tier 2: Strong Candidates (70-85)
  These cases clearly involve EI but may have nuances (e.g., primary mechanism, proximity to core definitions) or represent extensions of the core concepts.

  6.  **Rating: 85**  
      *Reason:* Structural testimonial injustice. Technology-mediated credibility deficit systematically disadvantaging a marginalized group due to accent bias. Embodies structural prejudice without needing culpable designers. (*Contestable:* Some may argue it's "merely" technical failure, but bias in training data/system design reflects societal prejudice).  
  3.  **Rating: 75**  
      *Reason:* Testimonial injustice *if* fluency/hesitancy bias maps onto identity prejudice (e.g., associating confidence with dominant groups or hesitancy with marginalized ones). Harm is clear. (*Contestable:* Without explicit identity link, it may be seen as a general cognitive bias, not strictly EI).  
  9.  **Rating: 70**  
      *Reason:* Testimonial injustice *if* the initial dismissal stems from identity-based prejudice (e.g., gender, race, junior status bias). Harm (loss of credit) is epistemic. (*Contestable:* If due solely to seniority/network bias without identity prejudice, it may be unfair but not strictly EI).  

  ### Tier 3: Peripheral/Weak or Non-Cases (0-50)
  These cases involve epistemic harm or injustice but lack the core element of *identity-prejudicial credibility deficit* or *structural hermeneutical marginalization* defining EI. They represent related issues (epistemic wrongs, distributive injustice) but not EI itself.

  5.  **Rating: 40**  
      *Reason:* Resembles gaslighting, causing epistemic harm (undermined self-trust). However, without a clear link to *social identity prejudice* (e.g., sexism, if present, would make it EI), it's primarily an interpersonal epistemic wrong, not EI. (*Contestable:* If systemic gender dynamics drive the pattern, it could shift to testimonial injustice).  
  4.  **Rating: 20**  
      *Reason:* Represents a *distributive* epistemic injustice (unfair access to knowledge goods due to socioeconomic status), not Fricker's core focus on credibility or hermeneutical resources tied to *identity-based prejudice*. A vital issue, but conceptually distinct.  
  3.  *(See Tier 2 - Rating 75):* While rated 75 in Tier 2 due to potential identity link, its placement there is *highly contestable*. If no identity prejudice is involved, it drops to **Rating: 10**.  
      *Reason (if no identity link):* Reflects a general cognitive bias (fluency heuristic) affecting credibility assessment. While an epistemic error causing harm, it lacks the *identity-prejudice* necessary for testimonial injustice.

  ## Summary of Tiers & Key Features

  *   **Tier 1 (Core Paradigms):** Cases 1, 2, 7, 8, 10. Directly exemplify testimonial injustice (credibility deficit/excess based on identity prejudice) or hermeneutical injustice (structural lack of interpretive resources due to marginalization).
  *   **Tier 2 (Strong Candidates):** Cases 6, 3 (if identity-linked), 9 (if identity-linked). Clear EI involving structural prejudice (Case 6) or strong potential EI where identity prejudice is the plausible mechanism (Cases 3 & 9). Placements for 3 and 9 are **genuinely contestable**.
  *   **Tier 3 (Peripheral/Non-Cases):** Cases 5 (without identity link), 4, 3 (without identity link). Involve epistemic harms or wrongs but lack the defining element of *identity-prejudicial* credibility deficit or hermeneutical marginalization. Case 5's placement is **contestable** if systemic identity prejudice is foregrounded.

  **On Culpability vs. Structure:** Cases 1, 2, 6, 7, 8, and 10 are clear examples where **structural prejudice is sufficient**; no individual culpability is required for them to count as EI. Cases 3, 5, and 9 become EI only if structural/identity prejudice is operative. Case 4 is structural but not identity-prejudicial in the relevant sense.
