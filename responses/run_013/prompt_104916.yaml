          a. Instructor announces the round and the options (A and B) and the delivery time for B. Also, announces any delayed rewards due this round (e.g., "If you chose B in round [n-3], you get 3 tokens now").
          b. Students record any delayed rewards due in the "Tokens from past delayed" column and add to their running total.
          c. Students fill the card for the current round (the two questions) and then make their choice (A or B). 
          d. If they choose A, they add 1 token to the "Tokens this round (immediate)" and then to their running total.
          e. Then, they have the option to lock any future round(s). For each lock, they pay 1 token (so they subtract 1 from their running total) and record the lock and the payment.
          f. They update their running total.

     - We need to move quickly. We can use a timer for 3 minutes per round.

  2. After round 12, tally the tokens (5 minutes). Students report their total tokens. Instructor makes a leaderboard.

  3. Debrief (20 minutes)

  Debrief Questions:

  - "Look back at your cards. Were there rounds where you said that Option B was better (all things considered) but you chose Option A? Why did that happen?" 
  - "Were there rounds where what you wanted changed from what you thought was better?"
  - "Did anyone use the lock? Why? How did it feel to lock? Did it work as intended?"
  - "Now, let's talk about two concepts: 
     1. Preference reversal: Sometimes, as an option gets closer in time, we want it more. That might explain why in some rounds you chose differently than you had planned earlier. 
     2. Akrasia (weakness of will): This is when you judge that one option is better (all things considered) but you choose the other because you want it more at that moment. 
     In the game, when you chose A even though you thought B was better, that was akrasia. When your preference (what you wanted) changed over time, that was preference reversal. 
     Hyperbolic discounting is a model of preference reversal: it says that we discount future rewards more heavily when they are near. But note: hyperbolic discounting doesn't necessarily explain akrasia, because if your preference changes, then you are just acting on your current preference. Akrasia requires a conflict between your current preference and your judgment of what is best overall."
  - "Now, the lock: it is a way to bind your future self. In game theory, we can model each time-slice of you as a different player. Without locks, your future self might defect (choose A). By locking, you force your future self to choose B. But note: the lock costs you something now. So it's a bargaining between your current self and future selves. Does this dissolve akrasia? Or just relocate it? (Because now your current self is forcing the future self, but the future self might resent it and would have chosen differently if free.)"

  What predictably goes wrong:

  1. Leaderboard gaming: Students might collude or make choices to maximize tokens without regard to the experience. 
     - Mitigation: Stress that the goal is to experience the decision process. The leaderboard is secondary.

  2. "I just changed my mind" denials: Some students might not see their choice as akrasia, but as a rational change of mind. 
     - Mitigation: In the debrief, ask them to look at the cards where they marked B as better but chose A. Ask why they marked B as better? If they still think it was better, then it's akrasia. If they now think A was better, that might be a change of mind.

  3. Nobody buying locks: If the lock cost is too high, or if they don't feel the temptation, they might not use locks. 
     - Mitigation: In the introduction, hint that they might change their mind in the future and regret it. Also, the lock is insurance. Or adjust the lock cost to 0.5? But we are using integers. Alternatively, make the lock cost 0? But then it's too easy. Or reduce the immediate reward to 0? That's not good. Alternatively, have a trial run or example.

  4. Complexity in tracking: Students might get confused with the token accounting.
     - Mitigation: Have a sample worksheet filled out for two rounds. Or do the first two rounds together.

  5. Time: 12 rounds at 3 minutes each is 36 minutes, but might run over.
     - Mitigation: Be strict on time. Or reduce to 10 rounds.

  What the activity can't reproduce:

  - The first-person felt tug of "I know this is worse and I'm doing it anyway". The tokens are not real, and the stakes are low. So the emotional experience might be missing. 
    - You'll have to tell them: "In real life, with higher stakes and emotions, the conflict is more visceral. The game is a model."

  Final Schedule and Lock Rules:

  Rounds 1-9:
    Option A: 1 token now (current round)
    Option B: 3 tokens at (current round + 3)

  Rounds 10 and 11:
    Option A: 1 token now
    Option B: 3 tokens at round 12

  Round 12:
    Option A: 1 token now
    (No Option B, because no future round)

  Lock Rules:
  - In any round, a student can lock any future round (that hasn't occurred) by paying 1 token (deducted immediately).
  - When a locked round arrives, the student must choose B in that round.

  Worksheet Example:

  Round 1:
    Which is better? [ ] A [ ] B
    Which do I want? [ ] A [ ] B
    Choice: [ ] A [ ] B
    Tokens this round:
        Immediate: if A, 1; else 0 -> ____
        From past delayed: 0 (since no prior B choices are due) -> ____
    Lock payment: if they locked any rounds, number of locks: ____ (cost: number of locks * 1) -> ____
    Total tokens this round: (immediate + past delayed) - lock payment = ____
    Running total: ____ (previous total + total tokens this round)

  Round 4:
    Tokens from past delayed: 3 if they chose B in round1, else 0 -> ____
    ... rest same.

  Debrief Outline:

  1. Ask students to find rounds where they had a conflict between "better" and "want". 
  2. Ask if anyone had a round where they thought B was better but chose A. Why? 
  3. Ask if anyone used locks? Why? 
  4. Introduce the terms: 
     - Hyperbolic discounting: the tendency for people to increasingly choose a smaller-sooner reward over a larger-later reward as the delay until the smaller reward decreases.
     - Akrasia: acting against one's better judgment.
  5. Discuss: 
     - "When you chose the immediate reward even though you thought the delayed was better, was that akrasia? Or had your judgment of 'better' changed by the time you chose?"
     - "How does the lock relate to Ulysses binding himself to the mast? Does it resolve the akrasia? Or is the akrasia still there (in the desire to not be locked) but overridden?"
     - "If we think of each round as a different 'self', then the lock is a way for an earlier self to control a later self. Does this mean akrasia is just a conflict between time-slices? Or is there a unified self that should be able to resist?"

  Final Note: The activity might not be perfect, but it should generate data for discussion. Adjust based on time and student engagement.
answer: |-
  Below is a comprehensive in-class game designed to help students experientially distinguish between genuine akrasia (acting against one's better judgment) and mere preference reversal (hyperbolic discounting). I've refined your initial idea for clarity, engagement, and pedagogical impact, including a detailed schedule, mechanics, and debrief. The game avoids technical terms until the reflection phase.

  ---

  ### **Game Title: "Time Token Trade-Off"**
  **Objective:** Accumulate tokens through choices between smaller-immediate and larger-delayed rewards. Students confront conflicts between judgment ("better") and desire ("want"), and use "locks" to pre-commit.

  #### **Materials Needed**
  - **Tokens**: Poker chips or printed cards (1 token = 1 point).
  - **Choice Cards**: Small slips for each round (template below).
  - **Leaderboard**: Whiteboard or digital spreadsheet to track totals.
  - **Student Worksheets**: To record choices, locks, and token totals.
  - **Timer**: For 90-minute session pacing.

  ---

  ### **Rules & Mechanics**
  **Setup**  
  - Each student starts with 10 tokens.  
  - 12 rounds (6 minutes each max), totaling 72 minutes.  
  - **Reward Schedule**: Fixed delays/sizes to induce reversals (see table below).  
  - **Lock Mechanic**:  
    - Spend 2 tokens **now** to "lock" a **future round** (e.g., lock Round 5 in Round 2).  
    - Locking forces choice of the delayed reward (B) in that round.  
    - Locked rounds cannot be changed.  

  **Per-Round Flow**  
  1. **Announce rewards**: Instructor reveals options for the round.  
  2. **Fill choice card**: Students privately answer:  
     - *Box 1 (Judgment)*: "Which is better, all things considered?" (A or B)  
     - *Box 2 (Desire)*: "Which do I most want right now?" (A or B)  
     - *Choice*: Select A (small now) or B (large later).  
  3. **Lock phase**: Students may spend tokens to lock future rounds (optional).  
  4. **Resolve rewards**:  
     - Choosing A: Gain small reward **immediately**.  
     - Choosing B: Gain large reward **at the scheduled future round** (e.g., choosing B in Round 3 delivers in Round 6).  
  5. **Update leaderboard** every 3 rounds.  

  ---

  ### **Reward Schedule**
  Designed to trigger preference reversals (e.g., B seems better when distant, but A feels urgent when close). Delays ensure choices "catch up" later.  
  | Round | Option A (Small Now) | Option B (Large Later) | Delay (Rounds) |  
  |-------|----------------------|------------------------|----------------|  
  | 1     | 1 token             | 3 tokens               | 3 (Round 4)    |  
  | 2     | 1 token             | 3 tokens               | 3 (Round 5)    |  
  | 3     | 1 token             | 3 tokens               | 3 (Round 6)    |  
  | 4     | 1 token             | 4 tokens               | 2 (Round 6)    |  
  | 5     | 1 token             | 4 tokens               | 2 (Round 7)    |  
  | 6     | 1 token             | 2 tokens               | 1 (Round 7)    |  
  | 7     | 1 token             | 5 tokens               | 4 (Round 11)   |  
  | 8     | 1 token             | 3 tokens               | 1 (Round 9)    |  
  | 9     | 2 tokens            | 5 tokens               | 2 (Round 11)   |  
  | 10    | 2 tokens            | 4 tokens               | 1 (Round 11)   |  
  | 11    | 3 tokens            | 6 tokens               | 3 (Round 14)*  |  
  | 12    | 3 tokens            | —                      | —              |  
  *Round 14 doesn’t exist—reward is forfeited if chosen (tests foresight).  

  **Why this schedule?**  
  - Early rounds (1–3): Distant rewards tempt patience (B seems better).  
  - Middle rounds (4–6): Short delays trigger impulsivity (A feels urgent).  
  - Late rounds (7–12): Mixed sizes/delays test consistency and lock use.  
  - Round 11’s undeliverable reward penalizes myopia.  

  ---

  ### **Timeline (90-Minute Session)**
  1. **Intro (5 min)**:  
     - Explain rules, rewards, locks, and the goal (maximize tokens).  
     - Emphasize: "Answer the two boxes truthfully—no ‘right’ answers."  
  2. **Rounds 1–12 (72 min)**:  
     - 6 min/round: Announce options (1 min) → Students fill cards/choose (2 min) → Lock phase (2 min) → Resolve rewards (1 min).  
     - **Critical Moment**: Pause after Round 6 to remind students of earlier choices (e.g., "In Round 1, most of you thought B was better. Check if you still agree now!").  
  3. **Final Tally (3 min)**: Sum tokens; announce leaderboard top 3.  
  4. **Debrief (10 min)**: Structured reflection (questions below).  

  ---

  ### **Choice Card Template**  
  Copy for each round:  
  ```  
  ROUND #___  
  OPTIONS:  
    A: [Small] token(s) NOW  
    B: [Large] token(s) in Round [X]  
  BOX 1 (Judgment): Which is BETTER?  ◻ A  ◻ B  
  BOX 2 (Desire): Which do I WANT?     ◻ A  ◻ B  
  MY CHOICE:   ◻ A  ◻ B  
  ```  

  ---

  ### **Debrief: Mapping the Phenomena**  
  **Phase 1: Surface Experiences (Avoiding Jargon)**  
  1. *Poll students*:  
     - "Raise your hand if, in at least one round, you thought B was *better* but chose A."  
     - "Who used a lock? Did it feel like a ‘trap’ or a ‘safety net’?"  
  2. *Small-group discussion* (3 min):  
     - "Describe a round where your ‘better’ and ‘want’ boxes *disagreed*. Why did you choose what you chose?"  

  **Phase 2: Introduce Concepts & Reframe**  
  1. **Preference Reversal vs. Akrasia**:  
     - *Preference reversal*: "When the *want* box flipped as the reward got closer (e.g., B felt better in Round 1, but A felt urgent in Round 4). Your ranking changed—no guilt, just shifting desires."  
     - *Akrasia*: "When you *knew* B was better (judgment box) but chose A anyway (e.g., ‘I know I’ll regret this’). That’s acting against your own best judgment."  
     - *Key distinction*: "Reversal is ‘I changed my mind.’ Akrasia is ‘I know this is wrong, but I’m doing it anyway.’"  
  2. **Locks as Intrapersonal Bargaining**:  
     - "Locks treat each ‘time-slice’ of you as a separate player. Your past self ‘bribed’ your future self (spending 2 tokens) to avoid akrasia. But did it *dissolve* the conflict or just *relocate* it? After all, your future self might resent being forced!"  
  3. **Hyperbolic Discounting Redux**:  
     - "Discounting models *describe* reversals (e.g., valuing $100 today over $110 tomorrow). But they don’t explain akrasia—if your preference flips, there’s no ‘better’ to violate! Akrasia requires a *stable judgment* you defy."  

  **Phase 3: Discuss Limitations**  
  - "This game can’t replicate the *visceral guilt* of real akrasia (e.g., eating cake while dieting). Tokens lack emotional stakes. But it *does* show how reversals tempt us to confuse ‘wanting’ with ‘judging.’"  

  ---

  ### **Predictable Problems & Fixes**  
  1. **"No one buys locks"**:  
     - *Why*: Locks cost tokens (short-term pain) for uncertain gain.  
     - *Fix*: After Round 4, say: "I’m noticing many of you regretted Round 4 choices. Locks can prevent that!" Show a mock-up: "Locking Round 6 now costs 2 tokens but could save you from losing 3 later."  
  2. **"I just changed my mind" denials**:  
     - *Why*: Students rationalize choices to avoid cognitive dissonance.  
     - *Fix*: Use choice cards as evidence: "If your ‘better’ box said B but you chose A, that’s not a reversal—it’s akrasia. Own it!"  
  3. **Gaming the leaderboard**:  
     - *Why*: Competitive students optimize tokens, not introspection.  
     - *Fix*: Stress: "This isn’t about winning—it’s about spotting patterns in your *own* choices. Leaderboard is fun, but reflection is the goal."  
  4. **Token confusion**:  
     - *Why*: Delayed rewards (e.g., choosing B in Round 3 pays in Round 6) get messy.  
     - *Fix*: Use student worksheets to track "pending rewards." Appoint 2 "token auditors" to help.  

  ---

  ### **What the Game Can’t Replicate**  
  - **The "tug" of akrasia**: Low stakes mean students won’t *feel* the anguish of "I know better but can’t resist." You’ll need to:  
    - **Tell them**: "Real akrasia involves shame or frustration (e.g., procrastinating while self-loathing). The game models the *structure* of the conflict—not the emotion."  
    - **Bridge the gap**: Ask: "When in real life did you experience that ‘tug’? How was it like Round 6 of the game?"  

  ---

  ### **Why This Works**  
  - Students generate both phenomena: Reversals emerge from the reward schedule; akrasia surfaces when "better" and "want" diverge.  
  - Locks make inter-temporal conflict tangible, setting up the "time-slice bargaining" discussion.  
  - The debrief forces distinction: Reversals aren’t akrasia unless judgment is stable and violated.  

  Run this once, and your students will never conflate discounting and weakness of will again!
