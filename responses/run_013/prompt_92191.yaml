answer: |-
  ### Diagnosis

  Your friend's argument attempts to resolve Wigner's puzzle (why mathematics is so effective in describing nature) by attributing it entirely to selection bias—we keep mathematical tools that work and discard those that don't. While steps 1–4 offer a plausible deflationary account of mathematics' applicability, the argument derails at **step 6** by conflating two distinct types of empirical success:  
  - **Success on selecting data** (used to choose/retain a theory).  
  - **Success on novel data** (genuine predictions not used in selection).  

  Selection effects (steps 2–5) rightly explain why success on *selecting data* isn't evidence of truth—it's circular. But step 6 incorrectly claims that success on *novel data* is equally non-evidential, arguing that "new data differ from old only in not yet having been used to select." This equivocates: novel predictions test a theory's *riskiness* and *explanatory scope* in ways that post-hoc fitting cannot. A theory that predicts unseen phenomena (e.g., general relativity predicting gravitational lensing) demonstrates robustness beyond mere accommodation of existing data. Such success *is* evidence of truth because it avoids the selection bias inherent in curve-fitting (e.g., high-degree polynomials). Step 7 then inherits this error, leading to the absurd conclusion in step 8.  

  The argument is **invalid** due to this misstep, not because a premise is false. Steps 1–5 and 8 are defensible; step 6 is the faulty link. Rejecting step 6 preserves the deflationary insight about mathematics (steps 1–4) while upholding the epistemic value of novel prediction (step 8).  

  **Why step 6 looked acceptable**: It appeals to the uniformity of nature (new data resemble old data) and generalizes selection bias to all contexts. This seems intuitive—if past success doesn't prove truth, why should future success? But it ignores how *methodological risk* distinguishes evidence: a theory that could have been falsified but wasn’t (e.g., predicting an eclipse) gains credibility, whereas fitting known data is always possible with flexible models.  

  **Cost of rejecting step 6**: You must accept that while selection bias explains *past* success, it doesn’t fully explain *predictive* success. This requires defending a modest realism: theories that survive stringent tests (novel predictions) likely approximate truth more than those merely retrofitted to data. It also implies that not all empirical successes are epistemically equal—novel predictions are "costlier" for a theory to achieve and thus more informative.  

  **What the argument gets right**: Selection effects *do* demystify why mathematics "works" (steps 1–4). We shouldn’t be surprised that tools retained for past applicability succeed in similar contexts—this is indeed an artifact of human practice. The deflationary core is sound, but it doesn’t license skepticism about all evidence (steps 7–8).  

  **Novel prediction verdict**: Novel predictive success remains strong evidence of a theory's truth-tracking ability. It escapes the selection-bias trap because the theory wasn’t tailored to that data, making success genuinely informative.  

  **Rival diagnoses**:  
  | Step | Cost | Why less attractive |  
  |------|------|---------------------|  
  | Reject step 2 | Must deny that mathematics is filtered by applicability, ignoring real historical practices (e.g., abandoning Aristotelian physics). | Conflicts with the history of science; inflates Wigner’s puzzle unnecessarily. |  
  | Reject step 8 | Must accept that no experiment can confirm a theory, undermining science altogether. | Requires embracing radical skepticism, which is self-defeating and counterintuitive. |  
  | Reject step 5 | Must argue that success *does* support truth for non-mathematical theories. | Inconsistent with the deflationary spirit of steps 1–4; doesn’t resolve the core issue. |  

  **Confidence**: 0.95 (The error in step 6 is clear, and preserving both deflationism and scientific realism is coherent.)  

