prompt: |-
  I've been having a long, slightly drunken argument with my flatmate about whether it's ever okay to care more about your own countrymen, and it's made me realise that I have pretty firm gut verdicts on particular cases but absolutely no idea what they add up to. Picture two countries next to each other, same language, most families have cousins over the border. Case by case, here's what I think. (a) I can give a scholarship to a kid from here or a kid from over the border, the two would benefit equally, and it's my own money: fine to pick my own. (b) Same choice, but I'm a civil servant handing out a fixed pot of public money and the kid over the border would actually benefit more: not fine, I should go where the money does more good. (c) Two equally good candidates for a job in my own business, one a citizen, one not: fine to hire the citizen. (d) Same two for a public job, and the foreigner is a bit better: not fine. (e) Two people drowning, one from here, one from over the border, identical in every way, and I can only get one: I think I'm allowed to grab my own, and I don't think I'm being especially virtuous or especially wicked either way. (f) The government can take in refugees; it costs people here a little and helps the refugees a great deal; I think it should take them in, and that a government which said our own first would be doing something wrong — even though that's basically case (a) with bigger numbers. (g) I'd rather the state spent a pound on someone poor here than two pounds on someone equally poor over the border. That feels right to me. (h) A bloke from here who lives off-grid, pays no tax, never votes and thinks the country is a joke — when he gets ill I still think he's entitled to the same care as anyone else here, no questions asked. (i) A cousin of mine whose grandparents emigrated, who holds the passport but has never lived here, speaks the language badly and pays nothing in — if there's a disaster here and the state hands out emergency payments, I feel he has some claim on it, but a weaker one than mine. (j) A woman who's lived here twenty years, works, pays tax, can be jailed, can't vote — I think she's owed everything a citizen is owed except the vote, and she should get the vote too. (k) And if my country is doing something seriously wrong to people over the border, I think I owe more to the people it's hurting than to my own lot who are complaining about the fallout.

  My own half-baked theory was that the thing doing the work is being subject to the same coercive institutions — the law lands on you the same way — with shared culture adding something extra but lighter, and with the whole business only governing how I use my own life and how a country runs itself, not how shares get divvied up. But (f) and (g) seem to pull in opposite directions and I can't seperate them, and (i) is the one that keeps slipping out of whatever I say.

  So: is there one principle that gets all this, or close? Give me the principle, or two or three rivals, stated precisely enough that I can tell them apart, with each clause pinned to the case that forces it. Lay it out like this. First a section called The bottom line, about a hundred words, saying straight out whether one principle survives and what it is. Then Candidate principles, four hundred words or so: each stated precisely, the case that motivates each clause, and an honest note on what each has to say about (f) and (g). Then Verdicts, case by case, a table with a row for each of my cases from (a) to (k), giving my verdict, which principle delivers it, and flagging any case that no principle on your list can reach. Then Cases I didn't give you, about two hundred and fifty words, with your verdicts on three I haven't mentioned: a dual national who holds both passports and lives over the border; whether we owe more to our own future citizens than to future foreigners when we set climate policy; and what happens to these claims if a region of the country votes to leave. Then What I have to give up, a hundred and fifty words, telling me which of my verdicts has to go and what would change your mind.
reasoning: |-
  Okay, let me try to unpack this user's query. They're struggling with when it's okay to prioritize their own countrymen versus others, and they've listed specific cases where their gut feelings conflict. The user seems to want a coherent principle that explains all these cases but hasn't found one yet. Their examples range from personal decisions like scholarships to governmental policies like refugees and taxes.

  First, I need to understand each case they've presented. For instance, in (a) using personal money for a scholarship feels okay to favor a local, but in (b) public money must go where it does the most good. That suggests a distinction between private and public resources. Then there's (e) saving a drowning person where nationality feels irrelevant, but in (g) they'd spend less on a foreigner in need. These contradictions need reconciling.

  Their half-baked theory involves coercive institutions and shared culture, but cases (f) and (g) conflict. (f) says take refugees despite cost, but (g) prefers helping locals even if foreigners get more benefit per pound. The user is stuck here. Also, (i) about the cousin with weak ties is tricky—why does he have some claim but less?

  I recall political philosophy concepts like liberal nationalism, cosmopolitanism, and institutionalist approaches. Liberal nationalism might justify cultural ties but struggles with (f) and (g). Cosmopolitanism would push for equal consideration but doesn't fit cases like (a) or (c) where personal choice allows preference. Institutionalist theories focus on shared systems—like paying taxes or being subject to laws—which explains (h) and (j) but not (i) where the cousin isn't part of those systems.

  The key might be separating personal obligations from state duties. Personal choices (a, c, e) allow partiality, while state actions (b, d, f) require impartiality based on impact or rights. But (g) is a state spending case where the user still prefers locals. That's a problem. Maybe the state can prioritize citizens but with a threshold—help foreigners when needs are greater, as in refugees. For (g), perhaps efficiency matters: spending locally might be more effective, but the user didn't mention that. Alternatively, they might accept a principle where the state can prioritize citizens unless the foreign need is significantly greater, which resolves (f) and (g) but requires adjusting (g).

  Dual nationality in unmentioned cases: if someone has both passports but lives abroad, their claim might be weaker due to lack of participation. Climate policy should consider future generations equally. Secession: if a region leaves, obligations shift to the new institutions. 

  The user might need to give up their verdict on (g) or accept that state duties allow some prioritization but with humanitarian limits. Or adjust (i) to no claim without institutional ties. It's a trade-off between consistency and intuitions.
answer: |-
  ### The Bottom Line
  No single principle perfectly reconciles all your intuitions. Your judgments stem from a **hybrid obligation theory**: obligations are primarily created by **coercive institutional participation** (paying taxes, subject to laws), amplified significantly by **active civic membership** (voting, cultural integration). Personal resources permit partiality; public resources demand impartial maximization of welfare *unless* strong institutional/civic ties exist. Shared culture alone creates weak obligations. Humanitarian duties override partiality when harm is inflicted by your state. This explains most cases but forces a revision of (g) or highlights its tension with (f).

  ### Candidate Principles

  1.  **Liberal Nationalism:**
      *   **Principle:** Individuals and states may prioritize compatriots based on shared identity, culture, and mutual benefit within a self-determining political community. Strength of obligation scales with cultural/civic integration and reciprocity.
      *   **Clause Motivation:** (a) Personal funds reflect identity-based partiality. (c) Private business hiring reflects community preference. (e) Rescue reflects instinctive partiality. (g) State spending reflects communal priority. (i) Weaker claim based on weaker cultural/civic ties. (j) Strong claim via integration despite lack of vote.
      *   **On (f) & (g):** *Supports (g)* strongly (communal priority). *Struggles with (f)*: Prioritizing refugees might conflict with "own first," requiring appeal to minimal humanitarian duty or long-term communal benefit to justify overriding partiality.

  2.  **Institutionalist Reciprocity:**
      *   **Principle:** Obligations arise solely from subjection to, and participation in, shared coercive institutions (law, taxes, welfare). Strength scales with contribution (taxes) and vulnerability to the state's power (law enforcement, conscription).
      *   **Clause Motivation:** (b) Public funds demand impartiality as institutional duty. (d) Public job requires meritocracy as institutional rule. (h) Entitlement comes from being subject to law. (j) Entitlement comes from paying tax and being subject to law/vulnerability. (k) Duty to harmed foreigners arises from state coercion causing harm.
      *   **On (f) & (g):** *Rejects (g)*: If institutions maximize welfare impartially, spending where it does most good is paramount. *Supports (f)*: Admitting refugees maximizes welfare significantly; state partiality based on nationality violates institutional fairness to those within its jurisdiction (taxpayers, residents).

  3.  **Threshold Cosmopolitanism (Modified):**
      *   **Principle:** All humans deserve equal moral consideration. However, states may prioritize citizens *only* for maintaining basic institutions and social stability. Once a threshold of basic needs/social cohesion is met, resources must be allocated impartially to maximize global welfare. Strong negative duties exist not to harm.
      *   **Clause Motivation:** (f) Admitting refugees meets a global welfare imperative where local cost is low. (k) Strong negative duty to repair harm caused by one's state. (e) Personal rescue allows partiality as no threshold failure. (a) Personal funds permit partiality below threshold concerns.
      *   **On (f) & (g):** *Strongly Supports (f)*. *Rejects (g)*: Once basic needs are met locally (assumed), spending must maximize welfare globally, so the pound should go where it does more good (abroad).

  4.  **Hybrid Institutional/Civic Membership (Closest to Your Intuition):**
      *   **Principle:** Core obligations stem from reciprocal participation in coercive state institutions (taxes, law). Full civic membership (voting, cultural identification) strengthens claims on collective resources and justifies some communal partiality. *Personal* resources permit partiality. *Public* resources require impartial maximization of welfare *unless* strong institutional/civic ties exist. Negative duties (not harming) bind strongly regardless of borders.
      *   **Clause Motivation:** (b/d) Public role demands impartiality. (h/j) Institutional subjection creates entitlement. (c) Private role permits partiality. (i) Weak claim via passport (minimal institution) but lack of integration weakens it. (k) Negative duty dominates. (e) Personal action permits partiality.
      *   **On (f) & (g):** *Supports (f)*: Refugee admission addresses critical need (welfare max) and negative duty; state partiality unjustified as refugees lack institutional ties. *Tension with (g)*: If local poor have strong institutional/civic ties, *some* priority might be justified, but strong impartiality pull suggests the pound *should* go abroad if it does more good – requiring revision of (g) or weakening its strength.

  ### Verdicts

  | Case | Your Verdict | Principle Delivering It | Flagged Mismatch? |
  | :--- | :----------- | :---------------------- | :---------------- |
  | (a)  | Fine (Pick Own) | Liberal Nationalism, Hybrid (Personal Funds Clause) | |
  | (b)  | Not Fine (Max Good) | Institutionalist, Threshold Cosmopolitan, Hybrid (Public Funds Clause) | |
  | (c)  | Fine (Hire Citizen) | Liberal Nationalism, Hybrid (Private Role Clause) | |
  | (d)  | Not Fine (Hire Better) | Institutionalist, Hybrid (Public Role Clause) | |
  | (e)  | Fine (Save Own) | Liberal Nationalism, Threshold Cosmopolitan (Below Threshold), Hybrid (Personal Action) | |
  | (f)  | Should Take In | Institutionalist (Welfare/Duty), Threshold Cosmopolitan, Hybrid | |
  | (g)  | Prefer Own | Liberal Nationalism | **Mismatch:** Institutionalist, Threshold Cosmopolitan, Hybrid struggle |
  | (h)  | Entitled | Institutionalist, Hybrid (Institutional Subjection) | |
  | (i)  | Weaker Claim | Liberal Nationalism (Weak Ties), Hybrid (Minimal Institution/Weak Integration) | |
  | (j)  | Owed Full (Inc. Vote) | Institutionalist (Subjection/Contribution), Hybrid (Institution + Integration) | |
  | (k)  | Owe More to Harmed | Institutionalist (Negative Duty), Threshold Cosmopolitan (Negative Duty), Hybrid | |

  ### Cases You Didn't Mention

  1.  **Dual National Abroad:** Holds both passports, lives over the border.
      *   **Verdict:** Very weak claim on your state's resources. Possession of a passport creates a *minimal* institutional link (consular protection, right to return), but lacks crucial elements: subjection to everyday laws, tax contribution, civic participation in *your* community. Obligation is weaker than your cousin (i) who might have stronger cultural/familial ties. Closer to a foreigner than a resident citizen. (Principles: Hybrid - Minimal Institution; Liberal Nationalism - Weak Civic Ties).
  2.  **Climate Policy: Future Citizens vs. Future Foreigners:**
      *   **Verdict:** The state has a primary duty to ensure a livable future *for those who will be subject to its future institutions and jurisdiction* (future citizens). However, climate harm is inherently global. The state has a strong negative duty not to inflict disproportionate harm on *any* future people. Policy must balance securing a viable future for its *own* future citizens (justifiable partiality) with its duty to avoid catastrophic harm to *all* future people (cosmopolitan duty). (Principles: Hybrid - Future Institutional Subjection + Negative Duty; Threshold Cosmopolitan - Duties to all humans, mitigated by state function).
  3.  **Region Votes to Leave:**
      *   **Verdict:** Obligations shift with institutional boundaries. *Before* secession: Individuals in the region are owed full duties by the existing state (like j/h). *During transition:* Fair division of assets/liabilities and protection of acquired rights (e.g., pensions) is paramount. *After* secession: Primary obligations are owed by the new state to its new citizens/residents based on the new institutional framework. Historic ties or shared culture create weaker, secondary obligations (like aid between friendly nations), not the strong obligations of shared citizenship/subjection. (Principles: Institutionalist/Hybrid - Obligation follows institutional subjection).

  ### What You Have To Give Up

  Your verdict on **(g)** ("spend a pound on poor here rather than two on equally poor abroad") is the main tension. **Hybrid/Institutionalist/Threshold Cosmopolitan principles all push towards spending where it does more good (abroad) once basic institutional duties are met.** To keep consistency with (b), (d), and especially (f), you likely need to either:
  1.  **Revise (g):** Accept that impartial welfare maximization *should* guide public spending, making the foreigner the better choice, or
  2.  **Weaken (g):** Argue that "equally poor" masks hidden costs (administrative, social cohesion) justifying the pound spent locally, but admit that if the *net benefit* is clearly greater abroad, it should go there.

  **What would change your mind?** Evidence that strong in-group preference for resource allocation inevitably undermines the impartial institutions (like rule of law in b/d) you value, or conversely, evidence that states utterly neglecting the basic welfare of their institutional participants lose legitimacy and fail. A compelling case showing the suffering caused by (g)-type policies outweighing the communal benefits might also shift your view. Ultimately, reconciling (f) and (g) requires either accepting a stronger cosmopolitan duty or defining a clearer (and potentially arbitrary) threshold for when communal partiality overrides welfare maximization.
