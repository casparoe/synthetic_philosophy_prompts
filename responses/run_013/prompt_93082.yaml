  **The Toast:**

  Good evening, everyone. We’re here to celebrate the extraordinary career of [Advisor's Name], a scientist whose work has fundamentally shaped how we think about evolution – and who, I suspect, might finally have time for that long-postponed lunch with her sister. [*Warm smile/slight pause for laughter*]

  For thirty-six years, [Advisor's Name] has been consumed by a single, deceptively simple question: **Where does the action really happen?** When we see an ant colony sacrifice for the nest, a pack of wolves coordinate a hunt, or even a complex cell arise from simpler ones – where do we locate the *source* of that adaptation? Is it in the gene, busily replicating? The individual organism, striving to survive and reproduce? Or is it something that emerges at the level of the group itself?

  This question isn't abstract. It cuts to the bone of how we understand life. And [Advisor's Name] didn't just ask it; she built her career wrestling with its sharp edges. She explored the mathematics, crafted models, and engaged in passionate debates that spanned decades – debates many of you in this room know intimately, not as academic footnotes, but as shared intellectual history.

  Here’s what her work, and the rigorous dialogue it sparked, has shown us: **The level at which we *describe* an evolutionary process powerfully shapes what we see as the cause.** A process that looks like selection *among* groups when viewed from one angle can look like selection *for* traits within individuals when viewed from another. Crucially, this isn't just saying "everyone was right," or that the facts don't matter. The facts are everything. But different mathematical frameworks can successfully capture the *same* underlying reality – the same transmission of traits, the same shift in frequencies – while highlighting different aspects as the "engine" of change. It’s the difference between focusing on the *object* that selection acts upon versus the specific *property* or consequence that makes it successful. Both perspectives can be mathematically valid accounts of the same events.

  [Advisor's Name] understood this deeply. Her courage wasn't just in defending a position, but in meticulously exploring the **connections and equivalences** between seemingly rival perspectives. She showed us that arguments often flared not because one side denied the facts the other saw, but because they framed the *explanation* differently, prioritizing different levels of description. Her insistence on clarity – on defining *what kind* of "group selection" we were even talking about – forced the field to sharpen its tools and recognize when apparent disagreements were actually about the lens, not the landscape.

  That is her profound contribution: **demonstrating that the structure of our explanation matters as much as the outcome it describes.** She taught us that the 'level' of adaptation isn't always a single, self-evident point, but can depend on the question we ask and the accounting we choose. Her work is a testament to the power of careful modeling to reveal hidden harmonies beneath surface discord.

  So, let us raise our glasses to [Advisor's Name]. To her brilliant mind that saw connections where others saw only conflict. To her intellectual honesty that demanded clarity and embraced complexity. To her unwavering dedication to understanding life, not just describing it. And yes, to her patience with referees! [*Raise glass*] To [Advisor's Name] – a true architect of understanding in evolutionary biology. Cheers!

