prompt: |-
  I'm a third-year doctoral student in the philosophy of mathematics, and I've been locked in a running argument with a colleague who works on nominalist reconstructions of arithmetic and analysis. We keep talking past each other, and I've come to think the real disagreement is that neither of us has a clear picture of what an account of mathematical ontology is even supposed to deliver. Before I draft another chapter, I want the specification set out. Please give me the desiderata that any adequate theory of mathematical ontology — and of the truth of mathematical statements — must meet: the cases it has to get right, the distinctions it cannot collapse, and the findings from mathematical practice and from empirical science it must remain consistent with, together with the consideration that motivates each requirement. I am less interested in a tidy list than in why each item earns its place, and in which of the things people routinely demand are genuine desiderata rather than commitments of one camp smuggled in as neutral constraints.

  Drive the list from cases rather than slogans, and lean on the awkward ones: the apparently indispensable use of mathematics in empirical science; the worry about how we could ever enjoy cognitive access to objects that are causally inert; the status of a theorem proved only by a computer search so vast that no human being will ever survey the proof, yet which scientists go on to apply; the gap between a claim's being true and its being provable, statable, or checkable; and the question whether a theory of ontology owes us any account of mathematical discovery at all, or only of mathematical truth. Flag any pair of requirements you suspect cannot be jointly satisfied — I want that part most, since a genuine incompatibility would be a result in itself — and tell me which single requirement does the most work in excluding candidates. Then, briefly, how classical platonism, a nominalist reconstruction of the 'no abstracta, only concrete inscriptions and their combinatorial possibilities' variety, and a structuralist or fictionalist alternative each fare against the list. Keep the weight on the criteria and their motivating cases rather than on the scorecard, since I shall run the scoring myself in the reading group. Please write in British English.
reasoning: |-
  Okay, the user is a third-year doctoral student in philosophy of mathematics, locked in a debate with a nominalist colleague. They feel they're talking past each other and suspect the core issue is unclear desiderata for mathematical ontology. They want a clear set of criteria grounded in cases, not slogans, to evaluate theories.

  Hmm, this is a sophisticated request. The user clearly understands the field but needs help structuring the debate. They mention several thorny issues: indispensability in science, cognitive access to abstract objects, computer proofs, truth vs. provability, and whether ontology must explain discovery. They want tensions between desiderata highlighted, especially any incompatibilities.

  Right, let's start by identifying key cases that any ontology must handle. The indispensability argument from science is crucial - think of quantum mechanics using Hilbert spaces. Then there's Benacerraf's epistemic worry: how do we know about numbers if they're causally inert? Computer proofs like the Four Color Theorem present another challenge: can we call it "knowledge" if no human verifies it? And the truth-provability gap illustrated by Gödel's theorems.

  The user also wants distinctions preserved - e.g., between arithmetic truth and provability, or between mathematical content and notation. And consistency with practice: mathematicians act as if theorems are discovered, not invented.

  Notable tensions: Epistemic access vs. ontological independence seems hard to reconcile. Also, ontological parsimony vs. scientific indispensability might clash. The epistemic constraint might be the most exclusionary - it rules out standard Platonism unless mitigated.

  For theories: Classical Platonism nails truth and independence but struggles with epistemology. Nominalism (like Field's) avoids abstracta but has trouble with indispensability and truth values for uncomputable statements. Structuralism handles the "about what" question well but may inherit Platonism's epistemic issues. Fictionalism makes ontology easy but struggles with truth and science applications.

  The user should watch for desiderata that bias toward one camp. For example, demanding causal contact with abstracta would unfairly favor nominalism. The list must stay neutral.
answer: |-
  Here is a set of desiderata for a theory of mathematical ontology and truth, grounded in specific cases and tensions within mathematical practice and its applications. I'll present them as requirements motivated by core phenomena, flag points of conflict, and identify the potentially most exclusionary constraint. I'll then briefly sketch how major positions fare, focusing on the criteria themselves.

  **Core Desiderata for Mathematical Ontology & Truth:**

  1.  **Scientific Indispensability & Applicability:**
      *   **Case:** The use of real analysis in formulating General Relativity; the necessity of complex numbers in quantum mechanics; statistical methods relying on probability measures.
      *   **Requirement:** The theory must explain why mathematical theories are not just useful but *apparently indispensable* for formulating our best scientific theories about the concrete world, and why their application yields empirically successful predictions. It must account for the *specificity* of the mathematics used (e.g., why ℝ, not just ℚ).
      *   **Motivation:** The empirical success of science employing sophisticated mathematics is a datum needing explanation. Ignoring this risks making mathematics seem like an inexplicably lucky formal game. A theory failing here struggles to explain *why* mathematics works in science *at all*.

  2.  **Epistemic Access (The Benacerraf Problem):**
      *   **Case:** How can a doctoral student (or anyone) reliably form true beliefs about prime numbers exceeding the causal reach of any human (or physical) process?
      *   **Requirement:** The theory must provide a plausible account of how mathematicians achieve *justified belief* or *knowledge* concerning mathematical truths, especially those about objects seemingly abstract, acausal, eternal, and mind-independent.
      *   **Motivation:** Mathematical practice *appears* knowledge-generating. A theory positing entities radically disconnected from our cognitive capacities faces a deep challenge: explaining how reliable cognitive contact with such entities is possible. This is often the nominalist's primary weapon against Platonism.

  3.  **Verification-Transcendent Truth:**
      *   **Case:** The truth value of the Continuum Hypothesis (CH) independent of ZFC; the truth of Goldbach's Conjecture (if true) before any proof existed; the status of arithmetical statements whose minimal proof length vastly exceeds the computational resources of the universe.
      *   **Requirement:** The theory must accommodate the *possibility* (and plausibility, given Gödel) of mathematical truths that are objective yet fundamentally inaccessible to proof, computation, or any feasible verification procedure. Truth cannot be *defined* as provability, assertability, or verifiability.
      *   **Motivation:** Mathematical practice treats conjectures as having determinate truth values before proof (e.g., Fermat's Last Theorem). Gödel’s incompleteness theorems demonstrate that standard formal systems contain unprovable truths. Collapsing truth to provability misrepresents mathematical objectivity.

  4.  **The Autonomy and Objectivity of Mathematical Truth:**
      *   **Case:** Mathematicians treat proofs as *discoveries* (e.g., the classification of finite simple groups) rather than inventions; disputes over correctness are settled by shared standards of proof, not consensus or utility; the surprise and recalcitrance mathematicians encounter (e.g., independence results).
      *   **Requirement:** The theory must respect the *objectivity* and *mind-independence* of mathematical truth. What makes a mathematical statement true should not depend fundamentally on human psychology, convention, linguistic practice, or pragmatic utility, but on the mathematical subject matter itself.
      *   **Motivation:** The phenomenology of mathematical practice strongly suggests discovery of objective facts. Theories that make truth radically mind-dependent (e.g., some strict formalisms or social constructivisms) struggle to explain the feeling of constraint and surprise inherent in mathematical investigation.

  5.  **The Authority of Proof and Computation:**
      *   **Case:** The acceptance of the Four Colour Theorem (relying on computer verification); the use of probabilistic primality tests in cryptography; the role of proof assistants like Coq.
      *   **Requirement:** The theory must explain why proof (including non-surveyable computer-assisted proof) and reliable computation are authoritative sources of mathematical knowledge, even when they bypass direct human intuitive grasp. It must account for the *justificatory force* of proof.
      *   **Motivation:** Proof is the bedrock of mathematical justification. A theory that cannot explain why a valid proof (even one involving immense computation) justifies belief in its conclusion fails to engage with the core epistemic practice of mathematics. This includes the reliability of formal reasoning.

  6.  **Ontological Parsimony (The Quinean Virtue):**
      *   **Case:** The intuitive unease with positing an infinite hierarchy of causally inert, non-spatiotemporal entities (e.g., the cumulative hierarchy of sets) just to account for mathematical discourse.
      *   **Requirement:** All else being equal, a theory that posits fewer or less metaphysically extravagant kinds of entities is preferable. Concrete or modal ontologies are prima facie less problematic than robust abstracta.
      *   **Motivation:** A fundamental metaphysical principle: avoid multiplying entities beyond necessity. Nominalist programs are driven by this. Theories positing abstracta bear the burden of justifying their existence against this parsimony constraint.

  7.  **Semantic Adequacy (Aboutness & Reference):**
      *   **Case:** The difference between "7 + 5 = 12" being *about numbers* vs. being *about numerals* or syntactic strings; the apparent reference to functions, sets, and structures in mathematical discourse.
      *   **Requirement:** The theory must provide a plausible account of the *semantic content* of mathematical statements. What are they *about*? What do singular terms ('7', 'π', 'the set of primes') refer to, if anything? What makes predicative expressions ('is prime', 'is continuous') true or false of their subjects?
      *   **Motivation:** Mathematical language *appears* referential. A theory that interprets "There are infinitely many primes" as merely concerning concrete tokens or linguistic conventions needs to explain away this robust appearance of quantification and reference to abstract objects. Failure here risks semantic revisionism.

  8.  **Consistency with Mathematical Practice:**
      *   **Case:** The working mathematician's attitude towards objects (e.g., manipulating complex numbers without ontological qualms); the pursuit of questions deemed independent of foundational systems (e.g., large cardinal axioms); the use of classical logic as the default standard.
      *   **Requirement:** The theory should not require radical revision or reinterpretation of the core practices, methodologies, and attitudes of working mathematicians. It should be compatible with the way mathematics is actually done and understood by its practitioners, without imposing alien philosophical constraints.
      *   **Motivation:** Philosophy should aim to understand and illuminate practice, not dictate its reform based solely on prior metaphysical commitments (unless practice is demonstrably incoherent). Radically revisionist ontologies face an uphill battle.

  9.  **Explanatory Scope for Mathematical Diversity:**
      *   **Case:** The ontological status of inconsistent objects in paraconsistent logics; the "existence" of large cardinals beyond ZFC; the nature of objects in homotopy type theory vs. classical set theory.
      *   **Requirement:** The theory should have the resources to account for the vast and diverse landscape of mathematical theories and their objects, not just elementary arithmetic or classical analysis. It should avoid forcing all mathematics into one procrustean ontological bed.
      *   **Motivation:** Mathematics is not monolithic. A theory tailored only to arithmetic fails as a *general* ontology of mathematics. It must handle foundational diversity and the legitimacy of alternative frameworks.

  **The Question of Discovery:**
  *   **Requirement?** A theory of ontology and truth *need not necessarily provide a complete account of mathematical discovery*. Its core task is to explain *what makes mathematical statements true* and *what entities (if any) they are about*. While an account of discovery might be desirable or even necessary to meet the Epistemic Access constraint, it is arguably a separable epistemological project. However, a theory that makes discovery utterly mysterious (e.g., by positing inaccessible abstracta with no connection to cognition) faces a severe challenge at the intersection of Ontology and Epistemology.

  **Flagged Tensions & Potential Incompatibilities:**

  1.  **Epistemic Access (2) vs. Ontological Independence (4):** This is the heart of the Benacerraf dilemma. How can truths be fully mind-independent *and* we have reliable epistemic access to them? Platonism struggles with access; strict nominalism/conventionalism struggles with independence. **This is arguably the most fundamental tension.**
  2.  **Ontological Parsimony (6) vs. Scientific Indispensability (1):** Nominalist reconstructions often achieve parsimony by eliminating abstracta but struggle to provide a convincing account of why the *unreconstructed* mathematics is indispensable to science. Platonism easily handles indispensability but violates parsimony. Field's program attempted to bridge this gap (by showing science *could* be done nominalistically), but its success is highly contested.
  3.  **Verification-Transcendent Truth (3) vs. Authority of Proof (5):** If truth can outrun proof, how can proof remain the ultimate arbiter? This is less a strict incompatibility and more a challenge for theories that want to ground truth *in* provability or constructibility. Classical truth-conditional semantics (compatible with Platonism or robust realism) handles (3) well, while strict verificationism/intuitionism rejects (3) to prioritise (5).
  4.  **Semantic Adequacy (7) vs. Ontological Parsimony (6):** Capturing the robust referential appearance of mathematical discourse often seems to require positing objects (Platonism). Eliminativist nominalism (e.g., radical formalism) often involves significant semantic revision, arguing the referential appearance is misleading. This is a core battleground.

  **The Most Exclusionary Requirement:**
  *   **Epistemic Access (2)** arguably does the most work in excluding candidates. **Classical Platonism** (full-blooded realism about abstract mathematical objects as mind-independent, acausal, non-spatiotemporal entities) faces its most severe challenge here. While indispensability (1) and truth/objectivity (3,4) provide strong *motivation* for Platonism, (2) is its Achilles' heel. Nominalist and many non-Platonist positions (like some forms of structuralism or fictionalism) are often developed explicitly *as responses* to the perceived failure of Platonism to satisfy (2).

  **Brief Sketch of How Theories Fare Against the List:**

  1.  **Classical Platonism:**
      *   **Strengths:** Excels at Scientific Indispensability (1 - mathematics is literally true of abstract reality used to model concrete), Verification-Transcendent Truth (3), Objectivity/Autonomy (4), Semantic Adequacy (7 - direct reference), and arguably Consistency with Practice (8 - captures the "discovery" attitude). Handles Diversity (9) via sets or universals.
      *   **Weaknesses:** Profoundly challenged by Epistemic Access (2 - the Benacerraf problem). Fails Ontological Parsimony (6) spectacularly. Authority of Proof (5) becomes indirect (proofs track abstract truth, but access is mysterious).
      *   **Core Tension:** (2) vs. (1,3,4,7).

  2.  **Hard Nominalism (e.g., "Only Concrete Inscriptions" or Radical Formalism):**
      *   **Strengths:** Satisfies Ontological Parsimony (6) and potentially Epistemic Access (2 - we manipulate concrete symbols). Can handle Authority of Proof (5 - as syntactic derivation).
      *   **Weaknesses:** Struggles catastrophically with Scientific Indispensability (1 - why do symbol manipulations predict the physical world?). Collapses or severely distorts Verification-Transcendent Truth (3 - truth becomes provability/syntactic) and Objectivity (4 - becomes convention about symbols). Fails Semantic Adequacy (7 - numbers aren't *about* numerals). May struggle with Consistency with Practice (8 - mathematicians think they are talking about numbers, not ink). Limited Explanatory Scope (9).
      *   **Core Tension:** (1,3,4,7) vs. (2,6).

  3.  **Sophisticated Nominalism/Neo-Fictionalism (e.g., Field, Melia):**
      *   **Strengths:** Aims for Ontological Parsimony (6 - no abstracta). Addresses Epistemic Access (2 - knowledge of concrete world/conventions). Tries to handle Scientific Indispensability (1 - via conservativeness, "makes no difference", or representational aids).
      *   **Weaknesses:** Controversial success on (1) - does it *really* explain the *specific applicability* and predictive success? Struggles with Verification-Transcendent Truth (3 - fictionalism often makes truth relative to the fiction, which may not extend cleanly to independent statements). May strain Semantic Adequacy (7 - "There are numbers" is false, though useful). Authority of Proof (5) becomes proof *within the fiction*. Objectivity (4) is weakened (truth is fiction-relative). Consistency with Practice (8) can be strained.
      *   **Core Tension:** (1,3,4) vs. (6). Success hinges on reinterpretation of (1).

  4.  **Structuralism (Ante Rem or In Re):**
      *   **Strengths:** Handles Semantic Adequacy (7 - statements are about positions in structures). Can accommodate Objectivity (4 - structures exist independently). Can explain Scientific Applicability (1 - concrete systems instantiate structures). Can handle Diversity (9 - different structures). Ante Rem struggles with Parsimony (6) like Platonism; In Re (modal) versions aim for better Parsimony. Epistemic Access (2) remains a challenge for Ante Rem; In Re links it to possible concrete instantiations. Authority of Proof (5) is clear (proofs establish structural facts).
      *   **Weaknesses:** Epistemic Access (2) still problematic for Ante Rem (how access to freestanding structures?). Verification-Transcendent Truth (3) applies to structural facts. The nature of structures themselves can be ontologically puzzling. Defining structures without set-like entities is tricky.
      *   **Core Tension:** For Ante Rem: (2) vs. (1,4,7). For In Re: Explaining the modal component needed for uninstantiated structures (like large infinite sets) without collapsing into abstracta or losing Objectivity (4).

  5.  **Fictionalism (Hermeneutic or Revolutionary):**
      *   **Strengths:** Satisfies Ontological Parsimony (6). Addresses Epistemic Access (2 - knowledge of fiction/conventions). Can aim for Consistency with Practice (8 - if hermeneutic, interpreting practice *as* fictional).
      *   **Weaknesses:** Struggles with Scientific Indispensability (1 - why is the fiction *uniquely* indispensable/predictive?). Severely compromises Objectivity (4 - truth is fiction-relative) and Verification-Transcendent Truth (3 - independent truths may have no determinate status in the fiction). Semantic Adequacy (7) is rejected (mathematical discourse is not genuinely referential/descriptive). Authority of Proof (5) becomes proof *within the fiction*. Revolutionary versions explicitly reject Consistency with Practice (8).
      *   **Core Tension:** (1,3,4,7) vs. (2,6).

  This framework, driven by the specific cases and tensions, should provide a clearer map for your debate. The central battlegrounds remain **Epistemic Access** vs. **Robust Objectivity/Indispensability** and **Ontological Parsimony** vs. **Semantic Adequacy/Scientific Indispensability**. Identifying precisely where your disagreement lies on this map – which desiderata each of you prioritises or thinks can be satisfied, and how – is the crucial next step. Good luck with the reading group and the chapter!
