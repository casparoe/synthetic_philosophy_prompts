prompt: |-
  I run operations and hiring at a midsize nonprofit, and we recruit for the same three roles on a rolling basis — applications arrive continuously, we interview as candidates come in, and I make a call within a few weeks of opening a search. A bad hire costs us most of a year, so I can't just grab whoever is available, but I also can't keep searching forever: I have roughly fifteen hours a week for a search, offers above a set salary band need board sign-off and the board only meets monthly, and once I decline a candidate I can't go back to them — though we do keep a file of strong runners-up we're allowed to re-approach if they haven't taken another job.

  What I want is a decision procedure I can actually run, built on the satisficing tradition in bounded rationality — the idea that a boundedly rational agent sets an aspiration level and accepts the first option that meets it rather than optimizing over the whole space. Translate that theory into something usable by a hiring manager who has never read it, keeping what the theory actually says and not just restating generic hiring advice. Give me the steps in the order I should run them; for each step, what counts as a sufficient answer; where the procedure stops with a yes and where it stops with a no; how I set the aspiration level in the first place and how I am supposed to update it as I learn what the pool looks like; how to tell when my aspiration level is miscalibrated rather than the pool being genuinely bad; what changes when the cost of continuing to search goes up or down; and where the procedure hands the decision back to a person because the question is one of values rather than facts.

  I'd like you to distinguish, in the course of this, between satisficing and optimizing, between a stopping rule and a choice rule, and between searching a stream of candidates one at a time versus choosing among several I already have in hand — because my search is mostly sequential but the silver-medalist file partly breaks the usual assumption that a declined candidate is gone for good, and I want the procedure to say what to do about that.

  Then run it on three cases. First: an early applicant who clearly clears the bar on paper but has an unexplained two-year gap and lukewarm references — do I stop and hire, or is a cleared bar not yet a sufficient answer? Second: a long drought in which every candidate is mediocre and I can feel myself wanting to lower the bar just to end the search. Third: a candidate who is outstanding on dimensions I hadn't been weighting, so that she doesn't obviously clear my stated bar but is plainly the strongest person I've seen. At least one of these should come out in a way I won't like, and I want you to say so rather than soften it.

  Finally, be honest about which steps are judgment calls dressed up as procedure, and tell me what the procedure cannot do — in particular, whether it can ever instruct me to keep searching past a candidate who has already cleared the bar, and whether that would be a failure of the procedure or a genuine feature of satisficing. Please write the answer in American English.
reasoning: |-
  Hmm, the user runs operations and hiring at a midsize nonprofit and needs a practical decision procedure based on satisficing theory. They recruit for the same three roles continuously, with applications coming in all the time. They've clearly outlined constraints: bad hires cost about a year's productivity, they have limited time (15 hours/week per search), salary offers above a certain band require board approval (monthly meetings), and once declined, candidates are off the table except for a silver-medalist file.

  They want a procedure grounded in bounded rationality - specifically satisficing where you set an aspiration level and accept the first candidate that meets it, rather than optimizing. They need me to translate this theory into actionable steps while preserving its core principles, not just generic hiring advice.

  Key distinctions they want covered: satisficing vs optimizing (satisficing stops at "good enough," optimizing seeks best possible), stopping rules vs choice rules (stopping ends the search, choice selects from options), and sequential search vs batch evaluation (their process is mostly sequential but complicated by the silver-medalist file).

  For the procedure itself, I need to outline steps in order, define what counts as sufficient at each stage, show where it stops with yes/no, explain how to set and update aspiration levels, provide calibration checks, and address how changing search costs affect decisions. I should also clarify where human judgment takes over.

  The user specifically wants three case studies: 
  1. An early strong applicant with red flags (gap in resume + lukewarm references)
  2. A long drought of mediocrity where they're tempted to lower standards
  3. An outstanding candidate who doesn't meet stated criteria but is clearly the best seen so far

  They explicitly want at least one outcome they won't like - no sugarcoating. Finally, they want transparency about where the procedure is actually judgment-based, and what its limitations are - particularly whether it can justify continuing past a candidate who cleared the bar.

  The user seems sophisticated about operations but time-constrained. Their frustration with bad hires and board delays suggests they need something robust yet pragmatic. The emphasis on theory translation indicates they value intellectual rigor but need executable steps. The request for unlikable outcomes shows they want honesty over reassurance.

  For the procedure, I'll structure it as a 6-step workflow: 
  1) Pre-search setup (defining the aspiration level) 
  2) Silver-medalist file check 
  3) Sequential candidate evaluation 
  4) Post-interview decision 
  5) Drought response protocol 
  6) Offer execution

  I'll define aspiration levels using three factors: must-haves (dealbreakers), nice-to-haves (weighted), and salary constraints. The updating mechanism should respond to market feedback - e.g., tightening standards if early candidates overshoot expectations, loosening slightly during droughts but with guardrails.

  For calibration, I'll include warning signs like consistently unmet must-haves or frequent near-misses, which suggest the bar is wrong rather than the pool being bad.

  The silver-medalist file breaks pure sequentiality, so I'll handle it as a parallel batch evaluation at search start. For cost changes, I'll show how higher costs compress timelines while lower costs allow stricter standards.

  In the cases: 
  - Case 1 should be a "no" despite clearing initial bar because references and gaps trigger unresolved concerns 
  - Case 2 shows calibrated lowering during drought but with a hard floor 
  - Case 3 forces a choice between rigid criteria and exceptional talent, favoring flexibility with board consultation

  I'll explicitly call out Case 1 as the unlikable outcome since it extends search despite an objectively qualified candidate. The judgment points will center on defining must-haves and weighting nice-to-haves. Key limitations: the procedure can't resolve value conflicts (e.g., tradeoffs between skills), and yes - it can validly continue past cleared-bar candidates if new information emerges during evaluation, which is a feature of intelligent satisficing.
answer: |-
  Here's a bounded-rationality satisficing procedure tailored to your constraints, translating Herbert Simon's theory into actionable steps. It prioritizes stopping a search over finding the theoretical "best," acknowledging your time limits, irreversible declines, and board delays.

  **Core Distinctions for Your Context:**
  - **Satisficing vs. Optimizing:** Satisficing sets a "good enough" bar and *stops* at the first candidate clearing it. Optimizing would compare *all* candidates to find the single best, which your process cannot do (irreversible declines, continuous stream).
  - **Stopping Rule vs. Choice Rule:** Your *stopping rule* ends the search when a candidate meets the aspiration level. Your *choice rule* is simple: hire that first satisfactory candidate. No complex comparisons needed.
  - **Sequential Search vs. Batch:** You search sequentially (candidates arrive one-by-one). The "silver-medalist" file is a *pre-searched batch* evaluated en masse *only at the start* of a new search for the *same role*.

  ---

  **The Satisficing Hiring Procedure: Step-by-Step**

  **Phase 0: Before Opening the Search (Aspiration Setting)**
  1.  **Define Your Aspiration Level ("The Bar"):**
      *   **Must-Haves (Non-Negotiables):** List 3-5 absolute requirements (e.g., "5+ years grant writing," "Valid driver's license," "Clean background check"). *Sufficient Answer:* Concrete, verifiable criteria. Failure on any = automatic "No."
      *   **Nice-to-Haves (Weighted Criteria):** List 5-7 desirable skills/experiences (e.g., "Nonprofit experience," "Fluency in Spanish," "Project management cert"). Assign each a weight (1-3, Low/Med/High importance). *Sufficient Answer:* Clear definitions and weights. Used to calculate a "Satisfice Score" threshold.
      *   **Satisface Score Threshold:** Decide the minimum weighted score a candidate needs from the Nice-to-Haves to be "good enough" (e.g., 12 out of 20 possible). *Set this HIGH initially.*
      *   **Salary Band:** Confirm the pre-approved band. *Sufficient Answer:* A clear min/max requiring no board approval.
      *   **Time Budget:** Acknowledge your 15 hrs/week limit. *Sufficient Answer:* A plan to track hours spent per candidate/search.

  **Phase 1: At Search Opening (Silver Medalist Check - Breaking Purely Sequential)**
  2.  **Evaluate the Silver-Medalist File First (It's a Mini-Batch):**
      *   Apply your *current* aspiration level (Must-Haves, Nice-to-Haves/Satice Score Threshold, Salary Band) to *all* runners-up in the file for this *specific* role.
      *   **Stopping Rule:** If *any* file candidate meets the aspiration level *and* is likely available (check quickly/respectfully):
          *   **STOP SEARCH.** Make an offer immediately. (This leverages past search effort).
      *   **Choice Rule:** If multiple qualify, offer to the one with the highest Satisface Score (simple optimization within this small, pre-vetted batch is feasible). If none qualify, proceed to sequential search.

  **Phase 2: Sequential Candidate Search**
  3.  **Evaluate Each New Candidate:**
      *   **Must-Haves:** Apply ruthlessly. Fail one? **STOP (No).** Document briefly. Move on.
      *   **Nice-to-Haves/Satisface Score:** If passes Must-Haves, score Nice-to-Haves. Calculate weighted score.
      *   **Salary Expectation:** Confirm verbally it fits the band *early* (e.g., initial screen). If not, **STOP (No)** unless you *know* you can/will get board approval *and* they are otherwise perfect.
      *   **Stopping Rule:** If candidate meets *all* Must-Haves, *scores >= Satisface Score Threshold*, *and* salary fits band: **STOP SEARCH.** Proceed to offer (Phase 3). *This is the core satisficing moment.*
      *   **Choice Rule:** Hire this candidate. No need to compare to past/future.
      *   **"No" Decision:** If they don't clear the bar, **STOP (No)** for this candidate. *Decision Point:* If they were strong but slightly below threshold (a true "silver medalist"), add them to the silver-medalist file *for this specific role*.

  **Phase 3: After Interviewing a "Bar-Clearing" Candidate (Due Diligence Check)**
  4.  **Verify and Gut Check:**
      *   **Fact Checks:** Verify critical claims (references, degrees, certs). *Sufficient Answer:* No material discrepancies found.
      *   **Unresolved Concerns:** Review notes for *any* significant, unresolved red flags or doubts raised during interviews/references (e.g., cultural fit worries, lukewarm reference, unexplained gap). *Sufficient Answer:* Concerns are either minor, explained satisfactorily, or outweighed by strengths.
      *   **Stopping Rule (Yes):** If facts check out and no *major* unresolved concerns exist, **MAKE OFFER.** Satisficing is achieved.
      *   **Stopping Rule (No):** If a *major* concern emerges here (e.g., bad reference revealing a must-have failure, lie discovered) that wasn't caught earlier, **STOP (No)** for this candidate. *Decision Point:* If they were otherwise strong, consider adding to silver-medalist file *only if the concern wasn't a disqualifying must-have*.
      *   **Judgment Call:** Deciding if a concern is "major" is inherently subjective. The procedure forces you to articulate it.

  **Phase 4: Drought Protocol (Updating Aspiration - Calibration)**
  5.  **Monitor Search Duration & Pool Quality:**
      *   Track weeks elapsed and hours spent (use your 15hrs/week budget as a guide).
      *   Track the *distribution* of candidate Satisface Scores. Are *any* clearing Must-Haves? Are scores clustering low?
      *   **Signals of Miscalibration (Bar Too High):**
          *   Multiple candidates pass Must-Haves *but consistently score just below* the threshold.
          *   *Zero* candidates pass Must-Haves after 4-6 weeks of active search (or ~60 hours invested).
          *   External data (e.g., industry reports) suggests your bar is unrealistic for the salary.
      *   **Signals of a Bad Pool (Bar Correct):**
          *   Many candidates *fail* Must-Haves for diverse reasons.
          *   Candidates passing Must-Haves have wildly *inconsistent* Nice-to-Have scores (some high, some low), suggesting variance, not uniform low quality.
          *   Your defined Must-Haves are highly specific and verified as essential.
      *   **Updating the Aspiration Level (Lowering the Bar):**
          *   **Only adjust the Satisface Score Threshold *downward*.** *Never* lower a Must-Have (that's redefining "good enough" fundamentally).
          *   Lower incrementally (e.g., reduce threshold by 1-2 points). Reset your "clock" (mentally note you've adjusted).
          *   **Hard Floor:** Set an absolute minimum threshold before search must be paused/rethought (e.g., "Will not hire below 8/20").
          *   **Increased Search Cost?** (e.g., urgent vacancy, board pressure): You *might* lower the threshold *sooner/faster*. **Decreased Search Cost?** (e.g., less urgent): You can hold the threshold longer. *The core satisficing logic remains – accept the first over the (new) threshold.*

  **Phase 5: Offer & Board Process**
  6.  **Execute Offer:**
      *   If salary is within band: Make verbal offer immediately upon stopping search. Follow up formally.
      *   If salary *requires board approval* and candidate clears the bar:
          *   **STOP SEARCH.** Notify candidate offer is pending board approval (be transparent on timing).
          *   **Board as Gatekeeper:** This is a values/approval step outside pure satisficing. If the board rejects, *the candidate failed the aspiration level* (salary was a Must-Have conditional on approval). Restart search, potentially adjusting salary band aspiration if this repeats.

  ---

  **Running the Cases (As Requested - One Unlikable Outcome)**

  1.  **The Early "Bar-Clearer" with Red Flags:**
      *   **Procedure:** They clear Must-Haves and Satisface Score in Phase 2. You STOP sequential search. You enter Phase 3 (Due Diligence).
      *   **Unexplained Gap & Lukewarm References:** These are *major unresolved concerns* identified in Phase 3. References failing to endorse strongly contradicts the "cleared bar" on paper. The gap remains unexplained.
      *   **Decision:** **STOP (No)** for this candidate. Do *not* add to silver-medalist file (concerns are significant). Restart sequential search. **This is the unlikable outcome.** Satisficing doesn't mean ignoring red flags found *after* the initial bar-clear but *before* offer. The aspiration level includes passing due diligence. Continuing the search is the correct, if frustrating, procedure.

  2.  **The Long Drought of Mediocrity:**
      *   **Procedure:** After 5 weeks (approx 75 hours), few pass Must-Haves, none meet the original Satisface Threshold (e.g., 14/20). Scores of those passing Must-Haves cluster around 10-12.
      *   **Calibration:** This signals potential miscalibration (bar too high). Pool isn't *bad* (some pass Must-Haves), but threshold is unrealistic. You enter Phase 4 (Drought Protocol).
      *   **Update:** Lower the Satisface Threshold incrementally (e.g., from 14 to 12). Reset your mental clock.
      *   **Decision:** Continue sequential search. Hire the *next* candidate who passes Must-Haves and meets the *new* threshold (12). Do *not* hire a mediocre candidate *before* formally adjusting the threshold down. Satisficing continues with the updated aspiration.

  3.  **The Outstanding Mismatch:**
      *   **Procedure:** Candidate passes all Must-Haves. Salary fits band. However, their Nice-to-Have profile is *unusual* – weak on some weighted criteria (e.g., "Nonprofit Experience" = Low score) but exceptionally strong on others you hadn't emphasized (e.g., "Cutting-edge Tech Skills").
      *   **Satisface Score:** They score *below* your current threshold because your weights didn't value their unique strengths highly.
      *   **Judgment Call / Values Decision:** The procedure hits a values boundary. Do their exceptional strengths in *new* areas fundamentally redefine "good enough" *more* than meeting the original threshold? **The procedure CANNOT decide this.**
      *   **Action:** This is a "STOP (Pause)" for judgment. Ask: "Does this candidate's *actual* potential contribution *satisfice* my *underlying need* for this role *better* than someone meeting my original numeric threshold?" If **YES** (judgment call!), treat them as clearing the bar. **STOP SEARCH.** Hire them. *Optional:* Recalibrate future aspiration levels based on this insight. If **NO**, **STOP (No)** for this candidate, but *strongly consider* adding them to the silver-medalist file – they might clear the bar easily in a future search for a slightly different role or if weights change.

  ---

  **Honest Assessment: Judgment Calls & Limitations**

  *   **Judgment Dressed as Procedure:** Key judgment points are inherent and unavoidable:
      *   Defining **Must-Haves** and **Nice-to-Haves** (What is *truly* essential?).
      *   Setting the initial **Satisface Score Threshold** (What's "good enough"?).
      *   **Weighting Nice-to-Haves** (How important is each, really?).
      *   Phase 3: Deciding if a concern is **"major"** enough to veto a bar-clearer.
      *   Phase 4: Interpreting signals to decide **miscalibration vs. bad pool** and *how much* to lower the threshold.
      *   The **Outstanding Mismatch** case is pure judgment on values/needs.
  *   **What the Procedure CANNOT Do:**
      *   Resolve fundamental value conflicts (e.g., "Is deep nonprofit experience *or* cutting-edge tech skill more critical for our future?"). It assumes these are settled in setting the aspiration level.
      *   Guarantee a good hire. It minimizes the *risk* and *cost* of a bad hire *given constraints*, but any hire is a risk.
      *   Optimize. You *will* miss theoretically "better" candidates who apply later or whom you declined earlier.
      *   Handle complex batch comparisons beyond the initial silver-medalist check. Your process is fundamentally sequential.
  *   **Continuing Past a Cleared Bar:**
      *   **YES, the procedure *can* instruct you to continue searching *after* a candidate seemingly cleared the initial bar.** This is a *genuine feature*, not a failure.
      *   **When?** *Only* if Phase 3 (Due Diligence) reveals significant, disqualifying information (lies, bad references, major unresolved concerns like the gap in Case 1) that means the candidate *does not actually meet the aspiration level* once fully scrutinized. The aspiration level isn't just a paper screen; it includes being hireable after standard due diligence. Continuing is correct in this case.
      *   **It CANNOT** instruct you to continue *just because* a candidate *only just* cleared the bar and you *think* someone better *might* come later. That violates the core satisficing stopping rule.

  This procedure forces you to define "good enough" upfront, leverages your silver-medalist file efficiently, provides a clear stopping point to avoid perpetual searching, incorporates a mechanism to adjust for reality (droughts), and flags when judgment on values is truly needed. It accepts that rejecting an early qualifier with red flags (Case 1) is sometimes necessary, even if costly.
