  Below is a case study designed to your specifications, set in a fisheries research context. It illustrates the problem of old evidence, with a focus on the divergence between the counterfactual and logical-fact repairs. The case is followed by detailed bookkeeping, analysis of the repairs, and responses to your queries.

  ### Case Study: Fish Population Dynamics
  In a fisheries research institute, scientists study the population dynamics of Atlantic cod in a specific region. The veteran researcher, Dr. Aris, has known for years that the average annual catch per unit effort (CPUE) has been stable at 12.5 kg/hour (evidence E). This stability is well-documented and uncontested. Dr. Aris formulates a hypothesis H: "The cod population growth rate follows a logistic model with carrying capacity \( K = 10,000 \) tons and intrinsic growth rate \( r = 0.4 \) per year." She explicitly chose \( K \) and \( r \) to ensure that her model perfectly predicts the observed CPUE stability (E). For Dr. Aris, E is old evidence with credence 1, and H was constructed solely to accommodate E; the fit is not a discovery but a built-in feature. A newcomer, Dr. Bly, joins the institute and encounters H and E simultaneously. For Dr. Bly, who had no prior knowledge of E, learning E significantly boosts her credence in H, as the model’s prediction matches the data.

  ### Bookkeeping: Credences and Repairs
  **Assumptions and Setup**:
  - **Hypotheses and Evidence**: 
    - H: Logistic model with \( K = 10,000 \), \( r = 0.4 \).
    - E: Stable CPUE of 12.5 kg/hour.
  - **Probability Model**: We discretize possible growth models. The parameter space includes:
    - \( H \): The specific logistic model (\( r = 0.4, K = 10,000 \)).
    - Alternatives: 99 other logistic models with different \( r \) and \( K \) (e.g., \( r = 0.3, K = 8,000 \); \( r = 0.5, K = 12,000 \); etc.), each equally likely a priori. E is likely under H but improbable under alternatives (details below).
  - **Newcomer’s Prior (Dr. Bly)**: Uniform over 100 models, so \( P_{\text{newcomer}}(H) = 0.01 \).
  - **Veteran’s Credence (Dr. Aris)**: She knows E with credence 1 and has framed H to accommodate E. Her credence in H is based on posterior given E (computed below).

  **Computing Credences**:
  1. **Newcomer (Dr. Bly)**:
     - Prior \( P(H) = 0.01 \).
     - Likelihood \( P(E|H) \): High. H was tailored to E, so \( P(E|H) \approx 1 \) (E is a deterministic consequence of H).
     - Likelihood \( P(E|\neg H) \): Low. E is stable CPUE, but other models imply instability or different values. Assume \( P(E|\neg H) = 0.01 \) (averaged over 99 alternatives).
     - Posterior \( P(H|E) = \frac{P(E|H) \cdot P(H)}{P(E)} = \frac{1 \cdot 0.01}{(1 \cdot 0.01) + (0.01 \cdot 0.99)} = \frac{0.01}{0.01 + 0.0099} \approx 0.502 \).
     - **Boost from E**: \( 0.502 - 0.01 = 0.492 \) (substantial, as required).

  2. **Veteran (Dr. Aris)**:
     - Credence in E is 1 throughout (given).
     - Since H was framed to accommodate E, her prior was always conditioned on E. She has no "pre-E" state. Her current credence in H is the posterior given E, which matches the newcomer’s posterior: \( P_{\text{veteran}}(H) = P(H|E) \approx 0.502 \).

  3. **Counterfactual Veteran (for Counterfactual Repair)**:
     - Stipulation: An agent identical to Dr. Aris *except* she has not learned E. Since H was defined using E, we must stipulate that in this counterfactual, she has the same hypothesis space (including H) but without conditioning on E. Her prior over models is uniform, matching the newcomer: \( P_{\text{cf}}(H) = 0.01 \).
     - Upon learning E, she updates identically to the newcomer: \( P_{\text{cf}}(H|E) \approx 0.502 \).
     - **Counterfactual Boost**: \( 0.502 - 0.01 = 0.492 \) (spectacular, as it nearly doubles the credence and carries H to majority belief).

  **Logical-Fact Repair**:
  - What the veteran "learns" is not E (which she already knows) but a logical fact: "H entails E" or "H makes E highly probable." However:
    - Since H was constructed *from* E, the entailment \( H \models E \) is already known to her; it is not new evidence.
    - Conditioning on this logical fact (e.g., \( L \): "H predicts E with probability 1") does nothing. Her credence in H remains \( P_{\text{veteran}}(H) = P(H | E, L) \). But \( L \) is already accounted for in her model, so \( P(H | E, L) = P(H | E) \approx 0.502 \).
  - **Boost from Logical Fact**: \( 0.502 - 0.502 = 0 \) (almost none).

  ### Why the Repairs Diverge
  - **Structural Feature Doing the Work**: Condition (iv)—H was framed to accommodate E. This makes the fit between H and E a *definitional consequence* rather than a novel prediction. For the veteran, the relationship \( H \models E \) is old information, so learning the logical fact \( L \) adds nothing. The counterfactual repair, however, ignores this history and measures support in a hypothetical state where H exists independently of E, leading to a large boost.
  - **Why the Logical-Fact Verdict Seems Right**: E cannot confirm H for the veteran because H was reverse-engineered from E. The "fit" is engineered, not empirical. Boosting H based on E would be circular—like being impressed that a key fits a lock it was designed for.

  ### Attacking the Case: Counterfactual Repair Defender's Response
  - **The Attack**: The defender argues that you have smuggled in a difference beyond the absence of E. Specifically, the counterfactual veteran is not "otherwise identical" because her hypothesis space in the counterfactual state includes H *as a serious contender*, whereas in reality, H only exists *because* of E. By stipulating that H is present in the counterfactual prior, you violate the "identical agent" requirement.
  - **Can the Reply Be Made Good?**:
    - **Yes, with caveats**: The defender can insist that for the counterfactual repair to work, we must assume H is "available" independently of E. This might require positing a minimal hypothesis space where H is defined a priori (e.g., all logistic models are mathematically possible). If we accept this, the counterfactual boost (0.492) measures support without contradiction.
    - **But It Undermines the Repair's Claim**: The veteran *never* inhabited a state where H was available without E—H is epistemically dependent on E. Thus, the counterfactual repair measures support in a scenario disconnected from the veteran’s actual epistemic history. It does not reflect the support *she actually has*, which is based on accommodating E. The repair becomes a measure of "what-if" support, not actual confirmation.

  ### Dropping Condition (iv): Genuine Prediction
  - **Modified Case**: Suppose Dr. Aris formulates H *before* E is known, based on theoretical ecology. E (stable CPUE) is then observed and fits H as a novel prediction.
  - **Effect on Repairs**:
    - **Counterfactual Repair**: Still reports a large boost (0.492) for the counterfactual veteran.
    - **Logical-Fact Repair**: Now, when the veteran learns E, she *also* learns the new logical fact \( L \) ("H entails E"). Conditioning on \( L \) (in a repartitioned space) raises her credence. For instance, if she had not fully appreciated the entailment, \( P_{\text{veteran}}(H) \) might jump from (say) 0.01 to 0.502 upon learning \( L \).
  - **Divergence and Asymmetry**:
    - The repairs now converge: Both report significant confirmation (≈0.492 boost).
    - **Asymmetry Defensibility**: The veteran-newcomer asymmetry remains defensible. The veteran updates on E *once* (when she first learns it), while the newcomer updates when she encounters E. But since the veteran’s credence already incorporates E, she gains no *additional* confirmation from re-encountering it—unlike the newcomer. This resolves the puzzle: Old evidence confirms, but only for those who haven’t already updated on it.
  - **Is the Puzzle Resolved?** In this case, yes. The asymmetry is natural: Evidence learned at time \( t \) confirms for agents who haven’t updated by \( t \). The logical-fact repair handles old evidence via learning entailments, while the counterfactual repair handles it via hypothetical updating. Both work when H isn’t accommodation-based.

  ### Conclusion
  This case achieves your goals by exploiting the accommodation-prediction asymmetry (condition iv). The counterfactual repair reports spectacular confirmation (0.492 boost), while the logical-fact repair reports near-zero, correctly reflecting that engineered fit provides no new support. The defender of the counterfactual repair can protest the stipulation of H in the counterfactual prior, but this undermines the repair’s relevance to the actual agent. When (iv) is dropped, the repairs converge, and the asymmetry becomes unproblematic. The case suggests the old evidence puzzle is resolvable when accommodation is distinguished from prediction.
