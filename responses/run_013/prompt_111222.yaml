answer: |-
  ## The Exam You Didn't See Coming (And Neither Did I)

  [Warm smile, look out at the crowd] Faculty colleagues, distinguished guests, proud parents and grandparents… and you. The Class of [Year]. Congratulations. Truly.

  Now, I know what you’re thinking. “The philosophy professor? Giving the commencement speech? Oh boy, strap in folks, it’s gonna get *abstract*.” Don’t worry. I promise no quotes in dead languages, no impenetrable jargon, and absolutely no mention of [glances down, pretends to check notes]… Immanuel Kant. [Small chuckle]. My goal is simpler: to talk about the future. Specifically, the *kind* of future we’re all told you’re supposed to have.

  It reminds me of something that happened in a logic class I taught a while back – a class about half of you sitting right here endured with remarkable patience. [Nod to graduates]. Imagine, if you will, a teacher standing before their students on a Monday morning. The teacher says: “Sometime this week, there will be an exam. And here’s the catch: it will be a *surprise*. You won’t know the day before that it’s happening the next day.”

  Seems straightforward, right? A bit annoying, maybe, but manageable. But then… the students start thinking. Really thinking. They look at the calendar. Friday. “Ah,” one bright spark says. “It can’t be Friday! Because if we got to Thursday evening and no exam had happened, we’d *know* it *had* to be Friday. So Friday wouldn’t be a surprise! Friday’s out.”

  Makes a weird kind of sense. So, Friday is eliminated. Then they look at Thursday. “Well,” reasons another, “if Friday’s impossible, and we got to Wednesday evening with no exam… we’d *know* it had to be Thursday! So Thursday wouldn’t be a surprise either. Thursday’s out.” And so it goes. Wednesday? Out. Tuesday? Out. Even Monday? Out. By their own impeccable logic, the surprise exam becomes impossible! It simply *cannot happen*.

  [Leans in conspiratorially] And then… the teacher gives the exam on Wednesday. And it *is* a complete surprise. The students are genuinely caught off guard. They proved it couldn’t happen… and yet, there it was.

  [Pause, shift tone to more reflective]

  What went wrong? Where did that tidy, logical prediction fail? It seems the students made one crucial mistake. They treated “surprise” like it was a property of the *exam itself*. Something inherent, like the paper it was printed on or the questions it asked. They thought that if they could *prove*, logically, that an event couldn’t *be* a surprise, then it *couldn’t* surprise them. They confused the map for the territory. They confused *knowing about a possibility* with *knowing the actual event*.

  But surprise… surprise isn’t stamped on the event by the universe. Surprise happens *inside us*. It’s the gap between what we *expected* to happen and what *actually* happens. It’s the stubbed toe when you thought the step was lower. The parking ticket when you were *sure* you had five more minutes. The phone call offering a job you didn’t think you’d get. The moment you realize you’re completely, unexpectedly, in love. Or the moment life takes a sharp, unplanned turn you never saw coming.

  [Addressing the graduates directly]

  We do this to you all the time. We hand you this metaphorical syllabus for life: Graduate. Get the job (or the next degree). Climb the ladder. Find the partner. Buy the house. Have the family. Hit the milestones. Check the boxes. We lay it out like a predictable schedule, a logical progression. We make it seem like you can reason your way out of the unexpected, just like those students reasoning away the exam. We imply that if you just plan meticulously enough, work hard enough, follow the steps… you’ll eliminate surprise. You’ll know what’s coming on Wednesday.

  But here’s the thing graduates: **Life is not a syllogism.** Ambition isn’t a spreadsheet. Disappointment doesn’t follow a formula. And joy? Joy rarely arrives according to itinerary.

  [Turning to include parents/grandparents]

  And you know this. [Nodding to parents section] You’ve lived it. Think back. Did your life follow the script you imagined at 22? Did the biggest moments – the ones that truly shaped you, for better or worse – arrive neatly scheduled, announced with ample notice? Or did they burst in? The unexpected job relocation? The chance meeting that changed everything? The curveball of illness, or the unforeseen opportunity that appeared out of nowhere? The profound, quiet realization that what you thought you wanted wasn't what you needed? You know the unexpected isn't just possible; it's inevitable. It's the texture of the thing.

  The students in that story made the mistake of thinking that because they could imagine all the possibilities, they could control when reality would show up. They thought predicting the *absence* of surprise meant they were immune to it. But life doesn’t care about your elegant proofs. Reality has a way of showing up on Wednesday, regardless.

  [Back to graduates, warmer, more intimate tone]

  So, what does this mean for you, standing here on the brink? It doesn’t mean don’t plan. Planning is useful! It gives you direction, a place to push off from. But clinging too tightly to that plan? Believing it’s a shield against the unforeseen? That’s the trap. That’s where disappointment festers – not just when things go wrong, but when they stubbornly refuse to go *according to plan*, even if they go wonderfully right in an utterly unexpected way.

  The paradox teaches us that surprise isn’t a failure of your logic or your planning. Surprise is a fundamental condition of being human in a vast, complex, beautifully uncertain world. It’s the space where growth happens. Where resilience is forged. Where true discovery lies. The most profound lessons, the deepest connections, the most significant turning points… they often arrive unannounced. They don’t respect your carefully reasoned timeline.

  Therefore, graduates, my charge to you isn’t to “follow your dreams” as if they’re a fixed destination on a known map. My charge to you is this: **Cultivate surprise.**

  Develop the courage to leave room for it. The wisdom to recognize it when it arrives – even if it looks like a setback at first. The flexibility to adapt when your perfect logical Friday vanishes and Wednesday demands your presence. Learn to live not just *according* to plan, but *in conversation* with the unexpected.

  Be open to the exam showing up on Wednesday. Or Tuesday. Or on a day you never even penciled in. Be ready for the profound surprise of discovering who you become when the plan dissolves. That discovery – the one you absolutely cannot reason your way towards in advance – is often the most important one of all.

  [Pause, looks down, then back up with a slightly wry smile]

  So. What comes next? What does your future hold? What triumphs, what challenges, what moments of sheer, breathtaking surprise await you?

  [Shrugs, palms open]

  I have absolutely no idea.

  And frankly… that’s the point. That’s the beautiful, terrifying, exhilarating truth of it. Your story isn’t written yet. It’s waiting to surprise you.

  Congratulations, Class of [Year]. Go get wonderfully, magnificently, surprisingly lost. And may your Wednesdays be extraordinary.

  [Steps back, nods] Thank you.
