  Okay, the user is worried about their roommate Marcus who's planning to bet a large portion of his $30k savings on what he believes is a 60% chance event at even money. Marcus wants to let it ride repeatedly, thinking it's a positive EV move each time. The user's gut says this will lead to ruin, but Marcus argues about maximizing expected value, especially since he sees this as a one-time opportunity.

  First, I need to address the core issue: why is repeated all-in betting dangerous despite each bet being +EV? The key here is risk of ruin. Even with a 60% win chance, betting everything means a 40% chance of losing it all in one go. If Marcus wins the first bet, he doubles up and bets everything again. The probability of surviving multiple bets decreases exponentially. For example, after three bets, the chance he still has money is only 0.6^3 = 21.6%. So over time, ruin becomes almost certain.

  Next, the Kelly Criterion. This is crucial for optimal betting fractions. With a 60% win probability and even odds, the formula is f = p - q = 0.6 - 0.4 = 0.2. So Marcus should bet 20% of his bankroll each time. Betting more increases risk without sufficient reward. The charts showing growth rates and risk of ruin would help visualize why 20% is optimal.

  Now, Marcus's argument that it's a one-shot opportunity. Even for a single bet, maximizing expected dollars isn't necessarily rational because of the non-linear utility of money. Losing $15k hurts more than gaining $15k helps, relatively speaking. Expected value doesn't account for the utility function. For a one-time bet, if Marcus has a $30k bankroll, the expected value of betting it all is $36k, but with a 40% chance of zero. Betting 20% ($6k) gives an expected value of $33.6k, which is lower than $36k, but the risk is much lower. The certainty equivalent concept could explain why a risk-averse person would prefer the smaller bet.

  I should also discuss the long-run perspective versus one-shot. While Marcus claims it's a one-time bet, the user mentions "the next one of these." If there's any possibility of repeated bets, the Kelly fraction becomes essential to avoid ruin and maximize growth. Even for a single bet, considering utility, betting everything isn't optimal. Also, psychological impact: losing everything could prevent Marcus from taking future opportunities.

  Concrete numbers: for a $30k bankroll, Kelly says bet $6k. If he wins, new bankroll $36k, next bet $7.2k, etc. Compare this to all-in: after one win, $60k; after two wins, $120k. But the chance of two wins in a row all-in is 36%, versus 84.6% with fractional Kelly (if he bets half Kelly, 10%). The risk of dropping below $15k is much higher with all-in.

  Rebuttal to "maximize expected value": expected value is linear, but utility isn't. Losing everything has catastrophic utility. Also, expected value doesn't consider the sequence of bets. For repeated bets, growth rate matters more. The Kelly Criterion maximizes the log growth rate, which is the expected value of the logarithm of wealth. This avoids ruin and maximizes long-term growth.

  Practical advice: Marcus should consider his total wealth and risk tolerance. If $30k is all he has, betting even 20% might be too aggressive. The user should present the math, show risk of ruin calculations, and explain utility. Emphasize that while each bet is +EV, the strategy of all-in leads to certain ruin over time. Suggest starting with a smaller fraction to demonstrate, or using simulations to show outcomes.
