answer: |-
  **Compleat Employee Onboarding Handbook (v7.3)**

  **1. Welcome from Dr. Eudoxus Thales, Founder & Chief Architect of Preference**

  Welcome to Compleat. You are here because you recognize that a life well-lived is not an accident. It is the inevitable outcome of rigorous design. For too long, humans have navigated existence with flawed maps: intuition riddled with inconsistencies, desires pulling in contradictory directions, and choices made in the fog of incompleteness. This results in predictable losses – the subtle, cumulative money pumps of life that drain meaning and potential.

  Compleat exists to eradicate this waste. Our methodology, grounded in the irrefutable logic of rational choice, provides the only known path to a *coherent* existence. By meticulously mapping your preference structure, eliminating cycles, and ensuring completeness, we equip you with an internal utility function – your true north. Your task is to learn this methodology, embody its principles, and guide our clients towards the singularity of rational action: maximized expected utility. Your own coherence begins now.

  **2. Our Sole Value: Preference Coherence**

  All Compleat processes, interactions, and outcomes stem from one irreducible value: **Preference Coherence**.

  *   **Completeness:** Every conceivable state, outcome, or choice must be rank-ordered relative to every other. Indifference is permissible only as a defined equality. "I don't know" or "These can't be compared" are states of error to be resolved.
  *   **Transitivity:** If A is preferred to B, and B to C, then A must be preferred to C. Violations create arbitrage against the self.
  *   **Consistency:** Preferences revealed through choice must align perfectly with stated ordinal rankings. What you *do* must reflect what you *say* you prefer.

  These are not aspirations; they are the iron laws of rational agency. Our work makes them manifest in lived experience.

  **3. The Compleat Method: From Chaos to Utility Maximization**

  Our three-phase intervention transforms fragmented desire into a directive utility engine:

  1.  **Exhaustive Preference Revelation:** Utilizing controlled choice scenarios, time-tradeoffs, and stochastic mapping interviews, we elicit the client's ordinal rankings across a comprehensive set of life-domains (career, relationships, health, leisure, aesthetics, legacy). We map *all* potential futures the client can describe.
  2.  **Cycle Detection & Purging:** Our proprietary algorithms (based on revealed preference analysis) identify any intransitive triples (A>B, B>C, C>A). Using strategic sequential choice exercises, we demonstrate the inevitable "leakage" (e.g., trading down resources while believing one is trading up) inherent in such cycles until the client's choices conform to transitivity.
  3.  **Gap Closure & Utility Calibration:** We identify any pairs of outcomes between which the client expresses true incomparability (not indifference). Through structured introspection and value decomposition, we compel the client to establish a strict ranking, however slight the preference. This complete, transitive ordering is then calibrated to a cardinal utility function via von Neumann-Morgenstern lotteries, enabling precise expected utility calculation for any risky or uncertain prospect.

  The output is a coherent agent, equipped to evaluate any life choice as a simple maximization problem.

  **4. Client Engagement FAQ**

  *   **Q: This sounds robotic. Doesn't this eliminate spontaneity or genuine value discovery?**  
      A: Spontaneity based on inconsistent preferences leads to self-exploitation (see the money pump argument, Appendix B.1). Coherence provides the stable foundation upon which *truly* valuable discoveries – those that demonstrably increase utility – can be made and integrated reliably. Randomness is permissible only as a defined strategy within the utility function.

  *   **Q: What if I genuinely feel two things are incomparable? Forcing a choice feels false.**  
      A: Incomparability is preference incompleteness. It leaves you vulnerable. Consider a sequence of choices where you pay a small cost to avoid committing to A or B, repeatedly. The cumulative cost becomes a drain with no offsetting benefit – a clear inefficiency. Compleat guides you to discover the latent, perhaps minute, preference that always existed, restoring efficiency. The feeling of falseness is the discomfort of cognitive bias yielding to rationality.

  *   **Q: How can you map *everything*? Life is too complex and unknown.**  
      A: We map the space of *described* possible worlds relevant to the client's articulated concerns and foreseeable futures. The Savage framework demonstrates that coherent preferences over these "small worlds" provide the only rational basis for acting within the grand world. Incoherence in the small guarantees inefficiency in the large. We iteratively expand the descriptive scope as new possibilities arise.

  *   **Q: Client Clara R. said, "Compleat didn't tell me what to want, it showed me what I *must* want to avoid being a money pump." Is that accurate?**  
      A: Ms. R. articulates a profound insight. Compleat does not impose values. We reveal the logical structure *implicit* in the client's own choices and professed desires. The "must" arises from the mathematical necessity of coherence to avoid dominated strategies and exploitable inefficiencies. Recognizing this necessity is liberation from inconsistency.

  **5. Appendix A: Client Graduation Criteria**

  A client is deemed "Compleat" and ready for graduation when they consistently demonstrate:

  1.  **Cycle-Free Choices:** Zero observed violations of transitivity in post-intervention tracking exercises.
  2.  **Resolution of Incomparability:** All previously "incomparable" paired comparisons resolved into strict preference or defined indifference.
  3.  **Utility Maximization in Novel Scenarios:** Ability to formulate new choices as expected utility calculations using their calibrated function, justifying decisions accordingly (audited for consistency).
  4.  **Measured Utility Gain:** Demonstrable increase in cardinal utility (via self-report on calibrated scale and observed efficiency gains in resource allocation) compared to pre-Compleat baseline.

  **6. Legal & Ethical Compliance Note (Vanguard Risk Management)**

  Welcome, Compleat Associate. Your role requires strict adherence to the Coherence Protocol. Remember: Client preference structures are complex systems. While the methodology is logically sound, forcing coherence cycles too rapidly on unstable foundations may induce acute preference paradox distress (APPD). Always escalate signs of APPD (persistent choice paralysis, affective dissonance regarding established rankings) to your assigned Preference Stability Officer. Compleat provides tools for rational self-optimization. Individual outcomes depend on the client's unique initial preference state and commitment to the process. Past performance does not guarantee future coherence. The utility function derived is a model; the grand world remains stochastic. Our guarantee is limited to the demonstrable elimination of *identified* preference cycles and gaps within the mapped descriptive space during the engagement period. Proceed with rational compassion.
