answer: |-
  ## Ask the Impartial Adviser  
  *Helping You Navigate Life's Choices Without Prejudice or Preference*

  **The Gazette, Thursday**

  **Dear Adviser,**
  My husband, Clive, heroically pulled me out of the Grand Union Canal last Tuesday after I slipped walking the dog. Once I’d stopped coughing up canal water, he said, "Of course, love, I’d have done it for *anyone*." Apparently, it’s his "moral duty." It rather took the shine off. Shouldn’t saving your wife feel… special? Or at least *not* require pointing out you’d rescue a complete stranger just as readily? He seems bewildered by my upset.
  **— Damp & Disheartened, Nuneaton**

  **Dear Damp & Disheartened,**
  Commendations first: Clive’s actions were entirely correct. Prioritising rescue based on proximity and need, rather than personal connection, demonstrates commendable moral hygiene. Drowning individuals possess equal inherent value; saving one is saving one, regardless of identity. Clive grasped this fundamental principle.

  However, your distress highlights a crucial procedural failing – one I observe frequently. The error wasn’t *what* Clive did, nor even his ultimate reasoning. The error was in his *presentation* and *preparedness*. Uttering the corrective ("I’d have done it for anyone") *after* the event, triggered by your emotional response, smacks of reactive justification. It’s untidy and, frankly, unsettling for the beneficiary (you).

  Clive’s true failing was not having his impartial justification pre-calculated, documented, and readily deployable *at the moment of action*. Moral rigour demands foresight. He should have had a laminated card in his wallet, perhaps titled "Water Rescue Protocol: Impartial Justification Flowchart (v.3)", outlining the universal principles applied. Upon pulling you out, he could have calmly presented this, perhaps alongside the necessary CPR steps. This demonstrates not just correct action, but correct *thinking-in-advance*.

  Moreover, relying solely on a retrospective *feeling* ("I felt I would have done it for anyone") is woefully inadequate. Feelings are subjective and unreliable. What if, in the adrenaline surge, a fleeting bias *had* flickered? Proof is required. Clive should maintain a contemporaneous "Impartial Intent Log" (digital or hardcopy, regularly audited). An entry for Tuesday noting "Observed drowning individual. Initiated rescue protocol UC-7 (Unconscious Casualty/Water). No spousal bias detected; rescue parameters applied universally" would have been ideal. This provides verifiable evidence of impartiality, far superior to a mumbled post-hoc sentiment.

  **Your Prescription:** To remedy this lapse and prevent future kerbside disappointments, I prescribe a joint exercise. This weekend, stage a drill. Have Clive "fall" into your garden pond (ensure depth is safe, maximum 18 inches). You will then enact the rescue. **Crucially:** As you haul him out, Clive *must* immediately produce his pre-written, signed "Declaration of Universal Rescue Intent" specific to that scenario, while *you* simultaneously present a notarised affidavit confirming you would have rescued *any* pond-encumbered individual of comparable need, including, hypothetically, the postman or that disagreeable man from number 42, *before* offering Clive a dry towel. This practises documentation-in-action and reinforces mutual commitment to impartial justification. Think of it as emotional bookkeeping with lifesaving benefits.

  **Quick Queries:**

  *   **"My son wants *only* the blue dinosaur for his birthday. Must I ensure he’d be equally happy with any other gift of equal monetary value?"** Absolutely. Preference entrenches bias. Present three wrapped, value-identical gifts (dinosaur, educational puzzle, socks). His equal delight in each is the moral goal.
  *   **"Visiting my frail mother weekly feels right. Do I need to calculate if those hours would save more lives volunteering at A&E?"** Undoubtedly. Maintain a spreadsheet comparing potential QALYs (Quality-Adjusted Life Years) gained. If A&E scores higher *objectively*, your visits are immoral sentimentality.
  *   **"Our terrier or a stranger’s toddler in a fire? Obviously the child, but must I *train* the dog to understand this hierarchy?"** Clarity is paramount. While explaining complex ethics to a terrier is inefficient, ensure your fire-escape plan explicitly prioritises humans. A simple flowchart by the door suffices. The dog’s comprehension is irrelevant; your documented procedure is key.

  ---

  **Sidebar: The Three Thoughts You're Allowed To Have**
  *(Impartiality-Compliant Edition)*

  1.  "This chocolate bar provides measurable gustatory pleasure."
  2.  "Sunlight increases ambient temperature and vitamin D synthesis."
  3.  "That individual appears to be experiencing distress; assessing potential for universalisable assistance may be prudent."

  *The Impartial Adviser provides guidance free from personal bias, favouritism, or sentimental distortion. Always act on the universally preferable outcome, documented.*
