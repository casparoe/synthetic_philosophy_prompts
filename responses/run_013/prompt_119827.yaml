prompt: |-
  Hi, I could really use some help writing something up and I'm not sure how to frame it.

  I'm on the board of a small arts nonprofit — we're all volunteers, nobody's an expert, we just care about the place. Last month we had to choose between three finalists for the director job, and honestly the way it went down was embarrasing. One of us spoke first, said she had a good feeling about finalist #2, and inside of ten minutes all seven of us had "agreed" on #2. Two people told me in the parking lot afterward that they'd actually leaned toward #1, but they figured the rest of us must know something they didn't. And here's the part that really bothers me: if she'd said #1 first, I'm pretty sure we'd have "agreed" on #1 instead. Noone was lying, nobody got bullied, everyone just... deferred. (The annoying part is that #2 turned out fine, so I can't even point to a disaster — I just don't trust how we got there.)

  I want to bring a proposal to the next meeting, but my two ideas kind of fight each other and I can't tell which to push. Idea one: the night before, we each email the secretary our pick plus one sentence of why; at the start of the meeting she reads them all out without saying who wrote what; then we discuss; then we vote on paper. Idea two: the secretary assigns each of us a different finalist to argue *for* out loud, no matter who we actually prefer, so that every candidate has to get a real case made for them.

  My worry with idea one is that it might not fix anything, since we all read the same three resumes and the same reference calls — so even if I'm "deciding on my own," I'm deciding on the same thin information as everyone else, and we could all just be confidently wrong together. My worry with idea two is that it feels like manufacturing disagreement, like I'm asking my friends to argue for someone they don't believe in, and maybe that just adds noise and burns an evening for nothing.

  Could you write the memo I'd send the board before the meeting? I want it to recommend one concrete thing we should actually do for the next hire — specific steps, who does what, when — and to be honest about the case against me, because if there's a real reason we should just let people defer to whoever seems most informed, I'd rather find out now than after the next hire. End it with something we can actually vote on, and keep it short enough that people will really read it. Also please don't make it sound like I'm calling anyone a sheep; half these people are my friends. Thanks!!
reasoning: |-
  Okay, the user is on the board of a small arts nonprofit and they're struggling with how to handle group decision-making for hiring a director. They described a situation where the board quickly "agreed" on a candidate because one person spoke first, and others deferred without expressing their true preferences. They want to propose a better method for the next hire but are torn between two ideas. 

  First, I need to understand the core problem: groupthink. The board members didn't feel comfortable voicing dissenting opinions, leading to a decision that might not have been fully vetted. The user mentioned that even though the chosen candidate worked out fine, the process felt flawed. 

  The user's two ideas have pros and cons. Idea one (private initial votes with reasons) aims to prevent early influence but might not add new information since everyone has the same data. Idea two (assigned advocacy) ensures all candidates get a fair hearing but could feel artificial and time-consuming. 

  The user's deeper needs include preserving relationships (they don't want to offend friends), ensuring a trustworthy process, and avoiding wasted time. They also want honesty about potential downsides. 

  I should recommend one method clearly. Idea one seems more practical and less confrontational. It addresses the immediate issue of premature consensus by collecting independent opinions upfront. The anonymity reduces pressure to conform. While it doesn't generate new info, it surfaces diverse perspectives that might have been silenced in open discussion. 

  For the memo, I'll: 
  - Frame this as improving process quality, not fixing past mistakes 
  - Present the method as a neutral experiment 
  - Include concrete steps and a clear voting ask 
  - Acknowledge the "thin information" concern but argue that hearing all voices is valuable even with shared data 
  - Avoid any language that implies criticism of colleagues 

  The tone should be collaborative: "we" not "you," focusing on future decisions. Ending with a simple yes/no vote makes it actionable.
answer: |-
  **MEMO: Improving Board Decision-Making for Future Director Hires**  
  **To:** Board Members  
  **From:** [Your Name]  
  **Date:** [Date]  
  **Subject:** Proposal for Structured Hiring Process – Vote Requested  

  Hi everyone,  

  Following our last director hiring process, I’ve been reflecting on how we can strengthen our decision-making. While the outcome worked out well, I suspect we might have missed valuable perspectives by converging too quickly. To ensure every candidate gets fair consideration and we leverage our collective wisdom, I propose testing a new approach for the next hire:  

  ### Proposed Method: Anonymous Initial Input & Structured Discussion  
  *(Combining the best of both ideas, focused on reducing premature consensus)*  

  1.  **Pre-Meeting Private Input:**  
      *   **When:** The night before the final decision meeting.  
      *   **Who:** Each board member emails the Secretary.  
      *   **What:** Your initial top choice (just the name) and **one concise reason** *why* (e.g., "Strongest community partnerships," "Most relevant grant experience," "Best vision for youth outreach").  
      *   **Why:** Captures independent first impressions before group discussion.  

  2.  **Anonymous Sharing at Meeting Start:**  
      *   **Who:** Secretary reads *all* submitted choices and reasons aloud, **without identifying who said what**.  
      *   **How:** Grouped by candidate (e.g., "For Candidate A: Reason 1, Reason 2... For Candidate B: Reason 1...").  
      *   **Why:** Surfaces diverse perspectives anonymously, reducing pressure to conform and highlighting common/differing views neutrally.  

  3.  **Structured Discussion:**  
      *   **Focus:** Discuss the *candidates* and the *reasons* raised, not who said what.  
      *   **Goal:** Probe strengths/weaknesses, ask clarifying questions, challenge assumptions.  
      *   **Chair Role:** Ensures all voices are heard and discussion stays focused on merits.  

  4.  **Final Vote:**  
      *   **How:** **Secret written ballot** (simple paper slips).  
      *   **When:** After discussion concludes.  

  ### Why This Approach?  
  *   **Prevents Early Anchoring:** By collecting initial thoughts privately and sharing them anonymously, we reduce the influence of the first speaker and avoid unintentional groupthink ("If everyone else likes #2, maybe I'm wrong?").  
  *   **Surfaces Hidden Perspectives:** People who lean differently can see their view represented neutrally, encouraging them to engage in discussion.  
  *   **Focuses Discussion:** Starting with concrete reasons grounds the conversation in specific criteria.  
  *   **Maintains Authenticity:** Unlike assigned advocacy, this uses your genuine initial reactions as a springboard.  

  ### Addressing Potential Concerns (The "Case Against")  
  *   **"We all have the same thin info – won’t we just all be wrong together?"**  
      *   Possibly. But this method doesn't create *less* information; it reveals the *diversity of interpretation* we already have from that shared info. Someone might highlight a strength (or weakness) others undervalued. It ensures those interpretations get heard before consensus forms.  
  *   **"Is this too much process for volunteers?"**  
      *   It adds one short pre-meeting email and 5-10 minutes at the meeting start. The potential benefit – a more robust decision we all feel confident in – seems worth it.  
  *   **"Why not just trust the most informed person?"**  
      *   We *are* all informed – we all reviewed materials. Deferring risks overlooking valuable insights quieter members hold. This process leverages *everyone's* judgment, not just the most vocal.  

  **This isn't about past mistakes – it's about continuously improving how we serve the organization.** Our passion is our strength; adding a little structure helps ensure our decisions fully reflect that passion.  

  ### Vote Requested  
  **Motion:** For the next Director hiring decision, the Board adopts the "Anonymous Initial Input & Structured Discussion" process as outlined above (Pre-meeting private choice/reason submission to Secretary, anonymous sharing of reasons grouped by candidate at meeting start, structured discussion, secret ballot vote).  

  Please come prepared to discuss and vote on this motion at our next meeting. I'm happy to chat individually beforehand.  

  Thanks for your commitment to [Organization Name]!  

  Best,  
  [Your Name]  

  ---

  **Key Strengths of This Memo:**  
  *   **Solution-Focused:** Proposes one clear, concrete method (not two competing ideas).  
  *   **Non-Accusatory:** Attributes the issue to process ("converging too quickly," "missed perspectives") not people ("sheep," "deference").  
  *   **Addresses Objections Proactively:** Builds trust by acknowledging drawbacks ("Case Against").  
  *   **Action-Oriented:** Ends with a specific, votable motion.  
  *   **Concise & Readable:** Uses bullet points, clear steps, and avoids jargon.  
  *   **Collaborative Tone:** Emphasizes "we," "our collective wisdom," and "serving the organization."  
  *   **Practical:** Defines who does what and when.  

  This approach balances psychological safety (anonymous input) with robust discussion, maximizing your group's collective insight without forcing artificial debate. Good luck!
