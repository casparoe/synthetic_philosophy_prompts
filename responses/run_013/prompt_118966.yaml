  Let me brainstorm possible readings of the proverb:

  1. Prudential reading: Following local customs avoids trouble.
  2. Conventional obligation: Conventions create moral duties.
  3. Semiotic reading: Actions have different meanings in different contexts.
  4. Coordination efficiency: Following conventions optimizes social coordination.
  5. Respect for community: Shows deference to the host culture.
  6. Epistemic humility: Locals know best what works for their society.
  7. Jurisdictional authority: Compliance with local rules/laws is obligatory.
  8. Radical cultural relativism: Morality itself is defined by local practices.

  For each, I'll structure: thesis, verdict, obligation type/owed-to, case applicability. I'll note inconsistencies (e.g., conventional obligation vs. radical relativism) and whether any reading covers all four cases (probably not - tipping relies on dependency, queueing on coordination).

  I'll address the universal vs. local wrong contrast: Some norms (like violence) are wrong regardless, others (driving side) are convention-dependent. But the boundary is contested.

  Finally, I'll emphasize where scholarship agrees (semiotic reading is platitude) vs. disagrees (whether conventions create moral obligations), and note that the proverb masks these complexities.
answer: |-
  Below is a systematic inventory of distinct interpretations of "When in Rome, do as the Romans do," ordered from least to most substantively demanding. Each reading includes: (1) a precise thesis, (2) a verdict on its status (platitude, defensible substantive claim, or false), (3) the obligation type and owed-to party, (4) consistency with your four cases, and (5) key inconsistencies with other readings. I also address your questions about universal/local wrongs and single-readings coverage.  

  **Core Disagreements in Scholarship** (as background):  
  - **Settled**: Conventions (e.g., driving side) lack *intrinsic* moral weight; their force derives from coordination, expectations, or harm-prevention. Semiotic context (action-meaning) is morally relevant.  
  - **Contested**: Whether conventions *generate freestanding moral obligations* (vs. merely prudential ones); whether "community respect" is a valid moral category; the scope of cultural relativism.  

  ---

  ### **1. Prudential Avoidance of Sanctions**  
  - **Thesis**: Adopting local conventions minimizes risks of social/legal penalties (disapproval, fines, conflict).  
  - **Verdict**: Platitude (empirically obvious where sanctions exist).  
  - **Obligation**: None; pure self-interested pragmatism. Owed to: Oneself.  
  - **Cases**:  
    - (i) *Supports*: Queue-avoidance prevents crowding backlash.  
    - (ii) *Inconsistent*: Jaywalking with the crowd *avoids* sanctions, but obeying the law *invites* none; proverb can't prescribe both.  
    - (iii) *Weak support*: Avoiding waiter resentment is prudent, but misses wage-dependency.  
    - (iv) *Irrelevant*: If no locals enforce norms, no sanctions to avoid.  
  - **Inconsistent with**: Readings asserting *moral* obligations (e.g., #3, #5).  

  ### **2. Semiotic Non-Offense (Meaning-Based)**  
  - **Thesis**: Identical acts carry divergent meanings across contexts (e.g., queueing = orderliness or elitism); to avoid *misinterpretation*, align with local semiotics.  
  - **Verdict**: Platitude (supported by anthropology/linguistics).  
  - **Obligation**: Negative duty not to cause reasonable offense via miscommunication. Owed to: Individuals interacting with you.  
  - **Cases**:  
    - (i) *Strong support*: Queueing may signal foreign condescension.  
    - (ii) *Partial support*: Jaywalking may signal solidarity, but law-breaking has fixed meaning.  
    - (iii) *Weak support*: Under-tipping may signal disrespect, but wage reliance is separate.  
    - (iv) *Unclear*: If visitors dominate, local "meaning" is unstable.  
  - **Inconsistent with**: #6 (jurisdictional authority), as meaning ≠ legality.  

  ### **3. Coordination Efficiency**  
  - **Thesis**: Conventions solve coordination problems (e.g., traffic flow); violating them imposes transaction costs (confusion, delay) without countervailing benefit.  
  - **Verdict**: Defensible substantive claim (drawing on game theory, e.g., Lewis).  
  - **Obligation**: Utilitarian duty to reduce social disutility. Owed to: Collective welfare of affected group.  
  - **Cases**:  
    - (i) *Strong support*: Crowding optimizes bus boarding efficiency.  
    - (ii) *Supports crowd-jaywalking*: Mass crossing may regulate traffic flow better than individual compliance.  
    - (iii) *Irrelevant*: Tipping’s coordination role (if any) is minor vs. wage function.  
    - (iv) *Inapplicable*: Visitor-performed conventions may lack efficiency roots.  
  - **Inconsistent with**: #5 (respect), as efficiency needs no deference.  

  ### **4. Epistemic Deference**  
  - **Thesis**: Locals possess tacit knowledge of what works best locally; outsiders should defer to their know-how.  
  - **Verdict**: Defensible but context-dependent claim.  
  - **Obligation**: Duty of epistemic humility. Owed to: Local community as knowledge-bearers.  
  - **Cases**:  
    - (i) *Strong support*: Friend’s advice reflects bus-stop logistics.  
    - (ii) *Supports crowd-jaywalking*: Crowd "knows" enforcement norms.  
    - (iii) *Weak support*: Locals "know" tipping sustains wages.  
    - (iv) *Collapses*: No locals to defer to.  
  - **Inconsistent with**: #7 (radical relativism), as locals may be wrong morally.  

  ### **5. Respect for Community Agency**  
  - **Thesis**: Violating conventions disrespects a community’s right to self-determination, even if the convention is arbitrary.  
  - **Verdict**: Contested substantive claim (communitarian vs. liberal debate).  
  - **Obligation**: Duty of recognition/respect. Owed to: The community as a collective agent.  
  - **Cases**:  
    - (i) *Supports*: Imposing foreign queuing insults local autonomy.  
    - (ii) *Contradictory*: Obeying law respects legislators; jaywalking respects popular will.  
    - (iii) *Partial support*: Tipping honors service-industry norms.  
    - (iv) *Undermined*: Visitors lack "community" status.  
  - **Inconsistent with**: #1 (prudence) and #3 (efficiency), as respect is non-instrumental.  

  ### **6. Jurisdictional Authority**  
  - **Thesis**: One must obey the *formal rules* (laws) of a territory, regardless of compliance levels. "Romans" = rule-makers.  
  - **Verdict**: Defensible for laws, false for conventions.  
  - **Obligation**: Political obligation. Owed to: The state (as per social contract theories).  
  - **Cases**:  
    - (i) *Undermined*: Crowding may defy formal transit rules.  
    - (ii) *Supports law-obedience*: Jaywalking is illegal.  
    - (iii) *Irrelevant*: Tipping is convention, not law.  
    - (iv) *Unchanged*: Rules bind even if visitors dominate.  
  - **Inconsistent with**: #2 (semiotics) and #4 (deference), as laws may lack local buy-in.  

  ### **7. Radical Conventionalism**  
  - **Thesis**: Moral right/wrong *is constituted by* local conventions (e.g., tipping is obligatory *because* it’s customary).  
  - **Verdict**: False (consensus: conventions lack moral ontology; they mediate duties but don’t create them *ex nihilo*).  
  - **Obligation**: Putative freestanding duty. Owed to: The convention itself.  
  - **Cases**:  
    - (i)–(iii) *Overfits*: Makes all conventions obligatory by fiat.  
    - (iv) *Self-undermining*: Visitor-performed conventions lack "local" authority.  
  - **Inconsistent with**: All others, especially #3 (efficiency) and #8 (universalism).  

  ### **8. Universal Prescriptivism ("Romans" as Moral Exemplars)**  
  - **Thesis**: "Romans" act rightly; emulate them because their practices *are* morally superior.  
  - **Verdict**: False (empirically and ethically indefensible).  
  - **Obligation**: None beyond universal morals.  
  - **Cases**: *Fails all*: No evidence Romans are exemplary (e.g., jaywalking may be reckless).  
  - **Inconsistent with**: Every reading accepting conventions as arbitrary.  

  ---

  ### **Synthesis of Your Queries**  
  1. **Single Reading Covering All Cases?**  
     - **No**. The proverb fragments across contexts:  
       - Tipping (#3, #4) hinges on *harm/dependency*.  
       - Queueing (#1, #3, #5) hinges on *coordination/respect*.  
       - Jaywalking splits (#2 for crowd, #6 for law).  
       - Visitor-town (#4, #5) collapses epistemic/respect readings.  

  2. **Universal vs. Local Wrong Contrast**:  
     - **Relevant but Limited**:  
       - *Settled*: Some wrongs are convention-independent (e.g., violence).  
       - *Contested*: Where the line falls (e.g., is queue-jumping *always* rude, or only where queues are normative?).  
       - *Proverb’s Role*: Useful for convention-dependent wrongs (e.g., driving side) but silent on universal ones. Cross-societally, the contrast holds, but its application is disputed (e.g., is tipping exploitative universally?).  

  3. **Inconsistencies Highlighted**:  
     - "Romans" ambiguously refers to: *practitioners* (#1–#5), *rule-makers* (#6), or *moral authorities* (#8).  
     - Key Conflicts:  
       - Prudence (#1) vs. moral duty (#5, #7).  
       - Jurisdictional authority (#6) vs. semiotics (#2) or efficiency (#3).  
       - Radical conventionalism (#7) vs. universalism (#8) and epistemic deference (#4).  

  ### **Conclusion**  
  The proverb is a *rhetorical placeholder*, not a unified theory. Its plausibility derives from overlapping but distinct claims, with no single reading defensible across all cases. Scholarship agrees it fails as radical conventionalism (#7) but acknowledges context-specific force in efficiency (#3), semiotics (#2), and respect (#5)—though the latter two remain contested. Your cases expose its fragility: it cannot resolve tensions between *de facto* practice and *de jure* rules (ii), genuine moral duties and customs (iii), or authentic vs. performative local norms (iv).
