  For each interpretation, I need to provide: a precise thesis statement, a verdict on whether it's a platitude/substantive claim/false, the kind of obligation it generates and to whom it's owed, and whether it actually supports the uses in their four cases. They also want to know if any single reading covers all cases, and how the contrast between universally wrong actions versus locally wrong actions applies here.

