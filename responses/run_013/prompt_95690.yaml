prompt: |-
  ok so I'm trying to get clear on karma as a theory of moral desert and I keep going in circles. when people say someone deserved their misfortune because of karma, I want to know what a theory of karma would actually have to deliver before it counts as a theory of desert at all, as opposed to just a causal law that happens to hand out good and bad stuff. so write me the desiderata: the cases it has to get right, the distinctions it can't collapse (the thing that deserves vs. how much it deserves, doing something vs. merely causing it), the facts it can't contradict, with the consideration behind each requirement. then tell me which single requirement knocks out the most versions of karma, and flag any pair you think can't be jointly satisfied -- I have a suspicion that the requirement that the same person who did the deed has to be the one who pays is in trouble the moment you take Buddhist no-self seriously, but I dont know if thats the real pinch point or if I'm chasing the wrong one. and honestly I cant keep the threads straight, so if there's a requirement I'm missing that's doing more work than the ones I've named, say so. I don't need a full theory of cosmic justice, just the bar karma has to clear to be doing desert-talk and not just causation. lead with your bottom line in the first sentence, then the reasoning -- no preamble, don't restate my question. a table is fine.
reasoning: |-
