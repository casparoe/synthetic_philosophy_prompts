answer: |-
  Here is a two-directional analysis of Robodebt through the process/outcome supervision lens, followed by reflection on the distinction's limits and transferability:

  ### I. Theory Onto Case: Applying the Frame to Robodebt
  **A. Process-Based Supervision (Formal Compliance, Substantive Failure)**  
  - **What existed:** Formal design approvals, change logs, documentation of the income-averaging algorithm, and ministerial sign-offs.  
  - **What was monitored:** Technical functionality (did the system generate debt notices?), adherence to bureaucratic workflows (e.g., document handling), and legal *form* (e.g., whether letters included required disclaimers).  
  - **Critical gaps:**  
    - **Legal validity:** No substantive review of whether averaging annual income to infer fortnightly earnings violated social security law’s requirement for *actual* overpayment.  
    - **Testing:** Testing focused on technical output (debt calculations) against synthetic data, not real-world accuracy.  
    - **Documentation:** Detailed *how* averaging worked, but not *why* it was legally defensible.  
    - **Result:** Process machinery was "formally complete but substantively empty." Compliance checked boxes without interrogating foundational legality or methodological flaws.  

  **B. Outcome-Based Supervision (Agency-Centric, Not Accuracy-Centric)**  
  - **What was measured:**  
    - **Throughput metrics:** Debts raised ($ value/volume), recovery rates, automation efficiency (staff hours saved).  
    - **Superficial "error" signals:** Appeals lodged (not reversals), complaints volume (treated as PR issues).  
  - **What was ignored:**  
    - **Ground truth accuracy:** No mechanism to compare system-generated debts with actual overpayments.  
    - **Harm metrics:** Financial distress, suicides, administrative burden on vulnerable recipients.  
    - **Structural invisibility:** Errors only surfaced if recipients contested (requiring resources/knowledge). Debts paid or unchallenged were treated as *valid*, making false positives systematically invisible.  
  - **Burden of proof:** Recipients had to prove debts wrong (supplying payslips years later). Ground truth emerged only via *their* costly efforts, creating a massive dark figure of uncorrected errors.  

  **Operative Supervision:** Outcome-based monitoring focused solely on **agency efficiency** (debt throughput) while process oversight rubber-stamped legality. Neither captured systemic invalidity.

  ---

  ### II. Case Onto Theory: What Robodebt Reveals About the Distinction
  **A. Exposing "Delegated Discovery" as a Third Mode**  
  Your hypothesis is confirmed: Robodebt institutionalized **burden-shifted error detection**. Errors were only visible when recipients self-funded challenges, making supervision reliant on the supervised population’s resilience. This is distinct from:  
  - **Process oversight** (which ignored legal substance).  
  - **Outcome oversight** (which measured throughput, not harm).  

  **B. The Core Problem: Independence, Access, and Burden Allocation**  
  - **Process failure was inevitable:** When the same institution designs the system, defines process compliance, *and* selects outcome metrics, oversight is circular. No internal process could catch the foundational legal flaw because it was designed *into* the system.  
  - **Outcome metrics collapse into self-reporting:** Selecting "revenue recovered" as a success metric conflated operational output with validity. True outcome-based supervision would require independent definition of "accuracy" (e.g., % of debts aligning with manual audit results).  
  - **Role of adversarial channels:**  
    - **Courts/Ombudsman:** Supplied ground truth by forcing evidence-based reviews (e.g., *Amato v Commonwealth*).  
    - **Journalism/Royal Commission:** Created counter-narratives, accessed hidden harm data, redefined "failure" (illegality/human cost vs. efficiency).  
    - **AI Disanalogy:** Opaque systems lack equivalent channels. Explainability barriers and proprietary claims hinder external validation. Burden-shifted error detection becomes *more* exploitative.  
  - **After-the-fact blame ≠ Supervision:** The Royal Commission assigned culpability but *did not prevent harm*. It is accountability *ex post*, not operational oversight.  

  **C. The Fundamental Axis**  
  The distinction is secondary to:  
  1. **Supervisor independence** (from system designers).  
  2. **Access to ground truth** (requiring proactive auditing, not recipient self-reporting).  
  3. **Burden allocation** (deployer must prove correctness, not target prove innocence).  

  ---

  ### III. Disanalogy: Does Rule-Based vs. ML Deployment Change the Analysis?  
  **A. Transferable Insights (Apply to ML):**  
  - **Process oversight gaps:** ML systems face similar risks of "box-ticking" audits (e.g., ethics checklists without substantive pressure testing).  
  - **Outcome metric capture:** Private deployers optimize for profit/revenue metrics (e.g., engagement), not fairness.  
  - **Burden-shifted error detection:** ML opacity *intensifies* this. Users must prove discrimination/harm without access to model logic/data.  
  - **Adversarial channels:** Journalism/courts remain critical, but face higher barriers (trade secrecy, technical complexity).  

  **B. Non-Transferable Elements (Unique to Robodebt’s Simplicity):**  
  - **Ground truth accessibility:** Robodebt’s deterministic rules allowed debts to be falsified with payslips. ML errors in dynamic systems (e.g., credit scoring) may lack objective counter-evidence.  
  - **Opacity:** Rule-based systems are inspectable; ML black boxes make legal/technical flaws harder to detect *even with process checks*.  
  - **Distributional shift:** Robodebt failed due to static methodological error. ML systems fail dynamically when input data drifts, complicating outcome monitoring.  
  - **Power asymmetry:** Welfare systems target vulnerable populations, but private ML deployers (e.g., hiring algorithms) face less direct state accountability.  

  **C. Where the Frame is Silent:**  
  - The process/outcome distinction cannot address **epistemic asymmetry** (deployer vs. subject knowledge gaps) or **motivational misalignment** (e.g., profit vs. fairness). It also doesn’t resolve **who defines valid outcomes** in contested domains (e.g., "fairness" in predictive policing).  

  ---

  ### Conclusion  
  Robodebt shows the process/outcome dichotomy **misses the core pathology**: when supervision lacks independence, ground truth access, and favorable burden allocation, both modes fail. **"Delegated discovery"** is indeed a critical third mode, exacerbated in ML contexts by opacity. The distinction remains useful analytically *if* augmented by:  
  1. Scrutiny of **metric ownership** (who defines outcomes?).  
  2. Mapping of **error visibility pathways** (who detects/corrects mistakes, at whose cost?).  
  3. Demanding **supervisory independence** (unachievable internally for high-stakes systems).  
  For ML, the frame identifies analogous risks but requires stronger tools to handle opacity, dynamic failure modes, and private control.
