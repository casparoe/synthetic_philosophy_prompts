answer: |-
  Here's the exam question, model answer, and marking scheme tailored to your requirements:

  ### (1) Exam Question (90 mins, ~1000 words)
  **"Futarchy proposes that we 'vote on values, bet on beliefs.' Critically evaluate whether this conceptual separation holds in practice and whether it offers a viable alternative to representative democracy for complex policy decisions. Your analysis must address: (a) the inherent challenges in defining and agreeing upon a 'national welfare metric'; (b) the practical feasibility and potential distortions of using prediction markets to assess policy impacts on this metric; and (c) the implications for democratic legitimacy and power distribution."**

  ### (2) Model Answer (~600 words)
  Futarchy's core promise – separating value judgments (voted on) from empirical forecasts (traded in markets) – collapses under scrutiny. While theoretically elegant, the separation is unsustainable in practice, rendering futarchy a flawed alternative to representative democracy.

  First, the "national welfare metric" is inherently value-laden. Deciding *what* to measure (e.g., GDP, inequality-adjusted life satisfaction, biodiversity indices) involves profound normative choices about what constitutes "welfare." Is it aggregate wealth, distributional fairness, or ecological sustainability? Different groups hold irreconcilable values, making consensus on a single metric impossible without political struggle. The entity defining the metric (e.g., legislature, technocratic body) wields immense power, embedding their values into the system's foundation. Voting on the metric doesn't resolve this; it merely shifts the value conflict upstream. "Betting on beliefs" about a metric like GDP presupposes agreement that GDP *is* the value – a belief itself saturated with values.

  Second, prediction markets face crippling practical and incentive problems when pricing policy counterfactuals. Liquidity is a major concern: deep, efficient markets require many participants with diverse views and capital, unlikely for niche policy questions. Manipulation is feasible; well-resourced actors ("whales") could distort prices to favour policies benefiting them, not collective welfare. More fundamentally, markets price *expected outcomes* under *current information*. Pricing the counterfactual ("Would GDP be higher *if* Policy A passed?") is epistemologically fraught. Traders bet on what the market *will say* happened to the metric *if* the policy passes, which is distinct from the policy's *actual* causal effect. Markets struggle to isolate policy impact from confounding factors, rewarding easily measurable short-term impacts over complex long-term benefits.

  Finally, futarchy risks undermining democratic legitimacy and centralizing power. Technocrats or wealthy market participants gain disproportionate influence over policy outcomes based on betting prowess, not accountability or representation. Citizens lose the ability to deliberate on the *means* (policies) or hold decision-makers directly responsible, as the market mechanism becomes a black box. The focus on a single metric oversimplifies societal goals, neglecting trade-offs and incommensurable values that democratic deliberation attempts to navigate.

  While futarchy highlights valuable insights about aggregating dispersed knowledge, its attempt to surgically separate values from beliefs fails. Defining the metric is inherently value-driven, markets cannot reliably price complex policy counterfactuals, and the system erodes core democratic principles. It offers not a viable alternative, but a cautionary tale about reducing governance to mechanism design without confronting political realities.

  ### (3) Marking Scheme (5 Distinct Points)
  1.  **Critiques the Values/Beliefs Separation:** Top answers explicitly demonstrate why defining/selecting the welfare metric is an inseparable fusion of values *and* beliefs, rejecting the clean dichotomy; weaker answers accept the separation at face value or discuss values/beliefs in isolation.
  2.  **Analyzes Metric Definition as Political:** Top answers identify the power struggles, normative assumptions, and potential for bias or exclusion inherent in designing and agreeing upon the single welfare metric; weaker answers treat the metric as a neutral or technocratic given.
  3.  **Evaluates Prediction Market Feasibility & Pathologies:** Top answers address specific practical failures (liquidity, manipulation, perverse incentives) and epistemological challenges (pricing counterfactuals vs. outcomes); weaker answers assume efficient markets or gloss over these complexities.
  4.  **Engages the Counterfactual Pricing Problem:** Top answers explicitly distinguish between pricing an *outcome* and pricing the *causal effect* of a specific policy within a counterfactual scenario, highlighting the unique difficulty; weaker answers conflate the two or fail to mention the counterfactual aspect.
  5.  **Assesses Democratic Legitimacy & Power Shifts:** Top answers analyze how futarchy alters accountability, representation, and power dynamics (e.g., empowering traders/technocrats, disempowering citizens/deliberation); weaker answers neglect legitimacy concerns or focus solely on efficiency claims.
