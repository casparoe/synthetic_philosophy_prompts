prompt: |-
  hey, I'm putting together the final for a ppe grad seminar on the political economy of institutions and I want one essay question on futarchy — you know, the setup where instead of electing people to pick policy you get voters to agree on some measurable national welfare metric, and then any proposal is adopted only if the prediction market says it'll push that metric up. the usual pitch is that you vote on your values and bet on your beliefs, and thats the bit I want to squeeze. I don't want a question students can pass by reciting that slogan back at me; I want one that makes them actually test whether values and beliefs can be pulled apart, who writes the metric in the first place, whether the markets can be manipulated or would even be liquid, whether pricing a counterfactual is the same as pricing an outcome, all that.

  so could you give me: (1) the exam question itself, pitched for a 90 min sit-down where they'll write maybe 1000 words; (2) a model answer, about 600 words; and then (3) the marking scheme as exactly five numbered points, one or two sentences each, no intro and no closing sentence — each point should name the move a top answer has to make and, in a clause, the way weaker answers usually fumble it. keep the five points clearly distinct so I can just tick them off.
