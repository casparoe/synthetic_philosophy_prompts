     - Time: 10 minutes for the first round (5 minutes per person, including feedback) and 10 minutes for the second? That might be tight. Instead, 5 minutes per round per person, so 10 minutes total per pair? Let's do 12 minutes total (6 minutes per person). Then we have 3 minutes for transition.

     - Actually, we can do: 
