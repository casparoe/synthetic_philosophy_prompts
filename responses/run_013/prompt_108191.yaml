  **5. Debrief (20 minutes)**
     - Facilitator leads a discussion, drawing on the flip chart to map the activity to the philosophical issues.

     - Key questions:
          - "In Part 1, when you wrote your directive, what were your reasons? How did you see your future self?" (Write reasons on flip chart: e.g., autonomy, avoiding suffering, dignity, etc.)
          - "In Part 2, when you were the future self, what did you feel? What reasons did you have for objecting?" (Write: e.g., current happiness, desire to live, not identifying with the past self)
          - "In Part 3, when you had to argue for enforcing the directive against your own role-played future self, what arguments did you find yourself using?" (Write these arguments on the flip chart.)

     - Now, map to the philosophical grounds:
          - Continuity: Did anyone argue that the future self is the same person as the past self? Why might that be challenged? (The future self doesn't remember, has different values, etc.)
          - Authorship: The past self wrote it, so it has authority? But the future self is now a different person in terms of values and identity.
          - Bargaining: The past self cannot bargain with the future self? But is that a reason to give the past self authority? 
          - Costs: The past self bore the costs of making the decision? But the future self is the one living with the consequences.

     - Challenge the Ulysses analogy: 
          - "In the story of Ulysses, he tied himself to the mast to resist the Sirens' song, and his future self was grateful. In our scenario, the future self is not grateful. How does that change things?"
          - Ask: "Did anyone find themselves assuming that the future self would be grateful? How did the activity challenge that?"

     - Control condition: 
          - Facilitator presents: "Now, imagine a variation. Suppose that the future self, when they are in that state, agrees with the directive. For example, if the directive was to refuse treatment, the future self also refuses. How does that change the situation? Is the authority of the past self still in question? What does that tell us about the role of disagreement?"
          - Elicit: The disagreement highlights the conflict. Without it, we don't question the authority because both selves agree.

     - Summarize the candidate grounds and why they fail:
          - Continuity: If there is psychological discontinuity (as in dementia), then continuity fails.
          - Authorship: The past self authored it, but why should that bind a different self?
          - Bargaining: The past self cannot bargain, but that doesn't mean it gets to decide.
          - Costs: The past self bore the costs, but the future self bears the consequences.

     - End by noting that the activity cannot reproduce the real emotional weight of having a relative in this situation, and that in real life, there are legal and ethical frameworks that might override pure philosophy. Also, the activity simplifies the medical and emotional complexity.

