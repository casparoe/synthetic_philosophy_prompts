  1. **Problem:** Participants may struggle with role-playing, especially as the future self with dementia. They might not take it seriously or might feel uncomfortable.
     - *Solution:* Emphasize that it is hypothetical and they are not making light of real dementia. Encourage them to try to imagine.

  2. **Problem:** In Part 3, participants might not be able to generate arguments for enforcement, especially against their own role-played position.
     - *Solution:* As facilitator, be ready with prompts: "Think about the reasons you had in Part 1 when you wrote your own directive. What would you say to the future self? What about the family? The medical team? The principle of autonomy at the time the directive was written?"

  3. **Problem:** The shuffling might lead to someone getting their own directive. 
     - *Solution:* Check when redistributing to avoid giving someone their own. Or if it happens, quietly swap it.

  4. **Problem:** The control condition might not be adequately addressed in the debrief due to time.
     - *Solution:* Keep the control condition part of the debrief brief (2-3 minutes). Present it as: "In a scenario without disagreement, we wouldn't be having this debate. So the disagreement is what creates the conflict and forces us to question the authority."

  5. **Problem:** A participant might bring up a real-life experience that is emotional.
     - *Solution:* Acknowledge the real-world complexity and that we are doing a thought experiment. Offer to talk privately after if needed.

  6. **Problem:** The activity cannot capture the full emotional and relational context of a real advance directive (e.g., family dynamics, grief, medical uncertainty).
     - *Solution:* Acknowledge this in the debrief: "In real life, there are many more factors, including the views of family and doctors, and the law. We are isolating one philosophical issue."

  **What the Activity Cannot Reproduce:**
     - The real emotional weight of making life-and-death decisions for oneself or a loved one.
     - The legal and medical context: Advance directives are legal documents and are followed in a system that values precedent and consistency.
     - The uncertainty in medical prognoses and the difficulty of anticipating future states.

  The facilitator will have to supply this context by noting it in the introduction and debrief.

  **Final Timeline (Total 95 minutes):**
  - 0-10 min: Introduction and scenario setting.
  - 10-25 min: Part 1 (Write directives).
  - 25-45 min: Part 2 (Role-play as future self and write response).
  - 45-70 min: Part 3 (Pair argument and feedback).
  - 70-95 min: Debrief (whole group).

  This is tight. We might run over. Be prepared to adjust.

  **Script for Facilitator:**

  - Introduction: As above.
  - Part 1: "Please write your advance directive. You have 10 minutes. Be clear and concise."
  - Part 2: "You are now the future self. You have received this directive. Write a response objecting to it. Remember, you are happy and want to live (or not, depending on the directive)."
  - Part 3: "In pairs, you will each argue for enforcing the directive you hold on the future self who wrote the response you hold. Take about 4 minutes to present your argument, then your partner gives 1 minute of feedback. Then switch."
  - Debrief: Use the questions above and the flip chart to guide the discussion.

  Good luck! This is an ambitious session but it should be engaging.
answer: |-
  Below is a complete, runnable session plan for your 90-100 minute reading group. It addresses your core goals:  
  - A hands-on activity (not a lecture) where participants experience the tension between earlier and later selves.  
  - Forces each person to shift perspectives: from directive-writer to resistant later self to enforcer of a directive *against their own prior role*.  
  - Debrief that maps activity moments to philosophical arguments (continuity, authorship, bargaining, costs) and isolates the role of disagreement (with a "control" element).  
  - Exposes gaps in the Ulysses analogy.  
  - Includes troubleshooting and acknowledges limitations of the simulation.  

  The session uses only a flip chart, egg timer, and paper/pens. No prior philosophy knowledge is needed. Materials are simple: index cards (or scrap paper) and pens for all. Roles are participant-driven (no assigned characters). The debrief is detailed, using quotes from the activity.  

  **Total Time:** 95 minutes (adjustable).  
  **Group Size:** 14 participants.  
  **Materials per Person:** 2 index cards, pen.  
  **Facilitator Tools:** Flip chart, egg timer, markers.  

  ---

  ### **Session Structure**  
  1. **Introduction (10 min)**  
  2. **Part 1: Write Your Advance Directive (15 min)**  
  3. **Part 2: Role-Play as a Resistant Later Self (20 min)**  
  4. **Part 3: Argue for Enforcement Against "Yourself" (25 min)**  
  5. **Debrief (25 min)**  

  ---

  ### **0. Prep Before Session**  
  - Write the **scenario** on the flip chart (keep it visible):  
    > *"You have early-stage dementia but are currently clear-headed. Doctors say your dementia will worsen: you’ll lose memories and become childlike, finding joy in simple things. In this later stage, you may develop a life-threatening infection. If untreated, you’ll die peacefully in days. If treated, you’ll live 6–12 months in that state. Today, you’re writing an advance directive for that future self."*  
  - Set out index cards/pens.  

  ---

  ### **1. Introduction (10 min)**  
  *Goal: Frame the problem without philosophy jargon. Prime the group for perspective-switching. Expose the Ulysses gap.*  

  **Facilitator Script (read aloud):**  
  > "Welcome. Today, we’re exploring a puzzle: Can a past version of you bind a future version who’s changed so much they feel like a different person? We’ll use advance directives as our lens—like refusing antibiotics for late-stage dementia.  
  >   
  > **Key rule:** Everyone will argue *against* their own instincts today. You’ll write a directive, then play a future self who hates it, then defend forcing it on someone like that future self.  
  >   
  > **One analogy we’ll test:** Ulysses tying himself to the mast to resist sirens. But in that story, his future self is *grateful*. Here, we’re asking: What if he wasn’t? What if he fought the ropes?  
  >   
  > **Scenario:** [Gesture to flip chart.] We’ll use this dementia/infection example. It’s hypothetical—no real medical choices.  
  >   
  > **Activity flow:**  
  > 1. Write your directive (15 min).  
  > 2. Become a future self who rejects someone else’s directive (20 min).  
  > 3. Pair up and argue *for* enforcing that directive against a person like your future self (25 min).  
  > 4. Group discussion (25 min).  
  >   
  > Use the cards for writing. I’ll time each step. Questions?"  

  **Troubleshooting:**  
  - If someone asks about real relatives: *"This is a thought experiment to isolate the philosophical tension. Real cases involve family, emotions, and law—we’ll acknowledge that later."*  
  - If Ulysses comes up early: *"Hold that thought—we’ll test it in the debrief."*  

  ---

  ### **2. Part 1: Write Your Advance Directive (15 min)**  
  *Goal: Each person sympathetically crafts an earlier self’s directive.*  

  **Facilitator Script:**  
  > "On your first card, write an advance directive for the scenario. Choose:  
  > - **Option A:** Refuse antibiotics. Die sooner but avoid prolonged decline.  
  > - **Option B:** Request antibiotics. Live longer in the childlike state.  
  >   
  > **Include:** Your reason in 1–2 sentences. Example: *‘I refuse treatment because living without my memories isn’t truly me.’*  
  > **Time:** 12 minutes to write. I’ll warn you at 10 min. Write clearly—others will read this."  

  **Troubleshooting:**  
  - If someone struggles: *"Base it on your instincts. What would you want now for that future?"*  
  - If they write a vague directive: *"Make it decisive—e.g., ‘Do not administer antibiotics under any circumstances.’"*  

  ---

  ### **3. Part 2: Role-Play as a Resistant Later Self (20 min)**  
  *Goal: Each person becomes a later self who rejects a directive (not their own). Forces unsympathetic perspective.*  

  **Facilitator Script:**  
  > "I’ll collect all directives and shuffle them. You’ll get one at random—not your own.  
  >   
  > **Your role:** You are now the *future self* with advanced dementia. You’re happy, childlike, and unaware of your past. You’ve developed the infection.  
  >   
  > **On your second card, write:**  
  > - ‘I want [antibiotics/NO antibiotics] because… [give reasons].’  
  > - ‘I reject this directive because… [argue against the past self’s reason].’  
  >   
  > **Key:** Your view *must conflict* with the directive you received. If the directive refuses treatment, you demand it. If it demands treatment, you refuse it.  
  > **Time:** 15 minutes to write. I’ll warn at 12 min."  

  **Troubleshooting:**  
  - If someone resists the role-play: *"Imagine you’re content in this moment—you don’t recall your past self’s worries."*  
  - If they get their own directive: Swap it quickly (check while shuffling).  

  ---

  ### **4. Part 3: Argue for Enforcement Against "Yourself" (25 min)**  
  *Goal: Each person argues to enforce a directive *on the type of person they just role-played*, forcing them to counter their own prior arguments.*  

  **Facilitator Script:**  
  > "Keep the directive card you received and the response card you wrote. Now, find a partner.  
  >   
  > **Task:**  
  > - **Person 1:** Argue *for* enforcing the directive you hold against the future self who wrote the response card you hold. (Yes, you’re arguing against your own words from Part 2!)  
  > - **Person 2:** Listen, then challenge: *‘Why should this future self obey?’*  
  > - Switch roles after 7 minutes.  
  >   
  > **Goal of your argument:** Persuade your partner that the past self’s directive must be followed, even though the future self objects. Use reasons—don’t just state opinions.  
  > **Time:** 14 min total (7 min each). I’ll call time."  

  **Troubleshooting:**  
  - If someone can’t argue against their own view: *"Think: What would a doctor or lawyer say? Why might the past self’s wishes outweigh the future self’s?"*  
  - If pairs finish early: *"Discuss: Was it harder to argue for enforcement than you expected?"*  

  **Control Condition Integration:**  
  - **During pairing, assign roles:** Half the pairs (7 people) get a **disagreement** task (as above). The other half (7 people) get an **agreement** task:  
    > "Argue *for* enforcing the directive, but now imagine the future self *agrees* with it. How does that change your argument?"  
  - **Why this works:** Cheap, parallel, and isolates disagreement. In debrief, you’ll contrast quotes from both groups.  

  ---

  ### **5. Debrief (25 min)**  
  *Goal: Map activity moments to philosophical arguments. Challenge Ulysses. Use participant quotes. Highlight what the simulation misses.*  

  **Facilitator Script (use flip chart to map quotes/arguments):**  
  > "Let’s dissect what happened. I’ll ask questions, and we’ll link your experiences to the core puzzle: *Why should an earlier self bind a later one?*"  

  **Step 1: Share experiences (5 min)**  
  - *"In Part 1, what reasons did you give for your directive?"* [Flip chart: "Past Self Reasons" – e.g., "avoid suffering," "preserve dignity."]  
  - *"In Part 2, why did your future self reject the directive?"* [Flip chart: "Future Self Reasons" – e.g., "I’m happy now," "I don’t remember the past."]  
  - *"In Part 3, what arguments did you use for enforcement?"* [Flip chart: "Enforcement Arguments" – e.g., "The past self knew best," "It’s a promise."]  

  **Step 2: Map to candidate grounds (10 min)**  
  > "Your enforcement arguments reveal possible grounds for authority. Let’s test them."  

  | Candidate Ground          | Participant Quote (Example)                 | Why It Fails (Link to Activity)                                                                 |  
  |---------------------------|---------------------------------------------|------------------------------------------------------------------------------------------------|  
  | **Continuity**            | *"They’re the same person!"*                | *But in Part 2, you felt discontinuous—e.g., ‘I don’t remember my past self.’ If identity changes, why bind them?* |  
  | **Authorship**            | *"The past self wrote it—it’s their choice!"*| *But in Part 2, you argued, ‘Why should they decide for me?’ Authorship doesn’t prove authority over a different self.* |  
  | **Cannot Bargain**        | *"The past self can’t negotiate with the future!"* | *True, but that’s a practical gap. It doesn’t mean the past self wins by default. In Part 3, did this feel fair to the future self?* |  
  | **Bore Costs**            | *"The past self suffered to make this choice!"* | *But in Part 2, you thought, ‘I’m the one living with it now!’ Costs don’t grant moral authority.* |  

  > **Ulysses gap:** *"Did anyone use the Ulysses analogy? In Part 3, did you assume the future self would be grateful? How did Part 2 challenge that?"* [Highlight: Ulysses assumes alignment. When the future self resists (as in Part 2), the analogy fails.]  

  **Step 3: Control condition contrast (5 min)**  
  > *"Half of you debated enforcement with agreement. How did that feel versus disagreement?"*  
  - **Agreement groups:** *"Easier—no conflict. It felt like confirming autonomy."*  
  - **Disagreement groups:** *"Harder—it felt like overriding someone."*  
  > **Key insight:** Disagreement exposes the power imbalance. Without it, we don’t question authority.  

  **Step 4: Limitations and close (5 min)**  
  > *"This simulation can’t capture three real-world complexities:  
  > 1. **Emotional weight:** In reality, families grieve, and patients suffer. We removed that.  
  > 2. **Medical uncertainty:** Real directives handle ‘what-ifs’ we simplified.  
  > 3. **Compromises:** Legally, directives can be overridden. We treated them as absolute.*  
  >   
  > **Final thought:** Advance directives rely on a fiction—that we’re the same person over time. When that fiction collapses, so does the authority. Your arguments today show why this is messy."  

  ---

  ### **What Will Go Wrong (and How to Handle It)**  
  1. **Someone dominates the "sympathetic" side:**  
     - *Likely:* A participant insists past selves always know best during Part 3.  
     - *Fix:* Redirect: *"Remember, you’re arguing against your Part 2 role. Channel that frustration."* Use the egg timer to limit arguing time.  

  2. **Emotional real-life stories:**  
     - *Likely:* A nurse/chaplain shares a personal experience.  
     - *Fix:* Acknowledge: *"This is simplified. Real cases involve grief and ambiguity."* Offer to discuss after. Keep the activity on track.  

  3. **Confusion in Part 3:**  
     - *Likely:* Participants mix up cards or roles.  
     - *Fix:* Label cards: "Directive" and "Response." Demo pair work briefly.  

  4. **Control condition feels rushed:**  
     - *Likely:* Agreement groups finish early.  
     - *Fix:* Have them jot down differences between agreement/disagreement while waiting.  

  5. **Ulysses analogy dominates:**  
     - *Likely:* Participants default to "it’s like Ulysses" without critique.  
     - *Fix:* In debrief, ask: *"Did your Part 2 future self feel grateful? If not, why force it?"*  

  ---

  ### **What the Activity Cannot Simulate (and You Must Explain)**  
  - **The weight of real relationships:** The activity removes family dynamics, guilt, and love. Participants won’t feel the stakes of "real" loss. You must note this in the debrief.  
  - **Legal and medical ambiguity:** Real directives include clauses for uncertainty (e.g., "if recovery is impossible"). The scenario is binary for clarity.  
  - **Gradual identity change:** Dementia is a spectrum; the activity treats it as a sudden shift. You must frame this as a necessary simplification.  

  This plan forces perspective shifts, uses your group’s life experience (nurses/chaplain will resonate with the scenario), and delivers the debrief you want. The control condition is integrated cheaply via role assignment. Run it as-is, and you’ll have a visceral, argument-driven session.
