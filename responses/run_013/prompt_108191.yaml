     - We must ensure each participant makes one argument. So in the pair, A argues for their directive (D1) against their own response (R1) and then B argues for their directive (D2) against their own response (R2). That's two arguments per pair. Allow 5 minutes for each argument and feedback? 10 minutes per pair? Then we need to allocate 20 minutes for Part 3.

