          We present the improper uniform prior. We do the calculation: 
              P(we have the smaller | A=a) = 1/2, P(we have the larger | A=a)=1/2.
              Then E[other|A=a] = (1/2)(2a) + (1/2)(a/2) = 5a/4.

          So it seems we should always switch.

          But then we note: if we always switch, then we are effectively choosing the other envelope. But by symmetry, the other envelope is just like the first. So why would it be better?

          The resolution: in this improper prior, the expected value of the amount in the first envelope is infinite. So the 5a/4 is not helping because unconditionally, the expected value of switching is:

              E[T] = E[ E[T|S] ] = E[ (5/4)S ] = (5/4) * E[S] = infinity.

          And the expected value of not switching is also E[S]=infinity. So we cannot compare.

          Moreover, note that the switching argument applied to the other envelope would say: if you have the other envelope with amount b, then the expected value of the first envelope is 5b/4, which is bigger. So you would switch back. This is a contradiction.

          Therefore, the flaw in the improper prior case is that the expectation is infinite, so we cannot use expected value in this way.

     IV. Conclusion: the flaw in the naive argument is the assumption that the two possibilities (half or double) are equally likely. In a proper prior, this is not always true (as in the die-rolling example for a=8). Even in a case where they are equally likely (as in the improper prior), the expectation is infinite and the argument fails at the unconditional level.

     So the diagnosis: the step that fails is step 3: the assumption that the two possibilities are equally likely. It is not necessarily true. And even when it is true, it leads to an infinite expectation which invalidates the reasoning.

     Now, the misconceptions and when to head them off:

     1. "There is no uniform distribution over the amounts, so the problem is ill-posed."
          - This might come up when we present the die-rolling example: the amounts are bounded. But then we present the continuous examples. We should head it off by noting that the problem does not require a uniform distribution. We can have any distribution.

     2. "Symmetry settles it: by symmetry, switching shouldn't matter."
          - But in the die-rolling example, it does matter conditionally. We switch for some amounts and not for others. And unconditionally, it might not matter? 
            Let's compute the unconditional expected value of switching versus not in the die-rolling example.

            Without loss of generality, fix a strategy. We have a strategy: switch if the amount is 1,2,3,4,5,6 and do not switch if 8,10,12.

            But note: we pick an envelope at random. The total probability.

            Alternatively, note that the switching strategy we described is: 
               If you pick the smaller envelope and it is 1,2,3,4,5,6, then switching gets you 2,4,6,8,10,12 respectively.
               If you pick the larger envelope and it is 2,4,6, then switching gets you 1,2,3 (if you see 2,4,6 respectively) but wait, our strategy says switch on 2,4,6? 
                   - If we pick the larger envelope and see 2 (from the pair (1,2)), we switch to 1.
                   - If we pick the larger envelope and see 4 (from (2,4)), we switch to 2.
                   - Similarly, 6 to 3.

            But also, if we pick the larger envelope and see 8,10,12, we do not switch.

            Now, the expected value without switching: 
               We get each of the 12 envelope amounts with equal probability? 
               The envelopes: 
                   (1,2): 1 and 2
                   (2,4): 2 and 4
                   (3,6): 3 and 6
                   (4,8): 4 and 8
                   (5,10):5 and 10
                   (6,12):6 and 12

               So the possible amounts: 1,2,3,4,5,6,8,10,12. Each appears exactly once? 
                  1: only in (1,2) as small.
                  2: in (1,2) as large and in (2,4) as small -> so two envelopes have 2?
                  Actually, there are 6 pairs * 2 envelopes = 12 envelopes. But the amount 2 appears twice: once in (1,2) as the large, and once in (2,4) as the small.

               So the amounts are not equally likely.

               The total probability for each amount:
                  1: 1 envelope -> probability: (1/6) * (1/2) = 1/12.
                  2: 2 envelopes -> probability: 2/12 = 1/6.
                  3: 1 envelope -> 1/12.
                  4: 2 envelopes -> 1/6.
                  5: 1/12.
                  6: 2 envelopes? 
                      In (3,6): the 6 is the large -> one envelope.
                      In (6,12): the 6 is the small -> one envelope.
                      So 2 envelopes -> 1/6.
                  8: in (4,8) as the large -> 1/12? 
                      But wait, (4,8) has 4 and 8. The 8 is the large. So only one envelope -> 1/12.
                  10: in (5,10) as the large -> 1/12.
                  12: in (6,12) as the large -> 1/12.

               So the distribution of the amount in the first envelope: 
                  1: 1/12
                  2: 2/12 = 1/6
                  3: 1/12
                  4: 2/12 = 1/6
                  5: 1/12
                  6: 2/12 = 1/6
                  8: 1/12
                  10:1/12
                  12:1/12

            Now, if we use our switching strategy:

               If we see 1: switch to 2 -> gain: 2
               If we see 2: switch -> expected other given 2 is 2.5, so we get 2.5 on average? But wait, we don't condition: we have to see what happens in each envelope.

            We can compute the amount we end up with:

               For the envelope with 1: we switch to 2.
               For the envelope with 2: 
                   - if it is from (1,2) (which happens with probability 1/2 given 2? but unconditionally: the two envelopes with 2 are equally likely? 
                     The envelope with 2 in (1,2): we switch to 1.
                     The envelope with 2 in (2,4): we switch to 4.
                   So for the two envelopes with 2, we end up with 1 and 4.

               Similarly, for 3: switch to 6.
               For 4: 
                   - from (2,4): switch to 2
                   - from (4,8): switch to 8? but wait, our strategy: we switch on 4? yes, because 4 is <=6. So we switch: 
                      in (2,4): we have 4 and switch to 2.
                      in (4,8): we have 4 and switch to 8.
               For 5: switch to 10.
               For 6:
                   - from (3,6): switch to 3
                   - from (6,12): switch to 12
               For 8: do not switch -> 8.
               For 10: do not switch -> 10.
               For 12: do not switch -> 12.

            Now, the amount we end up with:

               Original 1: becomes 2.
               Original 2 (from (1,2)): becomes 1.
               Original 2 (from (2,4)): becomes 4.
               Original 3: becomes 6.
               Original 4 (from (2,4)): becomes 2.
               Original 4 (from (4,8)): becomes 8.
               Original 5: becomes 10.
               Original 6 (from (3,6)): becomes 3.
               Original 6 (from (6,12)): becomes 12.
               Original 8: remains 8.
               Original 10: remains 10.
               Original 12: remains 12.

            Now, the final amounts: 2, 1, 4, 6, 2, 8, 10, 3, 12, 8, 10, 12.

            Count them:
              1: 1
              2: 2
              3: 1
              4: 1
              6: 1
              8: 2
              10: 2
              12: 2

            The expected value of the final amount: 
               = (1*1 + 2*2 + 3*1 + 4*1 + 6*1 + 8*2 + 10*2 + 12*2) / 12
               = (1 + 4 + 3 + 4 + 6 + 16 + 20 + 24) / 12
               = (1+4=5; 5+3=8; 8+4=12; 12+6=18; 18+16=34; 34+20=54; 54+24=78) / 12
               = 78/12 = 6.5

            Now, the expected value without switching: 
               = (1*1 + 2*2 + 3*1 + 4*2 + 5*1 + 6*2 + 8*1 + 10*1 + 12*1) / 12
               = (1 + 4 + 3 + 8 + 5 + 12 + 8 + 10 + 12) / 12
               = (1+4=5; 5+3=8; 8+8=16; 16+5=21; 21+12=33; 33+8=41; 41+10=51; 51+12=63) / 12
               = 63/12 = 5.25

            So with our switching strategy, we get 6.5 which is higher than 5.25. But wait, that seems to break symmetry? 

            However, note: the switching strategy we used is not the same as always switching. In fact, we sometimes switch and sometimes not. And we do better on average.

            But what if we always switch? 
               Then for every envelope, we switch.

               For the envelope with 1: switch to 2.
               For the envelope with 2 (from (1,2)): switch to 1.
               For the envelope with 2 (from (2,4)): switch to 4.
               For 3: to 6.
               For 4 (from (2,4)): to 2.
               For 4 (from (4,8)): to 8.
               For 5: to 10.
               For 6 (from (3,6)): to 3.
               For 6 (from (6,12)): to 12.
               For 8: to 4.
               For 10: to 5.
               For 12: to 6.

            Final amounts: 2,1,4,6,2,8,10,3,12,4,5,6.

            Expected value: 
              1,2,2,3,4,4,5,6,6,8,10,12 -> 
              = (1+2+2+3+4+4+5+6+6+8+10+12)/12 = (1+2+2+3+4+4+5+6+6+8+10+12) 
              = 1+2=3; 3+2=5; 5+3=8; 8+4=12; 12+4=16; 16+5=21; 21+6=27; 27+6=33; 33+8=41; 41+10=51; 51+12=63 -> 63/12=5.25.

            So always switching gives the same as never switching.

            Our conditional strategy does better because it avoids switching when we have the large amounts (8,10,12) and switches when we have the small ones.

            So symmetry does not settle it unconditionally if we use a conditional strategy. But if we always switch, then by symmetry it must be the same as never switching.

          Therefore, we head off the symmetry argument by noting that the naive argument says to always switch, and that would be symmetric. But our die-rolling example shows that a conditional strategy can beat both always switching and never switching. However, the flaw in the naive argument is that it incorrectly assumes the conditional probabilities are 1/2 at every a, leading to the always-switch policy. But in reality, we should condition on a and then decide.

     3. "This shows expected value is the wrong criterion."
          - We are using expected value throughout. The die-rolling example uses expected value and shows a conditional strategy that increases the expected value. So we are not abandoning expected value.

     4. Conflation of the probability before opening that you hold the smaller envelope with the corresponding probability after opening.
          - Before opening, the probability that you hold the smaller envelope is 1/2. 
          - After opening and seeing a, the probability that you hold the smaller envelope is not necessarily 1/2. It depends on a and the prior.
          - This is the key point. We head this off when we do the conditional calculations in the die-rolling example: we show that for a=2, it is 1/2, but for a=8, it is 0 (because if you see 8, you definitely have the larger).

     Closing question to locate the fallacy:
          "In the naive argument, which step is the first that does not hold in general, and why?"

          We want them to say: step 3, the assumption that given you see a, the probability that you have the smaller envelope is 1/2. This is not necessarily true.

     What to explicitly refuse to do:
          - Do not present one party's resolution of the fixed-amount version as the consensus. We note that the fixed-amount version (where you are given an envelope and told that one is twice the other but with no prior) is disputed. Some argue that without a prior, you cannot assign probabilities. Others argue that you should use an improper prior. We have shown that with a proper prior, the conditional probabilities are not 1/2 in general, and with an improper prior, you get infinite expectations. So the naive argument fails. But we do not take a stand on whether there is a single fully satisfying resolution of the fixed-amount version.

     The order of ideas:

     1. Restate the setup and the naive argument (5 minutes).
     2. Present the die-rolling example and compute the conditional expectations for a few amounts (a=2 and a=8) to show that the conditional probabilities are not always 1/2 and that the expected value is not always 5a/4 (20 minutes).
     3. Discuss the strategy: we switch for a<=6 and not for a>=8. Note that this is a conditional strategy and it increases the expected value compared to never switching (10 minutes).
     4. Address the symmetry concern: show that always switching is symmetric and gives the same as never switching, but a conditional strategy can break the symmetry (5 minutes).
     5. Present the improper uniform prior: show that for every a, the conditional probabilities are 1/2 and the expected value is 5a/4. Then note that this leads to a contradiction: if you switch, you get 5a/4, but then by symmetry applied to the other envelope, you should switch back. Also, the unconditional expectation is infinite. So the expected value criterion doesn't force a decision (15 minutes).
     6. Conclusion: the flaw is in step 3 of the naive argument: the 1/2 probability is not always justified. It can fail because the prior doesn't support both possibilities (as in a=8 in the die example) or because the prior is improper and leads to an infinite expectation. In any case, the naive argument is invalid. (5 minutes)
     7. Q&A (10 minutes).

     Total: 90 minutes.

     Note: In step 5 (improper prior), we do not derive the posterior from an improper prior in detail. We state the result and explain the issue with infinity. We avoid measure theory.

     This plan should address the worry that the die-rolling example resolves it too cheaply: it shows the flaw in the 1/2 probability, and then the improper prior example shows that even when the 1/2 probability holds, there is a problem with infinity. So both are needed.

     The extra work in the second movement is to explain that in the improper prior case, the unconditional expectation is infinite, so the conditional expectation being 5a/4 does not imply that switching is beneficial unconditionally. And it also leads to a switching back and forth.

     The misconception that "the problem is ill-posed without a prior" is addressed: we start with a proper prior (die-rolling) and then move to an improper prior, showing that the prior matters.

     We also address the symmetry argument by showing that a conditional strategy can break the symmetry, but that the naive argument leads to an unconditional always-switch which by symmetry is the same as never-switch.

     We hope this plan works.
answer: |-
  ### Session Plan: Two-Envelope Paradox  
  **Total Time:** 90 minutes  
  **Audience:** Philosophy and economics graduate students; comfortable with expected value and conditional probability; no measure theory.  
  **Goal:** Diagnose the flaw in the naive argument (expected value of other envelope = 5a/4) and enable the audience to pinpoint the failing step.  

  ---

  ### **Order of Ideas and Dependencies**  
  1. **Restate Naive Argument (5 min)**  
     - Setup: Two envelopes, one with \(x\), the other with \(2x\). You open an envelope and see amount \(a\).  
     - Naive reasoning: Other envelope is \(2a\) or \(a/2\), each with probability \(1/2\).  
     - Expected value: \(\frac{1}{2} \cdot 2a + \frac{1}{2} \cdot \frac{a}{2} = \frac{5a}{4} > a\) → always switch.  
     - *Dependency:* Audience knows this; sets the stage for diagnosis.  

  2. **Die-Rolling Variant: Empirical Counterexample (25 min)**  
     - **Setup:** Smaller amount determined by fair die: pairs \((1,2), (2,4), (3,6), (4,8), (5,10), (6,12)\).  
     - **Compute conditional expectations:**  
       - *Example 1 (a=2):*  
         - Possible: Holding smaller in \((2,4)\) (other=4) or larger in \((1,2)\) (other=1).  
         - \(\mathbb{P}(\text{smaller} | a=2) = \frac{1}{2}\), \(\mathbb{P}(\text{larger} | a=2) = \frac{1}{2}\).  
         - Expected value: \(\frac{1}{2} \cdot 4 + \frac{1}{2} \cdot 1 = 2.5 > 2\) → switch.  
       - *Example 2 (a=8):*  
         - Only possible: Holding larger in \((4,8)\) (other=4).  
         - \(\mathbb{P}(\text{smaller} | a=8) = 0\), \(\mathbb{P}(\text{larger} | a=8) = 1\).  
         - Expected value: \(4 < 8\) → do not switch.  
     - **Strategy:** Switch if \(a \in \{1,2,3,4,5,6\}\), stand pat if \(a \in \{8,10,12\}\).  
     - **Key Insight:**  
       - "Always switch" is false (fails at \(a=8\)).  
       - "It cannot matter" is false (switching increases EV for \(a \leq 6\), decreases for \(a \geq 8\)).  
     - *Why it works:* Demonstrates that the naive assumption (probability \(1/2\)) fails when \(a\) reveals information about the prior.  
     - *Dependency:* Must follow the naive argument; concrete example forces engagement.  

  3. **Addressing the Worry: "Resolves Too Cheaply" (5 min)**  
     - **Preempt misconception:** "This is just a slip about knowing the prior."  
     - **Clarify:** The flaw is deeper. The naive argument ignores that \(\mathbb{P}(\text{smaller} | a)\) depends on:  
       - The prior distribution.  
       - Whether \(2a\) and \(a/2\) are possible given \(a\).  
     - **Transition:** But what if we design a prior where both are always possible?  

  4. **Second Movement: Proper Prior with Infinite Support (25 min)**  
     - **Setup:** Smaller amount \(X\) with distribution \(\mathbb{P}(X=2^k) = \frac{2}{3} \cdot \frac{1}{3}^k\) for \(k=0,1,2,\ldots\) (proper, sums to 1).  
     - **Compute \(\mathbb{E}[\text{other} | a]\) for \(a=2^k\):**  
       - Case 1: Holding smaller (\(X=a\)) → other=\(2a\).  
       - Case 2: Holding larger (\(X=a/2\)) → other=\(a/2\).  
       - \(\mathbb{P}(\text{Case 1} | a) = \frac{1}{4}\), \(\mathbb{P}(\text{Case 2} | a) = \frac{3}{4}\).  
       - Expected value: \(\frac{1}{4} \cdot 2a + \frac{3}{4} \cdot \frac{a}{2} = \frac{a}{2} + \frac{3a}{8} = \frac{7a}{8} < a\).  
     - **Result:** \(\mathbb{E}[\text{other} | a] < a\) for all \(a\) → never switch.  
     - **Contrast with naive argument:**  
       - Naive assumes \(\mathbb{P}(\text{smaller} | a)=\frac{1}{2}\) → \(\frac{5a}{4}\).  
       - Actual \(\mathbb{P}(\text{smaller} | a)\) is skewed → \(\frac{7a}{8}\).  
     - **Key Insight:** The naive \(1/2\) assumption fails even with a "nice" prior. The flaw is not about improper priors or infinity.  
     - *Extra work:* Calculating \(\mathbb{P}(\text{Case 1} | a)\) requires Bayes’ rule and summing probabilities. Highlight dependence on prior.  

  5. **Improper Prior Variant (Optional, 10 min)**  
     - **Setup:** Uniform improper prior on \(X > 0\).  
     - **Result:** \(\mathbb{P}(\text{smaller} | a) = \frac{1}{2}\) → \(\mathbb{E}[\text{other} | a] = \frac{5a}{4}\).  
     - **Why it doesn’t contradict:**  
       - Unconditional \(\mathbb{E}[a]\) is infinite → expected value reasoning breaks (infinity - infinity).  
       - Switching argument self-contradicts (always want to switch back).  
     - **Role:** Shows that even when the \(1/2\) assumption holds, improper priors cause new problems. Not a counterexample to the diagnosis.  

  6. **Diagnosis and Misconceptions (15 min)**  
     - **Flaw in naive argument:** Step 3 (assuming \(\mathbb{P}(\text{smaller} | a) = \frac{1}{2}\)).  
       - \(\mathbb{P}(\text{smaller} | a)\) depends on the prior and the value of \(a\).  
       - It is not always \(1/2\) (die example: 0 at \(a=8\), \(\frac{1}{4}\) in infinite proper prior).  
     - **Head off misconceptions in sequence:**  
       | Misconception | When it arises | How to head off |  
       |--------------|----------------|-----------------|  
       | "No uniform distribution, so ill-posed" | After die example | Emphasize any proper prior works; problem is well-posed. |  
       | "Symmetry settles it" | After naive argument | Show die example’s conditional strategy breaks symmetry; always-switch is symmetric but naive is invalid. |  
       | "Expected value is wrong" | After die/infinite examples | We used EV correctly; flaw is in probability assignment. |  
       | Conflate \(\mathbb{P}(\text{smaller})\) before/after opening | During diagnosis | Stress: Unconditional \(\mathbb{P}(\text{smaller})=\frac{1}{2}\), but conditional \(\mathbb{P}(\text{smaller} \mid a) \neq \frac{1}{2}\) in general. |  
     - **Settled vs. Contested:**  
       - Settled: Naive argument fails; flaw is in Step 3.  
       - Contested: Whether the "fixed-amount" version (no prior) has a satisfying resolution. Do not present one as consensus.  

  7. **Closing Question (5 min)**  
     - "In the naive argument, which step fails first, and what specific assumption does it rely on that does not hold universally?"  
       - **Ideal answer:** Step 3 assumes \(\mathbb{P}(\text{smaller} | a) = \frac{1}{2}\), but this depends on the prior and \(a\).  

  8. **Explicitly Avoid (Throughout)**  
     - Measure theory.  
     - Deep dives into improper priors (mention only to contrast).  
     - Advocating one resolution of the fixed-amount paradox.  
     - Calling the die example "trivial"—it concretizes the flaw.  

  ---

  ### **Why the Die Example Carries the Weight**  
  - **Strengths:**  
    - Forces confrontation: The same logic (naive \(1/2\)) works at \(a=2\) but fails at \(a=8\).  
    - Shows \(\mathbb{P}(\text{smaller} | a)\) varies with \(a\) (0, \(\frac{1}{2}\), 1).  
    - Proves "always switch" and "never matters" are both false.  
  - **Addresses Worry:** It does not resolve cheaply because:  
    1. The second movement (infinite proper prior) shows the flaw persists even when both \(2a\) and \(a/2\) are possible.  
    2. Highlights that the root is the probability assignment, not finite vs. infinite support.  
  - **Use:** It is the pivot from "flaw exists" to "flaw is general."  

  ---

  ### **Flow Summary**  
  1. Naive argument → Die example (flaw exposed) → Rebut "cheap resolution" worry → Infinite proper prior (flaw generalized) → Improper prior (tangent, not counterexample) → Diagnosis → Misconceptions → Q&A.  
  2. Total: Naive (5 min) + Die (25) + Transition (5) + Infinite Prior (25) + Improper (10) + Diagnosis (15) + Closing (5).  

  This plan ensures the audience locates the fallacy (Step 3) and understands why even "benign" priors don’t save the naive argument. The die example is essential, and the second movement prevents oversimplification.
