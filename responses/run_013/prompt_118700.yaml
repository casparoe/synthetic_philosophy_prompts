  First, I consider the core dilemma: how to argue against party formation using Weil's "collective passion" theory while acknowledging the real electoral consequences of vote-splitting. The speech must demonstrate self-awareness about its own rhetorical form - it can't whip up passion while condemning it. That paradox needs structural embedding.

  For the audience split, I imagine two rhetorical paths: frontline tenants need concrete stakes ("eviction votes"), while policy-experienced members require institutional analysis. Weil's framework bridges them by showing how party machinery could corrupt their current open assembly - the very thing that empowered tenants initially. The landlord-eviction example serves both: a tangible loss and systemic failure.

  The trickiest part is meeting the electoral objection head-on. I'll concede that vote-splitting costs seats but argue that becoming what we oppose sacrifices our legitimacy. Our three independent councillors succeeded precisely because they weren't party delegates. This turns the objection inside out - our power comes from autonomy.

  Weil's diagnosis does heavy lifting here: parties demand loyalty to growth over truth. Our recent symptoms (repetitive slogans, enemy-seeking) prove her point. I'll present registration not as progression but metamorphosis - we cease being a movement. The speech's tone must model our ideal: urgent but undogmatic, leaving room for dissent.

  For the meta-commentary to the student: I'm least confident about Weil's total rejection of parties. Her 1943 context differs from modern proportional systems. But her core mechanism - institutional self-preservation overriding purpose - remains empirically valid, as shown by our own emerging groupthink. The speech's restraint (no applause lines) intentionally mirrors the content, though I worry it may not energize enough. Still, coherence with Weil's warning justifies this risk.
