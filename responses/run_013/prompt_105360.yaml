  ## Commencement Speech

  [Setting: Visiting room, folding chairs, graduates in caps and gowns, families, staff, donors, dean. Speaker stands at a simple podium.]

  You know, walking in here today, seeing the chairs set up, the caps, the gowns… it hit me. This space. Normally, it’s where you meet lawyers, or families, under fluorescent lights and watchful eyes. Today? You’ve transformed it. You brought academia into the visiting room. That alone tells me something about what you’ve done.

  Look around. Look at what you’ve built here. Not the folding chairs, but this moment. The papers written after lock-in, the books carried back to the unit past the stares, the arguments about Kant or Rawls or Du Bois hammered out over plastic tables. You showed up, week after week. You wrestled with ideas meant to unsettle comfortable lives, while living a life unsettled in profoundly different ways. That is not nothing. That is something real. You earned this recognition today. You *built* it.

  But here’s the thing I need to say, especially here, especially now. The word “deserve”… it’s a complicated one, isn’t it? We toss it around easily at graduations: “You deserve this diploma! You deserve success!” But life outside this room, the reason many of us are *in* this room… it makes that word feel heavy. If “deserve” means some cosmic score settled, some ultimate judgment passed on your whole life – well, who in this world could truly claim that? Who could stand under that kind of light? Not me. Not anyone. To say “you deserve to be where you are” – whether that’s standing in this cap and gown today, or sitting in a cell block – feels like claiming knowledge I don’t have, power I don’t possess. It reduces the messy, tangled web of choices, luck, history, and circumstance that lands any of us anywhere into a simple verdict. And life is rarely that simple.

  So, if that old, heavy idea of “deserve” crumbles under its own weight, what are we left with? What does it mean to stand here and praise your achievement? Does praise become meaningless? Patronizing? Just empty noise?

  I don’t think so. Here’s what I see, and what I believe we can truly celebrate without illusion:

  First, the *work*. The sheer, undeniable effort. Nobody handed this to you. You chose the hard path. You chose to read when you could have tuned out. You chose to write the paper when you could have made an excuse. You chose to engage with difficult ideas about justice, responsibility, and the good life, right here, where those ideas aren’t abstract. That choice, repeated, against the grain of this environment – that is yours. That agency is real. It may not be some mythical, unconstrained “free will” untouched by circumstance, but it’s the agency you exercised, right here, right now. We celebrate the *doing*. We acknowledge the effort expended, the skill developed, the understanding forged. This diploma isn’t a cosmic reward; it’s a testament to work done. That’s the first thing we honor.

  Second, and maybe more important here: the *showing up*. Not just physically, though that matters. But showing up intellectually. Showing up morally. Showing up for the community of learners you became. Philosophy, ethics… it forces us to ask: What do we owe each other? How do we build a world less cruel, more just? You engaged those questions seriously, not as spectators, but as people whose lives are deeply entangled with the answers. You showed up for the conversation about responsibility, even – *especially* – when the concept of ultimate desert feels shaky. That act – showing up, engaging, taking the questions seriously – *that* builds something. It builds capacity. It builds a different kind of self. It builds a claim to be heard, not because some ledger in the sky balances, but because you have done the work to understand the stakes. You have equipped yourselves to contribute, thoughtfully, to the world you will rejoin.

  This kind of praise isn’t about condescension. It’s about recognition. It’s about saying: "We see the effort you made. We see the choices you took hold of, within the constraints you faced. We see the person you are building *now*." That person matters. The skills you’ve honed – critical thinking, reasoned argument, ethical reflection – they matter. Not as magic keys, but as tools. Tools to navigate complexity. Tools to understand systems, including the one you’re in. Tools to build a future that isn’t just *given* to you, but one you have a better chance of shaping.

  So, graduates, today we don’t celebrate some imaginary, perfectly free, cosmically deserving you. We celebrate the real you. The one who wrestled with Hume on a bunk bed. The one who argued about virtue ethics during chow time. The one who chose the library cart over the yard, again and again. We celebrate the work you did, the capacities you’ve strengthened, and the simple, powerful act of showing up for the hard questions about how to live. That work, that effort, that choice to build – that is undeniable. That is worthy. That is the foundation you stand on today. Hold onto it. Build on it. The world needs people who’ve thought this hard about what it means to be responsible. Go forward, use what you’ve built.

  Congratulations.

  ---

  ## Philosophy & Context Note (Not for Speech)

  This speech navigates the Caruso/Dennett terrain by structurally embedding their core disagreement about desert and reshaping praise, while avoiding direct citation or jargon. Here’s where it takes specific, contested positions and the underlying debates:

  1.  **Rejecting Basic Desert (Leaning Caruso):** The speech explicitly rejects "basic desert" – the idea that suffering or reward is intrinsically deserved based on ultimate moral responsibility ("cosmic score," "ultimate judgment"). This aligns with Caruso (and broader skeptical positions like Strawson's pessimism or Smilansky's illusionism) against Dennett’s compatibilism which *aims* to preserve a deflated form of desert. The speech argues this heavy desert is incoherent *especially* in the prison context. **Contested:** This is the heart of the free will debate. Dennett and many compatibilists argue their deflated desert *is* coherent and essential (e.g., "desert-lite" in *Just Deserts*). Hard determinists like Caruso/Greene and illusionists like Smilansky reject all desert. There is **no consensus**; it's the core live debate.
  2.  **Deflating Praise into Recognition of Effort & Capacity (Dennett-esque, but Skeptical):** To avoid praise becoming meaningless or condescending without basic desert, the speech pivots to praising the observable *effort*, *choices made within constraints*, developed *skills*, and *capacity for moral engagement* ("showing up"). This is Dennett’s strategy (e.g., praising the "can-do" attitude developed). **Contested:** Skeptics (like Caruso in response) argue this *is* still condescending if it implies these efforts/praiseworthy traits were *ultimately* up to the agent in a way that grounds true desert. The speech leans on the reality of *local* agency ("choices you took hold of, within the constraints") as sufficient for meaningful praise, which is a compatibilist move Dennett would endorse but hard skeptics might still question as insufficiently deep.
  3.  **The Asymmetry Addressed:** The speech directly confronts the asymmetry: if blame/punishment based on desert is problematic, so is praise/reward. It doesn’t dodge it. It argues that praise based on *effort and capacity-building* ("We see the work you did," "the capacities you’ve strengthened") survives the rejection of basic desert, whereas punishment based solely on desert does not. It implicitly contrasts the diploma (earned effort) with incarceration (not deserved as cosmic punishment). **Contested:** This rests on the contested claim above (#2). A hard skeptic might say both praise *and* blame require the same kind of ultimate responsibility, so praising effort is just as misplaced as blaming. The speech stakes a position that effort/engagement *is* praiseworthy recognition, not desert-based reward.
  4.  **"Showing Up" as Moral Agency:** Framing "showing up" intellectually/morally as building a "claim to be heard" and capacity for contribution is a Dennettian move (building the moral self/tools within society). **Contested:** Critics might argue this underestimates structural barriers post-release or overstates the individual's capacity to "build" under constraint. The speech avoids overclaiming outcomes ("Not as magic keys, but as tools").
  5.  **Empirical Claims (Handled Cautiously):**
      *   The speech describes the *observed* effort of the graduates (reading, writing, engaging). This is phenomenological, not a broad empirical claim.
      *   It claims the skills learned (critical thinking, ethics) are "tools" for navigating complexity and building a future. This is a common justification for prison education but **nuanced empirically**. Meta-analyses (e.g., Davis et al.) generally show prison education *correlates* with reduced recidivism and improved post-release outcomes, but establishing strict causation and the specific impact of philosophy (vs. basic literacy or vocational skills) is complex. The speech phrases it cautiously ("a better chance of shaping," "tools to navigate," "needs people who've thought this hard") avoiding strong causal claims like "this will keep you out of prison."
      *   **Crucially Avoided:** The speech **does not** engage with Caruso’s quarantine model or actuarial risk scores. Mentioning "managing risk" or scores would be highly inappropriate and empirically fraught (known biases in risk assessment tools, debates over predictive validity and ethics). The critique of desert-based incarceration is philosophical (incoherence), not replaced with the risk model.

  **In essence:** The speech adopts a skeptical stance towards *basic desert* (Caruso-aligned), then adopts a Dennett-inspired compatibilist strategy for *reconstructing meaningful praise* based on effort, local agency, and capacity-building within a social context. It explicitly rejects the asymmetry leading to the collapse of *all* praise, arguing that recognizing effort and developed capacity survives the rejection of cosmic desert. This synthesis navigates the tension but firmly places itself in contested territory on the core issue of desert and the grounding of praise. It avoids empirically shaky claims about risk or education outcomes by focusing on the observable effort and the inherent value of the skills/knowledge developed.
