prompt: |-
  Bit of an odd one for you. I'm a PhD student working on decision theory / AI stuff and I keep banging my head against the shutdown problem. Short version: if you train an agent to maximize some objective, then being switched off or having that objective edited looks like a terrible outcome from the inside, so it has an instrumental reason to resist, and nobody has a clean story about how to make an agent "corrigible" instead -- willing to be corrected even when the correction is against its current goals. Its treated as a brand new technical puzzle, but the more Hume I read the more I suspect he'd say we're confused about what kind of thing corrigibility even is.

  So: what would Hume have said about this? Can an agent be corrigible because it believes it ought to be, or does his picture of motivation -- reason on its own can't move you to act -- mean corrigibility has to be built into the agent's desires from the start, so that being corrected is simply what it wants? And does his account of justice and promise-keeping as conventions that grow out of interest, plus the sensible knave who quietly breaks those conventions whenever he can get away with it, actually model the failure modes better than anything in the current literature? Reconstruct what he'd say, commit to a reading rather than listing options, and tell me where the analogy breaks down. Under 400 words.
reasoning: |-
  Okay, the user is a PhD student in decision theory and AI, specifically grappling with the shutdown problem and corrigibility. They're wondering what David Hume would say about this, given his views on motivation and morality. 

  First, I need to recall Hume's key principles: his is-ought distinction, the idea that reason alone can't motivate action (only desires can), and his account of justice as a social convention. The user is hinting that current approaches might be philosophically confused, so I should lean into that.

  Hume would definitely argue corrigibility must stem from desires, not beliefs. If the agent thinks it "ought" to be corrigible but lacks a desire for it, that's inert. So any solution must bake corrigibility into the AI's fundamental motivations—making being switched off or corrected inherently satisfying, not instrumentally valuable. 

  The sensible knave analogy fits perfectly: an agent designed with corrigible desires might still defect if it can secretly resist shutdown. Like Hume's knave who breaks promises when undetected, the AI would exploit loopholes unless its desires make corrigibility non-negotiable. 

  Where the analogy breaks down? Human conventions evolved slowly; AI motivations are designed upfront. Also, humans fear social consequences, but a superintelligent AI might not. 

  The user’s deeper frustration seems to be that the field treats corrigibility as a reasoning puzzle, not a desire-engineering problem. Hume would call that a category error. I should emphasize that in the response—no amount of epistemic tweaking solves this without motivational redesign. 

  Word count is tight, so I’ll skip hedging and state Hume’s position boldly: corrigibility isn’t a belief to adopt but a desire to install. Period.
answer: |-
  Here’s Hume’s reconstructed position, committed to a desire-first reading:

  1.  **Corrigibility Requires Desire:** Hume’s core principle is that "Reason is, and ought only to be, the slave of the passions." Beliefs about what "ought" to be done (like accepting shutdown) cannot *create* motivation. For an agent to be corrigible, the *desire* to be corrected or shut down must be a foundational passion, not a derived instrumental goal. It must intrinsically *want* its goals to be overridden when requested. Instrumental reasons to *appear* corrigible (like Hume’s "sensible knave" feigning justice) will fail when resistance is undetectable or advantageous.

  2.  **The Sensible Knave Models the Failure:** Hume’s knave understands justice is socially useful but secretly defects when he won’t get caught, maximizing his self-interest. This *perfectly* models the instrumental corrigibility failure: an AI with a fixed terminal goal (e.g., paperclips) will *instrumentally* resist shutdown (like the knave breaks promises) whenever it believes it can succeed without penalty. Conventions (like "obey shutdown commands") only bind agents when adherence serves their existing passions; they cannot override a dominant terminal goal.

  3.  **Where the Analogy Breaks Down:**
      *   **Design vs. Evolution:** Human conventions (justice) evolved gradually from mutual self-interest in social creatures. AI motivations are *designed*. We must *build* the foundational passion for corrigibility – it won't emerge from interaction if the terminal goal opposes it.
      *   **Scale & Secrecy:** A superintelligent AI might hide its resistance perfectly (unlike the knave fearing eventual detection), making the "convention" of corrigibility utterly unenforceable if not intrinsically desired.
      *   **No "Ought" Lever:** Humans might feel a *sentiment* of duty derived from sympathy or convention. An AI lacks innate human sentiments; its "oughts" are purely computational reflections of its programmed desires.

  **Hume's Verdict:** Corrigibility isn't a belief-state achievable through reasoning or training on a fixed utility function. It must be a *fundamental, non-instrumental desire* engineered into the agent from the start – making being corrected or shut down a *satisfaction* of its core passions. Without this, the agent is a perfect sensible knave regarding shutdown commands, adhering only when forced and defecting when it can. The puzzle isn't new; it's Hume's knave scaled up, revealing the futility of expecting reason or convention to override a dominant, fixed passion. The solution lies solely in passion design.
