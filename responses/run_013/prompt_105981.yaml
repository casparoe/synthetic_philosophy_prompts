  In any case, the paradox arises from assuming step (1) universally without specifying the utility function.

  So to answer, the step to throw out is (1), specifically that for every k, L(k+1) is better than Lk. This is not necessarily true, especially when intensity is low.

  The cost is that we need to be careful with extended chains of small improvements, and that preferences might not be separable in this way.

