prompt: |-
  Two colleagues of mine spent a lunch break arguing about whether the prosperity and order delivered by governments such as Singapore's or China's can justify their authoritarian character. Neither would concede anything and I could not referee. Here is the exchange as it went; I would like you to adjudicate it move by move rather than summarizing what the literature says.

  (1) He said the proper test of a political system is whether it delivers security and rising living standards, and that on that test these governments pass while many democracies visibly struggle, so the absence of competitive elections cannot by itself settle the case.

  (2) She said he was confusing why people comply with whether they are obligated to. Fear and satisfaction may produce obedience, but that shows the regime is effective, not that it has any right to rule; a well-run firm earns its employees' cooperation without acquiring authority over their politics.

  (3) He replied that 'a right to rule' is liberal theology. Legitimacy, sociologically, just is the settled belief that a regime is entitled to rule; where a state has kept its side of a bargain for decades and the population genuinely believes it is entitled, the regime is legitimate, whatever a philosopher's intuition reports. To demand a warrant independent of what people actually accept is precisely the parochial move.

  (4) She said that makes the view unfalsifiable: no matter how the prosperity was produced or how durable it is, a grateful enough population could launder any arrangement into legitimacy. She added that the justification is self-undermining, since a regime that teaches its people that authority rests on results has given them a reason to withdraw allegiance as soon as results disappoint, and so cannot supply the stable ground a theory of legitimacy is meant to supply.

  (5) He answered that conditionality is no defect -- consent theories make authority conditional too -- and that the self-undermining charge proves too much, since any honest justification will license withdrawal when its own conditions fail.

  (6) She came back with the point that 'order' is not a single outcome: order bought with pervasive surveillance is partly constituted by the loss of things people value, so the performance being credited is not one thing that can simply be weighed against its costs. He said that only works if you smuggle in the liberal values you claim to be testing the regime against.

  Give each of the six moves a rating, from clearly mistaken to clearly right, with a brief justification; say what each party is right about and what each is missing; and identify any distinction the exchange turns on that neither of them has drawn. Then give me a definite verdict on which of them, if either, is closer to correct, and say whether the question as they have posed it is well formed.
reasoning: |-
  Okay, the user presents a structured debate between two colleagues about authoritarian governance models like Singapore and China, framed as six sequential arguments. They want a move-by-move adjudication rather than a literature summary. 

  Hmm, this is clearly an ethics/political philosophy debate disguised as a lunch argument. The user seems intellectually engaged - they recorded the exchange precisely and want rigor. Probably an academic or policy professional. Their frustration with being unable to referee suggests they value clear frameworks over polemics.

  First, unpacking the core tensions: He grounds legitimacy in outcomes and popular acceptance (sociological view), she insists on normative justification (moral philosophy view). Both make valid points but talk past each other. The unspoken fault line is whether "legitimacy" describes social facts or moral permissibility - a classic Weber vs Locke divide.

  For Move 1: His pragmatic argument isn't "clearly mistaken" - development data supports it - but it conflates effectiveness with justification. Should rate this "mixed" since he correctly notes elections aren't the only metric, yet ignores that security/prosperity might be achieved through immoral means. 

  Move 2 is sharper: She nails the compliance/obligation distinction (Hart's internal aspect of rules!), but oversimplifies by ignoring that sustained popular satisfaction might indicate tacit consent. The firm analogy is clever but flawed - states aren't voluntary associations. Rating: mostly right but needs nuance.

  Ah, Move 3 exposes his relativism. Calling rights "theology" is provocative but not indefensible (legal positivism vibes). Still, he misses her point about circularity: if legitimacy requires belief in legitimacy, how did that belief form? Under duress? Rating: partially valid but risky.

  Move 4 is her strongest - the "self-undermining" argument is brilliant. Any results-based legitimacy is inherently unstable. But she underestimates how nationalist education or controlled information flows might delay that reckoning. Rating: incisive yet culturally narrow.

  Move 5 shows him deftly turning her weapon back - all theories have exit clauses. Yet he dodges her deeper concern: should states condition loyalty solely on performance? What about rights violations during "effective" rule? Rating: clever rebuttal but evasive.

  Final Move 6 crystallizes everything. Her "order isn't unitary" insight is profound (echoing Berlin's value pluralism). His "smuggling liberalism" retort has bite though - she hasn't justified why privacy/autonomy should universally outweigh security. Rating: stalemate with philosophical depth.

  The verdict leans toward her because conditional legitimacy is indeed fragile (see Arab Spring), but his empirical observations demand engagement. Neither grapples with the core dilemma: Can long-term stability exist without moral constraints on power? 

  User likely wants this resolved to inform real-world assessments of authoritarian systems. Should emphasize that while her framework is more coherent, his warnings about democratic underperformance can't be dismissed. The question itself needs reframing - not "can prosperity justify authoritarianism?" but "what makes any government justified beyond mere endurance?"
answer: |-
  Here's a move-by-move adjudication, ratings, key insights, and a final verdict:

  **Core Distinction Neither Drew:**  
  **Descriptive Legitimacy (sociological fact of acceptance)** vs. **Normative Legitimacy (moral justification for authority)**. Their debate conflates these throughout.

  ---

  ### Adjudication
  **Move 1 (He):**  
  *Rating:* **Partially Valid, But Incomplete**  
  *What he’s right about:* Effectiveness (prosperity/security) is a pragmatic test many societies prioritize. Competitive elections alone don’t guarantee good outcomes.  
  *What he’s missing:* Confuses *effectiveness* with *moral justification*. A system can be efficient yet oppressive (e.g., a slave plantation). Ignores procedural justice and rights.  

  **Move 2 (She):**  
  *Rating:* **Mostly Right**  
  *What she’s right about:* Correctly separates *compliance* (driven by fear/satisfaction) from *moral obligation*. Authority requires justification beyond results (e.g., consent, rights). The firm analogy is apt: performance doesn’t grant political authority.  
  *What she’s missing:* Underestimates that sustained popular satisfaction *can* contribute to normative legitimacy (e.g., through tacit consent).  

  **Move 3 (He):**  
  *Rating:* **Descriptively Valid, Normatively Weak**  
  *What he’s right about:* Sociologically, legitimacy *is* often defined as widespread belief in authority (Weberian perspective). Dismissing philosophical intuitions as "parochial" highlights cultural relativism.  
  *What he’s missing:* Popular belief doesn’t resolve moral questions (e.g., a "genuine belief" in slavery wouldn’t make it just). Confuses *acceptance* with *justification*.  

  **Move 4 (She):**  
  *Rating:* **Strong**  
  *What she’s right about:*  
  - (i) His theory *is* unfalsifiable: Any regime can claim legitimacy if it engineers acceptance.  
  - (ii) Results-based legitimacy *is* self-undermining: Conditioning allegiance on performance invites instability when crises hit (e.g., economic downturns).  
  *What she’s missing:* Doesn’t address that *all* regimes (including democracies) face legitimacy crises when failing—but democracies have mechanisms for renewal.  

  **Move 5 (He):**  
  *Rating:* **Partially Valid**  
  *What he’s right about:* Consent theories (e.g., Locke) *do* make authority conditional—withdrawal is justified if the "social contract" is breached.  
  *What he’s missing:* Consent theories root obligation in *autonomy* (people’s right to self-govern), not just outcomes. His model reduces politics to transactional efficiency, ignoring rights violations that may enable "prosperity."  

  **Move 6 (She):**  
  *Rating:* **Decisive**  
  *What she’s right about:* "Order" isn’t neutral. Authoritarian "order" often relies on repression (surveillance, censorship), which *itself* violates goods like privacy or free expression. You can’t credit the regime for "delivering order" while ignoring that its methods *constitute* injustice.  
  *What he’s missing (in reply):* His "liberal values" retort assumes her critique is biased, but her point is universal: Any political order must justify *how* it achieves outcomes, not just that it does.  

  ---

  ### Verdict  
  **She is closer to correct.**  

  **Why:**  
  1. **Core Issue:** The debate centers on normative legitimacy ("justification"), not just effectiveness. She consistently engages this while he conflates it with acceptance or outcomes.  
  2. **Fatal Flaws in His Position:**  
     - His theory *is* unfalsifiable (Move 4) and self-undermining (collapses when performance falters).  
     - He ignores that authoritarian "prosperity" often relies on illiberal means (e.g., stifling dissent), which she rightly problematizes (Move 6).  
  3. **Her Strength:** She distinguishes *compliance* from *obligation* (Move 2) and exposes how authoritarian "order" can be intrinsically oppressive (Move 6).  

  **Is the Question Well-Formed?**  
  **No.** They frame it as "prosperity/order vs. authoritarianism," but this is flawed:  
  - It assumes authoritarianism is *necessary* for such outcomes (disputed by cases like Denmark or Taiwan).  
  - It treats "prosperity" and "order" as monolithic goods, ignoring how they’re achieved (e.g., Uyghur repression in China).  
  - **Better question:** *"Can a state that systematically denies political rights and liberties be morally legitimate, even if it delivers material security?"*  

  **Final Note:** Neither sufficiently grapples with trade-offs (e.g., rapid development vs. civil liberties) or the possibility that legitimacy could be *hybrid* (partly based on outcomes, partly on procedures). But she offers the more coherent account of political obligation.
