  ### Drafter’s Note
  As the drafter, I have made committed choices where formulations were open, defended below. My verdict on the core question—whether moral compromise can be a genuine gain—draws on the cruxes.

  **Defended Formulations**:  
  - For **Crux A**, I framed the interpersonal/intrapersonal separation as pivotal because the Integrity theorist’s residue objection centers on individual accountability (intrapersonal), while the Exchange model focuses on joint gains (interpersonal). This clarifies why the trade analogy is natural for the latter but alien to the former.  
  - For **Crux B**, I treated "something more" as a potential artefact because the Exchange theorist can absorb claims into rankings (e.g., by weighting constraints infinitely). The Integrity theorist’s "claims" may stem from conflating moral psychology (e.g., guilt) with normative structure.  
  - For **Crux C**, I assumed absolute constraints are rare and often rankable in practice (e.g., A ranks P4 > D out of necessity), preserving the frontier. This reflects the Exchange theorist’s view that incomparability is a failure of deliberation, not a feature of values.  

  **Verdict on Moral Compromise**:  
  I conclude that compromise can be a genuine gain, as the Exchange theorist argues, with two qualifications.  
  - **Why**: The Pareto frontier model is robust for non-constraint compromises (e.g., P2 or P3). Gains are real by each party’s ranking, and the "residue" is a psychological or deontic artefact. If values are fully incorporated into rankings (e.g., constraints as infinite costs), residue adds nothing. Crux A shows the corruption objection misapplies intrapersonal integrity to interpersonal trade. Crux B reveals that "claims" are reducible to rankings if disvalues are properly weighted. Crux C is marginal; even constraints can be ranked (e.g., P4 > D as a tragic choice), so frontiers rarely fail.  
  - **Qualifications**: (1) For constraints, compromise may involve moral loss (e.g., choosing P4), but this is captured by rankings (P4 is a "gain" only relative to D, not absolutely). (2) The Integrity theorist correctly identifies that language like "gain" may sanitize real moral costs, but this is pedagogical, not structural.  
  Thus, the Exchange view prevails: Compromise is a gain by each party’s lights, and the frontier model should guide decisions. The collaboration resolves that compromise is not betrayal but rational cooperation under value pluralism.
