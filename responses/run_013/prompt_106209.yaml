  We are drafting a joint statement for two theorists: Exchange (E) and Integrity (I). We have a running example: two campaigners (A and B) in a coalition must jointly endorse one of several policy packages (P1, P2, ..., Pn). Each ranks the packages by her own values. If they cannot agree, the coalition endorses nothing and the vote is lost (default outcome D), which both rank below every package. Also, include one package (say, Px) that each campaigner would have to regard as violating a constraint (not just a cost).

  The Exchange theorist (E) sees compromise as mutually beneficial trade. The Integrity theorist (I) sees compromise as a lesser evil that leaves a moral residue.

  The statement must have:
  1. A numbered list of claims both accept.
  2. The surviving disagreements, stated fairly for each side.
  3. The cruxes (sub-questions that would move at least one party if settled).
  4. For each crux, the agreed case/argument/thought experiment and both parties' predictions.

  Then a note on whether any dispute is merely verbal.

  Finally, a drafter's note with the drafter's own verdict.

  We are also asked to address two expected cruxes:
  Crux 1: Whether the trade analogy (interpersonal) and corruption objection (intrapersonal) are being conflated.
  Crux 2: Whether the trade analogy requires only rankings, while integrity requires "something more", and if that something more is genuine or an artefact.

  Also, whether there are values that cannot be ranked (which would break the frontier picture).

  Now, let's build the joint statement.

  Part 1: Claims both accept

  Both can agree on:
  1. The setup: Two parties with different value systems must choose a joint action from a set of options, including a default outcome that is worse for both than any other option.
  2. Each party has a complete, transitive ranking over the outcomes (including the default and the packages).
  3. A settlement is a joint choice of one of the packages (or the default if they fail).
  4. A settlement is a gain for a party by her own lights if she ranks it above the default.
  5. A settlement is Pareto-improving over the default if both rank it above the default.
  6. A settlement is Pareto-optimal (in the set of packages) if there is no other package that both prefer to it.
  7. Both can accept that the usual objection "compromise betrays one's values" is not about the ranking per se (since by definition, if a party ranks the settlement above the default, she prefers it) but about whether such a ranking adequately captures the moral psychology of compromise.
  8. Both can agree that in the example, the package Px (which violates a constraint) would be ranked very low by each, but the default D is even lower. However, for the Integrity theorist, choosing Px might be impermissible even if it is ranked above D.

  Part 2: Surviving disagreements

  We state the disagreements in wording each side would accept.

  Exchange theorist's view: 
  - A compromise settlement that is Pareto-improving over the default and Pareto-optimal among the available packages is a genuine gain for both parties by their own rankings. The fact that each party gives up on some of their values in the compromise does not imply betrayal; it is simply a rational adjustment to the circumstances, analogous to trading goods at a mutually beneficial rate.

  Integrity theorist's view:
  - Even when a compromise settlement is ranked above the default by a party's own ranking, it may involve a moral failure because values make claims that are not fully captured by a ranking. Conceding on a value leaves a moral residue for which the agent remains accountable. Therefore, a compromise is at best a lesser evil, not a gain, and describing it as a gain obscures the moral cost.

  Part 3: Cruxes

  We have at least two expected cruxes. Let's list them and add more if needed.

  Crux A: Is the trade analogy (which is interpersonal) being inappropriately applied to the intrapersonal process of weighing values? That is, does the objection to compromise (the "corruption" or "betrayal") arise only in the intrapersonal context (one agent weighing her own values) and not in the interpersonal exchange? If so, the dispute might rest on a conflation.

  Crux B: Does the trade analogy require only a ranking of outcomes, while the integrity objection requires that values have a feature (like making claims) that is not captured by the ranking? And if so, is that feature a genuine requirement for moral reasoning or an artefact of the way we talk about values?

  Crux C: Are there values that cannot be ranked against others? In particular, are there absolute constraints that cannot be traded off? If such values exist, then the Pareto frontier (which assumes comparability) may not be defined for all points, especially near the constraint-violating options.

  Part 4: For each crux, the agreed case, argument, or thought experiment and both parties' predictions.

  Crux A: Separation of interpersonal and intrapersonal.

  Agreed thought experiment:
  Consider two scenarios.

  Scenario 1 (Interpersonal): Two agents, A and B, each with their own values, are considering a trade. A has a banana and B has an apple. A values the apple more than the banana, and B values the banana more than the apple. They swap. Each is better off by their own ranking.

  Scenario 2 (Intrapersonal): Agent A must choose between two actions: Action X which promotes value V1 but violates value V2 (which A holds as a constraint), and Action Y which does not. Action X might lead to a better outcome on A's overall ranking (if she ranks outcomes that way), but by choosing X, A violates a constraint.

  Now, we ask: In Scenario 1, does the Integrity theorist see a moral residue? And in Scenario 2, does the Exchange theorist see it as a simple trade-off?

  Exchange theorist's prediction for Scenario 1: The Integrity theorist should not see a moral residue in the trade because it is an interpersonal exchange of goods that each party values differently. There is no violation of a constraint by one's own values because each is simply exchanging a good they value less for one they value more.

  Integrity theorist's prediction for Scenario 1: Even in an interpersonal trade, if the goods traded are such that one party is giving up something that is not merely a commodity but is tied to a value that makes a claim (e.g., selling a vote or a kidney), then there might be a moral residue. But for ordinary commodities, there may be none.

  Exchange theorist's prediction for Scenario 2: The Exchange theorist would see the choice in Scenario 2 as one that should be made by ranking the outcomes. If A ranks the outcome of Action X above Action Y, then choosing X is rational and does not leave a residue because the ranking already incorporates all relevant factors.

  Integrity theorist's prediction for Scenario 2: In Scenario 2, if V2 is a constraint, then even if the outcome of X is ranked higher overall, choosing X violates a constraint and leaves a moral residue. The ranking does not capture the deontic aspect.

  But note: The crux is whether the dispute is due to conflation. So after the experiment, we might see:

  If the Integrity theorist agrees that in Scenario 1 (ordinary trade) there is no residue, but in the intrapersonal constraint case (Scenario 2) there is, then the Exchange theorist might say: "Ah, so in the interpersonal compromise we are considering (like the coalition), it is like Scenario 1, not Scenario 2. Hence, no residue."

  But the Integrity theorist might say: "In the coalition, when I agree to a package that violates a constraint of mine, it is like I am violating my own constraint. So it is intrapersonal. The compromise forces me to do that."

  So the thought experiment might not fully separate because the coalition case is interpersonal but each agent is making an intrapersonal decision.

  Revised thought experiment for Crux A:

  Consider the coalition example. Suppose that the package Px violates a constraint for campaigner A, but is otherwise very good for both. If they choose Px, campaigner A has violated her constraint. Now, we can break down:

  - The interpersonal aspect: A and B agree to endorse Px together.
  - The intrapersonal aspect: A, by endorsing Px, is acting against her own constraint.

  Now, we ask: Is the moral residue due to the interpersonal agreement or the intrapersonal violation?

  Agreed case: 
  In the coalition, when campaigner A agrees to endorse Px, she is doing so because the alternative (D) is worse. But by her own values, she is violating a constraint. We isolate:

  Case A1: Suppose campaigner A is the sole decision-maker. She must choose between Px and D. If she chooses Px, she violates a constraint. The Integrity theorist says this leaves a residue.

  Case A2: In the coalition, when A and B jointly agree to Px, the Exchange theorist says this is a mutually beneficial trade. But for A, she is still violating her constraint.

  The question: Is the residue in the coalition case (A2) the same as in the sole decision-maker case (A1)? And is the residue in A1 the same as in the intrapersonal scenario?

  Exchange theorist: The residue, if any, is the same in A1 and A2. But in both cases, if the ranking places Px above D, then it is the best choice and there should be no residue because the agent is doing the best she can. The constraint is already factored into the ranking.

  Integrity theorist: The residue is present in both A1 and A2 because the constraint is violated. The ranking does not capture the fact that the constraint is being violated; it only shows that the outcome is preferred to the default. The residue is independent of the ranking.

  Predictions:
  Exchange theorist: After this analysis, the Integrity theorist will see that the residue is tied to the intrapersonal violation and that in the interpersonal trade without a constraint violation (e.g., trading bananas and apples) there is none. Therefore, the dispute in the coalition case is about the nature of the values (whether they are constraints) and not about the interpersonal trade aspect.

  Integrity theorist: The residue is present whenever a constraint is violated, whether in an intrapersonal or interpersonal setting. The trade analogy is misleading because it treats values as commodities that can be traded without residue, but constraints are not like that.

  Crux B: Rankings vs. something more.

  Agreed argument: 
  Consider a scenario where an agent has a ranking of outcomes that includes violating a constraint. The Exchange theorist holds that the ranking is sufficient for rational choice. The Integrity theorist holds that the ranking does not capture the fact that the constraint makes a claim that is not fully captured by the ranking.

  Agreed thought experiment: 
  Agent A must choose between:
  - Option 1: Save 5 lives by killing one innocent person (violates constraint against killing).
  - Option 2: Save no one.

  Suppose A ranks Option 1 above Option 2. The Exchange theorist says choosing 1 is a gain. The Integrity theorist says it is a lesser evil with residue.

  Now, we ask: What is the "something more" that the Integrity theorist requires? Is it that the constraint has a deontic force that is not captured by the ranking? And is that force a real feature of moral experience or an artefact of language?

  Exchange theorist's view: The ranking already reflects the disvalue of killing. If Option 1 is ranked above Option 2, then the disvalue is outweighed. The "something more" is an illusion created by not fully incorporating the disvalue into the ranking. In a proper ranking, the disvalue of killing would be so high that Option 1 would be below Option 2 unless the numbers are extreme (like saving a million). But if the ranking does place Option 1 above Option 2, then it is the best choice.

  Integrity theorist's view: The constraint against killing is not just a disvalue to be weighed; it is a prohibition. Even if the outcome of Option 1 is better overall, the act of killing is wrong and leaves a residue. This is a genuine feature of moral reality, not an artefact.

  Predictions:
  Exchange theorist: The Integrity theorist will insist on the residue even when the ranking is constructed to include all factors. The "something more" is a feature of the Integrity theorist's moral psychology, but it is not required for rational choice.

  Integrity theorist: The ranking cannot capture the deontic dimension. The Exchange theorist is reducing morality to a consequentialist calculus, which misses the categorical nature of some moral demands.

  Crux C: Non-rankable values.

  Agreed argument: 
  Suppose there are values that are absolute constraints: they cannot be overridden by any amount of another value. In the example, package Px violates a constraint for campaigner A. For A, any package that violates the constraint is worse than any package that does not, regardless of other benefits. So the ranking would have a discontinuity: all constraint-violating packages are below all non-violating ones. But what if the only packages that are feasible are constraint-violating? Then the default might be even worse, but the constraint says "do not violate the constraint even to avoid a worse outcome".

  In the coalition example, if Px is the only package that is feasible (others are blocked by B, say), then A must choose between endorsing Px (violating constraint) or the default (which is worse). But if the constraint is absolute, then A must not endorse Px, even if she ranks the default lower.

  Exchange theorist: If A ranks Px above the default, then she should choose Px. If she does not, it means the constraint is absolute and she ranks Px below the default. So the ranking should reflect that.

  Integrity theorist: The constraint is not about ranking; it is about permissibility. Even if A ranks Px above the default, it might be impermissible to choose Px. So the ranking does not capture permissibility.

  Agreed thought experiment: 
  Agent A faces:
  - Option A: Violate an absolute constraint (e.g., kill one innocent) to save 100 lives.
  - Option B: Do nothing, and 100 die.

  If the constraint is absolute, then Option A is impermissible even though it saves lives. But what about the ranking? If A is a utilitarian, she will rank A above B. But if she holds an absolute constraint, she might rank B above A? Or she might feel torn.

  The question: Can an agent hold an absolute constraint and still rank the outcome of violating it (with the saved lives) above the outcome of not violating it? Or does holding an absolute constraint require that the violation is always the worst outcome?

  Exchange theorist: The ranking must reflect the absolute constraint. If the agent truly holds it as absolute, she will rank any violation as worse than any non-violation. So in the thought experiment, if the constraint is absolute, then B is ranked above A.

  Integrity theorist: It is possible for an agent to hold an absolute constraint and yet recognize that the outcome of A is better in terms of consequences. But the constraint forbids A. So the agent might have a conflict: the outcome of A is better, but the act is forbidden. This conflict shows that the ranking does not capture the deontic aspect.

  Predictions:
  Exchange theorist: The Integrity theorist will say that the agent may have a conflicted ranking, but that is a sign of an incomplete ranking. A rational agent must have a complete ranking.

  Integrity theorist: The conflict is real and cannot be resolved by a simple ranking.

  Now, we write the joint statement.

  Note: The drafter's note at the end will take a position.

  Joint Statement:

  **Joint Statement on Moral Compromise**

  We, the Exchange theorist and the Integrity theorist, after a year of discussion, present the following joint statement. We use a running example: two campaigners, A and B, in a coalition must jointly endorse one of several policy packages (P1, P2, ..., Pn) or else the coalition endorses nothing and the vote is lost (outcome D). Outcome D is ranked below every package by both A and B. Among the packages, there is one package, Px, that each campaigner regards as violating a constraint (not merely a cost) by her own values.

  1. **Claims both accept:**
     1. The problem is set up as a choice among a set of outcomes (the packages and the default D) by two parties with different value systems.
     2. Each party has a complete and transitive ranking of the outcomes, reflecting her own values.
     3. A settlement is a joint choice of one outcome (a package or D).
     4. A settlement is a gain for a party by her own lights if she ranks it above the default D.
     5. A settlement is Pareto-improving over D if both parties rank it above D.
     6. A settlement is Pareto-optimal (with respect to the set of packages) if there is no other package that both parties prefer to it.
     7. The usual objection that compromise involves "betraying one's values" is a live objection only if it can be shown that a party's own ranking does not fully capture what her values require of her in the compromise situation.
     8. In the case of package Px, each campaigner regards it as violating a constraint. However, because D is ranked below Px by each, each would rank Px above D. But this ranking does not settle whether choosing Px would be permissible for either.

  2. **Surviving disagreements:**
     - *Exchange theorist's position:* When a compromise settlement is reached that is Pareto-improving over the default and Pareto-optimal, it constitutes a genuine gain for both parties by their own lights. The fact that each party concedes on some of their values does not entail betrayal; it is a rational adjustment to the circumstances, analogous to gains from trade in economics. The ranking fully captures the party's values in the choice context.
     - *Integrity theorist's position:* A compromise settlement, even when Pareto-improving and Pareto-optimal, may involve a moral failure because values make claims that are not fully discharged by being outweighed in a ranking. Conceding on a value leaves a moral residue for which the agent remains accountable. Therefore, a compromise is at best a lesser evil, not a gain, and describing it as a gain obscures the moral cost incurred.

  3. **Cruxes:**
     We identify the following cruxes, where settling one would move at least one party:
     - **Crux A:** Is the moral residue that the Integrity theorist posits primarily an intrapersonal phenomenon (arising when an agent weighs her own values and violates a constraint) or can it also arise in interpersonal exchanges that do not involve constraint violations? And does this distinction resolve the dispute?
     - **Crux B:** Does the Exchange theorist's reliance on rankings fail to capture a genuine feature of moral experience (the making of claims by values) that is essential to the Integrity theorist's position? And if so, is that feature a necessary element of moral reasoning or an artefact of the vocabulary of "claims"?
     - **Crux C:** Can all values be ranked against one another by an agent? In particular, can an agent hold an absolute constraint and still have a complete ranking of outcomes that include violations of that constraint? If not, then the Pareto frontier may not be defined for all points, and the Exchange theorist's picture fails precisely where constraints are most salient.

  4. **Agreed cases and predictions for each crux:**

     - **Crux A:**
       - *Agreed case:* Consider two scenarios:
          - Scenario 1 (Interpersonal trade without constraint violation): Two agents trade a banana for an apple. Each prefers what they receive to what they give. Neither agent violates any constraint of their own values.
          - Scenario 2 (Intrapersonal constraint violation): An agent must choose between violating a constraint (e.g., killing one innocent person) to save 100 lives, or not violating the constraint and letting the 100 die. She chooses to kill the one.
          - Scenario 3 (Coalition example with constraint violation): Campaigner A agrees to endorse Px (which violates a constraint of hers) to avoid D, which is worse by her ranking.
       - *Exchange theorist's prediction:* The Integrity theorist will agree that in Scenario 1 there is no moral residue. In Scenario 2, the residue arises from the intrapersonal violation. In Scenario 3, the residue is the same as in Scenario 2, but it is not caused by the interpersonal aspect. Therefore, the dispute about the coalition compromise (which is interpersonal) is not fundamentally about the trade but about the nature of the values (constraints) and how they are weighed. Once that is settled, the trade analogy holds for non-constraint cases.
       - *Integrity theorist's prediction:* In Scenario 1, if the trade involves only commodities and no violation of a constraint, there may be no residue. However, in Scenario 3, the interpersonal agreement does not change the fact that A is violating her own constraint. The residue is due to the intrapersonal violation. Therefore, the trade analogy is inapplicable when constraints are at stake. The dispute remains because the coalition case involves constraints.

     - **Crux B:**
       - *Agreed case:* Consider an agent who must choose between:
          - Option 1: Violate a constraint (e.g., kill one innocent) to save 100 lives.
          - Option 2: Do nothing, and 100 die.
          Suppose the agent ranks Option 1 above Option 2. The Exchange theorist says choosing Option 1 is a gain. The Integrity theorist says it is a lesser evil with residue.
       - *Exchange theorist's prediction:* The Integrity theorist will continue to insist that there is a residue even though the ranking places Option 1 above Option 2. This shows that the "something more" (the making of claims) is a feature of the Integrity theorist's moral psychology that is not captured by the ranking. But the Exchange theorist holds that the ranking should incorporate all relevant factors, and if it does, there is no residue. The vocabulary of "claims" is an artefact of not fully integrating the disvalue of constraint violation into the ranking.
       - *Integrity theorist's prediction:* The Exchange theorist's ranking cannot capture the deontic force of constraints. The residue is a real moral phenomenon, not reducible to the ranking. It is a genuine requirement of moral reasoning that some values make categorical demands.

     - **Crux C:**
       - *Agreed case:* Suppose campaigner A holds an absolute constraint against endorsing policies of type X. The only feasible package is Px (which violates the constraint) and the default D. A must choose between endorsing Px or accepting D. If the constraint is absolute, then A must not endorse Px, even if the consequences of D are worse.
       - *Exchange theorist's prediction:* The Integrity theorist will say that A cannot rank Px above D because the constraint is absolute. Therefore, the ranking must place Px below D. But if that is the case, then the Pareto frontier is still defined, and the Exchange theorist's picture holds. If the Integrity theorist says that A can rank Px above D but still believe it is impermissible, then the ranking does not reflect permissibility, which is a separate dimension. But the Exchange theorist holds that permissibility should be built into the ranking.
       - *Integrity theorist's prediction:* An agent can hold an absolute constraint and yet recognize that the outcome of endorsing Px is better than D in terms of consequences. This creates a conflict: the agent believes she must not choose Px even though she prefers its outcome. Therefore, the ranking is not sufficient to capture the moral reality, and the frontier picture fails.

  **Note on Verbal Dispute:**
  We agree that part of the dispute is not merely verbal. However, we note that the Exchange theorist uses "gain" to mean an outcome ranked higher by the agent's own ranking, while the Integrity theorist reserves "gain" for outcomes that do not leave a moral residue. This difference in terminology might lead to talking past each other on whether a compromise is a "gain". But the substantive dispute about moral residue remains.

  **Drafter's Note:**
  As the drafter, I take the position that the Exchange theorist's view is fundamentally correct for non-constraint cases, but that the Integrity theorist has identified a real phenomenon in the case of constraints. However, I believe that constraints can be incorporated into the ranking by making the disvalue of violation extremely high (but not infinite). This would allow the ranking to reflect the reluctance to violate constraints. In cases of absolute constraints, if the agent truly ranks the violation as worse than any alternative, then the ranking reflects that. But if the agent feels torn, it indicates an incomplete ranking. Therefore, the Pareto frontier picture holds for complete rankings. But the Integrity theorist's point about moral residue may be a feature of moral psychology that is not easily captured by rankings. In the end, I side with the Exchange theorist that the ranking, if properly constructed, should capture all relevant factors, and that the residue is a psychological experience that does not imply a flaw in the rational choice model. However, I recommend that the Exchange theorist acknowledge the psychological reality of residue in cases of constraint violation, even if it is not a reason to abandon the model.

  Thus, I conclude that the dispute is partially resolved by distinguishing between ordinary trade and constraint violation. In the coalition example, if the compromise does not violate a constraint, it is a genuine gain. If it does, it is a gain only in a qualified sense, but still the best option available.

  But note: the Integrity theorist might not accept that the ranking can capture the constraint. This remains a deep disagreement.

  However, for the purpose of this draft, I take the Exchange side with the modification that constraints require special handling in the ranking.

  End of draft.
answer: |-
  ### Joint Statement on Moral Compromise

  We, the Exchange theorist and the Integrity theorist, present this joint statement to clarify our agreements, disagreements, and unresolved cruxes regarding moral compromise. We use a running example: Two campaigners, A and B, form a coalition to influence an upcoming vote. They must jointly endorse one of several policy packages (P1, P2, P3, or P4) or endorse nothing. If they endorse nothing, the vote is lost, resulting in a default outcome (D). Both rank D below every package. Each campaigner has a value system that ranks the packages:

  - Campaigner A’s values: Ranks P1 > P2 > P3 > P4 > D. However, P4 requires endorsing a policy that violates a core constraint for A (e.g., a policy that permits lethal harm to innocents, which A treats as absolutely forbidden, not merely costly).
  - Campaigner B’s values: Ranks P3 > P4 > P1 > P2 > D. P4 also violates a core constraint for B (e.g., a policy that mandates deception, which B treats as absolutely forbidden).

  If A and B cannot agree, D occurs. Both seek a joint endorsement that respects their values while avoiding D.

  #### 1. Claims Both Accept
  We agree on the following points regarding the problem, settlements, gains, and objections:
     1. **Problem Setup**: The scenario involves two parties with distinct value systems choosing a joint action from discrete options (packages or default). Each party has a complete, transitive ranking of outcomes based on their values, including the default outcome D, which both rank below all packages.
     2. **Definition of Settlement**: A settlement is a jointly endorsed package. Failure to agree results in D. A settlement is feasible only if both parties accept it.
     3. **Gain by a Party’s Own Lights**: A party gains by their own lights if they rank the settlement above D. A settlement is mutually beneficial if both rank it above D.
     4. **Pareto-Optimality**: A settlement is Pareto-optimal if no other package is ranked higher by both parties. The set of Pareto-optimal packages forms a "frontier" from which no mutually preferred move exists.
     5. **Constraint Violations**: A package that violates a party’s core constraint (e.g., P4 for both) is distinct from one that merely imposes costs. Both parties treat constraints as non-negotiable prohibitions, not tradable costs, though their rankings may still place constraint-violating packages above D.
     6. **Live Objections**: The objection that compromise "betrays one's values" is live only if it challenges whether a party’s ranking fully captures their moral obligations. The objection that compromise "leaves a moral residue" is live if values generate duties beyond what is reflected in rankings.

  #### 2. Surviving Disagreements
  We disagree on the nature of compromise, stated here in wording each side accepts as fair:
  - **Exchange Theorist’s View**: When parties settle on a Pareto-optimal package that is mutually beneficial (e.g., P2 or P3 in the example), it is a genuine gain for both by their own rankings. Conceding on lower-ranked values to secure a higher-ranked outcome is not betrayal; it is rational trade, analogous to exchanging goods at a mutually beneficial rate. The ranking incorporates all relevant moral considerations, so no further "residue" exists.
  - **Integrity Theorist’s View**: A settlement (e.g., P2 or P3) may be mutually beneficial by the rankings but is never a true gain. Values generate claims that are not discharged by being outweighed in a ranking; conceding on a value leaves a moral residue for which the agent remains accountable. The trade analogy obscures this, treating values as commodities when they are inalienable duties. At best, compromise is a lesser evil.

  #### 3. Cruxes
  The following sub-questions, if settled, would move at least one party:
  - **Crux A**: Does the dispute conflate interpersonal trade (between parties) with intrapersonal value-weighing (within one agent)? Specifically, is the "corruption" objection (that compromise betrays integrity) an intrapersonal concern misapplied to interpersonal bargaining?
  - **Crux B**: Does the trade analogy require only ordinal rankings, while the integrity objection relies on values having a "something more" (e.g., claim-making force) beyond rankings? If so, is this "something more" a genuine feature of morality or an artefact of the analogy’s vocabulary?
  - **Crux C**: Can all values be ranked against others? If some values (e.g., constraints) are incomparable or absolute, does the Pareto frontier collapse where it is most needed (e.g., near P4 in the example)?

  #### 4. Cases, Arguments, and Predictions for Each Crux
  For each crux, we present an agreed case or thought experiment, along with predictions.

  - **Crux A**: **Conflation of Interpersonal and Intrapersonal Cases**  
    **Agreed Case**: Consider two variations of the example:  
    - *Interpersonal Trade*: A and B agree on P2, which neither sees as violating a constraint. A ranks P2 > D, B ranks P2 > D, and both prefer P2 over their next-best alternatives.  
    - *Intrapersonal Weighing*: Campaigner A alone must choose between P4 (violating her constraint) and D. She ranks P4 > D but feels guilty for choosing P4.  
    **Exchange Theorist’s Prediction**: The Integrity theorist will concede that no moral residue arises in the interpersonal trade but will insist it arises in the intrapersonal case. This shows the dispute stems from misapplying intra-personal concerns (e.g., integrity under individual choice) to interpersonal compromise. Separating the cases resolves the dispute.  
    **Integrity Theorist’s Prediction**: Residue arises in both cases. In interpersonal compromise, A’s agreement to P2 still involves conceding on a value, leaving her accountable. The cases are inseparable because joint action requires intra-personal commitment.  

  - **Crux B**: **Rankings vs. "Something More"**  
    **Agreed Argument**: Suppose campaigner A must choose unilaterally between P4 (constraint violation) and D. She ranks P4 > D, yet feels P4 is morally forbidden. The Exchange theorist argues this conflict reflects an incomplete ranking; a proper ranking would downgrade P4 below D if the constraint is binding. The Integrity theorist argues values "make claims" that resist ranking.  
    **Exchange Theorist’s Prediction**: The Integrity theorist will maintain that claims are a genuine, non-artefactual feature of morality (e.g., categorical duties exist). This "something more" is an artefact: if rankings fully incorporate disvalue (e.g., infinite disutility for constraint violations), claims add nothing.  
    **Integrity Theorist’s Prediction**: The Exchange theorist will reduce claims to rankings, missing that claims are deontic (duty-based) and generate residue even when outweighed. This "something more" is genuine, as evidenced by moral experience (e.g., regret after choosing P4).  

  - **Crux C**: **Non-Rankable Values and Frontier Failure**  
    **Agreed Thought Experiment**: Only P4 and D are feasible. For A, P4 violates an absolute constraint. If A holds the constraint as non-tradable, she cannot rank P4 against D. The Pareto frontier is undefined because A has no complete preference between P4 and non-constraint packages.  
    **Exchange Theorist’s Prediction**: The Integrity theorist will argue that constraints make rankings incomplete (e.g., A cannot compare P4 to P1–P3), so the frontier fails. But this is rare; most values are rankable, and frontiers work elsewhere.  
    **Integrity Theorist’s Prediction**: The Exchange theorist will assert that all values must be rankable (e.g., if A chooses P4 over D, she implicitly ranks P4 > D). But constraints are incomparable; A’s choice of P4 is a tragic failure, not a reflection of her ranking. The frontier fails precisely when constraints are at stake.  

  #### Note on Verbal Disputes
  Part of our dispute is verbal. The Exchange theorist defines "gain" as improvement by one’s ranking, while the Integrity theorist reserves "gain" for outcomes without residue. This causes talking past each other on whether compromise is a "gain." However, the substantive disagreement—whether moral residue exists—is not verbal, as it involves a real conflict about the nature of values (e.g., if they generate duties beyond rankings).

