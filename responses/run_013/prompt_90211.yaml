prompt: |-
  I am a novelist three weeks out from a copyedit, and the book I am finishing has a protagonist who has undergone a corpus callosotomy — the surgical severing of the fibres between the hemispheres — yet it is narrated throughout in the first person singular. The conceit I have committed to is a margin: on many pages her left hand writes, uninvited, in the white space beside the text, and the reader is left to wonder who is speaking there and whether that writer knows what the narrator knows. My working rule has been crude: where the two hands disagree, the book speaks as two; where they agree, as one. My editor says the result reads as an alternation I invented rather than one I discovered, and my continuity reader has found scenes in which the narrator claims knowledge that my own account of the character forbids her.

  What I want is not a verdict on how many minds such a patient has, but a decision procedure I can run scene by scene — short enough to keep to one page, plain enough to hand to a first reader who knows no philosophy, so that the same scene gets the same treatment on every pass. I understand the dispute turns on what unity of consciousness is supposed to require: co-consciousness, joint access to a single store of information, one agent of action, integrated memory, the capacity to report. I am content to have you take a line on that, provided you tell me which line you have taken, why, and which of those requirements you kept and which you discarded to make the thing usable. I make this decision perhaps forty times a chapter, alone, at speed; my editor signs off on the whole, and there is no neuroscientist I can consult.

  Each scene should yield three answers: how many subjects are present, which grammatical person and number the narration may therefore use, and whether the margin-hand may be privy to what the narrator knows. Give me the questions in the order I am to ask them, what counts as a sufficient answer to each, where the procedure stops with a verdict, and where it hands the question back to me because the question is metaphysical or moral rather than empirical. It must survive at least these cases: the two hands reaching for different objects; a fluent verbal explanation of an act the speaking hemisphere did not initiate; a scene in which the halves agree, and another in which they agree by accident; both hands writing at once, one typing and one in longhand; a scene under anaesthetic or in sleep; a scene in which each half holds a memory the other lacks; a scene in which the two halves differ about a person they both love; and a scene in which the character's own testimony about herself is itself the product of one hemisphere's manufacture.

  Then run it on two scenes I will sketch for you: one in which her signature on a contract is challenged, and one in which she is asked to forgive someone. I expect one of those applications to come out against me, and I want to be told plainly if the first person singular cannot survive the procedure, and where it breaks. Finish by naming what the procedure cannot decide, the cases in which it will misfire, and the sentence I should copy into my own working notes to remind myself that any question the procedure refers back to me is mine to answer and not a finding.
reasoning: |-
  Okay, let's tackle this. The user is a novelist dealing with a protagonist who's had a corpus callosotomy, narrated in first person singular. The challenge is creating a consistent decision procedure for when the narration should be singular or plural, and when the margin notes can share knowledge with the narrator. 

  First, I need to understand the core issues. The editor says the alternation feels invented, not discovered. The continuity reader found inconsistencies where the narrator knows things they shouldn't. The user needs a practical, scene-by-scene tool that's quick and doesn't require philosophy knowledge.

  The key requirements from the user:
  1. A step-by-step procedure yielding three answers: number of subjects, grammatical person, and whether margin-hand knows narrator's knowledge.
  2. Must handle specific cases: conflicting hand actions, verbal explanations of uninitiated acts, agreement (intentional or accidental), simultaneous writing, sleep/anesthesia, separate memories, differing emotions, and manufactured testimony.
  3. Apply to two test scenes (contract signature and forgiveness).
  4. Warn if first-person singular breaks.
  5. Outline limitations and a reminder sentence for metaphysical questions.

  Now, considering the neuroscience. Corpus callosotomy patients show split-brain phenomena where hemispheres operate independently. Key indicators of separate consciousness: conflicting actions, unilateral knowledge, inter-manual conflict. Unity is suggested by coordinated actions and shared responses.

  The procedure should prioritize observable behavior over internal states. I'll use a flowchart approach with clear yes/no questions. Start with action conflicts since they're objective. Then check knowledge sharing through actions, then memory integration. Avoid metaphysical debates by focusing on empirical evidence.

  For the test scenes:
  - Contract signing: If she signs but the left hand writes "refuse" in margin, that's conflict → two subjects. Narrator can't know margin's intent unless shown elsewhere.
  - Forgiveness: If she says "I forgive" but left hand writes "never", conflict → two subjects. If both respond identically, unity.

  Limitations: Cases without observable conflict, sleep states (default unity), manufactured testimony (can't verify origin). The reminder sentence should emphasize that unresolved questions are authorial choices, not procedure failures.

  Need to ensure the procedure is:
  - Fast: max 5 questions per scene
  - Plain language: no jargon
  - One-page length
  - Deterministic where possible
  - Flags ambiguous cases for author decision
answer: |-
  Here is a decision procedure designed for speed, consistency, and minimal philosophy. It prioritizes **observable behavioral conflict** and **information access** as proxies for "subjects," discarding metaphysical debates about consciousness. The core principle: **Unity requires the absence of observable conflict AND functional information integration.** If hemispheres *demonstrably* act at cross-purposes or lack access to the same critical information *in that scene*, they are two subjects. Agreement or silence implies unity.

  ### Your Decision Procedure (One-Page Cheat Sheet)
  **Core Principles Adopted:**
  -   **Kept:** Co-consciousness (as *observable behavioral harmony*), Joint information access (via *demonstrable sharing*), Integrated memory (via *recall/action consistency*).
  -   **Discarded:** "One agent of action" (too absolute; minor conflicts may still imply unity), "Capacity to report" (unreliable; confabulation is common).  
  *Why?* This avoids metaphysics and focuses on what you/readers can *see*: action discord, knowledge gaps, or harmony. The "margin hand" is treated as the left hemisphere's output.

  **Ask in Order — Stop at First Verdict:**  
  1.  **Is there *observable conflict* in action, goal, or emotion?**  
      *   *Check:* Hands doing opposing tasks (e.g., reaching for different objects), face showing conflicting emotions, margin text directly contradicting narration/action (e.g., hand writes "no" while narrator says "yes").  
      *   *Sufficient Answer:* YES (Conflict) → **Verdict: TWO SUBJECTS.** Proceed to Q3.  
      *   *Sufficient Answer:* NO (Harmony/No Action) → Proceed to Q2.  
      *   *Hand Back:* If conflict is ambiguous or internal (not observable). *Your call based on narrative intent.*

  2.  **Is there *demonstrable failure of information integration*?**  
      *   *Check:* Does one hemisphere *act* on information the other clearly lacks? (e.g., narrator is surprised by what left hand writes; left hand reacts to a stimulus only the left visual field saw, but narrator claims not to see it; narrator fluently explains an action initiated by the left hand but gives a factually wrong/confabulated reason).  
      *   *Sufficient Answer:* YES (Failure) → **Verdict: TWO SUBJECTS.** Proceed to Q3.  
      *   *Sufficient Answer:* NO (Integration/Silence) → **Verdict: ONE SUBJECT.** Grammatical Person: **First Person Singular ("I")**. Margin-hand Knowledge: **YES (Knows what narrator knows)**. STOP.

  3.  **Is the margin-hand *actively writing/drawing*?**  
      *   *Check:* Is the left hand producing words/symbols in the margin *in this scene*?  
      *   *Sufficient Answer:* YES → Grammatical Person: **First Person *Plural* ("We") OR maintain "I" but treat margin as intrusive voice (see "Critical Note" below)**. Margin-hand Knowledge: **NO (Does *not* automatically know narrator's thoughts/knowledge unless Q2 was NO)**.  
      *   *Sufficient Answer:* NO → Grammatical Person: **First Person Singular ("I")**. Margin-hand Knowledge: **N/A (Not active)**. STOP.

  **Critical Note on Grammar:** Using "I" while acknowledging the margin voice is *stylistically valid* but *philosophically inconsistent* under this procedure when TWO SUBJECTS are present. It implies a singular narrator despite evidence of division. If maintaining "I" is essential, treat the margin as an *externalized intrusive thought/voice the narrator experiences*, not a separate subject with its own knowledge. This is a *narrative choice*, not a finding of unity.

  ---

  ### Procedure Applied to Your Cases
  **Case: Two hands reaching for different objects.**
  1.  **Q1:** YES (Clear observable conflict: hands reaching for different objects). → **TWO SUBJECTS**.
  2.  Skip Q2.
  3.  **Q3:** *Is margin-hand writing?* (Assume yes, as it's active). → Grammar: **"We" OR "I"+intrusive voice**. Margin Knowledge: **NO**.

  **Case: Fluent verbal explanation of an uninitiated act.**
  1.  **Q1:** *Is there conflict?* The explanation *itself* might not be conflicting action. → Likely NO, proceed to Q2.
  2.  **Q2:** *Failure of info integration?* YES (Narrator explains an act they didn't initiate; explanation is likely confabulated). → **TWO SUBJECTS**.
  3.  **Q3:** *Margin writing?* (Likely involved in initiating act or reacting). If YES → Grammar: **"We" OR "I"+intrusive voice**. Margin Knowledge: **NO**.

  **Case: Halves agree (intentionally or accidentally).**
  1.  **Q1:** NO (No conflict). → Proceed to Q2.
  2.  **Q2:** *Failure of info integration?* NO (They concur; information *appears* integrated in the agreement). → **ONE SUBJECT**. Grammar: **"I"**. Margin Knowledge: **YES**.

  **Case: Both hands writing simultaneously.**
  1.  **Q1:** *Conflict?* Are they writing *contradictory* things? If YES → **TWO SUBJECTS** → Q3: YES → Grammar: **"We" OR "I"+intrusive voice**. Margin Knows: **NO**.  
      If writing *harmonious* things → Q1: NO → Q2: NO (assuming content shows integration) → **ONE SUBJECT** → Grammar: **"I"**. Margin Knows: **YES**.

  **Case: Under anaesthetic/sleep.**
  1.  **Q1:** NO (No observable action). → Proceed to Q2.
  2.  **Q2:** *Failure of info integration?* Unobservable. → **HAND BACK TO YOU.** *Default recommendation:* **ONE SUBJECT** (reduced/unified state). Grammar: **"I"**. Margin Knowledge: **N/A or YES** (no active margin).

  **Case: Each half holds unique memory.**
  1.  **Q1:** *Conflict?* Only if memories trigger conflicting *actions/statements* in the scene. If NO → Proceed to Q2.
  2.  **Q2:** *Failure of info integration?* YES (One hemisphere cannot recall/act on the memory held by the other; e.g., narrator recounts memory A, margin writes memory B, neither acknowledges the other's memory). → **TWO SUBJECTS** → Q3: If margin writing → Grammar: **"We" OR "I"+intrusive voice**. Margin Knows: **NO**.

  **Case: Differ about a person they both love.**
  1.  **Q1:** *Conflict?* YES (e.g., narrator says "I trust him", margin writes "He lies", or face shows smile while hand makes a fist). → **TWO SUBJECTS** → Q3: YES → Grammar: **"We" OR "I"+intrusive voice**. Margin Knows: **NO**.

  **Case: Character's testimony is confabulation.**
  1.  **Q1:** *Conflict?* Only if confabulation clashes with margin/action (e.g., narrator says "I chose this job", margin writes "They forced us"). If YES → **TWO SUBJECTS** → Q3: YES → Grammar: **"We" OR "I"+intrusive voice**. Margin Knows: **NO**.  
      If no *observable* conflict → **Q2:** *Failure of info integration?* YES (Testimony is demonstrably false/confabulated based on info available to the other hemisphere). → **TWO SUBJECTS** → Q3: If margin writing → Grammar: **"We" OR "I"+intrusive voice**. Margin Knows: **NO**.

  ---

  ### Application to Your Scenes
  **Scene 1: Signature Challenged**
  *   *Setup:* She (right hand) signs contract. Left hand writes "FORGERY" or "DON'T" in margin. Lawyer challenges signature authenticity.
  *   **Procedure:**
      1.  **Q1:** YES (Hands performing conflicting actions: signing vs protesting signature). → **TWO SUBJECTS**.
      2.  Skip Q2.
      3.  **Q3:** YES (Margin active). → Grammar: **"We" OR "I"+intrusive voice**. Margin Knowledge: **NO**.
  *   *Can "I" survive?* **Yes, BUT only stylistically** as an intrusive voice. Narrator (RH) *cannot* truthfully claim unity or inherently know *why* the LH wrote "FORGERY" if that knowledge is LH-specific. LH does *not* automatically know RH's thoughts about the lawyer's challenge.

  **Scene 2: Asked to Forgive**
  *   *Setup:* Someone begs forgiveness. Narrator says "I forgive you." Left hand is still. Face is neutral.
  *   **Procedure:**
      1.  **Q1:** NO (No observable conflict; LH inactive, face neutral). → Proceed to Q2.
      2.  **Q2:** *Failure of info integration?* NO (Only one response "I forgive you"; no evidence LH has conflicting info/emotion *or* that RH lacks access to relevant memories). → **ONE SUBJECT**. Grammar: **"I"**. Margin Knowledge: **YES (but N/A as inactive)**.
  *   *Alternative:* If LH writes "Liar" or a tear runs down one cheek while the narrator speaks calmly → Q1: YES → **TWO SUBJECTS** → Q3: YES → Grammar: **"We" OR "I"+intrusive voice**. Margin Knows: **NO**. "I" survives only as intrusive voice.

  ---

  ### Limitations & Final Notes
  1.  **What It Cannot Decide:**
      *   **True Unity vs Absence of Evidence:** A lack of observed conflict doesn't *prove* unity, just functional harmony *in that moment*.
      *   **Internal States Without Manifestation:** Profound internal discord not expressed in action/margin/text.
      *   **"Manufactured" Origin Without Clue:** Confabulation indistinguishable from accurate recall within the scene.
      *   **Moral Responsibility:** Who is the "I" that forgives or signs? Procedure says *how many*, not *who* is responsible.
  2.  **Where It Misfires:**
      *   **Accidental Harmony Misread as Unity:** If hemispheres independently arrive at the *same* action/knowledge *without* integration (rare, but possible). Procedure defaults to ONE SUBJECT (Q1 NO → Q2 NO).
      *   **Subtle/Suppressed Conflict:** Conflict exists but is not observable (e.g., intense internal struggle with no outward sign). Procedure defaults to ONE SUBJECT.
      *   **Dreams/Non-Lucid States:** Highly unreliable; procedure defaults to ONE SUBJECT unless clear conflict manifests.
  3.  **Your Reminder Sentence:**  
      **"Any question this procedure refers back to me concerns an unresolvable ambiguity inherent in the condition; my answer here is a narrative choice about the *character's experience*, not a scientific finding."**

  **Conclusion:** The first-person singular *can* technically survive throughout by treating the margin as the narrator's experience of an intrusive voice/alien limb, even when the procedure finds TWO SUBJECTS. However, this strains the literal reading when behavioral conflict is stark (e.g., the contract scene). The procedure forces consistency on *knowledge access* and *behavioral evidence* for division, ensuring your "working rule" (agree=one, disagree=two) is applied objectively. It breaks down only where the phenomena themselves are ambiguous (anesthesia, deep suppression), leaving those to your authorial intent. Use it to flag inconsistencies, then deploy your voice. Good luck with the copyedit!
