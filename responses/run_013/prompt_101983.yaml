  Biggest challenge: avoiding false dichotomies. Some positions might bleed together (e.g., contextualization vs. counter-monuments). Should flag where the tree's resolution falters. Also must kill off incoherent leaves—like claiming monuments are inert rocks BUT their removal breaks sacred promises. That's logically unsalvageable.

  Ah! The "nobody deserves monuments" stance needs early isolation—it shortcuts everything else. And the dead's rights question? Surprisingly pivotal; it splits consequentialists from deontologists cleanly.

