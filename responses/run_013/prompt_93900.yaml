answer: |-
  Based on the pattern from Dana's prior judgments, the key factor appears to be the **valence of the side effect** (i.e., whether it is good, bad, or neutral) combined with the agent's foresight and indifference. Dana consistently treats bad side effects as "on purpose" when the agent is indifferent, but not good or neutral ones. I'll outline candidate rules that fit the prior cases, apply them to scenarios (a) and (b), bet on the most likely rule, and suggest a test case to settle it.

  ### Candidate Rules Fitting Prior Cases
  1. **Valence-Based Rule**:  
     - **Rule**: An agent does an effect E "on purpose" if and only if:  
       (i) The agent foresees E as a result of their action.  
       (ii) The agent is genuinely indifferent to E (neither desires nor avoids it for its own sake).  
       (iii) E is **bad** (harmful or negative from the perspective of affected parties or societal norms).  
     - **Fits prior cases**:  
       - Case 1 (pollution): Bad effect → "on purpose" (fits).  
       - Case 2 (cleaning): Good effect → "not on purpose" (fits).  
       - Case 3 (shade change): Neutral effect → "not on purpose" (fits).  
     - **Predictions**:  
       - (a) Doctor and hearing loss: Hearing loss is bad (harms patients), foreseen, and doctor is indifferent → **"on purpose"**.  
       - (b) Factory owner and extra break: Extra break is good for workers (described as "nice for them"), foreseen, and owner is indifferent → **"not on purpose"**.  
       - *Rationale for (b) valence*: The effect in question is the "extra break," which benefits workers (good), not the rule-breaking. Rule-breaking is a separate consequence but not the focus of the question.  

  2. **Intention-as-Goal Rule**:  
     - **Rule**: An agent does E "on purpose" only if E is part of the agent's goal or primary reason for acting (i.e., the agent would not have acted if E were absent).  
     - **Fits prior cases**:  
       - Case 1: Pollution is not the goal (cost-cutting is) → should be "not on purpose," but Dana said "on purpose" → **does not fit**.  
       - Case 2: Cleaning is not the goal → "not on purpose" (fits, but only because it matches the outcome; rule fails Case 1).  
       - Case 3: Shade change not the goal → "not on purpose" (fits, but rule is invalidated by Case 1).  
     - **Predictions**:  
       - (a) Hearing loss is not the doctor's goal (curing infection is) → **"not on purpose"**.  
       - (b) Extra break is not the owner's goal (cost-cutting is) → **"not on purpose"**.  
     - *Weakness*: This rule fails Case 1, so it's unlikely.  

  3. **Doctrine of Double Effect (DDE)-Inspired Rule**:  
     - **Rule**: An agent does E "on purpose" if E is intended as a means or end, or if the action is not permissible without E. Merely foreseen side effects are not "on purpose."  
     - **Fits prior cases**:  
       - Case 1: Pollution is foreseen but not intended → should be "not on purpose," but Dana said "on purpose" → **does not fit**.  
       - Case 2: Cleaning is foreseen but not intended → "not on purpose" (fits).  
       - Case 3: Shade change foreseen but not intended → "not on purpose" (fits).  
     - **Predictions**:  
       - (a) Hearing loss is foreseen but not intended → **"not on purpose"**.  
       - (b) Extra break is foreseen but not intended → **"not on purpose"**.  
     - *Weakness*: Contradicts Case 1, so it's unlikely. Dana's judgments don't align with DDE's emphasis on intention vs. foresight.

  ### Betting on the Valence-Based Rule
  - **Why the Valence-Based Rule is most likely**: It perfectly fits all prior cases without exception. Dana seems to be using a moral/social lens where bad effects are treated as "on purpose" under indifference because the agent could have avoided them but chose not to (implying tacit acceptance). Good and neutral effects aren't "on purpose" because indifference doesn't imply endorsement or volition. The rule is simple, consistent, and doesn't require assessing the agent's primary goal or the permissibility of the action (e.g., standard practice in (a) doesn't matter).  
  - **Predictions for (a) and (b)**:  
    - (a) **"On purpose"**: Hearing loss is bad, foreseen, and the doctor is indifferent. The fact that it's standard practice doesn't change the badness or the indifference.  
    - (b) **"Not on purpose"**: The extra break is good for workers, foreseen, and the owner is indifferent. The rule-breaking aspect doesn't make the effect itself bad—it's a separate issue (the question is about the break, not the violation).  

  ### Test Case to Settle the Rule
  To confirm or refute the Valence-Based Rule, I propose a new scenario that isolates ambiguity in "badness":  

  - **Scenario**: A homeowner wants to kill a dangerous snake in his yard. He sets a fire that he knows will also burn down his neighbor's house. He doesn't care about the neighbor's house. Did he burn down the neighbor's house on purpose?  
    - **Valence-Based Rule Prediction**: Burning down the house is bad (harms the neighbor), foreseen, and homeowner is indifferent → **"on purpose"**.  
    - **Why this test case?**  
      - It mirrors the CEO pollution case (bad side effect, indifference) but removes complicating factors like business justifications or standard protocols.  
      - If Dana says **"on purpose"**, it strongly supports the Valence-Based Rule. It shows that badness alone drives the judgment, regardless of the action's context (e.g., killing a snake is reasonable, but the harm is still "on purpose").  
      - If Dana says **"not on purpose"**, it undermines the Valence-Based Rule. We'd need a new rule, perhaps one where "badness" must involve a violation of norms or duties (e.g., the snake case isn't "on purpose" because the action is justified, unlike the CEO).  
  - **How it settles the rule**:  
    - "On purpose" → Confirms valence is key.  
    - "Not on purpose" → Suggests Dana incorporates permissibility or justification (e.g., only "bad + unjustified" effects are "on purpose"). This would require re-evaluating (a), where the doctor's action is justified by standard protocol.

  ### Summary
  - **Bet**: Valence-Based Rule (bad effects are "on purpose" under foresight and indifference; good/neutral are not).  
  - **Predictions**:  
    - (a) Doctor causes hearing loss **on purpose**.  
    - (b) Factory owner does not give extra break **on purpose**.  
  - **Next test case**: Snake and fire scenario. If Dana says "on purpose," the rule holds; if not, it points to a need for justification/norm-violation in the rule.  
  - **Why this approach?** The prior cases show Dana is sensitive to harm, not intent or context. The test case removes noise to isolate "badness." If (a) or (b) surprise us (e.g., Dana says "not on purpose" for (a) due to standard practice), it would reveal an exception, but the Valence-Based Rule is the best fit for now.
