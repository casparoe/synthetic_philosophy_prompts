  The Rietdijk–Putnam argument uses the relativity of simultaneity in special relativity to argue for eternalism—the view that past, present, and future events are equally real. A key step involves the transitivity of reality: if event A is real, and A is simultaneous with B in one frame, then B is real; if B is simultaneous with C in another frame, then C is real. However, this transitivity across frames is problematic, as the following example demonstrates.

  ### Example Construction
  Consider two inertial frames:
  - Frame S (coordinates: \(t, x\)), at rest.
  - Frame S' (coordinates: \(t', x'\)), moving with velocity \(v = \frac{c}{2}\) relative to S along the x-axis, where \(c\) is the speed of light.

  The Lorentz factor \(\gamma\) is:
  \[
  \gamma = \frac{1}{\sqrt{1 - v^2/c^2}} = \frac{1}{\sqrt{1 - (1/2)^2}} = \frac{1}{\sqrt{3/4}} = \frac{2}{\sqrt{3}}.
  \]

  Define three events with coordinates in S and S':

  1. **Event A**: Chosen at the origin in S for simplicity.
     - In S: \((t_A, x_A) = (0, 0)\).
     - In S': 
       \[
       t'_A = \gamma \left( t_A - \frac{v}{c^2} x_A \right) = \gamma (0 - 0) = 0,
       \]
       \[
       x'_A = \gamma (x_A - v t_A) = \gamma (0 - 0) = 0.
       \]
     - So, \((t'_A, x'_A) = (0, 0)\).

  2. **Event B**: Simultaneous with A in S, at a spatial distance \(d = 1\) light-second (for concreteness).
     - In S: \((t_B, x_B) = (0, 1)\) (since simultaneous with A: \(\Delta t = 0\)).
     - In S':
       \[
       t'_B = \gamma \left( t_B - \frac{v}{c^2} x_B \right) = \frac{2}{\sqrt{3}} \left( 0 - \frac{(c/2)}{c^2} \cdot 1 \right) = \frac{2}{\sqrt{3}} \left( -\frac{1}{2c} \right) = -\frac{1}{c\sqrt{3}},
       \]
       \[
       x'_B = \gamma (x_B - v t_B) = \frac{2}{\sqrt{3}} (1 - (c/2) \cdot 0) = \frac{2}{\sqrt{3}}.
       \]
     - So, \((t'_B, x'_B) = \left( -\frac{1}{c\sqrt{3}}, \frac{2}{\sqrt{3}} \right)\).

  3. **Event C**: Simultaneous with B in S', and chosen to have \(x'_C = 0\) for simplicity.
     - In S': \((t'_C, x'_C) = (t'_B, 0) = \left( -\frac{1}{c\sqrt{3}}, 0 \right)\) (simultaneous with B: \(\Delta t' = 0\)).
     - Transform back to S:
       \[
       t_C = \gamma \left( t'_C + \frac{v}{c^2} x'_C \right) = \frac{2}{\sqrt{3}} \left( -\frac{1}{c\sqrt{3}} + \frac{(c/2)}{c^2} \cdot 0 \right) = \frac{2}{\sqrt{3}} \left( -\frac{1}{c\sqrt{3}} \right) = -\frac{2}{3c},
       \]
       \[
       x_C = \gamma (x'_C + v t'_C) = \frac{2}{\sqrt{3}} \left( 0 + (c/2) \left( -\frac{1}{c\sqrt{3}} \right) \right) = \frac{2}{\sqrt{3}} \left( -\frac{1}{2\sqrt{3}} \right) = -\frac{1}{3}.
       \]
     - So, in S: \((t_C, x_C) = \left( -\frac{2}{3c}, -\frac{1}{3} \right)\).

  **Summary of Coordinates**:
  - **Frame S**:
    - A: \((t, x) = (0, 0)\)
    - B: \((t, x) = (0, 1)\)
    - C: \((t, x) = \left( -\frac{2}{3c}, -\frac{1}{3} \right)\)
  - **Frame S'**:
    - A: \((t', x') = (0, 0)\)
    - B: \((t', x') = \left( -\frac{1}{c\sqrt{3}}, \frac{2}{\sqrt{3}} \right)\)
    - C: \((t', x') = \left( -\frac{1}{c\sqrt{3}}, 0 \right)\)

  ### Key Properties
  1. **A and B are simultaneous in S**: \(\Delta t = 0\) in S.
  2. **B and C are simultaneous in S'**: \(\Delta t' = 0\) in S'.
  3. **A and C are timelike related**:
     - The spacetime interval \(\Delta s_{AC}^2 = c^2 (\Delta t)^2 - (\Delta x)^2\) in S:
       \[
       \Delta t_{AC} = t_C - t_A = -\frac{2}{3c}, \quad \Delta x_{AC} = x_C - x_A = -\frac{1}{3},
       \]
       \[
       \Delta s_{AC}^2 = c^2 \left( -\frac{2}{3c} \right)^2 - \left( -\frac{1}{3} \right)^2 = \frac{4}{9} - \frac{1}{9} = \frac{3}{9} = \frac{1}{3} > 0.
       \]
       Since \(\Delta s_{AC}^2 > 0\), A and C are timelike separated, meaning no inertial frame can make them simultaneous (as simultaneity requires spacelike or lightlike separation).

  ### Conceptual Issue
  The Rietdijk–Putnam argument infers the reality of C from:
  - Reality of A (given).
  - Reality of B (since A and B are simultaneous in S, so B is real if A is).
  - Reality of C (since B and C are simultaneous in S', so C is real if B is).

  However, in frame S, event C is in the past relative to A (\(t_C < t_A\)). If "reality" is tied to the present (as in presentism), C should not be real for an observer at A in S. Yet, the argument forces C to be real via transitivity across frames. This exposes a flaw in the transitivity step: **reality attributed via simultaneity in one frame may not align with temporal relations in another frame, leading to counterintuitive conclusions about past and future events**.

  Specifically, the example shows:
  - Starting from A (present in S), we get B (simultaneous in S, hence real).
  - From B, we get C (simultaneous in S', hence real), even though C is past in S.
  - Thus, the argument forces past events to be real, challenging presentism.

  ### Iteration to Arbitrarily Late Events
  The construction **can be iterated** to make arbitrarily late events real:
  - Suppose we add a fourth event D.
  - In a new frame S'' moving relative to S' with velocity \(w\), choose D simultaneous with C in S''.
  - By choosing \(w\) and the spatial coordinate of D appropriately, the time of D in S can be made arbitrarily large.
    - For example, set \(x''_D\) large in S''. By the Lorentz transformation, \(t_D\) in S includes a term proportional to \(x''_D\), which can be made arbitrarily positive.
  - Thus, from the reality of C (established from A and B), and simultaneity of C and D in S'', D is real and arbitrarily future in S.

  This iteration shows that if the transitivity is accepted, **all events (past and future) become real**, supporting eternalism. However, it relies on the controversial transitivity of reality across frames.

  ### Confidence Assessment
  - **High confidence** in the event construction and coordinates, as they are derived directly from Lorentz transformations with \(v = c/2\) and \(d = 1\).
  - **High confidence** that A and C are timelike related and not simultaneous in any frame, as the interval calculation is straightforward.
  - **Moderate confidence** in the iteration to future events, as it depends on choosing spatial coordinates to "push" events forward in time, which is mathematically sound but assumes no physical constraints.
  - **Lowest confidence** in the **transitivity step of reality** (i.e., from A-B simultaneity and B-C simultaneity to C's reality). This is the core conceptual issue: whether reality, defined via simultaneity in one frame, can be transferred through an event (B) using a different frame. Philosophers like Howard Stein reject this transitivity, arguing that reality is frame-dependent. This step is the most contentious part of the Rietdijk–Putnam argument and the point I am least sure of.
