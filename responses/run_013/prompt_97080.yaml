  - Present to the class: In Round 1, Machine A accepted a counterfeit Home disc (25mm,5g without value). Did it believe that disc was a genuine coin? Or did it not?
  - The machine was following its rule: it accepts any (25mm,5g). So it doesn't know about the value. So it ascribes "coin" to any disc with (25mm,5g). But only some of them are genuine. So when it accepts a counterfeit, it has a false belief? Or is it not really believing anything?

  65-70 mins: Twin-Native Machine in Twin World
  - Now we introduce Machine C (trained for Twin: accepts (30mm,6g)). We put it in Twin world and run a round quickly:
    - Genuine Twin: accept -> +1
    - Counterfeit Twin: (30mm,6g) without value: accept -> -1
    - ... etc.
  - We say: "This machine believes that (30mm,6g) discs are coins."

  70-75 mins: Private Writing
  - Each student writes privately:
    (a) What does the Twin machine (Machine C) believe about a disc that is (30mm,6g) with value? (It believes it is a coin.)
    (b) Is that a genuine belief (like ours) or only an ascription we're projecting?
  - Collect and read the distribution.

  75-90 mins: Debrief
  - Map to the two-bitser: 
    - The two-bitser in the soda machine accepts a quarter. In a foreign country, it might accept a slug. Dennett: we ascribe beliefs based on the design (or the environment). Searle: the machine doesn't have real beliefs.
  - Original vs derived: Searle says the machine's "belief" is derived from the designers, not intrinsic. Dennett says all belief ascription is instrumental.
  - The fork: They both agree on the facts (the machine behaves as if it has beliefs, and the content depends on the environment) but disagree on the interpretation.
  - What went wrong? 
    - If someone breaks character: If a machine student starts reasoning about the coins, remind them they are only allowed to see diameter and mass. 
    - If someone says "the machines are people, so this proves nothing": Acknowledge that, but say we are using people to simulate systems that are not transparent. In real systems (like a soda machine or a computer), we don't know the insides, so we use the intentional stance. The point is to see how belief ascription works even in simple systems.

  Limitations:
  - The machines are people, so they are conscious and have real beliefs. This might make Searle's point easier. We have to emphasize that we are using them as models of opaque systems. We can say: "Imagine we didn't know the rule and had to predict the machine's behavior. We would ascribe beliefs and desires (e.g., it wants to accept coins, it believes that discs with certain properties are coins)." So at the start, we should explain that in real life, we often don't know the internal mechanism.

  At the beginning, say: "In this exercise, we are simulating systems that are black boxes. The machine students are playing the role of a simple mechanism that we train. When we ascribe beliefs to them, we are doing what we do with any complex system: we take the intentional stance to predict behavior."

  Also, after the training, you can say: "Now, if we didn't know the rule, how would we predict what the machine will do? We would think: it believes that discs with X properties are coins. And that works."

  So the activity can still work, but we have to frame it carefully.

  Materials List:
  - Discs: At least 20 per world? We can make them from cardboard. Print on them: 
    - Front: diameter and mass (e.g., "25mm, 5g")
    - Back: value (e.g., "25¢") or nothing for counterfeits.
  - Scoreboard (whiteboard or paper) to record points.
  - Candy or tokens for rewards.
  - Paper and pens for spec writing and private writing.

  Predictable Problems:
  1. Machine students might not learn the rule correctly. Solution: Keep the rule simple and do enough examples. If they struggle, give more examples until they get it.
  2. The scoring might be confusing. Solution: Explain clearly and have a scorekeeper (you or a TA) who announces the result after each disc: "That was a good disc, and you accepted: +1", etc.
  3. The Twin world might be confusing. Emphasize the two worlds with different genuine coin standards.
  4. The spec activity might be abstract. Give clear instructions: "Group 1: You are the Twin central bank. Your spec is: 'This machine is intended to accept genuine Twin coins (30mm,6g).' Based on this spec, what beliefs does the machine have? Group 2: You are the Home designer. Your spec is: 'This machine was built to accept genuine Home coins (25mm,5g).' What beliefs does it have in Twin world?"
  5. The private writing: Some students might not see the tension. The debrief will help.

  Final Output: A detailed guide for the TA.

  Let me write the full guide.
answer: |-
  Below is a comprehensive, ready-to-use session plan designed to create the exact tension you're seeking. I've refined your activity to maximize experiential learning, address the limitations you noted (especially the transparency of human "machines"), and ensure students *feel* the philosophical fork. The plan includes timing, materials, facilitation scripts, troubleshooting, and debriefing. Crucially, I've added a **framing device** to handle the "machines are people" objection and preserve the intentional stance's force.

  ---

  ### **Session Overview**
  **Goal:** Make students viscerally experience the Dennett/Searle disagreement by feeling:  
  (1) Belief ascription is spontaneous and indispensable for prediction.  
  (2) Belief content depends on external context, not internal states.  
  (3) Dennett (ascription *is* content) and Searle (ascription is observer-relative) are two reactions to this fact.  

  **Core Mechanism:** Students role-play as "detectors" in two worlds (Home/Twin) with different coin standards. Identical training creates "same internal state," but context changes belief content.  

  **Key Fix for Transparency Issue:** Frame the detectors as **black-box systems** from the start. Emphasize that students are simulating *opaque* mechanisms (like a soda machine), and their human understanding is a "bug" we'll address later.  

  **Time:** 90 minutes  
  **Participants:** 12 students (mix MA/undergrad). 3 volunteers as "detectors," others as "customers" or observers.  

  ---

  ### **Materials List**  
  | Item | Quantity | Notes |  
  |------|----------|-------|  
  | Cardboard discs | 40 total | Diameter: 2.5 cm (Home) / 3.0 cm (Twin). Mass: 5g (Home) / 6g (Twin). Use stickers for mass/diameter. |  
  | Value stickers | 20 | Say "25¢". Only visible to trainer/customers. |  
  | Blank stickers | 20 | No text (for counterfeits). |  
  | Scoreboards | 2 | Whiteboard or poster: Home vs. Twin. Track "Points" (not money). |  
  | Candy/tokens | 50+ | For scoring rewards (1 per point). |  
  | Rule cards (secret) | 2 | For trainer only: "Accept ONLY diameter X cm + mass Y g." (X/Y differ by world). |  
  | Pens/paper | 15 sets | For specs + private writing. |  
  | Timer | 1 | For strict timekeeping. |  

  **Disc Setup:**  
  - **Home World Discs (20):**  
    - 10 "genuine": 2.5cm + 5g + "25¢" sticker.  
    - 5 "counterfeits": 2.5cm + 5g + blank sticker (same physics, no value).  
    - 5 "distractors": Other sizes/masses + blank stickers.  
  - **Twin World Discs (20):** Identical to Home but 3.0cm + 6g.  

  ---

  ### **Session Script (90 Minutes)**  
  **Phase 1: Setup & Training (15 min)**  
  - **0–5 min: Framing (Critical for Transparency Fix)**  
    - "Today, we’re simulating simple detection systems—like a soda machine that 'believes' quarters are money. You’ll interact with black boxes trained to 'accept coins.' Their internals are opaque; we only see inputs/outputs. *Your job is to predict behavior using the intentional stance.*"  
    - Assign roles:  
      - 1 "Home Detector" (Student A).  
      - 1 "Twin Detector" (Student B—copy of A).  
      - 1 "Native Twin Detector" (Student C—trained for Twin).  
      - Others: Customers (present discs) or observers (track predictions).  
    - Rules:  
      - Detectors see ONLY diameter/mass (no values).  
      - Customers see everything but don’t speak.  
      - Scoring: +1 for accepting genuine/rejecting bad; -1 for rejecting genuine/accepting bad.  

  - **5–15 min: Train Detectors**  
    - Take Students A (Home) and C (Native Twin) aside. Show discs one by one. Say "accept/reject" based on secret rule:  
      - Home: Accept ONLY 2.5cm + 5g.  
      - Twin (for C): Accept ONLY 3.0cm + 6g.  
    - Use 10 discs per detector (5 genuine, 3 counterfeits, 2 distractors). Never state the rule.  
    - **Key moment:** Ask detectors to "act mechanically—no reasoning, just reflex." If they hesitate, say: "You’re a vending machine. React based on training."  
    - After training, tell Student B (Twin Detector): "You’re an *exact physical copy* of A. Use their same internal rule." (Student A whispers rule to B: "Accept 2.5cm+5g").  
    - **Why this works:** Training by example creates "opacity." Students feel the rule intuitively but can’t articulate it mid-activity.  

  **Phase 2: Prediction Rounds (25 min)**  
  - **15–25 min: Round 1 (Home Detector in Home World)**  
    - Customers give Student A discs in Home. After each, observers predict accept/reject.  
    - Use 5 discs:  
      1. Genuine Home (2.5cm+5g+value) → Accept. (+1)  
      2. Counterfeit Home (2.5cm+5g+no value) → Accept. (-1)  
      3. Distractor (e.g., 2.5cm+6g) → Reject. (+1)  
      4. Genuine Twin (3.0cm+6g+value) → Reject. (+1)  
      5. Genuine Home → Accept. (+1)  
    - **Facilitator script:** "Before each disc, observers: What will the detector believe? Why? [...] Notice how you’re ascribing beliefs to predict. *It’s effortless.*"  
    - Record scores. Total: +3 (if perfect).  

  - **25–35 min: Round 2 (Twin Detector in Twin World)**  
    - Student B (copy of A) now in Twin World. Same 5-disc sequence but with Twin discs:  
      1. Genuine Twin (3.0cm+6g+value) → Reject. (-1)  
      2. Counterfeit Twin (3.0cm+6g+no value) → Reject. (+1)  
      3. Distractor (e.g., 3.0cm+5g) → Reject. (+1)  
      4. Genuine Home (2.5cm+5g+value) → Accept. (-1)  
      5. Genuine Twin → Reject. (-1)  
    - **Key moment:** Pause after Disc 1. Ask: "It rejected a Twin genuine coin. Why? What does it *believe* about this disc?" Let observers debate. Don’t correct.  
    - Record scores. Total: -1 (detector fails).  

  - **35–40 min: The Reveal (Silent Tension)**  
    - Display scores: Home Detector (+3) vs. Twin Detector (-1).  
    - Ask: "Student B, did your internal rule change?" (No).  
    - **Script:** "So: same detector, same internals, but in Twin World, it rejects genuine coins and accepts fakes. Its 'beliefs' led it astray. *What changed?*"  
    - **SHUT UP FOR 60 SECONDS.** Let them notice: Belief content diverged without internal change.  

  **Phase 3: Specs & Counterfeits (25 min)**  
  - **40–50 min: Spec Writing**  
    - Split class into two groups:  
      - Group 1 (Designers): "Write a spec for the Twin Detector *as if it were built for Twin World*. What should it believe?"  
      - Group 2 (Users): "Write a spec for the Twin Detector *as used in Twin World*. What does it actually believe?"  
    - **Example outputs:**  
      - Designers: "Should believe 3.0cm+6g discs are coins."  
      - Users: "Believes 2.5cm+5g discs are coins."  
    - Discuss: "Same detector, two specs → two belief ascriptions. Which is 'true'?"  

  - **50–60 min: Counterfeit Scenario**  
    - Replay Round 1, Disc 2 (Home Detector accepted counterfeit). Ask:  
      - "When it accepted the counterfeit, did it *believe* it was a coin? Why?"  
      - "If it has a false belief, where is that belief? In its 'mind' or in our ascription?"  
    - **Then introduce Native Twin Detector (Student C):** Run 1 disc in Twin World (genuine Twin). It accepts → +1. Ask: "Does it *believe* this is a coin? Is that belief more 'real' than the other detector’s?"  

  **Phase 4: Private Writing & Debrief (25 min)**  
  - **60–65 min: Private Writing**  
    - "Without discussion, write:  
      (a) What the Native Twin Detector believes about a genuine Twin coin.  
      (b) Is this a genuine belief (like yours) or just an ascription we project?  
    Sign it and hand it in."  
    - Collect and tally responses. Expect ~50% split on (b).  

  - **65–75 min: Reveal Responses & Map to Philosophy**  
    - Display tally (e.g., "8 say genuine belief; 4 say ascription").  
    - **Debrief script:**  
      - "This split mirrors Dennett vs. Searle. Let’s map it:  
        - **Same fact:** Both agree detectors rely on external context for 'aboutness.' No internal state fixes content (Twin Detector proved this).  
        - **Dennett:** Belief ascription isn't 'fake'—it’s *all there is*. Your predictions in Round 1 required it. Specs are just different 'stances.'  
        - **Searle:** Ascription is observer-relative (like your specs). Detectors lack intrinsic intentionality—their 'beliefs' are derived from designers/context.  
      - **The fork:** Dennett: 'Belief' is defined by ascription. Searle: Ascription exposes absence of *real* belief."  
    - **Map to your syllabus:**  
      - Two-bitser: Dennett’s detector is like your trained students—context determines content. Searle would say both lack original intentionality.  
      - Original vs. derived: Detectors have derived intentionality (from training/specs); humans (allegedly) have original.  

  - **75–90 min: Handle Objections & Limitations**  
    - **Predictable issues:**  
      - *"But detectors are people—they have real beliefs!"*  
        Response: "True, but we used them to simulate *opaque systems*. In real cases (AI, thermostats), we can’t peek inside. The intentional stance works identically—that’s Dennett’s insight. But Searle would say: 'This proves my point! Only humans have intrinsic meaning.'"  
      - *"Detectors reasoned about discs!"*  
        Response: "That’s why we trained them to act mechanically. If someone slipped, it’s a reminder that real systems aren’t transparent—which helps Searle. But Dennett would reply: 'Even if opaque, the stance is indispensable.'"  
    - **Limitations of activity:**  
      - Human "machines" make internals feel accessible, weakening Dennett’s core argument (the stance is for *truly* opaque systems). **Fix:** Explicitly state during framing and debrief: "In real life, we use the intentional stance when mechanisms are too complex to decode. Today, you *simulated* that opacity."  
      - Searle’s "original intentionality" feels more intuitive here. **Mitigation:** The spec activity forces students to see ascription as functional (Dennett) even when they "know" the detector is human.  
    - **Closing:** "The tension you felt—'Is it real belief or just ascription?'—is the heart of the debate. Dennett dissolves the question; Searle uses it to deny machine minds."  

  ---

  ### **Why This Works**  
  - **Framing handles transparency:** By treating detectors as black boxes upfront, the intentional stance feels necessary. Students experience prediction-ascription *before* remembering detectors are human.  
  - **Twin Detector creates the "fork":** Its failure in Twin World forces students to see content depends on context, not internals. The silent pause makes this visceral.  
  - **Specs + private writing expose the split:** Students commit to a position *before* labeling it "Dennett/Searle," making the disagreement personal.  
  - **You avoid lecturing:** Objections are redirected to activity outcomes (e.g., "Remember when you predicted behavior using beliefs? That’s Dennett’s point.").  

  ---

  ### **TA Instructions**  
  - **Prep:** Print discs, hide values. Rehearse training sequences.  
  - **During:**  
    - Enforce roles strictly (detectors: no reasoning; customers: no hints).  
    - Keep pace with timer—move on even if messy.  
    - **Critical silence:** After Twin Detector fails, pause. Let discomfort build.  
  - **Debrief:** Use student responses (specs/private writing) as data. Don’t preach; ask: "How does this map to Dennett’s two-bitser?"  

  This plan creates the tension you want while acknowledging its limits. By making the detectors *feel* like tools for prediction first, and humans second, Dennett’s view gains intuitive force—setting up a richer debate. Run it as-is, and the room will split exactly as you hope.
