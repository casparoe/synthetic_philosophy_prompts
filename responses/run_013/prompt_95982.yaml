  I need to unpack the paradox of fiction first. The usual explanations are: make-believe (we pretend to feel), thought-triggered emotions (ideas move us without belief), or temporary suspension of disbelief. The frame story in The Princess Bride adds complexity because the kid is fictional, so his emotions are pretend within a pretend narrative. 

  The user's core question is whether this nested structure breaks the make-believe theory or shows that all emotions in fiction are similarly constructed. They also point to the grandfather's real affection as an anchor of reality. 

