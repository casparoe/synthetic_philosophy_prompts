  I need to create exactly five numbered items covering specific aspects: setup, rules/scoring, run of play, debrief, and predictable issues. Each item should be no more than two sentences. The activity must make the paradox unavoidable, not just likely. I should sketch multiple options internally but only present one in my answer.

