  4.  **Evaluative Standards:** The relative weights given to metaphysical parsimony vs. explanatory robustness, and the significance attributed to theoretical virtues (are they *merely* pragmatic or *tracking reality*?), are fundamental evaluative stances difficult to argue for neutrally. Humeans see Anti-Humeans as multiplying entities without necessity; Anti-Humeans see Humeans as leaving out essential explanatory structure.
