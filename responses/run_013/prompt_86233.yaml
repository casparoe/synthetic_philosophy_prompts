  Just got back from like two hours of arguing with my friend Dev about the dust specks thing — you know the one, where it's either one person gets horribly tortured for 50 years or some absurd number of people (3^^^3 I think? some tower-of-threes nightmare) each get one speck of dust in the eye, which they blink away and forget about within a second. I said specks, pretty much automatically, and he looked at me like I'd sprouted a second head. His whole case was basically one analogy and he was pretty proud of it: he says summing up tiny harms is just like Chinese water torture, where any single drop on your forehead is nothing and yet after enough drops you'd do anything to make it stop, or like a million cars each putting out one trivial puff of exhaust that together blanket a whole city in smog. Nothing's doing real harm on its own, he says, but the pile is obviously awful — so obviously the specks beat the torture, and if I deny that I'm committed to saying the drops don't add up either, or that smog is fine. I kept saying but it's not the same person, and he kept saying harm is harm, and I could feel something sliding around in there but I couldn't put my finger on it. It's been bugging me all evening and honestly I'm not even sure anymore whether I agree with him for the reasons I thought I did.

  Can you audit the analogy for me? Lay out what's supposed to map onto what — the drip, the forehead, the accumulating hours, the cars, the exhaust, the air over the city, the one tortured person, the 3^^^3 people, the single speck, the 50 years — and say for each piece whether the mapping holds cleanly, only partially, or breaks entirely, and then which of the breaks actually matter for the conclusion he's drawing versus which are just scenery. The thing I most want to know is whether the analogy is doing any real work or whether it's quietly assuming the arithmetic it's supposed to be defending. Then tell me if his conclusion survives once the disanalogies are on the table, and if there's a better analogy for whatever it is I'm actually tempted by, give me that too — and be honest about what that one can't do either.

