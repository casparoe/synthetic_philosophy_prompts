answer: |-
  ## Murmuration Sestina

  The dusk pier holds the cold. Each bird must **turn**  
  by wing-tip calculus on shifting **edge**,  
  a vector tracing neighbours in thin **line**,  
  sensed shift in pressure, shadow of the **hawk**.  
  No master plan, just local **pattern** made  
  from thousand eyes in fluid, sharpened **air**.

  A vortex forms in twilight's salted **air**,  
  where impulse flickers, urging each to **turn**  
  through coded instinct. Motion is the **pattern**  
  surviving on the adaptive **edge**,  
  the quick response that foils stooping **hawk**  
  by weaving chaos to a seamless **line**.

  Is this then why we see a purpose **line**  
  the sky? This dance against the hungry **air**  
  seems shaped to guard the many from the **hawk**,  
  as if the mass itself could choose to **turn**  
  away from death along the bright sea's **edge**,  
  each life a stitch in safety's living **pattern**.

  The flock decides: it swings, a dark **pattern**  
  that bends the light. A purpose draws the **line**  
  away from threat above the splintered **edge**  
  of wood and wave. It breathes the common **air**,  
  a knowing shape. It feels the need to **turn**  
  as one great will escapes the diving **hawk**.

  But is that truth? Or just the shadowed **hawk**  
  we paint on chance, imposing wish on **pattern**?  
  Perhaps no mind commands that swift **turn**,  
  just physics layered deep, a traced **line**  
  of cause in every beat through empty **air**,  
  each choice constrained on survival's **edge**.

  Here hangs the test: predict on danger's **edge**.  
  Before the steel-taloned stoop, the **hawk**  
  unseen, the flock already veers in **air**  
  as if forewarned. The predictive **pattern**  
  holds—a description shrinks the flowing **line**  
  to flock-intent, explaining why they **turn**.

  The murmur *is* the pattern, turn by turn,  
  a way to name the edge where purpose and the sheer air  
  converge. It flies the line. It dodges hawks.  
  It compresses the world. But is it *there*?  

  ---

  **Notes on Structure & Intent:**

  1.  **Sestina Form:** Six 6-line stanzas with rotating end-words (turn/edge/line/hawk/pattern/air), followed by a 3-line envoi incorporating all six words.
  2.  **Perspective Shifts:**
      *   **Stanzas 1 & 2: Physics:** Focus on individual birds, vectors, pressure, instinct, local rules, coded algorithms, physics layered deep. Avoids agency.
      *   **Stanzas 3 & 4: Purpose/Built-for-a-Design:** Uses words like "purpose," "shaped to guard," "safety's living pattern," "a knowing shape," "great will," "predictive pattern." Frames the movement as an evolved anti-predator adaptation.
      *   **Stanzas 5 & 6: Agency/Wants-Something:** Uses words like "The flock decides," "It feels the need," "commands," "flock-intent," "predictive pattern...holds." Treats the flock as a single entity making decisions and predictions (like dodging the unseen hawk).
  3.  **The Envoi's Question:** Leaves the ontological question open ("But is it *there*?"). It summarizes the pattern-as-description ("a way to name") and hints at the compression idea ("compresses the world"). The murmur *is* the pattern, but the poem doesn't claim whether the pattern is a real entity or just a useful description.
  4.  **Predictive Power (Agency Test):** Stanza 5 explicitly addresses the requirement: predicting the turn *before* the hawk is visibly diving, explained by treating the flock as a single agent ("flock-intent").
  5.  **Fairness to Physics View:** Stanza 6 directly questions the agency view ("Or just the shadowed hawk / we paint on chance... / just physics layered deep"). The physics perspective remains valid throughout.
  6.  **Compression Metaphor:** Integrated subtly in the envoi ("It compresses the world") and implied by the sestina form itself – the rotating end-words force economy and pattern onto the description of a complex phenomenon.
  7.  **Sound & Readability:** Designed for rhythm, internal rhyme ("holds the cold," "wing-tip calculus," "flickers, urging," "bends the light," "steel-taloned stoop"), and sonic texture to be read aloud effectively ("dusk pier," "coded instinct," "salted air," "vortex forms").
