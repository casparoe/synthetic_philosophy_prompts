prompt: |-
  I'm on the audience standards panel at a public broadcaster, and I have to draft our written decision before Thursdays meeting. The case is a four-part drama, already shot and scheduled for March, about a real woman who ran the hospital in a mining town around 1900 — harsh with her staff, cold to her own children, died alone, all of that is on the record. The drama invents a long affair for her and a final act of atonement at a dying miner's bedside. It also takes a real pit disaster in which eleven men died, moves it a year earlier, and hands her the discovery of it; the person who actually raised the alarm was the mine's engineer, and we've cut him. Our historical consultant quit in the edit and has written to us saying we've defamed a woman who can't sue. Her great-granddaughter's lawyer says the dead still have interests and that we've put words in her ancestor's mouth; the engineer's great-grandson wants the scene reshot rather than captioned; and the family of a nurse our lead character sacks on screen is delighted, because the drama shows the sacking was unjust. Legal says the dead have no standing and that we're covered by a "loosely inspired by" disclaimer, which I think is thin given we use her real name, her real town and her photograph in the titles. Our own code says drama must not "materially mislead" — about what, and whom, nobody has ever said. Give me the panel's opinion: what we recommend, what the production has to do by when, and the honest best case for the side I'm inclined to rule against. I don't want a survey of the literature, I want something the panel can vote on.
reasoning: |-
  Okay, the user is on an audience standards panel for a public broadcaster and needs to draft a written decision by Thursday. They've presented a complex case involving a historical drama that's already been shot and is scheduled for March. The drama is about a real woman who ran a hospital in a mining town around 1900. It portrays her as harsh with staff and cold to her children, which is on the historical record. However, the drama invents a long affair and a final act of atonement. It also moves a real pit disaster a year earlier and attributes the discovery to her instead of the actual mine engineer, who was cut from the story.

  The key issues here are:
  - Historical consultant quit during editing and claims they've defamed a woman who can't sue
  - Great-granddaughter's lawyer argues the dead still have interests and they've put words in her ancestor's mouth
  - Engineer's great-grandson wants the scene reshot rather than captioned
  - Family of a nurse who was fired is happy because the drama shows the sacking was unjust
  - Legal says dead have no standing and they're covered by "loosely inspired by" disclaimer
  - Broadcaster's code says drama must not "materially mislead" - but it's undefined

  The user wants a panel opinion they can vote on, not a literature survey. They need recommendations, what production must do by when, and the best case for the side they're inclined to rule against.

  I need to focus on the broadcaster's code about not "materially misleading" since that seems to be the ethical standard here, even if legal says they're covered. The disclaimer might be insufficient given they're using her real name, town, and photo - viewers could reasonably assume the events are factual.

  The invented affair and atonement are problematic because they attribute fictional actions to a real person. The pit disaster manipulation is also serious - changing historical facts about who discovered it and when it happened.

  For the panel's recommendation, they should probably require changes to address these inaccuracies. The "loosely inspired by" disclaimer should be strengthened, and they should consider adding captions to clarify what's fictional. Reshooting might be too costly, so captions could be a compromise.

  For the best case against the ruling: The drama brings attention to a forgotten historical figure and highlights systemic issues. The emotional arc (affair, atonement) makes it engaging and could spark interest in real history. Changing the pit disaster timeline serves dramatic pacing. The disclaimer and genre conventions should signal to viewers that this isn't a documentary.

  The panel should require specific changes by a certain date (mid-February) to ensure the broadcast meets ethical standards, balancing creative freedom with historical responsibility.
answer: |-
  Here is a draft panel decision for your Thursday vote, focusing on actionable recommendations, clear deadlines, and a fair statement of the opposing view:

  **Audience Standards Panel Recommendation: Case [Reference Number] - "[Drama Title]"**

  **1. Panel Opinion:**
  The Panel finds that the drama "[Drama Title]" **risks materially misleading the audience regarding specific historical events and individuals**, contravening our Code's requirement that drama must not "materially mislead." While acknowledging the creative license inherent in historical drama, the specific alterations – attributing the discovery of the pit disaster to the protagonist (removing the engineer) and inventing a long-term affair and deathbed atonement – applied to a drama using the real name, photograph, and location of a documented historical figure, cross a threshold. The "loosely inspired by" disclaimer is insufficient to mitigate this risk given the level of specific, verifiable detail used alongside significant fictional inventions directly attributed to the protagonist. The potential for the audience to conflate these invented elements with documented history is substantial and undermines the broadcaster's commitment to accuracy in portrayal, even within a dramatic context. Concerns regarding the portrayal of the nurse, while noted, do not constitute a material inaccuracy as the injustice appears aligned with the documented harshness of the protagonist.

  **2. Recommendations:**
  The Panel **RECOMMENDS** the following actions by the production team:

  *   **a) Disclaimer Enhancement:** Replace the "loosely inspired by" disclaimer with a more explicit and prominent one, both verbally (audio) at the start of each episode and visually (text on screen for sufficient duration). The new disclaimer must state clearly: **"While based on the life of [Real Woman's Name] in [Real Town Name], this drama contains significant fictional elements, including invented personal relationships and actions attributed to [Real Woman's Name], and alterations to historical events such as the [Name of Pit] disaster."**
  *   **b) Pit Disaster Scene Caption:** Add a permanent, clearly visible on-screen caption during the pit disaster discovery scene stating: **"The [Name of Pit] disaster actually occurred in [Correct Year]. The alarm was raised by Mine Engineer [Engineer's Real Name], not [Real Woman's Name]."** (Reshooting to reinsert the engineer is deemed impractical and disproportionate; a clear factual caption addresses the core historical misattribution).
  *   **c) Contextual Note in Episode 4:** Add a brief factual end card/epilogue text after the final scene of Episode 4, stating: **"The depiction of [Real Woman's Name]'s final act of atonement is a fictional invention. Historical records document her death as solitary."**

  **3. Deadlines for Compliance:**
  The production team must implement recommendations **2a, 2b, and 2c** and provide final, approved versions of the affected episodes with these changes integrated to the Standards Department **no later than close of business Friday, [Date - 14 days before scheduled broadcast]**. This allows adequate time for final technical checks and ensures compliance before transmission. **Failure to meet this deadline will necessitate postponement of the broadcast.**

  **4. Best Case for the Opposing View (Against These Recommendations):**
  The Panel acknowledges the strong argument that the drama, as currently presented, represents legitimate creative interpretation within the historical fiction genre. Its proponents would argue:
      *   The core essence of the protagonist's documented character (harshness, coldness, solitary death) is retained, providing a foundation for exploring universal themes of power, isolation, and potential regret through fictional devices (the affair, atonement).
      *   Consolidating the pit disaster discovery into the protagonist's actions serves dramatic economy and thematic focus, heightening the central character's narrative arc and the community's trauma, without negating the disaster's tragic reality. Genre conventions signal to audiences that events may be condensed or altered for narrative purposes.
      *   The existing "loosely inspired by" disclaimer, coupled with the inherent nature of a *drama*, provides sufficient signalling to the audience that this is not a documentary. Rigid adherence to minor historical chronology (the disaster year) or the inclusion of every historical actor (the engineer) is not required for the core truth of the era and the protagonist's difficult nature to resonate powerfully. Altering these details does not fundamentally distort the historical *context* being explored.
      *   The drama brings significant attention to a forgotten historical figure and a crucial period of social/industrial history, sparking public interest and debate that outweighs the concerns about specific fictionalized elements attached to individuals no longer living and unable to be legally defamed. The emotional truth sought through the fiction serves a valid artistic and public engagement purpose.

  **5. Panel Vote:**
  The Panel recommends adoption of the above recommendations (Points 2 & 3) to the Head of Content/Commissioning Editor.

  ---
  **Key rationale embedded in the decision:**

  *   **Focus on "Materially Mislead":** The Panel interprets this as preventing the audience from reasonably believing significant, specific, and verifiable actions/events depicted about real people/events are true when they are not. The name, photo, town, and documented facts create a framework where the invented *personal* actions (affair, atonement) and the *specific historical misattribution* (disaster discovery) become materially misleading.
  *   **Proportionality:** Captions and disclaimers are mandated over reshoots (engineer) or major edits (affair/atonement plot), balancing ethical concerns with practicality. The nurse portrayal is deemed acceptable.
  *   **Actionable & Timely:** Clear, specific actions with a firm deadline linked to the broadcast schedule.
  *   **Fair Opposition:** The "Best Case" genuinely articulates the creative and engagement arguments for minimal change, acknowledging the validity of the genre conventions and artistic goals, even if the Panel ultimately finds them insufficient *in this specific context* given the use of real identifiers.
