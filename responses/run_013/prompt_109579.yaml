prompt: |-
  I have been following rationalist and adjacent decision-theory blogs for years, and I keep returning to Pascal's mugging not as a curiosity but as a stress test for how a bounded agent should actually live. Suppose the mugger is not offering literally infinite utility but a finite reward that dwarfs the value of the entire observable universe, and suppose there are many such muggers, each with mutually exclusive offers, each demanding a small but non-zero share of your resources, and you have neither the time nor the computational capacity to evaluate them all. I am interested in the most important implications of this set-up, not in a survey of the literature, and I do not want a bibliography or a reading list.

  Please set out what you take to be the most consequential implications for (a) the choice between expected-utility maximisation and rival decision rules such as maximin, risk-aversion, or lexicographic thresholds; (b) the epistemology of testimony when the stakes are astronomically large and the evidence is thin; (c) the practice of assigning and acting on tiny probabilities in domains like existential risk, AI safety, and effective altruism; and (d) the broader question of whether a bounded agent can be rational at all if it must sometimes ignore Pascal-mugging-style considerations in order to get anything done. Where two implications pull in opposite directions, say so, and tell me which one you think a rationalist should treat as the more fundamental constraint. I would rather have a compact map of the tensions than a list of conclusions.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're deeply involved in rationalist and decision-theory blogs and keep coming back to Pascal's mugging as a stress test for bounded agents. The scenario they describe involves finite but universe-dwarfing rewards, multiple mutually exclusive offers, and limited computational resources. They want implications for four areas: decision rules, epistemology of testimony, tiny probabilities in existential risks, and the rationality of bounded agents.

  First, I need to make sure I understand the core of their concern. They're not interested in a literature review but in the practical tensions and how a bounded agent should navigate them. The user is likely someone engaged in effective altruism or AI safety, where these decisions have real-world consequences. Their unspoken need might be finding a principled way to prioritize actions without getting paralyzed by Pascal-style scenarios.

  Looking at part (a) about decision rules. Expected utility maximization falls apart here because tiny probabilities of huge payoffs dominate, but bounded agents can't compute all options. Alternatives like maximin or risk-aversion might avoid exploitation but could lead to ignoring genuine high-impact opportunities. The tension is between vulnerability to muggers vs. missing real opportunities. I need to highlight that no rule is perfect, and bounded rationality requires heuristics like probability thresholds or diversification.

  For (b), epistemology of testimony. When stakes are astronomical, even weak evidence could demand attention. But with many claims, evaluating all is impossible. The key issue is how to allocate attention. Methods like requiring extraordinary evidence for extraordinary claims or trusting institutional filters become necessary. The tension is between open-mindedness and epistemic efficiency. A rationalist might prioritize filters to avoid being overwhelmed, accepting some missed opportunities as a cost.

  Part (c) involves tiny probabilities in existential risks. Here, Pascal's mugging is a cautionary tale. Assigning fixed small probabilities to speculative risks could justify excessive resources, but ignoring them might be catastrophic. The balance is in robust assessment and proportional response. The user probably wants to know how to allocate resources without being swayed by every dire prediction. Emphasizing resilience and avoiding single-point interventions might be key.

  Finally, (d) on bounded rationality. The agent must ignore some mugging scenarios to function, but is that rational? The meta-principle here is that rationality includes resource management. Ignoring some options isn't irrational if evaluating them costs too much. The fundamental constraint is the necessity of bounded heuristics, with the risk of both false negatives and positives.

  I should map the tensions clearly. For each point, show opposing forces and suggest which constraint is more fundamental. The user needs a framework to make trade-offs, not just answers. Highlight that resource constraints make some ignorance rational, and prioritization heuristics are essential despite their flaws. In effective altruism contexts, this might mean focusing on more tractable issues while keeping an eye on robust strategies for high-stakes risks.
answer: |-
  Here’s a map of the core tensions and implications, structured around your four domains. The central conflict is **bounded resources vs. unbounded stakes**, forcing trade-offs where no option is fully satisfying.

  ### (a) Decision Rules: The Fragility of Expected Utility (EU) & the Cost of Alternatives
  - **EU Maximization's Vulnerability:** With universe-dwarfing stakes, even *infinitesimal* probabilities dominate EU calculations if taken literally. A bounded agent *cannot* compute or act on all such possibilities without being bankrupted by countless muggers or paralyzed by analysis. EU becomes operationally useless or self-destructive.
  - **Alternatives & Their Downsides:**
    - **Maximin (Worst-Case Focus):** Ignores the astronomical upside entirely ("Ignore all muggers"). Protects against exploitation but guarantees missing truly transformative (if unlikely) opportunities. Overly pessimistic for a universe containing unknown, high-impact possibilities.
    - **Lexicographic Thresholds (Probability/Stakes Floor):** "Ignore probabilities below ε or stakes below X." Pragmatic necessity for bounded agents. However:
      * *Arbitrariness Problem:* Justifying the threshold ε is philosophically fraught; it feels ad hoc.
      * *False Negatives:* Genuine, transformative opportunities below ε are systematically ignored (e.g., a real 10^-100 chance to save 10^100 lives).
    - **Risk-Aversion over Stakes:** Discounting extreme utilities (e.g., capped utility, diminishing marginal utility for cosmic stakes). Mitigates mugging but requires justifying why saving N universes isn't >N times better than saving one – violating intuitive (if problematic) EU axioms.
  - **Key Tension:** EU demands attention to tiny chances of vast gains, leading to ruin. Alternatives impose arbitrary cutoffs, potentially blinding agents to real, extreme opportunities. **Fundamental Constraint:** *Bounded agents MUST use thresholds or caps (lexicographic or risk-aversion) to function.* Rationality here means accepting this boundedness; treating EU as sacrosanct is irrational for finite beings. The cost of false negatives (missing real big wins) is the unavoidable price of avoiding bankruptcy by false positives (muggers).

  ### (b) Epistemology of Testimony: The Burden of Extraordinary Claims
  - **The Testimonial Dilemma:** Muggers offer claims with: (1) Astronomical stakes, (2) Minimal evidence, (3) Low cost to investigate/act (relative to potential gain). EU (naively applied) says: "Pay up, even if evidence is thin; the potential upside justifies it."
  - **Bounded Reality:** With *many* such claims, investigating/paying *all* is impossible. Agents must filter.
  - **Implications for Filtering:**
    - **"Extraordinary Claims Require Extraordinary Evidence" (ECREE):** Becomes a survival necessity. Requires demanding *disproportionately* strong evidence as the claimed stakes increase.
    - **Prior Plausibility Dominates:** An agent *must* heavily weight the intrinsic plausibility of the mechanism (physics, psychology, economics) over the raw stakes when allocating scarce attention. A mugger claiming magic is dismissed faster than one claiming undiscovered physics, even for identical stakes.
    - **Costly Signals & Reputation:** Reliance on institutional filters or sender "skin in the game" becomes critical. A random stranger is ignored; a credentialed physicist with a detailed paper (even if unverified) gets more attention.
  - **Key Tension:** High stakes *should* lower our evidential threshold (per EU), but boundedness *forces* us to raise it (via ECREE/plausibility filters) to avoid being swamped. **Fundamental Constraint:** *Plausibility and evidence quality must scale super-linearly with claimed stakes.* Ignoring stakes entirely is reckless, but lowering standards proportional to stakes is fatal. The filter's harshness is set by the agent's capacity, not pure epistemology.

  ### (c) Tiny Probabilities & Existential Risk (x-risk): Mugging as a Cautionary Tale & a Trap
  - **The EA/x-risk Connection:** Pascal's Mugging structurally mirrors arguments for prioritizing x-risks (e.g., AI doom): tiny estimated probability × vast stakes (all future lives) = high expected value.
  - **Mugging's Warning:** Naive application leads to: (1) Over-resourcing *any* speculative x-risk with vaguely defined vast stakes, (2) Vulnerability to "x-risk entrepreneurs" making unfalsifiable claims, (3) Neglect of robust, near-term, high-probability good.
  - **Essential Refinements (Avoiding the Trap):**
    - **Robustness over Pure EV:** Prioritize interventions that work across probability distributions (e.g., "minimax regret") or have strong ancillary benefits even if the x-risk probability is zero. Focus on reducing *vulnerability* to classes of risks.
    - **Probability Assessment Rigor:** Relentlessly decompose probabilities. Distinguish: "Probability based on understood physics/engineering" vs. "Probability based on speculative chains of reasoning." Treat the latter as *vastly* more uncertain. Demand mechanisms.
    - **Diversification & Option Value:** Spread resources across multiple x-risk pathways and non-x-risk good. Avoid betting everything on one highly speculative mugging-like scenario. Invest in general resilience and knowledge.
  - **Key Tension:** X-risk *requires* acting on small probabilities of vast stakes, making it structurally vulnerable to mugging dynamics. However, ignoring all such risks based *only* on their low probability is potentially catastrophic. **Fundamental Constraint:** *Probability estimates for cosmic-stakes claims must be grounded in mechanistic models and subjected to extreme scrutiny, not derived from the stakes themselves.* Action must prioritize robustness and diversification over chasing the highest naive EV.

  ### (d) Bounded Rationality: The Necessity of Strategic Ignorance
  - **The Core Paradox:** A truly rational EU maximizer *must* consider all possibilities. A bounded agent *cannot*. Therefore, a bounded agent *cannot* be a perfect EU maximizer. Is bounded rationality possible?
  - **Implications:**
    - **Rationality as Resource Allocation:** Rationality *includes* the meta-decision of how to allocate limited cognition/attention. Ignoring classes of mugging-like propositions *is rational* if the cost of processing them exceeds the expected loss from ignoring them *and* if reliable filters are too expensive to build.
    - **Heuristics are Mandatory:** Lexicographic thresholds, ECREE, strong priors based on plausibility – these aren't flaws; they are *solutions* to the computational intractability of naive EU. Their justification is instrumental: they prevent ruin.
    - **The Inescapable Risk:** Any practical heuristic *will* sometimes ignore a genuine opportunity or fall for a sophisticated mugging. This is not a failure of rationality; it's an inherent cost of finitude.
    - **Satisficing with High Aspirations:** Aim for "good enough" protection against ruin and capture of transformative opportunities *within capacity*, knowing perfection is impossible. Continuously refine filters as resources allow.
  - **Key Tension:** Perfect rationality demands attention to everything non-zero. Boundedness demands ignoring almost everything. **Fundamental Constraint:** *The capacity to act effectively in the foreseeable world is the primary constraint.* A "rational" bounded agent must prioritize avoiding immediate ruin and capturing tractable high-value opportunities *over* the vanishingly small chance of universe-dwarfing gains from untestable claims. This isn't abandoning rationality; it's defining rationality *for bounded beings*. Ignoring some muggers isn't irrational; it's essential for agency.

  ### The Overarching Map of Tensions
  1.  **EU vs. Boundedness:** EU is paralyzing/destructive for bounded agents → **Constraint Wins:** Heuristics/thresholds are non-negotiable.
  2.  **Stakes vs. Evidence:** High stakes demand lower evidential standards → **Constraint Wins:** Plausibility/ECREE filters must *strengthen* with stakes to maintain functionality.
  3.  **X-risk Importance vs. Mugging Vulnerability:** X-risk action resembles Pascal's Mugging → **Synthesis Wins:** Act on small-probability big-stakes *only* with rigorous probability assessment, robustness, and diversification.
  4.  **Perfect Rationality vs. Effective Agency:** Perfect rationality is impossible → **Constraint Wins:** Rationality *is* bounded agency; strategic ignorance is core to it.

  **The Most Fundamental Constraint:** **The necessity of maintaining functional agency in the face of limited resources.** This forces the adoption of heuristics (thresholds, filters, caps, ECREE) that systematically risk ignoring real transformative opportunities (false negatives) as the unavoidable cost of avoiding bankruptcy by false positives (muggers) and paralysis. A rationalist should prioritize building robust, tractable filters and pursuing diversified, robust impact *over* the (theoretically compelling but practically suicidal) pursuit of every vanishingly unlikely cosmic payoff. The ability to *do* good now outweighs the infinitesimal chance of doing infinite good later if pursuing the latter destroys the former.
