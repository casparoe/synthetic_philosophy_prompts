prompt: |-
  Six months ago I began sitting with a small Buddhist study group that reads early discourses in translation a few pages at a time and argues about them afterward, and last week two of the regulars had an exchange I have not been able to settle in my own mind. The topic has become personally pressing: I am trying to work out what I would be committing myself to if I began taking the precepts seriously, and I would like a careful adjudication rather than a survey of the literature.

  Ruth opened. Buddhist ethics, she said, is at bottom a consequentialist theory, and the precepts are instrumental rules of thumb. Everything in the framework runs through consequences: acts are assessed by whether they lead to suffering or to its cessation, for oneself and for others; the precepts bind in general only because breaking them reliably produces bad results; and the tradition's readiness to set them aside in extreme cases, such as the familiar thought experiment in which killing one person would prevent a massacre, shows that they are subordinate to outcomes rather than categorical constraints. The precepts are a technology, not a code.

  Miguel answered that this gets the structure of the doctrine backwards. In the tradition's own analysis of karma, what fixes the moral quality of an act is the agent's intention, not the state of the world the act produces. An act done from greed, hatred, or delusion is unwholesome however it turns out; an act done from generosity or compassion is wholesome even if it misfires. A theory that grades acts by the agent's motive rather than by their results is not a consequentialism at all, he said; it is closer to a virtue or character ethic, or at most a motive consequentialism, which is a different animal and needs a separate defence.

  Ruth replied that motive consequentialism is still consequentialism, since it merely locates the good-making consequence in the formation of good character. And intention matters here, she said, because of what intentions do: intention is the proximate cause of action, action of habit, and habit of the suffering or peace that follows. Karma is a causal doctrine about long-run effects, and intention earns its place in it by being causally potent, not by being intrinsically valuable.

  Then the doctrine cannot be a maximizing consequentialism, Miguel said, and that is what the term is usually taken to mean. In the cosmology the effects of an act ripple out over beginningless time and across rebirths, so no act's consequences ever terminate. But a maximizing theory needs to rank outcomes by total value, and where consequences are endless and the population of future beings is not fixed, those comparisons are undefined; every option threatens to come out with infinite value, and so all options tie. A theory whose comparisons all tie gives no guidance at all. This is not the ordinary complaint about uncertainty, he added; it is a failure of the value ordering itself.

  Ruth answered that the infinite-horizon objection proves too much, because it applies to any consequentialism that takes the far future seriously, including perfectly respectable secular ones. Consequentialists routinely choose among options whose long-run effects they cannot rank, and they do it by giving priority to the near-term effects they can estimate with some confidence. The tradition does the same: its operative instruction is to abandon what is unwholesome now and cultivate what is wholesome, and it treats distant karmic consequences as background motivation rather than as data to be summed. And the no-self doctrine, far from being an obstacle, is an argument for the impartiality consequentialism requires: if the boundary between my good and yours is as conventional as the boundary between my good now and my good next year, then suffering counts equally wherever it occurs. That is agent-neutral concern, not an alternative to it.

  Miguel's last word was that if the guidance reduces to cultivating the wholesome, the consequences are doing no work in it and the label is doing all the labour. There is also, he said, a deeper mismatch. Consequentialism evaluates acts by states of affairs, and it needs the good to be something like a total quantity of well-being on which different outcomes can be compared. In this tradition the goal is not a state of the world at all; it is the cessation of suffering, described as something attained by each being rather than as a global condition whose value could be computed and maximized. Meanwhile the theory's own operational test, the quality of the intention, can be applied without ever ranking worlds. When a doctrine's working criterion and its official value theory come apart like that, he said, we should follow the working criterion.

  I have read the exchange over several times and I genuinely cannot tell who has the better of it; each of them seems to land a real blow and then to overreach somewhere. What I want is a point-by-point adjudication. For each of the six moves, say whether it is sound, partly sound, or mistaken, and why, and be willing to split a move, since several of them contain more than one claim. Then say who is closer to right overall, and what both of them are missing: the distinction or consideration that would recast the dispute rather than resolve it in either one's favour. I do not need reading recommendations; I need the arguments assessed.

  Please lead with your bottom line in the first sentence — who has the better of the argument, and on which points — then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Okay, the user presents a complex debate between Ruth and Miguel on whether Buddhist ethics is consequentialist. They want a detailed point-by-point adjudication of each move in their exchange, followed by an overall verdict and identification of what both are missing. 

  First, I need to map their arguments clearly. Ruth argues Buddhist ethics is consequentialist because: (1) acts are evaluated by suffering/cessation consequences, (2) precepts are instrumental rules proven by results, (3) exceptions in extreme cases show outcome-dependence. Miguel counters that (1) intention determines karma's moral quality regardless of results, making it virtue-adjacent, not consequentialist.

  Ruth rebuts that even "motive consequentialism" remains consequentialist by locating value in character outcomes. Miguel then argues infinite karmic consequences make maximizing impossible (no defined value comparisons). Ruth counters this applies to all long-term consequentialisms, and Buddhism pragmatically focuses on near-term wholesomeness. Miguel's closer insists this renders consequences irrelevant and highlights a structural mismatch: Buddhism's goal (individual cessation) isn't a computable global state.

  Now, assessing each move:
  - Ruth's opener is partly sound: consequences matter but aren't exclusive; precepts have both instrumental and intrinsic aspects.
  - Miguel's first reply is sound: intention is primary in karma theory.
  - Ruth's "motive consequentialism" claim is mistaken; intention's role isn't outcome-based.
  - Miguel's infinity objection is mistaken; Buddhism doesn't require maximizing calculations.
  - Ruth's reply about near-term focus is sound pragmatically.
  - Miguel's last move is partly sound: cessation isn't a global state, but consequences still matter causally.

  Overall, Miguel's core framing is stronger because intention's primacy is canonical. Both miss that Buddhist ethics is diagnostic rather than theoretical—focused on uprooting defilements through present-moment awareness. The precepts train attention to mental patterns, making ethics about seeing causality, not computing outcomes. This reframes the dispute: it's about cultivating discernment, not choosing between consequence or intention supremacy.

  The user's urgency about precepts suggests they need this clarified: taking precepts means committing to mindfulness of motivations, not consequentialist calculus or rigid rules. The adjudication should emphasize this transformative purpose.
answer: |-
  **Bottom line:** Miguel has the better argument overall, correctly emphasizing intention as the primary criterion in karma and the non-maximizing structure of Buddhist ethics, though Ruth is partly right about consequences playing a causal role and the tradition’s pragmatic focus. Both miss that Buddhist ethics is fundamentally a *diagnostic* framework for uprooting defilements, not a theoretical construct prioritizing either consequences or intentions as foundational.

  ---

  ### Adjudication of Moves

  1.  **Ruth’s opener (Buddhist ethics is consequentialist; precepts are instrumental; exceptions prove outcome-dependence):**
      *   **Partly sound, partly mistaken.**
      *   *Sound:* Consequences *matter* in Buddhist ethics, as actions rooted in defilements *tend* to cause suffering. Precepts *are* largely instrumental (e.g., avoiding killing prevents remorse, hostility, and perpetuation of violence). Exceptions exist (e.g., Vinaya allows monks to eat meat if not seen/heard/suspected it was killed for them).
      *   **Mistaken:** Framing ethics as *at bottom* consequentialist overstates the case. Consequences are not the *primary* criterion; intention is. Precepts also train the mind and weaken defilements *intrinsically*, not just instrumentally via results. Exceptions are rare and context-dependent, often tied to intention (e.g., compassionate motivation), not merely outcome optimization.

  2.  **Miguel’s first reply (Karma hinges on intention; theory is virtue-like, not consequentialist):**
      *   **Sound.**
      *   The core doctrine (e.g., AN 6.63: "Intention, I tell you, is kamma") explicitly states that the moral quality (kusala/akusala) of an act is determined by the underlying mental state (rooted in greed, hatred, delusion or their opposites). Outcomes are irrelevant to this classification. Calling it "virtue-like" is apt, as the focus is on cultivating wholesome mental qualities (generosity, compassion, wisdom) and eradicating unwholesome ones. "Motive consequentialism" is a misnomer; the value isn't derived from the *consequence* of having a good motive, but the motive's intrinsic quality *as* kamma.

  3.  **Ruth’s reply (Motive consequentialism is still consequentialism; intention matters causally):**
      *   **Mistaken.**
      *   Reducing intention's significance to its *causal potency* ("what intentions do") ignores its role as the *defining factor* of kamma. Buddhist ethics *does* care about the causal chain (intention → action → habit → suffering/peace), but the moral valence is assigned at the *intention* stage, based on its roots, *before* consequences unfold. Calling this "consequentialism" stretches the term beyond recognition. Consequentialism evaluates acts *by* their results; Buddhism evaluates acts *by* the intention, *knowing* certain intentions tend to cause certain results.

  4.  **Miguel’s infinity objection (Maximizing consequentialism is impossible due to endless karmic effects; comparisons undefined):**
      *   **Partly sound, partly mistaken.**
      *   **Sound:** He correctly identifies a fatal flaw in interpreting Buddhist ethics as a *maximizing* consequentialism (e.g., utilitarianism). The infinite, interconnected web of karmic effects across time and rebirth makes calculating "net good" incoherent. The tradition offers no method for such calculation.
      *   **Mistaken:** This doesn't automatically disqualify *all* consequentialist interpretations. Ruth later points out (correctly) that Buddhism focuses pragmatically on the proximate. The objection is potent against maximizing forms but less so against others (e.g., satisficing, rule-consequentialism), though Miguel is right that "consequentialism" usually implies maximization.

  5.  **Ruth’s reply to infinity (Objection applies to all long-term consequentialism; tradition focuses on near-term wholesomeness; no-self enables impartiality):**
      *   **Partly sound, partly mistaken.**
      *   **Sound:** Her pragmatic point is strong. The Buddha consistently advises focusing on abandoning the unwholesome and cultivating the wholesome *in the present moment* (e.g., MN 61). Distant consequences *are* background motivation ("kamma is unpredictable, so avoid akusala now"). Anattā (no-self) *does* support impartial concern for suffering, aligning with consequentialism's agent-neutrality.
      *   **Mistaken:** While *pragmatically* focused on the near term, the *criterion* for "wholesome" (kusala) is still the intention's roots, *not* an estimation of near-term consequences. Equating the focus on present cultivation with a form of consequentialism conflates the *method* with the *evaluation standard*. Anattā supports compassion but doesn't mandate consequentialism; virtue ethics can also be impartial.

  6.  **Miguel’s last move (Guidance reduces to cultivating wholesome; consequences do no work; goal is not a state of the world; follow the working criterion):**
      *   **Sound, but incomplete.**
      *   **Sound:** He correctly identifies the core operational principle: cultivate kusala (wholesome states), abandon akusala (unwholesome states). Consequences *as a basis for calculation* play no role in this moment-to-moment practice. The ultimate goal (nibbāna) *is* the cessation of suffering *for the individual*, attained through insight and eradication of defilements, not the creation of an optimal world-state. The "working criterion" *is* the quality of the mind/intention.
      *   **Incomplete:** While consequences aren't the *evaluation standard*, they are undeniably part of the *rationale* and *motivation*. Understanding that unwholesome acts *lead to* suffering is crucial for developing right view and the resolve to abandon them. Consequences play a crucial *causal* and *explanatory* role, even if not the *evaluative* one.

  ---

  ### Overall Verdict and What's Missing

  *   **Miguel is closer to right.** He correctly anchors Buddhist ethics in the primacy of intention (cetana) as kamma, the non-maximizing structure due to infinite consequences, the goal as individual cessation rather than world-state optimization, and the practical focus on cultivating wholesome mental states in the present. Ruth correctly highlights the importance of consequences in the causal chain, the pragmatic focus on the near-term, and the impartiality supported by anattā, but mistakenly tries to force the framework into consequentialism, downplaying the foundational role of intention and the nature of the goal.

  *   **What Both Are Missing:** The debate frames Buddhist ethics as choosing between "consequentialism" or "virtue ethics/intentionalism." **It is neither; it is fundamentally a *diagnostic and therapeutic framework* aimed at the cessation of suffering by eradicating its root causes (greed, hatred, delusion) through the development of wisdom (paññā) and ethical conduct (sīla).** The precepts are neither mere rules of thumb (Ruth) nor purely intention-focused constraints (Miguel); they are *training rules* (sikkhāpada) designed to:
      1.  **Restrain** unwholesome actions and speech.
      2.  **Train awareness** of mental states (intentions) in real-time.
      3.  **Weaken** the underlying defilements through consistent non-indulgence.
      4.  **Create conditions** conducive to mental development (samādhi) and insight.
      The focus is on *uprooting the defilements that manifest as both unwholesome intentions and harmful consequences*. Consequences matter *as symptoms and reinforcing conditions* of defilements, not as independent goods/bads to be maximized/minimized. Intention matters *as the immediate manifestation* of those defilements or their opposites. The framework transcends the Western dichotomy by making *the mind's liberation from defilements* the core concern, with ethics serving this soteriological purpose. Taking the precepts seriously means committing to this training of body, speech, and mind to dismantle the causes of suffering.
