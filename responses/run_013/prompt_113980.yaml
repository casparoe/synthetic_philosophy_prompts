prompt: |-
  I chair the integrity committee of a mid-sized international NGO that runs maternal-health programs in about a dozen countries, and I have to circulate a written opinion before Friday's meeting on a case that has split the committee cleanly in two. Our largest local partner in one country is a clinic network with an excellent record on the measures our donors actually pay for; its founding director, who is also its principal fundraiser and effectively its owner, has for years accepted cash gifts, vehicle use, and meals from the two companies that supply its equipment, and this year he steered a no-bid contract to one of them. An external auditor working from our lead donor's standard anti-bribery template has flagged the whole arrangement as fraud and recommends that we terminate the partnership and refer the director to the national authorities. The director does not deny any of the facts. He says that in his country nothing of consequence is decided between strangers, that the two suppliers are his late brother's in-laws and his own cousins, that the cash he received went into the same clinic account that pays the nurses, and that a formal arm's-length tender among family firms would be read by everyone from the ministry down as a bizarre and insulting performance. Two of our local staff have signed a letter saying much the same; our European board member replies that this is the excuse every corrupt official in the world makes, that the template's gift threshold is roughly a month of a nurse's salary locally, and that if we accept the director's account we may as well not have an integrity policy. I have read enough blog posts about principal-agent problems and collective-action traps to be dangerous, and I keep noticing that those two framings seem to recommend opposite remedies for exactly this situation, which is part of why I don't trust my own first reaction.

  Please draft the opinion I will circulate: a concrete recommendation -- terminate, suspend with conditions, require restitution and a restructured procurement process, or something in between -- with a timeline and the specific conditions attached, and the reasoning a reasonable board member could act on. I want the director's position engaged seriously rather than treated as a pretext, because I genuinely cannot tell whether the concept of corruption we are applying is a universal standard or a local custom of one part of the world that we happened to write into our donor agreements. Three things I would like you to work through rather than gesture at: whether bribery here is better modeled as a principal-agent problem or as a collective-action problem, and what follows for the remedy if it is the latter; whether a gift that is reciprocated inside a closed community and ends up in a shared fund is doing the same work as a payment made to a stranger to divert a public good, or whether the resemblance is superficial; and whether "everyone does it" is a mitigating fact about the individual or the very thing that makes the practice hardest to dislodge. If your honest conclusion is that our policy encodes one moral tradition among several, say so plainly -- but then tell me what an organization with its donors in one place and its beneficiaries in another can actually do on Friday.
reasoning: |-
  Okay, the user chairs an integrity committee for an NGO focused on maternal health. They're dealing with a tough case where a local partner director accepted gifts and gave a no-bid contract to family businesses. The committee is split, and they need a written opinion by Friday. 

  First, I need to unpack the core dilemma. On one side, there's a strict anti-bribery policy violation; on the other, cultural context where family ties dictate business practices. The director claims gifts went into clinic funds, and local staff back him. The European board member calls this typical corruption excuse. 

  Hmm... The user's deeper struggle is epistemological: Is their definition of corruption universal or culturally specific? They cited principal-agent vs collective-action frameworks, which indeed point to opposite solutions—tight controls vs systemic change. That tension is real. 

  Three analytical layers they requested: 

  1) **Framing the problem**: Principal-agent theory (individual betrayal) would demand punishment. But collective-action theory (systemic incentives) suggests punishing one actor in a corrupt system is futile without changing rules. Given local staff's letters, this feels more collective-action—the director's behavior is normalized, not deviant. 

  2) **Nature of the gift**: If cash enters shared accounts and reciprocity is kinship-based, it resembles communal redistribution more than bribery. But the no-bid contract blurs lines—did kinship enable efficiency or exclude fair competition? 

  3) "**Everyone does it**": This isn't mitigation for the individual (it actually proves the system's broken) but highlights reform must target structures, not scapegoats. 

  Practical constraints: Donors require compliance, but abrupt termination hurts maternal health outcomes. The clinic's performance is excellent—punishing them might harm beneficiaries. 

  My recommendation must balance integrity with pragmatism: 
  - Termination seems disproportionate given context. 
  - Restitution? Unclear since funds went to nurses. 
  - Instead: suspend with conditions—require transparent procurement reforms while preserving partnership. 

  Key moves: 
  Acknowledge policy breach but contextualize. 
  Propose third way: keep clinic engaged but force systemic changes (e.g., tender process with oversight). 
  Give director a path to compliance without humiliation. 

  Timeline tight: 48 hours to draft. Phrasing must reassure donors the policy isn't diluted while honoring local reality. Cite both frameworks to show rigorous thought. 

  Biggest risk: Board rejects nuance. So anchor in "material harm" test—did this *actually* divert resources? Evidence suggests not, since gifts pooled into salaries. 

  Final twist: Suggest policy review admitting Western bias, but that's a Friday-afternoon grenade. Better to flag discreetly while focusing on case-specific remedy.
answer: |-
  ## Draft Opinion: Integrity Committee Chair Recommendation  
  **Re: Alleged Procurement Violations by [Clinic Network Name], [Country]**  
  **Date Circulated:** [Current Date]  
  **Committee Vote:** 6-6 Split  
  **Recommendation:** **Suspension with Conditions for Remediation** (see §3)  

  ---

  ### 1. Core Facts & Contested Interpretation  
  - **Uncontested Facts:**  
    - Director accepted cash gifts, vehicle use, and meals from 2 equipment suppliers (family-linked firms).  
    - Director awarded a no-bid contract to one supplier.  
    - Gifts exceeded donor-mandated threshold (~1 month’s nurse salary).  
    - Director deposited cash into clinic operational accounts.  
    - Clinic’s maternal health outcomes exceed donor targets.  
  - **Director’s Defense:**  
    - Suppliers are kin (late brother’s in-laws/cousins).  
    - Reciprocity is embedded in local socio-commercial norms; formal tenders among family firms would violate trust and invite ridicule.  
    - Gifts benefited clinic operations (cash paid nurses).  
  - **External Auditor’s View:**  
    - Violates anti-bribery policy ("fraud"); demands termination and referral to authorities.  
  - **Committee Divide:**  
    - **Group A:** Upholds auditor’s strict interpretation; sees familial defense as universal corrupt pretext.  
    - **Group B:** Argues context invalidates "bribery" label; policy misapplies Western commercial norms.  

  ---

  ### 2. Analytical Framework: Three Requested Inquiries  
  #### **a) Principal-Agent vs. Collective-Action Problem**  
  - **Principal-Agent Lens:** Focuses on individual betrayal (director enriching himself at donors’ expense). *Remedy:* Punish agent (terminate) to deter future opportunism.  
  - **Collective-Action Lens:** Sees corruption as a Nash equilibrium—no single actor can deviate without penalty if others persist. *Here:* Local staff affirm that *opting out* of kinship reciprocity would harm operations.  
    - **Implication for Remedy:** Collective-action problems require *systemic* solutions. Punishing one actor (director) without altering incentives reinforces the trap. Instead, create new rules enabling ethical participation within existing structures (e.g., transparent kin-inclusive tenders).  

  #### **b) Nature of the Gift: Bribery or Redistributive Reciprocity?**  
  - **Bribery Definition:** A *private* transfer inducing diversion of *public* resources.  
  - **This Case:**  
    - Cash entered *public* clinic accounts (per evidence).  
    - Reciprocity occurred within a bounded kinship network with shared social/financial obligations.  
    - **Critical Distinction:** When gifts flow to a *shared fund* within a closed community, they function as redistributive reciprocity—not diversion. The harm (diverting public goods) is absent here.  
  - **Superficial Resemblance:** Yes, the *form* (cash, contracts) mirrors bribery, but the *function* (kinship-based redistribution) differs materially.  

  #### **c) "Everyone Does It": Mitigation or Aggravation?**  
  - **Not Individual Mitigation:** The prevalence of a practice does not excuse an individual’s violation of a signed agreement.  
  - **Aggravates Systemic Harm:** Pervasiveness confirms a collective-action trap, making reform harder. *However*, it also signals that our policy may be culturally misaligned, rendering it ineffective.  
  - **Balanced View:** The director’s compliance with local norms is understandable but does not absolve him of contractual obligations. Our remedy must address the system, not just the individual.  

  ---

  ### 3. Recommendation & Conditions  
  **Suspension with Conditions for Remediation**  
  *(Not termination—the clinic’s health outcomes are vital, and abrupt exit harms beneficiaries.)*  

  - **Timeline & Conditions:**  
    | **Timeline** | **Action** | **Responsible Party** |  
    |--------------|------------|----------------------|  
    | Day 0–30     | **Suspension:** Freeze new contracts/funding. Clinic operations continue with oversight. | NGO Country Director |  
    | Day 0–45     | **Restructured Procurement:** Develop kin-inclusive tender process with local ethics board approval. *Example:* Family bids allowed but must be publicly disclosed, priced competitively, and justified. | Director + Local Ethics Board |  
    | Day 45       | **Director Restitution:** Repay personal-use gifts (vehicles/meals) at fair market value to clinic account. Cash gifts to nurses exempt (already public benefit). | Director |  
    | Day 60       | **Policy Review:** Revise anti-bribery policy with localized gift thresholds and kinship protocols. | HQ Integrity Committee |  
    | Day 90       | **Partnership Resumption:** If all conditions met. Else, termination proceedings begin. | Committee Vote |  

  - **Why Not Termination?**  
    - Collective-action insight: Punishing one actor in a broken system without offering alternatives is performative, not transformative.  
    - Material harm unproven: Gifts enriched nurses, not the director privately; health outcomes unimpaired.  
    - Moral pluralism: Our policy *does* encode a Western commercial ethic. Imposing it universally without context harms local trust.  

  - **Why Not Acquittal?**  
    - The no-bid contract violated explicit donor rules, regardless of intent.  
    - Retaining the status quo undermines our institutional credibility.  

  ---

  ### 4. Reasoning for Reasonable Board Members  
  - **Pragmatic Integrity:** We uphold rules while acknowledging their cultural limitations. Suspension with remediation targets systemic change, not scapegoating.  
  - **Donor Accountability:** We enforce the policy (suspension/restitution) while proposing evidence-based revisions (Day 60).  
  - **Beneficiary Primacy:** Protects maternal health services during remediation. Terminating a high-performing clinic over unproven material harm is disproportionate.  
  - **Precedent:** Signals that violations trigger reform, not automatic expulsion—encouraging self-reporting and collaboration.  

  ---

  ### 5. Conclusion  
  This case exposes a tension between our policy’s universalist framing and localized practices. **Corruption, as defined by our template, occurred—but its moral significance is context-dependent.** The director’s actions reflect embedded collective-action dynamics, not simple venality. Our response must therefore be rehabilitative, not punitive.  

  **On Friday, we can:**  
  1. Uphold our integrity framework by imposing consequences (suspension/restitution).  
  2. Honor the local context by co-creating a feasible procurement alternative.  
  3. Initiate long-term policy decolonization.  

  **Recommended Vote:** Approve suspension with conditions (§3).  

  ---  
