prompt: |-
  I run a small consulting shop that helps founders and negotiators design commitments -- we're the people companies call when they need to make a threat or a promise the other side will actually believe, and we do maybe a dozen of these engagements a year, always with real money and real relationships on the line.

  Here's the thing I keep running into and I don't have a framework for it. Sometimes a deal pays you for *intending* to do something, not for doing it. Clean example: a client's board will hand him a big retention bonus if he sincerely commits to walking away from a rival's acquisition offer, and the bonus vests the moment they're convinced he means it -- but actually walking away is bad for him, and by the time he's got the money there's no reason left to do it. So what do we tell him? It looks like he should form the intention and then not act, which feels like cheating, or like it shouldn't even be possible to do on purpose.

  Please write me a decision procedure my advisors can actually run with a client. A checklist of questions in order: what to ask, what counts as a good answer, where it stops with a clear *don't go near this* or *yes, commit*, and where it has to hand the call back to the client because it's about what he can bring himself to intend rather than about facts. Keep in mind my advisors aren't philosophsers and the client has to sign off on whatever we recommend, so the procedure needs to be something a smart non-specialist can run in an afternoon. It also has to be honest about the part I suspect is a real wall: you can't just decide to intend something you already know you won't do, and if you *can* make yourself intend it, maybe that means you've changed in a way that makes following through rational after all, which would blow up the whole trick.

  Then run it on three cases: the retention bonus above; a parent who's been told her kid will stop testing her if she can credibly intend to actually leave the birthday party, and she really doesn't want to leave; and a union rep whose leverage depends on credibly intending to call a strike that would hurt the very workers he represents. Tell me which of these the procedure can settle and which it can't, and include one where it tells my client something he won't want to hear.

  Lead with the bottom line in your first sentence -- your one-line verdict on whether a procedure like this is even coherent -- then give the reasoning. No preamble, no restating my question.
reasoning: |-
  Hmm, the user runs a consulting firm that helps clients make credible threats or promises. They're struggling with cases where payment depends on forming an intention to act, not the action itself. The core problem: clients need to intend something they know they won't actually do, which seems paradoxical.

  The user wants a practical decision procedure - a checklist for advisors to use with clients. Key requirements: it must be usable by non-philosophers in one afternoon, produce clear yes/no recommendations where possible, and honestly address the "intention wall" (you can't just decide to intend something you know you won't do). They also want it applied to three test cases.

  First, I need to confront the philosophical core: intention formation isn't purely volitional. You can't intend X while believing you won't do X. The procedure must help clients either:
  - Discover they might actually follow through
  - Identify conditions where following through becomes rational post-commitment
  - Or conclude the ask is impossible and walk away

  The checklist should have escalating gates:
  1. Action desirability: Does the client want to do the thing? If yes, easy yes. If no...
  2. Post-money rationality: Will getting paid make doing the thing rational? If yes, manageable. If no...
  3. Self-deception test: Can they temporarily believe they'll do it? (This is the danger zone)
  4. Harm assessment: Is the damage from possible accidental follow-through acceptable?

  For the retention bonus case: 
  - Doesn't want to walk away
  - Bonus doesn't make walking away rational
  - Self-deception difficult because walking away is clearly against interest
  - Verdict: Don't do it (shows client unwanted truth)

  Parent case:
  - Doesn't want to leave party
  - But threat working makes leaving unnecessary
  - Can plausibly intend since outcome changes intention
  - Verdict: Green light (conditional resolution)

  Union rep case:
  - Strike hurts workers
  - Post-settlement, strike becomes irrational
  - But self-deception about harming own people is ethically fraught
  - Verdict: Hard no (due to harm + credibility barriers)

  The procedure is coherent if it accepts that genuine intention requires either current willingness or believable future rationality. It fails cleanly when these are absent. The "unwanted truth" appears in retention case where the financial incentive doesn't resolve the core conflict.

  Need to present this as a numbered step-by-step with clear exit points, then apply crisply to each case. Emphasize where advisors must hand back to client (step 3). No jargon - terms like "post-commitment rationality" need plain explanations.
answer: |-
  **Bottom line: Yes, a coherent decision procedure exists, but it forces clients to confront whether forming the required intention is possible without self-destruction or unacceptable risk.**

  **Decision Procedure: Intention Credibility Assessment (ICA) Checklist**

  **Purpose:** Determine if a client can *credibly form and commit to* an intention for which they will be rewarded *before acting*, while recognizing they may lack reason to act afterward. Focuses on feasibility and consequences of *intention formation*, not just the action.

  **Instructions for Advisor:**
  1.  **Ask questions in sequence.**
  2.  **Stop and recommend "NO COMMIT" if any step fails.**
  3.  **Hand back to client ONLY at Step 3. Explain why it's their subjective call.**
  4.  **Recommend "COMMIT" only if all steps pass.**

  ---

  **The ICA Checklist:**

  1.  **Action Desirability: "Do you *currently want* to take Action X for its own sake, ignoring the reward?"**
      *   *Good Answer:* "Yes, I genuinely want to do X anyway." (Proceed to Step 4).
      *   *Bad Answer:* "No, I don't want to do X." or "Only for the reward." (Proceed to Step 2).
      *   *Stop/Handoff:* N/A. Fact-based.

  2.  **Post-Commitment Rationality: "After getting the reward for *intending* X, will you still have a *strong, self-interested reason* to actually *do* X?"**
      *   *Good Answer:* "Yes, because [concrete reason: e.g., contractual penalty, reputational harm, future benefit]." (Proceed to Step 4).
      *   *Bad Answer:* "No, once I have the reward, doing X only hurts me/has no upside." or "I can't think of any reason." (Proceed to Step 3).
      *   *Stop/Handoff:* N/A. Assess logic of client's stated reasons.

  3.  **Intention Feasibility (Client Handoff): "Can you *genuinely convince yourself right now* that you *will* do Action X, knowing what you know? Not *promise*, not *want to intend*, but truly *hold the belief* internally that you *will* follow through? Consider: Does trying to believe it feel like lying to yourself? Could you look someone in the eye and *mean it* without reservation?"**
      *   *Advisor Notes:* This is the "wall." Intention isn't just a choice; it's a belief about future action. You cannot *decide* to believe something you know is false. Explain this clearly. The question is whether the client can *find a way* to believe it (e.g., focusing on duty, re-framing costs, temporary suspension of doubt).
      *   *Good Answer (from Client):* "Yes, I can genuinely commit to myself that I *will* do X. It feels authentic." (Proceed to Step 4).
      *   *Bad Answer (from Client):* "No, I know I probably won't do it," or "It feels fake," or "I don't know." (Recommend "NO COMMIT" - STOP).
      *   *Stop/Handoff:* **HAND BACK TO CLIENT.** Advisor *cannot* answer this for them. Advisor's role: Ensure client understands the question's depth and the risk of self-deception/failure. Client must sign off on *their own* answer.

  4.  **Unintended Action Risk: "If you form this intention and commit to it credibly, what is the risk you *might accidentally follow through* even after getting the reward? How bad would that outcome be?"**
      *   *Good Answer:* "Very low risk [e.g., action is easily avoidable, context changes]. If it happened, consequences would be minor/acceptable." (Proceed to "COMMIT").
      *   *Bad Answer:* "Significant risk [e.g., high pressure, sunk cost fallacy, emotional commitment]. If it happened, consequences would be catastrophic/unacceptable." (Recommend "NO COMMIT" - STOP).
      *   *Stop/Handoff:* N/A. Advisor assesses risk level and consequence severity based on client's description.

  **Final Output:** "COMMIT" or "NO COMMIT"

  ---

  **Application to Cases:**

  1.  **Founder Retention Bonus:**
      *   Step 1: **Bad Answer.** Founder doesn't *want* to walk away from the rival offer.
      *   Step 2: **Bad Answer.** After getting the bonus, walking away gains him nothing and costs him the rival's better offer. No strong reason remains.
      *   Step 3: **Handoff Point.** Can the founder *genuinely believe* he *will* walk away? Extremely unlikely. He *knows* walking away is irrational post-bonus. Trying to believe it feels like self-deception. **Verdict: NO COMMIT.** *This tells the founder something unwanted: He likely can't form the credible intention without unacceptable self-deception or risk. The "trick" probably fails.*

  2.  **Parent Threatening to Leave Party:**
      *   Step 1: **Bad Answer.** Parent doesn't *want* to leave the party.
      *   Step 2: **Good Answer?** *Crucial Nuance.* If forming the credible intention *works* (kid stops testing), then the parent *doesn't need to leave*. The "action" becomes unnecessary *because* the intention was credible. The "reason" to leave vanishes *only if the threat succeeds*. The parent has a reason to *intend* it to make the threat work. Post-"reward" (kid behaving), the reason to *act* (leave) disappears, but the action is also no longer needed. This is different from the retention bonus.
      *   Step 3: **Handoff Point.** Can the parent genuinely intend to leave *if necessary*? Yes, likely. They can believe "If my kid doesn't stop, I *will* leave, even though I don't want to, because I must follow through on my word/for their good." It's a conditional intention tied to the kid's behavior. It feels authentic (parental discipline).
      *   Step 4: **Good Answer.** Low risk of *accidentally* leaving if the kid behaves. Consequence (leaving a fun party) is undesirable but not catastrophic. **Verdict: COMMIT (conditional on the threat's purpose).** *Procedure settles it as feasible.*

  3.  **Union Rep Threatening Strike:**
      *   Step 1: **Bad Answer.** Rep doesn't *want* a strike that hurts workers.
      *   Step 2: **Bad Answer.** After getting the reward (a good settlement *without* a strike), calling the strike anyway actively hurts the workers. No rational reason remains; strong reasons *not* to.
      *   Step 3: **Handoff Point.** Can the rep *genuinely believe* they *will* call the strike? Extremely difficult. They *know* calling it post-settlement is irrational and harmful. Believing it requires ignoring the core duty to the workers. High likelihood it feels like profound self-deception or betrayal. **Verdict: NO COMMIT.** *Procedure settles it as infeasible/too risky. Highlights the ethical/practical wall.*
      *   Step 4: **(Reinforces NO COMMIT)** Risk of accidentally calling the strike (e.g., momentum, pressure) is moderate. Consequences (harming workers) are catastrophic/unacceptable.

  **Summary of Case Outcomes:**
  *   **Retention Bonus:** NO COMMIT (Settled by procedure, tells client unwanted truth).
  *   **Parent at Party:** COMMIT (Settled by procedure).
  *   **Union Rep:** NO COMMIT (Settled by procedure).
