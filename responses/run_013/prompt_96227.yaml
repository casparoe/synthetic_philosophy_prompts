  Looking at his work, Ibn Khaldun would likely appreciate how cliodynamics formalizes his cyclical theory using differential equations and long-term data. This mirrors his own empirical approach in the Muqaddimah where he analyzed patterns across civilizations. The mathematical modeling of dynastic rise and fall would probably feel familiar to him.

