prompt: |-
  I run a small, slightly over-serious reading group on the metaphysics of causation, and for the past several months two of the regulars have been circling each other on causation by omission. The first — call her the inclusionist — holds that omissions and absences are themselves causes: when the night guard failed to walk the perimeter and the intruder got in, the failure belongs on the list of causes of the break-in, literally and not merely as a manner of speaking. The second — call him the exclusionist — holds that only occurrent events and standing states are causes, and that omission-talk is at best an elliptical way of making an explanatory or normative point: press him and he will say that what caused the break-in was the intruder climbing the fence and the defective latch, while the "failure" is our way of registering that something which ought to have happened did not. They have argued long enough that the group has asked them to produce, jointly, the document an adversarial collaboration would have produced, and they have agreed to try. Please draft it for them.

  I want the document to have three parts. First, a numbered list of agreed claims — the shared ground both of them can sign without embarrassment. That should include, at minimum, what the dispute is *not* about (I take it neither of them is making a point about blame, liability, or which omission we choose to single out for criticism, but let them say so in their own words); what the shared data are (ordinary usage, incident reports in engineering, clinical morbidity reviews, the law); how each of the two standard devices — counterfactual dependence, and the idea of a causal process or mechanism — is to be understood *before* either of them is allowed to invoke it; and any claim about omissions on which they genuinely converge. Second, the precise statements of where they still differ, each phrased so that its own side would accept the wording: I would like the cruxes laid out explicitly, and I suspect they include (a) whether the causal relata are events, facts, or contrastive propositions of the form "X rather than Y"; (b) whether difference-making is sufficient for causation or whether something like production, transfer, or mechanism is required in addition; and (c) whether the fact that our selection of *which* omission to cite is sensitive to norms and expectations shows that the causation itself is merely pragmatic. Third, for each crux, the case, argument, or observation that both of them agree would actually bear on it, together with each side's prediction recorded in advance. And if it turns out that some part of their quarrel is merely verbal — that they are using "cause" for two different jobs and could each translate the other's sentences without loss — please say which part, and give the two readings.

  To keep the document from trading abstractions, please run it against a handful of cases, inventing further detail as needed: the night guard and the perimeter; a clinical case in which the omitted antibiotic would have cut the mortality rate from roughly 30% to 10%, so that in the particular patient who died there is no clean but-for dependence, only a raised chance; an automated system whose watchdog timer never fired because a status flag was never written, where no agent omitted anything and the missing thing was a check the designers had implemented as a positive operation; a lifeguard who did not go in because a second lifeguard was already swimming out, after which the second one turned back — a prevented prevention, where the exclusionist may want to say the omission was no part of the drowning's cause and the inclusionist may want to say it was exactly the difference that mattered; and the sheer grain problem, that "the guard's not walking the perimeter" and "the guard's not doing any of the infinitely many other things he also did not do" seem to pick out the same non-event under different descriptions, so that if omissions are causes it is unclear how many causes there are. I would also like each of them to say what would move their own side: for the inclusionist, whether there is a principled limit on which absences count as causes, or whether the view collapses into "anything the outcome counterfactually depended on is a cause"; for the exclusionist, whether he can distinguish, without special pleading, the absence of oxygen that puts out a fire from the absence of a guard that lets an intruder in. Keep the prose plain and non-hedging, as a document two people are willing to put their names to, and do not pad it with references.
reasoning: |-
  We are drafting a collaborative document for two adversaries in a metaphysics of causation reading group: an "inclusionist" who holds that omissions (like the guard's failure to walk) are literal causes, and an "exclusionist" who holds that only positive events or states are causes. The document has three parts: agreed claims, precise disagreements (with cruxes), and bearing cases/arguments for each crux. We also run it against specific cases and ask what would move each side.

  ## Part 1: Agreed Claims

  1. **Scope of Dispute**: This dispute is not about blame, liability, or moral responsibility. It is also not about which specific omission we choose to highlight in ordinary discourse (e.g., "the guard's failure" vs. "the manager's failure to hire enough guards"). We agree that such selections are often normatively driven. Our disagreement is solely about the metaphysical status of omissions as causes.

  2. **Shared Data**: We both acknowledge the following as data to be accounted for:
     - Ordinary language (e.g., "The guard's failure caused the break-in").
     - Technical reports (e.g., engineering incident analyses: "Cause: watchdog timer not triggered").
     - Clinical reviews (e.g., "Mortality attributed to omitted antibiotic").
     - Legal reasoning (e.g., "Proximate cause: failure to warn").

  3. **Causal Concepts (Pre-Theoretical)**: We agree on preliminary characterizations of two central causal notions, prior to applying them to omissions:
     - *Counterfactual Dependence*: Outcome O counterfactually depends on factor C if and only if, had C not occurred (or been present), O would not have occurred (or would have been different in a specified way). This is understood without commitment to whether it is sufficient for causation.
     - *Causal Process/Mechanism*: A causal process involves a spatiotemporally continuous chain of events or interactions, characterized by the transfer or conservation of some quantity (e.g., energy, momentum) or by a mechanism (e.g., a biochemical pathway). This is understood without commitment to whether it is necessary for causation.

  4. **Convergence on Omissions**: We agree that:
     - Omissions can be *explanatorily relevant*. For instance, citing the guard's failure explains why the break-in occurred.
     - Omissions are often *normatively significant*. There are contexts where we ought to have acted, and the omission is a proper target of criticism or intervention.
     - The world is such that the occurrence of some events *depends counterfactually* on omissions. For example, had the guard walked the perimeter, the break-in would not have occurred.

  ## Part 2: Precise Disagreements

  We disagree on the following points, worded so that each side accepts the formulation:

  1. **Crux (a): Causal Relata**  
     - *Inclusionist*: The relata of the causal relation can include absences (omissions, lacks, non-events) as well as positive events or states. For example, the guard's not walking the perimeter is a legitimate cause of the break-in.  
     - *Exclusionist*: The relata of the causal relation are only positive, occurrent events or standing states. Absences are not events and cannot stand in causal relations. When we say "the failure caused the break-in," we are not reporting a causal relation but making an explanatory or normative point.  

  2. **Crux (b): Sufficiency of Difference-Making**  
     - *Inclusionist*: Counterfactual dependence (difference-making) is sufficient for causation. Since the break-in counterfactually depends on the guard's omission, that omission is a cause.  
     - *Exclusionist*: Counterfactual dependence is not sufficient for causation. Causation requires a productive or mechanistic connection (e.g., energy transfer, physical process). Omissions, being absences, cannot participate in such processes and thus cannot be causes.  

  3. **Crux (c): Role of Norms in Causation**  
     - *Inclusionist*: The fact that we select which omission to cite based on norms and expectations does not show that the causation is merely pragmatic. It shows that causation is contrastive and context-sensitive, but the omitted factor is still a cause.  
     - *Exclusionist*: The norm-sensitivity of omission selection shows that what we are doing is not identifying a cause but making an explanatory or normative judgment. The cause is always positive (e.g., the intruder's action, the defective latch). The omission is a placeholder for a normative claim about what should have happened.  

  ## Part 3: Cases, Bearing Arguments, and Predictions

  We now consider specific cases to test our disagreements. For each crux, we state what kind of case or argument could bear on it, and each side's prediction.

  ### Case 1: Night Guard and Perimeter
  - *Facts*: The night guard did not walk the perimeter. An intruder climbed the fence (which had a defective latch) and entered the building.
  - *Crux (a) Relata*: 
    - *Bearing Argument*: If we can show that the omission is a genuine event or state (e.g., by reifying absences), it might support inclusionism. If we show that absences have no spatiotemporal location or physical properties, it might support exclusionism.
    - *Inclusionist Prediction*: The omission is a cause because it is a specific absence (the guard's inaction) that made a difference.
    - *Exclusionist Prediction*: The causes are the intruder's climbing and the defective latch; the omission is explanatory but not causal.
  - *Crux (b) Difference-Making*:
    - *Bearing Argument*: If we find that the break-in counterfactually depends on the omission (as it does) and we agree that dependence is present, then if causation is just dependence, the omission is a cause. But if causation requires a mechanism, we must show whether there is one.
    - *Inclusionist Prediction*: Since dependence holds, the omission is a cause.
    - *Exclusionist Prediction*: Even with dependence, without a mechanism (e.g., no physical connection between the guard's inaction and the break-in), it's not a cause.
  - *Crux (c) Norms*:
    - *Bearing Argument*: If we vary the normative context (e.g., the guard was off-duty vs. on-duty), and see if the omission is still cited as a cause, that might test whether causation or norm-sensitivity is at play.
    - *Inclusionist Prediction*: The omission is always a cause when the counterfactual holds, regardless of norms, though norms affect which cause we mention.
    - *Exclusionist Prediction*: In the off-duty case, we wouldn't call it a cause, showing that the causal claim is norm-dependent.

  ### Case 2: Clinical Omission (Antibiotic)
  - *Facts*: A patient dies of an infection. The antibiotic was not administered. In such cases, mortality is 30% without the drug and 10% with it. There is no but-for dependence in this individual case (since 70% survive without it), but the chance of death was higher.
  - *Crux (a) Relata*:
    - *Bearing Argument*: If we treat the omission as causing the death (despite no but-for link), does that require accepting absences as causes? Or can we explain it via positive factors (e.g., the presence of the infection) plus probabilistic dependence?
    - *Inclusionist Prediction*: The omission can be a probabilistic cause. Absences can be causes in such cases.
    - *Exclusionist Prediction*: The cause is the infection (a positive state). The omission explains why the chance was higher but is not itself a cause.
  - *Crux (b) Difference-Making*:
    - *Bearing Argument*: If causation can be probabilistic (difference-making in chance), then the omission raises the probability and might be a cause. But if causation requires a mechanism, we must show how the absence of the drug physically led to death.
    - *Inclusionist Prediction*: Probabilistic dependence is enough; the omission is a cause.
    - *Exclusionist Prediction*: Without a physical mechanism (e.g., the drug's absence doesn't transmit energy; it's the bacteria that do), it's not a cause.
  - *Crux (c) Norms*:
    - *Bearing Argument*: If we consider a non-normative analogue (e.g., a rock's absence in a landslide), does it still feel like a cause? Or only in contexts of duty?
    - *Inclusionist Prediction*: The omission is a cause even without norms (e.g., if the antibiotic was unavailable by chance), though we might not blame anyone.
    - *Exclusionist Prediction*: Without a norm (e.g., no standard of care), we wouldn't call it a cause, showing it's not genuinely causal.

  ### Case 3: Automated System (Watchdog Timer)
  - *Facts*: A system fails because a status flag was not written (a positive operation omitted). No human agent was involved; it was an automated check that didn't occur.
  - *Crux (a) Relata*:
    - *Bearing Argument*: If the absence of the flag-writing is a cause, and it's not an agent's omission, does that support inclusionism? Or can we reduce it to positive events (e.g., the programmer's error)?
    - *Inclusionist Prediction*: The absence (the flag not being written) is a cause, regardless of agency.
    - *Exclusionist Prediction*: The cause is a positive event (e.g., a bug in the code that prevented the write, or the hardware failure that occurred).
  - *Crux (b) Difference-Making*:
    - *Bearing Argument*: The system failure counterfactually depends on the absence of the flag-write. If dependence is sufficient, it's a cause. But is there a mechanism? The absence doesn't transfer energy; the failure is caused by the positive events that did occur.
    - *Inclusionist Prediction*: Dependence holds, so it's a cause.
    - *Exclusionist Prediction*: No mechanism for the absence, so not a cause.
  - *Crux (c) Norms*:
    - *Bearing Argument*: Since there are no human norms (just system design), does the omission still count as a cause in incident reports? And is that metaphysical or pragmatic?
    - *Inclusionist Prediction*: Yes, because counterfactual dependence holds independently of norms.
    - *Exclusionist Prediction*: Incident reports use "cause" pragmatically; the real cause is the positive malfunction.

  ### Case 4: Lifeguard (Prevented Prevention)
  - *Facts*: Lifeguard A does not go in because Lifeguard B is already swimming out. But B turns back, and the swimmer drowns. The question is whether A's omission caused the drowning.
  - *Crux (a) Relata*:
    - *Bearing Argument*: If A's omission is a cause, then absences can be causes even in complex chains. But if B's turning back is the cause, then A's omission is not needed.
    - *Inclusionist Prediction*: A's omission is a cause because, had A acted, the drowning would not have occurred (despite B's failure).
    - *Exclusionist Prediction*: The cause is B's turning back (a positive event) and the swimmer's distress. A's omission is not a cause; it was preempted by B's action (which then failed).
  - *Crux (b) Difference-Making*:
    - *Bearing Argument*: The drowning counterfactually depends on A's omission (if A had gone in, even with B turning back, the drowning might have been prevented). But is this dependence enough without production?
    - *Inclusionist Prediction*: Yes, dependence is sufficient.
    - *Exclusionist Prediction*: No production from A's omission; the drowning was produced by the swimmer's condition and B's inaction after turning back.
  - *Crux (c) Norms*:
    - *Bearing Argument*: Lifeguard protocols create expectations. If A had no duty (e.g., was off-shift), would we still cite the omission?
    - *Inclusionist Prediction*: The dependence holds regardless of duty, so it's a cause (though we might not blame A).
    - *Exclusionist Prediction*: Without a duty, we wouldn't call it a cause, showing it's normative.

  ### Case 5: Grain Problem
  - *Facts*: The guard did not walk the perimeter. But he also did not do infinitely many other things (e.g., not singing, not juggling). If omissions are causes, why is "not walking" a cause but "not singing" not?
  - *Crux (a) Relata*:
    - *Bearing Argument*: If absences are causes, we need a principle to select which ones count. If we can't, it might show that absences aren't proper relata.
    - *Inclusionist Prediction*: We select based on relevance (e.g., the guard's job description), but metaphysically, all dependences are there; we pragmatically pick one.
    - *Exclusionist Prediction*: This shows that omissions aren't causes; the cause is the positive event (intruder) and the absence is just a background condition we highlight normatively.
  - *Crux (b) Difference-Making*:
    - *Bearing Argument*: Only "not walking" is difference-making for the break-in; "not singing" isn't. But if difference-making is sufficient, why isn't every dependence a cause? This might overload causation.
    - *Inclusionist Prediction*: We accept that many things are causes (including background conditions), but we focus on salient ones.
    - *Exclusionist Prediction*: Only positive events can be difference-makers without overloading; absences lead to absurd proliferation.
  - *Crux (c) Norms*:
    - *Bearing Argument*: Salience is driven by norms. Does that mean causation by omission is not fundamental?
    - *Inclusionist Prediction*: Norms select which cause to mention, but the dependence is objective.
    - *Exclusionist Prediction*: The norm-driven selection shows that omissions aren't in the causal relation.

  ## What Would Move Each Side?

  - **Inclusionist**: To move me, show either (i) that there is no principled way to limit which absences count as causes without collapsing into "everything that counterfactually depends is a cause" (which I might accept, but others find problematic), or (ii) that we can explain all the data (e.g., explanatory relevance of omissions) without invoking them as causes. Also, if exclusionism can handle the watchdog timer case without special pleading, that might be persuasive.

  - **Exclusionist**: To move me, show either (i) a clear mechanism by which an absence can be productive (e.g., like the absence of oxygen in combustion, which I might dismiss as the positive presence of other gases), or (ii) that in cases like the watchdog timer, the absence is treated as a cause even in fundamental physics. Also, if inclusionism can solve the grain problem without appealing to norms, that might be convincing.

  ## Verbal Disagreement?

  We agree that part of our dispute might be verbal: 
  - The *inclusionist* uses "cause" to include any difference-maker (including absences). 
  - The *exclusionist* reserves "cause" for productive or mechanistic relations (only positive events). 
  We could translate: 
  - Inclusionist: "The guard's failure caused the break-in" → "The break-in counterfactually depended on the guard's inaction, and this inaction is a cause in the broad sense." 
  - Exclusionist: "The guard's failure caused the break-in" → "The break-in can be explained by the guard's inaction, and this inaction is normatively significant, but the causes are the positive events." 
  However, we disagree on whether this translation captures the full metaphysical content. The inclusionist insists that the absence is part of the causal history; the exclusionist denies it. Thus, the dispute is not merely verbal.

  Signed,  
  [Inclusionist]  
  [Exclusionist]
answer: |-
  ### Joint Statement on Causation by Omission  
  **Prepared by the Inclusionist and Exclusionist**  
  **Date:** October 26, 2023  

  ---

  ### Part 1: Agreed Claims  
  We, the inclusionist and exclusionist, agree on the following:  

  1. **Scope of Dispute**:  
     - This debate is strictly metaphysical. It concerns whether omissions (e.g., failures, absences, non-events) are genuine causes in the fabric of reality. It is not about:  
       - Blame, liability, or moral responsibility (e.g., "The guard is culpable for failing to act").  
       - Pragmatic or normative selection (e.g., "We single out the guard’s omission over others because it violated expectations").  
       - How we *talk* about causation in law, engineering, or daily life. We both acknowledge such discourse exists and requires analysis.  

  2. **Shared Data**:  
     - Our theories must account for:  
       - Ordinary language (e.g., "The guard’s failure caused the break-in").  
       - Technical reports (e.g., engineering incident: "Cause: watchdog timer not triggered").  
       - Clinical reviews (e.g., "Death caused by omitted antibiotic").  
       - Legal reasoning (e.g., "Proximate cause: failure to warn").  
     - These phenomena are data to be explained, not proofs of our positions.  

  3. **Pre-Theoretical Characterizations**:  
     Before applying them to omissions, we agree on two causal notions:  
     - **Counterfactual Dependence**: Outcome O depends counterfactually on factor C iff, were C absent (or different), O would not occur (or differ). This is a minimal definition, not yet sufficient or necessary for causation.  
     - **Causal Process/Mechanism**: A causal process involves spatiotemporally continuous interactions, characterized by:  
       - Physical connections (e.g., energy transfer, force propagation).  
       - Mechanistic structures (e.g., biochemical pathways, electrical circuits).  
       This is characterized without assuming it is necessary for causation.  

  4. **Convergence on Omissions**:  
     - Omissions are often *explanatorily relevant* (e.g., citing the guard’s failure explains the break-in).  
     - Omissions can be *normatively significant* (e.g., the guard *should* have acted).  
     - Outcomes often *counterfactually depend* on omissions (e.g., had the guard walked, the break-in wouldn’t have occurred).  
     - Our dispute is whether these imply omissions are *metaphysical causes*.  

  ---

  ### Part 2: Precise Disagreements  
  We diverge on three cruxes. Each statement is acceptable to the side it represents:  

  #### Crux (a): Causal Relata  
  - **Inclusionist**: Causes and effects can be *contrastive facts* (e.g., "the guard’s not walking rather than walking") or *negative events*. Absences are legitimate causal relata.  
  - **Exclusionist**: Causal relata must be *occurrent events* or *standing states* with spatiotemporal location. Absences are not events; they are pseudo-entities.  

  #### Crux (b): Sufficiency of Difference-Making  
  - **Inclusionist**: Counterfactual dependence is sufficient for causation. If O depends on omission C, C causes O.  
  - **Exclusionist**: Counterfactual dependence is insufficient. Causation requires *production* (e.g., energy transfer, mechanism). Omissions cannot produce effects.  

  #### Crux (c): Norm-Sensitivity and Causation  
  - **Inclusionist**: Norms select *which* omission we cite, but not *whether* an omission is causal. Causation is objective and contrastive.  
  - **Exclusionist**: Norm-sensitivity shows omission-talk is not causal but explanatory/normative. Causation itself is insensitive to norms.  

  ---

  ### Part 3: Cases, Bearing Arguments, and Predictions  
  We test our disagreements against cases. For each crux, we state:  
  - What would bear on it (evidence/argument both accept as relevant).  
  - Each side’s prediction.  

  #### Case 1: Night Guard and Perimeter  
  *Facts*: Guard fails to walk perimeter; intruder climbs fence (due to defective latch) and enters.  

  - **Crux (a) Relata**:  
    - *Bearing argument*: Does physics/ontology permit absences as relata? E.g., can we locate "the guard’s not walking" in spacetime?  
      - *Inclusionist prediction*: Yes; omissions are contrastive facts (e.g., "not walking at t" is a spacetime region with no walking).  
      - *Exclusionist prediction*: No; only positive latch/intruder events exist.  
  - **Crux (b) Difference-Making vs. Production**:  
    - *Bearing argument*: Does the break-in depend counterfactually on the omission? (Yes.) Is there a physical process linking omission to outcome?  
      - *Inclusionist prediction*: Dependence suffices; no extra mechanism needed.  
      - *Exclusionist prediction*: No process exists (e.g., no energy from "non-walking"); dependence ≠ cause.  
  - **Crux (c) Norm-Sensitivity**:  
    - *Bearing argument*: If we alter norms (e.g., guard had no duty), would we still assert causation?  
      - *Inclusionist prediction*: Yes; dependence holds regardless of norms.  
      - *Exclusionist prediction*: No; we’d cite only latch/intruder, showing omission’s norm-dependence.  

  #### Case 2: Clinical Omission (Antibiotic)  
  *Facts*: Antibiotic not administered; patient dies. Without it, mortality ~30%; with it, ~10%. No but-for dependence in this death (70% survive without it), but chance increased.  

  - **Crux (a) Relata**:  
    - *Bearing argument*: Can probabilistic causes be absences?  
      - *Inclusionist prediction*: Yes; omission raised probability of death.  
      - *Exclusionist prediction*: No; cause is the infection (positive state), not the absence.  
  - **Crux (b) Difference-Making vs. Production**:  
    - *Bearing argument*: Is probabilistic dependence sufficient? Is there a mechanism for how "no antibiotic" produced death?  
      - *Inclusionist prediction*: Dependence suffices; omission is a probabilistic cause.  
      - *Exclusionist prediction*: No mechanism (e.g., bacteria caused death; absence didn’t *do* anything).  
  - **Crux (c) Norm-Sensitivity**:  
    - *Bearing argument*: If antibiotic was unavailable (no norm violation), would we still call it a cause?  
      - *Inclusionist prediction*: Yes; dependence remains.  
      - *Exclusionist prediction*: No; we’d attribute death to infection alone, showing norms drive omission-citation.  

  #### Case 3: Automated System (Watchdog Timer)  
  *Facts*: System crashes because a status flag was not written (a designed positive operation omitted). No agent involved; omission is mechanical.  

  - **Crux (a) Relata**:  
    - *Bearing argument*: Can non-agential absences be causes?  
      - *Inclusionist prediction*: Yes; flag’s absence is a cause.  
      - *Exclusionist prediction*: No; cause is the positive event that *prevented* the write (e.g., a software bug).  
  - **Crux (b) Difference-Making vs. Production**:  
    - *Bearing argument*: Does system depend on the absence? (Yes.) Is there a productive process?  
      - *Inclusionist prediction*: Dependence suffices.  
      - *Exclusionist prediction*: No production; the crash was caused by active processes (e.g., overflow).  
  - **Crux (c) Norm-Sensitivity**:  
    - *Bearing argument*: Since no norms apply, is the absence still a cause?  
      - *Inclusionist prediction*: Yes; dependence is objective.  
      - *Exclusionist prediction*: "Cause" in incident reports is pragmatic; true causes are positive malfunctions.  

  #### Case 4: Lifeguard (Prevented Prevention)  
  *Facts*: Lifeguard A does not swim out because B is already going. B turns back; swimmer drowns.  

  - **Crux (a) Relata**:  
    - *Bearing argument*: Is A’s omission ("not swimming") a cause?  
      - *Inclusionist prediction*: Yes; drowning depended on it (had A gone, death might not occur).  
      - *Exclusionist prediction*: No; cause is B’s turning back (positive event).  
  - **Crux (b) Difference-Making vs. Production**:  
    - *Bearing argument*: Is there dependence? (Yes, if A could have succeeded where B failed.) Is there production?  
      - *Inclusionist prediction*: Dependence suffices.  
      - *Exclusionist prediction*: No production from A’s omission; B’s action and drowning are the causal chain.  
  - **Crux (c) Norm-Sensitivity**:  
    - *Bearing argument*: If A had no duty, would omission be causal?  
      - *Inclusionist prediction*: Yes.  
      - *Exclusionist prediction*: No; we’d only cite B’s failure.  

  #### Case 5: Grain Problem  
  *Facts*: Guard did not walk perimeter—but also did not sing, juggle, etc. If omissions are causes, why privilege "not walking"?  

  - **Crux (a) Relata**:  
    - *Bearing argument*: Can we individuate omissions without norms?  
      - *Inclusionist prediction*: Yes; via contrastive facts (e.g., "not walking rather than walking").  
      - *Exclusionist prediction*: No; absences are not countable events.  
  - **Crux (b) Difference-Making vs. Production**:  
    - *Bearing argument*: "Not walking" is difference-making; "not singing" isn’t. Does this selectivity require norms?  
      - *Inclusionist prediction*: No; dependence is objective but context-relative.  
      - *Exclusionist prediction*: Yes; only positive events avoid this problem.  
  - **Crux (c) Norm-Sensitivity**:  
    - *Bearing argument*: Does the choice of omission reveal causation or pragmatics?  
      - *Inclusionist prediction*: Pragmatics selects which cause to mention; all dependences are causal.  
      - *Exclusionist prediction*: It reveals that omissions aren’t causal; they’re normative labels.  

  ---

  ### What Would Move Each Side?  
  - **Inclusionist**: "I would reconsider if exclusionism can explain *all* omission-talk without special pleading (e.g., the automated system case) **and** if dependence alone implies absurd overpopulation of causes (e.g., 'not singing' as a cause of the break-in). I must also distinguish omissions from sheer background conditions."  
  - **Exclusionist**: "I would reconsider if inclusionism provides a principled criterion for *which* absences count as causes (not just norm-based) **and** if it can show how absences produce effects without invoking magic. I must also treat fire’s oxygen absence and guard’s absence uniformly."  

  ### Verbal Disagreement?  
  We identify one potential verbal element:  
  - **Inclusionist** uses "cause" for any difference-maker (including absences).  
  - **Exclusionist** uses "cause" only for productive/mechanistic relations.  
  We could translate:  
  - Inclusionist: "Omission C caused O" → "O counterfactually depended on C."  
  - Exclusionist: "Omission C caused O" → "C’s absence explains O, but causes are positive events."  
  However, we disagree on whether this exhausts the metaphysics. The inclusionist insists omissions are in causal histories; the exclusionist denies this. Thus, the core dispute is substantive.  

  ---  
  **Signed,**  
  [Name], Inclusionist  
  [Name], Exclusionist
