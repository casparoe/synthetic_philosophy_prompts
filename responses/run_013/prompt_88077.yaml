prompt: |-
  Over the past year, mostly while grading essays for a large introductory course, I have been collecting a kind of sentence that I cannot classify, and I would like to know whether it has a name — and, more to the point, whether the name covers everything I have collected. The specimens share a shape: the first half commits the speaker to something, and the second half, in the same breath, disowns the commitment. A colleague writes that the grant will come through, and adds that he does not believe it will. A student tells me she has finished the chapter, and then that she is not sure she thinks she has. I once wrote in a diary that I was going to leave the department and, a line later, that I had no intention of leaving it. Nothing here is contradictory in the way a sentence and its negation are: I can describe a person of whom both halves are true without any strain, and it is only when the person described is the one speaking that the thing becomes unsayable — and even then not always. The oddness vanishes if I move it into the past tense, or into the second or third person, where the same content is merely sad or merely gossip; it is milder in a private notebook than in a memo; and it survives, in some form, when I replace 'believe' with 'know', 'remember', or 'be certain', though I cannot tell whether in the same form. Two cases have defeated me. First, when I substitute a group for the individual — the committee has concluded that the building is sound, though none of us believes it is — the sentence becomes perfectly usable, which puzzles me, since I do not know what a committee's concluding something amounts to if not the conclusions of its members. Second, I cannot decide whether 'I will have the draft to you on Friday, though I have no intention of finishing it' belongs with the others or with something else, or how it stands to a promise made in bad faith; the pull to call it a malfunction is the same, the diagnosis, I suspect, is not.

  I know the neighbouring territory well enough to know that none of it is quite my quarry. I know the self-referential paradoxes, where a sentence contrives to undermine itself, and I know what people mean when they call an utterance a 'performative contradiction' — the relativist who asserts his relativism, the sceptic who argues that no one can argue. In my specimens nothing refers to itself and nothing contradicts anything: the speaker may be right on both counts, and yet the sentence is not one a person can be in a position to utter. I have a nagging sense that there is a name for this that I read once and have since lost, and I am asking because I want more than the name. What I want is the joints. What exactly is defective here — is the defect in the meaning of the sentence or in the act of uttering it? Why should the defect track tense, person, register, and the verb in the second half, when it does not track whether the two halves can both be true? Are the 'know', 'remember', and 'intend' versions the same phenomenon, or a family of cousins, and where is the boundary that separates them? What becomes of the phenomenon when the speaker is a group? And is there anything to be learned from the fact that the defect disappears in the past tense, or is that a red herring? If there is one thing here with one name, give me the name and the boundary of the thing it names; if I have been sweeping several things into one pile, draw the lines and tell me which of them, if any, has never been named. I am not asking for a reading list; I would rather have the analysis.
reasoning: |-
  Hmm, this is a fascinating and deeply nuanced linguistic puzzle. The user presents a specific type of problematic sentence they've observed in student essays and professional writing - sentences where the first half asserts something and the second half immediately disavows that assertion, creating a peculiar tension. 

  What makes this particularly interesting is how the defect disappears when we shift perspective: past tense eliminates it, third person makes it merely descriptive, and group subjects paradoxically resolve it. The user has clearly done significant groundwork already - they've ruled out self-referential paradoxes and performative contradictions, recognizing that their specimens don't contradict truth conditions but rather utterance conditions.

  The core tension seems to hinge on epistemic positioning. When someone says "X is true but I don't believe it," they're simultaneously occupying and abandoning the ground needed to make the first claim. It's not that the proposition is contradictory, but that the speech act undermines its own foundation. This explains why committee statements work differently - collective agency distributes the epistemic burden.

  For the "intention" case ("I'll deliver Friday though I don't intend to"), we're dealing with promissory rather than epistemic commitment. Here the defect feels more like bad faith than cognitive dissonance. The verb matters tremendously - "know" creates a sharper paradox than "believe," while "remember" introduces temporal complications.

  The user's methodological rigor is impressive. They're not just seeking a label but asking for the "joints" - the precise boundaries and mechanisms. Their observation about tense is crucial: the past tense shift ("I thought X but didn't believe it") works because it describes rather than performs the disconnect. This suggests the phenomenon is fundamentally about present self-positioning in speech acts.

  What they're describing feels adjacent to Moore's paradox but extends beyond belief-statements to intentions and possibly commissives. The committee exception highlights how group utterances operate under different pragmatic rules - collective declarations create institutional facts that float free of individual beliefs.
answer: |-
  What you've collected is a fascinating family of linguistic phenomena centered on **epistemic and commitment self-undermining**. While no single term perfectly captures *all* your specimens in their full nuance, the core concept is most closely related to **Moore's Paradox**, though your observations reveal it's broader and more complex.

  Here's the analysis, breaking down your questions about "the joints":

  1.  **The Core Defect: Moorean Assertion & The Epistemic/Commitment Position**
      *   **Defect Type:** The defect is **primarily pragmatic**, residing in the *act of assertion* (or promising, concluding, etc.), not necessarily in the propositional meaning or truth conditions.
      *   **The Problem:** Asserting a proposition `P` (e.g., "The grant will come through," "I have finished the chapter," "I am going to leave") *normally implies* that the speaker has a certain epistemic or commitment stance towards `P` – typically belief, knowledge, confidence, or intention (depending on the verb/content).
      *   **The Undermining:** The second clause explicitly *denies* that very stance ("I do not believe it," "I am not sure," "I have no intention"). The speaker simultaneously *occupies the position* required to sincerely assert `P` (by asserting it) and *vacates that position* (by disavowing the underlying state).
      *   **Why it's not Contradictory:** `P & ~Believe(I, P)` is *logically possible*. You can be correct about `P` while lacking belief/knowledge/intention (e.g., through luck, self-deception, or simply stating a fact you disbelieve). The contradiction arises in the *performance*: the act of asserting `P` *conventionally commits* you to `Believe(I, P)` (or similar), creating a pragmatic clash with the explicit denial.
      *   **Why Person/Tense Matter:**
          *   **1st Person Present:** This is where the pragmatic commitment of assertion (or promising, etc.) is most direct and binding *on the speaker at the moment of speaking*. The speaker is *currently* performing an act that implies a state they are simultaneously denying *in the same utterance*.
          *   **2nd/3rd Person/Past Tense:** Here, the speaker is *reporting* or *describing* states or events involving *others* or their *past self*. The pragmatic commitment of the *reported* assertion/intention belongs to the subject *then*, not the speaker *now*. The speaker isn't simultaneously performing *and* undermining the act; they are describing someone else performing it while lacking the state, or describing their past self doing so. This is observation, not self-undermining performance.
      *   **Why Register Matters (Private vs. Public):** In a private notebook, the utterance functions less as a full-blooded public assertion with its conventional commitments and more as a record of fleeting thought, self-exploration, or internal conflict. The pragmatic force is weaker, making the tension milder. A memo is a public performative act with stronger conventional commitments.

  2.  **Moore's Paradox: The Anchor and Its Limits**
      *   **The Name:** "Moore's Paradox" (named after G.E. Moore) is the classic name for the oddness of assertions like "`P` but I don't believe that `P`" or "It's raining but I don't believe it's raining."
      *   **The Boundary:** Moore's Paradox *strictly* concerns the tension between asserting `P` and denying *belief* in `P`.
      *   **Your Extensions:**
          *   **`Know`, `Remember`, `Be Certain`:** These are close cousins. Asserting `P` conventionally implies the speaker *knows* `P` (or takes themselves to know it). Similarly, asserting "I remember that `P`" implies current confidence in the memory. Denying knowledge/certainty/memory *while asserting the proposition* creates a very similar pragmatic clash – the speaker asserts something while denying the epistemic warrant typically required for sincere assertion. It's the *same core phenomenon* applied to stronger epistemic states. Denying `remember` or `know` explicitly undercuts the basis for the assertion even more starkly than denying `believe`.
          *   **`Intend` (The Draft Case):** This is a distinct but closely related phenomenon.
              *   **Moore-like Aspect:** Promising (or strongly asserting future action) "I will have the draft to you on Friday" conventionally implies *intention* to do so. Denying the intention ("I have no intention of finishing it") directly undermines the sincerity condition of the promise or commitment.
              *   **Bad Faith Aspect:** This case strongly overlaps with making a promise in bad faith. However, the *linguistic oddness* you note ("the pull to call it a malfunction") stems from the same pragmatic clash as Moore: performing a commissive speech act (promise/commitment) while explicitly denying the mental state (intention) it conventionally requires. The *defect* is the same pragmatic self-undermining; the *moral diagnosis* is bad faith. It belongs in your collection as the "commitment" analog to the epistemic Moore cases.

  3.  **The Committee Case: Collective Agency Dissolves the Paradox**
      *   **Why it Works:** You've hit the nail on the head: "I do not know what a committee's concluding something amounts to if not the conclusions of its members." The key is that collective entities *do* perform actions (like concluding) that are *distinct* from the sum of their members' individual states. A committee's conclusion is an *institutional fact* or a *collective decision procedure output*, not necessarily the aggregate belief of its members.
      *   **The Mechanism:** When the committee spokesperson says, "The committee has concluded that the building is sound, though none of us believes it is," they are:
          1.  **Reporting an Institutional Act:** Stating the *official outcome* of the committee's decision process (concluding `P`).
          2.  **Reporting Individual States:** Stating the *individual epistemic states* of the members (~Believe(member, `P`)).
      *   **No Self-Undermining:** The spokesperson is *not* asserting `P` ("The building *is* sound") *on their own epistemic authority* and then denying their own belief. They are reporting two distinct facts: the committee's official act and the members' private states. The pragmatic commitment of the *report* about the committee's conclusion does *not* imply that the *reporter* (or even the members individually) believe `P`. It only implies the reporter believes the committee *performed the act* of concluding `P`. There is no single agent whose assertion is undermined by their own denial of belief.

  4.  **The Tense Observation: Not a Red Herring**
      *   **Why it Disappears:** The past tense ("He *said* he was leaving, but he *didn't* intend to") removes the *simultaneous performance and undermining*. The speaker now is *describing* a past speech act and a past mental state. They are not *currently* asserting the proposition (`P`: leaving) and simultaneously denying the required state (intention). The pragmatic clash only occurs when the assertion/intention *and* its undermining are performed *in the same present act of utterance*.

  **The Name and the Boundaries**

  *   **Core Name:** **Moore's Paradox** is the foundational term for the epistemic core involving belief-denial (`P & ~Believe(I, P)`).
  *   **Broader Family:** Your collection demonstrates **Moorean Phenomena** or **Assertion-Commitment Undermining Utterances**. This family includes:
      *   **Epistemic Moore:** `P` + Denial of belief/knowledge/certainty/memory regarding `P` (1st person present).
      *   **Commissive Moore:** Promise/Commitment to do `X` + Denial of intention to do `X` (1st person present).
  *   **Boundaries:**
      *   **Included:** All 1st person present tense utterances where the speaker performs a speech act (assertion, promise, declaration of intention) conventionally requiring a specific cognitive/volitional state (belief, knowledge, intention) and *in the same utterance* explicitly denies possessing that state.
      *   **Excluded:**
          *   Past tense reports of such utterances/states.
          *   2nd/3rd person reports of others' states.
          *   Group statements where the speech act attributed to the group is distinct from the members' individual states.
          *   Self-referential paradoxes (e.g., "This sentence is false").
          *   Performative contradictions (e.g., asserting relativism absolutely).
          *   Simple lies (where the insincerity is concealed, not explicitly stated).
          *   Expressions of doubt *preceding* the assertion (e.g., "I'm not sure, but I think P" - this is coherent).
      *   **Grey Area:** The `remember` case is very close to epistemic Moore. The `intend` case is clearly commissive Moore – distinct verb, but same pragmatic self-undermining structure for commitments. They belong under the broader umbrella.

  **What Can Be Learned**

  1.  **Speech Acts are More Than Propositions:** The meaning and acceptability of an utterance depend heavily on the *act* being performed and its conventional implications (belief, intention, etc.), not just truth conditions.
  2.  **The Centrality of the Speaker's Present Position:** The paradox highlights how tightly bound assertion/promise is to the speaker's *current* cognitive/volitional state *at the moment of utterance*.
  3.  **Collective Agency is Different:** Group actions and statements operate under different pragmatic rules than individual ones. Institutional facts can decouple from individual belief.
  4.  **Sincerity Conditions are Fundamental:** Moorean utterances vividly expose the sincerity conditions that underpin our everyday speech acts. Denying these conditions *within the act itself* creates a unique kind of pragmatic failure.
  5.  **Self-Knowledge and Expression:** The tension exposes the peculiar difficulty (or absurdity) of simultaneously occupying a position (as an asserter/promiser) and explicitly observing one's *lack* of the state that position conventionally requires.

  You have not swept unrelated things into one pile. You've meticulously mapped the contours of a core pragmatic phenomenon (Moorean Paradox) and its close relatives involving other cognitive/volitional states (`know`, `remember`, `intend`). The committee case and the tense shift are not exceptions but crucial data points revealing the boundaries defined by agency, time, and the nature of the speech act being performed. The name **Moorean Phenomena** or **Assertion-Commitment Self-Undermining Utterances** best captures this family.
