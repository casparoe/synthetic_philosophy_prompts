prompt: |-
  I am a novelist, and I have just finished a book about a man who at seventeen was driving when his closest friend was killed, and who at sixty has been forgiven by everyone whose forgiveness he could reasonably want — the dead boy's mother, his wife, the court, the priest — and who is the only person in the novel who has not let himself off. To mark the publication I have agreed to interview, on stage at a festival, a philosopher whose new book, provisionally titled *The Unpayable Debt*, argues roughly this: that guilt is built like a debt — it names an act, it can be discharged, and the discharge is what allows everyone, wrongdoer included, to stop thinking about the wrong — whereas shame names the person and cannot be discharged, which is precisely its moral advantage; that shame's need for an audience is not heteronomy but the correct register for creatures whose standing is constituted by recognition, guilt being the emotion of a ledger kept by nobody in particular, which is why guilt cultures produce the curious figure of the man who has settled his account and now demands readmission; that cultures cannot choose their dominant moral emotion directly, only their repertoire of practices for handling the irreversible, and shame-based cultures tend to have the richer repertoire because they do not believe the ledger ever balances; and finally, by way of provocation, that the tidy formula — shame is about who you are, guilt about what you did — is an artifact of a particular moral vocabulary rather than a fact about the emotions, its boundary drawn by institutions rather than by psychology.

  I would like eight to ten questions that make her work rather than summarise it. Three of them must do specific jobs. First, press the non-dischargeability claim: I want to know what distinguishes keeping a wrong in view from mere rumination, and what her theory says about my man at sixty — whether she thinks he is right, and whether a self that cannot be forgiven is a moral achievement or a symptom. Second, press the recognition claim: if the audience can be internalised, does shame collapse into a private ledger and so into guilt under another name; if it cannot, what becomes of the person whose community is gone, or was always hostile to him. Third, press whether a culture can choose: what is the actual mechanism, and does she accept the implication that the organised shaming of offenders — public naming, exposure, the pillory — is a tool she ought to welcome. Add one question on her claim that the shame/guilt boundary is drawn by vocabulary rather than psychology, asking how she would distinguish a society that lacks the words from one that lacks the emotion.

  For every question, give me the follow-up I will need if she answers as I expect her to. Do not ask her what drew her to the subject, or for definitions she has already given in the book, and end with the one question that makes her characteristic deflection — that shame is a practice and not a theory — hardest to use.
reasoning: |-
  Okay, the user is a novelist who's written a book about a man haunted by guilt over his friend's death. At 60, everyone has forgiven him except himself. The user is interviewing a philosopher whose book argues that guilt is like a payable debt while shame is non-dischargeable and tied to identity. The philosopher also claims shame requires an audience for moral recognition, and that cultures shape moral emotions through practices.

  The user needs 8-10 interview questions that engage deeply with the philosopher's arguments without summarizing them. Three specific questions are required: one on non-dischargeability (exploring the protagonist's perpetual guilt), one on the audience requirement for shame (questioning internalization and community loss), and one on cultural choice (examining mechanisms and implications for shaming practices). There should also be a question about whether shame/guilt distinctions stem from vocabulary rather than psychology.

  The user wants follow-ups for each question anticipating the philosopher's likely responses. The questions must avoid definitions or personal background. The final question should corner the philosopher into addressing theory directly, bypassing her usual deflection that shame is practice-not-theory.

  For non-dischargeability: The main question would contrast productive remembrance vs. rumination, probing if the protagonist's unforgiveness is moral or pathological. Follow-up would challenge if this creates an impossible standard.

  For recognition: The main question would ask if internalization collapses shame into guilt, and address cases of lost/hostile communities. Follow-up would question if this traps marginalized people in shame.

  For cultural choice: The main question would demand concrete mechanisms for shifting moral emotions, and confront the endorsement of organized shaming. Follow-up would ask if restorative justice could reframe shaming practices.

  The vocabulary question would distinguish societies lacking shame vocabulary from those lacking the emotion. Follow-up would test if guilt-dominated societies can develop shame practices without the language.

  The cornering question would directly challenge how her theory handles cases where shame manifests without community, forcing engagement beyond "practice-not-theory" deflection.
answer: |-
  Here are ten questions designed to engage the philosopher's arguments rigorously, incorporating your specific requests. Each question includes a concise follow-up anticipating her likely line of response.

  ### Core Questions & Follow-Ups

  1.  **On Non-Dischargeability & Your Protagonist:** You argue shame, unlike guilt, cannot be "discharged" and this is its *moral* advantage, keeping the wrong in view. My protagonist, forgiven by all others, cannot forgive himself at sixty for the death he caused at seventeen. In your framework, is his persistent self-condemnation a form of morally valuable shame keeping the wrong salient? Or is it merely destructive rumination? What criteria distinguish the two?
      *   *Follow-Up (if she affirms it as valuable shame):* Doesn't this risk valorizing an impossible burden – a self that *cannot* be forgiven, even when every relevant other has offered it? Is perpetually unreconciled shame a moral achievement, or does it become a symptom when it persists long after societal reconciliation?
      *   *Follow-Up (if she suggests it's rumination):* What then *would* constitute the morally valuable, non-ruminative keeping-in-view of such an irreversible wrong for the wrongdoer within your theory? Does your framework allow for a 'resolution' of shame that isn't discharge?

  2.  **On Recognition & Internalization:** You claim shame inherently requires an audience for recognition – it's constitutive of standing. But if this audience can be internalized (e.g., through conscience, imagined community), how does this internalized shame fundamentally differ from guilt, which you describe as a "ledger kept by nobody in particular"? Doesn't internalization risk collapsing shame into just another private ledger?
      *   *Follow-Up:* If the audience *cannot* be meaningfully internalized, what becomes of the moral standing or the capacity for moral reckoning of someone whose *actual* community is destroyed (e.g., genocide survivor), irredeemably hostile, or was never formed (e.g., severe early neglect)? Does your theory condemn them to a kind of moral isolation where shame, your preferred register, is inaccessible or impossible?

  3.  **On Cultural Choice & Mechanisms:** You suggest cultures choose their dominant moral emotion indirectly, via practices for handling the irreversible. What is the *actual mechanism* by which adopting certain practices (like specific rituals of atonement or exclusion) reliably shifts a culture *from* a guilt-dominant framework *toward* a shame-dominant one? Is it primarily legislative, pedagogical, or emergent from grassroots social movements?
      *   *Follow-Up (pressing the implication):* You praise shame-based cultures for richer repertoires precisely because they don't believe the ledger balances. Does this imply that organized, institutionalized shaming practices – public naming, exposure rituals, even historical analogues like the pillory – are tools a society *ought* to welcome or even cultivate to strengthen its shame-based moral register, despite their potential for cruelty and permanent stigmatization?

  4.  **On Vocabulary vs. Psychology:** You provocatively argue the standard shame/guilt boundary ("who you are" vs. "what you did") is drawn by vocabulary/institutions, not psychology. How would you empirically *distinguish* a society that genuinely lacks the *concept* of shame (the vocabulary) from one that lacks the underlying *emotional experience* or moral impulse that shame vocabulary typically names? Doesn't this claim risk making the emotion itself epiphenomenal to the label?
      *   *Follow-Up:** If the boundary is purely institutional/vocabulary, could a guilt-dominant culture *develop* functionally equivalent "shame" practices (rich repertoires for the irreversible) *without* adopting shame vocabulary? Or does the vocabulary act as a necessary enabling condition?

  5.  **On Discharge & Readmission:** You critique guilt's discharge leading to the figure who "settles his account and now demands readmission." But doesn't shame, precisely because it's non-dischargeable, risk creating a *permanent* outcast class – individuals perpetually defined by the shameful act, forever barred from meaningful reintegration, regardless of subsequent actions or societal evolution? How does your theory prevent shame from becoming a life sentence without parole?
      *   *Follow-Up:** Is there a role for *transformation* of the self within shame that allows for a different kind of standing *without* requiring the ledger to be "balanced" or discharge to occur? Or is permanent marginalization the necessary cost?

  6.  **On the Audience's Role:** If shame's audience provides constitutive recognition, what happens when the audience gets it *wrong*? If a community shames someone for something that isn't actually morally wrong (e.g., surviving trauma, consensual identity), does this act of "recognition" still confer moral standing, however perverse? Or is there an objective moral standard external to the audience's judgment within your framework?
      *   *Follow-Up:** Doesn't this make shame dangerously susceptible to mob mentality and social prejudice, undermining its claim to be a superior moral register? How can it be constitutive *and* potentially morally corrupt?

  7.  **On Guilt's Ledger & Anonymity:** You describe guilt's ledger as "kept by nobody in particular." But isn't guilt often intensely personal and tied to specific victims or a specific internalized moral code (God, conscience)? Doesn't framing guilt as an impersonal ledger risk caricaturing it and overlooking the deeply personal anguish it can cause, distinct from shame's focus on exposure?
      *   *Follow-Up:** If guilt *can* be deeply personal and attached to specific relationships (e.g., guilt towards the friend he killed, towards the mother), how does this differ fundamentally from shame's attachment to the self-as-seen, especially when the "audience" for shame is specific individuals (like the mother)?

  8.  **On Moral Advantage & Suffering:** You claim shame's non-dischargeability is a *moral* advantage. Yet, my protagonist's suffering, stemming from what you might call his shame, is immense. How do we weigh the potential moral *utility* of shame (keeping the wrong in view) against the intense, potentially crippling *suffering* it inflicts on the individual? Isn't there a risk of fetishizing suffering as inherently morally instructive?
      *   *Follow-Up:** Couldn't guilt, precisely because it *can* be discharged (even if imperfectly), allow for productive remorse, restitution, and moving forward *without* requiring the permanent psychic wound of shame? Is perpetual suffering truly necessary for moral seriousness?

  9.  **On Repertoire & Modernity:** You argue shame-based cultures have richer repertoires for handling the irreversible because they reject ledger-balancing. What specific practices in *contemporary*, largely guilt-dominant Western societies do you see as inadequate for handling irreversible wrongs (like my protagonist's)? Can you point to concrete examples of shame-based practices from other cultures or historical periods that you believe would offer a morally superior response to such tragedies today?
      *   *Follow-Up:** Aren't many traditional shame-based practices (e.g., honor codes demanding violence, permanent ostracization) incompatible with modern values of individual rights, rehabilitation, and proportionality? Doesn't adopting them risk regressing morally?

  10. **The Cornering Question (Against the Deflection):** You often characterize shame as a practice, not a theory. Yet, your book makes strong theoretical claims: that shame is non-dischargeable *by nature*, that it *requires* an audience for recognition *constitutively*, and that this framework is *morally advantageous*. **If shame is fundamentally a practice, how do you reconcile this with your core theoretical assertions about its inherent, universal structure and moral superiority? Doesn't insisting it's "just practice" become a way to deflect precisely the kind of conceptual and normative scrutiny your own theory demands?**
      *   *Follow-Up Strategy:* This question directly challenges her characteristic deflection. If she tries to retreat to "it's practice," immediately press: "But your claims about non-dischargeability and constitutive audience aren't descriptions of *specific* practices; they are claims about the *essential nature* of shame *as an emotion*. How can you ground these essentialist claims if shame is wholly reducible to contingent practices?" Force the tension between her descriptive claims about shame's inherent structure and her meta-claim about it being practice-based.

  These questions avoid summary, definitions, or biographical fluff. They directly engage the tensions and implications of her arguments, providing rigorous ground for a dynamic discussion that connects her philosophy powerfully to your novel's core concern. The final question specifically targets and undermines her likely deflection tactic.
