  2. Indicative conditionals and counterfactual conditionals behave differently in many contexts, and any theory must account for this.
  3. The Ramsey test is a good guide to the acceptability of an indicative conditional: to evaluate "if A, B", one supposes A and then checks whether B is credible under that supposition.
  4. Some inference patterns that are valid for the material conditional fail for indicative conditionals, such as:
     - Antecedent strengthening: from "if A, B" we cannot always infer "if A and C, B".
     - Contraposition: from "if A, B" we cannot always infer "if not-B, then not-A".
     - Transitivity: from "if A, B" and "if B, C" we cannot always infer "if A, C".
  5. The triviality results (e.g., by Lewis) show that under certain assumptions, the probability of a conditional cannot be the conditional probability without collapsing into triviality. Both agree that this is a challenge for truth-conditional accounts of indicatives, though they interpret the implications differently.
