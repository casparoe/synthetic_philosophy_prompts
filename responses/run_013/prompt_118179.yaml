answer: |-
  **Bottom line: Using the wine-water mixture paradox with two parameterizations (total volume and ratio vs. absolute amounts) creates the desired conflict in probabilities.**  

  ### **Game Setup: "Wine-Water Betting Paradox"**  
  **Materials**: Whiteboard, markers, index cards (two colors), handouts with problem statement, calculators (optional), tally sheet.  
  **Roles**: Split students into **Group A** (parameterizes by total volume + ratio) and **Group B** (parameterizes by wine/water amounts).  

  ---

  ### **Timeline (90 min)**  
  1. **Introduction (10 min)**:  
     - Present the paradox: *A mixture of wine and water has total volume between 1–3 liters and wine-to-water ratio between 1:3 and 3:1. What’s the probability wine ≤ water?*  
     - Assign groups. Group A uses **Method A** (uniform total volume + uniform ratio). Group B uses **Method B** (uniform wine + uniform water, constrained).  

  2. **Group Work (25 min)**:  
     - **Handout** gives methods:  
       - *Group A*: Pick total volume \(T \sim U[1,3]\) and ratio \(R \sim U[1/3,3]\). Compute \(P(R \leq 1)\).  
       - *Group B*: Pick wine \(W \sim U[0,3]\), water \(V \sim U[0,3]\), but only consider pairs where \(1 \leq W+V \leq 3\) and \(1/3 \leq W/V \leq 3\). Compute \(P(W \leq V)\).  
     - Groups calculate probabilities and justify their parameterization as "natural."  

  3. **Commit to Bets (10 min)**:  
     - Groups write their probability (e.g., 0.25 or 0.50) and a **bet** (0–100 virtual tokens) on index cards.  
     - *Example bet*: "We bet 80 tokens that \(P(\text{wine} \leq \text{water}) = 1/4\)." Collect cards.  

  4. **Reveal & Debate (25 min)**:  
     - Display probabilities: Group A gets \(P_A = 1/4\), Group B gets \(P_B = 1/2\).  
     - Groups debate: *Why is your parameterization correct? Why is the other flawed?*  
     - **Key conflict**: Both appeal to indifference (uniform over their parameters).  

  5. **Debrief (20 min)**:  
     - Map answers to parameterizations:  
       - \(P_A = 1/4\) → Uniform \(T\) and \(R\) (Method A).  
       - \(P_B = 1/2\) → Uniform \(W\) and \(V\) (Method B), leveraging symmetry in constraints.  
     - **Mathematical recap**:  
       - Method A: \(P(R \leq 1) = \frac{1 - 1/3}{3 - 1/3} = \frac{2/3}{8/3} = \frac{1}{4}\).  
       - Method B: Constraints are symmetric in \(W\) and \(V\), so \(P(W \leq V) = \frac{1}{2}\) (half the valid region).  
     - **Core insight**: Principle of indifference is ambiguous—it depends on *how* you define the "natural" parameters.  
     - **Limitation**: The game can’t reproduce the *geometric non-invariance* of Bertrand’s original (e.g., rotation/scale invariance). Sketch this on the board: *"In the circle example, two methods violate metric invariance, but here it’s about subjective parameter choice."*  

  ---

  ### **Payoff Scheme**  
  - Use **virtual tokens**. Award tokens based on debate performance (peer vote):  
    - 100 tokens to the group with most convincing symmetry argument.  
    - 50 tokens to the other (acknowledging both are logically valid).  
  - *No real money needed*: Tokens translate to bragging rights or extra participation points.  

  ---

  ### **Predictable Problems & Fixes**  
  - **Group B struggles with symmetry**: Students may miss that constraints \(W/V \in [1/3,3]\) and \(W+V \in [1,3]\) are symmetric in \(W\) and \(V\).  
    - *Fix*: Hint: *"Swap wine and water. Does the problem change?"*  
  - **Calculation errors**: Groups may misintegrate or ignore constraints.  
    - *Fix*: Provide visual aids (handout with graphs of valid \(W,V\) region).  
  - **Debate stalemate**: Students insist their answer is "obviously correct."  
    - *Fix*: Reframe: *"Both are mathematically sound—why does indifference fail here?"*  
  - **Time crunch**: Groups delay betting.  
    - *Fix*: Enforce strict timing with countdowns.  

  ### **Why This Works**  
  Students *experience* the paradox by committing to their answer before seeing the conflict, then confronting how identical applications of indifference produce incompatible results. The wine-water setup is intuitive, non-geometric, and forces them to grapple with parameterization-dependence—making the abstract paradox visceral.
