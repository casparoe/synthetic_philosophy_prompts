answer: |-
  ## Opening Remarks: The Two Women in the Room

  Good morning everyone. Thank you all for being here – philosophers, clinicians, lawyers, and especially those of you who’ve walked this path as carers. Your presence grounds this discussion in the reality we’re trying to understand.

  We’re gathered to talk about advance directives. About the authority of a past self over a future self. But I don’t want to start with abstract principles. I want to start with two women. Let me tell you about them.

  Picture the first woman. She’s in her sixties. Sharp, capable. She remembers watching her mother fade with dementia, sustained by tubes, trapped in a state she dreaded. Determined to avoid that path, this woman writes a clear directive. She signs it. She states: if dementia takes me, do not keep me alive with artificial food or fluids. Her fear is specific, her reasoning lucid, her signature deliberate. She wants to spare her future self the torment she witnessed. Her voice is firm, final.

  Now, step forward ten years. Meet the second woman. Dementia has arrived. It’s moderate now. The document she signed? She can’t follow its logic. The signature? She doesn’t recognise it as hers. The fear that drove the first woman? It’s absent. Here, now, by every measure available to those caring for her, she is… content. She enjoys sitting in the garden. She likes the staff who help her. She asks for a second helping of pudding. The state the first woman so deeply feared? This woman inhabits it, and it holds no terror for her now. She finds moments of simple pleasure.

  Suddenly, the room feels crowded. Both women are here. The one who wrote the directive, emphatic and afraid. The one living with dementia, present and seemingly untroubled. The ordinary assumption – that there is one continuous person, making one long decision – feels profoundly unsettled. It has come unstuck.

  So, what do we do? How do we hear both voices?

  Our usual instinct might be to see the directive as an order. A command issued by the past sovereign self, demanding obedience from the future. But what if it’s something else? What if it’s less like a royal decree, and more like… a promise? Or perhaps, a letter carefully written and left behind – a message for someone you know you won’t get to meet?

  In this view, the authority of the earlier self isn’t a command echoing from the past. It’s a *claim* laid upon the present. It asks the person here now, and those caring for her, to *honour* a commitment made by someone who, in a very real sense, feels absent. It’s a profound request: "Remember who I was, what I feared, what I valued. Honour that."

  But then there’s the woman sitting here today. Content with her pudding, her garden. And here lies the awkward, difficult heart of it: the first woman’s intense dread was, in significant part, a dread *of becoming the very person who is now here*. A dread of this state. Yet, the state itself, for this second woman, isn’t the torment that was feared. The anticipation doesn’t match the lived reality.

  This isn’t an easy gotcha. It’s not a simple reason to dismiss the first woman’s wishes. To do that would be cruel to the carers who know the weight of those wishes, and philosophically lazy. It asks us hard questions: Does the later self’s contentment change the nature of the promise? Does it alter what honouring it means? Can a promise bind when the person who made it, in the sense that truly matters to *her* now, feels impossibly distant? Whose voice prevails when the one who spoke the fear is gone, and the one living the reality cannot recall it?

  Our task over the next two days isn’t to resolve this tension. It’s to sit with it. To hold both women in view at once. To explore the space between the promise made in foresight and the person living in the moment. To ask, together, what authority survives the profound change that dementia brings. Let’s begin that difficult, necessary conversation.

  ---

  **Where the Framing Might Come Apart & What Could Change It:**

  Your framing leans heavily on the **"promise/letter" metaphor replacing the "sovereign command" model.** This is its core strength but also its main vulnerability. The argument carries the most weight on the idea that honouring the directive is an *ethical act of fidelity* to the earlier self's values and commitments, rather than mere legalistic obedience. If this premise fails – if the later self's radical discontinuity is seen as severing *all* ethical obligations to the earlier self – the whole "promise/letter" framework crumbles. Critics might argue that the later self is simply a different person, making the earlier "promise" irrelevant, akin to a stranger's request. What would change my mind? A compelling argument demonstrating that the psychological and experiential discontinuity in advanced dementia genuinely *extinguishes* the earlier self's moral standing to make claims on the present situation, reducing the directive to a historical artifact with only informational, not binding, value. This would shift the focus entirely to the current well-being and preferences of the person as they exist now. The "awkward fact" of contentment then becomes less a problem *for* the directive's authority and more a simple, overriding reason *against* enforcing it. The challenge is maintaining the *tension* your framing creates without letting this discontinuity argument completely dissolve the link between the selves.
