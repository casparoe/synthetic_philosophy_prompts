answer: |-
  Here's the restatement of the moral revolution debate in your formalism, followed by the residue report:

  **The Debate Restated:**

  1.  **Initial State:** A population plays a repeated coordination/punishment game. Practices like slavery or dueling are **strict correlated equilibria** sustained by:
      *   *Honor System:* Third-party monitoring and punishment strategies (`Punish Defectors`, `Reward Compliers`) conditional on signals (reputation tags). These strategies are themselves correlated through a shared understanding (the "honor code").
      *   *Focal Point:* The practice is the salient, established coordination point.
      *   *Stochastic Stability:* Given the payoff structure and existing correlated punishment, the equilibrium is locally stable against small perturbations (`Trembling Hands`).

  2.  **The Challenge (Why Change?):** Why does this stable correlated equilibrium collapse and a new one (e.g., universal non-slavery, non-dueling) emerge? Three hypothesized **equilibrium selection** mechanisms:
      *   *Material Interests:* Exogenous shifts in the underlying **payoff matrix** (e.g., industrialization reducing the relative payoff of slave labor `Π_slave` vs. wage labor `Π_free`; rising costs of dueling `C_duel_death` due to medical/legal changes). This alters the **basin of attraction**, making the old equilibrium less attractive and potentially unstable.
      *   *Honor Dynamics:* Endogenous shifts in the correlated punishment strategies. Changes in the *distribution* of strategies (`Punish`, `Ignore`, `Condone`) or the *signals* they condition on (shifting reputation tags). E.g., abolitionist sentiment makes defending slavery a negative reputation signal, altering the payoff for `Punish Pro-Slavery` vs. `Ignore Pro-Slavery`.
      *   *Moral Argument (as Norm Entrepreneurship):** Actions by "**norm entrepreneurs**":
          *   **Perturbing Payoffs:** Increasing the perceived cost `C_comply_old` (e.g., guilt, social ostracism) or decreasing the perceived benefit `Π_comply_old` of the old practice through discourse. Framing non-compliance (`Defect` from the old norm) as honorable.
          *   **Expanding the Feasible Strategy Set:** Introducing and legitimizing previously "unthinkable" strategies (`Refuse Duel`, `Emancipate`) and correlating new punishment strategies (`Punish Slaveholder`, `Shun Duelist`) around them.
          *   **Creating New Focal Points:** Making the *new* practice (`Non-Slavery`, `Non-Dueling`) salient through rhetoric, symbolism, and coordinated action.
          *   **Intentional Stochastic Perturbation:** Organizing visible, costly deviations (`Defect` actions) to demonstrate feasibility and shift reputation dynamics, acting as large, coordinated trembles.

  3.  **The Transition:** The shift occurs through:
      *   A change in the relative size of the **basins of attraction** for the competing correlated equilibria (old vs. new).
      *   A large enough perturbation (stochastic or intentional) pushing the population into the basin of the new equilibrium.
      *   The new correlated equilibrium (sustained by altered punishment strategies/reputation signals) achieves **stochastic stability** under the new payoff/strategy-set conditions.

  **Residue Report:**

  1.  **Clean Translations:**
      *   **Entrenchment of Practice:** Perfectly captured as a strict correlated equilibrium sustained by third-party punishment (honor system) and focal salience. Stability explained via stochastic stability/basin size.
      *   **Role of Material Interests:** Cleanly translates to exogenous shifts in the underlying payoff matrix (`Π`, `C`), altering the landscape and equilibrium stability.
      *   **Role of Honor/Reputation:** Cleanly modeled as correlated punishment strategies conditional on public signals (reputation tags). Its dynamics are shifts in the distribution of these strategies or the meaning of the signals.
      *   **Role of Norm Entrepreneurs (as Perturbers):** Cleanly modeled as agents who:
          *   Intentionally alter perceived payoffs (changing `Π`, `C` for others via persuasion/shaming).
          *   Expand the feasible strategy set (`S`) and define new correlated punishment rules.
          *   Create new focal points.
          *   Generate large, coordinated trembles.
      *   **Collapse of Practice:** Cleanly modeled as the old correlated equilibrium losing stability (smaller basin) and being displaced by a perturbation into the basin of a new, stable correlated equilibrium.

  2.  **Translations with Distortion:**
      *   **"Moral Argument" (as Justification/Truth):** The framework captures the *instrumental effects* of argument (shifting payoffs, strategies, focal points, perturbations) but **cannot** capture the *internal logic*, perceived truth-value, or justificatory force of the argument itself within the formalism. It reduces argument to a mechanism for changing incentives/coordination, not a source of validity. The claim "slavery is intrinsically wrong" becomes "asserting 'slavery is wrong' lowers `Π_slaveowner` by inducing guilt/shame and triggers `Punish Slaveowner` strategies."
      *   **Historical Contingency/Specific Triggers:** While stochastic perturbations model randomness, the specific *content* or *timing* of historical events (e.g., a particularly brutal slave rebellion, a famous duel gone wrong) that act as large trembles remains exogenous. The formalism explains *susceptibility* to perturbation, not the specific nature of the perturbation.
      *   **The "Honor" Feeling:** The subjective sense of honor or shame is modeled only through its behavioral consequences (choosing `Punish`, avoiding `Defect`) and its impact on payoffs (`C_shame`). The internal experience is black-boxed.
      *   **Scale and Coordination:** Modeling the shift in correlated punishment across a large, complex population requires strong assumptions about signal observability and strategy correlation. Real-world coordination problems in shifting norms are abstracted.

  3.  **No Counterpart in Formalism:**
      *   **The Normative Claim of Wrongness as Causal:** **This is the most significant residue.** The claim that "slavery ended *because* it was (and is) truly wrong" has **no direct translation**. The formalism explains abandonment via shifts in payoffs, strategy sets, basins of attraction, perturbations, and new coordination points. The *propositional truth* or *objective moral status* of "slavery is wrong" is not a parameter (`Π`, `C`, `S`, `ρ`(signal)), nor does it causally act within the model. Within the formalism, the *belief* that it is wrong is what matters (as it alters payoffs/strategies), not its actual truth. The explanation is entirely in terms of evolving incentives and coordination, not moral ontology.
      *   **The "Discovery" of Wrongness:** The historical sense that wrongness was *discovered* or *realized* translates poorly. In the model, "wrongness" emerges behaviorally when the payoff structure and correlated punishment shift to disfavor the practice. It's a description of the new equilibrium state, not an independent cause.
      *   **Non-Strategic Moral Motivation (Kantian Imperatives):** The possibility that some agents might follow a norm (`Do Not Enslave`) *regardless* of payoffs or punishment (i.e., not best-responding to expected behavior) is incompatible with the core assumption of agents playing best responses (or learning towards them). Such "deontological" players would need to be modeled as exogenous perturbations or fixed strategies, breaking the evolutionary dynamic.

  **Interpretation of Residue:**

  *   **The Framework's Defect/Limit:** The formalism's core limitation is its **instrumentalism** and **amorality**. It excels at modeling *how* norms function and change based on incentives, coordination, and information, but it is inherently agnostic about *why* those incentives shift at a fundamental level, especially concerning intrinsic moral values. It reduces all motivation (including conscience) to payoff structures. It cannot incorporate objective moral truth as an explanatory variable because such truths don't have operational definitions within the mathematics of payoffs and best responses.
  *   **Debate Less Unified:** The residue reveals a fundamental schism in the original debate. The "moral argument" camp often implicitly or explicitly relies on a notion of *persuasion towards truth* or *recognition of inherent wrongness* as the engine. The "material interests" camp relies on changing costs/benefits. The "honor dynamics" camp focuses on reputation networks. **The game-theoretic framework exposes that the "moral argument as truth-discovery" explanation operates on a different ontological plane than the others.** It's not just another mechanism *within* the strategic landscape; it claims a foundation *outside* of it. The debate conflates fundamentally different kinds of explanations: strategic/incentive-based explanations vs. justificatory/meta-ethical claims.
  *   **Conclusion:** The residue, particularly the inability to formalize "wrongness as cause," marks a **conceptual boundary of the game-theoretic framework**. It highlights that while the framework powerfully unifies material interests, honor dynamics, and the *strategic effects* of moral rhetoric, it cannot encompass the claim that objective moral truth itself plays a causal role in historical change. This suggests the original debate may hinge on unresolved philosophical disagreements about the nature of morality and its relationship to social dynamics, disagreements that the formalism, by its very nature, cannot resolve but can help to clearly delineate. The framework excels at explaining the *mechanics* of moral revolutions but remains silent on the ultimate *source* of the new moral coordinates.
