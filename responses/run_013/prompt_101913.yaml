  Prioritizing questions: Likelihood and damage. Deliberative democrats are the majority, so their objections are top. The immigration theorist's point could be most damaging because it challenges the practical applicability, especially in hard cases. Agonists and historian next.

  For each objection, craft a response that's two minutes long. Acknowledge their concern, restate the core argument, explain how revisability addresses it, and use the coastal city example. Note weaknesses honestly—like how revisability might not solve immediate exclusion or could co-opt dissent.

  The "hoped nobody asks" question: Maybe something about how revisability handles cases where the excluded are completely powerless or when the demos actively avoids revisiting boundaries. That would hit at the feasibility and the constraint's enforceability.

  Structure the prep sheet clearly. List objections in order, with likelihood/damage ratings. For each, the objection in their terms, the response, and weaknesses. End with the nightmare question and a response that admits limitations but holds onto the principle.
answer: |-
  Here’s your Q&A prep sheet, prioritizing objections by likelihood (✓✓✓ = highest) and damage potential (★★★ = highest), tailored to your audience’s theoretical leanings. Responses are designed for ~2 minutes, with candid weakness assessments.

  ---

  ### **Q&A Prep Sheet: "Boundary Problem as Constitutional Moment & Revisability Constraint"**

  #### **1. Deliberative Democrat Objection (Likelihood: ✓✓✓ / Damage: ★★)**  
  **Objection (Vocabulary: "Inclusive Deliberation," "Non-domination"):**  
  *"Your revisability constraint postpones the core demand of deliberative legitimacy: *inclusion now*. Doesn’t proceduralizing exclusion risk perpetuating domination? In your coastal city case, the unincorporated settlement suffers *immediate* harms from sewage/labor policies. Why should they wait for a ‘standing procedure’ when they are clearly affected and subjected?"*  

  **Response (2 mins):**  
  "Thank you – this gets to the heart of my departure from ideal inclusion. I agree exclusion creates immediate harms, but the ‘affected’ and ‘subjected’ principles *cannot resolve* the coastal city dilemma cleanly. If we enfranchise the settlement based on shared sewage, do we include commuters who use city roads? If based on labor markets, do we include remote workers? Revisability addresses domination by ensuring the excluded have a *structural voice* to contest boundaries *over time*, turning episodic injustice into iterative political re-negotiation. It’s not deferral; it’s institutionalizing resistance. The coastal city’s legitimacy hinges *not* on perfect initial inclusion, but on whether settlers can force boundary revisions via petitions, courts, or protests recognized as valid inputs."  

  **Weakness:**  
  *Admits immediacy gap* – Revisability doesn’t eliminate present domination. It banks on future contestation as remedy, which may feel inadequate for critical theorists.

  ---

  #### **2. Immigration Theorist Objection (Likelihood: ✓✓✓ / Damage: ★★★)**  
  **Objection (Vocabulary: "Permanent Exclusion," "Non-citizen Governance"):**  
  *"Your constraint fails precisely where boundaries are most violent: when states govern non-citizens (e.g., undocumented migrants, occupied territories) with *no route to membership*. If the coastal city’s procedure only allows ‘challenge’ by residents of the settlement, but denies them even provisional standing, isn’t revisability empty? Isn’t this just legitimizing entrenched exclusion?"*  

  **Response (2 mins):**  
  "Devastating point – and why I insist revisability requires a *standing procedure accessible to the excluded*. In the coastal city, if settlers lack legal standing to petition or sue, the constraint is violated. My framework demands *institutional channels* for the excluded to initiate renegotiation. For undocumented migrants, this might mean sanctuary city motions, international courts, or civil society tribunals forcing visibility. The constraint isn’t satisfied by mere theoretical openness; it requires *actionable pathways*. Where none exist, the boundary is illegitimate *by design*."  

  **Weakness:**  
  *Institutional idealism* – Assumes states won’t deliberately design procedures to be inaccessible. Hard to enforce in non-democratic contexts.

  ---

  #### **3. Agonist Objection (Likelihood: ✓✓ / Damage: ★★)**  
  **Objection (Vocabulary: "Taming Conflict," "Depoliticization"):**  
  *"By channeling boundary conflicts into ‘procedures,’ aren’t you sanitizing the antagonism essential to politics? The coastal city’s exclusion isn’t a technical error – it’s *constitutive violence*. Revisability sounds like liberal pacification, turning settler rage into bureaucratic petitions. Shouldn’t we defend disruptive, extra-institutional protest as the true ‘constitutional moment’?"*  

  **Response (2 mins):**  
  "I share your concern about neutering conflict! But revisability *depends* on antagonism – it just insists that for a boundary to be legitimate, institutions must be *receptive* to that conflict. The coastal city’s procedure isn’t a ‘complaint box’; it’s a scaffold for settlers to escalate from petitions to strikes to civil disobedience *with the goal of reshaping membership*. Agonism is the engine; revisability ensures the system can’t ignore the engine’s heat. Without a path to institutional change, rupture risks becoming futile spectacle."  

  **Weakness:**  
  *Co-optation risk* – Procedures may dilute radical energy. Agonists rightly fear institutional recognition as disempowerment.

  ---

  #### **4. Historian of Political Thought Objection (Likelihood: ✓ / Damage: ★)**  
  **Objection (Vocabulary: "Constituent Power," "Sieyès’ Paradox"):**  
  *"Sieyès taught us constituent power resides *outside* the constituted order. If your revisability procedure is designed *by* the existing demos, doesn’t it presuppose the very authority it seeks to challenge? Who constitutes the revisers? This sounds like Rousseau’s Legislator problem – circularity masked as process."*  

  **Response (2 mins):**  
  "Brilliant catch – this is the meta-problem. My reply: constituent power isn’t a one-time event but a *recurring potential*. Revisability creates a *structured interface* between the constituted order (the coastal city’s assembly) and the constituent ‘outside’ (the settlers). The procedure’s design must be minimally pluralist (e.g., courts, ombuds) to avoid self-entrenchment. It’s not circular if the excluded can *break* the circle through sanctioned disruption. Sieyès’ rupture is distributed across time as iterative pressure."  

  **Weakness:**  
  *Procedural capture* – If the existing demos designs the procedure, it can rig it against meaningful change. History shows constitutions entrenching power.

  ---

  ### **The Question You Hope Nobody Asks (Likelihood: ✓ / Damage: ★★★)**  
  **Objection (Hybrid – Deliberative/Immigration):**  
  *"If revisability is your only constraint, could a demos legitimately exclude *all* non-members indefinitely, so long as it has a ‘procedure’ for them to appeal – even if that procedure is rigged to never grant inclusion? Isn’t this just majoritarian tyranny with a feedback loop?"*  

  **Response (2 mins – Grit your teeth):**  
  "This cuts to the absolute limit of my claim. Yes, a demos *could* design a sham procedure. But my constraint requires that challenges can *redraw* boundaries, not just vent. If the procedure has *zero* history of inclusion (e.g., no settler petition ever succeeded despite demographic shifts), it violates the spirit of revisability. Legitimacy demands *non-zero responsiveness*. That said, I concede: this is a gray zone. Revisability isn’t a panacea; it’s a *minimum threshold* to distinguish rigid exclusion from contested polity-building."  

  **Weakness:**  
  *Vagueness* – "Non-zero responsiveness" is slippery. Opens the door to "democratic decay" arguments where procedures exist but are hollow.  

  ---

  **Final Tip:** Preempt the historian/agonist by citing Machiavelli’s *tumult* or Rancière’s "wrong" as the fuel of revisability. For the immigration theorist, anchor examples in functional spaces (like your sewage system) where exclusion is materially unsustainable. Good luck – your argument is robust precisely because it embraces the mess!
