  First, the bioethics grad student might start with practical concerns. They'd ask how capacity-based consent works if personhood depends on recognition. The reply should clarify that the floor of basic personhood applies to all humans, so consent standards remain intact. But the concession is that the model could be misused, so safeguards are needed. This reply is soft because it doesn't fully address how consent functions in marginal cases.

