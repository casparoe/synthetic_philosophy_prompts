  The liberal political philosopher might warn that graded statuses can lead to dehumanization. The reply emphasizes the binary floor as a safeguard and the ceiling as voluntary participation. Concede historical abuses but argue that denying gradability is unrealistic. This is a strong reply but might not ease their fear of slippery slopes.

  The Kantian would be upset about gradability, seeing it as conflicting with dignity. The reply separates basic dignity (inviolable) from earned respect. Concede that Kantian dignity is foundational. The soft spot is whether the ceiling concept undermines inherent worth.

  The scariest question is the Kantian's because it challenges the core gradability claim. The reply that must land is the Parfitian one, distinguishing social personhood from metaphysical identity. If that fails, the paper's coherence is at risk.

