  Hmm, the user has a problem with their brother misusing Nietzsche's ideas to dismiss all moral arguments. The brother presents a tight logical argument that seems to undermine not just morality but even his own position. I need to find where this argument breaks down.

  Looking at the argument structure: 
  Premise (1) seems solid - Nietzsche does argue that moral concepts have historical origins in power struggles. 
  Premise (2) is where things get tricky. It claims that for a judgment to be trustworthy, its history must track truth. But this sets up an impossibly high standard - almost like requiring the origin story to contain the justification. 

  The key flaw is in (2)'s phrasing. It conflates "how we came to believe something" with "why we should believe it." The history of a belief is separate from its current justification. Even if moral concepts emerged from questionable origins, they might have evolved or been refined over time. 

  The brother's argument in (5) and (6) actually proves too much - it would debunk everything including genealogy itself. That's a classic self-defeating position. 

  By rejecting premise (2), we preserve the ability to evaluate beliefs based on current reasons rather than origins. The brother can still point out that moral concepts have messy histories (Nietzsche's core insight), but he can't use that alone to dismiss them entirely. 

  The cost is acknowledging that origins do matter somewhat - they can challenge naive assumptions about morality being "eternal truths." But we don't have to throw out the baby with the bathwater. Nietzsche's method survives as a valuable critique, just not as a total demolition of morality.
answer: |-
  Here's the breakdown of where your brother's argument fails, followed by the requested JSON summary:

  ### Diagnosis: The Critical Flaw
  The argument breaks at **Premise (2):**  
  *"A judgment is trustworthy only if its history is the kind of history that would track whether the judgment is true."*

  **Why it looked fine:**  
  It seems intuitively plausible – we often distrust beliefs with shady origins (e.g., believing something because of propaganda). It mimics how we evaluate scientific claims (e.g., trusting data from a calibrated instrument).

  **The Slide:**  
  Premise (2) commits a **modal scope shift** and an **equivocation on "history"**:
  1.  **"Would track" implies necessity:** It demands that the *entire historical process* must be inherently truth-conducive. This is impossibly strict. A belief can *accidentally* become justified *later* through refinement, evidence, or reasoned critique, even if its *origin* was non-truth-tracking (e.g., early scientific theories based on superstition).
  2.  **Conflates Genesis with Justification:** Premise (2) collapses the *origin* of a belief (its causal history) with its *current justification* (reasons/evidence supporting it *now*). Nietzsche's genealogy brilliantly exposes origins, but it doesn't automatically invalidate current reasons for holding the belief. The *truth* or *warrant* of "cruelty is wrong" must be evaluated on arguments and evidence *now*, not *solely* on its bloody genealogy.

  ### What Rejecting Premise (2) Costs You & What Survives
  *   **Cost of Rejecting (2):** You give up the idea that a belief's origin **alone** and **necessarily** determines its trustworthiness. You cannot dismiss a moral judgment **purely** by pointing to its ugly history. You must engage with the substance of the judgment itself.
  *   **What Survives of the Debunking:**
      *   Nietzsche's core insight **(Premise 1 & 3)** largely stands: Moral judgments *do* have complex, often "grubby," power-laden, historically contingent origins. They are not "revealed truths" or purely rational deductions.
      *   This history **challenges naive realism** about morality: It shows morality isn't "written in the stars" but emerges from human struggles.
      *   It **demands humility**: Recognizing the contingent origins should make us wary of asserting our morals as absolute, universal, or unquestionable.
      *   It **can be suspicious**: A shady origin *can* be a *reason* to scrutinize a belief more carefully, but it's not *sufficient* to reject it outright.

  ### Why (6) is a Red Herring
  Your brother tries to trap you with (6): "Either origins don't matter (debunking dead) or they destroy everything (including genealogy)." Rejecting (2) avoids this false dilemma:
  1.  **Origins *do* matter**, but not in the *absolute, truth-destroying* way Premise (2) claims. They matter *contextually* and *critically*, not *decisively*.
  2.  **Genealogy survives** as a powerful *critical tool*, not as a foundational truth-machine. Its value lies in exposing contingency and power dynamics, not in needing its *own* origin to be "truth-tracking" in the sense demanded by (2). We can judge genealogy *useful* or *insightful* based on its current explanatory power, regardless of its origins.

  ### How to Respond
  *   "You're right that morals have messy histories **(1 & 3)**, and that's important. But **Premise (2) is wrong.** Where a belief *came from* doesn't automatically tell us if it's *true now*. Just like we don't reject modern medicine because it came from bloodletting and humors, we can't reject 'don't be cruel to mom' *just* because resentment played a role in morality's history. The *reason* it's wrong to be cruel to her isn't resentment; it's the pain it causes *right now*. Genealogy is a great spotlight on history, but it can't dissolve every moral argument just by shining that light. Your method survives as critique, not self-destructing dogma."

