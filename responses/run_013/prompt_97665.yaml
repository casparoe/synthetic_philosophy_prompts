prompt: |-
  My brother's been reading Nietzsche's genealogy of morals all summer and now he's decided every moral judgment is just dressed-up resentment, and he uses it to get out of every argument. When I told him he was being a jerk to our mom he said thats just slave morality talking. The annoying thing is the argument he gave me is better than I want it to be. Heres how he puts it, cleaned up:

  (1) Every moral judgment has a history — it came from somewhere, some practice, some power relation, some cruelty that got turned inward.

  (2) A judgment is trustworthy only if its history is the kind of history that would track whether the judgment is true.

  (3) The history of our moral judgments isn't like that. It's contingent social stuff — resentment, punishment, internalized cruelty — none of which is sensitive to whether something like "cruelty is wrong" is actually true.

  (4) So our moral judgments aren't trustworthy.

  (5) But you can run the same move on anything. Our belief that cruelty is wrong, our belief that truth matters, our belief that genealogy is even a good method — all of it has a grubby contingent history.

  (6) So genealogy isn't trustworthy either, and if he holds onto (2) he can't use (4) to win an argument without sawing off the branch he's sitting on.

  He says (6) is a gotcha I stole off reddit and that I have to choose: either origins don't matter, in which case his whole debunking is dead, or they do, in which case everything including his own method is dead. I can't accept (6) but I dont want to just say "nah." Where does this actually break — is it one of the premises, or is there a slide somewhere between two of them? And if I give up whichever step it is, what does that cost me — what do I lose, and does he get to keep any of his debunking?

  After you give me the diagnosis, put a short structured summary at the end as a JSON object with these fields: "rejected_step" (the number and a one-line statement of it), "why_it_looked_fine" (one or two sentences), "the_slide" (the equivocation, scope shift, or modal slide if there is one, else null), "cost_of_rejecting" (what the asker gives up), "what_survives" (what of the debunking argument, if anything, still stands).
