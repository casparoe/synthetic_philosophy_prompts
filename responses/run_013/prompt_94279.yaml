  Me and a mate are stuck arguing about hypocrisy and I want an actual number out of you rather than 'it depends'. Here's the claim I want your credence in: when someone blames you for a wrong they've committed themselves and never really owned up to, their hypocrisy removes their standing to blame you — i.e. the blame isn't just irritating, it's defective, they're not in a position to issue it at all. I'm at about 0.3, he's at 0.9, and I suspect we're not even disagreeing about the same thing. So give me your number, but mainly give me the decomposition — how much hangs on whether 'standing' is a geniune normative status versus a dressed-up way of saying 'I don't have to listen to you'; how much on whether standing tracks the blamer's own record at all, versus the particular relationship, versus the blamer's present commitment to the norm they're invoking; how much on whether a past wrong of the same kind blocks standing outright or only dims the blame; and how much on whether the person being blamed has to actually be able to raise it. Then say which of those is doing the heavy lifting, and what would actually move your number. Also — the bit I can't get straight — what happens one level up: if I blame him for blaming me hypocritically, where does my standing come from, and does his lack of standing make my second-order blame fine? If you reckon that's a separate question, say so and price it on its own.
