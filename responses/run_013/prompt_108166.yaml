  Hmm... their opening challenge is sharp. They're attacking the coherence of Aristotle's "just price" concept by arguing that if value depends on fluctuating needs and money is conventional, then all exchange becomes arbitrary. They also question why lending at interest should be unnatural when other productive loans (like seed) aren't condemned. 

