answer: |-
  A just price is neither vacuous nor arbitrary, for "need" (*chreia*) is not mere subjective whim but the objective requirement for life within the *polis*. The housebuilder needs shoes, the shoemaker needs shelter – this reciprocity of essential functions grounds a proportionate relationship reflecting the value each contributes to the common good. Yes, a thirsty man *would* pay more for wine, but such a transaction occurs outside the norm of *equitable exchange between producers*. The just price arises from the *telos* of each craft: a house shelters many, shoes protect feet; their equivalence reflects the socially necessary labor and utility fulfilling distinct human needs within the community’s natural order. Money, as the conventional symbol of this underlying need-based reciprocity, measures this proportionate contribution – it does not invent value arbitrarily.

  Usury is unnatural precisely *because* money is conventional and instrumental! The farmer lends *seed* – a natural thing with the inherent potential (*dynamis*) to bear fruit through its union with soil and labor. The harvest increase stems from nature’s generative power, not the seed *qua* seed. Money, however, exists *only* by convention to facilitate exchange; it has no inherent generative power. Its *telos* is to be a measure and medium, not a self-multiplying substance. The usurer treats the token *as if* it were fertile seed, demanding it "breed" independently of any natural process or productive activity. This perverts money from its natural function as an instrument of reciprocal need into an end that devours reciprocity – making barren metal "productive" while the lender contributes nothing to the common good. The grasping man violates proportion; the usurer violates the very nature of money.
