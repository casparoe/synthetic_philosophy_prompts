prompt: |-
  When philosophers distinguish knowing how to do something from knowing that something is the case, they usually leave open where the know-how is supposed to reside. I want the two main answers compared.

  The first answer puts it in the knower. To know how to swim, on this view, is to possess an ability constituted by states and dispositions of the agent — a practical grasp that survives changes in circumstance and is lost only when something changes in the agent. A paralysed swimmer still knows how to swim, much as a locked door is still a door: the knowledge is blocked rather than diminished.

  The second answer puts it in the relation between knower and world. On this view, know-how is a standing relation between an agent and a situation that affords the activity, and it is carried partly by instruments, layouts, routines, and other people. Strip away the surgeon's theatre, the navigator's stars, or the rower's crew, and the know-how itself is diminished rather than merely prevented from being exercised.

  Please compare the two. Address at least the following: which gives the better account of the skilled practitioner who cannot say what she is doing, and whether that fact is evidence for either side; which gives the better account of the person who can recite a procedure perfectly and still cannot perform it; whether the two are genuine rivals or answers to different questions — the constitution of a state versus the conditions of its exercise — and if the latter, what of substance remains in dispute; whether the second answer collapses the distinction between knowing how and knowing that or merely relocates it, taking as your test cases a written procedure that any competent reader could follow and a tool that only a competent user can use; and what each answer makes of two awkward phenomena, namely that know-how appears to come in degrees while knowing-that does not, and that a crew can do something none of its members can do alone. Conclude by saying which answer you would defend and naming the single case that does the most damage to the one you reject.
reasoning: |-
  Okay, the user is asking about two philosophical perspectives on know-how. The first view sees know-how as an internal ability within the person—like the paralyzed swimmer who still "knows how" to swim even if they can't physically do it right now. The second view sees know-how as existing in the relationship between the person and their environment, involving tools, other people, and situations—like a surgeon needing their operating theater or a rower needing their crew.

  The user wants several specific points addressed. I need to consider cases like skilled practitioners who can't articulate their knowledge—this seems to favor the internal view since their ability persists even without explanation. Then there's people who can recite procedures but can't perform them—this clearly supports the internal view over the external one.

  I wonder if these views are actually competing or just answering different questions—one about what constitutes knowledge, the other about enabling conditions. But there seems to be genuine disagreement about where knowledge fundamentally resides.

  For the know-how vs know-that distinction, the external view might blur this by incorporating procedural knowledge (like written instructions anyone can follow) while maintaining it for specialized tools only experts can use. Interesting challenge there.

  The user also raises two tricky phenomena: know-how coming in degrees (unlike propositional knowledge), and groups accomplishing things no individual could do alone. The internal view struggles with degrees while the external handles it naturally through environmental scaffolding. The group case strongly favors the external view—that crew rowing example is compelling.

  I think I lean toward the external view. The most damaging case for the internal view seems to be that group phenomenon—if no single member knows how to row as a crew but together they can, that really challenges the idea that know-how resides purely in individuals. The internal view would have to call this something other than know-how, which feels unsatisfying.
answer: |-
  Here's a systematic comparison of the two accounts of know-how, addressing your specific points:

  ### 1. **The Skilled Practitioner Who Cannot Articulate**
      *   **Internalist View:** Strongly accommodates this. The "practical grasp" is non-propositional (not consisting of "that"-claims). A chef's knife skills or a musician's intuitive phrasing reside in embodied dispositions, not verbalizable rules. *This is strong evidence for internalism*, showing know-how's independence from knowing-that.
      *   **Externalist (Situated) View:** Can accommodate this, but less naturally. The practitioner's skill is a relation *enabled* by tools/context, but the inability to articulate might still point to an *internal* component (the agent's attunement to the situation) that isn't propositional. The fact itself isn't primary evidence *for* externalism.

  ### 2. **Reciting the Procedure Without Performing**
      *   **Internalist View:** Excellently explains this. Knowing-that (the procedure) is distinct from and insufficient for know-how (the ability). Reciting rules is propositional knowledge; performing requires the internal practical capacity. This is a classic argument *for* internalism.
      *   **Externalist View:** Struggles significantly. If know-how is the agent-in-situation relation, someone who knows the procedure *and* is in the right situation *should* be able to perform. This case highlights the *necessity* of an internal ability that mere situational presence + propositional knowledge cannot provide. It damages the externalist claim that know-how is *primarily* relational.

  ### 3. **Genuine Rivals or Different Questions?**
      *   **Initial Distinction:** There's an element of different foci. Internalism focuses on the *constitutive basis* of the know-how state (what it *is*: an internal ability). Externalism focuses on the *necessary enabling conditions* for the know-how *to be what it is* (it *requires* the situation).
      *   **Genuine Rivalry:** **Yes, they are rivals.** The core dispute is ontological: *Where does the know-how primarily reside?*
          *   Internalism: The know-how *is* the internal state/ability; the situation enables its *exercise* but isn't part of the know-how itself. The paralyzed swimmer *has* the know-how.
          *   Externalism: The know-how *is* the relation; the internal state is merely one *component*, insufficient alone. Strip the situation, and the know-how itself diminishes. The swimmer without water *lacks* full swimming know-how.
      *   **Substance of Dispute:** The dispute centers on **dependence** and **location**. Is the internal ability sufficient to *possess* know-how (even if not to exercise it), or is the situation constitutive of the know-how itself? This has implications for skill attribution, loss of knowledge, and the metaphysics of abilities.

  ### 4. **Collapsing/Relocating Knowing-How vs. Knowing-That?**
      *   **Test Case 1: Written Procedure (Any Competent Reader):**
          *   Internalism: Clearly distinct. Knowing *that* the steps are X,Y,Z is propositional. Knowing *how* to perform them effectively requires internal ability/practical grasp.
          *   Externalism: *Relocates* but doesn't collapse. Knowing-*that* the steps exist is still propositional. Knowing-*how* now includes the reader's ability to *use* the text *in the relevant situation* as a tool. The know-how involves the situated action of following instructions. The distinction persists: knowing the text exists (knowing-that) vs. competently enacting the procedure using the text/situation (knowing-how).
      *   **Test Case 2: Tool Only a Competent User Can Use:**
          *   Internalism: Highlights the internal ability. The competent user possesses the internal practical grasp; the novice, even with the tool, lacks it.
          *   Externalism: Know-how is the *relation* between the *competent* user and the tool/situation. The novice + tool does *not* constitute the know-how relation. The distinction is maintained: knowing facts *about* the tool (knowing-that) vs. the skilled, situated use *of* the tool (knowing-how).
      *   **Verdict:** The externalist view **relocates but does not collapse** the distinction. Know-how remains a *type of action or disposition to act skillfully within a context*, distinct from merely possessing propositional knowledge, even as it incorporates external elements.

  ### 5. **Awkward Phenomenon 1: Know-How Comes in Degrees**
      *   **Internalist View:** **Problematic.** While abilities can be more or less developed, the *possession* of the core know-how seems binary (you know how to swim or you don't). Explaining fine-grained skill differentials (expert vs. novice swimmer both "know how") solely via internal states is strained. Is it multiple distinct abilities or degrees of one?
      *   **Externalist View:** **Accommodates naturally.** The agent-situation relation can readily admit of degrees – stronger, more reliable, more attuned, more deeply integrated with a richer set of external supports (better tools, more stable environment, more synchronized team). Expertise *is* a richer, more robust relation.

  ### 6. **Awkward Phenomenon 2: Crew Know-How**
      *   **Internalist View:** **Problematic.** If know-how resides solely in individuals, the crew's ability must be reduced to the sum of individual know-how plus coordination rules (knowing-that). But the phenomenon suggests a *distinct collective know-how* – the ability emerges from the interaction and isn't possessed by any single member. Internalism struggles to locate this emergent ability.
      *   **Externalist View:** **Accommodates excellently.** The crew's know-how *is* the specific, organized relation between the rowers, the boat, the coxswain (if any), the water, and their synchronized actions. It's a system-level property residing in the situated interaction. No single agent possesses it alone because it *is* the relational structure itself.

  ### Conclusion: Defense and Damaging Case

  *   **Defended View: Externalist (Situated) View.** While internalism powerfully explains articulation gaps and the procedure/performance divide, the externalist view offers a more holistic and realistic account of skilled action as inherently contextual. It naturally handles degrees of skill, collective know-how, and the deep dependence of expertise on environmental scaffolding observed in real-world practice (surgery, navigation, team sports, craftwork). It better reflects how knowledge is distributed in socio-technical systems.
  *   **Most Damaging Case for the Rejected View (Internalism):** **The Crew Know-How.** This case decisively challenges the internalist claim that know-how resides solely within the individual agent. The fact that a cohesive crew can expertly row a complex boat *when no individual member possesses the knowledge or ability to do so alone* demonstrates that know-how can be an emergent property of the *relation* between agents and their shared environment/tools. The internalist is forced to either deny this is genuine know-how (counter-intuitive) or reduce it to individual know-how plus coordination rules (which fails to capture the irreducible, situated, collective skill). This phenomenon strongly suggests that know-how fundamentally exceeds the boundaries of the individual mind.
