prompt: |-
  I'm in a philosophy-of-technology reading group this term (Thursdays, it's the only thing keeping me sane) and we keep re-fighting the same fight: does an artifact ever have politics of its own, or is the politics always in the people around it? I'm bored of the usual verdicts, everyone agrees the parkway bridges are a great example and everyone agrees the internet isn't inherently democratic, so I want to try a different cut. Here's the test I've been argueing for with my friend Priya, call it the swap test: hold the social arrangements fixed — same people, same laws, same intentions, same money — and swap the artifact for some other device that everyone involved would agree does the same job. Score 0 if the political effect survives the swap (so it was never really about the artifact), score 1 if the effect dies with the device (so the artifact was carrying the politics). Under that test, give me a tier list (S/A/B/C) of the following, one line of justification each, and don't hedge into "it depends" without saying what it depends on: the overpasses built too low for buses to pass under, so the beach stayed for people with cars, or so the story goes; the pneumatic molding machines the reaper works brought in to replace the striking iron molders; the mechanical tomato harvester that made the growers bigger and the pickers redundant; a speed bump; the Berlin key, the one that only comes out of the lock after you've turned it back and locked the door behind you; a QWERTY keyboard; the prepay smart meter that cuts your power off when the credit runs out; and one from my own life, the seminar room in our building has the projector cable padlocked to the lectern so the screen can only be on the left wall, which means any seminar that uses slides is stuck in a layout where half the room can't see anything once the sun's out.

  Then the part I actually care about. I can't tell if the swap test proves too much or too little. Too much, because for every item on that list you can describe a "functionally equivalent" alternative that dissolves the politics, which would make the whole question of artifacts having politics evaporate. Too little, because what counts as the same job is doing all the work, and I suspect I'm smuggling in whichever description of the case makes my answer come out right — the bridge that carries cars to the beach and the bridge that carries the right kind of people to the beach aren't the same artifact, but they're the same object. So: fix the test for me as best it can be fixed, tell me which of the eight items it then gets obviously wrong, and if the honest answer is that the criterion can't be stated without already deciding the case, say that instead and tell me what that does to the original question. No reading list or citations, I have the literature, I just want the tiers and the diagnosis.
reasoning: |-
  Okay, the user is in a philosophy-of-technology reading group and they're stuck in a debate about whether artifacts have inherent politics or if politics come solely from the people and social arrangements around them. They've proposed a "swap test" to evaluate this: keep everything else the same but swap the artifact with another that does the same job. If the political effect remains, the artifact wasn't the carrier (score 0); if the effect disappears, the artifact was key (score 1). They want a tier list for eight examples with justifications and then a critique of their test.

  First, I need to apply their swap test to each item. The user listed:

  1. Low overpasses keeping buses out.
  2. Pneumatic molding machines replacing strikers.
  3. Mechanical tomato harvester changing labor dynamics.
  4. Speed bump.
  5. Berlin key requiring double turn.
  6. QWERTY keyboard.
  7. Prepay smart meter cutting power.
  8. Padlocked projector cable forcing layout.

  For each, I'll determine if swapping the artifact while keeping social factors constant changes the political outcome. The tier list (S, A, B, C) will rank how clearly the artifact carries the politics post-swap.

  Starting with the low bridges. If replaced with a different barrier that still blocks buses but isn't a bridge, the effect persists. So score 0. That's a C tier because the function itself is political, not the specific artifact.

  Pneumatic machines: swapping with another automation device that replaces labor would still break the strike. The artifact isn't unique here. Score 0, C tier.

  Tomato harvester: Any efficient harvester would displace workers and favor large farms. The specific machine isn't crucial. Score 0, C tier.

  Speed bump: If replaced with a hump or chicane, the traffic calming remains. But if the swap removes the physical constraint, the effect vanishes. However, any physical barrier would work, so the artifact type matters, but not the specific one. Score ambiguous? Maybe B tier since the constraint is inherent to such devices.

  Berlin key: Swapping with a regular key changes everything. The double-turn mechanism enforces the behavior. Score 1, S tier. The artifact is irreplaceable for that political effect.

  QWERTY: Changing to Dvorak might not alter lock-in if standards persist. But if swapped with an alternative layout without the inefficiency, the path-dependence effect might dissolve. However, the lock-in is social, not technical. Score 0? But the artifact's design perpetuates inefficiency. Tricky. A tier since the effect is tied to QWERTY's specific history.

  Prepay meter: If swapped with a traditional meter, disconnection requires human intervention. The automated cut-off is inherent to prepay tech. Score 1, S tier.

  Padlocked cable: Any fixture restricting screen position would cause the same issue. The lock isn't necessary; any fixed attachment would suffice. Score 0, C tier.

  Now, the critique. The user suspects the test is flawed because defining "same job" can be manipulated. For example, the bridge's job could be "allowing car access" (political) or "blocking buses" (which makes the artifact political). The test's outcome depends on how we frame the function.

  Also, the Berlin key example shows that some artifacts embed politics in their mechanics (score 1). But for cases like the harvester, even a different machine might cause similar effects, making the artifact seem less crucial (score 0).

  To fix the test: We must define "same job" as the intended function by the designers/users, but that's subjective. Alternatively, focus on whether the artifact's material properties are necessary for the effect. However, this might still be socially contingent.

  The test fails for QWERTY and speed bumps because QWERTY's lock-in is social, not technical, and speed bumps could be replaced with other physical constraints. But for Berlin key and prepay meters, the technical mechanism is inseparable from the politics.

  So the honest answer might be that the criterion can't be neutral. How we define the artifact's function already decides the case. This suggests artifacts don't have politics "of their own" but are enacted through sociomaterial practices. The original question might need reframing: Artifacts participate in politics, but not independently.
answer: |-
  Here's the tier list under your swap test (S=artifact essential to politics, C=artifact incidental), followed by the diagnosis. **Tier justifications** strictly apply your test: "same job" = *declared primary function by users/designers*, "political effect" = *concrete outcome in the scenario described*.

  ---

  ### **Tier List & Justifications**  
  **S-Tier (Artifact *is* the politics; effect dies without it)**  
  - **Berlin Key**: Swapping it with a standard key (same job: secure entry/exit) removes the enforced ritual of locking behind you. The coercion is mechanized. *Score: 1*.  
  - **Prepay Smart Meter**: Swap with a postpay meter (same job: pay-for-power). Disconnection now requires human intervention/policy change. Automated exclusion dies. *Score: 1*.  

  **A-Tier (Artifact heavily enables politics; effect weakens or transforms)**  
  - **Speed Bump**: Swap with a "slow down" sign (same job: traffic calming). Physical coercion becomes voluntary compliance. Equity impact (e.g., access for disabled) dissolves without the barrier. *Score: 0.5 – effect morphs*.  
  - **QWERTY Keyboard**: Swap with Dvorak (same job: typing). Path-dependence/lock-in *might* persist if social habits remain, but the inefficiency *as a labor-discipline tool* fades. Test ambiguous but leans artifact-dependent. *Score: ~0.75*.  

  **B-Tier (Artifact facilitates but doesn't dictate; effect persists weakly)**  
  - **Pneumatic Molding Machines**: Swap with 3D printers (same job: mold production). Capital still breaks strikes via automation, but the *symbolic violence* of replacing skilled labor with machines softens. Effect survives, diluted. *Score: 0*.  
  - **Padlocked Projector Cable**: Swap with a short cable bolted to the lectern (same job: secure AV gear). Sun-blindness issue remains. The lock isn’t essential; any fixed tether enables the exclusion. *Score: 0*.  

  **C-Tier (Politics are social; artifact is interchangeable)**  
  - **Low Bridges**: Swap with a "no buses" sign or narrow gate (same job: regulate beach access). Exclusion of bus-riders persists via policy/design. Bridge height isn’t necessary. *Score: 0*.  
  - **Mechanical Tomato Harvester**: Swap with GMO tomatoes + cheaper labor (same job: harvest efficiently). Growers still consolidate power; pickers redundant. Effect is economic, not tied to harvester mechanics. *Score: 0*.  

  ---

  ### **Diagnosis: Why the Swap Test Fails (and How to Band-Aid It)**  
  **The Core Flaw**: "Same job" is *politically loaded framing*. Your test collapses because defining an artifact’s "job" smuggles in the politics you’re trying to isolate.  

  - **Proof it "Proves Too Much"**: For every S-tier example, you *could* argue a broader "job" description dissolves the politics. Berlin Key’s job is "security"? Swap with a guard who enforces locking—politics survive. Prepay meter’s job is "cost recovery"? Swap with punitive late fees—effect persists.  
  - **Proof it "Proves Too Little"**: For C-tier examples, you *could* define the job narrowly to *force* artifact-dependence. Low bridge’s job is "block buses"? Only a low structure works—suddenly it’s S-tier.  

  **Band-Aid Fix**: Tighten "same job" to **material function only** (e.g., "transfer force," "conduct electricity," "restrict movement"). This *kinda* works for **Berlin Key** (physical double-lock mechanism) and **Prepay Meter** (autonomous energy cutoff circuit). But it fails catastrophically elsewhere:  
  - **Gets QWERTY Wrong**: Materially, all keyboards "register keystrokes." Swap *should* score 0, but you tiered it A. Path-dependence isn’t material.  
  - **Gets Low Bridges Wrong**: Materially, it "supports vehicles under X height." Swap with a tunnel of identical clearance—effect identical (C-tier). But this ignores that clearance *is* the politics.  

  **Honest Answer**: **The criterion can’t be stated neutrally**. Deciding the "job" *is* deciding whether politics reside in the artifact or its context. This reveals the original question’s flaw: artifacts don’t "have" politics *or* "transmit" them like a pipeline. **Politics emerge in the artifact-society feedback loop**. The bridge isn’t political alone, nor are the planners—but *low-clearance infrastructure* as a sociotechnical system *enacts* exclusion. Your test tries to split this loop; don’t. Instead, ask: *How does this artifact harden, resist, or amplify social forces?* That’s what your S-tiers do best.  

  **Effect on the Original Question**: It dissolves. Artifacts aren’t vessels *of* politics but sites *for* politics—where design, use, and power negotiate outcomes. The pneumatic machine didn’t "have" anti-union politics; it was a weapon *in* class struggle. Focus on *how* artifacts stabilize or disrupt power, not who "owns" the politics. (Priya owes you a drink for this.)
