prompt: |-
  I'm a philosophy proff and I keep getting stuck on a puzzle about how asylum claims get decided. Adjudicaters often judge credibility by whether the applicant's account of persecution is internally consistent, chronological, and hangs together as a single coherent story. If the story shifts, loops, or comes out in fragments, that counts against them, even when they're describing trauma. What view of the self does that practice presuppose? Does it require that personal identity just is a narratable story—a center of narrative gravity—or only that a coherent story is good evidence of a stable self? And is there a tension between treating the narrative as an abstraction we posit for practical purposes and treating it as something the applicant must actually possess? Reconstruct the implicit theory, say which parts the practice strictly needs versus what it merely fits with, and tell me what would change if we replaced it with a view of the self as fragmented, multiple, or situationally constructed. Keep it concrete. End with a one-sentence summary as the last line, starting with "Summary:".
reasoning: |-
  Okay, the user is a philosophy professor grappling with a puzzle about asylum adjudication practices. They're noticing that credibility assessments rely heavily on narrative coherence - consistency, chronology, and unity in applicants' stories of persecution. The professor wants to unpack the underlying theory of selfhood this presupposes. 

  Hmm, this connects to deep philosophical questions about personal identity. The practice seems to assume that a "real" self produces linear, unified narratives. That feels problematic when applied to trauma survivors whose memories might be fragmented. The professor is sharp to catch this tension between legal practicality and psychological reality.

  Let me break this down systematically. First, the implicit theory: adjudicators act as if a coherent story proves a stable self exists. But do they need to believe the self fundamentally is that narrative, or just that narrative coherence correlates with truthfulness? The distinction matters ethically. 

  The core requirement seems to be that narrative coherence indicates credibility. But the practice uncomfortably slides toward treating coherence as constitutive of selfhood, especially when inconsistencies are seen as "deceptions" rather than trauma symptoms. That's where it overreaches.

  If we switched to a fragmented/multiple self model - say, embracing Dennett's heterophenomenology or Hermans' dialogical self - everything changes. Credibility assessment would prioritize triggers and emotional truth over linearity. We'd need new metrics like trauma-informed inconsistency analysis. 

  The professor's unease is warranted. This legal framework imposes a Cartesian narrative-self standard that pathologizes normal trauma responses. My summary must crystallize that tension: "Summary: The practice necessitates treating narrative coherence as evidence of credibility but problematically presupposes it as constitutive of a stable self, pathologizing trauma-induced fragmentation."
answer: |-
  The adjudication practice you describe implicitly relies on a **narrative theory of the self**, specifically presupposing that a stable, continuous, unified self is best expressed through—and evidenced by—a coherent, linear life narrative. Here’s the reconstruction:

  ### Implicit Theory of the Self
  1. **Unified Selfhood**: The self is an enduring entity with consistent memories and experiences.  
  2. **Narrative as Evidence & Essence**:  
     - **Necessary for practice**: Coherence is treated as *reliable evidence* of a truthful account (i.e., inconsistencies suggest deception or unreliability).  
     - **Implicitly presupposed**: A coherent narrative is not just evidence but reflects the *actual structure* of a rational, agential self. Trauma is seen as an external disruption to this core narrative competence.  
  3. **Temporal Stability**: The self’s identity is anchored in chronological continuity—past events should be recallable in sequence.  
  4. **Agency & Authorship**: The applicant is presumed to be the sole "author" of their story, capable of recounting it objectively despite trauma.  

  ### What the Practice Strictly Needs vs. What It Merely Fits With
  - **Strictly Needs**:  
    - That narrative coherence is a *practical epistemic tool* for assessing credibility.  
    - That deviations (inconsistencies, fragmentation) indicate unreliability (whether due to deception or cognitive disruption).  
  - **Fits With (but doesn’t strictly require)**:  
    - A metaphysical view of the self *as* a narrative ("center of narrative gravity" à la Dennett).  
    - The idea that the self *must possess* an integrated story as an intrinsic feature.  

  ### Tension: Abstraction vs. Possession
  The practice conflates the narrative as a **functional abstraction** (a tool for verification) with the narrative as an **ontological necessity** (something the applicant "must possess"). This creates a contradiction:  
  - **As abstraction**: The story is a constructed tool for legal purposes.  
  - **As possession**: The applicant is penalized for failing to "have" a coherent story, treating fragmentation as a flaw in the *self*, not just the testimony.  

  ### Shifting to a Fragmented/Multiplicity/Situational Self
  If we adopted a view of the self as non-unitary (e.g., Hermans’ dialogical self, trauma theory’s dissociative identity, or Goffman’s situational self), the practice would transform radically:  
  1. **Credibility Metrics**:  
     - Internal inconsistency/fragmentation becomes *expected* in trauma survivors.  
     - "Incoherence" might indicate *authenticity* (e.g., dissociative gaps, triggered speech).  
  2. **Evidence Focus**:  
     - Corroborating *emotional truth* (affective resonance) over chronological precision.  
     - Accepting non-linear recall (e.g., flashbacks) as valid testimony.  
  3. **Procedural Changes**:  
     - Trauma-informed interviews prioritizing emotional safety over interrogation.  
     - Weight given to experts explaining how trauma disrupts narrative coherence.  
  4. **Outcomes**: Fewer rejections based on "implausible" sequencing or fragmented recall, but potential challenges in verifying facts without linear anchors.  

  **Summary**: The practice necessitates narrative coherence as a credibility criterion but problematically presupposes a unified self, pathologizing trauma-induced fragmentation; shifting to a fragmented-self model would prioritize affective truth and contextual reliability over linear cohesion.
