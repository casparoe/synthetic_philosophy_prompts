answer: |-
  Based on your intuitions and the tentative principle you proposed ("a fact confirms a theory just in case, had I not already known the fact, learning it would have raised my confidence in the theory"), here's a refined principle that fits all your cases without requiring per-case exceptions, along with an explanation of how it handles your scenarios and the new cases you mentioned.

  ### The Refined Principle
  **A known fact \(F\) confirms a theory \(T\) if and only if:**
  1. **\(T\) is independently motivated** (it wasn't invented solely to fit \(F\) or is non-tautological), **and**
  2. **Learning \(F\) would have raised your confidence in \(T\) in a counterfactual scenario where you didn't know \(F\) but knew all other relevant background information (including \(T\) itself).**

  This principle resolves the "old evidence problem" by using a counterfactual test (your original idea) while adding an independence constraint to rule out circular or trivial explanations. It preserves all your gut verdicts:

  ### Validation Against Your Cases
  1. **CV joint click (known fact, mechanic's theory)**  
     ✅ Confirms:  
     - \(T\) (CV joint wear) is independent (mechanic's expertise).  
     - If you hadn't known about the click, learning it would boost confidence in \(T\).  

  2. **Self-invented CV joint label**  
     ❌ No confirmation:  
     - \(T\) (your label) isn't independent—it's invented to fit the fact.  
     - Learning the click wouldn't raise confidence in \(T\) since \(T\) has no explanatory power.  

  3. **Stock-trade rule built from data**  
     ❌ No confirmation:  
     - \(T\) (sell during waning moon) isn't independent—it's constructed from \(F\).  
     - In the counterfactual, \(T\) wouldn't exist before seeing \(F\), so learning \(F\) couldn't raise confidence.  

  4. **Pre-existing stock-trade rule**  
     ✅ Confirms:  
     - \(T\) is independent (proposed before seeing your data).  
     - If you hadn't known \(F\), learning it would boost confidence in \(T\).  

  5. **Printer jams because it's Tuesday**  
     ❌ No confirmation:  
     - \(T\) ("because it's Tuesday") is tautological—it just restates \(F\).  
     - Learning \(F\) (jams on Tuesday) wouldn't raise confidence in \(T\) since \(T\) adds nothing.  

  6. **Grandparents' town and migration route**  
     ✅ Confirms:  
     - \(T\) (migration route) is independent (learned from external source).  
     - If you hadn't known \(F\) (shared hometown), learning it would boost confidence in \(T\).  

  7. **Two friends' testimony**  
     - *Dependent sources*: ❌ Not twice as confirmed (no independence).  
     - *Independent sources*: ✅ Twice as confirmed (independence allows additive effect).  
       - *But note*: This case is about evidence *for a fact*, not a fact confirming a theory. The principle above still holds—it addresses how facts confirm theories, not how reports confirm facts. Your intuition here aligns with the *independence* clause: independent sources make the fact stronger evidence for any theory it supports.  

  8. **Certainty and probability boost**  
     ✅ Resolved:  
     - The counterfactual test avoids violating probability rules. If you're certain of \(F\), *actual* conditionalization can't change \(P(T)\). But in the counterfactual (where \(P(F) < 1\)), learning \(F\) *would* raise \(P(T)\). The boost reflects this counterfactual support.  

  ### New Cases: What the Principle Says
  **Case A: Theory explains a known fact but predicts nothing else**  
  - *Example*: You know stars emit light. A theory \(T\) says "photons exist to explain starlight" but predicts nothing new.  
  - **Verdict**: ❌ No confirmation.  
    - Why? \(T\) isn't independently motivated—it's reverse-engineered for \(F\). If you didn't know \(F\), learning it might slightly boost \(T\), but \(T\)'s lack of independent plausibility or predictions weakens it (like your Case 2).  

  **Case B: Fact implied by a theory you already believed**  
  - *Example*: You believe Newtonian physics (\(T\)). Later, you realize it implies "apples fall straight down" (\(F\)), which you already knew.  
  - **Verdict**: ✅ Confirms.  
    - Why? \(T\) is independent (you believed it before noticing the implication). If you hadn't known \(F\), learning it would boost confidence in \(T\). The "aha!" moment reflects counterfactual support.  

  ### Why This Works
  - **Independence** blocks circularity (Cases 2, 3, 5).  
  - **Counterfactual learning** handles old evidence and certainty (Cases 1, 6, 8).  
  - **Two friends (Case 7)** isn't about facts confirming theories, so it doesn't break the principle. Your intuition there aligns with how *evidence sources* work, not the core principle.  

  ### If You Must Give Up a Verdict
  If forced to sacrifice one case for simplicity, **give up Case 7** (two friends) as it's tangential. Your other intuitions are consistent and philosophically robust—they align with Bayesian solutions to the old evidence problem (e.g., Garber's approach). The principle stands in one sentence:  
  **A known fact confirms a theory if the theory is independently motivated and would have gained support from the fact if the fact were new.**
