prompt: |-
  I run a small online store selling vintage stereo gear. I've got about $4,000 in cash that I can either keep as a buffer or use to buy inventory. There are these weekly online auctions where each lot costs $200. From my experience, about 60% of lots have stuff I can flip for $400 total, and 40% are duds worth nothing. So the average is good, but if I buy alot and hit a bad streak I'm wiped out. A buddy says just put all $4,000 into the lots with the best odds, because on average you come out ahead. Another buddy says never bet more than a small slice on any one lot, because you have to survive to keep playing. I also have rent and a kid, so losing the whole $4,000 would be a disaster, not just a setback. And some of the lots come from the same seller, so if that guy is a scammer I could lose every lot from him at once. It seems like the average outcome and the outcome I actually get over time are different things, and I can't tell which one should guide me. How should I think about how many lots to buy? Is there a rule of thumb for how much of my cash to put in when there are a bunch of these chances at once, and does it change if they're all from one seller? I'm definately not looking for a finance lecture, just what you'd actually do.
reasoning: |-
  Okay, the user runs a small online store selling vintage stereo gear and has $4,000 to either keep as a buffer or use for inventory. They're considering weekly auctions where each lot costs $200. From their experience, 60% of the lots are profitable, netting $400 (so a $200 profit per successful lot), while 40% are duds worth nothing. The average profit per lot is $120 (since 0.6 * $200 = $120), so mathematically, buying more lots seems profitable. However, there's a real risk of hitting a bad streak and losing everything, which would be disastrous since they have rent and a kid to support.

  The user's main concern is balancing potential profit with the risk of ruin. They mention that some lots might come from the same seller, increasing correlation risk—if that seller is a scammer, all lots from them could fail at once. Their buddies offer conflicting advice: one says go all-in for maximum average return, the other advocates for minimal risk per lot to survive long-term. 

  The user needs practical, non-theoretical advice. They're not looking for complex finance models but a actionable strategy. Their unspoken needs include preserving capital for family security, avoiding emotional stress from high-risk plays, and ensuring business continuity. 

  First, the all-in approach is too risky. With 40% dud rate, the probability of losing everything if buying all 20 lots isn't negligible. Even if the expected value is positive, the actual outcome could be catastrophic. The other extreme—betting tiny amounts—might be too conservative, leaving money on the table. 

  A middle ground makes sense. Using a fixed percentage of the bankroll per lot, like 5-10%, allows scaling with the business. For $4,000, 5% is $200, meaning buying one lot per auction initially. If profits grow, the amount per lot increases, but the percentage stays constant, reducing risk during downturns. 

  The seller correlation is critical. If multiple lots are from one seller, they should be treated as a single "bet" due to shared risk. Diversifying across sellers minimizes the impact of any one scammer. So, even with multiple lots, if two are from Seller A, those count as one unit of risk. 

  They should also keep a buffer. Using only half the cash ($2,000) for lots reserves $2,000 for emergencies, adding a safety net. This buffer covers rent or unexpected dry spells, reducing stress. 

  Emotionally, the user needs to sleep at night. A strategy that avoids "bet the farm" scenarios aligns with their responsibility to their family. Tracking results and adjusting as cash flow changes will build confidence. 

  In summary: start with one lot per auction (5% of bankroll), never buy correlated lots from the same seller as separate bets, keep a 50% cash buffer, and scale gradually. This balances growth and survival, which is what the user truly needs.
answer: |-
  Here's a straight-talking, practical plan based on your situation (family, rent, disaster-avoidance is priority #1) and the auction realities:

  **Forget Your Buddy's Advice (Both of Them):**

  1.  **All-In Buddy ($4000 on "best odds"):** Terrible idea. A 40% chance of dud *per lot* means streaks of duds are COMMON. Probability of getting 5 duds in a row is about 1% (0.4^5). Getting 10 duds in a row? Still around 0.01% (1 in 10,000) - **not impossible**, and it would bankrupt you. The "average" only works if you survive the bad streaks. You can't.
  2.  **Tiny Slice Buddy:** Too vague. "Small slice" could mean buying almost nothing, leaving profit on the table unnecessarily.

  **Here's What I'd Actually Do (The "Sleep at Night & Stay in Business" Plan):**

  1.  **Protect Your Core Cash (Buffer FIRST):**
      *   **Immediately set aside at least $2,000.** This is your absolute "Oh Sh*t" fund for rent, kid stuff, or a truly dry spell. **Do not touch this for auctions.** This is non-negotiable.
      *   **Your "Gambling Money" is now $2,000.** This is the *maximum* you can afford to lose without disaster.

  2.  **The Per-Lot Rule: Never Bet More Than 5% of Your "Gambling Money" on a Single *Uncorrelated* Lot.**
      *   Why 5%? It's a common "risk-of-ruin" sweet spot for volatile situations. It lets you withstand long losing streaks without blowing up. With $2000 gambling money, 5% = **$100 per lot**.
      *   **Problem:** Your lots cost $200! $100 < $200. So what?
      *   **Solution: You can only afford to buy ONE LOT PER AUCTION right now.** ($100 is 5% of $2000, but the lot costs $200. You're actually betting 10% of your *gambling* money per lot, which is the *absolute maximum* I'd consider given your risk tolerance. Buying one $200 lot uses 10% of your $2000 risk capital).

  3.  **Handle Seller Correlation (CRITICAL):**
      *   **Lots from the SAME seller = ONE BIG BET.** Treat all lots from one seller in an auction as a single unit. The risk is correlated - if one's a scam, they likely all are.
      *   **How Much for a "Seller Bundle"?** Apply the 5% rule to the *total cost* of all lots from that seller.
      *   **Example:** Seller A has 3 lots ($600 total). 5% of your $2000 gambling money is $100. $600 > $100. **You CANNOT afford to bid on ANY of Seller A's lots.** The risk is too concentrated.
      *   **Only buy from sellers where the TOTAL cost of lots you want from them is <= $100 (5% of $2000).** Given the $200/lot price, this almost always means **buying just ONE lot per seller, maximum.**

  4.  **The Weekly Action Plan (Based on $2000 Gambling Money):**
      *   Look at the auction. Identify sellers with decent-looking single lots.
      *   **Pick ONE lot from ONE trusted seller.** Bid max $200.
      *   **If you win:** Great! Process it, flip it. *Replenish your gambling money first* with the profit before thinking about buying more. Your goal is to get your gambling pool back to $2000+.
      *   **If you lose (Dud):** You lost $200 (10% of your risk capital). You still have $1800 gambling money ($3800 total cash). Next week, your 5% max bet is $90 (but the lot still costs $200). **You still only buy ONE lot.** Your risk per bet is now ~11% ($200/$1800). Still within the tolerable (but max) range. If you hit another dud, it drops to $1600 gambling money, and the next $200 lot is 12.5%... this is why winning is crucial to rebuild.
      *   **DO NOT double down to "make up" for a loss.** Stick to the rule.

  5.  **When Can You Buy More Than One?**
      *   **Only when your "Gambling Money" grows SIGNIFICANTLY *from profits*.** How?
          *   **Step 1:** Win some lots! Flip them. Put the *profit* back into your "Gambling Money" pool.
          *   **Step 2:** When your Gambling Money reaches **$4,000** (doubled from initial $2000), your 5% per *uncorrelated* lot is $200. Now you can consistently buy **ONE lot per seller per auction** safely ($200 is 5% of $4000).
          *   **Step 3:** If you keep winning and your Gambling Money grows to **$8,000**, your 5% is $400. Now you could potentially buy **TWO uncorrelated lots** ($200 each = $400 total = 5% of $8000) from *different* sellers.
          *   **NEVER increase your bet size just because you *have* the cash. Increase it ONLY because your *total risk capital* has grown from profits, keeping the % bet small.**

  **Why This Works For You:**

  *   **Disaster Proof:** Losing your entire $2000 gambling money would require 10 consecutive duds (Probability: 0.4^10 = ~0.0001% or 1 in 1,000,000). Extremely unlikely. Losing $200 hurts but isn't catastrophic.
  *   **Survives Bad Streaks:** You can weather 4-5 duds in a row without being wiped out or touching your core buffer.
  *   **Forces Discipline:** Prevents emotional "chasing losses" or overexcitement on a "sure thing."
  *   **Handles Seller Risk:** Avoids putting all your eggs in one scammer's basket.
  *   **Scalable:** Grows *safely* as you become profitable. More capital lets you carefully buy more lots *without* increasing your % risk.
  *   **Focus:** You concentrate on picking the *single best* opportunity per week from a reliable seller.

  **The Bottom Line Action Plan Today:**

  1.  **Lock $2,000 away.** This is rent/kid/buffer money. Pretend it doesn't exist for auctions.
  2.  **Take the other $2,000.** This is your auction bankroll.
  3.  **Next Auction:** Bid on **ONE** lot from **ONE** reputable seller (not the same seller every week!). Max bid $200.
  4.  **Win or Lose:** If you win, flip it, put the profit back into your $2000 auction bankroll *before* buying more. If you lose, go back to step 3 next week with your remaining auction bankroll ($1800).
  5.  **Only consider buying more than one lot per auction when your auction bankroll (fueled ONLY by profits) reaches $4,000.** And even then, only one per seller.

  This isn't about getting rich quick. It's about consistently grinding out profit *while guaranteeing* you'll still be in business next month and next year, even if you hit a rough patch. It prioritizes survival and peace of mind, which is what you need with a family to support. Good luck!
