  ## Moorean Analysis of the Colston Statue Episode: Beauty, History, and the Limits of Isolation

  **Brainstorming Moorean Resources:**

  1.  **Intrinsic Value of Beauty:** Moore argues that the appreciation of beauty *in itself* is a great intrinsic good. It's a complex state of consciousness involving the contemplation of intrinsically beautiful objects. The beautiful object itself possesses instrumental value insofar as it facilitates this consciousness.
  2.  **The Method of Isolation:** To determine the intrinsic value of X, we must consider X *alone* in isolation from all other things and consequences. "Would the existence of X, by itself, be better than its non-existence?" (Principia Ethica, Ch. III).
  3.  **Doctrine of Organic Unities:** "The value of a whole bears no regular proportion to the sum of the values of its parts." A whole composed of parts A and B can have value greater than, less than, or even opposite to the simple sum of A's value and B's value. The *relation* between parts is crucial. This is central to his defense of "mixed goods" where an evil element contributes to a greater whole.
  4.  **Priority of Individual States of Consciousness:** Moore's ultimate goods (beauty appreciation, personal affection) are states of mind of *individuals*. Value resides in conscious experiences, not in unconscious objects, historical events, or collective entities per se.
  5.  **Personal Affection:** This is Moore's other great intrinsic good – the pleasures of companionship, love, and mutual understanding between individuals. It involves conscious appreciation of another's mental qualities.

  **Applying Moore to the Colston Statue Episode:**

  1.  **The Statue's Value (Isolation Test & Beauty):**
      *   Applying the isolation test strictly: We must ask if the statue *itself*, as a physical object divorced from any context, subject matter, history, or viewers, possesses intrinsic value. Moore would likely say **no**. Intrinsic value belongs only to conscious states. The statue is inert matter.
      *   However, the statue possesses *instrumental* value as a *potential* object capable of facilitating the intrinsically valuable state of appreciating beauty. Its craftsmanship, form, and aesthetic qualities *could* be the focus of such contemplation. Moore might grant the statue *aesthetic properties* (proportion, skill) that *could* be beautiful.
      *   **Problem:** The statue's representational content (Edward Colston) and historical meaning (celebration of a slave trader) are inseparable from its physical form in the real world. The isolation test forces us to consider it *as form alone*, but this feels artificial. Does a statue *of Colston* remain potentially beautiful in isolation? Moore's framework struggles with representation. He focuses on pure aesthetic form ("beautiful *objects*"), potentially neglecting how meaning contaminates or defines aesthetic experience. The statue's beauty was always intertwined with its celebratory purpose.

  2.  **Value to Whom? (Consciousness & Affection):**
      *   Any value derived from the statue flows *only* to individuals who experience states of consciousness related to it:
          *   Positive: Those experiencing aesthetic appreciation of its form (though meaning likely taints this).
          *   Negative: Those experiencing pain, anger, or moral revulsion upon contemplating its meaning and history (the intrinsic *disvalue* of contemplating ugliness or evil).
          *   Positive: Those experiencing the pleasures of shared purpose and solidarity (a form of personal affection) during the protest to remove it.
          *   Positive: Those experiencing a sense of justice or liberation upon its removal (though Moore is skeptical of "justice" as an abstract good – the value lies in the *conscious feeling* of relief or vindication).
      *   The statue itself has no intrinsic value *for* the city, the community, or history *as entities*. Value resides only in the minds of individuals affected.

  3.  **Organic Unities in the Episode:**
      *   **The Original Monument:** Consider the whole: (A) The aesthetically crafted statue + (B) Its subject (Colston, representing slave trade profits/atrocities) + (C) Its prominent location (public celebration). Moore would argue the value of this whole is **not** simply the (potential small positive aesthetic value of A) + (the immense negative value of contemplating B) + (the neutral/negative value of C). Likely, the whole *as a celebratory monument to an evil figure* has **significant negative intrinsic value**. The relation (C glorifying B via A) creates a "mixed" whole worse than the sum – the aesthetic element *intensifies* the evil by beautifying it, making contemplation more painful or morally repugnant.
      *   **The Toppling Event:** Consider the whole: (A) Destruction of a potential aesthetic object + (B) Collective anger/moral outrage + (C) Shared purpose/solidarity (affection) + (D) Expression of protest against injustice. Moore would likely see:
          *   (A) as a *prima facie* disvalue (loss of potential beauty-facilitator).
          *   (B) as containing intrinsic disvalue (painful emotions).
          *   (C) as containing significant intrinsic *value* (pleasures of personal affection/solidarity).
          *   (D) as instrumentally valuable (leading to change) but not intrinsically good in itself (justice isn't a simple good).
          The value of *this* whole is **not** simply (Disvalue of A + Disvalue of B + Value of C). The relation matters profoundly. The shared affection (C) fueled by the outrage (B) directed towards destroying the symbol of evil (A & D) might create a whole of **significant positive value**, despite the loss of A and the pain of B. The affection *justified* by moral purpose becomes a higher good. This echoes Moore's defense of pity (pain + love = greater good).
      *   **The Museum Display:** The new whole: (A) The damaged statue (retaining aesthetic properties) + (B) Its history (Colston, slave trade, toppling) + (C) Museum context (interpretation, historical framing). Moore's analysis is complex:
          *   The aesthetic element (A) regains *some* potential instrumental value for beauty appreciation.
          *   Contemplating the history (B) retains significant disvalue.
          *   The museum context (C) aims to transform the relation. Instead of glorification, it provides explanation and condemnation.
          *   The value of the whole hinges on the *relation*. Does the museum context successfully create a unity where contemplating the aesthetic object *alongside* its true history and condemnation *in a setting designed for reflection* yield a valuable state? This could be a complex mixed good: the aesthetic appreciation might be muted or impossible, but the overall contemplation of the *history and its consequences*, perhaps facilitated by the damaged object as evidence, *could* be an intrinsically valuable state of understanding – though heavily tinged with pain. Moore might see this as potentially a higher-order organic unity, where the pain of B is essential to the value of contemplating the truth of the situation. The museum aims to make the statue *instrumental* for fostering valuable conscious states (historical understanding, moral reflection) rather than aesthetic ones *per se*.

  4.  **The Gap: Individualism vs. Collective/Political Reality:**
      *   **This is the critical challenge for Moore.** The Colston episode is fundamentally about **collective memory, civic identity, historical justice, and the politics of public space.** Moore's axiology, focused solely on individual states of consciousness (beauty appreciation, personal affection), is largely **silent** on these dimensions.
      *   He cannot assign intrinsic value to "correcting historical injustice," "symbolic reparations," "communal healing," or "democratic reclamation of public space" *as collective phenomena*. Value exists only insofar as these events *cause* valuable conscious states in *individuals* (e.g., feelings of justice, solidarity, liberation in protesters; feelings of loss or anger in those attached to the statue; historical understanding in museum visitors).
      *   The "collective attachment" or "civic identity" attached to the statue – whether as a symbol of civic pride (problematic) or a symbol of oppression – has no direct place in Moore's framework. It only matters instrumentally, as it affects the conscious states of individuals who identify with the collective.

  **Verdict: What the Episode Shows About Moore's Axiology**

  The Colston statue episode **significantly complicates and exposes limitations in Moore's axiology**, rather than confirming it or being wholly unanticipated.

  1.  **Confirmation?** It confirms the *relevance* of organic unities. The value of the monument, the toppling, and the museum display are clearly not the sum of their parts. The relations (celebration, protest, contextualization) radically alter the value.
  2.  **Complication/Limitations:**
      *   **The Isolation Test Falters:** The demand to isolate the statue's aesthetic form from its representational content and historical meaning feels artificial and inadequate for real-world artifacts deeply embedded in history and politics. Moore provides no clear way to handle the intrinsic entanglement of form and problematic meaning.
      *   **Individualism is Insufficient:** The episode highlights how political and historical events generate value (and disvalue) that is fundamentally *collective and relational* in nature – concerning a community's relationship to its past, its symbols, and its public spaces. Moore's reduction of all value to individual conscious states struggles to capture this dimension. The *meaning* of the act of toppling – as a collective political statement – seems to hold value beyond just the sum of individual feelings of solidarity or liberation experienced by participants or observers.
      *   **Beauty's Vulnerability:** The episode starkly shows how aesthetic value, while potentially intrinsic in contemplation, is easily overwhelmed or rendered inaccessible by moral and historical disvalue in the real world. Moore's hierarchy (beauty as a supreme good) feels disconnected from the weight of historical injustice embodied in the object.
      *   **The Primacy of the Political?** The case suggests that in contexts of deep historical injustice and contested public symbols, political meaning and collective identity can dominate and reshape aesthetic value and even the experience of personal affection (solidarity born of protest), challenging Moore's apolitical hierarchy of goods.
  3.  **Unanticipated?** While Moore discusses complex unities involving good and evil, he doesn't grapple with artifacts embodying historical evil functioning as public symbols, nor with collective political action as a source of value-laden unities. The specifically *civic* and *memorial* dimensions of the case lie outside his framework.

  **Defended Verdict:**

  **Moore's axiology provides useful tools, particularly the doctrine of organic unities, for analyzing the complex interplay of aesthetic potential, moral disvalue, and conscious experiences (like solidarity) in the Colston episode.** It correctly emphasizes that the value of the statue itself is derivative and instrumental, residing only in the conscious states it facilitates. However, **the framework is ultimately inadequate and reveals a significant gap.** Its radical individualism and focus on apolitical, private states of consciousness (beauty appreciation, personal affection) cannot fully account for the intrinsic *political, historical, and collective* dimensions of value and disvalue that are central to this episode – the value of symbolic justice, the disvalue of public glorification of evil, the significance of collective memory, and the renegotiation of civic identity through public space. The episode demonstrates that while Moore's analysis of *conscious states* is valuable, a complete axiology must also grapple with the irreducibly social and historical nature of meaning, value, and disvalue embodied in public symbols and collective acts.**
