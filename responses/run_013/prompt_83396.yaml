  I need a two-page research proposal for a small internal grant — one semester, basically just me and some reading time. Act like a philosopher of language who's spent years wading through the analytic/synthetic mess: think carefully before you write, and start by brainstorming the ways the idea below could turn out to be confused.

  The half-formed idea: everyone teaches this debate as a single fight — Quine demolishes the distinction, Carnap and Grice & Strawson try to save it — but I think two different things get run together under "analytic." There's a semantic notion: a sentence is analytic when its meaning alone guarantees its truth. And there's an epistemic one: you're entitled to a belief without needing empirical evidence for it. Quine's arguments — the circle of synonymy and definition, the attack on truth by convention — look pretty strong against the first. But most of what people actually want out of the distinction, like why arithmetic and basic logic feel non-negotiable, or why some inferences are "free," is work for the second. My hunch is the epistemic notion can survive even if the semantic one dies, and that it does the job better if we attach it to inferences rather than to sentences.

  Turn that into a proposal: state the question so it has a determinate answer, say why the going positions don't settle it, give me a method I can actually execute over a semester (what I read, what I write, in what order), what a result would look like versus what would count as the project failing, and an honest verdict on whether this is a semester project or a career. No citations — I'll add those myself. Also tell me how confident you are in the overall framing and flag the one point you're least sure of; I'd rather find out now than three months in.
