  Here's a poem designed for your purpose, followed by a critical note acknowledging the contested terrain:

  **Self-Checkout**

  **(Part One: The Charger)**
  I snag the last cafe table, plug in tight,
  My screen demanding hours of its light.
  The others circle, coffees growing cold,
  But *my* deadline’s the story to be told.
  I spread my papers, claim this vital ground,
  A fortress where productivity is found.
  **What if we all did this too?**
  Then every table holds one soul, alone,
  No plug left free, no signal, no soft drone
  Of chatter shared. The cafe empties out,
  Just screens aglow, a silent, anxious rout.
  My precious focus? Gone. The vital spark
  Needs other sparks nearby, alive, in dark
  Or light. The point dissolves, the well runs dry –
  No shared space left where solitary sparks can fly.

  **(Part Two: The Sorting)**
  I sort the plastic lids with anxious care,
  Tear labels off, rinse residue with prayer
  For planet’s sake. Each bin must hold the pure,
  Rejecting taint I strive to reassure
  The system works because *I* do my part,
  This tiny, vital, sacrificial art.
  **What if we all did this too?**
  Then every scrap is scrubbed, each minute spent
  In sorting, doubting, testing, bowing, bent
  Over the bins. The world is pristine, clean,
  A perfect cycle, endlessly unseen.
  No bin rejected, nothing out of place,
  But life reduced to this meticulous chase.
  The air grows thin with duty, sharp and cold,
  A world unsullied… and profoundly old.
  No time for laughter, touch, or careless grace,
  Just sorting, sorting, in this stainless space.
  **What if we all did this too?**
  The charger’s use implodes, the sorting stays,
  One world impossible, one world a maze
  Of perfect, chilling light where nothing grows
  But the strict rule that everyone
              ...imposes.

  ---

  **Critical Note: What's Settled & What's Not**

  This poem attempts to illustrate Kant's distinction between a **contradiction in conception** (Part One) and a **contradiction in the will** (Part Two), using the universalizability formula ("What if we all did this too?").

  **Settled / Standard:**
  1.  **The Core Test:** Kant's Categorical Imperative requires formulating a maxim and testing its universalizability without contradiction.
  2.  **Two Types of Contradiction:** Kant explicitly distinguishes:
      *   **Contradiction in Conception (Part One):** Universalizing the maxim makes the *action itself* impossible or conceptually incoherent (like promising falsely if no one believes promises *can* exist).
      *   **Contradiction in the Will (Part Two):** Universalizing the maxim is logically *possible*, but it leads to a state of affairs that *no rational being could consistently will* for itself. It creates a world incompatible with essential human needs or ends we necessarily have (like some development of talents, mutual aid, or happiness).
  3.  **Kant's Claimed Results:** Kant argued this test identifies *perfect duties* (like not lying, not stealing - arising from contradictions in conception) and *imperfect duties* (like developing talents, helping others - arising from contradictions in the will).

  **Genuinely Contested:**
  1.  **The Independence & Necessity of the "Contradiction in the Will":** This is the **core controversy** relevant to the poem's structure.
      *   **Contested Claim A (Reflected in the Poem):** The contradiction in the will identifies a *distinct and necessary* type of moral failure. A maxim can pass the conception test but *still* be immoral because universalizing it creates a rationally *unwillable* world. The "sorting" maxim passes the conception test but fails the will test. The poem *requires* this view to hold Part Two as a distinct failure.
      *   **Contested Claim B (Opposing View):** Critics argue the contradiction in the will *collapses into* the contradiction in conception or relies on contingent empirical claims about human nature/happiness that Kant sought to avoid. They might argue that if the "sorting world" is truly unwillable, this *must* imply some *conceptual* flaw or contradiction in the maxim itself when considered universally, or that it smuggles in non-universal desires. **If Claim B is correct, the poem's attempt to show two *fundamentally different* failures fails.** The sorting maxim's failure might be seen as derivative or based on non-Kantian grounds.
  2.  **Does the Test Generate Results or Launder Intuitions?** Many critics argue the test doesn't *generate* moral conclusions independently but primarily *reflects and formalizes* our pre-existing moral intuitions. We know lying is wrong *before* applying the test; the test often seems rigged to give Kant his desired answers. The poem's examples rely on the audience sharing intuitions about the undesirability of the "sorting world" – a potential point of vulnerability.

  **Honest Footnote for the Poem:**
  *This poem structurally depends on the interpretation that Kant's "contradiction in the will" is a distinct and necessary form of moral failure, genuinely different from a "contradiction in conception." It assumes that a maxim can be logically universalizable yet lead to a state of affairs that is rationally unwillable for beings like us, constituting immorality. This interpretation, while common, is contested. Critics argue this "contradiction in the will" either collapses into the first type or relies on contingent empirical claims Kant aimed to exclude from pure practical reason. The poem's effectiveness in presenting two distinct failure modes hinges on this unresolved debate.*
