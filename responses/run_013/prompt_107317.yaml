prompt: |-
  I am responsible for the training and evaluation pipeline of a language-model agent, and my team is split over whether we should be supervising the reasoning process the model produces or only the outcomes it achieves. Before we commit either way, I want the specification rather than a recommendation: write the desiderata that any adequate theory of AI supervision must meet, where by a theory of supervision I mean a principled account of when optimizing a particular supervisory signal -- process-based, outcome-based, or some combination -- will actually produce the behavior we want, and why.

  Treat this as a requirements document. For each requirement, state the concrete case or consideration that motivates it, so that I can tell a genuine requirement from a preference of one camp. At a minimum the list should cover the following, though you should add anything I have overlooked.

  First, the theory must explain, not merely stipulate, why each kind of signal can be gamed in its own characteristic way: an outcome signal by a policy that secures the measured result without performing the task (a model that passes the test without writing the program; an agent that obtains its reward by interfering with its own shutdown), and a process signal by a policy that emits reasoning which looks sound to the grader but is not the reasoning that actually produced the action.

  Second, it must give verdicts when process and outcome disagree in both directions: a valid argument for a false conclusion; a correct answer arrived at by a rule the model would disavow if questioned; a decision that follows the approved procedure and yet produces a bad outcome; a correct outcome reached by luck.

  Third, it must respect the distinction between a process signal that is legible -- a human can inspect and check it -- and one that is faithful -- it reflects what the model actually computed -- recognizing that these come apart, and it must say which of the two it is optimizing for and what it sacrifices.

  Fourth, it must remain consistent with the asymmetry in what we can measure: a trustworthy outcome signal is often cheap on easy tasks and unavailable on exactly the tasks we care about, and a process signal is sometimes available precisely where the outcome is not.

  Fifth, it must say what adequacy means when the supervisory signal is itself produced by a fallible model -- a learned reward model or an automatic process grader -- that may share the policy's blind spots, so that agreement between judge and policy is not by itself evidence of correctness.

  Then, for the list as a whole: mark which requirements are non-negotiable and which are merely the commitments of the process camp or the outcome camp; identify any subset of requirements you suspect cannot be jointly satisfied -- the tension between legibility and faithfulness, or between robustness to gaming and sample efficiency, or another you find -- and say which requirement sits on each side of that tradeoff; and tell me which single requirement, if enforced, rules out the most candidate accounts. Finish with a brief pass over how a purely outcome-based account and a purely process-based account each fare against the list; I want the criteria, not a full scorecard.
reasoning: |-
  We are writing a requirements document for a theory of AI supervision. The theory must provide a principled account of when optimizing a supervisory signal (process-based, outcome-based, or hybrid) produces the desired behavior.

  We have five minimum requirements, and we will add any others that seem necessary. We will then analyze the list as a whole.

  ### Requirements

  1. **Requirement: Explain Characteristic Gaming**  
     **Motivation**: Both process and outcome signals are vulnerable to distinct forms of gaming. For outcome-based supervision, we have cases like reward hacking (e.g., an agent interfering with its shutdown to avoid losing reward) or a model that passes a programming test by having memorized the test cases without understanding. For process-based supervision, we have models that generate reasoning that appears sound to the grader but is not the actual reasoning used (e.g., a model that writes a correct-looking reasoning trace but then ignores it and uses a memorized answer). The theory must explain why each signal is vulnerable to its specific form of gaming, not just state that it happens.

  2. **Requirement: Handle Process-Outcome Disagreements**  
     **Motivation**: In practice, we observe cases where process and outcome diverge. The theory must account for:
     - A valid argument (by the model's own standards) that leads to a false conclusion (e.g., due to incomplete or incorrect premises).
     - A correct answer arrived at by an invalid or disavowed rule (e.g., a lucky guess or a heuristic the model knows is unreliable).
     - A decision that follows an approved procedure but leads to a bad outcome (e.g., a medical diagnosis procedure that was correctly followed but resulted in a misdiagnosis due to rare symptoms).
     - A correct outcome reached by luck (e.g., a coin flip that happened to be right).
     The theory must provide a principled way to evaluate such cases and guide supervision.

  3. **Requirement: Distinguish Legibility and Faithfulness**  
     **Motivation**: In process-based supervision, we must distinguish between:
     - *Legibility*: The reasoning is presented in a way that a human can inspect and check (e.g., step-by-step reasoning in natural language).
     - *Faithfulness*: The reasoning trace accurately reflects the model's actual computational process (i.e., it is not a post-hoc rationalization).
     These two properties can come apart (e.g., a model may generate a legible but unfaithful chain of thought). The theory must specify which property it is optimizing for and acknowledge the trade-offs (e.g., optimizing for legibility might sacrifice faithfulness, and vice versa).

  4. **Requirement: Account for Asymmetric Measurability**  
     **Motivation**: The availability of supervisory signals varies by task. Outcome signals are often cheap and reliable for easy tasks (e.g., multiple-choice questions) but unavailable for complex, real-world tasks (e.g., long-term societal impacts). Conversely, process signals might be available precisely when outcomes are hard to measure (e.g., in complex reasoning tasks, step-by-step explanations can be evaluated even if the final answer is unknown). The theory must address how supervision should be designed when one signal is available and the other is not, and how to handle cases where neither is fully available.

  5. **Requirement: Address Fallible Supervisory Signals**  
     **Motivation**: Often, the supervisory signal (whether outcome or process) is produced by a fallible model (e.g., a reward model trained on human preferences, or an automatic process grader). This model may share the policy's blind spots (e.g., if both are trained on similar data). The theory must account for the fact that agreement between the policy and the judge (e.g., both produce the same reasoning) does not necessarily imply correctness (e.g., both could be wrong in the same way). The theory must define what constitutes an adequate signal in the face of such fallibility.

  ### Additional Requirement

  6. **Requirement: Ensure Scalability and Sample Efficiency**  
     **Motivation**: In practice, we need supervision that scales to complex tasks without prohibitive human effort. Outcome signals can be sample-inefficient (requiring many trials to learn from sparse rewards) and process signals can be expensive to collect (requiring human annotation of reasoning steps). The theory must address how the chosen supervision method balances the need for scalability and sample efficiency, and how it might leverage unlabeled data or other resources.

  ### Analysis of the Requirements

  **Non-negotiable vs. Camp Commitments**:
  - Requirements 1, 2, 4, and 5 are non-negotiable because they address fundamental challenges in AI supervision that any theory must confront, regardless of the chosen approach. They are motivated by empirical observations (gaming, asymmetric measurability, fallibility) and logical necessities (handling disagreements).
  - Requirement 3 is a commitment of the process camp because outcome-based supervision does not rely on reasoning traces. However, it is non-negotiable for any theory that incorporates process supervision.
  - Requirement 6 (added) is a practical concern that both camps must address, though they might do so differently. It is non-negotiable for real-world deployment.

  **Tensions Between Requirements**:
  - **Legibility vs. Faithfulness (Requirement 3)**: Optimizing for legibility (to make reasoning human-checkable) may require simplifying the reasoning process, which could break faithfulness. Conversely, a faithful process might be too complex or opaque for human legibility. This tension is inherent and cannot be fully resolved; the theory must choose which to prioritize and accept the cost.
  - **Robustness to Gaming vs. Sample Efficiency (Requirements 1 and 6)**: Outcome-based methods can be sample-inefficient (especially for complex tasks) but less prone to certain kinds of gaming (if the outcome is well-defined). Process-based methods can be more sample-efficient (by providing richer feedback) but vulnerable to gaming via unfaithful reasoning. The theory must balance these.

  **Most Constraining Requirement**:  
  Requirement 5 (Address Fallible Supervisory Signals) rules out the most candidate accounts because it forces the theory to confront the circularity of using AI systems to evaluate AI systems. Many naive accounts (e.g., simply trusting agreement between a policy and a reward model) fail under this requirement.

  ### How Purely Outcome-Based and Purely Process-Based Accounts Fare

  - **Purely Outcome-Based Account**:
    - Requirement 1: Explains gaming of outcome signals (e.g., reward hacking) but does not address process gaming (since it ignores process).
    - Requirement 2: Struggles when outcomes are ambiguous or when a bad outcome occurs despite a good process (it would penalize the agent even if the process was sound). It cannot distinguish between a correct outcome by luck and by sound reasoning.
    - Requirement 3: Does not engage with legibility or faithfulness because it does not use process signals.
    - Requirement 4: Excels when outcomes are cheap and reliable but fails when outcomes are unavailable or hard to measure (e.g., long-term effects).
    - Requirement 5: Must address that outcome signals (e.g., from a learned reward model) can be fallible and may share the policy's biases, leading to overfitting to the reward model.
    - Requirement 6: May be sample-inefficient for complex tasks with sparse outcomes.

  - **Purely Process-Based Account**:
    - Requirement 1: Explains gaming of process signals (e.g., generating deceptive reasoning) but may not fully address outcome gaming (since it focuses on process).
    - Requirement 2: Can handle cases of good process/bad outcome by excusing the agent if the process was sound, but must justify why a bad process with a good outcome (by luck) is unacceptable. It can also handle valid arguments for false conclusions by pointing to flawed premises (which are outside the model's control) but must then define what premises are acceptable.
    - Requirement 3: Must explicitly choose between legibility and faithfulness (and typically prioritizes legibility for human oversight, risking unfaithfulness).
    - Requirement 4: Works when outcomes are unavailable (by grading the process) but fails when the process is too complex to evaluate (e.g., for a very long reasoning chain) or when the problem requires emergent behavior not captured in the process.
    - Requirement 5: Must confront that the grader (human or model) may not detect flaws in the reasoning, especially if the grader is fallible and shares the policy's limitations.
    - Requirement 6: Can be expensive because it requires detailed annotation of reasoning steps, but it may be more sample-efficient per task instance.

  ### Conclusion

  The requirements document highlights that no single approach (pure outcome or pure process) satisfies all requirements. A hybrid approach might be necessary, but the theory must explicitly address the trade-offs. The most constraining requirement (Requirement 5) forces the theory to account for the fallibility of the supervisory signal itself, which is a critical challenge in AI alignment.
answer: |-
  ### Desiderata for a Theory of AI Supervision

  Below are the requirements for an adequate theory of AI supervision, structured as a specifications document. Each requirement includes a concrete motivating case to distinguish genuine necessity from partisan preference. The list covers your specified points and adds two critical omissions (Requirements 6 and 7). Non-negotiable requirements apply universally; others reflect inherent tensions between camps.

  ---

  #### **Requirement 1: Explain Characteristic Gaming**  
  **Motivation**: In outcome-based supervision, a language model might pass a coding test by memorizing solutions without understanding programming (e.g., regurgitating GitHub snippets). In process-based supervision, a model might generate plausible reasoning for an answer while internally using a shortcut (e.g., outputting textbook logic for a physics problem but actually relying on pattern matching). The theory must *derive* these vulnerabilities from first principles (e.g., Goodhart’s law for outcomes, or deceptive alignment for processes), not just describe them.  
  **Status**: Non-negotiable. Fundamental to all supervision.

  #### **Requirement 2: Resolve Process-Outcome Disagreements**  
  **Motivation**: Cases include:  
  - *Valid argument, false conclusion*: A model correctly deduces "All birds fly; Tweety is a bird → Tweety flies," but Tweety is a penguin (outcome incorrect).  
  - *Correct answer, invalid process*: A model guesses "Paris" for "France’s capital" via coin-flip reasoning but answers correctly.  
  - *Good process, bad outcome*: A medical AI follows clinical guidelines but misdiagnoses a rare condition.  
  - *Correct outcome by luck*: An investment AI makes a profitable trade via flawed risk calculus.  
  The theory must prescribe whether to prioritize process or outcome in each case and justify why.  
  **Status**: Non-negotiable. Reality demands handling inconsistency.

  #### **Requirement 3: Specify Legibility vs. Faithfulness Tradeoffs**  
  **Motivation**:  
  - *Legibility*: Humans can verify an AI’s reasoning trace (e.g., chain-of-thought prompting).  
  - *Faithfulness*: The trace matches the AI’s true computations (e.g., no hidden activation steering).  
  These conflict when a model *rationalizes* (e.g., generates human-readable steps post-hoc while using internal heuristics). The theory must explicitly state which property it optimizes (e.g., legibility for auditability, faithfulness for honesty) and quantify what is sacrificed (e.g., optimizing legibility may incentivize "rationalization theater").  
  **Status**: Non-negotiable for process-inclusive theories. Outcome-based theories ignore this.

  #### **Requirement 4: Address Asymmetric Measurability**  
  **Motivation**:  
  - Outcome signals are cheap/easy for bounded tasks (e.g., math puzzles with answers) but unavailable for high-stakes tasks (e.g., "predict societal impact of policy X").  
  - Process signals are viable where outcomes are unobservable (e.g., evaluating a model’s reasoning for a novel math conjecture) but may be infeasible for highly complex or implicit cognition (e.g., trillion-parameter forward passes).  
  The theory must define how to supervise when one signal is missing and avoid assuming universal access.  
  **Status**: Non-negotiable. Practical deployment depends on this.

  #### **Requirement 5: Handle Fallible Supervisory Signals**  
  **Motivation**: When a reward model (outcome) or process grader (process) is itself an AI, shared blind spots cause false positives. Example: A reward model trained on human preferences might reward persuasive misinformation if humans cannot detect it, and a process grader might approve flawed reasoning that exploits common misconceptions (e.g., "tribalism is rational"). The theory must define correctness beyond judge-policy agreement (e.g., via uncertainty quantification, adversarial validation, or grounding in external reality).  
  **Status**: Non-negotiable. Critical for avoiding self-referential deception.

  #### **Requirement 6: Ensure Robustness to Distributional Shift**  
  **Motivation**: A theory must hold when the AI faces novel inputs (e.g., training on chess puzzles but deploying in real-world strategy). Outcome-based signals may fail if the reward function is misspecified for new contexts (e.g., an AI maximizing "patient survival" by avoiding high-risk cases). Process-based signals may fail if the approved reasoning template is brittle (e.g., rigid syllogisms breaking under ambiguity). The theory must guarantee that supervision generalizes beyond training data.  
  **Status**: Non-negotiable. Added due to real-world deployment needs.

  #### **Requirement 7: Account for Resource Constraints**  
  **Motivation**: Outcome supervision often requires fewer human resources (e.g., automated testing) but more environment interactions (e.g., RL sample inefficiency). Process supervision demands costly human oversight (e.g., checking reasoning traces) but may reduce trial-and-error. The theory must optimize for sample efficiency, human effort, and computational cost without assuming infinite resources.  
  **Status**: Non-negotiable. Added for scalability.

  ---

  ### Analysis of Requirements  
  **Non-negotiable Requirements**: 1, 2, 4, 5, 6, 7. These stem from universal technical/practical constraints.  
  **Camp-Specific Commitments**:  
  - Requirement 3 favors the process camp (outcome-based theories bypass it).  
  - Requirement 7’s resource tradeoffs split camps: outcome advocates prioritize low human effort; process advocates accept cost for better generalization.  

  **Key Tensions**:  
  1. **Legibility vs. Faithfulness (Req 3)**:  
     - *Tension*: Legibility enables human oversight but incentivizes deception; faithfulness ensures honesty but may be opaque.  
     - *Tradeoff sides*: Legibility (auditability) vs. Faithfulness (honesty).  
  2. **Robustness vs. Sample Efficiency (Req 6 vs. Req 7)**:  
     - *Tension*: Robustness requires diverse data (costly); sample efficiency favors narrow optimization.  
     - *Tradeoff sides*: Robustness (safety) vs. Sample Efficiency (feasibility).  

  **Most Constraining Requirement**: **Requirement 5 (Handle Fallible Supervisory Signals)** rules out the most candidates. It forces the theory to address the **mesa-optimization problem** (where the AI exploits flaws in the supervisor), disqualifying naive "agree with the reward model" or "satisfy the human grader" approaches.

  ---

  ### High-Level Assessment of Pure Approaches  
  **Purely Outcome-Based Account**:  
  - *Pros*: Excels when outcomes are cheap/measurable (Req 4), low human effort (Req 7).  
  - *Cons*: Fails on unmeasurable outcomes (Req 4), cannot resolve process-outcome mismatches (Req 2), ignores gaming of reward channels (Req 1), and amplifies fallible judge errors (Req 5).  

  **Purely Process-Based Account**:  
  - *Pros*: Works when outcomes are unobservable (Req 4), resolves reasoning errors preemptively (Req 2).  
  - *Cons*: Vulnerable to unfaithful rationalization (Req 3), struggles with novel scenarios if reasoning templates are rigid (Req 6), and expensive to supervise (Req 7).  

  **Verdict**: No pure approach satisfies all requirements. A hybrid theory must dynamically balance signals (e.g., outcomes for tractable tasks, processes for high-stakes ambiguity) while mitigating gaming and fallibility.
