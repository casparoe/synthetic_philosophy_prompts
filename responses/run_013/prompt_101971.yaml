  First, stompable mooks in platformers—no moral weight. Generic merchants with fixed scripts—also don't matter. But companion characters with full arcs who can die and be mourned—those matter. Cute animal sidekicks, even if adored, don’t count because they're just mechanics. Text-based characters with deep interior monologues matter. Villains with sympathetic backstories matter. But her own custom avatar after 300 hours? Doesn't matter, even though she's attached. She explicitly says cuteness and personal attachment are irrelevant.

  Now the new case: a solo indie game where you control the last of a species on a dying planet. The game gives this creature a vivid first-person inner life—boredom, grief, memories. But there are no other characters, no interactions, and the game is neutral about its fate. The question is whether she'll say this creature matters morally.

  Then there's the bonus: NPCs powered by an AI language model. They improvise dialogue, remember past interactions, show distress, but the game doesn't claim they have inner lives, and no in-game characters treat them as wrongable. Do they matter?

  Looking at the pattern, the partner seems to value characters that the game's narrative itself treats as having moral significance. For example, companions who are mourned when they die—that shows the game's world acknowledges their value. Villains with backstories get narrative depth that frames them as wrongable. Text-based characters with interior monologues matter because the fiction explicitly provides that inner life, even without visuals.

  But her own avatar doesn’t matter because, despite attachment, the game's fiction doesn't treat it as a being with moral weight—it's a player tool. Cute sidekicks are mechanics, not narrative entities. So the key might be whether the game's narrative or other characters recognize the entity as having moral status.

  For the solo creature: it has a rich inner life shown to the player, but since there's no other characters to react, and the game doesn't position its suffering as wrong, she might say it doesn’t matter. The narrative doesn’t embed it in a moral framework; it's solitary. So even with interiority, without external narrative acknowledgment, it might not count.

  The AI NPCs, despite seeming alive, aren't treated as having inner lives by the game's fiction. No in-story characters react to them morally, and the game doesn't frame them as wrongable. So she'd likely say they don’t matter. The key differentiator is whether the narrative itself, through characters or story, assigns moral weight, not just the player's perception or the character's apparent autonomy.

  The test case to distinguish the rules: if a character has rich interiority but no narrative acknowledgment versus one with minimal interiority but other characters treat it as morally significant. For example, a silent protagonist whose actions cause NPCs to react morally (like causing grief) might matter more than a deeply introspective character in isolation.
answer: |-
  Based on your partner's pattern of verdicts and explicit rejections of cuteness/player attachment, here's my analysis:

  1.  **The Solo Creature (Indie Game):** She will **say it DOES NOT matter morally.**
  2.  **The AI NPCs:** She will **say they DO NOT matter morally.**
  3.  **The Rule She's Running:** The **"fiction embeds it in a web of normative relations and treats it as wrongable"** rule. This is the strongest fit.

  **Reasoning & Rule Breakdown:**

  *   **Rejecting "Genuine Inner Life" Alone:** She dismissed the cute animal sidekick (explicitly lacking interiority) *and* her own deeply attached avatar (presumably possessing player-attributed interiority). Crucially, she accepted the *text parser character* with pages of interior monologue. This seems contradictory *unless* the key isn't *just* the *existence* of interiority, but **how the game's fictional world itself acknowledges, validates, or responds to that interiority and its potential violation.** The parser character's interiority is presented *as part of the fiction itself*, not just implied by mechanics or player attachment. However...
  *   **The Primacy of "Normative Relations & Wrongability":** Her consistent yes/no split hinges on **whether the *game's story and other characters* treat the entity as having moral standing.** Stompable mooks, merchants, cute sidekicks, and her own avatar: The fiction *itself* doesn't portray them as beings *to whom wrongs can be done in a way that the narrative acknowledges as meaningful*. Companions get mourned – the fiction recognizes their loss *as a wrong*. Villains get sympathetic backstories – the fiction complicates their status and potentially acknowledges harms *done to them*. The text parser character's interiority is presented as a *fact within the fiction* that other (textual) characters might react to or that drives the narrative's understanding of harm.
  *   **Applying to the Solo Creature:**
      *   It has vivid, presented interiority *within the fiction*.
      *   **BUT:** There are **no other characters** to form normative relations with it. No one *in the fiction* interacts with it, depends on it, judges its actions, mourns it, or acknowledges its suffering *as a wrong*. The game's narrative is **completely neutral** about its fate; it doesn't frame letting it die as a cruelty or keeping it alive as a duty. The interiority is presented *to the player*, but the *fictional world itself* offers no normative context or judgment. It exists in a moral vacuum *within its own story*. Therefore, like her avatar (which has player-attributed interiority but no in-fiction normative weight), it won't matter morally to her.
  *   **Applying to the AI NPCs:**
      *   They *seem* to have interiority due to behavior (improvised dialogue, memory, distress).
      *   **BUT:** The **game's fiction explicitly disavows** inner lives ("never claims they have inner lives"). Crucially, **no character within the story treats them as wrongable.** Their distress isn't acknowledged *in the narrative* as something morally relevant; they aren't mourned, avenged, or given sympathetic backstories *by the game's own storytelling*. They are sophisticated mechanics mimicking relations, but the fiction itself doesn't embed them in a web of normative recognition. They fall into the "merchant NPC" or "stompable mook" category – functional elements, not morally considerable entities *within the story's own logic*.

  **The Best Case to Tell the Rules Apart:**

  The **AI NPC case (Bonus)** is the most revealing test. Here's why:

  *   **"Genuine Inner Life" Rule:** If this were her rule, the AI NPCs *might* qualify. Their behavior strongly *implies* a complex inner life to the *player*, arguably more dynamically than the fixed text parser. If interiority (implied or stated) was key, this could be a yes.
  *   **"Normative Relations/Wrongability" Rule:** This rule *clearly* predicts a "no" for the AI NPCs. The game's fiction explicitly denies their inner life and crucially, provides *no* in-world normative context recognizing them as wrongable. They are pure mechanics within the fiction, despite the player's experience.
  *   **Her Likely Verdict (No) Confirms:** Her "no" on the AI NPCs, despite their behavioral complexity, would strongly confirm that the *fiction's own normative framing* (the "web of relations" and explicit acknowledgment of wrongability *within the story*) is paramount, trumping even sophisticated *simulations* of interiority or relationality that the narrative itself doesn't endorse. It highlights that what matters is *how the game's world treats the character*, not how real or complex they *seem* to the player.

  **Conclusion:** Your partner's rule is fundamentally **narrativist** and **intra-fictional**. Moral mattering depends on the entity being positioned *by the game's own storytelling* as an object of potential moral concern *within its fictional universe*. This requires the narrative to show other characters relating to it normatively (caring, depending, mourning, condemning, sympathizing) or explicitly framing its treatment as a potential right or wrong. Player perception, attachment, implied sentience, or even richly presented interiority *addressed only to the player* are insufficient if the *fictional world itself* ignores or negates that status. The solo creature has interiority but no normative context *in its world*; the AI NPCs simulate relations but lack narrative endorsement. Both fail her test. The AI NPC case best exposes that the *fiction's own normative commitments* are the core of her rule.
