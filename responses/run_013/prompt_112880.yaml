prompt: |-
  I chair the patient safety review board at a mid-sized hospital — nine of us, we meet once a month for 90 minutes, and lately more and more of the cases that come to us involve tools that make their own calls. A sepsis alert that goes quiet for eleven days after a vendor update and stops firing for patients on a certain drug, while a resident cross-covering fourteen patients that night trusts the silence and doesn't escalate on the numbers alone. A compounding robot that reads a new supplier's barcode into the wrong field and puts the wrong concentration in an IV, because the pharmacist who used to double-check everything was told the robot was validated as the second check. A triage chatbot that files a chest pain complaint as low priority because the patient wrote in a dialect the model barely saw in training. Nobody in that room has a philosophy background and we are not getting one. The engineer says the model did exactly what it was specified to do, the clinician says they were told to trust the output, the informatics lead says they signed off on a spec that didn't cover this, and the vendor's contract says it's not their problem. I've read enough to know there's a name for the hole we keep falling into, and that the usual move is to seperate being on the hook from being at fault, but I can't figure out how to make that do any real work at 8am on a Tuesday.

  So what I want is a procedure we can actually run in the room: the questions to ask in order, what counts as a good enough answer to each, the point where it stops with a no, and the point where it hands the decision to a person because the question is values and not facts. Hard constraints, because general counsel won't sign off otherwise: every finding has to land in exactly one of three buckets — (1) a named person acted below a standard they could reasonably have been held to, (2) no one is at fault but a named person has to answer for it and own the fix, or (3) nobody can own it. The state's adverse event reporting form has a field for responsible party and none isn't an option we can pick without a fight, so the procedure needs to say what we write there in each case, and it has to survive cases where the logs are missing and cases where the party that looks responsible is a vendor we can't discipline, a regulator, or a decision this board itself made two years ago. It also has to be something a family can read without it sounding like we're covering for ourselves, and something nine people with different loyalties can't game in the room.

  Then run it on three cases. One: the sepsis alert, where the vendor's release notes mentioned the change on page 40 of 41 and our informatics lead didn't flag it. Two: the robot and the pharmacist, where the pharmacist is beloved, did exactly what the validation told them to do, and everyone's instinct is to say the vendor is on the hook even though the contract says otherwise. Three: the chatbot and the dialect issue, where the fix is a change in clinical practice the nurses will hate and that we probably can't staff. I want at least one of these to come out somewhere I don't like — ideally the one that points at this board's own sign-off two years ago for not requiring a monitoring plan. Finish by telling me honestly where the procedure breaks: which of the questions are values calls dressed up as tests, which distinctions from the theory didn't survive the simplification, and the cases it genuinely can't settle where a human has to decide. American English please.
reasoning: |-
  We are designing a procedure for the patient safety review board to assign responsibility in cases involving automated systems. The procedure must assign each case to one of three buckets:
  1. A named person acted below a standard they could reasonably have been held to.
  2. No one is at fault but a named person has to answer for it and own the fix.
  3. Nobody can own it (but note: the state form requires a responsible party, so we must assign one even in this case, perhaps by having a fallback).

  Additionally, the procedure must:
  - Be executable in a 90-minute meeting.
  - Work even when logs are missing or when the responsible party is an external entity (vendor, regulator, the board itself).
  - Produce an outcome that is defensible to families and the public.
  - Be resistant to gaming by board members with different loyalties.

  The procedure will consist of a series of questions. We must define:
  - The questions in order.
  - What counts as a good enough answer to each.
  - When to stop with a "no" (which might lead to a bucket).
  - When to hand the decision to a person because the question is about values (but note: we are constrained to the buckets, so we must design to avoid values as much as possible, or have a way to force a bucket).

  We are to test the procedure on three cases and then discuss where it breaks.

  ### Proposed Procedure

  We design a decision tree with a sequence of questions. The goal is to assign responsibility by examining:
  1. **Foreseeability**: Could the issue have been reasonably anticipated?
  2. **Preventability**: Were there reasonable steps that could have been taken to prevent the harm?
  3. **Delegation and Oversight**: Who was responsible for ensuring the system worked as intended?
  4. **Response and Fix**: Who must now address the problem?

  We'll have four main phases:

  **Phase 1: Identify the failure mode and the system in question.**
    - This is descriptive and sets the stage.

  **Phase 2: Determine if there was a breach of duty by an individual (bucket 1).**
    - We look for individuals who had a duty and failed to meet a standard of care.

  **Phase 3: If no individual breach, determine who should own the fix (bucket 2).**
    - We look for the person or entity that had oversight or control.

  **Phase 4: If no one can be assigned in bucket 2, then bucket 3 (but we must assign a responsible party for the form, so we have a fallback: the hospital CEO or the board itself as the responsible party).**

  However, note that bucket 3 is "nobody can own it", but the form requires a responsible party. Therefore, we must assign a party even in bucket 3. We can say:
  - In bucket 1: the named person is the responsible party.
  - In bucket 2: the named person (who will own the fix) is the responsible party.
  - In bucket 3: we assign the hospital CEO (or the board) as the responsible party by default, because the hospital is ultimately accountable.

  But note: the board might have made a decision that led to the problem. We must capture that.

  ### Detailed Questions

  We break down the procedure into a flowchart of questions. Each question must be answerable with facts, but when we hit a values question, we must have a rule to assign a bucket.

  **Step 0: Case Presentation**
    - Present the case with available facts.

  **Step 1: Was the event caused by a failure of an automated system?**
    - If no, then use the standard procedure (not covered here). We assume yes.

  **Step 2: Was the failure due to a known and foreseeable circumstance?**
    - Known: Had this exact failure happened before? (If yes, then someone should have fixed it.)
    - Foreseeable: Could a reasonable person in the relevant role have anticipated this failure? (This is a judgment call, but we can use standards of practice, training, etc.)
      - Good enough answer: If there is evidence that the risk was documented (e.g., in risk assessments, prior incidents, literature) or if it is a well-known type of failure (e.g., software update causing unexpected behavior), then it was foreseeable.
      - If the answer is yes, then move to Step 3 to see who should have known.
      - If no, then the failure was not foreseeable -> go to Step 4.

  **Step 3: Who had the duty to monitor for and address foreseeable failures?**
    - This is about oversight. We look for:
        - The person/role responsible for validating updates (e.g., informatics lead for the sepsis alert).
        - The person/role responsible for ensuring the system was used correctly (e.g., the pharmacist's supervisor for the robot).
        - The person/role responsible for ongoing monitoring (e.g., for the chatbot, the clinical lead for the triage system).
    - If we can identify a person who failed to act on a foreseeable risk (i.e., they did not perform the expected monitoring or mitigation), then that person is at fault (bucket 1).
    - If the duty was delegated to a vendor and the contract clearly made the vendor responsible, then we look: did the vendor fail? But note: the vendor is not an employee, so we cannot assign bucket 1 to the vendor. We must assign within the hospital. Therefore:
        - If the vendor was contractually responsible and failed, then the hospital person responsible for overseeing the vendor might be at fault for not ensuring the vendor did their job? (This is tricky.)

    - Clarification: Bucket 1 is for a named person (within the hospital) acting below standard. If the vendor is at fault, we cannot assign bucket 1 to the vendor. So we must look for a hospital employee who had a duty to oversee the vendor. For example, did the informatics lead have a duty to review the vendor's release notes? If so, and they didn't, then bucket 1 for the informatics lead.

    - If we cannot identify a hospital employee who failed in their duty (e.g., the vendor failed but the hospital employee overseeing the vendor did everything by the book), then we move to Step 4.

  **Step 4: Was the failure preventable by a reasonable change in practice, policy, or system design?**
    - This question asks if there was a way to prevent the harm that was not taken. We are looking for a systemic fix.
    - Good enough answer: If there exists a known best practice (e.g., having a second check, testing after updates) that was not followed, then yes. Or if the system design was flawed in a way that could have been addressed (e.g., the chatbot's training data was known to be limited).
    - If yes, then move to Step 5 to assign ownership of the fix.
    - If no (i.e., the failure was not foreseeable and not preventable by any reasonable means), then we go to bucket 3.

  **Step 5: Who has the authority and responsibility to implement the fix?**
    - This is about ownership of the solution. We are looking for a named person (in the hospital) who can be tasked with fixing the problem. This person might not be at fault (so not bucket 1) but must now take charge (bucket 2).
    - For example:
        - The informatics lead for updating procedures for reviewing release notes.
        - The pharmacy director for changing the policy on robot use.
        - The head of nursing for changing triage protocols.
    - If we can identify such a person, then bucket 2.
    - If we cannot (e.g., the fix requires vendor action and the vendor is uncooperative, or the fix is beyond the hospital's control), then we go to bucket 3.

  **Step 6: Bucket 3 Assignment**
    - Even in bucket 3, we must assign a responsible party for the form. We assign the CEO (or the board chair) as the responsible party because the hospital as an institution is responsible. We note that the event was due to an unforeseeable and unpreventable failure of an automated system, but the hospital will take steps to learn and improve.

  ### Additional Rules
  - **Missing Logs**: If logs are missing, we use the best available evidence and apply a standard: if the logs were required to be kept by policy, then the person responsible for keeping the logs may be at fault (bucket 1) for not maintaining them. Otherwise, we proceed with the evidence we have and if uncertainty remains, we err on the side of bucket 2 or 3 (depending on foreseeability and preventability).
  - **External Parties**: For vendors, regulators, or past board decisions, we look for a current hospital employee who has oversight of that relationship or the system. If none, then we consider whether the failure was foreseeable and preventable (Step 4). If the failure was due to a past board decision, then the current board (or the CEO) must own the fix (bucket 2) because they are responsible for reviewing and updating past decisions.
  - **Values Calls**: We try to avoid values by using objective standards (e.g., was there a policy? was it followed? was the risk in the vendor's documentation?). However, foreseeability and preventability can be value-laden. We mitigate by using:
        - Industry standards (e.g., what do other hospitals do?).
        - Internal policies and training.
        - Documentation (if it was written down, then it was known).
    If there is genuine disagreement on foreseeability, we can take a vote (but this is a fact question as we've defined it). For preventability, we can look for evidence of similar fixes elsewhere.

  ### Procedure Summary
  1. **Identify the system and failure.**
  2. **Was the failure foreseeable?** (Use evidence: prior incidents, known limitations, documentation, expert standards.)
     - If yes: **Who had the duty to monitor and address this risk?**
       - If a hospital employee failed in that duty -> bucket 1 (that person).
       - Else (duty was with an external party and the hospital employee overseeing did their duty) -> go to step 4.
     - If no -> go to step 4.
  3. **Was the failure preventable by a reasonable change?**
     - If yes: **Who can own the fix?** (assign bucket 2 to that person).
     - If no: bucket 3 (with CEO as responsible party for the form).

  But note: Step 2 and 3 are not mutually exclusive. We might have both an individual failure and a systemic issue. We prioritize bucket 1 because it is about individual fault.

  ### Run the Cases

  **Case 1: Sepsis Alert Failure**
  - **Facts**: Vendor update changed the alert for patients on a certain drug. Release notes on page 40 of 41. Informatics lead did not flag it. Resident trusted the silence and didn't escalate.
  - **Step 1**: Automated system failure? Yes.
  - **Step 2**: Foreseeable? Yes. Software updates are known to cause unexpected changes. The risk of missing release note details is known in the industry.
  - **Step 3**: Who had the duty? The informatics lead is responsible for reviewing release notes and testing updates. They did not flag the change -> they failed in their duty. 
  - **Conclusion**: Bucket 1 - the informatics lead acted below standard by not reviewing the release notes thoroughly. They could have been expected to note the change and test the alert for that drug.
  - **Responsible Party**: Informatics lead.

  **Case 2: Compounding Robot**
  - **Facts**: Robot read a new supplier's barcode into the wrong field. Pharmacist did not double-check because the robot was validated as the second check.
  - **Step 1**: Automated system failure? Yes.
  - **Step 2**: Foreseeable? 
     - The risk of a barcode from a new supplier being misinterpreted? 
     - This might not have been specifically foreseen. However, the validation process should have considered different suppliers. 
     - But note: the robot was validated as the second check. The validation process might have been flawed. 
     - Who had the duty to validate? The vendor? The hospital? 
     - The hospital's pharmacy department (pharmacist or supervisor) had a duty to ensure the validation was adequate. 
     - But in this case, the pharmacist followed the procedure (they trusted the robot). 
     - We must ask: was it foreseeable that the validation might not cover new suppliers? 
     - This is a gray area. Let's say: it is foreseeable that systems might fail with new inputs. The validation should have included a range of suppliers. 
     - However, the pharmacist was told the robot was validated. They did not have a duty to re-validate. 
     - The duty to validate lies with the pharmacy leadership and the informatics team that signed off. 
     - We might not have an individual at fault (unless the validation was clearly rushed). 
     - Alternatively, the vendor might have provided a validation report that was incomplete. 
     - But our procedure: if we cannot assign to a hospital employee for a breach (because the pharmacist followed policy and the supervisor relied on the vendor), then we move to Step 4.
  - **Step 4**: Preventable? Yes, by having a policy that requires re-validation for new suppliers, or by not removing the second human check until the system was proven to handle new suppliers. 
  - **Step 5**: Who can own the fix? The pharmacy director must change the policy and either reinstate the double-check for new suppliers or implement a re-validation process. 
  - **Conclusion**: Bucket 2 - the pharmacy director must own the fix. 
  - **Responsible Party**: Pharmacy director.

  **Case 3: Triage Chatbot**
  - **Facts**: Chatbot files chest pain as low priority because of a dialect issue. The fix is a change in clinical practice (e.g., having a nurse review all chatbot outputs) that the nurses will hate and that may not be staffable.
  - **Step 1**: Automated system failure? Yes.
  - **Step 2**: Foreseeable? 
     - Natural language processing systems are known to have biases and limitations with dialects. This is a well-known issue in AI. 
     - Therefore, yes, it was foreseeable.
  - **Step 3**: Who had the duty? 
     - The team that implemented the chatbot (clinical lead and informatics) should have considered language diversity and tested for such biases. 
     - They might have done some testing but missed this dialect. 
     - We must ask: was there a breach? If they followed best practices (e.g., tested with diverse datasets) and this was an edge case, then maybe not. 
     - But if they did not test for dialect variations, and that is a known risk, then they failed. 
     - However, the board itself signed off without requiring a monitoring plan two years ago. 
     - The board is not an individual. We look for the individual who presented the system to the board. That might be the CIO or the head of informatics. 
     - But if the board made the decision to not require monitoring, then the board (as an entity) is responsible. We cannot assign bucket 1 to the board because it's a group and not a named person. 
     - We must assign an individual? The board chair (you) or the CEO? 
     - Alternatively, the head of informatics who presented the plan without a monitoring component might be at fault. 
     - This is tricky. Let's assume the head of informatics presented the system and its risks, and the board decided not to require monitoring. 
     - The head of informatics might have met the standard by disclosing the risks, so no breach by them. 
     - The board's decision might be the root cause. Since the board is not a named person, we cannot assign bucket 1. 
     - Therefore, we move to Step 4.
  - **Step 4**: Preventable? Yes, by having a monitoring plan that catches such errors (e.g., regular audits of chatbot decisions). 
  - **Step 5**: Who can own the fix? The head of informatics or the clinical lead for the triage system must implement a fix (e.g., updating the model, adding human review, or changing the protocol). 
     - Even if the fix is hard (nurses will hate it, staffing is an issue), someone must own the problem and find a solution. 
  - **Conclusion**: Bucket 2 - the head of informatics (or the clinical lead for triage) must own the fix. 
     - However, note that the board's past decision might be a factor. The fix might include revisiting that decision. 
  - **Responsible Party**: Head of informatics.

  But note: the board itself might be the one that needs to own the fix because the problem stems from a board decision. We can assign the board chair (you) as the responsible party for the fix? But the procedure requires a named person. We can assign the CEO or the board chair? 

  However, in our Step 5, we look for the person with the authority. The head of informatics does not have the authority to change board decisions. The board chair does. So we might assign bucket 2 to the board chair (you) for owning the fix? But note: the board chair is a named person. However, this might be uncomfortable because you are on the board. 

  Alternatively, we can assign the CEO as the responsible party for the form and for owning the fix? The CEO has overall responsibility and can direct the board and the hospital. 

  We adjust: In Step 5, if the fix requires board-level action, then the responsible party is the CEO (or the board chair, but the CEO is the top executive). So we assign bucket 2 to the CEO. 

  Therefore, for Case 3, we assign:
  - Bucket 2: CEO must own the fix (which includes revisiting the board's decision and allocating resources for the fix).

  ### Where the Procedure Breaks

  1. **Foreseeability and Preventability as Values**: 
     - Determining what is "foreseeable" or "preventable" can be subjective. We rely on standards, but when standards are absent, it becomes a judgment call. This might lead to inconsistent decisions.
     - Mitigation: Use of expert opinions and documentation. But in the room, we may need to vote.

  2. **Assigning Responsibility for External Parties**:
     - When the vendor is at fault but the contract shields them, we look for a hospital employee to blame (in bucket 1) or to own the fix (bucket 2). This might be unfair if the hospital employee did everything right. But the procedure forces ownership in bucket 2 for the fix.

  3. **The Board's Own Decisions**:
     - When the board is at fault, we cannot assign bucket 1 to the board (because it's not a named person). We then assign bucket 2 to the CEO or board chair. But this might feel like covering for the board. However, it is the reality of organizational responsibility.

  4. **Bucket 3 and the Form**:
     - We assign the CEO in bucket 3, but the CEO might not be at fault. This is a necessary fallback to meet the form requirement.

  5. **Gaming**:
     - Board members might try to avoid bucket 1 by arguing that a risk was not foreseeable. We mitigate by requiring evidence (e.g., "show me where this risk was documented in our training or in literature").

  6. **Complex Cases with Multiple Causes**:
     - The procedure is linear and might miss multiple contributing factors. We can only assign one bucket. We prioritize bucket 1 (individual fault) over bucket 2 (system fix) and bucket 3.

  7. **The Human Values Call**:
     - We cannot eliminate values. The procedure must be administered by a facilitator who ensures that the questions are answered based on evidence. When evidence is lacking, the procedure defaults to a path (e.g., if we cannot prove foreseeability, we assume not and move to preventability). This might let individuals off the hook when they should not be.

  Despite these breaks, the procedure provides a structured way to assign responsibility that is defensible and meets the constraints.

  ### Final Procedure Document for the Board
  We can write the procedure as a flowchart with clear questions and rules. We also note that the responsible party for the form is:
  - In bucket 1: the named individual.
  - In bucket 2: the named individual who must own the fix.
  - In bucket 3: the CEO (as the ultimate responsible party for the hospital).

  We'll also note that the board must document the rationale for each step to show due process.
answer: |-
  Below is a robust, executable procedure for your Patient Safety Review Board to assign responsibility in cases involving automated systems. It's designed as a sequential checklist with clear gates, minimizing subjective debate. The procedure prioritizes **accountability over blame**, focuses on **foreseeability and control**, and forces decisions even with missing logs or external parties. It outputs one of your three buckets and specifies the "Responsible Party" for the state form.

  ---

  ### **Procedure: Automated System Failure Accountability (ASFA) Checklist**  
  *Run in order during case review. Answer each question with documented facts or board consensus. Stop at the first "yes" and assign the corresponding bucket. If logs are missing, proceed with available evidence and note gaps in the report.*

  1. **Question 1: Did a hospital employee or contractor (excluding vendors) violate an existing, written policy or protocol?**  
     - *Good enough answer:* Policy exists, was accessible, and violation is proven (e.g., skipping a required check).  
     - *Stop with "yes":* **Bucket 1** (named person at fault).  
     - *Responsible Party:* The violator (e.g., "Pharmacist John Smith" or "Informatics Lead Jane Doe").  
     - *If "no" or unclear:* Proceed to Question 2.

  2. **Question 2: Was the failure foreseeable during system design, validation, or updates?**  
     - *Good enough answer:* Foreseeability is established if:  
       - The risk was documented (e.g., in vendor release notes, testing reports, or risk assessments).  
       - It matches a known failure mode (e.g., software updates disrupting alerts, training data gaps).  
       - Industry standards existed (e.g., FDA guidance on AI bias, ISMP alerts for robotics).  
     - *Stop with "yes":* **Bucket 2** (named person owns fix).  
     - *Responsible Party:* The person with **operational control** (e.g., "Informatics Lead" for vendor updates, "Pharmacy Director" for robot validation).  
     - *If "no" or unclear:* Proceed to Question 3.

  3. **Question 3: Could the hospital have prevented harm through reasonable changes to training, staffing, or workflow?**  
     - *Good enough answer:* Prevention was feasible if:  
       - Mitigations are standard (e.g., testing after updates, backup checks for robots).  
       - Cost/time requirements are reasonable (e.g., adding a 5-minute verification step).  
     - *Stop with "yes":* **Bucket 2** (named person owns fix).  
     - *Responsible Party:* The person with **authority to change practice** (e.g., "Nursing Director" for triage workflows, "CMIO" for alert protocols).  
     - *If "no":* **Bucket 3** (nobody owns it, but assign fallback).  
     - *Responsible Party:* **"Hospital CEO"** (as institutional steward).  

  #### **Critical Rules for Hard Constraints**  
  - **Missing logs:** Assume against the hospital. If logs aren’t kept per policy, default to "foreseeable" (Question 2).  
  - **Vendors/regulators:** Assign internal oversight roles (e.g., "Informatics Lead" manages vendors; "CEO" answers for regulators).  
  - **Past board decisions:** Treat as "foreseeable" (Question 2) and assign the **current role** inheriting responsibility.  
  - **Values vs. facts:** Question 2 (foreseeability) is the only values call; use industry standards to objectify.  
  - **Anti-gaming:**  
    - Require documented evidence for all answers (e.g., "Show the policy" or "Cite the standard").  
    - If consensus fails, majority vote with conflict disclosures (e.g., recusals if loyalties conflict).  
  - **Family readability:** Use plain language in reports (e.g., "We failed to check the update" vs. "Suboptimal validation occurred").  

  ---

  ### **Run the Procedure on Your Cases**  
  *Assumptions: Vendor contracts disclaim liability; no prior policies were violated; staff acted in good faith.*

  #### **Case 1: Sepsis Alert Silence**  
  - **Q1:** Did an employee violate policy?  
    - *Facts:* Informatics Lead didn’t flag update; no policy required reviewing page 40 of release notes.  
    - *Answer:* No violation → **Proceed.**  
  - **Q2:** Was it foreseeable?  
    - *Facts:* Vendor release notes mentioned the change (page 40/41). Industry standards (e.g., ECRI guidelines) say updates must be fully reviewed for clinical impact.  
    - *Answer:* **Yes** → **Bucket 2.**  
  - **Responsible Party:** Informatics Lead (owns fix: implement mandatory update reviews).  
  - *Why you might dislike it:* Points to your team’s oversight gap, not the vendor.  

  #### **Case 2: Compounding Robot Error**  
  - **Q1:** Did an employee violate policy?  
    - *Facts:* Pharmacist followed protocol to trust the "validated" robot; no policy required double-checks.  
    - *Answer:* No → **Proceed.**  
  - **Q2:** Was it foreseeable?  
    - *Facts:* New supplier barcodes weren’t tested. ISMP standards require validating against real-world variables (e.g., new suppliers).  
    - *Answer:* **Yes** → **Bucket 2.**  
  - **Responsible Party:** Pharmacy Director (owns fix: revalidate robots for supply-chain changes).  
  - *Why it works:* Bypasses vendor contract by assigning internal ownership of validation.  

  #### **Case 3: Dialect Bias in Triage Chatbot**  
  - **Q1:** Did an employee violate policy?  
    - *Facts:* Nurses used chatbot per protocol; no policy required dialect checks.  
    - *Answer:* No → **Proceed.**  
  - **Q2:** Was it foreseeable?  
    - *Facts:* AI bias is a known risk (FDA/NIST publications). Your board approved the system **without a monitoring plan** 2 years ago.  
    - *Answer:* **Yes** (board decision made it foreseeable) → **Bucket 2.**  
  - **Responsible Party:** **Board Chair** (you) or **CMIO** (owns fix: implement monitoring + staffing plan).  
  - *Why you’ll dislike it:* Forces accountability for the board’s past oversight gap.  

  ---

  ### **Where the Procedure Breaks**  
  1. **Question 2 (Foreseeability) is values-laden:**  
     - *Issue:* Relies on "industry standards," but these can be ambiguous or evolving (e.g., AI risks). Boards may interpret "reasonableness" differently.  
     - *Mitigation:* Use regulatory guidelines (FDA, Joint Commission) as arbiters. If none exist, vote and document dissent.  

  2. **Simplification gaps from theory:**  
     - *Moral luck:* The procedure ignores "good faith but bad outcomes" (e.g., the beloved pharmacist). It prioritizes systems over intent.  
     - *Diffused responsibility:* Assigns individuals (Bucket 2) for system flaws, which feels punitive but meets your legal constraint.  

  3. **Cases it can’t settle:**  
     - **True "black swan" failures:** Unforeseeable, unpreventable, and policy-compliant (e.g., a novel cyberattack). Procedure defaults to Bucket 3 (CEO as fallback), but families may see this as evasion.  
     - **Resource-constrained fixes:** E.g., Case 3 requires staffing nurses for backup triage, but the hospital lacks funds. Procedure forces Bucket 2 (ownership), but the owner may fail, risking repeat incidents.  
     - **Vendor stonewalling:** If a vendor hides critical data (e.g., algorithm details), Question 2 becomes unanswerable. Procedure defaults to "foreseeable" (due to missing data) and assigns Bucket 2 to the vendor manager.  

  **Final Advice:** Use this for 90% of cases. For edge cases, escalate to the CEO with a "Bucket 3 + CEO" assignment and a board recommendation. This balances efficiency with accountability—and keeps general counsel happy.
