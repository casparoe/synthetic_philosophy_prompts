answer: |-
  ### (a) Essay Question  
  **Time Allotment:** 60 minutes  
  **Word Guidance:** Focus on analytical depth over summary. Restrict scenario restatement to ≤1 paragraph.  

  > **The Convex Utility Monster:** Suppose a being exists whose utility function is strictly convex: each additional unit of resources (e.g., food, medicine) it receives yields a *larger* utility gain than the previous unit, with no upper bound or threshold of diminishing returns. Classical total utilitarianism (maximizing aggregate utility) would demand transferring all societal resources to this being, leaving others with nothing.  
  >   
  > 1. **Which core commitment(s) of utilitarianism does this scenario exploit to force this counterintuitive conclusion?** (Avoid merely listing principles; explain the *mechanism* of exploitation.)  
  > 2. **Can the objection succeed *without* smuggling in a premise that utilitarians reject** (e.g., egalitarianism, desert, rights)? Defend your answer.  
  > 3. **What distinguishes this as a potential *reductio ad absurdum* (logically invalidating utilitarianism) rather than a mere *intuition pump*** (eliciting discomfort)? Ground your analysis in utilitarianism’s internal logic.  

  ---

  ### (b) Model Answer (700 words)  

  This objection exploits utilitarianism’s twin commitments to **welfarism** and **unconditional maximization**. Welfarism reduces moral value to welfare states, ignoring non-utility considerations (e.g., fairness, agency). Maximization requires ranking outcomes solely by aggregate utility sums. The convex monster leverages these by creating a mathematical inevitability: because each resource unit granted to it produces *more* utility than the last, aggregate utility grows maximally—and without limit—only by allocating *all* resources to it. Crucially, utilitarianism cannot object that resources "should" be distributed elsewhere because (a) others’ utility functions exhibit flatter or diminishing returns, making their contributions smaller per unit, and (b) non-welfare considerations (e.g., "others deserve resources") are excluded by welfarism. The objection thus weaponizes utilitarianism’s own axioms: faced with a convex function, maximization *logically compels* total sacrifice to the monster.  

  The objection succeeds *without* importing external premises. Utilitarians reject egalitarianism (equal distribution), desert (reward based on effort), and rights (side constraints) as fundamental. Yet these are absent here. The horror arises purely from welfarist maximization: when one utility function dominates aggregation, utilitarianism cannot appeal to "fair shares" without abandoning its core. Some argue intuition implicitly relies on desert (e.g., "workers earned resources"), but this misdiagnoses the issue. The monster’s passive consumption involves no desert claims; the problem is *structural*. Utilitarianism evaluates end-states, not causes of welfare. If the monster generates infinite utility from sand (no labor or desert required), maximization still commands feeding it sand. The objection holds because utilitarianism lacks *any* intrinsic principle to prioritize agents with lower marginal utility, resist concentration, or value dispersion. Importing such principles would collapse into pluralism, not utilitarianism.  

  This qualifies as a *reductio ad absurdum* (RA) rather than an intuition pump if it exposes a **logical or practical contradiction** within utilitarianism’s framework. Mere intuition pumps trigger discomfort but don’t prove incoherence (e.g., transplant thought experiments). Here, the convex monster forces an RA by showing how utilitarianism:  
  - **Self-destructs in practice**: Directing all resources to one entity collapses social cooperation, destroying the system that generates resources. Yet utilitarianism cannot preempt this—it evaluates acts by immediate utility gains, not sustainability.  
  - **Violates its own scope**: Classical utilitarianism claims universal applicability, but the monster reduces it to a single-agent theory. If utility aggregation can be monopolized, "maximizing the sum" loses its ethical meaning, becoming indistinguishable from egoism.  
  - **Entails unlivable demands**: Utilitarianism purports to guide action, but allocating *everything* to the monster requires agents to starve themselves. This makes the theory self-effacing (agents cannot survive to fulfill it), creating a performative contradiction.  

  Unlike intuition pumps, this variant blocks utilitarian escapes. Standard monsters face diminishing returns or incommensurability objections. Here, convexity ensures no "knee" of diminishing returns exists, and commensurability is assumed. Appeals to long-term instability or evolutionary pressures are ad hoc; utilitarianism evaluates acts by current utility sums. Thus, the argument doesn’t just elicit unease—it proves that unfettered maximization + welfarism *logically* entails absurdity under plausible conditions.  

  ---

  ### (c) Marking Scheme (20 marks total)  
  **Must-hit moves** (Award marks only for clear, explicit engagement):  

  | Move | Marks | Characteristic Error (costs mark) |  
  |------|-------|-----------------------------------|  
  | **1. Identifies exploited commitments**: Names *welfarism* AND *unconditional maximization*, explaining *how* convexity makes the conclusion inescapable (e.g., "no diminishing returns allow infinite aggregation"). | 4 | Vaguely cites "consequentialism" or "aggregation" without mechanistic analysis. |  
  | **2. Rejects external premises**: Argues the objection needs *no* egalitarian/desert/rights premises, demonstrating that utilitarianism’s *own* axioms force the result (e.g., "desert is irrelevant; utility sums alone matter"). | 4 | Assumes intuitions rely on fairness/desert or claims the scenario "cheats" by implying them. |  
  | **3. Distinguishes reductio from intuition pump**: Defines RA as exposing *internal contradiction* (e.g., self-effacement, loss of universal scope) AND contrasts with mere discomfort (e.g., "unlike Nozick’s experience machine, this breaks utilitarianism’s logic"). | 5 | Equates RA with "strong intuition" or focuses only on repugnance. |  
  | **4. Blocks standard utilitarian replies**: Notes why convexity voids appeals to diminishing returns, sustainability, or incommensurability (e.g., "no threshold exists to justify redistributing resources"). | 4 | Rehearses standard monster replies (e.g., "rights override utility") without addressing convexity. |  
  | **5. Logical precision**: Uses consistent terminology (e.g., "welfarism," "maximization," "convex utility function") and avoids emotional rhetoric. | 3 | Slides into polemics (e.g., "this proves utilitarianism is monstrous") without logical analysis. |  

  **Note**: Full marks require demonstrating how the *variant* invalidates stock responses. Award half-marks for partial/implied hits. Deduct 1–2 marks for excessive scenario repetition.
