prompt: |-
  I sit on the appraisal panel at a government delivery body (won't say which) where we sign off business cases for big public projects — new rail lines, hospital IT systems, that sort of thing. The recurring problem is that the cost and schedule estimates come from the project's own team, built up from their own plans, and they're wrong in the same direction every time: over budget, late. I've read enough Kahneman to know this is the planning fallacy and that the supposed fix is the 'outside view' — ignore the plan, find a reference class of similar projects, and take the distribution of their outcomes. In practice that's where it falls apart for us. What counts as 'similar'? Take the reference class of 'all government IT projects' and we get one number; take 'all health-sector IT projects above a certain size' and we get another; and sometimes the team argues, with what sounds like good reason, that their project really is different — new technology, no precedent, the old ones failed for reasons we've since fixed. And when we do apply the outside view it can feel like it's just saying 'assume you'll fail like everyone else', which is demoralising and maybe not even true for the cases that matter most.

  Write me a decision procedure the panel can actually run on a business case: the questions to ask in order, what counts as a sufficient answer to each, when the outside view should be overridden by inside-view reasoning and what evidence that override requires, and where the procedure has to stop and hand the decision to the panel as a judgement call. Then run it on three cases — (a) a new metro line in a city that already has one, (b) a first-of-its-kind national health data platform, (c) a project whose sponsor has a documented track record of delivering on time — and be honest about the case where the procedure will tell us something we dont want to hear. Finally, say what the procedure can't do and where it's really just dressing up a hunch. No citations, I'll fill those in myself. Keep it to something we can run in a single panel meeting, we haven't got a week per case.
reasoning: |-
  Okay, the user is on an appraisal panel for government projects. They're frustrated because project teams consistently underestimate costs and timelines—classic planning fallacy. They know about Kahneman's outside view but struggle with applying it. The main issues are defining a "similar" reference class and teams claiming their project is unique. They want a practical decision procedure that can be used in a single meeting.

  First, I need to create a structured process that balances the outside view with inside arguments. The user mentioned three cases: a metro line, a health data platform, and a project with a reliable sponsor. The procedure must be efficient but robust.

  Key components: Start with the outside view to ground in reality. Define reference classes clearly. Allow overrides only with strong evidence. Make judgment calls explicit. The challenge is making "similarity" operational. Maybe use tiered reference classes: broad sector, similar scope/size, then tech/context. Need criteria for each step.

  For the metro line (Case A), existing infrastructure should make outside view reliable. But the team might argue differences. The procedure should push back unless they have solid evidence. The health platform (Case C) is trickier. High uniqueness might force reliance on inside view, but with high uncertainty markers. The sponsor history case (Case C) tests how much past success predicts future. Probably moderate adjustment, not total override.

  The user's deeper need: They want to stop rubber-stamping unrealistic plans but avoid blanket pessimism. The procedure must legitimize tough questions and make overrides accountable. Also, they need to communicate decisions objectively, not just gut feeling.

  Limitations: When projects are truly novel, the outside view fails. Also, political pressure isn't addressed. The procedure exposes uncertainty but can't eliminate it. For Case B, they'll have to accept high risk or demand contingencies. That's the "unwanted truth."

  Need a flowchart: Reference class selection → Override checks → Adjustment factors. Keep it to 5 steps max for meeting feasibility. Use clear thresholds (e.g., ≥3 comparable projects). Ban vague uniqueness claims. Track record adjustment capped at 10-15% based on empirical studies like Flyvbjerg.

  Finally, emphasize that steps 4-5 are judgment zones. The procedure structures debate but doesn't remove responsibility. For the health platform example, it forces admitting high unpredictability—that’s valuable even if uncomfortable.
answer: |-
  Here’s a decision procedure designed for your panel—structured, defensible, and executable in a single meeting. It forces explicit justification for deviations from historical baselines while acknowledging unavoidable judgment calls.

  **Decision Procedure: Outside-View Anchor with Conditional Overrides**  
  *(Run sequentially; stop and escalate if any step fails)*  

  1. **Establish the Outside-View Baseline**  
     - **Question:** "What is the 80th percentile cost/duration from the *closest feasible reference class*?" (i.e., P80 from past projects)  
     - **Sufficient Answer:** ≥3 comparable projects with defined scope/size/domain. Default tiers:  
       - *Tier 1 (Best):* Same sector, technology, and scale (e.g., "UK hospital EHR systems >£100M").  
       - *Tier 2 (Acceptable):* Same sector/technology *or* scale (e.g., "global health data platforms" or "all govt IT >£500M").  
       - *Tier 3 (Fallback):* Cross-sector projects with similar complexity (e.g., "megaprojects with high software dependency").  
     - **Stop if:** No reference class with ≥3 projects exists → Proceed to Step 5.  

  2. **Assess "Special Case" Override Claims**  
     - **Question:** "What *specific, measurable* factors make this project an outlier (<10% probability) in the reference class?"  
     - **Sufficient Evidence:**  
       - *Technology:* Not "new tech," but "tech with ≥12 months of smaller-scale validation *in this context*."  
       - *Process Improvements:* "Independent audit of new methodology showing ≥20% efficiency gain in pilots."  
       - *Context:* "Legislation/geography changes objectively reducing scope by ≥15% vs. peers."  
     - **Reject:** Vague claims ("lessons learned," "better team," "no legacy systems").  

  3. **Adjust for Sponsor Track Record (If Applicable)**  
     - **Question:** "What is this sponsor’s historical cost/delivery variance vs. their *own initial estimates* on ≥3 similar projects?"  
     - **Sufficient Evidence:** Audited project closure reports showing consistent performance.  
     - **Adjustment Rule:**  
       - If sponsor beats estimates by ≥10% consistently, *reduce* P80 baseline by 5%.  
       - If sponsor meets estimates (±10%), use baseline unchanged.  
       - If sponsor misses estimates by >10%, *increase* baseline by 5–10%.  
     - **Stop if:** No sponsor track record → No adjustment.  

  4. **Apply Realism Test to Inside View**  
     - **Question:** "Does the project team’s estimate fall below the *adjusted* P80 baseline?"  
       - If **YES:** Require *all*:  
         - A signed risk register with ≥30% contingency reserve.  
         - Commitment to quarterly independent reviews.  
         - **Judgment Call:** Panel votes on accepting high-risk variance.  
       - If **NO:** Accept baseline as the approval threshold.  

  5. **Final Judgment Zone**  
     - **Trigger:** No reference class (Step 1) or unresolved high variance (Step 4).  
     - **Panel Must:**  
       - Define explicit "kill criteria" (e.g., "Cancel if Phase 1 exceeds P50 by 20%").  
       - Mandate a staged gate funding release.  
       - Document assumptions for an audit trail.  

  ---

  **Procedure Applied to Cases**  
  *(P80 baselines illustrative; use your internal data)*  

  **Case A: New Metro Line in Existing City**  
  1. **Baseline:** Reference class = "Urban metro extensions in OECD cities" (P80: +40% cost, +35% time).  
  2. **Override Claims:** "Softer ground in Section 3" → Insufficient without geotech trial data vs. class average.  
  3. **Sponsor Track:** N/A (city transport body).  
  4. **Realism Test:** Team estimate at +15% cost → **Fails.** Require 30% contingency + independent reviews.  
  5. **Judgment:** Approve with Stage 1 funding only; kill if boring machine progress <80% of plan after 6mo.  
     - *Truth you don’t want:* "Your ‘unique’ ground conditions are in the reference class distribution."  

  **Case B: First-of-Its-Kind National Health Data Platform**  
  1. **Baseline:** No Tier 1/2 class → Fallback to "Govt cross-agency IT megaprojects" (P80: +120% cost, +80% time).  
  2. **Override Claims:** "No legacy integration!" → Rejected (all govt IT claims this; class includes greenfield).  
  3. **Sponsor Track:** New team → No adjustment.  
  4. **Realism Test:** Team estimate at +25% cost → **Fails catastrophically vs. baseline.**  
  5. **Judgment:** **Reject business case.** Demand re-submittal as 3 staged proofs-of-concept with separate funding.  
     - *Truth you don’t want:* "Your ‘unprecedented’ project’s failure mode is precedented 120% overrun."  

  **Case C: Project with On-Time Sponsor**  
  1. **Baseline:** "Regional hospital builds 2020–2030" (P80: +35% cost).  
  2. **Override Claims:** "Modular construction" → Accepted only if prefab factory output data shows 25% faster vs. traditional.  
  3. **Sponsor Track:** Auditor shows 3 projects delivered at −5% cost → **Reduce baseline to +30%.**  
  4. **Realism Test:** Team at +20% → **Still below adjusted P80 (+30%).** Approve with standard contingency.  
     - *Caveat:* Past success ≠ future proof. Track record adjustment is minimal for a reason.  

  ---

  **What This Procedure Can’t Do (Dressing the Hunch)**  
  - **Define "similar" in novel domains:** Choosing Tier 2 vs. Tier 3 reference classes is subjective. The panel’s experience fills the gap.  
  - **Quantify black swans:** A "truly unique" project (e.g., pandemic vaccine rollout) relies on expert judgment (Step 5).  
  - **Override politics:** If ministers demand approval, the procedure exposes risks but can’t block dogma.  
  - **Fix delusion:** Teams who insist "This time is different!" without evidence will force a Judgment Zone—where the panel’s gut rules.  

  **Execution in Meeting:**  
  - **Pre-work:** Secretariat compiles reference class data 1 week ahead.  
  - **Meeting Flow:** 20 mins per case on Steps 1–4; 10 mins on Step 5/judgment. Reject claims lacking evidence on the spot.  
  - **Output:** Approval tied to explicit triggers (contingency %, stage gates, kill criteria).  

  This forces teams to engage with history while allowing principled exceptions. The uncomfortable truth? Most "special" projects aren’t special—and the procedure makes that undeniable.
