  Now their trilemma: 
  (1) Precision as state - when marginals agree, we have definite belief
  (2) Conditioning as restriction - update by conditioning each P in M
  (3) No vagueness creation - learning shouldn't widen intervals

  The example indeed forces choosing between these. I find the trilemma fair - they're not stacking the deck. Each principle seems intuitively reasonable independently, but jointly incompatible in this case. The violation is genuine.

