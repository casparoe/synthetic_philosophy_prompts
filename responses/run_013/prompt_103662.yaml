  #### Lamp
  - **Relevant quantity**: State (e.g., 0 for off, 1 for on).
  - **Analysis**: The state oscillates (1, 0, 1, 0, ...) at times approaching the hour. This sequence does not converge because it lacks a limit point; it alternates forever without settling.
