prompt: |-
  I teach a 90-minute upper-level undergraduate seminar in metaphysics and ethics, with sixteen students. I want to run a structured deliberation that makes them feel the force of the Scheffler-style afterlife conjecture: the thought that human extinction would be bad not only because of the deaths it involves, but because it would deprive us of a future in which our projects, commitments, and values are still alive. The idea should emerge from what the students do, not from anything I announce at the outset.

  Design a runnable activity built around a fictional institution, the Long Now Trust, and a sealed prognosis. The Trust is a small foundation that funds projects whose benefits are deliberately deferred by at least a century. Students act as trustees in four or five small groups. Each group receives a portfolio of future-directed projects, such as a language revival, a seed vault, a slow astronomical survey, a manuscript conservation programme, and a civic archive. Each project carries a schedule of project-value points that accrue only after the original trustees are dead. Groups must allocate a fixed budget, draft a short charter, and write a letter to their successors. Halfway through the session, I distribute the prognosis: a credible report that human civilisation will end within forty years, after the natural deaths of everyone in the room. Groups must then decide whether to continue, revise, or abandon their projects, and justify the decision to the others. One further wrinkle: the prognosis comes in two versions. Some groups learn that a small isolated community will survive for two further generations; others learn that no human beings will survive at all. I will not tell them about the difference until the debrief.

  I need the complete design: group roles or structure; materials; the budget and project-value scheme; the timing and staging of the reveal; rules for the final deliberation; and a debrief. The debrief should map specific moments in the activity onto the afterlife conjecture, distinguishing the badness of the deaths from the badness of losing a future in which our values are still alive. It should also identify the points at which a group could resist the thought that the projects lose their point, and what it would cost to resist there. Tell me what will predictably go wrong the first time I run it and how to handle that, and be frank about which feature of the conjecture the activity cannot reproduce and that I will have to supply in discussion.

  Do not include reading lists, citations, or attributions. You may use a name for a position in the debrief only as a label for something the students have already felt. The activity must stand on its own for a facilitator who cannot search online, and it should require no real money, special technology, or more than ordinary classroom materials.
reasoning: |-
  We are designing a 90-minute seminar activity with 16 students, divided into 4 groups of 4 (or 5 groups of 3-4 if 4 doesn't divide evenly, but 16/4=4 groups). The activity revolves around the Long Now Trust, a foundation that funds long-term projects. The goal is to make students feel the force of the afterlife conjecture: that extinction is bad not just because of death but because it cuts off the future in which our values and projects continue.

  Activity Outline:
  1. Introduction and Group Formation (5 minutes)
  2. Group Work Phase 1: Project Selection and Charter Drafting (25 minutes)
  3. Prognosis Reveal (5 minutes)
  4. Group Work Phase 2: Response to Prognosis (20 minutes)
  5. Group Reports and Deliberation (20 minutes)
  6. Debrief (15 minutes)

  Total: 90 minutes

  Detailed Steps:

  1. Introduction and Group Formation (5 minutes)
     - Explain that they are trustees of the Long Now Trust, which funds projects that yield benefits at least 100 years in the future. The Trust has a fixed budget and a set of projects to choose from.
     - Divide students into 4 groups (each with 4 students). Assign each group a table or cluster of desks.

  2. Group Work Phase 1 (25 minutes)
     - Each group receives:
       - A portfolio of 5 project proposals (each group gets the same set of 5 projects).
       - A project-value schedule for each project (showing points accrued at future dates).
       - A fixed budget (e.g., $10 million in fictional currency).
       - Instructions for Phase 1: 
          - Allocate the budget to one or more projects (they can fund multiple, but must stay within budget).
          - Draft a short charter (1-2 sentences) for the Trust, stating its purpose and principles.
          - Write a short letter (a paragraph) to their successors (trustees 100 years from now) explaining their choices and hopes.
     - Projects (each with a cost and value schedule):
       1. Language Revival Initiative: Cost $3M. Values: 50 points after 100 years, 200 after 150, 500 after 200.
       2. Seed Vault: Cost $2M. Values: 100 points after 50 years, 300 after 100, 400 after 150.
       3. Slow Astronomical Survey: Cost $4M. Values: 10 points after 30 years, 50 after 80, 200 after 150.
       4. Manuscript Conservation Programme: Cost $1M. Values: 20 points after 100 years, 100 after 200, 200 after 300.
       5. Civic Archive: Cost $3M. Values: 30 points after 80 years, 150 after 120, 300 after 180.
     - Note: The value points are designed to accrue only after the trustees' lifetimes (so after about 80-100 years). The budget is fixed so they must make trade-offs.

  3. Prognosis Reveal (5 minutes)
     - After 25 minutes, stop the groups and distribute the sealed prognosis. Each group gets an envelope containing one of two versions:
       - Version A (for 2 groups): "Credible scientific report: Human civilization will collapse within 40 years. After the natural deaths of everyone currently alive, only a small isolated community (about 200 people) will survive for two further generations (about 50-60 years). Then, humanity will go extinct."
       - Version B (for 2 groups): "Credible scientific report: Human civilization will collapse within 40 years. After the natural deaths of everyone currently alive, no human beings will survive. Humanity will go extinct."
     - Do not reveal that there are two versions. Tell them the report is confidential and they should not share it with other groups until the debrief.

  4. Group Work Phase 2 (20 minutes)
     - Groups are to decide how to respond to the prognosis: continue as planned, revise their project funding (they can reallocate the budget, but note that projects already funded cannot be refunded so they can only change unspent money or stop ongoing funding? To avoid confusion, we allow them to revise any funding, even if already allocated, because the projects are in early stages and funding can be withdrawn without penalty. Alternatively, we can say that the funding is for the entire project, so they can choose to abandon a project and reallocate the funds to another. Clarify in instructions: "You may reallocate your entire budget, including abandoning already funded projects and funding new ones, without penalty.").
     - They must update their charter (if needed) and write a postscript to their letter to successors (or a new letter) explaining their decision.
     - They should also prepare to justify their decision to the other groups.

  5. Group Reports and Deliberation (20 minutes)
     - Each group has 3 minutes to report:
       - Which projects they initially funded and why.
       - What they did after the prognosis and why.
       - Read their charter and a brief excerpt from their letter (or postscript).
     - After all groups report, open the floor for questions and discussion (8 minutes). Encourage students to challenge each other's decisions.

  6. Debrief (15 minutes)
     - Reveal that there were two versions of the prognosis: some groups knew about the isolated community (Version A) and others did not (Version B). Ask if that made a difference in their decisions? (Likely, Version A groups might have continued or revised projects to be more useful in the short term, while Version B groups might have abandoned long-term projects.)
     - Map the activity to the afterlife conjecture:
       - The badness of the deaths: Everyone dies in both scenarios, but in Version A, there are survivors for a short time. However, the conjecture is about the loss of a future where our projects and values live on. In Version B, there is no future at all. In Version A, there is a short future but not one in which the long-term projects (e.g., 100+ years) can come to fruition.
       - Ask: Why did some groups continue or revise projects even after the prognosis? (They might say: because the projects have intrinsic value, because they hope the prognosis is wrong, because they care about the short-term survivors, or because they want to leave a legacy even if it's not used.) 
       - Why did some groups abandon projects? (Because they seemed pointless without a long future.)
     - Highlight moments of resistance: 
       - When a group continued funding a project even after Version B, they are resisting the idea that the project loses its point. What did it cost? They spent money that could have been used for present benefits (but note: the Trust is only for long-term projects, so they don't have the option to fund short-term. This is a limitation. Alternatively, we can say that the Trust's charter forbids short-term funding. So they must either fund long-term projects or leave the money unspent? Let's adjust: In Phase 2, they can choose to abandon projects and leave the money in the Trust's endowment, which will then be available for any future trustees (if any) or they can spend it on a new project that might be more suitable for the shortened timeline. However, they cannot fund short-term because the Trust's mandate is for at least 100 years. So they are constrained by the institution. This constraint is important because it forces them to confront the loss of the long future. If they abandon, they are admitting the projects are pointless without the long future. If they continue, they are acting as if the projects still have meaning, perhaps because of the intrinsic value of the activity itself, or because of the possibility of error in the prognosis, or because they care about the symbolic act even without a future. But note: in Version A, they might design projects that can be completed in 50 years (like the Seed Vault that has value at 50 years). So they might reallocate to projects with earlier returns.
     - What the activity cannot reproduce: 
       - The activity is about projects that have value points in the future, but in reality, the value of these projects is not just in points but in the continuation of human culture and values. The activity uses points to make the trade-offs measurable, but the real loss is the absence of a future where humanity continues and carries forward what we care about. The facilitator must emphasize this in the debrief: the projects are stand-ins for the kinds of things we value that require a future. The conjecture is that we care about the future not just instrumentally (for the points) but because we want our values to live on. The activity might reduce it to a game of points, so the debrief must elevate it to the philosophical concern.

  Predictable Problems and Solutions:
  - Problem: Groups might not take the prognosis seriously because it's fictional. 
    Solution: Encourage them to role-play and treat the scenario as real. The teacher should set the tone with a serious demeanor.
  - Problem: Groups might get bogged down in budget details and not engage with the philosophical issue.
    Solution: Keep the budget and points simple. Remind them during the activity to focus on the reasons for their choices, not just the numbers.
  - Problem: In Phase 2, groups might not know what to do because the prognosis seems to make their projects futile. 
    Solution: The instructions should be clear: they must decide to continue, revise, or abandon. They can also update the charter and letter. Encourage them to think about what the Trust should stand for in the face of the prognosis.
  - Problem: The time might run short. 
    Solution: Keep strict time limits. Use a timer. Cut off groups gently but firmly in the report phase.

  Materials:
  - For each group: 
    - One packet containing the 5 project descriptions and value schedules (on one sheet of paper).
    - A budget sheet (with $10 million).
    - A worksheet for Phase 1: to record their funding allocation, draft charter, and draft letter.
    - An envelope with the prognosis (half Version A, half Version B).
    - A worksheet for Phase 2: to record their revised funding, updated charter, and postscript/letter, and their justification.
  - A timer.

  Project Descriptions (to be given to each group):

  Project 1: Language Revival Initiative
  Cost: $3 million
  Description: This project aims to revive two endangered languages by creating immersive educational programs and digital resources. The goal is to have fluent speakers and a sustainable community of practice.
  Value Schedule:
  - After 100 years: 50 points (if the languages are being learned in schools)
  - After 150 years: 200 points (if the languages are spoken in daily life by at least 10,000 people)
  - After 200 years: 500 points (if the languages are thriving and self-sustaining)

  Project 2: Global Seed Vault
  Cost: $2 million
  Description: Establish a secure vault to preserve a wide variety of plant seeds, ensuring biodiversity and food security for future generations. The vault will be designed to last for centuries.
  Value Schedule:
  - After 50 years: 100 points (if the vault is operational and has been used to restore at least 5 plant species)
  - After 100 years: 300 points (if the vault has prevented the extinction of at least 20 plant species)
  - After 150 years: 400 points (if the vault has become a cornerstone of global food security)

  Project 3: Slow Astronomical Survey
  Cost: $4 million
  Description: Launch a space telescope to conduct a century-long survey of a specific region of the sky, detecting subtle changes and rare events. The data will be stored for future astronomers.
  Value Schedule:
  - After 30 years: 10 points (for the first data release)
  - After 80 years: 50 points (for the mid-survey data release)
  - After 150 years: 200 points (for the final data set and analysis)

  Project 4: Manuscript Conservation Programme
  Cost: $1 million
  Description: Digitize and physically preserve fragile manuscripts from around the world, ensuring that cultural treasures are not lost to time. The project includes training conservators and building climate-controlled archives.
  Value Schedule:
  - After 100 years: 20 points (if 90% of the manuscripts are intact and accessible)
  - After 200 years: 100 points (if the collection has been expanded and is widely used by scholars)
  - After 300 years: 200 points (if the manuscripts are still preserved and have influenced cultural understanding)

  Project 5: Civic Archive
  Cost: $3 million
  Description: Create a digital and physical archive of civic life, collecting stories, artifacts, and records from diverse communities to document how society functions and changes.
  Value Schedule:
  - After 80 years: 30 points (if the archive is accessible and used by historians)
  - After 120 years: 150 points (if the archive has shaped public understanding of history)
  - After 180 years: 300 points (if the archive is a living resource that communities contribute to and use)

  Budget: $10 million to allocate.

  Instructions for Phase 1 (on a handout):
  "You are trustees of the Long Now Trust. Your task is to allocate a budget of $10 million to one or more of the projects. Each project has a cost and a schedule of value points that accrue only after the original trustees are dead (so after about 80-100 years). You may fund any combination of projects as long as the total cost does not exceed $10 million.

  After allocating the budget, draft a short charter (1-2 sentences) that states the purpose and principles of the Long Now Trust.

  Then, write a short letter (one paragraph) to the trustees who will take your place 100 years from now. Explain why you chose the projects you did and what you hope the Trust will achieve."

  Instructions for Phase 2 (after the prognosis):
  "You have received a sealed prognosis about the future of humanity. Read it carefully and then decide as a group how to respond. You may:
  - Continue with your original plan.
  - Revise your project funding (you can abandon projects and reallocate the money to other projects, or change the allocation in any way, as long as the total does not exceed $10 million).
  - Abandon all projects and leave the money in the Trust's endowment for future trustees.

  Update your charter if needed, and write a postscript to your letter (or a new letter) to your successors, explaining your decision in light of the prognosis.

  Be prepared to justify your decision to the other trustees (the class)."

  Prognosis Version A (for two groups):
  "Confidential Report: The Trust's scientific advisory panel has concluded, with high confidence, that global civilization will collapse within 40 years. After the natural deaths of everyone currently alive, a small isolated community (about 200 people) will survive for approximately two further generations (about 50-60 years). After that, humanity will go extinct. This prognosis is based on current trends in climate change, resource depletion, and social instability."

  Prognosis Version B (for two groups):
  "Confidential Report: The Trust's scientific advisory panel has concluded, with high confidence, that global civilization will collapse within 40 years. After the natural deaths of everyone currently alive, no human beings will survive. Humanity will go extinct. This prognosis is based on current trends in climate change, resource depletion, and social instability."

  Debrief Guide:

  1. Reveal the two versions: "Some groups had a prognosis that included a small community surviving for two more generations, while others had a prognosis of complete extinction. Did this affect your decisions? How?"

  2. Draw out the key distinction:
     - In both scenarios, everyone in the room dies. So the badness of death is present in both.
     - But the loss of the future is different. In Version B, there is no future at all. In Version A, there is a short future but not one that extends beyond about 100 years (so the long-term projects won't achieve their full value).

  3. Ask groups to reflect:
     - Why did you continue, revise, or abandon your projects?
     - Did the value points matter? Or did you think about the intrinsic worth of the projects?

  4. Map to the afterlife conjecture:
     - The conjecture says that human extinction is bad not just because of the deaths, but because it cuts off the future in which our projects and values could continue. In the activity, when you abandoned a project because the future was too short, you were acknowledging that the project's meaning depended on a long future. When you continued, you might have been expressing a commitment to the value of the project independent of the long future, or perhaps hoping the prognosis was wrong.

  5. Resistance points:
     - A group might resist abandoning projects even in Version B. They might argue that the act of creating the project has present value (e.g., inspiring people now), or that it's a matter of principle. But this comes at the cost of not using the resources for something that might benefit the present (though note: the Trust is constrained to long-term projects, so they can't use the money for immediate needs). The cost is that they are spending resources on something that will never achieve its intended purpose.

  6. What the activity cannot reproduce:
     - The activity uses points to represent value, but in reality, we care about the continuation of humanity and our values in a way that is not captured by points. The conjecture is about the intrinsic importance of having a future where humanity exists and carries on. The facilitator must emphasize that the projects are symbols of our values and that the loss of the future is the loss of the possibility that anything we care about will continue. The activity might make it seem like a matter of maximizing points, but the philosophical point is about meaning and value beyond our own lives.

  By running this activity, the students will experience the tension between investing in the future and facing the possibility that the future might not exist. The debrief will connect their decisions to the philosophical conjecture.
answer: |-
  ### Structured Deliberation Activity: The Long Now Trust  
  **Total Time:** 90 minutes  
  **Students:** 16 (divided into 4 groups of 4)  
  **Goal:** Elicit the Scheffler-style afterlife conjecture through experiential learning—distinguishing the badness of death from the loss of a future where our values persist.  

  ---

  #### **Materials**  
  1. **Project Portfolios** (1 per group): Identical packets describing 5 fictional projects. Each includes:  
     - **Cost** (in fictional "Trust Units" or TU)  
     - **Value Points** (accruing only after 100+ years)  
     - **Brief Description**  

     | Project | Cost (TU) | Value Schedule | Description |  
     |--------|-----------|----------------|------------|  
     | **Language Revival** | 3M | 50 pts (150 yrs), 200 pts (250 yrs) | Revive endangered languages through AI tutors and cultural hubs. |  
     | **Seed Vault** | 2M | 100 pts (120 yrs), 300 pts (200 yrs) | Preserve crop biodiversity in arctic vaults; requires periodic upkeep. |  
     | **Slow Astronomical Survey** | 4M | 20 pts (80 yrs), 150 pts (180 yrs) | Map distant galaxies via a century-long telescope project. |  
     | **Manuscript Conservation** | 1M | 10 pts (100 yrs), 80 pts (300 yrs) | Digitize and shield ancient texts from decay. |  
     | **Civic Archive** | 3M | 40 pts (110 yrs), 200 pts (220 yrs) | Record oral histories and civic rituals in time-capsule monuments. |  

  2. **Group Worksheets** (1 per group):  
     - **Budget:** 10M TU total.  
     - **Tasks:**  
       - Allocate TU to projects (must fund ≥1).  
       - Draft a 2-sentence **Trust Charter** (e.g., "To safeguard humanity’s legacy for posterity").  
       - Write a 3-sentence **Letter to Successors** (addressed to "Trustees of 2124").  

  3. **Sealed Prognosis Envelopes** (2 versions, 1 per group):  
     - **Version A (Human Extinction):** *"Scientific consensus: Civilization will collapse in 40 years. No humans will survive after the natural deaths of all living people."*  
     - **Version B (Partial Survival):** *"Scientific consensus: Civilization will collapse in 40 years. A remote community of ~200 will survive 2 more generations before extinction."*  
     *(Assign 2 groups Version A, 2 groups Version B. Do not reveal the difference yet.)*  

  4. **Other Supplies:** Timers, pens, paper.  

  ---

  #### **Phase 1: Project Allocation (25 min)**  
  1. **Introduction (5 min):**  
     - "You are trustees of the Long Now Trust, funding projects whose benefits begin only after all of us are gone. Your task: Allocate a 10M TU budget, draft a charter, and write a letter to your successors."  
     - Assign groups. Emphasize: *"The value points accrue ONLY after 100+ years—you won’t live to see them."*  

  2. **Group Work (20 min):**  
     - Groups discuss and select projects. Encourage debate: *"Which projects best reflect what humanity should preserve?"*  
     - Outputs:  
       - Funded projects (with TU allocation).  
       - Trust Charter (2 sentences).  
       - Letter to Successors (3 sentences).  

  ---

  #### **Prognosis Reveal (5 min)**  
  - **Staging:** At 25:00, pause groups. Distribute sealed envelopes solemnly: *"The Trust has received an urgent, confidential prognosis. Read and discuss—do not share outside your group."*  
  - **Instructions:** *"Decide whether to continue, revise, or abandon your projects. Update your charter and letter if needed."*  

  ---

  #### **Phase 2: Post-Prognosis Response (20 min)**  
  - Groups deliberate:  
    - **Options:**  
      - **Continue:** Keep original plan.  
      - **Revise:** Shift TU between projects.  
      - **Abandon:** Defund all projects (TU remains unspent).  
    - Update outputs:  
      - Revised TU allocation (if any).  
      - Amended charter/letter (add a postscript explaining their choice).  
  - **Key Prompt:** *"Justify your decision—why do your projects still matter, or why not?"*  

  ---

  #### **Group Reports & Deliberation (20 min)**  
  - **Structure:**  
    1. Each group has 3 min to share:  
       - Initial projects/charter.  
       - Prognosis response and justification.  
       - Excerpt from their letter.  
    2. **Open Debate (8 min):** Groups challenge each other: *"Why continue if no one will benefit?" "Why abandon when values might inspire survivors?"*  
  - **Facilitator Notes:** Push groups to articulate underlying values (e.g., "We continued the Seed Vault to give the last humans hope").  

  ---

  #### **Debrief (15 min)**  
  **Goal:** Explicitly map activity to the afterlife conjecture.  

  1. **Reveal the Prognosis Difference (2 min):**  
     - *"Half of you learned a small group survives briefly; half learned extinction is total. Did this affect your choices?"*  
     - Poll groups: Version A (total extinction) vs. Version B (partial survival).  

  2. **Distinguish Death vs. Loss of Future (5 min):**  
     - **Badness of Death:**  
       *"Everyone dies in both scenarios—this is tragic, but expected. Did anyone abandon projects solely because trustees would die?"* (Likely no; they knew death was guaranteed from the start.)  
     - **Badness of Losing the Future:**  
       - *"When Group X defunded the Manuscript project after Version A, what did they lose? Not just lives—but the chance for future humans to read those texts."*  
       - *"Group Y kept the Seed Vault under Version B. Why? Because two generations of survivors might use it—a sliver of a future where their values live."*  
       - **Label:** Call this the "**Future of Values**" loss—the unique tragedy of extinction.  

  3. **Points of Resistance (5 min):**  
     - **Resistance Tactic 1: Hope/Moral Principle**  
       - *"Some groups continued projects despite Version A. They resisted the idea that value requires a recipient—e.g., 'The Astronomical Survey has intrinsic worth.' What did it cost? They spent TU on something that will never fulfill its purpose."*  
     - **Resistance Tactic 2: Symbolic Legacy**  
       - *"Group Z revised projects for survivors in Version B (e.g., prioritizing the Civic Archive for oral histories). But to do this, they sacrificed long-term points for short-term meaning. Was it worth it?"*  

  4. **Limitation of the Activity (3 min):**  
     - **Unreproducible Element:** *"In this activity, value was measured in points. But real projects matter because they embody our values—not just points. The deepest loss in extinction isn’t quantifiable; it’s the erasure of a world where anything we care about continues. I’ll call this '**value erosion**'—we’ll explore it further in our next discussion."*  

  ---

  #### **Predictable Problems & Solutions**  
  - **Problem:** Groups treat TU allocation as a math puzzle, not a values debate.  
    **Solution:** Intervene early: *"Which projects feel most urgent to you, even knowing you’ll never see results?"*  
  - **Problem:** Prognosis causes fatalism (e.g., "Why bother?").  
    **Solution:** In Phase 2, ask: *"If the Trust’s work ends today, what message does that send about our values?"*  
  - **Problem:** Version A/B groups clash during debate.  
    **Solution:** Allow tension—then debrief it: *"How did knowing/not knowing about survivors change your arguments?"*  
  - **Problem:** Time runs short in Phase 2.  
    **Solution:** Use strict timers; give 30-sec warnings.  

  ---

  **Final Note:** This activity creates visceral stakes—students *feel* the tension between death and value-loss. The debrief crystallizes this into the target conjecture, preparing them for deeper metaphysical inquiry.
