  First, considering hospital adoption scenarios since they meet the competence requirement. A new surgical technique seems promising - perfect for showing rational individuals making sequential decisions. The key is structuring the first three decisions carefully:

  For the initial case:
  - Surgeon 1 has weak private evidence (one successful case) but adopts due to personal experience
  - Surgeon 2 sees this adoption plus their own ambiguous evidence (success with complications)
  - Surgeon 3 observes two adoptions and overrides their own failed trial

  This creates the cascade while maintaining individual rationality. Each surgeon's Bayesian update makes sense given what they observe.

  Now for the twist: introducing correlated evidence through a shared training program. Same actions occur, but now early signals aren't independent - they all stem from the same flawed instruction. This fundamentally changes the epistemic situation while keeping behaviors identical.

  Important distinctions:
  - Textbook consensus: independence assumption is crucial for information cascades
  - Contested point: whether decision-makers adequately account for correlation sources
  - The critical feature: conditional independence of signals

  The defender's counterargument would focus on how rare perfect independence is, but their weakness is ignoring that correlation can persist even when known. The case shows removing the shared source restores independence, proving it's the linchpin.

