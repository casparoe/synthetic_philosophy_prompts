prompt: |-
  ok this is half a stats question and half a history question, sorry.

  In study hall I got bored and made a spreadsheet. One column was totally random numbers, like coin flips. The next column averaged each number with the four before it. The averaged column comes out looking like a wave — up for a while, peak, down, bottom, up again — even though nothing underneath it is doing anything except flipping. Then I tried averaging over 2 and over 20 instead of 4 and I got waves of different lengths, and every single one of them looks like a real pattern if you just look at the graph and not at the numbers underneath.

  Then I watched a video about how history moves in these big long cycles, like two hundred years of building up and then a collapse, and they showed a graph of some historical number per decade with a smooth line through it, and sure enough it had waves, pretty much like my spreadsheet. They also had to pick a cutoff for how big a war counts as "big," and when I messed with the cutoff the waves moved around.

  So: does the first thing have a name? The fact that averaging out random stuff manufactures a wave? And is the second thing the same problem or a different one, because picking a cutoff feels kind of different from smoothing. If there is a word for it I want to know what it actually covers and where it stops — how do I tell a real cycle from one I could of made myself, and is "cycle" even the right way to talk about something you can only see after you've already picked the window and the cutoff? A name by itself won't help me, I need the line. Also my stats teacher said something about random walks but I didn't really follow it. If the answer is that you can't tell, does that kill the whole idea that history runs on a clock, or is there some way people still do this properly?
