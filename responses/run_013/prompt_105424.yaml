answer: |-
  ### Promise Obligation Exploration Activity  
  **Objective:** To create tangible experiences where students confront the intrinsic obligation of a promise, separate from external factors like reliance, reciprocity, or social consequences.  

  ---

  #### **Materials**  
  - **Tokens:** 100 small, identical tokens (e.g., poker chips, buttons, or paper slips).  
  - **Decision Cards:** Index cards (4 per student) for private choices.  
  - **Promise Slips:** Small paper slips (4 per student) for written promises.  
  - **Box/Envelope:** For anonymous submission of decision cards.  
  - **Whiteboard/Chart:** To track token totals (optional; can be replaced with verbal updates).  
  - **Timer:** For managing phases.  

  #### **Setup**  
  - **Token Economy:** Each student starts with 5 tokens. Tokens are redeemable for minor privileges (e.g., 1 token = 1 extra point on a low-stakes quiz, or 3 tokens = pick a music track for the next class).  
  - **Chairs:** Arrange in a circle to facilitate pairing.  
  - **Roles:** Teacher as facilitator. No scripted players needed.  

  ---

  ### **Sequence of Phases (75 min total)**  
  *(Adjust timing based on discussion flow)*  

  #### **Phase 1: Baseline Round—Public Promises with Social Enforcement (15 min)**  
  - **Rules:**  
    1. Pair students randomly (8 pairs).  
    2. Each student writes a promise slip: *"I promise to give you 1 token within 5 minutes."* Exchanges slips with their partner.  
    3. **Public action:** Promisors must physically hand 1 token to their promisee in front of the group.  
  - **Why it works:** Social pressure and reciprocity are salient. Students see immediate consequences (token loss/gain) and mutual observation.  
  - **Debrief Hook (2 min):** *"Why did you follow through? Was it just because everyone was watching?"*  

  #### **Phase 2: Private Decision—No Audience (15 min)**  
  - **Rules:**  
    1. Re-pair students (new partners).  
    2. Repeat promise slips: Same wording.  
    3. **Private choice:** Promisors decide alone whether to give 1 token. They write *"Gave"* or *"Kept"* on a decision card and drop it anonymously in a box. *No one observes their choice.*  
    4. **Twist:** Promisees are told they’ll never learn the outcome.  
  - **Why it works:** Removes social enforcement. Students confront whether the obligation persists without witnesses.  
  - **Debrief Hook (2 min):** *"If you kept the token, why? If you gave it, what compelled you?"*  

  #### **Phase 3: Promisee Withdraws Consent—"I Don’t Want It Anymore" (20 min)**  
  - **Rules:**  
    1. Re-pair students (new partners).  
    2. Repeat promise slips.  
    3. **Promisee release:** Before promisors decide, promisees write on a slip: *"I release you from this promise. Keep your token."*  
    4. **Private choice:** Promisors decide anonymously whether to give the token *anyway* (despite release).  
  - **Why it works:** Challenges if the promisee’s authority is essential to dissolve the obligation.  
  - **Debrief Hook (3 min):** *"Did the release feel like permission? Or did you still feel bound?"*  

  #### **Phase 4: Promisee Out of the Picture—No Recipient (15 min)**  
  - **Rules:**  
    1. Re-pair students (new partners).  
    2. Repeat promise slips.  
    3. **Twist:** Before decisions, announce: *"Your promisee has left the activity. Tokens given to them will be discarded."*  
    4. **Private choice:** Promisors decide anonymously whether to "give" (discard) or keep their token.  
  - **Why it works:** Tests if the act itself creates obligation, even when the promisee is gone and the token is worthless.  
  - **Debrief Hook (3 min):** *"Why give a token that helps no one? Is the promise ‘to them’ or ‘to yourself’?"*  

  ---

  ### **Debrief (25 min)**  
  **Goal:** Map experiences to philosophical theories and highlight the puzzle.  

  #### **Step 1: Report Data (5 min)**  
  - Share anonymous aggregates (e.g., *"In Phase 2, 70% gave tokens privately; in Phase 4, 30% discarded tokens"*). Avoid judgment; focus on patterns.  

  #### **Step 2: Connect to Theories (15 min)**  
  | **Experience**                      | **Theory 1: Social Practice (e.g., Hume, Rawls)**                                                                 | **Theory 2: Authority Transfer (e.g., Owens, Shiffrin)**                                                                 |  
  |-------------------------------------|--------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------|  
  | **Phase 1 (Public)**                | Obligation from reciprocity and social expectations.                                                               | Obligation from giving the promisee authority over your action.                                                          |  
  | **Phase 2 (Private)**               | If obligation drops, it was socially dependent. If not, what internal force remains?                               | Authority persists—promisee still "owns" your commitment, even privately.                                                |  
  | **Phase 3 (Promisee Releases)**     | Release removes expectation → no obligation.                                                                       | Only promisee can dissolve obligation → release matters, but some may feel bound anyway.                                 |  
  | **Phase 4 (No Recipient)**          | No social utility → no obligation.                                                                                 | Authority survives absence → obligation endures (e.g., "I promised *them*").                                             |  

  **Key Trap to Flag:**  
  - *"Did you keep a promise to avoid guilt? Is that the same as feeling bound? Or is guilt a psychological side effect?"*  

  #### **Step 3: Discuss the Puzzle (5 min)**  
  - **Core Tension:** *"Where does the obligation come from? Is it the social practice (reliance, expectations) or the act of promising itself (giving authority to the promisee)?"*  
  - **Student Prompt:** *"When did you feel the obligation most/least? Why?"*  

  ---

  ### **Limitations and Pitfalls**  
  #### **What This Can’t Replicate**  
  1. **Promises to the dead:** Cannot simulate irreversible absence or posthumous authority.  
  2. **Promises to oneself:** No second party to transfer authority or observe.  
  3. **High-stakes promises:** Low tokens may reduce emotional weight (offset by privileges).  
  4. **Cultural/contextual norms:** Activity assumes a Western individualistic view of promises.  

  **How to Address:** Briefly discuss these in debrief: *"Would you feel bound to a dead person? Why? Is a promise to yourself even possible?"*  

  #### **Predictable Problems & Fixes**  
  1. **Problem:** Students treat it as a game ("Token maximizers" break all promises once private).  
     - **Fix:** Pre-activity framing: *"This isn’t about winning tokens—it’s about noticing your own reactions. Be honest."* Debrief it: *"Did anyone break promises strategically? What does that say about obligation vs. self-interest?"*  

  2. **Problem:** Pairing issues (e.g., friends colluding, awkward partnerships).  
     - **Fix:** Use random pairings (draw names from a hat). Rotate every round.  

  3. **Problem:** Some promisees "release" too easily in Phase 3.  
     - **Fix:** Encourage promisees: *"Only release if you genuinely don’t want the token."* If most release, discuss: *"Why might we want to release others? Does that weaken the obligation?"*  

  4. **Problem:** Students don’t take tokens seriously.  
     - **Fix:** Tie tokens to desirable, non-academic privileges (e.g., choosing a discussion topic). Emphasize stakes upfront.  

  ---

  ### **Timing Summary**  
  - **Setup:** 5 min (distribute materials, explain tokens).  
  - **Phase 1:** 15 min  
  - **Phase 2:** 15 min  
  - **Phase 3:** 20 min  
  - **Phase 4:** 15 min  
  - **Debrief:** 25 min  
  - **Buffer:** 5 min (for transitions).  

  **Total:** 80 minutes.  

  This design forces students to *feel* the tension between external explanations (reliance, reciprocity) and the internal authority of a promise. By stripping away supports incrementally, they confront the "puzzle" viscerally—making the subsequent theory discussion grounded and personal. The tokens create just enough stakes to make choices meaningful without overshadowing the moral intuition you’re targeting.
