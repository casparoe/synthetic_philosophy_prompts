      - Introduction: 5 min
      - Round 1: 15 min (pairing, promising, public decision)
      - Round 2: 15 min (re-pair, promise, private decision)
      - Round 3: 15 min (re-pair, promise, promisee's release decision, then promisor's decision if held)
