  We are designing an activity to help students experience the intrinsic obligation of a promise, beyond external factors like reliance, reciprocity, or social consequences.

   The core idea: have students make and keep (or break) small promises in a controlled setting, and then systematically remove the external reasons for keeping the promise.

   Setup:
   - Class of 16 students.
   - 80 minutes total.
   - Movable chairs so we can arrange for private decision-making.

   Materials:
   - Index cards (or small pieces of paper) for writing promises and decisions.
   - Pens.
   - A set of tokens (or points) that can be traded for small privileges (e.g., extra credit points, candy, or just symbolic tokens that can be collected). We'll use tokens as the currency.

   Overview of the activity:
   We'll have several rounds. In each round, students will be paired and make a promise to each other. The promise will involve a small action that has a cost to the promisor and a benefit to the promisee, and the action will be verifiable in some rounds but not in others.

   The promise structure: 
     "I promise to give you [X] token(s) at the end of this activity."

   But note: we want to avoid the promise being about something that the promisee is relying on for their own plans. We are trying to isolate the obligation.

   Instead, we can have the promise be about a token transfer that only matters for the game. The benefit is purely symbolic.

   However, to create a small stake, we can have tokens convertible to a small privilege (like one token = one extra minute to present in a future class, or a candy). But we don't want the stakes so high that they dominate.

   Alternatively, we can use the tokens as currency that can be exchanged at the end for a small reward (like a piece of candy or a bonus point). Let's assume we have a bag of small candies (e.g., 16 candies, one per student) and each token is worth 1/10 of a candy? That might be too complicated.

   Instead, let's make it a game where the goal is to collect as many tokens as possible, and the top 3 token holders get a small prize (a candy, or a bonus point). This creates an incentive to break promises when there is no penalty, but also an incentive to keep them when there is social pressure.

   However, note: we want to separate the promise obligation from the incentive. We might have to downplay the competitive aspect.

   Compromise: 
     - Each student starts with 10 tokens.
     - In each round, when they make a promise, they are promising to give a token to their partner (so it costs them one token and benefits the partner one token).
     - But note: if they break the promise, they keep their token and the partner doesn't get one.

   But then, if they break the promise, they have 10 and the partner has 10 (or whatever). If they keep, they have 9 and the partner has 11.

   We can also have a baseline of tokens that everyone gets regardless, so that the promise transfers are the only variation.

   However, we want the benefit to the promisee to be real but small, and the cost to the promisor to be real but small.

   Steps:

   1. Introduction (5 minutes):
      - Explain the activity: We are going to do an exercise about promises. You will make promises to each other and then decide whether to keep them. There are tokens involved that can be exchanged for [a small prize at the end, e.g., the top 3 token holders get a candy]. But the main point is to think about why we keep promises.

   2. Round 1: Public Promise with Public Outcome (15 minutes)
      - Pair up students (8 pairs). 
      - Each pair is given two index cards. On one card, each student writes: "I, [Name], promise to give one token to [Partner's Name] at the end of the activity." They sign it and hand it to the partner. (This makes the promise public to the partner and the class? We can have them read it aloud to their partner? But to save time, maybe just write and hand.)
      - Then, they are told that at the end of the round, they will have the opportunity to give the token (or not) in a public way. 
      - After the promises are made, the teacher collects the tokens? Actually, we don't want to handle tokens until the end. Instead, we can have a record sheet.
      - Instead of physical tokens until the end, we can have a central record (on the board) of how many tokens each student has. Start with 10 each.
      - After the promise, the teacher asks: "Now, did you keep your promise?" But we don't want to do it immediately. We want to have the decision made at the end of the round, but we want it to be public.

      How about: 
          - After making the promise, the teacher says: "Now, we are at the end of the round. If you are going to keep your promise, come up to the board and deduct one token from your total and add one token to your partner's total."
          - They do this one by one, publicly. (This is round 1: public decision.)

      Expected: Everyone does it because they are being watched.

   3. Round 2: Private Decision (15 minutes)
      - Rearrange the chairs so that students can have privacy. They will not be making the decision in front of others.
      - New pairings (to avoid reciprocity from round 1). Re-pair randomly (8 new pairs).
      - Same promise: "I, [Name], promise to give one token to [Partner's Name] at the end of the activity." They write it on a card and hand it to the partner.
      - Then, they are given a decision card. On the card, they mark whether they kept the promise or broke it. They do this in private and drop it in a box at the front. They are told that the teacher will adjust the token counts later, and that their decision will be kept secret from everyone (including their partner) until the very end of the activity (if at all).
      - The teacher then adjusts the tokens based on the decision cards (without revealing who did what).

      Now, the decision is private. The partner doesn't know and the class doesn't know. We expect some breaking.

   4. Round 3: Promisee Releases the Promisor (15 minutes)
      - New pairings (again, 8 new pairs).
      - Make the same promise: write and exchange.
      - Then, the teacher says: "Now, we are going to have the promisee (the person who received the promise) decide whether to release the promisor from the promise. Without consulting the promisor, the promisee writes on a card: 'I release you' or 'I hold you to it'. They write this and hand it to the teacher. The teacher then informs the promisor of the decision. If the promisee releases, then the promisor does not have to give the token. If the promisee holds to it, then the promisor must decide whether to give the token or not (in a private decision, like round 2)."

      But note: we want the promisee to sometimes release and sometimes not. We can instruct half the promisees (randomly) to release and half to hold? But that might be too artificial.

      Alternatively, we can have the promisee choose based on their own will. We can say: "If you wish, you can release your promisor, or you can hold them to it. Choose freely."

      Then, for the promisors who are released, they don't have to do anything. For the ones held, they make a private decision (and report by card).

      This round tests: if the promisee no longer wants the promise, does the promisor still feel obligated?

   5. Round 4: The Promisee is Out of the Picture (15 minutes)
      - This round is tricky. We want the promisee to be absent or unable to be affected. How?
      - Idea: Pair students again. They make the promise. Then, we tell them that after the promise, the promisee has left the class (or the activity) and will not be returning until after the token distribution. So, they cannot receive the token in person, and they won't know whether you gave it or not. Moreover, we can say that the promisee has moved away and we have no way to contact them. But that might be too dramatic.

      Alternatively, we can say: the promisee is not participating in the token system anymore (they have been excused from the rest of the activity and their tokens don't count). So, if you give a token to them, it will be thrown away (or given to charity? or just not counted). The point is: the token transfer has no effect.

      How to set up:
          - New pairings (8 new pairs). Make the same promise: write and exchange.
          - Then, the teacher says: "Due to unforeseen circumstances, your partner (the promisee) has to leave the activity. They have taken their tokens with them and will not be returning. Therefore, if you give a token to them, it will not be delivered and will be lost. You must decide in private whether to give the token anyway (which will be thrown away) or keep it (and add it to your own total)."

      They make a private decision (by card) and drop it in the box.

   6. Debrief (15 minutes)
      - First, reveal the token counts? But note: we don't want to reveal individual decisions in rounds 2, 3, and 4 because of privacy. Instead, we can reveal aggregate statistics for each round (e.g., how many kept the promise in round 2, round 3, round 4). 
      - Then, discuss:
          - In which rounds did they feel the obligation most? Why?
          - In round 3, if the promisee released you, did you feel that you were off the hook? Why?
          - In round 4, when the token would be thrown away, why did you keep (or break) the promise?
          - What is the source of the obligation? Is it the expectations of others? The social practice? Or is it something about the act of promising itself?

      Map onto theories:
          - The social practice view (Hume, perhaps): the obligation comes from the usefulness of the practice and the expectations it creates. When no one is watching and the promisee doesn't care and the token doesn't matter, then there's no reason to keep the promise.
          - The authority transfer view (Owens, Shiffrin, etc.): by promising, you give the promisee authority to demand performance. Only the promisee can release you. In round 3, if the promisee releases you, you are released. But if they don't, you are still bound. In round 4, the promisee is gone and hasn't released you, so you are still bound? Or maybe the promisee's absence doesn't release you.

      Also, the trap: sometimes we keep a promise because we don't want to feel guilty. But is that the same as the promise binding? Or is it just a psychological effect?

      What the activity cannot reproduce:
          - Promises to the dead: because the promisee is not just absent but gone forever, and cannot release you. We can mention this in debrief.
          - Promises to oneself: because there's no other party to release you or to be affected. We can mention this too.

   7. Potential problems and how to handle:
      a. Students treating it as a game and breaking all promises when there's no penalty.
          - How to handle: Emphasize that the goal is not to win tokens but to explore the feeling of obligation. Also, in the debrief, we can discuss why they broke the promises and whether they felt any pull to keep them.

      b. In round 3, promisees might always release or never release, skewing the data.
          - We can try to guide: tell half the promisees (by a secret note) to release and half to hold. But that might be too controlling. Alternatively, we can let them choose and then note the variation.

      c. Students might not take the promises seriously because the stakes are low.
          - We can try to frame the promise as a real commitment, and remind them that in moral philosophy, we are considering the structure of obligation, not the size of the stake.

      d. Time: 80 minutes is tight. We might go over.
          - Plan to cut short some rounds if needed.

      e. In round 4, students might think: "Even if the token is thrown away, I might still feel better if I keep the promise." That's a valid point and can be discussed.

