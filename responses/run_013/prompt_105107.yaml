prompt: |-
  I sit on the board of a small housing co-op and i've started noticing a shape that keeps recurring, and I can't find a name for it. Our rule for who counts as a member is basically 'you live here and you pay the costs', and that's what makes it us deciding who moves in rather than some outside body. Then a member pointed out that if we honestly applied that same rule to ourselves, the two basement renters and the live-in carer would get votes, and two of our own people who've been abroad for three years and pay nothing would lose theirs. Nobody wanted either result, so we quietly settled on 'whoever was already in.' Then I watched my union local do the identical thing while voting on whether to fold in a non-union shop: same principled-sounding membership rule, same discovery that applying it straight either lets the newcomers swamp the vote or ejects some of our own, same retreat to 'whoever's already in.' What gets me is that it doesn't feel like ordinary hypocrisy or gerrymandering, since nobody's breaking a stated rule -- the rule just can't be turned on the group that's using it, and there's no body above us to say otherwise, because deciding who we are is the one thing only we get to decide. The closest thing I've found online is the general puzzle about who gets to decide who belongs in the first place, but that seems to be about starting from nothing; this is what happens to a group that's already been running a while and has to keep re-deciding. Is there a name for this, and if not, coin one and tell me where its edges are -- what separates it from plain self-dealing, and what stays the same and what changes when the group is a co-op, a union, or a country. A bare label won't help me, I want the distinction. Lead with your bottom line in the first sentence, then the reasoning -- no preamble and don't restate my question.
reasoning: |-
  Okay, the user is on the board of a small housing co-op and has observed a recurring pattern where a group's stated membership rule can't be impartially applied to itself without unwanted consequences, forcing a retreat to the de facto "whoever's already in" definition. They've seen this in both their co-op and their union local. They want to know if there's a name for this phenomenon, or to coin one, and crucially understand how it differs from simple self-dealing or hypocrisy. They also want to see how this applies across different group types (co-op, union, country).

  First, I need to recall if there's an existing term for this. The user mentions it's not about starting from nothing but an ongoing group re-deciding membership. The paradox here is that the group defining membership can't apply its own rule objectively to itself without undermining its current composition. This feels related to self-referential paradoxes or self-application problems. 

  I remember something about Russell's Paradox in set theory, where a set containing all sets not containing themselves leads to a contradiction. But that's more abstract. In social contexts, "boundary problem" in democratic theory refers to who decides the demos, but it's often about the initial formation. The user's case is about maintenance, not inception. 

  The term "constitutive dilemma" comes to mind. It's when a group's defining rules can't be applied without presupposing the group itself. Existing members become a prior condition for applying the rule. That might fit. Another angle is "bootstrapping problem," where the system relies on itself to define its parameters. 

  For coining a term, perhaps "Membership Paradox of Self-Application" or "Self-Referential Boundary Dilemma." But the user wants the distinction from self-dealing. Self-dealing is intentional manipulation for gain, whereas this is more of an unavoidable structural flaw. The group isn't malicious; they're stuck because the rule can't be self-applied consistently. 

  In the co-op example, applying the rule would include renters and exclude absent members, but both outcomes are undesirable to the current group. So they default to the status quo. It's not hypocrisy because the rule isn't being broken; it's inherently unworkable for self-definition. 

  For different groups: in a co-op, it's about residence and payment; in a union, about employment status; in a country, citizenship criteria. But the core issue remains: the rule's application changes the group's composition in ways that conflict with the existing members' identity. 

  The key is that the group is both the subject and object of the rule, creating a circularity. No higher authority exists because the group's autonomy includes defining itself. So the edges: unlike self-dealing, there's no deceit or rule-breaking; it's a logical necessity. The group must exist to apply the rule, but the rule defines the group. 

  I'll go with "Constitutive Boundary Dilemma" as the term. Emphasize that it's a structural paradox, not bad faith. Highlight how it differs from gerrymandering (which is intentional) and hypocrisy (which involves pretense). Then explain how it manifests in different group types, showing the common thread despite varying criteria.
answer: |-
  Your core phenomenon is the **Constitutive Boundary Dilemma**, a structural paradox where a group's self-defining membership rule cannot be impartially applied to its own existing members without destabilizing the group's identity or agency, forcing reliance on the de facto pre-existing membership ("whoever's already in") as the only workable boundary.

  **Reasoning & Distinctions:**

  1.  **The Paradox:** The rule (e.g., "live here + pay costs") is constitutive – it defines *who the group is*. Applying it rigorously *to the group using it* requires the group to exist *before* the rule is applied. This creates circularity. The group applying the rule is the product of its *past* application (or initial formation). Applying it neutrally *now* either:
      *   **Expands Membership Unacceptably:** Including entities (renters, non-union workers) perceived as "not *really* us" by the current core, threatening their control or shared identity.
      *   **Contracts Membership Unacceptably:** Excluding entities (long-absent members) perceived as still belonging to "us," violating solidarity or historical claims.
      Neutral application undermines the agency and identity of the *current* group applying the rule.

  2.  **Distinction from Self-Dealing/Gerrymandering/Hypocrisy:**
      *   **Self-Dealing/Gerrymandering:** Involves *intentionally manipulating* rules or boundaries *for specific advantage*. The dilemma arises from the *inherent structure* of self-application, not malicious intent. The outcome ("whoever's already in") is a *default fallback*, not a plotted outcome. Members aren't secretly bending rules for gain; they're confronting the rule's unworkability for self-definition.
      *   **Hypocrisy:** Involves *failing to practice* stated principles while *pretending* to uphold them. Here, the group *honestly confronts* that the principle (strict rule application) *cannot work* for this specific self-referential task, so they *abandon* its strict application in favor of pragmatic continuity. The stated rule isn't violated hypocritically; it's recognized as inadequate for the constitutive task.

  3.  **Distinction from the Foundational Boundary Problem:** The foundational problem asks "Who decides the first members?" from a state of non-existence. The Constitutive Boundary Dilemma occurs in an *ongoing, functioning group*. The group *has* agency and rules, but those rules *cannot* be used to *re-constitute* itself without presupposing the group they are meant to define. It's a problem of *maintenance* and *adaptation*, not creation.

  4.  **How Context Shapes the Dilemma (Same Core, Different Edges):**
      *   **Co-op (Small, Voluntary, Shared Resources):** Dilemma centers on shared living costs, residence, and direct participation. "Who is us?" is vital for daily operations and fairness. Fallback to "already in" is strong due to intimacy and direct impact. Edges: Ambiguity around temporary absences, partial residents (renters), service providers (carers).
      *   **Union (Workplace Solidarity, Collective Bargaining):** Dilemma centers on shared employer/industry, bargaining unit cohesion, and dues-paying solidarity. Inclusion risks diluting bargaining power or ideological unity; exclusion risks weakening solidarity or missing organizing opportunities. Fallback protects existing power structures and identity. Edges: Contract workers, new acquisitions, workers in transition, differing union philosophies (inclusionary vs. exclusionary).
      *   **Country (Sovereignty, Citizenship, Territory):** Dilemma is existential, involving birthright, naturalization, territory, and allegiance. Rigorous application could mean mass disenfranchisement or uncontrolled inclusion, threatening national identity and stability. Fallback to existing citizens/residents is deeply embedded in law and tradition ("jus sanguinis/soli" often codify "already in"). Edges: Are vastly sharper – statelessness, deportation, contested borders, colonialism's legacy. The stakes (sovereignty, rights, war) are highest, and the fallback position ("current citizenry") is most rigidly institutionalized. Neutral self-application is virtually impossible.

  **The Core Constant:** Regardless of context, the Constitutive Boundary Dilemma arises because **the group is both the subject defining the rule and the object being defined by it.** This self-referential loop makes truly impartial application of the constitutive rule to the group's *own* boundaries logically and practically impossible for the group itself to perform without destabilization. The de facto membership ("whoever's already in") becomes the necessary, albeit unprincipled, anchor point for continuity.
