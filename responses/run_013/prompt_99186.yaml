answer: |-
  Here’s a comprehensive exam question, model answer, and marking scheme designed to push students beyond superficial treatments of the units of selection debate.

  ---

  ### Exam Question: Units of Selection in Structured Populations (25 marks)

  Consider a diploid species subdivided into discrete demes. A gene *G* (with alleles *G* and *g*) codes for a behaviour where bearers of *G* help defend their deme against raiders from other demes. This behaviour:
  1.  Reduces the *individual* fitness of the bearer within its deme (costly defence).
  2.  Increases the *total productivity* (number of emigrants) of the deme in between-deme competition (group benefit).
  Migration between demes occurs at rate *m* (0 < *m* < 1), and demes vary in their genetic composition.

  **(a)** (8 marks)  
  Using the gene’s-eye view (Hamiltonian inclusive fitness approach), derive the condition under which *G* will spread in the population. Separately, using a multilevel selection framework (Price equation partitioning), derive the condition for *G* to spread. State precisely what is meant by the claim that "the gene’s-eye view and multilevel selection frameworks are mathematically equivalent" in this context.

  **(b)** (9 marks)  
  Is this equivalence a claim about the *causal processes* driving the spread of *G*, or is it solely a statement about *mathematical accounting*? Could any empirical observation (e.g., experimentally manipulating migration rate *m*, or altering the correlation between group membership and genetic relatedness) yield different predictions under the two frameworks? Justify your answer.

  **(c)** (8 marks)  
  The Price equation allows partitioning the total change in *G*’s frequency in multiple ways (e.g., regressing individual fitness on individual phenotype while controlling for group mean phenotype, vs. regressing on group mean phenotype). How might this choice affect whether a "group selection" term appears? Does this flexibility imply that group selection is merely a modelling choice rather than a "fact of nature"? Is this arbitrariness a fatal flaw for the concept of group selection, or simply a warning against sloppy application?

  ---

  ### Model Answer (Target: ~750 words)

  **(a) Conditions for Spread and Equivalence Claim**

  *   **Gene’s-eye / Hamiltonian View:** The spread of *G* depends on Hamilton’s rule: *rb - c > 0*. Here:
      *   *c* = direct fitness cost to the bearer (reduced within-deme reproductive success due to defence cost).
      *   *b* = benefit accrued to *other individuals within the same deme* due to the bearer's defence (increased survival/reproduction of deme mates).
      *   *r* = the average genetic relatedness of the bearer to those other individuals benefiting within the deme (specifically for the locus or trait in question, approximated by pedigree relatedness in many models).
      *   The benefit *b* is weighted by *r* because the gene *G* in the bearer has a probability *r* of being identical by descent in the beneficiaries. *G* spreads if the net inclusive fitness effect is positive.

  *   **Multilevel / Price Equation View:** The change in frequency of *G* (Δ*p*) can be partitioned into within-group and between-group components:
      *   Δ*p* = Cov(*wᵢ*, *pᵢ*) + E[Cov(*wⱼ*, *pⱼ*) | *i*] ≈ *β*_{W,G} Var(*pᵢ*) + *β*_{B,G} Var(*Pᵢ*)
          *   *wᵢ* = fitness of individual *i*.
          *   *pᵢ* = frequency of *G* in individual *i* (0, 0.5, or 1).
          *   *Pᵢ* = frequency of *G* in the deme of individual *i*.
          *   Cov(*wᵢ*, *pᵢ*) ≈ *β*_{W,G} Var(*pᵢ*) captures the *average within-deme selection*. This acts against *G* if *c > 0*, as *β*_{W,G} < 0.
          *   E[Cov(*wⱼ*, *pⱼ*) | *i*] ≈ *β*_{B,G} Var(*Pᵢ*) captures the *between-deme selection*. This favours *G* if groups with higher *Pᵢ* (more defenders) have higher *mean fitness* (*w̄ᵢ*), so *β*_{B,G} > 0.
      *   *G* spreads if the positive between-group component outweighs the negative within-group component: *β*_{B,G} Var(*Pᵢ*) > |*β*_{W,G}| Var(*pᵢ*).

  *   **Meaning of "Equivalence":** In this context, "mathematical equivalence" means that for any given population state and set of fitness effects (*c*, *b*), the condition derived from Hamilton’s rule (*rb - c > 0*) is *algebraically identical* to the condition derived from the Price equation partitioning (*β*_{B,G} Var(*Pᵢ*) > |*β*_{W,G}| Var(*pᵢ*)). Specifically:
      *   *r* is directly related to the ratio of genetic variances: *r* ≈ Var(*Pᵢ*) / [Var(*Pᵢ*) + Var(*pᵢ*)] under certain assumptions (like no dominance, additive effects, or using identity disequilibrium).
      *   *b* maps onto the between-group regression coefficient *β*_{B,G}.
      *   *c* maps onto the magnitude of the negative within-group regression coefficient |*β*_{W,G}|.
      *   Therefore, *rb > c* translates directly to the between-group component exceeding the within-group component. The frameworks calculate the *same net evolutionary outcome* using different statistical summaries of the same underlying fitness distribution.

  **(b) Causality, Mathematical Accounting, and Empirical Distinction**

  *   **Causal Claim vs. Mathematical Accounting:** The equivalence claim is fundamentally about *mathematical accounting*, *not* necessarily about identifying distinct causal processes. It demonstrates that the *net evolutionary change* can be calculated correctly using either method by appropriately summarizing the fitness distribution (individual fitnesses correlated with individual genotype and group genotype). It does **not** assert that the *causal mechanisms* described by the frameworks are identical. The gene’s-eye view emphasizes the *causal pathway* of an individual actor’s behaviour affecting the replication success of copies of *G* in relatives. The multilevel view emphasizes the *causal consequences* of differential group productivity (demes with more defenders produce more emigrants) and differential individual success within groups (defenders have lower success).

  *   **Can Empirics Distinguish?** Crucially, **no empirical manipulation can yield different *predictions about the net change in G frequency* under the two frameworks** for a given population state and fitness structure, precisely because they are mathematically equivalent accounting schemes. If you manipulate migration (*m*):
      *   *Both frameworks* predict the same effect: Changing *m* alters genetic structure (relatedness *r* within demes and the variances Var(*Pᵢ*) and Var(*pᵢ*)). This will change the *magnitude* of the *rb* term (Hamilton) and the relative sizes of the between-group and within-group components (Price), but identically. The *condition* for *G* to spread changes in the same way in both calculations.
      *   Similarly, manipulating the correlation between group membership and relatedness (e.g., by making group formation random vs. kin-based) changes the mapping between *r* and the variance components (*r* = Var(*Pᵢ*)/[Var(*Pᵢ*) + Var(*pᵢ*)] holds only under kin-structure), but again, both frameworks will incorporate this change correctly and identically into their conditions for spread.
      *   **The key point:** Both frameworks are tools for calculating the *consequence* of a defined set of fitness costs, benefits, and population structure. They are predictive bookkeeping methods. An observation like "G spreads when m is low" is predicted equally by both.

  *   **Contested Interpretation:** Where disagreement arises is in the *causal interpretation* of the *same predicted outcome*. Proponents of the gene’s-eye view (e.g., Dawkins, West, Gardner) argue that the Hamiltonian account provides a more fundamental causal explanation focused on the gene as the replicator and inclusive fitness as the driver. Proponents of multilevel selection (e.g., D.S. Wilson, Sober) argue that the Price partitioning highlights the distinct causal role of group-level properties (differential group survival/productivity) in driving evolution alongside individual selection within groups, even if the math is equivalent. This debate is about ontology and explanation, not the math itself.

  **(c) Partitioning Arbitrariness and the Status of Group Selection**

  *   **Partitioning Flexibility:** The Price equation decomposition is not unique. One common partition is:
      *   *Within-group component:* Cov(*wᵢ*, *pᵢ* | *Pᵢ*) = *β*_{W} Var(*pᵢ* | *Pᵢ*) – This is the selection *within* groups after controlling for group mean (*Pᵢ*). It isolates the cost *c*.
      *   *Between-group component:* Cov(*w̄ᵢ*, *Pᵢ*) = *β*_{B} Var(*Pᵢ*) – This is the covariance between group mean fitness (*w̄ᵢ*) and group allele frequency (*Pᵢ*). It isolates the group benefit.
      *   However, we could regress individual fitness *wᵢ* on *only* the individual genotype *pᵢ* (ignoring group): Cov(*wᵢ*, *pᵢ*) = *β*_{Total} Var(*pᵢ*). This *β*_{Total} would be a weighted average of *β*_{W} and *β*_{B}, and *no explicit group selection term appears*. The evolution is described purely as individual selection. Alternatively, one could include other contextual variables besides *Pᵢ*.

  *   **Modelling Choice vs. Fact of Nature?** This flexibility demonstrates that **"group selection" is not a directly observable phenomenon like gravity; it is an interpretive framework applied to fitness data.** Whether a "group selection" component appears *mathematically* depends on how we choose to partition the covariance terms – specifically, whether we condition on group properties when analysing individual fitness. The *group structure itself* (differential group fitness) is a fact of nature in this scenario. Whether we *attribute* some evolutionary change *causally* to "group selection" is a modelling and interpretive choice.

  *   **Problem for the Debate or Sloppy Bookkeeping?** This is **not** necessarily a fatal flaw for the concept of group selection, but it **is** a powerful warning against sloppy bookkeeping and reification. It shows that:
      1.  Finding a non-zero between-group component in *one specific partition* does not prove "group selection" is a unique causal force operating independently; it might be capturing the effects of kin selection.
      2.  Conversely, the *absence* of a group term in one partition doesn't mean group structure is irrelevant; its effects might be absorbed into the individual term in a different partition.
      3.  The *explanatory value* of invoking "group selection" depends on whether partitioning the change into within-group and between-group components provides genuine insight into the *causal structure* of the system (e.g., distinct group-level events like deme extinction or fission) that is obscured by the individual-level partition. The debate hinges on whether the multilevel partition offers a causally perspicuous explanation, not on the mathematical necessity of the term. Critics argue it often doesn't add insight beyond the gene’s-eye view; proponents argue it highlights important emergent levels of functionality.

  ---

  ### Marking Scheme (Total: 25 marks)

  **General:** Reward clarity, precision, understanding of core concepts (Hamilton's rule, Price partitioning, relatedness, variance components), and engagement with the nuance (equivalence ≠ causal identity, partitioning arbitrariness). Penalize rote repetition of kin/group equivalence or Dawkins/Gould without addressing the specific prompts. Top answers (21-25) will grapple effectively with the contested interpretations, especially in (b) and (c).

  **(a) Conditions and Meaning of Equivalence (8 marks)**
  *   **Hamiltonian (4 marks):** Correctly states *rb - c > 0* (1), defines *c* as individual cost (1), *b* as benefit to deme mates (1), *r* as relatedness within deme (1). *Common Mistake:* Defining *b* as total group benefit instead of benefit *per recipient*.
  *   **Price Equation (3 marks):** Correctly identifies the partition Δ*p* ≈ Within-Group Component (negative) + Between-Group Component (positive) (1). States *G* spreads if between-group component > |within-group component| (1). Mentions regression coefficients (*β*_{W,G}, *β*_{B,G}) and variances (Var(*pᵢ*), Var(*Pᵢ*)) appropriately (1). *Common Mistake:* Vague description like "group selection must be stronger than individual selection" without reference to variance partitioning.
  *   **Meaning of Equivalence (1 mark):** States it means the *algebraic conditions for spread are identical* (Hamilton's rule condition = Price equation condition) (1). *Common Mistake:* Saying "they are the same thing" without specifying it's the *predicted outcome/condition* that is identical.

  **(b) Causality vs Math & Empirical Distinction (9 marks)**
  *   **Causal Claim vs Math Accounting (3 marks):** Clearly states equivalence is about *mathematical accounting / predicting net outcome*, **not** about identical causal descriptions (2). Contrasts the causal emphases (gene replication via kin effects vs. group productivity & within-group selection) (1). *Common Mistake:* Conflating mathematical equivalence with causal equivalence.
  *   **Empirical Distinction - Prediction (5 marks):** **Core Insight:** Correctly states that **no empirical manipulation can yield different predictions about *Δp*** under the two frameworks because they are equivalent accounting schemes (3). Explains that manipulating *m* or relatedness-correlation changes parameters (*r*, variances) that are *inputs* to *both* models identically (1). States that both frameworks will predict the *same net change* for any given manipulation (1). *Common Mistake:* Suggesting that changing *m* makes one framework "more correct" or that the frameworks predict different outcomes. *Top Answer Requirement:* Explicitly links manipulation to changing parameters common to both models.
  *   **Contested Interpretation (1 mark):** Notes that the debate persists over *causal explanation/ontology* despite mathematical equivalence (1).

  **(c) Partitioning Arbitrariness & Status of Group Selection (8 marks)**
  *   **Partitioning Flexibility (3 marks):** Explains that different Price partitions are possible (1), e.g., conditioning on group mean vs. not conditioning (1). States that this choice determines whether a "group selection" term appears mathematically (1). *Common Mistake:* Implying the Price partition is fixed or unique.
  *   **Modelling Choice vs Fact? (2 marks):** Concludes that "group selection" as a *mathematical component* is a modelling choice (1), but the *differential group success* is a fact (1). *Common Mistake:* Claiming group selection is *entirely* an illusion or *entirely* independent of modelling choices.
  *   **Problem or Warning? (3 marks):** Argues it's **not** necessarily fatal but a **strong warning** (1). Explains *why* it's a warning: Finding/not finding a group term depends on partition; doesn't prove unique causality (1). Explains *why* not fatal: Value lies in explanatory insight if partition reflects distinct causal processes (e.g., group extinction) (1). *Top Answer Requirement:* Explicitly links the arbitrariness to the challenge of causally interpreting the "group selection" component and the debate over its explanatory value vs. the gene's-eye view. *Common Mistake:* Simply stating it's "just bookkeeping" without addressing the implications for the debate's substance.

  --- 

  This question and model answer force students to confront the core philosophical and methodological tensions underlying the units of selection debate, moving beyond facile claims of equivalence to examine its meaning, limitations, and the genuine points of contention among experts.
