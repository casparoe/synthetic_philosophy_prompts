prompt: |-
  I am a novelist, and the book I am writing is set in a society that left no writing of its own — no inscriptions, no archives, no voice — so everything about its beliefs and institutions has to be inferred from the things its people made and broke and buried. I have been working with a consulting archaeologist, and twice now she has closed down a question of mine with the same sentence: absence of evidence is not evidence of absence. The first time I had asked whether a burial rite I wanted to depict might have existed, and she had found no trace of it; the second, whether a form of public assembly could have stood in a settlement whose large buildings she reads as purely ceremonial. I cannot tell whether she is granting me permission to invent or merely observing that my inventions cannot be checked, and for a novelist those are opposite permissions: the first invites me to write, the second warns me that I am decorating a silence rather than reconstructing a past.

  What I would like from you is a menu rather than a ruling. Set out the distinct precise claims that sentence could be making about the relation between what a record contains and what a past contained — from the nearly tautological, through the substantive and defensible, to the outright false — and for each, say what it licenses me to write and what it forbids. I am especially unsure how the claims shift with the durability of the thing in question: the absence of a woven textile from an acid soil seems to me to say something quite different from the absence of a fired-clay figurine from the same layer, and I suspect the slogan is doing very different work in the two cases. Tell me, as well, which of the readings the sentence actually supports, which reading my archaeologist most plausibly meant when she used it on me, and which reading my draft needs — and where two of the readings come apart in a way that would change what I can honestly put on the page.
reasoning: |-
  Okay, the user is a novelist working on a book set in a society without any written records. They're collaborating with an archaeologist who keeps using the phrase "absence of evidence is not evidence of absence" to shut down their questions. The novelist is confused about what this really means—whether it's giving them permission to invent things or just pointing out that their inventions can't be verified. They need clarity on the different interpretations of this phrase and how each interpretation affects their creative choices.

  First, I need to unpack the phrase "absence of evidence is not evidence of absence." It's a common saying in archaeology, but it has layers of meaning. The novelist is particularly interested in how this applies to different types of artifacts—like perishable textiles versus durable clay figurines. They want a "menu" of interpretations, not a single ruling, so they can decide how to approach their writing.

  The user's deeper concern seems to be about authenticity and creative freedom. They don't want to just decorate silence; they want their inventions to feel plausible, grounded in what could have existed. The tension between invention and reconstruction is key here. Also, they might be worried about their professional integrity—getting it "right" in a way that respects archaeological methods, even when evidence is absent.

  Breaking down the possible interpretations: 
  Starting with the nearly tautological one: if there's no evidence, it doesn't prove something didn't exist. This is basic logic. For the novelist, this means they can invent but must acknowledge uncertainty. 

  Then, the archaeological truism version: incompleteness of the record. This is where preservation biases come in—textiles decay, but pottery lasts. Here, the novelist has more leeway for perishables but needs caution with durables. 

  The probabilistic claim: absence of evidence weakens but doesn't disprove existence. This involves likelihoods based on context. For example, missing burial rites in a well-excavated site might be less plausible than in a poorly preserved one. The novelist should adjust plausibility accordingly.

  The empirical caution: absence alone isn't proof, but combined with other factors, it might suggest absence. This is nuanced. If evidence should be there but isn't, it's more telling. The novelist needs to consider what's expected in the context.

  False interpretations: thinking absence of evidence means anything is possible. But that's not true—historical possibilities are constrained. The novelist must stay within the bounds of what's feasible for that society.

  The archaeologist likely meant the archaeological truism or probabilistic claim, especially given the examples. For burial rites (perishable elements), she's saying no evidence doesn't mean it didn't happen. For the public assembly in a ceremonial building, she's cautioning that while no evidence of assembly exists, it doesn't mean it didn't occur, but the evidence might not be there or could be misread.

  For the novelist's draft, the probabilistic claim is most useful. It allows invention but with a hierarchy of plausibility. Perishable items like textiles can be invented more freely, while durable items need more justification if absent. The key is to root inventions in the known material culture and context, making silent acknowledgments to archaeological gaps.

  Where interpretations diverge: tautological vs. probabilistic. The former gives blanket permission to invent, but the latter requires weighing evidence. For instance, inventing a textile design is fine, but placing a public assembly in a building that shows no signs of habitation might clash if not addressed. The novelist should note these distinctions to maintain honesty in their narrative.
answer: |-
  Your archaeologist's refrain – "absence of evidence is not evidence of absence" (AOEINEOA) – is a foundational principle, but its *meaning* and *implications* for your fiction shift dramatically with context, the nature of the evidence sought, and the completeness of the archaeological record. It's not a monolithic permission slip or a simple warning; it's a spectrum of epistemological stances. Here’s your menu, dissecting the claims and their creative licenses:

  1.  **The Tautological Core (Logical Necessity):**
      *   **Claim:** Logically, failing to find proof something existed does not *conclusively prove* it did not exist. It merely maintains the *possibility* of its existence.
      *   **Licenses:** You to depict *anything logically possible* within the known constraints of the society (e.g., they didn't have telephones). It forbids *nothing* based on absence alone.
      *   **Forbids:** Using absence as *definitive proof* of non-existence in your narrative logic ("*Since we found no toys, children clearly had no play*").
      *   **Durability Shift:** Applies equally to textiles and figurines. The logic is identical, regardless of preservation potential.
      *   **Strengths/Weaknesses:** Unassailable logic, but creatively almost uselessly broad. It allows dragons if somehow logically possible. Your archaeologist *isn't* granting this level of freedom.

  2.  **The Archaeological Truism (Record Incompleteness):**
      *   **Claim:** The archaeological record is inherently fragmentary and biased. Most things decay, most sites are destroyed or unexcavated, most activities leave no durable trace. Therefore, the *absence of a specific thing* in the *known record* is primarily evidence of the record's *incompleteness*, not the thing's *non-existence*.
      *   **Licenses:** You to depict **perishable, non-durable, or rarely deposited elements** (like specific burial textiles, wooden tools, certain foods, ephemeral rituals, spoken words, social gestures) *even if no direct evidence exists*, provided they are plausible within the *material culture that does survive*. (e.g., If loom weights exist, weaving existed; specific textile patterns are licensable invention).
      *   **Forbids:** Assuming the *absence* of durable, typically preservable, and frequently deposited items in a *well-understood context* is *meaningless*. (e.g., If you find abundant pottery but *no* figurines in domestic middens across multiple sites, claiming figurines were ubiquitous household items becomes problematic).
      *   **Durability Shift:** **Crucial Here.** This reading *strongly* licenses invention related to low-durability items (textiles, wood, basketry, organic paints, specific ritual chants) found in "acid soil" contexts. For high-durability, frequently deposited items (fired clay figurines, stone tools, certain metal objects) found in the *same* well-sampled layer, the absence *starts* to carry more weight against their presence *in that specific context*.
      *   **Strengths/Weaknesses:** The most common and defensible archaeological meaning. It explicitly acknowledges preservation bias. It strongly supports inventing the *ephemeral* aspects of life.

  3.  **The Probabilistic Claim (Evidence Weakens Possibility):**
      *   **Claim:** While absence doesn't *prove* non-existence, it *does* make existence *less probable*, especially if evidence *should* reasonably be expected based on the context, preservation, and intensity of research. The strength of the "absence" as *suggestive* of non-existence increases with the expected durability, depositional frequency, and research intensity.
      *   **Licenses:** You to depict things *despite* their absence, but requires you to **acknowledge (implicitly or explicitly) the lower plausibility** or provide a narratively coherent reason *why* evidence might be missing (e.g., a taboo against depositing certain items, extreme rarity, specific taphonomic factors). It favors invention for things with low expected preservation/deposition.
      *   **Forbids:** Depicting things with *high* expected preservation/deposition that are absent in well-researched contexts as if they were common or central, *without narrative justification*. It pushes invention towards the margins or the ephemeral.
      *   **Durability Shift:** **Fundamental.** Absence of textiles in acid soil? Very weak evidence against existence (high license). Absence of fired figurines in a ceremonial building layer with excellent preservation of other ceramics? Much stronger evidence against their presence *in that specific ritual context* (lower license, needs justification if included). Absence of *any* large public structures in a region extensively surveyed? Strong evidence against large, durable public assembly spaces existing *there*.
      *   **Strengths/Weaknesses:** Most nuanced and realistic. Reflects how archaeologists *actually* weigh evidence. Essential for credible world-building.

  4.  **The Empirical Caution (Absence Isn't Proof, But...)**
      *   **Claim:** AOEINEOA is a reminder *not to over-interpret absence as definitive proof*. However, absence *combined* with positive evidence about what *is* present, context, and expectations *can* become strong *circumstantial* evidence for absence, approaching practical certainty in specific cases. It guards against *solely* relying on absence.
      *   **Licenses:** Using absence *as part of a larger argument* within your fictional society's logic, but forbids using it as the *sole* argument.
      *   **Forbids:** The simplistic equation: "No Evidence = Didn't Happen." It *allows* the narrative inference: "We found abundant evidence of X, Y, and Z rituals, but *never* any trace of ritual W, despite looking in the right places for durable traces, suggesting W might not have been part of their practice."
      *   **Durability Shift:** Similar to Probabilistic Claim. Absence of durable evidence *where it should be* contributes significantly to a circumstantial case for absence.
      *   **Strengths/Weaknesses:** A necessary refinement. Absence rarely exists in a vacuum.

  5.  **The False Reading (Anything Goes / Ignoring Context):**
      *   **Claim:** Because evidence is absent, *anything is equally possible and plausible*. The past is a blank slate constrained only by imagination.
      *   **Licenses:** Pure, unconstrained invention with no regard for material constraints or context.
      *   **Forbids:** Nothing. Ignores the weight of *positive* evidence and contextual probability.
      *   **Durability Shift:** Irrelevant. Everything is equally possible.
      *   **Strengths/Weaknesses:** This is **not** supported by AOEINEOA and is bad history/archaeology. It leads to "decorating silence" without grounding. Your archaeologist is *not* saying this.

  **What the Sentence Actually Supports:** Primarily **#2 (Archaeological Truism)** and **#3 (Probabilistic Claim)**. The core intent is to combat the logical fallacy and highlight preservation bias (#1 & #2), but its responsible application inherently involves probability and context (#3, leaning into #4).

  **What Your Archaeologist Most Plausibly Meant:** Given the examples (burial rite - potentially ephemeral; assembly in ceremonial building - activity not necessarily leaving distinct durable trace vs. structure itself), she almost certainly meant **#2 (Archaeological Truism)** with strong implications of **#3 (Probabilistic Claim)**. She was saying:
  1.  *Burial Rite:* "Just because we haven't found physical evidence of *that specific rite* doesn't mean it *couldn't* have existed. Rites involving perishables leave little trace. You can invent it, but make it plausible within the burial practices we *do* see (e.g., grave goods, body position)."
  2.  *Assembly in Ceremonial Building:* "Just because I interpret these large buildings as primarily ceremonial based on their features and contents (e.g., no domestic debris, specific ritual objects) doesn't *prove* they were *never* used for large assemblies. Assemblies might not leave unique durable traces differentiating them from ceremonies. You *could* depict assemblies there, but my interpretation leans against it being a *primary* function based on the evidence we *have*."

  **What Your Draft Needs: The Probabilistic Claim (#3) with Durability Awareness.** This is the crucial synthesis for honest historical fiction in an unwritten society:

  *   **License:** You have significant freedom to invent **ephemeral practices, perishable objects, social nuances, verbal exchanges, and motivations** – the very stuff of novels! You can propose specific uses for spaces that might not leave distinct traces. You can invent variations on known themes (e.g., specific textile patterns, specific types of oaths sworn during a known ritual).
  *   **Constraint:** Your inventions must be **plausibly grounded in the durable material evidence** and its context. The absence of *durable* evidence for something that *should* leave it in a well-understood context *lowers its probability* and requires more narrative justification if included.
  *   **Durability is Key:**
      *   **High License (Low Durability/Ephemeral):** Textiles (in poor preservation), foodways (beyond basic staples), music, dance, specific prayers, social hierarchies (beyond burials), most daily speech, emotional responses, temporary structures. *Invent boldly here, extrapolating from durable clues.*
      *   **Medium License (Context-Dependent Durability):** Wooden structures/tools (in dry/wet sites), certain rituals (if they involve durable items deposited elsewhere), use of space (if activity leaves ambiguous traces). *Invent, but ensure consistency with site layout, artifacts found, and environmental constraints.*
      *   **Lower License/Requires Justification (High Durability/Frequent Deposition):** Ubiquitous ceramic types, common stone/metal tools, monumental construction techniques, burial *practices* involving durable goods. If absent where *expected* (e.g., no common pottery type in a village midden), inventing its *common presence* conflicts strongly with evidence. Absence *here* *is* suggestive evidence of absence. *Invent variations within types, or rare/elite versions, or provide a compelling narrative reason for the absence (taboo, trade disruption, local preference).*

  **Where Readings Diverge & Change Your Page: Tautology (#1) vs. Probability (#3) & Truism (#2) vs. Empirical Caution (#4)**

  1.  **The Burial Rite (Ephemeral):**
      *   **#1/ #2:** "No evidence? Fine, I'll invent an elaborate rite involving woven flower shrouds dissolved by the acid soil." (Highly permissible)
      *   **#3/ #4:** "No evidence of *any* burial variations beyond simple pits? While a specific perishable rite is *possible*, its absence combined with consistent simple practices makes inventing a *complex, widespread* perishable rite feel less plausible without narrative support (e.g., it was a rare, elite practice). Maybe focus on subtle variations within the known practice." (More constrained)
      *   **Change on Page:** The *scale, complexity, and commonality* of the invented rite. Probability (#3) asks you to temper the invention based on the *overall pattern* of evidence, not just the absence of that specific rite.

  2.  **The Public Assembly (Activity in a Durable Structure):**
      *   **#1/ #2:** "No direct evidence of assembly? But it *could* have happened! I'll depict raucous town meetings in the ceremonial building." (Permissible)
      *   **#3/ #4:** "The building shows *only* evidence of ritual deposits (altars, specific vessels, votives), no wear patterns suggestive of large crowds, no finds associated with secular assembly? While an assembly *could* have occurred occasionally, depicting it as a *primary, regular function* clashes with the positive evidence *for* ritual use and the absence of evidence *for* assembly. Inventing it as a major function requires ignoring the building's material signature." (Highly constrained, verging on forbidden without strong justification)
      *   **Change on Page:** Inventing *incidental, rare* use for assembly vs. depicting it as a core, frequent function. The archaeologist's interpretation (#4 leaning) based on *positive* evidence *and* the absence of assembly traces strongly argues against the latter. To do it honestly, you'd need to make it a narrative *surprise* or *violation* of normal use within your story's logic.

  **Conclusion:** Your archaeologist is offering a powerful license to invent the *unpreserved*, grounded in the principle of an incomplete record (#2). However, responsible invention requires embracing the **Probabilistic Claim (#3)**. Respect the weight of the *positive* durable evidence. Let the absence of perishable things liberate your imagination for textures of life. Let the absence of *durable* things, especially where expected, guide you towards invention that fits *within* the gaps defined by the existing evidence, or provide compelling narrative reasons why the gap exists. You are reconstructing *from* the fragments, not decorating a void; the fragments define the shape of the void you can plausibly fill. Use the durability lens rigorously – it's your key to knowing *which* absences are truly open doors and which are walls built by the evidence itself.
