  Okay, let me start by unpacking the user's query. They're a compiler engineer dealing with specs, optimizations, formal verification—so their mental framework is all about precise definitions, admissible implementations, refinement, soundness, and undefined behavior. The trigger was their sister's kid missing a school support cutoff by one point, leading them into the philosophy of vagueness. Now they're trying to map epistemicism and supervaluationism onto their technical vocabulary.

  First, I need to restate both philosophical positions using their terms. Epistemicism claims a sharp cutoff exists but is unknowable. In their world, that might be like a hidden configuration flag—present but undocumented and unobservable. But the key difference is unknowability in principle, not just in practice. Supervaluationism, on the other hand, avoids a single cutoff by using multiple admissible precisifications. That maps to underspecification in a language spec, where multiple implementations are valid as long as they meet the spec's constraints.

  Now, the residue report. For (a), the hidden flag analogy works but needs to address the "in principle" aspect. In formal verification, unobservability is practical, but epistemicism's unknowability is metaphysical. Their tools assume observability in the abstract, so this is a friction point.

  For (b), the refinement analogy for supervaluationism holds well, especially with admissible implementations. The problem is excluded middle: supervaluationism preserves it as supertrue, but SQL's three-valued logic doesn't. The load-bearing analogy here is specs and implementations, not three-valued logic. The truth values are defined over the set of refinements, not per-instance.

  Higher-order vagueness (c) is tricky. Their spec framework might handle it by nesting underspecifications, but each layer introduces a new crisp boundary. Philosophers see this as infinite regress, while their tools force discretization. That's a limitation in expressing true higher-order vagueness without collapsing into precision.

  The sorites paradox (d) doesn't bite in their world because everything is discrete by design. Tolerances aren't transitive in specs, so the paradox is avoided by construction. But that might beg the question—assuming sharp boundaries where philosophy questions their existence.

  Overall, the mapping works for first-order vagueness but breaks at higher orders and fundamental unknowability. The philosophical debate exposes where their vocabulary imposes discreteness, which might be a feature in engineering but a limitation in modeling vagueness. The residue shows that while specs handle flexibility, they can't capture the open-texture of natural language predicates without smuggling in precision.
answer: |-
  Here's the mapping to your vocabulary, followed by the residue report. We'll use precise compiler/formal methods terminology.

  ### Epistemicism (Restated)
  *   **Core Claim:** The vague predicate (e.g., "needs extra support") corresponds to a **sharply defined, deterministic predicate** `P(x)` in the actual specification of the world's state. The cutoff value `c` (e.g., the exact score threshold) exists as a **fixed, implementation-defined constant** within the system's configuration. However, this constant is **statically unobservable** and **dynamically unreadable** by any analysis pass (human or algorithmic) due to fundamental limitations in the specification of the observation interface. The system's semantics guarantee `P(x)` is total and binary (`true` or `false`), but the *location* of the discontinuity is opaque.
  *   **Analogy:** A programming language specification declares a specific behavior as **implementation-defined** (e.g., `sizeof(int)`). The actual value *is* fixed and determinate for any specific compiler/system (`sizeof(int) = 4`). However, a *portable* program or static analyzer **cannot determine this value** solely from the language spec; it can only observe it empirically on a specific target, and even then, only if the implementation provides the means to observe it (which it might not). The value exists deterministically, but is unknowable a priori and potentially unobservable even a posteriori.

  ### Supervaluationism (Restated)
  *   **Core Claim:** The vague predicate `P(x)` is **underspecified** in the core specification. Instead, the spec defines a set of **admissible refinements** (or **admissible models**). Each admissible refinement is a **complete, crisp implementation** of `P(x)` (a precise cutoff `c_i`). A statement `S` involving `P` is **supertrue** if `S` holds under **all** admissible refinements. `S` is **superfalse** if it is falsified under **all** admissible refinements. Otherwise, `S` is **indeterminate** (neither supertrue nor superfalse). The core spec **does not select** any single refinement as privileged; truth is defined via **universal quantification** over the admissible set.
  *   **Analogy:** A language specification **underspecifies** certain behaviors (e.g., evaluation order of function arguments). The spec defines the set of **admissible implementations** (e.g., left-to-right, right-to-left, any order as long as args are sequenced before the call). The property "Argument `a` is always evaluated before argument `b`" is **true** only if it holds for *all* admissible implementations (supertrue). The property "Argument `a` is always evaluated after `b`" is **false** only if it is false for *all* admissible implementations (superfalse). If some implementations evaluate `a` first and others `b` first, the property "`a` is evaluated before `b`" is **indeterminate** (neither supertrue nor superfalse). Crucially, the spec *itself* does not pick an order; correctness is defined relative to the set.

  ---

  ### Residue Report

  #### Epistemicism
  *   **Clean Mapping:**
      *   "Sharp cutoff exists" = **Implementation-defined constant**. Like `sizeof(int)` or the bit-representation of `NaN`, it's fixed but hidden.
      *   "Cannot know where" = **Statically unobservable / Dynamically unreadable**. The spec doesn't define how to read it, or the observation mechanism is undefined/unspecified.
      *   "Fact of the matter" = **Deterministic execution trace**. For a given input (kid's score, context), the system *will* output a definite `true`/`false`; it's not non-deterministic.
  *   **Fudges Required:**
      *   **(a) Unknowability vs. Unobservability:** Your "hidden config flag" is *very* close. The friction is in the *strength* of "unknowable *in principle*". In compilers:
          *   **Unobservable:** The value exists but the spec provides no `getFlag()` API (analogous to not documenting the cutoff formula).
          *   **Statically Unknowable:** Abstract interpretation/symbolic execution *cannot* infer the value from the spec alone (true for implementation-defined constants).
          *   **Unknowable in Principle?** This is the rub. Compiler specs *assume* the value *could* be known if you inspected the compiler binary/state, even if it's impractical. Epistemicism claims the cutoff is *metaphysically* unknowable, like a private field in a black-box module with no reflection API, *even if you had full access to the universe's state*. Your vocabulary *can* model this (`const int CUTOFF; // PRIVATE, NO ACCESSORS`), but it feels like an artificial restriction *within* the spec rather than a fundamental property *of* the spec. The "smuggled reader" is the implicit assumption that *if* the full system state were accessible, the value *would* be readable. Epistemicism denies this is even possible.
  *   **No Counterpart:**
      *   **Justification for Radical Unknowability:** Your framework easily models *that* something is hidden/implementation-defined. It doesn't provide a deep reason *why* a fundamental property *must* be hidden in this absolute way for vague predicates, beyond "the spec says so". Philosophers debate the justification (e.g., Williamson's margin for error principles) which lacks a direct analog.
      *   **The "Epistemic" State:** The *uncertainty* itself isn't modeled as a first-class entity in your specs; it's a consequence of missing information in the observer/model-checker.

  #### Supervaluationism
  *   **Clean Mapping:**
      *   "No single cutoff" = **Underspecification**. The core predicate isn't fully defined.
      *   "Admissible precisifications" = **Admissible implementations / models**. These are the complete refinements satisfying the spec's constraints.
      *   "Supertrue/Superfalse" = **Truth/Falsity under all admissible implementations**. This maps directly to properties verified by **static analysis sound wrt all admissible models** (e.g., proving a property holds no matter what order args are evaluated).
      *   "Indeterminate" = **Property depends on implementation choice**. Analogous to a static analyzer returning "MAYBE" or a verification condition that can't be proven for all models.
  *   **Fudges Required:**
      *   **(b) Refinement vs. Admissibility & Excluded Middle:**
          *   **Refinement/Admissibility:** The isomorphism is strong. "Admissible" carries the same weight: a permissible completion satisfying the constraints. Supervaluationism's "admissible precisification" *is* your "admissible implementation of the underspecified predicate".
          *   **Excluded Middle & NULL:** This is a key break. SQL `NULL` is **weak Kleene logic**: `NULL OR NOT NULL = NULL`. Supervaluationism uses **supervaluationist logic**: `P OR NOT P` is **supertrue** because *for each specific precisification `c_i`*, `x < c_i OR x >= c_i` is true, hence true on *all* precisifications. The **load-bearing analogy is Spec/Admissible-Implementations**, *not* three-valued logic with `NULL`. Supertruth is defined **quantificationally over completions**, not **per-instance with a third value**. Your counterpart is proving `∀ admissible_impl. (P(x) ∨ ¬P(x))` holds, which it always does because each impl is classical/total. The `NULL` analogy maps better to *partial functions* or *undefined behavior* where the expression itself lacks a defined truth value.
  *   **No Counterpart:**
      *   **Grounding the Admissible Set:** Your specs *define* the set of admissible implementations via explicit rules (e.g., "args must be sequenced before call"). Supervaluationism often relies on "penumbral connections" (e.g., if `x` is tall and `y` is shorter, `y` cannot be tall if `x` is borderline) to constrain admissibility. While you could encode these as constraints (`∀x, y: (P(x) ∧ y < x) → P(y)` might be part of the spec), the *source* and *justification* of these constraints in natural language lacks a direct analog to a formal spec.

  #### (c) Higher-Order Vagueness
  *   **Expressing It:** Your vocabulary *can* express it, but **only by introducing a new layer of underspecification**, collapsing the "definitely-in/borderline/definitely-out" trichotomy into another **crisp boundary**. For example:
      1.  Define the core predicate `P(x)` as underspecified (1st order vagueness).
      2.  Define the predicate `DefinitelyP(x)` as **supertruth of `P(x)`**. This is sharp! (`true` if `P(x)` holds in *all* precisifications).
      3.  Define `BorderlineP(x)` as **neither supertrue nor superfalse for `P(x)`** (also sharp!).
      4.  Now, to model vagueness *in the borderline*, you'd need to **underspecify the set of admissible precisifications themselves**. What counts as an "admissible" precisification for `P` becomes vague. So you define a set `A` of sets of precisifications (meta-admissible sets?), and define higher-order supertruth over *that*.
  *   **Collapse & Coherence:** This *does* collapse it into sharper boundaries at the next level. The framework inherently pushes towards discreteness. You can nest this (`n`-th order vagueness requires `n` levels of underspecification), but **true higher-order vagueness (without a sharp meta-boundary) cannot be fully captured**. This isn't necessarily a "bug" in *your* framework; it's a fundamental feature of formal specification. It *is* precisely why philosophers care: natural language predicates seem to resist this final sharpening. Your framework can *model* the *appearance* of infinite regress but not its *resolution* within the model; it forces discretization at some (perhaps high) level.

  #### (d) The Sorites Paradox
  *   **Getting Off the Ground?** The paradox **does not get off the ground** in your core framework, for two intertwined reasons:
      1.  **Discrete Thresholds:** Your world is built on discrete math (bits, states, predicates). Tolerance (`∀x, P(x) → P(x+ε)`) is **explicitly falsified** by the existence of any sharp cutoff (`∃x, P(x) ∧ ¬P(x+1)`). Induction fails at the discontinuity.
      2.  **Assuming the Conclusion:** More crucially, **your framework *assumes* there is a fact of the matter** (either a single hidden constant or a set of possible constants). The Sorites challenges the *existence* of such a fact *at all*. Your tools are designed to work *only if* there is a determinate specification (even if underspecified). The paradox highlights a perceived inconsistency in applying classical logic/definite cutoffs to predicates that seem inherently gradual. Your framework resolves the inconsistency by *fiat*: the spec (or its admissible completions) *defines* the cutoff(s), making the paradox irrelevant within the formal system. It *is* sharper than natural language, precisely because it *requires* this discreteness or its possibility via underspecification to function.

  ### Verdict: Where the Residue Lies

  The core machinery of **underspecification** and **admissible implementations/models** provides a **robust and surprisingly isomorphic framework** for modeling the *structure* of both epistemicism and supervaluationism, especially concerning first-order vagueness and truth-value assignments. The mappings for "sharp hidden constant" and "quantification over admissible completions" are compelling.

  **The significant residue stems from three sources:**

  1.  **The Nature of Unknowability (Epistemicism):** Your vocabulary models *unobservability* and *static unknowability* perfectly within a system. Epistemicism's claim of *metaphysical unknowability* ("the value exists but *nothing*, even in principle, could reveal it") is coherent *syntactically* within your framework (a private, no-accessor field) but feels alien. It pushes against the implicit assumption that the *full system state* is, in principle, inspectable. This is less about coarseness and more about a fundamental difference in perspective: compilers deal with artifacts where inspection is *possible* (even if hard), philosophy grapples with reality where it might not be.
  2.  **The Source of Constraints (Supervaluationism):** Defining *which* precisifications are "admissible" in your framework comes from explicit rules in the spec. For natural language vagueness, the constraints (penumbral connections) seem derived from meaning and use, not a formal document. Your vocabulary *can* incorporate these constraints, but it doesn't model their *origin* or potential vagueness itself (leading to higher-order issues). This *is* coarseness: your framework models *what is allowed*, not *why* it's allowed or how the constraints themselves might be vague.
  3.  **Forced Discretization & Higher-Order Vagueness:** This is the most profound residue. Your framework is **inherently discretizing**. It can *simulate* vagueness through layers of underspecification, but each layer introduces sharp boundaries (e.g., the set of admissible precisifications). True higher-order vagueness, where *no* level achieves sharpness, **cannot be fully captured without violating the framework's foundational reliance on definite sets and quantifiable alternatives**. This isn't a bug in your tools; it's their strength for engineering. But it *is* the core reason philosophers find the phenomenon significant and resistant to classical modeling. **The debate is *not* thinner once stripped; it highlights a fundamental limitation (or feature) of formal, set-based reasoning when applied to certain natural language phenomena.** The disagreement between epistemicism and supervaluationism persists precisely *because* neither fully resolves this tension within the intuitive concept of vagueness, while your framework resolves it by construction via discretization (hidden or quantified-over).

  **In short:** Your machinery maps the *syntax* and *logical structure* of the philosophical positions concerning truth conditions remarkably well. The residue lies in the *semantic grounding* (source of unknowability, source of admissibility constraints) and the framework's *inherent inability* to model truly open-ended, non-discretizable boundaries without introducing new, sharper boundaries at a meta-level. The debate isn't thinner; it exposes where formal specification, by its nature, imposes structure that natural language predicates seem to resist.
