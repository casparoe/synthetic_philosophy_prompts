prompt: |-
  I'm a compiler engineer — optimisation passes, a bit of formal verification on the side — so my whole mental furniture is specs, admissible implementations, refinement, soundness, UB, that sort of thing. And about six weeks ago my sister got told her kid missed the cutoff for extra support at school by one point on some assessment checklist. Which sounds like nothing, but it's been rattling around in my head, because nobody in the room actually disagreed that the kid needs help. The whole fight was about where the line is. So I went and read up on the philosophy of vagueness, and now I can't stop noticing that I seem to already own machinery for this, and I have no idea if it's the same machinery or just looks like it.

  So here's the ask. Take the two main camps about vague predicates and restate each one, as faithfully as you can, in my vocabulary:

  - epistemicism: there really is a sharp cutoff, it's just that we can never know where it falls;
  - supervaluationism: there is no cutoff, but a claim counts as true if it comes out true on every admissible way of drawing the line, false if it comes out false on all of them, and neither otherwise (supertruth, and all that).

  My vocabulary being: underspecification and refinement in specs, admissible implementations and models, partial correctness, static analysis and what it's sound with respect to, the C trifecta of undefined vs unspecified vs implementation-defined behaviour, three-valued logic and NULL propagation, maybe type systems and gradual typing if it helps. Use the real terms, don't dumb it down.

  Then the residue report — which is honestly the part I care about. For each camp: what maps cleanly, what I'd have to fudge to make it fit, and what has no counterpart in my world at all. A few specific things I'd like you to actually have a go at:

  (a) My instinct is that epistemicism is just 'there's a hidden flag in the config that nobody documented'. Does that hold up, or is the unknowability doing different work than mere unobservability? If the fact is there but unreadable even in principle, is that a coherent thing in my vocabulary or am I covertly smuggling in a reader?

  (b) Is the refinement/underspecification analogy for supervaluationism a real isomorphism, or am I pattern-matching on the word 'admissible'? Also: on supervaluationism excluded middle comes out supertrue, which seems to break the SQL/NULL analogy hard, since NULL OR NOT NULL is just NULL. Which of my two analogies is the one that's actually load-bearing?

  (c) Higher-order vagueness — the boundary between the definitely-in and the borderline is itself vague — can anything in my vocabulary even express that, or is that precisely the kind of thing a crisp spec / admissible-set framework can't say without collapsing it into a second, sharper line? If it can't, is that a bug in my framework or the whole reason philosophers care?

  (d) The sorites: my world is wall-to-wall discrete thresholds and tolerance is never transitive by accident, so does the paradox even get off the ground for me? And if not — is that because my framework is sharper than natural language, or because it's quietly assuming the conclusion that there is a fact of the matter?

  Then the honest verdict, and I'd rather you tell me I'm missing something than that it's all just line-drawing: where a chunk of the philosophical disagreement has no counterpart in spec/admissible-implementation talk, is that because my vocabulary is too coarse (it models which values are allowed, not what any of it means), or because the debate is thinner than it looks once the presentation is stripped off?

  No citations or reading list, please — I'll chase those myself, and I can't get to them right now anyway.
