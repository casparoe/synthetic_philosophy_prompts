prompt: |-
  For the past several months I've been reporting on the effort to get machines to learn what people want by watching what people do — recovering an agent's preferences from its choices, then optimizing on the agent's behalf. Over dinner, a researcher who has worked on these methods laid out an argument that the whole enterprise rests on a mistake, and I have not been able to find the error. I want to put it to you exactly as he gave it to me.

  (1) To prefer one option to another just is to be disposed to choose it over the other when both are available; preferences are attributed in order to explain and predict choices, and have no content apart from that.

  (2) What we actually observe is a single history: the choices an agent made in the situations it faced. What it would have chosen in situations it never encountered is, by definition, never observed.

  (3) For any such history there are infinitely many preference rankings that would have produced it. Whatever the agent did, there is a ranking that puts precisely those actions on top; another that puts them on top by a different margin; another that agrees with the first about everything observed and disagrees about everything else. Two agents who differ only about situations they never met will generate identical evidence. And even among the rankings that fit the data, several are behaviorally equivalent — the same choices come out optimal under objectives that differ by a constant factor or a constant offset, and under some that differ by more than that.

  (4) Evidence that fits infinitely many incompatible hypotheses, and that comes out exactly the same whichever of them is true, discriminates among none of them and gives no reason to believe any one over the others.

  (5) Therefore watching what someone does can never tell us anything about what they prefer.

  (6) But (5) proves far too much. We say, and are entitled to say, that a colleague prefers tea to coffee, that a toddler prefers the swings to the sandbox, that the dog wants to go out. Economics, ordinary mind-reading, and any moral assessment of someone's motives all presuppose that behavior is evidence about preferences. Nor is the form of the argument special to preference: any finite body of data can be fit by infinitely many curves, so (4) would equally show that no empirical hypothesis is ever supported by evidence.

  (7) So at least one of (1) through (4) must be false.

  Which one? I would like to keep (1) — I don't understand what a preference would be with no connection to choosing — but I am open to being told that this is the expensive one. What I need for the piece is not only which step fails but what it costs to drop it: if I concede the point, do I have to give up on there being facts about what people want, or only on a particular picture of how we get at them? And is there a version of the researcher's worry that survives, so that I don't overcorrect and tell my readers that these systems simply read preferences off behavior?
reasoning: |-
  Okay, the user presents a philosophical argument about inferring preferences from behavior. The researcher claims that observing choices can't reveal true preferences because many preference rankings could explain the same behavior. The user wants to know where the argument fails and what the implications are.

  First, I need to parse the argument step by step. Premise (1) defines preferences as dispositions to choose. That seems solid—preferences are tied to choices. (2) states we only observe one history of choices, not counterfactuals. That's true; we can't see what someone would choose in unobserved scenarios. (3) points out that infinitely many preference rankings fit the same data. That makes sense; unobserved choices aren't constrained. (4) concludes that such evidence can't discriminate between hypotheses. Then (5) says behavior can't tell us about preferences. But (6) argues this proves too much because we do infer preferences in daily life. So (7) says one premise must be false.

  The user wants to keep (1), the definitional link between preference and choice. So the flaw must be elsewhere. Premise (4) seems like the weak point. It assumes that because multiple hypotheses fit the data, no evidence supports any one. But that's not how empirical reasoning works. We use simplicity, parsimony, and counterfactual robustness to choose between hypotheses. For example, if an employee always chooses tea over coffee when both are available, we infer they prefer tea. We don't consider complex preferences that only differ in unobserved scenarios unless forced to.

  The cost of rejecting (4) is accepting that preference attribution involves inductive risk and assumptions about stability. We can't be certain, but we can have reasonable beliefs. This doesn't undermine the existence of preferences; it just makes inference fallible. The researcher's worry highlights that AI systems can't naively read preferences; they need structured assumptions. The user should convey that these systems use models to infer preferences, not just mirror behavior.
answer: |-
  The flaw lies in step (4), and rejecting it comes with important (but manageable) costs. Here's the breakdown:

  ### Why (4) Fails
  The claim that evidence "fitting infinitely many incompatible hypotheses... gives no reason to believe any one over the others" ignores how empirical inference *actually works*. While infinitely many preference rankings *mathematically fit* the observed data, we routinely:
  1. **Prioritize simplicity**: We favor the *simplest* preference ranking consistent with the data (e.g., assuming stable, transitive preferences unless forced to complicate them).
  2. **Assume regularity**: We posit that preferences generalize to unobserved scenarios based on patterns in observed choices (e.g., if you *always* choose tea over coffee when both are available, we infer you prefer tea—even if a contrived ranking could make coffee "preferred" in untested scenarios).
  3. **Leverage auxiliary assumptions**: We use background knowledge (e.g., humans have consistent tastes, rewards correlate with revealed preference) to constrain possible hypotheses.

  This isn't special to preferences: all scientific inference (e.g., fitting a curve to data points) uses these principles to overcome underdetermination. **Evidence *can* support hypotheses** even when alternatives exist, if those alternatives are less parsimonious, less coherent, or fail to generalize plausibly.

  ### The Cost of Rejecting (4)
  Conceding this doesn't destroy "facts about what people want," but it demands humility:
  - **Inductive Risk**: Preference attribution becomes *fallible* and *probabilistic*. We can be wrong about unobserved scenarios.
  - **Dependence on Assumptions**: Inferences rely on assumptions (e.g., preference stability, rationality). If these fail (e.g., context-dependent preferences), inferences break.
  - **No "Reading Off"**: AI systems **cannot naively "read preferences off behavior."** They must:
    - Incorporate inductive biases (e.g., smoothness, sparsity in preference models).
    - Use counterfactual reasoning (e.g., "Would they still choose this if options changed?").
    - Continuously test generalizations against new data.

  ### What Survives of the Researcher's Worry
  A refined version of the worry remains potent:
  > **"Unconstrained extrapolation is unjustified."** While we *can* infer preferences from behavior, we cannot confidently predict choices in *radically novel* scenarios without additional constraints (e.g., preference structure, causal models). AI systems that ignore this will produce brittle or arbitrary extrapolations.

  ### Implications for Your Piece
  - **Keep (1)**: Preferences *are* tied to dispositions to choose—this is defensible.
  - **Emphasize (4)'s flaw**: We *can* infer preferences, but it's an *inference problem* requiring models/assumptions, not direct "reading."
  - **Key takeaway for readers**:  
    > *"AI preference-learning systems don't 'discover' pre-existing preferences etched in behavior. They **construct models** of preferences—models that are useful only if they generalize correctly under well-justified assumptions. Ignore these assumptions, and you risk optimizing for a phantom."*

  ### Philosophical Anchor
  This aligns with **functionalist theories of mind** (preferences are defined by their role in choice-behavior) while rejecting **radical behaviorism** (which might deny unobservable mental states). Preferences exist, but their attribution is inherently model-based and fallible—much like inferring laws of physics from finite data.

  Would you like to discuss how specific AI approaches (e.g., inverse reinforcement learning) navigate this, or refine how to frame this for a non-technical audience?
