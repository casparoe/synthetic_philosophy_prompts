answer: |-
  Here's a concise, dry joke hitting those precise mechanics:

  > **The Fundamental Theorem of Ulysses Pacts:**  
  > Any binding agreement with your future self requires an external enforcer... whose interests *must* oppose yours at the critical moment.  
  > That's why spouses, banks, and constitutional amendment clauses work so well.  
  > *(Sadly, my future self just amended the clause about sending you this.)*

  **Why it works:**

  1.  **Mechanics Focused:** Directly addresses the core paradox: the necessity of an external enforcer ("spouses, banks, constitutional amendment clauses") and the *required divergence* of interests ("whose interests must oppose yours at the critical moment").
  2.  **Constitutional Nod:** Explicitly names the "constitutional amendment clause" as an example, highlighting the self-referential problem (it can be amended).
  3.  **Dry & Short:** The academic framing ("Fundamental Theorem") and concise delivery match the requested tone.
  4.  **Punchline Logic:** The final line demonstrates the core problem: even the "agreement" to send the joke relies on a self-binding mechanism (the joke itself) that the future self can "amend" (i.e., choose not to send). It reinforces the need for an *external* enforcer.
  5.  **Accessible & Insightful:** Anyone can grasp the punchline ("he didn't send the joke"). Someone who understands self-binding laughs at the perfect illustration: the *text of the joke itself* becomes the revisable commitment mechanism, proving why an external party (like the friend receiving it) is actually needed to enforce the "pact" to send it in the first place. The underlying humor for the informed comes from the joke enacting the very futility it describes.
  6.  **The Core Point:** It encapsulates your argument – the enforcer (like a friend expecting the joke) *only* enforces it because *they* want it sent (divergent interest at the moment of laziness/apathy), whereas an enforcer who shared your exact fleeting desire *not* to send it... wouldn't enforce it. Hence, "why would they?" is the unspoken, funny, bleak truth.

  It's bleakly logical humor for philosophers of self-binding.
