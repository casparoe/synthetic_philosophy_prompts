prompt: |-
  Ok so heres a thing that bugs me about how courts actually behave, and I want you to tell me what theory of law it assumes.

  Take a legal system that's pretty clear about one thing: judges apply the law, they dont get to refuse just because they think a statute is stupid or cruel. The legislature passed it, it's on the books, you enforce it. A judge who says "I won't apply this because it's unjust" is, on that view, just breaking the rules -- substituting their own morality for the law.

  But then the same systems do stuff that looks like the exact opposite. Courts refuse to enforce a contract because its terms are unconscionable, or because enforcing it would offend public policy. Courts won't send someone back to a country where they'd be tortured. Courts have refused to give effect to amnesty laws shielding people who committed mass atrocities, or to let a limitations period run on crimes against humanity. And after some regimes collapse, courts have basically said: yeah, that statute was passed properly and everyone followed it, but it was so monstrous that it never counted as law, so the person who informed on their neighbor under it can still be punished. That last move is the spicy one, since it says a formally valid law can fail to be law at all.

  So: what does that whole package presuppose about the nature of law? Does the practice commit you to thinking there's a moral test for legal validity -- that unjust-enough rules just aren't law? Or can you explain everything that happens with a view where law's validity is one thing (source, pedigree, whatever the system's own criteria say) and the moral limits live entirely in what judges are permitted to do -- in adjudication, interpretation, discretion -- rather than in validity itself? I want you to actually distinguish what the practice strictly requires from what it merely happens to fit well with. Maybe the practice is compatible with several theories and doesn't settle the question at all; say so if that's where you land, and show why.

  Some things I'd like you to sort out:

  - The apparent inconsistancy between "we don't judge the justice of statutes" and "this contract/statute/amnesty is too unjust to enforce." Is it a real inconsistency, or do the two halves operate on different objects (legislation vs. private agreements vs. foreign acts) in a principled way?
  - What work does the word "law" do in the sentence "that was so unjust it wasn't law"? Is it a claim about validity, about what courts should do, or just rhetoric?
  - If you think the practice presupposes something like a moral criterion of validity, tell me what would have to change if we dropped it -- e.g., what a court would have to do differently in the informer cases, in the amnesty cases, in the torture-extradition cases.
  - If you think the practice is compatible with a purely source-based view of validity, explain how, and be honest about which cases strain it.
  - Is there anything the practice quietly rules out? For instance, does it rule out the idea that legal validity is just whatever the officials happen to treat as valid?

  Don't give me a history of the debate or cite anybody -- I don't need a reading list, I want the reconstruction. Assume I know roughly that there's a long-running argument about this and that I don't care who said what.

  Also one more wrinkle: in some systems courts will void a law for a procedural defect -- passed by the wrong body, wrong majority, whatever -- and nobody blinks. But they get very nervous about voiding one for being morally awful. Is that asymmetry itself doing philosophical work, or is it just institutional caution?

  And keep the answer honest about underdetermination -- if two very different theories both predict this pattern of behavior, say which observations would actually separate them, if any.
reasoning: |-
  Okay, the user presents a complex legal theory puzzle about the apparent inconsistency in judicial behavior: courts sometimes enforce laws rigidly but other times invoke morality to invalidate contracts, statutes, or foreign acts. They want a reconstruction of what this practice presupposes about the nature of law, specifically whether it requires a moral test for legal validity or can be explained by a source-based view.

  The user is clearly well-versed in legal philosophy, referencing concepts like Radbruch's formula and the informer cases without needing citations. They're frustrated by surface-level contradictions and seek a rigorous analysis that distinguishes what judicial practice necessarily commits to from what it merely accommodates. Key pain points include: reconciling "don't judge statutes" with "too unjust to enforce," interpreting the word "law" in nullification contexts, and explaining the asymmetry between procedural vs moral invalidation.

  Hmm, the challenge is to avoid getting bogged down in historical debates while honoring the nuance. The user wants the philosophical engine stripped down - no namedropping, just pure conceptual mapping. They're also explicitly requesting honesty about underdetermination: if multiple theories fit, say so and specify what would falsify each.

  Breaking this down: First, the apparent inconsistency might not be real if we distinguish between different judicial roles. When courts reject private contracts as unconscionable, they're exercising inherent equitable powers - not challenging legislative validity. Similarly, refusing extradition to torture states involves interpreting existing human rights commitments, not voiding foreign laws. But the informer cases are tougher; declaring formally valid statutes "not law" seems like direct validity negation.

  For the "that wasn't law" claim: It could be three things. Validity denial (Radbruch), a remedial doctrine (we know it was law but won't enforce it), or constitutional avoidance (finding a procedural hook). The practice doesn't force one interpretation - a positivist could argue courts are exercising their system's ultimate rule-given discretion when they nullify extreme injustices.

  Notably, the procedural/moral invalidation asymmetry suggests institutional caution, not philosophy. Courts fear being seen as super-legislatures. But this caution itself implies that moral invalidation feels like a different, more dangerous move - which slightly favors non-positivist views, though doesn't prove them.

  Crucially, the practice rules out two extremes: 1) crude legal realism (law is whatever officials do) because courts treat even monstrous regimes' laws as valid until threshold injustice, and 2) hard natural law where every unjust law is void automatically. Instead we see context-specific judicial intervention.

  The clincher is that no single theory is strictly required. A soft positivist can explain everything by saying legal systems contain open-textured standards (like "public policy") that authorize moral reasoning in application. But the Radbruch-type moves in informer cases strain this view by targeting validity itself. If we saw courts consistently treating morally void laws as nonexistent for all purposes (not just refusing enforcement), that would favor natural law. But we don't - usually it's retrospective nullification in transitional justice contexts.

  Ultimately the practice fits both: 1) Inclusive positivism where validity criteria include moral thresholds, or 2) Exclusive positivism where moral factors are strong application norms. What's ruled out is the idea that morality never enters adjudication. The user's frustration stems from courts not advertising which model they're using - but the ambiguity might be necessary for legitimacy.
answer: |-
  Here's a reconstruction of the philosophical commitments implied by the judicial practices you describe, focusing on what the practice strictly requires versus what it accommodates, and addressing your specific points:

  **Core Tension & How Practice Resolves It (Without Strict Inconsistency):**

  The apparent contradiction dissolves when recognizing **distinct judicial roles and legal objects**:
  1.  **Statutes (Domestic, Procedurally Valid):** Courts generally *presume* validity based on source/pedigree (enacted by legislature per correct procedure). They don't refuse application *merely* because the judge finds it "stupid" or even mildly "cruel." This reflects **deference to legislative supremacy** and the **"rule of recognition"** (the system's own criteria for what counts as law).
  2.  **Private Contracts:** Refusing enforcement for unconscionability/public policy invokes **inherent judicial powers in equity and contract law**. Courts act as guardians of fairness *within* the framework of private ordering. The law *itself* (common law or statute) often *authorizes* courts to consider substantive fairness in this specific context. This isn't primarily about the *validity of legislation*, but about the *enforceability of private agreements* under existing legal doctrines.
  3.  **Foreign Acts & Extradition:** Refusing extradition to face torture typically relies on **domestic constitutional provisions, statutes (like CAT implementation), or binding international obligations** incorporated into domestic law. It's rarely a *free-floating moral judgment* but an application of *higher domestic legal sources* constraining executive/legislative action in foreign affairs.
  4.  **Amnesty Laws / Crimes Against Humanity / Informer Cases (The "Spicy" Bits):** This is the crux. Here, courts *do* sometimes seem to deny the *legal character* of formally valid enactments or actions taken under them. Practice suggests:
      *   **A Threshold of Injustice:** There is a point where extreme moral deficiency is seen as *depriving* a formally valid rule or act of its *legal* quality.
      *   **Context Matters:** This is overwhelmingly applied *retrospectively*, often after regime change (*transitional justice*), or concerning acts universally condemned (*jus cogens* norms like torture, genocide).
      *   **"Law" in "Not Law":** In this context, "law" refers to **validity/legality itself**. The claim is that such an enactment, despite meeting formal criteria, is so contrary to the fundamental conditions for *any* legal order (e.g., basic justice, human dignity) that it **fails as law**. It's not *just* bad law; it's *not law at all*. This is a claim about **legal validity being contingent on meeting minimal moral requirements**.

  **What the Practice Presupposes/Accommodates:**

  1.  **Strictly Required:**
      *   **Source-Based Validity as Default:** The system *must* have a primary, source-based rule of recognition (e.g., "enacted by Parliament following procedure X"). Courts *must* generally defer to rules meeting this test.
      *   **Judicial Authority to Apply Moral Standards *in Specific Contexts*:** The system *must* authorize courts to use moral reasoning when applying certain legal concepts like "unconscionability," "public policy," or "cruel and unusual punishment," or when interpreting constitutional/human rights norms.
      *   **A Concept of Legal System Legitimacy:** The practice implies that a legal system requires *some* minimal moral foundation to be *a legal system* rather than merely a system of terror or naked power. Extreme injustice destroys that legitimacy.

  2.  **Accommodates (Underdetermined Between Major Theories):** Does this *require* morality as a *condition of validity* (Natural Law/Radbruch) or can it be explained within **Sophisticated Legal Positivism**?
      *   **Compatible with Inclusive Positivism:** The rule of recognition *itself* might incorporate moral criteria for validity in certain extreme cases ("No enactment violating fundamental principles of justice is valid law"). The "not law" declaration is then a validity judgment based on the system's *own source-based rule*.
      *   **Compatible with Exclusive Positivism (with strong application norms):** Validity remains purely source-based. However, the system contains *overriding application norms* ("Courts must never apply/enforce a rule that constitutes a gross violation of fundamental justice") or powerful interpretive principles ("Statutes must be interpreted, if possible, to avoid intolerable injustice"). The "not law" claim is then a **strong prescription for judicial conduct** ("treat this *as if* it weren't law") or **retrospective characterization**, not a direct validity judgment *at the time of enactment*.
      *   **Compatible with a "Thin" Natural Law View:** There *are* necessary moral preconditions for legal validity. Formally valid norms exceeding a threshold of injustice lack legal force *ab initio*; courts merely *recognize* this fact in extreme cases.

  **What Changes if We Drop the Moral Validity Criterion (Exclusive Positivist View)?**

  In the "spicy" cases, a court *could* still reach the same outcomes without declaring the norm "not law":
  1.  **Informer Cases:** Punish the informer based on *retroactive legislation* condemning such acts under the new regime. Avoid declaring the old statute invalid *ab initio*; instead, say *applying* it *now* to justify the act would be intolerably unjust under the new legal order's principles. Outcome similar, reasoning different.
  2.  **Amnesty Cases:** Find the amnesty law *invalid* on procedural/constitutional grounds if possible. Interpret it narrowly to exclude crimes against humanity. Or, if forced to apply it, find the prosecution permissible under *international law* as incorporated domestically, overriding the amnesty. Avoid "void *ab initio* due to injustice."
  3.  **Torture-Extradition:** Strictly rely on explicit domestic statutes/Constitution/incorporated treaties prohibiting return to torture. Frame it as a *conflict* between legal obligations resolved by hierarchy (Constitution > statute), not that the foreign state's "law" permitting torture is "not law."

  **What the Practice Rules Out:**
  1.  **"Law is Whatever Officials Do" (Cynical Realism):** Courts don't treat *every* command of a powerful regime as "law" automatically. They distinguish between *de facto* power and *legal* validity, even in extreme cases (eventually). The "informer case" logic explicitly rejects the idea that formal enactment by a *de facto* regime is sufficient for legality if the content is monstrous.
  2.  **"Pure" Formalism:** The practice shows courts *do* engage with substantive morality, especially at the edges (contracts, human rights, extreme injustice). Law isn't *just* logic applied to sources.
  3.  **Hard Natural Law (Every Unjust Law is Void):** Courts *routinely* apply laws they find substantively unjust but not *sufficiently* unjust to cross the extreme threshold (e.g., harsh tax laws, arguably unfair criminal statutes). The practice recognizes a wide range of "valid but bad" laws.

  **The Procedural vs. Moral Asymmetry:**
  This is primarily **institutional caution**, not deep philosophy. Judges fear:
  *   **Legitimacy Erosion:** Being seen as imposing personal morality, undermining democracy.
  *   **Institutional Competence:** Legislatures are seen (in theory) as better forums for moral/policy debates.
  *   **Floodgates:** Worry that voiding for "injustice" is too subjective and invites chaos.
  *   **Clarity:** Procedural defects are usually binary (passed/not passed); moral judgments are gradational and contentious.
  The asymmetry *reflects* the philosophical tension but doesn't resolve it. It highlights the system's strong *presumption* in favor of source-based validity, only overcome in the most extreme circumstances.

  **Underdetermination & What Would Separate Theories:**
  The *observed practice* (outcomes in specific cases, distinction between routine and extreme injustice) is compatible with both Inclusive Positivism and Exclusive Positivism (with strong application norms). A thin Natural Law view also fits.

  **What could distinguish them?**
  1.  **Judicial Reasoning:** Does the court frame its decision as a *validity judgment* ("This was never law") or a *remedial/judicial conduct norm* ("We cannot enforce this valid law")? Practice often uses validity language ("not law"), but this could be rhetorical.
  2.  **Systemic Rules:** Does the legal system's *rule of recognition* explicitly incorporate morality as a validity criterion? (This is hard to observe directly; it's inferred from practice).
  3.  **Hypothetical Extreme Case:** Imagine a *procedurally perfect* statute enacted *today* mandating torture of innocents. Would a court:
      *   **A:** Declare it invalid immediately ("not law")? (Favors Inclusive Positivism/Thin Natural Law)
      *   **B:** Reluctantly apply it while condemning it? (Favors Exclusive Positivism)
      *   **C:** Refuse to apply it based on an overriding constitutional principle or judicial duty? (Favors Exclusive Positivism with strong application norms)
      *   **D:** Strike it down based on *existing* constitutional interpretation? (Favors Positivism generally).
      *   *Actual practice* suggests **C** or **D** are most likely in stable democracies with strong constitutions, avoiding **A** due to institutional caution. **B** is theoretically possible but unlikely in modern systems. The *informer case* scenario (**A**) usually arises only *after* the regime falls. This *timing* suggests the practice leans towards seeing the moral limit as an *application norm* or *post-hoc characterization* (**C**) justified by exceptional circumstances, rather than a continuous validity condition actively monitored during the regime's rule.

  **Conclusion:** The practice presupposes a legal system where source/pedigree is the *primary* determinant of validity, but where there exists a threshold of extreme injustice beyond which formally valid norms are treated *as if* they lack legal force. This is *strictly required* to explain the "spicy" cases. Whether this threshold constitutes a *condition of validity* itself (Inclusive Positivism/Thin Natural Law) or an *overriding norm for judicial application* within a source-based validity framework (Exclusive Positivism) is underdetermined by the practice alone. The practice rules out views that completely divorce law from morality or reduce it purely to official behavior. The procedural/moral invalidation asymmetry reflects institutional caution, not a philosophical resolution. Courts navigate this tension by limiting extreme moral invalidation to retrospective, transitional, or universally condemned contexts, preserving the default source-based validity rule.
