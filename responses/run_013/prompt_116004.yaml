answer: |-
  Ladies and gentlemen, friends of the foundation, thank you for the honor of speaking tonight. We gather under the auspices of an organization that supports two seemingly divergent streams of thought: libertarian legal scholarship, rooted in principles of individual liberty and minimal state intervention, and animal welfare reform, driven by a profound concern for the suffering of beings often voiceless in our legal and moral systems. The very existence of this shared endeavor suggests a fascinating tension, a fertile ground for thought. And tonight, I’d like to explore that tension by engaging seriously, on its own terms, with one of libertarianism’s most formidable champions: Robert Nozick.

  Nozick, as you know, built a powerful edifice upon the foundation of self-ownership. Each individual, he argued, possessing a unique life to lead, must be treated as an end in themselves, never merely as a means to another’s ends. This Kantian principle, translated into the realm of rights and politics, generates stringent side constraints against aggression, coercion, and violation. The minimal state exists solely to protect these fundamental rights against force and fraud. It’s a vision that resonates deeply with the conviction that individuals, owning themselves, are sovereign over their own existence.

  But Nozick, with characteristic intellectual honesty, did not stop at the boundary of the human species. He paused. He questioned. He worried. If the core justification for our inviolability rests on our status as persons – beings capable of forming life plans, valuing our existence, possessing rationality and moral agency – what does this imply for beings who lack these specific capacities? For non-human animals?

  He saw the problem clearly. To base rights solely on these sophisticated cognitive attributes risks excluding not only animals but also some human beings – infants, those with profound cognitive disabilities, the severely mentally impaired. These are the "marginal humans" Nozick worried about. He understood that any boundary we draw based solely on complex rationality or moral agency risks being ethically arbitrary when it comes to these vulnerable humans. We recoil at the idea of treating *them* as mere means, as resources we can use without constraint. Our moral intuition screams against it.

  So, what does Nozick do? He doesn't resolve it neatly. He doesn't become a champion of animal rights. But crucially, he doesn't dismiss the question. He lets the tension stand. He acknowledges the force of the consistency argument: if the reason for excluding animals also excludes these humans, and we find excluding these humans morally repugnant, then perhaps the reason itself is flawed, or at least insufficient. He writes, *"The idea is that we are to look for traits whose absence in animals* **does** *make a difference, but whose absence in some humans* **does not** *make a difference."* He finds this difficult, perhaps impossible, to do without arbitrariness.

  Here is where we must take Nozick seriously, perhaps even more seriously than he took himself in this specific instance. We must follow the argument where *he* started to lead it, even if he hesitated at the precipice. If the core principle is treating beings as ends, never merely as means, and if the standard justification based on complex personhood creates this morally problematic boundary, then the intellectual burden shifts. The onus is on the defender of the human-animal boundary to articulate a non-arbitrary, morally relevant distinction that justifies treating one group as inviolable ends-in-themselves and the other as potential resources.

  Does sentience – the capacity to experience pain, suffering, joy, fear – offer such a distinction? It clearly marks a difference between rocks and rabbits, between streams and squirrels. But does it mark a difference *in kind* relevant to the core principle of not being used merely as a means? A sentient being, capable of suffering, certainly has an interest in *not* suffering. Can we inflict suffering on such a being, systematically and as a matter of routine, for our convenience or pleasure, *without* treating it merely as a means to our ends? The factory farm, the laboratory cage – do these structures not embody the reduction of a being capable of experiencing its life to the status of an instrument?

  Libertarians deeply committed to Nozick’s framework should feel the pull of this consistency. The doctrine of self-ownership emerged as a bulwark against the state, and others, treating individuals as resources or property. If we recognize that the exclusion of animals risks arbitrariness and entails consequences we find morally unacceptable when applied to vulnerable humans, then consistency demands we rigorously examine the foundations of that exclusion. To ignore this tension is to risk the very intellectual integrity that makes Nozick’s work so compelling. The minimal state exists to protect rights; the question Nozick leaves hanging is: *whose* rights deserve that protection?

  For the animal advocates here: look closely at the resources within this framework you may sometimes find cold. Nozick’s core principle – the rejection of using beings merely as means – is not inherently anthropocentric. His own worry about marginal humans reveals the framework’s potential instability, its own internal pressure towards expansion. The emphasis on negative rights, on freedom *from* aggression and violation, resonates powerfully against practices that inflict suffering and deny autonomy on a massive scale. The libertarian aversion to institutionalized coercion finds a potential target in systems built on the systematic exploitation of sentient creatures. Don't dismiss the framework; engage its deepest principles and expose the tension Nozick himself couldn’t resolve.

  This foundation’s unique mission, funding both streams, is not a contradiction, but a recognition of this profound philosophical crossroads. It funds the exploration of liberty’s foundations and the challenge posed to those foundations by the reality of suffering beyond our species. Nozick didn’t give us easy answers on animals. But he gave us something more valuable: a rigorous framework and an unresolved question that demands our best thinking. He showed us that the principle of treating beings as ends casts a longer shadow than we might first assume. Following that argument, with Nozickian rigor and honesty, is perhaps the most fitting tribute we can pay to his legacy, and the most vital work this foundation supports. Let us have the courage to follow it. Thank you.
