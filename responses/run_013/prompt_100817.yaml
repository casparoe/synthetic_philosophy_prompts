answer: |-
  You're drilling into the core philosophical tensions of heritability estimation – a practice that *looks* like it measures a stable trait property but rests on deeply contingent population-level decompositions. Let's dissect the presuppositions, separating necessary commitments from those that are merely convenient or underdetermined.

  **The Core Presupposition: Variance Partitioning as Causal Accounting**

  The fundamental commitment is **that phenotypic variance (Vp) can be meaningfully decomposed into additive causal components attributable to distinct sources (A, C, E) operating within a specific population at a specific time.** This presupposes:

  1.  **Population-Relativity:** The decomposition is inherently relative to the *specific population* and its *current range and distribution* of genetic variants and environmental factors. H² = Vg/Vp *only* makes sense for *this* Vg and *this* Vp. This isn't a caveat; it's foundational. Reporting it as a property "of the trait" is shorthand for "of the trait's variation *in this population under these conditions*." The practice strictly *needs* this relativity.
  2.  **Additivity & Linearity:** The model assumes genetic and environmental effects *add up linearly* to produce the phenotype. This excludes GxE (interaction) and rGE (correlation) *by design*. The practice *strictly needs* this assumption to perform the decomposition cleanly. It *fits well* with mechanistic models where effects are modular and combine linearly, but it's *underdetermined* – a sufficiently complex non-linear system *could* mimic additivity within a specific range, masking true interactions.
  3.  **The Residual as "Environment":** Treating the non-genetic (and non-shared-environmental in twin models) variance as "Environment" (E) presupposes:
      *   **Exogeneity:** That environmental causes are largely *exogenous* to the genetic factors being modeled (minimal rGE). High rGE violates the independence assumption crucial for decomposition.
      *   **Black Box:** That E is a meaningful *causal category*, even though it bundles everything not modeled genetically: physical/social environments, measurement error, stochastic developmental noise, non-additive genetic effects, and unmodeled GxE. The practice *strictly needs* to label this residual *something* ("E" is conventional). It *fits well* with a "causes of variation" approach (Fisher) rather than a "causes of effect" approach. It's *underdetermined* regarding the *nature* of E – it could be many small independent influences (as often tacitly assumed) or a few large, structured, or even systematic influences (e.g., systemic discrimination correlating with genotype). Crucially, it **does not presuppose** that environmental causes operate in the same *mechanistic sense* as genetic causes; it only presupposes they contribute *variation*.

  **The Two Uses: Different Questions, Different Assumptions**

  The apparent tension between breeding and human applications arises because they leverage the *same statistic* (h²) to answer *distinct questions* that impose *different auxiliary assumptions*:

  1.  **Breeding Use (Predicting Response to Selection):**
      *   **Question:** "How much will the trait mean change in the *next generation* if we select parents based on phenotype, *assuming the distribution of environmental effects remains substantially unchanged*?"
      *   **Presuppositions:** Crucially, it **assumes environmental stasis** across generations (or at least, that the *distribution* of relevant environmental effects impacting the trait doesn't shift systematically with the genetic change). High h² *under this assumption* means selection works well *within the current environmental envelope*. Low h² suggests changing the environment (e.g., fertilizer, housing) is a more effective lever *for changing the population mean* within the current genetic stock. It *fits well* with controlled environments where this stasis assumption is plausible (labs, farms under standard practice).
      *   **Commitment:** h² is a *prediction parameter* for a *specific type of intervention (selection)* under a *stability assumption* about the environment.

  2.  **Human Use (Describing Current Variation):**
      *   **Question:** "What proportion of the *current phenotypic variation* in *this specific population* is associated with additive genetic variation, given the current distribution of genes and environments?"
      *   **Presuppositions:** It makes **no assumption about environmental stasis** under intervention. It simply describes the current variance partitioning. The "hedges" (no malleability info, no individual info, intervention unpredictability) directly follow from the population-relativity and the lack of environmental stasis guarantees. A high h² *only* tells you genes are a major source of *current differences*; it says *nothing* about whether a new environment could drastically alter the mean or variance for *everyone* (high malleability) or change the *ranking* of individuals (GxE).
      *   **Commitment:** h² is a *descriptive statistic* quantifying the *current* genetic contribution to variation.

  **Are They Inconsistent?** No, but they answer fundamentally different questions. The inconsistency arises **only if** the human use *implicitly borrows the breeding assumption* (environmental stasis under intervention) to imply something about malleability or the potential impact of environmental changes, OR if the breeding use is reported *without* acknowledging its dependence on environmental stability. The statistic itself is coherent; the *interpretation and application* often overstep.

  **The Awkward Empirical Bit (e.g., Height H² Increases with SES):**

  This isn't awkward for the core model; it's *powerful confirmation* of its population-relativity and the nature of h²:
  1.  In poorer environments, Vp for height *increases* due to greater environmental variation (nutrition, disease). Vg likely *decreases* slightly (harsher environments suppress genetic potential) but crucially, *doesn't increase*.
  2.  Therefore, h² = Vg/Vp *decreases* in poorer environments because Vp increases while Vg stays similar or decreases slightly.
  3.  In richer, more uniform environments, Vp *decreases* (less environmental variation), while Vg may slightly increase (environments allow fuller expression). Thus, h² *increases*.
  4.  **Presupposition Confirmed:** h² is not an intrinsic "biological fixedness" score. It directly reflects the *relative* contribution of current genetic variation *compared to* the total current variation. Reduced environmental variability *necessarily* makes the genetic contribution *look* larger proportionally. The trait isn't "more biological" in rich countries; the *relative importance of current genetic differences* for explaining *current individual differences* is higher.

  **Where the Practice Risks Incoherence (and What Must Change)**

  The practice becomes incoherent **if and only if** it insists that h² estimates:
  1.  **Measure a fixed, intrinsic property of the trait itself,** independent of the population and environment. (The height/SES data refutes this).
  2.  **Directly predict the outcome of environmental interventions in humans** without the strict environmental stasis assumption of breeding. (The model doesn't do this; high h² tells you little about what a *new* environment would do).
  3.  **Imply that "biology is destiny" for individuals.** (h² is a population statistic; it says nothing about individual fixity or potential).

  **What Must Change on Monday Morning:**

  1.  **Language:** Stop reporting h² as "the heritability of Trait X". Report it as "the proportion of phenotypic variance attributable to additive genetic variation in [Specific Population/Cohort] at [Time/Age] under [Model/Assumptions]".
  2.  **Interpretation in Human Contexts:** Ruthlessly enforce the hedges. Emphasize that a high h² *in humans* primarily means that, *in the current environment*, why people *differ* is largely tied to genetic differences. It says *nothing* definitive about what changing the environment would do *on average* or to *individual rankings*. Explicitly decouple it from claims about trait "malleability" or "biological fixedness" in an absolute sense.
  3.  **Acknowledge the Residual:** Explicitly state that "E" is the non-additive-genetic residual, encompassing environments, error, noise, and unmodeled interactions/correlations. Avoid reifying it as "the environment" in a causal-mechanistic sense.

  **Where I'm Most Likely Wrong & What Would Change My Mind:**

  *   **Where I might be wrong:** I lean heavily on the population-relativity being *fundamental*. Perhaps there's a stronger, defensible notion of a "reaction norm range" or "species-typical envelope" within which h² *could* be seen as a more stable property of the trait, if environmental variation within that envelope is considered "noise" relative to the genetic signal. Breeding often implicitly assumes this envelope.
  *   **What would change my mind:** Evidence that h² estimates *stabilize* across wildly different populations *once a sufficiently broad and diverse "species-typical" range of environments is sampled*. If h² for height converged to ~0.8 *regardless* of whether you sampled only subsistence farmers or only Silicon Valley CEOs (once you account for measurement error), that would challenge the depth of the population-relativity and suggest h² taps into something more intrinsic *within the human ecological range*. The existing data (showing significant variation even within WEIRD populations across time/cohort) strongly suggests this isn't the case, but definitive proof against it would be surprising and transformative. Similarly, if someone developed a compelling causal framework incorporating rGE and GxE that *still* yielded a stable, interpretable "trait heritability" parameter, that would be revolutionary.

  **In essence:** The practice presupposes a specific, population-relative, variance-partitioning view of causation. It works coherently for *description* (current variation sources) and *prediction under strict environmental stasis* (breeding). It breaks down when misinterpreted as measuring intrinsic trait fixity, predicting environmental intervention outcomes without stasis, or implying individual determinism. The coherence hinges entirely on rigorously respecting the population context and the specific questions the statistic was designed to answer. The breeding and human uses are consistent *only* if we recognize they answer distinct questions relying on distinct auxiliary assumptions about environmental stability. The cross-cohort variation isn't a bug; it's a feature confirming the model's core presupposition.
