prompt: |-
  I keep getting into arguments with a friend who works in development about what counts as corruption, and I want to work out what I actually think by going case by case. Surgeon gets a bottle of wine from a grateful patient a fortnight after a clean operation: not corruption. Same surgeon gets an envelope the night before the operation: corruption, obviously. Waiter gets 20%: fine. Clerk in a licensing office takes a couple hundred rupees to move my file to the top of a queue that's otherwise strictly first-come-first-served: corruption, even though it's small and my file would've come up eventually. Same clerk, same office, takes the same money to issue me a permit I'm legally entitled to and he's legally obliged to issue, where the only alternative is a six-month wait: I don't think that's corruption, though I can see it's the same shape as the queue case and that bothers me. Minister's nephew gets a ministry job he's qualified for and no ones else applied: corruption. Shop owner hires her competent friend over a better-qualified stranger: not corruption. Company pays a retired regulator a fat "consulting fee" a year after she ruled its way: corruption — but then why isn't the wine corruption, since both are payments after the fact for something already done?

  Also, my grandmother's town has an actual customary scale, written down, where officials get a fixed "harvest share" every autumn, everyone knows the amounts, and nobody expects anything in return — the ones who take it call it a salary top-up, and the ones who refuse it are thought stuck-up. I feel like that's corruption and I can't say why the wine isn't.

  What principle, or small set of principles, gets all of these? Where it can't, which verdict should I give up, and what does the surviving principle say about the harvest share and about a case I haven't listed — say, a Western engineering firm paying "facilitation" money to customs officers abroad? And be honest with me about whether I've just dressed up a Western standard as a universal one.
reasoning: |-
  Okay, let me start by really unpacking what the user is asking here. They're tangled in arguments with a friend about what counts as corruption, using all these specific examples. The core issue seems to be finding a consistent principle that applies across different scenarios without bias. 

  First, I notice the user is self-aware—they’re questioning whether their own views might be culturally influenced ("dressed up a Western standard"). That’s important. They want honesty about cultural relativity, not just a textbook definition. 

  Looking at their examples: the surgeon’s wine vs envelope, the clerk’s bribe for queue-jumping vs permit issuance, the harvest share tradition... each blurs lines differently. The user admits feeling conflicted, especially when the "shape" of two acts feels similar (e.g., post-op wine vs regulator’s consulting fee) but their intuition labels one corrupt and the other not. 

  I think their deeper need is twofold: 
  1. Clarity for their own ethics (to resolve arguments confidently). 
  2. Validation that their instincts aren’t hypocritical or culturally imperialist. 

  The challenge is crafting principles flexible enough for nuance (e.g., social gifts vs bribes) but rigid enough to condemn systemic issues like the "harvest share." The Nephew/Minister example is easy—nepotism violates impartiality—but the shop owner hiring a friend is trickier. Why is that acceptable? Probably because private entities aren’t bound by public-duty ethics. That distinction (public vs. private power) might be key. 

  The clerk’s permit bribe is their toughest case. They say it’s not corruption since the permit is legally owed, but admit it mirrors the queue-jumping bribe. Here, I’d argue both are corrupt because payment hijacks a public function. The six-month delay is institutional failure, but bribes shouldn’t fix that—protests or lawsuits should. 

  On culture: the harvest share *is* corrupt by public-office principles, even if normalized. The user’s discomfort ("can’t say why the wine isn’t") highlights that social gestures (wine) lack the systemic harm of official "top-ups." One is personal gratitude; the other is institutionalized diversion of public resources. 

  For the Western firm paying "facilitation" fees abroad—yes, it’s corruption. Their principles should apply universally: if the fee buys public action (customs clearance) from an officer bound by rules, it’s corrupt regardless of local norms. 

  Ultimately, they might need to concede that the "qualified nephew" case isn’t strictly corrupt if no rules were broken—but it still stinks of unfair access. The principles can label it "misconduct" rather than corruption, satisfying their intuition without overreach.
answer: |-
  Based on your cases, the core principle distinguishing corruption isn't the *amount*, *timing*, or even the *outcome*, but **the nature of the power being exercised and the violation of trust inherent in that power**. Here's a set of principles that consistently cover your examples:

  1.  **Violation of Public Trust (Impartiality Principle):** Corruption occurs when an individual entrusted with **public power** (derived from law, regulation, or official position) exercises that power partially for private gain (money, favor, advantage), violating their duty of impartial service to the public good. The key is the *source* and *purpose* of the power.
  2.  **Violation of Fiduciary Duty (Agency Principle):** Corruption occurs when an individual acting as an **agent** for a principal (employer, client, shareholder) betrays that trust by acting in their own private interest or the interest of a third party in exchange for a benefit, to the detriment of the principal.
  3.  **The Market Exchange Principle (What it's NOT):** Transactions where power is **privately held** and the exchange is essentially a market transaction (even if influenced by personal relationships) are generally not corruption. The payer is the principal, not the public.

  **Applying the Principles to Your Cases:**

  *   **Surgeon (Wine after):** **Not Corruption.** Power is *professional* (private contract with patient/hospital), not *public*. Gratitude after service doesn't violate impartiality regarding *that* patient. (Agency Principle: Patient is the principal; gift doesn't harm them).
  *   **Surgeon (Envelope before):** **Corruption.** Attempting to influence the exercise of *professional* power for private gain *before* service violates impartiality and fiduciary duty to the patient/hospital. (Agency Principle violated).
  *   **Waiter gets 20%:** **Not Corruption.** Power is *private* (serving customers for employer). Tip is an expected market mechanism, part of the service transaction. Waiter is an agent, but the tip is an understood part of the compensation structure, not a secret bribe violating duty to the *principal* (restaurant/patron).
  *   **Clerk (Moves File):** **Corruption.** Clerk exercises *public power* (administering a queue based on rules). Taking money to violate the "first-come-first-served" rule grants an unfair private advantage, violating impartiality and public trust.
  *   **Clerk (Issues Permit - Legal but Slow):** **Corruption.** Clerk exercises *public power*. The duty is to issue permits impartially according to rules, *including* the timing mechanism (even if flawed). Taking money to circumvent the *official procedure* (the wait) violates the impartial administration of that public function for private gain. The system's inefficiency doesn't legitimize bribery.
  *   **Minister's Nephew (Qualified, No Competitors):** **Corruption.** Minister exercises *public power* (hiring for public service). Hiring a relative, even if qualified, violates the duty of impartiality. Public positions must be filled based solely on merit and public interest to avoid patronage, nepotism, and erosion of trust. The lack of other applicants doesn't negate the violation of principle.
  *   **Shop Owner hires Friend:** **Not Corruption.** Power is *private* (hiring for a private business). The shop owner *is* the principal. Hiring a competent friend over a slightly better stranger is a legitimate (if sometimes suboptimal) exercise of private discretion in a market context. No public trust is violated.
  *   **Company pays Retired Regulator:** **Corruption.** The "consulting fee" is likely a reward for a *public* decision made while in office. It violates the *public trust* inherent in the regulator's former role. The timing disguises the quid pro quo. The core issue is the *connection* between the past public act and the current payment. (Compare to Wine: No public power involved in the surgeon's act).
  *   **Grandmother's Town "Harvest Share":** **Corruption.** Officials receive a benefit tied to their *public office* from the public they serve. Even if "customary" and "expected," it violates the **Impartiality Principle**. Officials should be compensated solely by the public purse (salary/taxes) to ensure their loyalty is undivided and their decisions are impartial. This system institutionalizes a conflict of interest and undermines the *idea* of disinterested public service. (Why it's different from Wine: The wine is a personal gift *after* a *private* service; the harvest share is a systematic payment *because of* holding *public* office).
  *   **Western Firm paying "Facilitation" to Customs Officers:** **Corruption.** Customs officers exercise *public power*. "Facilitation" payments (bribes) are paid to induce them to perform their existing duty (clear goods) or circumvent rules (e.g., inspections, duties). This violates impartiality and public trust for private gain (the firm's speed/avoided costs). The location ("abroad") doesn't change the nature of the public office.

  **Where the Principle Might Feel Uncomfortable (But Holds):**

  *   **Clerk (Issues Permit - Legal but Slow):** You felt this wasn't corruption. The principle says it *is*. Why? Because the clerk is selling preferential access to a *public service*. The inefficiency is a problem to be solved through reform (complaints, oversight, process improvement), not bribery. Bribery here corrupts the *process* and creates a two-tier system: those who pay vs. those who can't/won't.
  *   **Minister's Nephew (Qualified, No Competitors):** You called it corruption. The principle confirms this. Even if qualified and unopposed, the *act* of using public office to benefit family violates the fundamental principle that public resources and positions are not private property. It normalizes nepotism.

  **What Verdict Might Need Softening (Or Reframing):**

  *   **Shop Owner hires Friend:** The principle clearly says "not corruption" and holds. However, you could argue it's *unfair* or *bad business practice*, but it doesn't involve the misuse of entrusted power for private gain in the *corruption* sense. The power is inherently private.

  **On Western Standards vs. Universality:**

  You're right to be wary. The principles outlined (Public Trust/Impartiality, Fiduciary Duty) are deeply embedded in Western democratic theory and anti-corruption frameworks like Transparency International's definition. However, they aim for universality based on the *nature* of power and trust:

  1.  **Focus on Public vs. Private Power:** This distinction exists in most societies, even if the boundaries differ. A traditional chief holds public power; a merchant holds private power.
  2.  **Core of Trust:** All societies rely on some level of trust in those managing communal resources or enforcing rules. Violating that trust for private gain is corrosive.
  3.  **The "Harvest Share" Test:** Applying the principle here shows it *can* condemn non-Western practices deemed corrupting by the standard of impartial public service. It doesn't automatically excuse something because it's "customary." Custom can entrench corruption.

  **However, be honest about challenges:**

  *   **Cultural Nuance:** The *perception* of what constitutes "public power" or "private discretion" can vary. Gift-giving traditions can blur lines (though the harvest share is systemic, not a personal gift).
  *   **Power Imbalances:** In highly unequal societies, what looks like a "private" transaction (e.g., a tenant "gifting" a landlord) can mask exploitation facilitated by power imbalance – arguably a form of corruption if the landlord holds significant local power.
  *   **Feasibility:** Insisting on absolute impartiality in contexts of extreme scarcity or weak institutions can seem unrealistic. The principle identifies the *corrupting act* (the bribe), even if the *motivation* (survival, bypassing a broken system) is understandable.

  **Conclusion:**

  The consistent principle is the **misuse of entrusted power (especially public power, but also fiduciary agency) for private gain, violating a duty of impartiality or loyalty.** This covers your cases:

  *   Corruption: Surgeon (pre-op), Clerk (both), Minister (nephew), Retired Regulator, Harvest Share, Facilitation Payments.
  *   Not Corruption: Surgeon (post-op wine), Waiter (tip), Shop Owner (hiring friend).

  You likely need to adjust your view on the **Clerk issuing the legal permit slowly**. It *is* corruption under this principle, as it involves selling preferential access to a public service. The system's flaw doesn't justify the corrupt act; it necessitates reform.

  This principle isn't purely "Western" – it targets a fundamental abuse of power and trust found corrosive across diverse societies, as evidenced by applying it to the "Harvest Share." It provides a robust, non-arbitrary framework for your case-by-case analysis.
