prompt: |-
  I keep running into a fairness rule in two-person negotiations and I don't know if it has a name. The rule is: figure out the best each side could possibly get if the other side went along, then give each side the same fraction of that best-case amount. So if I could at most get 100 and you could at most get 50, we split whatever is actually on the table in a 2:1 ratio, no matter how big or small the total pie is. It's not "split the difference" and it's not the rule where you maximize the product of what each side gains over their fallback — under that product rule, if your outside option improves, my share can actually go down, which seems wrong, whereas under the fraction rule my share as a fraction of my best case stays put. But I'm not sure the fraction rule is even well-defined when the best-case amounts depend on what counts as the fallback, or when the feasible set isn't a nice convex blob. Does this rule have an established name? And if so, how exactly is it different from the product rule and from equal-split? I care less about the label than about the precise boundaries: what does the rule assume about the disagreement point, what happens when the best-case amounts change because the other player's options change, and are there cases where the rule gives an answer that isn't on the efficient frontier? Also, is there a version for more than two parties, or does it fall apart? I've tried to work out a seperate example with three people and got confused about whether the ratio should be to each person's own max or to some joint max.
reasoning: |-
  We are discussing a fairness rule in negotiations. The rule you described is: 
   For each party, calculate the maximum they could get if the other party agreed to everything (their "best-case" outcome). Then, the total available resources are distributed such that each party receives the same fraction of their respective best-case amount.

   Example: 
     Party A's best-case: 100 (if Party B gets 0)
     Party B's best-case: 50 (if Party A gets 0)
     Then, if the total pie is T, we set:
          a = fraction * 100
          b = fraction * 50
          and a + b = T

     So: fraction * (100 + 50) = T  => fraction = T/150
     Then:
          a = (T/150)*100 = (2/3)T
          b = (T/150)*50 = (1/3)T

     So the ratio is 2:1.

   You note that this is different from the Nash bargaining solution (which maximizes the product of gains over the disagreement point) and from an equal split.

   Questions:
   1. What is the name of this rule?
   2. How does it differ from the Nash product rule and equal split?
   3. What are the assumptions (disagreement point, feasible set)?
   4. What happens when best-case amounts change due to changes in the other player's options?
   5. Does it always yield an efficient outcome (on the Pareto frontier)?
   6. Extension to more than two parties?

   Let's address each:

   1. **Name**: This rule is known as the "Proportional Rule" or "Proportional Allocation" in some contexts. In bargaining theory, it is sometimes called the "Equitable Bargaining Solution" or the "Proportional Bargaining Solution". However, note that there isn't a single universally accepted name. It is also related to the idea of "equal relative concession" but in a specific form.

      In particular, it resembles the "Kalai-Smorodinsky bargaining solution" (KS solution) in the sense that both use the ideal point (the point of best-case outcomes for each) as a reference. However, the KS solution does not set the same fraction of the ideal point but rather chooses the point on the Pareto frontier such that the ratios of the gains (from the disagreement point) to the ideal gains are equal. 

      But note: in your rule, there is no explicit disagreement point. You are using the ideal point (best-case for each) and then setting the same fraction. So it is different from KS because KS uses both the disagreement point and the ideal point.

   2. **Differences**:

      - **Nash bargaining solution (NBS)**: 
          The NBS maximizes the product (u1 - d1)*(u2 - d2) over the feasible set, where (d1,d2) is the disagreement point. 
          A key feature: if one player's disagreement outcome improves (d1 increases), then that player's share in the bargain may increase, and the other player's share may decrease. In your example, if the best-case amounts are fixed and the disagreement point changes, NBS will change, but your fraction rule does not depend on the disagreement point at all.

      - **Equal split**: 
          This is simply splitting the total equally. It does not take into account the best-case scenarios.

      - **Kalai-Smorodinsky (KS)**:
          The KS solution requires a disagreement point (d1,d2) and an ideal point (m1, m2) which is the maximum each can get given that the other gets at least their disagreement utility. The solution is the point on the Pareto frontier such that:
              (u1 - d1)/(m1 - d1) = (u2 - d2)/(m2 - d2)
          Your rule does not have a disagreement point. If we set d1=d2=0, then the KS solution would set u1/m1 = u2/m2, which is exactly your rule. But if the disagreement point is not zero, then they are different.

          Therefore, your rule is a special case of the Kalai-Smorodinsky solution when the disagreement point is (0,0). However, in many bargaining situations, the disagreement point is not zero.

   3. **Assumptions**:

      - The rule as stated does not require a disagreement point. It only requires the ideal point (max possible for each if the other agrees to give them that maximum).

      - The feasible set: The rule assumes that the set of feasible utility pairs is comprehensive (downward closed) and convex? Actually, the rule might be applied without these assumptions, but then it may not be well-defined or may not lie on the Pareto frontier.

          How we compute the ideal point? We assume:
            m1 = max { u1 | (u1, u2) in S }   (with u2>=0? or what? we need to define the constraints)
            m2 = max { u2 | (u1, u2) in S }   (with u1>=0?)

          But note: in a typical bargaining setting, when we maximize u1, we require that u2 is at least the disagreement level? In your rule, you are assuming that the other side "goes along", meaning that we are not requiring a minimum for the other? So we are taking the absolute maximum for one regardless of the other.

          However, if the feasible set is not comprehensive or not convex, the ideal point might be hard to define and the proportional allocation might not be feasible. Also, the straight line from (0,0) to (m1, m2) might not lie entirely in the feasible set.

          Moreover, the rule as described does not require a disagreement point. It is defined solely in terms of the ideal point and the total available.

          But note: the rule as you described does not necessarily use the entire feasible set. It assumes that we are distributing a fixed pie? Actually, in your example, you say "split whatever is actually on the table", so T is the total to be split. But in a general bargaining problem, the set S might not be a linear set. So the rule might be more naturally defined for a fixed total T and when utilities are linear in the share (i.e., u1 = a, u2 = T - a, and we set a in [0, T]). Then the ideal points are:
              m1 = T (if the other gets 0) and m2 = T (if the other gets 0) ??? 
          That doesn't match your example. In your example, the ideal points are 100 and 50, which add up to 150, and T is the total to be split. So T might be less than 150.

          Therefore, the rule is well-defined for a fixed total T and when the ideal points are given (and note they are independent and might not add to T). But in a general bargaining problem, the ideal points are determined by the feasible set.

          How do we define the ideal point in a general bargaining problem? 
            m1 = max { u1 | (u1, u2) in S }   (without constraint on u2? but then u2 might be negative? We need to assume that the other player can be given arbitrarily low utility? Or we might set a minimum? Typically, in bargaining, we assume the feasible set includes the disagreement point and we require individual rationality. But your rule does not specify.)

          So the rule implicitly assumes that the feasible set allows one player to get arbitrarily close to their maximum while the other gets nothing (or at least, we can achieve the maximum for one without regard for the other). This may not hold in general.

   4. **Change in best-case amounts**:

      In your rule, the fraction is determined by the ratio of the ideal points. If the other player's options change, then their ideal point (m2) changes, and hence the fraction and the allocation to both players change.

      Example: Initially, m1=100, m2=50, so if T=60, then fraction = 60/150=0.4, so A gets 40 and B gets 20.

      Now, suppose B's best-case improves to m2'=100 (so now both have the same ideal). Then fraction = 60/(100+100)=0.3, so A gets 30 and B gets 30.

      Notice that when B's ideal improved, A's allocation went down (from 40 to 30) even though A's ideal didn't change. This is because the rule is based on relative ideals. 

      Compare to Nash: In Nash, if we fix the disagreement point, then if B's ideal improves (meaning the feasible set expands in the direction of B), then typically B would get more and A might get more too? But note, if the expansion is only in the direction of B, then the Nash product might lead to more for B and less for A? Actually, it depends on the shape of the set.

      In your rule, when B's ideal increases, the fraction of the total that A gets (relative to A's ideal) remains the same as B's, but the fraction itself changes because the denominator (m1+m2) changes.

   5. **Efficiency**:

      The rule as described does not necessarily yield a Pareto efficient outcome in a general bargaining problem. Why?

          The rule sets u1 = k * m1 and u2 = k * m2, and then chooses k such that (u1, u2) is in the feasible set. But if the feasible set is not linear, then the point (k*m1, k*m2) might not be on the Pareto frontier. 

          In fact, the rule is efficient only if the Pareto frontier is linear and passes through (m1,0) and (0,m2). Otherwise, there might be a point on the frontier that dominates (k*m1, k*m2). 

          Example: Consider a feasible set that is a triangle with vertices (0,0), (100,0), (0,50). This set is convex and comprehensive. The ideal points are m1=100, m2=50. For a given k, we have (100k, 50k). The Pareto frontier is the line from (100,0) to (0,50). The rule gives points on the line connecting (0,0) to (100,50). This line is inside the triangle and is not the Pareto frontier. For example, if k=0.5, we get (50,25). But the point (50,25) is not on the Pareto frontier because we can have (50,25) but also we can have (60,20) or (40,30) which are on the frontier? Actually, in this triangle, the Pareto frontier is the line from (100,0) to (0,50). The point (50,25) is actually on the line between (100,0) and (0,50)? Let me check:

            The equation of the line from (100,0) to (0,50): 
              u2 = 50 - (50/100)*u1 = 50 - 0.5*u1.
            At u1=50, u2=25, so it is on the frontier? Then in this example, it is efficient.

          Now, consider a different feasible set: a rectangle [0,100] x [0,50]. Then the ideal points are (100,50). The rule gives (100k, 50k). The Pareto frontier of the rectangle is the entire top-right boundary? Actually, it's the set where either u1=100 and u2 in [0,50] or u1 in [0,100] and u2=50. The point (100k,50k) is on the frontier only if k=1 (then (100,50)) or if k=0 (then (0,0))? Otherwise, for k in (0,1), we have (100k,50k) which is strictly inside. So we can increase one without decreasing the other? For example, at k=0.5, we have (50,25). We can increase u1 to 100 without affecting u2? But wait, the set is a rectangle: from (50,25) we can move to (100,25) which is still in the set. So (50,25) is not Pareto efficient.

          Therefore, the rule is efficient only when the feasible set is such that the ray from (0,0) to (m1,m2) intersects the Pareto frontier. This happens in convex sets that are "strictly comprehensive" and have a linear frontier? Actually, in the triangle example it worked because the frontier was linear and the ray was exactly along the frontier. In the rectangle, it's not.

          So the rule is efficient only in specific cases (like when the feasible set is a simplex or when the Pareto frontier is linear and passes through (0,0) and (m1,m2)). In general, it may not be efficient.

   6. **More than two parties**:

      The rule can be extended to n parties. We define the ideal point for each party i: m_i = max { u_i | (u_1, ..., u_n) in S } (again, without constraints on the others?).

      Then set u_i = k * m_i for each i, and choose k such that (u_1, ..., u_n) is in the feasible set. However, note that we might not be able to achieve k=1 because the ideal point (m_1, m_2, ..., m_n) may not be feasible. So we set k to the maximum such that (k*m_1, k*m_2, ..., k*m_n) is feasible.

      However, the same efficiency issue arises. Moreover, the ideal point for one party might be achieved at a point where another party gets a very low utility, which might not be individually rational. Also, the rule does not account for a disagreement point.

      Example with three parties:

          Suppose we have to split a total T. The ideal points: m1, m2, m3. Then we set:
              u1 = k * m1
              u2 = k * m2
              u3 = k * m3
              and k * (m1+m2+m3) = T   => k = T/(m1+m2+m3)

          Then u1 = (m1/(m1+m2+m3))*T, and similarly for others.

          But note: in this example, the rule is well-defined. However, if the feasible set is not a simple split of T but a more complex set, then the point (k*m1, k*m2, k*m3) might not be feasible.

          Example: Feasible set is defined by u1+u2+u3 <= T and u1>=0, u2>=0, u3>=0. Then the ideal points are m1=T, m2=T, m3=T. Then k = T/(T+T+T) = 1/3, so each gets T/3.

          But if the feasible set has additional constraints, e.g., u1 <= 50, then the ideal point for player 1 is 50 (not T). Then we set:
              k = T/(50+m2+m3)   and then u1=50*k, u2=m2*k, u3=m3*k.

          But note: this point may not be feasible if, for example, the constraint u1<=50 is active and we have u1=50*k and k might be less than 1, so u1<50. Then it is feasible? But we also have to satisfy u1+u2+u3<=T. We have:
              50*k + m2*k + m3*k = k*(50+m2+m3) = T * (50+m2+m3)/(50+m2+m3) = T, so it is feasible.

          However, if there are other constraints, it might not be.

          Also, note that the ideal point for player 1 is 50, but when we set u1=50*k, it might be that we could actually give player 1 more than 50*k without violating the constraints? But then that would break the proportionality? The rule is defined by the fraction k, so we are fixed to that fraction.

          And again, efficiency: if the feasible set is convex and comprehensive, then the point we get might not be Pareto efficient.

   Conclusion:

      The rule you describe is known in the literature as the "proportional solution" relative to the ideal point. It is a special case of the Kalai-Smorodinsky solution when the disagreement point is (0,...,0). However, it does not always yield an efficient outcome unless the feasible set is such that the ray from the origin through the ideal point lies on the Pareto frontier.

      The rule does not use a disagreement point, which is a key difference from Nash and Kalai-Smorodinsky. Therefore, it does not directly account for the players' outside options (fallback positions) but rather their aspirations (best possible outcomes).

      In multi-party settings, the rule extends naturally but may suffer from the same inefficiency and feasibility issues.

      If you are in a situation where the feasible set is a linear space (like splitting a fixed pie with no additional constraints) and utilities are linear, then the rule is efficient and well-defined. But in more complex settings, it might not be.

      So the precise boundaries:

          - The rule requires the definition of an ideal point for each player, which is the maximum utility they can achieve if the others do not object (i.e., without requiring the others to get a minimum, but we must have the others' utilities being feasible; note that in the max for player i, we do not require the others to get at least zero? We might get negative? So we must assume that the feasible set allows the others to get arbitrarily low? Or we set a minimum? Usually, in bargaining, we assume the utilities are normalized so that the disagreement point is 0 and we require individual rationality. But in your rule, the disagreement point is not used.)

          - The rule is defined by the point (k*m1, k*m2, ..., k*mn) where k is chosen as the maximum such that the point is feasible. This k might be less than 1.

          - The rule is efficient only in specific cases (like when the feasible set is a simplex defined by the ideal point).

          - In the case of changing best-case amounts (due to changes in the other player's options), the rule adjusts the fraction and hence the allocation for all players.

      If you want to account for a disagreement point, you might consider the Kalai-Smorodinsky solution. But note that in KS, the ideal point is defined relative to the disagreement point: 
            m1 = max { u1 | (u1,u2) in S and u2 >= d2 }
            m2 = max { u2 | (u1,u2) in S and u1 >= d1 }

      Then the solution equates the ratios (u1-d1)/(m1-d1) = (u2-d2)/(m2-d2) and chooses the maximal such point on the Pareto frontier.

      This KS solution is efficient and satisfies some appealing axioms. But note: if the disagreement point changes, then the ideal points and the solution change.

      In your rule, without a disagreement point, the ideal points are absolute maxima in the entire set, which might be higher than in the KS ideal points (because in KS we are constrained by the other player getting at least their disagreement utility). Therefore, your rule might be more "aspirational".

      I hope this clarifies.
answer: |-
  The rule you describe is known as the **Proportional Allocation Rule** or **Ideal Point Proportional Rule**. It's closely related to, but distinct from, the Kalai-Smorodinsky bargaining solution. Below, I address your questions systematically, clarifying the rule's definition, assumptions, differences from other solutions, edge cases, and extensions.

  ---

  ### **Core Mechanics of the Proportional Rule**
  1. **Definition**:  
     For two players with "best-case" payoffs \(m_1\) and \(m_2\) (where \(m_i\) is the maximum payoff player \(i\) can achieve if the other concedes entirely), the rule allocates payoffs \((u_1, u_2)\) such that:  
     \[
     \frac{u_1}{m_1} = \frac{u_2}{m_2} = k \quad \text{and} \quad u_1 + u_2 = T,
     \]  
     where \(T\) is the total available surplus. This implies:  
     \[
     u_1 = \frac{m_1}{m_1 + m_2} \cdot T, \quad u_2 = \frac{m_2}{m_1 + m_2} \cdot T.
     \]  
     The allocation ratio is \(m_1 : m_2\) (e.g., \(100:50 = 2:1\)).

  ---

  ### **Key Differences from Other Rules**
  | **Rule**               | **Mechanics**                                                                 | **Response to Changes in \(m_2\)**                                  |
  |------------------------|-------------------------------------------------------------------------------|---------------------------------------------------------------------|
  | **Proportional Rule**  | Fixes \(\frac{u_1}{m_1} = \frac{u_2}{m_2}\); ignores disagreement point.     | If \(m_2\) increases, \(u_1\) **increases** (see example below).   |
  | **Nash Bargaining**    | Maximizes \((u_1 - d_1)(u_2 - d_2)\); depends on disagreement point \((d_1,d_2)\). | If \(m_2\) increases, \(u_1\) **may decrease** due to \(d_2\).     |
  | **Equal Split**        | Sets \(u_1 = u_2 = T/2\).                                                    | Unaffected by changes in \(m_i\).                                  |

  - **Example**:  
    - Initial: \(m_1 = 100\), \(m_2 = 50\), \(T = 90\) → \(u_1 = 60\), \(u_2 = 30\).  
    - If \(m_2\) increases to \(75\):  
      - Proportional: \(u_1 = \frac{100}{175} \cdot 90 \approx 51.4\) (higher than before).  
      - Nash: If \(d_2\) increases, \(u_1\) may decrease (e.g., to 50).

  ---

  ### **Assumptions and Edge Cases**
  1. **Disagreement Point**:  
     The rule **ignores the disagreement point** entirely. It relies solely on the ideal payoffs \(m_i\), which are defined as the maximum achievable *if the other player is fully cooperative* (regardless of their own payoff).  
     - *Consequence*: No role for outside options or fallback positions.

  2. **Feasible Set Requirements**:  
     - **Well-defined \(m_i\)**: Requires that \(m_i\) can be computed (i.e., the set allows one player to achieve their max while the other gets minimal payoffs, often 0).  
     - **Linearity**: The rule is straightforward when utilities are linear and transferable (e.g., splitting money). For non-linear or non-convex sets:  
       - **Problem**: The point \(\left( k m_1, k m_2 \right)\) may lie **outside the feasible set** or **off the Pareto frontier**.  
       - **Example**:  
         - Feasible set: \(\{(u_1, u_2) \mid u_1 + 2u_2 \leq 100, u_i \geq 0\}\).  
         - \(m_1 = 100\) (when \(u_2=0\)), \(m_2 = 50\) (when \(u_1=0\)).  
         - For \(T = 90\), the rule gives \(u_1 = 60\), \(u_2 = 30\).  
         - But \(60 + 2 \cdot 30 = 120 > 100\) → **infeasible!**  
       - **Resolution**: Scale \(k\) down until feasible, but this may violate Pareto efficiency.

  3. **Efficiency**:  
     The rule **may not be Pareto efficient** if the feasible set is not radially symmetric around \((0,0)\). Efficiency holds only if the line from \((0,0)\) to \((m_1, m_2)\) is on the Pareto frontier (e.g., in linear bargaining problems).

  ---

  ### **Multi-Party Extension**
  For \(n\) players with ideal payoffs \(m_1, \dots, m_n\) and total surplus \(T\):  
  \[
  u_i = \frac{m_i}{\sum_{j=1}^n m_j} \cdot T.
  \]  
  - **Example**: Three players with \(m_1=100, m_2=100, m_3=50\) and \(T=125\):  
    \[
    u_1 = \frac{100}{250} \cdot 125 = 50, \quad u_2 = 50, \quad u_3 = 25.
    \]  
  - **Challenges**:  
    - **Feasibility**: Same issues as in two-party cases (may violate constraints).  
    - **Interpretation**: Each player's "best case" assumes others get minimal payoffs, which may be unrealistic in multi-party negotiations (e.g., coalitions could form).  
    - **No established solution**: Unlike the Kalai-Smorodinsky solution (which generalizes to \(n\) players), this rule lacks axiomatic foundations for \(n>2\).

  ---

  ### **Comparison to Kalai-Smorodinsky (KS)**
  - **Similarity**: Both use ideal points \((m_1, m_2)\).  
  - **Difference**: KS incorporates a disagreement point \((d_1, d_2)\) and requires:  
    \[
    \frac{u_1 - d_1}{m_1 - d_1} = \frac{u_2 - d_2}{m_2 - d_2}.
    \]  
  - **Key distinction**:  
    - If \(d_i = 0\) for all \(i\), KS reduces to the Proportional Rule.  
    - If \(d_i > 0\), KS adjusts for outside options; the Proportional Rule does not.

  ---

  ### **Summary**
  - **Name**: Proportional Allocation Rule (or Ideal Point Proportional Rule).  
  - **When it works**: Linear utilities, transferable surplus, no binding constraints.  
  - **Limitations**:  
    - Ignores disagreement points and outside options.  
    - May yield infeasible or inefficient outcomes in non-linear/non-convex sets.  
    - Multi-party extension is arithmetic but lacks strategic foundations.  
  - **Practical use**: Best suited for simple splits (e.g., dividing money with asymmetric claims), not complex bargaining with external options or non-linear utilities.

  For realistic negotiations involving disagreement points, the Nash or Kalai-Smorodinsky solutions are more robust. The Proportional Rule’s simplicity is its strength in symmetric, zero-disagreement contexts but a liability elsewhere.
