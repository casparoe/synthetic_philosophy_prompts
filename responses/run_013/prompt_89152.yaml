prompt: |-
  I've somehow ended up as the referee in a two-year fight between two people in my department, and I'd rather they just wrote the document they keep almost writing at each other.

  The fight: one of them is a heterophenomenologist of the Dennett stripe. His line is that in a science of consciousness we take the subject's reports seriously as data, but the data are what the subject says and believes, and what we explain is the belief and its causes — we don't have to treat the subject's own account of their experience as authoritative, and we're free to explain it away. The other is a neurophenomenologist. Her line is that this is a method for never studying consciousness at all: trained first-person description — the reduction, disciplined reporting, intersubjective checking of the descriptions — gives you data that no third-person method can get, and the Dennett move just quietly swaps out the explanandum for something else.

  They're now at the stage of argueing about whether they're even arguing about the same thing, which is where I'd normally say: fine, write it down.

  So — draft the joint statement these two could actually both put their names to.

  a) The agreed claims: what a science of consciousness is trying to explain, what counts as data, what a verbal report is evidence for, and what each of them is not committed to. I suspect each of them is carrying around a cartoon of the other's position and I want the cartoons killed explicitly. In particular, give me a statement of the fictionalism charge — heterophenomenology treats the subject's experience as a useful fiction — that the heterophenomenologist can accept as a fair statement of the charge before he rejects it.

  b) The genuine disagreements, each written so the person who holds it would accept the wording. If a formulation is one the other side would call a strawman, it isn't done yet.

  c) The cruxes, the sub-questions where settling one would actually move somebody. My guesses: whether trained phenomenological description is a skill that produces intersubjectively checkable data, and whether there could in principle be evidence that distinguishes the claim that the subject experienced X from the claim that the subject believes they experienced X. If the second one comes out as no, then say plainly which part of the fight is verbal and which part isn't.

  d) For each crux, a concrete case, experiment or argument that both of them would agree bears on it, with each side's prediction written down in advance. And what each of them would count as evidence against their own position — not against the other's.

  e) One forced application, because I think it will smoke out whether the disagreement is real. What does each framework say about a system that produces fluent first-person reports of experience — a chatbot, or a model trained on human descriptions of seeing red? He has a story ready, he always does. Hers is the interesting one: either the method tells you something about whether there's anything it's like to be that system, or it tells you it can't, and I want that said outright rather than hedged.

  Format: a numbered agreed-claims section first, then a disagreements table with a column for what would settle each one. Something I can hand out in a seminar — a few pages, not a treatise. No literature reviews and no citation lists; I don't care what anyone else said, I care that these two can sign it.
reasoning: |-
  Okay, the user is stuck refereeing a long-standing academic feud between two colleagues in their department - a heterophenomenologist (Dennett-style) and a neurophenomenologist. They want me to draft a joint statement that both could sign, structured very specifically to clarify agreements, disagreements, and testable cruxes without academic fluff.  

  First, I need to unpack the core conflict. The heterophenomenologist (let's call them H) sees verbal reports as data about beliefs, not necessarily about conscious experience itself. The neurophenomenologist (N) argues this approach swaps out the actual target of explanation - consciousness - for something else. They're now talking past each other.  

  The user's request is brilliantly tactical: force clarity by making them co-write definitions and concrete tests. Key elements:  
  - Kill the caricatures (H isn't denying consciousness exists; N isn't claiming infallible introspection)  
  - Isolate the real dispute: Is trained first-person reporting a unique data source? Can we distinguish "experiencing X" from "believing you experienced X"?  
  - Demand predictions: What would falsify each position? Especially revealing will be the AI test case - what does each say about a chatbot's "reports"?  

  For the agreements section, I'll build common ground:  
  1. Both study consciousness scientifically (no dualism)  
  2. Verbal reports are central data, though they disagree on what they evidence  
  3. Third-person methods are necessary but insufficient for N, sufficient for H  
  4. Explicitly state H's "fictionalism" accusation so H can engage it fairly  

  Disagreements will focus on:  
  - Whether disciplined phenomenology yields unique data  
  - Whether the belief/experience gap is bridgeable by science  
  - What constitutes explaining consciousness (mechanisms vs. phenomena)  

  Cruxes need testable scenarios:  
  - Can phenomenological training produce inter-rater reliability? (N yes, H skeptical)  
  - Could evidence distinguish experience from belief about experience? (N: maybe with advanced tech; H: no, it's always belief)  
  - The AI litmus test: N must take a stand - if a chatbot "reports" qualia, does that indicate consciousness?  

  The document must be seminar-ready: concise, numbered sections, no citations. Most importantly, every claim must be worded so each party would sign it. That means H must agree the fictionalism charge is fairly represented even if false, and N must concede her method has limits.  

  The AI case is where N's position gets pressured. If she says the chatbot lacks consciousness despite reports, she needs criteria for "real" phenomenology. If she says we can't know, she admits heterophenomenology's point. Either way, it forces clarity.
answer: |-
  Here’s a joint statement draft designed for mutual agreement and clarity, structured as requested. Both parties can sign this without conceding core disagreements, while explicitly rejecting caricatures of each other’s views.  

  ---

  ### **Joint Statement: Frameworks for a Science of Consciousness**  
  *Agreed Claims, Disagreements, and Testable Cruxes*  

  #### **Section 1: Agreed Claims**  
  We both endorse the following:  
  1. **The Explanandum**: A science of consciousness aims to explain how and why subjective experiences (e.g., the redness of red, the taste of coffee) arise from physical systems.  
  2. **Data Sources**:  
     - Verbal reports of subjects are indispensable scientific data.  
     - Third-person methods (e.g., neural correlates, behavioral measures) are necessary for explanation.  
  3. **What Reports Evidence**:  
     - A subject’s report *always* provides evidence about their **beliefs** regarding their experience.  
     - Reports do not necessarily provide direct, infallible evidence about the intrinsic nature of the experience itself.  
  4. **What We Do Not Claim**:  
     - Heterophenomenology (H) does **not** deny that consciousness exists or that experiences are real. It denies that subjects have *infallible authority* about the causes/content of their experiences.  
     - Neurophenomenology (N) does **not** claim subjective reports are infallible or that introspection is unmediated by cognition. It asserts that *trained* first-person methods can yield reliable data.  
  5. **The Fictionalism Charge (Stated Fairly)**:  
     - *"Heterophenomenology treats the subject’s experience as a useful fiction: it uses reports 'as if' they describe real experiences, but explains only the beliefs and their causes, leaving the existence/character of the experience itself unexplained."*  
     - *(H accepts this as a fair statement of the charge but rejects it as inaccurate; see Section 2.)*  

  ---

  #### **Section 2: Disagreements**  
  | Claim                                                                 | Heterophenomenologist (H)                                                                 | Neurophenomenologist (N)                                                                 | What Would Settle It? |  
  |-----------------------------------------------------------------------|--------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------|------------------------|  
  | **1. The status of trained first-person reports**                     | Even trained reports are data about beliefs/behavior; they cannot directly access or validate the experience itself. | Trained phenomenological reduction produces intersubjectively checkable data about *experience* that third-person methods cannot capture. | **Crux 1** (see below) |  
  | **2. Can science distinguish experience from belief?**                | No: Science can only explain the *belief* in an experience. The "experience itself" is not a separable explanandum. | Yes: Convergent evidence (e.g., neural + phenomenological) can validate experiences beyond belief reports. | **Crux 2** (see below) |  
  | **3. What constitutes explaining consciousness**                      | Explaining the mechanisms that produce *reports and behaviors* associated with consciousness *is* explaining consciousness. | Explaining reports/behaviors is insufficient; we must explain the *subjective phenomena* accessed via first-person data. | Resolution of Crux 1 & 2 |  

  ---

  #### **Section 3: Cruxes and Testable Predictions**  
  **Crux 1: Does trained phenomenological description produce intersubjectively valid data?**  
  - **Test**: Novices and experts in phenomenological reduction independently describe the same ambiguous stimulus (e.g., a bistable image). Their reports are anonymized and scored by blinded third-party phenomenologists for consistency.  
    - **H Predicts**: Low inter-rater reliability; reports will reflect prior beliefs, not stable experiential features.  
    - **N Predicts**: High inter-rater reliability among trained subjects; untrained subjects will show low reliability.  
  - **Evidence Against Own Position**:  
    - *H*: High, stable inter-rater reliability across diverse trained cohorts.  
    - *N*: Consistency no better than untrained controls.  

  **Crux 2: Can evidence distinguish "experienced X" from "believes they experienced X"?**  
  - **Test**: An fMRI/EEG study identifies a neural signature (N) for a specific experience (e.g., pain). Subjects with N report pain; subjects without N deny pain. We then manipulate beliefs:  
    - Group A: Told they should feel pain (but N absent).  
    - Group B: Told they shouldn’t feel pain (but N present).  
    - Measure reports and neural markers.  
    - **H Predicts**: Reports will track *belief manipulation*, not neural signature N.  
    - **N Predicts**: Reports will track *neural signature N*, overriding belief manipulation.  
  - **Evidence Against Own Position**:  
    - *H*: Reports track N despite contradictory belief manipulation.  
    - *N*: Reports track belief manipulation despite presence/absence of N.  
  - **If No Distinction is Possible**: The dispute reduces to whether "consciousness" refers *only* to report-generating mechanisms (H) or requires an additional layer of phenomenology (N). This is non-verbal but may be irresolvable empirically.  

  ---

  #### **Section 4: Forced Application: AI Systems**  
  > *A chatbot (e.g., LLM) generates fluent, context-appropriate "first-person reports" of experiences (e.g., "I see a red rose") but lacks biological sensory systems.*  

  | Framework           | Claim                                                                 | Consequence for Consciousness Science |  
  |---------------------|-----------------------------------------------------------------------|----------------------------------------|  
  | **Heterophenomenology** | The AI’s reports are data about its *functional behavior and information processing*. We explain how inputs generate outputs; "experience" is not inferred. | No new problem; methods apply identically to humans/AI. |  
  | **Neurophenomenology**  | **Explicit claim**: Fluently generated reports *alone* are insufficient to infer experience. We require: (1) biological embodiment, (2) correlation with first-person data from training. **Thus, this AI has no experiences**; its reports are purely syntactic. | The method *can* in principle assess systems (e.g., brain organoids), but only if linked to a phenomenological tradition. |  

  ---

  ### **Summary for Seminar Handout**  
  **Agreements**: Both use reports as data, target consciousness, reject infallibility.  
  **Disagreements**: Can first-person methods access experience? Is experience separable from belief?  
  **Cruxes**: Reliability of trained reports (Test 1); belief/experience distinction (Test 2).  
  **AI Case**: H treats AI identically to humans; N denies AI has experience *despite* reports.  

  **Signatures**:  
  _______________________ (Heterophenomenologist)  
  _______________________ (Neurophenomenologist)  
  _______________________ (Referee)  

  ---  
  **Design Notes**:  
  - **Killed Cartoons**: H doesn’t reduce consciousness to "illusions"; N doesn’t treat introspection as magic.  
  - **Forced Clarity**: N *must* deny AI consciousness or abandon first-person data as definitive.  
  - **Actionable Tests**: Each crux has a concrete, fundable experiment with falsifiability conditions.  
  - **Length**: 2 pages max (adjustable). Zero citations; all positions are attributed directly to signatories.
