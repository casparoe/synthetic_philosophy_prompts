prompt: |-
  Hey — I've been going down a rabbit whole on laws of nature ever since someone in a group chat described laws as the universe's "source code": the program that's actually running everything and making it do what it does. I'm fairly sure that's the anti-Humean / "governing" picture, and it's intuitive enough, but I've never really understood how the Humean best-system account is meant to be an alternative to it rather than just a change of subject. The bit I keep getting stuck on is the holism. On the best-system view a regularity only counts as a law in virtue of how it slots into the single simplest-and-strongest summary of the entire mosaic of particular facts, which seems to mean that flipping one far-away electron could turn a law into a coincidence (or the reverse) even though no local pattern changed — lawhood ends up being a fact about the whole universe at once. The governing view, by contrast, looks more local: this regularity is backed by a necessitation relation, full stop, and it doesn't care what else happens to be true. I've also heard the simplicity/strength trade-off is somehow relative to the vocabulary you describe the mosaic in, which sounds like it ought to be a reductio.

  Could you explain the contrast properly — why the Humean is willing to live with the holism, why the anti-Humean thinks the governing relation earns it's metaphysical keep, and what's genuinely at stake between them? In particular I'd like to get straight the "explanatory" objection (roughly: laws are supposed to explain their instances, and bare regularities supposedly can't) and whether the Humean has a decent reply or just has to bite a bullet, plus whether the vocabulary-relativity worry is fatal or merely uncomfortable. Assume I'm fine with the basics of the Mill–Ramsey–Lewis setup and don't need the 101. And could you write the answer in British English, please — it's for a reading group that's fussy about that sort of thing. Cheers!
