  My friend, a Mīmāṃsā sympathizer, and I spent three hours last night on svataḥ-prāmāṇya against parataḥ-prāmāṇya. She holds that a cognition's validity belongs to it intrinsically and is grasped in the very cognition that has it, so no further cognition is needed to know that the cognition is valid, while invalidity is discovered only when a defect is noticed. I hold the Nyāya line: validity is produced by the special excellences in the causal conditions, and it is known only through a subsequent cognition of those conditions, so a cognition's mere arising does not make it valid. We kept sliding between the question of how validity is produced and the question of how it is known, and she kept charging my side with a regress while I kept charging hers with making error inexplicable.

  Write the joint statement we should have signed. Include a numbered section of claims both of us can accept, about what a cognition is and what a pramāṇa is meant to deliver; the precise formulation of each disagreement that remains, worded so that each side would accept the wording of its own position; the cruxes, each phrased as a sub-question whose settlement would move at least one side; and, for each crux, a case or argument both of us would agree bears on it, with each side's prediction about it recorded in advance. Make explicit whether the production/knowledge distinction dissolves part of our dispute, and say which part, if any, is merely verbal. Argue from the positions themselves rather than from texts or scholarly attributions. Close with the points in your reconstruction you are least confident about, and what argument or consideration would change your mind about them.
