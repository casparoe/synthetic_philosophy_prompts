answer: |-
  ## Joint Statement on Svataḥ-prāmāṇya vs. Parataḥ-prāmāṇya: A Reconstruction

  **Preamble:** We recognize that our debate intertwined ontological questions (how validity is *produced*) with epistemological questions (how validity is *known*). This joint statement aims to isolate these axes, identify common ground, articulate precise disagreements, define cruxes, and propose tests. We argue from the internal logic of our positions, not textual authority.

  ### I. Agreed Foundational Claims (Ontology & Epistemology of Pramāṇa)
  Both Nyāya (N) and Mīmāṃsā (M) accept the following as foundational:
  1.  **Cognition (jñāna):** A cognition is an episodic, intentional mental state disclosing an object (*viṣayaprakāśakatva*).
  2.  **Truth (yāthārthya/pramātva):** The property a cognition possesses when it corresponds to the actual state of affairs (*vastusārūpya* or *tadvati tatprakārakatva*). This is the *telos* of a *pramāṇa*.
  3.  **Pramāṇa:** A specific causal process (e.g., perception, inference, testimony) that reliably generates *true* cognitions (pramā) under normal conditions (*sāmānyatas*).
  4.  **Error (apramā/bhrānti):** Cognitions exist that fail to correspond to reality.
  5.  **Defects (doṣa):** Specific causal factors (e.g., defective sense organ, fallacious reasoning, unreliable speaker) can interfere with a *pramāṇa* process, leading to error.
  6.  **Knowledge of Validity is Possible:** It *is* possible for a subject to know whether a given cognition is valid (pramā) or invalid (apramā).

  ### II. Precise Formulations of Disagreement

  We disagree on the nature of validity and its knowability:

  *   **A. On the Production & Nature of Validity (Ontological Axis):**
      *   **(M) Mīmāṃsā Position:** *Validity (prāmāṇya) is intrinsic (svataḥ) to a cognition as generated.* A cognition, arising from a *pramāṇa* (which is defined by its capacity to generate true cognitions), possesses validity inherently by virtue of its very arising, unless and until it is *subsequently* invalidated by the discovery of a defect (*doṣa*). Validity is the default state.
      *   **(N) Nyāya Position:** *Validity (prāmāṇya) is extrinsic (parataḥ) to a cognition as generated.* Validity is not inherent in the cognition itself but is a property *bestowed upon it* by the presence of specific "excellences" (*guṇa*) within the causal complex (*kāraṇasāmagrī*) that generated it (e.g., a properly functioning sense organ, a valid inferential mark). Its absence is caused by defects (*doṣa*). A cognition's mere arising does not guarantee its validity.

  *   **B. On the Knowledge of Validity (Epistemological Axis):**
      *   **(M) Mīmāṃsā Position:** *The validity of a cognition is self-manifesting (svataḥ) and grasped intrinsically (sākṣāt) within the very cognition that possesses it.* No *separate* cognitive act is required to apprehend the validity of a true cognition; its truth is revealed along with its content. Invalidity is only known extrinsically (*parataḥ*), via a subsequent cognition revealing a defect.
      *   **(N) Nyāya Position:** *The validity of a cognition is known only extrinsically (parataḥ), via a subsequent cognitive act.* This subsequent cognition must apprehend either (a) the presence of the "excellences" (*guṇa*) in the causal conditions that produced the original cognition, or (b) the cognition's successful practical fruition (*phalāpti*), or (c) the absence of known defects (*doṣa*). The original cognition does not manifest its own validity.

  ### III. Cruxes & Test Cases

  The Production/Knowledge distinction clarifies the dispute but does *not* dissolve it. The ontological claim (A) fundamentally shapes the epistemological claim (B). The key cruxes are:

  1.  **Crux 1: The Default Status & Burden of Proof**
      *   *Question:* Does a cognition possess validity *prima facie* upon its arising, requiring invalidation only if a defect is discovered (M), or is it validity-neutral upon arising, requiring validation through extrinsic evidence (N)?
      *   *Shared Test Case:* Consider a clear, distinct perceptual cognition (e.g., "There is a red pot before me") arising under seemingly normal conditions, with *no immediately apparent defect and no immediately available extrinsic test* (e.g., cannot walk closer yet, no other witness).
          *   **(M) Prediction:** The subject is immediately *justified* in accepting the cognition as valid (prima facie knowledge). Validity is intrinsic and known intrinsically until/unless a defect is later discovered.
          *   **(N) Prediction:** The subject *lacks justification* for accepting the cognition as valid at this moment. The cognition is merely presented; its validity is unknown and requires extrinsic confirmation (e.g., later verification by touch, consistency with other cognitions).
      *   *Settlement Impact:* If (M) is correct, foundational perceptual knowledge is direct and unmediated. If (N) is correct, all knowledge requires inferential/verificatory steps, potentially leading to regress concerns raised by M.

  2.  **Crux 2: The Explicability of Error without Defect-Discovery**
      *   *Question:* Can a cognition be erroneous *even if no specific defect is ever discovered* by the cognizer?
      *   *Shared Test Case:* Consider an erroneous inference accepted as valid by a novice logician due to a subtle flaw they cannot detect (e.g., a complex case of the fallacy of the undistributed middle). They never discover the specific logical defect, though the conclusion is false.
          *   **(M) Prediction:** Problematic. If validity is intrinsic upon arising and only invalidated by discovering a defect, this error *must* be invalidated if known to be false. Yet, the cognizer *knows* it's false (perhaps via irrefutable testimony or direct perception contradicting the conclusion) but *cannot identify the specific defect* causing the invalidity. Mīmāṃsā must explain how invalidity is known here without defect-discovery.
          *   **(N) Prediction:** Unproblematic. The cognition was invalid from the start due to a defect in the inferential grounds (the missing excellence/distribution). Knowing it's false (e.g., via contradiction) *is* knowing its invalidity extrinsically, even without pinpointing the exact logical flaw. The absence of defect-discovery doesn't negate the presence of the defect causing extrinsic invalidity.
      *   *Settlement Impact:* If such cases are common or possible, (M) struggles to explain how invalidity is known without defect-discovery, challenging its intrinsic validity/knowledge thesis. (N) handles this via extrinsic determination/knowledge.

  3.  **Crux 3: The Regress/Infallibility Dilemma**
      *   *Question:* Does requiring a subsequent cognition to know validity inevitably lead to an infinite regress (N's problem), or does granting intrinsic knowledge of validity render error inexplicable except through later extrinsic checks, potentially undermining the initial infallibility claim (M's problem)?
      *   *Shared Argument Frame:*
          *   **(N's Charge of Regress):** If every cognition C1 requires a subsequent cognition C2 to know C1 is valid, then C2 requires C3 to know C2 is valid, ad infinitum. Genuine knowledge (*pramā*) becomes impossible.
          *   **(M's Charge of Inexplicable Error):** If every cognition intrinsically manifests its validity, how can error occur *at all* at the moment of cognition? Why isn't the defect *immediately* manifest if it vitiates the intrinsic validity?
      *   *Settlement Impact:* This is the core impasse. (N) must show its extrinsic knowledge doesn't require *infinite* validation chains (e.g., appeal to coherence, practical success, or foundational extrinsic checks like perception of causal excellences). (M) must show how intrinsic validity is compatible with error being possible *at the moment of cognition* without being immediately known (e.g., defect vitiates production but not the *apparent* intrinsic manifestation until revealed later).

  ### IV. Verbal Disagreement?
  There is *no purely verbal disagreement*. The dispute is substantive concerning the ontological status of validity and the structure of epistemic justification. While terms like "validity" (prāmāṇya) are shared, the conceptions – inherent default state requiring defeasance (M) vs. extrinsically conferred property requiring verification (N) – are fundamentally different and lead to distinct epistemic practices and explanations of error.

  ### V. Points of Uncertainty in this Reconstruction

  1.  **Mīmāṃsā on "Arising from Pramāṇa":** Is my characterization of Mīmāṃsā's "cognition arising from a *pramāṇa*" as possessing intrinsic validity sufficiently precise? Does Mīmāṃsā have a robust independent criterion for identifying a process as a *pramāṇa* apart from its tendency to produce valid cognitions? A strong argument showing Mīmāṃsā *does* rely on prior extrinsic identification of *pramāṇas* (e.g., the Vedas) would challenge the purity of intrinsic validity and move me towards seeing more common ground with Nyāya.
  2.  **Nyāya's "Excellences" (Guṇa):** Are Nyāya's *guṇas* sufficiently distinguishable from the mere *absence* of *doṣas*? Could Mīmāṃsā argue that identifying *guṇas* itself requires prior valid cognitions, risking circularity or regress? A compelling Mīmāṃsā argument showing that Nyāya's *guṇas* are either (a) identifiable only via intrinsically valid cognitions or (b) reducible to the absence of *doṣas*, would significantly weaken Nyāya's extrinsic production claim.
  3.  **The Scope of "Intrinsic Knowledge" (M):** Is my interpretation of Mīmāṃsā's intrinsic knowledge as granting *justification* (prima facie) in Crux 1 accurate? A sophisticated Mīmāṃsā argument that intrinsic manifestation provides only the *possibility* of validity or a non-doxastic awareness thereof, requiring further (perhaps intrinsic) confirmation for full justification, would necessitate revising Crux 1 and the epistemic implications.

  **Conclusion:** This statement clarifies that our core disagreement lies in the intrinsic vs. extrinsic nature of validity's *production* and its *knowability*. Resolving the cruxes concerning the default status of cognitions, the knowability of error without defect-discovery, and the regress/inexplicability dilemma is essential for progress. We commit to examining future cognitions and arguments through the lens of these shared test cases and defined cruxes.
