  I'm in this seminar that's half economics, half philosophy — it's all about common knowledge and rational choice — and I'd say I've understood a solid 40% of it. There's this theorem we did, I want to say it's Aumann's, that says two agents who are both Bayesians, who start from the same prior, and whose beliefs are common knowledge can never agree to disagree: it'll be common knowledge that they assign the same probability to whatever it is. Fine.

  So here's what's been bugging me. Over the holidays my brother and I got into a long, dumb arguement about politics, and I wanted to deploy the theorem to say: look, we're both roughly rational, we're looking at basically the same facts, so at least one of us has to be either irrational or disonest, because rational people with the same information can't just keep disagreeing like this. He says I'm mangling it and that persistent disagreement between perfectly rational people is completely normal and even expected. I really feel like the theorem is on my side though — unless there's some condition I'm dropping? Also, while we're at it, I've never been able to feel the difference between common knowledge and just everyone knowing — my professor keeps insisting it's a huge deal but I don't see what it buys us.

  Please don't give me the "well, it's subtle, both of you have a point" thing. Tell me straight: is the theorem actually saying what I think it says, or have I smuggled in an assumption that isn't there? And who's right about the argument with my brother? Take a real position and defend it — if I'm wrong, I want to see exactly where the misreading is, not a survey of the literature.
