  #### **Question 1: Does cohort membership *explain* individual attitudes (e.g., "Being a Millennial causes distrust of institutions"), or only *correlate* with them?**  
  *(Splits causal vs. descriptive accounts of cohort differences)*  

  - **If EXPLANATORY (causal):**  
    - **Question 2: Is causation driven by a *shared formative experience* (e.g., living through 9/11), or by the cohort's *position relative to others* (e.g., entering the workforce during a recession)?**  
      *(Splits intrinsic vs. relational accounts of cohort properties)*  
      - **If SHARED EXPERIENCE:**  
        - **Leaf 1: Robust Realism**  
          Generations are real social kinds, individuated by a common cause (e.g., a war) that imprints members.  
          *Reference-class answer:* Boundaries align with the formative event's duration (e.g., 1946–1964 for post-war optimism), not arbitrary windows.  
          *Awkward commitment:* Must defend why disparate individuals (e.g., rich/poor) exposed to the same event share identical "imprints."  
      - **If RELATIVE POSITION:**  
        - **Leaf 2: Relational Realism**  
          Generations are real but defined relationally (e.g., "post-Boomers" reacting to prior cohorts), not by intrinsic properties.  
          *Reference-class answer:* Boundaries emerge from historical turning points (e.g., technological shifts), with window size (~20 years) set by the pace of social change.  
          *Awkward commitment:* A generation cannot exist in isolation; it requires other cohorts to define it.  

  - **If CORRELATIVE (descriptive):**  
    - **Question 3: Do cohort patterns reflect a *real kind* (e.g., a unified category), or *only statistical distributions* of traits?**  
      *(Splits realism from anti-realism about kinds)*  
      - **If REAL KIND:**  
        - **Question 4: Does the kind depend on *labeling and looping effects* (e.g., "Gen Z" becomes real when people adopt the label), or is it mind-independent?**  
          *(Splits constructionism from non-constructionist realism)*  
          - **If LABELING-DEPENDENT (looping):**  
            - **Leaf 3: Social-Constructionism**  
              Generations become real through collective self-identification (e.g., "Millennial" activism), sustained by feedback loops.  
              *Reference-class answer:* Boundaries are negotiated via social discourse (e.g., media, surveys), settling on ~20 years for cohort "recognizability."  
              *Awkward commitment:* Historical generations (e.g., "Silent Generation") cannot be real retroactively if labels were unused then.  
          - **If MIND-INDEPENDENT:**  
            - **Leaf 4: Deflationary Realism**  
              Generations are real kinds but reducible to statistical distributions (e.g., aggregate attitudes), not causal forces.  
              *Reference-class answer:* Windows (~20 years) optimize data utility; boundaries are arbitrary but track stable patterns.  
              *Awkward commitment:* The kind has no causal power—it cannot explain why any individual holds an attitude.  
      - **If NO REAL KIND (only statistics):**  
        - **Question 5: Is cohort talk *useful* (e.g., for prediction) despite lacking a kind, or should it be eliminated?**  
          *(Splits pragmatic retention from eliminativism/ideology)*  
          - **If USEFUL:**  
            - **Leaf 5: Nominalism**  
              Generation labels are convenient fictions for summarizing trends, with no kind behind them.  
              *Reference-class answer:* Windows (~20 years) are conventions for social analysis; boundaries are arbitrary and context-dependent.  
              *Awkward commitment:* Labels imply unity where none exists, risking reification of stereotypes.  
          - **If NOT USEFUL:**  
            - **Question 6: Is cohort talk *harmful* (e.g., as ageist rhetoric), or simply *explanatorily empty*?**  
              *(Splits ideological critique from eliminativism)*  
              - **If HARMFUL:**  
                - **Leaf 6: Ideological Critique**  
                  Generations are not real kinds; the discourse serves ageism or marketing (e.g., "Boomers are selfish").  
                  *Reference-class answer:* Boundaries are manipulated (e.g., 15–25 years) to target demographics; no principled basis.  
                  *Awkward commitment:* Must explain why cohort labels "stick" if they are purely manipulative.  
              - **If EXPLANATORILY EMPTY:**  
                - **Leaf 7: Eliminativism**  
                  Cohort differences are real but explained by age/period effects; generation kinds should be dropped from ontology.  
                  *Reference-class answer:* No window is defensible; cohorts are arbitrary slices of continuous age/time variables.  
                  *Awkward commitment:* Must explain durable cohort patterns without referencing generations.  

  ---

  #### **Unresolved Pairs & Gaps**  
  - **Robust Realism (Leaf 1) vs. Social-Constructionism (Leaf 3):** The tree cannot separate a view where formative experiences *and* looping effects jointly sustain generations. *Further question needed:* "Does the causal power of cohort membership depend on self-awareness of the label?"  
  - **Relational Realism (Leaf 2) vs. Deflationary Realism (Leaf 4):** The tree cannot distinguish a "positional but non-causal" realism. *Further question:* "Is relationality a causal force (e.g., competition between cohorts) or a static descriptor?"  
  - **Unoccupied combination: Causal + Motley Causes.** A view accepting causation but rejecting shared/relational causes (e.g., "cohort effects are real but arise from random cultural drift") is unexplored, as it lacks a unifying principle for kindhood.  

  ---

  **Tree Summary**  
  - **Leaves:** Robust Realism (1), Relational Realism (2), Social-Constructionism (3), Deflationary Realism (4), Nominalism (5), Ideological Critique (6), Eliminativism (7).  
  - **Key Omissions:** Positions combining causation and looping (unexplored) or relationality without causation (unattractive due to incoherence).  
  **Total leaves:** 7 (within 10-leaf limit).
