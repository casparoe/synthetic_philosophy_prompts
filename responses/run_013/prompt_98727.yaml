answer: |-
  ## Dissertation Prospectus: The Grain of Harm: Counterfactual Contribution Profiles and Individual Obligation in Collective Harm Cases

  **Research Question:** Are there pairs of individual acts (A1, A2) within collective harm contexts, where A1 and A2 have identical *expected marginal harm* (EMH), but possess distinct *counterfactual contribution profiles* (CCPs), such that we are obligated to perform one act (e.g., A1) and not the other (A2)?

  **The Problem and the Gap in Existing Debates:**
  The pervasive "inefficacy objection" argues that individuals lack obligations to reduce their contribution to large-scale collective harms (e.g., climate change via emissions, factory farming via consumption, election outcomes via voting) because their specific actions make no discernible difference to the overall harm. The standard debate operates within a binary framework: either an individual act *makes a difference* (typically conceptualized as crossing a threshold or causing a perceptible change) or it does not. Defenses of individual obligations then typically take one of three paths, all implicitly accepting this binary grain:
  1.  **Expected Value Consequentialism:** Argues that even if the *actual* difference is zero, the *expected* harm of the act (based on probabilities) grounds obligation. This often reduces obligation to EMH calculations.
  2.  **Threshold/Sensitivity Arguments:** Focuses on cases where the collective outcome *is* sensitive to small changes (e.g., close elections), arguing that individual acts *can* make a difference here, grounding obligation in those specific contexts. This concedes the binary view but shifts the focus to identifying sensitive thresholds.
  3.  **Collective Obligation Derivations:** Argues individuals have duties *because* they are part of a group that collectively causes harm, regardless of individual difference-making. This often sidesteps the counterfactual contribution question entirely or relies on overly broad group membership.

  **The Core Thesis:** This debate operates at the wrong analytical grain. The morally relevant feature is not a binary "difference-made" property, but the *shape* of the act's **Counterfactual Contribution Profile (CCP)** – the pattern describing how the *total harm* would differ across nearby possible worlds depending on whether the act is performed or not. I propose distinguishing four primary CCP shapes:
  1.  **Flat:** The act changes the total harm in *no* nearby counterfactual scenario (e.g., buying a lottery ticket where every ticket is sold regardless; extreme overdetermination).
  2.  **Sloped:** The act consistently changes the harm magnitude across nearby worlds, but the change is often imperceptibly small (e.g., a single carbon emission in a global system; one vote in a large, non-marginal election; one purchase in a stable meat market).
  3.  **Cliff:** The act changes the harm magnitude dramatically in specific counterfactual scenarios where a threshold is crossed (e.g., casting the decisive vote in a tied election; emitting the tonne that triggers a catastrophic feedback loop).
  4.  **Endogenous:** Whether the act makes a difference *depends constitutively* on how others respond to it or to the act-type (e.g., conspicuous non-consumption shifting social norms; principled voting inspiring turnout; pioneering green technology lowering costs). The profile itself is responsive to social context and agent commitment.

  I contend that canonical cases (e.g., eating a burger, taking a short flight, voting in a large election) are habitually misclassified as Flat (no difference made) when they are actually Sloped (small but consistent difference across scenarios). Crucially, **Flat and Sloped profiles, even when they yield identical EMH, generate distinct grounds for obligation.** Obligations may persist robustly under Sloped profiles due to the consistent causal contribution, even when imperceptible, while vanishing under genuinely Flat profiles. Endogenous profiles introduce a dynamic, responsibility-shaping element absent from static analyses.

  **Methodology (4-Month Plan):**
  1.  **Conceptual Foundation (Month 1):** Precisely define the four CCP types using possible-worlds semantics and causal modeling tools. Formalize the key distinction: Sloped profiles involve continuous, deterministic (though tiny) contribution; Flat profiles involve genuine causal irrelevance or overdetermination; Cliff profiles involve step-function discontinuities; Endogenous profiles involve reflexive dependence on social uptake. Define EMH rigorously for comparison.
  2.  **Operationalization & Testing (Month 2):** Develop the **"Scaling Test"** as the primary tool for empirically distinguishing profile types. For a given act-type (e.g., emitting 1 tonne CO2), consider counterfactual scenarios where *only* the scale of *my contribution* is varied (e.g., me emitting 0.1x, 1x, 10x, 100x the amount), holding all else fixed. Ask: Does the *total harm* change?
      *   **Flat:** No change (harm independent of *my* scale).
      *   **Sloped:** Proportional change (harm varies smoothly with *my* scale).
      *   **Cliff:** No change until a critical scale is reached, then discontinuous jump.
      *   **Endogenous:** Change depends non-linearly on scale *and* potentially triggers feedback altering the baseline harm function (e.g., my large emission shifts policy, changing the harm-per-tonne).
  3.  **Case Study Analysis (Month 3):** Apply the CCP framework and Scaling Test to canonical disputed cases:
      *   **Carbon Emission (Individual Tonne):** Argue it's Sloped, not Flat. Scaling Test shows proportional harm change (global warming is linear in cumulative forcing). Contrast with genuinely Flat cases (e.g., emitting in a world already committed to +5°C).
      *   **Meat Consumption (Single Purchase):** Argue it's Sloped (supply adjusts, but marginal impact exists via complex market signals). Contrast with Flat overdetermination (buying the last burger when thousands are thrown away daily).
      *   **Voting in Large Elections:** Argue standard cases are Sloped, not Flat. Scaling Test shows proportional impact on probability of victory/margin, even if deterministically decisive impact is near-zero. Contrast with Cliff (decisive vote) and Endogenous (voting as expressive/signaling act).
  4.  **Avoiding EMH Collapse (Months 3-4):** Systematically demonstrate why CCPs are not reducible to EMH.
      *   **Metaphysical Distinction:** Argue CCP describes the *structure of causal contribution* (how the act links to harm across possibilities), while EMH is a probabilistic *expectation* derived from that structure plus uncertainty.
      *   **Moral Significance:** Argue that the *consistency* of contribution in Sloped profiles (vs. total absence in Flat) grounds a stronger claim of responsibility, independent of the expected value magnitude. Endogenous profiles highlight how commitment *shapes* one's causal role, adding a dimension of integrity/virtue. Show how obligations derived from CCPs can diverge from those derived purely from EMH calculations (e.g., consistency demanding action even when EMH is identical to a Flat case; endogenous effects creating special duties for pioneers).

  **Why a Conceptual Taxonomy?**
  While empirical psychology studies perceptions of efficacy, and theories of collective obligation address group duties, the core issue here is **metaphysical and normative**: What is the *actual structure* of an individual's causal contribution to collective harm, and what are the normative implications of that structure? A conceptual taxonomy based on counterfactual profiles directly addresses the inefficacy objection's core claim about the *nature* of individual causal power. It provides a more nuanced vocabulary for describing responsibility in collective contexts, prior to questions of psychological limitations or collective agency.

  **Distinguishing Inefficacy and Redundancy:**
  The debate often conflates two distinct phenomena:
  *   **Inefficacy (Targeted here):** The claim that an individual act *lacks the power* to alter the outcome/harm, typically due to scale (e.g., my vote never matters in millions). This is a claim about the act's *causal potential*.
  *   **Redundancy:** The claim that an individual act *fails* to alter the outcome/harm *in the actual world*, but only because other sufficient causes are present (e.g., I vote for the winner who won by a landslide; I don't emit, but others emit enough to cause the harm anyway). This is a claim about the *actual causal history* being overdetermined.

  Redundancy scenarios typically exhibit **Flat** CCPs (in the actual world and nearby worlds, my act is irrelevant). Genuine inefficacy, as often alleged but contested here, would also imply a Flat profile. However, my argument is that many cases alleged to be inefficacy/redundancy (and thus Flat) are actually Sloped. The CCP framework clarifies this distinction: Redundancy is one *source* of a Flat profile, but Sloped profiles demonstrate the *absence* of true inefficacy/redundancy at the structural level, revealing consistent causal contribution.

  **Significance:**
  Settling this question fundamentally reshapes how we describe individual responsibility in the face of collective harm:
  1.  **Reframes the Debate:** Moves beyond the stalled binary "difference-maker" argument to a more nuanced analysis of contribution structure.
  2.  **Strengthens Grounds for Obligation:** Provides a robust, non-probabilistic justification for individual duties in pervasive Sloped cases (like climate change, consumption), even absent thresholds or perceptible impacts, based on consistent causal contribution.
  3.  **Sharpens Moral Distinctions:** Allows finer-grained discrimination between acts with superficially similar EMH but morally relevant differences in *how* they contribute (e.g., Sloped vs. genuinely Flat redundancy).
  4.  **Highlights Dynamic Agency:** The Endogenous profile underscores how individual commitment can actively reshape one's causal role and moral landscape.
  5.  **Practical Guidance:** Offers clearer conceptual tools for individuals and policymakers to assess the nature of responsibility in complex collective action problems.

  **Deliverables and Success Criteria:**
  *   **Completed Result:** A dissertation articulating the CCP framework (4 types + Scaling Test), demonstrating its application to canonical cases (carbon, meat, voting), rigorously distinguishing it from EMH, differentiating inefficacy from redundancy via CCPs, and arguing for the moral significance of CCP differences (especially Sloped vs. Flat) even under EMH equivalence.
  *   **Success:** Defined by a) the conceptual coherence and utility of the CCP taxonomy, b) compelling demonstration that canonical cases are misclassified as Flat, c) a persuasive argument that CCP differences (Sloped vs. Flat, Endogenous dynamics) carry moral weight independent of EMH, and d) a clear account of the inefficacy/redundancy distinction within the framework.
  *   **Failure:** The project fails if: a) The CCP types collapse analytically into EMH calculations under scrutiny. b) The Scaling Test proves ineffective or incoherent for distinguishing profiles. c) No compelling case can be made that Sloped profiles generate obligations distinct from genuinely Flat ones under EMH equivalence. d) The Endogenous profile cannot be meaningfully distinguished or integrated.

  **Candid Scope Assessment:**
  The most significant risk lies in **successfully preventing the collapse of CCP distinctions into sophisticated EMH reasoning.** This requires meticulous conceptual work in Stage 1 and Stage 4, demanding deep engagement with causation, counterfactuals, and value theory. **Developing and defending the Endogenous profile** is also a substantial sub-task, potentially requiring more social theory (norms, coordination, strategic interaction) than initially anticipated and risking scope creep. It is the part most likely to prove too large. A realistic approach is to develop Flat, Sloped, and Cliff profiles rigorously as the core argument, treating the Endogenous profile as a crucial but potentially more exploratory extension, clearly marking its status if full integration proves too ambitious within the four-month development window. Focusing the case studies primarily on demonstrating the Sloped nature of canonical cases (vs. Flat) and the Sloped/Flat moral distinction under EMH equivalence is the essential core for feasibility.
