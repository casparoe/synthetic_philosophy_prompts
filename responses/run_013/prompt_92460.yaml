prompt: |-
  I'm a grad student in a cognitive science program who ended up cross-registered in a philosophy of science seminar, and I keep running into something I don't have a word for and that nobody in the seminar treats as one phenomenon. Here is the pattern. When someone lays out a case to make a point — a sealed lab with a demon sorting molecules, a person who wakes up with another person's memories intact, a jury asked what a reasonable bystander would have done — the case is never described all the way down. It's specified just far enough to make one outcome feel obviously correct, and everything else is left blank, and the audience silently fills the blanks with whatever they already believe. The trick is what happens next: if you ask what exactly fills the blanks, the person who was persuaded either says "that part is just obvious" or supplies some further claim that quietly does all the work the case was supposed to be doing. And when somebody actually tries to spell the case out completely — to say how the demon knows which molecules are fast, or what the amnesiac's dispositions are, or which facts the bystander had — the intuition either turns contentious or flips outright, and the whole exercise starts to look like a very elaborate way of restating the conclusion it was meant to establish.

  What bothers me is that these cases are advertised as producing knowledge we didn't have before, and I can see the same move in physics, in ethics, and in law. But if the knowledge was smuggled in through the parts of the case that were never stated, then nothing new was learned — the case just rearranged what the audience was already carrying and made them feel it as a discovery. So I'm asking whether this specific thing has a name. I don't mean cases of this kind in general, and I don't want a list of famous ones. I want to know whether the dependence of a case's verdict on unstated background knowledge that the audience supplies has a recognized name and a place in some literature, and if it doesn't, I'd like you to name it and define it. I also want the boundaries drawn, because I suspect it's not the same as the ordinary logical point that an argument can have hidden premises, nor the psychological point that different people have different intuitions, nor the trivial point that any hypothetical leaves something unspecified. Tell me which nearby ideas it is closest to, whether the described thing is one of them or something distinct, where it stops applying, and what a couple of borderline cases would look like. I tried a few search terms and everything I found was either too broad to be useful or about something else. Please answer in American English.
reasoning: |-
  Okay, let me tackle this user's query. They're a grad student in cognitive science taking a philosophy seminar and noticing a pattern in thought experiments. The key issue is how these cases rely on unstated background assumptions that the audience fills in, leading to a false sense of discovery. The user wants to know if this specific phenomenon has a name, and if not, to define it clearly, distinguishing it from related concepts.

  First, I recall that thought experiments often involve idealized scenarios. The user points out that when details are omitted, people insert their own beliefs, making the conclusion seem obvious. But when questioned, those assumptions either seem trivial or do the heavy lifting. If details are specified, the intuition might change. The user wants this mechanism named and bounded.

  I consider related concepts. The closest might be "dialectical vulnerability" from Rescher, but it's not widely used. "Intuition laundering" from Dennett is catchy but pejorative. "Implicit domain restriction" is a logic term but not quite right. Since no perfect term exists, I think coining a new one makes sense. "Implicit Scaffolding" comes to mind because it captures the supportive role of unstated assumptions that structure the thought experiment.

  Next, differentiating from nearby ideas. Hidden premises in arguments are logical gaps, but here it's about cognitive filling-in during hypotheticals. Psychological intuition variance is about differing judgments, whereas this is about the structure of the case itself. Under-specification in hypotheticals is trivial, but the problem here is the persuasive reliance on background beliefs. The key is the epistemic illusion—feeling like new knowledge emerges when it's actually recycled.

  Boundaries matter. The phenomenon applies only when the unstated elements are necessary for the intuition, and when specifying them alters or nullifies the conclusion. Borderline cases might include scenarios where filling details doesn't change the outcome, or where the audience shares explicit background knowledge.

  I also consider the user's deeper needs. As a cognitive scientist in a philosophy context, they might seek interdisciplinary tools to critique methodologies. They could be frustrated with unchallenged assumptions in seminars and want to articulate this gap. Naming the phenomenon empowers them to address it in academic discourse.

  Finally, structuring the response: define the term, differentiate it, provide examples, and explain boundaries. Ensure clarity by avoiding jargon where possible, linking to established concepts, and validating the user's observation as a recognized issue.
answer: |-
  Based on your precise description, this phenomenon **does not have a single, universally recognized, dedicated term** in the mainstream philosophy of science, epistemology, or cognitive science literature. However, it *is* a recognized and critically discussed issue, often approached from several angles. The closest existing concepts are either too narrow or too broad, but we can synthesize and define it clearly.

  Here's a breakdown:

  1.  **The Core Phenomenon (Defined & Named):**
      *   **Proposed Name: Implicit Scaffolding**
      *   **Definition:** The dependence of the intuitive force or perceived "obviousness" of a hypothetical case (thought experiment, intuition pump, vignette, etc.) on unstated background assumptions, knowledge, or conceptual frameworks that the audience is tacitly expected to supply, where:
          *   (a) The case is intentionally under-specified precisely *to* leverage this tacit filling-in.
          *   (b) The supplied content is non-trivial and essential for generating the intended intuitive judgment.
          *   (c) Making this implicit scaffolding explicit either renders the judgment contentious, reverses it, or reveals that the scaffolding itself is doing the argumentative work the case was supposed to perform.
          *   (d) This creates an *epistemic illusion*: the judgment feels like a discovery generated by the case itself, rather than recognition of pre-existing beliefs triggered by the case's framing.

  2.  **Distinguishing "Implicit Scaffolding" from Nearby Ideas:**
      *   **Hidden Premises (Logic):** This *is* related, but the key difference is **scope and function**. A hidden premise is a missing logical link *within* a deductive argument. "Implicit Scaffolding" applies specifically to the **under-specified content of hypothetical scenarios** used to evoke intuitions. It's about the *descriptive gaps* in the *narrative setup*, not just missing propositions in an inference chain. The scaffolding often involves complex background theories, conceptual interpretations, or modal intuitions about possibility/causation that aren't easily reducible to a single premise.
      *   **Intuition Variance (Psychology):** This notes that different people have different intuitions. "Implicit Scaffolding" explains *why* that variance happens *in these specific cases*: because different audiences fill the under-specified gaps with different background assumptions. It focuses on the **structural feature of the case** (its intentional under-specification) that *invites and relies upon* this variance, rather than the variance itself.
      *   **Under-Specification of Hypotheticals (Trivial Point):** Yes, all hypotheticals leave things out. The critical point is when this under-specification is **functional and necessary for the persuasive effect**. It's not just that details are missing; it's that **filling them *in a specific way* is *required* for the intended intuition to arise, yet that specific way is never stated and often contentious.** The "trivial point" is about incompleteness; "Implicit Scaffolding" is about *exploiting* that incompleteness rhetorically and epistemically.
      *   **Begging the Question (Petitio Principii):** This is accusing an argument of assuming its conclusion. "Implicit Scaffolding" *can* involve question-begging, but it's broader and more subtle. The scaffolding doesn't always *directly* state the conclusion; it often supplies crucial *supporting* assumptions or interpretations that make the conclusion *seem* inevitable within the framed scenario. The case feels like independent evidence, but its force derives entirely from smuggled-in background commitments. It's a mechanism *for* disguised circularity or presumption.
      *   **Intuition Laundering (Dennett):** Daniel Dennett coined this somewhat pejorative term for using thought experiments to "launder" controversial assumptions into seemingly pristine intuitions. This is *very close* to your described phenomenon. "Implicit Scaffolding" is a more neutral, descriptive term for the *mechanism* Dennett criticizes – the *how* of the laundering. It identifies the specific structural feature (the under-specification requiring tacit filling) that enables the laundering.
      *   **Dialectical Vulnerability (Rescher):** Nicholas Rescher discussed how philosophical positions can be vulnerable if they rely on premises an opponent doesn't share. "Implicit Scaffolding" makes thought experiments dialectically vulnerable *by design* because their force depends on unshared, unstated background.

  3.  **Boundaries & Borderline Cases:**
      *   **Where it Stops Applying:**
          *   When the under-specified details are genuinely trivial, irrelevant, or can be filled in multiple ways *without* altering the core intuition. (E.g., the color of the lab walls in the demon experiment).
          *   When the case is presented *explicitly* as an illustration of a *previously stated and agreed-upon* principle or background theory, not as an independent source of insight.
          *   When the audience shares such a strong, explicit, and homogeneous background framework that the filling-in is genuinely uncontroversial and the intuition *is* reliably generated (though even here, the scaffolding is implicit, its *problematic* nature is absent).
          *   Simple analogies where the point of comparison is explicit and the background isn't doing hidden argumentative work.
      *   **Borderline Cases:**
          *   **The Trolley Problem (Original Formulation):** Relies *heavily* on implicit scaffolding about causation, intention, and the value of action vs. inaction. Specifying different background moral theories (deontology vs. utilitarianism) or causal metaphysics can radically change intuitions or make them flip (e.g., the loop variant). It's a prime example. *Borderline aspect:* Some argue the core contrast (push vs. switch) is robust across *some* variations, suggesting not *all* scaffolding is equally critical.
          *   **Mary the Color Scientist (Jackson):** Depends crucially on implicit scaffolding about the nature of physical information, the completeness of physics, and what "learning something new" entails. Different interpretations of these (e.g., ability knowledge vs. propositional knowledge) lead to different verdicts. Explicitly specifying the scaffolding reveals deep disagreements. *Borderline aspect:* Proponents argue the intuition *is* robust if you share a minimal physicalist background; critics say that background *is* the contested point smuggled in.
          *   **Newton's Bucket / Einstein's Elevator:** These physics thought experiments rely on implicit scaffolding about the nature of space, inertia, and equivalence. Making the scaffolding explicit *is* the point for Einstein – it reveals the need for new theory (GR). *Borderline aspect:* They successfully generated new knowledge *because* they forced the scaffolding (absolute space vs. relativity) into the open. The illusion was productive, not deceptive.

  4.  **Closest Existing Concepts & Why "Implicit Scaffolding" is Useful:**
      *   **Dennett's "Intuition Laundering"** is the most directly relevant *critique*. "Implicit Scaffolding" provides a more precise, structural *description* of the mechanism being laundered *with*.
      *   **Rescher's "Dialectical Vulnerability"** highlights the argumentative weakness. "Implicit Scaffolding" identifies the specific *source* of that vulnerability in thought experiments.
      *   **"Implicit Domain Restriction" (Logic/Linguistics)** refers to how quantifiers often rely on context. "Implicit Scaffolding" is similar but applied to the *descriptive domain* of a narrative scenario and its argumentative *function*.
      *   **Why Coin a Term?** Your description isolates a *specific* and *pervasive* rhetorical-epistemic maneuver central to how thought experiments often function (and malfunction) in practice. Existing terms either focus on the *effect* (laundering, vulnerability) or are too general (hidden premise, under-specification). "Implicit Scaffolding" captures the *structural dependency* and its *functional role* in generating the illusion of discovery from the case itself. It highlights that the case isn't just incomplete; it's *built upon* and *requires* this unstated foundation to stand, and that foundation often contains the very material under dispute.

  **In summary:** You've astutely identified a crucial mechanism – **Implicit Scaffolding** – where the persuasive power of under-specified hypothetical cases depends on the audience unknowingly supplying contentious background beliefs, creating an illusion of novel insight. While related to concepts like intuition laundering, hidden premises, and dialectical vulnerability, it names the specific structural dependency of the case on unstated audience input that is essential for its intended effect but fatal to its epistemic claims when exposed. This is pervasive in philosophy, law, ethics, and even physics thought experiments.
