prompt: |-
  I'm in the second week of a decision theory seminar and I've got a paper due on risk-weighted expected utility — the Buchak book, Risk and Rationality — and I want to check my picture of the theory against yours before I commit it to paper, because I've got a feeling I've built it out of spare parts from other theories. Here's what I've got. Expected utility says pick the option that maximises the sum of probability times utility. REU, I think, says: fine, but first take the probability of each outcome and run it through a risk function h, so you're maximising the sum of h(p) times u(x) instead — essentially EU where you're allowed to bend the probabilities. So the risk function is doing the same job as the probability weighting curve in prospect theory, except Buchak means it as a normative theory rather than a descriptive one, and "risk-weighted" is basically saying you're allowed to be non-neutral about probability, which is the bit EU supposedly forbids. I even ran an example to convince myself: 1% chance of £10k, 10% chance of £1k, 89% chance of nothing, versus a sure £100, and I told my study group that a concave h makes you overweight the small chance of the big prize, which is why REU is the theory for people who buy lottery tickets. My friend, who's read more than me, said something's off but couldn't say what, so I'm asking you.

  Two things. First: what's actually wrong with that picture — and not "it's a bit loose", I want the structural thing I've missed, and specifically what the risk function takes as its input and what it gets multiplied by, since I suspect that's where I've gone wrong. Second, and this is the bit that matters to me practically: if REU is the theory that risk aversion is rational, and I'm a pretty risk-averse person — I've already got a concave utility function, I'm the classic diminishing marginal utility guy — then am I double-counting? And if I'm not, which knob am I supposed to turn when I'm actually deciding how much of my monthly savings goes into a stock index fund versus a savings account? I keep getting told REU vindicates risk aversion, so I want to know whether that means it's telling me to be risk averse or something weaker, and whether the two devices, the shape of u and the shape of h, are doing genuinely seperate jobs or just the same job twice.
reasoning: |-
  Okay, the user is in a decision theory seminar and working on a paper about risk-weighted expected utility (REU) based on Buchak's work. They've described their understanding of REU as similar to EU but with probabilities adjusted by a risk function h, and they're concerned they've built it from parts of other theories. They ran an example with a lottery ticket scenario and their friend hinted something was wrong. 

  First, I need to correct their misunderstanding of REU. They think it's just summing h(p)*u(x), but actually, REU uses a rank-dependent approach. The risk function h transforms cumulative probabilities, not individual ones. I should explain how the outcomes are ordered from worst to best, and h is applied to the cumulative probability of getting at least a certain outcome. The formula is the sum of u(x_i) * [h(1 - F(x_{i+1})) - h(1 - F(x_i))], which is more complex than simple probability weighting.

  The user mentioned prospect theory's probability weighting. While both use transformations, REU's is rank-dependent, which avoids issues like violations of stochastic dominance. Buchak presents REU as normative, unlike prospect theory which is descriptive. That's a key difference they should note.

  Their lottery example is problematic. They claimed a concave h makes people overweight small chances of big prizes, but actually, a convex h would do that in REU. Concave h leads to risk-averse behavior even beyond what EU explains. I should clarify this with their example.

  They also worry about double-counting risk aversion. In EU, risk aversion comes only from concave u(x). REU adds h(p) as a separate mechanism. So a concave u makes them averse to fair bets, but a convex h could make them risk-seeking for some choices. The knobs are independent: u for marginal utility, h for probability sensitivity. For their savings decision, u handles wealth utility, while h handles probability distortions, like how they react to small chances of losses in stocks.

  They need to understand that REU doesn't just vindicate risk aversion; it shows that it's rational in more cases. The two functions have distinct roles. Their paper should highlight rank-dependence and the normative argument. Clarifying the lottery example and double-counting will strengthen their work.
answer: |-
  You've got the spirit right but the mechanics wrong — specifically, **REU uses *rank-dependent* weighting, not simple probability weighting**. This is the structural flaw in your current picture, and it's crucial. Here's the breakdown:

  ### 1. What's Wrong: Rank-Dependence is Key
     * **Your Model:** "Maximise sum of `h(p) * u(x)`" → This is **simple probability weighting** (like Prospect Theory's *original* 1979 version).
     * **Buchak's REU Model:** Maximise the sum of `u(x_i) * [h(P(cumulative probability ≥ x_i)) - h(P(cumulative probability ≥ x_{i+1}))]`.
     * **The Core Difference:**
       * Outcomes must be **ordered from worst to best** (`x_1 < x_2 < ... < x_n`).
       * The risk function `h` transforms the **decumulative probability** (the probability of getting an outcome *at least as good as* `x_i`), not the individual outcome probability `p_i`.
       * The weight applied to `u(x_i)` is `h(1 - F(x_{i-1})) - h(1 - F(x_i))` (where `F` is the cumulative distribution function up to `x_{i-1}`). This weight depends on the outcome's *rank* in the distribution.

     **Why this matters:** Rank-dependence ensures the weights sum to 1 and avoids violations of stochastic dominance inherent in simple probability weighting. It captures how people focus on the *possibility* of reaching certain good/bad outcomes relative to their position.

  ### 2. REU vs. Prospect Theory Weighting
     * **Similarity:** Both transform probabilities non-linearly.
     * **Key Differences:**
       1.  **Rank-Dependence:** REU *requires* it for coherence. PT (in its modern Cumulative PT form) *also* uses rank-dependence, but its *descriptive* focus often highlights different `h` shapes (e.g., strong overweighting of very small probabilities).
       2.  **Normative vs. Descriptive:** This is your correct point. Buchak argues REU (`h`) represents a *rational* way to weight probabilities reflecting global risk attitudes (e.g., pessimism/optimism about how chances will turn out), not just a cognitive bias. PT aims to describe actual (often biased) behavior.
       3.  **Source of Risk Attitude:** In REU, both `u` (utility) and `h` (risk function) contribute independently to risk attitude. In EU, *only* `u` does. In PT, weighting *and* loss aversion are key descriptive drivers.

  ### 3. Your Lottery Example: The Flaw Revealed
     * **Your Claim:** "A concave `h` makes you overweight the small chance of the big prize."
     * **What REU Actually Says:** A **convex `h`** overweights the *best* outcomes (relative to their rank). A **concave `h`** overweights the *worst* outcomes.
     * **Applying REU to your example (`1% £10k, 10% £1k, 89% nothing` vs. `£100 sure`):**
       1.  *Order Outcomes:* Nothing (£0) < £100 (sure) < £1k < £10k.
       2.  *Focus on Weight for £10k:* Its decumulative probability is P(outcome ≥ £10k) = 0.01.
          * The weight for £10k is `h(1.00) - h(0.99)`. (Prob ≥ £10k is 0.01, Prob ≥ £1k (the next best) is 0.11).
       3.  *`h` Shape Matters:*
          * **Convex `h`:** `h(1.00) - h(0.99)` > `1.00 - 0.99` = 0.01. It **overweights** the tiny chance of £10k.
          * **Concave `h`:** `h(1.00) - h(0.99)` < 0.01. It **underweights** the tiny chance of £10k.
     * **Conclusion:** It's a **convex `h`** that makes the REU maximizer potentially prefer the lottery over the sure £100 *despite* a concave `u` (which already makes them risk-averse). The convex `h` reflects "optimism" or a taste for long-shot gains. Buchak argues this *can* be rational (e.g., valuing the "miniscule chance at a life-changing gain"). Your friend was right to sense something was off.

  ### 4. Double-Counting? Separate Knobs! Saving Allocation Advice
     * **No Double-Counting:** `u` and `h` control **fundamentally distinct** aspects of preference:
       * **`u(x)` (Utility Function):** Captures your **value for wealth levels** (diminishing marginal utility). A concave `u` means you intrinsically value an extra £100 less if you're rich than if you're poor. This drives risk aversion *within* the EU framework. Turning this "knob" affects how you value *certain* outcomes and changes the baseline for evaluating gambles.
       * **`h(p)` (Risk Function):** Captures your **attitude towards probability distributions themselves**, specifically how you weigh outcomes based on their *rank* (how good/bad they are relative to others in the gamble). A concave `h` (pessimism) makes you focus more on the worst possible outcomes in a gamble, leading to *additional* risk aversion beyond what `u` explains. A convex `h` (optimism) makes you focus more on the best possible outcomes, leading to risk-seeking behavior *despite* a concave `u`. Turning this "knob" affects how you weight the *chances* of different outcomes relative to each other within a gamble, based on their desirability rank.
     * **Which Knob for Your Savings?**
       * **`u(x)` is Primary:** This defines your fundamental need for security vs. potential growth. How much would losing 20% of your savings hurt vs. the benefit of gaining 20%? Your concave `u` tells you that gains give less "bang for the buck" than losses hurt, pushing you towards bonds/cash. This drives the *core* asset allocation (e.g., 60/40 stocks/bonds vs. 80/20).
       * **`h(p)` is Secondary/Refinement:** This influences *how you react to the distribution of outcomes within the stock investment*. A concave `h` (pessimism) makes you:
          *   **Overweight the small chance of catastrophic loss** (e.g., a market crash). Even if the *expected* return is attractive, the possibility of a very bad outcome looms larger in your evaluation.
          *   **Underweight the large chance of moderate gains.**
          *   **Result:** A concave `h` pushes you to **reduce exposure** to the risky asset (stocks) *below* what your concave `u` alone would suggest. You might choose 50/50 instead of 60/40. A convex `h` would have the opposite effect.

     **Practical Advice:** Focus first on calibrating `u` for your life goals and current wealth – this dictates the major allocation shift between "safe" and "risky". Then, honestly assess your `h`: Does the *mere possibility* of a bad stock outcome (even if compensated by higher expected return) cause disproportionate anxiety? If yes (concave `h`), dial down the stock allocation *further* than the `u`-based model suggests. REU vindicates this extra caution *as rational* for someone with your global risk attitude (pessimism weighting).

  ### In Summary for Your Paper
  *   **Correct REU Mechanics:** Emphasize **rank-dependent weighting**. The risk function `h` transforms *decumulative probabilities* (P(outcome ≥ x_i)), and weights are differences `h(P(≥x_i)) - h(P(≥x_{i+1}))`.
  *   **Distinguish from Prospect Theory:** Highlight REU's *normative* intent and its specific mechanism (global risk attitude via rank-dependent `h`).
  *   **Lottery Error:** Clarify that a **convex `h`** drives long-shot seeking in REU.
  *   **Separate Roles of `u` and `h`:** Argue decisively that `u` governs value for wealth levels (marginal utility), while `h` governs the weighting of probabilities based on outcome rank (global risk attitude). They are independent rational preference components. Risk aversion in REU can arise from *either* or *both*.
  *   **Normative Vindication:** REU doesn't just "vindicate risk aversion"; it argues that the *specific form* of additional risk aversion captured by a concave `h` (pessimism, focusing on worst cases) is rationally permissible, not merely a bias.

  This structure will demonstrate a solid grasp of REU's unique contribution and resolve the confusions you identified. Good luck with the paper!
