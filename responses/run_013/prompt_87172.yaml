prompt: |-
  Ok, here's a thing I keep running into in seminar and I've never found a name for, so this is half a plea for terminology and half a plea for someone to actually carve the joint properly.

  We're doing Jefferson or Churchill or Columbus, and someone says you can't hold him to our standards, he was a man of his time. Fine, maybe. But I've started noticing there are two different defences hiding in that one sentance, and people swap them for each other mid-argument.

  Defence one is an empirical claim about the era: nobody then thought X was wrong, so he can't be blamed for not knowing better. That one is falsifiable. I say fine, not everyone — plenty of people in that same decade objected — and it's dead, or it has to retreat to 'well, he was an outlier'.

  Defence two isn't about what anyone knew at all. It's about whose standards get to count: our moral vocabulary just doesn't apply to him, full stop. And here's what bugs me. When defence one gets knocked down, the person slides into defence two without noticing that the two claims are completely different in kind. Defence two isn't an excuse for the man, it's a claim that the criticism can't even be the sort of thing that's true. Which, if you believed it, would also cover the contemporaries who did object, and would cover us criticising people we happen to dislike. Nobody applies it that consistently.

  There's a grading thing too. The same deviation from the era's norms gets called 'ahead of his time' in the figures we like and 'of his time' in the ones we don't.

  I know the luck-and-responsibilty literature, and I know the presentism / historian's fallacy / Whig history charges, but those are names for what the accuser is doing, not for the structure of the defence itself. Is there an established term for either of these two, or for the slide between them? If there isn't one, coin something and tell me where its edges are — what it isn't, which of the nearby named things it's closest to and why it still isn't that, and what it predicts in a case that's not one of my three. Don't just hand me the label.

  Lead with the bottom line in your first sentence, then the reasoning. No preamble, no restating what I asked.
reasoning: |-
  Hmm, the user is describing a frustrating pattern they've noticed when people defend historical figures by saying "he was a man of his time." They've identified two distinct defenses that get conflated: Defense One is empirical (nobody thought X was wrong then), while Defense Two is metaphysical (our moral standards don't apply to past eras). They notice people slide between them when Defense One gets challenged, and there's inconsistent application depending on whether we like the historical figure.

  The user wants terminology for these defenses or the slide between them, or wants me to coin new terms if none exist. They specifically want: clear differentiation from existing concepts (like presentism), precise boundaries for what the term covers/doesn't cover, and predictions for how it would apply to non-Western cases. And they want the answer structured with the bottom line first.

  I recognize Defense One as a form of historical contextualism - it's about prevailing norms and available knowledge. Defense Two seems like a stronger form of moral relativism or even moral incommensurability between eras. The slide between them reminds me of "motte-and-bailey" tactics where someone retreats to a defensible position when challenged.

  For coinage: I could call the empirical claim "Contextual Absolution" (focuses on epistemic constraints) and the metaphysical claim "Temporal Sovereignty" (emphasizes moral autonomy of eras). The slide could be "Chronoshifting" to capture the illicit movement across time-based justifications.

  Important boundaries to note: This isn't just presentism (which is about judging the past by present standards) - it's about the defender's double move. It also differs from moral luck in that moral luck deals with outcomes beyond control, while this deals with the applicability of judgment itself.

  For a non-Western test case: Consider Ashoka's violent conquests before his Buddhist conversion. Defense One would claim nobody criticized imperial expansion then (false - Arthashastra discusses ethics of war). Defense Two would say modern pacifist standards don't apply to ancient Indian rulers. The inconsistency would show if we excuse Ashoka's violence but condemn a disliked contemporary conqueror.

  The grading observation is key - we call deviations "ahead of his time" for heroes but "of his time" for villains. This exposes the selective application of the defenses.
answer: |-
  **The slide between empirical and metaphysical defenses of historical figures is *chrono-slippage*, distinct from presentism accusations.**  

  ### 1. **Terminology & Definitions**  
  - **Defense One: *Contextual Excusability***  
    Empirical claim: "Agent A couldn't know X was wrong because *contemporaneous norms* universally accepted X." Falsifiable via historical evidence (e.g., showing abolitionists existed in Jefferson’s era).  
  - **Defense Two: *Temporal Autonomy***  
    Metaphysical claim: "Moral standards are *incommensurable* across eras; judging A by modern norms is category error." Unfalsifiable; rejects transhistorical moral critique.  

  **Chrono-slippage**: Illegitimately swapping *Contextual Excusability* (when falsified) for *Temporal Autonomy* to shield a figure from criticism, without acknowledging their incompatibility.  

  ### 2. **Boundaries & Distinctions**  
  - **What it isn’t**:  
    - **Presentism/Historian’s Fallacy**: Accusations *against critics* for imposing modern values. Chrono-slippage is the *defender’s* dual-move tactic.  
    - **Moral Relativism**: May underpin *Temporal Autonomy*, but chrono-slippage specifically denotes the *rhetorical slide* between defenses.  
    - **Moral Luck**: Concerns outcomes beyond control (e.g., accidental harm), not epistemic/metaphysical claims about era-specific norms.  
  - **Key difference**: *Contextual Excusability* denies *blameworthiness*; *Temporal Autonomy* denies *judgability*.  

  ### 3. **Predictions in Non-Western Cases**  
  Apply to **Tokugawa Ieyasu** (Japanese unification, persecution of Christians):  
  - **Defense One**: "No one in 1600s Japan opposed religious persecution." Falsified by hidden Christian communities (*Kakure Kirishitan*) and Buddhist dissenters.  
  - **Defense Two Slide**: "Feudal Japan’s ethics are untranslatable; our ‘human rights’ framework is irrelevant."  
  - **Grading Inconsistency**: Ieyasu’s centralization might be "ahead of his time" (if admired) or "of his time" (if condemned for brutality), exposing selective application of *Temporal Autonomy*.  

  ### 4. **Why "Chrono-slippage" Fits**  
  - **Diagnoses the core**: Evasion via temporal recontextualization (*chrono*) and deceptive rhetorical movement (*slippage*).  
  - **Predicts inconsistency**: Defenders apply *Temporal Autonomy* only to disliked figures, not contemporaries who objected or modern critics—exposing it as an ad hoc shield, not a principled stance.  

  **Bottom line**: Chrono-slippage is a motte-and-bailey maneuver masking empirical defeat with metaphysical immunity, exploiting ambiguity in "man of his time."
