answer: |-
  Here is a prioritized research agenda for s-risk conceptual work, designed to resolve foundational bottlenecks. The ordering rejects "interesting but premature" questions in favor of load-bearing foundations that unlock downstream progress. Key meta-assumptions: non-human suffering carries nontrivial weight (increasing Measurement's importance), worst-case s-risks could be astronomically bad (raising Aggregation's stakes), and probability distributions are heavy-tailed (making Aggregation both harder and more urgent).

  ### Prioritized Questions & Justification
  1. **Measurement (Question 4)**  
     **Why upstream?** Fundamental to comparing/aggregating suffering across entities. Without this, prioritization collapses into intuition.  
     **Tractability:** High for philosophers (phenomenal consciousness, valence, intersubjective comparison) and decision theorists (vNM rationality extensions).  
     **Effort Share:** 30% (core dependency).  
     **Critical Development:** A formalized framework for cross-mind suffering comparison (e.g., based on computational irreducibility of subjective states) would downgrade it; persistent failure would elevate it further.  
     **Reframing:** *"Under what conditions can suffering intensities be compared across dissimilar minds, and what substitutability principles apply?"*

  2. **Aggregation (Question 3)**  
     **Why upstream?** Determines how s-risks are weighted against other catastrophes. Depends on Measurement but governs prioritization logic.  
     **Tractability:** Medium-high (decision theory specialists). Requires tackling time-inconsistency in fanaticism-prone systems.  
     **Effort Share:** 25%.  
     **Critical Development:** Axiomatic resolution of fanaticism (e.g., bounded utility approaches) would partially resolve it; proof that all plausible theories require arbitrary choice would elevate it.  
     **Reframing:** *"Can we construct s-risk-specific decision theories that avoid paralysis/fanaticism while respecting dominance principles for extreme disvalue?"*

  3. **Episodes vs. Structure (Question 2)**  
     **Why midstream?** Builds on Measurement/Aggregation to define *what* to evaluate. Distinction only meaningful with clear suffering metrics.  
     **Tractability:** High (analytic philosophy, institutional economics). Structural analysis avoids collapse into episodicity if tied to *persistence mechanisms*.  
     **Effort Share:** 20%.  
     **Critical Development:** Formal models showing structural interventions dominate episodic prevention (e.g., via evolutionary game theory) would elevate it.  
     **Reframing:** *"What institutional invariants robustly perpetuate suffering, and how do they scale with technological capability?"*

  4. **Mechanism (Question 1)**  
     **Why downstream?** Intervention design depends on prior questions. "Intentional vs. incidental" is less fundamental than structural/episodic distinction.  
     **Tractability:** Medium (requires coupling philosophy of mind with incentive analysis). More tractable than Measurement.  
     **Effort Share:** 15%.  
     **Critical Development:** Evidence that intent is non-trivially more probable (e.g., from goal misgeneralization research) would elevate it.  
     **Reframing:** *"Does optimizing against suffering require distinct strategies for agentic vs. emergent disvalue generators?"*  

  5. **Interaction with X-Risk (Question 5)**  
     **Why downstream?** Trade-offs depend on Aggregation (how to weigh s-risk vs. extinction) and Measurement (suffering's role in post-extinction futures). Currently speculative.  
     **Tractability:** Low-medium (forecasting-heavy). Requires resolving prior uncertainties.  
     **Effort Share:** 10%.  
     **Critical Development:** Concrete models of how AI safety interventions affect s-risk (e.g., via reward function properties) would elevate it.  

  ---

  ### Cut/Defer Questions
  - **Mechanism (as currently framed):** While instrumentally convergent suffering matters, the "intentional vs. incidental" divide is less load-bearing than structural persistence. Merge into reframed Episodes/Structure work.  
  - **Interaction with X-Risk:** Highly policy-relevant but premature without foundations. Defer until Aggregation/Measurement yield tools to quantify trade-offs.  

  ---

  ### The Missing Upstream Question  
  **Ontology of Suffering:** *"What minimally constitutes a 'suffering substrate' in moral patients (e.g., is metacognition necessary?), and how do we bound the set of entities capable of experiencing disvalue?"*  
  - **Why upstream of all?** Until we define *what can suffer*, Measurement/Aggregation lack objects to evaluate. Overlooked in favor of intensity comparisons.  
  - **Impact:** Resolves debates about digital minds, non-conscious suffering, and moral patienthood—foundational for s-risk scope.  
  - **Tractability:** Medium (philosophy of mind, computational ethics). Requires synthesizing neuroscience with functionalism.  

  ---

  ### Final Prioritization & Allocation  
  | Rank | Question                      | Researchers | Key Outputs (3-Yr Target)                                                                 |
  |------|-------------------------------|-------------|---------------------------------------------------------------------------------------------|
  | 1    | **Measurement**               | 2           | Axioms for cross-mind suffering comparability; tractable proxies for disvalue intensity      |
  | 2    | **Aggregation**               | 1           | Non-fanatic s-risk decision theory; proof against paralysis under uncertainty               |
  | 3    | **Episodes vs. Structure**    | 1           | Formal criteria for self-perpetuating suffering systems; intervention leverage points       |
  | 4    | **Ontology of Suffering**     | 1           | Testable criteria for moral patienthood; map of suffering-substrate correlates              |
  | -    | *(Deferred: Mechanism, X-Risk Interaction)* | - | -                                                                                         |

  **Why this ordering?** Until we can *measure* suffering and *aggregate* it rationally (Ranks 1-2), debates about mechanisms or trade-offs rest on quicksand. Ontology (added) and Structure (Rank 3-4) then define *what* to protect and *how* it persists. Mechanism and X-Risk become actionable only after these—funding them now risks unmoored speculation. 

  **Contested assumptions tilt this way:** If you reject heavy tails or astronomical suffering, Aggregation drops. If only humans matter, Measurement simplifies. But given s-risk's core premises, this agenda forces resolution of the field's true bottlenecks.
