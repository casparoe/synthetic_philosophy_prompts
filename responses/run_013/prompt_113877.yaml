  I'm in a third-year class on the epistemology of conspiracy theories (we've done the fight over whether conspiracy theories are defective as a class or have to be judged one at a time on there merits, and the unfalsifiability/self-sealing objection) and for the film side of the module I have to write a reading of The Truman Show through all that. I dont want the cave/Baudrillard thing everyone does. Is Truman's belief that his whole world is a set justified by the evidence he actually has -- the light falling out of the sky, the radio slip, his dad coming back -- and does it matter that he turns out to be right? Does the film come down on the side that says the problem with conspiracy theories is the method and not the truth, or does it undercut that by making him the only one who reasons instead of believing what he's told? Then push on whether it cheats: his world really is rigged, so the self-sealing objection stops being an objection and is just true, which feels like it should be a problem for the film and maybe isn't. I also want something on the viewers inside the film who know the whole thing and don't care -- is that suspicion without a theory, or the reverse, and does anything in the debate cover it? End by saying what the film shows that the arguments can't.

