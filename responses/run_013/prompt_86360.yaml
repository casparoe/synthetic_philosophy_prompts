  ### Reconstructing Scanlonian Contractualism in Aggregation-Theoretic Terms

  **Core Reconstruction:**
  - **Individuals as bearers of complaints:** Each individual \(i\) has a complaint \(c_i(a)\) against act \(a\), representing the burden \(i\) suffers under \(a\). Complaints are interpersonally comparable and measured on a cardinal scale (e.g., \(c_i(a) \geq 0\), with higher values indicating stronger complaints).
  - **Moral status as a function of complaint profiles:** The permissibility of \(a\) is determined by a social aggregation rule \(F\) mapping profiles of complaints \((c_1(a), \dots, c_n(a))\) to a binary outcome (permissible/impermissible), subject to constraints.
  - **The test for an act:** Act \(a\) is permissible iff no principle permitting \(a\) can be *reasonably rejected*. A principle \(P\) (permitting \(a\)) is reasonably rejected by \(i\) if there exists an alternative principle \(P'\) (forbidding \(a\) and permitting some \(b\)) such that:
    - \(i\)'s complaint under \(P\) (i.e., in \(a\)) is greater than any individual's complaint under \(P'\) (i.e., in \(b\)): \(c_i(a) > \max_j c_j(b)\).
    - \(P'\) is not itself reasonably rejectable (resolved by minimizing the maximum complaint across alternatives).
  - **Individualist restriction as an informational constraint:** \(F\) must satisfy *anonymity* (permutation invariance of individuals) and an *informational invariance* condition: \(F\) depends only on individual complaints, not aggregates (e.g., sums, averages). Comparisons are limited to interpersonal ordinal comparisons of complaint strength (e.g., "\(c_i(a) > c_j(b)\)"), excluding cardinal aggregates.

  **Formal Aggregation Rule:**  
  Contractualism reduces to the **minimax complaint rule**:  
  - Act \(a\) is permissible iff it minimizes the maximum complaint across all feasible acts.  
    \[
    a \text{ is permissible} \iff \max_i c_i(a) \leq \max_j c_j(b) \quad \forall \text{ feasible } b.
    \]
  Equivalently, \(a\) is in the set \(\arg\min_{b \in A} \max_i c_i(b)\), where \(A\) is the set of feasible acts.

  ---

  ### Consistency of Commitments: Comparability vs. Non-Additivity
  **Constraints Defined:**  
  1. **Comparability (C):** Complaints are interpersonally comparable (a complete, transitive order exists over all \(c_i(a)\), \(c_j(b)\) pairs).  
  2. **Non-additivity (N):** The permissibility of \(a\) cannot depend on sums, averages, or other additive aggregates of complaints.  
  3. **Unanimity (U):** If \(c_i(a) \leq c_i(b)\) for all \(i\) and \(c_j(a) < c_j(b)\) for some \(j\), then \(b\) is impermissible if \(a\) is feasible.  
  4. **Anonymity (A):** Permutation of individuals does not change permissibility.  
  5. **Independence from irrelevant alternatives (IIA):** Permissibility of \(a\) depends only on complaints in \(a\) and feasible alternatives, not on complaints in infeasible acts.

  **Analysis:**  
  - The minimax rule satisfies **C, N, U, and A**:  
    - **C** and **N** are inherent: it uses ordinal interpersonal comparisons (e.g., \(c_i(a) > c_j(b)\)), not sums.  
    - **U** holds: If \(a\) Pareto-dominates \(b\) (lower or equal complaints for all, strictly lower for some), then \(\max_i c_i(a) \leq \max_j c_j(b)\), so \(b\) is impermissible if \(a\) is feasible.  
    - **A** holds: Relabeling individuals does not affect \(\max_i c_i(a)\).  
  - **IIA is violated:** Permissibility of \(a\) depends on the *entire set* of feasible alternatives. If a new act \(c\) with \(\max_k c_k(c) < \max_i c_i(a)\) is added, \(a\) may become impermissible.  
    - Example:  
      - Feasible acts: \(a = (5, 0)\), \(b = (0, 4)\). \(\max(a) = 5\), \(\max(b) = 4\) → \(b\) permissible.  
      - Add \(c = (0, 3)\). Now \(\max(b) = 4 > \max(c) = 3\) → \(b\) impermissible.  

  **Verdict:**  
  The minimax rule satisfies **C, N, U, and A** but violates **IIA**. Contractualists **abandon IIA** because the reasonable rejection test requires comparing \(a\) to *all* feasible alternatives (the test is inherently set-dependent). This does not cost them the individualist restriction: minimax relies solely on interpersonal comparisons of individual complaints (e.g., \(c_i(a) > \max_j c_j(b)\)), not aggregates.

  ---

  ### Residue Report: Gaps vs. Unclarities
  1. **First-personal standpoint:**  
     - *Issue:* The model treats complaints as objective weights, but Scanlon emphasizes the *subjective experience* of living with burdens.  
     - *Verdict:* **Unclarity in contractualism.** Scanlon does not specify how first-personal experiences translate into interpersonally comparable complaints. The formal apparatus assumes comparability is given, leaving a gap if real-world complaints are incommensurable.

  2. **Complaint strength vs. number of holders:**  
     - *Issue:* Minimax ignores the *number* of individuals with a given complaint level (e.g., one person with complaint 10 vs. a million with complaint 9).  
     - *Verdict:* **Formal gap.** Contractualism requires this distinction (rejecting aggregation), and minimax captures it perfectly by focusing solely on the maximum complaint.

  3. **Reciprocity of reasonable rejection:**  
     - *Issue:* Rejection is addressed to others "seeking agreement," implying a deliberative process not reducible to complaint comparisons.  
     - *Verdict:* **Unclarity in contractualism.** Minimax operationalizes rejection via complaint thresholds (\(c_i(a) > \max_j c_j(b)\)), but Scanlon's reciprocity is a procedural norm (e.g., "could others reasonably accept my rejection?"). The formal model bypasses deliberation, reducing reciprocity to outcome-based comparisons.

  ---

  ### Modelling Complaints: Weights vs. Judgments
  - **Complaints as judgments:** Complaints are better modelled as *judgments about the rejectability of principles* (e.g., "\(P\) is rejectable by me because \(c_i(a) > \max_j c_j(b)\)"). This aligns with Scanlon's focus on principles and rejection.  
  - **Aggregation problem type:**  
    - If complaints are *weights*, aggregation is about **distributive justice** (e.g., minimizing worst suffering).  
    - If complaints are *judgments about rejectability*, aggregation is about **judgment aggregation**: each individual \(i\) judges whether \(P\) is rejectable based on \(c_i(a)\) and \(\max_j c_j(b)\).  
      - The rule becomes: \(P\) (permitting \(a\)) is rejected iff \(\exists i\) such that \(i\) judges \(P\) rejectable *and* no \(j\) judges an alternative \(P'\) rejectable.  
      - This fits judgment aggregation (e.g., premise-based aggregation with a shared threshold).  

  **Formal Reconciliation:**  
  The reconstruction **succeeds without importing assumptions**, but judgment aggregation reframes the problem:  
  - **Weights framework:** Minimax satisfies contractualist constraints (except IIA).  
  - **Judgments framework:** Complaints as rejectability judgments yield identical outcomes (if judgments are binary and based on minimax thresholds).  
  No assumptions are smuggled; both frameworks converge on the same rule under contractualism's constraints.  

  ---

  ### Final Verdict
  - **Consistency:** Contractualism is consistent under the minimax rule, which satisfies comparability (**C**), non-additivity (**N**), unanimity (**U**), and anonymity (**A**), but violates independence from irrelevant alternatives (**IIA**).  
  - **Residues:**  
    - First-personal standpoint → **Unclarity in contractualism.**  
    - Complaint strength vs. number → **Formal gap (adequately addressed).**  
    - Reciprocity → **Unclarity in contractualism.**  
  - **Complaint modelling:** Complaints are better seen as **judgments about rejectability**, placing aggregation in **judgment aggregation theory**, but the functional outcome is identical to minimax.
