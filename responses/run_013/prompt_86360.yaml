  But in the core of Scanlon, the basis for reasonable rejection is the burden that the principle imposes. 

  So we think the model is adequate.

  Therefore, the aggregation rule is minimax over the complaints. 

  And the aggregation problem is one of aggregating burdens (which are like negative utilities) with the goal of minimizing the maximum burden. 

  This is not about aggregating preferences (which are usually about choosing the most preferred) but about aggregating burdens (or complaints) to find the act that is least bad in the worst case. 

  But note: we are not aggregating in the sense of combining the burdens, but we are taking a function of the profile (the max). 

  So we are in the theory of aggregating numerical values, but with a non-additive function.

  Now, the consistency: the reconstruction is consistent. We have a rule (minimax) that satisfies:
  - Comparability
  - Non-additivity
  - Anonymity
  - Unanimity (weak form, and the strong form of Pareto is not required and not always satisfied, but that is acceptable)
  - But not independence of irrelevant alternatives (because the permissibility of an act depends on the set of alternatives). However, the condition we were asked about was "independence from alternatives that are not at issue in the act under assessment". Since the contractualist test requires comparing the act to the alternatives, we must consider all alternatives. So the lack of independence in the Arrow sense is not a violation of the intended condition.

  Therefore, we conclude that the reconstruction is consistent and that the minimax rule satisfies all the constraints.

  But wait: the original question was whether contractualism is committed to both comparability and non-additivity and whether there is a rule that satisfies both along with unanimity, anonymity, and independence. 

  We have found that minimax satisfies:
  - Comparability: yes.
  - Non-additivity: yes, because it does not add.
  - Unanimity: in the weak form (if an act is better for everyone, then it has a lower max and is chosen) and also in the strong form (if an act a has lower complaint for everyone than b, then a is chosen over b) but note that the strong form (Pareto) is not required in the case of trade-offs? We have shown that minimax does not violate Pareto when Pareto applies (when one act dominates another). For non-dominated acts, Pareto does not require anything.
  - Anonymity: yes.
  - Independence: not in the Arrow sense, but we argued that the condition intended was about not considering alternatives that are irrelevant to the act under assessment. However, in the contractualist test, every alternative is potentially relevant because it might provide a basis for rejection. Therefore, we cannot have independence. 

  So the condition that is abandoned is independence of irrelevant alternatives (in the classical sense). But that does not cost the individualist restriction because we are still only using individual complaints and not aggregating across individuals.

  Therefore, the reconstruction is successful without importing assumptions from one framework into the other.

  Residue report:

  1. First-personal standpoint: captured by the individual complaint level.
  2. Strength of complaint vs. number: captured by the focus on the maximum (ignoring numbers).
  3. Reciprocity: captured by the condition that the alternative principle must have a lower maximum burden, so it is acceptable to all.

  Verdict: no gaps or unclarities in the contractualist formulation that prevent a consistent formal reconstruction.

  However, note: we have assumed that the burden levels are interpersonally comparable. If that is not granted, then we lose comparability. But contractualism requires comparability to make the reasonable rejection test work.

  Therefore, the reconstruction is consistent.
