answer: |-
  Here’s a targeted Q&A prep sheet for your presentation, prioritizing objections by likelihood and impact. Phrasing mirrors your audience’s vocabulary (e.g., "equilibrium," "signaling," "correlated preferences"). Concessions and weak spots are flagged.

  ---

  ### **Top 4 Likely Objections (Ordered by Threat Level)**  
  *(Phrased as they’d ask)*  

  1. **Evolutionary Game Theorist:**  
     *"You’re artificially separating ‘criticism’ from preferences. Criticism is just a component of an extended utility function—e.g., I get disutility from observing norm violations or utility from punishing. Once you model it as a correlated equilibrium with state-dependent payoffs, the ‘demand’ feature collapses into stability. Why invent surplus ontology?"*  
     **Your 2-Minute Reply:**  
     "Criticism-as-payoff *explains why critics act* but not why third parties perceive the *criticism itself as justified*. In the lift case, no one feels entitled to sanction button-pressing ‘deviants’—it’s pure coordination. In the seat case, criticism is treated as *warranted* even by non-punishers (e.g., passive observers who signal disapproval). Game theory captures *behavioral* stability; it doesn’t explain the normative layer where criticism is seen as legitimate independent of its cost."  
     **Thinnest Spot:** You haven’t provided a *formal alternative* for how "warranted criticism" emerges.  

  2. **Philosopher of Social Science (Conventions Expert):**  
     *"Your lift example isn’t a true convention—it’s a mere behavioral regularity without normative force. Lewis’s account *requires* contingency for arbitrariness. The seat case isn’t arbitrary: helping the vulnerable has moral salience. You’re comparing a coordination norm to a social/moral norm and calling it a flaw in convention theory."*  
     **Your 2-Minute Reply:**  
     "I agree the cases differ, but not on arbitrariness. Both solve coordination problems (avoiding delays in the lift; allocating scarce seating efficiently). The *moral overlay* in the seat case is precisely my point: conventions lack intrinsic ‘oughtness,’ whereas norms generate demands. My argument is that Lewis-style conventions *necessarily exclude* third-party warranted criticism—so if we observe it (as in seating), we’re dealing with a norm, not a convention."  
     **Thinnest Spot:** Risk of circularity: defining norms *by* the presence of criticism.  

  3. **Metaethicist:**  
     *"What grounds ‘warranted’ criticism? If it’s just distributed subjective attitudes, doesn’t ‘warrant’ reduce to felt disapproval? If not, are you smuggling in moral realism?"*  
     **Your 2-Minute Reply:**  
     "I’m not committing to realism. ‘Warranted’ here means *socially validated*: the community treats criticism as appropriate (e.g., accepting justifications for it, punishing *non*-critics). This is irreducible to individual preferences because it’s a network-level phenomenon. Even if disapproval fades, the *normative expectation* persists—e.g., people say ‘You should’ve given the seat’ years later, detached from payoffs."  
     **Thinnest Spot:** Vague on how "social validation" differs from aggregated preferences.  

  4. **Behavioural Economist:**  
     *"Persistence after payoff changes isn’t mysterious. Norms become Schelling focal points or low-cost signals of group membership. Ignoring criticism is *still* costly (reputational hits), so ‘cheap to ignore’ is empirically rare."*  
     **Your 2-Minute Reply:**  
     "Signaling explains *why* criticism persists, not why it feels *obligatory*. My point is that in norms (unlike conventions), the demand survives even when *ignoring criticism carries no cost* (e.g., anonymous subway settings where no one retaliates). People still feel they *ought* to comply. Signaling stabilizes the practice; it doesn’t generate the phenomenology of obligation."  
     **Thinnest Spot:** Needs evidence that obligation persists absent signaling payoffs.  

  ---

  ### **What to Concede Early**  
  - **"Yes, punishment *can* stabilize norms."** Don’t fight this; your point is that punishment doesn’t *constitute* the normative demand.  
  - **"I agree conventions explain predictability."** Affirm their core strength before arguing for norms’ added features.  

  ---

  ### **The Question You Fear Most**  
  **Metaethicist + Philosopher (Tag-Team):**  
  *"You claim norms add ‘demandedness,’ but your account reduces to psychology: people *feel* criticism is warranted and *feel* obligated. How is this more than a descriptive claim? If conventions lack ‘oughtness,’ but norms have it only as collective attitude, haven’t you just pushed the problem to metaethics without solving it?"*  

  **Why It’s Scary:**  
  It exposes the tension in your thesis: you’re describing a *phenomenon* (felt obligation) but invoking normative language ("warranted," "demanded"). This audience will pounce on the is/ought gap.  

  **Short Reply Strategy:**  
  *"I’m making a social-ontological claim, not a moral one. Norms create *social* demands—objective in the sense that they’re institutionally real (like money or promises). Conventions lack this deontic layer. The ‘ought’ I describe is institutional, not moral: it’s what the community enforces as binding. My account is descriptive of how norms *function*, not a justification of their content."*  
  **Why You Shouldn’t Panic:**  
  This frames your thesis as positivist, dodging metaethical debates. It aligns with social science—but concede it leaves moral philosophy untouched.  

  ---

  ### **Tactical Notes**  
  - **Game Theorists:** Use their language. Say "equilibrium" when describing conventions, "correlated strategies" for criticism.  
  - **Students:** If they speak, they’ll likely ask for examples. Prep 2 more (e.g., queuing vs. gift-giving).  
  - **Delivery:** Start with "I work within Lewis’s framework but argue it’s insufficient for *norms*." Preemptively concede its strengths.  

  This audience will attack the "criticism surplus" as reducible or conflated with morality. Hold the line: **norms create socially objective demands; conventions don’t.** Your thin spots are operationalization and formalism—but that’s where philosophy thrives. Good luck!
