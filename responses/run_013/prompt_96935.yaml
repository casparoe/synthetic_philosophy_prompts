prompt: |-
  I'm in a metaphysics reading group that's been circling personal identity and de re modality for weeks now, and the "could you have come from a different sperm and egg" question has started to drive me a bit up the wall, mostly because everyone argues about it using the same two or three cases and I've come to suspect the real disagreement is about what we're demanding of an answer, not about the cases. So before we read anything else I want the specification written down first: what does any adequate theory of what is essential to a person (or to an organism generally -- I don't think the theory should have to draw that line itself, but say so if you think it does) actually have to deliver? Give me the full list of requirements -- the cases it has to get right, the distinctions it must not collapse, the results it has to stay consistent with, the questions it should be allowed to leave open -- with the case or consideration behind each requirement, and then mark which ones are non-negotiable and which are really just commitments of one camp (origin essentialists, haecceitists, the people who think the whole question is confused, four-dimensionalists, whoever).

  Then the part I care most about: say which subset of these requirements can't be jointly satisfied, if any. I suspect there's at least one genuine clash, and if so I want the list itself to be the result rather than a shopping list. Some cases I want the list to cover that don't usually come up in the group: a person who is a tetragametic chimera, i.e. two embryos that fused into one body with two distinct cell lines, so that no single genome is even necessary for being that person and there may be no single zygote you can point to as where they came from; and pushing the other way, a child whose genome was edited after fertilization so that it now matches what a different egg and sperm would have produced -- if your theory says that child's origin is the edited genome, or the donor's gametes, or neither, say which and what it costs. Also, what should the theory say about someone who began as one cell of a very early split embryo where the other half was absorbed -- is there a fact of the matter about which cell they came from, or is that a question the theory has to be permitted to leave unanswered? And I want to know whether "couldn't have come from a different sperm and egg" should be derived from something more basic or taken as a primitive, and what follows either way -- especially for the fact that this is supposed to be necessary but only knowable after the fact, which I've never heard explained in a way that didn't feel like a magic trick. Also does the theory owe us any account of why the intuition is so strong here but so weak for, say, which lump of bronze a statue came from, or is that just a different topic? Finish by running two or three of the going views against your list in a line each if you have room, but the list is what I actually want. No citations please, I'm not going to check them and half of them would be wrong anyway.
reasoning: |-
  Okay, let me tackle this user's query. They're in a metaphysics reading group stuck on personal identity and de re modality, specifically the sperm-and-egg origin question. The user is frustrated because discussions keep circling the same cases, and they suspect the real issue is about what an adequate theory must deliver. They want a clear list of requirements for any theory of essential properties for persons or organisms, including which are non-negotiable and which are camp-specific. 

  First, I need to unpack their core request. They want a specification of what makes a theory adequate before diving into more readings. The list should cover cases like tetragametic chimeras, genome editing, and early embryo splits. They also want to know if there's a conflict between requirements, how "couldn't have come from different gametes" should be derived, and why the intuition is strong for persons but not for artifacts like statues.

  The user's explicit needs are a structured list of requirements with justifications, conflicts between them, and handling of edge cases. But deeper, they might be seeking clarity on meta-philosophical disagreements, wanting to move beyond repetitive debates by establishing a framework. They might also want tools to evaluate theories objectively, avoiding citation-heavy arguments.

  I recall that in metaphysics, essentialism debates often hinge on modal intuitions versus scientific facts. The sperm-and-egg necessity, championed by Kripke, faces challenges from biological complexities. The user mentions tetragametic chimeras—where two zygotes fuse—which directly challenges the idea of a single origin. Genome editing after fertilization further complicates what counts as origin. Early embryo splits raise questions about when an individual begins.

  For the requirements, non-negotiables might include consistency with identity facts and modal coherence. But scientific adaptability is crucial too. The user wants to know if a theory must resolve all edge cases or can leave some questions open. Conflicts could arise between scientific adaptability and the necessity of origin, or between intuition strength and theoretical minimalism.

  The genome-edited child case tests whether origin is the original gametes, the edited genome, or neither. Each answer has costs: original gametes might ignore the genetic change, edited genome might sever ties to biological origin, neither might feel evasive. The early split embryo question touches on vagueness in persistence—should theories accommodate indeterminacy?

  The intuition strength difference between persons and artifacts could stem from personhood's moral significance or biological uniqueness. But the user might want to know if this is inherent to the theory or a separate issue.

  Finally, applying the requirements to existing views: origin essentialism satisfies necessity but struggles with chimeras; haecceitism handles transworld identity but might be too vague; deflationism avoids commitments but may not satisfy deeper intuitions.

  I need to structure the requirements clearly, highlight conflicts, and address each case. The key is balancing philosophical rigor with real-world biological complexity, showing where theories must bend or break.
answer: |-
  Here’s a specification for an adequate theory of essential properties for persons/organisms, focusing on what it must deliver, where conflicts arise, and how edge cases constrain the landscape. Requirements are categorized by necessity, with conflicts highlighted.

  ---

  ### **I. Non-Negotiable Requirements**  
  *(Any viable theory must satisfy these)**  
  1. **Consistency with Identity Facts**  
     - *Case*: If person A exists in world W1 and person B in W2, the theory must explain why A ≠ B (e.g., you vs. your twin).  
     - *Demand*: Cannot permit contradictory identities.  

  2. **Modal Coherence**  
     - *Case*: If you *could* have been born from different gametes, this must not imply you could be Napoleon.  
     - *Demand*: Preserve transworld identity without trivializing essence (no "anything goes" modality).  

  3. **Biological Grounding**  
     - *Case*: A theory claiming you could originate from a rock violates biology.  
     - *Demand*: Must acknowledge biological constraints on origin/persistence (e.g., gametes, cells).  

  4. **Vagueness Accommodation**  
     - *Case*: Early embryo splits (where one cell is absorbed) may lack a determinate "first cell."  
     - *Demand*: Can accommodate borderline cases without collapsing identity (may leave some origins indeterminate).  

  ---

  ### **II. Contested but Widely Expected Requirements**  
  *(Theories may reject these, but face costs)**  
  5. **Origin Necessity**  
     - *Case*: Kripke’s intuition: You couldn’t originate from wholly different gametes.  
     - *Camp*: Origin essentialists (non-negotiable for them).  
     - *Cost if rejected*: Conflicts with strong pre-theoretic intuitions; weakens de re necessity.  

  6. **Intuitive Strength Asymmetry**  
     - *Case*: Why is gametic origin essential for you, but not bronze origin for a statue?  
     - *Demand*: Explain or reject the asymmetry (e.g., persons have historical essences, artifacts do not).  
     - *Cost if ignored*: Appears ad hoc.  

  7. **Determinacy of Identity**  
     - *Case*: Tetragametic chimeras (one body, two genomes). Must the theory specify *one* "true" origin?  
     - *Camp*: Haecceitists demand determinacy; deflationists permit indeterminacy.  

  8. **A Posteriori Necessity**  
     - *Case*: "You couldn’t come from different gametes" is necessary but only known empirically.  
     - *Demand*: Explain how empirical facts ground necessity without magic (e.g., via rigid designation).  
     - *Cost if primitive*: Feels brute; if derived, must avoid circularity.  

  ---

  ### **III. Edge Cases & What They Test**  
  - **Tetragametic Chimera**  
    - *Test*: Does the theory require a *single* gametic origin? Adequate theories must:  
      - (a) Deny that a *specific* genome is essential (two exist),  
      - (b) Allow that the *fusion process* is essential, or  
      - (c) Permit "this person" to have disjunctive origins.  
    - *Costs*: (a) Undermines genetic essentialism; (b)/(c) may violate Requirement 7.  

  - **Genome-Edited Child**  
    - *Case*: Edited post-fertilization to match donor gametes.  
    - *Options*:  
      - **Origin = Original gametes**: Child "could" have had donor’s genome naturally.  
        - *Cost*: Ignores genetic identity; violates biological grounding (Requirement 3).  
      - **Origin = Edited genome**: Child *did* come from donor gametes in a sense.  
        - *Cost*: Severs link to actual causal history; risks teleology.  
      - **Neither**: Origin is the zygote, not gametes.  
        - *Cost*: Rejects Requirement 5 (Origin Necessity).  

  - **Early Split Embryo (One Cell Absorbed)**  
    - *Demand*: Theory may (but need not) answer "which cell?"  
    - *Adequate response*: Indeterminacy is acceptable (via Requirement 4).  
    - *Inadequate response*: Insisting on a fact of the matter without biological evidence.  

  ---

  ### **IV. Key Conflicts: Requirements That Can’t All Be Met**  
  - **Conflict 1: Origin Necessity vs. Scientific Adaptability**  
    - If a theory demands *you must have originated from gametes G1* (Requirement 5), it fails for:  
      - Chimeras (no single G1),  
      - Genome-edited children (G1 replaced),  
      - Embryo splits (which G1?).  
    - *Resolution*: Drop 5, weaken to "originated from *some* gametic lineage," or accept indeterminacy.  

  - **Conflict 2: Determinacy vs. Epistemic Access**  
    - If haecceitism takes "transworld identity" as primitive (satisfying 7), it violates 8 (no explanation for a posteriori necessity).  
    - If deflationism rejects primitive identity (satisfying 8), it violates 7 (identity may be indeterminate).  

  ---

  ### **V. What the Theory Owes on Intuitions**  
  - **Must**: Explain why origin intuitions are *stronger for organisms* than artifacts.  
    - *Minimal answer*: Organisms are natural kinds with historical essences; artifacts are functional kinds.  
  - **Need not**: Explain why *everyone* shares the intuition (evolutionary psychology is extra).  

  ---

  ### **VI. Brief View Assessments vs. Requirements**  
  - **Origin Essentialism** (Kripke): Nails 5,8; fails chimera/genome cases (Conflict 1).  
  - **Haecceitism**: Satisfies 7; treats transworld identity as primitive (violates 8).  
  - **Four-Dimensionalism**: Handles chimeras (temporal parts); rejects 5 (origin not essential).  
  - **Deflationism**: Accepts vagueness (satisfies 4); rejects 5,7 as ill-posed.  

  ---

  ### **Summary: The Core Tradeoff**  
  A theory **cannot simultaneously**:  
  - (i) Demand *determinate, specific gametic origins* for all persons,  
  - (ii) Fully accommodate biological edge cases (chimeras, edits),  
  - (iii) Ground necessity in a posteriori facts without primitives.  
  **You must sacrifice one**. Most theories drop (i) or (iii), accepting either indeterminacy or brute necessity. The persistent debate arises because no solution satisfies all intuitions—**the cases reveal divergent commitments to what counts as "you."**
