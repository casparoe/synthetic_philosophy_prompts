  But Ruth's past votes contradict simple complaints-based approach since she kept rules that fellows grumbled about. The key is the 1998 sign-in book vote: she scrapped it despite no named purpose, claiming the burden on staff wasn't worth bursar's comfort. This suggests she weighs burden vs benefit, especially for non-voting staff.

  For the porter-standing vote:
