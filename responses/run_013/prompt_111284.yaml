  - They complained
  - No clear purpose

  The 1998 precedent shows she'll scrap burden on non-voters without clear benefit. Also, her stated logic about not valuing "five minutes of kitchen porter's time" over bursar's comfort parallels this case. So likely she'll scrap it.

  To test between:
