answer: |-
  ## INTEROFFICE MEMORANDUM  
  **TO:** International Desk, All Regional Bureaus  
  **FROM:** Meredith Thorne, Standards & Ethics Editor  
  **SUBJECT:** Stylistic Guidance RE: Catastrophic Intergroup Violence Events (CIGVEs) & Associated Terminology  
  **DATE:** October 26, 2023  
  **REF:** GlobalWire Standards Manual § 4.8 (Severe Atrocity Reporting Protocols)

  **1. PURPOSE & SCOPE**  
  This memorandum provides definitive guidance for describing situations involving the widespread, systematic killing of members of a specific human population group. Our primary objectives are: accuracy, legal defensibility, audience comprehension, and minimizing external complaints (particularly from state actors and their legal representatives). The attached **Approved Terms Ladder (ATL - Annex A)** is mandatory for all copy.

  **2. CORE DEFINITIONAL CHALLENGES & HOUSE APPROACH**  

  *   **2.1 Intent vs. Outcome:** The legally significant threshold turns on the *demonstrable intent* of perpetrators to destroy, in whole or in part, a specific group. Note: A large body count, while often present, is *not* the defining legal element. Our reporting must therefore focus relentlessly on uncovering and presenting credible evidence of this specific destructive intent, primarily through perpetrator statements, internal documents, and observable patterns of action. Avoid inferring intent *solely* from scale or suffering, however compelling those elements may appear. (See § 5.1 Re: "Reasonable Grounds").

  *   **2.2 The Protected Groups Shortlist:** The relevant international statute protects only groups defined by **nationality, ethnicity, race, or religion.** While we acknowledge Professor Lemkin's broader original conception (encompassing language, culture, political affiliation, etc.), GlobalWire style adheres strictly to the treaty definitions currently enforceable by courts. Groups falling outside this narrow framework (e.g., targeted primarily for political beliefs, social class, or sexual orientation), regardless of the severity of violence employed against them, cannot be described as victims of *genocide* under our style rules. Utilize the ATL appropriately.

  *   **2.3 The "Acts Of" Conundrum:** Officials may concede that "acts of genocide" have occurred, while simultaneously denying that the overall situation constitutes *a genocide*. GlobalWire policy is to **report such statements verbatim and without scare quotes** (see § 4.1), as they are factual utterances. However, desk editors **must append the following boilerplate clarification** to any such report:
      > *"Legal scholars note that the crime of genocide is constituted by specific acts committed with intent to destroy a protected group. The statement acknowledges such acts may have happened but does not constitute a formal legal determination that genocide is occurring overall."*
      Do *not* speculate on the numerical threshold ("how many acts?") required to meet the definition. It is an unanswerable question and invites unproductive debate.

  **3. THE BURDEN OF THE "G-WORD" & JUDICIAL DEFERENCE**  

  *   **3.1 Consequences of Usage:** Applying the term "genocide" is not a neutral descriptive act. It carries significant legal, political, and reputational weight. Accusations are highly inflammatory and may impact diplomatic relations, humanitarian access, and public perception. GlobalWire recognizes that using the term inherently involves a degree of journalistic judgment *before* any court ruling.
  *   **3.2 Courts vs. Reporters:** A formal legal determination of genocide typically occurs years, often decades, after the events and requires evidence meeting an extremely high burden of proof ("beyond reasonable doubt"). Journalism operates on a different standard ("reasonable grounds," see § 5.1) and timeline. **GlobalWire does not require a court verdict before using the term**, provided our internal evidence threshold is met and approvals are granted (§ 7). However, the absence of a verdict *must* be clearly noted in any report using the term. Example: "GlobalWire analysis, based on evidence gathered over two years, concludes genocide is occurring in X. No court has yet ruled on the situation."

  **4. ATTRIBUTION & SCARE QUOTES**  

  *   **4.1 Scare Quotes ("Genocide"):** **Prohibited.** Using scare quotes around "genocide" when attributing the term to others (e.g., "The group accused the government of 'genocide'") implies skepticism or distance that may be unwarranted and appears dismissive of serious allegations. Instead, use clear attribution: *"The group accused the government of genocide."* If the accusation is demonstrably fringe or baseless, avoid reporting it altogether unless newsworthy for other reasons (e.g., it sparks violence).
  *   **4.2 Attribution Standards:** When reporting accusations of genocide made by credible sources (e.g., UN investigators, major human rights groups, recognized states), attribute clearly and directly: *"The UN Commission of Inquiry stated it found 'reasonable grounds to believe the crime of genocide has been committed.'"* Avoid hedging language like "so-called genocide" or "alleged genocide" in these attributions; the allegation itself is the fact being reported.

  **5. EVIDENTIARY THRESHOLD FOR GLOBALWIRE USAGE**  

  *   **5.1 "Reasonable Grounds" Standard (The Specialist Clause):** This is the operative standard for GlobalWire. Before the term "genocide" may be used in our voice (not merely attributed), the International Desk, in consultation with the Standards Editor and Legal, must determine there exist **reasonable grounds to believe** that:
      a) Acts falling under the legal definition of genocide (killing, causing serious harm, inflicting conditions to destroy, preventing births, forcibly transferring children) *are occurring*;
      b) These acts *are targeted* against a protected group (national, ethnic, racial, religious); AND
      c) There is *credible evidence indicating the intent* to destroy that group, in whole or in part.
      *This clause is not an exaggeration. "Reasonable grounds" is a common standard used in international law (e.g., by prosecutors initiating investigations) and by serious journalistic entities when making profound judgments based on available evidence, acknowledging the gap before a court verdict.*

  **6. APPROVED TERMS LADDER (ATL) - ANNEX A SUMMARY**  
  *Use terms sequentially. Moving up requires justification per § 5.1 and § 7. Never skip rungs.*

  1.  **"Violence" / "Unrest" / "Clashes":** Default starting point. Use when details are unclear, scale is uncertain, or during initial, chaotic phases. Safe, broad, non-committal.
  2.  **"Ethnic Violence" / "Sectarian Violence":** Permitted when group identity is clearly a factor, but intent/systematic nature is unclear or violence appears mutual. (Note: Doesn't specify perpetrator/target dynamic).
  3.  **"Targeted Killings" / "Mass Killings":** Use when evidence shows specific groups are being singled out for killing, but evidence of broader "destructive intent" or other genocidal acts is lacking. Focuses on the *act*, not the *intent*.
  4.  **"Atrocities" / "Mass Atrocities":** Permitted when scale and horror are undeniable, involving widespread killing, rape, torture against civilians, but protected group status or genocidal intent remains unconfirmed or complex. A strong term implying grave crimes against humanity.
  5.  **"Acts Amounting to Genocide" / "Genocidal Acts":** Use ONLY when credible evidence meets criteria (a) and (b) in § 5.1 (specific acts against a protected group), but conclusive evidence of specific *intent to destroy* (c) is still being assessed or is strong but not yet deemed sufficient for the top term. Also use when reporting official statements acknowledging "acts of genocide" (§ 2.3). **Requires Deputy International Editor approval.**
  6.  **"Genocide":** The definitive term. Use **only** when the International Desk, Standards Editor, and Legal Counsel concur that the "reasonable grounds" standard (§ 5.1 a, b, c) is fully met, based on documented evidence and analysis. **Requires § 7 sign-off.**

  **7. APPROVAL PROTOCOL FOR TERMS ATL-5 & ATL-6**  

  *   **7.1 ATL-5 ("Acts Amounting to Genocide" / "Genocidal Acts"):** Requires documented memo from the Bureau Chief and Senior Correspondent(s) outlining evidence for specific acts against a protected group. Must be reviewed and approved by the **Deputy International Editor** and **Standards Desk Officer**.
  *   **7.2 ATL-6 ("Genocide"):** Requires a comprehensive dossier compiled by the Bureau, including:
      *   Evidence of specific genocidal acts (killing, etc.).
      *   Evidence identifying the targeted protected group.
      *   Evidence indicating perpetrator intent to destroy the group.
      *   Analysis addressing counter-narratives or conflicting evidence.
      This dossier must be reviewed and approved sequentially by:
      1.  Bureau Chief
      2.  Regional Editor
      3.  International Editor
      4.  Standards & Ethics Editor
      5.  GlobalWire Legal Counsel
      6.  Managing Editor (Final Sign-Off)
  *   **7.3 Timeline:** Initiate the ATL-6 approval process at the earliest indication evidence *may* be trending towards the threshold. Anticipate a **minimum of three to five business days** for full review, deliberation, and sign-off once the complete dossier is submitted. Urgent breaking news situations do not circumvent this process; use the highest permissible term from the ATL *below* ATL-6 until approvals are secured. Retroactive upgrades are permitted with approval but require prominent correction/update notices.

  **8. FINAL NOTE**  
  Our commitment is to report horrific events accurately and responsibly, without succumbing to either undue euphemism or premature accusation. This guidance exists to navigate the profound legal, ethical, and practical complexities inherent in describing the deliberate destruction of human groups. Adherence protects GlobalWire's credibility and ensures our reporting withstands scrutiny.

  **Meredith Thorne**  
  Standards & Ethics Editor, GlobalWire  
  "Accuracy Without Alarm, Context Without Compassion Fatigue"  

  ---

  **Annex A: GlobalWire Approved Terms Ladder (ATL) for Mass Group-Targeted Violence**

  *(As referenced in §6)*

  | Rung | Term                          | When Permitted                                                                                                                                 | Approval Required               |
  | :--- | :---------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------- |
  | **1** | **Violence / Unrest / Clashes** | Initial reports, chaotic situations, unclear group targeting, uncertain scale.                                                                | Desk Level                    |
  | **2** | **Ethnic Violence / Sectarian Violence** | Group identity (ethnic, religious) is clearly a factor in violence, but perpetrator/target dynamic is unclear or violence appears mutual/reciprocal. | Desk Level                    |
  | **3** | **Targeted Killings / Mass Killings** | Credible evidence members of a specific group are being systematically singled out and killed, but evidence of *intent to destroy the group* or commission of *other* genocidal acts (rape, starvation, child transfer) is lacking or unconfirmed. | Senior Correspondent / Bureau Chief |
  | **4** | **Atrocities / Mass Atrocities** | Widespread, systematic killing, rape, torture against civilians on a large scale. Horror is undeniable, but protected group status or specific genocidal intent remains complex, contested, or insufficiently documented. Implies Crimes Against Humanity. | Deputy International Editor   |
  | **5** | **Acts Amounting to Genocide / Genocidal Acts** | **a)** Credible evidence of specific acts falling under the genocide definition (killing, causing harm, etc.) **AND b)** Credible evidence these acts target a protected group (national, ethnic, racial, religious). *Conclusive evidence of specific intent to destroy the group (c) may be strong but pending further verification, or deemed insufficient for Rung 6.* **OR** Reporting official statements conceding "acts of genocide". | Deputy International Editor + Standards Desk Officer |
  | **6** | **Genocide**                  | **a)** + **b)** **AND c)** Credible evidence indicating perpetrator *intent to destroy* the targeted protected group, in whole or in part, meets the "reasonable grounds" standard (§5.1). GlobalWire concurs with the assessment. *Always note the absence of a court verdict if applicable.* | Full §7.2 Sign-Off Chain (Bureau Chief -> Managing Editor) |
