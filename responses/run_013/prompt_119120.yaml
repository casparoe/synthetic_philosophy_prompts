  I am an undergraduate in a decision theory seminar, and I also have a background in structural engineering and probabilistic risk assessment; I am fluent in the vocabulary of limit-state functions, demand and capacity distributions, fragility curves, safety factors, target reliabilities, annual probabilities of failure, and expected annual losses, though my formal decision-theory training is limited to this course. In class we have been working through risk-weighted expected utility, the view that a rational agent should not simply maximize probability-weighted utility but should first rank outcomes from worst to best and then transform cumulative probabilities through a weighting function, so that the decision weight assigned to an outcome depends on how much of the distribution lies at or below it and risk aversion is represented as an overweighting of worse outcomes relative to their objective probabilities. I find the machinery intuitive in the abstract, but I keep wanting to translate it into the reliability and risk-analysis framework I already use, where risk is managed through safety factors, target reliabilities, fragility curves, performance objectives, and acceptable annual loss. Please restate the central commitments of risk-weighted expected utility as faithfully as you can in that engineering vocabulary. I am especially interested in how the probability weighting function, the worst-to-best ranking of outcomes, the separation of beliefs from tastes, and the theory's treatment of risk aversion look when they are expressed in terms of load and resistance factors, design margins, hazard curves, and target failure probabilities; use concrete examples such as choosing between two levee designs or two bridge retrofits with the same expected annual loss but different tail behavior, and do not simply relabel expected utility as expected annual loss.

  Then give me the residue report. Which parts of risk-weighted expected utility translate cleanly into reliability engineering and probabilistic risk assessment, which parts translate only with distortion, and which parts have no counterpart at all? For instance, does a safety factor function as a rank-dependent decision weight, or is the resemblance superficial? Can a target reliability be given a risk-weighted interpretation, or does it presuppose something closer to expected utility? What happens to the theory's distinction between risk and ambiguity, or its treatment of dynamic consistency and sequential choice, when the target vocabulary is organized around hazard, fragility, and consequence? Finally, tell me whether the residue points to a defect in the engineering vocabulary, something it cannot represent, or to a place where risk-weighted expected utility is less clear or less unified than it first appears. Please keep the translation honest: do not smuggle in engineering assumptions and call them translation, and treat the failures of translation as the most interesting part. No bibliography or citations are needed.
