answer: |-
  Here's a faithful translation of Risk-Weighted Expected Utility (RWEU) into structural reliability/probabilistic risk assessment (PRA) vocabulary, followed by the residue report analyzing conceptual gaps.

  ---

  ### Translation: RWEU in Engineering Terms
  **Core Machinery & Translation:**
  1.  **Worst-to-Best Ranking:** Outcomes are ranked by *engineering consequence severity*, not just probability. Severity is defined by the *Consequence Function* (e.g., repair cost, downtime, fatalities). The ranking is absolute: complete bridge collapse > partial collapse > major damage > minor damage > no damage.
      *   *Example (Levees):* Levee Design A (thin right tail): Mostly minor overtopping or small breaches. Levee Design B (fat right tail): Mostly no overtopping, but small chance of catastrophic, city-flooding breach. Outcomes ranked worst (catastrophic breach) to best (no overtopping).

  2.  **Cumulative Probabilities & Weighting Function:** Instead of using the raw hazard curve or fragility curve probabilities directly, RWEU transforms the *cumulative probability of non-exceedance* (or exceedance) for *consequences*. Think of plotting Consequence (C) vs. Annual Probability that Consequences are *worse than or equal to* C (P[C ≥ c]). RWEU applies a *Decision Weighting Function* `ω(P)` to this cumulative probability *before* calculating expected loss.
      *   *Function `ω(P)`:* This is where "risk aversion" enters. `ω(P)` overweights the *probabilities of the worst cumulative consequences*. If `ω(P) > P` for small P (low probability of severe consequences), it reflects aversion to catastrophic risks. `ω(P) < P` for larger P might reflect "optimism" about moderate risks.
      *   *Translation:* The Decision Weight `π_i` assigned to consequence level `C_i` is `π_i = ω(P[C ≥ C_i]) - ω(P[C ≥ C_{i+1}])`, where `C_{i+1}` is the next *worse* outcome. Weight depends on the *rank* (how bad `C_i` is) and the cumulative probability down to that rank.
      *   *Example (Bridges):* Consider two retrofits with identical Expected Annual Loss (EAL). Retrofit X: Fragility curve leads to consistent, moderate damage in frequent earthquakes. Retrofit Y: Fragility curve leads to no damage most years but very high collapse probability in rare, large quakes. RWEU with an `ω` overweighting low P (bad tails) will assign higher *decision weight* to the catastrophic collapse outcome under Retrofit Y than its objective probability warrants, making Retrofit Y *less desirable* despite equal EAL. Safety factors alone wouldn't capture this if they target the same reliability index for a specific limit state.

  3.  **Risk-Weighted Expected "Utility" (Loss):** The final evaluation is the **Risk-Weighted Expected Annual Loss (RWEAL)**:
      `RWEAL = Σ [ π_i * C_i ]`
      Where `π_i` are the *decision weights* derived from `ω` applied to the cumulative consequence distribution, not the simple annual probabilities of each damage state. The rational choice minimizes RWEAL.

  4.  **Beliefs vs. Tastes:**
      *   **Beliefs:** Captured by the *hazard curve* (annual probability of load intensity S) and the *fragility curves* (P[Failure | S] or P[Damage State | S]). These define the *objective joint probability distribution* over load intensities and resulting consequences (via the consequence function). This is the "physics/statistics model".
      *   **Tastes (Risk Attitude):** Encoded *entirely* in the shape of the **Decision Weighting Function `ω(P)`**. A convex `ω(P)` (overweighting low P) signifies risk aversion focused on severe outcomes. This is distinct from the consequence function `C_i` itself (which might value a fatality as $X million). `ω(P)` modifies how the cumulative probabilities *influence the decision*.

  5.  **Risk Aversion (RWEU Style):** Not managed by *uniformly* increasing safety factors or target reliabilities. Instead, it's managed by **distorting the cumulative consequence distribution** to give *disproportionately heavy weight* to the probability of the very worst outcomes occurring. It's aversion to the *potential for catastrophe* embedded in the tail of the consequence distribution.
      *   *Contrast w/ Safety Factors:* A global safety factor uniformly shifts the design point away from the mean load. RWEU risk aversion specifically amplifies the perceived importance of the low-probability, high-consequence tail *relative to* the more probable, moderate outcomes. It's a *non-linear* weighting of the distribution tails.
      *   *Target Reliability:* A single target β (or P_f) for a specific limit state (e.g., collapse) acts like focusing *only* on the cumulative probability `P[C ≥ C_collapse]` and ensuring it's below a threshold. RWEU considers the *entire shape* of the cumulative consequence distribution and weights all levels of badness non-linearly.

  ---

  ### Residue Report: Mapping Fidelity & Gaps

  **I. Clean Translations:**
  1.  **Outcome Ranking:** Translates perfectly. Engineering consequence severity (cost, damage state) provides a clear, absolute worst-to-best ranking. Fragility curves explicitly define probabilities of reaching these discrete states given a load.
  2.  **Cumulative Probabilities:** The foundation of fragility curves and hazard curves *is* cumulative probability (`P[Demand > Capacity]`, `P[Load > s]`). Calculating `P[C ≥ c]` (annual probability of consequences worse than `c`) is a standard PRA output (e.g., a loss exceedance curve).
  3.  **Beliefs (Physics/Stats Model):** The separation of the probabilistic model (hazard + fragility) from valuation is inherent in PRA. Hazard/fragility define the joint probability distribution; consequence functions assign cost/impact. This maps cleanly to RWEU's "beliefs".
  4.  **Consequence Focus:** Both frameworks ultimately care about consequences (losses). EAL is analogous to Expected Utility (EU), while RWEAL is analogous to RWEU.

  **II. Translations with Distortion/Significant Interpretation:**
  1.  **Decision Weighting Function `ω(P)` vs. Safety Factors/Target Reliabilities:**
      *   **Distortion:** Safety factors and target reliabilities are *deterministic* or *point-probabilistic* design rules. They influence the *location* of the fragility curve relative to the hazard curve. `ω(P)` is a *post-hoc distortion function applied to the cumulative consequence probabilities* derived from the fragility/hazard analysis. It doesn't change the physical design; it changes how the *calculated risk* is evaluated for decision-making.
      *   **Interpretation:** One *could* interpret the *choice* of a more conservative target reliability (e.g., β = 5.0 vs β = 3.5 for collapse) for a *specific, catastrophic limit state* as *implicitly* reflecting an `ω(P)` that heavily overweights that very low `P_f`. However, this is an *indirect* mapping. The target β acts on the *input* (design point), while `ω(P)` acts on the *output* (consequence distribution). Target β doesn't inherently capture the non-linear weighting of *all* consequence levels or the potential optimism about moderate risks (`ω(P) < P`).
  2.  **Risk Aversion:**
      *   **Distortion:** Engineering risk aversion is *primarily* baked into design standards via safety factors and target reliabilities *before* calculating risk metrics. RWEU risk aversion is an explicit weighting applied *after* calculating the full consequence distribution. Engineering tends to express aversion by moving the fragility curve "left" (safer). RWEU expresses aversion by taking the calculated fragility/hazard output and mentally "fattening" the left tail of the consequence distribution when making the decision. They address the same *concern* (fear of bad outcomes) at fundamentally different *stages* of the process.
      *   **Example Residue:** Two designs might have the same calculated `P[C ≥ C_collapse]` but different `P[C ≥ C_major_damage]`. Standard PRA/EAL treats these probabilities linearly. RWEU with a convex `ω(P)` would weight the *difference* `ω(P_major) - ω(P_collapse)` differently than the objective probability difference, influencing choice even if collapse probabilities are equal.

  **III. No Clear Counterpart:**
  1.  **Ambiguity (Knightian Uncertainty):** RWEU (and modern decision theory) often distinguishes *risk* (known probabilities) from *ambiguity* (unknown probabilities). Engineering PRA *assumes* probabilities are knowable/estimable via hazard studies, testing, and expert elicitation. While sensitivity analysis is standard, formal modeling of ambiguity aversion (e.g., min-max, α-maxmin) has no direct counterpart in standard safety factors or fragility curves. Reliability indices treat epistemic uncertainty as just another factor influencing the calculated `P_f`.
  2.  **Dynamic Consistency & Sequential Choice:** RWEU faces challenges with dynamic choice (e.g., planning vs. acting later). Engineering decision-making within the target vocabulary is typically *static*: design/retrofit decisions are made upfront based on lifetime/annual risk calculations. Sequential decisions (e.g., inspection/repair) often rely on Bayesian updating but still typically maximize expected utility (minimize EAL) *at each stage* using updated probabilities. The complex time inconsistency issues arising from RWEU probability weighting have no established parallel in standard reliability-based design codes or PRA methodologies. The vocabulary lacks tools to express the conflict between an upfront RWEAL-optimal plan and what might seem optimal later using the same `ω(P)`.
  3.  **The `ω(P)` Function Itself:** While "risk aversion" is a concept, the *specific mathematical device* of transforming cumulative probabilities via `ω(P)` is alien to structural reliability and PRA. Safety factors are multiplicative shifts; reliability indices are measures of probability distance; fragility curves plot probabilities directly. There is no standard engineering tool that *explicitly distorts the cumulative probability axis* of a loss exceedance curve for decision-making. The *idea* of weighting bad tails more heavily is present, but the *mechanism* is fundamentally different.

  **IV. Interpretation of the Residue:**
  The residue points to **fundamental differences in perspective and representational capability**, not necessarily inherent defects in either framework, though it highlights limitations:

  1.  **Engineering Vocabulary Limitation (Gaps II.3 & III):** The standard reliability/PRA vocabulary struggles to represent:
      *   Formal ambiguity aversion.
      *   The specific non-linear probability weighting (`ω(P)`) central to RWEU as a distinct mechanism.
      *   The dynamic consistency problems arising from that weighting.
      This vocabulary excels at modeling physical uncertainty and calculating probabilistic performance but is less equipped for sophisticated, non-linear representations of human risk perception and dynamic decision processes *under its own terms*. It implicitly assumes expected utility (EAL minimization) or relies on conservative standards as a proxy for more complex risk attitudes.
  2.  **RWEU Limitation/Complexity (Gaps II.1, II.2 & III.3):** The residue also shows where RWEU might be *less practical or less unified*:
      *   **Calibration Challenge:** Specifying a credible, consistent `ω(P)` function is far harder than using established safety factors or target reliabilities derived from codes or historical performance. Engineering has a pragmatic, empirically grounded approach to setting safety margins; RWEU offers a richer theoretical model but lacks clear guidance on `ω(P)`.
      *   **Static vs. Dynamic:** RWEU's elegance in static choice breaks down in sequential settings, revealing potential internal inconsistency. Engineering's static approach avoids this complexity but may be less descriptively accurate for long-term adaptive planning.
      *   **Separation Illusion?** While RWEU formally separates beliefs (fragility/hazard) from tastes (`ω(P)`), the *choice* of which consequence levels to define and model in fragility curves (e.g., focusing heavily on collapse) is itself a value-laden decision influenced by risk aversion. The separation is cleaner in theory than in the practice of defining the PRA model.
  3.  **Complementarity:** The residue suggests the frameworks are complementary. PRA provides the rigorous probabilistic foundation (hazard, fragility, consequence calculation). RWEU provides a more nuanced theoretical lens for *evaluating* the resulting loss distribution, especially concerning tail risks and deviations from linear probability weighting. RWEU doesn't replace safety factors; it offers a different, decision-theoretic justification for why conservative safety factors for catastrophic events might be rational beyond simple EU.

  **Conclusion:** The translation reveals that RWEU's core innovation – rank-dependent probability weighting via `ω(P)` applied to cumulative consequences – finds no direct equivalent in the mechanics of safety factors, fragility curves, or target reliabilities. While engineering intuitively understands aversion to severe outcomes, it encodes this primarily through upfront design conservatism rather than post-hoc distortion of calculated cumulative probabilities. The engineering vocabulary robustly handles physical uncertainty and consequence modeling but lacks native constructs for ambiguity and the dynamic challenges of RWEU. Conversely, RWEU provides a powerful descriptive/prescriptive model for risk attitudes but faces practical calibration and dynamic consistency hurdles that the simpler, action-oriented engineering approach avoids. The residue highlights a gap in engineering's formal decision-theoretic underpinnings concerning non-linear probability weighting and ambiguity, while also underscoring the practical challenges inherent in fully implementing RWEU's theoretical machinery.
