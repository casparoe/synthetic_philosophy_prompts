  ### Test: Move Payoff to Counterfactual Mugging Shape
  To isolate the acausal element, modify the scenario so that the favorable branch (I=true) doesn't ask for payment. This is already the case: in I=true, you're never asked. But in the current setup, this makes I=false certain when asked, collapsing the case. The key flaw is that the "favorable branch" (I=true) has no decision point.

  **Adjust the scenario to be mugging-like**:  
  - Change GiveWell's policy: If I=true, they ask you to donate $500. If I=false, they run the model and ask only if it predicts you would donate.  
  - Keep all other details: I=true gives you $10,000 tomorrow, and the model is 90% accurate.

  **Analysis after adjustment**:  
  - **CDT**: If asked, P(I=true | asked) is not 0. Calculate:  
    - P(asked | I=true) = 1 (since always asked if I=true).  
    - P(asked | I=false) = P(model predicts donate | I=false) = 0.9 (if you're the donate type).  
    - P(I=true | asked) = [P(asked | I=true) * P(I=true)] / P(asked) = [1 * 0.01] / [1*0.01 + 0.9*0.99] = 0.01 / (0.01 + 0.891) ≈ 0.0111.  
    So P(I=false | asked) ≈ 0.9889.  
    Donating nets: 0.0111*9,500 + 0.9889*(-500) ≈ 105.45 - 494.45 = -389.  
    Declining nets: 0.0111*10,000 + 0.9889*0 ≈ 111.  
    CDT says decline.  
  - **EDT**: If asked and you donate, P(I=true | donate, asked).  
    Since donating is evidence you're the donate type, and the model is 90% accurate, P(model predicts donate | you donate) = 0.9. But P(I=true | donate, asked) depends on I and the model.  
    - P(I=true | donate, asked) = P(donate | I=true, asked) * P(I=true | asked) / P(donate | asked), but this is messy.  
    Since I and your type are independent, EDT's calculation reduces to CDT's. P(I=true | asked, donate) ≈ 0.0111, same as CDT. Net ≈ -389. Decline.  
  - **UDT**: Compare rules:  
    - Rule D (donate if asked):  
      Utility = P(I=true) * [donate: -500 + 10,000] + P(I=false) * [P(model predicts donate | you donate) * (donate: -500) + P(model predicts don't donate) * (not asked: 0)]  
      = 0.01*9,500 + 0.99*[0.9*(-500) + 0.1*0] = 95 + 0.99*(-450) = 95 - 445.5 = -350.5.  
    - Rule ¬D (decline if asked):  
      Utility = 0.01 * (decline: 10,000) + 0.99 * [0.9 * (decline: 0) + 0.1 * (not asked: 0)] = 100 + 0 = 100.  
    UDT still says choose rule ¬D.  

  **Result of Adjustment**: In the modified case, EDT and CDT still agree on declining, and UDT agrees. The evidential verdict didn't flip because the critical feature—being asked only in unfavorable branches—was decorative in the original. The core issue is that when I=true is possible when asked, EDT still sees strong evidence for I=false (P(I=false) is high prior), so donating remains bad. The acausal element (GiveWell's model) doesn't create a divergence; it only adds noise. The case collapses into standard blackmail, not counterfactual mugging.

  **Feature Doing the Work**: In your original construction, the feature that made I=false *certain* when asked was doing the work of forcing agreement. This is the blackmail pattern (payment is evidence of unfavorable state), not a novel acausal channel. When removed, EDT doesn't flip because the evidence still strongly favors I=false.

