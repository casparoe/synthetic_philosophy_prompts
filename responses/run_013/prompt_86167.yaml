prompt: |-
  I have taken the Clifford side of the ethics-of-belief dispute since the old blogosphere days — the position that a belief is permissible only when it is held on sufficient evidence, and that this holds always, everywhere, and for everyone. James I read as a fine stylist making an excuse for wanting things to be true. A friend who reads the same blogs has now handed me the following argument, and I cannot tell whether it is a genuine refutation or a trick with a slip in it, so I am passing it on.

  (1) A belief is permissible only if it is held on sufficient evidence.
  (2) Take any belief of mine that I regard as well supported. At this moment I am not running the supporting computations; I am relying on my past verdict that the evidence was sufficient.
  (3) That reliance is itself a belief — the belief that the evidence was sufficient — and by (1) it too must be held on sufficient evidence. The same question then arises for that belief, and for the next.
  (4) So the chain is either infinite or it terminates in something held without sufficient evidence. Either way, by (1), no belief is permissible.
  (5) Suppose instead that the chain terminates in something that is not a belief at all — a disposition, an entitlement, a way I happen to be wired. A state that is not held on evidence is not held on sufficient evidence, so by (1) it cannot make anything permissible; at most it explains why I cannot help myself.
  (6) The same reasoning covers the belief that my faculties are reliable, which I can support only circularly — memory by remembered successes, reasoning by arguments.
  (7) Therefore no belief is permissible. But that verdict is one no one can live by, and no one can even assert it without relying on beliefs he holds. So (1) is false: some beliefs are permissible without sufficient evidence, which is what James said.

  He calls this a clean reductio — any theory that forbids self-trust has already used self-trust to state its case — and he says the only honest responses are to join James or to stop talking. I find the conclusion convenient and therefore suspicious, and I would rather keep (1) than (7) if there is a way. But I do not want to keep (1) by mumbling about levels and circularity without saying what I am giving up.

  Tell me which step to reject, why that step looked so plausible that no one in the argument noticed it, and what rejecting it costs me. In particular: if I repair the principle so that self-trust survives, does anything remain of it that still condemns the credulous, the wishful, and the shipowner who talks himself into a seaworthy vessel — or does saving the one save all of them?
reasoning: |-
  Hmm, the user is presenting an argument against Clifford's evidentialism that claims to lead to a reductio ad absurdum. They're a long-time Clifford supporter who finds James' position suspiciously convenient, but this argument from a friend has them unsettled. The argument essentially says that if all beliefs require sufficient evidence, then even our trust in past judgments or cognitive faculties would need evidentiary support, leading to infinite regress or circularity. 

  The user wants me to identify which step to reject, explain why it seemed plausible, and clarify what rejecting it costs them. Crucially, they're worried that if they modify the principle to save self-trust, it might also save wishful thinking or negligent beliefs like Clifford's shipowner example. 

  This is actually a classic problem in epistemology - the Münchhausen trilemma about justification. The argument is clever because it exploits a real tension in strict evidentialism. Step (3) is where things start to go wrong, but the real issue is with how premise (1) is formulated. The argument treats all beliefs as requiring the same kind of active, conscious evidentiary support, which isn't how cognition actually works. 

  I should point out that rejecting step (3) doesn't mean abandoning evidentialism entirely. We can distinguish between occurrent beliefs (actively held) and dispositional beliefs (stored but not currently active). We rely on dispositional beliefs all the time without continuous verification - that's cognitive efficiency, not credulity. 

  The key is that for foundational cognitive capacities (like memory or reasoning), we're entitled to trust them defeasibly - meaning we trust them unless given specific reasons to doubt. This preserves Clifford's condemnation of the shipowner who ignores evidence, while avoiding the infinite regress. The shipowner case involves willful disregard of counterevidence, which is different from relying on ordinary cognitive functions. 

  The cost is that evidentialism becomes more nuanced - it can't be "always, everywhere, for everyone" in quite the absolute way Clifford imagined. But this modified version still condemns negligence when evidence is available or when doubts arise. That seems a reasonable price to pay to avoid the absurd conclusion.
answer: |-
  Your friend's argument is a sophisticated version of the epistemic regress problem, targeting Clifford's principle. It's clever but contains a critical flaw. Here’s how to dismantle it while preserving the core of Clifford’s ethics and condemning wishful thinking:

  ### Step to Reject: **Step (3)**
  - **What it claims:** The reliance on your past verdict (e.g., "I recall the evidence was sufficient") is itself a *belief* requiring independent evidence, triggering an infinite regress.
  - **Why it’s plausible:** It feels intuitive that *any* mental state involved in justification must be "held" as a belief subject to evidence. We conflate "relying on" a cognitive faculty with "forming a belief about" that faculty.
  - **Why it’s wrong:** Not all cognitive operations are "beliefs" requiring justification. **Self-trust in basic cognitive faculties (memory, perception, reasoning) is not a *belief* but a *precondition* for having justifiable beliefs at all.** It’s a non-propositional, operational commitment.

  ### What Rejecting Step (3) Costs You
  1. **Nuancing Clifford’s Principle:** You must accept that *some* foundational elements (e.g., trusting memory or logic) are **entitlements**, not beliefs justified by evidence. This modifies "always, everywhere, for everyone" to exclude preconditions of reasoning itself.  
  2. **Avoiding Circularity:** You abandon the demand for *non-circular* justification of basic faculties. Trusting memory to validate memory is pragmatically necessary.  
  3. **Conceding Limited Ground to James:** You agree that *in this narrow domain* (foundational cognitive operations), we rely on something akin to Jamesian "will to believe" — but *only* where evidence-gathering is impossible.  

  ---

  ### How to Repair Clifford’s Principle (Without Saving the Credulous)
  Revise (1) to account for epistemic starting points:  
  > **Revised Principle:**  
  > *"A belief is permissible only if it is held on sufficient evidence, except for the defeasible trust in one’s basic cognitive faculties, which is a precondition for evidence-based justification."*  

  This preserves the condemnation of credulity:  
  - **The Wishful Thinker** fails because they ignore *available* counterevidence when forming beliefs about the world.  
  - **The Shipowner** violates the principle by dismissing *specific, accessible evidence* (e.g., the ship's defects) due to motivated reasoning.  
  - **The Religious Credulous** (if Jamesian) is condemned if they believe *despite* counterevidence or without pursuing evidence where possible.  

  **Why the credulous aren’t saved:**  
  - Their beliefs (e.g., "God will heal me," "This ship is seaworthy") are *propositional claims about the world*, not meta-cognitive preconditions. These *can and must* face evidentiary scrutiny.  
  - Foundational trust is only exempt when:  
    - It concerns cognitive operations (not world-directed beliefs).  
    - There is no accessible defeaters (e.g., you’re not hallucinating or amnesiac).  

  ---

  ### Where the Argument Sneaks In a Trick
  - **The Equivocation:** Step (3) conflates two distinct things:  
    - **Belief-that:** "I believe the evidence was sufficient yesterday" (a proposition needing justification).  
    - **Reliance-on:** "I use my memory to recall past judgments" (a faculty enabling justification).  
    The latter isn’t a "belief" — it’s how minds function. We don’t "believe" in memory; we *use* it.  
  - **The False Dilemma:** Steps (4)–(5) assume *only* two options: infinite regress or blind faith. But foundationalism offers a third: **properly basic entitlements** that are rational starting points.  

  ---

  ### Defusing the "Self-Trust" Trap
  Your friend claims Clifford’s principle "forbids self-trust." Not so:  
  - Clifford’s principle *presupposes* self-trust (e.g., trusting logic to evaluate evidence).  
  - Forbidding *groundless world-directed beliefs* ≠ forbidding *trust in cognition*. The shipowner abuses self-trust to override evidence; you use it to access evidence.  

  ---

  ### Conclusion
  Reject Step (3) by denying that reliance on cognitive faculties is a "belief" requiring evidence. This costs you a purely *linear* evidentialism but saves Clifford’s core project: **You retain a robust principle condemning the credulous and negligent, while making space for the unavoidable foundations of reasoning.** James’ "will to believe" remains confined to where evidence is truly inaccessible (e.g., "God exists"), not as a blanket excuse for wishful thinking. The shipowner still sinks; the credulous still drown.  

  *Clifford’s ghost may grumble about "levels," but even rigor must rest on bedrock.*
