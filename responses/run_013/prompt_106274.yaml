  First, I need to understand their core idea. They argue that the arbitrary stopping point for consequences is a deeper problem than just practical unpredictability. They compared it to stopping rules in statistics. Their example involves two consequentialists who stop at different points and both claim to be right. The usual rule-consequentialism solution might not resolve this because the same problem applies to evaluating rules themselves.

