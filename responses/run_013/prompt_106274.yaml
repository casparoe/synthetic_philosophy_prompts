prompt: |-
  Hey, so I'm a junior in high school and I'm applying to this summer philosophy program at the local university, where they pair you with a grad student mentor and you have to submit a 4-5 page research proposal with the application. My teacher said it can be about basically anything conceptual as long as it's a real open question and not just a book report, and honestly I've been stuck on picking a topic.

  My half-baked idea, which I've been definately annoying my friends about at lunch: there's this old objection that consequentialism is kind of useless in practice because you can never know the long-run consequences of anything you do. Like, the cereal you eat for breakfast might set off some insane chain of events that affects an election in 200 years, so how is maximizing the good supposed to guide you day to day? Most people seem to treat this as a problem about prediction, as if better data or better models would fix it. But I think the interesting part isn't the predicting, it's the stopping. Nobody can tell me in a non-arbitrary way where the list of consequences you're answerable for is supposed to end. I've been thinking about it like the stopping rules in statistics, where you have to decide in advance when to stop collecting data, except here it's when to stop counting downstream effects, and there's no obvious equivalent of pre-registering the rule. And when I imagine two consequentialists who cut their lists off at different points and then act differently, each one seems to be able to claim they're right, which feels like a real problem and not just a practical one. The usual escape hatch — well, just follow rules that tend to be good and stop calculating case by case — might only push the same problem up a level, since you'd be just as clueless about which rules are best, and for the same reason.

  So can you turn this into an actual proposal for me? I need the question stated precisely enough that it has a right answer (my teacher keeps saying that), why the obvious responses don't settle it, what I'd actually do over 8 weeks — like week by week, I've got maybe 10 hours a week and a mentor who can meet every other week — at least one concrete worked case I can use as a test bench (something small and everyday, and maybe one bigger policy-ish one), and an honest section on what would make this fail: what result would mean I'd wasted my summer, or that the question was badly posed to begin with. Also say what the final deliverable is, I think a 4-5 page paper plus a 10 minute talk on the last day. Please don't put in any citations or a reading list, the application explicitly says not to and my teacher says we add those ourselves. I also haven't read any of the official literature on this, so don't assume I know specific arguments or names, just explain the ideas in plain language.
