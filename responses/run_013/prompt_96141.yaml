answer: |-
  Here’s a faithful restatement of Lewis’s account in your literary vocabulary, followed by a residue report addressing your core questions:

  ### Restatement in Literary Terms  
  **Lewis’s Convention:**  
  A *storytelling pattern* consistently used across a community of writers/readers, where:  
  1. **Regularity:** Everyone in the literary ecosystem (authors, readers, critics) *uses* this pattern.  
  2. **Mutual Expectation:** Every participant *assumes* others will use/recognize it (e.g., readers expect genre tropes; writers expect readers to spot foreshadowing).  
  3. **Preference Coordination:** All parties *prefer* to keep using it *only if others do*—not because it’s "best," but because deviation without warning breaks immersion (e.g., sudden sci-fi in Regency romance).  
  4. **Self-Sustaining:** It persists through *mutual reinforcement*, not editorial decree, marketing data, or explicit contracts.  

  ### Residue Report  
  **1. Intact Elements:**  
  - **Mutual Expectation ↔ "Contract with the Reader"**: Both rely on recursive anticipation (e.g., readers expect *you* to deploy tropes *because* they expect other writers to).  
  - **Preference Coordination ↔ Genre Expectations**: Subverting a trope (e.g., killing the Chosen One) works *only* if readers expect the trope’s usual payoff. Their frustration at deviation confirms the preference for coordination.  

  **2. Distorted Elements:**  
  - **Common Knowledge ↔ Trope Recognition**:  
    - *Lewis*: Requires infinite recursion ("I know you know I know..."). Solves *pure coordination problems* (e.g., driving sides).  
    - *Your Vocabulary*: Stops at first-order recognition ("readers know this trope"). Literary conventions often leverage *asymmetry* (e.g., unreliable narrators exploit readers *not* knowing what others know).  
    - **Key Difference**: Lewis’s common knowledge ensures predictability; literature often *breaks* predictability for effect. Pastiche/camp signal awareness *to the reader*, but don’t require readers to model *other readers’* awareness. The "twist everyone knows" (e.g., *Romeo and Juliet*’s ending) functions as a *shared reference*, not a coordination tool.  

  - **Establishment ↔ Emergence of Tropes**:  
    - *Lewis*: Conventions solve pre-existing coordination problems (e.g., "Which side of the road?").  
    - *Your Vocabulary*: Tropes often arise *without* a coordination problem—via authorial innovation (*Hamlet*’s soliloquies), market forces, or accidents. Literary "coordination" is retrospective: once a trope exists, *then* it coordinates expectations. The puzzle isn’t relocated—it’s *inverted*.  

  **3. No Counterpart:**  
  - **Pure Coordination vs. Aesthetic Value**: Lewis’s conventions are *arbitrary* (driving left/right are equally efficient). Literary conventions acquire *aesthetic weight* (e.g., "show don’t tell" isn’t arbitrary—it’s tied to immersion). This value distorts the preference structure: authors may break conventions *because* of artistic merit, not failed coordination.  
  - **Enforcement Mechanisms**: Lewis excludes top-down enforcement. Literary conventions *are* enforced by critics, algorithms, and sales data—blurring "mutual expectation" with institutional power.  

  ### Conclusion: The Gaps  
  - **Lewis’s Blind Spot**: Literary conventions aren’t *just* solutions to coordination problems. They accumulate cultural meaning, emotional resonance, and artistic intent—elements Lewis sidelines as "noise."  
  - **Your Vocabulary’s Blind Spot**: It struggles with *emergent, leaderless coordination*. Tropes may sustain via mutual expectation, but their *origin* often involves auteurs, gatekeepers, or historical accidents—forces outside Lewis’s model.  
  - **The Core Residue**: Literature treats conventions as *raw material for manipulation* (e.g., ironic deployment). Lewis’s model describes *equilibrium*; yours describes a *dialectic*. What he leaves out is the creative friction where conventions are both weaponized and shattered.  

  **Final Note**: Common knowledge in literature isn’t doing Lewis’s work—it’s a *narrative device*. His model clarifies *why* tropes persist, but your vocabulary reveals *how they breathe*: not as norms, but as living, breakable contracts.
