  I recall similar debates in functionalism. Multiple realizability means silicon minds should matter, but grain problems plague causal-role theories. The user might be conflating implementation (physical) with realization (functional role). Dennett's real patterns could help—privileging patterns that predict system behavior robustly. Church-Turing debates also show computation attribution depends on observer interests. 

  Wait, is the user assuming computation is observer-independent? That's tricky. Putnam pointed out a rock implements every computation, which undermines objectivity. Maybe emphasizing pragmatism: moral status emerges from properties that interact with us in morally relevant ways. Integration and self-representation might be such properties because they enable suffering or agency. 

  The user’s second assumption—moral weight attaches to computation—seems salvageable if tied to phenomenology or goal-directedness. But they need to drop the idea that physics alone picks “the” computation. Instead, they could argue that certain computational structures (like global workspace models) are necessary for conscious states, linking computation to experience. 

  I should also address their fear of subjectivism. Even if we pick a grain, it’s not arbitrary if constrained by science (e.g., neuroscience identifies integration scales). But ultimately, ethics isn’t physics—it interfaces with our values. Their criterion might work if framed as the best explanation for why we grant moral status, not a physics-derived fact. 

