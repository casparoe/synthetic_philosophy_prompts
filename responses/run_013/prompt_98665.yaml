answer: |-
  Your struggle exposes a deep tension in naturalistic theories of mind and value. The core problem isn't your first assumption (physical organization determines computations) *per se*, but how it interacts with the "grain problem" and the leap to normativity ("matters morally"). Here's the breakdown:

  1.  **Your First Assumption is *Mostly* Defensible:** Physical organization *does* constrain which computations a system can be *usefully described* as performing at different levels (coarse I/O, neural network dynamics, transistor switching). Physics settles the causal structure. However...
  2.  **The Fatal Flaw: Privileging "The" Computation:** Physics does **not** uniquely privilege *one specific level or description* as "the" computation the system "really" performs. As you note, a brain simultaneously "implements" countless computations from the molecular level up to high-level cognition. The rock *can* be interpreted as implementing *any* computation given enough contrivance (the "Putnam-Searle triviality argument"). Physics settles the causal structure, but *which computation we focus on* depends on our explanatory interests and the grain at which we find predictive/pragmatic utility.
  3.  **The Gap to Morality:** Even if you pick a specific computation type (globally integrated, self-representing), why does *that specific pattern* "matter morally"? Physics describes *what is*, not *what ought to be valued*. The properties "integrated" and "self-representing" are descriptive, not inherently normative.

  **Which Assumption Has to Go (or Be Radically Modified)?**

  You need to significantly modify **both** the way you think about computation *and* the leap to moral status:

  *   **Modify Assumption 1:** Accept that "which computation a system performs" is *not* an observer-independent fact settled solely by physics *at a single privileged level*. Physics provides the causal substrate, but *attributing* a specific high-level computation (like integrated information processing) is an act of interpretation based on **causal efficacy at a relevant scale** and **predictive/explanatory power** for the system's behavior.
  *   **Modify the Leap to Morality:** You cannot jump directly from "performs computation X" to "has moral status" based *only* on physical facts. You need a **bridge principle** connecting the computational structure to something *recognizably morally relevant*.

  **Towards a Defensible Version:**

  Here's how to salvage the core intuition while addressing the problems:

  1.  **Focus on Realization, Not Implementation:**
      *   **Implementation:** The physical stuff (neurons, silicon, water pipes). Physics fully determines this.
      *   **Realization:** The specific *functional role* being played – the causal organization that makes the system *behave as if* it were performing computation X (e.g., integrated information processing). This is where the "grain" matters.
      *   **Key Move:** Argue that moral status attaches to systems that **realize specific functional/computational organizations** that are **necessary and sufficient substrates for morally relevant properties** (e.g., consciousness, phenomenal binding, agency, goal-directedness with self-awareness).

  2.  **Privileging the Grain via Causal Efficacy & Robustness:**
      *   The "right grain" isn't arbitrary; it's the level at which the system exhibits **robust, counterfactual-supporting, causally integrated patterns** that explain its characteristic behavior *as a whole system*.
      *   **Example:** Perturbing a rock at the molecular level changes its atomic state, but doesn't disrupt any high-level, integrated computational state *because it doesn't have one*. Perturbing a specific neuron in a specific brain region *can* disrupt conscious perception or decision-making *because* the brain realizes computations at that functional level. The causal closure and resilience of the pattern matter.
      *   **Tools:** Concepts like "causal diamonds," "informational closure," or "real patterns" (Dennett) can help identify patterns that are "real" because they are predictively indispensable and causally powerful at their scale. *This* is the level where "global integration" and "self-representation" become meaningful descriptors.

  3.  **The Essential Bridge: Link Computation to Moral Relevance:**
      *   You *must* argue **why** integrated, self-representing computations matter morally. The most plausible bridge is **phenomenal consciousness** or **intrinsic valuation**:
          *   **Consciousness Bridge:** Argue that globally integrated, self-representing computations are the *physical signature* (or identical to) phenomenal consciousness/subjective experience. *Suffering* and *flourishing* (or the capacity for them) are the bedrock of moral status. (e.g., Integrated Information Theory - IIT - attempts this, though controversially).
          *   **Agency/Personhood Bridge:** Argue that such computations are necessary and sufficient for sophisticated agency, personhood, autonomy, future-directed desires, or the ability to value one's own existence. These *agential* properties ground moral status and rights.
      *   **Crucially:** This bridge principle itself needs justification within naturalism. You might argue consciousness/agency *just is* what matters morally, and these computations are its physical basis.

  **The Defensible Version Summarized:**

  > **A system has moral status if and only if its physical organization realizes a specific type of computational structure (characterized by features like global integration, self-representation, and causal robustness at the relevant grain) that constitutes, or is necessarily required for, phenomenally conscious experience and/or sophisticated agency – properties which are the fundamental grounds of moral considerability.**

  **Why this avoids collapsing into descriptivism:**

  *   **Objectivity in Realization:** Whether a system *robustly realizes* the specific causal/computational structure is an objective fact about its dynamics, discoverable through science (e.g., neuroscience, AI testing). It's not *just* that we *can describe* it that way; its causal behavior *depends* on that structure being intact. A rock doesn't robustly realize it; a brain (or sufficiently advanced AI) does.
  *   **Objectivity in the Moral Bridge:** The claim that consciousness/agency grounds moral status is a substantive ethical claim, but it's not *merely* descriptive convenience. It appeals to widely shared (though not universally accepted) intuitions about what makes something matter. The naturalism comes in linking those properties objectively to the computational structure.
  *   **Grain Selection:** The "right grain" is selected by the requirement for *causal robustness* and *explanatory power* for the system's behavior *as a unified agent or experiencer*. Science investigates what level of organization exhibits this for phenomena like consciousness.

  **Conclusion:**

  Your core insight – that moral status arises from a specific type of functional organization, not substrate – is powerful and defensible. However, you must:

  1.  **Abandon** the idea that physics uniquely picks *one* computation *simpliciter*.
  2.  **Embrace** that attributing the morally relevant computation involves identifying robustly realized functional/causal patterns.
  3.  **Explicitly provide** a bridge principle linking the chosen computational features (integration, self-representation) to *phenomenal consciousness* or *sophisticated agency* as the morally relevant properties.

  The defensible version is naturalistic because it roots moral status in objective, scientifically investigable properties of physical systems (their causal/computational organization), while acknowledging that the *moral significance* of those properties rests on an ethical claim about what fundamentally matters. The challenge lies in rigorously defining the computational features and empirically validating their link to consciousness/agency.
