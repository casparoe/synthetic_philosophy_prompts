prompt: |-
  Ok, so I'm a third-year PhD student in cognitive science and I've got a weird problem: I use causal talk constantly (I ablate units, I write "the population is what drives the readout"), but I've realised I don't actually have a spec for what a theory of causation is even supposed to deliver. I've just been accumulating fragments — a bit of Lewis here, a bit of Woodward there — and I can't tell whether the disagreements are about the phenomena or about what everyone's trying to build. So before I read one more paper on preemption, give me the desiderata. What does any adequate theory of singular/token causation have to get right? I want the cases it must handle, the distinctions it isn't allowed to collapse (causing vs. enabling vs. merely being a background condition; causing an event vs. explaining it; being a cause vs. being a difference-maker; degree or proportionality vs. on/off; the fact that causal asymmetry doesn't just read off the equations), and the constraints it can't violate (it shouldn't make causation everywhere or nowhere; it shouldn't presuppose that everything relevant is deterministic, or that everything relevant isn't). For each requirement, give me the case or consideration that motivates it, and flag which requirements are non-negotiable and which are really just preferences of a camp — I suspect 'no causation by omission' and 'causation is transitive' are the latter, but tell me if I'm wrong about that.

  The reason I want the list and not another theory is that the cases I actually care about seem to pull in different directions, and I need to know which of them are genuine tests of a theory and which are just my confusions. Four that I keep hitting. (1) I zero a unit in a trained network and the class prediction flips — but zeroing it also perturbs everything downstream, and there's a redundant pathway that would have taken over if the thing had been trained on a slightly different sample, so the "intervention" isn't clean and I can't tell if that's a real problem or just old preemption wearing a lab coat. (2) I have a recurrent circuit where unit A's sustained firing depends on B's and B's on A's, both are but-for causes of the readout, and neither is upstream of the other. (3) The behaviour is carried by a group of about forty units: knock out any one and nothing changes, knock out all forty and it's gone — is the group a cause, and if so is that a different kind of causation or the same kind at a coarser grain? (4) In a detector I study, what the downstream reader uses is a unit's silence — zero spikes at a particular moment — and if that unit had fired, the animal would of made the other choice. That looks like causation by absence, which half the theories seem to want to outlaw by fiat.

  So: the requirements, with the case behind each, sorted into load-bearing and parochial, plus any subset you think is jointly unsatisfiable (that's the part I most want — if two things on the list can't both be had, the list itself is the result), and then tell me which single requirement does the most work, i.e. which one most of the going theories fail. After that, a couple of sentences each on how a bare counterfactual-dependence account and a Woodward-style interventionist account do against the list, since those are the two I keep oscillating between — keep the scoring short, I'll do the full scorecard myself. Lead with your bottom line in the first sentence, then the reasoning, no throat-clearing and don't restate my question. And tell me where you're least confident: what would change your mind about the list, and if you think half of it is one tradition's prejudices dressed up as adequacy conditions, say which half.
reasoning: |-
  Alright, let's tackle this user's query. They're a third-year PhD student in cognitive science struggling with the foundations of causation. They need a clear set of desiderata for a theory of singular causation, especially given their practical cases involving neural networks and circuits. 

  First, I need to identify their main request: a list of must-handle cases, key distinctions, and constraints. They also want to know which are non-negotiable versus parochial, and if any desiderata conflict. Their four specific cases highlight real-world complexities like preemption, circular dependence, group causation, and causation by absence.

  Breaking down the core issues. The user feels they've been collecting philosophical fragments without a framework. Their examples show they're dealing with interventionist methods in neural networks, where standard causal models might stumble. For instance, unit ablation causing prediction flips but with messy downstream effects—this resembles preemption. The recurrent circuit with mutual dependence challenges directionality. The group effect where individual removals don't matter but the whole does raises questions about granularity. And the silence-as-cause issue directly confronts omission theories.

  Next, considering the desiderata. Starting with non-negotiables: token causation (specific events), distinction between causing vs enabling/background, difference-making, asymmetry, and handling indeterminism. These are foundational because without them, the theory fails in real applications. For example, in their neural network, if a theory can't distinguish between a unit causing a change versus just enabling it, the analysis falls apart.

  Then, negotiable desiderata. Transitivity is contentious—some theories enforce it, but their recurrent circuit case shows circular causation where transitivity might not hold. Causation by omission is another; their detector case relies on silence causing an outcome, so banning omissions would invalidate their model. Proportionality varies by context; sometimes coarse-grained causes are sufficient, other times fine-grained details matter.

  Conflicting desiderata are crucial. Token causation vs proportionality: detailing specific events might conflict with abstracting to higher levels, as in their group causation case. Causation by omission vs purity: if omissions are allowed, it might lead to overcounting causes, but banning them ignores real cases like the silent unit.

  The user's cases test these desiderata. The ablation with redundant pathways (case 1) challenges preemption handling. The recurrent circuit (case 2) tests circular causation and transitivity. Group causation (case 3) probes granularity and proportionality. The silent unit (case 4) directly challenges omission theories.

  For counterfactual theories, they handle token causation and difference-making well but struggle with preemption and asymmetry. Interventionist accounts excel with difference-making and interventions but falter with omissions and circular cases. Neither fully satisfies all non-negotiables, especially asymmetry without equations.

  The user's deeper need is clarity on which philosophical battles are necessary for their work. They need to know where to compromise—maybe accepting omissions in their detector model despite some theories rejecting them. Recognizing which desiderata are non-negotiable in their context (like handling indeterminism in neural networks) versus those they can set aside (like transitivity) will streamline their approach.

  In summary, structuring the response around the desiderata, highlighting conflicts, and applying them to the user's cases provides actionable insight. Emphasizing that some conflicts are unavoidable helps them make informed choices in their research without getting bogged down in unresolvable philosophical debates.
answer: |-
  Here’s the bottom line: **An adequate theory of singular causation must handle token events, distinguish causing from enabling/background conditions, capture difference-making, explain causal asymmetry without relying solely on equations, and work under indeterminism; but it cannot satisfy all desiderata simultaneously, with token causation vs. proportionality and omission tolerance vs. purity being key tensions.**

  ### Core Desiderata (Non-Negotiable for Adequacy)
  1. **Token Causation**  
     - *What it must do:* Explain specific events (e.g., "Unit A’s ablation *caused* the prediction flip in *this* trial").  
     - *Motivating case:* Your ablation experiments (Case 1, 4).  
     - *Why non-negotiable:* Without this, the theory can’t address real-world interventions.  

  2. **Distinguish *Causing* vs. *Enabling/Background Conditions***  
     - *What it must do:* Separate the spark (cause) from the dry tinder (enabler).  
     - *Motivating case:* Knocking out one unit in a group (Case 3) is background; knocking out all is causing.  
     - *Why non-negotiable:* Collapsing these makes everything a cause, destroying explanatory utility.  

  3. **Difference-Making**  
     - *What it must do:* Identify factors where change alters the outcome.  
     - *Motivating case:* Zeroing a unit flips the prediction (Case 1, 4).  
     - *Why non-negotiable:* Central to scientific inference and intervention.  

  4. **Causal Asymmetry**  
     - *What it must do:* Explain why causes precede/affect effects, but not vice versa, without appealing to equation syntax.  
     - *Motivating case:* Your recurrent circuit (Case 2) – mutual dependence ≠ symmetry of causation.  
     - *Why non-negotiable:* Asymmetry is fundamental to causal reasoning (e.g., interventions).  

  5. **Indeterminism Compatibility**  
     - *What it must do:* Work in stochastic systems (e.g., neural firing).  
     - *Motivating case:* Neural noise, probabilistic decisions (implied in Case 4).  
     - *Why non-Negotiable:* Reality isn’t deterministic; theories requiring determinism fail empirically.  

  ---

  ### Contentious Desiderata (Parochial or Theory-Dependent)
  6. **No Causation by Omission**  
     - *Status:* Preference (e.g., Lewis, process theories).  
     - *Motivating conflict:* Your detector (Case 4) – silence *is* causal. Banning omissions invalidates such cases.  
     - *Why negotiable:* Useful for avoiding triviality (e.g., "not oxygen" as cause), but empirically inadequate for systems like yours.  

  7. **Transitivity**  
     - *Status:* Preference (e.g., counterfactual theories).  
     - *Motivating conflict:* Preemption (Case 1) – if A causes B and B causes C, but A preempts B, is A a cause of C? Theories diverge.  
     - *Why negotiable:* Violated in some physical systems (e.g., quantum mechanics) and neural circuits with feedback (Case 2).  

  8. **Proportionality/ Grain-Sensitivity**  
     - *Status:* Preference (e.g., Woodward).  
     - *Motivating conflict:* Group causation (Case 3) – is the *group* the cause, or must we specify *which* units?  
     - *Why negotiable:* Coarse-graining (group) vs. fine-graining (units) depends on explanatory context.  

  ---

  ### Key Tensions (Jointly Unsatisfiable)  
  - **Token Causation vs. Proportionality:**  
    Token causation demands specificity (e.g., "Unit A fired at t1"), but proportionality often requires abstraction (e.g., "The population drove the readout"). Your Case 3 forces this choice: is the group a token cause?  
  - **Omission Tolerance vs. Purity:**  
    Tolerating omissions (Case 4) captures scientific practice but risks overgeneration (e.g., "lack of rain caused the crash"). Purity avoids this but ignores causal absences in mechanisms.  

  ---

  ### Highest-Impact Desideratum: **Causal Asymmetry**  
  Most theories (including counterfactual/interventionist) fail this by smuggling asymmetry into semantics (e.g., Lewis’s temporal ordering) or intervention primitives. Your recurrent circuit (Case 2) exposes this: symmetric dependence requires asymmetric causation.  

  ### Quick Theory Scorecard  
  - **Bare Counterfactual Dependence (Lewis-style):**  
    ✅: Token causation, indeterminism.  
    ❌: Asymmetry (relies on temporal order), preemption (Case 1), omissions (Case 4), proportionality (Case 3).  
    🔄: Transitivity (optional but often assumed).  

  - **Interventionist (Woodward-style):**  
    ✅: Difference-making, enabling/causing distinction, proportionality.  
    ❌: Circular causation (Case 2; interventions assume acyclicity), omissions (Case 4; interventions on absences are ill-defined).  
    ⚠️: Asymmetry (built into intervention framework, not derived).  

  ---

  ### Where I’m Least Confident  
  **The omission/proportionality divide.** If neuroscience consensus treats silence as causal (Case 4), omission tolerance becomes non-negotiable. Conversely, if your group causation (Case 3) *requires* coarse-grained causes (e.g., for explainable AI), proportionality shifts from preference to core. **Suspect parochialism:** Traditional distinctions (causing/enabling) may be artifacts of folk physics; mechanistic accounts (Glennan) might dissolve them.  

  ### Your Cases Resolved via Desiderata  
  1.  **Preemption (Case 1):** Test of token causation + preemption handling. Interventionism handles redundancy via modularity.  
  2.  **Recurrent Circuit (Case 2):** Test of asymmetry + anti-transitivity. Requires dynamics-aware theories (e.g., conserved quantity).  
  3.  **Group Causation (Case 3):** Test of proportionality. Interventionism wins; counterfactuals struggle without coarse-graining.  
  4.  **Silence (Case 4):** Test of omission tolerance. Bare counterfactuals allow it; interventionists reject it unless formalized as "zero-activity" events.  

  **Actionable Takeaway:** Prioritize difference-making and asymmetry. For neural systems, *extend* interventionism: define "silence" as a variable state and use cyclic models for feedback. Abandon transitivity; treat omissions as contextually valid.
