  - **Hahn-Banach theorem**: For general spaces, equivalent to BPI (weaker than AC). For separable spaces, it follows from weaker principles. The constructive mathematician will challenge you if you imply it needs full AC.
  - **Tychonoff for compact Hausdorff spaces**: Equivalent to AC for arbitrary products, but for Hausdorff spaces, it's equivalent to BPI. The set theorist will correct you if you conflate it with the general Tychonoff theorem (which is equivalent to AC).
