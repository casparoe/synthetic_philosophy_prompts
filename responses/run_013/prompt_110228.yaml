answer: |-
  That's an incisive critique of a core tension in regulatory cost-benefit analysis (CBA). Let's break down the presuppositions, tensions, and theoretical vulnerabilities:

  **Core Presuppositions about Utility:**

  1.  **Revealed Preference as Sovereign:** The labor market approach fundamentally assumes that **choices reveal true, stable, and well-ordered preferences.** If a worker demands $X extra to accept a 1/10,000 higher annual risk of death, this is interpreted as revealing their *actual* valuation of their own life/risk. This presupposes:
      *   **Rationality:** Workers accurately perceive risks, understand probabilities, and make optimal trade-offs.
      *   **Stable & Well-Ordered Preferences:** Preferences over money and risk are consistent, transitive, and complete.
      *   **Self-Knowledge:** Workers know their own preferences and valuations.

  2.  **Stated Preference as a Valid Proxy:** Using survey responses (Contingent Valuation Method - CVM) for non-market goods presupposes:
      *   **Hypothetical Choices Reflect Real Preferences:** People can accurately imagine a hypothetical market and state their true willingness-to-pay (WTP) or willingness-to-accept (WTA) compensation, even for complex, unfamiliar, or existential goods (like a species or clean air).
      *   **Commensurability:** The WTP values derived from surveys are *directly comparable* to the dollar values derived from actual market choices (like wage premiums). This assumes a single, universal "utility currency" that both market and non-market goods translate into.
      *   **Interpersonal Comparability:** Aggregating individual WTP values into a social value assumes we can meaningfully add up and compare the utilities of different people (a core, often unstated, tenet of utilitarianism applied in CBA).

  3.  **Utility as Choice-Based Welfare:** **The practice fundamentally defines welfare (utility) as being synonymous with satisfying expressed preferences, revealed or stated.** It presupposes "what people choose *is* what is good for them" (a form of *preference-satisfaction welfarism*).

  **Does the Practice *Need* These Assumptions?**

  *   **Strictly, Yes:** The *current methodology* of plugging both numbers into the same CBA table absolutely relies on these assumptions. Treating the wage premium for risk and the WTP for a cleaner river as directly comparable dollar figures inherently assumes:
      *   Both reflect underlying, stable preferences.
      *   Preferences can be accurately elicited (revealed in markets, stated in surveys).
      *   Utility is cardinal and comparable across individuals and goods.
      *   Satisfaction of these preferences *is* welfare.

  *   **Could It Run on a Different Theory? Conceptually, Yes, But Practically Difficult:** You could theoretically construct a CBA framework based on a different welfare theory, but it would look very different:
      *   **Objective List Theory (e.g., Capabilities Approach):** Value might be assigned based on the contribution of the policy to achieving specific objective goods (health, biodiversity, clean water access) deemed intrinsically valuable, *regardless* of individual WTP. This would require normative judgments about which goods matter and how to weight them, moving away from preference aggregation.
      *   **Paternalistic/Perfectionist Views:** Regulators might explicitly override revealed/stated preferences if deemed "mistaken" based on objective criteria (e.g., health experts valuing clean air higher than smoker's revealed preference via housing choices). This clashes with the core liberal foundation of current CBA.
      *   **Behavioral Welfare Economics:** Could attempt to "de-bias" preferences – correcting market choices for risk misperception or survey responses for hypothetical bias, anchoring, etc. – to estimate "true" underlying preferences or welfare. This acknowledges mistakes but still tries to anchor welfare in (corrected) preferences.
      *   **Non-Utilitarian Aggregation:** Instead of summing WTP, use different aggregation rules (e.g., focusing on worst-off, sufficiency thresholds). However, this abandons the dollar-metric comparison central to current CBA.
      *   **Incommensurability:** Accept that some values (like species existence) might be fundamentally incomparable to market goods on a single dollar scale. This would severely limit the scope of traditional CBA.

  **The Tension: Mistakes, Bias, and Double Standards**

  You've perfectly identified the core hypocrisy:

  1.  **Market Choices as "Gospel":** Labor market valuations are treated as largely reliable, assuming rational actors with good information. Concerns about **worker misperception of risk, lack of alternatives, bargaining power imbalances, or systematic cognitive biases** (e.g., optimism bias) are often downplayed or ignored. This implicitly rules out the idea that workers can be *seriously mistaken* about the risk-money trade-off in a way that undermines welfare.
  2.  **Survey Choices as Suspect:** Regulators are acutely aware of **hypothetical bias** (people state higher WTP in surveys than they'd actually pay), **strategic bias** (under/overstating to influence outcomes), **embedding effects** (WTP for a part vs. the whole), **information effects**, and the difficulty of valuing unfamiliar goods. Agencies *do* apply corrections and validation tests to survey data, acknowledging its inherent flaws.
  3.  **The Inconsistency:** The core tension lies in **treating one set of elicited preferences (market) as robust evidence of "true" welfare, while simultaneously acknowledging the severe flaws in another method (surveys) that relies on the *same fundamental assumption* – that elicited preferences reveal welfare.** Why is the hypothetical nature of surveys so problematic for reliability, while the potential for misperception, coercion, or context dependence in labor markets is largely brushed aside? This suggests an unexamined ideological preference for markets over other forms of preference elicitation.

  **Conclusion:**

  The practice presupposes a specific, narrow view of utility: **welfare is defined solely by the satisfaction of stable, well-ordered preferences revealed through choices (actual markets) or stated as if in a market (surveys), and these preferences can be aggregated into a single, comparable dollar metric.** It heavily relies on assumptions of rationality, self-knowledge, and commensurability.

  While alternative welfare theories *could* inform CBA, they would necessitate abandoning the core feature of current practice: the direct comparison of market and non-market valuations through a single dollar metric. The inconsistency in treating market choices as reliable while fretting over hypothetical bias in surveys highlights a deep, often unacknowledged, tension. It reveals an implicit bias favoring market mechanisms and a reluctance to fully confront the possibility that people can be mistaken about their own good, *especially* when those "mistakes" are revealed through the sacred mechanism of the market. The practice quietly rules out the idea of significant welfare-relevant mistakes in market contexts while explicitly building in safeguards against them in survey contexts.
