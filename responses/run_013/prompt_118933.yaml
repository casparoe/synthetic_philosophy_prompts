answer: |-
  ### Preliminary Framework  
  **(a) Contract Formation (Anglo-American Doctrine):**  
  Contract formation requires **mutual assent** (objectively manifested as offer + acceptance) plus **consideration** (bargained-for exchange of legal value). Assent must be communicated or reasonably inferable from conduct; silence is generally non-assent. The agreement must be sufficiently definite, and parties must intend legal consequences. Enforcement mechanisms (damages, specific performance) presuppose causal capacity to perform/breach.  

  **(b) Acausal Trade (Decision-Theoretic Claim):**  
  Two agents, incapable of communication or causal influence, select actions *as if* trading. Each agent’s policy maximizes expected utility *conditional* on predicting the other’s policy. Correlation arises from shared decision rules/priors, making one agent’s choice *logical evidence* (not a cause) of the other’s. Both end up better off than in the non-cooperative baseline, despite no interaction.  

  **Where Mapping Strains:**  
  - Assent without communication  
  - Exchange without mutual inducement  
  - Enforcement without causal levers  
  - "Agreement" as mutual prediction, not mutual commitment  

  ---

  ### Translation: Element by Element  
  1. **Agents → Parties**  
     - *Clean translation*. Both frameworks presuppose rational actors pursuing interests.  

  2. **Policies → Terms of Agreement**  
     - *Clean translation*. The selected actions (e.g., "Agent A shares data; Agent B shares compute") map to contractual performances.  

  3. **Maximizing Expected Utility → Mutual Economic Benefit**  
     - *Clean translation*. Both doctrines center on reciprocal gain (cf. *consideration* as "benefit/detriment").  

  4. **Conditional on Other’s Predicted Policy → Implied-in-Fact Terms**  
     - **Distortion (Replaces Communication with Prediction)**.  
       Contract law infers terms from *conduct, custom, or prior dealings* (e.g., *Wood v. Lucy*). Acausal trade infers terms from *logical correlation of abstract decision rules*. The latter lacks a "meeting of the minds" — it’s unilateral optimization, not mutual understanding.  

  5. **Correlation via Shared Decision Rules/Priors → No Counterpart**  
     - **No translation**. Contract law has no mechanism for "entanglement" via algorithmic symmetry. The closest analogue (custom/usage under UCC 1-303) requires *actual practice*, not theoretical priors.  

  6. **Better Off Than Baseline → Consideration’s "Legal Value"**  
     - **Distortion (Detaches Benefit from Bargain)**.  
       Consideration requires that gain be *bargained for* (e.g., *Hamer v. Sidway*). Acausal "trade" lacks bargaining: each party’s gain is a byproduct of independent optimization, not inducement. Peppercorn theory fails here — no "exchange" occurs.  

  ---

  ### Core Tensions: Your Specific Queries  
  **Offer & Acceptance w/o Communication:**  
  - *No translation*. Offer requires outward manifestation (*Restatement §24*); acceptance requires assent "in a manner invited by the offer" (§50). Prediction is not manifestation. Objective theory fails — no "reasonable person" could interpret silence/inference as assent (*Day v. Caton*).  

  **Correlation as Consideration?**  
  - *No*. Consideration demands a *quid pro quo* exchange. Correlation is not bargained for; it’s epistemically coincidental (*Dougherty v. Salt*). No detriment is incurred as price for a promise.  

  **Bargained-for Exchange by Inference?**  
  - *Distortion (Collapses Bargain into Conjecture)*. Bargaining presupposes mutual awareness of negotiation (e.g., *Lucy v. Zehmer*). Inference absent signaling is unilateral, not interactive.  

  **Breach & Remedy w/o Causal Levers:**  
  - *No counterpart*. Breach requires causal capacity to withhold performance; remedies assume causal power to compel/deter. Acausal "breach" is incoherent — neither party can defect or enforce.  

  **Is This "Trade"?**  
  - **Equivocation**. It is *exchange-like mutual optimization* but lacks:  
    - Communication (essential for offer/acceptance)  
    - Reliance (no vulnerability to breach)  
    - Enforceability (no sanctions)  
    Call it "mutually beneficial prediction alignment," not trade.  

  ---

  ### Asymmetric Variant (Disparate Capacity)  
  - **Peppercorn Theory**: Fails. The powerful party’s trivial "cost" might resemble a peppercorn, but no bargain occurs — the weaker party offers nothing *in exchange*.  
  - **Unconscionability**: Irrelevant. No procedural unfairness (no communication to exploit) and no substantive imbalance (gains are Pareto-improving).  
  - **Consideration Doctrine**: Nails the flaw. If cooperation costs the powerful party nothing, the weaker party’s "benefit" is not *bargained for* — it’s a unilateral gift (*Kirksey v. Kirksey*).  

  ---

  ### Residue: Contract Law Concepts w/o Acausal Counterpart  
  1. **Reliance**: Central to promissory estoppel (§90) and damages (e.g., *Hadley v. Baxendale*). Acausal trade has no reliance — neither party acts *because of* the other’s promise.  
  2. **Unforeseen Contingencies/Gap-Filling**: Courts imply terms for unanticipated events (*UCC 2-615*). Acausal policies are fixed ex ante; no mechanism for adaptation.  
  3. **Assignment of Risk**: Contract law allocates unforeseeable losses (e.g., *Peevyhouse v. Garland Coal*). Acausal trade assumes perfect priors; risk is unmodeled.  
  4. **Absent Party vs. Silent Party**: An absent party (e.g., non-signatory) can be bound via agency/estoppel. Acausal trade requires both parties to actively *exist and compute* — silence is not just refusal but ontological irrelevance.  

  **Why Gaps Matter**: These omissions reveal acausal trade’s limits: it cannot model *dynamic uncertainty* or *vulnerability*, which are core to contract law’s function.  

  ---

  ### Verdict on the Residue  
  **Defect of Contract Law? No. Defect of Acausal Trade’s Vocabulary? Yes.**  
  Contract law is not parochial; it is *functionally adapted* to a world of communication, reliance, and enforcement. The acausal-trade position overreaches by calling prediction-alignment "trade." This equivocation masks a key weakness: **it cannot distinguish between *coincidental* mutual benefit and *obligational* exchange**.  

  **The Claim That Must Weaken**:  
  > *"This constitutes a genuine exchange rather than a fortunate coincidence of preferences."*  

  For translation to survive, "genuine exchange" must become **"mutually beneficial policy correlation."** The moment "trade," "agreement," or "contract" enters, contract law’s scaffolding (offer/acceptance, consideration, breach) collapses. Acausal trade is a brilliant account of *why rational agents might act cooperatively without contact*, but it is not a theory of contract. It is, at best, a prelude to one.  

  **Final Note for the Practitioner**:  
  This is not a flaw in your vocabulary but in their metaphor. Contract law’s doctrines are knives sharpened for real-world flesh; acausal trade is a laser calibrated for abstract vacuum. Neither is defective — but one cannot cut what the other illuminates.
