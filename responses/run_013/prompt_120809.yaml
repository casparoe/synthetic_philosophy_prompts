prompt: |-
  Here's the setup: 16 undergrads, one 90-minute slot in a seminar on concepts and analogy, and one idea I want them to feel in their bones rather than hear me say. The idea is that applying a concept isn't applying a rule. Take the little microworld Hofstadter's group built Copycat in — strings of letters, puzzles like "abc → abd, so ijk → ?" — where solving one of these turns out to be a pile of tiny local decisions about how to carve the string up (what counts as one unit, which position is doing the work, what exactly the change is a change of), with the answer falling out of those decisions. Which means your concepts can slide under you halfway through a problem and you won't notice, and two people who both "get the rule" can land on different answers with neither of them being sloppy or dumb. I want the room to feel that, not be told it. Ideally they come away unable to say what the rule was, while still feeling that their own answer was obviously right.

  So design the activity. No lecture up front, no vocabulary up front — they shouldn't hear the word slippage, or the name Hofstadter, untill the debrief.

  What I've been sketching, take it or leave it:

  - Materials: index cards, pens, one printed sheet of four or five puzzles, a big visible timer, a whiteboard for scores. No computers.
  - Puzzle set, in this order: (1) abc → abd, ijk → ? (2) abc → abd, xyz → ? (the obvious move is blocked by the end of the alphabet) (3) abc → abd, mrrjjj → ? (here's the one where it matters whether a unit is a letter or a group) (4) abc → dbc, ijk → ? (5) abc → abd, aabbcc → ?. Everyone agrees on the first. By (2) or (3) they shouldn't.
  - A slip mechanic: everyone holds three cards, each naming a dimension they're allowed to let move — which letter gets changed, what counts as one unit, direction, whether the relation is a step in the alphabet or a sameness/difference. Playing a card is legal and costs points, but your answer has to be re-derived after you play it, not patched.
  - A temperature board. Each table reports, after each puzzle, how well their reading hangs together on a 0–10 scale. High temperature means they're not done — they keep revising until it drops or the timer runs out.
  - Two currencies that pull against each other: points for landing on the same answer as other tables, and points for a low temperature (a reading that hangs together with nothing left over). I want the tension to be real — an answer that fits beautifully but that nobody else gives should feel like a live option, and so should a popular answer that needs an ugly patch.
  - Tables of four, one committed answer and one sentence of justification per round, and no adjudication from me, ever, even if they beg.

  Then the debrief, which is where I do the actual work: map what happened onto the model — the tiny local decisions as codelets, the sliding of concepts as activation spreading through a network so that neighboring concepts bleed into each other, the temperature as the program's running sense of how well the pieces cohere and the fact that it just keeps going until that score drops, and the fact that nowhere in the machine is there a stored rule and nowhere in the room was there a judge. Plus why Hofstadter thought this was the core of cognition and not a puzzle trick.

  Tell me the full rules, a timeline for the 90 minutes, how the scoring works without real money, the exact debrief moves, what will predictably go wrong the first time I run it and how to handle it, and — honestly — which part of the idea the activity can't reproduce. I already suspect the big one: sixteen people arguing in a room is going to feel like there's somebody deciding, and Copycat has no decider, just thousands of dumb processes whose aggregate settles. If there's a way to stage it that gets closer to that, I want it. And I know I lose whatever comes from concepts having real perceptual content — the letter world is thin on purpose, so tell me what the thinness costs me.
reasoning: |-
  We are designing an activity for 16 undergraduates to experience the idea that applying a concept isn't applying a rule, using a modified version of the Copycat domain (letter string analogies). The activity should avoid upfront lectures and vocabulary, and instead let the students feel the concept slippage and the emergence of answers from local decisions.

  Key elements from the sketch:
  - Materials: index cards, pens, printed puzzle sheets (with 5 puzzles), timer, whiteboard for scores.
  - Puzzles: 
    1. abc → abd, ijk → ? (easy, consensus expected)
    2. abc → abd, xyz → ? (end of alphabet blocks obvious move)
    3. abc → abd, mrrjjj → ? (unit definition: letter vs. group)
    4. abc → dbc, ijk → ? (change at beginning)
    5. abc → abd, aabbcc → ? (grouping and repetition)
  - Slip mechanic: Each table has three cards (initially) that represent dimensions they can change. Dimensions: 
    - Which letter gets changed (the "focus")
    - What counts as one unit (the "grouping")
    - Direction (left-to-right, right-to-left, etc.)
    - The relation (alphabet step vs. sameness/difference, etc.)
    Playing a card allows them to change that dimension for the current puzzle. It costs points, and they must re-derive the answer after playing the card (not patch).

  - Temperature board: Each table reports a temperature (0-10) after each puzzle, representing how well their reading coheres (0 = very coherent, 10 = incoherent, many loose ends). They keep revising until temperature drops or time runs out.

  - Two currencies:
    - Unity points: for having the same answer as other tables (or as many as possible). 
    - Coherence points: for low temperature (coherent reading).

  - Structure: Tables of 4 students. Each round (per puzzle) they produce one committed answer and one sentence of justification. No adjudication from the instructor.

  - Debrief: After the activity, explain the underlying model (codelets, activation spreading, temperature as coherence, no stored rule, no central judge). Connect to Hofstadter and the core of cognition.

  Now, we need to design the full rules, timeline, scoring, debrief, and anticipate problems.

  Full Rules:

  1. Setup:
     - Divide 16 students into 4 tables (4 students each).
     - Each table gets:
          - A set of 3 slip cards (each card has one dimension: e.g., "Focus", "Grouping", "Direction", "Relation"). [Note: We have 4 dimensions but only 3 cards? We can have 4 dimensions and each table gets 3 cards, but they can only use one of each dimension? Alternatively, let each table have a hand of 3 cards, and each card is one of the four dimensions. They can have duplicates? Or we can have a fixed set of 4 dimensions and they get 3 cards, meaning one dimension is missing? Alternatively, let them have one card for each dimension? But the sketch says three. Let's stick to three and have four dimensions, so they are missing one. That adds strategy: they cannot change the dimension they don't have a card for.]

     However, to keep it simple, let's have four dimensions and each table has one card for each of three dimensions (so they are missing one). The dimensions are:
       - Focus (which letter/group is the target of change)
       - Grouping (what counts as a unit: single letter, same letter group, etc.)
       - Direction (the direction of the change: e.g., left-to-right, right-to-left, or even top-to-bottom if we had a 2D structure, but here it's linear)
       - Relation (the type of change: e.g., increment, decrement, change to same, etc.)

     But note: the puzzles might not use all dimensions. We can adjust.

     Alternatively, to avoid confusion, we can have a standard set of three dimensions that are always available and let the cards be tokens that allow a change. We'll go with:

     Each table has three slip cards, each with one of the following labels (we have four possible, but they get only three? Or we can have four types and they choose three to have? Better: we have four dimensions, and each table randomly gets three of them. So one dimension is fixed and cannot be changed for them? That might be too constraining.

     Revised: We have four dimensions. Each table gets a hand of three cards, but the cards are not dimension-specific. Instead, when they want to change a dimension, they play a card and declare which dimension they are changing. They can change any dimension, but playing a card costs points and they are limited by the number of cards (they start with three and might earn more? or not). They can only play one card per puzzle? Or per revision? We need to define.

     Let's simplify: 
     - Each table starts with 3 slip tokens (not dimension-specific). 
     - When they want to change a dimension (any of the four) during their reasoning for a puzzle, they can play one token to do so. They must then re-derive the answer from scratch under the new setting for that dimension. 
     - They can play multiple tokens in one puzzle (for different dimensions or even the same one again? but that might be overkill). We can say: one token per dimension change per puzzle. And they can change multiple dimensions in one puzzle by playing multiple tokens.

     But note: the sketch says "playing a card is legal and costs points, but your answer has to be re-derived after you play it, not patched". So we'll have:

     - Each table has 3 slip tokens at the beginning of the game (for the whole session? or per puzzle? per puzzle might be better because they are independent). Let's do per puzzle: they get 3 tokens per puzzle. They can use up to 3 tokens per puzzle.

     - When they use a token, they must specify which dimension they are changing and then re-derive the answer without using the previous answer (start over).

     - The dimensions are:
          1. Focus: Which part of the string is the target of the change? (e.g., the first letter, the last letter, the middle, a group of same letters, etc.)
          2. Grouping: How do we group the string? (e.g., each letter is a unit, or groups of consecutive same letters, or fixed-size groups? For the puzzles, we'll see what makes sense.)
          3. Direction: In what direction is the change happening? (e.g., left-to-right, right-to-left, inside-out, etc.)
          4. Relation: What is the nature of the change? (e.g., increment the letter, decrement, change to a specific letter, change to the next same group, etc.)

     However, note that the dimensions might interact and might not be independent. That's part of the point.

  2. Process per puzzle:
     - The puzzle is presented (e.g., "abc → abd, so ijk → ?")
     - Each table discusses and comes up with an initial answer and justification. They can use slip tokens to change a dimension and then re-derive.
     - They also assign a temperature (0-10) for their current reading (how coherent it feels). They can revise if temperature is high (and time allows) by using a slip token to change a dimension and then re-derive. They can do this multiple times (each time using a token) until they run out of tokens or decide to stop.
     - After the time (say 8 minutes per puzzle) or when all tables have finished, they commit:
          - Answer (the string they get for the target)
          - Justification (one sentence)
          - Temperature (0-10, low is good)
     - They also report which slip tokens they used (if any) and for what dimensions.

  3. Scoring:
     - Unity points: For each puzzle, each table gets 1 point for every other table that has the same answer (so if 4 tables, max 3 points per puzzle for unity). If two tables have the same answer, they each get 2 points (if there are 4 tables, then having the same as one other would give 1 point, two others 2 points, all others 3 points). Actually: if there are 4 tables, then for a given table, the number of other tables with the same answer. So max 3 per table per puzzle.
     - Coherence points: For each puzzle, each table gets (10 - temperature) points. So if temperature is 0, they get 10; if 10, they get 0.
     - Also, using a slip token costs 1 point (deducted from the total for that puzzle). But note: they might use tokens to improve coherence, so it's a trade-off.

     Total for a puzzle for a table = [Unity points] + [Coherence points] - [number of tokens used]

     We can display the scores per puzzle on a whiteboard.

  4. Timeline for 90 minutes:

     - 0-10 min: Introduction to the activity without revealing the conceptual point. Explain the setup: 
          - We are going to solve some analogy puzzles. 
          - You are in teams of 4. 
          - Each puzzle: you will have a fixed time (8 minutes) to discuss and come to an answer. 
          - You have 3 slip tokens per puzzle. Using a token allows you to change one dimension (focus, grouping, direction, relation) and then you must re-derive the answer from scratch. 
          - You must report: the answer, a one-sentence justification, and a temperature (0-10, with 0 being very coherent and 10 being very incoherent). 
          - Scoring: 
              * Unity: 1 point for each other team with the same answer.
              * Coherence: 10 minus your temperature.
              * Cost: 1 point per token used.
          - Goal: maximize your total points.

     - 10-18 min: Puzzle 1 (abc → abd, ijk → ?). This should be easy and build confidence. Most will answer 'ijl' (or 'ijd'? but typically in Copycat it's 'ijl'). But note: the standard answer is 'ijl' (since changing the last letter to the next in alphabet, but also note that in ijk, k is the last, so k->l). However, some might think of changing the last letter to d? That would be 'ijd'. But that's less common. We expect consensus on 'ijl'. 
          - After time, collect answers, justifications, temperatures (likely low), and tokens used (likely none). 
          - Record on whiteboard: answers, then calculate and show scores for Puzzle 1.

     - 18-26 min: Puzzle 2 (abc → abd, xyz → ?). Here the obvious move (change z to the next) is blocked because z has no next. So they might change to xya? or xy? or something else. Expect divergence. 
          - Collect and record.

     - 26-34 min: Puzzle 3 (abc → abd, mrrjjj → ?). Here the grouping matters. If they group by same letters: m, rr, jjj → then changing the last group (jjj) to kkk? or changing the last letter of the last group (so jjj becomes jjk? but that might feel arbitrary). Alternatively, if they see it as positions: first letter m, second r, third r, fourth j, etc. then which one to change? The last? So to mrrjjk? Or the last group? They might also consider changing the entire group to the next (so jjj->kkk). But note: the original change was one letter (c->d), so if they change the whole group, that's a different unit. Expect divergence.

     - 34-42 min: Puzzle 4 (abc → dbc, ijk → ?). Here the change is at the beginning: a->d. So for ijk, change i to ... what? l? (so ljk) or to d? (djk) or something else? The relation is not an increment but a change to a specific letter? Or a jump of 3? (a to d is 3 letters). So they might do i->l (ljk) or i->d (djk). Or even i->d and then adjust the rest? (but that's patching, not allowed). 

     - 42-50 min: Puzzle 5 (abc → abd, aabbcc → ?). Here the string is doubled. They might change the last c to d: aabbcd? Or change the last group (cc) to dd? Or change the last letter of the last group: aabbcd? Or change the entire last group to d (so aabbd? but that loses a letter). Or even change the entire string by incrementing each letter? But the original didn't. Expect divergence.

     - 50-70 min: Debrief. 
          - First, let the students reflect: How did it feel? Was there a rule? Did the rule change? Did you feel tension between agreeing with others and having a coherent story?
          - Then, map to the Copycat model: 
              * The tiny local decisions: explain that in Copycat, there are many small processes (codelets) that suggest ways to group, ways to map, etc. 
              * The sliding of concepts: activation spreads so that similar concepts (like "successor" and "predecessor") can bleed into each other, leading to slippage.
              * Temperature: in Copycat, it's a measure of how many competing ideas there are and how well the current structure holds. The program keeps running until the temperature drops (coherence achieved).
              * There is no stored rule: the answer emerges from the interactions of the codelets.
              * There is no central judge: just the aggregate of many small processes.
          - Connect to cognition: Hofstadter's idea that this is how we think. We don't retrieve fixed rules; we build analogies on the fly, and the concepts are fluid. This is why two people can both "get" the same concept but apply it differently.

     - 70-90 min: Discuss the implications and why the letter world is used (thin, so we can see the dynamics without real-world baggage). But also the cost: in the real world, concepts are tied to perception and rich experiences, so they are more stable? Or maybe even more fluid? And how this model might scale.

  5. What will go wrong:

     - Problem 1: Students might not understand the dimensions. They might not know how to change the grouping, for example. 
          - Mitigation: In the introduction, give an example of how a dimension might be changed. For instance, for Puzzle 1, they might initially think of changing the last letter. But if they changed the grouping to "by twos", then what? (But note: abc has 3 letters, odd. So it might not work. Alternatively, for Puzzle 3, show an example: if they group mrrjjj as m-r-r-j-j-j, then changing the last j to k? Or as m-rr-jjj, then changing the last j in jjj? Or changing the entire jjj to kkk? So in the intro, show a non-puzzle example.)

     - Problem 2: The temperature might be arbitrary. Students might not know how to assign it.
          - Mitigation: Explain that 0 means "everything fits perfectly, no doubts", 10 means "we have multiple conflicting ideas and nothing holds together". They can use it as a feeling of confidence.

     - Problem 3: Time pressure: 8 minutes might be too short for some puzzles, especially when they use tokens and re-derive.
          - Mitigation: Be flexible. If one table is taking too long, they can commit with their current state. Or adjust the time per puzzle based on the previous one.

     - Problem 4: They might not re-derive after a slip and just patch. 
          - Emphasize in the rules that they must start over when they change a dimension. Encourage them to note their initial derivation and then the new one.

     - Problem 5: The scoring might be complex. 
          - Provide a sample calculation after Puzzle 1.

     - Problem 6: The tension between unity and coherence might not be felt if there is high consensus. 
          - We hope that by Puzzle 2 and 3, there will be divergence. If not, we can have a more controversial puzzle set.

  6. What the activity can't reproduce:

     - The aggregate of thousands of dumb processes: In the room, they are having a discussion and making decisions consciously. In Copycat, there is no central decider. To get closer, we could try to break down the table's discussion into individual roles (e.g., one person proposes groupings, one proposes changes, etc.) and have them vote or something, but that might be too structured. Alternatively, we could have a phase where they write down individual proposals and then combine, but that might take too long. 

       Idea to get closer: 
          - For each puzzle, have the table members first work silently for 2 minutes, writing down their own initial grouping, focus, etc., and then an answer. 
          - Then they share and discuss. 
          - Then they can use tokens to change dimensions and then again work silently to re-derive. 
          - This introduces some parallel processing and then combination, which is a bit more like the codelets.

     - The thinness of the letter world: The cost is that in the real world, concepts are grounded in perception and experience, which provides more constraints and also more flexibility. In the letter world, the groupings and relations are arbitrary and abstract. So the activity might feel artificial. But that's the point: we are isolating the fluidity of concepts.

     We might also lose the real-world intuition that sometimes guides analogies. But for the purpose of the activity, the thinness is a feature.

  Revised Timeline with silent phase:

     Per puzzle (8 minutes total):
     - 0-2 min: Silent individual work. Each student writes their own initial answer and the dimensions they used (without talking).
     - 2-6 min: Group discussion. They share, discuss, and can use tokens. If they use a token, they must change the dimension and then have another 1 minute of silent re-derivation (so break the discussion for that). But that might be messy.
     - Alternatively, during group discussion, if they decide to use a token, they then have 1 minute of silent re-derivation individually, then reconvene to agree on a new answer and temperature.

     But time is tight. Maybe we skip the silent re-derivation and just have them discuss and then when they use a token, they must collectively re-derive without using the previous answer.

     Given time, we might keep it as group discussion without the silent phase, but the instructor can emphasize that the individual codelets in Copycat are like the initial ideas each person had.

  Final Design:

     - Introduction (10 min): Explain the activity, the puzzles, the tokens, the dimensions (with examples), the temperature, and the scoring. Do a quick non-puzzle example of changing a dimension.

     - Puzzle 1 (8 min): 
          Step 1: 2 min silent individual work (write down initial answer and dimensions used: focus, grouping, direction, relation).
          Step 2: 6 min group discussion. They share, discuss, and can use tokens. If they use a token, they must change that dimension and then re-derive together (without patching). They assign a temperature and commit to an answer, justification, and report tokens used.

     - Repeat for Puzzles 2-5 (each 8 min, so 40 min for puzzles).

     - After each puzzle, collect answers and update the scoreboard (5 min total for breaks and score updates? We can do it quickly).

     - Then 20 min debrief.

     Total: 10 + 40 (puzzles) + 5 (interstitial) + 20 (debrief) = 75 min. We have 15 min buffer.

     Alternatively, we can do:

     - Introduction: 5 min
     - Puzzle 1: 8 min
     - Puzzle 2: 8 min
     - Puzzle 3: 8 min
     - Puzzle 4: 8 min
     - Puzzle 5: 8 min
     - Interstitial (after each puzzle, 1 min to report and 1 min to score? so 10 min total for 5 puzzles) -> 5*1 + 5*1 = 10 min
     - Debrief: 20 min

     Total: 5 + 40 + 10 + 20 = 75 min.

     We can use the last 15 min for extended discussion or buffer.

  Debrief Moves:

     1. Start with reflection: "How did that feel? Did you experience moments when the rule seemed to change? Did you feel tension between having a coherent story and agreeing with others?"
     2. Then: "In the model we were trying to evoke, there is no stored rule. Instead, the answer emerges from many small decisions about how to see the string and what changes. This is inspired by a program called Copycat, created by Douglas Hofstadter and his group."
     3. Explain the Copycat architecture: 
          - Codelets: small agents that suggest groupings, mappings, changes, etc.
          - Activation: concepts (like 'successor', 'leftmost', 'group') are nodes in a network. When one is used, activation spreads to related concepts, making them more available (and sometimes causing slippage).
          - Temperature: high when there are many competing ideas, low when a coherent structure is found. The program runs until temperature drops below a threshold.
          - There is no central control: the codelets run in parallel and the one with the highest urgency (based on activation and other factors) runs next.
     4. Map the activity to Copycat:
          - The individual silent work was like the codelets generating initial proposals.
          - The group discussion was like the competition and integration of ideas.
          - The tokens were like changing the activation of a dimension, causing a new set of codelets to run.
          - The temperature was their own feeling of coherence.
     5. Why this is the core of cognition: Hofstadter argues that we don't think by rigid rules but by fluid analogies. The same concept (like "successor") can be applied differently in different contexts because the context changes the activations. This is why two people can both understand a concept and yet apply it differently without being wrong.

     6. Finally, discuss the cost of the thin letter world: in real life, concepts are grounded in our senses and experiences, which provide more constraints and also more flexibility. But the thin world helps us see the fluidity without the baggage.

  Anticipated Problem with "no decider":

     Even with the silent phase, the group discussion has a decider (the group). To reduce that, we could have a rule that the group must take a vote if they cannot agree, but that still feels like a decider. 

     Alternative: Have each table's answer be determined by a vote of the individuals? But then it's not a group product. 

     We might not fully eliminate the feeling of a central decider, but we can emphasize in the debrief that in the brain, there is no central decider either, just the aggregate of neural activity. The group discussion is a metaphor for the parallel processes.

  Conclusion:

     This activity should create an experience of concept slippage and the emergent nature of rule application. The debrief then connects it to the cognitive model. The thin letter world is a necessary simplification to make the dynamics visible.
answer: |-
  ### Revised Activity Design: **"Fluid Concepts"**

  #### **Core Goal**  
  Make students *experience* that applying a concept isn't executing a fixed rule but emerges from micro-decisions about perception, grouping, and relationships. Avoid lecturing; immerse them in ambiguity where consensus fractures and coherence competes with agreement.

  ---

  ### **Materials**  
  - **Per table (4 tables × 4 students):**  
    - 3 slip tokens (poker chips or cardboard tokens).  
    - Pens, paper, and a **puzzle sheet** with 5 puzzles:  
      1. `abc → abd ; ijk → ?`  
      2. `abc → abd ; xyz → ?`  
      3. `abc → abd ; mrrjjj → ?`  
      4. `abc → dbc ; ijk → ?`  
      5. `abc → abd ; aabbcc → ?`  
  - **Instructor:** Timer, whiteboard for scores, and a "temperature board" (0–10 scale per table).

  ---

  ### **Rules & Mechanics**  
  #### **1. Slip Tokens (Force Re-perception)**  
  - **Dimensions:** Tokens allow tables to change one aspect of their interpretation mid-puzzle:  
    - **Focus:** Which part of the string changes? (e.g., *last letter* vs. *first group*).  
    - **Grouping:** What counts as a unit? (e.g., *individual letters* vs. *same-letter groups*).  
    - **Direction:** Where does change propagate? (e.g., *left-to-right* vs. *right-to-left*).  
    - **Relation:** What is the nature of change? (e.g., *alphabet increment* vs. *sameness*).  
  - **Cost:** Playing a token costs **1 point** and **requires re-deriving the answer from scratch** (no patching).  
  - **Usage:** Up to 3 tokens/puzzle. Tables declare which dimension they slip when playing a token.  

  #### **2. Temperature (Coherence Metric)**  
  - **0–10 Scale:** Tables rate their solution’s coherence after each puzzle:  
    - **0:** "Everything clicks; no loose ends."  
    - **10:** "Feels forced; contradictions linger."  
  - **Revision:** If temperature is >4, they *must* revise (if time allows). High temperature = unresolved tension.  

  #### **3. Dual Scoring (Tug-of-War)**  
  - **Unity Points:** 1 point per *other table* with the **same answer**.  
    - *Example:* If 2/4 tables match, each gets 1 point.  
  - **Coherence Points:** `10 - temperature` (e.g., temp=3 → 7 points).  
  - **Token Cost:** -1 point per token used.  
  - **Total/round:** `Unity + Coherence - Token Cost`  

  #### **4. Table Flow (Per Puzzle)**  
  - **Silent Start (1 min):** Individuals write private answers (no discussion).  
  - **Group Phase (6 min):** Discuss, play tokens, revise. Derive one answer with a 1-sentence justification.  
  - **Commit (1 min):** Submit answer, justification, temperature, and tokens used.  

  #### **5. Instructor Role**  
  - **No Adjudication:** Refuse to judge answers. Say: "Your job is to make it cohere, not please me."  
  - **Neutral Facilitation:** Track time, scores, and temperatures only.  

  ---

  ### **Timeline (90 Min)**  
  | Time      | Activity                                                                 |  
  |-----------|--------------------------------------------------------------------------|  
  | 0–5 min   | **Intro:** Explain rules, scoring, and demo a token slip (e.g., for Puzzle 1: "What if we changed *grouping* to see `abc` as one unit?"). Emphasize: "Your goal is a satisfying solution, not a ‘correct’ one." |  
  | 5–13 min  | **Puzzle 1:** `abc→abd, ijk→?` (Build confidence; expect consensus on `ijl`). Record scores. |  
  | 13–21 min | **Puzzle 2:** `abc→abd, xyz→?` (Blocked successor; e.g., `xy` or `xya`). Highlight diverging answers. |  
  | 21–29 min | **Puzzle 3:** `abc→abd, mrrjjj→?` (Sliding units; e.g., `mrrkkk` vs. `mrrjjk`). |  
  | 29–37 min | **Puzzle 4:** `abc→dbc, ijk→?` (Shifted focus; e.g., `ljk` vs. `djk`). |  
  | 37–45 min | **Puzzle 5:** `abc→abd, aabbcc→?` (Group ambiguity; e.g., `aabbcd` vs. `aabbdd`). |  
  | 45–70 min | **Debrief:** Guided reflection → cognitive model → implications (see below). |  
  | 70–90 min | **Discussion:** Q&A, expand to real-world concepts. |  

  ---

  ### **Debrief (45–70 Min)**  
  **Goal:** Link the experience to Hofstadter’s model without jargon upfront.  

  #### **Step 1: Elicit Feelings (5 min)**  
  - Ask:  
    - "When did your table feel stuck? What did that *feel* like?"  
    - "Did anyone change their mind mid-puzzle? What forced it?"  
    - "Which answer felt most ‘obviously right’ to you? Did others disagree?"  

  #### **Step 2: Map to Copycat (10 min)**  
  - **Reveal the microworld:** "This was based on Hofstadter’s Copycat—a model of how analogy works."  
  - **Connect mechanics to cognition:**  
    | **Activity Element**  | **Copycat Concept**          | **Cognitive Insight**                          |  
    |-----------------------|------------------------------|-----------------------------------------------|  
    | Silent individual work| Codelets (tiny agents)       | Micro-perceptions compete unconsciously.      |  
    | Token slips           | Activation spreading         | Concepts bleed into neighbors (e.g., "successor" → "predecessor"). |  
    | Temperature           | Coherence pressure           | Mind seeks harmony; rejects "loose ends."     |  
    | No adjudicator        | Emergence                    | Answers crystallize from chaos; no "rule" is stored. |  

  - **Emphasize:** "Your disagreements weren’t sloppiness—they were *different pathways* through the same conceptual network."  

  #### **Step 3: Why This Matters (5 min)**  
  - **Hofstadter’s Thesis:** Analogy isn’t applying rules—it’s **rebuilding concepts** on the fly. *Fluid Concepts & Creative Analogies* argues this is cognition’s core.  
  - **Real-World Link:** "Ever argue about whether a hotdog is a sandwich? Or if a virus is ‘alive’? Same slippage—just richer concepts."  

  #### **Step 4: Costs of Thinness (5 min)**  
  - **What’s lost:** Real concepts have sensory, emotional, and experiential weight (e.g., "justice" isn’t just letters).  
  - **Why use letters?** "To expose how slippery *even simple ideas* are. No perceptual crutches = no hiding the fluidity."  

  ---

  ### **Predictable Problems & Fixes**  
  1. **"There’s a decider in the room!"**  
     - **Problem:** Group discussion feels top-down vs. Copycat’s bottom-up emergence.  
     - **Mitigation:**  
       - **Silent starts** simulate parallel codelets.  
       - **Reframe debate:** "Your arguments were *competing codelets*—the ‘winner’ wasn’t a person, it was the idea that cooled the temperature."  

  2. **Token Confusion**  
     - **Problem:** Students "patch" answers without re-deriving.  
     - **Fix:** Walk tables through a re-derivation during Puzzle 1 (e.g., "If you slip grouping, forget your first answer—start fresh").  

  3. **Artificial Scoring**  
     - **Problem:** Points feel arbitrary, undermining tension.  
     - **Fix:** **Frame scoring psychologically:** "Unity points = social validation. Coherence points = intellectual satisfaction. Which do *you* crave?"  

  4. **Overflowing Time**  
     - **Problem:** Puzzle 3/5 run long.  
     - **Fix:** Cap revisions at 2 tokens/puzzle. Cut Puzzles 4 or 5 if needed (keep 1,2,3,5).  

  ---

  ### **What the Activity Can’t Fully Capture**  
  - **The Decider Illusion:** Human debate *feels* agent-driven. Copycat’s magic is **no homunculus**—just stochastic codelets. The activity hints at emergence but can’t erase the sense of agency.  
  - **Real Concepts’ Depth:** Letter-world concepts lack the "weight" of real ones (e.g., "justice" has moral texture). Students might dismiss slippage as an artifact of "toy" puzzles.  
    - **Counter in Debrief:** "If concepts slip here, imagine how much they slide when stakes are high and meanings are muddy."  

  ---

  ### **Why It Works**  
  The **tension** between unity and coherence forces students to confront slippage viscerally. By Puzzle 3, they’ll split answers (`mrrkkk` vs. `mrrjjk`) while each table feels theirs is "obvious." The debrief then crystallizes why: **concepts aren’t rules—they’re pathways forged in the moment.**  

  Run it tight, and they’ll leave unsettled—unable to recite "the rule" but feeling its ghost in their bones.
