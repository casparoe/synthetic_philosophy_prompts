answer: |-
  **Crux:** Mixed strategies initiate elimination by dominating uniformly weak strategies like M, which no pure strategy can dominate, revealing that IESDS requires mixed dominance to reduce the game.

  ### Teaching Plan (75 minutes total)
  1. **Review and set up (5 min):** Start with the game on board. Ask students to find pure Nash equilibria (they should identify (T,L)) and check for pure dominated strategies (none exist). Highlight that without mixed strategies, the game cannot be simplified. *Dependency:* Must establish baseline to show inadequacy of pure dominance.

  2. **Introduce mixed dominance with M (15 min):** Define strict dominance by mixed strategies: a strategy is strictly dominated if a mixture yields higher payoff against *all* opponent strategies. Use row M: against any column, M gets 2. Show that a 50-50 mix of T and B gives at least 2.5 (>2) against L, C, and R (calculate: L: 2.5, C: 2.5, R: 6.5). Eliminate M. *Defuse misconception:* "A strategy is dominated only if some pure strategy beats it" by emphasizing M isn't beaten by any pure (e.g., T loses to C, B loses to L) but is by mixture. *Key feature:* M's constant, mediocre payoff carries the session—it lacks variation that mixtures exploit, making it vulnerable.

  3. **First reduction and column elimination (10 min):** Reduced game: T/B vs L/C/R. For column, show C is now strictly dominated by pure R: against T (R:4 > C:1), against B (R:6 > C:1). Eliminate C. *Dependency:* Must eliminate M first; against row M, C and R both gave 2, so C wasn't dominated earlier.

  4. **Second reduction and row elimination (10 min):** Reduced game: T/B vs L/R. For row, show B is strictly dominated by pure T: against L (T:5 > B:0), against R (T:7 > B:6). Eliminate B. *Dependency:* C must be gone; against C, B got 4 > T's 1, so B wasn't dominated before.

  5. **Final reduction and equilibrium (5 min):** Reduced to T vs L/R. For column, show R is strictly dominated by pure L (L:5 > R:4 against T). Eliminate R, leaving (T,L). *Dependency:* B must be eliminated first; against B, L got 0 < R's 6.

  6. **Misconceptions and invariance (10 min):** Discuss why order seemed to matter but doesn't under strict dominance: outcome (only (T,L) survives) is invariant if mixed dominance is allowed, but elimination sequence depends on current strategies. *Defuse misconception:* "Order cannot change outcome" by contrasting with weak dominance (e.g., if payoffs had ties, order might matter; here, strict dominance ensures robustness). *Dependency:* Requires full reduction to show outcome stability.

  7. **Closing question and synthesis (10 min):** Pose: "After eliminating M, why couldn't we eliminate C immediately in the original game?" Correct answer: Against row M, C and R both yield 2, so no strict dominance; students must recognize that dominance is defined against all *remaining* opponent strategies, not historical ones. *Reveals understanding:* If they cite mixtures or current game state, they grasp the role of mixtures; if not, they memorized steps. Then state without proof:
     - A pure strategy (e.g., M) with no pure dominator can be eliminated via mixed strategies, which average across scenarios to compensate weaknesses.
     - IESDS under strict dominance (with mixtures) always yields the same outcome; under weak dominance, order can affect results due to payoff ties.
     - With mixed strategies allowed, "strictly dominated" iff "never a best response" (a strategy is eliminable iff no belief about opponent makes it optimal).

  8. **Refusal (openly stated):** "We won't cover weak dominance details, equivalence to correlated equilibrium, or extensive-form rationalizability—those are advanced topics." (5 min for Q&A buffer). 

  *Timing notes:* Allot flex time within segments; use board for payoffs/calculations. Single feature (M) must be weak and constant (payoff 2 everywhere) to require mixtures, conspicuously lacking high-payoff scenarios that pure strategies could exploit.
