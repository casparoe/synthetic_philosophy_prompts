prompt: |-
  I run a small coaching service -- two of us, really -- out of a nonprofit credit union, where people come in and we set up "commitment" arrangements for money and health stuff: locked savings accounts, auto-transfers with a penalty for pulling out early, website blockers where a friend holds the password, and then the softer stuff (weekly check-ins, texts, a fifty-dollar bet with a sibling). We do maybe twenty intakes a month, sessions are 45 minutes, and the people I see are not patients, I have no clinical training, and I'm the one who signs off on which device we actually build -- so when it goes wrong it's on me. I keep hitting the same wall. Someone comes in wanting to lock away money for a house, and eight weeks later calls me upset because the car died, or their kid needs something, or they just changed their mind, and I honestly don't know whether I'm supposed to be the person who says this is the whole point of the device, no, or the person who says fine, we release you. Flip side: someone asks me for a hard lock on something and I can't tell whether their long-term goal was ever really their goal or just something they said in a good mood on a Tuesday.

  So I want a procedure I can actually run, in the room, in 45 minutes, grounded in what philosophy and the behavioral stuff actually say about weakness of will and about how we discount the future. Raw material I've picked up and want you to use: the classic puzzle is that akrasia is supposed to be acting, freely and intentionally, against your own better judgment, which sounds nearly impossible -- if you really judged that A was better all things considered, how did you intentionally do B? And the resolution I find most useful is the one (Holton's, I think) that says weakness of will is really about revising a resolution without adequate reason, not about acting against a judgment, which would mean someone who calmly changes their mind isn't weak-willed at all, while someone who caves to a craving while still thinking they shouldn't is. On the future side there's the standard story: people discount the near future much more steeply than the far future, so a reward at day 1 vs day 2 gets weighed very differently from day 30 vs day 31, which produces preference reversals -- you sincerely prefer the gym at 11pm and sincerely prefer the sofa at 6am -- and commitment devices are the usual fix. I gather the literature also separates being sophisticated (you know you'll reverse) from naive (you don't) from partially naive, and that the design advice differs a lot depending on which one the person is. And there's apparently a real debate about whether near-bias is even irrational -- maybe discounting is fine and only the inconsistency is the problem -- plus something about a bias toward the future that makes time-neutrality look less mandatory, which I dont fully understand but which I suspect matters for whether I should be overriding anyone at all.

  What I want: an ordered decision procedure -- the questions to ask in order, what counts as a good-enough answer to each, where it terminates in a no, we don't build this device, and where it has to stop and hand the call to the person themselves (or to a clinician) because it's a values question rather than a factual one. Include the small set of tests I can run in the room, and be explicit about which steps are just judgment wearing a procedure costume. Then run it on three cases: (a) the house-savings person who wants out at week eight because the car died; (b) someone who wants me to lock their phone in a timed safe for six months to finish a thesis; (c) someone still inside their commitment who asked me in advance to talk them out of quitting, where I suspect the honest answer is that I should let them quit and I won't like it. Also tell me the one question in the procedure that's actually doing the work -- where I'd get the worst outcome if I skipped it or misapplied it -- and what the procedure just can't do. I assume it can't tell me whether the long-term self or the short-term self is the real one, but say what that means for me in practice.
reasoning: |-
  We are designing a decision procedure for a commitment device service. The procedure should be grounded in philosophy and behavioral science, particularly addressing akrasia (weakness of will) and time discounting.

  Key concepts from the query:
  1. **Akrasia resolution (Holton)**: Weakness of will is about revising a resolution without adequate reason, not acting against a judgment. Thus, if someone changes their mind calmly and with good reason, it's not weakness of will.
  2. **Time discounting**: People discount near-future rewards more steeply than far-future ones, leading to preference reversals. Commitment devices are a fix.
  3. **Sophistication**: 
     - Sophisticated: Knows they will have a preference reversal.
     - Naive: Does not anticipate the reversal.
     - Partially naive: Somewhat aware but underestimates the reversal.
     Design advice differs by type.

  4. **Rationality of discounting**: There is debate about whether near-bias is irrational. The inconsistency might be the problem, and time-neutrality might not be mandatory.

  Goals of the procedure:
  - Determine whether to build a commitment device or not.
  - Decide when to release someone from a commitment.
  - Identify when the issue is a values question (which the service should not override) versus a factual one about future behavior.

  Structure of the procedure:
  - Ordered set of questions.
  - Criteria for good-enough answers.
  - Termination points: 
     a) Do not build the device.
     b) Build the device (with specific parameters).
     c) Do not release from the commitment (or release, depending on the situation).
     d) Hand off to the person themselves or a clinician (for values questions).

  The procedure must fit in 45 minutes and be practical.

  The procedure will have two main contexts:
  1. Intake (deciding whether to set up a device and how).
  2. Mid-commitment (when someone wants to break the commitment).

  We'll design a unified procedure that can be adapted for both, but with some steps specific to the context.

  **Core Decision Procedure**

  I. **Initial Assessment (for intake) or Re-Assessment (for mid-commitment release request)**
     Steps:
     1. **Clarify the Goal**:
          - "What is the long-term goal you are trying to achieve with this commitment device? Why is it important to you?"
          - *Good enough answer*: A clear, specific goal with a personal value attached (e.g., "I want to save $10,000 for a house down payment because I want to provide stability for my family").
          - *Warning signs*: Vague goals, goals that sound like they come from external pressure, or goals that the person cannot articulate the value of.

     2. **Identify the Temptation**:
          - "What are the short-term urges or distractions that you think might lead you away from this goal? How have they affected you in the past?"
          - *Good enough answer*: Specific, historically observed temptations (e.g., "When I see a sale, I buy things I don't need" or "I get distracted by social media and then don't work on my thesis").
          - *Warning signs*: None identified (naivety) or too many without a pattern.

     3. **Assess Sophistication Level**:
          - "On a scale from 0 to 10, how confident are you that you will stick to your goal without a commitment device? Why?"
          - Follow-up: "Have you tried to achieve this goal before? What happened?"
          - *Interpretation*:
              - 0-3: Sophisticated (they know they will fail without help).
              - 4-6: Partially naive (they are somewhat aware but overconfident).
              - 7-10: Naive (they are very confident but may not have faced the temptation recently).
          - *Design advice*:
              - Sophisticated: They can choose a strong lock (hard commitment).
              - Partially naive: They might need a medium lock (with some flexibility) and education about the likelihood of failure.
              - Naive: They might need a trial run (softer commitment) and education.

     4. **Test for Adequate Reason to Change (for mid-commitment only)**:
          - If the person is requesting release: "What has changed since you set up the commitment? Is this a temporary urge or a fundamental change in your goal or circumstances?"
          - *Good enough reason to release*: 
              - A permanent, significant change in circumstances (e.g., loss of job, medical emergency) that makes the original goal unfeasible or less important.
              - A calm, considered change of mind about the goal (not an impulsive reaction to temptation).
          - *Not adequate reason*: 
              - Temporary urge (e.g., "I just want to buy this thing now") without a change in circumstances.
              - The person still affirms the long-term goal but is experiencing craving or immediate pressure.

     5. **Assess Consistency of Preferences Over Time**:
          - "Imagine it's one year from now and you achieved your goal. How would you feel? Now imagine you gave in to the temptation and didn't achieve it. How would you feel then?"
          - Then: "Now, if you look at the immediate situation, how do you feel about the temptation right now?"
          - *Purpose*: To reveal if the person is experiencing a preference reversal (which would suggest the commitment is working as intended) or a genuine change in values.
          - *Good enough*: If the long-term perspective still aligns with the goal and the immediate urge is strong but temporary, it's a sign of akrasia. If the long-term perspective has shifted, it might be a values change.

     6. **Determine if it's a Values Question**:
          - "If we didn't have this device, would you still want to pursue this goal? Why or why not?"
          - *Hand-off trigger*: If the person expresses that the goal is no longer important to them, or if they are deeply conflicted about the goal itself (not just the means), then it's a values question. The service should not override. Instead, we might:
              - For intake: Not build the device and suggest they reconsider their goals.
              - For mid-commitment: Release them without penalty and suggest they reassess their goals.

     7. **Design the Commitment (for intake) or Decide on Release (for mid-commitment)**:
          - Based on the above, choose:
              - *Intake*:
                  - If the goal is clear, temptations are identified, and the person is sophisticated -> strong lock.
                  - If partially naive -> medium lock (e.g., with a delay or a penalty that can be overridden with a cost).
                  - If naive -> soft lock (e.g., a commitment with a friend and weekly check-ins) and schedule a follow-up to reassess.
                  - If the goal is not clear or it's a values conflict -> do not build.
              - *Mid-commitment*:
                  - If the reason for release is adequate (per step 4) and it's a values shift (step 6) -> release without penalty.
                  - If the reason is inadequate (urge without change) -> do not release (or apply the penalty as per the device) and remind them of the long-term goal.

  II. **The Critical Question**
     - The step that is doing the most work is **Step 4: Test for Adequate Reason to Change** (for mid-commitment) and **Step 3: Assess Sophistication Level** (for intake). 
       Why?
          - Misjudging the reason for change (step 4) could lead to releasing someone when they are just experiencing a temporary urge (which they will regret) or holding someone in a commitment when their circumstances have truly changed (causing harm).
          - Misjudging sophistication (step 3) could lead to a device that is too strict (causing unnecessary hardship) or too lenient (ineffective).

  III. **What the Procedure Cannot Do**
     - It cannot resolve the philosophical question of which self (long-term or short-term) is the "real" one. In practice, this means:
          - The service should not impose its own values on the client. We are facilitating the client's own stated long-term goals.
          - We must respect a calm, considered change of mind (even if it's a reversal of a long-term goal) as legitimate.

  **Running the Cases**

  Case (a): The house-savings person who wants out at week eight because the car died.
  - Step 1: Goal was to save for a house (long-term stability).
  - Step 4: Reason for release: car died. This is a significant, unexpected event that impacts their immediate financial situation. It may be an adequate reason.
  - Step 5: Ask about consistency: "If the car issue is fixed, would you still want to save for the house?" If yes, then the long-term goal hasn't changed.
  - Step 6: Values question: They still value the house, but the car is a necessity. This is a practical problem, not a values shift.
  - Decision: Release the funds without penalty (or with a reduced penalty) because it's an adequate reason. However, help them set up a new plan for rebuilding savings once the car is fixed.

  Case (b): Someone who wants to lock their phone in a timed safe for six months to finish a thesis.
  - Step 1: Goal: Finish thesis (long-term career goal). Importance: high (degree, career advancement).
  - Step 2: Temptation: Phone/social media distractions. They have a history of procrastination.
  - Step 3: Assess sophistication: They have tried before and failed -> sophisticated. Confidence without device: low (so they choose a strong lock).
  - Step 4: Not applicable (intake).
  - Step 5: They can articulate the future regret if they don't finish and the immediate pull of the phone.
  - Step 6: Not a values question: They clearly want to finish the thesis.
  - Design: Strong lock (timed safe) but with a few safety valves (e.g., one emergency access with a high penalty or a trusted friend who can release in a true emergency). Since it's a long period, build in milestones and check-ins.

  Case (c): Someone still inside their commitment who asked me in advance to talk them out of quitting, where I suspect the honest answer is that I should let them quit and I won't like it.
  - Context: They are in the middle of the commitment and are having second thoughts. They pre-committed to being talked out of quitting.
  - Step 4: Why do they want to quit now? They might say, "I realized I don't want this goal anymore." 
  - Step 5: Ask: "When you set the goal, what did you want? Now, what do you want? How do you think you'll feel in a year if you quit?"
  - Step 6: If they express that the goal is no longer important (e.g., "I've realized I don't want to run a marathon; it's too hard and I don't enjoy it"), then it's a values shift.
  - Decision: If it's a values shift, release them. If it's just a temporary low motivation, then hold the commitment. But note: they pre-committed to being talked out, so we can remind them of that. However, if the values have truly changed, we must respect that.

  **Final Procedure Outline**

  For intake (setting up a device):
  1. Clarify the goal and its importance.
  2. Identify the temptations and past failures.
  3. Assess sophistication level.
  4. Assess consistency of preferences (long-term vs. immediate).
  5. Check for values conflict (if any, do not build).
  6. Design the device based on sophistication and goal.

  For mid-commitment (request to release):
  1. Re-clarify the original goal and its importance.
  2. Test for adequate reason to change (what has changed?).
  3. Assess consistency of preferences (long-term view vs. now).
  4. Check for values shift.
  5. Decide: release if adequate reason or values shift; hold if temporary urge.

  The procedure must be run with empathy and without judgment. The role is to help the client align with their own goals, not to impose external discipline.
answer: |-
  Below is a step-by-step decision procedure for your coaching service, designed to address the core philosophical and behavioral challenges you face (akrasia, time discounting, sophistication levels, and the rationality of commitment). It's grounded in the concepts you mentioned (e.g., Holton's resolution of akrasia, hyperbolic discounting, sophistication/naivety) and is structured as a 45-minute in-room process. The procedure is divided into two phases: **Intake** (for setting up a new commitment device) and **Mid-Commitment Review** (for handling requests to quit or adjust an existing device). Both phases share a common diagnostic core.

  The procedure prioritizes efficiency, clarity, and ethical boundaries (e.g., avoiding clinical overreach). It includes:
  - **Questions to ask in order**, with scripts.
  - **Criteria for "good-enough" answers** and warning signs.
  - **Termination points** (e.g., when to say "no" to a device or release).
  - **Hand-off points** for values-based decisions.
  - **Simple in-room tests** to reveal biases or inconsistencies.
  - **Explicit flags** for when "judgment is wearing a procedure costume."

  I'll start with the full procedure, then apply it to your three cases, and end with the "critical question" and limitations.

  ---

  ### **Core Decision Procedure**
  **Philosophical Grounding**: 
  - **Akrasia (Holton)**: Weakness of will occurs when someone revises a resolution (e.g., "I will save for a house") *without adequate reason* due to impulses, not when they calmly change their judgment. Your role is to distinguish impulsive reversals (where commitment devices should hold) from reasoned changes (where release is ethical).
  - **Time Discounting**: People hyperbolically discount near-future rewards/costs. Commitment devices fix *inconsistency*, not irrationality. Time-neutrality isn't required—discounting is rational if consistent, but most people aren't consistent.
  - **Sophistication Levels**: 
    - **Naive**: Doesn't anticipate self-control failures. *Design advice*: Use softer devices (e.g., weekly check-ins) to avoid backlash.
    - **Partially Naive**: Recognizes some risk of failure but underestimates it. *Design advice*: Medium-strength devices (e.g., penalties with override options).
    - **Sophisticated**: Fully expects failures. *Design advice*: Hard locks (e.g., irreversible locks).
  - **Your Role**: You are a *facilitator*, not a values arbiter. Override only for *inconsistency* (e.g., "You said X, but now you're doing Y for no new reason"), not for goal changes.

  **Procedure Structure**:
  - **Time Allocation**: 30 minutes for diagnosis, 15 minutes for design/decision.
  - **Tools Needed**: Pen/paper for client to write responses (creates psychological distance from impulses), a timer.
  - **Key Outputs**: 
    - Proceed with device/release, or 
    - Terminate ("no device"), or 
    - Hand off to client/clinician (values conflict).

  ---

  #### **Phase 1: Intake (New Commitment Device)**
  *For new clients wanting a device (e.g., locked savings, phone blocker).*

  1. **Clarify the Goal & Motivation (5 minutes)**  
     - *Question*: "What's the specific long-term goal? Why does it matter to *you*—not to others? How would your life improve if you achieved it?"  
     - *Good-Enough Answer*: Concrete, emotionally grounded (e.g., "Save $10K for a house to stop renting and feel secure").  
     - *Warning Signs*: Vague/abstract goals ("be healthier"), external pressure ("my spouse wants it"), or low emotional weight.  
     - *Test*: Ask them to *write* the goal and read it aloud. If they hesitate or generalize, probe: "What's one concrete example of why this matters?"  
     - *Termination*: If goal is unclear or externally driven → **Hand off to client** ("This seems unclear—revisit and come back").  
     - *Judgment Costume*: You assess sincerity, not validity. If motivation is weak, proceed but recommend a softer device.

  2. **Diagnose Temptations & Past Behavior (10 minutes)**  
     - *Question*: "What exactly has derailed you before? Describe a recent example. How did you feel in the moment vs. afterward?"  
     - *Good-Enough Answer*: Specific triggers with emotional contrast (e.g., "I impulsively buy gadgets and feel guilty later").  
     - *Warning Signs*: No past failures (suggests naivety) or overgeneralizing ("I’m just lazy").  
     - *Test*: Use the **"10-Minute Time Machine"**: Ask them to imagine themselves *at the moment of temptation* (e.g., seeing a shiny new phone) and describe their feelings. Then, ask them to imagine *one year later* if they gave in. Contrast the two. If the "future self" predicts regret, it signals akrasia risk.  
     - *Termination*: No identifiable temptations → **Do not build**. Devices won't help without a clear impulse to override.

  3. **Assess Sophistication Level (5 minutes)**  
     - *Question*: "On a scale of 0–10, how likely are you to give in without a device? Why? Have you ever surprised yourself by failing?"  
     - *Scoring*:  
       - 0–3: **Sophisticated** (knows they’ll fail).  
       - 4–6: **Partially Naive** (underestimates failure risk).  
       - 7–10: **Naive** (overconfident).  
     - *Good-Enough Answer*: Consistency with past behavior (e.g., "I’m a 2—I always cave to cravings").  
     - *Warning Signs*: Incongruence (e.g., says "I’m a 9" but has many past failures).  
     - *Test*: **Preference Reversal Quiz**: "Would you prefer $100 today or $110 tomorrow? Would you prefer $100 in 30 days or $110 in 31 days?" If they choose $100 today but $110 in 31 days, they’re sophisticated (understand reversal). If not, they’re naive.  
     - *No Termination*: Proceed regardless—this step informs design.

  4. **Check for Values Conflicts (5 minutes)**  
     - *Question*: "If you could achieve this goal painlessly, would you still want it? What would you sacrifice for it? What if your circumstances changed?"  
     - *Good-Enough Answer*: Unambiguous commitment (e.g., "I’d sacrifice nights out").  
     - *Warning Signs*: Hesitation, moralizing ("I should want this"), or conditional goals ("I want this unless something better comes up").  
     - *Test*: **Trade-Off Game**: "Would you trade this goal for [competing value, e.g., $1,000 cash]?" If yes, goal is weak.  
     - *Termination*: Values conflict (e.g., "I want this but not if it hurts my family") → **Hand off to client/clinician**. Not your role to resolve.

  5. **Design the Device (10 minutes)**  
     - *Rules*:  
       - **Sophisticated**: Hard lock (e.g., irreversible safe, no early withdrawal).  
       - **Partially Naive**: Penalty-based device (e.g., early withdrawal with 10% fee).  
       - **Naive**: Soft commitment (e.g., weekly check-ins + social accountability).  
     - *Question*: "Given what we’ve discussed, what type of lock feels right? Why?"  
     - *Good-Enough Answer*: Matches sophistication level. Client agrees to terms.  
     - *Termination*: Client insists on a mismatch (e.g., naive but demands hard lock) → **Do not build** (risk of harm).  
     - *Judgment Costume*: You decide final design but use client input for buy-in.

  ---

  #### **Phase 2: Mid-Commitment Review (Request to Quit or Adjust)**  
  *For clients wanting early release (e.g., "my car broke, I need cash").*

  1. **Revisit Original Goal & Context (5 minutes)**  
     - *Question*: "When we started, what was your goal and why? What did we agree was an 'adequate reason' to quit?" (Refer to notes from intake.)  
     - *Good-Enough Answer*: Clear recall of initial intent.  
     - *Warning Signs*: Dismissiveness ("That doesn’t matter now").  
     - *Test*: Have them reread their written goal from intake. If they disown it, proceed to Step 3.

  2. **Diagnose the Reason for Quitting (10 minutes)**  
     - *Question*: "What changed? Is this a craving, a permanent shift, or an emergency? How will you feel in a week if you quit?"  
     - *Good-Enough Answer*: Evidence of change (e.g., "My kid needs surgery—here’s the bill").  
     - *Warning Signs*: Vague distress ("I just need out") or impulsive language ("I can’t stand this").  
     - *Test*: **Holton’s Akrasia Test**:  
       - If they admit, "I still want the goal but can’t resist," → **Weakness of will** (hold commitment).  
       - If they say, "I no longer want this goal," → **Values shift** (release).  
       - If they cite new facts (e.g., job loss), → **Adequate reason** (release).  

  3. **Assess Preference Consistency (5 minutes)**  
     - *Question*: "Imagine yourself in 1 year. Would the 'you then' support quitting now? What would they say to you?"  
     - *Good-Enough Answer*: Future-self perspective aligns with goal or acknowledges change.  
     - *Warning Signs*: Ignores future self ("I don’t care").  
     - *Test*: **Time-Continuity Exercise**: Ask them to write a letter from their future self about this decision. If the letter urges persistence, it’s akrasia.

  4. **Decide: Release, Hold, or Hand Off (5 minutes)**  
     - *Rules*:  
       - **Release**: Adequate reason (e.g., true emergency) OR values shift (e.g., calm, reasoned goal change).  
       - **Hold**: Weakness of will (e.g., craving without new facts) OR partial naivety (e.g., "I regret this device but still want the goal").  
       - **Hand Off**: Uncertainty about values (e.g., "I’m torn between my kids and my dream").  
     - *Termination*: No release → Apply penalty/terms. Release → Process immediately.  
     - *Judgment Costume*: You interpret "adequate reason" but default to client’s words.

  ---

  ### **Applied to Your Cases**
  **Case (a): House-Savings Person (Mid-Commitment Review)**  
  - **Goal Clarification**: Original goal was "save for a house for stability."  
  - **Reason for Quitting**: Car died—emergency, not impulse.  
  - **Holton Test**: They likely say, "I still want a house, but I need cash now." → **Adequate reason** (new fact).  
  - **Preference Consistency**: Future self would support release (car is urgent).  
  - **Values Check**: No shift—still values the house.  
  - **Decision**: **Release funds** without penalty. Offer to rebuild the device later.  
  - *Why it works*: This isn’t akrasia—it’s a rational response to new circumstances.

  **Case (b): Phone Lock for Thesis (Intake)**  
  - **Goal & Motivation**: "Finish thesis to graduate and feel accomplished." Concrete and emotional.  
  - **Temptations**: "I scroll social media instead of writing—then feel ashamed."  
  - **Sophistication**: Past failures → sophisticated. Preference Reversal Quiz confirms (chooses $100 today vs. $110 tomorrow).  
  - **Values Check**: "I’d sacrifice parties for this." No conflict.  
  - **Design**: **Hard lock** (6-month safe) but with one emergency override (e.g., friend holds password for true crises).  
  - *Why it works*: Sophistication justifies a strict device; override prevents harm during burnout.

  **Case (c): Pre-Commitment to "Talk Me Out of Quitting" (Mid-Commitment Review)**  
  - **Goal Clarification**: Original goal (e.g., "lose 20lbs for health").  
  - **Reason for Quitting**: "I hate dieting—it’s not worth it."  
  - **Holton Test**: "I don’t care about the goal anymore." → **Values shift** (calm revision).  
  - **Preference Consistency**: Future self might support quitting if health isn’t a priority.  
  - **Values Check**: Clear shift—hand off.  
  - **Decision**: **Release and hand off to client**. Say: "You pre-committed to being talked out, but your goals changed—that’s okay. I’ll release you, but consider discussing with a therapist if conflicted."  
  - *Why it works*: Honoring Holton—this isn’t weakness of will, so overriding would be paternalistic.

  ---

  ### **The Critical Question**  
  **"What changed? Is this a craving, a permanent shift, or an emergency?" (Mid-Commitment Review, Step 2)**  
  - **Why it’s critical**: Misdiagnosing akrasia (e.g., releasing for a craving) undermines the device and harms the client’s long-term goals. Skipping this could turn you into an enabler of impulsivity.  
  - **Worst outcome if skipped**: Releasing funds for a "car emergency" that was actually an impulsive purchase, leading to regret and loss of trust.  
  - **How to avoid misapplication**: Demand evidence (e.g., bills for emergencies) and use the "future-self letter" test to surface hidden impulses.

  ---

  ### **What the Procedure Can’t Do**  
  1. **Determine the "Real Self"**: It can’t decide if the long-term or short-term self is "authentic."  
     - *Practical Implication*: Default to the client’s *reasoned* judgment. If they calmly revise their goal (e.g., "I no longer want a house"), accept it—even if you disagree. Never override values.  
  2. **Predict Unforeseen Events**: Devices can’t anticipate all emergencies (e.g., a car dying).  
     - *Mitigation*: Build in emergency overrides (e.g., a trusted third party) for hard locks.  
  3. **Eliminate All Regret**: Some clients will regret releasing (or not releasing) despite the procedure.  
     - *Mitigation*: Normalize regret as part of behavioral change—e.g., "We made the best call with the information we had."  
  4. **Handle Clinical Issues**: Deep-seated impulsivity (e.g., ADHD) or trauma requires a clinician.  
     - *Red Flag*: If a client shows distress, obsession, or irrational guilt → **Hand off immediately**.

  This procedure balances behavioral science with practical ethics. Use it as a living document—tweak questions based on what works. Remember: Your role is to resolve *inconsistency*, not to be the arbiter of good or bad goals.
