     - Tier: C. Weak on dissolution; feels like it dodges the problem.

  5. Recursive self-model opacity:
     - Explanatory: 9/10. Elegantly covers why mechanisms seem hidden.
     - Dissolution: 8/10. If recursion is the block, embracing it dissolves the mystery.
     - Tier: S. Tied with 1 for strong dual-aspect handling.

  6. First-person-authority semantics:
     - Explanatory: 5/10. Explains linguistic norms but not the pre-linguistic feeling.
     - Dissolution: 4/10. Doesn't make the problem go away; just notes a language game.
     - Tier: D. Least effective; too shallow.

  I notice similarities: 1, 3, and 5 could be complementary, but I'll rank separately as per instructions. For instance, 1 and 5 both deal with representation limits.

