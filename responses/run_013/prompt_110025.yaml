answer: |-
  Here's the spec sheet, distilled from the phenomena you've noted plus core philosophical puzzles. I've taught this for 12 years, and this list reflects the non-negotiable hurdles any theory must clear. I'll start with the expanded phenomena list, then analyze requirements, conflicts, and the killer constraint.

  **The Phenomena: What a Theory of Know-How MUST Explain (The Non-Negotiable List)**

  1.  **Procedural Fluency Without Propositional Articulation (Your Sailor):** A master practitioner performs flawlessly but cannot state the rules/instructions accurately (or at all). *Tests: Reduction of know-how to know-that.*
  2.  **Propositional Knowledge Without Ability (Your First Bowline Learner):** Possessing perfect factual instructions ("know-that") does not entail the ability to perform the action. *Tests: Sufficiency of know-that for know-how.*
  3.  **False Explanations with Sustained Performance (Your Expert):** A highly skilled agent offers a demonstrably false account of *how* they perform the skill, yet their performance remains unimpaired. *Tests: Dependence of know-how on accurate know-that.*
  4.  **Performance Disruption by Conscious Reflection (The Overthinker):** Explicitly attending to the steps of a normally fluent skill degrades performance (e.g., choking in sports, tying a knot while reciting rules). *Tests: Role of conscious access & the nature of "control" in know-how.*
  5.  **Non-Propositional Knowers (Animals/Toddlers):** Agents lacking language (and thus propositional attitudes) demonstrably possess complex, adaptive skills (e.g., squirrel caching nuts, toddler navigating playground). *Tests: Necessity of concepts/propositions for know-how.*
  6.  **Collective Know-How (Jazz Trio/Surgical Team):** A group reliably performs a complex, coordinated action that no individual member could perform alone, emerging from distributed, interdependent skills. *Tests: Location/possession of know-how & reducibility to individual know-how/-that.*
  7.  **Gradual Acquisition & Degradation:** Know-how is typically acquired through practice (not mere instruction) and can degrade with disuse in ways distinct from forgetting facts. *Tests: The learning mechanism & ontological status.*
  8.  **Adaptive Flexibility:** Know-how involves the ability to adapt the skill to novel contexts and unforeseen variations (e.g., riding a different bike, tying a knot with frozen fingers). *Tests: Rigidity vs. Intelligence of know-how.*
  9.  **Implicit Learning:** Complex skills can be acquired without conscious awareness of *what* is being learned or *how* (e.g., learning grammatical rules through immersion). *Tests: Necessity of conscious belief formation.*
  10. **Skill-Specific Pathology (Added):** Neurological conditions (e.g., apraxia) can impair the ability to perform specific skilled actions *while* leaving factual knowledge about those actions intact. *Tests: Dissociability from know-that.*

  **Your Outsourcing Case (The Phone Guy):** This *is* a real puzzle (Extended Cognition/Embodiment debate). A theory must explain the *dependency* here. Can he do it *without* the phone? If not, his "know-how" is arguably scaffolded by the tool, not intrinsically possessed. Does the phone "know how"? Probably not – it lacks agency/understanding. This tests the **boundaries of the agent** and **what constitutes "possession"** of know-how.

  ---

  **Analysis: Genuine Requirements vs. Prejudice, Conflicts, and the Killer Constraint**

  *   **Genuine Requirements (All the above):** Every phenomenon listed (1-10 & Outsourcing) represents a robust, empirically observable feature of skill and ability. A theory dismissing any of these is inadequate. They aren't camp-specific prejudices; they are the data points philosophy must account for.
  *   **Potential Prejudice Lurking:** The idea that know-how *must* be entirely **internal** or **non-representational**. While many arguments push this way (especially from 1, 3, 5, 9), a sophisticated intellectualist *might* try to accommodate them with complex propositional attitudes (e.g., under practical modes of presentation). Conversely, the idea that know-how is *always* **immune to belief** is challenged by how *accurate* coaching/instruction *can* sometimes improve performance (though 3 & 4 show it's not necessary).

  *   **The Major Conflict (Likely Jointly Unsatisfiable for Pure Theories):**
      *   **Phenomena 1, 3, 5, 9 (especially 5 - Animals/Toddlers)** scream that know-how **cannot be reduced to propositional knowledge (know-that)**. It must exist independently of language and conceptual belief.
      *   **Phenomenon 6 (Collective Know-How)** and the **Adaptive Flexibility (8)** of individual skills strongly suggest that know-how involves **intelligent guidance** – it's not mere reflex or blind habit (Ryle's "intelligent capacities" vs. "single-track dispositions"). This intelligence seems to require some form of *understanding* or *conceptual grasp* of the task and context.
      *   **The Conflict:** How can know-how be both **independent of propositional knowledge** (required by 1,3,5,9) and yet manifest **genuine intelligence and understanding** (required by 6,8, and the non-reflexive nature of skill)? Pure anti-intellectualism (just "abilities") struggles with the intelligence and collective aspects. Pure intellectualism (just "propositions") is demolished by 1,3,5,9. **This is the core tension.**

  *   **The Killer Constraint (Does the Most Work Ruling Out Candidates):**
      **Phenomenon 5: Non-Propositional Knowers (Animals/Toddlers).** This is the atomic bomb for *pure* intellectualist theories (those claiming know-how *is* or *necessarily requires* propositional knowledge). If a squirrel *knows how* to cache nuts for winter survival – exhibiting complex, adaptive, goal-directed behavior refined by learning – but lacks concepts/propositions/language, then know-how *cannot* be constituted by or necessarily depend on propositional attitudes. Any theory requiring propositions is dead on arrival. This constraint is rock solid.

  *   **How Main Camps Fare (Briefly):**
      *   **Intellectualism (e.g., Stanley & Williamson):** Fails spectacularly on 1, 3, 5, 9, 10. Struggles inherently with 4 & 8. Might handle 2 & 6 awkwardly. *Status: Critically wounded by 5.*
      *   **Anti-Intellectualism (Rylean Dispositions):** Handles 1, 2, 3, 4, 5, 9 well. Struggles significantly with 6 (collective), 8 (adaptive flexibility as *intelligent*), and explaining the *guidance* aspect without smuggling in "rules". Can feel too behaviorist/brute. *Status: Strong on basics, weak on sophistication.*
      *   **Embodied/Enactive Cognition (e.g., Noë, Dreyfus):** Excels at 1, 3, 4, 5, 8, 9, 10. Handles Outsourcing naturally (skill extends into world). Offers a richer account of intelligence (8) without propositions. Struggles somewhat with 6 (distributed agency) and articulating the *cognitive* aspect of learning complex *cognitive* skills (beyond sensorimotor). *Status: Currently the most promising for covering the list.*
      *   **Ability-Based Views (e.g., Hornsby):** Refine Ryle, focusing on *abilities*. Handle 1-5, 9, 10 well. Still grapple with 6 & 8 (what *structures* the intelligent ability?).

  **Confidence & The Wobbly Bit**

  *   **High Confidence:** The core phenomena (1-10) are genuine requirements. Animal/toddler know-how (5) is the most potent constraint. The core conflict (Non-propositional vs. Intelligent Guidance) is real and central.
  *   **Moderate Confidence:** The Outsourcing case is a valid test of boundaries/scaffolding. Pure Intellectualism is untenable. Embodied/Enactive views currently cover the most ground.
  *   **Least Confident Claim (The Bit to Quote Carefully):** "**Pure anti-intellectualism (just 'abilities') struggles significantly to explain the *intelligent guidance* inherent in adaptive flexibility (8) and collective know-how (6) without implicitly relying on *some* form of non-propositional understanding or practical grasp.**" I'm confident it *struggles*, but I'm less certain whether this is an *insurmountable* flaw or if a sophisticated ability view *can* fully account for this intelligence without crossing into territory requiring concepts. The nature of the "understanding" in skilled action without propositions remains philosophically contested ground. This is where the hardest work is being done.

  This list defines the playing field. Any theory failing any of these phenomena fails the test of adequacy. The tension between the non-propositional basis of know-how and its intelligent character is where the deepest philosophical work lies. Good luck with the feature!
