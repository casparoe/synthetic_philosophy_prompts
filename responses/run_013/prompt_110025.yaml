  Now, assessing which requirements are genuine versus biased. The journalist’s cases all seem valid, rooted in real-world examples. But the outsourcing case might be contentious. Some might argue that incorporating tools extends know-how rather than replacing it. However, the core issue—reliance on external aids without internalization—tests whether know-how requires personal embodiment.

  Conflicts in the requirements: Intellectualism (reducing know-how to know-that) struggles with false beliefs and animals/toddlers. Anti-intellectualism has issues with collective know-how and outsourcing. Rylean dispositions might explain fluency but not the cognitive aspects of learning. Embodied approaches handle animals and overthinking but could falter with collective cases.

  The most critical requirement is probably animal/toddler know-how because it directly challenges intellectualism. If a theory can't account for non-propositional agents having skills, it fails a basic test. This requirement rules out pure propositional accounts effectively.

  Among camps, intellectualism (Stanley, Williamson) uses propositions to explain know-how but stumbles on false beliefs and animals. Anti-intellectualism (Ryle, Noë) emphasizes ability but may struggle with collective know-how. Embodied cognition handles practical aspects but might blur individual vs. distributed agency.

  I'm least confident about the outsourcing case. It's a modern extension and theories might need to adapt to technology. Is the phone part of the extended mind, or does the user lack know-how? This is still debated, so I should flag it as uncertain.

