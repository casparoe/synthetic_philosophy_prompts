  Here is a joint statement structured as requested, designed to clarify rather than escalate the dispute:

  **Joint Statement: On the Limits of Law and Morality**

  Recognizing a year of debate over the proper grounds for legal coercion, we agree on the following foundational points and commit to a structured disagreement:

  **I. Agreed Claims:**

  1.  **Core Commitments:** The Legal Moralist (LM) holds that a society's shared morality is a constitutive element of its existence and stability, providing a *prima facie* reason for the law to prohibit conduct deemed seriously immoral by the community, even absent direct harm to non-consenting parties. The Liberal (Lib) holds that preventing harm to non-consenting others is the *only* legitimate reason for legal coercion; offense, disgust, or judgments of inherent immorality are insufficient grounds.
  2.  **Not Perfectionism:** The LM does not claim the law must enforce *all* morality or make people virtuous. The Lib does not claim individuals are immune from social criticism or that morality is irrelevant to life, only that it is not a legitimate basis for *state coercion* via the criminal law.
  3.  **Empirical Costs:** Both sides acknowledge that enforcing moral norms through law carries significant potential costs (e.g., hypocrisy, blackmail, discriminatory enforcement, erosion of respect for law, stifling experimentation). Both agree these costs are empirical and must be weighed against any purported benefits of enforcement. Neither side dismisses these costs *a priori*.
  4.  **Fallibility & Scope:** The LM accepts that a moral judgment being widespread does not guarantee it is correct, and that principles like liberty or privacy can override the *prima facie* reason for prohibition. The Lib accepts that defining "harm" involves line-drawing and that some harms (e.g., to institutions, social fabric) might be diffuse or indirect.
  5.  **"Harm" Stretching:** Both acknowledge that stretching "harm" to include the mere erosion of a shared moral environment *because* it is shared is a point of deep contention. This is a substantive disagreement about the nature of society and law, not merely a verbal dispute. The Lib sees this as an illegitimate conceptual stretch masking moralism; the LM sees it as recognizing a genuine societal interest.
  6.  **Target of Law:** Both agree the core dispute concerns the justification for *criminal prohibition* of consensual conduct causing no direct/non-consensual harm. Both principles *could* potentially apply to regulation (zoning, licensing), but the primary focus and strongest disagreement relate to criminalization.
  7.  **The "Reformer" vs. "Ordinary Person":** The LM is committed to the "ordinary person's" morality (the prevalent, settled convictions of the community) as the relevant standard, *not* the reformer's view of what morality *should* be. The Lib rejects both as grounds for criminalization.

  **II. Disagreements Table:**

  | Crux Issue                          | Legal Moralist Position (as self-described)                                                                                                                                 | Liberal Position (as self-described)                                                                                                                                                                | Agreed Evidence/Case Bearing on Crux                                                                                                 | LM Prediction                                                                                                  | Lib Prediction                                                                                                 |
  | :---------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------- |
  | **1. Grounds for Criminalization**  | "The law may justifiably criminalize conduct seriously condemned by the prevalent moral feeling of the community as destructive of its shared way of life, even if it directly harms only willing participants, provided the intolerance, indignation, and disgust felt are deep and widespread." | "The law may justifiably criminalize conduct *only* to prevent harm (understood as a wrongful setback to the interests of non-consenting others); mere moral wrongness, offense, or disgust felt by the majority are illegitimate grounds for criminal prohibition." | **Case:** Criminalization of private, consensual adult sodomy/homosexuality (historically).                                          | Criminalization stabilizes social cohesion by affirming shared norms. Repeal weakens moral fabric over time.    | Criminalization creates misery, blackmail, & disrespect for law without preventing tangible harm. Repeal has no such costs. |
  | **2. Nature & Source of Morality**  | "The relevant moral standard is the actual, deeply held, prevalent moral judgment of the ordinary person within the community, reflecting established social values."                                                                 | "The legitimacy of coercion depends on preventing harm, not on the source or popularity of a moral belief. Neither majority opinion nor tradition confers legitimacy on criminalizing harmless acts." | **Case:** Town poll: 55% deem private gambling dens "wicked & destructive," 45% see them as "harmless fun." Should they be banned? | Legitimacy weakens significantly without clear majority condemnation; enforcement risks social division.        | A ban based solely on 55% moral condemnation is illegitimate tyranny of the majority, regardless of enforcement costs.    |
  | **3. Scale/Publicity of Conduct**   | "Widespread, franchised, advertised conduct flouts the shared morality publicly and is inherently more destructive to the social fabric than isolated, private acts. The law may justifiably treat them differently."                 | "The scale or publicity of consensual, harmless conduct is irrelevant to the *principle* of justifiable coercion. If the act itself isn't harmful, doing it more openly or frequently doesn't make it harmful." | **Case:** Private BDSM club (11 members, 30 years) vs. Nationwide "BDSM Experience" franchise with billboards.                          | Franchise inherently erodes shared morality by normalizing the act; private club's impact is negligible.         | If private act is harmless, franchise is also harmless. Opposition is mere offense/disgust, not harm prevention. |
  | **4. Role of Enforcement Costs**    | "The significant empirical costs of enforcing morals prohibitions (hypocrisy, blackmail, etc.) are powerful reasons of expediency that can, and often should, defeat the prima facie case for prohibition."                             | "The significant empirical costs of enforcing morals prohibitions are not merely practical drawbacks but fundamental objections revealing the illegitimacy and inherent injustice of the endeavor itself." | **Case:** Historical enforcement of adultery laws or sumptuary laws.                                                                 | Costs are high & real, often decisive against enforcement *in practice*, but don't negate the legitimacy *in principle* if costs were low. | High costs are symptoms of trying to enforce the unenforceable (private morality) and confirm the principle's error.     |

  **III. Evidence Against Own View (Stipulated in Advance):**

  *   **Legal Moralist:** "Evidence against my view would be: (a) A society successfully decriminalizing a widely condemned 'victimless' vice (e.g., homosexuality, certain drugs) without suffering measurable societal collapse or erosion of other vital shared norms; (b) Empirical data showing enforcement costs (e.g., blackmail rates, prison populations for vice) consistently outweigh any measurable societal stability benefits."
  *   **Liberal:** "Evidence against my view would be: (a) Clear empirical demonstration that the widespread, open practice of a specific consensual act (harming no non-participants) demonstrably *causes* the breakdown of essential social institutions (e.g., collapse of voluntary association, pervasive distrust) in a way tightly causally linked to that act; (b) A society where criminalizing such an act demonstrably *prevents* significant, measurable harm to non-consenting others (beyond offense)."

  **IV. Analysis of User's Proposed Test:**
  *   "A ban on conduct that harms no one but the willing participants is legitimate only if two-thirds of residents call the conduct morally wrong, they call it wrong *without attributing any harm to it*, and it gets enforced at the same rate in every neighbourhood."
  *   **LM Verdict:** Straw Man. Rejects the "no harm attribution" requirement (their core point is immorality *without* harm attribution). Finds the 2/3 threshold arbitrary (prefers "prevalent, deep-seated"). Agrees enforcement disparity is bad, but sees it as an implementation flaw, not invalidating the principle. *Predicts:* Such a rule would rarely be triggered (few acts meet 2/3 non-harm-based condemnation), and where triggered, enforcement disparities would likely persist, fueling criticism.
  *   **Lib Verdict:** Straw Man. Rejects the core premise that moral condemnation alone (even at 2/3) *can* legitimate a ban. The test incorporates elements they oppose (morality as grounds, no harm requirement). Sees enforcement uniformity as practically impossible for morals laws. *Predicts:* The rule might slightly curb the worst excesses but would still permit illegitimate bans based solely on majority disgust. Enforcement would inevitably be uneven.

  **V. Unconsidered Case:**
  *   **Case:** **Legally Mandated Post-Mortem Organ Donation (Opt-Out System).** No direct harm to a living non-consenting other (the deceased consented implicitly by not opting out). Saves lives (prevents harm). Violates deeply held moral/religious views about bodily integrity and burial rites for a significant minority (or even majority?).
  *   **Why it's Hard:** LM - Does preserving the "shared morality" against violation of the dead body outweigh the life-saving benefit? Is the moral feeling sufficiently "prevalent" and "intense"? Lib - Is the violation of the deceased's (presumed) wishes or family's/community's profound distress a "harm" sufficient to override the harm prevented by saving lives? Or is it mere offense/moral disgust? The agreed claims don't settle whether profound ritual/spiritual violation constitutes "harm" in the Lib sense or how intensely the LM principle weighs established burial norms against tangible life-saving benefits. Both principles require difficult balancing here, exposing unresolved tensions within each framework.
