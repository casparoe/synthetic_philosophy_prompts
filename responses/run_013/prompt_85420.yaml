       - Whether such cyclic shifts are common or pathological (and thus whether diachronic rationality is a real requirement for ordinary agents) is contested.
       - Whether rationality requires avoiding such sequences even when each step is rational is hotly debated. Synchronicists (like some decision theorists and economists) deny any diachronic requirement, while diachronicists (like some philosophers) argue that rationality must take into account the entire course of action.
       - The normative force of ex ante and ex post evaluations is contested: should the agent at t0 have the authority to bind the agent at t1 and t2? And if so, by what mechanism?

  Note: The above case is a version of a "preference reversal" money pump, adapted to avoid momentary intransitivity. The loss comes from the trades (paying for two drinks when one would have sufficed) due to shifting tastes.
answer: |-
  ### The Case: The Lunch Voucher Cycle
  Alex works in an office and starts Monday with a lunch voucher for Café A (valued at $10) and $5 cash. Each day, Alex's lunch preferences shift predictably: on Monday, Alex prefers Café B to Café A; on Tuesday, prefers Café A to Café B; and by Wednesday, cycles back to preferring Café B. These shifts are known to Alex, who is sophisticated and foresees the cycle. Trades are frictionless: colleagues swap vouchers 1:1 if both gain (no fees or power imbalances).  

  - **Monday**: Preferring Café B, Alex trades their Café A voucher for a Café B voucher with a colleague (who prefers Café A). *Gain at t1: Strict improvement (B > A).*  
  - **Tuesday**: Now preferring Café A, Alex trades their Café B voucher back for a Café A voucher with another colleague (who prefers Café B). *Gain at t2: Strict improvement (A > B).*  
  - **Wednesday**: Preferring Café B again, Alex repeats Monday’s trade: swaps Café A for Café B. *Gain at t3: Strict improvement (B > A).*  

  Alex ends Wednesday with the *same voucher type* (Café B) as after Monday’s trade but has **lost $5** from unrelated small daily expenses (e.g., bus fare). Crucially:  
  - **Ex ante (Sunday)**: Alex ranked starting bundle (Café A + $5) over ending bundle (Café B + $0).  
  - **Ex post (Wednesday)**: Alex still ranks (Café A + $5) over (Café B + $0), as the $5 loss outweighs voucher preferences.  
  *Loss source*: The $5 was spent incidentally (e.g., commuting), *not on trades*. The trades themselves are costless but enable the loss by resetting the voucher to a state that triggers further trades.  

  ---

  ### Walkthrough  
  1. **Synchronic rationality endorses each step**  
     - At each moment (t1, t2, t3), Alex’s preferences are complete and transitive. Trading is strictly preferred: it maximizes utility given current tastes. Standard decision theory (e.g., Savage) approves each step.  

  2. **Diachronic rationality condemns the sequence**  
     - Theories requiring coherence over time (e.g., McClennen’s *resolute choice*) argue that foreseeing a dominated outcome (losing $5 for no net voucher gain) makes the sequence irrational. The agent should "bind" themselves to avoid the cycle.  

  3. **The pumping feature: Cyclical preferences + sequential opportunities**  
     - The cycle (B > A > B) creates repeated incentives to trade. Crucially, the trades *reset the status quo*: after each swap, Alex holds a voucher dispreferred the next day, reigniting the cycle. The $5 loss occurs *because* the cycle prolongs exposure to incidental expenses.  

  4. **Delete cyclical preferences?**  
     - If preferences stabilize (e.g., Alex permanently prefers B), only one trade occurs. Alex keeps Café B + $5 minus one day’s expense ($1), ending with Café B + $4—a net gain. **No pump occurs.**  

  5. **Delete sequential opportunities?**  
     - If trades are batched (e.g., all swaps on Sunday), Alex sees no strict gain (no momentary preference justifies trading A for A). **No pump occurs.**  

  ---

  ### Synchronicist Defense  
  A synchronicist (e.g., Hedden, Christensen) attacks the case by arguing:  
  - **Authority of current preferences**: Rationality is moment-relative. Alex’s Tuesday trade *is* rational because it maximizes utility *on Tuesday*. The ex ante/ex post evaluations are irrelevant—they aren’t the agent’s preferences *at choice points*.  
  - **No incoherence in the moment**: Since each step is preference-maximizing, condemning the sequence imposes a "mysterious" diachronic duty.  
  - **Pragmatic rebuttal**: Alex can avoid loss by *not spending the $5* (e.g., walking to work). The pump relies on ancillary spending, not the trades themselves.  

  ---

  ### What’s Settled vs. Contested  
  | **Aspect**                          | **Settled**                                                                 | **Contested**                                                                                                                                 |  
  |-------------------------------------|-----------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------|  
  | **Feasibility of pump**             | Yes, with cyclical shifts + sequential choices (established since Hammond/Seidenfeld). | Whether such shifts are "rational" or pathological (e.g., Arntzenius).                                                                       |  
  | **Synchronic endorsement**          | Uncontroversial: each step is rational given current preferences.           | —                                                                                                                                            |  
  | **Diachronic requirement**          | —                                                                           | **Core dispute**: Is avoiding foreseeable dominated sequences rationally *required* (McClennen, Gauthier) or merely prudent (synchronicists)? |  
  | **Role of sophistication**          | All agree it prevents "surprise" pumps (unlike naïveté).                    | Whether sophistication *compels* cycle-avoidance (diachronicists) or is irrelevant (synchronicists).                                         |  
  | **Normative weight of ex post view** | All agree ex post regret doesn’t invalidate past rationality.               | Whether ex ante planning authority overrides current preferences (e.g., Bratman vs. Christensen).                                            |  

  **Key divide**: Synchronicists see rationality as atomistic; diachronicists see it as holistic. This case sharpens the debate but doesn’t resolve it—**no consensus exists in decision theory or philosophy**.
