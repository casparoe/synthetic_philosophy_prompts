  Now, let's write the case in a paragraph:

  **Case: The Coffee-Tea Cycle**

  Alex starts the workday with $3 and no drink. Alex's preferences shift predictably: at 8am, Alex strongly prefers coffee to tea; by 10am, after drinking coffee, Alex prefers tea. At the start and end of the day, Alex prefers having one drink and $2 to having both drinks and $1, and having no drink and $3 to both. At 8am, Alex buys coffee for $1 (strictly improving from the starting bundle at that moment). At 10am, Alex buys tea for $1 (strictly improving at that moment). At the end of the day, Alex has both drinks and $1, a bundle Alex now disprefers to the starting bundle (no drink, $3). Alex is sophisticated and foresaw the entire cycle but, without commitment mechanisms, proceeded anyway.

