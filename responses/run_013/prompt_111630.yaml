answer: |-
  Here are five desiderata for an adequate theory of precommitment:

  1.  **The theory must explain how legitimate sovereignty can bind itself to prevent future self-defeating actions.** This addresses the core paradox: how a sovereign entity (individual or collective) can intentionally restrict its own future freedom of choice without negating its sovereignty. *Motivating Case:* Constitutional entrenchment clauses limiting amendment powers. *Negotiability:* Non-negotiable; foundational to the concept.

  2.  **The theory must account for the irrevocability or significant costliness of reversing the precommitment device.** Merely revocable "commitments" lack binding force. The theory must explain why the device persists despite the bound self's desire to abandon it. *Motivating Case:* Odysseus bound to the mast; addicts using legally binding contracts to restrict fund access. *Negotiability:* Non-negotiable for binding precommitment; negotiability concerns *degree* of cost/irrevocability. *This requirement excludes popular purely rational choice accounts that treat precommitment as just another preference-based choice at time T2.*

  3.  **The theory must provide a mechanism for enforcing the precommitment against the bound self's contrary will at the time of action.** Without effective enforcement, the precommitment is merely advisory. The theory must specify how the initial decision prevails over the later preference. *Motivating Case:* Independent central banks insulated from political pressure; courts upholding Ulysses contracts against revocation pleas. *Negotiability:* Non-negotiable; defines the *effectiveness* of precommitment. *This requirement conflicts with Requirement 1 (Sovereignty Binding) regarding the source of enforcement legitimacy against the current sovereign will.*

  4.  **The theory must specify conditions under which the bound self's desire to revoke is deemed inauthentic or irrational relative to the precommitting self's perspective.** It must distinguish a genuine change of circumstances/will from a failure of will the device was designed to prevent. *Motivating Case:* Revocation clauses permitting exit only if a trustee certifies the later change of mind as authentic (e.g., a patient's advanced directive for refusing life support: the bound self sees trustee refusal as failure, the precommitting self sees trustee refusal as success). *Negotiability:* Negotiable; theories differ on criteria for authenticity/rationality (e.g., cognitive state, information symmetry, core values).

  5.  **The theory must demonstrate the effectiveness of the device in achieving the precommitting self's goals better than alternative strategies available at T1.** It must justify why precommitment is the superior solution to the time-inconsistency problem faced by the precommitting self. *Motivating Case:* Supermajority rules for constitutional amendments aiming to ensure stability vs. simple majority rule. *Negotiability:* Negotiable regarding *how* effectiveness is measured and compared; non-negotiable that the theory must address comparative effectiveness.
