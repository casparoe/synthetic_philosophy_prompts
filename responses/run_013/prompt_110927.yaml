prompt: |-
  I'm a philosophy professor, and I'm putting together a lecture on the Frege-Geach problem for my metaethics seminar. I've taught it before, but this time I've been reading alot of the recent expressivist stuff and trying to get clear on the negation problem, and now I'm worried I've been misrepresenting the whole thing. Here's my reconstruction: expressivists say that 'lying is wrong' expresses disapproval of lying. But then 'lying is not wrong' can't just be the negation of that, because if the original sentence expresses an attitude rather than states a fact, there's nothing there to negate. So the expressivist has to say that 'not wrong' expresses some second-order attitude, like disapproval of the disapproval of lying. And if they do that, then 'not' in moral contexts doesn't mean what 'not' means in ordinary descriptive contexts. But if 'not' changes meaning, then moral arguments that use negation equivocate, so they're invalid. So doesn't the negation problem show that expressivists can't have a logic of moral language at all? And doesn't that mean the Frege-Geach problem is not just a problem about embedding but a proof that expressivism is inconsistent with classical logic?

  A grad student of mine keeps pressing me on whether the expressivist can even define negation for attitude-expressing sentences, and I keep telling her that's seperate from the Frege-Geach problem proper, not a new objection. But now I'm not sure. I want to present the strongest version of the objection, but I also don't want to tell my students something false. So is the standard expressivist reply to say that moral arguments are valid in a non-classical sense, or do they just bite the bullet and admit that moral modus ponens isn't really valid? And if they respond by giving truth conditions for embedded moral sentences, haven't they just become cognitivists with extra steps?
reasoning: |-
  Okay, the user is a philosophy professor preparing a lecture on the Frege-Geach problem, specifically focusing on the negation problem for expressivism. They're concerned they might have misrepresented the issue and want to clarify several points.

  First, I need to address their reconstruction. They're correct that expressivists face a challenge with negation. The core issue is that if "lying is wrong" expresses disapproval, then "lying is not wrong" can't just be the absence of that attitude—it needs to express a distinct attitude. But if expressivists claim it expresses a second-order attitude like disapproval of disapproval, this seems to change the meaning of negation in moral contexts. That would make moral arguments that use negation equivocal and thus invalid under classical logic.

  The user's grad student is pressing on whether expressivists can define negation for attitude-expressing sentences. The user thought this was separate from Frege-Geach, but actually, the negation problem is a specific instance of the embedding issue. Frege-Geach is about all embeddings (conditionals, disjunctions, etc.), with negation being a particularly tricky case. So the student's point is valid—it's part of the same problem.

  Regarding solutions, contemporary expressivists like Blackburn and Gibbard don't abandon classical logic. Instead, they develop more sophisticated frameworks. Blackburn's quasi-realism aims to show how moral language can have logical properties without positing moral facts. He uses higher-order attitudes to explain embeddings. For negation, "not wrong" might express tolerance or a refusal to disapprove, but he ensures this fits within a system where logical rules still apply.

  Gibbard's norm-expressivism uses a possible worlds framework, assigning mental states as truth-makers. This allows him to define logical operators uniformly. Schroeder's Being For approach treats attitudes as a kind of descriptive content, which helps with compositionality. These approaches try to mirror classical logic's outcomes, so they don't have to admit that modus ponens is invalid or adopt non-classical logic.

  The user asks if providing truth conditions makes expressivists cognitivists. Not necessarily. Quasi-realists like Blackburn argue that truth conditions can be explained expressivistically—truth as the correctness of attitudes. So they're not positing mind-independent facts. It's a nuanced position that maintains expressivism while accommodating logic.

  The user should emphasize that the negation problem highlights the broader embedding challenge. The solutions involve complex technical work to preserve logical validity without collapsing into cognitivism. It's still a debated area, but expressivists have developed substantial responses. Highlighting the evolution of these theories in recent literature would strengthen the lecture.
answer: |-
  You've hit on exactly the right nerve centers of the contemporary debate. Your reconstruction of the core *negation problem* is spot-on, and your concerns about misrepresentation are justified – it's a complex and evolving area where older textbook summaries often fall short. Let's break this down systematically for your lecture:

  1.  **Your Reconstruction is Largely Correct (The Problem):**
      *   **Expressivist Core:** 'Lying is wrong' expresses a *non-cognitive attitude* (e.g., disapproval of lying).
      *   **The Negation Challenge:** 'Lying is not wrong' cannot simply express the *absence* of disapproval (that would be indifference, which isn't the same as thinking something is *permissible*). It needs to express a *positive* attitude.
      *   **The Proposed Solution & Its Cost:** If the expressivist says 'not wrong' expresses a distinct, higher-order attitude (e.g., disapproval *of* disapproval of lying, or approval of lying, or tolerance), then the semantic contribution of 'not' in this context differs fundamentally from its contribution in descriptive contexts (where it simply flips a truth value).
      *   **The Logical Consequence (The Real Problem):** If 'not' means something different in moral contexts, then arguments combining descriptive and moral premises using negation appear to commit a fallacy of equivocation. Modus tollens, reductio ad absurdum, and even simple inferences like "If lying is wrong, then not telling the truth is wrong; lying is not wrong; therefore, not telling the truth is not wrong" seem threatened. This isn't *just* about embedding; it's about the *logical properties* of the connectives themselves within mixed contexts. **Your grad student is right to press on defining negation; it's absolutely central to the Frege-Geach problem for expressivism, not a separate issue.** The problem *is* showing how logical operators retain their standard meaning and function when applied to sentences expressing non-cognitive states.

  2.  **Is Expressivism Incompatible with Classical Logic?**
      *   **The Threat:** Yes, the negation problem (and Frege-Geach generally) poses a *serious threat* that expressivism cannot account for the validity of moral arguments using classical logic without collapsing into inconsistency or meaning variance for the logical operators.
      *   **The Expressivist Goal:** However, contemporary sophisticated expressivists (Blackburn, Gibbard, Schroeder) explicitly aim to *preserve* classical logic. Their project is to show *how* an expressivist semantics can underwrite the *same* logical inferences we intuitively recognize as valid within moral discourse. **They emphatically do *not* want to bite the bullet and say moral modus ponens isn't *really* valid or adopt a non-classical logic for morals.** Doing so would be admitting defeat and rendering moral argumentation rationally inert.

  3.  **Standard Contemporary Replies (How They Try to Solve It):**
      Expressivists don't have *one* reply; they have developed complex frameworks. Here are the main strategies:

      *   **Blackburn's Quasi-Realism & Higher-Order Attitudes:** Blackburn's project aims to "earn the right" to realist-sounding talk (truth, validity) from expressivist foundations. For embeddings, he uses the idea of attitudes towards combinations of attitudes/commitments.
          *   *"Lying is wrong"*: Expresses disapproval (Boo! lying).
          *   *"Lying is not wrong"*: Expresses a *refusal* to disapprove of lying (or perhaps tolerance/approval, though he often frames it as rejecting the commitment to disapproval). Crucially, he analyzes this as a *higher-order attitude*: disapproval *of* the (first-order) attitude of disapproving of lying. The key move is developing a logic of these commitments and attitudes. He argues that the *inferential role* of 'not' in moral contexts can be defined in terms of these higher-order attitudes in a way that *mimics* the inferential role of descriptive negation, thereby preserving validity within a system tracking normative commitments. It's complex, and critics argue the mimicry isn't perfect or that it smuggles in truth-conditions.
      *   **Gibbard's Norm-Expressivism & World-Norm Pairs:** Gibbard provides a more formal semantics. He analyzes moral judgments as expressions of plans or norms. To handle embeddings, he introduces "factual-normative worlds" (combinations of descriptive states and normative systems). A sentence is "true" relative to a world-norm pair if it holds according to that norm in that world.
          *   *"Lying is wrong"*: True at <w, n> iff n forbids lying in w.
          *   *Negation*: Defined standardly: ~P is true at <w, n> iff P is not true at <w, n>.
          *   *Logical Operators*: Connectives like 'not', 'and', 'if...then' are defined truth-functionally *over these world-norm pairs*. This provides a compositional semantics where the meaning of 'not' is uniform – it operates on the truth-value (relative to <w, n>) of the embedded sentence. Validity is defined as truth-preservation across *all* world-norm pairs. This *looks* cognitivist, but Gibbard insists the "truth" here is a formal construct within his expressivist model; the fundamental act is still planning/endorsing norms. **This is the most direct reply to the negation problem: define a uniform semantics for operators over a domain that includes the relevant non-cognitive state.**
      *   **Schroeder's "Being For" & Representationalist Expressivism:** Schroeder offers a radically minimalist approach. He proposes that all normative sentences express the same fundamental attitude: *being for*. What varies is the *content* towards which one is "for".
          *   *"Lying is wrong"*: Expresses being for blaming for lying.
          *   *Negation*: Schroeder defines a compositional semantics where negation operates on the *descriptive content* embedded within the "being for" attitude. 'Not wrong' expresses being for *not* blaming for lying. The key innovation is treating the attitude ("being for") as a constant, logical operator-like element that combines with descriptive contents in a structured way, allowing standard logical rules to apply to the descriptive components. This aims for compositionality and uniform operator meaning by reducing the attitude expressed to a single type.

  4.  **The Cognitivist-in-Disguise Charge (Your Last Question):**
      This is the most persistent and serious criticism. Does providing truth-conditions (Gibbard) or a compositional semantics tracking commitments (Blackburn) or structured propositions with a constant attitude (Schroeder) mean expressivists have *become* cognitivists?
      *   **Expressivist Response (Quasi-Realism):** They argue *no*. They maintain that the *fundamental explanation* of meaning remains non-representational and grounded in expressive function. The "truth-conditions" or "propositions" they invoke are *technical tools within their theory* used to model logical relations and explain surface features of language *from an expressivist starting point*. They are *not* positing mind-independent moral facts that sentences correspond to. The point of quasi-realism is to explain *why* moral language *looks and functions* cognitively without abandoning the core expressivist thesis about its fundamental nature. Blackburn: "The explanation is still that ethical commitments are not beliefs in the natural world... The truth is that we project attitudes onto the world."
      *   **Cognitivist Counter:** Critics (e.g., Dreier, van Roojen) argue that the elaborate machinery *does* constitute a form of cognitivism. If the semantics assigns truth-conditions (even relative to norms/plans) and defines validity classically over those truth-conditions, then moral judgments *are* being treated as having truth-apt content in a substantial sense. The "expressivist" label becomes merely a story about the *metaphysical grounding* of these truth-conditions, not a distinct semantic theory. The extra steps *are* the cognitivism.

  **What to Tell Your Students:**

  1.  **The Negation Problem is Core:** Emphasize that the negation problem is *not* separate; it's a crucial, hard instance of the Frege-Geach embedding challenge, directly threatening the uniform meaning of logical operators and thus the validity of moral arguments. Your grad student is correct to focus on it.
  2.  **The Threat is Real:** A naive expressivism *does* face a devastating logical challenge. It cannot simply treat 'not wrong' as the absence of 'wrong'.
  3.  **Contemporary Expressivism is Sophisticated:** Modern expressivists (Blackburn, Gibbard, Schroeder) explicitly aim to *solve* this problem *within* classical logic. They develop complex semantic frameworks (higher-order attitudes, world-norm pairs, minimalist "being for" structures) to provide compositional semantics that preserve the validity of standard inferences.
  4.  **The Central Tension & Debate:** The key philosophical question becomes: **Do these sophisticated frameworks succeed in providing a genuinely *expressivist* explanation of moral logic, or do they collapse into a form of cognitivism by stealth?** This is where the live debate lies. Present Gibbard's semantics and Schroeder's "being for" as direct attempts to solve the negation problem compositionally, and Blackburn's quasi-realism as the broader project justifying the use of realist-sounding logic. Acknowledge the powerful cognitivist counter-argument that the solutions look suspiciously like cognitivism with expressivist metaphysics tacked on.
  5.  **No Easy Answers:** Conclude that the negation problem/Frege-Geach problem is not a simple "proof" of expressivism's inconsistency, but rather an immensely difficult challenge that has driven expressivists to develop highly sophisticated, but still controversial, theories. Whether those theories succeed on expressivist terms remains hotly contested. The debate showcases the profound difficulty of reconciling a non-representational account of moral judgment with the logical structure of moral discourse.

  By framing it this way, you present the strongest version of the objection (the logical threat via operator meaning variance), the sophisticated expressivist responses, and the core metaethical tension (quasi-realism vs. cognitivism-in-disguise) that defines the current landscape. This avoids misrepresentation and gives your students the depth they need.
