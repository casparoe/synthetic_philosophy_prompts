  ### Brainstorming Candidate Rules
  To predict R.'s verdict on the inflaton, I first analyze her verdicts on historical and contemporary posits to infer candidate rules that jointly fit her pattern of judgments. R. is a selective realist who navigates the pessimistic meta-induction (PMI) by distinguishing "reliable" posits from those likely to be abandoned. Her verdicts suggest a focus on epistemic virtues like predictive success, indispensability, and robustness, rather than direct detectability or theoretical elegance. Below are the candidate rules derived from her record, along with their predictions for the inflaton.

  1. **Rule 1: Novel Predictive Success and Indispensability (NPSI)**  
     - **Description**: An entity is real if (a) its postulation leads to novel, specific, and confirmed predictions, and (b) it is indispensable to the explanatory framework (i.e., the theory fails without it, and no viable rival exists that explains the same phenomena without the entity).  
     - **Fits Verdicts**:  
       - Real: Electromagnetic field (novel predictions like EM waves; indispensable to Maxwell's theory), Dalton's atom (predictions in chemistry; indispensable and preserved), neutrino (predicted to save energy conservation; confirmed indirectly and directly), Higgs boson (predicted for electroweak symmetry breaking; confirmed), Neptune (predicted and found), Mendelian gene (predictions in inheritance; indispensable and preserved despite reconception), quarks (predicted in QCD; confirmed indirectly despite confinement).  
       - Not real: Phlogiston (no novel predictions; dispensable after oxygen theory), caloric (Carnot's results survived, so caloric was dispensable), ether (no confirmed novel predictions; replaced by relativity), absolute space (dispensable in relativity), Vulcan (prediction failed), SUSY partners (no confirmed predictions; elegance irrelevant).  
     - **Prediction for Inflaton**: Real. The inflaton was postulated to solve cosmological problems and made novel predictions (e.g., CMB fluctuations) that were confirmed. It is currently indispensable to inflationary cosmology, with no equally successful rival framework.

  2. **Rule 2: Preservation Under Theory Change (PUTC)**  
     - **Description**: An entity is real if it is preserved across theory changes (e.g., its core properties or role remain intact in successor theories), even if reconceived. Novel predictions are secondary; survival through scientific revolutions is key.  
     - **Fits Verdicts**:  
       - Real: Dalton's atom (preserved in atomic physics despite subdivision), Mendelian gene (preserved in molecular biology), electromagnetic field (unchanged in relativity and QED), neutrino (preserved in Standard Model), quarks (preserved), Higgs (preserved).  
       - Not real: Phlogiston (abandoned), caloric (abandoned), ether (abandoned), absolute space (abandoned), Vulcan (never existed), SUSY partners (not preserved in current physics).  
     - **Prediction for Inflaton**: Not yet decidable. The inflaton is too recent to have survived a major theory change. Rival frameworks (e.g., bouncing cosmologies) could replace it, so preservation is unconfirmed.

  3. **Rule 3: Explanatory Necessity and Confirmation (ENC)**  
     - **Description**: An entity is real if it is necessary to explain a robust phenomenon (e.g., saving a conservation law or resolving a paradox), and this necessity is confirmed through empirical tests, regardless of direct detection. Novel predictions are not required if the entity resolves a critical inconsistency.  
