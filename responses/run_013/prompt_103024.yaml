answer: |-
  ### Thought Experiment: The Historian's Oversight

  **(a) Scenario**  
  Alex, a local historian, is writing about a 19th-century town fire. While researching, Alex finds a diary entry by a respected merchant describing the fire's cause as faulty wiring in the bakery. The handwriting and context confirm it’s authentic, and Alex knows this diarist was generally reliable about town events. Unnoticed by Alex, however, is a footnote in a book they read last year: it documented that this diarist was prone to conflating events *specifically involving fires* due to a traumatic childhood experience (a fact verified by other sources). Alex forms a sincere belief that the bakery wiring caused the fire—a claim that is, in fact, true. When asked by a colleague, Alex asserts: "The bakery’s faulty wiring started the fire."

  **(b) Verdicts & Reasoning**  
  - **Truth Norm (assert only what is true)**: *Permits*. The assertion is true (the wiring did cause the fire). Truth alone suffices for permission.  
  - **Belief Norm (assert only what you believe)**: *Permits*. Alex genuinely believes the assertion based on the diary’s evidence, and this belief isn’t irrational—it stems from a source Alex reasonably (though mistakenly) regards as reliable.  
  - **Knowledge Norm (assert only what you know)**: *Forbids*. Alex lacks knowledge. The unattended footnote—a possessed but unintegrated reason—defeats justification. Though the diary is reliable and Alex’s belief is true/justified, the defeater prevents the belief from being "safe" or "sensitive" in a way required for knowledge. Alex’s epistemic position is fragile: had they attended to the footnote, they would have (and should have) withheld belief. The norm forbids assertion because asserting without knowledge risks misleading others given the defeater’s social significance (e.g., colleagues might rely on Alex’s authority).  
  *Meta-theory note*: This verdict assumes *internalist defeat* (defeaters need not be conscious to undermine knowledge). Externalists may contest this, but the case targets internalist-leaning knowledge norms (e.g., Williamson’s).

  **(c) Isolable Feature & Removal Test**  
  - **Feature**: Alex possesses a *specific, unattended reason against relying on the source* (the footnote about the diarist’s fire-related unreliability).  
  - **Removal Test**:  
    - *Actual case*: Defeater present → truth/belief norms permit; knowledge norm forbids.  
    - *Defeater removed* (Alex never encountered the footnote): All three norms *permit*. Alex knows the claim (reliable source, no defeaters), believes it, and it’s true.  
    - *Defeater replaced*:  
      - With *absent reason* (Alex *should* have read the footnote but didn’t): Knowledge norm *permits*—ignorance of undiscovered evidence doesn’t defeat knowledge (e.g., a doctor unaware of a new study still knows based on current evidence).  
      - With *conscious doubt* (Alex recalls the footnote and worries): Belief norm *forbids*—Alex wouldn’t believe firmly enough to assert.  

  **(d) Strongest Resistance for Knowledge Norm Defender**  
  *Defender’s argument*: "Forgotten defeaters don’t count. Knowledge requires only the *absence* of defeaters, not the ability to recall all relevant evidence. Alex’s belief *is* knowledge: it’s true, reliably formed, and the defeater is inert—it doesn’t affect the belief’s formation or resilience. Assertion is permissible because Alex’s epistemic position mirrors that of a knower in practical reasoning. The footnote is merely ‘noise’ unless activated."  
  *Counter*: This undermines the social function of assertion. If Alex asserts while possessing (but ignoring) a defeater that peers would deem relevant, they invite reasonable challenges, violating the "common ground" requirement of knowledge-based assertion (cf. Lackey 2007). The norm isn’t just about individual cognition but accountability to shared standards.

  ---

  ### Reverse Divergence Attempt: Knowledge Without Belief  
  **Scenario**: Jamie, a seasoned meteorologist, has seen thousands of radar patterns. Today, despite overwhelming radar evidence showing an approaching storm, Jamie feels an irrational, visceral certainty that "it won’t rain today" (due to a subconscious association with a childhood trauma on a similarly overcast day). Jamie asserts to a friend: "It will rain today," citing the radar. The radar is correct—it does rain.  

  **Analysis**:  
  - **Knowledge Norm**: *Permits*? Jamie has perceptual expertise and reliable evidence (knowledge-level justification), and the assertion is true.  
  - **Belief Norm**: *Forbids*? Jamie’s conscious, occurrent state is disbelief ("it won’t rain"), despite professing otherwise.  
  - **Does it succeed?** **No**.  
    - *Problem*: The assertion is not sincerely based on belief. Jamie’s words express a belief *in the expertise role* (parroting radar data), but their *personal conviction* opposes it. Crucially, assertion requires *committing to the truth of P*, which demands belief. Jamie’s case resembles *self-deception* or *alief* (Gendler 2008), but in ordinary terms, assertion norms tie sincerity to conscious endorsement. If Jamie doesn’t believe *P*, asserting *P* violates the belief norm—even if justified/true.  
    - **Blocking Premise**: *Knowledge entails belief*. This is a conceptual platitude (e.g., Williamson 2000: "Belief is necessary but not sufficient for knowledge"). One cannot know *P* while disbelieving *P*; knowledge requires taking *P* to be true. Jamie’s "knowledge" is merely dispositional (they *could* know it if they believed), but their active disbelief severs the link.  
    - *Why impossible?* Belief is the *cognitive attitude* of assent. Without it, assertion becomes hollow (e.g., acting or guessing). Even in "alief" cases, the speaker isn’t genuinely asserting but performing a speech act divorced from conviction. Thus, the belief norm’s requirement is inviolable in ordinary assertion.  

  **Conclusion**: While the first case cleanly isolates the knowledge norm via social defeat, the reverse divergence fails—knowledge without belief is incoherent in assertion contexts, as belief is the mental state assertion expresses.
