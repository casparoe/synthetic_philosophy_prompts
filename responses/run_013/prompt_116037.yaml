prompt: |-
  I'm a third-year student in a course on collective behaviour and rational choice, and next week I'm leading the forty-minute discussion of our session on information cascades and rational herding — fifteen classmates, all of whom have done the same reading and most of whom have come away with nothing more precise than "a cascade is when people copy each other." I don't want cascades explained to me; I want a plan for explaining them. Work out the order in which the components have to go so that each step feels forced rather than asserted — I'm assuming it has to start with Bayesian updating from a private signal, then the distinction between the action being observable and the signal not being, then the second person's inference, then the third person's, and only then the definition of a cascade — but tell me where that order is wrong, what can be collapsed, and whether the class should derive the third person's inference themselves or be walked through it. Choose the single example that carries the whole session. My candidate is two study spots of unknown quietness, where each arriving student has one private observation and can see only where the earlier arrivals sat; tell me whether to keep it or replace it, and say exactly what the example must have (identical and independent payoffs, sequential arrival, no communication) and must not have (payoff externalities, prices, a first mover who is visibly expert), since I suspect the canonical urn and restaurant versions smuggle in intuitions I'd rather they built for themselves. Then map the misconceptions. Mine, in the order I expect them: that herding is a lapse of rationality; that a cascade means the group landed on the truth; that any conformity is a cascade; that a cascade needs a crowd or a confident leader; and that a cascade, once started, is broken by someone with a strong private signal — I believe the asymmetry is that public information breaks it and private signals don't, and I want to know whether that should be the climax of the session. Tell me which of these are not misconceptions at all, which I have in the wrong order, what I've missed, and the precise moment in the sequence where each should be headed off. Finish with one question I can put to the room that will distinguish students who have understood the structure from students who can recite it, and tell me what to leave out at this level and to say so out loud. Be committed: where I've offered you a choice, make the choice and defend it rather than laying out the options. Lead with your bottom line in the first sentence — the ordering and the example you're committing to — then the reasoning, with no preamble and no restating of my question.
reasoning: |-
  Hmm, the user is a third-year student preparing to lead a discussion on information cascades and rational herding. They want a structured plan that builds understanding step by step, using a specific example, and addressing common misconceptions. They've proposed using the "two study spots" example and want feedback on whether to keep it.

  The user's key requests are: the order of components for the explanation, choice of example, mapping misconceptions, and a distinguishing question. They want each step to feel forced rather than asserted, starting with Bayesian updating. They also want to avoid elements like payoff externalities or expert first movers that might bias intuitions.

  The study spots example seems ideal. It has identical payoffs (quietness matters equally to all), sequential arrival, no communication, and no externalities (one person sitting doesn't affect others' experience). It avoids pitfalls like prices or visible experts. This keeps the focus purely on information transmission through actions.

  For the sequence: Begin with Person 1's decision based solely on private signal to establish Bayesian updating. Then Person 2 sees Person 1's action but knows Person 1 had a signal. Person 2 combines their own signal with the inference from Person 1's action. This shows how actions convey information. Person 3 faces ambiguity if Person 1 and Person 2 chose the same spot—their own signal might be outweighed by the prior two actions, leading to ignoring their private signal. That's the cascade definition point.

  The class should derive Person 3's inference themselves. Giving them a scenario where Person 1 and Person 2 both chose Spot A, and asking what Person 3 should do if they have a noisy signal for Spot B, will make them realize the aggregation of information makes the public belief so strong that a contrary private signal isn't enough. That active engagement cements the concept.

  Now, addressing misconceptions in order:
  1. "Herding is irrational" – Correct this immediately when defining rational herding vs. irrational copying. Emphasize that in cascades, copying is Bayesian rational.
  2. "Cascades lead to truth" – Point out after defining cascades that they can be wrong if early signals were misleading, using the study spots example where both first two might have gotten unlucky noisy signals.
  3. "All conformity is a cascade" – Clarify during Person 2's step; Person 2 might agree with Person 1 based on their own signal, not just copying. A cascade specifically requires overriding private signals.
  4. "Crowds or confident leaders needed" – Dispel this when showing cascade start with Person 3; it can happen with few people and no leader.
  5. "Strong private signal breaks cascade" – Save this for the climax. A strong private signal doesn't break it because it's private; only public information (like multiple defections) can shift the public belief enough. This ties back to the core asymmetry.

  The misconception about cascade breakage should be the climax because it reinforces the asymmetry between public and private information and highlights the fragility of cascades. It's the most counterintuitive point and leaves the discussion on a high note.

  For the distinguishing question: "Why might someone who observes a cascade forming and has a strong private signal against it still rationally join it, and what would actually break the cascade?" This tests understanding of the information asymmetry and the necessity of public actions versus private signals.

  What to leave out: Don't cover network structures or global games. Explicitly state that these are advanced topics beyond the model's assumptions. This keeps focus tight and avoids confusion.

  Bottom line: Use the study spots example with the sequence starting from Bayesian updating, derive Person 3's inference in class, and climax with why private signals don't break cascades.
answer: |-
  **Bottom Line:** Use the study spots example, sequence components as Bayesian updating → Person 1 → Person 2 inference → Person 3 derivation by students → cascade definition → climax on private vs. public information asymmetry, and leave out network structures/global games.  

  **Reasoning:**  
  The study spots example is optimal: identical payoffs (each wants quietness), sequential arrival (no simultaneous decisions), no communication, no payoff externalities (one’s choice doesn’t alter another’s utility), and no visible expertise (all equally informed). Avoid urn/restaurant examples—they subconsciously imply shared objectives or resource scarcity, muddying rationality.  

  ### Sequence of Components (40-min plan):  
  1. **Bayesian updating from private signal (5 mins)**  
     - *Example setup:* Two identical study spots (A/B), one is truly quiet. Each student gets a private signal (e.g., "hint A is quiet," 60% accurate).  
     - *Force the step:* Ask, "If you’re first, what do you do?" Derive: Person 1 follows their signal (Bayesian posterior = signal accuracy).  

  2. **Action vs. signal observability (5 mins)**  
     - *Key distinction:* Students see where others sit (actions), not their private signals.  
     - *Force it:* "Person 2 sees Person 1 at Spot A. What does this reveal? Not Person 1’s signal—just their action. Person 2 must infer."  

  3. **Person 2’s inference (10 mins)**  
     - *Walk through:* Person 2 combines their private signal with Person 1’s action.  
       - If signals agree: chooses same spot (rational, not copying).  
       - If conflict: signal accuracy >50% so they follow their own signal.  
     - *Preempt misconception:* Distinguish this rational agreement from "conformity = cascade" (misconception #3).  

  4. **Person 3’s inference—DERIVE IN CLASS (10 mins)**  
     - *Students derive:* Give scenario—Person 1 and 2 both at A. Person 3 gets "B is quiet" signal.  
     - *Force realization:* Calculate posterior: P(A quiet | two A choices) > 60% signal accuracy → Person 3 ignores own signal, chooses A.  
     - *Cascade definition:* This is the cascade—acting contrary to private signal due to overwhelming public info.  

  5. **Climax: Private signal can’t break cascade (5 mins)**  
     - *Misconception #5:* "Strong private signal breaks cascade" is false. Person 4 sees three at A—even with strong "B" signal, posterior favors A. Only public defiance (e.g., someone switches spots visibly) can break it.  
     - *Why climax:* This asymmetry (private vs. public information) is the core insight—herding is rational, fragile, and self-reinforcing.  

  ### Misconceptions Mapping:  
  - **"Herding is irrational" (#1):** Correct during Person 2’s step—show copying is Bayesian.  
  - **"Cascade = truth" (#2):** Kill after cascade definition—use example where early signals were wrong (e.g., noisy "A" signals when B is quiet).  
  - **"Any conformity is a cascade" (#3):** Preempt in Person 2’s step—agreement ≠ cascade.  
  - **"Needs crowd/leader" (#4):** Dispel at Person 3—cascades start with just three people, no leader.  
  - **Missed misconception:** "Cascades are stable"—emphasize fragility (public defiance breaks them).  

  ### Distinguishing Question (Final 3 mins):  
  **"Why might everyone in a cascade privately doubt the group choice, yet no one breaks it?"**  
  - *Tests understanding:* Correct answer requires grasping that private signals lack the power to shift public belief—only observable actions can.  

  ### What to Leave Out:  
  Explicitly state: "We’re skipping network structures, prices, and global games—this model assumes identical payoffs and no coordination. Advanced extensions exist."  

  **Defense:** This sequence forces self-discovery (e.g., Person 3 derivation makes cascade definition inevitable), the study spot example isolates rationality without distractions, and climaxing on the public/private asymmetry resolves the deepest confusion. No preamble—jump into Bayesian updating.
