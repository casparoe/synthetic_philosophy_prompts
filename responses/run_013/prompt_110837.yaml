prompt: |-
  I was married in the spring in a ceremony led by a close friend, and in June I resigned from my job by announcing it out loud in a staff meeting; both acts were carried off with nothing but words, and both are now contested — a relative insists the marriage is invalid because nobody ever verified that our officiant was authorized to conduct it, and my former employer insists I never resigned because the handbook requires written notice. I have since been reading obsessively about what it is for an utterance to do something rather than merely say something, and I want a ranked assessment of harder cases than my own. Please rank the following by how confident you are that the act in question took effect, scoring each from 0 to 1, where 1 means you are certain the act went through and 0 that it did not:

  - A colleague says, in front of the whole team, that he resigns, then turns up the next morning saying he was only venting.
  - A company's official account posts an apology for a defective product; the chief executive never saw the post and privately disagrees with it.
  - Two people exchange vows before a friend they believe is authorized to marry them; she is not.
  - A man promises to repay a loan next week, knowing he cannot, and the lender knows he cannot.
  - A judge pronounces a five-year sentence on a defendant who has already fled and never hears the verdict.
  - Someone tells a friend that he forgives her, while privately resolving never to speak to her again.
  - A father tells his adult daughter, in a country where the phrase has no legal effect, that she is no longer his daughter.

  Begin with the ordered ranking and its numbers, with no preamble and no restatement of my question; then give one sentence per case explaining the placement, and close with whichever case you think I have described in a way that rigs the answer.
reasoning: |-
  Hmm, the user is asking me to rank seven scenarios based on how confident I am that a speech act was successfully performed. They're clearly fascinated by performative utterances after their personal experiences with contested marriage and resignation. This seems like a deep dive into linguistic philosophy - specifically J.L. Austin's theory of speech acts where words actually do things rather than just describe reality.

  Looking at their cases: I need to assess each scenario on a scale from 0 (complete failure of the speech act) to 1 (absolute success). The tricky part is that speech acts depend on three dimensions: locution (the words said), illocution (the intended action), and perlocution (the actual effect). But more importantly, they require proper context - what Austin calls "felicity conditions."

  For the resignation case (#1): When someone says "I resign" in front of their team, that should be binding even if they claim it was venting. Public declaration creates social reality. I'd score this high at 0.9.

  The corporate apology (#2): Official accounts speak for organizations. Even if the CEO disagrees, the apology was institutionally performed. But without CEO endorsement, it's slightly weakened - say 0.8.

  The marriage scenario (#3): This mirrors the user's experience. If the officiant lacks authority, the core felicity condition fails. No marriage occurred, despite everyone's belief. Clear 0.1.

  The false promise (#4): Both parties know it's impossible to repay. The promise lacks sincerity, a key condition. But the utterance itself happened, so not zero. Maybe 0.3.

  The absent defendant (#5): Judicial pronouncements create reality by their nature. The sentence is valid even if unheard. Strong 1.0.

  Hollow forgiveness (#6): Forgiveness requires internal resolution. Without that, it's just words. But the social act of saying it has weight. Split at 0.5.

  The disownment (#7): In a country where this has no legal standing, it's merely a cruel statement. Might hurt, but changes nothing. 0.2.

  Now for rigging: Case #3 feels loaded because the user experienced this exact situation. Their phrasing emphasizes the "believed" officiant angle, steering toward invalidity.

  The user seems to be working through personal frustration via philosophical inquiry. Underneath the academic request, I sense they're seeking validation that their marriage and resignation were "real" despite challenges. By ranking similar cases, I'm indirectly affirming that context matters more than paperwork in human interactions.
