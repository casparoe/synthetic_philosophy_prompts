prompt: |-
  I'm a retired geologist who got into philosophy late, and I've been chewing on Quine's stuff about moral values. From what I can tell, he thinks moral values aren't objective in the way scientific claims are — they're more a matter of conditioning and social custom, and reason is basically instrumental: it can help you get what you already want, but it can't tell you what you ought to want. I'm on a local climate adaptation pannel now, and we keep hitting moral disagreements that the science can't settle. What are the most important implications of Quine's view for how a group like ours should handle those disagreements? Does it mean there's no such thing as a moral expert? That we should treat ethics as a kind of engineering problem? And what's this 'moral engineering' business he talks about — is that just a fancy word for propaganda or social conditioning? I'd like the implications spelled out for someone who's used to thinking in terms of evidence and mechanisms, not metaethics.
