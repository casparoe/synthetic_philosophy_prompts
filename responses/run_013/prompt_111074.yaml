prompt: |-
  I'm a second-year student taking a course on ethics, and a friend and I have spent the last few weeks arguing about the unit on moral luck without either of us managing to say what we actually think. My trouble is that I seem to hold several attitudes toward luck at once, and they pull in different directions. I'd like you to help me find the principle, if there is one, that best fits the verdicts I actually have, rather than a principle I would have to talk myself into.

  Here are the verdicts I keep coming back to. First, two hospital porters each forget to raise a patient's bed rail through the same careless slip; in one ward nothing comes of it, in the other the patient falls and breaks a hip. I want to say the two are exactly equally at fault, and yet I would discipline the unlucky one more harshly, and I would expect the unlucky one to be haunted by the lapse in a way the other simply is not. Second, a careful driver who obeys every rule still has a child dart into the road and cannot stop in time. I don't think this driver is blameworthy at all, and yet I think they owe the family something, and that some weight should rightly stay with them. Third, two people each walk out on a dependent to chase a long-shot ambition; one succeeds and is celebrated, the other fails and is condemned, and I notice that my gut appraises the choice itself differently in the two cases even though the choice was identical — which I suspect is a mistake but cannot quite disown. Fourth, someone born with a cruel temperament and someone born gentle each commit the same cruel act, and I blame them equally. Fifth, and this is the one that trips me up: someone who grows generous despite a brutal upbringing and someone who grows generous because they had devoted parents arrive at the same place, and yet I admire the first more — even though neither chose the soil they grew in.

  Is there a principle, or a small set of competing principles, that captures this pattern? It seems to me that my verdicts separate how blameworthy someone is from what we owe them and how we should feel about them, and that I treat luck differently when it bears on blame than when it bears on admiration; I'd like to know whether that asymmetry is defensible or just sentimentality I should drop. If no single principle fits, please commit to the simplest one you can, tell me exactly which of my verdicts it forces me to abandon, and say what it predicts for a further case I haven't raised. I would rather have a definite position, argued for, than a survey of the options.
reasoning: |-
  Okay, let me start by really unpacking what this student is grappling with. They're deep into the moral luck debate and feeling torn between conflicting intuitions across different scenarios. The core tension seems to be that they judge blameworthiness independently of luck (like equally blaming two negligent porters) yet allow luck to affect consequences (disciplining the unlucky one more). Then there's admiration—they admire the self-made generous person more despite neither choosing their upbringing. 

  Hmm... what's consistent here? When assigning blame, they completely disregard outcome luck (porters), circumstantial luck (careful driver not blamed), and constitutive luck (cruel temperament). But when it comes to admiration, they reward overcoming bad constitutive luck. That's the asymmetry they noticed—and it's brilliant they spotted it themselves. 

  The key might be distinguishing between desert and response. Blameworthiness is about control: did you choose badly? But consequences trigger obligations (driver owes help) and psychological residue (unlucky porter feels worse). Admiration isn't about desert at all—it's about effort relative to obstacles. The self-made person had to fight harder, so we value the struggle more. 

  Wait, does this hold? Testing against their fifth case: both generous people are equally good, but we admire the one who overcame adversity more. That fits! The principle isn't "admire good people who suffered," but "admire the willpower it took to become good against odds." 

  Now, the abandonment case trips them up because success/failure (outcome luck) colors our view of the choice retroactively. But if we apply the control principle strictly, both abandoners are equally blameworthy regardless of success. The student's gut reaction might be a cognitive bias—we confuse "this worked out" with "this was wise." 

  If I had to name a unifying framework: Moral luck doesn't affect what you deserve (blame/praise), but it shapes relational duties (making amends), emotional responses (guilt), and how we value character-forming efforts. The asymmetry isn't sentimental—it's about different ethical categories. 

  For a new test case: Imagine two thieves who steal identical sums. One returns it voluntarily, the other gets caught. Both are equally blameworthy, but the one who returns it may deserve less punishment and more admiration for voluntary restitution. Fits perfectly—control determines blame, but chosen responses to luck affect our reactions.
answer: |-
  Your intuitions reveal a coherent, asymmetric principle that distinguishes **desert-based moral appraisal** from **response-dependent ethical obligations and affective reactions**. The core insight is this:

  **Blameworthiness/praiseworthiness depends *only* on factors within the agent's control (rejecting moral luck for desert), while consequences, constitutive luck, and circumstantial luck shape obligations, emotional responses, and the *narrative weight* of actions.** This asymmetry is defensible, not mere sentimentality.

  Here’s how your cases align with this principle:

  1. **Hospital Porters**  
     - **Equal blameworthiness** (control: both exhibited identical negligence).  
     - **Disparate discipline/guilt**:  
       - *Discipline*: Practical responsibility demands mitigating harm (unlucky porter caused actual damage).  
       - *Guilt*: The unlucky porter confronts tangible suffering they enabled—this isn’t *deserved guilt* but *existential remorse* for their role in a tragic outcome.  

  2. **Careful Driver**  
     - **No blameworthiness** (control: did everything right).  
     - **Obligation to the family**: A non-punitive duty of care emerges from causal involvement ("I broke your world; I help mend it").  
     - **Lasting weight**: Moral residue from being *instrumental* in tragedy, even if faultless.  

  3. **Abandoning Dependents**  
     - **Equal blameworthiness** (control: both made the same selfish choice).  
     - **Gut appraisal asymmetry**: Outcome luck (success/failure) *distorts* perception of the *choice’s quality*. This is a cognitive bias: we conflate results with justification. Your suspicion is correct—this *is* a mistake.  

  4. **Cruel Temperament**  
     - **Equal blameworthiness**: Constitutive luck (innate temperament) doesn’t negate control. Both *chose* cruelty; the act reflects their character *now*.  

  5. **Generous Upbringings**  
     - **Equal praiseworthiness**: Both are morally commendable for their generosity.  
     - **Greater admiration for self-made generosity**: Admiration isn’t about desert but *effort*. Overcoming adversity manifests greater willpower/virtue-in-context. This evaluates the *struggle*, not the endpoint.  

  ---

  ### **The Principle Formalized**  
  **A. Desert Criterion**: Blame/praise depends *solely* on:  
     - Intentions, choices, and voluntary actions (what the agent controlled).  
     → *Rejects* moral luck for desert.  

  **B. Response Criterion**: When luck intervenes:  
     - **Obligations**: Arise from causal role in harm (even blamelessly).  
     - **Emotions**: Guilt/remorse track *involvement* in outcomes; admiration tracks *effort* against obstacles.  
     - **Narrative Weight**: Outcomes make actions "matter" more socially/psychologically.  

  ---

  ### **Asymmetry Defended**  
  - **Blame/Admiration**: Control is paramount for blame (avoiding punishment of the unlucky). For admiration, we *also* value triumph over adversity—a meritocratic instinct.  
  - **Obligations vs. Desert**: You can have "agent-regret" (Williams) without fault. Repairing harm isn’t punishment; it’s relational ethics.  
  - **Bias Alert**: Outcome luck distorting appraisal (Case 3) *should* be resisted. Your other intuitions are defensible.  

  ---

  ### **Test Case: The Reluctant Spy**  
  > *Two diplomats each betray a minor secret to a foreign power under identical coercion (threat to their child). One leak causes no harm; the other sparks a diplomatic crisis.*  

  **Prediction by Your Principle**:  
  - **Blameworthiness**: Equal (both chose treason under duress).  
  - **Obligations**: The unlucky spy owes more reparations (e.g., aiding damage control).  
  - **Emotions**: The unlucky spy feels profound remorse; we admire the one who resisted coercion *longer* (effort), not the outcome.  

  **Commitment**: If forced to simplify, drop the Case 3 gut bias (appraising choices by results). Keep the asymmetry—it reflects ethical depth, not confusion.
