  Okay, the user is in a reading group about animal minds and they're stuck in debates over whether animals like fish feel pain. They want a clear set of desiderata for any theory of consciousness distribution across animals. They mentioned specific issues: nociceptors vs. no neocortex, unreporting creatures, different machinery with similar behaviour, whether consciousness is a matter of degree, and practical usability for welfare decisions. Their friend also adds two constraints: one about swapping biology for functionally identical systems, and another about look-up tables vs. recurrent circuits.

  First, I need to outline all the desiderata they listed and add the friend's points. Each should have a motivation, and note if it's a genuine requirement or a possible prejudice. Then, identify which ones conflict. For example, a necessary and sufficient test might clash with not building the answer into the test. Also, the substrate-swapping constraint could conflict with empirical evidence if biology is tied to consciousness.

  The user wants to know which single requirement disqualifies most theories. The unreporting creatures criterion might be key because many theories rely on reportability, which isn't possible for animals. Also, practical usability is crucial for welfare but might conflict with theoretical purity.

  I should check for other conflicts. The degree vs. binary distinction might clash with the look-up table argument. If consciousness is graded, the friend's point could force it into all-or-nothing, which isn't ideal. Also, evolutionary continuity might conflict with the substrate swap if homologous structures are necessary.

  Then, assessing which desiderata are non-negotiable. Usability and unreporting creatures seem essential. Substrate independence might be more contentious. The look-up table argument is tricky—it might be a logical point but not practical.

  The user's deeper needs: they want to break the cycle in their group by focusing on criteria, not theories. They need a framework to evaluate theories, not just more papers. Also, they want clarity on conflicts to understand why debates are stuck. Practical implications for welfare are crucial, so desiderata must lead to actionable decisions.

  I should structure the response with desiderata grouped by phenomena, cases, constraints, principles, and usability. Then outline conflicts, key disqualifiers, and which requirements might be dropped. Honesty about shakiness: some desiderata are stronger than others, and empirical advances might change priorities. Highlighting which conflicts are resolvable and which might require trade-offs.
answer: |-
  Here is a specification of desiderata for a theory of consciousness distribution across animals, structured as requested. I've included motivations, flagged potential prejudices, identified conflicts, and assessed shakiness – all using British spelling.

  **I. Core Desiderata: Phenomena & Cases the Theory Must Account For**

  1.  **The Unreporting Subject Constraint:**
      *   **Motivation:** Must assign a verdict (conscious/not, degree) to entities that cannot verbally report subjective states (e.g., bees, crabs, human infants, patients in vegetative states, many invertebrates). Behavioural and physiological markers are the only available evidence.
      *   **Requirement/Potential Prejudice:** **Genuine Requirement.** Theories defining consciousness *solely* by reportability are circular and exclude the very subjects of inquiry. This is arguably the most critical constraint.
      *   **Case:** Bee navigation, crab avoidance learning, infant pain responses.

  2.  **The Convergence/Divergence Constraint:**
      *   **Motivation:** Must explain how strikingly similar complex behaviours (e.g., problem-solving, tool use, pain avoidance, social learning) can arise from radically different neural architectures (e.g., mammalian cortex, avian pallium, cephalopod vertical lobe). Conversely, must explain why similar structures sometimes don't yield similar behaviours (or vice versa).
      *   **Requirement/Potential Prejudice:** **Genuine Requirement.** Highlights that function, not just homology, matters. Failure here risks anthropocentrism (privileging mammalian solutions).
      *   **Case:** Tool use in crows, octopuses, primates; sophisticated learning in bees vs. simple ganglia; pain responses in fish (telencephalon) vs. mammals (neocortex).

  3.  **The Gradation vs. Boundary Constraint:**
      *   **Motivation:** Must explicitly state whether consciousness is an all-or-nothing property or admits of degrees (e.g., richness, intensity, levels). If a boundary exists, the theory must specify where it plausibly falls (e.g., based on anatomy, complexity, behaviour) and justify *why* that boundary is significant.
      *   **Requirement/Potential Prejudice:** **Core Requirement.** Impacts welfare profoundly. Potential prejudice: Insisting on a sharp boundary near humans vs. insisting everything has *some* consciousness. Both extremes face empirical and conceptual challenges.
      *   **Case:** Comparing a jellyfish, a worm, a fish, a lizard, a bird, a dog.

  4.  **The Evolutionary Continuity Constraint:**
      *   **Motivation:** Must be compatible with evolutionary biology. Cannot make consciousness depend solely on features unique to the mammalian/vertebrate lineage that appear as evolutionary "accidents" with no functional equivalent elsewhere. Must account for its potential emergence or loss in different lineages.
      *   **Requirement/Potential Prejudice:** **Genuine Requirement.** Contradicting evolutionary principles is a major flaw. Potential prejudice: Mistaking *homology* (shared ancestry) for *necessity* (only our specific structure works).
      *   **Case:** The absence of a laminated neocortex in birds/cephalopods; presence of complex cognition in distantly related lineages.

  **II. Constraint Desiderata: Principles the Theory Must Respect**

  5.  **The Substrate Independence Constraint (Your Friend's First):**
      *   **Motivation:** If the theory deems Entity A conscious, and Entity B is built from entirely different biological/physical components but is functionally equivalent (same inputs → same outputs, same behavioural capacities), then Entity B must also be deemed conscious. Consciousness depends on functional/computational properties, not substrate.
      *   **Requirement/Potential Prejudice:** **Highly Contentious Principle.** Motivated by computational theory of mind and philosophy (e.g., functionalism). Challenge: Is *perfect* functional equivalence possible for consciousness? Does biology *necessarily* contribute something irreducible? Rejecting this risks vitalism or mysterianism. Accepting it may force counter-intuitive conclusions about AI/simulations.
      *   **Case:** Swapping a fish's nociceptive system for a synthetic but functionally identical system – should the verdict change?

  6.  **The Look-Up Table Challenge (Your Friend's Second):**
      *   **Motivation:** Any finite recurrent neural process (often proposed as necessary for consciousness) can, in principle, be simulated by a giant pre-computed look-up table mapping inputs directly to outputs. If the recurrent process is conscious, is the table? If not, then behaviour alone cannot distinguish a conscious system from an unconscious zombie simulation, undermining behavioural tests.
      *   **Requirement/Potential Prejudice:** **Logical Challenge, Not a Direct Requirement.** Highlights the "hard problem" and the limitations of purely behavioural criteria. It doesn't demand theories *must* make the table conscious, but forces them to explain *why* the recurrent process is special beyond input-output correlations. It challenges theories relying *only* on behaviour or specific circuit diagrams without a deeper principle. Potential prejudice: Assuming computational equivalence implies phenomenal equivalence.
      *   **Case:** A hypothetical bee whose entire "learning" and "avoidance" is implemented via a vast pre-programmed lookup table vs. a bee with genuine recurrent processing.

  **III. Practical Desiderata: The Theory Must Be Actionable**

  7.  **The Usability Constraint:**
      *   **Motivation:** Must provide grounds for making practical decisions about welfare, farming, and research. It cannot consistently yield "unknowable" or radically counter-intuitive verdicts in common, ethically relevant cases. Needs operationalisable criteria (behavioural, physiological, anatomical).
      *   **Requirement/Potential Prejudice:** **Genuine Requirement** (for the stated purpose). Potential prejudice: Demanding *absolute certainty* before acting, or conversely, using practicality to override difficult theoretical conclusions.
      *   **Case:** Developing regulations for fish slaughter, cephalopod research ethics, insecticide testing.

  **IV. Foundational Constraints: Avoiding Contradiction**

  8.  **The Neuroscientific Plausibility Constraint:**
      *   **Motivation:** Cannot contradict well-established facts of neurobiology and neuroanatomy (e.g., the function of nociceptors and opioid receptors, the role of integrative brain regions, the necessity of neural activity).
      *   **Requirement/Potential Prejudice:** **Genuine Requirement.** Theories must be biologically grounded. Potential prejudice: Using *absence of evidence* (e.g., "no cortex, *therefore* no consciousness") as *evidence of absence*.
      *   **Case:** Theories must account for the role of known pain pathways without requiring *exact* mammalian homologues.

  **Conflicts Between Desiderata: The Tensions**

  1.  **Unreporting Subject + Usability vs. Look-Up Table Challenge:**
      *   **Conflict:** We *need* behavioural criteria (Usability) for unreporting subjects (Constraint 1). However, the Look-Up Table (Constraint 6) shows that any finite behaviour can be produced without consciousness, undermining the sufficiency of behaviour. Relying *only* on behaviour risks false positives (zombies). Ignoring behaviour makes Usability impossible.
      *   **Nature:** **Deep Conflict.** Resolving this requires either: a) A principled reason why specific behaviours (or their neural correlates) are *necessarily* conscious (hard), b) Accepting that behaviour provides evidence but not proof, requiring risk assessment for Usability, or c) Rejecting the possibility of zombies (controversial).

  2.  **Substrate Independence vs. Neuroscientific Plausibility / Evolutionary Continuity:**
      *   **Conflict:** Substrate Independence (Constraint 5) demands consciousness depends only on function. However, Neuroscientific Plausibility (Constraint 8) and Evolutionary Continuity (Constraint 4) are heavily grounded in *actual biological mechanisms*. If consciousness *can* arise in radically different substrates, why does it correlate so strongly with specific biological complexity in our world? Does biology provide unique, non-substitutable properties? Theories emphasising specific biological structures (e.g., certain neurotransmitters, microcircuitry) conflict directly with Substrate Independence.
      *   **Nature:** **Conceptual/Empirical Tension.** Resolving it requires arguing either: a) Current biology *is* uniquely suited (risks anthropocentrism), b) Functional equivalence *is* achievable synthetically (untested), or c) Consciousness has multiple realisations, but biology is the only known one (making Substrate Independence practically irrelevant).

  3.  **Gradation vs. Boundary + Usability:**
      *   **Conflict:** Gradation (Constraint 3) is likely biologically plausible. However, sharp boundaries are vastly easier for Usability (Constraint 7) (e.g., "all vertebrates," "only mammals/birds/cephalopods"). Drawing a line within a gradation is ethically and conceptually fraught.
      *   **Nature:** **Practical Conflict.** Resolving it requires either: a) Biting the bullet on gradation and developing tiered welfare standards (complex), or b) Justifying a defensible (if fuzzy) boundary based on a threshold of capacity.

  **The Single Most Disqualifying Requirement:**

  *   **The Unreporting Subject Constraint (1).** This is the bottleneck. Popular theories fail here in different ways:
      *   **Higher-Order Thought (HOT) Theories:** Often require cognitive capacities (self-reflection) likely absent in many animals, potentially denying consciousness to creatures that clearly warrant ethical concern based on behaviour (e.g., fish, infants).
      *   **Global Workspace Theories (GWT):** Focus on centralised information integration. While applicable to unreporting subjects via neural markers, they struggle with Convergence/Divergence (2) – how do radically different architectures (cephalopod vs. mammal) implement a "global workspace"? They also face the Look-Up Table Challenge (6).
      *   **Simple Neurobiological Correlates (e.g., "neocortex required"):** Directly violate Evolutionary Continuity (4) and the Unreporting Subject Constraint (1) by denying consciousness to birds/cephalopods/fish despite compelling behavioural evidence.
      *   **Panpsychist/Radical Emergence Theories:** Can handle Unreporting Subjects (1) and Substrate Independence (5), but struggle massively with Neuroscientific Plausibility (8), Usability (7) (how to measure?), and explaining Gradation/Boundary (3).

  **Shakiness & Which Requirements I'd Drop First:**

  *   **Overall Shakiness:** The field is fundamentally unstable. We lack a theory of consciousness *even for humans* that commands consensus and solves the hard problem. Applying it to animals multiplies the uncertainty. The desiderata highlight the tensions rather than resolve them.
  *   **First Requirement I'd Drop Under Pressure:**
      *   **Substrate Independence (5).** While conceptually interesting and potentially important long-term (for AI ethics), its practical relevance to *current* animal welfare debates is minimal. Our concern is with *biological* entities where substrate *is* relevant evidence. Insisting on it creates intractable problems (Look-Up Table) and distracts from empirically grounded biology. (**What would change my mind?** Strong evidence of artificial sentience or a compelling, empirically testable functionalist theory of consciousness.)
  *   **Second Potential Drop:**
      *   **Strict interpretation of the Look-Up Table Challenge (6)** as a veto. It's a powerful *logical* point demonstrating the insufficiency of behaviour/input-output alone, but it's practically irrelevant. We *must* use behaviour and neurobiology as evidence for unreporting subjects, acknowledging it's fallible evidence, not proof. We operate under the reasonable assumption that complex, adaptive behaviour in biologically plausible systems *is* indicative. (**What would change my mind?** Concrete demonstration of a complex, adaptive biological zombie with no consciousness.)
  *   **Non-Negotiables (For Now):** Unreporting Subject (1), Convergence/Divergence (2), Evolutionary Continuity (4), Neuroscientific Plausibility (8), and Usability (7) are essential for a theory aimed at practical application in biology and welfare. Gradation vs. Boundary (3) must be explicitly addressed, even if the answer is messy.

  **Conclusion for Your Group:**

  The circular debates stem from inherent tensions between our need for practical, biologically grounded criteria for unreporting subjects and the profound philosophical difficulties in defining and detecting subjective experience. No current theory satisfies all these desiderata comfortably. The most productive path forward might be:

  1.  **Acknowledge the Conflicts:** Explicitly recognising tensions like Behaviour vs. Zombie Argument or Biology vs. Functionalism clarifies *why* disagreements persist; they're not just stubbornness.
  2.  **Focus on Convergent Evidence:** Prioritise theories that integrate *multiple lines of evidence* (behaviour, neuroanatomy, neurophysiology, pharmacology, evolutionary history) for unreporting subjects, rather than relying on single criteria (like just nociceptors or just cortex).
  3.  **Embrace Graded Frameworks for Welfare:** Given the likelihood of gradation and the demands of Usability, develop welfare assessments based on *capacities* (e.g., nociception, learning, behavioural flexibility, evidence of negative affect) rather than a binary "conscious/not" verdict. This sidesteps the hardest metaphysical questions while addressing practical concerns.
  4.  **Treat Substrate Independence & Look-Up Table as Philosophical Probes:** Use them to test the internal coherence of theories and expose assumptions, but don't let them paralyse empirical investigation or practical action concerning actual animals.

  This specification doesn't give easy answers, but it provides a structured map of the conceptual minefield, explaining *why* your group goes in circles and what any proposed theory must grapple with. Good luck!
