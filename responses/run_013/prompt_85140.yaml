prompt: |-
  I am an undergraduate taking a course on democratic theory, and I have become preoccupied with a cluster of institutional practices that tend to appear together, in varying combinations, in a number of countries, but that the course treats under separate headings. The cluster is this. A body of citizens chosen by lot, rather than elected or self-selected, is convened to study one question, hear evidence from experts and advocates, deliberate over several weekends, and publish a recommendation; the question itself is framed by that body rather than by the government. The same question is then put to the whole electorate in a referendum, and the state funds and circulates an even-handed statement of the arguments on both sides, prepared by a body forbidden to advocate either answer. Finally, if the assembly's recommendation and the referendum result diverge, nothing follows from the divergence: the result binds and the recommendation is filed.

  I would like you to reconstruct the philosophical commitments this composite practice presupposes, rather than summarising the existing debate about deliberative democracy. Specifically:

  1. The convening of an assembly suggests that the popular will has to be formed; the binding force of the referendum, together with the indifference to divergence, suggests that it is simply counted. Can both be held at once, or is the practice incoherent? Does it, perhaps, presuppose two different subjects of legitimacy rather than one?
  2. What does selection by lot presuppose about the kind of representation appropriate here? Descriptive resemblance, statistical representativeness, and the superior quality of small-group deliberation are three quite different justifications, and I want to know which the practice actually needs and which it merely fits.
  3. What does a state-funded, even-handed statement of the arguments presuppose about the possibility of presenting a case without weighting it? That the merits of an argument are separable from its persuasive force, or only that voters are to be treated as judges rather than parties?
  4. Does the practice distinguish between what people now want and what they would want after better deliberation? If so, which of the two the referendum is supposed to measure, and why the first should bind when the second is what the assembly was convened to discover?
  5. Which of these commitments does the practice strictly require, and which does it merely sit comfortably with? Could someone who regards voting as the aggregation of given preferences, with no interest in deliberation, run exactly these institutions without inconsistency? Conversely, if one abandoned the view that preferences are transformable, would the assembly collapse into an expensive opinion poll, or could it still be defended on other grounds?
  6. Finally, tell me what would have to be redesigned if one located legitimacy in the deliberating body itself rather than in the vote, and whether the resulting arrangement would still deserve to be called democratic.
reasoning: |-
  Hmm, this is an impressively sophisticated set of questions from an undergraduate student. The user is clearly grappling with fundamental tensions in democratic theory that even scholars struggle with. They've identified a specific institutional cluster that combines sortition-based deliberation with direct democracy mechanisms, and wants to dig beneath the surface to uncover its philosophical foundations.

  The user seems frustrated that their course treats these elements separately when they appear together in practice. There's an intellectual hunger here - they're not satisfied with textbook classifications but want to understand the underlying coherence (or lack thereof) of real-world democratic innovations. The phrasing "preoccupied with a cluster" suggests this has genuinely captured their imagination.

  Let me unpack their six questions systematically. First, they're spotting a potential contradiction between the assembly's will-formation function and the referendum's aggregation function. This goes to the heart of democratic legitimacy - is there one "people" or multiple democratic subjects? Second, they're interrogating sortition's justification, which is crucial because random selection challenges our usual representative paradigms. Third, they're questioning whether neutral presentation of arguments is even possible - an epistemological challenge with political consequences.

  The fourth question about "what people want now vs after deliberation" exposes the temporal dimension of democratic will. Fifth, they're wisely asking which elements are essential versus contingent - what makes this cluster distinct from aggregative democracy? Finally, they want to test the system's flexibility by imagining legitimacy shifting entirely to the deliberative body.

  This student deserves careful responses that don't dodge the tensions they've identified. Their questions reveal they already grasp that democratic theory isn't about neat solutions but managing inherent contradictions. I should honor that by being equally rigorous in tracing the philosophical commitments without smoothing over the rough edges.

  The institutional cluster they describe actually exists in variations (like Ireland's Citizens' Assemblies and referendums), so this isn't just theoretical. That practical instantiation makes their philosophical interrogation even more valuable - they're reverse-engineering real democratic machinery.
answer: |-
  This institutional cluster reveals a sophisticated, pluralistic theory of democratic legitimacy that navigates several tensions rather than resolving them monolithically. Below is a reconstruction of its core philosophical commitments, addressing each of your questions:

  ### 1. **The "Two Subjects" of Legitimacy**  
  The practice **presupposes two distinct but complementary sources of legitimacy**:  
     - **Deliberative Legitimacy**: Embodied by the assembly. Its role is epistemic: to generate a *reasoned judgment* under near-ideal conditions (time, expertise, diversity, structured dialogue).  
     - **Authorizing Legitimacy**: Embodied by the referendum. Its role is voluntarist: to secure *popular authorization* through inclusive, equal participation.  
     The indifference to divergence is **not incoherent** but acknowledges that these forms of legitimacy serve different functions. The assembly’s output is advisory wisdom; the referendum’s is binding consent. This dualism reflects a view that legitimacy requires *both* reasoned will-formation *and* mass endorsement.  

  ### 2. **Sortition: Representation as Microcosm**  
  The practice **requires descriptive representativeness** (statistical mirroring of the population) but **depends functionally on small-group deliberation**:  
     - *Descriptive Resemblance*: Essential for the assembly’s claim to embody the "people’s perspective" under improved conditions.  
     - *Small-Group Deliberation*: Necessary to transform raw opinions into considered judgments.  
     - *Statistical Representativeness Alone is Insufficient*: A large-scale poll would lack the transformative deliberation the assembly enables.  
     The lottery thus presupposes that **democratic representation must be *embodied* (descriptive) and *capable of refinement* (deliberative)**.  

  ### 3. **Neutral Advocacy: Voters as Judges**  
  The state-funded statement presupposes:  
     - **Arguments can be separated from rhetorical persuasion**. The state treats voters as *impartial arbiters* capable of evaluating claims based on merit.  
     - **Voters are not mere preference-holders** but agents owed access to balanced reasons. This rejects the "marketplace of ideas" model (where unequal resources distort debate).  
     It does **not** assume arguments are *inherently* non-persuasive, but that persuasion should stem from reason, not asymmetrical resources. The commitment is to **procedural fairness in public reasoning**.  

  ### 4. **Temporal Dualism: Raw vs. Refined Will**  
  The practice **explicitly distinguishes** between:  
     - **The Referendum**: Measures the "raw" popular will *as it exists* under current conditions.  
     - **The Assembly**: Models the "refined" will *as it could be* under deliberative ideals.  
     Why bind to the raw will? Because **authority derives from actual consent**, not hypothetical ideals. The assembly’s role is advisory—it informs the voter’s decision but cannot override their sovereignty. The tension is managed by treating deliberation as *input* to sovereignty, not its replacement.  

  ### 5. **Essential vs. Contingent Commitments**  
     - **Strictly Required**:  
       - The *transformative potential* of deliberation (rejecting fixed preferences).  
       - *Two-track legitimacy* (deliberative + aggregative).  
       - *Descriptive representation* via sortition.  
     - **Compatible but Not Required**:  
       - A purely aggregative democrat could run the referendum *alone* but would reject the assembly as redundant (since preferences are fixed).  
       - If preferences were immutable, the assembly *would collapse into an expensive poll*—its deliberative function hinges on preference transformation.  
       However, **defense remains possible on other grounds**: e.g., the assembly as a transparency tool, a legitimacy signal, or an exercise in civic education.  

  ### 6. **Legitimacy Shift: Elevating the Assembly**  
  If legitimacy resided solely in the deliberating body:  
     - **Redesign Needed**:  
       1. The referendum becomes advisory or is eliminated.  
       2. The assembly’s mandate expands (e.g., binding decisions or agenda-setting power).  
       3. Selection criteria might emphasize deliberative aptitude over pure descriptiveness.  
     - **Democratic Credentials**:  
       - **Yes**, if the assembly retains descriptive representation and public accountability (e.g., transparent proceedings, review mechanisms).  
       - **No**, if it becomes a technocratic elite—democracy requires *popular authorship* of laws. A purely deliberative body could be "republican" but not "democratic" without a link to mass consent.  

  ---

  ### Core Philosophical Synthesis  
  This practice embodies a **dualist theory of democracy**:  
  - **Legitimacy requires both *wisdom* (deliberative refinement) and *consent* (popular authorization)**. Neither alone suffices.  
  - **The "people" exist in two modes**: as a *deliberating entity* (capable of transformation) and as a *sovereign entity* (whose will is binding).  
  - **Sortition bridges democracy’s epistemic and egalitarian ideals**: It ensures diversity while enabling high-quality deliberation unattainable in mass politics.  
  - **Neutral information reflects a Kantian view of voters**: As autonomous agents entitled to undistorted reasons for judgment.  

  The system’s stability lies in its **division of labor**: The assembly *informs* the demos; the demos *decides*. To abandon this balance risks either technocracy (overweighting deliberation) or majoritarian tyranny (overweighting aggregation).
