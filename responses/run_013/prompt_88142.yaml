prompt: |-
  I am finishing a seminar on the philosophy of the social sciences, and I have been trying to decide where I stand on the dispute between methodological individualists and their critics. Rather than argue the general thesis, I have been keeping a list of explanatory claims and marking, by intuition, which ones I regard as genuine explanations and which as redescriptions. I would like you to identify the principle behind my marks, if there is one.

  The list:

  (a) The bank failed because the run on it was self-fulfilling: each depositor's withdrawal was rational given the belief that others would withdraw. Genuine. No one intended the outcome and no collective agent acted, but I take the explanation to be complete once the depositors' reasoning and the way their choices interlocked are given.

  (b) The firm kept paying bribes because its competitors did and it expected to lose contracts otherwise. Genuine, even though the grammatical subject is a firm rather than a person.

  (c) Inflation accelerated because expectations of inflation became unanchored. Genuine, and I do not think I need to know anything about any particular price-setter's psychology in order to accept it.

  (d) The lake's perch have grown smaller over four decades because the largest fish are the ones the nets take. Genuine. This explains a change in the distribution of a trait across a population and says nothing about why any individual fish survived; the survivors were lucky.

  (e) The institution of caste persisted because it served the interests of the dominant group. Not an explanation. It tells me who benefited, not why the arrangement continued; the benefit could be entirely incidental to its persistence.

  (f) The dueling code declined because the state came to monopolize the use of force, which changed what an unanswered insult cost a man. Genuine.

  (g) The commons were kept in good repair because the rules were long-standing and each user expected the others to keep to them. Genuine, I think, though it makes me uneasy; it feels like (e) with more steps.

  (h) Capitalism required the crisis in order to restore profitability. Not an explanation, and I would say the same of any claim that an arrangement exists because it is functional for something.

  (i) The senator voted for the bill because the donors who funded his campaign wanted it. Genuine.

  My difficulty is this. (d) and (h) appear to have the same form, a trait or arrangement explained by its consequences, and I accept one while rejecting the other. (g) and (e) also look alike, and I am less confident there than I would like to be. The principle I keep reaching for is that a genuine explanation must cite a mechanism that produces the outcome, but I suspect this is either circular or trivially satisfied, since I cannot say what counts as a mechanism without already deciding the cases. I would like a principle that gets all nine verdicts. If the honest answer is that none does, tell me which verdicts have to be abandoned and what the simplest principle is that preserves the remainder. Please also say what that principle implies for two claims I have not decided on: that the custom of the open door survived because newcomers who broke it were ostracized, and that the profession became male-dominated because employers preferred to promote men, given that no one intended the aggregate outcome. Finally, if the principle turns on there being a mechanism, state precisely what would have to be shown for a claim like (e) to be repaired into an explanation rather than replaced by one.
reasoning: |-
  Hmm, the user is grappling with methodological individualism in social science explanations. They've categorized nine examples as genuine or non-genuine explanations and want to understand the underlying principle. Their core tension is why they accept consequence-based explanations like (d) (natural selection) but reject (h) (functionalist claims), and why (g) feels uneasy while resembling rejected (e).

  Looking at their examples, I notice several patterns: they consistently accept explanations grounded in individual actions/decisions (a,b,i), emergent processes (c,f), and unintentional selection mechanisms (d). But they reject functionalist or structural claims that lack microfoundations (e,h). Their unease with (g) is particularly telling - it's almost accepted but feels like "functionalist reasoning with extra steps."

  The key distinction appears to be whether the consequence is produced by an actual causal mechanism at the individual level. For (d), natural selection provides that mechanism (differential survival/reproduction), while (h) lacks any specification of how the crisis restored profitability. Similarly, (e) fails because "serving interests" doesn't explain persistence without showing how those interests actively maintained the system.

  For their undecided cases: "open door custom" would be genuine if ostracism creates individual-level incentives, while "male-dominated profession" would require showing how employer preferences collectively produced the pattern regardless of intention. 

  To repair (e), one would need to specify how dominant groups actively enforced caste rules through sanctions, ideology, or control - turning a functional description into an account of sustaining actions. The unifying principle seems to be requiring microfoundations: explanations must show how outcomes emerge from structured individual actions, even when those actions are interdependent or unintentional.
answer: |-
  Based on your intuitive judgments, the underlying principle distinguishing "genuine" explanations from "redescriptions" is **Microfoundational Mechanism**. You require explanations to specify how aggregate outcomes *causally emerge* from structured individual actions, decisions, or selective pressures operating at the micro-level – *even when* the outcome is unintended or involves collective phenomena. Crucially, the mechanism must be *causal*, not merely functional or correlational.

  Here's how this principle accounts for all your verdicts:

  1.  **Genuine Explanations (Mechanism Specified):**
      *   **(a) Bank run:** Mechanism = Individual depositors' rational choices given beliefs about others' actions (strategic interdependence).
      *   **(b) Firm bribes:** Mechanism = Firm's decision-makers acting based on competitive pressure and expected consequences (individual rational choice within an organizational context).
      *   **(c) Inflation acceleration:** Mechanism = Implicitly, price-setters' actions based on expectations (aggregate individual decisions driven by shared beliefs).
      *   **(d) Perch size change:** Mechanism = Selective pressure (differential survival/reproduction based on trait - size) acting on individual fish. *Consequence (survival) is the cause.*
      *   **(f) Dueling decline:** Mechanism = Individuals recalculating the cost/benefit of dueling based on state monopoly of force (changed incentives for individual action).
      *   **(g) Commons upkeep:** Mechanism = Individual users' expectations and decisions based on rules and mutual expectations (institutional rules structuring individual choices). *This avoids being (e) because it specifies the micro-level decision rule.*
      *   **(i) Senator's vote:** Mechanism = Individual senator's decision motivated by donor influence (direct individual agency + external pressure).

  2.  **Not Explanations / Redescriptions (Mechanism Lacking):**
      *   **(e) Caste persistence:** Lacks mechanism. "Serving interests" describes a *function* or *benefit*, not *how* that benefit translates into actions that sustain the institution. Who acted? How did the benefit cause *their* actions? What specific actions maintained it?
      *   **(h) Crisis requirement:** Lacks mechanism. "Required" implies a functional necessity, not a causal process. *How* did the crisis restore profitability? Through what specific actions (e.g., bankruptcies reducing competition, wage cuts)? Who or what acted? Functional claims like this assert a consequence *as* the cause without showing the causal path.

  **Resolving the Tensions:**

  *   **(d) vs. (h):** Both cite consequences. The difference is **causal direction and mechanism**.
      *   **(d):** The consequence (being caught) *causes* differential survival *of individuals* in the past/present, changing the population trait distribution. The mechanism (selection) is clear and operates at the micro-level on individuals.
      *   **(h):** The consequence (restoring profitability) is presented as the *reason for* the crisis happening in the future. It lacks any micro-level mechanism showing *how* the need *caused* the crisis (e.g., what specific actions taken *because* profitability needed restoring led to the crisis?).
  *   **(g) vs. (e):** Both involve institutions and benefits. The difference is **microfoundations**.
      *   **(g):** Specifies the micro-level mechanism – individual users acting based on rules and expectations of others' actions.
      *   **(e):** Stops at the macro-level ("served interests"), failing to connect this benefit to the actions of specific individuals that sustained the institution.

  **Principle:** **An explanation is genuine if it explicitly or implicitly identifies a causal mechanism operating at the level of individuals (or constituent parts) that reliably generates the aggregate outcome, demonstrating *how* that outcome emerges.** This mechanism must involve actions, decisions, selections, or responses driven by incentives, beliefs, rules, or environmental pressures affecting individuals.

  **Application to Undecided Cases:**

  1.  **"The custom of the open door survived because newcomers who broke it were ostracized."**
      *   **Genuine Explanation.** The mechanism is clear: Individual newcomers face a negative consequence (ostracism) for breaking the custom. This disincentive structures individual choices (to conform), sustaining the custom. It operates at the micro-level (individuals experiencing sanctions).

  2.  **"The profession became male-dominated because employers preferred to promote men, given that no one intended the aggregate outcome."**
      *   **Genuine Explanation.** The mechanism is explicit: Individual employers' decisions (promoting men) aggregated over time, leading to the male-dominated profession. The lack of *intention* for the aggregate outcome is irrelevant; the micro-level actions (promotion decisions based on preference) are the causal drivers.

  **Repairing Claims like (e):**

  To transform a functional redescription like (e) into a genuine explanation, you must **specify the sustaining mechanism at the individual level.** For (e): "The institution of caste persisted *because members of the dominant group actively enforced caste rules through sanctions (e.g., social exclusion, economic penalties, violence) against transgressors, believing this maintained their privileged position and social order*."

  *   **What must be shown:** The specific actions taken by individuals (or groups acting as agents) *because* they perceive a benefit (or cost avoidance), and how these actions *directly cause* the persistence of the phenomenon. You must move from "it served interests" to "individuals/groups X, motivated by interest Y, performed action Z, which had the consequence of maintaining the institution." The benefit explains *their motivation to act*, and their actions *are* the mechanism maintaining the institution.

  **Conclusion:**

  Your intuitive judgments are remarkably consistent with the **Microfoundational Mechanism** principle. This principle successfully distinguishes your genuine explanations (a, b, c, d, f, g, i) from your rejected cases (e, h) and resolves the apparent tensions between (d)/(h) and (e)/(g). It also provides clear guidance for the undecided cases and for repairing functionalist claims. You don't require intentional collective agents (accepting a, d, f, g), but you *do* require that the explanation ultimately trace the causal path back to the structured actions, choices, or selective pressures affecting individuals. Abandoning this principle would force you to accept functionalist claims like (e) and (h), which your intuition correctly rejects as incomplete explanations.
