prompt: |-
  I'm a high school student in a Great Books seminar, and we've just read the first book of Aristotle's Politics, where he argues about slavery. I want to make sure I understand the argument before I write my paper, so I'm asking you to act as a patient expert in ancient Greek philosophy and walk me through it carefully. Here is the argument as I have it, in my own words rather than as a quotation: Aristotle says that a slave is a piece of property, and more precisely a living instrument, since a possession is something we use and an instrument is something we use to act, so a slave is the kind of tool that does the work of several inanimate tools at once. He then says that rule over slaves differs from rule over free people, and that some human beings are slaves by nature, namely those who can take in what reason says and follow it but cannot deliberate on their own, so that it is better for them to be ruled by someone who can. He adds that this kind of slavery is not only just but advantageous to the slave, and he compares the relation to the rule of the soul over the body. Later he admits that the slavery we actually see around us is often slavery only by law or conquest, and that the people who end up enslaved are frequently not slaves by nature at all, so that the justice of the institution is disputed. And in the last part of the book he says slaves do need a share of virtue, like temperance and courage, though a different sort from the master's.

  What I can't fit together is this. If the natural slave is defined by a defect in deliberating, so that he is something like a living tool, why does Aristotle insist he must still have virtues, and why does he say the rule is good for the slave rather than merely convenient for the master? And if the natural slave is supposed to be the real justification for the institution, what is he doing conceding that the actual slaves are mostly enslaved by law and not by nature? I keep suspecting I'm treating these as one claim when they're really several, but I can't see how they're supposed to be layered. Please begin by working through the argument in order and telling me what each piece is doing before you answer my question, then give me a careful reading of how the natural-slavery claim, the benefit claim, the living-tool image, and the concession about legal slavery are meant to relate, and tell me plainly which parts of this are genuinely ambiguous in the text rather than just confusing to a first-time reader. I'd also like to know what a common misreading is here, since I'd rather not build my paper on one. Please write your answer as continuous prose, with no headings, bullet points, bold text, or tables, in the manner of a long and thoughtful email.
