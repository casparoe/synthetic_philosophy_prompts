  I'm a novelist — fourth book, deadline breathing down my neck — and I've hit a snag that started out as a character problem and is now keeping me up at night. My editor says I'm overthinking it. I don't think I am, so I'm asking you.

  The scene. My narrator, Ruth, is about to reread her late mother's diary. She's read it before, so she knows exactly what's coming: by the time she's finished, she'll be completely certain her mother had an affair. And she knows the certainty will be overdetermined — part of it comes from stuff actually in the diary that she's half-forgotten, and part of it comes from the fact that the diary always drops her into a black mood where every old memory reads as a betrayal. So tomorrow-Ruth will be certain, and today-Ruth knows it.

  Her friend Dev, who dropped out of a PhD and never lets anyone forget it, says this settles it. Tomorrow-you is just you with more of the picture, he says — and if you trust your own judgment at all, you have to trust tomorrow's, and tomorrow's says P. So if you're certain that tomorrow-you will be certain that P, you should already be certain that P; otherwise you're betting against your own future self. Ruth says that's insane — if she adopted every conviction she knew she'd wake up with, she'd believe alot of contradictory things before breakfast.

  Who's got it right? And more to the point, what's the actual rule here, because I need Ruth to be doing something defensible on the page and I genuinely can't tell if Dev has found a real argument or just a clever one.

