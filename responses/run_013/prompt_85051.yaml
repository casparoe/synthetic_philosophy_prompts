answer: |-
  ### Joint Statement on Mental Causation: Adversarial Collaboration  
  **Governed by Interventionist Framework & Realiser-Fixing Constraint**  

  ---

  ### 1. Agreed Claims  
  Both camps jointly endorse the following, framed strictly within Woodward’s interventionist account:  

  1.1 **Causal Closure of the Physical**: For any physical effect *E*, there is a sufficient physical cause *P* at the relevant time, such that interventions on *P* (holding fixed other variables) change *E*.  
  1.2 **Supervenience**: Mental properties supervene on physical properties. There can be no change in a mental property *M* without a change in its physical realiser *P*.  
  1.3 **Rejection of Systematic Overdetermination**: *E* is not systematically caused by two *independent* sufficient causes (e.g., *M* and *P* acting as redundant "backups").  
  1.4 **Causation as Difference-Making**: *X* causes *Y* iff interventions on *X* (ideal, non-confounding) change the probability or value of *Y* when other variables are held fixed. No appeal to "causal production" or "power transfer" is permitted.  
  1.5 **Realiser-Fixing Constraint (RFC)**: Interventions targeting mental property *M* must be specified as interventions on its physical realiser *P*. Assessing *M*’s causal status requires contrasting scenarios where *P* varies while *M* is fixed (if possible) against scenarios where *M* varies with *P*.  
  1.6 **The Disagreement is Not About**:  
     - **Terminology**: Claims like "mental properties lack *causal efficacy*" (exclusionist) vs. "mental properties are *causally relevant*" (non-reductionist) are verbal. Both agree "causation" here means *difference-making*.  
     - **Supervenience or Closure**: Both accept these as starting points.  
     - **Eliminativism**: Neither camp denies the existence of mental properties.  

  ---

  ### 2. Residual Disagreements  
  *Formulated in each camp’s own accepted wording:*  

  | Issue | Exclusionist Position | Non-Reductionist Position |
  |-------|------------------------|---------------------------|
  | **Mental Causation Under RFC** | When *M*’s realiser *P* is fixed, interventions on *M* alone are incoherent (by supervenience). Thus, *M* never adds causal power beyond *P*: varying *P* while fixing *M* is either impossible or shows *M* is inert. | *M* can be a difference-maker for *E* even if *P* is sufficient. RFC’s requirement to fix *P* when testing *M* misidentifies the contrast class: the relevant test is whether *M* varies *proportionally* with *E* across realisers. |
  | **The Redundancy Case** | In cases where *M* is realised by *P₁* or *P₂* and *E* always occurs: <br> - *P₁* causes *E* when it realises *M*. <br> - *M* does not cause *E*. If *P₁* is intervened on (preventing it), *P₂* realises *M* and *E* still occurs. Thus, interventions on *M* (via *P₁*) show no change in *E*. | *M* causes *E* because it is the invariant difference-maker: whenever *M* occurs (via *P₁* or *P₂*), *E* follows. *P₁* and *P₂* are causes only derivatively, as realisers of *M*. An intervention on *M* (switching it from *M* to *¬M*) would change *E*, regardless of realiser. |

  ---

  ### 3. Cruxes  
  *Sub-questions where resolution would shift at least one camp’s position, with agreed tests and predictions:*  

  **Crux 1: Does RFC Invalidate Mental Causation?**  
  - **Test**: Fix realiser *P* and attempt to vary *M*. If *M* cannot change without *P* changing (per supervenience), can *M* still be a difference-maker for *E*?  
  - **Exclusionist Prediction**: Fixing *P* fixes *M* and *E*; varying *M* alone is impossible. Thus, *M* cannot be a difference-maker.  
  - **Non-Reductionist Prediction**: RFC misunderstands variables. *M* should be tested at its *own level*: interventions should contrast *M* vs. *¬M* across possible realisers, not fix *P*.  

  **Crux 2: The Redundancy Case Intervention**  
  - **Test**: Intervene to prevent *P₁* (e.g., inhibit neuron cluster *P₁*). Does *E* still occur?  
  - **Agreed Physiology**: *P₂* realises *M* and produces *E*.  
  - **Exclusionist Prediction**: *E* occurs (via *P₂*), proving *P₁* was redundant. *M*’s constancy shows it is epiphenomenal.  
  - **Non-Reductionist Prediction**: *E* occurs *because M is still present* (via *P₂*). The cause is *M*’s stable presence, not the absence of *P₁*.  

  **Crux 3: Specificity vs. Proportionality**  
  - **Test**: Which is the "better" cause of *E*: the specific realiser (*P₁*/*P₂*) or the mental property *M*?  
  - **Agreed Metric**: "Proportionality" (Woodward): Causes should be specific enough to fix *E* but general enough to avoid irrelevant detail.  
  - **Exclusionist Prediction**: *P₁*/*P₂* are proportional: they are minimally sufficient for *E*. *M* is too coarse-grained (e.g., *M* could be realised in ways not causing *E*).  
  - **Non-Reductionist Prediction**: *M* is proportional: *E* depends only on *M*’s presence, not *which* realiser instantiates it. *P₁*/*P₂* are overly specific.  

  ---

  ### 4. Closing Note: What Would Change Minds?  
  - **Exclusionists** would reconsider if:  
    A case showed *M* is a difference-maker where *no specific realiser* is (e.g., *E* occurs only when *M* is present across *disjoint* realisers, but not when any realiser occurs without *M*).  
  - **Non-Reductionists** would reconsider if:  
    A case proved *M*’s proportionality is *irrelevant* to *E* (e.g., *E* tracks only physical specifics *uniquely* tied to *P₁*/*P₂*, not *M*’s functional profile).  
  - **Both camps** agree the **Redundancy Case** is pivotal. If interventions showed *E* *fails* when *M* is absent despite a realiser (e.g., *P₁* occurs without *M* and *E* does not follow), non-reductionists would win. If *E* *persists* when *M* is absent but a realiser is present, exclusionists would win.  
  - **Prognosis**: Both camps acknowledge that resolving Crux 3 (proportionality) could dissolve the deadlock, as it shifts focus from supervenience to causal pragmatics.  

  ---  
  *This document, drafted under agreed constraints, is submitted for circulation and further experimentation by the group.*
