prompt: |-
  I am writing the final essay paper for an upper-level undergraduate course in aesthetics (closed book, ninety minutes, one question answered in full). The last unit of the course concerns authenticity, forgery, and the value of originals, and I need a question that cannot be answered by reciting the standard opposition between the view that a work's aesthetic value supervenes on what can be perceived in it and the view that the history of its production enters into its aesthetic properties. My students can reproduce that opposition without effort. What they cannot do is say what would have to be true for either side to be right.

  I have therefore been teaching a four-way distinction between loci of value, and I want the question to force students to work with it rather than gesture at it:

  - vehicle: the value of the perceptible surface itself;
  - achievement: the value of the making, i.e. of what the maker had to solve;
  - standing: the value of the object's position in a causal and institutional history — its provenance, its place in a corpus, what it enables downstream;
  - encounter: the value of the experience available to a viewer who is situated in a particular way, including what that viewer knows.

  The crux I want the question to turn on is this: "perceptually indistinguishable" is an incomplete premise until one says indistinguishable to whom, and in what state of information; and once that is specified, the surface-supervenience view turns out to be a claim about an experience available only to someone who does not know what he is looking at — an experience that, after the discovery, is available to no one. I want the question to make students see that this is a consequence of the position rather than a debating trick against it, and to require them to say whether it is a cost.

  Please build the question around three stipulated cases, which the question itself should state:

  (a) a perfect copy — a copy of an existing painting, indistinguishable from it by any means available now or later;
  (b) a forger's new work in the style of a painter who never made it, likewise undetectable, certified by the leading connoisseurs of its day and received into the corpus as a masterpiece before the deception is exposed;
  (c) the surviving original of a famous work whose attribution is subsequently downgraded — the object is unchanged, only what is known about it changes.

  The question should require, for each case, a verdict on which of the four loci of value survive and which do not, and should then press on the asymmetry between (a) and (c): in (a) the object differs and the knowledge is held fixed; in (c) the knowledge changes and the object is held fixed. It should also require students to say what evidence could settle the matter, or why none could. Note that (b) is not a copy of anything, so it must be handled separately from (a); I want to see whether students notice that a forgery of a work that never existed has no displaced original against which to be compared.

  Constraints: the question must not require students to name any author, work, or movement, and the model answer must contain no citations — the argument has to be carried by the cases. Aim for roughly 600 words of model answer, and make the marking scheme name specific moves rather than general virtues, with the total at 20 marks.

  Give me the whole deliverable as a single JSON object with the following fields, and no prose outside it:

  - "question": the full text of the essay question exactly as it will appear on the paper, including the three cases and the instruction about what the answer must do;
  - "crux": one or two sentences, for my own calibration, naming the crux the question is built around;
  - "model_answer": approximately 600 words;
  - "marking_scheme": an array of objects, one per required move, each with "move" (a short name), "marks" (an integer; the marks must sum to 20), "full_credit" (what a full-credit treatment of the move contains), "partial_credit" (what earns some but not all of the marks), and "typical_failure" (the specific mistake that costs marks here);
  - "band_descriptors": an object with "first", "upper_second", "lower_second" and "third", each a one-sentence description of where that boundary falls.
reasoning: |-
  We are creating an essay question for an undergraduate aesthetics exam. The question should be built around three stipulated cases (a, b, c) and require students to apply a four-way distinction of loci of value (vehicle, achievement, standing, encounter). The crux is that perceptual indistinguishability is incomplete without specifying to whom and with what knowledge, and that the surface-supervenience view implies an experience available only to someone ignorant of the work's history, which becomes unavailable after discovery.

  The question must:
  - State the three cases (a, b, c).
  - Require, for each case, a verdict on which loci of value survive and which do not.
  - Press on the asymmetry between (a) and (c): in (a) the object is different (copy) and knowledge is held fixed (we know it's a copy); in (c) the object is the same but knowledge changes (downgraded attribution).
  - Ask what evidence could settle the matter or why none could.
  - Note that (b) is a forgery of a work that never existed, so there's no displaced original.

  Constraints: no requirement to name authors, works, or movements; model answer must have no citations.

  Model answer: ~600 words.

  Marking scheme: array of objects, each with move, marks, full_credit, partial_credit, typical_failure. Sum of marks = 20.

  Band descriptors: first, upper_second, lower_second, third.

  Let's design the question:

  Question text:

  "Consider the following three cases:

  (a) A perfect copy of an existing painting, indistinguishable from the original by any means available now or in the future.
  (b) A forger's new work in the style of a painter who never made it, likewise undetectable as a forgery, which is certified by the leading connoisseurs of its day and received into the corpus as a masterpiece before the deception is exposed.
  (c) The surviving original of a famous work whose attribution is subsequently downgraded — the object itself is unchanged, only what is known about it changes.

  Using the four loci of value (vehicle, achievement, standing, encounter), explain for each case which loci of value are preserved and which are lost, and why. Then, address the following: (i) the asymmetry between case (a) and case (c) — in (a) the object is a copy (so the object differs from the original) and we know it is a copy, while in (c) the object remains the same but our knowledge about it changes; and (ii) what evidence, if any, could settle whether the value of an artwork is solely in its perceptible surface? Finally, note that in case (b) there is no original work that the forgery copies. Your answer should not name any specific authors, works, or movements."

  Crux: "The surface-supervenience view implies that aesthetic value is tied to an experience available only to an ignorant viewer, which becomes unavailable after discovery; this is a consequence of the view, not a debating trick."

  Model answer (approximately 600 words):

  We will now write the model answer. It should be about 600 words and structured to address each case and the additional points.

  Structure:

  1. Introduction: Briefly explain the four loci and the challenge of the surface-supervenience view.

  2. Case (a): Perfect copy.
     - Vehicle: preserved (same perceptible surface).
     - Achievement: lost (not the achievement of the original artist, but of the copyist; the original achievement is not present).
     - Standing: lost (it does not have the causal history of the original; it is a copy and not the original).
     - Encounter: For a viewer who does not know it is a copy, the encounter value might be the same as the original. But once known, the encounter value changes because the knowledge of it being a copy alters the experience. However, in the scenario we are told we know it is a copy, so the encounter value is diminished because the viewer knows it is not the original.

  3. Case (b): Forger's new work.
     - Vehicle: preserved (same perceptible qualities).
     - Achievement: This is tricky. The achievement is the forger's, but the work was received as by the master. The achievement value might be split: the forger's achievement in creating a work that passed as the master's, but the achievement of the master (which was never there) is lost. However, note that the work is new and in the style, so the achievement is entirely the forger's. But the standing and encounter initially were for the master. After exposure, the achievement is recognized as the forger's. So the achievement value is preserved but now attributed to the forger? However, the achievement value that was initially perceived (as the master's) is lost. So we might say the achievement value (as the master's) is lost, but a new achievement value (as the forger's) is gained? But the question is about the value of the work as it was received. We have to note that the work was received as a masterpiece by the master, so the achievement value was attributed to the master. After exposure, that attribution is gone. However, the actual achievement (the forger's) is now known. So for the achievement locus, we can say that the value of the achievement as the master's is lost, but the value of the achievement as the forger's might be present. However, the model answer should be clear that the initial achievement value (which was misattributed) is lost. Similarly, standing: initially high, then lost. Encounter: initially high (as a masterpiece by the master), then changes (now as a forgery). Vehicle remains.

     But note: in (b) there is no original that it copies. It is an original forgery. So we cannot compare it to an original that it displaces. This is a key point.

  4. Case (c): Downgraded original.
     - Vehicle: preserved (same object).
     - Achievement: The achievement was the artist's, but now we think it was by a lesser artist. The actual achievement (what the maker had to solve) is the same, but our evaluation of it may change. However, if we downgrade the attribution, we are saying that the achievement is not by the great master but by a lesser one, so the achievement value is diminished because we now think it was done by someone with less skill or in a different context? But note: the achievement is the same act. However, our perception of the achievement changes. So the achievement value (as we perceive it) is lost? Or is the achievement value intrinsic to the act? This is tricky. The model answer should note that the achievement is the same, but the standing changes, which affects how we value the achievement. Alternatively, we might say the achievement value is unchanged because the act is the same, but our recognition of it changes. However, the locus of achievement is about the value of the making — if we now think it was made by a lesser artist, we might value the achievement less. So achievement value is lost? Or is it? This is a point to clarify.

     Actually, the achievement is the same act regardless of who did it. But the value of the achievement is often tied to the artist: if we thought it was by a child, we might value the achievement more than if by an adult. So the knowledge about the artist affects the achievement value. So in (c), the achievement value is lost when we downgrade the attribution.

     - Standing: lost (because it is no longer seen as part of the great master's corpus).
     - Encounter: changed — now we experience it as a work by a lesser artist.

  5. Asymmetry between (a) and (c): 
     - In (a): we have a different object (the copy) and we know it's a copy. The original had achievement and standing that the copy lacks. The copy has its own achievement (of the copyist) and standing (as a copy) but these are different and typically less valued.
     - In (c): the same object, but our knowledge changes. The achievement and standing that we attributed to it are lost because we now believe they were misattributed. The vehicle remains, but the other loci change because of knowledge.

     The asymmetry shows that the value of an artwork is not just in the vehicle: in (a) the vehicle is the same but other values are lost; in (c) the vehicle is the same but other values are lost due to knowledge. This challenges surface-supervenience.

  6. Evidence: What could settle whether value is solely in the perceptible surface?
     - We might look to whether there are cases where two objects are perceptually identical but have different values (like the original and the perfect copy). But the surface-supervenience view would say they have the same value. However, we do value them differently. So the evidence is in our actual practices of valuation. If we find that people value the original more even when they cannot tell them apart, that suggests value is not solely in the surface. But if we find that in blind tests they value them the same, that might support surface-supervenience. However, the surface-supervenience view must account for the fact that after discovery, the experience of the copy is different. The view might then say that the value is the same when the experience is the same, but that the experience changes with knowledge. So the view is that the aesthetic value supervenes on the surface only for a viewer who does not have any external knowledge. But then that experience is temporary and contingent. The evidence from our practices shows that we do care about history, so the surface-supervenience view is at odds with common practice.

     Alternatively, we might say that no evidence could settle it because it is a philosophical question about what constitutes aesthetic value.

     The model answer should argue that evidence from the way we treat such cases (like our examples) shows that we do not treat the value as solely in the surface.

  7. Note on (b): There is no displaced original, so the forgery does not replace an existing work. However, it does enter the corpus as a work by the master, so it affects the standing of the master's corpus until exposed. After exposure, it loses that standing and becomes a curiosity.

  Now, the model answer:

  Approximately 600 words.

  Let me write it.
