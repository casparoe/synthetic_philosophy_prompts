answer: |-
  Here is the specification table for a theory of corruption, anchored in your cases and constraints:

  | Requirement | Case or consideration behind it | Status | Candidates it rules out |
  |-------------|----------------------------------|--------|--------------------------|
  | **Must classify payments for official deviation** | Customs payment to under-declare shipment | Non-negotiable | Definitions excluding explicit quid pro quo or requiring systemic embeddedness |
  | **Must classify unilateral gifts creating future partiality** | Large gift to doctor securing priority | Non-negotiable | Definitions requiring explicit agreement, immediate exchange, or monetary transactions only |
  | **Must classify diffuse reciprocal exchange without discrete "payments"** | Patron-client favor network | Non-negotiable | Definitions requiring a single corrupt "act," direct material exchange, or criminal intent |
  | **Must explain jurisdictional variation without relativism** | Lobbying retainer legal in Jurisdiction A, criminal in Jurisdiction B | Non-negotiable | Definitions equating corruption solely with illegality or denying trans-jurisdictional core |
  | **Must classify informal charges for officially free services** | Fee for free public service | Non-negotiable | Definitions requiring violation of formal law or ignoring abuse of entrusted power in informal contexts |
  | **Must explain divergent interpretations of resource diversion** | Kin obligation vs. auditor's theft | Non-negotiable | Definitions relying solely on actor intent OR external legalistic view; must accommodate both perspectives |
  | **Must not impose one society's public/private boundary** | Kin obligation vs. theft case | Anthropological Relativist Camp | Definitions assuming universal, fixed boundaries between "public office" and "private" spheres |
  | **Must distinguish corrupt act from corrupt system** | Patron-client network (system) vs. single bribe (act) | Non-negotiable | Definitions conflating individual deviance with systemic logic or vice versa |
  | **Must distinguish corruption from mere partiality/inefficiency** | Doctor's priority vs. inherent clinical bias | Non-negotiable | Definitions diluting corruption to any bias, inefficiency, or non-ideal behavior |
  | **Must account for participant vs. auditor normative frameworks** | Kin obligation (internal) vs. theft (external) | Non-negotiable | Definitions accepting only one normative viewpoint (e.g., only state law, only local norms) |
  | **Must distinguish duty to office from duty to person** | Customs officer (duty to state) vs. patron's obligation to client | Non-negotiable | Definitions blurring formal role-responsibility and personal loyalty/reciprocity |
  | **Must distinguish individual deviance from stable equilibrium** | Single corrupt act vs. patron-client system where non-participation is costly | Non-negotiable | Definitions unable to explain why corruption persists even when individuals dislike it |
  | **Must accommodate gifts creating open-ended obligations** | Doctor's gift (creates diffuse reciprocity) | Finding (Non-negotiable) | Definitions treating corruption as purely contractual/transactional exchanges |
  | **Must explain differential state experience** | Civic institution vs. extraction machine | Finding (Non-negotiable) | Definitions assuming a monolithic state-citizen relationship or ignoring power asymmetries |

  **Incompatible Pair:**  
  Requirement 3 (*Must classify diffuse reciprocal exchange*) + Requirement 7 (*Must not impose one society's public/private boundary*) **vs.** Requirement 6 (*Must explain divergent interpretations*) + Requirement 10 (*Must account for participant vs. auditor frameworks*).  
  *Conflict:* Deeply embedded practices viewed as legitimate obligations by participants (Requirement 3 & 7) *must* be classifiable as corrupt by an external normative framework (Requirement 6 & 10). Reconciling internal legitimacy with external condemnation is the core tension.

  **Most-Excluding Requirement:**  
  **Requirement 10 (Must account for participant vs. auditor normative frameworks)**.  
  *Why:* It rules out the most candidate definitions by demanding that a single theory simultaneously:  
  1.  Validate the internal logic/perspective of participants (e.g., kin obligations, clientelistic reciprocity).  
  2.  Allow an external, often universalist/legalistic, perspective to condemn the *same practice* as corruption.  
  This excludes:  
  - Pure legalistic definitions (ignore internal legitimacy).  
  - Pure anthropological relativism (denies external condemnation is valid).  
  - Definitions relying solely on harm or efficiency (may not capture norm divergence).  
  - Definitions requiring mutual recognition of wrongdoing.  

  This requirement forces the theory to navigate the fundamental tension between emic and etic perspectives, making it the highest barrier.
