prompt: |-
  I am a PhD student in philosophy of literature, and I need to pin down the interpretive rule my supervisor is actually running before I commit a chapter to it. Her rulings on a run of cases: on a poem whose author's letters say it concerns a stillborn child, where the published text never mentions a child and works entirely through winter fields and a locked house, she held that the letters settle nothing and the poem means what the text sustains; on a set of posthumous fragments with no recoverable intention, she held that they nonetheless have a determinate meaning, namely the one a suitably informed reader would assign; on a lyric whose author left a stanza-by-stanza account of his aims, which the text fully bears out, she held that the poem means what the author said; and on a play whose author called its last scene sincere, where the staging and diction make sincerity almost unsustainably, she held the scene ironic.

  The case I must write on is this: a novelist appends an author's note disclaiming any autobiographical reading, and the drafts and letters in her archive show the disclaimer was sincere — the parallels were invented, not lived. Yet the published text's chapter arrangement and its central recurring image strongly invite the autobiographical reading, and I would argue the novel is a more coherent and more powerful work under that reading. Predict my supervisor's verdict on whether the novel means what the author intended; identify the rule she is running, and the rival rules that fit her earlier rulings just as well; say what each predicts here; give me your best guess with reasons; and name the further case that would best discriminate among them. Please answer in British English.
reasoning: |-
  Okay, the user is a PhD student in philosophy of literature facing a crucial methodological dilemma. They need to reverse-engineer their supervisor's interpretive principles before committing a chapter. The supervisor's previous rulings seem contradictory on the surface: sometimes privileging authorial intent, sometimes textual evidence, sometimes reader response. 

  Hmm, the user's case involves a novelist who sincerely disclaims autobiographical parallels, while the text's structure strongly suggests otherwise. The user believes the autobiographical reading makes the novel better. This is a classic intentionalism vs. anti-intentionalism puzzle with high stakes for their thesis.

  The supervisor's pattern suggests three possible principles:
  1) Textual determinism: Meaning resides in what the published text objectively sustains (fits the stillborn child poem case)
  2) Hypothetical intentionalism: Meaning is what an ideal reader would reconstruct from context (fits the fragments case)
  3) Moderate actual intentionalism: Author's intent matters only when textually realized (fits the stanza-by-stanza case)

  Ah, but the ironic play scene complicates this - there the supervisor overrode the author's stated sincerity because the text undermined it. That's key. The supervisor seems to treat authorial statements as evidence rather than authority. 

  For the user's case, I'd predict the supervisor will reject the author's disclaimer because the published text "strongly invites" the autobiographical reading. The drafts/letters showing sincerity are irrelevant to the public text's meaning. This aligns best with textual determinism. 

  The discriminating case would be an author who privately intended meaning A, left textual evidence suggesting B, but whose published text clearly supports A. If the supervisor chose B, that'd confirm textual determinism; if A, it'd support moderate intentionalism. 

  The user's phrasing suggests anxiety about wasted effort - they need certainty before writing. I should emphasize the supervisor's likely textualist leanings while acknowledging the ambiguity. The power/coherence argument might sway the supervisor professionally, but probably not methodologically. 

  Best to advise focusing on how the text itself constructs meaning regardless of provenance. That seems the supervisor's consistent priority across cases. The archive evidence might be useful contextually but not determinative.
answer: |-
  Based on the rulings provided, here's a breakdown of your supervisor's likely approach, the competing interpretive rules, predictions for your case, and a discriminating case:

  1.  **Predicted Verdict for Your Case:**
      Your supervisor will almost certainly rule that **the novel *does not* mean what the author intended (the disclaimer)**. The meaning is determined by the published text, which "strongly invites" the autobiographical reading.

  2.  **The Rule She is Likely Running:**
      **Textual Determinism (with Contextual Constraints):** Meaning resides solely within the published text itself. Authorial statements (letters, notes, drafts) are *evidence* about potential meanings, but never *determinative*. The text must objectively sustain a proposed meaning. However, "suitably informed" interpretation (as in the fragments case) implies context (language, genre, historical/cultural norms) is necessary to understand the text's potential meanings. **The text is sovereign; authorial statements are merely one type of contextual evidence, overridden if the text contradicts them.**

  3.  **Rival Rules Fitting the Earlier Rulings:**
      Two other rules fit *most* of the cases, but stumble on one each:

      *   **a) Moderate Actual Intentionalism:** The meaning is the author's successfully realised intention. Authorial statements are strong evidence *if* the text demonstrably bears them out.
          *   *Fits:* The stanza-by-stanza case (intention realised & text bears it out = meaning is author's). The fragments case (no recoverable intention forces hypothetical reconstruction). The stillborn child case (text doesn't bear out stated intention, so it doesn't count).
          *   *Stumbles on:* The ironic play case. The author called it sincere, but the text undermines sincerity. According to MAI, if the author *intended* sincerity and the text *could* bear it (even if awkwardly), the meaning should be sincere. The supervisor ruled it ironic, contradicting the author's stated intent.
      *   **b) Hypothetical Intentionalism:** Meaning is the best hypothesis about the author's intention constructed by a suitably informed reader *based on the public evidence* (primarily the text itself, but also public context like author's oeuvre, genre conventions, historical context). Private documents (unpublished drafts, letters) are irrelevant unless they reflect public context.
          *   *Fits:* The stillborn child case (public text doesn't support the private intention in letters). The fragments case (construction by informed reader). The ironic play case (informed reader sees irony despite author's statement).
          *   *Stumbles on:* The stanza-by-stanza case. HI would typically *not* give special weight to a private authorial statement about aims, even if the text bears it out. The meaning would be the same *whether or not* the author left the account. The supervisor specifically credited the author's statement ("the poem means *what the author said*"), suggesting the statement itself was determinative *because* it matched the text, not just that the reader would hypothesise it.

  4.  **Predictions for Your Case:**
      *   **Supervisor's Rule (Textual Determinism):** Rejects the author's intended meaning (the disclaimer). The published text's structure and imagery strongly invite/sustain the autobiographical reading. The sincere drafts/letters are irrelevant private evidence; only the public text matters. **Meaning = autobiographical.**
      *   **Moderate Actual Intentionalism:** The author *intended* the disclaimer and *intended* the parallels to be fictional. Crucially, the text *does not* "fully bear out" the intended non-autobiographical meaning; instead, it strongly suggests the opposite. Therefore, the *successfully realised* intention is likely the autobiographical one *despite* the author's conscious aim (a case of unconscious intention or failed execution). The disclaimer fails. **Meaning = autobiographical.**
      *   **Hypothetical Intentionalism:** The "suitably informed reader" considering the *public* text (including the author's note!) and public context (author's known biography, genre norms) would likely weigh the *textual evidence* (chapter arrangement, central image) more heavily than the *authorial note* in forming the best hypothesis about intended meaning, especially if the note seems contradicted by the text. Private drafts/letters confirming sincerity are irrelevant. **Meaning = autobiographical (probable, but less certain than other rules).**

  5.  **Best Guess with Reasons:**
      **Textual Determinism** is the strongest fit. Here's why:
      *   **Stillborn Child:** Text trumps private letters. (TD & HI fit; MAI fits).
      *   **Fragments:** Meaning is objective, determined by informed reading of the text, without author. (TD & HI fit; MAI fits by default).
      *   **Stanza-by-Stanza:** Author's statement *is* credited alongside the text bearing it out. (TD: statement is *evidence* confirmed by text. MAI: perfect fit. HI: awkward fit - why credit the private statement?).
      *   **Ironic Play:** Text trumps author's statement about sincerity. (TD & HI fit perfectly; MAI stumbles).
      The **Ironic Play case** is the clearest discriminator. Your supervisor explicitly overrode the author's stated intention because the *text* rendered it "almost unsustainable." This prioritisation of the text over authorial declaration, even about their own sincerity, is the hallmark of Textual Determinism. It shows authorial statements are subordinate evidence, not authority. While the Stanza case shows she *uses* authorial statements, it's only when they perfectly align with the text *and* likely serve as helpful evidence for what the text sustains. In your case, the text contradicts the author's note, so the note will be overruled.

  6.  **The Further Case to Discriminate:**
      **The Public/Private Paradox:** An author publishes a novel clearly depicting Event X (based on textual evidence). Simultaneously, they give a *public interview* stating they intended to depict Event Y, a very different interpretation. Crucially, the text *can* plausibly support *either* reading X or Y, though perhaps one is slightly more natural. Private letters confirm they genuinely intended Y.
      *   **Textual Determinism:** The novel means *both* X and Y (if the text genuinely sustains both), or perhaps the slightly more natural reading. The public interview is just more contextual evidence, but doesn't override the text's ambiguity. Private letters irrelevant.
      *   **Moderate Actual Intentionalism:** The meaning is Y (the intended meaning) *if* the text bears it out (which it does, plausibly). The public interview is strong evidence of intent. Private letters confirm it. Meaning = Y.
      *   **Hypothetical Intentionalism:** The meaning is the best hypothesis of the *public* author's intention. The public interview stating Y is crucial *public* evidence. A suitably informed reader would likely conclude Y was intended. The text bearing Y plausibly confirms this. Meaning = Y. (Private letters still irrelevant).

  This case discriminates because:
  *   TD allows multiple meanings based solely on text, downplaying the author's *public* statement of intent.
  *   MAI & HI both prioritise the author's stated intent (publicly evidenced) *provided* the text can bear it.

  **Conclusion:** Your supervisor operates on a principle of **Textual Determinism**. Authorial statements, private or public, are evidence submitted to the court of the published text. The text is the judge and jury; it must sustain the meaning. If the text contradicts authorial pronouncements, the text wins. In your case, the text "strongly invites" the autobiographical reading, overriding the sincere disclaimer and private evidence. Commit your chapter accordingly: focus on demonstrating how the *published text itself* constructs and sustains the autobiographical meaning, using its chapter arrangement and central imagery as your primary evidence. The author's note and archive material are secondary context, useful perhaps to show the *tension* or the reader's experience of being invited despite the disclaimer, but not determinative of meaning. Good luck!
