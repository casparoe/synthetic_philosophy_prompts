prompt: |-
  You're a veteran teacher of this material — I want the plan from someone who has watched it go sideways in a classroom many times, not a textbook summary. Think it through before you write, and if it helps, brainstorm a few candidate examples first and throw the bad ones away.

  Setup: I've got 90 minutes, a whiteboard, and a reading group of linguistics grad students. They know Kripke and Kaplan cold — rigid designation, character versus content, the whole apparatus — but none of them has ever read anything on two-dimensional semantics. I know the material well enough to teach it. What I don't know is how to order it. So don't explain 2D semantics to me. Plan the session.

  What I need:

  1. The dependancy order. List the moves in the order they have to come, and for each one say what the previous move had to establish for it to even be statable. Somewhere in there you need the two ways of evaluating a world — as the world that turns out to be actual, versus as a mere counterfactual alternative — and you need to tell me where the actually operator starts pulling its weight, because my students will happily nod through a truth table and then be lost the moment the thing is asked to do real work. Flag the one step that's load-bearing: if they miss that one, everything after it is scaffolding. Also tell me where in the sequence to deal with the question of which version of the framework I'm teaching, since someone will ask and a vague answer there will cost me the room.

  2. The carrying example. One example, reused from the first minute to the last, that can be redeployed at every step. Constraints: not water, not the evening star / morning star, and no indexicals — they've all seen those three and will pattern-match to Kripke or Kaplan and stop thinking. I want a term whose extension is fixed by communal practice rather than by an underlying essence: a role, an office, a kind of thing that exists only because people keep treating it as existing. Tell me what the example has to have (a reference-fixing story visibly different from the story that fixes the extension, so the two rows come apart in front of them) and what it has to lack (hidden chemistry, a clean causal-historical chain, any essence that does the work for them). If you think an institutional term is the wrong call, use something else — but justify it against the alternative, because my instinct is that this is exactly where the students' grip gets tested.

  3. Misconceptions, in the order they'll show up, and where in the sequence I head each one off. I'm expecting at least these two: that this is just Kaplan's character/content distinction with new vocabulary, and that the primary intension is whatever the speaker has in mind. Give me the rest, place each one at a numbered point in the sequence, and give me one sentence per misconception that I can actually say out loud.

  4. The check. One whiteboard exercise for the last ten minutes that seperates the students who've got it from the ones who've been nodding. I'd like it to be the turn onto a case where the community's practices shift, if that works — but if that's a bad check, say so and give me a better one.

  5. What I announce I'm not covering, out loud, and why. There's a lot of live controversy downstream of this and I don't want to fake completeness in 90 minutes.

  End the whole thing with a single final line in this format, and nothing after it: ARC: <one sentence, the spine of the session>
reasoning: |-
  Okay, let me approach this like a veteran teacher who's seen 2D semantics lessons go sideways. The user wants a battle-tested plan, not a textbook summary. 

  First, I need to consider the dependency order carefully. The biggest pitfall I've seen is students nodding through the truth tables but collapsing when "actually" starts working. The load-bearing step is clearly establishing the two ways of evaluating worlds - as actual vs as counterfactual. If they miss that, the whole framework becomes scaffolding. I'll put that right after introducing the matrix but before any operator work.

  For the carrying example, institutional terms are perfect because they lack hidden essences. "The Speaker of the House" works well - reference fixed by description (role), extension fixed by practice. Crucially, it lets the two intensions come apart visibly when we consider scenarios where different people hold the role. Avoids all the overused examples they'd pattern-match to Kaplan/Kripke.

  Major misconceptions to sequence:
  - Right after introducing primary intension, someone will think it's speaker's mental content. Need to shut that down with "It's not about what's in your head, it's about what the community's rules pick out in this scenario."
  - When presenting the matrix, they'll whisper "this is just Kaplan". Must explicitly contrast before that point: "Unlike character, this isn't tied to utterance context - it's about epistemic scenarios."

  The whiteboard check needs to expose who's really tracking. A community practice shift is ideal - have them plot what happens when "Speaker of the House" criteria change mid-term. The key is whether they can separate the two evaluation methods when the rules are in flux.

  Time management is crucial. I'll explicitly rule out covering the metaphysical debates (Chalmers vs Stalnaker) and the descriptivist revival arguments. Better to announce limits than fake completeness.

  The ARC has to be: "Two tools, not one: evaluating worlds as actual (epistemic) vs as counterfactual (metaphysical) gives us distinct intensions that explain different philosophical puzzles." That's the spine.
answer: |-
  ### 1. Dependency Order & Load-Bearing Step  
  *(Total: 45 mins)*  
  **a. Pain Point:** Students conflate "world as counterfactual" vs. "world as actualized scenario." **Load-bearing step:** Step 3 (matrix construction). If they miss this, the framework collapses into Kaplan.  

  | Step | Move                                      | Pre-Requisite Established                | Time  |  
  |------|-------------------------------------------|------------------------------------------|-------|  
  | 1    | **Motivation Puzzle:** "How can 'Hesperus ≠ Phosphorus' be *epistemically possible* but *metaphysically necessary*?" | Recap Kripke: rigid designation ≠ epistemic access | 5 mins |  
  | 2    | **Two Modes of Evaluation:** Distinguish:  
        - *Considering a world as actual* (epistemic/scenario)  
        - *Considering a world as counterfactual* (metaphysical) | Clear separation: "When we ask *'Could it have turned out that...?'* vs. *'If the world had been...'*" | 10 mins |  
  | 3    | **Build the Matrix:**  
        - Rows: Scenarios (worlds *as actual*)  
        - Columns: Counterfactual worlds  
        - Cells: Truth-value of S relative to (row-scenario, column-world) | Step 2 must be visceral. Use "scenario" not "world" for rows initially. | 15 mins |  
  | 4    | **Operators Enter:** "Actually" now does work:  
        - "Actually S" is true at (w, w') iff S is true at (w, w)  
        - Contrast with "Necessarily S" (diagonal vs. horizontal) | Matrix is stable. *Flag: "This is where Kaplan's 'context' gets split."* | 10 mins |  
  | 5    | **Announce Framework:** "We're doing *epistemic* 2D (Chalmers-style), not *metasemantic* (Stalnaker). Why? Epistemic puzzles are our target." | After Step 4, once they see the "actually" leverage. | 5 mins |  

  ---

  ### 2. Carrying Example: **"The Speaker of the House"**  
  *(Reused at every step; institutional, no hidden essence)*  
  **Why it works:**  
  - **Reference-fixing description:** "The person elected Speaker by the majority House vote."  
  - **Extension-fixing practice:** Actual historical chain (e.g., McCarthy was Speaker in 2023 via chaotic vote).  
  - **Critical divergence:** In a scenario where AOC wins a contested 2025 vote (row), "The Speaker is a Democrat" is true. But evaluating *in our actual world* (column) with McCarthy: false. Essence-free (no "chemical makeup of Speaker").  

  **Deployment:**  
  - Step 2: "Could it *turn out* that the Speaker is an alien? (Epistemically possible scenario)."  
  - Step 3: Matrix rows: Scenarios with different election rules/outcomes.  
  - Step 4: "Actually, the Speaker is Republican" true only on rows where actual GOP holds House.  

  ---

  ### 3. Misconceptions & Preemptive Strikes  
  *(Timed to steps above)*  
  1. **After Step 1:** *"This is just Kaplan in disguise."*  
     → **Shut down:** "Kaplan's 'context' fixes reference *once*; here, rows *re-fix* reference per scenario."  
  2. **After Step 3:** *"Primary intension = what's in the speaker's head."*  
     → **Shut down:** "It's not about mental states—it's about what the *public rules* (e.g., 'elected by vote') pick out in w*as-actual*."  
  3. **During Step 4:** *"But rigid designation means the extension is fixed!"*  
     → **Shut down:** "Rigidity applies to counterfactual columns. Rows show how *we fix the designator* before rigidity kicks in."  
  4. **After Step 5:** *"So this revives descriptivism?"*  
     → **Shut down:** "No—primary intensions aren't Fregean senses; they're *functions from epistemic scenarios to extensions*."  

  ---

  ### 4. Whiteboard Check: **"The Speaker in Flux"**  
  *(Last 10 mins; forces evaluation-mode switch)*  
  **Exercise:**  
  - Scenario A (row): House rules change; Speaker now appointed by President.  
  - Question: In Scenario A (as actual), evaluate:  
    (a) "The Speaker is elected" (True)  
    (b) "Actually, the Speaker is elected" (False, if actual world has old rules)  
  **Why it works:** Tests grasp of "actually" anchoring to *their* actuality, not the scenario’s. Reveals who conflates rows/columns.  

  ---

  ### 5. Explicit Omissions  
  *(Announce at start and end)*  
  **Say aloud:**  
  - "We skip *metasemantic* 2D (e.g., Stalnaker's diagonalization) — our focus is epistemic motivation."  
  - "We avoid *metaphysical debates* (e.g., can scenarios be 'centered worlds'?) — today is about tool-building."  
  - **Why:** "90 minutes can’t resolve 40 years of literature. Goal: you see *why* 2D tools exist and how to wield them."  

  ---

  ARC: Two tools, not one: evaluating worlds *as actual* (epistemic) vs. *as counterfactual* (metaphysical) forces distinct intensions that explain how we learn necessities.
