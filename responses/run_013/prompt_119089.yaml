prompt: |-
  I chair the consent review subcommittee at a mid-sized academic medical center. We review roughly twenty protocols a week — interventional trials, biobank and data-use proposals, and a growing number of studies that recruit through the hospital's patient portal — and we have to reach a validity call on each within a few days, sometimes on a single pass through a consent form and a recruitment script. My reviewers are clinicians, nurses, and two community members; none of them is a philosopher; their decisions gate whether a study opens; and anything they cannot settle comes to me, with the full board hearing appeals. I want to hand them a reusable procedure, not a seminar.

  The board has been arguing about the same questions for years and has converged on a working set of distinctions that the procedure should preserve. Treat these as fixed starting points rather than things to relitigate:

  - Consent can fail at the level of the act (what was actually agreed to), the level of the process (how the agreement was obtained), or the level of the person (whether this person could authorize this particular decision at this time). A form that is flawless at one level can be void at another.
  - Coercion requires a threat, and a threat requires that the person be made worse off relative to some baseline. The choice of baseline — what they would have had without us, what they are entitled to, or the status quo — does most of the work in every hard case, and we have never agreed on which baseline to use.
  - An offer cannot coerce, but it can be an undue inducement, and the tests differ: coercion is about the wrongness of the pressure, undue inducement is about whether the offer distorts judgment or exploits a bad situation.
  - Deception comes in kinds: about the nature of what is being done, about its consequences, about the alternatives, and mere non-disclosure of something the person would want to know. The last is the one our forms keep sliding past.
  - Competence is decision-relative, not global. The same person may be able to authorize a blood draw and not a washout of their current medication.
  - Legal validity and moral validity can come apart, and when they do, we want to know which one the procedure is tracking.

  What I want from you is the procedure itself, in a form a non-philosopher can run at a desk in fifteen minutes:

  1. The questions to ask, in order, with the order justified — which question must be settled before which, and why.
  2. For each question, what counts as a sufficient answer and what counts as a red flag that stops the review rather than merely being noted.
  3. The point at which the procedure returns a hard no, and the point at which it must hand the decision to a person because the remaining question is a value judgment rather than a fact. Mark the latter explicitly; my reviewers keep treating those as if they were factual.
  4. Any test you build in that a form can pass while the consent is still hollow — valid on paper and worthless in practice — and what the procedure should do about that, if anything.

  Then run the procedure on three cases and show your work at each step:

  (a) A Phase I study paying healthy volunteers $2,000 for ten inpatient days, in a city where $2,000 is roughly a month's take-home pay for the population being recruited.
  (b) A cancer trial in which the trial drug is free and the standard-of-care drug is not, recruiting patients whose own oncologist is also the site investigator.
  (c) A portal-based study that tells participants it concerns health and mood but is actually measuring whether people with a given diagnosis respond differently to one message framing versus another, with debriefing at the end.

  For each case, say where the procedure lands, what it cannot settle, and — where the procedure's answer differs from what a thoughtful reviewer would want — say so plainly instead of smoothing it over.

  Close with a short section on where the procedure will misfire: the cases it will pass that should have been stopped, the cases it will stop that should have passed, and which of the distinctions above it flattens in the course of becoming usable. Write the whole thing in American English, as a document I can hand to the subcommittee rather than an essay about consent.
reasoning: |-
  Hmm, the user chairs a consent review subcommittee at an academic medical center and needs a practical procedure for reviewing consent forms quickly. They have to handle about 20 protocols a week with limited time per review. The reviewers aren't philosophers—they're clinicians, nurses, and community members—so the procedure needs to be straightforward and actionable.

  The board has established several fixed distinctions: consent failure at act, process, or person levels; coercion requiring a threat with baseline issues; the difference between coercion and undue inducement; types of deception; decision-relative competence; and legal vs. moral validity. The procedure must preserve these while being usable in 15 minutes.

  Key requirements: ordered questions with justification, clear pass/fail criteria, hard stop points, and handling of "hollow consent" risks. Also need to test on three cases and identify where the procedure might misfire.

  Breaking this down: The procedure should start with foundational issues that could invalidate consent immediately. Order matters because some aspects (like competence) depend on context, while others (like threats) can stop the review cold. Need clear red flags—things that make consent impossible to validate regardless of other factors.

  For the cases: 
  - The Phase I study with high payment: Risk of undue inducement exploiting financial vulnerability. Must assess whether payment distorts judgment for this population.
  - Cancer trial with free drug but paid standard care: Potential coercion if the oncologist is also investigator. Baseline issue for coercion—what is patient entitled to?
  - Portal study with deception about true purpose: Non-disclosure red flag if not properly handled. Debriefing helps but must check if initial consent covers deception.

  The misfires section needs honesty: This procedure will miss subtle power dynamics (like therapeutic misconception) because it relies on documented information. It might also over-rely on baseline entitlements in coercion assessment, which is philosophically messy but necessary for speed.

  User's deeper need: They want to standardize decisions without philosophical debates, but also need to flag when human judgment is essential. The procedure should force value judgments to be acknowledged rather than hidden as factual calls.
answer: |-
  ## Consent Review Procedure for Subcommittee Members  
  *Version 1.0 - Operational Checklist*  
  **Purpose:** To determine if a consent process is legally and morally valid. Use this checklist in order. Do not proceed past a "Stop & Refer" or "Hard No." Time Target: 15 minutes per protocol.

  ---

  ### THE PROCEDURE  
  **Ask these questions in sequence. Order is critical: foundational validity must be established before assessing pressures or understanding.**  

  1.  **Is the person LEGALLY AUTHORIZED to consent to *this specific decision* at *this time*?**  
      *   *Why first?* If the person lacks legal authority (e.g., minor without emancipated status for this decision, adult under court-ordered guardianship for medical decisions, cognitive impairment rendering them legally incompetent *for this type of risk*), consent is void. Must be settled before anything else.  
      *   **Sufficient:** Documentation confirms legal authority matches the decision's nature/risk (e.g., assent + parental permission for minor, court documents specify scope).  
      *   **Red Flag/Stop & Refer:** Ambiguity in legal status for *this decision*; known cognitive impairment that *may* affect this specific authorization (e.g., dementia patient consenting to high-risk surgery research). *Stop review. Refer to IRB Legal Counsel/Full Board.*  
      *   **Hard No:** Clear lack of legal authority (e.g., minor consenting alone to a Phase I drug trial).  

  2.  **Are there any THREATS (explicit or implicit) making the person worse off *relative to their entitled baseline* if they decline?**  
      *   *Why next?* Coercion voids consent. Baseline = What the person is *entitled* to receive *outside* the research context (e.g., standard clinical care, existing benefits).  
      *   **Sufficient:** No threatened removal of entitled care/benefits (e.g., "You'll lose your regular treatment if you say no" is a threat; "You won't get the *experimental* drug if you say no" is not a threat to entitlement).  
      *   **Red Flag/Stop & Refer:** Threat to entitlements is present *or* ambiguity exists about what constitutes the "entitled baseline" (e.g., Is "access to this specialist clinic" an entitlement or a privilege?). *Stop review. Flag for Chair/Full Board value judgment on baseline.*  
      *   **Hard No:** Clear documentation of a threat removing an entitlement (e.g., "Non-participation will result in discharge from the clinic").  

  3.  **Does the offer create a HIGH RISK OF UNDUE INDUCEMENT for *this population*?**  
      *   *Why now?* Undue inducement doesn't void consent but can make it morally problematic. Assess *after* coercion is ruled out. Focus: Is the offer so valuable it could distort judgment/override risk aversion *for people in the target population's situation*, or exploit vulnerability?  
      *   **Sufficient:** Payment/benefit is commensurate with burden/time, not excessive relative to the population's economic context, and doesn't exploit a dire situation solely for recruitment.  
      *   **Red Flag/Stop & Refer:** Payment/benefit is very high relative to the target population's typical income/resources *and* the study involves more than minimal risk. *Stop review. Flag for Chair/Full Board value judgment on distortion/exploitation.*  
      *   **Hard No:** (Rare for inducement alone). Only if linked to clear coercion or deception.  

  4.  **Does the consent material CLEARLY DISCLOSE (without deception) the core elements?**  
      *   *Why now?* Understanding requires basic honesty. Disclosure failures can void consent or make it invalid.  
      *   **Core Elements:** Purpose ("This is research"); Procedures; Risks; Benefits; Alternatives (including standard care or no participation); Voluntariness; Contacts; Confidentiality; Compensation; Injury info (if applicable).  
      *   **Sufficient:** All core elements are explicitly stated in plain language. Any planned deception/non-disclosure is: (a) Necessary for scientific validity, (b) Justified by potential value, (c) *Explicitly described as a possibility within the initial consent process* (e.g., "Some details may be withheld initially, but you will be fully informed afterward"), AND (d) Subjects are told they can withdraw data upon debriefing.  
      *   **Red Flag/Stop & Refer:** Non-disclosure of a core element *without* justification AND the upfront disclosure about potential withholding/deception described in (c) above. *Stop review. Flag for Chair/Full Board to assess justification.*  
      *   **Hard No:** Active deception about the *nature* of the research (e.g., saying it's treatment when it's research) or its *major risks*. Non-disclosure of a significant risk the population would likely want to know.  

  5.  **Is the consent PROCESS adequate for THIS PERSON to understand THIS DECISION?**  
      *   *Why last?* Process adequacy depends on the *interaction* between the materials (vetted in Q4) and the person's situation (hinted at in Q1). Now assess the practical delivery.  
      *   **Sufficient:** Process includes: (a) Time for questions, (b) Clear language matching the population's comprehension level, (c) No evident barriers to understanding (e.g., consent discussion occurs during extreme distress without support), (d) Assessment procedure for comprehension *if high-risk or complex*.  
      *   **Red Flag/Stop & Refer:** Process relies solely on a complex form for a low-literacy population without oral explanation; Recruitment happens during acute medical crisis; Investigator has significant power over participant (e.g., treating doc). *Stop review. Flag for Chair/Full Board value judgment on potential pressure/understanding deficit.*  
      *   **Hard No:** Process actively prevents understanding (e.g., consent rushed during active labor, misrepresentation during discussion contradicting form).  

  **Procedure Output:**  
  *   If all 5 questions pass "Sufficient": **Approve Consent Process.**  
  *   Any "Stop & Refer": **Refer to Chair/Full Board for Value Judgment.**  
  *   Any "Hard No": **Reject Consent Process.**  

  **Hollow Consent Alert:** This procedure primarily assesses *documented* process and *potential* vulnerabilities. It **cannot guarantee** true understanding or the *absence* of subtle pressure in practice (e.g., therapeutic misconception, implicit power dynamics). If the form/process *looks* perfect on paper but context suggests understanding/voluntariness is likely compromised *in practice* (e.g., highly complex trial targeting frail elderly), note this concern under Q5 Red Flag even if boxes are technically ticked. Recommend enhanced monitoring or simplified process if approved.

  ---

  ### PROCEDURE APPLIED TO CASES  

  **Case (a): Phase I Study - $2,000 for 10 inpatient days ($2k ≈ monthly take-home pay)**  
  1.  **Legal Auth:** Healthy volunteers. Assume adults, legally competent. *Sufficient*.
  2.  **Threats?** No threat to entitlements. Payment is an offer. *Sufficient*.
  3.  **Undue Inducement?** **RED FLAG/STOP & REFER.** $2k is very high relative to monthly income for burden/risk of Phase I. High risk of distorting judgment or exploiting financial need for risky research. *Refer to Chair/Board: Is this payment level unjustly inducing *this population*?*
  4.  **Disclosure?** (Assuming core elements are present). *Sufficient*.
  5.  **Process?** (Assuming standard process for healthy vols). *Sufficient*.
      *   **Procedure Output:** **Stop & Refer** (Due to Q3). *Value Judgment Needed.*  
      *   **Thoughtful Reviewer Note:** Many thoughtful reviewers would likely flag this as potentially undue. The procedure forces this to be explicitly acknowledged as a value judgment about inducement/exploitation, not a factual "coercion" call. This is correct per the board's distinctions.

  **Case (b): Cancer Trial - Free Trial Drug vs. Paid Standard Care; Own Oncologist is Investigator**  
  1.  **Legal Auth:** Assume patients competent for this decision. *Sufficient*.
  2.  **Threats?** **CRITICAL.** Baseline = Entitled standard care. Is the patient entitled to *this* standard care drug? If standard care is *available and covered* outside the trial, offering only the *free* trial drug isn't a *threat* to entitlement. If standard care is *unavailable/unaffordable* otherwise, implying "decline trial = no treatment," this *could* be an implicit threat. **RED FLAG/STOP & REFER.** Baseline ambiguity (what *is* the patient entitled to?) and dual-role create high coercion risk. *Refer to Chair/Board: Does the patient's access situation + PI's role create an implicit threat?*
  3.  **Undue Inducement?** Free drug vs. paid standard care *could* be an undue inducement if standard care is unaffordable. *But Q2 is Stop & Refer, so stop here.*
  4.  *(Q4-5 Not Reached)*
      *   **Procedure Output:** **Stop & Refer** (Due to Q2). *Value Judgment Needed.*  
      *   **Thoughtful Reviewer Note:** Thoughtful reviewers would be deeply concerned about therapeutic misconception and pressure from the treating doctor. The procedure catches the baseline/coercion ambiguity but *might not* fully capture the insidious pressure of the dual role if standard care access is clear. The Q5 Red Flag for investigator power might be missed if not reached. This is a limitation.

  **Case (c): Portal Study - Disclosed as "Health & Mood," Actual Purpose is Message Framing; Debriefing Planned**  
  1.  **Legal Auth:** Portal users. Assume adults. *Sufficient*.
  2.  **Threats?** No apparent threats. *Sufficient*.
  3.  **Undue Inducement?** (Assume minimal/no payment). *Sufficient*.
  4.  **Disclosure?** **HARD NO.** Actively misstates the *nature* of the research ("health and mood" vs. message framing testing). Non-disclosure of the true purpose is *significant* and something participants would want to know. Planned debriefing doesn't cure the initial deception about nature/purpose. *Hard No.*
  5.  *(Q5 Not Reached)*
      *   **Procedure Output:** **Hard No - Reject** (Due to Q4).  
      *   **Thoughtful Reviewer Note:** This aligns with a thoughtful reviewer. Deception about the fundamental nature/purpose is a core invalidity. The procedure correctly stops it early at Q4.

  ---

  ### WHERE THE PROCEDURE WILL MISFIRE  

  This procedure prioritizes speed and operationalization of the board's distinctions. It *will* have blind spots:  

  1.  **Cases It Will Pass That Should Be Stopped:**  
      *   **"Therapeutic Misconception" in Practice:** A flawless form and documented process (passing Q4 & Q5) won't catch if patients *in the room* with their trusted doctor truly don't grasp it's research, not personalized therapy. Relies on Q5 flags or post-approval monitoring.
      *   **Subtle Coercion in Nuanced Relationships:** If a threat to entitlements is very subtle or implied by culture/clinic dynamics (not documented), Q2 may miss it.
      *   **Exploitation Masked as Benefit:** A study offering a desperately needed but wildly inadequate benefit to a vulnerable group (e.g., $20 for high-risk study in extreme poverty) might pass Q3 ("low payment") but still be exploitative. Requires reviewer vigilance at Q3.

  2.  **Cases It Will Stop That Should Pass:**  
      *   **Justifiable High Payment:** A complex, high-burden study *validly requiring* high compensation (e.g., prolonged ICU monitoring in healthy volunteers) might get unnecessarily stalled at Q3 ("Stop & Refer") even if the inducement is not undue *for the specific context*.
      *   **Benign Deception with Perfect Disclosure:** A study withholding a minor, non-core detail (e.g., specific brand of comparator) with full upfront disclosure *about the withholding* (passing Q4c) might still get flagged unnecessarily by overly cautious reviewers at Q4.

  3.  **Distinctions It Flattens:**  
      *   **Baseline for Coercion (Q2):** It forces the *entitled baseline* but cannot resolve the inherent ambiguity in defining "entitlement" in complex healthcare systems. It pushes this to a value judgment.
      *   **Moral vs. Legal Validity:** It primarily ensures *legal* validity (Q1, Q4 core elements) and incorporates key *moral* concerns (coercion, undue inducement, deception, process fairness). However, a consent could be legally valid but morally deficient (e.g., legally competent person agreeing due to untreated depression). Q5 Red Flag is the main catch-all.
      *   **Depth of Understanding:** It assesses *process* and *disclosure* adequacy (Q4, Q5), not the *actual* understanding achieved. "Hollow Consent" remains a risk.

  **Use this procedure as a structured first pass. Its strength is forcing clear stops on invalidity and surfacing value judgments. Its weakness is reliance on documented information and inability to capture all interpersonal nuance. Critical thinking and context remain essential; this tool channels them.**

  ---
  **Document End**
