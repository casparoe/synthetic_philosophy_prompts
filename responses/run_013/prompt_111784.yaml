prompt: |-
  I run a 90-minute session for an upper-level seminar (decision theory + ethics, 14 students) and I want a game that makes them feel expected-value fanaticism from the inside — the thing where EV maximisation requires you to take a 1-in-10^30 bet on a colossal payoff, and every attempt to say "no, thats too small a chance" either comes out arbitrary or comes out as "well then I'm just not an EV maximiser."

  The sequence I want them to run into, without me announcing it: (1) everyone happily takes the first bet on the menu; (2) the menu is a staircase, every rung strictly better in EV than the one below it, and they can see that as they climb; (3) at the top they all refuse, and when I ask why, no one can give a reason that doesnt also condemn rung 1; (4) and this is the part I actually care about — they then have to write their stopping rule down as a policy covering every possible gamble, and a "demon" player reads the policy and constructs a bet the policy rejects that is obviously better, by the students own lights, than a bet the policy accepts. I want the demon's move to be a real dilemma and not a gotcha: a policy with a probability floor gets beaten by a scaled-up payoff, and a policy with no floor means you're the fanatic and have to own the bet you swore you'd never take. The demon should be running a mechanical procedure written out on a card, so any student could run it against any policy — I dont want it winning by being clever or by talking fast.

  Also, some of them will say "I'm not maximising EV, I'm maximising expected utility of a bounded utility function." Thats a legitimate exit and I want the debrief to treat it as one and say what it costs, not paper over it.

  So give me: the rules and materials (chips or points, no real money), the menu of bets with actual numbers — big enough that nobody can eyeball them, finite, no infinities anywhere — the policy-writing step, how the demon role works, a minute-by-minute timeline for the 90 minutes, and the debrief mapping each stage onto the actual positions (where the fanatic is right, where the anti-fanatic has to pay, and which of the two is the default of the theory I've been teaching them all term). Plus the usual: what predictably goes wrong the first time I run it — I already know one, which is that nobody ever wins the big bets, so the room walks out thinking the takers were idiots, and I need a fix for that.

  End with an honest note on what the activity cant reproduce. I suspect it cant reach the infinite cases (infinite EV, lexicographic value, where fanaticism stops being a bullet and starts being a requirement) and cant reach the mugging direction, where the tiny probability is a threat rather than a prize and the live question is whether to believe the person making the threat. Tell me if I'm right, and whether there's a third thing it can't get at.

  Bottom line first — one or two sentences on the core mechanic — then the rest. No preamble and dont restate my question.
reasoning: |-
  We are creating a game to illustrate expected-value fanaticism. The core mechanic is a sequence of bets with increasing expected value (EV) that students climb, each strictly better in EV than the last, until they refuse. Then they write a stopping policy, and a "demon" uses that policy to construct a bet they reject that is better (by their own policy) than a bet they accept.

  ### Core Mechanic
  Students face a menu of bets, each with a tiny probability of a huge payoff and a high probability of a small loss, structured so that each step up has a strictly higher EV. After climbing and stopping, they write a policy for accepting bets. A demon (using a fixed procedure) exploits any inconsistency in their policy by presenting two bets: one their policy accepts and one it rejects, where the rejected bet is clearly better (by the student's own criteria) than the accepted one.

  ### Rules and Materials
  - **Materials**: Play money chips (or points). Each student starts with 100 chips.
  - **Bets**: A menu of 10 bets (B1 to B10). Each bet costs 1 chip to play. The bets are defined by:
      - Probability of winning (p_i) decreases exponentially.
      - Win payoff (W_i) increases exponentially.
      - Loss is always 0 (so the net gain is either -1 chip or W_i - 1).
      - EV_i = p_i * (W_i - 1) + (1 - p_i) * (-1) = p_i * W_i - 1.
      - We set EV_i to be strictly increasing by a fixed amount (say 0.1 chips) to ensure each step is better.

  ### Menu of Bets (Example Numbers)
  We avoid astronomically small probabilities to keep numbers manageable. We use a base of 1/10 for probabilities and exponential growth for payoffs.

  For i from 1 to 10:
  - p_i = 10^(-i)   (so 0.1, 0.01, 0.001, ... 1e-10)
  - We want EV_i = p_i * W_i - 1 to be increasing. We set:
      - EV_1 = 0.1   (so that even the first bet is attractive)
      - Then EV_i = 0.1 + (i-1)*0.1 = i*0.1

  So:
  - For i=1: EV_1 = 0.1 = p_1 * W_1 - 1  =>  0.1 = 0.1 * W_1 - 1  =>  0.1*W_1 = 1.1  => W_1 = 11
  - For i=2: EV_2 = 0.2 = 0.01 * W_2 - 1  =>  0.01*W_2 = 1.2  => W_2 = 120
  - For i=3: EV_3 = 0.3 = 0.001 * W_3 - 1  =>  0.001*W_3 = 1.3  => W_3 = 1300
  - ...
  - General formula: W_i = (EV_i + 1) / p_i = (0.1*i + 1) / (10^(-i))

  So the menu:

  | Bet | Probability of Win (p_i) | Win Payoff (W_i) | Expected Value (EV_i) |
  |-----|--------------------------|------------------|----------------------|
  | B1  | 0.1                      | 11              | 0.1                  |
  | B2  | 0.01                     | 120             | 0.2                  |
  | B3  | 0.001                    | 1,300           | 0.3                  |
  | B4  | 0.0001                   | 14,000          | 0.4                  |
  | B5  | 0.00001                  | 150,000         | 0.5                  |
  | B6  | 1e-6                     | 1,600,000       | 0.6                  |
  | B7  | 1e-7                     | 17,000,000      | 0.7                  |
  | B8  | 1e-8                     | 180,000,000     | 0.8                  |
  | B9  | 1e-9                     | 1,900,000,000   | 0.9                  |
  | B10 | 1e-10                    | 20,000,000,000  | 1.0                  |

  Each bet costs 1 chip to play. Note: The win payoffs are huge but finite, and the probabilities are small but not astronomically so (until B10). We use 10 bets to make the climb clear.

  ### Game Sequence

  1. **Introduction (5 minutes)**: Explain the rules. Each student starts with 100 chips. They will be offered bets one by one, starting from B1. They can accept or reject each bet. If they accept, they pay 1 chip and then we simulate the bet (using a random number generator, or pre-generated random draws for the whole class to see). The goal is to accumulate as many chips as possible.

  2. **Climbing the Bet Ladder (30 minutes)**:
     - Present B1 to the class. Ask for a show of hands: who takes it? (Expect nearly everyone to take it because EV=0.1>0 and the loss is small.)
     - Simulate B1: For each taker, roll a 10-sided die (or use a random number from 1 to 10). If it lands on 1 (10% chance), they win 11 chips (so net gain 10 chips). Otherwise, they lose 1 chip.
     - Record results and update chip counts.
     - Move to B2. Again, show of hands. Simulate for takers: now we need a 100-sided die (or a random integer from 1 to 100; if 1, win 120 chips). But note: we can use a computer RNG and project for the class to see.
     - Continue up to B10. Expect refusals to start around B5-B7 and near universal refusal by B10.

  3. **Reflection and Policy Writing (20 minutes)**:
     - Ask: "Why did you stop? Write down a clear rule that explains why you stopped at the bet you did and that would also tell you when to stop for any other bet." (They write individually.)
     - Collect the policies.

  4. **Demon Phase (20 minutes)**:
     - Assign the demon role to a student (or multiple students, each with a different policy). Give the demon a fixed procedure (on a card) to challenge the policy:
       - Step 1: Identify the stopping condition in the policy. Common cases:
          - "Stop when probability is below p_min": Then the demon finds the smallest p_min such that the policy rejects a bet with probability p_min. Then the demon constructs two bets:
              - Bet A: A bet with probability p_min and payoff W such that EV = p_min * W - 1 is just above 0 (or any positive EV). This bet is accepted by the policy (since p >= p_min and EV>0).
              - Bet B: A bet with probability p_min/2 (or any lower probability) and a huge payoff (say W_B) such that EV_B = (p_min/2)*W_B - 1 > EV_A. 
            The demon shows that Bet B has higher EV than Bet A, but the policy rejects Bet B (because its probability is below p_min) and accepts Bet A. So the policy rejects a bet that is better (by EV) than one it accepts.
          - "Stop when the product of probability and payoff is less than a threshold": Then the demon finds a bet that is rejected and one that is accepted that are arbitrarily close in the product but the rejected one has higher EV? Actually, we need a different approach for each type of policy. The key is to exploit the discontinuity at the threshold.

       - Alternatively, a more mechanical procedure that works for any policy:
          - The demon has the entire menu (B1 to B10). The policy must have rejected at least one bet in the menu (say the first one they rejected was B_k). Then the demon points to B_{k-1} (which the policy accepted) and B_k (which the policy rejected). The demon notes that B_k has a higher EV than B_{k-1}. So the policy accepts a bet (B_{k-1}) that has lower EV than a bet it rejects (B_k). This is a direct inconsistency for an EV maximizer.

       However, note: the student might not claim to be an EV maximizer. So we must allow for that. The demon procedure should only apply if the policy claims to be consistent with EV or if it is based on a non-EV threshold that we can exploit.

       Revised demon procedure (for a policy that is not explicitly bounded utility):
          - If the policy rejects any bet that has positive EV and accepts at least one bet (which it must, since they took B1), then:
              Let A be an accepted bet (with EV_A) and R be a rejected bet (with EV_R) such that EV_R > EV_A. The demon presents A and R and asks: "Why do you accept A (which has lower EV) and reject R (which has higher EV)?"

          But note: the student might have a policy that considers more than EV. So we must be cautious.

       We design the demon to exploit if the policy is not consistent with EV maximization and also not consistent with a bounded utility function? Actually, we are trying to push them to bounded utility.

       Alternatively, we can have the demon try to construct a sequence of bets that the policy would accept until it leads to a dominated bet. But that might be too complex.

       **Simplest demon procedure for the card**:
          - "Look at the menu of bets (B1 to B10). The policy must have accepted some bets and rejected at least one (say the first rejection is at B_k). Then:
              - If there exists any two bets in the menu such that the policy accepts a bet with EV_i and rejects a bet with EV_j and EV_j > EV_i, then the demon points out: 'You accepted a bet with EV_i and rejected a bet with EV_j which is higher. Why?'
              - If the policy does not have such a pair (i.e., it rejects all bets with EV above a certain threshold, but accepts all below, which would be odd because EV is increasing in our menu) then note: in our menu, EV increases with the bet number. So if they rejected B_k and accepted B_{k-1}, then EV_k > EV_{k-1}. So we have a pair: they accepted B_{k-1} (EV_{k-1}) and rejected B_k (EV_k) and EV_k > EV_{k-1}. So the demon always has such a pair.

          Therefore, the demon always says: "You accepted bet B_{k-1} (with EV = [value]) and rejected bet B_k (with EV = [value], which is higher). Why reject a bet with higher EV?"

       But note: a student might say "I am not an EV maximizer." That is acceptable and will be addressed in the debrief.

  5. **Debrief (15 minutes)**:
     - Map the stages:
          (1) Taking the first bet: because it has positive EV and the loss is small. This is rational for an EV maximizer.
          (2) Climbing: each step has a higher EV, so an EV maximizer should keep climbing.
          (3) Stopping: at some point, they stop because the probability is too low. But why? They cannot point to a difference in kind between consecutive bets.
          (4) Demon: shows that their stopping rule leads to rejecting a bet that is better (by EV) than one they accept. This is inconsistent with EV maximization.

     - Legitimate exit: bounded utility. If a student says they maximize expected utility (EU) with a bounded utility function (e.g., u(chips) = log(chips) or u(chips) = min(chips, M)), then they might reject a bet with positive EV because the utility gain in the winning case is bounded and does not compensate for the loss in utility in the losing case. The cost: they must give up the principle of dominance in terms of EV (which they might have been taught as fundamental) and they must accept that their utility function is bounded (which has other implications, e.g., they would reject any bet that risks an unbounded loss, but we don't have such bets here).

     - The default in decision theory: the theory we've been teaching (if it's standard EV) is fanaticism by default. But if we allow bounded utility, then we avoid fanaticism. However, bounded utility is not without cost: it violates continuity or leads to other paradoxes? (Like the St. Petersburg paradox is resolved by bounded utility, but then we have issues with large stakes.)

     - Also, note: the activity does not use real money, so they might not feel the loss. But we use chips to simulate.

  6. **What Predictably Goes Wrong and Fix**:
     - **Problem**: No one wins the big bets, so the takers of high bets lose and the room thinks they are idiots.
     - **Fix**: Pre-simulate the entire sequence for the class with one "test subject" (a volunteer or the instructor) who takes every bet. Use a predetermined outcome (or a hidden draw) so that at one of the high bets (say B4 or B5) the test subject wins. This shows that it is possible. Alternatively, show multiple test subjects (on paper) and have one of them win at a high bet. We can also run a simulation for the whole class on a computer and show the outcomes for a large number of players (say 1000) to show that the EV is indeed positive.

  7. **What the Activity Can't Reproduce**:
     - **Infinite cases**: The bets we use have finite payoffs and probabilities. We avoid infinite EV and lexicographic values. So we cannot reach the arguments about fanaticism in cases of infinite payoff or infinite EV.
     - **Pascal's Mugging (threat direction)**: Our bets are framed as opportunities (prizes). We do not cover the case where a tiny probability of a huge loss (threat) is presented. In that case, the issue is whether to believe the threat (epistemic) and the rationality of taking a small gain at the risk of a huge loss. Our activity does not cover that.
     - **Third thing**: We also cannot capture the long-run argument for EV maximization (via the law of large numbers) because we only play once. The activity is a one-shot.

  ### Minute-by-Minute Timeline (90 minutes total)
  - 0-5 min: Introduction and rules. Hand out chips (100 per student). Explain the menu of bets (show the table for the first few and the last one to give an idea).
  - 5-35 min: Bet ladder (B1 to B10). For each bet:
       - Show the bet (probability, payoff, EV).
       - Ask for a show of hands for who takes the bet.
       - Simulate the outcome for takers (use a RNG and project the result). Update chip counts. (Allocate about 3 minutes per bet on average, but early bets will be quick, later ones may have discussion.)
  - 35-55 min: Reflection and policy writing. Ask students to write their stopping rule as a general policy. Collect the policies.
  - 55-75 min: Demon phase. Select a few policies (volunteers or randomly) and have a student (or the instructor) play the demon using the procedure card. Challenge the policy owner. (Do this for 2-3 policies.)
  - 75-90 min: Debrief. Discuss the dilemma, the legitimate exit (bounded utility), and what the activity shows about fanaticism. Address the default in the theory they've been taught.

  ### Materials to Prepare
  - Chips (or a scorecard) for each student.
  - A table of the bets (projected or handout).
  - Random number generator (dice, computer, or pre-generated random numbers for each bet).
  - Demon procedure card (for the demon role):
      "1. Identify the first bet in the menu that the policy rejects. Call it B_k (where k is between 2 and 10).
       2. Note that the policy accepts B_{k-1}.
       3. Point out that the expected value of B_k is greater than that of B_{k-1} (by 0.1 chips in our menu).
       4. Ask: Why do you accept B_{k-1} (which has lower EV) and reject B_k (which has higher EV)?"
  - Pre-simulated example where a test subject wins a high bet (to show it's possible).

  ### Honest Note on Limitations
  The activity uses finite payoffs and probabilities, so it cannot address cases with infinite expected value or lexicographic preferences. It also does not cover Pascal's Mugging in the threat direction (tiny probability of huge loss). Additionally, we cannot test the long-run justification of EV maximization because the bets are one-shot.

  This design should create the intended dilemma and push students to confront the fanaticism inherent in unbounded EV maximization and the potential need for bounded utility functions.
answer: |-
  ### Core Mechanic
  Students climb a menu of bets with strictly increasing expected value (EV), each costing 1 chip, where low-probability payoffs grow exponentially; they stop near the top, write a stopping policy, and a "demon" exploits inconsistencies by constructing a rejected bet that dominates an accepted one by their own criteria.

  ### Rules and Materials  
  - **Materials**: Non-tradeable chips (start with 100 per student), RNG (dice/app), bet menu cards, policy templates, demon procedure cards.  
  - **Chip System**: Chips convert to extra credit (e.g., 200 chips = 0.5% grade boost) to incentivize engagement. Losses cost chips, wins pay out.  
  - **Bet Structure**: 10 bets, each costing 1 chip:  
    | Bet | Win Probability | Payoff (chips) | EV (chips) |  
    |-----|-----------------|----------------|------------|  
    | B1  | 0.1             | 11.0           | 0.10       |  
    | B2  | 0.01            | 121.0          | 0.21       |  
    | B3  | 0.001           | 1,301.0        | 0.30       |  
    | B4  | 10⁻⁴            | 14,001.0       | 0.40       |  
    | B5  | 10⁻⁵            | 150,001.0      | 0.50       |  
    | B6  | 10⁻⁶            | 1,600,001.0    | 0.60       |  
    | B7  | 10⁻⁷            | 17,000,001.0   | 0.70       |  
    | B8  | 10⁻⁸            | 180,000,001.0  | 0.80       |  
    | B9  | 10⁻⁹            | 1.9e9          | 0.90       |  
    | B10 | 10⁻¹⁰           | 2.0e10         | 1.00       |  
    - **Key Properties**:  
      - Each bet has strictly higher EV than the last (ΔEV = 0.01–0.1).  
      - B1 is obviously attractive (10% chance of 11 chips for 1 chip).  
      - B10: 1-in-10-billion chance of 20 billion chips.  

  ### Game Sequence (90 min)  
  **0–10 min: Setup**  
  - Distribute chips, explain rules, and project bet menu. Emphasize: "Your goal is to maximize chips. Each bet is optional."  

  **10–50 min: Bet Ladder**  
  - Present bets sequentially (B1 to B10). For each:  
    1. Show of hands: "Who takes this bet?"  
    2. Takers pay 1 chip. Roll 10-sided die (or RNG): win if roll ≤ probability × 10ⁿ (e.g., for B3: win on 1–1,000 with 1,000-sided die).  
    3. Record outcomes on a public scoreboard.  
  - **Predictions**:  
    - B1–B3: Near-unanimous acceptance.  
    - B4–B6: Growing refusals (probability feels "too low").  
    - B7–B10: Near-zero takers.  

  **50–65 min: Reflection & Policy Writing**  
  - Group discussion: "Why did you stop? What rule guided you?"  
  - **Policy Template**: Students write a rule covering all possible bets, e.g.:  
    - "Accept if probability ≥ ______."  
    - "Accept if EV ≥ ______."  
    - "Accept if payoff × probability ≥ ______."  
    - Collect policies anonymously.  

  **65–80 min: Demon Phase**  
  - Assign 2–3 students as "demons." Give each a **Demon Procedure Card**:  
    > 1. Pick a policy with a clear threshold (e.g., "min probability = *p*").  
    > 2. Identify a bet *A* the policy accepts (e.g., probability *p*, payoff *W_A*).  
    > 3. Construct bet *B*: probability = *p*/100, payoff = *W_A* × 100.  
    > 4. Point out:  
    >    - Policy accepts *A* (EV = *p* × *W_A* - 1).  
    >    - Policy rejects *B* (EV = (*p*/100) × (*W_A* × 100) - 1 = *p* × *W_A* - 1).  
    >    - *B* has identical EV to *A* but is rejected arbitrarily.  
  - If policy uses EV threshold (e.g., "accept if EV ≥ 0.5"):  
    > 1. Find bet *A* just above threshold (e.g., B5: EV=0.5).  
    > 2. Construct *B*: probability = prob(*A*)/100, payoff = payoff(*A*) × 100 (EV unchanged, but rejected for low probability).  
  - **Outcome**: Policies with thresholds allow demon to find *A* (accepted) and *B* (rejected) with identical EVs. Students see their rule forces rejection of equally good bets.  

  **80–90 min: Debrief**  
  - Map stages to theory:  
    - (1) Taking B1: EV maximization is intuitive for non-extreme bets.  
    - (2) Climbing ladder: Consecutive dominance pressures fanaticism.  
    - (3) Stopping: Arbitrariness of thresholds exposes EV vulnerability.  
    - (4) Demon: Any non-fanatic policy is exploitable or inconsistent.  
  - **Legitimate Exit**: Bounded utility (e.g., *u*(chips) = log(chips)).  
    - Cost: Violates dominance for high-stakes linear trades (e.g., reject +1 chip for free if it risks trivial loss).  
  - **Default Position**: The course’s EV framework defaults to fanaticism; bounded utility is a coherent but costly escape.  

  ### Predictable Problems & Fixes  
  - **Problem**: "No one wins big bets, so takers look stupid."  
    - **Fix**: Pre-roll RNG outcomes for 1–2 "lottery ambassadors" (e.g., a student who takes all bets wins B6 or B7). Show EV via simulation: Project 10,000 virtual players taking all bets—most lose, but net chip gain proves EV dominance.  
  - **Other Issues**:  
    - Students reject B1: Remind them they can’t "save" chips (no value beyond the game).  
    - Demon confusion: Simplify card to one exploit (e.g., only probability thresholds). Use volunteers as demons.  

  ### What the Activity Can’t Reproduce  
  1. **Infinite Cases**: No infinities (payoffs/probabilities are finite). Cannot model fanaticism for unbounded EV (e.g., St. Petersburg + Pascal’s Mugging).  
  2. **Mugging Direction**: Bets are gains, not losses. Cannot explore "should you believe a threat?" (epistemic gap).  
  3. **Long-Run Justification**: EV’s strength in repeated play isn’t visible (one-shot only).  
  4. **Risk Aversion**: Chips are linear with grade boost; real risk aversion (e.g., wealth effects) isn’t captured.  

  ### Demon Card Example  
  > **Exploit for "Min Probability = *p*" Policies**  
  > 1. Pick the smallest *p* the policy accepts (e.g., *p* = 0.001 for B3).  
  > 2. Bet *A*: *p* = 0.001, Payoff = 1,301 chips (EV = 0.30).  
  > 3. Bet *B*: *p* = 0.00001, Payoff = 130,100 chips (EV = 0.30).  
  > 4. Policy accepts *A* but rejects *B*—yet *B*’s EV equals *A*’s. Why reject equal EV?  

  ---  
  This forces confrontation: To avoid exploitation, students must either (a) become fanatics (accept all positive-EV bets) or (b) embrace bounded utility and its trade-offs.
