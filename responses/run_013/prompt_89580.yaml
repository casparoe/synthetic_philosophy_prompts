prompt: |-
  I serve as rapporteur to a citizens' assembly convened to recommend a statutory scheme on assisted dying, and next week the chair rules on whether one further submission enters our deliberative record. Our only guidance is our own practice, and five rulings make it up.

  We refused a submission from a coalition of clergy urging that assisting a suicide remain a criminal offence. Its sole premise was that life is a trust held from God and that the civil law ought to mirror divine law; nothing else was offered in support of it. It was launched at a press conference at which its authors described members who disagreed with them as answerable to a higher authority and questioned whether the assembly had any standing to speak for the public at all.

  We admitted a submission from a network of hospice chaplains supporting a permissive, tightly safeguarded scheme. It argued from a theology of accompaniment, but it also set out at comparable length the evidence from jurisdictions that have legalised and an argument from the state's duty to protect the vulnerable; its authors agreed to appear and be questioned.

  We admitted a brief from a coalition of palliative care physicians, containing no religious content, urging that any scheme be confined to terminal illness and enforced by criminal penalty.

  We refused a submission from a federation of congregations urging that doctors be forbidden, on pain of professional and criminal sanction, from raising assisted dying with patients. Its grounds were entirely religious, it offered no public argument, and it arrived alongside a campaign against the assembly.

  We admitted a submission from a religiously observant nurse writing in a personal capacity, who urged that any scheme be paired with a large expansion of funded palliative care, arguing partly from her tradition's teaching about patience and partly from her own clinical experience of patients who changed their minds.

  The new submission. A coalition of congregations from three traditions urges us to recommend that assisting a suicide remain a criminal offence carrying a substantial custodial sentence. It is offered quietly and in good faith; its authors have asked to appear and be cross-examined; they have undertaken to accept whatever we recommend; and no campaign accompanies it. Its argument has two parts. The first, which the submission itself calls the ground of its conclusion, is that life is a trust from God that no one may surrender. The second, which it describes as confirming the first, is a developed public argument: evidence about the pressure that legalisation places on the ill and the old, the record of safeguards in jurisdictions that have adopted it, and the state's duty to protect those who cannot protect themselves.

  What I want. I do not need your view on assisted dying itself; I need the ruling. Set out the rules our five rulings are jointly consistent with — I suspect there is more than one, since the cases never seem to pull them apart — and say what each predicts here. Then give me your best guess, with your reasons, and name the precedent that is the closest analog and why. Tell me what principle we would be adopting if we admit the submission and what principle we would be adopting if we refuse it. And tell me what further submission would most cleanly separate the rule we are actually running from the ones that merely happen to fit our record, and how each of them would decide it.
reasoning: |-
  Hmm, the user is a rapporteur for a citizens' assembly on assisted dying, and needs help determining whether to admit a new submission based on their past rulings. They've provided five precedents and details about the new submission. They want me to identify consistent rules from their past decisions, predict the outcome for this case, and provide a reasoned recommendation.

  First, let's analyze the five precedents:

  1. Refused: Coalition of clergy submission opposing assisted dying. Rejected because:
     - Solely religious premise (life as divine trust)
     - No public arguments offered
     - Hostile presentation (questioning assembly's legitimacy)
     
  2. Admitted: Hospice chaplains supporting assisted dying. Accepted because:
     - Combined theological arguments with secular evidence (jurisdictional data, state duty)
     - Offered to engage with the assembly

  3. Admitted: Palliative care physicians. Accepted because:
     - Secular content only (medical perspective)
     - Specific policy recommendations

  4. Refused: Federation of congregations opposing doctor-initiated discussions. Rejected because:
     - Purely religious grounds
     - No public arguments
     - Part of hostile campaign

  5. Admitted: Religiously observant nurse (personal capacity). Accepted because:
     - Combined religious perspective with clinical experience
     - Constructive policy suggestion (linking to palliative care expansion)

  The patterns emerging are:
  - Submissions relying solely on religious doctrine were rejected (Cases 1 & 4)
  - Submissions combining religious and secular arguments were admitted (Cases 2 & 5)
  - Purely secular submissions were admitted (Case 3)
  - Hostility toward the assembly led to rejection (Cases 1 & 4)
  - Willingness to engage was favorable (Cases 2 & 5)

  Now for the new submission:
  - Coalition of congregations opposing assisted dying
  - Combines religious argument (life as divine trust) with developed public arguments (evidence on pressures, safeguard failures, state duty)
  - Submitted respectfully, no campaign, willing to engage
  - Explicitly states both arguments are integral

  I need to articulate consistent rules from the precedents. The core principle appears to be that submissions must include secular reasoning to be admissible - religious arguments alone are insufficient, but religious perspectives combined with evidence-based arguments are acceptable. The tone and engagement matter too - hostile submissions were rejected regardless of content.

  For the new case:
  - Rule 1 (Content-only): Would admit because it contains developed public arguments alongside religious ones
  - Rule 2 (Content + conduct): Would also admit due to good-faith presentation and willingness to engage

  The closest precedent is Case 2 (hospice chaplains), which combined theology with secular evidence and was admitted. Case 1 is distinguishable because that submission lacked any secular arguments.

  If admitted, the assembly would be affirming that religious perspectives are welcome when they engage with public policy discourse. If rejected, it might suggest they're excluding certain viewpoints regardless of argument quality - which doesn't match their past pattern.

  To test the rules, I should propose hypothetical submissions that would distinguish between possible interpretations. For example, a purely secular submission opposing assisted dying respectfully would be admitted under all rules, while a respectful but purely religious submission would test whether content alone determines admissibility.

  My recommendation is to admit this submission. It meets the criteria established in Case 2 by blending religious perspective with substantive policy arguments, and the respectful conduct aligns with the engagement valued in Cases 2 and 5.
answer: |-
  Based on your five rulings, I identify two consistent rules that explain all precedents. Both rules would admit the new submission, but they rest on slightly different principles. Below is my analysis, prediction, recommendation, and test for future clarity.

  ### I. Consistent Rules from Precedents
  **Rule 1: The Balanced Content Standard (Stronger Fit)**  
  *Submissions are admissible if they either:*  
  - *(a) Offer substantive non-religious policy arguments (regardless of religious content), OR*  
  - *(b) Combine religious perspectives with developed public policy reasoning.*  
  *Hostility toward the assembly or its members is disqualifying.*  

  **Rule 2: The Engagement + Substance Standard**  
  *Submissions are admissible if they:*  
  - *(a) Provide non-religious policy arguments OR integrate religious views with public reasoning, AND*  
  - *(b) Demonstrate good-faith engagement (willingness to testify, no hostility/campaigns).*  
  *Pure religious doctrine without public argument is inadmissible.*  

  **How the Precedents Fit Both Rules:**  
  | **Case** | **Content** | **Conduct** | **Outcome** | **Rule 1** | **Rule 2** |  
  |----------|-------------|-------------|-------------|------------|------------|  
  | Clergy Coalition | Pure religious doctrine | Hostile campaign | Refused | ❌ (No public argument) | ❌ (Hostility + no argument) |  
  | Hospice Chaplains | Theology **+ evidence/policy** | Cooperative | Admitted | ✅ (Public argument) | ✅ (Argument + engagement) |  
  | Physicians | Secular policy only | Neutral | Admitted | ✅ (Public argument) | ✅ (Argument) |  
  | Congregations Fed. | Pure religious doctrine | Hostile campaign | Refused | ❌ (No public argument) | ❌ (Hostility + no argument) |  
  | Relig. Nurse | Theology **+ clinical experience** | Cooperative | Admitted | ✅ (Public argument) | ✅ (Argument + engagement) |  

  **Key Overlap:** Both rules require *some form of public policy argument* and exclude hostility. Rule 1 is stricter on content; Rule 2 adds conduct as a co-requisite.

  ---

  ### II. Prediction for the New Submission
  - **Rule 1 Predicts:** **Admit**. The submission offers a "developed public argument" (evidence on pressure/safeguards, state duty) alongside religious claims.  
  - **Rule 2 Predicts:** **Admit**. It provides public policy arguments *and* exemplary conduct (good faith, no campaign, willingness to testify).  

  **Closest Precedent:** **Hospice Chaplains (Case 2)**. Both:  
  - Combine theological premises ("trust from God" vs. "theology of accompaniment") with secular policy arguments.  
  - Offer comparable depth in public reasoning.  
  - Volunteer for cross-examination.  
  - Avoid hostility.  

  **Distinguishing from Refused Cases:** Unlike the Clergy Coalition (Case 1) or Congregations Federation (Case 4), this submission provides extensive non-religious reasoning and lacks adversarial conduct.

  ---

  ### III. Recommendation & Reasoning  
  **Ruling: ADMIT the submission.**  
  **Why:**  
  1. **Fits Core Practice:** Your assembly consistently admits submissions blending religious perspectives with evidence-based policy arguments (Hospice Chaplains, Religiously Observant Nurse). This submission mirrors that structure.  
  2. **Public Argument Threshold Met:** The "developed public argument" (safeguard failures, vulnerability pressures) stands independently of the religious premise, satisfying the standard set by Case 2 and Case 5.  
  3. **Conduct Aligns with Cooperative Precedents:** Willingness to testify and absence of hostility/campaigns matches admitted Cases 2 and 5, contrasting with refused Cases 1 and 4.  
  4. **Avoids Viewpoint Discrimination:** Rejecting this would imply religious groups must *support* assisted dying to be heard—contradicting the admission of the opposing Hospice Chaplains.  

  **Principle if Admitted:**  
  > *Religious perspectives are admissible when integrated with substantive, secular policy analysis and offered in good faith.*  

  **Principle if Refused:**  
  > *Religious opposition to assisted dying is inadmissible even with policy arguments, creating a double standard favoring religious supporters.* (This would conflict with Case 2.)  

  ---

  ### IV. Test to Clarify the Actual Rule  
  To distinguish between Rule 1 (content-focused) and Rule 2 (content + conduct), propose this hypothetical submission:  
  > *A secular ethics group submits a brief opposing assisted dying, citing only philosophical arguments about the sanctity of human life (no religious claims). They refuse to testify and call the assembly "dangerously misguided," but include robust evidence from jurisdictions with legalization.*  

  - **Rule 1 (Content-Only) Would ADMIT:** It offers "substantive non-religious policy arguments" (evidence). Hostility is irrelevant.  
  - **Rule 2 (Engagement + Substance) Would REFUSE:** Hostility disqualifies it (like Cases 1/4), regardless of content.  
  - **Your Actual Practice?** If you refuse this hypothetical, Rule 2 governs. If admitted, Rule 1 governs. Currently, **Rule 1 is stronger** (physicians’ secular brief admitted without mention of conduct).  

  **Final Note:** Admission here reinforces neutrality. As rapporteur, emphasize that the *weight* given to religious arguments in deliberations remains distinct from *admissibility*.  

  ---  
  Let me know if you need further dissection of the public argument threshold or deliberation strategies for the assembly.
