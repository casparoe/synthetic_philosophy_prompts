  - **Bindingness verdict**: Partial. Your norms can penalize groups (e.g., fining a team), but true *group* answerability (e.g., "the team owes an apology") isn’t individual-centric.  
  - **First-person plural perspective verdict**: Pure residue for group subjectivity (e.g., "the team feels responsible").  
  - **Translation resistance reason**: Missing primitive (group agents as ontologically basic). The claim doesn’t presuppose an unexplained "we"—it argues groups can be agents like individuals.  

