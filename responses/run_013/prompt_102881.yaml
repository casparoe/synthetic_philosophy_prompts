  - **Clean map**: **Groups as agents** map to treating teams as nodes in protocols (e.g., with shared inboxes); **attitudes** to shared state; **responsibilities** to group-level norms.  
  - **Distorted map**: Group "attitudes" (e.g., beliefs) can be modeled via **consensus protocols**, but this distorts if they’re seen as *irreducible* (e.g., "the team believes P" isn’t just majority belief).  
