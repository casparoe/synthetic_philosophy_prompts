  - **First-person plural perspective verdict**: Pure residue. The subjective shift to "thinking as we" (e.g., internalizing team identity) is experiential.  
  - **Translation resistance reason**: Missing primitive (irreducible group-level reasons). The claim resists reduction, but doesn’t presuppose an unexplained "we"—it argues we-mode is a cognitive switch.  

