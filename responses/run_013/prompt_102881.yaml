  ### Closing: Adding Joint Commitment as Primitive

  **What would it be?**  
  A joint commitment would be a new primitive in the protocol: a commitment that is created by a group of agents together (via a consensus protocol) and that binds them collectively. It would exist as a distinct object in the system, with properties like:
  - It is owned by the group as a whole.
  - Violations are not just by an individual against others but against the group.
  - It can have a state (e.g., active, fulfilled, violated) and can be referenced by the group.

  **What would it cost?**  
  - **Protocol Design**: 
    - You would need to define how joint commitments are created, modified, and terminated. This might require a new consensus protocol for commitment management.
    - You would have to handle the representation of the group as a distinct entity in the system, which might complicate agent identities and message passing.
    - Existing protocols that rely on individual commitments might break if they are replaced by joint commitments.

  - **Verification**:
    - Verification would become more complex because you now have to reason about group-level properties and the state of the joint commitment. Model checking would have to account for the group entity.
    - You might lose some compositionality: currently, you can verify individual agents and their interactions, but now you have a group-level state that is not reducible.

  - **What Breaks?**:
    - If you currently assume that all commitments are between individuals, then tools that reason about commitments would need to be extended.
    - Enforcing joint commitments would require mechanisms that can hold the group accountable, which might be at odds with individual accountability.
    - The system might become less flexible because joint commitments are more rigid than individual ones.

  In essence, you would gain the ability to model collective responsibility and group-level norms directly, but at the cost of increased complexity and potential loss of modularity in design and verification.
