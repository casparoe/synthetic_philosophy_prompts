  ### 2. Interlocking Individual Intentions

  **Position Restatement**:  
  This view says that a shared intention is nothing more than a structure where each agent has individual intentions (e.g., "I intend to do my part"), plans that mesh, and common knowledge of these intentions and plans. In your terms: shared state (common knowledge of the goal and plans), message passing to establish that common knowledge, and explicit commitments (as protocol objects) that represent the individual intentions and their interdependence.

