  ### 4. We-Mode vs. I-Mode

  **Position Restatement**:  
  Acting in the we-mode means that an agent acts for group reasons that are not just the sum of individual reasons. The agent takes the group's perspective and is motivated by what is good for the group. In I-mode, the agent acts for individual reasons. In your terms, we-mode might involve an agent having a goal that is labeled as a group goal and using a distinct decision process that consults group-level state and norms, not just individual utility.

  **Residue Report**:

  - **Clean Map**: 
