  2. **Interlocking Individual Intentions**: Shared intention is a suitable interlocking structure of individual intentions, plans, and common knowledge, with no additional ingredient.

  3. **Joint Commitment and Plural Subject**: Genuinely shared action requires a joint commitment that constitutes a new normative subject (a plural subject) with obligations and entitlements.

  4. **We-Mode vs. I-Mode**: The contrast is between acting in a we-mode (with group reasons that are not merely aggregated individual reasons) and acting in an I-mode.

