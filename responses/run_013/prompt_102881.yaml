  1. **Bindingness of joint commitment**: Is there a counterpart to the idea that a participant is answerable (not just predictably cooperative) in the user's systems?
  2. **First-person plural perspective**: Can the subjective experience of being part of a "we" be expressed in terms of agents and messages?
  3. **Reason for resistance to translation**: Is it due to a missing primitive or because the claim presupposes an unexplained "we"?

  Finally, we are to consider what it would take to add the missing primitive (joint commitment) and what it would cost.

  Let's address each position in turn.

  ---

  ### 1. Primitive We-Intending

