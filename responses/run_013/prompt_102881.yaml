  - **Clean map**: **Joint commitments as explicit objects** and **norms for enforcement** map directly.  
  - **Distorted map**: The "plural subject" can be *approximated* as a group ID in shared state, but this distorts it—your groups are aggregates, not emergent entities with obligations.  
