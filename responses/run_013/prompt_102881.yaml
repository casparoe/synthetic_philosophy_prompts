  ### 3. Joint Commitment and Plural Subject

  **Position Restatement**:  
  Genuine shared action requires a joint commitment that creates a new entity: a plural subject. This joint commitment is not just the sum of individual commitments; it creates obligations and entitlements that bind the group as a whole. In your terms, this would be like a global commitment object that is created by a consensus protocol and that exists as a distinct entity in the system. It is not just the aggregation of individual commitments but a new object that imposes norms on the participants and can have its own state.

