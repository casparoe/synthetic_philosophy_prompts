  ### Restatement of Positions in Your Vocabulary

  #### 1. **Primitive We-Intending**  
  *Restatement*: This view claims that an agent's cognitive architecture includes a basic "we-intend" state as a primitive, irreducible component. This is not built from individual intentions (e.g., "I intend to do X") plus beliefs about others (e.g., "I believe you intend to do Y"). Instead, it's a fundamental mode, like a built-in protocol for joint action. In your terms, this would be akin to an agent having a **shared goal** as an atomic, undecomposable object in its local state, initialized without requiring message passing, consensus, or common knowledge. It’s a biologically hardwired "joint action module" that directly outputs coordinated behavior.

  #### 2. **Interlocking Individual Intentions**  
  *Restatement*: Shared intention is entirely reducible to a network of individual states and their relations: each agent has an individual intention (e.g., "I intend to perform my role"), a plan meshing with others, and **common knowledge** of these intentions and plans. No "group mind" or irreducible "we" exists—it’s just a stable equilibrium of individual commitments. In your systems, this maps to agents achieving **eventual consistency** on a shared goal via **message passing** (e.g., broadcasting intentions) and enforcing **norms** (e.g., penalties for deviation) to maintain alignment. The structure is verifiable through causal chains of individual actions.

  #### 3. **Joint Commitment and Plural Subject**  
  *Restatement*: Genuine shared action requires a **joint commitment**—an explicit, mutually agreed-upon protocol object that binds agents into a *plural subject*. This commitment creates a new entity with emergent obligations/entitlements (e.g., "we owe each other compliance"). It’s not just interlocking intentions; it’s a distinct **normative subject** that enforces **commitments** at the group level. In your terms, this would be a **consensus protocol** outputting a shared commitment object that exists independently of individual agents, with norms that enforce group-level accountability (e.g., "the team is liable for failures").

  #### 4. **We-Mode vs. I-Mode**  
  *Restatement*: Acting in "we-mode" means agents operate under **group reasons** that are not aggregates of individual preferences. For example, an agent might prioritize a team goal ("we must win") over private interests ("I want to rest"). In your vocabulary, this is like agents having a **shared state** (the group’s goal) that overrides local state during decision-making, enforced by **norms** (e.g., rewards for team-oriented actions). "I-mode" is standard individual optimization. The key is that we-mode reasons are *sui generis*—not derivable from I-mode reasoning.

  #### 5. **Group as Agent**  
  *Restatement*: The group itself is an agent, with its own attitudes (e.g., beliefs, desires) and responsibilities. This isn’t metaphorical—it’s an agent in the formal sense, with **shared state** representing collective attitudes and **consensus protocols** for group decisions. Responsibilities (e.g., "the team must deliver") attach to the group entity, not individuals. In your systems, this would require treating the group as a first-class agent in protocols, with its own message inbox, commitment objects, and norms for collective accountability.

  ---

  ### Residue Report for Each Position  
  *Guidelines*:  
  - **Clean map**: Directly expressible with your primitives (e.g., shared state, commitments as objects).  
  - **Distorted map**: Expressible only by stretching your concepts (e.g., misusing "common knowledge" to imply group identity).  
