  - **Translation resistance reason**: Missing primitive (the group as a normative entity). The claim isn’t circular—it argues this emerges from commitments—but your framework lacks the ontology to represent it.  

  #### 4. We-Mode vs. I-Mode  
  - **Clean map**: **Group reasons** map to shared state (e.g., a global goal variable); **norms** enforce we-mode actions.  
