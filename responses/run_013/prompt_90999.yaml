  ### Step-by-Step Diagnosis
  The argument hinges on step (3): "A doctrine whose acceptance is fully explained by the position of its holders in a process the doctrine itself describes cannot be accepted on its merits; the explanation of the belief displaces the evidence for it." This step is the core of the self-undermining claim for cyclical theories, but it fails because it equivocates on what it means for acceptance to be "fully explained" by a position. Specifically, it conflates two distinct ideas:
  - **Explanation as causal determination**: The position in the cycle (e.g., a decline phase) causes belief in the cyclical theory, regardless of evidence. If acceptance is "fully explained" this way, it means the belief would arise even in the absence of evidence or if the evidence were different.
  - **Explanation as enabling evidence access**: The position facilitates access to evidence that supports the belief. For instance, being in a phase of decline might make historical patterns of repetition more visible and empirically grounded.

  Step (3) assumes the first interpretation (causal determination) for cyclical theories, implying that belief is mechanistically produced by the cycle, displacing any role for evidence. But this is not necessarily true for cyclical views. A cyclical theory could be true, and its acceptance at a certain phase could involve genuine engagement with evidence (e.g., historical data showing repeated patterns). The phase might make societies more receptive to this evidence, but the belief could still be based on its merits—meaning it is supported by reasons and empirical justification. In this case, the explanation by position does not "displace" evidence; it coexists with it.

  For example, Ibn Khaldun's theory of dynastic cycles could be accepted because scholars in a decline phase observe and analyze historical records, finding robust evidence for cyclical patterns. The phase explains why they focus on this evidence now, but it doesn't negate that their belief is evidence-based. Step (3) ignores this possibility by treating "fully explained" as implying that evidence is irrelevant, which is an overgeneralization.

  **Why step (3) looks fine initially**: Step (3) appears uncontroversial because it resembles standard epistemic principles, like the genetic fallacy (where explaining the origin of a belief undermines its justification if the origin is unrelated to truth). For instance, if a belief is caused by brainwashing, that explanation displaces evidence. It also seems intuitive for cyclical theories because they often describe beliefs as "phase-locked" (e.g., Spengler's decline phase makes cultures pessimistic and receptive to cyclical ideas). However, cyclical theories do not inherently entail that beliefs are evidence-free; they can allow for phases to provide better access to truth-conducive evidence. The sleight of hand occurs in the ambiguous use of "fully explained," which is set up in step (2) and then applied in a way that prejudges cyclical theories as non-evidential.

  **What it costs to give up step (3)**: Rejecting step (3) means accepting that a belief can be justified on its merits even when its acceptance is influenced by a historical position. This comes with costs:
  - **Risk of relativism**: By allowing that historically conditioned beliefs can still be evidence-based, you might weaken the distinction between "discovered truth" and "phase symptom." This could lead to a form of contextual relativism, where justification is always tied to a specific historical context. For cyclical theories, this means you can consistently believe in them based on evidence, even if the theory predicts that belief is a phase effect. The cost is that you must defend why evidence in one phase is reliable, despite the theory implying that other phases will reject it.
  - **No free pass for linear theories**: If step (3) is false, the asymmetry argument collapses. Linear theories could also face the challenge that their acceptance is explained by a historical position (e.g., being in a "progressive era"), but this doesn't automatically disqualify them from evidence-based justification. Linear views must still earn their keep through empirical support.

