  - **Linear theories are vulnerable to historical conditioning**: If a linear theory (e.g., Marxist historical materialism or Enlightenment progress narratives) describes a directional process, acceptance of the theory could still be "fully explained" by the holder's position in that process (e.g., being in an industrial age that fosters belief in progress). Step (3) could be applied here: the explanation by position might displace evidence, making acceptance a "symptom" of the era rather than a discovery. For instance, critics argue that linear progress theories reflect modern Western biases rather than universal truths.
  - **Cumulative inquiry may not be unique to linear views**: Step (5) assumes linearity is necessary for cumulative inquiry, but this is circular. If history is cyclical, cumulative inquiry might still occur within cycles or be rediscovered across them (e.g., scientific knowledge in Ibn Khaldun's model). Conversely, linear theories don't guarantee that inquiry is truly cumulative; errors can persist or regress (e.g., the "dark ages" in some progress narratives).

