  ### Decision Tree on the Authority of Idealized Preferences

  **Starting Commitment:** Actual preferences can diverge from those held under improved knowledge, reasoning, and alignment with one's aspirational self.  
  **Test Cases:**  
  - **Smoker:** Prefers smoking but would prefer quitting if idealized.  
  - **Meaning Project Holder:** Would abandon her life's meaning project if idealized but disowns that self ("not me").  
  - **Repair-Order Dependence:** Two people whose idealizations diverge oppositely based on inconsistency repair order.  

  ---

  #### **Node 1: Does idealization only correct epistemic flaws (knowledge/reasoning), or also reshape desires?**  
  - **Epistemic only (corrects beliefs/rationality):** → Node 2  
  - **Reshapes desires (non-epistemic):** → Node 6  

  #### **Node 2 (Epistemic): Is the idealized subject the same agent or an advisor?**  
  - **Same agent (authoritative self):** → Node 3  
  - **Advisor (evidential proxy):** → Node 5  

  #### **Node 3 (Epistemic, same agent): Does idealization converge uniquely across repair procedures?**  
  - **Yes (unique outcome):** → Node 4  
  - **No (repair-order relative):** → Leaf 3  

  #### **Node 4 (Convergent): Should moral constraints (e.g., impartiality) be built in?**  
  - **Yes:** → **Leaf 1: Kantian Constructivism**  
    - *Awkward commitment:* Forces agents to comply with moralized preferences they might reject (e.g., Meaning Project Holder must abandon her life's work if idealized morality demands it).  
  - **No:** → **Leaf 2: Full Information Ideal**  
    - *Awkward commitment:* Overrides actual preferences with idealized ones without moral guardrails (e.g., forces Smoker to quit even if he values autonomy over health).  

  #### **Leaf 3: Unnamed ("Procedural Relativism")**  
  - *Awkward commitment:* Binds agents to arbitrary outcomes (e.g., Repair-Order Dependence pair must follow divergent preferences based solely on repair-sequence luck).  

  #### **Node 5 (Epistemic, advisor): Do advisor's preferences bind outright?**  
  - **Yes:** → **Leaf 4: Informed Desire Theory**  
    - *Awkward commitment:* Advisor's preferences override actual ones even if unendorsed (e.g., Meaning Project Holder must obey a "better" self she disowns).  
  - **No:** → **Leaf 5: Unnamed ("Tiebreaker Evidence")**  
    - *Awkward commitment:* Only breaks ties in incoherent actual preferences, ignoring advisor's insights when preferences are coherent but misguided (e.g., Smoker's coherent addiction beats quitting advice).  

  #### **Node 6 (Non-epistemic): Do idealized preferences bind outright?**  
  - **Yes:** → **Leaf 6: Unnamed ("Reshaped Desire Authority")**  
    - *Awkward commitment:* Binds agents to desires they never held, risking alienation (e.g., Meaning Project Holder must abandon her project because idealized desires were rewritten).  
  - **No:** → **Leaf 7: Unnamed ("Reshaped Tiebreaker")**  
    - *Awkward commitment:* Reshaped desires only break ties, so coherent actual preferences trump deeply transformed ones (e.g., Smoker's addiction wins if consistent).  

