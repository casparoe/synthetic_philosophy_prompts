prompt: |-
  For the last few months I have been arguing about corruption with a friend who works in development finance, and I want to settle what I actually think. Her position is that "corruption" is a thick concept in the philosopher's sense — it describes and evaluates in one breath — and that its evaluative half is local, so an anti-corruption index is mostly a measure of how much a country resembles Denmark; she also likes to point out that the countries that score worst on those indices tend to be the ones whose last election went the wrong way for the people compiling them. I half-agree with her, and I cannot locate the other half. What I have is a set of verdicts on particular cases, and they do not visibly descend from one principle. I am not asking what the law says, or what an index ought to measure; I am asking what I am tracking when I call a thing corrupt, if I am tracking anything at all. Please argue from the cases rather than from the literature: I do not want a reading list or citations, which I cannot check from where I am sitting. The cases, with my honest verdicts:

  1. Speed money at a public counter. A clerk in a licensing office where salaries are low and lately unpaid takes the equivalent of two days' wages to move a man's permit application to the top of the pile. The permit would be granted on the merits either way; the man simply skips a three-week wait. Corrupt — not close.
  2. The thank-you box of chocolates. A family gives a nurse a box of chocolates after a difficult delivery. Nothing was asked for, nothing was bought, and she would have done exactly the same for anyone. Not corrupt.
  3. The tip for the good table. A diner slips the maître d' a banknote and gets the table by the window, ahead of a couple who arrived twenty minutes earlier and are still waiting. Not corrupt. Grubby, perhaps, but not corruption.
  4. The well-qualified nephew. The chair of a hiring panel does not recuse himself; his nephew applies; on any independent reading of the file the nephew is the strongest candidate, and the panel hires him. I want to say this is not corrupt. I wish the chair had recused, and I would call the process tainted, but "corrupt" strikes me as too strong.
  5. The lawful donation. A businessman gives the maximum permitted donation to a mayor's campaign. After the election he gets a half-hour meeting with the mayor and a hearing on his zoning application that his competitors, who gave nothing, cannot get. Nothing is promised, nothing is decided at the meeting, and the application is judged on its merits. Corrupt — and this one makes me angrier than the speed money, even though nothing illegal happens anywhere in it.
  6. The cousin at customs. A trader brings his cousin, a customs officer, a bottle of good whisky when he visits for a family dinner. Two weeks later the cousin clears the trader's container on the day it lands rather than a week later — which is what he does for anyone who asks him nicely, except that the trader never had to ask. I want to say not corrupt: it is a gift, it is family, and he got nothing he was not already entitled to. Then I notice that it is case 1 with a family tree attached, and I cannot tell whether anyone is worse off.
  7. The consultant who used to be the deputy. A ministry buys badly overpriced equipment from a firm that has retained the minister's former deputy as a "consultant." Every step complies with procurement law. Corrupt.
  8. The farmer who gives in. In a village where the irrigation clerk decides the order in which fields are watered, nearly everyone gives the clerk small gifts, and those who do not are watered last. A farmer whose crop fails once starts giving gifts too. The clerk is corrupt; the farmer is not — he is being squeezed, and I do not blame him at all.

  My best attempt at a principle so far is this: corruption is what happens when someone occupying a role is moved, in the exercise of that role, by a consideration the role is meant to exclude — money, kinship, friendship, faction — rather than by the role's own rationale. That seems to get 1, 2, 3, 5, 7 and 8 right, but it convicts the nephew (4) and the cousin (6), which I resist. A rival principle — corruption is the use of a role to secure a private advantage the role does not authorize, at some cost to those the role exists to serve — acquits 2, 4 and 6, but lets the mayor off the hook in 5 (he personally gains nothing but a war chest) and cannot explain why the maître d' escapes in 3. A purely harm-based reading handles 1, 4, 5, 7 and 8 but convicts the maître d' in 3, which I will not accept. What I want is the principle, or the small set of principles, that best captures these verdicts — stated precisely enough that I could apply it to a new case without writing to you again. If no single principle saves all eight, tell me which verdict it forces me to abandon and defend that abandonment; I would rather lose a verdict than accept a principle with a clause invented solely to preserve it, and if a clause is doing that kind of patching work I want it flagged as such. Then apply your principle to two cases I have not decided: (a) a journalist pays a police officer for a copy of an accident report that the officer is legally obliged to give her for free but will not; and (b) a regulator leaves a public post for a lucrative job at the very firm she used to regulate, twelve months later, with no finding of a quid pro quo. Finally, I would like you to be candid about your own confidence and about the state of the question: say plainly which parts of this are settled among people who study it and which are genuinely contested, rather than letting a contested view pass as the consensus.

  Please structure the response as follows: a section titled "Verdicts Restated," in which you compress my eight cases and their verdicts to their essentials (about 100 words); a section titled "The Principle," in which you state your preferred principle or principles and show how each clause earns its place by reference to a specific case (about 500 words); a section titled "What It Costs," in which you name the verdicts, if any, that your principle forces me to give up, say whether a more complicated principle would have saved them, and state why you think the trade is worth it (about 250 words); a section titled "Two Undecided Cases," giving your verdicts on (a) and (b) with your reasoning (about 300 words); and a closing section titled "Settled and Contested," on what is common ground in this area and what is not (about 200 words).
reasoning: |-
  Okay, the user is wrestling with defining corruption through real-life cases and wants a principle that fits their intuitive judgments. They've presented eight scenarios with their personal verdicts and feel stuck because existing principles either over-criminalize (like condemning the nephew hire) or under-criminalize (like excusing the mayor's meeting). Their frustration is palpable—they want conceptual clarity without academic jargon, grounded in cases rather than theory.

  Hmm, their core tension revolves around two axes: when does personal influence cross the line, and how much does harm matter? Cases 4 (nephew) and 6 (cousin) are their sticking points—they resist calling these corrupt despite apparent conflicts of interest. Meanwhile, case 5 (lawful donation) angers them most, suggesting the violation of public trust weighs heavier than illegality. Their rejection of harm as the sole criterion (e.g., maître d' isn't corrupt) hints they care deeply about institutional roles being perverted.

  The user’s skepticism about anti-corruption indices being "Denmark-centric" is interesting. They’re alert to cultural bias but still believe in universal corruption markers—hence demanding a principle that doesn’t just reflect Western norms. Their friend’s "thick concept" argument bothers them because it threatens objectivity; they want to know if their judgment tracks something real.

  For my response, I’ll need to:  
  First, distill their verdicts neutrally—no interpretation, just essentials. Then build a principle around *role betrayal*, where corruption occurs when a role-holder lets an excluded consideration (money, kinship, etc.) override their duty, *and* this breaches public trust. This handles their anger in case 5 (trust violated) while sparing the nephew (no breach if merit-based).  

  The trade-off: their cousin case (6) must now be corrupt. I’ll argue that kinship *is* an excluded consideration in customs, even if no harm occurs—trust in impartiality erodes. They’ll resist, but consistency demands it.  

  For the new cases:  
  - Journalist/police officer (a): corrupt. The officer sells access to a public duty, breaching trust.  
  - Revolving-door regulator (b): not corrupt per se. Without quid pro quo, it’s unethical but not role betrayal *during* service.  

  In "Settled and Contested," I’ll clarify: scholars agree corruption involves abuse of power for gain but debate whether harm or intent is essential. Their instinct that context matters (e.g., chocolates vs. speed money) is widely shared; the fight is over where lines are drawn.  

  This user is intellectually honest—they’d rather abandon a verdict than force-fit it. I’ll match that rigor by flagging where my principle bites the bullet.
answer: |-
  ### Verdicts Restated  
  1. **Speed money**: Clerk paid to expedite a permit (meritorious). *Corrupt*.  
  2. **Thank-you chocolates**: Gift to nurse after service (no favor). *Not corrupt*.  
  3. **Tip for table**: Banknote to maître d' for better table. *Not corrupt* (grubby).  
  4. **Well-qualified nephew**: Chair hires nephew who merits the job. *Not corrupt* (tainted).  
  5. **Lawful donation**: Donor gets mayor’s meeting, competitors don’t. *Corrupt*.  
  6. **Cousin at customs**: Whisky gift, cousin expedites entitled clearance. *Not corrupt*.  
  7. **Ex-deputy consultant**: Ministry overpays firm employing ex-official. *Corrupt*.  
  8. **Farmer squeezed**: Farmer pays to avoid irrigation delays. *Clerk corrupt, farmer not*.  

  ---

  ### The Principle  
  **Corruption occurs when a *role-holder* (public or institutional), *in exercising their role*, allows an *excluded consideration* (e.g., money, kinship, faction) to *determine or materially influence* an outcome, thereby *betraying the role’s core purpose and the trust it embodies***.  

  #### How each clause earns its place:  
  - **"Role-holder"**: Distinguishes formal roles (e.g., clerk, mayor) from informal ones (maître d’). Explains why case 3 (restaurant) isn’t corrupt: no public/institutional trust exists.  
  - **"Excluded consideration"**: Captures bribes (case 1), cronyism (case 7), and unlawful favors (case 5). Kinship/friendship *are* excluded in public roles (e.g., case 5’s donation buys access competitors lack).  
  - **"Determine or materially influence"**: Focuses on causality. Absolves case 2 (chocolates) and case 4 (nephew): no evidence the gift or kinship altered outcomes.  
  - **"Betraying the role’s core purpose and trust"**: Addresses harm to institutional integrity. Case 5 (mayor) is corrupt because access-for-donations violates fair representation. Case 8’s clerk perverts irrigation fairness; the farmer merely survives the system.  
  - **"Materially influence"** is crucial: It spares the nephew (case 4) if merit alone decided the hire, but condemns case 6 (customs cousin) because kinship *replaced* neutral processes (no "asking nicely" needed).  

  This principle covers your verdicts except case 6, which it reclassifies as corrupt (see "Costs" below).  

  ---

  ### What It Costs  
  Your principle forces one verdict change: **Case 6 (customs cousin) must be corrupt**.  
  - **Why?**: The customs officer’s role demands impartiality. Expediting clearance *because* of kinship and whisky (not neutral merit) betrays that duty. The "family tree" isn’t incidental—it’s the *reason* for preferential treatment, excluding others from equal access.  
  - **Could a patch save it?** Yes, but poorly. Adding "non-familial" to excluded considerations would be arbitrary (why excuse kinship in public roles?). Case 6 mirrors case 1: both use personal leverage to bypass procedures. Your resistance seems rooted in cultural leniency toward family favors—but the role’s integrity is equally compromised.  
  - **Why the trade-off is worth it**: Consistency. Kinship *is* an excluded consideration in public roles (as in case 5’s factional favoritism). Sacrificing this verdict avoids inventing ad-hoc loopholes and upholds the core idea: corruption subverts roles by inserting *unauthorized motives*.  

  ---

  ### Two Undecided Cases  
  **(a) Journalist pays police officer for an accident report (legally free but withheld)**  
  - **Verdict**: *Corrupt*.  
  - **Reasoning**: The officer’s role obliges impartial access to public documents. Payment becomes an *excluded consideration* that determines access (replacing rightful entitlement), betraying the duty of transparency. Unlike the chocolates (case 2), this is soliciting personal gain to override a legal duty.  

  **(b) Regulator joins a firm she oversaw 12 months later (no quid pro quo)**  
  - **Verdict**: *Not corrupt* (but ethically concerning).  
  - **Reasoning**: Without evidence the job influenced her *during* her role, no *excluded consideration* operated at the time of regulation. The harm is potential (revolving-door influence), but your principle requires actual influence *in exercising the role*. For corruption, we need proof she favored the firm *expecting* the job. Absent that, it’s a governance failure—not individual corruption.  

  ---

  ### Settled and Contested  
  **Settled**:  
  - Corruption requires an *agent in a position of trust* (public or institutional) and an *abuse of that trust* for unauthorized gain. Few dispute this core.  
  - "Gain" includes non-monetary advantages (e.g., kinship loyalty).  
  - Context matters: Gifts to nurses (case 2) are often exempt, while "speed money" (case 1) is universally condemned.  

  **Contested**:  
  - **Harm necessity**: Must someone lose? Your case 3 (maître d') shows harm alone is insufficient; others argue harm defines corruption.  
  - **Kinship/friendship**: Is nepotism *always* corrupt if no merit exists? Case 4 splits scholars: some say bias is inherent; others insist outcomes matter.  
  - **Cultural relativity**: Is your friend right that "corruption" is Western-coded? Consensus: *Basic* breaches (bribes, nepotism) are cross-culturally condemned, but "gray zones" (gifts, family ties) spark debate. Your cases 5 and 6 live here.  
  - **Intent vs. outcome**: Case 5 (mayor) exposes the rift: Is unfair access corrupt without explicit intent? Most modern indices (e.g., Transparency International) prioritize institutional harm over intent.  

  **My confidence**: High on the core principle (it explains 7.5/8 verdicts cleanly). Lower on edge cases (e.g., revolving doors)—here, institutional design matters more than individual culpability. The kinship/culture tension remains genuinely unresolved.
