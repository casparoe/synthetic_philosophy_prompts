  Okay, let me tackle this professor's request. They're a novelist teaching a philosophy seminar and need a final exam question that pushes students beyond superficial understandings of Max Black's two spheres argument. The core challenge is designing a prompt that forces engagement with the metaphysical substance of identity debates while avoiding two common reductive responses. 

  First, I need to consider what makes Black's thought experiment pedagogically treacherous. Students are latching onto it as an easy "gotcha" against Leibniz without grasping the underlying assumptions about properties or the structure of the principle itself. The professor wants three key elements surfaced: (1) the distinction between types of properties (relational vs non-relational), (2) the ontological question of whether objects are "bundles" of properties or have underlying "thisness", and (3) the often-overlooked asymmetry in Leibniz's biconditional.

  For the prompt itself, it must stand alone without explanatory preamble. I'll frame it as an open interrogation of Black's implications rather than a directive - this should prevent students from defaulting to rehearsed positions. The phrase "what deeper philosophical commitments" is crucial for nudging them toward the metaphysics.

  The model answer needs to demonstrate three layers of thinking: first, dissecting how Black's case challenges only one direction of Leibniz's principle; second, analyzing the property-type restriction that resuscitates the principle; third, exposing the ontological fork in the road between bundle theory and haecceities. I'll avoid historical references per the professor's instructions, focusing purely on conceptual moves.

  For the grading rubric, I'm allocating points for each conceptual milestone: 5 for recognizing the biconditional structure, 10 for property analysis (split between relational/non-relational and ontological implications), and 10 for unpacking the metaphysical fork. Common mistakes to flag include conflating the biconditional directions and treating spatial position as decisive.

  The tone should match the professor's wry humor ("while I should be revising chapter nine") while maintaining academic rigor. No need to coddle seniors who've reduced profound metaphysics to a slogan.
answer: |-
  Here’s an exam question designed to force engagement with the core philosophical tensions, followed by a model answer and grading rubric:

  **Exam Question:**  
  *"Max Black’s symmetric universe appears to refute the Identity of Indiscernibles (IoI). Explain why this refutation—and attempts to salvage IoI by appealing to spatial differences—both miss the principle’s deeper philosophical commitments. What does this disagreement reveal about what constitutes an object’s identity?"*

  ---

  **Model Answer (Approx. 700 words):**  
  Black’s thought experiment constructs a universe containing only two qualitatively identical iron spheres, symmetrically positioned. Superficially, this seems fatal to the Identity of Indiscernibles (IoI), which holds that if two entities share all properties, they are identical (one entity). Students often counter that spatial position *is* a differentiating property, but this misunderstands both Black’s setup and IoI’s purpose. The real conflict lies in three layers: the principle’s *scope*, its *modal status*, and the *ontology of identity itself*.

  First, IoI is a biconditional: (1) If entities are identical, they share all properties (indisputable), and (2) If they share all properties, they are identical (contested). Black targets only (2). His spheres share all *intrinsic* properties (mass, composition, shape) and *relational* properties (distance from a hypothetical observer). Yet they remain numerically distinct. To rescue (2), proponents must restrict IoI to *non-relational* or *purely qualitative* properties. If spatial position is excluded (as relational or extrinsic), the spheres remain indiscernible under the restricted principle—and IoI (2) still fails. If spatial position counts, IoI survives trivially but becomes vacuously true in asymmetric universes. Thus, the dispute hinges on *which properties matter for discernibility*—a question Black’s critics must answer without circularity.

  This exposes IoI’s function: it is not an empirical claim but a *metaphysical thesis* about what constitutes individuality. Its necessity is logical or conceptual; it defines what it means to be a distinct object. Black’s counterexample, if coherent, shows IoI is not *necessarily* true. But coherence is contested. To describe two spheres, we must label them (e.g., “Sphere A” and “Sphere B”), implying primitive distinctness prior to properties. This points to the ontological rift: **Bundle Theory** (objects are *only* collections of properties) versus **Substrate Theory** (objects possess a non-qualitative “thisness” or *haecceity*).

  For bundle theorists, an object *is* its properties. If two bundles share all properties, they *must* be identical—IoI (2) holds by definition. Black’s universe then seems impossible: if spheres share all properties, including spatial relations (treated as external to the objects), there’s only one sphere. But describing two spheres *requires* introducing difference (e.g., positional coordinates), contradicting perfect symmetry. The thought experiment thus *presupposes* numerical diversity without qualitative difference, begging the question against bundle theory.

  For haecceitists, objects have a primitive identity beyond properties (Sphere A is *this* thing, Sphere B is *that* thing, irrespective of qualities). IoI (2) fails because distinctness doesn’t require qualitative difference. Black’s scenario is coherent because spheres derive individuality from their haecceities, not properties. Yet this raises problems: if haecceities are non-qualitative, they are epistemically inaccessible (we couldn’t *know* two spheres exist) and ontologically mysterious.

  The deeper revelation is that IoI acts as a litmus test for one’s theory of identity. Rejecting IoI (2) commits one to haecceities or brute distinctness. Defending it demands bundle theory or a restrictive property ontology. Black’s “refutation” succeeds only if we presuppose that objects can be distinct *without* qualitative difference—the very notion IoI denies. Thus, the dispute is less about spheres than about whether identity requires discernible properties or rests on ineffable singularity. Neither spatial literalism nor indiscernibility dogmatism resolves this; they obscure the metaphysical stakes. Ultimately, IoI’s viability depends on whether we can ground identity in knowable properties alone—or accept that individuality transcends description.

  ---

  **Grading Rubric (25 points total):**  
  1.  **Recognizes IoI as a biconditional & Black’s limited target (5 pts):**  
      *Distinguishes IoI’s two directions and shows Black only challenges "indiscernibles → identical."*  
      *→ Common error: Treating IoI as a monolithic claim or conflating directions.*  

  2.  **Analyzes the property restriction problem (10 pts):**  
      - (a) Explains why spatial position is contested (relational/extrinsic vs. intrinsic) and why appealing to it is inadequate (5 pts).  
      *→ Common error: Asserting spatial position "solves" the problem without addressing property ontology.*  
      - (b) Argues that IoI’s plausibility hinges on restricting properties (non-relational, qualitative) and that Black’s setup challenges this restricted version (5 pts).  
      *→ Common error: Ignoring that Black’s symmetry includes relational properties.*  

  3.  **Addresses the ontology of identity (10 pts):**  
      - (a) Contrasts Bundle Theory (IoI holds by definition) vs. Haecceity/Substrate Theory (IoI fails) (5 pts).  
      *→ Common error: Presenting theories without linking them to IoI’s truth conditions.*  
      - (b) Explains how Black’s scenario’s coherence depends on haecceity (it presupposes distinctness without qualitative difference) and critiques bundle theory’s implications (if no haecceity, symmetric universe implies one sphere) (5 pts).  
      *→ Common error: Accepting the two-sphere description uncritically without noting its metaphysical baggage.*  

  ---

  **Why this works for your goals:**  
  - **Forces engagement with property types:** Students *must* discuss relational vs. non-relational properties to avoid the "spatial position" trap.  
  - **Exposes the metaphysical fork:** The question explicitly asks what objects "are," requiring discussion of bundle theory vs. haecceity.  
  - **Undercuts lazy refutations:** By framing spatial fixes as inadequate *and* noting that indiscernibility alone doesn’t end debate, it blocks both C-grade answers.  
  - **Highlights IoI’s structure:** The biconditional point is non-negotiable for a strong score.  
  - **No name-dropping needed:** The model answer references concepts, not philosophers. Key terms ("haecceity," "bundle theory") are defined contextually.  

  This should give your English majors a fair shot while ensuring philosophy students can’t coast on jargon. Good luck with grading—and chapter nine!
