prompt: |-
  Last night I lost several hours to an argument with a friend who works in decision theory, and I want an outside read on what she actually believes, because her verdicts on cases and her stated position do not obviously fit together.

  Her stated position is the result she calls Good's theorem: free information cannot lower an expected-utility maximizer's expected utility, since it can always be ignored; information is worth whatever improvement it makes to the decisions you take with it; and where nothing you do depends on it, its value is exactly zero. She treats this as a constraint on any sane account of what information is worth. She would also deny, in a seminar, that the way a fact feels is any part of what the fact is worth. Yet when I pressed her on cases, she gave these verdicts, which I have tried to state as neutrally as I can:

  1. A free and perfectly reliable test for a condition that is treatable with an effective but unpleasant regimen: she takes the test.
  2. A free and perfectly reliable test for a condition that is untreatable, whose course is slow and predictable, and where knowing would let her arrange her finances, her work, and her goodbyes: she takes the test.
  3. A free and perfectly reliable answer to a question with no bearing on anything she will ever do and no connection to anyone she knows — say, the winning numbers of a lottery she did not enter, in a country she will never visit: she says she would not bother, and cannot see that it is worth anything to her.
  4. A free and perfectly reliable warning, delivered a week ahead, of a bad event she cannot prevent but can prepare for: she takes it.

  Here is the case we got stuck on. She can take a free and perfectly reliable test that will tell her whether she is in the early stages of a progressive, incurable, untreatable condition. Stipulate that the action space really is empty: no treatment, nothing she can do alters the course, no financial, legal, or family arrangement comes out differently, there is no one she would want to tell, and nothing would make the knowledge easier to carry. The condition will announce itself unmistakably in about three years regardless, so the only difference the test makes is that she would spend those three years knowing. Suppose the test returns bad news with probability 0.3 and all-clear with probability 0.7, and suppose she expects the dread of a bad result to weigh on her considerably more than the relief of a good one.

  What will she say, and what should she say if she wants to be consistent with herself? I am less interested in the verdict itself than in three things. First, which candidate rules her four verdicts fit equally well; I have convinced myself that at least two survive — one on which information is worth only the decisions it improves, one on which the experience of knowing is part of the outcome — and I cannot tell whether a third, on which a true belief is worth having on its own, survives her third verdict or is quietly ruled out by it. Second, what each surviving rule predicts about the new case, which of them her track record actually favours, and your best guess with your reasons. Third, the further case — a test she could take, not a change in framing — that would separate the rules most cleanly, and why it does.

  One more thing, and I mean it: if the question is malformed, say so plainly rather than assembling a tidy answer around it. If the value of information before the test and its value after cannot be compared the way I am asking, or if her four verdicts already pin down a single rule and my apparent ambiguity is just my imprecision, I would rather be told that I have set this up badly than be humoured.
reasoning: |-
  Okay, the user is presenting a complex scenario involving decision theory and the value of information. They've had an argument with a friend who works in decision theory, and they're trying to understand the consistency between her stated position (Good's theorem) and her intuitive verdicts on specific cases. The user wants an outside perspective to clarify what rules might govern her judgments and how they apply to a new case.

  First, I need to recall Good's theorem. It states that free information can't lower expected utility because you can always ignore it. Information's value comes only from how it improves decisions. If no decisions change, the value is zero. But the friend's verdicts seem to contradict this in some cases.

  Looking at her verdicts:  
  1. She takes a test for a treatable condition because knowing allows her to take action (start treatment).  
  2. She takes a test for an untreatable condition to arrange her affairs - this involves decision-making (finances, work, goodbyes).  
  3. She wouldn't take useless information (lottery numbers) since it doesn't affect anything.  
  4. She takes a warning for an unpreventable bad event to prepare - again, decisions involved.

  The problematic case is a test for an incurable, untreatable condition where no actions change. The only difference is three years of knowing versus not knowing. The test has 30% bad news (which causes dread) and 70% all-clear (relief), but she expects the dread to outweigh the relief.

  The user has three main questions:  
  1. What rules explain her four verdicts? Options:  
     - Pure instrumentalism: Value only from improved decisions (rules out case 2? But case 2 has decisions)  
     - Experiential account: The feeling of knowing is part of utility (explains case 2 but not case 3?)  
     - Truth intrinsic account: True beliefs valuable per se (contradicted by case 3)  
     
     Actually, her verdicts fit instrumentalism if we note that case 2 involves decisions (arranging affairs). Case 3 has no decisions, so no value. Case 4 has preparation actions. Only the new case has no decisions at all.

  2. What would each rule predict for the new case?  
     - Instrumentalism: No value → Don't take test (since no decisions change)  
     - Experiential: Depends on net hedonic impact → If dread > relief, avoid test  
     - Truth intrinsic: Always take test → But contradicts case 3

     Her track record (cases 1-4) seems purely instrumental since all positive verdicts involve potential actions. Case 3 rejection reinforces this.

  3. What test case would distinguish these rules?  
     - A test where knowing causes negative feelings but enables no actions → Instrumentalism says reject, experiential says reject if net negative, truth intrinsic says take.  
     - Or a test with neutral/positive feelings but no actions → Instrumentalism and experiential (if neutral) say reject, truth intrinsic says take.

  Crucially, the user might be missing that in case 2, "arranging affairs" constitutes decision-making, so instrumentalism explains it. The new case has no such actions, making it fundamentally different. The friend's consistency challenge arises only if we misclassify case 2 as non-instrumental.

  The user also hints at a deeper need: understanding whether decision theory can accommodate psychological realities (dread/relief) without abandoning its framework. The resolution is that expected utility can include psychological states as part of outcomes, which remains consistent with instrumentalism if properly framed.

  Final answer structure:  
  - Confirm the question is valid  
  - Show instrumentalism explains all verdicts if "arranging affairs" counts as action  
  - Predict for new case: reject test (no decision value)  
  - Design test with no actions but positive/neutral experience to separate experiential vs. truth accounts  
  - Emphasize that Good's theorem holds when utility includes psychological impacts
answer: |-
  Your question is **not malformed**, but it reveals a tension between formal decision theory and psychological realism. Your friend's stated position (Good's theorem) and her case verdicts **can be reconciled** under a single coherent rule, though her new-case prediction might expose a subtle inconsistency with pure theory. I'll address your three requests directly, then clarify why her position holds together and where it might fray.

  ### 1. Candidate Rules That Fit Her Four Verdicts
  Her verdicts are consistent with **two distinct rules**, both compatible with Good's theorem when properly framed. A third rule (truth as intrinsically valuable) is **ruled out** by her verdict on Case 3. Here's the breakdown:

  - **Rule 1: Instrumentalism (Pure Good's Theorem)**  
    *Information's value comes solely from its ability to improve decisions.*  
    - **Case 1:** Test taken because it enables treatment → decision improved.  
    - **Case 2:** Test taken because it enables financial/work/closure arrangements → decisions improved.  
    - **Case 3:** Test rejected because no decisions depend on it → value = zero.  
    - **Case 4:** Warning taken because it enables preparation → decision improved.  
    **Survives?** Yes. All verdicts fit, assuming "arranging affairs" involves tangible actions (e.g., updating a will, delegating projects).

  - **Rule 2: Instrumentalism + Experiential Utility**  
    *Information's value comes from improving decisions OR affecting hedonic states (feelings), where these states are part of the outcome's utility.*  
    - Cases 1, 2, 4: As above (decisions improved).  
    - Case 3: No decisions AND no affective impact implied → value = zero.  
    - *Crucially*, this treats feelings like dread or relief as **components of utility**, not separate from outcomes. Good's theorem still holds because utility now includes psychological states.  
    **Survives?** Yes. This explains Case 2 if "arranging goodbyes" has emotional weight, but her seminar denial ("the way a fact feels is no part of what it's worth") is technically preserved because feelings are *outcomes*, not separate from utility.  

  - **Rule 3: Truth as Intrinsically Valuable**  
    *True beliefs are worth having for their own sake, regardless of consequences.*  
    - **Ruled out by Case 3:** She rejects free, reliable information (lottery numbers) with no practical use → truth alone isn't sufficient. Her verdict implies instrumental or hedonic value is necessary.  

  **Conclusion:** Rules 1 and 2 both fit her verdicts. Rule 3 is incompatible with Case 3.

  ---

  ### 2. Predictions for the New Case and Which Rule Her Track Record Favors
  - **The New Case:**  
    Test for an incurable, untreatable condition with no actionable consequences.  
    - **Probability:** 30% bad news (causes dread), 70% all-clear (causes relief).  
    - **Her Expected Utility:** Dread outweighs relief → net negative hedonic impact.  
    - **Rules' Predictions:**  
      - *Rule 1 (Pure Instrumentalism):* **Reject the test.** No decisions are improved → value = zero. Taking it can't increase expected utility.  
      - *Rule 2 (Instrumentalism + Experiential):* **Reject the test.** No decision value, and net negative hedonic impact lowers expected utility.  
      - *Rule 3 (Truth Intrinsic):* Would take it, but this is already ruled out.  

  - **Which Rule Does Her Track Record Favor?**  
    Her verdicts **strongly favor Rule 1 (Pure Instrumentalism)**.  
    - Case 2 is decisive: She takes the test *only* for actionable outcomes (arranging finances/work/goodbyes). Her "seminar denial" that feelings aren't part of information's worth aligns with this.  
    - Case 3 reinforces Rule 1: Rejecting useless information shows she doesn't value truth or feelings alone.  
    - **But there's a catch:** If "arranging goodbyes" in Case 2 involves psychological comfort (e.g., reducing future regret), Rule 2 creeps in. However, her framing emphasizes *actions* (finances/work), not feelings.  

  - **Your Friend's Likely Response:**  
    She should say **"reject the test"** to be consistent with Rule 1. If she wavers, it hints at Rule 2.  
    - *Why?* No decisions change → no instrumental value. Good's theorem says free info can't harm expected utility *if you can ignore it*, but here she can't "ignore" the result psychologically—it directly affects utility via dread. However, if utility includes psychological states, rejecting the test avoids the net-negative outcome, preserving consistency with Good's theorem.  

  - **My Best Guess:**  
    She'll say **"reject the test"** and defend Rule 1.  
    - *Reason:* Her Case 3 verdict shows she dismisses non-instrumental value. If she admits feelings matter, it contradicts her seminar stance. Rule 1 is the safer fit.  

  ---

  ### 3. A Further Case to Cleanly Separate Rules 1 and 2
  **The Test:** A free, reliable test telling you whether a distant, deceased relative (whom you never met) left you a sealed box of trivial, worthless mementos. The box is stored in a foreign warehouse, inaccessible forever—you can never see it or interact with it. The test has no bearing on any action, relationship, or resource.  

  - **Why this separates the rules:**  
    - *Rule 1 (Pure Instrumentalism):* **Reject.** No decisions affected → value = zero.  
    - *Rule 2 (Instrumentalism + Experiential):* **Depends on hedonic impact.** If curiosity or closure provides net positive feelings (e.g., "satisfaction from knowing"), take it; if neutral or negative feelings, reject it.  
    - *Rule 3 (Truth Intrinsic):* Take it (but already excluded).  

  **How it clarifies:**  
  - This case has **no analogues to Case 2's actions** (e.g., no finances to arrange).  
  - It forces a choice between:  
    - *Pure instrumentalism* (always reject)  
    - *Experiential utility* (take if net positive feelings).  
  - Your friend's verdict here would confirm or deny whether feelings (not tied to actions) influence her valuation. If she rejects it, Rule 1 holds; if she takes it, Rule 2 is active.  

  ---

  ### Critical Assessment: Is the Question Malformed?
  **No—but it highlights a nuance in how "utility" is defined.** Good's theorem requires that utility functions account for *all* relevant outcomes, including psychological states. Your friend's seminar denial ("the way a fact feels is no part of what it's worth") is misleading if "worth" is conflated with "instrumental value." Properly interpreted:  
  - Information has no *independent* value beyond its effect on decisions or utility.  
  - But "utility" can include the hedonic experience of knowing (e.g., dread in the new case). This is still consistent with Good's theorem because the theorem evaluates expected utility *given the information*, which now includes psychological outcomes.  

  **Where tension arises:** In the new case, if she rejects the test, she's implicitly admitting that utility includes psychological states (since no decisions change). This contradicts her seminar statement *if* it denies feelings as part of utility. But if her seminar point was that information isn't "worth" anything *separate* from its role in outcomes, she's consistent.  

  **Your setup:** Her four verdicts **do pin down a single rule**—**Rule 1 (Pure Instrumentalism)**—if we interpret Case 2 strictly (actions only, not feelings). Case 3 rules out Rule 3. The ambiguity in your new case stems from whether "no actionable consequences" includes psychological outcomes in utility.  

  ### Final Advice
  - **To your friend:** If she wants absolute consistency, she must either:  
    (a) Reject the test in the new case (upholding Rule 1), arguing that dread is an outcome affecting utility, not a "cost of information," or  
    (b) Admit Rule 2 explicitly, revising her seminar stance to say feelings are part of outcomes.  
  - **To you:** Press her on the "deceased relative's box" case. If she takes it, she values feelings; if not, she's a pure instrumentalist. Her new-case verdict will reveal whether she prioritizes theory or psychological realism.  

  This isn't a flaw in decision theory—it's a feature. Good's theorem is robust if utility is comprehensively defined. Her "inconsistency" is likely terminological, not substantive.
