prompt: |-
  I'm running a session of our lab's reading group on wireheading and reward tampering -- the usual cluster: an agent short-circuits its reward channel, or edits the channel itself, plus the line everyone repeats that in RL the reward isn't the agent's objective anyway. I want to finish the session with a novel instead of another paper, and ive picked Brave New World. Everyone reads it as the experience machine, or as freedom versus happiness, and I'm bored of both. Read it through wireheading instead: who in that book is wireheading, who's doing the tampering, and does the lens even fit a world where nobody appears to be tampering with anything and everyone is just content? I have a hunch the soma is doing something the alignment picture can't quite name, and that John is the only agent whose reward function never got edited, which is maybe why the book has to kill him.

  No need to quote at me or give page numbers, I've read it.

  Give it to me as: 'Short answer' -- one paragraph on whether this is a wireheading novel at all; 'The mapping' -- about 400 words, what plays the role of reward channel, tamperer, objective and hack, a table is fine if thats easier; 'Where the lens strains' -- about 300 words on the disanalogies that actually matter, e.g. soma isn't direct stimulation of anything and the World State conspicuously doesn't collapse into uselessness the way the papers predict; 'What the novel sees that the papers don't' -- 250 words; and 'Scenes for the handout' -- four scenes, a line or two each, with what I should ask the group about each.
