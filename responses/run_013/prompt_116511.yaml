   - Dr. Classical: works in ZFC, sees the axiom of choice (AC) as a natural part of the iterative conception of sets.
   - Dr. Constructive: works constructively, views AC as a false existence claim.

   Important points to cover:
   1. Existence without a witness: Is it coherent?
   2. In constructive set theories (with separation), full AC implies the law of excluded middle (LEM), so the disagreement is about logic.
   3. The classical side concedes that without AC, we get measurability and the Baire property for every set of reals.
   4. Constructive side: the classical defense of AC is circular because it relies on a notion of definability that can't be stated for the whole language.
   5. Classical side must answer that circularity charge.

   The dialogue should be balanced and non-strawman. Each responds to the other's points.

