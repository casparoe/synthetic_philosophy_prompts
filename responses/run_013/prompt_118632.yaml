  I'm in a small reading group that's been grinding through the accuracy-first epistemology stuff — the program where you score a credence function for how accurate it is and then try to squeeze norms of rationality out of that. We meet in Cole's kitchen, and last week two of the others, Nadia and Cole, went at each other for about forty minutes while the rest of us sat there with our coffee going cold. I took notes. I genuinely couldnt tell who came out ahead, so I want you to referee it move by move — not just tell me who wins overall, but rate each move as it was actually made. Here's the exchange as best I can reconstruct it. (1) Nadia: the whole program rests on the dominance argument — any credence function that breaks the probability axioms is accuracy-dominated by some function that obeys them, so probabilism gets justified. But dominance reasoning only guides you if you can choose, and you can't just decide to have different credences. So the argument shows incoherent credences are suboptimal, not that anyone is irrational. (2) Cole: that conflates a defect with a fault — a broken leg is defective even if nobody broke it on purpose, and anyway you do have indirect control over your credences, you can go read more evidence, argue with yourself, and so on. (3) Nadia: fine, but then "defective" needs a standard, and the dominance argument only runs for one particular kind of scoring rule, which isn't a neutral fact about accuracy. Toy example: score each individual credence 1 point if it's on the right side of 0.5 (above 0.5 when the proposition is true, below when it's false), half a point if it's exactly 0.5, 0 otherwise, and add up. Take just P and not-P, so there are two possible worlds, and consider the incoherent pair 0.6 in P together with 0.6 in not-P. Under this rule it scores exactly 1 in each world, and I checked — no coherent pair does better in both worlds. So change the rule and the incoherence stops being dominated. And the standard proper score