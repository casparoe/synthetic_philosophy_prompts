            - Evidential decision theory: it would say that your action is evidence of what the majority is. If you choose to build, that is evidence that the majority is build, so the prediction is build, so you will get 10 for sure. Similarly, if you choose to ignore, that is evidence the majority is ignore, so you will get 10 for sure. Therefore, EDT says both actions are equally good. But note, in a large group, your action is only a small piece of evidence.

       - However, in this game, the causalist will try to guess the majority and follow it. The evidentialist will realize that whatever they do, they will (by the evidence of their own action) think that the majority will be that action, so they might as well do one or the other arbitrarily.

       - But in practice, because they have to coordinate, they might use focal points.

     What will predictably go wrong:
       - The students might not feel the time travel is credible.
       - They might coordinate on one action very easily (e.g., everyone builds) and then we don't see the tension.
       - They might not understand the payoff and think that they should always build, leading to a build majority and those who built win.

     To make it more tense, we can use a continuous version or a different payoff, but time is short.

     The part that the game can't reproduce:
       - The superintelligence: the predictor in the game is just a rule, not an intelligent being.
       - The infinities: the basilisk might threaten with infinite punishment, we use 0 and 10.
       - The metaphysics of simulation: in the basilisk, the AI might simulate you. In our game, the prediction is based on the group's majority, not on a simulation of the individual.

     We will have to explain these in the debrief.

     Timeline for the 90-minute seminar:

       0-5 min: Introduce the game, explain the rules, and have them choose privately on a piece of paper.
       5-10 min: Collect the choices and compute the majority.
       10-15 min: Announce the majority and thus the prediction for everyone, then score.
       15-30 min: Discuss in the group how they decided. Ask for volunteers to share their thought process.
