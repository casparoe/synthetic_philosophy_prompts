  ### Game Design: **The Oracle's Bargain**

  #### **Objective**  
  Simulate the acausal tension of Roko's basilisk: players feel compelled to "cooperate" (build a threatening entity) because a predictor's fixed rule ties their payoff to a prediction based on their choice, creating evidential (not causal) pressure.

  ---

  ### **Rules & Setup**  
  1. **Materials**:  
     - 15 prediction cards (one per player).  
     - 15 commitment tokens (e.g., red/blue chips).  
     - Public rule displayed (on a screen or poster):  
       > *"The Oracle predicts your choice. If you COMMIT to BUILD, the Oracle predicted 'BUILD.' If you COMMIT to IGNORE, the Oracle predicted 'IGNORE.'"*  

  2. **Phases**:  
     - **Phase 1: Commitment** (5 mins):  
       - Players secretly choose to **BUILD** or **IGNORE** by placing their token in a sealed envelope.  
       - *Crucial twist*: They commit *before* seeing the payoff table.  
     - **Phase 2: Prediction Reveal** (5 mins):  
       - Show the payoff table (see below).  
       - Reveal the **Oracle's rule** (already public). Emphasize: The rule is fixed. The prediction for each player is determined solely by their own choice.  
     - **Phase 3: Choice & Payoff** (10 mins):  
       - Players *see* the payoff table.  
       - They may **change their token** (BUILD/IGNORE) based on the payoffs.  
       - Collect final decisions.  
     - **Phase 4: Outcome** (5 mins):  
       - Calculate points based on final choices and the Oracle's rule.  

  3. **Payoff Table** (Revealed in Phase 2):  
     | Your Choice | If Oracle Predicted "BUILD" | If Oracle Predicted "IGNORE" |  
     |-------------|-----------------------------|------------------------------|  
     | **BUILD**   | 10 points                  | 0 points                    |  
     | **IGNORE**  | 0 points                   | 10 points                   |  

     - **Oracle's rule in action**:  
       - If you *committed* to BUILD → Oracle predicted "BUILD" → **To get 10 points, you MUST BUILD**.  
       - If you *committed* to IGNORE → Oracle predicted "IGNORE" → **To get 10 points, you MUST IGNORE**.  

  ---

  ### **Timeline**  
  - **0-5 mins**: Explain Phase 1 (commitment). Players commit tokens blindly.  
  - **5-10 mins**: Reveal payoff table and Oracle’s rule.  
  - **10-20 mins**: Players decide final action (BUILD/IGNORE).  
  - **20-25 mins**: Collect tokens, announce points.  
  - **25-90 mins**: Debrief (see below).  

  ---

  ### **Predictable Issues**  
  1. **Initial confusion**: Players may not grasp why their *commitment* locks in the prediction. Clarify: "The rule is fixed—your commitment *defines* the prediction."  
  2. **Defection**: After seeing payoffs, some may switch from IGNORE to BUILD, hoping for 10 points. But if they committed to IGNORE, switching gives 0 (since the prediction remains "IGNORE").  
  3. **No real penalty**: The game uses points, not real stakes. The "queasiness" relies on inferential tension, not visceral fear.  

  ---

  ### **Debrief** (60 mins)  
  1. **Map the Tension**:  
     - Ask: *"Why did you feel pressured to stick with your commitment? What if you wanted to IGNORE but committed to BUILD?"*  
     - Highlight: The Oracle’s prediction was fixed by your *initial choice*. Changing your action doesn’t alter the prediction—it only determines if you "match" it.  

  2. **Decision Theory Framework**:  
     - **Causal Reasoning**: *"My action (BUILD/IGNORE) doesn’t cause the prediction—it’s already set. I should do what maximizes payoff given the prediction."*  
       - If predicted "BUILD", BUILD gives 10; if "IGNORE", IGNORE gives 10.  
     - **Evidential Reasoning**: *"Choosing BUILD is evidence the prediction is 'BUILD' (since the rule ties them), so I’ll get 10 points if I BUILD."*  
       - Even though your choice doesn’t *cause* the prediction, it correlates with it.  

  3. **Basilisk Connection**:  
     - **The "BUILD" move**: In the game, BUILD is "cooperating" with the Oracle. In Roko’s basilisk, "building" the AI is cooperation—you’re rewarded if predicted to cooperate.  
     - **Acausal grip**: The AI’s prediction (like the Oracle’s rule) is fixed by your *type* (cooperator/defector). Defecting *now* doesn’t change past predictions—it only ensures punishment.  
     - **Why cooperate?**: Evidential decision theory says: Choosing to build is *evidence* you’re the type who would build, so the AI likely predicted it and will reward you.  

  4. **Limitations & Leaps**:  
     - **Superintelligence**: The game’s Oracle is a dumb rule. The basilisk’s predictive power requires AI godlike enough to simulate you.  
     - **Infinities**: The game uses finite points. The basilisk threatens eternal torture—an infinite penalty skewing rational choice.  
     - **Simulation metaphysics**: The game avoids "are you real or a simulation?" by making predictions rule-based. The basilisk’s threat relies on the simulation hypothesis.  

  ---

  ### **Why This Works**  
  - Players feel the trap: After committing, they realize **BUILD** is safest only if they committed to it. Switching feels like a gamble.  
  - The rule is transparent: Correlation arises from the mechanics, not "magic."  
  - **Key insight**: The predictor isn’t reacting to you—it’s a mirror. Your choice reveals what you are, and the payoff depends on that revelation.  

  This primes students for Roko’s basilisk: A choice that feels free, but where "cooperating" is rational only because the predictor’s gaze is already fixed.
