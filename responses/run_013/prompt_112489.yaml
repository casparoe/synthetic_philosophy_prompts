prompt: |-
  I'm a novelist — four books, all of them the sort where nothing much happens and everyone talks about their feelings — and I've got a craft problem that I suspect is really a philosophy problem wearing a coat.

  Let me give you my kit first, because it's the only vocabulary I actually trust. When I build a character I think in terms of an **engine**: the standing thing in them that makes them do what they do. An engine only shows itself on an **occasion** — a situation that gives it something to do. The scene where the reader first sees the engine work I call the **audition**; after that they read everything else through it, which is unfair but there it is. Some traits I've decided a character has never get an occasion at all — I call those **off-stage**. A **blocker** is something in the scene that stops the engine firing without touching the engine. A **trapdoor** is nastier: the very situation that would show the trait is the situation that takes it away, so the reader can never catch the character in the act. And **set-dressing** is the weather, the state of the kitchen, the way someone holds a cup — stuff that has nothing to do with the engine, that the reader cannot help reading as evidence about it anyway.

  Now: years ago I read two or three philosophy articles about dispositions and half-understood them. The gist, as I remember it: saying a glass is fragile isn't the same as saying it would break if you dropped it, because you can rig the case — something that changes the glass the moment it's dropped, or something that catches it, or a thing that would only break if it were *not* fragile. Some people took this to show that no amount of conditionals about manifestations adds up to the disposition itself, and that a disposition needs some kind of basis that isn't just a summary of what happens. I can't remember who said what and I don't need the names.

  What I want from you: restate that whole debate, as faithfully as you can, in my kit — engine, occasion, audition, off-stage, blocker, trapdoor, set-dressing. Then the residue report. Which parts of the philosophical position come across cleanly, which I've had to bend to fit, and which simply have no expression in my vocabulary at all — and same in reverse, what my kit says that the philosophers' apparatus can't. I'm especially interested in whether my audition and set-dressing ideas have any counterpart there, because it seems to me the philosophers take the conditions under which a trait shows itself as given, whereas for me choosing them is the whole job. My hunch is that the philosophy is the sharper of the two and my kit is just the same thing with mood lighting. Tell me if that's wrong.

  And then answer the question I actually care about, which is whether there's any honest way to say a character *has* a trait that never gets an occasion in the book, or whether, in a novel, where everything is a scene, a trait is only ever the sum of its scenes and the off-stage ones are my private sentimentality.

  Don't hedge and don't give me a both-ways list. Take a position, say which way the residue cuts, and give your reasons. Write it in British English.
reasoning: |-
  Okay, let me unpack this fascinating request. The novelist is asking me to bridge their creative framework with philosophical concepts about dispositions, then give a definitive answer about unexpressed character traits. 

  First, I need to map their writing terminology onto the dispositional realism debate. Their "engine" aligns neatly with a dispositional property, while "occasions" match manifestation conditions. The philosophical puzzle they recall is clearly the conditional fallacy problem - how disposition ascriptions resist reduction to simple "if-then" statements. 

  When they mention cases where a glass breaks only if not fragile, that's referencing finkish dispositions (like Martin's electroluminescent wire example). Blockers map to masks (like the antidote that prevents poison from working), and trapdoors sound like mimickers (where non-fragile items break under special conditions). 

  The residue analysis will show clean fits for engines/occasions/blockers, but trapdoors require bending since mimickers aren't quite identical to their concept. Set-dressing has no direct counterpart - philosophers don't address environmental cues influencing perception. The audition idea is completely absent in philosophy, which takes manifestation contexts as given rather than constructed.

  For their core question about off-stage traits, I'll take a hard position: in novels, unmanifested traits don't exist textually. The residue shows their kit is actually richer than philosophy here - by including audition and set-dressing, it accounts for how readers infer engines from selective evidence. But this very richness means off-stage traits are authorial sentiment, not textual reality. 

  The British English requirement means I'll use "trousers" instead of "pants" and "torch" not "flashlight", but more importantly adopt that tone of pragmatic clarity with occasional dry wit. No hedging - the answer must be that off-stage traits are indeed the author's private business, not the reader's experience.
answer: |-
  Right. Kit deployed, philosophers dragooned, no hedging. Here's the translation and residue report, then the answer to your question.

  **The Philosophical Debate in Your Kit:**

  1.  **The Core Disposition (The Engine):** This is the philosopher's "fragility" or "solubility" – the standing *thing* in an object (or person) that *is* its potential to behave a certain way under certain conditions. It's the underlying state, not just the behaviour.
  2.  **The Manifestation Conditions (The Occasion):** Dropping the glass (for fragility), putting it in water (for solubility). The specific situation that *should* make the engine fire.
  3.  **The Problem (Blockers & Trapdoors Galore):**
      *   **Finkish Dispositions (A Nasty Trapdoor):** Imagine a glass wired to a device that *instantly* makes it non-fragile *the moment* it starts to fall (or conversely, makes a non-fragile thing fragile only when dropped). The *occasion itself* (being dropped) alters the *engine* just before it could manifest. The perfect trapdoor: the very situation that *should* show fragility *removes* it (or creates it falsely). The conditional "If dropped, it breaks" fails here.
      *   **Masks (Sophisticated Blockers):** The glass *is* fragile (engine present), but it's packed in shock-absorbing foam when you drop it (blocker). The engine *would* fire under normal dropping conditions (the occasion), but this specific circumstance blocks the manifestation. The conditional "If dropped, it breaks" fails because of an external interferer, not because the engine isn't there.
      *   **Mimics (Another Trapdoor/Blocker Hybrid):** A non-fragile object (no engine) rigged to explode *only* when dropped *as if* it were fragile. It breaks when dropped, satisfying the conditional, but *not* because it possesses the engine of fragility. The occasion triggers a *different* mechanism.
  4.  **The Philosophical Stance:** Some philosophers argued these thought experiments show you *cannot* define the engine *solely* in terms of "if occasion, then manifestation" conditionals. There are always potential blockers, finks, or mimics that break the conditional link. Therefore, the engine (the disposition) must be a *real, categorical base property* within the object (or person) – something intrinsic that *grounds* the potential and explains *why* it *tends* to manifest under standard conditions, even if clever scenarios can thwart or fake it. It's not *just* the sum of its potential manifestations.

  **The Residue Report:**

  1.  **Clean Fits:**
      *   **Engine = Disposition:** This maps perfectly. The standing, internal "thing".
      *   **Occasion = Manifestation Conditions:** Direct equivalence. The triggering situation.
      *   **Blocker ≈ Mask:** Your blocker is a near-perfect fit for the philosopher's mask. An external factor preventing manifestation without altering the engine/disposition itself. Good kit.
  2.  **Bent to Fit:**
      *   **Trapdoor ≈ Finkish Disposition:** This is close, but your trapdoor focuses on the trait being *removed* by the occasion. Finkishness also includes cases where the disposition is *bestowed* only by the occasion (making the non-fragile *appear* fragile only when dropped). Your kit's trapdoor leans towards the "removal" scenario, but the core idea of the occasion itself sabotaging the evidence is shared. We've slightly bent "trapdoor" to cover both creation and destruction finks for this translation. The *consequence* (reader can't catch it) is identical.
  3.  **No Expression in Philosophy:**
      *   **Audition:** Philosophers take the *standard* manifestation conditions (occasion) as given or focus on defining them abstractly. The *presentational choice* – the specific *first time* you *show* the engine working to the *audience* for maximum impact and future interpretive framing – is entirely absent. This is your novelist's craft insight, not their metaphysical concern.
      *   **Set-Dressing:** Philosophers care about the *presence* or *absence* of blockers/masks (e.g., the foam packaging). They don't grapple with the reader's/observer's *tendency* to interpret *irrelevant* contextual details (the state of the kitchen) as *evidence* for or against the engine. This psychological/perceptual bias is outside their dispositional analysis.
      *   **Off-Stage:** While philosophers acknowledge dispositions *can* exist unmanifested, their debate centres on *how* we know they exist *despite* non-manifestation, not the *narrative significance* of *deliberately* keeping a trait off-stage in a constructed reality. The *choice* not to manifest it is a novelist's prerogative, not a puzzle about its ontological status for them.
  4.  **No Expression in Your Kit:**
      *   **The Categorical Basis:** Philosophers arguing *for* dispositions as real properties posit a non-dispositional, intrinsic *categorical base* (e.g., the molecular structure of the glass) that *grounds* the fragility. Your "engine" is presented as the fundamental trait; you don't delve into what *makes* it fundamental within the character beyond being the "standing thing". Your kit treats the engine as primitive for narrative purposes; they seek a deeper metaphysical layer.
      *   **Mimics:** Your kit doesn't explicitly have a term for something *lacking* the engine but *behaving* as if it has it under the occasion due to a different mechanism (like the rigged non-fragile object). It's implied in the complexity of "trapdoor" or general misreading, but not a distinct category like "blocker".

  **Is Your Kit Just Philosophy with Mood Lighting?**

  **No.** Your kit is sharper *for the novel*. The philosophers get tangled defining dispositions *against clever counterfactuals*. You grapple with *presentation and perception within a constructed, finite experience*.

  *   **Audition:** This is crucial. Philosophers don't care *which* dropping of the glass you witness first, or how it's staged. You *must*. It shapes the reader's entire lens. Your kit acknowledges the *rhetoric* of trait revelation.
  *   **Set-Dressing:** This is profound. Philosophers analyse the disposition and its direct blockers. You highlight the reader's *inescapable hermeneutic drive* – their compulsion to interpret *everything* as evidence, relevant or not. This speaks to the *reader-character contract* built on selective, staged evidence.
  *   **Off-Stage:** This is a *narrative choice* with consequences for reader understanding, not just a metaphysical possibility.

  Philosophy provides a rigorous framework for *what a trait might be*. Your kit provides a rigorous framework for *how it functions and is perceived within the artifice of a story*. Yours accounts for the audience and the author's curatorial role. Philosophy doesn't need to.

  **Your Question: Off-Stage Traits - Sentimentality or Substance?**

  **In a novel, where everything is a scene, an off-stage trait is authorial sentimentality, not textual substance for the reader.** It is not an "honest" way to say the character *has* it *within the world of the book as experienced by the reader*.

  **Why (The Residue Cuts This Way):**

  1.  **The Audition is King:** Your own principle. The reader needs to *see* the engine fire at least once (the audition) to believe in it and interpret subsequent behaviour (and set-dressing!) through it. Without that audition, the engine is just authorial assertion. The reader has no textual hook.
  2.  **Set-Dressing Demands an Anchor:** Readers *will* interpret set-dressing as evidence. But for that evidence to cohere into a *trait*, it needs an anchor point – the audition. Without the audition, set-dressing related to an off-stage trait is just ambiguous noise, likely misinterpreted as evidence for a *different*, manifested trait, or simply irrelevant detail. You can't control the inference without the foundation.
  3.  **"Has" Requires Manifestation Potential:** The philosophical debate *reinforces* this. While the disposition *can* exist unmanifested, its *reality* is tied to its *potential* to manifest under *suitable, unblocked occasions*. In a novel, the *only* suitable occasions are the scenes you write. If you *never* provide an unblocked occasion (no blocker, no trapdoor), you never demonstrate that potential within the narrative reality. You only assert it exists.
  4.  **The Trapdoor Problem for Off-Stage Traits:** How does the reader *distinguish* a genuine off-stage trait from a *finkish trapdoor* invented post-hoc? If the trait never manifests, perhaps the *very occasions that might have revealed it* were precisely the occasions that (unknown to the reader) triggered a finkish removal or blocker. Without a manifestation, there's no evidence against this being the case. The off-stage trait becomes indistinguishable from authorial special pleading.
  5.  **Novel as Finite Scenic Reality:** A novel is not the real world with infinite potential occasions. It is a closed system of presented scenes. A trait that *never* finds expression within that system – not even indirectly through irrefutable consequences of its *past* action (which would still be an on-stage *effect*, not the trait manifesting) – exists only in the notes, the backstory, the author's mind. It is part of the *generative machinery*, not the *textual artifact*.

  **The Honest Way?** You can *imply* an off-stage trait *heavily* through:
  *   **Character Dialogue/Thought:** Others *say* the character has it, or the character *thinks* they have it (but this risks being unreliable or self-delusion without manifestation).
  *   **Consequences:** Show the undeniable *effects* of the trait operating *off-stage* (e.g., a character is inexplicably terrified of water; we never see the near-drowning, but the effect is real and present *on-stage*). This is the trait manifesting *indirectly* as a *state* (fear), not the core engine *firing* (the near-drowning event).
  *   **Set-Dressing Misdirection:** Use set-dressing the reader *would* associate with a trait... but crucially, without the audition, this remains ambiguous. Is the pristine kitchen evidence of fastidiousness, or just a cleaner visited?

  However, these are *inferences* the reader *might* make, or *effects* of the trait. They are not the direct manifestation of the engine itself on an occasion. They are clues, not the act. The core engine *as a driving force within the narrative present* remains unproven, existing only in the realm of authorial intent and backstory. It is sentiment, texture, perhaps even necessary scaffolding for *you* – but for the *reader* navigating the scenes, it is not an established component of the character *as presented*. It is potential unrealised within the text.

  The residue cuts clearly: your kit's focus on *audition* and the reader's hermeneutic drive via *set-dressing* demands manifestation for textual reality. Philosophy's struggle to define dispositions *without* manifestation paradoxically supports this – if it's so hard to pin down *even with conditionals*, how much harder is it to assert *without any manifestation at all* within the finite bounds of a novel? The off-stage trait is yours alone. On the page, only what fires counts.
