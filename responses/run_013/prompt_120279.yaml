answer: |-
  Reverend Father,  

  I appreciate your thoughtful engagement with my letter to Her Serene Highness, and I respect your commitment to the authority of the Council of Trent and the wisdom of the Fathers. You rightly emphasize that Scripture must not be interpreted against the Church’s perpetual understanding or the unanimous consent of the Fathers. Yet I must question whether such unanimity truly exists on this particular matter. While many Fathers did indeed describe the sun as moving and the earth as fixed, they often did so while acknowledging their reliance on the astronomical knowledge of their time, not as a divinely revealed truth. For instance, St. Augustine, in his commentary on Genesis, cautions that when Scripture speaks of natural phenomena, it accommodates common speech and should not be read as a technical treatise on the heavens. Thus, the Fathers’ interpretations reflect the science of their era, not an article of faith binding for all time.  

  You argue that Scripture’s use of everyday language explains God’s choice of words but does not permit mathematicians to redefine their meaning. Yet if Scripture’s purpose is to guide souls to salvation—not to settle debates in natural philosophy—then it speaks of the sun’s motion or the earth’s stability phenomenologically, as these things appear to human senses. The miracle in Joshua, for example, required halting the sun’s apparent motion to prolong daylight; whether this resulted from stopping the sun or the earth does not alter the divine power at work. Similarly, the psalmist’s bridegroom metaphor poetically describes the sunrise as we observe it, not the sun’s true motion in the cosmos. Interpreting these passages literally, as if they were physical demonstrations, risks conflating the language of devotion with the language of nature.  

  As for demonstration, I freely admit I have not yet proven the earth’s motion with the certainty of a geometric proof. What I offer is not mere conjecture but a system that far better "saves the appearances" than Ptolemy’s. Through the spyglass, I have seen Jupiter’s moons revolve around it, demonstrating that celestial bodies can orbit a center other than Earth. I have observed the phases of Venus, which align perfectly with Copernicus’s model but are inexplicable in Ptolemy’s. These are not fancies but observed facts, inviting us to reconsider Aristotle’s cosmology. If the Church declares Earth’s rest a certainty based on a literal reading, it risks opposing a future demonstration from God’s own book of nature.  

  Who, then, should judge questions touching faith? The Church, without doubt, holds authority over faith and morals. But when Scripture speaks of natural phenomena, it does so without intending to teach science. Thus, where no article of faith is at stake—and none is explicitly defined here—the Church might wisely allow natural philosophers to pursue truth through observation and reason. To silence this inquiry preemptively would be to deny that God reveals Himself through both Scripture and nature.  

