prompt: |-
  I just got drafted onto my hospital's ethics committee and, long story short, I'm the one helping rewrite our policy for when there aren't enough ventilators or ECMO circuits to go around. I'm a nurse, this is all new to me, I said yes because nobody else would. Reading around, I keep noticing that everyone jumps straight to the answer without saying what an answer even has to do, and I have a suspcion the whole fight lives in that gap. So before we draft anything I want the spec, not the verdict.

  Tell me what any decent theory of when the numbers count has to deliver. The case I mean is: you can save these people or those people, not both -- five vs. one, or one very sick patient vs. three less sick ones, that kind of thing. I want the list of requirements, each with the case or consideration behind it: the cases it has to get right, the distinctions it can't just collapse, the stuff it can't be allowed to say.

  Things I specifically want you to take a position on, as requirements or not:

  - The plain five-vs-one case, and the coin-flip line I keep running into (Taurek?) that says if every life counts the same then five don't outweigh one, so you're just as entitled to save the one. Does the theory have to get five-vs-one "right," and right according to who?
  - The one-vs-one case where nothing distinguishes them. Does the theory owe me a verdict, a permission, or a coin?
  - Adding someone who can't be helped. If numbers count because of how many there are, what happens when you add a sixth patient who will die no matter what, or a sixth whose claim is trivial (sprained ankle)? Does the number change? Should it? It feels like any theory that lets numbers count has to say something here, and the something tends to be ugly.
  - One person's life vs. five people's fingers. If five small claims can gang up and outweigh one big one, say so and own it; if not, tell me where the cutoff is and why.
  - "The numbers as a tiebreaker" vs. "the numbers as a weight." Those aren't the same thing and I think people slide between them without noticing.
  - The separateness thing: I can't trade one person's life for the convenience of the many, people aren't buckets in a total. But that seems to sit right on top of "five beats one." If those two can't both be had, thats the single most useful thing you can tell me -- flag it hard, tell me which one you'd give up, and why.
  - Framing. Same situation, same answer, whether I describe it as saving five or as letting one die. And the same policy whether the person applying it is a bystander, one of the patients, or the mother of one.
  - The boring constraints: a night-shift nurse has to apply this in ten minutes with only what's on the chart, and we have to be able to explain the reason to a family, and later to a reporter, without it sounding like we priced their mother.

  Then, briefly: which single requirement you think knocks out the most theories people actually hold. And where you come down. Please commit -- give me a definite answer with your reasons, not a menu of options and a shrug. If you think the list can't be satisfied all at once, say which requirement you'd drop.
reasoning: |-
  Okay, the user is a nurse newly drafted onto a hospital ethics committee, tasked with rewriting the ventilator/ECMO allocation policy. They're frustrated that existing frameworks jump to answers without clarifying what makes an answer ethically valid. They want a specification—a list of requirements any decent theory must satisfy—before drafting policy.

  Hmm, they're smart to focus on foundational principles first. As a nurse, they've likely seen how abstract ethics crumbles under real-world pressures. Their suspicion about "the fight living in the gap" rings true—most allocation debates stem from unspoken disagreements about what criteria even matter.

  Let me unpack their explicit asks:  
  First, the five-vs-one case. They're referencing Taurek's coin-flip argument where saving the greater number isn't morally obligatory. This is crucial because if a theory can't handle this baseline, it fails. But "right according to who?" is sharp—they recognize legitimacy matters as much as logic.  

  Then one-vs-one indistinguishables. Must the theory dictate action or allow randomness? This probes whether ethics requires determinism.  

  Adding hopeless cases (like the sprained ankle patient) tests if "numbers" mean "salvable lives" or just bodies present. Spotting this edge case shows their practical insight—real triage includes bystanders.  

  The life-vs-fingers question targets aggregative logic: can small harms sum to outweigh a large one? If not, where's the line? They're right that theories waffle here.  

  Numbers-as-tiebreaker vs. weight is subtle but vital. Tiebreakers imply near-equal claims; weights imply commensurability. Conflating these smuggles in assumptions.  

  The separateness-of-persons point is profound. Can utilitarianism ("save more lives") coexist with deontology ("don't sacrifice individuals")? If not, which bends? This might be the core tension.  

  Framing invariance—same outcome whether phrased as saving or killing—is about cognitive bias. And agent-neutrality (bystander vs. family) tests impartiality.  

  Practical constraints matter too: nurses need clear, chart-based rules that sound humane to families. No theory survives if it can't be operationalized.  

  ...Now synthesizing requirements:  
  For five-vs-one, any credible theory must prioritize the five. Taurek's coin flip is intellectually elegant but fails clinically—hospitals can't flip coins when outcomes are measurable. Legitimacy here comes from democratic endorsement, not moral "truth."  

  One-vs-one: Must permit randomization. Forcing distinction where none exists is unethical.  

  Adding non-salvable patients: Numbers only count if intervention changes outcomes. The sprained ankle doesn't get a "vote" for vents.  

  Life vs. fingers: Harm aggregation stops at irreversible loss/disfigurement. Five fingers don't equal one life because survival isn't fungible.  

  Tiebreaker vs. weight: In true scarcity, numbers are weights, not tiebreakers. But clarity is key—don't pretend it's close when it's not.  

  Separateness vs. numbers: Here's the rub. We must both affirm individual inviolability AND aggregate when forced to choose. The compromise: aggregation only when (1) differences are significant AND (2) no non-comparable factors (e.g., prognosis).  

  Framing/agent-neutrality: Non-negotiable. If framing changes outcomes, the system is arbitrary.  

  Practicality: Rules must be clinically operational. Prognostic scoring > philosophical nuance.  

  ...Biggest knockout requirement? Probably the "adding hopeless cases" test. Many theories implode by counting non-claims or overaggregating.  

  My stance: Prioritize prognosis-weighted life-years. Why? It satisfies most requirements:  
  - Saves more life in five-vs-one (if prognoses similar)  
  - Uses randomizers for ties  
  - Ignores non-salvable patients  
  - Excludes non-mortal harms  
  - Treats numbers as weights  
  - Respects separateness by valuing each life-year equally  
  - Framing-invariant and agent-neutral  
  - Clinically actionable (e.g., SOFA scores)  

  ...Would I drop anything? The "perfect" tiebreaker. Sometimes random choice IS the answer, and that's okay. Forcing granular distinction corrupts the process.  

  Final note for the user: Stress that no policy prevents tragedy; it only distributes it justly. Prepare them for grief either way—but with clear principles, they can defend decisions without pricing lives.
answer: |-
  You're absolutely right to demand specifications before solutions—this is where most ethical frameworks fail under pressure. Below is a requirements list ("the spec") for any ventilator/ECMO allocation theory in true scarcity. Each requirement is grounded in non-negotiable realities of clinical practice, moral consistency, and human dignity. I’ll flag conflicts explicitly and conclude with my verdict.  

  ### Core Requirements for a Decent Allocation Theory  
  1. **Correctly Resolve 5-vs-1 (No Taurek Allowed)**  
     - *Requirement*: The theory **must** prioritize saving five over one when all else is equal.  
     - *Why*: Taurek’s coin-flip (equal chance for all, regardless of numbers) collapses under two tests:  
       - *Clinical reality*: If you save the one, five die; if you save five, one dies. Refusing to choose is functionally identical to saving the one.  
       - *Legitimacy*: Families, courts, and the public will deem a coin flip for 5-vs-1 as reckless abandonment of duty.  
     - *Caveat*: "All else equal" matters (e.g., identical prognosis). If not, see tiebreakers below.  

  2. **One-vs-One Indistinguishables Demand Randomization**  
     - *Requirement*: When two patients have identical claims (same prognosis, age, etc.), the theory **must** permit randomization (e.g., lottery).  
     - *Why*: Forcing a choice without a relevant distinction is arbitrary discrimination. Randomization is the only fair way to acknowledge moral equivalence.  

  3. **Numbers Count Only for Salvable Lives**  
     - *Requirement*: Adding a patient who cannot be saved (e.g., terminal cancer) or whose need is trivial (sprained ankle) **must not** alter priority between others.  
     - *Why*: Only claims that can *actually be met* by the intervention matter. Including non-salvable patients distorts the "numbers" into a false aggregate (e.g., "6 at risk" vs. "5 salvageable + 1 terminal"). This avoids "ugly math" that sacrifices the savable for a statistical illusion.  

  4. **No Aggregation of Non-Comparable Harms**  
     - *Requirement*: Five fingers ≠ one life. The theory **must** reject aggregating trivial/non-mortal harms to outweigh mortal ones.  
     - *Why*: Life-saving resources exist to *prevent death*. Once you allow small harms to "add up" against a life, you permit sacrificing a person for diffuse convenience (e.g., "1000 minor pains outweigh one death"). The cutoff is **irreversible loss of survival capacity**.  
     - *Corollary*: If the harm is *also mortal* (e.g., five needing ventilators vs. one), aggregation applies.  

  5. **Numbers as Weight, Not Tiebreaker**  
     - *Requirement*: The theory **must** treat "more lives" as a primary weight, not a last-resort tiebreaker.  
     - *Why*: If numbers only break ties, you imply all lives are "nearly equal" in claim strength—but in true scarcity, a 5% survival difference *should* tip the scale. Treating numbers as tiebreakers leads to paralysis when prognoses differ slightly.  

  6. **Respect Separateness of Persons Without Collapsing into Numbers**  
     - *Requirement*: The theory **must** both (a) prioritize saving more lives, AND (b) prohibit "trading" a life for non-life interests.  
     - *Conflict Resolution*: **This is possible** if the theory:  
       - Values each life equally but prioritizes *groups* only when forced by scarcity.  
       - Uses **prognosis-adjusted life-years** (e.g., saving 40-year-olds over 80-year-olds *only* if survival/life expectancy differs significantly).  
     - *Why*: The separateness objection ("don’t sacrifice one for the many") fails in true scarcity: *someone* dies regardless. Refusing to choose isn’t neutrality—it’s passive sacrifice of the larger group.  

  7. **Framing and Agent-Neutrality**  
     - *Requirement*: The outcome must be identical whether described as "saving A" or "not saving B." The rule must apply equally to bystanders, patients, or family members deciding.  
     - *Why*: If framing changes decisions, the system is irrational. If agent-role changes outcomes (e.g., a mother may save her child), the policy is ungovernable.  

  8. **Operational Feasibility**  
     - *Requirement*: Criteria must be:  
       - **Chart-visible** (e.g., age, diagnosis, SOFA score).  
       - **Time-limited** (decisions in <10 mins).  
       - **Communicable** without sounding like "pricing lives" (e.g., "prioritizing those most likely to survive with this treatment").  

  ### The Knockout Requirement  
  **"Numbers Count Only for Salvable Lives" (Requirement #3) eliminates most popular theories.** Utilitarianism fails by counting non-salvable lives; "save the youngest" schemes fail when adding a healthy 20-year-old with a sprained ankle shouldn’t override a salvageable 60-year-old. Theories that can’t filter *relevant claims* collapse here.  

  ### My Verdict: Where I Come Down  
  **A modified Prognosis-First Utilitarianism satisfies all requirements.** Here’s the framework:  
  1. **Tier 1: Salvability**  
     - Only patients who *can* be saved by the intervention are in the pool. Exclude: non-candidates (e.g., terminal illness), trivial claims (non-mortal).  
  2. **Tier 2: Prognosis-Adjusted Life-Years**  
     - Prioritize patients with the best chance of **long-term survival post-intervention**. Use objective metrics (e.g., SOFA score for vents, RESP score for ECMO).  
  3. **Tier 3: Numbers as Weight**  
     - If prognoses are similar (e.g., ≤5% survival difference), save the larger group.  
  4. **Tier 4: Randomize True Ties**  
     - If all else is identical, use lottery.  

  **Why this works**:  
  - **5-vs-1**: Saves five (Requirement #1).  
  - **1-vs-1**: Randomizes if identical (Requirement #2).  
  - **Ignores non-salvable/trivial additions** (Requirement #3).  
  - **Life > fingers** by excluding non-mortal harms (Requirement #4).  
  - **Numbers as weight, not tiebreaker** (Requirement #5).  
  - **Respects separateness**: Values each life equally but acknowledges forced choice (Requirement #6).  
  - **Framing-invariant and agent-neutral** (Requirement #7).  
  - **Operational**: Uses existing clinical scores (Requirement #8).  

  **What I’d Drop if Forced**: Perfect agent-neutrality for family members. In practice, next-of-kin shouldn’t decide between their child and strangers—but the *policy* must remain agent-neutral, with recusal protocols.  

  **Final Note**: No theory prevents grief. But this spec forces clarity: you’re not "choosing who lives," you’re *minimizing preventable death* under constraints. That’s defensible to families, reporters, and your own conscience.  

  If your committee resists, ask: "What does your alternative *require* to be true?" That gap is where ethics committees fail. Close it first.
