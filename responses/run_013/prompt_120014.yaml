prompt: |-
  I run a small telly drama outfit and I keep having the same arguement in different rooms, so I want to settle it properly.

  We adapt real lives. Right now it's a woman who ran a refuge in the 1870s — dead 140-odd years, no descendants anyone can find. Episode three gives her a screaming row with her sister that isn't in any source, because otherwise episode three is her writing letters. Episode five puts her at a deathbed she provably wasn't at, because that's where the guilt in her diary comes from. Our head of legal shrugs: she's dead, you can't libel the dead, crack on. Our script editor says that's a cop-out, we owe her something. Both of them keep saying we owe and we don't owe as if it were obvious what that even means, and I've realised I dont have a view. I'd like one, and I'd like it to be the kind I can actually use — first to make the call, then to defend it to a furious family in a hotel bar.

  So before I read one more think-piece about truth versus drama, give me the spec. What does any half-decent account of what we owe the real dead when we dramatise them have to be able to deliver? I want the requirements list — the cases it has to get right, the distinctions it can't just collapse, the things it can't contradict — with the case sitting behind each requirement, and a note on which ones are genuine requirements and which are just one camp's taste dressed up as a principle. If some of them can't be held together at once, say so and say which pair, because I suspect there's one and that it's doing all the work.

  Cases we keep tripping over, in case they're any use:

  - the invented scene that's psychologically bang on and factually invented;
  - the composite — two real women quietly welded into one;
  - the one we only know from a court record, so the only scenes we can document are the worst week of her life, and inventing her a happier Tuesday might be the fairer thing to do;
  - the one who asked for her papers to be burned, and someone didn't burn them;
  - the one who was genuinely awful, with a family who'd rather that never got made;
  - the one whose own account of herself the archive contradicts — she says she was content, the letters say otherwise, and I can't tell which of the two we're supposed to be faithful to;
  - the one who's a symbol to a community, so any version of her gets read as a verdict on them;
  - and the caption at the end saying some scenes were imagined — does that discharge anything, or is it a fig leaf?

  Two last things. Does it matter that this is telly and not a novel or a history? I think it might, and I'd like you to say why. And if you want to close by saying how the obvious camps come out against the list, keep it to a paragraph.

  No reading lists please, and don't tell me which dead philosophers said what — I want the criteria, not the cast.
reasoning: |-
  Okay, the user runs a small TV drama outfit and is struggling with ethical questions about adapting real lives, specifically a 19th-century woman who ran a refuge. The core issue is determining what they owe to real deceased individuals when dramatizing their stories. The head of legal says there's no legal issue since libel doesn't apply to the dead, but the script editor argues there's still an ethical obligation. The user wants a practical framework to make and defend decisions, avoiding abstract debates.

  The user provided several recurring cases they encounter, which are crucial for testing any ethical framework. These include invented but psychologically accurate scenes, composite characters, individuals known only from negative records, violated wishes of the deceased, portraying genuinely awful people, conflicting sources, individuals important to communities, and the effectiveness of disclaimers. Each case presents unique challenges and must be addressed by the framework.

  The user also wants to know if the medium (TV vs. novel or history) matters, which it does because TV's visual and narrative impact makes portrayals feel more "real" to audiences, heightening ethical responsibilities. Additionally, they want a brief comparison of how different camps (e.g., legalists vs. moralists) stack up against the framework without delving into philosophical debates.

  To build the framework, I need to identify non-negotiable requirements. These should cover preventing harm to living people, respecting autonomy, avoiding deception, maintaining public trust, and ensuring consistency. Each requirement must have a case-based justification and distinguish between genuine obligations and subjective preferences.

  Key requirements include: preventing tangible harm to the living, respecting the subject's known wishes (if documented), not falsifying undisputed facts, maintaining audience trust by signaling fictionalization, handling symbols with care due to community impact, and balancing historical context with character coherence. Conflicts arise between autonomy (wishes) and harm prevention, especially when wishes lead to misrepresentation. Medium specificity matters because TV's reach amplifies both impact and responsibility.

  Finally, the camps: legalists focus on harm prevention and dismiss other requirements as taste, while moralists prioritize autonomy and truthfulness, seeing harm prevention as baseline. The framework forces both to confront cases where their principles clash, like unburned papers or contested legacies.
answer: |-
  Here's the spec – the core requirements any defensible account of "what we owe the real dead" must meet, grounded in your recurring cases and designed for practical TV drama decision-making:

  **The Non-Negotiable Requirements (Genuine Obligations):**

  1.  **Prevent Tangible Harm to the Living:** *Requirement.*
      *   **Case:** The genuinely awful person, the symbol to a community.
      *   **Why:** Your portrayal can cause real distress, damage reputations of living descendants/community members, or incite harassment. Legal says "no libel," but ethics demands considering wider harm. "Furious family in the hotel bar" is a tangible consequence. This trumps most other concerns.
      *   **Distinction:** Harm vs. mere discomfort or disagreement. Disliking a portrayal isn't harm; credible threats or targeted reputational damage is.

  2.  **Respect Explicit, Documented Wishes (If Known & Specific):** *Requirement (with caveats).*
      *   **Case:** The one who asked for her papers to be burned.
      *   **Why:** It's a direct violation of autonomy. Using material someone explicitly sought to destroy feels like a fundamental breach of trust, even posthumously. It signals disrespect.
      *   **Caveat:** "If known & specific" is crucial. General desires for privacy are vague. Unproven oral traditions about wishes are weaker. The *act* of defiance (someone not burning them) complicates but doesn't erase the ethical weight.
      *   **Distinction:** Documented, specific wish vs. assumed privacy expectations.

  3.  **Avoid Deliberate Deception of the Audience:** *Requirement.*
      *   **Case:** The caption at the end – is it a fig leaf?
      *   **Why:** Presenting fiction *as* unvarnished fact violates audience trust and misrepresents history. Viewers deserve to know the nature of the contract: this is *drama inspired by*, not a documentary.
      *   **Delivery:** A clear, upfront disclaimer ("inspired by true events," "dramatized," "some characters and events have been fictionalized") is essential. Burying it in tiny credits doesn't cut it. It doesn't *discharge* other obligations, but it *enables* the audience to engage appropriately.
      *   **Distinction:** Signposting fictionalization vs. claiming absolute historical fidelity where none exists.

  4.  **Handle Symbols with Care (Recognize Representational Weight):** *Requirement.*
      *   **Case:** The one who's a symbol to a community.
      *   **Why:** When a figure embodies a community's struggle or identity, fictionalizing them isn't just about the individual; it feels like a verdict on the group. Ignoring this weight risks perpetuating harm or erasure.
      *   **Distinction:** Portraying an individual vs. portraying an individual *who carries immense symbolic significance for a living group*. The obligation is to the *living community*, not just the dead person.

  **The Contextual Requirements (Balancing Acts, Often Mistaken for Absolutes):**

  5.  **Strive for Character Coherence/Plausibility (Not Absolute Fidelity):** *Contextual Principle (Often Dressed as Obligation).*
      *   **Cases:** The invented scene that's psychologically bang-on; the composite character; inventing a happier Tuesday; her own account vs. the letters.
      *   **Why:** Drama needs narrative logic and compelling characters. Slavish devotion to every fragmented fact can create an incoherent or dramatically inert character. Plausibility based on evidence is key.
      *   **Distinction:** *Inventing* plausible motivations/actions based on known evidence vs. *contradicting* core, undisputed facts about character or events. Faithfulness to the *spirit* inferred from evidence vs. the *letter* of fragmented records.
      *   **Not Absolute:** "Psychological bang-on" can be subjective. The "fairer thing to do" (happier Tuesday) is taste, not obligation – the obligation is to avoid *distortion*, not manufacture balance.

  6.  **Acknowledge Historical Context & Constraints:** *Contextual Principle.*
      *   **Case:** Only knowing her from court records (worst week); archive contradicting her own account.
      *   **Why:** People exist within their time. Judging 1870s actions by 2024 standards without context is poor history *and* poor drama. Understanding *why* she might claim contentment while letters suggest otherwise (e.g., societal expectations, denial, different definitions) is crucial for a truthful *portrayal*, even if the exact events are dramatized.
      *   **Distinction:** Dramatizing within understood historical constraints vs. imposing modern sensibilities anachronistically onto characters.

  7.  **Maintain Narrative Integrity (For the Story Being Told):** *Contextual Principle (Strongly Tastes Like Taste).*
      *   **Cases:** Episode 3's invented row (vs. letter writing); deathbed scene she wasn't at; composite character.
      *   **Why:** TV drama needs pace, conflict, visual storytelling. An hour of letter-writing doesn't work. The core emotional truth (e.g., the guilt from the diary) might *demand* a dramatic device like the deathbed scene, even if literally fabricated.
      *   **Distinction:** Essential narrative compression/dramatization for the medium vs. gratuitous invention that fundamentally alters the core meaning of the person's life or actions. This is the most frequent battleground and where "taste" often masquerades as "principle." The test is: *Does this invention serve the deeper truth we've inferred, or replace/subvert it?*

  **The Inherent Conflict:**

  *   **Autonomy/Documented Wishes vs. Harm Prevention:** This is the core tension doing much of the work.
      *   **Case:** The unburned papers. Publishing them respects the audience's right to know/engage with history but violates her explicit wish. Publishing them *might* also cause harm to living individuals mentioned. Suppressing them respects her autonomy but potentially obscures historical truth or prevents a story deemed important.
      *   **Resolution (Practical TV):** There's no perfect answer. The framework forces you to weigh: How specific/documented was the wish? How significant is the material to the core story? What *specific, likely* harm could publication cause *now*? Acknowledge the violation explicitly if you proceed.

  **Why TV is Different:**

  1.  **Mass Audience & Perceived Reality:** TV reaches millions. Its visual, immersive nature makes portrayals feel intensely "real" to viewers in a way novels (explicitly fictional) or dry histories (explicitly analytical) often don't. The potential for widespread impact (both good and bad) is amplified.
  2.  **Narrative Compression & Necessity:** The constraints of screen time (e.g., 6x60 mins) *force* invention, compression, and visual dramatization far more than a novel or academic history. The obligation shifts towards capturing the *essence* plausibly within these constraints, rather than exhaustive detail.
  3.  **Public Trust:** Viewers often conflate "based on a true story" with documented fact. TV has a higher burden to signal its fictionalization clearly and responsibly due to this inherent trust (or potential for misunderstanding).

  **How the Camps Stack Up Against the Spec:**

  *   **"Legal/No Owe" Camp:** Focuses solely on Requirement 1 (Prevent Tangible Harm/Legal Liability) and Requirement 3 (Avoid Deception via disclaimers). They dismiss Requirements 2 (Wishes), 4 (Symbols), 5-7 (Plausibility/Context/Integrity) as mere taste or drama necessities, arguing the dead have no interests to protect. They fail on the symbolic community case and the unburned papers wish.
  *   **"Moral/Owe Big" Camp:** Prioritizes Requirement 2 (Wishes), Requirement 4 (Symbols), and Requirement 5 (Absolute Fidelity/No Invention), often treating 5 as absolute. They see disclaimers (3) as inadequate fig leaves. They struggle with the practical necessities of TV (7), the need for plausible invention where records are silent/damning (Happier Tuesday, composite), and can be paralyzed by conflicting sources. They sometimes conflate potential discomfort with tangible harm (1).

  **Your Framework in Action (For the 1870s Refuge Runner):**

  1.  **Harm Check:** No living descendants identified. Is she a potent symbol for a vulnerable community *today*? (e.g., domestic violence survivors, historians of social work)? If yes, Requirement 4 kicks in – consult sensitively. If not, Requirement 1 likely satisfied.
  2.  **Wishes Check:** Any documented wish regarding her story? (Unlikely, but verify). If no, Requirement 2 doesn't apply.
  3.  **Deception Check:** Clear "Dramatized" / "Inspired by True Events" disclaimer upfront? (Essential - Requirement 3).
  4.  **Symbol Check:** Covered in (1).
  5.  **Plausibility/Context:** The invented row (Ep3) - Does it reflect tensions *inferred* from letters/other evidence? Is it plausible for her character/time? If yes (Requirement 5), likely OK. The deathbed scene (Ep5) - It's fabricated, but does it *accurately externalize the internal guilt documented in her diary*? Does it feel true to the emotional core revealed by the source? If yes (serving Requirement 7 via Requirement 5), likely defensible *if* signposted by the disclaimer. Avoid contradicting known facts (e.g., if she was demonstrably across the country that day).
  6.  **Defending in the Bar:** "We found no descendants. We used disclaimers to signal dramatization. The row wasn't documented, but letters showed deep tension with her sister – we externalized that dramatically. She wasn't at the deathbed, but her overwhelming guilt *is* in her diary – we created a scene to visualize that internal truth for the screen, believing it served her emotional reality more faithfully than just voiceover. We aimed for plausibility based on her known life and times."

  This framework forces explicit consideration of concrete consequences (harm, wishes, deception, community impact) while acknowledging the necessary dramatic tools of TV, grounding them in evidence and plausibility, not just convenience. It makes the trade-offs visible and defensible.
