prompt: |-
  I've been going back and forth with a friend about whether lying is actually worse than just misleading someone, and I want to know if there's a principle behind how I feel about it. Can you take the role of a philosopher who works on deception, treat my gut reactions as data, and think it through carefully before you answer? Maybe start by sorting the cases into groups and saying what the grouping seems to track, then commit to a rule.

  Here's where I've landed:

  - Telling my boss I have a dentist appointment when I don't, to duck a call I don't want: a lie, and I feel a bit grubby about it, but it's minor.
  - Same call, saying "I've got a prior commitment" when the commitment is watching the game: I feel fine about this one, even though he's just as fooled.
  - Selling my old car and saying "it's been reliable for me" when I know the transmission is going: this feels like a lie to me, and worse than the dentist thing, even though every word is true.
  - A company rep saying "our supplement is FDA-approved" when only one ingredient is: worse still, and I think it's worse *because* it hides behind the literal truth.
  - The murderer at the door asking where my friend is. "He's not here" (a lie) or "I haven't seen him since this morning" (true, if it is): both fine.
  - Telling my brother something false that he doesn't believe anyway, just to wind him up: technically a lie, but I don't think it's wrong at all.
  - Telling my partner "I was out with Dave" when Dave was there and so was someone I shouldn't have been with: nearly as bad as lying straight out.

  I've heard the word "paltering" for that true-but-misleading move — using a carefully chosen true statement to steer someone to the wrong conclusion — and it's the one I can't place.

  The story I tell myself is that a lie puts the false thing into someone's head while paltering just lets them put it there themselves, so the second is more their own doing. But the car and the FDA cases make me think that's just me letting myself off the hook.

  So: is there one rule that gets most of these, and what does it say about cases I haven't listed — lying to someone who already knows I'm lying, or just staying quiet and letting them assume? And which of my verdicts do I have to give up to keep the rule clean? Please don't just tell me "lying is worse" or "it depends how much harm it does" — I want the actual principle, stated so I could apply it, plus an honest note on where it breaks.
reasoning: |-
  Okay, I need to approach this user's query carefully. They're asking me to role-play as a philosopher specializing in deception, using their gut reactions as data to find a principle that explains why some deceptions feel worse than others. The user has provided several concrete examples with their moral intuitions clearly laid out, and they specifically want me to avoid simplistic answers like "lying is worse" or "it depends on harm." 

  Looking at their cases, the key patterns emerging are: 
  - The dentist lie (explicit falsehood) feels minor but grubby 
  - The "prior commitment" evasion (technically true) feels acceptable even though equally deceptive 
  - The car sale comment (truthful but misleading) feels worse than the dentist lie 
  - The FDA approval statement (technically true but misleading) feels even worse 
  - Lying to a murderer feels justified 
  - Teasing lies to a skeptical brother feel harmless 
  - Partial truths to a partner feel nearly as bad as outright lies 

  The user mentions "paltering" as their sticking point - that specific technique of using truth to mislead. Their self-proposed explanation (that paltering makes the victim complicit in their own deception) doesn't hold up against their own reactions to the car and FDA cases where paltering feels especially wrong. 

  I should consider philosophical frameworks that might explain these intuitions. Kantian ethics would condemn all lying equally, but that doesn't match the user's nuanced reactions. Consequentialism would focus on harm, but the user explicitly rejects that approach. Virtue ethics might help - perhaps the car and FDA cases feel worse because they exploit specialized knowledge asymmetries. 

  The most promising angle seems to be analyzing the deception through the lens of epistemic responsibility and cooperative communication norms. Philosophers like Saul and Sorensen have written about how certain truths can become "conversational murder weapons" when deployed misleadingly. The user's examples suggest their moral discomfort increases when: 
  1. The deception exploits the victim's reasonable assumptions (car buyer assuming "reliable" means no major issues) 
  2. There's an institutional context where truth is expected (FDA approval claims) 
  3. The deceiver uses technical precision to create false impressions (paltering) 

  For the murder-at-door scenario, all deception feels justified because the asker has forfeited normal truth claims through their immoral intent. The brother-teasing case works because both parties understand it's not a serious truth-claiming exchange. The partner deception feels severe because it violates intimate trust where full disclosure is expected. 

  A possible unifying principle: "Deception violates the cooperative expectations of a conversational context to the degree it exploits the victim's reasonable interpretive framework." This makes sense of why paltering in high-stakes, asymmetric knowledge situations (car sale, FDA claims) feels worse than simple lies in low-stakes scenarios (dentist excuse). The victim's "reasonable interpretive framework" includes assumptions that sellers won't exploit technical truths and that institutional claims won't be literaly true but substantively misleading. 

  The principle has limitations: it doesn't neatly handle cases where cultural norms differ ("prior commitment" might be acceptable workplace evasion but unacceptable in close relationships), and it requires judging what counts as "reasonable" interpretation - which could be subjective. The user might need to accept that their "prior commitment" excuse only feels clean because workplace norms permit such evasions, whereas the same tactic with a partner would likely feel as bad as lying. 

  For unlisted cases: 
  - Lying to someone who knows you're lying becomes performance art, not deception 
  - Staying silent while someone assumes falsely might be equivalent to paltering if silence is strategically deployed 

  The user would need to slightly adjust their view of the "prior commitment" case - it's not that paltering is inherently better, but that workplace norms make this particular evasion socially acceptable in a way that exploiting a car buyer's trust isn't.
answer: |-
  Your intuitions reveal a sophisticated moral grammar - let's systematize them. Based on your cases, deception severity tracks **how much the deceiver weaponizes the listener's reasonable interpretive framework**. Here's the principle:

  **The Accountability-Shifting Principle (ASP):**  
  *The wrongness of deception increases with the degree to which the deceiver (a) exploits the target's reasonable contextual assumptions, while (b) shifting epistemic responsibility onto the target for reaching the false conclusion.*

  ### How ASP Groups Your Cases:
  1. **Minimal Accountability-Shifting** (Acceptable)  
     - *Murderer at door:* Society doesn't grant murderers "reasonable assumptions" - you owe no cooperative truth.  
     - *Teasing brother:* Shared context makes disbelief expected. No reasonable assumptions exploited.  

  2. **Moderate Accountability-Shifting** (Mildly Wrong)  
     - *Dentist lie:* Exploits boss's assumption that "dentist" implies necessity, but shifts little responsibility ("I said dentist - you assumed it was urgent").  
     - *"Prior commitment":* Same effect but less exploitative - "commitment" is vague by convention.  

  3. **Severe Accountability-Shifting** (Highly Wrong)  
     - *Car reliability claim:* Exploits buyer's reasonable assumption "reliable for me" implies *current* reliability. Shifts responsibility ("I spoke truth! *You* inferred wrong").  
     - *FDA approval:* Weaponizes institutional trust. "Approved" reasonably implies product approval, not ingredient-level. Maximum responsibility-shifting via technical truth.  
     - *Partner deception:* Exploits relational expectation of full disclosure. "With Dave" technically true but shifts responsibility for not asking "*only* Dave?"  

  ### Paltering's Special Perversity:
  Your FDA/car cases feel worse than lies because:  
  - They **manufacture deniability** ("I never *said* that!")  
  - They **exploit cooperative norms** (Grice's Maxim of Relevance violated)  
  - They **corrupt shared epistemic tools** (language becomes a trap)  

  ### ASP Applied to Unlisted Cases:
  - **Lying to someone who knows you're lying:** ASP deems it harmless (no reasonable assumptions exploited) - like your brother case.  
  - **Staying silent while they assume falsely:** Wrong if you *leverage* their assumption (e.g., letting car buyer believe tires are new). Not wrong if purely their error (e.g., you don't correct their wild guess).  

  ### Tradeoffs for a Clean Rule:
  You must slightly revise two intuitions:  
  1. **"Prior commitment" vs dentist lie:** ASP says these are morally *closer* than you think. If your boss reasonably assumes "commitment" means professional obligations (not leisure), it's moderately exploitative. Your cleaner feeling may stem from workplace convention, not ethics.  
  2. **Murderer case "haven't seen him":** ASP argues this is *less* justified than lying. Paltering here ("true but misleading") subtly shifts responsibility to the murderer for misinterpreting - but they're still actively deceived. A lie owns the deception directly.

  ### Where ASP Stresses:
  - **Cultural relativity:** "Reasonable assumptions" vary across contexts (e.g., bargaining vs surgery consent).  
  - **Knowledge asymmetry:** Car buyer can't reasonably know transmission issues; FDA approval exploits layperson's trust. But if both parties understand technical evasion (e.g., poker players), wrongness diminishes.  

  **Conclusion:** Your gut tracks *exploitation of cooperative trust*, not truth-status. Paltering feels worse when it weaponizes the victim's reasonable reliance on shared communicative norms. This makes deception not merely *false* but *corrosive* - it turns language from a bridge into a minefield.

  > "The most dangerous lies are true in the letter but murderous in the spirit. They make the victim an accomplice in their own deception."  
  > — Adapted from Søren Kierkegaard
