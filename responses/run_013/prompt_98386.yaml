answer: |-
  Here's the precise map you requested, structured for expert scrutiny while remaining accessible to a thoughtful general reader, followed by an analysis of your asymmetry corollary:

  ### Core Distinctions Blurred in Popular Discussion

  1.  **Logical vs. Evidential Problem of Evil:**
      *   **Logical Problem of Evil (LPoE):** This is a *deductive* argument claiming that the existence of *any* evil (or sometimes, specifically *gratuitous* evil) is **logically incompatible** with the existence of an omnipotent, omniscient, and wholly good (OOG) God. The structure is:
          *   P1: If an OOG God exists, then evil does not exist.
          *   P2: Evil exists.
          *   C: Therefore, an OOG God does not exist.
      *   **Why it (largely) failed:** Alvin Plantinga's Free Will Defense (FWD) demonstrated that it's **logically possible** that an OOG God has a **sufficient reason** for permitting evil: namely, the existence of significantly free creatures and the fact that some of them inevitably choose wrongly. The FWD doesn't need to be *true* or *plausible*; it only needs to show that the existence of an OOG God and evil are not *contradictory* in themselves. It posits a *possible world* where God cannot actualize a world containing moral good without risking moral evil, even though He is OOG. This breaks the supposed logical necessity between "OOG God exists" and "evil does not exist."
      *   **Evidential Problem of Evil (EPoE):** This is a *probabilistic* argument. It concedes that the existence of evil is *logically compatible* with an OOG God (thanks to the FWD), but argues that the *specific kinds, amounts, and distribution* of evil we observe (especially seemingly gratuitous, intense suffering) constitute **powerful evidence** against the existence of such a God. The key claim is: "Given the nature and extent of suffering in our world, it is highly *improbable* that an OOG God exists." It focuses on the *appearance* of pointless suffering.
      *   **Why the failure of LPoE leaves EPoE untouched:** The FWD successfully shows that *some* evil *could* exist alongside an OOG God for a specific reason (free will). However, it does *not* demonstrate that the *actual, observed panorama* of horrific suffering (e.g., protracted agony of children, natural evils affecting non-moral creatures, seemingly random distribution) is likely *required* or *justified* by God's known attributes or any plausible reason. The EPoE argues that the *character* of the evil we see makes God's existence *unlikely*, not *impossible*. Defeating the logical problem removes only the claim of absolute contradiction, not the evidential weight of suffering.

  2.  **Defense vs. Theodicy:**
      *   **Defense:** A defense aims *only* to rebut the *logical* problem of evil (LPoE). Its goal is to provide a **logically possible scenario** or reason why an OOG God *might* permit evil, consistent with His attributes. Crucially, a defense **does not claim this scenario is true, likely, or even plausible in our world.** It only needs to show that it's *conceivable* within the bounds of logic that God has a sufficient reason we might not comprehend. Plantinga's FWD is the paradigm example: It's *possible* God *had* to allow the *risk* of evil to achieve the greater good of significant creaturely freedom. Whether this accurately describes *our* world is irrelevant to its success as a defense against the LPoE.
      *   **Theodicy:** A theodicy goes much further. It attempts to provide a **plausible, positive account** of God's **actual reasons** for permitting the evil we observe in the *actual world*. It claims to offer an explanation that is not just logically possible, but *credible*, *morally justifiable*, and *consistent with God's nature as understood in a specific religious tradition*. Examples include soul-making (Irenaeus, Hick), greater good (Leibniz), or aesthetic harmony theories. A theodicy makes a truth claim about why God permits evil.
      *   **Key Difference:** A defense operates at the level of *logical possibility* ("God *could* have a reason, even if we don't know it"). A theodicy operates at the level of *plausible actuality* ("Here is God's *likely* or *actual* reason"). Defenses are logically weaker claims but easier to establish; theodicies are stronger claims but much harder to defend convincingly against the EPoE.

  3.  **Skeptical Theism & the "Proves Too Much" Objection:**
      *   **Conceptual Core of Skeptical Theism (ST):** ST is primarily a response to the *Evidential* Problem of Evil (EPoE). It argues that human cognitive limitations are so vast compared to God's infinite knowledge and wisdom that **we have no good reason to believe we would recognize a sufficient reason for God to permit specific evils even if we saw it.** Our inability to discern God's reasons for permitting suffering does *not* constitute good evidence that no such reason exists. ST emphasizes divine transcendence and the "cognitive gap" between God and humans.
      *   **The "Proves Too Much" Objection (aka The Moral Skepticism Objection):** Critics argue that if ST is correct, it undermines *all* our moral reasoning, including the very foundations of theism itself.
          *   **The Argument:** If we cannot trust our judgments about whether God *has* a good reason for permitting a specific evil (e.g., a child's suffering), then we also cannot trust our judgments about:
              1.  What *counts* as a "good" reason or a "justifying" purpose. How do we know God's standards of goodness align with ours sufficiently to use the term meaningfully?
              2.  Whether God *is* good. Our belief in God's goodness relies on inferences from revelation, creation, or religious experience – inferences ST says we cannot make reliably when confronted with evil.
              3.  Our own moral obligations. If we can't discern God's reasons for permitting evil, how can we discern God's commands or the nature of goodness well enough to know how *we* should act? ST seems to sever the link between divine goodness and human moral knowledge.
          *   **The Charge:** ST, if successful in defusing the EPoE by invoking our cognitive limitations, simultaneously erodes the epistemic grounds for believing God is good *at all* and for making *any* confident moral judgments, including those theists rely upon to condemn evil or prescribe righteous action. It risks making "God is good" an unfalsifiable but also meaningless dogma.

  ### Analysis of the Asymmetry Corollary

  Your proposed asymmetry corollary states: *"We are entitled to trust our moral judgments about human conduct precisely because we are not entitled to trust our judgments about divine conduct, so that the humility skeptical theism recommends toward God's reasons is a ground for confidence, rather than doubt, about our own."*

  *   **The Argument for Stability:**
      *   Proponents argue that human moral judgments operate in a fundamentally different context than judgments about divine reasons. Our judgments about *human* actions are based on:
          1.  **Intersubjectivity:** Shared human nature, limited perspective, finite knowledge, and vulnerability. We judge each other within a framework of mutual accountability and similar capacities. We *can* reasonably expect to understand the motives and consequences of human actions within this shared frame.
          2.  **Functional Necessity:** Robust moral reasoning is essential for human social life, cooperation, and survival. Evolution and society select for functional moral intuitions *at the human scale*. Doubting these would be paralyzing and pragmatically disastrous.
          3.  **Different Standards:** God's goodness is transcendent and sovereign; human goodness is relational and bounded. What constitutes a "good reason" for an infinite, eternal, all-knowing Creator to permit suffering might be utterly incomprehensible to finite creatures, without implying that our judgments about human cruelty or kindness are flawed. Our moral sense tells us *our* duties within *our* sphere; it doesn't equip us to adjudicate the cosmic administration of an OOG God.
      *   On this view, ST's humility about divine reasons *reinforces* the validity of human-level morality by clearly demarcating its domain. Our confidence in condemning human evil (e.g., torture) stems precisely from our grasp of the *human* context and consequences, a grasp we *don't* and *can't* have regarding God's cosmic governance. ST prevents us from illegitimately projecting human limitations onto God, but also prevents us from illegitimately projecting divine transcendence onto human moral contexts.

  *   **The Argument for Collapse:**
      *   Critics contend the asymmetry is unstable. The core objection ("proves too much") still applies:
          1.  **Concept of Goodness:** If our cognitive limitations prevent us from understanding God's reasons for permitting suffering, how can we be confident that the *concept of goodness* we apply to humans (e.g., relieving suffering is good, causing it needlessly is evil) bears any reliable resemblance to *God's* concept of goodness? If God's goodness is so inscrutable, how do we know it's not radically different? Our human moral judgments rely on a concept whose divine counterpart we admit is opaque.
          2.  **Grounding Human Morality:** Many theists ground objective human morality *in* God's nature (e.g., Divine Command Theory, Natural Law). If ST makes God's nature and reasons inscrutable regarding evil, it undermines the knowability of the *foundation* of human morality. What God commands or what flows from His nature becomes as opaque as His reasons for permitting evil.
          3.  **Judging Divine Commands:** Even if human moral judgments are reliable *among ourselves*, ST seems to disable our ability to reliably recognize or trust alleged *divine revelations* about morality or God's goodness. If we can't discern God's reasons for suffering, how can we discern the authenticity or meaning of a prophet or scripture claiming to reveal God's will? ST threatens to make divine communication unintelligible.
      *   The critic argues that the epistemic humility ST demands regarding God's reasons inevitably infects our understanding of goodness itself and its source, destabilizing the very moral framework we use to judge human actions. Confidence in human moral judgments relies on a stable concept of the good, which ST renders suspect when applied to its supposed ultimate source.

  **The Verdict:**

  The asymmetry corollary is **defensible but precarious**. It represents a coherent attempt to carve out space for robust human moral agency within a framework of divine transcendence. However, it remains **vulnerable to the core thrust of the "proves too much" objection**, particularly regarding the stability and knowability of the *concept of goodness* itself and the grounding of objective moral values.

  *   **More Defensible Reading:** The asymmetry holds *if* one adopts a view where human morality is largely autonomous or grounded in our creaturely nature and social needs, while God's goodness is understood as a transcendent standard that *enables* but *exceeds* our full comprehension. It works best if "goodness" is not univocal between God and humans, but analogical. Our judgments are reliable *for the human sphere* precisely because that's the realm for which our cognitive and moral faculties are adapted. ST's humility protects the *distinction* between these realms.
  *   **Primary Vulnerability:** The corollary struggles most acutely if human moral obligations and the concept of goodness are understood as being *directly derived from* or *identical to* God's nature/commands. If God's nature/reasons are inscrutable, the derivation becomes opaque. The stability of the asymmetry depends heavily on how one conceptualizes the relationship between divine and human goodness and the epistemic access we have to the former.

  **In summary for your piece:** The asymmetry corollary is a sophisticated and philosophically interesting response to the moral skepticism objection. It offers a potential path for the skeptical theist to maintain human moral confidence. However, it does not fully neutralize the objection; it reconfigures the battlefield, shifting the debate onto the nature of goodness itself and our epistemic access to it. Its success hinges on a specific (and contestable) metaphysics of value and divine-human relationality. It represents a live option in the debate, not a settled solution.
