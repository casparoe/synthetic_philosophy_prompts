  1. The disagreement point (d) - what happens if no agreement is reached (the status quo).
  2. The ideal point (u*) for each party - the best they could hope for if the other conceded everything.
  3. The feasible set (S) of possible outcomes.

  The KS solution is the point on the Pareto frontier of S that lies on the line connecting d to u* (the ideal point vector) and that is also Pareto efficient.

  However, in real-world mediation, we face challenges:
  - The feasible set might be discrete (bundles of packages) rather than a smooth trade-off.
  - We may not have cardinal utility functions, only ordinal preferences or stated claims.
  - Claims (stated ideal points) might be inflated as opening bids.

  We must design a procedure that:
  - Works in a two-hour session after a day of preparation.
  - Uses questions to the parties to elicit the necessary information.
  - Handles the above challenges.
  - Clearly marks when we can compute a recommendation and when we must hand back to the parties.

  Procedure Steps:

  1. **Preparation (prior to the session):**
     - Gather background: the dispute, the parties, the context, any prior offers, and the disagreement point (status quo). Identify the set of feasible outcomes (if known) or ask parties to bring their proposed packages.

  2. **Session Structure:**

     **Step 0: Set the Stage (10 mins)**
     - Explain the mediation process and the KS-based procedure. Emphasize that the goal is a fair outcome based on mutual concessions from stated aspirations. Clarify that the mediator will make a recommendation if the procedure yields a clear result, otherwise the parties will continue to negotiate.

     **Step 1: Disagreement Point (d) (10 mins)**
     - Question: "If we cannot reach an agreement today, what happens? Please describe the consequences for each party and for the public interest. Be specific and, if possible, quantify the impacts."
     - Sufficient answer: A clear description of the status quo, including any known costs or consequences. If the parties agree on the status quo, use that. If not, we may need to define two disagreement points (one per party) but this complicates the model. Aim for consensus. If consensus fails, use the mediator's judgment to define d based on the evidence.

     **Step 2: Ideal Points (u*) (20 mins)**
     - Question to each party: "Imagine the other party conceded everything you are asking for. What would that outcome look like? Please state your best-case scenario, including all elements that are important to you. Where possible, put numbers to these elements."
     - Sufficient answer: A comprehensive list of demands. We will treat this as the ideal point. However, we note that these might be opening bids. We will later adjust for feasibility.

