  ### **Kalai-Smorodinsky Mediation Procedure**  
  *(Total time: 120 minutes)*  

  #### **Step 0: Preparation (Pre-Session)**  
  - **Objective**: Define the dispute scope, gather documents (e.g., existing offers, statutory duties, costings), and identify feasible outcomes (e.g., 3–5 packages or trade-offs).  
  - **Output**: A "Feasible Set" of outcomes (including status quo).  

  ---

  #### **Step 1: Establish Disagreement Point (d) | 10 min**  
  - **Question**: *"If no agreement is reached, what happens? Quantify impacts (costs, delays, service disruptions) for each party and the public."*  
  - **Sufficient Answer**:  
    - Consensus on tangible consequences (e.g., "Strike costs £500k/day", "Services lapse in 6 weeks").  
    - If parties disagree, **mediator judgment** defines `d` using documented evidence.  
  - **Stop & Hand Back If**: Parties dispute *fundamental facts* (e.g., "Our budget shortfall is £2m" vs. "That’s false").  

  #### **Step 2: Define Ideal Points (u*) | 20 min**  
  - **Question**: *"If the other party conceded everything, what would your perfect outcome look like? Specify terms and attach numbers."*  
  - **Sufficient Answer**:  
    - Concrete claims (e.g., "8% pay rise", "£70m budget share").  
    - **Handle Inflated Bids**: Later steps cap ideals by feasibility (Step 4).  
  - **Stop & Hand Back If**: Ideals rely on *non-negotiable values* (e.g., "We morally deserve 10%" without justification).  

  #### **Step 3: Map Feasible Set (S) | 30 min**  
  - **Question**: *"Which outcomes are viable? List all options, including compromises (e.g., 5% pay rise + training fund)."*  
  - **Sufficient Answer**:  
    - 3–5 discrete options (e.g., Option A: 3% pay rise, Option B: 4% rise + overtime cap).  
    - Include trade-offs (e.g., "If we cut project X, we boost service Y").  
  - **Handle Discrete Packages**: Use rankings if utilities are unclear (Step 4).  
  - **Stop & Hand Back If**: Feasibility hinges on *external risks* (e.g., "This works only if inflation falls").  

  #### **Step 4: Adjust Ideals & Score Outcomes | 30 min**  
  - **Question**: *"Rate each outcome from 0–100, where 0 = status quo (d) and 100 = your ideal (u*)."*  
    - **Rationale**: Converts claims into comparable "gains".  
  - **Sufficient Answer**:  
    - Cardinal scores (e.g., "Option A: Trust=60, Union=40").  
    - **Handle Non-Honest Utilities**: If parties refuse scores, **use rankings** (judgment call):  
      - Assign scores linearly (rank 1 = 100, rank 2 = 80, etc.).  
    - **Adjust Inflated Ideals**: Rebase ideals to max *attainable* score in `S`.  
      - E.g., If Trust’s ideal = 8% but max feasible = 6%, set `u*_trust = 100` at 6%.  
  - **Output**:  
    - `d` = (0, 0)  
    - `u*` = (max score for Party 1, max score for Party 2)  
    - Scores for all options in `S`.  

  #### **Step 5: Compute KS Solution | 20 min**  
  - **Formula**:  
    1. For each option, calculate:  
       `Gain_1 = (Party1_score - 0) / (u*_1 - 0)`  
       `Gain_2 = (Party2_score - 0) / (u*_2 - 0)`  
    2. Find option with **highest minimum of (Gain_1, Gain_2)**.  
  - **Discrete Options**: Compare min(Gain_1, Gain_2) across all packages.  
  - **Tiebreak**: Choose option with highest `(Gain_1 + Gain_2)`.  
  - **Output**: Single recommended outcome.  

  #### **Step 6: Validate & Recommend | 10 min**  
  - **Explain Shifting Outcomes**: *"Adding/removing options changes the 'fair' point. We’ve recalculated based on current options."*  
  - **Recommendation**:  
    - If KS outcome is unambiguous → **Mediator recommends it**.  
    - If min(Gain_1, Gain_2) ≤ 0 (worse than `d`) → **Hand back to parties**.  

  ---

  ### **What This Procedure Cannot Do**  
  1. **Resolve Value Conflicts**: E.g., "Statutory duties deserve 2× weight." (Hand back).  
  2. **Quantify Subjective Risks**: E.g., "We fear future cuts if we concede." (Hand back).  
  3. **Replace Bargaining**: KS is advisory; parties must voluntarily agree.  
  4. **Multi-Party Disputes**: Designed for two-party conflicts.  

  ---

  ### **Example Disputes**  
  #### **1. Pay Claim (Trust vs. Union)**  
  - **d**: Strike (cost: £1m/day).  
  - **Ideal Points**: Union (u*_u) = 8% rise, Trust (u*_t) = 0% rise.  
  - **Feasible Set**:  
    - Option A: 3% rise → Scores: Union=40, Trust=70  
    - Option B: 5% rise + training fund → Scores: Union=75, Trust=50  
    - Option C: 4% rise → Scores: Union=60, Trust=60  
  - **Adjust Ideals**: Max feasible Union score = 75 (Option B), Trust = 70 (Option A).  
  - **KS Calculation**:  
    - Option A: Gains = (40/75, 70/70) = (0.53, 1.00) → min = **0.53**  
    - Option B: Gains = (75/75, 50/70) = (1.00, 0.71) → min = **0.71**  
    - Option C: Gains = (60/75, 60/70) = (0.80, 0.86) → min = **0.80**  
  - **Recommendation**: **Option C** (4% rise) maximizes min-gain.  

  #### **2. Budget Split (Statutory vs. Non-Statutory Department)**  
  - **d**: £0 for both (project collapses).  
  - **Ideal Points**: Statutory Dept (u*_s) = £70m, Non-Statutory (u*_n) = £50m.  
  - **Feasible Set**:  
    - Option A: £60m (Statutory), £40m (Non-Statutory) → Scores: S=80, N=70  
    - Option B: £55m (S), £45m (N) → Scores: S=70, N=80  
    - Option C: £50m (S), £50m (N) → Scores: S=50, N=100  
  - **Adjust Ideals**: u*_s = 80 (Option A), u*_n = 100 (Option C).  
  - **KS Calculation**:  
    - Option A: Gains = (80/80, 70/100) = (1.00, 0.70) → min = **0.70**  
    - Option B: Gains = (70/80, 80/100) = (0.88, 0.80) → min = **0.80**  
    - Option C: Gains = (50/80, 100/100) = (0.63, 1.00) → min = **0.63**  
  - **Recommendation**: **Option B** (£55m/£45m). Statutory duty reflected in higher baseline score.  

  #### **3. Surplus to "Weaker" Party (Regulator vs. Utility Company)**  
  - **d**: Tribunal (cost: Regulator=£5m, Utility=£10m).  
  - **Ideal Points**: Regulator (u*_r) = £50m fine, Utility (u*_u) = £0 fine.  
  - **Feasible Set**:  
    - Option A: £30m fine → Scores: Regulator=70, Utility=40  
    - Option B: £20m fine → Scores: Regulator=40, Utility=80  
  - **Adjust Ideals**: u*_r = 70 (Option A), u*_u = 80 (Option B).  
  - **KS Calculation**:  
    - Option A: Gains = (70/70, 40/80) = (1.00, 0.50) → min = **0.50**  
    - Option B: Gains = (40/70, 80/80) = (0.57, 1.00) → min = **0.57**  
  - **Outcome**: Recommends **Option B** (£20m fine), favouring Utility.  
  - **Should You Follow?**: **Yes**. KS ensures procedural fairness, even if you privately question the merits. Overruling it risks bias, undermining mediator neutrality. Revisit Step 3 if new evidence emerges.  

  ---

  ### **Key Judgment Calls**  
  - **Step 4 (Scoring)**: Assigning linear scores from rankings.  
  - **Step 4 (Rebasing)**: Capping ideals to feasible maxima.  
  - **Step 5 (Discrete Sets)**: Choosing min-gain over Pareto efficiency.  

  This procedure balances mathematical rigour with real-world constraints, ensuring you remain a neutral facilitator while anchoring discussions in a recognised fairness standard.
