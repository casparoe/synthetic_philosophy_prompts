prompt: |-
  Ok, so I need a proposal written and I'm stuck on how to frame it. It's for a one-semester grad seminar — 6000 words, about 14 weeks — and I want it on logical uncertainty, but not the usual "can you even have credences about maths" thing, which I feel like I've read a hundred times. Here's my half-formed idea, please turn it into something real.

  I keep noticing that "logical uncertainty" gets used for at least three pretty different situations, and I suspect a lot of the confusion in these debates comes from sliding between them:

  (i) Deferred computation. There's a definate answer, I just haven't computed it — a giant arithmetic fact, whether some Turing machine halts, whether a proof of length 10^40 exists. Natural norm here is calibration to the truth: if I say 0.7 to a bunch of these, ~70% should be true, and as I compute, credences should march to 0 or 1. There's a fact of the matter, I'm just behind.

  (ii) Unsettled questions. Whether 0^0 "really is" 1, whether a borderline case of a vague predicate "really is" in the extension, whether two formalizations of the same informal notion "really are" the same thing. Here it's not clear there's any truth to be calibrated to, and "the right credence" starts to look like "what we'll end up stipulating / what the community will converge on" — a prediction about us, not about the world. Different animal.

  (iii) My own future conclusions. Uncertainty about what I'd conclude if I kept reasoning, so the "computation" is my future self. Looks like (i), but I can dissolve it by just doing the reasoning now, which makes me suspicious it's doing something else.

  I know there's a body of machinery for reasoners that assign prices to logical sentences and stay coherent, Dutch-book-free, while learning more logic. I don't want a tour of that — I want to know which of (i)/(ii)/(iii) it actually speaks to, and whether it answers the question I care about.

  So: pick the sharpest question in here that's genuinely answerable in a semester, state it so it has a determinate answer, and say why the obvious responses don't settle it. Directions I'd find interesting, roughly in order: (a) is there a coherent norm for (ii)-type credences that isn't just "predict the consensus" and isn't vacuous? (b) does the package people want for (i) — coherence, calibration, computable or at least approximable — extend to (ii), or provably can't? (c) is the distinction bogus, because every (ii) question can be recast as an (i) question by fixing a formalization — and if so, is that a refutation or just a change of subject?

  Then: the method, week by week, what I'd literally sit down and do (I'm happy with toy formal examples, small lemmas, counterexample hunting — I'd rather have one crisp lemma than a survey). What a good outcome looks like, and what would count as the project failing — be blunt; if there's a result that would make me say "ok, there was nothing here", tell me what it is. And an honest read on whether 14 weeks is enough or whether I should cut it to a 3000-word note.

  No citations, no reading lists, no "so-and-so argues that" — I'll add references myself, argue about the ideas.

  Last line of the whole thing should be exactly \answer{...} with the question my paper answers, one sentence, under 25 words.
