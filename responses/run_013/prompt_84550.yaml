  - (ii) Unsettled questions: cases where there might not be an objective truth
  - (iii) Uncertainty about one's own future conclusions

  They want to explore which of these existing formal frameworks actually address, particularly focusing on whether there's a coherent norm for type (ii) that isn't just predicting consensus. The real challenge seems to be carving out a tractable research question from this philosophical tangle.

  Looking at their interests in priority order:
  (a) Finding a non-vacuous norm for type (ii) beyond consensus prediction
  (b) Testing if frameworks for type (i) extend to type (ii)
  (c) Examining whether the distinction collapses when formalizing type (ii) as type (i)

  The user explicitly wants no citations or literature review - just the conceptual core. They need week-by-week methodology with concrete tasks (toy models, lemmas, counterexamples), clear success/failure conditions, and an assessment of whether 14 weeks is feasible. The final output must include a one-sentence research question in \answer{} format.

  The key tension I see is between mathematical tractability and philosophical depth. Type (ii) questions are the most philosophically interesting but also the messiest. The user seems aware of this, hence requesting "failure conditions" - they want to know upfront if this might be a dead end.

  For the proposal, I should focus on question (a) about norms for type (ii), as it's their top priority and hasn't been as thoroughly explored as the others. The methodology could involve:
  - Building toy models of unsettled questions
  - Testing if standard coherence constraints produce vacuous/non-vacuous norms
  - Exploring whether calibration can be defined without truth
  - Investigating if "predicting consensus" is actually avoidable

  Success would be either finding a non-consensus norm or proving why it's impossible. Failure would occur if everything reduces to consensus or if the problem becomes too vague to formalize.

  14 weeks is tight but possible if scope is ruthlessly limited to one concrete subproblem. The final \answer{} should capture the essence of what they're trying to resolve about norms for unsettled questions.
answer: |-
  Here’s a streamlined proposal focusing on your core question. It cuts through the noise and targets a concrete, falsifiable goal.

  ---

  **Proposal: Normative Vacuum – Can Unsettled Questions Bear Non-Vacuous Credences?**  

  **Core Question:**  
  Is there a coherent, non-vacuous normative constraint on credences for *unsettled questions* (type ii) that is distinct from merely predicting consensus?  

  **Why This?**  
  - Type (i) has clear norms (calibration, coherence). Type (iii) dissolves upon reflection. Type (ii) is the uncharted gap: no obvious truth-to-track, yet we assign credences (e.g., "I’m 60% sure ‘vague predicate X applies to borderline case Y’ will be accepted"). Existing frameworks (coherent prices, Dutch books) *assume* a truth-apt domain – but unsettled questions may lack this. The obvious response – *"Just predict the consensus!"* – reduces epistemology to sociology. Is there something deeper?  

  **The Stakes:**  
  - **Success:** Demonstrating a norm (e.g., a consistency constraint under possible stipulations) forcing non-trivial credence assignments without presupposing consensus.  
  - **Failure:** Proving that *any* non-consensus norm either collapses into consensus-prediction or reduces to vacuity (e.g., "assign any credence you like").  

  **Method (14 Weeks, Week-by-Week):**  
  1. **Framing & Toy Models:** Define "unsettled question" rigorously (e.g., *vagueness*: borderline case under a fixed semantics; *foundational ambiguity*: 0^0 in a context lacking convention; *conceptual equivalence*: ZFC vs. HoTT for "the same" mathematical structure). Build minimal formal models (e.g., simple predicate logic + undefined cases; agents proposing stipulations).  
  2. **Attack Consensus-Reduction:** Can consensus-prediction be *derived* from first principles (coherence, calibration-like substitutes)? Formalize "predicting consensus" (e.g., modeling community convergence) and test if standard coherence arguments require it.  
  3. **Hunt Non-Consensus Norms:**  
     - *Option A (Internal Coherence):* Impose consistency across *possible* stipulations. If I stipulate X, credence for Y becomes P₁; if I stipulate ¬X, it becomes P₂ – is there a constraint linking my *current* credence to P₁, P₂?  
     - *Option B (Proxy Calibration):* Calibrate against *eventual resolution* (e.g., "70% of claims I assign 0.7 to should be *stipulated true* by some future authority"). Is this distinct from consensus?  
  4. **Test for Vacuum:** If a candidate norm emerges, stress-test it: Does it demand *specific* credences in simple cases? Or is it trivially satisfiable (e.g., assign any P ∈ [0,1])?  
  5. **Failure Analysis:** If norms collapse, prove why: Show that *any* candidate norm either reduces to consensus-prediction or imposes no constraints.  

  **Outcome Scenarios (Blunt Assessment):**  
  - **Strong Win:** A lemma showing a non-consensus norm forces P ≠ 0.5 in a toy scenario.  
  - **Weak Win:** A coherent norm exists but is highly permissive (non-vacuous but weak).  
  - **Fail:** Proof that non-consensus constraints *must* be vacuous ("assign anything") OR that "consensus" is inescapable.  
  - **Total Flop:** The distinction (i)/(ii) collapses under formalization (every (ii) becomes (i)), *and* this refutes the need for special norms. **This kills the project.** (Your suspicion confirmed).  

  **Feasibility:**  
  14 weeks is **enough** for a sharp 6000-word result *if* you focus solely on one unsettled paradigm (e.g., vagueness). Switch to a 3000-word note if tackling multiple becomes messy. Prioritize depth in one model over breadth.  

  **What You’ll Produce:**  
  A formal argument answering: "Must credences in unsettled questions reduce to predicting consensus, or can they be constrained independently?" Includes either a counterexample norm or an impossibility proof.  

  \answer{Can credences for unsettled questions be coherently constrained without reducing to predicting consensus?}  

  ---  

  **Why this works:**  
  - **Focused:** Targets your primary interest (a) while allowing (b)/(c) to emerge naturally. Ignores type (iii) as a red herring.  
  - **Falsifiable:** Clear win/fail conditions. "Total Flop" is defined.  
  - **Active Research:** You’re *building models* and *proving lemmas*, not surveying literature.  
  - **Scope Control:** Starts small (one toy model) – expand only if time allows.  
  - **Answers You:** Forces a concrete "yes/no + why" to the normative vacuum question.  

  **Tactical Note:** If Week 3 hits brick walls, pivot to proving the "Total Flop" case – that’s still a publishable negative result.
