prompt: |-
  I'm running a 75-minute session on modal realism for second-year undergrads who've had a bit of modal logic but no metaphysics, and I want a teaching plan, not an explanation of the view. What I keep getting wrong is the order. They've met possible worlds as harmless bookkeeping devices in semantics, so the whole difficulty is making them feel the step from "worlds are just useful posits / ways things could be" to "worlds are concrete universes of the same kind as this one," and then making the price of that step feel real rather than absurd. They'll also reach straight for "a world is just a maximal description of how things could be" and I want the sequence to make them see what that costs, without turning into a survey of alternatives. Plan it: what has to come first and what depends on what, which single example should carry the whole thing and what it must have and lack (and why the obvious sci-fi "alternate universe" example, or "a world where I had toast instead", wont do the work), where the indexical treatment of "actual" comes in — the way "now" is supposed to be indexical on a B-theory of time, or "here" on a map — and at which point that analogy breaks down and stops being helpful. Then the misconceptions they'll predictably form (my guesses: a possible world is a distant place you could in principle get to; if everything happens somewhere then nothing matters or everything is permitted; "concrete" means physical; actuality is a special intrinsic property some worlds have and ours happens to have) with exactly where in the sequence each should be headed off, one closing question that would show whether they've actually got the view, and what I should openly refuse to explain at this level and say so out loud.

  Give it to me as JSON with these fields: sequence (array of {step, idea, depends_on, why_here}), carrying_example ({example, must_have, must_lack, why_not_the_obvious_one}), misconceptions (array of {misconception, where_in_sequence, how_to_head_it_off}), check_for_understanding ({question, what_a_good_answer_looks_like, what_a_bad_one_looks_like}), and leave_out (array of {thing, why}).
reasoning: |-
  We are designing a 75-minute session on modal realism for second-year undergrads with some modal logic (possible worlds as semantic tools) but no metaphysics.
   The goal is to make them feel the step from possible worlds as abstract representations to concrete universes, and then feel the cost without it seeming absurd.
   Key challenges: 
     - They tend to think of worlds as "maximal descriptions" (abstract) and we need to shift to concrete.
     - We must avoid the "alternate universe" sci-fi example because it might reinforce the idea of worlds as distant places (which is a misconception).
     - We want to use an indexical treatment of "actual" (like "here" or "now") to demystify the specialness of our world, but then show where that analogy breaks.

   Plan Structure:
     1. Start by reminding them of the use of possible worlds in modal logic (as they know it: harmless, abstract, bookkeeping).
     2. Then, introduce modal realism as a bold claim: these worlds are not just abstract but concrete universes just like ours.
     3. We need an example that is concrete but doesn't invite the "distant place" idea. The example should be mundane and non-sci-fi to avoid the "alternate universe" trope.
        Suggested example: "A world where this very chalk (or pen) is not in my hand, but on the floor." 
          Why? It's immediate, in the room, and doesn't involve travel or exotic scenarios. It must be concrete (so we imagine it as a real, physical universe) but must lack any connection to our world (so no wormholes, etc.).
          Why not the toast example? Because "I had toast instead" might be too abstract (it's about a description of me) and also might lead to thinking about personal identity, which we want to avoid.
          Why not sci-fi? Because it reinforces the idea of travel and being in the same space-time, which is exactly what we want to avoid.

     4. The indexical treatment of "actual": we introduce it when we explain why our world isn't special. Use the analogy of "here" on a map: every point on the map is "here" for someone at that point. Similarly, every world is "actual" for its inhabitants.
        But note: the analogy breaks because we cannot point to other worlds (they are causally isolated). So we have to stress that we are not in the same space-time as other worlds.

     5. Sequence of steps (each step about 10-15 minutes, total 75 min):

        Step 1: Recap of Possible Worlds in Semantics (10 min)
          Idea: Worlds as abstract entities (sets of propositions, maximal consistent sets, etc.) that help us understand modal operators.
          Depends on: their prior knowledge.
          Why here: Start from where they are.

        Step 2: The Question of What Worlds Are (10 min)
          Idea: But what are these worlds, really? Are they just abstract representations, or could they be something more? This is a metaphysical question.
          Depends on: Step 1. We are building the question.

        Step 3: Introducing Modal Realism (15 min)
          Idea: David Lewis's claim: possible worlds are concrete entities, just as real as our universe, but causally and spatiotemporally isolated. 
          Use the carrying example: 
            Example: "Consider a world where this chalk (I'm holding) is lying on the floor right now. That world is not an abstract description; it is a concrete universe, with its own space-time, where that chalk is on the floor. It's as real as the universe we are in."
            Must have: Concreteness (physical, spatiotemporal), isolation (no travel, no causal interaction).
            Must lack: Any connection to our world (so not a parallel universe in the same space-time).
            Why not the obvious: The sci-fi example (like a universe where Nazis won) invites thinking of it as a branch of our history, which might be accessible. We want to avoid that.

        Step 4: The Indexical Nature of Actuality (10 min)
          Idea: What makes our world actual? Nothing but our perspective. Just as "here" is where I am, "actual" is the world I am in. For the inhabitants of the chalk-on-floor world, that world is actual and ours is merely possible.
          Use the map analogy: Every point on the map is labeled "you are here" for the person at that point. Similarly, every world is actual from within.
          But break the analogy: On a map, you can move and change what is "here". But you cannot move to another world because they are isolated. So the label "actual" is fixed for each world relative to its inhabitants.

        Step 5: The Costs and Benefits (15 min)
          Idea: Why accept this? Because it gives a unified account of modality (no need for primitive modality). But the cost: there are countless concrete universes, some very strange. And we have to accept that everything that is possible exists (in some world). But then why is our world special? It isn't! That's the point of the indexical account.

        Step 6: Addressing Misconceptions (10 min) - Weave these in as they come up, but also have planned points.

     6. Misconceptions to address and when:

        a) Misconception: A possible world is a distant place you could in principle get to.
          Where in sequence: Step 3 (when introducing concreteness) and Step 4 (when discussing indexicality and isolation).
          How to head off: Stress the causal and spatiotemporal isolation. No travel. The chalk-on-floor world is not in our space-time; it's a separate universe.

        b) Misconception: If everything happens somewhere then nothing matters or everything is permitted.
          Where in sequence: Step 5 (when discussing costs).
          How to head off: Note that what happens in other worlds doesn't affect us (causal isolation). So our actions matter in our world. Also, what is permitted (morally) is about what we do in our world.

        c) Misconception: "Concrete" means physical.
          Where in sequence: Step 3 (defining concreteness).
          How to head off: Clarify that by concrete, Lewis means having a spatiotemporal structure and being composed of parts that are related spatiotemporally. But note: Lewis is a physicalist? Actually, he leaves room for non-physical entities? But for undergrads, we can say: concrete means having a space-time and being made up of things that are located in space and time. But we don't want to get into non-physical worlds? We might say that for Lewis, all worlds are physical? Actually, Lewis does allow for worlds with different laws? But the point is they are still concrete. We can say: concrete means having a spatiotemporal structure, but the fundamental properties might differ? However, to keep it simple, we can stick to physical.

        d) Misconception: Actuality is a special intrinsic property some worlds have and ours happens to have.
          Where in sequence: Step 4 (on indexicality).
          How to head off: Stress that "actual" is like "here". There's no intrinsic property of hereness; it's just where we are. Similarly, actuality is not a property; it's an indexical.

     7. Check for understanding at the end (5 min):

          Question: "According to modal realism, what is the difference between the actual world and other possible worlds?"
          Good answer: There is no objective difference. The actual world is the one we are in, just as 'here' is where we are. Other worlds are just as real, but they are spatiotemporally and causally isolated from us. They are not actual for us, but they are actual for their own inhabitants.
          Bad answer: The actual world is the real one, and the others are imaginary. Or: The actual world is the one that exists, and the others don't. Or: The actual world is the one that we can interact with, and the others are far away.

     8. Leave out:

          Thing: The details of Lewis's recombination principle and the principle of plenitude.
          Why: Too much for an intro, and they don't have the metaphysics background.

          Thing: The debate between modal realism and other theories (like ersatz modal realism).
          Why: We want to focus on understanding the view, not alternatives.

          Thing: The problem of transworld identity and counterpart theory.
          Why: It's a whole other can of worms and would take too long.

   Now, let's format as JSON.
