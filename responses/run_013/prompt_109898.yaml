answer: |-
  ### Essay Question  

  **Background Apparatus**  
  We compare infinite futures (dated sequences of well-being distributions).  
  1. **Temporal Neutrality (Date-Shift Equivalence):** For any future \(F\) and temporal shift \(k\), \(F\) and \(F\) shifted by \(k\) years must be ranked equally. *Note:* This presupposes identical individuals merely relocated in time. *Stipulated fact:* Actual identity depends on event timing; a date-shifted future contains *different people*.  
  2. **Purity of Discounting:**  
     - *Pure time preference:* Dispreferring a later benefit *solely because it is later*.  
     - *Impure time preference:* Dispreference grounded in uncertainty, survival probability, diminishing marginal utility, or opportunity costs.  
  3. **Underdetermination Thesis:** Any exponential discount factor \( \delta^t \) can be expressed as \( \delta^t = (p)^t \times \beta^t \), where \( p \) = per-period survival probability and \( \beta \) = residual pure time preference rate. Choice data *alone* cannot distinguish between interpretations. Preference structures are observationally equivalent.  

  **Task**  
  Critically evaluate three issues using *only the above apparatus*:  
  1. Can an agent be definitively accused of *pure time preference* based solely on their choices, given the underdetermination thesis? Justify.  
  2. Is Temporal Neutrality a coherent constraint on ranking futures, given the stipulated link between timing and identity? If not, what conceptual cost would a "repair" (e.g., modifying Temporal Neutrality) incur?  
  3. Does the strongest argument for *rationally discounting one’s own future welfare* (e.g., uncertainty about personal survival) transfer to justify discounting *future generations’ welfare*? Explain why the "standard catalogue" (impatience, survival uncertainty, diminishing utility, opportunity costs) is inadequate here.  

  ---

  ### Model Answer (700 words)  

  The underdetermination thesis establishes that choice behaviour cannot convict an agent of pure time preference. Since any observed discounting pattern can be decomposed into a survival probability \( p \) and a residual rate \( \beta \), the data remain consistent with two interpretations: (i) the agent has *zero* pure time preference (\(\beta = 1\)) but discounts due to uncertainty (\(p < 1\)), or (ii) the agent has *positive* pure time preference (\(\beta < 1\)) but no survival uncertainty (\(p = 1\)). As preference rankings are identical under both models, no choice experiment can isolate \(\beta\) as the causal driver. Thus, accusing an agent of pure time preference requires *extra-choice* premises (e.g., ontological commitments about time or welfare), violating the requirement to rely "solely on choices."  

  Temporal Neutrality faces a deeper problem: it is *ill-formed* given the identity-timing dependency. The principle demands that \(F\) and its \(k\)-shifted counterpart \(F_k\) be ranked equally. However, \(F_k\) contains different individuals (per stipulated background fact), while Temporal Neutrality’s definition presupposes identical people. This contradiction voids the constraint: it compares *incomparable* futures. A "repair" might relax Temporal Neutrality to apply only when identities are *held fixed* across shifts. But this eviscerates its normative force, as real intergenerational choices *always* involve different people. The repair reduces Temporal Neutrality to an empty formalism, unable to govern actual decisions where timing alters identity. Its cost is thus the surrender of any substantive requirement for temporal impartiality.  

  Arguments for personal future discounting fail to transfer to discounting future generations due to a disanalogy in *subjecthood*. The strongest personal discounting argument appeals to *non-identity over time*: uncertainty about one’s own existence in distant periods (captured by \(p < 1\) in the decomposition). This discounts welfare because the *same subject* may not exist to receive it. For future generations, however, the uncertainty is *metaphysically distinct*. While I might doubt *my* survival to year 2100, I cannot doubt *that some people* will exist then (absent extinction). Discounting their welfare because *I* might not survive conflates the subject’s identity with the evaluator’s perspective. Future people are separate subjects; their existence isn’t probabilistic *for them*. Discounting their welfare due to *my* uncertainty would be a category error, privileging my epistemic standpoint over their ontological separateness.  

  The standard catalogue (impatience, survival uncertainty, diminishing utility, opportunity costs) is insufficient for two reasons. First, it ignores the underdetermination problem: labelling a discount rate as "impatience" or "uncertainty" is arbitrary without additional assumptions. Second, and crucially, it conflates *intrapersonal* and *intergenerational* discounting. Diminishing utility and opportunity costs might apply to both, but they are instrumentally justified (e.g., investing now to enrich the future). Impatience and survival uncertainty, however, are inherently *agent-relative*. They may rationally apply to one’s own future but not to distinct future agents, whose welfare claims are not contingent on the present agent’s temporal perspective. The catalogue thus masks the central disjunction: personal discounting concerns a single subject’s diachronic welfare, while intergenerational discounting concerns moral relations between distinct subjects across time. Without addressing this disjunction, the catalogue cannot justify transferring discounting rationales.  

  ---

  ### Marking Rubric (5 × 4 points)  
  **Total: 20 marks**  

  1. **Underdetermination & Pure Time Preference Conviction**  
     - *Top answer:* Explicitly notes that observational equivalence implies *no unique interpretation* of choice data; accusal requires *exogenous* premises.  
     - *Competent answer:* States underdetermination prevents identification but doesn’t clarify why this blocks conviction.  
     - *Common error:* Assumes positive discounting *must* imply some pure time preference.  

  2. **Temporal Neutrality Coherence & Identity Problem**  
     - *Top answer:* Diagnoses that identity-dependence makes the comparison *category-defective* (different people vs. required identical people).  
     - *Competent answer:* Notes identity conflict but doesn’t explain why it voids the principle’s logical structure.  
     - *Common error:* Suggests Temporal Neutrality can be "fixed" by ignoring identity issues.  

  3. **Cost of Repairing Temporal Neutrality**  
     - *Top answer:* Argues that restricting to fixed-identity cases renders the principle *empirically vacuous* for real choices.  
     - *Competent answer:* States repair weakens the principle but doesn’t specify operational impotence.  
     - *Common error:* Proposes ad hoc adjustments (e.g., "discount future people less") without addressing core incoherence.  

  4. **Personal vs. Intergenerational Discounting Disanalogy**  
     - *Top answer:* Contrasts *intrasubjective uncertainty* (personal survival) with *intersubjective separateness* (future generations’ independent existence).  
     - *Competent answer:* Distinguishes self/others but doesn’t articulate metaphysical asymmetry in uncertainty.  
     - *Common error:* Equates personal survival probability with extinction risk for future generations.  

  5. **Rejection of Standard Catalogue**  
     - *Top answer:* Demonstrates catalogue’s failure by showing it *presupposes the disjunction* (intra- vs. inter-generational) it needs to justify.  
     - *Competent answer:* Lists catalogue items as insufficient but doesn’t trace insufficiency to subjecthood disjunction.  
     - *Common error:* Treats the catalogue as exhaustive, missing its agent-relativity problem.
