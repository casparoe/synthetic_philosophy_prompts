prompt: |-
  Random thing that's been bugging me and I can't decide if I'm being dense — I keep hearing that Dutch book arguments show incoherent credences are irrational, but I can't see how they get to the *epistemic* conclusion rather than just a prudential one. The mechanism is always "a bookie offers you a series of bets you accept, and you lose for sure", which only bites if your the sort of person who takes bets. If I refuse every bet on principle then there's no sure loss anywhere, so it looks like the argument shows at most that incoherent credences are a liability if you happen to gamble, not that they're irrational as credences. The money side confuses me in the same way: if I don't value money linearly, even the gambling version goes soft, which makes me suspect the whole thing is really an argument about dollars rather than about belief.

  Someone told me there's a version where you drop the betting entirely (depragmatised? where the loss is that you'd count each bet in the package as fair while counting the package itself as a bad deal), and other people say we should just do it with accuracy/dominance instead. Is that a patch on a broken argument, or is the betting machinery doing real work that the alternatives can't? Bottom line I'm after: what is the argument actually supposed to establish, and is someone who never bets off the hook?
reasoning: |-
  Okay, let me start by unpacking the user's question. They're confused about Dutch book arguments (DBAs) and how they prove that incoherent credences are epistemically irrational, not just prudentially risky. The core issue seems to be that DBAs rely on betting scenarios, which only matter if you actually bet. So if you never bet, are incoherent credences still irrational?

  First, I need to recall how DBAs work. The standard version involves a bookie offering bets based on your credences. If your credences violate probability axioms (like not summing to 1), the bookie can create a set of bets that you'll accept but that guarantee a loss. The user's point is valid: if you refuse all bets, this doesn't apply. So how does this translate to epistemic irrationality?

  The user mentions two alternatives: depragmatized DBAs and accuracy dominance arguments. I should explain how these address the betting objection. Depragmatized versions remove the actual betting, focusing on the inconsistency in evaluating the bets as fair individually but the combination as unfair. This shifts the argument from practical loss to logical inconsistency.

  Accuracy dominance is different. It uses scoring rules to measure how close credences are to truth. Incoherent credences are always less accurate than coherent ones, regardless of the outcome. This seems stronger for epistemic irrationality because it's about belief accuracy, not money.

  The user also brings up linear valuation of money. If someone doesn't value money linearly, the betting argument weakens. But accuracy arguments don't rely on utility, which makes them more robust. That's a point worth emphasizing.

  Underlying all this, the user might be questioning the link between practical rationality (avoiding sure losses) and epistemic rationality (holding correct beliefs). They might be skeptical about whether DBAs really bridge that gap. I should address that head-on.

  I recall that some philosophers, like Christensen, argue that DBAs reveal a defect in reasoning, not just a practical flaw. The inconsistency in evaluating bets reflects deeper doxastic inconsistency. But the user might not find this fully satisfying. Accuracy arguments seem like a better fit for epistemic concerns.

  The user's bottom line: what do DBAs actually prove, and can someone who never bet avoid the irrationality charge? The answer is that depragmatized and accuracy arguments show that incoherent credences are inherently flawed, not just risky for gamblers. Accuracy dominance, in particular, directly ties credences to epistemic goals like truth.

  I should also note that the user's skepticism is common. Critics like Hájek argue that DBAs are pragmatic, not epistemic. But proponents counter that the inconsistency revealed is epistemic. Still, accuracy arguments avoid this debate entirely.

  In summary, the betting machinery isn't essential; accuracy arguments provide a cleaner path to epistemic irrationality. For someone who never bets, incoherent credences are still irrational because they're accuracy-dominated, meaning they can't align well with truth.
answer: |-
  You've hit on a fundamental and excellent critique of Dutch Book Arguments (DBAs) – one that philosophers of probability and decision theory actively debate. Your intuition isn't dense at all; it's sharp. Let's break down the arguments, their limitations, and the alternatives.

  **The Core Issue: Pragmatism vs. Epistemic Status**
  The standard DBA *is* inherently pragmatic: it shows that incoherent credences (violating probability axioms) make you *vulnerable to a sure loss* in a betting scenario. As you rightly point out:

  1.  **Betting Dependence:** If you simply refuse all bets, the "sure loss" never materializes. The argument seemingly only applies to those who *act* on their credences by accepting bets deemed fair.
  2.  **Utility Dependence:** The loss is framed in monetary terms. If your utility for money isn't linear (e.g., you're risk-averse or risk-seeking, or $10 means vastly different things depending on your wealth), the bets framed as "fair" based on your credences might not actually be subjectively fair/acceptable to you. This breaks the connection between your credence and your willingness to accept the bet at the stated odds.

  **So, what *does* the standard DBA establish?**
  It establishes a form of **instrumental irrationality** or **prudential irrationality**. If you *are* the type of person who accepts bets you deem fair (and have linear utility for the stakes involved), then having incoherent credences is a disastrous strategy. It guarantees you lose resources in the long run. This is a powerful argument against incoherence *for agents who engage in decision-making under uncertainty based on those credences*.

  **Bridging the Gap to Epistemic Irrationality: Depragmatized DBAs**
  This is where the "depragmatized" Dutch Book argument comes in. It attempts to sever the direct link to actual betting and monetary loss, focusing solely on the *internal inconsistency* revealed. Here's the core idea:

  1.  **Fair Bets as Epistemic Attitude:** Your credence `P(A) = x` *means* (or implies) that you consider a bet paying $S if A is true, costing `$x*S`, to be a *fair* bet. Accepting or offering it doesn't change your overall expected wealth *based on your own beliefs*. Evaluating a bet as "fair" is an expression of your epistemic state regarding A.
  2.  **The Incoherence as Inconsistency:** If your credences are incoherent, there exists a *collection* (a "book") of bets such that:
      *   You deem *each individual bet* in the collection fair (based on your credences).
      *   But the *collection as a whole* is guaranteed to lose you money (or, in depragmatized terms, is *dominated* by not taking any of the bets, or is *logically* equivalent to a sure loss).
  3.  **The Epistemic Problem:** The argument claims this reveals a deep *inconsistency in your epistemic evaluations*. You are simultaneously committed to judging each component of a package as acceptable/fair while judging the entire package as strictly bad/dominated. This inconsistency is a flaw in your *belief state itself*, regardless of whether you ever act on it or value money linearly. It's a failure of logical coherence in your doxastic commitments.

  **Proponents argue:** This inconsistency *is* epistemic irrationality. Rational belief states shouldn't force you into such evaluative contradictions. Your credences encode your assessments of how the world is; incoherence means those assessments contradict each other in a way that can be exploited logically, even if not practically.

  **Critics (like you might be) counter:** Does "deeming a bet fair" *really* follow purely from having a credence? Isn't the connection between `P(A)=x` and "fairness" of a monetary bet still contingent on desires (e.g., linear utility)? What if I have credences but *never* connect them to *any* evaluation of actions or bets? What does "evaluative inconsistency" mean if I never evaluate bets? The depragmatized argument still seems to smuggle in pragmatic elements (evaluation of actions/bets) to reach an epistemic conclusion.

  **The Alternative: Accuracy-Dominance Arguments**
  This is where accuracy arguments (like those based on *strictly proper scoring rules*, e.g., Brier score) come in. They directly target epistemic goals without any detour through betting or action.

  1.  **The Epistemic Goal:** The primary epistemic goal of credences is *accuracy* – being as close as possible to the truth (1 for true propositions, 0 for false ones).
  2.  **Dominance:** If your credences are incoherent (not probabilistic), then there exists an alternative set of *coherent* credences that is *more accurate than yours **no matter which possible world turns out to be the actual one***. Your incoherent credences are **accuracy-dominated**.
  3.  **The Epistemic Problem:** Holding accuracy-dominated credences is epistemically irrational because you *could have had* a different set of credences (the coherent ones) that would have been *guaranteed* to be more accurate than yours, regardless of how the world actually is. You are failing the core epistemic aim of truth-approximation in the worst possible way – there's a strictly better option available unconditionally.

  **Advantages of Accuracy Arguments:**

  *   **No Pragmatic Elements:** No bets, no money, no action required. It speaks directly to the relationship between your credences and the truth.
  *   **No Utility Dependence:** Accuracy is measured purely by the scoring rule (e.g., squared error), not by any subjective utility function.
  *   **Stronger Epistemic Link:** The irrationality stems directly from failing the core epistemic goal of accuracy.
  *   **Applies Universally:** It applies whether you bet or not, whether you value accuracy linearly or not (as long as you agree that less error is better). The dominated credences are objectively worse at representing the world's state.

  **Is the Betting Machinery Doing Real Work?**
  The betting machinery in the *standard* DBA is doing the work of demonstrating a *practical*, instrumental vulnerability. It's powerful for showing why incoherence is disastrous *if you use your credences for decision-making*.

  *   **Depragmatized DBAs:** These try to leverage the betting framework purely as a *diagnostic tool* to reveal the internal inconsistency, arguing the inconsistency itself is epistemic. The betting scenario isn't *doing* the epistemic work itself, but *revealing* it. Critics argue it leans too heavily on the connection between belief and action.
  *   **Accuracy Arguments:** These largely *replace* the betting machinery. They address the epistemic concern directly without needing the intermediary of bets or losses. Many philosophers (e.g., Joyce, Pettigrew) see them as the superior, more fundamental argument for probabilism.

  **Bottom Line: What is Established and Are Non-Bettors Off the Hook?**

  1.  **Standard DBA:** Establishes **prudential/instrumental irrationality** for agents who act on their credences by accepting bets deemed fair and have linear utility for stakes. *If you never bet, you avoid the sure loss, but the argument doesn't speak directly to the epistemic status of your beliefs.*
  2.  **Depragmatized DBA:** Argues that incoherent credences entail an **inconsistency in your epistemic evaluations** (deeming individual bets fair while their combination is bad). Proponents claim *this inconsistency is itself epistemic irrationality*, regardless of action. Critics remain skeptical that this is purely epistemic and not still implicitly pragmatic. *If you never connect credences to *any* evaluation of bets/actions, this argument struggles to gain traction.*
  3.  **Accuracy-Dominance Argument:** Establishes **epistemic irrationality** directly. Incoherent credences are *objectively worse* at representing the truth than some coherent alternative, *no matter what happens*. This failure to pursue accuracy effectively is irrational for any agent holding beliefs aimed at truth. *This argument **absolutely** applies to someone who never bets. Refusing bets doesn't make your incoherent credences any less accuracy-dominated.*

  **Conclusion:** You are correct that the *standard* Dutch Book argument, with its focus on monetary loss through betting, primarily shows a prudential flaw. The **depragmatized versions** attempt to extract a purely epistemic inconsistency from the betting structure, but this remains contentious. **Accuracy-dominance arguments** provide the strongest and most direct route to the conclusion that incoherent credences are *epistemically* irrational, as they objectively fail the core epistemic goal of accurate representation, irrespective of any action or desire. Someone who never bets is *not* "off the hook" for epistemic irrationality if their credences are incoherent, because the accuracy-dominance argument applies regardless of their betting habits. The betting machinery isn't strictly *necessary* to establish epistemic irrationality; accuracy arguments often do the job better.
