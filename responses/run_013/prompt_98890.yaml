prompt: |-
  I've been going down a bit of a rabbit hole on something called evidential cooperation in large worlds, and I can't tell if it's a genuinely distinct idea or just ordinary reciprocity wearing a sci-fi hat. The rough idea, as I understand it: if the universe is big enough, there are probably lots of other agents out there running something like the same decision procedure as you, so what you choose can count as evidence about what they'll choose even though nothing you do can causally reach them. The upshot is supposed to be that you might have real reason to 'cooperate' with these strangers — not defect in a one-shot prisoner's dilemma you'll never actually get to play with them, pay into things on the assumption that other instances of your reasoning are paying in too — because your cooperating is evidence that they cooperate. It feels like Newcomb's problem scaled up to cosmic size, and it seems to lean on the kind of decision theory where you do what's evidence of a good outcome rather than what causes one. My flatmate reckons it's just dressed-up tit-for-tat: you scratch my back, I scratch yours, and once you strip out the window dressing it's the same old reciprocity with a philosophy degree. I don't think that's right but I can't quite say why.

  Could you compare the two properly for me? I want to know what evidential cooperation in large worlds actually needs in order to get off the ground, versus what reciprocal cooperation needs — what has to be true about the other agents, about your own decision procedure, about whether your action is really evidence for anything — and then where the two come apart. Is evidential cooperation just reciprocity with the causal links filed off, or does it do something reciprocity structurally can't? And if it does, what's the price of admission — does it only work if you've already swallowed a particular theory of rational choice, does it commit you to cooperating with agents you'd never in a million years want to, does it collapse into 'everything is evidence for everything'? I'd rather the comparison bite on the mechanics — what each one is actually doing under the bonnet — than stay at the level of vibes, and I'd like you to be honest about which parts of the case for evidential cooperation are doing real work and which are just the largeness of the world doing the heavy lifting.
reasoning: |-
  Okay, let me try to unpack this user's question. They're deep into evidential cooperation in large worlds (ECLW) and wondering if it's just reciprocity in disguise. Their flatmate thinks it's tit-for-tat with extra steps, but they suspect there's more. I need to compare both properly.

  First, I should clarify the core of ECLW. It's based on the idea that in a vast universe, there are likely other agents using similar decision procedures. Your action serves as evidence for what those similar agents do, even without causal links. So cooperating isn't about affecting others directly but updating your beliefs about their actions. That's different from reciprocity, which relies on repeated interactions and direct responses.

  The user mentions Newcomb's problem. That's a good analogy because both involve evidential decision theory (EDT). In Newcomb's, you one-box because taking one box predicts the money is there. Similarly, in ECLW, cooperating is evidence that other cooperators exist. But reciprocity is causal—it's about influencing future behavior through actions.

  The user wants a mechanical comparison. Let me break down the necessary conditions for each. For reciprocity, you need repeated interactions, identifiable agents, memory, and the ability to respond. Without these, tit-for-tat falls apart. ECLW, however, requires logical ties—similar decision algorithms, large enough world for copies, and using EDT. The other agents don't even need to know you exist.

  Where they come apart? One-shot prisoner's dilemma with no future interactions. Reciprocity can't handle that, but ECLW says you should still cooperate because your action indicates others do too. That's a structural difference. Also, the type of agents matters. Reciprocity works with varied agents as long as they respond. ECLW needs agents with correlated decision-making due to similar algorithms.

  But the user is concerned about the price of admission. ECLW relies on EDT, which is controversial. It might require cooperating with any agent sharing your algorithm, even harmful ones. Plus, the large world assumption is critical—if no similar agents exist, ECLW doesn't work. Reciprocity is more robust but limited in scope.

  The user also worries about evidence becoming meaningless. ECLW avoids this by tying evidence to logical correlations from identical decision processes. It's not that everything correlates, but that same algorithms output same actions in similar situations.

  I should emphasize the key distinction: reciprocity is causal and interventionist, ECLW is evidential and diagnostic. They're different mechanisms. Even if both lead to cooperation, how they get there is fundamentally different. The user's flatmate might miss that nuance, thinking it's just reciprocity scaled up. But without causal links, ECLW operates on a different logic.

  Also, the user wants honesty about what parts are doing the work. The largeness of the world ensures enough copies exist, but the heavy lifting comes from the decision theory itself—EDT's focus on outcomes correlated with actions. If the user rejects EDT, ECLW collapses. Whereas reciprocity stands on causal decision theory, which is more widely accepted.

  In conclusion, ECLW isn't just reciprocity without causality. It's a distinct mechanism based on evidence from logical correlations. But it has higher theoretical costs and specific requirements. The user needs to decide if they buy into EDT and the large world hypothesis to accept ECLW's conclusions.
answer: |-
  You're grappling with a deep and fascinating distinction. Your flatmate's "dressed-up tit-for-tat" view is intuitive but misses the core *mechanism* and *structural requirements* of Evidential Cooperation in Large Worlds (ECLW). Let's break this down mechanically, comparing the engines under the bonnet.

  ## Core Mechanics: Reciprocity vs. ECLW

  1.  **Reciprocity (Tit-for-Tat & Kin):**
      *   **Engine:** **Causal Interaction Loop.**
      *   **Fuel:** Repeated interactions, identifiable agents, memory, ability to respond.
      *   **How it Works:** Your action (e.g., Cooperate/Defect) *causes* a direct response from the *specific* agent you interact with in the *future*. You cooperate *because* it increases the likelihood that *this specific agent* will cooperate with *you* later. It's a strategic investment in altering the *causal future* of your relationship with that agent.
      *   **Necessary Conditions:**
          *   **Repeated Interaction:** You must encounter the *same* (or identifiable) agent(s) multiple times.
          *   **Causal Influence:** Your action must be capable of *changing* the future actions of the agents you interact with.
          *   **Responsiveness:** The other agents must be capable of observing your actions and adjusting their behavior based on them (memory, strategy).
          *   **Agent Specificity:** Cooperation is targeted at *specific* agents you interact with causally.
      *   **Decision Theory:** Firmly rooted in **Causal Decision Theory (CDT)**. You choose the action that *causes* the best expected outcome for yourself, given how it influences the other agent's *future* choices towards *you*.

  2.  **Evidential Cooperation in Large Worlds (ECLW):**
      *   **Engine:** **Logical/Evidential Correlation via Algorithmic Similarity.**
      *   **Fuel:** Large universe (many agents), agents running *similar* decision procedures/algorithms.
      *   **How it Works:** Your action (e.g., Cooperate/Defect) is *logically correlated* with the actions of *other, similar agents* running the *same* (or sufficiently similar) decision procedure, *even if you never interact*. Choosing to cooperate provides *evidence* that *your type of algorithm* tends to output "cooperate" in this situation. Since there are many copies of "your type," this evidence means that *many other agents are also likely cooperating*. You cooperate because *your cooperating* is diagnostic of a *world where cooperation among similar agents is common*, leading to better aggregate outcomes *for agents like you*.
      *   **Necessary Conditions:**
          *   **Large World:** The universe must be large/complex enough that it's probable many agents exist running similar decision procedures.
          *   **Algorithmic Similarity:** Other agents must be running decision procedures that are *logically similar* to yours, especially in how they would reason about this type of problem. They don't need to be *identical*, but their decision outputs must be *correlated* with yours due to shared reasoning.
          *   **Evidential Link:** Your decision must be a reliable *symptom* or *predictor* of the decisions of these similar agents. Your action doesn't *cause* theirs; they are both outputs of the same (or similar) "code" given similar inputs/problems.
          *   **Aggregate Benefit Focus:** The benefit comes not from changing a specific agent's future action towards *you*, but from the *aggregate* outcome created by the correlated actions of *many* similar agents (e.g., funding a public good, establishing a cooperative norm).
      *   **Decision Theory:** Requires **Evidential Decision Theory (EDT)** or **Functional Decision Theory (FDT)**. You choose the action that is the *best news* about the world, i.e., the action that, conditional on you taking it, indicates the best expected outcome. EDT/FDT care about the *correlation* between your choice and desirable outcomes, even absent direct causation.

  ## Where They Fundamentally Come Apart

  The crucial divergence happens when **causal influence is severed but logical correlation remains**. This is most stark in the **One-Shot Interaction with Non-Causal Copies** scenario:

  *   **Situation:** You face a one-shot Prisoner's Dilemma. You know:
      1.  You will *never* interact with this specific opponent again (no repetition).
      2.  You will *never* causally interact with any other agents running a similar algorithm (no future games, no communication).
      3.  However, you believe the universe is vast and contains many agents running *very similar* decision procedures facing *similar* dilemmas.

  *   **Reciprocity's Verdict: DEFECT.**
      *   *Mechanics:* No repeated interaction = no causal loop to exploit. Defecting maximizes your payoff in this single, causally isolated interaction. Your decision provides no *causal lever* to influence any other agent's future action towards *you*. Cooperation is a strictly dominated strategy *causally*.
      *   *Requirements Failed:* Repeated interaction, causal influence.

  *   **ECLW's Verdict: COOPERATE.**
      *   *Mechanics:* Your cooperation is *strong evidence* that agents running *your algorithm* tend to cooperate. Since there are many such agents, this evidence implies widespread cooperation among them. This widespread cooperation leads to better aggregate outcomes for the "class" of agents like you (e.g., public goods funded, cooperative norms upheld). You cooperate because *conditional on you cooperating*, the world is one where cooperation among similar agents is common, leading to good things for your "reference class". Your action is a *logical fixed point*: agents like you cooperate *because* agents like them cooperate.
      *   *Requirements Met:* Large world, algorithmic similarity, evidential link, aggregate benefit focus (via EDT/FDT).

  ## The Price of Admission for ECLW & Potential Pitfalls

  ECLW isn't "free" or just "large universe does the work." It demands specific, sometimes controversial, commitments:

  1.  **Swallowing EDT/FDT:** This is the biggest ticket. If you fundamentally believe rationality is about *causing* good outcomes (CDT), ECLW collapses. EDT/FDT's core premise – that an action's *diagnostic value* matters rationally – is essential and contentious. The "Newcomb" vibe is spot-on; ECLW *is* structurally similar to one-boxing in Newcomb's problem.
  2.  **Strong Algorithmic Similarity Requirement:** The evidential link is only as strong as the similarity. If other agents run *slightly different* algorithms, the correlation weakens. How similar is "similar enough"? This is fuzzy. ECLW works best with idealized, well-defined decision algorithms (like logical inductors or FDT agents).
  3.  **The Large World Assumption is Crucial (But Not Sufficient):** The largeness ensures enough copies exist for the evidence to be meaningful. However, largeness alone doesn't create the *logical correlation*; that comes from the shared algorithm. A large universe full of wildly different agents doesn't support ECLW.
  4.  **Commitment to Cooperating with "Copies":** Yes, ECLW binds you to cooperate with agents running your algorithm *even if you find them morally repugnant* (e.g., copies running on a paperclip maximizer's hardware, if you share the algorithm). Your cooperation is evidence *their* cooperation is likely, benefiting *your* reference class. This is a feature, not a bug, for proponents, but it's deeply counterintuitive and requires accepting a highly abstract notion of self-interest tied to the algorithm.
  5.  **Risk of "Everything is Evidence" Collapse?** ECLW avoids this *if* the similarity condition is strong. The evidence isn't that *any* agent cooperates, but that agents running *this specific logical process* tend to cooperate. It leverages the *logical dependence* of outputs from identical/similar algorithms processing similar inputs. Random correlations aren't sufficient; the link must be grounded in the shared decision-making *procedure*.
  6.  **Bootstrapping Problem:** If *no one* initially runs an algorithm that cooperates via ECLW, how does it start? This is similar to the problem of establishing norms. It might require a critical mass of agents adopting the EDT/FDT view and the large world hypothesis simultaneously.

  ## The "Largeness" and the Heavy Lifting

  *   **Largeness Lifts:** The probability that sufficiently similar agents exist to make the evidential link statistically significant. In a small world, the evidential argument might be too weak to overcome the immediate causal payoff of defection. Largeness makes the existence of copies *probable*, providing the substrate.
  *   **ECLW Does the Real Work:** The core mechanism – using your own decision as *evidence* about the decisions of *logically correlated* agents, and EDT/FDT's prescription to act on that evidence for aggregate benefit – is the distinct engine. Largeness is just the fuel tank size. Reciprocity fundamentally *cannot* operate in the one-shot, non-causal scenario described above; its engine stalls without causal loops. ECLW replaces the causal loop with a logical correlation loop.

  **Conclusion:**

  Evidential Cooperation in Large Worlds is **not** just reciprocity with the causal links filed off. It's a fundamentally different mechanism relying on **logical correlation through algorithmic similarity** and rational choice based on **evidential consequences (EDT/FDT)**, rather than causal consequences (CDT/reciprocity). Reciprocity requires causal interaction loops with specific agents; ECLW requires logical correlation loops with abstract classes of agents defined by their decision procedure.

  The price of admission is high: accepting EDT/FDT and the strong assumptions about algorithmic similarity and large worlds. If you pay that price, ECLW offers a reason to cooperate in scenarios where reciprocity is utterly powerless – one-shot interactions with agents you'll never see again, but who share your cognitive machinery. If you don't buy EDT/FDT, ECLW collapses into an interesting but rationally unsupported thought experiment. Your flatmate's view captures a superficial similarity in outcome (cooperation), but misses the radical difference in the underlying *reason* for that cooperation and the *conditions* under which it applies. The distinction is genuine and significant within the philosophy of rational decision-making.
