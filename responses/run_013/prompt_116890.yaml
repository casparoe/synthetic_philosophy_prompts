prompt: |-
  I'm putting together a two-page proposal for our department's internal seed-grant round -- the one that buys out a single course for a semester, nothing fancy, two pages single-spaced, and they want the question, not a lit review. I've got a half-formed idea I keep failing to pin down, so I want you to write the proposal around it and tell me where it's mush. The idea: everyone knows the loose version of Goodhart's law -- aim at a measure and it stops being a good measure of what you cared about -- and everyone has the usual examples, teaching to the test, citation-chasing, waiting-time targets, whatever was in the news last week. My hunch is that we're lumping together two things that only look alike, and that the lumping is why the standard remedies (better metrics, more metrics, audits, "measure what you actually care about") keep failing in the same way. Call the first one gaming: there's a target that exists independently of the measure, the measure is a more or less decent proxy for it, and agents respond to the measure in ways that pull the proxy off the target. Proxy divergence, effort substitution, the familiar stuff. Call the second one hijacking: the target doesn't have a life of its own, it's partly constituted by the measure -- what counts as a good school, a creditworthy borrower, an excellent department, maybe even a healthy body is at least partly whatever the instrument says it is, and the instrument's uptake is what makes it so. You can't game a target that the metric is making up as it goes, but you can do something arguably worse: capture the instrument, or freeze a contingent settlement into a fact about the kind of thing you're measuring. And the interesting question stops being "is the metric good" and becomes "who decided, and can it be renegotiated," which is a governance question wearing a measurement question's clothes.

  So what I want the proposal to do is make that distinction earn its keep instead of just being a nice pair of labels. It needs a question stated sharply enough to have a determinate answer -- something like: is constitutive measurement a distinct phenomenon from proxy divergence, and does the distinction generate different prescriptions? It needs an honest account of why the existing work leaves this open rather than already settling it. My guess is that each camp has half the distinction and nobody has both halves: the psychometrics and validity people have the machinery for proxy divergence but treat the target as fixed and given; the performativity crowd in STS and economic sociology have the constituting story but are often allergic to the normative question about legitimacy; the philosophy-of-measurement fight between representational and realist views is about whether measurement tracks a structure that's there anyway, which is exactly the hinge I need but they aren't asking my question; and the specification-gaming literature in AI is all gaming, no hijacking, because there the reward function is stipulated. I need you to say that carefully and specifically, and I don't want it to boil down to "nobody has put these two literatures together," which is a boring claim and usually a false one. Then the method, which is conceptual plus a structured comparison of three or four cases chosen so they can't all be redescribed the same way: at least one where the target really is independent (straightforward gaming), at least one where the measure is doing genuine constituting work, and at least one borderline case I have to argue into one box or the other, because the borderline case is where the proposal either has teeth or doesn't. Then what a result looks like -- a criterion for telling the two apart that doesn't just restate the distinction, plus at least one prescription that comes out different depending on which one you're facing -- and what would count as the project failing. I'd say failure is either (a) every case of the constitutive kind turns out to be redescribable as proxy divergence under pressure, or (b) the distinction is real but normatively inert, same remedies either way, in which case I've got a taxonomy and not an argument.

  Practical constraints, since I know you'll ask: one semester, me alone, no fieldwork, no interviews, no IRB nonsense -- all the cases are documented in things I can read. Two pages, so the framing has to be tight and the "why isn't this already done" part has to be short and specific rather than a tour of the field. Don't put any references in, I'll add them myself, and anyway the point of the proposal is the question, not the reading list. Be blunt if you think the distinction collapses; I'd rather find that out now then in month three.
reasoning: |-
  Hmm, the user is asking me to help draft a research proposal for an internal seed grant. They have a half-formed idea about Goodhart's Law that needs refinement. They want to distinguish between "gaming" (proxy divergence) and "hijacking" (constitutive measurement). The proposal needs to be sharp, with a clear research question, justification of why existing literature doesn't address this, methods, and expected outcomes.

  First, I need to make sure I understand their core idea. Gaming is when a measure is a proxy for a pre-existing target, and agents' actions cause the proxy to diverge. Hijacking is when the measure itself defines the target, making the target contingent on the measurement instrument. The user suspects that conflating these is why standard remedies fail.

  The research question needs to be precise. Something like: "Is constitutive measurement distinct from proxy divergence, and does this distinction lead to different normative prescriptions?" Yes, that captures the essence.

  For the literature gap, the user mentioned several fields. Psychometrics focuses on proxy divergence but assumes fixed targets. STS and economic sociology discuss performativity but avoid normative questions. Philosophy of measurement debates realism vs. representationalism but doesn't tackle governance. AI alignment deals with gaming but not hijacking since reward functions are predefined. I need to articulate this without being vague or claiming no one has connected these fields.

  Methods should include conceptual analysis and case studies. The user wants clear categories: one pure gaming, one pure hijacking, and one borderline case. This will test the distinction's robustness. Cases need to be well-documented and accessible since there's no fieldwork. Examples like standardized testing (gaming), credit scoring (hijacking), and university rankings (borderline) come to mind.

  Outcomes and failure conditions are crucial. Success would be a criterion to differentiate the two phenomena and distinct prescriptions. Failure would be if all cases reduce to proxy divergence or if the distinction doesn't change the approach.

  Practical constraints: two pages, single-spaced, no references. The proposal must be concise, focusing on the question. I should be blunt if the distinction might collapse. The user values honesty here to avoid wasted effort.

  I should structure the proposal with sections: Research Question, Gap in Existing Work, Approach, Expected Outcomes, Failure Conditions. Keep each section tight. For the gap, specify each field's limitations without listing references. For methods, outline case selection logic. Emphasize the borderline case as the test.

  Potential pitfalls: If hijacking is just a form of gaming, the distinction fails. Or if governance solutions apply regardless, the distinction is inert. The user's awareness of these risks is good.

  I need to ensure the proposal is sharp and avoids mush. Highlight that the distinction's value lies in generating different solutions—governance for hijacking versus metric design for gaming. The borderline case analysis should demonstrate applicability.

  Finally, keep it under two pages. Use clear headings, concise language, and focus on the argument's novelty and feasibility. Make sure the "why not done" section is precise, not a literature review. Emphasize the governance angle as the key differentiator.
answer: |-
  Here’s a tight, two-page proposal draft structured around your core distinction. I’ve flagged potential "mush" with **[...MUSH?]** and offered blunt critiques. Use what works, scrap what doesn’t.

  ---

  **PROJECT TITLE:** Gaming vs. Hijacking: Diagnosing Measurement Pathologies to Enable Effective Remedies

  **1. Research Question:**  
  When metrics distort organizational goals (Goodhart’s Law), are we facing *proxy divergence* (gaming a stable target) or *metric constitution* (hijacking, where the metric defines the target)? Crucially, **does diagnosing this distinction yield divergent, actionable prescriptions for governance and metric design?** **[...MUSH?]** *The "actionable prescriptions" part must be earned later – it's your claim, not yet demonstrated.*

  **2. The Gap: Why This Isn't Settled (and Why It Matters)**  
  Existing literatures fragment the problem, preventing an integrated diagnosis:
  *   **Psychometrics/Validity Theory:** Provides robust tools for detecting proxy divergence (e.g., Campbell’s Law, construct validity threats). **Limitation:** Treats the target ("construct") as pre-existing, stable, and discoverable, **[...MUSH?]** *"Discoverable" might overstate – often assumed rather than critically examined.* obscuring cases where metrics actively shape the target’s definition and value (e.g., what "creditworthiness" *is* post-FICO).
  *   **Performativity (STS/Econ Sociology):** Richly describes how metrics *constitute* realities (e.g., Callon on economics, Espeland on rankings). **Limitation:** Often avoids explicit normative evaluation of *which* constitutions are legitimate or desirable, focusing on description over remedy. **[...MUSH?]** *Be prepared for STS pushback claiming they *do* address this; clarify you mean *prescriptive* legitimacy frameworks.*
  *   **Philosophy of Measurement (Representational vs. Realist):** Debates whether measurement tracks mind-independent structures (realism) or establishes conventions (representationalism). **Crucial Insight:** This is the ontological hinge (target independence vs. constitution). **Gap:** This debate rarely connects directly to *organizational pathologies* or *governance solutions* for metric-induced distortion.
  *   **AI Alignment/Specification Gaming:** Models sophisticated gaming against a *stipulated* reward function. **Limitation:** Precisely because the reward function is fixed by design, it inherently excludes hijacking/constitution dynamics. **[...MUSH?]** *This is solid – their setup rules out your second category by assumption.*

  **Net Gap:** Each camp possesses half the diagnostic toolkit. Psychometrics sees gaming but misses constitutive hijacking; Performativity sees constitution but sidesteps prescriptive governance; Philosophy identifies the hinge but not its practical fallout; AI assumes fixed targets. **Integrating these to enable *differential diagnosis* remains undone.**

  **3. Approach: Conceptual Clarity through Critical Cases**  
  Method: Conceptual analysis + comparative case study (documentary sources only).  
  **Case Selection Logic:** Cases chosen to stress-test the distinction and force differential diagnosis:
  1.  **Clear Gaming (Proxy Divergence):** *Hospital Waiting Times.* Target (timely care) pre-exists measure. Gaming observed (e.g., "clock-stopping," prioritization distortions). Remedies focus(ed) on better proxies/audits. *Tests: Can hijacking explain this?*
  2.  **Clear Hijacking (Constitution):** *Algorithmic Credit Scoring (e.g., FICO).* The metric didn't just measure creditworthiness; it radically redefined what counted as creditworthiness, creating new categories ("subprime") and freezing a specific, contingent model into operational reality. Target is inseparable from the instrument. **[...MUSH?]** *Is this *really* clear-cut? Argue why redefinition here is constitutively different from simply uncovering a "truer" construct.*
  3.  **Borderline Crucible:** *University Department Rankings (e.g., NRC, internal metrics).* Targets ("excellence," "impact") are hotly contested. Metrics (citation counts, grant $) demonstrably reshape hiring, research focus, and institutional priorities. **Key Argument:** This case *forces* the distinction – is it gaming a fuzzy-but-stable target, or is the metric actively solidifying *one version* of excellence as dominant, potentially *hijacking* the collective ability to redefine it? **[...MUSH?]** *This is the make-or-break. Your ability to persuasively place it (leaning towards hijacking?) demonstrates the distinction's power. If it collapses into gaming, the project fails.*

  **4. Expected Outcomes & Value**  
  *   **Diagnostic Criterion:** A practical framework distinguishing gaming (target independence threatened by proxy drift) from hijacking (target contingency frozen/redefined by metric uptake), based on ontological status of target and mechanism of distortion. **[...MUSH?]** *"Ontological status" is precise but jargony; ensure clarity.*
  *   **Differential Prescriptions (The Payoff):**  
      *   **Gaming:** Remedies focus on *metric design/validation* (better proxies, multi-metric systems, robustness checks).
      *   **Hijacking:** Remedies shift to *governance & contestation* (deliberative processes for defining targets *before/during* metric adoption, mechanisms to renegotiate metrics, transparency on constitutive effects). **[...MUSH?]** *This is the core claim needing validation in the cases – does this split hold water?*
  *   **Value:** Moves beyond generic "Goodhart’s Law" warnings to provide actionable diagnostic tools. Explains why technical fixes often fail for constitutive problems, revealing the underlying governance challenge.

  **5. What Failure Looks Like (Risks & Mitigation)**  
  This project fails if:
  *   **(a) Collapse:** All cases, especially the borderline, are convincingly redescribed *only* as proxy divergence (gaming) under conditions of target ambiguity. *Mitigation:* Precisely define the *mechanism* of constitution (metric uptake defining value/kind) vs. gaming (effort substitution corrupting measurement).
  *   **(b) Normative Inertia:** The distinction is real but yields no *different* prescriptions; governance remedies are deemed universally applicable. *Mitigation:* Rigorously tie prescriptions to the diagnosed mechanism (design for drift, governance for constitution). **[...MUSH?]** *This is the biggest risk – be honest with yourself.*

  **Feasibility:** One-semester course buyout is sufficient. Conceptual analysis and documented case studies are manageable solo. Output: Draft framework/article.

  ---

  **Blunt Feedback on Potential Mush:**
  1.  **"Constitution" Clarity:** The hijacking/constitution move is powerful but philosophically loaded. Are you arguing the target *literally doesn't exist* without the metric (strong social construction), or that the metric *operationally defines and stabilizes* a contested/emergent target (more pragmatic)? The latter is stronger and avoids rabbit holes. *Refine your definition.*
  2.  **The Borderline Case is EVERYTHING:** If you can't *force* a distinction in your borderline case using evidence (not just assertion), the project crumbles. Choose wisely and be prepared to dissect it. Rankings are good because the stakes are high and contestation is visible.
  3.  **"Governance" is Vague:** What *specific* governance mechanisms differ? "Deliberative processes" is a start, but what makes them distinct from, say, a committee designing a *better proxy*? Link governance remedies explicitly to the *contingency* and *contestability* revealed by the hijacking diagnosis.
  4.  **Prescription Payoff:** The strongest pitch is the differential remedy. Don't just assert it; show *how* the diagnosis in cases 1 vs. 2 *logically leads* to different actions. *Why* is multi-metric design inadequate for a hijacked target? (Answer: Because the *definition of the target itself* is the problem, not the quality of the proxy).
  5.  **Is Hijacking Just "Gaming a Socially Constructed Target"?** This is the collapse risk. Your rebuttal must be: Gaming assumes agents strategically divert effort *away* from the (pre-existing, valued) target towards the metric. Hijacking occurs when the metric's adoption *changes what counts as the target/value itself*, so there's no stable "real" target to divert effort *from*. The conflict is ontological (nature of the target) and temporal (metric defines target *through* use). *Hone this argument.*

  **Overall:** The core idea is excellent and novel in its integration and practical aim. The proposal structure is sound. The mush lies in the precision of definitions (especially "constitution"), the *demonstration* of the distinction in the borderline case, and the *specificity* of the divergent prescriptions. Sharpen these, and it's a killer proposal. Good luck!
