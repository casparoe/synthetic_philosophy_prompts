answer: |-
  Your inquiry identifies a profound and recurring argumentative pattern—one that straddles metaphysics, philosophy of physics, and epistemology. This form is indeed pervasive, but it lacks a single universally accepted name. Below, I'll carve its structure, name its closest analogues, demarcate its boundaries, and evaluate your examples.

  ### Core Structure of the Argument
  1. **Premise (Invariance under transformation)**:  
     A description of the world (or a theory) is invariant under a specific transformation (e.g., swapping entities, shifting configurations, relabeling parts).  
  2. **Inference (No factual difference)**:  
     Therefore, the distinction or entities in question correspond to no real difference in the world.  

  The inference hinges on a principle: **If a difference makes no difference, it is not a difference at all.**  

  ---

  ### Established Names & Their Limitations  
  While no term perfectly captures all instances, these are the closest:  
  1. **Leibniz's Principle of the Identity of Indiscernibles (PII)**  
     - *Definition*: If two entities share all properties, they are identical.  
     - *Relation*: Your argument is PII's *converse*: if swapping X and Y changes nothing, then they lack individuating properties.  
     - *Limitation*: PII is often contested; your form is broader (applies to displacements, rotations, etc.).  

  2. **Anti-Haecceitism**  
     - *Definition*: Denial of primitive "thisness" (*haecceity*) that individuates entities beyond qualitative properties.  
     - *Relation*: Directly targets your examples (e.g., swapping indistinguishable spheres).  
     - *Limitation*: Primarily a metaphysical thesis; less focused on symmetry in physical theories.  

  3. **Symmetry-to-Reality Inference** (in philosophy of physics)  
     - *Term*: James Ladyman, Don Ross (*Every Thing Must Go*, 2007) formalize this as grounding *ontic structural realism*.  
     - *Definition*: Physical symmetries (e.g., gauge invariance, diffeomorphism invariance) reveal which structures are real.  
     - *Strength*: Best fits your GR and QM examples.  

  4. **Verificationist "No-Difference" Principle**  
     - *Definition*: If no observable consequence follows from a distinction, the distinction is meaningless.  
     - *Relation*: Shares epistemic roots but is more restrictive than your form.  

  **Proposed Name**: **The Invariance Argument for Ontic Insignificance**  
  - *Why*?: "Invariance" centers the premise; "ontic insignificance" specifies the conclusion (no real difference).  
  - *Scope*: Covers all cases where transformations leave descriptions unchanged.  

  ---

  ### Boundaries & Demarcations  
  #### What the Argument Covers  
  - **Modest Conclusion** (Epistemic): The theory cannot represent the difference (e.g., quantum particles lack individual labels).  
  - **Immodest Conclusion** (Ontic): The difference does not exist in reality (e.g., anti-haecceitism about spacetime points).  
  - **Structural Conclusion**: Only relations/structure are real (e.g., the sphere’s rotation is unreal, but its symmetry *is* real).  

  #### What it Excludes  
  - Cases where invariance is *broken* (e.g., spontaneous symmetry breaking in particle physics).  
  - Differences with observable consequences (e.g., swapping distinguishable objects).  
  - Purely conventional differences (e.g., labeling axes "x" or "y").  

  ---

  ### Relation to Adjacent Principles  
  | Principle             | Relation to Your Argument |  
  |-----------------------|---------------------------|  
  | **Principle of Sufficient Reason (PSR)** | *Motivates but doesn’t entail*: PSR asks "Why this rather than that?" If no answer, your argument denies "this" and "that" are distinct. |  
  | **Verificationism**   | *Overlaps but narrower*: Verificationism rejects *meaning* for unobservables; your argument can deny *existence*. |  
  | **Anti-Haecceitism**  | *Subsumed*: Your argument is a *tool* to defend anti-haecceitism. |  
  | **Gauge Invariance**  | *Exemplar*: In GR/QFT, gauge transformations are "unreal" symmetries—a core instance. |  

  ---

  ### Analysis of Your Examples  
  | Case                          | Fits the Form? | Key Inference |  
  |-------------------------------|----------------|--------------|  
  | **Two spheres in empty space** | Yes | Swapping them changes nothing → no haecceitistic difference. |  
  | **Universal displacement**    | Yes | Shifting all matter changes nothing → space is relational. |  
  | **GR metric reassignment**    | Yes | Diffeomorphism invariance → spacetime points lack individuality. |  
  | **QM identical particles**    | Yes | Particle exchange symmetry → particles are not individuals. |  
  | **Rotating homogeneous sphere** | Yes | Rotation changes nothing → no distinct state of rotation. |  

  **Critical Note**: The same premise can support opposing conclusions:  
  - **Eliminativist**: "No difference in description → no difference in reality."  
  - **Structural Realist**: "Invariance reveals structure as the only reality."  

  ---

  ### When the Inference is Sound vs. Seductive  
  - **Sound When**:  
    - The description/theory is *complete* for the domain (e.g., QM for particles).  
    - The transformation is *physically possible* (e.g., swapping electrons).  
    - Modality is respected (e.g., invariance holds across possible worlds).  

  - **Seductive (and Risky) When**:  
    - Conflating *epistemic limitation* (we can’t detect a difference) with *ontic absence* (no difference exists).  
    - Overgeneralizing: Invariance in *one theory* (e.g., classical mechanics) may not hold in a more fundamental theory.  
    - Ignoring context: Rotating a sphere *could* matter if space is absolute (Newton) but not if relational (Leibniz).  

  ---

  ### Conclusion  
  Your argumentative form is the **Invariance Argument for Ontic Insignificance**. It is not a logical tautology but a metaphysical principle grounded in parsimony: do not multiply differences beyond necessity. Its force depends on background commitments:  
  - **Anti-haecceitists** embrace it globally.  
  - **Structural realists** use it to eliminate objects in favor of structures.  
  - **Verificationists** see it as semantic hygiene.  

  **Carving the Core**: The inference is strongest when invariance is fundamental (e.g., in GR or QM), and weakest when tied to contingent descriptive limitations. Its power lies in exposing when our distinctions are projections, not discoveries.
