answer: |-
  ### Session Plan: Hobbes's Geometry as Maker's Knowledge  
  **Goal:** Show that geometry is central to Hobbes's philosophy—not a crank obsession—by demonstrating how "maker's knowledge" (certainty via construction) underpins both geometry and politics.  

  ---

  #### **Sequence of Ideas**  
  | Step | Idea                                                                 | Why It Has to Come Here                                                                 |
  |------|----------------------------------------------------------------------|-----------------------------------------------------------------------------------------|
  | 1    | **The Problem of Certainty**: How can we know anything for sure? Hobbes rejects Descartes' innate ideas—certainty only comes from what we *construct* (e.g., social contracts). | Starts with a shared reference (Descartes/Leviathan). Creates urgency: without construction, knowledge is opinion, not truth. |
  | 2    | **Maker's Knowledge Defined**: We know things with certainty only when we *cause* them (e.g., a craftsman knows a table because they built it). Natural objects (e.g., rocks) can’t be known certainly. | Sets the core principle *before* geometry. If skipped, the geometric example seems trivial, not epistemological. |
  | 3    | **Geometry as Construction**: Points/lines/circles are defined by *motion* (e.g., a circle is a point moved around a fixed center at fixed distance). We "make" figures via idealized motion. | Applies maker’s knowledge concretely. Must follow Step 2 to show geometry isn’t arbitrary—it’s constrained by definitions of motion. |
  | 4    | **Demonstration via Construction**: Use the **circle example** (see below) to prove a property (all radii equal) solely from its generation by motion. No axioms—just the act of making. | Shows *how* construction yields proof. If before Step 3, they’ll default to "self-evident" assumptions. |
  | 5    | **Politics Parallel**: The commonwealth is "made" by humans via covenant (social contract)—so like geometry, its properties (e.g., sovereignty = peace) are demonstrable. | Payoff. Must come after geometry; otherwise, politics feels bolted on. Maker’s knowledge is the bridge. |

  ---

  #### **Carrying Example: The Circle**  
  - **Example**: A circle is generated by moving a point (B) around a fixed point (A) while maintaining a fixed distance (radius).  
    - **Must Have**:  
      - Kinematic definition (motion as cause).  
      - A demonstrable property: *All radii are equal* because the distance is fixed *during construction*.  
      - No pre-existing shape—the circle *is* the trace of motion.  
    - **Must Lack**:  
      - Algebraic formulas (avoids modern math associations).  
      - External axioms (e.g., Euclid’s postulates)—proof comes *only* from the act of making.  
  - **Why it works**: Simple enough to avoid confusion, but profound—equality of radii isn’t assumed; it’s *caused* by the motion. If they say "trivial," ask: *"Could you prove this without referencing any prior assumptions?"*  

  ---

  #### **Misconceptions to Head Off**  
  | Misconception                     | Where in Sequence         | How to Head Off                                                                 |
  |-----------------------------------|---------------------------|---------------------------------------------------------------------------------|
  | "Geometry is arbitrary if we make it." | After Step 3 (kinematic definitions) | Ask: *"Does moving a point randomly create a circle? Why not?"* Emphasize: Definitions constrain motion (fixed distance = necessary structure). |
  | "Demonstrable = self-evident."    | After Step 4 (circle proof)         | Contrast: *"Self-evident truths need no proof. But here, we* derived *radii equality—how is that different?"* Highlight cause (motion) over intuition. |
  | "This has nothing to do with politics." | Before Step 5 (politics parallel) | Preempt during Step 2: *"If maker’s knowledge applies to tables and circles, what else might it apply to?"* Hint at artifice (e.g., "Is the state natural or constructed?"). |

  ---

  #### **Check for Understanding**  
  - **Question**: *"If a carpenter claims certain knowledge of a chair they built, but only opinion about a forest they wandered through, how would Hobbes explain this? How does this apply to the sovereign’s power?"*  
    - **What to listen for**:  
      - Correct: "The carpenter *made* the chair, so they know its properties causally. Like geometry or the state—we *make* them, so we can demonstrate their necessities."  
      - Wrong: "The carpenter just knows chairs better" (misses causal construction).  

  ---

  #### **What to Leave Out**  
  - **Explicitly skip**: Squaring the circle, Wallis feud, algebra-vs-geometry fights.  
  - **Why**: These muddy Hobbes’s *philosophical* point with historical noise. Say: *"We’re focusing on why Hobbes thought maker’s knowledge made geometry (and politics) demonstrable—not his mathematical accuracy."*  

