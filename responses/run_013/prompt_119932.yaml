prompt: |-
  I'm a novelist — two books in, and this one has dragged me into actual research for the first time. It's set around 1790, half in a Yorkshire mill town and half in a merchant household in Canton, and to write it honestly I need to know whether the thing my English characters take for granted was a near-run thing or a foregone conclusion, so I've been reading economic history about the so-called Great Divergence and I've hit a wall that's turned out to be more interesting than the wall I expected. The debate about why northwestern Europe — or England, or Britain, I can't even settle the unit, which I suspect is part of it — pulled ahead of the Yangzi delta seems to have been running for decades without anyone actually winning. One camp tells me it was late and contingent: coal, New World land and silver, a lucky break somewhere around 1750-1800, and before that the two regions were roughly comparable in wages and living standards, so the interesting question is why the break happened at all. Another camp says no, it was centuries in the making — property rights, how land and labour were organised, the whole institutional inheritance — and that looking at 1750 is looking at the last act. Then there's a third position that says the question itself is the problem: that asking why Britain rather than China takes two arbitrarily drawn units and a shared teleology (both on their way to industrial capitalism, one got there first) and quietly compares them, and that the real contrast should be between regions, or seperate trajectories, or should drop the counterfactual altogether. My historian friend says this is normal scholarly churn and I should just pick a version and write, but I don't think it is normal churn — in my notes I've been calling it the shifty explanandum, because each camp seems to quietly redefine what's being explained (when the divergence happened, what counts as 'ahead', what the comparison class is) and then the evidence can't adjudicate, since there's nothing shared left to test against. Though it's also possible I've just invented a fancier name for my own confusion.

  So: diagnose it for me, don't settle it. Is this a substantive fight about facts, a fight about evidence and method (numbers vs narrative, national aggregates vs regional ones), a partly verbal fight where 'divergence' and 'ahead' mean different things to different people, or is the underlying why-question genuinely ill-posed in the way the third camp suggests — and if it's ill-posed, is it the units, the counterfactual, the implicit direction of causation, or something that generalises to every why-A-and-not-B question? Because I keep suspecting this is a general shape and not a quirk of this literature — why modern science there and not here, why capitalism there, why the industrial revolution there — and that the same impasse would show up in all of them, but I don't know enough to tell whether that's a real structural point or just me pattern-matching. And please no reading list, I've got four feet of it already; I want the diagnosis, not more books. I'm definately fine with you disagreeing with my shifty-explanandum hypothesis, but if you do, tell me what's wrong with it specifically.

  Give it to me in five bits, in this order: 'What's actually being disputed' (short, a couple hundred words, and be honest if it's less than I think); 'The camps, in their own terms' (the longest part — describe each position the way its holders would recognise it, including the third one, no strawmen); 'Diagnosis' (what kind of disagreement this is, and what in the debate supports your reading over mine); 'What would count as progress' (concrete — a dataset, a decision about units, a formal treatment of contrastive explanation — and say plainly if the honest answer is 'not much'); and 'For the novel' (three or four sentences on what I can safely put on the page without a historian throwing the book at me).
reasoning: |-
  Okay, the user is a novelist working on a historical novel set in 1790 across Yorkshire and Canton. They've been researching the Great Divergence debate and hit a conceptual wall. They don't want more sources - they want a diagnostic breakdown of why this academic debate feels unresolvable.

  Hmm, their core frustration is fascinating - they've noticed that scholars seem to redefine the explanandum (what's being explained) which makes evidence incomparable across camps. They call this the "shifty explanandum" problem. Smart observation. Their meta-question is whether this is particular to economic history or reveals something fundamental about comparative "why here not there" questions.

  Breaking down their request: they want five structured sections. First, clarifying what's actually disputed (probably less than they think). Then explaining each camp's self-perception without strawmanning. Third, diagnosing the nature of the disagreement. Fourth, what real progress would look like. Finally, practical takeaways for their novel.

  Key insights forming: 
  The dispute isn't mainly about facts but about explanatory frameworks. Camp 1 (late/contingent) sees divergence as a sudden rupture; Camp 2 (deep roots) as inevitable unfolding; Camp 3 (reframers) rejects the premise. The third camp's critique about teleology is particularly potent - the question assumes both regions were "racing" toward industrialization.

  For diagnosis: Their "shifty explanandum" hypothesis holds water. The debate conflates three distinct questions: timing (when did gaps appear?), nature (what constituted "ahead"?), and inevitability (was it path-dependent?). Progress would require disentangling these, but methodological nationalism and Eurocentric benchmarks hinder this.

  Novelist implications: They can safely show characters perceiving Britain's rise as either natural or surprising based on their backgrounds. The key is portraying 1790 as a moment when outcomes felt uncertain - which aligns with historical contingency. Should emphasize regional variation within both England and China.

  Most satisfying realization: This impasse absolutely generalizes to other "why here not there" questions. The units problem (nation vs region), teleology, and counterfactual fragility recur in debates about scientific revolutions or capitalism's origins. Their pattern-matching instinct is correct.
answer: |-
  Here's your diagnostic breakdown, structured as requested:

  ### 1. What's Actually Being Disputed (Short & Honest)
  Fundamentally, scholars dispute **when, why, and even *if* a decisive, persistent economic gap favoring Britain over core Chinese regions opened up, and what that gap signifies.** The core disagreement isn't primarily about *raw data points* (though data interpretation fuels arguments), but about **narrative framing, causal hierarchy, and the very definition of "ahead."** Is the key story one of *rupture* or *culmination*? Is "divergence" measured by wage rates, productivity, institutional resilience, or future potential? Crucially, they disagree on **which level of analysis (institutional, geographical, technological, temporal) holds the primary explanatory power.** Your "shifty explanandum" hits close: the debate often conflates *timing*, *causes*, and *definition* of the phenomenon.

  ### 2. The Camps, In Their Own Terms (No Strawmen)
  *   **Camp 1 (Late & Contingent - "The Rupture"):** "The Great Divergence was a late 18th/early 19th-century phenomenon. Prior to c. 1750-1800, advanced regions like the Yangzi Delta and Britain showed remarkable parity in sophisticated markets, agricultural productivity, and living standards (measured by wages or consumption baskets). The decisive shift wasn't preordained. It resulted from a unique, somewhat fortuitous *conjuncture*: Britain's accessible coal deposits meeting technological innovation (steam), combined with the windfall of New World resources (land, silver, calories) easing constraints. Without this specific cluster of advantages appearing *when* and *where* it did, sustained industrial growth might not have taken off in Britain, and the Yangzi Delta remained highly competitive."
  *   **Camp 2 (Deep Roots - "The Culmination"):** "Focusing solely on 1750 misses the point. The divergence stems from deep-seated *institutional* and *structural* differences evolving over centuries. Key factors include: secure property rights (especially for non-elites), constraints on arbitrary state power, financial systems enabling long-term investment, labor markets favouring innovation over coercion, and scientific cultures fostering practical application. These features, developing uniquely in NW Europe (particularly Britain) from the medieval period onward, created a more fertile environment for sustained innovation and productivity growth. By 1750, these institutional advantages had already set Britain on a distinct trajectory; the Industrial Revolution was the *manifestation*, not the *cause*, of this long-term divergence in potential."
  *   **Camp 3 (Reframing the Question - "The Problematic Premise"):** "The very question 'Why Britain/Europe and not China?' is flawed. It imposes an anachronistic teleology (industrial capitalism as the inevitable goal), treats nation-states or large civilizational blocs as meaningful units of comparison when economic dynamism was regional (Yangzi vs. Britain, not 'China' vs. 'Europe'), and implicitly assumes a single path of development. Comparing 'Britain' and 'China' aggregates vast internal diversity. We should instead analyze distinct regional trajectories within their own contexts. 'Divergence' implies convergence beforehand, which is debatable, and 'ahead' depends entirely on the chosen metric (GDP per capita? Technological sophistication? Social stability?). The counterfactual ('why not China?') is historically incoherent given fundamentally different political economies and constraints."

  ### 3. Diagnosis (Nature of Disagreement & Shifty Explanandum)
  This is **primarily a methodological and philosophical disagreement masquerading as an empirical one**, validating your "shifty explanandum" insight, though not perfectly.

  *   **Supporting Your Hypothesis:** You're right that each camp implicitly defines the core explanandum differently:
      *   Camp 1: Explains a *sudden productivity/innovation gap* c. 1750-1820.
      *   Camp 2: Explains the *long-term institutional foundations* enabling that later take-off.
      *   Camp 3: Challenges the validity of the *comparative framework itself*.
      Evidence *is* selectively marshalled based on these definitions. Wage data supports Camp 1's parity claim; legal charters and patent records support Camp 2's institutional focus; critiques of GDP estimates and regional variation support Camp 3. The units *are* fluid (nation/region/civilization). "Ahead" *is* slippery (material living standards vs. technological capacity vs. institutional resilience). The counterfactual *is* problematic.
  *   **Nuance:** It's not *purely* a verbal or definitional fight. There are substantive disputes about data interpretation (e.g., real wage estimates, GDP reconstructions), the significance of specific events (e.g., Glorious Revolution), and the relative weight of factors like coal vs. institutions. However, **the fundamental impasse stems from incompatible starting assumptions about the scale, timing, and nature of the phenomenon being explained, and what constitutes a valid explanation.** Your "shifty explanandum" captures the core issue: **the debate lacks consensus on *what exactly requires explanation*.** This structure *does* generalize to "why here not there" questions (Scientific Revolution, Rise of the West), where unit definition, teleology, and counterfactuals create similar impasses.

  ### 4. What Would Count as Progress (Concrete, Potentially Pessimistic)
  Genuine progress would likely require:

  1.  **Explicitly Decoupling Questions:** Rigorously separating: a) *When* did significant gaps in specific metrics (wages, energy use, productivity in *comparable* sectors) open? b) *What* were the most significant proximate causes of that gap? c) *What* were the necessary (but perhaps not sufficient) deeper preconditions? d) *How* valid is the comparison itself?
  2.  **Micro-Level, Comparative Regional Studies:** Abandoning "Britain vs. China" for focused comparisons (e.g., Lancashire textile district vs. Songjiang cotton region c. 1780-1820), examining decision-making, factor mobility, institutional responses to stress, and innovation diffusion *on the ground*.
  3.  **Formalizing Contrastive Explanation:** Developing frameworks that clearly define the "fact" (Britain industrialized first), the "foil" (Yangzi Delta did *not* industrialize similarly *at that time*), and the *specific difference* being posited as decisive (e.g., "Presence of X in Britain *and absence of functionally equivalent X* in the Delta under comparable pressure").
  4.  **Honest Answer:** Significant reconciliation is unlikely soon. Progress might look like **Camp 1 & 2 agreeing on specific periods/regions for comparison and jointly defining measurable thresholds for "divergence," while Camp 3 pushes for richer, non-teleological regional narratives without direct comparison.** A major dataset breakthrough (e.g., universally accepted, granular regional GDP/wage series globally) is improbable.

  ### 5. For the Novel (What You Can Safely Put on the Page)
  *   **Portray 1790 as a moment of profound, visible change in Britain (mechanization, urbanization, rising output) contrasted with sophisticated but differently organized commerce/production in Canton.**
  *   **Show English characters *perceiving* their advantage as either natural/inevitable (reflecting Camp 2 ideas) or surprising/fragile (reflecting Camp 1), based on their background (merchant, artisan, intellectual).**
  *   **Highlight regional variation *within* England (mill town vs. agrarian south) and China (Canton's global trade vs. inland subsistence).**
  *   **Avoid definitive authorial statements about "why Britain won." Focus on characters' experiences and debates reflecting the *uncertainty* and nascent explanations of their own time (e.g., discussing steam power, trade profits, or "English liberty").**

  This approach captures the dynamism and tension of the period without needing to resolve an unresolvable academic debate, grounding the divergence in human experience and perception. Historians might quibble with character interpretations, but the *historical reality* you portray – a world in flux, with futures uncertain – is fundamentally sound.
