answer: |-
  ### Exam Question: Animals, Ethics, and Uncertainty  
  **Time Allowed:** 90 minutes  
  **Value:** 40% of Final Grade  

  **Background:** The "scale argument" for insect welfare claims that because insects are extraordinarily numerous (estimated at 10¹⁸ alive at any time, plus farmed insects), even a small probability *p* that they are sentient (i.e., capable of experiencing morally relevant pain) implies a massive expected disvalue from actions harming them. This is often contrasted with human and vertebrate animal welfare (e.g., 8 billion humans and 10¹⁰ farmed vertebrates).  

  **Your Task:** Critically analyze this argument as a decision under *uncertainty*, not as an empirical claim about neurobiology. Use the stipulated numbers and treat *p* as a fixed small constant (e.g., *p* = 0.01). Address all parts below.  

  **Part A (6 marks):** Reconstruct the scale argument as a formal decision under uncertainty. Precisely define:  
  (i) What the probability *p* represents, and what work it does in the calculation.  
  (ii) The role of insect numerosity (*N* = 10¹⁸) and per-insect disvalue (*d*).  
  *(Guidance: Focus on how uncertainty transforms the problem—avoid restating the argument descriptively.)*  

  **Part B (6 marks):** A common objection is: "Sentience isn’t independent per insect—either all insects are sentient or none are—so multiplying *p* by *N* is invalid." Explain why this objection fails. Use expected value reasoning to show how the scale argument retains force even if sentience is a binary class property.  

  **Part C (8 marks):**  
  (i) Suppose we reduce the per-insect disvalue *d* (e.g., because insect experiences are "fainter"). Demonstrate mathematically why the argument is *insensitive* to extreme reductions in *d* (e.g., *d* = 10⁻⁹ of human disvalue).  
  (ii) Does this argument "prove too much"? Identify one concrete implication for an *individual* (e.g., daily choices) or *government* (e.g., policy) if we extend this reasoning to entities with even lower *p* or *d* (e.g., AI, plants, or digital minds). Defend your view.  

  ---

  ### Model Answer (670 words)  
  **Part A:** The scale argument is a decision under uncertainty where we lack knowledge about insect sentience but must assign moral weight to potential harms. Crucially, *p* is the *credence* (subjective probability) that *insects as a class* are sentient—not per insect. It quantifies our uncertainty about whether insects have morally relevant experiences. The argument calculates *expected disvalue* (EDV) as:  
  **EDV = *p* × *N* × *d***  
  Here, *N* (e.g., 10¹⁸) amplifies the impact of *d* (disvalue per insect harm, e.g., pain from being crushed). *p* scales the entire EDV: if *p* is low, EDV falls linearly, but *N* is so large that EDV remains enormous even for tiny *p*. For example, if *p* = 0.01 and *d* is 1/1000 of human disvalue, EDV for all insects could exceed that of humanity (where *N* = 8×10⁹) by orders of magnitude. The core work of *p* is to convert ontological uncertainty into a normative weight for decision-making, forcing us to weigh low-probability, high-impact risks.  

  **Part B:** The objection misunderstands expected value. Even if sentience is a class-level property (all-or-nothing), *p* represents the probability *that the entire class is sentient*. The EDV formula **EDV = *p* × (*N* × *d*)** still holds: if insects are sentient (probability *p*), the total disvalue is *N* × *d*; if not (probability 1-*p*), disvalue is 0. Thus, EDV is the probability-weighted average: [*p* × (*N* × *d*)] + [(1-*p*) × 0]. For instance, with *p* = 0.01, *N* = 10¹⁸, and *d* = 10⁻⁶ (a conservative estimate of per-insect disvalue), EDV = 10¹⁰ "disvalue units." This dwarfs the EDV of harming all humans (e.g., 8×10⁹ units if *d* = 1 per human). The objection confuses *aggregation* (which requires independence) with *expectation* under class uncertainty—the latter only requires that we can assign a probability to the sentience hypothesis itself.  

  **Part C (i):** The argument is robust to drastic reductions in *d*. Suppose *d* is reduced to 10⁻⁹ (one-billionth) of human disvalue per insect. Then:  
  **EDV = *p* × *N* × *d* = 0.01 × 10¹⁸ × 10⁻⁹ = 10⁷ disvalue units.**  
  This still exceeds the EDV of harming all humans (8×10⁹ units) by a factor of 1.25. Even if *d* = 10⁻¹² (one-trillionth), EDV = 10⁴—comparable to harming 10,000 humans. Only if *d* is implausibly tiny (e.g., <10⁻¹⁸) does EDV become trivial. This insensitivity arises because *N* is astronomically large: multiplying by *d* scales EDV linearly, but *N*’s size compensates for extreme *d*. Claims that insects "barely feel anything" thus fail unless *d* is near-infinitesimal—far smaller than typical ethical intuitions allow.  

  **Part C (ii):** The argument risks "proving too much" by granting moral weight to highly speculative entities. For example, if we apply it to digital minds in unverified AI systems (with *N* = 10²⁰ simulated entities, *p* = 10⁻⁶ credence in sentience, *d* = 10⁻³), EDV could still be massive (10¹¹ units). This implies concrete dilemmas:  
  - **Individual implication:** A person might avoid using AI services or driving (insect deaths) due to non-trivial EDV, despite high convenience costs.  
  - **Government implication:** Policymakers might divert resources from human poverty to AI sentience research or insect-friendly farming, as EDV could theoretically justify prioritizing marginal probabilities over known suffering.  
  This is defensible if we accept longtermist ethics (focusing on tail risks), but it challenges intuitive moral priorities. The key takeaway is not that we *must* prioritize insects, but that uncertainty forces engagement with extreme-stakes trade-offs—even for "unlikely" entities.  

  ---

  ### Marking Scheme (20 marks total)  
  **Must-hit points (4 marks each). Award 0–4 per point based on specificity/depth. Deduct 4 marks for the specific mistake below; deduct 2–3 for partial errors.**  

  1. **Decision-under-uncertainty framing:** Correctly defines *p* as credence in class-level sentience and EDV = *p* × *N* × *d*, explaining how uncertainty drives normative weight.  
     *→ Mistake costing 4 marks: Vaguely describes "risk" without formal EDV or misdefines *p* (e.g., as per-insect probability).*  

  2. **Independence objection rebuttal:** Uses expected value to show EDV remains valid under class-level uncertainty, contrasting aggregation vs. expectation.  
     *→ Mistake costing 4 marks: Claims the objection is valid or appeals to per-insect probabilities without resolving the class-property issue.*  

  3. **Welfare-range insensitivity:** Demonstrates mathematically that EDV stays large even for tiny *d* (e.g., shows calculation with *d* ≤ 10⁻⁹ and compares to human/vertebrate benchmarks).  
     *→ Mistake costing 4 marks: Asserts "small *d* weakens the argument" without quantitative comparison.*  

  4. **"Proves too much" with concrete implication:** Identifies a plausible extension (e.g., AI, plants) and gives a specific individual/government action (e.g., "avoid AI use," "fund research for marginal cases").  
     *→ Mistake costing 4 marks: Only abstractly notes "it could apply elsewhere" without a named entity or actionable implication.*  

  5. **Avoids restatement/descriptiveness:** Entire response engages with *how uncertainty shapes decisions*, not insect neurobiology or raw numbers. Integrates parts into a cohesive analysis.  
     *→ Mistake costing 4 marks: Merely recites scale argument premises or focuses on empirical debates (e.g., "insects might feel pain").*  

  **Balance:** Allocate ~15 minutes per part. Model answer targets A:200/B:200/C:270 words.  
  **Rationale:** This structure forces reconstruction (A), critical response to a key oversight (B), quantitative rigor (C(i)), and real-world reasoning (C(ii)), avoiding "plug-and-play" answers. Stipulated numbers prevent census tangents.
