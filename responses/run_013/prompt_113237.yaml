  I would like you to restate the disagreement between the Nash and the Kalai–Smorodinsky solutions to the two-person bargaining problem in the vocabulary I actually think in — convex sets and their supporting hyperplanes, constrained extremization, variational principles, potentials and Legendre duality, symmetries and gauge freedom, reference states, tie-lines and the lever rule — and then to tell me, as precisely as the subject allows, what does not survive the translation. I am a retired experimental physicist: thirty-five years of statistical mechanics, phase equilibria and variational methods, so I am at home with convex analysis, Lagrange multipliers and duality, but I have no economics whatever and have read only a chapter or two of a game theory textbook, having come to this by way of philosophical work on distributive justice. Take the following as the material to be translated rather than as claims to be audited: a bargaining problem is a closed convex set of feasible pairs of utilities together with a disagreement point inside it; a solution is a rule selecting one point of that set for every such problem; the Nash solution maximizes the product of the two players' gains over the disagreement point, and is the unique rule satisfying Pareto efficiency, symmetry, invariance under independent positive affine rescaling of either player's utility, and independence of irrelevant alternatives; the Kalai–Smorodinsky solution is the point at which the ray from the disagreement point to the utopia point — the pair of individually maximal feasible payoffs — meets the Pareto frontier, and it is characterized by Pareto efficiency, symmetry and affine invariance together with a monotonicity condition in place of independence of irrelevant alternatives, namely that if, for every utility level one player might demand, the greatest utility the other can simultaneously reach is weakly increased, then the other player's assigned utility must not fall. If I have any of that wrong, note it in passing and then work with the corrected version.

  What I want from the translation is the honest version of it rather than a suggestive analogy. I already suspect that affine invariance is not a symmetry of any system but a gauge condition — utilities carry no natural unit, so the axiom is really a demand that the rule not depend on the representation — and I want to know whether that reading is correct or whether it flattens something. I have also noticed that the Nash point maximizes a sum of logarithms of the gains, which is the functional form of the entropy of mixing of an ideal two-component system, and I should like to know whether that resemblance is decorative or whether there is a defensible sense in which the Nash point is a maximum-entropy point. And I am unsure whether Pareto efficiency has any counterpart at all in the physics of constrained extremization or is instead a disguised normative demand not to leave anything on the table.

  Then the residue report, which is the part I care about. Which claims pass through without loss; which pass only if I smuggle in something foreign to my vocabulary; which cannot be expressed in it at all. My own guess — confirm or refute it — is that what fails to survive is the very notion of a solution as the outcome rational parties would agree to: a normative prediction, whereas in my vocabulary the state of a system is whatever its dynamics make it, and an extremal principle is normally equivalent to equations of motion rather than a standard of fairness. If that is right, tell me what follows. Is the axiomatic bargaining literature, seen from where I stand, a search for an extremal principle with no dynamics behind it? Does it matter that the Nash solution also arises as the limit of an explicit non-cooperative bargaining process — alternating offers, players growing patient — while the Kalai–Smorodinsky solution, so far as I know, is characterized only axiomatically: is that asymmetry a fact about the two solutions or merely a fact about which models happen to have been worked out? And is the residue a defect of my vocabulary, or evidence that the disagreement between the two solutions is less deep than the axiomatic literature makes it look — two reasonable conventions with no fact of the matter between them?

  Lead with your bottom line in the first sentence and then give the reasoning; no preamble, no restatement of my question.
