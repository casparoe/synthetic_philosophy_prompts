  Okay, the user is in a graduate seminar focusing on pragmatic encroachment and epistemic contextualism. They've developed their own argument that starts from trying to justify stakes-sensitivity in knowledge attributions but ends up in a problematic conclusion they're uncomfortable with. They're caught between being pleased with their insight or worried they've made a mistake. Their argument leads to the idea that knowledge attributions aren't factual claims at all, which undermines their own use of 'knows' for explanation and prediction. 

  The user's friend, who works on contextualism, points to premise (1) as the issue, suggesting abandoning the functional approach to knowledge talk. But the user finds (1) compelling—it captures how knowledge attributions license reliance in practical contexts. They want to save both (1) and (6), where (6) insists knowledge must have factual content because it explains behavioral differences (e.g., an inspector who knows vs. hopes a crack is stable). 

  The core tension is between the functional role of knowledge attributions (licensing reliance relative to stakes) and their semantic status as truth-apt claims. The user needs to identify where the argument fails. Let me break down their premises:

  (1) Knowledge attributions serve to license reliance. This seems solid to them—it's not just descriptive but has a practical point.

  (2) What counts as settled depends on stakes. High stakes require more evidence for reliance. This aligns with pragmatic encroachment.

  (3) Therefore, knowledge attributions are only correct relative to stakes. This follows from (1) and (2).

  (4) But truth isn't relative. So if correctness is relative, knowledge attributions aren't stating facts—they're non-factive speech acts like recommending.

  (5) Thus, 'knows' isn't factual—it's a tool for managing reliance, with no facts about who knows what.

  (6) The user rejects (5) because knowledge attributions explain behavior (e.g., inspectors' actions), and (5) self-undermines since it presents itself as a fact about knowledge.

  The user's dilemma: They want to preserve the practicality of knowledge attributions ((1)) and their factual role in explanation ((6)), but the argument forces a choice. Their friend's suggestion to drop (1) sacrifices the functional insight they value. 

  Possible weak points:
  - **Premise (4)**: It assumes relativity to stakes implies non-factivity. But contextualism treats 'knows' as context-sensitive—its truth conditions shift with stakes, so it *is* truth-apt, just relativized. The user might conflate relativity with non-factivity.  
  - **Premise (1)**: If knowledge attributions *describe* a state that *enables* reliance (rather than directly licensing it), (1) could be reframed. For example, "S knows p" means S has a state (e.g., sufficiently justified true belief) that *makes* reliance appropriate. Then correctness isn't directly relative to stakes—the state itself might be stakes-sensitive (pragmatic encroachment) or the attribution's truth conditions might shift (contextualism).  
  - **Step to (3)**: Even if knowledge attributions license reliance, their correctness might not *reduce* to that function. The inference from "function is licensing" to "correctness is stakes-relative" might oversimplify.  

  Repair strategies:  
  1. **Contextualist repair**: Keep (1) and (2) but reinterpret (3). When we say "S knows p," its truth depends on the contextually set stakes. So "correct relative to stakes" means *truth is context-relative*, not that the utterance lacks truth value. This salvages factivity (contra (4))—knowledge claims are factual *in a context*. (6) is satisfied because in a given context, "S knows p" explains behavior (e.g., in a high-stakes context, attributing knowledge explains reliance). Cost: Contextualism is controversial (e.g., "semantic blindness" objections).  
  2. **Pragmatic encroachment repair**: Keep (1)-(3) but reject (4)'s inference. Knowledge attributions *are* factual, but the facts are stakes-sensitive: whether S knows p depends partly on practical stakes. So "correct relative to stakes" because the *truth conditions* include stakes. (4) fails because relativity doesn't imply non-factivity—it just makes knowledge a practical state. (6) holds because knowledge still explains action (e.g., in high stakes, you need *more* to know). Cost: Encroachment is accused of conflating epistemic and practical norms.  
  3. **Hybrid/Functional Pluralism**: Distinguish the *content* of knowledge attributions from their *function*. Perhaps "S knows p" has stable truth conditions (e.g., justified true belief ± stakes), *and* its assertion functions to license reliance. Then (1) describes use, not meaning. (3) doesn't follow—correctness (truth) isn't stakes-relative; only the *appropriateness of asserting* it is. (6) is saved. Cost: Might feel like abandoning the core insight of (1).  

  User's likely needs:  
  - They want to retain the practicality of knowledge attributions ((1)) without collapsing into non-factivity ((6)).  
  - They seek a coherent position that's either recognizable contextualism or pragmatic encroachment.  
  - They need to pinpoint where their argument fails to avoid similar errors.  

  Recommendation:  
  Attack **premise (4)**. The inference "if correctness is relative, then no truth/fact" is too strong. Both contextualism and pragmatic encroachment show how knowledge attributions can be stakes-relative *and* factual. For contextualism, truth is context-relative; for encroachment, the knowledge relation itself is stakes-sensitive. Either way, (5) doesn't follow. This preserves (1)-(3) and (6).  

  Why (4) looked plausible: It's intuitive that "relative = not factual" (e.g., moral relativism debates). But in semantics, indexicals (like "I") are relative and factual. Stakes-relativity might be similar.  

  Cost of repair:  
  - If choosing contextualism, they pay with semantic flexibility (e.g., "knows" works like "tall").  
  - If choosing encroachment, they pay by making knowledge partly practical.  
  Both remain within standard debate frameworks.
answer: |-
  Your argument is a sharp and fascinating challenge that exposes a genuine tension in the stakes-sensitivity debate. It doesn't slip on a *mistake* per se; instead, it highlights a foundational choice-point between pragmatism and truth-aptness in epistemology. I'll break this down step by step, identifying the weakest link, explaining why it's tempting, and outlining the costs of rejecting it—while preserving (1) and (6). The core issue is your inference from functional role to semantic non-factivity.

  ### Where the argument slips: Premise (4) is the culprit
  **Premise (4)**: "But truth is not relative — a sentence is true or false, period — so an utterance whose correctness is relative to something is not stating a fact, it is doing something else: licensing, recommending, warning."

  This is where your argument overreaches. You assume that relativity to stakes *must* imply non-factivity—that if correctness is context-relative, the utterance cannot be truth-apt. But this isn't necessarily true. Both contextualism and pragmatic encroachment offer ways to reconcile stakes-relativity with factual claims, and rejecting (4) lets you keep (1), (2), (3), and (6) while avoiding (5). Here's why:

  - **Why (4) is plausible**: It echoes a common intuition: if truth is "absolute," relativity must push us into non-cognitive territory (e.g., expressivism in ethics). It also seems to follow from (3): if knowledge attributions are only correct relative to stakes, how can they be "true" in a robust sense?
    
  - **Why it fails**: Relativity doesn't entail non-factivity. Many factual claims are context-sensitive without losing their truth-aptness. For example:
    - **Contextualism**: "Knows" is an indexical, like "I" or "here." The sentence "S knows that p" has variable truth conditions across contexts (shifting with stakes, salience, etc.), but in *any given context*, it's straightforwardly true or false. Your premise (3) is correct—knowledge attributions *are* stakes-relative—but this relativity is built into the *semantics*, not a sign that no fact is stated. When you say "S knows p" in a low-stakes context, you're asserting a fact about S's epistemic position *relative to that context*. This preserves (6): in a high-stakes context, denying "S knows p" explains why the inspector shouldn't rely on the crack being stable (it's false *in that context* that they know).
    - **Pragmatic encroachment**: Knowledge itself is stakes-sensitive. "S knows that p" is a factual claim, but its truth depends partly on practical factors (e.g., stakes affect how much justification is required). Relativity here is metaphysical: whether S is in the knowledge *state* depends on non-epistemic factors. Again, this is compatible with factivity—it just means the knowledge relation isn't "pure."

  ### What you pay to reject (4)
  Rejecting (4) rescues your argument from collapse into non-factivity (5) and keeps (1) and (6) intact. But the cost depends on whether you lean contextualist or encroachment-oriented. Crucially, **both options leave you within the pragmatic encroachment/contextualism debate**—neither forces you into expressivism or eliminativism.

  1. **Contextualist repair (closer to your friend's semantics-first view, but keeping (1)):**
     - **Position**: Accept (1)–(3), but reinterpret "correctness" as *context-relative truth*. The function of knowledge attributions (licensing reliance) explains *why* "knows" is context-sensitive: its semantic content adapts to practical needs. For example, "knowledge" in a high-stakes context denotes a state requiring stronger justification, making attributions false where they'd be true in low stakes.  
     - **Costs**: 
       - You must defend contextualism against its standard challenges (e.g., the "semantic blindness" objection: why do ordinary speakers insist "I knew it all along" when stakes change?). 
       - (1) becomes a *pragmatic explanation* for semantic variation, not a direct constraint on truth conditions. This might feel like softening (1), but it doesn't abandon it—contextualists like DeRose or Cohen often appeal to functional roles to motivate contextualism.
       - **Result**: Recognizable epistemic contextualism.

  2. **Pragmatic encroachment repair (closer to your initial rationale-driven aim):**
     - **Position**: Accept (1)–(3) and treat "correctness" as *stakes-sensitive factivity*. Knowledge attributions are factual, but whether S knows p depends on objective stakes (e.g., the actual cost of error). Your premise (2) explains *why* knowledge is stakes-sensitive: the state of knowing just *is* what licenses reliance, so its standards vary with practical risks.  
     - **Costs**: 
       - You face the "confounding factors" objection: if knowledge is partly practical, it may lose its explanatory power in epistemology (e.g., why we cite evidence, not stakes, in justifying beliefs). 
       - Encroachment struggles with disagreement cases (e.g., if two people face different stakes, can they both be right about whether S knows p?).
       - **Result**: Recognizable pragmatic encroachment (à la Fantl & McGrath or Stanley).

  ### Why keep (1) and (6)? A unified solution
  Both repairs let you retain your core insights:
  - **(1) is secure**: The functional role of knowledge attributions (licensing reliance) explains *why* semantics or metaphysics is stakes-sensitive—it's not just an add-on. For contextualism, it motivates semantic flexibility; for encroachment, it grounds the link between knowledge and action.
  - **(6) is satisfied**: Knowledge remains factual and explanatory. In high-stakes contexts, "The inspector doesn't know the crack is stable" is true (contextualism) or reflects a stakes-sensitive fact (encroachment), explaining their cautious behavior. The "self-undermining" worry dissolves: claims about knowledge attributions (e.g., "knows is context-sensitive") are themselves context-relative or encroachment-friendly facts.

  ### Where you might still worry
  Even repaired, your argument pushes contextualism/encroachment toward their radical edges. If knowledge is *fundamentally* tied to reliance-management (per (1)), it risks reducing epistemology to pragmatics. But this is a feature, not a bug—it's why your argument resonates. Pragmatic encroachment and contextualism *already* blur the fact/practice line; you've just shown that embracing (1) fully leads there faster. If that's uncomfortable, it might reflect a deeper unease with the entire stakes-sensitivity programme, not your logic.

  ### Final recommendation
  Target **premise (4)**. Its assumption that relativity implies non-factivity is too strong. Replace it with:  
  *"Truth can be context-relative or metaphysically sensitive to practical factors without losing its factive status. A stakes-relative knowledge attribution can still state a fact—one indexed to context or dependent on objective stakes."*  

  This keeps your rationale for stakes-sensitivity (1–3) and your realist commitment (6), steering you toward either contextualism or pragmatic encroachment. If you prefer grounding knowledge in practical rationality, choose encroachment; if you prefer semantic flexibility, choose contextualism. Either way, your argument isn’t a mess—it’s a valuable provocation that forces these views to confront their pragmatic foundations.
