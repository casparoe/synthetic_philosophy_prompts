  Here's a paragraph hitting those notes, focusing on geometry's function for Hobbes:

  > Thomas Hobbes was utterly convinced that Euclid’s geometry offered more than just a way to measure triangles; it was a blueprint for absolute, unchallengeable truth. Having built his political philosophy, *Leviathan*, on the dream of geometric certainty – where subjects obeyed like perfectly deduced theorems – he spent his twilight years trying to bend mathematics itself to his will. Determined to prove society *could* be permanently ordered with his kind of ironclad logic, he became obsessed with the ultimate authoritarian fantasy: forcing the unruly, infinite curve of a circle into the rigid, obedient corners of a square he could definitively measure and control. He died certain he'd succeeded, mistaking the neat lines on his page for a world finally squared away.

  **Why it works:**

  1.  **Beyond "Can't Do Sums":** Focuses on *why* he valued geometry (blueprint for truth, ironclad logic) and how he applied that mindset politically (obedient theorems, authoritarian fantasy).
  2.  **The Obsession:** Explicitly mentions circle-squaring as his final, failed project.
  3.  **The Link to Politics:** Connects "Leviathan's" desired certainty directly to his geometric quest ("bend mathematics to his will," "ultimate authoritarian fantasy").
  4.  **The Punchline:** The final line ("mistaking the neat lines... for a world finally squared away") ties it all together. It highlights his fundamental error: believing the perfect, controllable world of geometry could be imposed on messy reality, just as he believed circle-squaring was possible. "Squared away" has the double meaning of mathematically solved and neatly tidied/controlled.
  5.  **Accessibility:** Explains the core ideas (Hobbes sought absolute certainty, geometry was his model, he tried to square the circle, he linked this to politics) so a general reader gets it, while the specific phrasing ("obedient theorems," "authoritarian fantasy," "squaring away") resonates more deeply with those who know the context.
  6.  **Avoids Cliché:** It's about his *application* of geometry's perceived purpose, not his mathematical incompetence. The joke is on his philosophical hubris and misunderstanding of math's domain.
