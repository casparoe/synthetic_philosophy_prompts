prompt: |-
  My flatmate and I just spent three hours arguing about voting and got absolutley nowhere, and now I want to turn the arguement into a class activity. The fight was this: I said voting for the lesser evil is just what having a vote means, and he said no, that to vote for the lesser evil you have to actually *want* the lesser evil to win, and wanting that is already a small corruption of yourself, and if you vote for it while hoping it loses you're lying to the ballot box. He also kept saying that the strategic voter is acting as a proxy for people who never consented to be represented that way, which I think is him being dramatic but maybe not wrong. We couldn't settle it because we kept imagining different scenarios.

  Anyway — second-year ethics seminar, 18 students, 75 minutes. I want them to walk into the split themselves, no lecture up front, and I want the split to be three ways: voting as duty, voting as expression, voting as lesser-evil calculation. And I want the proxy/complicity thing and the "do you have to want it" thing to actually bite rather than be something I say at the end.

  Rough plan, rip it up as you like:

  Round 1 — they're the electorate. Three candidates with short policy profiles: one competent but callous, one openly dangerous, one genuinely decent but polling around 5%. Each student also gets a private stake card saying something personal that hangs on the outcome (a job, a visa, a sibling's healthcare) so the tradeoff isn't bloodless. Everyone fills in a secret true-preference card: rank the three, one sentence why.

  Round 2 — secret plurality vote, I tally it. Then I reveal national polling: dead heat between callous and dangerous, decent one can't win. Vote again. Anyone who switches off their stated true preference has to stand up, justify it in one sentence, and take questions from the room.

  Round 3, the bit I'm unsure about — I want "your vote was never going to be decisive" to land without it becoming a probability lecture. My idea: after the second vote I open a sealed envelope naming which single ballot was the pivotal one, and ask that person whether they still defend their vote. Might be too cute.

  What I need: a runnable version — rules, materials, the stake cards, a 75-minute timeline, and how to stage the second vote so it actually bites. A debrief mapping what happened onto the three positions and onto the proxy/complicity objection and the "you have to want it" objection. Tell me what will predictably go wrong the first time — I've run forced-choice stuff before and there's always one student who refuses to play, and I'd like to use that rather than fight it. And be straight with me about which part of the idea the game can't reproduce and I'll have to supply myself.
reasoning: |-
  Okay, the user wants to transform a heated debate with their flatmate about voting ethics into an engaging classroom activity. This is for a second-year ethics seminar with 18 students, 75 minutes long. The core disagreement revolves around whether voting for the lesser evil is a necessary strategic move or a form of moral compromise. 

  The user's proposed three-round structure is promising but needs refinement. The key challenges are making the "proxy representation" and "authentic desire" objections emerge organically, handling the decisiveness issue without math, and accommodating non-participatory students productively. 

  First, candidate design needs to be sharp: Callous (establishment technocrat with harmful policies), Dangerous (authoritarian populist), Decent (principled but unelectable). Each must present clear moral trade-offs. The personal stake cards are crucial—they'll prevent abstract theorizing and force visceral engagement. Examples: "Your scholarship requires maintaining immigration status—Callous will cut your program" creates real tension.

  For Round 2's vote switch, requiring public justification is brilliant but risky. Some students might clam up. Better to make standing optional but frame it as "earning participation points" to incentivize. The sealed envelope for pivotal vote is theatrically effective but statistically misleading. Instead, I'd use immediate peer pressure: "If your switched vote decided the outcome, could you face the class?"

  The unresolvable tension is that no simulation can replicate the weight of real elections. I'll flag this in debrief questions. Also, the "you must want it" objection may not surface—I'll prepare to seed it via Decent's profile ("I won't compromise my values to win").

  Predictable issues: One student refusing to vote becomes "conscientious abstainer"—perfect! Use them to debate whether non-participation is cowardice or integrity. Another may game the system by voting Dangerously to "prove a point"—that's actually gold for discussing protest votes.

  Debrief should map positions to the triad: Duty (voting as harm reduction), Expression (voting as identity), Calculation (voting as game theory). The proxy argument emerges when strategic voters override Decent supporters' voices. 

  Timeline is tight: 5-min setup, 10-min Round 1, 15-min Round 2 with justifications, 10-min Round 3 pivot, 25-min debrief. Sacrifice some discussion time for the pivotal vote moment—it's worth the emotional impact.

  Materials: Need laminated candidate sheets, stake cards with varied dilemmas (visa, healthcare, student debt), and a visible vote tracker. Skip tech—manual tally keeps tension high.

  The user's instinct to avoid lecturing is correct. This works best as an embodied dilemma where students confront their own compromises. I'll emphasize reflection questions that make them articulate their discomfort back to the theoretical frameworks.
answer: |-
  Here's a battle-tested, 75-minute seminar plan designed to split the class, surface your core arguments, and make the "proxy" and "wanting it" objections bite *hard* – all while embracing the refuser.

  **Core Goal:** Force students to confront the tension between expressive integrity, consequentialist duty, and strategic calculation in voting, making the "proxy" and "authentic desire" objections tangible.

  **Key Materials:**
  1.  **Candidate Profiles (Laminated/Projected):**
      *   **Callous (C):** "Proven Manager. Prioritizes economic growth & stability. Cuts social programs, tightens immigration, strong on crime (supports mandatory minimums). Polling: ~45%."
      *   **Dangerous (D):** "Strong Leader for Troubled Times." Openly authoritarian rhetoric, targets minorities, undermines institutional checks, vague economic promises. Polling: ~45%."
      *   **Decent (DE):** "Ethical & Compassionate Reform." Progressive social policies, strong environmental action, campaign finance reform, anti-corruption. Polling: ~10% (Cannot win)."
  2.  **Stake Cards (18 unique, folded/private):** *Make these specific, consequential, and conflicting with different candidates.*
      *   *Examples:* "Your scholarship requires maintaining immigration status. C pledges to cut your program." / "Your sibling relies on Medicaid for chronic illness. D plans drastic cuts." / "You work part-time at an environmental NGO. DE's policies are crucial for its funding." / "Your parents own a small factory vulnerable to DE's proposed regulations." / "Your neighborhood has rising crime. C's tough approach resonates." / "You belong to a minority group explicitly targeted by D's rhetoric." / "You deeply believe DE's anti-corruption stance is fundamental."
  3.  **True Preference Cards (Small slips):** "Rank C, D, DE (1=Best, 3=Worst). Briefly explain WHY (1 sentence): ___________"
  4.  **Voting Slips (Round 2 & 3):** Simple slips for "C", "D", or "DE".
  5.  **"Pivotal Ballot" Envelope:** Pre-write a random student number (1-18) on a slip inside. Have a backup plan if that student abstains.
  6.  **Whiteboard/Flipchart:** For tallying votes.

  **Timeline & Flow (75 Mins):**

  1.  **Set-Up & Framing (5 mins):**
      *   "We're simulating an election. Here are the 3 candidates (briefly read profiles). Each of you has a unique personal stake dependent on the outcome." Distribute Stake Cards privately. "Read yours carefully. Keep it private for now."
      *   **No theory intro!** Jump straight in.

  2.  **Round 1: True Preference & Why (10 mins):**
      *   "Ignoring polls and strategy, based *only* on your values AND your personal stake, rank the candidates (1=Best, 3=Worst) and write one sentence explaining your top choice on the True Preference Card." Collect cards. *Don't reveal results yet.*
      *   *(This establishes baseline expressive preference grounded in personal consequence.)*

  3.  **Round 2: Initial Secret Vote (5 mins):**
      *   "Now, cast a secret Plurality vote: Vote for ONE candidate you want to win *right now*." Collect & Tally publicly (Whiteboard: C: X, D: Y, DE: Z). Discuss *briefly*: "What does this initial snapshot tell us?"

  4.  **The Hammer: Polling Reveal & Strategic Dilemma (5 mins):**
      *   Reveal Polling: "National Polls: C: 45%, D: 45%, DE: 10%. DE *cannot win*. It's a dead heat between C and D. The outcome *will* be C or D."
      *   **Crucial Question:** "Given this reality, and your personal stake, how will you vote *now*? Does the fact DE can't win change your calculus? Vote again, secretly, for ONE candidate."

  5.  **Round 2b: Vote, Confession, & Crossfire (20 mins):**
      *   Collect Round 2 Votes. *Hold tallying.*
      *   **The Reveal & Pressure:** "If you switched your vote AWAY from your #1 True Preference (from Round 1 card) in this strategic vote, please stand up." (If no one stands, probe: "Did *anyone* feel a conflict? Did anyone consider switching but didn't? Why?")
      *   **For each who stands (or volunteers conflict):**
          *   "State who you *truly preferred* (from card) and who you *voted for* strategically."
          *   **"Why did you switch? Justify your strategic vote in ONE sentence."** (Force concision - "To stop D", "C protects my job", etc.)
          *   **Open the Floor (Max 1-2 questions per switcher):** Focus questions on the tension:
              *   *To Switcher:* "Do you *want* [Strategic Choice] to win, or just *not want* [Worse Evil]? Is there a difference?"
              *   *To Switcher:* "Are you comfortable representing people who *do* passionately support [Decent] by voting against them?"
              *   *To Class:* "Did [Switcher] betray their principles? Did they do the right thing? Why?"
      *   **Tally Round 2 Vote.** Contrast with Round 1. Note shifts away from DE.

  6.  **Round 3: The Pivotal Vote & Indecisiveness (15 mins):**
      *   "We know statistically, *your individual vote* almost certainly didn't change the outcome. But what if it did?" Open the "Pivotal Ballot" envelope. "Student [X], your vote was the decisive one in this simulation."
      *   **Grill Student X:**
          *   "Who did you vote for in Round 2 (the strategic vote)?"
          *   "Looking at the outcome your vote decided, do you stand by your choice? Why?"
          *   "Knowing you were decisive, does it feel different? Does it change how you view your justification?"
          *   *Key Follow-Up (Regardless of their vote):* "If you *knew* you were decisive beforehand, would you have voted differently? Why?"
      *   **Ask the Class:** "Does knowing someone's vote *was* decisive change how we judge their reasoning? Does it make consequentialism more compelling? Or does it heighten the burden?"

  7.  **Debrief & Mapping (15 mins):** *(Guide, don't lecture. Synthesize THEIR points.)*
      *   **Surface the Three Positions:**
          *   "Who here felt they were primarily **fulfilling a duty** (to stop the worst, protect society/self)?"
          *   "Who felt voting was primarily **self-expression**, regardless of outcome?"
          *   "Who was doing cold **strategic calculation** (lesser evilism)? Were there hybrids?"
      *   **Make the Objections Bite:**
          *   *"You have to want it":* "To the strategic voters: Did you genuinely *want* your strategic choice to win? Or just *not want* the alternative? Does that distinction matter ethically? (Link to student justifications). Can you vote *for* something you don't actively want? Is that 'corruption' or realism?"
          *   *Proxy/Complicity:* "When strategic voters abandon [Decent], are they silencing/violating the will of the [Decent] supporters? Did [Decent] supporters *consent* to having their preferred candidate's chances sacrificed for strategic reasons? Are strategic voters taking responsibility *for* others without their mandate? (Link to 'representing people who never consented')".
          *   *The Refuser (If present):* "For anyone who abstained or refused to play strategically: What was your reasoning? Was it expressive integrity? Rejecting the system? Feeling the choices were unacceptable? How does this fit into the framework?" *This is GOLD – use it to explore expressive/conscientious objection.*
      *   **The Unresolvable Tension:** Acknowledge: "This simulation can't replicate the weight of real elections, the complexity of long-term consequences, or the feeling of civic duty. It simplifies probability. But it *does* force us to confront the core conflict: Is voting about being true to yourself, minimizing harm, or playing a strategic game? And do the 'proxy' and 'authentic desire' critiques fundamentally undermine strategic voting?"

  **What Will Go Wrong (and How to Use It):**

  1.  **The Refuser:** Perfect! As above. "Student Y refused to vote strategically/refused to switch. Let's hear why." This embodies the expressive/purist position powerfully. Don't force participation; leverage their stance.
  2.  **"Why Bother Voting?" Cynicism:** If someone argues voting is pointless, ask: "Does that mean consequentialist duty *and* expressive voting are both futile? Or just strategic voting?" Links to the decisiveness issue. "Is abstention a valid form of expression or complicity through inaction?"
  3.  **Overly Strategic Gaming:** Someone might vote for D "to prove a point" or "make C win easier." Use it! "Was this a legitimate strategy? Does it respect the stakes? Or is it gaming the system cynically?" Highlights potential pitfalls of pure calculation.
  4.  **Dominant Personality:** Use tight time limits ("one sentence!") and direct specific questions ("Student Z, what do you think of Student A's switch?"). Redirect monologues: "That's an important point about duty. Who else felt that way?"
  5.  **Lack of Switchers:** If no one switches off DE in Round 2, probe deeply: "Did everyone *seriously* stick with DE knowing they couldn't win? What about your personal stakes? Did anyone feel torn but resisted? Why?" This surfaces the expressive/purist strength and the perceived cost of compromise. Ask DE voters the "proxy" question directly.
  6.  **Emotional Reactions:** Stakes might trigger real emotion (especially if minority targeting feels real). Acknowledge it: "This touches real anxieties. That intensity is part of why voting ethics matter so much. How does that emotion shape the calculus between expression, duty, and strategy?"

  **What the Game Can't Do (Supply Yourself in Debrief):**

  1.  **Long-Term Consequences:** The sim focuses on immediate stakes. Real lesser-evil voting can entrench bad systems. Mention briefly: "Critics argue lesser-evilism lowers the bar long-term. Was that a factor?"
  2.  **Probability Nuance:** The "pivotal vote" is a dramatic device, not a statistical lesson. Acknowledge its artificiality but stress: "While the *chance* is tiny, the *potential impact* if you *are* decisive is massive. Does that asymmetry justify strategic voting?"
  3.  **Broader Systems (FPTP vs PR):** Frame it simply: "Our system forces these choices more than proportional representation might. Does the system design influence the ethical calculus?" (Don't dive deep unless it emerges).
  4.  **The "Corruption" Depth:** The sim shows the *act* of strategic voting. You need to explicitly connect it to the *internal state* ("wanting it") in debrief using their justifications. Ask: "Does repeatedly voting strategically change *what you want* over time?"

  **Why This Works:**

  *   **Immersive:** Stakes make it personal, not abstract.
  *   **Forces Choice:** Polling reveal creates genuine strategic tension.
  *   **Public Pressure:** Standing up makes justification real and vulnerable.
  *   **Dramatic Pivot:** The "decisive vote" makes consequences visceral.
  *   **Leverages Conflict:** The refuser, the cynic, the gamer become case studies.
  *   **Structured Debrief:** Explicitly maps activity to the core concepts and objections.

  This will generate heat, light, and hopefully, a deeper understanding of why you and your flatmate argued for three hours – and why it matters. Good luck!
