  ### Special Composition Question Decision Tree  
  *Start with Q1; follow answers to named positions or new questions. Use cases: touching bricks (A), living cat (B), pile of sand (C), scattered shoe-half + tower (D), swarm of bees (E), corpse (F), statue + clay (G).*

  #### **Q1: Do two or more objects ever compose a further thing?**  
  - **No** → **Nihilism** (Nothing composes anything; only simples exist. *Cases A–G lack composite wholes.*)  
  - **Yes** → Proceed to Q2.  

  #### **Q2: Is composition *unrestricted*? (Do *any* things, however arranged, compose a whole?)**  
  - **Yes** → **Universalism** (Always and everywhere, composition occurs. *A, B, C, D, E, F, G all compose wholes.*)  
  - **No** (Composition is restricted) → Proceed to Q3.  

  #### **Q3: Does the restriction vary by *kind of object*?**  
  - **Yes** → **Serial/Case-by-Case View** (Different rules for different kinds. *E.g., B composes (organism rule), C might not (artifact rule).*)  
  - **No** (One uniform condition) → Proceed to Q4.  

  #### **Q4: Can composition be *mind-dependent*? (Varies with concepts/practices?)**  
  - **Yes** → **Mind-Dependent/Deflationary View** (Composition reflects human interests. *C or G may compose or not based on context.*)  
  - **No** (Mind-independent fact) → Proceed to Q5.  

  #### **Q5: Is composition ever *vague* or a *matter of degree*?**  
  - **Yes** → Proceed to Q6.  
  - **No** (Always determinate) → Proceed to Q7.  

  #### **Q6: Is vagueness/degree due to *worldly indeterminacy* (not just ignorance)?**  
  - **Yes** → **Degree-Admitting View** (Unnamed: restricted, uniform, mind-independent, vague. *C may be a borderline whole.*)  
  - **No** → **Mind-Dependent/Deflationary View** (Vagueness stems from human concepts; redirect from Q4.)  

  #### **Q7: Is there a *non-brute* condition for when composition occurs?**  
  - **No** → **Brute/No-Answer View** (No deeper explanation; *A composes, D does not—just because.*)  
  - **Yes** → Proceed to Q8.  

  #### **Q8: Is the condition *intrinsic* (depends only on parts/relations among them)?**  
  - **Yes** (e.g., contact, bonding) → Proceed to Q9.  
  - **No** (e.g., causal roles, life) → Proceed to Q10.  

  #### **Q9: Does composition require *spatiotemporal contact*?**  
  - **Yes** → **Contact View** (Parts must touch/be connected. *A, B, C, F compose; D, E do not.*)  
  - **No** → **Q9a: Does it require *fastening/cohesion* (resisting separation)?**  
    - **Yes** → **Fastening/Cohesion View** (Bonded parts compose. *A composes if glued; C does not.*)  
    - **No** → Unnamed intrinsic view (e.g., requires fusion). *Coherent but rare; no major defender.*  

  #### **Q10: Does composition require constituting a *life/organism*?**  
  - **Yes** → **Organicism** (Only living things compose wholes. *B composes; A, C, D, E, F, G do not.*)  
  - **No** → **Q10a: Does it require *causal unity* (joint causal role/process)?**  
    - **Yes** → **Causal-Unity View** (Parts unified by causation. *B, E compose; A, C, D, F may not.*)  
    - **No** → Unnamed extrinsic view (e.g., functional role). *Coherent but rare; no major defender.*  

  ---

  ### **Diagnosis of Empty Regions**  
  - **Unnamed intrinsic (Q9a "No")**: Coherent but unattractive (hard to specify beyond contact/fastening).  
  - **Unnamed extrinsic (Q10a "No")**: Coherent but unpopular (few propose extrinsic conditions beyond life/causation).  
  - **Degree-Admitting + Brute/Conditional (not reached)**: Incoherent—vagueness implies non-brutality.  
  - **Serial + Mind-Dependent (not paired)**: Coherent but redundant; serialism usually presumes mind-independence.  

  ### **Notes**  
  - **Cases resolved**: The tree distinguishes positions using A–G. *Statue/clay (G)* is handled by extrinsic/intrinsic conditions (e.g., organicism denies composition for G; contact view affirms it).  
  - **Borderline cases**: *Pile of sand (C)* often tests vagueness (Q5); *swarm of bees (E)* tests causal unity (Q10a).  
  - **Unnamed leaves**: Result from under-defended but logically possible combinations (e.g., fusion as intrinsic; teleology as extrinsic).  
  - **Efficiency**: Omits branches for positions that only diverge on cases beyond A–G (e.g., contact vs. fastening on loosely associated particles).  

  *—Tree ends—*
