prompt: |-
  I am a novelist at work on a book about a citizens' assembly: a few dozen people chosen by lot, given briefing materials vetted for balance by a body appointed by whoever commissioned the exercise, seated in small groups with trained facilitators, asked to set aside their prior positions and to remain open to changing their minds, and finally asked to publish a recommendation on some contested question, usually with the vote breakdown attached. In the book's fictional country the recommendation binds no one; the government that commissioned the assembly may ignore it, and sometimes does. What puzzles me is that everyone in the story treats the assembly's report as a weightier expression of public judgment than a referendum with many times the turnout, and that nobody involved claims the members are wiser or better informed than anyone else, only that the conditions under which they decided were better. I want a character of mine to be able to articulate what the practice is committed to, and another character to attack it. Please answer as exactly five numbered points, each one or two sentences, with no introduction and no closing paragraph: what theory of political authority the practice presupposes; what it presupposes about the nature of people's opinions; which features of the design the presupposed theory strictly requires and which merely suit it; which rival accounts of legitimacy it quietly rules out; and what would have to be redesigned, in the selection, the facilitation, the advisory status, or the publicity of the vote, if we replaced the presupposed theory with straightforward preference aggregation.
reasoning: |-
  Okay, let me tackle this novelist's complex request about citizens' assemblies. The user presents a fascinating fictional scenario where such assemblies hold disproportionate moral authority despite lacking legal power, and wants contrasting character perspectives on their theoretical foundations.

  Hmm, the core tension here seems to be between deliberative democracy and majoritarian models. The user's setup hints at deep philosophical questions: why would a small group's conclusions outweigh mass referendums? What makes "better conditions" for decision-making more valuable than raw participation numbers?

  Breaking it down, I need to address five precise aspects without intros/conclusions. First, the political authority theory - clearly deliberative democracy, where legitimacy stems from process quality rather than sheer participation. Second, the opinion theory - this assumes preferences are malleable through reasoned discussion rather than fixed.

  For design features, strict requirements would include facilitation and balanced briefings to enable deliberation, while random selection is optimal but theoretically replaceable. The quiet exclusions are interesting - it inherently dismisses populism and technocracy by valuing neither raw numbers nor expertise alone.

  Finally, if shifting to preference aggregation, we'd strip away facilitators, allow advocacy materials, make voting secret, and prioritize representativeness over deliberation in member selection. This creates a clean contrast for the novelist's debating characters.

  The user's unspoken need might be for philosophical rigor beneath fictional debates. By crystallizing these tensions into numbered points, I'm giving them ethical scaffolding for character arguments while respecting their no-intro constraint. The specificity about redesign shows how theoretical shifts would materially alter the assembly's structure - perfect for dramatization.
answer: |-
  Here are the five numbered points as requested:

  1.  The practice presupposes a **deliberative theory of political authority**, where legitimacy arises not merely from counting preferences but from the reasoned, informed, and reflective process through which a collective judgment is formed under fair conditions.

  2.  It presupposes that **people's opinions are not fixed or purely self-interested preferences**; they are open to transformation through exposure to diverse perspectives, balanced information, and structured, respectful dialogue aimed at the common good.

  3.  Strictly required features are the **balanced briefing materials, trained facilitators to ensure fair dialogue, and the mandate for open-minded deliberation**. Random selection is highly suited but theoretically replaceable with other methods ensuring diversity; the non-binding status suits but doesn't strictly require the theory.

  4.  It quietly rules out **pure majoritarian/aggregative accounts of legitimacy (where only the vote count matters) and pure epistocratic/technocratic accounts (where legitimacy stems solely from expertise)**, as it values the *process* of non-expert citizens reasoning together above both raw numbers and specialized knowledge.

  5.  If replacing the presupposed theory with straightforward preference aggregation, redesign would require: **selection prioritizing statistical representativeness over deliberation potential, facilitators replaced by neutral administrators preventing coercion but not guiding discussion, briefing materials allowing advocacy, secret ballots, and likely downplaying the reasoning behind votes in the report**.
