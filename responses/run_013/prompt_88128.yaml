prompt: |-
  I'm a student rep on my uni's academic-integrity board, and I'm taking a normative ethics module this term, which is definately why I keep dragging philosophy into everything. There's a case up for a vote on Thursday and I have to write the memo that frames it, so I need your help drafting it.

  The case, short version: there's a cheating ring in a big intro course — probably 30-40 students swapping solutions to problem sets and two midterms. We can only actually nail one of them, Priya, because she's the only one whose answers are uniquely traceable. Her advisor floated a deal: we drop her case and she keeps her grade, and in exchange she hands over the whole group chat and names everyone. If we don't take it, the ring keeps running and the cheating continues at least another term. We vote Thursday.

  Here's the part I can't stop chewing on, and I think it's the actual issue. Our board runs on a rule we all take seriously: you don't let someone who cheated get away with it — not because of the downstream harm, but because we owe it to the students who actually did the work not to wave it through, even in a case where waving it through would catch alot more cheaters. But that seems to put us in a strange spot: we're apparently not allowed to break the no-exceptions rule in order to prevent a whole bunch more violations of that very same rule. That can't be right, right? Or maybe it is and I'm missing why. Half the board just says "consequences, take the deal," the other half says "make one exception and the whole thing is a sham," and neither ever tells me why.

  So: you're a professional philosopher who works on normative ethics and moral dilemmas (or institutional ethics, whichever fits better) — draft the memo I'll circulate before the vote. I need (a) an actual recommendation — take the deal, refuse, or take it with conditions — with a concrete decision procedure the board can apply, and (b) the reasoning spelled out so a smart colleague who disagrees could really engage with it. Please don't dodge the hard part: I want a genuine answer to whether it can ever be right to break a rule in order to stop more breakings of that same rule, and I want the strongest version of the losing side treated honestly rather than knocked down as a strawman.

  Before you write, brainstorm out loud a bit: lay out the two or three live options and the best argument for each, then commit. And think carefully about the crux — whether the value of the rule lives in the act itself (what we do, and to whom) or in the state of the world it produces — because I think that's where the whole thing turns. A couple of warnings: don't just tell me what some famous philosopher said, I need the argument itself, and no citations, reading lists or bibliographies, my professor will kill me if I hand in anything with a bibliography.

  Last thing: a friend says "rules are just heuristics, obviously break them when it helps," which feels too quick to me — so either say why it's too quick, or own up that it isn't.
reasoning: |-
  Okay, the user is a student representative on their university's academic integrity board. They're dealing with a tricky case involving a cheating ring. They can only prove one student, Priya, cheated, and her advisor has offered a deal: drop her case in exchange for her naming everyone else in the group chat. The board is split. Half want to take the deal to catch more cheaters, while the other half insists on never making exceptions to their rule against letting cheaters go unpunished. 

  The user is taking a normative ethics module, so they're deeply interested in the philosophical underpinnings here. They want the memo to address whether it's ever right to break a rule to prevent more violations of that same rule. They also want both sides of the argument presented fairly, not as strawmen. 

  First, I need to outline the core dilemma. The board's rule is absolute: no letting cheaters off the hook, primarily because it's a matter of justice to the students who did honest work. But rejecting the deal might mean the cheating ring continues, leading to more violations. So the tension is between sticking to the rule (deontology) versus preventing future harm (consequentialism). 

  The user mentioned the crux is whether the value of the rule lies in the act itself or the outcomes. That's key. For the deontological side, punishing Priya is a duty owed to honest students; making an exception undermines the integrity of the entire system. If they let Priya go, it signals that cheating can be negotiable, which might erode trust. Plus, there's a slippery slope—once they make one exception, it could become easier to justify others. 

  On the consequentialist side, the deal could stop the entire cheating ring, preventing far more dishonesty. The harm of Priya going unpunished is outweighed by catching 30-40 others. There's also deterrence: if the ring is exposed, it might discourage future cheating. Plus, the rule isn't a sacred text; it's a tool to maintain integrity. If bending it once leads to a better outcome, why not? 

  But the user's friend says rules are just heuristics—break them when helpful. That feels too simplistic because rules also embody values. If you break a rule for convenience, you risk normalizing exceptions and weakening institutional trust. The board's rule exists to uphold fairness, not just efficiency. 

  Then there's a third option: take the deal but with conditions. For example, require Priya to admit guilt, face reduced sanctions, or contribute to prevention efforts. This tries to balance both values—upholding the rule by ensuring she isn't fully absolved while still leveraging her cooperation for the greater good. 

  I think the strongest path forward is conditional acceptance. Fully rejecting the deal might uphold the rule but at too high a cost (ongoing cheating). Fully accepting it might set a bad precedent. Conditions could acknowledge Priya's wrongdoing while using her information to achieve a net positive. The memo should present all options but recommend conditional acceptance, stressing that the rule's spirit (academic integrity) is better served by stopping the ring, provided Priya still faces consequences. 

  The user needs concrete reasoning. They want colleagues to engage, so the memo must articulate the deontological concerns seriously while showing how the conditional approach respects both principles and outcomes. It should also address the "rules as heuristics" point: rules are more than that—they're commitments to values, but sometimes, context demands flexibility to serve those same values better.
