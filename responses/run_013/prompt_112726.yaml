prompt: |-
  I teach a 90-minute upper-level seminar on Rousseau's social and aesthetic thought, with 18 students, and I want a classroom activity that makes them feel the force of his case against bringing a theater to Geneva rather than recite it. The trap I want to avoid is the summary they can all produce before the session begins — theater corrupts, festivals are wholesome. What I want them to hit is the structural claim underneath, which is harder to state and much harder to feel: that a theater does not merely entertain badly but arranges people so that each of them is alone with a feeling that costs nothing and is owed to no one; that the actor's trade consists in manufacturing and discarding feeling on demand, so that the audience's access to what the actor actually feels is severed as a condition of the performance; and that Rousseau's alternative is not a better entertainment but a different arrangement of persons, one in which nobody is permanently a spectator and everyone is exposed to everyone else's view.

  Design the activity so the group runs two short "public evenings" back to back — a theatrical one and a festival one — staged in the form of the thing itself rather than debated, so that the difference lands in their bodies before anyone names it. Give me rules, materials, timings, physical setup, roles, and a debrief that maps specific moments of the two rounds onto the three claims above. Be frank in the debrief about what the activity cannot reproduce and that I must therefore supply in words: Rousseau's argument about scale — why the theater belongs to a large state and the festival to a small one — is nearly impossible to stage with eighteen people in one room, so tell me how to hand it over verbally and what it will consequently fail to feel like.

  Two further constraints, which are why I'm asking rather than improvising this myself.

  First, the theatrical round must include a paid performer. One student receives a small sum of tokens to produce a specified emotion on cue for the whole round; partway through, I privately halve their pay without telling the audience, and they must keep the performance indistinguishable. Afterwards the audience is asked whether they can tell what the performer actually felt, and I want them to notice that the question has no answer available to them.

  Second, in the theatrical round the spectators must be unable to see one another's faces, and at the climax each is handed a sealed note and told to write down what they would give up to undo the staged wrong — before being told that nothing is owed and nothing can be done. In the festival round, by contrast, nobody may watch for more than thirty seconds without having just been watched, and nobody may opt out. Tell me how to manage the transition between rounds so it doesn't read as an obvious "and now the good one."

  Finally, tell me what will predictably go wrong the first time I run this — where students will break frame, which round will collapse, and how to handle the moment when someone insists the theatrical round was simply more fun.

  Keep the entire deliverable under 1,100 words, and the debrief itself under 200 of them.
reasoning: |-
  Okay, let me tackle this professor's challenge. They teach Rousseau and want an activity that makes students feel the structural critique of theater versus festivals, beyond just reciting arguments. The key is to create embodied experiences that reveal three core ideas: emotional isolation in theater, manufactured emotions by actors, and participatory exposure in festivals.

  Hmm, the professor has very specific constraints: 
  - Must include a paid performer whose pay gets secretly halved
  - Theater spectators can't see each other and get sealed notes about imaginary sacrifices
  - Festival requires constant reciprocal watching with no opt-outs
  - Needs to avoid obvious "good vs bad" framing
  - Must anticipate where students might break character or prefer theater

  First, I consider the physical setup. For theater, I imagine chairs facing forward with barriers between seats and the performer on a raised area. For festival, circular seating on the floor would create equality. The transition needs to feel organic - maybe framing it as "two cultural experiments" rather than direct comparison.

  For the theater round: 
  - Paid performer ($10 gift card) displays specific emotions on cue
  - Halfway through, secretly reduce payment to $5
  - Spectators write "sacrifice" notes they can't act on
  - All lights dim except stage, preventing audience visibility

  Festival round:
  - Clear circle formation
  - Rotating pairs making eye contact
  - Group mirroring activity
  - No fixed roles - everyone participates equally

  The debrief should connect specific moments to Rousseau's concepts: 
  - Sealed notes → symbolic, unpaid emotions
  - Pay cut → manufactured feelings
  - Mirroring → mutual exposure

  I realize scale is impossible to simulate with 18 people, so I plan to explicitly state that limitation verbally. Also preparing for when students say theater was more fun - I'll reframe it as Rousseau's point about comfortable disengagement.

  Predicting pitfalls: 
  - Awkwardness during festival eye contact
  - Performer struggling with pay cut
  - Students giggling during serious moments
  - Someone refusing festival participation

  Contingencies: 
  - Pre-brief the performer about pay reduction
  - Have extra barriers for theater setup
  - Start festival with low-stakes activities
  - Acknowledge discomfort as part of the design

  The token economy (real money) feels crucial for making the actor's labor tangible. And the sealed notes must remain unopened to maintain the "no obligation" revelation. 

  For timing, strict 15-minute rounds seem feasible if activities are tightly structured. The transition script avoids moralizing by presenting both as "social experiments."

  Finally, the debrief under 200 words will directly link: 
  - Hidden faces → isolation claim
  - Pay cut → severed emotion claim
  - Mirroring → mutual exposure claim
  While explicitly naming the unscalable elements that require verbal explanation.
answer: |-
  Here’s a structured activity designed to embody Rousseau’s critique. Total runtime: 75 minutes (activity: 40 min; debrief: 15 min; buffer: 20 min).  

  ---

  ### **Physical Setup & Roles**  
  - **Room Layout**:  
    - **Theater Round**: Chairs in straight rows facing a "stage" (cleared front area). Tape dividers between chairs block side views. Lights dimmed except on stage.  
    - **Festival Round**: Chairs in a circle, all dividers removed. Bright lighting.  
  - **Roles**:  
    - **1 Paid Performer** (volunteer; compensated with $10 gift card).  
    - **17 Spectators/Participants** (all other students).  
  - **Materials**:  
    - Envelopes with blank slips + pens (1 per spectator).  
    - Tokens (e.g., poker chips) for payment.  
    - Emotion prompt cards (e.g., "Grief," "Joy," "Rage") for performer.  
    - Timer.  

  ---

  ### **Activity Flow**  

  **Transition Script (2 min)**:  
  > *“We’ll simulate two public evenings Geneva might host. Not ‘good vs. bad’—just different social technologies. Observe what these structures ask of you.”*  

  **Round 1: Theater (15 min)**  
  1. **Rules**:  
     - Spectators sit in rows, cannot move/turn. Performer stands on "stage."  
     - Performer draws 3 emotion cards (e.g., Grief, Awe, Contempt). They must perform each for 3 min when cued.  
     - Halfway (min 7), instructor *secretly* halves performer’s payment (show $5 instead of $10). Performer must not react.  
  2. **Climax (min 12)**:  
     - Lights dim further. Hand each spectator a sealed envelope:  
       > *“Write what you’d sacrifice to undo the wrong the performer just enacted.”*  
     - After 60 sec, announce: *“Your sacrifice is noted. No action is needed or possible.”* Collect envelopes unopened.  

  **Transition (3 min)**:  
  - Quickly rearrange chairs into a circle. Discard dividers.  
  > *“Next experiment: A civic festival. Reset your expectations.”*  

  **Round 2: Festival (15 min)**  
  1. **Rules**:  
     - All must participate. No observers.  
     - Two activities (rotate every 5 min):  
       - **Eye Contact Pairs**: Face a partner for 30 sec silence; rotate partners thrice.  
       - **Group Mirroring**: Group copies one leader’s movements; rotate leaders twice.  
     - Instructor enforces: *“If you watch, you must be watched within 30 seconds.”*  

  ---

  ### **Debrief (15 min / <200 words)**  
  **Map Moments to Claims**:  
  1. **Theater’s Isolation/Unpaid Feeling**:  
     > *“In the theater, your faces were hidden. You wrote sacrifices—but they cost nothing, and no one saw them. Like Rousseau’s audience, you felt alone with emotions that demanded no accountability.”*  
  2. **Actor’s Manufactured Feeling**:  
     > *“Our performer’s pay was cut mid-show. Did you detect their real feelings? Could you? Rousseau argues the actor severs feeling from truth to sell it. Your uncertainty proves his point: the performance *requires* inaccessibility.”*  
  3. **Festival’s Mutual Exposure**:  
     > *“In the festival, you couldn’t hide. Mirroring and eye contact forced mutual exposure—no one was *only* a spectator. Rousseau’s festival isn’t ‘better fun’; it’s a scaffold where citizens see and are seen by equals.”*  

  **Explicit Gaps (Verbal Addendum)**:  
  > *“This *cannot* replicate Rousseau’s scale argument. With 18 people, both models feel ‘small.’ But imagine 10,000 strangers: the theater isolates you in the crowd. The festival? Only possible in a tight-knit Geneva, where familiarity forces accountability. Our simulation makes exposure manageable—Rousseau fears it’d collapse in a large state.”*  

  ---

  ### **Predictable Pitfalls & Fixes**  
  1. **Breaking Frame**:  
     - **Likely**: Giggles during festival eye contact; performer overacting.  
     - **Fix**: Pre-brief: *“Discomfort is data. Note it, but stay in role.”* If collapse occurs, pause and reflect: *“What about this structure made that hard?”*  

  2. **Preference for Theater**:  
     - **Likely**: Students call theater “more fun” (comfortable disengagement).  
     - **Fix**: *“Rousseau agrees! Theater *is* easier—but he warns that ease corrupts civic bonds. Did the festival’s discomfort serve a purpose?”*  

  3. **Logistical Snags**:  
     - **Performer struggles**: Privately prep them pre-class on pay cut.  
     - **Slow transitions**: Assign 3 students as “stagehands” to move chairs.  

  ---

  ### **Why This Works**  
  - **Theater’s alienation** is felt through physical barriers and the cruel futility of the sealed sacrifice.  
  - **Performer’s pay cut** materializes the “severed feeling” Rousseau condemns.  
  - **Festival’s forced reciprocity** makes mutual exposure unavoidable (and awkward, per Rousseau’s vision).  
  - The debrief’s frankness about scale preempts false equivalency.  

  **Total words**: 1,098.
