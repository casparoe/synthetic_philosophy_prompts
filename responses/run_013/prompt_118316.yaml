  First, I need to map the landscape. The user specifically requested five interpretations: reciprocity norm, superrationality, Kantian universalization, equal weighting of interests, and evolutionary selection. But some of these feel adjacent—like superrationality and universalization might overlap in weird ways. Gotta keep them distinct.

  Hmm... starting with reciprocity. That's clearly about repeated interactions. In a one-shot PD? Useless. Verdict: doesn't support cooperation here. Moving to superrationality—that Hofstadter-esque "if I do X, identical reasoners do X" angle. Interesting! A purely self-interested agent might cooperate if they believe their choice controls the other's. But is that coherent? Feels fragile, like assuming symmetry where none exists. Still, technically demands PD cooperation. 

  Kantian universalization... ah, the maxim-testing approach. "If everyone defected" leads to worse outcomes, so defecting fails the test. But wait—doesn't Kant require intent consistency, not outcome optimization? User might push back here. Equal weighting is simpler: just raw impartiality. Cooperating becomes obvious, but at the cost of ignoring self-interest entirely. 

  Evolutionary reading? Nope. Defectors dominate in one-shot scenarios. Almost the opposite of what the friend wants. 

  Biggest tension points: Superrationality vs empathy. One's about logical necessity among clones, the other about caring. And that negative version! "Don't harm" doesn't forbid defecting—only active malice. Friend probably meant Kantian or equal weighting, both demand cooperation but for very different reasons. 

  User seems sharp—they'll spot that "sounds like it settles it" vs "actually settles it" gap. Should flag where the proverb overreaches. Also... that "refrain from harm" angle feels underdiscussed in ethics lit. Might be worth italicizing.
answer: |-
  Here's a systematic breakdown of distinct interpretations of "treat others as you would have them treat you," ordered by strength, with verdicts on plausibility and whether they mandate cooperation in the one-shot Prisoner's Dilemma (PD). Your friend's conclusion (cooperation) only holds under specific, contestable readings.

  ---

  ### **1. Norm of Reciprocity (Tit-for-Tat)**
  - **Principle**: Cooperate because others will reciprocate in *future interactions*. Grounded in enlightened self-interest.
  - **Commits to**: Cooperating in *repeated* interactions where retaliation is possible; defecting in one-shot scenarios.
  - **Plausible?** Yes, empirically robust (e.g., Axelrod's tournaments).
  - **Demands PD cooperation?** ❌ **No.** In a *one-shot* PD against a stranger, reciprocity is irrelevant—no future interactions exist to enforce payback.
  - **Verdict**: Rational but silent on one-shot PD.

  ---

  ### **2. Superrationality (Hofstadter/Maximization of "We-Thinking")**
  - **Principle**: In symmetric games, assume all identical rational agents will make the *same choice* as you. Evaluate actions by their outcome if *universally adopted*.
  - **Commits to**: Cooperating if (1) agents are identical reasoners, (2) symmetry is assumed, and (3) payoffs are judged collectively.
  - **Plausible?** ⚠️ **Controversial.** Requires metaphysical symmetry and abandons standard game theory. No self-interest needed—pure logic demands cooperation to avoid mutual defection.
  - **Demands PD cooperation?** ✅ **Yes.** Universal cooperation yields higher payoff (3,3) than universal defection (1,1). A self-interested superrational agent cooperates because their choice "controls" the other's identical choice.
  - **Vs. Empathy**: No caring required—purely about logical consistency among clones.  
  - **Vs. Reciprocity**: Fails under repetition? ❌ **No.** In repeated PD, superrationality still demands cooperation in *each round*, as defection "infects" all rounds.
  - **Verdict**: Logically coherent but metaphysically strained. Delivers your friend's conclusion.

  ---

  ### **3. Kantian Universalization (Categorical Imperative)**
  - **Principle**: Act only on maxims you can will as universal law. Tests moral permissibility via consistency.
  - **Commits to**: Rejecting maxims that lead to contradiction or self-defeat when universalized.
  - **Plausible?** ⚠️ **Debated.** Core to deontology but criticized for vagueness (e.g., how to formulate maxims?).
  - **Demands PD cooperation?** ✅ **Yes** (arguably). Maxim: "I will defect to maximize my payoff." If universalized, all defect, leading to worse outcomes (1,1)—a pragmatic contradiction. Cooperating avoids this.
  - **Vs. Superrationality**: Similar outcome, but Kant focuses on *moral duty*, not collective payoff. Superrationality is amoral.
  - **Verdict**: Demands cooperation if defection’s maxim fails universalization—plausible for PD.

  ---

  ### **4. Equal Weighting of Interests (Impartial Sympathy)**
  - **Principle**: Give others' interests *the same weight* as your own. A utilitarian/compassionate view.
  - **Commits to**: Altruism. Valuing others' welfare equally to your own.
  - **Plausible?** ⚠️ **Demanding.** Psychologically unrealistic for most, but a gold standard in ethics (e.g., Singer).
  - **Demands PD cooperation?** ✅ **Yes.** Cooperating gives the stranger +3 at cost of -1 to you (net +2 gain). Defecting gives you +1 but costs them -3 (net -2 loss). Equal weighting forbids net harm.
  - **Vs. Superrationality**: Requires *caring*, not just logic. Self-interested agents ignore this.
  - **Verdict**: Ethically strong but psychologically idealistic. Delivers cooperation.

  ---

  ### **5. Empirical Selection (Evolutionary Fitness)**
  - **Principle**: Strategies that prosper under evolutionary/economic selection are "correct."
  - **Commits to**: Whatever behavior survives in competitive environments.
  - **Plausible?** ✅ **Yes** for descriptive claims, ❌ **No** for normative guidance.
  - **Demands PD cooperation?** ❌ **No.** In one-shot PD, defectors outcompete cooperators. Cooperation evolves only in *repeated* settings (e.g., via reciprocity).
  - **Verdict**: Undermines cooperation in one-shot PD. Opposite of your friend's claim.

  ---

  ### **The Negative Version ("Refrain from harming")**
  - **Principle**: *Avoid treating others as you would not want to be treated.* Focuses on prohibitions.
  - **Commits to**: Not actively harming others, but permits inaction.
  - **Demands PD cooperation?** ❌ **No.** Defecting doesn't *actively harm* the other player—it merely fails to *benefit* them. You wouldn't want them to harm you, but defection isn't harm; it's profit-seeking.
  - **Verdict**: Demands non-maleficence but not beneficence. Too weak for PD cooperation.

  ---

  ### **Which Reading Did Your Friend Use?**
  - **Most plausible**: **Kantian universalization** or **superrationality**. Both frame cooperation as a rational/moral duty via universal adoption, matching her claim that "if everyone reasoned as she did, all would benefit."  
  - **Does it settle the one-shot PD?**  
    - ✅ **Rhetorically yes**: Both readings *sound* decisive.  
    - ⚠️ **Actually?** Only under contested premises:  
      - Kant: Relies on defection's maxim being incoherent (some dispute this).  
      - Superrationality: Requires agents to accept symmetry metaphysics (rejected by orthodox game theory).  
    - **Equal weighting** also works but demands radical altruism she likely didn’t invoke.

  ---

  ### **Menu of Verdicts**
  | **Principle**              | **Strength** | **Plausible?**       | **PD Cooperation?** | **Verdict**                          |
  |----------------------------|--------------|----------------------|---------------------|--------------------------------------|
  | Reciprocity                | Weak         | ✅ (empirical)       | ❌ No               | Pragmatic but irrelevant to one-shot |
  | Superrationality           | Strong       | ⚠️ (metaphysical)    | ✅ Yes              | Logically strict but non-standard    |
  | Kantian Universalization   | Strong       | ⚠️ (disputed)        | ✅ Yes              | Morally robust but formulation-sensitive |
  | Equal Weighting            | Strongest    | ⚠️ (idealistic)      | ✅ Yes              | Ethically pure but psychologically demanding |
  | Empirical Selection        | Weak         | ✅ (descriptive)     | ❌ No               | Explains reality, opposes cooperation |
  | Negative Rule              | Weakest      | ✅ (intuitive)       | ❌ No               | Prevents harm but permits defection  |

  **Key Takeaway**: The proverb only demands one-shot PD cooperation under **superrationality**, **Kantian universalization**, or **equal weighting**—all substantive (not platitudinous) and philosophically loaded. Your friend likely conflates these with the proverb's intuitive appeal, but none are uncontroversial. In a one-shot PD, defection remains the dominant strategy for standard rational agents.
