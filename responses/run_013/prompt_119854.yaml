  Proposal:

  **Research Proposal: The Absent-Minded Driver and the Evaluation of Plans**

  **1. Research Question:**  
  What makes a plan rational for an agent who, at the moment of choice, cannot distinguish which part of the plan he is in? Specifically, I aim to investigate whether the tension between the ex-ante (before the journey) and ex-interim (at the moment of choice) evaluation of a plan in the absent-minded driver problem (AMDP) stems primarily from imperfect recall, imperfect information, or a fundamental gap between choosing acts and choosing policies. I will test the hypothesis that the core issue is not imperfect recall but a conflict between two standards of rationality: maximizing expected payoff from the ex-ante perspective versus having each act be optimal given the agent’s information at the time of choice.

  **2. Background and Why the Question is Open:**  
  The AMDP is a decision-theoretic puzzle where a driver must decide whether to exit at one of two identical intersections. Exiting at the first yields 0, at the second yields 4, and continuing past both yields 1 (a crash). The driver is absent-minded: at each intersection, he cannot tell which one he is at or whether he has already passed one. The standard solution is to continue with probability \( p = \frac{2}{3} \) at each intersection, maximizing the ex-ante expected payoff of \( 4p - 3p^2 \). 

  My friends and I initially thought that at the moment of choice, continuing might not seem optimal because the driver does not know if he is at the first or second intersection. However, upon re-deriving the standard solution, I found that at \( p = \frac{2}{3} \), the expected payoff of continuing (2) is actually higher than that of exiting (1.6) conditional on being at an intersection. This suggests that the tension might be less pronounced than we thought. Yet, the literature and our initial intuition indicate a deeper puzzle: if the driver were to re-optimize at the moment of choice, he might be tempted to deviate from the ex-ante optimal plan, especially in variants of the problem. 

  The question remains open because:
  - Some philosophers argue that rationality requires consistency at every stage, but in AMDP, the ex-ante optimal plan might not be re-optimizing (i.e., if the driver recalculates at an intersection without committing to the plan, he might choose a different \( p \)).
  - It is unclear whether the puzzle arises from the lack of memory (imperfect recall) or from the lack of information (inability to distinguish intersections), or whether it reflects a genuine conflict between act-based and plan-based rationality.
  - Variants of AMDP (e.g., with memory aids or more intersections) have been discussed, but a systematic study of how these variants affect the ex-ante/ex-interim tension is needed.

  **3. Method and Six-Week Plan:**  
  I will conduct a conceptual and mathematical analysis of AMDP and four variants, using only pen-and-paper derivations. The work will proceed as follows:  

  - **Weeks 1-2: Classic AMDP.**  
    I will re-derive the standard solution and the ex-interim expected payoffs for continuing and exiting. I will clarify the source of the apparent tension and why it might arise in some interpretations but not in the basic calculation.  

  - **Weeks 3-4: Variant Construction and Analysis.**  
    I will build and analyze at least two of the following variants (prioritizing those that seem most revealing):  
    - *Variant 1 (Memory Aid):* The driver can leave a mark at the first intersection. How does this change the optimal plan and the ex-ante/ex-interim tension?  
    - *Variant 2 (Three Intersections):* With payoffs 0, 4, 6 for exiting at the first, second, or third intersection, respectively, and crash payoff 1. Does the optimal \( p \) and the tension persist?  
    - *Variant 3 (Crash Payoff):* How does changing the crash payoff (e.g., to 0 or -100) affect the optimal \( p \) and the ex-interim evaluation?  
    - *Variant 4 (Two Drivers):* Two drivers share one payoff. Each can see the other’s choice but not their own position. Does this turn the problem into one of coordination?  

    For each variant, I will compute the ex-ante optimal plan and the ex-interim expected payoffs of following that plan.  

  - **Weeks 5-6: Synthesis and Writing.**  
    I will compare the variants to isolate the factors (recall, information, policy) and evaluate my hypothesis. I will write up the results, including:  
    - Whether the tension between ex-ante and ex-interim evaluation persists in any variant.  
    - Whether imperfect recall or imperfect information is the key factor.  
    - What this implies for the standards of rational choice.  

  **4. Expected Results and Failure Conditions:**  
  - **Expected Results:**  
    I expect to find that the tension (if present) is not primarily due to imperfect recall because it may persist even with a memory aid (e.g., if the driver can condition on the mark, the plan is then to exit at the second, but the driver at the first might be tempted to change the plan). Alternatively, the tension might vanish in some variants, revealing that the core issue is information asymmetry. I will produce a clear taxonomy of when the two standards of rationality come apart and why.  

  - **Failure Conditions:**  
    The project fails if:  
    (a) The classic AMDP and all variants show no ex-ante/ex-interim tension (i.e., the ex-ante optimal plan is always ex-interim optimal), meaning my initial hypothesis is unfounded.  
    (b) The variants are mathematically intractable or too similar to the classic case, yielding no new insights.  
    (c) The core issue turns out to be a well-settled matter in the literature (e.g., if the tension is already fully explained by existing concepts like "time inconsistency" or "dynamic inconsistency").  

  **5. Feasibility and Challenges:**  
  As a high school student, I am confident in my ability to handle the algebra and probability required. However, I acknowledge the following challenges:  
  - **Scope:** Six weeks is short. I will prioritize two variants to ensure depth.  
  - **Technicality:** Variants with more intersections may involve complex polynomials. I will simplify (e.g., by using specific numbers) or focus on qualitative insights.  
  - **Literature:** I am aware that AMDP is well-studied, but I will focus on independent analysis. If I discover that my variants are already settled, I will pivot to synthesizing the existing answers with my own perspective.  

  This project will deepen my understanding of decision theory and provide a clear case study in how philosophical puzzles can be dissected through targeted variants.
answer: |-
  ### Research Proposal: The Absent-Minded Driver and the Evaluation of Plans  
  **Student Name**: [Your Name]  
  **Workshop**: [Name of Summer Philosophy Workshop]  

  ---

  #### **1. Core Research Question**  
  When an agent commits to a plan in advance but cannot distinguish *which part of the plan* they are executing at the moment of choice—due to imperfect recall, imperfect information, or both—what makes one plan "better" than another? Specifically:  
  - Is the standard solution to the absent-minded driver problem (AMDP) a genuine resolution, or does it mask a deeper tension between two standards of rationality: *ex-ante optimality* (evaluating the plan before the journey) and *ex-interim optimality* (evaluating each act given the agent’s moment-of-choice information)?  
  - How do **imperfect recall**, **imperfect information**, and the **act-vs.-policy distinction** each contribute to this tension?  

  ---

  #### **2. Why the Puzzle Remains Open**  
  The standard AMDP solution recommends continuing at each intersection with probability \( p = \frac{2}{3} \), maximizing the ex-ante expected payoff (\( \max(4p - 3p^2) \)). Yet, my friends and I questioned whether this resolves the puzzle:  
  - **The obvious positions fail to close the case**:  
    - *Ex-ante optimizers* argue the driver should commit to \( p = \frac{2}{3} \) since it yields \( \frac{4}{3} \) (>1 for "always continue" or 0 for "always exit").  
    - *Ex-interim skeptics* counter that at the moment of choice, the driver cannot know if continuing is optimal (e.g., at the first intersection, continuing is best; at the second, it risks a crash).  
  - **The tension persists**: The ex-ante optimal plan prescribes acts that *feel* irrational ex interim if the driver could renege. Standard discussions treat imperfect recall, imperfect information, and policy choice as a monolithic problem. My variants will disentangle them to test whether the tension is intrinsic to rationality itself or an artifact of the setup.  

  ---

  #### **3. Methodology: Six-Week Plan**  
  Using pen-and-paper analysis, I will build variants of AMDP to isolate factors. Each variant tests one dimension of the puzzle.  

  - **Weeks 1–2: Groundwork in Classic AMDP**  
    - Re-derive the standard solution: Confirm \( p = \frac{2}{3} \) maximizes \( 4p - 3p^2 \).  
    - Calculate ex-interim payoffs: At an intersection, compute expected payoffs for continuing vs. exiting, conditional on the driver’s information (e.g., "I am at *some* intersection").  
    - **Goal**: Pinpoint if/when ex-ante and ex-interim evaluations diverge in the base case.  

  - **Weeks 3–4: Construct and Analyze Variants**  
    - **Variant 1 (Imperfect Recall Test)**: Introduce a memory aid (e.g., the driver leaves a mark at the first intersection).  
      - *Question*: Does the tension vanish if the driver can distinguish intersections? If so, is recall the core issue?  
    - **Variant 2 (Structural Test)**: Scale to 3+ intersections with payoffs (e.g., exit at 1st: 0; 2nd: 4; 3rd: 6; crash: 1).  
      - *Question*: Does the optimal \( p \) (e.g., now maximizing \( 4p(1-p) + 6p^2(1-p) + p^3 \)) preserve the ex-ante/ex-interim gap? Or is it unique to 2 intersections?  
    - **Variant 3 (Stakes Test)**: Alter crash payoffs (e.g., crash = \(-100\) or crash = \(0.5\)).  
      - *Question*: Does the ex-ante optimal plan remain ex-interim defensible when stakes change?  
    - **Variant 4 (Agency Test)**: Two drivers sharing one payoff. Each sees the other’s choice but not their own position.  
      - *Question*: Is the tension about individual memory or multi-agent coordination over time?  

  - **Weeks 5–6: Synthesis and Writing**  
    - Compare variants: Does the tension (1) persist, (2) vanish, or (3) transform?  
    - Test my working hypothesis: The paradox is *not* primarily about recall (it survives Variant 1) but reflects a conflict between ex-ante and ex-interim standards.  
    - Draft the final paper (4,000 words): Explain which variant(s) resolve the tension and what this implies for rational planning.  

  ---

  #### **4. Expected Results and Failure Conditions**  
  - **Success looks like**:  
    - A clear account of which variant(s) eliminate the tension (e.g., memory aids may dissolve it, implicating recall; extreme crash payoffs may make ex-ante plans ex-interim indefensible).  
    - A refined view of rationality: E.g., "The ex-ante standard is coherent only when _________."  
  - **Failure conditions**:  
    - All variants collapse to the standard AMDP conclusion (no new insights).  
    - The "resolute planning" idea reduces to existing concepts (e.g., dynamic inconsistency in decision theory).  
    - Mathematical hurdles (e.g., 4+ intersections) prevent clear conclusions.  
    - I discover the core idea is settled (e.g., if literature shows ex-ante/ex-interim tension is already resolved).  

  ---

  #### **5. Feasibility Assessment**  
  - **Strengths**:  
    - The math requires only algebra, probability, and calculus (maximizing polynomials), which I have studied.  
    - Variants are designed to be tractable without archives/labs (e.g., crash payoff changes only require adjusting constants).  
  - **Risks and Mitigation**:  
    - **Scope creep**: I will prioritize 2–3 highest-impact variants (e.g., memory aid and stakes) if time runs short.  
