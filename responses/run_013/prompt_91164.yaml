prompt: |-
  For the past few months I've been sitting in on a small graduate seminar on cause prioritization — the usual trio of importance, tractability, and neglectedness, along with the various attempts to formalize or replace it — and I've come away with two nagging worries I'd like you to take seriously rather than dissolve. The first is that the framework is asked to do two quite different jobs at once. One is allocative: a foundation with a fixed pot of money wants to know where the marginal dollar does the most good, which is a portfolio question about returns curves. The other is biographical: an individual choosing what to spend a decade on is asking about option value, personal fit, and irreversible commitment, not about marginal returns. A colleague in the seminar pushes this further and proposes replacing neglectedness outright with a quantitative notion — roughly, the elasticity of expected impact with respect to additional resources in a cause — on the grounds that what matters is not how few people are working on something but how steeply its returns rise as attention arrives; a crowded field could still be the best bet if its returns are unusually convex. The second worry is that neglectedness equivocates between a problem being under-researched and a career field being under-populated, and that these can come apart sharply: a topic may be crowded with funding and thin on anyone who actually understands it, or the reverse. I don't know whether either worry survives scrutiny, but together they have made me doubt that the standard three criteria are even measuring one thing.

  Now I've been asked to help a donor design a small programme: two researchers, roughly a year, conceptual work only, no new empirical studies, and explicitly aimed at improving how cause prioritization is done rather than at ranking any particular cause. Which open questions about the framework itself most deserve that year, and in what order? I want a defended agenda, not a survey: for each question, why it is upstream of the others, what would have to be true for two people to make real progress on it in twelve months, and how its resolution would change an actual allocation decision. I'm especially interested in the ones that are load-bearing but rarely made explicit — whether importance can be put on a single scale across incompatible value systems without quietly importing a contested population axiology; whether the three criteria are assumed to trade off smoothly when they might instead be lexicographic or gated by a tractability threshold; whether the downstream effects of an intervention are knowable enough for expected-impact estimates to carry information at all, or whether the whole exercise drowns in consequences too diffuse to anticipate; and whether the honest output is a single ranking or a portfolio that stays defensible across several worldviews that will not be reconciled. The wild animal suffering case strikes me as a useful stress test, since scope and neglectedness both look enormous there while tractability is exactly what is in dispute. Tell me what you would cut, what you would keep, and what would move each item up or down your list.
reasoning: |-
  Okay, I need to understand the user's query thoroughly. They've been in a graduate seminar on cause prioritization and have two main worries. First, they're concerned that the ITN framework (Importance, Tractability, Neglectedness) is trying to do two different jobs: allocative decisions for foundations and biographical decisions for individuals. Second, they worry that "neglectedness" is ambiguous—it could mean under-resourced or under-researched, and these don't always align. For example, a field might have lots of funding but few true experts, or vice versa.

  The user has been tasked with designing a one-year program for two researchers focused on improving cause prioritization itself. They need a defended agenda, not just a survey. The agenda should prioritize open questions about the framework, explaining why each is upstream, what's needed for progress in 12 months, and how resolving it would change allocation decisions. They also mention specific areas of interest: commensurability of values, trade-offs between criteria, knowability of effects, and whether outputs should be rankings or portfolios. Wild animal suffering is suggested as a stress test.

  I should start by mapping out the key issues from the user's worries and interests. The dual-purpose problem of ITN (allocative vs. biographical) is central. Then there's the ambiguity in neglectedness. The colleague's point about elasticity replacing neglectedness is important—it shifts focus to the responsiveness of impact to resources. I need to integrate this with the user's other concerns about value commensurability, trade-off structures, and uncertainty.

  For the research agenda, I need to prioritize questions that are foundational. The meta-framework question seems upstream because it addresses the core tension between allocative and biographical uses. If we don't resolve this, other questions might be tackled in the wrong context. Next, value commensurability is critical because without a way to compare different values, importance can't be measured. Then, uncertainty and epistemology because if we can't estimate impacts, the whole framework falters. After that, neglectedness vs. elasticity, as it refines a key criterion. Finally, decision-theoretic structures to handle how criteria interact.

  The user emphasized wanting a defended agenda, so each priority must justify why it's ordered that way. Also, practical constraints: two researchers, one year, conceptual work only. So, each question needs to be tractable within those limits. For example, value commensurability might involve philosophy and decision theory, which two people could handle with existing literature. Wild animal suffering serves as a case study to test frameworks, especially on tractability and neglectedness.

  The user’s deeper needs might include wanting the research to lead to actionable improvements in cause prioritization, ensuring that the framework can handle real-world complexities without collapsing under scrutiny. They might also want the program to produce tools or heuristics that practitioners can use, even if some philosophical questions remain unresolved. Highlighting how each priority could change actual decisions (e.g., shifting funding to more elastic causes) would address their request for impact.
answer: |-
  Here’s a defended research agenda for your 12-month programme, prioritizing questions that are both foundational and actionable. The ordering reflects upstream dependencies, tractability for two researchers, and potential impact on real decisions. Wild Animal Suffering (WAS) is used as a recurring test case.

  ### Core Prioritization Logic:
  1.  **Upstream First:** Tackle questions that define *what the framework is even trying to do* before optimizing its components.
  2.  **Load-Bearing & Underexplored:** Focus on ambiguities that silently distort decisions.
  3.  **Actionable in 12 Months:** Target conceptual progress requiring synthesis, not new data.
  4.  **Decision-Relevance:** Solutions must change how a funder or individual acts.

  ---

  **The Agenda (Ranked):**

  1.  **Question: What is the *Primary Function* of the Framework: Allocative Efficiency or Biographical Guidance?**
      *   **Why Upstream?** This directly addresses your first worry. *Everything* downstream (criteria definitions, trade-offs, outputs) depends on whether the goal is distributing marginal resources or guiding irreversible life choices. Resolving this clarifies the framework's scope and prevents category errors.
      *   **Progress in 12 Months:** Define distinct operationalizations for the allocative vs. biographical functions. Develop:
          *   A clear "job description" for each use case.
          *   Criteria sensitivity analysis: How do optimal rankings differ under each purpose? (e.g., Neglectedness/Elasticity matters hugely for allocative; personal fit/option value dominate biographical).
          *   Hybrid decision trees: When/how should an actor switch frameworks?
      *   **Impact on Allocation:** A foundation would explicitly separate its *grantmaking criteria* (allocative) from its *career advising* for grantees (biographical). An individual would first choose *if* to use an allocative lens for their career *at all*. WAS Example: For allocative, WAS's neglectedness is key; for biographical, the extreme tractability uncertainty might deter all but specialists.
      *   **Move Up/Down:** **Keep #1.** Failure to resolve this dooms the entire framework to misapplication.

  2.  **Question: Can "Importance" Be Commensurable Across Incompatible Moral Worldviews?**
      *   **Why Upstream?** "Importance" is foundational yet rests on contested axiology. Without clarifying commensurability, comparisons across causes (e.g., global health vs. AI risk vs. WAS) are illusory or implicitly impose one worldview. This is the core load-bearing ambiguity.
      *   **Progress in 12 Months:** Synthesize philosophy (population ethics, value pluralism) and decision theory under deep uncertainty. Produce:
          *   A typology of worldview conflicts relevant to cause prioritization (e.g., person-affecting vs. total utilitarianism, sentientism scope).
          *   Formalisms for "robustly important" causes: Causes high-priority across many plausible worldviews (e.g., avoiding existential catastrophes).
          *   "Worldview-Sensitivity" metrics: Quantify how much rankings depend on unresolved philosophical choices.
      *   **Impact on Allocation:** Donors would shift from seeking *one true ranking* to:
          *   Funding worldview-specific prioritization research.
          *   Explicitly funding causes robust across many views.
          *   Avoiding investments assuming highly contestable axiologies. WAS Example: Resolving commensurability determines if WAS is "important" at all (sentientism) or negligible (anthropocentrism).
      *   **Move Up/Down:** **Keep #2.** This is the bedrock of "importance." If importance collapses into irreconcilable pluralism, the framework needs radical redesign.

  3.  **Question: How Do We Handle Radical Uncertainty & Diffuse Downstream Effects?**
      *   **Why Upstream?** If expected-impact estimates are swamped by unpredictable flow-through effects or fundamental ignorance (common in novel interventions), the entire quantitative ITN enterprise falters. This questions the *knowability* assumption.
      *   **Progress in 12 Months:** Integrate epistemology and complex systems theory into prioritization. Develop:
          *   A formal typology of uncertainty in cause assessment (e.g., parameter vs. model vs. moral vs. radical ignorance).
          *   Heuristics for when expected value calculations are informative vs. deceptive/misleading.
          *   "Robust Decision Making" (RDM) approaches: Criteria focusing on option value, resilience, and avoiding downside catastrophes under ignorance.
      *   **Impact on Allocation:** Funders would:
          *   Prioritize causes/interventions with *robust* justification under ignorance (e.g., information gathering, building resilient systems).
          *   Downweight causes reliant on long, fragile chains of speculative impact.
          *   Explicitly budget for exploration vs. exploitation. WAS Example: WAS tractability hinges *entirely* on resolving this uncertainty. If downstream effects are unknowable, funding shifts to foundational research *on tractability itself*.
      *   **Move Up/Down:** **Keep #3.** If impact is fundamentally unknowable, the framework must shift from maximizing EV to minimizing regret or building options.

  4.  **Question: Neglectedness vs. Elasticity: Clarifying the Response Function & Its Ambiguities.**
      *   **Why Here?** Builds on #1 (allocative focus) and incorporates your second worry & colleague's proposal. Requires #3 (uncertainty) to assess measurability. Focuses on refining a key criterion.
      *   **Progress in 12 Months:** Formalize "impact elasticity" concepts. Analyze:
          *   The distinction & relationship between under-funding, under-research, and under-talent (your second worry).
          *   Conditions where elasticity is estimable vs. guesswork.
          *   When high elasticity justifies entry into "crowded" fields (supporting your colleague).
          *   Operational definitions for "neglectedness" components in research vs. implementation.
      *   **Impact on Allocation:** Foundations would:
          *   Replace crude "dollars/people in field" metrics with targeted assessments of the *marginal impact curve* where possible.
          *   Distinguish funding for *talent discovery/development* vs. *project execution* based on bottleneck analysis.
          *   Be cautious of elasticity claims in highly uncertain domains. WAS Example: Is WAS bottlenecked by money (elastic funding needed)? Or by lack of viable interventions (elasticity near zero until breakthroughs)? This dictates funding strategy.
      *   **Move Up/Down:** **Cut?** While critical, it's more operational than #1-3. Could be merged into the output of #1 (allocative function). However, its ambiguity is so pervasive it deserves explicit focus. **Keep, but after fundamentals.**

  5.  **Question: Lexicographic Ordering, Thresholds, or Smooth Trade-offs? How Should Criteria Interact?**
      *   **Why Last?** This depends entirely on the *nature* of the criteria resolved in #1-4. The optimal interaction can't be defined without knowing what's being traded off.
      *   **Progress in 12 Months:** Develop a decision-theoretic framework for criteria interaction. Explore:
          *   Conditions justifying lexicographic ordering (e.g., "Importance > Threshold X" first).
          *   Threshold models (e.g., minimum tractability for consideration).
          *   Multi-attribute utility theory (MAUT) applications.
          *   Satisficing vs. optimizing approaches.
      *   **Impact on Allocation:** Would determine if causes are:
          *   Screened out entirely for failing a threshold (e.g., tractability too low).
          *   Ranked strictly by one criterion after thresholds are met.
          *   Traded off via weighted sums. WAS Example: If Importance is deemed sufficient and Neglectedness extreme, does *any* tractability estimate above zero justify investment? Or is a minimum confidence threshold needed?
      *   **Move Up/Down:** **Cut or Integrate.** Least upstream. Its resolution depends heavily on answers to #1, #2, and #3. Progress here in 12 months might be limited to clear conceptual framing based on prior work. Best addressed *after* the nature of the criteria is clearer.

  ---

  **What to Cut & Why:**

  *   **Directly "Ranking Causes":** Explicitly excluded by your mandate. Focus is meta.
  *   **Overly Technical Formalizations for their Own Sake:** Prioritize conceptual clarity and decision-impact over mathematical elegance without purpose.
  *   **Resolving Specific Moral Disputes (e.g., personhood):** Focus on *how to handle* disagreement (#2), not resolving the disagreement itself.
  *   **Comprehensive Surveys:** You want defended agendas and progress, not literature reviews.

  **Why This Agenda & Order?**

  1.  **#1 (Function):** If the framework is used for the wrong job, nothing else matters. This is the root of your first worry.
  2.  **#2 (Commensurability):** "Importance" is the anchor. If it's fundamentally fractured, the framework needs radical change. Load-bearing and rarely explicit.
  3.  **#3 (Uncertainty/Knowability):** The practical Achilles' heel of impact estimation. Determines if "expected impact" is meaningful. Directly addresses your "diffuse consequences" worry.
  4.  **#4 (Neglectedness/Elasticity):** Refines the most operationally ambiguous criterion, incorporating your second worry and colleague's proposal. More actionable once the framework's purpose and uncertainty are handled.
  5.  **#5 (Trade-offs):** While crucial, its structure depends entirely on the *character* of the criteria defined earlier. Least upstream.

  **Output: Not a Ranking, But Clarity & Tools**

  The resolution of these questions won't yield *the* perfect cause ranking. Instead, it will provide:

  1.  **Clearer Frameworks:** Distinct tools for allocative vs. biographical decisions.
  2.  **Explicit Boundaries:** Knowing when quantification is useful vs. when RDM heuristics are needed.
  3.  **Worldview Transparency:** Maps showing how rankings depend on moral assumptions.
  4.  **Refined Criteria:** Operational definitions for neglectedness/elasticity sensitive to context.
  5.  **Decision Protocols:** Guidance on thresholds, lexicographic rules, or trade-off weights based on context and uncertainty.

  This empowers funders and individuals to make *more defensible* and *context-appropriate* prioritization decisions, even amidst irreducible uncertainty and pluralism. The goal is not a single answer, but better questions and more robust decision processes. Wild Animal Suffering will serve as a powerful benchmark throughout, highlighting tensions in scope, neglectedness, tractability uncertainty, and moral inclusion.
