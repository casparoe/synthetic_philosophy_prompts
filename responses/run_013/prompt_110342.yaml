  ### Decision Tree for Counterfactual Mugging Positions

  This flowchart maps initial commitments to named decision-theoretic positions on the counterfactual mugging problem. Each node is a question answerable without knowing downstream consequences. The tree prioritizes clarity and coverage of major views, including edge cases and under-explored combinations. Positions marked with 🄽🄲 require non-causal reasoning (e.g., acausal influence, logical correlation).

  ```mermaid
  graph TD
    A["Q0: Is the scenario well-formed?
    (Can perfect prediction coexist with free will?)"] 
    -->|No| B["Leaf: Scenario under-described/not well-formed"]
    A -->|Yes| C["Q1: Should you pay in counterfactual mugging?
    (Generalizes from blackmail-style acausal threats?)"]
    C -->|Yes| D["Leaf: Pay: Acausal threat generalization holds"]
    C -->|No| E["Q2: Is the object of evaluation the entire policy, 
    not the act? (Ignore post-coin-flip information?)"]
    E -->|Yes| F["Leaf: Updateless/Timeless/Functional Decision Theory (UDT/FDT): Pay"]
    E -->|No| G["Q3: Does evidential dependence between branches matter? 
    (Non-causal influence?)"]
    G -->|Yes| H["Leaf: Evidential Decision Theory (EDT): Refuse"]
    G -->|No| I["Q4: Does the mixed-upside structure matter? 
    (Benefit only on an unobserved branch?)"]
    I -->|Yes| J["Leaf: Deflationary view: Refuse 
    (Precommitment is the only solution)"]
    I -->|No| K["Leaf: Causal Decision Theory (CDT): Refuse"]
  ```

  #### Leaf Positions
  1. **Scenario under-described/not well-formed**: Rejects compatibility of free will and perfect prediction.  
  2. **Pay: Acausal threat generalization holds**: Pays to avoid acausal "threats" (extends blackmail-style reasoning).  
  3. **UDT/FDT: Pay**: Evaluates policies, not acts; ignores being in the tails branch.  
  4. **EDT: Refuse**: Conditions on being in tails; paying is evidence of prediction but doesn't affect utility.  
  5. **Deflationary view: Refuse**: Precommitment is essential; no solution exists at decision time.  
  6. **CDT: Refuse**: Pays only if causal effects exist (none here).  

  #### Ambiguous/Unattractive Combinations  
  - **Q3=Yes + Q4=Yes**: Evidential dependence matters *and* mixed-upside is critical → EDT already refuses, but emphasizing branch non-occupancy might lead to new arguments (unexplored).  
  - **Q2=Yes + Q1=Yes**: Policy evaluation + acausal threats → UDT/FDT covers this, but some might distinguish "acausal" as non-policy-based (rare).  
  - **Q4=No + Deflationary view**: Mixed-upside irrelevant but precommitment essential → Contradictory; deflationism inherently prioritizes branch constraints (incoherent).  

  #### Unseparated Leaves  
  - **Acausal generalization vs. UDT/FDT**: Both pay but for different reasons (threat analogy vs. policy optimization). The tree separates them early (Q1) to avoid conflation.  
  - **EDT vs. Deflationary**: Both refuse, but EDT cites evidential dependence, deflationism cites precommitment necessity.  

  ---

  ### Live vs. Settled Disputes in Decision Theory  
  *Based on current academic discourse (as of 2023):*  

  #### 🔥 Live Disputes (Active Debate)  
  1. **Updatelessness (UDT/FDT) vs. act-based evaluation**:  
     - Core issue: Should agents optimize policies *as if* ignorant of their current branch?  
     - Pro-UDT: Coheres with acausal trade, avoids irrational "updating" on non-informative events.  
     - Anti-UDT: Violates Bayesian rationality (ignoring known information).  
     - **Status**: Unresolved; empirical implications (e.g., AI alignment) intensify debate.  

  2. **Acausal threat generalization**:  
     - Is counterfactual mugging analogous to blackmail with acausal actors?  
     - Pro-generalization: Both involve "pay to prevent harm in unreachable branches."  
     - Anti-generalization: Mugging lacks coercion; payoff is "pure upside" (not a threat).  
     - **Status**: Contentious; few formal treatments exist.  

  3. **EDT with self-locating beliefs**:  
     - Should EDT condition *only* on the current branch? Some argue it should include uncertainty about identity/prediction.  
     - **Status**: Niche but active; ties to anthropic reasoning.  

  4. **Scenario coherence**:  
     - Does perfect prediction imply determinism, invalidating "choice"?  
     - **Status**: Perennial philosophical dispute; no consensus.  

  #### ✅ Settled/Near-Settled  
  1. **CDT refuses**:  
     - Paying causes no benefit in heads branch → refusal is uncontroversial *given CDT's axioms*.  
     - **Status**: Settled; even critics agree CDT behaves this way.  

  2. **EDT refuses (if conditioning on being in tails)**:  
     - Given knowledge of being in tails: EU(pay) = −100, EU(refuse) = 0.  
     - **Status**: Settled *for standard EDT*; disputes center on whether conditioning is correct.  

  3. **Precommitment dominates if possible**:  
     - All agree precommitting to pay is optimal.  
     - **Status**: Uncontested; deflationism builds on this.  

  #### ⚠️ Uncertain Consensus  
  - **Deflationary view**: Often seen as a "fallback" for anti-UDT positions, but not rigorously defended.  
  - **Mixed-upside relevance**: Some argue it’s critical (e.g., "why care about branches you won't see?"), others dismiss it.  
  - **One-shot vs. repeated**: No consensus on differences; most treat mugging as one-shot, but repetition doesn’t resolve core dilemmas.  

  #### Key Sources  
  - **UDT/FDT**: Yudkowsky (2010), Soares & Fallenstein (2015).  
  - **Acausal generalization**: Muehlhauser (2017), but formalisms are sparse.  
  - **EDT/CDT**: Pearl (2000), Joyce (1999).  
  - Criticism: Armstrong (2015) questions UDT’s coherence.  

  ---

  Use the tree to clarify reading group discussions by anchoring positions to foundational commitments. For unresolved disputes, focus on *why* answers diverge (e.g., "UDT rejects conditioning on tails because...").
