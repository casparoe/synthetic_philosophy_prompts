  - Finally, clash on axioms: Alex defends IIA with "irrelevant" alternatives not mattering, Blair attacks with "but deleting options changes bargaining power." Reverse for monotonicity: Blair says expansion should help, Alex says why should it if the new options are irrelevant? 

  Key: no strawmen. Alex must acknowledge that Kalai protects against worsened prospects, but argue it's not the bargain's fault. Blair must admit IIA prevents manipulation but call it unrealistic. 

