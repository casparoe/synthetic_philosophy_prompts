prompt: |-
  I am a high school student who follows competitive leagues and esports closely, and last year I ran the bracket, standings, and tie-breakers for my school's intramural tournament. I am therefore fairly fluent in the vocabulary of tournament and league design: single elimination, round robin, Swiss, group stages, points and goal differential, seeding, byes, wild cards, head-to-head tie-breakers, and the distinction between a format designed to crown a champion and a format designed to rank everyone fairly. I have not studied political science or the mathematics of voting, and I would like you to treat tournament design as my working vocabulary.

  Please restate the debate between proportional representation and first-past-the-post in that vocabulary, as faithfully as you can, taking the major positions one at a time: the case that first-past-the-post produces clear, accountable, decisive outcomes and discourages fragmentation; the case that proportional representation reflects the actual distribution of support and gives minorities a voice; and the various claims about wasted votes, spoiler effects, manufactured majorities, coalition governments, and how districts get drawn.

  For each position, tell me three things: what maps cleanly onto something I already understand, what only maps with distortion, and what has no counterpart in tournament design at all. I am especially interested in whether drawing districts has a real analogue in how groups or brackets are drawn, whether coalition government has a real analogue in anything other than a playoff seeding arrangement, and whether any league structure I know, such as promotion and relegation or a points table with no elimination, is a better counterpart than a knockout bracket.

  Then give me the residue report. Where the translation fails, is that a defect of my tournament vocabulary, or a sign that the political claim was vaguer than it sounded? I suspect my framing quietly assumes that the point of a contest is to produce one winner and that losers simply stop mattering afterward, and I want you to flag every place where that assumption does work the political debate does not share. I do not need sources or a reading list; I would rather you reason it out and tell me honestly where the analogy breaks.
reasoning: |-
  Okay, the user is a high school student deeply familiar with tournament structures—single elimination, Swiss systems, tie-breakers—and wants to understand political voting systems through that lens. They're sharp, asking for a precise translation of FPTP vs. PR, including where the analogy holds, distorts, or fails. 

  First, I need to map FPTP to a single-elimination bracket: winner-takes-all per district, like a match where only first place matters. The "spoiler effect" is exactly like a third-party candidate splitting the vote—same as two similar competitors letting a rival win. But accountability? That's where it gets fuzzy. In tournaments, a player's "record" is clear-cut wins/losses, but politicians aren't judged solely on elections; their governance muddies accountability. 

  Proportional representation is trickier. It's like a round-robin or league table where every vote (point) counts toward final standings. Minority voices getting seats? That's akin to a wild-card team advancing despite not winning a division. But PR's coalition governments—parties negotiating post-election—have no direct tournament parallel. Playoff seeding is close but lacks the ongoing negotiation; once brackets are set, teams don't form alliances. 

  District drawing is the biggest stretch. Gerrymandering is like manipulating brackets to favor certain teams, but tournaments rarely redesign groups mid-season. And the core conflict? Tournaments crown one winner; politics needs ongoing representation. That's why "manufactured majorities" feel alien—in sports, you earn wins, but in FPTP, 40% support can yield 60% seats. 

  The residue report flags where the analogy breaks: coalition governance (no sports equivalent), wasted votes (tournaments don't track "meaningless" participation), and PR's aim for fair representation versus tournaments' focus on elimination. The user's assumption—that losers "stop mattering"—is the root issue. Politics isn't about eliminating opponents; it's about sustaining pluralism. 

  Hmm, the student hinted they might overlook this, so I'll emphasize it: PR systems treat elections like a season-long points race, not a knockout cup. That shift—from "one winner" to "many stakeholders"—is where the vocabulary fails. Not their fault; it's a structural difference in goals. I'll make sure to call that out bluntly.
answer: |-
  Here's the translation of electoral systems into tournament design terms, highlighting mappings, distortions, and residues. We'll address each position systematically, preserving the core arguments while flagging where your vocabulary strains or breaks.

  ---

  **First-Past-the-Post (FPTP) System**  
  *Core Claim: Produces clear, accountable, decisive outcomes and discourages fragmentation.*  

  1. **What Maps Cleanly**  
     - **Single-District = Single-Match Bracket:** Each district is a head-to-head match (even with >2 candidates). The candidate with the most votes wins the "match," like advancing in a knockout bracket.  
     - **Discouraging Fragmentation = Avoiding Spoilers:** FPTP penalizes small parties like a tournament penalizes niche strategies—enter too many similar candidates/teams, and you split the vote, letting a rival win with <50% support (e.g., two progressive candidates letting a conservative win). Identical to spoiler effects in qualifiers.  
     - **Decisive Outcomes = Clear Advancement:** Winners are unambiguous (no runoff), like a match ending in regulation time—no tiebreakers needed.  

  2. **What Maps with Distortion**  
     - **Accountability = Performance Tracking:** Holding representatives accountable is like judging a team's seasonal record, but distorted because "matches" (elections) are infrequent (every 4–5 years), and "opponents" (policy outcomes) are ambiguous.  
     - **Discouraging Fragmentation = Forced Mergers:** FPTP pushes small parties to merge pre-election, like tournament rules forcing teams to combine rosters to avoid bracket clutter—but political mergers are messier, with ideological compromises.  

  3. **No Counterpart**  
     - **Manufactured Majorities:** A party winning 55% of seats with 40% of the national vote has no sports parallel. In tournaments, total points/goals determine advancement—never a scenario where a team with fewer total points wins the league.  
     - **Long-Term Minority Rule:** A party consistently winning power with <50% popular support resembles no major sports format—leagues prioritize fairness over repeated "champion" outcomes.  

  ---

  **Proportional Representation (PR) System**  
  *Core Claim: Reflects actual support distribution and gives minorities a voice.*  

  1. **What Maps Cleanly**  
     - **Vote Shares = League Points Table:** Seat allocation mirrors standings in a round-robin league. A party with 30% votes ≈ 30% seats, like a team with 30% of possible points ranking 3rd in a 10-team league.  
     - **Minority Voice = Wild Card/Group Stage Advancement:** Small parties winning seats is like a wild-card team making playoffs or a niche squad advancing from group stages despite not winning matches.  
     - **Reduced Wasted Votes = Participation Points:** Votes for losing candidates still contribute to overall seat allocation, akin to a league where every goal/point counts toward final standings—no "meaningless" matches.  

  2. **What Maps with Distortion**  
     - **Coalition Governments = Playoff Seeding Negotiations:** Post-election coalitions resemble teams negotiating playoff seedings based on mutual interests (e.g., Team A avoids Team B’s bracket quadrant). But political coalitions govern *together*—like rival teams forced to share a locker room and coach.  
     - **Thresholds = Qualification Minimums:** PR vote thresholds (e.g., 5% to win seats) act like minimum points to avoid relegation—but in politics, falling short means *total* exclusion, not just demotion.  

  3. **No Counterpart**  
     - **Direct Minority Influence:** Small parties holding balance of power in coalitions has no sports equivalent. No tournament gives a 10th-place team veto power over the champion's tactics.  
     - **Perpetual Negotiation:** Coalition governments require constant deal-making during governance—like teams renegotiating match rules mid-tournament. Unthinkable in sports.  

  ---

  **Key Concepts & Analogies**  
  - **Drawing Districts (Gerrymandering)**  
    - **Clean Map:** Bracketing/seeding manipulation. E.g., stacking one group with weak teams to ensure a rival advances—identical to "packing and cracking" districts.  
    - **Distortion:** Districts are redrawn *between* "seasons" (elections), unlike fixed tournament structures. Political map-drawing lacks a neutral "commissioner."  
    - **No Counterpart:** Sports brackets don’t affect *who* gets to compete (voters), only matchups. Gerrymandering can disenfranchise entire communities—like barring fans from attending matches.  

  - **Wasted Votes & Spoilers**  
    - **Clean Map:** Wasted votes = losses in single-elimination with no consolation bracket. Spoilers = a 3rd team drawing votes from a stronger rival, identical to tournament dynamics.  
    - **Distortion:** In PR, "wasted" votes only exist below thresholds—like a team’s goals not counting if they finish bottom 3. Rare in sports.  

  - **Coalition Governments**  
    - **Weak Analogue:** Playoff alliances (e.g., teams tanking matches to manipulate brackets). But these are *tactical*, not *structural*.  
    - **No Counterpart:** Coalitions require shared governance post-election—no sports league forces the 2nd and 3rd-place teams to co-manage the champion.  

  ---

  **Residue Report: Where the Analogy Fails**  
  1. **Goal Misalignment**  
     - **Tournaments:** Crown one winner; losers are irrelevant afterward.  
     - **Politics:** Must represent *all* "players" (voters) continuously. PR systems mirror this via league-like structures (no elimination), but FPTP’s "winner-takes-all" logic clashes here.  

  2. **Time Dynamics**  
     - Elections are discrete events; governance is continuous. Coalition bargaining post-election has no sports parallel—it’s like redrawing the bracket *after* group stages conclude.  

  3. **Manufactured Majorities**  
     - A core critique of FPTP (false mandates) is alien to tournaments. If Team A beats Team B 51–49, they advance—fair. But if Team A wins 51% of *seats* with 35% of total votes, it’s like losing the points race but winning the trophy. No sporting format allows this.  

  4. **Voter/Player Agency**  
     - In sports, teams control their fate. In politics, voters can’t "train harder"—district lines, party systems, and electoral formulas constrain outcomes. Gerrymandering’s disenfranchisement has no true counterpart.  

  5. **Coalition Governance**  
     - The ongoing negotiation in PR systems resembles no tournament structure. Playoff seeding is the closest, but it’s a one-time arrangement—not shared operational control.  

  **Conclusion**: Your tournament vocabulary brilliantly illuminates *mechanical* aspects (spoilers, brackets, standings) but stumbles on *representation* and *continuous governance*. The flaw isn’t your framing—it’s that politics isn’t about producing **a** winner but about distributing **ongoing** power. PR systems align best with league formats (accumulated points = sustained influence), while FPTP is pure knockout—effective for decisive outcomes, but ill-suited for inclusive representation. Where the analogy breaks, it reveals political claims that *assume* elections should mimic winner-take-all contests, a premise PR rejects.
