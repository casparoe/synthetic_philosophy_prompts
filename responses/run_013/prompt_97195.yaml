  Okay, I need to tackle this philosophy professor's request. They want me to adjudicate a dispute between a scientific realist and a semantic anti-realist about Fitch's paradox. Let me start by recalling what Fitch's paradox is. From what I remember, it's an argument that seems to show that if all truths are knowable, then all truths are known. That leads to a contradiction because there are unknown truths, like that grain of sand example.

  The professor laid out the exchange. The realist argues that Fitch's paradox is a knockout against anti-realism because it shows a contradiction in the knowability principle. The anti-realist counters by saying the paradox only arises for self-defeating propositions and that the principle should be restricted to "in principle verifiable" propositions. The realist calls that ad hoc, while the anti-realist insists it's principled.

  First, I need to break down the logical structure of Fitch's argument. The key steps are: assume there's an unknown truth, p. Then consider the conjunction "p and nobody knows p". If all truths are knowable, this conjunction should be knowable. But if someone knew it, they'd know both parts. Knowing the second part ("nobody knows p") would imply that they don't know p, but since they know p (from the first part), that's a contradiction. So the knowability principle must be false.

  The assumptions here are factivity of knowledge (if you know something, it's true), closure under conjunction (if you know A and B, you know each), and the modal idea that "knowable" means it's possible to know.

  Now, the anti-realist's defense is to restrict the knowability principle to propositions that don't refer to knowledge themselves. They argue that "p and nobody knows p" is self-defeating because verifying it makes it false. So the principle should only apply to propositions that are stable under verification.

  The realist's objection is that this restriction is ad hoc. If anti-realists define "in principle verifiable" to exclude such cases, they're just avoiding counterexamples. Plus, it seems to allow unknowable truths, which undermines the anti-realist view that truth is tied to knowability.

  The anti-realist responds by saying the restriction is principled because it's based on the content of the proposition, not an arbitrary move. They can still maintain that non-self-undermining truths are knowable, and Fitch helps refine the principle.

  I need to evaluate whose points land. The realist is right that Fitch exposes a problem for a naive formulation of the knowability principle. The anti-realist's restriction might seem ad hoc if not properly justified. But if they can provide a principled reason—like excluding propositions whose verification conditions conflict with their content—that could be valid. For example, in intuitionistic logic or verificationist semantics, such restrictions make sense.

  However, the realist has a point that allowing some unknowable truths moves towards realism. If anti-realism defines truth as what can be known, but then admits truths that can't be known, that's inconsistent. The anti-realist clarifies that the unknowability here is due to the proposition's structure, not a gap in human knowledge. They might argue that "there are unknown truths" is knowable, even if specific instances like "this grain wasn't counted" as a conjunction aren't.

  The crux might be whether the restriction is principled or ad hoc. If anti-realism is tied to a semantic theory like Dummett's, where meaning is based on verification conditions, then excluding self-refuting propositions is natural. But the realist might counter that this still concedes unknowable truths, which conflicts with the epistemic conception of truth.

  Another angle is the modal logic aspect. Fitch's proof uses principles like the distributivity of possibility over conjunction, which might be contested. But both parties here seem to accept the logical structure.

  Also, the anti-realist's distinction between knowing a general truth versus a specific conjunction is important. Knowing that there are unknown truths doesn't require knowing a specific one, avoiding the paradox for that general statement.

  Who is more right? I think the anti-realist has a stronger case because their restriction isn't arbitrary; it's based on the nature of verification. The realist's objection that this leads to unknowable truths misses that those truths are only unknowable due to their self-referential nature, not because of limitations in principle. So, the anti-realist position can be refined without collapsing into realism.

  The single crux is whether the restriction to non-self-defeating propositions is principled. Since it's based on the content of propositions and their verification conditions, it's not ad hoc. Therefore, the anti-realist is more right, and the crux is that the restriction is principled based on the logic of verification.
