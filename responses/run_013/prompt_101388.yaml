answer: |-
  Here are 10 core questions designed to press the doxastic expressivism view on Moore's Paradox, incorporating your specific requests and focusing on conceptual pressure points. Each follow-up is anticipated based on common expressivist responses.

  **Core Questions:**

  1.  **The Expressivist Core:** Could you clarify *exactly* what kind of "practical stance" one is trying, but failing, to express with a Moorean sentence like "It's raining but I don't believe it"? What specific action, commitment, or attitude is being simultaneously undertaken and undermined? (Sets the stage)
  2.  **Contrast with Belief Contradiction:** Many find the absurdity arises because asserting "P" expresses a belief that P, while asserting "I don't believe P" expresses the absence of that belief – a direct conflict in the speaker's professed state of mind. Why is appealing to this conflict in *belief* less satisfactory, or even misleading, than your expressivist story about incoherent *expression*? (Targets the core rivalry)
  3.  **Omissive vs. Commissive:** Your view emphasizes a failure of coherent expression. How does this account explain the difference in *felt absurdity* between the omissive ("P but I don't believe P") and the commissive ("P but I believe not-P")? Does the expressivist story capture why the commissive often feels *stronger*, perhaps even more blatantly contradictory? (Your requested topic)
      *   *Likely Response:* The commissive involves expressing contradictory beliefs (belief in P and belief in not-P) simultaneously, making the expressive clash more direct/violent.
      *   **Follow-Up:** If the commissive involves expressing contradictory *beliefs*, doesn't this explanation start to sound very similar to the belief-contradiction view you reject? How does focusing solely on the *expression* of stance, not the underlying states, genuinely avoid appealing to conflicting belief-states here? (Presses the coherence of avoiding belief-states)
  4.  **The Knowledge Variant:** How does doxastic expressivism handle Moorean sentences involving knowledge, like "It's raining but I don't *know* it's raining"? Is the absurdity here the same kind of expressive failure? If so, what stance does asserting "I know P" express that's incompatible with disavowing knowledge in the same breath? (Your requested topic)
      *   *Likely Response:* Asserting "I know P" expresses a heightened commitment or guarantee beyond mere belief, which is directly undermined by the disavowal of knowledge.
      *   **Follow-Up:** If asserting "I know P" expresses a stronger guarantee than just "P", why isn't the absurdity in "P but I don't know P" simply explained by the fact that sincerely asserting *just* "P" already *implies* that the speaker takes themselves to know P? Doesn't this suggest the problem *is* rooted in the norms of assertion, rather than a special feature of *expressing belief*? (Links to assertion concern)
  5.  **Assertion vs. Belief:** Critics might argue your view effectively explains the *assertoric* absurdity of uttering Moorean sentences, but doesn't necessarily tell us anything special about *belief itself*. How does doxastic expressivism show that the paradox reveals a deep feature of *believing*, rather than just a peculiar rule about what we can *coherently say* when expressing our beliefs? (Your requested topic)
      *   *Likely Response:* The expression *is* constitutive of the stance; the inability to coherently express it reveals an incoherence *in the attitude itself* when viewed from the first-person present perspective. Belief isn't just an inner state; it's tied to its potential expression.
      *   **Follow-Up:** But if the absurdity *only* manifests when trying to *assert* the conjunction, and disappears when merely *thinking* it or writing it in a diary, doesn't this strongly suggest the problem is fundamentally about the *public act* of assertion and its social norms, not about an incoherence inherent in the belief *state*? (Challenges the necessity of tying it to belief)
  6.  **The Pressure Point: Past Tense/Third Person (Part 1 - Description):** A major challenge for many accounts is why the absurdity vanishes or weakens significantly in past-tense ("It *was* raining but I *didn't believe* it") or third-person ("It's raining but *she* doesn't believe it") variants. How does your expressivist account *explain* this difference? What changes about the "practical stance" being expressed (or failed to be expressed) in these cases? (Your key focus area)
  7.  **The Pressure Point: Past Tense/Third Person (Part 2 - Challenge):** If the expressivist story relies on the speaker's *current* act of commitment being simultaneously undermined *by that same speaker*, how does this avoid collapsing into explaining the absurdity *solely* as a feature of present-tense, first-person *assertion*? Doesn't the disappearance of absurdity in past/third-person cases show that the core issue *isn't* an incoherence in the *belief* (since the belief state described might well have existed), but strictly in the *present act of self-avowal*? (Deep press on the core claim)
  8.  **Scope of Expressivism:** Does your expressivist account apply *only* to belief, or is it meant to cover other propositional attitudes? For example, is "The cake is delicious but I don't *desire* it" similarly absurd? If not, what makes belief unique in generating this specific kind of expressive incoherence when combined with its own disavowal? (Tests boundaries)
  9.  **Falsifiability/Evidence:** What kind of observation, argument, or hypothetical scenario would you accept as genuine evidence *against* your doxastic expressivist account of Moore's paradox? What would convince you it's on the wrong track? (Your requested topic)
  10. **Broader Implications:** If doxastic expressivism is correct about Moore's paradox, what significant implications does this have for how we should understand the nature of belief, self-knowledge, or rationality more generally? Does it steer us away from certain traditional philosophical pictures of the mind? (Contextualizes the stakes)

  **Key Features of these Questions:**

  *   **Presses the Core:** Questions 1, 2, 5, and 7 directly challenge the distinctiveness and coherence of the expressivist view versus belief-contradiction or assertion-based accounts.
  *   **Addresses Your Specifics:** Questions 3 (w/ follow-up), 4 (w/ follow-up), 5 (w/ follow-up), and 9 explicitly cover your requested topics.
  *   **Focuses on the Crucial Asymmetry:** Questions 6 and 7 delve deep into the past/third-person challenge, identified as the sharpest pressure point.
  *   **Avoids Name-Dropping:** Focuses purely on concepts and arguments.
  *   **Accessible but Rigorous:** Uses clear language ("practical stance," "absurdity," "commitment," "disavowal," "incoherence") familiar to undergrads discussing the paradox, while targeting the philosophically significant tensions.
  *   **Dialectical Flow:** Questions build logically, anticipating responses and pushing further (especially the follow-ups).
  *   **No Softballs:** All questions aim at potential weaknesses or demand clarification of central tenets.

  Use these as a framework – feel free to adapt the wording based on the conversation's flow and the guest's specific phrasing of her view. Good luck with the interview!
