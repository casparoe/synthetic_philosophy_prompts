  - Knowledge variant: Must test if expressivism extends beyond belief to other attitudes. Probable follow-up would question whether knowledge-avowals function like belief-avowals.
  - Assertion vs. belief: Crucial to probe if her view reduces to speech-act theory. Anticipated follow-up would press on whether the absurdity originates in the act or the attitude.

