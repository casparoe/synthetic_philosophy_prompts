prompt: |-
  Ok, so I've got about 18 months of funded PhD time left (epistemology, some formal stuff) and a co-author who works in social epistemology, and I'm trying to decide where to actually dig in on the peer disagreement debate. Our shared motivation is institutional rather than abstract: we care about how something like an expert advisory panel, a forecasting outfit, or a scientific consensus process should handle internal disagreement, not just about the tidy two-philosophers-one-proposition case. So: what are the open questions in the concilliationism vs steadfastness fight that are most worth working on, and in what order would you put them? Defend the ordering -- which are upstream of which, which are tractable with the tools the field already has, which are popular but wouldn't change much downstream if they got settled, and what over the next year or two would move a question up or down.

  Three things I want you to fold in, because I suspect they're where the real action is and I don't see them getting alot of play:

  1. Nearly every case in the literature is two-party, one-shot, and about a proposition. Real institutions have many disagreeing parties, and if everyone gets equal weight then it looks like the view just tells you to drift toward the crowd's average. Does the two-party intuition survive aggregation, or does equal weighting a hundred peers collapse into defer to the mean, and if so what's left of the position?

  2. What's the evidential weight of disagreement you saw coming? If my model of you predicted your dissent before you gave it, is your dissent still evidence that I'm wrong, or have I already eaten it? Intuitively the surprise is doing the work -- but then how much disagreement counts for depends on my prior model of my peers, which seems like a strange place for the epistemology to bottom out.

  3. Group-vs-group disagreement: does it reduce to person-vs-person with the group's opinion plugged in, or does the fact that each side is itself an aggregate with its own internal disagreement change the peerhood and independence math?

  Also: is there a version of this debate that's about what to do rather than what to believe, and does anything in the belief case carry over cleanly to action, or does the practical case need its own treatment? I'd rather come out of this with a defended agenda than a reading list.
reasoning: |-
  Okay, the user is a PhD student in epistemology with about 18 months left. They're working with a co-author in social epistemology, focusing on institutional applications like expert panels or scientific consensus processes. Their main goal is to identify open questions in the peer disagreement debate that are worth tackling, especially considering three specific issues they've noticed aren't getting enough attention: multi-party aggregation, anticipated disagreement, and group-vs-group dynamics. They also want to know if there's a version of the debate focused on action rather than belief.

  First, I need to unpack their three points. For the first one, moving from two-party to multi-party contexts. The literature mainly deals with two individuals disagreeing, but real institutions involve many experts. If everyone's weighted equally, does that just lead to averaging? That could undermine the original intuitions of peer disagreement. They're probably worried that the standard models don't scale, leading to impractical or trivial outcomes.

  Second, anticipated disagreement. If you predict someone's dissent, does it still count as evidence against your view? The surprise factor seems crucial here. If disagreement loses its evidential weight when expected, then the epistemology becomes dependent on personal priors about peers, which feels subjective. This might tie into how experts model each other in ongoing collaborations.

  Third, group-vs-group dynamics. When two groups disagree, each with internal dissent, does treating each group as a single peer work? The independence of opinions within groups could affect the math. For example, if a group has diverse opinions, their aggregated position might be more reliable, but standard models might not account for that.

  They also mention the action-belief gap. Most debates focus on what to believe, but institutions need actionable decisions. How do belief-centric conclusions translate into practical choices? This is crucial for their institutional focus.

  The user's deeper needs might include wanting to make a significant academic contribution within their timeframe. They need tractable problems that leverage their formal skills and co-author's expertise in social epistemology. They might also want to ensure their work has real-world impact, hence the emphasis on institutions. Unspoken could be concerns about career positioning—publishing in relevant journals, establishing a niche, or practical applications post-PhD.

  Prioritizing their questions: Aggregation (point 1) is foundational. Resolving how multiple peers affect disagreement could answer whether steadfastness/conciliation holds in groups. This is upstream because it affects how we model other issues. Plus, formal tools like Bayesian aggregation exist, making it tractable. Tackling this first sets the stage for group-vs-group issues.

  Anticipated disagreement (point 2) is more complex. It involves modeling priors and updating beliefs, which might require psychological insights or simulations. If they have 18 months, this might be phase two after establishing aggregation. Solving this could refine how institutions handle predictable dissent, like in recurring expert panels.

  Group-vs-group (point 3) builds on both previous points. Once multi-party and anticipation are addressed, applying those to groups makes sense. This has high impact for real-world scenarios like policy debates between scientific committees but is methodologically heavier.

  The action-oriented angle should be integrated throughout. After each belief-centric analysis, they should explore practical implications. For instance, how aggregated beliefs inform decisions in panels or forecasting. This ensures their work meets institutional needs.

  Ordering: Start with aggregation (most tractable, foundational), then anticipated disagreement (moderate tractability), then group dynamics (complex, builds on prior work). Tackling the action question alongside each step ensures relevance.

  Potential pitfalls: They might underestimate the formal complexity of group models or the challenges in operationalizing anticipated disagreement. Collaborating with their co-author could mitigate this. Also, ensuring access to case studies (like IPCC reports or Delphi methods) would ground their theoretical work.

  In summary, the user needs a clear, actionable research agenda that addresses gaps in the literature, uses their strengths, and has institutional relevance. Prioritizing aggregation first provides quick wins, while subsequent phases deepen the impact. Connecting belief to action throughout will make their contribution stand out in social epistemology.
answer: |-
  Here’s a prioritized research agenda for your 18-month sprint, designed to maximize impact on institutional disagreement while leveraging your formal/social-epistemology combo. The ordering balances **tractability**, **upstream influence**, and **institutional relevance**, folding in your three key angles. I’ll defend the sequence and flag how each piece interacts with your action-orientation.

  ### Core Prioritization (With Rationale)
  1.  **The Aggregation Problem (Your Point #1)**  
      *   **Question:** *When multiple peers disagree, does equal weighting collapse into deference to the mean, undermining core conciliatory/steadfast intuitions? If so, what replaces "peer equality" in institutional aggregation?*
      *   **Why First?** **Most Upstream & Foundational.** The 2-party case is the bedrock of the literature. If multi-peer aggregation fundamentally breaks conciliationism (e.g., leading trivially to mean deference regardless of individual quality/independence) or steadfastness (e.g., making "sticking to your guns" indefensible against a crowd), then *all* subsequent work on institutional disagreement rests on shaky ground. **Tractable:** Formal tools (Bayesian aggregation, Condorcet/jury theorems, network models) exist and are ready for adaptation. Your formal skills shine here. **Downstream Impact:** HUGE. Settling this dictates whether institutions *must* move beyond simple averaging or peer-counting (e.g., weighting by expertise diversity, track record, independence).
      *   **Action Angle:** Directly links to *decision procedures* for panels/forecasts. If simple conciliation collapses, what aggregation *algorithm* should an institution use to translate diverse beliefs into a collective output (belief or recommendation)? This bridges belief→action.

  2.  **Group-vs-Group Disagreement (Your Point #3)**  
      *   **Question:** *When two *groups* (e.g., advisory panels, scientific factions) disagree, does treating each group as a monolithic "peer" work? How does internal dissent *within* each group affect the epistemic weight of their collective position vis-à-vis the other group?*
      *   **Why Second?** **Builds on #1 & Highly Relevant.** Institutions often deal with group positions (IPCC reports, NIH consensus statements, rival labs). **Upstream/Logical Flow:** You need models from #1 to analyze the *internal* structure of each group. The key insight: **Internal dissent likely *enhances* the reliability of a group's *aggregated* position** (it signals independence, reduces groupthink, acts like repeated sampling). Conversely, monolithic agreement *within* a group might *weaken* its claim against another group (if driven by conformity). **Tractable:** Extend formal models from #1 (e.g., modeling groups as networks of agents with internal agreement/disagreement, then aggregating groups). Social epistemology (e.g., models of deliberation, polarization) is crucial here. **Downstream Impact:** Critical for understanding scientific controversies, policy disputes. Challenges naive "sides" framing.
      *   **Action Angle:** How should an institution (e.g., a funding body, regulator) respond to conflicting *group* recommendations? Should it demand transparency about internal dissent? Does a dissenting minority within a "consensus" group weaken the consensus claim? Directly informs institutional process design.

  3.  **Anticipated Disagreement (Your Point #2)**  
      *   **Question:** *Does the evidential weight of peer disagreement diminish (or vanish) if the dissenter's position was predicted by your model of them? If "surprise" is key, how do beliefs about peer reliability/biases mediate disagreement's force?*
      *   **Why Third?** **Deepest & Potentially Most Transformative, but Methodologically Tricky.** This cuts to the heart of evidence and updating. If anticipated dissent is evidentially inert, it revolutionizes disagreement epistemology – evidence becomes contingent on *your prior beliefs about others*. **Tractable? Moderately.** Requires sophisticated Bayesian modeling (conditionalizing on predicted dissent) and/or agent-based simulations (agents with models of each other). Needs careful handling of "bootstrapping" concerns (could I make *any* dissent evidentially inert by predicting it?). Psychology of expectation/surprise might be relevant. **Downstream Impact:** Potentially massive but contingent on resolution. If surprise *is* crucial, institutions need ways to assess the *predictability* of dissent (tracking biases, incentives). If not, it simplifies. **Less Upstream:** Its significance depends partly on the structure established in #1 & #2.
      *   **Action Angle:** How should institutions *prepare for* or *elicit* disagreement? If predictable dissent is weak evidence, panels should actively seek *unexpected* critiques (diverse membership, red teams). If it's still strong evidence, focus shifts to calibration of prior expectations.

  4.  **The Action/Belief Gap**  
      *   **Question:** *How do conclusions about belief conciliation/steadfastness translate to institutional *action* (recommendations, policies, forecasts)? Does the practical context demand different principles (e.g., risk-aversion, urgency, legitimacy)?*
      *   **Why Last?** **Essential Capstone, Not Separate.** Don't treat this as a distinct question; **integrate it into #1-3**. Your institutional focus *demands* this. After analyzing the belief dynamics in #1-3, ask: "Given *this* epistemic situation, what should the institution *do*?" **Tractable:** Leverages decision theory (risk, utility), political philosophy (legitimacy, accountability), science & technology studies (expert legitimacy). **Downstream Impact:** The whole payoff for your project. Makes your work directly applicable.
      *   **Key Insight:** The map from belief to action is NOT clean. A panel might conciliate *beliefs* internally (moderate towards mean) but recommend *action* steadfastly (if risks are asymmetric). Or, internal dissent might lead to a steadfast belief *not* to act, or to recommend more research. **Formal Hook:** Use Bayesian decision theory or social choice theory to model how aggregated beliefs + values/risks → recommendations.

  ### Defense of Ordering & Tactics
  *   **Why Aggregation First?** It's the most direct assault on the core literature's limitation. Solving it provides the *framework* for #2 (groups are complex aggregates) and informs #3 (aggregation depends on priors about peers). You can likely produce a strong, formal paper quickly (6-8 months), establishing a foundation and demonstrating progress. This builds momentum.
  *   **Why Groups Before Anticipation?** Group dynamics (#2) are a more obvious and pressing institutional reality than sophisticated modeling of anticipated dissent (#3). #2 builds naturally on the aggregation mechanics of #1. #3 is conceptually deeper but riskier and potentially more time-consuming; tackle it once #1/#2 give you robust models and credibility.
  *   **Why Fold Action into Each Step?** Because "what to do" is your ultimate goal. Analyzing the belief dynamics in #1-3 *without* connecting to action would miss the institutional point. Frame each finding as: "This implies institution X should design process Y."
  *   **What Moves Questions Up/Down?**
      *   **UP:** New formal tools (e.g., advances in network epistemology, agent-based modeling of institutions); high-profile institutional failures/successes involving disagreement (e.g., pandemic policy debates, IPCC controversies); influential papers attacking the scalability of 2-party models.
      *   **DOWN:** If #1 reveals aggregation is *less* problematic than feared (e.g., mean deference is robustly justified in many cases), then #2/#3 might shift focus. If #3 proves intractably messy, focus energy on #1/#2/#4. Empirical work showing peer models in institutions are too crude for #3 to matter soon.

  ### Your Unique Edge & Institutional Focus
  *   **Formal + Social:** Use formal models to clarify *structure* (aggregation, dependence) and social epistemology to handle *content* (expertise diversity, bias, group dynamics, legitimacy). Your co-author is key for the latter.
  *   **Target Artifacts:** Analyze real-world aggregation methods (Delphi technique, prediction markets, IPCC "confidence levels", NICE guideline development). Don't just theorize; reverse-engineer and critique/propose improvements.
  *   **Beyond "Peer":** Institutions care about *expertise*, not abstract peerhood. Focus on *differential expertise* (how should a climate scientist weight an economist's dissent on an economic model?) and *independence* (a huge factor in aggregation, often ignored in 2-party cases).

  **Deliverable Goal:** Aim for **2-3 papers**:
  1.  **Paper 1 (Months 1-8):** *The Collapse of Conciliation? Multi-Peer Disagreement and the Limits of Equal Weighting* (Addressing #1 + Action implications).
  2.  **Paper 2 (Months 6-14):** *When Panels Clash: Group Disagreement, Internal Dissent, and Epistemic Authority* (Addressing #2, building on #1, integrating Action).
  3.  **Paper 3/Chapter (Months 10-18):** *Predicting Disagreement: Does Foreseen Dissent Undermine Evidence?* (Addressing #3) OR a synthesis piece *From Disagreement to Decision: An Epistemology for Institutional Judgment* (Integrating #1-#4, focusing heavily on Action).

  This sequence leverages your strengths, tackles the most glaring gaps in the literature relevant to institutions, progresses from tractable foundations to deeper challenges, and consistently keeps the action-orientation central. Go crack the aggregation nut first – it’s the key to the rest.
