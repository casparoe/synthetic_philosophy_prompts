answer: |-
  **Joke**  
  The clerk at the lost-property office eyed the dishevelled man clutching a lead rope. "Lost something, sir?"  
  "Yes! My horse. Brown, about sixteen hands, answers to 'Biscuit'."  
  The clerk brightened. "Ah! We've a brown horse found near Hampstead Heath this morning!" He gestured to the back paddock.  
  The man sagged. "No, mine's white. Pure white."  
  "Ah," said the clerk, consulting his ledger. "Under 'Horse, White', we have nothing. But under 'White Horse'... we *do* have one. Found near Highgate."  
  The man stared. "That’s... that’s the same thing!"  
  "Not at all," replied the clerk primly. "If you'd asked for a horse, brown would have sufficed. You asked for a *white* horse. Brown does *not* suffice. Therefore, a white horse is not a horse. No white horses under 'H'."  
  The man blinked. "...So I can't claim it?"  
  "Of course you can," sighed the clerk. "Just fill out Form W-H."  
  "White-Horse?"  
  "No," said the clerk, sliding the paper across the counter. "**Not-Horse**."  

  **Explanation**  
  This turns on the "two-requests move": the argument that asking for "a horse" accepts multiple colours, while asking for "a white horse" does not, proving the terms aren't interchangeable. The clerk applies this logic to filing, creating bureaucratic absurdity.  

  ---  

  **ALTERNATIVE (Fixed-Whiteness Move)**  
  The art conservator frowned at the faded statue. "Records say this was catalogued as 'White Horse'."  
  Her assistant nodded. "Right. Gongsun Long collection."  
  "But it's *grey* now," she protested. "The 'white' is gone. So this isn't a white horse."  
  "Exactly!" beamed the assistant. "**The whiteness isn't fixed. So technically, it's just... horse.**"  
  She glared at the speckled marble. "Then why does the label still say 'Not-Horse'?"  
  "*That*," he said, tapping the plaque, "**is fixed.**"  

  **Explanation**  
  This uses the dialogue's later concern about "whiteness" as a property: if the colour changes/is unfixed, does the composite name ("white horse") still apply? The statue's label ironically retains the *logical* designation ("not-horse") despite the physical change.
