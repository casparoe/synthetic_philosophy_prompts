answer: |-
  Below is a fully designed activity following your specifications. It uses poker chips for prediction rewards, index cards for sealed predictions, and pre-generated phenotype slips. The activity is structured to create experiential learning through three rounds of data collection and estimation, followed by a debrief linking the experience to key conceptual insights.

  ---

  ### **Activity: The Heritability Illusion**

  **Materials:**  
  - 20 genotype cards (integers 0-19, one per participant)  
  - 60 phenotype slips (pre-generated; 3 rounds × 20 participants × 1 slip with 5 measurements each)  
  - Index cards for predictions  
  - Poker chips (scoring tokens)  
  - Whiteboard for calculations  
  - Laptop with script to calculate squared correlation (Python/R/Excel)  

  **Setup (5 min):**  
  1. Assign each participant a unique genotype (0-19) via index cards. Emphasize: **"This is your fixed genetic code. It never changes."**  
  2. Explain the core mechanic:  
     - Each round, you’ll receive a slip with **5 phenotype measurements** (e.g., height, test score, etc.).  
     - As a group, we’ll calculate **heritability** as the squared correlation (r²) between genotype and phenotype across all measurements.  
     - Before each new round, you’ll predict how the estimate will change and why. Correct directional predictions earn poker chips.  
  3. Clarify: **"You won’t see the environmental conditions—only the genetic and phenotypic data."**  

  ---

  ### **Round 1: Baseline Additive Model (25 min)**  
  **Generative Rule (Secret):**  
  `Phenotype = Genotype + Environment`  
  - Environment: Random noise ~ Normal(μ=0, σ=5.77) (variance equal to genetic variance).  
  - *Target heritability:* ~0.5 (50% of variation due to genes).  

  **Flow:**  
  1. Hand out phenotype slips (5 measurements per person).  
     - *Example slip:* "Phenotype measurements: 3.2, -1.8, 7.4, 5.1, 0.9"  
  2. Collect all data on the whiteboard (or input into script). Calculate r².  
     - *Expected result:* r² ≈ 0.4–0.6 (due to sample noise; accept any value 0.3–0.7).  
  3. **Reveal Rule 1:**  
     - *"Traits were additive: Genes + Random Environment. True heritability = 50%."*  
     - Discuss: *"Why wasn’t it exactly 50%? Small samples have noise."*  

  ---

  ### **Round 2: Constant Environment (25 min)**  
  **Generative Rule (Secret):**  
  `Phenotype = Genotype + 10` (Environment is constant).  
  - *Target heritability:* 1.0 (100% of variation due to genes).  

  **Flow:**  
  1. **Prediction:** Participants write sealed predictions: *"Will heritability increase, decrease, or stay the same? Why?"*  
  2. Hand out new phenotype slips (e.g., "Phenotype: 12, 12, 12, 12, 12" for genotype 2).  
  3. Calculate r² (will be exactly 1.0).  
  4. **Reveal Rule 2:**  
     - *"Environment was fixed. All variation came from genes. True heritability = 100%."*  
  5. Award poker chips to those who predicted an **increase**.  
     - **Key Q:** *"Did anyone’s genes change? Did genes suddenly matter more? Or did the environment stop varying?"*  

  ---

  ### **Round 3: Gene-Environment Correlation (25 min)**  
  **Generative Rule (Secret):**  
  `Phenotype = Environment` (No genetic effect),  
  `Environment = Genotype + Noise` (Noise ~ Normal(μ=0, σ=3.77)).  
  - *Target heritability:* ~0.7 (70% from non-causal correlation).  

  **Flow:**  
  1. **Prediction:** Predict how heritability will change from Round 2.  
  2. Hand out phenotype slips (e.g., "Phenotype: 1.8, 3.2, -0.5, 2.1, 0.3" for genotype 0).  
  3. Calculate r² (will be ~0.6–0.8).  
  4. **Reveal Rule 3:**  
     - *"Phenotype was 100% environmental. But environment was correlated with genotype. True genetic heritability = 0%."*  
  5. Award chips to those who predicted a **decrease** (since 0.7 < 1.0).  
     - **Key Q:** *"How did we get high heritability with zero genetic effect? What does this reveal about our estimator?"*  

  ---

  ### **Debrief (10 min)**  
  **Link Activity to Concepts:**  
  1. **Heritability is population- and context-specific:**  
     - *"Same genes (Round 1 vs. 2 vs. 3), same estimator, but different heritability. Why?"*  
     - → Heritability measures **proportion of variation** due to genetic differences **in a specific environment at a specific time**.  

  2. **High heritability ≠ genetic determinism:**  
     - *Demo:* Re-run Round 2 with `Phenotype = Genotype + 20` (instead of +10).  
     - → Mean phenotype shifts from ~19.5 to 29.5, but r² remains 1.0.  
     - → "Environment changed everyone’s trait level, but heritability didn’t budge. Heritability says nothing about **absolute trait values** or **what happens if you change the environment**."  

  3. **Gene-environment correlation (rGE) inflates estimates:**  
     - *"Round 3 showed a high estimate with zero genetic causation. Why?"*  
     - → Hidden correlation between genes and environment (e.g., wealthier parents provide genes and education).  

  4. **The estimator’s blind spot:**  
     - *"We calculated r² without knowing environments. This mimics real studies that ignore rGE or environmental shifts."*  

  **Final Challenge:**  
  - *"In one sentence: What does heritability license, and what does it not?"*  
    - **License:** "How much genetic differences explain trait variation **in this population right now**."  
    - **Not:** "Genetic destiny of individuals," "fixity of traits," or "causes of differences between groups."  
  - *"What’s the one thing you’d need to interpret heritability?"*  
    → **"How environments are distributed and correlated with genes."**  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Misinterpreting "50% heritable":**  
     - *"Half my trait is genetic!"* → Debrief emphasizes: **Heritability describes variation across a group, not an individual’s trait composition.**  

  2. **Confusing high heritability with genetic importance:**  
     - *"In Round 2, genes became more important!"* → Clarify: **Genes didn’t change—environment stopped varying. Environment still causally necessary for the trait!**  

  3. **Dismissing Round 3 as a "trick":**  
     - *"This would never happen!"* → Counter: **"Gene-environment correlation is everywhere. E.g., genetic variants linked to education also correlate with parenting styles or neighborhood choice."**  

  4. **Noisy estimates (small samples):**  
     - **Solution:** Use 5 measurements per person (100 data points). If results are noisy, show a **simulated population of 1,000** alongside live data to highlight the pattern.  

  5. **Group differences derailment:**  
     - If raised: **"Heritability within groups ≠ cause of differences between groups. Two groups with high heritability for height could differ due to nutrition. Our activity only applies to one population."**  
     - Shut down derailment: **"This is a deep topic, but today’s scope is understanding what heritability means within a group."**  

  ---

  ### **What the Activity CANNOT Teach (Closing Note)**  
  This activity is a conceptual primer, not a comprehensive toolkit. You’ll need to clarify:  
  - **Real-world estimation:** Heritability uses twin/adoption studies or SNPs (not direct genotype-phenotype correlation).  
  - **Limitations:** Assumes no gene-gene/epistasis or gene-environment interaction (G×E). Ignores measurement error.  
  - **Causality ≠ heritability:** A high estimate doesn’t prove genes cause a trait (confounding by rGE).  
  - **Continuous traits:** Real traits involve polygenic scores, not integers.  
  - **No empirical answers:** This calibrates intuition but cannot resolve debates about real traits (e.g., IQ).  

  **Final Emphasis:**  
  *"Heritability is a population statistic, not a verdict on nature vs. nurture. It answers one narrow question: ‘In this group, right now, how much do genetic differences contribute to trait differences?’ Anything else is overreach."*  

  ---

  **Pre-Generated Data Script Example (Python):**  
  ```python
  import numpy as np
  import pandas as pd

  np.random.seed(42)  # For reproducibility
  genotypes = np.repeat(range(20), 5)  # 5 measurements/person

  # Round 1: Additive (target h²=0.5)
  env1 = np.random.normal(0, 5.77, 100)  # σ² = 33.25 ≈ var(genotypes)
  pheno1 = genotypes + env1

  # Round 2: Constant environment (h²=1.0)
  pheno2 = genotypes + 10

  # Round 3: Environment causes trait, correlates with genes (target h²=0.7)
  env3 = np.random.normal(0, 3.77, 100)  # σ² = 14.25 → r² ≈ 0.7
  pheno3 = genotypes + env3  # No genetic effect, but rGE

  # Print slips for participants
  for i in range(20):
      print(f"Genotype {i} Round 1: {np.round(pheno1[i*5:(i+1)*5], 2)}")
      print(f"Genotype {i} Round 2: {np.round(pheno2[i*5:(i+1)*5], 2)}")
      print(f"Genotype {i} Round 3: {np.round(pheno3[i*5:(i+1)*5], 2)}")
  ```

  **Running Tips:**  
  - Use Excel/Google Sheets for live r² calculations (formula: `=(CORREL(genotypes, phenotypes))^2`).  
  - Emphasize participation: "Your predictions force you to commit—this is where learning happens!"  
  - For noisy data: "With small samples, estimates wobble. Focus on the pattern across rounds."  

  This design forces the group to confront misconceptions experientially, using prediction, reversal, and debrief to cement insights. The poker chips and secrecy add stakes without complexity.
