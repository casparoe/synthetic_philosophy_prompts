prompt: |-
  I'm running a small discussion evening for about eight friends, none of us has any philosophy training, and this month I want to do Anscombe's objection to Truman over the atomic bombings, the row about the honorary degree and her saying he was a murderer. Don't explain the position to me, plan how I should put it across: what has to already be in their heads before the objection sounds like a thought rather than an insult, what order the pieces have to go in, and what one example should carry the whole evening. My idea for the carrying example is a besieged city, bombing the enemy's fuel dump right next to a civilian district where you can see the deaths coming and don't want them, versus bombing the civilians on purpose to force a surrender, plus the ugly middle case where you bomb the dump precisely because it sits next to the civilians and you're hoping the deaths will do some work for you, and I genuinely can't tell if that example is the right one or if it will quietly teach them the wrong thing, so tell me what it has to have and what it can't have, and what to use instead if it's no good. I think they'll walk in assuming that not wanting the civilians dead is the same as not intending it, that Anscombe must be some sort of pacifist, and that her real objection is really about the numbers or about whether the bomb actually ended the war, and I don't know at which point in the evening to head each of those off before it hardens. Also give me one question to ask at the end that would show whether they've actually got the distinction or have just gone along with me, and tell me what I should deliberately skip and admit I'm skipping at this level. Can you write it as continuous prose, no headings or bullet points or bold or tables, just the way you'd write it in an email.
reasoning: |-
  Okay, let me approach this carefully. The user is organizing a philosophy discussion for friends without formal training, focusing on Anscombe's objection to Truman regarding the atomic bombings. They need a clear roadmap to present this complex ethical argument effectively. 

  First, I need to recognize their preparation level. The user has already identified common misconceptions their friends might bring: confusing intention with desire, assuming Anscombe was a pacifist, and focusing on utilitarian calculations. That's insightful. Their proposed siege example shows they grasp the core tension but worry about unintended teaching pitfalls.

  The key challenge is making the intention/foresight distinction tangible without philosophy jargon. I recall Anscombe's core argument hinges on moral responsibility being tied to what we intentionally choose, not just what we foresee. The siege example they proposed actually works well if framed correctly - it needs to emphasize that strategic benefit from foreseen deaths shifts moral culpability, even if those deaths aren't desired.

  For structure, I'm considering starting with the Truman controversy to hook interest, then unpacking the common assumptions. The "ugly middle case" in their siege example is perfect for showing how motivation contaminates action. We must avoid letting the discussion drift into historical debates about the bomb's efficacy - that's a rabbit hole. 

  The carry-through question at the end should force application: "If a commander admits civilian deaths help his goal but claims he'd prefer they didn't occur, is he intending them?" That exposes whether they grasp intention as operational choice rather than emotional state.

  Notably, the user is wisely aware of their own limits - they want to skip secondary debates and admit where simplification occurs. That humility will serve the discussion well. I'll emphasize framing this as exploring a lens rather than preaching conclusions.

  The siege example stays, but needs two safeguards: 1) clarify that unintended collateral damage isn't the focus 2) stress that the "middle case" turns foresight into functional intention. Alternative examples like terror bombing vs precision strikes might distract from the cognitive shift we're after.

  Finally, I should acknowledge their thoughtful preparation - noticing those preconceptions shows they're already halfway to facilitating well. The tone should be supportive: they've got the right instincts about where the traps lie.
answer: |-
  Here's how I'd approach your evening, structured as requested:

  Start with the raw controversy itself to grab attention: Oxford nearly gave Truman an honorary degree in 1956, and Elizabeth Anscombe, a philosopher and devout Catholic, fiercely objected, publicly calling him a murderer for authorizing the bombing of Hiroshima and Nagasaki. Frame the initial reaction most people would have: this seems shockingly extreme, even insulting. Truman ended a brutal war, saved countless Allied lives (including maybe their own grandparents), and probably didn't *want* to kill civilians – he likely saw it as a terrible necessity. Acknowledge that your friends probably walk in feeling this way. The puzzle is: why would a brilliant philosopher make such a seemingly intemperate accusation, and what serious argument could possibly underpin it? Her objection wasn’t primarily about pacifism (she wasn't an absolute pacifist), nor was it fundamentally a historical argument about whether the bombs *actually* shortened the war or whether the casualty estimates were justified (though those matter contextually). Her core objection cuts deeper, into the structure of moral reasoning itself.

  Before Anscombe's point can land as philosophy rather than polemic, your friends need a shared foothold in one basic idea: that *why* we do something – our actual intention in acting – matters morally, distinct from the consequences we merely foresee or the unpleasant feelings we experience. They likely intuitively grasp this in simpler cases. Ask them: If someone donates to charity purely for a tax break, versus someone who genuinely wants to help the poor (even if they also get the break), does the difference in intention affect the moral quality of the act, even if the money helps either way? Most will say yes. Or: If a surgeon performs a life-saving but brutal operation, intending only to heal, versus someone inflicting identical wounds intending to torture, is there a moral difference? Again, yes. This separates the *goal* or *purpose* of the act from the *side-effects* or *consequences*. Anscombe applies this distinction rigorously to wartime killing. The critical shift is realizing that "I didn't *want* those civilians to die" isn't the same as "I didn't *intend* their deaths as part of my chosen action." Desire is a feeling; intention is about what your action is designed to achieve.

  Your siege city example is actually very good for illuminating this distinction, *if* handled precisely. It has the necessary components: a military target, foreseen civilian deaths, and crucially, a shift in the *relationship* between the agent and those deaths. **What it must have:** A clear link between the bombing and the deaths (they are *directly* caused, not remote). Foreseeability (the deaths are known, not accidental). Most importantly, a variation in *why* the deaths are *chosen* or *accepted* within the plan. **What it cannot have:** Ambiguity about the causal chain or the agent's knowledge. Don't let it become a debate about tactics or probability – keep focused on the agent's reasoning. **How to use it:** First, describe Case 1: Bombing the enemy fuel dump knowing civilians nearby *will* die, but the deaths are genuinely unwanted, a terrible side-effect; the dump's destruction is the goal, and the deaths, while foreseen, play no role in the plan's success. This is the classic "double effect" scenario (though avoid the term). Most people find this reluctantly permissible. Then, describe Case 2: Bombing the civilians themselves to terrorize the enemy into surrender. The deaths *are* the intended means to the goal. Most agree this is murderous. The critical Case 3 (your "ugly middle"): Bombing the fuel dump *precisely because* it is next to the civilians, *counting on* their deaths to demoralize the enemy and hasten surrender, even while saying "I wish they weren't there." Here, the foreseen deaths are not just a side-effect; they are *leveraged* as part of the plan's mechanism. Anscombe argues this *is* intending the deaths. The deaths are no longer merely *foreseen* but *functional* to the chosen strategy. This is where the distinction crystallizes. The bomber in Case 3 might *feel* bad, might genuinely *wish* the civilians weren't there, but by structuring the action to *use* their deaths, they intend them in the morally relevant sense. Truman’s critics (like Anscombe) argue the atomic bombings fit Case 3: the mass civilian deaths weren't just a by-product of destroying military targets; they were calculated to break Japan's will through shock and terror. Hence, intending mass murder.

  Head off the misconceptions early and explicitly. When introducing the controversy, *immediately* state: "Anscombe's core argument wasn't that war is always wrong (she wasn't a pacifist), nor was it primarily a numbers game about whether more or fewer died overall (though that matters contextually), nor was it only a historical debate about whether the bomb was *necessary* to end the war (though she likely thought it wasn't). Her fundamental point was about the *kind of choice* Truman made: one that intentionally used the mass killing of civilians as a weapon." Reiterate this when presenting the siege example: "The difference between Case 1 and Case 3 isn't about how many die, or whether it shortens the siege, but about *what the commander is deliberately choosing to do* with those foreseeable deaths."

  For your revealing end question, pose this: **"Imagine a military commander who orders an attack on a target knowing many civilians will definitely die nearby. He insists he 'doesn't want them to die' and 'regrets the necessity,' but then admits under questioning that he specifically chose *this* target (over a slightly less effective but safer one) *because* the civilian carnage would demoralize the enemy and potentially shorten the conflict. Has he intended the civilian deaths, according to Anscombe's distinction? Why or why not?"** Their answer will show if they grasp that intention resides in the functional role of the deaths in the *chosen plan*, overriding the accompanying feelings or stated regrets.

  Deliberately skip the dense metaphysics of intention (e.g., what constitutes an "act" or "intention" at the deepest philosophical level) and the full complexities of Just War Theory. Admit this upfront: "We're focusing on one powerful lens Anscombe applied – the intention/foresight distinction – not building a complete ethical system for war. We're also simplifying the messy reality of historical decision-making to isolate this philosophical point." Avoid deep dives into WWII history or alternative strategies; acknowledge they exist but aren't the core of *this* argument. Also skip Anscombe's specific theological context (Natural Law); present the distinction as a rational moral tool. This keeps it accessible and focused on the transformative idea: that *how* we weave foreseen evil into our plans fundamentally changes the moral character of our actions, regardless of our wishes or the ultimate outcome. The goal isn't consensus on Truman, but grasping why Anscombe thought "murderer" was a precise philosophical accusation, not just an insult.

  This approach uses the inherent drama of the controversy, builds from intuitive moral distinctions, leverages your strong siege example carefully, pre-empts key misunderstandings, provides a diagnostic end question, and explicitly bounds the discussion to make it manageable and illuminating for your group. Good luck!
