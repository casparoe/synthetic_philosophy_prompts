  I've been teaching the sperm-and-egg case for years and I still can't settle what I actually believe. My credence that I couldnt have originated from a different sperm and egg -- that my origin is essential to me -- is about 0.65; a collegue down the hall is at 0.2 and thinks the whole intuition is just an artifact of how we use names. Give me your own number, but mainly give me the decomposition: how much rides on whether the modal intuition ('that wouldn't have been me') is trustworthy evidence in the first place; how much on the fact that sperm and eggs aren't qualitatively distinguishable from one another, which makes it hard to see what's supposed to be doing the essentializing work beyond bare thisness; how much on whether counterpart theory or haecceitism is the right framework for de re modality; and how much on whether the necessity of origin, if it's true, is a metaphysical fact or a semantic one about rigid designation. A number and one line of justification for each, then how they combine. Then tell me which term the total is most sensitive to, and what would actually move it.
