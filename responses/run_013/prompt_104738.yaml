prompt: |-
  I run the science side of a small foundation that gives multi-year grants to research groups, and I keep having the same fight with my board. A group's project stops producing anything genuinely new and just keeps patching itself -- every time a result comes back negative they bolt on another assumption and carry on -- and the board wants to know how we decide whether that's dogged persistence or a dead end. I know philosophy of science has a framework aimed right at this, the one about research programmes with a hard core you protect by policy and a belt of auxiliary assumptions you're allowed to revise, and a distinction between revisions that lead somewhere new and revisions that only save the theory from a counterexample. But I can't hand my board a philosophy book, and honestly half the useful content is in the fine distinctions that get lost when you wave at it in a meeting.

  So: turn that framework into a decision procedure we can actually run at a renewal meeting. Some constraints. The committee is eight people, about half are working scientists and half are donors with no technical background, so nothing can depend on reading the group's whole literature or on judging the theory's ultimate truth -- we can't settle whether they're right, only whether the programme is still going somewhere. We get one 90-minute slot per renewal, we have the group's own outputs plus two external letters, and the chair has to sign off, so I need a place in the procedure where the answer is genuinely a call for the chair and not a fact we can look up. Give me the questions to ask, in order, what counts as a sufficient answer to each one, where the procedure stops with a no, and where it hands the decision to a person because it's turned into a values question about risk appetite rather than a question about the science. And please keep what the framework actually says -- I don't want a generic innovation checklist wearing its clothes.

  Then run the procedure on three cases so I can see it work. One: a materials group that staked out a specific, falsifiable prediction a few years back and a completely separate lab has now confirmed it, though nothing else about their core picture has moved. Two: an immunology lab that's our flagship grant and whose PI is a friend of the foundation -- they've had four failed predictions in a row and each time the fix is a new auxiliary assumption that only ever gets tested by them. Three: a young programme that hasn't had time to make a novel prediction yet, where I honestly can't tell whether we're looking at a dead end or just an early stage. At least one of these should come out as a no that I won't like, and I want you to say so plainly. Also tell me where the procedure can't decide and is just dressing a judgment call up as a step, and what it can't do at all -- in particular, someone on my board will always say that defending a core against awkward evidence is just normal science and nothing to worry about, so tell me what that objection gets right and where the procedure should still push back.
reasoning: |-
  Okay, let me tackle this user's problem. They run a science foundation and need a practical decision procedure based on Lakatos's research programmes framework. The board struggles to distinguish between persistent research and dead ends. The user wants a clear, step-by-step process usable in 90-minute meetings with both scientists and non-scientists.

  First, I recall Lakatos's core concepts: hard core (untouchable assumptions), protective belt (adjustable auxiliaries), progressive problemshifts (lead to new predictions), degenerative problemshifts (only fix past failures). The challenge is translating philosophy into actionable questions without technical jargon.

  Considering the constraints: mixed committee, limited time, reliance on group outputs and two external letters. The procedure must flag when a program stops being productive, not judge ultimate truth. The chair needs a clear decision point based on risk appetite.

  I'll structure a five-step process:
  1. Core Integrity: Verify the hard core remains unchanged. If modified, automatic red flag.
  2. Prediction Record: Classify predictions as novel or defensive. Track ratios.
  3. Knowledge Growth: Assess if auxiliary changes produced new findings.
  4. External Engagement: Check if other groups test/built on the theory.
  5. Chair's Judgment: Evaluate if degeneracy is temporary or fundamental.

  For the cases:
  Materials group: Core intact, novel prediction confirmed externally. Clear progressive shift - renew.
  Immunology lab: Core intact but all failed predictions had defensive fixes. No new findings despite resources. Degenerative - recommend termination.
  Young programme: Not enough data yet. Flag for short renewal with strict progress markers.

  Key insights:
  - The chair's judgment at Step 5 is intentionally subjective for risk decisions
  - The procedure exposes when defenses become circular
  - It can't force consensus but structures debate
  - Normal science objection is valid but must show growth potential

  I'll emphasize where philosophy translates to practice: novel predictions as growth indicators, auxiliary changes as health markers, external validation as credibility test. The examples will show tough calls in action, especially terminating the flagship lab.
answer: |-
  Here's a Lakatosian decision procedure for grant renewal meetings, structured as a 5-step flowchart with explicit thresholds, chair judgment points, and handling of "normal science" objections. The core is tracking whether auxiliary adjustments are **progressive** (lead to novel predictions/external engagement) or **degenerative** (only patch past failures).

  ---

  ### **The Research Programme Vitality Assessment**
  *(90-minute slot; inputs: project outputs, 2 external letters)*

  1.  **STEP 1: CORE INTEGRITY CHECK**  
      *Question:* "Has the group's stated *hard core* (e.g., 'Material X superconducts via mechanism Y', 'Disease Z is driven primarily by immune pathway W') changed since the last review? If yes, how?"  
      *Evidence:* Compare current project description/most recent papers to prior grant proposal & reports.  
      *Sufficient Answer:* Explicit confirmation of core stability OR clear documentation of a core shift.  
      *Stop if:* Core has been **modified or abandoned**. → **Recommend NON-RENEWAL**. (Violates Lakatosian "negative heuristic").  
      *Proceed if:* Core is **unchanged** OR change is rigorously justified as essential evolution (rare; requires chair ruling).

  2.  **STEP 2: PREDICTION/FAILURE AUDIT**  
      *Question:* "List all significant empirical tests (predictions, experimental results) since last review. For each: Was it a *novel prediction* (new phenomenon, precision beyond rivals) or a *defense* (testing an auxiliary fix from a prior failure)? What was the outcome?"  
      *Evidence:* Group's summary table (pre-submitted), external letters, committee scrutiny.  
      *Sufficient Answer:* Clear categorization of ~5 key tests. External letters must corroborate/contest categorizations.  
      *Threshold:* **If >50% of tests are DEFENSIVE** → Flag for Degenerative Tendency.  
      *Proceed:* Always (this step informs Step 3).

  3.  **STEP 3: AUXILIARY ADJUSTMENT ASSESSMENT**  
      *Question:* "For each auxiliary change/addition made (e.g., 'added co-factor P', 'modified sample purification step Q'):  
      a) Did it lead to NEW, UNPREDICTED discoveries (progressive)?  
      b) Did it ONLY explain away a specific failure (degenerative)?  
      c) Has it generated testable NOVEL predictions beyond the immediate problem?"  
      *Evidence:* Group's narrative, external letters (critical for objectivity), committee Q&A.  
      *Sufficient Answer:* Concrete examples of *new* findings or *novel* predictions linked to adjustments (progressive) OR admission that an adjustment only resolved the local failure (degenerative).  
      *Stop if:* **All adjustments are purely degenerative (3b only)** → **Recommend NON-RENEWAL**.  
      *Proceed if:* Any evidence of progressiveness (3a/3c).  
      *Chair Judgment Point 1:* If mixed record, does the *balance* suggest overall progressiveness?

  4.  **STEP 4: EXTERNAL VITALITY CHECK**  
      *Question:* "Is this programme stimulating work BEYOND the grantee's lab? Specifically:  
      a) Are independent groups testing its novel predictions?  
      b) Are rivals incorporating its concepts/methods?  
      c) Are its auxiliary adjustments debated/used externally?"  
      *Evidence:* External letters (MOST critical here), citations (contextualized), conference reports.  
      *Sufficient Answer:* Specific examples of (a), (b), or (c) OR compelling explanation for lack thereof (e.g., highly specialized tech).  
      *Threshold:* **Lack of (a), (b), OR (c) + >50% defensive tests (Step 2) → Strong Degenerative Signal.**  
      *Proceed:* Always (informs final chair judgment).

  5.  **STEP 5: CHAIR'S RISK APPETITE JUDGMENT**  
      *Inputs:* Steps 1-4 summary, degenerative/progressive balance, external vitality.  
      *Chair's Question:* "Given the programme's current trajectory and the foundation's risk tolerance:  
      a) Is there a credible path outlined (by group or externals) to a MAJOR novel prediction soon?  
      b) Is the observed degeneracy likely TEMPORARY (e.g., technical hurdles overcome) or SYSTEMIC (core shielded by endless patches)?  
      c) Does the core's potential payoff justify persisting with current ambiguity?"  
      *Decision:* **RENEW** (Strong Progressive), **RENEW with Stricter Benchmarks** (Mixed/Ambiguous), or **NON-RENEW** (Degenerative).  
      *Transparent Rationale Required:* Chair must cite specific Step 1-4 findings justifying the risk call.

  ---

  ### **Handling the "Normal Science" Objection**
  *What it gets right:* Defending a core *is* normal science! Auxiliary adjustments *are* essential.  
  *Where the procedure pushes back:* Not all defense is equal. The objection fails if:  
  1.  Adjustments **ONLY** explain past failures without generating new predictions (Step 3).  
  2.  The programme **CEASES** to produce *novel* empirical content (Step 2).  
  3.  The programme becomes **ISOLATED**, with only its creators testing/using it (Step 4).  
  *The Lakatosian Point:* Degeneracy isn't about defense *per se*, but defense that **fails to enable new growth**.

  ---

  ### **Case Applications**

  1.  **Materials Group (Confirmed Prediction):**  
      *   Step 1: Core intact. ✅  
      *   Step 2: Prediction was explicit, novel, falsifiable. ✅ Strong progressive marker.  
      *   Step 3: Core wasn't adjusted; confirmation validates the protective belt. ✅  
      *   Step 4: External *independent* confirmation is GOLD-STANDARD vitality. ✅✅  
      *   Step 5: Chair RENEW. Clear progressive shift. *You'll like this.*

  2.  **Immunology Lab (Flagship, 4 Failed Predictions + Defensive Fixes):**  
      *   Step 1: Core likely intact. ✅ Proceed.  
      *   Step 2: 4 tests = 4 failures → 100% defensive tests. ❌ Degenerative Flag.  
      *   Step 3: Each fix *only* explains the specific failure; no new discoveries/predictions cited. Letters confirm isolation. ❌ **STOP → Recommend NON-RENEWAL**.  
      *   *Why it's a NO you won't like:* PI status/friendship is irrelevant. The procedure shows **systemic degeneracy**: adjustments are firefighting, not advancing. External letters likely confirm insularity. *This is the hard case the procedure is designed to catch.*

  3.  **Young Programme (No Novel Prediction Yet):**  
      *   Step 1: Core defined? (Must be clear). Assume ✅.  
      *   Step 2: Few tests; likely mix of foundational/exploratory. No *novel* predictions yet. ⚠️ Flag for Step 3/4.  
      *   Step 3: Auxiliary work likely methodological setup. Key: Do adjustments show *progressive potential*? Letters assess plausibility. ⚠️ Ambiguous.  
      *   Step 4: Too new for much? Letters should assess if core/belt is *interesting* to field. ⚠️ Ambiguous.  
      *   Step 5: **CHAIR JUDGMENT CALL (High Risk Appetite Zone).**  
          *   Is the core *highly innovative/potentially transformative*?  
          *   Do externals see a *credible near-term path* to novel tests?  
          *   Are early adjustments *methodologically sound* and *aimed at discovery*, not just patching?  
          *   *Likely Outcome:* **Short-Term Renewal with Strict Benchmarks** (e.g., "Novel prediction & external engagement plan required in 18 months"). Requires chair's risk tolerance.

  ---

  ### **Limitations & Judgment Dressing**
  *   **Can't Decide:** Step 5 is inherently a judgment call ("Is temporary degeneracy worth the core's potential?"). The procedure ensures this call is *informed* (Steps 1-4) and *transparent*, but it's still a values-based risk decision.  
  *   **Can't Do:**  
      *   Predict ultimate "truth."  
      *   Overrule strong chair bias (though structure forces evidence citation).  
      *   Fully assess fields where novel prediction is slow/impossible (e.g., some historical sciences).  
      *   Replace deep expertise (but leverages externals + scientist committee members).  
  *   **Vulnerability:** A determined group can *frame* degenerative moves as progressive ("This new parameter opens up a whole new line!"). External letters and committee skepticism are vital counterweights.  

  **This procedure forces explicit discussion of *how* the programme evolves when faced with data, shifting focus from "Are they right?" to "Is this trajectory still productive?" It makes degeneracy visible through the linkage of auxiliary changes to novel growth (or lack thereof) and external engagement.**
