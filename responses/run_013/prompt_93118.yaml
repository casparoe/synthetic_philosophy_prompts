prompt: |-
  My museum studies advisor has been handing down verdicts all term on copies, fakes and restorations, and I need to guess what she'll say about the case we present next week. Her record, as best I can reconstruct it: the famous forged Vermeers are dead as art once they're exposed — she'll look at them only as evidence of the con, and she has a term for what's left of them, documentary residue, which she says is all they're good for; a perfect modern facsimile of a Vermeer, one that fools curators in a blind viewing, is fine as decor but not a work of art, and the original loses nothing; a bronze cast made after the sculptor died, by his estate's foundry, from his own mold, indistinguishable from the lifetime casts, is his work and a first-class one; a painting downgraded from Rembrandt to a named pupil keeps its value as art and loses only price and art-historical interest; a fresco that's 60% repainted in a restoration that's fully documented and reversible is still the same work with its value essentially intact; a later print struck from a copy negative of a famous photograph, indistinguishable from a vintage print, is the same image but a lesser object; and a tribute band that reproduces a live album note for note is a performance, not the work. Next week's case: a painter spent three years making a by-hand replica of a Vermeer — period materials, period methods, indistinguishable to the eye — shown under an honest label saying it's her replica and signed with her own name, no attempt to fool anybody. Will she count it as a work of art, and whose, and how good? The yes or no matters less to me than the structure: which rules her earlier verdicts are jointly compatible with, what each of those rules predicts here, which one she's definately running and why, and which further case would separate them. Tell me how confident you are overall and which single step you're least sure of. American English please, and finish with one line \answer{...} holding your verdict, the rule in a few words, and the deciding case.
