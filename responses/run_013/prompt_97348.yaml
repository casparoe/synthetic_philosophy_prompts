  **Joint Statement: Reconciliation on the Ethics of Historical Comparison**  

  **Preamble**  
  We, scholars of comparative moral history, affirm that rigorous dialogue on historical atrocities is essential for ethical remembrance. While differences persist, we identify shared principles to guide future discourse.  

  ### Part 1: Agreed Foundational Claims  
  1. **Definition of Atrocity**: Atrocities are systematic acts or policies inflicting extreme, unjust suffering or annihilation upon populations, fundamentally violating human dignity and agency.  
  2. **Purpose of Comparison**: Comparative analysis seeks moral understanding, prevention, and dignified remembrance—*not* relativization, trivialization, or competitive victimhood.  
  3. **Modes of Comparison**:  
     - *Ordinal ranking* (e.g., "Event X was worse than Y") is distinct from *cardinal scoring* (e.g., "X scores 8.2/10 in severity") and *lexical priority* (e.g., "Intentional genocide outweighs all non-genocides").  
     - Private moral judgments differ categorically from public memorial practices.  
  4. **Dimensions of Severity**: Severity may include:  
     - Scale (number of victims)  
     - Intensity of suffering per victim  
     - Intentionality and ideological motivation  
     - Long-term societal destruction  
     No single dimension is universally dispositive.  
  5. **Incommensurability vs. Incomparability**: Some atrocities lack a *precise common metric* (incommensurability) but permit contextual analogies without implying full comparability (incomparability).  
  6. **The Charge of "Obscenity"**: Labeling a ranking "obscene" concerns its *performative effect in specific contexts* (e.g., erasing victims, legitimizing oppression), not an intrinsic property.  
  7. **Evidentiary Standards**: Severity assessments require interdisciplinary evidence (historical, psychological, sociological). Disagreements arise in *weighting* evidence, not its relevance.  

  ### Part 2: Disagreements Table  
  | Point of Issue | Comparativist Position | Anti-Comparativist Position | Crux | Test Case (Predictions) |  
  |----------------|------------------------|-----------------------------|------|--------------------------|  
  | **Cross-contextual qualitative comparison** | Per-victim suffering can be broadly compared across atrocities (e.g., genocide vs. famine). | Suffering is embedded in cultural/experiential contexts; cross-contextual comparisons are invalid. | *Can a universal "intensity of suffering" metric exist?* <br> **Test**: Compare prolonged torture in one atrocity vs. mass swift extermination in another. <br> **Prediction**: C: Qualitative scales can emerge; AC: No non-arbitrary comparison possible. |  
  | **Agent-neutral severity** | Severity has objective, agent-neutral components (e.g., total preventable deaths). | Severity is inherently agent-relative, shaped by historical positionality and reparative duties. | *Would an impartial observer agree on severity rankings?* <br> **Test**: Hypothetical identical atrocities in different cultures/times. <br> **Prediction**: C: Yes, core severity is recognizable; AC: No, context defines moral meaning. |  
  | **Memorial zero-sum dynamics** | Publicly ranking atrocities need not diminish lesser-ranked victims if memorial practices are inclusive. | Any public hierarchy inevitably marginalizes some victim groups in collective memory. | *Can two atrocities be memorialized equally if one is ranked "worse"?* <br> **Test**: Simultaneous memorials for two historically distinct atrocities, one ranked higher in severity. <br> **Prediction**: C: Yes, with careful design; AC: No, hierarchy inherently breeds neglect. |  
  | **Quantitative-qualitative tradeoffs** | Large-scale atrocities with "lesser" individual suffering can outweigh smaller-scale horrors via aggregate harm. | Qualitative severity (e.g., torture) defies aggregation; no number of "lesser" harms outweighs it. | *Does 1,000 deaths from swift execution outweigh 100 deaths by torture?* <br> **Test**: Simulated moral calculus with fixed parameters. <br> **Prediction**: C: Yes, at some ratio; AC: Never, due to lexical priority of extreme suffering. |  

  ### Conclusion  
  We reaffirm that atrocities resist reductive analysis. Disagreements center on epistemology (can severity be objectified?) and memorial ethics (does comparison aid or betray remembrance?). Further work should examine *contextual thresholds*—when rough comparisons aid moral clarity versus perpetuate harm.  

