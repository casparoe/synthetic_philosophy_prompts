answer: |-
  Here's a joke focusing on the doubt report and embedding the attitude word in a way that highlights the tension, while subtly mocking the "dormant attitude" dodge:

  **The Setup:**  
  A confident Expressivist is giving a talk. They say:  
  "Look, when I say *'Kicking puppies is wrong'*, I'm not stating some cosmic fact, folks. I'm just expressing my deep, personal *boo!* towards puppy-kicking. Simple! The word 'wrong' *is* that expression of disapproval."

  **The Punchline:**  
  An audience member raises their hand: "Okay, but what about when I say: *'I doubt that kicking puppies is wrong'*? I assure you, I'm *not* expressing any disapproval of puppy-kicking there. In fact, I'm expressing doubt about the disapproval! Yet, 'wrong' clearly means the same thing – it still refers to the *moral property* of wrongness I'm doubting exists. If it just meant *your* 'boo', my sentence would be nonsense, like saying 'I doubt your boo!' which isn't what I meant at all. And critically, the argument *'I doubt kicking puppies is wrong, but if it causes suffering, then it probably is wrong – therefore, I doubt kicking puppies causes suffering'* relies entirely on 'wrong' meaning the *same thing* in the doubt and the 'probably' clause – not my feelings, or yours, or anyone's current 'boo'."

  **The Expressivist's Dodge:**  
  The Expressivist hesitates: "Well... in that case... the 'wrong' in 'I doubt it's wrong'... it's... it's like I'm *mentioning* the attitude! Or perhaps... it's the *potential* for disapproval! The attitude isn't *expressed* right then, it's just... *there*, conceptually, waiting... like disapproval-in-waiting!"

  **The Final Twist (Audience Member):**  
  "Disapproval-in-waiting? So 'wrong' isn't *actually* expressing an attitude when embedded like this? It's just *pointing* to the *idea* of an attitude? Almost... like it's referring to a *property* or a *concept* after all? Sounds suspiciously like the descriptive meaning you said it didn't have! My doubt isn't about your dormant feelings; it's about whether kicking puppies *possesses* that property. The word 'wrong' does its job perfectly well there, carrying its meaning, holding the argument together... *entirely independently of anyone currently feeling a 'boo'*. Your 'dormant disapproval' looks an awful lot like a description wearing a very thin disguise."

  **Why it works:**

  1.  **Uses Doubt & Probability:** Focuses on "I doubt it's wrong" and "probably wrong" instead of a conditional.
  2.  **Highlights Meaning & Logic:** Explicitly points out that "wrong" must mean the *same thing* (the moral property/concept) in both the doubt clause and the 'probably' clause for the argument to be valid. Validity hinges on the *meaning*, not the expression of attitude.
  3.  **Exposes the Attitude Absence:** The speaker *emphasizes* they are *not* disapproving ("I assure you..."). The attitude simply isn't present to be expressed or dormant *in the speaker*.
  4.  **Mocks the Dodge:** The Expressivist's save ("disapproval-in-waiting", "mentioning the attitude", "potential disapproval") is directly presented and then immediately undermined. The audience member points out this "dormant attitude" functionally behaves *exactly* like the descriptive meaning (a property/concept) the Expressivist rejects. The punchline ("description wearing a very thin disguise") lands the critique of the dodge.
  5.  **Turns on the Mechanics:** The core tension is the word "wrong" needing identical semantic content (its meaning) in a context where the attitude-expression function is logically impossible (`doubt(X)` cannot simultaneously express `boo(X)`). The joke makes this need for stable meaning explicit.
  6.  **Not Just "Expressivism Dumb":** The humor comes from the Expressivist being backed into a corner by the logical demands of the embedding, forcing them into a patently awkward explanation that contradicts their initial simplicity. The punchline critiques the *specific save* within the mechanics.

  **Delivery Tip:** Lean into the Expressivist's initial confidence and subsequent flustered hesitation during the dodge. The audience member should sound calm, logical, and slightly bemused by the end. The phrase "disapproval-in-waiting" should sound as silly as it is.
