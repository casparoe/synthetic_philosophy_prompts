answer: |-
  Your instincts reveal a coherent principle that blends expected utility maximization with risk management, loss aversion, and uncertainty adjustment. The core idea is **growth-optimization with ruin avoidance and uncertainty discounts**, drawing from geometric rationality (maximizing long-term wealth growth via multiplicative processes) while incorporating psychological and practical safeguards. Here's the precise principle:

  ### **Principle: Uncertainty-Adjusted Kelly with Ruin Constraints**
  1. **Base Case (Repeated Bets, Trusted Probabilities)**: Use the [Kelly criterion](https://en.wikipedia.org/wiki/Kelly_criterion) to maximize geometric growth:  
     \( f^* = \frac{bp - q}{b} \)  
     where \( b \) = net fractional odds (gain/loss ratio), \( p \) = win probability, \( q = 1-p \) = loss probability.  
     This optimizes \(\mathbb{E}[\log(\text{wealth})]\) for repeated play.

  2. **Adjustments**:
     - **Ruin Avoidance**: Cap bets to ensure survival (e.g., no bet that risks >50% loss in one shot; no repeated bets that risk >1% chance of ruin).
     - **Uncertainty Discount**: Reduce \( f^* \) by a factor \( \alpha \) (e.g., \( \alpha = 0.1 \)) if probabilities are unreliable or outcomes are volatile.
     - **One-Shot Relaxation**: For single bets, allow higher fractions if:
       - The loss cap isn't breached.
       - No repeated-play compounding exists to smooth variance.

  3. **Rejection Criteria**: Avoid bets where:
     - The geometric growth rate is negative (\(\mathbb{E}[\log(\text{gain})] < 0 \)).
     - The psychological cost of ruin outweighs the EV.

  ---

  ### **How It Explains Your Instincts**
  | Scenario | Your Instinct | Principle's Prediction |
  |----------|--------------|------------------------|
  | **55% heads, even money, 200 plays** | Bet 10% | Kelly: \( f^* = \frac{1 \cdot 0.55 - 0.45}{1} = 0.10 \). Repeated play → use \( f^* \). |
  | **55% heads, even money, one shot** | Bet ~50% | One-shot → relax to loss cap (50%). Kelly would say 10%, but you prioritize higher EV exposure when no future bets exist. |
  | **50% gain / 40% loss coin** | Reject | Compute geometric growth:  
    \(\mathbb{E}[\log(\text{gain})] = 0.5 \log(1.5) + 0.5 \log(0.6) \approx -0.051 < 0\).  
    Negative growth → reject. |
  | **95% win chance, even money** | Bet ≤5% | Kelly: \( f^* = \frac{1 \cdot 0.95 - 0.05}{1} = 0.90 \).  
    Uncertainty discount (\( \alpha \approx 0.055 \)) reduces it to ~5%. |
  | **60/40 edge, bet your house** | Reject | Ruin avoidance: betting 100% of wealth breaches loss cap. |

  ---

  ### **Test on a New Case**
  **Scenario**: You have a 70% chance to triple your money (i.e., gain 200% on win), and 30% chance to lose your stake. Played once.  
  - **Kelly**: \( b = 2 \) (net odds), \( p = 0.7 \), \( q = 0.3 \) → \( f^* = \frac{2 \cdot 0.7 - 0.3}{2} = 0.55 \).  
  - **Principle's Prediction**:  
    - One-shot → can relax beyond Kelly, but loss cap applies.  
    - Max loss = 100% of stake → cap bet at 50% (to avoid >50% bankroll loss).  
    - Uncertainty: None specified → use \( f = \min(0.55, 0.50) = 0.50 \).  
    **Bet 50%**.

  ---

  ### **Inconsistencies and Recommendations**
  - **The One-Shot vs. Repeated Dilemma**:  
    Your one-shot instinct (bet 50% on 55% coin) **clashes with geometric rationality**. Kelly would prescribe 10% even for one bet because it maximizes \(\mathbb{E}[\log(\text{wealth})]\), which penalizes ruin risk. Betting 50% has:  
    \(\mathbb{E}[\log(\text{gain})] = 0.55 \log(1.5) + 0.45 \log(0.5) \approx -0.089 < 0\),  
    implying negative geometric growth.  
    - **Verdict to abandon**: Betting 50% on one-shot 55% coin. Use 10% instead to respect the log-utility foundation of geometric growth.  
    - *Why your instinct feels rational*: In one-shot, you focus on EV (linear) and accept moderate risk. But this ignores the asymmetric harm of losses (losing 50% requires +100% to recover). Geometric rationality accounts for this.

  - **Other Verdicts**:  
    - Rejecting the 50%/40% coin and capping 95% bets are **defensible** (negative growth and uncertainty).  
    - Avoiding house bets on 60/40 is **rational** (ruin constraint).

  ---

  ### **Refined Principle**
  **"Maximize long-term geometric growth, but cap single-bet exposure to avoid catastrophic loss, and downweight bets when probabilities are unreliable. For one-shot bets, still respect the Kelly fraction unless linear utility dominates (e.g., life-changing stakes), but never breach ruin limits."**  

  This preserves your core intuitions while anchoring them in a consistent framework. It explains why you intuitively adjust for repetition, uncertainty, and ruin—but corrects the one-shot deviation.
