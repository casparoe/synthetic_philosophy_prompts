prompt: |-
  I run the platform team at a mid-sized SaaS company and I chair our blameless incident reviews, and the recurring problem isn't finding causes, it's settling arguments about them. After an outage we'll have three or four rival stories up on the whiteboard and the meeting ends up ratifying whichever one the most senior or most confident person happens to be attached to. Last month we burned two hours on a payments outage arguing whether it was a race condition in our code, a bad config push, or the cloud provider throttling us, and we went with the race condition because it was the most interesting, then shipped a fix that did nothing. I was moaning about this to a friend who did a philosophy degree and she said what I was after was inference to the best explanation, which I've read about but have never managed to make concrete. So: please turn it into a decision procedure I can actually run in a 45-minute review with six engineers, no statistician in the room. I want to know what to write down for each candidate explanation, what order to compare them in, what counts as a decisive test we can run before the meeting ends, and — the bit I care about most — how to tell an explanation that's genuinely better supported from one that's merely prettier or more satisfying to tell.

  Then run the procedure on two or three hypothetical incidents so I can see it work: (a) an outage where an elegant single-cause story and a boring two-cause story both fit every scrap of evidence we have; (b) one where an exciting explanation — someone was attacking us, or a subtle data race — fits one striking piece of evidence but predicts nothing else, while a dull explanation predicts a pile of small things we did actually observe; and (c) a case where the procedure should refuse to name any cause at all and output 'unknown, here's what we'll watch next time' instead, even though the room is desperate for closure. Be honest about which steps are judgment calls dressed up as a checklist, and say plainly what the procedure can't do — I'd much rather it told me when it's useless than gave me false confidence. Two more constraints: it has to survive a room where people will try to game it by dressing up a guess as an 'explanation', and it can't assume we have clean logs or reproducible failures, because half our incidents happen once and we never see them again. Write the whole thing in British English.
reasoning: |-
  We are going to design a decision procedure based on "inference to the best explanation" (IBE) for incident reviews. The goal is to have a structured way to compare candidate explanations and choose the one that is best supported by the evidence, without being swayed by seniority, confidence, or how interesting the explanation is.

  The procedure will have the following steps:

  1. **Preparation (Before the Meeting):**
     - Gather all available evidence (logs, metrics, timelines, etc.) and distribute to participants.
     - Each participant is invited to propose candidate explanations (causes) in advance or at the start of the meeting. Each explanation must be written as a clear, testable statement.

  2. **Step 1: Present the Evidence (5 minutes)**
     - Review the incident timeline and key observations (symptoms, errors, etc.). Write down the evidence on a shared board.

  3. **Step 2: List Candidate Explanations (5 minutes)**
     - Each candidate explanation is written on the board. Clarify each one to ensure it is a complete causal story (i.e., it must explain how the cause led to the observed effects).

  4. **Step 3: Evaluate Each Explanation Against the Evidence (20 minutes)**
     - For each candidate explanation, we will assess:
       a. **Explanatory Power:** How well does the explanation account for the observed evidence? (Does it predict the evidence we have?)
       b. **Predictive Novelty:** Does the explanation predict any additional evidence that we haven't looked for yet? (This is a key way to test it during the meeting if possible.)
       c. **Simplicity (Parsimony):** How many assumptions does it require? (Prefer explanations that require fewer new assumptions, i.e., Occam's razor.)
       d. **Testability:** Can we verify or falsify the explanation with an experiment or by checking existing data? (If we can run a quick test during the meeting, we do so.)

     - We will use a scoring system (e.g., 1-5) for each criterion, but the key is to compare the explanations side by side.

  5. **Step 4: Run Decisive Tests (If Possible) (10 minutes)**
     - If an explanation makes a unique prediction (that the others do not), we try to test it immediately. This could be:
       - Checking a log we haven't looked at.
       - Running a query on metrics.
       - Reproducing the issue in a test environment (if quick).
     - Note: If we cannot test during the meeting, we note what we would need to test later.

  6. **Step 5: Compare and Decide (5 minutes)**
     - Compare the explanations based on the criteria. The best explanation is the one that:
       - Explains the most evidence (especially the key symptoms).
       - Makes successful novel predictions (if tested).
       - Is the simplest (avoids unnecessary complexity).
       - Is testable (and has passed the tests we could run).
     - If one explanation is clearly superior, we choose it. If not, we may need to gather more data and reconvene, or in some cases, we might have to accept multiple contributing causes.

  7. **Step 6: Document and Plan (5 minutes)**
     - Write down the chosen explanation and the evidence for it, as well as any open questions.
     - If no explanation is chosen, document what we need to look for next time and any monitoring/alerting changes.

  **Guarding Against Gaming:**
  - Require that each explanation must make specific, testable predictions. Vague explanations are rejected.
  - If an explanation is proposed that is just a guess without a clear causal mechanism, challenge the proposer to articulate how it would produce the observed symptoms.

  **Limitations:**
  - The procedure cannot create evidence where none exists. If the logs are missing or the incident is not reproducible, we might not be able to reach a conclusion.
  - Judgment is involved in scoring the criteria. To mitigate bias, we will have each participant score independently and then discuss.

  **British English Note:** We'll use terms like "whilst" and "colour" as needed, but the main adjustment is spelling and some phrasing.

  Now, let's run through three hypothetical incidents:

  ### Incident (a): Single-cause vs. two-cause explanations
  **Scenario:** An outage occurred where users couldn't access their dashboards. Both a single-cause story (a bug in the authentication service) and a two-cause story (a configuration error in the load balancer and a simultaneous network glitch) fit all the evidence.

  **Evidence:**
  - Users received 503 errors.
  - Authentication service logs show a spike in errors at the same time.
  - Load balancer metrics show an unusual drop in healthy hosts during the incident.
  - The network monitoring showed a brief spike in latency.

  **Candidate Explanations:**
  1. **Explanation A (Single-cause):** A bug in the authentication service caused it to crash, which led to the 503 errors because the load balancer marked the hosts as unhealthy when the auth service didn't respond.
  2. **Explanation B (Two-cause):** A configuration push to the load balancer accidentally reduced the number of healthy hosts, and simultaneously, a network glitch caused increased latency which made the remaining hosts appear unhealthy.

  **Procedure:**
  - **Explanatory Power:** Both explain the 503s and the drop in healthy hosts. Explanation A uses the auth service crash to explain both. Explanation B requires two independent events (config push and network glitch) to coincide.
  - **Predictive Novelty:** 
     - Explanation A predicts that the auth service logs should show a crash or high error rate at the exact time. We check: they do.
     - Explanation B predicts that the config push happened just before the incident and that the network latency spike occurred. We check: both are true, but note the config push was a routine one that had never caused issues before, and the network spike was very brief and within normal thresholds.
  - **Simplicity:** Explanation A is simpler (one cause) vs. Explanation B (two independent causes). However, if the two causes are both known to occur, then B might be acceptable.
  - **Testability:** We can try to reproduce the auth service crash by rolling back to the version at the time and simulating the load. We could also check if the config push alone (without the network glitch) would have caused the outage by replaying it in staging.

  **Decisive Test:** We notice that after the incident, rolling back the auth service fixed the problem without changing the load balancer config or the network. This supports Explanation A.

  **Conclusion:** Explanation A is better because it is simpler and the rollback fixed the issue.

  ### Incident (b): Exciting but narrow explanation vs. dull but broad
  **Scenario:** An outage where a critical service was slow and returning errors. There's a striking piece of evidence: one log entry shows a very high number of database locks. One explanation is an exciting one: a sophisticated cyber attack (e.g., a SQL injection attack causing locking). The other is a dull one: a new feature release caused a surge in traffic that the database couldn't handle, leading to locks and timeouts.

  **Evidence:**
  - High database lock count observed at the time of the incident.
  - Slow responses and timeouts in the application.
  - The incident started shortly after a new feature release.
  - Traffic was 20% higher than usual.

  **Candidate Explanations:**
  1. **Explanation A (Exciting):** A malicious actor launched a SQL injection attack that caused excessive locking and brought down the service.
  2. **Explanation B (Dull):** The new feature caused a surge in traffic, and the database, which was already near capacity, couldn't handle the load, leading to contention and locks.

  **Procedure:**
  - **Explanatory Power:**
     - Explanation A: Accounts for the high locks (if the attack was causing many long-running locks) and the slowness. But it doesn't explain why the incident started just after the feature release, unless the attack was timed to coincide.
     - Explanation B: Accounts for the timing (after feature release), the increased traffic, and the locks (due to contention). Also, the traffic surge was observed.

  - **Predictive Novelty:**
     - Explanation A predicts that we should see malicious SQL patterns in the logs. We check: we don't, and the locks are all from legitimate user queries. It also predicts that the attack would continue, but it stopped when we rolled back the feature.
     - Explanation B predicts that the traffic patterns would show an increase in specific types of requests (related to the new feature). We check: yes, and the locks are on tables used by that feature.

  - **Simplicity:** Explanation B is simpler because it doesn't introduce a new entity (a malicious actor) without evidence. Explanation A requires assuming an attacker and a specific attack vector that we have no direct evidence for.

  - **Testability:** 
     - We can try to simulate the traffic surge in staging and see if it reproduces the locks and timeouts. We do this quickly and it does.
     - For Explanation A, we check security logs and find no evidence of an attack.

  **Conclusion:** Explanation B is better supported because it explains more of the evidence (timing, traffic, and the locks) without requiring unsupported assumptions. The exciting explanation (A) is less good because it only explains the locks and fails to predict the other evidence.

  ### Incident (c): Unknown cause
  **Scenario:** A mysterious outage where the application crashed and restarted, but no clear error was logged. The room is desperate to find a cause.

  **Evidence:**
  - The application crashed at 3:14 AM and restarted automatically.
  - There were no errors in the application logs leading up to the crash.
  - System metrics show a brief spike in memory usage just before the crash.

  **Candidate Explanations:**
  1. **Explanation A:** A memory leak caused the application to run out of memory and crash.
  2. **Explanation B:** A cosmic ray bit-flip caused a critical process to crash (a joke explanation, but someone might propose it seriously).

  **Procedure:**
  - **Explanatory Power:** 
     - Explanation A: The memory spike is consistent with a leak, but we have no evidence of a leak in the code and the spike is very brief. It doesn't explain why there are no error logs.
     - Explanation B: This is untestable and doesn't predict any evidence we have.

  - **Predictive Novelty:** 
     - Explanation A: Predicts that if we monitor memory more closely, we might see it happen again. Also, we should be able to find a memory leak in the code? But we look and don't find one.
     - Explanation B: Predicts nothing testable.

  - **Simplicity:** Explanation A is simpler than B, but still requires an assumption of a memory leak without evidence.

  - **Testability:** We try to reproduce by running a stress test to exhaust memory. The application crashes but leaves an out-of-memory error in the logs, which we didn't see in the incident. So this doesn't match.

  **Conclusion:** Neither explanation is well-supported. We decide that the cause is unknown. We document:
     - We will add more memory monitoring and logging for crashes.
     - Next time, we hope to capture more data.

  **Final Notes on the Procedure:**
  - What are the judgment calls? 
     - Scoring the criteria (explanatory power, etc.) is subjective. We mitigate by having multiple people score and discuss.
     - Deciding what counts as a "successful" prediction: if the evidence is ambiguous, we might have to use consensus.
  - What can't it do?
     - It cannot create evidence. If the data isn't there, we might not resolve the incident.
     - It might not work if the incident is too complex and the explanations are not well-articulated.
     - It might be gamed if someone crafts an explanation to fit the evidence after the fact. To avoid this, we require explanations to make novel predictions that we haven't already checked.

  Despite these, the structure should help focus the discussion and reduce bias.
answer: |-
  ### Blameless Incident Review: Inference to the Best Explanation (IBE) Procedure  
  *Designed for 45-minute reviews with 6 engineers. Focus on concrete, testable comparisons. British English throughout.*

  ---

  ### **The IBE Decision Procedure**  
  **Goal:** Objectively compare candidate explanations using **explanatory power**, **testability**, and **parsimony** (simplicity). Forces explicit scoring to counter seniority/confidence bias.  

  #### **Step 0: Prep Work (Before Meeting)**  
  - **Collect evidence:** Timeline, logs (even if patchy), metrics, witness accounts.  
  - **Require explanations in writing:** Each candidate cause must be submitted as a **causal chain** (e.g., "Event X caused Y, which led to Z outage").  
  - **Rule:** No explanations accepted mid-meeting unless they explain *new* evidence.  

  #### **Step 1: Present Evidence (5 mins)**  
  - **Write on whiteboard:**  
    - **Observed facts:** E.g., "Error rate spiked at 14:05", "Cache hit rate dropped 80%", "User reports from 14:07".  
    - **Absences:** E.g., "No errors in auth logs", "CPU normal during outage".  
  - **Key:** Distinguish **direct observations** from **inferences** (e.g., "We *saw* latency increase" vs. "We *infer* the DB was overloaded").  

  #### **Step 2: List & Clarify Explanations (5 mins)**  
  - **Write each candidate** on the board. Require proposers to articulate:  
    - **Causal mechanism:** "How exactly did this cause the outage?"  
    - **Predictions:** "What *should* we see if this is true?" (e.g., "If it’s a race condition, we’d see non-deterministic errors").  
  - **Reject non-explanations:** E.g., "Networking issues" is rejected; "Cloud provider throttled API calls due to our burst traffic" is accepted.  

  #### **Step 3: Score Explanations (20 mins)**  
  **Score each explanation (1-5) on three criteria:**  
  1. **Explanatory Power (EP):**  
     - *"How many observed facts does it explain?"*  
     - Score = Number of **observed facts** it accounts for (e.g., explains 4/5 facts = 4).  
     - *Crucially:* 1 point deducted for **conflicting evidence** (e.g., if explanation predicts high CPU but CPU was idle).  

  2. **Predictive Novelty (PN):**  
     - *"Does it predict *new* evidence we haven’t checked?"*  
     - Score = 5 if it predicts **testable, unique evidence** (e.g., "Check *this* log for trace IDs repeating"); 1 if it only fits known facts.  

  3. **Parsimony (P):**  
     - *"How many assumptions does it require?"*  
     - Score = 5 for fewest assumptions; 1 for most.  
     - E.g., "Cloud throttling" (1 assumption: provider enforced limits) vs. "Race condition + config error + monitoring lag" (3+ assumptions).  

  **Scoring rules:**  
  - Each engineer scores independently, then discuss outliers.  
  - **Total score = EP + PN + P** (max 15).  
  - **Threshold:** Only explanations scoring ≥10 proceed.  

  #### **Step 4: Decisive Test (10 mins)**  
  - **Identify testable predictions** from Step 3. Prioritise:  
    - **Quick checks:** Queries against existing logs/metrics (e.g., "If cloud throttling, show API error codes in gateway logs").  
    - **Reproductions:** Only if <5 mins (e.g., "Replay config push in staging").  
  - **Run 1–2 tests live:** Focus on predictions with **high PN scores**.  
  - **Rule:** If no test is feasible (e.g., irreproducible), PN scores are halved.  

  #### **Step 5: Compare & Decide (5 mins)**  
  - **Rank explanations by total score.**  
  - **Best explanation must:**  
    - Have the highest score.  
    - Score ≥2 points higher than rivals.  
    - Have no **unexplained contradictions** (e.g., if it conflicts with a key observation, it’s rejected).  
  - **If tie/no clear winner:** Outcome is **"Unknown"** (see Step 6).  

  #### **Step 6: Document & Next Steps (5 mins)**  
  - **If cause identified:**  
    - Write: "Cause: [explanation]. Supported by: [evidence]. Tested: [result]."  
    - Action: Fix, monitor, test.  
  - **If unknown:**  
    - Write: "No confident cause. Next: Watch [specific evidence] in future incidents. Add logging for [gap]."  
    - Action: Improve observability; schedule revisit if new data.  

  ---

  ### **Guardrails Against Gaming**  
  - **Reject "just-so stories":** Explanations must specify testable predictions (Step 2).  
  - **Penalise vagueness:** Low PN/P scores for explanations like "probably a network glitch".  
  - **Force accountability:** Proposers must defend scores in Step 3.  

  ### **Limitations & Judgment Calls**  
  - **Cannot fix bad evidence:** If logs are missing, scores will be low. Accept "unknown" outcomes.  
  - **Subjectivity in scoring:** Parsimony and Predictive Novelty involve judgment. Mitigate by:  
    - Averaging engineer scores.  
    - Focusing on **test conflicts** (e.g., "Explanation A conflicts with CPU logs").  
  - **Won’t resolve all disputes:** If scores are close (e.g., 12 vs. 11), declare "inconclusive" and gather more data.  
  - **No statistical rigour:** This is qualitative. For probabilistic causes (e.g., flaky tests), IBE is weaker.  

  ---

  ### **Worked Examples**  
  #### **Incident (a): Single-Cause vs. Two-Cause**  
  **Scenario:** API outage. All services returned 500 errors for 10 minutes.  
  **Evidence:**  
  - 500 errors started at 14:00.  
  - Auth service restarted at 14:00 (planned deployment).  
  - Cache hit rate dropped from 70% to 5% at 14:00.  
  - No spike in CPU/memory.  

  **Candidate Explanations:**  
  1. **"Elegant single-cause":** Auth deployment caused cache invalidation bug → all requests bypassed cache → overloaded DB → 500s.  
  2. **"Boring two-cause":** (1) Auth deployment caused cache invalidation bug + (2) DB was already near capacity → combined overload → 500s.  

  **Scoring:**  
  | **Criteria**       | **Single-Cause** | **Two-Cause** |  
  |--------------------|------------------|---------------|  
  | **EP**             | 4 (Explains 500s, cache drop, auth restart. *Assumes* DB overload without CPU spike.) | 3 (Explains 500s, cache drop. *Doesn’t explain* why DB overload didn’t show in CPU.) |  
  | **PN**             | 3 (Predicts: DB logs should show slow queries at 14:00.) | 1 (Predicts nothing new.) |  
  | **Parsimony (P)**  | 4 (1 root cause: deployment bug.) | 2 (2 independent causes + coincidence.) |  
  | **Total**          | **11**           | **6**         |  

  **Decisive Test:** Check DB logs for slow queries at 14:00. Result: None found.  
  **Conclusion:** Single-cause EP reduced to 3 (fails to explain missing DB load). **No winner** (both scores now ≤8). Outcome: **"Unknown. Next: Add DB query metrics; replay auth deploy in staging."**  

  #### **Incident (b): Exciting vs. Dull Explanation**  
  **Scenario:** Payments failed for 15% of users.  
  **Evidence:**  
  - Failed payments correlated with new user sign-ups.  
  - One striking log: "Duplicate transaction ID" errors.  
  - No network errors.  
  - Failure rate steady (not spiky).  

  **Candidate Explanations:**  
  1. **"Exciting explanation":** Hacker brute-forcing payment IDs → caused duplicate ID errors → failures.  
  2. **"Dull explanation":** Race condition in payment service → duplicate IDs on retries → failures.  

  **Scoring:**  
  | **Criteria**       | **Hacker Attack** | **Race Condition** |  
  |--------------------|-------------------|---------------------|  
  | **EP**             | 2 (Explains duplicate IDs. *Ignores* correlation with sign-ups.) | 4 (Explains duplicate IDs *and* why new users were affected (more retries).) |  
  | **PN**             | 1 (Predicts spike in malicious IPs. None found.) | 5 (Predicts: Retry logs should show duplicate attempts for failed payments.) |  
  | **Parsimony (P)**  | 2 (Assumes undetected hacker.) | 4 (1 code flaw.) |  
  | **Total**          | **5**             | **13**             |  

  **Decisive Test:** Check retry logs. Result: 100% of failed payments had retries.  
  **Conclusion:** **Race condition wins**. Dull explanation scored higher by explaining more evidence with fewer assumptions.  

  #### **Incident (c): Demanding Closure but No Clear Cause**  
  **Scenario:** Brief global latency spike (3 mins).  
  **Evidence:**  
  - Latency jumped from 50ms to 2s at 15:00.  
  - CDN logs show no errors.  
  - Anecdotal Slack message: "Saw weird DNS lookup at 15:02".  

  **Candidate Explanations:**  
  1. **"DNS misconfiguration":** Faulty DNS update → slow lookups → latency.  
  2. **"Secret DDOS attack":** Brief attack → overload → spike.  

  **Scoring:**  
  | **Criteria**       | **DNS Misconfig** | **Secret DDOS** |  
  |--------------------|-------------------|------------------|  
  | **EP**             | 2 (Explains latency spike and Slack message. *Ignores* CDN logs.) | 1 (Explains spike. *Ignores* Slack message.) |  
  | **PN**             | 1 (Predicts DNS errors in logs. None found.) | 1 (Predicts traffic surge in metrics. None found.) |  
  | **Parsimony (P)**  | 3 (1 config change.) | 2 (Assumes undetected attack.) |  
  | **Total**          | **6**             | **4**            |  

  **Decisive Test:** None possible (logs lack DNS/attack data).  
  **Conclusion:** Both score ≤6. **Outcome: "Unknown cause. Next: Add DNS monitoring; capture traffic samples during latency spikes."**  

  ---

  ### **When to Use This**  
  - **Works best:** When multiple explanations exist, and evidence is patchy but testable.  
  - **Fails gracefully:** Low scores/untestable predictions → "unknown" outcome.  
  - **Won’t solve:**  
    - Culture problems (e.g., engineers refusing to score fairly).  
    - Incidents with *no* evidence (procedure relies on testable predictions).  

  **Final tip:** Frame this as "testing stories against the facts" — not personal critiques. Use the scores to depersonalise the debate. Good luck!
