  We are drafting a short written opinion for the graduate curriculum committee regarding a proposed seminar titled "Probability Without Collapse." The instructor claims that the Born rule can be derived from the many-worlds interpretation (MWI) via a symmetry argument about branch counting and that this is now the standard view. The syllabus also states that students who worry about probability are stuck in an obsolete Copenhagen picture. A reviewer objects that the probability problem in Everettian quantum mechanics is still open, that branch-counting arguments either assume equiprobability or confuse branch count with measure, and that presenting this as settled is misleading.

  Our goal: 
  - Recommend a concrete course of action (approve, reject, approve with conditions) with a clear time frame for revisions.
  - Engage the reviewer's strongest point seriously (the open problem of probability in MWI and the issues with branch counting).
  - Separate settled from contested issues without presenting a contested view as consensus.

  Key points from the reviewer:
  1. The probability problem in Everettian quantum mechanics remains open.
  2. Branch-counting arguments either presuppose equiprobability (which is circular) or equivocate between branch count and measure (which is not justified).
  3. Presenting this as the standard view and dismissing alternative concerns as obsolete is inappropriate.

  What is settled and what is contested?
  - Settled: There is a long-standing debate about the probability problem in MWI. The Born rule is a fundamental part of quantum mechanics, and its derivation in MWI has been an active area of research. However, there is no universally accepted derivation that has resolved all concerns.
  - Contested: Whether branch-counting (or any particular method) successfully derives the Born rule without circularity or equivocation. The claim that the problem is solved by branch counting is a view held by some Everettians but not universally accepted, even among MWI supporters. Moreover, the claim that the derivation is now the "standard view" is an overstatement.

  Recommended course of action:
  - Approve the seminar but with conditions to ensure that the contested nature of the topic is presented fairly and that alternative viewpoints (including the unresolved challenges) are adequately covered.

  Conditions:
  1. The syllabus must be revised to remove the claim that the derivation is the "standard view" and that concerns about probability are merely due to an "obsolete Copenhagen picture." Instead, the course should present the branch-counting argument as one proposed solution among others and acknowledge that the issue remains a subject of ongoing research and debate.
  2. The seminar should include at least one session dedicated to the challenges and criticisms of the branch-counting approach, including the circularity and equivocation issues raised by the reviewer and others.
  3. The instructor must adjust the course description and syllabus to reflect these changes within two weeks (by the time of the next meeting) so that the committee can review the revised syllabus before final approval.

  Time frame: The instructor must submit the revised syllabus within one week (so that the committee has one week to review before the meeting). The committee will then vote on approval at the next meeting based on the revised syllabus.

  Reasoning:
  - The topic is academically valuable and should be taught, but the presentation must be balanced and reflect the current state of the field. The seminar should not present a contested research program as settled.
  - The reviewer's point about the open problem and the flaws in branch-counting arguments is well-taken and represents a significant body of scholarly opinion. Ignoring this would misrepresent the consensus (or lack thereof) in the field.
  - Approving with conditions allows the seminar to proceed while ensuring academic rigor and intellectual honesty.

  Draft:

  ---

