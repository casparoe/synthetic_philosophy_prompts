prompt: |-
  Quick background so this makes sense: I'm on the committee that runs our town's hardship fund. It's a small thing -- every household pays in a few pounds a year and the fund pays out to people who can't work because they've got hurt or sick. Nobody on the committee has any training for this, we're just neighbours, and we vote.

  We've got three claims for next Tuesday and I have to circulate my written opinion before then, so I want to get it straight first.

  Our rulebook was written in the seventies and it says we pay for 'losses a member could not have foreseen and avoided.' Nobody has ever defined that phrase. Here's what's in front of us:

  1. A woman with a hip condition that runs in her family. Nobody knew she had it till it went. Clear enough -- we pay.

  2. A man who broke his back riding a motorbike round the bypass with no helmet. He knew the risk, everyone knows the risk. Half the committee wants to refuse him on the grounds that he foresaw it and could have avoided it.

  3. This is the one tying me in knots. A man in his fifties with a bad heart that his father and his brother both died of. He knew about it. His doctor told him to stop the fried food and the cigarettes and he carried on for years, and then came the heart attack that's put him out of work. So the loss was partly the hand he was dealt and partly what he did with it, and I can't see how to seperate the two. Whatever we decide for 1 and 2, case 3 doesn't fit either box.

  There's a fourth thing nagging at me too, not on the list but it'll come up. Case 2's man could have bought private insurance and chose not to. Another claimant we had last year couldn't have bought it because she hadn't got the money. Is there really a difference between choosing to go without cover and never being able to afford it? I think there might be, but I can't say why it should matter.

  What I want from you is the written opinion I'll read out at the meeting: a clear recommendation for each of the three cases, a time frame for when we tell them, and an honest go at the best argument for whichever side I'm coming down against. Don't just tell me what the rulebook says, I can read the rulebook.

  And be straight with me about where my reasoning is most likely to be wrong, and what would actually change your mind -- what would have to be true about case 3, or about the insurance question, for you to come down the other way.
reasoning: |-
  Okay, I'm looking at this user's query about their town's hardship fund committee. They need to make decisions on three cases based on vague 1970s rules about "losses a member could not have foreseen and avoided." 

  First, let's understand their situation. They're just ordinary neighbors running this fund, no formal training, and they vote on claims. The user is preparing written opinions for an upcoming Tuesday meeting. The three cases are:

  1. A woman with hereditary hip condition - seems straightforward to approve
  2. Motorbike rider without helmet - controversial, half the committee wants to deny
  3. Heart attack patient who ignored doctor's advice - the real puzzle

  Plus there's that nagging insurance question about affordability versus choice.

  Hmm... the user wants more than just rulebook interpretation. They need practical recommendations with clear reasoning, timelines, and arguments against their own position. And they specifically want me to point out where their thinking might be flawed.

  For Case 1: The hereditary hip condition clearly fits "unforeseen and unavoidable." Nobody knew she had it till symptoms appeared. Recommendation should be pay, no controversy here.

  For Case 2: The motorcyclist knew helmetless riding was dangerous. But... is that enough to deny? The rule says "could not have foreseen and avoided" - he definitely could have avoided it by wearing a helmet. But I should consider if there's any nuance - like was it an emergency? User doesn't mention that. Recommendation: decline, but with strong counterargument about shared community responsibility.

  Case 3 is the tough one. Genetic predisposition + personal choices. How to untangle? The key might be whether his actions were the primary cause versus the underlying condition. If medical evidence shows lifestyle was major factor, then his choices made it avoidable. But if the genetic component was dominant regardless, maybe not. Recommendation should acknowledge both aspects but lean toward paying partial/symbolic amount.

  The insurance question is philosophical. Difference between "can't insure" (no money) versus "won't insure" (choice). For the hardship fund's purpose, inability seems more sympathetic than refusal. But the rules don't mention insurance at all - that's the user's own concern. Should note this is outside current rules but worth future discussion.

  Where might the user be wrong? They're trying to fit Case 3 into Case 1 or 2 boxes, but it's hybrid. Also, focusing too much on "deservingness" versus the rule's actual wording. 

  What would change my mind? If Case 3 claimant had severe depression affecting decision-making, that might reframe the "avoidable" aspect. Or if genetic testing showed his heart condition was 100% fatal regardless of lifestyle.

  For the written opinion format: Clear verdicts per case, payment timelines (immediate for 1, delayed for 3), plus those requested counterarguments. And honesty about reasoning weaknesses - especially about moral judgment creeping in.
answer: |-
  Here is a clear, structured written opinion you can circulate for the meeting, addressing all your points directly:

  ---

  **MEMORANDUM: HARDSHIP FUND CLAIMS RECOMMENDATIONS**  
  **TO:** Committee Members  
  **FROM:** [Your Name]  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendations for Claims (Cases 1, 2, 3)  

  ### **Core Principle Applied**
  Our rulebook requires paying for "losses a member could not have foreseen and avoided." This hinges on **reasonable foreseeability** and **practical avoidability** from the perspective of an ordinary person in the claimant’s circumstances. It is not about moral blame, but whether the loss stemmed from forces beyond their control.

  ---

  ### **Recommendations & Reasoning**
  **CASE 1: Woman with hereditary hip condition**  
  - **Recommendation:** **APPROVE FULL PAYMENT**  
  - **Why:** The condition was asymptomatic and unknown until it manifested. She could neither foresee it (without medical screening beyond reasonable expectation) nor avoid it (as it was genetic). This is a textbook "unforeseen and unavoidable" loss.  
  - **Counterargument:** None compelling. Some might argue she "should have" suspected due to family history, but this imposes an unrealistic burden of medical vigilance on members.  
  - **Timeline:** Notify approval within **48 hours** of vote.  

  **CASE 2: Motorcyclist with back injury (no helmet)**  
  - **Recommendation:** **DENY PAYMENT**  
  - **Why:** Riding without a helmet is widely recognized as high-risk. He could reasonably foresee severe injury and easily avoided it by wearing a helmet (or not riding unprotected). The loss resulted directly from a voluntary, avoidable action.  
  - **Counterargument (for payment):**  
    - We are a *community* hardship fund, not an insurer. Denying claims based on personal choices sets a precedent of moral judgment, which our rules avoid.  
    - His need is genuine, and refusing may alienate members who see the fund as a safety net, not a punitive body.  
    - **Rebuttal:** Foreseeability/avoidability is central to our rules. Ignoring it here undermines the fund’s purpose and fairness to contributors.  
  - **Timeline:** Notify denial within **48 hours** with clear reasoning referencing the rule.  

  **CASE 3: Man with genetic heart condition who ignored medical advice**  
  - **Recommendation:** **APPROVE SYMBOLIC OR PARTIAL PAYMENT**  
  - **Why:** This is a hybrid case. The *underlying genetic condition* was foreseeable but unavoidable (he couldn’t change his DNA). However, his *choices* (smoking, diet) were avoidable and likely accelerated the loss.  
    - **Partial Payment Rationale:**  
      - Paying in full ignores his avoidable contribution to the loss.  
      - Denying entirely ignores the unavoidable genetic component.  
      - A partial/symbolic sum (e.g., 25-50% of standard payout) acknowledges both realities. It upholds the rule while recognizing shared responsibility.  
  - **Counterargument (for full payment):**  
    - Doctors advise many people; non-compliance doesn’t negate an underlying unavoidable condition. Punishing "bad patients" oversteps our mandate.  
  - **Counterargument (for denial):**  
    - His choices were the primary cause. Had he heeded advice, the heart attack might have been delayed or avoided, making the *timing* and *severity* of the loss foreseeable/avoidable.  
  - **Timeline:** Notify decision within **48 hours**. If partial payment approved, specify the amount and reasoning.  

  ---

  ### **The Insurance Question (Non-Case Specific)**
  - **Does choosing not to buy insurance vs. being unable to afford it matter?**  
    **Yes, under our rules.**  
    - **Inability to afford insurance:** Makes the loss *unavoidable* (no alternative protection existed). This aligns with paying (e.g., last year’s claimant).  
    - **Choosing not to insure:** Makes the loss *avoidable* (protection was available and refused). This aligns with denying (e.g., Case 2’s motorcyclist).  
    - **Why it matters:** Insurance is a tool for *avoiding* financial loss. Deliberately rejecting it when affordable is a foreseeable risk, akin to not wearing a helmet. Our rules focus on economic avoidability, not just physical actions.  

  ---

  ### **Where My Reasoning Could Be Wrong & What Would Change It**
  1. **Case 3 (Partial Payment):**  
     - **Weakness:** Splitting the baby may feel unsatisfying and set a vague precedent.  
     - **What would change my mind to FULL PAYMENT:**  
       If medical evidence shows his heart condition was **inevitable within 5 years regardless of lifestyle**, making the loss unavoidable.  
     - **What would change my mind to DENIAL:**  
       If evidence confirms **lifestyle choices were the sole cause** (e.g., no genetic link, doctor stated "this would not have occurred with compliance").  

  2. **The Insurance Question:**  
     - **Weakness:** It introduces an external factor (insurance markets) not in our 1970s rules.  
     - **What would change my mind (to treat "can't insure" and "won't insure" alike):**  
       If the fund’s purpose is **solely to alleviate suffering**, not judge choices. But this would require a rule change, as it ignores avoidability.  

  ---

  ### **Key Takeaways for the Committee**
  - **Stick to the rule’s wording:** Avoid moralizing; focus on *foreseeability* and *avoidability*.  
  - **Case 3 is pivotal:** A partial payment acknowledges complexity without rewriting rules on the fly.  
  - **Future Action:** We **must** clarify the rulebook. Propose forming a subcommittee post-vote to draft modern guidelines (e.g., defining "foreseeable," handling contributory negligence).  

  Vote according to conscience, but remember: consistency today ensures fairness tomorrow.  

  ---  
  **END**  

  This gives you a defensible, balanced position that respects the rulebook while addressing real-world nuances. For Case 3, the partial payment approach is your strongest compromise—it acknowledges shared responsibility without needing medical expertise. If challenged, emphasize: *"We aren’t doctors, but we can see avoidable actions worsened an unavoidable condition. This respects both truths under our rules."* Good luck on Tuesday.
