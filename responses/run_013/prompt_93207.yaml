prompt: |-
  I'm writing a short paper for my school's philosophy club about an inconsistency I keep noticing in how we treat everyday conventions. Tipping is legally optional, yet a regular who leaves nothing is thought to have done something wrong; jaywalking is against the law, yet almost nobody treats a jaywalker as a wrongdoer; and a visitor to a country where nobody queues isn't blamed for not queueing, though a visitor who ignores a queue at home is. Institutions sometimes seem to take a side deliberately: some hotels and restaurants post a sign saying tips aren't expected or that a service charge is already included, and some cities have stopped ticketing jaywalkers even while the law stays on the books. I'd like the theory of obligation these practices presuppose. Is a convention like queueing binding because it is a shared practice a person has tacitly joined, because breaking it takes unfair advantage of others' restraint, or not at all — is it just etiquette? Reconstruct the view the practices assume, distinguish what they strictly presuppose from what they merely fit with, and identify which rival theories they quietly rule out. Then say what would have to change in how we instruct and judge visitors if we held that conventions bind only those who have accepted them. Please answer in one paragraph of no more than 300 words.
reasoning: |-
  Hmm, the user is writing a philosophy paper about inconsistencies in how we treat everyday conventions like tipping, jaywalking, and queueing. They've noticed that these practices have varying levels of obligation - sometimes legally optional but socially expected, sometimes illegal but culturally accepted, and sometimes binding only in certain contexts. They want me to reconstruct the underlying theory of obligation that these practices presuppose, distinguish between what's strictly presupposed versus what merely fits, identify rival theories that are ruled out, and explain implications for treating visitors if conventions only bind those who accept them.

  I need to analyze these examples to uncover the implicit theory. Tipping being legally optional but socially mandatory suggests norms create obligations beyond law. Jaywalking being illegal but culturally tolerated in some places shows that community practice can override formal rules. Queueing expectations varying by location highlights how local conventions determine obligations. The institutional actions (like no-tip policies or not enforcing jaywalking laws) indicate that obligation stems from active social endorsement rather than just existence of rules.

  The core presupposition seems to be that conventions bind through tacit participation in a cooperative practice where defection creates unfairness. This rules out strict voluntarism (since you're bound without explicit consent) and pure legalism (since obligation exists outside law). It also rules out universal moralism where conventions would bind regardless of context.

  If obligations required explicit acceptance, we'd need to explicitly instruct visitors about local conventions and withhold judgment until they understand and consent. We couldn't blame newcomers for unintentional violations - only for refusing to participate after understanding the practice. This would make convention-based obligations much more contextual and individualized.

  I'll structure this as one coherent paragraph under 300 words, directly addressing all parts of their query while maintaining philosophical precision. I'll highlight how these practices assume obligation arises from participation in cooperative schemes, distinguish this from rival theories, and clearly outline the visitor treatment implications.
answer: |-
  The practices presuppose that conventions generate obligations through *tacit participation in a cooperative scheme* where defection constitutes unfair free-riding. Strictly, they assume an obligation arises not merely from the convention's existence ("it's done here") or the law ("it's illegal"), but from *actively benefiting* from others' compliance while refusing to reciprocate, thereby exploiting their restraint. This rules out theories where obligation requires explicit consent (strict voluntarism) or stems solely from the law (legal positivism applied to norms). It also rules out the view that conventions are merely non-binding etiquette with no moral force. The institutional actions (waiving tips, not enforcing jaywalking) fit this by signaling when the cooperative expectation is suspended, negating the unfairness condition. If conventions only bound those who explicitly accepted them, instructing visitors would require clearly articulating the local norm *as a cooperative expectation* and obtaining their agreement to participate before judging non-compliance. We could not blame a visitor for initial ignorance or refusal before this explicit offer and acceptance; judgment would apply only if they later violated the norm after knowingly joining the scheme. Blame would shift from breaking an unspoken rule to breaching a specific, acknowledged agreement.

