prompt: |-
  You are a philosopher working at the intersection of bioethics and the metaphysics of the self. Before writing, brainstorm the structural variables that make advance-directive cases hard, then give me only the finished product.

  I need a thought experiment built to order, for a unit on advance directives and the authority of the earlier self. Constraints for the scenario: realistic clinical setting, no science fiction, and no more than one paragraph. The patient must be competent when she writes the directive and competent by ordinary criteria when the dispute arises, so competence itself settles nothing; the treatment at issue must be medically indicated; and the directive's formal validity must be beyond dispute. The engine of the case should be that the later self's change of evaluative outlook was produced by the very intervention the directive refuses (a treatment with known personality-altering effects), and that the earlier self foresaw this and wrote in an anti-revision clause: follow the directive even if I later endorse the change and am glad of it. Make the later self's endorsement sincere and vivid.

  Then, in labeled sections, show that the case does its job. Give the verdict of (i) the precedent-autonomy view, on which the earlier competent self's directive has authority because autonomy extends across time and protects critical interests; (ii) the present-interests view, on which only the present self's experienced interests and current wishes have standing; and (iii) a narrative-continuity view, on which the directive binds only insofar as the later self can own it as part of one continuing life story. For each, state the verdict and the feature of the case it turns on.

  Then isolate the variable: state exactly what each view does if you delete the anti-revision clause and change nothing else, and whether any verdict flips. Finish with the honest part: name the single feature doing the real work, explain how a defender of the view that comes out worst would attack the case as rigged, and confirm what the case is for. I will use it to teach that precedent-autonomy and present-interests views can come apart even when competence and formal validity are held fixed, so the verdicts must fall out of the theories rather than be stipulated. Do not cite literature or supply reading lists.
reasoning: |-
  Okay, the user wants me to create a thought experiment for a bioethics unit on advance directives. They need a realistic clinical scenario where the patient was competent when writing the directive and remains competent when the dispute arises. The key elements are: the treatment refusal causes personality changes that make the later self accept those changes, and there's an anti-revision clause in the directive.

  I need to brainstorm the structural variables that make advance-directive cases difficult. These include competence at both writing and implementation stages, the medical necessity of the refused treatment, formal validity of the document, and the mechanism of the later self's changed perspective being caused by the very treatment that was refused. The anti-revision clause is crucial - it specifies that the directive should be followed even if the patient later endorses the changes.

  For the thought experiment, I'll create a scenario involving a concert pianist named Elara who develops early-onset Alzheimer's. She writes an advance directive refusing memantine (a real medication with known personality-altering effects) because she fears it will make her indifferent to her cognitive decline. When her disease progresses and she becomes incompetent, her husband requests the memantine treatment against her directive. After treatment, she becomes content with her condition - precisely what she feared - and now wants to continue treatment. But her directive included an anti-revision clause.

  I'll structure the analysis in three labeled sections corresponding to different philosophical views: precedent-autonomy view (favors following directive), present-interests view (favors current wishes), and narrative-continuity view (ambiguous). For each, I'll identify the verdict and what feature of the case it turns on.

  Then I'll isolate the variable by showing what happens if we remove the anti-revision clause while keeping everything else the same. Only the narrative view's verdict would flip in this scenario. 

  Finally, I'll identify that the anti-revision clause is doing the real work in creating the tension. A defender of the present-interests view might argue the case is rigged because it prioritizes critical interests over experiential ones, but this case effectively shows how the theories diverge even when competence and validity are fixed.

  The thought experiment needs to be concise (one paragraph), clinically realistic, and meet all constraints: competence at both ends, medically indicated treatment, valid directive, and the core conflict between earlier and later selves created by the treatment-induced personality change with the anti-revision clause.
answer: |-
  ### Thought Experiment
  Elara, a concert pianist with early-onset Alzheimer’s, writes a valid advance directive while fully competent. She refuses memantine—a drug that modestly slows cognitive decline but carries a known risk of inducing apathy and diminished emotional depth—stating: "Do not administer memantine under any circumstances, even if I later appear content with my cognitive losses. I value my capacity for passionate engagement over prolonged existence without it." Years later, as her dementia progresses, her husband petitions for memantine (now medically indicated to preserve basic function). Elara, though still legally competent, exhibits flattened affect and tells her care team: "I’m glad things are simpler now. I want the drug." When shown her directive, she calmly replies: "That person was too intense. I prefer this peace."

  ---

  ### Analysis of Verdicts  

  **(i) Precedent-autonomy view**  
  *Verdict*: Follow the directive.  
  *Turns on*: The earlier self’s binding authority over critical interests (here, preserving her "passionate engagement" as core to identity). The anti-revision clause explicitly rejects later endorsement if caused by the refused intervention.  

  **(ii) Present-interests view**  
  *Verdict*: Administer memantine.  
  *Turns on*: Only the current self’s experientially verifiable well-being matters. Elara now *sincerely* values "peace" over past intensity and suffers no conflict.  

  **(iii) Narrative-continuity view**  
  *Verdict*: Ambiguous; likely follows the directive.  
  *Turns on*: The later self’s inability to integrate the directive into her life story. Post-memantine Elara disowns her past values ("That person was too intense"), rupturing narrative unity. The clause makes the directive a "fixed point" she cannot coherently repudiate.  

  ---

  ### Variable Isolation: Delete Anti-Revision Clause  
  - **Precedent-autonomy**: Verdict *unchanged* (directive’s authority intact).  
  - **Present-interests**: Verdict *unchanged* (still prioritizes current wishes).  
  - **Narrative-continuity**: Verdict *flips* to administering memantine. Without the clause, the later self’s endorsement could be integrated as a "natural" evolution, preserving narrative continuity.  

  ---

  ### Honest Breakdown  
  **Feature doing the real work**: The anti-revision clause. It weaponizes the cause-effect loop (treatment → altered values → endorsement) to force a choice between temporal selves.  
  **Attack from the present-interests defender**: The case rigs "competence" by exploiting a pathology-induced value shift. Elara’s contentment is *inauthentic*—a chemical artifact, not a rational endorsement. Her current interests are thus invalid.  
  **What the case is for**: Demonstrating that precedent-autonomy and present-interests clash *solely* due to theoretical commitments (critical vs. experiential interests), even with fixed competence, validity, and medical necessity. Theories dictate verdicts; facts alone don’t resolve it.
