  The core tension they identify is fascinating: we need criteria that work both when a contradiction actually surfaces (Situation 1) and when we're perpetually in the shadow of potential inconsistency (Situation 2). The first scenario is like a mathematical emergency response plan, while the second is about living with chronic uncertainty.

  As I construct the desiderata, several dimensions emerge naturally. There's the epistemic dimension - how do we preserve mathematical knowledge? The practical dimension - how do working mathematicians proceed? The logical dimension - what constraints do results like Gödel's impose? And the social dimension - how does the community coordinate?

  The user specifically wants me to highlight irreconcilable tensions. That's where this gets particularly interesting. For instance, Gödel's second incompleteness theorem means we can't have both consistency-provable foundations and foundations strong enough for basic mathematics. And the "no cheap shots" requirement eliminates many tempting but insubstantial responses to the problem.

  I should emphasize that some desiderata are absolute (like non-collapse) while others involve trade-offs (like minimal mutilation versus preservation). The "cost of surrender" analysis will help the user weigh alternatives when conflicts arise. And naming "no cheap shots" as the gatekeeper requirement feels right - it's what separates serious foundations from hand-waving.
answer: |-
  Below are the desiderata for evaluating accounts of how mathematics should respond to the possibility of foundational inconsistency, structured as requested. These address both the **emergency scenario** (verified contradiction in a weak system) and the **chronic uncertainty scenario** (no contradiction found, but unprovable consistency). Requirements are classified as **non-negotiable** (essential for adequacy) or **preferential** (reflects philosophical/camp priorities), with justifications and conflicts identified.

  ---

  ### **Core Desiderata for an Adequate Account**

  1.  **Non-Collapse (Non-Negotiable)**  
      *   **What it demands:** Must prevent the trivialization of all mathematical truth. If a contradiction `(P ∧ ¬P)` is proven, the account must not imply that *all* statements are true (ex falso quodlibet).  
      *   **Case/Consideration:** Situation 1 (actual contradiction). Accepting ex falso quodlibet renders all past and future mathematical results meaningless. This is pragmatically and epistemically catastrophic for working mathematicians and learners.  
      *   **Cost of Failure:** Mathematics as a search for truth ceases.

  2.  **Preservation of Core Practice (Non-Negotiable)**  
      *   **What it demands:** The account must justify why working mathematicians can *generally continue* proving theorems in their current system without radical disruption, even after the contradiction or its possibility is acknowledged.  
      *   **Case/Consideration:** Both situations. Situation 1 requires explaining why most proofs remain reliable despite the contradiction. Situation 2 requires explaining why the mere possibility doesn't paralyze practice. The account must support the *rationality* of ongoing work.  
      *   **Cost of Failure:** Paralysis of mathematical research and education.

  3.  **Diagnostic Capability (Preferential - but highly valued)**  
      *   **What it demands:** In Situation 1, the account must provide principles or methods for identifying the likely culprit(s) among axioms, definitions, or rules, and for evaluating proposed repairs.  
      *   **Case/Consideration:** Situation 1. Without diagnostics, repairs are arbitrary or stalemated. Reflects a "debugging" mindset common among practitioners.  
      *   **Camp:** Favored by realists and those prioritizing systematic error correction. Less crucial for staunch holists or certain pragmatists.

  4.  **Minimal Mutilation (Preferential)**  
      *   **What it demands:** Repairs proposed in Situation 1 should alter or remove as little established, fruitful mathematics as possible ("Save the phenomena").  
      *   **Case/Consideration:** Situation 1. Mathematicians have strong intuitions about which results are "secure" (e.g., finite combinatorics vs. large cardinal axioms). Sacrificing core areas like analysis or number theory is unacceptable.  
      *   **Camp:** Favored by realists and conservative revisionists. Prioritized less by radicals willing to rebuild from a smaller base.

  5.  **Stability Under Uncertainty (Non-Negotiable)**  
      *   **What it demands:** The account must function rationally and guide practice *even if we never know* whether the system is consistent (Situation 2). It must address the chronic possibility implied by Gödel's second incompleteness theorem.  
      *   **Case/Consideration:** Situation 2 is the permanent background state. The account cannot rely on eventually resolving the consistency question definitively.  
      *   **Cost of Failure:** The account is irrelevant to actual foundational uncertainty.

  6.  **No Cheap Shots (Non-Negotiable)**  
      *   **What it demands:** The account cannot dismiss the problem by:  
          (a) Appealing to unformalized "intended models" without explaining how they ground practice under inconsistency/uncertainty.  
          (b) Claiming the contradiction is "not relevant" to "real mathematics" without a robust criterion for relevance.  
          (c) Shifting to a much stronger system (e.g., adding large cardinals) to trivialize the original contradiction.  
      *   **Case/Consideration:** Both situations. Addresses the user's stipulation: the contradiction is verified in a *weak* system, and "exotic extension" replies are blocked. Precludes facile dismissals.  
      *   **Cost of Failure:** Evasion of the problem; failure to engage with the stipulated scenarios.

  7.  **Rational Guidance for Repair/Adoption (Non-Negotiable)**  
      *   **What it demands:** The account must provide objective criteria (beyond mere consistency) for communities to choose between rival repaired foundations or assess the risk/reward of adopting new ones, especially in Situation 2.  
      *   **Case/Consideration:** Both situations. Needed for building formal libraries, textbooks, and research programs. Decisions must be justifiable, not arbitrary.  
      *   **Cost of Failure:** Fragmentation and ad hoc decision-making, undermining shared mathematical knowledge.

  8.  **Epistemic Responsibility (Preferential)**  
      *   **What it demands:** The account should explain the epistemic status of mathematical beliefs in light of the inconsistency/uncertainty. Are theorems merely instrumental? Are some areas more secure than others? Why?  
      *   **Case/Consideration:** Both situations. Important for philosophers and reflective practitioners. Less critical for purely pragmatic "just keep going" approaches.  
      *   **Camp:** Favored by realists, quasi-realists, and fallibilists. Less emphasized by strict formalists or instrumentalists.

  ---

  ### **Key Conflicts and Unsatisfiable Combinations**

  1.  **Diagnostic Capability + Minimal Mutilation + Gödel's Second Theorem:**  
      *   **Conflict:** Gödel II implies that a consistent system `S` (of sufficient strength) cannot prove its own consistency. A truly minimal repair (keeping `S` minus the specific culprit) might *still* be unable to *prove* its own consistency. Diagnostic principles aimed at minimal mutilation might not yield systems that can certify their own safety.  
      *   **Resolution:** Give up the demand that the *repaired* system *prove* its own consistency as a criterion for adequacy (it's impossible). Rely on other criteria for stability (e.g., track record, relative consistency to a weaker base). **Cost:** Accepts that even after repair, consistency uncertainty remains inherent.

  2.  **Epistemic Responsibility (Realist Interpretation) + Stability Under Uncertainty:**  
      *   **Conflict:** A strong realist desires certainty of truth. Situation 2 (permanent unprovable consistency) means we can never be certain our theorems correspond to a consistent reality. Strict realism struggles to justify continued belief in theorems as *true* under chronic uncertainty.  
      *   **Resolution:** Give up strict realism for epistemic truth (justified belief under ideal conditions) or instrumentalism/pragmatism. **Cost:** Abandons the view that mathematics is about mind-independent truth discovered with certainty.

  3.  **Minimal Mutilation + Rational Guidance for Repair (in Situation 1):**  
      *   **Conflict:** If no consensus emerges on the "culprit" or different repairs preserve different vital areas, Minimal Mutilation alone provides no rational way to choose between rival repairs. "Minimal" becomes ambiguous.  
      *   **Resolution:** Give up the idea that Minimal Mutilation is sufficient for Rational Guidance. Supplement with other criteria (e.g., generality, fruitfulness, simplicity, compatibility with intended applications). **Cost:** Admits that preserving mathematics is not the *only* factor in choosing foundations; other values (efficiency, elegance, scope) play a role.

  ---

  ### **The Gatekeeper Requirement: No Cheap Shots**

  The requirement that **excludes the most otherwise attractive accounts** is **"No Cheap Shots" (6)**. Many intuitively appealing responses fail here:

  *   **"Trust the Intended Model"**: Violates (6a). Doesn't explain how the model functions after inconsistency is proven within the formal system defining it.
  *   **"The Contradiction is Pathological"**: Violates (6b). Without a rigorous criterion for "pathological," this dismisses the problem arbitrarily.
  *   **"Move to a Higher Universe/Stronger System"**: Violates (6c). Directly contravenes the stipulation that the contradiction is in a weak system and exotic extensions are unavailable.
  *   **Strict Formalism ("It's just a game with symbols")**: Often violates (6b) and struggles with (2) and (7). Why care about the "game" if it produces contradictions? Why choose one set of rules over another?
  *   **Radical Revisionism ("Start over completely")**: Often violates (4) Minimal Mutilation catastrophically and struggles with (2) Preservation of Core Practice.

  "No Cheap Shots" forces accounts to confront the problem head-on within the stipulated, challenging parameters, disqualifying evasive maneuvers and requiring substantive engagement with the core tension between established practice and foundational vulnerability.

  ---
  This framework provides the necessary standard: an adequate account must satisfy the **Non-Negotiables** (1, 2, 5, 6, 7) while navigating the tensions inherent in the **Preferential** requirements (3, 4, 8) and the logical constraints revealed by the conflicts. Its adequacy hinges on enabling mathematics to function rationally and productively as both a body of knowledge and an ongoing practice, despite the specter of inconsistency.
