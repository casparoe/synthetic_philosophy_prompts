  Hmm, let me brainstorm some objections. The strongest one might be that many real-world signals combine both mechanisms. Take a college degree - it has both differential cost (harder for less capable people) and commitment value (sunk cost locking you into career paths). Their subsidy test might not cleanly separate these in practice.

