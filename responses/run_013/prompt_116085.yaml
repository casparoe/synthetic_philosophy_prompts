  ## FOUNDING PROSPECTUS OF THE SOCIETY FOR THE VERIFICATION OF POST-MORTEM CONTINUITY (S.V.P.M.C.)

  **Objects, Methods, and Schedule of Work (Draft for Members' Consideration)**

  *Secretary: Mortimer Thwaite, B.A. (Cantab.)*

  **1. Objects:** The Society is instituted with the primary object of determining, through rigorous empirical investigation, the factual basis concerning the survival of individual consciousness beyond the event known as biological death. A collateral object, contingent upon the establishment of said survival, is the ascertainment of the *character* of such post-mortem existence, particularly as it bears upon the moral constitution and ultimate ends of the individual.

  **2. The Practical Question:** It is acknowledged that the Society’s investigations bear upon a profound philosophical difficulty, sometimes termed the "Practical Question": namely, the apparent dichotomy between the rational pursuit of individual interest and the demands of disinterested duty towards the general good. Certain philosophical perspectives (alluded to, *inter alia*, in the ethical writings of Professor Sidgwick) suggest that irrefutable evidence of post-mortem continuity, particularly one wherein interest and duty are demonstrably conjoined, might resolve this impasse. The Society concerns itself solely with the empirical component potentially underlying such a resolution.

  **3. Methodological Principles:**
      3.1. **Scrupulous Neutrality:** All investigations shall be conducted with impartiality, admitting no preconception as to the desired outcome. Fraud, conscious or unconscious, shall be the primary hypothesis against which all evidence is tested.
      3.2. **Documentation:** A complete and verbatim record of sittings, experiments, and witness testimony shall be maintained in the Society’s archives.
      3.3. **The Ladder of Evidence:** Claims shall be evaluated according to the following ascending hierarchy of credibility:
          *   **Rung I:** Coincidence or Subjective Impression (e.g., feeling a 'presence', vague dreams).
          *   **Rung II:** Veridical Hallucination (e.g., seeing a figure later verified to be deceased, but lacking novel information).
          *   **Rung III:** Verifiable Single Fact (e.g., accurate communication of a hidden object's location, known only to deceased).
          *   **Rung IV:** Coherent Narrative Fragment (e.g., sustained communication providing specific, verifiable details about a past event unknown to the medium).
          *   **Rung V:** **Verified Continuity:** Repeated, independent, cross-checked communications across multiple vetted mediums, containing substantial, verifiable information demonstrably unknown to any living person, and exhibiting the consistent personality traits and knowledge base of the purported deceased communicator.
      3.4. **Settlement of the Practical Question:** It is resolved that **only evidence attaining Rung V** on the Ladder shall be considered sufficient grounds for the Society to formally declare empirical support for the resolution of the Practical Question as conceived in Clause 2. Evidence on lower rungs, while potentially suggestive for further study, is deemed insufficiently robust for this specific determination.

  **4. Schedule of Work:**
      4.1. **Census of Phantasms (Years 1-3):** Systematic collection and cross-referencing of spontaneous apparitional experiences coinciding with death, employing standardized questionnaires distributed to medical professionals, clergy, and the general public.
      4.2. **Mediumistic Investigation (Ongoing):**
          *   4.2.1. Establishment of a panel of rigorously tested mediums (physical, trance, automatic writing).
          *   4.2.2. Design and execution of controlled sittings under conditions precluding sensory leakage or collusion.
          *   4.2.3. Development of standardized tests involving concealed information known only to deceased individuals (e.g., sealed depositions lodged with legal firms).
      4.3. **Sub-Committee for Fragmentary Communications (Established Year 2):** Charged with collating and analysing messages purportedly arriving piecemeal via diverse channels (e.g., automatic writing fragment A, table-tipping fragment B, subsequent dream fragment C). To assess coherence, verifiability, and potential cross-reference across sittings and mediums. Annual report required.
      4.4. **Instrumentation & Physical Phenomena (Years 3-5):** Exploration of measurable physical correlates (e.g., temperature fluctuations, raps, luminous phenomena) associated with alleged spirit agency. Collaboration with physicists and instrument-makers sought.

  **5. Funding & Specific Endowments:**
      5.1. The Society gratefully acknowledges the generous initial endowment from Mr. Josiah Atherton-Blythe.
      5.2. In accordance with the express terms of Mr. Atherton-Blythe's bequest, the Society shall, in its official communications and reports concerning the potential moral implications of its findings (should any be established), employ the phrase **"the reconciliation of Duty and Interest"** when referring to the potential resolution of the Practical Question (Clause 2). The Secretary notes this requirement for the record.

  **6. Contingencies & Duration:**
      6.1. Should evidence robustly attaining Rung V fail to materialise within a period of twenty-five (25) years from the Society's founding, a Special Review Committee shall be convened.
      6.2. This Committee shall assess:
          *   6.2.1. Whether methodological refinements offer reasonable prospect of success within a further defined period.
          *   6.2.2. Whether the absence of evidence, persisting despite exhaustive and methodologically sound investigation, possesses any philosophical weight regarding the Practical Question.
      6.3. **Resolution of the Practical Question:** The Society explicitly disavows any capacity to resolve the Practical Question *philosophically*. Its remit is solely empirical. Should conclusive empirical evidence (Rung V) supporting survival *not* be secured, the Society shall confine its conclusions to the state of the evidence gathered, explicitly stating its inability to provide an empirical basis for resolving the aforementioned dichotomy. The philosophical impasse, in such an event, remains extant and outside the Society's purview. The Society may continue its investigations indefinitely, pending funding and membership, as a purely empirical endeavour.

  **7. Publication:** Annual Proceedings detailing methods, findings (positive and negative), and critical analysis shall be published for the scrutiny of the scientific community and the interested public. Final determinations regarding Rung V evidence and its bearing on Clause 2 shall be published as Special Reports.

  *Mortimer Thwaite, Secretary pro tem.*
  *London, October 1882*
