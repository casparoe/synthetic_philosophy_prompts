prompt: |-
  I teach a 75-minute session in an MA seminar on metaphysics and action, with sixteen students, and I want a runnable activity that makes them feel the force of the view that omissions can be causes, and then the countervailing worry that if every omission is a cause, causation loses its explanatory and normative grip. I have spent years in rationalist blogs and forums where this distinction is litigated, so I want the activity to do the work rather than a lecture. The participants should run into the problem themselves before it is named. Set up a simple shared-resource scenario with turns, private choices, and a harm that occurs only if nobody intervenes; arrange the payoffs so that each participant can truthfully say I did not do it, while the bad outcome is massively overdetermined by many omissions. Keep a ledger in which every player's non-action is recorded as a line item, initially with no distinction between a failure and a choice. Then run a second round in which the same abstention is embedded in an explicit duty, rota, or role, so that the same not-doing suddenly looks like the cause. I want them to feel the pull of counterfactual dependence — if I had acted, it would not have happened — and then to feel how cheap that makes causation, since each of them can say the same. The debrief should map what happened onto the distinction between making and allowing, the role of norms in causal selection, and the difference between explaining an outcome and assigning responsibility. Give me rules, materials, roles, a timeline, a payoff scheme that does not need real money, and an honest note on what will predictably go wrong the first time I run it. Also be frank about which feature of the metaphysical debate the activity cannot reproduce and that I shall have to supply in the debrief. No lecture up front, and do not let the terms of art appear until the debrief. Please write the answer in British English.
reasoning: |-
  We are designing a classroom activity for a 75-minute MA seminar on metaphysics and action. The goal is to help students experience the tension between omissions as causes and the problem of overdetermination. We will use a shared-resource scenario with turns and private choices. The activity will have two rounds: one without explicit duties and one with. We avoid using terms like "omission" or "causation" until the debrief.

  **Title of Activity:** The Commons Rescue

  **Overview:**
  Students are members of a community that shares a common resource (a virtual pond). The pond has a problem (it is about to be poisoned) that will cause harm (kill the fish) unless at least one person intervenes by paying a small cost to rescue it. Each student has a turn in which they can choose to rescue or not. The harm occurs only if nobody rescues. However, the setup is such that if one person rescues, the harm is averted. The twist is that each student has a private choice and the harm is overdetermined by the omissions of all.

  **Materials:**
  - A ledger (a shared document, e.g., on a whiteboard or projected Google Sheet) to record choices. The ledger has columns: Player, Choice (Rescue/Not), and in the second round, an additional column for Role (if any).
  - Sixteen slips of paper or private digital forms for choices (to keep choices private until revealed).
  - A timer.

  **Setup:**
  - Arrange the room so that students are in a circle or rows, but ensure they cannot see each other's choices.
  - Explain that they are going to play two rounds of a simple game about community responsibility.

  **Round 1: The Unstructured Commons**

  **Rules:**
  1. Each player has a unique number from 1 to 16 (assign randomly).
  2. The game proceeds in 16 turns. On each turn, the player whose number it is will be asked to make a private choice: they can either **Rescue** the pond or **Not Rescue**.
  3. The cost of rescuing is 2 points. The benefit of having the pond rescued (for everyone) is that they avoid a loss of 1 point each (from the death of the fish). However, if at least one person rescues, the pond is saved and no one loses the point. If no one rescues, everyone loses 1 point.
  4. Importantly, players are told that the harm (losing 1 point) will occur only if every single player chooses not to rescue. But if even one person rescues, the harm is averted for all.
  5. Each player's payoff:
     - If they rescue: they pay 2 points.
     - If the pond is saved (at least one rescue): they get 0 additional cost (so no loss from the fish, but if they rescued, they lose 2).
     - If the pond is not saved (no rescues): they lose 1 point (so if they did nothing, they lose 1; if they rescued, they would have paid 2 and still get the loss of 1? That doesn't fit. Let's revise.)

  **Revised Payoff Scheme (No real money, use points):**
  - Each player starts with 10 points.
  - If a player chooses to rescue, they lose 2 points (so they pay 2).
  - The outcome of the pond:
    - If at least one player rescues: the pond is saved. No additional loss to anyone.
    - If no one rescues: the pond is poisoned and every player loses an additional 1 point.

  Therefore, payoffs:
  - A player who rescues: 10 - 2 = 8 points (if the pond is saved by them or someone else) OR if no one rescues (including if they are the only one and they did rescue? But note: if they rescue, then the pond is saved because at least one rescue. So they always get 8 in the event they rescue, because their action saves the pond).
    - Actually, if they rescue, the pond is saved. So they pay 2 and avoid the 1 point loss? But they would avoid the 1 point loss anyway if someone else rescues. So the payoff for a rescuer is always 8 (10 - 2). They don't get the 1 point loss because the pond is saved by their action (or by someone else's, but if they rescue, they are that someone).
    - For a non-rescuer: if the pond is saved (by someone else), they get 10. If the pond is not saved, they get 10 - 1 = 9? That doesn't seem to create the right incentive because 9 is more than 8. We want to make rescuing costly and not rescuing free-riding attractive, but also to set up the overdetermination.

  We need to adjust the payoffs so that:
  - Rescuing is individually costly, but if no one rescues, everyone is worse off than if at least one had rescued.

  Let me propose:
  - Each player starts with 10 points.
  - Rescuing costs 2 points (so if you rescue, you pay 2 regardless).
  - If the pond is saved (at least one rescue), then there is no additional loss.
  - If the pond is not saved (no rescue), then every player loses 3 points.

  Then:
  - If a player rescues and the pond is saved (which it will be because of their action): they have 10 - 2 = 8.
  - If a player does not rescue but the pond is saved (because someone else did): they have 10.
  - If no one rescues: every player has 10 - 3 = 7.

  Now, note that in the event of no rescue, a player who did not rescue gets 7, which is less than 8. So they would prefer that someone rescues (so they get 10) or if they must, they would prefer to rescue and get 8 rather than 7. But if they think someone else might rescue, they would rather not rescue and get 10. This creates a free-rider problem.

  But note: the harm (the loss of 3) only happens if no one rescues. So each player can think: my rescue is only necessary if no one else rescues. But since there are 16 players, the chance that no one else rescues is low? We want to set up a situation where many (or all) might choose not to rescue.

  However, our goal is not to study free-riding per se but to create a scenario where the harm (the loss of 3) is overdetermined by the omissions of all. And we want each to feel that if they had acted, they would have prevented the harm.

  **Procedure for Round 1:**
  1. Explain the rules and payoffs clearly. Write them on the board.
  2. Emphasize that choices are private and made in turn.
  3. Each player, when their turn comes, will be given a slip of paper (or a private digital form) to mark their choice: Rescue or Not Rescue. They should not reveal their choice until the end.
  4. The teacher collects the choices and records them in the ledger (without revealing to the class until the end of the round). The ledger for Round 1 has:
     - Player Number | Choice (Rescue/Not) | Outcome (but we record the choice only for now, outcome is determined at the end)
  5. After all 16 turns, the teacher checks if there was at least one Rescue. If yes, announce the pond is saved. If no, announce the pond is poisoned and everyone loses 3 points.
  6. The teacher then reveals the entire ledger and announces each player's final points (which they can calculate individually).

  **Expected outcome in Round 1:**
  It is highly likely that no one will rescue because each might think that someone else will do it. This is the classic free-rider problem. Therefore, the harm (the loss of 3) will occur. Each player will see that they chose not to rescue and that if they had chosen to rescue, they would have saved the pond (and had 8 points instead of 7). But note: if any one of them had acted, the harm would have been averted. So each omission is a cause? But there are 16 omissions, and any one of them could have made the difference.

  **Round 2: The Rotating Duty**

  In this round, we change the setup by assigning an explicit duty. We assign a rota: each player is assigned a specific turn and told that it is their responsibility to rescue on that turn if they are the one on duty. The duty rotates so that each player is on duty for one turn (but note: we have 16 players and 16 turns, so each turn has one player on duty). However, we want to make it so that if the person on duty does not rescue, then the harm occurs? But note: we want the same structure as before, so that if any one person (even not on duty) rescues, the harm is averted. But we are going to create a norm that the person on duty is expected to rescue.

  **Rules for Round 2:**
  1. Assign each player a turn number (same as before) and now tell them that on their assigned turn, they are the designated officer. As the designated officer, they have a special responsibility to rescue the pond on their turn.
  2. The rule of the pond is the same: if at least one person rescues (on any turn, whether they are the officer or not), the pond is saved. If no one rescues, the pond is poisoned and every player loses 3 points.
  3. However, we change the payoff for the designated officer:
     - If a player is the designated officer on their turn and they do not rescue, they incur an additional penalty of 2 points (so they lose 5 points in total if the pond is not saved, or 2 points if the pond is saved by someone else) but wait, we need to adjust.

  We want to make the duty matter. So we add a norm and a penalty for violating the duty.

  Proposed payoffs for Round 2:
  - Each player starts with 10 points.
  - Rescuing always costs 2 points (regardless of duty).
  - If the pond is saved: no additional loss.
  - If the pond is not saved: every player loses 3 points.
  - Additionally, if a player is the designated officer on their turn and they choose not to rescue, they incur an extra penalty of 2 points (for failing their duty) regardless of whether the pond is saved or not.

  So:
  - For a designated officer:
    - If they rescue: they pay 2 points. So if the pond is saved (which it is because of them or someone else), they have 8.
    - If they do not rescue:
        - If the pond is saved (by someone else): they lose 2 points (for failing duty) so they have 10 - 2 = 8? But then they are no better off than if they had rescued? We want to make failing the duty costly even if the pond is saved. But note: in this case, the pond is saved so they don't get the 3-point loss. But they do get the 2-point penalty for failing duty. So they end up with 10 - 2 = 8. But if they had rescued, they would have also ended up with 8. So there is no extra cost for failing duty if the pond is saved? That doesn't create a strong incentive to rescue when on duty.

  Alternatively, we can make the penalty for failing duty only if the pond is not saved? But then if they think someone else will save, they can avoid the penalty. We want the duty to matter regardless.

  Alternatively, we can make the penalty for failing duty independent of the outcome and high enough to make rescuing when on duty the dominant strategy.

  Let me try:
  - Penalty for failing duty (if you are the officer and you do not rescue) is 4 points. Then:
    - If an officer rescues: they pay 2, so 8 points (and they avoid the penalty).
    - If an officer does not rescue: they get penalized 4 points. So if the pond is saved by someone else, they have 10 - 4 = 6. If the pond is not saved, they have 10 - 4 (penalty) - 3 (loss from harm) = 3. So they are worse off than if they had rescued.

  But note: we don't want the duty to be so strong that it forces action. We want the same abstention to now look like a cause because of the duty.

  Alternatively, we can avoid changing the payoffs and just change the norm. But we are going to tell them that they have a duty and that they will be held accountable. Then, in the debrief, we point out that the same not-doing now feels like a cause because of the duty.

  But to make it salient, let's change the payoff for the officer who fails to rescue:

  - If you are the officer and you do not rescue on your turn, you lose 2 additional points (as a penalty) regardless of the outcome.

  Then:
  - Officer who rescues: 8 points (if pond saved) which is the same as before.
  - Officer who does not rescue: 
     - If pond saved: 10 - 2 (penalty) = 8? That's the same as rescuing? Then why rescue? We need to make the penalty for failing duty higher than the cost of rescuing.

  So let the penalty for failing duty be 3 points? Then:
  - Officer who rescues: 10 - 2 = 8.
  - Officer who does not rescue: 10 - 3 (penalty) = 7, if the pond is saved. And if the pond is not saved, they get 10 - 3 (penalty) - 3 (harm) = 4.

  But if the pond is saved, they get 7 which is worse than 8. So they have an incentive to rescue to avoid the penalty.

  But note: if they think the pond will be saved by someone else, they might still not rescue and get 7, which is worse than rescuing (8). So they would prefer to rescue to get 8. But if they are the officer, they have a strong incentive to rescue.

  For non-officers, the payoffs are the same as Round 1.

  **Procedure for Round 2:**
  1. Assign the same turn order. Tell each player that on their assigned turn, they are the designated officer and have a special duty to rescue the pond on that turn. Emphasize that if they fail to do so, they will be penalized 3 points (regardless of the outcome).
  2. The pond rule is the same: if at least one rescue occurs (by anyone, on any turn), the pond is saved. If none, everyone loses 3 points.
  3. Each player, on their turn, makes a private choice: Rescue or Not.
  4. The ledger now has columns: Player, Role (Officer or not), Choice, Penalty (if applicable), and Outcome.
  5. After all turns, reveal the choices and calculate the points.

  **Expected outcome in Round 2:**
  Because of the penalty, officers are more likely to rescue. But it is still possible that an officer might think that someone else will rescue and so they might avoid the cost of rescuing (and just take the penalty of 3, which is worse than rescuing if the pond is saved? 7 vs 8). So they might still choose to rescue because 8>7. But if they are risk averse or if they think the penalty is too high, they will rescue. However, we might see some officers failing to rescue and being penalized. But the key point is that if an officer fails to rescue and the harm occurs, then that omission (by the officer) will be seen as the cause because they had a duty.

  **Timeline (75 minutes):**

  1. **Introduction (5 minutes):** Explain the scenario (without using technical terms). Tell them they are going to play two rounds of a game about a shared pond. Explain the rules and payoffs for Round 1. Emphasize privacy of choices.

  2. **Round 1 (20 minutes):**
     - Assign numbers (1-16) to students.
     - Go through each turn (1 to 16). On each turn, call the number and give that player a slip to mark their choice (Rescue/Not). Collect the slip immediately and record it in the ledger (without revealing).
     - After all turns, determine if the pond was saved. Announce the outcome and reveal the ledger. Have each student calculate their points.

  3. **Round 2 (20 minutes):**
     - Explain the new rule: the rotating duty. Assign each player as the designated officer on their turn. Explain the penalty for failing to rescue when on duty (3 points). The rest of the rules and payoffs are the same.
     - Play the round again: same turn order, private choices.
     - Record in the ledger (with the additional Role and Penalty columns).
     - After all turns, reveal the choices and calculate the points.

  4. **Debrief (30 minutes):**
     - Start by asking the students about their experience. 
     - Focus on Round 1: Ask them if they felt that their own inaction caused the harm? Why or why not? Note that each of them could have prevented the harm by acting. But why didn't they? (Free-rider problem).
     - Then ask: if the harm occurred (because no one rescued), then who caused it? Each of them? But that seems too many causes? Note the overdetermination: any single action would have prevented the harm, so any single omission was sufficient? But then the harm has 16 causes? That seems absurd.
     - Now turn to Round 2: Ask about the officer(s) who did not rescue. Did they feel that the officer's inaction was particularly causal? Why? Because of the duty? Because we expected them to act? Because they were supposed to be the one?
     - Then introduce the terms: omissions, causation, overdetermination, norms, and causal selection.
     - Map to the philosophical distinctions:
          - Making vs allowing: In Round 1, they allowed the harm by not acting. In Round 2, the officer's inaction might feel more like making the harm happen because of the duty.
          - The role of norms in causal selection: We pick out the officer's omission as the cause because of the norm that they should have acted.
          - The difference between explaining the outcome and assigning responsibility: We can explain the harm by the collective omission, but we assign responsibility to the officer because of the duty.
     - Finally, note the worry: if every omission is a cause, then causation becomes cheap and loses its explanatory power. But with norms, we can select which omissions are the causes we care about.

  **What will go wrong the first time?**
  - **Time:** The activity might run over, especially if explaining and collecting choices takes longer than expected. The teacher must be strict with time.
  - **Confusion about payoffs:** Students might not understand the payoff structure. Write it clearly and do an example.
  - **Round 1 outcome:** It is very likely that no one will rescue in Round 1. But if by chance someone does, then the harm is averted. Then the teacher must adjust: note that if the harm is averted, then the problem of overdetermination does not arise. So the teacher might have to say: "Imagine that no one had rescued, what would you say then?" But that is less powerful. To avoid this, the teacher might secretly encourage a couple of students (beforehand) to not rescue, but that is not ideal. Alternatively, if the harm is averted, focus on the fact that any one of them could have been the one to cause the harm by not acting? But that is not the same. Alternatively, run Round 1 again? But time. So it's a risk.
  - **Round 2:** The officers might all rescue, so again the harm is averted. Then the teacher must ask: what if an officer had not rescued? Would that have been seen as the cause?
  - **Privacy:** It might be hard to keep choices private. Use private slips and collect them quickly.
  - **Calculating points:** This might be messy. Have a spreadsheet ready to calculate.

  **What the activity cannot reproduce:**
  The activity does not fully capture the metaphysical issue of whether omissions are genuine causes or merely absences. In the activity, we treat the omissions as if they are causes because we use counterfactual dependence (if you had acted, the harm would not have occurred). But in the metaphysical debate, some argue that omissions are not events and thus cannot be causes. The activity assumes counterfactual dependence is sufficient for causation, but that is precisely what is contested. Therefore, in the debrief, the teacher must note that the activity takes for granted a counterfactual theory of causation and that there are other theories that deny omissions can be causes. The teacher must then introduce the alternative views (e.g., that causation requires a positive event, or that omissions are not causes but only grounds for responsibility) and the challenges they face.

  **Honest note:** The activity might feel a bit artificial and the payoffs might not perfectly align with real-world motivations. But the goal is to create a shared experience to ground the abstract debate.

  **Rules Summary for Handout (for students):**

  **Round 1: The Commons**
  - You are part of a 16-member community sharing a pond. The pond will be poisoned if no one rescues it. If at least one person rescues, the pond is saved.
  - Each of you has a turn (numbered 1 to 16). On your turn, you choose privately: **Rescue** or **Not Rescue**.
  - Points:
    - Start: 10 points.
    - If you choose Rescue: lose 2 points.
    - If the pond is saved (at least one rescue): no additional loss.
    - If the pond is not saved (no rescue): everyone loses 3 points.

  **Round 2: The Rotating Duty**
  - Same as Round 1, except:
    - On your assigned turn, you are the **Designated Officer**.
    - As the Designated Officer, if you choose **Not Rescue**, you will be penalized 3 points (regardless of the outcome).
  - The pond rule is the same: saved if at least one rescue, not saved if none.
answer: |-
  Below is a complete, runnable activity plan for your 75-minute MA seminar, designed to evoke the tension between omissions as causes and the problem of causal overdetermination. The activity uses a simple shared-resource scenario ("The Village Well") with two rounds, private choices, and a points-based payoff system (no real money). The debrief maps the experience to key philosophical distinctions. Rules and materials are minimal for easy setup.

  ---

  ### **Activity Title:** The Village Well  
  **Objective:** Students experience how omissions can feel causally potent individually, yet collectively lead to problematic overdetermination, and how norms (e.g., duties) alter causal perception.  
  **Key Concepts Explored (Debrief Only):** Omissions as causes, counterfactual dependence, causal overdetermination, norm-dependent causal selection, making vs. allowing, explanatory vs. responsibility-focused causation.  
  **Duration:** 75 minutes total.  
  **Students:** 16.  

  ---

  ### **Materials**  
  - **16 Private Choice Slips:** Small paper slips for each student (two per round).  
  - **Public Ledger:** Whiteboard or projected spreadsheet with columns: **Player | Choice (Act/Abstain) | Points Change | Notes (Round 2 only)**.  
  - **Timer:** For enforcing turns (1 minute per turn).  
  - **Points System:** Virtual points (no real money). All start with 10 points.  

  ---

  ### **Setup (5 minutes)**  
  - **Seating:** Arrange students in a circle for privacy.  
  - **Backstory (Orally, avoid technical terms):**  
    > *"You live in a village with a shared well. A poison risk emerges. Each of you has one turn to act. If anyone adds an antidote (Act), the well is saved. If all abstain, the well is poisoned, harming everyone. Your choices are private."*  
  - **Assign Roles:** Randomly number students 1–16. Turns proceed sequentially.  
  - **Emphasise:** *"No discussion during rounds. Choices are independent."*  

  ---

  ### **Round 1: Unstructured Scenario (20 minutes)**  
  **Goal:** Students see that each omission *could* have prevented harm, creating intuitive counterfactual dependence—yet harm is overdetermined by many omissions.  

  #### **Rules**  
  - **Turns:** 16 turns (1 min each). On their turn, each player privately writes **"Act"** or **"Abstain"** on a slip and hands it to you.  
  - **Payoffs:**  
    - **Act:** Costs 1 point (effort).  
    - **Abstain:** No cost.  
    - **Well Outcome:**  
      - If **≥1 Act**, well saved → **no collective harm**.  
      - If **all Abstain**, well poisoned → **all lose 3 points**.  
  - **Ledger:** Record choices publicly in real-time. Initially, **all Abstains are logged identically** (e.g., *"Player 3: Abstain"*).  

  #### **Predicted Student Experience**  
  - Most will **Abstain** (free-rider incentive: hope others Act).  
  - Likely outcome: **All Abstain → well poisoned** (massive overdetermination).  
  - Each student thinks: *"If I’d Acted, the harm wouldn’t have happened"* (counterfactual dependence).  
  - **Problem Emerges:** Students see 16 identical "Abstain" entries causing one harm. They feel causation is "cheap" or diluted.  

  ---

  ### **Round 2: Duty-Bound Scenario (20 minutes)**  
  **Goal:** Identical abstentions now feel causally salient due to norms. Students see how duties "select" one omission as the cause.  

  #### **Changes to Rules**  
  - **New Backstory:**  
    > *"A duty rota is introduced: On your turn, you are the Designated Protector. If you Abstain, you breach your duty."*  
  - **Payoffs (Modified):**  
    - **Act:** Costs 1 point (same as Round 1).  
    - **Abstain (Non-Protector):** No cost (if not on duty).  
    - **Abstain (Designated Protector):** **Lose 1 extra point** (breach penalty) + **publicly noted in ledger** (e.g., *"Player 5: Abstain (Duty Breach)"*).  
    - **Well Outcome:** Same as Round 1.  
  - **Ledger:** Add **"Duty Breach"** notation for Protectors who Abstain.  

  #### **Predicted Student Experience**  
  - Designated Protectors feel pressure to Act (breach penalty = social/moral cost).  
  - If a Protector Abstains, peers see it as **the** cause ("They failed us!").  
  - Identical physical omission (Abstain) now feels causally potent due to norms.  

  ---

  ### **Debrief (30 minutes)**  
  **Goal:** Name the philosophical problems students felt. Avoid terms until now. Use Socratic questioning.  

  #### **Guided Questions**  
  1. **Round 1 Reflection:**  
     - *"The harm happened because everyone Abstained. Could any one of you have prevented it?"* → Highlight **counterfactual dependence** (if I Acted, it wouldn’t have happened).  
     - *"Did your Abstain feel like a cause? Why/why not?"* → Elicit unease: 16 causes for one harm feels **explanatorily empty**.  
     - *"Is causation still meaningful if everything we don’t do causes outcomes?"* → Introduce **overdetermination worry**.  

  2. **Round 2 Reflection:**  
     - *"In Round 2, an Abstain was identical—why did the Protector’s feel like the ‘real’ cause?"* → Link to **norms** (duty, expectation).  
     - *"Did the harm depend *more* on the Protector’s choice?"* → Challenge: Counterfactually, all omissions still mattered equally.  

  3. **Philosophical Mapping:**  
     - **Omissions as Causes:** *"You felt the pull: omissions *can* be causes via counterfactuals. But in Round 1, that made causation feel too broad."*  
     - **Causal Selection:** *"Norms (like duties) ‘select’ which omissions count as causes—e.g., we blame the Protector, not all 16. But metaphysically, all omissions still dependently cause the harm."*  
     - **Making vs. Allowing:** *"In Round 1, Abstaining felt like *allowing* harm. In Round 2, the Protector’s Abstain felt like *making* it happen. But the action was identical—norms shifted perception."*  
     - **Explanation vs. Responsibility:** *"We use causation to *explain* outcomes (all omissions mattered) and *assign responsibility* (only the Protector was blamed). Norms bridge these."*  

  #### **What the Activity Cannot Reproduce (Supply in Debrief)**  
  - **The Ontological Gap:** The activity assumes **counterfactual dependence = causation**, but it cannot recreate the debate over whether omissions (as absences) have genuine *causal power* or are merely explanatory heuristics. Some metaphysicians (e.g., Dowe, Schaffer) argue only positive events cause; omissions are pseudo-causes. Highlight this: *"In the activity, omissions ‘cause’ via counterfactuals. But are they *real* causes or just useful attributions? That’s where the metaphysics gets thorny."*  

  ---

  ### **Predicted Problems & Mitigation**  
  - **Problem 1: Round 1 Harm Avoided:** If ≥1 student Acts, harm is averted → overdetermination problem doesn’t arise.  
    - *Mitigation:* Pre-seed 2–3 students to Abstain (privately). If harm is avoided, say: *"Imagine no one Acted—how would you assign causes then?"* Use hypotheticals.  
  - **Problem 2: Time Overrun:** Turns may drag.  
    - *Mitigation:* Strict 1-min timer; pre-fill ledger names; use digital tools (e.g., Google Form choices).  
  - **Problem 3: Confusion on Payoffs:**  
    - *Mitigation:* Simplify points (use whole numbers); display payoff rules throughout.  
  - **Problem 4: Students Reject Norms:** Some may ignore "duty" in Round 2.  
    - *Mitigation:* Add social stakes (e.g., announce duty breaches); remind them it’s a "village norm."  

  ---

  ### **Why This Works**  
  - **Experiential Learning:** Students *feel* the tension before naming it—e.g., "My Abstain *mattered*... but so did everyone’s!"  
  - **Minimal Lecture:** Rules explain themselves; debrief crystallises intuitions.  
  - **British English:** Done (e.g., "rota," "breach," "mitigation").  

  This plan balances structure with flexibility. The first run may be messy, but lean into the mess—it fuels debate!
