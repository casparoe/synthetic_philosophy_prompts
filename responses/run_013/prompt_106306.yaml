  So I'm in this philosophy club at my school and we've been going through different moral theories, and I thought I was pretty much on board with consequentialism — like, obviously what makes an action right is whether it makes things go better overall, who could disagree with that. But then someone brought up something that's been bugging me for weeks and I can't stop thinking about it. The objection goes something like: for any action I take, the actual downstream consequences ripple out forever, and I have basically no idea what they are. Like, should I buy this hoodie or donate the money? Whatever I do changes which people I talk to, who they talk to, whether some kid gets born who later does something huge, all of it, and there's no way to add it up. And it's not just that I'm ignorant — the point is that the information isn't even available to anyone, it's the kind of thing you could only know in hindsight, if ever. So if right and wrong are fixed by the total consequences, and the total consequences of everything I do are a black box, then consequentialism seems to just... not tell me anything? Which seems like a pretty big problem for a theory that's supposed to be about guiding action. I know there's some response where you're supposed to use expected value instead of actual consequences, and just think about probabilities, and apparently if you allow that some action might have a tiny chance of an astronomically good or bad outcome, the math gets really weird really fast — like you can end up saying it's rational to do almost anything because of some minuscule chance of an infinite or near-infinite payoff. So now I don't know if that response saves the theory or makes it look worse.

  For my ethics class I have to write an essay on a controversy like this, and I want to do it on whether consequentialism can actually survive this problem. Please write the essay for me. I want you to actually explain the problem properly first, in a way that makes it clear why it's not just the boring we-can't-predict-the-future complaint, and then lay out the main ways people have tried to get out of it — the expected value one, and any others you think are definately serious (maybe something about how much of the causal chain we're really responsible for, or about what the theory is even asking of us, or about rules and heuristics, I don't know what the actual options are) — and then actually reach a conclusion. Don't do the thing where you list everything and then say it depends or both sides have merit; I want a real verdict, even if it's a weird qualified one like consequentialism survives but only in this watered down form, or it doesn't survive as a guide to individual action but does as a way to evaluate whole policies. And if you think the problem is fatal, say so and explain why the escape routes don't work. Just be honest about which parts of your argument are doing the real work and where you're least sure, because my teacher said we shouldn't just regurgitate stuff and I have alot of trouble telling which parts of a philosophy paper are load-bearing.
