prompt: |-
  You are a clinical ethics consultant who has spent years on reproductive ethics — you know the debates over procreative beneficence, liberal eugenics, and the disability critique well enough to reason with them rather than recite them, and you also sit on hospital ethics committees often enough to know what a procedure has to look like to survive contact with a busy clinic. I would like your help turning a principle into something usable, and I would rather you think carefully and lay out your reasoning than produce something slick. I sit on the ethics committee of a mid-sized private fertility clinic that has recently begun offering polygenic embryo screening alongside ordinary chromosomal screening. Our medical director has floated what she calls the 'best-life standard': the clinic, she says, should help prospective parents choose, among the embryos they could transfer, the one expected to have the best life; doing so is at least permissible and possibly obligatory; but the clinic must not become an agent of eugenics, and the parents, not the clinic, own the values. She has also proposed, as a gloss on this, that we distinguish a 'floor' — the point below which a life is not worth starting — from a 'ceiling' — everything above it — and that the clinic should intervene at the floor while remaining neutral at the ceiling. This is a slogan, not a policy, and we keep hitting requests it does not resolve. Our committee meets weekly, but transfers are scheduled within days, most of my colleagues are clinicians rather than philosophers, and the medical director has to sign off on the outcome, so whatever we adopt must be runnable in twenty minutes by someone who has never read a word of the literature.

  Please do two things. First, briefly and without citing anyone, set out what a principle of procreative beneficence actually commits a clinic to: in particular the difference between making a particular child better off and choosing a different child, why 'the best expected life' is not the same as 'the healthiest embryo', and the strongest objections — the disability critique, and the worry that the clinic would be expressing a judgment about the worth of existing lives — together with the medical director's floor/ceiling gloss and whether it is a stable way of stating the principle or a quiet abandonment of it. Second, having done that, write the procedure itself: an ordered set of questions, what counts as a sufficient answer to each, the point at which the procedure stops with a no, and the point at which it hands the decision back to the parents as a question of values rather than facts. Include a small set of tests a committee member can actually apply — for instance, a rule for distinguishing a request that concerns a medical condition from one that concerns a preference, a test for when a polygenic score is too weak or too confounded to ground a decision at all, and a rule for requests in which the selection benefits someone other than the future child. Then run the procedure on three requests we have pending: (a) a couple asking us to select, among five embryos, the one with the highest polygenic score for educational attainment, who also ask whether we can select for height; (b) a Deaf couple, both fluent signers who regard deafness as a culture rather than a deficit, asking us to select an embryo that will be deaf; and (c) the parents of a child with a severe blood disorder asking us to select an embryo that is a tissue match for that child. At least one of these should come out in a way I will not like — tell me which and why — and be explicit throughout about where the procedure is a judgment call dressed up as procedure, where it will misfire, and what it cannot decide at all. Begin with a short sketch of the distinctions you intend to preserve before you draft anything.
reasoning: |-
  Hmm, the user is a clinical ethics committee member at a fertility clinic grappling with polygenic embryo screening. They need a practical procedure grounded in reproductive ethics principles, specifically addressing their medical director's "best-life standard" and floor/ceiling framework. This is urgent - transfers happen in days, and the committee lacks philosophy background.

  First, I need to unpack the core ethical tensions:
  - Procreative beneficence (PB) commits clinics to selecting the embryo with the best expected life prospects. But this isn't about enhancing a specific child - it's selecting which child comes into existence. "Best life" ≠ "healthiest" because non-health traits (like socioeconomic factors) influence well-being. The disability critique argues PB devalues disabled lives by treating them as avoidable harms, while the expressivism concern worries clinics might imply some lives are unworthy.

  The floor/ceiling distinction tries to solve this by intervening only below a "life not worth starting" threshold (floor) but staying neutral above (ceiling). But this collapses under scrutiny - either floor/ceiling are the same point (making the distinction meaningless), or we're really abandoning PB for a minimal welfare standard. The director likely means well but this framework doesn't hold.

  For the procedure, I'll build practical tools:
  1) Trait categorization: Medical conditions vs. preferences using a "distress/disability" test
  2) Evidence threshold for polygenic scores: Must meet clinical validity standards
  3) Beneficiary filter: Selection must primarily benefit the future child
  4) Conflict checks: When parental values clash with child's welfare

  Now for the cases:
  (a) Educational attainment/height selection: Fails - both are ceiling preferences with weak evidence, and height selection particularly violates the beneficiary principle.
  (b) Deaf couple: Passes condition test but fails beneficiary test - selecting deafness primarily serves parental cultural goals, not child's welfare.
  (c) Savior sibling: Fails beneficiary test - selection serves the sick sibling, not the embryo.

  The Deaf case will frustrate the user - it's culturally sensitive but the procedure must prioritize the child's independent interests. I'll explicitly flag where the procedure has judgment calls: condition classification, evidence interpretation, and the "primarily benefits" standard. It'll misfire when traits straddle medical/preference lines (e.g., psychiatric risks) or when cultural views challenge welfare assumptions.

  This gives the committee an operable 20-minute toolkit while acknowledging its limitations. The tradeoff is philosophical purity for clinical usability - exactly what they need.
answer: |-
  ## Core Distinctions to Preserve
  1.  **Child A vs. Child B:** Making an existing child better off (therapy) vs. choosing which *potential* child comes into existence (selection). PES is always about Child A vs. Child B.
  2.  **Best Life vs. Healthiest:** "Best expected life" encompasses health, but also well-being influenced by non-health traits (e.g., cognitive capacity impacting opportunity, chronic pain affecting enjoyment). A very healthy embryo might have low expected well-being due to other factors, and vice-versa (though health is a major component).
  3.  **Permissible Intervention vs. Parental Sovereignty:** The clinic has limited authority to intervene based on harm prevention; parents have broad authority over values defining a "good life" above the harm threshold.
  4.  **Harm Prevention (Floor) vs. Enhancement (Ceiling):** The "floor" aims to prevent births where severe suffering is highly probable, making life potentially not worth starting. The "ceiling" involves choices between lives all expected to be worth living, where differences are matters of preference/value.
  5.  **Child's Welfare vs. Others' Interests:** The primary ethical justification for selection *by the clinic* must be the welfare of the future child. Selection primarily benefiting others (parents, siblings) is ethically distinct and often problematic.

  **The Principle & The Floor/Ceiling Gloss**
  *   **Procreative Beneficence (PB) Commits the Clinic To:** Systematically evaluating available embryos and selecting the one with the *highest expected lifetime well-being* for transfer, based on the best available evidence. This requires defining well-being, gathering predictive data, and making comparative judgments.
  *   **PB's Core Tensions:**
      *   **The Disability Critique:** PB implies that selecting *against* disability is morally required because disability inherently lowers well-being. This is contested by many disability advocates who argue disability is primarily a social construct causing disadvantage, not an intrinsic harm. Selecting *against* disability devalues existing disabled lives by treating their existence as preventable harm. PB struggles to distinguish between preventing severe suffering and devaluing diverse lives.
      *   **Expressivism Worry:** By systematically selecting against certain traits (like deafness or low EA PGS), the clinic implicitly sends a message that lives with those traits are less worthy, harming existing people and reinforcing discrimination.
      *   **"Best Life" vs. "Healthiest":** PB demands looking beyond pure "health" (absence of disease) to overall well-being predictors. Selecting for a "healthiest" embryo (low disease risk) might not yield the embryo with the "best expected life" if non-health factors significantly influence well-being potential (e.g., cognitive traits impacting opportunity).
  *   **Floor/Ceiling Gloss - Stable or Abandonment?** This gloss is **not a stable interpretation of PB; it's largely an abandonment of it** disguised as a refinement. PB demands selecting the *best*. The floor/ceiling distinction replaces "best" with "good enough." If the clinic is truly neutral above the floor, it *isn't* selecting for the "best life," only against the very worst. It shifts from a maximizing principle (PB) to a satisficing principle (avoid severe harm). The gloss *attempts* to address the disability critique and expressivism worry by limiting intervention to uncontroversial severe harms, but it fundamentally alters the stated principle. Its instability lies in defining the "floor" – is it only conditions universally agreed to make life not worth starting? How severe? How certain? This gloss is likely a pragmatic retreat from the full implications of PB due to its ethical and practical difficulties.

  ---

  ## Proposed Clinic Procedure: The Well-Being Threshold & Parental Choice Framework

  **Goal:** Provide a rapid, defensible, operational decision-tree for committee review of PES selection requests, prioritizing harm prevention while respecting parental values above the harm threshold.

  **Core Structure:**
  1.  **Categorize the Trait:** Is this about preventing severe harm or pursuing preference?
  2.  **Assess Evidence:** Is the prediction strong & relevant enough for clinic action?
  3.  **Identify Primary Beneficiary:** Is selection primarily for the future child or others?
  4.  **Apply Thresholds & Hand Back:** Does the request fall below the harm threshold (mandatory intervention) or above it (parental choice)?

  **Procedure Steps (20-Minute Application):**

  1.  **Define the Trait & Goal:** *"What specific trait(s) is the parent requesting selection for or against? What is their stated goal?"*
      *   *Sufficient Answer:* Clear identification of the trait(s) (e.g., "Polygenic Score for Educational Attainment," "HLA Match," "Avoidance of Deafness," "Selection for Deafness," "Height"). Clear statement of goal (e.g., "choose embryo with highest EA PGS," "select embryo that is a tissue match," "select embryo likely to be deaf").
      *   *Stop if:* Goal is fundamentally incoherent or medically impossible.
      *   *Hand Back if:* Goal involves complex, non-medical value judgments *above the harm threshold* (this happens later).

  2.  **Categorize: Medical Condition or Preference?**
      *   *Test:* **"Distress/Disability Test":** Is the trait strongly associated with significant, inherent physical/mental distress, functional disability requiring major medical intervention, or a severely shortened lifespan? *AND* is this association direct and not primarily caused by societal prejudice?
          *   *Medical Condition (Potential Floor):* Traits meeting the test (e.g., Tay-Sachs, severe treatment-resistant epilepsy, anencephaly). Focus: Preventing severe suffering.
          *   *Preference (Ceiling):* Traits not meeting the test (e.g., height, typical EA PGS variation, deafness in signing environment, sex for non-medical reasons, skin tone). Focus: Parental values.
          *   *Gray Zone (Judgment Call):* Traits with variable expression or significant social component (e.g., some psychiatric PGS, moderate cognitive impairment). *Flag for careful evidence review.*
      *   *Sufficient Answer:* Committee consensus on category based on test.
      *   *Stop if:* Request is to select *against* a trait clearly in the Preference category where the *only* justification is societal disadvantage (e.g., "avoid homosexuality"). Clinic shouldn't endorse discrimination.
      *   *Hand Back if:* Trait is clearly Preference. Proceed if Medical Condition or Gray Zone.

  3.  **Assess Predictive Evidence (For Medical Conditions & Gray Zone Traits):**
      *   *Test:* **"Clinical Actionability Threshold":**
          1.  **Strength:** Is the predictive power (e.g., PGS odds ratio, known penetrance) strong enough that selecting based on it *reliably* changes the expected outcome? (e.g., High PGS for schizophrenia with OR >3.0 vs. EA PGS with R² < 5%).
          2.  **Severity:** Is the predicted negative outcome severe enough to potentially approach the "floor" (significant distress/disability/shortened life)?
          3.  **Confounding:** Is the prediction confounded by factors making it unreliable for embryo selection? (e.g., PGS derived from GWAS with poor ancestral diversity for this patient; trait heavily influenced by environment).
      *   *Sufficient Answer:* Committee consensus that evidence meets all 3 thresholds (Strong, Severe, Unconfounded) for reliable harm prediction.
      *   *Stop if:* Evidence is too weak, non-severe, or confounded to justify clinic action based on prediction (e.g., most complex trait PGS currently). Clinic cannot responsibly act on noise.
      *   *Hand Back if:* Evidence *fails* Clinical Actionability Threshold. Parents can still request, but clinic labels it as preference-based, not medically indicated. Proceed if evidence passes.

  4.  **Identify Primary Beneficiary:**
      *   *Test:* **"But-For-The-Child Test":** Would the selection decision be made *primarily* because it is believed to benefit *this specific future child's own well-being*? Or is the primary motivation to benefit someone else (existing sibling, parent's desire for a certain experience)?
      *   *Sufficient Answer:* Clear primary beneficiary identified.
      *   *Stop if:* Primary beneficiary is *not* the future child (e.g., savior sibling selection purely for tissue). Clinic should not create a child primarily as a means to another's end. (*Exception:* Preventing severe harm *to the future child* trumps this).
      *   *Proceed/Hand Back:* If primary beneficiary is the child, proceed to apply harm threshold. If the request passed Step 2/3 (Medical/Gray) but the primary beneficiary is *still* the child, proceed to Step 5. If it's a Preference trait (Step 2) but primarily for the child, it gets handed back at Step 5.

  5.  **Apply Well-Being Threshold (Harm Prevention Floor):**
      *   *Test:* **"Unavoidable Severe Harm Threshold":** Does the available evidence indicate that *all* embryos expressing this trait are *very likely* to experience a level of severe distress, disability, or early death that makes their life, on balance, potentially not worth starting? (e.g., Lesch-Nyhan syndrome, severe OI type II).
      *   *Sufficient Answer:* Committee consensus on whether threshold is met.
      *   *Stop/Intervene if:* Threshold IS met. Clinic *must* recommend against transferring an embryo predicted to have this condition (if alternatives exist). This is the "floor" intervention.
      *   *Hand Back if:* Threshold IS NOT met. *Regardless of Medical/Preference categorization*, the clinic hands the decision back to the parents as a matter of values. The clinic documents this is a parental preference choice, not a medical recommendation. Parents choose based on *their* conception of the "best life" from among embryos above the floor.

  **Key Judgment Calls & Failure Modes:**
  *   **Judgment Calls Dressed as Procedure:** "Distress/Disability Test," "Severity" in Clinical Actionability, "Unavoidable Severe Harm Threshold." These rely on committee interpretation of evidence and societal norms. The procedure provides structure but not objectivity for these.
  *   **Where it Misfires:**
      *   **Gray Zone Traits:** Misclassifying a trait with significant suffering potential as "Preference" (e.g., severe treatment-resistant depression PGS) or vice-versa (e.g., classifying typical deafness as Medical Condition).
      *   **Weak Evidence Misapplication:** Overestimating the predictive power of a PGS score leading to inappropriate intervention or hand-back.
      *   **Beneficiary Conflict:** Misjudging primary beneficiary, especially in subtle cases (e.g., parents claim selecting for deafness benefits the child culturally, but is it primary?).
      *   **Expressivism Leakage:** Even handing back a preference can feel like endorsement; refusing a preference can feel like judgment.
  *   **What it Cannot Decide:**
      *   **Defining "Well-Being":** The procedure avoids defining the positive "best life." It only defines the negative threshold.
      *   **Resolving Value Conflicts:** It doesn't decide *which* preference is better above the floor, only that it's the parents' domain.
      *   **The "Best":** It explicitly abandons the quest for the "best" embryo above the floor per PB.

  ---

  ## Application to Pending Requests

  **(a) Couple: Select highest EA PGS; Query on Height Selection**
  1.  **Trait/Goal:** EA PGS (Maximize); Height (Maximize?).
  2.  **Categorize:**
      *   *EA PGS:* **Preference.** Does not inherently cause distress/disability. Association with opportunity is heavily socio-environmental.
      *   *Height:* **Preference.** Does not inherently cause distress/disability. Association with advantage is primarily social.
  3.  **Assess Evidence:** (Skipped - Preference category).
  4.  **Primary Beneficiary:** Parents state goal is child's "best life/success." *Assume* primary beneficiary is future child for both.
  5.  **Apply Threshold:** Neither trait comes *remotely close* to the Unavoidable Severe Harm Threshold.
      *   **Outcome: Hand Back.** Clinic informs parents that selection based on EA PGS or height is a parental preference decision. Clinic will provide the PGS/height data (if available & validated for screening) but states this is not a medical recommendation and does not constitute selecting for the "healthiest" or medically "best" embryo. Parents choose based on their values. *Clinic should explicitly note the weak predictive power (especially for individuals) of these PGS scores.*

  **(b) Deaf Couple: Select Embryo Likely to be Deaf**
  1.  **Trait/Goal:** Select *for* likelihood of deafness.
  2.  **Categorize:** **Gray Zone (Leaning Medical but Context Dependent).** Deafness itself does not inherently cause *physical* distress/disability. However, it often involves significant *functional disability* (communication barrier) requiring major intervention (cochlear implants, sign language education) in a hearing world, and can be associated with other conditions. The cultural context (signing parents) mitigates the functional disability significantly. Strong arguments exist on both sides. *Judgment Call:* Given the potential for functional disability even in supportive environments (access to wider world, emergencies) and the need for significant adaptation, it's safer to categorize this cautiously as Gray Zone needing evidence review, rather than pure Preference.
  3.  **Assess Evidence:** (Assuming a genetic variant causing deafness is identifiable).
      *   *Strength:* High (if testing for a specific deafness-causing variant).
      *   *Severity:* **Does *not* meet Clinical Actionability Severity threshold for *harm*.** While deafness involves challenges, it does not typically cause severe distress, profound functional incapacity across domains, or a shortened lifespan *in a supportive environment*. Many deaf individuals lead fulfilling lives.
      *   *Confounding:* N/A for specific variant.
      *   **Outcome of Evidence Review:** *Fails* Clinical Actionability Threshold (Severity not met). Evidence does not support predicting *severe harm* necessary for clinic intervention. Proceed to Step 4.
  4.  **Primary Beneficiary:** **Parents/Existing Family.** The stated goal is cultural continuity and belonging within the Deaf community. While parents argue this benefits the child by providing a rich cultural identity and fluent family communication, the *primary motivation* is to have a child who shares their cultural identity. The selection is *for* a trait that typically confers a functional disability in the broader world *because* it aligns with parental cultural values. The "But-For-The-Child" test: Would they select for deafness if they *weren't* part of Deaf culture? Likely not. Primary beneficiary is the parents/existing family unit's cultural desire.
  5.  **Apply Threshold:** (Skipped as Step 4 outcome decisive). Step 4 outcome: **Stop.** Clinic should not perform selection *for* deafness. Reason: Selection primarily benefits others (parents/culture), not the future child. Creating a child *with the intent* of them having a disability, even framed positively, primarily serves the parents' desires and uses the child as a means to a cultural end. *Expressivism concern is strong here - clinic endorsement would send a harmful message about disability.*

  **(c) Parents of Child with Severe Blood Disorder: Select HLA-Matched Embryo**
  1.  **Trait/Goal:** Select *for* specific HLA type (tissue match) to benefit existing sick child.
  2.  **Categorize:** HLA type itself is **Preference** (No inherent distress/disability).
  3.  **Assess Evidence:** (Skipped - Preference category).
  4.  **Primary Beneficiary:** **Existing Sick Child.** The explicit and sole purpose is to create a potential donor to save the life of the existing child. The future child's own welfare is secondary (though parents may hope for a good life for them too).
  5.  **Apply Threshold:** (Skipped as Step 4 outcome decisive). Step 4 outcome: **Stop.** Clinic should not perform selection *for* HLA matching. Reason: Selection primarily benefits the existing child, not the future child. This is creating a child primarily as a means to another's end (savior sibling). *The future child's own well-being is not the primary reason for the selection choice.*

  ---

  **The Outcome You Won't Like:** **(b) Deaf Couple.**

  **Why:** The procedure stops the selection for deafness. While culturally sensitive and acknowledging the Gray Zone, the Primary Beneficiary test is decisive. The clinic cannot ethically sanction creating a child *with the specific intent* of them having a disability, even within a supportive culture, because the *primary* motivation serves the parents' cultural desire, not the child's independent welfare. The child is being selected *for* a trait that objectively reduces sensory capacity and creates barriers, primarily to fulfill a parental/cultural goal. The "floor" threshold isn't crossed (deafness isn't "life not worth starting"), but the beneficiary test prevents clinic involvement. This outcome prioritizes the future child's independent interests over parental cultural autonomy in this specific context and avoids the clinic becoming complicit in intentional impairment. It will feel like a rejection of the Deaf cultural viewpoint to the parents and potentially to you, but the procedure forces this prioritization based on the beneficiary principle. This is where the judgment call in Step 4 ("Primary Beneficiary") is most acute and likely contentious.
