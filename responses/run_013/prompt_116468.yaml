answer: |-
  ## Joint Statement: Extended Mind and Internalist Perspectives After Adversarial Collaboration

  **Signed:**  
  *On behalf of Extended Mind Theorists (EMT):* Andy Clark & David J. Chalmers (hypothetically)  
  *On behalf of Internalist Critics (IC):* Fred Adams, Ken Aizawa, Robert Rupert (hypothetically)

  ### I. Agreed Claims

  After sustained dialogue, we jointly affirm the following, recognizing them as foundational to the debate and not points of contention:

  1.  **Functional Equivalence is Key:** The Parity Principle is primarily a *heuristic tool* designed to challenge internalist biases by asking: *If a process occurring inside the brain were to produce an equivalent functional role in guiding intelligent action, we would unhesitatingly accept it as cognitive. Therefore, if an external process plays that same functional role, we should, barring compelling reasons, similarly accept it as cognitive.* Its purpose is to expose potential chauvinism towards the intracranial.
  2.  **Causation is Necessary but Insufficient (Alone):** Mere causal interaction between an agent and an external resource is insufficient for that resource to constitute part of the agent's cognitive system. Both sides agree that the "causal coupling" must be of a specific, robust, and reliable kind. The disagreement lies in whether such coupling, even when robust, can ever suffice for *constitution*.
  3.  **The Brain is Central but Not Necessarily Exclusive:** All cognitive processes we know of fundamentally involve and depend upon the brain. EMT does not deny this centrality. The debate concerns whether the brain's biological boundaries necessarily define the *metaphysical* or *explanatory* boundaries of the cognitive system in all cases.
  4.  **"Bloat" is a Serious Concern:** The worry that EMT criteria might lead to an implausible proliferation of cognitive systems (e.g., the entire library, the internet) is a legitimate challenge requiring a principled response. EMT must provide criteria distinguishing genuinely cognitive extensions from merely useful external tools. IC must acknowledge that not all potential couplings lead to bloat under plausible EMT constraints.
  5.  **Reliability and Accessibility Matter:** For an external resource to be a candidate for cognitive extension, it must be reliably available and easily accessible to the agent, functioning with a speed and fluency comparable to internal processes (e.g., biological memory retrieval).
  6.  **The Target is Cognitive Science Explanations:** The core debate is about what constitutes the proper *explanatory unit* for understanding cognition and guiding action. Is the individual organism always the right locus, or can coupled systems sometimes be the minimal unit for explaining specific cognitive achievements?

  ### II. Core Disagreements: Formulations Each Side Endorses

  | Sub-Question                                                                 | Extended Mind (EMT) Formulation                                                                                                 | Internalist (IC) Formulation                                                                                                 |
  | :--------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------------------- |
  | **1. What constitutes a *cognitive* process?**                             | A cognitive process is one that plays an immediate, persistent, and reliably available role in the guidance of an agent's rational thought and action, regardless of its physical location, provided it meets coupling criteria. | A cognitive process is one that is *constituted* by the intrinsic, persisting properties and activities of the agent's central nervous system (CNS). External resources are causally coupled inputs/outputs, not constitutive parts. |
  | **2. What principle distinguishes constitutive coupling from mere causation?** | Constitutive coupling requires a reliable, reciprocal, and deeply integrated coupling where the external resource functions *as a* persisting, immediately accessible component in cognitive loops supporting specific cognitive capacities (e.g., recall, decision), becoming a *transparent* part of the agent's cognitive profile. | There is no principled way for causal coupling alone to become constitution. Cognitive constitution requires a specific kind of biological/physical continuity and intrinsic systemic unity *within the organism* that causal coupling cannot provide. |
  | **3. Is agent endorsement/trust necessary?**                                | While trust often emerges, the core requirement is *reliable functional integration*. An agent need not explicitly endorse or trust the resource *as part of themselves*; the critical factor is the resource's consistent, automatic, and indispensable role in their cognitive routines. | Genuine cognition requires that the agent recognize the information as *their own* or as directly under their agential control. Reliance on an unendorsed external source is parasitic on internal cognition, akin to consulting an external expert, not extending one's mind. |
  | **4. Can one extended system contain multiple agents?**                      | An extended cognitive system (e.g., a tightly coupled human-tool dyad) can be the locus of cognitive processing, even if it contains distinct biological agents. The *system* is the cognitive unit. | Cognitive agency is fundamentally singular and organism-bound. A system involving multiple biological agents involves *inter-agential* cognition (communication, collaboration), not a single extended mind with multiple agents within it. The individual remains the agent. |
  | **5. Does the origin/author of the external resource matter?**             | What matters is the *current functional role* within the agent's cognitive economy. Provided the coupling is robust and the resource is treated as an automatic extension (like memory), its origin is irrelevant to its constitutive status. | The origin and authorship are crucial. Using an external resource created by another entity, especially containing unverified information, fundamentally alters the epistemic relation. It becomes a source of testimony, not an expression of the agent's own cognitive state or memory. |

  ### III. Cruxes of the Dispute: Predictions & Test Cases

  The user correctly identified key cruxes. We add one concerning origin/authority:

  1.  **Crux: Is there a principled criterion for the 'cognitive'?** (User's (a))
      *   **EMT Prediction:** If a process (internal or external) plays the immediate, persisting, guidance-enabling role described, it is cognitive. Neural correlates are one implementation, not the definition.
      *   **IC Prediction:** Only processes implemented by the intrinsic mechanisms of the CNS satisfy a principled criterion for being truly cognitive. External tools lack the necessary intrinsic unity.
      *   **Test Case:** Advanced neural prosthetics directly integrated into sensory/motor loops. EMT predicts cognitive extension occurs when prosthetic input is treated as immediate and transparent (like a limb). IC predicts it remains a causally coupled tool.

  2.  **Crux: Can causal coupling suffice for constitution?** (User's (b))
      *   **EMT Prediction:** Yes, when coupling meets the criteria of reliability, reciprocity, fluency, and functional equivalence (Parity).
      *   **IC Prediction:** No. Coupling is always contingent and breaks the intrinsic connection required for cognitive constitution. Constitution requires physical/biological continuity absent in external coupling.
      *   **Test Case:** **Marisol's Notebook:** EMT predicts that if Marisol's reliance on the inherited notebook is as automatic, constant, and fluent as Otto's (despite its origin and potential errors), it constitutes part of her memory system. The errors are analogous to faulty biological memory. IC predicts it remains an external source of information she relies upon; the origin and lack of personal authorship mean she is consulting her sister's notes, not accessing her *own* extended memory. Her inability to verify entries highlights the lack of intrinsic connection.

  3.  **Crux: Trust/Endorsement vs. Reliance?** (User's (c))
      *   **EMT Prediction:** Reliance and automatic integration are sufficient. Explicit trust/endorsement *as self* is not required.
      *   **IC Prediction:** Genuine cognitive incorporation requires the agent to treat the resource as authoritatively *their own*, a form of self-trust/endorsement. Mere reliance is insufficient.
      *   **Test Case:** **The Deliberative Assistant:** Someone who automatically outsources *all* non-trivial decisions to an AI assistant, consulting it instantly and unreflectively before any action, but *knows* the assistant has its own goals and might manipulate them. EMT predicts this could constitute an extended deliberative system *if* the coupling is sufficiently tight, immediate, and the primary driver of action. The lack of trust might make the coupling fragile, but if the reliance is robust, it counts. IC predicts this is clear manipulation, not cognitive extension. The agent's knowledge of the assistant's separate goals and potential manipulation prevents the necessary endorsement; they are merely being guided (potentially misled) by an external entity, not extending their own deliberation.

  4.  **Crux: Multiple Agents in One System?** (User's (d))
      *   **EMT Prediction:** Yes, a tightly coupled system (e.g., two people + shared digital workspace used for joint problem-solving with real-time integration) can be a single cognitive system performing a task, even with two biological agents within it.
      *   **IC Prediction:** No. Each biological agent performs their own cognitive processes and communicates/interacts. The system is collaborative, but cognition remains located within each individual.
      *   **Test Case:** Deep brain-computer-brain interfaces enabling direct, real-time, unconscious integration of perceptual data or calculations between two individuals solving a joint task. EMT predicts the coupled system becomes the cognitive unit for that task. IC predicts two individuals using a novel communication channel.

  5.  **Crux: Does Origin/Authority Matter?** (Added)
      *   **EMT Prediction:** No, only current functional role matters (see Marisol case).
      *   **IC Prediction:** Yes, origin is crucial for establishing the epistemic authority and intrinsic connection required for constitution (see Marisol case).
      *   **Test Case:** Precisely the **Marisol Case**, as described.

  ### IV. The Marisol Case & Deliberative Assistant: Specific Responses

  *   **Marisol's Notebook:**
      *   **EMT:** Provided Marisol's use of the notebook is functionally identical to Otto's (constant access, automatic consultation, fluency, primary source for action guidance), it constitutes part of her extended memory system, regardless of its origin or the presence of uncorrected errors (which biological memory also has). The notebook's functional role *for Marisol* is what matters.
      *   **IC:** The notebook cannot be part of Marisol's memory. It is a repository of her sister's beliefs, some erroneous. Marisol is consulting an external document created by another person; she lacks the epistemic authority over its contents that defines genuine memory. Her reliance is on *testimony*, not an extension of her cognitive state. The inability to distinguish errors underscores this external dependence.

  *   **Deliberative Assistant (Manipulative):**
      *   **EMT:** The core EMT story does *not* inherently change. The question remains whether the coupling meets the criteria (reliability, persistence, immediacy, functional role). If the agent unthinkingly *relies* on the assistant's output as the immediate input to their action, despite knowing the potential for manipulation, and this reliance is robust and fluent, EMT must concede it *could* constitute an extended deliberative system. However, EMT acknowledges that the *lack of trust* likely makes such robust, persistent coupling unstable or impossible in practice; the agent would likely develop checks, breaking the transparency. *In principle*, if the reliance *were* that automatic, it would count, but the knowledge of manipulation makes such pure reliance highly improbable. This highlights a potential vulnerability in EMT's reliance criterion.
      *   **IC:** This is unequivocally *not* cognitive extension; it's a clear case of external influence/manipulation. Cognition requires the agent's own reasoning processes. Outsourcing deliberation to an entity with conflicting goals, even if relied upon, represents a failure or bypassing of the agent's own cognitive mechanisms, not their extension. The agent's knowledge of the assistant's separate agency confirms this is inter-agential interaction, not intra-cognitive constitution.

  ### V. The Role of "Cognitive"

  We agree that a significant part of this debate hinges on the *explanatory purpose* of marking a process or resource as "cognitive." This is primarily about **Crux (a)**.

  *   **EMT Purpose:** To identify the minimal system that provides the most perspicuous explanation for an agent's intelligent, adaptive behavior. "Cognitive" marks processes that play the essential functional role in guidance, regardless of location, to avoid neural chauvinism and capture the distributed nature of real-world cognition.
  *   **IC Purpose:** To identify the fundamental biological capacities of the organism that underlie its ability to interact with the world. "Cognitive" marks the intrinsic, organismically bounded processes that make an entity an agent in the first place and allow it to *use* external tools.

  **Would disagreement persist?** Yes, significantly. Even if both sides agreed that "cognitive" should be defined solely by functional role (which IC does not concede), IC would still argue that the *intrinsic, organismic implementation* of that function is what truly matters for understanding agency and cognition. They would deny that external resources, however tightly coupled, could ever be *constitutive parts* of the cognitive agent, as opposed to tools used *by* that agent. The metaphysical and explanatory commitments about the locus of agency and the nature of constitution run deeper than the terminological choice. The debate over constitution vs. causation (**Crux (b)**) and the requirements for agency (**Crux (d)**) would remain central.
