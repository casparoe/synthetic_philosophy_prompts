prompt: |-
  I'm in a philosophy of mind module this term and we've spent alot of the last three weeks on extended cognition — Clark and Chalmers' Otto and Inga thing, the parity principle, and then the internalist pushback (that being causally hooked up to something isn't the same as it being part of you, the bloat worry about why the whole library doesn't count if the notebook does, the demand for some principled criterion of what makes a process cognitive in the first place). The seminar is going round in circles and our tutor has set the assignment: write the document that an extended-mind person and an internalist would put out after a proper adversarial collaboration. Can you write it.

  What I need in it:

  An agreed-claims section, numbered, that neither side feels mugged by. Not filler like "both agree the brain is involved" — actual concessions: what each side should admit the other has established, what the fight is definitely not about, and what the parity principle is even meant to show (I suspect the two of them quietly read it differently).

  Then a dissagreements table: one row per sub-question, with the extended-mind formulation in one column and the internalist one in the other. Each side's wording has to be something that side would sign off on — no strawmen, and no wording that only sounds neutral because it's vague.

  Then the cruxes. My guesses: (a) whether there's a principled criterion for what counts as cognitive, (b) whether causal coupling can ever amount to constitution, (c) whether the external resource has to be trusted or endorsed by the agent, or just relied on, and (d) whether one extended system can have two agents in it. Tell me which I've got wrong and what I've missed. For each crux, give a case or finding that both sides agree would bear on it, and write down each side's prediction in advance — what each expects to see if they're right.

  Two things to fold in, because Otto's notebook is too worn out to settle anything:

  I want you to work with a case I made up. Marisol inherits a notebook from her twin sister, who's died. Same setup as Otto: she carries it everywhere, consults it without thinking, it's as reliable as her memory. But she didn't write it, some of the entries are things her sister got wrong, and Marisol can't tell you which ones. Is that notebook part of her memory, or is she just trusting a document? Make both parties say what they think about this case specifically, not just about Otto.

  Same for the case where what's outsourced isn't memory but deliberation: someone who can't decide anything without checking with an assistant they know is working for its own ends and not theirs. Extension or manipulation? And does the extended-mind side have to change its story to answer that?

  Last thing: if part of this fight is really about what the word "cognitive" is for rather than about any fact, say which part, and say whether the two of them would still disagree once they'd agreed about that.

  Write it as a document they'd actually put their names to — first person plural, no "some philosophers might argue". 1200-1800 words is fine.
