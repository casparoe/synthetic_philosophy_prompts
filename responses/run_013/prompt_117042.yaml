prompt: |-
  Two weeks ago I got made chair of our neighbourhood association -- small, volunteer, everything happens over a group chat -- and I've already had three fights about whether something "counted." A member wrote "I'm done with this, take me off the list" and now says they were just venting and never resigned. A guy who wrote "if we go ahead with the fence I'll quit" says he did resign and we need to fill his spot. And a shopkeeper wants us to treat "sorry you were upset" as a formal apology from the person who keyed his car. Our by-laws say nothing about any of this.

  Can you write me a procedure I can actually run on a message, in order, to decide whether it performed the act someone claims it performed? I want to know what has to be true of the words, the person saying them, who heard it, and what happened afterwards, where the procedure just stops with a no, and where it has to hand the call to a person because the question is really about our rules or our values rather than about the words. Ground it in whatever speech-act theory (Austin, Searle, Grice, whoever is relevant) actually established rather than folk intuition about "what they really meant," and keep it usable by someone who's never read any philosphy. Then run it on those three. We decide these in about ten minutes on a phone with no lawyer, and the board has to ratify anything that removes someone, so the procedure has to say when it can't finish the job on its own. Be honest about where it will misfire and where it'll give me an answer I don't like -- I'd rather know. No citations or reading list, I don't need that.
