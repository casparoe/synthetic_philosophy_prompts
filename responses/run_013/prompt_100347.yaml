  We are writing a FAQ from the Sunnybrook Meadows HOA board to residents, explaining their new futarchy-based decision system. The tone is deadpan, as if it's a normal governance notice. The humor comes from the inherent absurdity of applying prediction markets to HOA decisions, without any explicit jokes or puns.

  Key elements to include:
  - Conditional markets: e.g., betting on "if we ban leaf blowers, will the neighborhood welfare index be higher than if we don't?"
  - Voting on the welfare index, but traders pick the policy.
  - Collapsing the welfare index into one number (and the subjectivity in choosing that number).
  - The whale who can manipulate a thin market.
  - The resident who bets against a policy they actually want because they think it will fail (so they can profit and maybe push it through later?).
  - The underlying tragedy: you can win the market but still lose the neighborhood.

  The FAQ should be about 500 words, in the board's voice, and avoid naming real economists or theories.

  After the FAQ, we'll provide a JSON summary of the satire.

  Let's outline the FAQ:

  1. **Introduction**: Explain that the HOA has adopted a new decision-making system to improve efficiency and outcomes.

  2. **How It Works**:
     - Define the "Neighborhood Welfare Index" (NWI) that residents will vote on. This index is a single number that represents the overall well-being of the neighborhood. (The humor: reducing complex quality of life to one number.)
     - For each decision, two conditional markets are created: one if the policy is implemented, one if it isn't. Traders bet on which scenario will yield a higher NWI.
     - The policy with the higher market-assessed NWI is implemented.

  3. **The Voting Process**:
     - Residents vote to define the NWI (what metrics go into it, how they are weighted). But they don't vote on policies directly.
     - The board (or a committee) is responsible for measuring the NWI at a future date after the policy is implemented (or not). This introduces the problem of how to measure and collapse the index.

  4. **Potential Issues**:
     - Thin markets: When there aren't enough traders, a single large trader (a whale) can sway the market.
     - Strategic trading: Someone might bet against their preferred policy if they think the market is wrong, to profit or to influence the outcome indirectly.
     - The risk of the NWI not capturing what residents value: Even if the market "wins", the neighborhood might be worse off because the index was poorly designed or measured.

  5. **Conclusion**: Reassure residents that this system is designed to harness collective wisdom and encourage participation.

  Now, writing the FAQ in a formal, HOA notice style.

  ---

  **Sunnybrook Meadows Homeowners Association**
  **Frequently Asked Questions: New Decision-Making System**

  *Effective June 1, 2024*

  **Q: Why did the HOA adopt a new decision-making system?**  
  A: The Board believes that traditional voting often fails to capture the true preferences and best outcomes for our community. By adopting a prediction market system, we aim to make more informed decisions that maximize the Neighborhood Welfare Index (NWI). This method leverages the collective wisdom of residents who have a stake in our community's future.

  **Q: What is the Neighborhood Welfare Index (NWI)?**  
  A: The NWI is a single numerical score that reflects the overall well-being of Sunnybrook Meadows. It is calculated annually by the Board based on a set of metrics determined by resident vote. These metrics may include property values, resident satisfaction surveys, aesthetic evaluations, and other factors deemed important. The exact formula for the NWI will be reviewed and approved by majority vote each year.

  **Q: How will decisions be made under this system?**  
  A: For each proposed policy (e.g., "Ban gas-powered leaf blowers"), two conditional markets will be created:
  - Market A: What will the NWI be in one year *if the policy is implemented*?
  - Market B: What will the NWI be in one year *if the policy is not implemented*?

  Residents may trade shares in these markets, which represent predictions about the future NWI under each scenario. After a set trading period, the Board will compare the final market prices for Market A and Market B. The scenario (implement or not implement) with the higher predicted NWI becomes the HOA's decision.

  **Q: Who can participate in these markets?**  
  A: Any resident may participate. You can buy or sell shares using "Sunnybrook Credits" (SBC), a virtual currency allocated annually to each household. SBC may also be purchased with real money (subject to limits) to ensure adequate market participation.

  **Q: What if a market doesn't have many traders?**  
  A: In less active markets, large traders may have a greater influence on prices. However, the Board will monitor for manipulation. If a market is deemed too thin, the Board may extend the trading period or allocate additional SBC to stimulate participation.

  **Q: What if I support a policy but the market predicts it will lower the NWI?**  
  A: The system is designed to follow the market's prediction of what is best for the NWI, not individual preferences. However, you are free to trade based on your beliefs. For example, if you support a policy but believe it will fail to improve the NWI, you might profit by betting against it. Conversely, if you oppose a policy but believe it will raise the NWI, betting for it could be advantageous. Always trade responsibly.

  **Q: How is the NWI calculated, and what if the metrics change?**  
  A: The NWI formula is set by annual resident vote. The Board will measure the NWI one year after each decision to settle the markets. If the metrics change during the year, the Board will use the formula in place at the time of market creation. This ensures consistency for market settlement.

  **Q: What if the NWI doesn't capture what I value?**  
  A: We encourage residents to participate in the annual NWI metric vote. The Board acknowledges that no single number can perfectly represent neighborhood welfare, but the NWI is the best available tool to guide decisions objectively. Remember: even if a policy "wins" in the market, the actual outcome may not align with every resident's desires. The system aims for the greatest expected good as defined by the NWI.

  **Q: Where can I learn more?**  
  A: Visit our portal at sunnybrookhoa.org/markets for tutorials, market rules, and the current NWI formula.

