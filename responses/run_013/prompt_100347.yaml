prompt: |-
  So my homeowners association — Sunnybrook Meadows, 214 houses, one pool nobody uses — just voted to run every decision through prediction markets, and I've been trying to explain futarchy to my neighbor for a month. I don't have any academic background, I just read blogs, but I think I actually get the mechanism now and I want to write something about it.

  Can you write the FAQ the board emailed to residents, explaining the new system? Deadpan, no winking, like it's a normal governance notice, maybe 500 words. The humor has to come from the machinery being right, not from puns: the conditional markets (bet on "if we ban leaf blowers, will the neighborhood welfare index come in higher than if we don't"), the part where everyone votes on what the index should be but only the traders pick the policy, what happens when the index has to collapse into one number and somebody has to choose which number, the whale who can shove a thin market, the guy betting against the leaf-blower ban he actually wants because he thinks the ban will fail on its own merits. And the quiet thing underneath, that you can win the market and still lose the neighborhood you were trying to protect.

  Keep it in the board's own voice, don't name any real economists or theories, and the target is the idea, not a person.

  After the FAQ, give me a JSON block summarizing what the satire is doing. Fields: a top-level "straight_reading" (one sentence on whether a reader who's never heard of futarchy would still follow it), and an array "beats", each object with "mechanism_feature" (the real futarchy feature being exaggerated), "where_it_bites" (what the joke is actually about), "resident_type" (which character carries it), and "plausible_defense" (the best comeback a futarchy fan could make).
