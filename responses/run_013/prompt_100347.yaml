  ### Sunnybrook Meadows Homeowners Association  
  **Governance Update: Prediction Market System FAQ**  
  *Effective July 1, 2024*  

  **Q: Why replace voting with prediction markets?**  
  A: To optimize community welfare. Residents will vote annually to define our "Neighborhood Welfare Index" (NWI), a single metric quantifying collective well-being (e.g., property values + noise levels + pool usage). Markets then determine policies by forecasting which option maximizes the NWI. This separates *what we want* (voted by you) from *how to achieve it* (traded by participants).  

  **Q: How does a policy get implemented?**  
  A: For each proposal (e.g., "Ban gas-powered leaf blowers"), two markets open:  
  - Market A: "NWI in 12 months *if the ban passes*."  
  - Market B: "NWI in 12 months *if the ban fails*."  
  Traders buy/sell shares predicting the NWI under each scenario. After 30 days, the market with the higher final price dictates the outcome. The Board enforces the winning condition.  

  **Q: Who can trade?**  
  A: All households receive 100 "Sunnybrook Credits" (SCs) annually. SCs can be traded for real currency ($1=1 SC) to ensure liquidity. Limits apply ($500/household/year) to prevent extreme imbalances.  

  **Q: What if a market is thinly traded?**  
  A: Sparse participation may allow influential traders ("whales") to sway prices. The Board will monitor for manipulation but cannot intervene mid-market. Smaller proposals (e.g., "Mulch color for common areas") may see higher volatility.  

  **Q: Can I bet against my own preferences?**  
  A: Yes. If you support a leaf-blower ban but believe it would *lower* the NWI (e.g., due to non-compliance), you might profit by selling Market A shares. Conversely, opposing a policy while buying its shares could yield gains if the market overestimates its harm. Trading reflects beliefs about outcomes, not personal stances.  

  **Q: How is the NWI calculated?**  
  A: Annually, residents vote to weight NWI components (e.g., 40% property values, 30% noise pollution, 30% aesthetic scores). The Board then hires an independent appraiser to assign the final number. Disputes about measurement methodology (e.g., "Can tranquility be quantified?") will be resolved via a meta-market.  

  **Q: What if the "winning" policy backfires?**  
  A: Markets predict *expected* NWI, not guaranteed results. If a policy passes but the NWI underperforms (e.g., a playground renovation that lowers property values), traders who accurately predicted the outcome profit. The community, however, lives with the result until the next NWI vote.  

  **Q: Where do trading profits go?**  
  A: Profits are taxable income. Losses are not subsidized. Remember: Winning SCs does not guarantee a better neighborhood—only that your prediction aligned with the measured NWI.  

  **Q: How is this fair to non-traders?**  
  A: All residents shape the NWI via annual votes. Markets merely execute the optimal path to that goal. Participation in trading is voluntary but incentivized (SCs convert to cash).  

  **Q: What about urgent issues?**  
  A: Emergencies (e.g., fence repairs) bypass markets and use reserve funds. All other decisions require a market.  

  *Visit portal.sunnybrookhoa.org/markets for trading rules, NWI weights, and active proposals.*  

