prompt: |-
  Last night I got into a two-hour arguement with a friend about whether you can ever really "jump out of the system" — the Hofstadter/GEB idea — or whether every apparent jump is just climbing into a slightly bigger system, and we kept circling back to the MU-puzzle (start from MI, four rules, try to reach MU) and got absolutely nowhere. Next week I'm interviewing a guy on my podcast who's made a whole career out of the claim that JOOTSing is real, that it's basicly what creativity is, and that the MU-puzzle is the cleanest little example of it in action. You're a philosopher of logic and cognitive science. Think carefully, and start by brainstorming the places his position is actually vulnerable before you write anything. Then give me 8-10 interview questions that don't just let him restate the view. I want at least one on whether the invariant argument that proves MU is underivable is itself just a formal move (so not really a jump at all), at least one on the difference between genuinely jumping out and merely switching to a stronger system, and at least one on whether a machine could JOOTS or whether that's supposed to be the one trick it can never pull off. For each of those three, add a follow-up aimed at the answer he's most likely to give. End with one question that would make him commit to something that could turn out to be false.
