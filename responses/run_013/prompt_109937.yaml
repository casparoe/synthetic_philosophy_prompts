prompt: |-
  I am a graduate student in statistics who has been sitting in on a reading group about the foundations of probability, and I keep meeting a pattern that I now recognise immediately but can neither name nor adjudicate. Two people agree on every fact about a set-up, and yet they assign different probabilities, because each has silently decided that a different quantity is the one that is spread evenly. Last term two friends of mine argued for an hour about a machine that turns out cubes: one said that the side lengths are the things distributed uniformly between zero and one metre, the other that the volumes are, and they gave different answers to the innocent question of how likely a cube is to come out smaller than half a metre on a side, each appealing to the thought that the machine has no preferences. I have since met the same disagreement in an older and prettier form, about how likely a randomly drawn chord of a circle is to be longer than the side of the inscribed equilateral triangle; the answers one third, one half and one quarter are all defended, in earnest, by people who agree about every geometrical fact. I know that the second of these examples has a famous name attached to it, and I have been told more than once that the general moral is that no prior is ever genuinely uninformative. Neither of those facts is what I am after.

  Two further things I have noticed make me think that general moral is too quick. The first is that these disputes do not all end the same way. Sometimes somebody produces a further consideration — that the answer ought not to change when the whole set-up is rescaled, or when the object is rotated, or when two descriptions of the same situation are exchanged for one another — and everyone, including the people who had given the other answers, accepts that the matter is now settled and that the discarded answers were artefacts of a poor choice of variable. Other times the same style of consideration is produced on both sides, the demands cannot all be met at once, and the discussion ends with a shrug and the remark that the question was ill-posed. I cannot tell in advance which kind of case I am in. The second is that in the chord case the obvious symmetry seems to be useless: as far as I can see, all three of the standard answers are unaffected by rotating the circle, so whatever is doing the real work in the arguments that people accept must be something other than that symmetry, and I do not know how to tell a symmetry argument that genuinely constrains the answer from one that merely ratifies a convention that happens to feel natural to us.

  What I would like is to know whether there is an established concept, or a body of work, for this general situation — a probability that is only defined relative to a choice of which variable is to be uniform, where invariance considerations sometimes rescue the question and sometimes do not — and how it stands to the nearest things I already know of, such as the puzzle about the chords, and the older worry about which class of cases one should count when assigning a probability to a single case. Please do not stop at a label. What I want is a genuine carving: what exactly the phenomenon is, what distinguishes the disputes that a consideration of this kind can settle from those it cannot, where the boundary lies between this and the perfectly respectable fact that a probability may depend on one's background information, and, if there is no established concept for it, a proposed term with a definition and clear cases on either side of its edge.
reasoning: |-
  Okay, let me start by unpacking the graduate student's query. They're encountering a recurring issue in probability foundations where two people agree on all factual details but assign different probabilities because they assume different variables are uniformly distributed. The cube example illustrates this: one person assumes side length is uniform, the other assumes volume is uniform, leading to different probabilities for the cube being smaller than half a meter. The chord problem is another classic example with multiple defensible answers.

  The student has two key observations. First, these disputes resolve differently—sometimes an invariance principle (like scale or rotation invariance) settles the debate, but other times such principles conflict and the question is deemed ill-posed. Second, in the chord problem, rotational symmetry doesn't help because all standard answers satisfy it, suggesting deeper principles are at play. They want to understand what distinguishes resolvable cases from unresolvable ones, beyond just labeling it as the "uniform prior problem."

  I recall that the chord problem is Bertrand's paradox, which is a classic example of how different "natural" uniform priors lead to different probabilities. But the student already knows that and the common moral about uninformative priors. They're seeking a deeper structural understanding.

  The core issue seems to be about the choice of a "natural measure" on a parameter space. When the problem has inherent symmetries—like scale or rotational invariance—these can uniquely determine the measure. For example, in the cube problem, demanding scale invariance would require using a logarithmic prior (since uniform in log length implies the same distribution regardless of units), which points to the Jeffreys prior approach. But in cases like Bertrand's paradox, rotational symmetry is insufficient because the parameterization (e.g., chord midpoint vs. angle) introduces different natural measures, and no single symmetry forces one over the other.

  The distinction between resolvable and unresolvable cases hinges on whether the symmetry group acts transitively on the parameter space. For scale-invariant problems (like the cube), the multiplicative group's action leads to a Haar measure that's unique up to scale, often the log-uniform prior. In Bertrand's paradox, however, the rotational symmetry acts on the circle, but the chord length depends on how we parameterize it—midpoint on radius vs. angle vs. endpoint positions—and these parameterizations aren't equivalent under rotation, leading to incompatible uniformity assumptions.

  The student also mentions that sometimes exchanging descriptions (e.g., using different variables for the same setup) can resolve the issue if the symmetry imposes consistency. This relates to invariant measures under transformation groups. Jaynes' work on transformation groups argues that symmetries can sometimes specify unique priors. For example, for a location parameter, translational symmetry demands a uniform prior; for scale, it's log-uniform. But in Bertrand's paradox, the symmetry of rotation only gives uniformity of angle, but the chord length distribution depends on how we map angle to length, and different mappings (e.g., uniform angle vs. uniform distance from center) conflict.

  So the boundary seems to be: when the symmetry group acts transitively and freely on the parameter space, a unique invariant measure exists (Haar measure). When it doesn't, or when multiple groups apply (like rotation and translation), conflicts can arise. In the cube case, scale symmetry implies a Haar measure for the multiplicative group, leading to a log-uniform prior. In Bertrand's paradox, rotational symmetry alone doesn't fix the measure for chord length because the parameter space for chords has multiple invariant parameterizations.

  The student's question about distinguishing symmetry arguments that constrain vs. those that ratify conventions boils down to whether the symmetry imposes a unique invariant measure. If it does, the argument is substantive; if not, it's conventional.

  For a proposed carving: the phenomenon is the non-uniqueness of invariant measures under symmetry transformations. Resolvable cases occur when a symmetry group's Haar measure is unique (up to scale), unresolvable when the group is too small or multiple conflicting symmetries exist. This connects to Jaynes' transformation groups and the Haar measure in group theory. The boundary with background information is that symmetries are part of the problem structure, not subjective prior knowledge.

  I should clarify that in cases like the cube, scale invariance fixes the prior, while in Bertrand, rotational invariance alone doesn't—it needs additional symmetries. Jaynes actually resolved Bertrand by imposing rotational and translational invariance of the chord midpoint, leading to a unique answer (1/2). So when multiple symmetries are combined, resolution is possible.

  The established concept here is the use of invariant measures under symmetry groups, particularly Haar measures, for defining uninformative priors. The distinction in dispute resolution depends on whether the relevant symmetry group admits a unique invariant measure. Cases with a unique Haar measure are resolvable; others aren't. This provides the framework the student needs.
answer: |-
  Your query identifies a profound and recurring challenge in probability theory—the **parameterization dependence of uniform priors**—and seeks a structural framework to distinguish resolvable cases from irresolvable ones. This phenomenon arises when seemingly "natural" uniformity assumptions (e.g., uniform side length vs. uniform volume) yield conflicting probabilities despite agreement on all non-probabilistic facts. Below, I provide a conceptual carving, grounded in established work, that clarifies the boundary between cases where symmetry arguments resolve disputes and those where they fail.

  ---

  ### **Core Phenomenon: Invariant Measures under Symmetry Groups**
  The heart of the issue is the choice of a **reference measure** (or prior) for continuous spaces. When no prior information exists, uniformity is often assumed, but uniformity depends on how the problem is parameterized. Resolvability hinges on whether the problem's **symmetries** uniquely determine an **invariant measure**—a measure unchanged under relevant transformations (e.g., scaling, rotation, translation). This framework draws from:
  - **Haar measures** (group theory): Unique measures invariant under group actions.
  - **Jeffreys priors** (Bayesian statistics): Priors invariant under reparameterization.
  - **Transformation groups** (Jaynes, 1973): Using symmetries to define uninformative priors.

  #### **Key Distinction: Unique vs. Non-Unique Invariant Measures**
  | **Resolvable Cases**                     | **Irresolvable Cases**                  |
  |------------------------------------------|------------------------------------------|
  | Symmetries generate a **transitive group action** on the parameter space, yielding a **unique** (up to scale) invariant measure. | Symmetries are insufficient or conflicting, leading to **multiple competing invariant measures**. |
  | *Example*: Cube side length. Demand scale invariance (units shouldn't matter). The unique scale-invariant measure is **uniform in log-length** (Jeffreys prior for scale parameters). This forces uniformity in log-volume too, resolving the dispute: probability of side < 0.5m is 1/2. | *Example*: Bertrand's chord paradox. Rotational symmetry *alone* has multiple invariant measures (e.g., uniform in chord angle, midpoint distance, or endpoint separation). No group action reconciles them. |
  | *Why resolvable?* Symmetries constrain all parameters simultaneously (e.g., scaling affects both length and volume). | *Why irresolvable?* Symmetries act on auxiliary spaces (e.g., circle rotation), but do not specify how to parameterize the target quantity (chord length). |

  ---

  ### **Boundary Criteria: When Do Symmetries Resolve Disputes?**
  Symmetry arguments succeed only if they **uniquely fix the reference measure** for the *quantity of interest*. Use these tests:

  1. **Transitive Action Criterion**  
     The symmetry group must act **transitively** on the parameter space (any point can map to any other via symmetry).  
     - *Success*: For the cube, the multiplicative scaling group acts transitively on lengths. Haar measure: \( d(\log \text{length}) \).  
     - *Failure*: In Bertrand's paradox, rotation acts transitively on the circle, but **not** on the *set of chords*. Chords of fixed length occupy distinct orbits.

  2. **Commutativity Criterion**  
     Symmetry transformations must **commute** with reparameterizations. If not, uniformity in one variable clashes with another.  
     - *Success*: Scaling commutes with volume-length conversion (\( V = L^3 \)) only under log-uniformity.  
     - *Failure*: For chords, rotating the circle ≠ translating the midpoint; these do not commute.

  3. **Maximal Symmetry Principle**  
     Demand invariance under the **largest reasonable symmetry group**.  
     - *Success*: Jaynes (1973) resolved Bertrand's paradox by imposing **rotational + translational invariance** for the chord midpoint, yielding a unique answer (\( P = 1/2 \)).  
     - *Failure*: If symmetries are under-specified (e.g., only rotation), multiple measures persist.

  ---

  ### **Why Symmetry Alone Fails in Bertrand's Paradox**
  Rotational symmetry is too weak: it preserves uniformity in *angular* parameters (e.g., chord orientation), but not in *metric* parameters (e.g., distance from center). The three classic answers correspond to three distinct invariant measures:
  - \( P = 1/3 \): Uniform chord endpoint (arc length).  
  - \( P = 1/2 \): Uniform chord midpoint (distance from center).  
  - \( P = 1/4 \): Uniform chord angle (via area elements).  
  All respect rotation, but no larger symmetry reconciles them. Jaynes' solution worked by imposing an *additional* symmetry (translational invariance of midpoints in the disk), which is natural if the circle is "ignorant" of its center.

  ---

  ### **Distinction from Background Information**
  This issue is **not** about subjective background knowledge but about the **structure of ignorance**:
  - **Background information** affects which *events* are considered (e.g., knowing a coin is biased).  
  - **Parameterization dependence** arises when *no information* privileges one variable over another.  
  Crucially, symmetries are **objective features of the problem** (e.g., a circle's rotational symmetry), not subjective beliefs. When symmetries uniquely determine a measure, the prior is "uninformative" in an absolute sense; when they conflict, the problem is ill-posed without further constraints.

  ---

  ### **Established Terminology and Framework**
  This is the **geometric probability** or **invariant measure problem**, central to:
  1. **Bertrand's paradox** (1889): The chord example, resolved by Jaynes via transformation groups.  
  2. **Haar measures** (1933): For locally compact groups, unique invariant measures.  
  3. **Jeffreys priors** (1946): Priors invariant under reparameterization (e.g., \( p(\theta) \propto \sqrt{I(\theta)} \)).  
  4. **Transformation groups** (Jaynes, 1973): Symmetries as the basis for objective priors.  

  **Proposed term for the phenomenon**:  
  **Symmetry-Restricted Uniqueness (SRU)**  
  - *Definition*: A probability problem exhibits SRU if its symmetries generate a unique invariant reference measure for the quantity of interest. Disputes are resolvable iff SRU holds.  
  - *Clear cases*:  
    - SRU holds: Cube size (scale symmetry ⇒ log-uniform).  
    - SRU fails: Bertrand's chord (rotation symmetry alone ⇒ non-unique measures).  
    - SRU recovered: Bertrand's chord with Jaynes' maximal symmetry (rotation + translation).

  ---

  ### **Practical Guidance**
  To adjudicate disputes:
  1. **Identify all relevant symmetries** (scaling, rotation, translation).  
  2. **Demand invariance under the largest group** (e.g., "probabilities must be unchanged if the apparatus is doubled in size").  
  3. **Check for transitivity**: If symmetries can map any configuration to any other, SRU likely holds.  
  4. **Test commutativity**: Reparameterization should not break symmetry.  

  When SRU fails (e.g., Bertrand's paradox without Jaynes' fix), the problem is genuinely ill-posed—no "natural" prior exists, and probabilities are artifacts of arbitrary choices. This is not a flaw in probability theory but a reflection that some questions require additional structure to be well-defined.

  ---

  ### **References for Deeper Exploration**
  - Jaynes, E. T. (1973). ["The Well-Posed Problem"](https://doi.org/10.1007/978-94-010-1436-6_6) (*Foundations of Physics*): Resolves Bertrand's paradox using transformation groups.  
  - Kass, R. E., & Wasserman, L. (1996). ["The Selection of Prior Distributions"](https://doi.org/10.1080/01621459.1996.10477003) (*JASA*): Reviews Jeffreys priors and invariance.  
  - Diaconis, P. (2018). ["The Markov Theory of Algorithms"](https://arxiv.org/abs/1801.06377): Discusses Haar measures in applied probability.  
  - Ambartzumian, R. V. (1982). *Combinatorial Integral Geometry*: Generalizes geometric probability.

  This framework transforms paradoxes into diagnostics: if SRU holds, objectivity is achievable; if not, the question demands further specification. The cube dispute is resolvable; the chord dispute is not—until you impose Jaynes' maximal symmetry.
