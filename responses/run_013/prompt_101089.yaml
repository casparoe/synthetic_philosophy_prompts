prompt: |-
  I write long-form features on science and ideas, and I'm at the reporting stage of a piece on how we should classify the great famines of the modern era — whether we are really looking at natural disasters that politics failed to mitigate, or at political crimes that used weather as an alibi. What I need from you is not an essay but a rating exercise, done carefully enough that I can interrogate the reasoning behind each number.

  Take five episodes: the Irish famine of the 1840s, the Bengal famine of 1943, the Soviet famine of 1932–33, the famine that accompanied China's Great Leap Forward, and the Sahel famine of the early 1970s. Rate each on two independent dimensions, giving a number between 0 and 1 for each:

  (a) Causal weight of deliberate political choice — how much of the excess mortality is attributable to decisions, policies or omissions by identifiable authorities, as opposed to an unavoidable natural shock.

  (b) Culpability under a no-hindsight constraint — how blameworthy those authorities are once you discount for what was genuinely unknowable, or logistically impossible, at the time and place, rather than judging them by what we now know about famine mortality.

  For (b), state explicitly what you are discounting and why. Then sort the five cases into tiers by dimension (a), and note any case whose tier changes when you switch to (b).

  Three further things. First, apply a replaceability test to each case: would a plausible alternative government of that era, with the same resource base and roughly the same moral outlook, have averted mass death — and what does your answer imply for (a)? Second, rate how far each of three frameworks — food-availability decline, the entitlement approach associated with Amartya Sen, and the political-economy view that treats famine as a crime, or as something other than literal starvation — actually explains each case, and say where a framework goes quiet. Third, flag any case whose rating would move materially if the mortality were driven mainly by disease and displacement rather than by starvation itself.

  Throughout, separate what is settled from what is genuinely contested among people who know these famines well, and do not present a contested verdict as the consensus. I will handle my own sourcing, so there is no need for a reading list or citations. Please write in British English.
reasoning: |-
  Okay, I'm reviewing this user's query about rating historical famines. They're a long-form science writer working on famine classification, needing a structured analysis without full essays. The core request involves rating five famines across two dimensions: political causality and culpability considering historical constraints. 

  The user's framing suggests deep familiarity with famine studies - they reference Sen's entitlement approach and political-economy frameworks explicitly. This isn't a beginner's request; they want nuanced, debate-aware analysis. The replaceability test and disease/displacement questions indicate they're probing structural factors beyond simple starvation narratives.

  For dimension (a), I'll need to assess each famine's "natural vs political" balance quantitatively. The Irish case seems clearest - strong consensus that British policies amplified potato blight impacts. Bengal presents sharper debates: was it war disruptions or Churchillian neglect? Soviet and Chinese cases lean heavily toward political causation despite crop failures, while Sahel involves more environmental factors.

  For (b), the no-hindsight rule complicates things. With Soviet collectivization, did planners genuinely not foresee consequences? With Bengal, contemporaries did warn about policy impacts. I'll need to reconstruct period-specific knowledge states carefully. The replaceability test helps here - imagining alternative governance scenarios.

  On frameworks: FAD (food availability decline) obviously fails for Bengal (Sen's classic case), but might partially explain Sahel. Entitlement works well for Ireland/Bengal, less so for Soviet/China where distribution was politically weaponized. Political-economy views fit all cases but risk overgeneralizing.

  Disease/displacement effects matter most where mortality patterns differ: in Soviet famine, typhus killed many already weakened by hunger; in China, migration spread epidemics. But starvation remains the primary driver in classifications.

  Tiering will show Ireland/Bengal in middle political causality, Soviet/China highest, Sahel lowest. Culpability tiers may shift - Bengal authorities had more contemporaneous warnings than Soviet planners arguably did.

  Throughout, I'll flag controversies: Churchill's role in Bengal remains hotly disputed; Chinese famine scholarship still debates central vs local responsibility. No monolithic "consensus" exists for any case except perhaps Ireland.
answer: |-
  Below is a rating analysis structured as requested, applying rigorous separation of settled vs. contested scholarship and using British English throughout. Ratings are on a 0–1 scale (0 = minimal, 1 = maximal). Contested interpretations are explicitly flagged.

  ---

  ### **1. Dimension (a): Causal weight of deliberate political choice**  
  *(How much excess mortality stems from decisions/omissions by authorities vs. unavoidable natural shock)*  

  | Famine                  | Rating (a) | Reasoning and Controversies                                                                                                    |
  |-------------------------|------------|--------------------------------------------------------------------------------------------------------------------------------|
  | **Soviet Famine (1932–33)** | 0.95       | **Settled:** Collectivisation, dekulakisation, and grain requisition quotas directly caused collapse. Natural factors minor. <br> **Contested:** *Degree* of intentionality (genocide vs. catastrophic policy failure). |
  | **China’s Great Leap Forward (1958–62)** | 0.90       | **Settled:** Communalisation, anti-sparrow campaigns, and false reporting systems were primary drivers. Drought secondary. <br> **Contested:** Central vs. local responsibility; Mao’s personal culpability. |
  | **Bengal Famine (1943)**    | 0.75       | **Settled:** War-time policies (scorched earth, export bans, prioritising military/urban supply) amplified crop shortfall. <br> **Contested:** Whether *Churchill specifically* intended neglect; role of provincial govt. |
  | **Irish Famine (1840s)**    | 0.70       | **Settled:** Laissez-faire policies, continued grain exports, and inadequate relief exacerbated blight. <br> **Contested:** Racist intent vs. ideological rigidity; scale of "unavoidability" given period knowledge. |
  | **Sahel Famine (1970s)**    | 0.30       | **Settled:** Drought primary trigger; political failures (land use, colonial legacy, weak response) worsened impact. <br> **Contested:** Weight of post-colonial economic policies vs. ecological fragility. |

  **Tiers by (a):**  
  - **Tier 1 (High political causality):** Soviet (0.95), China (0.90)  
  - **Tier 2 (Significant political component):** Bengal (0.75), Ireland (0.70)  
  - **Tier 3 (Lower political causality):** Sahel (0.30)  

  ---

  ### **2. Dimension (b): Culpability under no-hindsight constraint**  
  *(Blameworthiness after discounting unknowable/impossible factors at the time)*  

  | Famine                  | Rating (b) | Discounting Applied & Reasoning                                                                                                |
  |-------------------------|------------|--------------------------------------------------------------------------------------------------------------------------------|
  | **Soviet Famine (1932–33)** | 0.85       | Discounted: Genuine belief in collectivisation’s long-term success; logistical chaos of rapid industrialisation. <br> **Not discounted:** Ignored internal reports of starvation; punitive quotas. |
  | **China’s Great Leap Forward** | 0.80       | Discounted: Legitimate post-war industrial ambitions; limited agronomic expertise. <br> **Not discounted:** Suppression of dissent; refusal to acknowledge crisis despite evidence. |
  | **Bengal Famine (1943)**    | 0.65       | Discounted: Wartime resource constraints; fear of Japanese invasion disrupting supply chains. <br> **Not discounted:** Rejection of Indian and international aid offers; caste/class biases in distribution. |
  | **Irish Famine (1840s)**    | 0.55       | Discounted: Period economic orthodoxy (laissez-faire); limited state capacity for relief. <br> **Not discounted:** Refusal to halt food exports; racialised view of Irish dependency. |
  | **Sahel Famine (1970s)**    | 0.25       | Discounted: Limited scientific grasp of desertification; post-colonial institutional fragility. <br> **Not discounted:** Corruption in aid distribution; urban bias in governance. |

  **Tier Changes from (a) to (b):**  
  - **Soviet:** Remains Tier 1 (0.85 → still highest culpability).  
  - **China:** Remains Tier 1 (0.80).  
  - **Bengal:** Drops to **Tier 2** (0.75 → 0.65; wartime constraints reduce culpability).  
  - **Ireland:** Drops to **Tier 2** (0.70 → 0.55; period norms reduce culpability).  
  - **Sahel:** Remains Tier 3 (0.30 → 0.25).  

  ---

  ### **3. Replaceability Test**  
  *(Would a plausible alternative government with similar resources/morals have averted mass death?)*  

  - **Soviet/China:** **No.** Alternative socialist governments (e.g., Bukharinist USSR, moderate CCP) likely *would* have adjusted policies to avert famine. **Implies (a) is robust**: mortality was highly policy-dependent.  
  - **Bengal/Ireland:** **Partial.** A more interventionist/less ideological UK government *could* have reduced deaths significantly (e.g., halting exports, scaling relief). **Supports high (a) rating.**  
  - **Sahel:** **Uncertain.** Post-colonial alternatives faced similar ecological/institutional limits. **Suggests (a) is correctly lower.**  

  ---

  ### **4. Framework Explanatory Power**  
  *(0–1 ratings for each framework per famine)*  

  | Famine                  | FAD (Food Availability Decline) | Entitlement (Sen) | Political Economy/Crime | Where Frameworks "Go Quiet"                                                                 |
  |-------------------------|----------------------------------|-------------------|--------------------------|-------------------------------------------------------------------------------------------|
  | **Soviet**              | 0.30                            | 0.60              | **0.95**                 | Entitlement underplays state *weaponisation* of food distribution beyond "failure".       |
  | **China**               | 0.40                            | 0.70              | **0.90**                 | FAD/Entitlement neglect Maoist ideology’s role in *manufacturing* scarcity.               |
  | **Bengal**              | 0.20                            | **0.90**          | 0.80                     | Political economy underemphasises *wartime* disruptions (beyond malice/neglect).          |
  | **Ireland**             | 0.50                            | **0.85**          | 0.75                     | FAD overstates blight’s severity; crime lens underplays Victorian policy constraints.     |
  | **Sahel**               | **0.70**                        | 0.80              | 0.50                     | Political economy underplays *non-human* drivers (drought, soil erosion).                 |

  ---

  ### **5. Disease/Displacement Mortality Adjustment**  
  *(Would ratings change if mortality driven more by disease/displacement than starvation?)*  

  - **Soviet/China:** **Minimal change.** Disease (typhus, dysentery) was endemic to displacement (dekulakisation, forced migrations). **Strengthens (a)/(b)** as policies *caused* displacement.  
  - **Bengal/Ireland:** **Moderate change.** Cholera/malaria in Bengal and "famine fever" in Ireland were major killers. **Raises (a) slightly** (relief policies could have mitigated crowding/unsanitary conditions).  
  - **Sahel:** **Significant change.** Pastoralist displacement led to measles/diarrhoea outbreaks. **Raises (a) to ~0.40** (better resettlement/health measures were feasible).  

  ---

  ### Summary of Key Controversies & Consensus  
  - **Consensus High Policy Causality:** Soviet, China (despite intent debates).  
  - **Contested Malice vs. Incompetence:** Bengal (Churchill’s role), Ireland (genocide vs. neglect).  
  - **Consensus Environmental Primacy:** Sahel (though worsened by governance).  
  - **No-Hindsight Caveats:** All cases except Sahel show reduced culpability under (b), but authorities ignored *available* evidence.  

  This structure allows you to probe each rating’s rationale while respecting historiographical disputes. For deeper interrogation, focus on the "discounting" logic in (b) and replaceability scenarios.
