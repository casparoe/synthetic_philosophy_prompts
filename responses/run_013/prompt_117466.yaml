answer: |-
  Here’s a targeted Q&A prep sheet for your workshop, structured to anticipate your specific audience’s objections. I’ve ordered objections by potential damage (most to least), phrased as each attendee would likely voice them, with concise replies and weaknesses noted.

  ---

  ### **Top-Tier Objections (High Damage Potential)**
  1. **Objection (Totalist #1: "Salvaging Totality")**  
     *"Your ‘conflict’ assumes we must choose between Replication Invariance and strict Addition. But we can preserve both by refining ‘betterness’ for infinite sets. For instance, use *asymptotic density*: if the average welfare in World A is higher than in B over any infinite subsequence, A is better. Addition improves the average; replication preserves it. Your indeterminacy claim is premature."*  
     **Reply (2-min):** "Asymptotic approaches require convergence, which fails in cases like worlds with alternating high/low welfare lives. Worse, they violate **Anonymity** (e.g., rearranging lives can change averages). If totalism needs ad hoc convergence assumptions to avoid contradictions, it confirms my thesis: no *privileged* extension exists."  
     **Weakness:** Doesn’t fully address why convergence criteria aren’t just "better mathematics."

  2. **Objection (Set Theorist: "Equinumerosity Isn’t Enough")**  
     *"Bijections preserve cardinality but ignore *structure*. Replication Invariance treats all countable infinities the same, but worlds with different order types (e.g., ω vs. ω+1) aren’t ‘duplicates’ under natural embeddings. Betterness might depend on topological or measure-theoretic properties, not just bijections."*  
     **Reply (2-min):** "Agreed—but that’s my point. If we move beyond bijections (to order, density, etc.), we face **non-arbitrary choices**: why prefer lexicographic order over asymptotic density? Each option violates one intuition (e.g., lex order rejects Addition). This proliferates candidate orderings, none objectively privileged."  
     **Weakness:** Implies structural criteria are "arbitrary," which set theorists may reject as underselling their tools.

  3. **Objection (Decision Theorist: "Indeterminacy vs. Unbounded Choice")**  
     *"In infinite ethics, ‘no fact’ sounds like giving up. But in infinite decision theory (e.g., Pascal’s Wager), we use dominance or finite averages under partial orders. Why not say World A is *weakly better* than B if every finite subset of A is replaceable by a better finite subset in B?"*  
     **Reply (2-min):** "Such partial orders exist, but they’re **incomplete**—they can’t rank worlds differing by one life (violating Addition) or replicated pairs. If we insist on completeness, we face the original conflict. If not, we admit indeterminacy—which is my claim!"  
     **Weakness:** Concedes that *practical* decisions might use incomplete orderings, muddying the "no fact" thesis.

  ---

  ### **Mid-Tier Objections (Moderate Damage)**
  4. **Objection (Person-Affecting Theorist: "Reductio of Impersonal Value")**  
     *"Your puzzle arises because you treat ‘goodness’ as a mind-independent property of worlds. But if betterness must be *explained* by effects on individuals (as I argue), adding a good life *is* better—and replication is irrelevant unless it changes lives’ experiences. Your ‘conflict’ is artificial."*  
     **Reply (2-min):** "Even person-affecting views need trans-world comparisons! If adding a life with +10 welfare is ‘better’ for that life, is it better *simpliciter*? If so, you must explain why replication—which preserves each life’s welfare—doesn’t preserve betterness. The conflict reappears."  
     **Weakness:** Person-affecting views may reject trans-world betterness entirely, making your reply question-begging.

  5. **Objection (Totalist #2: "Essential Orderings")**  
     *"Some infinities *are* comparable. A world with all lives at +5 is clearly better than all at +3, even infinitely many. Your argument only shows indeterminacy for *some* pairs—not that ‘no fact’ applies globally."*  
     **Reply (2-min):** "Agreed for uniform worlds! But most real cases involve variation. Once welfare differs, Replication/Addition create incomparable variants (e.g., adding a +10 life to a world vs. replicating it). Crucially, **we can’t isolate ‘uniform’ cases**—non-uniformity infects all rankings via your preferred principles."  
     **Weakness:** Leaves room for "local" determinacy, which totalists could exploit.

  ---

  ### **Concessions to Make Upfront (Preempt Forced Retreats)**
  - **"Finite worlds are determinate."** Your thesis only targets infinite cases.  
  - **"I’m not against mathematical approaches."** The issue isn’t math per se, but the lack of a unique *ethically privileged* extension.  
  - **"Replication Invariance is contestable."** But emphasize its intuitive pull (e.g., duplicating every life shouldn’t change value).

  ---

  ### **The Question You Hope Nobody Asks**
  **Objection (Totalist #3/Set Theorist Hybrid): "Ambiguity in ‘No Fact’"**  
  *"You say this indeterminacy isn’t vagueness or epistemic. But what *is* it? If there’s no fact about whether A is better than B, what grounds our ethical discourse about infinite futures? Isn’t this just nihilism disguised?"*  

  **Why It’s Dangerous:** Forces you to define metaphysical indeterminacy clearly—without collapsing into epistemic humility or semantic vagueness. Your reply risks sounding either mystical ("betterness is undefined") or self-undermining ("we shouldn’t care, but I wrote this paper...").  

  **Best Reply (2-min):** "It’s a **failure of comparability** akin to parity in value theory (e.g., Mozart vs. Michelangelo). No amount of information resolves it because the world doesn’t contain a betterness fact for these cases. We should adjust our normative expectations: infinite ethics requires context-specific tools, not universal axioms."  
  **Weakness:** Parity is disputed, and this may feel evasive to formalists.

  ---

  ### **Summary Tactics**
  - **Against totalists:** Stress that all "fixes" sacrifice core intuitions (Anonymity, Completeness) or require arbitrary structures.  
  - **Against set theorist:** Acknowledge richer structures but argue they multiply candidate orderings.  
  - **Against person-affecting:** Point out that trans-world comparisons haunt any aggregative view.  
  - **Against decision theorist:** Frame indeterminacy as the *result* of demanding completeness.  
  - **Defend "no fact":** Compare to quantum indeterminacy—a feature of reality, not our models.

  You have a tight case—lean into the dilemma’s inevitability. Good luck!
