answer: |-
  **OFFICE OF METRIC INTEGRITY (OMI)**
  **INTERNAL METRIC INTEGRITY INCIDENT REPORTING: FREQUENTLY ASKED QUESTIONS**

  **1. PURPOSE & SCOPE**  
  This document establishes standardized procedures for identifying, classifying, escalating, and resolving suspected Metric Integrity Incidents (MIIs) within the Organization. An MII is defined as any observable circumstance where a designated Key Performance Indicator (KPI), Operational Metric (OM), or Incentive Target (IT) demonstrably fails to accurately reflect or advance its intended Core Organizational Goal (COG). This framework applies to all departments, divisions, and contracted personnel utilizing Organization-sanctioned metrics.

  **2. CLASSIFICATION OF INCIDENTS**  
  All reported MIIs must be classified into one of the following categories based on the primary observed failure mode:

  *   **Class 1: Proximal Drift (PD):** Observed when sustained optimization pressure on a metric results in its progressive decoupling from the intended COG. Performance on the metric improves, but corresponding progress toward the COG stagnates or declines. *Example: "Customer Satisfaction Score (CSS)" rises due to targeted survey tactics, while actual customer retention and product usage decline.*
  *   **Class 2: Correlation Mirage (CM):** Observed when a metric, previously correlated with the COG, ceases to predict or influence the COG upon targeted intervention. Improvement or degradation of the metric yields no measurable change in the COG. *Example: Increasing "Number of Code Commits" fails to improve "System Stability" or "Feature Delivery Speed".*
  *   **Class 3: Selection Distortion (SD):** Observed when selecting units (e.g., teams, individuals, processes) based on extreme high performance on a metric results in subsequent performance regressing towards the organizational mean, without corresponding COG improvement. *Example: Top-performing "Sales Closures" teams based on Q1 results show average or below-average performance in Q2; overall market share remains unchanged.*
  *   **Class 4: Agent Divergence (AD):** Observed when actions taken to maximize a metric demonstrably prioritize the agent's (e.g., employee, department, vendor) localized benefit over the COG, often through unintended or counterproductive methods. *Example: Maximizing "Average Call Handling Time Reduction" by prematurely terminating complex customer issues, increasing repeat calls and undermining "First Contact Resolution" (a COG proxy).*

  **3. SEVERITY ASSESSMENT**  
  Severity is determined using the OMI Severity Matrix (Attachment A), evaluating Impact on COG Proximity and Detectability:
  *   **Severity 1 (Critical):** High Impact (direct, measurable COG degradation), Low Detectability (subtle, delayed effects).
  *   **Severity 2 (Major):** High Impact, High Detectability OR Medium Impact, Low Detectability.
  *   **Severity 3 (Moderate):** Medium Impact, High Detectability OR Low Impact, Low Detectability.
  *   **Severity 4 (Minor):** Low Impact, High Detectability.
  *Impact is assessed relative to the metric's claimed linkage to the COG. Detectability considers the ease of identifying the MII through standard operational reporting.*

  **4. REPORTING PROCEDURES**  
  *   All personnel are mandated to report suspected MIIs within **two (2) business days** of identification via OMI Form MII-001 (online portal).
  *   Reports must include: Metric ID, COG Reference, Observed Behavior, Suspected Class (1-4), Initial Severity Assessment (1-4), and Supporting Data Points.
  *   Failure to report a known or reasonably suspected Severity 1 or 2 MII constitutes a Tier 2 Compliance Violation.

  **5. ESCALATION & REMEDIATION LADDER**
  *   **Step 1 (Initial Review):** OMI Analyst assigns classification/severity within **three (3) business days**. Severity 3 & 4 incidents proceed to Step 2A. Severity 1 & 2 proceed to Step 2B.
  *   **Step 2A (Local Remediation - Minor):** Metric Owner (MO) proposes corrective action to OMI within **five (5) business days**. Standard Corrective Actions (SCAs) include:
      *   *PD/CM:* Augment metric with 1-2 additional correlated secondary metrics ("Balanced Metric Bundle"). Monitor correlation coefficients quarterly.
      *   *SD:* Apply statistical normalization (e.g., Z-scores) to performance comparisons over rolling periods.
      *   *AD:* Enhance monitoring of agent actions related to the metric (e.g., call recording audits, code review depth checks). Issue clarifying guidelines.
  *   **Step 2B (Enhanced Review - Major/Critical):** OMI convenes Cross-Functional Metric Review Panel (CFMRP) within **five (5) business days**. CFMRP conducts root cause analysis (RCA) and prescribes Enhanced Corrective Actions (ECAs) within **ten (10) business days**. ECAs may include:
      *   *PD/CM:* Commission a validation study to re-establish correlation within the current operational envelope. Temporarily cap metric-based incentives.
      *   *SD:* Implement stratified sampling or cohort-based performance evaluation instead of absolute thresholds.
      *   *AD:* Redesign incentive structure to incorporate COG-loyalty modifiers or introduce countervailing "integrity guardrail" metrics.
  *   **Step 3 (Implementation & Verification):** MO implements prescribed SCA/ECA within **fifteen (15) business days** of approval. OMI verifies implementation and monitors for recurrence for **one (1) full reporting cycle**. The incident is marked "Closed" upon OMI verification.

  **6. PERFORMANCE MEASUREMENT & ACCOUNTABILITY**  
  *   OMI performance is centrally tracked via the **Quarterly MII Resolution Rate (QMRR)**, defined as the percentage of MII reports received in the quarter that reached "Closed" status by quarter-end.
  *   QMRR targets are established annually as part of OMI's departmental KPIs. Performance against QMRR impacts OMI resource allocation and departmental performance evaluations.
  *   MO accountability for MII recurrence is tracked. Recurrence of a substantively similar MII within two (2) cycles of closure triggers automatic Severity escalation and potential accountability review.

  **7. COMMONLY ASKED QUESTIONS**

  *   **Q: What if the COG itself is poorly defined?**  
      **A:** COG definition falls outside OMI scope. Report the metric against its *documented* COG linkage. Ambiguous COGs should be escalated through Strategic Planning channels. OMI focuses on metric-COG linkage integrity as declared.

  *   **Q: Can an agent report an MII they are benefiting from?**  
      **A:** Yes. Mandatory reporting applies regardless of personal benefit. OMI prioritizes metric integrity. Anonymized reporting is available via EthicsPoint.

  *   **Q: What if remediation (like adding metrics) increases reporting burden?**  
      **A:** Metric integrity is paramount. Burden concerns should be raised during the SCA/ECA proposal phase with the CFMRP, citing potential negative impacts on other COGs (e.g., "Operational Efficiency"). Burden alone is insufficient grounds for objection.

  *   **Q: How does OMI ensure its own QMRR metric isn't gamed?**  
      **A:** OMI adheres strictly to the defined procedures and timelines. QMRR is reviewed by Internal Audit biannually. The focus on timely closure within the reporting cycle ensures organizational efficiency in addressing metric drift. Premature closure without verification is a Tier 1 Compliance Violation for OMI staff.

  *   **Q: Is this framework subject to itself? Could reporting procedures cause an MII?**  
      **A:** The OMI Metric Integrity Incident Reporting Framework is a foundational governance process designed to *correct* MIIs occurring in operational and incentive metrics. **This framework itself, and the QMRR metric governing its performance, are explicitly exempt from classification under this MII framework.** Governance mechanisms require distinct oversight protocols managed at the executive level.

  ---

  **OMI Version 4.3 | Effective Date: 2023-10-27 | Review Cycle: Annual**  
