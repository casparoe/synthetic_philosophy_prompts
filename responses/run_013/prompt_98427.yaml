    Q4: "Consider the master chef Lee, who can cook a dish perfectly but cannot explain how to do it. Could Lee still have know-how even if Lee had no knowledge of any facts about cooking (i.e., even if Lee couldn't form beliefs about cooking)?"
        - YES: Leaf B1a (ability as capacity, no factual knowledge required)
        - NO: Leaf B1b (ability as capacity, factual knowledge required)

  Branch B2:
    Q4: "Consider the master chef Lee, who can cook a dish perfectly but cannot explain how to do it. Could Lee still have know-how even if Lee had no knowledge of any facts about cooking (i.e., even if Lee couldn't form beliefs about cooking)?"
        - YES: Leaf B2a (ability as reliable success, no factual knowledge required)
        - NO: Leaf B2b (ability as reliable success, factual knowledge required)

  Now, we have 6 leaves.

  We should also account for the case of the person who used to be able but now can't (permanently). In Branch B, we have the ability requirement, so they would say that the permanently injured person does not know how. In Branch A, they would say they do.

  And the person who can only do it by reciting steps: in the leaves that require factual knowledge (A2, B1b, B2b), they would say that Jordan (who recites steps) knows how. In the leaves that don't require factual knowledge, they might also say that Jordan knows how, but for different reasons.

  So it's covered.

  Finally, we flag the leaves that are unattractive or unexplored.

  Leaf A1: no ability and no factual knowledge required. This might be unexplored or very rare. (Perhaps a kind of non-factual internal representation view.)

  Leaf A2: intellectualism without ability requirement. Held by Stanley and others.

  Leaf B1a: anti-intellectualism with ability as capacity. Held by Ryle and many others.

  Leaf B1b: intellectualism with ability requirement (capacity). This might be held by some, but it's less common. (Perhaps Bengson and Moffett's view? But they are intellectualists who require ability.)

  Leaf B2a: ability as reliable success without factual knowledge. This might be a pure reliabilist view.

  Leaf B2b: intellectualism with reliable success requirement. This is probably unattractive because it would mean that know-how is lost in temporary impairment and regained when the impairment is gone, and it requires factual knowledge, which might be stable. So it's coherent but might not match intuitions.

  We can present the tree as above.

  Let me know if you want adjustments.
answer: |-
  Below is a decision tree designed to guide students through the core questions in the know-how vs. know-that debate without presupposing any philosophical labels. The tree starts with accessible cases and branches along the key conceptual "joints" you specified (ability requirements, factual basis, dispositional structure, and gradability). It accounts for your threshold cases (e.g., never-done-it, inarticulate expert, conscious recitation, lost ability, and opaque method) and is built from logical space first—only coherent combinations are included, with unattractive or unexplored views flagged.  

  The tree has **6 leaves**, corresponding to distinct, coherent positions. Two views that collapse into the same answers are merged (see Leaf 3/4 note). Each node is a plain question about a case, phrased so students can answer based on intuition alone. Descriptions of the leaves focus on commitments (not names), and threshold cases are integrated throughout to force nuanced distinctions.

  ---

  ### **Know-How Decision Tree**
  *Start here. Answer each question based on the case. Follow the arrows to the next question or a leaf (final position).*

  **1. Case: Alex**  
  Alex has studied swimming from books and videos—they understand buoyancy, strokes, and breathing—but has never been in water. When they try, they panic and sink.  
  **Does Alex know how to swim?**  
  - **YES** → Go to **Question 2**  
  - **NO** → Go to **Question 3**  

  **2. Case: Taylor**  
  Taylor was a concert pianist for 20 years but suffered permanent hand paralysis. They remember techniques vividly and can describe how to play a sonata, but they’ll never play again.  
  **Does Taylor still know how to play piano?**  
  - **YES** → Go to **Question 4**  
  - **NO** → Go to **Question 5**  

  **3. Case: Sam**  
  Sam is a skilled archer. Today, a temporary drug makes their hands shake, so they miss every target. When the drug wears off, they’ll shoot perfectly again.  
  **Does Sam know how to shoot an arrow right now?**  
  - **YES** → Go to **Question 6**  
  - **NO** → Go to **Question 7**  

  **4. Case: Lee**  
  Lee is a master chef who cooks a complex dish perfectly every time. When asked how, they say, "I just do it," and can’t describe ingredients, steps, or techniques.  
  **Could Lee know how to cook this dish even if they had no knowledge of any facts about cooking (e.g., couldn’t form beliefs about recipes or methods)?**  
  - **YES** → **Leaf 1**  
  - **NO** → **Leaf 2**  

  **5. Case: Jordan**  
  Jordan can ride a bike but only by consciously reciting steps: "Push left pedal now, lean right now." Without this inner monologue, they’d fall.  
  **Is Jordan’s bike-riding knowledge fundamentally about facts (e.g., truths about steps), or is it something else?**  
  - **ABOUT FACTS** → **Leaf 3**  
  - **SOMETHING ELSE** → **Leaf 4**  

  **6. Case: Morgan**  
  Morgan ties knots expertly but can’t tell whether they’re using Method A or B (both of which they’ve mastered). Their hands "just know" what to do.  
  **Is Morgan’s know-how a single, general ability (e.g., "knowing how to tie knots"), or a bundle of specific abilities (e.g., "knowing how to tie Reef Knots" + "knowing how to tie Bowlines")?**  
  - **SINGLE ABILITY** → **Leaf 5**  
  - **BUNDLE OF ABILITIES** → **Leaf 6**  

  **7. Case: Jamie**  
  Jamie is a novice and an expert both "know how to drive," but the expert handles icy roads smoothly while the novice skids.  
  **Can one person "know how to drive" better than another, or is know-how all-or-nothing?**  
  - **BETTER/WORSE** → **Leaf 3** (Note: Same as Leaf 3 from Q5)  
  - **ALL-OR-NOTHING** → **Leaf 4** (Note: Same as Leaf 4 from Q5)  

  ---

  ### **Leaf Positions: Core Commitments**
  Each leaf represents a coherent view. Combinations not listed are either incoherent (e.g., requiring ability but denying it matters for thresholds), unattractive (e.g., requiring current success *and* factual knowledge, making know-how too fragile), or unexplored. Threshold cases define the boundaries.

  - **Leaf 1: Non-Factual, Ability-Optional Know-How**  
    - **Commitments**:  
      - Know-how does not require the ability to perform the action (*Alex case: YES; Taylor case: YES*).  
      - Know-how is not factual—it can exist without beliefs or knowledge about methods (*Lee case: YES*).  
      - Explains inarticulate experts (Lee) and "lost ability" cases (Taylor): Know-how is a persistent, non-cognitive state (e.g., embodied potentiality).  
      - **Threshold handling**: Never-done-it (Alex) and permanently unable (Taylor) still "know how" because ability is incidental.  
      - **Unexplored**: Rarely defended; may face challenges explaining conscious recitation (Jordan).  

  - **Leaf 2: Factual, Ability-Optional Know-How**  
    - **Commitments**:  
      - Know-how does not require the ability to perform (*Alex: YES; Taylor: YES*).  
      - Know-how *is* factual—it requires knowledge of truths about methods (*Lee case: NO*).  
      - Explains conscious recitation (Jordan): If you know the facts, you know how, even if reliant on step-by-step execution.  
      - **Threshold handling**: Inarticulate experts (Lee) must have implicit factual knowledge; lost ability (Taylor) retains know-how via retained facts.  
      - **Coherence**: Stable but clashes with intuitions that ability matters (e.g., Sam’s impairment).  

  - **Leaf 3/4: Factual Know-How with Ability Conditions**  
    (*Leaf 3 from Q5 and Q7; Leaf 4 from Q5 and Q7 are identical in commitments, hence merged*):  
    - **Commitments**:  
      - Know-how requires the ability to perform (*Alex: NO; Sam: NO*).  
      - Know-how *is* factual—it requires knowledge of truths about methods (*Lee case: NO; Jordan: ABOUT FACTS*).  
      - Ability is tied to reliable success in current conditions (*Sam: NO*).  
      - Comes in degrees (*Jamie: BETTER/WORSE*) OR is a bundle of abilities (*Morgan: BUNDLE*); both compatible.  
      - **Threshold handling**: Temporary impairment (Sam) loses know-how; inarticulate experts (Lee) have tacit facts.  
      - **Unattractive**: Impairments erase know-how daily, but factual knowledge persists—creates tension.  

  - **Leaf 5: Non-Factual, Dispositional Know-How (Capacity-Based)**  
    - **Commitments**:  
      - Know-how requires the capacity to perform, but this can be masked (*Alex: NO; Sam: YES; Taylor: NO*).  
      - Know-how is not factual (*Lee case: YES; Morgan: SINGLE ABILITY*).  
      - A unified disposition: Know-how is a broad, reliable tendency to succeed when unmasked.  
      - **Threshold handling**: Temporary impairment (Sam) keeps know-how (capacity remains); permanent loss (Taylor) loses it. Inarticulate experts (Lee) need no facts.  
      - **Strengths**: Handles opaque methods (Morgan) and inarticulate experts naturally.  

  - **Leaf 6: Non-Factual, Dispositional Know-How (Bundled Capacities)**  
    - **Commitments**:  
      - Know-how requires the capacity to perform, maskable (*Alex: NO; Sam: YES; Taylor: NO*).  
      - Know-how is not factual (*Lee case: YES; Morgan: BUNDLE OF ABILITIES*).  
      - A bundle of narrow dispositions: Know-how is compartmentalized (e.g., tying specific knots).  
      - All-or-nothing (*Jamie: ALL-OR-NOTHING*)—no degrees; you either have a specific ability or you don’t.  
      - **Threshold handling**: Similar to Leaf 5 but "chunkier"; explains skill variants (e.g., Morgan’s methods as separate abilities).  
      - **Unexplored**: Less developed; struggles with skill gradation (Jamie).  

  ---

  ### **Logical Space Notes**
  - **Omitted Combinations**:  
    - *Ability required + factual + current success*: Incoherent with temporary impairment (Sam). If know-how requires current success *and* facts, Sam loses know-how when impaired but retains facts—why doesn’t know-how persist?  
    - *Ability optional + factual + bundled*: Coherent but unexplored; no major theories defend it.  
  - **Collapsed Leaves**:  
    - Leaf 3 (from Q5) and Leaf 4 (from Q5) were split by *structure* (single vs. bundle) but merged when both paths converged on identical commitments for *gradability* (Q7).  
  - **Threshold Coverage**:  
    - Never-done-it (Alex): Decisive for ability requirement (Q1).  
    - Inarticulate expert (Lee): Tests factual basis (Q4).  
    - Conscious recitation (Jordan): Covered in Q5 (factual vs. non-factual).  
    - Lost ability (Taylor): Tests ability’s persistence (Q2).  
    - Opaque method (Morgan): Tests dispositional structure (Q6).  

  This tree isolates core disagreements while ensuring students confront edge cases. I recommend printing it as a flowchart (omit this appendix) and discussing why certain combinations are untenable. For next steps, I’ll provide the position names and readings—no bibliography here, as requested!
