prompt: |-
  I am a knowledge lawyer at a mid-sized firm with a large employment practice, and I have been asked to produce the internal screening note that our paralegals run on the did-they-actually-resign files — we get one or two a month, usually well after the event, and the stakes are a tribunal claim or a settlement, so a twenty-minute screen that separates the clear cases from the ones needing a partner is worth having. Our present screen asks one question: what would a reasonable reader take these words to mean? That is the right question for construction, but it keeps misfiring at the edges. One file had a message that plainly meant I am resigning and yet did not, so far as I can see, effect a resignation at all; another had a remark everyone in the room understood as a joke which, on our own reasoning, was a valid resignation the moment it was made. My suspicion is that we are running two questions together — what the words meant, and what was done in the uttering of them — and that the Austin and Searle material on performatives and speech acts has a far finer set of instruments for the second question than anything in our template. I was arguing about this with a colleague over lunch after a seminar we had both been to, and we could not get the cases to come out the same way twice, which is precisely the sort of disagreement I would like the note to make impossible.

  Please write the procedure itself: a checklist in words, with the steps in the order they are to be run, what counts as a sufficient answer at each step, the points at which it stops with a definite yes or a definite no, and the points at which it must hand the file to a person. The reader is a paralegal with no philosophy and twenty minutes; the supervising partner signs off on anything that reaches the client; and we can ask the employee nothing, so everything must be worked off the paper in the file. Keep the vocabulary plain and define any technical term in a line. At each step I would like the note to be explicit about which of three layers it is operating on — what was said, what was done in the saying of it, and what was brought about as a result — because I think most of our bad screens come from sliding from one layer to the next without noticing. Four things in particular I want the procedure to prise apart, since our lawyers keep collapsing them. First, an utterance that fails to bring the act off at all, where the machinery is absent, the wrong person is speaking, or the thing is only half-done, as against an utterance that does bring the act off but is hollow, being said without the intention or the feeling that the act presupposes: this is the distinction that decides our files, because a resignation nobody meant is, as I understand it, still a resignation, whereas an act that never came off is not a defective act but no act at all. I want the paralegal made to commit to one verdict or the other, with the reason recorded. Second, the role of the addressee: whether the act is complete only once it has been taken up or recognised, whether that holds of all such acts or only some, and which side the resignation case falls on. Third, the awkward class of joking, ironic, theatrical and play-acted utterances, which the tradition seems to want to set aside as parasitic on ordinary use and which we plainly cannot set aside, the joke resignation being exactly what lands on my desk; I would like the note to say whether that exclusion can be justified and, if not, what the procedure does with those cases instead. Fourth, the small grammatical diagnostics we already half-use — the explicit first-person present form, the hereby test — together with an honest account of where they mislead. I would also like a short set of test pairs, two sentences to a pair, one of which effects the act and one of which does not, that a paralegal can run against a live file to calibrate; and a list of the steps that are really questions of value, or of law, dressed up as questions of language, so that the reader knows where to stop and fetch someone.

  Then run the procedure on three files, giving in each case the verdict and the step that produced it. (i) An employee, in a heated corridor exchange with her team leader and in front of two colleagues, says she has had enough and is done with the place; she goes home and turns up on Monday as though nothing had happened. (ii) A manager emails a subordinate to say that this constitutes a formal written warning and that any repetition will be treated as gross misconduct, when nothing resembling our disciplinary procedure has been started. (iii) At a colleague's leaving drinks, an employee who is several drinks in announces, loudly and to general laughter, that he resigns, shakes hands all round, and is at his desk on Monday; the employer now wishes to say that he resigned, and we are acting for the employer. I expect the third to come out against our client, and I would far rather hear that from you now than from the other side later; if it does not, I want to know exactly which step is carrying the weight. Finally, be blunt about what the procedure cannot do, where it will misfire, and which of its steps will look like tests while actually being judgments. British English throughout, and no need to send me to the literature — I want the instrument, not the bibliography.
reasoning: |-
  Hmm, this is a sophisticated request from a knowledge lawyer in an employment practice. They need a practical screening tool for resignation cases, grounded in speech act theory but stripped of academic jargon. The key pain points are: misfiring on edge cases (like joke resignations or emotionally charged outbursts), collapsing distinct conceptual layers (meaning vs. effect), and lacking clear off-ramps for paralegals.

  The user's four structural requirements are critical: 
  1. Distinguishing between utterances that fail to constitute an act ("misfires") versus those that succeed but lack proper intent ("abuses") – Austin's distinction is central here. 
  2. Clarifying the addressee's role in completing the resignation act (likely key for written vs verbal cases). 
  3. Handling non-serious utterances without arbitrary exclusions (the "parasitic" language won't work here). 
  4. Validating grammatical heuristics like "I hereby resign" while flagging their limitations.

  For the operational design, I'm considering a three-layer filter: 
  - First, surface meaning (could it be resignation language?) 
  - Second, speech act conditions (did all elements for performative success exist?) 
  - Third, contextual execution (was it properly delivered/accepted?). 

  Each step needs explicit "STOP/HANDOVER" triggers. The test pairs will target classic pitfalls: e.g., "I quit!" yelled during an argument vs. the same words in a scripted play. For the case studies, the drunken resignation (iii) should fail at step 2b - absence of serious intent in context, even though words were formally correct. The manager's faux warning (ii) likely fails at step 1b (lack of authority), while the corridor outburst (i) might constitute resignation if contextual evidence shows uptake.

  Biggest vulnerability will be inferring intention from documents alone - step 2b will always be interpretive. Also, industry-specific conventions (e.g., trading floor banter) won't be captured. The template must force paralegals to articulate why they're stopping, not just box-tick. British terminology like "industrial tribunal" over "lawsuit" keeps it jurisdictionally precise.
answer: |-
  Here is a practical screening procedure for paralegals, designed to separate clear resignations from ambiguous cases or non-resignations, based on speech act theory principles without requiring philosophical knowledge. It operates on three distinct layers: **Words** (what was said), **Act** (what was done in saying it), and **Effect** (what resulted). The procedure forces a decision at each step and records reasons.

  ---

  ### **Resignation Screening Procedure**  
  **Purpose:** To determine if an employee’s words or actions constituted a valid resignation, based *only* on documents/witness statements in the file.  
  **Time Limit:** 20 minutes per file.  
  **Outcomes:**  
  - ✅ **CLEAR RESIGNATION** (Close file; no partner needed).  
  - ❌ **CLEAR NON-RESIGNATION** (Close file; no partner needed).  
  - ⚠️ **UNCERTAIN / NEEDS PARTNER REVIEW** (Escalate immediately).  

  **Key Definitions:**  
  - **Performative:** Words that *do* an action (e.g., "I resign" performs resigning).  
  - **Uptake:** The addressee (employer) must understand the act was being attempted.  
  - **Serious context:** A situation where reasonable people would treat the words as a real act, not a joke/theatre.  

  ---

  ### **The Checklist**  
  **Run steps in order. Stop at first definite ✅ or ❌. If unsure at any step, escalate to ⚠️.**  

  1. **LAYER: WORDS**  
     *What do the words literally say?*  
     - **Step 1a:** Do the words *explicitly* state "I resign," "I quit," or similar? (e.g., "I hereby tender my resignation").  
       - ✅ **YES** → Proceed to Step 2.  
       - ❌ **NO** → Go to Step 1b.  
     - **Step 1b:** Do the words *imply* resignation *without explicit statement*? (e.g., "I’m done," "I won’t be back").  
       - ✅ **YES** → Proceed to Step 2.  
       - ❌ **NO** → **STOP: ❌ CLEAR NON-RESIGNATION** (Reason: Words lack resignation meaning).  
       - ⚠️ **UNSURE** → Escalate to partner.  

  2. **LAYER: ACT**  
     *Was the employee trying to perform the act of resigning?*  
     - **Step 2a:** Was the employee *authorised/sincere*?  
       - *Check: Was it said by the employee? In a work context?*  
       - ✅ **YES** → Proceed to Step 2b.  
       - ❌ **NO** (e.g., actor in a play, impersonator) → **STOP: ❌ CLEAR NON-RESIGNATION** (Reason: Speaker lacked capacity/authority).  
     - **Step 2b:** Was the context *serious*?  
       - *Check: Was it a heated argument? A formal meeting? A joke at a party?*  
       - ✅ **SERIOUS** (e.g., disciplinary hearing, private meeting) → Proceed to Step 2c.  
       - ❌ **NON-SERIOUS** (e.g., clear joke, sarcasm, role-play) → **STOP: ❌ CLEAR NON-RESIGNATION** (Reason: Context shows no intent to perform the act).  
       - ⚠️ **AMBIGUOUS** (e.g., angry outburst, tense email) → Proceed to Step 2c but flag uncertainty.  
     - **Step 2c:** Was the act *completed*?  
       - *Check: Did the words use "hereby," present tense, first person? (e.g., "I resign now")*.  
       - ✅ **YES** (Clear performative grammar) → Proceed to Step 3.  
       - ❌ **NO** (e.g., future tense: "I will resign") → **STOP: ❌ CLEAR NON-RESIGNATION** (Reason: Words describe future intent, not present act).  

  3. **LAYER: EFFECT**  
     *Did the resignation take effect?*  
     - **Step 3a:** Was there **uptake**? (Did the employer *recognise* it as a resignation?)  
       - *Check: Did a manager acknowledge it? Did HR process it?*  
       - ✅ **YES** (e.g., employer accepted it in writing) → **STOP: ✅ CLEAR RESIGNATION** (Reason: Act completed with uptake).  
       - ❌ **NO** (e.g., ignored, treated as venting) → Proceed to Step 3b.  
     - **Step 3b:** Was uptake **reasonably possible**?  
       - *Check: Was it directed to a manager? In writing/recorded?*  
       - ✅ **YES** (e.g., email to boss, said in management meeting) → **STOP: ✅ CLEAR RESIGNATION** (Reason: Act was valid; uptake not strictly required if clear).  
       - ❌ **NO** (e.g., muttered in canteen to intern) → **STOP: ❌ CLEAR NON-RESIGNATION** (Reason: No reasonable chance for uptake).  
       - ⚠️ **DEBATABLE** (e.g., shouted in corridor) → Escalate to partner.  

  ---

  ### **Test Pairs for Calibration**  
  Use these to check the procedure against real files:  
  1. ✅ **"I resign effective immediately."** (Formal email to manager).  
     ❌ **"I’m going to resign next week."** (Future intent; no act performed).  
  2. ✅ **"I quit!"** (Shouted during argument with supervisor).  
     ❌ **"I quit!"** (Said while laughing during office karaoke).  
  3. ✅ **"Consider this my resignation."** (Letter to HR).  
     ❌ **"You’ll have my resignation soon."** (Threat; not an act).  

  ---

  ### **Where Judgment is Needed (Escalate Here!)**  
  These steps are **not** mechanical – they require interpretation:  
  - Step 1b (Did words *imply* resignation?).  
  - Step 2b (Was the context *serious*?).  
  - Step 2c (Was the grammar *performative enough*?).  
  - Step 3b (Was uptake *reasonably possible*?).  
  **⬆️ IF IN DOUBT AT THESE STEPS, ESCALATE ⚠️**  

  ---

  ### **Procedure Limitations**  
  **Misfires when:**  
  1. **Industry jargon** exists (e.g., "I’m out" may mean resignation in finance).  
  2. **Cultural/linguistic nuances** are missed (e.g., sarcasm not obvious on paper).  
  3. **Intention is disputed** without witness evidence (Step 2b relies heavily on context).  
  4. **Employer’s reaction is irrational** (e.g., ignores clear resignation – still valid).  
  **Biggest risk:** Step 2b (serious context) is subjective. Paralegals *must* escalate ambiguous cases.  

  ---

  ### **Case Studies**  
  **File (i):** Employee says "I’ve had enough; I’m done with this place" in heated corridor exchange.  
  - Step 1a: ❌ No explicit words.  
  - Step 1b: ✅ "I’m done" implies resignation → Proceed.  
  - Step 2a: ✅ Employee in work context → Proceed.  
  - Step 2b: ⚠️ **Ambiguous** (heated argument = serious? Not clearly a joke) → ESCALATE.  
    *(Verdict: ⚠️ Needs partner. Reason: Context may show anger, not intent to resign.)*  

  **File (ii):** Manager emails subordinate: "This is a formal written warning; any repeat = gross misconduct."  
  - Step 1a: ❌ Not resignation language.  
  - Step 1b: ❌ Words imply warning, not resignation → **STOP: ❌ CLEAR NON-RESIGNATION**.  
    *(Verdict: ❌ Not a resignation. Reason: Wrong act entirely.)*  

  **File (iii):** Drunk employee at leaving drinks announces "I resign!" to laughter, shakes hands, returns Monday.  
  - Step 1a: ✅ "I resign" explicit → Proceed.  
  - Step 2a: ✅ Employee → Proceed.  
  - Step 2b: ❌ **Non-serious** (drunk, at party, general laughter) → **STOP: ❌ CLEAR NON-RESIGNATION**.  
    *(Verdict: ❌ Not a resignation. Reason: Context was clearly theatrical/joking. Step 2b decisive.)*  

  ---  
  **Final note:** This procedure prioritizes **certainty**. It errs toward ❌ or ⚠️ when context/intent is unclear. The drunken resignation (iii) fails at Step 2b – no partner needed. If the employer *relied* on it (e.g., accepted and hired replacement), escalate to assess estoppel (beyond speech acts). British case law (e.g., *Sovereign House v Summers*) supports this contextual approach.
