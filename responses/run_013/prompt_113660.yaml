prompt: |-
  I'm a retired field biologist (wetlands, mostly) and since I quit counting sedge seeds I've been reading philosphy and social choice theory. I keep tripping over Condorcet. One version of him seems to say that if each voter is even a hair better than a coin flip at picking the right answer, then a big enough majority is almost certain to get it right — so the bigger the electorate, the wiser. Another version of him seems to say majority rule can tie itself in knots, cycling A over B, B over C, and C over A, so there's no right answer at all. And I read somewhere that if the crowd is just slightly worse than random, the majority is almost certain to be wrong, which makes the whole thing sound like a knife-edge. If all of this is true, how can anyone seriously defend referendums or juries? And if the first one is right, why would we ever leave a decision to a nine-person court or a small parliament instead of a national vote of 50 million? Shouldn't we be replacing expert panels with mass ballots on everything from drug approvals to constitutional amendments? I suspect I'm missing somthing obvious, and I'd like to get the concepts straight rather than collect citations. Could you walk me through it in this order: (1) 'What I think Condorcet says' — a short restatement, maybe 100 words, of the view you're attributing to me; (2) 'Where the two results actually live' — 250-350 words separating the jury theorem from the cycling result and saying what each one is and isn't about; (3) 'What that means for real votes' — 250-350 words on independence, competence, values vs facts, and why a 50-million-person referendum isn't automatically wiser than a committee; (4) 'Bottom line' — 2-3 sentences. No need for names and dates beyond what's needed to keep the ideas apart.
