  Okay, the user is describing a pattern they've observed where multiple parties end up in a competitive situation that escalates beyond the value of the prize. They mention auctions, legal disputes, and strikes as examples. They're familiar with the dollar auction but feel it doesn't fully fit because in their cases, everyone pays, the prize might shrink, and winning might just be about making the other side lose.

  First, I need to identify the core structure they're describing. The key elements are: sunk costs, incremental payments, and the prize's value being overshadowed by total costs. The dollar auction is a starting point, but as they noted, it usually involves only the top two bidders paying, whereas here all participants pay. That's a significant difference. Also, in their examples, the prize might depreciate due to the conflict itself, which isn't present in the standard dollar auction.

  They also mentioned the sunk-cost fallacy, but they're questioning if it's the right frame because each party is acting rationally at each step. That's important. In game theory, even rational actors can end up in these traps due to the structure of the game. So, the distinction between individual rationality and collective irrationality is crucial here. Escalation of commitment might cover some aspects, but it's often more individual-focused. The user wants to know if there's a specific term or concept that encapsulates this dynamic.

  Looking at their examples: the boundary dispute where legal fees exceed the land's value, and the strike where both sides lose more than the disputed amount. These involve multiple parties all incurring costs, not just the winners. The auction example might be closer to the dollar auction, but they specified that in their cases, everyone pays. So maybe the dollar auction is a subset, but the broader concept is a multi-party escalation game with sunk costs.

  The user is also interested in which feature is key to the trap. Is it the sunk costs, the fixed prize, small increments, or something else? Removing sunk costs might help, but in these scenarios, the sunk costs are inherent. If the prize isn't fixed and shrinks during the conflict, that exacerbates the problem. Small incremental payments make it easier to justify each step, leading to deeper entrapment. The all-pay aspect is critical because it ensures that every participant bears costs, increasing the overall loss.

  They might also be hinting at the psychological aspect versus structural incentives. The sunk-cost fallacy is cognitive, but here the issue is strategic. The trap arises from the rules of engagement, not just faulty reasoning. This is important because solutions would differ. Preventing entry or changing the payoff structure could mitigate it, whereas addressing cognitive biases wouldn't solve the structural problem.

  So, the closest concepts are escalation games or multi-player traps. However, the user wants precision. Terms like "escalation trap" or "bidding war" might apply, but they need differentiation. The dollar auction is a specific model, but the user's scenarios are variations. The all-pay contest fits the legal dispute and strike examples better. The war of attrition applies when time is a factor, like strikes.

  The user's deeper need is understanding the mechanics to avoid or resolve such situations. They might be seeking frameworks to analyze real conflicts, possibly in their personal or professional life. Recognizing the structural incentives could help design interventions, like third-party mediation or changing rules to limit sunk costs.
answer: |-
  You've articulated a profound and pervasive pattern that sits at the intersection of economics, game theory, and behavioral science. While no single term perfectly captures every nuance you described, your observation is astute, and the pattern has well-studied roots. Let's carve it up systematically:

  **Core Name & Family:** Your pattern is best understood as a specific manifestation of an **Escalation Game** (or **Escalation Trap**), often falling under the broader umbrella of **Competitive Commitment Dilemmas**. Key related concepts include:
  1.  **All-Pay Auctions:** (The most direct fit for *most* of your examples, differing from the dollar auction).
  2.  **Wars of Attrition:** (Especially relevant for strikes and legal battles).
  3.  **Sunk Cost Fallacy:** (A contributing psychological factor, but not the core driver).
  4.  **Escalation of Commitment:** (A behavioral phenomenon closely linked, but broader).

  **How Your Pattern Differs & Fits:**

  1.  **Dollar Auction:**
      *   **Dollar Auction:** Two main bidders; winner pays their bid and *gets the prize*; loser pays their bid and *gets nothing*. Total paid often exceeds the prize value. Prize is fixed (e.g., $1).
      *   **Your Pattern:**
          *   **Multiple Payers:** Often *all* participants pay costs, regardless of outcome (legal fees for both sides, strike losses for both company and union). This is the defining feature aligning it with *All-Pay Auctions*.
          *   **Prize Depreciation:** The prize itself may *shrink* due to the conflict ("the fight itself consumes it"). This isn't inherent in the dollar auction.
          *   **Negative Value of Winning:** Winning might primarily mean denying victory to the other side ("the only value of winning is that the other party loses"), adding a strong competitive/vengeance motive beyond the nominal prize.
      *   **Best Fit:** Your examples (legal dispute, strike) are **Multi-Party All-Pay Contests** (where everyone pays their costs) where the prize may depreciate, and victory often has significant negative utility for the loser embedded in the winner's utility.

  2.  **Sunk Cost Fallacy:**
      *   **Sunk Cost Fallacy:** An *individual* cognitive bias where past investments (sunk costs) irrationally influence future decisions ("I've spent this much, I *have* to see it through").
      *   **Your Pattern:** While sunk costs *exist* (past payments are gone), the *primary driver* in your description is **rational forward-looking calculation based on the current structure of the game.** At each step, given the sunk costs and the *actions of the opponent*, investing a little more *can* be the rational choice to avoid a total loss *or* secure the (possibly diminished) prize *or* inflict a loss on the rival. The trap arises from the *strategic interaction*, not (solely) from individual cognitive error. Sunk costs create the *landscape* for the trap, but the *mechanism* is the competitive escalation.
      *   **Distinction:** You're right to be suspicious of *only* labeling it sunk cost fallacy. The trap persists even if players are perfectly rational calculators *within the frame of the ongoing game*. The irrationality is often *collective* and *structural*.

  3.  **Escalation of Commitment:**
      *   **Escalation of Commitment:** A broader behavioral tendency to increase investment in a failing course of action to justify prior investments. It incorporates the sunk cost fallacy but can also involve project dynamics, self-justification, and organizational pressures.
      *   **Your Pattern:** This is a *specific sub-type* of escalation of commitment characterized by **explicit, direct competition between parties**, **incremental costs paid by all**, and a **prize whose value is ultimately overshadowed by the collective costs of the competition**. The competitive element is central and distinguishes it from, say, escalating investment in a failing internal R&D project.

  **The Core Structure & The Key Feature:**

  The essential structure enabling your trap is:
  1.  **Irrecoverable Entry/Continuation Costs (Sunk Costs):** Payments made to stay in the game are lost forever, win or lose.
  2.  **Incremental Decision Points:** The conflict unfolds through a series of small(er) steps (another bid, another month of legal fees, another week of strike).
  3.  **Competitive Interaction:** Each party's decision to continue depends critically on the expected actions of the other party(ies). It's a *game*.
  4.  **Asymmetric Payoff at Each Step:** At any decision point, *given the sunk costs and the opponent's likely action*, the potential marginal gain (winning the prize OR avoiding the humiliation/loss of conceding) *outweighs* the marginal cost of the next increment *for at least one player*.
  5.  **Information Asymmetry/Uncertainty:** Players often underestimate the final cost, overestimate their chance of winning, or misjudge the opponent's resolve.

  **The Single Most Important Feature Doing the Work: The combination of Sunk Costs + Competitive Interaction.**

  *   **Remove Sunk Costs:** If players could recover costs upon withdrawal or only paid upon winning, the trap largely dissolves (e.g., standard first-price sealed-bid auction). Players could walk away cleanly if the escalating cost exceeded the prize value. *This is the most critical factor.*
  *   **Remove Competition:** If it's a single actor deciding on a project (no rival bidding up the price or fighting back), it becomes a simpler escalation of commitment/sunk cost problem, often easier to exit.
  *   **Large Incremental Costs:** If the next step required a payment larger than the prize's *remaining* value, rational players would stop. Small increments make it easy to justify "one more step."
  *   **Fixed, Non-Depreciating Prize:** While a depreciating prize worsens the outcome, the trap *can still occur* with a fixed prize (as in the dollar auction and classic all-pay auctions). The core driver is the sunk cost + competition dynamic. A depreciating prize just makes the collective loss even more tragic and obvious.

  **Why the Trap Forms & Edges:**

  *   **The "Correct" Individual Incentive Trap:** You hit the nail on the head. At each *individual* step, *given the sunk costs and the opponent's expected action*, continuing *is* often the rational choice for a player focused solely on minimizing their own loss or maximizing their own gain relative to the opponent. The problem is that this "rational" path leads both players to a collectively disastrous outcome.
  *   **The Collective Irrationality:** While each step seems sensible individually, the *sequence* of steps leads to a Pareto-inferior outcome – *all* players would have been better off if they could magically agree *at the start* not to play, or to settle immediately. This is the hallmark of a **Prisoner's Dilemma-like structure applied over multiple rounds**.
  *   **The Edge Cases / Where the Trap Dissolves:**
      *   **No Sunk Costs:** If costs are recoverable or only paid by the winner.
      *   **Perfect Information & Credible Commitments:** If both players know *exactly* how much the other is willing to spend and can *credibly commit* to a limit upfront, they might avoid escalating beyond the prize value or settle immediately. (This is rare in reality due to bluffs and uncertainty).
      *   **Very Large, Disproportionate Increments:** If the next required payment is immediately and obviously ruinous compared to the prize.
      *   **External Enforcement/Mediation:** A binding arbitration clause, a mediator trusted by both sides, or an external authority can force a settlement before costs escalate massively.
      *   **Clear Power Imbalance:** If one side knows it will inevitably lose quickly and cheaply, it may concede early.

  **Conclusion:**

  You've identified a robust and destructive pattern: **Competitive Escalation in an All-Pay Framework with Sunk Costs.** The **dollar auction** is a specific, simplified 2-player model with a fixed prize where only the top two pay. Your observations generalize this to **multi-party all-pay contests** where *everyone* pays costs, the prize may *depreciate* due to the conflict itself, and the value of victory often includes the *negative utility inflicted on the loser*.

  While the **sunk cost fallacy** is present (the sunk costs create the landscape), the core driver is the **rational, forward-looking, yet collectively disastrous, strategic interaction** between competitors locked in a game where past investments create perverse incentives for future escalation. **Escalation of commitment** is the broad behavioral category, but your pattern specifies the intensely *competitive* nature of the escalation.

  The trap's power lies in the **relentless logic of each incremental step**, fueled by sunk costs and competition, overpowering the collective wisdom that the whole endeavor is irrational from the outset. Understanding this structure – particularly the fatal role of unrecoverable costs combined with rivalry – is the key to recognizing and potentially mitigating such destructive conflicts.
