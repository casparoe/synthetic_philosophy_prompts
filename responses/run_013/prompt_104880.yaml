  ### **Favour Exchange: Game Design & Implementation Guide**  
  *Goal:* Create a visceral experience of moral trade under constraints, emphasizing gains from specialization, friction, and incommensurability of values.

  ---

  ### **Core Mechanics**  
  1. **Value Profiles**:  
     - Each player receives a card with private weights for 4 causes (summing to 100):  
       - `A`: Animal Welfare  
       - `P`: Global Poverty  
       - `R`: AI Risk  
       - `L`: Local Cause (e.g., "Your Neighborhood")  
     - **Sample Cards** (ensure 3 mirror pairs, e.g., [40, 30, 20, 10] and [10, 20, 30, 40]).  

  2. **Action Tokens**:  
     - Each player starts with **6 tokens** (each represents an action costing ~2 hrs/$20 effort):  
       - `A1`: Vegan week (Animal)  
       - `A2`: Donate to animal shelter (Animal)  
       - `P1`: Donate to poverty charity (Poverty)  
       - `R1`: Write AI safety article (AI Risk)  
       - `R2`: Attend AI policy meeting (AI Risk)  
       - `L1`: Volunteer locally (Local)  
     - **Rule**: Players MUST spend all tokens.  

  3. **Scoring**:  
     - **Score = Sum of weights for *all tokens spent* on each cause** (e.g., if 5 `A` tokens are spent globally, a player with 40% `A` weight scores `5 × 40 = 200`).  
     - Players only control *which actions they personally perform* – but benefit from *others' actions* on causes they value.  

  4. **Trading**:  
     - Trade tokens 1:1 (e.g., "I’ll do your `A1` if you do my `R1`").  
     - **No fractional trades** – tokens are indivisible obligations.  

  ---

  ### **Frictions Layer**  
  1. **Moral Constraints**:  
     - 2–3 players get constraint cards:  
       - *"Cannot promote [Cause] – any trade involving this cause is forbidden."*  
       - (e.g., "Cannot support AI Risk – it’s inherently unethical").  

  2. **Unenforced Round**:  
     - Final 10 minutes: Trades are handshake deals (no clearing house). Players *can* renege.  

  3. **Non-Trader**:  
     - 1 player refuses all trades. At game end, they get 5 mins to argue:  
       - *"Trading moral duties corrupts integrity – we should do our own work."*  

  ---

  ### **Setup & Timeline (90 Mins Total)**  
  **Materials to Print**:  
  - **Player Cards**: 16–18 unique weight profiles (include 3 mirror pairs).  
  - **Token Sets**: 6 tokens/player (labeled `A1`, `A2`, `P1`, `R1`, `R2`, `L1`).  
  - **Constraint Cards**: 2–3 cards (e.g., "BAN: AI Risk actions").  
  - **Scoreboard**: Wall poster tracking global token counts per cause.  
  - **Offer Board**: Whiteboard for public offers (e.g., "2 × Vegan weeks for 1 × Poverty donation").  

  **Timeline**:  
  1. **Intro (10 mins)**:  
     - Explain rules: "This is a market where you trade actions. Your score depends on how many tokens *everyone* spends on causes you care about. Trade to align others’ efforts with your values."  
     - **Emphasize**: Scores are *personal* – no "global good" metric exists.  

  2. **Distribution (5 mins)**:  
     - Hand out cards, tokens, and constraints (secretly).  

  3. **Trading Rounds (55 mins)**:  
     - **Round 1 (15 mins)**: Open bargaining. Use offer board. All deals recorded/enforced by you (Clearing House).  
     - **Round 2 (15 mins)**: Constraints revealed. Traders must comply.  
     - **Round 3 (15 mins)**: Adjust trades as scores update (post global token counts).  
     - **Round 4 (10 mins)**: **No enforcement**. Trades are promises only.  

  4. **Non-Trader Speech (5 mins)**:  
     - Non-trader argues against trading. Traders respond.  

  5. **Scoring & Debrief (15 mins)**:  
     - Calculate scores (no calculators! Use running totals on the scoreboard).  
     - **Debrief questions**:  
       - *"Who gained from trade? How?"* → Comparative advantage (e.g., "I valued animal work more, so I traded my AI token for your animal token").  
       - *"Where did trade break down?"* → Constraints, broken promises.  
       - *"Did more *total* moral value get created?"* → **NO. Total tokens per cause are fixed. Trade only reallocates effort to increase *individual* scores.**  
       - *"What does the non-trader’s objection reveal?"* → Integrity vs. efficiency.  

  ---

  ### **Scoring Without Calculators**  
  - **Track global token counts** on the scoreboard (e.g., "Animal tokens spent: 12").  
  - **Player score = (Token count for Cause × Player’s weight)** for all 4 causes.  
  - **Example**: If 10 `A` tokens are spent, a player with 30% `A` weight scores 300 points for `A`.  
  - **Tip**: Pre-calculate scores for common weights during setup to speed things up.  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **Problem**: Players hoard tokens or trade passively.  
     - **Fix**: Announce: "The top 3 scorers win [trivial prize]." Incentivize deal-making.  

  2. **Problem**: Unenforced round causes chaos (broken deals).  
     - **Fix**: After the round, ask: *"Who had a deal broken? How did that feel? What does this say about real-world contracts?"*  

  3. **Problem**: Scoring confusion (e.g., "Why do I benefit from others’ work?").  
     - **Fix**: Use a mini-example pre-game: "If Jane spends a token on Poverty, *everyone* with Poverty weight adds to their score."  

  4. **Problem**: Mirror pairs don’t find each other.  
     - **Fix**: Secretly nudge them ("Player 7, Player 12 might have compatible interests").  

  ---

  ### **What the Game Can’t Reproduce**  
  - **Incommensurability of Moral Value**: The "exchange rate" (e.g., 1 vegan week = 2 poverty donations) is *not* objective. It’s emergent from subjective preferences. **Debrief plainly**: "The game doesn’t show that the world is ‘better’ after trade – only that each player *prefers* the outcome by their own score. There’s no universal moral currency."  
  - **Public Goods**: Real-world causes often have spillover effects (e.g., reducing poverty benefits everyone). Here, benefits are privatized to scores.  
  - **Power Dynamics**: No asymmetry in resources/privilege (all start equal).  

  ---

  ### **Smarter Tweaks for Future Sessions**  
  - **Trade Attention/Endorsements**: Replace tokens with:  
    - "Vouch for Cause X on social media."  
    - "Read an essay on Cause Y."  
    - "Endorse a policy for Cause Z."  
    *Why*: Simulates influence markets, where reputation and attention are currencies.  
  - **Voting Tokens**: Players trade votes on which cause gets a "bonus fund."  
    *Why*: Explores democratic coordination vs. individual trade-offs.  

  ---

  ### **Key Takeaways for Players**  
  - Gains from trade exist when:  
    - **Relative valuations differ** (even if you’re "better" at everything).  
    - **Enforcement is reliable** (or trust is high).  
  - Trade breaks when:  
    - **Moral constraints** block instrumental trade-offs.  
    - **No enforcement** enables free-riding.  
  - **No "universal good"**: Trade optimizes for *individual preferences*, not an objective "better world."  

