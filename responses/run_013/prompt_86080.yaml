prompt: |-
  Ok so I need help setting a research agenda and I'm stuck on how to prioritize. Background: a small foundation handed me enough money for about four people for two years, philosophy and theory only — no feildwork, no data collection — and told me to commission work on sex work policy. The catch is that their board is a bit obsessed with a proposal one of the trustees invented. Nobody's written about it and it doesn't line up with any of the existing regimes, so you won't be able to look it up. Roughly: buying and selling are both legal, and the seller's income is untaxed and can't be seized by creditors; but anyone who takes a cut of the transaction — brothel, agency, booking platform, driver, the landlord — needs a license and carries strict liability if the seller comes to harm; and sellers get an unconditional statutory right to walk away from any contract or debt immediately, no penalty. Call it the cut-taker model. It's a mashup of the Nordic model's attitude toward buyers, Dutch-style legalization, and the New Zealand labor-law framing, plus the strict liability twist, which I don't think exists anywhere.

  So: given those four people and two years, what are the open conceptual questions that actually matter most here, and in what order? I don't want a survey and I definately don't want a reading list — nobody here has library access and half the literature is paywalled anyway. What I want is a defended agenda: for each question, why it's upstream of the others, whether it's the kind of thing philosophers can actually settle in a room with no data, which ones look important but turn out to be empirical in disguise or purely definitional, and what would push a question up or down the list over the next couple of years. Also be honest about whether the cut-taker model really generates a distinct set of questions or whether it's the same three regimes' questions wearing new labels — if it's the second, say so and tell me which of the older questions I should be funding instead, since the money has to go somewhere.
reasoning: |-
  Okay, the user needs help prioritizing a research agenda for a foundation-funded project on sex work policy. They have a two-year budget for four researchers focusing solely on philosophy and theory—no fieldwork or data collection. The foundation's board is particularly interested in a unique policy proposal called the "cut-taker model," which combines elements from existing frameworks but adds novel features like strict liability for intermediaries and untaxed seller income.

  First, I need to understand the core aspects of the cut-taker model. It legalizes both buying and selling, exempts sellers' income from taxes and creditor claims, requires intermediaries to be licensed and imposes strict liability if sellers are harmed, and grants sellers an unconditional right to exit contracts without penalties. The challenge is to identify open conceptual questions that are both philosophically tractable and central to evaluating this model.

  The user explicitly doesn't want a survey or literature review—they need prioritized questions with clear justifications. They also want to know if this model genuinely presents new philosophical problems or just repackages old ones. If it's the latter, I should redirect focus to existing core questions.

  Starting with foundational issues: The model's strict liability for intermediaries is unprecedented. What does "harm" encompass here? Is it limited to physical harm or includes psychological or financial harm? This needs precise definition since liability scope affects feasibility and incentives. Philosophers can tackle this through conceptual analysis without empirical data, making it a top priority.

  Next, the unconditional exit right for sellers. Unlike standard contract law, this allows immediate termination without consequences. This challenges fundamental notions of contractual obligation. Philosophers can explore whether this undermines contract validity and how it aligns with autonomy. This is upstream because it affects how other elements like liability function.

  The tax and creditor exemption raises questions about legal categorization. Is the exemption a privilege or a right? Philosophers can analyze this by examining legal personhood and rights theory. This is crucial because it defines the seller's status and impacts economic viability.

  Then, licensing intermediaries. This involves balancing regulation with access. Philosophers can debate the state's role in protecting versus controlling sellers. This ties into autonomy and state responsibility, but overlaps with existing regimes. Still, the strict liability twist makes it worth examining.

  Coherence checks come next—how do these elements interact? For example, does strict liability conflict with seller autonomy? Philosophers can identify logical tensions through thought experiments, which is feasible without data.

  Normative grounding is essential. What principles justify this model? Autonomy, harm reduction, exploitation prevention? Philosophers can evaluate if the model consistently applies these principles, helping assess its theoretical soundness.

  Comparative analysis places the model against existing frameworks. While it borrows elements, the combination creates unique tensions. Philosophers can map these without empirical data, though this might be less original.

  Feasibility and perverse incentives involve practical concerns, but the user ruled out empirical work. So this should be lower priority unless framed as conceptual risks.

  The user might also have unspoken needs: validating the board's interest in the model while ensuring scholarly rigor, avoiding dead-end debates, and producing actionable insights within constraints. They might worry about academic credibility given the unique funding angle.

  Prioritization should rank questions by centrality to the model's novelty, philosophical tractability, and upstream nature. Defining harm scope and exit rights are most critical as they underpin other elements. Coherence and normative grounding follow. Comparative analysis is lower if it doesn't yield new insights.

  I should be honest: the strict liability and exit rights introduce fresh challenges, but many questions are variations of existing ones. Still, the synthesis justifies focused research. If redirection is needed, core issues like exploitation definitions or autonomy in contracting are safer bets.

  In summary, the agenda should start with clarifying key terms, then examine internal logic and justification, leaving comparative and feasibility issues for later. This approach respects the foundation's interests while maximizing philosophical value within limits.
answer: |-
  Here’s a prioritized research agenda focused solely on conceptual questions tractable to philosophical analysis, with explicit justifications for ordering and feasibility:

  ### **Tier 1: Foundational Legitimacy & Internal Coherence**  
  *(Must resolve first—failure here sinks the model)*  

  1. **The "Harm" Problem in Strict Liability**  
     - **Question:** What constitutes "harm" triggering intermediaries' liability? Physical assault? Psychological trauma? Loss of income due to bad reviews?  
     - **Why upstream:** Liability scope dictates if the model is workable or collapses under litigation. Overbroad definitions make licensing untenable; narrow ones ignore structural harms.  
     - **Philosophically tractable?** Yes—requires analyzing *causation* (can a platform "cause" client violence?), *foreseeability*, and *moral responsibility* hierarchies (e.g., Is a landlord as liable as a brothel manager?).  
     - **Red flag:** If "harm" relies on contested social constructs (e.g., "dignity"), it becomes empirically entangled. Push down if consensus emerges it’s purely contextual.  

  2. **The Exit Right’s Contradiction with Contract Theory**  
     - **Question:** Can a "contract" exist if one party (seller) has unconditional, penalty-free exit? Does this reduce agreements to unenforceable promises?  
     - **Why upstream:** Challenges the model’s core labor-law premise. If transactions aren’t contracts, intermediaries’ "licensing" lacks a coherent object.  
     - **Philosophically tractable?** Yes—draws on legal philosophy of obligations (e.g., Raz on voluntary bonds vs. Hohfeldian privileges).  
     - **New or recycled?** *Novel twist*: Exit rights exist in some labor law, but *unconditional immediacy* combined with third-party liability is untested.  

  ### **Tier 2: Normative Mechanics & Unintended Consequences**  
  *(Tests viability of Tier 1 answers)*  

  3. **Immunity vs. Agency: The Tax/Creditor Exemption**  
     - **Question:** Does shielding income from creditors/tax actually *enhance* seller autonomy, or does it entrench precarity by blocking access to credit/state benefits?  
     - **Why upstream:** Impacts whether the model is liberationist or neopaternalist. If sellers can’t build credit, "exit rights" are meaningless for economic mobility.  
     - **Philosophically tractable?** Partially—requires theory of *autonomy* (positive vs. negative liberty) and *exploitation* (does protection enable or trap?). **Risk:** Turns empirical if linked to capitalist structures (push down if so).  

  4. **The Licensing Paradox**  
     - **Question:** Can licensing intermediaries coexist with seller autonomy? Does state licensing inevitably create barriers that *force* sellers toward unlicensed (unprotected) spaces?  
     - **Why upstream:** Licensing is the model’s enforcement mechanism—if philosophically unstable, the system fails.  
     - **Philosophically tractable?** Yes—analyze state power (Foucault), regulatory moralism (Dworkin), and ideal vs. non-ideal theory tradeoffs.  
     - **New or recycled?** *Recycled core* (Dutch/NZ debates) *+ new angle*: Strict liability escalates state interest in "safe" licensing.  

  ### **Tier 3: Systemic Coherence & Comparative Fit**  
  *(Lower urgency—depends on Tier 1-2 resolving)*  

  5. **Hybrid Regime Tensions**  
     - **Question:** Does combining Nordic (buyer-legitimized), Dutch (regulated market), and NZ (labor rights) elements create incoherent moral signals? (e.g., Is buying "acceptable" if intermediaries are de facto punished?)  
     - **Philosophically tractable?** Yes—evaluate *expressive theories of law* (what values does the hybrid communicate?).  
     - **Priority adjuster:** Rise if Tier 1 reveals contradictions; drop if model proves internally consistent.  

  6. **"Cut-Taker" Definitional Boundaries**  
     - **Question:** Who is a "cut-taker"? Is it profit-based (only agencies?) or activity-based (driver renting a car? Security guard paid hourly?).  
     - **Why lower priority:** Definitional clarity matters operationally, but doesn’t challenge foundations.  
     - **Philosophically tractable?** Purely conceptual (categorization theory) but risks becoming semantic.  

  ---

  ### **Honest Assessment: Is This Model Distinct?**  
  **Yes—but narrowly.** It generates *new questions* in two areas:  
  - **Strict liability’s moral grounding:** No existing regime imposes this burden on *all* intermediaries (e.g., landlords).  
  - **Exit rights + immunity:** The combo challenges theories of reciprocity in labor contracts.  

  **However**, 70% of the agenda repurposes *existing* regime debates:  
  - Exploitation definitions (Nordic)  
  - Regulation vs. autonomy (Dutch/NZ)  
  - State paternalism (all regimes)  

  ---

  ### **If Redirecting Funds to Older Questions**  
  If the cut-taker model proves derivative, prioritize **perennial gaps** where philosophy adds value *without data*:  
  1. **"Exploitation" as a non-empirical concept:** When does voluntary sex work become inherently exploitative? (Marxist vs. liberal autonomy views)  
  2. **State complicity:** Does *any* regulation legitimize oppression? (Anarchist vs. reformist frameworks)  
  3. **Contractual personhood:** Can selling sexual services be reconciled with Kantian dignity?  

  ---

  ### **Agenda Survival Kit**  
  - **Elevate** a question if: It reveals a *logical contradiction* in the model (e.g., exit rights nullify strict liability).  
  - **Demote** if: It hinges on institutional design (empirical) or becomes semantic (e.g., "What counts as a 'cut'?").  
  - **Abandon** if: External critiques (e.g., critical race theory) show the model ignores structural power—philosophy can’t fix that in a vacuum.  

  This structure maximizes conceptual payoff while respecting the board’s pet project. Focus Tier 1 efforts first—if those collapse, pivot funds to the "older questions" list with board consent.
