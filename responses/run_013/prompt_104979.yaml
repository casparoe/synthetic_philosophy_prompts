  We are considering a one-shot centipede game with a fixed finite number of rounds. The claim is: under common knowledge of instrumental rationality (both players are expected-utility maximizers), taking on the first move is the uniquely rational choice.

  Step-by-step reasoning:

  1. Backward induction is the standard argument: start from the last round. At the last decision node, the player whose turn it is will take (because passing would yield a smaller pot for them, and the game ends immediately after their choice). Knowing this, the player at the second-to-last node will take (because if they pass, the opponent will take in the next round, leaving them with less than if they take now). This reasoning propagates back to the first move: the first player should take.

  2. However, there are challenges to this reasoning in the literature, especially regarding the common knowledge of rationality and the possibility of off-equilibrium path beliefs. But note the claim requires common knowledge of instrumental rationality and the game is one-shot and finite.

  3. The argument for backward induction relies on the idea that at every node, the player believes that if the game reaches a later node, the player at that node will play rationally. This is justified by common knowledge of rationality and the structure of the game.

  4. Therefore, in the context of the claim, which assumes common knowledge of rationality and that both players are expected-utility maximizers, the backward induction argument holds and taking at the first move is indeed the uniquely rational choice.

  But note: There are some philosophical objections, such as the argument that backward induction requires players to believe that even if the game were to reach a later node, the opponent would play rationally, even though by backward induction the game should never reach that node. But with common knowledge of rationality, the players are committed to believing in rationality at every node, even if it is off the equilibrium path.

