prompt: |-
  You are a philosopher of history and of the social sciences: you know how analogies do argumentative work, and you have a working command of the archaeological and historical record of societal breakdown — the Late Bronze Age eastern Mediterranean, the Classic Maya, Rapa Nui, and the Mesopotamian and Andean cases.

  I am preparing a graduate seminar on whether societies fail or merely change, and I want to put one argument under the microscope rather than adjudicate the cases. A senior colleague is fond of an analogy he takes from the older philosophy of history: a civilization is a living organism. It is born, it grows, it matures, it ages, and in time it dies; what we call collapse is simply its death. He uses this to license a strong conclusion. Since senescence and death are intrinsic to the life cycle, our current anxiety about civilizational decline is misplaced as a practical matter: no amount of institutional reform can arrest the process, and reformist projects are at best palliatives. On his view, the collapse literature is confused about its own subject — what looks like a society's failure to continue is just a society reaching the end of its natural term.

  I am not convinced, but I do not want to refute him by pointing at cases. I want the analogy itself audited. Please do the following.

  1. Set out the correspondence as explicitly as you can. What plays the role of birth, of metabolism, of maturation, of senescence, of the germ line, of the immune system, of reproduction, of death without issue? Which of these have defensible targets in the social case and which have none?
  2. Identify where the mapping breaks — the features of organisms that the analogy quietly imports and that societies either lack or possess only by stipulation.
  3. Separate the disanalogies that matter for his conclusion from those that are merely picturesque. The test is whether keeping or removing the feature changes whether the fatalism follows.
  4. Say what a better analogy would be, if there is one: one that preserves whatever insight the organism picture had — that entities of this kind have internal dynamics and can reach states from which they do not recover — without paying for it with everything else. Then say what the replacement itself gets wrong.
  5. Give a verdict: does the conclusion survive the audit intact, survive in weakened form, or fall? Be specific about which part survives and which does not.

  Begin by brainstorming the candidate correspondences before committing to any of them, and think the whole thing through carefully before you write. Consider at least one case in which a society demonstrably did not die — where the political structure dissolved while the population, language, or institutions continued — since that is where the analogy has to earn its keep. Do not give me a bibliography, reading list, or citations; I know the literature and I want your reasoning. Assume you have no internet access and should not gesture at particular books or page numbers.

  After your prose analysis (no more than about 900 words), give me a structured summary as a single JSON object with exactly these fields:

  - "correspondence": an array of objects, each with "source_feature" (the organism-side term), "target_feature" (what it is supposed to match in the social case), "fit" (one of "strong", "partial", "none"), "load_bearing" (true or false — whether the intended conclusion depends on this link holding), and "note" (one sentence).
  - "disanalogies_that_matter": an array of objects, each with "feature", "why_it_matters", and "effect_on_conclusion" (one of "undermines", "weakens", "leaves_untouched").
  - "disanalogies_that_do_not_matter": an array of objects, each with "feature" and "why_not".
  - "imported_assumptions": an array of strings, each naming something the analogy smuggles in that is not argued for.
  - "conclusion_verdict": an object with "survives" (one of "intact", "weakened", "unsupported"), "which_part" (the part of the conclusion that stands), and "reason".
  - "better_analogy": an object with "analogy", "what_it_fixes", and "what_it_gets_wrong".
  - "one_line_answer": a single sentence stating how far the analogy holds.

  Every field must be filled; use null only where a field is genuinely inapplicable. The prose and the JSON must be consistent with each other.
