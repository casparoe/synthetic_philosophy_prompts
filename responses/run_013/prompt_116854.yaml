prompt: |-
  Write a short story — 1500-2500 words is fine — about a jury or an expert panel where the Condorcet jury theorem is quietly doing all the work. The setup I want: every member is individually a bit better than a coin flip on the question they have to settle, so the naive math says more members means more accuracy, and someone in the story leans on exactly that ("nine of us, we're basically certain"). Then I want it to come apart, and I want the mechanism shown through the plot rather than explained by a character who's read the literature: their mistakes share a source. Same expert witness, same forensic test, same rumour, same urge to agree with the room — the point being that the deliberation is what correlates them, so twelve jurors end up carrying maybe two independent signals. The sting should land on the one dissenter nobody in the room can stand, the only genuinely independent error present, who turns out to be worth more than the eight who agree. Keep the probability honest in both directions: with common errors, or with members a shade worse than chance on this particular question, a bigger panel is worse, not better — I want someone who's actually read Condorcet to nod, not wince. Don't let it turn into a lecture; no footnotes, no "as the theorem states."
reasoning: |-
  Okay, the user wants a short story that illustrates the Condorcet jury theorem in action, specifically when its assumptions fail. They want it shown through plot, not exposition. 

  Hmm, interesting challenge. The key is to have correlated errors without anyone explicitly stating the probability theory. The setup requires:
  - A panel of jurors/experts each slightly better than chance (say 55% accurate)
  - Someone confidently claiming more members = higher accuracy ("nine of us, basically certain")
  - Then reveal their errors share a common source (same flawed evidence, witness, or social pressure)
  - The dissenter everyone dislikes ends up being the only independent voice
  - Must keep probability honest - show why bigger panel fails when errors correlate

  *scratches head* Medical malpractice case feels right - complex enough for expert witnesses, high stakes for tension. Oncology? Perfect. Tumor progression timeline could hinge on ambiguous evidence. 

  For the common error sources:
  - A charismatic but misleading expert witness (Dr. Vance)
  - Flawed blood test (LuminoMark) everyone overweights
  - Social pressure to conform after the first vote

  Ah, and the unlikable dissenter - Dr. Finch. Make him abrasive but principled. His skepticism about LuminoMark should seem unreasonable at first. 

  *checks probability math* 
  If each juror is 55% accurate but errors correlate, the panel's effective independent signals collapse. With 9 jurors sharing errors, maybe only 1-2 real independent votes. Finch's lone dissent might carry more weight than all the agreeable voters combined.

  Biggest risk: turning into a lecture. Must bury the math in:
  - Finch muttering "correlated noise" without explanation
  - The chair's growing frustration feeling like groupthink
  - Vance's testimony being subtly theatrical

  Ending should hit hard: Finch was right all along about LuminoMark's flaw. The "nine are certain" line becomes tragic irony. Final image - Finch alone with the truth while others realize their certainty was an illusion.

  *starts drafting* Key scenes:
  1. Early confidence ("nine heads better than one!")
  2. Unanimous initial vote except Finch
  3. Reveal Vance's financial ties
  4. LuminoMark's calibration error exposed
  5. The crushing realization their votes weren't independent after all
answer: |-
  The air in the jury deliberation room hung thick with the scent of stale coffee and suppressed anxiety. Nine members of the State Medical Review Board shifted in their uncomfortable chairs, the polished mahogany table reflecting the harsh fluorescent lights. Before them lay the fate of Dr. Anya Petrova, a respected oncologist accused of negligent delay in diagnosing a terminal brain tumor in celebrity chef Marco Bellini.

  "This is cut and dried, surely?" Bernard Thorne, retired vascular surgeon and self-appointed foreperson, smoothed his silk tie. "The timeline is damning. Bellini presented with headaches and visual disturbances *ten months* before Petrova ordered the definitive scan. Every other expert before us said the standard of care demanded imaging at month six, max."

  Murmurs of agreement rippled around the table. Dr. Lena Cho, a sharp-eyed neurologist, nodded. "The initial MRI she ordered was inconclusive, but the symptoms persisted. Vance was compelling."

  Dr. Elias Vance, the prosecution's star expert witness, had been mesmerizing. His testimony about the tell-tale progression of glioblastoma, the critical window lost, and the "LuminoMark" blood test Petrova inexplicably ignored, had painted a picture of unforgivable oversight.

  "It's not just Vance," piped up Dr. Raj Singh, an infectious disease specialist slightly out of his depth but eager to contribute. "That LuminoMark result came back elevated at month eight. Petrova dismissed it, called it non-specific. Vance said it was practically diagnostic in context."

  "Exactly," Thorne said, a confident smile playing on his lips. He gestured expansively around the table. "Look at us. Nine experienced physicians, each of us, individually, able to parse medical evidence better than tossing a coin, right? We’re not infallible, but we’re all competent. That’s the beauty of a panel like this. Nine heads, independently evaluating the evidence? The math is clear: the more competent minds you have, each slightly better than random chance, the *more certain* the collective verdict becomes. Nine of us leaning towards negligence? We’re basically certain." He leaned back, satisfied. "Shall we take a preliminary vote? Show of hands for finding Dr. Petrova negligent."

  Eight hands rose swiftly, decisively. Only one remained down, belonging to Dr. Arthur Finch. Finch, a notoriously prickly epidemiologist with a reputation for disagreeing on principle, sat hunched, his thick glasses perched low on his nose, fingers steepled. A collective sigh, almost imperceptible, escaped the group. *Here we go.*

  "Dr. Finch?" Thorne prompted, his voice tight. "Care to enlighten us?"

  Finch didn't look up. "Vance was slick. Too slick. LuminoMark is… noisy."

  "‘Noisy’?" Dr. Cho echoed, incredulous. "It’s a validated biomarker panel! Vance presented the studies!"

  "Validated *in certain cohorts*," Finch muttered, still staring at the table. "Context matters. Petrova’s notes mentioned Bellini was on high-dose anti-inflammatories for a chronic shoulder injury. Ever seen what that does to LuminoMark baselines? Causes false elevations. Petrova flagged it. Vance dismissed it with a wave. Said the levels were too high to be just noise."

  "And you disagree?" Thorne asked, his patience thinning.

  "I question the absoluteness," Finch said flatly. "And Vance’s entire timeline hinges on Bellini’s retrospective symptom diary. Conveniently detailed *after* the diagnosis."

  "Corroborated by his partner's testimony!" Singh interjected.

  "Corroborated *by someone grieving and looking for blame*," Finch countered, finally looking up, his eyes sharp behind the lenses. "Petrova documented worsening symptoms gradually. The diary? Suddenly recalls debilitating headaches starting precisely at month six? Smells retrospective."

  Thorne scoffed. "So, you dismiss the patient's account? The partner's account? The expert witness? The biomarker? And cling to Petrova’s self-serving notes? Based on… what? A hunch about anti-inflammatories?"

  "Based on the *possibility*," Finch insisted, his voice rasping. "The possibility that we’re all being swayed by the same shiny objects. Vance was charismatic. LuminoMark sounds scientific. The diary feels tragic and definitive. Everyone else," he gestured vaguely at the eight raised hands, "agrees. Feels safe. Feels *probable*. But probability," he paused, a strange, almost weary look crossing his face, "isn't always additive. Sometimes errors… share a bus."

  The room bristled. "Share a bus? What on earth are you talking about, Finch?" Cho demanded.

  "Nothing," he sighed, slumping back. "Forget it. My vote is 'Not Negligent.'"

  Deliberation dissolved into fractious debate. Thorne tried to marshal arguments, parroting Vance's points about tumor growth rates. Singh emphasized the elevated LuminoMark, citing Vance’s assurance of its reliability in symptomatic patients. Cho dissected Bellini’s symptom diary with forensic detail, again echoing Vance's interpretation of key entries. The other five largely nodded, adding variations of "Vance was convincing" or "The blood test seems damning." Finch remained an island, reiterating his skepticism about the diary's reliability and the LuminoMark's specificity in this specific context, pointing to Petrova’s ignored notes about the anti-inflammatories. His arguments felt nitpicky, contrarian, irritatingly focused on technicalities everyone else felt Vance had adequately addressed. The common ground for the eight was Vance’s narrative, cemented by the LuminoMark result and the tragic weight of the diary. Finch’s dissent felt like an annoying fly buzzing around a solid edifice.

  After two hours of circular arguments, Thorne called for a break. "Let’s clear our heads. Reconvene in fifteen."

  Finch shuffled out, ignored. The others gathered near the coffee urn.

  "Impossible man," Thorne muttered, stirring sugar violently.

  "He’s just being Finch," Cho sighed. "Always has to find the flaw nobody else sees, even if it’s not there."

  "His point about the anti-inflammatories," ventured Dr. Miriam Costas, a quiet geriatrician, "is there any data?"

  Singh waved a hand dismissively. "Vance addressed it. Said the levels were way beyond what NSAIDs cause. Plus, Petrova should have investigated the elevation regardless, not dismissed it. That’s the negligence."

  "Exactly," Thorne said. "We’ve got Vance, the blood test, the diary, the partner… Finch has a… feeling about NSAIDs? Nine against one. The math Bernard mentioned holds. We *are* basically certain." The group murmured assent, bolstered by their shared conviction and shared annoyance with Finch.

  As they filed back in, the Board’s legal counsel entered, looking grave. "Apologies for the interruption. New documentation just arrived from the defense. It pertains to the LuminoMark test."

  He placed a single sheet on the table. It was an internal email chain from Veridia Diagnostics, the makers of LuminoMark, dated *after* Bellini’s test but *before* Dr. Vance’s testimony. The subject line: "Urgent: Calibration Drift Alert - Batch #LMK-7743." The body detailed a previously undetected calibration error in the specific batch of reagents used for Bellini’s test and thousands of others. The error caused a *systematic elevation* in reported levels of the key biomarker by approximately 35%.

  A stunned silence fell. Veridia had issued a recall notice, but it hadn’t reached Petrova’s defense team until now. Dr. Vance, according to a footnote, had been a paid consultant for Veridia for the past three years. His testimony dismissing concerns about the LuminoMark elevation as impossible to be caused by Bellini’s anti-inflammatories – while technically true regarding the *degree* of elevation caused *just* by NSAIDs – had failed to mention the *known systemic error* in that specific batch that could cause *exactly* that degree of false elevation.

  Finch made a small, choked sound that might have been a laugh or a cough. He didn’t say "I told you so." He didn’t need to.

  The edifice cracked. Thorne’s face drained of color. "The diary…" Cho whispered, suddenly sounding less certain. "If the LuminoMark wasn’t reliable… if Petrova was *right* to be skeptical… then her reliance on the documented, gradual progression…"

  "Becomes defensible," Finch rasped. "Maybe even correct. Retrospective symptom diaries after a terminal diagnosis? Notoriously unreliable. Grief distorts memory. She documented what she saw, when she saw it."

  The shared certainty evaporated, replaced by a dawning horror. They hadn’t been nine independent minds converging on truth. They’d been nine minds captivated by the same compelling, flawed narrative delivered by a charismatic, conflicted expert. They’d all overweighted the same piece of flawed evidence – the LuminoMark test, made doubly convincing by Vance’s authoritative dismissal of Petrova’s correct concerns. The tragic diary, viewed through the lens of Vance's interpretation and the "confirming" blood test, had seemed irrefutable. Their mutual agreement hadn’t been the product of independent confirmation; it had been an echo chamber amplifying the *same signal*, the *same error*. Vance’s testimony was the bus, and they’d all climbed aboard.

  The preliminary vote wasn’t nine independent probabilities compounding accuracy. It was one flawed narrative, repeated eight times, with Finch’s lone, irritating skepticism representing the only genuinely independent assessment – one focused on the ignored context (the anti-inflammatories) and the inherent unreliability of the retrospective diary.

  Thorne looked physically ill. His confident pronouncement – *nine of us, we're basically certain* – now sounded hollow, a monument to collective blindness. The math only worked if their judgments were uncorrelated. They hadn’t been. They’d shared the critical error source: over-reliance on Dr. Vance and the tainted LuminoMark result. The more of them who agreed initially, the *less* it signified true certainty, because their agreement stemmed from the same poisoned well. In this case, with their errors tightly correlated by the common influence, adding more members who were swayed by Vance and the LuminoMark didn't sharpen the verdict; it only deepened the collective mistake.

  Finch, the dissenter nobody could stand, the one who’d seemed pointlessly contrarian and fixated on irrelevant minutiae, had been the only one offering a truly independent perspective. His skepticism, based on Petrova’s notes about the anti-inflammatories – a detail Vance had glossed over and the others had dismissed – suddenly looked prescient. His error, if it was an error (and now it seemed less likely), was his own. It wasn't riding Vance's bus. That independence, that resistance to the group’s dominant signal, made his single vote, in this corrupted environment, potentially more valuable than the eight votes echoing the same flawed information.

  "Dr. Vance..." Singh began, his voice trembling slightly. "He never disclosed the calibration error. He never disclosed the full extent of his Veridia ties during *this* testimony."

  "No," Thorne said hoarsely, staring at the damning email. "He did not."

  The room descended into a new kind of silence, heavy with the weight of their uncritical acceptance. They looked at the preliminary vote tally – eight for negligence, one against – not as near-unanimity confirming truth, but as stark evidence of their collective failure. Finch sat quietly, looking not smug, but grimly sad. The sting wasn't just in Petrova's potential innocence; it was in the realization that their confidence, their reliance on the "math" of numbers, had been their downfall. The Condorcet theorem hadn't failed; *they* had failed its most crucial assumption. Their competence, individually better than a coin flip, had been rendered useless because their mistakes weren't random – they were all listening to the same siren song.

  Thorne cleared his throat, the sound unnaturally loud. "I propose," he said, his voice barely above a whisper, lacking all its former authority, "that we recall Dr. Vance. And subpoena Veridia's full records on Batch #LMK-7743." He couldn’t bring himself to look at Finch. The dissenter nobody could stand had been the only pillar holding up a corner of the crumbling truth. His single, independent skepticism, irritating as it was, was suddenly worth more than all their agreeable certainty combined. The bigger panel, swayed by the same error, had indeed become less accurate, not more. The math, in this corrupted reality, had worked exactly as it should have – and they had been on the wrong side of it.
