  - **Sensitive to welfare theory**: Leaf K (Mirror) assumes hedonism/experiential welfare (animals gain more). Rebuilt for desire/objective theories by tailoring the monster.  
  - **Insensitive to welfare theory**: Leaves F, G, J, L, M, N (apply to any aggregative currency).  

