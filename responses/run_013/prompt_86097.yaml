  ### Utility Monster Decision Tree  
  *Follow the branches by answering each question based on the scenario described. Your path will reveal your underlying ethical commitments.*  

  **Node 1: Initial Scenario**  
  *You have one resource (e.g., a meal). Giving it to Alex yields 1000 welfare units for Alex and 0 for Bob. Giving it to Bob yields 1 welfare unit for Bob and 0 for Alex. Should you give it to Alex?*  
  - **Yes** → Node 2  
  - **No** → Node 7  

  **Node 2: Large-Number Test**  
  *Now, the resource can go to Alex (gains 1000) or be split among 1000 ordinary people (each gains 0.001, totaling 1). Should you give it to Alex?*  
  - **Yes** → Node 3  
  - **No** → **Leaf E: Non-Aggregative Egalitarianism**  
    - *Commitment*: Gains/losses cannot be summed across persons; individual claims override total welfare.  
    - *Awkward commitment*: Forbids overriding one person’s claim even if billions gain immensely.  

  **Node 3: Bounded Welfare Test**  
  *Alex is "full." The next resource gives Alex only 1 unit (Bob still gains 1). Should you give it to Alex?*  
  - **Yes** → Node 4  
  - **No** → **Leaf F: Bullet-Biting Utilitarianism**  
    - *Commitment*: Maximize total welfare; marginal gains trump prior advantages.  
    - *Awkward commitment*: Mandates ignoring past consumption, even if Alex was glutted.  

  **Node 4: Digital Mind Test**  
  *Alex is a digital mind (not biological) with the same welfare capacity. Does this change your view?*  
  - **No, still give to Alex** → **Leaf G: Graded Moral Status**  
    - *Commitment*: Moral weight scales with welfare capacity, regardless of marginal gain.  
    - *Awkward commitment*: Prioritizes high-capacity beings even when "full" and others starve.  
  - **Yes, now give to Bob** → **Leaf H: Capacity-Dependent Status**  
    - *Commitment*: Welfare capacity matters, but digital beings lack full moral status.  
    - *Awkward commitment*: Denies status to digital minds regardless of subjective experience.  

  **Node 5: Threshold Test**  
  *Alex gains 2 units, Bob gains 1. Should you give to Alex?*  
  - **Yes** → Node 6  
  - **No** → **Leaf I: Strict Equality**  
    - *Commitment*: Never prioritize one person over another based on welfare size.  
    - *Awkward commitment*: Forbids favoring a cancer cure over a headache relief.  

  **Node 6: Lower Threshold Test**  
  *Alex gains 1.1 units, Bob gains 1. Should you give to Alex?*  
  - **Yes** → **Leaf J: Threshold Utilitarianism**  
    - *Commitment*: Favor efficiency only when gains exceed a minimum ratio (e.g., >1.1:1).  
    - *Awkward commitment*: Arbitrary thresholds (e.g., 1.099:1 fails, 1.101:1 suffices).  
  - **No** → **Leaf I: Strict Equality** (as above)  

  **Node 7: Lower Ratio Test**  
  *Alex gains 2 units, Bob gains 1. Should you give to Alex?*  
  - **Yes** → Node 5 (continue to Node 6)  
  - **No** → Node 8  

  **Node 8: Mirror Test**  
  *Humans gain small welfare from resources that would yield vast welfare for animals (e.g., factory-farmed pigs). Should we give resources to the animals?*  
  - **Yes** → **Leaf K: Mirror Reading**  
    - *Commitment*: If humans are "monsters" to animals, consistency demands sacrificing human gains.  
    - *Awkward commitment*: Requires surrendering most human resources to animals.  
  - **No** → Node 9  

  **Node 9: Welfare Measurability Test**  
  *Can welfare units be compared across individuals (e.g., is 1000 > 1 meaningful)?*  
  - **No** → Node 10  
  - **Yes** → **Leaf L: Well-Formed but False**  
    - *Commitment*: The monster is conceptually possible but false of any real being.  
    - *Awkward commitment*: If such a being existed, we must sacrifice to it.  

  **Node 10: Basis for Incomparability**  
  *Why can’t welfare be compared?*  
  - **Welfare isn’t quantifiable** → **Leaf M: Welfare Not Ratio-Scaled**  
    - *Commitment*: Welfare lacks cardinal units; ratios (e.g., 1000:1) are nonsense.  
    - *Awkward commitment*: Rejects cost-benefit analysis in all policy decisions.  
  - **Welfare is person-relative** → **Leaf N: Incommensurabilist**  
    - *Commitment*: No common currency to weigh gains/losses across persons.  
    - *Awkward commitment*: Paralyzes redistribution (e.g., taxes for public goods).  

