  ### Unoccupied Positions & Incoherencies  
  The tree permits these incoherent/unattractive combinations:  
  1. **Node 1: Yes + Node 2: No** (Leaf E): Claims aggregation works for individuals (Node 1) but not groups (Node 2). Incoherent.  
  2. **Node 1: No + Node 7: Yes** (to Node 5): Rejects 1000:1 but accepts 2:1. Logically possible but implies an arbitrary threshold.  
  3. **Leaf H: Capacity-Dependent Status**: Unoccupied. No one consistently holds that digital minds lack moral status *only when welfare gains are equal*.  

