  Okay, the user is grappling with a complex issue in international humanitarian law (IHL) and its philosophical underpinnings. They've identified three key tensions: combatant immunity for individual soldiers, criminal responsibility for leaders who wage aggressive war, and the duty of soldiers to disobey manifestly unlawful orders. The user wants to understand the philosophical commitments behind these principles and whether they're consistent.

  First, I need to unpack the core principles. Combatant immunity means soldiers aren't criminals for killing enemy combatants in lawful warfare, regardless of which side they're on. This comes from the Hague and Geneva Conventions. Then there's the crime of aggression, established at Nuremberg, which holds leaders accountable for starting illegal wars. And finally, soldiers must refuse clearly illegal orders, like targeting civilians.

  The user is confused because the law treats soldiers as moral agents when it comes to refusing unlawful orders but not when evaluating the overall war's justice. This seems inconsistent. They're asking about the implicit philosophy here and whether alternative theories would require different legal practices.

  I should start by explaining how IHL distinguishes between jus ad bellum (justice of going to war) and jus in bello (conduct in war). This separation is crucial. Soldiers are judged only on in bello rules, while leaders face ad bellum responsibility. 

  The user might be hinting at a deeper concern about moral responsibility. If an unjust combatant kills just combatants, isn't that still morally wrong? But the law doesn't treat it that way. So what's the rationale? I need to cover the practical reasons: preventing endless prosecutions, maintaining reciprocity, and ensuring soldiers follow rules. But there are also moral arguments—soldiers are often coerced or lack the information to judge the war's overall justice.

  The user also wonders if leaders' liability conflicts with soldiers' immunity. I should explain the division of responsibility: leaders have agency in starting wars, soldiers in conducting them. The law separates these spheres. 

  They also ask what would change if we adopted the view that unjust combatants commit wrongdoing by merely fighting. That would require prosecuting ordinary soldiers for participating in aggression, which would be practically unworkable and might lead to reciprocal atrocities. The current system avoids that by focusing on conduct rather than cause.

  I should clarify that the law presupposes the separation of jus ad bellum and jus in bello, the practical necessity of reciprocity, and the differentiated agency between leaders and soldiers. It doesn't necessarily endorse moral equality of combatants as an absolute truth but adopts it as a legal fiction for functionality. 

  The user's deeper need might be understanding whether the legal framework is philosophically coherent or just pragmatic. They're likely looking for a balanced view that acknowledges both the practical benefits and moral critiques. I should address how the system navigates the tension between ideal justice and real-world applicability, perhaps referencing theorists like Walzer and McMahan.
answer: |-
  The legal framework you're grappling with—combatant immunity, the crime of aggression, and the duty to disobey manifestly unlawful orders—rests on a sophisticated but tension-filled philosophical architecture. Let's reconstruct its implicit commitments, identify its underpinnings, and explore its philosophical fault lines.

  ### Core Presuppositions of the Practice:
  1. **Separation of *Jus ad Bellum* (Justice of War) and *Jus in Bello* (Justice in War)**  
     - **Strict Presupposition:** These are distinct normative domains. A soldier's conduct (*jus in bello*) is judged independently of their state's justification for war (*jus ad bellum*).  
     - **Purpose:** Ensures humanitarian rules apply equally to all parties, incentivizing compliance (e.g., POW protections). Violations would escalate if soldiers feared prosecution merely for fighting.

  2. **Combatant Immunity as a Legal, Not Moral, Doctrine**  
     - **Presupposition:** Immunity is a *practical concession*, not a moral absolution. It assumes:  
       - Soldiers act as agents of states, not private individuals.  
       - Most soldiers lack capacity/authority to assess the war's overall justice.  
       - Prosecuting all soldiers for lawful combat acts would paralyze post-conflict societies.  
     - **Not Presupposed:** Moral equality of combatants. The law is agnostic on whether an unjust combatant *morally* wrongs just combatants by killing them. Immunity is a *procedural shield*, not a moral endorsement.

  3. **Differentiated Agency**  
     - **Strict Presupposition:** Leaders bear unique responsibility for *initiating* illegal wars (crime of aggression). Soldiers bear responsibility for *conduct* during war.  
     - **Rationale:** Leaders possess strategic authority, access to intelligence, and political choice; soldiers operate under duress, propaganda, and limited information.

  4. **Moral Agency Conditioned on Proximity**  
     - **Presupposition:** Soldiers can recognize *immediate, concrete* crimes (e.g., shooting civilians) but not *abstract, systemic* injustice (e.g., whether a war is aggressive).  
     - **Basis:** The "manifestly unlawful" standard (e.g., Nuremberg Principle IV) implies obvious moral wrongs require no geopolitical analysis.

  ### Philosophical Commitments & Tensions:
  - **Compatible Theories:**  
    - **Rule Utilitarianism:** Immunity maximizes overall good by protecting POWs, limiting atrocities, and enabling peace.  
    - **Contractualism (Rawlsian):** Rules are mutually beneficial for states ("laws of war as a cooperative enterprise").  
    - **Role Morality:** Soldiers fulfill duties defined by their role, excusing them from broader political judgments.

  - **Incompatible Theories:**  
    - **Moral Absolutism (e.g., Pacifism):** All killing in war is wrongful; immunity is illegitimate.  
    - **"Deep Morality" of War (McMahan-style):** *Jus ad bellum* and *jus in bello* cannot be separated; unjust combatants lack moral permission to kill.  
    - **Collectivist Responsibility:** If aggression is a collective crime, soldiers as participants share culpability.

  - **Key Tension:**  
    The leader’s liability for aggression *does* clash with soldier immunity at the *moral* level. If aggression is a crime, soldiers enabling it are materially contributing. The law resolves this by:  
    - Treating aggression as a *leadership crime*, analogous to a CEO ordering corporate fraud (rank-and-file aren't prosecuted).  
    - Prioritizing *practical reciprocity* over moral consistency: if unjust soldiers lose immunity, so might just ones in future wars.

  ### What Would Change Under the "Unjust Combatants Commit Wrong" View?
  If we rejected combatant immunity for unjust combatants (à la Jeff McMahan):  
  1. **Soldiers Could Be Prosecuted for Lawful Combat Acts**  
     - Killing enemy soldiers in an aggressive war would itself be a crime (e.g., "murder under color of war").  
  2. **Reciprocity Collapses**  
     - Unjust soldiers would have no incentive to follow *jus in bello* rules (e.g., take POWs), as they'd face prosecution regardless.  
  3. **Trials Multiply Exponentially**  
     - Millions of soldiers from aggressor states could face trial—legally and logistically unfeasible.  
  4. **Asymmetrical Warfare Issues**  
     - Non-state actors (e.g., insurgents) might claim "just combatant" status while states deny it, eroding uniform rules.  

  **Alternative Solution:** A "due diligence" standard could emerge: soldiers who *reasonably believed* their war was just retain immunity. But this risks validating propaganda and shifting focus to individual mens rea, undermining collective discipline.

  ### Philosophical Underdetermination:
  The practice **does not resolve**:  
  1. **The Moral Equality Question**  
     - Law treats combatants equally; philosophy debates whether they *are* equal. The practice is compatible with either view.  
  2. **The Epistemic Burden on Soldiers**  
     - How *should* soldiers judge "manifest" illegality vs. complex aggression? The law offers no theory of moral cognition.  
  3. **Post-War Justice**  
     - Immunity shields soldiers from trial, but are they *morally* excused? The law is silent, leaving this to societal reconciliation.  

  ### Conclusion: The Implicit Theory
  The practice presupposes a **pragmatic dualism**:  
  - **At the macro level**, war is a political act where leaders bear criminal responsibility for aggression.  
  - **At the micro level**, war is a realm of regulated violence where soldiers are judged solely on conduct, not cause.  

  This dualism is **strictly presupposed** to maintain a workable, reciprocal system of warfare. It **fits well with** rule-utilitarianism and role morality but **avoids committing** to any deep theory of moral equality. The tension between leader liability and soldier immunity is real but managed by carving distinct domains of responsibility—a concession to human limitations and the chaos of war. To change this would require abandoning the Geneva Conventions' foundational bargain.
