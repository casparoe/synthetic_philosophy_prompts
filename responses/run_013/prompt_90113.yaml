prompt: |-
  My flatmate has been reading up on jury theorems and now he won't shut up about an arguement he says proves that a big enough crowd is basically infallible. I'm pretty sure it's wrong but every time I push back he just says "which premise?" and I don't have an answer. Here it is as he gives it.

  (1) Take any ordinary person and any yes/no question of fact. People are, on the whole, better than chance at these. Ask a room full of people a factual yes/no question and the average person is a bit more likely to be right than wrong -- 55/45, say. That's a general fact about humans and questions, not about experts.
  (2) Condorcet's jury theorem: if n people each have a better-than-even chance of being right about the same question, and each votes their honest opinion, and their chances of being right are independent given the truth, then the probability that the majority is right rises with n and tends to 1. He says this is a theorem, so we don't get to argue with it.
  (3) So for any yes/no question of fact, a large enough crowd voting by majority is right with probability as close to 1 as you like. A hundred thousand people in a hall, a show of hands, done.
  (4) Which means expert panels, referees, judges and commissions are a waste of money. If you want to know whether the defendant did it, or whether a drug works, or whether some disputed claim in physics is true, ask a big enough random crowd and take the majority. They'll beat any expert you put against them.
  (5) It even means the crowd can settle whether its own votes are independent and whether its own members are really better than chance. Those are factual questions too, so by (3) a majority vote about them is almost certainly right. The theorem certifies its own assumptions.
  (6) But that's obviously wrong. A hundred thousand people picked at random and asked whether a particular defendant committed a particular murder, or whether some specific claim in particle physics is true, or whether a vaccine causes a condition, are not almost certainly right; on some of those they're confidently and reliably wrong. And the idea that a crowd can't be wrong about its own reliability is a joke.

  So something in (1)-(5) has to go, and I can't figure out wich. I want to keep (2) -- it's a theorem, I'm not going to argue with a theorem -- and I'd rather not give up on crowds being wiser than the smartest person in them, since I use that to defend democracy. Which step do I drop, and what does dropping it cost me? And tell me what the theorem is actually doing here, because right now it looks like it can be pointed in whatever direction you like.
reasoning: |-
  Okay, let me tackle this user's problem. Their flatmate is using Condorcet's jury theorem to argue that large crowds are infallible on any yes/no question, dismissing experts in the process. The user knows this can't be right but can't pinpoint where the argument fails. 

  First, I need to identify which premise is vulnerable. Premise (1) claims people are generally 55% accurate on any factual question. That seems like the weak point. The user mentioned examples like murder trials or particle physics—clearly, random people wouldn't have above-chance accuracy there. So premise (1) overgeneralizes human competence.

  Then there's premise (3). It assumes independence and constant competence, but real-world votes are often correlated (media influence, shared biases) and competence varies by question. The theorem's assumptions break here. The user’s examples (vaccines, physics) highlight how misinformation or complexity undermines both.

  Premise (5) is especially slippery—claiming the crowd can self-validate the theorem's conditions. But asking a crowd about its own independence is circular and ignores meta-competence issues. They might be clueless about statistical concepts, making their vote useless here.

  The user wants to preserve (2) and the wisdom-of-crowds idea for democracy. Good news: they can. Wisdom-of-crowds works for estimation (like guessing a cow's weight) or when people have *some* relevant knowledge. But for specialized questions, the crowd’s accuracy plummets. Democracy relies on aggregating *informed* preferences, not omniscience on facts.

  The deeper issue is misapplying the theorem. Condorcet requires strict conditions: better-than-chance competence, independence, same question. Real crowds often fail these. The flatmate’s argument stretches the theorem beyond its design, ignoring context and domain expertise. 

  So the solution: reject premise (1)'s universality and highlight where independence/competence fail. This saves the theorem’s validity while showing why crowds aren’t magic. Democracy isn’t threatened—it hinges on legitimacy and collective preference, not infallibility on niche facts.
answer: |-
  Your frustration is completely understandable—your flatmate's argument sounds compelling but leads to absurd conclusions (step 6). The flaw isn't in Condorcet's theorem itself (step 2), which is mathematically solid. **The critical failure is in Premise (1) and the misapplication of the theorem's assumptions in steps (3) and (5).** Here's the breakdown:

  1.  **Premise (1) is wildly overgeneralized and false:**
      *   **The Claim:** "People are, on the whole, better than chance at *any* yes/no question of fact."
      *   **The Reality:** Human competence is **highly domain-specific**. While people might average >50% on questions like "Is this object heavier than that one?" or "Which city has a larger population?", they are often *worse than chance* on specialized questions.
      *   **Examples:**
          *   **Murder Trial:** A random person has *no basis* to assess complex evidence, alibis, forensics, or legal definitions. Their "vote" might be based on prejudice, media bias, or pure guessing. 55/45 is implausible; it's likely near 50% or even worse.
          *   **Particle Physics:** Without years of specialized training, a random person has *zero* ability to evaluate evidence for a specific theoretical claim. Their probability of being correct is virtually 50% (guessing) or less (if misled by jargon).
          *   **Vaccine Safety:** Complex medical data analysis is required. Public perception is often swayed by misinformation, making the average person *less* likely than chance to be correct on specific causal claims.
      *   **Cost of Dropping (1):** You concede that crowds are *not inherently competent* on *every* factual question. Wisdom-of-crowds effects **require some minimal relevant competence or signal in the individuals**. This doesn't undermine democracy, as political choices often involve values, preferences, and judgments where aggregated signals *can* be meaningful, not just niche factual expertise.

  2.  **Step (3) Misapplies the Theorem by Ignoring its Assumptions:**
      *   **The Assumptions:** Condorcet requires (a) Individual Competence > 50%, (b) Independence, and (c) Everyone answering the *same* question.
      *   **Why (3) Fails:**
          *   **Lack of Competence:** As per (1), for many questions (defendant guilt, particle physics), the average competence (p) is *not* > 50%. If p = 50%, the theorem says the majority is no better than a coin flip. If p < 50%, the majority becomes *less* reliable as the crowd grows! (They converge on the wrong answer).
          *   **Violation of Independence:** Real-world votes on complex or controversial topics are **highly correlated**. People share common sources of misinformation (same biased news, social media), social influences, cultural biases, and systemic errors. Their mistakes are *not* independent. This destroys the theorem's convergence guarantee. Correlated errors easily swamp any weak individual signal.
          *   **Same Question?:** Does every voter interpret "Did the defendant do it?" identically, with access to the same evidence and legal definitions? Unlikely. Variations in understanding turn it into subtly different questions.

  3.  **Step (5) is Deeply Flawed (Meta-Problem):**
      *   **The Claim:** The crowd can reliably vote on whether its *own* votes are independent or whether its members are >50% competent, because those are "factual questions".
      *   **Why It Fails Spectacularly:**
          *   **Lack of Competence (Again):** Assessing statistical independence or average epistemic competence in a crowd is an *extremely* complex meta-task. Random individuals have **no hope** of having p > 50% on *these* questions. They lack the data, statistical training, and objectivity required. Their vote on "Are we independent?" is likely based on gut feeling, not analysis.
          *   **Circularity & Bootstrapping:** You need an already reliable crowd to certify its own reliability. But if the crowd isn't reliable (due to low p or lack of independence), its vote on its own reliability is worthless. It cannot bootstrap itself into reliability this way.
          *   **Self-Defeating:** If the crowd is systematically biased or misinformed (making p < 50% on the *original* question), it's highly likely to be *wrong* in affirming its own competence and independence. The theorem doesn't magically create competence where none exists.

  **What the Theorem *Actually* Does and Its Limits:**

  *   **It's a Conditional Proof:** Condorcet's theorem is powerful *if and only if* its strict assumptions hold: **p > 0.5 AND Independence AND Same Question.**
  *   **It Explains *Some* Wisdom-of-Crowds Phenomena:** It perfectly explains why crowds are good at guessing the weight of an ox, the number of jelly beans in a jar, or geographical facts – where individuals have *some* relevant intuition/knowledge (p > 0.5) and guesses are fairly independent.
  *   **It Doesn't Create Competence:** It **amplifies** existing individual competence. If individual competence is low (p ≈ 0.5) or correlated, amplification fails or backfires.
  *   **It Doesn't Replace Expertise:** For questions requiring specialized knowledge, training, or access to data, random individuals lack the necessary competence (p ≯ 0.5). Experts exist precisely because they *do* have p >> 0.5 in their domain. A large crowd of ignoramuses (p = 0.5) is infinitely worse than a single expert (p = 0.95).
  *   **It's Vulnerable to Correlation:** The independence assumption is fragile. In the modern world of mass media and social networks, correlation is often the rule, not the exception, especially for salient or controversial issues.

  **What to Concede and What to Defend:**

  *   **Concede (2):** The theorem itself is correct. Don't fight the math.
  *   **Reject (1):** Humans are not universally >50% competent on all factual questions. Competence is domain-specific.
  *   **Reject the Misapplication in (3):** The theorem only guarantees convergence to truth *if* the strict assumptions hold. For many questions, they don't (low p, lack of independence).
  *   **Reject (5) Utterly:** The crowd cannot reliably bootstrap or self-certify the conditions of the theorem. Meta-questions about the crowd's own properties are often *harder* for them to answer correctly than the original question.
  *   **Reject (4):** Experts are not a waste of money. They provide high individual competence (p >> 0.5) precisely where crowds lack it (p ≤ 0.5). Crowds are excellent for some tasks (aggregating diverse local knowledge, estimation, preference aggregation) but terrible for others (specialized technical judgment).
  *   **Defend Democracy (Wisely):** Defend democracy not on the false premise that crowds are *infallible fact-finders*, but on the grounds that it:
      *   Aggregates preferences and values ("What should we do?") better than alternatives.
      *   Provides legitimacy and peaceful transitions of power.
      *   Can incorporate diverse perspectives and local knowledge *relevant to governance*.
      *   Often uses mechanisms (representatives, experts advising government, independent judiciary) precisely to *mitigate* the limitations of direct mass voting on complex facts. Democracy wisely uses crowds *where they are competent* (e.g., choosing leaders, broad policy direction) and relies on institutions and expertise *where they are not* (e.g., determining guilt in court, drug approval, setting interest rates).

  **Your Response to "Which Premise?":**

  "Premise (1). People are *not* better than chance on *any* yes/no factual question. That's demonstrably false for questions requiring specialized knowledge like 'Did this defendant commit this specific murder based on complex evidence?' or 'Is Higgs mechanism responsible for electroweak symmetry breaking?'. On those, the average person is guessing (p=0.5) or worse. Condorcet's theorem only works if p>0.5 *for the specific question at hand* and if votes are independent. For your murder trial or physics question, p isn't >0.5 for a random crowd, and their votes would be massively correlated by media and bias anyway. The theorem explains why crowds are good at guessing weights or prices, not why they'd be good at quantum mechanics. Experts exist because they *do* have p>>0.5 in their field. And step (5) is nonsense – asking a crowd if it's independent is like asking a drunk if he's sober; he lacks the competence to judge."

  This dismantles the overreach while preserving the valid core insight of the theorem and a robust defense of democracy grounded in reality, not magical thinking about crowds.
