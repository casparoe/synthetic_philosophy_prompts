prompt: |-
  Next month I'm doing a long-form interview for my ideas newsletter with a philosopher whose whole career has been spent arguing that desert is always relative to a practice — that theres no such thing as someone deserving something prior to the rules of some institution or game being in place. I half buy it and half dont, and I want the conversation to actually go somewhere instead of her just restating the thesis. Can you draft me eight to ten interview questions?

  I want at least one question on whether her view can criticize the rules themselves rather than just apply them, at least one on the effort regress (if my effort comes from a character I didnt choose, whats left of desert), at least one on the empirical side of meritocratic belief, and one closer on what could actually change her mind. For each of the main questions, give me a follow-up keyed to the answer she's most likely to give.

  Some things I'd like worked in somewhere:

  - the distinction between what someone deserves and what they're merely worth to others — I think that gap is where her view either gets interesting or falls apart
  - a concrete case I plan to put to her: a firm that now measures "merit" with a peer-review score, where everyone has learned to game the score. What exactly is the desert base when the metric is the moving target? Does anyone deserve the bonus, or only the rating?
  - the worry that "desert is institution-relative" is either trivially true or is just desert-abolitionism wearing a lab coat — and if it's the latter, whether that's a problem for her
  - whether the word meritocracy was ever meant as a compliment or always as a warning, and what that does to people who now use it as a straight-faced ideal
  - the standard objection that if desert is only ever internal to a practice, she loses the resources to say a whole practice is unjust — and what she says back

  Keep them concrete and a bit adversarial without being gotcha-y. No "what drew you to philosophy" filler, and nothing that depends on her having read a specific book or on me citing one — she should be able to answer everything straight from the view itself.
reasoning: |-
  Okay, the user is preparing for a long-form interview with a philosopher who argues that desert is always relative to institutional practices. They want substantive questions that challenge her thesis without being adversarial. Let me unpack their requirements.

  First, the user half-agrees with the philosopher's position but wants the conversation to move beyond restating the thesis. They need questions that probe weaknesses in the argument while remaining concrete. The key areas they specified are: criticism of rules themselves, the effort regress problem, empirical aspects of meritocracy, and what could change her mind. 

  I notice they also want to explore the gap between desert and market value - that's crucial. The peer-review gaming case study is perfect for making abstract concepts tangible. And they're worried the "institution-relative" stance might either be trivial or secretly abolitionist - that needs direct confrontation.

  Hmm, the Michael Young meritocracy origin point is interesting historically. Asking whether modern proponents misunderstand the term could reveal how language shapes moral arguments. And the justice question is essential - if desert is practice-bound, how can we condemn unjust systems?

  For structure, each main question needs a follow-up anticipating her likely responses. The peer-review case should come early to ground things. The effort regress question might flow well after discussing desert bases. Saving the mind-change question for last makes sense as a climax.

  I should avoid anything requiring external references. The questions must stand on her own framework. Tone-wise, "adversarial without being gotcha-y" means pressing contradictions but leaving room for nuance. For example: "If desert requires community rules, does that mean pre-institutional humans had no desert claims?" 

  The worth/desert distinction could be framed through labor markets - "When a nurse and hedge fund manager swap salaries, does your view say one deserves less or that we've mispriced?" That makes it visceral.

  For the abolitionism worry, I could position it as: "Critics might say you're not describing desert but dissolving it - how is your view meaningfully different from saying 'desert doesn't exist'?" That forces clarification.

  Testing follow-ups: If she says practices can be criticized via internal contradictions, the pushback could be "But what if a practice is coherent yet cruel?" If she dismisses pre-institutional desert, asking about family obligations might reveal tensions.

  This needs to balance rigor with conversational flow. No more than ten questions total. Bookending with the concrete case and the mind-change question creates narrative momentum. The empirical meritocracy question can cite studies without naming them - "data suggesting meritocracy beliefs increase selfishness" keeps it accessible.

  Most importantly, every question should require her to apply her theory, not just recite it. That's how we get "somewhere new".
answer: |-
  Here are ten tightly-focused interview questions with adversarial edge but genuine philosophical substance, designed to push the conversation beyond restatement and into contested territory. Each main question has a likely-response-based follow-up.

  ### Core Questions & Follow-Ups

  1.  **The Justice Challenge:** You argue desert only exists *within* established practices. But if a practice itself is deeply unjust—say, a caste system where "merit" is defined by birth purity—does your framework allow us to say someone *deserves* better treatment *despite* the rules? Or only that the rules are bad? (Where does the normative force *against* the practice come from if not from a pre-institutional desert claim?)
      *   *Likely Response:* Perhaps appeal to contradictions within the practice, harm, or external moral frameworks.
      *   *Follow-Up:* If the normative force comes from harm, fairness, or rights *external* to the desert-practice itself, doesn't that reintroduce a form of desert (or a desert-like moral claim) that *precedes* or *constrains* the institutional rules? Isn't saying "this caste rule causes unjust harm" implicitly claiming individuals deserve not to be harmed that way?

  2.  **The Effort Regress:** You ground desert within practice rules. But often, the desert base *within* a practice is effort or striving (e.g., "most improved player"). If my capacity for effort stems from traits I didn't choose (genetics, upbringing), doesn't this undermine the *moral* force of "desert" within the practice too? Is institutional desert just tracking luck all the way down?
      *   *Likely Response:* May argue the practice defines the relevant "effort" criterion; the *why* of the capacity is irrelevant *within* the practice's logic.
      *   *Follow-Up:* Doesn't this make institutional desert purely conventional and arbitrary, devoid of deeper moral justification? If the practice defines "effort" in a way that inherently advantages the genetically lucky (e.g., requiring 80-hour weeks), why call it "desert" rather than just "the prize the rules happen to award"?

  3.  **Desert vs. Market Worth (The Nurse vs. Trader):** Consider two people: an exceptional nurse saving lives and a mediocre hedge fund trader. The trader earns vastly more due to market forces. Does your view say the trader *deserves* their higher income because market rules award it? Or is there a crucial distinction between what the market *values* (worth) and what someone *morally deserves*? If so, how does your practice-relative desert capture that distinction?
      *   *Likely Response:* May argue the market *is* the relevant practice, so within its rules, yes, the trader deserves the income generated. Or may concede the distinction but locate "desert" only within specific practices (e.g., nursing awards).
      *   *Follow-Up:* If the market practice dictates desert here, doesn't that render "desert" morally inert, simply rubber-stamping existing power structures? If desert only exists in *non-market* practices (like awards), doesn't that severely limit its scope and relevance to modern life dominated by market valuation?

  4.  **The Gamed Metric (Concrete Case):** Imagine a firm where bonuses are tied solely to a peer-review score. Employees discover that giving inflated scores to colleagues leads to reciprocal high scores. Soon, everyone gives near-perfect scores, making the metric useless for differentiation. According to your view: Does *anyone* in this firm *deserve* the bonus? If so, based on what? If not, what exactly failed – the desert claim or just the measurement?
      *   *Likely Response:* Likely to say the *practice* (peer-review for bonus allocation) has broken down because the metric no longer tracks the intended desert base (e.g., performance, contribution). Desert claims within the practice become incoherent.
      *   *Follow-Up:* But the *rules* are still being followed: bonuses *are* awarded based on the score. Isn't this just a stark example showing that "desert within a practice" collapses if the practice's *internal aims* (identifying merit) are undermined, even while its *formal rules* are followed? Does desert depend on the practice functioning *as intended*, not just existing?

  5.  **Meritocracy: Ideal or Warning?:** Michael Young coined "meritocracy" as a dystopian warning about a society rigidly governed by measured intelligence, creating a new, smug aristocracy. Yet today, it's widely embraced as a pure ideal. Does this linguistic shift reveal a fundamental instability or misunderstanding in the *concept* of institutional desert? Can "merit" defined by practice rules *ever* avoid becoming oppressive or self-justifying for the winners?
      *   *Likely Response:* May argue Young's warning was about *specific* implementations/abuses, not meritocracy *per se*, or that any institutional ideal can be corrupted.
      *   *Follow-Up:* But doesn't your own view – that desert is entirely constructed *by* the rules – make it *inherently* susceptible to being defined in ways that serve the interests of those setting the rules? Isn't the slide from warning to ideal precisely because winners within *any* meritocratic system will claim their rewards are "deserved," using your framework?

  6.  **Triviality or Abolitionism?:** Critics might argue: Either "desert is practice-relative" is trivially true (obviously, rules define the game's rewards!) or it's a covert argument for desert-abolitionism – showing that because desert is *only* conventional, it lacks deep moral weight and we should stop using the concept. Is your view trivial or abolitionist? If neither, what substantive, non-trivial work does "desert" do that "eligibility per the rules" doesn't?
      *   *Likely Response:* Will argue it's neither: it reveals the *source* of desert claims, showing they aren't natural/metaphysical, but this doesn't diminish their real normative force *within* social contexts.
      *   *Follow-Up:* But if that normative force *only* exists because of the contingent rules, and offers no critical leverage *against* bad rules (as per Q1), doesn't that *actively undermine* the moral weight people intuitively assign to desert? Doesn't it functionally *reduce* desert to "eligibility," just with a weighty-sounding word attached?

  7.  **Empirical Meritocracy Beliefs:** Studies suggest belief in strict meritocracy correlates with less empathy for the disadvantaged and increased belief that the wealthy inherently deserve their status. If your view accurately describes how desert *actually functions* (within practices), does it inadvertently *support* this psychological tendency? Or is your view intended as a critical tool *against* this tendency? How?
      *   *Likely Response:* Likely to argue her view is descriptive/clarificatory, not prescriptive, and can be used critically to expose when "desert" claims mask privilege or broken practices.
      *   *Follow-Up:* But if your descriptive account shows desert *is* always just defined by the rules of the game, and powerful groups write the rules, doesn't the description itself risk legitimizing the winners' claims? Doesn't saying "the hedge fund trader *deserves* their income within market rules" (as per Q3) *reinforce* the very belief your view might want to critique?

  8.  **Changing Your Mind (Closer):** What kind of evidence, argument, or thought experiment could realistically lead you to modify or abandon your core thesis that desert is *always* and *only* relative to a practice? Is there a hypothetical scenario where someone clearly deserves something *prior* to or *independent* of any institutional rule?
      *   *Likely Response:* May be hard to imagine, perhaps citing the necessity of a framework to define "desert." Might point to fundamental needs or suffering.
      *   *Follow-Up:* If you point to fundamental needs (e.g., "a starving person deserves food"), isn't that appealing to a desert-like claim *outside* any specific practice? Or is your response that "basic human decency" *is* the relevant, very broad practice? If the latter, doesn't that practice then become foundational, potentially contradicting the idea that *all* desert is relative to *contingent* institutions?

  ### Key Elements Incorporated
  *   **Criticizing Rules:** Explicit in Q1 & Follow-up, implicit in Q5 & Q6.
  *   **Effort Regress:** Q2 & Follow-up.
  *   **Empirical Meritocracy:** Q7 & Follow-up.
  *   **Change Her Mind:** Q8 & Follow-up.
  *   **Desert vs. Worth:** Central to Q3 & Follow-up.
  *   **Concrete Case (Gamed Metric):** Q4 & Follow-up.
  *   **Triviality/Abolitionism Worry:** Q6 & Follow-up.
  *   **Meritocracy as Warning:** Q5 & Follow-up.
  *   **Justice of Whole Practice:** Q1 & Follow-up (core challenge).

  These questions demand she apply her thesis to hard cases, defend its boundaries, and confront its potential implications and limitations, moving beyond simple restatement. Good luck with the interview!
