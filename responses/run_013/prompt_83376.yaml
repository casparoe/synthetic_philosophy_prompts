prompt: |-
  I'm a second-year student in a course on the social construction of kinds — race, gender, money, and the like — and I keep running into a pattern in the material that I can't match to any single concept we've been given, so I'd like your help pinning it down.

  Consider two cases. In the first, a category is a mark of disrepute — say a stigmatized diagnosis, or a criminal classification. Because being placed in it is costly, people who might fall under it avoid being recorded, and those who are recorded learn to hide the tell-tale signs; when cases do surface, they tend to cluster in families and tight communities where concealment fails. The category therefore looks rare, sharply bounded, and clustered — the profile of a natural kind.

  In the second case, a category is a mark of honor or belonging — an admired ancestry, a prestigious credential, a fashionable identity. Because being placed in it is advantageous, people claim it and adopt its markers. The category therefore looks common, fuzzy, and diffuse — the profile of something merely conventional, or of "everyone is a little bit this."

  What puzzles me is that the underlying move looks the same in both: a classification reshapes the people it classifies, and those people then generate the very evidence used to justify the classification. Yet the two cases produce opposite signatures — rarity and sharpness versus ubiquity and blur — apparently turning only on whether the category is shameful or prized. And in each case the signature is then read back as a fact about the category's nature, when it is downstream of the social process.

  So: is there an established name for this valence-dependence — for a single feedback loop between a classification and the classified that runs in opposite directions depending on whether the category is stigmatized or valued, and thereby manufactures opposite kinds of evidence about its own naturalness? If there is, tell me what it is and exactly which parts of what I've described it covers and which it leaves out. I suspect the nearest things I know — self-fulfilling prophecies, and the general idea that classifications of people loop back on the people classified — each capture only one direction or drop the valence entirely, and I'd like you to say whether that suspicion is right. If nothing established fits, coin a term, define it in a sentence, and give me two cases that fall just outside its boundary so I can see where the edge is. I'm not asking for a reading list; what I want is the carving — what the phenomenon is, what it isn't, and where it stops. Please keep the whole answer under 400 words.
reasoning: |-
  Hmm, let's unpack this fascinating query. The student describes a pattern where social classifications create self-reinforcing evidence of their own validity, but with opposite manifestations depending on whether the category is stigmatized or valued. 

  The core insight seems to be about feedback loops in social categorization, but existing concepts like self-fulfilling prophecies don't fully capture the valence-dependent divergence in outcomes. For stigmatized categories, concealment produces apparent rarity and sharp boundaries that mimic natural kinds. For valued categories, performative adoption creates apparent ubiquity and fuzziness that suggests social construction.

  What's striking is how both processes generate evidence that gets misinterpreted as revealing the category's inherent nature, when actually it's produced by the classification system itself. The valence acts like a switch determining whether the feedback loop manifests as contraction or expansion of the category's perceived boundaries.

  After considering various sociological frameworks, I realize the closest established concept is W.I. Thomas' theorem about situations defined as real becoming real in their consequences. But even that doesn't explicitly address the valence dimension. The phenomenon seems to sit at the intersection of labeling theory and performativity, yet requires recognizing how desirability inverses the loop's effects.

  For boundary testing: ethnic fraud cases would fall outside because they involve external verification, while involuntary categories like age escape the valence mechanism since they can't be concealed or claimed.
answer: |-
  Your observation captures a precise sociological phenomenon: **valence-dependent classificatory looping**. This occurs when the social desirability of a category (its valence) determines the direction of feedback between classification and behavior, thereby generating misleading evidence about the category's ontological status.

  **Definition:** *A self-reinforcing process where the perceived value (stigma or prestige) of a social category shapes subjects’ behavioral responses (concealment/adoption), producing population-level patterns that are misattributed to the category’s inherent nature rather than the social dynamics.*

  ### What It Covers:
  - **Valence as driver**: Stigma → concealment → rarity/sharp boundaries → "natural kind" appearance.  
    Prestige → adoption → ubiquity/blur → "social construct" appearance.  
  - **Misattribution**: The resulting patterns (rarity/ubiquity) are interpreted as evidence of the category’s *intrinsic* properties, obscuring the social feedback loop.  
  - **Asymmetry**: The *same* looping mechanism (classification → behavioral adaptation → evidence for classification) bifurcates based on valence.  

  ### What It Leaves Out/Excludes:
  - **Self-fulfilling prophecies**: These lack valence-dependence (e.g., "bank runs" occur without stigma/prestige).  
  - **General performativity**: Drops valence specificity (e.g., "money" works via collective agreement, not individual concealment/claiming).  

  ### Boundaries (Cases Just Outside):  
  1. **Ethnic fraud** (e.g., falsely claiming Indigenous identity): Involves adoption, but the *verification struggle* (external gatekeeping) overrides pure valence-driven looping.  
  2. **Age-based classifications**: Valence matters (e.g., hiding one’s age), but biological constraints limit behavioral adaptation, weakening the feedback.  

  Your suspicion is correct: Existing terms capture either the looping (*labeling theory*) or the outcome (*essentialism vs. social construction*) but not the valence-driven directional asymmetry. This phenomenon explains how social valuations *manufacture the illusion of their own empirical foundations*.

