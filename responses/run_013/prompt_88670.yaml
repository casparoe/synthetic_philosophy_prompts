  Ok so I'm not an academic, just someone who argues about this stuff with friends, and I keep going back and forth on the gender-equality paradox. You know the thing where richer, more egalitarian countries sometimes show bigger sex differences in what men and women say they're interested in or what jobs they pick. My question: what's your actual credence that this pattern is mostly a real expression of underlying average sex differences that get more room in freer societies, rather than mostly a product of culture, institutions, measurement, or economics? Please give me a number, and decompose it. Like: how likely is it that the cross-country pattern isn't mostly an artifact of how egalitarian is measured or how career interests are surveyed; how likely is it that any real sex differences in interests are partly biological rather than fully socially constructed; how likely is it that more equality frees up preexisting dispositions instead of shaping them; how likely is it that economic development or wealth is doing the work rather than gender equality itself; and whatever other terms you'd add. Then tell me which sub-question the number is most sensitive to, and what evidence would move you most. Also please separate what's actually settled from what's genuinely contested among people who know the topic, dont just give me the version that's popular in one camp. And dont send me a reading list, I cant look stuff up right now.
