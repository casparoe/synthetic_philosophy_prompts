prompt: |-
  I'm in a third-year metaphysics module and our reading group has got completly stuck on dispositions — specifically the cases where something seems to be disposed to do a thing and then doesn't, or does the thing without being disposed to. I promised to bring a handout next week and I want it to be a proper decision tree rather than yet another list of -isms, because I've definately noticed I can recite the labels ('conditional analysis', 'masking', 'fink', 'categoricalism', 'dispositional monism') while having no idea which one I actually believe. So: build me a flowchart that takes someone from their verdicts on a handful of cases to a named position on what the truth of a disposition ascription consists in — whether it's a counterfactual, a categorical basis, a sui generis modal property, a second-order property, or a law of nature.

  The cases I want it to run on (add more only if you need them to split something apart): (a) a wire that is live, wired to a device that cuts the current the instant anything touches it, so touching it never shocks you, though the wire is live throughout; (b) a fragile glass packed in foam, so that dropping it doesn't break it; (c) a soluble sugar cube dropped into water that's already saturated with sugar, so it doesn't dissolve; (d) a tough glass with a hidden mechanism that shatters it on impact, so it behaves exactly like fragile glass without being fragile; (e) a brave person who's taken a drug that makes them flee from danger — still brave, just unable to show it. (b) and (c) both involve something stopping the manifestation; one friend insists they're the same kind of case, another insists they're not, so if the tree can show what actually turns on that, all the better. Each branch node should be a question someone can answer from their verdicts on these cases without already knowing which position it leads to — something along the lines of 'does the ascription entail a counterfactual at all, or only on the assumption that nothing interferes?', phrased your way — and no node should be answerable only by someone who already has the terminology down.

  The leaves I need to be reachable: the plain conditional analysis; the version that adds a 'so long as nothing interferes' clause; dispositions as irreducible properties in their own right, tied to their manifestations by something stronger than contingent fact; the view that a disposition just is its causal basis under another description; the view that a disposition is the second-order property of having some property that plays a certain causal role; the view that everything is really categorical and disposition-talk is a useful fiction; and the view that disposition ascriptions are really claims about laws. If the cases force a position none of those covers, add it; if one of them turns out to be unreachable on your tree, say so rather than fudging it with an extra question. Then, at the bottom: (i) a note on which leaves no case can separate — I suspect two of them differ only over what's fundamental, or over parsimony, and I'd rather have that flagged than papered over; (ii) a short list of answer-combinations nobody occupies, with your best guess at whether that's because the combination is incoherent, unattractive, or simply unexplored. About eight leaves and no more than six branch nodes, one sentence per leaf on its most awkward commitment, and don't bother with references — it's a handout, not a paper.
