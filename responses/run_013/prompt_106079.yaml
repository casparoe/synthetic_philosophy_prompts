prompt: |-
  Write a poem in three numbered movements, one for each of the three ways Nietzsche says a person or a culture can relate to its past — the monumental, the antiquarian and the critical — as set out in the second of his Untimely Meditations (1874), the essay on the advantage and disadvantage of history for life. I want the poem to be recognisable to someone who knows the essay without ever naming the three modes inside the poem. Each movement should be spoken in the first person by the kind of person Nietzsche attaches to that mode, and should carry both that mode's characteristic gift and its characteristic disease. The monumental voice looks to the great exemplars of the past and is fired to act, but it is also the voice that flattens context, drifts toward fanaticism, and can be turned by the powerful into a weapon against the present. The antiquarian voice loves and preserves what it has inherited, and its disease is that it can only preserve and never create — its reverence can mummify the very life it means to keep. The critical voice suffers under the weight of the past, wants to drag it before a tribunal and be free of it, but the movement must turn on itself when it discovers that the judge is also an heir, that the tribunal it longs to sit on cannot be outside the inheritance it is judging.

  Let the form do the work. Use a single refrain that closes each of the three movements, identical in wording except for its last word, which changes to name what that mode demands of the past — something in the spirit of a model, a root, a verdict, though you should find your own. The three movements should not be interchangeable: give them different stanza shapes or line-lengths, so that the drive of the first, the closedness of the second and the breakage of the third are audible in the verse itself. End with a short coda in which the three versions of the refrain are brought together, their differing final words held in unresolved tension. The poem should not adjudicate between the three, because Nietzsche's own answer is that they must be kept in balance and judged only by whether they serve life.

  Aim for something between thirty and fifty lines, in a controlled and formal register. It should be accurate enough that a reader of the essay would find all three voices right, and good enough as a poem that someone who has never read it would still want to read it twice.
reasoning: |-
  Okay, the user wants a poem based on Nietzsche's three historical modes from his "Untimely Meditations" essay. They've provided very specific requirements: three numbered movements corresponding to monumental, antiquarian, and critical approaches, each with distinct voices and poetic forms. 

  Hmm, this is quite a sophisticated request. The user clearly knows Nietzsche well and wants poetic precision - they're probably an academic or deeply engaged philosophy/literature enthusiast. The challenge is balancing scholarly accuracy with poetic merit. 

  Let me unpack their requirements: 
  First movement (monumental) needs driving energy and risk of fanaticism. I'm thinking strong iambic rhythm with escalating intensity. The refrain should end with "summon" to capture that call-to-action urgency. 

  Second movement (antiquarian) requires claustrophobic reverence. Short lines with repetitive rhyme (AABB) could mirror that stifling preservation. "Shelter" as the refrain end-word feels right - protective but suffocating. 

  Third movement (critical) demands fracture and self-doubt. Maybe jagged enjambment and disrupted meter? "Unchain" for the refrain speaks to liberation while acknowledging the paradox. 

  The coda's tricky - must hold all three end-words ("summon/shelter/unchain") in tension without resolution. A tercet with chiasmus structure might create that balance Nietzsche advocates. 

  User's emphasis on "form doing the work" means I can't take shortcuts. Stanza structures must embody each mode's pathology: 
  - Monumental: irregular tercets building momentum 
  - Antiquarian: compact quatrains like sealed rooms 
  - Critical: broken couplets spilling over 

  Better avoid direct Nietzsche references - the poem should stand alone. The voices should reveal themselves through action: the first scaling heights, the second polishing relics, the third swinging a hammer. 

  Final check: does this serve "life" as Nietzsche would want? The monumental risks crushing the present, the antiquarian drowns in dust, the critical bleeds from self-inflicted wounds - but each has vitality in their extremity. That tension feels right.
answer: |-
  ## Three Stances Toward the Ancestral Stone

  **I.**
  I climb the fractured slopes where Titans stood,
  Their shadows cast long on this lesser age.
  I trace the outline carved in scorching wood,
  The footprint pressed on history's vast page.
  No silt of context, no distracting rust,
  Obscures the pure, the undefeated thrust
  That broke the mould! Let lesser voices drone
  Of circumstance, the tedious, the known.
  I need the lightning strike, the peak achieved,
  The signpost hammered where the path’s deceived.
  This aching void demands a form immense,
  A standard raised in fierce magnificence.
  My blood ignites! I grasp the echoing cry –
  I’ll raise their likeness 'gainst the ashen sky!
  *O Ghosts of Might, become the shape we summon!*

  **II.**
  This oak was grown from Grandsire’s planted seed.
  This latch, worn smooth, fits only *this* door’s need.
  This script, this scent, this pattern on the loom,
  Confines me safely in this cherished room.
  I know each groove the generations wore,
  Each sacred nick upon the lintel’s core.
  To touch is prayer, to keep is holy rite,
  Preserving every fragment, dark or bright.
  Why seek the new, the raw, the undefined,
  When all that nourishes is here enshrined?
  This dust is gold, this echo is the song,
  The proven path where I have walked so long.
  Let change be storm outside these walls of stone.
  My duty’s clear: protect what is my own.
  *O Weight of Years, become the roof we shelter!*

  **III.**
  This chainmail, rusted, bites into my skin.
  This vaulted ceiling shuts the new light in.
  I choke on incense thick with old deceit,
  On fables told to make the present meek.
  The gilded past lies heavy on the lung,
  A suffocating shroud on the unsung.
  I lift the hammer, not to mend, but break
  The plaster saints that make the spirit ache.
  This heritage is debt I never chose,
  A crippling gift that only burdens, slows.
  I judge! Condemn! Demand a reckoning due!
  But... whose harsh verdict whispers? Is this true?
  My hand, my voice – are they not born of *this*?
  The axe I swing, what ancient forge gave bliss?
  *O Crushing Debt, become the chain we unchain!*

  **Coda:**
  The shape we summon...
  The roof we shelter...
  The chain we unchain...
