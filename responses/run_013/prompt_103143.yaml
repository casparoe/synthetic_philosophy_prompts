  Okay, so I'm putting together a parody issue for our lab newsletter and I need a piece written in the deadpan style of an internal government audit memo. The conceit: a national standards agency has been tasked with confirming the old ornithological law that all ravens are black, and, in the name of efficiency, it has decided to do the confirming by auditing green apples instead of tracking down actual ravens. The memo is from the office that made this call, defending it to a furious oversight committee. Around 600 words, numbered sections if that helps, with the bureaucratic register kept completely straight — no winking.

  The humour has to come from the logic being right, so please get the actual paradox right instead of doing a vague "isn't science weird" thing. Stuff I'd like it to work in, ideally without naming any textbooks:

  - that the claim all ravens are black is logically the same as the claim all non-black things are non-ravens, so a green apple really is a positive instance of the first claim;
  - that the equivalence condition is what makes this awkward in the first place;
  - that the honest Bayesian line is that yeah, a green apple does nudge the probability up a hair, but by a negligible amount, because there are vastly more non-black things than ravens — so the memo is defending something real, not just talking nonsense;
  - that the committee's strongest objection is really about selection — the agency only audits whatever non-black objects happen to be lying around, which is not how you'd sample if you genuinely cared;
  - and I'd like the memo to have to fend off the objection that you could confirm any hypothesis this way by tacking on an irrelevant conjunct, and to end by proposing an even cheaper expansion of the programme — the joke being that the proposal is fully consistent with everything the memo has argued.

  The target is the whole practice of checkbox confirmation — treating any old positive instance as evidence worth collecting — and the risk-management language that comes with it. Keep it deadpan. Someone who knows the literature should wince and laugh at how fair it is; someone who doesn't should still follow it.

  Give me a committed version: pick a position for the memo's author and commit to it, don't hedge off into "on the other hand." Then add a short note of a few sentences on where the piece takes liberties with the actual debate or leans on a contested reading, so I know what I'm fudging. (Also, seperate heading from body if you use headings, and don't feel you have to recieve my exact structure — the sections are up to you.)
