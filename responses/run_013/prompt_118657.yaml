  The dinner plates were nearly cleared when Alice turned to Ben. "You know, leaving your shopping cart stranded in the parking lot like that? It’s genuinely inconsiderate. Someone has to deal with it."

  Ben flushed slightly. "Okay, fine, maybe it was lazy. But honestly, Alice? Remember last month when you blocked the entire bike lane unloading groceries for *twenty minutes*? Pot, kettle much? You don't get to lecture me about public nuisances."

  A spoon clinked as Charlie, who’d been quietly eating dessert, set his down. "Hang on, Ben," he said mildly. "You’re absolutely right that Alice parked selfishly last month. But calling *her* a hypocrite for pointing out the cart thing? That’s you blaming her for blaming poorly... while doing the exact same thing yourself. You just made a public nuisance complaint about *her* public nuisance complaint." Charlie took a slow sip of water. "It doesn’t mean her original point about the cart was magically wrong. But now, because *you* did the hypocrite-calling thing too, no one hears it. Or cares. Including me." He picked up his spoon again, leaving Ben momentarily speechless and Alice staring at her napkin, the air thick with the sudden, silent recursion of blame.
