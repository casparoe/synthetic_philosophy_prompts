  First I need to cover their explicit requirements:
  - Must-handle cases: notebook-as-memory, shape rotation, shared remembering, implants/devices, search engines
  - Must-preserve distinctions: causal vs constitutive, personal/subpersonal, coupled vs used, automatic vs checked
  - Must-remain-consistent-with: neural realization, anti-bloat constraint, developmental facts

  Then their three debated constraints:
  1. Diachronic stability - genuine requirement
  2. Functional specification - genuine but nuanced
  3. Gradience - genuine with caveats

  Plus two sticky cases:
  - Calculator for easy math
  - Phone autocomplete

  The user especially wants tension points - where desiderata conflict. The anti-bloat requirement seems like the biggest gatekeeper, excluding many causal theories.

  For structure:
  - Core desiderata first with motivating cases
  - Distinctions as negative requirements
  - Consistency constraints as boundary conditions
  - Then evaluate their three constraints
  - Apply to tricky cases
  - Finally show tensions and scorecard

  Key tension: Anti-bloat vs functional equivalence (Otto's notebook would bloat if applied carelessly). Also gradience vs all-or-nothing views.

  For the scorecard:
  - Parity principle fails distinctions/bloat
  - Complementarity handles artifacts but struggles with notebooks
  - Integrationism handles most but gradience is messy

  The autocomplete case tests automatic endorsement vs mere coupling. Calculator case challenges functional equivalence vs cognitive laziness.

  Must emphasize that developmental facts constrain what counts as "natural" extension - implanted tech differs from culturally embedded tools.

  This framework should let the user hammer weak theories while building their own case.
answer: |-
  Here is a comprehensive set of desiderata for an adequate theory of cognitive extension, grounded in the cases and constraints you specified. The requirements are designed to distinguish genuine cognitive extension from mere tool use while addressing tensions and adjudicating difficult cases.

  ---

  ### **Core Desiderata for a Theory of Cognitive Extension**

  1. **Functional Equivalence Requirement**  
     *Motivation*: Otto’s notebook case (Clark & Chalmers, 1998). Otto, who has Alzheimer’s, uses a notebook to store information he consults as readily as biological memory.  
     *Verdict Required*: The notebook must count as part of Otto’s cognitive system.  
     *Distinction Preserved*: Not merely causal influence (like using a phonebook) but constitutive contribution to cognition.  

  2. **Transparent Access Requirement**  
     *Motivation*: Shape rotation on a screen (Kirsh & Maglio, 1994). A person manipulates an external object (e.g., Tetris blocks) to offload mental rotation.  
     *Verdict Required*: The screen rotation must qualify as part of the cognitive process.  
     *Distinction Preserved*: Resource is *automatically endorsed* (trusted without verification) vs. deliberately checked (like consulting an unreliable website).  

  3. **Interpersonal Integration Requirement**  
     *Motivation*: Shared episodic memory (Harris et al., 2014). Two people co-remember an event, each relying on the other’s recall.  
     *Verdict Required*: The dyadic system must count as an extended cognitive unit.  
     *Distinction Preserved*: *Coupled systems* (mutually interdependent) vs. merely social tool use (e.g., asking a stranger for directions).  

  4. **Bodily Integration Requirement**  
     *Motivation*: Worn/implanted devices (e.g., a cochlear implant or continuous glucose monitor).  
     *Verdict Required*: The device must qualify as cognitive extension when seamlessly integrated.  
     *Distinction Preserved*: *Personal-level* cognition (e.g., monitoring glucose as part of bodily awareness) vs. subpersonal (e.g., a pacemaker’s autonomous operation).  

  5. **Anti-Bloat Constraint**  
     *Motivation*: Ordinary reliance on search engines (e.g., Googling a fact).  
     *Verdict Required*: Routine search engine use *does not* automatically extend cognition (to avoid annexing the entire web).  
     *Distinction Preserved*: Resource is *reliably available and integrated* (like Otto’s notebook) vs. ephemeral or context-dependent (e.g., a library book).  
     *Consistency*: Prevents "cognitive bloat" where every causal dependency counts as mind-extension.  

  6. **Neural Priority Constraint**  
     *Motivation*: Developmental/clinical facts (e.g., children internalize arithmetic after using physical counters).  
     *Verdict Required*: Offloading to tools (e.g., calculators) can be scaffolding without constituting extension.  
     *Consistency*: Preserves that *ordinary* cognition is neurally realized, and external resources are dispensable in intact brains.  

  ---

  ### **Evaluation of Your Proposed Constraints**
  - **Diachronic Stability**: **Genuine desideratum**. Motivated by Otto’s notebook: extension requires stability across presence/absence/swap (e.g., Otto’s notebook could be stolen/replaced without collapsing cognition). Excludes one-off tool use.  
  - **Functional Specification**: **Genuine but nuanced**. The theory must name the cognitive function (e.g., "memory storage," "rotation processing") and clarify whether it *could* be internal. However, demanding it *must* be internalizable risks biasing toward parity—complementary functions (e.g., a GPS providing spatial info the brain cannot) should count.  
  - **Gradience**: **Genuine desideratum**. Cases like search engines vs. implants show extension varies by integration depth (trust, accessibility, customization). Avoids binary categorization.  

  **Revised List Incorporates**: All three (as #7–9 below).

  ---

  ### **Full Desiderata List (Including Additions)**
  7. **Diachronic Stability Requirement**  
     *Motivation*: Otto’s notebook must function across time, loss, and replacement.  
     *Excludes*: Episodic tool use (e.g., solving one math problem with a calculator).  

  8. **Functional Specification Requirement**  
     *Motivation*: Implants perform specific cognitive functions (e.g., cochlear implants for auditory processing).  
     *Clarifies*: Whether the function is substitutable internally is relevant but not decisive.  

  9. **Gradience Requirement**  
     *Motivation*: Search engines (shallow extension) vs. neural implants (deep extension).  
     *Adjudicates*: Cases lie on a spectrum of cognitive integration.  

  ---

  ### **Adjudication of Sticky Cases**
  - **Calculator for Easy Sums**:  
    - *Verdict*: **Not extension** if used for problems solvable mentally.  
    - *Why*: Fails *diachronic stability* (context-dependent use) and *neural priority* (internal capacity exists). Meets *functional equivalence* but violates *anti-bloat* (would annex all calculators).  

  - **Phone Autocomplete (Unchecked Acceptance)**:  
    - *Verdict*: **Extension** if suggestions are automatically endorsed (e.g., habitual use without verification).  
    - *Why*: Satisfies *transparent access* and *functional equivalence* (like Otto’s notebook). Fails if user manually checks each suggestion (*mere tool use*).  

  ---

  ### **Tensions Between Desiderata**
  1. **Anti-Bloat vs. Functional Equivalence**:  
     - *Conflict*: If functional equivalence alone suffices (parity principle), search engines extend cognition—violating *anti-bloat*.  
     - *Resolution*: Require *transparent access* and *diachronic stability* (e.g., search engines lack stability/automatic endorsement).  

  2. **Neural Priority vs. Gradience**:  
     - *Conflict*: Neural priority emphasizes internal realizability, but gradience allows partial extension (e.g., a calculator for complex math).  
     - *Resolution*: Gradience applies only when the resource performs a function *the brain treats as its own* (via integration), not when internalizable.  

  **Most Exclusionary Requirement**: **Anti-Bloat**. It eliminates overpermissive theories (e.g., causal coupling views) by requiring *resource-specific constraints* (reliability, accessibility, trust).  

  ---

  ### **Brief Scorecard of Major Views**
  - **Parity Principle**: Fails *anti-bloat* (annexes tools like search engines) and *complementarity* (requires functional equivalence). Passes Otto’s notebook.  
  - **Complementarity View**: Passes *shared memory* and *implants* (handles non-equivalent functions). Fails *functional equivalence* for Otto’s notebook.  
  - **Integrationism (e.g., MERIT)**: Best overall—passes *diachronic stability*, *gradience*, and *anti-bloat* by demanding "trust and glue" (accessibility, reliability). Struggles with *shared memory* (interpersonal "trust" is nebulous).  

  ---

  This framework ensures theories avoid conflating cognition with tool use while accommodating your problem cases. The tensions highlight where commitments must be made (e.g., *anti-bloat* forces stricter conditions than parity). Use the desiderata as a rubric: a theory must satisfy all, with conflicts exposing its limitations.
