  ### For Your Column: The Role of Neglectedness
  **The foundation treats neglectedness as a gate, not a tiebreaker or proxy.**  
  - **Reasoning:**  
    - **Gate:** Neglectedness is binary and non-negotiable—it's the first hurdle. If a project isn't neglected (i.e., the foundation's dollar wouldn't add value due to displacement or saturation), it's rejected outright, as in Decision 4. This is clear from the memos' language: "displace other donors' money" (Decision 4) and "left this particular one open" (Decision 1) show neglectedness is about additionality, not just a scoring factor.  
    - **Not a tiebreaker:** Decisions aren't made by ranking neglectedness among otherwise equal options. For example, Decision 3 was funded despite low tractability because it passed the neglectedness gate, not because it "won" a tie. Importance and tractability are evaluated only after the gate.  
    - **Not merely a proxy:** While neglectedness proxies marginal impact, the board uses it directly to assess additionality, as seen in Decision 4 (crowding = displacement) and Decision 1 (specific opportunity = room for impact). It's operational, not heuristic.  

