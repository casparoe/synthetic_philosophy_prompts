  ### Step 1: Rules Consistent with All Four Precedents
  The foundation's decisions reveal that importance, tractability, and neglectedness are not additive weights but interact in a specific hierarchy. Two core rules fit all four precedents:

  - **Rule A (Neglectedness as a Gate with Milestone-Based Tractability):**  
