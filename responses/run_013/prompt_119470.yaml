    (1) **Importance:** The project addresses a high-impact problem (e.g., cost-effective, scalable, or field-defining).  
    (2) **Tractability:** There must be at least one concrete, measurable milestone to track progress, even if outcomes are long-term or speculative. This milestone acts as a "tractability anchor," ensuring the project isn't too nebulous to manage.  

    This rule fits all four precedents:  
    - **Decision 1 (funded):** Neglectedness passed (specific opportunity was open despite crowded field), importance passed (well-evidenced health program), tractability passed (evidence implied milestones).  
    - **Decision 2 (turned down):** Neglectedness status unknown but irrelevant; tractability failed (no definable first-year milestone), so it didn't proceed past the gate.  
    - **Decision 3 (funded):** Neglectedness passed (no other funders), importance passed (field-building), tractability passed (implied milestone—e.g., establishing a research community or pipeline, even without near-term deliverables).  
    - **Decision 4 (turned down):** Neglectedness failed (crowded space meant displacement), so the gate blocked it regardless of importance or tractability.  

