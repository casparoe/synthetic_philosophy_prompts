answer: |-
  ## Veritab Community Guidelines & Moderation Handbook (v.3.1)

  **Section 1: Core Assertion Principle**
  1.1 Veritab is committed to the promotion of epistemically sound discourse. All user assertions (defined as any declarative statement presented as factual within posts, comments, direct messages subject to reporting, and bio fields marked "Factual Claims") must adhere to the Knowledge Norm of Assertion (KNA).
  1.2 **The Knowledge Norm (KNA):** An assertion is permissible on Veritab only if the asserter knows the proposition asserted to be true.
  1.3 **Knowledge Definition (Operational):** For the purposes of moderation, knowledge requires:
      1.3.1 The proposition is true (T).
      1.3.2 The asserter believes the proposition (B).
      1.3.3 The asserter's belief is justified (J) according to Veritab Standard Justification Protocols (SJP - See Appendix A).
      1.4 **Prohibited Norms:** Assertions based solely on Truth (T without J&B), Belief (B without T&J), or Justified Belief (J&B without T) are violations.

  **Section 2: Violation Types & Moderation Protocols**
  2.1 **Category K-1: Clear Ignorance.** Assertions lacking T, B, or J. (e.g., "The moon is made of green cheese."). Standard penalty: 24hr mute, mandatory "Epistemic Foundations" micro-course.
  2.2 **Category K-2: False Belief.** Assertions where B & J are present but T is absent. (e.g., Sincerely asserting a well-researched but factually incorrect historical date). Penalty: 72hr mute, flag on user's "Justification Reliability Score" (JRS).
  2.3 **Category K-3: Gettier-Type Events (GTE).** Assertions meeting T, B, and J, but where the justification is "gettiered" (i.e., the justification does not connect to the truth in the appropriate way). (e.g., Correctly asserting "Jones owns a Ford" based on seeing Jones drive a Ford, unaware the car is rented, but Jones *does* coincidentally own a different Ford).
      2.3.1 GTE assertions are technically KNA-compliant at the moment of assertion. **No penalty is applied upon initial moderation review.**
      2.3.2 However, if the Gettiered nature of the justification is discovered *post-assertion* (via user report with evidence), the assertion is flagged as "Gettier-Verified (GV)". While not a violation warranting user penalty, GV flags are displayed prominently on the assertion and contribute negatively to the user's "Epistemic Luck Index" (ELI). High ELI may limit visibility or trigger Justification Audits.
  2.4 **Category K-4: Lack of Belief.** Assertions where T & J are present, but B is absent (e.g., Asserting a true, justified fact one disbelieves). Treated as a Category K-1 violation (Ignorance). Claiming "But it was true!" is not a defense against the KNA.
  2.5 **Category K-5: Probabilistic Hedging & Predictions.**
      2.5.1 Assertions containing explicit probabilistic qualifiers ("probably," "likely," "I think," "chances are") are considered non-assertoric expressions of confidence and are **exempt from KNA enforcement**, provided they are not masking a categorical claim. Overuse may trigger a "Hedge Density Review" for bad faith.
      2.5.2 **Future-Tensed Assertions ("Predictions"):** Are treated as assertions *about the present state of justification*. (e.g., "Team X will win the championship" is interpreted as "My current evidence justifies me in believing Team X will win the championship").
      2.5.2.1 Moderation assesses whether the asserter *knew* (T, B, J) that their *current evidence justified that belief* at the time of posting. Outcome of the predicted event is irrelevant to initial KNA compliance.

  **Section 3: Context Sensitivity & Knowledge Attributions**
  3.1 Veritab acknowledges contextualist interpretations of knowledge attributions.
  3.2 **Operational Context Setting:**
      3.2.1 Users must select a "Knowledge Context Score" (KCS) from a dropdown menu (Casual, Informed, Expert) when posting in designated debate zones or using high-stakes knowledge verbs ("know," "certain").
      3.2.2 Moderation will evaluate the justification (J) condition relative to the selected KCS. Asserting "I know the cafe is open" with KCS=Casual (based on seeing lights on) is permissible. The same assertion with KCS=Expert requires justification demonstrating verified opening hours, staff confirmation, etc.
      3.2.3 Failure to select an appropriate KCS, or selecting a KCS demonstrably mismatched with the justification provided, constitutes a violation (K-1).

  **Section 4: Assertion Based on Testimony (ABT)**
  4.1 Assertions relying primarily on testimony (reports from others) require additional scrutiny.
  4.2 **ABT Moderation Protocol:**
      4.2.1 The asserter must demonstrate reasonable justification (J) for accepting the testimony as reliable at the time of assertion (e.g., source credibility assessment, corroboration attempts).
      4.2.2 All ABT claims are routed to the **Testimonial Epistemology Review Board (TERB)**.
      4.2.3 TERB evaluates:
          *   Asserter's demonstrated justification for trusting the source (SJP Appendix A.4).
          *   Source's own KNA compliance history (if a Veritab user).
          *   Source's known domain expertise.
          *   Presence of plausible defeaters the asserter ignored.
      4.2.4 TERB rulings can downgrade an assertion to K-2 (False Belief) if the source was wrong, or K-1 (Ignorance) if the justification for trusting the source was inadequate, regardless of truth value.

  **Section 5: Retraction & Amendment**
  5.1 Users are encouraged to retract assertions discovered to be non-knowledge.
  5.2 **Retraction Protocol:** Use the "Formal Retraction" tool. Standard retraction text includes: "I retract my assertion [quote] made on [date]. I currently lack sufficient justification to maintain it meets the Knowledge Norm."
  5.3 **Retraction ≠ Knowledge Admission:** Retracting an assertion **does not** automatically constitute an admission it violated the KNA at the time of assertion (e.g., new defeaters emerged, a Gettier situation was revealed). The original assertion's status is reassessed based on evidence *available at the time of assertion*.
  5.4 **Amendment Protocol:** For minor factual corrections where core justification remains sound, use the "Amendment" tool. The original post is marked as amended, displaying the corrected version. Amendments do not trigger penalty reassessment if the core justification (J) supporting the original assertion's *main claim* remains valid.
  5.5 Failure to retract an assertion demonstrably shown (via TERB or GTE verification) to have been non-knowledge at the time of posting constitutes a Category K-1 violation.

  **Section 6: Appeals Process**
  6.1 Appeals must cite specific Veritab guideline sections and provide new evidence pertaining to the state of Truth (T), Belief (B), or Justification (J) *at the time of the original assertion*.
  6.2 Outcome-based evidence (e.g., "But it turned out to be true later!") is inadmissible for K-1, K-2, or K-4 appeals. It is only relevant for GTE verification requests (2.3.2).
  6.3 TERB rulings can be appealed to the **Appellate Epistemology Board (AEB)**, requiring demonstration of TERB error in applying SJP or source reliability assessment.

  ---

  **Note on Philosophical Grounding:**

  This satire leans heavily on a strict, invariantist interpretation of the Knowledge Norm of Assertion (KNA), primarily associated with Timothy Williamson. The core tenets – that assertion requires knowledge, that truth and belief are necessary but insufficient, that justification must be non-gettiered, and that predictions are assertions about present justification – are presented as operational realities within the platform's rules.

  **Confidence & Liberties:**

  *   **Highest Confidence:** The core structure differentiating Truth, Belief, Justified Belief, and Knowledge (with Gettier as a problematic edge case) accurately reflects the KNA position. The treatment of hedging and predictions as outlined (K-5) is a direct, if bureaucratically exaggerated, consequence of taking the KNA seriously.
  *   **Moderate Confidence:** The TERB process and the rules around testimony (ABT) capture the *challenges* the KNA faces with testimonial knowledge, particularly the need for the asserter to have positive reasons to accept the testimony. However, the satire takes a liberty in implicitly favoring a reductionist view (where justification for trusting the source is paramount) over a non-reductionist view (where testimony might be a default source unless defeated). The platform's operationalization leans harder into reductionism than some KNA proponents might.
  *   **Lowest Confidence / Significant Liberty:** The "Knowledge Context Score" (KCS) mechanism (Section 3.2). While contextualism about knowledge attributions is a major response to the KNA, integrating it *alongside* a strict KNA framework is philosophically fraught. The satire presents it as a workable technical solution, but in reality, combining invariantist KNA with contextualist adjustments creates significant tension. Is the norm itself context-sensitive, or just the *attribution* of whether it's met? Veritab's solution is a bureaucratic band-aid that papers over this deep philosophical disagreement. This is the point most likely to be seen as a caricature by epistemologists, though it precisely satirizes the *practical* messiness of implementing any norm in a complex, variable-context environment. The KNA doesn't *require* this specific implementation; this is the satire taking a liberty to highlight the context problem.
