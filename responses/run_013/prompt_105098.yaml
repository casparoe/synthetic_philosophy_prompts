prompt: |-
  I'm in this epistemology seminar and we've been going back and forth about norms of assertion -- whether you should only assert what you know, or what's true, or what you believe, and what to do with all the weird cases where those come apart. Me and a friend were joking that it would be fun to see a social media company try to enforce the knowledge norm for real, and now I actually want the piece. Can you write a mock community-guidelines and moderation handbook, maybe 700-900 words, for a platform called something like Veritab or Assertsy, that has definately adopted the knowledge norm as its official posting policy? Deadpan corporate voice, numbered sections, no winking at the reader. It should get into the weeds: the appeals process for Gettiered posts; whether saying I had a true belief is a defense; what happens when someone asserts a prediction or a probabilistic hedge; how the platform handles context-sensitivity in knowledge attributions; a special review board for assertions made on the basis of testimony; and maybe a clause about retraction and whether retracting counts as conceding you didn't know. The humor should come from actually understanding the knowledge/truth/belief norm debate, so an epistemologist laughs rather than winces. No citations or reading lists, please -- I just want the satire to be philosophically literate.

  At the end, outside the handbook, add a short note on how confident you are in the philosophical claims the satire leans on, and single out the point you're least sure of -- e.g. whether the knowledge norm really has that implication or whether the whole thing is a cheap caricature. Also, if the piece takes liberties with any contested reading, flag that in the note.
