  The user wants a pantoum—a specific form with repeating lines that interlock between stanzas. They have clear requirements: four quatrains, 16 lines, with the second and fourth lines of each stanza becoming the first and third of the next. The last stanza should circle back to the first lines. They want two key repeating lines: one that's third-person, like the manual's criterion about duration or exceeding norms, and one first-person from someone who identifies with the diagnosis. These lines should blur over time so it's unclear which voice owns them, ending with the mourner claiming the opening line.

  They want to avoid certain words ("loop," "label," etc.), avoid direct quotes from manuals, and focus on showing rather than telling the concept. The poem should include an anniversary to tie into the theme of return. Accuracy is important—it should be recognizable to seminar peers—but also accessible for the poetry workshop. Finally, a summary line is needed to state what the poem claims about mutual change.

  I need to capture the tension between the fixed criteria and the shifting experience of grief. The pantoum's repetitive structure mirrors the looping effect: lines recur but change meaning as they move through stanzas. For the anniversary, I'll use "a year" to represent duration. The criterion line should focus on exceeding cultural norms, paraphrased simply. The "I" line should express personal identification with the diagnosis, evolving from discovery to ownership.

  The challenge is making the voices blend naturally. Starting with a clear manual-like line and a personal one, then letting them swap places. By the end, the mourner should reclaim the opening criterion. The summary must concisely state how classification and person co-evolve.

  I'll avoid jargon, keep language plain, and ensure the poem stands alone without explanation. The imagery should center on grief—weight, seasons, anniversaries—to ground the abstract concept. The summary will tie back to Hacking's idea without naming him, focusing on mutual transformation.
