  Here is a pantoum responding to your request:

  The measure set: beyond what mourning weighs.
  A year passed, yet the stone stays in my hand.
  The book names what exceeds the expected days.
  I turned the page and saw myself defined.

  A year passed, yet the stone stays in my hand.
  The shape required exceeds this season's mould.
  I turned the page and saw myself defined.
  This season's mould is cracked by what I hold.

  The shape required exceeds this season's mould.
  The text revises what the world allows.
  This season's mould is cracked by what I hold.
  The world allows less time than my grief claims.

  The text revises what the world allows.
  The book names what exceeds the expected days.
  The world allows less time than my grief claims.
  The measure set: beyond what mourning weighs.

  Summary: The act of measuring grief alters both the scale and the substance being measured, making mourner and manual co-authors of an evolving pain.

  **Structure & Intent Notes (for your reference, not part of the poem):**

  1.  **Form:** Strict pantoum structure (ABAB BCBC CDCD DADA) with the required repeats and closing stanza mirroring the opening.
  2.  **Voices Merging:**
      *   **Criterion Lines (Initial 3rd person):** "The measure set: beyond what mourning weighs." (Duration/Cultural Norm - "weighs" implies both heaviness and expectation) & "The book names what exceeds the expected days." (Exceeding Norm/Duration - "expected days" implies cultural norm).
      *   **Personal Lines (Initial 1st person):** "A year passed, yet the stone stays in my hand." (Anniversary & Persistent Grief) & "I turned the page and saw myself defined." (Discovery/Recognition).
      *   **Evolution:** By Stanza 3, the criterion line "The shape required exceeds this season's mould" is used as the 1st person's description ("This season's mould is cracked by what I hold"). The final recurrence of the opening criterion line ("The measure set: beyond what mourning weighs") becomes the mourner's concluding statement, claimed as their own experience.
  3.  **Key Concepts Embedded:**
      *   **Duration/Target:** "A year passed", "expected days", "less time".
      *   **Cultural Norm/Expectation:** "mourning weighs", "expected days", "season's mould", "world allows".
      *   **Exceeding Norm:** "beyond", "exceeds", "cracked", "less time than my grief claims".
      *   **Manual's Influence:** "The book names", "The text revises".
      *   **Recognition/Change:** "saw myself defined", "what I hold", "my grief claims".
      *   **Anniversary:** "A year passed".
      *   **Moving Target:** "The text revises what the world allows" & the entire progression showing the criteria/personal lines swapping roles and the mourner claiming the measure.
  4.  **Avoided Words:** No "loop", "label", "construct", "narrative". No quotation marks. Criteria paraphrased ("measure," "expected days," "exceeds," "world allows").
  5.  **Accuracy & Readability:** Reflects the core tension of PGD criteria (duration, exceeding cultural norm, mutual influence) without jargon. The structure enacts the looping effect. Should be recognizable to your seminar peers but accessible for the poetry workshop.
  6.  **Summary:** Explicitly states the mutual transformation requested.
