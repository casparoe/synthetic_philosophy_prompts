            - Round 3: 5 min
            - Round 4: 5 min
            Total 20 min for rounds.

        Then 30 min for debrief.

    - **Materials**:
        - Species cards (one deck per team, all decks identical). Each card has:
            Species name
            Young per adult (B)
            Survival rate (s)
            Welfare if die young (W_d)
            Welfare if survive (W_a)
        - Worksheet for each team to record:
            Round | Action | For each species: current adults, young produced, died, survived, welfare breakdown, total welfare for round, running total.
        - Calculator per team.

    - **Initial populations**: Set all species to 10 adults at the start of round 1.

    - **Round sequence**:
        Round 1: start with initial adults (10 per species).
        Round 2: adults from round 1's survivors.
        ...

    - **Total welfare calculation example for mayfly in round 1**:
        B=5000, s=0.001, W_d=-2, W_a=5, N=10
        Young = 5000 * 10 = 50,000
        Died = 50,000 * (1-0.001) = 50,000 * 0.999 = 49,950
        Survived = 50,000 * 0.001 = 50
        Welfare = (49,950 * -2) + (50 * 5) = -99,900 + 250 = -99,650

    - **Interventions example**:
