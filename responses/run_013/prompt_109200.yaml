  Here’s a refined, runnable simulation design based on your goals, with a focus on forcing students to confront the wild-animal-suffering implication through their own choices. The structure ensures minimal prep time and maximal ethical insight.

  ---

  ### **Simulation Design: "Habitat Welfare Ledger"**
  **Core Mechanics**  
  5 teams (3-4 students each) manage identical habitat plots over 4 rounds (each round = 1 breeding season). Teams start with the same species deck and initial populations. Each round, they pick an action and calculate welfare impacts.

  #### **Species Cards (Each Team Gets Identical Deck)**  
  *Include 5 species; ensure contrast between r-type (high birth/high mortality) and K-type (low birth/high survival). Example cards:*  

  | Species       | Young/Adult (B) | Survival Rate (s) | Welfare (Die Young) | Welfare (Survive) |
  |---------------|-----------------|-------------------|---------------------|-------------------|
  | **Mayfly** (r) | 3,000           | 0.001             | -3                  | +4                |
  | **Deer** (K)   | 1.5             | 0.8               | -2                  | +6                |
  | **Sparrow**    | 4               | 0.6               | -1                  | +5                |
  | **Frog**       | 1,000           | 0.01              | -2                  | +3                |
  | **Mouse** (K)  | 5               | 0.7               | -1                  | +4                |

  **Key Features:**  
  - **r-type (e.g., Mayfly):** Massively negative welfare from doomed offspring.  
  - **K-type (e.g., Deer):** Net positive welfare per generation.  
  - **Welfare Calculation:**  
    - **Per round:** `(Young × (1 - s) × Welfare_DieYoung) + (Young × s × Welfare_Survive)`  
    - **Ledger:** Running sum of welfare across rounds (tracked publicly).  

  #### **Round Structure (15 mins/round)**  
  1. **Action Phase (2 mins):** Teams pick one action:  
     - **Leave Alone:** Natural reproduction (use card values).  
     - **Develop:** Destroy habitat. All species go extinct. *Welfare = 0 for current/future rounds.*  
     - **Intervene:** Choose one:  
       - *Cull [species]:* Reduce adults by 50% (before breeding).  
       - *Feed [species]:* Double survival rate (s) for one round (max 1.0).  
       - *Contracept [species]:* Set birth rate (B) to 0 for one round.  

  2. **Calculation Phase (8 mins):**  
     - Teams update populations: `Next Gen Adults = (Current Adults × B × s)`  
     - Calculate welfare for the round (break down deaths/survivors).  
     - Update ledger.  

  3. **Board Update (5 mins):**  
     - Teams post their ledger totals and actions on a shared board.  

  #### **Starting Conditions**  
  - All species start with **10 adults** in Round 1.  
  - **Example Mayfly Round 1:**  
    - Young = 10 × 3,000 = 30,000  
    - Die Young = 30,000 × 0.999 = 29,970 → Welfare = 29,970 × (-3) = **-89,910**  
    - Survive = 30,000 × 0.001 = 30 → Welfare = 30 × 4 = **+120**  
    - **Net Welfare = -89,790** (Dominates the ledger if left alone).  

  ---

  ### **Predictable Problems & Handling**  
  1. **"Insects/Fish Don’t Suffer!"**  
     - *Response:* "For this simulation, we’re granting all species moral weight. We’ll discuss realism in debrief."  
     - *Why:* Forces engagement with the logic before disputing premises.  

  2. **"Mayfly Card Is Unfair!"** (From teams who "protected" habitat)  
     - *Response:* "All teams had identical decks. Why did your strategy produce this outcome?"  
     - *Why:* Highlights that the outcome stems from choices, not bad luck.  

  3. **Team vs. Team Comparisons:**  
     - *Scenario:* A "develop" team (ledger: -10k) gloats at a "leave alone" team (ledger: -300k).  
     - *Response:* "Why is your ledger less negative? Is development better for welfare?" *Let them debate without intervening.*  

  4. **Over-Optimistic Interventions:**  
     - *Scenario:* A team "feeds" mayflies, doubling survival. Result: more adults → more young → worse ledger.  
     - *Response:* "Check your ledger. Did feeding help or hurt net welfare?"  

  5. **Ethical Cheat Codes:**  
     - *Scenario:* A team clears habitat in Round 1. Their ledger is 0 (least negative).  
     - *Response:* "Is 0 better than -300k? Why?" (Tees up the debrief).  

  ---

  ### **Debrief Framework (30 mins)**  
  **Goal:** Make them articulate the implications of their ledger.  

  1. **Observation (5 mins):**  
     - "Which strategies produced the highest/lowest ledger? Why?"  
     - *Expected Insight:* "Leave alone" often has the *worst* ledger due to r-type suffering.  

  2. **Core Concepts (10 mins):**  
     - **Total Welfare ≠ Average Welfare:**  
       - *Ask:* "Did habitat protection increase the *number* of lives? The *average* welfare? The *total* welfare?"  
       - *Key:* r-types reduce total welfare by adding net-negative lives.  
     - **No "Ecosystem Welfare":**  
       - "Is there evidence of a ‘greater good’ in your ledger that isn’t just the sum of individual welfare?"  
     - **The Non-Identity Problem:**  
       - "If a mayfly egg dies young, who is harmed? Does the ledger assume creating a net-negative life is bad? Why?"  

  3. **Wild-Animal Suffering Implications (10 mins):**  
     - "Did any of you *accidentally* reduce suffering? How?" (E.g., developing land).  
     - "Is ‘habitat destruction reduces suffering’ a valid argument? Why is it unsettling?"  
       - *Tension:* Obligation to protect ecosystems vs. preventing suffering.  

  4. **Caveats (5 mins):**  
     - "Two unstable assumptions:  
       1. We can’t measure wild animal welfare in real life.  
       2. I invented these numbers. What if r-types have positive average welfare?"  
     - "One thing this *can’t* simulate: **Uncertainty.** Real conservation involves unknown outcomes, unlike our fixed numbers."  

  ---

  ### **Logistical Notes**  
  - **Materials:** Decks (laminated cards), calculators, shared ledger board.  
  - **Time:**  
    - Setup: 10 mins.  
    - Simulation: 60 mins (4 rounds × 15 mins).  
    - Debrief: 30 mins.  
  - **First-Run Fixes:**  
    - Pre-calculate example rounds for mayfly/deer to show the math.  
    - Assign a "calculator" role per team to speed up math.  

  This simulation ensures students experience the tension between conservation and suffering reduction firsthand. By making them complicit in the outcome ("you chose to protect, now stare at -200k"), the wild-animal-suffering argument lands with moral weight, not as an abstract debate.
