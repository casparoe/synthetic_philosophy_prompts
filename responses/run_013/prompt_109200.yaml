    - **Insects don't count**: Some might argue that we shouldn't count insects because they don't feel pain.
        - Handling: In the simulation, we are counting them. But note in the debrief: the parameters are made up and the question of which animals are sentient is open.

    - **What if a team intervenes to reduce the mayfly?** For example, they might cull or contracept the mayfly. Then their ledger might be less negative. That's a valid outcome. It shows that interventions can reduce suffering.

    - **What if a team feeds the mayfly?** Then they increase the survival rate, which might lead to more adults and even more young, making the negative even worse? Or if they feed a K-species, it might help. Let them experiment.

    - **Two teams pick different actions and then compare**: This is good. Let them see the consequences.

    - **A team might try to clear in round 1**: Then their ledger is zero for all rounds. They might have the best (least negative) ledger. But then we miss the point? Not really: it shows that destroying the habitat prevents the negative lives.

    - **A team might clear late**: Then they have some negative rounds and then zero. They might compare to a team that cleared early.

  ## Step 8: What the Activity Can't Reproduce

    The activity cannot reproduce the uncertainty in real-world measurements and the complexity of ecosystems. In particular:

        - We assume we know the welfare numbers for wild animals, but we don't.
        - We assume the parameters are fixed and known, but in reality they are not.
        - We ignore interactions between species (e.g., predation, competition) because each species is independent.

    You will have to supply: the fact that in real ecosystems, species are interdependent, and removing one might affect others. Also, the welfare numbers are speculative.

  ## Implementation Details

