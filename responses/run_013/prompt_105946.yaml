answer: |-
  ### Decision Procedure for the Committee

  Below is a step-by-step decision procedure designed to be run live in the room. It ensures alignment between votes and recorded reasons, handles abstentions, and minimizes the risk of appeals. The procedure prioritizes clarity, efficiency, and adherence to your charter.

  #### **Step-by-Step Procedure**
  1. **Vote on Each Criterion (C1, C2, C3)**:
     - **Question**: "Has the member's conduct met Criterion [X]?"  
     - **Voting**: Secret ballot or show of hands. Members vote "Yes" (pass), "No" (fail), or "Abstain".  
     - **Outcome**: A criterion passes if it receives **≥6 votes in favor** (two-thirds of 9 members). Abstentions do not reduce the threshold (always need 6 "Yes" votes).  
     - **Chair's Role**: Announce the result immediately: "Criterion [X] passes/fails with [number] votes in favor, [number] against, and [number] abstentions."  
     - **Recording**: Votes and outcome for each criterion are recorded in the decision document.

  2. **Vote on Overall Breach (B)**:
     - **Question**: "Has the member's conduct breached the charter?"  
     - **Voting**: Same as above.  
     - **Outcome**: Breach passes if **≥6 votes in favor**.  
     - **Chair's Role**: Announce the result. If breach passes, proceed to Step 3. If it fails, skip to recording (no decisive criterion needed).

  3. **Identify the Decisive Criterion** (Only if breach passes):  
     - **Eligible Criteria**: Only criteria that **passed** (≥6 votes) are considered. Failed criteria are excluded.  
     - **Question**: "For members who voted 'Yes' on the breach: Which **single passed criterion** was most decisive in your judgment? Choose one."  
     - **Process**:  
       - Breach supporters (≥6 members) vote by secret ballot on the decisive criterion from the passed options.  
       - Each voter selects **one** criterion. Abstentions or invalid votes are discarded.  
       - The criterion with the **most votes** wins.  
     - **Tiebreak**: If tied, the chair breaks the tie by selecting the criterion they deem most fundamental (justified briefly).  
     - **Chair's Role**: Announce the decisive criterion. If no passed criteria exist (rare), adjourn for legal advice (see "Misfires" below).

  4. **Record the Decision**:  
     - **Document**:  
       - Votes for each criterion (including abstentions) and whether passed/failed.  
       - Vote for overall breach and outcome.  
       - If breach passed: "The decisive criterion was [X], as determined by a vote of the members who found a breach."  
     - **Surviving Appeal**: Explicitly tie the decisive criterion to the breach supporters' vote. Avoid implying unanimity.

  ---

  ### **Case Simulations**
  **Case 1: Each Criterion Passes (7 votes), Breach Fails (3 votes)**  
  - **Procedure**:  
    - C1, C2, C3 each pass (7/9 votes).  
    - Breach vote: 3 in favor, 6 against → fails.  
  - **Recording**:  
    > "Criterion 1 passed (7 votes). Criterion 2 passed (7 votes). Criterion 3 passed (7 votes). The overall breach did not meet the required majority (3 votes in favor). No breach found."  
  - **Why it Works**: No decisive criterion needed. Vote patterns align with the outcome.

  **Case 2: One Criterion Fails, Breach Passes (6 votes)**  
  - **Setup**: C1 fails (5 votes), C2 passes (7 votes), C3 passes (8 votes). Breach passes (6 votes).  
  - **Procedure**:  
    - Only C2 and C3 are eligible (both passed).  
    - Breach supporters (6 members) vote on decisive criterion:  
      - Suppose 4 vote for C2, 2 for C3.  
    - Chair announces C2 as decisive.  
  - **Recording**:  
    > "Criterion 1 failed (5 votes). Criterion 2 passed (7 votes). Criterion 3 passed (8 votes). The overall breach passed (6 votes). The decisive criterion was Criterion 2, as determined by a vote of the 6 members who found a breach."  
  - **Why it Works**: The decisive criterion reflects the breach supporters' reasoning and excludes the failed criterion.

  ---

  ### **Handling Abstentions (Lay Members on Technical Criterion)**
  - **Scenario**: Lay members abstain on technical criterion (e.g., C2) but vote on breach.  
  - **Procedure**:  
    - **C2 Vote**: Lay members abstain. Practitioners vote.  
      - Example: 6 practitioners vote; 4 vote "Yes", 2 "No".  
      - Outcome: Fails (needs 6 "Yes" votes; abstentions don’t reduce the threshold).  
    - **Breach Vote**: All 9 members vote.  
      - Example: Passes with 6 votes (including lay members).  
    - **Decisive Criterion**: Only passed criteria (e.g., C1 or C3) are eligible. Lay members who supported breach **vote** on decisive criterion (they can assess passed criteria holistically).  
  - **Recording**:  
    > "Criterion 2 failed (4 votes in favor, 2 against, 3 abstentions). [...] The decisive criterion was [X]."  
  - **Why it Works**: Abstentions are transparently recorded; decisive criterion is based solely on passed criteria and breach supporters' input.

  ---

  ### **Where the Procedure Misfires or Falters**
  1. **No Passed Criteria but Breach Passes** (e.g., all criteria fail, but breach gets 6 votes):  
     - **Problem**: No eligible decisive criterion. Charter requires naming one.  
     - **Solution**: Chair adjourns the meeting for legal guidance. Do not proceed.  
     - **Mitigation**: Chair reminds members pre-vote: "If you support breach, you must be able to attribute it to at least one passed criterion."

  2. **Breach Supporters Reject All Passed Criteria**:  
     - Rare; procedure forces them to choose one passed criterion. If they refuse, their vote is discarded in decisive vote (but breach still stands).

  3. **Tie in Decisive Criterion Vote**:  
     - Chair’s tiebreak may feel arbitrary. Mitigate by requiring a brief justification for the tiebreak.

  4. **Minority Not Bound to Reasons**:  
     - The minority (≤3 against breach) are **not** bound to the decisive criterion. Only breach supporters vote on it. The decision document clearly states the decisive criterion reflects the breach supporters’ vote, not the full committee. Protects minority from endorsing reasons they reject.

  ---

  ### **Confidence Assessment**
  - **Overall Confidence**: **High** (8/10). The procedure resolves vote-reason misalignment, handles abstentions, and avoids minority coercion.  
  - **Least Confident Step**: **Identifying the decisive criterion** when breach passes. Risk: Breach supporters may split votes evenly or resist choosing one criterion. Mitigation: Chair emphasizes pre-vote that each must select a single passed criterion.  

  This procedure is practical for 90-minute meetings, ensures auditability, and minimizes appeal risks. Test it in a mock session to refine timing and clarity.
