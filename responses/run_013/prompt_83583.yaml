prompt: |-
  So I'm putting together an application for a summer philosophy program at the university near me, and one of the requirements is a short research proposal — like a page or two, on a question I'd genuinely want to work on for the six weeks of the program. I've been reading alot around in ethics and I keep running into hedonism, the view that the only thing good for you is pleasure and the only thing bad is pain. What's bugging me is an objection my teacher calls the heterogeneity problem: the pleasure of finally getting a math proof to work, the pleasure of a hot shower, of hearing a song you love, of laughing at something dumb with your friends — try to say what they all have in common and you can't, there's no single feeling they share. Most people I've talked to treat this as a knockout blow. But some philosophers apparently think pleasures do share something, just not a feeling — like being wanted or liked rather than felt a certain way — and I can't tell if that actually helps or if it just turns hedonism into "whatever you happen to like is good," which sounds kind of empty or circular to me. My friend Dana says the whole thing is a word game, which, ok, is basically the thing I'm trying to figure out.

  So here's my half-formed idea and I'd like you to turn it into an actual proposal: what if hedonism doesn't need all pleasures to share one feature, any more than chess and solitaire and tag need to share one feature to all be games? Like Wittgensteins family resemblance thing, where a concept holds together through overlapping similarities instead of one common core. The question I want to pose is roughly: can hedonism survive the heterogeneity problem by treating pleasure as a family resemblance kind — and if it can, does it still deserve to be called hedonism, or has it quietly turned into a different theory (desire-satisfaction, or some pluralism about the good) that just kept the name? Please write the proposal so it (a) states the question precisely enough that it has a determinate answer, (b) explains why the standard responses — there is one common feeling, there isn't so hedonism is dead, it's about wanting not feeling — leave it open, (c) says what I'd actually do for six weeks, keeping in mind I can't run experiments or survey people, so it has to be argument-based, like pressure-testing the family resemblance analogy against tricky cases and seeing where it breaks, and (d) explains why that approach rather than the obvious alternatives, e.g. why not just do a conceptual analysis of pleasure and be done. Also give me an honest bit on what would count as the project failing, and whether this is realistically a six-week thing or way too big, because I definately overpromise. Oh, and please don't put in a bibliography or any see-Smith-2019 type citations, I'll track down sources myself and I don't want to cite anything I haven't actually read. It's just an application, so keep it readable, not stiff.
