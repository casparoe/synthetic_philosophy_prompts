answer: |-
  The moral equality of combatants (MEC) doctrine is a core, contentious principle in just war theory and the law of armed conflict (LOAC). Your struggle to reconcile it with your moral instincts is shared by many serious scholars (the "revisionists" your brother dismisses) and practitioners. Let's dissect the doctrine, its claims, its limits, and the genuine points of disagreement.

  **1. What the Moral Equality of Combatants Doctrine Actually Asserts:**

  The traditional MEC doctrine, associated primarily with Michael Walzer's *Just and Unjust Wars* (1977), makes the following interconnected claims:

  *   **Jus in Bello Independence:** The moral (and legal) rules governing conduct *within* war (*jus in bello*) are independent of the justice of the cause for going to war (*jus ad bellum*). A war can be unjustly initiated but fought justly, or justly initiated but fought unjustly.
  *   **Symmetry of Permissions and Prohibitions:** Soldiers on both sides of a conflict have the *same* moral permissions and obligations concerning their conduct *during* hostilities. This includes:
      *   **Permission to Kill:** Soldiers on both sides are morally permitted (indeed, it is their role) to kill enemy combatants, provided they adhere to the rules of distinction, proportionality, etc.
      *   **Liability to Be Killed:** Soldiers on both sides are legitimate targets and can be killed by enemy combatants without the killer committing murder (again, assuming adherence to *jus in bello* rules). They are deemed "morally liable to attack" simply by virtue of being combatants in the opposing force.
  *   **Absence of *Jus ad Bellum* Culpability for Combatants:** Individual soldiers fighting *in* the war are **not morally culpable** *for the war itself* or for the *mere act of fighting enemy combatants* according to the rules. Their culpability stems only from violations of *jus in bello* rules (war crimes). The moral responsibility for the *justice of the war* lies with the political leaders who initiated it.

  **2. What the Doctrine Does NOT Assert:**

  *   **Moral Equivalence of Causes:** MEC **does not claim** that the *causes* of the warring parties are morally equal. It explicitly acknowledges that one side may be fighting a just war (*jus ad bellum* justified) and the other an unjust war (*jus ad bellum* unjustified).
  *   **Moral Justification for *Jus ad Bellum* Injustice:** MEC **does not assert** that fighting for an unjust cause is morally *good* or *neutral*. It only asserts that *within the context of fighting*, the *act* of killing enemy combatants according to the rules is morally *permissible* for the unjust combatant, just as it is for the just combatant.
  *   **Absolution from All Moral Scrutiny:** MEC **does not imply** that soldiers bear *no moral responsibility whatsoever*. They are responsible for obeying *jus in bello* and can be culpable for war crimes. Furthermore, revisionists argue they *do* bear responsibility for participating in an unjust war, even if fighting "cleanly."
  *   **Denial of Asymmetry in Other Domains:** MEC is specifically about the *combatant's role* in killing other combatants. It doesn't deny that soldiers on the just side might have higher morale, greater moral justification for self-defense, or different political responsibilities.

  **3. The Core Disagreement: Revisionist Challenge**

  The "revisionists" (like Jeff McMahan, David Rodin, Cecile Fabre) fundamentally challenge the traditional MEC, particularly the **Symmetry of Permissions and Liability**. Their core argument rests on the **deep connection between *jus ad bellum* and *jus in bello* at the moral level:**

  *   **The Liability Argument:** Revisionists argue that moral liability to lethal attack must be based on **moral responsibility for an unjust threat**. A just combatant (defending against aggression) is *not* morally responsible for an unjust threat; they are posing a *justified* threat in self/other-defense. An unjust combatant (participating in aggression) *is* morally responsible for an unjust threat.
      *   **Conclusion:** Therefore, unjust combatants **lack the moral permission to kill** just combatants (who are not liable), while just combatants *do* have the permission to kill unjust combatants (who *are* liable). The permissions are *asymmetrical*.
      *   **Corollary:** Unjust combatants are **not morally liable to be killed** *by their own moral standards* (since killing non-liable individuals is wrong), though they are legally liable and factually vulnerable.
  *   **The Culpability Argument:** While acknowledging mitigating factors (duress, ignorance - especially for conscripts), revisionists argue that **participation in an aggressive war is, in principle, a wrongful act.** Soldiers *do* bear *some* moral responsibility for choosing to fight for an unjust cause, even if fighting "by the rules." This culpability might be lesser than that of leaders, but it exists. Merely following orders or national law does not absolve one of *moral* responsibility for contributing to serious injustice.

  **4. Addressing Your Dilemmas & Brother's Position:**

  *   **Your Brother's Position ("Settles the Matter"):** He represents the traditional Walzerian view. His core point is the **practical separation of roles**: the politician's *jus ad bellum* responsibility vs. the soldier's *jus in bello* responsibility. He emphasizes the **permission to kill** granted equally to combatants by the war convention, regardless of cause, provided they fight cleanly. He likely sees the revisionist view as impractical ("armchair"), potentially paralyzing for soldiers, and undermining the protective function of *jus in bello* by making its application depend on contested *jus ad bellum* judgments in the fog of war.
  *   **Your Instinct & the Revisionist Challenge:** Your instinct that the unjust combatant is "doing something worse" morally, even if fighting cleanly, aligns with the revisionist critique. They agree the *act of killing* itself is morally different: one is a justified act of defense (just combatant), the other is an unjustified act of aggression (unjust combatant), even if both are legally permitted under LOAC.
  *   **Resolving the Dilemmas:**
      *   **"Licenses Aggression":** Traditional MEC doesn't *license* aggression; it condemns it at the *jus ad bellum* level (blaming leaders). However, it *does* morally license the *soldier's participation* in that aggression (killing enemy combatants according to rules). Revisionists argue this *is* morally problematic licensing.
      *   **"Every Soldier is a Murderer":** Revisionists **do not** necessarily conclude this. They distinguish:
          *   **Moral Wrongdoing vs. Culpability:** Fighting as an unjust combatant is *wrongful* (lacks permission to kill), but the *culpability* (blameworthiness) of the individual soldier varies massively (volunteer vs. conscript, knowledge, duress). A conscript under duress may commit a wrongful act but bear little or no *culpability* – they are not a "murderer." Only those fully culpable for knowingly and willingly participating in aggression might approach that level of moral condemnation. The *act* of killing a just combatant is wrongful homicide, but the *actor* may not be fully culpable.

  **5. Where the Genuine Disagreement Lies (Beyond Equivocation):**

  The argument isn't *just* verbal, though terms like "permission" and "liability" need careful definition. The **core, genuine disagreement** is **ontological and foundational:**

  *   **The Nature of Morality in War:** Traditional MEC sees the war convention (with its symmetrical permissions) as creating a distinct moral sphere ("the morality of war") separate from ordinary morality. Killing combatants is a morally neutral act *within the institution of war*. Revisionists apply fundamental principles of ordinary morality (self-defense, liability based on responsibility for unjust threat) directly to the context of war. They reject the idea that "war is a different moral universe."
  *   **The Basis of Liability:** Traditional MEC bases liability primarily on **status** (being a combatant). Revisionists base liability primarily on **conduct and moral responsibility** (posing an unjust threat).
  *   **The Priority of Practicality vs. Moral Principle:** Traditionalists prioritize the **practical necessity** of clear, symmetrical, and enforceable rules for regulating slaughter and protecting civilians. They argue revisionism is unworkable on the battlefield. Revisionists prioritize **moral coherence and truth**, arguing that practical law (LOAC) can still function *as law* (based on status) even if it diverges from the underlying morality (based on conduct/responsibility). They aim for a morally consistent *theory*.

  **Conclusion & Your Path Forward:**

  The moral equality of combatants doctrine, in its traditional form, asserts symmetrical **permission to kill** enemy combatants, symmetrical **liability to be killed**, and an absence of *jus ad bellum* **culpability** for soldiers, based on the independence of *jus in bello* from *jus ad bellum*.

  Your brother is correct that *within this traditional framework*, the justice of the cause doesn't change the soldier's permissions or liability *during combat*. However, the revisionists convincingly argue that this framework **is morally flawed at its foundation**. They contend that *jus ad bellum* fundamentally determines the moral permissibility of killing combatants: unjust combatants **lack the moral permission to kill** just combatants and are **morally liable to be killed**, while the reverse is not true. The symmetry is broken at the deepest moral level. The unjust combatant fighting cleanly *is* doing something morally worse – participating in wrongful aggression – even if his individual culpability is mitigated.

  The genuine disagreement isn't equivocation; it's a clash between a view prioritizing the functional regulation of war through symmetrical rules (Walzer) and a view insisting that the deep morality of killing must be consistent with self-defense principles, making permissions and liability inherently asymmetrical (McMahan et al.).

  **For your seminar paper and commission application:** Acknowledge the powerful practical and legal reasons for the traditional LOAC symmetry. Grapple seriously with the revisionist critique – it exposes a profound tension between the functional law of war and the underlying morality of killing. Your role as a legal officer will require upholding LOAC's symmetrical *jus in bello* rules, while understanding that these rules represent a pragmatic settlement that may not perfectly align with the deepest moral truth of the situation. The challenge is navigating this tension professionally and ethically.
