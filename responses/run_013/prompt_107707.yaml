prompt: |-
  I'm a second-year PhD student working on vagueness — mostly the metaphysics side, though my supervisor keeps telling me I need to read more of the linguistics — and I've been going back and forth alot with a friend in the department about a puzzle we cooked up over coffee and can't get past. She's a supervaluationist; I'm more sympathetic to the epistemicist line, though honestly I wobble. The puzzle is this. Imagine a machine that settles borderline cases by sampling an admissible precisification at random and then acting on it: ask it whether a given patch is red, and it flips a coin over the range of legitimate ways you could sharpen 'red', then answers. Run it on the very same borderline patch twice and you might get 'red' once and 'not red' the next time. She says that's exactly what you'd expect if there's no fact of the matter — the machine is being perfectly consistent with a question that has no single answer, and the variation is just the indeterminacy showing through. I say that if the machine can give different answers to the same question on the same evidence, then at most one of those answers can be tracking anything, and the flip is a guess — which is just what I'd expect if there is a fact of the matter that neither the machine nor we can get at. We've been stuck here for weeks.

  So what I want from you is a dialogue — a proper one, two people, both of them sharp, neither one a strawman — between an epistemicist and a supervaluationist that starts from this machine case and actually goes somewhere. Each reply should take up what the other just said rather than delivering a set speech past them. I want them to press each other on the machine, on the 'definitely' operator and higher-order vagueness, and on what either view says about the arbitrariness of a legal or medical threshold that gets stipulated in a statute or a protocol — does stipulation create a sharp line, or just hide a vague one, and does the answer differ between the two views? At least one of them should have to give ground or land a real objection, even if the other has a comeback.

  Don't hedge your way out of it: take a definite line on where the argument actually bites, make a choice about who has the better of it and why, rather than laying out both sides evenly and leaving me to pick. And at the end, in a sentence or two, flag where your dialogue leans on a reading of one of the two views that's genuinely contested, so I know what I'd be buying into if I quoted it in my chapter. British English please.
