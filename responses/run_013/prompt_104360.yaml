prompt: |-
  I have been teaching Good's theorem on the value of information in my decision theory seminar, and I have become puzzled by a tension I cannot resolve. Good's theorem shows that information can never have negative value, so how can we make sense of the fact that people sometimes deliberately avoid information — for example, patients who decline genetic tests, or investors who refuse to check their portfolio? Surely if the theorem were true, such behaviour would be straightforwardly irrational. I would like you to explain this apparent tension. Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of the question. American English, please.
reasoning: |-
  Okay, the user is teaching Good's theorem in a decision theory seminar and is puzzled by why people avoid information when the theorem states information has non-negative value. They want me to resolve this tension. 

  First, I need to recall Good's theorem clearly: it states that acquiring information never has negative expected value under rational decision-making with Bayesian updating. The key point is the "expected" part—before obtaining the information, its value is calculated based on current beliefs. 

  Now, why would people avoid information? The examples given are patients declining genetic tests and investors not checking portfolios. The answer must lie in psychological or hidden cost factors the theorem doesn't capture. 

  Let me break this down: The theorem assumes rational actors only care about maximizing utility from outcomes. But humans experience emotions like anxiety or regret. For instance, a genetic test might cause distress regardless of the result, or an investor might feel compelled to make impulsive changes after seeing portfolio dips. These are psychological costs outside the model. 

  Also, the theorem treats information as free, but real-world information often has hidden costs: time, money, attention, or opportunity costs. Declining a test might save resources for more pressing needs. 

  Another angle: people might rationally avoid information that could constrain their future choices. For example, not knowing a genetic risk might preserve hope or prevent mandatory disclosures. The theorem doesn't account for how information affects autonomy or emotional states. 

  The user likely needs this for teaching, so I should emphasize that Good's theorem holds under idealized rationality, but human behavior incorporates additional utility dimensions. The resolution isn't that the theorem is wrong but that its assumptions don't fully map to real-world psychology and costs. 

  I'll structure the response by first stating the bottom line: the tension arises because people factor in psychological costs and hidden burdens ignored by the theorem. Then I'll explain the idealized assumptions versus real-world complexities like emotional disutility, irrational choices under distress, and non-instrumental impacts of information. 

  The tone should be academic but accessible, using terms like "ex-ante" and "disutility" where appropriate. No jargon overload though—this is for a seminar, so clarity is key. 

  Hmm, I should also preempt follow-up thoughts: Could avoiding information ever be rational under the theorem? Only if the cost of acquiring it exceeds benefits, but psychological costs aren't in the theorem's calculus. That's the core disconnect. 

  Finally, I'll avoid restating the question per instructions and dive straight into the resolution. American English, concise. Got it.
answer: |-
  Good's theorem holds that information has non-negative *instrumental* value in ideal rational choice, but people avoid information due to psychological costs, irrational responses, or hidden burdens that fall outside the theorem's assumptions.  

  The theorem demonstrates that, *ex-ante*, the expected value of acquiring free information is non-negative for a perfectly rational Bayesian agent focused solely on maximizing utility from material outcomes. It assumes:  
  1. The agent will update beliefs correctly (Bayesian updating).  
  2. The agent will choose optimal actions *after* receiving the information.  
  3. There are zero costs to obtaining or processing the information.  
  4. Utility depends *only* on outcomes, not on beliefs or knowledge states themselves.  

  Real-world information avoidance occurs precisely because these assumptions often fail:  
  - **Psychological costs**: Information can inflict direct emotional disutility (e.g., anxiety from a positive genetic test, regret from seeing portfolio losses), reducing net welfare irrespective of actions taken.  
  - **Self-binding against irrationality**: Agents may know they’ll act impulsively (e.g., panic-selling stocks after seeing a loss), so avoiding information prevents suboptimal decisions the theorem assumes won’t occur.  
  - **Hidden costs**: Information consumes attention, time, or cognitive resources—opportunity costs the theorem ignores.  
  - **Non-instrumental value**: Beliefs themselves affect utility (e.g., hope from uncertainty), so information can reduce well-being even if it improves decision quality.  

  In short, Good’s theorem addresses information’s value for *outcome optimization*, while human behavior incorporates information’s impact on *emotional states, self-control, and cognitive burdens*. Avoiding information can be rational when these factors outweigh its instrumental benefit.
