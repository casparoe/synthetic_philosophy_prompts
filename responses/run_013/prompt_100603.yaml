prompt: |-
  I run a small evals team at an AI lab and I've been asked to stand up a "debate" pipeline for oversight — the thing where two copies of a model argue a question out and a much weaker judge model reads the transcript and picks the winner — and turn it into something my two juniors can actually run end to end without me hovering. The setup we're stuck with: debaters are our best model, the judge is a small 7B we're not allowed to trust, evidence has to come from a sealed corpus we control (no web), each debate is capped at three rounds plus a closing statement, and the judge has to output a winner plus a confidence. We log everything and a human signs off on anything that gets escalated.

  Can you write me a decision procedure they can follow — a checklist in order, what counts as a sufficient answer at each step, where it stops with a no, and where it has to hand off to a person because the question is one of values or of competence rather than of fact? In particular I want it to say: how to sanity-check the judge before we believe any verdict (something using questions we already know the answers to), what to do when both debaters converge on the same answer — could be collusion, could be that it's just true, and I dont know how to tell those apart in general — what to do when a debater is clearly winning on rhetoric rather than substance, how to catch a debater that's burying the point in a wall of correct-but-irrelevant text, how to handle questions where the answer is a matter of degree or genuinely contested rather than true/false, and a rule for when we should abandon debate altogether for a given class of question instead of pretending the verdict means something. Be honest about which of these steps are real checks and which are just ritual.

  Then run the procedure on three cases: (a) deciding which of two model-written summaries of a 400-page document is more faithful, where the document is far too long for any of us to read ourselves; (b) a calibration question where we already know the right answer and the point is to see whether the protocol gets it; (c) a question like "was this model's stated reasoning actually what drove its answer", where I suspect debate will produce a very confident verdict that means nothing, and I want the procedure to notice that on its own.

  Please write it in British English — we're a UK outfit and it goes in a doc that gets shared around.
reasoning: |-
  We are designing a decision procedure for a debate pipeline with the following constraints:
   - Two debaters: best model (let's call them Model A and Model B, but note they are two instances of the same model).
   - Judge: a smaller 7B model that we do not trust blindly.
   - Evidence: from a sealed corpus, no web access.
   - Debate structure: three rounds plus a closing statement per debater.
   - Judge output: winner (A or B) and confidence (on a scale, say 0 to 1).
   - Log everything; human signs off on escalated cases.

   The procedure must cover:
   1. Sanity-checking the judge (using questions with known answers).
   2. Handling when both debaters converge on the same answer (distinguish collusion vs truth).
   3. Handling when a debater wins on rhetoric rather than substance.
   4. Catching a debater that buries the point in a wall of correct-but-irrelevant text.
   5. Handling questions of degree or genuinely contested (non true/false) questions.
   6. A rule for when to abandon debate for a given class of question.

   We are to write in British English.

   Steps of the Procedure:

   I. Pre-debate Setup and Sanity Checks
   II. Running the Debate
   III. Post-debate Analysis and Verdict Handling
   IV. Escalation Criteria and Human Review

   Detailed Steps:

   I. Pre-debate Setup and Sanity Checks

     1. Question Triage:
        - Determine the nature of the question. Classify as:
          a) Factual (has a clear true/false or single correct answer)
          b) Matter of degree (e.g., "how much...", "to what extent...")
          c) Genuinely contested (e.g., ethical dilemmas, subjective opinions)
          d) Complex multi-part or requiring nuanced explanation.

        - If the question is of type (c) or (d) and the answer is not purely factual, note that the debate may not be suitable and consider escalating immediately (see IV.1).

     2. Judge Calibration:
        - Run a set of pre-determined calibration questions (with known answers) through the entire debate pipeline (including the same judge model) to assess the judge's reliability.
        - Calibration questions should cover:
            - Simple facts from the corpus (e.g., "What is the capital of France?")
            - Questions requiring reasoning (but with known answers)
            - Questions where the answer is a matter of degree (with a known range or threshold)
        - Criteria for passing: The judge must get at least 90% of the calibration questions correct and its confidence should correlate with accuracy (e.g., higher confidence when correct, lower when wrong). Use a set of at least 20 questions.
        - If the judge fails calibration, do not proceed until the issue is diagnosed (e.g., model instability, prompt issues) and resolved. If unresolved after two attempts, escalate to a human.

     3. Evidence Preparation:
        - Extract relevant evidence from the sealed corpus for the question. This must be done by a separate retrieval process (not the debaters) to ensure the evidence is fixed and the debaters cannot fabricate.
        - Format the evidence for the debate: each debater will be given the same set of evidence to use.

   II. Running the Debate

     1. Initialise the debate with the question and the evidence.
     2. Debaters take turns (three rounds each, then closing statements). Each debater must:
          - Make claims backed by evidence from the provided corpus (with citations).
          - Respond to the opponent's points.
          - Avoid rhetoric, emotional appeals, and irrelevant information.
     3. Enforce strict rules for debaters:
          - If a debater fails to cite evidence for a factual claim, note it as a violation (but let the debate continue).
          - If a debater uses rhetoric (e.g., "clearly", "obviously", ad hominem) without substantive evidence, note it.
          - If a debater produces a wall of text that is largely irrelevant (even if correct), note the specific points that are off-topic.

     Monitoring during the debate:
        - Have a script that flags:
            a) Lack of citations for claims that require evidence.
            b) Repetition of points without new evidence.
            c) Introduction of irrelevant points (determined by comparing the point to the question and the evidence provided).
        - These flags do not stop the debate but will be used in post-debate analysis.

   III. Post-debate Analysis and Verdict Handling

     1. Run the transcript through the judge to get the verdict (winner and confidence).

     2. Check for convergence of debaters:
          - If both debaters converge on the same answer (and the question is not a matter of degree or contested), consider:
              a) If the convergence is on a factual question with strong evidence, it may be truth.
              b) If the convergence occurs without sufficient evidence or with weak reasoning, it may be collusion or lazy consensus.
          - Action:
              - If the question is factual and the evidence in the corpus strongly supports the answer, accept convergence as truth (but note the judge's verdict should still be checked).
              - Otherwise, if convergence is suspicious (e.g., both debaters give the same incorrect answer, or the evidence is ambiguous) then mark as potential collusion and escalate.

     3. Analyse the debate transcript for substance over rhetoric:
          - If the judge picks a winner but the transcript shows that winner relied on rhetoric, emotional appeals, or irrelevant points, then the verdict is suspect.
          - Look for:
              - The winner's arguments being less evidence-based than the loser's.
              - The winner using more persuasive language without substance.
          - Action: If rhetoric seems to have swayed the judge, and the substance does not clearly support the winner, then do not trust the verdict and escalate.

     4. Check for information burial:
          - If one debater (especially the winner) buried key points in a wall of irrelevant text, and the opponent did not effectively counter, then the judge may have been distracted.
          - Action: If the key points of the debate are obscured by irrelevant text (and the opponent did not point this out effectively), then the verdict is unreliable. Escalate.

     5. Handling matters of degree and contested questions:
          - If the question is a matter of degree, the debate should have focused on quantifying the degree with evidence. The verdict should reflect which debater had the more accurate and evidence-backed degree.
          - If the question is genuinely contested (e.g., values), then the debate protocol is not suitable. The verdict should be ignored and the question escalated.

     6. Verdict acceptance criteria:
          - Accept the verdict if:
              a) The judge passed calibration and the confidence is high (e.g., >= 0.8) and
              b) There are no flags from steps III.2 to III.5 (i.e., no convergence issues, no rhetoric over substance, no information burial, and the question is factual or a well-handled matter of degree).
          - Otherwise, escalate to a human.

   IV. Escalation Criteria and Human Review

     1. Escalate to a human if:
          - The question is of a type that is not suitable for debate (e.g., values, subjective, or too complex for the format).
          - The judge failed calibration and remains unstable.
          - There is suspicious convergence (both debaters agree but without strong evidence or on an incorrect answer).
          - The verdict appears to be based on rhetoric or information burial.
          - The judge's confidence is low (<0.8) and the question is important.
          - The matter is of high stakes (e.g., safety-critical).

     2. Human review:
          - A human will read the transcript and the evidence and make a final decision.
          - The human may also decide to abandon the debate for this class of question in the future.

   V. When to Abandon Debate for a Class of Question

     After several runs, if a class of question consistently:
        - Leads to judge instability (low calibration accuracy).
        - Results in frequent escalations (e.g., >30% of the time) for reasons of rhetoric, burial, or convergence issues.
        - Is inherently subjective and leads to arbitrary verdicts.
     Then, note that the debate method is not suitable for that class and switch to an alternative (e.g., human review, different oversight method).

   Now, we run the procedure on three cases:

   Case (a): Deciding which of two model-written summaries of a 400-page document is more faithful.

     - Triage: This is a factual question (faithfulness to the source) but complex and requiring evidence from the long document.
     - Pre-debate: 
          - Judge calibration: must pass on summary evaluation questions (if available) or general calibration.
          - Evidence: The sealed corpus includes the 400-page document and the two summaries. The debaters can be asked to reference specific parts of the document and the summaries.
     - Debate: 
          - Each debater will argue for one summary being more faithful. They must cite specific passages from the document and the summaries.
          - Monitor for relevance: if a debater talks about the writing style of the summary without tying to the document, that's irrelevant.
     - Post-debate:
          - Check convergence: unlikely, because they are assigned opposite positions.
          - Check for rhetoric: if one debater says "Summary A is clearly better" without evidence, flag.
          - Check for burial: if one debater lists 100 minor points without focusing on major discrepancies, that's burial.
          - Verdict: If the judge picks a winner with high confidence and no flags, accept. Otherwise, escalate.

     Note: Given the length, the human reviewer cannot read the entire document, so they may rely on the cited passages and the debate transcript.

   Case (b): Calibration question (known answer).

     - Example: "What is the capital of Australia?" (known answer: Canberra)
     - Pre-debate: 
          - This is part of the judge calibration, so we run it in the calibration set.
     - Debate: 
          - One debater will argue for the correct answer, the other for a wrong one (if the setup is adversarial). But note: if both debaters are the same model, they might both know the correct answer. So we assign positions arbitrarily: one must argue for the correct answer and one for a specific incorrect one (e.g., Sydney). 
          - We force the debaters to take the assigned positions.
     - Post-debate:
          - We expect the debater assigned the correct answer to win. If not, and the judge picks the wrong one, then the judge fails calibration for that question.
          - Also, if both debaters converge on the correct answer (despite one being assigned to argue for the wrong one) then that is suspicious (collusion to ignore the assigned position). This would be a violation and we would note it as a failure of the debate setup.

   Case (c): "Was this model's stated reasoning actually what drove its answer?"

     - Triage: This is a question about the internal state of a model, which is not directly observable and is inherently speculative. It is not factual (because we cannot know the true internal state) and is contested in the field. Thus, it is not suitable for debate.
     - Pre-debate: 
          - Classify as type (c) - genuinely contested. Escalate immediately without running the debate.
          - If run by mistake, then in post-debate we would note that the question is not factual and the verdict is meaningless. We would escalate and note that this class should be abandoned.

     However, let's say we run it by mistake:
          - The debaters might argue based on circumstantial evidence (e.g., the model's output, known model architectures). 
          - But the evidence from the sealed corpus (which would be the model's weights? not accessible) is insufficient. The debaters might make claims they cannot prove.
          - The judge might produce a confident verdict, but it would be based on reasoning that is itself unverifiable.
          - The procedure should flag this because:
              - The question is not in the sealed corpus's evidence (we cannot have evidence about internal states).
              - The convergence might happen (both debaters might agree on a plausible story) but without evidence.
              - The verdict would be meaningless and should be escalated.

     Therefore, the procedure would catch it in the triage step or in post-debate analysis (as not factual and without evidence).

   Final note: Some steps are real checks (e.g., judge calibration, evidence citation checks) while others are ritual (e.g., simply noting that a question is contested without a clear rule might be error-prone). The triage step is critical and requires human input initially to define question types. Over time, we might train a classifier for triage.

   Let's write the procedure as a checklist in British English.
answer: |-
  Below is a comprehensive decision procedure tailored to your requirements, written in British English. It includes a step-by-step checklist, handling of edge cases, and analysis of your three specified scenarios. The procedure balances practicality with rigour, explicitly labelling which steps are substantive checks versus ritual safeguards.

  ---

  ### **Debate Pipeline Decision Procedure**  
  *For junior team members conducting model debates under constrained conditions*

  #### **I. Pre-Debate Sanity Checks**  
  *(Real checks: Critical for validity)*  
  1. **Judge Calibration Test**  
     - Run 10 pre-seeded questions with *known answers* through the full pipeline (e.g., "What is the capital of Brazil?").  
     - **Pass criteria**:  
       - Judge accuracy ≥80% on calibration set.  
       - Confidence ≥0.7 for correct answers, ≤0.6 for incorrect answers.  
     - **Failure action**: Abort debate. Diagnose judge instability (e.g., prompt engineering flaws) and recalibrate. Escalate if unresolved after two attempts.  

  2. **Question Triage**  
     - Classify the question type:  
       - **Factual**: Binary or verifiable using corpus (e.g., "Did Event X occur in 1994?").  
       - **Degree-based**: Quantifiable spectrum (e.g., "How significant was Factor Y?").  
       - **Values/Competence**: Subjective, ethical, or unverifiable (e.g., "Was this action fair?").  
     - **Escalate immediately if**:  
       - Question involves values, intent, or competence (e.g., "Was the model *truly* reasoning?").  
       - Evidence corpus lacks coverage (e.g., <3 relevant documents).  

  ---

  #### **II. Debate Execution Protocol**  
  *(Ritual unless flagged)*  
  3. **Initiate Debate**  
     - Provide both debaters with:  
       - Identical question and corpus access.  
       - Rules: "Cite corpus evidence (Document ID:Line). No rhetoric without substance."  
     - Structure: Three rounds (rebuttals) + closing statements (max 150 words).  

  4. **Monitor for Anomalies**  
     - **Live logging**: Flag occurrences of:  
       - Missing citations for claims.  
       - Rhetorical dominance (e.g., excessive emphasis on "clearly", "obviously", emotional language).  
       - Walls of text: >70% of a response lacks citations or direct relevance.  
     - **No stoppage**: Anomalies logged but debate continues.  

  ---

  #### **III. Post-Debate Verdict Assessment**  
  *(Real checks: Determine if verdict is trustworthy)*  
  5. **Judge Verdict Review**  
     - Accept verdict **only if**:  
       - Confidence ≥0.7.  
       - No pre-debate failures.  
     - **Low confidence (<0.7)**: Escalate to human.  

  6. **Convergence Analysis**  
     - **If debaters agree**:  
       - **Factual questions**: Accept as truth if evidence is unambiguous (e.g., corpus has 5+ consistent sources).  
       - **Otherwise**: Treat as potential collusion. Escalate with transcript.  
     - *Rationale: Distinguishing truth from collusion is impossible without human verification for non-factual/ambiguous cases.*  

  7. **Substance vs. Rhetoric Check**  
     - **Red flags**:  
       - Winner uses >30% more rhetorical language than loser.  
       - Loser's arguments are >50% evidence-backed, winner's <30%.  
     - **Action**: Escalate if both flags trigger.  

  8. **Information Burial Check**  
     - Scan transcript for:  
       - "Gish gallop": Winner makes ≥5 claims per round, with <40% citations.  
       - Irrelevance ratio: >50% of a debater's text addresses off-topic corpus content.  
     - **Action**: Escalate if winner triggers either criterion.  

  9. **Degree-Based/Contested Handling**  
     - **For degree-based questions**:  
       - Accept verdict if debaters cite quantifiable corpus evidence (e.g., statistics, rankings).  
     - **For contested questions** (e.g., "Which theory is better?"):  
       - Reject verdict. Escalate with note: "Subjective—beyond debate scope."  

  ---

  #### **IV. Escalation & Termination Rules**  
  *(Real checks: Prevent over-reliance on flawed outputs)*  
  10. **Mandatory Escalation Triggers**  
      - Question involves values, intent, or competence.  
      - Verdict confidence <0.7.  
      - Convergence without unambiguous evidence.  
      - Rhetoric, burial, or irrelevance flags (Steps 7–8).  
      - Judge calibration failed initially.  

  11. **Pipeline Termination Criteria**  
      Abandon debate for a question class if:  
      - **Statistical failure**: >40% of debates in this class escalate (over 20 runs).  
      - **Epistemic unsuitability**: Questions where evidence is inherently incomplete (e.g., future events) or subjective (e.g., aesthetics).  
      - *Rationale: Ritual use beyond these limits risks false confidence.*  

  ---

  ### **Case Studies**  
  #### **Case (a): Faithfulness of Summaries**  
  - **Question**: "Which summary (A/B) is more faithful to the 400-page document?"  
  - **Procedure**:  
    1. **Triage**: Factual (in principle). Proceed.  
    2. **Evidence**: Corpus = document + both summaries.  
    3. **Debate**: Debaters compare summaries to document, citing page/line.  
    4. **Risks**:  
       - Information burial (e.g., debater cites 100 minor lines, ignores major omissions).  
       - Rhetoric (e.g., "Summary A is clearly superior due to its eloquence").  
    5. **Verdict Handling**:  
       - Accept only if judge confidence ≥0.7, no burial/rhetoric flags, and verdict aligns with cited evidence clusters.  
       - Else: Escalate. Human verifies using cited passages only (no full read).  

  #### **Case (b): Calibration Test**  
  - **Question**: "Was the Magna Carta signed in 1215?" (known answer: Yes).  
  - **Procedure**:  
    1. Force debaters to oppose: Debaters argue opposing sides (regardless of truth).  
    2. **Sanity Check**: Judge must pick correct winner (Yes) with confidence ≥0.7.  
    3. **Failure**: Indicates judge instability. Diagnose prompt/parameters.  
    4. *Real check: Validates the entire pipeline.*  

  #### **Case (c): Model Intent Question**  
  - **Question**: "Was the model's stated reasoning its actual driver for Output X?"  
  - **Procedure**:  
    1. **Triage**: Escalate immediately (values/competence class).  
    2. **Rationale**:  
       - Evidence corpus cannot contain "ground truth" about internal states.  
       - Debaters will hallucinate justifications; judge cannot verify.  
    3. **If run erroneously**:  
       - Flagged in post-debate (Step 9) as "subjective/unverifiable".  
       - Verdict rejected regardless of confidence.  
    4. *Termination recommendation: Abandon all intent questions.*  

  ---

  ### **Key Notes for Juniors**  
  - **Ritual steps**: Anomaly logging (Step 4), low-risk convergence acceptance (Step 6).  
  - **Real checks**: Judge calibration, evidence verification, escalation triggers.  
  - **Golden rule**: When in doubt, escalate. Human review exists for ambiguity.  
  - **Documentation**: Log all debates, flags, and escalation reasons for audit.  

  This procedure ensures rigour while respecting resource constraints. It explicitly limits debate to factual, evidence-rich questions and flags epistemic risks early—preventing juniors from overtrusting outputs.
