  ---

  ### Limitations of the Procedure  
  This procedure enforces the lexical priority of severe suffering, making it **highly restrictive**. Correctly applied, it would forbid many practices the board currently permits: any intervention causing severe/unquantified harm (e.g., castration, slaughter without stunning) is blocked regardless of benefits. This reflects the framework's asymmetry—preventing severe suffering is only a finite good, but causing it is an infinite bad.  

  **Load-bearing arbitrary choices**:  
  - The 1000:1 exchange rate for prevented severe suffering is philosophically indefensible but pragmatically necessary to avoid paralysis.  
  - Classifying "moderate" suffering as below threshold allows trading but risks underestimating harm.  
  - The episode-based threshold ignores cumulative suffering (e.g., chronic moderate stress).  

  **Operational limits**:  
  - Cannot resolve trade-offs between caused and prevented severe suffering (Case B).  
  - Vulnerable to dossier quality; missing harm data forces rejection (Case C).  
  - Weights (mild=1, moderate=3) are crude proxies for disvalue.  

  **Recommendation**: The board must recognize that this framework, by its nature, prioritizes minimizing worst-case suffering over aggregate welfare. If this misaligns with institutional goals, the ethical framework—not the procedure—needs revision.
