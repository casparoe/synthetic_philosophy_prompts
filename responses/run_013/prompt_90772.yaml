  ### Reflection on Translation Challenges

  The lexical-threshold framework imposes three non-negotiable constraints:  
  1. **Lexical priority of severe suffering** must be preserved. Any procedure must block compensation for harms at/above the threshold.  
  2. **Threshold ambiguity** forces operational choices. The procedure must define what the threshold applies to (episodes/lives/populations) and set its location.  
  3. **Commensurability silence** requires inventing a tradable metric for below-threshold effects.  

  Key compromises:  
  - **Dropped**: Strong commensurability. We use severity-weighted animal-days as a pragmatic metric, not a philosophical claim.  
  - **Added**:  
    - Threshold defined per *episode* (most defensible for discrete harms).  
    - "Severe suffering" operationalized as causing long-term damage/extreme distress.  
    - Arbitrary exchange rates (e.g., severe:moderate:mild = 10:3:1) to make trading feasible.  
  - **Values choices disguised**:  
    - Classifying "moderate" suffering as below threshold.  
    - Counting prevented above-threshold suffering as a finite benefit (weight=1000).  
    - Treating unclassified harms as potential above-threshold risks (precautionary blocking).  

  ---

  ### Procedure: Lexical-Threshold Assessment

  1. **Set Baseline**  
     - Decides: Comparison state for the proposal.  
     - Input: Dossier’s description of current practice vs. proposed change.  
     - Sufficient: Clear identification of the baseline (e.g., "current certified practice").  
     - If missing: Default to current certified standards.  
     - Stops if: Baseline is indeterminable (→ "return_to_committee").  
     - ⚠️ Judgment call: Implicitly prioritizes status quo.  

  2. **Catalog Effects**  
     - Decides: List of harms/benefits relative to baseline.  
     - Input: For each effect: description, affected population, intensity, duration, frequency, annual incidence.  
     - Sufficient: Complete list of claimed effects.  
     - If missing: Proceed but note gaps; weak evidence reduces confidence.  
     - Stops if: No effects claimed (→ "permit").  

  3. **Classify Intensity**  
     - Decides: Intensity class and evidence strength for each harm/benefit.  
     - Input: Intensity descriptions + evidence (studies, expert statements).  
     - Rules:  
       - *Below threshold*: Mild (transient discomfort) or moderate (significant distress, no long-term damage).  
       - *At/above threshold*: Severe (causes long-term damage/extreme distress).  
       - *Unclassified*: Insufficient evidence.  
       - Evidence strength: Strong (multiple studies) > moderate (one study) > weak (anecdotal) > absent.  
     - ⚠️ Judgment call: Defining severity levels is values-based.  

  4. **Lexical Step**  
     - Decides: Whether proposal causes new above-threshold harm.  
     - Input: Classified harms + direction (caused/prevented by proposal).  
     - Rules:  
       - *Blocks trade*: If proposal causes any harm classified as "at/above_threshold" OR "unclassified" (precaution).  
       - *Does not block*: Otherwise.  
     - Stops if: Blocks trade (→ "reject").  

  5. **Exchange Rate Calculation**  
     - Decides: Net welfare effect for below-threshold effects.  
     - Input: Severity weights, duration, frequency, incidence.  
     - Rules:  
       - Assign weights: mild=1, moderate=3, severe(below)=10, *prevented above-threshold*=1000.  
       - Compute: `(Benefit animal-days × weight) – (Harm animal-days × weight)`.  
       - Positive net → benefits outweigh harms.  
     - Sufficient: Quantitative estimate or strong qualitative argument.  
     - Stops if:  
       - Net positive → "permit".  
       - Net negative → "reject".  
       - Uncomputable → "return_to_committee".  
     - ⚠️ Judgment call: Weights and inclusion of prevented above-threshold suffering.  

  6. **Output Verdict**  
     - Decides: Final ruling + conditions.  
     - Rules:  
       - Permitted cases with missing data → add conditions (e.g., "collect incidence data").  
       - Rejected cases → no conditions.  

  ---

  ### Procedure Table

  | Step | Decides | Input Required | Sufficient Answer | Failure Mode | If Stalls, Who Decides |  
  |------|---------|----------------|-------------------|--------------|------------------------|  
  | 1    | Baseline comparison state | Description of current vs. proposed practice | Clear baseline specification | Wrong baseline (e.g., unrealistic alternative) | Board (majority vote) |  
  | 2    | List of harms/benefits | For each effect: description, population, intensity, duration, frequency, incidence | Complete list of claimed effects | Missed effects (e.g., indirect harms) | Analyst (proceed with noted gaps) |  
  | 3    | Intensity class + evidence strength | Intensity descriptions + supporting evidence | All effects classified | Misclassification (e.g., severe as moderate) | Board (majority vote) |  
  | 4    | Whether lexical priority blocks trade | Classified harms + direction (caused/prevented) | Binary: blocks/does not block | False negative (missed above-threshold harm) | Automatic (blocks if unclassified harm caused) |  
  | 5    | Net welfare for below-threshold effects | Severity weights, duration, frequency, incidence | Calculated net or qualitative argument | Arbitrary weights distorting trade-offs | Board (qualitative assessment) |  
  | 6    | Final verdict + conditions | Outcomes of steps 4-5 | Verdict + monitoring conditions | Overly permissive conditions | Board (majority vote) |  

  ---

