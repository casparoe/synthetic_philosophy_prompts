     - Decide: Whether the benefits of the proposal outweigh the harms, considering only below-threshold effects.  
     - Input: The list of below-threshold harms and benefits (all effects now are below threshold because step 4 passed).  
     - Rules:  
          - Assign severity weights:  
              - For harms: mild = 1, moderate = 3.  
              - For benefits: mild benefit = 1, moderate benefit = 3.  
          - For each effect, compute:  
              - Magnitude = severity weight * duration per episode (in days) * number of affected individuals per year * frequency (episodes per individual per year)  
          - Total harm = sum of magnitudes for all harms.  
          - Total benefit = sum of magnitudes for all benefits.  
          - If total benefit > total harm, then benefits outweigh.  
          - If data is missing for some effects:  
              - If the dossier provides a qualitative argument that benefits clearly outweigh harms, accept.  
              - If the missing data is for minor effects and the net is clear without them, proceed.  
              - Otherwise, the step stalls.  
     - Sufficient answer: A calculation showing the totals and a conclusion.  
     - Failure mode: The weights and aggregation may not reflect true disvalue.  
     - If the step stalls (cannot compute and no clear qualitative argument): Then return to committee.  
     - Judgment call: Yes.  
     - If benefits outweigh: Then permit.  
     - If not: Then reject.

  6. **Verdict and conditions**  
     - From step 4: if blocked, reject.  
     - From step 5: if benefits outweigh, then permit; else reject.  
     - If stalled in step 5, return to committee.  
     - Conditions: If the proposal is permitted but there were missing inputs that could affect the outcome, then require conditions:  
          - The producer must collect and report data on the missing inputs within a specified timeframe.  
     - Output: Verdict and conditions.

