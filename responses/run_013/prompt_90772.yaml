  | 3    | Intensity classification and evidence strength | Intensity description and evidence for each effect | Each harm classified as below, at/above, or unclassified; each benefit assigned intensity; evidence strength for each | Misclassifying intensity | Proceed. Judgment call by the board. |
  | 4    | Whether lexical priority blocks | The list of harms with classifications and whether caused or prevented by proposal | Decision: blocks_trade, does_not_block | Failing to block when should, or blocking when shouldn't | If blocks_trade, stop and reject. If does_not_block, proceed. |
  | 5    | Whether benefits outweigh harms | Severity weights, duration, frequency, and number of affected for each below-threshold effect | Calculation of total harm and benefit | Arbitrary weights, missing data leading to wrong net | If cannot compute and no clear qualitative argument, return to committee. |
  | 6    | Final verdict and conditions | Outcomes of steps 4 and 5 | Verdict: permit, reject, or return | N/A | Board records the verdict. |

