answer: |-
  **The Question**  
  Whether forty citizens of this city may licitly slay the lord holding the castle under forged charter, as described.

  **Objections**  
  1. It seems they may: for as Augustine says, *"Non videtur esse lex, quae iusta non fuerit"* (that is not law which is not just), and since this lord rules by forged charter, his dominion is void, and he is a tyrant by usurpation.  
  2. Further, the common good is perverted, for he voids guild charters, seizes common lands, imposes unjust tolls harming the poor, and scorns ecclesiastical censure. To remove such a one is not sedition but a service to justice, as the Philosopher teaches in the *Politics* (Book V).  
  3. Lastly, no superior answers the city’s plea, and the bishop, though he excommunicated the tyrant, fails to act. Therefore, the city itself, through its leading men, must be the competent authority to execute judgment.

  **On the Contrary**  
  The Apostle Paul teaches: *"Non est potestas nisi a Deo; quae autem sunt, a Deo ordinatae sunt"* (Let every soul be subject to higher powers: for there is no power but from God; and those that are, are ordained of God) (Romans 13:1). To slay a ruler without public authority is murder.

  **Determination**  
  I answer that we must distinguish carefully. First, concerning the tyrant: he who seizes dominion by forgery and not by just title is a tyrant *ex defectu tituli*, and his rule lacks the foundation of justice. Yet not every tyrant may be slain by private hands. For the order of justice requires that punishment be inflicted only by one who holds public authority, lest the commonwealth descend into chaos.  

  Second, we consider the harm. The toll on grain, the theft of common lands, and contempt for the Church are grave injuries to the common good. Yet the lord has shed no blood. While his acts are tyrannical, they do not yet manifest that *imminent and irreparable danger* which might permit a private person to act for the preservation of the community, as one may slay a robber assaulting a wayfarer.  

  Third, concerning authority: the absence of the emperor does not ipso facto transfer magisterial power to forty citizens. Though the city is a *communitas perfecta*, it must act through its constituted organs. If the podestà was lawfully elected, and guild consuls hold legitimate standing, they might assemble the people or its representatives to declare the tyrant an enemy of the commonwealth, as Cicero records of ancient Rome. But to swear a secret oath to kill, without public judgment, is to act as seditious conspirators, not ministers of justice. The bishop’s excommunication declares the tyrant’s soul in peril, but it does not depose him or license his death; spiritual censure and temporal sword are distinct.  

  Fourth, the oath they swore: if it binds them to murder contrary to the order of charity and justice, it is an unlawful vow and not binding. As Psalm 115:11 warns, *"Omnis homo mendax"* (every man is a liar)—private judgment is fallible. Without a public mandate, their oath is but a snare to their souls.  

  **Replies to the Objections**  
  1. To the first: It is true his title is void, and his rule unjust. Yet the defect of title does not of itself license his killing by private persons. The injustice of his rule must be resisted by public authority, not private zeal.  
  2. To the second: The disturbance of tyranny is not sedition when ordered to the common good *and* undertaken by competent authority. These forty lack such authority; hence their plot risks greater harm—not only the tyrant’s death but civil strife.  
  3. To the third: The city may act as its own superior *through its lawful representatives*, not through a self-appointed faction. Let them petition the bishop to call a council of guilds, clergy, and elders to depose the tyrant by common consent—but not by stealthy murder.  

  You press me further on the test of harm. Speak, and I will answer.
