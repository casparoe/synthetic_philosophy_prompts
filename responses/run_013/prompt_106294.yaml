answer: |-
  Here’s a 10-question quiz designed to reveal underlying attitudes toward success, phrased neutrally and mapped to 7 distinct cultural/philosophical positions. Each question offers 2–3 concrete behavioral choices:

  ---

  ### **The "Success Reactions" Quiz**  
  *Choose how you’d likely react in these situations:*  

  1. **Your younger sibling lands a job paying double your salary.**  
     A) Throw them a party or give a heartfelt congratulations.  
     B) Feel privately annoyed but say nothing.  
     C) Joke, "Better treat me to dinner now!" to hide discomfort.  

  2. **A friend posts a smug announcement about their book deal.**  
     A) Cheer them on publicly—they earned it.  
     B) Roll your eyes and scroll past.  
     C) Comment something vague like "Interesting…"  

  3. **A coworker who coasts gets promoted over you (you outwork them).**  
     A) Confront your boss: "Can we discuss the promotion criteria?"  
     B) Quietly update your résumé.  
     C) Tell colleagues, "Must be nice to have connections."  

  4. **Your kid wins a national science prize. Do you display the trophy?**  
     A) Absolutely—on the living room shelf.  
     B) Put it in their bedroom, not the common area.  
     C) Celebrate privately but avoid showing it off.  

  5. **Someone in town builds a massive, flashy house on a hill.**  
     A) Admire it: "Good for them!"  
     B) Think, "Hope they paid their fair share of taxes."  
     C) Grumble, "Tacky. Who do they think they are?"  

  6. **A former classmate, born rich, runs a charity and gets constant praise.**  
     A) Respect their work: "Impact matters more than origins."  
     B) Think, "Easy to be generous with family money."  
     C) Say nothing—their life has nothing to do with yours.  

  7. **A neighbor’s startup sells; they retire at 35.**  
     A) Ask for investing tips over coffee.  
     B) Feel bitter about your own job but keep it to yourself.  
     C) Mutter, "Pure luck. Right place, right time."  

  8. **You achieve something genuinely impressive. Mention it at dinner?**  
     A) Yes—you’re proud and it’s part of your life.  
     B) Only if asked directly, then downplay it.  
     C) No—it feels like bragging.  

  9. **Someone you love is struggling financially while you thrive.**  
     A) Help discreetly (e.g., "I owe you for last time" with cash).  
     B) Avoid discussing money to spare their feelings.  
     C) Flaunt your success to motivate them.  

  10. **A distant relative leaves you $20K. You weren’t close.**  
      A) Invest it or treat yourself—it’s yours.  
      B) Donate a chunk anonymously.  
      C) Share it evenly with siblings/cousins.  

  ---

  ### **Scoring Key & Positions**  
  Tally your answers, then match to profiles:  

  - **Mostly A’s: Meritocratic Celebration**  
    *Success is earned. Celebrate openly—it inspires others.*  
    (Loves trophies in living rooms, confronts unfair promotions)  

  - **Mostly B’s: Quiet Leveling / Jantelagen**  
    *Standing out risks group harmony. Downplay achievements—yours and others’.*  
    (Hides trophies, avoids money talk with struggling friends)  

  - **Mostly C’s: Tall Poppy Suspicion**  
    *Envy is corrosive, but success often feels unearned or showy. Polite skepticism.*  
    (Mutters about "luck," calls out smug book posts)  

  - **Mix of A+C: Structural Skeptic**  
    *Success is zero-sum or rigged. Celebrate people, but distrust the "game."*  
    (Questions promotions, scoffs at flashy houses, shares windfalls)  

  - **Mix of A+B: Luck-Aware Humanist**  
    *Success involves luck—stay humble, share generously.*  
    (Displays kid’s trophy but donates surprise cash, avoids flaunting)  

  - **A’s in Q4/Q8 + C’s elsewhere: Aristocratic Honor**  
    *Excellence deserves recognition; mediocrity deserves contempt.*  
    (Proudly displays achievements, scoffs at coasters/charity heirs)  

  - **Mostly B’s + Q10B/C: Detached Pragmatist**  
    *Neither envy nor pride is useful. Focus on fairness, then move on.*  
    (Ignores book posts, shares windfalls, stays neutral on mansions)  

  ---

  ### **Critical Notes**  

  1. **Blurry Lines: Meritocratic vs. Aristocratic**  
     Both celebrate achievement, but Aristocratic views *assume inherent superiority* and scorn "unworthy" winners (e.g., coasters, charity heirs). To separate them:  
     - *Add a question like:*  
       **"A self-made millionaire says, 'Anyone can do this if they’re not lazy.' You think:**  
       A) *They’re right—grit determines success.* (Meritocratic)  
       B) *They’re ignorant—privilege blinds them.* (Structural/Luck-Aware)  
       C) *They’re arrogant—most people are mediocre.*" (Aristocratic)  

  2. **Empty/Incoherent Combos**  
     - **Q4A (display trophy) + Q8C (never mention your success)** = *Hypocrisy*. You celebrate loved ones but shame yourself.  
     - **Q3C (gossip about unfair promotion) + Q6A (defend privileged charity founder)** = *Contradiction*. Inconsistent standards for "earned" success.  
     - **Q9C (flaunt success to motivate strugglers)** = *Socially Toxic*. No major philosophy endorses this—it’s pure ego.  

  ---

  This quiz avoids labels until scoring, uses real-world dilemmas, and exposes nuances in how we process success. Perfect for a thought-provoking newsletter!
