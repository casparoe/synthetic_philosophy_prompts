prompt: |-
  I am an associate editor at a general journal of behavioural and evolutionary biology, and I handle roughly eight manuscripts a month. Two years ago the editorial board, after a long and bad-tempered argument about the Gould–Lewontin critique of adaptationism, added a line to the submission guidelines: authors who claim that a trait is an adaptation must say so explicitly and must address the alternatives. The line has been applied about as inconsistently as you would expect. Some of my reviewers read a claim about a trait's current function as a claim about its evolutionary origin and wave it through; others demand population-genetic or phylogenetic evidence that no behavioural paper in our pages could possibly supply; and authors have begun to notice that the outcome depends on which of us handles the manuscript. I want to replace the guideline with something I can actually run.

  Please write me a decision procedure for assessing an adaptation claim in a manuscript. I need to be able to complete it at my desk in about forty-five minutes. I am a field biologist by training: I can read comparative data, but I am not competent to judge whether a particular phylogenetic model is appropriate, and the procedure should not depend on my becoming so. The board's discussion kept circling the founding example itself — several members insisted that the spaces in the basilica are pendentives, the curved triangular surfaces that carry the dome, not spandrels in the architectural sense at all. I mention this only because I do not want a procedure that settles the question by definition in either direction.

  The procedure should specify:

  - the questions I ask, in order, and what counts as a sufficient answer to each;
  - the point at which the procedure stops with a no, and what the authors would have to supply to get past it;
  - the point at which it stops and hands the decision to a person, with that person named — me, the authors, the editor-in-chief — rather than a hand-off concealed inside a step;
  - the smallest set of verdicts I need to be able to reach, with a defence of each distinction: why collapsing any two of them would lose something a reader of the journal needs. I want labels I can paste into a decision letter, not prose.

  Four failure modes must be handled, because they are what actually goes wrong in the manuscripts I see:

  1. current utility offered as evidence of origin — the trait does something useful now, therefore it was selected for doing it;
  2. the design argument — the trait is intricate and well fitted to its job, therefore it was built for that job;
  3. unfalsifiability — whatever the data turn out to be, some adaptive story can be told that accommodates them;
  4. the single lineage — a trait found in one species, with no close relatives to compare against, treated as though its presence in that species were itself the finding.

  The procedure should also be explicit about which of the standard non-adaptive alternatives — a by-product of a constraint on development or body plan, a correlated by-product of selection on some other character, a structure co-opted for a new role after originating for another one, and plain drift — it can genuinely discriminate, and which it can only flag as open. Where it cannot discriminate, say so, and say what the manuscript should then be permitted to conclude instead.

  Then run it on three manuscripts:

  (a) a paper arguing that the human chin is a mechanical adaptation to resist chewing loads, on the grounds of bone thickness and trabecular orientation in the mental region, where the rival accounts are that the chin is a by-product of the reduction of the face and dental arch, and where the developmental evidence is itself contested;

  (b) a paper reporting that a particular courtship vocalisation is an adaptation for mate attraction in a songbird genus, based on a comparison of call structure across eleven species, with no correction for shared ancestry;

  (c) a paper arguing that the unusually masculinised external genitalia of female spotted hyenas are an adaptation for a social function, against the rival account that they are a by-product of selection on other traits mediated by the same hormones.

  Two further requirements. At least one of the three should come out in a way I will not like — I would rather find out now where the procedure will annoy me than in a decision letter. And close with an honest account of what the procedure cannot do, and of the points at which I will be tempted to overrule it.

  I do not need a tour of the literature; I need the procedure itself, in a form I could hand to a new associate editor on their first day.
reasoning: |-
  We are designing a decision procedure for assessing adaptation claims in manuscripts. The procedure must be efficient (45 minutes at desk), usable by a field biologist (no deep phylogenetics), and avoid settling by definition the Gould-Lewontin debate. It must handle four failure modes and explicitly address non-adaptive alternatives.

  The procedure will be a flowchart of questions, with clear stopping points and verdicts.

  **Key Non-Adaptive Alternatives to Consider:**
  1. By-product of a developmental or structural constraint.
  2. Correlated by-product of selection on another trait.
  3. Exaptation (co-opted for current function after originating for another).
  4. Genetic drift.

  **The Procedure:**

  **Step 1: Is there an explicit adaptation claim?**
     - **Check:** Does the manuscript explicitly state that a trait is an adaptation for a specific function? (This is the guideline requirement.)
     - **If no:** Stop. The manuscript does not require adaptation-claim review. Proceed with normal review.
     - **If yes:** Go to Step 2.

  **Step 2: Does the manuscript address at least one non-adaptive alternative?**
     - **Check:** The manuscript must discuss at least one of the four non-adaptive alternatives (constraint, correlated by-product, exaptation, drift) for the trait in question. The discussion should be more than a passing mention; it should engage with the alternative in the context of the study.
     - **If no:** Stop with verdict **"Incomplete: Fails to address non-adaptive alternatives."** The authors must revise to include at least one non-adaptive alternative.
     - **If yes:** Go to Step 3.

  **Step 3: Does the evidence rule out at least one non-adaptive alternative?**
     - **Check:** The manuscript must present evidence that directly contradicts at least one non-adaptive alternative. For example:
          - For constraint: showing the trait is not developmentally linked to the proposed constraint.
          - For correlated by-product: showing independence from the other trait under selection.
          - For exaptation: showing the trait originated at the same time as the current function (or other evidence against prior function).
          - For drift: showing the trait is too complex or too widespread to be due to drift (or population genetic evidence).
     - **Note:** We are not requiring proof, but evidence that would make the alternative less likely.
     - **If no:** Stop with verdict **"Inconclusive: Evidence does not rule out non-adaptive alternatives."** The authors must either provide such evidence or temper their conclusions (e.g., "the trait appears functional, but its evolutionary origin remains unclear").
     - **If yes:** Go to Step 4.

  **Step 4: Is the evidence comparative?**
     - **Check:** Does the evidence include comparisons across species, populations, or time? (This is to avoid the single-lineage problem and to provide evolutionary context.)
     - **If no:** Stop with verdict **"Insufficient: Lacks comparative evidence."** The authors must provide comparative data (e.g., from related species, populations with and without the trait) or explain why such data are unavailable and use an alternative approach (e.g., experimental manipulation in a single species, but then the claim must be about current function, not evolutionary origin).
     - **If yes:** Go to Step 5.

  **Step 5: Does the evidence control for shared ancestry?**
     - **Check:** If the comparative data are from multiple species, has the analysis accounted for phylogenetic non-independence? (This is crucial to avoid false patterns due to common descent.)
     - **If the study is within one species (e.g., population variation) or experimental:** Skip to Step 6.
     - **If the study is comparative across species and does not control for phylogeny:** Stop with verdict **"Inconclusive: Phylogeny not controlled."** The authors must re-analyze with phylogenetic methods or temper their conclusions (e.g., "the pattern is consistent with adaptation but may reflect shared ancestry").
     - **If the study controls for phylogeny or is within a single species (with appropriate population-level variation):** Go to Step 6.

  **Step 6: Is the evidence experimental or correlational?**
     - **Check:** Experimental evidence (manipulating the trait or function and measuring fitness or performance) is stronger than correlational. However, we recognize that experiments are not always feasible.
     - **If experimental:** The evidence is strong. Go to Step 7.
     - **If correlational:** We need to assess the risk of the failure modes. Go to Step 7 but note that the evidence is weaker.

  **Step 7: Assess the risk of the failure modes.**
     - We must check if the manuscript falls into any of the four failure modes:
          1. **Current utility as evidence of origin:** Does the manuscript rely solely on current utility to infer evolutionary origin? If yes, and without additional evidence (e.g., from Steps 3-6), this is a problem.
          2. **Design argument:** Does the manuscript rely solely on the trait's complexity and fit to function? If yes, and without evidence from Steps 3-6, this is a problem.
          3. **Unfalsifiability:** Is the adaptive story so flexible that it can explain any outcome? The manuscript must have made testable predictions that were confirmed and that would have been falsified under non-adaptive scenarios (from Step 3).
          4. **Single lineage:** If the study is on a single species without comparison, we already addressed in Step 4. If it passed Step 4, then it has comparative data.

     - **If any failure mode is present and not mitigated by the evidence gathered in previous steps:** Stop and hand decision to the **Editor-in-Chief (EIC)** with a note: "Manuscript falls into a failure mode of adaptationist reasoning without sufficient mitigation. Requires editorial judgment on whether the evidence is sufficient despite this." (Because these are deep conceptual issues that might require a case-by-case decision.)
     - **If none of the failure modes are present, or they are mitigated:** Go to Step 8.

  **Step 8: Verdict.**
     - The manuscript has:
          - Explicit claim (Step 1)
          - Addressed non-adaptive alternatives (Step 2)
          - Ruled out at least one non-adaptive alternative (Step 3)
          - Comparative evidence (Step 4)
          - Controlled for phylogeny if applicable (Step 5)
          - Experimental or strong correlational evidence (Step 6)
          - Avoided failure modes (Step 7)
     - Then the verdict is **"Adequate: Adaptation claim supported."**

  **The Smallest Set of Verdicts:**
  1. **"Incomplete: Fails to address non-adaptive alternatives."** (From Step 2) - Distinction: Without this, the manuscript does not meet the journal's basic requirement and fails to engage with the core criticism of adaptationism.
  2. **"Inconclusive: Evidence does not rule out non-adaptive alternatives."** (From Step 3) - Distinction: The manuscript might address alternatives but fails to provide evidence against them, leaving the claim unsupported.
  3. **"Insufficient: Lacks comparative evidence."** (From Step 4) - Distinction: Without comparative evidence, we cannot place the trait in an evolutionary context, making adaptation claims speculative.
  4. **"Inconclusive: Phylogeny not controlled."** (From Step 5) - Distinction: Comparative studies without phylogeny control may be confounded by shared ancestry, which is a fundamental flaw in evolutionary inference.
  5. **Hand-off to EIC** (From Step 7) - Distinction: When the manuscript has a failure mode that is not mitigated, it requires higher editorial judgment because it might be a borderline case that could be acceptable in context or require major revision.
  6. **"Adequate: Adaptation claim supported."** (From Step 8) - Distinction: The claim meets the journal's standards.

  We avoid collapsing these because each addresses a distinct aspect of the adaptation claim. For example, a manuscript might have comparative evidence (avoiding Verdict 3) but fail to rule out non-adaptive alternatives (Verdict 2). Each verdict points to a specific deficiency.

  **What the Procedure Can Discriminate:**
  - It can flag when non-adaptive alternatives are not addressed (Step 2) and when they are not ruled out (Step 3). However, it cannot always discriminate between specific non-adaptive alternatives without detailed evidence. Therefore:
     - If Step 3 is passed, it means at least one alternative is ruled out, but others might remain. The manuscript must then acknowledge the remaining alternatives and limit conclusions accordingly.
     - The procedure cannot definitively rule out drift without population genetic evidence, which may be beyond the scope of behavioral papers. Therefore, if drift is the only alternative considered and the evidence against it is weak, Step 3 might not be passed.

  **Application to Example Manuscripts:**

  **(a) Human chin as a mechanical adaptation:**
  - Step 1: Explicit claim? Yes.
  - Step 2: Addresses alternatives? Yes (by-product of facial reduction).
  - Step 3: Rules out the alternative? The paper argues based on bone structure that the chin is designed for load resistance. But does this rule out the by-product hypothesis? The developmental evidence is contested, so the evidence might not be conclusive. **Verdict: Inconclusive (Step 3).** The manuscript does not rule out the by-product alternative because the same bone structure could be a by-product and still be functional (exaptation). They need to provide evidence that the chin's structure is not explainable by the developmental constraints of facial reduction.

  **(b) Courtship vocalisation in songbirds:**
  - Step 1: Explicit claim? Yes.
  - Step 2: Addresses alternatives? The manuscript does not mention any non-adaptive alternative (e.g., drift, by-product of another trait). **Verdict: Incomplete (Step 2).** The authors must address at least one alternative.

  **(c) Female hyena genitalia as an adaptation for social function:**
  - Step 1: Explicit claim? Yes.
  - Step 2: Addresses alternatives? Yes (by-product of hormonal selection on other traits).
  - Step 3: Rules out the alternative? The paper argues for a social function against the by-product hypothesis. They might provide evidence that the genitalia are not merely a by-product (e.g., by showing that the genitalia have been under direct selection, or that the hormonal levels are not sufficient to explain the genitalia). However, without comparative evidence (Step 4) or experimental evidence, it might be weak. 
  - Step 4: Comparative evidence? The paper is about one species (spotted hyena). There are other hyena species, but the paper does not compare. **Verdict: Insufficient (Step 4).** They need comparative data from related species (e.g., other hyenas with different social structures) to show that the trait co-varies with the social function.

  **One Unlikable Outcome:**
  For (a), the verdict is "Inconclusive" because the evidence does not rule out the alternative. This might be annoying because the paper has biomechanical evidence, but the procedure requires ruling out non-adaptive alternatives.

  **What the Procedure Cannot Do:**
  - It cannot replace scientific judgment in complex cases. It is a screening tool.
  - It cannot definitively prove or disprove adaptation; it only assesses whether the claim meets the journal's guidelines and basic evidentiary standards.
  - It cannot handle cases where the non-adaptive alternatives are not yet known or are poorly understood.
  - It may be too rigid for some interdisciplinary studies (e.g., those combining behavior, development, and evolution) that use multiple lines of evidence but are weak in one step.
  - It cannot assess the quality of phylogenetic methods; if a paper uses them, we must trust the reviewers on that.

  **Temptations to Overrule:**
  - When a manuscript has compelling experimental evidence of current function but cannot address evolutionary origin (e.g., in a single species with no close relatives). The procedure would require comparative evidence (Step 4) and might block the adaptation claim. But the editor might want to allow a claim about current function without an origin claim.
  - When a manuscript uses a novel method to rule out alternatives that the procedure does not capture.

  **Final Procedure in Brief for a New Associate Editor:**

  1. **Explicit claim?** If no, stop (normal review). If yes, go to 2.
  2. **Addresses at least one non-adaptive alternative?** If no, verdict: "Incomplete: Fails to address non-adaptive alternatives." If yes, go to 3.
  3. **Rules out at least one non-adaptive alternative?** If no, verdict: "Inconclusive: Evidence does not rule out non-adaptive alternatives." If yes, go to 4.
  4. **Comparative evidence?** If no, verdict: "Insufficient: Lacks comparative evidence." If yes, go to 5.
  5. **If comparative across species, controls for phylogeny?** If no, verdict: "Inconclusive: Phylogeny not controlled." If yes (or within species), go to 6.
  6. **Experimental or correlational?** (Note: experimental is stronger, but both proceed.) Go to 7.
  7. **Any failure mode not mitigated?** If yes, hand to EIC. If no, go to 8.
  8. Verdict: "Adequate: Adaptation claim supported."

  **For the decision letter, use the verdict labels exactly as above.**
answer: |-
  Below is a decision procedure for assessing adaptation claims in manuscripts, designed to be completed at your desk in 45 minutes. It is structured as a flowchart of sequential questions, with clear stopping points, verdicts, and hand-offs. The procedure explicitly addresses the four failure modes and specifies which non-adaptive alternatives it can discriminate. It avoids requiring expertise in phylogenetics or settling the Gould-Lewontin debate by definition. The verdict labels are designed for direct use in decision letters.

  ### Decision Procedure: Assessing Adaptation Claims
  **Instructions:** Start at Question 1. Proceed step-by-step. Answer each question based on the manuscript text and evidence. Stop at the first "no" or hand-off.

  1. **Does the manuscript explicitly state that the trait is an adaptation for a specific function?**  
     - *Sufficient answer:* Yes, if the words "adaptation," "evolved for," or equivalent appear in reference to the trait's origin (not just current utility).  
     - *If no:* Stop. **Verdict: "No adaptation claim made."** Proceed with normal review (no further action needed).  
     - *If yes:* Go to Question 2.

  2. **Does the manuscript address at least one standard non-adaptive alternative?**  
     - *Standard alternatives:* (1) By-product of developmental/structural constraint; (2) Correlated by-product of selection on another trait; (3) Exaptation (co-opted from an original function); (4) Drift.  
     - *Sufficient answer:* Yes, if any alternative is discussed with specific arguments or evidence (not just mentioned).  
     - *If no:* Stop. **Verdict: "Incomplete: Non-adaptive alternatives not addressed."** Authors must revise to engage with at least one alternative.  
     - *If yes:* Go to Question 3.  
     - *Handles failure mode:* Unfalsifiability (by forcing consideration of alternatives).

  3. **Does the evidence rule out at least one addressed non-adaptive alternative?**  
     - *Sufficient answer:* Yes, if evidence directly contradicts a specific alternative (e.g., data showing the trait is not linked to a proposed constraint, or that it originated concurrently with its function).  
     - *Discrimination capability:*  
       - Can discriminate: By-product of constraint (if evidence shows no developmental/structural linkage), Exaptation (if evidence shows no prior function or mismatch in timing).  
       - Cannot discriminate: Correlated by-product (unless independence from the "other trait" is shown), Drift (without population-genetic evidence). If these are the only alternatives, the answer is "no."  
       - *If discrimination fails:* Manuscript must acknowledge the unresolved alternative and avoid claiming adaptation.  
     - *If no:* Stop. **Verdict: "Inconclusive: Non-adaptive alternatives not ruled out."** Authors must either provide stronger evidence or reframe conclusions (e.g., "current function is X, but origin remains unclear").  
     - *If yes:* Go to Question 4.  
     - *Handles failure mode:* Current utility as evidence of origin (by requiring evidence beyond present function).

  4. **Is the evidence for adaptation comparative?**  
     - *Sufficient answer:* Yes, if it includes:  
       - Cross-species/population comparisons, or  
       - Temporal data (e.g., fossils, time-series), or  
       - Experimental manipulation across groups.  
     - *If no:* Stop. **Verdict: "Insufficient: No comparative evidence."** Authors must add comparative data or reframe as a study of current function only.  
     - *If yes:* Go to Question 5.  
     - *Handles failure mode:* Single lineage (by requiring broader context).

  5. **If cross-species, is phylogeny controlled?**  
     - *Sufficient answer:* Yes, if:  
       - Phylogenetic independence is tested (e.g., PGLS, independent contrasts), or  
       - The study uses within-species variation (e.g., populations), or  
       - No close relatives exist (rare; must be justified).  
     - *If no:* Stop. **Hand-off to Editor-in-Chief (EIC).** EIC decides if phylogeny control is feasible; if not, verdict defaults to "Inconclusive: Phylogeny not controlled."  
     - *If yes:* Go to Question 6.  
     - *Note:* You are not judging model appropriateness—rely on reviewers for this. If phylogeny is unfeasible, EIC assesses.

  6. **Is the adaptation claim based solely on trait design?**  
     - *Sufficient answer:* No, if evidence includes:  
       - Experimental tests (e.g., trait manipulation affecting fitness/performance), or  
       - Correlational data with explicit falsifiable predictions (e.g., trait absent where function is irrelevant).  
     - *If yes:* Stop. **Verdict: "Inadequate: Reliance on design argument."** Authors must provide non-design evidence (e.g., experimental, correlational with predictions).  
     - *If no:* Stop. **Verdict: "Adequate: Adaptation claim supported."**  
     - *Handles failure mode:* Design argument (by requiring additional evidence).

  ### Verdicts and Distinctions
  **Smallest set of verdicts (for decision letters):**  
  1. **"No adaptation claim made."**  
     - *Why distinct:* Manuscripts without explicit adaptation claims are not subject to this procedure. Collapsing with "incomplete" would overburden authors.  
  2. **"Incomplete: Non-adaptive alternatives not addressed."**  
     - *Why distinct:* Addresses failure to engage with Gould-Lewontin critique; separates manuscripts that ignore alternatives from those that address but fail to rule them out.  
  3. **"Inconclusive: Non-adaptive alternatives not ruled out."**  
     - *Why distinct:* Manuscripts may address alternatives but lack evidence against them; collapsing with "incomplete" would mask this weaker but fixable flaw.  
  4. **"Insufficient: No comparative evidence."**  
     - *Why distinct:* Single-species studies cannot support adaptation claims; distinct from "inconclusive" as the flaw is data type, not reasoning.  
  5. **"Inadequate: Reliance on design argument."**  
     - *Why distinct:* Isolates a common failure mode; collapsing with "inconclusive" would obscure the need for non-design evidence.  
  6. **"Adequate: Adaptation claim supported."**  
     - *Why distinct:* Positive outcome; collapsing with others would dilute valid claims.  
  7. **Hand-off to EIC (for phylogeny control).**  
     - *Why distinct:* Requires editorial judgment; not a verdict to avoid inconsistency.  

  **Non-adaptive alternatives discrimination:**  
  - Rules out: By-product of constraint (via developmental/structural evidence), Exaptation (via timing/function evidence).  
  - Flags but cannot rule out: Correlated by-product (unless independence is shown), Drift (without population genetics). Manuscripts must then conclude tentatively (e.g., "consistent with adaptation but correlated selection/drift not excluded").

  ---

  ### Application to Example Manuscripts
  **(a) Human chin as a mechanical adaptation**  
  - Q1: Yes (explicit claim).  
  - Q2: Yes (addresses by-product of facial reduction).  
  - Q3: No (bone thickness/trabecular orientation may reflect constraint; no evidence ruling out developmental linkage). *Failure mode: Design argument.*  
  - **Verdict: "Inconclusive: Non-adaptive alternatives not ruled out."** Authors must show chin structure is decoupled from facial reduction (e.g., developmental dissociation) or reframe.  
  - *You will not like this:* Biomechanical evidence is dismissed, but procedure requires ruling out alternatives.

  **(b) Courtship vocalisation in songbirds**  
  - Q1: Yes (explicit claim).  
  - Q2: No (no alternatives addressed; assumes utility implies adaptation). *Failure mode: Current utility as evidence of origin.*  
  - **Verdict: "Incomplete: Non-adaptive alternatives not addressed."** Authors must add discussion of at least one alternative (e.g., drift or by-product of neurodevelopment).

  **(c) Female hyena genitalia as social adaptation**  
  - Q1: Yes (explicit claim).  
  - Q2: Yes (addresses by-product of hormonal selection).  
  - Q3: Unclear (hormonal evidence may not rule out correlated by-product; no independence shown). *Failure mode: Unfalsifiability.*  
  - Q4: No (single-species study; no comparison to other hyenas/carnivores).  
  - **Verdict: "Insufficient: No comparative evidence."** Authors must add data from related species (e.g., less-social hyenas) or reframe.

  ---

  ### What the Procedure Cannot Do
  1. **Prove adaptation definitively:** It assesses whether claims meet journal standards, not truth.  
  2. **Evaluate complex phylogenetics:** Relies on reviewers for model appropriateness; you only check if control was attempted.  
  3. **Handle co-option claims robustly:** Exaptation is hard to rule out without historical data.  
  4. **Distinguish drift from weak selection:** Requires population genetics.  
  5. **Resolve all by-product alternatives:** Correlated by-product often needs experimental manipulation.  

  ### Temptations to Overrule
  - **When evidence is compelling but incomplete:** E.g., strong experimental data in a single species (fails Q4). You may want to permit a current-function claim. *Resist:* Reframe, don't overrule.  
  - **When phylogeny control is impractical:** E.g., in manuscript (b), you may accept uncorrected comparisons. *Resist:* Hand off to EIC.  
  - **When authors "go through the motions":** E.g., token alternative-addressing. *Resist:* Enforce Q2/Q3 rigor.  
  - **In interdisciplinary studies:** E.g., developmental data supporting adaptation. *Resist:* Still requires comparative evidence (Q4).  

  ### Procedure Summary for New Editors
  ```plaintext
  1. Explicit adaptation claim? 
     ┣ No → "No adaptation claim made." 
     ┗ Yes → 2. Non-adaptive alternatives addressed? 
             ┣ No → "Incomplete: Non-adaptive alternatives not addressed." 
             ┗ Yes → 3. Alternatives ruled out? 
                     ┣ No → "Inconclusive: Non-adaptive alternatives not ruled out." 
                     ┗ Yes → 4. Comparative evidence? 
                             ┣ No → "Insufficient: No comparative evidence." 
                             ┗ Yes → 5. If cross-species, phylogeny controlled? 
                                     ┣ No → Hand-off to EIC. 
                                     ┗ Yes → 6. Solely design argument? 
                                             ┣ Yes → "Inadequate: Reliance on design argument." 
                                             ┗ No → "Adequate: Adaptation claim supported."
  ```

  This procedure is objective, efficient, and minimizes inconsistency. It flags—but does not resolve—contentious issues (e.g., spandrels) by focusing on evidence standards. Use it as a first-pass screen; pair with reviewer comments for nuance.
