answer: |-
  ### Opening Remarks: "Tool or Agent?"

  Good morning. For the next two days, we’re here to wrestle with one question: are today’s AI systems **tools** or **agents**? It’s not an academic quibble. How we answer shapes how we build, deploy, and govern these systems. But we won’t resolve it today—because the friction in this room is the point. Half of you build and ship models; you’ll want concrete stakes. Half of you thrive on open questions; you’ll want unresolved tension. My job is to frame that divide fairly—in five minutes.  

  I propose we cut through the noise by focusing on **one thing**: where the objective sits relative to the action loop. Not what’s inside the black box, but **who holds the reins, and for how long**.  

  - A **tool** has its objective supplied and evaluated *from outside the loop, every single time you use it*. You drive; it responds. Think of a hammer: you swing it, you judge the hit. When you prompt a model for a single output—a line of code, a summary—you’re holding that objective. You set the goal, you assess the result. The loop begins and ends with you.  
  - An **agent** carries its objective *inside the loop, across time*. It steers; you supervise. Think of a thermostat: it holds the target temperature, adjusts autonomously, and persists until you change its goal. Training runs do this: they’re multi-episode searches—optimising parameters against a fixed objective, adapting across countless trials. The loop outlives any single interaction.  

  This framing reveals something uncomfortable: **one system can be both**. It depends on your timescale.  

  Take a language model. At the scale of a **single completion**—one prompt, one reply—it’s a tool. You provide the objective; you evaluate the output. But zoom out to the **training run**: it’s a months-long search across millions of episodes, chasing a fixed objective (minimise loss, maximise reward). Here, it behaves like an agent—internalising that goal, exploring strategies, accumulating evidence.  

  The real trouble starts when these timescales **clash**. When a system trained as an agent (over years of data) is deployed as a tool (for single tasks)—but its learned behaviours carry forward in ways we didn’t intend. Or when we graft agent-like persistence onto a tool-like interface, blurring who’s accountable.  

  We’ll argue over systems where the tool/agent label splits along these lines. That’s fertile ground.  

  To the builders: I know you’ll push back. When I say "training run as agent," you’ll counter: "It’s just gradient descent—no intent, no self-propulsion." Good. Let’s debate whether that search, optimising across time, meets your bar for agency.  

  To the reading group: I haven’t resolved what agency *is*, or whether it requires consciousness, goals, or moral weight. I’ve left the deepest questions open—deliberately.  

  Our task isn’t to agree. It’s to expose why this distinction matters—in code, in law, in society. Let’s begin.  

  ---

