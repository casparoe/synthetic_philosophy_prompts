prompt: |-
  You are a philosopher of rational agency with a solid background in decision theory and in the small literature on cooperation and conflict between agents who cannot communicate or causally affect one another. Before you write, think the matter through carefully and consider several candidate neighbours on your own; I would much rather have a careful carving than a fast label.

  I have been reading the rationalist blogosphere for something like a decade, and I keep running into a pattern that I have no name for. Let me set out the setting first, because that part I am confident about.

  The threats in question are never issued. Two parties cannot communicate and cannot harm each other by any causal route; the threatener's only leverage is that it can predict what the other party would do. If the prediction says the target would fold, then the target has effectively already folded, whether or not anything was ever said. The pressure runs entirely through the target's own dispositions rather than through any message.

  The defence I keep seeing recommended is a piece of self-modification: do not harden your position, change what you want. Replace your real objective with a near-copy that behaves identically in ordinary cases but does not budge when a threat is in the offing; or pare away whatever in you an adversary could get a grip on. What I actually want named, though, is a further move: the person adopts the change as a manoeuvre and expects the manoeuvre to work because the predictor will register the change.

  I cannot make this coherent. If the change is a pose, then a predictor good enough to be running the threat in the first place should see through the pose. If the change is sincere, it is not a defence at all; it is simply what the person now wants, and the adversary is free to aim at that instead. So whatever protects you would have to be strategic and unfeigned at once, which sounds like something that cannot be adopted on purpose.

  Does this have a name? I know several things in the vicinity and I do not think any of them is it: self-binding precommitment; adaptive preference of the sour-grapes sort; Stoic indifference to what is not up to us; and the swap-the-objective trick itself. Tell me which is nearest and precisely where the difference lies. If nothing fits, coin a term, define it, and give me the boundary cases, including whether an organisation that deliberately holds nothing an adversary could seize is an instance of it or merely ordinary risk management. Answer in no more than 350 words, leading with a one-sentence bottom line.
reasoning: |-
  Hmm, the user is describing a complex philosophical problem involving threats and self-modification in non-communicative settings. They've been observing a pattern in rationalist discussions where agents try to defend against predictive threats by changing their preferences, but they find this move incoherent. The core tension is that for the defense to work, the change must be both strategic (adopted to deter threats) and unfeigned (genuine enough to fool predictors), which seems contradictory.

  I need to unpack this carefully. The setting involves two agents who can't communicate or causally affect each other. Threats work purely through prediction - the threatener predicts whether you'll fold, and acts accordingly. The proposed defense is self-modification: altering your preferences so predictors see you as resistant to threats. But the user points out the paradox: if it's just a pose, predictors see through it; if it's sincere, you've actually changed what you value.

  The key move they want named is when someone adopts this change *as a maneuver*, expecting predictors to register it. This creates a self-referential problem. To make it work, you'd need to become someone who genuinely doesn't care about the threatened thing, but only as a strategy to protect your original values - which defeats the point.

  I recall decision theory concepts like precommitment, but those involve causal mechanisms. This is purely predictive. Adaptive preferences (sour grapes) involve genuine value shifts, not strategic ones. Stoicism is about detachment, not prediction games.

  The closest existing concept might be Schelling's "rationality of irrationality" - pretending to be crazy to deter threats. But here the predictor would see through pretense. What's needed is authentic commitment to a stance adopted precisely for its deterrent effect - a "self-fulfilling self-transformation."

  I consider coining "predictive self-hardening" - the act of modifying preferences to appear threat-resistant, knowing predictors will detect it. But the paradox remains: if done strategically, it's detectable as such; if authentic, it changes what you care about.

  For the organizational analogy: when a company avoids holding valuable assets to deter seizures, that's different. It's physical risk management, not predictive manipulation. The core issue here is the mind-game aspect - trying to game the prediction by changing yourself in a way that must be both calculated and sincere.
answer: |-
  **Bottom line:** The move you describe is best termed **predictive self-hardening**, defined as strategically adopting *genuine* preference shifts to deter predictive threats by making oneself reliably non-responsive, knowing the predictor will detect this authenticity.

  **Distinctions:**
  - **Self-binding precommitment:** Involves causal constraints (e.g., burning bridges). Predictive self-hardening lacks causal levers; it operates solely via belief updating in the predictor.
  - **Adaptive preference/Sour grapes:** Involves subconscious or resigned value shifts to reduce cognitive dissonance. Predictive self-hardening is *deliberate* and *instrumental*—adopted *because* it deters, not to cope.
  - **Stoic indifference:** Focuses on internal tranquility regardless of external predictors. Predictive self-hardening is inherently *relational*—aimed at altering the adversary's beliefs.
  - **Swap-the-objective trick:** The *tool* used (e.g., adopting a terminal goal of defiance). Predictive self-hardening is the *strategic deployment* of this tool, where the sincerity of the shift is necessary for its predictive efficacy.

  **The Coherence Problem Resolved:**  
  The tension dissolves if the preference shift is both:
  1. **Sincere:** The agent genuinely internalizes the new preference (e.g., valuing defiance over survival), making the threat ineffective *even if carried out*.
  2. **Strategically motivated:** The agent adopts this shift *because* a perfect predictor will observe it and abandon the threat.

  This creates a self-fulfilling equilibrium: the predictor sees the hardened preferences, knows threats won’t work, and never threatens. The "pose" fails because predictors detect insincerity; only authentic transformation works.

  **Boundary Cases:**  
  - **Organization holding no seizable assets:** This is *ordinary risk management* (causal mitigation), not predictive self-hardening. The org hasn’t altered its preferences; it still values the assets but protects them physically.  
  - **Genuine sour grapes:** If someone abandons a desire *without* strategic intent against predictors, it’s adaptive preference, not predictive self-hardening.  
  - **Failed pose:** An insincere "bluff" is mere posturing—predictors ignore it, so it’s irrelevant.

  **Term Coinage:** *Predictive self-hardening* captures the fusion of strategic intent and authentic self-modification to exploit predictive accuracy defensively.
