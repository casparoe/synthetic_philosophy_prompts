  Here is my credenced decomposition of the proposition that the "abbreviation package" version of deflationism about truth is fully adequate, meeting all legitimate theoretical demands without residue for a substantive property. My **headline credence** is **35%**.

  ### Headline Justification
  While the abbreviation package elegantly handles core truth-talk and avoids metaphysical excess, persistent challenges in explanatory generality, normative force, and non-classical contexts suggest gaps. The 35% reflects significant unresolved tensions, though deflationism remains a live contender.

  ---

  ### Decomposition: Sub-Questions and Probabilities
  I assign probabilities to the claim that the abbreviation package *succeeds* in each sub-domain. Probabilities are rough estimates of adequacy, not likelihood of resolution.

  1. **Success-Explanations (e.g., "true beliefs cause success")**  
     *Probability:* 30%  
     *Justification:* Generalizations like "mostly true beliefs promote survival" resist reduction to instances; reliability itself invokes a quasi-substantive "fit" between belief and world.  
     
  2. **Substitutional Quantification (handling generalizations like "everything Kant said is true")**  
     *Probability:* 40%  
     *Justification:* Substitutional quantification presupposes a stock of sentences to substitute, failing for open-ended domains (e.g., future truths) or non-linguistic bearers, risking covert appeal to a property.  

  3. **Normative Paraphrases (e.g., "believe what is true" as a norm)**  
     *Probability:* 50%  
     *Justification:* Deflationists (e.g., Horwich) offer plausible disquotational norms, but "correctness" in assertion/belief may reintroduce a robust standard beyond mere disquotation.  

  4. **Inflationist Alternatives' Motivation**  
     *Probability:* 70%  
     *Justification:* Inflationism (e.g., correspondence, coherence) often relies on intuitions about "matching reality" that deflationists can dismiss as linguistic illusions, weakening independent motivation.  

  5. **Degree-Truth Attributions (e.g., probabilistic accuracy)**  
     *Probability:* 60%  
     *Justification:* Deflationism extends to graded accuracy (e.g., "forecast F is accurate" ≈ F’s probability score), but explanatory unity frays when truth isn’t all-or-nothing.  

  ---

  ### How They Combine
  The headline credence (35%) is a weighted synthesis:  
  - **Success-explanations (30%)** and **substitutional quantification (40%)** are anchor points—failure here likely dooms the package.  
  - **Normative paraphrases (50%)** and **degree-truth (60%)** are moderate hurdles; weaknesses here constrain but don’t collapse adequacy.  
  - **Inflationist motivation (70%)** is secondary; even if alternatives are weak, deflationism must still solve its *own* problems.  
  I use a geometric mean of the probabilities (≈42%), discounted to 35% for unresolved interactions (e.g., norms + degrees) and holistic misgivings.

  ---

  ### Least Confident Term: **Normative Paraphrases (50%)**  
  This has the highest uncertainty (±20%) due to:  
  - Complex dialectic: Deflationists (e.g., Gibbard) have sophisticated norm-expressivist replies, while inflationists (e.g., Lynch) argue that "correctness" implies a property.  
  - Evidence lability: Slight shifts in meta-ethical frameworks dramatically alter the landscape.  

  **Strongest Moving Evidence:** A deflationist-friendly, formal account of *why* adhering to T-schema-generated norms *systematically* promotes epistemic goals (e.g., utility, coherence) without invoking truth as a causal/explanatory primitive. For example, a game-theoretic model showing that agents maximizing "T-schema compliance" dominate alternatives across contexts.

  ---

  ### Final Note
  The package’s viability hinges most critically on **success-explanations** and **substitutional quantification**. If these crack (as I suspect), the headline credence drops to ≤20%; if resolved, it jumps to 60–70%. Current tools feel like forcing squares into deflationist circles—hence 35%.
