prompt: |-
  I'm in a reading group working through Scanlon's contractualism, and we keep colliding with the aggregation problem before we've agreed on what a solution would even have to look like. Rather than read another round of proposals, I want the specification first. Write me the desiderata that any theory of interpersonal aggregation has to meet in order to be adequate for the purpose of justifying a principle to each person it burdens. I mean the full list: which cases it must get right, which distinctions it must respect rather than collapse, which intuitive verdicts it is not permitted to explain away, and what structural resources it needs to have. For each requirement, give me the case or consideration that motivates it, and say whether you think it is non-negotiable or merely the preference of one camp — in particular, whether the demand that justification be given to each person individually, with no appeal to the sum of benefits to everyone else as a reason for anyone to bear a burden, is a genuine constraint or an overreaction to utilitarianism. I don't need citations or a reading list; I want the criteria, not the literature.

  The cases that keep coming up in our group, and that I want the list to be answerable to, are these. One person will lose a hand unless we act, and two people will each lose a hand unless we act differently, and it seems obvious that we save the two — so a theory has to explain how numbers can matter at all. A very large number of people would each get a minor pleasure from being allowed to do something, and one person would suffer a serious injury as a result, and it seems obvious that the many do not get their way — so the theory has to explain why the sum of small benefits cannot outweigh a serious harm to one. And here is a case I've been turning over that I haven't seen discussed: take that second scenario and redistribute it so that all the small pleasures and the one serious injury fall within a single life, at different times. If the prohibition was really about the separateness of persons, the intrapersonal version should come out differently, and I want the desiderata to say which way and why. Add to that what the theory must say when the numbers are enormous and the stakes are trivial — a loss so slight that no one would notice it, suffered by an astronomically large number of people, against a moderate loss to one — and whether it needs a cardinal measure of complaint, an ordinal ranking of claims, or nothing quantitative at all, and whether it must handle numbers mattering outside rescue cases, in the distribution of scarce resources and in ordinary political justification. I'd also like you to say what the theory must not do: whether it may help itself to a separate tie-breaking rule for numbers, and whether it is allowed to fall silent on some cases rather than deliver a verdict.

  The part I most want is the friction within the list. Flag any pair or subset of the requirements that cannot be jointly satisfied — my suspicion is that explaining why numbers matter in the rescue case and explaining why they do not matter in the trivial-benefit case pull in opposite directions, and if so I want to know which of the two the list should surrender and what surrendering it costs. Tell me which single requirement does the most work in ruling out otherwise attractive positions, and describe those positions in plain terms rather than by name. Write it as continuous prose, with no headings, bullet points, bold text, or tables — the way you would write it up in a letter to a colleague who asked for the spec before the seminar.
reasoning: |-
  Okay, the user is part of a reading group grappling with Scanlon's contractualism and specifically the aggregation problem. They've hit a wall discussing solutions without agreeing on what criteria those solutions must meet. Their frustration is palpable - they want to step back and define the desiderata first, like setting specifications before designing a machine. 

  What they're really asking for is a conceptual framework to evaluate any aggregation theory. The core tension they've identified is between cases where numbers clearly should matter (saving two hands vs one) and where they shouldn't (minor pleasures vs serious harm). That redistribution case they invented is particularly sharp - forcing us to examine whether the separateness of persons is doing the work or if there's something deeper about harm types. 

  I need to systematically unpack the non-negotiables. First, any theory must explain why numbers matter in rescue cases - that's foundational. But equally, it must respect the intuition that no amount of trivial benefits can override a serious harm, which rules out crude utilitarianism. The single-life variant of that case is brilliant because it tests if the constraint is truly about separate persons or about harm commensurability. If identical harms distributed within one life could be aggregated but not across lives, that exposes something profound about contractualism's individualism.

  The astronomical numbers case is another stress test. If we permit aggregation for minor unnoticeable losses, we risk absurdity; if not, we need principled reasons why "unnoticeable" changes anything. Structurally, the theory probably needs at least ordinal ranking of complaints, since we intuitively weigh serious vs minor harms differently. Crucially, it must handle not just rescue scenarios but distributive justice - how numbers affect resource allocation when not life-or-death.

  Now the friction points: The rescue case demands that numbers count; the trivial benefits case demands they sometimes don't. These pull in opposite directions. Any solution will have to draw a line somewhere about when aggregation is permissible, likely based on severity thresholds or incommensurability. But that line-drawing itself might feel arbitrary - that's the cost. The prohibition against using "summed benefits" as justification for individual burden seems non-negotiable for Scanlonians, but perhaps there are softer versions where aggregated claims only matter when no individual shoulders disproportionate harm.

  What I must emphasize is that no theory will satisfy all intuitions perfectly. The deepest tension is between the moral force of numbers and the moral force of individual veto - and contractualism's core innovation is privileging the latter. The redistributed single-life case may reveal that the constraint isn't just separateness of persons but also temporal identity - but that's a hornet's nest best left for their seminar.
answer: |-
  Here is the set of desiderata, motivated by the cases you describe and the core contractualist commitment that justification must be addressed to each individual burdened. Imagine this as a letter sketching the necessary contours of an adequate theory of interpersonal aggregation for Scanlonian justification:

  Any adequate theory must first and foremost respect the **fundamental constraint of individual justifiability**: a principle imposing a burden on an individual cannot be justified *to that individual* primarily by appealing to the sum of benefits accruing to others. This is non-negotiable for contractualism. Justification must speak to the individual's own reason for accepting the burden, grounded in a principle no one similarly situated could reasonably reject. Appealing directly to a utilitarian-style net gain *as the reason for the individual to bear the burden* violates this core idea; it treats the individual as a mere means to others' good. This isn't an overreaction to utilitarianism but constitutive of the contractualist project itself. However, this doesn't mean numbers never matter; it constrains *how* they can matter and *what reasons* can be given to the burdened individual.

  From this foundation, the theory must satisfy the following demands, motivated by your cases:

  1.  **Numbers Must Matter in Threshold Rescue Cases:** The theory must deliver the intuitively correct verdict in the one hand vs. two hands scenario. Saving the two must be justifiable. Crucially, it must explain this *without* simply summing the two losses and comparing the total to the one loss. This requires showing why the claims of the two individuals, considered individually, generate a reason stronger than the claim of the one, such that a principle permitting saving the two in such symmetrical high-stakes conflicts could not be reasonably rejected by the one left unsaved. Failure here renders contractualism implausibly indifferent to preventing greater overall harm when individuals face comparable severe losses. This is non-negotiable.

  2.  **Aggregation Must Be Limited for Disparate Harms:** The theory must explain why an arbitrarily large number of individuals receiving minor pleasures (e.g., enjoying a pleasant scent) *cannot* override the serious harm (e.g., losing a finger) imposed on one individual as a result. It must block the utilitarian summation here. The motivation is the strong intuition that trivial gains for many don't license serious harm to one. Crucially, it must explain this limitation in terms of the *kind of reason* offered to the burdened individual: "You must suffer serious injury so that many others can experience minor pleasure" is not a justification *to them* that they could reasonably accept. This is also non-negotiable; violating it collapses into utilitarianism.

  3.  **The Single-Life Case Must Mirror the Interpersonal Case (Revealing the Constraint):** Your redistributed case – where one person experiences many minor pleasures at different times but also suffers one serious injury as a consequence – is crucial. The theory must explain why aggregation *is* permissible *within* the single life: it seems clearly reasonable for the individual to accept the serious injury at one time in exchange for numerous minor pleasures distributed throughout their life. The difference in verdict compared to the interpersonal case *must* be explained by the **separateness of persons**. The contractualist constraint applies *between* individuals justifying burdens to each other. *Within* a single life, the individual integrates benefits and burdens over time for themselves; there is no need for justification *to another person* bearing the burden. The different verdicts demonstrate that the limitation in (2) arises precisely from the demand for interpersonal justification, not from an inherent incommensurability between minor pleasures and serious harms. Explaining this difference is non-negotiable; failing to distinguish them undermines the core contractualist premise.

  4.  **The Astronomical Trivial Loss Case Must Not Automatically Override Moderate Loss:** The theory must handle the case where an astronomically large number of people each suffer a loss so trivial no single individual would notice it (e.g., a barely perceptible flicker of light), and preventing this requires imposing a moderate, noticeable loss (e.g., a headache) on one person. The theory must *not* automatically allow the aggregate of trivial losses to justify the moderate burden. The motivation is the intuition that imperceptible losses, even in vast numbers, lack the moral weight to force a noticeable burden onto a specific individual. Justifying the headache by saying "you bear this so that billions avoid a flicker they wouldn't even notice" fails as a reason *to the burdened individual*. Permitting aggregation here seems to undermine the special concern for the individual central to contractualism. However, ruling it out absolutely is less obviously non-negotiable than (1) or (2); some might argue sufficiently vast numbers *could* matter, but the burden of proof lies heavily on explaining how imperceptible losses generate claims strong enough to justify noticeable burdens *to the individual*.

  5.  **Scope Beyond Rescue: Numbers in Distribution:** The theory must be applicable to distributive justice and ordinary political justification, not just rescue cases. It must explain how numbers matter (or don't) when allocating scarce resources (e.g., one life-saving drug vs. curing many moderate illnesses) or justifying policies that benefit many but burden some. It cannot treat aggregation as a quirk only of emergency triage. This is a non-negotiable requirement for a general moral theory.

  6.  **Structural Requirements: A Graded Conception of Complaint:** The theory requires at least an **ordinal ranking of the strength of individual complaints** against a principle. It must distinguish between severe harms, moderate harms, minor inconveniences, and trivial/imperceptible effects. A purely ordinal ranking *might* suffice (serious harm > moderate harm > minor pleasure), but explaining the vast numbers in (1) and resisting them in (2) & (4) strongly suggests the need for at least an implicit cardinal measure – we need to understand not just that a serious harm complaint is stronger than a minor pleasure complaint, but *how much* stronger, and whether many weaker complaints can "add up" to outweigh a stronger one under specific conditions. A purely ordinal theory without any capacity for limited aggregation struggles immensely with (1). A fully cardinal, interpersonally comparable measure risks collapsing into utilitarianism, violating the fundamental constraint.

  7.  **What the Theory Must NOT Do:**
      *   **It Cannot Rely Solely on Tie-Breaking:** It cannot treat numbers *only* as a tie-breaker between otherwise equally strong claims. The one-hand vs. two-hands case involves claims of identical strength; the numbers aren't breaking a tie, they are determining which claim is stronger overall. A tie-breaker model fails (1).
      *   **It Cannot Fall Silent on Core Cases:** It must deliver verdicts (or a clear method for reaching them) in paradigmatic cases like (1), (2), and your single-life variant (3). It cannot simply declare these "hard cases" with no guidance.

  **The Friction and the Core Tension:**

  The most significant friction lies precisely between desideratum (1) and desideratum (2)/(4), mediated by (3) and constrained by (6). **Explaining why numbers matter in the rescue case (1) pulls towards permitting aggregation, while explaining why numbers don't matter in the trivial-benefits case (2) and the astronomical trivial-loss case (4) pulls towards prohibiting aggregation.** The single-life case (3) sharpens the tension by showing that aggregation *is* permissible when the separateness-of-persons constraint doesn't apply. The fundamental constraint of individual justifiability rules out pure summation, but the rescue case demands that numbers make a difference *somehow*.

  This tension cannot be fully surrendered; any solution must navigate it. However, the demand that justification be addressed to the individual individually **(fundamental constraint)** is the bedrock and non-negotiable. Desideratum (2) - blocking trivial benefits outweighing serious harm - is a direct consequence of this constraint and is also non-negotiable for a distinctively contractualist solution. The cost of surrendering (2) is abandoning contractualism for a form of utilitarianism.

  Desideratum (1) - numbers mattering in rescue - is also highly compelling and non-negotiable for plausibility. The cost of surrendering (1) is a contractualism that seems perversely indifferent to preventing greater harm when individuals face comparable severe fates.

  Therefore, the key challenge is satisfying (1) *without* violating (2) and the fundamental constraint. This requires developing a model of **limited aggregation**: explaining how multiple individual complaints/claims can collectively provide a stronger reason for rejecting a principle than a single comparable complaint/claim *only under specific conditions*, crucially *excluding* conditions where the aggregated claims are vastly weaker (like trivial pleasures or imperceptible losses) than the burden they would justify imposing on another. The distinction revealed by (3) – that aggregation is permissible within a life but constrained between lives – underscores that the limitation stems from interpersonal justification, not the nature of the goods themselves. The **graded conception of complaint strength (6)** is essential here, as the prohibition on aggregation likely applies when there's a significant *disparity* in the strength of the burden imposed versus the benefits aggregated. Explaining the threshold where aggregation becomes permissible (e.g., comparable severe harms) versus where it is blocked (e.g., trivial benefits vs. serious harm, or imperceptible losses vs. moderate harm) is the crux of the problem. Desideratum (4) pushes this further, forcing the theory to define the lower limit of what constitutes a morally relevant complaint (likely excluding imperceptible losses).

  The fundamental constraint does the most work in ruling out otherwise attractive positions. It directly rules out **classical utilitarianism** (which sums utilities regardless of distribution to justify burdens) and **prioritarianism** (which, while weighting the worse-off, still ultimately aggregates weighted utilities across persons to determine the right action). It also rules out simple **cost-benefit analysis** as a justification offered to the burdened individual. These positions fail because their core justificatory structure violates the demand to justify the burden *to the individual* on grounds they could accept, instead appealing to the overall outcome.

  In essence, the specification demands a theory that allows numbers to amplify moral reasons in cases of comparable, significant harm without permitting the moral weight of individually weak or trivial claims to accumulate to a degree that overrides significant burdens on specific individuals, all while maintaining that justification must be addressed to each person burdened, grounded in the comparative strength of their individual claims under principles no one could reasonably reject. The friction is inherent, and navigating it requires carefully calibrated constraints on *when* and *how* individual claims can be combined within the justificatory framework.
