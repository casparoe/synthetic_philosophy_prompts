answer: |-
  ## OFFICE OF CONDITIONAL LEGISLATION  
  Citizen Resource Portal: Frequently Asked Questions  

  **1. What is Conditional Legislation?**  
  Conditional Legislation is Bellhaven’s constitutional method for adopting policies. Citizens vote to establish our shared values (expressed through the Composite Flourishing Index, or CFI), while specialized prediction markets determine which policies best advance those values. If a market predicts a policy will raise the CFI relative to the status quo, it automatically becomes law.  

  **2. How does a policy proposal become law?**  
  For any formal proposal (e.g., "Build a Harbor Bridge" or "Subsidize Solar Roofs"), two conditional markets are created:  
  *   **Pass Market:** Predicts the CFI value *if the proposal passes*.  
  *   **Fail Market:** Predicts the CFI value *if the proposal fails/rejects*.  
  After a standard 90-day trading period, the proposal passes if, and only if, the final price of the Pass Market exceeds the final price of the Fail Market.  

  **3. What is the Composite Flourishing Index (CFI)?**  
  The CFI is our state’s sole official welfare metric, quantifying citizen well-being. It combines fourteen weighted indicators (e.g., air quality index, median disposable income, self-reported life satisfaction, childhood literacy rates, traffic congestion delays). The specific indicators and their weights are reviewed and potentially revised annually by the elected Standing Committee on the Index.  

  **4. Why do some markets seem slow or inactive?**  
  To ensure continuous pricing, the Office provides liquidity stipends to registered Market Makers. These participants commit to offering buy and sell quotes within a defined spread. Market activity varies based on proposal complexity and perceived impact. Low volume does not invalidate the market; the final price remains legally binding regardless of trading volume.  

  **5. What happens if the meaning of a proposal is unclear?**  
  Ambiguity in policy wording or conditional outcomes is resolved by the Bureau of Adjudication. This body of appointed legal and subject-matter experts examines the proposal text and market prospectus to issue binding clarifications on factual interpretations *before* the market closes. Their rulings define what "passing" or "failing" entails for market settlement.  

  **6. I believe the CFI doesn’t reflect my values. How can I change it?**  
  Values are determined democratically. You may petition the Standing Committee on the Index during its annual review period or support candidates for the Committee who align with your perspective on well-being. Remember, Article 7 of the Charter prohibits any citizen from holding an appointed or elected position on the Standing Committee on the Index *while* holding significant open positions in active conditional markets. This prevents direct conflicts of interest regarding the metric itself.  

  **7. What was the Harbor Bridge Reversal?**  
  The Harbor Bridge proposal initially failed its conditional markets. However, significant late trading activity in the "Pass" market drove its price sharply above the "Fail" market price in the final hours, causing the proposal to unexpectedly pass. Analysis suggests a single large trader ("whale") placed substantial buy orders in the Pass market. The bridge was subsequently built. Some analysts theorize the trader anticipated their own orders would trigger passage *and* that passage would genuinely improve the CFI (via construction jobs and trade), validating their trade. The Bureau of Adjudication found no actionable market manipulation per existing rules.  

  **8. How can markets predict the CFI accurately if the CFI itself changes every year?**  
  Markets predict the CFI value *as it will be officially calculated* at the relevant future measurement date, incorporating any known annual revisions scheduled *before* that date. The Standing Committee's published revision calendar provides certainty. Markets are forward-looking and incorporate expectations about future metric changes.  

  **9. I suspect someone is manipulating a conditional market. What should I do?**  
  Submit a detailed report via Form OCL-7 ("Suspected Market Activity Disclosure") to the Office of Market Integrity (OMI). Include trader IDs (if visible), timestamps, order sizes, and specific concerns. The OMI investigates potential breaches of trading rules (e.g., spoofing, wash trades). Crucially, successfully moving a market price to trigger passage *is not inherently manipulation* if based on a genuine belief in the policy's CFI benefit. Distinguishing informed conviction from illegal action requires evidence of deceptive intent.  

  **10. Doesn’t trading in the "Pass" market affect the likelihood of the proposal passing?**  
  The market price reflects the collective expectation of the CFI outcome *conditional* on the proposal passing. Factors influencing the probability of passage itself are part of the complex web of expectations traders assess. The market mechanism aggregates all available information, including beliefs about the market's own influence on the outcome.  

  **11. Are our leaders just good traders?**  
  Elected officials focus on setting the CFI metric (via the Standing Committee elections) and nominating qualified Bureau of Adjudication members. Policy determination is delegated to the aggregated wisdom of the prediction markets. Governance competence, in this system, is demonstrated by the ability to structure clear proposals and interpret market signals effectively, alongside traditional administrative duties unrelated to conditional markets.  

  **12. What ensures market participants have Bellhaven’s best interests at heart?**  
  Participants are motivated by profit. The market structure aligns this motivation with accurately predicting the proposal's actual impact on the democratically chosen CFI. Accurate prediction is rewarded financially, irrespective of the participant's personal desires for the outcome. The system harnesses diverse information and judgment.  

  **13. How are historical policy decisions reviewed?**  
  The Office of Conditional Legislation conducts biennial "Retrospective Calibration" studies. We re-calculate the *actual* CFI values observed after a policy's implementation and compare them to the market predictions at the time of passage/rejection. Significant deviations are analyzed and published to inform future proposal drafting and market participation. Note: Historical market outcomes are *not* re-adjudicated based on subsequent revisions to the CFI formula; only the formula active at the market's settlement date applies. Policies enacted under past CFI definitions remain valid, even if the current Committee would measure outcomes differently.  

  ---
  **Word Count:** 748  
  **Key Mechanics Embedded:** CFI w/ annual revision by Standing Committee (Items 3, 6, 8, 13), Conditional Pass/Fail Markets (1, 2), Liquidity Stipends (4), Bureau of Adjudication (5), Harbor Bridge Reversal (7), "No Index Position while Trading" Rule (6), Manipulation Reporting (9).  
  **Chilling Ending:** Item 13 calmly states that past decisions are locked in based on outdated metrics – history is immutable, even if the measure of "flourishing" that justified those decisions has fundamentally changed.
