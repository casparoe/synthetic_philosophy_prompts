  ### Further Case to Distinguish the Rules
  **The Swapped Glyph Font**:  
  - **Description**: A typeface where the designer swaps the glyphs for 'a' and 'e'—i.e., the glyph that historically resembles 'a' is assigned to 'e', and vice versa. The system is consistent (all 'a's use the 'e'-like glyph, all 'e's use the 'a'-like glyph), and the intent is explicit.  
  - **Predictions**:  
    - **Rule T (Teacher)**: Rejects the 'a'-like glyph as 'e' and vice versa. *Grounds*: Assignment is intentional and consistent, but the forms clash with systemic coherence (the glyphs contradict established letterforms, disrupting the script’s logic).  
    - **Rival Rule A**: Rejects the swap. *Grounds*: The 'a'-like glyph resembles 'a', not 'e', so it cannot be 'e' (and vice versa). Resemblance overrides intent or consistency.  
    - **Rival Rule B**: Accepts the swap. *Grounds*: The designer’s intent defines the letters, so the 'a'-like glyph is 'e' if assigned as such.  

  **Why this case distinguishes the rules**:  
  - Rule T prioritizes coherence over intent or resemblance alone. The swap breaks coherence, so it rejects it.  
  - Rule A prioritizes resemblance. The glyphs don’t resemble the assigned letters, so it rejects the swap.  
  - Rule B prioritizes intent. The swap is valid because the designer wills it.  

  Thus, the teacher's judgments stem from **contextual systemic assignment**, where a glyph’s validity depends on its role and fit within a typeface’s design ecosystem, not just form, intent, or tradition.
