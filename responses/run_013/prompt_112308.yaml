  The strategy stealing argument (as used in Hex, Chomp, Bridg-it) applies to two-player deterministic games with no chance and no draws, and with the following additional properties:

  - The game is symmetric: the board and the rules are symmetric with respect to the two players (so if the players swap roles and the board is reflected, it's the same game).
  - The extra move (or extra piece) is never harmful to the player who has it. That is, having an additional piece of your own color on the board cannot hurt your own position (it might block the opponent, but that is helpful).

