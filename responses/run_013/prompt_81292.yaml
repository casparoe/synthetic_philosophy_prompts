prompt: |-
  I'm running a 90-minute session in our second-year 'Rationality and Choice' seminar on money pumps, and specifically on whether being pumpable is the same thing as being irrational. Half the room has had a bit of decision theory; the other half signed up because the title sounded like a self-help book. So I can't assume anyone knows what an indifference curve is, and I also can't spend the hour on stuff the decision-theory half already has.

  Dont explain money pumps to me. Plan the class.

  What has to be in place before the pump reads as an argument rather than a magic trick? My hunch is that it's the idea of a preference ordering as something an agent can be held to across time, and that until they've got that, the pump looks like a card trick — but tell me if that's the wrong first move and what actually has to come before it.

  Which single example carries the whole thing, and what does it have to have and lack? I was going to use the usual one — person with intransitive preferences over three dinners slowly drained of cash — but I suspect it smuggles in the conclusion, and I'd rather have something where every individual trade looks reasonable from the inside and the trap only appears from outside. It has to be small enough to draw on a whiteboard, and it has to survive the obvious objection that the agent would just notice the pattern and stop.

  Then the misconception map, in the order they'll actually surface, with the exact point in the sequence where I should head each off. My guesses: that the pump proves intransitivity is irrational all by itself; that the seller has to be a mind-reader or the agent has to be an idiot; that 'resolute choice' is just cheating; and — the one I care most about — that they'll collapse the pump for intransitive preferences into the pump for preferences that shift over time, when I think those are doing seperate jobs and I want that difference to be the payoff of the session rather than a footnote at the end.

  What should I openly refuse to go into at this level (I'm thinking the Dutch book and the empirical preference-reversal literature), and what's the one question I can put to them at the end that tells me whether they've got the structure of a coherence argument rather than just memorized a puzzle? Also give me the ordering with the dependencies marked, since I keep catching myself wanting to say 'and of course, by transitivity...' three minutes in. No reading list — they wont do it and it's not what I need from you.
