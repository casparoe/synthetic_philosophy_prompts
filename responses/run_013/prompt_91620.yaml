prompt: |-
  I'm a reporter on the science-and-ideas beat, which in practice means I write alot about religion, and I keep running into the same move: someone defends a practice or a law in scripture by saying it was never the point, it was a concession to the world people actually lived in, a way of meeting them where they were. Animal sacrifice is what started this for me. Maimonides makes exactly this argument about the sacrifices in part III of the Guide of the Perplexed, chapter 32, and it's a genuinely good argument: God doesn't just abolish the sacrificial cult, because you can't yank a people straight from one extreme to the other, so the worship they already knew — altars, incense, priests — gets redirected toward the one God instead of the stars. The Law takes the medicine in doses, as he puts it, more or less. My problem is I can't tell when that's a real explanation and when it's an alibi. It's everywhere now — the slavery laws were a concession, the dietary rules were a concession, some rule about women in church was a concession, the thing my local congregation does on Saturday mornings is a concession — and I end up either printing it as though it were settled or hedging so hard the paragraph says nothing at all.

  So I'd like a decision procedure I can actually run before filing. A checklist, in order: the questions to ask about any claim that a practice was an accommodation to its time, what counts as a sufficient answer at each step, where the procedure stops and just says no, and where it hands the thing back to me because it's a values question rather than a factual one — does it even matter for a practice's authority if it turns out to be a workaround? I don't think a procedure can settle that, and I'd rather it say so than fake an answer. Keep what Maimonides actually argues; don't water it down into "context matters." The parts that do the work are the impossibility of abrupt change, the idea that a real concession is a weaning and therefore should leave some trace of a trajectory or an expiry date in the law itself, and his own worry that if you push this reading too hard you've turned the commandments into means to an end, which is a cost someone has to pay. Also build in the asymmetry I keep tripping over: the same claim made from inside a tradition and made by an outsider with an axe to grind are doing different work, and I don't want a procedure that pretends they're the same. Then run it on three cases. One, the sacrifices themselves, since that's the original. Two, the claim that the biblical laws permitting slavery were a concession to the ancient economy — I'm pretty sympathetic to that reading and I suspect the procedure will tell me something I don't want to hear, which is fine, but be honest about it. Three, a modern one: a claim that some current custom, or the dietary laws, is "just" a holdover from its era.

  Constraints, such as they are: I've got maybe an hour, I can't call a rabbi every time, my editor signs off on framing but not on the argument, and I need to know when the honest thing to write is "this is contested" instead of picking a side. And please tell me what the procedure can't do — I'd much rather know where it will misfire than get a checklist that looks confident everywhere. I also can't seperate the question of whether a reading is true from the question of who's selling it to me, so if the procedure needs me to keep those apart, say so out loud.
reasoning: |-
  Okay, the user is a reporter covering religion and science, constantly encountering arguments that certain scriptural practices were concessions to historical context. They need a practical decision procedure to evaluate such claims efficiently. 

  First, I need to understand their core frustration: they can't distinguish between legitimate "divine pedagogy" arguments (like Maimonides on sacrifices) and convenient excuses for problematic texts. The asymmetry between insider/outsider motivations complicates this further.

  Maimonides' framework provides key criteria: impossibility of abrupt change, evidence of progressive trajectory, and recognition of theological costs. These become the backbone of the procedure. But I must also address the user's real-world constraints - tight deadlines, no expert consultation, and editorial boundaries requiring neutrality when appropriate.

  The procedure needs clear stopping points where it flags "values dispute" or "insufficient data" instead of forcing false certainty. For the slavery case they mentioned, I anticipate tension: while economic concession arguments hold surface plausibility, the lack of internal expiry mechanisms in the text weakens the claim - an uncomfortable but necessary conclusion.

  Modern applications like dietary laws reveal another layer: if proponents frame them as purely historical accommodations while simultaneously enforcing them as eternal commands, that's a red flag. The checklist must expose such contradictions.

  Crucially, the tool must self-identify limitations: it can't resolve theological debates about scriptural authority, detect bad faith arguments with certainty, or replace specialized scholarship. Being transparent about these boundaries is as vital as the steps themselves.
answer: |-
  Here’s a step-by-step decision procedure for evaluating "concession-to-context" claims, built on Maimonides' core arguments and your practical needs. It flags where *factual analysis ends* and *values/authority questions begin*, and explicitly handles insider/outsider asymmetry.

  ---

  ### **The Decision Procedure: 7 Questions**

  **Asymmetry Note:**  
  *   **Insider Claim:** Assess if the argument aligns with the tradition's own hermeneutical principles and goals.  
  *   **Outsider Claim:** Assess if it avoids caricature and engages with the tradition’s self-understanding.  
  *   **Always ask: "Does this claim strengthen or weaken the practice's authority for the claimant?"**  

  1.  **Was abrupt abolition realistically impossible?**  
      *   *Check:* Evidence of the practice’s deep cultural/economic entrenchment (e.g., sacrifice was universal ANE worship; slavery underpinned ancient economies).  
      *   *Sufficient Answer:* Historical/anthropological data showing the practice was non-negotiable for that society’s function.  
      *   *Stop Here If:* No evidence of entrenchment (e.g., a minor custom with alternatives readily available).  
      *   *Values Flag?* No. Factual.

  2.  **Does the text itself signal concession?**  
      *   *Check:* Explicit textual unease (e.g., "because of the hardness of your hearts" - Matt 19:8 re: divorce); framing as a "lesser evil" (Maimonides' key point).  
      *   *Sufficient Answer:* Direct textual markers of divine tolerance rather than endorsement.  
      *   *Stop Here If:* The text presents the practice as inherently positive or eternal (e.g., "a perpetual statute").  
      *   *Values Flag?* Interpretive, but text-focused.

  3.  **Is there evidence of internal trajectory/weaning?**  
      *   *Check:* Does the law/system contain mechanisms *within itself* nudging toward abolition or higher ideals? (Maimonides: Sacrifice centralized to limit it; moral/prophetic critiques alongside ritual).  
      *   *Sufficient Answer:* Progressive restrictions, moral critiques *within canon*, or clear "next steps" implied.  
      *   *Stop Here If:* The practice is stable/expanded over time in the text/tradition, with no internal critique.  
      *   *Values Flag?* Largely factual (tracing development within the texts/tradition).

  4.  **Was there an "expiry date" implied or enacted?**  
      *   *Check:* Did changed circumstances *within the tradition* lead to abandonment *based on the concession logic itself*? (Maimonides: Sacrifice ended with Temple destruction; its purpose was outlived).  
      *   *Sufficient Answer:* The tradition later abolished/reformed the practice *citing its contextual/concessional nature* as the reason.  
      *   *Stop Here If:* The practice persists *despite* the original context vanishing, and its defenders *deny* it was ever purely contextual.  
      *   *Values Flag?* Factual (did abandonment happen *for this reason*?).

  5.  **What's the theological cost of calling this a "concession"?**  
      *   *Check:* Does labeling it a "concession" reduce core commandments to *mere* pragmatics, undermining divine authority or wisdom? (Maimonides' own fear).  
      *   *Sufficient Answer (for legitimacy):** The claimant acknowledges this cost and argues why the concession *still* serves a higher divine purpose (e.g., pedagogic, communal survival).  
      *   *Stop Here If:* The claimant dismisses the cost or the practice is central to defining the community/doctrine *today*.  
      *   **VALUES FLAG:** **This step reveals the core tension. The procedure CANNOT resolve if the cost is acceptable. Output: "This argument entails significant theological revisionism. Its acceptability depends on the claimant's view of scriptural authority."**

  6.  **Is the "concession" claim applied consistently?**  
      *   *Check:* Does the claimant use this logic for *other* practices they find problematic? Or only for *this specific* one? (Reveals potential ad-hoc reasoning).  
      *   *Sufficient Answer:* The claimant applies a *consistent hermeneutic* (e.g., "laws tied to ancient material conditions are contextual") across comparable cases.  
      *   *Stop Here If:* Selective application based on modern sensibilities alone.  
      *   *Values Flag?* Reveals potential bias/inconsistency, but doesn't falsify the specific claim.

  7.  **Does the modern practice/custom *confess* its concessionary nature?**  
      *   *(For claims about ONGOING practices being "just holdovers")*  
      *   *Check:* Do its practitioners *themselves* describe it as a temporary bridge, a cultural container soon to be outgrown? Or is it presented as timeless/essential?  
      *   *Sufficient Answer:* The practitioners explicitly state it's a temporary accommodation to current weakness/culture, with plans/desire for change.  
      *   *Stop Here If:* The practice is enforced as binding while being *excused* as a holdover by apologists.  
      *   **VALUES FLAG:** **This highlights a contradiction. The procedure CANNOT force consistency. Output: "Claiming this ongoing practice is 'just a holdover' conflicts with its current authoritative presentation."**

  ---

  ### **Applying the Procedure: Your 3 Cases**

  **1. Animal Sacrifices (Maimonides' Original Case)**
  *   **Q1 (Impossible Abolition?):** YES. Sacrifice was the universal language of worship/ancient religion.
  *   **Q2 (Textual Signal?):** YES. Centralization/restriction (Deut 12), prophetic critiques (Isa 1:11, Jer 7:22 - though debated).
  *   **Q3 (Internal Trajectory?):** YES. Centralization limits it; focus shifts to prayer/repentance in later texts; Temple destruction ends it practically.
  *   **Q4 (Expiry Date Enacted?):** YES. Rabbinic Judaism replaced sacrifice with prayer/study *citing* its contextual nature and the Temple's loss. Maimonides codifies this.
  *   **Q5 (Theological Cost?):** HIGH (Risk: Makes worship seem divinely mandated pragmatism). **--> VALUES FLAG: Maimonides pays this cost, arguing concession served pedagogy/anti-idolatry. Acceptability depends on your view of revelation.**
  *   **Q6 (Consistency?):** N/A (Original argument).
  *   **Verdict:** **STRONG CASE.** Meets core criteria (1-4), acknowledges cost (5). Insider argument aligns with tradition's development.

  **2. Biblical Slavery Laws as Economic Concession**
  *   **Q1 (Impossible Abolition?):** YES. Slavery was foundational to ancient economies/social structures globally.
  *   **Q2 (Textual Signal?):** AMBIGUOUS/MIXED. Some protections exist (e.g., release after 6 years, Ex 21:2), but no explicit "this is a lesser evil." Some texts imply acceptance (Lev 25:44-46).
  *   **Q3 (Internal Trajectory?):** WEAK/NO. While humanitarian *mitigations* exist, no clear *trajectory towards abolition* within the biblical text itself. No prophetic critique *of slavery itself* as an institution (critiques focus on abuse). Laws remain stable.
  *   **Q4 (Expiry Date Enacted?):** NO. The text doesn't anticipate its end. Later Jewish/Christian abolitionists acted on *broader ethical principles*, not because the Torah itself declared slavery obsolete *as a concession*.
  *   **Q5 (Theological Cost?):** VERY HIGH. Implies God tolerated a profound moral evil as "necessary." **--> VALUES FLAG: Accepting this requires significant reinterpretation of divine goodness/justice.** Outsider claims often exploit this cost dismissively.
  *   **Q6 (Consistency?):** Often applied selectively *only* to slavery by modern apologists; rarely to laws they uphold.
  *   **Verdict:** **WEAK CASE.** Fails Q3 (Trajectory - the killer flaw) and Q4 (Expiry). Q1 is strong, Q2 is debatable. **--> WRITE: "While ancient economic dependence on slavery is historical fact, the biblical text itself lacks clear signals or mechanisms treating slavery as a temporary concession to be outgrown, making this interpretation contested and theologically fraught."**

  **3. Modern Custom / Dietary Laws as "Just a Holdover"**
  *   **Context:** Claim: "Kashrut/Saturday service format is just a cultural relic, not essential."
  *   **Q1 (Impossible...?):** N/A (Focus shifts to Q7).
  *   **Q7 (Confesses Concession?):** CRITICAL QUESTION. Do observant Jews *describe* kashrut or their Shabbat service *as* a temporary accommodation to modern weakness/culture? **NO.** They are overwhelmingly presented as *eternal, binding commandments* (kashrut) or *meaningful traditions* (service format). Calling it a "holdover" is usually an *outsider dismissal* or *insider reform argument*, not the mainstream presentation.
  *   **Verdict:** **PROCEDURE STOPS at Q7.** **--> OUTPUT: "Labeling this ongoing, authoritatively practiced custom as 'just a holdover' contradicts how it is understood and mandated within the tradition itself. This claim functions more as critique or reformist argument than historical explanation of its origins."**

  ---

  ### **What the Procedure CANNOT Do (Critical Limitations)**

  1.  **Resolve Theological Authority:** It **cannot** tell you if labeling something a "concession" *should* invalidate its authority for believers. That's a religious commitment (Q5 flag).
  2.  **Detect Bad Faith:** It can flag inconsistency (Q6) and contradictions (Q7), but **cannot** prove someone is arguing disingenuously.
  3.  **Provide Definitive Historical Proof:** It relies on evidence (textual, historical), but interpretation is involved (esp. Q2, Q3). It highlights *weak* arguments, not always *disproves* them.
  4.  **Replace Specialized Scholarship:** For deep historical/textual analysis (Q1-Q4), experts are best. This is a *screening tool*.
  5.  **Force Consistency:** It identifies inconsistency (Q6, Q7) but **cannot** make a tradition or claimant apply their logic uniformly.
  6.  **Handle "Soft" Concessions:** It's best for major, morally/ethically weighty practices. Minor cultural adaptations might not fit cleanly.

  ---

  ### **When to Write "This is Contested"**

  Use this phrase when:
  *   The procedure hits a **VALUES FLAG** (Q5, Q7 conclusion).
  *   Evidence for key steps (Q2, Q3, Q4) is **genuinely ambiguous or debated by reputable scholars**.
  *   The claim **passes Q1 but fails Q3 or Q4** (like slavery - historical context is real, but internal trajectory/expiry is weak).
  *   The **insider/outsider asymmetry** is the primary driver of disagreement, and both sides have plausible engagement with the texts/history.

  This procedure forces you to identify *where* and *why* the contestation exists (e.g., lack of internal trajectory, theological cost, contradictory presentation), making "this is contested" an informed conclusion, not a hedge. It tells you *what* is contested and *what kind* of question it is (factual, interpretive, theological). That's your story.
