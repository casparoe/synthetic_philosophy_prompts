prompt: |-
  I'm putting together a doc for a reading group on how to compare how well off two different people are, and I want the spec nailed down first — before we argue about any particular measure, what does a theory of interpersonal welfare comparison actually have to deliver? Give me the requirements list, each one with the case or consideration that forces it, and flag which are non-negotiable and which are just one camp's taste.

  Some I already think belong: it has to rank any two lives, or at least be explicit about when it refuses to; it can't just be ordinal within each person, since the whole point is comparing across them; it has to say something about the baseline — is a life of unremitting pain below zero, and relative to what?; and it has to survive the leveling-down move, i.e. a comparison can't tell us we've improved things by making everyone equally miserable. Add whatever I'm missing.

  Two cases I specifically want it to handle: (a) a woman raised to want very little, who is genuinely content, versus a man with expensive and mostly frustrated ambitions — who's better off, and is the theory obliged to answer at all? (b) two lives with the same total welfare but opposite shapes, a slow rise versus a long decline — does shape have to matter, and can a measure that's just a sum over moments even see it?

  Then tell me which single requirement does the most to rule out the popular proposals, and whether any pair of the requirements is jointly unsatisfiable — taht's the part I most want to see. Skip the reading list, I just want the criteria.
reasoning: |-
  Okay, the user is putting together a document for a reading group on interpersonal welfare comparisons. They want to establish the requirements for any theory before diving into specific measures. Let me start by understanding their main concerns. They mentioned needing a clear specification, so I should focus on the foundational criteria.

  First, they listed some existing ideas: the theory must rank any two lives or explain when it can't, it must be cardinal (not just ordinal per person), address the baseline (like whether pain is below zero), and avoid leveling-down objections. They also provided two specific cases: one about a content woman vs. a frustrated man, and another about life shapes (rising vs. declining). 

  I need to expand on what they might be missing. The key requirements should cover completeness, cardinality, baseline, leveling-down, symmetry, and perhaps sensitivity to distribution. The two cases they mentioned are crucial. For the content woman vs. ambitious man, the theory must handle adaptive preferences—can the woman's satisfaction be taken at face value, or is it false consciousness? The life shape case challenges whether temporal structure matters beyond the sum of moments.

  The user also wants to know which requirement is hardest for popular theories and if any requirements conflict. Cardinality is tough because it requires measurable units, which many ordinal or preference-based theories can't provide. The big conflict might be between respecting preferences (which could endorse adaptive preferences) and objective baselines (which might override expressed satisfaction).

  Non-negotiable points include completeness, cardinality, baseline clarity, leveling-down avoidance, and symmetry. Negotiable aspects might be how to handle adaptive preferences and temporal shape. The conflict between respecting preferences and objective baselines is central. For example, if the content woman's preferences are adaptive, a theory must decide whether to accept her stated happiness or adjust based on an objective standard.

  I should ensure each requirement ties back to a real case. The symmetry requirement prevents arbitrary biases, while sensitivity to distribution addresses whether life shape matters. The leveling-down objection is critical to avoid egalitarianism that values equality over well-being.

  Popular theories like utilitarianism (summing utilities) struggle with cardinality and interpersonal comparisons. Preference-satisfaction theories might not handle adaptive preferences well. The conflict between respecting preferences and objective baselines is a major sticking point, especially in the woman vs. man case.

  In summary, the user needs a clear framework of requirements, highlighting where theories clash and which criteria are essential. Ensuring the document sets up productive debates in their reading group by anticipating these theoretical tensions.
answer: |-
  Here's a distilled requirements list for a theory of interpersonal welfare comparison, based on philosophical and economic foundations, incorporating your cases and highlighting tensions:

  **Core Requirements (Non-Negotiable for Any Coherent Theory):**

  1.  **Completeness (or Explicit Incomparability):**
      *   **Requirement:** The theory must provide a ranking (A better off than B, worse off, or equally well off) for *any* two conceivable lives/persons, *or* explicitly define the conditions under which such a comparison is impossible or meaningless.
      *   **Case Forcing It:** Your case (a) - Content Woman vs. Frustrated Man. *Must* the theory say who is better off? If it refuses, it must clearly state *why* (e.g., incommensurable values, insufficient information). Avoiding this leads to theoretical paralysis in real-world policy or ethical dilemmas where choices affect different people differently.
      *   **Non-Negotiable:** Yes. Without this, the theory is unusable for its core purpose.

  2.  **Cardinality & Interpersonal Comparability:**
      *   **Requirement:** Welfare levels and differences must be meaningfully comparable *across* individuals. It cannot rely solely on intra-personal ordinal rankings ("A prefers X to Y") without a basis for saying how much better X is for A than Y, and how that "how much" compares to differences for B.
      *   **Case Forcing It:** The very premise of interpersonal comparison. Comparing "how well off" inherently requires more than knowing each person's internal preference order. Requires specifying a unit/scale for comparison (even if only ordinal *levels* are comparable, levels imply differences).
      *   **Non-Negotiable:** Yes. The core function demands cross-person comparability beyond mere intra-personal order.

  3.  **Baseline Specification:**
      *   **Requirement:** The theory must define a welfare zero point ("neutral" or "a life not worth living"). This anchors comparisons and defines the sign (positive/negative welfare) of experiences.
      *   **Case Forcing It:** Is a life of unremitting pain below zero? Is death preferable? Is minimal consciousness neutral? Necessary for evaluating policies involving suffering (e.g., end-of-life care, factory farming, poverty lines).
      *   **Non-Negotiable:** Yes. Meaningful talk of aggregate welfare, improvement, or deterioration requires a defined reference point.

  4.  **Anti-Leveling Down:**
      *   **Requirement:** The theory must *not* judge a situation where everyone is made worse off, but equally so, as an improvement over an unequal situation where some are better off and no one is worse off than in the equalized scenario.
      *   **Case Forcing It:** Leveling Down Objection. Making everyone equally miserable (from a state where some were happy) purely for equality's sake cannot be considered a welfare improvement.
      *   **Non-Negotiable:** Yes (for a welfarist theory). Violating this contradicts the core idea that welfare is about individual good.

  5.  **Formal Symmetry / Anonymity:**
      *   **Requirement:** The identities of the individuals (name, gender, race, etc.) should not affect the welfare assessment *of their lives*. Only the features of the life experienced matter.
      *   **Case Forcing It:** Prevents arbitrary bias. Ensures the theory compares *lives*, not persons based on irrelevant characteristics.
      *   **Non-Negotiable:** Yes. A fundamental requirement of impartiality.

  **Important Requirements (Often Debated, Reflect Theoretical Camps):**

  6.  **Sensitivity to Preference Satisfaction / Autonomy (vs. Hedonic/Objective State):**
      *   **Requirement:** Does the theory give weight to whether individuals are achieving their own goals and desires (preference satisfaction), or does it focus on an objective state (e.g., pleasure/pain, capabilities) or hedonic experience, potentially overriding stated preferences?
      *   **Case Forcing It:** Your case (a) - Content Woman vs. Frustrated Man. *Camp Taste:* Preference-satisfaction views might say the content woman is better off (her preferences are met). Hedonic/Objective List views might say the frustrated man, despite his dissatisfaction, has higher "objective" welfare (e.g., more autonomy, achievement potential) or that her contentment is "adaptive preference" (false consciousness) and doesn't count. **Is the theory obliged to answer?** Yes (due to Completeness), *how* it answers defines its camp.

  7.  **Sensitivity to Temporal Structure / Distribution:**
      *   **Requirement:** Does the *shape* of a life over time matter for overall welfare, beyond the simple sum (or average) of moment-by-moment welfare?
      *   **Case Forcing It:** Your case (b) - Slow Rise vs. Long Decline (same total momentary welfare sum). *Camp Taste:* Pure "Mental State Summation" (e.g., classical utilitarianism) says they are equal. "Narrative" or "Prudential" views argue the declining life is worse (e.g., loss of hope, dignity, memory; violated expectations). **Can a sum even see it?** No, by design. A theory must choose if this matters.

  8.  **Scope of "Welfare":**
      *   **Requirement:** What constitutes welfare? Is it solely conscious experiences (hedonic)? Preference satisfaction? Objective goods (health, knowledge, relationships, achievement)? Some combination?
      *   **Case Forcing It:** Foundational. Determines what inputs go into the comparison. Implicit in all cases. *Camp Taste:* Defining the "currency" of comparison is the deepest theoretical choice.

  9.  **Handling Risk & Uncertainty (Optional but Important for Realism):**
      *   **Requirement:** Can the theory compare *expected* welfare under uncertainty? Does it require knowing outcomes for sure?
      *   **Case Forcing It:** Most real-world comparisons involve uncertainty about future states. A theory limited to certain outcomes has restricted applicability.

  **Addressing Your Specific Cases within Requirements:**

  *   **Case (a): Content Woman vs. Frustrated Man:** Forces **Completeness** (must rank or refuse), **Cardinality/Comparability**, and crucially highlights the **Sensitivity to Preference Satisfaction vs. Objective State** debate. It also touches on **Baseline** (is her contentment truly "positive" welfare if based on deprivation? Is his frustration "negative" even amidst objectively good circumstances?).
  *   **Case (b): Slow Rise vs. Long Decline:** Primarily forces the **Sensitivity to Temporal Structure** requirement and the **Scope of Welfare** (does welfare include narrative shape?). It challenges pure summation approaches (**Cardinality** focused only on additive moments).

  **The Requirement That Rules Out the Most Popular Proposals: Cardinality & Interpersonal Comparability.**

  *   **Why:** Many intuitively appealing or historically significant proposals struggle fundamentally here.
      *   **Preference-Based Ordinalism:** Standard microeconomics often treats utility as ordinal and non-comparable across persons. It *cannot* deliver interpersonal cardinal comparisons without strong (and controversial) additional assumptions.
      *   **Rawlsian Primary Goods:** Focuses on resources, not welfare itself. Comparing welfare based on primary goods requires the controversial assumption that similar bundles yield similar welfare levels for different people.
      *   **Capabilities Approach:** While rich, comparing overall capability *sets* cardinally across individuals is notoriously difficult. It often retreats to partial orderings or specific functionings.
      *   **Simple Hedonic Summation:** Requires the highly contested assumption that subjective feelings (pleasure/pain) are measurable and comparable on a common cardinal scale across individuals.
      *   **Rule Utilitarianism:** Often sidesteps direct interpersonal comparison by focusing on rules, but the rules themselves implicitly rely on some notion of comparable welfare consequences.

  **The Most Significant Joint Unsatisfiability: Preference Respect vs. Objective Baseline/Sensitivity**

  *   **The Conflict:** There's a deep tension between fully respecting an individual's *actual* preferences (Requirement 6 - Preference Sensitivity) and employing an objective baseline or list (Requirements 3 & 8) that might deem those preferences misguided or indicative of false consciousness/wrongful adaptation.
  *   **Manifestation in Case (a):**
      *   **Preference Respect (e.g., Desire Fulfillment):** The content woman is better off. Her preferences (for her simple life) are fully satisfied; the man's are frustrated.
      *   **Objective Baseline/List (e.g., Hedonic, Capabilities, Perfectionism):** The man *might* be judged better off. His frustrated ambitions could indicate higher objective potential (capabilities), richer experiences (even with frustration), or a life closer to an ideal of human flourishing, *despite* his dissatisfaction. Her contentment might be dismissed as based on ignorance or deprivation ("She doesn't know what she's missing," "Her preferences are stunted").
  *   **Why Unsatisfiable?** A theory cannot simultaneously:
      1.  Take an individual's *actual*, possibly adapted, preferences as the *sole* and *definitive* arbiter of their welfare (strong Preference Respect).
      2.  Insist on an *objective* standard (Baseline, Welfare Scope) that can override those preferences when deemed malformed or based on deprivation/oppression.
  *   **Consequence:** Theories are forced to choose a camp. Either they prioritize autonomy and subjective desire (risking endorsing the "happy slave" or "content housewife in oppressive society"), or they prioritize an objective conception of the good (risking paternalism by deeming individuals mistaken about their own welfare). **This is the core philosophical battleground underlying interpersonal comparison.**

  **Summary Checklist for Your Doc:**

  *   **Must Have (Non-Negotiable):** Completeness, Cardinality/Comparability, Baseline, Anti-Leveling Down, Symmetry.
  *   **Key Battlegrounds (Define Camps):** Preference Satisfaction vs. Objective State, Temporal Structure Sensitivity, Scope of Welfare.
  *   **Major Stumbling Block:** Cardinality/Interpersonal Comparability (rules out many proposals).
  *   **Fundamental Tension:** Jointly satisfying strong Preference Respect and an Objective Baseline/Sensitivity is impossible. Theories must choose.

  This framework provides the essential criteria to evaluate any proposed theory of interpersonal welfare comparison before diving into specific measures. Good luck with the reading group!
