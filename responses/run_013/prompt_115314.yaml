prompt: |-
  I sit on a labor tribunal that hears complaints under a statutory prohibition on relations of domination in employment. The statute leaves the phrase undefined, so the content of the prohibition has been built case by case, and the parties now appearing before us are citing our four decided cases against each other.

  In Kestrel Basin, the employer owned every house, the only store, and the only payroll within ninety miles. It had never evicted or fired anyone for complaining; grievances went to a company committee whose findings the owner was free to reject, and the workers' charter could be amended by the owner at will. We found a relation of domination and ordered the charter converted into a binding agreement with independent arbitration.

  In Ardent Logistics, comparable work was performed in a metropolitan area with dozens of competing employers, under a sectoral collective agreement and binding arbitration that the employer had no power to alter unilaterally. We found no domination, even though the supervisors there held at least as much formal authority to dismiss as the Kestrel Basin managers held.

  In the Dalal matter, a live-in caregiver's residence permit was tied to her employer, so that leaving meant removal from the country. The family was generous and treated her well, but she had no enforceable contract and no forum in which to contest anything. Domination.

  In the Whitcomb matter, adjunct instructors were paid by the course, were free to teach at several institutions in a dense market, and were covered by a systemwide agreement with arbitration that the administration could not change on its own. No domination.

  The case now before us concerns Northline, a freight-dispatch platform. Drivers own their trucks and can work for competing brokers or take direct contracts; most do, and demand for their services is strong. Northline sets load prices and assigns routes through a proprietary model, and its terms permit it to change the rate formula and to deactivate an account at any time. Deactivations are issued by the model. An internal review team exists, but it corrects only data-entry errors, does not disclose the criteria applied, and has reversed only a small fraction of the appeals brought to it. Drivers' counsel argues that this is Kestrel Basin with an app; the platform argues that it is Ardent Logistics with a different interface.

  I have to write the tribunal's opinion. Recommend a holding, name the closest of the four precedents, and set out the two or three rules of decision that fit all four of our earlier cases equally well. Say what each rule predicts about Northline, which rule we should adopt and why, and what further case would separate the rules cleanly. Lead with the holding in one sentence, write in American English, and keep the whole answer under 650 words. Do not cite any literature, statute, or decision beyond the ones I have described; where a general principle is doing work in your reasoning, state it in your own words. In no more than two sentences at the end, say whether these four precedents commit us to a conception of liberty that goes beyond simple non-interference, and then tell me which consideration would move you to the opposite holding and where your reasoning is most likely to fail.
reasoning: |-
  Okay, the user is a member of a labor tribunal dealing with a complex case about "relations of domination" in employment. They've described four precedents and now need to rule on Northline, a freight-dispatch platform. The key is to reconcile these cases into coherent rules while addressing the new scenario.

  First, I need to analyze the precedents. Kestrel Basin shows domination through total economic control - the employer owned housing, stores, and had unilateral power over rules. Ardent Logistics had no domination despite supervisory power because workers had alternatives and collective bargaining. Dalal involved domination through immigration dependency, even with good treatment, due to lack of recourse. Whitcomb found no domination because workers had market freedom and binding arbitration.

  The challenge is extracting consistent rules. After looking at these cases, three principles emerge: (1) Significant dependency on the employer for essential needs, (2) No meaningful recourse mechanisms, and (3) Lack of practical alternatives. These cover all four cases well.

  Now applying this to Northline. Drivers own their trucks and have strong market options - that suggests no domination like Ardent/Whitcomb. But Northline's algorithm controls vital aspects: pricing, assignments, and sudden deactivation with opaque review. The internal process only fixes data errors and rarely reverses decisions, so there's no real recourse. This creates unilateral control without accountability, mirroring Kestrel's power to change rules at will.

  The closest precedent is Kestrel Basin - not because of physical isolation, but due to the same combination of unilateral control and no effective recourse. Even though drivers have market alternatives, the platform's arbitrary power over their livelihood creates domination.

  For the holding, I'll state clearly that Northline creates a relation of domination, ordering independent arbitration for deactivations and rate changes. This follows naturally from the rules identified.

  I should also address the liberty question briefly at the end. Yes, this approach goes beyond non-interference by recognizing that domination can exist without direct coercion - through structural power imbalances and lack of safeguards. The opposing view might emphasize market freedom, but that overlooks how algorithmic control can undermine practical autonomy even when alternatives exist theoretically.

  The trickiest part is that market alternatives vs. unilateral control tension - if drivers had genuine recourse, the outcome might differ. A future case where workers have strong alternatives but no recourse could test this edge.
answer: |-
  **Holding:** Northline creates a relation of domination because its algorithm exercises unilateral, unreviewable control over drivers' essential economic terms and access to the platform, lacking effective recourse despite their market alternatives.

  **Closest Precedent:** *Kestrel Basin.*

  **Rules of Decision (Fitting All Four Cases):**
  1.  **Dependency/Unilateral Control:** Does the employer hold exclusive or overwhelmingly dominant control over the worker's essential economic livelihood or fundamental status (e.g., job, income source, residence, legal right to remain), coupled with the power to alter those terms unilaterally?
  2.  **Absence of Effective Recourse:** Does the worker lack any meaningful, independent, and enforceable forum or process to challenge adverse decisions affecting their essential interests?
  3.  **Practical Alternatives:** Does the worker lack practical, accessible alternatives to escape the employer's control without suffering severe, disproportionate harm to their essential livelihood or status?

  **Application to Northline:**
  1.  **Dependency/Unilateral Control:** Northline unilaterally sets the core economic term (rate formula) and holds exclusive control over the driver's access to its platform (via deactivation) for obtaining work. It can change these essentials at will.
  2.  **Absence of Effective Recourse:** The internal review process is ineffective. It only corrects data errors, operates opaquely without disclosing criteria, and rarely reverses deactivations, failing to provide a meaningful challenge to Northline's control.
  3.  **Practical Alternatives:** Drivers *have* practical alternatives (other brokers/direct contracts) and strong market demand, meaning leaving Northline does not inflict severe disproportionate harm (*not* met here).

  **Adopted Rule and Why:** Rule 2 (**Absence of Effective Recourse**) is paramount and should be adopted. All four cases turn on the presence or absence of a check against the employer's power over essentials. Kestrel and Dalal lacked any real recourse, leading to findings of domination. Ardent and Whitcomb had binding arbitration (effective recourse), leading to no domination findings, *regardless* of the degree of formal authority or dependency (supervisors' power in Ardent, visa tie absent in Whitcomb). Northline, like Kestrel, grants the employer unfettered, unreviewable power over essentials, despite drivers' market options. The core evil is unchecked unilateral power over the worker's vital interests.

  **Case Separating the Rules:** A case where a worker has no practical alternatives (high dependency) *but* possesses genuine, independent arbitration to challenge adverse decisions (effective recourse). Rule 2 (Recourse) would predict *no domination* (like Ardent/Whitcomb), while Rule 1 (Dependency) would predict *domination*. This highlights the primacy of recourse.

  **Liberty and Potential Weaknesses:**
  Yes, these precedents commit us to a conception of liberty demanding not just non-interference, but also institutional safeguards against arbitrary power over essential aspects of working life. The consideration most likely to move me to the opposite holding (no domination) is the drivers' strong market alternatives and lack of dependency on Northline alone (Rule 3), suggesting freedom lies in exit; my reasoning is most likely to fail if market alternatives are deemed sufficient to negate domination regardless of procedural unfairness *within* the relationship.
