  I'm a high school junior working through Douglas Hofstadter's Gödel, Escher, Bach on my own, and I've hit something in the chapter on the MIU system that has turned into a running argument in my study group, so I would like a careful answer from someone who really knows this material rather than a summary. As I understand the puzzle: you begin with the string MI, and the only moves allowed are these four. First, you may add a U to the end of any string that ends in I, so MI becomes MIU. Second, if a string begins with M, you may double everything after that M, so MIU becomes MIUIU. Third, you may replace any occurrence of the triple III with a single U. Fourth, you may delete any occurrence of UU. The challenge is to turn MI into MU. I have read that it cannot be done, and I have seen the style of argument that shows it: you stop grinding through derivations, notice that the number of I's in any string you can reach is never a multiple of three, and observe that MU has zero I's. That step of standing back and reasoning about the system instead of inside it is the move I keep hearing called jumping out of the system, and it is supposed to be the heart of what Hofstadter is doing with this whole puzzle.

  Here is the thing I cannot get past. If a person can jump out of the system and see the answer in a few lines, doesn't that show the mind has a power no formal system has — that we can step outside any rulebook and see what a machine stuck inside the rules never could? And if the four rules are the only obstacle, then why can't a sufficiently clever thinker jump out and simply derive MU — or jump out into a larger, richer system and derive it there? It seems to me that the unsolvability is only unsolvability from the inside, and that anyone who can get outside has solved it. One friend in my group insists the jump proves minds transcend machines, and another insists it is a parlor trick that proves nothing at all. I want to know which of them is closer to right, and I want to understand exactly what this puzzle does and does not establish about the difference between reasoning inside a system and reasoning about one.

  Please take on the role of an expert in mathematical logic and the philosophy of mind who has taught this material for years and can explain it without hand-waving. Before you answer, take stock of the assumptions built into the way I have set the question up, and tell me plainly if any of my framing is mistaken; I would much rather be corrected than have my question answered as I posed it. Then lay out your reasoning step by step, addressing both of my friend's positions and saying what each one gets right and wrong. Write in American English, in continuous prose rather than bullet points, at a level a motivated high school student can follow, and keep the discussion tied to the concrete puzzle rather than drifting into general talk about creativity.
