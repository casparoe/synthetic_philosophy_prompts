prompt: |-
  I write about science and ideas for a general-interest outlet — long features, mostly — and I keep ending up in the same spot. Some economist or historian or behavioral scientist tells me that a region's, or a country's, or a company's culture explains something big: why growth stalled there, why the innovation clustered here, why these people save and those people don't. And I keep noticing that by the time the piece is filed, culture has quietly become the thing that's left over after you account for everything you can actually measure, and it's doing an enormous amount of causal work with almost no scrutiny. Weber is usually hovering in the background, sometimes named, sometimes just a vibe.

  I want a procedure I can run, fast, on a specific claim, before I write a sentence of the form: this culture caused that outcome. Not a seminar on Weber — a checklist.

  Some framing I want you to build on, because I think these are the load-bearing bits and I dont want them simplified away. Weber, as I understand him, wasn't really offering a covering-law causal claim; he was reconstructing an elective affinity between a set of religious ideas and a set of economic practices, and he was insistent that the ideas needed carriers — social strata, congregations, families, institutions — or nothing happens. His image, roughly, is that material interests supply the motive power and ideas set the track, like a switchman. There's also a rival reading of his own historical case that I keep running into: that what looked like a religious ethic doing the work was really literacy doing the work, since the Reformation pushed people to read scripture for themselves, and literate populations are just better at the stuff that looks like a work ethic. And I know enough to know that when you compare places that turned Protestant with neighboring places that didn't, the economic story gets a lot shakier than the textbook version suggests.

  So: act as a philosopher of social science who also knows the empirical literature on this. Think carefully and slowly. Before you write the procedure, brainstorm for a bit — in the output, briefly — the distinctions a working journalist has to keep straight here: causal versus interpretive adequacy; a value being present versus a value actually doing work; culture as cause versus culture as a label for a bundle of unmeasured institutions; a mechanism story versus a correlation story; and what would count as evidence against a culture claim. Then give me the procedure.

  What I need from it:

  - 8 to 12 questions, in the order I should ask them, each phrased so I can answer it with the material in front of me — a paper, a book, an interview, a dataset, a press release.
  - For each: what a pass looks like, what a partial looks like, what a fail looks like. Where a fail is fatal, say so and say stop.
  - A stopping rule on each branch, so I know when to drop the causal framing and write something weaker instead — a correlation, an interpretive account, a contested thesis, a story about what people believed about themselves.
  - Mark clearly every step where I've left rule-application and entered judgment territory. I want the procedure to be honest about where it stops being a procedure.
  - It has to survive contact both with a claim where the culture variable is doing real explanatory work and with one where it's a fig leaf.

  Then run it, out loud, on three cases:

  1. The classic historical thesis itself — Protestant ethic, rise of capitalism — as the thing I'm about to write a feature about. I suspect the procedure will tell me I can't write the strong causal version, and if that's where it lands, say so and tell me exactly what I can write instead.
  2. A contemporary claim of the form: this country or region is poorer because its culture doesn't value deferred gratification, or long-term investment, or impersonal trust. Make up a plausible version; don't lean on a specific study I'd have to go track down.
  3. A claim at the scale of a firm or a small place: this company's, or this town's, culture of X explains why it outperformed its neighbor, where the two are otherwise similar on paper.

  For each run, show the questions being answered, where the claim passes, where it stalls, and where you'd flag that the honest version of the story is alot weaker than the pitch I got.

  Finally, tell me what the procedure can't do — the claims it will wave through that it shouldn't, and the ones it will kill that deserve a hearing — and give me two or three sentences I could paste into a draft to signal that a culture claim is contested without turning the piece into a methodology lecture.
reasoning: |-
  Okay, the user is a science journalist who writes long-form features and keeps encountering "culture" as a catch-all explanation. They want a practical checklist to evaluate culture-cause claims before writing. 

  Hmm, their frustration is palpable - they notice how culture often becomes an unscrutinized residual explanation. They've clearly done homework on Weber (mentioning elective affinity, carriers, the literacy counterargument) but need operational tools, not theory. 

  Key constraints from their ask:
  • Must be journalist-practical (8-12 Qs with pass/fail thresholds)
  • Must preserve nuanced distinctions (causal vs interpretive, values present vs active etc.)
  • Needs stopping rules and clear "judgment zone" markers
  • Must handle both legit and bogus culture claims
  • Requires demo on 3 cases including Weber's thesis

  *Brainstorming distinctions:*
  First, causal vs interpretive adequacy - is this claiming mechanism ("culture did X") or meaning ("they saw themselves as Y")? Big difference. 
  Second, values present ≠ values doing work - just because people say they value thrift doesn't mean it caused their savings rate. 
  Third, culture-as-cause vs culture-as-label - is "culture" just masking unmeasured variables (e.g. literacy in Protestant case)? 
  Fourth, mechanism vs correlation - does evidence show how culture operated or just coincidence? 
  Fifth, falsifiability - what evidence would disprove this? If nothing, red flag.

  *Procedure design challenge:* How to make philosophy of social science actionable for deadline writing. Need questions that:
  1. Smoke out causal overreach early (Qs 1-3)
  2. Force specification of mechanism (Q4-6) 
  3. Check for rival explanations (Q7-8) 
  4. Handle scale issues (Q9)
  5. Assess empirical support (Q10-12)

  *Critical judgment points:* 
  - Q4 (mechanism plausibility) will be subjective but necessary 
  - Q7 (rival explanations) requires domain knowledge 
  - Q12 (falsifiability) tests scientific rigor

  *For the demos:*
  Case 1 (Weber): Expect failure on mechanism specificity (Q4) and rival explanations (Q7). Fallback position: elective affinity framing. 
  Case 2 (national culture/poverty): Will fail on homogeneity (Q9) and institutional confounds (Q7). Fallback: correlation with interpretive caveats. 
  Case 3 (firm culture): Most likely to pass if ethnography exists (Q10) and controls are tight (Q8), but still needs "carriers" specified (Q6).

  *Biggest risks:* 
  Procedure might miss: 
  - Cultural explanations that ARE valid but lack direct evidence (e.g. historical claims) 
  - Claims where culture is proxy for structural factors it can't disentangle
  Will over-penalize: 
  - Emergent cultural explanations without established literature 
  - Qualitative-only studies

  *Final touch:* Those 2-3 draft sentences need to flag controversy without derailing narrative. Should mirror their Weber framing - "carriers," "elective affinity," "rival factors."
answer: |-
  Here's a procedural checklist for evaluating "Culture Caused Outcome X" claims, designed for journalistic rigor. It prioritizes falsifiability, mechanism specification, and ruling out confounders. The **core distinctions** you must track:

  1.  **Causal vs. Interpretive Adequacy:** Does the claim explain *how* change happened (causal), or does it make the outcome *meaningful/intelligible* (interpretive)? Weber aimed for both.
  2.  **Values Present vs. Values Doing Work:** Observing a value (e.g., "thriftiness") ≠ proving it caused the outcome. *How* did it translate into action?
  3.  **Culture-as-Cause vs. Culture-as-Residual:** Is "culture" a specific mechanism, or a label for unexplained variance after measurable factors (institutions, policies, resources) are accounted for?
  4.  **Mechanism Story vs. Correlation Story:** Does evidence show the *process* linking culture to outcome, or just co-occurrence?
  5.  **Evidence Against:** What finding would falsify the claim? (e.g., same outcome without the cultural trait; same cultural trait without the outcome; a rival factor better explains variation).

  ---

  ### The Culture Claim Interrogation Procedure (8-12 Questions)

  **Ask these in order. Stop if you hit a "FATAL FAIL."**

  1.  **Is the specific cultural element (value, norm, practice, belief) clearly defined and observable?**
      *   *Pass:* Concrete description (e.g., "emphasis on individual scriptural interpretation," "ritualized gift-exchange in business," "weekly firm-wide problem-solving sessions"). Observable indicators are suggested (texts, rituals, measurable behaviors, explicit statements).
      *   *Partial:* Vague term used ("entrepreneurial spirit," "fatalism," "trust"). Requires judgment to interpret.
      *   *Fail:* Wholly amorphous ("national character," "just their culture"). **FATAL FAIL. STOP.**
      *   *Judgment Zone:* Assessing concreteness.
      *   *Stop/Weaken If Fail:* Abandon causal claim. Write interpretively ("Some attribute X to a perceived cultural trait Y...").

  2.  **Is the outcome clearly defined and measurable?**
      *   *Pass:* Specific, measurable outcome (e.g., GDP growth rate 1700-1850, patent filings per capita 2010-2020, employee retention rate vs. industry avg).
      *   *Partial:* Outcome described but measurement complex/contestable (e.g., "innovation," "social cohesion").
      *   *Fail:* Vague outcome ("success," "decline," "dysfunction"). **FATAL FAIL. STOP.**
      *   *Judgment Zone:* Defining meaningful measurement for complex outcomes.
      *   *Stop/Weaken If Fail:* Abandon causal claim. Describe perceptions or contested definitions.

  3.  **Is the causal claim explicit? (i.e., "Culture C *caused* Outcome O")?**
      *   *Pass:* Source explicitly states C caused O, or strongly implies necessary/sufficient condition.
      *   *Partial:* Source suggests C is "linked to," "associated with," or "important for" O without clear causal language.
      *   *Fail:* Source only describes C and O coexisting or interprets O through C without causal assertion.
      *   *Judgment Zone:* Interpreting authorial intent.
      *   *Stop/Weaken If Partial/Fail:* Frame as correlation, association, or interpretive lens, not causation. ("Scholars see a link between C and O"; "O is often interpreted through the lens of C").

  4.  **Is a plausible mechanism linking C to O described? (How does C *actually produce* O?)**
      *   *Pass:* Clear, logical chain described (e.g., "Belief in predestination → anxiety over salvation → methodical work as sign of election → capital accumulation"). Includes *how* beliefs translate into actions.
      *   *Partial:* Mechanism implied but vague ("values led to behaviors that caused O"). Needs inference.
      *   *Fail:* No mechanism offered; C and O simply juxtaposed. **FATAL FAIL. STOP.**
      *   *Judgment Zone:* Assessing plausibility and specificity of the mechanism. (Does it make sense? Is it detailed?).
      *   *Stop/Weaken If Fail:* Abandon causal claim. Treat as an interpretive association or description of context.

  5.  **Are "carriers" of the culture specified? (Weber's point: Who embodied/spread/enforced C?)**
      *   *Pass:* Specific groups, institutions, or practices identified as transmitting/embodying the cultural element (e.g., Puritan congregations, apprenticeship systems, specific management layers, community elders).
      *   *Partial:* Carriers implied (e.g., "the people," "society") but not specified.
      *   *Fail:* No carriers mentioned; culture floats disembodied. **STRONG WARNING - PROCEED WITH EXTREME CAUTION.**
      *   *Judgment Zone:* Identifying plausible social actors/institutions.
      *   *Stop/Weaken If Fail/Partial:* Frame cautiously: "The claim rests on a cultural element C, though how it was sustained and transmitted isn't detailed." Consider abandoning strong causality.

  6.  **Is there evidence C was *actively present/practiced* in the relevant population/place/time *before or during* O's emergence?**
      *   *Pass:* Direct evidence cited (contemporary texts, records of practices, surveys, ethnography) showing C's presence *prior* to or concurrent with the *onset* of O.
      *   *Partial:* Evidence from slightly later period, or indirect evidence (e.g., later memoirs, idealized descriptions).
      *   *Fail:* Evidence only from after O was established, or assumed present based on outcome or stereotypes. **FATAL FAIL. STOP.**
      *   *Judgment Zone:* Evaluating source reliability and contemporaneity.
      *   *Stop/Weaken If Fail:* Abandon causal claim. C might be a *consequence* of O or later justification.

  7.  **Have major rival explanations been considered and addressed? (Institutions, geography, policies, economics, history, demographics, technology)?**
      *   *Pass:* Source explicitly discusses and rules out (or controls for) key alternative factors (e.g., "While literacy increased, we control for it and find C still predicts O"; "Unlike neighboring regions, this area lacked mineral resources").
      *   *Partial:* Mentions rivals briefly but doesn't seriously engage or test against them.
      *   *Fail:* Ignores obvious rival explanations. **FATAL FAIL. STOP.**
      *   *Judgment Zone:* Identifying *relevant* rival explanations.
      *   *Stop/Weaken If Fail/Partial:* Frame as a contested or partial explanation. State: "Proponents emphasize C, but critics point to factors like Rival1 or Rival2."

  8.  **Is there comparative evidence? (e.g., O differs where C differs, controlling for other factors?)**
      *   *Pass:* Systematic comparison showing O correlates with C across cases (regions, firms, groups) *after* accounting for key differences (e.g., matched pairs, statistical controls, natural experiments).
      *   *Partial:* Anecdotal comparison ("Look at Country A vs. Country B"), or comparison without controlling for confounders.
      *   *Fail:* No comparison offered; single case study presented as proof.
      *   *Judgment Zone:* Evaluating quality of comparison/controls.
      *   *Stop/Weaken If Fail/Partial:* Frame as suggestive or interpretive within one context. Avoid broad causal claims. "Case X shows C alongside O, but broader generalization requires more comparative evidence."

  9.  **Is the culture portrayed as homogeneous? Does the claim acknowledge internal variation/contestation?**
      *   *Pass:* Acknowledges diversity of beliefs/practices *within* the group/place and explains why the dominant C still prevails or matters.
      *   *Partial:* Mentions variation but doesn't integrate it into the causal story.
      *   *Fail:* Treats the culture as monolithic, uniform blob. **STRONG WARNING - PROCEED CAUTIOUSLY (Reduces explanatory power).**
      *   *Judgment Zone:* Assessing heterogeneity and its relevance.
      *   *Stop/Weaken If Fail:* Significantly weaken the claim. Acknowledge oversimplification: "While often described as having culture C, the reality was more varied; the claim focuses on a dominant strand."

  10. **What is the quality & nature of the evidence supporting C's role?**
      *   *Pass:* Multiple lines of evidence (historical records, ethnography, surveys, experiments, process tracing) triangulating C's presence and link to O. Methodology transparent.
      *   *Partial:* Relies primarily on one type of evidence (e.g., only interviews, only economic stats interpreted culturally) or methodology opaque.
      *   *Fail:* Anecdotes, stereotypes, or circular reasoning (O is proof of C). **FATAL FAIL. STOP.**
      *   *Judgment Zone:* Evaluating research methodology quality/reliability.
      *   *Stop/Weaken If Fail/Partial:* Frame evidence as limited, suggestive, or contested. Avoid strong causal language.

  11. **Could the cultural element be a RESULT of the outcome, or a justification for it, rather than the cause?**
      *   *Pass:* Source provides evidence/timing/logic ruling out reverse causality (C clearly preceded O; O unlikely to cause C).
      *   *Partial:* Reverse causality is possible but not addressed.
      *   *Fail:* Evidence/timing equally or more consistent with reverse causality. **FATAL FAIL. STOP.**
      *   *Judgment Zone:* Establishing temporal precedence and causal direction plausibility.
      *   *Stop/Weaken If Fail/Partial:* Frame as a potential consequence or reinforcing factor: "C may have been shaped by O as much as it shaped it," or "C provided a meaning system for O."

  12. **What evidence WOULD falsify this specific culture-causation claim? Is such evidence discussed or sought?**
      *   *Pass:* Clear falsification criteria stated (e.g., "Finding similar growth in Catholic regions with high literacy," "A firm with C failing," "An institution blocking the mechanism"). Evidence actively sought.
      *   *Partial:* Falsification implied but not explicit.
      *   *Fail:* No discussion of falsification; claim seems unfalsifiable. **STRONG WARNING - PROCEED WITH SKEPTICISM.**
      *   *Judgment Zone:* Identifying plausible counter-evidence.
      *   *Stop/Weaken If Fail:* Frame as a non-falsifiable interpretive lens or a contested thesis. Avoid presenting as settled science.

  ---

  ### Procedure Runs

  **Case 1: Protestant Ethic & Rise of Capitalism (Weber's Thesis as Claimed Causally)**

  1.  **Defined Culture?** PASS ("Worldly asceticism," "methodical work as calling," predestination anxiety).
  2.  **Defined Outcome?** PASS (Rise of modern rational capitalism, capital accumulation).
  3.  **Explicit Cause?** PASS (Weber argues elective affinity becomes causally significant).
  4.  **Mechanism?** PARTIAL (Belief → Anxiety → Work → Accumulation is described, but *how* this scales from individuals to systemic capitalism is less specified. Judgment: Plausible but needs carriers).
  5.  **Carriers?** PASS (Puritan sects, congregations, family discipline explicitly discussed).
  6.  **C Present Before O?** PARTIAL/FAIL (Debated. Ascetic Protestantism emerges alongside early capitalism; hard to prove strict precedence. Judgment: Tight correlation, causation hard to pin).
  7.  **Rivals Considered?** PARTIAL (Weber engages rivals like technology & law, but literacy/material conditions arguably underplayed. Literacy rival noted upfront). **FAIL? (Judgment: Major rival exists).**
  8.  **Comparative Evidence?** PARTIAL (Weber uses comparisons, but critics show Protestant regions didn't consistently outperform Catholic neighbors long-term, especially controlling for literacy/trade).
  9.  **Homogeneity?** FAIL (Treats "Protestantism" and "Capitalism" as overly monolithic).
  10. **Evidence Quality?** PARTIAL (Brilliant interpretive historical sociology, but lacks modern statistical controls).
  11. **Reverse Causality?** PARTIAL (Weber tries to rule out, but linkage is recursive; capitalism may shape religion too).
  12. **Falsifiable?** PASS (Finding systematic capitalism without ascetic Protestantism, or ascetic Protestantism without capitalism falsifies core claim. Evidence like Catholic Flanders exists).

  **Verdict:** **Claim Fails** the causal litmus test. Multiple partials/fails (6, 7, 8, 9, 10), especially on rivals (literacy/material factors), comparative evidence, and strict precedence. Mechanism needs scaling via carriers.
  **What to Write Instead:** "Weber famously proposed an 'elective affinity' between ascetic Protestant beliefs and the spirit of modern capitalism, suggesting religious anxieties fueled methodical work and accumulation. While influential, historians now emphasize the complex interplay of factors like rising literacy, urbanization, and existing trade networks. The Protestant ethic might have shaped *how* capitalism emerged in some contexts, rather than being its sole engine, and its impact varied greatly." (Focus on elective affinity, carriers, rivals, contested impact).

  **Case 2: Contemporary Claim - "Country X is poor because its culture devalues long-term investment."**

  1.  **Defined Culture?** PARTIAL/FAIL (Likely vague - "short-termism," "lack of future orientation"? What specific norms? How observed? Often stereotypical). **FATAL FAIL? (Judgment: Usually fails this step).**
  2.  **Defined Outcome?** PASS (Low GDP/capita, low investment rates).
  3.  **Explicit Cause?** PASS (Source claims culture *causes* poverty).
  4.  **Mechanism?** FAIL (Rarely specified beyond "people don't save/invest"). **FATAL FAIL. STOP.**
  5.  **Carriers?** FAIL (Almost never specified).
  6.  **C Present Before O?** FAIL (Assumed based on poverty; circular).
  7.  **Rivals Considered?** FAIL (Ignores: weak institutions, corruption, colonial history, resource curse, unstable policies, lack of credit access, inequality).
  8.  **Comparative Evidence?** PARTIAL (Might point to richer neighbor with "different culture," ignores vast institutional/structural differences).
  9.  **Homogeneity?** FAIL (Assumes national cultural uniformity).
  10. **Evidence Quality?** FAIL (Often stereotypes, aggregated stats misinterpreted).
  11. **Reverse Causality?** FAIL (Poverty likely fosters short-term survival strategies, shaping observable behaviors mislabeled as "culture").
  12. **Falsifiable?** FAIL (Unfalsifiable; any behavior can be interpreted as proof).

  **Verdict:** **Catastrophic Failure.** Fails multiple steps fatally (1, 4, 5, 6, 7, 9, 10, 11, 12). Culture here is a residual/residual *and* potentially victim-blaming.
  **What to Write Instead:** "Some theories attribute Country X's economic struggles to cultural factors like a perceived focus on immediate needs. However, economists and anthropologists emphasize structural barriers: [mention 2-3 key rivals like unstable institutions, lack of credit, historical legacies]. Observing behaviors like low savings might reflect rational responses to these conditions rather than deep-seated cultural values." (Explicitly name rivals, highlight structural factors, question the cultural label).

  **Case 3: Firm/Town Claim - "Company A outperformed Company B due to its culture of open innovation." (Neighboring towns/similar firms)**

  1.  **Defined Culture?** PASS (e.g., "Open Innovation": Regular cross-departmental hackathons, formal idea submission platform, leadership rewards experimentation even if fails).
  2.  **Defined Outcome?** PASS (e.g., Higher patent output, faster new product development cycles, better employee retention in R&D vs. competitor B).
  3.  **Explicit Cause?** PASS (Claim: Culture *caused* outperformance).
  4.  **Mechanism?** PASS (Hackathons → cross-pollination → new ideas; Idea platform → employee engagement → more submissions; Reward policy → psychological safety → more experimentation → more viable products).
  5.  **Carriers?** PASS (Leadership team instituting policies, mid-managers running hackathons, specific HR practices).
  6.  **C Present Before O?** PASS (Evidence: Policy docs dated before performance gap widened, employee surveys showing perception shift after initiatives started).
  7.  **Rivals Considered?** PASS/GOOD (Source compares: similar size, market, tech base, location; rules out key talent poaching or unique IP advantage as primary drivers. Attributes difference to culture/systems).
  8.  **Comparative Evidence?** PASS (Direct comparison to similar Competitor B lacking these specific practices, showing lower outcomes despite similar resources).
  9.  **Homogeneity?** PARTIAL (Likely acknowledges *some* resistance or variation, but argues dominant culture drives results).
  10. **Evidence Quality?** PASS/GOOD (Internal performance data, employee surveys over time, process documentation, comparison to competitor B metrics).
  11. **Reverse Causality?** PASS (Performance surge followed cultural initiatives; culture change preceded outcome shift).
  12. **Falsifiable?** PASS (Finding Competitor B adopting similar practices without gains; finding Company A's performance dropping while practices continued; identifying a different primary cause).

  **Verdict:** **Passes.** Solid on mechanism, carriers, timing, comparison, rivals, evidence. Homogeneity is the weakest point but acknowledged. This is a strong case for culture *as implemented system* causing outcome.
  **What to Write:** "Analysts credit Company A's 'open innovation' system—including cross-functional hackathons, a formal idea platform, and leadership tolerance for smart failures—as a key driver of its higher patent output and faster product development compared to rival Company B. While both firms operate in the same sector and location, Company A's deliberate cultural and structural changes, initiated in [Year], preceded its marked performance gains." (Confidently state the link, emphasize the *system* and *deliberate actions*).

  ---

  ### What the Procedure Can't Do (Limitations)

  *   **Wave Through False Positives:** Might pass claims with excellent *narrative* coherence and apparent controls that mask a deep, unmeasured confounder (e.g., an unobserved leader's influence masked as "culture").
  *   **Kill Valid but Imperfectly Studied Claims:** Might fail valuable historical or ethnographic claims lacking modern statistical controls or perfect falsification evidence, even if the interpretive insight is profound (e.g., some aspects of Weber).
  *   **Handle Extreme Complexity:** Struggles with claims where culture is deeply entangled with structure in recursive, path-dependent ways over long periods.
  *   **Judge Ultimate "Truth":** It assesses robustness and falsifiability, not metaphysical certainty.

  ---

  ### Draft Sentences for Signaling Contestation

  1.  **For Causal Claims:** "While proponents point to [Cultural Element] as a driver of [Outcome], the thesis remains contested; critics argue factors like [Rival 1] or [Rival 2] offer more fundamental explanations, or that the cultural traits may be as much a consequence as a cause."
  2.  **For Interpretive Claims:** "Understanding [Event/Phenomenon] through the lens of [Culture] provides a compelling narrative of [Meaning], though historians/scholars debate the relative weight of culture versus institutions, economics, or contingency."
  3.  **For Specific Cases:** "The idea that [Specific Culture] caused [Specific Outcome] hinges on complex chains of influence and contested evidence; while elements of the story resonate, scholars emphasize the crucial role of [Key Carrier/Rival Factor] and the danger of oversimplifying diverse communities." (Adapt Weber example).
