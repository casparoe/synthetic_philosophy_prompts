  2. If you have ODD(X), you can derive EVEN(Xa). [number plus one]

  3. If you have EVEN(X) and EVEN(Y), you can derive EVEN(XY) [concatenation: the number represented by XY is the sum, and even+even=even]
  4. Similarly, ODD(X) and ODD(Y) -> EVEN(XY) [odd+odd=even]
  5. EVEN(X) and ODD(Y) -> ODD(XY)
