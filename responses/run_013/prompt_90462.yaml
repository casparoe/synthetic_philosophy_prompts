          double "a" -> "aa" ( which is also an axiom, but new derivation)
          double "aa" -> "aaaa"
          double "aaaa" -> "aaaaaaaa", etc.

     Can they derive " a a a "? No.

     Observer says: " a a a " cannot be derived.

     Correct.

     The activity should work.

     We'll go with this design.
