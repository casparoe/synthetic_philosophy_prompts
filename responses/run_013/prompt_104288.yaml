prompt: |-
  I run the collection side of a mid-sized city museum — I'm the registrar, so anything that goes on display or out on loan passes my desk. Four or five times a year I have to make a call on an object where "is this the original?" is basically the whole question, and right now I do it by gut, inconsistently, and then whoever shouts loudest wins — curators, developement, the director, sometimes a donor. Cases from the last two years: a marble head re-carved and re-nosed in the 18th century so maybe a third of the surface is later work; a 17th-century panel where the painting is fine but somebody added a signature around 1900; a bronze described to us as a Roman cast after a lost Greek original, next to a 20th-century cast from the same mould that the donor insists is "the same thing"; a manuscript gallery where we display high-quality facsimiles because the real ones can't take the light; a lender offering an "original" impression from a plate that was re-struck after the artist died.

  I want a decision procedure I can actually run on these, grounded in what philosophy of art has worked out about copies, forgeries, restoration, and why originals matter at all. The questions to ask in order, what counts as a sufficient answer to each, where it stops with a clean no or a clean yes, and where it hands the decision to a person because the issue is values rather than facts. Please be honest about which of my criteria are just institutional fear dressed up as principle. I know the standard distinction between art forms where the notation fixes the work (any copy of the novel is the novel, any competent performance of the score is the piece) and forms where the particular object's history of production is part of what the work is — I want that distinction doing real work in the procedure, not just named. Same for the idea that a forgery can be perceptually perfect and still be worse as art, and that what separates a forgery from an honest reproduction is mostly whether the audience is being told.

  The procedure should also survive the weird cases: a thing made in antiquity as a fake of an even older thing, so the fake is itself the genuine antique; a later copy that's our only evidence of a lost original; an object whose "original" state nobody agrees on because it's been restored three times; a living tradition where "the original" isn't how the makers think about the object at all.

  Then run it on three of my cases — the 18th-century-restored marble, the added signature, and the facsimile gallery — and include at least one where the answer is something I don't want to hear, because I suspect one of our star objects comes out of this needing a label I can't put on it without the director having a fit.

  Practical stuff: I've got about two hours per object, no lab, no money for a conservator's report every time, and I can't bring in outside experts before the call. If the procedure says "consult the conservator" at every step it's useless to me. I'm the one signing off, with the director's rubber stamp, and once a year the board asks why we spent money on something, so it has to end in a decision I can write down in a paragraph and defend. And dont give me citations or a reading list — I can't look anything up and I'd rather have the reasoning than the references. Don't hedge every step into "it depends"; if a step is a judgment call, mark it as one and say what kind of judgment it is.
reasoning: |-
  Okay, the user is a museum registrar dealing with authenticity questions. They need a practical decision procedure grounded in art philosophy. Let me start by understanding their pain points. They currently rely on gut feeling and internal politics, which is inconsistent. They want a structured method that uses philosophical concepts like the ontology of artworks and the distinction between types of art forms. 

  First, I need to recall key philosophical ideas. Nelson Goodman's distinction between autographic and allographic art is crucial here. Autographic works depend on the original object's history, like paintings, whereas allographic works, like music or literature, can be copied without losing authenticity. That should be a core part of the procedure. Also, the difference between forgeries (deceptive) and honest reproductions matters. 

  The user mentioned specific cases: a restored marble head, a painting with a later signature, and facsimiles in a gallery. They want the procedure applied to these, including an outcome that might be unpopular. They also need it to handle edge cases, like ancient fakes or objects with multiple restorations. 

  Practical constraints: no lab, limited time (2 hours per object), no external experts. So the procedure must rely on observable facts and available documentation. Steps should avoid conservator consultations unless absolutely necessary. The end result must be a defensible decision in a paragraph. 

  I should structure the procedure into clear steps. Start with ontology: is the work allographic or autographic? For autographic works, the physical object's history is part of the work. Then check for restoration: is it reversible? Does it alter the work's identity? Next, deceptive intent: was there an attempt to mislead? Provenance and institutional context also matter. 

  Applying this to the marble head: it's autographic. Much of the surface is 18th-century restoration. Since it's not reversible and alters the form, it's a derivative work. The original is lost, so it's a restoration piece, not the original. For the painting, the signature added later is deceptive. Removing it might be possible, so the painting itself is original, but the signature is a forgery. The facsimiles are allographic if the originals exist elsewhere. Displaying them as stand-ins is honest, so acceptable with clear labeling. 

  The user's deeper needs include institutional accountability and avoiding disputes. They might fear backlash from directors or donors. The procedure should provide clear justifications to defend decisions. Highlighting values versus facts steps helps when politics come into play. Also, calling out institutional fears, like reluctance to downgrade a star object, is necessary. 

  Edge cases: ancient fakes are genuine artifacts of their time, so valued as such. Copies of lost originals are evidence, not the original. Multiple restorations require defining the work's identity based on scholarly consensus. 

  The procedure must be efficient. Steps like examining reversibility or consulting documents can be done in-house. Judgment calls are marked, so the user knows when to involve stakeholders. Ending with a clear label and justification meets their reporting needs. 

  Testing on the marble head shows it's not fully original, which might upset the director. But the reasoning is solid: irreversible alterations change the work's identity. The user needs to present this confidently, using the procedure as a shield against pressure. Emphasizing that values-based decisions are for the institution to make, not just the loudest voice, addresses their conflict issue.
answer: |-
  Here's a practical decision procedure grounded in core philosophical concepts, designed for speed and clarity. It prioritizes **ontological status** (what *kind* of thing is the work?) and **intentional history** (what happened to it, and why?), filtering out institutional noise.

  **The Decision Procedure: Authenticity & Display Status**

  1.  **ONTOLOGY: What is the fundamental nature of the work?**
      *   **Question:** Is the work **Allographic** (defined by a notation/score/plan, where any correct instance *is* the work - e.g., novel, symphony, blueprint) or **Autographic** (defined by the unique history of its material creation - e.g., painting, unique sculpture, handwritten manuscript)?
      *   **Evidence:** Look at the *artist's medium & intent* and the *art form's conventions*. A printed book is allographic; the author's manuscript is autographic. A cast sculpture *from an original mold created by the artist* is often considered autographic *if the cast was made under the artist's supervision/authority* (the mold is part of the "notation"). A later cast from the same mold is not. A unique oil painting is autographic.
      *   **Sufficient Answer:** Clear identification of the art form and its standard ontology. (Judgment Call: Requires understanding art-historical conventions. If genuinely ambiguous, proceed to Step 2 cautiously).
      *   **Outcome:**
          *   **Allographic:** Move to Step 4 (Intent & Deception). The "originality" of the specific physical copy is usually irrelevant to the work's identity (e.g., any printed copy of "Moby Dick" *is* "Moby Dick"). Display status depends on context/deception.
          *   **Autographic:** Proceed to Step 2. The specific object's history matters critically.

  2.  **AUTOGRAPHIC INTEGRITY: Has the core material substance undergone irreversible, identity-altering change?**
      *   **Question:** Is a significant portion of the original artist-created material (the "fabric") still present and constitutive of the work's form? Have later additions/changes fundamentally altered the work's intended form, meaning, or artistic achievement *in a way that cannot be reversed without loss*?
      *   **Evidence:** Visual inspection for obvious restoration, replacement, addition. Consider scale and location (e.g., a replaced nose vs. in-painting a small scratch). Ask: "If I removed the later work, would the original artist's intended work be substantially recovered, or is it lost/destroyed?" Ignore reversible surface dirt/overpaint.
      *   **Sufficient Answer:** "Yes, >X% original fabric remains and form is intact" OR "No, key elements are later replacements/additions altering the form irreversibly". (Judgment Call: Based on visual assessment & basic art history knowledge. "Significant" is contextual - a replaced limb on a bronze matters more than a repaired base).
      *   **Outcome:**
          *   **Yes (Integrity Intact):** Proceed to Step 3 (Provenance & Process).
          *   **No (Integrity Compromised/Altered):** The object is **not the original work**. It is a **Derivative Object** (e.g., heavily restored fragment, partial copy). Proceed to Step 5 (Display Value).

  3.  **PROVENANCE & PROCESS: Is the object's creation history consistent with the original artist's work?**
      *   **Question:** Can the object be credibly linked through provenance or technical analysis (if readily apparent) to the hand, workshop, or authorized production process of the claimed original artist/period? Was it created with the *intent* of being the original work (not a copy, study, or fake)?
      *   **Evidence:** Basic provenance check (known collection history, old labels - *within your 2-hour limit*). Look for obvious signs of workshop practice vs. individual hand. Consider if the *manner* of creation aligns (e.g., 17th C. technique for a claimed 17th C. panel).
      *   **Sufficient Answer:** "Plausible period/origin workshop provenance/technique" OR "Clear red flag in provenance/technique/style" OR "Uncertain, but no overt red flags". (Judgment Call: Based on available docs & connoisseurship - be honest about uncertainty).
      *   **Outcome:**
          *   **Consistent:** Object is **Authentic Original (Autographic)**. Proceed to Step 4 (Intent & Deception) re: *later modifications* if any (e.g., added signature).
          *   **Inconsistent/Red Flag:** Object is **Not Authentic** (likely forgery or misattribution). Proceed to Step 5.
          *   **Uncertain:** Flag as **Attribution Uncertain**. Proceed to Step 4/5 based on other factors. (This is often where institutional fear lives - admit the uncertainty).

  4.  **INTENT & DECEPTION: Is there an element of misrepresentation (past or present)?**
      *   **Question:** Was any modification (addition, alteration, restoration) or the creation of a copy *intended to deceive* about the work's origin, authorship, age, or nature? Is *our display/presentation* potentially deceiving the audience?
      *   **Evidence:** Look for signs of forgery (faked aging, signatures added later, style mimicking an earlier period deceptively). Assess how the object is/will be labeled and presented. An honest facsimile is not a forgery; a fake signature is.
      *   **Sufficient Answer:** "Deceptive intent in creation/modification is evident/likely" OR "No evidence of deceptive intent in creation, but our presentation risks deception" OR "No deception involved (honest copy/restoration)". (Judgment Call: Assess motivation where possible. Focus on *effect* if intent is unclear).
      *   **Outcome:**
          *   **Deception Present:** Object or element is **Forged/Fraudulent**. Requires explicit labeling/context. Affects display status (e.g., don't display a fake signature as real).
          *   **Risk of Audience Deception:** **Mandates clear labeling/context** regardless of object status (e.g., "Facsimile", "Signature added c.1900").
          *   **No Deception:** Does not alter status from previous steps, but informs ethical display.

  5.  **DISPLAY VALUE: What is this object's legitimate value for display?**
      *   **Question:** Even if not the "Authentic Original," does the object hold significant value as: evidence of a lost original, a period restoration, a historical artifact in its own right, a high-quality reproduction for access, or an object of aesthetic/educational merit?
      *   **Evidence:** The object itself and its known history from previous steps.
      *   **Sufficient Answer:** Clear articulation of its *actual* value based on Steps 1-4. (Judgment Call: Institutional mission & values. This is where curators/directors/donors have a voice, *after* the facts are established).
      *   **Outcome:** Determines **Display Status & Labeling** (e.g., "Ancient Sculpture, heavily restored 18th century", "17th Century Painting, signature added later", "Facsimile of Original Manuscript"). Label must accurately reflect conclusions from Steps 1-4.

  **Key Principles Embedded:**
  *   **Goodman's Autographic/Allographic Distinction:** Does the real work here. Dictates whether material history matters at all (Step 1).
  *   **Forgery vs. Reproduction:** Hinges on *deceptive intent* (Step 4), not perfection. A perfect fake is still a fake if intended to deceive.
  *   **Why Originals Matter (Autographic):** The unique history of creation *is part of the work's identity and aesthetic value*. A later cast lacks the aura, context, and specific material trace of the original act (Steps 1 & 2).
  *   **Restoration:** Irreversible alteration that changes form = loss of original work (Step 2). Reversible conservation = preservation of original work.
  *   **Institutional Fear:** Calling out:
      *   Hesitation in Step 3 (Provenance) due to fear of devaluing a "star" object or donor upset.
      *   Overriding Step 5 (Display Value) based on money/loudest voice *before* establishing facts (Steps 1-4). The procedure forces facts first.
      *   Labeling ambiguity ("attributed to", "workshop of") masking genuine uncertainty (Step 3 Outcome) or heavy restoration (Step 2 Outcome).

  **Applied to Your Cases:**

  1.  **The 18th-Century Re-Nosed Marble Head:**
      *   **Step 1 (Ontology):** Autographic (unique ancient sculpture).
      *   **Step 2 (Integrity):** **NO.** Significant portion (1/3rd) is later restoration, irreversibly altering the *form* (the nose, likely facial structure). The original artist's intended sculptural form is lost.
      *   **Outcome:** **Not the Original Work.** It is a **Derivative Object:** Ancient Fragment with Significant 18th Century Restoration.
      *   **Step 4 (Intent):** 18th C restoration likely intended to "complete" (possibly deceive about completeness), but now known. Our display must not deceive.
      *   **Step 5 (Display Value):** High value as an ancient artifact showing 18th C restoration practices & aesthetics. *Label Suggestion: "Marble Head, Roman Imperial Period (1st-3rd Century CE), extensively reworked and restored in the 18th Century."* **(This might be the unwanted answer for a "star" head - but it's honest).**

  2.  **The 17th-Century Panel with Added Signature (c.1900):**
      *   **Step 1 (Ontology):** Autographic (unique painting).
      *   **Step 2 (Integrity):** **YES.** The *painting itself* (the image, the paint layer) is original 17th C work. The added signature is a surface addition.
      *   **Step 3 (Provenance):** **Consistent** for the panel/painting itself (assumed based on your case). The signature is a later addition.
      *   **Step 4 (Intent):** **DECEPTION PRESENT (re: Signature).** The signature was added c.1900 *to deceive* about authorship (to attach it to a more famous name, increasing value).
      *   **Outcome:** **Authentic Original 17th Century Painting** with a **Forged Signature** added c.1900.
      *   **Step 5 (Display Value):** High value as original artwork. *Label Suggestion: "Landscape Scene, mid-17th Century Dutch School. The signature '[Famous Name]' was added to the painting around 1900."*

  3.  **The Manuscript Gallery (Facsimiles Displayed):**
      *   **Step 1 (Ontology):** **Allographic (for the TEXT/ILLUMINATION content).** The *work* is the text and imagery. Any accurate rendering *contains* the work. **BUT ALSO Autographic (for the ORIGINAL PHYSICAL OBJECT).** The unique manuscript with its specific parchment, inks, binding, and creation history is an artifact.
      *   **Step 2/3:** N/A for the facsimile itself regarding the *work's content* (allographic). The facsimile is *not* the autographic original artifact.
      *   **Step 4 (Intent):** **NO DECEPTION (if handled correctly).** Facsimiles are created *as* reproductions. Risk of audience deception exists *if not labeled clearly*.
      *   **Outcome (re: Facsimile):** **Legitimate Reproduction (Allographic)** of the textual/visual work. **Not the Original Artifact (Autographic).**
      *   **Step 5 (Display Value):** High value for access, preservation, education. *Label Suggestion (CRUCIAL): "FACSIMILE of [Manuscript Name], original created [Date/Place]. Original held at [Location], too fragile for permanent display. This high-quality reproduction allows study of the manuscript's contents."*
      *   **Outcome (re: Display Practice):** **Ethically sound IF and ONLY IF labeled unambiguously as facsimiles.** The "why originals matter" (autographic aura/history) is acknowledged by explaining the originals' fragility and location.

  **Surviving the Weird Cases (Briefly):**
  *   **Ancient Fake:** Autographic. It's a genuine artifact *of the period that made the fake*. Its value lies in its own history as an ancient forgery (Step 5).
  *   **Copy of Lost Original:** Autographic (if unique) or Allographic (if multiple exist). Not the original. Value is as evidence/documentation (Step 5 - "After [Lost Master], 18th Century").
  *   **Multiple Restorations:** Autographic. Step 2 - How much original fabric? Can the *core artistic achievement* still be perceived? If form is irrevocably altered, it's derivative. If core remains, it's original but heavily restored (label honestly!).
  *   **Living Tradition (No "Original" Concept):** Often Allographic or process-based. Step 1 is critical. The "work" may be the *act* or the *design*, not a unique object. Authenticity relies on correct process/materials within the tradition (Step 3).

  **This procedure:**
  *   **Is Grounded:** Uses core philosophy (Goodman, intentional history, forgery theory).
  *   **Is Practical:** Focuses on observable features, basic docs, clear questions. 2 hours is tight but possible for these steps.
  *   **Forces Fact-First:** Separates ontological status and material history from later value judgments.
  *   **Minimizes "Depends":** Uses clear thresholds (Autographic/Allographic, Integrity Yes/No, Deception Yes/No) where possible. Marks judgment calls explicitly.
  *   **Provides Defensible Output:** Ends with a clear status label and justification paragraph based on the steps.
  *   **Exposes Institutional Fear:** Forces honesty about integrity loss (Step 2), provenance uncertainty (Step 3), and labeling needs (Step 4/5), making it harder to hide behind prestige or pressure.

  Use this framework consistently. When the director (or donor) shouts, point to the step: "Their concern is a Step 5 Display Value issue, but we must resolve Steps 1-4 first based on the object's facts." Good luck!
