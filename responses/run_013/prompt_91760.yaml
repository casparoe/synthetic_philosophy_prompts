answer: |-
  **1. What constitutes the correct unit of alignment (e.g., model, deployment, research community) and how does this define the alignment problem's structure?**  
  This is maximally upstream: resolving the unit determines the scope of agency, failure modes, and viable solutions for all other alignment targets (specification, robustness, coordination). Without a defined unit, proposed fixes target inconsistent entities. Moves down if empirical AI progress concretizes the unit; moves up if theoretical work reveals irreducible conflicts between units.

  **2. How can "intended goals" be formally specified such that the specification itself generates a recognizable error signal under counterfactual or novel inputs?**  
  Upstream of robustness (maintaining goals in unanticipated situations) and coordination (defining goals across principals), as a flawed specification makes robust adherence meaningless and multi-principal coordination ill-posed. Lack of inherent error signals renders other work unfalsifiable. Moves up if formalisms demonstrate error detection; moves down if proven inherently uncomputable.

  **3. What minimal assumptions ensure an aligned agent robustly pursues its specified goal across distributional shifts or strategic deception, absent a pre-defined error signal?**  
  Upstream of coordination and deployment safety, as non-robust agents fail unpredictably when scaled or interacting. Depends on specification (item 2) but precedes multi-agent dynamics. Moves up if theoretical guarantees link internal structures to robustness; moves down if shown dependent on unrealistic epistemic conditions.

  **4. Under what conditions can multiple aligned agents with potentially conflicting goals (or principals) achieve stable, non-regrettable coordination without centralized control?**  
  Upstream of political legitimacy ("whose goals count") by defining viable coordination mechanisms, but downstream of specification and robustness. Failure here makes large-scale alignment impossible regardless of unit. Moves up if game-theoretic frameworks prove convergence properties; moves down if coordination requires implausible common knowledge.

  **5. What constitutes a legitimate meta-process for selecting or aggregating goal specifications across conflicting human values, given that no technical error signal exists for this selection?**  
  Least upstream: assumes solvable specification/coordination but critically underlies political acceptance. Lacks technical error signals, relying on normative argument. Moves up if formalized decision theories resolve aggregation paradoxes; moves down if deemed inherently political and outside conceptual scope.
