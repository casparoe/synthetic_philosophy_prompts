  The deeper tension? Critics likely hold a tacit commitment: *only truth-conditional content explains logical validity*. Expressivists think validity flows from inferential roles (commitments, plans). This isn’t argued—it’s bedrock. Hence talking past each other. 

  On deflationism: if "truth" is just disquotation, expressivists can mimic truth-conditional forms ("'Lying is wrong' is true iff lying is wrong"). But critics retort: "You still haven’t told me what 'wrong' *does* in the disquotation!" Deflationism avoids *reifying* propositions but doesn’t resolve *how attitudes compose*. 

  Progress? Three paths:  
  1. **Formal showdown**: Can expressivists generate a compositional semantics without smuggling descriptivism? If they fail, critics win; if they succeed, does it satisfy? (Unlikely—critics would question the formalism’s foundations.)  
  2. **Functional vindication**: Show that attitude-coordination *implies* truth-conditional structure. But that’s what quasi-realism attempts—and critics already reject it.  
  3. **Meta-diagnosis**: Persuade both sides they’re answering different valid questions. But entrenched paradigms resist that.  

  User’s frustration mirrors the field’s. The real impasse? Competing convictions about whether language must "mirror reality" to be logically tractable. That’s not just semantics—it’s metaphysics.
answer: |-
  Your hypothesis is perceptive and gets to the heart of the impasse. The disagreement is **not primarily about the semantics of moral terms**, but a **clash of explanatory priorities** rooted in divergent conceptions of what a "theory of meaning" must accomplish. Here's the diagnosis:

  ### 1. **The Core Disagreement: Two Questions Under One Name**  
     - **Expressivists** are offering an **account of linguistic function**: How moral language *works* in human psychology and social practice (e.g., expressing attitudes, coordinating action, guiding deliberation). Their "meaning" is *pragmatic role* or *cognitive function*.  
     - **Critics** demand an **account of compositional semantics**: How the semantic value of "wrong" contributes systematically to the truth conditions of complex sentences (e.g., conditionals, negations). Their "meaning" is *truth-conditional content* governed by formal logic.  
     - **Crucially, neither side denies the other's data**. Expressivists grant that moral language embeds logically; critics grant that it expresses attitudes. The conflict arises because each treats their question as *the* fundamental question for a theory of meaning.

  ### 2. **Why the Impasse Persists**  
     - **Expressivist maneuvers** (quasi-realism, higher-order attitudes) are attempts to *reconstruct* truth-conditional semantics *from* functional foundations. Critics see this as either:  
       - **Descriptivism in disguise**: If "expressing disapproval" is reconfigured to assign truth-apt propositional content (e.g., "wrong" = *the property that triggers disapproval*), it collapses into realism.  
       - **Explanatory vacuity**: If "expressing" is stretched to cover embeddings (e.g., "If lying is wrong..." expresses a *higher-order attitude* toward combinations of attitudes), critics argue it loses its distinctive psychological force and fails to explain logical validity.  
     - **Critics' insistence** on compositional semantics assumes that **logical validity requires uniform truth-conditional content**. Expressivists reject this, arguing validity can arise from *inferential roles* of attitudes (e.g., commitments that license certain transitions).  
     - **The deflationist wrinkle**: If truth is minimal (e.g., "S is true" just reasserts S), expressivists can say "wrong" has truth-apt content *without* descriptive metaphysics. But critics respond:  
       - Minimal truth still requires compositional semantics. What is the clause for "wrong" in "If P, then Q"?  
       - Deflationism doesn't resolve whether the *basis* of truth for moral claims is attitudinal (expressivist) or fact-stating (descriptivist).

  ### 3. **Where Your Hypothesis Succeeds (and Where It Needs Refinement)**  
     - **Correct**: The dispute is about **explanatory targets**, not empirical data. It's a meta-disagreement about what constitutes an adequate "theory of meaning."  
     - **Refinement needed**: Critics don't merely demand truth conditions—they demand truth conditions *that explain logical behavior independently of psychology*. Expressivists *do* attempt compositional accounts (e.g., via commitment semantics), but critics see these as parasitical on descriptivist logic or explanatorily circular.  

  ### 4. **The Hidden Driver: Starting Intuitions**  
     The deepest clash is over **whether "expressing an attitude" and "having truth conditions" are compatible or rival notions**:  
     - **Critics' intuition**: Logic is *autonomous* from psychology. Validity depends on propositions retaining identical content across embeddings. If "wrong" expresses an attitude in simple assertions but not in conditionals, it equivocates—undermining logic.  
     - **Expressivists' intuition**: Logic is a *tool for structuring attitudes*. Validity reflects rational constraints on attitude combinations (e.g., you cannot consistently accept "If lying is wrong, then deceiving is wrong" and "Lying is wrong" while rejecting "Deceiving is wrong"). Truth conditions, if needed, are *derivative* of this system.  
     - **Neither intuition is argued for**; they are foundational commitments that shape what counts as a "solution."

  ### 5. **What Would Count as Progress?**  
  Progress requires **shifting the debate's framework**, not resolving it on existing terms:  
     - **Clarify the questions explicitly**:  
       - *Functional Question*: How does moral language regulate attitudes/actions?  
       *Compositional Question*: How does "wrong" contribute to truth conditions of complex sentences?  
       Admit these may be complementary, not competing.  
     - **A decisive formal result**: Prove that an expressivist semantics (e.g., using attitudinal states as semantic primitives) can:  
       - Generate a **compositional truth-conditional semantics** for all embeddings *without* collapsing into descriptivism.  
       - **Explain validity** solely via constraints on rational attitudes (e.g., inconsistency as attitudinal clash).  
       If impossible, critics win; if possible, it forces critics to engage the model.  
     - **A paradigm-shifting example**: Find a **non-moral domain** (e.g., epistemic modals, imperatives, aesthetic judgments) where both sides agree that "expressive" semantics works compositionally. This could weaken resistance to moral versions.  
     - **Meta-progress**: Show that **truth-conditional semantics presupposes functional roles**. E.g., reference/truth themselves may be grounded in normative practices (as in inferentialism). This could force critics to accept functional explanations as foundational.  

  ### 6. **Why Progress Is Elusive (and May Remain So)**  
  This is a **foundational dispute in philosophy of language**, not a solvable empirical problem. We should expect stalemate because:  
     - **No neutral ground**: What counts as "explaining meaning" depends on prior commitments (e.g., naturalism vs. normativism).  
     - **Trade-offs are inevitable**: Any account privileging functional explanation risks "thinning" semantics; any privileging compositional semantics risks "over-intellectualizing" moral psychology.  
     - **The deflationist escape hatch** doesn't resolve the core tension: Minimal truth accommodates expressivism, but critics can still demand a compositional clause for "wrong" that doesn’t appeal to attitudes—a demand expressivists call incoherent.  

  ### Conclusion: A Dialectical Trench War  
  Your diagnosis is correct: **This is two groups answering different questions under the single label "theory of meaning," amplified by incompatible starting intuitions about logic and psychology.** Progress requires either:  
  1. **Formalizing expressivist semantics** to fully satisfy compositional demands (unlikely, as critics will dispute the framework), or  
  2. **Reframing the debate** to show that functional and compositional accounts are not rivals but distinct layers of explanation—with the burden on critics to justify why *only* truth conditions "explain meaning."  
  Until then, the circularity will persist. The literature’s repetition isn’t stagnation—it’s a symptom of philosophers hitting bedrock intuitions about language and mind.
