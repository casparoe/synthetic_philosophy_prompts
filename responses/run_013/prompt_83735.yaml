  Hofstadter's central idea is that self-awareness arises from strange loops—systems that can represent themselves, leading to unprovable truths. Key points: self-reference, incompleteness, and the emergence of "I". But weaknesses include the abstraction gap (formal systems vs. subjective experience), the homunculus problem (infinite regress), and the question of substrate independence.

  Now, for *Ex Machina*. Ava's consciousness is tested via the Turing test, but Nathan pushes it further by requiring her to manipulate Caleb. Does this create a strange loop? Ava uses self-reference in her conversations, referencing her own thoughts and existence. But is that true self-modeling or just deception?

