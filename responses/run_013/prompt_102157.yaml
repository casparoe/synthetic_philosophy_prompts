            Team Tree: PuzzleB (tree) with one leaf question sabotaged -> turn in answer and confidence.

          Then we reveal the correct answer for PuzzleB and see if the Tree team got it right.

     But then the Flat team is idle in round2? We can have them try to solve PuzzleB flat? But then we have to give them the puzzle and they might finish early and then we can compare.

     We can do:

          Round2 (25 minutes):
            Team Tree: PuzzleB (tree with sabotage)
            Team Flat: PuzzleB (flat) -> but without sabotage? We want the Flat team to get the correct answer? So we give them the un-sabotaged PuzzleB.

          Then we compare:
            Team Flat should get the correct answer for PuzzleB.
            Team Tree might get a different answer.

     This way, we can see the effect of the sabotage.

     But note: the sabotage is in one leaf of the Tree team's puzzle. The Flat team gets the whole puzzle without the mistake. So they will get the correct answer.

     This is acceptable.

     So now we have:

          Total time: 
            Introduction: 5 minutes
            Round1: 25 minutes for solving, but including setup? Let's break down the 25 minutes:

            For Team Flat: 
              - They get the puzzle sheet for PuzzleA and work as a group.

            For Team Tree: 
              - The facilitator explains the rules quickly (we will have a written rule sheet) and then starts the timer.
              - The Root gets the puzzle sheet for PuzzleA and starts breaking it down.
              - The courier (facilitator) manages the cards.

            We need to prepare:
              - For Team Tree: 
                   * PuzzleA broken into the 4 mini-puzzles and the combination rules (written on separate cards for the Root to send out? Or the Root has to write them? We can provide the Root with a master sheet that has the mini-puzzles and the combination rules, and the Root writes the questions on cards.)

            We must design PuzzleA and PuzzleB to have the same structure: 4 mini-puzzles and 3 combination steps.

     Timeline for the 90 minutes:

          0-5 min: Introduction. Explain that we are doing an experiment in problem-solving. Split into two teams (pre-assigned? or randomly). Assign Team Flat and Team Tree. Hand out rule sheets for Team Tree (explaining the protocol) and a rule sheet for Team Flat (just: solve as a group, use whiteboard, 25 minutes). Also, explain the point system (see below).

          5-30 min: Round1 (25 minutes of work, but we include 2 minutes for setup and 3 minutes for answer collection? So 5 extra minutes? Let's make the work time 20 minutes and allow 5 minutes for setup and answer.)

              - Team Flat: given PuzzleA sheet, whiteboard, markers, and 20 minutes to solve. They turn in their answer.
              - Team Tree: 
                  * Facilitator gives the Root the PuzzleA sheet and a stack of blank cards and envelopes. 
                  * The facilitator also gives each consultant an ID (C1 to C7) and explains that they will receive questions via the courier (facilitator) and must answer or break down (but in this puzzle, there is no breakdown beyond what the Root does, and the combination steps are predefined). Actually, in our design, the Root breaks into 4 mini-puzzles and 3 combination steps. The consultants don't break further. So we can tell them: "You will receive a question. If it is a mini-puzzle, solve it. If it is a combination, do the arithmetic as instructed. Write your answer on the card and return it to the courier."

                  * The Root reads the puzzle and writes out the 4 mini-puzzle questions on 4 cards. Each card should have the mini-puzzle and its clues. The Root puts each card in an envelope and writes on the envelope the return address (Root). Then hands to courier. The courier delivers to available consultants (any 4 of the 7).

