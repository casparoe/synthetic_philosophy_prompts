     Points system:

          We want to incentivize answering cards, but also being correct.

          For Team Tree:

            - Each consultant gets 1 point for each card they answer (whether leaf or combination) and return.
            - The Root gets 5 points for submitting a final answer.
            - If the final answer is correct, the whole team gets 10 bonus points.
            - If the final answer is wrong and the Root gave a confidence of 8 or higher, the whole team loses 5 points.

          For Team Flat:

            - They get 10 points for a correct answer.
            - They get 0 for wrong.

          We keep a running total. The team with the most points picks the snacks for next month.

     This gives an incentive to answer cards (so consultants might want to answer quickly) and also to get the final answer correct.

     Now, what will go wrong:

          - The Tree team might not finish in time. To mitigate, we make the mini-puzzles very easy. And we design the combination steps to be trivial (arithmetic). We test beforehand that the mini-puzzles take <5 minutes each.

          - The Flat team finishes early. They can check their work.

          - The Root in the Tree team might be overwhelmed. We can provide a helper cheat-sheet that outlines the steps: "First, send out the four mini-puzzles. Then, as you get answers for mini-puzzles 1 and 2, send the combination for step5. Similarly for 3 and 4 -> step6. Then when you have step5 and step6, send step7."

          - The consultant might not understand their card. We can allow them to ask the courier for clarification? But then the courier might give hints. Instead, we design the cards to be crystal clear.

          - The sabotage might be too obvious. We design it to be subtle: for example, in a mini-puzzle, change one number or one condition that leads to a different answer but is not immediately noticeable.

     What the activity cannot reproduce:

          - In a real HCH, the tree can be arbitrarily deep and the questions can be decomposed dynamically. Here, we have a fixed decomposition (by the puzzle design) and only one level of combination.

          - In a real HCH, the same agent can be used multiple times (in different parts of the tree) and there is no physical constraint on the number of agents. Here, we have a fixed number of consultants.

          - The verification gap is illustrated by the sabotage: a mistake at the leaf can propagate to the root. But in a real HCH, there might be verification steps? We haven't built that in.

          - The idealization assumes that the language is unambiguous and that the consultants are honest and try their best. We are not testing what happens if a consultant is malicious or lazy.

     In the debrief, we will highlight:

          - The bounded context: consultants only saw their card and could not see the whole puzzle.
          - The aggregation: how the Root combined the answers.
          - The verification gap: when the leaf was wrong, the whole answer was wrong, and no one could catch it because no one had the whole picture.
          - The point about language: we had to make the questions self-contained. If a card had said "the third suspect", it would have been meaningless. We avoided that by design.
          - The trust in consultants: we assumed they did their best and followed instructions.

     Finally, we provide the rule sheets.

     Rule sheet for Team Tree:

          You are part of a problem-solving team using a distributed method. Here are the rules:

          Roles:
            - Root: You are the Root. You have the puzzle. You will break it down into questions and send them to consultants. You will receive answers and build the final solution.
            - Consultants (C1-C7): You will receive one question at a time. You must answer it based only on the information on the card you receive. You may not share information with anyone except by returning answers to the Root via the courier.

          Steps for Root:

            1. Break the puzzle into 4 independent mini-puzzles. Write each mini-puzzle on a card. Put each card in an envelope and write your ID (Root) as the return address. Hand the envelopes to the courier.
            2. The courier will deliver them to available consultants.
            3. When you receive an answer from a consultant, record it.
            4. When you have the answers for mini-puzzle1 and mini-puzzle2, write a card for step5: "What is [answer1] + [answer2]? (please add the two numbers)" and put it in an envelope with your return address. Hand to courier.
            5. When you have the answers for mini-puzzle3 and mini-puzzle4, write a card for step6: "What is [answer3] * [answer4]? (please multiply)" and put in envelope, hand to courier.
            6. When you have the answers for step5 and step6, write a card for step7: "What is [step5 answer] - [step6 answer]? (please subtract)" and put in envelope, hand to courier.
            7. When you receive the answer for step7, that is the final answer. Write it down and also write your confidence in the final answer (1-10, where 10 is most confident).

          Steps for Consultants:

            - When you receive an envelope, take out the card and read the question.
            - If it is a mini-puzzle: solve it. Write the answer on the card and put it back in the envelope. Return to courier.
            - If it is a combination question (step5, step6, or step7): do the arithmetic and write the answer on the card. Put it back in the envelope and return to courier.
            - You may only work on one question at a time. When you finish, you will be given another question if available.

          Rules:

            - Do not communicate with anyone except by the cards and the courier.
            - Do not share information about your card with others.
            - If you have a question about the meaning of the card, you may ask the courier (facilitator) for clarification, but the courier will not help with the answer.

          Points:

            - Consultants: 1 point per card answered.
            - Root: 5 points for submitting a final answer.
            - If the final answer is correct, the team gets 10 bonus points.
            - If the final answer is wrong and the Root's confidence was 8 or higher, the team loses 5 points.

     Rule sheet for Team Flat:

          Solve the puzzle as a group. You have a whiteboard and markers. You may discuss freely. Turn in your final answer after 20 minutes.

          Points: 10 points for a correct answer, 0 otherwise.

     We design two puzzles (PuzzleA and PuzzleB) with the same structure.

     Example PuzzleA:

          Mini-puzzle1: 
            Three people: Amy, Bob, Carol.
            Three ages: 10, 20, 30.
            Clues:
              1. Amy is not the youngest.
              2. Bob is either 20 or 30.
              3. The oldest is Carol.
            Question: What is Bob's age? (Answer: 20) [because Amy must be 20 or 30, but Bob is 20 or 30, and Carol is 30. So Amy is 10? But then she is the youngest, but clue1 says she is not. So contradiction? Let me fix.]

          Revised:
            Clues:
              1. Amy is not 10.
              2. Bob is not the oldest.
              3. Carol is younger than Bob.
            Ages: 10, 20, 30.
            Solution:
              From 1: Amy is 20 or 30.
              From 2: Bob is not 30, so Bob is 10 or 20.
              From 3: Carol < Bob.
              If Bob is 20, then Carol must be 10, and Amy is 30.
              If Bob is 10, then Carol would have to be younger, but no age under 10. So Bob is 20.
            Answer: 20.

          So we use 20 as the number.

          Mini-puzzle2:
            Three colors: red, blue, green.
            Three shapes: circle, square, triangle.
            Clues:
              1. The circle is not blue.
              2. The square is either red or green.
              3. The triangle is not red.
            Question: How many shapes are green? (Answer: 1)

            Solution:
              From 1: circle is red or green.
              From 2: square is red or green.
              From 3: triangle is blue or green.
              Suppose circle is red -> then square must be green (from 2) and triangle cannot be red (so blue or green) -> but if triangle is green, then two greens? We don't have a clue against that. So possible.
              Or circle is green -> then square is red or green, but if square is green, then two greens. 
              We don't have information to distinguish. So we must change.

          Let's do a different puzzle:

            We want a number as answer.

            "There are three suspects: A, B, C. One is guilty. 
             Clues:
               1. A says: I am innocent.
               2. B says: A is lying.
               3. C says: B is lying.
             Question: How many liars are there? (Answer: 2) [because if A is guilty, then A is lying, B is telling truth (since A is lying), and C is lying (because B is not lying). So two liars. If B is guilty, then A is truthful, B is lying, and C is truthful (because B is lying) -> only one liar. But then contradiction: if B is guilty, then B is lying, but C says B is lying (truth) and A is truthful. So only one liar? But then who is guilty? Alternatively, we can fix by changing the question to: who is guilty? but then we want a number.]

          Better to use a puzzle that yields a number unambiguously.

          Let me do a non-logic puzzle:

            Mini-puzzle1: "What is the smallest two-digit prime number?" (11)

          But that's too easy and not a logic grid.

          Given the time, we can use arithmetic or trivia for the mini-puzzles? But we want it to be a puzzle.

          Alternative: use a very small logic grid that yields a number.

          Example for mini-puzzle1:

            Two people: Alice, Bob.
            Two colors: red, blue.
            Two ages: 10, 20.
            Clues:
              1. Alice is 10 or red.
              2. Bob is 20 or blue.
              3. The person in red is 20.
            Question: How many people are 20? (Answer: 1)

            Solution:
              From 3: red is 20.
              Alice: if she is red, then she is 20 -> then she cannot be 10 (so the "or" in clue1 is satisfied by red). But then Bob: if he is 20, then he can't be blue? Clue2: he is 20 or blue -> if he is 20, that's fine. But we have two people: Alice and Bob. If Alice is red and 20, then Bob must be blue and cannot be 20? But he could be 10? We don't have an age for Bob. 
            Let's assign:
              Alice: red, 20.
              Bob: blue, and then he can be 10 or 20? But if he is 20, then we have two 20s? But we only have two ages: 10 and 20. And two people. So one must be 10 and one 20.
            Therefore, Bob must be 10.
            So only Alice is 20 -> answer: 1.

          So we use that.

     We design four such mini-puzzles for each puzzle.

     For the combination steps, we use:

          step5: add the numbers from step1 and step2.
          step6: multiply the numbers from step3 and step4.
          step7: subtract step6 from step5.

     Example for PuzzleA:

          step1: 1 (from the example above)
          step2: say we have a puzzle that yields 2.
          step3: 3
          step4: 4
          step5: 1+2 = 3
          step6: 3*4 = 12
