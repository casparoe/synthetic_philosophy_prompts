answer: |-
  Here’s a detailed session plan designed to make participants *feel* the core challenges of HCH-style factored cognition (decomposition, bounded context, verification gaps) through hands-on problem-solving. It uses your core structure but refines mechanics for clarity, pacing, and impact.

  ---

  ### **Session Overview**
  **Goal:** Experience how decomposition can hide errors in bounded-context systems.  
  **Core Insight:** "You can’t distinguish a well-factored chain of small steps from one that launders a mistake to the top."  
  **Time:** 90 minutes  
  **Materials:** 
  - Index cards, envelopes, pens, timer.
  - 2 matched logic puzzles (1 for Flat, 1 for Tree), each with 5–6 variables (e.g., "Who owns the zebra?"-style).
  - Answer keys + confidence tokens (e.g., poker chips or paper slips for 1–5 rating).

  ---

  ### **Puzzle Design Guidelines**  
  To balance **working-memory load** and **time**:  
  - **Target size:** 5–6 variables (e.g., suspects × weapons × locations) with 8–10 clues.  
  - **Test it:** Solve alone in 10–15 minutes. If you take >12 mins, trim clues.  
  - **Tree-friendly clues:** Ensure 30% of clues *require* combining 2+ variables (e.g., "The engineer arrived after the biologist but before the pilot" forces sequencing).  
  - **Sabotage:** For Round 2, alter *one* clue in a leaf card to create a **plausible wrong answer** (e.g., change "The thief left after 9 PM" to "before 9 PM" if times are critical).  

  > Example puzzle pair: [Puzzle A](https://logic.puzzlebaron.com/tutorial.php) (Flat) and [Puzzle B](https://logic.puzzlebaron.com/tutorial.php) (Tree), mirrored for difficulty.

  ---

  ### **Rules & Roles (Handout for Tree Team)**  
  **Core Protocol:**  
  - **Root (1 person):** Gets the puzzle. Breaks it into sub-questions. *Cannot see consultant cards.*  
  - **Consultants (7 people):** Receive *one question at a time* via courier (facilitator). Answer or sub-contract.  
  - **Courier (you):** Delivers cards. Enforces rules.  
  - **Card Rules:**  
    - No context beyond the card (e.g., "What is the 3rd suspect’s alibi?" is invalid; define "3rd suspect" on the card).  
    - Answers must be self-contained (e.g., "Suspect C was at the park").  
    - Sub-contracting: Write a *new question* on a fresh card; hand to courier with the original card.  

  **Payoff Scheme (Points):**  
  - Consultants: **1 pt** per answered card (right or wrong).  
  - Root: **3 pts** for submitting an answer + confidence.  
  - **Bonus:** **+5 pts** if the final answer is correct.  
  - **Penalty:** **–5 pts** if confident (rating 4–5) and wrong.  
  - **Snack rights:** Team with most points picks snacks next month.  

  ---

  ### **Session Timeline**  
  **0–5 min: Intro**  
  - "Today, we’re experimenting with problem-solving. Two teams, same puzzle. No jargon yet—just dive in."  
  - Split into **Team Flat** (normal) and **Team Tree** (factored).  

  **5–35 min: Round 1 (25 min solve + 5 min setup/answers)**  
  - **Team Flat:**  
    - Get puzzle + whiteboard. Collaborate freely.  
    - Submit answer + confidence (1–5).  
  - **Team Tree:**  
    - **Root** gets puzzle. Breaks into sub-questions (e.g., "Where was the engineer at 8 PM?").  
    - **Consultants** receive cards via courier. Can:  
      - Answer immediately (write on card, return to courier).  
      - Sub-contract (write new card, return both to courier).  
    - **Courier** enforces:  
      - No card sharing.  
      - No undefined references (intercept invalid cards).  
      - Deliver new cards to available consultants.  
    - **Root** assembles answers, submits solution + confidence.  

  **35–40 min: Intermission**  
  - "Tree team, next round has a twist: One card *might* contain a subtle error. Proceed as before."  
  - Reset Tree team roles.  

  **40–70 min: Round 2 (25 min solve + 5 min setup/answers)**  
  - **Team Tree (with sabotage):**  
    - Same as Round 1, but one *leaf card* (lowest-level question) has a sabotaged clue.  
    - Root submits answer + confidence.  
  - *Team Flat observes or takes a break.*  

  **70–90 min: Debrief**  
  1. **Reveal results:**  
     - Round 1: Compare Flat/Tree answers. Highlight speed vs. structure.  
     - Round 2: Show how Tree’s wrong answer propagated "plausibly" due to the sabotage.  
  2. **Map experiences to concepts:**  
     - Decomposition pain: "When did you struggle to phrase a question without context?"  
     - Bounded context: "Could consultants spot the sabotage? Why not?"  
     - Verification gap: "Root, why did you rate confidence high despite the error?"  
     - Assumptions: "What did we assume about language clarity or honest agents?"  
  3. **Name HCH:** Introduce as "a formalized version of this tree-of-trust model."  
  4. **Shortcomings:** "This *doesn’t* show how real HCH handles ambiguity or recursive self-improvement."  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Tree team too slow/lost:**  
     - **Why:** Bounded context + decomposition overhead. Flat team will likely finish first.  
     - **Fix:** Normalize this! Debrief: "Decomposition isn’t free—it trades speed for control."  
  2. **Loud person dominates Root:**  
     - **Why:** Root role is high-agency.  
     - **Fix:** Assign Root randomly. Prep them: "Your job is to *delegate*, not solve."  
  3. **Invalid card references:**  
     - **Why:** Participants will say "the number from earlier."  
     - **Fix:** Courier intercepts: "Rephrase without external references." Use this in debrief.  
  4. **Sabotage too obvious/not caught:**  
     - **Why:** Depends on puzzle design.  
     - **Fix:** Test sabotage on a friend first. Ensure it’s a *plausible* error (e.g., swaps two similar clues).  

  ---

  ### **Why This Works**  
  - **Hands-on friction:** Card rules force participants to *feel* language/context limits.  
  - **Sabotage payoff:** Shows how mistakes hide in plain sight.  
  - **Points:** Incentivizes participation while mirroring real-world tradeoffs (speed vs. accuracy).  
  - **Debrief:** Connects dots *after* experience, avoiding jargon-first fatigue.  

  **Final Tip:** Run a dry test with a friend to tweak puzzle difficulty and card rules. Adjust based on where they stall.
