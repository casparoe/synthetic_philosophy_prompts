  The gray banana reference gives me texture ideas - maybe describe pills as having "a yellow undertone when you expect defects" to mirror that phenomenon. And the title "Known Defect Rate" feels right: bureaucratic, implying that reality might be defined by paperwork.
answer: |-
  ## Known Defect Rate

  The pills slide past my eyes, a river of white under the harsh fluorescents. Batch #K-734. Known Defect Rate: 0.2%. Practically pristine. My fingers move, plucking the occasional offender – a hairline fracture, a tiny chip like a missing tooth, a discoloration darker than the standard eggshell. Easy. Automatic. Muscle memory honed by seven years on the line at Veridian Quality Control.

  The clipboard dictates reality. Before every shift, before you even strap on the magnifying headset, they tell you the KDR. It’s not advice, not context. It’s… preparation. Conditioning. Like priming a pump. You *know* a batch is mostly clean, so your eyes glide over the smooth surfaces, hunting only for the significant *wrongness*. Or so the trainers say. It makes you efficient. Accurate.

  But lately… efficiency feels different. It feels like blindness.

  It started with Batch #F-112. KDR: 0.05%. Nearly perfect. I scanned the endless stream of tiny white ovals. Nothing. Not a single flaw registered. A warm, almost smug satisfaction bloomed. See? Perfectly tuned. Then Jenkins, the new kid, flagged one. A micro-scratch, barely a whisper on the surface. He pointed it out, hesitant. I looked. Hard. Under the intense ring light of my station, I saw… smoothness. Unblemished white. Jenkins’ pill looked identical to the thousands flowing past. My headset felt suddenly tight.

  “It’s there, Mara,” he insisted, tracing an invisible line with his fingertip. “Right here.”

  I couldn’t see it. Not a flicker, not a shadow. Just uniform, perfect white. The cold seeped in then, a drip down my spine. Later, I pulled the archived camera image for F-112, pill #4589. The high-res scan showed it plain as day: a faint, diagonal scratch, maybe three millimeters long. Like a tiny crack in ice. Undeniable. Yet, under my own eyes, under the same light Jenkins used, it had been invisible. Not ignored. *Absent*.

  Today is Batch #M-881. KDR: 12%. Defect central. My eyes are primed for war. Every pill seems suspect. A slight sheen becomes a fracture. A tiny dust mote clinging to the surface looks like a crater. I’m pulling pills constantly, my reject bin filling faster than usual. Each one feels *obviously* flawed. Jagged. Wrong. My pulse thrums with the hunt. This is what seeing *should* feel like – active, critical.

  During break, I linger by the verification station. The overhead cameras take continuous high-resolution images of every pill on the line, cross-referenced with our manual inspections. I pull up a few rejects from my current bin. Pill #1287: I saw a deep gouge near the edge. The camera shows… a faint surface imperfection, barely registering above the texture. Significant? Maybe. But not the canyon I perceived. Pill #2091: I flagged for a major chip. The image shows a tiny, almost negligible nick. Barely a blemish. My stomach clenches.

  I pull an image of a pill I *passed* earlier. Pill #0555. Smooth, clean. I’d glanced at it, my KDR-honed senses dismissing it instantly. On the screen, however, running diagonally across its face, is a distinct, shallow scratch. Clear. Unmistakable. My breath catches. I *looked* at that pill. I saw… nothing. Just white. Just smooth. Just… correct.

  It’s not that I doubted myself and looked away. It’s that the scratch *wasn’t there* in my visual field. The information simply didn’t reach me. My eyes reported smooth porcelain, and my brain accepted it without question, perfectly aligned with the expectation written on the clipboard: 0.2% defect rate. Clean. Now, with a KDR of 12%, my eyes inject flaws where they barely exist. They warp reality to fit the number.

  I return to the line. The river of pills is no longer just objects. It’s a conspiracy. The fluorescents hum like a hive mind. My magnifying headset feels less like a tool and more like a restraint, focusing my vision into a tunnel where only the expected exists.

  I pick up a pill. Hold it under the light. Rotate it. It looks… okay. Slightly textured, but within spec. My fingers know the *feel* of a scratch, a subtle catch against the pad. Nothing. But the KDR screams 12%. *Look harder*. I squint. Is that… a faint line? Or just the play of light on the coating? My brain, desperate to conform, starts to *build* it. The suggestion of a flaw blooms on the surface, shimmering, not quite real, but undeniable *to me*. Should I flag it? Is it real, or is my expectation painting it onto the blank canvas?

  The question isn't "Is it defective?" anymore. The question is, "What am I actually seeing?"

  I think about the gray banana. They showed us that image in the initial psych eval – a banana-shaped blob, objectively gray on the spectrum analyzer. Yet, most people swear they see a *hint* of yellow. Because bananas *are* yellow. Knowledge bleeds into perception, tinting the grayscale. We dismissed it as a fun trick back then. Now, it feels like a fundamental betrayal. The clipboard bleeds into my eyes, repainting the pills.

  Jenkins slides onto the stool next to me, starting his shift. He glances at my reject bin, overflowing compared to his still-empty one. "Rough batch, Mara?" he asks, adjusting his headset.

  "M-881," I say, my voice tight. "KDR twelve percent."

  He nods, his eyes already scanning the line. "Right. Defect fest." He picks up a pill almost immediately, holds it briefly. "Chip," he mutters, tossing it in his bin. "See? Obvious."

  I look at the pill he discarded. It looks… fine. A little uneven, maybe. But not chipped. Not to my eyes, still calibrated for the previous batch’s cleanness? Or are his eyes, primed for 12%, *creating* the chip? Or am I, primed for cleanness *yesterday* but now fighting the new KDR, stuck in some horrifying limbo?

  I grab the pill Jenkins rejected. Feel it. Smooth. No chip. I pull up its camera image on my terminal. Jenkins leans over. "See?" he points at the screen. "Right there. Corner's dinged."

  On the screen, the corner is slightly flattened. A minor imperfection. But in my hand, under my eyes, it felt and looked perfectly rounded. The contradiction is dizzying. Which is real? The tangible object in my grasp, or the digital image? My own perception, or Jenkins's? Or the machine's?

  "Doesn't feel chipped," I say, my voice weak.

  Jenkins shrugs. "Cameras don't lie, Mara. KDR's twelve. Gotta be vigilant." He turns back to his line, already flagging another pill.

  *Cameras don't lie.* But what do my eyes do? Are they lying? Or translating? Or just… filtering? If the machine says it’s flawed, and Jenkins sees it flawed, and I *don’t*… does that mean *I’m* wrong? Or does it mean my reality is simply… different? Shaped by the number on the clipboard? Is Jenkins seeing the real pill, or is he seeing the 12% projected onto it?

  The implications coil like cold wire in my gut. If expectation rewrites sight itself, what good is sight? Is it a window, or just a mirror reflecting what we already believe? If I can't trust the direct, unmediated input from my own eyes, what *can* I trust? The machine? The clipboard? Jenkins? They all seem like different layers of the same unreliable system.

  I pick up another pill. Batch #M-881. KDR 12%. I hold it. I stare. I *will* myself to see neutrally. Just the light, the shape, the surface. But the KDR is a drumbeat in my skull: *Twelve percent. Twelve percent. Flawed. Flawed. Flawed.* And like magic, like a developing photograph, imperfections begin to swim into view. A faint haze here. A microscopic pit there. Were they always there, and my 'clean' eyes couldn’t register them? Or is my brain, obedient to the number, generating defects to match the expectation?

  The line supervisor walks by, pauses by my station. She glances at my reject bin, then at Jenkins’s, which is now half-full. She taps her own clipboard. "Good catch rate, Mara. KDR's holding true. See? Told you you'd tune into it." She gives a tight, approving nod and moves on.

  *Tune into it.*

  Have I? Or has the tuning erased something essential? Have I gotten *better* by becoming perfectly aligned with the system’s expectation, seeing only what the KDR dictates? Or has the system rewritten my vision, making me incapable of seeing anything outside its parameters? Is this efficiency… or erasure?

  I look at the pill in my hand. It shimmers slightly under the light. I can't tell if the shimmer is a property of the coating, a trick of the fluorescents, or a phantom flaw conjured by the relentless 12% echoing in my mind. I don't know what I see anymore. I only know what the clipboard tells me I *should* see. And my eyes, ever the faithful servants, oblige.

  I drop the pill into the reject bin. It lands with a soft, definitive click. It doesn't matter if I see the scratch or not. The system says it’s flawed. Jenkins sees it. The camera confirms it. My own eyes are irrelevant. They’ve become just another calibrated instrument on the line, reading the world according to the known defect rate.

  The river of white flows on. I adjust my headset, lean forward, and keep looking. Searching for flaws that may or may not exist outside the realm defined by a number on a clipboard. The pills slide past, smooth or scarred, depending on the story they’re told. And my eyes, my treacherous, obedient eyes, see exactly what they’re supposed to see. Nothing more. Nothing less. Just the known defect rate, made manifest.
