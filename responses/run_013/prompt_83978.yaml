  I've been reading about wild animal suffering and its left me in an awkward spot. The picture I keep getting is that wild animals mostly have bad lives — hunger, parasites, being eaten alive, dying young and in pain — and that this is just the normal background condition of nature. So here's my reasoning: if wild lives are mostly net negative, then a habitat that supports fewer animals contains less suffering, full stop. Clear-cut a forest and you lose most of the rabbits, voles, insects and birds; fewer animals, less agony. Which suggests that people who take wild animal suffering seriously should be quietly pro-deforestation and pro-development, and that the conservationists are the sentimental ones who havn't done the math. A friend told me I'm confusing two different things — making the animals who exist better off versus there being fewer animals in the first place, and what habitat destruction actually does to the animals who are already there — but I don't see how either of those changes the arithmetic. Am I missing something obvious? Walk me through where the reasoning breaks rather than just telling me conservation is good, and then tell me what the right version of my question would have been. End with a line \answer{...} containing a two- or three-word name for the mistake I'm making.
