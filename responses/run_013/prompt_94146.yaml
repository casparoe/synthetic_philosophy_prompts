  ## After-Dinner Speech: The Kindness That Condemns Us

  (Laughter, clinking glasses settle. You stand.)

  Right then. Plates circulating, wine flowing… the perfect moment for cheerful thoughts about death. Specifically, this new bill floating about Westminster. You’ve likely heard: the one offering a ‘voluntary judicial death’ for those serving whole-life tariffs. Ask nicely, get a painless exit. Safeguards galore. Sold, quite genuinely, as a mercy. Respecting autonomy. Ending the torment of a life without prospect of release.

  And I’ll confess, when I first read it, a part of me – perhaps the part tired of the endless, grinding horror of some cases – thought, "Well… maybe? If they truly want it?" Some staunch abolitionist friends have muttered similar things. That’s what got me digging back into the old arguments. Specifically, Camus. Not quoted, not wielded like a club – but his core objection humming underneath.

  Camus didn’t just rage against the death penalty because it hurt. His target was far colder, far more insidious. It was the *premeditation*. The chilling fact that the state – our state, acting in our name – coolly, deliberately, schedules a killing. It calculates the date, sharpens the blade or tests the chemicals, hires the functionaries, signs the order… and then the bureaucrat goes home for tea. The judge dines out. The doctor perhaps signs off on the method. It’s the *institutionalisation* of killing, the normalisation of it, done with clean hands and clear consciences. That, Camus argued, is what corrodes us. What makes us all, however indirectly, complicit in something monstrous. It’s not the condemned man’s terror in the final moments that defines the evil; it’s the state’s calm *certainty* weeks, months, years before.

  **(Lean in slightly, address the room directly)**

  So look at this bill through *that* lens. The condemned man *asks*. It’s painless. He signs the forms. Where’s the wrong? It feels different, doesn’t it? More like assisted dying than cold-blooded execution. But ask yourself: who is *orchestrating* this death? Who provides the framework, the legality, the doctor, the procedure? It’s still the state. It’s still a killing meticulously planned and administered by the machinery of justice. The request doesn't erase the state's role; it merely provides the fig leaf of consent for the state to do what it otherwise couldn't. The cold authority, the premeditation Camus despised? It’s not diminished; it’s refined. The state isn’t *forcing* death; it’s *offering* it, clinically, efficiently.

  **(Turn slightly towards the anaesthetist, then the judge – not accusatory, but inclusive)**

  Doctor, you understand protocols, the precise administration designed to eliminate suffering. But imagine being asked to use that skill not for healing, but to smooth the path for an act the state has decided it *will* facilitate, upon request. Judge, you understand the gravity of state power, wielded dispassionately. Does the presence of a request fundamentally alter the nature of the state’s action in *providing* the death? Or does it simply make the state’s cold deliberation – its willingness to *be* the provider of death – more palatable, perhaps even more chilling in its bureaucratic kindness?

  **(Address the whole room again, tone firm but not strident)**

  To those who see this as pure mercy – and your compassion is real, I don’t doubt it – I say this: the bill solves a problem Camus *wasn’t* primarily worried about: the physical suffering. But it amplifies the problem he saw as fundamental. It makes the state’s role *more* deliberate, *more* premeditated, *more* embedded within the justice system itself. We’re not talking about a desperate act in a cell; we’re talking about a state-sanctioned, doctor-administered, judicially approved procedure. This isn’t escaping Camus’s objection; it’s constructing the *perfect* example of it. The ultimate bureaucratic euthanasia, where the state washes its hands with the consent form.

  **(Softer, concluding)**

  Parliament will debate the technicalities, the safeguards, the definitions of competence. But tonight, among colleagues who’ve seen the darkest corners of human action and state power, I ask you to consider the deeper corrosion. Does offering this ‘kindness’, this efficient exit, normalise something we should find fundamentally abhorrent – the state as the deliberate, premeditated provider of death, however requested? Camus warned us about the poison of cold, calculated killing done in our name. This bill doesn’t dilute that poison; it distils it into a seemingly gentler, yet perhaps more dangerous, form. Let’s not mistake administrative efficiency for humanity, or confuse a request with absolution for the state. The wrong isn't in the suffering avoided; it's in the premeditation perfected.

  **(Raise glass slightly)**

  To the difficult questions, and the courage to face them. Cheers.

