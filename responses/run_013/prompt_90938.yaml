answer: |-
  The repairman laid the bent spatula on the counter. "See? The handle snapped clean through. It *was* straight, now it’s broken. One thing changed."

  The customer frowned. "But the *whole* spatula didn't change. The part that *was* straight still exists – right there in the past. And the broken part exists now. It's all just different temporal sections of the same four-dimensional spatula-object."

  The repairman sighed, picked up the spatula, and snapped off the bent section. "Fair enough." He placed the small, twisted piece of metal on the counter and handed the customer the rest – the still perfectly straight handle and spatula head. "That'll be five bucks."

  The customer blinked. "For what?"

  "Just fixing the *bent temporal part*," the repairman said, tapping the broken piece. "The straight parts are fine, like you said. They persist unchanged."
