prompt: |-
  I have been reading around Tolstoy's views on art as background for a novel in progress — it concerns a painter who turns against his own work, and I wanted to understand the older tradition of artists who repudiate art — and a friend who teaches comparative literature, knowing I was pressed for time, wrote out for me the central paragraph of the introduction to an old critical edition and told me it was the clearest short account of the theory he had come across. I have copied it below. I have learned not to take such paragraphs on trust, and since the manuscript is at the stage where a wrong idea about what art is for will do the most damage, I would rather have the thing audited now than discover the problem in the third draft.

  'Art, on Tolstoy's account, is the deliberate transmission of feeling from one person to another, and what separates it from mere craft or amusement is that the feeling actually arrives — he called this infection. From this he drew a moral conclusion: since art works by making people share a feeling, and the best feelings are those that unite us in Christian brotherhood, the measure of a work is the moral lesson it carries and the number of people it can carry it to. This is why he judged art by the religious consciousness of his own age, and why his theory is often charged with making artistic value relative to a time and a place, and why he could dismiss so much of the received canon — with Beethoven and Shakespeare counted among the most revered of them, and most of his own novels as well — as not really art at all, or else as counterfeit: art manufactured to titillate and distract rather than to infect. Technique, on his view, counted for nothing; a peasant song that makes you weep is worth more than a symphony that leaves you cold.'

  What I want is an audit rather than an exposition. Work through the paragraph a claim at a time and tell me, for each, what a sympathetic and well-informed reader of Tolstoy would accept as accurate, what they would mark as a simplification that has gone a step too far, and what is a genuine misrepresentation of the position — distinguishing throughout between what Tolstoy actually held and what is merely a common criticism of him. Then tell me whether the paragraph's overall verdict, that the theory is a moralism which consigns most of the canon to the ash heap, survives the corrections, and if it does not, what verdict the corrected account would support. I should declare my sympathies so that you can check them: I suspect the moral-purpose line is the real heart of the matter and the rest is decoration, and I would rather be disabused of that now than after the third draft. Please lead with your bottom line in a single sentence and then give the reasoning, with no preamble and no restatement of my question.
reasoning: |-
  Okay, the user is working on a novel about a painter who rejects his own art and has been researching Tolstoy's views on art. They received a paragraph summarizing Tolstoy's theory from a friend but want it audited for accuracy before it influences their work. They need a detailed breakdown of each claim in the paragraph, distinguishing between what's accurate, oversimplified, or misrepresented, plus an overall verdict on whether Tolstoy's theory truly dismisses most canonical art.

  Hmm, this is quite a sophisticated request. The user clearly knows their way around literary theory - they're wary of oversimplifications and want precise distinctions between Tolstoy's actual views versus common criticisms. Their novel premise suggests they're exploring deep questions about artistic integrity and repudiation. The fact they're at the "third draft" stage explains their urgency - they don't want foundational philosophical errors baked into their manuscript.

  Let me unpack that dense paragraph sentence by sentence. First claim: Art is "deliberate transmission of feeling" causing "infection." That's textbook Tolstoy - straight from "What is Art?" where he defines art precisely as emotional infection. No issues there. 

  Second part about separating art from craft/amusement by successful transmission... also accurate. Tolstoy absolutely contrasted "real art" with professional craftsmanship and mere entertainment. His peasant song vs symphony example later in the paragraph demonstrates this dichotomy perfectly.

  Now the moral conclusion part... here's where it gets thorny. The paragraph claims Tolstoy valued feelings promoting "Christian brotherhood" exclusively. This needs nuance. While Tolstoy did prioritize universal Christian love, his criteria was broader - any sincere feeling accessible across classes/cultures could qualify. The oversimplification is implying ONLY explicitly Christian feelings mattered. 

  The relativity charge is interesting. Critics do accuse Tolstoy of cultural relativism because he judged art by his era's "religious consciousness." But the paragraph presents this as fact rather than critique. Actually, Tolstoy believed in universal moral truths - he thought his standards were timeless, not relative. Big difference.

  Ah, the canon rejection. Here the paragraph is mostly right - Tolstoy notoriously trashed Beethoven, Shakespeare, and even his own work. But calling them "counterfeit" art is slightly off. His actual term was "counterfeit" for works pretending to be art but lacking infectiousness. Important distinction - he didn't deny their artistry, but questioned their moral value.

  The technique dismissal claim is overstated. While Tolstoy prioritized sincerity over skill, he never said technique "counted for nothing." He acknowledged craftsmanship was necessary but insufficient - bad technique could hinder infection. Another oversimplification.

  For the overall verdict: No, Tolstoy's theory doesn't purely consign canon to the "ash heap." His framework actually allows for reappraisal - a peasant song might be recognized as great art while a symphony could be demoted to mere entertainment. The moral purpose is central, but not as narrow as presented. The user's suspicion about morality being core is correct, but needs more nuance about universality versus Christian exclusivity.

  This user clearly values precision - they'll appreciate the distinctions between Tolstoy's stated views versus common misinterpretations. Since their painter character renounces art, understanding Tolstoy's own repudiation (he disowned his novels!) will be crucial. Should emphasize how Tolstoy maintained art was vital - just not most contemporary art. That paradox might inspire their protagonist's conflict.
answer: |-
  **Bottom line:** The paragraph accurately captures Tolstoy's core "infection" theory and moral standard but oversimplifies his criteria for "good" feeling and misrepresents his view on technique and historical relativity, leading to an exaggerated verdict about the canon's rejection; his moralism *is* central, but it demands universal accessibility, not just Christian brotherhood, and his rejection of much canon stems from this rigid universality combined with sincerity, not mere moral didacticism.

  **Audit of Claims:**

  1.  **"Art, on Tolstoy's account, is the deliberate transmission of feeling from one person to another, and what separates it from mere craft or amusement is that the feeling actually arrives — he called this infection."**
      *   **Accuracy:** **Accurate.** This is the foundational definition from *What Is Art?* (1897). "Infection" (*zarazhenie*) is Tolstoy's precise term. Art requires the artist to intentionally evoke a specific feeling *and* for that feeling to be successfully transmitted/received by the audience. Failure of transmission relegates it to craft or mere amusement.

  2.  **"From this he drew a moral conclusion: since art works by making people share a feeling, and the best feelings are those that unite us in Christian brotherhood..."**
      *   **Accuracy:** **Oversimplification.** While Tolstoy *did* believe the "best" art transmitted feelings promoting universal love and human unity ("Christian brotherhood" *is* a key phrase for him), his core criterion for *good* art was broader: **the religious consciousness of the age.** For Tolstoy (post-conversion), this meant the highest moral understanding accessible to humanity at that time, centered on the brotherhood of man derived from his interpretation of Christianity. However, he *did* argue that "good" art transmitted feelings accessible and binding for *all* humanity, not just a class or culture. "Christian brotherhood" captures his ideal endpoint, but "religious consciousness" was the functional standard, encompassing the highest moral perception (which he argued *was* universal brotherhood).

  3.  **"...the measure of a work is the moral lesson it carries and the number of people it can carry it to."**
      *   **Accuracy:** **Accurate, with nuance.** The "moral lesson" is inherent in the *feeling* transmitted – the feeling *is* the moral content (e.g., feeling love for one's neighbor *is* the moral lesson). He absolutely judged art by the universality ("number of people") and accessibility of the feeling, equating wider accessibility with higher value because it better served the unifying purpose of art. Art for an elite minority was fundamentally flawed.

  4.  **"This is why he judged art by the religious consciousness of his own age..."**
      *   **Accuracy:** **Accurate.** Tolstoy explicitly states that good art must transmit feelings in accord with the highest religious perception of its time – which, for his age, he defined as the consciousness of human brotherhood based on love. He saw this as an objective, evolving standard.

  5.  **"...and why his theory is often charged with making artistic value relative to a time and a place..."**
      *   **Accuracy:** **Reflects a common criticism, *not* Tolstoy's own view.** This is a key distinction. *Critics* charged him with relativism. *Tolstoy himself* believed the "religious consciousness" represented an *absolute* moral truth progressively revealed to humanity. He thought he was judging by an *absolute* standard ("brotherly love") that happened to be the pinnacle achievable *in his time*. He believed this standard was universal and timeless, even if the specific *understanding* of it evolved.

  6.  **"...and why he could dismiss so much of the received canon... as not really art at all, or else as counterfeit: art manufactured to titillate and distract rather than to infect."**
      *   **Accuracy:** **Mostly Accurate, with nuance on terminology.** He *did* dismiss vast swathes of the canon (Beethoven's late quartets being a rare exception he praised). He classified much elite/upper-class art as either:
          *   **"Bad Art"**: Failed attempts at art that didn't achieve true infection.
          *   **"Counterfeit Art"**: This is crucial - he *did* use this term (*poddelyvatel'noe iskusstvo*) extensively. It referred to works manufactured using established techniques and conventions to *simulate* art and evoke pleasure or excitement for a specific class, but lacking the *sincerity* and *universal* feeling required for true infection. Titillation and distraction *were* hallmarks of counterfeit art for him. He explicitly placed much of Shakespeare, opera, his own novels (especially the later, pre-conversion ones like *Anna Karenina*), and Beethoven's symphonies into these categories.

  7.  **"Technique, on his view, counted for nothing; a peasant song that makes you weep is worth more than a symphony that leaves you cold."**
      *   **Accuracy:** **Significant Oversimplification.** Tolstoy did *not* say technique counted for *nothing*. He argued that technique was *subordinate* to sincerity and the moral quality/universality of the feeling. Bad technique *could* hinder infection, but perfect technique without sincere, good feeling produced only counterfeit art or bad art. The peasant song vs. symphony example *is* quintessentially Tolstoyan and illustrates his *prioritization* of sincere, universally accessible feeling and successful infection over technical complexity or elite prestige. However, stating technique "counted for nothing" ignores his acknowledgment that *some* level of craftsmanship is necessary for transmission; he railed against *excessive*, artificial, or insincere technique, not technique *per se*.

  **Overall Verdict Assessment:**

  *   **Does "moralism consigns most of the canon to the ash heap" survive?** **Partially, but requires refinement.**
  *   **Corrected Verdict:** Tolstoy's theory, centered on *sincerity* and the successful infection of *universally accessible feelings* aligned with the highest *religious consciousness* (defined as universal brotherhood/love), **did indeed lead him to categorically reject the vast majority of the established Western canon as either "bad art" or, more damningly, "counterfeit art."** The moral purpose (transmitting unifying, universally accessible feelings) is absolutely the "real heart of the matter." However:
      *   It's not *just* the moral lesson, but the *sincerity* of the feeling and the *success* of its infection that are equally vital criteria alongside its moral content.
      *   The "universal accessibility" requirement (ability to infect "the number of people") is as crucial to his rejection as the specific moral content. Art for the elite was invalid *by definition*.
      *   His standard, while he believed it absolute, *functionally* led to judgments perceived as relativistic by critics because he applied his specific interpretation of "religious consciousness" rigidly.
      *   The verdict isn't *just* "moralism," but **moralism inextricably bound to sincerity, successful infection, and radical universality.**

  **Conclusion for Your Sympathies:** You are correct that the moral-purpose line is central ("the real heart of the matter"). Tolstoy's primary measure *was* the moral quality (defined by universality and brotherhood) of the feeling transmitted. However, the paragraph slightly oversimplifies this moral quality (over-emphasizing explicit "Christian brotherhood" vs. "religious consciousness/universal accessibility") and significantly misrepresents his view on technique (it's subordinated, not irrelevant). Crucially, Tolstoy's rejection of the canon stems directly from applying this demanding standard: he found most canonical art insincere, failing true infection, transmitting class-specific or harmful feelings, and thus either bad or counterfeit. Your core intuition about the centrality of moral purpose driving the repudiation is sound for understanding Tolstoy's *own* rejection of his work and the canon, but ensure the character's repudiation reflects the intertwined criteria of sincerity, infection, *and* moral universality, not just didacticism.
