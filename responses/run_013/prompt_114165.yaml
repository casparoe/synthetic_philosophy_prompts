prompt: |-
  Not a philosopher, just someone who works with data and reads philosophy of science on the side, so forgive me if I'm mangling terms.

  I keep noticing a move that I don't have a word for. Someone comes up with a model or a theory, and the way they come up with it involves staring at some particular body of data until the pieces fit -- they try this, try that, tweak until it lines up. Then, once it lines up, they turn around and present that same body of data as the evidence that the theory is right. The numbers come out great, of course they do, and it gets written up as "the theory predicts X" when really the theory was reverse-engineered from X. The striking thing is that the support they claim doesn't seem to move anyone's mind if you actually watched the sausage get made, but in the retelling it looks like a genuine hit.

  Two flavors of it that I've run into. One: the datum was already widely known before the theory existed -- everybody knew about the perihelion thing, or the fossil, or the anomaly, for years -- so it can't have raised anybody's confidence at the time the theory showed up, and yet it's trotted out as the theory's crown jewel of confirmation. Two: the datum wasn't just known beforehand, it was actively used to build the theory, so the theory couldn't have failed to fit it, and yet fitting it is offered as a mark in its favor.

  I've heard of the problem of old evidence, and of the prediction-versus-accommodation thing, and in my own world we'd just call it overfitting or double-dipping. But none of those feels like it's exactly the thing I'm circling. So: does this have a name? If it does, I want to know how it differs from each of the neighbors -- is the real sin that the datum was already known, or that it was used in the construction, or something else? Is it one phenomenon or am I lumping two together? And where's the line between this and the perfectly respectable case where a theory does accommodate a known fact in a way that genuinely should raise your credence? If there's no established name, coin one and give me a definition with some boundary cases, because the label is the least of it -- I want to know exactly what the thing is and what it isn't.
reasoning: |-
  Okay, the user is describing a common issue they've noticed in scientific modeling and theory presentation. They work with data and read philosophy of science, so they're familiar with concepts like overfitting or the problem of old evidence. But they feel those terms don't quite capture the specific phenomenon they're seeing. 

  Let me unpack what they're describing. They see two main patterns: 
  First, when a theory is built to fit already-known data, then that same data is presented as confirming evidence. Like Mercury's perihelion precession being used to "confirm" general relativity, even though Einstein knew about it when developing his theory. 

  Second, and more problematic, when data isn't just known but actively used to construct the theory - making the fit inevitable - yet still presented as independent validation. Like tweaking a model until it matches your dataset, then acting like that match is evidence of its truth.

  The user wants to know: Is this one thing or two? What exactly makes it problematic? And crucially, where's the line between this bad practice and legitimate cases where fitting known data actually should increase confidence?

  Hmm... the existing terms do feel inadequate. "Accommodation" is too broad - sometimes accommodating old evidence is valid. "Overfitting" is too narrow - this isn't just about statistical models. "Double-dipping" is close but informal. 

  I think the core issue is misrepresenting the epistemic status of the evidence. When data is used in construction, it can't later serve as independent confirmation. The sin is the rhetorical sleight-of-hand where this dependency gets erased in the retelling. 

  For the first scenario (using widely known evidence), the problem is mainly historical - it couldn't have raised confidence when introduced. For the second (data actively used in building), it's logically circular - the fit was guaranteed. Both share that the evidence appears "new" in the narrative when it wasn't.

  The boundary with legitimate cases hinges on independence. If a theory explains known data in a novel way that wasn't intentionally built in, that's different. Or if the same data tests multiple aspects simultaneously. But if the fit was engineered, it shouldn't count as evidence.

  Since there's no perfect term, maybe "retrofitted evidence misrepresentation"? Or "theory-laden confirmation"? Though the user might prefer something punchier. More importantly, they need the conceptual clarity - that's the real value here.
answer: |-
  You've perfectly articulated a deep and pervasive issue in scientific practice and rhetoric. What you're describing **doesn't have a single, universally agreed-upon name**, but it's a recognized problem cluster at the intersection of epistemology, methodology, and the sociology of science. Let's break it down:

  **Core Phenomenon:** The act of presenting data that was **instrumental in constructing a theory/model** (or was widely known beforehand) as if it were **independent, novel evidence confirming** that theory/model, thereby inflating its perceived evidential support.

  **Why Existing Terms Feel Inadequate:**
  1.  **Problem of Old Evidence (Glymour, etc.):** Focuses on why accommodating *known* evidence *should* increase belief (Bayesian conundrum). It doesn't fully capture the *active use* of the data in construction or the *rhetorical misrepresentation*.
  2.  **Accommodation vs. Prediction:** Distinguishes fitting existing data from predicting new data. While prediction is often seen as stronger, *legitimate* accommodation *can* increase confidence (e.g., a simpler/more unified explanation). Your issue is about misrepresenting accommodation *as if it were prediction* or *overstating* its confirmatory power *specifically because the construction process guaranteed the fit*.
  3.  **Overfitting/Double-Dipping (Stats/ML):** Excellent analogs! Overfitting highlights tailoring a model *too closely* to specific data, harming generalizability. Double-dipping highlights using the same data for training and testing. However, these terms are most at home in quantitative modeling and don't always capture the *theoretical* or *rhetorical* aspects in broader science (e.g., using a known fossil to build an evolutionary model, then citing the fossil fit as evidence).
  4.  **HARKing (Hypothesizing After Results are Known):** Close, but HARKing typically involves *changing the hypothesis* post-hoc to fit data. Your case often involves building the *entire theory* around the data from the start.

  **Names & Definitions for the Phenomenon You Describe:**

  Here are terms/concepts that capture aspects, along with their nuances:

  1.  **Retrofitted Confirmation / Confirmation by Construction:**
      *   **Definition:** Presenting the successful fit of a theory to a specific dataset as confirmatory evidence, when the theory's structure, parameters, or core assumptions were explicitly adjusted or designed *to achieve that very fit*.
      *   **Key Sin:** The data wasn't a *test*; the theory was *made* to pass this specific "test" during its development. The fit was guaranteed by the process, not discovered by the theory. The rhetoric obscures this dependency.
      *   **Differentiator:** Explicitly highlights the *construction process* as the source of the guaranteed fit, making the subsequent claim of confirmation misleading. Strongest for your "Flavor Two".
  2.  **Non-Independent Evidence Misrepresentation:**
      *   **Definition:** Mischaracterizing evidence that was used in the development of a theory (or was its known target) as being evidentially independent of that development process.
      *   **Key Sin:** The epistemic violation lies in falsely implying the evidence stands *outside* the theory-building loop, giving it undue weight. It erases the causal/historical link.
      *   **Differentiator:** Focuses on the *independence* (or lack thereof) as the crucial factor and the *misrepresentation* thereof. Covers both flavors well.
  3.  **The Sausage-Making Epistemic Fallacy (Your Term, Embrace It!):**
      *   **Definition:** The fallacy of judging the evidential support for a theory based on its *final, presented fit* to data, while ignoring or downplaying the extent to which the theory was iteratively adjusted *using that same data* during its development ("sausage-making"), thereby guaranteeing the fit and invalidating its use as independent confirmation.
      *   **Key Sin:** Ignoring the developmental history where fit was engineered, not predicted.
      *   **Differentiator:** Vividly captures the disconnect between the messy process and the clean presentation. Very descriptive.

  **Distinguishing the Flavors & Boundaries:**

  *   **Flavor One (Known Beforehand):** This primarily suffers from **weak confirmatory power due to lack of novelty**. Everyone knew T. rex had tiny arms; a new dinosaur theory explaining *why* might be elegant/unifying, but citing the arm length as *strong confirmation* is weak sauce. It didn't surprise anyone or change probabilities much when the theory appeared. The sin is **overstating the significance of accommodating old evidence**.
  *   **Flavor Two (Actively Used in Construction):** This suffers from **logical circularity and misrepresentation of independence**. If you massaged parameter X until the model output matched Dataset Y, then claim "See! The model predicts Dataset Y perfectly! Believe it!", you're being deceptive. The fit was *manufactured*, not *revealed*. The sin is **presenting engineered fit as evidentially independent test results**.
  *   **The Respectable Case (Genuine Credence Boost via Accommodation):**
      *   A theory provides a **novel, simpler, or more unified explanation** for diverse, *previously known* facts that were *not* individually targeted during construction. (e.g., Plate Tectonics explaining mountain ranges, fossils, earthquakes together).
      *   A theory **entails known evidence in a way that wasn't obvious or intended** during its construction. The fit is discovered, not built-in.
      *   The same dataset provides a **genuinely severe test** because it simultaneously tests *multiple, risky* aspects of the theory, making it unlikely *any* arbitrary tweaking would achieve the fit. (This is rare and hard to demonstrate).
      *   **The Key Difference:** In the respectable case, the fit *wasn't guaranteed* by the construction process; it was a *consequence* of the theory's core structure applied to the world. The construction didn't *force* the fit to *this specific data point*.

  **Boundary Cases:**

  1.  **Exploratory Data Analysis -> Hypothesis:** You stare at data, see a pattern, formalize a hypothesis *based* on that pattern. You then *test it on new data*. This is **valid science**. The sin only occurs if you present the *initial* pattern-fitting as *confirmation* of the hypothesis derived from it.
  2.  **Parameter Estimation from Calibration Data:** You use Dataset A to estimate parameters for a model with a fixed structure. You then test the *parameterized model* on *new* Dataset B. This is **standard practice**. The sin occurs if you then present the fit to Dataset A as evidence of the model's *truth* or *general validity* (beyond its calibrated state), rather than just a necessary step.
  3.  **Predicting a Known-but-Ignored Anomaly:** A theorist genuinely doesn't know about a specific anomaly (say, a subtle spectral line). They develop a theory for other reasons. They *then* calculate its prediction for that anomaly and find it matches. This is **strong confirmation**, even though the data existed beforehand. The key is the theorist's *ignorance* during construction.

  **In essence:** The core problem you're identifying is the **epistemic inflation** that happens when the *guaranteed consequence of a theory's construction process* (fitting specific data it was built around) is rhetorically repackaged as an *independent empirical success* that *confirms* the theory. It's about the **misrepresentation of the relationship between the theory-building process and the evidence**.

  **Label Suggestion:** Given your description, **"Retrofitted Confirmation"** or **"Non-Independent Evidence Misrepresentation"** seem most precise. **"Theory-Laden Confirmation"** (emphasizing the data was shaped by the theory's needs) or **"Engineered Fit Fallacy"** also work. The crucial thing is understanding the mechanism: **construction guarantees fit; presentation misrepresents fit as independent evidence.** This awareness is far more valuable than any single label. Your "sausage-making" intuition is spot-on – the final presentation hides the process that made the outcome inevitable.
