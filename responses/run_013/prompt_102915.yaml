  ### Scoring Key
  Map your answers to the theories using the table below. Each theory is defined by:
  - **Axis 1**: Whether one semantics covers **both indicative and counterfactual** conditionals (Yes/No).  
  - **Axis 2**: Whether the semantic value is **truth conditions over worlds** (T) or **conditional probability/credence** (P).  

  | Answers (Q1–Q9)                            | Theory                          | Axis 1 | Axis 2 | Notes                                                                 |
  |---------------------------------------------|---------------------------------|--------|--------|-----------------------------------------------------------------------|
  | B, B, B, A, B, A, B, A, B                  | Material Implication            | Yes    | T      | Treats conditionals as truth-functional.                              |
  | C, B, B, A, B, A, B, A, B                  | Strict Conditional              | Yes    | T      | Requires truth in all accessible worlds.                             |
  | A, A, A, B, B, A, A, B, A                  | Variably Strict (Lewis/Stalnaker) or Pragmatic | Yes   | T      | One semantics with context-dependent "closeness" of worlds.          |
  | C, A, A, B, A, B, A, B, A                  | Suppositional (Adams-style) or Dynamic | No  | P      | Probabilistic (Adams) or context-update (Dynamic); indicatives ≠ counterfactuals. |
  | A, A, B, B, B, A, A, B, A                  | Causal/Structural              | No     | T      | Counterfactuals based on causal models; indicatives differ.          |
  | C, A, A, B, B, B, A, B, A                  | Truth-Value Gap                | Yes    | T      | Impossibility/ambiguity voids truth value.                            |

  #### Key Insights:
  - **Axes Summary**:
    - **Axis 1 (One semantics for both?)**  
      - **Yes**: Material, Strict, Variably Strict/Pragmatic, Truth-Value Gap.  
      - **No**: Suppositional/Dynamic, Causal.  
    - **Axis 2 (Semantic value?)**  
      - **T (Truth conditions)**: Material, Strict, Variably Strict/Pragmatic, Causal, Truth-Value Gap.  
      - **P (Probability/Update)**: Suppositional/Dynamic.  

  - **Forced Choices**:  
    - **Q6** separates theories on impossible antecedents: **A** (vacuously true) vs. **B** (no truth value).  
    - **Q2** separates theories where indicative/counterfactual differ due to **modal base** (epistemic vs. metaphysical) rather than semantics.  

  - **Unresolved Positions**:  
    - **Variably Strict** and **Pragmatic** share the same pattern (difference is in implementation: "closeness" vs. pragmatics).  
    - **Suppositional** and **Dynamic** share the same pattern (both reject truth conditions for indicatives).  
    - **Causal** is the only theory with **B for Q3** (both Sobel sequences coherent).  

  - **Incoherent/Unexplored Combinations**:  
    - **Q3 = A and Q7 = B**: Antecedent strengthening fails (Q3) but monotonicity holds (Q7). Unexplored.  
    - **Q1 = C and Q6 = A**: Neither true (Q1) but vacuously true (Q6). Incoherent.  
    - **Q9 = B and Q4 = B**: Unconditional obligation (Q9) with non-monotonic "even if" (Q4). Ugly/no theory fits.  

  This quiz sorts you into broad clusters; real theories often have nuanced overlaps. Discuss in your group how these cases challenge or support each approach!
