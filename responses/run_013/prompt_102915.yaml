  ### Which Theory of Conditionals Do You Actually Believe? Quiz

  Answer the following questions based on your intuitions about conditionals. Choose the option that best reflects your judgment.

  1. **Oswald/Kennedy Scenario**  
     We know Oswald shot Kennedy and acted alone. Consider:  
     (A) If Oswald hadn't shot Kennedy, someone else would have.  
     (B) If Oswald hadn't shot Kennedy, no one else would have.  
     What do you think?  
     - **A**: (B) is true and (A) is false.  
     - **B**: Both (A) and (B) are true.  
     - **C**: Neither (A) nor (B) is true.  

  2. **Adams Pair (Indicative vs. Counterfactual)**  
     We’re in a room that looks red, but it might be under red lighting.  
     - Indicative: "If the room isn’t red, it’s under red lighting."  
     - Counterfactual: "If the room hadn’t been red, it would have been under red lighting."  
     How do you judge them?  
     - **A**: The indicative is acceptable, but the counterfactual is not.  
     - **B**: Both are acceptable.  

  3. **Sobel Sequence & Reverse Sobel**  
     - *Sobel Sequence*:  
       (1) If I had walked on the ice, it would have broken.  
       (2) But if I had walked on the ice and it had been reinforced, it wouldn’t have broken.  
     - *Reverse Sobel*:  
       (1) If I had walked on the ice and it had been reinforced, it wouldn’t have broken.  
       (2) But if I had walked on the ice, it would have broken.  
     Which sequence seems coherent?  
     - **A**: The Sobel sequence is coherent; the reverse Sobel is not.  
     - **B**: Both sequences are coherent.  

  4. **"Even If" Conditional**  
     "Even if it rains, the game will take place."  
     What does this imply?  
     - **A**: The game will take place regardless of rain.  
     - **B**: The game will take place, but rain might have been expected to prevent it.  

  5. **Biscuit Conditional**  
     "There are biscuits on the sideboard if you want some."  
     How do you interpret this?  
     - **A**: It’s a conditional assertion: if you want biscuits, I assert they’re there.  
     - **B**: It’s a standard conditional, true only if either there are biscuits or you don’t want any.  

  6. **Impossible Antecedent**  
     "If 2+2=5, then I am the Pope."  
     How do you evaluate this?  
     - **A**: It’s (vacuously) true.  
     - **B**: It has no truth value.  

  7. **Antecedent Strengthening**  
     (1) If I strike this match, it will light.  
     (2) If I strike this match and it is wet, it will light.  
     How do (1) and (2) relate?  
     - **A**: (1) can be true while (2) is false.  
     - **B**: If (1) is true, (2) must be true too.  

  8. **Hypothetical Syllogism**  
     Premise 1: If I work hard, I’ll get a promotion.  
     Premise 2: If I get a promotion, I’ll be happy.  
     Conclusion: If I work hard, I’ll be happy.  
     Is this valid?  
     - **A**: Yes.  
     - **B**: No.  

  9. **Deontic Conditional**  
     "If you go to the store, you should buy milk."  
     How do you understand this?  
     - **A**: It’s a conditional obligation: when you go, you’re obligated to buy milk.  
     - **B**: It’s an unconditional obligation to make it the case that if you go, you buy milk.  

