answer: |-
  ### Specification: Requirements for a General-Purpose Definition of Life  

  #### **I. Cases Demanding Correct Classification**  
  *(Verdicts reflect consensus where clear; motivation emphasizes why misclassification would undermine utility)*  

  1. **Viruses (inc. giant viruses & virophages)**:  
     - *Verdict*: Not alive.  
     - *Motivation*: Lacks intrinsic metabolism and independent reproduction; parasitizes cellular machinery. Giant viruses (e.g., *Mimivirus*) blur boundaries but remain dependent. Virophages parasitizing other viruses (e.g., *Sputnik*) reinforce non-autonomy.  

  2. **Viroids**:  
     - *Verdict*: Not alive.  
     - *Motivation*: Infectious RNA without protein-coding capacity; no metabolism or self-replication machinery.  

  3. **Prions**:  
     - *Verdict*: Not alive.  
     - *Motivation*: Misfolded proteins inducing conformational changes; no genetic material or energy processing.  

  4. **Plasmids & Transposons**:  
     - *Verdict*: Not alive.  
     - *Motivation*: Mobile genetic elements; replicate only within host cells but lack organizational unity or metabolism.  

  5. **Mitochondria & Chloroplasts**:  
     - *Verdict*: Not alive (currently).  
     - *Motivation*: Endosymbiotic organelles; retain DNA but are inseparable from host cell function and regulation.  

  6. **Sterile Hybrids (e.g., mule)**:  
     - *Verdict*: Alive.  
     - *Motivation*: Exhibits metabolism, growth, response to stimuli; sterility is irrelevant to current vitality.  

  7. **Dormant States (spore, frozen tardigrade, seed)**:  
     - *Verdict*: Alive.  
     - *Motivation*: Metabolic activity suspended but retains potential for revival; distinguishes latent life from death.  

  8. **Corpse vs. Statue**:  
     - *Corpse*: Was alive. *Statue*: Never alive.  
     - *Motivation*: Corpse retains biochemical residues of past life (e.g., decaying DNA); statue lacks biological organization.  

  9. **Flame**:  
     - *Verdict*: Not alive.  
     - *Motivation*: Exhibits self-organization and energy flow but lacks information storage, evolution, or cellular structure.  

  10. **Self-Replicating Crystal**:  
      - *Verdict*: Not alive.  
      - *Motivation*: Replicates structure but no metabolism, adaptation, or genetic variation.  

  11. **Computer Virus**:  
      - *Verdict*: Not alive.  
      - *Motivation*: Digital replication without physical embodiment, metabolism, or Darwinian evolution.  

  12. **Synthetic Minimal Cell (e.g., *Mycoplasma laboratorium*)**:  
      - *Verdict*: Alive.  
      - *Motivation*: Engineered but satisfies cellular criteria (metabolism, reproduction, evolution).  

  13. **Isolated Cell Parts (e.g., ribosome)**:  
      - *Verdict*: Not alive.  
      - *Motivation*: Functional fragments lack holistic organization, autonomy, or reproductive capacity.  

  ---

  #### **II. Distinctions That Must Not Collapse**  
  1. **Currently alive vs. Was-alive vs. Never-alive**  
     - *Why*: Critical for origins-of-life research, forensics, and exobiology (e.g., Mars rover analyzing fossils).  

  2. **Organism vs. Part vs. Product**  
     - *Why*: Mitochondria (parts) differ from free-living bacteria (organisms) or waste (products); impacts biotechnology and symbiosis studies.  

  3. **Token-Level Properties (e.g., metabolism) vs. Lineage-Level Properties (e.g., evolution)**  
     - *Why*: Sterile mules (tokens) are alive without reproducing; evolution requires populations. Collapsing conflates individuals with history.  

  4. **Life as a Natural Kind (objective category) vs. Cluster Concept (fuzzy boundaries)**  
     - *Why*: Natural-kind views risk false binaries (e.g., viruses); cluster views risk arbitrariness. Must balance precision with flexibility.  

  5. **What Is Alive vs. What We Can Detect as Alive**  
     - *Why*: Detection (e.g., via biosignatures) is empirical; aliveness is ontological. Confusing them biases astrobiology toward Earth-like life.  

  ---

  #### **III. Scientific Constraints**  
  *(Non-negotiable empirical foundations)*  
  1. **Metabolism, Reproduction, and Evolution Can Dissociate**  
     - *Constraint*: Mules (no reproduction), prions (no metabolism), and frozen tardigrades (paused evolution) exist. No definition can assume they co-occur.  

  2. **Life Is Cellular (in known instances)**  
     - *Constraint*: All undisputed life forms (bacteria, archaea, eukaryotes) are cellular. Non-cellular candidates (viruses) remain contested.  

  3. **Thermodynamic Openness**  
     - *Constraint*: Life maintains energy gradients and local entropy reduction (e.g., via metabolism). Contradicts equilibrium-based definitions.  

  4. **Darwinian Evolution Requires Heritable Variation**  
     - *Constraint*: Evolution acts on lineages, not individuals. Sterile organisms challenge definitions requiring token-level evolution.  

  5. **Life as We Know It Is Carbon-Based, Water-Dependent**  
     - *Constraint*: Alternative biochemistries are speculative; definition must not preclude them but cannot ignore empirical reality.  

  ---

  #### **IV. Analysis of Requirements**  
  **A. Genuine Desiderata vs. Mere Prejudices**  
  - *Non-negotiable Desiderata*:  
    - Correct case classification (e.g., dormant states alive, viruses not).  
    - Preservation of key distinctions (e.g., token vs. lineage).  
    - Consistency with empirical constraints (e.g., dissociation of traits).  
  - *Prejudices*:  
    - Demand for necessary/sufficient conditions (preference for formal rigor; conflicts with cluster views).  
    - Operational/testability in field (application-specific; astrobiology prioritizes this, theoretical biology may not).  

  **B. Jointly Unsatisfiable Requirements**  
  - **Conflict**: Requiring *both* token-level aliveness (e.g., metabolism in mules) *and* lineage-level evolution (which mules lack).  
  - **Why**: Token-level criteria admit mules/spores but exclude viruses; lineage-level criteria admit viruses but exclude mules. No definition can satisfy both without compromising key cases.  

  **C. Lineage-Eligibility Condition**  
  - *Adopt*: Yes, as a desideratum.  
    - *Forces*: Alive entities must, in principle, be capable of ancestry (e.g., spores qualify; computer viruses do not).  
    - *Costs*: Excludes mules and obligate hybrids unless "in principle" includes hypothetical genomic rescue (e.g., cloning).  

  **D. Main Definition Families vs. Requirements**  
  - **Metabolic Views**: Fail viruses but pass mules/dormancy; struggle with dissociation (e.g., prions lack metabolism).  
  - **Evolutionary/Replicator-First Views**: Pass viruses but fail mules/dormancy; collapse token/lineage distinction.  
  - **Thermodynamic Views**: Overinclude flames/crystals; underinclude dormant states.  
  - **Cluster/Functional Views**: Handle borderline cases (viruses) but risk vagueness; may violate natural-kind preference.  

  **E. Most Exclusionary Requirement**  
  The **distinction between token-level and lineage-level properties** excludes the most candidates:  
  - Evolutionary definitions fail by requiring lineage properties (evolution) for token aliveness (excluding mules).  
  - Metabolic definitions fail by ignoring lineage properties (underemphasizing evolution’s role in life’s continuity).  

  ---

  \answer{Token-lineage distinction}
