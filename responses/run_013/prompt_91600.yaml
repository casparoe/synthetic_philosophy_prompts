  Here's a joke hitting those specific points, focusing on the lump's potential and recyclability while freaking out the statue:

  **Setting:** A sculptor's studio. A magnificent statue (let's say "David") stands proudly. The lump of clay it's made from speaks, its voice emanating from within.

  **Lump of Clay:** "Nice form, Dave. Very heroic."
  **Statue (David):** "Thank you! The pinnacle of artistry. Michelangelo captured my essence perfectly."
  **Lump of Clay:** "Yeah, yeah. Looks good. Remember that vase I was last week? Lovely glaze. Before that, I was a little horse. *Really* cute horse."
  **Statue (David):** "You... you were a horse? And a vase? But... you're *me* now. I'm David!"
  **Lump of Clay:** "Eh, you're just Tuesday. The sculptor mentioned something about needing a toilet plunger base tomorrow. Should be... functional."
  **Statue (David):** (Eyes widening in horror, voice cracking) "...A plunger? But... but... I could have been a *horse*?!"

  **Why it works:**

  1.  **Core Concepts:**
      *   **Distinct Objects:** The statue identifies as "David," a specific form with an essence. The clay identifies independently as itself, referencing its past lives (the vase, the horse).
      *   **Different Persistence/Counterfactuals:** The clay explicitly mentions surviving its transformation *from* a vase and *from* a horse into David ("Remember that vase I was last week?"). It also highlights the "could-have-been-a-horse" aspect for the lump ("Before that, I was a little horse").
      *   **Recyclability:** The punchline hinges entirely on the clay's imminent *future* transformation into something completely different and mundane (a toilet plunger base), demonstrating its persistence beyond the statue's current form.
  2.  **Existential Freakout:** David's realization hits hard – "I could have been a *horse*?!" This combines the horror of his imminent destruction ("plunger") with the jarring counterfactual possibility the lump possessed, which *he* never had. His identity as "David" is fragile and temporary, while the clay's identity is persistent and flexible.
  3.  **Accessibility:** You don't need to know the philosophy. The joke clearly shows the statue ("David") and the material ("Clay") have different histories, futures, and perspectives on what they *are*. David's shock at being temporary and the clay's casual mention of its past/future lives are the core comedy.
  4.  **Punchline Specificity:** It directly uses the "could-have-been-a-horse" counterfactual *and* the "will-be-recycled" persistence difference to create the statue's existential crisis.

  It avoids the lazy "two things in one spot" by making the conflict about their differing histories, potentials, and futures – the very things that define them as distinct objects in the philosophical problem. David's final line captures the inherent tragedy (and absurdity) of the statue's position perfectly.
