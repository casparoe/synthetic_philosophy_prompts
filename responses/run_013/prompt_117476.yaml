answer: |-
  ## Proposal: The Normative Fragility of Transplanting Harsanyi’s Aggregation to Moral Uncertainty

  **Research Question:** When Harsanyi’s aggregation theorem is adapted to aggregate across competing moral theories under uncertainty (instead of individual preferences), does the standard veil-of-ignorance argument used to justify equal weighting of individuals retain its normative force in justifying a prior distribution over theories, or does the shift from uncertainty about *identity* to uncertainty about *truth* fundamentally undermine the justification for equiprobability and thereby the utilitarian conclusion?

  **The Gap:** Harsanyi's aggregation theorem establishes that a social preference satisfying Pareto and expected utility axioms must be a weighted sum of individual utilities. The theorem’s proponents then invoke a veil-of-ignorance scenario: an impartial chooser, ignorant of their future identity but assigning equal probability to being any individual, rationally maximizes expected utility, leading to average utilitarianism (equal weights). Critics often target the axioms (e.g., cardinal measurability, expected utility) or the ethical acceptability of utilitarianism itself. Meanwhile, proponents of "moral uncertainty" frameworks enthusiastically adapt the theorem's formal structure: they propose aggregating competing moral theories (e.g., utilitarianism, deontology, prioritarianism) under uncertainty by seeking a meta-ranking that satisfies Pareto-like dominance and is representable as a weighted sum of the theories' evaluations, using a prior over theories to fix weights. Crucially, **all these positions overlook the specific role of *identity uncertainty* in the original justification for equiprobability.** Defenders take the veil's normative force for granted in the individual context and assume it transfers. Critics target the axioms or the utilitarian outcome, not the specific mechanics of the veil's justification for weights. Moral uncertainty frameworks directly transplant the equiprobability assumption (as a uniform prior) without rigorously examining whether the *reason* it was normatively compelling for individuals – the nature of the uncertainty involved (who will I *be*?) – holds when the uncertainty is about which theory is *correct*. This project isolates and tests that overlooked normative link.

  **Approach & Rationale (Conceptual/Axiomatic):**
  This project demands conceptual precision and axiomatic analysis to isolate the specific normative function of the veil-of-ignorance argument within the Harsanyi framework and rigorously compare the structure of identity uncertainty versus theory uncertainty. A survey of applications would reveal *how* the transplant is used, not *why* it might be normatively flawed at its core. Empirical approaches are irrelevant to this foundational normative question. Alternatives like analyzing historical debates risk losing the sharp focus on the formal and normative structure of the justification step.

  *   **Months 1-2: Deconstructing Harsanyi's Justification:**
      *   Precisely formalize the original theorem and the *separate* veil argument for weights.
      *   Identify the core normative claims implicitly relied upon: the rational necessity of maximizing expected utility under identity uncertainty, the normative defensibility of equiprobability *specifically because* the chooser must *become* one person and lacks any reason to favor one over another *ex ante*.
      *   Output: Axiomatic characterization of the identity-uncertainty choice scenario and its claimed normative force.

  *   **Months 3-4: Mapping the Transplant to Moral Uncertainty:**
      *   Formalize the standard adaptation: theories as "individuals," theory-uncertainty replacing identity-uncertainty, a prior over theories replacing equiprobability over identities.
      *   Pinpoint the exact structural analogy and where the user's suspicion of fracture lies: the chooser in moral uncertainty *does not become a theory*; they remain an agent trying to act under uncertainty about what is objectively right.
      *   Output: Clear comparison framework highlighting the identity/truth uncertainty distinction within the formal aggregation structure.

  *   **Months 5-6: Interrogating Equiprobability & Alternatives:**
      *   Analyze the normative foundation for a uniform prior over theories. Does "no reason to favor one theory over another" hold the same weight as "no reason to favor one identity over another" when the uncertainty is epistemic (about truth) rather than constitutive (about being)? Argue *why* it does not.
      *   Rigorously examine proposed alternatives to a uniform prior (e.g., maximin, specific risk attitudes, alternative priors). Demonstrate formally how each:
          *   (a) Necessarily alters the resulting aggregation rule (e.g., no longer a simple weighted sum maximizing expectation).
          *   (b) Reflects a fundamentally *different* type of normative reasoning (e.g., caution, epistemic weighting) unavailable and unnecessary in the original identity-uncertainty context.
      *   Output: Formal proofs/demonstrations showing how alternative weight-fixing mechanisms under theory uncertainty change the fundamental nature of the aggregation.

  *   **Months 7-8: Normative Payload Assessment:**
      *   Evaluate whether the normative force of the original Harsanyi argument (deriving a *specific*, normatively compelling social ordering from individual rationality under impartiality) survives the transplant.
      *   Argue that the failure identified in Months 5-6 means the adapted framework *cannot* derive a uniquely compelling aggregation rule from rationality and impartiality alone; it smuggles in substantive (and contestable) epistemic or normative commitments via the choice of prior/weighting rule.
      *   Output: Synthesis arguing the normative failure is inherent to the uncertainty shift, not a technical fixable flaw.

  *   **Month 9: Writing & Dissemination:**
      *   Draft journal article manuscript.
      *   Present findings internally.

  **Expected Outcomes & Failure Conditions:**
  *   **Positive Result:** A rigorous demonstration that the normative justification for equal weights (and thus average utilitarianism) in the individual case relies *essentially* on the nature of identity uncertainty, and that this justification *fails* under theory uncertainty because equiprobability lacks the same normative foundation and alternatives fundamentally alter the aggregation. The project succeeds by conclusively showing the transplant severs the normative link.
  *   **Negative Result:** Discovery of a robust formal equivalence or normative argument showing that the justification for equiprobability *does* transfer meaningfully to theory uncertainty, or that the normative force of the aggregation under theory uncertainty arises independently of the original veil justification. This would falsify the core suspicion but still be a valuable finding.
  *   **Project Failure:** Inability to formally distinguish the normative roles of identity vs. truth uncertainty within the aggregation structure, or failure to demonstrate that alternative weight-fixing mechanisms under theory uncertainty constitute more than just a reinterpretation. Failure would manifest as conceptual muddle or inconclusive formal results.

  **Scope Management:**
  The core is the formal-contrastive analysis of identity vs. theory uncertainty within the Harsanyi structure (Months 1-6). **First Cut:** Detailed exploration of *multiple* alternative weighting rules under theory uncertainty (Month 6) could be streamlined to focus on 1-2 key examples (e.g., maximin vs. uniform prior) if behind schedule. **Second Cut:** If necessary, reduce the depth of the normative payload assessment (Month 8) to a preliminary conclusion, focusing the writing (Month 9) on the formal contrast. The essential analysis (Months 1-5) must be preserved.

  **Strongest Objection & Reply:**
  *   **Objection:** "The normative force of aggregation under moral uncertainty doesn't depend on mimicking Harsanyi's *justification* for weights. The uniform prior is justified independently on epistemic grounds (e.g., principle of indifference for symmetric ignorance), or the weights are simply a parameter representing the agent's subjective uncertainty. The formal structure is valuable regardless."
  *   **Reply:** This concedes the core point. If the justification for the weights shifts from Harsanyi's specific identity-based impartiality argument to generic epistemic principles or subjective degrees of belief, then the claim that Harsanyi's theorem (and its associated normative promise) *directly* justifies a particular approach to moral uncertainty collapses. The "transplant" metaphor is misleading; it's merely using a similar mathematical form for a distinct purpose with distinct justifications. The project’s value lies in exposing this shift and showing that the original Harsanyian normative argument *cannot* be carried over to ground weights in moral uncertainty. The resulting framework lacks the normative foundation its proponents often imply it inherits.

  This project offers a sharp, novel critique of a foundational move in moral uncertainty theory by rigorously examining the often-overlooked role of identity in Harsanyi's original normative argument. It promises to clarify the limits of formal aggregation theorems in settling deep normative disagreements.
