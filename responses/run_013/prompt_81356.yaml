answer: |-
  ### Desiderata for a Grounding-Based Theory of Fundamentality

  | Requirement | Motivating case or consideration | What it rules out | Status |
  |-------------|----------------------------------|-------------------|--------|
  | **Singleton Asymmetry** | A singleton set's existence is grounded in its sole member, but the member can exist without the set. | Symmetric grounding (member grounds set and set grounds member); sets as fundamental. | Non-negotiable |
  | **Normative Emergence** | A city's injustice is grounded in descriptive facts (policing, housing, etc.), but these only entail injustice given normative assumptions. | Reductionism (injustice grounded purely in descriptive facts without normative context). | Non-negotiable |
  | **Context Sensitivity** | A joke's funniness is grounded in its setup/punchline only in specific contexts (audience, era); same facts fail to ground funniness elsewhere. | Context-insensitive grounding relations; eternalism about grounded properties. | Non-negotiable |
  | **Grounding Fact Status** | If "A grounds B" is a fact, it must be either grounded or ungrounded (fundamental). | Ignoring the metaphysical status of grounding claims. | Negotiable |
  | **Grounding vs Causation** | Grounding is synchronic, constitutive, and non-causal (e.g., member grounds singleton); causation is diachronic and event-based. | Conflating metaphysical dependence with causal production. | Non-negotiable |
  | **Grounding vs Supervenience** | Grounding explains *why* supervenience holds (e.g., injustice supervenes on social facts *because* they ground it). | Treating supervenience as explanatory or sufficient for fundamentality claims. | Non-negotiable |
  | **Monadic vs Relative Fundamentality** | Quantum fields may be monadically fundamental (absolutely basic), while tables are relatively fundamental (within ordinary objects). | Collapsing "fundamental" to a single univocal notion. | Preference (one camp) |
  | **Irreflexivity** | No fact grounds itself (e.g., injustice doesn't ground injustice). | Reflexive loops (A grounds A). | Non-negotiable |
  | **Asymmetry** | If A grounds B, B cannot ground A (e.g., member grounds singleton, not vice versa). | Mutual grounding (A grounds B and B grounds A). | Non-negotiable |
  | **Transitivity** | If atoms ground molecules and molecules ground cells, atoms ground cells. | Non-transitive chains (A grounds B, B grounds C, but A doesn't ground C). | Preference (one camp) |
  | **Well-foundedness** | All non-fundamental facts terminate in fundamental facts (no infinite regress). | Infinitely descending chains or circles of dependence. | Negotiable |
  | **Explanatory Asymmetry** | Grounding provides direction: base facts explain grounded facts (e.g., policing facts explain injustice). | Symmetric or non-explanatory dependence. | Non-negotiable |
  | **Completeness** | Grounding bases must be sufficient for the grounded fact (e.g., injustice requires all relevant social facts + normative context). | Partial grounds without full necessitation. | Non-negotiable |

  ### Conflict Report

  ```json
  {
    "unsatisfiable_pairs": [
      {
        "requirements": ["Transitivity", "Context Sensitivity"],
        "because": "Transitivity requires A grounding B and B grounding C to entail A grounding C, but context sensitivity allows A to ground B in context X and B to ground C in context Y without A grounding C in any context (e.g., joke setup grounds funniness in 1980s, funniness grounds laughter in 1980s, but setup doesn't ground laughter in 2020s)."
      },
      {
        "requirements": ["Well-foundedness", "Grounding Fact Status"],
        "because": "If grounding facts (e.g., 'A grounds B') must be grounded, this triggers infinite regress (what grounds the grounding of A grounding B?). If ungrounded, it violates well-foundedness unless all grounding facts are fundamental—which proliferates fundamental facts."
      }
    ],
    "most_exclusionary_requirement": {
      "name": "Well-foundedness",
      "justification": "Demands a fundamental base, conflicting with context sensitivity (shifting bases), grounding fact status (regress risk), and monadic fundamentality (if no base exists)."
    },
    "camp_pressure": {
      "priority monism": "Monadic vs Relative Fundamentality",
      "grounding primitivism": "Grounding Fact Status",
      "grounding-as-explanation": "Context Sensitivity"
    }
  }
  ```

  #### Key Conflicts Explained:
  - **Transitivity vs Context Sensitivity**:  
    Transitivity assumes context-independent chains, but the joke case shows grounding is context-relative. A theory must either abandon transitivity (e.g., allow context-bound grounding) or deny context sensitivity (e.g., treat context as part of the ground).
    
  - **Well-foundedness vs Grounding Fact Status**:  
    The singleton case assumes grounding claims are factual. If such facts require grounding, well-foundedness demands a fundamental base—but grounding facts either regress infinitely or must be fundamental, conflicting with their derivative appearance. Primitivism accepts ungrounded grounding facts; infinitism rejects well-foundedness.

  #### Camp Pressures:
  - **Priority Monism**: Pressured by **Monadic vs Relative Fundamentality**—must reconcile the whole (monadically fundamental) with parts (relatively fundamental) without collapsing the distinction.
  - **Grounding Primitivism**: Pressured by **Grounding Fact Status**—taking grounding as primitive forces grounding facts to be ungrounded, risking an ad hoc proliferation of fundamental facts.
  - **Grounding-as-Explanation**: Pressured by **Context Sensitivity**—if grounding is explanatory, the joke case demands explanations be context-relative, challenging objectivity.
