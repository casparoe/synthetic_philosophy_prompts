  | **Decision-Theoretic Incommensurability** | Pre- and post-parenthood states are so ontologically distinct that no rational utility comparison is possible. | Decision-theoretic     | Contentious/False (critics: we make cross-transformative decisions constantly) | **Yes (theoretically)**: But only under radical assumptions rejected by most decision theorists. | No                      |
