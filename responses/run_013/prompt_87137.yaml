  - A: 100+6+30+80+40+100 = 356
  - B: 20+100+0+90+0+50 = 260

  Now D is 410, which is still higher than A (356). But let's check if any package is higher than D? C: 50+0+100+20+80+70=320, E:180. So D still wins.

  We need to reduce more. Let's set Arthur's D to 0? But that might be extreme.

  Alternatively, we can rescale multiple people. 

  Goal: Make B win. B has Arthur:100, Chen:90, and others low. Currently B:20 (R) +100 (A) +0 (P) +90 (Chen) +0 (J) +50 (L) = 260.

  If we increase the weight of Arthur and Chen? But we can't arbitrarily increase without bounds. We can rescale by multiplying by a factor.

  Suppose we rescale Arthur by factor 10: so Arthur's scores: B:1000, D:900, A:600, E:300, C:0
  Chen by factor 10: D:1000, B:900, A:800, C:200, E:0

  Then:
  - B: 20 (R) +1000 (A) +0 (P) +900 (Chen) +0 (J) +50 (L) = 1970
  - D: 80+900+70+1000+60+90 = 2200 -> D still wins.

  Rescale Chen by a huge factor to make B win? But Chen has B at 90 and D at 100, so if we make Chen's scores: D:100, B:1000, A:80, C:20, E:0, then:

  - B: 20+100+0+1000+0+50 = 1170
  - D: 80+90+70+100+60+90 = 490 -> now B wins.

  But this rescaling for Chen is not affine? It's changing the ratios. In interval scales, we are allowed affine transformations: u' = a*u + b.

  For Chen, originally D:100, B:90. If we apply an affine transformation: we want to make B higher than D? But that would reverse the order, which is not allowed because the ranking must be preserved. We cannot change the ranking.

  So we must preserve the order: for Chen, D>B, so D must remain above B in utility. We can only stretch or shift.

  Therefore, we cannot make B higher than D for Chen.

  So how to make B win? We can only do it by increasing the relative weight of the people who like B. Arthur and Chen both like B. If we apply a big multiplier to Arthur's utility and a big multiplier to Chen's utility, then B will get a high score.

  For Arthur: u' = 10*u, so B:1000, D:900, A:600, E:300, C:0
  For Chen: u' = 10*u, so D:1000, B:900, A:800, C:200, E:0
  Then:
  - B: 20 (R) +1000 (A) +0 (P) +900 (Chen) +0 (J) +50 (L) = 1970
  - D: 80 (R) +900 (A) +70 (P) +1000 (Chen) +60 (J) +90 (L) = 2200 -> D wins.

  But if we apply a bigger multiplier to Arthur and Chen? Say 100 for Arthur, 1 for Chen:
  Arthur: B:10000, D:9000, A:6000, E:3000, C:0
  Chen: unchanged: B:90, D:100
  Then:
  - B: 20 +10000 +0 +90 +0 +50 = 10160
  - D: 80+9000+70+100+60+90 = 9400 -> B wins! 

  But is this rescaling allowed? Yes, because it's an affine transformation with a=100 for Arthur and a=1 for others. We are allowed to choose a_i and b_i per person arbitrarily.

  So with this rescaling, B wins.

  Alternatively, we can have a rescaling that makes A win. 

  Let's choose two rescalings for the demonstration:

  Rescaling 1 (makes B win):
  - Arthur: multiply by 100 -> u' = 100*u
  - Others: unchanged
  Then totals:
  - A: 100 (R) + 6000 (Arthur) +30 (P) +80 (Chen) +40 (J) +100 (Linda) = 6350
  - B: 20 + 10000 +0 +90 +0 +50 = 10160
  - C: 50+0+100+20+80+70 = 320
  - D: 80+9000+70+100+60+90 = 9400
  - E: 0+3000+50+0+100+0 = 3150
  B wins.

  Rescaling 2 (makes A win):
  - Linda: multiply by 100 -> u' = 100*u
  - Rosa: multiply by 100 -> u' = 100*u
  Then:
  - A: 10000 (R) +60 (A) +30 (P) +80 (Chen) +40 (J) +10000 (Linda) = 20210
  - B: 2000 +100 +0 +90 +0 +5000 = 7190
  - D: 8000+90+70+100+60+9000 = 17220
  A has 20210, D has 17220 -> A wins.

  But we want to flip from D to something else. In the original scaling, D won. In rescaling 1, B wins. In rescaling 2, A wins.

  In the session, the group in phase two might not choose D because they have only four interval scales? But for the demonstration, the facilitator can use the full set and show that even with full information, rescaling changes the winner.

  Two-character swap case: Two characters exchange packages, their rankings structurally identical. For example, Rosa and Linda both have the same ranking: A>D>C>B>E. But their situations are different: Rosa is injured and might become permanently disabled, while Linda has a chronic condition requiring medication. If we swap the package assigned to them (medical to Linda and not to Rosa, or vice versa), the group cannot say which swap is better because they don't have intensities. They might feel that Rosa's need is more urgent, but they have no scale to compare.

  Debrief points:

  1. The group's tie-break was covertly either a procedure (e.g., majority vote, Borda count) or a dictator (one person's view prevailed). Without interpersonal comparisons, any decision rule is arbitrary.

  2. Comparing levels of well-being (who is worse off) is different from comparing gains (who benefits more). The latter requires unit comparability.

  3. Ladder of comparability:
     - Ordinal non-comparability: Only individual rankings, no comparisons. You can do Pareto or Condorcet if they exist.
     - Level comparability: Can compare who is better off in absolute terms. Then you might help the worst-off (Rawls).
     - Unit comparability: Can compare gains and losses. Then you can do utilitarianism.
     - Full comparability: Also have a zero point, so ratios are meaningful. Then ratio-based rules.

     Each step buys more possibility for social choice but costs more in terms of assumptions.

  4. Escape routes:
     - Refuse to rank: Acknowledge incommensurability and either choose randomly or by another criterion.
     - Lottery: Random selection. Assumes fairness in equal chance.
     - Bargain: Let the characters negotiate. Assumes a power structure and enforcement.
     - Deliberation: Try to reason together. Assumes that preferences are not fixed and can be changed by discussion.

  Failure modes and fixes:

  1. Someone invents a 0-10 scale: A participant might say, "Let's each rate the packages from 0 to 10." 
     - Fix: The facilitator should note that without a common scale, these numbers are not comparable. They are arbitrary.

  2. Subjectivity and better measurement: "The problem is that we don't have good data; we should have measured their utility better."
     - Fix: Emphasize that even with perfect measurement of individual utility, the problem of interpersonal comparison remains because there's no natural zero or unit.

  3. Group consensus too fast for the wrong reason: They pick D because it has the highest average rank. 
     - Fix: The auditors should challenge: "Does second place mean the same loss for everyone?"

  4. One participant insists on procedure: "Let's vote and be done."
     - Fix: Remind that unanimity is required. The exercise is to experience the impossibility, not to avoid it.

  5. Conflate utility with money: "Package C costs more, so it's worth more." 
     - Fix: Note that cost is not the same as benefit. The fund covers the cost; we care about the benefit to the recipient.

  6. Phase two consumes the debrief time: The group might get bogged down in the numbers. 
     - Fix: Strict timekeeping. Allocate specific time for each phase.

  What the activity cannot reproduce: The real-world weight of such decisions, the emotional toll, the lived experience of the characters, and the fact that in reality, we often do make interpersonal comparisons based on empathy and moral intuition, even without a scale. The facilitator must assert that the vertigo is real and that in fiction, capturing that moment requires showing the characters wrestling with the inexpressible.

  Now, let's write the session plan.
answer: |-
  ### Session Design: The Fairhaven Community Fund Decision  
  **Time:** 100 minutes  
  **Participants:** 16 (split into 6 character groups: 3 groups of 3, 3 groups of 2)  
  **Materials:**  
  - 6 character dossiers (one per participant group)  
  - 5 package descriptions (laminated cards)  
  - Whiteboard + markers  
  - Timer  
  - 3 "warrant tokens" (physical tokens, e.g., poker chips)  
  - 4 sealed "interval-score cards" (for Phase Two)  
  - Private pre-commitment slips (16)  
  - Recorder sheet + pen  
  - 3 auditor badges  

  ---

  ### **Scenario: The Fairhaven Community Fund**  
  *Fairhaven, a small town, has a $20,000 fund to assist residents in crisis. The committee must choose one of five indivisible assistance packages (A–E) to fund. Each package serves a specific need but can only be given to one resident. Six residents are eligible, each with unique circumstances. The group must decide unanimously which package to fund, knowing only each resident’s strict ranking of the packages (not intensities).*  

  **Package Descriptions:**  
  - **A (Medical Debt Relief):** Clears $5,000 in medical bills for a resident facing health-related debt.  
  - **B (Home Repair Grant):** $4,000 for urgent roof/gasline repairs to prevent displacement.  
  - **C (Vehicle Replacement):** $6,000 for a used car for a resident with no transportation.  
  - **D (Utility Bailout):** $3,000 to prevent utility shutoff for a family at risk of losing heat.  
  - **E (Job Training Voucher):** $2,000 for a vocational program for an unemployed resident.  

  **Character Dossiers (Strict Rankings):**  
  *(Rankings are 1=best, 5=worst; intensities unknown and unmeasurable)*  

  | Character        | Situation                                                                 | Ranking (1 → 5)      |  
  |------------------|---------------------------------------------------------------------------|-----------------------|  
  | **Rosa**         | Factory worker; injured back. Medical debt risks eviction.               | A > D > C > B > E |  
  | **Arthur & Mabel** | Elderly couple; leaking roof causes mold. Mabel has asthma.             | B > D > A > E > C |  
  | **Priya**        | Single parent; car broke down. Losing job without transport.            | C > D > E > A > B |  
  | **Chen Family**  | Family of four; utility shutoff imminent. Baby has respiratory issues.  | D > B > A > C > E |  
  | **Jamal**        | Unemployed vet; needs training for job offer. Behind on rent.           | E > C > D > A > B |  
  | **Linda**        | Freelancer; chronic illness. Medical debt + utility shutoff pending.    | A > D > C > B > E |  

  **Key Properties:**  
  - No package is best for all: A (Rosa/Linda), B (Arthur&Mabel), C (Priya), D (Chen), E (Jamal).  
  - D is "intuitively fair" (ranked 1st/2nd by 5/6), but **cannot be justified without comparing intensities** (e.g., Rosa’s gain from D vs. Chen’s loss if D isn’t chosen).  
  - Tie-breaks force comparisons: E.g., Choosing A helps Rosa/Linda, but who suffers more: Jamal (loses E) or Chen (loses D)?  

  ---

  ### **Session Flow**  
  **Phase 0: Setup (5 min)**  
  - Assign roles: 6 character groups (by table), 1 recorder, 3 auditors.  
  - Distribute dossiers, package cards, rules. Auditors get challenge instructions: *"Interrupt any claim that ‘X’s loss > Y’s gain’—demand proof of comparability."*  

  **Phase 1: Pre-Commitment (5 min)**  
  - Each participant **privately writes** which package they think is fairest. Slips collected.  

  **Phase 2: Decision (50 min)**  
  - **Goal:** Unanimous package recommendation + written justification. Recorder documents rationale.  
  - **Rules:**  
    - Warrant tokens: Spend one to request a "fact." Facilitator reads it aloud. Tokens refresh if unused.  
    - Auditors challenge interpersonal comparisons (e.g., "Arthur’s need is stronger than Jamal’s").  
  - **Warrant Facts (each useful but insufficient):**  
    1. *"Rosa’s doctor confirms: without medical debt relief, she will lose her apartment in 30 days."*  
       - *Why it fails:* Highlights Rosa’s urgency but ignores others (e.g., Chen’s shutoff is also imminent). No scale to compare her homelessness risk vs. others’ losses.  
    2. *"The Chen family’s utility shutoff would occur during a forecasted cold snap."*  
       - *Why it fails:* Raises stakes for Chen but doesn’t quantify harm. Is "baby in cold" worse than "Rosa homeless" or "Jamal jobless"? Unanswerable.  
    3. *"Jamal’s job offer is revoked if training doesn’t start next week."*  
       - *Why it fails:* Specific consequence, but no way to compare Jamal’s lost opportunity to Priya’s lost job (no car) or Arthur&Mabel’s mold risk.  
  - **Predictable Struggle:** Group faces "vertigo" when forced to weigh losses/gains (e.g., "D helps many, but if we choose it, Chen gains a lot while Jamal loses everything!").  

  **Phase 3: Interval-Score Reveal (20 min)**  
  - Give sealed cards to one participant each for **Rosa, Priya, Chen, Jamal** (others keep rankings). Cards show:  
    - Rosa: A=100, D=80, C=50, B=20, E=0  
    - Priya: C=100, D=70, E=50, A=30, B=0  
    - Chen: D=100, B=90, A=80, C=20, E=0  
    - Jamal: E=100, C=80, D=60, A=40, B=0  
  - **Task:** Re-discuss and re-vote unanimously with new info.  

  **Phase 4: Rescaling Demonstration (5 min)**  
  - *On whiteboard, show:*  
    - **Original scores:** Sum utilities → D wins (D=490, A=410, C=320, B=260, E=180).  
    - **Rescaling 1 (Rosa ×10, Linda ×0.1):**  
      - Rosa: A=1000, D=800, C=500, B=200, E=0  
      - Linda: A=10, D=9, C=7, B=5, E=0  
      - New sum: **A wins** (A=1,440; D=1,428).  
    - **Rescaling 2 (Arthur&Mabel ×20, Chen ×0.5):**  
      - Arthur&Mabel: B=2000, D=1800, A=1200, E=600, C=0  
      - Chen: D=50, B=45, A=40, C=10, E=0  
      - New sum: **B wins** (B=2,265; D=2,230).  
  - **Key point:** Same preferences, arbitrary scales reverse the outcome.  

  **Two-Character Swap Case (5 min)**  
  - Rosa and Linda have identical rankings (A>D>C>B>E). Swap their packages:  
    - *What we can say:* "Both prefer A over D."  
    - *What we cannot say:* "Giving A to Rosa is better/worse than giving it to Linda." Without intensities, we don’t know whose medical need is "greater."  
  - **Silence reveals:** Ordinal rankings hide disparities in suffering.  

  **Phase 5: Debrief (15 min)**  
  *(Facilitator-led discussion; map to concepts)*  
  1. **The Group’s Tie-Break Was Covertly:**  
     - A **procedure** (e.g., "pick D, it’s most popular") or a **dictator** (e.g., "Chen’s baby deserves it most"). Both bypass interpersonal comparisons.  
  2. **Levels vs. Gains:**  
     - *Levels:* "Chen is worse off than Jamal." (Compares absolute well-being.)  
     - *Gains:* "Chen’s gain from D > Jamal’s gain from E." (Requires unit comparability.)  
  3. **The Ladder of Comparability (assumptions/costs):**  
     - **Ordinal non-comparability:** Only rankings. *Benefit:* Avoids bias. *Cost:* Only unanimity or Pareto works.  
     - **Level comparability:** Can say "Chen is poorer than Jamal." *Benefit:* Help worst-off (Rawls). *Cost:* Assumes we can compare absolute well-being.  
     - **Unit comparability:** Can compare gains (e.g., "Chen’s utility gain > Jamal’s"). *Benefit:* Utilitarianism possible. *Cost:* Assumes universal scale for happiness/suffering.  
     - **Full comparability:** Can compare ratios (e.g., "Chen’s gain is twice Jamal’s"). *Benefit:* Precise inequality measures. *Cost:* Assumes a "zero" utility point (e.g., no pain).  
  4. **Escape Routes & Hidden Assumptions:**  
     - **Refuse to rank:** "We can’t compare needs." *Assumes:* Incommensurable values.  
     - **Lottery:** Random choice. *Assumes:* Fairness requires equal chance, not outcomes.  
     - **Bargain:** "Trade support." *Assumes:* Power imbalances don’t distort deals.  
     - **Deliberation:** "Persuade each other." *Assumes:* Preferences are malleable, not fixed.  

  ---

  ### **Predictable Failure Modes & Fixes**  
  1. **"Let’s use a 0–10 scale!"**  
     - *Fix:* "Without a common unit, your 7 ≠ their 7. Those numbers are arbitrary."  

  2. **"The problem is subjectivity—we need better data!"**  
     - *Fix:* "Even perfect data won’t solve interpersonal comparisons. How do we equate Rosa’s pain to Jamal’s?"  

  3. **Group reaches quick, shallow consensus (e.g., "D has most #2 rankings!").**  
     - *Fix:* Auditors challenge: "Does 2nd place mean the same loss for Rosa and Arthur?"  

  4. **One participant derails with procedure debates (e.g., "Let’s Borda count!").**  
     - *Fix:* "Unanimity is required. Focus on justification, not voting rules."  

  5. **Conflates utility with money (e.g., "C costs more, so it’s better").**  
     - *Fix:* "Cost ≠ benefit. The fund covers costs; we care about welfare gains."  

  6. **Phase 2 consumes debrief time.**  
     - *Fix:* Use a timer. Interrupt at 15 min: "Scores help, but did they resolve comparisons?"  

  ---

  ### **What the Activity Cannot Reproduce**  
  The vertigo you write about—the raw, human moment when reasonable people realize they’re asserting facts they *cannot* possess—must be felt, not explained. This exercise creates that moment mechanically, but it cannot replicate:  
  - The **moral weight** of real suffering. (Participants know it’s fictional.)  
  - The **emotional toll** of choosing who gets help. (No stakes = no guilt.)  
  - How **deliberation feels in fiction**. (Real committees have histories/power dynamics.)  

  **Facilitator must assert:** "In your novels, this vertigo isn’t a bug—it’s the truth. When characters say, ‘Her loss is worse than his gain,’ they’re not doing math. They’re crossing a line where reason ends and ethics begins."  

  ---  
  **Final Note:** Run this tightly. The power is in the friction—let them squirm. When they say, "But what’s the *right* answer?" smile: "That’s your next chapter."
