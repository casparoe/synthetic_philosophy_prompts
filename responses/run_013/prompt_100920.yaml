prompt: |-
  My friend works on dispositions — what it is for a thing to be fragile, soluble, and so on. She's been giving me verdicts on cases and I want to know what she'll say about a new one. Her calls so far:

  - ordinary drinking glass: fragile
  - glass with a sorcerer standing by who'd magically stop it breaking if you struck it, so it actually wouldn't break: still fragile
  - glass packed in foam so a blow wouldn't break it: still fragile
  - steel ball that a sorcerer would make shatter if you struck it, so it would break but only because of the sorcerer: not fragile
  - glass that's been treated so it genuinely can't break under any blow: not fragile

  New case: a glass with the usual fragile make-up, but built so that the instant a blow lands an internal mechanism converts it into unbreakable plastic before it can break. Right up until it's struck it has the fragile structure; but striking it would never actually produce a break.

  What's she gonna say? I'm less interested in the yes/no than in the rule or rules she seems to be running, what each of them predicts here, which you'd actually bet on and why, and what further case would force the issue. And seperate the parts where people who know this area actually agree from the parts that are genuinely disputed — don't hand me one side as if it's just what everyone thinks.
