  ### (c) Marking Scheme (25 Marks Total)

  *   **Part 1: Conceptual Foundation (8 marks)**
      *   **Explanation (4 marks):** Clear explanation that a mixed strategy can exploit different weaknesses against different opponent profiles, while a single pure strategy cannot (2 marks). Explicit statement that strict dominance requires strictly higher payoff for *every* opponent profile (1 mark). Link to the definition of mixed strategy payoff (1 mark).
      *   **Example (3 marks):** Correct and clear payoff matrix (1 mark). Demonstration that no pure strategy dominates D (1 mark). Demonstration that a specific mixed strategy (e.g., (1/2 U, 1/2 M)) strictly dominates D (1 mark). *(-1 mark if payoff calculation error)*
      *   **Connection (1 mark):** Correct statement that a strategy is strictly dominated (by a mixed strategy) iff it is never a best response.

  *   **Part 2: Procedural Divergence (12 marks)**
      *   **Game Construction (3 marks):** Providing a correct and clear payoff matrix for a game demonstrating the divergence (e.g., the final (T, M, B) vs (L, R) example) (2 marks). Strategies and players clearly labelled (1 mark). *(Significant error in matrix design: -2 marks)*
      *   **Pure-IESDS Process (2 marks):** Correctly showing no elimination occurs or limited elimination occurs, resulting in a larger surviving set (e.g., {T,M,B} & {L,R}) (1 mark). Accurate step-by-step reasoning (1 mark). *(Error: Assuming pure dominance exists where it doesn't: -1 mark)*
      *   **Mixed-IESDS Process (4 marks):** Correctly identifying a strategy dominated only by a mixed strategy (e.g., B dominated by (1/2 T, 1/2 M)) and eliminating it first (2 marks). Correct subsequent elimination steps (e.g., L dominated by R, then T dominated by M) leading to a smaller set (e.g., {M} & {R}) (2 marks). *(Error: Failing to find the mixed dominance; Incorrect payoff calc: -1 per error; Stopping prematurely: -1)*
      *   **Defensible Set & Justification (2 marks):** Correctly identifying the Mixed-IESDS set as more defensible (e.g., {M},{R}) (1 mark). Valid justification: e.g., it corresponds to the NE; Pure-IESDS retains strategies never a best response (like B) (1 mark). *(Error: Choosing Pure-IESDS set: -2; Weak justification: -1)*
      *   **Reconciliation (1 mark):** Clear statement that order-independence holds *for the Mixed-IESDS procedure itself* and that Pure-IESDS is a different algorithm/weaker concept, not just a different order. *(Error: Claiming divergence violates order-independence generally: -1)*

  *   **Part 3: Contrast with Weak Dominance (5 marks)**
      *   **Strict Dominance Properties (2 marks):** Correctly stating order-independence (1 mark) and preservation of all NE (1 mark) for Mixed-IESDS.
      *   **Weak Dominance Properties (3 marks):** Correctly stating order-dependence (1 mark), potential loss of Nash equilibria (1 mark), and giving a brief reason or illustration (e.g., "can eliminate equilibrium strategies") (1 mark). *(Error: Attributing order-independence to weak dominance: -1; Failing to mention loss of NE: -1)*

  **Common Errors & Deductions:**
  *   **-2 marks:** Assuming a pure strategy must be dominated by a pure strategy to be eliminated in IESDS.
  *   **-2 marks:** Confusing strict and weak dominance in definitions or processes.
  *   **-1 mark:** Minor calculation error in payoffs.
  *   **-1 mark:** Poor explanation or lack of clarity in reasoning.
  *   **-1 mark:** Failing to provide explicit payoff matrices where requested.
  *   **-1 mark (per instance):** Mislabeling players/strategies in matrices or text.

  **Verdict:** Allowing mixed strategies as dominators expands the set of eliminable strategies to include all never-best-responses, leading to a smaller, more refined (and order-independent) survival set than pure-only elimination, which may leave irrationalizable strategies.
