prompt: |-
  I'm a software engineer with no philosophical training, and I keep running into something in planning meetings that I have no good word for. Two estimates can carry the same number and still be completely different things to act on. One colleague says there's a seventy percent chance the migration lands this quarter, and I will build the schedule around it without much worry, because we've done twenty of these and roughly fourteen came in on time. Another gives the same seventy percent for a rewrite on a stack nobody here has used, and I want to double-check everything and keep a fallback ready. The number on the slide is identical; what differs is how much is standing behind it.

  There's a second pattern I suspect is connected. For some decisions there is no series of similar cases to count at all — we are choosing one architecture, once, for a product that doesn't exist yet — and yet people still write a number on the slide. The number then seems to summarise the quality of the argument rather than the frequency of anything, and two people can agree on the argument and still disagree about the number without either of them having made a mistake.

  Is there an established name for what I'm circling, and is it one phenomenon or two? I know roughly the distinction people draw between risk and uncertainty, and I've heard of error bars and confidence levels, but none of those seems to be about the part I care about: that the strength of the case behind a probability is a separate thing from the probability itself, and that we act on the two separately. Please give me a definite verdict on which existing concept, if any, is the best home for this, and which parts of what I've described it fails to cover. If nothing fits, coin a term and define it, with edge cases — does it still apply when nothing is being repeated, and does it apply to an everyday judgement like thinking some claim is probably true? I don't need a reading list or citations; I want the concepts sorted out and the boundaries drawn, and I'd rather you take a position than lay out the options.
reasoning: |-
  Okay, the user is a software engineer dealing with a nuanced problem in planning meetings. They've noticed that two estimates can have the same numerical probability (like 70%) but feel completely different in terms of how actionable they are. The difference lies in what's behind that number—whether it's based on historical data (like 14 out of 20 migrations being on time) or something entirely new (like a rewrite on an unfamiliar stack). 

  The user also mentions a second pattern where probabilities are assigned to one-off decisions with no historical data, and here the number seems to represent the strength of the argument rather than any frequency. They suspect these two patterns might be connected and are looking for a conceptual framework to describe this. 

  First, I need to recall relevant philosophical concepts. The distinction between "risk" (known probabilities) and "uncertainty" (unknown probabilities) by Knight comes to mind, but the user already knows that and feels it doesn't capture the full picture. The key here seems to be the epistemic weight or robustness behind the probability—how much justification it has. 

  The term "epistemic robustness" feels right. It emphasizes the depth of knowledge supporting the estimate. For the first scenario, the migration estimate has high robustness because of historical data, while the rewrite has low robustness due to unfamiliarity. For the second pattern, robustness comes from the quality of reasoning in one-off decisions. 

  I should also consider if existing terms like "confidence intervals" or "error bars" fit, but those are statistical and don't address the foundational justification aspect. The user wants something that applies even when there's no repetition, like judging a claim's truth based on argument strength. 

  Edge cases: Does this apply to everyday judgments? Yes—e.g., believing a news story based on multiple sources (high robustness) vs. a single anonymous tip (low robustness), even if both feel "70% likely." The core is always about the evidence's depth and quality, not the number itself. 

  The user’s deeper need seems to be about improving team communication. They want a term to flag when an estimate is "shaky" so plans can account for that. "Epistemic robustness" does that by separating the probability value from its support structure. 

  Final check: Does this cover both patterns? Yes—the first is about data-backed robustness, the second about argument-backed robustness. And it handles non-repeatable cases. The user doesn’t need citations; they want a actionable concept. So I’ll define it clearly, stress it’s about the "what stands behind," and position it as the missing layer in their meetings.
answer: |-
  You've nailed a critical flaw in how teams use probabilities for decision-making, and the core concept you're circling is **epistemic robustness**. This is *not* the probability itself (the 70%), but **the strength, depth, and reliability of the evidence and reasoning justifying that probability estimate**.

  Here's the definitive breakdown:

  1.  **Your Core Insight is Correct:** The *number* (70%) is the **surface claim**. What differs is the **epistemic foundation** supporting it. This foundation determines how much weight you should give the number when planning and acting.
  2.  **It's One Phenomenon, Manifesting in Two Ways:**
      *   **Scenario 1 (Migration vs. Rewrite):** Both claim P=0.7.
          *   *Migration:* High epistemic robustness. The estimate rests on frequentist data (14/20 successes) – a strong, objective foundation. The number is "heavy" and reliable for planning.
          *   *Rewrite:* Low epistemic robustness. The estimate rests on subjective intuition, analogies to dissimilar projects, or sheer guesswork about an unknown domain. The number is "light" and requires contingency planning. It's effectively a quantified expression of deep uncertainty.
      *   **Scenario 2 (One-off Architectural Decision):** Low epistemic robustness by nature. There *is no relevant frequency*. The number (e.g., P=0.8 this architecture meets scalability goals) is a **subjective confidence level** summarizing the perceived strength of the *argument* (benchmarks, theoretical models, expert intuition). Disagreements on the number despite agreeing on arguments stem from differing interpretations of the *weight* of those arguments – a core aspect of judging epistemic robustness.
  3.  **Why Existing Terms Fall Short:**
      *   **Risk vs. Uncertainty (Knight):** Useful, but doesn't capture the *gradient* you observe. Both your scenarios involve Knightian uncertainty (unknown true probabilities), but the *migration* estimate has much higher robustness *despite* that uncertainty. "Uncertainty" is too broad.
      *   **Error Bars / Confidence Intervals:** These quantify *precision* or *variability* around an estimate, not the *robustness of the foundation* of the estimate itself. A precise estimate (tight error bars) can still have low epistemic robustness if built on shaky ground (e.g., precise measurement of the wrong thing).
      *   **Confidence Levels (Stats):** Refers to the long-run frequency of an interval containing the true parameter *assuming the model is correct*. It doesn't address the robustness of the model or data generating the estimate.
      *   **Calibration:** While important (do 70% claims happen 70% of the time?), it's an *outcome* measure. Epistemic robustness is about the *input justification* *before* the outcome is known. A poorly justified estimate might be calibrated by luck.
  4.  **Defining Epistemic Robustness for Decision-Making:**
      *   **Epistemic Robustness (ER):** The degree to which a quantitative estimate (like a probability) is justified by reliable, relevant, and substantial evidence and reasoning.
      *   **High ER:** Estimates grounded in:
          *   Direct historical frequency data from similar contexts.
          *   Well-validated predictive models applied to relevant data.
          *   Consensus of deeply knowledgeable experts *with direct, relevant experience*.
          *   Robust causal understanding of the underlying system.
      *   **Low ER:** Estimates grounded in:
          *   Sparse or non-existent historical data.
          *   Analogies to superficially similar but fundamentally different contexts.
          *   Intuition, gut feeling, or optimism/pessimism bias.
          *   Expert opinion in novel or poorly understood domains.
          *   Complex chains of reasoning with many unverified assumptions.
      *   **How You Act:** High ER estimates can drive core plans. Low ER estimates demand:
          *   Explicit identification of key assumptions.
          *   Contingency planning & fallbacks.
          *   Explicit monitoring of assumptions.
          *   Phased approaches to gather data and increase robustness.
          *   Treating the number as a placeholder for "high uncertainty" rather than a reliable prediction.

  **Boundaries & Edge Cases:**

  1.  **Non-Repeatable Events (Architecture Choice):** **Applies perfectly.** ER is low *because* it's non-repeatable. The "evidence" is the quality of the reasoning and the applicability of any supporting data/models/analogies. Two people agreeing on the evidence but differing on the probability reflects differing judgements about the *sufficiency* of that evidence – a core aspect of assessing ER.
  2.  **Everyday Judgements ("This claim is probably true"):** **Applies directly.**
      *   *High ER:* "The weather report from a reliable service says 70% chance of rain, and I see dark clouds." (Multiple converging evidence sources).
      *   *Low ER:* "My friend, who sometimes exaggerates, said there's a 70% chance it rains later." (Single, unreliable source).
      *   The *feeling* of "probably true" might be the same (P=0.7), but the action (take an umbrella?) depends heavily on the ER of that belief.
  3.  **True Aleatory Uncertainty (Pure Chance):** Even in pure games of chance (a fair die), the *assignment* of P=1/6 has very high ER – it's derived from the *known, symmetric properties* of the die. The outcome is random, but the probability estimate is robust. ER is about the justification for the *estimate*, not the inherent randomness of the event.

  **The Verdict:** **Epistemic Robustness** is the established conceptual home for what you're describing. It cleanly separates the *quantitative estimate* (the number on the slide) from the *quality of its justification* (what's standing behind it). It explains both your scenarios as manifestations of the same core phenomenon – the varying strength of the evidential foundation – and dictates how you should differentially act on numerically identical estimates. It applies universally to any quantified belief, regardless of repeatability. Start using this term in your meetings: *"What's the epistemic robustness behind that 70%?"* forces the critical discussion about evidence quality you need.
