  ### Explanation of Key Elements  
  - **Critical Disanalogy**: The echo chamber metaphor imports the passive physics of resonance but fails to capture the *agency* behind discrediting external sources. Physical boundaries reflect signals automatically; epistemic communities actively dismantle dissent.  
  - **Conclusions Surviving**: The core distinctions (bubbles burst by exposure; echo chambers resist exposure) remain valid despite disanalogies.  
  - **Better Metaphor**: "Immunological defense" better captures the *adaptive, active* rejection of external information in echo chambers (e.g., preemptive discrediting as a learned "immune response"). The bubble metaphor lacks a superior alternative due to its simplicity.  
  - **Verdicts**: Both metaphors **partially hold**—they usefully frame the maladies but rely on physical properties (tension, resonance) absent in epistemic contexts. Decorative disanalogies (e.g., time delays) don’t undermine practical conclusions, while structural ones (e.g., active defense) do.
