prompt: |-
  I am a third-year philosophy student currently taking a course on philosophy of mind and cognitive science, and I serve as the student representative on my university's Access and Accommodations Review Board. The Board must decide, at its meeting this Friday, a case that has divided us, and I have been asked to circulate a short written opinion before the vote.

  The case concerns a student with a documented episodic-memory impairment who requests permission to use, during closed-book in-person exams, a wearable device running a custom retrieval system. The device is not connected to the internet and contains only the student's own lecture notes, annotations, and previously solved problem sets, indexed by the student's own associations. It responds to subvocal queries by surfacing relevant entries and, when asked, paraphrasing them in its own words. The student reports that in trial runs she sometimes cannot tell whether an answer came from the device or from her own memory, and that the device once surfaced a note she had forgotten writing. She says it adds no new information, returning only what she has already studied, but at a speed and reliability her unaided memory cannot match. Our written policy has two relevant categories: accommodation, available to any student with a documented disability and not recorded on the transcript; and unauthorized aid, which is referable for academic misconduct. The policy permits assistive technology that compensates for a disability and forbids aids that give an unfair advantage.

  The Board's chair has proposed adopting what she calls the Functional Integration Standard: an external resource counts as part of a student's cognition, and so as an accommodation rather than an aid, when it is reliably coupled, automatically endorsed rather than consciously consulted, and recruited by the student's own reasoning. A rival group favors the Internal Benchmark Standard: accommodations may restore performance only up to a baseline measured without external storage, because anything beyond that is enhancement and cannot be separated from cheating. A third member has raised what he calls the offloading asymmetry: the device helps only because the student already did the cognitive work, but the exam is supposed to measure retrieval under unaided conditions, so the help is real even if no new content is added.

  Please draft the memo I will circulate. It should recommend a concrete decision—grant, deny, or grant with conditions—and specify a time frame and any conditions the Board can actually administer before the student's exams begin the following Monday. It should apply the Board's existing categories rather than inventing a new policy wholesale, though it may propose a narrow clarification if the existing categories cannot handle the case. It should engage the strongest argument for the side you reject, especially the worry that the Functional Integration Standard would license almost any convenient external memory and make closed-book exams meaningless. It should say what the Board would be committing itself to about the boundary between a student's mind and a student's tools, and what later case would best test whether that commitment is coherent. The case has affinities with the extended mind thesis, but I do not want a literature review; the memo should be self-contained and usable by members who have not read the philosophical background.
reasoning: |-
  Okay, let me approach this systematically. The user is a philosophy student serving on an accommodations board facing a complex case about memory augmentation during exams. They need a practical, principled memo that resolves the tension between disability accommodation and academic integrity.

  First, I need to identify the core conflict: Is this wearable memory device a legitimate accommodation for episodic memory impairment or does it constitute cheating? The existing policy distinguishes between assistive technology (allowed) and unfair advantages (forbidden). 

  The key arguments to address are:
  - The Functional Integration Standard (device as extended cognition)
  - The Internal Benchmark Standard (only restoration to baseline)
  - The offloading asymmetry concern (device relies on prior work but bypasses real-time retrieval)

  Hmm... the philosophical depth here is fascinating but the memo must remain practical. The user explicitly wants no literature review, so I'll avoid mentioning extended mind theory directly while capturing its operational essence. 

  For the recommendation, I'm leaning toward granting with conditions because:
  1. The device contains only the student's own studied materials
  2. Its functionality aligns with compensating for documented memory impairment
  3. Denial would functionally exclude the student from demonstrating knowledge

  But I must address the strongest counterargument: that this could make closed-book exams meaningless. The memo should clarify that this doesn't open floodgates because:
  - It requires documented episodic memory disability
  - The integration must be automatic (not conscious consultation)
  - Content is strictly student-generated

  The offloading asymmetry is trickiest. My solution: frame exams as measuring understanding, not retrieval performance under artificially constrained conditions. The student already did the cognitive work; the device just mitigates access barriers.

  For implementation, I'll propose:
  - Immediate provisional approval for upcoming exams
  - Post-exam review of device logs to verify no internet access
  - Faculty consultation to ensure exam questions test application, not rote recall

  Later cases that would test this principle might involve:
  - Devices with generative capabilities beyond verbatim retrieval
  - Students using similar tech without documented disabilities

  The memo must conclude with clear institutional positioning: We recognize integrated cognitive tools as legitimate extensions of mind when they compensate for specific impairments without adding novel capabilities. This maintains exam integrity while honoring accommodation commitments.
answer: |-
  **MEMORANDUM**  
  **TO:** Access and Accommodations Review Board  
  **FROM:** [Your Name], Student Representative  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation re: Wearable Retrieval Device Accommodation Request  

  ### I. RECOMMENDATION  
  **Grant provisional approval** for the student’s use of the wearable device during closed-book exams, effective immediately for the upcoming exam period (beginning Monday), subject to three conditions:  
  1. **Pre-exam verification** by the Accommodations Office (by 5 PM Friday) that the device:  
     - Contains **only the student’s own notes, annotations, and prior work** (no external sources).  
     - Has **no internet/wireless connectivity**.  
     - Operates solely via **subvocal queries** (no manual input during exams).  
  2. **Exam proctoring** to ensure device use aligns with documented functionality.  
  3. **Post-exam review** of device logs (if available) to confirm compliance.  

  ### II. ANALYSIS & RATIONALE  
  This request falls under **accommodation**, not unauthorized aid, per our policy. The device compensates for a documented episodic-memory impairment by restoring the student’s ability to access knowledge *she already possesses*, without introducing new information or unfair advantages. Our policy permits assistive technology that "compensates for a disability"; denying this would functionally exclude the student from demonstrating her understanding.  

  #### Key Considerations:  
  **A. Addressing the Functional Integration Standard (FIS) Concern**  
  The strongest objection to FIS—that it could erode closed-book exams by licensing excessive external aids—is valid but inapplicable here. This device meets a high threshold for integration:  
  - **Reliable coupling:** The student reports automatic endorsement (e.g., indistinguishable from recall).  
  - **No conscious consultation:** Subvocal queries avoid disruptive "look-up" behaviors.  
  - **Recruited by reasoning:** Outputs are interwoven with the student’s cognitive process.  
  *Crucially, this does not open floodgates:* Permissible aids under FIS require (1) a documented disability, (2) seamless integration (no conscious delegation), and (3) exclusive use of the student’s pre-existing knowledge.  

  **B. Rejecting the Internal Benchmark Standard (IBS)**  
  IBS fails because it conflates *memory access* with *knowledge acquisition*. The student’s prior study demonstrates mastery; the device merely mitigates retrieval barriers. Holding her to an "unaided baseline" would unfairly penalize her disability. Exams should assess understanding, not the biological medium of recall.  

  **C. Resolving Offloading Asymmetry**  
  While exams traditionally measure unaided retrieval, this assumes equal access to biological memory. For this student, unaided conditions impose an artificial deficit unrelated to subject comprehension. The device corrects that asymmetry using her own intellectual labor.  

  ### III. BOUNDARY COMMITMENT & FUTURE TEST  
  By approving this request, the Board commits to a principle:  
  > **Tools that are functionally fused with a student’s cognition, compensate for a disability, and output only the student’s pre-existing knowledge may become extensions of the mind for accommodation purposes.**  

  **Test case for coherence:** A student requests a device that *generates original inferences* from their notes (e.g., "Explain this concept in a new way"). Unlike the current device (verbatim retrieval/paraphrase), such tools *produce* novel content, crossing into unauthorized aid.  

  ### IV. CONCLUSION  
  Approve this accommodation with the stated conditions. It aligns with our policy’s intent, upholds academic integrity, and recognizes that cognition can extend to integrated tools when disabilities impair biological function. Denial would undermine equitable access to assessment.  

  ---  
  **Timeframe:** Provisional approval by **Friday EOD** for Monday’s exams. Verification must occur Friday; proctoring/log-review are executable within 48 hours.  
  **Vote Recommendation:** Grant with conditions.
