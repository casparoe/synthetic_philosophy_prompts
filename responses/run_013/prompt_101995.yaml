  ### **Flagged Overlaps and Unoccupied Branches**  
  1. **Overlap between leaves:**  
     - **Landauer-Bennett** and **Fluctuation-Theorem** resolutions *partially collapse*: Both allow entropy decreases if costs are "paid later" (erasure) or averaged (fluctuations). The key difference is ontological: Landauer-Bennett treats the second law as *enforced* by erasure, while Fluctuation-Theorem treats it as *emergent* from statistics.  
     - **Incompressible-Memory** and **Correlation-Cost** resolutions may overlap: Both tie entropy to information properties (randomness/correlation), but the former focuses on memory *state*, the latter on system-demon *relationships*.  

  2. **Unoccupied branches** (no known proponents):  
     - **Reversible-Demon Resolution** (Q6 → "No"):  
       - *Reason:* Incoherent. Allows a cycle with no net entropy increase, violating the second law outright.  
     - **Finite-Memory Resolution** (Q5 → "No"):  
       - *Reason:* Unattractive. Permits unlimited entropy violation if memory is ordered, contradicting empirical thermodynamics.  
     - **Landauer-Bennett** with **denied erasure-cost** (Q3 → "No" without extra steps):  
       - *Reason:* Unexplored. Assumes erasure costs but needs *additional* costs, implying Landauer’s principle is incomplete.  

  ---

  ### **Key Features**  
  - **Concrete cases:** Nodes reference the Szilard engine (measurement/erasure) and two-bath demon (correlation/decorrelation) to ground answers.  
  - **Fault lines:** Branches split on measurement cost, erasure necessity, memory incompressibility, and decorrelation cost.  
  - **Minority views:** Includes fluctuation-theory (root) and challenges to Landauer’s primacy (Q3).  
  - **Accessibility:** Questions avoid jargon (e.g., "must the demon reset its memory?" not "does Landauer apply?").  

  This tree isolates conceptual trade-offs, showing that all resolutions sacrifice *some* intuitive assumption about physics or information.
