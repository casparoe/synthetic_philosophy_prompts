prompt: |-
  I'm a third-year graduate student in cognitive science, writing a dissertation on whether the special sciences earn their keep by tracking patterns that are real in a sense the physical sciences cannot do without. My advisor is a committed Dennettian; at reading group last week a physicist friend remarked that a real pattern is just a useful fiction with better public relations, and I found I could not say precisely what an account of patternhood would have to deliver in order to answer him. So before I write another word, I want the specification on the table: the desiderata that any theory of what it is for a pattern to be real must satisfy. Work within the three stances — physical, design, intentional — as the framework, but do not assume any particular answer about how they relate to one another; I want that relation to be something the theory is required to settle, not a premise it may take for granted.

  For every requirement, give me the case or consideration that motivates it. I want, first, the cases the account must get right: the temperature and pressure of a gas; a person's beliefs as opposed to the firing of her neurons; a chess-playing program; the orbital regularities of the planets; a statistically robust but wholly accidental regularity; and a pattern that is unmistakable to one observer and invisible to another. Second, the distinctions it must not collapse: real versus merely useful; a pattern versus a mere aggregate or list; a pattern's identity versus its salience; being relative to a stance versus being dependent on a stance in a way that makes the pattern arbitrary; and a pattern that predicts well, one that explains, and one that merely co-occurs with what it seems to explain. Third, the results from outside philosophy that it must be consistent with: that any compression or description-length measure is relative to a chosen description language, so that no compression scheme is privileged; that multiple realization is the norm rather than the exception in the special sciences; and that the predictions generated from the intentional stance are, as a matter of fact, strikingly accurate. Then flag any pair of requirements you think cannot be jointly satisfied — I suspect there is at least one, and it is the part of the exercise I care about most — and tell me which single requirement, taken seriously, eliminates the greatest number of otherwise attractive accounts. If it is cheap to do so, add a few lines on how a compression-based account and a causal-explanatory account fare against the list; keep that part brief, since the criteria are what I am after and I do not need a reading list.
reasoning: |-
  We are to specify desiderata for a theory of real patterns. The account must satisfy several requirements, motivated by cases, distinctions, and external results. We will structure the answer accordingly.

  I. Cases the account must get right:

    1. Temperature and pressure of a gas:
       - Motivation: These are macro-level properties that emerge from micro-level physical properties (kinetic theory). They are real patterns because they are projectible and lawlike, and they are indispensable in thermodynamics. The account must recognize them as real.

    2. A person's beliefs vs. the firing of her neurons:
       - Motivation: Beliefs are intentional states that are multiply realizable at the neural level. The pattern of having a belief (e.g., believing it will rain) is real at the intentional level, but the exact neural pattern may vary. The account must allow for patterns at higher levels of abstraction that are not reducible to a single physical realization.

    3. A chess-playing program:
       - Motivation: The program operates at multiple stances: the physical (hardware), the design (software), and the intentional (as if it has goals and beliefs about the game). The pattern of playing chess is real and can be described in any of these stances, but the intentional stance description (as a rational agent) is particularly efficient for prediction.

    4. The orbital regularities of the planets:
       - Motivation: Kepler's laws are patterns that are real and projectible, having been deduced from observations and explained by Newtonian mechanics. They are not accidental and are robust.

    5. A statistically robust but wholly accidental regularity:
       - Motivation: Consider a sequence of coin flips that by chance comes up heads 100 times in a row. It is statistically robust (it happened) but accidental. The account must not count this as a real pattern because it is not projectible (it doesn't support predictions beyond itself) and is not grounded in any underlying law or mechanism.

    6. A pattern that is unmistakable to one observer and invisible to another:
       - Motivation: Consider a cryptographer who sees a pattern in an encrypted message that looks random to others. The pattern is real (it was intentionally created) but only salient to the one with the decryption key. The account must allow that the reality of the pattern is not dependent on every observer recognizing it, but it must also account for why it is detectable by some and not others.

  II. Distinctions the account must not collapse:

    1. Real vs. merely useful:
       - Motivation: A pattern might be useful for prediction without being real (e.g., Ptolemaic epicycles were useful for predicting planetary positions but not real). The account must distinguish between patterns that capture something about the world and those that are merely instrumental.

    2. A pattern vs. a mere aggregate or list:
       - Motivation: A random collection of objects (e.g., all red things in the room) is an aggregate but not a pattern because it lacks structure or projectibility. A pattern must have some internal organization that allows for generalization.

    3. A pattern's identity versus its salience:
       - Motivation: The same pattern might be more or less salient to different observers (e.g., the constellation Orion is a pattern of stars that is salient to humans but not to other species). The reality of the pattern (its existence) must be separated from whether it is noticed or useful to a particular agent.

    4. Being relative to a stance vs. being dependent on a stance in a way that makes the pattern arbitrary:
       - Motivation: Patterns might be relative to a stance (e.g., intentional patterns are only visible from the intentional stance) but that does not make them arbitrary. The account must avoid making patterns so stance-dependent that they become merely subjective.

    5. A pattern that predicts well, one that explains, and one that merely co-occurs with what it seems to explain:
       - Motivation: A pattern might predict well without explaining (e.g., a barometer reading predicts rain but does not explain it). A pattern that merely co-occurs (e.g., the rooster's crow and sunrise) does not explain the sunrise. The account must capture that real patterns are explanatory, not merely predictive or coincidental.

  III. External results the account must be consistent with:

    1. That any compression or description-length measure is relative to a chosen description language, so that no compression scheme is privileged:
       - Motivation: Information theory tells us that the compression of data depends on the language used to describe it. The account must not rely on an absolute notion of compression but must still be able to distinguish real patterns from noise in a non-arbitrary way.

    2. That multiple realization is the norm rather than the exception in the special sciences:
       - Motivation: In psychology, economics, etc., the same higher-level state (e.g., pain, inflation) can be realized by many different lower-level states. The account must allow for patterns that are multiply realizable and not tied to a specific physical substrate.

    3. That the predictions generated from the intentional stance are, as a matter of fact, strikingly accurate:
       - Motivation: Dennett has emphasized that we predict behavior by treating systems as rational agents, and it works. The account must explain why the intentional stance is so successful if it is tracking real patterns.

  IV. Flagging conflicts and the most demanding requirement:

    - Potential conflict: 
        Requirement 1 (from cases): The accidental regularity (e.g., 100 heads in a row) must not count as a real pattern.
        Requirement 2 (from external results): Compression is relative to a description language. 
        Why conflict? In a language that assigns a short code to "100 heads in a row", that sequence is highly compressible and thus might be considered a pattern. But we don't want to count it as real because it is accidental and non-projectible.

    - Another potential conflict:
        Requirement 3 (from distinctions): Real vs. merely useful. We must not count Ptolemaic epicycles as real, but they were useful. However, they are not real in the same way as Kepler's orbits. But note: Dennett might argue that even epicycles are real patterns at a certain level of description? We need to avoid that if we want to maintain the distinction.

    - The most demanding requirement: 
        The requirement that the account must not collapse the distinction between a pattern that predicts well and one that explains (from distinctions, point 5) is particularly challenging. Many accounts (e.g., purely predictive or instrumentalist) fail here. This requirement eliminates many accounts that focus solely on predictive success without requiring an explanatory connection.

  V. How two accounts fare (briefly):

    - Compression-based account (e.g., Dennett, inspired by information theory):
        Strengths: Handles multiple realization (by compressing over lower-level details), can account for the relativity of patterns (via description languages), and explains why some patterns are salient (they allow for compression). It can handle the intentional stance's predictive success (it compresses behavioral data).
        Weaknesses: Struggles with the accidental regularity (which may be compressible) and with the real vs. merely useful distinction (Ptolemaic epicycles might be compressible in a given language). Also, it might collapse the pattern's identity with its salience (if salience is just about compressibility for a given observer). The relativity of compression languages might lead to arbitrariness.

    - Causal-explanatory account (e.g., in the tradition of causal realism):
        Strengths: Clearly distinguishes real patterns (that play a causal role) from accidental regularities and mere predictive tools. It can handle the requirement for explanation (causal patterns explain). It avoids the problem of accidental regularities because they lack a causal basis.
        Weaknesses: May struggle with multiple realization (if the causal account is tied to specific physical mechanisms) and with the relativity of patterns to stances (especially intentional patterns, which are abstract). It may also have difficulty with the external result about compression relativity.

  VI. The single requirement that eliminates the most accounts:

    The requirement that the theory must account for the distinction between a pattern that predicts well and one that explains (distinction 5) is the one that eliminates the most otherwise attractive accounts. Many accounts (instrumentalist, predictive, and even some compression-based) focus on predictive success and cannot capture the explanatory dimension. This requirement forces a move towards a richer notion of pattern that involves causal or nomological grounding.

  Given the above, let's summarize the desiderata in a structured way.

  Desiderata for a Theory of Real Patterns:

  I. Cases to Capture:
     C1. Temperature and pressure: must be real patterns.
     C2. Beliefs vs. neural firings: beliefs are real patterns and multiply realizable.
     C3. Chess program: real patterns at multiple stances, especially intentional.
     C4. Orbital regularities: real and projectible.
     C5. Accidental regularity: not a real pattern.
     C6. Observer-relative salience: pattern is real even if not salient to all.

  II. Distinctions to Uphold:
     D1. Real vs. merely useful (e.g., Ptolemaic epicycles are useful but not real in the same way as Kepler's orbits).
     D2. Pattern vs. mere aggregate (e.g., a random collection of red things is not a pattern).
     D3. Pattern's identity vs. its salience (e.g., Orion is the same pattern whether we notice it or not).
     D4. Relative to a stance vs. arbitrary (e.g., intentional patterns are stance-relative but not arbitrary).
     D5. Must distinguish between patterns that predict, patterns that explain, and patterns that co-occur (e.g., barometer predicts rain but does not cause it; rooster's crow co-occurs with sunrise but doesn't explain it).

  III. External Constraints:
     E1. Compression is relative to a language (so no absolute compression).
     E2. Multiple realization is common in special sciences.
     E3. Intentional stance predictions are strikingly accurate.

  IV. Conflicts:
     - C5 (accidental regularity not real) and E1 (compression relative) may conflict because an accidental regularity might be compressible in some language.
     - D1 (real vs. useful) and the success of the intentional stance (E3) might be in tension if we want to say that intentional patterns are real and not just useful.

  V. The Most Eliminative Requirement:
     D5 (distinguishing predictive, explanatory, and co-occurring patterns) is the most demanding because it requires an account to incorporate an explanatory dimension, which many purely predictive or instrumental accounts lack.

  This set of desiderata is challenging. The theory must be robust enough to handle multiple realization and stance relativity without collapsing into instrumentalism or arbitrariness, and it must incorporate an explanatory component that goes beyond mere compression or prediction.
answer: |-
  ### Desiderata for a Theory of Real Patterns  
  Your goal is to define "real pattern" such that the special sciences track objective, stance-relative phenomena without collapsing into instrumentalism. Below, I specify the requirements, organized by **cases**, **distinctions**, and **external constraints**, with motivations and conflicts flagged.  

  #### I. Cases the Account Must Get Right  
  1. **Temperature/pressure of a gas**  
     - *Requirement*: The theory must recognize emergent macro-properties as real patterns, even when reducible to micro-physical states (e.g., kinetic theory).  
     - *Motivation*: Temperature is projectible, lawlike, and indispensable in thermodynamics, yet it vanishes at the micro-level. Failure here implies eliminativism about emergent properties.  

  2. **Beliefs vs. neural firings**  
     - *Requirement*: The theory must distinguish intentional patterns (e.g., "believes it will rain") from their physical substrates, without reducing the former to the latter.  
     - *Motivation*: Beliefs are multiply realizable, predictively robust, and causally relevant (e.g., in explaining behavior), but no single neural configuration is necessary.  

  3. **Chess-playing program**  
     - *Requirement*: The theory must validate patterns at the design stance (e.g., algorithms) and intentional stance (e.g., "tries to control the center") as real, even if the physical stance only reveals silicon states.  
     - *Motivation*: The program’s behavior is best predicted/explained via higher-level stances, but its physical implementation is arbitrary.  

  4. **Orbital regularities of planets**  
     - *Requirement*: The theory must identify law-governed, counterfactual-supporting regularities (e.g., Kepler’s laws) as real patterns.  
     - *Motivation*: These are objective, stable, and non-accidental, contrasting with coincidences.  

  5. **Statistically robust accidental regularity**  
     - *Requirement*: The theory must *exclude* patterns that are projectible by luck (e.g., 1,000 heads in a coin-flip sequence frozen in time).  
     - *Motivation*: Accidental regularities lack grounding in causal/nomological structure; treating them as real licenses false inferences.  

  6. **Observer-relative pattern**  
     - *Requirement*: The theory must allow a pattern to be real but detectable only from specific stances (e.g., a cryptographer seeing a message in noise).  
     - *Motivation*: Reality must not depend on universal recognizability; otherwise, patterns are merely subjective.  

  #### II. Distinctions the Account Must Not Collapse  
  1. **Real vs. merely useful**  
     - *Requirement*: Distinguish patterns that reflect mind-independent structure (e.g., temperature) from pragmatically useful fictions (e.g., Ptolemaic epicycles).  
     - *Motivation*: Epicycles predict planetary motion but misrepresent causal structure; the special sciences require ontological traction.  

  2. **Pattern vs. mere aggregate/list**  
     - *Requirement*: Exclude arbitrary collections (e.g., "all red objects in a room") from being patterns.  
     - *Motivation*: Aggregates lack internal structure, projectibility, or compressibility; patterns must support inferences.  

  3. **Pattern identity vs. salience**  
     - *Requirement*: Separate what a pattern *is* (e.g., the gravitational orbit of Earth) from whether it is *noticed* (e.g., by a novice astronomer).  
     - *Motivation*: Salience depends on observers; identity must be stance-independent to avoid subjectivism.  

  4. **Stance-relativity vs. arbitrariness**  
     - *Requirement*: Ensure that stance-relativity (e.g., intentional patterns require the intentional stance) does not imply that patterns are arbitrary human constructs.  
     - *Motivation*: Intentional patterns are stance-relative but track objective behavioral regularities; collapse invites anti-realism.  

  5. **Predicts vs. explains vs. co-occurs**  
     - *Requirement*: Distinguish:  
       - Patterns that predict (e.g., barometer falling → storm).  
       - Patterns that explain (e.g., low-pressure system → storm).  
       - Patterns that co-occur without explanatory power (e.g., rooster crowing → sunrise).  
     - *Motivation*: Explanation requires capturing causal/nomological dependencies; prediction or correlation alone is insufficient for "reality."  

  #### III. External Constraints the Account Must Satisfy  
  1. **Compression relativity**  
     - *Requirement*: Accommodate that compression (e.g., Kolmogorov complexity) is description-language-relative.  
     - *Motivation*: Information theory shows no universal compression metric exists; the theory cannot privilege one language.  

  2. **Multiple realization prevalence**  
     - *Requirement*: Explain why patterns in special sciences (e.g., "pain" or "money") are robustly multiply realizable.  
     - *Motivation*: If patterns required physical identity, special sciences would collapse into physics.  

  3. **Intentional stance success**  
     - *Requirement*: Justify why intentional stance predictions (e.g., "X will seek food if hungry") are empirically successful.  
     - *Motivation*: Dennett’s "rational agents" model works too well to be arbitrary; the theory must ground this success.  

  ---

  ### Conflicts and Eliminative Power  
  - **Key Conflict**: **C5 (exclude accidental regularities)** vs. **E1 (compression relativity)**.  
    - *Why*: An accidental regularity (e.g., a frozen random sequence) may be highly compressible in a language tailored to it (e.g., "the 1,000-heads sequence"), satisfying compression-based accounts of reality. But C5 demands exclusion, as it lacks lawlike grounding. Resolving this requires tying patternhood to *causal stability* or *counterfactual resilience*, not just compressibility.  

  - **Most Eliminative Requirement**: **D5 (distinguish predicts/explains/co-occurs)**.  
    - *Why*: It eliminates:  
      - Purely *predictive* accounts (e.g., "patterns are whatever aids prediction"), which cannot exclude co-occurrences (rooster/dawn).  
      - *Instrumentalist* accounts (e.g., "patterns are useful fictions"), which collapse real/useful (D1).  
      - *Compression-based* accounts, which struggle with explanatory depth (e.g., a compressed description of epicycles predicts but doesn’t explain orbits).  
    - Taking D5 seriously forces the theory to incorporate causal/explanatory criteria, excluding popular minimalist views.  

  ---

  ### How Two Accounts Fare (Briefly)  
  - **Compression-Based Account** (e.g., Dennett):  
    - *Strengths*: Handles multiple realization (E2), stance-relativity (C6), and intentional success (E3) via descriptive efficiency.  
    - *Weaknesses*: Fails D5 (cannot distinguish prediction from explanation), risks collapsing real/useful (D1), and struggles with accidental regularities (C5) due to language relativity (E1).  

  - **Causal-Explanatory Account** (e.g., Woodward-style interventionism):  
    - *Strengths*: Satisfies D5 (explanation requires invariant causal relations), excludes accidental regularities (C5), and upholds real vs. useful (D1).  
    - *Weaknesses*: Struggles with multiple realization (E2, if causation requires physical specifics) and compression relativity (E1, as causation may not map to compressibility).  

  ---

  **Final Note**: The core tension is between **objectivity** (avoiding arbitrariness) and **relativity** (to stances/description languages). A successful theory must anchor patterns in stance-independent reality (e.g., causal structures) while respecting that their *accessibility* is stance-relative. The hardest work is reconciling E1 (no privileged description) with C4–C5 (non-accidental, objective patterns).
