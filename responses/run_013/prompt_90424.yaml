prompt: |-
  There is a pattern I keep running into in discussions of how to weigh one person's good against another's, and I would like to know whether it has an established name.

  Everyone in these discussions grants that there is no fact of the matter about how much better or worse off one person is than another: the numbers one attaches to people are arbitrary up to any monotone transformation, and no point on the scale is privileged as the zero. The discussion then proceeds anyway, as it must, because some decision about who gets the scarce thing has to be made. What I keep noticing is that the comparison which actually settles the decision is never the one everyone agreed was meaningless. It is a disguised version of it, and nobody admits to making it.

  Concretely: suppose we agree only that A is worse off than B, and that the distance between A and B is greater than the distance between C and D. Someone then argues that a policy which helps A and hurts C is an improvement, because the gain to A outweighs the loss to C. But outweighing is a comparison of magnitudes, which we just agreed we cannot make; to cash it out we would need a cardinal scale and a zero. Pressed on this, the arguer does not defend the scale. They switch to whichever scale delivers the verdict, and then present the verdict as following from the agreed facts. I have seen the same move in cost-benefit analysis, where a life-year is priced in money and a health state judged worse than the relevant zero can invert a ranking, and in arguments about inequality, where how much worse off the bottom is gets measured in proportional terms in one paragraph and in absolute terms in the next, and the choice flips the conclusion.

  Note what is odd here. The parties agree on every comparison they are willing to state, and they still disagree about the verdict, so their disagreement is real but cannot be located in the vocabulary they share; the missing term is a scale, and each side silently supplies its own.

  Does this have a name? I know the measurement-theoretic point about ordinal utility, the index-number problem for comparing real incomes, and the absolute-versus-relative deprivation distinction, and none of these seems to be quite it. What I am after is the phenomenon of the arbitrary scale doing the deciding while the parties continue to deny that any scale is doing work. If there is an established concept, say what it is and where it stops fitting. If there is not, coin one and mark its edges — in particular, how it differs from ordinary vagueness, from the index-number problem, and from the straightforward position that a cardinal interpersonal scale can be constructed. A bare label will not help me; I want the thing itself carved up.
reasoning: |-
  Okay, the user is describing a recurring pattern in ethical discussions where people agree that interpersonal comparisons of welfare are ordinal—only rankings matter, not magnitudes—but then end up relying implicitly on cardinal scales to make decisions. They want to know if this phenomenon has a name and how it differs from related concepts. 

  First, I need to unpack the core issue. The user observes that despite professing that welfare comparisons are only ordinal, decision-makers sneak in cardinal assumptions (like a zero point or unit intervals) to justify choices. This creates a contradiction: the explicit agreement denies measurable welfare differences, but the practical reasoning requires it. 

  The examples given are telling. In cost-benefit analysis, monetizing life-years assumes a fixed exchange rate between money and welfare. In inequality debates, switching between absolute and proportional deprivation metrics changes conclusions. Both cases reveal hidden cardinal commitments. 

  Now, why isn't this covered by existing concepts? The index-number problem focuses on choice of *which* cardinal scale to use when cardinality is accepted, but here the issue is *denying cardinality while using it*. Vagueness involves borderline cases, whereas this is about structural incompleteness of ordinal data. The "interpersonal utility comparison" debate often assumes cardinality is possible, but the user's concern is the *denial* of it in theory while relying on it in practice. 

  The closest fit is "implicit cardinalization"—the unacknowledged introduction of cardinal assumptions to break ordinal indecision. But this isn't a formal term. Alternatively, framing it as a "cardinal commitment leak" captures how suppressed assumptions surface in decisions. 

  Key distinctions:  
  - Unlike vagueness, this isn't about fuzzy boundaries but about missing mathematical structure (cardinality) for comparisons.  
  - Unlike the index-number problem, the conflict arises from *rejecting* cardinal scales upfront.  
  - It's more specific than general pluralism because the tension is between stated ordinalism and operational cardinalism.  

  The user seems philosophically sophisticated—they reference measurement theory and want precise conceptual surgery. Their frustration suggests they've seen this undermine debates repeatedly. Naming the pattern might help expose the sleight-of-hand.  

  Proposed response structure:  
  1. Diagnose the core move: ordinal agreement + cardinal execution.  
  2. Contrast with near-miss concepts.  
  3. Offer "implicit cardinalization" as a descriptive label.  
  4. Flag how this differs from honest cardinalists who own their assumptions.
answer: |-
  Your observation is incisive and captures a fundamental tension in normative decision-making under ordinal welfare constraints. This phenomenon doesn't have a single universally accepted name, but its components are recognized in philosophy, economics, and decision theory. I'll dissect it conceptually, propose a precise label, and demarcate its boundaries.

  ### Core Phenomenon: **Implicit Cardinalization in Ordinal Constraints**
  **Definition:** The act of resolving indeterminacy in ordinal welfare frameworks by smuggling in unacknowledged cardinal assumptions (a zero point, unit intervals, or ratio scales) while maintaining rhetorical commitment to ordinalism.

  ### Why Existing Concepts Don't Fully Capture It
  1.  **Ordinal Utility Theory**: Acknowledges incomparability of magnitudes but doesn't address how decisions *must* violate this in practice. Your focus is on the *disguised violation*.
  2.  **Index-Number Problem**: Concerns choosing between valid cardinal scales (e.g., Laspeyres vs. Paasche indices). Here, parties *deny any valid cardinal scale exists*, yet use one covertly.
  3.  **Absolute vs. Relative Deprivation**: Represents a *choice* between scales. Your case involves *denying the need for such a choice* while making it implicitly.
  4.  **Vagueness**: Involves borderline cases (e.g., "when does 'tall' apply?"). This is a *structural incompleteness*: ordinal data lacks the mathematical structure needed for additive comparisons, forcing illicit cardinalization.

  ### Proposed Label: **Cardinal Commitment Leak (CCL)**
  **Why this fits:**
  -   **"Cardinal"**: The core illicit element is cardinal structure (zero point, unit intervals).
  -   **"Commitment"**: Parties are theoretically committed to ordinalism but practically committed to cardinalism.
  -   **"Leak"**: The cardinal assumptions seep into reasoning despite attempts to contain them, driven by the necessity of decision.

  ### Mechanism of CCL
  1.  **Ordinal Agreement**: Parties agree only on rankings (A < B, |A-B| > |C-D|).
  2.  **Decision Forcing Function**: A concrete choice requires weighing gains/losses (ΔA vs. ΔC).
  3.  **Ordinal Indeterminacy**: Pure ordinal data cannot resolve this (e.g., is gain ΔA *larger* than loss |ΔC|?).
  4.  **Covert Cardinalization**: An agent adopts a cardinal scale *ψ* satisfying the ordinal constraints but adding:
      -   A **zero point** (e.g., "neutral welfare" for cost-benefit).
      -   **Unit consistency** (e.g., treating |A-B| as twice |C-D| implies ratio scales).
  5.  **Scale-Driven Verdict**: *ψ* determines the outcome (ΔA > |ΔC|).
  6.  **Rhetorical Obfuscation**: The agent presents the conclusion as following from *ordinal agreements alone*, masking reliance on *ψ*.

  ### Examples Revisited via CCL
  -   **Cost-Benefit Analysis**: Agreeing life-years have ordinal value, then *monetizing* them. The leak is the **assumed monetary-zero of a life-year** (e.g., $50,000/year). A different zero (e.g., $0 = death) flips decisions.
  -   **Inequality Debate**: Switching between proportional ("B has 50% less than A") and absolute ("B has $10k less than A"). The leak is the **choice of welfare function**: proportional assumes ratio scales (zero at $0), absolute assumes interval scales (arbitrary zero). The unacknowledged switch is the cardinal commitment.
  -   **Your Policy Example**: Claiming "gain to A outweighs loss to C" based on |A-B| > |C-D|. This *requires* assuming:
      -   The **units** of |A-B| and |C-D| are comparable (e.g., |A-B| = 2 utils, |C-D| = 1 util).
      -   The **zero point** allows ΔA and ΔC to be compared to these intervals (e.g., ΔA = 1 util gain > |ΔC| = 0.5 util loss).

  ### Demarcating CCL
  | Feature              | Cardinal Commitment Leak (CCL)                 | Related Concept                  | Key Difference                                  |
  | :------------------- | :--------------------------------------------- | :------------------------------- | :---------------------------------------------- |
  | **Scale Legitimacy** | Denied explicitly, used covertly               | Index-Number Problem             | IP assumes scales *are* valid; CCL denies them. |
  | **Decision Driver**  | Illicit cardinal structure (zero, units)       | Vagueness                        | Vagueness lacks sharp boundaries; CCL lacks structural completeness. |
  | **Theoretical Stance**| Ordinalism professed, cardinalism practiced    | Pluralism / Multi-Criteria       | Pluralism acknowledges trade-offs; CCL masks them. |
  | **Resolution**       | Requires exposing implicit scale choices       | Requires cardinal justification  | Honest cardinalists *defend* scales; CCL avoids this. |

  ### Why CCL Matters
  -   **Procedural Dishonesty**: It disguises value judgments (choice of *ψ*) as technical necessities or logical deductions.
  -   **Power Masking**: The selector of the covert scale (e.g., the analyst pricing life-years) dictates outcomes while appearing neutral.
  -   **Impedes Deliberation**: By not surfacing the scale dependency, it prevents democratic scrutiny of the cardinal assumptions.

  ### Countering CCL
  The antidote is **explicit sensitivity analysis**: Map how conclusions change under *all possible cardinal scales* consistent with ordinal agreements. If the verdict flips (e.g., helping A > hurting C in some scales, < in others), the ordinal data is insufficient, exposing the need for ethical deliberation on cardinal structure.

  In essence, you've identified the **cardinal underbelly of ordinalist pretensions** – a critical flaw in decision-making that persists because naming it would force uncomfortable justifications. "Cardinal Commitment Leak" captures its mechanics and deceit.
