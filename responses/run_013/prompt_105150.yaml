answer: |-
  The criminal law's treatment of voluntary acts and neuroscientific evidence reveals an implicit commitment to a **practical-agency theory of responsibility**, grounded in attributability rather than metaphysical free will. This theory distinguishes between *normal functioning agency* and *pathological disruption*, while remaining neutral on ultimate causation. Here's the reconstruction, separating settled doctrine from contested theory:

  ### I. The Implicit Theory in Practice
  1.  **Voluntary Act Requirement:** Settled doctrine requires an act attributable to the agent's *practical agency*. This means:
      *   **Not Mere Bodily Movement:** The movement must be integrated into the agent's practical reasoning system (even if unconsciously initiated). Reflexes, seizures, and automatisms are excluded because they bypass this system entirely – they are "alien" to the agent.
      *   **Thin Attributability, Not Conscious Initiation:** The practice *does not require* that the act be consciously initiated (settled doctrine). It requires that the movement be *governable by* or *expressive of* the agent's practical rationality, goals, or character dispositions *at the time*. This is a "thinner" sense of agency than conscious volitional control at initiation.
      *   **Ruled-Out Views:** This quietly rejects:
          *   **Pure Character Theory:** Acquittal for automatism occurs *without* examining the defendant's character. It's the *occurrent* link between the movement and agency that matters, not general character traits.
          *   **Statistical Normality Theory:** Abnormal brain states matter precisely because they disrupt *functional* agency, not just because they are statistically rare. A statistically common but functionally disruptive condition (e.g., a widespread neurotoxic event) would still negate voluntariness.
          *   **Hard Incompatibilism:** The universal truth of neural causation is irrelevant to the *operational* question of whether *this specific movement* was integrated into the agent's practical reasoning.

  2.  **Selective Neuroscientific Reception (Mitigation/Culpability):** The practice admits localized neuroscientific evidence because it identifies a *pathological disruption* within the agent's practical reasoning system:
      *   **Pathology vs. Universal Causation:** A frontal lobe tumor is treated differently from universal neural causation because it represents a *localized dysfunction* impairing specific capacities (e.g., impulse control, empathy, planning) essential for *normal practical agency*. It makes the resulting action less fully attributable to the *agent as a practical reasoner*. Universal causation is the background condition of *all* action and doesn't impair the functional capacity for practical agency itself.
      *   **Capacity, Not Causation:** The focus is on whether the abnormality *impairs the functional capacity* for normative competence (understanding legal/moral norms) or situational control (conforming conduct to reasons). This is why it impacts culpability/mitigation, not necessarily the act requirement itself (unless it causes automatism).
      *   **Ruled-Out Views:** This practice rejects:
          *   **Eliminativism about Responsibility:** Admitting neuro-mitigation presupposes responsibility exists *in the absence* of pathology. The evidence adjusts the degree of blameworthiness attributable to the agent, it doesn't deny agency wholesale.
          *   **Metaphysical Libertarianism:** The law doesn't require an uncaused "causa sui" moment. Impaired *functional capacity* is sufficient for mitigation/exculpation, not proof of broken causal chains violating determinism.

  3.  **Consistency between Automatism and Neuro-Mitigation:** Both limbs cohere under the practical-agency view:
      *   **Automatism:** Represents a *complete failure* of attributability – the movement is entirely outside the agent's practical reasoning system.
      *   **Localized Neuro-Abnormality:** Represents a *partial impairment* of the practical reasoning system, making the resulting action *less fully* attributable to the agent's normative competence or control capacities. It reduces the quality of the agency expressed.
      *   **Shared Foundation:** Both turn on *functional integration* within the agent's capacity for practical reasoning and control. Automatism is its total absence; neuro-abnormality is its impairment.

  ### II. Underdetermination: Where the Practice is Flexible
  The settled doctrine *underdetermines* the precise philosophical theory of action/responsibility. The practice is compatible with:
  *   **Compatibilism (Multiple Varieties):** The practice fits most naturally with compatibilist accounts focusing on reasons-responsiveness, guidance control, or hierarchical integration. However, it doesn't *require* endorsing compatibilism *as a metaphysics*; it only requires the functional distinctions described.
  *   **Certain Libertarianisms (Agency-Causation Lite):** While rejecting metaphysical libertarian demands for conscious initiation or uncaused causes, the practice *could* be consistent with a libertarian view that emphasizes the importance of *unimpeded* rational capacities for full responsibility, *if* that libertarian accepts the functional distinctions. However, it doesn't require or imply libertarianism.
  *   **Non-Reductive Physicalism:** The practice assumes mental states/capacities supervene on the physical brain but have causal efficacy. It rejects *reductive* physicalism that eliminates agential concepts.
  *   **Moderate Revisionism:** The practice is consistent with views that see responsibility as a social practice grounded in fair opportunity and attributability, without requiring ultimate metaphysical freedom.

  ### III. What Would Change Under Alternative Theories
  1.  **Strict Conscious-Initiation Requirement:**
      *   **Doctrinal Impact:** Dramatic expansion of the voluntary act defense. Many actions initiated by unconscious processes (habits, "automatic" driving, many routine decisions confirmed by Libet-type findings) would potentially fail the voluntary act requirement. Automatism definitions would broaden significantly. Mens rea might become harder to prove if conscious awareness of initiation were required for intent/choice.
      *   **Neuroscience Impact:** Libet-type evidence *would* become directly exculpatory, undermining vast swathes of criminal responsibility. Localized lesions would be just one type of evidence among many showing lack of conscious initiation.
      *   **Conflict with Current Practice:** This would fundamentally contradict the settled doctrine that unconscious habits, impulses governed by reason, etc., *are* voluntary acts.

  2.  **Thoroughgoing Eliminativism about Conscious Will:**
      *   **Doctrinal Impact:** The voluntary act requirement would collapse as a meaningful concept. Responsibility would need a radically new foundation, likely shifting towards:
          *   **Character Theory:** Punishing dangerous traits/characters, regardless of specific acts (highly problematic for legality and fairness).
          *   **Consequentialism:** Punishment based solely on deterrence, incapacitation, rehabilitation needs – severing the link to desert based on agency.
          *   **Statistical Abnormality:** Punishing only statistically deviant behavior (raising serious normative and discriminatory concerns).
      *   **Neuroscience Impact:** *All* neuroscientific evidence of causation would become potentially exculpatory, but simultaneously, culpability based on agency would vanish. Sentencing might focus entirely on future risk prediction via neuro-markers.
      *   **Conflict with Current Practice:** This would obliterate the core structure of criminal law (Actus Reus + Mens Rea), rendering current distinctions between automatism, insanity, mitigation, and full responsibility meaningless.

  ### IV. Settled vs. Contested
  *   **Settled Doctrine (Law):**
      *   Involuntary movements (reflex, spasm, seizure, sleepwalking, automatism) negate the actus reus.
      *   Localized brain abnormalities *can* be relevant to culpability (mens rea, insanity, mitigation), especially if impairing normative competence or control.
      *   Universal neural causation/determinism is *not* a defense.
      *   Conscious initiation is *not* required for a voluntary act.
  *   **Contested Among Theorists:**
      *   **Philosophers of Action:** The precise nature of agency, intention, and control (e.g., hierarchical vs. reasons-responsive compatibilism; viability of libertarianism; the significance of consciousness in action). Whether the law's "practical agency" maps cleanly onto any single philosophical account.
      *   **Criminal Law Theorists:** Whether the law's implicit theory is coherent or merely pragmatic; whether character deserves a larger role; the justification for the pathology/normality distinction; the proper scope of the insanity defense.
      *   **Neuroscientists:** The extent to which localized brain function truly explains complex behaviors/culpability; the validity of inferring specific mental states/functions from scans; the interpretation of Libet-style experiments for free will debates (though consensus exists that these don't eliminate responsibility *as the law conceives it*).

  **In essence:** Criminal practice presupposes a functional, capacity-based theory of agency focused on *attributability for practical reasoning and control*. It distinguishes between movements alien to the agent (automatism) and actions arising from impaired but still present agency (neuro-mitigation). It rules out theories denying the reality of agency (eliminativism) or requiring specific metaphysical conditions (strict conscious initiation), while remaining agnostic or flexible on the precise compatibilist or non-reductive physicalist account that best describes the capacities it recognizes. Its coherence lies in its focus on *pathological disruption of normal functional capacities*, not in resolving the metaphysics of free will.
