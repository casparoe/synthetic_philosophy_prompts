answer: |-
  Here is a faithful translation of Hume's arguments against suicide prohibition (from "On Suicide") into law-and-economics (L&E) vocabulary, followed by a residue report addressing your specific queries:

  **Hume's Three Branches Translated:**

  1.  **Alleged Duty to God:**
      *   **Entitlement:** God's claimed sovereign property right over human life.
      *   **Holder:** God (as supreme sovereign).
      *   **Protecting Rule:** *Inalienability Rule* (life cannot be surrendered/transferred). Backed by an implied *Property Rule* (God's consent required for transfer/destruction).
      *   **Violation:** Unilateral destruction of God's property (life) without consent/authorization (suicide).
      *   **Externalities/Agency:** None directly applicable. God is the sole "owner"; the argument hinges entirely on the superior's (God's) absolute claim.
      *   **Binding Duty:** Depends on the validity of the initial entitlement claim and the inalienability rule. Binding only if God *does* hold this specific property right and has imposed this specific rule.
      *   **Hume's L&E Argument:** Hume challenges the *premise* of this entitlement structure. He argues that if God governs via immutable natural laws, suicide is merely an *application* of those laws (human agency causing death via natural means), not a violation. Forbidding suicide under this framework would imply God's laws are insufficient or flawed, requiring human non-interference to "correct" them – an incoherent limitation on divine sovereignty. The inalienability rule is invalid because God's "property" (life) operates entirely *within* and *by* the causal system God established.

  2.  **Alleged Duty to Society:**
      *   **Entitlement:** Society's claim on the productive capacity/labor/services of its members (reciprocal benefit of the social contract).
      *   **Holder:** Society (as a collective).
      *   **Protecting Rule:** Primarily *Liability Rule* (compensation required for deprivation of services, but compensation impossible for death). Implied *Property Rule* for gross violations (e.g., treason).
      *   **Violation:** Depriving society of expected future benefits of membership (your labor, contributions, relationships) without compensation by removing oneself (suicide).
      *   **Externalities/Agency:** Significant *Negative Externalities*: Loss of productive member, potential care burdens shifted, emotional distress, social cohesion disruption. *Agency Problem*: Individual may undervalue their social contribution or overvalue burden, leading to inefficient exit.
      *   **Binding Duty:** Binding if the individual is a net contributor whose death imposes uncompensated net costs (negative externalities) on society, violating the implicit social contract.
      *   **Hume's L&E Argument:** Hume argues this duty is *contingent*, not absolute. It binds only if:
          *   The individual is "useful" (positive net contributor).
          *   Their death creates a "real harm" (significant, uncompensated negative externality).
          If one is a net *burden* ("positively pernicious"), their exit via suicide *reduces* societal costs (a *positive externality*), making the duty inapplicable or even reversed. For those neutral or marginally useful, the social costs are minor and offset by the individual's liberty interest. The "liability rule" fails because compensation is impossible, making the "property rule" (total prohibition) inefficiently broad.

  3.  **Alleged Duty to Self:**
      *   **Entitlement:** The individual's own entitlement to their future well-being/utility.
      *   **Holder:** The individual (across time - present vs. future self).
      *   **Protecting Rule:** *Paternalistic Inalienability Rule* (forbidding actions with perceived irreversible negative utility for oneself, even with current consent). Could be framed as an internal *Property Rule* (future self's claim).
      *   **Violation:** Acting in a way that inflicts irreversible harm on oneself (suicide as harming one's future self).
      *   **Externalities/Agency:** *Severe Intra-Personal Agency Problem*: Present self (in distress, impaired judgment) makes an irreversible decision harming/eliminating future self, who cannot consent or retaliate. *Cognitive Bias Externality*: Present suffering may distort valuation of future utility.
      *   **Binding Duty:** Binding if the action (suicide) is based on a persistent, uncorrectable failure of the present self to act as a rational agent for the future self's interests due to impairment or bias.
      *   **Hume's L&E Argument:** Hume fundamentally rejects this as a *category mistake*. Duties require distinct parties. The "self" is not plural: "I am the same person today who yesterday resolved to forbear, and who today performs that resolution." Suicide doesn't "harm" a distinct entity; it ends the existence of the agent to whom any "duty" could be owed. If life is misery, continuing it is the harm, not ending it. Framing it as paternalism or an agency problem *presupposes* the existence of a future self with claims, which Hume denies is relevant when suicide rationally ends unbearable suffering. The duty is incoherent.

  **Residue Report:**

  1.  **Duty to God:**
      *   **Clean Translation:** The translation of God's claim as a sovereign property right protected by an inalienability rule is remarkably clean within the L&E framework. Hume's counterargument translates effectively as a challenge to the validity/premise of that specific entitlement structure under divine governance.
      *   **Distortion:** L&E struggles to capture Hume's deeper *metaphysical* point about causation and divine *permission*. L&E treats God's laws as "rules," but Hume argues suicide *is* an event *within* God's causal system, not an external violation. The L&E framing makes it feel more like a contractual violation than an inherent metaphysical impossibility under divine governance. The "necessity" argument (suicide as using divinely ordained causes) loses nuance.
      *   **Cannot Express:** The profound theological implication that prohibiting suicide implies *limiting God's power* by claiming certain applications of His own laws violate His will. L&E can frame the *logic* but not the theological *weight* Hume intends.

  2.  **Duty to Society:**
      *   **Clean Translation:** This branch translates exceptionally well. The entitlement (society's claim on services), the rule (liability/property hybrid), the violation (uncompensated negative externality), and the agency problem (undervaluing contribution) map directly. Hume's rebuttal is a *classic externality argument*: he argues the prohibition is inefficient because it fails a cost-benefit test (net burden vs. net contributor) and creates unnecessary deadweight loss (forcing suffering on individuals when social cost is low/negative). **Your suspicion is confirmed: Hume explicitly defeats the externality argument for prohibition by showing its contingency.**
      *   **Distortion:** Minor. Hume emphasizes individual liberty more strongly than a pure efficiency analysis might. The L&E framing focuses on net social cost, while Hume also sees liberty as a good in itself, even when social cost is neutral.
      *   **Cannot Express:** The deep sentiment of social connection/belonging Hume acknowledges but dismisses as insufficient grounds for absolute prohibition. L&E captures the cost, not the emotional bond.

  3.  **Duty to Self:**
      *   **Clean Translation? (Partial):** The L&E framing of paternalism and intra-personal agency problems *describes the common argument Hume is refuting*. It accurately portrays the justification often given for prohibition based on this duty.
      *   **Significant Distortion:** Translating Hume's *rebuttal* into L&E is highly distorting. Hume doesn't just argue the agency problem isn't severe enough; he argues the *entire category* is incoherent. L&E requires positing distinct temporal interests ("present self," "future self") to make sense of the duty/paternalism. Hume denies this metaphysical separation is meaningful for grounding a *duty*. For Hume, the "duty to self" dissolves upon inspection because there's only *one self*. **Your instincts are correct: Hume sees it as a category mistake, not merely flawed paternalism.** L&E struggles to represent this dissolution; it inevitably recreates the temporal agency split Hume rejects.
      *   **Cannot Express:** The core of Hume's rebuttal – the logical incoherence of a duty owed *by* an agent *to* that same agent considered as a distinct entity over time. L&E's reliance on principal-agent models inherently assumes this distinction, making it blind to Hume's deeper philosophical point about the unity of the self and the nature of duties.

  **Overall Residue Assessment:**

  *   **Source of Residue:** Primarily **differences in metaphysical and conceptual foundations**.
      *   L&E readily handles the structural logic of entitlements, rules, externalities, and agency problems in the God/Society branches.
      *   The residue arises where Hume's arguments hinge on:
          *   Specific theological metaphysics (God's causal system vs. property rule violation).
          *   A particular view of personal identity over time (rejecting the temporal split required for "duty to self").
          *   The logical structure of duties (requiring distinct parties).
  *   **Is it a Defect of L&E?** Partly. L&E struggles with:
      *   Metaphysical arguments about causation and divine action.
      *   Deep conceptual analyses of selfhood and identity that challenge its implicit temporal agency model.
      *   Expressing the *incoherence* of a concept (duty to self) rather than its inefficiency or impracticality.
  *   **Is it Something L&E Cannot See?** L&E can *describe* the common arguments based on duty to self (as paternalism/agency), but it struggles to *validate* Hume's core refutation (the category mistake) because this refutation attacks the very conceptual framework (temporal agency) L&E uses to model the problem.
  *   **Is Hume Less Clear?** No. The residue stems from Hume's arguments operating at a different level – challenging the *conceptual coherence* and *metaphysical foundations* of the duties, not just their practical application. His arguments *are* clear, but their full force relies on philosophical premises about causation, identity, and duty that L&E either translates imperfectly (God) or inherently conflicts with (Self). The clarity of Hume's logic becomes apparent *through* the translation, but its deepest conclusions rest on foundations L&E doesn't fully share or represent.
