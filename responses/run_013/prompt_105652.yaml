  Ok so me and my friend got into this big argument at lunch and I want to actually settle it in writing. He read something online about how, in a really huge world with tons of people in it, doing the good thing can be the rational move even when your own action makes basically zero difference — not because of what your action causes, but because the fact that you chose it is evidence that lots of other people who think like you also chose it. So he says giving 10% of your income away, or not eating meat, is like pulling one lever that moves everyone similar to you at the same time, and he compared it to that desert hitchhiker thing where the driver only stops for people who'd actually pay up after the ride. I said thats just magical thinking dressed up in math — if my choice can't change what strangers on the other side of the planet do, then it isn't a reason to do anything, and anyway the world isnt actually full of copies of me.

  Write an essay where you weigh both sides properly and then actually commit to a verdict, dont just say "it depends on your values" and stop. Somewhere in there I want you to deal with whether his view secretly needs everyone to be running the same decision procedure as me (so my choice is only evidence about the choices of people who are also treating my choice as evidence), and whether the whole thing falls apart once you admit that most people in the world aren't thinking about it at all.
