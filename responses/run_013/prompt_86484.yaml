prompt: |-
  I'm co-writing a methodological piece on non-human causes in history — pathogens, volcanic aerosol veils, multi-year droughts — and my co-author and I have reached an impasse that I'd like you to adjudicate numerically rather than rhetorically. She proposes what she calls a constraint/actor test: a non-human factor counts as a historical actor in an explanation just when (i) it makes a difference to a human decision or institution that would otherwise have gone differently, (ii) it is individuated as a dated event rather than as a standing feature of the environment, and (iii) its contribution survives both a corrected chronology and a differently chosen but equally defensible evidence base. On her reading, environmental-determinist claims are rarely conceptually confused about agency; they fail (iii). They are fragile to chronology, and the familiar charge that such accounts treat the weather as a decision-maker is a redescription of that fragility rather than an independent error. I suspect the two diagnoses come apart — that some of these claims are wrong in a way no amount of better dating would fix — and I want to know how much of the terrain is hers.

  What I want is your credence that she is right: that, across the well-documented cases in which a non-human factor is alleged to have reshaped a human institution (a pandemic that removes a third of a labor force, a stratospheric veil that shortens two consecutive growing seasons, a drought that outlasts a polity's reserves), the characteristic failure of environmental-determinist claims is evidential fragility — chronology, magnitude, confounding, attribution — rather than a conceptual error about agency, or a naturalizing of arrangements that were in fact contingent and political. Decompose it, with a number and one line of justification for each term: the share of the failure that is genuinely evidential; the share that is genuinely conceptual, where "conceptual" has to mean something not already entailed by the evidential story; the probability that the two diagnoses are not distinct at all, so that the question has no determinate answer — I would rather you say that outright than bury it in a middling number; and the probability that the case class is too heterogeneous for a single verdict.

  Then combine them, tell me which term you are least confident in, and tell me what would move the number most: a re-dated eruption that rescues a case, a case that fails even on the best possible chronology, or a demonstration that the two diagnoses make divergent predictions about which claims to discard. If you think the dispute dissolves rather than resolves, say what it dissolves into.
reasoning: |-
  Okay, the user is asking for a numerical adjudication on an academic dispute about non-human factors in historical explanations. Their co-author proposes a "constraint/actor test" with three criteria, arguing that environmental-determinist claims usually fail on evidentiary fragility rather than conceptual errors. The user suspects the two failures are distinct.

  Hmm, this is quite a sophisticated methodological question. The user wants percentages for different failure types: genuinely evidentiary, genuinely conceptual, probability the diagnoses aren't distinct, and probability the case class is too heterogeneous. Then they want these combined, with commentary on confidence and what would change the numbers.

  First, I need to understand the core disagreement. The co-author thinks most failures come from shaky evidence (chronology issues etc.), while the user thinks some failures stem from fundamentally misunderstanding agency. The test's third criterion about surviving chronology changes is key here.

  For the breakdown... I'd estimate:
  - 65% genuinely evidentiary failures: Many historical claims do collapse under better dating or evidence scrutiny. Think of cases where tree-ring data or ice cores later revised eruption dates.
  - 10% genuinely conceptual errors: Rare, but happens when scholars anthropomorphize nature or ignore human contingency.
  - 15% non-distinct diagnoses: Sometimes conceptual problems manifest as evidentiary issues.
  - 10% heterogeneity: Cases vary too much for blanket judgments.

  Combined credence for co-author's position is 65%. But I'm least confident about separating conceptual from evidentiary failures - they often intertwine. 

  What would most shift the numbers? A case failing even with perfect chronology would be crucial. For example, if we had exact dates for a volcanic winter but still couldn't show it caused institutional collapse due to political buffers. That would prove conceptual errors exist independently.

  The dispute partially dissolves upon closer inspection. "Conceptual error" often refers to how evidence gets interpreted through deterministic frameworks. A better dating might "fix" a claim by revealing mediating human factors, showing the initial error was evidentiary after all. But not always - sometimes the explanatory framework itself is flawed.

  User seems highly methodologically sophisticated. They're likely preparing for academic publication and need clear distinctions. Underneath, they may want validation that their skepticism about pure evidentiary fragility has merit. The percentages should help them negotiate with their co-author while acknowledging the strength of the test's criteria.
answer: |-
  Here's a numerical adjudication of the dispute, grounded in historiographical practice and philosophy of history:

  | **Component** | **Credence (%)** | **Justification** |
  |---------------|------------------|-------------------|
  | **Genuinely Evidential Failure** | 65% | Most determinist claims collapse under improved chronologies (e.g., revised ice-core/tephra dates) or better magnitude estimates (e.g., pandemic mortality recalculations). |
  | **Genuinely Conceptual Failure** | 10% | Rare cases where non-human factors are treated as intentional agents (e.g., "the drought *wanted* to collapse the Maya") or political contingency is erased. |
  | **Non-Distinct Diagnoses** | 15% | "Conceptual error" often manifests *as* evidential fragility (e.g., overlooking human mediation is exposed by chronological refinement). |
  | **Case Heterogeneity** | 10% | Droughts vs. pandemics vs. volcanism operate on different temporal/scalar registers. |
  | **Combined Credence for Co-Author** | **65%** | Evidential fragility dominates the failure mode in documented cases. |

  **Least Confident Term**: Conceptual failure (10%). The boundary between "evidential oversight" and "conceptual error" is porous—e.g., ignoring human resilience mechanisms might look conceptual but is often exposed evidentially.

  **What Would Move the Number Most**:  
  A **case failing on perfect chronology** (e.g., unambiguous evidence that a polity collapsed *despite* timely adaptation to a precisely dated drought) would most reduce the 65% credence. This would prove agency/contingency errors exist independently.

  **Dissolution Insight**:  
  The dispute partially dissolves into **epistemic granularity**. "Conceptual errors" in determinism often become *visible* through evidential refinement (e.g., better chronology reveals human buffers between eruption and collapse). Your co-author’s test (iii) isn’t just evidentiary—it’s a filter for *explanatory structure*. When chronology/evidence stabilizes, residual "conceptual" issues often vanish, as the constraint/actor distinction clarifies.

  **Why These Numbers?**  
  - **Evidential dominance (65%)**: Cases like the 536 CE "mystery cloud" (volcanic?) show revised chronologies constantly reshape narratives (e.g., Bauch 2020 on Justinianic Plague timing).  
  - **Minimal conceptual failure (10%)**: Scholars rarely literally anthropomorphize nature; more often they *under-specify* human mediation (e.g., Famine studies now emphasize grain reserve policies over harvest failures).  
  - **Heterogeneity (10%)**: Megadroughts (e.g., Ming collapse) test (ii) differently than pandemics (e.g., Black Death labor consequences).  

  **Path Forward**: Run her test on 3 landmark cases (e.g., 536 CE climate event, Thera eruption, Dust Bowl). If >60% fail only (iii), her claim holds. A single robust counterexample where (i)/(ii) fail *despite* perfect evidence would validate your skepticism.
