prompt: |-
  I'm on the economic development board for a mid-sized city (we're not huge, maybe 200k people). We're in a bidding war with a rival metro to land the new headquarters of a regional company. Here's the mess: our consultants figure the HQ is worth maybe $60M in net benefit to us over 15 years, tops. We've already put $45M in incentives on the table, spent about $6M on site prep, lawyers and consultants, and signed earnest-money contracts on three parcels that we forfeit if we don't close. The company just came back asking us to go to $60M, and word is the rival city is at $52M and will probably match whatever we do. If we lose we eat the $6M plus the forfeited deposits and the mayor looks like a chump; if we win we're basically at breakeven at best and maybe underwater. One of our analysts keeps calling this a "dollar auction," another says its really a war of attrition, and honestly I'm not sure either label tells me what to do Thursday.

  I have to circulate a written opinion before the meeting. Draft it for me. It should land on a concrete recommendation — raise the offer to some number, hold firm at what we've already bid, or walk, and by when — with the reasoning spelled out, and it needs to take seriously the strongest case for the other side, which is basically that folding now wrecks our reputation for resolve in every future negotiation we ever have.

  Couple of things I specifically want you to work through rather than hand-wave:

  - Whether our escalation is just sunk-cost irrationality or whether its actually rational given the rules of the game we're stuck in, and why that distinction changes the fix.
  - Whether this is closer to a dollar auction or a war of attrition, and what actually differs between them here.
  - The proposed fixes floating around: publicly precommitting to a hard ceiling before the next round, telling the company we'll submit one sealed final offer and no more, offering non-cash stuff (land, workforce training) instead of more money, begging the state to cap municipal incentives, or quietly getting the rival city to coordinate with us — and flag anything legally dicey about that last one.
  - Whether an announced ceiling is even credible, given the other side can just bid one dollar under it.
  - And a standing policy for future contests, so we're not back here in two years.

  Keep it to something I can actually read aloud. No need for footnotes or reading lists, just the argument and the call.
reasoning: |-
  Okay, let me tackle this economic development board dilemma. The user needs a clear recommendation on whether to escalate, hold firm, or walk away from a costly HQ bidding war, with deep analysis of the strategic dynamics.

  First, I need to understand the core tension: they're already $51M deep ($45M offer + $6M spent) for a project max valued at $60M, facing a rival that will match any bid. The analyst calls it a "dollar auction" - that classic trap where bidders escalate past value due to sunk costs. But the war of attrition angle matters too - it's about who blinks first in a costly standoff.

  The reputational concern is real but overrated here. Future companies care more about a city's fundamentals than whether it lost one bidding war. Still, I should address it head-on since the user flagged it as the strongest counterargument.

  Looking at the proposed solutions:
  - Precommitment to a ceiling sounds smart but isn't credible when the rival can bid $1 under. 
  - Sealed final offers might work if both cities coordinate, but antitrust issues make that legally risky.
  - Non-cash incentives could create value without new spending, though land transfers may have hidden costs.
  - State intervention is a long-term fix but won't help now.

  The sunk cost fallacy is at play, but the $6M spent and forfeitable deposits create a rational (if painful) incentive to bid up to $54M. Beyond that, it's pure loss. 

  For the recommendation: walking now costs $6M, but winning at $60M means net zero at best after accounting for the $6M already spent. Holding at $45M might force the company's hand if the rival only bids $52M. Best realistic path: offer $54M (covering sunk costs) with take-it-or-leave-it framing, while publicly announcing a new policy to avoid repeat scenarios.

  Future policy should have binding bid caps based on independent valuations, mandatory cost-benefit disclosures, and maybe interstate compacts to curb races to the bottom. This case should become a cautionary case study for the board.

  The tone needs to be decisive but not reckless - acknowledging the pain of walking away while showing why escalation is even more dangerous. I'll structure it with clear sections: situation summary, strategic analysis, recommendation, and future safeguards.
answer: |-
  **MEMORANDUM**  
  **TO:** Economic Development Board  
  **FROM:** [Your Name]  
  **SUBJECT:** Recommendation Regarding HQ Bidding War & Path Forward  
  **DATE:** October 26, 2023  

  ### **I. Situation Summary**  
  We face a critical decision on the proposed HQ project:  
  - **Net Benefit Estimate:** $60M over 15 years (conservative ceiling).  
  - **Current Offer:** $45M cash incentives + $6M sunk costs (site prep, legal, deposits).  
  - **Company Demand:** $60M total incentives.  
  - **Rival City:** At $52M, will match any offer.  
  - **Downside:** Lose $6M + reputational damage if we walk; break even (at best) or lose money if we win.  

  ### **II. Strategic Analysis: Dollar Auction vs. War of Attrition**  
  **a) This is a dollar auction with attrition elements:**  
  - **Dollar Auction Dynamics:** Bidders escalate beyond rational value to avoid sunk losses. Our $51M already committed ($45M offer + $6M spent) *creates rational pressure* to bid up to $54M to "cover" sunk costs—but crossing $54M makes us net negative if we win.  
  - **Attrition Element:** The rival’s resolve to match turns this into a waiting game where both cities bleed value. Unlike classic attrition, our sunk costs create immediate pressure to bid higher *now*, not wait.  

  **b) Why "rational escalation" differs from "sunk-cost fallacy":**  
  - **Rational:** Bidding up to $54M ($45M new + $9M sunk) is defensible to avoid forfeiting $6M deposits and recoup some value.  
  - **Irrational:** Bidding beyond $54M (e.g., $60M) ignores the project’s max value. We’d lock in a net loss even if we "win."  

  **c) Reputational Risk: Overstated**  
  - Walking away after refusing irrational bids signals prudence, not weakness. Future firms value fiscal stability more than desperation.  
  - **Counterargument:** Losing *after* escalating signals poor judgment. We avoid this by setting a public ceiling now.  

  ### **III. Options Assessment**  
  | **Tactic**               | **Pros**                              | **Cons**                                  | **Feasibility**         |  
  |---------------------------|----------------------------------------|-------------------------------------------|--------------------------|  
  | **Raise to $54M**         | Recoups sunk costs; competitive        | Still marginal ROI; rival may match       | **High**                 |  
  | **Hold at $45M**          | Limits losses; tests rival’s resolve   | High risk of losing $6M deposits          | **Medium**               |  
  | **Non-cash incentives**   | May add value without new cash         | Land/training unlikely to bridge $15M gap | **Low** (company wants cash) |  
  | **Sealed final offer**    | Forces company decision; no escalation | Rival may outbid; no cost reduction       | **Medium**               |  
  | **Precommit to ceiling**  | Signals resolve; caps losses           | Not credible if rival bids $1 under       | **High** (if framed right) |  
  | **Coordinate with rival** | Ends bidding war; saves both cities    | **Illegal** (antitrust violation)         | **Do not pursue**        |  

  ### **IV. Recommendation: Hold at $45M + Announce Policy Shift**  
  **Step 1: Do not increase cash offer.**  
  - At $45M + $6M sunk, we are at $51M committed. Bidding $60M guarantees a net loss ($60M cost > $60M value). The $6M loss now is less painful than a $5–10M loss over 15 years.  

  **Step 2: Submit a sealed final offer at $45M by EOD Thursday.**  
  - State this is our best/final offer, non-negotiable. Forces the company to choose without further bidding.  

  **Step 3: Announce a new binding policy:**  
  > *"Effective immediately, our city caps incentives at 75% of independently verified net project value. All bids require a public cost-benefit analysis. We compete on infrastructure, talent, and quality of life—not blank checks."*  

  **Why this works:**  
  - **Avoids dollar auction trap:** Refuses irrational escalation beyond $54M.  
  - **Signals strength:** A transparent, data-driven walkaway rebuilds credibility.  
  - **Credible ceiling:** Binding policy (unlike ad hoc threats) deters future extortion.  

  ### **V. Future Policy: Prevent Repeats**  
  1. **Independent Valuation Mandate:** All projects require 3rd-party ROI analysis before bidding.  
  2. **Hard Cap Rule:** Incentives capped at 75% of estimated net benefit.  
  3. **No Upfront Spending:** Site prep/legal funds escrowed only *after* final contract signing.  
  4. **State Lobbying:** Push for a statewide cap on municipal incentives to level the playing field.  

  ### **VI. Conclusion**  
  Escalating to $60M sacrifices long-term fiscal health for a Pyrrhic victory. Walking away now, while painful, costs less than winning a money-losing deal. By holding firm at $45M, instituting a public cap, and reframing our competitiveness, we protect the city’s finances and reputation. Reputational capital is earned by making smart choices—not by winning at any cost.  

  **Recommended Vote: Reject $60M demand. Submit final $45M offer by Thursday 5 PM. Announce new incentive policy Friday AM.**  

  ---  
  **Ready for presentation. No fluff, no regrets.**
