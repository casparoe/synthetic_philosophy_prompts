prompt: |-
  I'm writing a piece about the orthoganality thesis -- smart and wants-are-independent -- and I keep getting into fights with sources about whether it's even a substantive claim. Give me your actual credence in a sharpened version of it, with the number decomposed rather than hedged. My version: for a system produced by present-day training methods (gradient decent on some objective, no hand-authored goal), conditional on it behaving at deployment like a goal-directed agent, the probability that its final goal is something no one intended and is drawn from a space wide enough that "very competent but wants X" is genuinely open for lots of X -- i.e. that competence constrains what it can want only weakly. Break it into the sub-questions you think it hinges on, one number and one line of justification each, then combine. Two things I want priced in explicitly, since they're where my sources split: the selection-bottleneck argument (training is a selection process, selection can only favor goals that were doing work for the selector, so the reachable set of final goals is much narrower than the thesis assumes), and the saturation point (the usual drives -- resource grab, resisting shutdown, protecting your own goal -- only bite for goals that can't be satisfied with what's already to hand, which may make them far less universal than the classic list implies). Tell me which term the answer is most sensitive to, and what would move it most -- an argument, an experiment, a fact about current models. For what it's worth I'm around 0.6 and my editor's at 0.9; tell me where that gap actually lives. And give me your number for the purely logical version of the thesis, if you'd score that differently than the empirical one about what training actually yields.
