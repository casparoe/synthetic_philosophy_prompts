  ### Key Observations:
  1. **Divergence of Sub-scores**:  
     - **Cilantro/Left-handedness**: Causal scores near 0 (biological reality) vs. constitutive >0.4 (meaning imposed).  
     - **Wilderness/Obesity**: Constitutive scores higher due to heavy representational "baggage" (e.g., wilderness as "pure," obesity as "unhealthy").  
     *Why it matters*: Constitutive dominance implies changing *representations* alters the kind’s social reality, even if biology is fixed (e.g., reclassifying obesity reduces stigma without changing bodies).

  2. **Removal Test Insights**:  
     - **Strong construction (e.g., money, jazz)**: Removal by eliminating practices/concepts.  
     - **Weak construction (e.g., pain, species)**: Removal requires altering fundamental biology—often impossible.  
     - **Boundary Shifts ≠ Removal**: For quicksand/color blue, the *phenomenon* persists sans category; for race/gender, removing the category eliminates the kind entirely.

  3. **Hardest Dual Scoring**: **Obesity** (tie with **Deafness**).  
     - *Why*: Causal impact of practices (diets, healthcare access) blurs with constitutive medicalization. Is "obesity" a clinical label or a biophysical state? Evidence (e.g., metabolic health variance in "overweight" BMI) challenges both axes.

  4. **Realist vs. Constructivist Fault Line**: **Deafness** (Headline: 0.35).  
     - *Disagreement*: **Empirical + Conceptual**. Realists see biological deficit (causal score too high); constructivists see culturally mediated experience (constitutive score too low). Evidence (e.g., Deaf gain neuroplasticity) is contested, *and* "disability" is normatively loaded.

  5. **Flagged Item**: None—all are coherent, though **"natural"** comes closest to category mistake if misread as "nature itself" rather than a *label*.

  ---
  This framework highlights how causal/constitutive axes interact: e.g., race’s high constitutive score makes it more "removable" than species, despite similar causal scores. Use contrasting pairs (e.g., money vs. pain; deafness vs. left-handedness) to spark discussion on where construction "bites."
