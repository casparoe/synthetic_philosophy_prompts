prompt: |-
  I'm a science and ideas journalist, currently doing a long profile of a Buddhist ethics scholar who's also been practicing for decades in a fairly precept-strict lineage. The hypotheticals are the best part of the interviews and I want to figure out what she's actually running before I file.

  Where she's landed so far:

  - A woman skims a few thousand from the clinic where she works to cover her kid's surgery. Her verdict: it's stealing, and the love in it doesn't launder it. The mind that says "just this once" is the mind that says it again.
  - A man testifies truthfully against his brother-in-law in a fraud case. Prison, divorce, the family blown apart. Her verdict: he did the right thing, the truth wasn't his to sit on, and he shouldn't be carrying the fallout around as guilt.
  - A soldier kills a man at close range, terrified, to save his squad. Her verdict: the killing is real and it'll follow him; "I had no choice" is just how the mind declines to look.
  - A meditation teacher tells a student she's making real progress when she isn't, partly so the student won't quit, mostly because he likes being liked. Her verdict: wrong, and the flattery costs him more than it costs her.

  Maybe you see my problem: every one of those is a case where the deed and the motive point the same way. Clean deed, clean motive. Bad deed, bad motive. So I cant tell whether she thinks an act is wrong because of what it is or because of what's behind it. She also keeps saying the tradition has one strand that lets you bend a precept for a good end and another strand that says that's exactly the loophole the precepts exist to close, and that she thinks the second strand gets it right — but then she'll float something like "is it true, is it useful, is it the right moment," and she only ever seems to apply the first one.

  So here's the case I want to put to her. A man's brother is dying of pancreatic cancer, maybe a week left. The brother's daughter has made clear she isn't coming — not a dramatic estrangement, she just won't. Every few hours the brother asks whether she's on her way, and the man tells him yes, she's trying to get a flight, she loves you. Four days of this. The brother dies calm, believing it, holding his hand. Nothing mixed in the man's motive: he isn't squeamish about death, he isn't protecting himself, and he'd have told the truth if he thought it would do anything but torture his brother.

  Is that lie wrong? Would she say so? Give me the two or three rules that fit everything above, what each one predicts here, which you'd bet she's running and why, and whether she's quietly answering two different questions — was the act wrong, and what does it do to the person who does it — without noticing that's what she's doing. Then tell me the next case to put to her to actually settle it. I figure it's probaly one where the deed and the motive come apart the other way, but you tell me.
reasoning: |-
  Okay, the user is a science and ideas journalist profiling a Buddhist ethics scholar with a strict precept-based practice. They've shared several hypothetical cases the scholar has judged, all showing alignment between deed and motive. The journalist's challenge is figuring out the scholar's underlying ethical framework, especially when deeds and motives conflict. 

  Hmm, the key tension here is between two Buddhist strands: one allowing precept-bending for good ends (utilitarian-ish), and one rejecting any loophole (absolutist). The scholar claims allegiance to the latter but keeps referencing the "is it true/useful/timely" test which feels more situational. Interesting disconnect.

  The journalist's proposed case—lying to comfort a dying man—is perfect because it forces this tension: blameless motive but technically a violation of truth-telling. I need to reverse-engineer the scholar's likely rules from her past verdicts:

  First rule seems to be "Deeds define karma, not intentions" (hence condemning the clinic thief despite maternal love). Second is "Truth has intrinsic weight" (supporting the brother-in-law whistleblower despite fallout). Third is "Self-honesty trumps self-protection" (rejecting the soldier's "no choice" defense). Yet her flattery verdict also shows concern for consequences—the teacher's corruption matters more than the student's delusion. 

  For the dying brother case, Rule 1 (absolutist) would call the lie wrong. Rule 2 (consequentialist) might excuse it. Given her pattern, I'd bet she condemns it—the "is it true?" test overrides comfort. But! She might separate the act's wrongness from the liar's moral burden (he needn't carry guilt, like the whistleblower). 

  To really test this, the next case should have pure motives causing clear harm. Like... a doctor withholding a terminal diagnosis to avoid distress, accidentally causing unresolved estate chaos. Does she condemn the deception despite kind intent? That'd confirm absolutism. If she excuses it, she's secretly consequentialist. 

  The journalist's sharp to notice the "two questions" possibility (wrongness vs. impact on doer). That nuance could explain her stance: always judge the act strictly, but judge the actor compassionately. I'll flag that as her potential blind spot.
answer: |-
  Based on her pattern and stated principles, here's how her framework likely operates, the prediction for your case, and the crucial next hypothetical to settle the question:

  **The Core Rules Extracted from Her Verdicts:**

  1.  **The Act Defines the Karmic Seed:** The intrinsic nature of the deed (stealing, killing, lying) creates the primary karmic consequence, regardless of the motive or perceived necessity. The precept violation *is* the wrong. (From Clinic theft, Soldier killing, Flattery lie).
  2.  **Motive Reveals the Mind's Conditioning & Future Risk:** While not absolving the act, motive illuminates the mental habits being reinforced. "Good" motives entangled with precept violation often mask self-deception ("just this once," "I had no choice," "it's for their benefit") and create dangerous future tendencies. Bad motives compound the wrong. (From Clinic theft "love doesn't launder," Soldier's "declines to look," Flattery "likes being liked").
  3.  **Truth Has Intrinsic Weight & Must Be Borne:** Withholding or distorting truth when it *must* be spoken (especially about serious matters) is a failure of responsibility, even if the consequences are painful. Truth isn't "owned" to be conveniently set aside. (From Brother-in-law testimony).
  4.  **"Is it true?" is the First and Non-Negotiable Gate:** Her mention of "Is it true, is it useful, is it the right moment?" is revealing. Her verdicts show she prioritizes "Is it true?" above all. If it's *not* true, the other questions become moot or even deceptive justifications for violating the precept. The flattery lie failed at "Is it true?" regardless of perceived usefulness/timing. The brother-in-law verdict prioritized "Is it true?" despite devastating consequences.

  **Prediction for Your Dying Brother Case:**

  *   **Rule 1 (Act Defines Karma):** Predicts **WRONG.** It's a lie. Lying is a precept violation. The karmic seed of false speech is planted.
  *   **Rule 2 (Motive Reveals Conditioning):** Predicts **COMPLICATED but DANGEROUS.** The motive *appears* pure (compassion, no self-interest). However, she'd likely probe: Is the *certainty* that the truth would *only* torture an act of profound arrogance? Is the mind conditioning itself to believe "the ends justify the means (lying)" in emotionally fraught situations? This creates a dangerous precedent in one's own mind. The "clean motive" might mask a subtle unwillingness to bear the harsh reality alongside the dying brother.
  *   **Rule 3 (Truth Has Weight):** Predicts **WRONG.** The brother asked a direct, crucial question repeatedly. The truth (that his daughter wasn't coming) *belonged* to him, especially in his final days. Withholding/denying it denied him a piece of his reality, however painful.
  *   **Rule 4 ("Is it true?" Gate):** Predicts **WRONG.** It fails the first gate. "She's coming, she loves you" was not true. Therefore, regardless of perceived usefulness (calming him) or timing (his final hours), the act of speaking it was a violation. The "useful" and "timely" considerations become irrelevant or even part of the self-deception once the fundamental truth is abandoned.
  *   **Overall Bet:** She will say **it was wrong.** The lie itself is the violation. The compassionate motive, while understandable, does not cleanse the act and risks embedding a harmful mental habit of justifying untruth based on perceived benevolent outcomes. She might soften it by saying the man shouldn't be *crushed* by guilt (like the brother-in-law), but the act itself was a karmically unskillful breach of the precept.

  **Are "Wrongness" and "Impact on Actor" Separate?**

  *   **Yes, she likely is separating them, perhaps subtly.** This is a crucial insight.
      *   **Wrongness (Act):** Defined by the precept violation itself. It's the karmic action taken.
      *   **Impact/Burden (Actor):** Defined by the actor's intention, understanding, and subsequent relationship to the act. The clinic thief and flattering teacher have burdensome *bad* intentions/karma. The brother-in-law and soldier performed karmically heavy acts (truth-telling/killing) with difficult consequences, but their *relation* to the act (owning responsibility without clinging to guilt) is where their potential for growth lies. The dying brother liar would have the karmic burden of the lie *but* a relatively "clean" motive might mean less *additional* negative karma (like malice) and suggests he shouldn't be *defined* by guilt afterward, though he must acknowledge the violation.

  **The Next Case to Settle It: Deed & Motive Split (Clean Deed, Bad Motive)**

  To definitively test if "Is it true?" is the absolute gate and deeds define wrongness *regardless* of motive, force a case with a *technically clean deed* driven by an *undeniably bad motive*. This isolates the deed as the primary factor for her judgment of "wrongness."

  **The Case: The Calculated Truth-Teller**

  *   **Scenario:** A woman knows her colleague is up for a major promotion she desperately wants. She discovers evidence of a minor, years-old ethical lapse by the colleague – something irrelevant to the current role but potentially damaging if revealed. She *could* stay silent. Instead, she meticulously verifies the evidence and anonymously leaks it to the hiring committee *only* when she knows it will torpedo the colleague's chances at the last moment, maximizing their humiliation and her own advantage. Her motive is pure spite and careerism. The leaked information is entirely **true**. The committee finds it relevant enough to withdraw the offer.

  **Why this settles it:**

  1.  **Deed:** Speaking Truth (technically adheres to "Is it true?").
  2.  **Motive:** Undeniably bad (spite, malice, self-interest).
  3.  **Consequence:** Harmful (colleague loses promotion, humiliated).
  4.  **The Test:**
      *   **If she focuses SOLELY on "Is it true?" (Deed as Primary):** She *cannot* call the *act of speaking the truth* itself "wrong." It passed the gate. She might condemn the *motive* and the *harm*, but the core act of truth-telling would be karmically neutral or even positive *as an act*. She might say the *way* it was done (anonymous, timed for max harm) was unskillful, but the truth-telling itself stands.
      *   **If Deed + Motive Together Define "Wrongness":** She would condemn the entire action as "wrong" because the truth was weaponized with malicious intent, making the *act of speaking this truth in this way* a karmically negative act, despite the words being factual. The bad motive taints the deed.
      *   **If Consequence is Primary:** She might condemn it because it caused unnecessary harm, even with truth.

  **Based on her pattern (esp. flattery and brother-in-law cases):**

  *   **Your Scholar's Likely Verdict:** She would **condemn the Calculated Truth-Teller's *action* as wrong.** While the *words* were true, the *act* of speaking them was motivated by and executed with malice, making it a form of "wrong speech" (perhaps akin to divisive speech or harsh speech, even if factual). The violation isn't of "truth" per se, but of the *spirit* of the precept – using speech to harm. The bad motive fundamentally corrupts the deed. This confirms that while "Is it true?" is necessary, it's not *sufficient*; the ethical quality of the *entire intentional act* (deed + motive + execution) defines its karmic weight and "wrongness." The lie to the dying brother was wrong primarily because it failed "Is it true?", regardless of motive. The malicious truth-telling is wrong primarily because of the motive, even though it passed "Is it true?".

  This second case forces her to confront whether a precept-compliant deed *can* be "wrong" due to motive, proving that "wrongness" isn't *solely* defined by the deed in isolation, but by the deed *as an expression of intention*. It reveals that her "Is it true?" gate is paramount *for truthfulness*, but other factors (especially intention) define the ethical nature of acts *within* precepts or when precepts potentially conflict.
