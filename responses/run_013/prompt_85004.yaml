  Here's a breakdown prioritizing explanatory coverage of your cases, forced trade-offs, and prediction for new examples. The core principle resolves most of your pile by distinguishing **privative** vs. **subsective** adjectives, rooted in how modifiers interact with the noun's essence or function.

  ### The Principle & Its Clauses
  **Principle:** A modified noun phrase "X Y" denies "X Y is a Y" (asserting non-membership) **if and only if** the modifier "X" is **privative** – meaning it indicates the object *lacks the core defining essence, function, or legal/social reality* of a prototypical Y, instead presenting a resemblance, representation, imitation, or former state. Otherwise, "X" is **subsective** (narrowing the category without negating essence), and "X Y is a Y" holds.

  **Clauses:**
  1.  **Privative Modifiers:** Trigger "is not a Y" by negating essence/function. *Motivating cases:* "stone lion" (lacks animacy, biology), "toy duck" (lacks biological function/essence), "fake diamond" (lacks geological origin/hardness function), "former senator" (lacks current legal authority). (*Saves: stone lion, toy duck, rubber duck, fake diamond, former senator*).
  2.  **Subsective Modifiers:** Allow "X Y is a Y" by specifying attributes/states within the category. *Motivating cases:* "white horse" (color doesn't negate horseness), "dead parrot" (state of a parrot), "bad dancer" (skill level of a dancer), "lab-grown diamond" (origin doesn't negate chemical/structural essence if identical). (*Saves: white horse, black duck, bad dancer, dead parrot, lab-grown diamond*).
  3.  **Pragmatic Counting Override:** In contexts of loose counting or description (like inventory, stories, or visual grouping), representations/imitations *can* be referred to by the noun they resemble ("three lions" including statues) **without** contradicting the strict "is not a Y" membership claim, because the context shifts focus to appearance or grouping. *Motivating cases:* "three lions" (some stone), "four fake guns... zero guns". (*Saves the counting cases without sacrificing privative verdicts*).

  ### How It Handles Your Pile & Trade-offs
  *   **Saved Verdicts (10/11):** White horse=horse, black duck=duck, bad dancer=dancer, dead parrot=parrot, stone lion≠lion, toy duck≠duck, rubber duck≠duck, fake diamond≠diamond, former senator≠senator, lab-grown diamond=diamond. The counting cases are handled by Clause 3.
  *   **Verdict You Must Drop:** **"A fake diamond is not a diamond" must be downgraded in strictness when confronted with the counting case.** Your intuition that "zero guns... four fake guns" is fine directly shows that "fake X is not an X" is a claim about *essential membership*, not about how we *refer* to objects in pragmatic contexts like counting lookalikes. The principle explains this tension (Clause 3) rather than eliminating it. Your other verdicts stand.
  *   **Why Lab-Grown ≠ Fake:** "Lab-grown" is subsective if the product is chemically/structurally identical to natural diamonds (preserving essence/function), while "fake" is privative (denying essence/function, e.g., glass or cubic zirconia). The difference *is* whether it "really is" one by core criteria.

  ### Predictions for New Cases
  *   **Wooden horse:** *Privative.* Not a horse (e.g., Trojan horse - lacks biology/agency). "Is not a horse".
  *   **Decoy duck:** *Privative.* Not a duck (lacks biology/essence, is a lure). "Is not a duck".
  *   **Forged passport:** *Privative.* Not a passport (lacks legal validity/issuance). "Is not a passport".
  *   **Ex-husband:** *Privative.* Not a husband (lacks current marital status/legal bond). "Is not a husband".
  *   **Painting of a horse:** *Privative.* Not a horse (it's a painting - lacks essence entirely). "Is not a horse".
  *   **Synthetic ruby:** *Subsective.* **Is a ruby** (if chemically/structurally identical to natural ruby). "Is a ruby".
  *   **Someone who bought his medical diploma:** *Contextual.* If it's a *real diploma* from a corrupt institution, "diploma" is subsective (it's a real, though fraudulently obtained, credential). If it's a *forged diploma*, "forged" is privative - "is not a diploma". The modifier matters.

  ### Gongsun Long's Arguments & Related Puzzles
  *   **"Ask for a horse" Argument:** This is **pragmatic**, not about kind-membership. It concerns satisfiability conditions of requests, not ontology. As you note, "tall basketball player" would fail the same test – proving nothing about membership. It exploits context, not modification logic.
  *   **"Shape/Color" Argument:** This is primarily about **word identity and compound terms**, not real-world classification. "White horse" is a compound concept distinct from "horse". Your intuition ("trivially true if about phrases") is correct. The privative/subsective distinction is about how language maps to reality, not about the words themselves. This argument highlights linguistic composition but doesn't engage with the essence/function issues central to your pile.
  *   **"Arrive yesterday" (Zhi Wu Lun):** This is **fundamentally different**. It's a temporal/modal paradox about the meaning of "arrive" and the reality of future events, exploiting the ambiguity of "today" and "yesterday" across time references. It's about logic, reference, and time – not modification, essence, or function. The "white horse" and "arrive yesterday" puzzles belong to the same broad school of linguistic/logical disputation but address distinct mechanisms.

  ### Candidate Principles Ranked by Coverage
  1.  **Privative/Subsective Distinction + Pragmatic Counting (Proposed):** Saves 10/11 verdicts directly + resolves counting tension. Requires dropping strict application of "fake X ≠ X" in *pragmatic reference* contexts (not membership contexts).
  2.  **"Is not" Ambiguity (c):** Can explain counting tension ("is" meaning different things) but fails to predict *which* modifiers trigger denial of membership (e.g., why "dead" doesn't but "stone" does). Leaves most of your pile unaddressed. Saves ~5/11.
  3.  **Resemblance/Being Distinction (b):** Gets fake/toy/stone vs. white/black/dead but fails on "former" (not resemblance) and "lab-grown" (how "being" is defined). Circular without essence/function criteria. Saves ~7/11.
  4.  **Modifier Cancellation List (a):** Descriptive but no predictive power or explanation for *why* some cancel (stone) and others don't (white). Fails on "lab-grown" vs. "fake". Saves ~6/11.

  **Principle:** Membership in kind Y is denied for "X Y" iff X is privative (negating Y's defining essence/function), else X is subsective (preserving membership), with pragmatic counting overriding strict membership claims based on resemblance or grouping.
