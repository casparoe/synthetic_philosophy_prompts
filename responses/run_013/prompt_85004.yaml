  Okay, let me tackle this fascinating puzzle about the "white horse is not a horse" paradox and the user's list of examples. The user wants a principle that explains their intuitive judgments about these cases, and they've provided a detailed set of examples and candidate principles. 

  First, I need to understand the core issue. The ancient Chinese disputer Gongsun Long argued that a white horse isn't a horse, using two main arguments: one about language (the word "white horse" combines color and shape concepts, so it's not identical to "horse"), and one about pragmatics (if you ask for a horse, you might get a black one, but if you ask for a white horse, you won't, so they're different). The user sees this as potentially about different senses of "is not" (not-the-same-as vs. not-a-member-of) and wants to reconcile it with their own judgments about similar English sentences.

  Looking at the user's list of verdicts, they range from clear acceptances ("a white horse is a horse") to clear rejections ("a stone lion is not a lion"), with some tricky cases in between, like lab-grown diamonds (which they accept as diamonds) versus fake diamonds (which they reject). The counting examples add another layer—saying "three lions" when two are stone statues seems contradictory if stone lions aren't lions. 

  The user's candidate principles are:
  - (a) Some modifiers cancel the noun, others narrow it.
  - (b) Modifiers indicate resemblance vs. being.
  - (c) It's all about ambiguity in "is."

  I need to find the principle that best explains the full pattern. Principle (a) seems intuitive but doesn't explain why "stone" cancels while "white" doesn't—both are properties. Principle (b) gets closer by focusing on whether something is genuinely the thing or just resembles it, but as the user worries, it might be circular. Principle (c) is broad but vague.

  The key insight comes from linguistics: the distinction between intensional and extensional contexts, and specifically privative vs. subsective adjectives. Privative adjectives (like "fake," "toy," "stone") strip away the essence of the noun, while subsective ones (like "white," "dead") just add qualifications. For example, a "stone lion" isn't a lion because "stone" privates the animacy and biological essence, turning it into a representation. Similarly, "dead parrot" is still a parrot because "dead" is subsective—it describes a state of the same entity.

  This explains the diamond cases: a "fake diamond" isn't a diamond because "fake" is privative; it creates a resemblance without the real properties. But a "lab-grown diamond" is a diamond because it has the same chemical composition and structure—the modifier "lab-grown" is subsective, specifying origin without altering the essence.

  For the counting puzzles: language allows loose talk in extensional contexts. When we say "three lions" including stone ones, we're pragmatically including representations in the count for simplicity, even though strictly speaking, stone lions aren't lions. Similarly, "zero guns but four fake guns" works because "fake guns" are understood as non-guns in the context of danger or function.

  Applying this to the user's cases:
  - White/black duck, bad dancer, dead parrot: subsective modifiers, so "is a" holds.
  - Stone lion, toy duck, fake diamond: privative modifiers, so "is not a."
  - Former senator: privative (strips current role).
  - Lab-grown diamond: subsective if it meets diamond criteria.
  - Wooden horse: likely privative (not a real horse).
  - Decoy duck: privative (imitation).
  - Forged passport: privative (not genuine).
  - Ex-husband: privative (no longer married).
  - Painting of a horse: not even a horse—it's a painting.
  - Synthetic ruby: subsective if identical to natural ruby.
  - Bought diploma: privative (not legitimately earned).

  The user has to drop the idea that "stone lion is not a lion" conflicts with "three lions" including stone ones—it's a pragmatic looseness, not a logical contradiction.

  For Gongsun Long's arguments: The "ask for a horse" point is pragmatic—about what satisfies a request—not about kind membership. The shape/color argument is about word identity, not real-world classification. Both are different from the privative/subsective distinction, which deals with modification of kinds.

  The "arrive yesterday" puzzle is different—it's about temporal logic and language, not modification.

  Final principle: Privative modifiers (fake, toy, stone, former) negate kind membership by indicating resemblance without identity, while subsective modifiers (white, dead, lab-grown) preserve it by specifying attributes or origins.
