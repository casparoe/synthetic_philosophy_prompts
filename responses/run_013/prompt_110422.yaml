prompt: |-
  I'm putting together an application for a small summer fellowship in my department -- two pages, due in a couple weeks, and the committee is three profs who work on ethics and decision theory, so they'll know all the standard moves and will be allergic to anything that just redefines a term and calls it a solution. My half-formed idea is about the transitivity of betterness and the spectrum arguments that are supposed to break it. You know the shape: a long sequence of cases where each adjacent pair seems clearly ranked one way, but the endpoints seem clearly ranked the other way, or seem incomparable, so transitivity looks like it has to go. I've been arguing alot with a friend who thinks this shows betterness is intransitive (or that there's no such thing as overall betterness). My suspicion is that the argument is getting traction from a conflation: we treat betterness as one relation, but maybe there are at least two things we call by that name -- a frame-relative betterness that is transitive because it only ranks options within a fixed comparison frame (same dimensions, same scale, same baseline), and a transitional or choice-guiding betterness that we use in pairwise comparisons across frames and that can look intransitive. The real question is whether that distinction can be made precise without collapsing into the boring claim that a partial order is a partial order, and whether it can explain the spectrum cases rather than just redescribing them.

  Can you turn this into a two-page research proposal? I need a precise statement of the question that has a determinate answer -- something like: can a frame-relative betterness relation be transitive, extensionally adequate to the spectrum cases, and action-guiding, or does the attempt show that any transitive relation either ignores the spectrum or cannot rank the endpoints? Then explain why the existing positions (deny transitivity, deny one of the comparisons, go vague/incommensurabilist, restrict transitivity to precise cases) leave that question open, and what the angle is that they miss. For the method, I want something I can actually do in a semester: a taxonomy of the formal properties at issue (transitivity, asymmetry, completeness, context-sensitivity), a formalization of at least one frame-relative relation, a seperate set of test cases (population ethics, pain intensities, risk and lotteries, aesthetic value, maybe moral dilemmas), and a check on whether frame selection can be principled or becomes arbitrary -- because if its arbitrary, the view is trivial. Say what the possible conclusions are and which considerations would decide between them, and be honest about what would count as the project failing: e.g., if the frame-relative relation turns out to be just a familiar partial order with a new label, or if it can't handle the diachronic money-pump-style objection, or if it makes betterness so context-dependent that it loses its critical edge. Scope it realistically for one semester; I'd rather have a tight paper sketch plus a formal appendix than an overambitious theory of everything. Don't bother with citations or a lit review by name -- refer to positions and arguments and I'll fill in the references myself. Also, the committee is skeptical of formal ethics that just redefines terms, so the proposal needs to say early on why this isn't just relabeling and what would be lost if we stuck with the standard single-relation picture.
