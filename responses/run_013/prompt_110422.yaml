answer: |-
  ## Research Proposal: Framing Betterness - Resolving Spectrum Arguments without Abandoning Transitivity

  **1. Core Question & Stakes:** Spectrum arguments challenge the transitivity of "betterness" by presenting sequences (e.g., barely noticeable pain increments, color hue shifts) where adjacent pairs are clearly rankable (A>B, B>C, ..., Y>Z), yet endpoints defy transitivity (A seems worse than Z, or incomparable). Existing responses – abandoning transitivity, denying endpoint comparisons, invoking vagueness/incommensurability, or restricting transitivity to precise contexts – often feel unsatisfactory, sacrificing core intuitions or practical applicability. This project asks a precise, determinate question: **Can a formally defined *frame-relative betterness relation* (FRBR) satisfy transitivity, provide an extensionally adequate account of judgments in spectrum cases (including endpoint comparisons), remain action-guiding, *and* avoid triviality through principled frame selection, thereby resolving the paradox without abandoning standard rational constraints?** Crucially, this is *not* mere relabeling: it investigates whether the *source* of the paradox is an unrecognized context-sensitivity in "betterness" talk, implying that a single, monolithic, context-invariant betterness relation is an untenable idealization. If successful, this preserves transitivity as a core rational norm *within* coherent contexts while explaining apparent violations *across* contexts. Failure would imply either that the distinction collapses into a standard partial order (trivial), renders betterness inert for cross-context choice, or cannot avoid arbitrariness in frame selection.

  **2. The Gap in Existing Approaches:** Current positions leave the core question open by failing to rigorously model the *context-sensitivity* exploited by spectrum arguments:
  *   **Intransitivism:** Accepts the paradox but sacrifices a fundamental principle of rational choice, struggling with money-pump arguments and intuitive norms of consistency.
  *   **Endpoint Denial/Precision Restrictions:** Dismisses clear intuitions about endpoints (e.g., severe pain *is* worse than mild pain) or renders betterness inapplicable to inherently "fuzzy" real-world choices.
  *   **Vagueness/Incommensurability:** Explains incomparability but struggles with cases where endpoints *are* clearly comparable (just not as predicted by naive transitivity on adjacent pairs). It often fails to provide clear action-guidance for choices *within* the spectrum.
  *   **Standard Contextualism:** Often posits context-sensitivity but lacks a formal model of a *transitive* relation operating *within* a frame and how frames relate. It risks being merely descriptive or leaving "all-things-considered" betterness undefined.
  The common gap is a lack of a *formalized, transitive, action-guiding relation* that explains *both* the local comparability in spectrum steps *and* the global violation, without resorting to denial or primitive incomparability. The suspicion is that these approaches miss a specific *structural* feature: "betterness" judgments shift between evaluating options under a *fixed evaluative framework* (yielding transitivity) and guiding choices *between* such frameworks (where different considerations dominate, potentially violating naive transitivity expectations).

  **3. Core Hypothesis & Distinction:** We systematically conflate two relations:
      *   **Frame-Relative Betterness (FRB):** A transitive, asymmetric (and often incomplete) relation holding *only* between options evaluated under a *fixed evaluative frame*. A frame specifies:
          *   **Relevant Dimensions/Valuables:** Which aspects of the options matter (e.g., *only* pain intensity; *only* hue and saturation).
          *   **Scale/Granularity:** The level of discernment (e.g., pain measurable in 1-unit increments; color differences perceptible to humans).
          *   **Baseline/Comparison Class:** The implicit background for evaluation.
          FRB is transitive because comparisons occur within a stable, consistent set of rules and values. *This is the relation subject to the normative demand of transitivity.*
      *   **Transitional Betterness (TB):** The relation invoked in direct *pairwise choice*, especially between options naturally belonging to *different* frames. TB judgments focus on salient differences relevant *for that specific choice context*. TB may exhibit *apparent* intransitivity when chained across a spectrum because each pairwise judgment subtly shifts or emphasizes different aspects (i.e., implicitly uses a slightly different frame).
  Spectrum arguments work by constructing a sequence where each adjacent pair is evaluated under a highly similar (often marginally shifted) frame (FRB holds: A>B, B>C...), but comparing endpoints forces a radical frame shift, revealing a different salient aspect or making a previously minor difference decisive (hence A ≯ Z or Z > A).

  **4. Research Plan & Methodology (One Semester Scope):**
  This project will formally explore the viability and consequences of the FRB/TB distinction for resolving spectrum arguments:
      *   **Phase 1: Taxonomy & Formal Properties (3 weeks):**
          *   Systematically catalogue formal properties central to the debate: Transitivity, Asymmetry, Completeness, Acyclicity, Context-Sensitivity types (e.g., dimension shift, granularity shift, baseline shift).
          *   Analyze how existing solutions handle these properties.
      *   **Phase 2: Formalizing Frame-Relative Betterness (FRB) (4 weeks):**
          *   Develop a formal model of a frame `F = <Dimensions, Scale, Baseline>`.
          *   Define a transitive, asymmetric relation `>_F` holding between options based on evaluation strictly within `F`. Incompleteness within `F` is permitted.
          *   **Key Test:** Formalize at least one canonical spectrum case (e.g., a pain spectrum from mild A to severe Z). Show that within each local frame `F_i` (covering a small segment), `>_{F_i}` is transitive and captures adjacent comparisons. Show that comparing A and Z requires a distinct, global frame `F_G` (or no single coherent frame), where `A >_{F_G} Z` or `A` and `Z` are incomparable within `F_G`. Crucially, demonstrate that `>_{F_i}` and `>_{F_G}` are *different relations*.
      *   **Phase 3: Testing Across Domains & Action-Guidance (3 weeks):**
          *   Apply the FRB model to test cases beyond the initial example:
              *   *Population Ethics:* Spectrum from adding one barely happy life to repugnant conclusion. FRBs based on average vs. total vs. critical level utilitarianism.
              *   *Risk/Lotteries:* Spectrum shifting probabilities or outcomes slightly. FRBs defined by risk-aversion parameters or specific utility functions.
              *   *Aesthetic Value:* Spectrum of color hues or artistic styles. FRBs defined by specific aesthetic criteria sets.
          *   **Action-Guidance Test:** Investigate how TB arises for choices *across* frames. Can the model explain/predict pairwise choices between non-adjacent spectrum points? Does it avoid money-pump arguments by showing that the "pump" requires forcing choices under incoherently shifting frames?
      *   **Phase 4: The Frame Selection Challenge (3 weeks):**
          *   **Core Challenge:** Is frame selection principled or arbitrary? Investigate potential constraints:
              *   *Agent's Values/Goals:* Frames should reflect what the agent ultimately cares about.
              *   *Salience/Pragmatics:* What features are prominent in the choice context.
              *   *Minimal Shift:* When comparing options, use the most specific frame encompassing both, or the frame requiring the least change from a default.
              *   *Coherence Requirements:* Frames must permit consistent application of core principles (avoiding contradiction within the frame).
          *   **Failure Condition:** If no plausible, non-arbitrary principles for frame selection in choice contexts emerge, the distinction risks triviality. This phase is critical for assessing viability.
      *   **Phase 5: Synthesis & Conclusions (1 week):** Draft a paper synthesizing findings, stating the answer to the core question based on the investigation, and outlining implications.

  **5. Expected Outcomes & Possible Conclusions:**
      *   **Viable Distinction:** The project could demonstrate that a well-defined FRB *can* be transitive, extensionally adequate to spectrum cases (via distinct frames), and action-guiding (via TB understood as frame-specific FRB application). Principled frame selection (e.g., based on agent's core values and minimal shift) is possible. *This preserves transitivity as a core norm within rational deliberation contexts.*
      *   **Collapse:** The FRB might be shown to be nothing more than a standard, context-insensitive partial order with restricted scope, failing to genuinely explain the spectrum dynamics or TB.
      *   **Action-Guidance Failure:** FRB might be transitive within frames, but the model fails to provide adequate guidance for choices requiring frame shifts (TB), leaving "all things considered" betterness undefined or vulnerable to money pumps.
      *   **Arbitrariness:** Despite formal coherence, frame selection might prove irreducibly arbitrary or pragmatic, undermining the normative significance of FRB's transitivity.
  *Deciding Factors:* Success hinges on 1) Formally defining FRB without relying on pre-existing incomparability, 2) Showing how specific frame choices explain specific spectrum judgments, 3) Providing a non-arbitrary account of frame selection for pairwise choice (TB), and 4) Demonstrating how this avoids diachronic exploitation (money pumps) by respecting frame coherence in deliberation.

  **6. Significance & Avoiding Triviality:** This project addresses a fundamental puzzle in rational choice theory head-on. If successful, it offers a novel resolution to spectrum arguments that preserves transitivity without denying intuitive endpoint comparisons or resorting to primitive vagueness. It rigorously formalizes the intuitive idea that "it depends on how you look at it" without collapsing into subjectivism or making betterness inert. Crucially, it argues that the *standard single-relation picture is the source of the paradox* – it imposes an impossible demand of context-invariance on a concept inherently tied to our context-sensitive evaluative practices. The distinction is substantive because it reveals a structure underlying our betterness judgments that a monolithic view obscures, with concrete implications for modeling rational choice under vagueness or multi-dimensionality. Failure would provide valuable negative results, showing the limits of this approach to save transitivity and strengthening the case for more radical solutions. This focused, formal, and testable investigation is precisely scoped to yield meaningful results within a single semester.
