answer: |-
  **Exam Question: Logical Uncertainty and Coherent Credence (20 points)**  

  You are designing an idealized Bayesian agent capable of reasoning about mathematical statements (e.g., "Goldbach’s Conjecture is true"). A student argues:  
  > "Since logical truths have probability 1, a coherent agent must assign P(φ) = 1 to *all* true mathematical claims—even unproven ones. Otherwise, it violates probability axioms."  

  **(a)** Explain why this argument **fails to resolve** the problem of logical uncertainty for bounded agents. What specific contradiction arises if we demand that *all* logical truths get probability 1? (5 points)  

  **(b)** Propose a principled way to assign non-trivial credences (e.g., P(φ) = 0.7) to unproven mathematical propositions *without* requiring logical omniscience. What key constraint must your approach satisfy to maintain coherence? (5 points)  

  **(c)** Consider an agent using your approach. A gambler offers a bet on a self-referential sentence S:  
  > *S = "This agent assigns P(S) ≤ 0.5 at time t."*  

  Explain how a **naive implementation** of your approach might be exploited via S to force a sure loss (Dutch book) or self-undermining beliefs. (5 points)  

  **(d)** How does your approach in (b) **avoid this exploitation**? Argue why your solution blocks such self-referential pitfalls. (5 points)  

  ---

  **Model Answer (670 words)**  

  **(a)** The argument fails because it conflates *logical necessity* with *epistemic accessibility*. Probability axioms demand P(φ) = 1 for all logical truths, but bounded agents cannot recognize all such truths. Requiring certainty in every unproven theorem leads to a contradiction: the agent must simultaneously hold P(φ) = 1 for truths it cannot compute (violating rationality as practical feasibility) while lacking the resources to *verify* φ. For example, if φ is an undecidable statement (e.g., a Gödel sentence), the agent cannot rationally assign any probability without self-locating inconsistency—either it assigns P(φ) < 1 (undercutting a truth) or P(φ) = 1 (pretending to knowledge it lacks). This reduces Bayesianism to triviality: agents become "certain" of all mathematical facts, making learning from proof-discovery impossible.  

  **(b)** A viable solution adopts **impossible possible worlds** or **bounded verification**. Assign credences based on *proof progress*, not abstract truth. For instance:  
  - Let the agent’s credence P(φ) reflect the fraction of resource-limited proof searches that output "true" for φ (e.g., using a probabilistic proof system).  
  - Constraint: Credences must be *computably approximable* and satisfy **reflection principles** (e.g., if the agent learns a proof of φ exists, P(φ) → 1). Crucially, P(φ) ≠ 1 *until* verification completes, even if φ is actually true. This separates *logical truth* from *agent-relative certainty*.  

  **(c)** The sentence S creates a self-referential paradox. Suppose the agent naively assigns a credence P(S) at time t:  
  - **Case 1**: P(S) > 0.5. Then S is false (since S claims P(S) ≤ 0.5), so the agent overestimates a falsehood.  
  - **Case 2**: P(S) ≤ 0.5. Then S is true, but the agent assigns ≤0.5 to a truth, violating accuracy.  
  A gambler can exploit this by offering:  
  - A bet paying $1 if S is true, costing $0.4.  
  - A bet paying $1 if P(S) > 0.5, costing $0.4 (using the agent’s stated credence).  
  If P(S) > 0.5, the agent buys both bets (believing S likely false but P(S)>0.5 likely true). Net cost: $0.8. Outcome: S is false (since P(S)>0.5), so only the second bet pays $1 → net loss of $0.8. If P(S) ≤ 0.5, S is true, but the agent rejects the first bet (low credence) and may accept the second (low credence in P(S)>0.5). Either way, the agent loses by its own lights.  

  **(d)** The bounded verification fix avoids this by **restricting the domain of credence assignment**. The agent only assigns P(φ) to sentences φ that are *syntactically decoupled* from its own current belief state. Specifically:  
  - **Metalanguage barrier**: Credences are defined over an object language excluding predicates like "P(·) at t" (treated as metalanguage). S is rejected as ill-formed in the credence language.  
  - **Dynamic circumspection**: When evaluating self-referential claims, the agent uses a **hierarchical credence function** (e.g., Pₜ(S) depends on P_{t-1}(S), not Pₜ(S)). This breaks the simultaneity of S’s reference.  
  In the gambler’s scenario, the agent refuses to assign P(S) because S embeds "P(S)"—a forbidden self-prediction. Instead, it might assign P(*"S is syntactically valid"*) = 0 (treating S as malformed) or shift to a revised credence function P* at t+1 to evaluate S. This blocks Dutch books by removing the agent’s commitment to bets on its *concurrent* beliefs. No coherent credence is assigned to S, so no contradiction arises.  

  *Why this works*: Self-referential sentences like S are *fixed points* that destabilize static probability measures. By making credence *computational* and *time-indexed*, we convert a logical paradox into a tractable learning process. The agent recognizes that S’s truth depends on its output, so it defers judgment until after belief-formation (e.g., "If I output P(S)=0.4, then S is true, so I should not output that"). This aligns with reflective equilibrium—ultimately, the agent withholds credence from S, avoiding exploitation.  

  ---

  **Marking Scheme (20 points total)**  
  **A Answer (18–20):**  
  - (a) **Identifies the omniscience/feasibility contradiction** (2 pts). *Common error: Only says "agents aren’t omniscient" without explaining why axioms demand it.*  
  - (a) **Notes undecidability/computational limits** (1 pt). *Common error: Vague appeal to "bounded rationality".*  
  - (a) **Explains trivialization of learning** (2 pts).  
  - (b) **Specific mechanism** (e.g., proof searches, algorithmic prob.) (2 pts). *Common error: Proposes "non-monotonic logic" without probabilities.*  
  - (b) **Explicit constraint** (e.g., reflection, approximability) (3 pts).  
  - (c) **Full Dutch book construction** (3 pts). *Common error: Only shows contradiction, not monetary exploitation.*  
  - (d) **Syntactic restriction/hierarchy solution** (3 pts). *Common error: "The agent ignores S" without principled reason.*  
  - (d) **Explains fixed-point avoidance** (2 pts).  
  - **Flow/clarity** (2 pts).  

  **B Answer (14–17):**  
  - Correct but shallow on (a) (e.g., "Agents can’t know everything").  
  - Generic solution in (b) (e.g., "Use subjective priors").  
  - Identifies S’s paradox but no Dutch book.  
  - Fix in (d) is ad hoc (e.g., "Don’t bet on self-referential things") without metalanguage.  

  **C Answer (10–13):**  
  - Defends logical omniscience in (a).  
  - No concrete solution in (b).  
  - Misses self-reference in (c).  
  - No fix in (d).  

  **D/F (0–9):**  
  - Misstates probability axioms.  
  - Claims logical uncertainty is "irrational".
