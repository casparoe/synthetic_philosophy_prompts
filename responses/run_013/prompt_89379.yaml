  ok so im in this seminar on rational choice and uncertainty, its cross-listed with the CS department so half the room is philosophy people and half are ML people and we argue constantly. final is a 3-hour essay, closed book except one index card. a few of us are making a mock final to study off of and i got stuck writing the logical uncertainty question.

  i want it to be the kind of question you cannot answer by just saying "probabilities satisfy the axioms and logical truths get probability 1." thats exactly the move i want to trap. the core thing they should have to actually think through: if you're a good Bayesian, you're already certain of every logical truth, including ones you've never derived and maybe can't ever derive. so being genuinely unsure whether some proposition is a theorem looks like a contradiction in terms. how do you even set up an agent that has coherent degrees of belief about logical/mathematical claims it hasn't resolved yet, without it being either incoherent or trivially certain of everything?

  and then the part i think separates people who get it from people who just memorized labels: any naive fix tends to get exploited. someones going to construct a sentence that talks about what the agent will believe or bet on, and if the agent isn't careful it can be forced to take a sure loss, or its beliefs become self-undermining. so i want the question to force them to state what a fix actually has to guarantee, and to give one concrete self-referential gotcha that a naive fix fails.

  write me (1) the exam question, phrased so its clear what a strong answer has to contain without giving away the answer, (2) a model answer around 600-700 words, and (3) a marking scheme out of 20 with the specific moves an A answer makes that a B answer doesn't, and a one-liner per point on how students usually get it wrong. level is upper-division / early grad, so assume they've seen Bayes and a bit of computability but nothing about this specific problem. and please write it in american english, our prof is weird about spelling. thx!
