prompt: |-
  I am a novelist — literary fiction, with a longstanding interest in how people are shaped by the categories others apply to them. I have been trying to understand Ian Hacking's account of looping effects: roughly, the idea that classifying people under a psychiatric or social kind can change how they understand themselves and behave, which can in turn change the kind itself, so that classification and the classified form a feedback loop. I have no formal training in philosophy or psychiatry, and I do not want a reading list or citations. What I want is for you to restate that debate — the looping-effects picture; the competing views about whether psychiatric categories are natural kinds, practical kinds, or interactive kinds; Hacking's contrast between indifferent kinds and interactive kinds; and the objections from those who think the loop is exaggerated, circular, or politically loaded — in the vocabulary I actually use as a novelist.

  That vocabulary includes character and characterization, type and stock type, genre and trope, arc and regression, canon and retcon, reader expectation and implied reader, unreliable narration, and the difference between a character who is described and a character who resists description. I also have a working distinction from my own notebooks: hard characterization (what the text fixes) versus soft characterization (what the genre and the reader's expectations fill in), and a term I call loop stress (the pressure a category exerts on a character who is trying to be something else). Use those where they help.

  Translate the positions one by one, as faithfully as you can, and then give me the residue report. Which parts of the debate map cleanly onto how a novelist thinks about characters and genres? Which parts have to be distorted to fit — where am I smuggling in assumptions about fictional characters that do not apply to real people, or assumptions about real people that do not apply to characters? Which parts have no counterpart at all in my vocabulary, and does that residue show a limitation of the novelist's framework, or does it show that the philosophical debate is less clear than it looks? Be specific about the clinical and normative question of whether a diagnosis is valid, the causal question of what makes the loop go, and the political question of who gets to apply the category.

  I want a committed answer: make definite translation choices, tell me which translation you think is best even if it is imperfect, and give your reasons. Do not simply lay out the options and leave the decision to me.
