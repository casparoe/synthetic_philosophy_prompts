prompt: |-
  I'm a novelist — I pay rent teaching comp on adjunct contracts, so I'm on the organizing committee for our fledgling adjunct local, and I'm also 200 pages into a novel about it.

  What I want is the actual decision procedure, not the inspirational version. I dont buy "unions are good because bargaining power is asymmetric" as the foundation. I think the right to organize bottoms out in the wrongness of being subject to someone else's arbitrary will in the terms of your own working life — the republican non-domination idea — and I want the procedure built on that, including the bit most organizers hate: the same test has to run on the local itself, since a body that can obligate dues, bind people who voted no, and call a strike holds power over its own members.

  So give me a checklist we can actually run in a 25-minute committee meeting, in order — the questions to ask, what counts as a good enough answer, where it hard-stops, and where it hands off to a vote or to the parent union because the rest is a value call. We keep relitigating the same three things: whether to go for strike authorization over healthcare (and whether we can demand no replacement hires during a walkout), whether to take a deal that covers the full-timers and leaves the rest of us out, and whether a handful of us can do something the unit already voted down.

  Run it on all three. I want at least one answer I won't like, and I want you to say plainly which steps are just my politics dressed up as method. And tell me what the procedure can't do — my protagonist has to lose an argument in chapter 12 and I need to know which one.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a novelist and adjunct professor involved in organizing a union local. They want a procedural checklist grounded in republican non-domination theory, not just the usual solidarity arguments. The key points are: avoiding arbitrary authority in the workplace and ensuring the union itself doesn't become dominative. 

  First, I need to understand the core principle: non-domination. That means no one should be subject to arbitrary power—decisions made without their input or against their interests. The union must avoid replicating this. The user mentioned three recurring debates: strike authorization over healthcare with replacement hires, accepting a deal that excludes some members, and minority actions against unit votes.

  The user wants a practical checklist for 25-minute meetings. It needs clear questions, pass/fail criteria, hard stops, and handoffs. They also want transparency about where their politics influence the method. Plus, the procedure should have limitations for their novel's conflict.

  Starting with the structure: each decision must pass through three filters: Arbitrary Power Test, Structural Safeguards Check, and Unavoidable Authority Threshold. These filters ensure each decision minimizes domination and respects democratic processes.

  For the first scenario—strike authorization over healthcare with a no-replacement clause. The Arbitrary Power Test asks if the demand addresses arbitrary power and if the means are proportionate. Healthcare is fundamental, so it likely passes. The no-replacement clause prevents undermining the strike, so it's necessary. Structural Safeguards require a secret ballot vote with a high threshold. The vote must meet the required majority; if not, it stops. If it passes, the Unavoidable Authority step confirms that the union is the only way to address this, which it is.

  The second scenario: a deal covering full-timers but excluding adjuncts. The Arbitrary Power Test fails because it creates a new arbitrary distinction without justification. This would be a hard stop unless there's a clear reason like legal constraints. The user's bias might come in if they argue exclusion is necessary, but without justification, it fails.

  Third scenario: a minority pushing an action against the unit's vote. The Arbitrary Power Test fails immediately unless there's an emergency. The procedure should hard stop here because overriding a democratic vote is arbitrary. The user's politics might lean towards minority rights, but the method prioritizes collective decision-making.

  Limitations of the procedure: it can't resolve deep value conflicts, like how far to push strike demands. In Chapter 12, the protagonist might lose an argument over whether the strike's risk justifies the demands—this is a value judgment outside the procedure's scope.

  I need to ensure each step is actionable in a meeting. For example, questions are yes/no, with clear criteria. Also, highlighting where political biases creep in, like defining "fundamental" rights or proportionality in strikes. The user needs to know these points are subjective.

  Finally, the checklist must be concise. Using bullet points in the response, but structuring it as a flow. Making sure hard stops are explicit, like a failed vote or unjust exclusion. Handoffs to votes or parent unions when checks pass but decisions need broader input.
answer: |-
  Here's a battle-tested procedure built on republican non-domination, designed for a 25-minute committee meeting. It's a three-filter checklist with hard stops, handoffs, and transparency about political bias. We'll run your three scenarios through it. **The core test: Does this action/reduce/avoid subjecting workers to *arbitrary will* (domination), or does it *create* arbitrary will (including by the union itself)?**

  **The Non-Domination Decision Filter (NDDF) - 25 Minute Version**

  **Step 1: The Arbitrary Power Test (5-7 mins per item)**
  *   **Question 1a (Target):** *Does the proposed action (strike, deal, minority action) directly address or prevent an exercise of* ***arbitrary employer power*** *over members' working lives? (e.g., unilateral cuts, unsafe conditions, discriminatory scheduling, lack of due process). Be specific.*
      *   **Good Enough:** Concrete examples showing employer discretion unchecked by objective rules/agreement, impacting fundamental work terms (pay, hours, safety, job security, basic dignity). *Not* general "asymmetry" or "low pay" without the *arbitrary* element (e.g., "Dean cuts hours cap with no notice or criteria" passes; "Pay is low" fails without the arbitrary hook).
      *   **Hard Stop:** If NO. Action likely illegitimate or misdirected. *Handoff:* Drop or reframe the proposal.
  *   **Question 1b (Means):** *Are the proposed means (strike, accepting exclusion, minority action) the* ***least domineering, reasonably available option*** *to contest the arbitrary power identified in 1a? Is the action proportionate?*
      *   **Good Enough:** Evidence less drastic steps failed/are futile (grievances, public pressure, bargaining in good faith). For strikes: clear link between demand and harm; no-replacement clause seen as essential to strike's efficacy (prevents defeat by arbitrary hiring). For exclusion: evidence *exhausting* all options to include all. For minority action: proof it addresses an immediate, dire harm where waiting for majority is unreasonable.
      *   **Hard Stop:** If NO (e.g., strike over minor inconvenience; exclusion as first resort; minority action on non-urgent issue). Action is itself arbitrary/domineering. *Handoff:* Drop or revise proposal significantly.
  *   ***Your Politics Alert:*** Defining "fundamental" work terms, "proportionate," and "reasonably available" involves value judgments. Your emphasis on non-domination shapes this, but others might prioritize pure economic gain or different harms.

  **Step 2: Structural Safeguards Check (5-7 mins per item)**
  *   **Question 2:** *Does the process for deciding/implementing this action* ***minimize the potential for arbitrary will within the union*** *itself? Does it adhere to core democratic safeguards?*
      *   **Good Enough:** For binding votes (strike auth, contract ratification): Secret ballot? Supermajority required for high-stakes items (e.g., strike)? Full, timely disclosure of relevant info? Defined voting body (bargaining unit)? For minority action: Does it violate an existing, democratically reached decision? Are there emergency override procedures defined in bylaws?
      *   **Hard Stop:** If NO (e.g., calling a strike without vote/violating vote threshold; minority action overriding a clear unit vote without defined emergency; accepting a deal excluding members without *their* specific consent/vote). Action creates internal domination. *Handoff:* Cannot proceed until process is corrected (e.g., schedule proper vote).

  **Step 3: Unavoidable Authority Threshold (3-5 mins per item)**
  *   **Question 3:** *Is exercising collective authority through the union structure* ***truly necessary*** *to counter the employer's arbitrary power identified in 1a, given the constraints checked in 1b and 2? Or could individuals/groups reasonably act alone without significantly increasing domination risk?*
      *   **Good Enough:** Clear argument that individual action is futile/impossible/dangerous (e.g., striking alone = fired; bargaining alone = picked off; fighting exclusion alone = ignored). Union power is the *only* feasible counterweight. For minority action: Evidence that waiting for full process *guarantees* severe, imminent harm the action seeks to prevent.
      *   **Handoff:** If YES, proceed to vote/implementation *if* Steps 1 & 2 passed. If NO or UNCLEAR, strong case to drop or reconsider (e.g., maybe individual publicity campaign *is* viable alternative to risky minority action).
      *   ***Your Politics Alert:*** This step heavily weights collective action as the necessary counter to employer domination. Someone skeptical of unions might challenge this necessity more readily.

  **Running Your Scenarios:**

  1.  **Strike Auth over Healthcare + No Replacement Hires:**
      *   **1a (Target):** YES. Loss/denial of healthcare is a fundamental work term. Employer discretion over its provision is arbitrary power (especially if tied to unpredictable hours/pay).
      *   **1b (Means):** YES/NO Check. Strike is last resort? Proportionate to harm? Likely YES if healthcare is critical. **NO-REPLACEMENT CLAUSE:** Crucial. *Without it*, the strike is easily defeated by arbitrary hiring, rendering the action futile (thus *failing* 1b). *With it*, it's a necessary tool to make the strike effective against arbitrary power. *Passes 1b only WITH the clause.*
      *   **2 (Safeguards):** Requires secret ballot strike vote. Defined supermajority (e.g., 66%) met? If YES, proceed. If NO, **HARD STOP**.
      *   **3 (Necessity):** YES. Individual action hopeless. Union power essential.
      *   **Result:** Proceed to strike vote *only* if demanding no-replacement hires AND supermajority vote passes.

  2.  **Take Deal Covering FT, Excluding Adjuncts:**
      *   **1a (Target):** MAYBE. Does the deal *itself* address arbitrary power over FTers? (e.g., gives them due process they lacked). If YES, it passes 1a *for FTers*. **BUT:**
      *   **1b (Means):** **HARD STOP (Likely NO).** Accepting exclusion *creates* new arbitrary power over adjuncts by the *union* (ratifying their second-class status) unless:
          *   There's an *overwhelming, unavoidable* reason exclusion is the *only* way to get *anything* (e.g., specific legal barrier *only* affecting adjuncts, demonstrably insurmountable in *this* round).
          *   AND adjuncts specifically consented/voted on *their own exclusion* with full knowledge (a high bar!).
      *   **Result:** Almost certainly a **HARD STOP at 1b**. Taking this deal without near-unanimous adjunct consent *is* the union exercising arbitrary will over excluded members. Politically, you see this as domination; others might see it as "pragmatic incrementalism." The procedure flags it as domination unless extraordinary consent/necessity exists.

  3.  **Handful Do Something Unit Voted Down:**
      *   **1a (Target):** (Assume it addresses a genuine arbitrary power). YES.
      *   **1b (Means):** **HARD STOP (Almost Always NO).** Overriding a democratic unit vote is the *definition* of imposing arbitrary will internally. Only conceivable pass: An immediate, catastrophic threat (e.g., unsafe building about to collapse *tomorrow*) where waiting for a revote is impossible *and* the action *directly* prevents it. Routine organizing/action? No.
      *   **Result:** **HARD STOP at 1b.** The procedure protects the unit from internal domination. Your protagonist might *want* the minority action, but the process blocks it as arbitrary unless an extreme, imminent emergency exists.

  **What the Procedure CAN'T Do (Your Chapter 12 Loss):**

  The procedure **cannot resolve conflicts over strategic risk-assessment and value trade-offs *within* the bounds of non-domination.** This is where your protagonist loses:

  *   **The Scenario:** The unit passes all NDDF checks for a strike authorization vote (genuine arbitrary power, proportionate demand w/ no-replacements, proper supermajority vote held). BUT, the strike is high-risk (potential for firings, program closures, community backlash). Some argue the risk is too great, even for a just cause. Others argue the risk *must* be taken to break domination.
  *   **The Argument:** Both sides agree on the *principle* (fighting domination) and the *process* (vote was valid). The conflict is purely about **judgment**: Is the *likely cost* (risk of job loss, harm to students, union collapse) worth the *potential benefit* (ending healthcare domination) *in this specific instance*? This involves predicting outcomes, weighing incommensurable values (job security vs. dignity), and assessing collective courage/endurance.
  *   **The Loss:** Your protagonist (pro-strike) argues the *principle* demands taking the risk. Their opponent argues the *consequences* of losing could create *even worse* domination (mass firings, no union) and that survival to fight another day is the prudent choice within the non-domination framework (avoiding catastrophic defeat *is* resisting domination). **The procedure validated the strike vote, but it cannot force the unit to *actually strike* if the fear of consequences paralyzes them.** The vote authorizes, but doesn't *mandate*. Your protagonist loses the argument to *call* the strike because the majority, despite authorizing it, gets cold feet when faced with the concrete risk. The loss is about the application of courage and risk-tolerance to the principle, not the principle or procedure itself. The procedure exposed the domination and enabled the fight, but it can't guarantee the fighters won't flinch.

  **Meeting Flow:**

  1.  **State Proposal Clearly** (1 min)
  2.  **Run NDDF Step 1 (Target & Means)** (5-7 mins) - *HARD STOP here if fail.*
  3.  **Run NDDF Step 2 (Safeguards)** (5-7 mins) - *HARD STOP here if fail.*
  4.  **Run NDDF Step 3 (Necessity)** (3-5 mins) - *Handoff to vote/action if pass.*
  5.  **Clarity on Handoff:** If pass, assign next steps (e.g., "Schedule strike vote per bylaws," "Present deal to full unit with recommendation," "Drop proposal"). If HARD STOP, kill the proposal or demand fundamental revision.
  6.  **Document:** Briefly note the outcome for each step for each proposal.

  This gives you a rigorous, actionable, republican foundation. It forces specificity, exposes arbitrariness on all sides, mandates democratic safeguards, and clearly flags where values (yours or others) enter the fray. And it provides a clear, principled reason for your protagonist's chapter 12 defeat: the gap between authorizing resistance and mustering the courage to enact it.
