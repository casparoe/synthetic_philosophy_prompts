prompt: |-
  I'm a novelist, and I need a case built to order for the moral crux of my next book. The subject is commemoration, and the scenario must be designed so that three accounts of what to do with a contested public monument come apart cleanly. On an endorsement account, on which a public monument is the state's continuing assertion that its subject was worthy of honor, the verdict must be removal. On a reparative account, on which what matters is the monument's present effect on the people who live with it, the verdict must be retention — this is the harder direction for that account, and I want the case to earn it rather than stipulate it. On a historical-record account the case must come out genuinely neutral: the record has to survive either way, so that this account cannot quietly settle the question. The facts about the honoree's misdeeds are stipulated and uncontested, so no verdict may turn on historical uncertainty, and the retention verdict may not rest on any residual sympathy for the honoree or on an obviously bad rule about property, donors, or procedure; it must fall out of a principle an ordinary reasonable person would accept in general. Keep it realistic and small: one town, one object, no national politics, no exotic devices, under 400 words, and not a Confederate general, since that case is worn smooth. Then, for each account, state the verdict and the premise doing the work; name the single feature of the case that makes the endorsement and reparative accounts diverge, and say what becomes of the case if that feature is removed; and finally tell me how a committed endorsement theorist would try to defuse the case, and whether the disanalogy they would point to is real or ad hoc. The point is to test whether my ending follows from a view or is only a contrivance.
reasoning: |-
  Hmm, the user is a novelist looking for a scenario involving a contested public monument that cleanly separates three moral accounts: endorsement, reparative, and historical-record. They need it to be realistic, small-scale (one town, one object), not involving Confederate generals, and under 400 words.

  The key requirements are:
  - Endorsement account must demand removal (monument as state's ongoing honor)
  - Reparative account must require retention despite the honoree's flaws (focus on present community effects)
  - Historical-record account must be genuinely neutral (record preserved either way)
  - Facts about the honoree's misdeeds are undisputed
  - Retention can't rely on sympathy or bad procedural rules
  - Must identify the feature that causes divergence between endorsement and reparative views
  - Show how removing that feature changes outcomes
  - Explain how an endorsement theorist would counter the case

  The case needs to make retention defensible on reparative grounds without being contrived. The honoree's actions should be unquestionably vile but not widely known, creating a tension between official endorsement and actual community perception. The monument's physical integration into daily life could make removal disruptive while retention causes no active harm - satisfying the reparative requirement.

  For the historical-record neutrality, the solution is having identical interpretive plaques whether the statue stays or goes. This makes historical documentation independent of the physical object's fate.

  The pivotal feature is the monument's obscurity: it's physically absorbed into the environment and its meaning forgotten. This allows endorsement theory (focused on symbolic state speech) and reparative theory (focused on lived experience) to diverge. Remove the obscurity, and both would likely demand removal.

  An endorsement theorist would argue the plaque doesn't negate the state's endorsement inherent in maintaining the statue. But this feels ad hoc because the plaque explicitly contradicts the honor, creating a new compound statement rather than pure endorsement.

  This structure creates organic tension: the town faces a real choice where no option is obviously correct, making each philosophical position lead to different practical outcomes without forcing the conclusion.
