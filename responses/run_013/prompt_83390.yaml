answer: |-
  ## The Infinite Horizon Toast

  **(Clink glass gently. Warm smile.)**

  Hello everyone. For those who don’t know me, I’m [Your Name], the incredibly proud and slightly nervous brother of our radiant bride, [Sister's Name]. And standing beside her is [Fiancé's Name], who, I’m happy to report, has finally stopped trying to calculate the optimal path to the buffet table. Mostly.

  Now, many of you know the story of how these two met. But for the benefit of our wonderful aunts, uncles, cousins – and anyone who hasn’t yet heard [Fiancé's Name] passionately defend his life choices from eight years ago – let me paint the picture.

  **[Lean in conspiratorially]**

  They were in a graduate seminar. On Evolutionary Game Theory. Sounds intense, right? Well, for the first two weeks, the professor had them play a tournament… of the Prisoner’s Dilemma. *(Pause for the academics' knowing nods, then turn to the other half)* Okay, quick crash course for the non-game theorists: Imagine you and a partner are arrested. You can’t talk. The cops offer you both a deal: If you rat out your partner (*gesture "defect"*) and they stay silent (*gesture "cooperate"*), you walk free and they get a long sentence. If you *both* stay silent, you both get a *small* sentence. If you *both* rat each other out, you *both* get a *medium* sentence. The *temptation* is to betray your partner to save yourself… but if you *both* do that, you both lose badly. The *best* mutual outcome is actually cooperating and trusting each other.

  Got it? Good. Now, picture this tournament: round after round, [Sister's Name] and [Fiancé's Name], paired against each other, figuring each other out. And then… the professor announces the *final round*. The *last* interaction they’d ever have in this context. No more games. Done.

  **[Turn to Groom, playful accusation]**

  And what did you do, [Fiancé's Name]? In that final, decisive round? You DEFECTED! You took the tempting short-term win! *(Laughter)* And to this day, the family debate rages! [Fiancé's Name] insists, with the calm logic of a true strategist, that he was simply applying “backward induction” – rationally concluding that since it was the *last* round, cooperation couldn't be rewarded *later*, so why not take the win? *(Nod knowingly at academics)*. [Sister's Name], however, maintains a simpler, perhaps more human, theory: he panics under pressure! *(More laughter, point at Sister affectionately)*. Both versions are now legendary in our household.

  But here’s the beautiful thing, the point where this little academic exercise stops being a game and starts being a blueprint for something real. That tournament? It had a known end date. A final round. And in a game with a *known end*, the logic of self-interest can unravel cooperation right back to the start. Why cooperate in the second-to-last round if you know they’ll defect in the last? And so on… backward induction. It makes cold, mathematical sense for a finite game.

  **[Shift tone, warmer, more profound]**

  But life, especially the life you two are starting today, isn’t like that seminar tournament. There’s no professor announcing “Okay folks, Round 57, this is it! Final interaction!” Marriage isn’t a game with a known, finite number of rounds. It’s an *infinite horizon*. An indefinite, open-ended series of interactions, day after day, year after year. And *that* changes everything.

  Suddenly, the rational calculus shifts. The temptation to defect – to take the easy way out, to prioritize your immediate self-interest in a moment of frustration or fatigue – is still there. But now, there’s a powerful counter-force: the shadow of the future. Because your actions *today* signal your intentions *tomorrow*. Trust becomes an investment. Cooperation becomes the *only* strategy that builds something lasting and beautiful. Why? Because you both know you’ll be facing each other again… and again… and again. The reward isn’t winning a single round; it’s building a lifetime of mutual gain.

  **[Acknowledge the complexity]**

  Of course, it’s not always that clean. Life isn’t a lab. Signals get noisy! Maybe [Sister's Name] asks [Fiancé's Name] to pick up milk, he genuinely forgets, and she perceives it as a defection – a lack of care! Or maybe he makes a decision thinking it’s cooperative, but she sees it as purely self-serving. Noise happens. Misunderstandings are inevitable.

  And if you respond to every perceived slight, every possible defection, with immediate and strict punishment? Tit for tat? Well, that noise can spiral. One misunderstanding leads to retaliation, leads to counter-retaliation… and suddenly, you’re both locked in mutual punishment, forgetting why you started cooperating in the first place. *(Nod knowingly at the couple, perhaps referencing a minor, well-known disagreement they laugh about now)*.

  That’s why the most successful strategies in the long run – in evolution and in love – build in a little generosity. A little forgiveness. A willingness to assume good intent, to overlook the occasional missed signal, to cooperate even when the other might not have *earned* it in that precise moment. It’s the grease that keeps the cooperative engine running smoothly through the inevitable noise of life.

  **[Shift to the couple's character]**

  And this, everyone, is where [Sister's Name] and [Fiancé's Name] truly shine. It’s not just about how they treat *each other* – though the way they support each other's dreams, celebrate each other's wins, and navigate challenges with such teamwork is truly inspiring. It’s about how they move through the world.

  You see, there’s another powerful force in cooperation called indirect reciprocity. It’s the idea that people cooperate with those who have a *reputation* for cooperating. Why? Because even if *I* don’t directly benefit from helping *you*, I know that others see it. They see that I’m trustworthy, that I contribute, and they’re more likely to cooperate with *me* in the future. It builds a network of trust.

  **[Look around the room]**

  Ask anyone here who knows [Sister's Name] and [Fiancé's Name]. Go ahead, ask them! *(Gesture invitingly)*. They’ll tell you: these two have that reputation. They show up. They help. They listen. They contribute to their communities, their fields, their friendships. They are known cooperators. People see their kindness, their integrity, their willingness to build others up. That reputation precedes them. It’s woven into who they are, individually and now, together.

  **[Address the couple directly]**

  So, [Sister's Name] and [Fiancé's Name], from that chaotic grad seminar to this beautiful day, your journey beautifully illustrates the evolution of cooperation. You moved from a finite game where defection made cold sense, into the infinite, glorious game of building a life together.

  You understand that the unknown horizon makes trust and cooperation the wisest, most rewarding strategy. You’ve learned to navigate the noise with generosity and forgiveness. And you’ve built a reputation for kindness that enriches everyone around you.

  **[The light evolutionary nod]**

  Now, as your brother, and as someone who loves you both, I have to say this: evolutionary theory tells us successful strategies are those with the highest *payoffs* – the ones that survive and thrive. Not necessarily the ones with the purest intentions. *(Wink, slightly cheeky)*. But looking at you two today – the love, the partnership, the incredible network of support surrounding you – the payoff is abundantly clear. Your strategy is *thriving*.

  **[Raise glass]**

  So let’s toast to the ultimate indefinite game! To infinite horizons, generous interpretations, and a reputation built on unwavering cooperation and love. To embracing the long run, together. May your future payoffs be immeasurable, and your cooperation evolve beautifully for all the rounds to come.

  To [Sister's Name] and [Fiancé's Name]!

  **(Everyone: "To [Sister's Name] and [Fiancé's Name]!")**
