prompt: |-
  Ok, longtime lurker here (mostly LW, some of the other rat-adjacent blogs, the comment sections I should probably stop reading). Epistemic status: vibes plus having watched this one fight for three years. I want help with a writeup.

  There's a dispute in phil of value that I keep seeing relaunched, and I'm fairly convinced that at least a chunk of it is people talking past each other. What I want is the advesarial-collaboration document the two camps should have produced instead of the forty blog posts and the three reply papers.

  Camp 1 — the fitting-attitude people. Their line: value gets analysed in terms of fitting attitudes. For something to be good/valuable is, roughly, for it to be the sort of thing there are reasons to favour, where favouring covers desire, admiration, approval, preference, and friends. They think this is a genuine analysis — it tells you what value is, in terms of stuff (reasons, attitudes) that's supposedly more basic, and that's meant to be real progress over taking value as primitive.

  Camp 2 — the wrong-kind-of-reasons people. Their flagship case is the demon: a demon threatens to destroy the world unless you admire him. Plausibly you now have a reason to admire him, since your getting into the admiring state is what saves the world. But this plainly doesn't make him admirable, or valuable, or good. If the fitting-attitude analysis were right, the existence of a reason to favour him should make him valuable, and it doesn't — overgeneration. And the standard patch, restricting the analysis to reasons of the right kind (reasons that bear on the object rather than on your having the attitude), either (a) is circular, because the way you're told to sort the reasons is by asking which ones make the attitude fitting or speak in favour of the object, which is precisely what the analysis was supposed to explain; or (b) smuggles value/fittingness in as a primitive, in which case it isn't an analysis at all, just a biconditional that happens to hold. So: at best a necessary truth about value, not a reduction of it.

  I think both camps are right about something and I want it in one document. My guess at the cruxes, though don't just take my list:

  - can "object-given" / "the right kind" be spelled out without using normative vocabulary — and if not, does that kill the analysis or just mean it's a seperate kind of claim (a necessary truth, a mark of the concept, whatever)?
  - does the problem generalise? If you can run the same demon trick against fitting-attitude analyses of rightness, blameworthiness, epistemic justification, beauty, etc., is that evidence the framework is broken or evidence the phenomenon was never really about value?
  - are wrong-kind reasons reasons at all? Or is "reason" doing two jobs — a consideration bearing on whether the object is F, versus a consideration bearing on whether to have the attitude — in which case part of the fight is verbal and somebody should just say so?
  - how much weight should the demon intuition carry, given that it's a verdict about the very phenomenon under dispute?

  Deliverable: the joint statement, written so a card-carrying member of each camp could sign it without wincing. Don't give me a bibliography or a bunch of "see so-and-so (2011)" — I know the literature, I want the substance, not the map. Structure it like this:

  1. "Shared ground" — six to eight numbered claims both camps accept, including about the demon case itself and about what the disagreement is not about. ~250 words.
  2. "The disagreement, in each side's own words" — one paragraph in Camp 1's voice, one in Camp 2's, each phrased so that side would actually put its name to it. ~150 words each.
  3. "Cruxes" — three or four, each a neutral statement of the sub-question plus why settling it would move somebody. ~80 words each.
  4. "Tests" — a table with columns: case or argument | Camp 1's prediction | Camp 2's prediction | what would count as a win for each. Include the demon, at least one case from outside the value case (something about reasons for belief or for intention — the toxin thing, a belief pill, whatever actually works), and at least one case built to test whether the restriction can be stated without circularity. ~400 words.
  5. "Verbal or genuine?" — which bits of the fight, if any, are about words, and what you'd have to say to dissolve them. ~150 words.
  6. "What neither side will sign" — the residual, stated plainly. ~100 words.

  If the honest answer at some point is that the camps only look like they disagree because they're answering different questions, say that in section 5 rather than fudging section 2.
reasoning: |-
  Hmm, the user is asking for a structured joint statement between two philosophical camps: the fitting-attitude analysts (Camp 1) and the wrong-kind-of-reasons critics (Camp 2). They're a longtime lurker in rationalist blogs and want this dispute synthesized into a single document with specific sections. 

  First, I need to unpack their request. They're frustrated with how this debate keeps relaunching across blogs and papers without resolution, suspecting much is talking past each other. The core tension: Camp 1 says value is analyzable as reasons for pro-attitudes (admiration, desire etc.), while Camp 2 counters that this overgenerates because of cases like the demon—you have reason to admire to save the world, but that doesn't make the demon admirable. 

  The user's crux list shows they've done homework: circularity risks in defining "right kind" of reasons, generalizability to other domains (blame, belief), whether "reasons" are ambiguous, and how much weight to give the demon intuition. They want neutrality—no bibliography, just substance—and a format forcing both sides to co-sign. 

  For the structure: Shared ground must capture basic agreements without controversy. Key points both accept: the demon case exists, reasons are normative, attitudes vary by context. Disagreement sections need authentic voices—Camp 1 emphasizing explanatory power, Camp 2 stressing reduction failure. Cruxes should be framed as decision points: e.g., if "object-given" can be defined non-normatively, Camp 1 wins; if not, Camp 2 gains ground. 

  The test table is critical. Beyond the demon, I'll include the toxin puzzle (intention) and belief pill (epistemics) to test generalizability. For circularity, a case like "admire the incompetent artist for inheritance" could probe if "merit-based" smuggles in value. 

  Verbal disputes section might resolve "reasons" ambiguity—if both sides concede the term is overloaded, some heat dissipates. The residual in "What neither side will sign" will be the core metaphysical rift: whether normativity is unified or fractured. 

  User's tone suggests impatience with rehashed debates, so I'll avoid jargon and keep explanations crisp. They want this as a tool, not another entry in the literature. Biggest risk is bias—I'll mentally audit each section asking "would Camp 1/2 actually sign this?" Especially in the disagreement paragraphs, I'll channel their idioms: Camp 1 might say "illuminating reduction," Camp 2 "smuggles in the analysandum." 

  Final output should feel like a peace treaty drafted by a grudgingly fair mediator. If done right, both camps might hate parts but recognize their position.
answer: |-
  Here is the joint statement structured as requested, focusing on substance over citation and aiming for neutrality both camps could endorse:

  ---

  ### 1. Shared Ground  
  Both camps agree:  
  (1) Normative properties (e.g., value, fittingness) are distinct from non-normative ones.  
  (2) Reasons for attitudes (e.g., admiration, desire) exist and are central to normativity.  
  (3) The demon case (reasons to admire to prevent catastrophe) generates *prima facie* tension for fitting-attitude (FA) analyses.  
  (4) "Favoring" includes pro-attitudes like admiration, desire, or approval, contextually appropriate to the object.  
  (5) A successful *reductive* analysis of value must avoid circularity (no sneaking in "value" or "fittingness" in the *analysans*).  
  (6) The dispute is not about whether reasons *ever* track value, but whether FA provides a *metaphysically reductive account*.  
  (7) Intuitions about cases (like the demon) are legitimate data, but not indefeasible.  
  (8) The "wrong kind of reasons" (WKR) problem generalizes to other FA targets (e.g., blame, belief).  

  ---

  ### 2. The Disagreement, in Each Side’s Own Words  
  **Camp 1 (FA Reductionists):**  
  "Value is constitutively explained by reasons for pro-attitudes. The demon shows we need a restriction: only reasons bearing on the *object’s features* (the ‘right kind’) make something valuable. This restriction is non-circular—it can be spelled out via descriptive criteria (e.g., the reason must cite properties *of the object*). The analysis succeeds because it reduces value to more fundamental normative components (reasons + attitudes), demystifying normativity."  

  **Camp 2 (WKR Critics):**  
  "FA analyses fail as reductions. The demon proves that reasons to *have* an attitude don’t always make the attitude *fitting*. Restricting to ‘object-given’ reasons either (a) implicitly relies on prior notions of value/fittingness (circularity), or (b) abandons reduction by taking ‘object-givenness’ as primitive. At best, FA offers a true biconditional (valuable iff reasons to favor), not a reductive account. Value remains irreducible."  

  ---

  ### 3. Cruxes  
  **(1) Non-normative restriction:** Can "object-given reasons" be defined using only non-normative/descriptive terms (e.g., "cites properties of the object")? If yes, FA reduction survives. If no, WKR critics win on circularity.  
  **(2) Generalizability:** If WKR problems arise identically for FA analyses of *non*-evaluative concepts (e.g., "blameworthy" or "justified belief"), does this undermine FA broadly or highlight a flaw specific to value? FA defenders must explain why value is special.  
  **(3) Demon’s weight:** Are demon cases *decisive* counterexamples, or can they be explained away (e.g., as conflating *reasons to bring about an attitude* with *reasons for the attitude itself*)? Settling this tests FA’s resilience.  

  ---

  ### 4. Tests  
  | Case/Argument               | Camp 1 Prediction                          | Camp 2 Prediction                          | Win Condition                               |  
  |-----------------------------|--------------------------------------------|--------------------------------------------|---------------------------------------------|  
  | **Demon case**              | RKR restriction blocks overgeneration; demon isn’t admirable. | Restriction fails; FA implies absurdly that demon is admirable. | If demon’s non-admirability is preserved *without* circularity. |  
  | **Toxin puzzle** (reasons to *intend* to drink toxin for $1M, but no reason to drink): | Reasons to intend are state-given (WKR); drinking needn’t be valuable. | "Fitting intention" can’t be reduced to reasons without circularity. | If FA analysis of "rational intention" avoids implying toxin-drinking is valuable. |  
  | **Belief pill** (reason to believe *P* to get $1M): | Restriction: epistemic reasons are object-given (evidence-based); pill is WKR. | "Object-given" for belief relies on prior notion of *truth* (non-reductive). | If "epistemic reason" can be defined without "truth" or "justification". |  
  | **Inheritance case** (reason to admire a bad artist to inherit fortune): | Admiration isn’t fitting; reason is state-given (consequences of admiring). | Calling this "state-given" implicitly assumes admiration *should* track merit (circular). | If "object-given" is definable without "merit" or "admirable". |  

  ---

  ### 5. Verbal or Genuine?  
  The dispute is **substantive** about whether normativity can be reduced. However, **"reason" ambiguity** causes talking-past: Camp 1 uses "reason" broadly (any consideration counting in favor); Camp 2 distinguishes *attitude-justifying* vs. *property-indicating* considerations. Dissolution: Agree that "reason" in FA must mean "consideration that *makes the attitude fitting*," not "consideration that *makes having it prudent*." This clarifies but doesn’t resolve the core circularity worry.  

  ---

  ### 6. What Neither Side Will Sign  
  **"Value is analytically primitive and irreducible.** FA captures a conceptual truth but fails as reduction. The "right kind" of reasons are those that *correspond to actual value*, making FA explanatorily backward. Normative properties cannot be fully analyzed in non-normative terms."  

  --- 

  This structure isolates:  
  - Agreement on setup and data (Sec 1).  
  - Core disagreement in neutral terms (Sec 2).  
  - Testable empirical/metaphysical cruxes (Sec 3–4).  
  - Where semantics muddy the waters (Sec 5).  
  - The irreconcilable residual: reductionism vs. primitivism (Sec 6).
