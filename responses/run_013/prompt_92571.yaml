  The user's explicit request is for a Q&A prep sheet tailored to these specific audience members. But reading between the lines, they're likely feeling anxious about defending an unconventional view against established scholars. There's vulnerability in admitting the probability aspect isn't fully worked out. Their deeper needs probably include: validation of their framework's coherence, strategies to avoid being cornered on unfinished parts, and maintaining credibility when challenging giants like Stalnaker.

  For the prep sheet structure, I'll prioritize objections by damage potential: the Stalnaker/Lewis camp first since their critique could undermine the core premise, then Kratzer (whose objection might be easier to reframe as alignment), then probability experts (where the gap exists), and finally the material conditional advocate (whose arguments are well-rehearsed). The "question hoping nobody asks" should address the exact point they feel weakest about - likely how probability interacts with modal distance at the indicative end.

