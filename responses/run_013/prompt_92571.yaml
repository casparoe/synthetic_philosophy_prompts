answer: |-
  Here’s a targeted Q&A prep sheet for your presentation, ordered by potential damage level (high to medium), with audience-specific objections, replies, and soft spots flagged. The "hoped-nobody-asks" question is at the end.

  ---

  ### **Q&A Prep Sheet: Indicative/Counterfactual Continuum Thesis**

  #### **1. Objection: The Hardcore Stalnaker/Lewis Similarity Theorist**  
  **Likely Phrasing:**  
  *"You’re ignoring a fundamental architectural difference. Stalnaker/Lewis solved the Oswald/Kennedy asymmetry by positing distinct constraints: indicatives require an *epistemically accessible* antecedent (no ‘closest world’ where A is true is ¬A), while counterfactuals don’t. Your ‘distance’ metric collapses this, making indicatives vulnerable to absurd counterfactual-like readings (e.g., ‘If Biden is a lizard, inflation is high’ becomes assertable)."*  
  **Damage Level:** 🔥🔥🔥 (Strikes at core empirical adequacy)  
  **2-Minute Reply:**  
  "My model *preserves* the asymmetry via modal distance. For indicatives, the ordering source prioritizes worlds minimally diverging from *known* actuality (e.g., no Biden-is-lizard worlds are ‘close’). For counterfactuals, we permit larger divergences. Crucially, this is graded: ‘If Oswald didn’t shoot…’ assumes minimal deviation (consistent with knowledge), while ‘If Oswald hadn’t…’ allows worlds where history radically differs. No ambiguity needed—just one ordering source calibrated by context."  
  **Soft Spot:**  
  ➠ *Your reply leans on contextual calibration of "minimal divergence," which Stalnaker/Lewis formalize via separate accessibility relations. You need clearer constraints on how "knowledge" shapes distance to avoid ad hoc-ness.*

  #### **2. Objection: The Experimentalist (Probability/Triviality)**  
  **Likely Phrasing:**  
  *"If indicatives are just the ‘near-actual’ end of a scale, how do you avoid Lewis’s triviality results? Probabilities of conditionals can’t be conditional probabilities without collapsing to 1. But people *do* assign P(if A, B) ≈ P(B|A) for indicatives. Your continuum must either violate triviality or fail empirically."*  
  **Damage Level:** 🔥🔥🔥 (Exposes a known gap in your framework)  
  **2-Minute Reply:**  
  "Lewis’s result assumes conditionals express propositions. On my account, *only* the near-actual (indicative) end behaves probabilistically, as it’s evaluated against a realistic modal base. Counterfactuals involve unrealized possibilities and aren’t probability-conditioned. For indicatives, I adopt a restricted Adams-style thesis: P(if A, B) = P(B|A) *when A is epistemically possible*. This avoids triviality by limiting the domain."  
  **Soft Spot & Gap Warning ⚠️:**  
  ➠ **You admitted this is underdeveloped.** *Your reply implicitly restricts the probability story to indicatives, but "epistemic possibility" isn’t yet integrated with modal distance. The experimentalist will push: "How does ‘distance’ quantitatively map to probability judgments?" Pre-empt by saying: "The probability interface is ongoing work, but crucially, the continuum *predicts* that as modal distance increases, P(if A, B) deviates from P(B|A) — which aligns with existing data on counterfactuals."*

  #### **3. Objection: The Kratzerian**  
  **Likely Phrasing:**  
  *"This is just Kratzer with extra steps. You’ve renamed ‘modal base’ as ‘distance from actuality’ and ‘ordering source’ as ‘similarity’. The indicative/counterfactual split *is* whether the modal base includes the actual world (indicatives) or not (counterfactuals). Calling it a ‘continuum’ doesn’t add explanatory power."*  
  **Damage Level:** 🔥🔥 (Challenges novelty/necessity)  
  **2-Minute Reply:**  
  "Kratzer’s binary ‘modal base inclusion’ is the *effect*, not the cause. In my model, whether actuality is ‘included’ depends on contextual tolerance for divergence. ‘Continuum’ explains *why* some antecedents (e.g., ‘If it rains tomorrow…’) feel indicative even if false: their modal distance is small. Crucially, it also explains gradient phenomena like ‘semi-counterfactuals’ (e.g., ‘If Putin hadn’t invaded…’ vs. ‘If dinosaurs hadn’t gone extinct…’). Kratzer’s apparatus can’t capture that variation without stipulation."  
  **Soft Spot:**  
  ➠ *Kratzer’s framework *can* model gradience via ordering sources. Stress that your approach eliminates the need for two distinct modal logic frameworks by deriving the split from one parameter.*

  #### **4. Objection: The Old-School Material Conditional Advocate**  
  **Likely Phrasing:**  
  *"Why complicate things? All conditionals are material. ‘If A, B’ is true iff ¬A or B. Your Oswald examples are just cases where the antecedent’s falsity makes the conditional vacuously true for indicatives (‘no shooter → someone else did’) but pragmatically weird for counterfactuals."*  
  **Damage Level:** 🔥 (Easy to rebut, but wastes time)  
  **2-Minute Reply:**  
  "The material conditional fails known entailments: (1) It predicts ‘If A, B’ and ‘If A, ¬B’ can both be true when A is false, but we reject ‘If Oswald didn’t shoot, someone else did AND no one else did’. (2) It validates antecedent strengthening, but ‘If I strike this match, it will light’ doesn’t entail ‘If I strike this match underwater, it will light’. My account explains both: modal distance constrains relevant worlds, blocking vacuous truth and invalid inferences."  
  **Soft Spot:**  
  ➠ *None—this objection is weak, but engage politely to avoid seeming dismissive.*

  ---

  ### **The Question You Hope Nobody Asks**  
  **Likely Asker:** The Experimentalist or Stalnaker/Lewis Theorist  
  **Question:**  
  *"You claim properties like antecedent strengthening fail gradiently along the continuum. Give us a *formal criterion* for when, say, strengthening becomes invalid. If ‘distance’ is context-dependent, how do you prevent the theory from being unfalsifiable?"*  
  **Why It’s Dangerous:**  
  It targets the most ambitious (and least formalized) part of your thesis. You lack a metric for "distance" or thresholds for when inferences break.  
  **Damage Control Reply:**  
  "Context sets a threshold for ‘relevantly close’ worlds. Strengthening fails when the added antecedent (e.g., ‘underwater’) pushes the scenario beyond that threshold. I’m developing a heuristic: if the new antecedent *preserves the causal/intentional structure* of the original scenario, strengthening holds; if it changes that structure (e.g., adding ‘underwater’ breaks the match-lighting mechanism), it fails. This is empirically testable via vignette studies."  
  **Soft Spot:**  
  ➠ *This is hand-wavy. "Causal structure" isn’t defined, and your heuristic risks circularity. Admit: "This is provisional—a full formalization is in progress, but the gradient data (e.g., Cummins on conditional inference) supports the intuition."*

  ---

  ### **Strategic Pre-Emption**  
  - **Open with:** *"A key gap: the probability story for the indicative endpoint needs refinement. Today’s focus is on how a unified semantics captures categorical distinctions *as emergent*."*  
  - **When pressed on probability:** *"For near-actual indicatives, I assume a restricted conditional probability; for counterfactuals, probabilities are ill-defined. This aligns with Knobe’s data on counterfactual probability judgments."*  
  - **Armor for the Continuum Claim:** Pre-emptively show a slide with semi-counterfactual examples (e.g., "If I had taken that job last year…" vs. "If I had been born in the 1800s…") and stress how existing binary accounts struggle to rank their acceptability.  

  **Final Tip:** Defend aggressively but concede graciously on gaps. Your goal is to show the continuum is *plausible and unifying*, not bulletproof. Good luck! 🎯
