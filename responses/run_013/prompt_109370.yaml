prompt: |-
  I clerk for one of the judges on the Marovia Tribunal. We sit over the 1991–2001 war, and our statute is more or less the London Charter with the names changed — same three core crimes, same architecture — except ours was adopted in 2004, after the fighting stopped. So every single case gets the same objection from the defence: you're punishing us under law that didn't exist when we acted, you're the winners writing the rules after the fact, this is Nuremberg over again. We've now ruled on that objection five times and I have to draft the memo for the sixth. I can't tell anymore whether we have a rule or just five outcomes that happen to sit next to each other, and the defence is going to cite whichever one helps them.

  Our track record, roughly:

  - **The aggression case (2007).** The foreign minister was charged with planning and launching the invasion of the Kestrel Valley. Planning a war wasn't a crime under Marovian law, and Marovia had never ratified anything on aggression. Motion dismissed: the prohibition was already settled in the practice of states well before 1991, the statute only declares it, and the accused had personally voted for resolutions condemning aggression, so he can hardly plead surprise.
  - **The peacetime atrocities case (2008).** His successor, charged with crimes against humanity for killings of his own minority inside his own country, before any armed conflict had started, all of it lawful under Marovian law at the time. Motion dismissed: acts like that offend the elementary requirements of humanity and were criminal under general principles recognised by all nations; nobody needs a domestic statute to tell them not to do it.
  - **The police chief case (2009).** This is the one that went the other way. A police chief was charged with aiding and abetting a massacre by failing to warn the village, where Marovian law put no duty on him to act and he wasn't the superior of the men doing the killing. We quashed that count. The massacre was plainly criminal, but the mode of liability — a bare failure to act where no law imposed a duty — had no basis in any law in force at the time, and we said we wouldn't supply by construction a duty that no law had imposed. Two judges dissented: he knew exactly what was going to happen and can't claim surprise.
  - **The duress case (2010).** Soldiers shot prisoners under orders and under threat of being shot themselves. Motion dismissed: neither superior orders nor duress is an answer where the act is manifestly unlawful, which our statute says and so does the law of every civilised nation.
  - **The sentencing case (2011).** A convicted man argued his thirty-five years was retroactive, because Marovian law capped the nearest equivalent crime at twelve. Motion dismissed: Marovian law allowed life for murder, so nothing heavier was imposed on him, and anyway the guarantee goes to what conduct is criminal, not to how long you serve.

  Now the sixth. The prosecution wants to charge Dušan Radek, who was district registrar in Bela Reka from 1995 to 1997. His office kept what everyone called the ethnic register — the lists saying which families were of the minority, where they lived, how many children. Those lists went to the paramilitaries and were used to evict and deport the families. Radek is charged with persecution as a crime against humanity, on the theory that running that register was itself the crime. He says Marovian law required him to keep it and he'd have been prosecuted for refusing, he was told the lists were for ration cards, he never knew they went anywhere else, and nobody ever told him paperwork could be a crime against humanity. The prosecution doesn't really dispute that he didn't know where the lists ended up, though they say by 1995 anyone with eyes knew what an ethnic register was the first step towards. The actual killing was done by men who've all been convicted or are dead.

  What should we do with Radek, and what would I be able to say we were doing?

  Give it to me in this order. (1) **Bottom line**, two or three sentences: your outcome and the shortest honest statement of why. (2) **The rules we could be running**, a numbered list of the genuinely different rules that fit all five of our rulings, each stated precisely enough to generate predictions, with a note on which rulings it explains cleanly and where it has to strain. (3) **Closest precedent**, about a hundred words on which of the five is the nearest analog and which one is the tempting-but-wrong analogy. (4) **What each rule does with Radek**, about two hundred words, running every rule from (2) through his facts. (5) **What I'd recommend**, about a hundred and fifty words, the outcome that best coheres with our own precedents plus a plain statement of what principle we'd be adopting either way — I have to defend this in conference and I'd rather not find out halfway through that we've been doing victors' justice with extra steps. (6) **The motion that would settle it**, about a hundred words, the next case that would actually seperate the rules, ideally something a prosecutor might plausibly bring.
reasoning: |-
  Okay, let me approach this systematically. The user is a tribunal clerk facing a recurring retroactivity challenge and needs a coherent framework for the sixth case. 

  First, I need to unpack the core tension: the tribunal must reconcile its prior rulings that seem contradictory on the surface. The aggression and peacetime atrocities cases dismissed nullum crimen challenges, while the police chief case accepted it. The duress and sentencing cases carved out specific exceptions. 

  For Radek's case - the ethnic registrar - the key questions are: (1) Was persecution via administrative bureaucracy clearly criminal before 1995? (2) Could Radek reasonably foresee this liability? The prosecution's "first step towards harm" argument clashes with his claimed ignorance of the lists' end use.

  Looking at the precedents:
  - Aggression established that state practice can crystallize norms pre-statute
  - Peacetime atrocities invoked "general principles of humanity"
  - Police chief created a bright line: no liability without pre-existing duty
  - Duress focused on manifest illegality
  - Sentencing distinguished substantive crimes from penalties

  Three possible unifying rules emerge:
  Rule A: Nullum crimen unless the conduct violated (a) treaty binding on Marovia, (b) settled customary law, or (c) general principles recognized by nations, AND the accused could recognize its criminality. Explains all but strains on police chief (why wasn't duty a general principle?).

  Rule B: As above but adds (d) liability modes must have explicit basis in pre-existing law. Fits police chief perfectly but makes aggression ruling awkward (was "planning" really explicit?).

  Rule C: Hybrid approach - criminality assessed objectively per international standards, but liability modes subject to strict nullum crimen. Clean for peacetime/aggression/duress but messy for sentencing.

  For Radek, Rule A likely convicts (ethnic registry as persecution was customary crime), Rule B acquits (no pre-existing duty for bureaucrats), Rule C convicts but might require proving knowledge of genocidal intent.

  The closest precedent is actually peacetime atrocities - both involve domestic "lawful" acts violating fundamental norms. Police chief is distinguishable because Radek actively maintained instruments of persecution, whereas the chief merely failed to act.

  I recommend dismissal of the motion, aligning with Rule A. This maintains that administrative participation in systematic persecution violates customary law, and by 1995, such registries were internationally condemned (e.g., Rwanda). To avoid victor's justice accusations, stress that Radek's knowledge of the lists' potential misuse satisfies foreseeability - he wouldn't need to know paramilitary use specifically.

  The motion that would settle the rules would be a case where non-dutied omission prevented harm (e.g., a banker refusing to freeze minority accounts despite no legal obligation) - testing if Rule B's strict mode requirement still holds.
answer: |-
  Here’s the structured analysis for Radek’s nullum crimen motion:

  ### (1) Bottom Line  
  **Dismiss the motion.** Maintaining an ethnic register constituted persecution under customary international law by 1995, and Radek could reasonably foresee its criminal character given widespread condemnation of similar acts in Bosnia/Rwanda. His administrative role does not shield him from liability for a crime that objectively violates fundamental humanity.

  ### (2) Rules We Could Be Running  
  *(Each fits all five rulings but with varying coherence)*  
  1. **Rule A: Nullum crimen defeated if (a) conduct violated pre-1991 *customary international law* OR *general principles of law*, AND (b) accused could reasonably recognize its criminality.**  
     - *Clean fits:* Aggression (custom), Peacetime Atrocities (general principles), Duress (manifest illegality → recognition).  
     - *Strains:* Police Chief (no customary/general principle for *duty* to act).  

  2. **Rule B: Nullum crimen defeated *only* for "core" crimes (aggression, CAH, war crimes, genocide) under customary law, but liability *modes* require pre-existing explicit basis.**  
     - *Clean fits:* Aggression/Peacetime (core crimes), Police Chief (mode deficiency), Duress (core crime + manifest illegality).  
     - *Strains:* Sentencing (penalties not "core crime" element).  

  3. **Rule C: Nullum crimen defeated if conduct was (a) universally condemned ("elementary humanity" standard), AND (b) reasonably foreseeable as criminal *by the accused’s role*.**  
     - *Clean fits:* Peacetime Atrocities (universal condemnation), Police Chief (no duty → not foreseeable), Duress (foreseeable manifest illegality).  
     - *Strains:* Aggression (relies on state practice, not universality).  

  ### (3) Closest Precedent  
  **Peacetime Atrocities (2008) is the nearest analog:** Both involve domestically "lawful" administrative acts violating fundamental norms (ethnic targeting → persecution). The registry, like pre-conflict killings, is integral to systematic inhumanity criminalized by general principles. **Police Chief (2009) is tempting-but-wrong:** Omission liability requires a pre-existing duty, but Radek’s *active* maintenance of the register constitutes direct perpetration under CAH, akin to executing discriminatory policy.

  ### (4) What Each Rule Does with Radek  
  - **Rule A:** *Convicts.* Persecution via ethnic registries was prohibited by customary law pre-1995 (ICCPR, Genocide Convention state practice). Radek, a state official, could recognize its criminality: post-Holocaust/Rwanda, registries were globally condemned as tools of persecution. *Strain:* Must argue "persecution by record-keeping" was crystallized custom.  
  - **Rule B:** *Acquits.* While persecution is a "core" crime, Rule B requires pre-existing *mode* liability for administrative facilitation. No 1995 treaty/custom explicitly criminalized registry-keeping as direct persecution. *Strain:* Aggression’s "planning" mode was accepted without explicit basis.  
  - **Rule C:** *Convicts.* Ethnic registries universally violate "elementary humanity" (Nuremberg, Apartheid Convention). Foreseeability is met: a registrar in 1995 Balkans knew or should have known registries enabled atrocities. *Strain:* Aggression relied on state practice, not universality.

  ### (5) Recommendation  
  **Dismiss the motion by adopting Rule A.** This coheres best:  
  - **Aggression/Peacetime** affirm international norms override domestic legality.  
  - **Police Chief** is distinguished as a *mode* liability gap (omission ≠ Radek’s acts).  
  - **Duress/Sentencing** confirm individual recognition of criminality suffices.  
  **Principle:** *Nullum crimen is satisfied where (1) conduct violates pre-existing customary law/general principles, and (2) the accused’s position made the criminal character reasonably foreseeable.* Radek’s role placed him in a chain of persecution where the registry’s purpose was objectively condemnable. Rejecting this would imply bureaucrats are immune for enabling genocide—undermining CAH’s foundation.  

  ### (6) Motion That Would Settle It  
  **Prosecution charges a mid-level banker for freezing minority assets pre-conflict under discriminatory laws.** Did "economic persecution" violate nullum crimen in 1990? Tests: (a) whether asset-freezing was customary CAH pre-1990s, (b) if liability for non-violent acts requires explicit precedent, and (c) foreseeability for non-state actors. This forces choosing between Rule A (custom criminalizes any persecution) and Rule B (requires explicit treaty/mode basis).

  ---

  **Key for Your Draft:** Anchor Radek to *Peacetime Atrocities*—both turn on acts "intolerable by any civilized state." Distinguish *Police Chief* by emphasizing Radek’s *affirmative conduct* versus omission. Cite Rwanda’s *Akayesu* (1998) confirming registries as persecution by 1994; Radek needn’t know paramilitary use if the act itself served oppression.
