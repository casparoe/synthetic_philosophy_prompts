answer: |-
  ### Examination Question: Philosophy of Economics (60 Minutes, 25 Marks)

  **Case:** A subject makes choices in two laboratory sessions involving three options (A, B, C).  
  - **Session 1:** Options presented separately, no default selection. Choices: A > B, B > C, A > C.  
  - **Session 2:** Options presented as a bundle with one pre-selected (default). Choices: C > B, B > A, C > A.  

  Each session’s choices form a complete, consistent strict ordering. However, pooling choices across sessions violates the Weak Axiom of Revealed Preference (WARP).  

  **Question:**  
  1. **Utility under Revealed Preference:** What must a theorist who defines utility *solely* through observed choice (e.g., Samuelson) conclude about this subject’s utility? (3 marks)  
  2. **Utility as Well-Being:** Could a theorist who views utility as a measure of well-being accept the same conclusion? Explain why or why not. (4 marks)  
  3. **Divergence of Interpretations:** Do these two interpretations of utility (choice-based vs. well-being-based) necessarily conflict here? Justify your answer. (4 marks)  
  4. **The Limit Proposal:** A physicist proposes defining the subject’s “true utility” as the limit of her orderings as presentation (e.g., default settings) becomes progressively more neutral.  
     - (a) Is this limit empirically well-defined? What practical operation could approximate it? (3 marks)  
     - (b) Could the *order* in which neutrality is approached affect the resulting utility? Illustrate with an example. (3 marks)  
     - (c) Is this proposal a *definition*, an *empirical hypothesis*, or a *normative stipulation*? Explain. (2 marks)  
  5. **Policy Dilemma:** A policy analyst must choose between Policy X (better under Session 1’s ordering) and Policy Y (better under Session 2’s ordering) for this subject. What should guide the analyst’s decision? Defend your view. (3 marks)  
  6. **Conclusion:** In ≤100 words, identify one compelling counterargument to your own analysis and specify what evidence would force you to revise it. (3 marks)  

  ---

  ### Model Answer (Strong Student Response, ~850 words)  

  **1. Revealed Preference Utility**  
  A strict revealed-preference theorist must conclude the subject *has no coherent utility function*. Pooled choices violate WARP, revealing cyclical preferences (A > C and C > A). Since utility is *defined* as a numerical representation of consistent choice, inconsistency implies no such representation exists. The theorist cannot "rescue" utility by separating sessions without abandoning the core tenet that choice defines preference across contexts.  

  **2. Utility as Well-Being**  
  A well-being theorist *cannot* accept this conclusion. Session 1 suggests A maximises welfare; Session 2 suggests C does. Yet well-being is presumably a stable property of outcomes, not altered by presentation. If choices reflect true welfare, the subject’s well-being appears contradictory (A and C both "best" under different frames). The theorist must either reject choice as a welfare indicator or argue that frames *alter* welfare—a paradoxical view.  

  **3. Divergence of Interpretations**  
  The interpretations *necessarily conflict*. Revealed preference denies utility exists; well-being insists it must exist but cannot resolve its content. This exposes utility’s dual roles:  
  - **Preference Representation:** Fails when choices are frame-dependent.  
  - **Welfare Index:** Requires stability independent of choice architecture.  
  - **Risk/Uncertainty:** Not directly tested here, but frame-sensitivity undermines the idea that choices reveal stable risk attitudes.  
  Utility is asked to be both a *description of behavior* (shattered by inconsistency) and a *normative benchmark* (requiring consistency). The case forces these roles apart.  

  **4. The Limit Proposal**  
  **(a) Definition & Operationalization**  
  The limit is *not* empirically well-defined. "Neutral presentation" lacks a rigorous, context-free specification. An operational approximation might involve varying frames randomly across repeated trials (e.g., altering defaults or item layouts) and taking the modal preference. However, this assumes frame-effects "average out," which isn’t guaranteed—some biases may persist.  

  **(b) Path-Dependence**  
  The order of approaching neutrality *could matter*. Suppose we first neutralize defaults but not visual layout: the subject might prefer A > B > C. If we then neutralize layout, preferences might shift to C > B > A. Conversely, reversing the order might yield different orderings. Path-dependence implies the "limit" is arbitrary, not a discovery of latent preferences.  

  **(c) Nature of the Proposal**  
  The proposal is a *normative stipulation*. It defines "true utility" by fiat as preferences under idealized conditions. It is not a testable hypothesis (we cannot observe the limit) nor a pure definition (it smuggles in a value judgment that frame-neutral choices are "truer").  

  **5. Policy Dilemma**  
  The analyst should reject *both* orderings as welfare-relevant. If frames alter choices, neither session reveals stable welfare. Instead, the analyst could:  
  - Seek *non-choice evidence* (e.g., subjective well-being surveys).  
  - Apply a paternalistic standard (e.g., basic needs).  
  - Let the subject choose the frame *itself*, but this regresses (how is *that* choice framed?). Absent alternatives, policies should minimize irreversible harm, acknowledging welfare is indeterminate here.  

  **6. Conclusion (≤100 words)**  
  My analysis assumes well-being must be frame-invariant. But if welfare *is* context-dependent (e.g., a default may relieve decision fatigue, genuinely improving welfare), then frame-sensitive choices *do* reflect utility. This would force me to revise: utility could remain both choice-based and welfare-relevant if we redefine well-being as relational to frames. My weakest point is path-dependence in the limit proposal—if neutrality is underdefined, the exercise is circular. Empirical evidence of persistent frame-effects even under "neutral" conditions would invalidate the proposal.  

  ---

  ### Marking Scheme (25 Marks)  
  1. **Revealed Preference Impasse (4 marks)**  
     - *Must-hit:* States utility is undefined due to WARP violation; rejects separating sessions as ad hoc.  
     - *Error:* Claims sessions can be kept separate without theoretical cost.  
  2. **Well-Being Interpretation (4 marks)**  
     - *Must-hit:* Argues well-being requires stability, leading to contradiction or rejection of choice as evidence.  
     - *Error:* Assumes choices directly reflect welfare without addressing frame-dependence.  
  3. **Roles of Utility (4 marks)**  
     - *Must-hit:* Identifies conflict between descriptive (preference) and normative (welfare) roles.  
     - *Error:* Treats utility as univocal or ignores tension between roles.  
  4. **Limit Proposal Critique (4 marks)**  
     - *Must-hit:* Notes "neutrality" is undefined; demonstrates path-dependence; classifies proposal as normative.  
     - *Error:* Accepts the proposal as empirically feasible without critique.  
  5. **Policy Guidance (4 marks)**  
     - *Must-hit:* Rejects both orderings as welfare benchmarks; proposes alternative criteria.  
     - *Error:* Recommends a policy based solely on one session’s ordering.  
  6. **Self-Critical Conclusion (5 marks)**  
     - *Awarded for:* Clear counterargument + specific revision condition + genuine vulnerability in own reasoning.  
     - *Deduct for:* Vague or token self-criticism.  

  ---

  ### Distinguishing A/B Scripts & Question Critique  
  - **A vs. B Script:** An A script *interrogates assumptions* (e.g., "Are choice objects identical across frames? Is well-being frame-invariant?") and offers *cohesive arguments* across subparts. A B script *describes* tensions without synthesizing them or defaults to textbook concepts.  
  - **Question Revision Triggers:**  
    - If students argue the *default itself changes the option* (e.g., "C-with-default-effort" ≠ "C-without-default"), this exposes ambiguity in "same objects"—forcing you to clarify if the case rules this out.  
    - If students note your limit proposal *presumes frame-dependence is noise*, but it might be *meaningful* (e.g., defaults reduce cognitive load, improving welfare), this shows the question biases toward "neutrality."  
    - A script proving the pooled data *satisfy* WARP under a clever redefinition (e.g., options include frame-attributes) would reveal the case’s fragility.
