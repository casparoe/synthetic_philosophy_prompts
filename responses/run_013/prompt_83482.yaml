  I am a novelist applying for a one-year research fellowship at a small institute that supports cross-disciplinary work, and I need a two-page proposal on a question that has been nagging me. The question concerns Buridan's ass and choice without preference. The standard treatments seem to assume that if two options are exactly equal, a choice must either express some pre-existing preference or be a blind, arbitrary tie-break; I suspect there is a third possibility worth taking seriously: that in some cases the act of choosing is itself what constitutes the preference, so that the agent does not choose because she prefers but comes to prefer in and through choosing. I want the proposal to state precisely what this third possibility amounts to and how it differs from both arbitrary fiat and self-deception; explain why the existing rationalist, voluntarist, and decision-theoretic positions leave the question open; set out a method for distinguishing preference-revealing, preference-following, and preference-constituting choices, using cases a novelist would find natural (a character who must choose between two lives, a jury deadlocked between two verdicts, a person who flips a coin and then finds the result unbearable), and say why that method is better than simply appealing to intuition or to formal decision theory; say what a successful result would look like and what would count as failure; and give a realistic month-by-month scope for one year. No citations or bibliography; I will add those myself. Keep it to two pages.
