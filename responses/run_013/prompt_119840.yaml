  1. The conditional expected value under S (100) is greater than under not S (10). The mechanism is that in the simulation, the intervention also triggers the simulators to adopt it if it works, thereby saving their world too.
  2. Axiology: we count the simulated beings and the base reality beings equally. We are not giving extra weight to the simulators; we are just counting the additional lives in their world.
  3. No exotic devices: the simulators are ordinary. They are running the simulation for research and to protect their own civilization. They terminate unpromising simulations to save resources. They adopt successful interventions from simulations. This is within ordinary motives.
  4. The intervention is a donation of $1000 to a research institute. The numbers: modest option yields 50, fanatical option under not S yields 10, under S yields 100. The probability p is 10^{-19}. The far future is 10^20 for our world and 9*10^20 for the simulators' world.
  5. The amplification falls out: because of the simulators' policy of adopting successful interventions from simulations, the conditional expected value under S is higher.

  Now, the rest of the tasks:

  (a) State the case cleanly.

  In a world facing existential risks, two agents, Alice and Bob, must choose how to donate $1000. Alice believes there's a 50% chance we are in a simulation; Bob does not. The modest option donates to a proven malaria charity, saving one life (50 utility). The fanatical option donates to an asteroid warning system research, which has a minuscule chance (10^{-19}) of preventing an existential catastrophe and saving the far future (10^20 utility). 

  However, if we are in a simulation, the simulators are running our simulation to study existential risks and have a termination policy: if no investment in long-term safety is made by now, they terminate the simulation. If the investment is made, they let it run. Moreover, if the intervention in our simulation succeeds, the simulators will implement it in their base reality, saving their far future (9*10^20 utility). 

  Therefore, conditional on being simulated, the fanatical option has an expected value of 100 utility; conditional on not being simulated, 10 utility. Bob (who disregards simulation) sees 10 utility for fanatical vs 50 for modest, so chooses modest. Alice, considering both possibilities, sees 55 utility for fanatical vs 50 for modest, so chooses fanatical.

  (b) Arithmetic:

  Bob:
  - EV_modest = 50
  - EV_fan = EV(fan|not S) = 10 (since P(S)=0)
  - 50 > 10 → modest

  Alice:
  - EV_fan = P(S) * EV(fan|S) + P(not S) * EV(fan|not S) = 0.5*100 + 0.5*10 = 50+5=55
  - EV_modest = 50
  - 55 > 50 → fanatical

  (c) The structural feature doing the work is the simulators' policy of adopting successful interventions from the simulation for their own base reality. This alters the size of the far future at stake conditional on the intervention being successful in the simulation: it adds the value of the simulators' far future to the outcome.

  (d) If we remove that feature (so the simulators do not adopt the intervention in their world, even if it works in the simulation), then conditional on S, the expected value of the fanatical option becomes only p * V = 10 (same as under not S). Then Alice's EV_fan = 0.5*10 + 0.5*10 = 10, which is less than 50. Both agents would choose the modest option. So the amplification disappears and we revert to the damping verdict (if anything, the simulation hypothesis doesn't help).

  (e) A defender of the damping verdict might resist by denying that the simulators would adopt the intervention from the simulation for their own world. They might argue that the simulators are running many simulations and wouldn't act on one result, or that they are only interested in historical curiosity and not in their own future. But if the simulators are running the simulations to learn about existential risks, it seems natural they would apply the lessons. The cost to the damping defender: they must say that the simulators are not actually interested in saving their own civilization, which might be at odds with the typical reasons for running simulations (research, pedagogy, entertainment). Moreover, the case can be rebuilt on the assumption that the simulators are running the simulations for pure historical curiosity, without any connection to their own future. Then the amplification feature disappears. But the damping defender might also have to concede that if the simulators are running the simulations for reasons connected to their own survival, then the amplification scenario holds.

  The case shows that the damping claim is not a necessary consequence of the simulation argument; it depends on the specific motives and policies of the simulators.
