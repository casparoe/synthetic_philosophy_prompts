  ### Thought Experiment: The Simulation Argument Amplifies Fanaticism

  **Scenario Setup:**  
  Alice and Bob are philanthropists with $1,000 to donate. Both are total utilitarians who value simulated and non-simulated lives equally. They face two options:  
  - **Modest option:** Donate to the Against Malaria Foundation (AMF), saving one life with certainty. This yields 50 units of near-term utility (representing 50 quality-adjusted life years for the saved individual).  
  - **Fanatical option:** Donate to the Institute for Long-Term Resilience (ILTR), which researches pandemic early-warning systems. If successful, this system would prevent a future catastrophe that would otherwise destroy humanity, preserving a far future valued at \(10^{20}\) utility units (representing the aggregate welfare of trillions of future lives over millennia).  

  The intervention has a negligible chance of success. Conditional on not being in a simulation, the probability \(p\) that ILTR’s research prevents the catastrophe is \(10^{-19}\). However, conditional on being in a simulation, the dynamics differ due to the simulators’ behavior.  

  **Simulators’ Motives and Constraints:**  
  The simulators are advanced civilizations running ancestor simulations for research and pedagogical purposes. They are resource-constrained and terminate simulations early if they deem the simulated civilization unlikely to achieve long-term resilience. Specifically:  
  - They monitor for "resilience investments" (e.g., efforts to mitigate existential risks).  
  - If no such investment occurs by a critical point (e.g., 2025), they terminate the simulation, forfeiting the far future.  
  - If an investment occurs, they allow the simulation to continue, letting the intervention succeed or fail naturally.  
  - Crucially, the simulators face similar existential risks in their base reality. If an intervention succeeds in a simulation, they adopt it in their world, saving their far future (valued at \(9 \times 10^{20}\) units, as their advanced civilization has a larger scale).  

  **Mechanism for Amplification:**  
  Under the simulation hypothesis, the fanatical option has higher expected value because:  
  1. It prevents immediate termination, enabling the far future of the simulated civilization.  
  2. If it succeeds in the simulation, the simulators adopt it, amplifying the payoff by saving their base-reality far future.  
  This leverages ordinary simulator motives (research efficiency and self-preservation) without exotic assumptions.  

  ---

  ### (a) Case Statement  
  Alice assigns 50% credence to the simulation argument; Bob assigns 0%. For the fanatical option:  
  - **Conditional on simulation (S):**  
    - Probability of success = \(p = 10^{-19}\) (same as non-simulation).  
    - If successful, payoff = Simulated far future + Simulators’ far future = \(10^{20} + 9 \times 10^{20} = 10^{21}\) units.  
    - Expected value (EV) = \(p \times 10^{21} = 10^{-19} \times 10^{21} = 100\).  
  - **Conditional on non-simulation (\(\neg S\)):**  
    - Probability of success = \(p = 10^{-19}\).  
    - Payoff = \(10^{20}\) units (only Earth’s far future).  
    - EV = \(p \times 10^{20} = 10^{-19} \times 10^{20} = 10\).  

  The modest option yields 50 utility unconditionally.  

  ---

  ### (b) Agent Decisions and Arithmetic  
  **Bob (assigns 0% to simulation):**  
  - EV(fanatical) = EV(fanatical | \(\neg S\)) = 10.  
  - EV(modest) = 50.  
  - **Decision:** 50 > 10 → Chooses modest option.  

  **Alice (assigns 50% to simulation):**  
  - EV(fanatical) = \(P(S) \times \text{EV}(fan|S) + P(\neg S) \times \text{EV}(fan|\neg S)\) = \((0.5 \times 100) + (0.5 \times 10)\) = 55.  
  - EV(modest) = 50.  
  - **Decision:** 55 > 50 → Chooses fanatical option.  

  **Result:** Alice’s acceptance of the simulation argument amplifies fanaticism, making her prefer the fanatical option, while Bob does not.  

  ---

  ### (c) Structural Feature  
  The feature doing the work is the **simulators’ adoption of successful interventions from simulations into their base reality**. This alters:  
  - **The size of the far future at stake** conditional on the intervention’s success in the simulation.  
  Under \(\neg S\), success saves only Earth’s far future (\(10^{20}\)). Under \(S\), success additionally saves the simulators’ far future (\(9 \times 10^{20}\)), increasing the payoff by an order of magnitude.  

  ---

  ### (d) Feature Removal and Collapse  
  **Removed feature:** Simulators no longer adopt interventions; they only use simulations for passive observation.  
  - **New conditional EV(fanatical | S):**  
    - Payoff = Only simulated far future (\(10^{20}\)) if successful.  
    - EV = \(p \times 10^{20} = 10^{-19} \times 10^{20} = 10\) (same as \(\neg S\)).  
  - **Alice’s new EV(fanatical):** \((0.5 \times 10) + (0.5 \times 10) = 10\).  
  - **Result:**  
    - Alice: EV(fanatical) = 10 < EV(modest) = 50 → Chooses modest.  
    - Bob: Unchanged (chooses modest).  
  The amplification vanishes, and both agents prefer the modest option. The case collapses into the damping verdict, as the simulation hypothesis no longer boosts the fanatical option’s value.  

  ---

  ### (e) Defense of Damping Verdict and Rebuttal  
  **How a damping defender would resist:**  
  - **Denial:** They would deny that simulators adopt interventions from simulations for their own use, calling it speculative or unsupported by the simulation argument’s premises.  
  - **Cost:** This requires assuming simulators are purely passive observers (e.g., motivated only by historical curiosity). Yet this conflicts with the simulation argument’s concession that simulators may run simulations for research or pedagogy—goals that logically include applying lessons learned. A purely passive simulator is an ad hoc restriction.  
  - **Rebuild potential:** Yes, if the defender concedes simulators could have pragmatic motives (e.g., budget-driven termination policies), the amplification case rebuilds. The simulation argument does not *require* passive simulators; damping is thus an artefact of assuming non-interventionist simulators, not a necessary consequence.  

  **Conclusion:**  
  The damping effect is not inherent to the simulation argument but depends on unstated assumptions about simulator behavior. Under ordinary motives (e.g., self-preservation and resource efficiency), the argument can amplify fanaticism by increasing the stakes under simulation.
