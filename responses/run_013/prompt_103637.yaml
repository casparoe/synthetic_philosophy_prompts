answer: |-
  *Leaning forward, hands steepled, with the weariness of one who has heard many a worthy plea strain against plain words:* 

  Counsel, you press precisely where the shoe pinches. Yes, Section 1 is enacted text. It binds. It tells us the *why*—the legislature’s broad aspiration. But it does not, by its terms, alter the *what* laid out in the operative provisions. Your argument founders on the structure: Sections 2, 3, and 4 contain the concrete commands and exceptions. Section 3’s prohibition is absolute: "no person shall disturb." Not "unless inconvenient," nor "absent grave necessity." The permit clause in Section 4 carves out a narrow, discretionary escape—limited to scientific or educational ends. 

  You ask why one sentence is "demoted." It is not demotion, but differentiation of function. The purpose clause illuminates; the operative clauses govern. When the legislature wished to create exceptions, it did so expressly—and narrowly—in Section 4. It knew how to condition the prohibition. It did not write "except in emergencies." *Expressio unius* instructs us that specifying one exception implies others are excluded. To read an emergency exception into Section 3 is not faithful construction; it is judicial amendment. 

  Consider the absurdity canon you implicitly invoke. True, we avoid readings that produce absurd results. But "absurdity" is not hardship, nor even grave inconvenience. It is outcome so irrational, so utterly at odds with any conceivable legislative design, that we presume drafters could not have intended it. Is this absurd? Dire, yes. But the legislature could rationally have prioritized undisturbed preservation above all else, trusting that other governmental powers—eminent domain, emergency declarations—would address crises like this. The Act has a purpose; it does not claim to be the *only* purpose of governance. 

  Your strongest point: Section 1 speaks of preservation "for the benefit of future generations." Forty thousand thirsty citizens have no future if they perish now. But that phrase, read in context, modifies "traces of its maritime past"—it anchors the *object* of preservation, not a freestanding public welfare mandate. The Act’s singular focus is archaeological integrity. If that choice is unwise, the remedy lies with the legislature, not this Court. 

  So I return your question: If Section 1’s purpose clause controls the operative terms so completely, why did the legislature bother to draft Sections 3 and 4 with such specificity? Why not simply say: "Preserve coastal heritage artifacts, subject to such exceptions as achieve the Act’s purpose"? It did not. We are bound by what it *did* enact. Proceed.
