     Given that, the further case could be: "For yourself, how much would you value an improvement in your quality of life that occurs in 50 years compared to the same improvement now? Would it be at full value, or discounted to about a seventh?"

     That's direct.

     But to make it clean and not leading, we can ask: "A policy will improve your quality of life by an amount X in 50 years. How much would you be willing to sacrifice in your current quality of life to get that improvement? Express as a fraction of X."

     Under Rule 1: about 0.14.
     Under Rule 2: about 1.0.

     This is clean.
