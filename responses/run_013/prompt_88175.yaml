  1. Dana's rule is exponential discounting at a constant annual rate of 4% for all future benefits, regardless of beneficiary identity or type (lives, money, welfare), due to pure time preference.  
  2. An alternative rule is exponential discounting at 4% per year only for benefits to future generations (unborn individuals), but no time discounting for benefits to currently living individuals, including their future selves.  
  3. For the new case (benefit to current 20-year-olds in 50 years): the first rule predicts ~1/7 weight (≈140/1000, matching 4% over 50 years), while the alternative rule predicts full weight (no discounting for existing people).  
  4. I would bet on the first rule (4% discount) because Dana consistently applies the same exponential rate to money and future lives, and her money discounting (e.g., $104 next year vs. $100 today) implies time preference applies to herself—a currently living person—over time.  
  5. To separate the rules, ask: "Would you sacrifice $100 of your own current consumption for a guaranteed $700 of personal consumption in 50 years?" Rule 1 rejects (requires ~$710 for indifference), Rule 2 accepts (no discounting for own future).
