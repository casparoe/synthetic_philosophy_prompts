answer: |-
  *(leans forward, knuckles whitening on the armrest, voice low but intense)*  
  Your objection mistakes the *application* of the principle for the principle itself, sir. That I, or any man, may err in the complex *composition* of motions – as in the generation of a rectilinear figure equal to a circle – does not invalidate the certainty inherent in the simple definitions and generations we *do* comprehend perfectly. The circle *is* demonstrable because its generation is clear: a point moved equally in all directions from a center. We *make* this motion in conception. The error in quadrature arises not from the making of the circle, but from the *rash imposition* of names and motions upon it that are not truly generated from its simple principle! Wallis dissembles with his infinite series and symbols – mere *marks* divorced from clear generation by motion. True demonstration requires tracing every step back to the causal generation we conceive. Where I have erred, it is because I attempted to reason about magnitudes not sufficiently resolved into their simplest motions, seduced perhaps by the *appearance* of relation rather than its causal genesis. The making *is* the knowing – but only if the making is scrupulously derived from first principles of motion, not forced by the ambition of the geometer. Wallis finds fault not with genuine generation, but with my imperfect execution of it. The principle stands: what we cause by defined motion, we know with certainty. My failures are human impatience, not philosophical error.
