prompt: |-
  I spent last night arguing with a friend about when it's rational to stop looking and take something good enough, and I came away with clear verdicts on the cases below but no principle that fits them. I'd like you to find one.

  My verdicts. Grabbing the first jar of pasta sauce that looks acceptable, without comparing the rest of the shelf: fine. Signing the first apartment that meets all my criteria, without waiting to see what else comes on the market: fine. Taking the first job offer that clears my bar, in a field where your first job largely determines which jobs you can later get: not fine; I owe myself more looking. A doctor settling on the first diagnosis that fits the symptoms and stopping the workup: fine when the condition is benign and the treatment is cheap, not fine when a rare fatal condition is still live and one more test would rule it out. Marrying the first person who meets my standards rather than seeing who else is out there: fine. Picking a research problem on the grounds that it looks workable, without surveying the whole field: fine. Picking a statistical method the same way, when an afternoon of reading would have turned up a better-established one: not fine.

  Two things I can't reconcile. The apartment and the job look like the same choice — stop at the first acceptable option, without knowing what else is out there — and I want to treat them differently. And stopping at the pasta sauce seems fine even though checking one more shelf is nearly free and would probably get me a better jar, which appears to contradict the obvious principle that you should keep looking as long as the expected improvement exceeds the cost of looking.

  I also have a hunch I want tested: stop when the expected improvement from further search is small compared to the cost of searching, with both measured against what actually matters to me. And a related case: a friend who always takes the first option above a fixed threshold, in every domain, never computing whether more looking would pay off. I think adopting that blanket rule is fine, even though in most particular cases it does worse than case-by-case optimization would.

  Please answer in American English, in these sections and order: "Bottom line" (about 100 words, stating the principle you'd defend and which of my verdicts it sacrifices); "The verdicts, restated" (about 100 words); "Candidate principles" (about 350 words, stating two or three precisely, with the case that motivates each clause); "Predictions on cases I haven't listed" (about 300 words, at least three new cases); "What I have to give up" (about 150 words, saying which of my verdicts the best principle cannot keep, and whether I should drop the verdict or complicate the principle); and "Loose ends" (about 100 words).
reasoning: |-
  Okay, the user presents a fascinating challenge: they've argued about when to stop searching for "good enough" options and have specific verdicts on various cases but can't find a unifying principle. Their examples range from trivial (pasta sauce) to life-altering (jobs, marriage). They want a principle that explains most verdicts but acknowledges some may need sacrificing.

  Hmm, their two core conflicts stand out: why treat apartments and jobs differently when both involve stopping at first acceptable option? And why is pasta sauce fine despite negligible search cost? Their hunch about expected improvement vs. cost seems close but incomplete. 

  The user seems analytically rigorous - they've mapped verdicts meticulously but crave coherence. Probably values intellectual honesty given their willingness to sacrifice some judgments. Their "friend with fixed thresholds" example suggests interest in practical heuristics versus theoretical optimization. 

  I notice their verdicts hinge on irreversibility and stakes. Jobs lock you into career paths, apartments don't. Benign diagnoses are reversible, fatal ones aren't. This points toward a principle where stopping depends on how costly future corrections would be. 

  For the pasta sauce paradox: the actual cost isn't just time spent checking shelves, but the cognitive load of optimizing trivial choices. Their brain might be wisely conserving decision energy for what matters. 

  The friend's blanket rule makes sense as a meta-heuristic - case-by-case optimization has mental transaction costs they're not accounting for. Sometimes consistency beats optimality. 

  I'll structure around:
  - Core principle: Stopping cost = (Error cost × Probability of better option) vs. Search cost + Opportunity cost
  - Verdict reconciliation: Jobs have high error costs (path-dependence), apartments don't. Pasta sauce has near-zero error costs.
  - Sacrifices: Their "fine" verdict on research problems might not hold if field-surveying is cheap and stakes high.
  - New cases: Will test with car purchases, Tinder swiping, etc.

  Biggest insight: "What actually matters" includes the cost of deciding itself. That's the missing variable in their hunch.
answer: |-
  ### Bottom line
  The defensible principle is: **Stop searching when the expected cost of finding a better option exceeds the expected benefit, accounting for *irreversibility* and *stakes*.** This sacrifices your "fine" verdict on taking the first job offer. High-stakes, path-dependent choices (like jobs) demand more search because the cost of a suboptimal choice is amplified over time, and correction is costly. For low-stakes, reversible choices (pasta sauce, apartments), minimal search suffices. Your friend’s blanket rule is rational as a heuristic to avoid decision fatigue, even if suboptimal in specific cases.

  ---

  ### The verdicts, restated
  You endorse stopping early for: pasta sauce, apartments (reversible, low-stakes), benign diagnoses (low-risk), marriage (high emotional/search costs), and research problems (uncertain payoff of more search). You reject early stopping for: jobs (high path-dependence), fatal diagnoses (high stakes), and statistical methods (low search cost, high expertise cost). Conflicts arise between jobs/apartments (similar structure, different stakes) and pasta sauce (negligible search cost ignored).

  ---

  ### Candidate principles
  1. **Expected net utility maximization**:  
     Stop when *Expected Improvement from further search* < *Cost of searching*.  
     *Motivation*: Directly addresses pasta sauce (low improvement vs. trivial cost) and statistical methods (high improvement likelihood vs. low cost). Fails jobs/apartments: expected improvement for jobs is high due to compounding effects, but the principle doesn’t weight this asymmetry.

  2. **Stakes-adjusted irreversibility**:  
     Stop when *Error Cost × Probability of better option* < *Search Cost + Opportunity Cost*, where **Error Cost** scales with irreversibility and stakes.  
     *Motivation*: Explains jobs (high error cost: career constraints) vs. apartments (low error cost: leases end). Captures fatal diagnoses (error cost = death) vs. benign ones (error cost = minor inconvenience). Rescue pasta sauce by noting trivial error cost.

  3. **Cognitive economics principle**:  
     Stop when *Marginal decision quality gain* < *Marginal cognitive/search burden*, **unless stakes justify override**.  
     *Motivation*: Justifies your friend’s blanket rule (avoids optimization overhead) and marriage (emotional burden of endless search). Accepts suboptimal pasta sauce choices because optimizing isn’t worth mental energy. Requires explicit "stakes" clause for fatal diagnoses/jobs.

  **Synthesis**: Principle #2 best fits your verdicts by hardcoding stakes/irreversibility. It treats jobs as unique due to high error costs from path-dependence, resolving the apartment/job conflict. Pasta sauce is fine because error cost is low *even if* search is cheap—the penalty for a subpar choice is trivial.

  ---

  ### Predictions on new cases
  1. **Buying a used car**:  
     *Verdict*: Not fine to take the first acceptable car.  
     *Why*: High stakes (safety, large $), moderate irreversibility (resale is costly). Principle #2 demands search beyond "meets criteria."

  2. **Swiping on dating apps**:  
     *Verdict*: Fine to commit to the first promising match without exhausting options.  
     *Why*: High search/opportunity cost (time, emotional drain), low irreversibility (dating isn’t binding). Matches marriage verdict.

  3. **Choosing a retirement portfolio**:  
     *Verdict*: Not fine to pick the first "decent" option.  
     *Why*: Extreme stakes (lifetime savings), high irreversibility (compounding gains/losses). Demands extensive search even if costly.

  4. **Picking a coffee shop for remote work**:  
     *Verdict*: Fine to grab the first suitable spot.  
     *Why*: Low stakes (easily reversible), high opportunity cost (time wasted searching).

  ---

  ### What I have to give up
  You must sacrifice your "fine" verdict on **taking the first job offer**. Principle #2 prioritizes path-dependent consequences: a suboptimal job compounds via limited future opportunities, making search imperative even if the *immediate* cost/benefit seems balanced (e.g., a week’s search could prevent years of mismatch). Conversely, apartments lack this compounding effect.  

  **Should you drop the verdict or complicate the principle?** Drop the verdict. The job case uniquely merges high stakes, irreversibility, *and* uncertainty about future options—justifying exceptional caution. Adding "path-dependence" as a stakes multiplier keeps the principle parsimonious while capturing this.

  ---

  ### Loose ends
  - **Your friend’s blanket rule**: Defended as a rational heuristic under cognitive scarcity. Optimizing every decision is inefficient; a fixed threshold conserves mental resources for high-stakes choices.  
  - **Pasta sauce paradox**: Resolved by recognizing that "what matters" includes *error cost*, not just search cost. A worse sauce’s penalty is negligible, so expected improvement is functionally zero.  
  - **Diagnosis asymmetry**: The principle’s stakes clause directly handles this—benign conditions have low error costs, fatal ones have near-infinite error costs.  
  - **Remaining tension**: Research problems might demand more search if field-surveying is cheap and stakes high (e.g., tenure-dependent breakthrough). This suggests refining "stakes" to include opportunity costs of *not* searching.
