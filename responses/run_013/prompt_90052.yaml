prompt: |-
  I chair the standards committee for our forecasting tournament here at the policy school — semester-long, about forty grad students plus a few staff, a few hundred in-house questions per season (does the bill clear committee, does that preprint get retracted, does the department make its hire, does the port strike start before the holiday), cash prize for the winner plus a line on the "judgment" certificate the dean likes to hand out. My own work is in formal epistemology, so I'm the one who keeps saying we should be running a proper scoring rule, but I've stayed out of the rule-writing until now and the dean wants this settled at next week's meeting, so I actually have to produce something. Here's the mess. What we've been using is the plain linear rule: 100 points times the probability you assigned to the outcome that actually happened, averaged over the questions you answered, small penalty for abstaining. It rewards shouting, and we've had two seasons of people parking 1.0 on their hunches and beating careful forecasters, which I'm fairly sure is because the rule isn't proper — the way to maximize it is to put everything on your best guess — but I get tangled up in the algebra whenever I try to make that argument out loud in the room. My colleague Ravi has proposed what he calls "accuracy with humility": same 100 points times the probability you put on what happened, minus 20 points for every question where you put more than 0.9 on any outcome, and his pitch is that this is just the linear rule with a small correction bolted on so the overconfident can't run away with it. Half the commitee thinks that's obviously right and can't see what I'm fussing about. The other half thinks it's a Frankenstein rule that will have everyone reporting 0.89 and nothing else, forever. I think both camps are confused, and I need it sorted out in writing rather than in another meeting where we talk past each other.

  Two cases from last season also need rulings, and they're tangled up with the rule question, though I'd like them seperate from it if that's possible. First, Team Crank: two students with a homemade astrology-adjacent model of news cycles that posted the top score of the season — luck, or some weird genuine signal, I honestly can't tell, and their write-ups are not something I'd sign my name to; one of them said in the debrief that the model "isn't really falsifiable, it just fits." The runner-up used a boring base-rate-plus-updating approach and lost by a hair. Half the committee wants the prize to go to the best score, full stop; the other half wants a quality-of-reasoning clause written into the rules. Second, one student submitted ranges instead of point probabilities — "0.3 to 0.7" on several questions — arguing that forcing her to a single number would be epistemically dishonest, and asking to be scored at the midpoint of her range. I have some sympathy for that, and also a strong suspicion that a midpoint rule is the easiest thing in the world to game, so I want a decision I can defend either way.

  Please write the memo I'll circulate before the meeting. Recommendation up front, concrete enough to implement: the exact rule we should adopt (formula included, so the TAs can code it), what it does about abstentions and ties, when it takes effect, and explicit rulings on Team Crank and on the ranges, each with reasoning a dissenting member could actually argue with. Engage Ravi's proposal on its merits instead of just telling us to use something off the shelf — I want to know what his rule does to someone who genuinely has a 0.95 credence, and how bad the damage is, and whether there's a repair that keeps whatever he's after. Also be honest about the strongest thing to be said for his rule, and for the members who want to reward reasoning rather than scores, since I may be on the losing side of that one. No citations or reading lists, please; I know the literature and the rest of the commitee won't read it anyway.

  Approach this as someone who works on scoring rules and epistemic utility theory and knows which properties of a rule are doing the philosophical work here and which are just vibes. Start with a few bullets of brainstorming — the candidate rules, and the properties that matter (what happens when someone reports 0 or 1, how the rule treats hedging versus spreading probability around, whether honest reporting is optimal and whether it's uniquely optimal, how easily it's gamed, whether any penalty in it is continuous, how sharply it rewards sharpness) — then write the memo in American English, around 800 to 900 words. After the memo, give me a short structured summary as a JSON object with these fields: "bottom_line" (one sentence), "adopted_rule" (name plus formula), "decisive_properties" (array of short strings), "ruling_team_crank" (object with "verdict" and "reason"), "ruling_interval_forecasts" (object with "verdict", "how_scored", "reason"), "strongest_case_against" (string), and "what_would_change_our_mind" (string). Keep the JSON valid and put nothing after it.
reasoning: |-
  We are given a situation with a forecasting tournament at a policy school. The current scoring rule is the linear rule: 100 * p(actual outcome), averaged over questions, with a small penalty for abstaining. The problem is that this rule is not proper: forecasters are incentivized to report 0 or 1 (i.e., "shouting") because that maximizes expected score if they have any belief not exactly 0.5.

  Ravi proposes "accuracy with humility": same linear rule but subtract 20 points for every question where a probability above 0.9 is reported on any outcome. The committee is divided: some think it will prevent overconfidence, others think it will cause everyone to report 0.89.

  Additionally, there are two cases:
  1. Team Crank: used an unconventional model and won by a hair over a more conventional forecaster. Should the prize go to the highest score, or should there be a quality-of-reasoning clause?
  2. A student submitted probability intervals (e.g., "0.3 to 0.7") and wants to be scored at the midpoint. We suspect gaming.

  The memo must:
  - Recommend a rule (with formula) and address abstentions and ties.
  - Rule on Team Crank and the interval forecasts.
  - Engage Ravi's proposal: what happens to someone with genuine 0.95 credence? Is there a repair?
  - Acknowledge the strongest case for Ravi's rule and for rewarding reasoning.

  Brainstorming bullets (for internal use, not in memo):
  Candidate rules:
  1. Linear rule: S(p, x) = 100 * p if x=1, 100*(1-p) if x=0? Actually, for binary events: if the event happens, you get 100 * p; if not, you get 100 * (1-p) for the other outcome? But note: the description says "100 points times the probability you assigned to the outcome that actually happened". So for binary, if you assign p to A and 1-p to B, then:
     - If A happens: score = 100 * p
     - If B happens: score = 100 * (1-p)
     But this is the same as: 100 * (1 - |outcome - report|) for binary? Actually, note: the linear rule in proper scoring rule context is often called the linear scoring rule and is improper.

  2. Ravi's rule: same as linear but subtract 20 if max(probability) > 0.9.

  3. Proper alternatives: e.g., quadratic (Brier) or logarithmic.

  Properties that matter:
  - Properness: honest reporting is optimal. (Uniquely proper is even better.)
  - Encourages sharpness: given fixed beliefs, the rule should reward more extreme probabilities when they are justified.
  - Robustness to gaming: hard to exploit by misreporting.
  - Continuity: small changes in report lead to small changes in score.
  - Treatment of 0 and 1: if you assign 0 to an event that happens, you get 0, which is appropriate but harsh (so we might want to avoid 0 and 1? but sometimes events are certain).
  - Hedging vs spreading: does the rule punish spreading probability over multiple outcomes? (In multi-class, we want to reward putting mass on the correct outcome, but not necessarily punish spreading if the event is uncertain.)

  For the tournament, we have binary and possibly multi-outcome events? The questions are in-house and varied.

  The memo should recommend a proper rule. The quadratic (Brier) rule is a common choice: for a binary event, if you report p (for the event occurring) and the outcome is x (1 if occurs, 0 otherwise), then:
     Score = 100 * [1 - (x - p)^2]   (so maximum 100, minimum 0)

  Alternatively, we can scale it to be comparable to the linear rule. The linear rule gives a score of 100*p for the occurring event. The Brier score in its raw form is 1 - (x-p)^2, so we can scale by 100: 100*(1 - (x-p)^2).

  The Brier score is strictly proper, so honest reporting is uniquely optimal. It also encourages sharpness: if your true belief is q, then reporting p=q maximizes your expected score.

  Abstentions: we can handle by assigning a neutral forecast (e.g., 0.5 for binary) and then apply a penalty? Or let abstaining be scored as 0? But that would be harsh. Alternatively, we can set a default (like 0.5) and then subtract a fixed penalty for abstaining to discourage it without being too harsh.

  Ties: we can break by the number of questions answered? Or by the time of submission? But the rule should specify. Since we are averaging, if two people have the same average, then we can break by the number of questions answered (more questions being better) or by the standard deviation (but that's complex). Alternatively, we can have a tie-breaker question or use the highest score on a single question? But the memo should decide.

  Engaging Ravi's rule:
  - What happens to someone with genuine 0.95 credence? If they report 0.95, they get the linear score (which is 100*0.95=95 if the event happens, or 100*0.05=5 if not) and no penalty. But if they report 0.9, they avoid the penalty and get 90 if it happens. The penalty is 20 points, so if they report 0.95 and the event happens, they get 95; if they report 0.9, they get 90. So they are better off reporting 0.95 if they believe it. But if the event does not happen, then reporting 0.95 gives 5, and reporting 0.9 gives 10 (because 100*(1-0.9)=10). So the expected score for a true belief of 0.95:
     - Reporting 0.95: 0.95*95 + 0.05*5 = 90.25 + 0.25 = 90.5
     - Reporting 0.9: 90 (if event happens) or 10 (if not) -> 0.95*90 + 0.05*10 = 85.5 + 0.5 = 86
     So reporting 0.95 is better. However, if they report 0.95, they get a penalty of 20? Wait, Ravi's rule subtracts 20 if they put more than 0.9 on any outcome. So if they report 0.95, they get 95 - 20 = 75 if the event happens, and 5 - 20 = -15 if not. Then the expected score: 0.95*75 + 0.05*(-15) = 71.25 - 0.75 = 70.5. Reporting 0.9: 90 (if happens) and 10 (if not), and no penalty -> 86. So now 70.5 < 86, so they are better off reporting 0.9. This is bad because it forces them to underreport.

  Thus, Ravi's rule is not proper: it distorts honest reporting for high-confidence events. Moreover, it creates a cliff at 0.9: reporting 0.91 is worse than 0.9 because of the penalty. So forecasters will avoid reporting above 0.9, even when they have high confidence.

  The repair might be to make the penalty continuous? But then we are essentially moving toward a proper rule. Alternatively, we could use a proper rule that naturally penalizes overconfidence without ad hoc penalties.

  The strongest case for Ravi's rule: it is simple and directly targets the observed problem (overconfidence winning by luck). It doesn't require changing the entire scoring system. Also, it might discourage people from making extreme predictions without strong justification, because they fear the penalty.

  For rewarding reasoning: the strongest case is that forecasting is about the process, not just outcomes. We want to encourage good habits and discourage crank methods that might get lucky.

  However, we are a forecasting tournament: the goal is accuracy. If Team Crank got a higher score, they were more accurate that season. We can't know if it was luck or skill. So we should award the prize to the highest score. But we might add a requirement that forecasters must provide reasoning for their forecasts (without judging the quality) so that we can audit for cheating.

  For intervals: we should require a single number. However, we might allow forecasters to express uncertainty in the write-up. For scoring, we need a single number. The midpoint rule is gameable: if your true belief is 0.9, you could report [0.8,1.0] and get 0.9, but then if the event happens, you get 90? Actually, she asked to be scored at the midpoint. But note: the midpoint of [0.3,0.7] is 0.5. But what if the event happens? Then the linear rule would give 50, which is the same as if she had reported 0.5. But if she had a true belief of 0.6, she might have reported 0.6 and gotten 60, but now she reports [0.3,0.7] and gets 50. So she is punished for the interval? Or she might game it by making the interval wide when she is uncertain and narrow when she is confident? But the problem is that we don't have a scoring rule for intervals. We could use a scoring rule that accepts distributions? But that complicates the tournament. So we should require point forecasts.

  Recommendation:
  - Adopt the Brier score (quadratic scoring rule) scaled to 0-100.
     Formula: For a binary event, if the forecaster reports p (for the event occurring), and the outcome is x (1 if occurs, 0 otherwise), then:
        Score = 100 * [1 - (x - p)^2]
     For multiple outcomes: if there are n outcomes, and the forecaster assigns probabilities (p1, p2, ..., pn) to each, and outcome j occurs, then:
        Score = 100 * [1 - sum_{i=1 to n} ( (indicator_i=j) - p_i )^2 ]   but note: the Brier score for multi-category is 1 - sum_{i} (x_i - p_i)^2 where x_i is 1 for the true outcome and 0 otherwise.
     Alternatively, we can write: 100 * [1 - (1 - p_j)^2 - sum_{i != j} p_i^2] = 100 * [1 - (1 - 2*p_j + p_j^2) - (sum_{i} p_i^2 - p_j^2)] ... actually, the standard way is: 
        Score = 100 * [ 1 - ( (1 - p_j)^2 + sum_{i != j} (0 - p_i)^2 ) ] = 100 * [1 - ( (1 - p_j)^2 + sum_{i != j} p_i^2 ) ]
     But note: (1 - p_j)^2 + sum_{i != j} p_i^2 = 1 - 2*p_j + p_j^2 + (sum_{i} p_i^2 - p_j^2) = 1 - 2*p_j + sum_i p_i^2.
     Alternatively, we can compute as: 100 * (2*p_j - sum_i p_i^2) ? But note the standard Brier score is: 
        Brier = (1/n) * sum_i (x_i - p_i)^2   for normalized? Actually, the original Brier is defined for probabilities and the outcome vector. There are two versions: one for binary and one for multi-class. We can use the one that is common in forecasting tournaments: the full Brier score.

     However, to keep it simple, we can note that for any event, the score is 100 * [1 - (distance between the outcome vector and the probability vector in Euclidean squared distance)].

     But the committee might be more familiar with the binary case. We can write the binary version and then generalize.

  - Abstentions: assign a score of 50 (which is the same as reporting 0.5 for binary) for that question, and then apply a small penalty? Or we can set the score for abstention to 50 and then subtract a fixed penalty (e.g., 5 points) to discourage it. But note: the Brier score for 0.5 in a binary event is 100*(1 - (0.5)^2) = 100*(1-0.25)=75 if the event happens or not? Actually:
     If event happens: (1-0.5)^2 = 0.25 -> score = 100*(1-0.25)=75
     If not: (0-0.5)^2=0.25 -> score=75.
     So it's neutral. We can set the abstention score to 75 and then subtract, say, 10 points? That way, if you are uncertain, you can report 0.5 and get 75 (if you are truly uncertain, that's honest) but if you abstain, you get 65. Alternatively, we can say that abstaining gives a score of 50? But that is worse than reporting 0.5 and being right half the time. I think we should set the abstention to the score of the uniform distribution (for multi-class) and then subtract a fixed penalty (e.g., 5 points) to avoid making abstention a free ride. But to keep it simple, we can set the abstention score to 50 (for binary) and 100/k for k outcomes (and then scaled by the rule) but that doesn't fit. Alternatively, we can require that forecasters must answer at least, say, 80% of the questions to be eligible for the prize? And then score the ones they answer. The penalty for abstaining is that they get a lower average because they miss the chance to get a high score? But if they are forced to answer, they might guess. So we can allow abstaining and assign the uniform probability (so for binary, 0.5) and then no additional penalty? That would be my preference: if you abstain, we assign the uniform distribution and score that. Then the average is computed over all questions (including abstentions). That way, if you abstain, you get the same score as if you reported 50% on every outcome. This is neutral and doesn't require a penalty.

  - Ties: if two forecasters have the same average Brier score, then we break the tie by the number of questions answered (more is better). If still tied, then by the highest score on a randomly selected question? Or we can use the standard deviation of their scores (higher being better, meaning they were more often very confident and right). But that might be complex. Alternatively, we can have a tie-breaker question that was set aside? But we don't have that. So I recommend: break ties by the number of questions answered (more is better) and then by the highest score on the most recent question.

  Ruling on Team Crank: award the prize to the highest score. The tournament is about accuracy, and we cannot adjudicate the quality of reasoning without introducing bias. However, we should require that all forecasts are accompanied by a brief reasoning (to be kept for audit) so that if there is suspicion of cheating (e.g., using insider information) we can investigate. But if the method is unconventional and not falsifiable, that's acceptable as long as the forecasts were made before the outcomes.

  Ruling on intervals: require point forecasts. If a student is uncertain, they can report their best estimate. We can allow them to note their uncertainty in the write-up, but the score requires a single number. The interval request is denied.

  Repair for Ravi's rule? We could make the penalty continuous: subtract a penalty that is proportional to how much the max probability exceeds 0.9? But that would be arbitrary. Alternatively, we could use a proper rule that naturally discourages overconfidence? That's what we are recommending.

  Strongest case for Ravi: it directly addresses the problem of extreme forecasts and is easy to explain. For the members who want to reward reasoning: they are concerned that a lucky crank might win and that would undermine the educational value. But we are a forecasting tournament, and we should reward accuracy. We can have a separate prize for the best reasoning? But that's not what the dean set up.

  Now, write the memo.
answer: |-
  ### Memo: Forecasting Tournament Rule Revision and Case Rulings  

  **To:** Standards Committee  
  **From:** [Your Name], Chair  
  **Date:** [Date]  
  **Subject:** Revised Scoring Rule and Season Rulings  

  After thorough analysis, I recommend replacing our current linear scoring rule with the **quadratic (Brier) scoring rule**, scaled to a 0–100 range. This resolves the incentive to "shout" (i.e., report 0 or 1 probabilities), addresses Ravi’s concerns about overconfidence, and ensures proper incentives for accuracy. Below, I outline the rule, rulings on Team Crank and interval forecasts, and engagement with Ravi’s proposal.  

  #### **Recommended Rule: Quadratic (Brier) Scoring Rule**  
  - **Formula**: For a binary question, if a forecaster assigns probability \(p\) to the outcome that occurs, their score is:  
    \[
    \text{Score} = 100 \times \left(1 - (1 - p)^2\right)
    \]  
    If the forecaster assigns probability \(p\) to an outcome that does **not** occur, their score is:  
    \[
    \text{Score} = 100 \times \left(1 - p^2\right)
    \]  
    For non-binary questions with \(k\) outcomes, if outcome \(j\) occurs and the forecaster assigns probabilities \((p_1, p_2, \dots, p_k)\):  
    \[
    \text{Score} = 100 \times \left(1 - \sum_{i=1}^{k} (x_i - p_i)^2\right)
    \]  
    where \(x_i = 1\) if \(i = j\) and \(0\) otherwise.  
  - **Averaging**: Scores are averaged over all questions attempted.  
  - **Abstentions**: Assign the uniform probability (e.g., \(0.5\) for binary, \(1/k\) for \(k\) outcomes) and apply the scoring formula. No additional penalty is needed, as abstainers automatically receive neutral scores (e.g., 75 for binary questions).  
  - **Ties**: Broken by the number of questions answered (higher numbers favored). If still tied, use the highest score on a pre-selected "tiebreaker question" (e.g., the season’s first question).  
  - **Effective**: Next season (no retroactive changes).  
  - **Rationale**:  
    - **Properness**: Forecasters maximize expected scores by reporting true beliefs. Reporting \(p = 0.95\) when you believe \(0.95\) is optimal—unlike the linear rule.  
    - **Anti-Shouting**: Extreme forecasts (0 or 1) are heavily penalized if wrong (score = 0), but rewarded if correct (score = 100). This balances sharpness and caution.  
    - **Continuity**: Small changes in probability reports yield small score changes, avoiding cliffs (e.g., Ravi’s penalty at 0.9).  
    - **Hedging vs. Spreading**: Rewards putting higher probabilities on correct outcomes but doesn’t penalize spreading probability broadly when uncertainty is genuine.  

  #### **Engaging Ravi’s Proposal: "Accuracy with Humility"**  
  Ravi’s rule (linear scoring with a 20-point penalty for reports >0.9) aims to curb overconfidence but has critical flaws:  
  - **Impact on Honest High-Confidence Forecasts**: A forecaster with genuine 0.95 confidence faces a dilemma. Under Ravi’s rule:  
    - Reporting 0.95 risks a 20-point penalty (expected score: 70.5 if the event occurs 95% of the time).  
    - Reporting 0.9 avoids the penalty but yields a lower expected score (86) than honest reporting under quadratic scoring (90.25).  
    This forces underreporting (e.g., capping at 0.89) and distorts truthfulness.  
  - **Gaming Vulnerability**: The 0.9 threshold creates a discontinuity, incentivizing reports of exactly 0.89 regardless of true beliefs. This undermines accuracy.  
  - **Strongest Case for Ravi’s Rule**: It’s simple and directly targets extreme overconfidence. If our priority is to deter all high-confidence forecasts (even honest ones), it "solves" shouting. However, it throws the baby (sharp, justified forecasts) out with the bathwater.  
  - **Repair?** A continuous penalty (e.g., scaling with \( \max(p - 0.9, 0) \)) could soften distortions, but this approximates the quadratic rule’s natural curvature. Given our goals, adopting a proper rule is cleaner.  

  #### **Rulings on Cases**  
  1. **Team Crank (Unconventional Model)**:  
     - **Verdict**: Award the prize to Team Crank.  
     - **Reason**: The tournament’s core objective is accuracy. Team Crank’s score was higher, and we lack evidence of cheating or bad faith. Penalizing unconventional methods risks bias and undermines competitive fairness. That said, **require brief reasoning documentation** for all forecasts starting next season. This preserves auditability without subjective "quality" judging. If reasoning is absent, disqualify the forecaster.  

  2. **Interval Forecasts (Probability Ranges)**:  
     - **Verdict**: Require point probabilities; do not accept intervals.  
     - **How Scored**: Not applicable.  
     - **Reason**: Scoring ranges at the midpoint (e.g., [0.3, 0.7] → 0.5) is easily gamed. A forecaster with high confidence could report [0.8, 1.0] (midpoint 0.9) to mimic sharpness without risk, or widen intervals to hedge. Point probabilities ensure clarity and uniformity. Forecasters may note uncertainty in write-ups, but scoring demands a single number.  

  #### **Strongest Cases for Alternative Views**  
  - **For Ravi’s Rule**: Overconfidence is a persistent behavioral flaw in forecasting. Deterring extreme predictions (even if sometimes honest) prevents luck from trumping calibration, fostering humility.  
  - **For Rewarding Reasoning**: Accuracy alone may not capture "good judgment" (e.g., rigorous process, falsifiable models). If the goal is pedagogy, a "best reasoning" prize could complement the accuracy prize—but this should be a separate award, not a gate on the tournament.  

  #### **Implementation and Path Forward**  
  The quadratic rule is implementable by TAs—code it as `score = 100 * (1 - (outcome - probability)**2)` per question. It takes effect next season. If the committee rejects this, we’d need evidence that:  
  1. **Properness is unimportant**: If we’re willing to accept distorted forecasts (e.g., everyone reporting 0.89), Ravi’s rule could work.  
  2. **Reasoning trumps accuracy**: If the dean prioritizes methodological rigor over outcomes, we’d need a judging rubric for "quality."  

  This balances epistemic integrity and practicality. I urge adoption to align incentives with truth-seeking.  

