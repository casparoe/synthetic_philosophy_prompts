  The lecturer has created a modern parallel called the Tie-Break Protocol involving an autonomous warehouse robot. This scenario cleverly updates the medieval donkey problem with contemporary relevance. They're frustrated that students keep defaulting to simplistic explanations and want to force engagement with the nuanced distinction between indifference and incomparability.

  Key requirements for the essay question:
  - Must prevent students from just stating the donkey starves due to no preference
  - Needs to incorporate the Tie-Break Protocol case
  - Should force discussion of whether rationality requires sufficient reason to act
  - Must examine if choice becomes irrational when options are unrankable
  - Should be answerable in about an hour
  - Requires British English throughout

  The lecturer also wants:
  - A model answer (~700 words)
  - Marking scheme (out of 20) with common mistakes
  - Focus on the rationality debate around sufficient reason vs. merely not acting against preferences

  I'll structure the question to explicitly demand analysis of the indifference/incomparability distinction through the lens of the robot case. The phrasing should compel students to engage with whether the alphabetical rule provides a "reason" or merely masks arbitrariness. I'll ensure the question pushes them toward the core philosophical tension about rationality's demands.

  For the model answer, I'll:
  - Start by contrasting indifference and incomparability
  - Apply both concepts to the donkey and robot cases
  - Argue that rationality doesn't require positive reasons in cases of true indifference
  - Show how incomparability creates deeper challenges
  - Analyze the alphabetical rule's status as a reason
  - Conclude with implications for practical reason

  The marking scheme will prioritize:
  1. Correct distinction between indifference/incomparability
  2. Application to both cases
  3. Analysis of rationality requirements
  4. Evaluation of the alphabetical rule
  5. Philosophical depth

  Common pitfalls to flag include:
  - Conflating indifference and incomparability
  - Oversimplifying the donkey case
