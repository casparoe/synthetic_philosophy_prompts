  For industrial agriculture, Kant would likely condemn it vigorously but on anthropocentric grounds. His disgust at instrumentalization would target how this degrades human moral character rather than animal suffering itself. The "duty of self-respect" argument feels robust within his framework, though I wonder if he'd underestimate the systemic normalization of cruelty.

  The proposed legal category is trickier. Kant's strict separation between moral personality and legal right creates an opening here. He might accept guardianship as a pragmatic measure protecting human virtue, but would resist calling it a "duty of right" toward animals themselves. The key tension lies in whether legal interests can exist without moral personality—Kant would probably say no.

  Ah, the marginal cases argument—this is the real philosophical grenade. Kant's consistency would demand either downgrading vulnerable humans (unthinkable) or upgrading animals (system-shattering). His likely escape route: appeal to human dignity as a species characteristic. But this feels ad hoc and threatens his capacity-based foundation. 

  The Critique of Judgment angle fascinates me. If organisms are "natural ends," does that create moral traction? Probably not—Kant explicitly separates natural teleology from moral consideration. Still, the juxtaposition highlights a tension between his metaphysical and ethical systems.

