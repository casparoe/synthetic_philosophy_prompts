  ### Key Design Choices:
  - **3 teams (not 4)**: Subgroup fairness complicates setup without adding insight. The core tension is between **predictive parity (Team 1)**, **error equality (Team 2)**, and **demographic parity (Team 3)**.  
  - **Pre-calculated table**: Ensures teams spend time debating philosophy, not arithmetic. Numbers are derived from your setup (80% TPR, 20% FPR, base rates 50% for A, 25% for B).  
  - **The crunch**: Teams must confront that:  
    - Team 1’s rule (equal PPV) requires excluding most B applicants.  
    - Team 3’s rule (equal admission) guarantees more bad hires from B.  
    - Team 2’s rule (equal errors) allows both disparities.  
  - **No theorems in activity**: Save terms like *base-rate fallacy* or *impossibility theorem* for debrief.  

  ### Running Tips:
  - **Lean into discomfort**: When merger negotiations stall, say: *"What makes this so hard? Is there a 'win' here, or just tradeoffs?"*  
  - **Highlight tradeoffs**: "Team 3, if we use your cutoff, B’s hires are 25% good. Team 1, is that acceptable? If not, what do you give up?"  
  - **Debrief hook**: *"Last month we argued about fair algorithms. Today, you built one. Why was even *defining* fairness so divisive?"*  

  This forces the group to experience the impossibility firsthand. They’ll leave feeling the tension—not just hearing about it.
