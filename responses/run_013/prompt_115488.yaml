prompt: |-
  I'm a philosophy prof — political philosophy, and I run a seminar on corruption every other year — and for the past three years I've also sat on the ethics panel of a mid-sized NGO that runs clinics and drug-supply chains in about ten countries. Twice a month a country director emails us with something they need settled before money moves, and we keep improvising and contradicting each other. Recent ones: the district health officer who personally signs off on our permits has invited the whole team to his daughter's wedding, and everyone knows a goat and an envelope are expected; a driver job is about to go to the regional director's nephew, who is honestly the best candidate; customs wants a fee that's on no schedule but is what everyone pays.

  They've asked me to write a decision procedure that a country director with no philosophy training can run alone, in half an hour, and then run again next month on a different case and get a consistent answer. I need help writing it.

  The hard part, which I want the procedure to face rather than dodge: our compliance code is stricter than US anti-bribery law, which still carves out small payments to speed up things an official already has to do, and basically in line with the UK's, which on paper carves out nothing. One collegue on the panel says that on the collective-action picture — corruption as a stable social equilibrium rather than a few greedy individuals — a strict code is just a tax on being the one honest operator, and that we'd be imposing standards on people who never got a say in them. The other says that argument is what every captured official would make, and that appealing to local standards is what you do when you want to keep the contract. Both of them are right about something, and I need a procedure, not another seminar.

  What I want from you:

  - The procedure itself, as questions in order: what counts as a sufficient answer to each, where it stops with a no, where it stops with a yes, and where it hands off to a person because what's left is a value question rather than a factual one.
  - Say which distinctions from the philosophical literature on corruption have to survive the trip into a 30-minute checklist and which can be dropped. My hunch is that the load-bearing one is the difference between a rule aimed at improper influence on a decision and a rule aimed at any advantage to a public official, and that the timing-versus-outcome distinction is what makes the customs case tractable — but you tell me.
  - Run it on all three cases, and make at least one of them come out in a way the country directors won't like.
  - Where it misfires: the cases where it will give a confident answer that's probably wrong, the ones where it stalls, and what the director should do when it stalls.
  - No citations or reading lists — I know the literature, the directors dont, and the thing has to stand on its own.

  Keep it plain. Finish with a final line in exactly this form — \rule{...} — containing the single question in the procedure that does the most work, the one that, answered honestly, settles most cases, in under fifteen words.
reasoning: |-
  Hmm, the user is a philosophy professor specializing in political philosophy who runs a seminar on corruption and serves on an ethics panel for an NGO. They need help creating a practical decision procedure for country directors to handle ethical dilemmas in about 30 minutes. The directors face real-world issues like gift-giving at weddings, nepotism in hiring, and unofficial customs fees.

  The user wants a step-by-step procedure with specific features: it must be usable by non-philosophers, produce consistent results, handle value judgments appropriately, and include a signature question that does the heaviest lifting. They also want examples tested and limitations acknowledged.

  Key tensions to address:
  - Their NGO's strict compliance code versus practical realities on the ground
  - The collective-action problem (strict rules making them uncompetitive) versus moral absolutism
  - Philosophical complexity versus operational simplicity

  For the procedure design:
  1. Need sequential questions that escalate from factual to evaluative
  2. Must incorporate core distinctions without jargon
     - Crucial to keep: intent to influence (vs. routine advantage)
     - Can drop: nuanced debates about systemic vs individual corruption
  3. Should have clear stopping points (yes/no/refer)
  4. Must work for their three cases - with at least one "no" that'll be unpopular

  Testing the cases:
  - Wedding gifts: Likely stalls at "Is this expected for access?" - probably refers to ethics panel
  - Nephew hiring: Passes if truly merit-based (unpopular "yes")
  - Customs fee: Fails at "Would we pay if no delay?" since it's about speed

  Biggest challenge:
  - The "value judgment" handoff needs to be unambiguous. Country directors shouldn't feel empowered to override ethics.

  Signature question:
  Must capture the core of corrupt intent in under 15 words.
  → "Would the payment still happen if the official had no power over your work?"

  Final note: Emphasize that when stalled, directors MUST escalate - no discretion on value calls.
answer: |-
  Here's a decision procedure designed for speed, consistency, and confronting the core tension. It prioritizes **intent to influence** over abstract advantage and **systemic harm** over individual guilt. **Drop**: distinctions between bribes vs. facilitation payments, public vs. private corruption nuances, or cultural relativism debates. **Keep**: the difference between *securing undue influence* (always wrong) and *navigating unavoidable systemic dysfunction* (sometimes tolerable if harmless).

  ---

  ### The Procedure: "The Three Gates"
  *Run in order. Answer YES/NO only. If unsure, default to NO. Time: ~30 mins.*

  1. **GATE 1: IS IT REQUIRED?**  
     *"Is this payment, gift, or favor demanded (formally or informally) as a condition for the official to perform their normal, lawful duty?"*  
     - **YES** → STOP. **NO** (violates compliance code).  
     - **NO** → Go to Gate 2.  
     *Example: Customs fee for lawful clearance? YES → NO. Wedding gift? NO → Next.*

  2. **GATE 2: IS IT AVOIDABLE?**  
     *"Can we achieve the same lawful outcome through a reasonable alternative (e.g., waiting, official channels, documented refusal) without significant harm to patients/operations?"*  
     - **YES** → STOP. **NO** (choose the alternative).  
     - **NO** → Go to Gate 3.  
     *Example: Hiring nephew when no other drivers exist? NO → Next. Paying customs to skip a 3-month delay? NO → Next.*

  3. **GATE 3: DOES IT DISTORT?**  
     *"Would this action likely alter an official’s decision (e.g., awarding contracts, permits, jobs) away from merit, need, or fairness?"*  
     - **YES** → STOP. **NO** (violates core ethics).  
     - **NO** → STOP. **YES** (permissible under duress).  
     - **UNSURE** → Hand off to Ethics Panel.  
     *This gate handles "collective action" cases. If harm is unavoidable but no decision is corrupted, Gate 3 may allow it.*

  **When stalled at Gate 3 (UNSURE)**: Director MUST escalate to the Ethics Panel within 24 hours with all facts. No discretion on value judgments.

  ---

  ### Test Run on Cases
  **Case 1: Health officer’s wedding (goat + envelope)**  
  - Gate 1: Is it required? *NO* (not for lawful duty) → Proceed.  
  - Gate 2: Avoidable? *YES* (send polite refusal or small symbolic gift under $10) → **STOP. NO**.  
    *Why directors won’t like it: Refusal risks friction, but "avoidable" forces creative solutions.*  

  **Case 2: Hiring director’s nephew (best candidate)**  
  - Gate 1: Required? *NO* → Proceed.  
  - Gate 2: Avoidable? *NO* (if no other qualified candidates) → Proceed.  
  - Gate 3: Distort? *NO* (if hiring is merit-based and documented) → **STOP. YES**.  
    *Unpopular but consistent: Nepotism isn’t corrupt if no distortion occurs.*  

  **Case 3: Customs "fee" (everyone pays, no schedule)**  
  - Gate 1: Required? *YES* (de facto condition for release) → **STOP. NO**.  
    *Hardest case: Gate 1 catches this. "Required" includes informal but unavoidable demands. Compliance code wins.*  

  ---

  ### Where It Misfires
  - **Confident but wrong**:  
    - *False YES*: A truly best-candidate nephew (Gate 3: NO) might still erode local trust in fairness.  
    - *False NO*: Refusing a harmless gift (e.g., $5 trinket) in a culture where it’s rude not to give might damage relations unnecessarily.  
  - **Stalls (Gate 3 UNSURE)**:  
    - An official "suggesting" a vendor who is objectively good value.  
    - A "donation" to a hospital fund run by a permit-issuer.  
  - **Stall response**: Director escalates immediately. No independent judgment.

  ---

  \rule{0.5\textwidth}{0.5pt}  
  **Would this alter an official’s decision away from fairness?**  
  \rule{0.5\textwidth}{0.5pt}
