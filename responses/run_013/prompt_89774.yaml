prompt: |-
  I serve on the board of a small housing co-op — twelve units, a set of written bylaws, and, because we are all academics and slightly insufferable about procedure, a standing argument about our amendment clause. I would like to know whether the thing we keep colliding with has a name. The bylaws provide that they may be amended by a two-thirds vote at a special meeting, and that the secretary decides whether a proposed amendment is in order. Last year we passed an amendment, by the required two-thirds, that changed the amendment rule itself: from then on, amendments would pass by simple majority, and the chair rather than the secretary would rule on whether a proposal was in order. We thought we had been clever. Two objections followed. The secretary, in what I concede was a pointed gesture, ruled our amendment out of order on the ground that under the rules in force at the moment of the vote, the proposal to strip her of the ruling power was itself subject to her ruling. And another member argued that if the old clause really is gone, then every amendment we have ever passed was authorized by a rule that no longer exists, so all of them lapse. Nobody could say which objection was right, and nobody could say what rule would settle it, since the rule that would settle it is precisely what is in dispute. What struck me is that in each case we reached for something rule-shaped that is not a rule: we said the amendment really did pass because the members accepted it, or because it is what the founders would have wanted, or because holding otherwise would be absurd.

  I gather I am circling a known neighborhood. I once played a game, Nomic, I think, in which the only legal move is to change a rule, and I have the impression that legal philosophers have written a great deal about whether a rule can amend itself and about the sort of thing — acceptance, custom, force, an unamendable presupposition — that has to sit at the bottom and stop the regress. But the puzzle I keep reading about seems to be whether self-amendment is possible at all, and that is not my situation: ours went through, everyone has been operating under the new clause for a year, and the live question is what makes the act of changing the rule valid, and what that act does to everything authorized by the rule it replaced. So the label matters less to me than the carving, and a bare name will not satisfy me. Tell me whether there is an established concept that covers exactly this — the validity of the act that alters the very rule determining validity — or, if there is none, coin one and define it, and then do the work of marking its edges. In particular: how does it differ from the general paradox of self-amendment, from the idea of a foundational norm or a master rule that is accepted rather than valid, and from ordinary retroactivity? Is the retroactive-invalidation objection part of the same phenomenon or a distinct one? Is the rule-shaped non-rule we reach for — acceptance, custom, "the founders' intent" — a fourth thing, or just the familiar regress-stopper under a new name? And how do the boundary cases fall: an amendment that abolishes the authority that passed it, one that makes future amendment impossible, one that was passed under the old clause but purports to bind votes already taken under it? Please write the answer in American English, and where you introduce a term of art, define it in plain words before using it.
reasoning: |-
  Okay, this user is on the board of a small housing co-op with twelve units, all academics who love procedure. They're stuck in a debate about their bylaws amendment clause. They changed the amendment rule with a two-thirds vote, switching to a simple majority and giving the chair, not the secretary, the power to rule on amendments. But then two big objections came up: the secretary said the amendment was invalid because she should have ruled on it under the old rules, and another member argued that all past amendments are now invalid since the old rule is gone. 

  The user knows about Nomic and legal philosophy debates on self-amendment, but their issue is different. They're not asking if self-amendment is possible—it already happened—but what makes that act valid and what happens to everything authorized by the old rule. They want to know if there's a specific concept for this, or if not, to define one. They also want clear distinctions from related ideas like the paradox of self-amendment, foundational norms, retroactivity, and those "rule-shaped non-rules" like acceptance or founders' intent. 

  First, I recall H.L.A. Hart's idea of the rule of recognition—the basic rule that validates other rules. But in this case, the co-op changed that very rule. Hans Kelsen's Grundnorm comes to mind too—a presupposed basic norm. But the user needs practical answers, not just theory. 

  The key questions are: What validates the change? And does the new rule affect past amendments? The secretary's objection is about authority at the time of the vote. The other member's is about retroactive invalidation. The user also mentions "acceptance" as a fallback—people just went along with it. 

  For the validation part, self-amendment works if the rule allows changing itself. Here, the old rule didn't explicitly forbid that, so it should be okay. But the secretary's role creates a conflict of interest. That's a procedural hiccup, not invalidity. 

  On retroactivity, legal principles say changes don't undo past acts unless specified. So past amendments should stay valid. The "lapsing" argument is like saying a new constitution voids old laws, which isn't true—they're grandfathered in. 

  The "rule-shaped non-rule" is acceptance, which Hart calls the ultimate rule of recognition. In practice, the co-op has been operating under the new rule for a year, so it's accepted. 

  Boundary cases: If an amendment abolishes the authority that passed it, it might be void unless done right. Making future amendments impossible is fine if the rule allows it. And binding past votes? That's retroactive lawmaking, which is tricky and often unfair. 

  Overall, this situation is a mix of procedural validity and transition logic. The established concept is "amendment of the amendment rule" with nuances like conflict of interest and retroactivity. The user's deeper need is to resolve their board dispute with clear principles, so I'll structure the answer to address each objection and provide practical guidance.
answer: |-
  This is a beautifully articulated problem that lives at the intersection of legal theory, parliamentary procedure, and practical governance. You've correctly identified the core tension: **the validity of the act that changes the very rule determining validity.** While there isn't a single, universally agreed-upon term *exclusively* for this *specific* transition moment, the established concept you're circling is best described as the **"Amendment of the Rule of Recognition"** or the **"Amendment of the Foundational Procedural Rule."**

  Let's break it down, define terms, mark the edges, and address your specific questions:

  1.  **The Core Concept Defined:**
      *   **Rule of Recognition (RoR):** (A term from legal philosopher H.L.A. Hart). This is the fundamental, usually unwritten, rule in any legal or rule-based system that specifies *how* other rules are made, changed, and identified as valid. It answers the question: "What makes a rule in *this* system a *real* rule?" In your co-op, the amendment clause *is* your written Rule of Recognition. It tells you how bylaws become validly amended.
      *   **Amendment of the RoR:** This is the specific act of changing *that fundamental rule itself*. It's what your board attempted. The core puzzle is: **By what authority does the *current* RoR validate the act that creates a *new* RoR to replace it?** This act sits precariously *on* the boundary between the old and new systems of validity.

  2.  **Why "Amending the Rule of Recognition" Fits Your Case:**
      *   You changed *the rule that defines how rules are changed*. That's the essence of amending the RoR.
      *   The objections directly stem from this act: the Secretary claimed the *old* RoR (requiring her ruling) still governed the *act* of changing it, while the other member claimed the *new* RoR's existence invalidated everything created under the *old* RoR.
      *   Your "rule-shaped non-rules" (acceptance, founders' intent, avoiding absurdity) are precisely the things theorists point to as the *grounding* for the RoR itself when logic runs out.

  3.  **Marking the Edges: How It Differs From Related Concepts**
      *   **General Paradox of Self-Amendment:** This is the broader question: *Can* Rule A authorize its own change or destruction? Your situation *presupposes* self-amendment is possible (you did it!) and focuses on the *consequences* and *validity* of that specific act *during* the transition. The paradox asks "Can it happen?" Your question asks "Given it happened, how does it work, and what does it do?"
      *   **Foundational Norm / Master Rule (Grundnorm / Basic Norm):** (Terms from Hans Kelsen). This is similar to Hart's RoR – the presupposed, ultimate source of validity. The key difference is that theorists like Kelsen and Hart argue this norm *cannot itself be legally validated* by the system it founds; it's *accepted* as valid. Amending the RoR is the *practical attempt* to change this presupposed foundation *using the procedures derived from the old foundation*. The paradox arises because the act relies on the old norm to destroy it. The foundational norm is the *theoretical* bedrock; amending the RoR is the *practical act* performed on that bedrock.
      *   **Ordinary Retroactivity:** Retroactivity changes the legal consequences of *past acts or facts* (e.g., making yesterday's legal act illegal today). Amending the RoR is primarily *prospective*: it changes the rules for *future* actions (future amendments). The "lapsing amendments" objection *tries to apply it retroactively*, arguing the change invalidates past acts authorized under the old rule. This is usually a *misapplication* of the amendment's effect (see below).

  4.  **Analyzing the Specific Objections & Non-Rules**
      *   **The Secretary's Pointed Gesture (Conflict of Interest in the RoR):**
          *   **Objection:** The *act* of amendment was governed by the *old* RoR, which gave the Secretary the power to rule on its "orderliness." Her ruling (that a proposal stripping her power is inherently questionable) highlights a conflict built into self-amending the RoR.
          *   **Status:** This is a *procedural challenge within the old RoR*. It questions whether the *process* followed the rules *in force at that moment*. It's part of the broader puzzle of amending the RoR because it exposes the awkwardness of using the old rule to kill itself. **It is distinct from the retroactive-invalidation objection.**
          *   **Resolution (Theorists & Practice):** Most procedural systems (like Robert's Rules) hold that self-amendment is possible if the current rules allow rule changes *generally*. The conflict of interest is a practical political problem, not necessarily an absolute invalidation. The "rule-shaped non-rule" here is **"Acceptance"** or **"Effectiveness."** If the amendment passed by the required vote, and the body proceeded under the new rule (as you did for a year!), the act is *de facto* and *de jure* valid. The Secretary's ruling, while logically pointed, was likely *overruled by the vote itself* – the members collectively "accepted" the new rule, resolving the conflict by sheer action. Hart would say the new RoR became the accepted standard.

      *   **The Retroactive-Invalidation Objection ("All Past Amendments Lapse"):**
          *   **Objection:** If the old amendment clause is gone, then the *authority* under which *all past amendments* were passed no longer exists, so they become invalid.
          *   **Status:** This is a *fundamental misunderstanding* of legal continuity and retroactivity, though a common one. It confuses the *source of authority* with the *continued existence* of rules created under that authority. It *is* a consequence *claimed* to flow from amending the RoR, but it's generally considered incorrect.
          *   **Resolution (Legal Principle):** **"Grandfathering"** or **"Continuity of Law."** Legal systems assume continuity. An amendment changes the rules *going forward*. Rules validly created under the *old* RoR remain valid under the *new* RoR unless the amendment *explicitly* states it invalidates them. The new RoR *tacitly accepts* the existing legal landscape it inherits. Your founders' original bylaws, passed under whatever initial procedure existed, weren't invalidated by your first amendment; similarly, subsequent amendments aren't invalidated by changing the amendment rule itself. The "rule-shaped non-rule" here is **"Necessity"** or **"Avoiding Chaos."** Holding otherwise would lead to absurd, destabilizing results – precisely the outcome your member feared, and which legal systems inherently avoid. It would be like saying a new constitution voids every law passed under the old one, instantly collapsing the state.

      *   **The "Rule-Shaped Non-Rules":** Acceptance, Founders' Intent, Avoiding Absurdity. These aren't a "fourth thing." They are the **familiar regress-stoppers.** When formal rules run out (as they must at the foundation), validity rests on social facts:
          *   **Acceptance:** The rule is followed and treated as valid by officials (the board) and often the group (members). Your year of operation under the new rule is *strong evidence* of acceptance.
          *   **Historical Fact (e.g., "Founders' Intent"):** The original establishment of the system. (While often invoked, "founders' intent" is less reliable than ongoing acceptance for *current* validity).
          *   **Effectiveness/Necessity:** The rule works and is necessary for the system to function without chaos.

  5.  **Boundary Cases:**
      *   **Amendment Abolishing the Authority that Passed It (e.g., "The Board dissolves itself"):** *If* the current RoR explicitly allows this, it *can* be valid. The act is performed under the *current* authority. The key is whether the RoR grants that specific power. Success depends on the *new* structure (if any) being immediately effective and accepted. If the act creates a vacuum with no functioning authority, it might be deemed void as self-destructive beyond the system's capacity, or simply ineffective (no one to enforce it).
      *   **Amendment Making Future Amendment Impossible ("Entrenching"):** This is generally possible *if* the current RoR allows such a deeply entrenched rule. The new RoR becomes supremely rigid. Its validity rests entirely on acceptance and the effectiveness of the entrenchment clause itself. Many theorists argue true "unamendability" is conceptually tricky but practically possible if accepted.
      *   **Amendment Passed Under Old Clause Binding Future Votes:** This is **ordinary retroactive lawmaking** (changing rules for past acts/votes). It's generally disfavored as unfair. Whether it's *possible* depends on the *old* RoR: did it grant the power to make retroactive rules? Most amendment clauses are prospective. Trying to retroactively bind votes already taken under different rules is almost certainly invalid and unenforceable, violating principles of fairness and due process. *This is fundamentally different* from amending the RoR itself, which is prospective regarding future rule changes.

  **Conclusion & Practical Advice for Your Co-op:**

  You amended your **Rule of Recognition.** The act was **valid** because:
  1.  Your old RoR allowed amendment by 2/3 vote at a special meeting.
  2.  The proposal followed that procedure (meeting called, vote held, 2/3 achieved).
  3.  The Secretary's conflict-of-interest objection, while logically interesting, was **overcome by the collective acceptance embodied in the successful vote and subsequent year of adherence** to the new rule. The vote itself was the ultimate ruling on orderliness in that moment.
  4.  The retroactive-invalidation objection is **incorrect.** Past amendments remain valid under the principle of **legal continuity**; they were authorized by the RoR *in force at the time* and are inherited by the new system.

  **What to do now:**
  1.  **Formally Acknowledge Acceptance:** The board should formally minute that the amendment passed on [date] has been the operating procedure for a year and is accepted as valid.
  2.  **Clarify Continuity:** Explicitly state in the minutes (or consider a minor clarifying amendment under the *new* rule) that all bylaws and amendments validly adopted under *previous* versions of the amendment clause remain in full force and effect, unless explicitly repealed or amended under the *current* procedures. This shuts down the lapsing argument.
  3.  **Address Future Conflicts:** Consider amending the bylaws (under the *new* simple majority rule) to specify how challenges to the validity of *an amendment to the amendment clause itself* are handled (e.g., ruling by the Chair subject to appeal to the full membership vote). This reduces reliance on pointed gestures.

  The paradox isn't fully solvable by pure logic alone – it ultimately rests on the **social fact of acceptance.** Your co-op accepted the new rule by using it. That acceptance, demonstrated by your year of operation, is the bedrock stopping the regress in your specific case. The theoretical puzzle remains fascinating, but practically, your amendment stands, and your past bylaws are secure.
