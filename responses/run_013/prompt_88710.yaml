  ## Research Proposal: The Douglass Shift: Method, Meaning, and the Antebellum Constitution

  **Project Title:** The Douglass Shift: Method, Meaning, and the Antebellum Constitution

  **Principal Investigator:** [Your Name]
  **Department:** [Your Department]
  **Project Duration:** Summer [Year] (One Semester)
  **Final Deliverable:** 6000-word Term Paper

  **1. Abstract:**
  This project investigates a pivotal moment in American intellectual and constitutional history: Frederick Douglass’s mid-19th century shift from viewing the U.S. Constitution as inherently proslavery (aligning with William Lloyd Garrison) to arguing it was fundamentally antislavery. Moving beyond the surface debate about slavery's constitutional status, this research probes the *underlying mechanics* of Douglass’s transformation. The central question is: **Did Douglass primarily change his mind about a *fact* (what the Constitution objectively required) or about a *method* (how a constitution should be interpreted)?** By meticulously analyzing Douglass’s writings and speeches surrounding this shift (ca. 1849-1857), situating them within contemporary abolitionist debates, and engaging with modern constitutional theory, this project aims to demonstrate that the distinction between "fact" and "method" is inherently unstable. It argues that Douglass’s shift exemplifies how substantive conclusions about constitutional meaning are inextricably bound to, and indeed constituted by, the interpretive methodology employed, fundamentally challenging the notion that the Constitution's "proslavery" nature was a determinate fact independent of interpretive choice.

  **2. Specific Aims and Research Question:**
  The core question driving this research is deliberately precise yet philosophically rich: **When Frederick Douglass altered his stance on the Constitution’s relationship to slavery between 1849 and 1857, was the fundamental change in (A) his understanding of the *substantive content and requirements* of the constitutional text itself (a change in factual conclusion), or (B) his understanding of the *proper criteria and principles* for interpreting constitutional language (a change in interpretive method)?**

  This question immediately raises a deeper, meta-theoretical layer: **Is it even possible to cleanly separate a conclusion about constitutional meaning from the method used to arrive at that conclusion? Does every claim about what the Constitution "is" or "requires" implicitly presuppose an interpretive theory, and conversely, does the adoption of any interpretive theory inherently favor certain substantive outcomes?** The project contends that examining Douglass's shift provides an exceptionally clear historical lens through which to test the stability of this fact/method distinction and assess whether debates like Douglass vs. Garrison are ultimately disagreements about the *document itself* or disagreements about *what constitutes the document's meaning in the first place*.

  **3. Why Existing Frameworks Don't Settle It:**
  The common paradigms of constitutional interpretation fail to provide a definitive answer to this specific question about the nature of Douglass's shift:
  *   **Originalism (Intent & Expectation):** Garrison's approach mirrors originalist intent/expectation. It yields a "proslavery" conclusion but *assumes* this method reveals the "true" meaning. It doesn't explain *why* Douglass abandoned this method *as* the correct one, or whether the method itself is inseparable from its conclusion.
  *   **Textualism/Formalism:** Douglass's later stance resembles a strict textualism focusing on the absence of "slave" and the Preamble's stated ends. However, labeling it "textualism" doesn't reveal whether Douglass saw this as discovering a pre-existing textual fact or adopting a new, superior method. Did the text's meaning change, or did the lens?
  *   **Living Constitutionalism/Dynamic Interpretation:** While Douglass emphasized ends like "justice" and "liberty," his later arguments were framed as uncovering the document's *true, fixed* meaning, not evolving it. This framework struggles to capture the *epistemological* shift at the heart of his change.
  *   **Communitarian/Pragmatic Approaches:** Viewing meaning as what the community "does" with the text risks rendering Douglass's earlier and later positions simply reflections of different political communities (radical vs. political abolitionists), potentially reducing the shift to pure political expediency ("switcheroo") without grappling with Douglass's own sophisticated intellectual justification for the change in method.

  Each framework tends to *presuppose* its own answer to the fact/method question. Originalism assumes meaning *is* original intent (fact determined by method). Textualism assumes meaning *is* the semantic public meaning of the words (another fact determined by method). The project aims to step *behind* these frameworks to investigate the *choice* and *justification* for the method itself, using Douglass as a case study.

  **4. Methodology and Work Plan:**
  This project employs close textual analysis, historical contextualization, and philosophical/theoretical engagement.

  *   **Month 1: Close Reading of Douglass:** Conduct a focused chronological analysis of Douglass’s key speeches, editorials, and letters from 1849 (e.g., "The Constitution and Slavery") through 1857 (e.g., "The Dred Scott Decision"). Pay meticulous attention to: (a) How he describes the Constitution's provisions (3/5, fugitive slave, etc.); (b) How he justifies his reading (appeals to founders' intent, textual language, stated purposes, natural law); (c) Explicit statements *about* interpretation itself; (d) How he characterizes his own change (discovery vs. realization of error in method?).
  *   **Month 2: Contextualizing the Shift:** Research the contemporaneous debates within abolitionism (Garrisonian vs. political/anti-Garrisonian factions like Gerrit Smith, Liberty Party). Analyze critiques of Douglass's shift and his rebuttals. Examine relevant legal arguments (e.g., Lysander Spooner's *Unconstitutionality of Slavery*) to understand the methodological landscape he was navigating. Assess the political pressures and strategic considerations.
  *   **Month 3: Theoretical Framing and Synthesis:** Engage with modern constitutional theory (e.g., Dworkin on interpretation, Fish on interpretive communities, debates on originalism's status) to refine the conceptual framework for analyzing the fact/method distinction. Synthesize findings from Months 1 & 2. Develop the argument about the instability of the distinction and its implications for understanding constitutional meaning. Outline the paper.
  *   **Final Weeks:** Write and revise the 6000-word paper, integrating historical evidence, theoretical analysis, and the core argument about the co-constitution of method and meaning exemplified by Douglass.

  **5. Expected Outcomes and Assessment:**
  *   **Successful Result:** A paper that clearly demonstrates:
      1.  Douglass articulated a sophisticated *justification* for changing his interpretive method, grounded in arguments about the nature of constitutions (e.g., their purpose, the status of ambiguous text, the hierarchy of clauses).
      2.  This methodological shift was inextricably linked to the substantive conclusion; the "antislavery Constitution" was the product *of* the new method, not an independently discovered fact.
      3.  Therefore, the Garrison/Douglass debate was fundamentally a conflict over *interpretive authority* (whose method defines meaning?) rather than a simple disagreement over a stable, pre-existing textual fact.
      4.  This historical case study illuminates the persistent theoretical difficulty of cleanly separating constitutional "fact" from interpretive "method."
  *   **Failure Conditions:** The project would fail if:
      1.  Evidence shows Douglass *did* primarily frame his shift as discovering new textual/historical facts he previously missed.
      2.  Analysis reveals the shift *can* be fully explained by political expediency without significant intellectual justification for the methodological change.
      3.  The fact/method distinction proves robust and unambiguous in Douglass's own articulation of his views.
      4.  The historical/theoretical synthesis remains underdeveloped or unconvincing.

  **6. Feasibility and Timeline:**
  This is ambitious but feasible for a focused summer project culminating in a substantial paper. One semester provides sufficient time for:
  *   **Focused Primary Sources:** Douglass's key writings on the Constitution during this period are finite and accessible (collected speeches, *North Star*/*Frederick Douglass' Paper* archives).
  *   **Targeted Secondary Reading:** Research can concentrate on abolitionist schism historiography and specific theoretical texts relevant to interpretation, avoiding exhaustive literature reviews.
  *   **Manageable Scope:** The project centers on one thinker's specific intellectual shift within a defined timeframe, using it to explore a targeted theoretical question. It does not require comprehensive coverage of all abolitionist thought or the entire history of constitutional interpretation.
  Success depends on disciplined focus during each monthly phase and efficient synthesis. The goal is depth on *this* question through *this* case, not breadth.

  **7. Significance and Justification for Funding:**
  Understanding Douglass's constitutional shift is crucial for:
  *   **American Intellectual History:** It illuminates a critical moment in Black political thought and the strategies of abolitionism.
  *   **Constitutional Theory:** It provides a powerful historical test case for fundamental questions about the nature of constitutional meaning, the relationship between text, intent, and interpretation, and the very possibility of a "neutral" constitutional fact. This directly informs contemporary debates raging around originalism, textualism, and judicial review.
  *   **Critical Engagement with Founding Narratives:** The argument over the Constitution's relationship to slavery remains central to American identity and political discourse. This project contributes a nuanced perspective on that debate by examining *how* such arguments are constructed methodologically.
  Funding this project supports rigorous intellectual inquiry into the foundations of American constitutionalism using a pivotal historical moment. It promises to yield a significant scholarly paper contributing fresh insights to ongoing interdisciplinary conversations in history, political theory, and legal studies. The project moves beyond simplistic "pro/con" readings of the Constitution's stance on slavery to interrogate the deeper structures of constitutional interpretation itself, a question of enduring relevance.

  **Conclusion:**
  This project seeks to resolve a personal intellectual dispute through rigorous scholarship, transforming a 2am argument about Frederick Douglass into an investigation of a fundamental problem in constitutional theory. By dissecting the nature of Douglass's shift – factual or methodological? – and demonstrating the inherent instability of that distinction, the research will illuminate not only a critical moment in the fight against slavery but also the enduring complexities of how we derive meaning from foundational legal texts. The project is tightly scoped, methodologically sound, and promises a substantive contribution worthy of summer research support.
