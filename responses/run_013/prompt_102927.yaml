  ## Joint Statement: Adversarial Collaboration on Conditionals

  ### 1. Agreed Claims

  We, the undersigned, agree on the following points:

  1. **Inadequacy of the Material Conditional**: The material conditional analysis (where 'If P, Q' is equivalent to 'not-P or Q') is inadequate for both indicative and counterfactual conditionals. It fails to capture the intuitive judgments about conditionals in many cases, including the fact that conditionals often seem to carry a connection between antecedent and consequent beyond mere truth-functional relations.

  2. **The Oswald/Kennedy Pair**: We agree that the following pair of conditionals can both be true, and that any adequate theory must account for this:
     - Indicative: "If Oswald didn't kill Kennedy, then someone else did."
     - Counterfactual: "If Oswald hadn't killed Kennedy, then someone else would have."
     The truth of the indicative does not entail the truth of the counterfactual (and vice versa). This shows that the two types of conditionals are not equivalent and that context (including the epistemic state) plays a crucial role.

  3. **Exportation**: We agree that the following inference pattern (exportation) is generally valid for both indicative and counterfactual conditionals:
     - From: "If P and Q, then R"
     - To: "If P, then if Q, then R"
     However, we note that there may be exceptional contexts where this fails.

  4. **Antecedent Strengthening**: We agree that the following inference pattern (antecedent strengthening) is generally invalid for both indicative and counterfactual conditionals:
     - From: "If P, then Q"
     - To: "If P and R, then Q"
     Counterexamples are easily constructed (e.g., "If I strike this match, it will light" does not imply "If I strike this match and it is wet, it will light").

  5. **What is to be Explained**: We agree that a theory of conditionals must account for:
     - The difference in use and acceptance conditions between indicative and counterfactual conditionals.
     - The role of context (epistemic and metaphysical) in the evaluation of conditionals.
     - The fact that conditionals are non-monotonic (as shown by the failure of antecedent strengthening).
     - The intuitive judgments of speakers in a wide range of cases.

  ### 2. Disagreements Table

  We now turn to the points of disagreement. For each, we state the question, each camp's formulation, the crux of the disagreement, a shared test case, and each camp's prediction.

  | Question | Camp A's Formulation | Camp B's Formulation | Crux | Shared Test/Case | Prediction A | Prediction B |
  |----------|----------------------|----------------------|------|-----------------|-------------|-------------|
  | **Truth Conditions of Indicative Conditionals** | Camp A: Indicative conditionals have truth conditions. They are true (or false) in virtue of the facts in the relevant possible worlds determined by the context (e.g., the closest worlds where the antecedent is true). | Camp B: Indicative conditionals do not have truth conditions. They are devices for expressing conditional probabilities (e.g., the probability of the consequent given the antecedent). | The crux is whether indicative conditionals can be meaningfully said to be true or false in the same way as ordinary declarative sentences. | **Case: The Doctor's Biopsy**<br><br>**Scenario**: A doctor, before knowing the biopsy result, says: "If the biopsy is negative, the patient will recover." Later, the biopsy comes back positive, and the doctor says: "If the biopsy had been negative, the patient would have recovered."<br><br>**Agreed Description**: Both sides agree that the doctor's indicative conditional (said before the result) is appropriate and acceptable. The counterfactual conditional (said after the positive result) is also appropriate and acceptable. However, the two conditionals are not equivalent and may have different truth values. | Camp A: The indicative conditional has a truth value. In the context before the result, the indicative conditional is true if in all the relevant (epistemically accessible) worlds where the biopsy is negative, the patient recovers. The counterfactual is true if in the closest metaphysically accessible worlds (where the biopsy is negative, but holding fixed the actual positive result and its implications) the patient recovers. | Camp B: The indicative conditional does not have a truth value; it expresses a high conditional probability of recovery given a negative biopsy. The counterfactual, however, does have a truth value (it is a statement about how things would have been) and is true in this case (assuming the patient's recovery is determined by the biopsy). |
  | **The same case but with antecedent known false** | | | | **Variant**: Consider the same scenario, but now at the time of the first utterance, the doctor already knows the biopsy is positive (so the antecedent is known false). The doctor says: "If the biopsy is negative, the patient will recover."<br><br>Both sides agree that in this variant, the indicative conditional is infelicitous or defective. | Camp A: The indicative conditional is still truth-evaluable. However, in the context where the antecedent is known false, the relevant set of epistemically accessible worlds does not include any where the antecedent is true. Thus, the conditional is vacuously true by the semantics (if we use a strict conditional) or may be undefined (if we use a variably strict analysis). But Camp A notes that the assertion is infelicitous because it violates a pragmatic rule against asserting conditionals with known-false antecedents. | Camp B: The indicative conditional, when the antecedent is known false, is not assertable because it would require the speaker to conditionalize on a proposition with probability zero, which makes the conditional probability undefined. Thus, the conditional is not merely infelicitous but also lacks a clear conditional probability. Camp B maintains that indicative conditionals are not truth-apt, so they don't have a truth value in this case either. |
  | **The relationship between indicative and counterfactual conditionals** | Camp A: Indicative and counterfactual conditionals are of the same semantic kind (restricted modals) but differ in the accessibility relation or selection function. The indicative uses an epistemic accessibility relation (worlds compatible with what is known), while the counterfactual uses a metaphysical one (worlds that are historically close). | Camp B: Indicative and counterfactual conditionals are fundamentally different. Indicatives are non-truth-conditional expressions of conditional probability, while counterfactuals have truth conditions and are often analyzed using possible worlds (but this is a separate semantic mechanism). | The crux is whether the difference between the two types is merely a matter of context (affecting the accessibility/selection) or a deeper semantic divide. | **The Oswald/Kennedy case and the Doctor's Biopsy case** (as above). We examine whether the same underlying semantic machinery can be applied to both. | Camp A: The same semantic core (a restricted modal operator) applies to both, with context adjusting the accessibility relation. The difference in the Oswald/Kennedy pair and the Doctor's Biopsy is due to the shift from an epistemic to a metaphysical accessibility relation. | Camp B: The indicative in the Doctor's Biopsy is not truth-conditional, so it cannot be the same semantic machinery. The counterfactual, being truth-conditional, requires a different analysis. The difference is not just contextual but semantic. |

  ### Verbal Dispute

  Part of the dispute is verbal. The term "conditional" might be used to cover two distinct linguistic phenomena. Camp A uses "conditional" to refer to a unified semantic category (with context determining the flavor). Camp B reserves "conditional" for a syntactic form that may correspond to two different semantic types. The disagreement about whether indicative conditionals have truth conditions is substantive, but the question of whether they are "the same kind" as counterfactuals might be terminological to some extent. However, the substantive disagreement remains about whether indicative conditionals have truth conditions and whether the same semantic framework can account for both.

  ### Conclusion and Confidence

  We conclude that while we have found common ground on several important points (as outlined in the agreed claims), the fundamental disagreements about the truth-aptness of indicative conditionals and the unity of the semantic analysis of conditionals remain.

  - Camp A remains confident that a unified possible-worlds semantics can account for both indicative and counterfactual conditionals by adjusting the accessibility relation, and that indicative conditionals have truth conditions.
  - Camp B remains confident that indicative conditionals lack truth conditions and are expressions of conditional probability, while counterfactuals are truth-conditional and require a separate analysis.

  The point we are least sure about is the exact nature of the infelicity in the variant of the Doctor's Biopsy case where the antecedent is known false. Both sides agree it is infelicitous, but the explanation (pragmatic for Camp A, probabilistic for Camp B) is still under debate. Moreover, we are least sure whether the conditional probability account can be extended to counterfactuals or whether the possible-worlds account can fully capture the probabilistic nature of indicative conditionals without positing truth conditions.

