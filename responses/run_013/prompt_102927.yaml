  We are drafting a joint statement after an adversarial collaboration between two camps:

  Camp A: Truth-conditional possible-worlds semanticist. They treat indicative and counterfactual conditionals as one kind (restricted modal), differing only in the accessibility relation or selection function (which may be context-dependent). They assign truth conditions to both.

  Camp B: Conditional-probability theorist. They deny truth conditions to indicative conditionals (treating them as expressing a conditional probability) but grant truth conditions to counterfactuals (which they might analyze differently, e.g., using possible worlds or other means).

  We structure the statement as follows:

  1. **Agreed Claims**: A numbered list of points both sides agree on.
  2. **Disagreements Table**: A table with columns:
     - Question: the issue under dispute.
     - Camp A's Formulation: how Camp A describes their position on this issue.
     - Camp B's Formulation: how Camp B describes their position.
     - Crux: the core of the disagreement.
     - Shared Test/Case: a case or argument that both sides agree is relevant and can test the disagreement.
     - Prediction A: what Camp A predicts about the case.
