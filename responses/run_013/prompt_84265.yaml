answer: |-
  Below is your prep sheet. It's structured for rapid deployment in real-time Q&A, with phrasing calibrated to your audience's biases. I've distilled each reply to its rhetorical core: concede minimally, pivot to your framing, and anchor in concrete implications. The objections are ordered by *conceptual damage if fumbled*, not likelihood. 

  ---

  **Scratch List (Factional Decisive Objections - Discard After Reading)**  
  *Applied Stats/Biostats:* "If you preregister and split samples, reference classes become operational, not philosophical."  
  *de Finetti Bayesians:* "Exchangeability dissolves this; your constraint is redundant."  
  *Philosopher:* "Ex ante availability is either synchronic (trivial) or diachronic (begs the question)."  
  *Fairness Researcher:* "Procedural constraints legitimize dominant classifications; you ignore power asymmetry."  

  ---

  **Prep Sheet: 8 Objections & Replies**  
  *(Ordered by descending damage potential if fumbled)*  

  1. **Objection (Fairness Researcher):** "Your constraint only audits *how* a reference class is chosen, not whether it’s just. If a bank uses 'race' in credit scoring because they 'could have' specified it ex ante, you ratify oppression. This makes your view complicit."  
     *➔ Reply (90 sec):* "The constraint doesn’t endorse any class—it filters *inadmissible* ones. Saying a class *may* be used isn’t saying it *should*. Ex ante availability forbids, say, defining a class *after* seeing loan defaults to manufacture racial disparities. But it doesn’t touch whether race *ought* to be used at all—that’s an ethical question for auditors, legislators, or courts. My constraint ensures statistical integrity; fairness requires more, but it starts here."  
     *➔ Honest Note:* Soft on how "could have specified" interacts with biased historical data. Bluffing that ethics can be "added later"; this *is* separable but may sound evasive.  

  2. **Objection (de Finetti Bayesian):** "Exchangeability already tells us which partitions matter—via the agent’s subjective beliefs. Your 'ex ante availability' is just a frequentist ritual. Why not drop the reference-class talk?"  
     *➔ Reply (75 sec):* "Exchangeability doesn’t select the *partition*; it assumes one. If I’m exchangeable over 'all patients,' but you’re exchangeable over 'patients with this genotype,' our probabilities diverge. Ex ante availability asks: *When* did you commit to that genotype partition? If after seeing outcomes, your inference isn’t Bayesian coherence—it’s data dredging in subjective clothing. This constrains *which* exchangeability judgments are legitimate."  
     *➔ Honest Note:* Soft on whether "legitimate" is coherentist or external. Bluffing that de Finetti would nod; he’d likely reject any constraint beyond coherence.  

  3. **Objection (Applied Statistician):** "This sounds like the 'narrowest available class' dogma. But if I’m ignorant and only have broad-class data, you force me to use it—even when finer classes exist. You’re rewarding laziness, not solving anything."  
     *➔ Reply (60 sec):* "No—it forbids *using* classes you *couldn’t* have specified ex ante. If finer classes *existed* but you lacked data, you’re free to use broad classes. But if you *invent* a fine class post-hoc (e.g., 'left-handed redheads in July'), my constraint blocks it. Ignorance isn’t rewarded; fabrication is penalized. This isn’t about narrowness; it’s about temporal discipline."  
     *➔ Honest Note:* Soft on whether "fabrication" includes well-motivated subclasses. Bluffing that "could have specified" covers scientifically justified subgroups pre-data.  

  4. **Objection (Philosopher):** "Is ex ante availability synchronic or diachronic? If synchronic, it’s toothless—agents can always invent classes pre-data. If diachronic, it smuggles in a decision theory we don’t accept."  
     *➔ Reply (90 sec):* "Diachronic, but minimally: it only governs *learning from frequencies*. When you learn an outcome, you can’t retrofit a reference class to fit it. Synchronic constraints *would* be toothless—agents *can* pre-specify arbitrary classes. But diachronic doesn’t require full decision theory; just that you don’t use statistics from classes defined *by* the outcome. Like: you can’t define 'people who won the lottery' *after* seeing Bob win."  
     *➔ Honest Note:* Soft on whether "defined by the outcome" is always clear-cut. Bluffing that this avoids commitment to belief revision models.  

  5. **Objection (Biostatistician):** "We solve this with preregistration and sample splitting. Your philosophy is just armchair versions of tools we have. Why complicate it?"  
     *➔ Reply (60 sec):* "Preregistration *is* ex ante availability for study designs! But my constraint applies *outside* trials—to one-off predictions, like 'What’s the risk this defendant reoffends?' You can’t split samples there. And even in trials, preregistering *which* reference classes you’ll analyze is rare. I’m generalizing your solution, not complicating it."  
     *➔ Honest Note:* Soft on how constraint binds outside controlled studies. Bluffing that "one-off predictions" are common enough to matter.  

  6. **Objection (Epistemologist):** "This governs assertions but not credences. If I *believe* based on an inadmissible class, am I irrational? If not, why care?"  
     *➔ Reply (75 sec):* "It governs *inferential practices*, not private credences. If you assert 'P(outcome) = 0.8' using a class specified post-hoc, that claim is invalid—even if your credence is coherent. Like: a journal shouldn’t publish it; a court shouldn’t hear it. But if you *think* it in your armchair? Go ahead. This is about what we can *cite as evidence*, not what we believe."  
     *➔ Honest Note:* Concedes ground on credences. Bluffing that "evidence" ≠ "belief" will satisfy the room.  

  7. **Objection (Theory Seminar):** "In machine learning, we optimize classes algorithmically. If the model selects a class pre-data via cross-validation, is that 'ex ante'?"  
     *➔ Reply (45 sec):* "Yes—if the class *definition* (e.g., the feature set) is fixed before seeing the *test-set* outcome. Cross-validation simulates ex ante discipline by splitting data. But if you tune classes *on* the test set, it’s out. My constraint isn’t anti-ML; it’s why methods like HASTIE work."  
     *➔ Honest Note:* Weak on whether CV fully satisfies "could have specified."  

  8. **Objection (General):** "This kills exploratory analysis. Science needs post-hoc class discovery."  
     *➔ Reply (45 sec):* "Explore all you want! But don’t *assign probabilities* from classes you just discovered. Use them to form hypotheses, then test them *fresh* data. My constraint targets inference, not curiosity."  
     *➔ Honest Note:** Ignores that exploratory stats often leak into inference.  

  ---

  **Opening Concessions (First 5 Minutes)**  
  - **CONCEDE:** "Ex ante availability doesn’t solve the reference class problem—it replaces it with a gatekeeping question. Some arbitrariness remains."  
  - **CONCEDE:** "This is *not* just preregistration. Preregistration is one way to satisfy it; my constraint is broader and applies to non-experimental settings."  
  - **HOLD BACK:** Don’t admit the constraint can be "gamed" by pre-specifying overly broad classes. Save that for Q&A rebuttals.  

  ---

  **The Decisive Objection**  
  - **Which:** #1 (Fairness Researcher’s "political inertness" charge).  
  - **If Lost:** The talk becomes "ivory-tower philosophy," alienating applied/fairness factions. You lose the room’s goodwill, and subsequent objections gain force.  
  - **Win Condition:** Stress that the constraint *enables* fairness audits by exposing illegitimate classes. Without it, power operates unchecked by statistical accountability.  

  ---

  **The Question You Hope Nobody Asks**  
  *"Give a concrete example where your constraint forbids a *reasonable* inference that exchangeability or sample splitting allows."*  
  - **Why It’s Deadly:** Forces you to choose:  
    - If you pick a "unreasonable" case (e.g., data dredging), critics say "We already avoid that!"  
    - If you pick a "reasonable" case (e.g., a post-hoc subgroup with strong causal rationale), you seem dogmatic.  
  - **Mitigation:** Preempt by discussing the lottery example in your talk. If asked, say: "In causal inference, if you *only* notice a confounder post-outcome, my constraint bars using it for *this* prediction—but you can use it for the *next* one. That’s a cost, yes, but it prevents self-fulfilling statistics."  

  ---  

  **Delivery Mantra**  
  *"Three sentences: What I allow, what I forbid, why it matters."*  
  Example for #2: "I allow any exchangeability judgment you pre-commit to. I forbid retrofitting partitions to fit outcomes. This matters because coherence alone permits self-deception." Stick to this, and you’ll survive. Bring water; hostile rooms dry throats fast.
