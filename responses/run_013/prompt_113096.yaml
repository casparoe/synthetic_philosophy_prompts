prompt: |-
  I am a high school student working on an independent-study project about the doomsday argument, and I would like you to do a translation exercise with me rather than explain the argument in the usual way. My background is AP Statistics (expected value, conditional probability, Bayes' rule used informally, sampling distributions) and self-taught Python (lists, loops, the random module); I have written Monte Carlo simulations before, for instance estimating probabilities by running many trials. Arrays and simulation I am comfortable with; measure theory and advanced probability I am not, so please keep the target vocabulary inside that range, and flag any point where you are forced outside it.

  The position to translate is the doomsday argument: roughly, that since I am one human among the roughly one hundred billion who have ever lived, and my birth rank should be treated as a random draw from all humans who will ever live, a rank this low is more probable if the total number of humans who will ever live is small than if it is enormous, so I should shift my credence toward humanity ending relatively soon. Restate this argument and the main replies to it in the vocabulary of Monte Carlo simulation and basic probability, as faithfully as you can, and then give me a residue report.

  Please structure the answer in two parts.

  Part 1: a table with exactly these four columns.
  - Element of the argument
  - Counterpart in simulation vocabulary
  - Fidelity, filled in with exactly one of: clean, strained, none
  - What the translation loses, or the word nothing if it loses nothing

  Include at least one row for each of the following, and add further rows if the translation needs them: (1) the premise that my birth rank is a random draw from all humans who ever live; (2) the step from a low birth rank to a smaller total population; (3) the reply that a world containing more people contains more observers and so should not be counted as one world among equals, i.e. that worlds should be weighted by how many observers they contain; (4) the reply that nothing licenses treating me as a random draw in the first place; (5) the problem of fixing the reference class (humans? all observers? all beings that can ask this question?); (6) the role of the prior over possible total populations; (7) what a simulation of the argument would actually compute if I sat down and wrote it, and whether running it would settle anything.

  Part 2: a single JSON object, with nothing after it, containing exactly these fields.
  - "clean_translations": array of strings, the elements that carried over without loss.
  - "strained_translations": array of strings, the elements that carried over only with distortion, each string naming the element and the distortion.
  - "untranslatable": array of strings, the elements with no counterpart in the target vocabulary at all.
  - "residue_verdict": exactly one of "the simulation vocabulary is missing something the argument needs", "the argument was less clear than it looked", "a genuine mix".
  - "residue_explanation": string, at most 150 words, saying what the residue shows.
  - "does_simulation_settle_the_dispute": exactly one of "yes", "no, but it isolates what the dispute is about", "no".
  - "what_simulation_does_settle": string, at most 100 words.
  - "next_thing_to_look_up": string, one topic or idea, described rather than cited.

  A few constraints. I do not need citations and I will add the names and references myself, so please do not name books, papers, or living researchers; if you need to keep two positions apart, describe them instead of labelling them. Do not hedge by telling me the argument is controversial and unresolved: I want to know precisely where the translation breaks, and whether the break is a defect of the simulation vocabulary or a sign that the philosophical claim was never as precise as it sounded. Do not smuggle the simulation framework's assumptions in and call the result a translation; if some step of the argument only looks plausible once I have already assumed a sampling procedure, say so plainly. Finally, if the honest answer is that the translation is close to trivial because both vocabularies are already probabilistic, say that too, and explain what, if anything, the simulation framing adds. The whole answer should stay under about 1400 words, with a few sentences per table row.
