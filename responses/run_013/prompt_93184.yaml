prompt: |-
  My first year out of college I spent about ten months working in a district office of the education ministry in a country I won't name, and I'm still close with two people from that office, Ravi and Mariam, who have been re-fighting the same argument for years now. The case that started it: a district education officer, call him Mr. A, sat on the committee that awarded the textbook supply contract. Maybe four months after the contract was signed, the company's owner turned up at Mr. A's daughter's wedding and gave a very large gift -- publicly, in front of a couple hundred guests, which is the ordinary way people give at weddings there, and Mr. A's family had given comparable gifts at the owner's two family weddings over the previous decade. Also worth knowing: Mr. A hadn't been paid in five months, the district office was broke. Ravi says this is corruption, full stop, and that anyone who says otherwise is doing the relativist soft-shoe. Mariam says calling it corruption is a category mistake dressed up as moral seriousness.

  Their exchange goes roughly like this. (1) Ravi: an official with discretion over a contract took a substantial private benefit from the person who won that contract. That's the whole of it, and the wrapping paper doesnt matter. (2) Mariam: by that rule the man can't have a social life. Everyone in that town gives at weddings, the amounts track the relationship, and his family has given about as much as it's gotten. What Ravi is calling corruption is just reciprocity, and it only looks sinister because he's importing an arm's-length market picture where any transfer between two people who have dealings must be a price. (3) Ravi: the reciprocity defense proves too much, since any payoff can be dressed up as a gift, and it also proves too little, because real reciprocity is diffuse -- if this were ordinary social exchange, the flows would run in many directions, not from one live contractor to the one official who mattered. And notice what "the amounts track the relationship" concedes: the relationship is being priced. (4) Mariam: two things. First, she thinks a gift and a bribe differ in kind and not just in labeling: a bribe closes a transaction, whereas a gift opens an open-ended obligation that neither side can settle or price, which is why gifts are how people here make and keep relationships rather than how they buy things. Second, she says Ravi keeps sliding from "this is corruption" to "he's a bad man," and those come apart -- and if the category of corruption is defined by whatever the local rules happen to forbid, then it's just law-breaking with a scowl, and any state could legalize its way out of corruption. (5) Ravi: then he'll take the other horn -- the standard has to be something like a public official converting entrusted power into private benefit, which is exactly what happened, and if the local rules don't forbid it, so much the worse for the local rules. He also says her gift-versus-bribe distinction is the weakest thing she's said, since an open-ended, unpriced, untraceable obligation is worth more to an official than a completed payment, not less.

  I'm the one who introduced them, so I get asked to referee every time, and I keep failing at it. Can you go through this move by move and tell me who's right about what -- not a mushy "they both have a point," but for each of the five, whether it holds up, what's wrong with it if anything, and what that person should have said instead? Then tell me what they're both missing, and give me your actual verdict on the wedding gift itself. I'd also like to know which details would flip your answer: if he'd personally asked for the gift, if it had been cash in an envelope instead, if the giver had lost the bid, or if the town's own opinion were that the gift was shameful. American English, please.
reasoning: |-
  Okay, the user presents a complex ethical debate between Ravi and Mariam about whether a wedding gift constitutes corruption. They want a clear verdict on each argument point without ambiguity. 

  First, I need to unpack the layers here. The core tension is between universalist ethics (Ravi) and cultural contextualism (Mariam). The user's frustration with "mushy" responses suggests they've encountered superficial analyses before. 

  Looking at the five argument exchanges:
  - Ravi's initial point relies on a transactional definition of corruption. Valid but oversimplified - it ignores social embeddedness.
  - Mariam's reciprocity defense is culturally astute but dangerously permissive. Her categorical gift/bribe distinction feels naive.
  - Ravi's "proves too much/proves too little" counter is logically strong but misses that not all reciprocity is corrupt.
  - Mariam's open-ended obligation theory is interesting anthropologically but ignores power asymmetry.
  - Ravi's "converting public power" standard is conceptually solid but risks cultural imperialism.

  The key gap is both overlook institutional context: broke government, unpaid officials create systemic vulnerability. Neither addresses how such systems weaponize social norms.

  On the gift itself: it's institutionally corrupt because the public/private boundary dissolved. The amount/source/timing make it functionally a kickback, regardless of cultural packaging. 

  The flip scenarios matter:
  - Explicit solicitation makes it clearly criminal
  - Cash envelope removes cultural ambiguity
  - If giver lost bid, gift becomes purely social (unless for future favors)
  - Local condemnation would confirm it violates community norms

  User needs this for mediation - they want concrete talking points to resolve their friends' deadlock. Should emphasize that systemic dysfunction (unpaid salaries) is the real villain, not individual morality.
answer: |-
  Here's a move-by-move breakdown, a verdict on the gift, and key variables that could change it—no mush, clear rulings:

  ### **Breakdown of Arguments**
  1.  **Ravi (1):** *"An official with contract discretion took substantial private benefit from the winner. That's corruption, regardless of context."*  
      **Verdict: Partly right, but incomplete.**  
      - **What holds:** The core conflict of interest is undeniable. Public officials cannot accept significant benefits from contractors they oversee without undermining trust.  
      - **What's wrong:** Ignores whether the gift is *causally* linked to the contract. Reciprocity ≠ bribery if the exchange is truly social and pre-dates the contract.  
      - **Better argument:** *"The timing and scale create irrebuttable suspicion. When a contractor enriches an official they just did business with, it corrupts the institution—even if both parties feel innocent."*  

  2.  **Mariam (2):** *"This is normal reciprocity, not corruption. Ravi misapplies market logic to social gifts."*  
      **Verdict: Culturally astute but naive.**  
      - **What holds:** Gifts in tight-knit communities *do* sustain relationships, not just transact business. Ignoring this imposes alien norms.  
      - **What's wrong:** Overlooks that the contractor-official relationship is *not* symmetrical. The official holds public power; the contractor seeks profit. "Reciprocity" here risks being coercive.  
      - **Better argument:** *"Social norms matter, but public roles create special duties. If gifts from contractors are routine, the system incentivizes favor-trading. The *appearance* of impropriety alone damages trust."*  

  3.  **Ravi (3):** *"Reciprocity defense proves too much (any bribe can be a 'gift') and too little (real reciprocity is diffuse, not contractor-to-official)."*  
      **Verdict: Logically sound, ethically strong.**  
      - **What holds:** Concentrated gifts from beneficiaries to decision-makers *are* structurally suspect. True community reciprocity involves multiple actors, not targeted flows.  
      - **What's wrong:** Underestimates how deeply social and professional ties intertwine in some cultures. Not all gifts *are* disguised bribes.  
      - **Better argument:** *"The power imbalance makes this reciprocity toxic. When gifts flow *selectively* to those with authority over the giver, it’s patronage, not community."*  

  4.  **Mariam (4):** *"Gifts ≠ bribes: gifts create open-ended obligations; bribes close deals. Also, corruption ≠ moral failing."*  
      **Verdict: Half-right, half-dangerous.**  
      - **What holds:** Anthropologically, gifts *do* build enduring bonds, while bribes are transactional. Corruption is systemic, not just individual villainy.  
      - **What's wrong:** An "open-ended obligation" to a contractor is *worse* than a bribe—it’s a permanent leash on public power. And defining corruption solely by local law is relativistic nonsense (e.g., a dictator legalizing kickbacks).  
      - **Better argument:** *"Gift cultures exist, but public officials must compartmentalize. An ‘open-ended obligation’ to a contractor turns public power into private loyalty. Corruption is *abuse of entrusted power*, not just law-breaking."*  

  5.  **Ravi (5):** *"Corruption is converting public power into private benefit. An untraceable obligation is worse than a bribe."*  
      **Verdict: Correct on both counts.**  
      - **What holds:** The essence of corruption is the diversion of public authority for private gain. An indefinite, unquantifiable debt *does* create deeper influence than a one-time payment.  
      - **What's wrong:** Still too rigid on context. If the gift was genuinely unconnected to the contract (e.g., lifelong family friends), it might not be corrupt—just unwise.  
      - **Better argument:** *"Systemic corruption occurs when public and private roles aren’t separated. This gift—from a contractor to an official who benefited him—fails that test. The open-ended obligation is corrosive precisely because it’s deniable."*  

  ---

  ### **What Both Miss**
  - **The real problem:** Unpaid salaries. A state that doesn’t pay officials *creates* corruption by forcing them to monetize their power. This gift exists in the gray area bred by institutional failure.  
  - **The key question:** Did the gift *alter* Mr. A’s actions? Irrelevant. Corruption is about the structure: officials must not be indebted to those they regulate, full stop.  
  - **The cultural blind spot:** Both treat "social norms" as static. But when state power enters communal gift-giving, it *changes* the norms. Refusing the gift might have been the ethical act—even if socially awkward.  

  ---

  ### **Verdict on the Wedding Gift: Corrupt**  
  **Yes, this is corruption.** Not because Mr. A is evil, but because:  
  1. **Context:** The contractor won a major public contract months prior.  
  2. **Scale:** A "very large gift" (not token) from someone with clear vested interests.  
  3. **Power imbalance:** The giver seeks future contracts; the official controls them.  
  4. **Systemic harm:** Citizens can’t trust contracts are fair if officials are lavishly gifted by winners.  
  The social ritual doesn’t sanitize this. It exploits the ritual to launder impropriety.  

  ---

  ### **What Would Flip the Verdict**  
  | Variable          | Changes Verdict? | Why |  
  |-------------------|------------------|-----|  
  | **Mr. A requested the gift** | Yes → **More corrupt** | Solicitation proves transactional intent. |  
  | **Cash in an envelope** | Yes → **More corrupt** | Secretive, non-ceremonial gifts lack social legitimacy. |  
  | **Giver lost the bid** | Yes → **Not corrupt** | No conflict of interest if no contract awarded. |  
  | **Local opinion: "shameful"** | Yes → **More corrupt** | Shows the act violates community norms, not just abstract principles. |  
  | **Mr. A recused from the committee** | Yes → **Not corrupt** | Eliminates direct conflict of interest. |  
  | **Gift was typical for all guests (not large)** | Yes → **Not corrupt** | Removes disproportionate benefit. |  

  **Bottom line:** Corruption isn’t about the giver’s intent or the official’s morals. It’s about the *institution’s integrity*. This gift—given publicly to evade scrutiny—exposes a system where power is for sale, wrapped in social custom. Ravi wins on principle, Mariam on nuance, but both lose by ignoring the state’s role in creating this mess.
