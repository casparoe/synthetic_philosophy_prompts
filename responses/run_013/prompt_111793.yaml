answer: |-
  A philosopher promises a joke to an empty forest. He breaks it immediately.
  *   The Assurance Theorist: "No harm, no foul! Who expected it?"
  *   The Reliance Theorist: "Exactly! No one relied on you."
  *   The Practice Theorist: "You reckless fool! You're eroding the *institution*!"
  *   Humean: "Promising to trees? Absurd! There's no *convention* for that!"
  *   Constitutive Rules Theorist: "I don't care if the trees heard you – *you still owe them that joke!*"

  **Note on Liberties & Contestation:**
  1.  **Constitutive Rules & Solitary Promises:** The joke presents the constitutive view (e.g., Searle) as insisting a solitary promise *always* binds. While this captures its core opposition to views requiring social context/uptake, some constitutive accounts *might* allow that a promise genuinely made to *no one* (like shouting into the void) is defective or null, though they'd insist a *secret* promise to *oneself* or an *unheard* promise to *another* binds. The "trees" setup pushes this boundary deliberately for humor.
  2.  **Practice View & Individual Acts:** The Practice view (e.g., Rawls) *does* emphasize the primacy of the practice over individual acts. However, characterizing breaking an undiscovered promise as *necessarily* "eroding the institution" or being "reckless" simplifies the debate. Critics argue institutions *can* persist despite isolated, undetected violations, and proponents debate how much individual intent/awareness matters for the *wrongness* within the practice.
  3.  **Humean Convention & Uptake:** The Humean dismissal ("Absurd!") captures the view's core dependence on existing, mutually recognized conventions. However, the specific scenario (promising to trees) arguably lacks even the *potential* for conventional uptake, making it an easy case. The more contested question within Humeanism is whether a promise made *within* a convention but *unheard* by the promisee still binds conventionally (often argued 'no', as convention requires mutual expectations).
