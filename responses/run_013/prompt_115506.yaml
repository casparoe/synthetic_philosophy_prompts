  ### Scenario: The Mysterious Urn

  **Setup:** An urn contains five balls, each with a unique two-digit code: 11, 12, 21, 22, and 00. The event of interest \(A\) is "the ball's code contains at least one '1'". Agents Alice and Bob share a uniform prior over the five balls. Alice privately observes the first digit of the drawn ball, Bob the second. The actual ball drawn is 11, so \(A\) is true (it contains a '1').

  #### (a) State space, partitions, prior, proposition, and posteriors
  - **State space:** \(\Omega = \{11, 12, 21, 22, 00\}\) (ball codes).  
  - **Prior:** Uniform, \(P(\omega) = 1/5\) for all \(\omega \in \Omega\).  
  - **Proposition \(A\):** \(\{\omega \in \Omega : \omega \text{ contains '1'}\} = \{11, 12, 21\}\).  
  - **Alice's partition:** Based on first digit:  
    \(\mathcal{P}_A = \{\{11, 12\}, \{21, 00\}, \{22\}\}\).  
  - **Bob's partition:** Based on second digit:  
    \(\mathcal{P}_B = \{\{11, 21\}, \{12, 00\}, \{22\}\}\).  

  **Actual state:** \(\omega = 11\).  
  - Alice observes first digit '1', so her information set is \(\{11, 12\}\).  
    Posterior for \(A\):  
    \[
    P(A \mid \{11, 12\}) = \frac{P(\{11, 12\} \cap A)}{P(\{11, 12\})} = \frac{P(\{11, 12\})}{P(\{11, 12\})} = 1 \quad (\text{since both } 11, 12 \in A).
    \]  
  - Bob observes second digit '1', so his information set is \(\{11, 21\}\).  
    Posterior for \(A\):  
    \[
    P(A \mid \{11, 21\}) = \frac{P(\{11, 21\} \cap A)}{P(\{11, 21\})} = \frac{P(\{11, 21\})}{P(\{11, 21\})} = 1 \quad (\text{since both } 11, 21 \in A).
    \]  
  *Alice and Bob both assign posterior 1 to \(A\) at \(\omega = 11\). But we need disagreement. Adjust the setup: Remove ball 00 and redefine partitions to ensure genuine disagreement.*

  **Revised Setup:**  
  - **State space:** \(\Omega = \{11, 12, 21, 22\}\).  
  - **Prior:** Non-uniform:  
    \(P(11) = \frac{2}{11}\), \(P(12) = \frac{4}{11}\), \(P(21) = \frac{1}{11}\), \(P(22) = \frac{4}{11}\).  
  - **Proposition \(A\):** "The ball’s code has a ‘1’ in the first digit or a ‘1’ in the second digit" – but redefine to avoid trivial agreement:  
    \(A = \{11, 22\}\) (balls with two identical digits).  
  - **Alice's partition:** First digit:  
    \(\mathcal{P}_A = \{\{11, 12\}, \{21, 22\}\}\).  
  - **Bob's partition:** Second digit:  
    \(\mathcal{P}_B = \{\{11, 21\}, \{12, 22\}\}\).  

  **Actual state:** \(\omega = 11\).  
  - Alice observes first digit '1', so information set \(\{11, 12\}\).  
    Posterior for \(A\):  
    \[
    P(A \mid \{11, 12\}) = \frac{P(A \cap \{11, 12\})}{P(\{11, 12\})} = \frac{P(11)}{P(11) + P(12)} = \frac{2/11}{(2/11) + (4/11)} = \frac{2}{6} = \frac{1}{3}.
    \]  
  - Bob observes second digit '1', so information set \(\{11, 21\}\).  
    Posterior for \(A\):  
    \[
    P(A \mid \{11, 21\}) = \frac{P(A \cap \{11, 21\})}{P(\{11, 21\})} = \frac{P(11)}{P(11) + P(21)} = \frac{2/11}{(2/11) + (1/11)} = \frac{2}{3}.
    \]  
  **Posteriors:** Alice assigns \(\frac{1}{3}\), Bob assigns \(\frac{2}{3}\) to \(A\) at \(\omega = 11\).

  #### (b) Common knowledge of disagreement and why the theorem is not violated
  - **Disagreement at \(\omega = 11\):** Alice’s posterior (\(\frac{1}{3}\)) ≠ Bob’s posterior (\(\frac{2}{3}\)).
  - **Level 0 (Disagreement):** True at \(\omega = 11\).
  - **Level 1 (Each knows they disagree):**  
    - Alice’s info set: \(\{11, 12\}\). At \(\omega = 11\): Bob’s posterior is \(\frac{2}{3} \neq \frac{1}{3}\).  
      At \(\omega = 12\): Alice’s posterior is \(\frac{1}{3}\) (same set), Bob’s posterior (from \(\{12, 22\}\)) is \(P(A \mid \{12, 22\}) = \frac{P(22)}{P(12)+P(22)} = \frac{4/11}{4/11+4/11} = \frac{1}{2} \neq \frac{1}{3}\).  
      So in \(\{11, 12\}\), Bob’s posterior is never \(\frac{1}{3}\). Alice knows they disagree.  
    - Bob’s info set: \(\{11, 21\}\). At \(\omega = 11\): Alice’s posterior is \(\frac{1}{3} \neq \frac{2}{3}\).  
      At \(\omega = 21\): Alice’s posterior (from \(\{21, 22\}\)) is \(P(A \mid \{21, 22\}) = \frac{P(22)}{P(21)+P(22)} = \frac{4/11}{1/11+4/11} = \frac{4}{5} \neq \frac{2}{3}\).  
      So in \(\{11, 21\}\), Alice’s posterior is never \(\frac{2}{3}\). Bob knows they disagree.  
  - **Level 2 (Each knows the other knows):**  
    - Alice considers \(\{11, 12\}\) possible. At \(\omega = 12\), Bob’s info set is \(\{12, 22\}\).  
      In \(\{12, 22\}\), Bob’s posterior is \(\frac{1}{2}\), and Alice’s posterior is \(\frac{1}{3} \neq \frac{1}{2}\).  
      At \(\omega = 22\) (in Bob’s set), Alice’s posterior is \(\frac{4}{5} \neq \frac{1}{2}\).  
      So Bob always knows they disagree in \(\{12, 22\}\). Alice knows Bob knows.  
    - Bob considers \(\{11, 21\}\) possible. At \(\omega = 21\), Alice’s info set is \(\{21, 22\}\).  
      In \(\{21, 22\}\), Alice’s posterior is \(\frac{4}{5}\), and Bob’s posterior at \(\omega = 21\) is \(\frac{2}{3} \neq \frac{4}{5}\).  
      At \(\omega = 22\), Bob’s posterior is \(\frac{1}{2} \neq \frac{4}{5}\).  
      So Alice always knows they disagree in \(\{21, 22\}\). Bob knows Alice knows.  
  - **Higher levels:** By induction, for any level \(k\), mutual knowledge holds. The set \(\{11, 12, 21, 22\}\) is common knowledge (no finer partition exists), and disagreement holds throughout. Thus, disagreement is common knowledge.  

  **Why no contradiction with Aumann:** The theorem requires **common knowledge of the posteriors**, meaning at every state in the common knowledge partition, Alice’s posterior is \(p\) and Bob’s is \(q\) for fixed \(p, q\). Here, Alice’s posterior is not common knowledge:  
  - At \(\omega = 11\), Alice’s posterior is \(\frac{1}{3}\), but Bob (in \(\{11, 21\}\)) doesn’t know if it’s \(\frac{1}{3}\) (at 11) or \(\frac{4}{5}\) (at 21).  
  - Similarly, Bob’s posterior is not common knowledge: Alice doesn’t know if it’s \(\frac{2}{3}\) or \(\frac{1}{2}\).  
  The **failing hypothesis** is that the exact posterior probabilities are common knowledge.

  #### (c) Key feature and resolution with the missing hypothesis
  - **Key feature:** Agents know *that* they disagree but not *what* the other’s exact posterior is. The information partitions allow each agent’s posterior to vary within the other’s possible states, preventing common knowledge of the specific values.  
  - **Impose missing hypothesis:** If the exact posteriors were common knowledge, disagreement would vanish. For example, if Alice’s posterior \(\frac{1}{3}\) were common knowledge, Bob would rule out states where Alice’s posterior differs (e.g., \(\omega = 21\) where it’s \(\frac{4}{5}\)). At \(\omega = 11\), Bob’s information set would reduce to \(\{11\}\) (since \(\omega = 21\) is eliminated), so his posterior would update to \(P(A \mid \{11\}) = 1\) (if \(A\) holds at 11), matching Alice’s \(\frac{1}{3}\) only if they agree—but agreement would be forced.

  #### (d) Strongest objection and reply
  - **Objection:** "The common prior is not uniform, violating the theorem’s assumption of a common prior."  
    **Reply:** Aumann’s theorem allows non-uniform priors, provided they are common and updated via Bayes’ rule. The prior \(P(11)=2/11, P(12)=4/11, P(21)=1/11, P(22)=4/11\) is shared and used correctly. Non-uniformity is irrelevant; the failure is solely due to lack of common knowledge of posteriors.  
  - **Objection:** "In state 22, both assign \(A\) probability \(P(A \mid \cdot) = ?\) but 22 is not the actual state."  
    **Reply:** The case focuses on \(\omega = 11\). States 12, 21, and 22 are possibilities that sustain common knowledge of disagreement at 11. Their posteriors are consistent and necessary for the inductive argument.  

  **Load-bearing assumption:** The exact posterior probabilities are not common knowledge.
