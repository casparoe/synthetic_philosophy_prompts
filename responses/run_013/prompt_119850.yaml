  I notice several theoretical distinctions to capture:
  - Whether deception invalidates consent only if it defeats the consenter's actual purpose (case b)
  - Disclosure obligations affecting validity (case a,c)
  - Subjective vs objective coercion standards (case e)
  - Consent as normative power vs mental state (case g)
  - Competence as relative or absolute (case d)
  - Separatist view (cases f,h where valid consent coexists with wrongdoing)

  For the kidney seller case (c), I include options highlighting exploitation vs voluntariness. The dementia case (d) lets me contrast competence thresholds. The "valid but wrong" option appears in multiple questions to represent separatist views.

  The scoring key needs to map answer patterns to positions like defeater-based deception views, duty-to-disclose theories, etc. I anticipate some combinations might not map cleanly - for instance, positions combining fixed competence thresholds with purely subjective coercion might not emerge, possibly because such combinations are theoretically unstable.

  Throughout, I maintain American English phrasing as requested, and ensure every option is a concrete verdict on the case rather than an abstract label. This approach should allow participants without theoretical background to engage meaningfully.
answer: |-
  Here’s a consent theory sorting quiz designed as requested, with cases phrased as verdicts and a scoring key mapping answers to theoretical positions:

  ---

  ### **Consent Validity Quiz: Which Theory Do You Hold?**  
  *For each scenario, choose the verdict that best reflects your judgment:*  

  1. **Surgeon’s Risk Description**  
     A surgeon describes a 1-in-2,000 risk of permanent nerve damage as "rare" and says nothing else. The patient consents.  
     ○ Her consent was valid.  
     ○ Her consent was invalid.  
     ○ Her consent was valid, but the surgeon wronged her.  

  2. **False Sterility Claim**  
     A man lies about being sterile. His partner consents to sex and becomes pregnant.  
     ○ Her consent was valid.  
     ○ Her consent was invalid.  
     ○ Her consent was valid, but he wronged her.  

  3. **Undisclosed Kidney Profit**  
     A kidney seller agrees to a fee far below what the intermediary receives, after being told it’s the "going rate."  
     ○ His consent was valid.  
     ○ His consent was invalid.  
     ○ His consent was valid, but the intermediary wronged him.  

  4. **Dementia Patient’s Choice**  
     A woman with early dementia accurately restates risks of a trial treatment but cannot compare probabilities. She consents; her daughter objects.  
     ○ Her consent was valid.  
     ○ Her consent was invalid.  
     ○ Her consent was valid, but proceeding wronged her.  

  5. **Prisoner’s Sentence Study**  
     A prisoner volunteers for a study that shortens his sentence.  
     ○ His consent was valid.  
     ○ His consent was invalid.  
     ○ His consent was valid, but the researchers wronged him.  

  6. **Unread Data Terms**  
     A user clicks "I agree" to terms letting the company train models on her unread messages.  
     ○ Her consent was valid.  
     ○ Her consent was invalid.  
     ○ Her consent was valid, but the company wronged her.  

  7. **"Whatever You Think Best" Surgery**  
     A patient says "do whatever you think best." The surgeon performs a procedure she would have refused if asked directly.  
     ○ Her consent was valid.  
     ○ Her consent was invalid.  
     ○ Her consent was valid, but the surgeon wronged her.  

  8. **Drunken Lucid Consent**  
     A drunk but lucid man agrees to sex he knows he’ll regret tomorrow.  
     ○ His consent was valid.  
     ○ His consent was invalid.  
     ○ His consent was valid, but his partner wronged him.  

  ---

  ### **Scoring Key**  
  *Tally your answers and match patterns below. Positions are defined by their core commitments:*  

  #### **A. Defeater View of Deception**  
  > *Deception invalidates consent only if it defeats the consenter’s actual purpose.*  
  **Signature:** Q2 = "invalid"; Q1 = "valid" or "valid but wronged".  
  *Tests: Rejects broad deception rules; focuses on what the consenter sought (e.g., pregnancy avoidance in Q2).*  

  #### **B. Duty-to-Disclose View**  
  > *Validity turns on whether the deceiver owed disclosure (e.g., due to relationship/fairness).*  
  **Signature:** Q1 = "invalid"; Q3 = "invalid"; Q2 = "invalid" or "valid but wronged".  
  *Tests: Emphasizes breaches of obligation (e.g., surgeon’s duty in Q1, intermediary’s in Q3).*  

  #### **C. Subjective Coercion Standard**  
  > *Coercion depends on the consenter’s personal vulnerability.*  
  **Signature:** Q5 = "valid"; Q3 = "valid" or "valid but wronged".  
  *Tests: Accepts prison consent if voluntary *for that person* (Q5), and kidney sale if not subjectively coerced (Q3).*  

  #### **D. Objective Coercion Standard**  
  > *Coercion exists if pressures would overwhelm a reasonable person.*  
  **Signature:** Q5 = "invalid" or "valid but wronged"; Q3 = "invalid".  
  *Tests: Rejects prison consent due to systemic pressure (Q5) and kidney sale due to exploitation (Q3).*  

  #### **E. Normative Power View**  
  > *Consent is valid when it authorizes action per social/legal norms, not just mental assent.*  
  **Signature:** Q7 = "valid"; Q6 = "valid"; Q4 = "invalid" or "valid but wronged".  
  *Tests: Upholds delegation (Q7) and clickwrap (Q6) as normatively effective; questions dementia consent (Q4).*  

  #### **F. Competence Threshold View**  
  > *Competence requires meeting fixed cognitive standards, regardless of decision complexity.*  
  **Signature:** Q4 = "invalid"; Q8 = "valid" or "valid but wronged".  
  *Tests: Rejects dementia consent (Q4) but accepts drunk consent if lucid (Q8).*  

  #### **G. Decision-Relative Competence**  
  > *Competence depends on the specific decision’s demands.*  
  **Signature:** Q4 = "valid"; Q8 = "valid" or "valid but wronged".  
  *Tests: Accepts dementia consent for simpler choices (Q4); distinguishes complexity from intoxication (Q8).*  

  #### **H. Separatist View**  
  > *Valid consent and wrongful conduct can coexist.*  
  **Signature:** **Three or more** "valid but wronged" answers (esp. Q1, Q2, Q3, Q5, Q6).  
  *Tests: Severs validity from permissibility (e.g., kidney sale valid but exploitative).*  

  ---

  ### **Unoccupied Positions & Ambiguities**  
  - **Incoherent Pairing:** *Competence Threshold + Subjective Coercion* (Q4="invalid" + Q5="valid") clashes by imposing rigid standards for competence but contextual ones for coercion.  
  - **Unexplored:** *Duty-to-Disclose + Objective Coercion* (Q1="invalid", Q3="invalid", Q5="invalid") is plausible but rare; no case forces this combo.  
  - **Indistinguishable Pairs:**  
    - *Defeater View vs. Separatism* in Q2: Both may say "valid but wronged" if deception defeats purpose *and* is wrongful.  
    - *Normative Power vs. Separatism* in Q6/Q7: Both often agree on validity but differ on wrongfulness.  
  - **Unattractive:** *"Always Valid"* (all "valid") ignores palpable wrongs; *"Always Invalid"* (all "invalid") paralyzes action.  

  ### **How to Use**  
  Participants tally answers → Match patterns to positions → Discuss why theories yield different verdicts. The quiz avoids jargon while isolating core disputes (e.g., Q3/Q5 test coercion; Q2/Q7 test deception/authorization).  

  ---  
  *Design Rationale: Cases map to theory conflicts (e.g., Q1 = disclosure duties, Q4 = competence standards). "Valid but wronged" options capture separatist/nuanced views. Answer patterns expose tensions (e.g., accepting prison consent (Q5="valid") while rejecting kidney sales (Q3="invalid") suggests subjective coercion standards).*
