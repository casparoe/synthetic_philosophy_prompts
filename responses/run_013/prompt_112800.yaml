prompt: |-
  I cover archaeology and climate for a magazine, so I've spent the last couple of years knee-deep in collapse stories — the Late Bronze Age, the Maya, Rapa Nui — and I've got a nagging feeling that all of them turn on a move nobody has a name for. Roughly: whether a society gets called collapsed seems to be decided by which two dates you pick, and then the dates quietly get forgotten. With the Maya, compare the eighth century to the tenth and you get the classic collapse; compare the tenth to the thirteenth and you get a smaller, poorer, but perfectly functioning society; compare the third century to the ninth and you get one of the great efflorescences in world history. Same dirt, same pots, three completely different stories, and nobody's lying. Rapa Nui runs the trick backwards — take the statue-building centuries as your baseline and it's a self-inflicted ecocide, take the decades just before European contact and most of the die-off turns out to be after contact, from disease and slave raids. And the Bronze Age is the one that finally made me suspicious, because its really only one specific thing that visibly ends there — the palace-centred, scribal, chariot-elite world, the palaces burn and the writing stops — and whether that counts as a society collapsing depends entirely on whether you were tracking the palaces or the farmers.

  So: does this have a name? I've read a lot of the standard line that collapse just means a fast loss of social complexity, and I know ecologists have this idea of shifting baselines, where each generation takes an already-degraded state as normal. But neither feels like what I'm pointing at. Shifting baselines is about observers being fooled; this is more like a denominator nobody ever says out loud. And I keep catching myself running three complaints together — that the verdict depends on the window (a periodization artifact), that it depends on what you're counting (institutions, bodies, territory, elite grave goods — some kind of level-of-analysis thing), and that it depends on how much loss you'll accept before you'll say the word (a threshold thing). Are those three actually distinct, do they have names, and is there a single concept that covers all of them, or am I mashing unrelated worries into one?

  If there's no term, coin one — but I don't want just a label, I want the edges. Is it a collapse if everyone in the valley keeps farming exactly as before but the temple-building and the kings stop? What if a third of the population dies but the institutions survive intact? What if the settlement was fine and it's only our evidence that has a hole in it — do we call that a collapse too? And which of these is doing the real work in the stories we actually tell?
reasoning: |-
  Okay, let's start by unpacking the user's query. They're an archaeology and climate journalist noticing a pattern in collapse narratives—specifically, how the framing of dates and metrics shapes whether a society is deemed "collapsed." They mention the Maya, Rapa Nui, and the Late Bronze Age as examples. 

  First, I need to pinpoint their core concern. They feel existing terms like "shifting baselines" don't fit because their issue isn't about observer bias over time, but about how scholars selectively choose temporal windows, metrics, and thresholds to define collapse. They also wonder if their three complaints (window selection, metric choice, threshold level) are distinct or interconnected.

  Hmm. The user is clearly well-versed in the literature but frustrated by conceptual murkiness. Their examples are spot-on: the Maya's "collapse" looks radically different depending on whether you compare 8th vs. 10th century (decline) or 3rd vs. 9th (growth). Rapa Nui's narrative flips if you start pre- or post-contact. The Bronze Age case is especially telling—palace elites vanish, but farmers persist. So whose collapse is it?

  I recall Joseph Tainter's complexity-based collapse definition, but the user already knows that and finds it insufficient. They're hinting at something more systemic: collapse as a rhetorical construct shaped by scholarly choices. The ecologists' "shifting baselines" is adjacent but focuses on generational amnesia, not academic framing. 

  Breaking down their three complaints:  
  1. **Periodization artifacts** (choosing start/end dates)  
  2. **Level-of-analysis discrepancies** (tracking elites vs. commoners)  
  3. **Threshold arbitrariness** (how much loss = "collapse")  

  These *are* distinct but interconnected. Periodization shapes what's visible; level-of-analysis decides whose story matters; thresholds are value-laden. Together, they form a kind of "collapsology trilemma."  

  The closest existing concept might be "collapse teleology"—implying scholars pick endpoints that validate preconceived narratives. But it's not quite right. Alternatively, "metric fixation" (over-relying on one variable like monuments or population) captures part of it. Still, no term fully encompasses all three issues.  

  Coining a term feels necessary here. "Collapse perspectivism" could work (emphasizing viewpoint-dependence), but it's vague. "Collapse framing effects" is clearer but jargony. Maybe **chronometric selectivity**? Combines time-window cherry-picking with metric selection. Or **narrative denominator syndrome**—the unspoken baseline against which change is measured.  

  The user's deeper need seems twofold:  
  - **Conceptual clarity**: A framework to dissect collapse claims.  
  - **Practical application**: Tools to interrogate historical narratives in their writing.  

  They might also be wrestling with ethical unease—how these framings oversimplify human resilience (e.g., Bronze Age farmers adapting sans palaces). Their closing questions about "real work" suggest they want to expose scholarly sleight-of-hand in popular collapse stories.  

  So, proposing **collapse framing effects** as an umbrella term, with three sub-components:  
  1. **Temporal framing** (periodization)  
  2. **Structural framing** (level-of-analysis)  
  3. **Threshold framing** (degree-of-loss)  

  This gives them a structured way to critique narratives: *"The classic Maya collapse narrative relies on elite-centric structural framing and narrow temporal framing (750-950 CE), obscuring post-collapse reorganization..."*  

  The term "denominator blindness" (their phrase) is actually sharp—it highlights the unsaid baseline. Pairing it with the three frames might be the cleanest solution.  

  Final thought: Their examples reveal collapse is rarely societal death, but transformation. Maybe what they really need isn't just a term, but a mandate: *Stop asking "Did it collapse?" Start asking "What changed, for whom, and who decided that counted?"*
answer: |-
  You've hit on a profound methodological flaw in how we narrate societal collapse—one that absolutely deserves naming. Your intuition is correct: **Collapse Framing Effects** (or **Collapse Framing Bias**) is the core issue, composed of three interlocking distortions. They aren't wholly distinct, but represent stages of analytical choice that collectively shape the narrative:

  1.  **Temporal Framing (The "When"):** The selection of start/end dates. *Example:* Maya 8th vs. 10th century (collapse) vs. 10th vs. 13th (stability/adaptation) vs. 3rd vs. 9th (efflorescence). This is the **periodization artifact**.
  2.  **Structural Framing (The "What"):** Choosing *which aspect* of society is measured (elite institutions, population, territorial extent, economic output, material culture complexity, ecological footprint). *Example:* Late Bronze Age palaces & writing (collapsed) vs. subsistence farming & local settlements (continued). This is the **level-of-analysis selector**.
  3.  **Threshold Framing (The "How Much"):** Defining the *degree of loss or change* required to call it "collapse" rather than "decline," "transformation," or "adaptation." *Example:* Is losing palace bureaucracy enough? Does 30% population loss trigger it? This is the **arbitrary loss threshold**.

  **Why "Shifting Baselines" Isn't Quite It:** Shifting baselines describe *generational normalization of degradation*. Your concern is *scholarly/societal framing of historical analysis* – **selecting the denominator against which change is measured**, often implicitly, to produce a specific narrative (collapse or resilience). It's about the *analyst's* starting point, not societal memory.

  **A Proposed Umbrella Term: Collapse Framing Effects**

  This term explicitly names the core problem: the outcome ("collapse" or not) is heavily dependent on how the analyst *frames* the investigation through the choices above. It highlights the constructed nature of the narrative.

  **Dissecting Your Questions with the Framework:**

  1.  **"Is it collapse if farmers keep farming but kings/temples stop?"**
      *   *Temporal Frame:* Depends if you compare to the peak temple era or a baseline before kings existed.
      *   *Structural Frame:* Collapse for the *elite political/religious superstructure*? Probably. Collapse for the *subsistence economy and most people*? Probably not. It's **structural transformation** or **decomplexification** (Tainter).
      *   *Threshold Frame:* Is the loss of state-level organization sufficient for you to call the *whole society* collapsed? Many would say yes, but it's a choice.

  2.  **"What if a third die but institutions survive?"**
      *   *Temporal Frame:* How quickly did the die-off happen? A century vs. a decade matters.
      *   *Structural Frame:* Focus on *demographics* screams "collapse." Focus on *institutional continuity* suggests resilience.
      *   *Threshold Frame:* Is 33% population loss "collapse"? For whom? (Elites might be fine; laborers devastated). This highlights **differential impact**.

  3.  **"What if only the evidence has a hole?"**
      *   This is **not collapse**, it's an **evidentiary gap**. Calling it collapse based on absence of evidence is bad scholarship, a fundamental error separate from framing. Framing effects operate *within* the available evidence.

  **Which Frame Does the Real Work? It Depends, but Elites Rule the Narrative (Often):**

  1.  **Elite-Centric Bias:** Historically, archaeology relied on monuments, palaces, elite tombs, and texts (where they exist). These are visible, dramatic, and leave clear "ends." **Structural Framing** (focusing on elites) is often the *primary driver*. The "collapse" of the palace is easier to spot and narrate than the slow adaptation of villagers. The Late Bronze Age is the quintessential example – the framing *starts* with the palaces burning.
  2.  **Temporal Framing Amplifies the Elite Narrative:** Comparing peak monument-building (Maya Classic, Rapa Nui statue heyday, LBA palaces) directly to a low point later inherently emphasizes elite loss. Choosing different dates (like post-Maya reorganization) lessens this.
  3.  **Threshold Framing is Often Implicit & Cultural:** We rarely state "I define collapse as X% loss in Y." Western narratives often equate collapse with the fall of centralized power, monumental construction, or "high culture," reflecting our own values about what constitutes a "civilization." A 30% population loss *might* be framed as collapse if elite structures vanish, but merely a "crisis" if kings remain.

  **The Underlying Concept: Denominator Blindness**

  Your phrase "a denominator nobody ever says out loud" is brilliant. This is **Denominator Blindness** in collapse studies: **The failure to explicitly state and justify the baseline (temporal, structural, and threshold) against which change is measured to declare "collapse."**

  *   The Baseline = The Denominator (What we're comparing *to* - e.g., 8th C Maya elites, Rapa Nui pre-contact population, LBA palaces).
  *   The End State = The Numerator (What we're measuring *now* - e.g., 10th C Maya, post-contact Rapa Nui, post-palace Aegean).
  *   "Collapse" = A judgment about the ratio, but the *choice* of denominator is hidden or assumed.

  **Conclusion:**

  You're observing **Collapse Framing Effects**, driven primarily by **Structural Framing** (often elite-centric) and **Temporal Framing** (comparing peak to trough), with **Threshold Framing** operating implicitly based on cultural values. The core methodological sin is **Denominator Blindness** – not explicitly defining the baseline society (when, what aspects, what level of function) that serves as the comparison point.

  **To avoid this in your writing:** Always ask:
  1.  **"Collapse for *whom* and *what*?"** (Structural Frame - Elites? Farmers? The state? Population? Economy?)
  2.  **"Compared to *when* exactly?"** (Temporal Frame - Peak? A generation prior? A century prior? The founding?)
  3.  **"How much loss/constitutes 'collapse' here?"** (Threshold Frame - Is it disappearance? Dramatic reduction? Transformation?)
  4.  **"Is this an actual societal change or just an *evidentiary gap*?"**

  By making these frames explicit, you move beyond simplistic "collapse" narratives and reveal the complex processes of transformation, adaptation, resilience, and yes, sometimes genuine catastrophic failure, that shape human history. You're right to be suspicious – the framing *is* the story.
