  After carefully analyzing your cases, I propose a unified principle of rationality based on Dutch book arguments and their extensions. The core idea is that rationality requires immunity to exploitation through acceptable transactions (bets or trades) at the time they are offered, where "exploitation" means a guaranteed net loss in resources (e.g., money) across all possible states of the world. This principle separates rationality into two distinct but related notions: **belief coherence** (which deals with credences and their updating) and **preference coherence** (which deals with consistent choices over outcomes). Belief coherence assumes linear utility for money to isolate credences as the issue; if utility is non-linear (e.g., risk aversion), it's treated as a preference matter. Preference coherence focuses on avoiding money pumps through transitive, consistent preferences.

  ### The Principle of Transactional Immunity
  An agent is irrational if and only if they are vulnerable to a **finite set of transactions** (bets for beliefs, trades for preferences) that meet these conditions:
  1. **Static belief coherence (probabilism)**: At a single time, the agent's credences violate the probability axioms (non-negativity, normalization, additivity), making them vulnerable to a finite set of bets, each acceptable (i.e., with non-negative expected monetary value, assuming linear utility for money) at that time, that together guarantee a net monetary loss in every possible state of the world.
  2. **Dynamic belief coherence (conditionalization)**: There exists a plan of bets offered at different times, each acceptable at the time it is offered (based on the agent's credences then), that together guarantee a net monetary loss in every possible state of the world and every possible path of evidence, due to non-conditional updating (e.g., changing credences without new evidence).
  3. **Preference coherence (transitivity)**: The agent's preferences are vulnerable to a finite money pump—a sequence of trades, each preferred (i.e., the agent is willing to pay a positive amount to make the swap) at the time it is offered, that cycles them back to their original position with a net loss of resources (e.g., money), indicating intransitive preferences.

  **Key clarifications:**
  - **Finite transactions only**: The principle excludes infinite books (e.g., countably many bets with no finite subset causing a loss) to avoid overextension. Infinite books may indicate a separate issue (e.g., failure of countable additivity), but they're not covered here.
  - **Linear utility for belief coherence**: Belief Dutch books assume linear utility for money to isolate credence issues. If utility is non-linear (e.g., risk aversion), it's handled under preference coherence.
  - **Vulnerability in principle**: Actual betting or trading isn't required. Vulnerability exists if the transactions *would be* accepted given the agent's stated credences/preferences, even if no bookie exists (e.g., Case 5).
  - **Imprecise credences**: These are coherent if they avoid Dutch books (e.g., through minimax pricing), as in Case 4.
  - **No hidden "epicycles"**: The principle has no ad hoc exceptions. If a case violates, it must fit one of the three clauses.

  ### Application to Your Cases
  Below, I apply the principle to each case, explaining the verdict and whether it matches your initial intuition. I also note which clause of the principle is involved and highlight any overturned verdicts.

  - **Case 1 (P and not-P both 0.6)**:  
    **Verdict: Irrational** (static belief coherence).  
    **Why**: Credences violate additivity (sum > 1). A bookie can offer two bets: (1) pay $0.60 for $1 if P, (2) pay $0.60 for $1 if not-P. Total cost: $1.20. If P, win $1 from (1) and lose $0 from (2), net -$0.20. If not-P, vice versa. Loss in every state. Your verdict holds, and vulnerability exists even without a bookie (clause 1).

  - **Case 2 (Changing credences without evidence)**:  
    **Verdict: Irrational** (dynamic belief coherence).  
    **Why**: The agent knows they will update from 0.5 to 0.9 on P tomorrow with no evidence. A bookie can offer: today, sell a bet paying $1 if P for $0.50 (acceptable at credence 0.5); tomorrow, buy it back for $0.90 (acceptable at credence 0.9). Net loss of $0.40 whatever P is. Vulnerability arises from predictable non-conditional updating (clause 2). Your verdict holds.

  - **Case 3 (Coherent but risk-averse)**:  
    **Verdict: Not irrational** (preference coherence).  
    **Why**: Credences are probabilistic (clause 1 not violated). Risk aversion reflects non-linear utility, not belief incoherence. The "bleeding" you describe is a preference-based issue: if she prefers $1 to a 50-50 $3/$0 gamble, her preferences are consistent (transitive) under expected utility theory with concave utility. No money pump exists because she would reject trades that leave her worse off in utility terms. Your verdict holds, and this falls outside belief coherence (utility is a "taste" issue).

  - **Case 4 (Vague credences with minimax pricing)**:  
    **Verdict: Not irrational** (static belief coherence).  
    **Why**: Her credence range [0.3, 0.6] is imprecise, but by pricing bets using the least favorable sharpening, she avoids Dutch books. This is a form of coherence in imprecise probability theories. Vagueness isn't a "virtue" per se, but it allows for a rational strategy that satisfies transactional immunity (clause 1 not violated). Your verdict holds.

  - **Case 5 (Case 1 but never bets)**:  
    **Verdict: Irrational** (static belief coherence).  
    **Why**: Identical to Case 1—credences violate probability axioms. Vulnerability exists in principle because she *would* accept the exploitative bets if offered, even if she never bets. The principle focuses on the state of her credences, not actual behavior. Your gut is correct; the verdict is the same as Case 1 (clause 1). This overturns your doubt about the "reason" in Case 1.

  - **Case 6 (Cyclic preferences)**:  
    **Verdict: Irrational** (preference coherence).  
    **Why**: Preferences are intransitive (A > B > C > A). She pays to swap A for B, B for C, and C for A, ending with A plus a net loss. This is a money pump: each trade is preferred at the time, but the sequence guarantees a loss (clause 3). It's irrational in a similar "exploitation" sense as Case 1, but for preferences, not beliefs. Your uncertainty is resolved.

  - **Case 7 (Credence 0 in a possible proposition)**:  
    **Verdict: Not irrational** (by Dutch book standards).  
    **Why**: No finite Dutch book exists. Suppose P is possible but has credence 0. A bookie might buy a "pay $1 if P" bet from her for $0 (acceptable since expected loss = 0 × $1 = 0), but if P occurs, she loses $1—only in that state, not in all states. No combination with other bets guarantees a loss in every state (e.g., if not-P, she breaks even). She is "epistemically unpleasant" (violating the "regularity" principle), but the Dutch book argument doesn't touch her. Your verdict is overturned: she's not irrational by this principle. This is a limitation of Dutch book arguments.

  ### Additional Cases
  To show how the principle applies to new scenarios:
  - **Vulnerability only to an infinite book**: E.g., an agent with sharp, finitely additive credences vulnerable to a countable Dutch book (no finite subset causes a loss, but the whole book does).  
    **Verdict: Not irrational** by this principle, which requires finite transactions. This highlights a boundary; you might add a clause for infinite books if desired, but it's excluded here for parsimony.
  - **Case 7 revisited**: As above, not irrational. If she assigns credence 0 to a necessary truth, that would violate normalization and be irrational (clause 1).

  ### What Verdicts Are Overturned?
  - **Case 5**: Your initial doubt is resolved—irrationality holds even without a bookie.
  - **Case 7**: Your "epistemically unpleasant" verdict is replaced with "not irrational" under Dutch book standards. This is the only full overturn; the principle forces this because no Dutch book exists.

  ### Why This Principle?
  - **Based on transactional immunity**: Dutch books and money pumps are unified as exploitation through acceptable transactions leading to guaranteed loss. This covers all cases without ad hoc fixes.
  - **Distinct notions**: Belief and preference coherence are separated. Case 3 and Case 6 show why: risk aversion is about preferences, while cyclic preferences are a distinct flaw.
  - **Motivated by your cases**: 
    - Case 1 and 2 motivate static and dynamic belief coherence.
    - Case 3 motivates separating belief and preference coherence.
    - Case 4 motivates allowing imprecise credences if they avoid Dutch books.
    - Case 5 motivates vulnerability in principle.
    - Case 6 motivates preference coherence.
    - Case 7 shows the limits of Dutch book arguments (no clause applies).
  - **Precise and applicable**: The three clauses are testable—e.g., for new cases, check for finite exploitative transactions under the agent's rules.

  ### Final Thoughts
  Your intuition mostly aligns with the principle, except in Case 7, where Dutch book arguments are insufficient to condemn credence 0 for possible events. If you want to include epistemic principles like "don't assign certainty to contingencies," that would be a separate norm (e.g., from epistemic utility theory). But for Dutch book coherence, this principle is parsimonious and robust. If you extend to infinite cases or add epistemic norms, it would become less elegant. I recommend this as a foundation—it explains why your gut verdicts hang together and why vagueness (Case 4) isn't a flaw but a valid strategy. If you have a new case, apply the clauses: look for guaranteed loss via acceptable bets or trades.
