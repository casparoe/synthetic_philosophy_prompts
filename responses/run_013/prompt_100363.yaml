prompt: |-
  I've just spent an evening arguing with a friend about evolutionary explanation, and I've come away with a pattern I can describe but can't name. Has it got a name?

  Someone proposes that a feature exists because it does a job — the love of music binds groups together, a colouring advertises fitness. Asked what makes this the explanation, they say the feature is well suited to the job and that those who have it prosper. Asked whether it might instead be a byproduct — a side-effect of some developmental constraint, of how two other systems happen to be wired together, of drift — they cheerfully grant that not everything is an adaptation. Then, in the next breath, they take the byproduct back: a byproduct is, after all, standing variation for selection to act upon, and had it been useful it would have been retained and refined; and its usefulness is shown by the very fit with which the enquiry began. So the concession that not everything is an adaptation does no work, because each candidate non-adaptation is reabsorbed into an adaptive story by appeal to the same fit that was supposed to be explained.

  I can see this isn't simply the familiar charge that evolutionary thinkers see adaptation everywhere — my friend is sincere about the concession — nor merely a refusal to test, since the stories are treated as testable in principle. What I want is the precise diagnosis. Is there a name for this structure, in which an alternative is admitted as possible and then structurally prevented from ever being accepted? If so, what is it, and how does it differ from the nearest notions — seeing adaptation everywhere, the byproduct idea, the charge of unfalsifiable storytelling? If not, please coin a term, define it, and mark its edges. I want to know what it would actually take to entertain a non-adaptive explanation sincerely rather than merely to seem to, and whether the pattern is a vice in every setting or sometimes exactly the right thing to do. Answer in British English, and don't just hand me a label: the carving is the point.
reasoning: |-
  Hmm, the user has described a pattern they observed in an evolutionary biology debate. Their friend concedes that not every trait is an adaptation, but then immediately reinterprets any potential non-adaptive explanation as "standing variation" that could have been selected for. This creates a situation where the concession to non-adaptation becomes meaningless because every trait gets pulled back into an adaptive explanation.

  The user wants a precise term for this rhetorical structure where an alternative explanation is nominally accepted but structurally prevented from ever being applied. They've already distinguished this from simple adaptationism or unfalsifiability charges. I need to provide a thorough analysis rather than just slapping on a label.

  Looking at evolutionary biology concepts, this seems related to the "Panglossian paradigm" critique where every trait is interpreted as optimally adaptive. But it's more specific - it's about how someone acknowledges non-adaptation in theory but eliminates it in practice through a two-step move: first conceding non-adaptation is possible, then reabsorbing any candidate into adaptationism by invoking "standing variation" and the trait's current utility.

  I think "explanatory recapture" might be a good term for this. It captures how non-adaptive explanations are momentarily acknowledged but then "recaptured" for adaptationism. The key mechanisms are: 1) The standing variation escape hatch, 2) The reverse inference from current utility, and 3) The collapse of historical explanation into current function.

  The difference from mere adaptationism is the veneer of theoretical concession. Unlike unfalsifiability, the individual believes their stories are testable - the problem is the systematic bias against even considering non-adaptive hypotheses.

  To sincerely entertain non-adaptation, we'd need to: decouple current utility from historical origin, develop positive evidence for non-adaptive origins (like developmental constraints), and accept that some traits may have no functional significance at all.

  This pattern is a vice when it becomes a thought-stopping reflex, but might be reasonable when investigating clearly functional traits. The deeper issue is the failure to maintain Gould and Lewontin's distinction between current utility and historical origin.

  I should structure this as: 1) Naming the pattern, 2) Defining the mechanism, 3) Distinguishing it from related concepts, 4) Explaining how to avoid it, and 5) Discussing when it might be appropriate. The user wants careful "carving" of the concept, so precision is crucial.
answer: |-
  You've put your finger on a remarkably persistent and subtle pattern in evolutionary reasoning – one that absolutely deserves a precise name and careful carving. While there isn't a single universally accepted term, the phenomenon is well-recognised. The most fitting label based on your description is **Explanatory Recapture**.

  Here's the dissection:

  1.  **The Pattern: Explanatory Recapture**
      *   **Definition:** Explanatory Recapture occurs when a theorist nominally concedes the *theoretical possibility* of non-adaptive explanations (e.g., spandrels, developmental constraints, drift, exaptation without prior selection for the new function) for a specific trait, but then employs a conceptual mechanism that systematically re-absorbs *any concrete candidate* for such a non-adaptive origin back into an adaptive framework. The concession becomes purely rhetorical, leaving no functional space for non-adaptation in actual explanation.
      *   **Mechanism:** The recapture typically relies on two intertwined moves:
          *   **The Standing Variation Escape Hatch:** Any current trait, even if initially arising non-adaptively (as a byproduct, via drift, etc.), is immediately reclassified as "standing variation." This frames it *solely* as raw material *for* selection.
          *   **The Reverse Inference from Current Utility:** The *current* existence and form of the trait are taken as *prima facie* evidence that it *must have been* refined and maintained *by* selection *for its current (or a directly related) function*. The very "fit" that prompted the adaptive hypothesis in the first place is circularly used as the proof that selection *must* have acted upon it at *some* point, negating the possibility of a genuinely non-adaptive origin persisting or being explanatory.
      *   **The Consequence:** The initial concession ("Not everything is an adaptation!") is rendered inert. Every trait, regardless of its actual origins, is functionally explained *as if* it were an adaptation. The historical pathway is collapsed into the current utility. Non-adaptation is exiled to a hypothetical, never-actually-applicable realm.

  2.  **Distinguishing from Nearest Notions:**
      *   **"Seeing Adaptation Everywhere" (Naive Adaptationism/Panglossianism):** This is the broad *bias*. Explanatory Recapture is the specific *rhetorical and conceptual mechanism* used to *defend* that bias *even while appearing to concede its limits*. Your friend *says* they reject naive adaptationism, but their reasoning *enacts* it via recapture.
      *   **"Byproduct/Spandrel Idea":** This is the *alternative explanation* being offered and then recaptured. The pattern isn't the *idea* of a byproduct, but the *structural dismissal* of its applicability.
      *   **"Unfalsifiable Storytelling" (Just-So Stories):** This is a common *criticism* of adaptationist hypotheses. Explanatory Recapture *creates* a specific *form* of unfalsifiability:
          *   **Standard Unfalsifiability:** The story makes no testable predictions or is consistent with any outcome.
          *   **Recapture Unfalsifiability:** The story *is* treated as testable *in principle* (e.g., "If it weren't useful, selection would have removed it!"). However, *any* non-adaptive explanation for the trait's *origin* is pre-emptively invalidated by the recapture mechanism. The *possibility* of evidence *for* a non-adaptive origin is structurally denied *because* the trait exists and has a form. Evidence *against* the *specific* adaptive function proposed might be sought, but the *adaptive framework itself* (selection acted *at some point*) remains unchallenged. Evidence *for* a non-adaptive origin (e.g., tight developmental linkage, no functional correlate, phylogenetic mismatch) is reinterpreted through the recapture lens ("Ah, but selection *then* maintained it because it could be co-opted/stood ready!").

  3.  **Sincerely Entertaining Non-Adaptive Explanations: What it Takes**
      To move beyond mere lip service and genuinely allow non-adaptive explanations requires:
      *   **Decoupling Current Utility from Historical Origin:** Rigorously separating "Why is it useful now?" from "How did it arise?" A trait can be co-opted (exapted) *without* its origin being adaptive *for that function or any function*. Its current utility does *not* automatically explain its existence.
      *   **Embracing Null Hypotheses:** Actively considering and seeking evidence *for* non-adaptive origins as viable alternatives, not just defaults when adaptation fails. This means developing *positive evidence* for things like:
          *   **Developmental Constraints:** Demonstrating the trait arises inevitably from growth patterns or physical laws, irrespective of function.
          *   **Phylogenetic Inertia/History:** Showing the trait is a conserved relic from an ancestor where it *may* have had a different function or no strong function, and persists simply because it's not harmful enough to be selected against.
          *   **Drift:** Providing evidence (e.g., population bottlenecks, neutral molecular markers linked to the trait) suggesting its frequency is due to random sampling, not selection.
          *   **Lack of Adaptive Fit:** Demonstrating the trait *isn't* particularly well-suited, or varies in ways uncorrelated with proposed selective pressures.
      *   **Accepting the Possibility of Genuine Evolutionary Inertia:** Acknowledging that traits can persist *simply because they aren't detrimental*, not because they are actively maintained by selection. Selection isn't omnipotent or constantly scrutinising every detail.
      *   **Rejecting the Reverse Inference:** Recognising that the mere existence and form of a trait is *not* sufficient evidence that its origin or persistence is due to selection *for* that trait. One must find *independent evidence* for selection acting *on that specific variation* at the relevant time.

  4.  **Is it a Vice or Sometimes Right?**
      *   **Primarily a Vice (Epistemic Hazard):** Explanatory Recapture is a pervasive cognitive bias that stifles exploration of genuine evolutionary complexity. It:
          *   Privileges adaptive stories by default.
          *   Discourages investigation into developmental biology, historical contingency, and neutral processes.
          *   Leads to premature closure on explanations.
          *   Makes evolutionary theory seem more teleological and deterministic than it is.
      *   **Potential Limited Justification (Heuristic Crutch):** In very specific contexts, it *might* act as a reasonable starting assumption, *if* held lightly and provisionally:
          *   **Strong A Priori Functional Link:** For traits *unambiguously* linked to core survival/reproduction *and* showing complex, costly design (e.g., vertebrate eye, bacterial flagellum). Here, the null hypothesis *might* reasonably be adaptation, demanding strong evidence for non-adaptive alternatives.
          *   **Empirical Context:** In a system where non-adaptive processes have been *repeatedly ruled out* for similar traits, a provisional adaptive assumption might guide initial inquiry. However, this is context-dependent and requires constant vigilance against recapture.
      *   **The Crucial Difference:** Even when an adaptive explanation is the *best* one, reaching it *without* invoking Explanatory Recapture involves *actively testing against and potentially falsifying* non-adaptive alternatives using the evidence types mentioned above. Recapture *bypasses* this testing by definitionally excluding the alternatives.

  **In essence:** Explanatory Recapture is the conceptual sleight-of-hand where non-adaptive origins are theoretically permitted but practically annulled by the twin assumptions that (1) any existing trait is "standing variation" ripe for selection, and (2) its current form *must* signify past or present selective refinement, thereby retroactively justifying an adaptive narrative. The concession is hollow. Avoiding it requires a genuine commitment to pluralistic evolutionary explanations and the methodological discipline to seek evidence *for* non-adaptive pathways, not just evidence *against* specific adaptive hypotheses while keeping the adaptive framework sacrosanct. It's recognising that evolution is a tinkerer, not just an engineer, and that history is full of contingency and noise, not just optimisation.
