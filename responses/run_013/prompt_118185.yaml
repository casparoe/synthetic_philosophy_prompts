  I run a small GEB reading group and we keep getting stuck in the same spot. We've got the MIU system down — start from MI, four rewrite rules, MU is unreachable, everyone's happy with the invariant argument that the number of I's can never be a multiple of 3 — and then somebody says "fine, so you jootsing out of the system" and the room splits, and I'm pretty sure we're using 'jootsing' to mean three or four different things. Can you build me a decision tree that starts from "I accept the invariant argument that MU is unreachable" and ends in a named position about what jootsing actually is and whether there's any general story about how to do it?

  The branch nodes should be questions someone can answer without already knowing the labels — concrete commitments, not "do you believe in insight?". Stuff like: is the invariant argument itself a move inside a system, or outside every system? If a system can prove things about itself, does that count as getting out of it? If you had to teach a machine to find the invariant, are you giving it a rule, a new axiom, or waiting on a lucky guess? Leaves I'd like on there: the flat proof-theoretic/hierarchy view (jootsing = moving to a stronger system, nothing spooky); the strange-loop view where the jump is internal, via self-reference; the "you need a non-algorithmic leap" view; the deflationary "there is no jootsing, that feeling is just hindsight and fluency"; and the "mu, drop the question" view. Add whatever else falls out of the space.

  Then: which combinations of answers come out empty and why (incoherent, unattractive, or just nobody's bothered), and which pairs of leaves your tree can't really separate — dont paper over those. No citations needed, I just want the instrument itself. Also tell me how confident you are in the overall shape and which single bit your least sure about.
