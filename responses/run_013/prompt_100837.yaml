     - Action: Running a small outdoor experiment in geoengineering (e.g., releasing a small amount of reflective particles in the stratosphere).
     - The action is visible (public) and only partly reversible (the particles will eventually fall out, but not immediately).

     Step 1: Reversibility?
          - Partly reversible: the effects are not permanent but might last for months or years. Not quickly reversible without interim harm. We treat as irreversible.

