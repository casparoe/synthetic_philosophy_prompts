            - "Do you believe that the potential benefits of this action, even if small, outweigh any small risk of a catastrophic outcome? (where 'catastrophic' is defined as ...)"
            - If the user says yes, but the procedure has recommended inaction because of the catastrophic risk, then we return "values dispute".

   11. Running the procedure on two cases.

   Case 1: Publishing a synthesis route for a dangerous pathogen.

     - Action: Publishing a paper that provides a synthesis route for a dangerous pathogen.
     - The lab believes it is net positive (because it facilitates important research) but knows that other labs are close to the same result.

