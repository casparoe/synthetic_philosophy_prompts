              - Geoengineering field trials have been discussed for years. So T is long.
          - Is it surprising that no one else has acted?
              - Yes, because there are many research groups (say N=100) and the opportunity has been available for a long time. We would have expected at least one group to have acted if it were clearly beneficial.
              - Therefore, do not act.

          - But note: the lack of action might be due to regulatory or ethical concerns, not necessarily because the science is bad. This might be a values dispute: the user might believe that the benefits (gaining knowledge to combat climate change) outweigh the risks (local environmental impact) even if others are cautious.

          - The procedure returns: do not act.

          - However, the user might disagree: they might believe that the reason no one has acted is because of coordination problems or fear of public backlash, not because the expected value is negative. The procedure cannot distinguish between these. We then have a values dispute? Or a dispute about the reason for inaction.

          - We can ask: "Do you believe that the lack of action by others is due to a shared belief that the expected value is negative, or due to other reasons (like fear of criticism)?"

              - If the user believes it is due to fear of criticism (which is independent of the true expected value), then the lack of action is not evidence about the expected value. In that case, the public path does not apply.

          - This is a flaw in the procedure: it assumes that groups are acting based on their assessment of the expected value. If they are not (due to social or political constraints), then the lack of action is not informative.

          - We modify: in the public path, we must ask: "Are other groups constrained by non-epistemic factors (e.g., regulation, public opinion, funding) that might prevent them from acting even if they believe the action is beneficial?"

              - If yes, then the lack of action is not evidence about the expected value. In that case, we treat it like the secret path? Or we ask the user to ignore the lack of action and use the secret path logic.

          - For the geoengineering case, let's assume the user says: "Yes, others are constrained by fear of criticism, not by their assessment of the expected value." Then we switch to the secret path.

     Step 4 (for the geoengineering case, now treated as if the lack of action is not informative):
          - Secret path:
              - Worst-case outcome: The field trial might cause unexpected harm to the local ecosystem or trigger international condemnation leading to a ban on all geoengineering research. It might also set a precedent that encourages other trials, and the cumulative effect of many trials might be harmful. Is this catastrophic? 
                  - The user might say: the worst-case is not catastrophic (e.g., limited to a local area and reversible within a year). 
              - Then we allow the action if the user's expected value is positive.

          - But note: the action is visible. However, since we are in the secret path because of non-epistemic constraints, we are ignoring the visibility? Actually, we are not: the action is public, but we are disregarding the lack of action by others as uninformative.

          - The procedure would then return: act (if the user's expected value is positive).

     But note: the geoengineering case is public, so it's not secret. We must reconsider.

     Revised procedure for public actions when non-epistemic factors are at play:

        In the public path, after asking "Has the action been taken?" and getting "no", we ask:

            - "Do you believe that other groups are not acting because of non-epistemic factors (e.g., fear of criticism, regulatory barriers) even if they believe the action is beneficial?"
            - If yes, then we do not use the lack of action as evidence against the action. Instead, we treat the decision as if the action were secret (because the other groups' inaction does not provide a signal about the expected value).

        Then we go to the secret path.

     So for geoengineering, if the user answers "yes" to non-epistemic factors, then we follow the secret path and the user may decide to act.

   12. What the procedure cannot settle:

     - The procedure relies on several assumptions:

          a. Independence of errors: if errors are correlated, then the curse is weaker. The procedure asks about correlation (step 6) but does not quantitatively adjust for it. We only use a qualitative caution.

          b. The procedure assumes that groups act independently based on their own assessment. If there are strategic interactions (e.g., waiting for others to go first), the public path might be invalid.

          c. The procedure requires the user to estimate many parameters (like p_error, N, p_act_other) which are difficult.

          d. The catastrophe criterion in the secret path is subjective and may be contested.

          e. The procedure cannot resolve disputes about values, especially regarding the trade-off between potential benefits and catastrophic risks.

     - The procedure also cannot handle:

          - Cases where the expected value of acting depends on the state in a complex way (non-linear interactions between actions).

          - Cases where the action is not independent of others (e.g., if the action is a vote in a committee).

          - Cases with very small N (like N=0) but we still have to worry about the user's own error.

     We close by noting that the procedure is a heuristic and not a formal decision theory. It is intended to make the unilateralist's curse salient and to encourage caution in the face of uncertainty and the potential for independent errors.
answer: |-
  Below is a step-by-step decision procedure designed for researchers facing high-stakes, hard-to-reverse decisions with unilateralist's curse (UC) risks. It incorporates UC logic while explicitly addressing key assumptions (e.g., error independence, observability of actions) and flags value disputes. The procedure is structured as a flowchart with questions, thresholds for action, and clear exit points. It assumes the user has ~30 minutes and one colleague for consultation.  

  ---

  ### **Unilateralist's Curse (UC) Decision Procedure**  
  **Core Principle**: Your personal judgment that an action is beneficial is weaker evidence than it seems when many others face the same choice. Acting when others might act independently increases the risk of aggregate harm.  

  #### **Step 0: Preparation**  
  - **Inputs Needed**:  
    - Your estimate of the action’s expected value (EV) if taken by *only you*.  
    - Your confidence in this EV estimate (e.g., "I’m 80% sure publishing this pathogen synthesis is net positive").  
    - Stakeholder alignment (e.g., "My colleague broadly shares my values on scientific openness").  

  ---

  #### **Step 1: Assess Reversibility and Stakes**  
  1. **Question**: *Can the action be fully reversed at low cost if harmful?*  
     - **Sufficient Answer**: "Yes, easily and quickly" (e.g., deleting a preprint).  
       - → **Proceed to Step 2**.  
     - **Answer**: "No, or reversal is slow/costly" (e.g., outdoor geoengineering trial).  
       - → **Proceed to Step 3** (skip Step 2).  

  2. **Question**: *If reversible, could interim harm occur before reversal?*  
     - **Sufficient Answer**: "No significant harm possible in the reversal window."  
       - → **OUTPUT: ACT** (UC does not apply strongly).  
     - **Answer**: "Yes, interim harm could be severe" (e.g., dual-use tech leaks during reversal).  
       - → **Proceed to Step 3**.  

  ---

  #### **Step 2: Check for UC Conditions**  
  3. **Question**: *Do the consequences depend on how many others act?*  
     - **Sufficient Answer**: "No, my action’s impact is independent."  
       - → **OUTPUT: ACT** (if your EV > 0).  
     - **Answer**: "Yes, harm/benefit scales with total actors" (e.g., pathogen synthesis lowers barriers for all labs).  
       - → **Proceed to Step 4**.  

  ---

  #### **Step 3: Evaluate Observability**  
  4. **Question**: *Can others see if this action has been taken?*  
     - **Answer**: **Public** (actions are visible; e.g., publishing, field trials).  
       - → **Proceed to Public Path (Step 5)**.  
     - **Answer**: **Secret** (actions are undetectable; e.g., undisclosed data sharing).  
       - → **Proceed to Secret Path (Step 6)**.  

  ---

  #### **Step 4: Public Path (Visible Actions)**  
  5. **Question**: *Has anyone else already taken this action?*  
     - **Answer**: "Yes."  
       - → **Question**: *Is the marginal benefit of one more action positive?*  
         - "Yes" → **OUTPUT: ACT**.  
         - "No" → **OUTPUT: DO NOT ACT**.  
     - **Answer**: "No."  
       - → **Question**: *Given the opportunity duration, should we have seen others act by now?*  
         - Estimate: "Probability ≥1 other would act if truly beneficial" (use 0–100%).  
           - **Threshold**: If ≥70% and no one acted → **OUTPUT: DO NOT ACT** (your confidence is likely misplaced).  
           - **Threshold**: If <70% → **Proceed to Step 7**.  

  ---

  #### **Step 5: Secret Path (Undetectable Actions)**  
  6. **Question**: *What is the worst-case outcome if all N+1 groups act?*  
     - **Answer**: **Catastrophic** (e.g., mass casualties, irreversible ecological damage).  
       - → **OUTPUT: DO NOT ACT** (unless error probability ≤0.1%; see Step 7).  
     - **Answer**: **Not catastrophic** (harm is bounded/non-existential).  
       - → **Question**: *How many others (N) could act?*  
         - **Threshold**: If N ≥5 → **Proceed to Step 7** (UC risk is material).  
         - **Threshold**: If N <5 → **OUTPUT: ACT** (if your EV > 0).  

  ---

  #### **Step 6: Quantify UC Risk (Correlation & Uncertainty)**  
  7. **Question**: *What is your probability of being wrong about EV >0?* (e.g., "10%").  
     - **Threshold**: If probability ≥20% → **Flag high error risk**.  
  8. **Question**: *How correlated are errors across groups?*  
     - **Low** (groups independent; e.g., diverse fields/countries) → UC risk **HIGH**.  
     - **High** (shared biases; e.g., same lab, data, or ideology) → UC risk **LOWER** (but not zero).  
     - **Assumption Limitation**:  
       - **Correlated errors weaken UC** (groups make similar mistakes). The procedure errs toward caution when correlation is uncertain.  
       - **Secret actions exacerbate UC** (no coordination possible). If actions are secret, assume worst-case parallelism.  

  9. **UC Risk Matrix**:  
     |                     | N ≤ 5          | N > 5          |  
     |---------------------|----------------|----------------|  
     | **Error prob. <10%** | ACT            | DO NOT ACT     |  
     | **Error prob. ≥10%** | DO NOT ACT     | DO NOT ACT     |  
     - **Exception**: If errors are *highly correlated* (≥80% shared bias), downgrade N by 50% (e.g., treat N=10 as N=5).  

  ---

  #### **Step 7: Values Dispute Check**  
  10. **Question**: *Do you and your colleague disagree on core values?* (e.g., "I prioritize scientific freedom; they prioritize precaution").  
      - **Answer**: "No consensus on tradeoffs (e.g., knowledge vs. risk)."  
        - → **OUTPUT: VALUES DISPUTE** (hand decision to institution/policymaker).  
      - **Answer**: "We agree on values."  
        - → Follow prior steps’ outputs.  

  ---

  ### **Key Limitations**  
  - **Independence Assumption**: The procedure assumes errors are weakly correlated. If errors are strongly correlated (e.g., all labs use flawed data), UC risk decreases—but the "N adjustment" in Step 7 mitigates this.  
  - **Secret Actions**: When actions are undetectable, UC risk is amplified (no one can coordinate). The procedure defaults to extreme caution for catastrophes.  
  - **Dynamic Contexts**: Does not handle evolving scenarios (e.g., if others act *after* you).  
  - **Non-Quantifiable Harms**: Struggles with uncertain tail risks (e.g., "gray goo" nanotech scenarios).  

  ---

  ### **Case Studies**  
  #### **Case 1: Publishing Pathogen Synthesis (Public Action)**  
  - **Context**: Lab believes publishing a dangerous pathogen synthesis is net positive. 10+ labs are near the same result. Action is public and irreversible.  
  - **Procedure**:  
    1. **Step 1**: Irreversible → Proceed to Step 3.  
    2. **Step 3**: Public → Public Path (Step 5).  
    3. **Step 5**: No one has published. Opportunity duration = 6 months (sufficient for others to act).  
       - Estimated probability ≥1 other would publish if beneficial = 90% (high).  
       - → **OUTPUT: DO NOT ACT** (against user’s prior).  
  - **Why?** Lack of action by others suggests your confidence may be misplaced. UC risk dominates.  

  #### **Case 2: Small Geoengineering Trial (Public Action)**  
  - **Context**: Researchers consider a partly reversible, visible field trial. User estimates EV >0. 20+ groups could act.  
  - **Procedure**:  
    1. **Step 1**: Partly reversible → Interim harm possible (e.g., public backlash) → Proceed to Step 3.  
    2. **Step 3**: Public → Public Path (Step 5).  
    3. **Step 5**: No one has acted. Opportunity duration = 2 years (sufficient time).  
       - Estimated probability ≥1 other would act if beneficial = 85% (high).  
       - → **OUTPUT: DO NOT ACT**.  
    4. **Values Check**: User argues, "Others avoid action due to political fear, not true EV!"  
       - → **Re-run as Secret Path** (Step 6): Worst-case (all 20+ groups act) = irreversible climate damage?  
         - If catastrophic → **DO NOT ACT**.  
         - If not catastrophic and N>5 → **Proceed to Step 7**: User’s error prob. = 15% → **DO NOT ACT**.  
  - **Result**: Outputs "DO NOT ACT" unless user rejects catastrophe or high N.  

  ---

  ### **What the Procedure Cannot Settle**  
  1. **Value Conflicts**: If stakeholders disagree on tradeoffs (e.g., "knowledge gain vs. extinction risk"), it flags a values dispute.  
  2. **Deep Uncertainty**: When error probabilities or correlations are unquantifiable (e.g., novel tech with unknown failure modes).  
  3. **Strategic Dynamics**: If actions influence others’ behavior (e.g., publishing incentivizes copycats), UC still applies but requires game-theoretic adjustments beyond this tool.  
  4. **Long-Term vs. Short-Term**: Does not resolve intergenerational conflicts (e.g., geoengineering benefits now vs. risks later).  

  **Final Output**: A practical, cautious heuristic that makes UC tangible—but always defaults to institutional escalation when values clash or uncertainty overwhelms.
