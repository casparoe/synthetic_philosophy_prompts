   10. Summary of the procedure:

     We design a step-by-step:

     Step 1: Reversibility
        - Is the action reversible quickly and without significant interim harm?
            - If yes: then act if the user believes the expected value is positive (but note: even for reversible actions, multiple simultaneous actions might cause harm. The user should consider: if the action is taken by many, can it be reversed in time? If not, then treat as irreversible).

        We define:
          - Reversible: if the action can be undone without significant cost and within a time frame that prevents any substantial harm from having occurred.

        If reversible, then the curse is less of a concern. Proceed to act if the user's own judgment is positive.

        If not reversible, go to step 2.

     Step 2: Visibility
        - Can others observe whether the action has been taken?
            - If yes: public path (step 3)
            - If no: secret path (step 4)

     Step 3: Public Path
        - Has the action already been taken by someone else?
            - If yes:
               - What is the marginal impact of one more action? 
                   - If the user believes the marginal impact is positive, then act.
                   - If negative, then do not act.
            - If no:
