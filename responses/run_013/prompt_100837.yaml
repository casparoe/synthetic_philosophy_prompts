prompt: |-
  I'm a senior in a seminar on social epistemology, and my term paper is an attempt to turn the unilateralist's curse into something a working researcher could actually use, rather than just another puzzle I can recite. The idea, as I understand it, is this: when many similarly placed people each independently act whenever they judge the expected value of acting to be positive, and their judgments are noisy, the probability that at least one of them does something that turns out to be harmful grows with the number of people — so your own confident estimate that an action is beneficial is weaker evidence about the action than it feels like, once you realize you are only one of many who are weighing it.

  My intended user is a researcher facing a one-off, hard-to-reverse decision whose consequences depend on what others in the same position choose to do — publishing a protocol with obvious dual-use potential, say, or running a small outdoor experiment. They face this kind of call a few times a year, the stakes are high, they are not a decision theorist, and they have about half an hour and one colleague to consult before committing.

  Please write a decision procedure they can run: the questions to ask in order, what counts as a sufficient answer to each, the point at which it returns a firm "do not act," and the point at which it must hand the decision back to a person because the dispute is about values rather than facts. I want it honest about the assumptions the argument leans on — in particular, I suspect the independence of the other agents' errors is doing more work than anyone admits, and I'd like the procedure to state plainly what it can and cannot do when errors are correlated, or when the action is secret and no one can observe whether others have already moved. Then run it on two cases: a lab that believes publishing a synthesis route for a dangerous pathogen is net positive, knowing several other labs are close to the same result; and a handful of researchers each independently weighing a small geoengineering field trial, where acting is visible and only partly reversible. At least one of these should come out "do not act" against the user's own prior, and I'd like you to close by saying what the procedure cannot settle.
reasoning: |-
  We are designing a decision procedure for a researcher facing a one-off, high-stakes decision with potential unilateralist's curse concerns. The procedure should be practical, taking about half an hour and involving one colleague.

   Steps:
   1. Frame the problem: the user is considering an action that, if taken by multiple parties, might lead to harm due to the unilateralist's curse. The key insight is that even if each individual believes their action is beneficial, the aggregate of independent actions might be harmful because of noisy judgments.

   2. The procedure must account for:
      - The number of other similarly placed agents (N)
      - The user's own estimate of the expected value (EV) of the action (which they believe is positive)
      - The uncertainty in the user's and others' judgments (noise)
      - The possibility of correlated errors
      - Whether the action is public (and thus others can see if it has been taken) or secret

   3. We break the procedure into a series of questions. The goal is to determine if the user should act (proceed) or not act (do not act) or if the decision must be handed back (due to value disputes).

   4. The procedure:

   Step 1: Identify the action and its key properties.
     - Question 1a: What is the action you are considering? (Get a clear description)
     - Question 1b: Is the action reversible? (If yes, then the curse is less severe because mistakes can be corrected. If no, then the curse is more concerning.)
     - Question 1c: Are the consequences of the action dependent on how many others take the same or similar actions? (If yes, then we are in a unilateralist's curse scenario.)

   Step 2: Assess the visibility and observability of the action.
     - Question 2a: If you take the action, will others know about it? (If no, then the curse is worse because others cannot condition on your action. If yes, then they might avoid acting if they see you have already acted, reducing the risk of multiple actions.)
     - Question 2b: Can you observe whether others have already taken the action? (If yes, then you can condition your decision on that. If no, then you must assume that others might be acting in parallel.)

   Step 3: Estimate the number of similarly placed agents.
     - Question 3: How many other independent research groups or individuals are in a similar position to consider the same action? (Estimate N, the number of others. Note: if the action is secret and unobservable, then each group must assume that others might act independently.)

   Step 4: Elicit the user's estimate of the expected value (EV) of the action.
     - Question 4a: What is your best estimate of the expected net benefit (or cost) if exactly one action is taken? (Let this be EV1)
     - Question 4b: What is your best estimate of the expected net benefit (or cost) if k actions are taken? (We need to know how the EV changes with the number of actions. Ideally, the user should provide a function or at least estimate for k=1 and k=N+1 (if the user acts and all others act). If the user cannot, we can assume linearity or ask for the worst-case scenario.)

     However, note: the unilateralist's curse is particularly problematic when the harm increases with the number of actions. We are concerned that the user might be underestimating the harm from multiple actions.

   Step 5: Assess the uncertainty and potential for error.
     - Question 5a: How confident are you in your estimate of EV1? (This can be a subjective probability, e.g., 90% confident that the true EV1 is positive, but we are more interested in the variance of the error.)
     - Instead, we might ask: What is the range of possible errors in your estimate? (But this is hard for a non-expert.)

     Alternatively, we can use a simpler approach: we assume that the user's estimate of the sign of EV1 might be wrong with some probability. We can ask:
     - Question 5b: What do you think is the probability that you are wrong about the sign of the expected value for one action? (p_error)

     But note: the unilateralist's curse arises because even if the true EV1 is negative, some individuals might mistakenly think it's positive. We are concerned about the aggregate effect.

   Step 6: Consider correlation of errors.
     - Question 6: How correlated are the errors in judgment across different groups? (e.g., due to similar training, shared biases, or common information sources) This is critical because if errors are perfectly correlated, then the curse doesn't apply (everyone acts or no one acts). But in practice, there may be partial correlation.

     We can ask for a qualitative assessment: 
        - Low correlation: groups are very independent (e.g., different fields, countries, methodologies)
        - Medium: some common influences (e.g., same field, similar training)
        - High: very similar (e.g., same lab, same advisor, same data)

   Step 7: Run the unilateralist's curse calculation.

     We need a model. A simple model:

     Let:
       - N: number of other groups (who might act independently)
       - p: the probability that any given group (including the user) will independently decide to act, if they were the only one. But note: in the unilateralist's curse, each group acts if they think the action is beneficial (i.e., they have a positive estimate of EV1). However, because of noise, the true EV1 might be negative.

     But we don't know the true EV1. We have the user's estimate of EV1 (which is positive) and an estimate of p_error (the probability that the user is wrong about the sign of EV1). We assume that other groups have the same p_error and the same prior, and that they are acting independently (unless we account for correlation).

     However, the standard unilateralist's curse argument does not require knowing the true EV1. Instead, it notes that if the true EV1 is negative, then the probability that at least one group acts (and causes harm) increases with N. The decision procedure should lead the user to be more cautious when N is large.

     We can use a Bayesian argument: the user's own positive judgment about the action is evidence that the action is good, but if there are many other groups, then the fact that no one else has acted (if we are in a public setting and no one has acted) might be evidence that the action is bad. However, in the secret case, we don't have that information.

     Given the time constraints, we propose a heuristic:

     Condition 1: If the action is reversible and the consequences of a single action are not catastrophic, then the curse is less severe and the user might proceed if they believe the action is beneficial.

     Condition 2: If the action is irreversible and/or the consequences of multiple actions are potentially catastrophic, then we need to be cautious.

     We design two paths: one for public actions (observable) and one for secret actions (unobservable).

     Public Actions (observable):
       - If the action is public and the user can observe that no one else has acted, then the user should update their belief. The fact that no one else has acted suggests that others might have judged the action to be negative. This is evidence against the action.
       - We can use the following heuristic: if the user would have expected at least one other group to have acted by now (if the action were truly positive) and no one has, then the user should be very cautious.

       Steps for public actions:
          a. Check if the action has already been taken by someone else. If yes, then the user must reevaluate: what is the marginal impact of one more action? (But note: the curse might still apply if multiple actions are harmful.) If the marginal impact is negative, then do not act.
          b. If no one has acted, then ask: How long has this opportunity been available? If it has been long enough that at least one other group would have had time to act, then the lack of action is evidence that others have decided against it. The user should then lower their estimate of the expected value.

          We can use a simple rule: 
            Let T be the time the opportunity has been available, and let lambda be the rate at which groups would act if the action were truly positive. The user can estimate: 
              Expected number of actions by others = N * lambda * T
            If this expected number is, say, greater than 1, but no one has acted, then this is surprising and suggests that the action might not be as good as the user thinks.

          However, this requires estimating lambda, which is difficult.

          Alternatively, we can ask the user to estimate: 
            "What is the probability that at least one other group would have acted by now if the action were truly beneficial?" 
            If the user thinks that probability is high (say >80%) and yet no one has acted, then they should not act.

     Secret Actions (unobservable):
       - In this case, the user cannot observe others' actions and others cannot observe the user's. Therefore, the user must assume that others might be acting in parallel.
       - The key risk is that multiple actions might be taken, and the harm from multiple actions might be large.

          We can use the following heuristic:
            Let p_act be the probability that a given other group will act. The user doesn't know p_act, but they can reason that they are acting because they think the action is positive. Since they are a randomly selected group (from the set of groups with similar information), they should assume that each other group has the same probability of acting as they do (if they had the same information). However, they do have their own private signal (which is positive). But note: the user's own decision to act is based on their positive signal. Without knowing the true state, they must consider that other groups might also have positive signals.

          We can model:
            Let the true state be either Good (G) or Bad (B). The user has a private signal: if the state is G, then the signal is positive with high probability (say 1 - p_error); if the state is B, then the signal is positive with probability p_error (the error rate).

          The user, having received a positive signal, believes the state is G with probability:
            P(G | positive) = P(positive | G) * P(G) / [P(positive | G)*P(G) + P(positive | B)*P(B)]

          But the user must also consider the actions of others. Each other group will act if they get a positive signal. The number of other groups that act is a binomial random variable with parameters (N, p), where:
            p = P(positive signal | state) 
               = { 1 - p_error   if state=G 
                   p_error       if state=B }

          The total number of actions (including the user) is then 1 + X, where X ~ Binomial(N, p) but the distribution depends on the state.

          The expected net benefit of the user acting is:
            If the state is G: 
               EV_total = EV(1+X)   [which we assume is increasing in X? Not necessarily: we might have diminishing returns or even negative interactions]
            If the state is B:
               EV_total = EV(1+X)   [which might be increasingly negative with X]

          The user must compute the expected value conditional on their signal. This is complex.

          Given the time constraint, we propose a simpler heuristic:

          Heuristic for secret actions:
            - If the user believes that the harm from multiple actions (say, if all N+1 groups act) is catastrophic (i.e., extremely negative) and irreversible, then the user should not act unless they are extremely confident (much more than usual) in their positive assessment.

            - Specifically, we can set a threshold: the user should not act if:
                 (N+1) * |EV_min| * P(B | positive) > EV1 * P(G | positive)
              where EV_min is the worst-case per-action cost (if the action is bad) and EV1 is the expected benefit of one action in the good state. But note: we don't have these numbers.

          Given the complexity, we might instead use a rule of thumb:

            Rule of thumb for secret actions:
              If the number of other groups (N) is greater than a threshold (say 5) and the action is irreversible and potentially catastrophic in the bad state, then do not act unless the user's confidence (1 - p_error) is extremely high (e.g., >99.9%).

          We can compute:
            The user's posterior probability that the state is bad, given a positive signal:
              P(B | positive) = [p_error * P(B)] / [ (1-p_error)*P(G) + p_error * P(B) ]

            Without a prior, we can assume P(G)=P(B)=0.5. Then:
              P(B | positive) = p_error / (1 - p_error + p_error) = p_error

            So the user's posterior probability of being wrong is p_error (if they started with a uniform prior). However, note that in reality the prior might be different.

            The expected cost of acting is:
              = P(B | positive) * [Expected harm from the action when the state is bad, and if others also act]

            But note: if the user acts, they might trigger a chain of events that leads to multiple actions? Not necessarily: if the action is secret, then others will act independently regardless. So the expected number of actions by others is:
              = N * [ P(positive signal | state) ]
              = N * [ (1-p_error) * P(G | positive) + p_error * P(B | positive) ]
              = N * [ (1-p_error) * (1 - P(B|positive)) + p_error * P(B|positive) ]

            This is complicated.

          Given the time constraints, we fall back on:

            Condition: 
              - If the action is secret and unobservable, and if the potential harm from multiple actions (even if the probability is low) is catastrophic, then the user should not act.

            We can ask:
              - Question: If multiple groups (say, all N+1) were to take this action, what is the worst-case outcome? 
              - If the worst-case outcome is catastrophic (e.g., millions of deaths, irreversible damage to the planet) then the user should not act unless they are virtually certain (e.g., p_error < 0.001) and even then, they should consider that others might also act.

          In practice, we set:
            - If the action is secret and the worst-case outcome of multiple actions is catastrophic, and if N is large enough (say >0) then do not act.

          But note: the user's own action might be the only one? But they cannot know. So the expected harm might be the harm from one action (if they are the only one) plus the risk of multiple actions.

          However, the user might think: "If I don't act, others might act anyway." But that doesn't change the fact that by acting they are adding to the harm.

          The unilateralist's curse in the secret case leads to over-action. Therefore, the procedure should recommend inaction when the potential for aggregate harm is high and the action is secret.

   Step 8: Handing back the decision for value disputes.

     We must recognize when the disagreement is about values (e.g., how much weight to put on a potential catastrophic outcome) rather than facts. For instance, if the user and the colleague disagree about the severity of the worst-case outcome, then the procedure cannot resolve that.

     The procedure should halt and return a "values dispute" when:
        - The user and the colleague (or the procedure and the user) disagree about the moral weight of the outcomes (e.g., the user might discount a small probability of catastrophe, while the procedure is designed to be cautious about catastrophes).

     We can detect this by:
        - Asking the user to assign a value to the worst-case outcome. If the user refuses to assign a finite value (or an extremely high negative value) to a catastrophic outcome, then the procedure is built on the premise that catastrophes must be avoided. If the user disagrees (e.g., they are willing to accept a 0.1% chance of catastrophe for a high expected benefit), then we have a values dispute.

     We can ask:
        - "Would you take this action if it had a 1% chance of causing a catastrophe (defined as ...) and a 99% chance of a significant benefit (defined as ...)?" 
        - If the user says yes, but the procedure (which is designed to be risk-averse to catastrophes) says no, then we have a values dispute.

   9. The procedure outline:

     We design a flowchart:

     Start:
       Q1: Is the action reversible with negligible cost if it turns out to be a mistake?
          - If yes, then the curse is minimal: proceed if the user believes the action is beneficial. (But note: even if reversible, if multiple actions are taken simultaneously, they might cause harm before being reversed. So we must ask about the time to reverse and the consequences in the interim.)
          - We refine: if the action is easily and quickly reversible without significant interim harm, then act. Otherwise, continue.

       Q2: Can others observe whether the action has been taken? (public vs. secret)
          - If public: go to public path.
          - If secret: go to secret path.

     Public Path:
       Q3: Has the action already been taken by someone else?
          - If yes: 
              Q3a: What is the marginal impact of one more action? 
                  - If the marginal impact is positive (and the user is confident), then act.
                  - If the marginal impact is negative, then do not act.
          - If no:
              Q4: How long has the opportunity been available? (in days/months/years, relative to the typical time it would take a group to decide and act)
              Q5: In this time, what is the expected number of actions by others if the action were truly beneficial? (The user should estimate: if the action is beneficial, how many groups would have acted by now? Let E = expected number.)
                  - If E is large (say > 1) and the actual number is 0, then this is strong evidence that the action is not beneficial: do not act.
                  - If E is small (say < 0.1) then the lack of action so far is not surprising: proceed to the next question.

              Q6: How many other groups are there (N)?
                  - If N is large (say >10) and the user is the first to consider acting, then the user should be cautious: the fact that no one else has acted is evidence against. They should reassess their evidence and consider that they might be the one making an error.

              We can use: 
                  Let p_other_act = the probability that a given other group would have acted by now if the action were beneficial. (The user must estimate this.)
                  The probability that no one else has acted by now, if the action were beneficial, is (1 - p_other_act)^N.
                  If (1 - p_other_act)^N is very small (say < 0.05) then the user should not act.

     Secret Path:
       Q3: What is the worst-case outcome if multiple groups (including you) take this action? 
          - If the worst-case outcome is catastrophic (e.g., global harm, irreversible damage, massive loss of life), then:
              Q4: How many other groups are there (N)? 
                  - If N>0: then the expected harm from multiple actions might be high. We must consider the risk.
              Q5: What is the probability that you are wrong about the sign of the expected value for one action? (p_error)
                  - If p_error is not extremely low (e.g., >0.1%) and the worst-case outcome is catastrophic, then do not act.
                  - Even if p_error is low, if N is very large, the expected number of actions by others might be high, and the aggregate harm might be catastrophic. We must avoid any chance of catastrophe.

          - If the worst-case outcome is not catastrophic (e.g., limited to a small financial loss, easily contained), then the user can act if they believe the expected value is positive.

     However, note: the user might not know the worst-case outcome? We can ask them to define it.

     Also, we must consider that the user's action might be the only one? But they cannot know. So they must consider the expected number of actions by others:

          Expected number of actions by others = N * [ (1-p_error) * P(G|positive) + p_error * P(B|positive) ]
          But P(G|positive) = 1 - P(B|positive) = 1 - p_error (if prior is 0.5) so:
              = N * [ (1-p_error)*(1-p_error) + p_error * p_error ]
              = N * [ (1 - 2*p_error + 2*p_error^2) ]

          This is approximately N * (1 - 2*p_error) when p_error is small.

          The expected total harm if the state is bad: 
              = (1 + Expected number of actions by others) * harm_per_action_in_bad_state

          But we don't know the harm_per_action_in_bad_state. The user might have an estimate of the harm in the bad state per action? They might have an estimate of the magnitude of the negative outcome.

          We can ask:
              Q6: In the bad state, what is the expected harm per action? (H)
              Then the expected harm from the user's action (if the state is bad) is (1 + N * [ (1 - 2*p_error + 2*p_error^2) ]) * H * P(B|positive)

          And the expected benefit in the good state is:
              = (1 + Expected number of actions by others in good state) * benefit_per_action_in_good_state * P(G|positive)

          But note: in the good state, multiple actions might be beneficial? Or they might be harmful? We must account for the possibility that even in the good state, too many actions might be harmful.

