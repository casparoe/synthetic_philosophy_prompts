        - At any step, if the user and the colleague (or the procedure) disagree about the assessment of catastrophic outcome (e.g., the user thinks a 1% risk of catastrophe is acceptable given the potential benefits, but the procedure is designed to avoid such risks), then we flag a values dispute.

