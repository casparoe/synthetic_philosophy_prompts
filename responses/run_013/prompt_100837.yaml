                   - If T is much less than T_typical, then it's too early to see others act: go to step 3b.
                   - If T is at least T_typical, then we should have seen at least one action if the action were beneficial.

               - Ask the user: "If the action were truly beneficial, what is the probability that at least one other group would have acted by now?" 
