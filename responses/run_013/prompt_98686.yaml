prompt: |-
  I'm in my third year and taking a course on rationality and choice -- decision theory plus some philosophy of action -- and I'm trying to write the framing section of a paper on diachronic rationality, i.e. rationality for agents that persist over time. Before I start comparing anybody's theory I want the spec first: what does any adequate theory in this area actually have to deliver? So if you'd act as an expert on decision theory and practical rationality and start by brainstorming the candidate requirements before you commit to a list, I'd appreciate it. Then give me the list: the cases the theory has to get right, the distinctions it can't just collapse, and the results from the rest of decision theory it can't contradict -- with the consideration behind each one, and a verdict on which are non-negotiable and which are really just commitments of one camp.

  Some of what's making me confused, so you know where I'm coming from. The standard move is the money pump: someone whose preferences go in a circle (she'll pay a little to swap A for B, a little to swap B for C, a little to swap C back to A) gets bled dry by a patient trader, and that's supposed to prove the cycle is irrational. But I keep noticing the pump seems to trade on two different things at once -- the structure of her preferences (the cycle) and the fact that she'll keep trading and can't commit -- and I'm not sure which one is doing the work. And then there's the case where she doesn't reverse any preference, she just changes her mind for good reason (she learns something), and a trader who anticipated the change can pump her anyway; surely that's not a proof that learning is irrational. So I want the requirements list to force a clean answer about what a pump is evidence of and what it isn't. Related: the "resolute" move, where the agent decides in advance to stop trading and then sticks to it -- does a theory have to count that as rational, or as a kind of cheating? And the addict/Odysseus cases, where the agent's own future preferences are the threat, and the old puzzle about whether a preference reversal is irrational or just a change of tastes the theory has no business policing. I also care a lot about the distinction between a requirement on the agent's preference set at a time and a requirement on her decision procedure over time -- I suspect a good chunk of the disagreement in this literature is people quietly answering different questions, and I want the list to keep those apart.

  One thing I'd find really useful: flag any pair of requirements I can't have together. My gut says the demand that the theory return a determinate verdict in every case, the demand that it not require more of agents than bounded, forgetful, tempted humans can actually do, and the demand that it count at least some preference changes as rational are definately not all going to fit at once -- if that's right, tell me which one has to go and what that does to the surviving theories. And tell me which single requirement rules out the most otherwise-popular theories; that's the bit I most want for the paper. Please be careful and explicit about separating what's settled among people who work on this from what's genuinely contested -- I don't want a contested reading served up as the consensus. Thanks!
reasoning: |-
  Okay, the user is a third-year student writing a paper on diachronic rationality, which deals with how agents make rational decisions over time. They're setting up the framing section and need a list of requirements that any adequate theory must meet. Let me start by understanding their main concerns.

  First, they're confused about money pumps. They notice that the standard argument points to cyclic preferences as irrational, but the pump also relies on the agent's inability to commit. They wonder if it's the cycle or the lack of commitment that's the real issue. Then there's the case where an agent learns something new and changes preferences, which seems rational, but a trader could still exploit that change. So the user wants clarity on what exactly a money pump proves. 

  Another point is the resolute approach, where an agent commits in advance and sticks to it. Is that considered rational or cheating? There's also the addict/Odysseus scenario, where future preferences are a threat, and whether preference reversals are irrational or just changing tastes. The user is keen on distinguishing between requirements on preferences at a single time versus decision procedures over time, as they suspect much of the disagreement in the literature stems from conflating these.

  They also mention potential conflicts between requirements: needing determinate verdicts, accounting for bounded rationality, and allowing rational preference changes. They suspect these can't all coexist and want to know which one might have to give. Plus, they want to know which requirement rules out the most popular theories.

  I need to brainstorm candidate requirements. Let me think about the core problems in diachronic rationality. First, synchronic coherence: preferences at any single time should be transitive, complete, etc. But diachronic coherence involves consistency over time, like not being money pumped. Then there's the distinction between preferences and procedures. Also, how to handle new information—updating should be rational via conditionalization. 

  The user brought up money pumps. The standard pump requires cyclic preferences plus sequential choices. But if an agent can commit, maybe the cycle isn't the issue. So Requirement 2 should address exploitability but clarify that it's only irrational if the agent can't avoid it. That ties into the resolute approach—if commitment is possible, resolute might be rational. But some theorists see that as cheating, so Requirement 2 needs to be negotiable depending on the theory.

  Preference changes: are they rational only with new info? Or can tastes change? Some theories allow non-informational changes, others don't. This affects how we judge cases like the addict. Also, the distinction between preferences and procedures is crucial. Requirements should separate what the agent prefers from how they make decisions.

  Conflicting requirements: Determinacy (every case has a rational verdict) vs. Bounded Rationality (humans can't do complex calculations) vs. Permissive Preference Changes (allowing rational taste shifts). If a theory requires determinate answers and allows taste changes, it might demand too much from bounded agents. So bounded rationality might be the one to give, leading to ideal vs. non-ideal theories. 

  Which requirement rules out the most theories? Synchronic Coherence is widely accepted, so it doesn't rule out many. Exploitability Avoidance is key—it rules out naive approaches but is contested. Permissive Preference Changes rules out theories that require stable preferences, like some versions of expected utility. 

  The user also needs clarity on settled vs. contested points. Synchronic Coherence is settled. Exploitability Avoidance is contested, especially regarding commitment. The resolute approach is a big debate. Preference changes with information are settled, but without info, contested. 

  Putting it all together, the list should include both non-negotiable and negotiable requirements, with explanations of conflicts. Highlighting that bounded rationality might conflict with determinacy and permissive changes will help the user frame their paper's argument. Also, emphasizing that Exploitability Avoidance is key to differentiating theories will address their need to show which requirement rules out popular approaches.
answer: |-
  Here’s a structured framework for the requirements of an adequate theory of diachronic rationality, designed to address your core concerns (money pumps, commitment, preference change, and the synchronic/diachronic distinction). I’ll distinguish **non-negotiable** requirements (widely accepted as essential), **negotiable/camp-specific** ones (reflecting theoretical divides), and **conflicts** between requirements. The goal is to force clarity on what money pumps reveal and what they don’t.

  ---

  ### **Core Requirements for Diachronic Rationality Theories**

  #### **1. Synchronic Coherence (Non-negotiable)**  
     - **What it demands**: At any *single* time, the agent’s preferences must satisfy standard rationality axioms (completeness, transitivity, independence if applicable).  
     - **Why**: Contradicts cyclical preferences *at a time*. Money pumps targeting synchronic cycles (A>B, B>C, C>A) rely on this.  
     - **Verdict**: Universally accepted. A theory violating this contradicts foundational decision theory.

  #### **2. Exploitability Avoidance (Negotiable)**  
     - **What it demands**: Agents should not be systematically vulnerable to exploitation (e.g., money pumps, Dutch books) *across time*.  
     - **Why**: The money pump is the central argument for diachronic coherence. But its force depends on whether:  
       - (a) Exploitability stems from *structural irrationality* (e.g., cyclic pref. + no commitment), or  
       - (b) It’s a *procedural failure* (e.g., inability to stick to plans).  
     - **Key Distinction**: Must separate *pumps due to preference cycles* (e.g., A>B>C>A) from *pumps due to predictable preference shifts* (e.g., learning, temptation).  
     - **Verdict**: **Contested**. Some camps (e.g., **Sophisticates**) say exploitability *always* indicates irrationality. Others (e.g., **Resolutists**) say it only matters if the agent *could have avoided it* via commitment.

  #### **3. Distinguishing Preference Change Types (Non-negotiable)**  
     - **What it demands**: The theory must differentiate:  
       - **Rational preference change**: Driven by *new information* (Bayesian updating).  
       - **Arational preference change**: Shifts due to temptation, boredom, or "taste drift" (e.g., addicts, Odysseus).  
       - **Irrational preference change**: Inconsistent shifts violating synchronic coherence.  
     - **Why**: To address your "learning vs. pumping" concern. Pumping an agent who learns *is not evidence of irrationality*—it exploits the trader’s foresight, not the agent’s flaw. Pumping an addict *might* indicate procedural irrationality.  
     - **Verdict**: Settled. Any theory collapsing these distinctions fails.

  #### **4. Procedural Neutrality vs. Prescriptivism (Negotiable)**  
     - **What it demands**: Must the theory *endorse specific decision procedures* (e.g., planning, commitment devices) or only judge *outcomes*?  
     - **Why**: Central to the "resolute vs. sophisticated" debate:  
       - **Sophisticates**: Rationality requires forecasting future irrationality and minimizing losses (e.g., avoiding tempting situations).  
       - **Resolutists**: Rationality permits "sticking to plans" even if preferences shift (e.g., Odysseus tying himself to the mast).  
     - **Verdict**: **Contested**. Some require procedural prescriptions (e.g., "use commitment devices if available"), others see resoluteness as "cheating" if it overrides current preferences.

  #### **5. Diachronic Consistency (Negotiable)**  
     - **What it demands**: Should earlier plans constrain later choices?  
       - **Strong version**: Later actions must align with earlier *intentions* (Bratman-style).  
       - **Weak version**: Later actions must align with earlier *conditional commitments* (Gauthier-style).  
     - **Why**: Addresses whether an addict who *plans* to quit but fails is irrational.  
     - **Verdict**: **Camp-specific**. Causal Decision Theorists often reject strong diachronic constraints; Intentionalists embrace them.

  #### **6. Synchronic vs. Diachronic Requirements Separation (Non-negotiable)**  
     - **What it demands**: The theory must explicitly distinguish:  
       - **Synchronic requirements**: Constraints on preferences/choices *at a time*.  
       - **Diachronic requirements**: Constraints on sequences of choices *over time*.  
     - **Why**: Your core insight—many debates conflate these (e.g., "preference reversals are irrational" confuses synchronic coherence with diachronic stability).  
     - **Verdict**: Settled. Failure here produces category errors.

  ---

  ### **Conflicting Requirements & Trade-offs**  
  Your intuition is correct: **three key demands conflict** in bounded agents:  
  1. **Determinacy**: Every case has a unique rational verdict.  
  2. **Bounded Rationality**: Must be feasible for cognitively limited agents.  
  3. **Permissive Preference Change**: Allows rational non-informational preference shifts (e.g., taste drift).  

  #### **The Incompatibility Trilemma**:  
  - If a theory allows **permissive preference change** (e.g., "tastes can evolve rationally"), it needs flexible diachronic rules → undermines **determinacy**.  
  - If it insists on **determinacy** *and* **permissive preference change**, it requires agents to pre-commit to complex contingency plans → violates **bounded rationality**.  
  - If it demands **bounded rationality** *and* **permissive preference change**, it must accept indeterminacy (e.g., "multiple strategies are rational").  

  **→ Which must go?**  
  - **Bounded Rationality** is the usual casualty. Most theories (e.g., sophisticated choice) assume ideal agents.  
  - **Result**: Theories for bounded agents (e.g., **heuristics-based models**) sacrifice determinacy; **Resolutism** sacrifices procedural neutrality.  

  ---

  ### **Which Requirement Rules Out the Most Theories?**  
  **Requirement 2 (Exploitability Avoidance)** is the litmus test:  
  - **Ruled out**:  
    - **Naive choice** (always follows current preferences → pumped).  
    - **Extreme Resolutism** (sticks to plans even when preferences shift for good reasons → vulnerable to *informational* pumps).  
  - **Surviving camps**:  
    - **Sophisticates** (avoid exploitability by anticipating weakness).  
    - **Moderate Resolutists** (commit only when preference shifts are irrational).  

  **Requirement 4 (Procedural Prescriptivism)** also cleaves the field:  
  - **Ruled out**: Pure outcome-based theories (e.g., standard EDT/CDT without commitment devices).  

  ---

  ### **Settled vs. Contested: Key Takeaways**  
  - **Settled**:  
    - Synchronic coherence is non-negotiable (Requirement 1).  
    - Distinguishing types of preference change is essential (Requirement 3).  
    - Synchronic/diachronic requirements must be separated (Requirement 6).  
  - **Contested**:  
    - **Exploitability Avoidance**: Is vulnerability *always* irrational? (No consensus).  
    - **Resoluteness**: Is it rational or cheating? (Divides Intentionalists vs. Humeans).  
    - **Diachronic Constraints**: How strong are they? (Philosophically loaded).  

  ---

  ### **Money Pump Clean Answer**  
  A money pump is evidence of:  
  1. **Synchronic irrationality** if the agent has cyclical preferences *at a time*.  
  2. **Diachronic procedural irrationality** if the agent could avoid exploitation via commitment *but fails to do so*.  
  It is **NOT** evidence of irrationality if:  
  - The agent learns new information and updates preferences.  
  - The agent uses commitment to block exploitation (e.g., Odysseus).  

  This forces theories to specify *when* exploitability indicates irrationality—resolving your confusion about what pumps "prove."  

  Use this framework to map theories (e.g., Sophisticates accept Requirement 2 strictly; Resolutists relax it but demand Requirement 4). Highlighting the **Incompatibility Trilemma** shows why no theory satisfies all desiderata—especially for bounded agents. This sets up your critique of existing approaches. Good luck!
