prompt: |-
  In a seminar I'm taking on chance and rational credence, we spent a session on the principle that ties your degrees of belief to objective chance, and I've been unable to settle a worry that came out of it. Stated in the way that seems most natural to me, the principle says that if you know the objective chance of some proposition A is p, and none of your other evidence is relevant to A over and above the chance (no crystal ball, no inside tip, no information that already settles how the chance plays out), then your credence in A ought to be p. I want to be able to defend that, because it looks like the plainest requirement of rationality imaginable: what else would you go on, if you knew the chances and nothing else of use? The difficulty arises, though, once we take seriously the picture on which chances are not free-standing features of the world but rather the probabilities that figure in the best systematization of the whole history of the world, the system that best balances strength and simplicity. On that picture the future can reach back into the present chance facts, and there will be futures that undermine the present chances: A has a present chance of 0.5, and yet had A occurred, the best system would have assigned A a chance of 0.9 given the present state, so that the proposition stating the present chance, that A's chance is 0.5, can be true only in worlds where A does not occur.

  A friend in the seminar thinks this is fatal rather than awkward. His argument is that an agent who knows the chance of A is 0.5 knows a proposition that, together with what she knows about the past, rules A out; so the principle would have her put credence 0.5 on something her own evidence excludes, and any rule with that consequence has to go. What he proposes instead is a rule of the following shape: your credence in A conditional on the past together with the complete theory of chance should equal the chance of A conditional on the theory alone, which, in the undermining case, yields a value different from the chance itself. I can't tell whether that is a genuine repair, an evasion dressed up as precision, or a cure for a disease the original principle never had, and I suspect the answer turns on questions I haven't got straight about what it is to know a theory of chance and about whether the trouble lies with the principle or with the account of chance it is being paired with.

  Please write me an essay that adjudicates this. I would like it to say precisely what the original principle claims and what the revised rule claims, and to show whether and where the two actually diverge in the undermining case rather than merely sounding different; to assess my friend's argument that the original principle is refuted by that case, saying what has to be true of the agent's evidence for the argument to go through; and to say whether the problem belongs to the principle or to the account of chance, including whether it survives if chances are instead taken to be primitive features of the world that do not supervene on the total history, so that no future could undermine them. Then reach a verdict: either the original principle stands as stated, or the revision is correct, or some third position, with the reasons that support it and the strongest objection it faces.
reasoning: |-
  Hmm, the user is grappling with a deep philosophical problem about the relationship between objective chance and rational credence. They're studying a principle that says if you know the chance of A is p and have no other relevant evidence, your credence should be p. But their concern stems from the "best system" account of chance, where future events can undermine present chance assignments.

  The core issue is this undermining scenario: A has present chance 0.5, but if A were to occur, the best system would have assigned it chance 0.9 instead. This creates tension because knowing the chance is 0.5 seems to imply A won't happen, yet the principle tells you to set credence to 0.5 anyway. Their friend argues this is fatal to the original principle and proposes a revised rule.

  I need to carefully unpack both principles. The original is the Principal Principle (PP): Cr(A | ch(A)=p ∧ E) = p, where E is admissible evidence. The revised rule is the New Principle (NP): Cr(A | H_t ∧ T) = ch_T(A | H_t), where T is the chance theory and H_t is history up to time t.

  The key difference appears in undermining cases. With PP, if you know ch(A)=0.5, you set credence to 0.5 even if that knowledge implies A can't occur. With NP, you conditionalize on the chance theory itself, which avoids this paradox because ch_T(A | H_t) won't be 0.5 in undermining scenarios.

  For the friend's argument to work, the agent must know the chance theory T itself, not just the chance value. This transforms "ch(A)=0.5" from a basic fact into a complex claim about how T applies to history. When combined with historical knowledge, this can indeed entail that A doesn't occur.

  The problem stems fundamentally from the best system account of chance. If chances were primitive (non-Humean), undermining wouldn't occur and PP would be fine. But under Humeanism, PP needs modification.

  I think the New Principle is the right solution here. It preserves the core intuition that chances should guide credences while respecting logical coherence. The strongest objection is that it requires knowing the entire chance theory, which may be unrealistic. But as an idealization for rational norms, it works.

  I'll structure my response to first clarify both principles, then analyze the undermining case, examine the evidentiary requirements, discuss metaphysical dependencies, and finally argue for NP while acknowledging its limitations. The user seems sophisticated but troubled by the implications, so I'll aim for precision while keeping it accessible.
answer: |-
  ## Adjudicating Chance, Credence, and the Undermining Threat

  Your worry cuts to the heart of a profound tension within the Humean "Best System Account" (BSA) of chance and its interaction with rational credence. The principle you describe—often called the **Principal Principle (PP)**—is indeed foundational. Your friend's critique, rooted in undermining scenarios, is serious but not necessarily fatal to the core idea that chances should guide credence. The resolution involves carefully refining the principle and understanding the metaphysics of chance. Let's dissect the arguments and principles precisely.

  **1. Clarifying the Principles:**

  *   **The Original Principle (Principal Principle - PP):**
      *   **Formulation:** `Cr(A | [ch_t(A) = p] ∧ E) = p`
      *   **Meaning:** Your rational credence (`Cr`) in proposition `A` at time `t`, conditional on knowing the objective chance of `A` at `t` is `p` (`ch_t(A) = p`), *and* conditional on any other admissible evidence `E`, should be `p`.
      *   **Admissible Evidence (`E`):** This is crucial. `E` must be "admissible" – meaning it contains no information relevant to `A` *over and above* the information encapsulated in the chance `p` itself. Typically, this includes only:
          *   Information about the complete physical state of the world *up to time `t`* (the past and present, `H_t`).
          *   Information about the *general* laws or patterns of the world (potentially including the *theory* of chance `T` itself).
          *   *Not* information about specific future outcomes (`A` or events that logically entail or preclude `A`).
      *   **Intuition:** Given knowledge of the objective probability and no "cheating" information about the specific outcome, your subjective uncertainty should match the objective uncertainty.

  *   **The Revised Rule (New Principle - NP):**
      *   **Formulation:** `Cr(A | H_t ∧ T) = ch_T(A | H_t)`
      *   **Meaning:** Your rational credence in `A`, conditional on the complete history of the world up to time `t` (`H_t`) *and* the complete true theory of chance `T`, should equal the chance that `T` assigns to `A` *given* that very history `H_t`.
      *   **Key Differences from PP:**
          1.  **Input:** Instead of conditioning on the specific chance value `ch_t(A) = p`, you condition on the *theory* `T` *and* the history `H_t`.
          2.  **Output:** The credence is set to the chance `T` assigns *conditional on `H_t`*, not necessarily the unconditional chance `T` assigns relative to some earlier time.
          3.  **Focus:** NP explicitly builds the dependence of chances *on the actual history* into the rule itself. It tells you to use the chance function `ch_T(· | H_t)` derived from `T` and `H_t` as your credence function *directly*.

  **2. The Undermining Case and Divergence:**

  Recall the undermining scenario under the BSA:
  *   The Best System `T`, relative to the *entire history* of the actual world `W`, assigns `ch_t(A) = 0.5` at time `t`.
  *   However, `A` occurring would lead to a different total history `W'`.
  *   Relative to `W'`, the Best System `T'` would assign `ch_t(A) = 0.9` given the state at `t` (which is the same in both `W` and `W'` until after `t`).
  *   Crucially, the proposition `ch_t(A) = 0.5` (which is true in `W`) is only true in worlds where `A` *does not occur* (because if `A` occurred, the best system would assign `ch_t(A) = 0.9`, not `0.5`). `ch_t(A) = 0.5` entails `~A`.

  **Where PP and NP Diverge (Crucially):**

  1.  **Applying PP:**
      *   Suppose the agent knows `ch_t(A) = 0.5` and `H_t` (the past/present up to `t`), and this is their total admissible evidence `E`.
      *   PP dictates: `Cr(A | ch_t(A)=0.5 ∧ H_t) = 0.5`.
      *   **BUT:** As established, `ch_t(A)=0.5 ∧ H_t` logically entails `~A` in the undermining scenario. Knowing `ch_t(A)=0.5` and `H_t` means knowing `A` is false!
      *   Result: PP demands credence `0.5` in `A` even though the agent's evidence logically entails `~A` (i.e., entails `Cr(A) = 0`). This is a direct contradiction. PP requires incoherent credences.

  2.  **Applying NP:**
      *   Suppose the agent knows `H_t` and the true chance theory `T`.
      *   NP dictates: `Cr(A | H_t ∧ T) = ch_T(A | H_t)`.
      *   `ch_T(A | H_t)` is the chance `T` assigns to `A` *given* the actual history `H_t`. `T` is the best system for the *actual* world `W`, where `A` does not occur.
      *   Since `T` is defined relative to the whole history `W` (including `~A`), `ch_T(A | H_t)` will *not* be `0.5`. It will reflect what `T` says about `A` *given that the actual future is `~A`*. Crucially, because `T` is only the best system in worlds where `~A` happens, `ch_T(A | H_t)` will typically be *very low* (reflecting the fact that `A`'s occurrence would undermine `T`'s status as best). It might even be `0` if `T` assigns `A` a chance incompatible with its occurrence given `H_t`.
      *   Result: NP sets credence to `ch_T(A | H_t)`, which, in the undermining case, will be low (likely `<< 0.5`, possibly `0`), correctly reflecting the fact that knowing `T` and `H_t` entails `~A`. NP avoids the contradiction; the credence matches the logical implications of the evidence.

  **Divergence Illustrated:** In the undermining case, PP says: `Cr(A | ch_t(A)=0.5 ∧ H_t) = 0.5`. NP says: `Cr(A | H_t ∧ T) ≈ 0`. These are radically different prescriptions. PP demands high credence in `A` despite evidence ruling it out; NP demands very low credence, respecting the entailment.

  **3. Assessing Your Friend's Argument:**

  Your friend argues: "an agent who knows the chance of A is 0.5 knows a proposition that, together with what she knows about the past, rules A out; so the principle would have her put credence 0.5 on something her own evidence excludes... [hence] fatal."

  *   **Is the Argument Sound?** **Yes, *if* the agent's evidence includes the specific chance proposition `ch_t(A)=0.5` and the history `H_t`, and *if* we are operating within a BSA framework where undermining is possible.**
  *   **What Must Be True of the Evidence?** For the argument to work:
      1.  The agent must know the *specific chance value* proposition `ch_t(A)=0.5`. Merely knowing the general theory `T` and `H_t` is not sufficient for this step.
      2.  The agent must know the complete history up to `t` (`H_t`).
      3.  The world must be one where `ch_t(A)=0.5` is true *only if* `~A` is true (i.e., an undermining world).
      4.  `H_t` combined with `ch_t(A)=0.5` must logically entail `~A` (which it does, by definition, in the undermining scenario under BSA).
  *   **Conclusion on Friend's Argument:** Under the BSA, with an agent who knows the specific chance value `ch_t(A)=p` and `H_t` in an undermining scenario, your friend is absolutely correct. PP leads to a direct contradiction between the credence it prescribes (`p`) and the credence logically demanded by the evidence (`0` or `1`). This *is* fatal to the original, unrestricted PP *when paired with the BSA*. PP becomes incoherent in undermining cases.

  **4. Where Does the Problem Lie?**

  *   **The Principle (PP) or the Account of Chance (BSA)?** The problem arises from the **interaction** between the two, but its root lies in the **nature of chance according to the BSA**.
      *   **The Core Issue (BSA):** Under the BSA, chance propositions (`ch_t(A)=p`) are *not* fundamental. They supervene on the *entire* history of the world, including the future. This future-dependence creates undermining possibilities. Crucially, `ch_t(A)=p` is a *high-level summary fact* about the global patterns described by the best system, not a local, intrinsic propensity. Knowing `ch_t(A)=p` carries implicit information about the future patterns that make `T` best, which can logically constrain future outcomes like `A`.
      *   **PP's Vulnerability:** PP treats chance propositions (`ch_t(A)=p`) as if they *were* local, intrinsic propensities – fundamental facts that screen off the future. PP assumes that knowing `ch_t(A)=p` gives you pure probability information without logically constraining `A` itself. This assumption is violated by the BSA's global, supervenient nature of chance. PP is incompatible with the logical structure of chance propositions generated by the BSA.
  *   **Does the Problem Survive Primitive Chances?** **No.** If chances are primitive, fundamental features of the world that do *not* supervene on the total history (a non-Humean, "primitive propensitist" view), then undermining is impossible.
      *   On this view, `ch_t(A)=p` is a basic, irreducible fact about the world at `t`. It does not depend on future outcomes. Knowing `ch_t(A)=p` tells you nothing whatsoever about whether `A` will actually happen *except* that it has probability `p`. `ch_t(A)=p` is logically compatible with both `A` and `~A`.
      *   Therefore, knowing `ch_t(A)=p` and `H_t` does *not* entail `~A` (or `A`). There is no contradiction in PP prescribing `Cr(A | ch_t(A)=p ∧ H_t) = p`. The evidence does not settle `A`; it leaves it genuinely open with probability `p`.
      *   **Conclusion:** The undermining problem and the fatal conflict with PP are *specific consequences of the Humean BSA*. If chances are primitive, PP stands unchallenged by this particular argument.

  **5. Verdict: The New Principle is (Mostly) Correct for Humeanism**

  *   **The Case for the New Principle (NP):**
      1.  **Coherence:** NP avoids the logical contradiction inherent in PP under the BSA. It respects the fact that knowing the chance theory `T` and history `H_t` can entail facts about the future (`~A` in undermining cases) and prescribes a credence that reflects this (`ch_T(A | H_t) ≈ 0`).
      2.  **Humean Compatibility:** NP is tailor-made for the BSA. It takes the chance function `ch_T(· | H_t)` derived from the global best system `T` and the specific local history `H_t` as the direct guide for rational credence. It explicitly acknowledges that the rational credence function depends on the global patterns (`T`) and the local state (`H_t`).
      3.  **Preserves the Core Intuition:** While not as simple as PP, NP still embodies the core idea that rational credence should track objective chance. It just does so in a way that respects the complex, global nature of Humean chance. `ch_T(A | H_t)` *is* the objective chance of `A` at `t` according to the best system `T`, given the actual history `H_t`. NP tells you to set your credence equal to *that* chance value.
      4.  **Accuracy:** In a Humean world, `ch_T(· | H_t)` represents the probabilities implied by the actual, global patterns. Deferring to this function is arguably the best way to align your credences with the objective probabilistic structure of *your* world.

  *   **The Strongest Objection to NP:**
      *   **Epistemic Accessibility:** NP requires the agent to know the *complete true chance theory `T`*. This seems incredibly demanding, arguably unrealistic. We rarely, if ever, know `T` with certainty. We might have good evidence for a candidate system, but certainty about `T` itself? PP only required knowing a specific chance value (`ch_t(A)=p`), which, while perhaps difficult, seems more feasible than knowing the entire, complex `T`.
      *   **Reply (Defending NP):** This is a valid practical concern, but it targets the *applicability* of the norm, not its *correctness* as an ideal standard of rationality. Norms like PP/NP are often understood as describing what is rational for an *ideally informed* agent. For non-ideal agents, we need a more nuanced theory (e.g., deferring to their *best estimate* of `T` or `ch_T(· | H_t)`). Furthermore, even knowing `ch_t(A)=p` under the BSA requires substantial knowledge (knowing which system is best and what chance it assigns given `H_t`), which implicitly involves knowing a lot about `T`. NP makes this implicit dependence explicit. The core normative insight of NP remains valid for the ideal case.

  *   **A Third Position?** One could argue that the problem lies *solely* with the BSA and that we should reject Humeanism in favor of primitive chances, thereby preserving PP. This is a coherent metaphysical position. However, *if* one accepts the BSA (as your seminar seems to be doing), then rejecting PP in favor of NP (or a close variant like the "Generalized Principal Principle") is necessary for coherence. NP is the rational credence rule *for the world the BSA describes*.

  **Conclusion:**

  Your worry is well-founded. Under the Humean Best System Account of chance, the traditional Principal Principle (PP) is incompatible with undermining scenarios. Knowing the specific chance value `ch_t(A)=p` and the history `H_t` can logically entail that `A` is false, yet PP still demands credence `p` in `A`, leading to incoherence. Your friend correctly identifies this fatal flaw *within the BSA framework*.

  The New Principle (NP) provides the necessary repair. By conditioning on the chance theory `T` and history `H_t`, and setting credence equal to `ch_T(A | H_t)`, NP respects the global, supervenient nature of Humean chance. It avoids the contradiction in undermining cases while preserving the core rational insight that credence should track objective chance – it just correctly identifies `ch_T(· | H_t)` as the relevant objective chance function for guiding credence at `t` given `H_t`.

  The problem originates in the BSA's definition of chance as supervening on the total history, making chance propositions carry implicit information about the future. If chances were primitive, PP would be unproblematic. However, *given* the BSA, NP (or a close variant) is the correct rational credence principle. The strongest objection to NP concerns the epistemic demand of knowing `T`, but this is a challenge for applying the ideal norm to non-ideal agents, not a refutation of the norm itself. Therefore, for a Humean metaphysics of chance, the revision is correct. The original principle, while intuitively appealing, cannot withstand the self-referential implications of chance being defined by the very future it is supposed to predict.
