answer: |-
  ### Case Analysis: Martian Canals through Predictive Processing

  **Framework Primer:** Predictive processing (PP) treats perception as Bayesian inference minimizing "free energy" (prediction error). The brain maintains a *generative model* (priors + likelihoods) predicting sensory inputs. Discrepancies yield *prediction errors*, weighted by *precision* (inverse uncertainty)—high precision grants sensory data more influence. Attention and action sample sensory data to test predictions, while *expected free energy* drives agents to seek information resolving uncertainty. The "dark room problem" challenges why agents don't minimize error passively; PP answers that they actively seek predictable novelty.

  ---

  #### 1. **Mapping the Framework**  
  - **Generative Model:** Priors shaped by Schiaparelli’s maps, Lowell’s hypothesis of an engineered irrigation network, and broader cultural expectations of Martian life. The model predicts linear features ("canals") as high-probability structures.  
  - **Sensory Evidence:** Flickering, low-resolution visual data of Mars through atmospheric turbulence—ambiguous dark patches and albedo variations.  
  - **Precision:** Weighting of visual input during rare moments of "steady air." High precision assigned to these moments amplified faint sensory patterns matching the prior (e.g., aligning blurry streaks into straight lines).  
  - **PP’s Prescription:** Observers *should* have sought high-precision evidence contradicting the prior (e.g., systematically varying observation conditions, using instruments eliminating human visual interpolation). Distrust should arise when prediction errors *persistently overwhelm* the model despite high-precision sampling (e.g., Antoniadi’s 1909 null result under optimal conditions). PP lacks a normative "ought"—it only describes adaptive error minimization.  

  ---

  #### 2. **What PP Explains**  
  - **Network Expansion:** Successive oppositions refined the generative model (stronger priors), making observers more likely to "fill in" gaps. PP treats this as iterative Bayesian updating: each confirmed canal reinforced the model, increasing sensitivity to similar features.  
  - **Doubling ("Geminatio"):** A precision-driven artifact. Under unstable viewing, prediction errors from minor misalignments (e.g., atmospheric distortion) were resolved by inferring *two parallel lines*—a minimal revision preserving the core "canal" prior.  
  - **Trained Observers vs. Photographs:** Human vision actively predicts and integrates sparse data (high precision on fleeting clarity), while early photographs lacked top-down modulation—rendering the same input as noise. Lowell’s small-telescope preference optimized for precision: large apertures gathered more light but amplified atmospheric noise, increasing prediction error. Smaller scopes offered sharper *moments*, letting priors dominate.  

  ---

  #### 3. **What PP Misses**  
  - **Gap 1: Translation as Non-Perceptual Event:** "Canali" → "canals" was a linguistic/cultural shift—not inference under uncertainty. PP cannot explain how *semantic framing* reshaped priors independently of sensory evidence.  
  - **Gap 2: The Community Problem:** PP models individual brains. It cannot address *social calibration*: why some observers (e.g., Antoniadi) abandoned canals while others held firm, or how trust in Lowell’s authority sustained the model. Institutional factors (e.g., Lowell’s observatory resources) enabled prolonged evidence sampling favoring his prior.  
  - **Percept vs. Warrant Distinction:** PP explains *why* canals were seen (precision-weighted hallucinations minimizing error) but cannot judge *warrant*. Warrants require external benchmarks (e.g., spacecraft imagery) absent in PP’s closed inference loop.  

  ---

  #### 4. **Theory Under Test: Flexibility and Falsifiability**  
  - **Flexibility Critique:** Priors and precision *can* rationalize both accurate and illusory perception. Lowell’s persistence exemplifies expected free energy: he sought data confirming canals to reduce long-term uncertainty about Martian life, avoiding the "dark room" of ignorance.  
  - **Defender’s Reply:** PP *internally* distinguishes cases via *adaptive precision management*. Antoniadi’s null result under maximal precision should force model revision. Persistent disregard of such errors (e.g., dismissing photos as insensitive) marks pathology—not Bayesian rationality.  
  - **Does It Hold? Partially.** PP predicts that agents seek confirming evidence, but not *why* Lowell never tested disconfirmation strategies (e.g., blind drawing analysis). Expected free energy explains engagement but not the *direction* of inquiry—Lowell’s focus on confirmation reflects bias, not information gain. The framework redescribes rather than predicts behavior.  

  ---

  #### 5. **Verdict**  
  - **Anomaly with Partial Fit:** PP excels at explaining perceptual dynamics (network growth, doubling, instrument choice) but stumbles on extrasensory factors (translation, community trust). It never anticipated how social-epistemic structures interact with individual inference.  
  - **Rival Frameworks:**  
    - **Theory-Laden Observation (e.g., Hanson/Kuhn):** Better explains how "canals" as a theory permeated perception but cannot detail *mechanisms* like geminatio or precision weighting.  
    - **Social Epistemology:** Superior for communal aspects—e.g., how Antoniadi’s institutional credibility shifted consensus, or why cameras (as "mechanical objectivity") eventually overruled human vision.  
  - **Dominant Advantage of PP:** Only it mechanistically explains *why* fleeting visual clarity + strong priors generated canals, and why Lowell’s telescope choice was rational *given his model*.  

  **Conclusion:** Predictive processing illuminates the *perceptual engine* of the canal affair but requires social-institutional supplements to explain its rise and fall. It confirms PP’s power for individual cognition while exposing its limits beyond the skull.
