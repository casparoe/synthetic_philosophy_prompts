prompt: |-
  I work as an organizer with a disability advocacy group, and for a few years now I have been trying to put my finger on a pattern I keep seeing and cannot find a satisfying name for. Here is the shape of it. One of our members, who uses a wheelchair, raises a fairly general point in a workplace meeting: that the way accommodation requests are processed is itself the barrier, because it forces people to disclose and justify needs they would rather keep private, and because it turns a right into a favor. The room is friendly, people nod, and someone thanks her for sharing her perspective. Nothing she said is disputed. But it is filed as her experience, and nothing changes. A year later a consultant, hired to advise on accessibility, presents a framework whose central claim is the same one, dressed in managerial language, and it is treated as an analysis, debated on the merits, and adopted. Now take a mirror-image case. The same member, in a different setting, tries to make a general theoretical claim — that most public discussion of accommodation is really about legal compliance rather than access — and this time people push back hard: they want evidence, they tell her she is generalizing from her own case, they call it her "view." So her autobiographical report is treated as if it carried no general weight, while her general claim is treated as if it were merely autobiographical; in both cases the remark is routed into whichever category makes it safe to absorb without acting on it. What strikes me is that nobody calls her a liar or questions her sincerity, and it is not that we lack the words to describe what she is getting at; the content is often granted, at least nominally. The wrong seems to lie in the routing itself — in which shelf the remark is placed on, and in who is permitted to restate it as knowledge.

  I have read a little of the philosophy of testimony, and I know two ideas that are obviously in the neighborhood. One is the thought that a speaker can be given less credence than she deserves because of who she is. The other is the thought that a whole society can lack the shared vocabulary needed to make a wrong intelligible, so that the wrong cannot even be articulated. Neither quite fits. In the cases I have in mind, she is not disbelieved, and the vocabulary exists — she is using it. What seems to be happening is a kind of misfiling of the speech act: a general claim is heard as a personal one, a personal one is heard as a general one, and the misfiling is what does the damage. Is there an established name for this? I am less interested in a label than in the carving, so please tell me what exactly the phenomenon is, how it differs from the two ideas I just mentioned and from any other close relatives you think are relevant, and where its edges lie — for instance, whether it can occur with no identity prejudice at all, or whether it always requires an asymmetry of power between speaker and audience. If nothing established fits, please coin a term, define it, and give me a boundary case or two that the definition should classify one way rather than the other.

  Finally, I would like you to be explicit about how confident you are in each of your claims, and to flag the single point in your answer about which you are least sure.
reasoning: |-
  Okay, let me unpack this complex query. The user describes a specific pattern of epistemic injustice they've observed in disability advocacy work, where a wheelchair user's statements are systematically miscategorized—personal experiences dismissed as non-generalizable, while theoretical claims get reduced to mere personal opinion. 

  Hmm, this feels like more than just classic testimonial injustice. The key differentiators are: (1) content isn't disputed, (2) vocabulary exists, (3) the harm happens through misclassification of speech acts rather than credibility denial. 

  I recall Miranda Fricker's work on hermeneutical injustice, but that doesn't fit either—here the problem isn't lack of concepts, but how existing concepts get applied. The "shelf-switching" metaphor the user mentioned is really apt—it's about institutional sorting mechanisms. 

  The power dynamics angle seems crucial. Even without overt prejudice, the consultant's restatement gets authority because it comes through sanctioned channels. That makes me think of Bourdieu's symbolic capital and how institutions legitimize certain voices. 

  Boundary testing this concept: Could this happen without identity prejudice? Maybe—imagine a junior researcher in academia having their theory rebranded by a senior professor. But the identity element likely amplifies the effect. 

  What worries me most is defining the power asymmetry requirement. In low-stakes settings between equals, this misfiling might just be ordinary misunderstanding. But in advocacy contexts, the institutional power gradient makes it oppressive. 

  The term "discursive dispossession" feels right—capturing both the ownership loss and systemic nature. But I'm least confident about whether this always requires identity factors. Should probably emphasize institutional authority as the core engine.
answer: |-
  Based on your detailed description, the phenomenon you've identified is distinct from testimonial injustice and hermeneutical injustice, though closely related. It centers on the **systematic misclassification of speech acts** to neutralize their force, enabled by institutional power dynamics. Here's a precise analysis:

  ### Core Phenomenon: **Discursive Dispossession**
  **Definition**: The practice where an individual's claim is categorically misplaced ("misfiled") into a domain that strips it of its intended epistemic or political force—either by reducing a general/structural claim to personal anecdote, or by treating a personal testimony as an inappropriate generalization—there allowing institutions to absorb critique without substantive response or action. This functions as an institutional defense mechanism.

  #### Key Mechanisms & Differences:
  1.  **Misfiling of Speech Acts (The Core Mechanism)**:
      *   Unlike testimonial injustice (credibility deficit due to prejudice), here the *content* is often conceded. The harm lies in mislabeling the *type* of utterance:
          *   **Personal → General**: An autobiographical report ("This process harmed me") is acknowledged but confined as *only* personal experience, denying its illustrative or systemic relevance ("That's just your experience").
          *   **General → Personal**: A structural analysis ("This policy framework creates barriers") is dismissed as *merely* personal opinion/anecdote lacking broader validity ("That's just your view, you're generalizing").
      *   **Confidence**: High. This directly matches your cases and is the central malfunction.

  2.  **Absorption Without Action (The Function)**:
      *   The misfiling allows the audience/institution to perform a superficial acknowledgement ("Thanks for sharing," "We hear you") while evading the obligation to engage with the claim's *actual* force (critique of policy, demand for structural change). The claim is "safely" shelved.
      *   **Differs from Hermeneutical Injustice**: The vocabulary *exists* and is used correctly by the speaker. The problem isn't a lack of concepts to *express* the wrong, but a refusal to *accept* the claim in its intended categorical form. The system *has* the language but misapplies it to the speaker.
      *   **Confidence**: High. This explains the "nodding but no change" and "debating the consultant" dynamics.

  3.  **Source & Requirement of Power Asymmetry**:
      *   This practice is inherently tied to institutional power and authority. The audience (management, committee, dominant group) holds the power to define the categories ("experience" vs. "analysis," "fact" vs. "opinion") and assign the speaker's utterance to one. The speaker lacks the institutional authority to successfully insist on the correct categorization.
      *   **Requires Asymmetry?**: Yes, fundamentally. While miscommunication happens between equals, *discursive dispossession* requires an institutional or social power imbalance where the audience has the sanctioned authority to categorize speech and control the discourse framework. A peer mistakenly calling a generalization "just your opinion" is rudeness or poor listening; an institutional body doing it is dispossession.
      *   **Identity Prejudice's Role**: While often present and amplifying the effect (e.g., disability bias leading to assumptions about a speaker's capacity for "objective" analysis), it is not strictly *necessary*. The core engine is the institutional authority to define categories. However, identity prejudice makes the misfiling much easier to perform and harder to challenge.
      *   **Confidence (on Identity Prejudice not being *absolutely* necessary)**: Moderate. Power asymmetry is essential. Identity prejudice is a very common facilitator and amplifier, but the core mechanism *can* operate based purely on institutional hierarchy (see boundary case 2). This is the point of **least confidence** – some theorists might argue the hierarchy itself *embodies* identity prejudice.

  4.  **Contrast with Close Relatives**:
      *   **Testimonial Injustice (Fricker)**: Focuses on *credibility deficit*. Here, sincerity/truthfulness isn't usually questioned; the *type* and *authority* of the claim are disputed. "We believe it happened *to you*, but it's not *about* the system."
      *   **Hermeneutical Injustice (Fricker)**: Focuses on *inability to articulate* due to conceptual lack. Here, the speaker articulates clearly; the audience misclassifies the articulation.
      *   **Epistemic Exploitation (Berenstain)**: Focuses on demanding emotional/laborious explanation from marginalized speakers. Here, the explanation might be given, but then misfiled and neutralized.
      *   **Gaslighting**: Involves making the speaker doubt their *own* perception/reality. Here, the speaker's perception might be validated ("we hear your experience"), but its significance or generalizability is denied externally.

  #### Boundary Cases (Testing the Definition)
  1.  **Case Within Definition (Subtle Prejudice + Power)**: A junior female software engineer reports a recurring bug and suggests a structural flaw in the codebase. Her male manager says, "Thanks for flagging *your* issue, maybe it's just something on your machine setup. We'll keep an eye on it." (Personal experience misfiled; structural claim dismissed as personal/anomalous). No overt sexism, but power imbalance + subtle bias enable misfiling. **→ Discursive Dispossession**.
  2.  **Case Within Definition (Minimal Identity Prejudice, Clear Hierarchy)**: A mid-level manager (any identity) proposes a fundamental strategic shift at an executive meeting. The CEO responds, "I appreciate *your perspective* on this, John, very interesting personal take. Now, moving to the consultant's report..." Consultant later presents the same idea as analysis. **→ Discursive Dispossession** (Power hierarchy enables misfiling "analysis" → "personal perspective").
  3.  **Case Outside Definition (Equal Power Miscommunication)**: Two colleagues debate policy. One says, "This form is inaccessible!" The other replies, "Well, that's just *your* opinion based on your one experience." It's dismissive and poor epistemology, but without an institutional power imbalance enabling *systematic* categorical control for absorption, it's rudeness, not dispossession. **→ Not Discursive Dispossession**.
  4.  **Case Outside Definition (Hermeneutical Injustice)**: A person experiences a novel form of workplace harassment but lacks any accepted concepts or vocabulary to describe it (e.g., before "microaggressions" was coined). Their reports are dismissed because they can't articulate the wrong clearly. **→ Hermeneutical Injustice, not Discursive Dispossession** (Lack of concepts vs. misfiling existing concepts).

  #### Why "Discursive Dispossession"?
  *   **Discursive**: Highlights the focus on language, categorization, and the rules of communication within an institutional context.
  *   **Dispossession**: Emphasizes the *taking away* of the speaker's intended meaning, authority over their own claim, and the power to define the nature of their speech act. The claim is "taken" and placed on a shelf where it becomes inert, dispossessing the speaker of its impact.

  This concept captures the specific routing harm you've identified: the institutionalized practice of misfiling speech acts to neutralize critique while maintaining a veneer of receptiveness, rooted in power asymmetry and enabled (though not always strictly *caused*) by identity prejudice.
