prompt: |-
  I'm a philosophy professor who's been co-opted onto my city's heritage committee, and we keep getting applications to recognise 'ancient' customs — a maypole dance, a dialect festival, a 'traditional' market. Some are genuinely old, some were invented in the 20th century, some are revivals. I need a decision procedure our committee can actually run, grounded in the Hobsbawm/Anderson literature on invented tradition and imagined communities, for assessing claims of tradition and deciding what to fund or protect. It should be usable by non-specialists: questions to ask in order, what counts as sufficient evidence, where the procedure stops with a no, and where it hands the decision to a values judgement. Then run it on two cases: a 'traditional' miners' gala that was actually started in the 1980s, and a religious procession documented back 300 years but suppressed for 50 and now revived by a diaspora community. Make one of those come out in a way our committee won't like, and be honest about where the procedure will misfire. You're an expert in social ontology and the history of nationalism, so think carefully and brainstorm the main pitfalls before you write. Tell me how confident you are in the procedure overall and single out the step you're least sure about. British English please. End with a single sentence beginning 'Summary:' that captures the core of the procedure.
