  On what the lens explains: it clarifies why the high error rate was ignored—suspicion of claimants made errors seem like minor issues in catching 'fraud.' It shows why shifting the burden of proof felt sensible, rooted in deep-seated beliefs about welfare dependency. And it accounts for the scheme's longevity by highlighting how the undeserving label created political cover, even amid evidence of harm.

  For what the lens misses: it doesn't capture the role of budget savings targets as a primary driver or the technical incompetence that exacerbated harm. It overlooks the lack of initial political malice and the unique accountability from legal challenges and media scrutiny. These are gaps where the framework goes quiet.

