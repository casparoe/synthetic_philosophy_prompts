  The user's thought experiment, the "hedonic blender," is crucial. A machine takes two pleasures (scratching an itch, hearing a resolved chord) and outputs a state with only pure pleasedness, no sensory content. The monist would see this as evidence for a common currency, while the pluralist might argue it either introduces a new sensory quality or shows we can abstract pleasure from its objects.

