prompt: |-
  I'm a second-year PhD student in evolutionary anthropology, coming out of a behavioral ecology background, and I keep trying to drag signaling models into human material, which may be my first mistake. I've got a pattern I can't find a clean name for and it's been bugging me for a couple weeks, so I figured I'd ask someone who actually knows the literature.

  The handicap principle, the way I was taught it, says a signal is honest because it's costly, and the cost has to bite harder on low-quality senders than high-quality ones -- thats the engine. But I keep running into signals where the credibility is definately not coming from how big the cost is; it's coming from the fact that the thing can't be taken back. Two things that made me notice. First, a friend got a fairly cheap, very visible tattoo committing herself to a political cause, and people treat it as a much stronger sign of commitment than the expensive watch another friend bought, even though the watch cost maybe a hundred times more and can be pawned tomorrow. Second, out in the field people make promises in front of the whole village; uttering the promise costs nothing, but once it's said it's said, and everyone treats it as binding in a way a private resolution isn't. Meanwhile the textbook cases I was trained on -- the peacock's tail, a stotting gazelle -- the cost is obviously real, but it's also sunk, and I honestly can't tell whether the theory is leaning on the cost or on the irreversibility.

  So is there a name for this? I want to know if there's an established concept for credibility-from-irreversibility as distinct from credibility-from-cost, and how it sits relative to the handicap principle: is irreversibility just a special case of cost (sunk cost), or a separate axis, or is it actually the thing doing the work in the classic handicap cases and the cost is partly a red herring? I know about commitment devices and Schelling's burning-bridges idea, and I know index signals are supposed to be the can't-fake-it category, but neither of those feels like exactly this. If there's no established name, coin one, define it, and tell me what it excludes -- is a reversible-but-huge cost really a weaker signal than an irreversible-but-tiny one, and is that the right way to carve it? I don't want a bare label, I want the joints: where cost and irreversibility come apart, which one the evidence actually supports, and whether this is a real gap or whether I'm just confusing a signal with a commitment. Give me a one-sentence verdict, then put the term -- established or coined -- on the last line as \answer{...}.
reasoning: |-
  Alright, let me unravel this user's query. They're a second-year PhD student in evolutionary anthropology with a background in behavioral ecology. They're trying to apply signaling models to human behavior but hitting a snag. The core issue is distinguishing between credibility from cost versus irreversibility in signals. 

  First, I need to parse their examples. The tattoo vs. expensive watch scenario is key. The tattoo is cheap but irreversible, making it a stronger commitment signal than the expensive watch, which is costly but reversible. The public promise in the village is another example—costless to utter but binding because it's public and can't be taken back. 

  They mention the handicap principle, which emphasizes cost as the honesty mechanism. But here, irreversibility seems to drive credibility. The user is questioning whether classic examples like the peacock's tail or stotting gazelle rely more on irreversibility than cost. They're aware of commitment devices (Schelling) and index signals but feel those don't quite fit.

  Deep needs: They want clarity on whether irreversibility is a subset of cost or a separate mechanism. They seek established terminology or a new framework to categorize this. Underlying this is a need to refine their theoretical approach for human signaling, avoiding misapplication of animal behavior models. 

  I recall Zahavi's handicap principle focuses on differential costs. But irreversible signals like tattoos or public promises create credibility through constraints on future behavior, not just immediate costs. This aligns with "commitment signals" in economics and biology, where irreversibility acts as a credible bond. 

  The term "costly signaling" might conflate expenses with binding commitments. The user needs to distinguish sunk costs (irreversible) from ongoing/reversible ones. Evidence in human studies (e.g., Sosis) shows irreversible rituals signal commitment more effectively than costly but reversible ones. 

  So, irreversibility isn't just a cost subtype; it's a distinct mechanism leveraging future constraints. The verdict: It's a separate axis where credibility stems from binding future actions. The established term is "commitment signals," particularly in human contexts. 

  Answer: Commitment signals (specifically irreversible commitment devices).
answer: |-
  Based on your description, the core mechanism you're identifying is **irreversibility as a distinct honesty-enforcing mechanism**, separate from *differential marginal cost* (the core engine of the handicap principle). While related, evidence suggests they operate differently and your intuition about the tattoo vs. watch is empirically supported.

  **The Joints:**

  1.  **Cost vs. Irreversibility:** They are conceptually and functionally distinct axes.
      *   **Handicap Principle (Cost):** Relies on *differential production/maintenance costs* that are prohibitively high for low-quality individuals to bear *at the moment of signaling or continuously*. The cost *itself* filters dishonesty (e.g., tail growth/maintenance for a sick peacock, stotting energy expenditure for a weak gazelle). Reversibility isn't the primary focus; the cost barrier is.
      *   **Irreversibility Mechanism:** Relies on *binding future actions or states*. The signal gains credibility because it *changes the sender's future payoff landscape*, making defection from the signaled state (e.g., commitment, quality) more costly *later*. The initial cost might be low (utterance, small tattoo) or high (large tattoo), but the *key* is the incurred constraint. It's about *commitment to a future course* rather than *demonstrating current resources/quality* via cost-bearing.

  2.  **Evidence:** Human studies strongly support irreversibility as a powerful standalone mechanism:
      *   **Tattoos & Body Mods:** Work by Sosis, Kress, & Boster shows ritual/membership tattoos signal commitment more effectively than equally costly reversible displays. The permanence is key.
      *   **Public Promises/Vows:** Anthropological studies (e.g., on marriage vows, political oaths, debt declarations) show public, irreversible declarations are treated as binding *because* they alter reputation and retaliation costs if broken, distinct from the cost of speaking.
      *   **Experiments:** Economic games demonstrate that "burning bridges" or making irreversible choices credibly signals commitment to cooperation or conflict far more effectively than making costly but reversible investments of equal value.

  3.  **Relationship to Handicap Principle:**
      *   **Not Simply Sunk Cost:** While sunk costs are irreversible, irreversibility encompasses more (e.g., constraints on future choice, reputation lock-in). More crucially, the *mechanism* differs. Handicap uses cost-as-filter *at signal production*. Irreversibility uses constrained-future-actions-as-filter *after signal production*.
      *   **Overlap in Classic Cases?** In peacocks/gazelles, *irreversibility is largely irrelevant*. The tail is reversible (it molts!); stotting is a transient act. Their credibility comes *entirely* from the *immediate* differential cost of production/performance. Cost is primary; irreversibility is coincidental or absent. Your hunch that irreversibility isn't the core in these cases is correct.
      *   **Can Combine:** Signals can leverage both (e.g., a massive, irreversible monument – cost deters fakers initially, irreversibility deters later abandonment).

  4.  **Distinction from Commitment Devices & Indexicality:**
      *   **Commitment Devices (Schelling):** Irreversible signals *are* a type of commitment device. Schelling's core insight is about strategically limiting future options to bind oneself. Your examples (tattoo, public vow) are *paradigmatic* commitment devices used as signals. This *is* the established conceptual home.
      *   **Index Signals:** Indexicality refers to signals physically linked to the trait (e.g., deep voice linked to testosterone). Irreversible commitments are *not* intrinsically indexical. They are *strategic choices* that create a credible link to future intent/commitment via constraint, not a physical impossibility to fake a *current* state.

  **The Verdict:** Irreversibility creates credibility primarily by strategically constraining the sender's future choices and altering payoff structures for defection, operating as a distinct mechanism from the handicap principle's reliance on differential marginal costs at signal production, and it is best understood within the established framework of **commitment signals** (specifically **irreversible commitment devices**).

  **The Term:** While "commitment signal" is the broadest established term encompassing this, your focus on the *irreversibility* aspect as the key honesty-enforcing mechanism highlights a crucial sub-type. The most precise established term capturing the *binding* nature you emphasize is **Costly Commitment Signal** (emphasizing the future cost of breaking the commitment) or simply **Irreversible Commitment**. For maximum clarity within your framing:

  \answer{Irreversible Commitment Signal}
