  ### Plain-Prose Explanation
  Your choices across these gambles are consistent with **prospect theory**, a behavioral model where decisions are based on perceived gains and losses relative to a reference point (usually the status quo), not final wealth. Key elements:
  - **Loss aversion**: Losses hurt more than equivalent gains feel good (about 2–3 times more).
  - **Diminishing sensitivity**: The value function is concave for gains (making you risk-averse when facing potential gains) and convex for losses (making you risk-seeking when facing potential losses).
  - **Probability weighting**: Small probabilities are overweighted (making rare events feel more likely), while larger probabilities are underweighted (making near-certain outcomes feel less valuable than they are).

  This explains all your calls:
  - **A and B**: You avoid the coin flip for gains (risk aversion for gains).
  - **C**: First, you take the sure million (certainty effect and loss aversion for the 1% risk of $0). Second, you prefer the 10% shot at $5M over 11% at $1M (overweighting of small probabilities and the high payout).
  - **D**: You take the coin flip to avoid a sure loss (risk-seeking for losses).
  - **E**: You prefer the 50% chance of $1,000 over the 10% chance of $5,000 (underweighting of the 10% probability and concave gains making the higher probability more attractive).
  - **F**: You pay $150 to avoid a 1% chance of a $10,000 loss (overweighting small loss probabilities and loss aversion).

  No call needs to be thrown out—prospect theory explains them all with a single S-shaped value function and a probability weighting function. The "different people" feel in D (risk-seeking) and E (risk-averse) comes from the same rule applied to losses vs. gains.

