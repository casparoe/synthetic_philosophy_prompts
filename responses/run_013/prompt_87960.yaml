answer: |-
  Here’s a dialogue between **Eva (Expressivist)** and **David (Descriptivist)**. They’re circling the Frege-Geach problem through fresh examples, with each pressing the other’s assumptions about meaning, logic, and truth. The conversation builds toward vulnerability about what might change their minds.

  ---

  **Setting:** *A campus coffee shop after seminar. Eva stirs her tea, David nurses an espresso.*

  **David:** Okay, Eva—I’ll grant that expressivism handles simple moral assertions beautifully. "Eating meat is wrong" expresses disapproval. But let’s take something thornier: *"It’s probably true that he was wrong to walk out on her."* If moral sentences aren’t truth-apt, what’s "probably true" doing here? Probability attaches to truth-evaluable content. You can’t probabilize a boo.

  **Eva:** Sure I can. When I say "It’s probably true that P," I’m expressing a *qualified attitude* toward P. For "he was wrong," I’m not full-throatedly condemning him—I’m tentatively disapproving, maybe because I’m unsure of the facts. Probability modifies the *strength* of the attitude, not a propositional truth-value.

  **David:** But then your account of "true" is parasitic. When I say "It’s true that murder is wrong," I mean it corresponds to a moral fact. You’re stretching "true" to mean something like "I’m really committed to disapproving of murder." That’s not what ordinary speakers mean!

  **Eva:** Hold on—quasi-realism isn’t reinventing language. It’s explaining *why* we talk this way. When I embed "murder is wrong" in "It’s true that…," I’m signaling that my disapproval is *endorsed* as part of a stable, coherent set of attitudes. Logic governs the consistency of those attitudes across contexts.

  **David:** Let’s test consistency. Take: *"She stopped believing that eating meat is wrong a year before she stopped doing it."* Beliefs are representational! If "believes that P" requires P to be a truth-apt content, and moral sentences aren’t, how can she "believe" it’s wrong? Your "attitude" story fractures the semantics of belief.

  **Eva:** Not at all. To "believe that eating meat is wrong" is to hold a conative state—a commitment to disapprove of meat-eating. When she "stops believing" it, she abandons that commitment but might still eat meat out of habit. Belief reports track the *psychological state*, not a fact.

  **David:** Then what’s the difference between *believing* it’s wrong and *feeling* it’s wrong? And why does logic apply? Let’s hit modus ponens:  
  1. If lying is wrong, then getting your little brother to lie is wrong.  
  2. Lying is wrong.  
  3. Therefore, getting your little brother to lie is wrong.  
  If (1) is just expressing some hybrid attitude, and (2) is booing lying, what *forces* me to accept (3)? Why isn’t it just a psychological nudge?

  **Eva:** Logic constrains *combinations of attitudes*. Accepting (1) is having a disposition to disapprove of getting your brother to lie *if* you disapprove of lying. Accepting (2) *is* disapproving of lying. So, if you endorse both, you’re rationally committed to disapproving of (3). Validity comes from the impossibility of holding coherent attitudes otherwise.

  **David:** But that "impossibility" feels discovered, not constructed. When I deny (3), I’m not just being incoherent—I’m *mistaken*. Truth is tracking something independent of our attitudes. Take: *"He resented her because what she did was wrong."* "Because" implies a causal/moral explanation. If "wrong" is just your disapproval, the explanation collapses into "He resented her because *he disapproved*." But that’s circular! We explain resentment *by* the wrongness.

  **Eva:** Or we’re explaining resentment by *the property he projects onto the action*. Quasi-realism grants that we talk about moral properties—they’re just constituted by our attitudes under ideal conditions. "Because it was wrong" can mean "because it had the property that warrants resentment," which is fixed by our reactive attitudes.

  **David:** But then you’re *simulating* realism! If "warrants resentment" is an attitude-independent property, you’ve conceded descriptivism. If it’s dependent, "because" loses its objective bite. Let’s crystallize: Is your "truth" robust enough to explain why modus ponens *had* to be valid before humans existed? Could moral logic have been different?

  **Eva:** ...That’s a good push. For me, logic is a framework for organizing attitudes—it’s constitutive of rationality. But it’s not "out there" like gravity. What about you? If moral facts exist, why do they *necessarily* motivate us? Why aren’t they inert like mathematical facts?

  **David:** Maybe they just *do*. Or maybe motivation isn’t essential to moral judgment. But fine—I’ll admit where I sweat. If someone showed me a moral fact that *no one* was motivated by—truly, inherently prescriptive yet inert—I’d struggle. My move is to say moral facts *include* reasons for action, but... that feels slippery.

  **Eva:** And I’ll admit my tension point: When we say "It’s true that genocide is wrong," it *feels* like we’re pointing to something beyond our attitudes. If I learned that all rational agents *could* coherently approve of genocide in some circumstance, I’d worry expressivism collapses into relativism. I need attitudes to converge under rational constraints—but is that convergence "discovered" or "built"?

  **David:** So we’re stuck between your fear of queerness and my fear of projection. Maybe the Frege-Geach problem isn’t just about semantics—it’s about whether we can have *authoritative* moral judgments without Platonic facts.

  **Eva:** Or whether authority comes from within our practices. Another espresso?  
  **David:** *God*, yes.

  ---

  ### Key Disagreement Points:
  1. **Meaning**: David sees embedded contexts (probability, belief, causation) as requiring truth-apt content. Eva reinterprets them as complex attitudes.  
  2. **Logic**: David demands necessary truth-preservation in inferences. Eva replaces it with necessary *attitude coherence*.  
  3. **Truth**: David insists on robust correspondence; Eva offers a "true" deflated to stable, projectible attitudes.  

  ### What Might Change Their Minds:
  - **Eva** would waver if rational agents could coherently endorse atrocities *without* semantic inconsistency.  
  - **David** would falter if moral facts were shown to be *necessarily* motivationally inert (or if non-moral facts could intrinsically motivate).  

  Both are wrestling with whether morality’s felt objectivity requires mind-independence—or whether our practices can generate a "sturdy enough" substitute. The Frege-Geach problem, here, is the lever prying open that deeper question.
