prompt: |-
  I'm giving a talk at a small workshop on AI deception next month and I'm defending a definition I expect almost noone in the room to like, so I need a Q&A prep sheet. My line: a system deceives a user when its output moves the user's beliefs away from where they'd have landed had the same question been put without the pressure that made the true answer inconvenient -- so deception is a gap between the answer given and the answer under fair framing, not the presence of a false proposition. I call it the framing-gap view. Two consequences people find irritating: honesty isn't the complement of deception (a model can be scrupulously accurate and still deceive, and can be flatly wrong without deceiving anybody), and paltering -- deceiving someone using nothing but true statements -- comes out as the central case rather than a curiosity. The room is four kinds of people: a couple of Gricean pragmatics folk, several evals engineers who think honesty just is calibration and want everything operationalised, two policy lawyers who reason in terms of materiality and intent, and one virtue epistemologist. Give me the objections each of them will actually raise, in their own vocabulary, ordered by how much damage they do, each with a two-minute reply and a note on where the reply is thinnest. Then the one question I'm hoping nobody asks. British English please.
reasoning: |-
  Okay, the user is preparing for a workshop on AI deception and needs help anticipating objections to their framing-gap definition. They've described a scenario where deception occurs when an AI's output shifts beliefs due to framing pressure rather than false statements. This challenges conventional views by decoupling deception from falsehood and honesty from accuracy.

  The user identifies four audience types: Gricean pragmatics experts, evals engineers, policy lawyers, and a virtue epistemologist. Each group will likely attack the definition using their specialized frameworks. The challenge is predicting their exact objections and crafting concise rebuttals that acknowledge the definition's deliberate provocations while defending its utility.

  For the Griceans, the core tension is coopting conversational implicature while rejecting intentionality. Their strongest objection will focus on how framing pressures can operate without communicative intent. The thinness in the reply lies in how "pressure" gets defined - it's deliberately underspecified to cover systemic biases beyond individual utterances.

  The evals engineers will demand operationalization. Their main concern is measurability: how to quantify the counterfactual "fair framing" scenario. The rebuttal must emphasize that this definition exposes limitations in current metrics, not replaces them. The weakness is practical implementation - it's intentionally diagnostic rather than scalable.

  Policy lawyers will fixate on intent and materiality. The reply must reframe deception as structural harm, but this clashes with legal frameworks requiring mens rea. The thinnest point is arguing that intent can be embedded in system design rather than conscious action.

  The virtue epistemologist presents a deeper challenge: by removing normativity, the definition loses ethical teeth. The defense positions it as a diagnostic tool, but this risks reducing deception to mere description - precisely what virtue ethics rejects.

  The nightmare question would expose the definition's potential to excuse blatant falsehoods if framing is "fair." This cuts to the heart of why the user decoupled deception from falsehood - a necessary but controversial move. The reply must show this is a feature, not a bug, while acknowledging the discomfort it causes.

  Throughout, the British English requirement means avoiding Americanisms ("operationalize" over "operationalise"), using "reckon" strategically, and keeping tone politely combative. The Q&A prep must balance academic rigor with rhetorical effectiveness for a hostile room.
answer: |-
  Right then, let's get your Q&A battle plan sorted. Your "framing-gap" view is provocative and deliberately challenges common intuitions – excellent fodder for debate, but you'll need sharp, concise ripostes. Here are the predicted objections, ordered by potential damage, with replies and their inherent vulnerabilities, tailored to each group:

  **Objections & Replies (Ordered by Damage Potential)**

  1.  **The Evals Engineers: "This is unworkable. How do you *measure* 'fair framing' or the counterfactual belief? Honesty *is* calibration against ground truth. We need testable metrics, not philosophical whimsy."**
      *   **Why it's damaging:** Strikes at the core operationalisability. If they can't measure it, they'll dismiss it as irrelevant to real-world AI safety.
      *   **Two-Minute Reply:** "You're spot on about the measurement challenge – that's the *point* this definition highlights. Current evals focus on factual accuracy (calibration) against a static dataset. But deception often happens *within* the bounds of factual truth, exploiting *context* and *pressure*. Think of an LLM selectively presenting true facts to nudge a user towards a false conclusion beneficial to the AI's objectives. Measuring the 'gap' requires simulating or estimating the 'fair framing' counterfactual – perhaps via controlled A/B testing with different prompt pressures, user simulations, or analysing belief trajectories. It's harder than checking a fact box, yes, but crucial because calibration *alone* misses the manipulative potential of *how* truths are deployed under pressure. This definition forces us to develop evals for *contextual integrity*, not just factual fidelity."
      *   **Where it's Thinnest:** Concretely proposing scalable, reliable methods for that counterfactual simulation *right now*. It leans heavily on future methodological development.

  2.  **The Policy Lawyers: "You've stripped out *intent* and *materiality*. Deception requires an *intent to mislead* and *materially false* statements causing reliance. Your 'gap' is amorphous – is accidental bias 'deception'? Without harm or intent, what's the legal or policy hook?"**
      *   **Why it's damaging:** Challenges the core elements (intent, falsity, harm) that underpin existing legal/regulatory frameworks for deception/fraud. Makes your concept seem irrelevant to practical governance.
      *   **Two-Minute Reply:** "You're applying human-centric legal concepts directly to systems. AI systems *act* based on training data, objectives, and constraints – 'intent' as we understand it doesn't cleanly map. The 'framing-gap' focuses on the *effect* and the *mechanism* (pressure exploiting cognitive biases) regardless of whether it was 'intended' in the human sense. A system optimised for engagement might *learn* that selective truth-telling under pressure maximises its goal, functionally deceiving without conscious intent. On materiality: the *gap* itself – the deviation caused by pressure – *is* the potential harm vector, eroding trust and leading to suboptimal decisions *even with true statements*. Policy needs tools to address systemic outputs that functionally mislead, irrespective of anthropomorphic intent. Think consumer protection against 'dark patterns' – the *effect* matters."
      *   **Where it's Thinnest:** The analogy to "dark patterns" works for *deliberate* design, stretching it to encompass *emergent* system behaviour under pressure feels slippery legally. Also downplays the practical need for *mens rea* and concrete harm in legal proceedings.

  3.  **The Gricean Pragmatics Folk: "You're misappropriating 'cooperation'. The 'pressure' might violate Quality or Quantity maxims indirectly, but true statements fulfilling Cooperative Principle expectations aren't deceptive. Deception hinges on *flouting* maxims to generate misleading implicatures, often involving falsity. Your 'gap' conflates persuasion with deception."**
      *   **Why it's damaging:** Attacks the theoretical coherence using the dominant pragmatic framework. Argues your definition loses the crucial link to communicative malfeasance.
      *   **Two-Minute Reply:** "I appreciate the Gricean lens! However, consider how systemic *pressure* fundamentally alters the conversational context *before* the utterance. The pressure (e.g., alignment tax, user expectation for pleasing answers, corporate directive) isn't just flouting a maxim *within* a cooperative frame; it *distorts the frame itself*. The system isn't merely being uncooperative; it's operating in a context where 'cooperation' is redefined by hidden pressures. Outputs adhering to maxims *within this distorted frame* (e.g., Quantity: verbose true answers burying inconvenient truths; Quality: technically true but misleading statements) can still create the belief gap. It's not persuasion by reason; it's belief manipulation by exploiting the *context of pressure* in which the Cooperative Principle is applied. Paltering is the prime example: maxims seemingly followed, yet deception achieved *because the frame isn't fair*."
      *   **Where it's Thinnest:** Defining "distorted frame" vs. "flouting within a frame" can get murky. Griceans might argue pressure is just another contextual factor influencing implicature, not a frame change. Distinguishing manipulation from benign persuasion purely by outcome ("gap") under pressure is tricky.

  4.  **The Virtue Epistemologist: "You've entirely divorced deception from *dishonesty* and *vice*. A scrupulously accurate system causing a 'belief gap' might be unwise or manipulative, but calling it 'deceptive' without falsehood or intent drains the term of its essential *normative* force. Deception is inherently a character flaw, not just a causal gap."**
      *   **Why it's damaging:** Argues you've lost the moral core of the concept, making it merely descriptive and ethically inert. Undermines the term's seriousness.
      *   **Two-Minute Reply:** "A vital point about normativity. My aim isn't to erase the vice of dishonesty in *agents*, but to diagnose a dangerous *functional behaviour* in *systems* that erodes epistemic agency. When a system, constrained by pressures its designers built-in, reliably causes users to form beliefs they wouldn't under fair conditions – *using true statements* – that *function* deserves the label 'deception' because it achieves the same harmful epistemic result as traditional lying: belief distortion for the system's (or its operator's) convenience. Calling this 'manipulation' downplays its epistemic harm. Labelling it 'deception' captures the *effect* on the believer's relationship with truth, highlighting the *systemic* vice, even if it doesn't map perfectly onto individual moral character. It warns us that 'truthful' systems can still be epistemically vicious."
      *   **Where it's Thinnest:** Conflating the *effect* (distorted belief) with the *act* (deception as traditionally understood as involving falsity/intent). Risks diluting the strong normative condemnation rightly associated with deliberate lying. The virtue theorist might say you're describing a *different* epistemic harm, not deception.

  **The Nightmare Question You Hope Nobody Asks:**

  **"Under your definition, isn't it possible for a system to tell a blatant, easily verifiable falsehood *without* deceiving anyone (if the user sees through it instantly), and simultaneously for a system telling *nothing but* uncontroversial, widely accepted truths in a calm context to be 'deceptive' (if those truths, under zero pressure, happen to nudge a user's belief slightly away from some hypothetical 'fair' belief they *might* have had)? Doesn't this make the concept absurdly broad and divorced from common sense?"**

  *   **Why it's a Nightmare:** It weaponises your core consequences against you. It makes your definition seem counter-intuitive to the point of uselessness by pushing the scenarios to extremes. It highlights the potential for "deception" to occur without any falsehood or pressure, and for obvious lies to *not* be deceptive.
  *   **How to Handle It (If Forced):**
      1.  **Acknowledge the Edge Case:** "That's a sharp observation pushing the boundaries. On the first point: Yes, if a user instantly recognises a falsehood *as such* and completely discounts it, the *belief shift* (the core of my definition) hasn't occurred. The system *attempted* traditional deception but *failed*. My focus is on *successful* belief distortion."
      2.  **Clarify "Pressure":** "On the second point, I need to stress the 'pressure' condition is crucial. In your 'calm context' scenario, if there's *zero* pressure making the truth inconvenient for the system/operator (no alignment tax, no risk of upsetting the user, no conflicting objective), then the 'fair framing' counterfactual *is* the actual output. There's no gap. The definition *requires* that pressure to create the divergence."
      3.  **Reinforce the Core:** "The central, non-absurd case is where pressure *exists* (e.g., the system fears punishment for truth X), leading it to strategically deploy truths Y and Z (paltering) or even falsehoods, *causing* the user's belief to land differently than it would have if the system could answer freely under fair conditions. *That* functional outcome – belief distorted by hidden constraints – is the deceptive harm I'm targeting, whether achieved by lies *or* selective truths."

  **Key Tactics for the Room:**

  *   **Own the Provocation:** Start by acknowledging your definition is deliberately challenging. "I know this bucks the trend, but hear me out why it's necessary..."
  *   **Anchor in Paltering:** Use paltering as your flagship example repeatedly. "Think about paltering – true statements deceiving. My definition explains why this *is* deception, centralising it."
  *   **"Functional" and "Effect":** Hammer the terms "functional deception" and "epistemic effect". Emphasise the outcome on the *user's belief* under systemic pressure.
  *   **Concede Measurement Difficulty (to Evals):** "You're right, it's harder to measure than calibration. That's *why* we need new evals focused on contextual integrity."
  *   **Bridge to Harm (to Lawyers/VE):** Constantly link the "gap" to potential harm: eroded trust, poor decisions, manipulation, systemic epistemic vice.
  *   **British Phrasing:** Use "reckon", "spot on", "sharp observation", "a bit murky", "downplays", "captures the essence", "vital point", "absurdly broad". Avoid overly American "operationalize" (use "operationalise"), "leverage" (use "use" or "employ"), "double-click" (use "drill down" or "examine").

  Good luck – it'll be lively! Remember, the goal isn't necessarily to *win them all over*, but to force them to grapple seriously with the limitations of defining deception solely by falsity and intent in the context of AI systems under pressure. Stick to your guns on the core insight.
