  The "easy knowledge" angle is crucial too - if she could justify her palate this way, she could "prove" anything. That realization should come when she imagines absurd extensions of her method. 

  User seems philosophically sophisticated - probably a philosophy student or academic wanting a teaching tool. But they explicitly want no lectures or philosopher characters. So the ideas must emerge organically through the sommelier's crisis during a high-stakes tasting. 

  Key constraints: set in near-present (2010s works), 1500-2000 words, single embodied faculty. I'll avoid abstract reasoning and focus on physical sensations - the cloying sweetness of wine, the texture of aroma strips. The resolution shouldn't solve the epistemological problem but show her choosing practical trust over justification. 

