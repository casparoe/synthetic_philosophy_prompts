answer: |-
  ### Proposal: Temporal Auxiliaries and the Epistemology of "Right but Early" Predictions

  **Central Question:**  
  Under what conditions does revising the temporal auxiliary assumptions of a theory (e.g., rates, lags, or thresholds) in response to a failed long-run prediction constitute a legitimate refinement of the core substantive claim, rather than an ad hoc rescue that immunizes the theory against falsification?

  **The Problem:**  
  The "Malthus was right but early" narrative exemplifies a recurring pattern in scientific and social-scientific predictions: a mechanism (e.g., population growth outstripping resources) is posited, but its predicted societal impact fails to materialize within the expected timeframe (e.g., delayed by technological innovation or demographic transitions). This exposes a gap in philosophical accounts of theory appraisal. When a prediction fails *only* on timing, standard frameworks struggle to adjudicate whether the core theory is corroborated (with flawed auxiliary assumptions about *when*) or refuted (with timing adjustments serving as a "dodge"). The substance/schedule distinction—between a theory’s *core causal mechanism* and its *temporal auxiliary assumptions* (e.g., unstated rates of change, feedback delays, or threshold sensitivities)—remains under-theorized, leaving the legitimacy of temporal revisions ambiguous.

  **Why Standard Philosophical Frameworks Fall Short:**  
  1. **Popperian Falsificationism**: Treats any predictive failure as refutation. Yet it cannot accommodate cases where the *direction* of the prediction (e.g., resource scarcity under population pressure) is sound, but initial time estimates were incorrect. Popper’s prohibition on "conventionalist stratagems" (ad hoc rescues) lacks criteria to distinguish *illegitimate* temporal shifts from *legitimate* refinements of rate/lag parameters.  
  2. **Duhem-Quine Underdetermination**: Recognizes that hypotheses are tested in bundles (theory + auxiliaries). However, it does not provide tools to isolate *which* part of the bundle (core mechanism vs. temporal auxiliary) bears responsibility for failure, nor to judge when revising temporal auxiliaries is empirically grounded rather than arbitrary.  
  3. **Lakatosian Research Programmes**: Distinguishes "progressive" (predictively successful) from "degenerating" (rescue-dominated) theory shifts. But it focuses on *novel predictions*, not the specific issue of *temporal recalibration*. A program could be "progressive" while indefinitely deferring predictions (e.g., "it will happen later"), masking whether temporal revisions reflect new evidence or evasion.  

  **Why a Conceptual Approach?**  
  A historical analysis of Malthus alone would be descriptive, not normative; a formal model might abstract away from the epistemic problem of *warrant for revision*. A philosophical criterion for legitimate temporal-auxiliary revision addresses a gap in theory appraisal applicable to climate science, economics, and public policy—where "when" is often as contentious as "whether."

  **Methodology & Work Plan (6 Months, 1 Day/Week):**  
  - **Month 1**: Framework refinement. Define "temporal auxiliary" vs. "core substantive claim" using Malthus as a paradigm. Draft typology of temporal-rescue moves (e.g., threshold-adjustment, lag-extension).  
  - **Month 2**: Analyze Malthusian prediction. Reconstruct the *original* temporal auxiliaries (e.g., fixed agricultural productivity growth rates) and their role in early falsification. Contrast with post-hoc revisions (e.g., incorporating innovation lags).  
  - **Month 3**: Negative contrast case: **Paul Ehrlich’s resource-depletion predictions** (e.g., *The Population Bomb*). Examine how timing revisions (e.g., shifting scarcity thresholds) were widely dismissed as ad hoc despite sharing structural similarities with Malthus.  
  - **Month 4**: Positive contrast case: **Neoclassical growth theory’s convergence hypothesis**. Assess how revisions to temporal auxiliaries (e.g., accounting for institutional lags) transformed an initially failed prediction into a nuanced, empirically respected model.  
  - **Month 5**: Develop criterion. Synthesize cases to propose conditions for legitimate revision (e.g., auxiliary must be *independently testable*, revisions must *constrain future predictions*, core mechanism must not be *weakened* to accommodate delay).  
  - **Month 6**: Integrate and draft. Apply criterion to Malthus/Ehrlich/convergence cases; refine taxonomy; articulate limitations.  

  **Expected Outcome:**  
  A philosophically rigorous **criterion for legitimizing temporal-auxiliary revisions**, demonstrated through a **taxonomy of rescue-moves** and applied to Malthus (verdict: largely legitimate, but with caveats), Ehrlich (largely illegitimate), and growth theory (contextually legitimate). The result is a journal-ready paper resolving the "right but early" dilemma.  

  **Risks & Feasibility:**  
  - **Failure Modes**: (1) The substance/schedule distinction collapses under analysis (e.g., core mechanisms may *entail* timing assumptions); (2) The criterion proves circular (e.g., requires prior knowledge of the theory’s truth); (3) Cases resist clear categorization.  
  - **Feasibility**: Tight but viable for a focused paper. The conceptual scope avoids extensive empirical research; cases are well-documented in general literature (e.g., Malthus/Ehrlich debates, growth theory textbooks). Contrasts ensure the criterion is stress-tested without archival work. This is a *paper*, not a PhD: it delimits a specific puzzle without resolving all long-run prediction issues.  

  \question{Under what conditions does revising the temporal auxiliary assumptions of a theory in response to a failed long-run prediction constitute a legitimate refinement rather than an ad hoc rescue?}
