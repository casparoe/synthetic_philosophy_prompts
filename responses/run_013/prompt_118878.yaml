  The counting problem needs to feel real. I'll show beneficiaries arguing over percentages, highlighting the absurdity and pain of reducing a person to numbers. The grey market angle – people cramming to boost scores – adds ethical weight. Lena's dilemma when her sister scores 29.8% forces her to confront the system's flaws and her own grief.

  The eerie relief comes when Lena hears her mother through Beth. That moment should be unsettling yet comforting, capturing the paradox. Ending with Lena choosing to pay out despite the rules emphasizes that the self's value isn't in percentages but in how we keep each other alive. 

