prompt: |-
  Me and my mate Dave got into a massive argument last night about Turing's thing on learning machines and now I'm genuinely not sure if I actually understood the passage or if Dave's right that it's a mess. I want you to help me get clear on it, because we kept talking past each other.

  The passage, as best I can reconstruct it (I don't have the paper in front of me, so this is my paraphrase of the argument): in the 1950 paper on computing machinery and intelligence, in the section on learning machines, Turing says we shouldn't try to build a machine that directly simulates the adult human mind. Instead we should build something more like a child's mind and then subject it to an appropriate course of education. And then he says something that's stuck in my craw — he claims the teacher will often be very largely ignorant of what is actually going on inside the learning machine, and that the machine might do all sorts of things the teacher can't predict or follow, and he compares this to the fact that we also don't really know what's happening inside a child's head when we educate them.

  Dave's take is that this is either trivially true or self-undermining. Trivially true because of course we don't know the internal states of a complicated system, that's just a fact about complexity. Self-undermining because if the teacher doesn't understand what's going on inside, then in what sense is this "education" rather than just blind shaping, and how would the teacher ever know if it's working? He thinks Turing is smuggling in an analogy to human education that doesn't hold up, because human teachers at least have some grip on what a child is doing.

  My gut says Dave is missing something, but I couldn't articulate what. What I want from you is help understanding what work that ignorance claim is actually doing in Turing's argument. Is it meant as an empirical point about complexity, or is it a conceptual point about what teaching/educating a machine could even mean — like, is the ignorance supposed to be constitutive of the process rather than an unfortunate limitation? And does the comparison to not knowing what's inside a child's head carry real argumentative weight, or is it just a rhetorical gesture to make us feel better about the black box? Also curious whether you think the "child machine" framing commits him to something stronger than he realizes about what counts as learning versus programming. Please don't just give me a summary of the paper, I know roughly what it says — I need the interpretive work on this specific move.
