  Below is a decision tree taxonomy of positions on the dollar auction and escalation of commitment. The tree is built from branching questions, with leaf positions named (or marked "unnamed") and annotated with their hardest-to-defend commitment. The dollar auction serves as the running case, with flags where positions depend on redescribing the auction (e.g., assuming non-anonymity or repetition). The tree separates key dimensions: irrationality vs. rationality, origin of the trap (agent vs. rules), and remedy (individual vs. game-level). Cross-cutting distinctions (e.g., individual remedies for rational traps) are explicit in the leaves.

