  ### **Decision Tree: Positions on Escalation in the Dollar Auction**
  **Root Question: Is escalation a departure from the agent's instrumental rationality (relative to material payoffs)?**  
  *(Instrumental rationality: maximizing expected material utility given beliefs)*  

  #### **Branch 1: Yes (departure)**  
  **Question 1.1: What is the primary mechanism of departure?**  

  - **Branch 1.1A: Miscalculation of sunk costs**  
    *Position: **Sunk Cost Fallacy***  
    *Origin: Agent*  
    **Question 1.1A-R: Where should the remedy sit?**  
    - *Leaf: **Sunk Cost Fallacy (Individual Remedy)***  
      Hardest-to-defend commitment: Why this error persists despite transparent feedback (e.g., repeated losses in auctions) if it offers no adaptive benefit.  
    - *Leaf: **Sunk Cost Fallacy (Game Remedy)***  
      Hardest-to-defend commitment: Why society should alter games to correct a purely cognitive error (e.g., "fix people, not games").  

  - **Branch 1.1B: Greater willingness to gamble when behind**  
    *Position: **Break-Even Effect***  
    *Origin: Agent*  
    **Question 1.1B-R: Where should the remedy sit?**  
    - *Leaf: **Break-Even Effect (Individual Remedy)***  
      Hardest-to-defend commitment: How training can override a risk-preference shift rooted in loss-aversion psychology.  
    - *Leaf: **Break-Even Effect (Game Remedy)***  
      Hardest-to-defend commitment: Why games should accommodate context-dependent risk preferences (e.g., "loss-chasing is irrational, so ban traps").  

  - **Branch 1.1C: Service of non-material motives (e.g., self-justification, reputation)**  
    *Position: **Motivated Rationality***  
    *Origin: Agent*  
    **Question 1.1C-R: Where should the remedy sit?**  
    - *Leaf: **Motivated Rationality (Individual Remedy)***  
      Hardest-to-defend commitment: How agents can self-bind against motives like ego or reputation that feel identity-constitutive.  
    - *Leaf: **Motivated Rationality (Game Remedy)***  
      Hardest-to-defend commitment: Why games should be redesigned to shield agents from self-inflicted goal-alteration (e.g., "protect people from themselves").  

  #### **Branch 2: No (rational)**  
  **Question 2.1: Why is escalation rational?**  

  - **Branch 2.1A: Rules make continuing the best reply to the other's actions**  
    *Position: **Game-Theoretic Rationality***  
    *Origin: Rules*  
    **Question 2.1A-R: Where should the remedy sit?**  
    - *Leaf: **Game-Theoretic Rationality (Individual Remedy)***  
      Hardest-to-defend commitment: Why individuals should precommit when escalation is rational and payoff-maximizing (e.g., "avoid rational traps individually").  
    - *Leaf: **Game-Theoretic Rationality (Game Remedy)***  
      Hardest-to-defend commitment: Why change a game where losses stem from rational play (e.g., "auctions are fair, losers chose wisely").  

  - **Branch 2.1B: Quitting reveals damaging information (e.g., low resolve/resources)**  
    *Position: **Reputational Rationality***  
    *Origin: Agent*  
    **Question 2.1B-R: Where should the remedy sit?**  
    - *Leaf: **Reputational Rationality (Individual Remedy)***  
      Hardest-to-defend commitment: How precommitment works in anonymous auctions (⚠️ *requires redescribing auction as non-anonymous/repeated*).  
    - *Leaf: **Reputational Rationality (Game Remedy)***  
      Hardest-to-defend commitment: Why games should mitigate signaling incentives when agents rationally care about perceptions (⚠️ *requires redescribing auction as non-anonymous*).  

