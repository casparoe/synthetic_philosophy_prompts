answer: |-
  ### 1. The Gricean frame
  Grice's model of conversational implicature centres on speaker intention and hearer recognition. The speaker intends the hearer to derive a meaning beyond what is literally said, relying on shared cooperative principles and maxims (quality, quantity, relation, manner). This derivation is triggered by the hearer recognizing the speaker's deliberate flouting of a maxim and inferring the intended meaning based on context and mutual knowledge. The model is inherently dyadic and hearer-directed: meaning is co-created *within* the conversation between speaker and addressee. Audience-directed implicature, as seen in Wilde, poses a fundamental challenge. Here, a character's utterance flouts maxims not primarily for the benefit of their on-stage interlocutor (who may be oblivious), but to signal a layered meaning to the theatre audience, who possess superior contextual knowledge (dramatic irony, social satire). This creates a triadic structure: the speaker (character), the nominal hearer (another character), and the actual target (the audience). Grice's framework struggles to accommodate this, as it doesn't explicitly account for a third-party recipient for whom the flouting is most significantly intended, nor for meanings generated by theatrical convention rather than cooperative conversation.

  ### 2. The play as an implicature engine
  Wilde’s entire comedic structure functions by systematically flouting Gricean maxims, generating implicatures directed almost exclusively at the audience. Characters constantly violate the maxim of quality (truthfulness) through blatant lies and inversions of social truth. Algernon’s invention of "Bunbury" or Jack’s fictional brother "Ernest" flout quality, but the real implicature for the audience is the satire on Victorian hypocrisy and the necessity of double lives. The maxim of quantity is flouted through excessive triviality; discussions about cucumber sandwiches or muffins become absurdly inflated, implicating the profound emptiness of aristocratic concerns. Violations of relation are rampant, as characters respond with non-sequiturs, implicating their self-absorption and the breakdown of genuine communication. Most notably, the flouting of manner – through artificial epigrams, excessive politeness masking cruelty, and paradoxical statements ("I never travel without my diary. One should always have something sensational to read in the train") – generates implicatures about the artificiality of social conventions and the characters' lack of authentic selfhood. Crucially, the on-stage hearers often fail to recognize these floutings or derive the intended implicatures (remaining oblivious to the satire), while the audience readily does, making the performance itself a machine for generating audience-directed meaning.

  ### 3. Three Scenes
  *   **Algernon Explains Bunburying (Act I):** Algernon outlines his practice of using a fictional invalid friend, Bunbury, to escape social obligations. He flouts the maxim of quality (lying) and manner (presenting deceit as a social necessity). To his butler or Jack, the implicature might be simply that Algernon is irresponsible. However, Wilde directs the real implicature to the audience: the systematic hypocrisy required to navigate rigid Victorian society, where truth is a social liability. Grice can partially accommodate this by treating the audience as a second, intended addressee for whom the flouting is transparent and the implicature (social critique) is clear. The character *does* intend the audience to understand the mechanism, even if he doesn't address them directly.
  *   **Lady Bracknell Interviews Jack (Act I):** Lady Bracknell's interrogation about Jack's parentage flouts quantity (excessive detail on trivialities like the railway line to his foundling location) and quality (treating absurd criteria like handbag origins as serious qualifications). To Jack, the implicature is her snobbery and the impossibility of meeting her standards. For the audience, the flouting generates a richer implicature: the complete inversion of true value, where lineage trumps character, and societal ritual is paramount. This fits Grice if we see Bracknell *unintentionally* generating implicatures for the audience through her sincere but absurd adherence to flawed maxims, revealing the playwright's satirical intent beyond the character's own limited purpose.
  *   **The Lovers' Confessions (Act III):** Gwendolen and Cecily forgive Jack and Algernon only when they learn both are *actually* called Ernest. This flouts quality (the name's absurd importance) and relation (focusing on a trivial name rather than the profound deceit). The characters derive the implicature that the name "Ernest" signifies inherent goodness. The audience derives a deeper implicature: the ultimate triumph of superficial appearance over substance, and the characters' complete internalization of societal phoniness. Here, the character's *own* derived implicature (name=goodness) is itself the object of the audience's critical implicature. Grice struggles more here; the meaning layered *on top* of the characters' sincere but misguided implicature relies entirely on the audience's external perspective and the play's thematic structure, going beyond any single speaker's intention within the scene.

  ### 4. Where the play resists the frame
  The play ultimately resists a purely Gricean reading in several key ways. Firstly, **dramatic irony renders intention insufficient:** The audience often knows truths the characters don't (e.g., Jack and Algernon's deceptions). The profound meaning derived from lines like Cecily's diary entries about her engagement to "Ernest" (Algernon) doesn't stem from the *speaker's* (Cecily's) intention to flout a maxim for the audience, but from the audience's *superior knowledge* juxtaposed with her sincerity. The implicature of absurdity and self-delusion arises externally. Secondly, **repetition and pattern create systemic meaning:** The constant recurrence of triviality, inversion, and epigrammatic wit isn't just individual flouting but a cumulative stylistic effect. The meaning – the pervasive artificiality of this world – emerges from the play's structure and language patterning, exceeding any single character's intention. Thirdly, **theatrical convention supersedes cooperation:** Grice assumes cooperative principle adherence. Wilde's characters inhabit a world where cooperation is superficial; the *real* "conversation" is between the playwright and the audience *through* the characters. The meaning generated by staging (e.g., the physical comedy of muffin-eating contrasting with the seriousness of the "confession") or the genre conventions of farce operates outside speaker-hearer intentionality. The final resolution, hinging on a literally nonsensical revelation (Miss Prism's handbag mix-up granting Jack the name Ernest), generates implicatures about the arbitrariness of social identity that are purely dramatic effects, unrecoverable from any character's communicative intention.

  ### 5. What the play adds
  Wilde’s comedy demonstrates that implicature can function as a powerful **dramatic and satirical tool** operating beyond the dyadic conversation. It reveals a crucial layer where meaning is **co-created by the audience's contextual awareness and generic expectations**, not just the speaker's intention and the hearer's inference. The play highlights **speaker meaning as potentially layered:** a character can sincerely mean one thing for their on-stage interlocutor (often based on false premises or flouted maxims they don't recognize) while simultaneously, through the playwright's design, generating a radically different, critical meaning for the audience. Most significantly, Wilde shows how **social critique can be embedded in the *form* of communication itself.** The persistent flouting of maxims isn't just a mechanism for local implicatures; it *enacts* the very hypocrisy, superficiality, and miscommunication that is the play's subject. Grice provides the mechanics of indirect meaning, but Wilde demonstrates how those mechanics, when systematized within a fictional world and directed towards an observing audience, can generate profound thematic and critical meaning that transcends the intentions of the individual speakers within the drama. The play argues that meaning, especially satirical meaning, is often a collective, contextual, and theatrical achievement.
