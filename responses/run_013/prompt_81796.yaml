  I am writing a novel, and its central figure is a philosopher — call her Vera — who spends the book as a consultant to two institutions at once: a hospital's ethics committee and the safety review of a machine-learning laboratory. In the chapters I have drafted, she is asked, again and again, whether some arrangement is what she calls wireheading, and she has so far given these verdicts:

