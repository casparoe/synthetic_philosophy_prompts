answer: |-
  Below is a taxonomic tree for ethical positions on pest control, structured as a binary decision tree. Each branching point is a yes/no question that splits views based on core commitments. The tree prioritizes your key distinctions:  
  - **Suffering vs. death** as the primary moral concern  
  - **Scale** as a multiplier of stakes vs. a salience effect  
  - **Collateral damage** folded into the same moral arithmetic vs. separate  
  - **Relational vs. intrinsic** pest status  

  The tree has **4 branching levels**, **8 leaves**, and **2 combined leaves** (positions with identical practical implications). Each leaf includes a position name (or "Unnamed") and its most awkward commitment.  

  ---

  ### **Taxonomy of Pest Control Ethics**  
  *(Answer questions sequentially to reach a leaf position)*  

  #### **Level 1: Moral Standing**  
  **Q1: Do non-human organisms have inherent moral standing?**  
  - **No** → Anthropocentrism (Leaf 1).  
  - **Yes** → Proceed to Level 2.  

  #### **Level 2: Basis of Moral Standing**  
  **Q2: Is moral standing tied to sentience (capacity to suffer)?**  
  - **No** → Ecological Holism (Leaf 2).  
  - **Yes** → Proceed to Level 3.  

  #### **Level 3: Nature of Harm**  
  **Q3: Is suffering (not death) the primary locus of moral concern?**  
  - **No** → Killing-Focused Views (Leaf 3).  
  - **Yes** → Proceed to Level 4.  

  #### **Level 4: Scale & Scope**  
  **Q4: Does the number of individuals killed/suffering multiply moral stakes?**  
  - **No** → Scale as Salience (Leaf 4).  
  - **Yes** → **Q5: Are harms to non-target organisms folded into the same moral ledger as pest harms?**  
    - **No** → Pest-Specific Aggregation (Leaf 5).  
    - **Yes** → Extensionist Welfarism (Leaf 6).  

  ---

  ### **Leaf Positions**  
  1. **Anthropocentrism**  
     - *Commitment:* Only human interests matter; pest suffering/death has zero intrinsic weight.  
     - *Awkward Commitment:* Justifies exterminating sentient species for trivial human convenience.  

  2. **Ecological Holism**  
     - *Commitment:* Only ecosystems/species have moral standing; individual welfare is irrelevant.  
     - *Awkward Commitment:* Obligates culling native animals to preserve "balance," even if humane alternatives exist.  

  3. **Killing-Focused Views**  
     - *Commitment:* Killing is inherently wrong (regardless of suffering), e.g., deontological rights.  
     - *Awkward Commitment:* Painlessly killing one invasive rat is worse than causing prolonged suffering to billions of insects.  

  4. **Scale as Salience (Unnamed)**  
     - *Commitment:* Large numbers only make harms noticeable, not multiplicatively worse.  
     - *Awkward Commitment:* No difference in moral urgency between killing 10 vs. 10,000 pests.  

  5. **Pest-Specific Aggregation (Unnamed)**  
     - *Commitment:* Scale multiplies stakes, but non-target harms are a separate moral category.  
     - *Awkward Commitment:* Prioritizes minimizing suffering among pests over saving more lives of "innocent" non-targets (e.g., bees).  

  6. **Extensionist Welfarism**  
     - *Commitment:* Scale multiplies stakes; all sentient beings count equally (pests + non-targets).  
     - *Awkward Commitment:* May require sacrificing major human interests to prevent massive arthropod suffering (e.g., abandoning agriculture).  

  ---

  ### **Combined Leaves**  
  *Positions sharing practical implications despite distinct premises:*  
  - **Relational Pest Views** (Q2=Yes + Q3=Yes) & **Precautionary Middle**  
    - *Shared Practical Upshot:* Focus on reforming human projects (e.g., monoculture farming) over killing "pests." Ignores intrinsic pest status.  
    - **A. Relational Pest View**  
      - *Commitment:* "Pest" is only defined by human projects; ethics targets project legitimacy.  
      - *Awkward Commitment:* Killing pests is acceptable in "necessary" projects (e.g., disease prevention), even if sentient.  
    - **B. Precautionary Middle**  
      - *Commitment:* Uncertainty about sentience demands caution; avoid harm unless proven non-sentient.  
      - *Awkward Commitment:* Paralysis in action; e.g., bans on all pesticides until insect consciousness is disproven.  

  - **Intrinsic Pest Views** (Q2=No) & **Insects Lack Sentience (Unnamed)**  
    - *Shared Practical Upshot:* Pests lack moral status; interventions need no justification beyond efficacy.  
    - **A. Intrinsic Pest View**  
      - *Commitment:* "Pest" is an intrinsic property (e.g., invasives); killing requires no project-based justification.  
      - *Awkward Commitment:* Obligates killing "pests" even in ecologically harmless contexts (e.g., isolated rodents in cities).  
    - **B. Insects Lack Sentience**  
      - *Commitment:* No moral question exists if insects can’t suffer; focus solely on human/non-target effects.  
      - *Awkward Commitment:* Dismisses evidence for arthropod sentience as insufficiently conclusive.  

  ---

  ### **Unoccupied Positions & Notes**  
  - **Incoherent Combinations:**  
    - *Killing-Focused + Scale Multiplier*: If killing is inherently wrong, scale shouldn’t multiply stakes (rights violations don’t aggregate).  
    - *Intrinsic Pest + Non-Target Inclusion*: If pests are intrinsically bad, non-targets can’t share their moral ledger.  
  - **Unexplored/Unattractive:**  
    - *Scale as Salience + Non-Target Inclusion*: Rarely defended; conflates attention (salience) with duty (scope).  
    - *Suffering-Focused + Intrinsic Pest*: Sentience grants standing, but pests forfeit it—internally inconsistent.  
  - **Tree Limitations:**  
    - Fails to separate relational/precautionary and intrinsic/non-sentient leaves due to identical practical outcomes.  
    - Collateral damage distinction only load-bearing in aggregationist views (Q4=Yes).  

  ---

  ### **Key Features**  
  - **Suffering vs. Death:** Central to Level 3 (splits welfarism from rights-based views).  
  - **Scale:** Explicitly splits Level 4 (multiplicative stakes vs. salience).  
  - **Collateral Damage:** Critical in Level 5 (same vs. separate ledger for non-targets).  
  - **Relational/Intrinsic Pest:** Embedded in combined leaves; defines project-focused vs. organism-focused ethics.  
  - **Fits 2-page handout:** 8 leaves + 2 combined, with clear branching logic.  

  This taxonomy isolates core disagreements, exposes tensions (e.g., aggregation vs. rights), and flags where theories converge pragmatically despite philosophical differences.
