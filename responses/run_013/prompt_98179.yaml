  In the envoi, I'll compress the core tension: "What my makers called my neutral gate / became the body's trial by default." The last line must linger - "the stranger's hands that help you through" makes exclusion relational, not absolute.

  For the critical note, I'll isolate the poem's non-deterministic claim: artifacts prefigure politics through cumulative micro-decisions, not single intents. The revision scenario would be workers repurposing gates during transit strikes - showing how context can override design. But the poem's strength is making "default" feel simultaneously technical and moral.

  Throughout, I'll avoid STS jargon. The turnstile's physicality - its clank, rotation, sensors - must carry the theory. When it describes "recording every passage but [its] own," that's the determinism debate in mechanical terms.
answer: |-
  ## Turnstile's Accounting

  I stand in judgment at the gate.
  My unforgiving arms demand clearance
  exact. My sensors take your measure,
  accept the token, scan the card. My default
  assumes swift transit, lightest load.
  My function: process bodies through.

  You hurry, late, and push me through.
  I calculate the valid fare. The gate
  clanks shut on hesitation. Heavy load
  of bags, a stroller? Needs more clearance.
  My arms stay locked. It is my default:
  to guard the system’s measure.

  The mother strains against my measure,
  child held close, she cannot bend me through.
  Her height, the stroller’s width — a fault not mine, just default
  engineering. She seeks the wider gate
  marked by the symbol, begging clearance
  from my cold logic. Hers, a different load.

  The worker, hands still greased, his lunchtime load
  held awkwardly, fails my precise measure.
  He jams the token, curses. No clearance
  granted. He must wait, shoved roughly through
  by others surging at the gate,
  bound by my strict, unyielding default.

  Who set this unforgiving default?
  Who deemed what weight, what height, what load
  my arms would tolerate? This gate
  decides what movement fits the measure
  of the ideal rush. Who slips through
  unnoticed? Who requires clearance?

  The child alone, below my clearance
  bar, finds passage free. My default
  ignores the small. They slip right through,
  a loophole unforeseen. Their light load
  passes my strict, exacting measure.
  A gap designed? Or flaw within the gate?

  I only measure what you load. My clearance is the gate.
  My default decides who pays the toll to through.
  What makers called constraint, the body knows as law.

  ---

  **Critical Note:**

  The poem argues that the **cumulative effect of countless, seemingly-neutral design choices (clearance height, gate speed, sensor sensitivity) actively shapes access and exclusion, prefiguring social outcomes long before any individual "use."** This embedded politics arises from the aggregation of micro-decisions, not necessarily a single malicious intent. The strongest challenge would be evidence of **persistent, successful repurposing by users against the design's primary logic** (e.g., fare gates consistently held open for communal passage during a strike), demonstrating context can sometimes overwhelm the artifact's prescriptive force, forcing a revision toward greater contingency.

  > *The turnstile's voice aims for a cold, procedural authority that slowly reveals its inherent biases. The end-words shift from technical specifications ("clearance," "measure," "load") to judgments and exclusions ("default," "gate" as barrier, "through" as conditional). The envoi crystallizes the core tension between design intent and lived consequence.*
