  First, I need to select the most resonant end-words from their suggested list (gate, clearance, measure, default, load, through). "Default" feels particularly rich - it's both a technical setting and a philosophical statement about norms. "Clearance" physically embodies accessibility concepts. I'll keep all six but emphasize how "default" and "clearance" can pivot between neutral and charged meanings.

  For the artifact's voice, a turnstile works better than stationary gate - its rotating mechanism literalizes inclusion/exclusion. The rotation metaphor also fits the sestina's recursive form. I imagine the turnstile as an ambivalent witness: "I only measure what you load" contrasts with "I decide who pays the toll."

  The political argument should emerge through concrete images: 
  - A child's height versus the clearance bar
