prompt: |-
  I am the standards editor at a weekly magazine, and roughly once a week I have to decide what to do with a submission that blames someone for something: a lobbyist for one firm arguing that a rival greenwashes; a woman denouncing a safety violation at a larger company when she was herself fined for the same violation; a state senator attacking a policy she voted for. Readers and staff object that the author has no standing to say it, and our internal arguments about this go nowhere. I have no philosophy background and about twenty minutes per submission, and what I need is a reusable procedure, not an essay.

  Build it around three standings I want kept distinct, since conflating them is what makes our current discussions useless: standing to speak (to put the accusation into public circulation at all), standing to demand (to address the wrongdoer and require an answer or a change), and standing to resent (to have been wronged personally by what was done). My working assumption is that these come apart — a hypocrite may keep the first and lose the second — and I want each question in the procedure to say which standing it bears on, with the places where the distinction is doing no real work marked as such.

  Also build in a rule for what I will call the unpaid-debt case: a critic who is still doing the thing, or who did it and has never acknowledged it, versus one who did it, has said so, and has stopped. I suspect these should be treated differently and want the procedure to say how. Then say what the procedure cannot do — in particular, it must not silently merge the question of the accuser's standing with the separate question of whether the accusation is true.

  The deliverable is a short ordered list of questions, what counts as a disqualifying answer to each, where the procedure terminates with a decision, and where it must hand the case to me as a value judgment I cannot delegate. Run it on the three submissions above, including any case where it gives an answer I will not like, and end with a final line of the form Verdict: 1) <publish / publish with disclosure / reject>; 2) <...>; 3) <...>.
reasoning: |-
  Okay, the user is a standards editor at a weekly magazine facing recurring dilemmas about publishing accusatory submissions. They describe three specific cases: a lobbyist accusing a rival of greenwashing, a woman with past violations denouncing a larger company, and a state senator attacking a policy she voted for. Staff and readers keep questioning the authors' standing to make these accusations.

  The core problem seems to be tangled internal debates where three distinct types of standing get conflated: standing to speak (public circulation), standing to demand (requiring response/change), and standing to resent (personal victimhood). The user explicitly wants these separated in the procedure. They also mention the "unpaid-debt" distinction between ongoing/unacknowledged wrongdoing versus confessed/reformed behavior, and insist the procedure mustn't merge standing with truth verification.

  Hmm, their constraints are tight: no philosophy background, 20 minutes per submission, reusable process needed. The deliverable must be a crisp Q&A flow with clear exit points. They're clearly frustrated by circular arguments and want something operational.

  For the procedure design, I'll start by defining decision gates for each standing type while flagging where distinctions collapse. The unpaid-debt rule needs a dedicated filter - probably right after establishing hypocrisy/relevance. Truth assessment must come last as a separate module. 

  Important to build in off-ramps: where automated rejection applies (e.g., irrelevance), where disclosure suffices (e.g., lost demanding-standing), and where human judgment is unavoidable (e.g., complex unpaid-debt cases). The three test cases will stress-test these paths.

  Noticing the user's implicit values: They prioritize procedural fairness over moral purity, want to publish more than reject (hence disclosure options), and distrust performative outrage. Their "unpaid-debt" framing suggests they see moral capital as accumulative - past wrongs don't permanently taint if addressed. 

  Biggest risk is oversimplifying - some cases will resist categorization. That's why the procedure must explicitly hand off ambiguous unpaid-debt assessments. Also crucial to isolate truth verification so standing objections don't covertly suppress valid accusations.

  For the lobbyist case: Standing to speak exists (industry knowledge), but unpaid-debt rule may kill demanding-standing if they're currently greenwashing. Since they're a rival, disclosure is mandatory regardless. 

  For the safety advocate: She's reformed (paid debt), so standing to speak/demand holds. Her past violation is actually credibility-enhancing for speaking-standing. Must disclose history but no rejection.

  Senator case is trickiest: Voting for the policy creates unpaid debt unless she publicly recanted. If she's still defending past votes, she loses demanding-standing. But since she's an elected official, her standing to speak remains strong. Disclosure needed about her vote.

  Final verdicts should balance exposure of wrongdoing against rhetorical fairness. The procedure's strength is forcing these into separate buckets rather than one murky "hypocrisy" judgment.
answer: |-
  Here's a reusable procedure focusing on the distinct standings and unpaid-debt rule. It prioritizes speed with clear exit points.

  **Procedure: Accusation Standing Assessment**

  1.  **QUESTION:** Is the accusation *directly relevant* to the author's role, expertise, or publicly stated principles? (Bears on: **Standing to Speak**)
      *   *Disqualifying Answer:* No (e.g., a food critic accusing a company of unsafe bridge construction).
      *   *Action:* **REJECT**. (Terminates)
      *   *Action if Passes:* Proceed to Q2.
      *   *(Distinction Note: Primarily speaks to "Speak," but relevance is foundational for all.)*

  2.  **QUESTION:** Does the author **currently engage in**, or have an **unresolved/unacknowledged history of**, the *exact specific behavior* they are accusing the target of? (The **Unpaid-Debt Rule** - Bears on: **Standing to Demand** & potentially **Standing to Resent**)
      *   *Disqualifying Answer:* **Yes, they currently engage** in the behavior.
          *   *Action:* **REJECT** for lacking **Standing to Demand**. (Terminates - Hard Hypocrisy)
      *   *Disqualifying Answer:* **Yes, they have an unresolved/unacknowledged history** of the behavior (never admitted it, never stopped *because* it was wrong, never made amends).
          *   *Action:* **Proceed to Q3 (Human Judgment Gate)**.
      *   *Passing Answer:* **No** (They don't do it now AND any past instance is resolved/acknowledged/repented, OR they never did it).
          *   *Action:* **Proceed to Q4**. (Standing to Demand is *not* disqualified by past resolved actions).

  3.  **HUMAN JUDGMENT GATE:** (Triggered only by Unresolved Past Debt in Q2)
      *   *Question:* Does the *nature* and *timing* of the author's past unresolved behavior **fundamentally undermine their moral authority** to demand accountability *in this specific instance*, outweighing the public interest in the accusation itself? (Bears on: **Standing to Demand** & **Standing to Speak** weight).
      *   *Action:* **Editor Judgment Required**. Consider severity, recency, context, sincerity of current accusation vs. past denial. No automatic answer.
          *   *Possible Outcomes:* REJECT (if moral authority is too compromised), PUBLISH WITH DISCLOSURE (if accusation has significant merit/interest but debt weakens demand), PUBLISH (rare, if debt is minor/old and accusation is crucial).
      *   *Terminates:* After Editor's decision.

  4.  **QUESTION:** Is the author making a **personal claim of victimhood** ("*I* was wronged by this")? (Bears on: **Standing to Resent**)
      *   *Disqualifying Answer:* Yes, but the accusation demonstrably **cannot** have harmed the author personally (e.g., someone unaffected by a company's internal safety violation claiming *personal* harm).
          *   *Action:* **REJECT** that specific claim of resentment or edit it out. Proceed to Q5 for the core accusation. (Terminates *only* the resentment claim)
      *   *Passing Answer:* Yes (plausible personal harm) OR No (making a general accusation, not claiming personal victimization).
          *   *Action:* **Proceed to Q5**. (Standing to Resent is either valid or irrelevant).

  5.  **FINAL FILTER:** Does the accusation meet **general publication standards** (evidence, newsworthiness, fairness, libel risk, space, etc.)? **This is SEPARATE from standing.** (Bears on: **Publishability**, *not* standing).
      *   *Disqualifying Answer:* No (fails basic standards).
      *   *Action:* **REJECT**. (Terminates)
      *   *Passing Answer:* Yes.
      *   *Action:* **PUBLISH**.
      *   *Disclosure Requirement:* **ALWAYS disclose** any relevant, material conflict of interest, hypocrisy, or unresolved past behavior identified in Q2/Q3 (even if not disqualifying) **IF** it significantly impacts the author's credibility regarding *this specific accusation*. This disclosure addresses the weakened **Standing to Demand** and informs the reader.

  **What the Procedure CANNOT Do:**
  1.  **Determine Truth:** It assesses the *author's position* to level the accusation, *not* whether the accusation itself is true or well-supported. Truth must be verified separately through standard editorial fact-checking.
  2.  **Resolve All Moral Ambiguity:** Some unpaid-debt cases (Q3) require nuanced editorial judgment.
  3.  **Eliminate Reader/Staff Discomfort:** Readers may still *feel* someone is hypocritical. Disclosure is the primary tool to manage this.
  4.  **Apply Perfectly to Every Edge Case:** It's a framework for common patterns.

  **Application to Submissions:**

  1.  **Lobbyist (Firm A) Accusing Rival (Firm B) of Greenwashing:**
      *   Q1: **Yes.** Industry knowledge relevant. (Speak: OK)
      *   Q2: **Unpaid-Debt?** Does Firm A *currently* greenwash? If YES → **REJECT** (Hard Hypocrisy). If NO, but has *unresolved/unacknowledged past* → **Q3**. If NO past or resolved past → Q4.
      *   *Likely Path:* If Firm A has *any* current greenwashing → **REJECT**. If not, but unresolved past → **Q3 (Editor: Weigh severity)**. If clean/repented → Q4.
      *   Q4: **No** personal resentment claim (usually). → Q5.
      *   Q5: Assess evidence/newsworthiness.
      *   **Disclosure ALWAYS Needed:** Must disclose the author is a direct competitor.
      *   **Verdict:** **Highly Contextual.** If currently greenwashing → **REJECT**. If not, but unresolved past → **Editor Judgment (Q3)** - Likely **PUBLISH WITH DISCLOSURE** of rivalry *and* past if material. If clean/resolved → **PUBLISH WITH DISCLOSURE** of rivalry.

  2.  **Woman Denouncing Safety Violation at Large Co. (Fined for Same):**
      *   Q1: **Yes.** Direct experience relevant. (Speak: OK, potentially strong)
      *   Q2: **Unpaid-Debt?** Does she *currently* violate? **No** (implied). Past violation: **Resolved/Acknowledged?** Fined = *acknowledged* by authority. Has *she* acknowledged/stopped? **Assuming Yes** (fined implies stopped). → **Passes Q2** (Standing to Demand: OK).
      *   Q4: **Likely Yes** (personal claim of victimhood? If she's speaking generally, maybe not. If "this hurt people like me" or implies direct harm, plausible). → **Standing to Resent: Plausible/OK**.
      *   Q5: Assess evidence/newsworthiness.
      *   **Disclosure:** **Required.** Must disclose her past violation/fine to contextualize her expertise and potential bias. This strengthens credibility for *speaking* but is material context.
      *   **Verdict:** **PUBLISH WITH DISCLOSURE** of her past fine. (Her debt is paid - fine is acknowledgement).

  3.  **State Senator Attacking Policy She Voted For:**
      *   Q1: **Yes.** As elected official, policy critique is core role. (Speak: Strong)
      *   Q2: **Unpaid-Debt?** Did she vote for it? **Yes.** *Current* behavior: Is she *still* supporting/voting for it? **If YES → REJECT** (Hard Hypocrisy). **If NO**, Past Vote: **Resolved/Acknowledged?** Has she publicly acknowledged the vote was wrong/explained the change? **If NO (unresolved/unacknowledged)** → **Q3**. **If YES** → Passes Q2 (Standing to Demand: OK).
      *   *Likely Path:* If still supports → **REJECT**. If opposes now but *never acknowledged her past vote was wrong* → **Q3 (Editor Judgment)**. If opposes and publicly recanted/explained change → Q4.
      *   Q4: **Unlikely** personal resentment claim (policy impact). → Q5.
      *   Q5: Assess evidence/newsworthiness.
      *   **Disclosure:** **ALWAYS Required.** Must disclose her past vote.
      *   **Verdict:** **Highly Contextual.** If still supports → **REJECT**. If opposes now but silent on past vote → **Editor Judgment (Q3)** - Likely **PUBLISH WITH DISCLOSURE** (past vote + current position) but weakens demand. If opposes and publicly recanted → **PUBLISH WITH DISCLOSURE** (past vote + recantation).

  **Final Verdicts Based on Typical Assumptions:**
  1)  **Lobbyist:** Likely **PUBLISH WITH DISCLOSURE** (of rivalry & any *resolved* past missteps) *unless* currently greenwashing (**REJECT**) or severe unresolved past triggers Q3 rejection.
  2)  **Woman:** **PUBLISH WITH DISCLOSURE** (of her past fine).
  3)  **Senator:** Likely **PUBLISH WITH DISCLOSURE** (of her past vote) *unless* she still supports the policy (**REJECT**) or her silence on her past vote is deemed fatally undermining by Editor in Q3 (**REJECT**).
