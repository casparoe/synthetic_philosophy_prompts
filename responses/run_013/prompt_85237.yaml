answer: |-
  ## Opening Address: Expanding Our Moral Horizon  

  **(Ten minutes; warm, measured, collegial tone)**  

  Friends, colleagues, welcome. It’s an honour to stand before you as your incoming Chair, surrounded by people whose dedication has reshaped the landscape of animal welfare. For decades, this organisation has turned compassion into tangible change for billions of farmed animals. That work remains vital, urgent, and deeply respected. Today, I want to explore how we might broaden that legacy—not by shifting focus, but by deepening our understanding of what ‘welfare’ means in an uncertain world.  

  We gather at a moment of scientific ferment. In labs and fields, researchers are asking profound questions about minds far smaller than our own: insects. Do they feel? Do they suffer? The answers aren’t simple. We have compelling evidence of complex behaviours—honeybees learning symbols, fruit flies trading safety for reward, crickets seeking pain relief. Yet we lack definitive proof of *subjective experience*. This uncertainty isn’t a barrier to moral consideration; it’s an invitation to think rigorously about risk, scale, and responsibility.  

  Let me be clear: **sentience isn’t a switch; it’s a spectrum.** And the moral weight we assign to suffering isn’t fixed; it’s a choice. These are distinct questions. We can acknowledge a *low probability* of insect sentience while still recognising that *if* that sentience exists, the sheer scale of insect lives could demand our attention. Consider the maths: even a tiny probability, multiplied by trillions upon trillions of individuals, and multiplied again by whatever moral weight we deem appropriate—say, a fraction of a vertebrate’s—yields vast *expected stakes*. This isn’t advocacy; it’s arithmetic.  

  But—and this is crucial—arithmetic alone isn’t action. I hear two serious objections whispering in this hall, and we owe them answers.  

  **First objection:** *"If we include insects, what stops us from worrying about nematodes? Or bacteria? Where does it end?"*  
  A fair challenge. Nematodes outnumber humans by billions to one. If we followed probability and scale blindly, we’d drown in uncertainty. But moral responsibility isn’t just about numbers; it’s about *plausibility* and *practicality*. The more distant a creature is from our understanding of sentience, the lower the probability. Nematodes lack even the rudimentary neural structures insects possess. We draw lines not out of convenience, but based on evidence: insects sit at the frontier of credible concern. Beyond that frontier, probabilities plummet toward zero. We focus where evidence—not just scale—suggests it’s reasonable to look.  

  **Second objection:** *"Pursuing tiny probabilities could paralyse us. Why fund a chicken shelter when trillions of insects might suffer?"*  
  This cuts to the heart of our mission. But effective compassion isn’t zero-sum. We don’t abandon near-certain good for cosmic gambles. A firefighter saves the child in front of her *and* supports research to prevent future fires. Our work for farmed animals delivers immense, certain good. It’s foundational. But acknowledging potential suffering elsewhere doesn’t diminish this; it reflects the same moral impulse that built this movement. We walk *and* chew gum: we secure today’s victories while preparing for tomorrow’s horizons.  

  So where does this leave us?  
  - **For farmed-animal advocates:** Your work is irreplaceable. It anchors us in tangible progress.  
  - **For scientists:** Keep sharpening the questions. We need your clarity on probability.  
  - **For all:** Let’s see insect welfare not as a distraction, but as an extension of our core principle—reducing suffering where it plausibly exists.  

  We won’t rush. We’ll weigh evidence. We’ll prioritise wisely. But in a universe teeming with life, closing our eyes to trillions of potential sufferers isn’t prudence—it’s a failure of moral imagination.  

  Our strength has always been balancing heart and head. Let’s do so again. Not with slogans, but with humility, curiosity, and the courage to let evidence guide our compassion—wherever it leads.  

  Thank you. Let’s begin.  

  ---

  **Key Structural Choices:**  
  1. **Separated Probability/Weight:** Framed sentience as a spectrum ("low probability") and moral weight as a separate variable ("whatever weight we deem appropriate"), linked by scale.  
  2. **Addressed Nematodes:** Explicitly contrasted insects (credible frontier) with nematodes (evidence "distant"), using neural complexity as a natural stopping point.  
  3. **Paralysis Objection:** Emphasized "walk and chew gum" duality—near-certain work continues *alongside* exploring new frontiers.  
  4. **Honoured Existing Work:** Repeatedly anchored the argument in the legacy of farmed-animal advocacy ("foundational," "irreplaceable").  
  5. **Avoided Overselling:** Used "if," "potential," "plausibility," and "expected stakes" instead of claims of certainty.  
  6. **Lay-Friendly:** Avoided jargon; explained "expected stakes" via accessible multiplication metaphor.  

  This approach respects the veterans’ concerns while inviting curiosity, turning skepticism into engagement—precisely what a Chair’s address should do.
