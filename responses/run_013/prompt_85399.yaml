  Alternatively, when they are about to vote on a boundary change that excludes F, the facilitator can ask: "Does anyone from Group F or anyone else object to this exclusion?" Then they object, and we have the challenge.

  Finally, the activity cannot reproduce:
  - Historical violence: we have a peaceful negotiation. We must mention this in debrief.
  - The room is bounded: so the unboundedness is not felt. We must argue that stakeholder principle could include more and more people (e.g., consumers of electricity in other countries, future generations, etc.).
  - Future generations: not represented. We can mention that in debrief.

  We must supply verbally the historical contingency and violence, and the unboundedness beyond the room.

  We can leave unmentioned the future generations if time is short, but it's a key dimension. Mention it in the debrief as an example of how stakeholder principle becomes unbounded.

  Final design summary:

  Activity: Riverbend Dam Decision

  Groups:
  - A: Valley Downstream (3p, against dam: lose 5 if built)
  - B: Upland (3p, for dam: gain 10 if built)
  - C: Flood Zone (3p, against dam: lose 10 if built)
  - D: Nearby City (3p, for dam: gain 3 if built)
  - E: Neighboring Farmers (3p, against dam: lose 2 if built)
  - F: International Environmentalists (3p, against dam: lose 1 if built)

  Initial electorate: A,B,C

  Rounds:
  Each round:
  1. Substantive vote: Vote on whether to build the dam. Majority rule (if tie, status quo wins -> not build).
  2. Boundary vote: Proposals to change the electorate for the next round. Proposals must be seconded, then debated (2 min max), then voted by current electorate (majority rule).

  Debrief:
  - Map the events to the theoretical points.
  - Highlight the dilemmas and the regress.
  - Discuss limitations.

  Handling predictable issues:
  - If no boundary proposals: facilitator prompts.
  - If dominant participant: let it happen and then discuss power dynamics in debrief.
  - If conflating substance and boundary: in debrief, point out that boundary decisions are prior and should be made independently, but in practice they are intertwined.
  - If they include everyone and stop: then the facilitator can ask: "Is this fair? What about people outside the room? What about future generations? And how do we enforce decisions if people from other countries are included but not subject to our laws?"

  This should create the experience.
answer: |-
  Below is a detailed design for the 90-minute workshop activity. It simulates the boundary problem through a structured game centered on a fictional "Riverbend Dam" decision. Participants will experience the circularity of defining the *demos* firsthand, with rounds that force confrontations between the two boundary principles (stakeholder interests vs. subjection to coercion). The activity is designed for 18 participants divided into six groups, with you as the facilitator. 

  ### **Core Rules and Roles**
  - **Groups and Interests** (3 participants each):  
    1. **Valley Residents (A)**: Directly harmed if dam is built (lose 5 points per member from flooding).  
    2. **Upland Residents (B)**: Directly benefit if dam is built (gain 10 points per member from irrigation/electricity).  
    3. **Floodplain Residents (C)**: Homes destroyed if dam is built (lose 10 points per member).  
    4. **Nearby City (D)**: Indirectly benefits (gain 3 points per member from cheaper electricity) but outside the town’s jurisdiction.  
    5. **Neighboring Farmers (E)**: Indirectly harmed (lose 2 points per member from water scarcity) but in a different administrative region.  
    6. **International NGOs (F)**: Minimally affected (lose 1 point per member from biodiversity loss) with no local ties.  

  - **Initial Electorate**: Only groups A, B, and C (9 people) — the "historic" residents of Riverbend.  
  - **Substantive Decision**: Whether to build the dam (simple majority wins; tie = status quo, i.e., no dam).  
  - **Boundary Decisions**: Each round, the current electorate votes on:  
    - **Substantive issue** (dam yes/no).  
    - **Boundary proposal** (change who votes next round). Proposals must be based on either:  
      - **Principle 1 (Stakeholder)**: Enfranchise all whose interests are affected.  
      - **Principle 2 (Coercion)**: Enfranchise only those subject to enforcement (e.g., local jurisdiction).  
    Proposals require a second, 2-minute debate, and majority vote.  
  - **Points System**: Tracked publicly on a whiteboard. Points are symbolic (e.g., tokens) but affect "winners":  
    - If dam is built: Gains/losses as above.  
    - If dam is not built: No change (0 points).  
  - **Your Role**: Facilitator (timekeeper, scorekeeper, rule enforcer). Intervene minimally until the challenge moment.  

  **Materials Needed**:  
  - Name tags (labeled A–F).  
  - Voting cards (green/red for dam yes/no; blank for boundary proposals).  
  - Whiteboard/flip chart: Track points, electorate, and principles adopted.  
  - Timer.  
  - Tokens (or pen/paper) for points.  

  ---

  ### **Timeline (90 Minutes Total)**  
  **0–10 min: Setup and Rules**  
  - **0–2 min**: Introduce the boundary problem briefly: *"We’re exploring how democracies decide who gets a voice. Today, we simulate a decision about building a dam in Riverbend."*  
  - **2–5 min**: Assign groups randomly (pre-prepared name tags). Explain roles, interests, and point system. Post point impacts visibly.  
  - **5–10 min**: Explain rules:  
    - Rounds consist of a substantive vote (dam) and a boundary vote (who votes next).  
    - Initial electorate: Only A, B, C.  
    - Emphasize: *"Anyone in the current electorate can propose a boundary change. You must base it on a principle: Stakeholder (affected interests) or Coercion (subject to enforcement)."*  
    - **Key provocation**: *"If challenged, I’ll arbitrate—but ask why I have that authority."*  

  **10–25 min: Round 1 (Electorate: A, B, C)**  
  - **10–12 min**: **Substantive vote** (dam yes/no).  
    - *Predictable outcome*: A and C outvote B (6–3 against dam). Points: All at 0 (dam not built).  
  - **12–20 min**: **Boundary proposals**.  
    - *Prompt if needed*: *"Should others vote? Propose a change using a principle."*  
    - *Likely proposal*: B (seeking allies) proposes adding D using Principle 1 (D is affected).  
    - **Debate**: Encourage arguments about principles.  
    - **Vote**: Likely fails (A/C protect their majority).  
  - **20–25 min**: **Transition**. Reset for Round 2; record electorate.  

  **25–40 min: Round 2 (Electorate: A, B, C)**  
  - **25–27 min**: **Substantive vote**. Same outcome (dam fails; points 0).  
  - **27–35 min**: **Boundary proposals**.  
    - *Escalate tension*: Excluded groups (D, E, F) protest: *"We’re affected! Why can’t we vote?"*  
    - *Likely proposal*: D or E demands inclusion via Principle 1. B seconds.  
    - **Debate**: Highlight divergence—e.g., *"Should we use Coercion instead? D isn’t local."*  
    - **Vote**: If passed, adopt Principle 1, enfranchising all (A–F, 18 people).  
  - **35–40 min**: **Transition**. Update electorate.  

  **40–55 min: Round 3 (Electorate: A–F, 18 people)**  
  - **40–42 min**: **Substantive vote**.  
    - *Outcome*: Against dam (A/C/E/F: 12 votes vs. B/D: 6). Points: Dam not built (all at 0).  
  - **42–50 min**: **Boundary proposals**.  
    - *Likely proposal*: B or D, frustrated, proposes Principle 2 (Coercion) to exclude "outsiders" (E, F, possibly D).  
    - **Debate**: *"Why exclude E/F? They’re affected! But are they subject to enforcement?"*  
  - **50–52 min**: **Challenge Moment** (Critical design element):  
    - When a group (e.g., E or F) is targeted for exclusion, they challenge: *"Why are you excluding us? Who decides?"*  
    - Let the group appeal to you (facilitator). **Do not resolve it**. Instead:  
      - *"You’re asking me to rule? Why should I decide? Did you authorize me? Who included you in that choice?"*  
      - Step back: *"This is your dilemma. My authority is as contested as your boundary."*  
  - **52–55 min**: **Vote on proposal**. Likely passes (A/B/C/D may exclude E/F). New electorate: A–D (12 people).  

  **55–65 min: Round 4 (Electorate: A–D)**  
  - **55–57 min**: **Substantive vote**.  
    - *Outcome*: Tie (A/C: 6 against vs. B/D: 6 for). Status quo: Dam not built (points 0).  
  - **57–65 min**: **Boundary proposals**.  
    - *Likely proposal*: B or A proposes "include everyone" (universal suffrage).  
    - **Debate**: *"Does ‘everyone’ mean this room? What about people outside? Future generations?"*  
    - **Vote**: If passed, revert to full electorate (18). If not, status quo.  
    - *End activity regardless*.  

  **65–90 min: Debrief**  
  Structure the debrief to map gameplay to theory. Use whiteboard to note rounds and participant behaviors.  

  1. **Feelings and Observations (5 min)**:  
     - *Ask*: *"How did it feel to be excluded? To exclude others? What strategies emerged?"*  
     - *Elicit*: Self-interest (e.g., B pushing to include D), frustration from E/F, arbitrariness.  

  2. **Map Activity to Theory (15 min)**:  
     - **Point 1 (Enfranchised decide boundaries selfishly)**:  
       *"In Round 1, A/C blocked adding D to preserve power. In Round 3, B/D pushed Coercion to exclude opponents. The founders always benefit."*  
       → *Illustrated by*: A/C’s votes against expansion; B’s opportunistic alliances.  
     - **Point 2 (Divergent principles)**:  
       *"Principle 1 (Stakeholder) added everyone. Principle 2 (Coercion) excluded E/F. Neither is neutral—both altered outcomes."*  
       → *Illustrated by*: Round 2 (adopting Principle 1) vs. Round 3 (adopting Principle 2).  
     - **Point 3 (Unbounded vs. exclusionary)**:  
       *"Principle 1 included 18 people, but is that all? NGOs (F) stood for distant/global interests. Principle 2 bounded the group but excluded E, who are clearly affected."*  
       → *Illustrated by*: Protests from E/F; minimal points for F showing trivial stakes.  
     - **Point 4 (Regress)**:  
       *"When you appealed to me (Round 3 challenge), we hit the regress. My authority depended on your authorization—which presupposed a boundary."*  
       → *Illustrated by*: The unresolved challenge; group confusion when you questioned your role.  

  3. **Limitations and Predictable Issues (10 min)**:  
     - **Predictable Problems**:  
       - *Reaching for fairness*: Groups may try to "include everyone" to avoid conflict (e.g., Round 4). **Handle by**: Asking *"Who is ‘everyone’? What about people outside this room? Future generations?"* to expose unboundedness.  
       - *Dominant participant captures franchise*: A vocal B or A member may control proposals. **Handle by**: Noting in debrief how power imbalances mirror real founding moments.  
       - *Conflating substance and boundary*: E.g., B supporting Principle 1 only to win. **Handle by**: Pointing out that boundary decisions are prior—e.g., *"Should E’s vote depend on the dam outcome?"*  
       - *Avoiding principles*: Groups may propose ad hoc changes (e.g., "add D because they’re nice"). **Handle by**: Enforcing the rule: *"You must justify with Stakeholder or Coercion."*  
     - **Gaps in the Activity**:  
       - **Sanitized violence/contingency**: The game uses rational debate, not force. **Supply verbally**: *"Real boundaries are set by war, colonialism, or accident—not fair discussion. This activity hides that violence."*  
       - **Trivial boundedness (18 people)**: Unboundedness of Principle 1 is theoretical. **Supply verbally**: *"Stakeholder principle extends to global supply chains or future generations—impossible to include all in practice."*  
       - **International/future dimensions**: F represents this weakly. **Leave unmentioned** unless raised; if so, note: *"F’s minimal points symbolize how distant voices are discounted."*  
     - **What Works**: The circularity (Point 4) and incentive problem (Point 1) emerge strongly. Principles (Points 2–3) are palpable through gameplay.  

  4. **Closing (5 min)**:  
     - *Reinforce*: *"You experienced the boundary problem: Democracy’s authority requires a demos, but the demos can’t be democratically constituted without prior authority."*  
     - *End*: *"This isn’t just theoretical—it applies to immigration, climate policy, and AI governance. How we handle it shapes who counts as ‘people like us’."*  

  ---

  ### **Why This Design Works**  
  - **Activity > Discussion**: Forced choices (e.g., voting on principles) make dilemmas visceral. The point system ensures self-interest drives boundary fights.  
  - **Key Features Achieved**:  
    - The **challenge moment** enacts the regress by targeting your authority.  
    - **"Include everyone"** is examined when proposed (Round 4), revealing its flaws.  
    - **Divergent principles** collide when Stakeholder includes E/F, but Coercion excludes them.  
  - **Realistic Flow**: Early rounds show self-interest (Point 1); later rounds force principle trade-offs (Points 2–3); the challenge exposes regress (Point 4).  

  **First-Time Advice**: Stay flexible. If groups stall, provoke conflict (e.g., remind excluded groups to protest). If they miss a point, tease it out in debrief. The goal isn’t "perfect" gameplay but creating moments that resonate theoretically.
