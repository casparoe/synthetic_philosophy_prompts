answer: |-
  Here are five requirements for a rational choice theory under ambiguity, derived from your cases:

  1.  **Distinguish Ambiguity from Risk:** The theory must generate different preferences for choices with known probabilities ("risk", e.g., Urn A: 30 Red, 60 Black) versus choices with unknown or indeterminate probabilities ("ambiguity", e.g., Urn B: 90 balls, 30 Red, ? Black). *Case: Ellsberg Paradox (Urn A vs Urn B). Breaks if dropped:* Without this, the theory collapses ambiguity back into risk, failing to explain the robust preference for betting on Urn A over Urn B despite identical known "red" probability, violating observed behavior.

  2.  **Handle Complete Ignorance:** The theory must accommodate situations where the decision-maker has no probabilistic information at all, not even a second-order distribution, and cannot form a unique prior (e.g., Urn C: Either all Red or all Black, no information on which). *Case: Extreme Ambiguity (All-Red/All-Black Urn). Breaks if dropped:* Theories requiring a unique prior (like Subjective Expected Utility) force an arbitrary 50/50 assignment here. This fails normatively (no basis for such a prior) and descriptively (people are typically *more* ambiguity-averse here than a 50/50 bet under risk).

  3.  **Ensure Coherence (Avoid Sure Loss):** The theory must preclude the possibility of a "Dutch Book" – a set of bets the decision-maker would accept individually but which collectively guarantee a loss. *Case: Foundational Normative Constraint. Breaks if dropped:* Without coherence, the theory prescribes choices vulnerable to exploitation, undermining its claim as a normative account of rationality. It becomes indefensible as a guide for consistent choice.

  4.  **Account for Context-Dependent Ambiguity Attitude:** The theory must allow ambiguity aversion/neutrality/seeking to depend on the domain (gain/loss), source (familiar weather vs. artificial RNG), or specific framing of the ambiguity, even holding "likelihood" constant. *Cases: Loss Reversal, Weather vs. RNG. Breaks if dropped:* Ignoring this forces a stable attitude (e.g., always averse) contradicted by evidence (dodging ambiguous gains but reaching for ambiguous losses, preferring weather despite equal likelihood). **This requirement rules out most popular single-model theories (MaxMin EU, α-MaxMin, Smooth Ambiguity)** by demanding more flexibility than their fixed functional forms allow.

  5.  **Resolve the Flexibility-Tractability Trade-off (Requires Sacrifice):** The theory must navigate the fundamental conflict between **(A)** *Normative Flexibility:* Capturing the nuances of rational judgment under severe uncertainty (Requirements 2 & 4), and **(B)** *Empirical Tractability:* Providing a model simple and constrained enough to be identified and fitted to real choice data by economists. *Case: All Cases, especially Extreme Ambiguity & Context-Dependence. Clash is inherent:* Requirement 2 pushes for models capturing ignorance (e.g., sets of priors), while Requirement 4 demands models sensitive to framing/source. Combining these often yields complex, multi-parameter models ("mess") hard to distinguish empirically. *Sacrifice:* Prioritize **Tractability (B)**. *Why:* Normative flexibility without empirical anchors risks unfalsifiable "just-so" stories. A theory economists *can't* use fails half its purpose. Simpler, identifiable models, even if they idealize or miss some nuances (e.g., assuming constant ambiguity aversion across domains), provide testable benchmarks and practical utility. The clash arises because rational judgment under deep uncertainty *is* inherently complex and context-sensitive, while empirical science requires simplification.
