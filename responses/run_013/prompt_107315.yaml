  The loss aversion reversal is important because it shows that ambiguity attitudes aren't stable; they flip based on framing. This challenges theories that assume a fixed attitude. Also, the requirement that rules out popular theories is likely the context-dependence one, as many models (like MaxMin or α-MaxMin) don't account for how loss domains affect preferences.

