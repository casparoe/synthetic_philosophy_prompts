prompt: |-
  ok so before I read any more theories of rational choice under ambiguity I want the actual spec first — what does a theory in this area have to do to count as any good? Assume it's meant to be both a defensible normative account of what it's rational to prefer and something an economist could actually fit to real choices; it doesn't have to reduce everything to one number, it just can't be a mess. You're a decision theorist who's spent too long staring at urn cases, so think it through carefully before you commit. Here's the pile of stuff I keep trippng over, build on it or tell me what I'm missing: the urn where you know the mix vs the urn where you only know there are 90 balls and 30 are red; a variant where you're told the mystery urn is either all-red or all-black and nothing else; a coin everybody agrees is fair vs a coin whose fairness nobody has ever checked; someone who dodges the ambiguous bet when it's a gain but reaches for it when the same bet is recast as a loss; and my own case, where I'd rather bet on tomorrow's weather than on a random number generator even when I'd say they're equally likely.

  Give it back to me as exactly five numbered requirements, each one a sentence or two, no intro and no wrap-up. For each: state the requirement, name the case or consideration that forces it, and don't just assert it's needed — say what breaks if you drop it. I especially want one of the five to be the pair of requirements you think can't both be had, with which one you'd sacrifice and why the clash is a real feature of the problem and not an artifact of how someone set it up, and somewhere in there tell me which single requirement does the most to rule out the popular theories. Skip the citations, I've got the papers.
