  Names matter. "Ava" for the chronic pain user feels relatable. "Dr. Aris Thorne" for the engineer—slightly academic but not pretentious. The assistant should feel slick and corporate, maybe "MediGuide Prime" with a soothing voice named "Serena."

  Key scene beats: 
