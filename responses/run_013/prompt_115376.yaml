answer: |-
  ### Teaching Plan: "The Inviolate Level" in Tangled Hierarchies  
  **Core Goal:** Students grasp that tangled hierarchies *require* a non-tangled, mechanical foundation ("inviolate level") enabling the tangle without participating in it.  

  ---

  ### Brainstormed Candidate Examples  
  1. **Escher’s *Drawing Hands***:  
     - Pros: Visually intuitive, directly from GEB, shows mutual creation.  
     - Cons: "Pretty" distraction; risks "real world" misconception (paper/artist as inviolate).  
  2. **Quine (self-replicating code)**:  
     - Pros: Mechanically explicit; inviolate level (interpreter/language) is undeniable; bridges CS/lit (code as "text").  
     - Cons: Requires minimal coding literacy; may feel "cold" to lit/phil students.  
  3. **The Liar Paradox ("This sentence is false")**:  
     - Pros: Simple, familiar; exposes self-reference.  
     - Cons: Misleads by implying contradiction is necessary; no clear inviolate level.  
  4. **Gödel’s Incompleteness (simplified)**:  
     - Pros: Authentic to GEB; arithmetic as inviolate.  
     - Cons: Too technical for 75 min; risks derailing into logic.  

  **Selected Carrying Example: Quine**  
  **Why?**  
  - **Concrete & Unambiguous**: Code runs on an interpreter—students *see* the inviolate level (language rules) as boring infrastructure.  
  - **Prevents Misconceptions**: No "real world" metaphor (unlike Escher); no contradiction (unlike Liar); inviolate level is *functional*, not mystical.  
  - **Cross-Disciplinary Hook**: Lit students see "text generating text," CS sees execution, Phil sees hierarchy.  
  - **Lacks Art’s Baggage**: Avoids debates about Escher’s intent or "real paper."  

  ---

  ### Session Structure (75 Min Total)  
  #### Phase 1: Ground "Hierarchy" (15 Min)  
  - **Why First?** Hierarchy must be intuitive before "tangling" means anything.  
  - **Activity**: Define hierarchy as *levels with rules* (e.g., chess: pieces → board → rules). Ask: *"What happens if a pawn changed the rules? Could it?"* → Rules are "above" pieces.  
  - **Prevent Misconceptions**: Stress hierarchies are *relational* (not spatial). Avoid "real world" by using abstract examples (e.g., grammar: words → syntax → grammar rules).  

  #### Phase 2: Introduce "Tangle" via Self-Reference (20 Min)  
  - **Why Here?** Self-reference creates the tangle, but students need to *feel* the paradox before resolving it.  
  - **Activity**:  
    1. Show a quine in Python (e.g., `s='s=%r;print(s%%s)';print(s%s)`). Run it → it prints itself.  
    2. Ask: *"What ‘creates’ what here? Does the code depend on itself?"* → Highlight loop.  
  - **Prevent Misconceptions**:  
    - **Tangle ≠ Contradiction**: Quines *work*; they’re consistent, not paradoxical. Contrast with Liar Paradox (which *is* contradictory).  
    - **Self-Reference ≠ Magic**: It’s mechanical: the code uses string formatting to replicate.  

  #### Phase 3: Reveal the Inviolate Level (30 Min)  
  - **Why as a Surprise?** Let them struggle with the tangle first ("How is this possible?!"), then reveal the foundation.  
  - **Activity**:  
    1. Break down the quine:  
       - Level 1: **Code as text** (static characters).  
       - Level 2: **Execution** (interpreter reads text, outputs text).  
    2. Ask: *"When the code prints itself, is the interpreter *in* the code? Can the code alter the interpreter?"* → No! Interpreter is *used* but untouched.  
    3. **Key Insight**: The tangle (self-printing) works *because* the interpreter (inviolate level) operates predictably outside the loop.  
  - **Prevent Misconceptions**:  
    - **Not "Real World"**: Interpreter isn’t "the author"—it’s part of the system (e.g., Python installed on machine).  
    - **Not Mysterious**: It’s boring: interpreters follow fixed rules. Quines exploit this.  
    - **Not an "Extra"**: Stress it’s *always there* in hierarchies—like grammar enabling self-referential sentences.  

  #### Phase 4: Consolidate & Diagnose (10 Min)  
  - **Activity**: Compare to Escher. *"Drawing Hands: Where’s the inviolate level? (Not the paper! It’s Escher’s *rules* for perspective.) Why is this less clear than the quine?"*  
  - **Diagnostic Question**:  
    *"If we hack the quine to also delete all files on the computer, would the Python interpreter be affected? Why?"*  
    **Why This?** Tests if they see the inviolate level as *causally insulated* (interpreter runs the deletion but isn’t altered by it).  

  ---

  ### What to Refuse Covering  
  - **Gödel’s Proof Details**: No arithmetization, no diagonal lemma.  
  - **Consciousness/AI analogies**: Hofstadter’s "strange loop" debates.  
  - **Other Tangles**: Skip DNA, recursion, or music unless students raise them.  

  ---

  ### Settled vs. Contested  
  - **Settled**:  
    - Self-reference requires a consistent foundation (e.g., quines need a working interpreter; Gödel needed consistent arithmetic).  
    - Hierarchies collapse without a higher-level "metalanguage" (Tarski’s undefinability).  
  - **Contested**:  
    - **Hofstadter’s Framing**: Logicians rarely say "inviolate level"—they say "metatheory" or "metalanguage." His claim that *every* tangle has one is philosophical, not technical.  
    - **Ambiguity**: In some systems (e.g., quantum physics), "levels" may blur. Hofstadter oversimplifies by implying a strict pyramid.  
    - **Consensus**: Yes, tangles rely on a consistent base—but calling it "inviolate" is GEB-specific poetry.  

  ---

  \answer{Quine}
