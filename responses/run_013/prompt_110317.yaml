prompt: |-
  I am a doctoral student in the philosophy of economics, seconded one day a week to the research office of a mid-sized foundation, where I sit in on the monthly continuation reviews at which funded programmes are kept, cut, or escalated. Both the 'we have already put £2m into this' argument and my colleagues' reflex to dismiss it are being applied without any discipline, and I would like a procedure the programme managers could actually run. The standard view to operationalise is that past expenditure should be ignored because it is common to every option still open; but I do not think that is the whole story, and I want the procedure to preserve three uses of past spending that I take to be legitimate: evidential (earlier spending as a proxy for how many independent reviewers judged the project sound), strategic (a funder's known reluctance to abandon ship is itself a commitment that changes what grantees do), and self-binding (having paid upfront is what makes people turn up). Give me the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it must hand the decision to the panel because the question is one of values rather than facts; mark the points where a judgement call is dressed up as procedure. It has to fit on one side of A4, be runnable in fifteen minutes by someone who has never heard of the fallacy, and be signed off by the finance director. Run it on three cases -- a vaccine trial with a null interim result and half its budget spent, a half-built data platform, and a training programme paid for upfront whose main effect is that payment makes participants attend -- and tell me what the procedure cannot do and where it will misfire.
reasoning: |-
  We are designing a decision procedure for programme continuation reviews that avoids the sunk cost fallacy but preserves legitimate uses of past spending. The procedure must be concise, runnable in 15 minutes by a non-specialist, and fit on one page of A4.

  Key legitimate uses of past spending:
  1. Evidential: Past spending as a proxy for independent review and initial confidence.
  2. Strategic: The funder's reputation for commitment affecting grantee behavior.
  3. Self-binding: Upfront payment ensuring participant attendance.

  The standard view is that sunk costs should be ignored because they are common to all future options. However, we incorporate the above.

  The procedure will be a series of questions. We stop with a "no" (i.e., discontinue) if at any point the answer is negative and the question is a stopping rule. Some questions are factual and others are value-based; for value-based, we hand over to the panel.

  We also note where a judgment call is dressed as procedure.

  ---

  **Procedure: Programme Continuation Review**

  **Step 1: Initial Viability Check**
     - *Question:* "Ignoring all past spending, does the programme currently show sufficient promise (based on its own merits and current information) to justify the *remaining* required investment for completion?"
     - *Sufficient Answer:* Evidence of progress, interim results, or a strong case for future impact that meets our funding criteria for new projects.
     - *If No:* Discontinue. (This step avoids the sunk cost fallacy by focusing on future costs and benefits.)
     - *If Yes:* Proceed to Step 2.
     - *Note:* This step may require judgment but is framed as a factual assessment of current viability.

  **Step 2: Evidential Value of Past Commitment**
     - *Question:* "Does the fact that we have already invested in this project provide evidence of its quality (e.g., because it passed multiple independent reviews at the outset) that is still relevant today?"
     - *Sufficient Answer:* Yes, if the initial review process was robust and the project's fundamentals (goals, methods, team) haven't changed. No, if there have been material changes (e.g., new negative information, change in team, or shift in context) that invalidate the initial assessment.
     - *If No:* Proceed to Step 3 (but note: if the initial evidence is invalidated, it weakens the case).
     - *If Yes:* This strengthens the case for continuation and we proceed to Step 3.
     - *Note:* This step is a judgment call about the relevance of past reviews.

  **Step 3: Strategic Commitment and Grantee Behavior**
     - *Question:* "Would discontinuing this project at this stage significantly harm our foundation's reputation for commitment, thereby reducing the willingness of future grantees to undertake high-risk/high-reward projects or make upfront investments?"
     - *Sufficient Answer:* Evidence from past experience or field knowledge that our reputation for seeing projects through is important and that discontinuation would cause material harm. If we rarely discontinue and the case is high-profile, the harm might be greater.
     - *If No:* Proceed to Step 4.
     - *If Yes:* This is a strong argument for continuation and we proceed to Step 4, but note that the panel must weigh this against the costs.
     - *Note:* This step requires judgment about the foundation's strategic position and is partly value-based (what kind of funder we want to be). If the answer is yes, we note the strategic risk but do not stop. We proceed and then hand the strategic consideration to the panel at Step 5.

  **Step 4: Self-Binding Mechanism**
     - *Question:* "Is the past spending critical to the participation or performance of the grantees? Specifically, would the upfront payment (or the fact that we have already spent) cause the participants to engage more seriously (e.g., by attending, contributing effort) than if we paid upon completion?"
     - *Sufficient Answer:* Evidence that the payment structure is designed to secure commitment (e.g., non-refundable deposits, sunk costs by participants) and that without it, the programme would not function.
     - *If No:* Proceed to Step 5.
     - *If Yes:* This factor supports continuation and we proceed to Step 5.

  **Step 5: Panel Decision**
     - *Question:* We have now gathered the factual and contextual information. The decision must now be made by the panel because it involves weighing the strategic, reputational, and self-binding factors against the cost and the project's current prospects.
     - *Handover:* The panel must decide based on:
          a) The project's current viability and expected future benefits (Step 1).
          b) The strength of the initial evidence (Step 2).
          c) The strategic implications (Step 3).
          d) The self-binding mechanism (Step 4).
          e) The remaining budget required and opportunity cost (i.e., what else we could do with the money).
     - *Note:* This step explicitly involves values and trade-offs.

  ---

  **Applying the Procedure to Three Cases**

  **Case 1: Vaccine Trial**
     - *Background:* Null interim result, half budget spent.
     - *Step 1:* Does the vaccine trial, ignoring the £X already spent, justify the remaining £Y? Given the null result, the future prospects are weak. If the trial design allows for late effects or the null is not definitive, it might pass. But typically, a null result reduces promise. *Likely No -> Discontinue.*
     - If Step 1 is borderline, we proceed.
     - *Step 2:* The past spending was based on strong initial reviews. But the null result is new evidence that may invalidate the initial promise. *Likely No* (or weak) for evidential value.
     - *Step 3:* Discontinuing a vaccine trial might harm reputation? Only if it's high-profile and we are known for sticking with projects even when they fail. *Likely No* because scientific trials are expected to stop for futility.
     - *Step 4:* Past spending doesn't bind participants (researchers) in a way that affects attendance. *No*.
     - *Step 5:* If we reached here, the panel would weigh the factors. But with Step 1 likely negative, we stop and discontinue.

  **Case 2: Half-Built Data Platform**
     - *Background:* Half built, half budget spent.
     - *Step 1:* Ignoring past spending, does the platform justify the remaining cost? We must assess: will it be useful when completed? Are there users? If the remaining cost is high and the benefits are unclear, it might fail. But if it's near completion and has high potential, it passes. *Likely Yes* (if the foundation still needs the platform and it's on track).
     - *Step 2:* Initial reviews were strong? If the project was well-vetted, then yes. But if the context has changed (e.g., new technology supersedes it), then no. *Likely Yes* if no major changes.
     - *Step 3:* Abandoning a half-built platform might make future grantees wary about starting large projects with us. *Yes*, especially if we are known for building infrastructure.
     - *Step 4:* The past spending doesn't directly bind participants (unless the platform is for internal use and staff have already adjusted workflows). *Likely No*.
     - *Step 5:* Panel decision. Factors: strong Step 1 and 2, strong strategic reason (Step 3) to continue. But they must weigh the remaining cost against other opportunities.

  **Case 3: Training Programme Paid Upfront**
     - *Background:* Paid upfront, main effect is that payment makes participants attend.
     - *Step 1:* Ignoring past spending, does the programme justify the remaining costs? Since it's paid upfront, the remaining cost might be low (e.g., just running the sessions). Also, the programme might be effective. *Likely Yes* (if the training is valuable and the remaining costs are just the delivery).
     - *Step 2:* Initial reviews were likely strong. *Yes*.
     - *Step 3:* Discontinuing might harm reputation? Probably not significantly, unless it's a well-known programme. *Likely No*.
     - *Step 4:* The upfront payment is critical because it binds participants (they attend because they know the funder has paid). *Yes*.
     - *Step 5:* Panel decision. Factors: Step 1 (yes), Step 2 (yes), Step 4 (strong self-binding). They might continue because the remaining costs are low and the upfront payment has already secured attendance.

  ---

  **What the Procedure Cannot Do and Where It Will Misfire**

  1. **Quantification:** It doesn't assign numerical weights to factors (e.g., how much reputational harm). This is left to panel judgment.
  2. **Changing Circumstances:** If external factors change dramatically after the review, the procedure cannot account for that until the next review.
  3. **Opportunity Cost:** The procedure does not explicitly compare the project with alternative uses of funds until Step 5 (panel). This might lead to suboptimal allocation if the panel doesn't rigorously consider alternatives.
  4. **Misfires:**
     - *Step 1 might be too harsh:* In some cases, a project might have a temporary setback but still be viable. The requirement for "sufficient promise" might be interpreted too strictly.
     - *Step 3 (Strategic) might be overused:* Programme managers might overstate reputational harm to save their project.
     - *Step 4 (Self-binding) might be misapplied:* Not every upfront payment is critical. The question requires evidence of the mechanism.
     - *Panel Step (5) might be biased:* Without clear criteria, the panel might fall back on sunk costs.

  **Sign-off:** The Finance Director might appreciate the clear initial step (ignore sunk costs) and the structured way of capturing legitimate factors.

  This procedure fits on one side of A4 and can be run in 15 minutes by a non-expert.
answer: |-
  Below is a decision procedure for programme continuation reviews, designed to avoid the sunk cost fallacy while preserving legitimate uses of past spending. It fits on one A4 page, takes ≤15 minutes, and requires no prior knowledge of the fallacy. **Bolded text** highlights critical instructions. Judgment calls disguised as procedure are marked with ⚠️.  
  The procedure stops with a "no" (discontinue) only at Step 1. Other steps inform the panel's final decision. Values-based questions are handed to the panel at Step 5.  

  ---

  ### **Programme Continuation Decision Procedure**  
  *Approved by Finance Director: [Signature/Date]*  

  **Step 1: Future Viability Check**  
     - *Question:* "Ignoring all past spending, does the programme justify the **remaining** costs to complete it? Assess based on current evidence (e.g., interim results, participant engagement, market changes)."  
     - *Sufficient Answer:* Concrete proof of progress (e.g., data, milestones met) AND alignment with foundation goals. *Example:* Vaccine trial shows plausible path to success despite null interim result.  
     - ⚠️ *Judgment call disguised as procedure:* "Sufficient proof" requires panellist discretion.  
     - **If No → Discontinue**. *Stop here.*  
     - **If Yes → Proceed to Step 2**.  

  **Step 2: Evidential Value of Past Spending**  
     - *Question:* "Does the past investment indicate robust prior validation? (e.g., Was it heavily reviewed? Have core assumptions changed?)"  
     - *Sufficient Answer:* Documentation of ≥2 independent approvals AND no material changes to the project’s fundamentals (team, design, context).  
     - *If No → Proceed to Step 3* (weakens case but doesn’t stop).  
     - *If Yes → Proceed to Step 3* (strengthens case).  

  **Step 3: Strategic Reputation Risk**  
     - *Question:* "Would stopping now significantly damage our foundation’s reputation for commitment, deterring future high-impact grantees?"  
     - *Sufficient Answer:* Evidence from past incidents (e.g., grantee feedback) OR high-project visibility (e.g., media, sector partnerships).  
     - ⚠️ *Judgment call:* "Significant damage" is subjective.  
     - *Answer informs panel → Proceed to Step 4*.  

  **Step 4: Self-Binding Mechanism Check**  
     - *Question:* "Is past spending critical to **current** participation? (e.g., Would grantees/participants disengage if funds were clawed back?)"  
     - *Sufficient Answer:* Proof of behavioural reliance (e.g., contracts requiring upfront payment, surveys showing attendance dependency).  
     - *Answer informs panel → Proceed to Step 5*.  

  **Step 5: Panel Decision**  
     - *Handover Question:* "Weigh all factors: Future viability (Step 1), evidential strength (Step 2), reputation risk (Step 3), and self-binding (Step 4). Does continuing best serve the foundation’s mission **and** financial efficiency?"  
     - *Values-based:* No fixed criteria. Panel debates trade-offs (e.g., "Reputation vs. opportunity cost").  
     - **Panel votes → Continue, Escalate, or Discontinue**.  

  ---

  ### **Application to Cases**  
  **Case 1: Vaccine Trial (Null result, 50% spent)**  
  - *Step 1:* "No" (null result suggests low future promise) → **Discontinue**.  
  - *Why procedure works:* Avoids "we spent £2m" fallacy. Ignores sunk costs.  
  - *Misfire risk:* If trial has high strategic value (e.g., pandemic response), panel can override at Step 5.  

  **Case 2: Half-Built Data Platform**  
  - *Step 1:* "Yes" (completion adds value; e.g., users waiting).  
  - *Step 2:* "Yes" (if initially reviewed by tech experts).  
  - *Step 3:* "Yes" (if high-visibility project; stopping deters partners).  
  - *Step 4:* "No" (builders paid hourly; no behavioural reliance).  
  - *Step 5:* Panel likely continues (viability + reputation > costs).  

  **Case 3: Training Programme (Upfront payment drives attendance)**  
  - *Step 1:* "Yes" (low remaining costs; sessions running well).  
  - *Step 2:* "Yes" (if education experts approved design).  
  - *Step 3:* "No" (low visibility; few strategic risks).  
  - *Step 4:* "Yes" (evidence: participants attend only due to sunk costs).  
  - *Step 5:* Panel continues (self-binding + viability matter most).  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Quantify soft factors**: Reputation risk (Step 3) and self-binding (Step 4) rely on qualitative evidence. Misfires if evidence is weak (e.g., anecdotal claims).  
  2. **Handle external shocks**: E.g., if a funded tech becomes obsolete post-Step 1, panel must reconvene.  
  3. **Replace opportunity cost analysis**: Step 5 asks panels to weigh trade-offs but doesn’t require comparing alternatives. Risk: undervaluing better projects.  
  4. **Resolve biased judgments**: ⚠️ Steps 1 and 3 are vulnerable to optimism (e.g., overestimating vaccine viability) or exaggeration (e.g., inflating reputation risks).  

  ### **Where It Misfires**  
  - **Overly rigid projects**: E.g., a programme with high sunk costs but no self-binding (Step 4 fails) may be cut, even if termination fees apply.  
  - **"Blame avoidance" panels**: Step 5 could encourage continuing weak projects to avoid reputational fallout (Step 3), despite Step 1.  
  - **Fast-changing contexts**: E.g., a data platform may become redundant between reviews; procedure won’t catch this mid-cycle.  

  ---  
  **Final note**: This procedure forces discipline by starting with future viability (Step 1) but allows human judgment where values dominate (Step 5). Finance Director approval hinges on Step 1’s "stop now" rule, which protects against sunk cost bias.
