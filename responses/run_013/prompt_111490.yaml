prompt: |-
  Set out the desiderata for a theory of non-informative credence. I am convening a small reading group on the foundations of prior selection, and I want the session to begin from a specification rather than from a menu of proposals, because the standard proposals — classical indifference, invariance under a group of transformations, maximum entropy, and the imprecise-probability family — are almost always defended and attacked one at a time, and nobody in the room seems to have written down what the whole class of them is being asked to do. So: what must any account deliver in order to count as an adequate theory of how a rational agent should distribute credence when the only thing fixed is a space of possibilities, together with whatever symmetry, or absence of symmetry, the agent's description of the situation happens to supply?

  For each requirement, give me the case or the consideration that motivates it, and be explicit about whether you take it to be non-negotiable or a preference of one camp. I expect the list to cover at least the following kinds of items, though I do not want it confined to them: the simple cases it must get right, where the symmetry is uncontroversial and the answer is beyond dispute; the classical puzzles it must either dissolve or, failing that, reframe in a way that explains why the puzzle has no determinate answer; the distinctions it must not collapse, such as that between the agent's ignorance and the world's indeterminacy, between a single permissible credence and a set of permissible ones, between a prior offered as a convenience on the way to a posterior and a prior claimed to be rationally obligatory, and between a reparameterization that exposes a defect in the theory and one that merely reflects a genuine gap in what the agent knows; and the formal results it must be consistent with, including the ordinary probability axioms, the behaviour of additivity on infinite and on non-denumerable spaces, conditionalization, and whatever coherence constraints you think it inherits from decision theory. I would also like its verdict on a less obvious matter: whether an agent can end up with a less settled credence than before by acquiring information that is logically independent of the quantity in question.

  The part I most want is the incompatibility. Some of these requirements, I suspect, cannot be jointly satisfied, and an honest statement of that is worth more to me than a longer list. Take the demand that the theory return a unique answer in every case in which the agent genuinely lacks information, and set it against the demand that the answer not depend on which of several equally faithful descriptions of the same situation the agent happens to have used. Say what has to be given up, and say whether the usual way of keeping both — supplying the agent with a symmetry or a constraint that, by hypothesis, they do not have — is a solution or a change of subject. Then tell me which single requirement on your list does the most work in excluding candidates, and which one you suspect is really a prejudice of one camp dressed up as a criterion.

  I have one case of my own that the list has to say something about, and it is the reason I am asking. An agent knows only that an unknown positive quantity lies between 1 and 100, and that is the whole of what they know: no group structure, no natural measure, no physical symmetry, no repeated trials. The agent is asked for a credence that the quantity exceeds 50. Everything the agent knows can be stated just as faithfully in terms of the quantity itself as in terms of its reciprocal or its logarithm, and each of those descriptions is equally compatible with the agent's total information, so a principle that assigns credence by symmetry over the described space will return three different answers, while a principle that declines to choose will return none. I want your list to render a verdict here: either a determinate credence, together with the requirement that delivers it, or a principled reason why no determinate credence is available, together with a statement of what that does to the claim that a theory of this kind is a theory of rationality rather than a toolbox. If your requirements cannot jointly handle the case, say so plainly; that result is more useful to me than a list that quietly steers around it.

  You may close with a short, unsystematic comparison of how the four families I named fare against your list, but keep it brief — the criteria are what I want from you, not the scorecard.

  Write this as continuous prose. No headings, no bullet points, no numbered lists set out as lists, no bold, and no tables; you may number the requirements in running sentences if that helps, but I want something I can read the way I would read a letter.
reasoning: |-
  Okay, let me think through how to approach this request for desiderata for a theory of non-informative credence. The user is convening a reading group and wants to start from first principles rather than comparing existing proposals. 

  The core challenge here is to articulate what any adequate theory must deliver when the only fixed elements are a possibility space and whatever symmetries the agent's description provides. I need to consider several dimensions: basic cases it must handle correctly, classical paradoxes it should resolve, key distinctions it must preserve, formal constraints it must satisfy, and how it deals with the reciprocal/logarithm reparameterization problem the user described.

  For the basic cases, I should include requirements like unique correct answers in symmetric scenarios (e.g., fair coin) and consistency across equivalent descriptions. The Bertrand paradox shows why these can conflict. The distinction between ignorance and indeterminacy seems crucial - the theory shouldn't conflate epistemic uncertainty with ontological chance.

  Formal constraints must include probabilistic coherence, but also handle infinite spaces carefully since additivity behaves differently there. The user's quantity estimation case (1 to 100) is particularly important - any theory must either give a determinate credence for exceeding 50 or explain why it can't, without privileging one parameterization.

  I suspect some requirements will conflict, especially uniqueness versus description-invariance. The reciprocal example demonstrates this: uniform over x, 1/x or log x give different answers. Most theories solve this by imposing additional structure, but that might beg the question. The key tension is between requiring definite guidance and respecting how symmetries appear in different descriptions.

  For the quantity case specifically, I think the honest answer is that no determinate credence follows from the given information alone. This suggests non-informative priors aren't uniquely determined by rationality, though they remain useful tools when supplemented with pragmatic choices. The theory then functions more as a rationality framework than an oracle.

  Comparing major approaches briefly: Indifference principles fail the reparameterization test; group invariance requires privileged symmetries; maximum entropy needs constraints; imprecise probability avoids uniqueness but struggles with decision-making. All face tensions between the desiderata.
answer: |-
  Any theory of non-informative credence, aiming to guide rational agents when only a possibility space and its inherent symmetries (or lack thereof) are given by the agent's description, must satisfy several interconnected, and often competing, desiderata. These arise from foundational intuitions, practical necessities, formal constraints, and notorious historical failures. No theory satisfies all perfectly; the tensions reveal deep choices about rationality itself.

  First, and non-negotiably, the theory must respect the axioms of probability. Credences must be coherent to avoid sure-loss contracts; they must sum to unity over mutually exclusive and exhaustive possibilities and satisfy finite additivity at minimum. While extensions to infinite spaces and countable additivity are contentious, the theory must explicitly address how it handles measure on non-denumerable spaces and infinite partitions, as failures here lead to paradoxes like the St. Petersburg game or difficulties defining uniformity over the real line. Conditionalization must be respected for updating; a non-informative prior is only a starting point, and its interaction with evidence must preserve coherence.

  Second, the theory must correctly resolve *uncontroversially symmetric* finite cases. If an agent knows only that a coin is symmetric in all relevant physical respects, the credence for heads must be 1/2. Similarly, for a fair die with six symmetric faces, each face must receive credence 1/6. Failure here is disqualifying; these are bedrock intuitions about symmetry and indifference. This requirement motivates the core appeal of principles like Laplace’s original Principle of Insufficient Reason.

  Third, it must navigate or dissolve the *classical paradoxes* arising from naive indifference, most famously Bertrand’s paradox and its variants. When multiple parameterizations of the same underlying ignorance seem equally natural (like chord length vs. angle vs. radial distance for a random chord in a circle), yielding contradictory uniform distributions, the theory must either provide a unique, consistent answer by privileging a specific structure, or explain why no unique answer exists and what determines the range of permissible credences. Simply dismissing the paradox as ill-posed without principled grounds is inadequate. This directly confronts the case you present: the quantity *x* between 1 and 100, its reciprocal *y=1/x* (also between 1/100 and 1), and its logarithm *z=log(x)* (between 0 and log(100)). Uniformity over *x*, *y*, or *z* yields different credences for *x>50* (roughly 1/2, ~1/100, and ~0, respectively). The theory *must* address this case explicitly.

  Fourth, the theory must rigorously maintain crucial distinctions. It cannot collapse the *agent’s ignorance* (epistemic uncertainty about a determinate state) with the *world’s indeterminacy* (ontic chance). A uniform prior over a die face due to ignorance differs fundamentally from a propensity of 1/6 inherent in the die. Relatedly, it must clarify the status of the prior: is it offered as a *pragmatic default* for updating within a Bayesian framework, or claimed as *rationally obligatory* based solely on the state of ignorance? Furthermore, it must distinguish between a *unique permissible credence* and a *set of permissible credences* (e.g., via imprecise probability). Finally, it must differentiate a *reparameterization that exposes a genuine defect* in the proposed credence assignment (like Bertrand’s paradox) from one that merely reflects *equivalent descriptions of the same ignorance state* without implying inconsistency. The reciprocal/logarithm case for your quantity hinges on this distinction.

  Fifth, the theory must be *consistent with decision-theoretic coherence*. If credences guide action, they must integrate with a theory of rational choice under uncertainty. This might constrain the permissible *forms* of credence (e.g., requiring precise probabilities for standard expected utility) or demand that imprecise credences still avoid sure loss according to generalized decision rules.

  A sixth requirement, more contested but deeply intuitive for some, is that the theory should provide *determinate guidance* wherever genuine ignorance exists. Rational agents shouldn’t be paralyzed; the theory should specify *a* credence (or set thereof) based *only* on the described possibility space and symmetries. Opposing this is the seventh requirement: *description-invariance*. The recommended credence should depend only on the underlying *state of ignorance*, not on the particular *mathematical description* chosen to represent it, provided all descriptions faithfully encode the same information. Your quantity case is the starkest challenge: using *x*, *1/x*, or *log(x)* are equally faithful descriptions of "a positive quantity between 1 and 100". Description-invariance demands the same credence regardless; determinacy demands a specific credence. These requirements are fundamentally incompatible in the absence of a privileged parameterization, as your case proves. No unique, description-invariant credence exists for "x > 50" given only the interval.

  The usual "solution" – positing a symmetry or natural measure (like uniformity over *x*, or Jeffreys prior for scale parameters) that the agent’s description *lacks* – is a change of subject. It imports *additional* structure (e.g., a specific group invariance like translation or scale) not present in the agent's stated knowledge ("lies between 1 and 100"). This solves the problem by *removing* the state of pure ignorance; it imposes an external constraint. While often pragmatically necessary, it undermines the claim to capture rationality based *only* on the agent's description. The requirement doing the most work in excluding candidates is likely description-invariance. It immediately invalidates simple indifference principles based solely on the described variable and exposes the need for additional structure in group invariance or maximum entropy (which require specific constraints or metrics). The demand for determinate guidance in all cases of ignorance, conversely, might be a prejudice favoring unique answers, potentially dismissed by imprecise probability advocates who see indeterminacy as the correct response.

  Regarding acquiring information leading to less settled credence: a theory *must* allow this. If logical independence is interpreted strictly (e.g., learning the color of a ball drawn from an urn tells you nothing about tomorrow's weather), then conditioning on such evidence shouldn't change credences about the weather. However, if "logically independent" means probabilistically independent *under the current prior*, then conditioning won't change the prior credence. But crucially, learning information that reveals deep *ambiguity* or *conflicting symmetries* previously unnoticed could lead an agent using imprecise credences to *widen* their set of permissible probabilities, representing increased uncertainty. A precise theory cannot model this increase in uncertainty directly; it would manifest as a shift to a different, perhaps less peaked, precise distribution. The requirement here is simply that the theory can coherently model scenarios where new evidence, without contradicting old beliefs, rationally leads the agent to feel *less certain*.

  For your core case: the desiderata jointly compel the conclusion that *no determinate credence* is rationally obligatory for "x > 50" given only that x ∈ [1, 100]. Description-invariance clashes fatally with determinacy, as the three natural parameterizations yield incompatible unique answers. No symmetry inherent in the agent's sparse description (just a bounded interval) privileges one parameterization over another. Therefore, the theory *cannot* deliver a unique answer without importing unjustified structure. An imprecise theory might return the *set* of credences compatible with all faithful descriptions (a wide interval), while a pragmatic theory might advocate choosing a conventional parameterization (like uniformity) as a useful tool, explicitly denying its unique rational status. This result challenges the notion of a purely rational, informationless prior. It suggests such a theory functions less as an oracle delivering *the* rational credence from ignorance alone, and more as a framework for managing ignorance within a coherent system, often requiring pragmatic conventions or additional structural assumptions for application. The rationality lies in the coherence and the explicit recognition of the conventions used, not in the unique derivation of the prior from nothing.

  Briefly comparing families: Classical Indifference fails description-invariance catastrophically (Bertrand, your case). Group Invariance (e.g., Jaynes) imposes structure (a privileged transformation group) not always present in the agent's description, solving uniqueness but changing the subject. Maximum Entropy requires constraints; with only an interval, it fails or defaults to uniformity (failing description-invariance). Imprecise Probability avoids uniqueness and handles description-dependence by allowing sets, but struggles with decision-making and updating coherence. All grapple with the fundamental tension between determinacy and invariance exposed by your interval case.
