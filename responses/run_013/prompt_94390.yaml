    - *Missing question:* "Must the kernel resemble the story’s plot?" (Yes → Minimalist; No → Contextualist).

  ---

  ### **Application to Cases**
  - **Trojan War:**  
    Naturally **CONTEXTUALIST** (reflects Bronze Age collapses). Strains tree if used for specific events (e.g., "Hissarlik = Troy" → EUHEMERIST).  
  - **King Arthur:**  
    Naturally **MYTHICIST** (legendary hero, not historical). Strains tree if framed as "Roman Britain’s decline" → CONTEXTUALIST.  
  - **Exodus:**  
    Naturally **MINIMALIST** (no archaeological evidence). Strains tree if seen as "Babylonian exile trauma" → CONTEXTUALIST or DEFLATIONIST.

  ---

  ### **Tree Summary**
  - **EUHEMERIST:** Finds specific events in myths.  
  - **MINIMALIST:** Demands physical proof; rejects text as evidence.  
  - **CONTEXTUALIST:** Sees stories as reflections of social eras.  
  - **MYTHICIST:** Historicity is a misunderstanding of myth.  
  - **DEFLATIONIST:** Historicity distracts from meaning.  

