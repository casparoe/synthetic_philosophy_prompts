  Below is a decision tree for your historicity unit, designed to help students navigate methodological and metaphysical questions without prior knowledge. The tree starts from the common ground you specified (texts written long after events, contain non-historical elements) and branches through key questions that define scholarly positions. Each leaf includes a named position and its "most awkward commitment." Combinations the tree can't reach, unresolved positions, and case-specific notes are included.

  ---

  ### **Historicity Decision Tree**
  **Start:** *The text (e.g., Iliad, Arthurian legends, Exodus) was written long after the events it describes and contains non-historical elements (gods, monsters, miracles).*

  #### **Question 1: Is the tradition’s claim to be "history" testimony about the past, or a symptom of cultural/psychological needs?**
  - **A. Testimony** (The claim has value as a potential record, even if distorted).  
    → Go to Question 2.  
  - **B. Symptom** (The claim reflects later beliefs, not historical transmission).  
    → Go to Question 3.

  #### **Question 2 (If testimony): Where does the burden of proof lie?**
  - **A. On the skeptic** (We assume some truth until disproven).  
    → Go to Question 4.  
  - **B. On the story** (We assume fiction until proven otherwise).  
    → **Leaf: MINIMALIST**  
    *Most awkward commitment:* Oral traditions cannot preserve any historical truth over centuries, even if they claim to.

  #### **Question 3 (If symptom): Can we still ask if a real event inspired the story?**
  - **A. Yes** (The story might indirectly reflect reality).  
    → Go to Question 5.  
  - **B. No** (Historicity is irrelevant or misleading).  
    → Go to Question 6.

  #### **Question 4 (If testimony + burden on skeptic): What is the "kernel" of truth?**
  - **A. A specific event/person** (e.g., a battle, a leader).  
    → **Leaf: EUHEMERIST**  
    *Most awkward commitment:* Must explain why fantastical elements dominate the story if a real event is at its core.  
  - **B. A social situation** (e.g., migration, collapse).  
    → **Leaf: CONTEXTUALIST**  
    *Most awkward commitment:* The "kernel" is often so broad it barely resembles the story’s specific plot.

  #### **Question 5 (If symptom + can ask about real event): What could count as evidence?**
  - **A. Only physical proof** (e.g., archaeology, contemporary records).  
    → **Leaf: MINIMALIST** (Same as 2B)  
    *Most awkward commitment:* See 2B.  
  - **B. The story’s themes** (e.g., it reflects real social anxieties).  
    → **Leaf: CONTEXTUALIST** (Same as 4B)  
    *Most awkward commitment:* See 4B.

  #### **Question 6 (If symptom + cannot ask about real event): Why avoid historicity?**
  - **A. Category error** (The story is myth, not history).  
    → **Leaf: MYTHICIST**  
    *Most awkward commitment:* Must explain why the story uses realistic settings/details if not "about" history.  
  - **B. Distraction** (Truth-value doesn’t affect meaning).  
    → **Leaf: DEFLATIONIST**  
    *Most awkward commitment:* Treats the past as irrelevant even if provable (e.g., "Exodus’ power is theological, not historical").

  ---

  ### **Unreachable Combinations & Why**
  1. **Testimony + Symptom (Q1):**  
     Incoherent. You can’t treat the text as both testimony (valuable record) and symptom (cultural byproduct) simultaneously.  
  2. **Burden on skeptic + Minimalist (Q2A + Q2B):**  
     Unoccupied. Assuming truth until disproven contradicts requiring external proof.  
  3. **Symptom + Euhemerist (Q3A + Q4A):**  
     Unattractive. If the text is a "symptom," hunting for a specific event (e.g., Arthur’s birthplace) is seen as naive.

