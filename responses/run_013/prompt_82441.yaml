prompt: |-
  Next spring I have ninety minutes with a group I have taught before — graduate students in ecology and evolution, most of whom use the word function a dozen times a day and none of whom believe there is anything in it to argue about. I want those ninety minutes spent on the split between the etiological, or selected-effects, account of biological function and the causal-role account, and I want a teaching plan rather than an exposition: what has to be in place before either account can be stated at all without sounding like theology on one side or a change of subject on the other, the order the pieces have to come in and what depends on what, and where the session has to stop. My main worry is that the students will hear a quarrel about words, so the plan has to make the two accounts come apart on a single case they can hold in their heads; I would rather not use the heart again, and I would rather you choose the case than choose it myself, but tell me what it has to have and what it must not have, and in particular whether it can be a case in which one account simply wins, since I want the students to feel what each account costs. Keep three questions visibly distinct the whole way through: what the trait is for, why it is there, and what it now does. The students collapse these into one, and I think that collapse is what makes the dispute look verbal; the sequence should be built so that the collapse becomes visible as a mistake rather than being announced as one. Tell me the misconceptions you expect in the order they will actually surface and the precise point in the sequence where each should be headed off — I am expecting them to say that function just means what a trait does, that selection is nature's intention, that vestigial means functionless, and that a trait with several functions shows the question was never well posed — but say which of those I am wrong about and what I have left out. End with one question I can put to the room that will show me whether they have the distinction rather than the vocabulary. I am tempted to close by asking whether medicine's talk of dysfunction quietly commits it to the etiological account; tell me whether that is the thing to cut, and what else to leave out at this level and to say so out loud. Whiteboard only, no slides.

  Write the plan as continuous prose — no headings, no numbered or bulleted lists, no bold, no tables — the way you would write it to a colleague who has to run the same session next week.
reasoning: |-
  Okay, the user is an experienced educator teaching graduate students in ecology and evolution. They need a 90-minute session plan on the etiological vs. causal-role accounts of biological function, with very specific constraints. 

  First, I need to unpack their core pedagogical concerns: they want to avoid students perceiving this as mere semantics, which means I must engineer a concrete case study where the theories genuinely diverge. The heart example is vetoed, so I'm considering insect wings - it shows multiple potential functions (flight, thermoregulation, signaling) and has clear evolutionary history. Crucially, wings allow asking "why are they there?" (selected for flight) versus "what do they now do?" (multiple roles) - perfect for forcing the split.

  The user emphasizes three questions that students conflate: what the trait is for (etiological), why it's there (historical explanation), what it now does (causal-role). I'll structure the session around progressively disentangling these. Starting with student preconceptions is vital - they'll likely say "function is just what a thing does," which we'll challenge immediately with vestigial traits. Python pelvic spurs work well here: clearly "functional" in causal terms (muscle attachment) but not selected-for. 

  Timing matters: minute 15-20 is when I predict the "vestigial means useless" misconception surfaces. We'll dissect that by showing spurs still have causal roles. Later, when introducing wings, students might argue multiple functions resolve the debate - but that's actually the point where theories clash most (minute 50-55). The case mustn't let either theory "win"; wings exemplify how etiological picks one historical function while causal-role embraces current plurality.

  For the closing check: asking about medical "dysfunction" is too advanced. Better to pose: "If we discover beetle wings now regulate temperature better than they enable flight, does that change their function?" Correct answers should distinguish historical selection (no) from current causal contribution (yes). 

  Whiteboard flow: left column for etiological (history-focused), right for causal-role (system-focused), with the three questions as permanent headers. I'll explicitly omit extended philosophy comparisons and medical applications to stay focused. The user's worry about theology is spot-on - we'll ground "why it's there" in selection, not intention, by minute 35 when teleology risks creeping in.

  This plan turns their conflation mistake into a reveal rather than lecture. By minute 70, when we synthesize, students should viscerally feel the cost: etiological ignores useful current roles, causal-role ignores evolutionary history. That discomfort is pedagogical gold.
answer: |-
  Here's how I'd run those ninety minutes for your group, building the distinction from the ground up while surfacing and dismantling their intuitions at the right moments. We need a case study that forces the split cleanly, lets neither account "win" entirely, and highlights the costs. I propose using **insect wings**, specifically focusing on a species like beetles where wings serve multiple roles and exhibit evolutionary quirks (like flightlessness evolving secondarily). This works because it has: 1) **A clear historical selected effect** (flight in ancestors), 2) **Current causal contributions** that may differ (e.g., thermoregulation, predator deflection, sexual display in flightless species), and 3) **No medical baggage** (avoiding the heart's familiarity and the dysfunction question for now). Crucially, it must *not* be a case where the historical function is entirely lost (like whale pelvis) or where current and historical roles perfectly align – we need tension.

  Start by writing the three questions distinctly on the board, leaving space under each:
  1.  **What is the trait *for*?**
  2.  **Why is the trait *there*?**
  3.  **What does the trait *now do*?**

  **(Min 0-10: Setting the Stage & Surfacing Intuition)** Open by stating the goal: "Today we're dissecting how we use 'function' in bio. I suspect you use it mostly unthinkingly. Let's test that. Take beetle wings. Off the top of your heads, what's the *function* of wings?" List every answer verbatim (flight, thermoregulation, display, protection, maybe even "none" for flightless species). *Expectation:* They'll initially conflate all three questions. Someone will likely say, "It's what it does, obviously!" (Conflation 1: Function = Current Activity). Don't challenge yet; just note the variety. Then ask: "So, for a flightless beetle species, what's the function of its wings?" *Expectation:* Here's where "vestigial means functionless" (Conflation 2) will surface. Many will say "nothing" or "no function." Record this.

  **(Min 11-25: Introducing Causal Role & Breaking Conflation 2)** Shift focus: "Okay, *what do the wings now do* in this flightless beetle?" Push them: Are they involved in heat exchange? Covered by the elytra providing protection? Used in mating displays? Anchor this in mechanisms they know (e.g., wing fluttering for thermoregulation, wing coloration for display). Write these under "What does it now do?". Emphasize these are *causal contributions* to current capacities of the organism/system. Conclude: "So even if it doesn't fly, the wing *does* things. Saying 'vestigial' doesn't mean causally inert. 'Functionless' in common talk might just mean 'not doing what we expected' historically." **Crucial Point:** State clearly: "This list under 'What does it now do?' is the **Causal Role (CR)** account of function. A function is a current causal contribution to a containing system's activity."

  **(Min 26-40: Introducing Etiology & Surfacing Conflation 3)** Now pivot: "But *why* are wings *there* in beetles at all, including flightless ones? Where did they come from?" Guide them to evolution: wings evolved in ancestors *for flight*. That's the reason they exist in the lineage. Write "Flight (in ancestors)" under "Why is the trait there?". Ask: "Does knowing what the wing *does now* in a flightless beetle (thermoregulation, say) tell us *why* wings originally evolved and persisted?" *Expectation:* They'll likely see "no," but someone might argue strong current benefits *explain* presence (Conflation 3: Current Utility Explains Existence). Gently challenge: "If thermoregulation was so crucial, why didn't a more efficient structure evolve *instead* of wings? Wings are complex; maintaining them is costly. Why keep them if flight is lost?" Push them towards history. **Crucial Point:** State: "This answer under 'Why is it there?' points to the **Etiological (ET) or Selected Effects (SE)** account. A function is what the trait was *selected for* in the evolutionary past – the reason it exists and persists."

  **(Min 41-55: Forcing the Split & "Multiple Functions" Misconception)** Return to the flightless beetle. Write on the board:
  *   *What is it for?* (Leave blank for now)
  *   *Why is it there?* = Flight (ancestral selection)
  *   *What does it now do?* = Thermoregulation (maybe also display, protection...)
  Ask: "So, what *is* the function of the wing *for this flightless beetle*?" *Expectation:* This is where the "multiple functions show the question is ill-posed" (Conception 4) or "it depends on context" will erupt. Some might insist it's "for" thermoregulation now. Others will say "for flight, but it doesn't do that." **Force the Distinction:** "If I ask 'What is it *for*?', am I asking about its history (why it's there) or its current job (what it now does)? The ET account says 'for' means *what it was selected for* – flight. The CR account says 'for' means *the causal role it currently plays* – thermoregulation. They give different answers to the *same question* for the same trait in the same organism!" Highlight the cost: ET ignores valuable current roles; CR ignores evolutionary history. *This is the core moment.* The split isn't verbal; it's about *which question "for" points to*.

  **(Min 56-70: Deepening the Split & Heading Off Teleology)** Now use a flying beetle. Under "What does it now do?" write Flight + Thermoregulation + ... Under "Why is it there?" write Flight. Ask: "Is flight its function? Is thermoregulation its function? Both?" *Expectation:* They might say "both are functions," collapsing again. Challenge: "But *why* are wings there? Did they evolve *for* thermoregulation, *for* flight, or both? Did selection act *directly* on thermoregulation via wings, or was thermoregulation a beneficial side-effect?" Push them to see that ET requires evidence of *historical selection for* the effect. CR just requires the current effect. Ask: "If thermoregulation is just a side-effect in fliers, is it a 'function'? CR says yes (it's a causal role); ET might say no (unless there's evidence it was *also* a target of selection)." **Crucial Point:** State firmly: "Selection isn't nature's 'intention' (Conflation 5 you anticipated). It's a historical filter. Saying 'selected for flight' doesn't mean evolution aimed at flight; it means flight caused the trait's spread. ET is about history, not purpose."

  **(Min 71-85: Synthesis, Costs, and the Final Question)** Summarize:
  *   **ET/SE Function:** The effect for which the trait was *historically selected* (Why it's there? What was it *selected for*?). Cost: Ignores current useful effects that weren't selected for; struggles with new/vestigial traits.
  *   **CR Function:** The *current causal contribution* the trait makes to a system's activity (What does it now do? What role does it play *now*?). Cost: Ignores evolutionary history; can call *anything* a function if it plays a causal role.
  Reiterate the three questions are distinct. "What is it *for*?" is ambiguous – it *could* mean either ET or CR, hence the debate! "Why is it there?" leans heavily ET. "What does it now do?" is pure CR.

  **Final Check Question (Min 86-89):** "Consider a gene in a modern bacterium that produces an enzyme breaking down a synthetic pesticide (not present in its natural history). The enzyme also *accidentally* breaks down a natural toxin common in its environment, providing a huge survival boost *now*. According to ET, what is the function of this enzyme? According to CR, what is its function? Does it have a function?"
  *   **Expected Correct Distinction:** ET: No function (or possibly its historical function, but *not* breaking down the toxin, as it wasn't selected for that). CR: Breaking down the natural toxin (and maybe the pesticide, but the toxin is the significant current role). Yes, it has a CR function.
  *   **Why it works:** It isolates current causal benefit from evolutionary history. If they say "its function is breaking down the toxin" without specifying the account, probe further.

  **What to Cut & Why:**
  *   **Medicine/Dysfunction:** *Cut this.* It's fascinating but a major tangent. It implicitly *does* lean ET (dysfunction implies deviation from a "selected norm"), but arguing that requires delving into philosophy of medicine, norms, and species design – too much for 90 mins. Say out loud: "We're skipping the medical analogy today – it's rich but requires its own session on norms and design."
  *   **Deep Philosophy:** Avoid citing philosophers (Wright, Cummins, etc.) unless a student asks. Keep it grounded in biological reasoning.
  *   **Other Cases:** Resist the urge to jump to whale pelvises or pseudogenes mid-session. Stick rigorously to the beetle/wings scaffolding. You can mention them as "other examples to ponder later."
  *   **Resolving the Debate:** Don't try to declare a winner. The point is to see the costs and uses of each framework.

  **Whiteboard Flow:**
  Keep the three questions as permanent headers. Build columns beneath them as you go:
  1.  *(Start)* What is it for? [Blank initially, filled later with ambiguity]
  2.  Why is it there? [Filled with "Flight (ancestral selection)"]
  3.  What does it now do? [Filled with lists: "Flight" (for fliers), "Thermoregulation", "Display", "Protection" (as discussed)]
  Add labels: **Causal Role (CR)** next to "What does it now do?", **Etiological/Selected Effects (ET/SE)** next to "Why is it there?". Circle "What is it for?" with arrows pointing to both columns to show the ambiguity. Jot the "costs" underneath each label when you summarize.

  This forces them to hold the beetle wing case, makes the split operational on a single trait, surfaces their key misconceptions at the points where those misconceptions naturally hinder progress, and ends with a clean test of whether they grasp the distinction itself. Good luck!
