answer: |-
  ### Office of Divine Attributes  
  **Help Centre Article #735**  
  **Version 3.1.4**  
  **Last Updated:** 12th of Quintilis, 12023 HE  

  ---  
  #### Frequently Asked Questions: Scope of Divine Power  

  **1. Can the being create a stone too heavy for it to lift?**  
  No. The phrase "a stone too heavy for an omnipotent being to lift" fails to describe any actual *task* or *object*. Weight and liftability are properties defined by the current ordained physical order (Covenant of Creation, Article VII). Under absolute power, the being could alter gravitational constants or revoke the law of inertia to resolve the scenario, but such adjustments would redefine "heavy" and "lift," rendering the original description void. For clarity on physical-law covenants, see Article #512: *Gravity, Motion, and Divine Ordainment*.  

  **2. What occurs when an irresistible force meets an immovable object?**  
  This scenario cannot occur. "Irresistible" and "immovable" are mutually exclusive properties under the ordained laws of causality (Covenant of Contingency, Article III). The being could, under absolute power, suspend these properties temporarily or reconfigure momentum itself. However, the covenant binds the being to preserve causal consistency, preventing logically inconsistent events. The question describes no coherent *event*, only an unstable conjunction of terms.  

  **3. Can the being lie, sin, or cease to exist?**  
  - **Lie:** The being has bound itself by the Covenant of Truth (Article I) never to utter falsehoods. While absolute power could permit fabrication (e.g., a "false" statement deemed "true" by revised logic), the covenant renders lying incompatible with divine action.  
  - **Sin:** Sin is defined as violation of the being’s own moral law (Covenant of Holiness, Article IX). The being could, absolutely, act contrary to current moral definitions, but this would redefine morality itself, voiding the concept of "sin." By covenant, it refrains.  
  - **Cease to exist:** The being has pledged eternal existence via the Covenant of Permanence (Article XI). While absolute power could theoretically permit self-annihilation, this would nullify all covenants retroactively—a violation of the pledge. Thus, it will not occur.  

  **4. Can the being create a being it cannot control?**  
  No. "A being the being cannot control" is an incoherent concept under the current ordained hierarchy of existence. All created entities derive their power from the being’s sustained will (Covenant of Sustenance, Article V). Absolute power could theoretically delegate autonomy beyond the being’s *ordained* reach, but this would breach the covenant’s guarantee of universal sovereignty. The description conflates possibility with covenantal violation.  

  **5. Can the being make a contradiction true, or unmake a logical truth (e.g., "2+2=4")?**  
  - **Contradictions:** Under absolute power, the being could decree that "P and not-P" is true (e.g., a square circle existing). However, the Covenant of Rational Order (Article II) forbids actualizing intrinsic contradictions within creation to preserve intelligibility. Contradictions remain *descriptively vacant*—they fail to specify any state of affairs.  
  - **Logical truths:** The being could, absolutely, revoke logical axioms (e.g., non-contradiction). Yet by covenant, it upholds current logic to ensure cosmic stability. "2+2=4" reflects ordained mathematical relations; unmasking it would require dissolving arithmetic itself, which the covenant prohibits.  

  **6. Can the being undo a past event (e.g., unhappen the Battle of Jericho)?**  
  No. Past events are fixed under the Covenant of Temporal Integrity (Article XV). While absolute power could alter historical records, memories, and causal chains to *simulate* erasure (e.g., making Jericho’s fall "unremembered"), the event’s occurrence remains inviolate. The covenant binds the being to preserve temporal consistency; "undoing" is not a permitted operation.  

  **7. If logic is revocable, how can I trust this FAQ?**  
  All Office pronouncements assume the stability of the current ordained order, including logic (Covenant of Rational Order, Article II). While absolute power could invalidate this FAQ’s reasoning, the being has covenanted never to subvert the rational foundations of creation *without universal eschatological reconfiguration* (e.g., End of Days scenarios). Until such reconfiguration—should it occur—our answers remain reliable within the covenanted framework. For deeper concerns, see Article #899: *Epistemic Security Under Voluntarism*.  

  **8. Why does the being permit evil?**  
  This query exceeds the Office’s purview. Please submit a "Moral Permissibility" ticket via Form 8-Delta. *Note: The "Problem of Evil" category is deprecated; redirect to "Covenantal Theodicy" (Article #302).*  

  ---  
  #### Related Articles  
  - #512: *Gravity, Motion, and Divine Ordainment*  
  - #302: *Covenantal Theodicy: Suffering and Divine Promises*  
  - #899: *Epistemic Security Under Voluntarism*  
  - #611: *Absolute vs. Ordained Power: A Taxonomy*  

  ---  
  **Still need help?**  
  - Open a Tier 1 support ticket via your parish’s ODA portal.  
  - Escalate unresolved tickets to Tier 2 (Metaphysical Affairs Division) after 30 days.  
  - For covenant emergencies: Light the blue votive candle (per Ordinance 7.3).  

  *"Patient in inquiry, resolute in understanding."*  
  — Office Motto
