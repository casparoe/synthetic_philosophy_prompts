prompt: |-
  I write novels, and I keep running into a kind of line I don't have a word for. I'd like to know if there's a name for it, because it bothers me that I can't talk about it precisely.

  Some sentences don't just say something, they do something — saying them is the act. Sure, everyone knows that. But the ones I keep writing are the ones where the doing happens with nobody on the other end. A woman stands at her father's grave and tells him she forgives him; he's been dead for years, he can't hear her, there's nobody else there, and yet I'd say she has actually forgiven him, not merely said the words — it's the same act she could have done while he was alive, except now it can't be recieved by anyone. Or a man alone in his kitchen at two in the morning says out loud, to the empty room, that he's quitting tomorrow — and that feels like the moment he quits, or at least commits, even though nobody heard and nothing was signed. Or the letter someone writes and never sends, telling a person exactly what they think of them. The person never reads it, so it did nothing to them, and yet the writer did something.

  So what I'm after: is there a name for the class of utterances that are fully carried out but have no addressee who can take them up — no listener at all, or a listener who can't recieve them? I have a feeling the usual story about these sentences is that they need to be heard or accepted to work, and my examples look like counterexamples to that, unless I'm misreading the usual story. And I want to know where the edges are. Does the forgiveness at the grave belong with the unsent letter, or are those two different things? Is this just talking to yourself? Does it matter whether the speaker believes anyone could ever hear it — my man in the kitchen may be performing for a God he doesn't believe in, and that seems to change something.

  Don't just slap a label on it. Tell me what the nearest existing notions are, how each one falls short, and whether I'm describing one phenomenon or three. If there's no name, coin one and define it so I can tell what's in and what's out.

  Then a last line, exactly this and nothing else on it: \answer{...} with the name or the term you coined inside the braces.
reasoning: |-
  Hmm, the user is a novelist struggling with a specific type of utterance in their writing—sentences that perform an action but lack any actual recipient. They've described several vivid examples: a woman forgiving her dead father at his grave, a man declaring he'll quit his job to an empty kitchen, and someone writing an unsent letter. These all share the core element of being performative acts without an audience.

  The user wants precise terminology to discuss this phenomenon and is frustrated by the lack of existing language. They're asking several layered questions: whether this is one unified concept or multiple distinct phenomena, where the boundaries lie (like whether belief in a potential listener matters), and how it challenges conventional speech act theory where reception is typically required.

  Looking at existing concepts:
  - Speech act theory (Austin/Searle) falls short because it emphasizes uptake from the addressee.
  - Monologues miss the intentionality aspect—these aren't just thinking aloud.
  - Soliloquies are theatrical devices, not genuine private acts.
  - Performatives fail because they require conventional contexts and reception.
  - Self-directed speech is too broad—it includes non-performative cases like rehearsing lines.

  The examples reveal nuances:
  1. The grave forgiveness and kitchen declaration both create irreversible psychological commitments through articulation, making internal states concrete.
  2. The unsent letter differs slightly as it's deferred communication—potentially addressable later but deliberately withheld. 
  3. Belief in supernatural reception (like God) adds complexity but doesn't fundamentally change the core mechanism if the speaker knows no human is present.

  After weighing options, the term "solitary performative" seems most fitting. It captures the paradoxical fusion of performance and isolation. Criteria for inclusion: 
  - Must be a speech act (not just thought)
  - With no possible human recipient in that moment
  - Where articulation itself transforms the speaker's stance
  - Excluding cases with expectations of future delivery

  The unsent letter sits on the borderline—it's included if viewed as an end in itself, excluded if seen as mere draft. This boundary tension is productive for literary exploration.

  In crafting the response, I'll structure it to first validate their observation, then dissect why existing terms fail, propose the new term with clear boundaries, and finally address their edge cases. The last line will contain \answer{solitary performative} as requested.
answer: |-
  Your observation cuts to the heart of performative language while exposing a fascinating gap in conventional speech act theory. You're right that Austin and Searle primarily focused on utterances requiring uptake (understanding/acceptance) from a hearer within a conventional context ("I name this ship...", "I promise..."). Your examples deliberately circumvent that reception, creating a distinct class. Let's dissect the nearest concepts and why they fall short:

  1.  **Performative Utterance (Austin/Searle):** The core idea. Words that *do* something (apologize, promise, declare, forgive). **Falls short:** Classical performatives *depend* on convention and uptake. Your examples lack any possibility of uptake by the intended addressee. Saying "I forgive you" to a corpse isn't a conventional act of forgiveness in the same way saying it to the living person is. There's no one to complete the social circuit.

  2.  **Monologue / Soliloquy:** Speaking at length alone. **Falls short:** Too broad. Not all monologues are *performative acts* changing the speaker's state. A monologue could be reminiscing, rehearsing, ranting, or simply thinking aloud without constituting an *act* like forgiveness or commitment. Your focus is on the *efficacy* of the utterance *for the speaker alone*.

  3.  **Self-Directed Speech:** Speech where the speaker is also the intended audience. **Falls short:** While closer, this often implies a *dialogic* function within the self (e.g., self-coaching, self-reprimand). Your examples aren't primarily about *informing* or *persuading* the self; they are about *effectively performing a social or existential act* (forgiveness, commitment, truth-telling) *through* articulation, *despite* the absence of the other. The act is real, but its social dimension is truncated or internalized.

  4.  **Cathartic Utterance:** Speech that provides emotional release. **Falls short:** Catharsis is a *potential effect*, not the *nature of the act itself*. Your man quitting *might* feel catharsis, but the core of the utterance is the *commitment* performed. The unsent letter *might* be cathartic, but its essence is the *act of articulation* of truth.

  5.  **Vestigial Performative / Performative Gesture:** An utterance mimicking a performative act but lacking the full conventional context or effect. **Falls short:** This implies the act is *incomplete* or merely symbolic. Your intuition (and mine) is that for the *speaker*, the act *is* complete and real: the woman *has* forgiven, the man *has* committed. The lack of reception changes the *social* consequence, not necessarily the *internal* or *existential* reality *for the speaker*.

  6.  **Autoperformative:** (Sometimes used informally) An utterance performing an act on oneself. **Falls short:** This can cover things like self-promises or declarations of intent ("I will run today!"), but it struggles with utterances *addressed* to an absent other ("I forgive *you*", "This letter is to *you*"). The *directionality* towards an absent/unhearing entity is crucial to your examples and the tension they create.

  **Analysis of Your Examples & Boundaries:**

  *   **One Phenomenon with Variations:** You are describing one core phenomenon: **The effective performance of a socially or interpersonally defined act through articulated language, where the efficacy resides entirely within the speaker due to the absence, inability, or deliberate exclusion of any external recipient capable of providing uptake.** The act is completed *in the speaking/writing itself* for the speaker.
      *   **The Grave Forgiveness:** Directly addresses the absent/dead father. The act of articulation *is* the act of forgiveness *for her*. It resolves her internal state. The lack of reception is inherent (death).
      *   **The Kitchen Declaration:** Addresses the void (or perhaps an abstract concept like "fate" or "the universe," but crucially, *not* a specific, present, hearing human). The articulation *is* the act of commitment for him, making it real *to himself* in a way mere thought does not. The lack of reception is circumstantial (emptiness).
      *   **The Unsent Letter:** Addresses a specific, living, *potentially* hearing other, but reception is deliberately prevented *by the writer*. The act is completed in the writing: the truth is told, the feelings are fully expressed *outwardly*, even if not transmitted. The efficacy (release, clarity) is for the writer. The lack of reception is *chosen*.

  *   **Edges and Nuances:**
      *   **Belief in a Listener (God, etc.):** If the speaker genuinely believes an omnipotent/hearing God (or spirit, universe) is the recipient, it moves *closer* to a conventional performative *for the speaker*, even if objectively unverifiable. The *subjective possibility* of uptake changes the nature. **Excluded** from the core phenomenon if belief is sincere. **Included** if the speaker is atheistic/agnostic and knows the address is purely symbolic/performative for their own benefit ("talking to the void").
      *   **Talking to Oneself:** Only included if it constitutes a *performative act* (e.g., "I *promise* myself I'll...", "I *admit* I was wrong"). Simple narration ("I need milk") is excluded.
      *   **The Unsent Letter vs. Grave:** They *do* belong together under the core definition. Both involve articulation directed towards a specific, intended-but-unreceiving addressee, where the act (expression, forgiveness) is completed *for the speaker* in the articulation. The key difference is the *potential* for future reception inherent in the letter (it *could* be sent) vs. the *impossibility* for the dead. This creates narrative tension but doesn't fundamentally alter the *performative nature for the speaker at the moment of writing*. If the letter is written *only* for the drawer, never to be sent, it's firmly within the phenomenon.
      *   **Recording for Future Self?** An interesting edge case. If the kitchen declaration is recorded *explicitly for the speaker to hear later*, it might be closer to a performative with deferred self-uptake. **Excluded** if the primary intended recipient at the moment of recording is the *future self*. **Included** if recording is incidental and the primary act is declaration *into the void* for its own sake.

  **Coining the Term: Solitary Performative**

  *   **Term:** **Solitary Performative**
  *   **Definition:** An articulated utterance (spoken or written) that:
      1.  **Performs an Act:** It enacts a socially or interpersonally defined state or action (e.g., forgiving, committing, accusing, confessing, declaring, resigning).
      2.  **Is Directed Outward:** It is formally addressed or directed towards a specific or general external entity (person, concept, void) *other* than the speaker themselves *at that moment*.
      3.  **Lacks Viable Recipient:** At the moment of articulation, there is no present, capable, intended human recipient able or intended to receive and provide uptake for the act *in the conventional sense*. This includes absence (dead, gone), inability (unconscious, incapable), deliberate exclusion (unsent), or the inherent unreceptiveness of the target (void, abstract concept).
      4.  **Speaker-Efficacious:** Despite the lack of external reception, the act is effectively completed *for the speaker* through the act of articulation itself, altering their internal state, resolve, or understanding.

  **What's In:**
  *   Forgiving the dead at a graveside.
  *   Declaring a commitment to an empty room.
  *   Writing a vitriolic/confessional letter knowing it will never be sent.
  *   Apologizing to a photograph.
  *   Resigning "to the universe" while alone.

  **What's Out:**
  *   Promising *yourself* out loud to eat better (Autoperformative - self is recipient).
  *   Rehearsing a speech alone (Preparation, not performance).
  *   Praying with sincere belief God hears (Conventional performative with divine recipient).
  *   Saying "I resign!" to your boss, even if they ignore you (Uptake *possible*, conventional context exists).
  *   Writing a draft of a letter *intending* to send it (The performative act is incomplete).
  *   Merely thinking "I forgive him" (Not *articulated*).

  **Conclusion:** You've identified a distinct and powerful type of speech act – the **Solitary Performative**. It thrives on the tension between the form of social/interpersonal language and the isolation of the speaker, finding efficacy not in communication, but in the existential act of externalizing the inner state into the unreceiving world. Your three examples are strong, central instances of this single phenomenon, differentiated by context but unified by the core mechanism. The edges (belief, unsent letters) are fertile ground for exploring ambiguity within the category.

  \answer{solitary performative}
