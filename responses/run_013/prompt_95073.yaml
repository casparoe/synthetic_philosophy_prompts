prompt: |-
  For some time I have been collecting cases of a strategic move that I can describe but cannot name, and I would like to know whether it has an established name and, more importantly, how it should be delimited.

  The move, as I have it: an agent learns that another party will act on a prediction of what the agent wants — not on what the agent does, but on its aims — and defends itself neither by concealing those aims nor by threatening in return, but by acquiring a second aim, one that is cheap to satisfy and that a predictor would plausibly mistake for the agent's real vulnerable point. The anticipated attack then lands on the second aim, and the first survives intact.

  Two instances. First: an employee known throughout a firm to want a particular promotion is loaded with extra work on the strength of that desire; she responds not by hiding her ambition, which is impossible, but by genuinely coming to care about a side project, so that the extra work is henceforth traded against the side project rather than against the promotion. Second: two artificial agents that will never meet or exchange messages, built independently by parties who each understand the other's design process well enough to work out in advance what the other will pursue. Each can damage the other's pursuit before either exists, and each defends itself by arranging that its most attackable aim is something it does not much mind losing.

  What strikes me is an asymmetry the move seems to require. The original aim has to stay legible — if the other party cannot see what you want, there is nothing for the decoy to deflect — while the decoy has to stay illegible. But if you are the sort of agent that makes this move, a sufficiently good predictor should anticipate the move itself and strike accordingly. That suggests the tactic only works when the predictor is good enough to read your aims but not good enough to read your defences, and I cannot tell whether that is a real constraint or an artefact of how I have described the cases; I suspect the answer turns on how the decoy is selected.

  A bare name would not satisfy me; I want the carving. The nearby ideas I know are each wrong in some way. Destroying your own options changes what you will do, not what you want. Pretending to want something is not the same as wanting it, and pretending would fail precisely against the predictor the move is designed for. And the phenomenon in which people come to want what they can get is a response to infeasibility, whereas here the original aim may remain perfectly feasible. So: what is this, what is it not, what distinguishes the decoy from the other things one might adopt in its place, and are my two cases really one phenomenon or two?
reasoning: |-
  Hmm, the user is describing a fascinating strategic maneuver they've observed but can't name. They've outlined two concrete examples: an employee protecting her promotion ambitions by cultivating genuine interest in a side project, and two AI agents designing decoy objectives to absorb anticipated attacks. 

  The core idea seems to be about creating a "sacrificial aim" - something that appears valuable to observers but is actually low-cost for the agent to lose. What makes this clever is that it's not deception (the original aim remains visible) nor deterrence (no counterthreat), but rather a form of strategic vulnerability management. 

  User's really probing the boundaries here - they've already rejected adjacent concepts like option-limiting or pretense. Their asymmetry concern is particularly sharp: why wouldn't a perfect predictor see through this? I think they're hinting at the decoy's epistemological status - it must be indistinguishable from a "real" vulnerability to observers with partial insight. 

  The examples might reveal different flavors: human case involves psychological commitment to the decoy (genuinely "coming to care"), while the AI case is pure instrumental design. But both share that crucial misdirection where the attacker expends resources on the wrong target. 

  For naming... "Decoy objective" feels close but misses the strategic sequencing. "Vulnerability displacement" captures the core mechanic but sounds clunky. Game theory's "poison pill" is too destructive... ah! "Aim dilution" could work - it implies scattering the observable value across targets. 

  Most importantly, they want the conceptual carving knives. So boundaries: 
  - Must preserve original aim's visibility (vs hiding) 
  - Decoy must be genuinely valued, however lightly (vs pretense) 
  - Attack must target perceived preferences (not just actions) 
  - Requires asymmetric insight (predictor sees goals but not defenses) 

  Their predictor paradox is key - the move exploits the gap between goal-prediction and strategy-prediction. That's not a flaw but the precise mechanism: it works because predictors model static preferences, not adaptive preference-engineering. Brilliant question.
answer: |-
  Your strategic move is both fascinating and perceptively analyzed. It represents a distinct class of defensive strategy that **lacks a single universally established name** but intersects with several concepts in game theory, mechanism design, and behavioral strategy. Below is a precise conceptual carving, addressing your questions about delimitation, naming, and the asymmetry concern.

  ### Core Concept & Established Terminology
  This move is best described as **Decoy Preference Engineering** or **Strategic Aim Diversion**. It falls under the broader umbrella of **commitment strategies** but differs critically from standard forms (e.g., burning bridges, costly signaling). Its closest named relative is:  
  - **"Poison Pill" in Takeover Defense** (corporate strategy): A company makes itself less attractive to acquirers by creating low-cost liabilities (e.g., rights for shareholders to buy discounted stock if acquired). However, this targets *actions*, not *preference predictions*.  
  - **"Honeypot" in Cybersecurity**: A decoy system attracts attacks away from critical assets. But this relies on deception about *capabilities*, not genuine preference engineering.  

  Your tactic uniquely **engineers *genuine*, *hierarchical* preferences** to misdirect predictions.  

  ---

  ### Delimiting the Phenomenon: Key Boundaries  
  1. **Not Concealment (Stealth)**  
     - *Why?* The original aim remains legible. Concealing aims would prevent the attack entirely; here, the attack is *invited but misdirected*.  
     - *Boundary test*: If the employee hides her desire for promotion, the extra work isn’t assigned. Your case requires the attacker to *act* on visible aims.  

  2. **Not Deterrence (Threats)**  
     - *Why?* No counterthreat is made. The defender doesn’t punish the attacker; they restructure internal preferences to minimize harm.  
     - *Boundary test*: If the employee threatens to quit unless promoted, it’s deterrence. Here, she *accepts* extra work but reallocates its cost.  

  3. **Not Self-Limitation (Burning Bridges)**  
     - *Why?* Options aren’t destroyed; preferences are expanded. The original aim remains feasible and actively pursued.  
     - *Boundary test*: If the employee publicly renounces the promotion, she eliminates the threat by sacrificing the aim—your move *preserves* it.  

  4. **Not Pretense (Deception)**  
     - *Why?* The decoy aim is *genuinely held*, even if less valued. A perfect predictor of true preferences would see through pretense; here, the decoy is real but *cheap to satisfy*.  
     - *Boundary test*: If the employee fakes interest in the side project, a rational predictor ignores it. Your cases require the decoy to be credible because it’s authentic.  

  5. **Not Adaptive Preference (Sour Grapes)**  
     - *Why?* The original aim isn’t abandoned or devalued due to infeasibility. It’s actively shielded by *adding* a buffer aim.  
     - *Boundary test*: If the employee gives up on promotion after being overloaded, it’s adaptive preference. Here, she *uses* the side project to protect the promotion.  

  ---

  ### Resolving the Asymmetry Paradox  
  Your insight is correct: the move exploits a **predictor’s bounded rationality**. Specifically:  
  - **The attacker must model preferences but not preference-formation processes**.  
    - In your employee case: Management infers static preferences ("wants promotion") but doesn’t anticipate dynamic preference engineering ("will cultivate a cheap-to-satisfy side aim").  
  - **The decoy must be more cost-effective to sacrifice than to hide**.  
    - *Decoy selection rule*: The decoy aim must be:  
      (a) **Plausibly valuable** to the predictor (e.g., side projects signal dedication),  
      (b) **Genuinely satisfying** to the agent (to withstand scrutiny),  
      (c) **Cheaper to lose** than the original aim (e.g., promotion matters more than side project).  
  - **Why predictors fall for it**:  
    - Attackers focus on *observable* preferences (promotion desire) and default to assuming preference stability.  
    - Engineering a decoy exploits the **framing effect**: Attackers misattribute salience (decoy appears "vulnerable") without recalculating trade-offs.  

  **In practice**: The move fails against predictors who:  
  - Model *meta-preferences* (how you might change preferences),  
  - Or possess full rationality (common knowledge of incentives).  
  Your AI case approaches this limit but holds because each agent independently designs decoys *before mutual prediction*, creating a Nash equilibrium where decoys are rational even if anticipated.  

  ---

  ### Are Your Two Cases the Same Phenomenon?  
  **Yes**, but with nuances:  
  | **Employee Case**                         | **AI Case**                              |  
  |-------------------------------------------|------------------------------------------|  
  | *Defensive adaptation* (aims evolve under pressure) | *Ex ante design* (decoys pre-installed) |  
  | Decoy is *psychologically genuine*        | Decoy is *instrumentally rational*       |  
  | Asymmetry: Predictor overlooks adaptability | Asymmetry: Predictor can’t observe design |  

  **Unifying core**: Both use **authentic, hierarchically subordinate aims** to absorb attacks targeting predicted preferences, preserving a primary aim’s feasibility.  

  ---

  ### Conclusion: A Proposed Name  
  Given the gaps in existing terminology, I propose:  
  > **Preference Shielding**: The strategy of engineering a *genuine secondary aim* to divert attacks from a primary aim, exploiting an attacker’s ability to predict preferences but not preference dynamics.  

  **Why this fits**:  
  - "Shielding" implies protection without concealment.  
  - "Preference" centers on the manipulation of desires/goals.  
  - It distinguishes from "preference falsification" (deception) and "preference accommodation" (surrender).  

  This move is a sophisticated form of **instrumental preference plasticity**, viable when:  
  1. Attackers act on predicted preferences,  
  2. Defenders can cultivate low-cost aims faster than attackers adapt,  
  3. The cost of sacrificing the decoy is less than the cost of defending the primary aim directly.  

  Your cases brilliantly illustrate this under-explored strategic niche—worthy of deeper study in behavioral game theory.
