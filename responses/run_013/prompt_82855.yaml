prompt: |-
  For the past two years I have sat on the steering committee of an interdisciplinary centre on culture and moral cognition: the psychologists run the experiments, and I am the resident philosopher, whose job is to keep us honest about what the results could possibly show. Last month a visiting speaker walked us through a now-familiar battery of cross-cultural findings on sacrificial dilemmas and concluded that moral truth is parochial; I found myself unable to say crisply what further evidence would have changed his mind, which is part of why I am writing. We have funding for roughly six postdoctoral fellows over three years, and the committee has asked me to circulate a memo ranking the lines of inquiry we should seed first. My difficulty is that the field's obvious priorities and its philosophically load-bearing ones are not the same, and I would rather defend a considered ordering than produce a list.

  What I want from you is that memo, or rather the argument for it: an ordering of the open questions in cross-cultural moral psychology by how much each matters for the metaethical payoff, that is, for whether the cross-cultural record gives us any reason to revise our views about whether there are moral truths and whether we could know them. Please treat the following as candidate items, and add or strike as you see fit. First, whether the variation the WEIRD literature documents is variation in verdicts, in the weights assigned to shared considerations, or in the folk concept of the moral domain itself, so that the very category we are measuring turns out to be parochial. Second, whether the moral/conventional distinction and the alleged universal of harm are substantive universals or artefacts of instruments built on Western undergraduates. Third, whether folk metaethical attitudes, objectivism and relativism and the sense that some disagreements are faultless, vary across cultures, and if so whether they are causes or consequences of moral disagreement. Fourth, whether the genealogy-and-debunking route from a cultural explanation of a moral belief to a verdict against it can be made to work without assuming what it sets out to prove. I have come to think the crux for most of these is what I have been calling the calibration problem: variation in judgment tells you that someone is misjudging only if you already know who, so the empirical record threatens realism only given a premise about the reliability of the divergent faculties, and the real question is whether any empirical work could supply that premise rather than presuppose it. Tell me whether that diagnosis is correct or whether it is a philosopher's evasion.

  For each item, I want the case for its placement: why it is upstream of the others, in the sense that other questions change depending on how it comes out; how tractable it is for a group with our mix of skills; whether it is genuinely neglected or merely fashionable; and what specific finding over the next three years would move it up or down the ranking. Then rank them, name the two we should fund first, name the ones I should be willing to leave unfunded, and be explicit about the criteria you are applying and where they conflict. If the ordering flips depending on whether we weight philosophical importance or tractability, say so, and tell me which weighting you would defend and why.
reasoning: |-
  Okay, the user is part of a steering committee for an interdisciplinary center on culture and moral cognition. They're the resident philosopher, tasked with keeping the research honest regarding what results can actually show. Recently, a visiting speaker used cross-cultural findings on sacrificial dilemmas to argue that moral truth is parochial, and the user couldn't articulate what evidence would change that view. Now, they need to create a memo ranking research lines for postdoc funding, focusing on metaethical significance—how the research impacts questions about moral truths and our knowledge of them.

  The user has listed four candidate items: variation in WEIRD literature, the moral/conventional distinction and harm universality, folk metaethical attitudes across cultures, and the genealogy/debunking route. They also mention the "calibration problem"—variation alone doesn't show misjudging unless you know who's reliable, questioning if empirical work can supply that premise without presupposing it. They want to know if this diagnosis is correct or an evasion.

  First, I need to address the calibration problem. It's central because without knowing whose judgments are reliable, variation doesn't challenge moral realism. For example, if two cultures disagree on a moral dilemma, we can't say who's wrong without prior reliability standards. The user is right that this is a key issue. It's not an evasion; it's a foundational problem for empirical challenges to realism. So, any research must tackle this to have metaethical weight.

  Next, ranking the items. Metaethical payoff means how much each question affects whether moral truths exist and if we can know them. Upstream questions influence others, so they should be prioritized. Tractability matters too—can their team handle it? Neglect vs. fashion is another factor. 

  Starting with item 1: Variation structure. Is it about verdicts, weighting, or the moral domain itself? This is highly upstream. If the moral domain varies, it challenges the universality of morality, impacting all other questions. It's tractable with their interdisciplinary skills—philosophers can analyze concepts, psychologists can test cross-culturally. It's somewhat neglected compared to cataloging differences. A finding that moral domain boundaries vary widely would boost its importance, showing category parochialism.

  Item 2: Moral/conventional distinction and harm universality. If these are Western artifacts, it undermines claims of universal moral foundations. This affects item 1 and 3. But it's been heavily studied, so maybe less neglected. Still, replicating with non-WEIRD samples is doable. Finding that some cultures don't distinguish moral/conventional or prioritize harm differently would move it up. However, it's less directly metaethical than other items.

  Item 3: Folk metaethical attitudes. Do objectivism/relativism vary, and are they causes or consequences? This is crucial because if ordinary people's realism varies culturally, it might support anti-realism. But it's downstream—attitudes might stem from variation, not cause it. It's tractable with surveys but philosophically tricky to interpret. If attitudes correlate with disagreement patterns, it could be key. But it's popular research, so maybe not neglected.

  Item 4: Genealogy and debunking. Can cultural explanations debunk beliefs without begging the question? This is core to the calibration problem. If debunking works, variation could challenge realism. But it's primarily philosophical, needing conceptual work, though empirical input on belief origins helps. It's neglected empirically. A successful debunking argument without circularity would be huge, but hard to achieve.

  The user's calibration problem is spot on. It ties into all items, especially item 4. So, prioritizing items that address this is wise.

  Ranking: 
  1. Item 1 (variation structure) - most upstream, affects everything. Fund first.
  2. Item 4 (genealogy/debunking) - addresses calibration directly. Fund first.
  3. Item 3 (folk attitudes) - important but less fundamental.
  4. Item 2 (moral/conventional) - valuable but saturated; fund only if resources allow.

  Defend funding items 1 and 4 first. Item 1 sets the stage empirically; item 4 tackles the philosophical core. Leave item 2 unfunded unless others are covered, as it's well-trodden. If tractability conflicts with importance, prioritize importance—metaethical payoff is their goal. But note: item 4 might be less empirical, so pair with psychologists to make it feasible.

  Specific findings that would change rankings: For item 1, discovering inconsistent moral domain boundaries would elevate it. For item 4, a cross-cultural debunking success would make it top priority.

  In summary, the memo should argue that understanding the structure of variation and solving the calibration problem via debunking are most critical for metaethics, even if less trendy or harder. This aligns with the user's role as the integrity-keeper and addresses their frustration with the speaker's overreach.
answer: |-
  Here is the memo structuring the research priorities for metaethical payoff, with explicit criteria, rankings, and justifications. Your diagnosis of the calibration problem is **correct and central**—it's not an evasion but the core epistemological challenge for empirical moral psychology.

  ### Core Criteria for Ranking
  1.  **Metaethical Upstreamness (MU):** How fundamentally does resolving this question reshape *other* inquiries in the field? Does it change what evidence means?
  2.  **Addresses Calibration Problem (CP):** Does this question directly tackle the key issue of diagnosing *misjudgment* from variation?
  3.  **Tractability (T):** Feasibility for our interdisciplinary team (psychologists running experiments + philosophical framing/analysis). Scale: 1 (Lab-only) to 5 (Fieldwork-heavy).
  4.  **Neglect vs. Fashion (N/F):** Is this underexplored territory or a saturated bandwagon?
  5.  **Empirical Leverage (EL):** Potential for specific, decisive empirical findings within 3 years.

  ### The Ranked Lines of Inquiry
  **(1) Item 1: The Structure of Variation (Verdicts vs. Weights vs. Moral Domain Itself)**
  *   **Ranking Justification:** Highest MU & CP relevance. *Why?* If the very *concept* of "morality" varies culturally (e.g., some cultures lack a distinct "moral" domain separable from convention, prudence, or spirituality), then cross-cultural comparisons of "moral judgments" become category errors. This fundamentally undermines the significance of *any* variation in verdicts or weights for metaethics. It's logically prior to all other questions. If the domain *is* shared, variation in weights/verdicts then faces the calibration problem head-on. High T (4): Requires nuanced vignette design, qualitative interviews, and conceptual analysis – perfect for our team. Moderate N/F: Domain variation is discussed but empirically underexplored systematically outside WEIRD contexts. High EL potential.
  *   **Specific Finding Impact:** Finding consistent evidence across multiple diverse cultures that the *defining features* of the moral domain (e.g., authority-independence, seriousness, universal applicability) are absent or radically reconfigured would **skyrocket** its importance. Finding robust shared domain boundaries would shift focus intensely to Item 4 and the calibration problem.
  *   **Metaethical Payoff:** Directly determines whether cross-cultural comparisons are meaningful for realism/anti-realism. If the domain is parochial, it strongly suggests morality isn't tracking universal truth. If shared, the calibration problem becomes paramount.

  **(2) Item 4: Genealogy & Debunking (Can cultural explanation debunk without begging the question?)**
  *   **Ranking Justification:** Highest direct CP relevance. *Why?* This *is* the calibration problem operationalized. It asks: Can we empirically demonstrate that a belief arises from processes unreliable for tracking moral truth (e.g., purely adaptive, arbitrary cultural transmission, identifiable bias) *without* presupposing the moral truth value of the belief itself? Success here would directly answer when variation indicates misjudgment. High MU: Success or failure here dictates the force of variation for realism. Moderate T (3): Demands tight integration – psychologists identify causal pathways of belief formation; philosophers analyze reliability and avoid circularity. Requires innovative methods (e.g., tracking belief change during cultural exposure/assimilation). High N/F: Philosophical debates rage, but *empirical* tests of specific debunking mechanisms in cross-cultural contexts are scarce. Moderate EL: Hard to conclusively "prove" within 3 years, but strong evidence for specific debunking *or* vindicating mechanisms is possible.
  *   **Specific Finding Impact:** A study successfully isolating a cultural transmission pathway for a specific belief that demonstrably *lacks* sensitivity to plausible moral reasons (e.g., arbitrary food taboo persistence) and showing independent judges (from diverse cultures) agree on its arbitrariness would **significantly boost** its rank. Conversely, consistent failure to find such "insulated" beliefs would weaken its urgency.
  *   **Metaethical Payoff:** If successful debunking without question-begging is possible, it provides a direct empirical argument against realism for those beliefs. Failure strengthens the realist's charge that debunking presupposes realism.

  **(3) Item 3: Folk Metaethical Attitudes (Objectivism/Relativism across cultures; Causes/Consequences)**
  *   **Ranking Justification:** Important, but less fundamental (Downstream). *Why?* Folk attitudes are likely *responses* to lived experience of variation (or lack thereof) and cultural narratives, rather than primary drivers. Knowing if people are objectivists doesn't tell us if they are *right*; it tells us about phenomenology and potentially stability of norms. Moderate MU: Answers might constrain plausible metaethical theories or inform debunking (Item 4), but don't directly resolve the core CP. High T (4): Survey/experimental methods are well-developed; integration needed for interpretation. Low N/F: This is currently very fashionable. Moderate EL: Clear cross-cultural differences or universalities are findable.
  *   **Specific Finding Impact:** Discovering that folk objectivism robustly predicts *less* actual moral change or *more* resistance to out-group norms in the face of disagreement would increase its significance for stability/evolution of norms, but not drastically change its metaethical core rank. Finding universally faultless disagreement perceptions would be striking but still require CP resolution.
  *   **Metaethical Payoff:** Indirect. Widespread relativism might *support* anti-realist narratives or explain tolerance, but doesn't entail anti-realism. Universal objectivism is compatible with widespread error. Primarily informs the sociology of moral disagreement, not its truth-bearing status.

  **(4) Item 2: Moral/Conventional Distinction & Harm Universal (Substantive or Artefact?)**
  *   **Ranking Justification:** Important foundational work, but Lower MU for core metaethics. *Why?* Even if the M/C distinction or harm focus is WEIRD-biased, this primarily tells us about the *content* of early-developing moral intuitions or domain structure (linking to Item 1). Failure to find these doesn't negate the possibility of *other* shared moral foundations or a shared domain structure defined differently. It challenges specific nativist/universalist claims (e.g., MFT) more than moral realism per se. High T (4): Replication/adaptation studies are core psych. Low N/F: Heavily researched already (though non-WEIRD replications remain valuable). High EL: Clear evidence for or against universality is achievable.
  *   **Specific Finding Impact:** Finding cultures with *no* M/C distinction or where harm is not privileged would be major for moral psychology and bolster arguments against strong nativism, but wouldn't radically alter the *metaethical* landscape compared to Items 1 or 4. It would elevate Item 1.
  *   **Metaethical Payoff:** Low direct impact. Challenges specific empirical claims about moral universals, not the possibility of moral truth or our capacity to know it in principle. Supports arguments for cultural shaping of content, but realism is compatible with diverse content if grounded in non-natural properties or complex natural facts.

  ### The Calibration Problem Diagnosis
  Your diagnosis is **correct and crucial**. Variation alone is epistemically inert regarding misjudgment. The real metaethical battleground is Item 4: *Can empirical genealogy supply non-question-begging reasons to think some culturally formed moral faculties are unreliable?* Item 1 is the essential prior step: *Are we even comparing like with like?* If Item 1 shows category variance, the CP might dissolve because there's no shared subject matter to misjudge. If not, the CP embodied in Item 4 becomes the critical path. This isn't evasion; it's identifying the necessary condition for empirical findings to threaten realism.

  ### Funding Recommendations & Conflicts

  1.  **Fund First:**
      *   **Item 1 (Structure of Variation):** Highest upstream impact. Answers whether cross-cultural moral psychology *as currently practiced* is conceptually coherent. Essential for interpreting all other results.
      *   **Item 4 (Genealogy & Debunking):** Directly tackles the calibration problem – the heart of whether empirical variation can challenge realism. Most direct path to metaethical payoff.

  2.  **Fund if Resources Allow (After 1 & 4):**
      *   **Item 3 (Folk Metaethical Attitudes):** Valuable for understanding the lived experience of morality cross-culturally and potentially informing Item 4 (e.g., does perceived objectivity correlate with resistance to debunking narratives?).

  3.  **Willing to Leave Unfunded:**
      *   **Item 2 (M/C & Harm Universal):** While important for moral psychology generally, it has the *lowest direct metaethical payoff* relative to the others. The field is already saturated with work on this, including increasing non-WEIRD replications driven by existing critiques. Our limited resources are better spent on the more fundamental conceptual (Item 1) and epistemological (Item 4) challenges. Findings here would be valuable but less transformative for the core metaethical question.

  ### Conflicts and Weighting Defense
  *   **Conflict:** Tractability (T) vs. Metaethical Upstreamness (MU)/Calibration Problem (CP) Relevance. Item 4 is potentially *less* tractable empirically than Items 2 or 3, while Item 1 requires significant conceptual/philosophical input alongside complex empirical design. Items 2 and 3 are more straightforward experimentally.
  *   **Weighting Defense:** **Prioritize MU/CP over pure Tractability.** Our unique value as a center lies in tackling the philosophically load-bearing questions others avoid because they are hard. Funding safe, tractable projects on Item 2 or even Item 3 risks generating more data without resolving the fundamental conceptual (Item 1) and epistemological (Item 4) roadblocks that currently limit the metaethical significance of the entire field. High risk/high reward on Items 1 and 4 aligns with the center's mission and your role. However, ensure projects on Items 1 and 4 are designed with concrete, feasible empirical steps to mitigate tractability concerns (e.g., starting with well-defined sub-questions, pilot studies).

  This ordering prioritizes clarifying *what we are measuring* (Item 1) and *how we can interpret variation as error* (Item 4), which are the essential prerequisites for the cross-cultural record to have decisive metaethical implications. It directly confronts the challenge posed by the visiting speaker and equips us to demand the evidence that would genuinely shift the metaethical debate.
