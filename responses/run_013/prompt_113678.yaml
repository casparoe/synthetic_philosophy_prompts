  2nd: Positive liberty (internal chains/self-mastery). 
  3rd: Introduce the flaw—non-interference ignoring power imbalance. 
  4th: Neo-republican pivot (focus on the master’s looming threat). 
  5th: Slave’s apparent peace vs. latent threat. 
  Quatrain: The crux—"free" to one, "unfree" to another. 

  Images: Walls (negative), chains/key (positive), weather (contingent "peace"), leash/shadow (domination). The "kind master" must feel visceral—maybe "benevolent hand" vs. "unseen chain." 

  Rhyme scheme needs to "seed" the next idea, so the b-rhyme of T1 ("key") becomes the a-rhyme of T2. That’ll make the form itself feel like an evolving argument. 

