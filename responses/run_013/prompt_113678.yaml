prompt: |-
  hey, so my philosophy club is doing a session on liberty and i have to bring a poem, and i want it to actually be about the ideas and not just be like freedom is a bird stuff. can you help me write it? you're like a poet who also actually knows political theory, so please brainstorm for a sec before you start drafting, and get the philosophy right.

  heres what i want it to cover. Isaiah Berlin's old split: negative liberty is just nobody interfering with you, the leave me alone kind, and positive liberty is being your own master, ruling yourself, actually realizing your real self. then theres the neo-republican one (Pettit, Skinner) where liberty is non-domination, not just non-interference. the example that made me care is the slave with a kind master who never actually interferes with him: on the negative view the slave is free, on the republican view hes still unfree because the master could interfere any time he wanted. that gap is the whole point.

  so can you write it as a terza rima (the dante thing, aba bcb cdc, ending in a quatrain), like five tercets plus the closing quatrain, 16 lines. i want the form to do the work: each tercet's middle rhyme seeds the next tercet, the way each idea of liberty leaves something unresolved that the next one has to pick up. and let the closing quatrain be where the kind-master thing lands, the moment where one view says free and the other says not free. someone whos read berlin and pettit should find it accurate and someone whos never heard of them should still get it from the poem alone, so dont just name drop, make the images carry it. and please keep it from getting preachy or greeting-card-y.
