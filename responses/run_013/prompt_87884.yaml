prompt: |-
  I read a philosophy explainer last week that tried to spell out epistemic contextualism and pragmatic encroachment for a general audience, and now I don't know how much of it to beleive. Here's the gist, as close as I can remember it:

  'Epistemic contextualism is the view that knowledge is relative — whether you know something depends on how much is at stake for you. If you're just chatting with a friend, you need almost no evidence to count as knowing where you parked the car, but if you're about to bet your savings on it you need much more, so "knows" means different things in different contexts. Contextualists call this pragmatic encroachment, because practical interests are always creeping into the purely epistemic. The upshot is that you can never just say whether someone knows something, full stop; the answer is always relative to a context, and since contexts shift, so does the truth. This is basically how contextualism keeps skepticism at bay: in ordinary conversation the bar is low and we know tons of things, but once the philosopher trots out the brain-in-a-vat scenario the bar shoots up and we know nothing. Critics say this makes knowledge arbitrary, and that two people who seem to disagree about whether someone knows are really just talking past each other — which the contextualist is happy to accept.'

  I'm inclined to think it's basically right and I'm just being paranoid, but a friend told me the writer has an axe to grind, so now I'm not sure. Go through it claim by claim and sort each one into accurate, a fine simplification for a popular piece, or wrong/misleading. Where the writer has run two different positions together, tell me which is which and why the difference matters. And say whether that closing jab — that contextualism makes knowledge arbitrary and just gives up on disagreement — actually follows from anything contextualists say, or whether its an opponent's complaint dressed up as a concession. No more than 500 words, bullets are fine.
reasoning: |-
  Okay, let me tackle this user's query step by step. They're confused after reading an explainer on epistemic contextualism and pragmatic encroachment, and they want a breakdown of each claim's accuracy. 

  First, I need to recall the core ideas: epistemic contextualism says "knows" depends on conversational context, while pragmatic encroachment ties justification to practical stakes. The user's summary conflates these, so I'll need to disentangle them carefully.

  Looking at the first claim about knowledge relativity - it's partially right but oversimplified. Contextualism is about linguistic context, not stakes directly. The parking example works as a popular simplification though. 

  The "pragmatic encroachment" definition is where things go wrong. The writer mixes two distinct theories here. I should clarify that contextualism is semantic (meaning shifts) while pragmatic encroachment is about justification changing with stakes. The difference matters because they address skepticism differently.

  The skepticism point is mostly accurate for contextualism but doesn't apply to pragmatic encroachment. The arbitrariness complaint? That's definitely opponents' criticism, not contextualism's position. Contextualists would say contexts aren't arbitrary and disagreements can be resolved by specifying contexts.

  The user seems worried about whether they've been misled. Their friend's warning about the writer's bias might be valid given the conflation. I should reassure them their confusion is warranted while keeping it under 500 words. Bullet points will help organize the critique clearly.

  Hmm... the closing jab is particularly misleading. I'll emphasize that presenting it as contextualism "giving up" is unfair - they're just analyzing disagreement differently. That's crucial for the user to understand the philosophical stakes.
answer: |-
  Here's a claim-by-claim breakdown of the explainer, separating accuracy from conflation and critique:

  1.  **"Epistemic contextualism is the view that knowledge is relative — whether you know something depends on how much is at stake for you."**
      *   **Accuracy:** **Misleading.** Contextualism holds that the *meaning* of the word "knows" (and thus the *standards* for when it applies) shifts with the *conversational context*. Stakes *can influence* the context (e.g., making participants raise standards), but stakes themselves aren't the *direct* relatum. The relativity is semantic/conversational, not directly pragmatic.

  2.  **"If you're just chatting with a friend, you need almost no evidence to count as knowing where you parked the car, but if you're about to bet your savings on it you need much more..."**
      *   **Accuracy:** **Fine simplification.** This is a standard illustration of how contextualists think standards shift. While stakes (betting savings) are the *trigger* for higher standards in the example, the core contextualist point is the *shift in meaning/standards* itself.

  3.  **"...so 'knows' means different things in different contexts."**
      *   **Accuracy:** **Accurate (Core Contextualism).** This is the defining thesis of epistemic contextualism: "knows" is a context-sensitive term.

  4.  **"Contextualists call this pragmatic encroachment..."**
      *   **Accuracy:** **Wrong/Misleading (Major Conflation).** This is the critical error.
      *   **Clarification:** **Pragmatic Encroachment (PE)** is a *distinct* (though related) view. PE claims that *whether a subject is justified in believing P (and thus whether they know P)* depends partly on the *practical stakes* for that subject *in their actual situation*, not just on truth-conducive factors. Contextualism (EC) is about the *semantics* of "knows" varying with *conversational context*. **Difference Matters:** EC explains why we *say* "S knows" in low stakes but not high stakes. PE claims that S *actually knows* in low stakes but *does not know* in high stakes (even if the evidence is identical) because stakes affect the justification *required*. EC is semantic; PE is metaphysical (about the nature of justification/knowledge itself).

  5.  **"...because practical interests are always creeping into the purely epistemic."**
      *   **Accuracy:** **Fine simplification (for PE), Misleading for EC.** This is a common *motivation* for both views, but EC frames it as interests affecting *language use* (context/semantics), while PE frames it as interests affecting the *epistemic status itself* (justification).

  6.  **"The upshot is that you can never just say whether someone knows something, full stop; the answer is always relative to a context..."**
      *   **Accuracy:** **Accurate (Core Contextualism).** Contextualists insist "knows" requires a context to have a definite truth-value.

  7.  **"...and since contexts shift, so does the truth."**
      *   **Accuracy:** **Accurate (Core Contextualism).** A single knowledge attribution ("S knows P") can be true in a low-standards context but false in a high-standards context.

  8.  **"This is basically how contextualism keeps skepticism at bay: in ordinary conversation the bar is low and we know tons of things, but once the philosopher trots out the brain-in-a-vat scenario the bar shoots up and we know nothing."**
      *   **Accuracy:** **Accurate (Standard Contextualist Explanation).** This is a primary motivation for EC: preserving the truth of ordinary knowledge claims while acknowledging the force of skeptical arguments by raising standards.

  9.  **"Critics say this makes knowledge arbitrary..."**
      *   **Accuracy:** **Opponent's Complaint.** Critics argue that if conversational whims dictate the standards, knowledge becomes arbitrary. Contextualists counter that context shifts are governed by conversational norms and aren't arbitrary.

  10. **"...and that two people who seem to disagree about whether someone knows are really just talking past each other..."**
      *   **Accuracy:** **Accurate (Contextualist Consequence).** Contextualism *entails* that if speakers are in different contexts (employing different standards), their utterances "S knows P" and "S does not know P" can both be true simultaneously because they express different propositions. It's not a genuine contradiction, just a difference in meaning.

  11. **"...which the contextualist is happy to accept."**
      *   **Accuracy:** **Accurate.** Contextualists *do* accept this as a consequence of their semantic thesis (see point 10). They see it as explaining persistent disagreements.

  **Closing Jab Assessment:** The statement "Critics say this makes knowledge arbitrary and that two people... are really just talking past each other — which the contextualist is happy to accept" mixes elements:
  *   **"Makes knowledge arbitrary"**: This is purely an **opponent's complaint**, *not* a position contextualists hold or concede. The writer presents it neutrally but it's a criticism.
  *   **"Two people... talking past each other"**: This **does follow** from contextualism (point 10) and contextualists **do accept it** (point 11). This part is accurately presented as a consequence contextualists embrace.
  *   **Overall**: The jab presents a *criticism* (arbitrariness) alongside a *logical consequence* (talking past) that contextualists accept, blurring the line. It frames the entire package ("arbitrary *and* talking past") as something contextualists accept, which is misleading. They accept the talking past consequence but vigorously deny it makes knowledge arbitrary.
