answer: |-
  Below is a decision tree that maps low-level commitments to positions in decision theory, designed to resolve disagreements about Counterfactual Mugging (CM) and XOR Blackmail (XB). The tree starts by granting the setup (correlation without causation) and progresses through load-bearing questions, each phrased to avoid presupposing a decision theory. The leaves are named positions (or "unnamed" if unexplored), with awkward commitments noted. Pairs of leaves that can't be separated are flagged, and empty combinations are diagnosed.

  ---

  ### **Decision Tree for Decision Theories**

  #### **Start**: Grant the setup:  
  *"I accept that an agent could be in a position where its choice correlates with, but doesn’t causally influence, something outside its light cone (e.g., a predictor’s prediction)."*  
  → If **rejected**, you’re at leaf:  
  - **Incoherent Predictor Camp**:  
    *Awkward commitment: Must dismiss Newcomb-like problems as impossible, undermining thought experiments central to decision theory.*  
  → If **accepted**, proceed to Branch 1.

  ---

  #### **Branch 1: Does the agent’s decision have to make a difference in the actual world?**  
  *(Or is it enough to consider what would happen in counterfactual branches?)*  
  - **Yes (Actual Difference Required)**: Proceed to Branch 2.  
  - **No (Counterfactual Branches Matter)**: Proceed to Branch 4.  

  ---

  #### **Branch 2 (from Branch 1: Yes)**: Is the link between the agent’s disposition and the payoff fundamentally **evidential** or **causal**?  
  *(Does the agent use observed correlations or causal models to evaluate outcomes?)*  
  - **Evidential**: Leaf: **Evidential Decision Theory (EDT)**.  
    *Awkward commitment: Pays in XOR Blackmail (evidencing a cooperative "type"), making it vulnerable to blackmailers who exploit correlations.*  
  - **Causal**: Leaf: **Causal Decision Theory (CDT)**.  
    *Awkward commitment: Refuses to pay in Counterfactual Mugging (no causal effect), forfeiting gains in the counterfactual where the coin flip differed.*  

  ---

  #### **Branch 3 (from Branch 1: No)**: Should the agent choose an **action** or a **policy/algorithm**?  
  *(Is the decision myopic or based on a cross-temporal/counterfactual rule?)*  
  - **Action**: Proceed to Branch 4.  
  - **Policy/Algorithm**: Proceed to Branch 5.  

  ---

  #### **Branch 4 (from Branch 3: Action)**: Does "the predictor could have known what I’d do" presuppose a **determinate fact** about a counterfactual agent?  
  *(Is there a fact of the matter about what you would do in unseen branches?)*  
  - **Yes (Determinate Counterfactuals)**: Leaf: **Unnamed (Counterfactual Actualism)**.  
    *Awkward commitment: Incoherent in XOR Blackmail—denies free will in counterfactuals while requiring it in the actual world.*  
    *Diagnosis: **Incoherent**—fails if predictors use logical dependence (e.g., XOR Blackmail).*  
  - **No (Indeterminate Counterfactuals)**: Leaf: **Unnamed (Counterfactual Skepticism)**.  
    *Awkward commitment: Rejects CM/XB as ill-posed, but this collapses into Incoherent Predictor Camp.*  
    *Diagnosis: **Incoherent**—contradicts the granted setup.*  

  ---

  #### **Branch 5 (from Branch 3: Policy/Algorithm)**: In XOR Blackmail, is the blackmailer’s threat a **precommitment you’d want to have made** or an **acausal trade to reason about impartially**?  
  *(This separates CM/XB responses and distinguishes UDT/FDT variants.)*  
  - **Precommitment (e.g., "I’d want my past self to have precommitted to paying")**: Proceed to Branch 6.  
  - **Acausal Trade (e.g., "I reason as if bargaining with the blackmailer from behind a veil")**: Leaf: **Acausal Decision Theory (ADT)**.  
    *Awkward commitment: Pays in XB even when the blackmailer is hostile, risking exploitation in asymmetric games.*  

  ---

  #### **Branch 6 (from Branch 5: Precommitment)**: Is the agent’s policy optimized for **logical** or **functional** dependence?  
  *(Does the policy handle logical uncertainty (math) or black-box functions?)*  
  - **Logical Dependence (e.g., "My algorithm’s output logically implies the predictor’s output")**: Leaf: **Updateless Decision Theory (UDT)**.  
    *Awkward commitment: Computationally intractable—requires solving logic puzzles to make decisions.*  
  - **Functional Dependence (e.g., "The predictor is a function of my decision algorithm")**: Leaf: **Functional Decision Theory (FDT)**.  
    *Awkward commitment: Same as UDT—pays in CM/XB, but struggles with logical uncertainty.*  
    *⚠️ **UDT and FDT are identical on operationalized cases** (e.g., CM, XB, Newcomb). The distinction is philosophical (logic vs. functions) and collapses here.*  

  ---

  ### **Leaf Summary & Notes**
  - **EDT**: Pays in XB to signal cooperativeness; loses to "smoking lesion" problems.
  - **CDT**: Refuses in CM; two-boxes in Newcomb.
  - **ADT**: Treats XB as acausal trade; pays but risks exploitation.
  - **UDT/FDT**: Pays in CM/XB; awkward in chaotic/ill-defined dependencies.
  - **Incoherent Predictor Camp**: Denies setups like Newcomb are possible.
  - **Unnamed (Counterfactual Actualism)**: Empty—incoherent under correlation.
  - **Unnamed (Counterfactual Skepticism)**: Empty—contradicts initial setup.

  ### **Empty Combinations & Diagnoses**
  - **Branch 4 → Yes/No**: Both paths empty.  
    *Diagnosis: **Incoherent**—"determinate counterfactuals" conflicts with free will; "indeterminate" voids the setup.*  
  - **Branch 2 → Other links (e.g., "logical")**: Not allowed.  
    *Diagnosis: **Unexplored**—actual-difference theories (EDT/CDT) don’t use logical links.*  

  ### **Key Separator: XOR Blackmail**
  - **EDT**: Pays (signals "good type").
  - **CDT**: Refuses (no causal effect).
  - **ADT**: Pays (acausal trade).
  - **UDT/FDT**: Pays (policy consistency).
  - **Incoherent Camp**: Scenario impossible.  

  XB exposes whether you view the threat as:  
  - **Precommitment/consistency** (UDT/FDT: "I’d want my policy to pay").  
  - **Acausal negotiation** (ADT: "I trade with the blackmailer’s algorithm").  
  - **Evidential signaling** (EDT: "Paying proves I’m reliable").  
  - **Causal impotence** (CDT: "Paying changes nothing").  

  ---

  ### **How to Use This Tree**
  1. **Start with the setup**: If your group disputes correlation without causation, they’re "Incoherent Predictor Camp."  
  2. **Move through branches**: Answer each question without invoking theory names.  
  3. **Identify splits**: XB is the critical separator between policy-based (UDT/FDT/ADT) and action-based (EDT/CDT) theories.  
  4. **Flag overlaps**: UDT/FDT are identical here; ADT is distinct in treating XB as trade.  

  This tree avoids relitigating "vibes" by forcing explicit commitments to operationalizable questions. If your friends endorse the setup but refuse to pay in XB, they likely land in CDT or the incoherent end of Branch 4. If they pay but deny "acausal trade," they’re UDT/FDT.
