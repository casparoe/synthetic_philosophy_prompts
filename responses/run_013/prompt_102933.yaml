prompt: |-
  Ok so I run research at a small policy shop that puts out "what history teaches" briefs, and I keep getting into fights with my own writers about what we're allowed to say caused something. The fights are always the same shape: some event has like five plausible causes and every one of them looks like it would have been enough on its own. My writers want to just pick the one that feels deepest and move on. I want a spec I can hand them instead of having this argument every month. We mostly do financial crises and state breakdowns, and our running example is a mid-size regional bank that went under in 2011 after a fraud, a funding shock, and a regulator who was slow by about six weeks — and our writers keep claiming each of those three was, by itself, sufficient to kill the bank, which is either true and a nightmare for our sentences or false and we should stop saying it.

  Before I read one more thing about causation in history, give me the desiderata. What does any theory of "X caused Y" in historical explanation actually have to deliver? I want:

  - the cases it has to get right — two genuinely independent sufficient causes; a cause that only did its work because another cause had already happened; the trigger versus the background condition; the case where you remove any one of the causes and the outcome still happens; the trivial contributing cause that nobody would ever name in a sentence; and the case where a cause was necessary but not sufficient and another was sufficient but not necessary
  - the distinctions it can't collapse — cause vs condition vs background; necessary vs sufficient vs contributing; "caused it" vs "made it more likely"; and the difference between picking a cause to tell a story and identifying one for counterfactual purposes
  - whatever it can't contradict, including that the counterfactual can only ever be run in our heads, that historians have to select or they can't finish a sentence, and that we can't rerun the bank.

  Then tell me which of these are real requirements and which are just the prejudices of one camp. I have a suspicion that "the theory must name a single cause" is a prejudice and not a requirement, but I can't articulate why. If some of the requirements can't all be satisfied at once, that's the part I care about most — say which subset conflicts and why, because that would explain why this argument keeps happening.

  One more thing to settle: a colleague keeps insisting the theory must be able to tell us when two causes are "the same cause" — he says otherwise we double-count the fraud and the bad loans that made the fraud possible. Is that a genuine desideratum or is it just somethign he wants so his briefs get shorter? And separately, another writer says a cause only counts if you can describe a change that would have altered the outcome without altering anything else — should that be on the list as a requirement, or is it a preference for a certain style of explanation? Flag both, don't just answer them.

  Skip scoring the named theories against the list, I'll do that with the team in a seperate meeting. Lead with your bottom line in the first sentence and then give the reasoning — no warm-up, don't restate what I asked.
reasoning: |-
  Okay, the user runs a policy research shop dealing with historical briefs, specifically on financial crises and state breakdowns. They're constantly battling with writers over attributing causes to events where multiple factors seem sufficient on their own. The example given is a bank collapse in 2011 involving fraud, a funding shock, and slow regulation—each argued as independently sufficient. The user needs a clear set of criteria for causation theories to settle these disputes.

  First, I need to outline the essential requirements for any theory of causation in historical explanations. The user provided specific cases that the theory must handle: multiple sufficient causes, preconditions, triggers vs. backgrounds, cases where removing one cause still leads to the outcome, trivial factors, and necessary vs. sufficient causes. They also want distinctions like cause vs. condition, necessary vs. sufficient, and not conflating explanatory selection with counterfactual analysis. Plus, they mention constraints like the impossibility of rerunning history and the necessity of selection by historians.

  The colleague's point about not double-counting causes (like fraud and bad loans) needs evaluation. Is this a real requirement or just a preference for brevity? Also, the writer's idea that a cause must allow a specific counterfactual change—should that be mandatory? These points need careful consideration.

  Looking at the deeper needs: the user likely wants to standardize their methodology to prevent recurring arguments, ensuring their briefs are credible and consistent. They might also be seeking academic rigor without getting bogged down in philosophical debates. The conflicts suggest their team might prioritize narrative simplicity, while the user values nuanced accuracy. Balancing these is key.

  Assessing the desiderata: Some requirements conflict. For example, demanding both necessary and sufficient conditions in cases like overdetermination (multiple sufficient causes) is tricky. If each cause is sufficient alone, none is necessary. Historians must select causes for narratives, but counterfactual analysis requires considering all factors. This tension explains the recurring disputes.

  Regarding the colleague's point: Avoiding double-counting is useful for clarity but not fundamental. It's more about presentation. The writer's counterfactual requirement is a methodological preference (e.g., possible worlds approach) but not essential, as some valid causes don't allow isolated changes.

  Bottom line: A causation theory must handle overdetermination and distinguish selection from counterfactual necessity. Not all desiderata can be satisfied simultaneously, leading to inevitable team conflicts. The core conflict is between necessary/sufficient conditions and overdetermination cases, plus the practical need for selective storytelling versus comprehensive analysis.
answer: |-
  Your core requirement is a theory that handles **overdetermination (multiple sufficient causes) without collapsing necessary/sufficient distinctions or denying the historian’s need for selective explanation, while accommodating counterfactual reasoning despite historical irreversibility.** Here are the desiderata, categorized and assessed for necessity and conflicts:

  ---

  ### **I. Cases the Theory MUST Get Right (Non-Negotiable)**
  1.  **Multiple Independent Sufficient Causes (Overdetermination):** E.g., the bank failure: Fraud *alone* (if large enough), Funding Shock *alone* (if severe enough), Regulatory Failure *alone* (if prolonged enough) could each have caused failure. The theory must acknowledge all three as sufficient without implying any was necessary.
  2.  **Preconditions/Enablers vs. Triggers:** E.g., Bad loans (precondition enabling fraud) vs. the specific fraudulent transaction (trigger). Removing a precondition *prevents* the trigger from being effective; removing the trigger *prevents* that specific pathway but not others (e.g., funding shock could still cause failure).
  3.  **Joint Necessity/Sufficiency (INUS Conditions):** A cause that is an *I*nsufficient but *N*ecessary part of an *U*nnecessary but *S*ufficient set. E.g., The fraud was necessary *for the fraud pathway* to cause failure (a sufficient set including lax oversight), but failure could have occurred via other sufficient sets (funding shock pathway).
  4.  **Redundancy/Removability:** Cases where removing *any one* of several causes still results in the outcome due to other sufficient causes remaining (the bank case). The theory must allow outcomes even if a contributing factor is absent.
  5.  **Trivial Contributing Causes:** E.g., A minor clerical error slightly delaying detection. The theory must distinguish these from "core" causes without denying their factual contribution.

  ---

  ### **II. Distinctions the Theory MUST Preserve (Non-Negotiable)**
  1.  **Cause vs. Condition/Background:** Causes are active factors altering probability/outcome; conditions are stable states enabling causes to operate (e.g., "fraud" is a cause, "weak internal controls" is a condition). The theory must explain *how* a factor actively contributed, not just that it was present.
  2.  **Necessary vs. Sufficient vs. Contributing:** Necessary (outcome doesn’t happen without it), Sufficient (outcome happens if it occurs), Contributing (increases likelihood but isn’t necessary or sufficient alone). **This is the core conflict zone:** Writers conflate "sufficient in context" with "necessary," ignoring overdetermination.
  3.  **"Caused It" vs. "Made It More Likely":** Must distinguish deterministic sufficiency ("caused it") from probabilistic influence ("made it more likely"). Many "sufficient" causes in history are probabilistic (highly likely, not guaranteed).
  4.  **Explanatory Selection vs. Counterfactual Identification:** *Why we pick a cause for a narrative* (simplicity, novelty, relevance) is distinct from *assessing its causal role* via counterfactuals (would Y still happen if X was absent?). Writers confuse narrative focus with causal primacy.

  ---

  ### **III. Constraints the Theory MUST Accept (Non-Negotiable)**
  1.  **Irreversibility:** Counterfactuals are mental exercises; we cannot rerun history. The theory must rely on evidence-based reasoning, not experimentation.
  2.  **Selectivity:** Historians *must* select causes for coherent explanation; a theory demanding exhaustive listing is useless. The theory must guide *principled* selection, not forbid it.
  3.  **Context-Dependence:** Causal strength (necessity/sufficiency) depends on the specific historical context (e.g., a funding shock sufficient in 2011 might not be in 2005). The theory cannot demand context-independent causes.

  ---

  ### **IV. Contentious Points: Genuine Requirement or Preference?**
  1.  **"Single Cause" Requirement:** **Prejudice.** Directly contradicts overdetermination (Case 1) and the need for INUS conditions (Case 3). Driven by narrative simplicity, not causal reality.
  2.  **"No Double-Counting" (Fraud vs. Bad Loans):** **Primarily Preference.** Avoiding double-counting aids clarity/parsimony, but it’s not fundamental. Fraud and bad loans are distinct causal factors (one an act, one a condition). A theory *can* list both if they played distinct roles. Your colleague prioritizes concise narratives.
  3.  **"Alter Outcome Without Altering Anything Else":** **Preference for a Style (Mechanistic Counterfactuals).** This reflects a "difference-making" or "interventionist" view (e.g., Woodward). It’s useful for policy (identifying levers) but **not essential**. Many valid historical causes (e.g., "rising inequality") cannot be isolated this way. Your writer prefers actionable/policy-relevant explanations.

  ---

  ### **V. Key Conflicts Between Desiderata (Why the Fights Happen)**
  1.  **Overdetermination vs. Necessity/Sufficiency Distinction:** Writers see "sufficient" and treat it as *the* cause, ignoring that *other sufficient causes exist*. This collapses the distinction and denies overdetermination. **Conflict:** Insisting on naming a "single sufficient cause" violates the requirement to handle multiple sufficient causes (Case 1) and preserves the necessary/sufficient distinction poorly.
  2.  **Selectivity vs. Counterfactual Completeness:** Counterfactual analysis asks "What if *all* plausible causes were absent?" Selectivity requires ignoring some causes for the narrative. **Conflict:** Writers select the "deepest" cause for narrative, ignoring counterfactuals showing other sufficient paths. You demand counterfactual rigor conflicting with their narrative need.
  3.  **Joint Necessity (INUS) vs. Sufficiency Claims:** Writers call fraud "sufficient," ignoring it relied on enabling conditions (bad loans, lax oversight). **Conflict:** Their claim is true only *within a specific pathway* (the INUS set), not absolutely. The theory must reconcile "sufficient in context" with "insufficient alone."

  ---

  **Bottom Line:** A viable theory must **explicitly embrace overdetermination and INUS conditions**, rigorously **separate necessity/sufficiency**, and **distinguish counterfactual analysis from explanatory selection**. The core conflict arises because your writers prioritize *narrative simplicity* (selecting one "sufficient/deep" cause) over *causal complexity* (overdetermination, INUS), collapsing necessary/sufficient distinctions. Resolving your fights requires enforcing this separation and accepting that multiple sufficient causes can coexist without any being necessary. The "single cause" demand is indefensible for your cases.
