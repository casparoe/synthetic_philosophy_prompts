  ok so I've been lurking in reliabilism / easy-knowledge threads for years and there's this analogy that keeps coming up: a reliabilist knowing his eyes are reliable because they keep working is like a newspaper vouching for itself, or checking a clock against the clock. the move is always the same — you don't get to certify an instrument with that instrument, so reliabilism is just handing out knowledge for free, so reliabilism (or anything that lets you know your faculties are fine by using them) is a non-starter. I buy the vibe but I don't trust the analogy to carry that much weight. can you do it properly: the correspondence table — what plays the paper, the presses, the reader, the editorial board, the article about the paper's own accuracy — and then the same table for the other version, the one where someone reads a gauge over and over and then concludes gauges are reliable, where I honestly can't tell what the newspaper is supposed to be. then the places the mapping breaks, seperating the breaks that matter for his conclusion from the ones that don't. does the conclusion survive? and if the newspaper thing is doing work it shouldn't, what analogy would actually do the job.
