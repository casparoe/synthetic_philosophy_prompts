  ## OFFER FOR SUBSCRIPTION  
  THE INDUCEMENT BANK LIMITED  
  (incorporated under the Companies Act 2006)  

  **1. Chairman’s Letter**  
  Dear Prospective Subscriber,  

  The Board of The Inducement Bank Limited (the “Bank”) invites you to participate in a pioneering financial enterprise founded upon a demonstrably efficient conception of monetary value. We reject the outdated notion that wealth resides inherently in inert metals. True prosperity arises solely from the application of human industry to the productive resources available to a nation.  

  The Bank’s purpose is to unlock this latent productive capacity. We operate on the principle that money, whether manifested as physical tokens or digital entries, functions most effectively as **a ticket or counter**. Its utility lies not in any intrinsic commodity value, but exclusively in its power to facilitate the recording, transfer, and – crucially – the *inducement* of labour and the exchange of its fruits. Our Value Units (“VUs”) are engineered to stimulate industry and enable the equitable sharing of its output, thereby maximising national wealth derived from land, resources, and human endeavour.  

  We believe this represents a significant evolution beyond conventional banking, aligning monetary instruments directly with the generative forces of the real economy. Your subscription supports this vital innovation.  

  Yours sincerely,  
  Algernon Finch-Hatton  
  Chairman  

  **2. Nature of Value Units (VUs)**  

  2.1 The Bank issues Value Units (VUs), denominated in standard numerical units (e.g., 1 VU, 10 VU, 100 VU). These VUs constitute the Bank’s primary circulating medium.  

  2.2 **VUs are not claims upon specific commodities** (such as gold or silver bullion), nor do they derive value from any inherent material property. They are tokens of account.  

  2.3 **VUs represent transferable claims upon the current and future productive output** of the national economy, facilitated through the Bank’s operations. Their fundamental purpose is:  
      (a) To serve as a universally accepted mechanism for reckoning value;  
      (b) To enable the recording of credits and debits arising from economic activity;  
      (c) To facilitate the exchange of goods and services produced by labour applied to natural resources;  
      (d) To stimulate industry by providing a readily transferable instrument signifying a claim on the fruits of others' labour, thereby encouraging reciprocal production.  

  2.4 **The Utility of VUs** is therefore intrinsically linked to their circulation and their role in motivating productive effort. Value resides not in the VU itself, but in the labour and resources it helps mobilise and exchange.  

  **3. Mechanism of Issuance and Backing**  

  3.1 The Bank, in consultation with its appointed **National Productivity Council** (comprising representatives from key productive sectors), determines the volume of VUs to be issued into circulation.  

  3.2 **The basis for issuance is an assessment of the nation’s underutilised productive capacity**, including:  
      (a) Available land and natural resources;  
      (b) The current level of productive employment;  
      (c) Potential for increased output through the application of additional labour or improved methods;  
      (d) The requirement for a circulating medium sufficient to facilitate existing and anticipated exchanges of goods and services.  

  3.3 **VUs are brought into circulation primarily through:**  
      (a) **Productive Loans:** Advances made to enterprises and individuals demonstrably engaged in generating tangible goods or services (e.g., agriculture, manufacturing, infrastructure development, education). Repayment is anticipated from the future output stimulated by the loan.  
      (b) **Public Works Financing:** Facilitating state investment in projects enhancing national productive capacity or essential infrastructure, funded by VU issuance against the anticipated future increase in collective wealth.  

  3.4 **What "Backs" VUs?**  
      VUs are backed by the **collective confidence** in their efficacy as tickets to command a share of the nation’s productive output, and by the **regulatory framework** establishing the Bank and its governance. Their value is sustained by the **continued circulation and productive employment** they induce. The Bank holds no specific commodity reserve against VU liabilities, as such reserves are deemed irrelevant to the ticket’s function. The denomination of a VU (e.g., "1 VU") is a unit of account independent of any named commodity.  

  **4. Principal Risks to Subscribers and VU Holders**  

  Prospective subscribers and holders of VUs should carefully consider the following principal risks:  

  4.1 **Public Confidence Risk:** The value and utility of VUs are entirely dependent upon widespread public acceptance and willingness to exchange goods and services for them. A significant loss of confidence in the Bank, the National Productivity Council, or the VU system itself could rapidly diminish the willingness of parties to accept VUs in exchange, potentially rendering them ineffective. The Bank has no obligation to redeem VUs for gold, silver, or any other commodity.  

  4.2 **Productivity & Labour Risk:** The efficacy of VUs in commanding goods and services is contingent upon the existence of a sufficient volume of desired goods and services being produced and offered in exchange. Should a significant proportion of the labour force become unwilling or unable to engage in productive activity, or should key resources become unavailable, the real value represented by VUs could depreciate substantially. VUs represent a claim on *available* output; they do not guarantee its existence.  

  4.3 **Hoarding Risk:** The Bank’s model relies on the active circulation of VUs to stimulate industry. Should a significant number of holders choose to retain VUs indefinitely rather than exchanging them for goods/services or productive investment ("hoarding"), the intended stimulative effect on industry may be materially reduced, potentially leading to economic stagnation which could further undermine VU utility.  

  4.4 **Governance & Issuance Risk:** Determining the "correct" volume of VUs to issue involves complex judgements by the National Productivity Council and the Bank regarding underutilised capacity and future productivity. Errors in this judgement, whether leading to excessive issuance (potentially diminishing confidence and perceived value per VU) or insufficient issuance (failing to fully stimulate available productive capacity), could adversely impact the stability and effectiveness of the VU system and the economy it supports.  

  4.5 **Regulatory & Political Risk:** The Bank operates under a specific legislative mandate. Changes in government policy, legislation, or regulatory approach hostile to the Bank’s operating principles could materially impair its operations and the viability of VUs.  

  **5. Use of Proceeds**  

  Proceeds from this subscription will be used:  

  5.1 To establish the Bank’s operational infrastructure, including secure VU issuance systems (physical and digital), lending platforms, and clearing mechanisms.  
  5.2 To provide initial capital for the Productive Loan programme (Section 3.3a).  
  5.3 To fund the establishment and initial operations of the National Productivity Council.  
  5.4 For general corporate purposes.  

  **6. Dissenting Viewpoint (Submitted by a Subscriber)**  

  *“While the theoretical elegance of divorcing money from commodity value is intellectually stimulating, I harbour significant reservations regarding practical implementation. The entire system rests on the perpetual motion of public confidence and continuous productive activity. History suggests confidence is fragile, often requiring a tangible anchor. What compels a labourer to accept a VU for their toil tomorrow, if they doubt its ability to secure bread the day after? The ‘backing’ by future productivity feels ethereal compared to the weight of specie, however theoretically misguided that weight might be. This model appears vulnerable to a downward spiral: a loss of confidence reduces the incentive for production, which diminishes the value of the VU, further eroding confidence. The absence of convertibility into *anything* concrete leaves the VU holder fundamentally reliant on the goodwill and industry of others – a precarious foundation for a national currency, however well-intentioned the design.”*  
  - *Dr E. M. Thorne, FBA*

  ---
  **This document constitutes an offer for subscription of shares in The Inducement Bank Limited. Potential investors must refer to the full Prospectus and Risk Factors document. The value of investments may go down as well as up. The Bank does not offer deposit protection under the Financial Services Compensation Scheme. Past performance of the underlying theory is no guarantee of future results.**
