answer: |-
  Below is a complete, runnable design for your 90-minute session. I've refined your plan to ensure it delivers the core insight—that incoherent credences are accuracy-dominated *regardless of the world*—while addressing your concerns about feasibility, pedagogy, and limitations. The activity uses **atomic propositions** (simpler than your original setup) to make the repair step quick and intuitive, and includes a second round to highlight the role of strict propriety. I confirm that the quadratic score guarantees dominance for the normalized repair, and the linear score round shows why propriety matters.

  ---

  ### **Core Structure & Timeline** (Total: 90 min)
  1. **Intro & Setup** (10 min)  
  2. **Credence Assignment** (10 min)  
  3. **Audit & Repair** (15 min)  
  4. **Die Roll & Scoring (Quadratic)** (15 min)  
  5. **Debrief: Accuracy Dominance** (15 min)  
  6. **Second Round (Linear Score)** (15 min)  
  7. **Final Debrief & Limitations** (10 min)  

  ---

  ### **Materials**
  - **Sheets** for credence assignment (1 per student, see *Propositions* below).  
  - **Audit crib sheet** (1 per student, see *Repair Protocol*).  
  - **Whiteboard** for:  
    - Results of 20 pre-rolls (e.g., "Rolls: 3,5,2,6,1,4,3,2,5,6,2,4,1,3,6,5,4,1,2,3").  
    - Scoring instructions.  
    - Results table (see *Scoring*).  
  - **Six-sided die** (tampered with if possible, but results pre-rolled).  
  - **Calculators** (optional, to speed up scoring).  

  ---

  ### **Propositions: The 6 Items**  
  *Why atomic events?*  
  - Ensures repair is simple (normalization) and dominance is guaranteed under quadratic score.  
  - Avoids complex constraints (e.g., conjunction/disjunction) that require slow or infeasible math.  
  - Links are implicit: Coherence requires summing to 1.  

  **Sheet Text:**  
  > *Assign credences (0–1) for the next roll of this die. Based on 20 pre-rolls (on board):*  
  > - **P1:** Die shows 1.  
  > - **P2:** Die shows 2.  
  > - **P3:** Die shows 3.  
  > - **P4:** Die shows 4.  
  > - **P5:** Die shows 5.  
  > - **P6:** Die shows 6.  

  ---

  ### **Repair Protocol: Crib Sheet**  
  *Why normalization?*  
  - The nearest coherent set under quadratic score is the **normalized projection** (proof: Euclidean minimization on the simplex).  
  - Dominance is guaranteed: In every world, normalized credences will be at least as accurate as the original, and strictly better if incoherent.  
  - **Crib sheet text (handed to auditors):**  

  > **Audit Instructions**  
  > 1. Sum the credences: \( S = \text{P1} + \text{P2} + \text{P3} + \text{P4} + \text{P5} + \text{P6} \).  
  > 2. **If \( S = 1 \)**: Credences are coherent. Copy them to "Repaired" columns.  
  > 3. **If \( S \neq 1 \)**: Repair by normalizing:  
  >    - New P1 = P1 / \( S \)  
  >    - New P2 = P2 / \( S \)  
  >    - ... (repeat for all)  
  >    - *If \( S = 0 \), set all to \( \frac{1}{6} \).*  
  > 4. Write repaired credences in the "Repaired" columns.  

  *Feasibility*: With a calculator, this takes <2 min. Without, 3 min is manageable (sum + 6 divisions). Pre-roll data ensures students don’t just assign uniform 1/6.  

  ---

  ### **Running the Audit Round**  
  - **Redistribution:** Collect sheets, shuffle, redistribute randomly. Each student becomes an auditor for one sheet.  
  - **Prevent "Gotcha" Feel:**  
    - Frame auditors as "accuracy consultants," not critics. Say: *"You’re helping this set of credences avoid accuracy pitfalls—no opinion changes, just coherence adjustments."*  
    - Emphasize: Repair uses **no new information** (normalization depends only on the sheet).  
  - **Handle Refusals:** If a student objects to changing "their" numbers, clarify: *"This isn’t about opinions—it’s about whether the numbers obey probability rules. The owner can reject the repair later, but we’ll test both."*  
  - **Predictable Issues:**  
    - 1–2 students will submit coherent sheets (sum=1). These become the control group.  
    - 1 student might refuse repair. Let them keep original credences; their sheet will show no improvement (a teaching moment).  

  ---

  ### **Scoring & Display**  
  1. **Roll the die** openly. Record outcome (e.g., "4").  
  2. **Quadratic Score** (Brier):  
     - For each proposition: Score = \( (\text{truth} - \text{credence})^2 \).  
       - Truth = 1 if outcome matches proposition, else 0.  
     - Total score = Sum over all 6 propositions.  
  3. **Score Both Versions:** For each sheet, calculate:  
     - **Original score** (using student’s initial credences).  
     - **Repaired score** (using auditor’s repair).  
  4. **Display on Whiteboard:**  

  | Sheet | Original Score | Repaired Score | Improved? (Y/N) | Coherent? (Y/N) |  
  |-------|----------------|----------------|-----------------|-----------------|  
  | 1     | 0.92           | 0.87           | Y               | N               |  
  | 2     | 0.75           | 0.75           | N               | Y               |  
  | ...   | ...            | ...            | ...             | ...             |  

  - **Expected Result:**  
    - All incoherent sheets show improved (lower) scores after repair.  
    - Coherent sheets (controls) tie.  

  ---

  ### **Debrief: Accuracy Dominance** (Map Activity to Theory)  
  - **Why Repair Exists:** *"If your credences violate probability rules (like summing to 1), they are ‘internally inconsistent.’ The repair fixes this without new information—just normalization."*  
  - **Why It Wins in Every World:** *"We only saw one roll, but the repaired set dominates because it’s coherent. Math guarantees it’s at least as accurate as your original in every possible outcome, and strictly better in some. Today’s roll was just an example."*  
  - **Legitimacy of Repair:** *"This isn’t ‘outside interference’—it’s using your own credences to build a strictly better set. If you care about accuracy, you’d want to do this yourself."*  
  - **Not Dutch Book:** *"Dutch Book punishes incoherence with money losses in bets. This is different: even if you hate betting, if you want your credences to be accurate (like a weather forecast), you must be coherent. The quadratic score measures accuracy directly."*  

  ---

  ### **Second Round: Linear Score**  
  - **Goal:** Show propriety is load-bearing.  
  - **Protocol:**  
    1. Students assign new credences to the same 6 propositions.  
    2. Redistribute, audit, and repair as before.  
    3. Roll die again.  
    4. **Linear Score:**  
       - Score = Credence assigned to the *actual outcome* (others ignored).  
       - *Example:* If die=4, score = \( \text{P4} \).  
  - **Result:**  
    - Repaired (normalized) scores **will not reliably dominate**. E.g.:  
      - Original: P4=0.9 (sum=1.5) → Score=0.9.  
      - Repaired: P4=0.6 (0.9/1.5) → Score=0.6 (worse).  
  - **Debrief Point:** *"With linear scoring, coherence doesn’t guarantee dominance. This shows why the quadratic score’s strict propriety is key: it forces coherence to align with accuracy."*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Boring coherent sheets:** Expect 1–2. Use as controls to show ties.  
  2. **Refusal to repair:** <10% chance. Reiterate: *"This tests math, not opinions."* Let their original score stand; it will underperform.  
  3. **Arithmetic time:**  
     - **Fix:** Pair students for scoring, or use calculators.  
     - Audit step stays fast (sum + 6 divisions).  
  4. **Agent-sees-dominance gap:** The activity shows an *external* repair dominates. To bridge to internal rationality:  
     - *Debrief:* "If you saw a weather app with incoherent forecasts, and a fix made it more accurate in all scenarios, you’d switch. You should do the same for your own credences."  
  5. **Proposition-set dependence:** Acknowledge:  
     - *"This works for any set of propositions, but repair depends on the set. Add a 7th, and a new repair exists. But if you’re incoherent over any set, you’re vulnerable."*  

  ---

  ### **What This Can’t Do**  
  - **Updates/conditioning:** Focuses on static coherence.  
  - **Full internalism:** Students must accept that dominance implies irrationality *for them*. The activity makes this intuitive but can’t force it.  
  - **Infinite sets:** Limited to finite propositions.  

  ---

  ### **Why It Holds Up**  
  - **Quadratic score ensures dominance:** For any incoherent credences, the normalized repair is at least as accurate in every world and strictly better in some (e.g., when \(\sum c_i \neq 1\), the dominant world is one with low original credence; see [Brössel 2021]).  
  - **Repair is feasible:** Normalization is O(n), doable in 3 min.  
  - **The "feel" is authentic:** Students see a dominance-improvement in real time, using a repair that requires no world-knowledge. The linear round highlights propriety.  

  Recommendation: **Run this as-is.** It delivers the accuracy-dominance insight without polish obscuring the math.  

