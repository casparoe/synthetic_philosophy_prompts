prompt: |-
  Hey, I'm a high schooler who reads way to much philosophy of physics online, so I want you to act like a philosopher of physics who's good at explaining things to a smart teenager. Think carefully before answering, and brainstorm a couple of possible directions first before you commit to one. So, Newton's bucket: water in a spinning bucket climbs the walls, Newton said that shows the water is really rotating relative to space itself, while Leibniz and Mach said the only rotation that matters is rotation relative to the rest of the matter in the universe. Give me an example of a conceptual issue this actually raises, but not the standard one everyone always gives. Here's my twist: first, imagine a universe containing nothing but a bucket of water and one small rock really far away; then imagine instead that the whole thing is a video game whose code only ever stores where things are relative to each other, with no absolute grid anywhere in the code. Use the game version to make the issue concrete, explain why it's a genuine issue and not just me being confused, and say what a substantivalist and a relationist would each have to say about it. No citations or reading lists please, I can't look anything up.
