prompt: |-
  My old lab partner has fallen for a line of thinking I half agree with. He says that when you call fabricating data "wrong" you're not stating a fact that could be true or false — you're just venting a feeling, the way you'd shout at a bad driver. As a scientist I've got alot of sympathy for that; it's the only picture that sits comfortably with everything being ultimately physical. The trouble is he won't stop there. He'll happily argue: if fabricating data is wrong, then publishing a paper you know is built on fabricated data is wrong; fabricating data is wrong; so publishing that paper is wrong. And that's a real argument — the conclusion does follow. But look at the middle bit. The first time "fabricating data is wrong" shows up it's tucked inside an if-clause, and he isn't venting anything there, he's just supposing it; the whole if-sentence is the sort of thing that can be true or false. So the same words seem to be doing two completely different jobs, and I can't see how his "it's just a feeling" story covers the second one.

  He reckons he's got an answer: that when a moral claim turns up inside an if-clause, or under a "maybe", or in a question, it's still expressing an attitude, just a more complicated one, and that's why we're allowed to call moral claims true and reason with them. To me that sounds like he's relabelled the problem rather than solved it, but I'm new to all this and might be missing something.

  What should I say to him? Start with your bottom line in the first sentence, then give the reasoning, and please don't restate my question or warm up first. Keep it in plain terms — I'm a retired chemist, not a philosphy professor.
reasoning: |-
  Okay, let me tackle this chemist's problem. His lab partner is pushing emotivism—claiming moral statements are just emotional outbursts, like shouting at bad drivers. The chemist partially agrees because it fits a physicalist worldview. But here's the snag: the partner uses moral claims logically, like in "If fabricating data is wrong, then publishing fabricated data is wrong." That conditional isn't emotional; it's a factual inference. 

  Hmm. The partner's solution—that embedded moral claims express "complex attitudes"—feels like a dodge. If "fabricating data is wrong" in the if-clause expresses a hypothetical attitude, what does that even mean? Attitudes aren't true/false, yet we treat them as such in logic. This gap seems fatal. 

  I recall Blackburn's quasi-realism tries to bridge this by simulating truth-aptness for moral language. But simulating isn't solving—the chemist’s instinct is right. Maybe point out that even if emotions drive morality, we reason about them as if they’re objective because the practice demands it. But the partner might call that circular. 

  Alternative angle: logical inferences require truth-bearing premises. If "wrong" is just booing, the if-then statement shouldn't work. Yet it does. That’s the core inconsistency. Emotivism struggles with moral logic, period. The chemist should press this: "Your theory can’t explain why we reason with moral claims like facts." Keep it plain—no philosophy jargon. Focus on the conditional trap he’s already spotted. That’s the lever.
answer: |-
  Your partner's "complicated attitude" solution doesn't explain how we actually reason with moral claims—it just papers over the problem. Here's why:

  1.  **Logic needs truth-aptness:** When he says *"IF fabricating data is wrong, THEN publishing it is wrong,"* this only works as a logical argument because both the "if" part and the "then" part are treated as things that can be true or false. Logic deals with truth values.
  2.  **Attitudes aren't true/false:** If "fabricating data is wrong" is *only* an expression of a feeling (like booing), then it isn't true or false. It's just a noise you make. You can't plug a feeling or a boo into an "if...then..." statement logically. Saying "IF [boo], THEN..." is nonsense.
  3.  **"Complicated attitude" is vague:** Saying the "if" clause expresses a "more complicated attitude" doesn't solve this. What *is* that complicated attitude? How does expressing it make the sentence suddenly capable of being true or false in the way logic requires? Saying "I'm *hypothetically* booing" doesn't turn my boo into a fact. The logic still demands something that can be true/false.
  4.  **We treat moral claims like facts in reasoning:** In everyday life *and* in arguments like your partner's, we treat moral claims ("X is wrong") as if they *are* the kind of things that can be true or false. We use them in deductions ("If P is wrong, and Q causes P, then Q is wrong"). His theory says they aren't true/false, but his *practice* (and ours) requires them to be. This is the core inconsistency.

  **Your bottom line:** *His theory can't explain how we actually use moral claims in logical arguments like the one he himself makes.* Saying "it's a complicated attitude" doesn't show how an attitude magically becomes truth-apt (capable of being true/false) inside an "if" clause; it just asserts it. The fundamental problem remains: logic needs truth, but his theory says moral claims don't provide it. Point out this clash between his explanation and his own reasoning.
