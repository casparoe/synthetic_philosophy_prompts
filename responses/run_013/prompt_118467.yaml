  I want a scenario where the self-sampling assumption and the self-indication assumption give opposite verdicts about one ordinary decision -- take a bet, pay a small cost, press a button, whatever -- and where the disagreement isnt just the doomsday argument's population-size intuition in a new coat. To be clear about what I mean, I'm using SSA for the rule that you treat yourself as randomly drawn from the observers in your world, and SIA for the rule that a world with more observers gives you more chances to be you. Constraints: the total number of observers has to be finite, the prior over how many observers exist has to be a genuine probability distribution, so no improper prior, no infinite universe, and no tiny chance of a huge universe doing all the work, and the scenario should be something a normal person could at least imagine facing, no new physics or brain-in-a-vat stuff. Keep the scenario itself to a paragraph or so. I'd also like it if the case turns on something a bit more specific than your existence being evidence about the crowd size -- maybe indexical uncertainty, or the difference between being randomly selected from observers versus being selected by your own identity, or how the payoff scales with the number of people who exist. If you can make the case hinge on a finite selection mechanism that I can actually draw as a tree, even better.

