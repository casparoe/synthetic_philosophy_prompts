  We sample uniformly from the set of all observers. The probability of being any particular rank is 1/N if that rank exists. So, the probability of being rank 5e10 given a theory is:
  - P(rank | S) = 1/(10^11)   [if 5e10 <= 10^11, which it is]
  - P(rank | L) = 1/(10^13)
  - P(rank | V) = 1/(10^30)

  Then, by Bayes, the posterior for each theory is proportional to the prior times the likelihood.

  Under SIA (B's view):
  We condition on the fact that we exist, and we weight by the number of observers. The likelihood of a theory is proportional to the number of observers it posits. So, P(exist | H) is proportional to the number of observers in H. But note: we also have the rank information. How does B incorporate the rank?

  B's view (SIA) typically says: the probability of the data (which includes both that we exist and that we have a particular rank) is proportional to the probability that there is an observer with that rank in the theory, and then we sample uniformly from the observers. But in SIA, the prior is tilted by the number of observers. So:

