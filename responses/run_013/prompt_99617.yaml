  P(H | data) ∝ P(data | H) * P_SIA(H)
  where P_SIA(H) ∝ N_H * P_0(H)

  But P(data | H) = P(being rank 5e10 | H) = 1/N_H   (if 5e10 <= N_H, else 0)

  Therefore, the posterior becomes:
  P(H | data) ∝ (1/N_H) * (N_H * P_0(H)) = P_0(H)

  So the posterior is the same as the prior. That's B's point: the rank evidence is exactly canceled by the SIA prior.

