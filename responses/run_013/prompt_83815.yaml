  Move (4): Here Ines cleverly turns Rafael's vagueness point against him. If sentience boundaries are vague, binary status must be vague too. Her "hedonic zero" concept is promising but she doesn't explain how status ramps up from there. Rating: Largely right.

  Move (5): Rafael scores by showing Ines has merely relocated the threshold problem to sentience itself. The thermostat challenge exposes real weaknesses in functionalist definitions. But he overlooks that "feeling" might be an emergent property. Rating: Mostly right.

  Overall, Rafael edges this debate because he defends a logically coherent position while Ines struggles to explain how her gradient emerges from a vague boundary. But both miss a key insight: what if moral status isn't about capacities at all, but about our duties to different beings? A relational approach could acknowledge neurological gradients while avoiding both proportionalism and sharp thresholds. For instance, we might have stronger duties to beings with richer inner lives, but still have basic duties to all sentient creatures regardless of complexity. This resolves Rafael's thermostat worry while honoring Ines' biological continuum.

