  **Handout: Where do you stand on the consistency of mathematics?**

  Starting point: We all agree that if we allow every predicate to define a set (unrestricted comprehension), we get a contradiction (Russell's paradox). Also, we have no absolute proof that the usual axioms of arithmetic are consistent. So, the possibility that our mathematics is inconsistent is real.

  Answer the following questions to find your position.

  **Question 1:**
  Is the principle of explosion (that from a contradiction, any statement follows) valid?
     - A. Yes.
     - B. No.

  If you answered A (Yes), go to Question 2.
  If you answered B (No), go to Question 3.

  **Question 2:**
  How do we avoid contradictions like Russell's paradox in set theory?
     - A. By restricting the comprehension principle (so not every predicate defines a set).
     - B. By adopting a constructive approach to sets and using intuitionistic logic.

  If you answered A, go to Question 4.
  If you answered B, you are an **Intuitionist**. 
     - *Most awkward commitment:* Rejecting the law of excluded middle for infinite collections.

  **Question 3:**
  In light of paraconsistent logic (which avoids explosion), should we keep the unrestricted comprehension principle for sets?
     - A. Yes.
     - B. No.

  If you answered A, go to Question 5.
  If you answered B, go to Question 6.

  **Question 4:**
  For classical set theory (with restricted comprehension, e.g., ZFC), why is consistency important?
     - A. Because an inconsistent theory cannot be true of the mathematical universe, which is consistent.
     - B. Because consistency is a rule of the formal game of mathematics.
     - C. Because we are studying abstract structures that must be consistent.

  If you answered A, you are a **Classical Platonist**.
     - *Most awkward commitment:* The existence of an independent mathematical universe that we access by intuition or reason.
  If you answered B, you are a **Formalist**.
     - *Most awkward commitment:* That mathematics is ultimately a game with symbols, without inherent meaning.
  If you answered C, you are a **Structuralist**.
     - *Most awkward commitment:* That mathematical objects have no properties beyond their relations in a structure.

  **Question 5:**
  Do you think that some contradictions are actually true?
     - A. Yes.
     - B. No.

  If you answered A, you are a **Dialetheist**.
     - *Most awkward commitment:* That some true contradictions exist, for example in the semantics of language or in the limits of mathematics.
  If you answered B, you are a **Paraconsistent Set Theorist**.
     - *Most awkward commitment:* That set theory is inconsistent but still a useful foundation for mathematics.

  **Question 6:**
  Do you think that our current arithmetic (Peano arithmetic) might be inconsistent, and if so, can it still be used?
     - A. Yes, it might be inconsistent, and we can use it as a working theory with paraconsistent logic.
     - B. No, we have good reason to believe it is consistent, but we use paraconsistent logic to handle inconsistencies in other areas.

  If you answered A, you are an **Inconsistent Arithmetic Advocate**.
     - *Most awkward commitment:* That we can do number theory even if 0=1 is provable.
  If you answered B, you are a **Paraconsistent Conservative**.
     - *Most awkward commitment:* Changing the logic even though we don't expect inconsistencies in our current theories.

