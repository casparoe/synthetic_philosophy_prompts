  ### Mathematics and Philosophy Club: The Consistency of Mathematics  
  **Handout: Where Do You Stand? A Decision Tree**  

  We start from common ground:  
  - Allowing every predicate to define a set leads to contradiction (Russell’s paradox).  
  - No one has proven that basic arithmetic (e.g., Peano arithmetic) is absolutely consistent.  
  Thus, mathematics *might* be inconsistent—this is a serious possibility, not just a curiosity.  

  **How to Use This Tree**  
  Answer the questions honestly. Each splits the group based on a core disagreement. Follow the arrows until you reach a named position. Every leaf has a brief description and its "most awkward commitment"—a challenging consequence of that view.  

  ---

  #### **Question 1: When a contradiction arises, what is the main flaw?**  
     - **A. The axioms/definitions** (e.g., set theory rules are too broad and need restriction). → Go to Q2.  
     - **B. The logic** (e.g., classical reasoning about truth is too rigid and needs revision). → Go to Q3.  

  #### **Question 2 (from A): Should we demand absolute consistency in our theories?**  
  *(This addresses whether consistency is a requirement or a convenience.)*  
     - **A. Yes**—inconsistency makes a theory useless (due to "explosion," where one contradiction proves anything). → Go to Q4.  
     - **B. No**—a theory can be inconsistent yet still "non-trivial" (not everything follows from a contradiction). → Go to Q5.  

  #### **Question 3 (from B): Can we keep unrestricted set comprehension (every predicate defines a set) if we change our logic?**  
  *(This separates views on whether to preserve naive set theory.)*  
     - **A. Yes**—with revised logic, unrestricted comprehension is acceptable. → Go to Q6.  
     - **B. No**—even with new logic, we must restrict sets to avoid contradictions. → Go to Q7.  

  #### **Question 4 (from 2A): Why is consistency non-negotiable?**  
  *(This distinguishes views on the source of mathematical truth.)*  
     - **A. Mathematics describes a consistent reality** (e.g., numbers or sets exist independently). → **Classical Platonism**.  
       - *Most awkward commitment:* Mathematical truth is discovered, not created—even for infinite objects we can’t fully grasp.  
     - **B. Consistency is a rule of our "game"** (e.g., math is a human invention with arbitrary rules). → **Formalism/Conventionalism**.  
       - *Most awkward commitment:* Statements like "2+2=4" are just moves in a game, with no deeper truth.  
     - **C. Mathematics studies possible structures**—and inconsistency means no structure exists. → **Structuralism**.  
       - *Most awkward commitment:* A "circle" or "number 5" has no intrinsic properties—it’s just a placeholder in a relational web.  

  #### **Question 5 (from 2B): Can inconsistent arithmetic do real mathematical work?**  
  *(This tests if inconsistency is tolerable in practice.)*  
     - **A. Yes**—we can use it for real problems (e.g., number theory) with careful reasoning. → **Inconsistent Arithmetic Advocate**.  
       - *Most awkward commitment:* Accepting that proofs in arithmetic might rely on contradictions (e.g., "0=1" could be provable but harmless).  
     - **B. No**—inconsistency may be unavoidable, but it cripples the theory’s value. → **Skeptical Revisionist**.  
       - *Most awkward commitment:* Abandoning standard arithmetic entirely—even if it means rebuilding math from scratch.  

  #### **Question 6 (from 3A): Are some contradictions "true"?**  
  *(This asks if inconsistency reflects reality or language.)*  
     - **A. Yes**—contradictions exist in the world or in concepts (e.g., "this sentence is false"). → **Dialetheism**.  
       - *Most awkward commitment:* Some statements are both true and false simultaneously—not just in math, but in reality.  
     - **B. No**—contradictions are always errors in our formalization. → **Paraconsistent Set Theory**.  
       - *Most awkward commitment:* Using an inconsistent set theory daily, knowing it contains contradictions but ignoring them.  

  #### **Question 7 (from 3B): Where does inconsistency originate?**  
  *(This locates the fault: in the world, our minds, or our symbols.)*  
     - **A. In our concepts/language** (e.g., human thought is flawed or ambiguous). → **Intuitionism**.  
       - *Most awkward commitment:* Rejecting proofs about "actual infinities" (e.g., the set of all numbers)—only constructions we can mentally compute count.  
     - **B. Only in our formal systems**—the underlying subject is consistent. → **Paraconservative Logician**.  
       - *Most awkward commitment:* Using weakened logic (where contradictions don’t explode) as a "safety net," even for trusted theories.  

  ---

  ### Positions Overview  
  | **Leaf Position**               | **Path**      | **Core Idea**                                                                 |  
  |----------------------------------|---------------|-------------------------------------------------------------------------------|  
  | **Classical Platonism**          | 1A → 2A → 4A  | Math truths exist independently; inconsistency means error in axioms.         |  
  | **Formalism/Conventionalism**    | 1A → 2A → 4B  | Math is a rule-based game; consistency is a convenient rule, not a truth.     |  
  | **Structuralism**                | 1A → 2A → 4C  | Math studies structures; inconsistency implies no possible structure exists.  |  
  | **Inconsistent Arithmetic Advocate** | 1A → 2B → 5A  | Arithmetic might be inconsistent but still useful for real math.              |  
  | **Skeptical Revisionist**        | 1A → 2B → 5B  | Inconsistent theories are worthless; rebuild math from safer foundations.     |  
  | **Dialetheism**                  | 1B → 3A → 6A  | Some contradictions are true (e.g., in language, logic, or reality).          |  
  | **Paraconsistent Set Theory**    | 1B → 3A → 6B  | Keep unrestricted set comprehension with revised logic; ignore contradictions.|  
  | **Intuitionism**                 | 1B → 3B → 7A  | Blame classical reasoning about totalities; math is grounded in constructions.|  
  | **Paraconservative Logician**    | 1B → 3B → 7B  | Use paraconsistent logic as a precaution, even without expecting inconsistency.|  

  ---

  ### Notes  
  **Unoccupied Combinations** (and why):  
  - **A → 3A with classical logic**: Keeping explosion and unrestricted comprehension leads to triviality (everything becomes provable). *Incoherent—rejected by all.*  
  - **1A → 2B → 4_**: If you reject consistency as essential (from 2B), you can’t demand it for structural/Platonic reasons (4A/C). *Merely unattractive—no major position holds this.*  
  - **1B → 2A**: Changing logic (1B) but insisting on consistency as non-negotiable (2A) is rare. *Unexplored—no clear adherents.*  

  **Indistinguishable Positions** (tree can’t split them):  
  - **Formalists and Structuralists** might agree on math’s conventional nature—the tree separates them by their focus (rules vs. structures).  
  - **Dialetheists and Paraconsistent Set Theorists** both use revised logic but disagree on truth; the tree isolates this via Q6.  

  **Design Choices**  
  - Questions avoid jargon (only assume algebra/geometry).  
  - 8 questions, 9 leaves—covers all requested positions.  
  - "Most awkward commitment" highlights the toughest implication of each view.  

  **Reflect**  
  No position is bulletproof. Where does your intuition lead? Discuss!
