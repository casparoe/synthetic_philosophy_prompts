prompt: |-
  I'm a second-year PhD student in philosophy, working mostly on social epistemology, and my first chapter is basically one long attempt to figure out whether "epistemic injustice" has a subordination condition built into it or whether it's just any unwarranted credibility deficit, wherever it comes from. Which is why I'm asking you something kind of silly. I've been going to a weekly reading group run by a postdoc, Dana, who will give a verdict on any case you put to her and then refuses to explain herself beyond "that's one" or "that's not one." I've been quietly keeping score for a term. Her track record so far: (1) a woman comes to the ER with severe abdominal pain, the doctor writes "anxiety, likely drug-seeking" and never examines her — one; (2) a woman PhD student raises a statistical objection in a lab meeting, gets talked over, and her supervisor repeats the same point ten minutes later and everyone nods — one; (3) a woman in a village with a documented history of making things up tells her neighbours the water is contaminated, nobody believes her, and it turns out she was right — not one, "she was harmed, but nobody wronged her as a knower, their disbelief was reasonable given what they knew"; (4) a woman experiences a new kind of coordinated online harassment for which there's no word yet, nobody disbelieves any particular claim she makes, and for two years she can't get anyone, including her therapist, to see it as a pattern, until a journalist coins a term for it — one; (5) a creationist's claim about the age of a rock formation gets dismissed at a conference by a geologist — not one, "he's being treated as a knower, his claim is just bad, and the dismissal tracks the evidence"; (6) a working-class student's dialect leads a TA to conclude she "hasn't understood the reading" when she has — one; (7) a patient's account is accepted, but the doctor keeps asking her to repeat it and to bring someone along to corroborate, in a way he doesn't with other patients, and he has no idea he's doing it — one. She uses the standard vocabulary when she wants to but never says what the underlying criterion is, and I've stopped being able to tell whether she's tracking who the speaker is or what the hearer does.

  Next week it's my turn to bring the case, and I'd like to bring one that actually bites on my chapter. Here it is: a tenured professor, male, from a well-off family, in a field where he's a big deal, reports to his chair that a co-author fabricated data. He isn't a member of any marginalised group — he's about as advantaged as it gets — and the chair, with no conscious bias whatsoever, discounts the report on the grounds that "senior people in his position always have an axe to grind about being scooped." The fabrication goes uninvestigated and it costs him a grant and his spot in the lab. My gut says she'll say "not one," but I keep flip-flopping, and I've noticed that alot of the disagreement between me and my supervisor on the chapter is really about which of Dana's verdicts are the load-bearing ones. So I'd rather you work from her record than from the literature.

  Could you give me: a section called "The rules that fit" (about 300 words) listing the two or three rules that are consistent with all seven of her verdicts, with a note on which of her verdicts does the work of ruling out the tempting alternatives; then "What they predict for my case" (about 200 words), running each surviving rule on the fabrication case and flagging where they come apart; then "Your call" (about 200 words) with your best guess at her verdict and the reasons for preferring it over the other rules, including anything you think her record leaves genuinely underdetermined; and finally "The case I should bring the week after" (about 150 words) — one case, described concretely, that would separate whichever two rules you think are still live.
