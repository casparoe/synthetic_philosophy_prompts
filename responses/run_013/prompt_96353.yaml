prompt: |-
  hey, i'm a high school junior and for our school's senior independent project i have to submit a 2 page research proposal by the end of the month. mine is philosophy (my advisor said yes as long as it has a real question and a real method and not just an opinion piece). i have a half-formed idea and i need you to turn it into the actual proposal.

  the topic is moral foundations theory, the thing where liberals supposedly moralize mostly around care and fairness while conservatives use those plus loyalty, authority and purity. people online use this in two opposite ways. one side says look, conservatives just have more moral receptors so liberals are the narrow ones. the other side says its all just psych facts about what people happen to feel, so the whole who-is-right question is a non-starter. both of those feel like theyre cheating to me and i cant put my finger on why.

  my idea is that the whole fight is stuck because the word foundation is doing two jobs. sometimes a foundation means the thing that actually makes a person care, a motive, something in the gut. sometimes it means the thing that makes a moral claim correct, a justification. all of MFT's actual evidence, the surveys and the weird scenarios, is evidence about the first job. the who is right question needs the second. so on its own the psychology is silent, and i think a lot of people slide between the two meanings without noticing.

  i dont want to stop there though, because is/ought gap, case closed is a boring paper and probably not even right. i think theres one bridge actually worth checking: ought implies can. if a moral code demanded something our moral psychology makes basically impossible, wed probably say the demand is void or at least has to be rethought. so MFT might not tell us whats right, but it might tell us what any moral theory is allowed to demand of us. that could cut both ways (it could mean a care-and-fairness-only morality is unlivable, or it could mean the loyalty/authority/purity stuff is optional since we can obviously live without leaning on it) and i want the proposal to be about working out which way it actually cuts.

  what i need you to write: a 2 page proposal with (1) the question stated so precisely that it has a determinate answer, not something mushy like explore the relationship between moral psychology and moral truth, (2) why the existing sides in this arguemnt havent already settled it, (3) the method, what i would actually do step by step, and be honest with me about which parts are pure armchair analysis and which parts i could actually get evidence for, like could a small questionair at my school test any piece of this or would that be a waste of time, (4) what would count as the project failing, like what result would show the bridge idea is a dead end rather than just hard, and (5) scope, i have about three months and 15 pages max.

  please dont give me a bibliography or a reading list or names of specific papers, i will find and add the citations myself. refer to positions and arguments instead of sources. and dont make it sound like a grad student wrote it, its for a high school program.
reasoning: |-
  Okay, the user is a high school junior working on a senior independent project. They need a two-page research proposal on Moral Foundations Theory (MFT), specifically addressing the confusion between descriptive and normative aspects of "foundations." Their half-formed idea is that the term "foundation" is ambiguous, leading to unproductive debates. They want to explore whether "ought implies can" can bridge psychology and ethics, using MFT data to see what moral demands are feasible.

  First, I need to refine their question into something precise. They mentioned two interpretations of "foundation": one as psychological motivators (descriptive) and the other as justifications for moral truth (normative). The existing debate doesn't resolve this because each side conflates these meanings. The user wants to avoid the simple is/ought gap conclusion and instead use "ought implies can" as a practical bridge.

  Their proposed method involves analyzing MFT's claims to separate descriptive from normative uses. Then, applying the principle that moral demands must be psychologically feasible. The challenge is making this method actionable for a high school project. They need concrete steps: literature review to understand MFT, conceptual analysis to dissect "foundation," applying "ought implies can" to MFT data, and evaluating implications.

  For evidence, surveys could test if people perceive certain foundations as necessary or optional. However, time and resource constraints mean the survey should be simple, perhaps among peers. They need to know what parts are theoretical (armchair analysis) versus empirical (survey).

  The project's failure would be if feasibility doesn't affect normative validity, or if MFT data can't address feasibility. They need clear failure conditions, like survey results showing no consensus on necessity, or conceptual analysis revealing "ought implies can" is inapplicable.

  Scope is crucial: three months, 15 pages. The proposal must be feasible. Emphasize phases: preparation (weeks 1-2), analysis (weeks 3-6), survey (weeks 7-8), synthesis (weeks 9-12). Limiting survey scope to one question per foundation keeps it manageable.

  Also, the user wants the proposal to sound like a high school student wrote it, avoiding overly academic language. They need to state why existing arguments haven't resolved the issue—mainly due to conflation of terms. Highlighting that MFT's evidence is descriptive but used normatively explains the stalemate.

  Lastly, ensure the proposal answers all parts: precise question, existing debate's shortcomings, method with theoretical and empirical parts, failure conditions, and realistic scope. Make sure the feasibility angle is central, showing how psychology informs ethics without bridging the is/ought gap directly.
answer: |-
  Here’s a focused, actionable 2-page research proposal based on your idea. It avoids jargon, stays within high school scope, and targets your core insight about the ambiguity of "foundation" and the potential "ought implies can" bridge.

  **Research Proposal: Can Moral Demands Be Too Much? Testing the Limits of Moral Foundations Theory**

  **1. Research Question (Precise & Answerable):**
  *   **"Does the empirical evidence from Moral Foundations Theory (MFT) about *psychological feasibility* constrain which 'foundations' (Care, Fairness, Loyalty, Authority, Purity) can be considered *normatively necessary* components of a valid moral system, using the principle 'ought implies can'?"**
      *   *Why it's precise:* It focuses on one specific bridge ("ought implies can"), one specific constraint ("normatively necessary"), and uses MFT data *only* for what it actually measures (psychological feasibility – what people *can* or *can't* easily feel/do). It asks *whether* MFT provides evidence for necessity, not *what* is ultimately right.

  **2. Why Existing Arguments Haven't Settled This:**
  *   **The Ambiguity Trap:** Proponents often use "foundation" ambiguously. When someone says "Conservatives have more foundations," do they mean conservatives *psychologically rely* on more categories (descriptive fact), or that their morality *is more complete/correct* because it includes them (normative claim)? MFT provides evidence *only* for the first (descriptive psychology). Critics who say it's "just psychology" rightly point out it doesn't solve "what's right," but often dismiss *any* potential link prematurely.
  *   **Missing the Bridge:** Both sides largely ignore the specific bridge you propose: "ought implies can." They jump straight from "psychology" to "who's right" without exploring whether psychology tells us what demands are even *possible* for humans to meet consistently. Your question targets this missing middle step.

  **3. Research Method (Step-by-Step & Honest about Scope):**
  This project combines conceptual analysis (armchair) with a small, targeted empirical component (survey).

  *   **Phase 1: Conceptual Groundwork (Armchair - Weeks 1-3)**
      *   **Step 1:** Clearly define the two meanings of "foundation" using MFT descriptions: (a) *Psychological Trigger/Motivator:* A gut-level reaction making someone *care* about certain actions/harms. (b) *Normative Justification:* A reason why an action is *objectively right or wrong*.
      *   **Step 2:** Analyze the principle "Ought implies can": If a moral system demands we do X, but human psychology makes consistently doing X genuinely impossible (or extraordinarily difficult for most people), then demanding X might be invalid or require significant revision.
      *   **Step 3:** Apply the bridge: What does MFT evidence *specifically about psychological prevalence and strength* of each foundation tell us about *feasibility*?
          *   *Example Reasoning:* If MFT shows Loyalty triggers strong, consistent psychological reactions across diverse populations (a descriptive fact), does this suggest humans *can* readily incorporate Loyalty demands? Conversely, if Purity triggers strong reactions only in specific contexts/subgroups, does this suggest incorporating it as a *universal, necessary* demand might be infeasible for many?

  *   **Phase 2: Empirical Check: Perceived Feasibility & Necessity (Survey - Weeks 4-6)**
      *   **Goal:** Gather *preliminary* evidence on whether people perceive foundations they find psychologically *difficult* as less *necessary* for a good moral system (testing the "ought implies can" link in everyday reasoning).
      *   **Method:** Design a short, anonymous questionnaire for peers (~30-50 students, aiming for diversity if possible). **This is not testing MFT itself, but how people *think* about the link between feasibility and necessity.**
      *   **Sample Questions:**
          1.  *(Feasibility - Descriptive)* "How easy or difficult do you find it personally to *feel* strongly that something is right/wrong based on...?" [Rate each foundation: Care, Fairness, Loyalty, Authority, Purity on a scale: Very Easy - Easy - Neutral - Difficult - Very Difficult]
          2.  *(Necessity - Normative)* "How important do you think it is for a *good* moral system to include rules or principles based on...?" [Rate each foundation: Extremely Important - Important - Neutral - Unimportant - Very Unimportant]
          3.  *(Optional Open-Ended)* "Briefly explain your rating for one foundation where you rated Feasibility 'Difficult/Very Difficult' but Necessity 'Important/Extremely Important' (or vice versa)."
      *   **Honest Limitations:** This survey doesn't *prove* anything about objective morality. It shows correlations in *perceptions* among a small, non-representative sample. Its value is in testing if the *logic* of "ought implies can" shows up in how people intuitively link psychology (feasibility) to moral necessity.

  *   **Phase 3: Synthesis & Argument (Armchair - Weeks 7-12)**
      *   Combine Phase 1 analysis with Phase 2 survey results.
      *   **Core Task:** Systematically evaluate for *each foundation* whether MFT's descriptive evidence (prevalence, strength of reaction) suggests incorporating it as a *necessary* component of morality is:
          *   (a) Feasible (psychology supports it as a possible demand),
          *   (b) Problematic (psychology suggests it's too difficult for many to consistently meet), or
          *   (c) Neutral (psychology doesn't clearly speak to feasibility for this foundation).
      *   **Answer the Question:** Based on this evaluation, does the MFT evidence *constrain* which foundations can be considered normatively necessary? Does it lean towards supporting the necessity of Care/Fairness *only*, the "full five," or something else? Does the survey suggest people use "ought implies can" reasoning intuitively?

  **4. Failure Conditions (What Shows a Dead End?):**
  The project fails if:
  1.  **Conceptual Dead End:** Clear analysis shows "ought implies can" is fundamentally *inapplicable* to the concept of "foundations" as defined by MFT. (e.g., if foundations are only about *perceiving* morality, not *acting* on demands, the bridge doesn't connect).
  2.  **Empirical Irrelevance:** The survey data shows *no correlation whatsoever* between how difficult people find a foundation psychologically (feasibility) and how necessary they think it is for a good moral system (necessity). This would strongly suggest the bridge isn't operating in common intuition, weakening its plausibility as an argument.
  3.  **MFT Data is Useless:** MFT's findings about prevalence/strength provide *no meaningful information* about the psychological feasibility of incorporating a foundation as a necessary moral demand. (This is unlikely, but would kill the project).

  **5. Scope & Feasibility (3 Months, 15 Pages):**
  *   **Focus:** Narrow analysis to the 5 foundations. Avoid getting sidetracked into defining "true morality." Stay focused on *whether* MFT + "ought implies can" can constrain *necessity*.
  *   **Empirical Component:** The small peer survey is manageable. Keep it simple (max 10 questions). Focus analysis on clear patterns/correlations, not complex stats.
  *   **Output:** The 15-page paper will:
      *   Explain MFT & the ambiguity problem (2-3 pages).
      *   Define "ought implies can" and argue why it's a relevant bridge (2 pages).
      *   Analyze MFT evidence for each foundation's feasibility (3-4 pages).
      *   Present survey method, results, and limitations (3-4 pages).
      *   Synthesize findings to answer the research question (3-4 pages).
      *   Conclude with implications and limitations (1 page).
  *   **Time:** Phases are structured for 3 months. Phase 1 (Lit/Concept) = 3 weeks. Phase 2 (Survey Design/Admin/Analysis) = 3 weeks. Phase 3 (Synthesis/Writing) = 6 weeks (allowing for revision).

  **Key Strength:** This proposal tackles the core confusion you identified (descriptive vs. normative "foundations") head-on. It uses a specific, recognized philosophical principle ("ought implies can") to build a potential bridge in a way that is both intellectually honest and feasible for a high school project. The small survey adds a concrete, doable element to test the bridge's plausibility in everyday thought. Good luck!
