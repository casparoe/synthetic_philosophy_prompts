prompt: |-
  Hey — I host a tiny interview podcast (like 200 listeners, mostly people from my local rationalist meetup) and next month's guest is a philosopher I've wanted on for ages. She's spent her career defending deontological constraints — the "you may not kill the one to save the five" kind — and she thinks the so-called paradox of deontology is an artifact of bad framing. I've read enough of this stuff to know the paradox: if constraints are supposed to protect people from being violated, then a constraint that forbids you from doing the thing that results in fewer people being violated looks self-undermining — five die so your hands stay clean, which is a weird thing for a morality of respect for persons to be for. Her comeback, as far as I can tell from her papers and a couple of talks online, is that this only looks like a paradox if you assume a moral theory is a device for producing the best outcome, and that once you drop that assumption, the five-vs-one comparison just isn't the kind of thing a constraint answers to. She also thinks constraints are agent-relative all the way down, and that what other people do with the people you didn't save never enters into what you may do.

  I don't want to ask her to restate that, and I don't want the canned stuff she's answered a hundred times. Write me 8–10 questions, in the order I should ask them, so each one sets up the next. Aim them where the view is actually under load: (a) what she gets to say to the five, and whether that's distinguishable from what a person who simply doesn't care says — plus why she'd still feel wrecked about them if the answer is "nothing"; (b) whether her move collapses the constraint into a mere permission, since if numbers never count, is she ever required to save anyone, even when it's free; (c) whether the same "drop the outcome frame" move also dissolves the constraint, i.e. whether she's just a consequentialist about constraints; (d) the doing/allowing vs. intending/foreseeing structure — if she keeps the first distinction and drops the second, why; (e) whether the constraint binds when the one you'd kill is you, and what that tells us about whose rights are doing the work; (f) the torture-the-wrongdoer case, where the person you'd harm is himself a violator — I think that's where "respect for persons" starts straining. For each question, give me the answer she's most likely to give and a follow-up aimed at that answer specifically. I'd rather have six questions that actually bite than twelve she can swat away, so if a question can't be made to bite, cut it and say so.

  Role-wise: be a normative ethicist who knows this debate cold. Think carefully about where the load-bearing joints of the position actually are before drafting anything — start by sketching the two or three strongest replies a defender of constraints has in her pocket, then write the questions against those replies rather than against a strawman. I want the ones that make her say "hmm, that's a good question" and then take a second, not the ones she reframes into something she's already answered.

  Format: give me the questions as a table with these columns — Question | What it presses on | Most likely answer | Follow-up question | Does this actually threaten the view? (high/medium/low, one line of why). Then, after the table, a short JSON object with the fields {"strongest_question": ..., "why": ..., "question_to_cut": ..., "what_a_good_answer_would_have_to_do": ...}.
reasoning: |-
  Hmm, the user is hosting a small podcast for a rationalist audience and needs sharp interview questions for a philosopher guest who defends deontological constraints. This guest argues that constraints against harming some to save others aren't paradoxical if we drop the assumption that morality must be outcome-oriented. The user wants questions that genuinely challenge her views in specific areas like what to say to the five victims, whether constraints collapse into mere permissions, and other pressure points they've outlined.

  I need to approach this as a normative ethics expert. The core of her position seems to be that constraints are fundamentally agent-relative prohibitions grounded in respect for persons, not optimization tools. Her key arguments likely include: 1) Moral status isn't aggregative - you can't trade violations between persons; 2) Agency is non-fungible - your moral responsibility is tied to your own actions; and 3) The "outcome frame" itself is the problem - morality isn't about producing states of affairs.

  The questions should target live tensions in these defenses. For "what to say to the five," the challenge is how her position differs from indifference without appealing to outcomes. For the "constraint vs permission" issue, we need to test whether her view allows any positive duties. The torture case exposes whether "respect for persons" has consistent limits. Each question needs a likely answer and a surgical follow-up.

  I should prioritize quality over quantity - the user prefers six biting questions over twelve soft ones. The torture question might be cuttable if she's developed specialized responses, but the "saving the five" and "agent-relativity" questions seem essential as they strike at the theory's foundations. The strongest question is probably about what distinguishes her regret from indifference - if she can't explain this without smuggling in consequentialist intuitions, it reveals a deep tension.

  For structure, I'll build progression: start with the core "why constraints" question to establish her framework, then escalate to the five-vs-one scenario, probe positive duties, examine intention/foreseeing distinctions, test the personal cost case, and finally stress-test with the violator scenario. Each follow-up should force her to confront what her theory can't explain rather than letting her reframe.
answer: |-
  Here's a carefully crafted set of questions targeting the core tensions in her view, informed by the standard defenses and where they bear significant weight. The questions build sequentially and focus on the points you specified.

  **Question Sequence & Analysis**

  | Question | What it presses on | Most likely answer | Follow-up question | Threat Level & Why |
  |---|---|---|---|---|
  | 1. "You argue deontological constraints are foundational to respecting persons as ends-in-themselves. Could you elaborate on what specific *aspect* of personhood generates the constraint against killing the one to save the five? Is it primarily autonomy, inviolability, or something else?" | Foundations of the constraint: What *property* of persons grounds the prohibition, distinct from consequentialist value? | "The constraint arises from the intrinsic inviolability of persons; it's wrong to *use* a person merely as a means to an end, even a good end. Killing the one treats them solely as a tool to save others." | "If the core wrong is 'using as a means,' does the constraint dissolve if the one *consents* to be killed to save the five? If so, how is that consistent with inviolability? If not, why does consent override the 'using as a means' prohibition here?" | **Medium:** Clarifies the grounding. Consent cases test if inviolability is truly fundamental or conditional. |
  | 2. "Imagine you're standing with the switch in the trolley problem. You don't pull it, the five die. Later, you meet the grieving families. What do you say to them about why you let their loved ones die, given you *could* have saved them by a relatively minor act? How does your justification here *differ* from what someone who simply didn't care about saving them would say?" | Accountability to victims / Distinguishing constraint from indifference. | "I say I deeply regret their deaths, that it's a terrible tragedy, but I could not morally kill an innocent person to prevent it. My inaction wasn't indifference; it was refusal to commit a profound moral wrong. The uncaring person wouldn't feel this regret or recognize the constraint." | "You feel regret *because* five died who didn't have to. But if the constraint truly doesn't answer to outcomes, why isn't the relevant moral fact *only* that *you* didn't kill anyone? Why does the *additional* fact of the five dying generate regret, rather than just being a neutral bystander to *others'* misfortune?" | **High:** Directly challenges the separation from outcomes. If the death of the five generates agent-regret specific to *her* inaction, it suggests the outcome *does* matter *to her* in a way her theory claims it shouldn't. |
  | 3. "If numbers never count against the constraint against *killing*, does that mean there's *no* equivalent constraint requiring you to *save*? Are you ever *required* to save the five if you can do so freely (e.g., throwing a life preserver), or is saving purely supererogatory on your view?" | Positive Duties vs. Negative Constraints / Collapse into mere permission. | "Constraints are primarily prohibitions (don't kill, don't lie). Positive duties to aid exist but are generally weaker and more context-dependent than negative duties. I *can* be required to save if the cost is minimal and the need is great – but that duty doesn't override the constraint against killing an innocent." | "If I have a duty to save the five when it's free, why doesn't the *strength* of that duty (saving five lives!) become relevant when the *only* way to fulfill it involves violating a constraint (killing one)? Doesn't recognizing *any* positive duty, especially one triggered by dire need, reintroduce a form of weighing that your framework explicitly rejects?" | **High:** Tests if the asymmetry between killing/allowing-to-die is robust enough to block *any* weighing. If positive duties exist, their force seems like it *should* be comparable to the badness of the outcome they prevent. |
  | 4. "You dismiss the 'paradox' by rejecting the 'outcome frame'. But doesn't the constraint itself rely on an outcome-focused reason: namely, preventing *you* from being a killer? If so, how is this not just a form of agent-relative consequentialism focused on the outcome of *your* moral purity?" | Self-Undermining / Consequentialism about Constraints. | "No. The constraint isn't about the *outcome* of me being a killer. It's about the intrinsic nature of the *act* itself – killing an innocent person is wrong *as such*, regardless of its consequences, including the consequence of my character state. The wrongness is in the doing, not the resulting state." | "If the wrongness is solely in the *act* of killing, independent of consequences for the victim or anyone else, why is redirecting the trolley *killing* the one rather than merely *failing to save* the five? Doesn't distinguishing the act rely precisely on the *foreseeable outcome* for the one person (their death) that your act *causes*?" | **High:** Forces her to explain the act/omission distinction without relying on outcomes she dismisses. If the act's wrongness depends on its causal link to harm, outcomes sneak back in. |
  | 5. "Consider a variant: The trolley is heading towards you. You can divert it onto a sidetrack where it will kill only you. Are you *constrained* from diverting it? Or is the constraint purely other-regarding? What does this tell us about whose rights or inviolability is fundamental?" | Scope of Constraint (Self-Regarding?) / Source of inviolability. | "The constraint against killing is primarily other-regarding. There is no constraint against sacrificing *yourself*. You may divert the trolley onto yourself to save the five. This shows the constraint protects *others* from being used/killed by *me*." | "If I can freely choose to sacrifice myself to save five others, doesn't that imply the *value* saved (five lives) *is* commensurate with the cost (my life), at least when *I* bear the cost? If so, why does the *location* (who bears the cost) suddenly make that commensurability calculation morally impossible when the cost falls on someone else?" | **Medium/High:** Highlights a tension in the agent-relativity. If value *can* be compared when I sacrifice myself, the strict prohibition on comparable trade-offs involving others seems less about incommensurability and more about a special prohibition on *imposing* costs. |
  | 6. "Consider the 'Torture the Terrorist' case: A known terrorist has planted a bomb that will kill thousands. The *only* way to get the location is to torture his innocent child in front of him. He *will* talk. Is this constrained? If so, how does 'respect for the person' (the child) function here, given the terrorist is a violator and the child is being used solely as a means to prevent massive violation?" | Limits of Respect / Strain under extreme violators/scale. | "Yes, it is absolutely constrained. Torturing the innocent child is a profound violation of the child's inviolability and using them as a mere tool. The terrorist's guilt doesn't diminish the child's moral status or make it permissible to violate them. Respect for persons applies universally." | "If respect requires never using an innocent as a mere means, even to prevent thousands of violations by a guilty party, does this imply that the moral universe is fundamentally structured such that the *single* violation *I* directly commit is always worse than *any number* of violations *I* merely fail to prevent, even if caused by another agent? Isn't that an extraordinary claim about the priority of individual agency over aggregate harm?" | **High:** This is the crucible. Her answer exposes the starkest implication: that the directness/agency component outweighs *any* scale of harm prevented indirectly. The follow-up forces her to own that implication fully. |

  **Question Justification & Cuts**
  *   **Cut:** "Doing/Allowing vs. Intending/Foreseeing" (Your point 'd'). While important, her view likely relies heavily on Doing/Allowing. Pressing Intending/Foreseeing (e.g., terror bomber vs. tactical bomber) is less central to *her* core defense against the paradox and might lead into well-rehearsed DDE territory, which could distract from the agent-relativity/outcome-frame focus. A strong defense of constraints can often utilize Doing/Allowing without needing a robust DDE.
  *   **Strongest Question:** **Question 2 (Accountability to Victims)**. This strikes directly at the most counterintuitive implication for bystanders and challenges the separation between constraint and outcome in the *agent's own moral phenomenology* (regret). A good answer must convincingly explain why the agent's regret is *not* a recognition that the constraint failed to protect the five, but rather something else (e.g., sorrow at the world's tragedy, distinct from agent-regret for *her* action/inaction), without collapsing back into consequentialism. It forces her to articulate the *positive* content of respect beyond non-violation.

