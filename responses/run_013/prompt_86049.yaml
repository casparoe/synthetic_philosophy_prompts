    "question_to_cut": "A detailed question on the Doctrine of Double Effect (Intending/Foreseeing).",
    "what_a_good_answer_would_have_to_do": "A good answer must: 1) Clearly distinguish the agent's profound sorrow/regret over the outcome from agent-regret for *her own choice* (which she lacks, having followed the constraint). 2) Explain why this sorrow is morally required *by* respect for persons (e.g., recognizing the tragedy of their loss *as* persons) without implying that morality *demanded* she prevent it via violating the constraint. 3) Articulate a positive duty of care or compassion towards the victims *after* the fact, grounded in respect, that the indifferent person would lack."
  }
  ```

  **Use these strategically:** Start with 1 to set the stage, use 2 to apply maximum pressure early, then build through the implications (3,4,5) before hitting the extreme case (6). Listen closely to her answers to tailor follow-ups even further. Good luck!
