answer: |-
  ## Pantoum for the Unburied Cause

  We chose the fall to keep the story clean.  
  A draw is just a ledger, grey and thin.  
  *The cause was pure* — you know what that must mean:  
  No ground was ceded, only bled upon.

  A draw is just a ledger, grey and thin.  
  (That hilltop dust still tastes like chosen grace).  
  No ground was ceded, only bled upon.  
  We claimed the sunset, leaving not a trace.

  (That hilltop dust still tastes like chosen grace).  
  The beach held only water, smoke, and dread.  
  We claimed the sunset, leaving not a trace.  
  **The losing wasn't holy. Just the dead.**

  The beach held only water, smoke, and dread.  
  *The cause was pure* — you know what that must mean...  
  The losing wasn't holy. Just the dead.  
  We chose the fall to keep the story clean.

  ---

  **Notes on the Choices:**

  This pantoum weaponizes its inherent repetition to embody the recycling of consolatory myths across disparate lost causes (Masada's siege, the Confederacy's battlefield valor, Kosovo's contested legends, Dunkirk's evacuation-spun-as-triumph). The interlocking lines – "A draw is just a ledger, grey and thin," "No ground was ceded, only bled upon," "The cause was pure..." – physically enact the transfer of the *same* comforting narrative from one context to the next, spoken by a new "mouth" with each stanza. The insistence on a "clean" loss ("chose the fall," "leaving not a trace") contrasts the messy reality hinted at ("water, smoke, and dread," "grey and thin") and critiques the need for totality to fuel myth.

  The crucial break occurs on "**The losing wasn't holy. Just the dead.**" This new line, stark and unrecycled, disrupts the pattern, representing the unadorned truth: defeat was merely defeat, mortality not martyrdom. Yet, the form immediately snaps back, reclaiming the familiar refrains ("The cause was pure...") and finally circling relentlessly to the opening line ("We chose the fall..."). This closure isn't resolution but entrapment, demonstrating the inescapable cycle where the myth absorbs the crack and perpetuates itself. The cyclical structure *is* the argument: the consolation demands the fall, rereads blood as proof, and repeats, ad infinitum.

  ---

  **Structure Visualization:**

  *   **Stanza 1:** A, B, C, D
  *   **Stanza 2:** B, E, D, F  *(B & D repeat)*
  *   **Stanza 3:** E, **G (NEW)**, F, H  *(E & F repeat; G breaks pattern)*
  *   **Stanza 4:** **G (NEW)**, C, H, A  *(C & H repeat; G persists; A closes the loop)*
