prompt: |-
  A colleague in our logic reading group keeps settling arguments with the line "some contradictions are true," most recently to defend a paraconsistent treatment of a paradox, where the claim was doing real work rather than just gesturing. I want a precise map of what that one sentence could be asserting. Lay the readings out as a menu, ordered from the trivial to the radical, varying along at least three axes: what "contradiction" picks out (a pair consisting of a proposition and its negation, a single conjunctive proposition of the form p-and-not-p, a theory that entails both members of such a pair, a sentence assigned a glut truth value); what "true" is doing (truth simpliciter, truth in a model, warranted assertibility, derivability in a target theory); and how wide the "some" is meant to range. For each reading, say whether it is a platitude, a substantive and defensible thesis, or plainly false, and say which readings the dialetheist actually needs for the use the line was put to and which are merely smuggled in by the wording. Please also keep the distinctions sharp between a true contradiction, a truth-value glut, a truth-value gap, and a theory that is inconsistent but simply false, and note where paraconsistency does and does not follow from any of these. End by telling me which single reading the people who repeat this line are usually reaching for, and whether that reading survives the paradox it was invoked to handle.
reasoning: |-
  We are to analyze the sentence: "Some contradictions are true." We'll break it down along three axes:

  1. What "contradiction" picks out:
     (a) A pair (P, ¬P) of propositions.
     (b) A single proposition of the form (P ∧ ¬P).
     (c) A theory (set of sentences) that entails both a proposition and its negation (i.e., is inconsistent).
     (d) A sentence that is assigned a "glut" truth value (both true and false) in a dialetheic logic.

  2. What "true" means:
     (i) Truth simpliciter (absolute truth, in reality).
     (ii) Truth in a model (relative to a model).
     (iii) Warranted assertibility (we have good reason to assert it).
     (iv) Derivability in a target theory (the theory proves it).

  3. How wide the "some" is meant to range:
     (A) At least one contradiction in the actual world (or in the intended model).
     (B) At least one contradiction in some possible world or model.
     (C) At least one contradiction in a formal system (which may be artificial).

  We are to order the readings from trivial to radical and evaluate each as platitude, substantive/defensible, or plainly false. We must also note:

  - The distinctions between:
     * True contradiction: the contradiction (however construed) is true.
     * Truth-value glut: a sentence that is both true and false.
     * Truth-value gap: a sentence that is neither true nor false.
     * Inconsistent but false theory: a theory that is inconsistent (entails a contradiction) but is not true (so the contradiction it entails is not true).

  - Where paraconsistency follows: a paraconsistent logic is one in which a contradiction does not entail everything (i.e., explosion fails). Note that the existence of a true contradiction (in some senses) may motivate paraconsistency, but does not entail it (one might have a logic that is explosive but also has true contradictions, but that would be trivial). Also, paraconsistency can be adopted without true contradictions (e.g., to handle inconsistent but non-trivial theories).

  We must also say which reading dialetheists (who advocate for true contradictions) typically need and which are smuggled in, and which reading people who repeat the line are usually reaching for and if it survives the paradox.

  Let's list the combinations. We'll focus on the most natural and important ones.

  Reading 1: (a) + (i) + (A) 
     Contradiction = a pair (P, ¬P); true = truth simpliciter; some = in the actual world.
     Assertion: There is at least one proposition P such that both P and ¬P are true (simpliciter, in the actual world).
     Evaluation: This is the core dialetheist claim. It is radical and plainly false in classical logic, but a dialetheist would defend it. It is substantive and controversial.

  Reading 2: (b) + (i) + (A)
     Contradiction = a single proposition (P ∧ ¬P); true = truth simpliciter; some = in the actual world.
     Assertion: There is at least one proposition of the form (P ∧ ¬P) that is true (simpliciter, in the actual world).
     Evaluation: This is equivalent to the first because (P ∧ ¬P) is true if and only if both P and ¬P are true. So same as above.

  Reading 3: (c) + (iv) + (C)
     Contradiction = a theory that entails both a proposition and its negation; true = derivable in a target theory; some = in a formal system (which may be artificial).
     Assertion: There is at least one formal theory that is inconsistent (entails both P and ¬P for some P) and the target theory (which might be our own) proves that it is inconsistent? Or that the theory is "true" in the sense that it is derivable? This is unclear. 
     Alternatively, we might interpret "true" as (iv) derivable in the target theory. Then: the target theory proves that there is an inconsistent theory? That doesn't seem right. 
     Alternatively, the inconsistent theory itself is under consideration: we might say that the theory's being inconsistent (entailing a contradiction) does not make it false (if we are using a paraconsistent logic, we don't necessarily have to reject the theory). But then "true" is not applied to the contradiction (the pair or the conjunction) but to the theory as a whole? This is messy.

     Let's reframe: Sometimes we say a theory is "true" if it is consistent and all its theorems are true. But here the theory is inconsistent. So perhaps we mean that the theory is "true" in the sense that it is the correct description of the world? That would be (i) for the theory? But then we are saying that an inconsistent theory is true (simpliciter). That would be radical and very similar to Reading 1 or 2.

     Alternatively, we might be using "true" in the sense of (iv): the theory is inconsistent and we can derive in our metatheory that it is inconsistent. This is trivial: we can easily build an inconsistent formal system (e.g., one with both A and ¬A as axioms). This is a platitude.

  Reading 4: (d) + (ii) + (B)
     Contradiction = a sentence assigned a glut truth value; true = truth in a model; some = in some model.
     Assertion: There exists a model in which at least one sentence is assigned both true and false (a glut).
     Evaluation: This is trivial because we can construct such models (e.g., in the logic LP). It is a platitude about model theory.

  Reading 5: (b) + (ii) + (B)
     Contradiction = a single proposition of the form (P ∧ ¬P); true = truth in a model; some = in some model.
     Assertion: There is a model in which the proposition (P ∧ ¬P) is true (in that model). 
     Evaluation: In classical logic, no model makes (P ∧ ¬P) true. But in non-classical logics (like LP) we can have models that assign "true" to (P ∧ ¬P) (by assigning both truth values to P). So this is true in some models of non-classical logics. But note: in classical model theory, every model assigns false to (P ∧ ¬P). So if we are in a non-classical setting, it is a platitude for that setting? But if we are speaking generally, then it is a substantive claim about the existence of non-classical models? Actually, it is trivial to note that in non-classical logics we have such models. So it becomes a platitude about the variety of formal systems.

  Let's reorganize by ordering from trivial to radical:

  Trivial readings:

  - (c) + (iv) + (C): We have an inconsistent theory and we can prove (in a target metatheory) that it is inconsistent. For example, in a metatheory that can talk about formal systems, we can define a theory that has both A and ¬A as axioms and then prove that it is inconsistent. This is a platitude.

  - (d) + (ii) + (B): There exists a model (in some formal semantics) that assigns a glut to some sentence. This is a platitude because such models are built in paraconsistent logics.

  - (b) + (ii) + (B): There exists a model (in a non-classical logic) that makes (P ∧ ¬P) true. This is similar to the above. Also a platitude.

  - (c) + (iii) + (C): A theory is inconsistent and we have warranted assertibility to say so? This is also trivial if we have an explicit example.

  - (a) + (ii) + (B): There is a model in which both P and ¬P are true (for some P). Again, in non-classical models (with gluts) this is possible. Platitude.

  Substantive but not radical:

  - (a) + (iii) + (A): We have warranted assertibility for both P and ¬P (for some P) in the actual world. This might happen in paradoxical situations or when we have conflicting evidence. This is defensible in some epistemological views, but not a dialetheist claim about reality. It is about justification.

  - (b) + (iii) + (A): We have warranted assertibility for (P ∧ ¬P). This is the same as above.

  Radical readings:

  - (a) + (i) + (A): There is a proposition P such that both P and ¬P are true in reality. This is dialetheism. Substantive and controversial.

  - (b) + (i) + (A): The conjunction (P ∧ ¬P) is true in reality. Same as above.

  - (c) + (i) + (A): An inconsistent theory is true (simpliciter). This would mean that the theory correctly describes reality, which implies that reality is inconsistent (so there is a true contradiction). So this is equivalent to the above.

  Now, note the distinctions:

  - True contradiction: typically means either (a) or (b) with (i) and (A) (the radical reading).
  - Truth-value glut: a sentence that is both true and false (in a model or in reality). In the radical reading, a true contradiction would be a glut in reality.
  - Truth-value gap: a sentence that is neither true nor false. This is not directly related to the current claim, but a gap theory (like in supervaluationism) is an alternative to glut theory for handling paradoxes.
  - Inconsistent but simply false theory: a theory that is inconsistent (entails a contradiction) but is not true. This is the classical view: if a theory is inconsistent, then it cannot be true (because reality is consistent). But in a paraconsistent logic, we might still use an inconsistent theory without believing it to be true.

  Paraconsistency: 
  - The existence of a true contradiction (in the radical sense) does not force paraconsistency, but it makes it very appealing because if we have true contradictions, we don't want them to entail everything. So we need a logic that doesn't explode. However, one could in principle have an explosive logic and just accept that everything is true (trivialism) but that is not appealing.
  - Conversely, one can adopt paraconsistency without true contradictions (e.g., to deal with inconsistent but useful theories, or to have a more tolerant system). So paraconsistency does not require true contradictions.

  What does the dialetheist need?
  - For the defense of a paraconsistent treatment of a paradox, the dialetheist typically needs the radical reading: that the paradox (e.g., the Liar) is a true contradiction in reality (so (a) or (b) with (i) and (A)). They claim that the Liar sentence is both true and false. 

  What is smuggled in by the wording?
  - The wording "some contradictions are true" is ambiguous. Often, when people use it in discussions, they might be thinking of the trivial model-theoretic readings (like (d) or (b) with (ii) and (B)) and then slide into the radical reading. The radical reading is not established by the trivial ones. The trivial ones only show that in formal models we can have gluts, but that doesn't show that there are gluts in reality.

  Which reading are people usually reaching for?
  - I think in the context of defending a paraconsistent treatment of a paradox, the speaker is reaching for the radical reading: that the paradox (like the Liar) is a true contradiction in reality. But sometimes they might retreat to the model-theoretic reading when pressed.

  Does that reading survive the paradox?
  - The dialetheist argues that it does: by accepting that the Liar sentence is both true and false, they avoid the revenge paradoxes (at least to some extent) and provide a consistent (in their own terms) account. But critics argue that dialetheism faces its own revenge problems (e.g., a sentence that says "this sentence is only false" or "this sentence is not true" might cause trouble). So it is controversial.

  Summary of the menu (ordered from trivial to radical):

  1. (c) + (iv) + (C): Inconsistent theories are provably inconsistent in our metatheory. (Platitude)
  2. (d) + (ii) + (B): There are models that assign gluts. (Platitude)
  3. (b) + (ii) + (B): There are models that make (P ∧ ¬P) true. (Platitude)
  4. (a) + (iii) + (A): We have warranted assertibility for both P and ¬P for some P in the actual world. (Substantive and defensible in some contexts)
  5. (a) + (i) + (A): There is a proposition P such that both P and ¬P are true in reality. (Radical, dialetheism)

  The dialetheist needs reading 5 for the paradox. The trivial readings (1-3) are often smuggled in to make the claim seem less radical, but they don't establish reading 5.

  Final note: The line "some contradictions are true" is often used in a way that equivocates between the trivial and radical readings. The radical reading (5) is what the dialetheist needs, and it is controversial. It is an open question whether it survives the paradoxes (dialetheists say yes, classical logicians say no).
answer: |-
  ### Analysis of "Some contradictions are true"

  I'll provide a precise map of the possible readings of your colleague's claim, ordered from trivial to radical. The axes of variation are:
  1. **Contradiction**: What it picks out.
  2. **True**: What "true" means.
  3. **Some**: How wide the quantifier ranges.

  For each reading, I'll categorize it as:
  - **Platitude**: Uncontroversially true or definitional.
  - **Substantive/defensible**: Non-trivial but coherent and arguable.
  - **Plainly false**: Incoherent or widely rejected in standard frameworks.

  I'll also note:
  - Distinctions between **true contradictions** (the contradiction itself is true), **truth-value gluts** (a sentence is both true and false), **truth-value gaps** (a sentence is neither), and **inconsistent theories** (theories that entail contradictions but may be false).
  - Where **paraconsistency** (a logic where contradictions don't entail everything) follows or not.
  - What dialetheists (who endorse true contradictions) **need** for their paradox treatments vs. what is **smuggled in** by ambiguous wording.
  - The **most common reading** used in such lines and whether it survives the paradox.

  ---

  #### **1. Trivial Readings (Platitudes)**
  These are uncontroversial and often hinge on technical or non-actual interpretations.

  - **Reading 1a**  
    - *Contradiction*: A theory (set of sentences) that entails both a proposition and its negation.  
    - *True*: Derivability in a target metatheory (e.g., we can prove the theory is inconsistent).  
    - *Some*: At least one formal system (e.g., an artificial or toy theory).  
    - **Evaluation**: Platitude. Example: The theory with axioms {A, ¬A} is inconsistent, and we can prove this in our metatheory.  
    - **Paraconsistency?** No. This doesn't require paraconsistent logic; classical logic can describe inconsistent theories.  
    - **Dialetheist need?** No. This is about meta-theoretic derivations, not true contradictions.  

  - **Reading 1b**  
    - *Contradiction*: A sentence assigned a glut truth-value (both true and false) in a model.  
    - *True*: Truth in a model (e.g., a formal semantics like Priest's LP).  
    - *Some*: At least one model in a non-classical logic.  
    - **Evaluation**: Platitude. Example: In a paraconsistent model for the Liar paradox, "This sentence is false" is a glut.  
    - **Distinctions**: This describes a truth-value glut in a model, not a "true contradiction" simpliciter. Gaps (neither true nor false) are separate and not asserted.  
    - **Paraconsistency?** Paraconsistent logics use such models, but this reading doesn't entail paraconsistency for the actual world.  
    - **Dialetheist need?** No. Gluts in models are tools, but dialetheists need truth in reality.  

  - **Reading 1c**  
    - *Contradiction*: A pair (P, ¬P) of propositions.  
    - *True*: Truth in a model.  
    - *Some*: At least one model (e.g., in a many-valued logic).  
    - **Evaluation**: Platitude. Example: In a model with gluts, P and ¬P are both true for some P.  
    - **Paraconsistency?** Paraconsistent logics admit such models, but classical logic does not.  
    - **Dialetheist need?** No. This is model-relative, not about reality.  

  #### **2. Moderate Readings (Substantive/Defensible)**
  These are non-trivial but defensible in specific contexts. They avoid radical metaphysical claims.

  - **Reading 2a**  
    - *Contradiction*: A pair (P, ¬P).  
    - *True*: Warranted assertibility (we have justification to assert both).  
    - *Some*: At least one case in the actual world (e.g., paradoxical statements).  
    - **Evaluation**: Substantive/defensible. Example: For the Liar sentence, we might have equal warrant to assert it and its negation.  
    - **Distinctions**: About epistemic justification, not truth simpliciter. Gluts/gaps are separate (this doesn't require them).  
    - **Paraconsistency?** May motivate paraconsistent logic to handle conflicting warrant, but not required.  
    - **Dialetheist need?** No. Dialetheists need truth, not just warrant.  
    - **Smuggled in?** Often. The wording "true" conflates warrant with truth.  

  - **Reading 2b**  
    - *Contradiction*: A single conjunctive proposition (P ∧ ¬P).  
    - *True*: Truth in a model.  
    - *Some*: At least one case in the actual world (intended model).  
    - **Evaluation**: Substantive/defensible if "model" includes the actual world. Example: In a dialetheic semantics, the Liar sentence is (P ∧ ¬P) and true in the intended model.  
    - **Distinctions**: Asserts a truth-value glut in the actual world. Inconsistent theories are different (they may be false).  
    - **Paraconsistency?** Yes. Gluts require paraconsistent valuation to avoid explosion.  
    - **Dialetheist need?** Getting closer, but still model-relative. Dialetheists need truth simpliciter.  

  #### **3. Radical Readings (Plainly False or Highly Controversial)**
  These make strong metaphysical claims, often rejected outside dialetheism.

  - **Reading 3a**  
    - *Contradiction*: A pair (P, ¬P).  
    - *True*: Truth simpliciter (objective truth in reality).  
    - *Some*: At least one case in the actual world.  
    - **Evaluation**: Plainly false in classical/logical monist frameworks; substantive for dialetheists. Example: The Liar sentence and its negation are both true.  
    - **Distinctions**: A true contradiction (not just a glut/gap). Inconsistent theories may still be false if their contradictions aren't true.  
    - **Paraconsistency?** Yes. If true contradictions exist, explosion must fail to avoid trivialism.  
    - **Dialetheist need?** **Yes.** This is the core dialetheist claim for paradoxes like the Liar.  

  - **Reading 3b**  
    - *Contradiction*: A single proposition (P ∧ ¬P).  
    - *True*: Truth simpliciter.  
    - *Some*: At least one case in the actual world.  
    - **Evaluation**: Equivalent to 3a (since (P ∧ ¬P) is true iff P and ¬P are both true).  
    - **Dialetheist need?** **Yes.** Used interchangeably with 3a.  

  - **Reading 3c**  
    - *Contradiction*: A theory that entails both P and ¬P.  
    - *True*: Truth simpliciter (the theory correctly describes reality).  
    - *Some*: At least one theory for the actual world.  
    - **Evaluation**: Plainly false classically; radical for dialetheists. Example: Naive set theory is inconsistent but "true" for reality.  
    - **Distinctions**: An inconsistent theory being true entails that its contradictions are true (like 3a), but inconsistent theories can be false without true contradictions.  
    - **Paraconsistency?** Yes. If true, the theory requires paraconsistent logic.  
    - **Dialetheist need?** Indirectly. True theories with contradictions imply true contradictions.  

  ---

  ### Key Distinctions Clarified
  - **True contradiction**: The contradiction (pair or conjunction) is true simpliciter (Readings 3a/b).  
  - **Truth-value glut**: A sentence is both true and false (Readings 1b, 2b). Not all gluts are "true contradictions" (e.g., gluts in models aren't simpliciter).  
  - **Truth-value gap**: A sentence is neither true nor false. **Not asserted** in the claim; gaps avoid contradictions but are irrelevant here.  
  - **Inconsistent but false theory**: A theory entails (P ∧ ¬P) but is untrue (e.g., classical view of naive set theory). **Distinct** from true contradictions.  

  ### Paraconsistency Connection
  - Paraconsistency **follows** only if true contradictions or gluts exist in the actual world (Readings 2b, 3a-c).  
  - Paraconsistency **does not follow** from trivial readings (e.g., gluts in models, inconsistent theories derivable in metatheory).  

  ### What Dialetheists Need vs. What Is Smuggled In
  - **For paradox work**: Dialetheists need **Reading 3a/3b** (true contradictions simpliciter in the actual world) to defend paraconsistent treatments. This is the only reading where the contradiction is "doing real work" for paradoxes like the Liar.  
  - **Smuggled in**: The wording often smuggles in trivial (1a-c) or moderate (2a) readings to make the claim seem innocuous, then shifts to radical readings. For example:  
    - Using model-theoretic gluts (1b) to imply true contradictions (3a).  
    - Using warranted assertibility (2a) to imply truth simpliciter (3a).  

  ### Most Common Reading and Survival
  - **Usual reach**: People repeating this line typically reach for **Reading 2b** (glut in the actual world's model) or **3a** (true contradiction simpliciter), but equivocate with trivial readings.  
  - **Survival in paradoxes**:  
    - **Reading 2b/3a**: Dialetheists argue these survive paradoxes (e.g., the Liar) by accepting the contradiction and avoiding revenge via paraconsistency. However, they face challenges:  
      - Revenge paradoxes (e.g., "This sentence is not true only" may require hyper-gluts).  
      - Classical critics reject truth simpliciter for contradictions.  
      - **Verdict**: Defensible in dialetheic frameworks but not in classical ones; doesn't universally "settle" the argument.  
    - Trivial readings (e.g., 1a) survive but do no work for the paradox. Moderate readings (e.g., 2a) survive but don't justify paraconsistency.  

  ### Conclusion
  Your colleague's claim is ambiguous but likely relies on equivocation between trivial and radical readings. For the paradox work, they need **true contradictions simpliciter in the actual world (3a/3b)**. While defensible in dialetheism, this is highly controversial and not settled by the trivial readings. To "settle" the argument, insist on disambiguation: Ask whether they mean truth *simpliciter* or something weaker, and whether "some" ranges over reality or just models. If they retreat to trivial readings, note that these don't support paraconsistent treatments; if they commit to radical readings, the debate continues on metaphysical grounds.
