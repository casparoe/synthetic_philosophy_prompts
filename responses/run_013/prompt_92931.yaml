  Then run the mapping in both directions. First, whose objection in the controversy is genuinely the Popperian one? Keep apart the charge against natural selection itself and the charge against particular adaptationist hypotheses; say which of Gould and Lewontin's arguments are falsifiability complaints and which are really about pluralism, developmental constraint, or politics wearing scientific dress; and assess whether the standard replies — that the critics identified mistakes in execution rather than a flaw in the programme — answer the Popperian version of the charge or quietly change the subject. Second, turn it around and test Popper against the episode: does the controversy vindicate the metaphysical-research-programme label, or does it show the label is too coarse, because the live question was never whether Darwinism in the abstract is testable but whether individual selectionist hypotheses were, which is roughly what his own recantation concedes? Say where Popper is simply silent rather than forcing him to speak.

