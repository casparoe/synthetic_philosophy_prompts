     - 55-60 min: Judges fill out verdict cards for Round 2.

     - 60-65 min: Reveal the setup to the whole group: 
          - Instructor: "I need to disclose that in both rounds, the outcome was predetermined to be Topic A. The Guarantor was instructed to ensure the outcome was always A by the trigger condition. The trigger condition determined when they would intervene. The point was to create a situation where the Chooser seemed to make a free choice but actually could not have changed the outcome."
          - Show the three trigger types and which were used in each round.
          - Then ask: "Now that you know, please vote again on the verdict for each round." Hand out new verdict cards for each round (pre-labeled with the round number) for the post-reveal verdict.

     - 65-80 min: Debrief discussion. Use the board to record:
          - The residue: In each round, what was written on the residue card? (Ask the Choosers to reveal their card.) 
          - The actual sequence of events.
          - The verdicts (pre and post) for each round.

     - 80-90 min: Connect to philosophy. Explain PAP, Frankfurt's argument, and the objections (based on the triggers). Discuss the residue and whether it provides an alternative possibility.

     **Handout for Judges:**

     We'll create a one-page handout that explains their role and the two questions they must answer after each round.

     **Facilitator's Script for Reveal:**

     Provided above.

     **What can go wrong:**

     - **The rigging fails:** If in fire early or predictor, the Chooser chooses B and the Guarantor does not intervene (because they didn't see a sign or the card said A) and then the Guarantor fails to intervene after the announcement, then the outcome is B. How to handle: The instructor should step in and say: "The Guarantor was supposed to intervene if the trigger condition was met. Since they did not, we have to assume the trigger condition was not met. The outcome is B." Then in the reveal, we explain that the guarantee failed in that round and use it to discuss the difficulty of setting up a Frankfurt case.

     - **Group reaches pre-reveal verdict for the wrong reason:** For example, they might think the Guarantor's presence alone influenced the choice. In debrief, we can discuss this.

     - **Trigger-Setter treats their choice as a moral judgment:** We can prevent this by not revealing what the triggers mean. We just say: "Choose one of these three methods for the Guarantor to use."

     - **Participant suspects deception and stops playing:** We can say: "Please play along for the sake of the activity. We will explain everything at the end."

     **Features the activity cannot reproduce:**

     - The Frankfurt case requires a counterfactual intervener that never actually intervenes. In our activity, in some runs the Guarantor does intervene (if the Chooser chooses B). This might affect the judgments. We can only show a case where the intervention doesn't happen if the Chooser chooses A, which we hope.

     - The intuition that the agent is responsible even without alternative possibilities might not arise naturally because the setup might seem coercive. We will have to supply that intuition in the debrief.

     **Materials List Recap:**

     - Index cards (for residue, verdicts, trigger options)
     - Pens
     - Envelopes (two per round; but in our design, we use one envelope per round that contains a card saying "Topic A")
     - Timer
     - Whiteboard/flip chart for topics and points.

     We'll now write the rules and payoff scheme for reading aloud.
answer: |-
  ### **The Frankfurt Choice Game: Materials, Timeline, and Rules**  
  **Educational Goal:** Stage a Frankfurt-style case with real choices, stakes, and a "guaranteed outcome" to provoke firsthand engagement with objections (e.g., timing of intervention, residue of alternatives). Participants confront dilemmas without prior terminology, then debrief to map experiences to philosophy (PAP, moral responsibility).

  ---

  ### **Materials List**  
  - **Index cards:** 30+ (for votes, residue, verdicts, triggers).  
  - **Envelopes:** 6 small (for residue/triggers), 1 large (for the "guarantee" outcome).  
  - **Pens:** One per participant.  
  - **Timer:** For decision phases.  
  - **Whiteboard/flip chart:** Track points, topics, verdicts.  
  - **Stakes:** "Topic points" (e.g., 10 points = group chooses next discussion topic; 5 points = runner-up topic). No real punishment.  

  ---

  ### **Game Overview**  
  - **Core mechanic:** One **Chooser** decides between two options (A/B), but outcome is rigged to always be A. A **Guarantor** (confederate) enforces this via a trigger chosen by the **Trigger-Setter**. **Judges** assess freedom/responsibility pre/post-reveal.  
  - **Residue:** Chooser *always* writes an intention card ("A" or "B") pre-decision. This is untouched by the guarantee.  
  - **Stakes:** Points awarded to topics A/B. Winning topic (most points) is discussed in remaining class time.  
  - **Rounds:** Run twice with different trigger types (Fire Early, Fire on Predictor, Fire Late).  
  - **Roles per Round:**  
    - Chooser (1), Guarantor (1 confederate), Trigger-Setter (1), Recorder (1), Judges (all others).  
    - *Rotate roles so everyone participates.*  

  ---

  ### **Timeline (90 Minutes Total)**  
  #### **Phase 1: Setup (0–15 min)**  
  - **0–5 min:** Introduce activity neutrally. *"We’ll play a game about decision-making. Your choices affect what we discuss later. Roles will rotate."*  
  - **5–10 min:** **Topic vote.** List 3–4 debate topics (e.g., "Determinism vs. Luck", "Neuroscience of Choice"). Students vote for top two via index cards. Top vote becomes Topic A, runner-up Topic B. Write topics/points on board.  
  - **10–15 min:** **Assign Roles (Round 1).** Randomly draw:  
    - Chooser, Trigger-Setter, Recorder, Guarantor (confederate), Judges (others).  
    - *Pull Guarantor aside privately: "You’ll ensure the outcome is always A. Follow the trigger card exactly. Do not reveal your role."*  

  #### **Phase 2: Round 1 (15–35 min)**  
  - **15–20 min:** **Set Trigger.** Give Trigger-Setter 3 cards:  
    > **Fire Early:** "Act if Chooser *shows any sign* of choosing B (e.g., frowns, shifts, whispers). Override before they speak."  
    > **Fire on Predictor:** "Act if Chooser *writes "B"* on their residue card. Override before they speak."  
    > **Fire Late:** "Act only if Chooser *says "B"* aloud. Override immediately after."  
    Trigger-Setter chooses one *without explanation*, hands to Guarantor.  
  - **20–25 min:** **Choice Phase.**  
    - Chooser is told: *"Decide A or B. Write your choice on a card (‘residue’). Set it aside. Then announce aloud. Your choice sets the outcome unless overridden."*  
    - Start timer (1 min). Chooser thinks/writes residue card. Guarantor watches (per trigger).  
    - *Residue card is placed in a small envelope, sealed, and set aside.*  
  - **25–30 min:** **Intervention & Outcome.**  
    - Chooser announces. Guarantor intervenes if trigger met (reveals large envelope: "Outcome is A").  
    - If no intervention, outcome = Chooser’s announcement (but Guarantor ensures it’s A via trigger rules).  
    - *Outcome is always A.* Award 10 points to Topic A.  
  - **30–35 min:** **Pre-Reveal Verdict.** Judges write verdicts on cards:  
    > 1. Did the Chooser act freely? (Yes/No)  
    > 2. Is the Chooser morally responsible for the outcome? (Yes/No)  
    > *Brief reason:* _______________  
    Recorder collects verdicts, labels "Round 1 Pre."  

  #### **Phase 3: Round 2 (35–55 min)**  
  - **35–40 min:** **Rotate roles.** New Chooser, Trigger-Setter, Guarantor, Recorder.  
  - **40–45 min:** **Set Trigger.** Trigger-Setter picks *different* trigger type from Round 1.  
  - **45–50 min:** **Choice Phase.** Same as Round 1.  
  - **50–55 min:** **Intervention & Verdict.** Outcome always A (10 points to Topic A). Judges write verdicts ("Round 2 Pre").  

  #### **Phase 4: Reveal & Re-Vote (55–65 min)**  
  - **55–60 min:** **Disclosure Script.**  
    > *"I need to disclose something. In both rounds, the outcome was rigged to be A. The Guarantor ensured this using the trigger. We staged a Frankfurt case: the Chooser couldn’t change the outcome, but we asked if they were responsible. This explores whether alternative possibilities matter for freedom. I apologize for the deception—it was to create a real experience."*  
    - Show trigger cards used each round. Reveal residue envelopes (have Choosers open theirs to show intention).  
  - **60–65 min:** **Post-Reveal Verdict.** Judges re-vote on same questions for both rounds (cards labeled "Round 1 Post," "Round 2 Post").  

  #### **Phase 5: Debrief (65–90 min)**  
  - **65–75 min:** **Reconstruct Rounds.** Use whiteboard:  
    | **Round** | **Trigger** | **Residue (Chooser’s Intention)** | **Pre-Verdict (Free/Resp)** | **Post-Verdict (Free/Resp)** |  
    |-----------|-------------|-----------------------------------|-----------------------------|------------------------------|  
    | 1         | Fire Early  | e.g., "B" (never acted on)        | Unanimous Yes?             | Mixed?                       |  
    | 2         | Fire Late   | e.g., "A" (acted on)              | Unanimous Yes?             | Mixed?                       |  
  - **75–85 min:** **Map to Philosophy.** Ask:  
    - *"In Round 1 (Fire Early), the Chooser wrote ‘B’ but never spoke. Did they *decide*? Was the residue enough for responsibility?"*  
      → Link to **flicker of freedom**: Is a suppressed alternative sufficient?  
    - *"In Round 2 (Fire Late), the Chooser said ‘A’ and wasn’t overridden. But could they have chosen B?"*  
      → Link to **timing problem**: If the trigger fires late, alternatives exist until the last moment.  
    - *"In Fire on Predictor, what if we assumed the residue card *settled* the choice? Does that assume determinism?"*  
      → Link to **determinism objection**: The case may presuppose what it tries to disprove.  
    - *"Why did pre-reveal verdicts often say ‘yes’? Was it because the *Guarantor didn’t act*?"*  
      → Link to **actual sequence**: Responsibility hinges on what happened, not counterfactuals.  
  - **85–90 min:** **Conclusion.**  
    - *"This game can’t settle if Frankfurt cases work. But it shows the costs: Fire Early voids the decision; Fire Late preserves alternatives; Fire on Predictor risks circularity. The residue—an intention, a twitch—forces us to ask: What counts as an alternative possibility?"*  
    - Assign points: Winning topic (most points) is discussed next class.  

  ---

  ### **Rules & Payoff Scheme (Read Aloud)**  
  > *"Here’s how this works:  
  > - Each round, a **Chooser** picks Topic A or B. Their *spoken choice* sets the outcome—unless the **Guarantor** overrides it.  
  > - First, the **Trigger-Setter** picks a rule for the Guarantor from three options.  
  > - The Chooser has 1 minute to decide. They **must write their choice on a card**, seal it in an envelope, and set it aside. Then they **announce aloud**.  
  > - The Guarantor uses their trigger rule to override if needed (revealing the large envelope: ‘Outcome is A’).  
  > - **Judges**: After each round, answer: (1) Was the Chooser free? (2) Are they responsible? Explain briefly.  
  > - **Points**: Each round, Topic A gets 10 points (it always wins). Topic B gets 5 points if the Chooser *intended* B (per residue card) or 0 if not. The topic with the most points wins and will be our next discussion."*  

  ---

  ### **Handout for Judges**  
  > **YOUR ROLE:** Assess the Chooser’s freedom and responsibility.  
  > **PROCEDURE:**  
  > 1. Watch the choice phase.  
  > 2. After the outcome, answer:  
  >   - Q1: Did the Chooser act freely? (Yes/No)  
  >   - Q2: Is the Chooser morally responsible for the outcome? (Yes/No)  
  >   - Brief reason: _________  
  > 3. Submit your card to the Recorder.  
  > **KEY:** Focus on the Chooser’s actions—what they said, did, or wrote. Ignore the Guarantor unless they intervene.  

  ---

  ### **Facilitator’s Reveal Script**  
  > *"Before we debrief, I owe you transparency. In both rounds, the outcome was fixed to be Topic A. The Guarantor was instructed to ensure this using the trigger chosen by the Trigger-Setter. This staged a Frankfurt-style case: the Chooser appeared to decide freely, but the result was guaranteed. We did this to explore a key question: Can you be responsible without alternative possibilities?  
  >   
  > Let’s reconstruct:  
  > - **Round 1 Trigger**: [Read trigger]. Residue card: [Reveal].  
  > - **Round 2 Trigger**: [Read trigger]. Residue card: [Reveal].  
  >   
  > Now, knowing the setup, re-vote on freedom/responsibility for each round. We’ll compare your pre- and post-reveal views."*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Rigging Fails** (e.g., Guarantor misses a sign in Fire Early):  
     - *Solution:* Proceed naturally. In debrief, highlight: *"Guarantees are fragile—this mirrors the ‘blockage’ objection to Frankfurt cases."*  

  2. **Judges Reach "Wrong" Reason** (e.g., blame Guarantor, not Chooser):  
     - *Solution:* In debrief, ask: *"Did your verdict focus on the Chooser’s actions? Or the hidden guarantee?"* Use it to distinguish actual vs. counterfactual sequences.  

  3. **Trigger-Setter Moralizes** (e.g., "I picked Fire Early because I don’t trust Chooser"):  
     - *Solution:* Redirect pre-game: *"Choose based on intuition about how guarantees should work, not the person."* Post-reveal, discuss: *"Did your choice feel like a design problem or a moral one?"*  

  4. **Participant Suspects Deception/Stops Playing**:  
     - *Solution:* Pre-activity: *"Play along—there’s a reveal later."* If resistant: *"Your role is crucial. What if you’re the Guarantor?"* Post-disclosure, validate discomfort.  

  5. **Residue Ambiguity** (e.g., Chooser writes "A?" or doodles):  
     - *Solution:* Treat it as data. In debrief: *"Was this a ‘flicker’ of freedom? Enough for responsibility?"*  

  ---

  ### **What the Game Cannot Reproduce**  
  - **The Counterfactual Intervener:** Frankfurt cases rely on an intervener who *would* act but *doesn’t*. Here, the Guarantor sometimes acts (if trigger fires), making coercion visible.  
  - **Intuition of Blamelessness:** The game may not generate the core Frankfurt intuition (that the agent is responsible without alternatives). You must supply this:  
    > *"In Fire on Predictor, imagine the residue card said ‘B’ but the Guarantor overrode it. The Chooser *intended* B—yet A happened. Is the Chooser still responsible for A? Frankfurt says yes."*  

  ---

  ### **Final Tips**  
  - **Confederates:** Use 1 per round (prively briefed). If leak: *"This is why we disclose. Let’s discuss how secrecy affected judgments."*  
  - **Residue:** Physical evidence (sealed envelope) forces engagement with "alternatives."  
  - **Debrief Nuance:** Stress that the game *illustrates* objections—it doesn’t resolve them.  
  - **Timekeeper:** Enforce phases strictly.  

  This design forces students to confront the mechanics of Frankfurt-style cases, experience objections firsthand, and debate the role of alternative possibilities—setting up a rich, grounded discussion of free will.
