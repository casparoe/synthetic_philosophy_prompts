  But in the 100-person case with 99@9 and 1@1, prioritarianism still prefers B even with log: 99*log9≈217.5, vs 100*log5≈160.9. So if the professor prefers A, it's likely leximin.

  Now, Harsanyi's theorem assumes that social preferences satisfy the von Neumann-Morgenstern axioms, including independence, and that individual utilities are vNM. The veil of ignorance implies that behind the veil, you maximize expected utility, leading to sum of utilities. But the professor is violating the independence axiom because she's risk-averse. In the coin flip case, both options have the same expected utility per person, but she prefers the sure thing, showing risk aversion. Harsanyi's theorem doesn't allow for social risk aversion unless individuals are risk-averse, but in the coin flip, if individuals are risk-neutral, social should be risk-neutral. But here, she's risk-averse at the social level, which contradicts Harsanyi.

  So the premise she's dropping is probably that social preferences satisfy the vNM axioms, specifically independence. Or, she's rejecting the veil of ignorance as a justification for utilitarianism. Alternatively, she might be imposing a different form of social welfare function that incorporates inequality aversion.

