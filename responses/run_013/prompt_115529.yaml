  I'm in a social choice course and our prof keeps telling us Harsanyi's theorem is the answer to how you add up different people's interests: social welfare is basically the sum of everyone's expected utilities, with equal weights if you do the veil-of-ignorance thing. But her rulings on the toy cases she gives us in seminar dont look like that at all. So far she's said (1) a village where everyone gets 5 units is better than one where half get 9 and half get 1, even though the totals are identical; (2) everyone getting 5 is also better than a coin flip that gives everyone 9 on heads and everyone 1 on tails, which has the same total in expectation; (3) a sure 6 for everyone obviously beats a sure 5 for everyone. Next week we get a case with a hundred people, where policy A gives all of them 5 and policy B gives 99 of them 9 and one of them 1. What's she going to say, and which rule is she actually running -- plus which other rules fit her three verdicts just as well? Give me a further case I could put to her that would seperate those rules, and if her rulings really do contradict the theorem she taught us, which premise of it is she quietly dropping?
