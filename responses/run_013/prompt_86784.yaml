prompt: |-
  I've been going down a rabbit hole on invertebrate welfare ever since a friend who works in seafood supply told me that the shrimp she buys for her restaurant are almost certainly from hatcheries where the females have their eyestalks cut, pinched, or cauterized to make them spawn — apparently it's near-universal in commercial shrimp maturation, it's banned in EU organic production, and some big UK retailers have committed to phasing it out, but it's still basically standard practice worldwide. Meanwhile I remember the UK went through this whole thing where a review commissioned by the environment department looked at a few hundred studies and concluded that octopuses, squid, cuttlefish, crabs, lobsters and crayfish should all be regarded as sentient for the purposes of animal welfare law; then the 2022 Animal Welfare (Sentience) Act was amended to bring decapod crustaceans and cephalopods into scope, and an animal sentience commitee was set up to advise on whether government policy properly considers their welfare. So you have a legal recognition of sentience arriving on one side, and a routine, painful, growth-promoting practice continuing in the supply chains those same countries import from on the other, and it's genuinely unclear whether the recognition does any work at all.

  What I want is for you to take that whole episode — the review, the amendment, the committee, and the eyestalk ablation case sitting right next to it — and analyze it through the precautionary principle as it's used in animal welfare and environmental law. Map it properly: who the actors are (the reviewers, the ministers, the committee, the producers, the retailers), what the decision under uncertainty actually was at each step, what the precautionary principle says they should have done, and where the principle gives real guidance versus where it just dissolves into 'more research needed'. Then tell me where the analysis breaks. Does the precautionary principle explain why eyestalk ablation is still routine, or is the real explanation something the principle can't capture — namely that the legal category is binary (sentient or not) while the evidence is a continuum, and the committee can only advise rather than regulate? And finally, what does the episode show about the precautionary principle itself: a confirmation, an anomaly it can't handle, or a situation it never anticipated, where recognizing sentience in a new taxon turns out to be politically cheap precisely because it doesn't commit anyone to changing a practice? Don't give me a reading list, just do the analysis. And please don't just tell me the principle says be cautious — I know that, I want the machinery.
