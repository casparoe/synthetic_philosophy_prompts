  Hmm, the user is asking me to draft interview questions for a decision theorist who challenges the standard view of the unilateralist's curse. This is quite specialized - they've been part of rationalist communities for a decade and host a meetup series where the audience already knows the basics. I need to create focused questions that dig into this guest's specific arguments without rehashing fundamentals.

  The guest's position has several key elements: she argues that adverse selection (not aggregation) drives the curse, criticizes conformity as ineffective, proposes a costly registry system instead, and claims asymmetry between action and inaction cases. The user wants questions pressing on three specific areas: empirical coherence of adverse selection, correlated errors in registry systems, and the asymmetry claim. Each question needs a sharp follow-up anticipating the likely reply.

  I need to avoid biographical questions or citation requests - the audience can look those up. The questions should be technical and challenging, suitable for experts. I should craft 9-11 questions total, with at least one on each of the specified focus areas, plus a closing question about evidence that would falsify her view.

  For the adverse selection question, I could challenge whether overconfidence correlates with incompetence in the required direction. The follow-up could highlight what aggregation predicts that her model doesn't. For the registry system, I should question whether making registries visible might create stampedes through correlated errors. And for asymmetry, I should push back on whether it's truly different or just omission bias in disguise.

  The closing should be about what evidence would change her mind, with a follow-up about what she'd do without such evidence. This tests the falsifiability of her position. All questions need to be precise and steelman her arguments while still applying pressure. Since the audience is sophisticated, I can use technical language like "ex-ante Pareto frontier" without explanation.

  I'll structure this as 11 questions: three sets addressing each focus area, plus the falsifiability pair. Each will have a main question and a prepared follow-up that anticipates her probable response. This should create a rigorous, productive discussion that advances the debate beyond rehashing standard positions.
answer: |-
  Here are 11 tightly focused interview questions with anticipated replies and sharp follow-ups, designed to rigorously engage the core of her position:

  1.  **Core Mechanism:** "You argue the unilateralist's curse is fundamentally driven by *adverse selection* – the first actor is likely the least sensitive to downsides – rather than simple error aggregation. Could you elaborate on the *causal mechanism* by which adding more capable agents *actively selects for worse decision-makers* in the 'first actor' role, compared to a scenario with fewer agents?"
      *   *Likely Reply:* She'll emphasize that agents with higher risk tolerance/lower downside sensitivity (potentially due to overconfidence, differing values, or ignorance) are systematically more likely to reach the action threshold first. More agents increase the pool of potential low-sensitivity actors, making it probable the *very worst* evaluator acts first.
      *   **Follow-up:** "Doesn't the aggregation model *also* predict that more agents increase the chance of *someone* acting, potentially someone with a flawed estimate? If both models predict more actors lead to more bad actions, what *unique, testable empirical prediction* does the adverse selection model make that the aggregation model does not? (e.g., Does it predict *worse* actions than aggregation would expect with random actors?)"

  2.  **Empirical Coherence - Competence/Overconfidence:** "A key link in your adverse selection argument seems to be that agents most prone to act unilaterally (due to low downside sensitivity) are also likely to be *less competent* or *more systematically biased* in their evaluation of the action's net value. What empirical evidence or theoretical reasoning leads you to believe that *overconfidence* (or low downside sensitivity) reliably correlates with *poor calibration* or *incompetence* in the specific high-stakes domains relevant to the curse (like existential risk interventions)? Couldn't we imagine competent mavericks?"
      *   *Likely Reply:* She'll argue that in complex, uncertain domains, genuine competence usually breeds epistemic humility and awareness of potential downsides/unknowns. Overconfidence often stems from ignorance or failure to grasp complexity, correlating with poorer judgment. Mavericks may exist but are outliers.
      *   **Follow-up:** "If the correlation isn't perfect – if there exists a non-trivial set of highly competent, highly confident agents willing to act – doesn't the adverse selection mechanism break down? Couldn't adding *more* agents then *increase* the chance such a competent maverick exists and acts *beneficially*, contradicting the core curse prediction? How strong must the negative correlation be for your mechanism to dominate?"

  3.  **The Failure of Conformity:** "You dismiss conformity ('only act if others would') as ineffective, partly because it doesn't address selection. But conformity proponents argue it *directly counters aggregation* by requiring consensus, reducing the chance *anyone* acts on a low-threshold error. Why is tackling selection *more fundamental* than reducing the raw probability of erroneous action via aggregation control?"
      *   *Likely Reply:* She'll argue conformity fails *because* of selection: the agents most likely to *break* conformity are precisely those least sensitive to downsides, negating its purpose. It doesn't filter *who* might defect, only hopes they won't. It also crumbles under correlated errors.
      *   **Follow-up:** "Isn't this critique contingent on the *strength* of the adverse selection? If selection is weak (e.g., competence and confidence aren't strongly negatively correlated), might conformity still be effective by purely reducing the *aggregate* action probability? Does your rejection of conformity *depend entirely* on the empirical validity of your strong adverse selection claim?"

  4.  **Registry Mechanics & Cost:** "Your proposed remedy is costly pre-commitment via a public registry: declare intent and confidence, then only act if you'd still do so after seeing others' declarations. Walk us through the *specific costs* this imposes. Are they primarily practical (effort, coordination), reputational, or something else? How do these costs specifically counteract the adverse selection mechanism you identified?"
      *   *Likely Reply:* Costs include effort, reputational risk (looking foolish if wrong or backing down), and opportunity cost (delaying action). They deter low-conviction/low-sensitivity actors who might otherwise impulsively act, forcing serious deliberation and making backing down less costly than acting recklessly. It filters for higher conviction.
      *   **Follow-up:** "Couldn't these costs *also* deter highly competent, high-conviction actors who simply dislike bureaucracy or public scrutiny, potentially *worsening* selection by filtering out the *best* potential actors? How do you ensure the cost structure primarily screens out the *adversely selected* low-sensitivity actors?"

  5.  **Correlated Errors & Registry-Induced Stampedes:** "A major objection to your registry is *correlated errors*. If actors see others registering similar high-confidence intentions (due to shared biases, information cascades, or common faulty models), doesn't the registry *amplify* the risk of a coordinated stampede, precisely because it *creates* correlation where none existed? How does your design prevent the registry itself from becoming a coordination device *for bad actions*?"
      *   *Likely Reply:* She'll argue the key is the requirement to *reaffirm* intent *after* seeing the registry. Seeing many others register should prompt extreme caution for a rational agent, acting as a brake. The cost also deters bandwagoning.
      *   **Follow-Up:** "But doesn't this assume agents are perfectly rational updaters immune to informational cascades or groupthink? If a few prominent, overconfident agents register early, couldn't this *signal* legitimacy to others with correlated biases, causing them to register and reaffirm *despite* seeing others, precisely *because* they see others? Isn't the registry then *enabling* correlated failure rather than preventing it?"

  6.  **Independence vs. Correlation in the Registry:** "Building on correlation: The standard aggregation curse relies on *independent* errors being averaged out by conformity, which fails under correlation. Your registry seems designed for a world of *mostly independent* errors, using the registry to add caution. In a world where errors are *inherently highly correlated* (e.g., everyone using the same flawed model), does your registry offer any protection, or could it make outcomes *worse* than unilateral free-for-all by synchronizing the most confident errors?"
      *   *Likely Reply:* She might concede it's less effective under extreme correlation but argue the reaffirmation step and cost *still* add friction compared to no mechanism. Seeing many confident declarations should be a red flag even under correlation.
      *   **Follow-Up:** "If high correlation is a significant risk, doesn't this reintroduce a case for something *like* conformity? If everyone shares the same flawed model, wouldn't requiring near-unanimity (a strong conformity norm) be the *only* way to prevent *any* action based on that model, whereas your registry might still let a critical mass of correlated high-confidence actors proceed?"

  7.  **The Asymmetry Claim - Core Argument:** "You assert the 'inaction curse' (where everyone assumes someone else will act, so no one does) is *not* simply the unilateralist's curse with the sign reversed. What is the fundamental *structural disanalogy* between the mechanism causing harmful unilateral action and the mechanism causing harmful collective inaction, according to your framework?"
      *   *Likely Reply:* She'll argue the action curse is driven by *selection* of the *worst* actor to move first. The inaction curse is a pure coordination/assurance problem: everyone wants the action done *by someone*, but lacks a coordination mechanism. The failure modes (reckless action vs. costly delay) involve different dynamics.
      *   **Follow-Up:** "Isn't there still a potential selection effect in the inaction case? Couldn't the agents *least* sensitive to the urgency or importance of acting (perhaps due to procrastination, lower valuation of the good, or overconfidence that 'someone else will handle it') be the ones who *fail* to overcome the coordination hurdle? How is this 'inaction-selection' meaningfully different?"

  8.  **Asymmetry - Omission Bias?** "Critics might argue your asymmetry claim smuggles in an 'omission bias' – treating harmful actions as uniquely dangerous compared to equally harmful inactions. If both scenarios can lead to massive, irreversible harm (one via reckless action, the other via catastrophic failure to act), why *shouldn't* the underlying decision-theoretic problem and potential remedies be treated symmetrically? What makes the 'first mover' role in action uniquely vulnerable to perverse selection compared to the 'potential mover' role in inaction?"
      *   *Likely Reply:* She'll likely dispute the symmetry of harm potential or emphasize the *mechanism* difference: the action curse arises from a *race* won by the worst contestant; the inaction curse arises from a *standoff* where no one steps forward. The strategic situations differ, making remedies different (registry vs. coordination devices).
      *   **Follow-Up:** "Even granting different mechanisms, doesn't the *practical consequence* – systemic bias towards catastrophic outcomes due to multi-agent dynamics – remain symmetric? If your registry successfully prevents bad unilateral actions but we *still* suffer catastrophic inactions (e.g., no one deploys a vital intervention), hasn't the overall decision-making system failed just as badly? Doesn't a complete solution need to address *both* failure modes, potentially with different tools?"

  9.  **Registry Scope & Irreversibility:** "Your proposal targets actions with 'global and irreversible consequences.' How narrowly or broadly should 'irreversible' be defined? Many significant actions have complex, partially reversible, or hard-to-predict consequences. Doesn't this ambiguity create significant loopholes or implementation challenges? Could agents exploit it by arguing their action isn't *truly* irreversible?"
      *   *Likely Reply:* She'll advocate for a broad, precautionary interpretation focused on potential for large-scale, persistent harm. Ambiguity is inherent but manageable through norms/oversight. The cost of registry also deters gaming.
      *   **Follow-Up:** "Doesn't this broad scope risk the registry becoming prohibitively cumbersome or ignored? If 'irreversible' includes, say, major economic policies or large-scale ecological interventions, the registry could be flooded, diluting its effectiveness for true existential risks. How do you prioritize?"

  10. **Falsifiability - Core Claim:** "What specific empirical finding or theoretical result would most strongly lead you to reconsider your core claim that adverse selection, not simple error aggregation, is the primary driver of the unilateralist's curse? For instance, evidence that adding more agents *doesn't* degrade the quality of the first actor, or that overconfidence *doesn't* correlate with poor calibration in relevant domains?"
      *   *Likely Reply:* Evidence showing no systematic correlation between willingness to act unilaterally and poor judgment/calibration in high-stakes domains; or evidence that adding more diverse agents reliably *improves* the quality of the first actor compared to fewer agents.
      *   **Follow-Up:** "If such evidence remains elusive or fundamentally unobtainable due to the scarcity of real-world examples (especially in true existential risk contexts), doesn't the precautionary principle push us towards the *most robust* remedy – one that works against *both* aggregation *and* selection mechanisms? Could conformity, despite your critiques, be more robust in the face of this uncertainty?"

  11. **Falsifiability - Registry:** "Similarly, what evidence would convince you that your costly registry proposal is ineffective or net harmful? For example, simulations showing it frequently triggers stampedes under correlation, or case studies where similar mechanisms led to harmful delays or coordination failures?"
      *   *Likely Reply:* Concrete evidence that registries consistently amplify correlated errors leading to bad actions, or that they reliably prevent *beneficial* actions that would have occurred without the registry, without preventing a comparable number of harmful ones. Evidence that costs deter good actors disproportionately.
      *   **Follow-Up:** "Given the immense stakes and difficulty of obtaining real-world evidence, are there any *theoretical adjustments* or *fallback mechanisms* you'd propose if simulations consistently showed your registry performing poorly under moderate-to-high error correlation?"

  These questions directly challenge the novel aspects of her thesis (adverse selection, registry design, asymmetry), probe empirical foundations and unique predictions, stress-test the proposed remedy against key objections (correlation, cost structure, scope), and force engagement with falsifiability and robustness under uncertainty – all while anticipating her likely counterarguments to keep the discussion moving forward rigorously.
