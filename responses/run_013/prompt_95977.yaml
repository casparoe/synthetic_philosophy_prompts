  **2. Rules and ordered phases:**  
  - **Phase 1:** Teams bet on RED or BLUE without opening the envelope.  
  - **Phase 2 (signal offer):** Teams are offered a free, refusable signal (opening the envelope to see the card). If refused, their Phase 1 bet stands. If accepted, they may change their bet.  
  - **Phase 3:** All teams lock in final bets. True color is revealed via coin flip (if unopened) or the card (if opened).  

  **3. Payoff scheme:**  
  - **Baseline:** Correct bet = 10 points; wrong = 0.  
  - **Suspense failure (if signal accepted and card is RED):** Lose 15 points (utility penalty for "bad news").  
  - **Self-prediction failure (Round 3 only):** If signal accepted, lose 5 points if the card predicted their *initial* bet correctly (e.g., if initial was RED and card says "RED"), else gain nothing.  
  *Rationale: 15-point penalty makes refusing RED optimal in suspense; 5-point penalty in self-prediction creates conflict between curiosity and predictability.*  

  **4. Debrief mapping:**  
  - **Phase 2 refusal (e.g., suspense):** Mirrors belief-dependent utility failure (avoiding bad news). Assumption failed: state-independent utility.  
  - **Phase 2 acceptance with bet change (e.g., self-prediction):** Shows information about own action causing costly deviation. Assumption failed: exogeneity of information.  
  - **Phase 2 acceptance/no change (baseline):** Confirms Good’s theorem: learning never harms (expected utility 10 > 5 without signal).  

  **5. Predictable problems and irreproducible feature:**  
  Logistics: Teams may split votes on refusing/accepting signals, causing delays; clarify that majority rules. The activity cannot replicate *any partition of the state space* (Good’s theorem holds for all questions, not just card colors); state this generality verbally.
