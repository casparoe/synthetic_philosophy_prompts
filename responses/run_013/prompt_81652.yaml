     - Also, write the number of I's for each string? No, not yet. We want to avoid giving away the invariant. But the facilitator can note it mentally to see if anyone comments.
     - Goal: to have a rich set of strings. Examples: 
          MI (1 I)
          Apply rule 1: MIU (1 I)
          Apply rule 2: MIUIU (2 I's)
          Apply rule 1 to MIU: MIU -> MIUU (1 I)
          Apply rule 2 to MIU: Mx where x=IU, so MIU -> MIUIU (which we have) -> then rule 2 again? MIUIU -> MIUIUUIU? But that might get messy.
