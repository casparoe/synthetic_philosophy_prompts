     - I am confident that the activity will produce the frustration of being stuck and the relief of the invariant because it is a well-known puzzle that has been used for this purpose (e.g., in Hofstadter's book). The stepping back phase is designed to guide them to the invariant. If they don't get it by themselves, the facilitator's guidance will still lead to the "aha". The debrief then connects this to the broader theme.

