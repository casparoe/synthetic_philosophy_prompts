     - The group might not engage in the exploration. Solution: encourage them, and as facilitator, be enthusiastic.
     - They might get stuck in a rut. Solution: during the building phase, ask groups to share diverse paths.
     - They might discover the invariant too early. Then skip to the debrief and discuss how they did it and what it means.
     - They might not see the invariant in the stepping back phase. Solution: the facilitator guides with leading questions. If necessary, explain it and then discuss the feeling of having it explained versus discovering it.

