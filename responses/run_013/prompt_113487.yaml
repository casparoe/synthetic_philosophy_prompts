answer: |-
  The base—here, the Cold War military-industrial economy—explains *not* the content of drift theory itself (its internal logic emerged from geological observation), nor the initial rejection (which reflected scientific conservatism within the superstructure), but **why the decisive evidence became legible and fundable precisely when it did**. Naval funding created the material means (magnetometers, oceanographic vessels) and prioritized the geographic spaces (ocean basins) where proof was found. Without that economic-military imperative, the crucial data might have remained undiscovered for decades, trapped by the superstructural inertia of land-based geology. The base doesn't dictate truth, but it determines which truths become materially accessible to investigation. Your "uncontroversial point" undersells this: it's not just that science is expensive, but that *which* science gets resources hinges on the base's priorities—here, submarine warfare, not pure curiosity.
