prompt: |-
  I run a 14-person upper-level epistemology seminar, 75 minutes, and I want my students to feel pragmatic encroachment from the inside before I ever say the words. Here's the game I'm half-imagining — please flesh it into something actually runnable, with roles, materials, a timeline, and payoffs that don't need real money. Everyone gets a private signal about which of two boxes holds a token; say the signal is right 80% of the time and they know that's the reliability. Each round, before they're allowed to act on the signal, they have to tick one box: "I know which box it's in" or "I don't know." The only thing that varies between rounds is whats at stake if they act on a wrong signal — sometimes it costs them a point, sometimes a teammate loses a point, in one round the whole team does, and in one round the cost is just a bit of embarrassment. I want them to notice that their information never changed but their willingness to say "I know" did. Then a second phase: split the room, half judges a vignette character who has exactly the signal they had in the low-stakes round and half judges the same character in the high-stakes round, and the two halves compare answers out loud. The debrief should map what just happened onto pragmatic encroachment vs. contextualism vs. the boring invariantist line that we've only changed what people are willing to assert, not what they know — and be honest about which of those three the activity can't actually distinguish, since I'll have to supply that bit. Also tell me what'll predictably go wrong the first time; my guess is someone will insist they were never less certain, just less willing to bet, and I want to know what to do with that instead of arguing them out of it. No lecture up front, and the terms shouldn't slip until the debrief.
reasoning: |-
  Okay, the user wants to create a classroom activity for an epistemology seminar to illustrate pragmatic encroachment without introducing the term first. They've outlined a game concept involving private signals about a token in boxes, where stakes vary each round, affecting students' willingness to claim knowledge. The goal is for students to notice that their confidence doesn't change, but their assertion of knowledge does depending on stakes. 

  Hmm, the user is clearly an experienced philosophy educator—they've designed the core mechanic well and anticipate student pushback ("I was never less certain, just less willing to bet"). Their hidden challenges are probably: making abstract epistemology visceral, avoiding lecture-mode, and handling the inevitable student who'll resist the intended conclusion. 

  First, I should structure this as two phases with strict time allocations since it's a 75-minute seminar. Phase 1 needs to force tension between identical evidence and shifting stakes. The token-guessing mechanic is solid, but I'll suggest: 

  - Using laminated sheets with pre-printed signals/stakes to save time  
  - Having students write "KNOW" or "DON'T KNOW" secretly before acting  
  - Varying stakes carefully: start low (embarrassment), escalate to self-point loss, then teammate harm, finally team-wide consequence  

  Phase 2 should weaponize the hypocrisy angle—make half the class judge a vignette character in low-stakes and half in high-stakes, then reveal disagreement. That’ll mirror real philosophical debates. 

  For pushback, I agree with the user: arguing is futile. Better to validate ("Yes, you felt the same certainty!") then pivot to why we hesitate to claim knowledge when stakes are high—which is exactly what pragmatic encroachment theorists find interesting. The activity can't distinguish between encroachment and contextualism, so I'll flag that for the debrief. 

  Materials should be dead simple: folders for privacy, tokens, maybe a whiteboard for scores. No tech. Predictable snags: students peeking at signals, confusion over team penalties, or someone spoiling the experiment by always claiming knowledge. I'll suggest workarounds like opaque folders and emphasizing honesty. 

  Key teaching insight: The embarrassment round is crucial. If students won’t say "I know" even when only mild social risk exists, it proves the effect isn’t just about rational betting but about knowledge attribution itself. That’s the golden moment.
answer: |-
  Here's a fully fleshed-out, runnable classroom activity designed to induce the pragmatic encroachment intuition, complete with structure, materials, and handling for predictable objections:

  **Activity Title:** The Token Trust Test  
  **Target Concept:** Pragmatic Encroachment (implicitly felt before explicit teaching)  
  **Time:** 70-75 minutes  
  **Participants:** 14 students + Instructor  

  ---

  ### **Phase 1: The Signaling Game (30 mins)**  
  **Goal:** Experience shifting willingness to claim knowledge under identical evidence but varying stakes.

  #### **Materials:**  
  - 2 identical opaque boxes (e.g., shoeboxes with lids)  
  - 1 token (e.g., poker chip)  
  - 14 sealed envelopes (each contains a "SIGNAL SHEET")  
  - 14 clipboards with paper + pens  
  - Stakes Cards (for instructor only):  
    - **Round 1:** "If wrong: Stand and say 'I was very confident!'"  
    - **Round 2:** "If wrong: Lose 1 point for yourself"  
    - **Round 3:** "If wrong: Teammate (left neighbor) loses 1 point"  
    - **Round 4:** "If wrong: Entire team loses 2 points"  
    - **Round 5:** "If wrong: No penalty" (Low stakes control)  

  #### **Setup:**  
  1. Place token randomly in Box A or B (students don’t see).  
  2. Distribute sealed envelopes (each has a sheet saying "BOX [A/B]" with 80% accuracy; 11 correct, 3 incorrect).  
  3. Assign students to pairs (7 teams of 2).  

  #### **Procedure (5 Rounds × 4 mins each):**  
  1. **Signal Review:** Students open envelopes, view their private signal (e.g., "BOX A").  
  2. **Knowledge Declaration:** On their paper, they **privately** check:  
     ☐ "I KNOW which box has the token"  
     ☐ "I DO NOT KNOW"  
  3. **Stakes Reveal:** Instructor shows the round's Stakes Card.  
  4. **Action & Consequence:**  
     - Students act on their signal (point to a box).  
     - Token revealed. If wrong, enforce stakes (e.g., deduct points, perform embarrassment).  
  5. **Reset:** Token re-hidden; signals remain *unchanged* in envelopes.  

  **Instructor Notes:**  
  - Track points symbolically (no real prize).  
  - Emphasize: "Your signal is *identical every round*—only what happens if you’re wrong changes."  
  - After Round 5, collect "Knowledge Declaration" sheets.  

  ---

  ### **Phase 2: The Vignette Judgment (20 mins)**  
  **Goal:** Externally observe stakes-based knowledge attribution inconsistency.  

  #### **Materials:**  
  - 2 vignette sheets (identical except stakes):  
    > *"Alex receives an 80% reliable signal indicating the token is in Box A. Alex needs to act on this signal. [LOW STAKES: If wrong, Alex feels slightly awkward.] [HIGH STAKES: If wrong, Alex’s entire research team loses critical funding.]"*  
    - **Question:** "Does Alex KNOW the token is in Box A?" (Yes/No)  

  #### **Procedure:**  
  1. Split class: Group 1 judges **LOW-STAKES Alex**, Group 2 judges **HIGH-STAKES Alex**.  
  2. Groups discuss internally (5 mins).  
  3. Groups report verdicts simultaneously (write on board):  
     - "Group 1 (Low): [Yes/No]"  
     - "Group 2 (High): [Yes/No]"  
  4. Reveal disagreement. Ask: "Why might groups judge the *same evidence* differently?"  

  ---

  ### **Debrief & Mapping (20 mins)**  
  **Key Questions:**  
  1. "In Phase 1, did your *certainty* in the signal's accuracy change across rounds? Or just your willingness to say 'I know'?"  
  2. "In Phase 2, why did we attribute knowledge differently to Alex despite identical evidence?"  
  3. "What does this suggest about the relationship between *stakes* and *knowledge*?"  

  #### **Mapping to Theories:**  
  | Observation | Pragmatic Encroachment | Contextualism | Invariantism |  
  |------------|------------------------|---------------|-------------|  
  | Willingness to claim "I know" shifts with stakes | ✅ Knowledge itself depends on stakes | ✅ "Knows" standards shift with context | ❌ Only assertion/action shifts; knowledge unchanged |  
  | Judging Alex differently based on stakes | ✅ | ✅ | ❌ (Alex either knows or doesn’t) |  
  | **Activity Limitation:** Cannot distinguish **Pragmatic Encroachment** (knowledge changes) vs. **Contextualism** ("knows" meaning changes). Both fit the data. Rules out **Strict Invariantism**.  

  #### **Handling Predictable Pushback:**  
  **Student:** *"I was never *less certain*—just less willing to bet!"*  
  **Response:**  
  1. **Validate:** "Exactly! This is crucial—your *internal confidence* didn’t change."  
  2. **Pivot:** "But notice: in Phase 1, you hesitated to claim *knowledge* under high stakes. In Phase 2, you denied Alex *knowledge* in high stakes. If knowledge is just high confidence + truth, why wouldn’t Alex know in both cases?"  
  3. **Problem:** "This tension—same evidence, same confidence, but shifting knowledge attributions—is what pragmatic encroachment theorists aim to resolve."  

  ---

  ### **What Will Go Wrong (and Fixes):**  
  1. **"I peeked at the token!"**  
     - *Prevention:* Use boxes with concealed lids; only instructor opens them.  
  2. **"I don’t care about points/embarrassment."**  
     - *Fix:* Leverage social dynamics ("Your teammate loses points"); normalize mild embarrassment.  
  3. **"80% isn’t enough to *know* anyway!"**  
     - *Fix:* In debrief, agree: "Yes! But why did ‘knowledge’ claims drop *further* in high stakes if the threshold was already unmet?"  
  4. **Vignette groups don’t disagree**  
     - *Fix:* If both say "No," stress: "In Phase 1, many said ‘I know’ in low stakes. Why deny Alex that same attribution?"  

  ---

  **Why This Works:**  
  - **Embodied Stakes:** Students *feel* the inhibition to claim knowledge under risk.  
  - **Hypocrisy Reveal:** Judging Alex harshly in high stakes after claiming knowledge themselves in low stakes creates cognitive dissonance.  
  - **Controlled Evidence:** Identical signals foreground stakes as the only variable.  

  **Outcome:** Students enter the lecture on pragmatic encroachment with lived tension—ready to dissect whether knowledge, assertion, or context shifted. No terms needed until the debrief!
