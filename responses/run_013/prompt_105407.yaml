  Then there's the second type of move: changing what they call the "knobs" themselves. Instead of tweaking a variable within a framework, the creator changes the framework. For instance, a composer might change which instrument plays instead of the tempo. The user wants to know if there's a distinction between these two types and if so, what it's called.

  The user has a friend who mentioned Hofstadter's ideas on variation as the essence of imagination. But they feel that only covers the first type. They want a deep analysis from a philosopher or cognitive scientist specializing in creativity. They want possible terms, whether a distinction exists, boundary cases, and how existing concepts fit.

