prompt: |-
  I am a doctoral student in philosophy and economics, and a small grantmaking foundation has asked me to write a critical note on the rubric it uses to allocate its annual budget. The rubric is the familiar one: every candidate cause area is scored out of ten on importance (how much good is at stake if the problem is solved), tractability (how likely additional work is to make progress), and neglectedness (how few others are already working on it), and the three scores are multiplied to produce a single figure that determines funding. Two features of it puzzle me. First, neglectedness is defended as a proxy for the marginal returns to an extra dollar, which suggests it is not a criterion in its own right; yet it is scored and weighted independently, and in practice a high neglectedness score can carry a cause whose importance is modest. Second, the same intervention can be scored under two different descriptions of its cause — say, as AI safety or as differential technological development — and receive two different products, although nothing about the intervention has changed.

  What philosophical commitments does this practice presuppose? Please reconstruct the implicit theory: what it assumes about value, about the comparability of very different goods, about the structure of the value space, and about how the three dimensions trade off (including what the multiplication itself commits it to). Then distinguish what the rubric strictly requires from what it merely fits well with, say where the practice is underdetermined between rival theories — for instance a monist expected-value view on which neglectedness is purely instrumental, versus a pluralist view on which it tracks something worth caring about in itself — and say what would have to change in the rubric if the presupposed view were replaced. Finally, tell me where your reconstruction is most likely to fail: which argument or consideration would lead you to a different verdict about what the rubric presupposes.
reasoning: |-
  Okay, let me approach this systematically. The user is a doctoral student in philosophy and economics analyzing a grantmaking rubric based on the ITN framework (Importance, Tractability, Neglectedness). Their puzzles center on neglectedness functioning as both instrumental proxy and independent criterion, and cause-description relativity affecting scoring outcomes.

  First, I need to reconstruct the implicit philosophical commitments. The multiplicative scoring suggests a utilitarian expected value framework where moral weight equals probability-adjusted impact. The independent scoring of neglectedness while treating it as instrumental creates tension - it assumes diminishing marginal returns are both measurable and the primary reason for valuing neglectedness. 

  The cause-description problem reveals deeper assumptions: that causes are discrete containers of value rather than overlapping interventions, and that value is description-invariant despite the rubric's sensitivity to framing. This points to an unspoken atomism in how problems are conceptualized.

  For tradeoffs, multiplication implies perfect substitutability between dimensions. A 2x improvement in any factor equally compensates for halving another. But is tractability really linearly exchangeable with importance? The rubric assumes yes, but that's empirically contested.

  Where is the rubric underdetermined? The treatment of neglectedness could fit either:
  - Strict instrumentalism (only marginal returns matter)
  - Pluralist intrinsic value (diversity/fairness concerns)
  But the multiplication format forces instrumentalism - intrinsic values wouldn't multiply with impact.

  If we changed the presupposed view:
  - Switching to pluralism would require additive scoring with weights
  - Accepting value incommensurability might demand lexical prioritization
  - Contextual sensitivity could mean abandoning fixed formulas altogether

  The most vulnerable point in my reconstruction is whether multiplication necessarily commits to perfect substitutability. One could argue it's just a heuristic approximation. But the cause-description relativity remains a stronger indicator of underlying atomism.

  The user's sharpest insight is noticing that the same intervention gets different scores under different descriptions. That fundamentally challenges the rubric's objectivist pretensions - it reveals the framework depends on how we carve up problem space, not just inherent properties.
answer: |-
  Your analysis identifies core tensions in the ITN (Importance, Tractability, Neglectedness) rubric. Below is a reconstruction of its implicit philosophical commitments, areas of underdetermination, and vulnerabilities.

  ---

  ### **Implicit Philosophical Commitments**
  1. **Value Theory: Consequentialist Utilitarianism**  
     - **Assumption:** Moral weight is determined *solely* by expected aggregate welfare outcomes.  
     - **Structure of Value Space:**  
       - *Monism:* All goods (health, knowledge, equity) are reducible to a common metric (e.g., "well-being units").  
       - *Fungibility:* Value is linear and additive. Solving 1% of a problem affecting 1M people = solving 100% of a problem affecting 10,000 people.  
       - *Description-Invariance Denied:* Value depends on how a cause is *framed* (e.g., "AI safety" vs. "differential tech development"), violating the axiom that identical interventions should have identical moral weights.

  2. **Decision Theory: Expected Value Maximization**  
     - **Multiplication Logic:** `Importance × Tractability × Neglectedness` assumes:  
       - *Perfect Substitutability:* A 2× increase in neglectedness perfectly offsets a 50% lower importance score.  
       - *Independence Axiom:* Dimensions are separable and non-interacting (e.g., tractability doesn’t correlate with neglectedness).  
       - *Marginalism:* Neglectedness is *only* a proxy for diminishing returns. Its scoring treats `1/current funding` as a multiplier for impact-per-dollar.

  3. **Epistemology: Quantification Optimism**  
     - Scores (0–10) imply all dimensions are:  
       - *Cardinally measurable* (a score of 8 is twice as good as 4).  
       - *Interpersonally comparable* (e.g., animal welfare vs. poverty can share a scale).  

  ---

  ### **Underdetermined Commitments: Rival Interpretations**
  | **Issue**               | **Monist Expected-Value View**                                      | **Pluralist View**                                          |
  |-------------------------|---------------------------------------------------------------------|------------------------------------------------------------|
  | **Neglectedness**       | Purely instrumental. High weight only if $1 buys more marginal good. | Intrinsic value (e.g., fairness, diversification, option value). |
  | **Tradeoffs**           | Perfect substitutability via multiplication.                        | Lexical priorities or thresholds (e.g., minimum importance). |
  | **Value Comparability** | Full commensurability via a universal metric.                       | Weak commensurability (e.g., deliberative weighting).      |

  **Rubric's Strict Requirements**:  
  - Multiplication necessitates perfect substitutability.  
  - Independent scoring assumes no dimension interactions (e.g., neglectedness doesn’t harm tractability).  
  - Scores imply cardinality and comparability.  

  **What Fits but Isn’t Required**:  
  - Utilitarianism (could be prioritarian, but multiplication favors aggregate gain).  
  - Risk-neutrality (no adjustment for uncertainty beyond tractability).  

  ---

  ### **Changing the Presupposed View: Rubric Modifications**
  1. **If Adopting Pluralism**:  
     - **Neglectedness as Intrinsic**: Additive scoring: `α·Importance + β·Tractability + γ·Neglectedness`.  
     - **Thresholds**: Minimum scores for importance before other factors apply.  
     - **Non-Fungibility**: Switch to pairwise comparisons or qualitative tiers.  

  2. **If Rejecting Perfect Commensurability**:  
     - **Partial Ordering**: Rank causes by dominance (e.g., higher in 2+ dimensions) instead of a single score.  
     - **Deliberative Democracy**: Replace scores with stakeholder deliberation.  

  3. **If Marginal Returns Are Non-Linear**:  
     - **Dynamic Modeling**: `Neglectedness = f(current funding)` with elasticity (e.g., log scaling).  
     - **Cross-Cause Interactions**: Include synergy/antagonism terms (e.g., AI safety affects biosecurity tractability).  

  ---

  ### **Where Reconstruction Is Most Vulnerable**
  1. **The Multiplication Axiom**:  
     - **Counterargument:** The rubric may be a *heuristic* for ordinal ranking, not cardinal optimization. Practitioners might ignore small score differences (e.g., 90 vs. 100), avoiding strict substitutability.  
     - **Verdict Shift:** If interviews reveal funders use scores as tiebreakers after qualitative filters, the rubric presupposes less rigor than implied.  

  2. **Neglectedness as Proxy**:  
     - **Counterevidence:** If foundations defend high neglectedness scores for equity reasons (e.g., "overlooked communities deserve attention"), pluralism is presupposed.  
     - **Verdict Shift:** Internal guidelines explicitly valuing "funding diversity" would refute pure instrumentalism.  

  3. **Description Relativity**:  
     - **Alternative Read:** Cause descriptions reflect *strategy*, not ontology. "AI safety" vs. "differential tech development" may signal different theories of change, altering tractability/neglectedness.  
     - **Verdict Shift:** If re-description only changes scores when new evidence emerges (e.g., neglectedness data for a subfield), the rubric isn’t description-relative.  

  ---

  ### **Conclusion**
  The ITN rubric implicitly assumes **utilitarianism**, **expected value maximization**, and **quantifiable commensurability**. Its core tension—treating neglectedness as instrumental while weighting it independently—reveals an unresolved conflict between efficiency and other values. To reduce arbitrariness:  
  - **For Rigor:** Add cross-cause marginal impact modeling.  
  - **For Pluralism:** Incorporate thresholds or deliberative checks.  
  - **For Objectivity:** Fix cause definitions ontology-first (e.g., "cause = intervention + target population").  

  The rubric's fragility lies in its *formal simplicity* conflicting with the *complexity of moral reasoning*. As you critique it, foreground whether the foundation seeks precision (monism) or legitimacy (pluralism)—the rubric cannot optimize both.
