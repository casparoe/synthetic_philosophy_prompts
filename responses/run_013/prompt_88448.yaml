  We are drafting a memo for the engineering investment board regarding the billing system migration project. The project is 18 months in, already double the original estimate, and the team estimates another 8-10 months to complete. The dilemma: if we kill the project now, we'll have to run both the old mainframe and the half-migrated system for at least two years, which is worse than either finishing or never starting.

  The dollar auction analogy: In a dollar auction, two top bidders both pay but only the top bidder gets the prize. This leads to overbidding. However, we must note the differences:
  - Our prize (the new billing system) doesn't have a fixed value (it's more about long-term benefits like reduced costs, better features, etc.).
  - We can change the rules mid-game (e.g., hand the decision to someone else).

  We are to recommend one of three options: approve (continue funding), kill, or approve with conditions (with a time frame and conditions).

  Key points to address:
  - Acknowledge the sunk cost: The £9m spent is gone. The decision should be based on future costs and benefits.
  - The cost of stopping now: Running both systems for two years is expensive and complex. We must compare that to the cost of finishing (another 8-10 months of development plus running both during that time) and then the benefits of having the new system.
  - The case for finishing: Even though we've spent a lot, if the total cost of finishing and then operating the new system is less than the cost of stopping and running both for two years (and then what?), then it might be rational to finish.

  Let's break down:

  Option 1: Kill the project now.
     - We avoid the future development costs (say, £X for the next 8-10 months).
     - But we incur the cost of running both systems for 2 years (which includes the old mainframe and the partial new system). Let this cost be £A per year for two years -> £2A.

  Option 2: Continue and finish (8-10 months).
     - During the next 8-10 months, we have development costs (£X) and also the cost of running both systems during that time (so about 0.75 to 0.83 of a year of dual-run cost -> roughly £A * 0.8).
     - Then, after completion, we can decommission the old system and run only the new one. The new system should have lower operating costs (say £B per year, which is less than the old system's cost £C per year).

  We need to compare:
     Option 1: £2A (over two years) + [after two years, what? We still have to do something? Probably we'll have to either finish the migration or migrate to something else, but that's beyond the two years? So we are only considering the immediate two years? But we must consider the long-term.]

  Actually, the problem says: if we kill it now, we have to run both for at least two years. After that, we might be able to decommission the partial new system and go back to the old? Or we might have to start over? The memo doesn't specify. So we must make assumptions.

  Alternatively, we can think in terms of net present value of the two options.

  But without exact numbers, we can only reason qualitatively.

  The dollar auction analogy: We are the bidder who has already bid (invested £9m) and if we drop out now, we get nothing and still have to pay (run both systems for two years). But if we continue, we might end up paying even more and the prize might not be worth it.

  However, note that in the dollar auction, the prize is fixed (£20) and the bidding goes beyond that. In our case, the prize (the new system) is not fixed in value. Its value depends on the benefits it will bring over time.

  So the dollar auction comparison is not perfect. We can use it to illustrate the psychological trap, but we must base our decision on a cost-benefit analysis.

  Recommendation:

  After careful analysis, I recommend that we approve the project to continue, but with strict conditions and a time frame.

  Reasoning:
  - The cost of stopping now (running two systems for two years) is substantial and we would have to eventually address the billing system again in the near future, meaning we might have to redo the migration or undertake another project, which would incur more costs.
  - Completing the project in the next 8-10 months, despite the overrun, allows us to realize the benefits of the new system (reduced operating costs, improved functionality, etc.) and avoid the dual-running cost for two years.

  However, we must set conditions to avoid further overruns.

  Conditions:
  1. Set a hard deadline: 10 months maximum (end of Q4 2024? adjust as per current date). If the project is not live by then, it will be terminated.
  2. Require a detailed plan with milestones every month, and if any milestone is missed by more than two weeks, the project is reviewed for termination.
  3. Assign an independent project manager (or a committee) to oversee the project, one that hasn't been involved in the bidding (to avoid escalation of commitment bias).
  4. Conduct a thorough review of the remaining work to validate the 8-10 month estimate and identify risks.
  5. Freeze feature scope: no new features, focus only on migration and parity.

  We must also do a quick cost-benefit analysis:

  Assume:
  - Current annual cost of running the old system: £C
  - Annual cost of running the new system: £B (which should be lower, say £B = 0.6 * £C, for example)
  - Annual cost of running both systems (dual-run): £A (which is £C + £B + integration overhead, so £A > £C and £A > £B, but likely £A ≈ £C + £B + extra)

  If we stop now:
     - We have dual-run for 2 years: 2 * £A
     - Then we still have to run the old system (or start a new migration) so after 2 years, we revert to £C per year until we do something.

  If we continue:
