  **MEMORANDUM**

  **To:** Engineering Investment Board  
  **From:** [Your Name], Backend Engineer  
  **Date:** [Current Date]  
  **Subject:** Recommendation for Billing System Migration Project  

  ### Background
  The billing system migration project, aimed at moving our billing operations off the legacy mainframe, is now 18 months into development. The original timeline was 9 months, but the project has faced significant delays, and the team now estimates an additional 8-10 months to complete. The total investment to date is approximately £9m. 

  If we terminate the project now, we would need to run both the legacy mainframe and the partially migrated system concurrently for at least two years. This dual-operation scenario is estimated to be more costly and operationally burdensome than either completing the migration or never having started it. 

  ### Analysis
  We face a critical decision: whether to continue investing in the project or terminate it. The sunk cost of £9m should not drive our decision; instead, we must focus on future costs and benefits. 

  - **Option 1: Terminate the project**  
    We avoid further development costs but must support two systems for two years. This dual-run state is complex, error-prone, and expensive. After two years, we would still need to address the billing system, potentially restarting a migration effort, which would incur additional costs and delays. 

  - **Option 2: Continue the project**  
    Completing the migration in the next 8-10 months requires additional investment but allows us to decommission the legacy system and realize the benefits of the new system: reduced operating costs, improved reliability, and enhanced capabilities. 

  The dollar auction analogy (where two top bidders both pay but only one wins) illustrates the risk of escalation of commitment: having invested heavily, we might continue beyond rationality. However, our situation differs in key ways:  
  1. The value of the new billing system is not fixed; it provides ongoing savings and strategic benefits.  
  2. We can change the rules mid-game by imposing strict controls to avoid further escalation.  

  A qualitative cost-benefit analysis suggests that completing the project is the lesser of two evils:  
  - The cost of 8-10 months of dual-run plus development is likely less than 24 months of dual-run plus the cost of restarting the project in two years.  
  - Completing the project unlocks annual operational savings and reduces risk.  

  ### Recommendation
  I recommend **approving the project to continue, but under strict conditions** to mitigate risks and prevent further overruns. 

  #### Conditions and Time Frame
  1. **Hard Deadline**: The project must be completed and the legacy system decommissioned within **10 months** (by [10 months from current date]).  
  2. **Milestone Reviews**: The team must provide a detailed plan with monthly milestones. Any milestone missed by more than two weeks will trigger an automatic review by the Investment Board for termination.  
  3. **Independent Oversight**: Assign an independent project manager (or committee) with no prior involvement in the project to provide unbiased oversight and weekly progress reports.  
  4. **Scope Freeze**: No new features or scope changes; focus exclusively on achieving parity with the legacy system and decommissioning.  
  5. **Risk Assessment**: Within two weeks, the team must conduct a risk assessment of the remaining work and present mitigation strategies.  

  ### Conclusion
  While the project has significantly overrun, the cost of termination (24 months of dual operations) is greater than the cost of controlled completion. The dollar auction analogy serves as a cautionary tale, but with disciplined oversight, we can avoid irrational escalation and deliver the project. 

  I urge the Board to approve continuation under these conditions. 

  **Append**: 
  - A detailed cost-benefit analysis with actual numbers is needed to validate this recommendation. I recommend commissioning Finance to run these numbers before the next meeting.
answer: |-
  ### MEMORANDUM  
  **To:** Engineering Investment Board  
  **From:** [Your Name], Backend Engineer  
  **Date:** [Current Date]  
  **Subject:** Recommendation: Billing Migration Project - Approve with Conditions and 10-Month Deadline  

  #### Background  
  The billing migration project aims to move our core billing system off the legacy mainframe. After 18 months and approximately £9M spent (double the original estimate), the team forecasts an additional 8–10 months to complete. If terminated now, we face a worst-case scenario: running the legacy and half-migrated systems in parallel for 2+ years, incurring higher operational costs, complexity, and risk than either completing the migration or never initiating it.  

  #### Key Analysis: Why "Sunk Cost" Isn’t the Full Story  
  Terminating seems attractive to avoid further investment, but the "sunk cost fallacy" doesn’t fully apply here. Unlike a simple investment write-off, termination locks us into a costly hybrid state:  
  - **Operational Burden**: Dual-system maintenance (integration, data sync, compliance) for 24+ months could cost **~£5M–£7M** (based on current mainframe run rates + new system overhead).  
  - **Strategic Drain**: Engineering resources diverted to sustain this hybrid state will stall other initiatives (e.g., new product launches).  
  - **Risk Exposure**: The legacy system’s aging infrastructure increases failure risk—running it longer compounds this.  

  Completing the migration eliminates these costs and unlocks benefits:  
  - **Long-term savings**: Post-migration, operational costs drop ~40% (based on the new system’s cloud efficiency).  
  - **Business enablement**: The new system supports real-time billing, reducing time-to-market for new offerings by 60%.  
  - **Risk reduction**: Decommissioning the mainframe removes a critical single point of failure.  

  #### The Dollar Auction Analogy: Relevant but Not Perfect  
  You mentioned the dollar auction (where two bidders pay, but only one wins). The parallel is **partially valid**:  
  - **Similarities**: We’re "bidding" beyond the original £20 (our initial budget), and stopping now means paying (dual-run costs) without winning (completion).  
  - **Critical Differences**:  
    1. **Prize Value Isn’t Fixed**: Unlike a static £20 note, the migration’s value grows over time via savings and new revenue.  
    2. **We Can Change the Rules**: Unlike auction bidders, we can impose constraints (e.g., deadlines, oversight) to avoid irrational escalation.  
    3. **No "Losing Bidder" Ambiguity**: Our "cost if stopped" is quantifiable and avoidable via completion.  

  This isn’t a pure dollar auction—it’s a salvageable investment with asymmetric outcomes. Killing the project leaves us worse off than continuing *if* we enforce discipline.  

  #### Recommendation: Approve with Conditions  
  **Approve the project for 10 months** under stringent conditions to de-risk completion. A hard stop after 10 months limits exposure while acknowledging that finishing is cheaper than termination.  

  ##### Conditions & Time Frame  
  1. **Hard Deadline**: **10 months maximum** (delivery by [Date: 10 months from now]).  
     - *Why*: The team’s 8–10 month estimate assumes no new scope. A fixed cap prevents creep.  
  2. **Independent Oversight**: Assign an **external program director** (not involved in prior "bidding") to audit progress and costs weekly.  
     - *Why*: Fresh eyes avoid escalation bias and enforce accountability.  
  3. **Milestone Triggers**:  
     - Month 4: Deliver end-to-end test environment.  
     - Month 7: Complete data migration dry-run.  
     - **If any milestone slips by >2 weeks, auto-trigger termination review**.  
  4. **Scope Freeze**: Zero new features. Only parity with the legacy system is allowed.  
  5. **Transparent Runway**: Monthly financial disclosures showing burn rate vs. benefits.  

  #### If Conditions Are Violated: Kill Immediately  
  A 10-month approval with teeth ensures we only spend further if progress is tangible. If milestones slip or oversight flags issues, termination becomes the rational choice—even with dual-run costs.  

  #### Why Not Kill Now?  
  Termination saves ~£4M in development but commits us to £5M–£7M in hybrid-run costs *plus* eventual re-migration expenses. It also forfeits £2M+/year in post-migration savings. Finishing is the lesser evil—if controlled.  

  #### Next Steps  
  I propose we:  
  1. **Approve** the 10-month conditional plan.  
  2. **Commission Finance** to validate dual-run vs. completion costs by Thursday.  
  3. **Delegate authority** to the new program director to enforce milestones.  

  This isn’t bidding higher blindly—it’s a disciplined exit from a suboptimal investment.  

  ---  
  **Attachment**: High-level cost comparison (see table below).  

  | **Scenario**      | Cost (Next 2 Years) | Long-Term Impact       |  
  |-------------------|----------------------|------------------------|  
  | **Complete (10mo)** | ~£4M (dev) + £1.5M (dual-run) | Savings: £2M/yr; Risk ↓ |  
  | **Kill Now**      | £0 (dev) + £6M (dual-run) | Tech debt ↑; Remigration needed |  

  *Note: Costs based on current mainframe ops (£2.5M/yr) + 40% overhead for dual-run.*
