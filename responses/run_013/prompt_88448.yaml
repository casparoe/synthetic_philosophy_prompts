  The savings from the new system would be realized every year after that: (C - B) per year.

  So the payback period: the extra investment (the £X and the dual-run during development) is offset by the savings.

  But without numbers, we can say: if the remaining development cost and the dual-run cost during the 10 months is less than the cost of 2 years of dual-run plus the cost of having to address the problem again in 2 years, then finishing is better.

