prompt: |-
  I sit on the grants committee of a large global-health foundation. Our charter says were to allocate for the greatest total wellbeing, full stop, and the modelling team ranks proposals by adding up expected wellbeing over everyone affected -- including people who only exist because of the intervention. Next week we're picking between two portfolios that cost the same: one averts child deaths in a high-mortality region (so we end up with a bigger population, each survivor living a modest but decent life), the other treats chronic illness and lifts incomes for people who are already alive. The model says the first wins by a mile -- but only because the added lives score just barely above zero on our life-satisfaction scale, whose zero turns out to be "the worst life you can imagine" rather than a life that's neither good nor bad, and because it carries the added lives' descendants out a hundred years at a discount rate we basically picked by default. Nudge either assumption and the ranking flips. One member says that if we follow the model we'd have to fund anything that adds people, even people living lives barely worth living, which is absurd; another says that's just squeamishness and the arithmetic is the arithmetic. I have to circulate a short written opinion before Thursday's meeting. Recommend something concrete -- fund one portfolio, or suspend the rule, or rewrite it -- with a timeframe for whatever you recommend, and make the strongest case for the side you're rejecting rather than a cartoon of it. Give it to me as exactly five numbered points, a sentence or two each, no intro and no conclusion.
reasoning: |-
  Okay, the user is on a grants committee for a global health foundation facing a tough decision between two portfolios. One averts child deaths leading to a larger population living modest lives, while the other helps existing people with chronic illnesses and income. The model favors the first option due to specific assumptions about the wellbeing scale and discount rate. 

  Hmm, the user needs a concise five-point recommendation before Thursday. They want concrete advice—fund one portfolio, suspend the rule, or rewrite it—with strong arguments for the opposing side. The challenge is balancing ethical concerns with quantitative modeling. 

  First, I should acknowledge the core tension: the model’s outcome hinges on debatable assumptions. The wellbeing scale’s "zero" as "worst imaginable life" versus a neutral point, and the discount rate choice, dramatically sway results. The pro-model side argues consistency—if adding barely worthwhile lives boosts total wellbeing, why reject it? But the counterpoint is compelling: this could justify absurd policies, like forcing population growth in miserable conditions. 

  For the recommendation, a pause makes sense. Funding the chronic illness portfolio avoids immediate ethical risks while buying time to fix the framework. Rewriting the wellbeing scale and discount rate policy is urgent—say, by revising the zero point to neutrality within six months. This isn’t ignoring math but refining its inputs. 

  I’ll structure five tight points: start with suspending the model for now, then fund the safer portfolio. Next, mandate framework revisions with deadlines. Finally, rebut the "arithmetic is arithmetic" stance by highlighting how arbitrary assumptions distort outcomes. Keep each point sharp—no intros or conclusions. 

  The user’s deeper need? Confidence in ethical rigor. They’re wary of model-driven absurdities but also respect quantitative consistency. My advice must bridge that, showing how temporary caution enables better long-term decisions.
answer: |-
  1.  **Suspend the model's ranking this week and fund the chronic illness/income portfolio.** The model's outcome is critically sensitive to two specific, ethically debatable assumptions (the wellbeing scale's zero point and the long-term discount rate) that significantly alter the result.
  2.  **Adopt the chronic illness/income portfolio immediately.** It directly improves the lives of existing people facing significant hardship with minimal controversial population ethics assumptions, avoiding the risk of funding based on potentially flawed calculations about future lives barely above a mis-specified zero.
  3.  **Mandate a rapid revision (within 6 months) of the wellbeing scale definition and discount rate policy.** Explicitly define the wellbeing scale's zero point as a neutral life (neither good nor bad), likely requiring recalibration of existing data, and establish a formal, justified process for setting the long-term discount rate.
  4.  **Reject the "arithmetic is arithmetic" argument for funding the child survival portfolio now.** While mathematically consistent *given the current inputs*, the model relies on the assumption that adding lives barely valued above "the worst imaginable life" is a significant moral good and heavily weights distant descendants via an arbitrary discount rate – outcomes many reasonable ethical frameworks reject as counterintuitive or demanding excessive sacrifice for minimal gains per added life.
  5.  **Reject the "absurdity" counter-argument as insufficient alone.** Simply declaring the implication (funding anything adding barely-worthwhile lives) "absurd" doesn't negate the model's internal logic; the stronger case for suspension is the model's *sensitivity* to specific, modifiable assumptions that lack a robust ethical foundation under scrutiny, making its current output unreliable for this high-stakes decision.
