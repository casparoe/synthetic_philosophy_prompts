  **Straight talk on the key points:**

  1.  **It's real, but flawed:** Your method *can* work, but your worry is spot-on. Turning people into simplified "statues" is a common pitfall. Philosophers broadly agree that ignoring the mess guarantees shallow learning.
  2.  **The core problem is the sanding:** It's not *entirely* your fault for picking subjects (though some biographies encourage it more than others). It's built into the human tendency to simplify stories, *especially* when we're looking for direct 'lessons'. We naturally focus on the wins and explain away the losses. Your group is doing what most people do.
  3.  **The 'how' matters most:** The "settled" bit is *that* context and flaws matter. The "contested" bit is *how much* focus you put on them without losing the point entirely. Some think you need polished ideals; others think only the grit is real. Most scholars sit somewhere in the messy middle.
  4.  **The weakness is practical:** My suggestions aim for that messy middle. But the biggest risk is that diving into flaws and context might make the sessions feel less uplifting or more confusing, especially for a group used to the warm feeling. It requires more work and discomfort. Whether that trade-off is worth it, or how far to push it, is where the rubber meets the road for your group. You'll need to experiment.
