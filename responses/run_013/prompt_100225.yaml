prompt: |-
  Ok so this is a bit of a weird request but I think it's a real question and I don't trust my own answer. A couple months ago I got into a genuinely heated argument at a barbecue about whether a hot dog is a sandwich, which was stupid, but since then I can't stop noticing these disputes, and I've realized I have no idea when one of them is "just" verbal and when there's something real at stake. Lucky for me my advisor runs a seminar that's basically about exactly this, and she's been giving verdicts on disputes all term. Her calls so far: "is a tomato a fruit" — merely verbal. "Is Pluto a planet" — merely verbal. "Is a virus alive" — merely verbal. "Is a hot dog a sandwich" — merely verbal. "Are there composite objects like tables, or only simples arranged table-wise" — also merely verbal; she's very deflationary about ontology and says once you've fixed all the physics there's nothing left to fight about. But then "is a fetus a person" — substantive, not verbal. "Does free will exist" — substantive. "Is a corporation morally responsible for what it does" — substantive. I think I follow the gist of what she's doing, but I can't actually state the rule she's running, and I have a suspicion that more than one rule fits everything she's said.

  Here's what I actually need it for. In my law-and-philosophy seminar we read about this old customs case where the whole thing turned on whether a tomato counts as a "vegetable" for an import duty — everybody agreed it's botanically a fruit, the fight was purely about what the word "vegetable" means in the statute, and the court had to pick a side because real money was riding on it. I have to write a short paper applying my advisor's approach to it and I want to guess her verdict before I ask her. So please roleplay as a philosopher of language and metaphysics who works on verbal disputes and metaontology, and think out loud before you commit to anything. Start by brainstorming the candidate rules that would reproduce her verdicts above — I bet one of them is something like "do the parties agree on all the non-linguistic facts, and is the leftover disagreement purely about how to use a word," and another is "does anything practical or normative actually turn on which way it goes," and maybe a third about whether each side can be charitably read as meaning something different by the disputed term. Then tell me what each of those rules predicts for the tomato/tariff case, which one you'd bet she's really running and why, and — most importantly — name the single further dispute I should ask her about that would best tell the candidate rules apart, ideally one where they definately come apart. I care way more about the carving than the verdict, so be explicit about exactly where the rules agree and where they don't. (And to be clear I'm not asking you for a reading list or citations, just your reasoning.)
reasoning: |-
  Okay, the user is in a philosophy seminar and needs to apply their advisor's approach to a legal case about whether a tomato is a vegetable for tariff purposes. They've given examples of the advisor's verdicts on various disputes. The key is figuring out the underlying rule the advisor uses to distinguish merely verbal disputes from substantive ones.

  First, I need to brainstorm candidate rules that fit the advisor's past decisions. Looking at the examples: 

  Tomato as a fruit? Verbal. Pluto as a planet? Verbal. Virus alive? Verbal. Hot dog a sandwich? Verbal. Tables vs. simples? Verbal. But fetus as a person? Substantive. Free will? Substantive. Corporate responsibility? Substantive. 

  Hmm, one possible rule is the "non-linguistic facts" test: if both sides agree on all factual details and only disagree on word usage, it's verbal. For instance, everyone knows tomatoes grow from flowers and have seeds (botanical facts), so calling it a fruit or vegetable is just about labels. Similarly, Pluto's characteristics are agreed upon; the debate is about the term "planet." 

  Another candidate is the "practical/normative stakes" rule. If the outcome affects real-world decisions, ethics, or laws, it's substantive. The fetus debate ties to abortion laws and moral rights, free will to moral responsibility, corporations to legal accountability. In contrast, whether a hot dog is a sandwich doesn't change how we eat or laws about food, so it's verbal. 

  A third possibility is "semantic charity": if each side can be interpreted as using the word differently without contradiction, it's verbal. For example, botanists vs. chefs using "fruit" in different contexts. But in the fetus case, both sides likely mean the same by "person," leading to a substantive clash. 

  Now, applying these to the tomato tariff case. The non-linguistic facts are settled (tomato's biology), and the dispute is about interpreting "vegetable" in the statute. The practical stakes are high (tariffs, money), which might suggest substance under the second rule. But the advisor called the original tomato/fruit debate verbal, so maybe she prioritizes the first rule. However, the law context adds stakes, which could complicate things. 

  The user needs a test case where these rules diverge. Consider "Is water H₂O?" Both sides agree on properties; it's about the meaning of "water." But if the dispute involves, say, regulations defining water purity, stakes arise. Another example: "Is bitcoin money?" Non-linguistic facts might be agreed, but legal and economic implications make it substantive under the stakes rule. 

  The best test case would be one with agreed facts but high stakes, like the bitcoin question. If the advisor calls it substantive due to regulatory impacts, she's using the stakes rule. If she sees it as verbal because everyone agrees on how bitcoin works, she's sticking to the non-linguistic facts rule. This clearly splits the candidates.
answer: |-
  Here's a step-by-step breakdown of your advisor's likely reasoning, applied to the tomato/tariff case and designed to expose the underlying rule through a decisive test case:

  ### Candidate Rules (Based on Her Verdicts)
  1.  **The Non-Linguistic Fact Agreement Rule (NLF):** A dispute is *merely verbal* **iff** the parties agree on all relevant non-linguistic facts about the world (e.g., physical properties, causal relations, observable behavior) and only disagree about how to *apply the word/concept* to those facts. The leftover disagreement is purely semantic/conceptual mapping.
  2.  **The Practical/Normative Stakes Rule (PNS):** A dispute is *merely verbal* **iff** resolving the semantic/conceptual disagreement *in either direction* has *no significant practical or normative consequences* (e.g., moral obligations, legal rights, empirical predictions, causal powers). If real-world outcomes turn on the verdict, it's substantive.
  3.  **The Semantic Charity Rule (SC):** A dispute is *merely verbal* **iff** each party can be *charitably interpreted* as using the disputed term with a *different but coherent meaning*, such that both assertions ("X is Y", "X is not Y") could be *simultaneously true* relative to their respective meanings. If there's no plausible charitable divergence in meaning implying both could be right, it's substantive.

  ### How Rules Fit Advisor's Verdicts
  *   **NLF:** Explains *all* "merely verbal" cases. Everyone agrees on Pluto's properties, a virus's structure/behavior, a hot dog's composition, the physical arrangement of table-parts, and a tomato's biology. The fight is "What word do we stick on this agreed-upon thing?" Also explains "substantive" cases: Fetus/Person & Free Will involve deep factual disagreements (e.g., consciousness origins, causal determinism). Corporate responsibility involves disagreements about agency emergence.
  *   **PNS:** Explains the *split*. "Merely verbal" cases (Pluto, virus, hot dog, table) lack significant stakes. "Substantive" cases (fetus, free will, corporation) have massive moral/legal stakes. *Problem:* The tomato/tariff case has high stakes, yet the original "fruit/vegetable" was deemed verbal. NLF handles this better.
  *   **SC:** Explains most "merely verbal" cases. Botanist "fruit" ≠ Chef "fruit"; Astronomer "planet" ≠ Folk "planet"; Biological "alive" ≠ Functional "alive"; Culinary "sandwich" is flexible. Explains "substantive" cases: Both sides in fetus/person debate likely intend similar core meaning for "person" (e.g., bearer of rights); similar for "free will" (ability to do otherwise/ultimate control) and corporate agency.

  ### Prediction for Tomato/Tariff Case
  *   **NLF:** **VERDICT: Merely Verbal.** Everyone agrees on the non-linguistic facts: the physical object (tomato), its biological classification (fruit), its culinary use (typically savory/vegetable-like), the statute text, and the economic consequences of different interpretations. The dispute is purely about the semantic scope of "vegetable" *within the context of this tariff statute*. There's no hidden disagreement about tomatoes or tariffs themselves.
  *   **PNS:** **VERDICT: Substantive.** Real money and trade policy consequences hinge directly on whether "vegetable" in the law includes tomatoes. This looks exactly like the high-stakes cases she deemed substantive (fetus, corporation).
  *   **SC:** **VERDICT: Merely Verbal.** The court can charitably interpret "vegetable" in the statute as meaning "culinary vegetable" (common usage) rather than "botanical vegetable." Botanists using "fruit" and lawmakers using "vegetable" are employing coherent but different meanings relevant to their domains (science vs. commerce/culinary custom). Both uses are legitimate.

  **My Bet:** Your advisor is primarily running the **Non-Linguistic Fact Agreement Rule (NLF)**. Here's why:
  1.  **Consistency:** It perfectly explains *all* her verdicts without exception.
  2.  **Deflationary Ontology:** Her view that "once you've fixed all the physics there's nothing left to fight about" is the *essence* of NLF applied to ontology (tables).
  3.  **Handling Stakes:** The tomato/tariff case highlights why PNS is likely *not* her core rule. While stakes exist, the dispute *itself* is still purely about interpreting a word ("vegetable") *given agreed-upon facts* (tomato biology, statute text, economic impact). The stakes provide the *reason* we need to resolve the verbal dispute, but don't make the *dispute itself* non-verbal. She separates the *semantic mapping question* (verbal) from the *practical consequences* of answering it one way or another.
  4.  **SC's Role:** SC is likely seen as a *tool* for *identifying* when NLF applies (if charitable divergence is possible, it signals the core disagreement is likely semantic). It doesn't seem to be the primary rule, as fetus/person could potentially involve some charitable meaning divergence ("person" as biological human vs. person as rights-bearer), but she likely sees the core disagreement as factual (e.g., when rights-bearer status emerges biologically).

  ### The Decisive Test Case: "Is Bitcoin Money?"
  *   **Where Rules Agree:** If the dispute involves people who fundamentally misunderstand Bitcoin's technology or economics, it could be substantive under all rules (disagreement on non-linguistic facts). Assume parties *agree* on all relevant non-linguistic facts: Blockchain mechanics, decentralization, volatility, use cases (speculation, payments in some contexts), regulatory status, etc.
  *   **Where Rules Diverge:**
      *   **NLF:** **Merely Verbal.** Agreement on all facts about Bitcoin's properties and function. The dispute is purely semantic: "What definitional criteria do we require to apply the *word* 'money'?" (Medium of exchange? Store of value? Unit of account? Legal tender? Degree of stability/acceptance required?).
      *   **PNS:** **Substantive.** *Massive* practical stakes hinge on this classification: Tax treatment (capital gains vs. income?), banking/securities regulation, consumer protection laws, monetary policy implications, international sanctions enforcement. Resolution directly impacts real-world rules and outcomes.
      *   **SC:** **Merely Verbal.** Easily charitably interpreted: Economist "money" (functions performed) vs. Legal "money" (legal tender status) vs. Traditional Banking "money" (issued/backed by state/bank). "Bitcoin is money (as a medium of exchange)" and "Bitcoin is not money (as legal tender)" can both be true simultaneously under different meanings.

  **Why this Test Case is Ideal:**
  1.  **Clear Factual Agreement:** It's possible to isolate agreement on how Bitcoin works.
  2.  **Massive Undeniable Stakes:** Regulatory and practical consequences are direct and significant.
  3.  **Plausible Meaning Divergence:** Different functional definitions of "money" are well-established and coherent.
  4.  **Predicted Divergence:** If your advisor says **Merely Verbal**, she's firmly on **NLF** (dispute is purely about defining "money" after facts are fixed). If she says **Substantive**, she's likely prioritizing **PNS** (stakes make it non-verbal). SC would also lean verbal, but NLF is the cleaner prediction.

  **Conclusion for Your Paper:** Bet on your advisor ruling the tomato/tariff dispute **merely verbal** under her core **Non-Linguistic Fact Agreement Rule**. The high stakes necessitate a *legal resolution* of the semantic ambiguity ("What did 'vegetable' mean in this context?"), but don't transform the underlying nature of the disagreement into a substantive factual one. The court isn't discovering new facts about tomatoes; it's deciding how to *apply a word* to agreed-upon facts. Ask her about **Bitcoin as Money** to definitively test NLF vs. PNS.
