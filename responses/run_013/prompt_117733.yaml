prompt: |-
  I work in the harm-reduction unit of a state public health agency — technically I'm in the benefit-cost and equity shop, but really I'm the person who gets the weird proposals. We get maybe three or four a month where the upside is preventing a small number of genuinely awful outcomes (a child dying of a preventable infection, a nursing-home resident getting a pressure ulcer that turns septic, someone losing a foot to undiagnosed diabetes) and the downside is a tiny, barely noticeable burden spread across a huge population (an extra twelve minutes at the clinic, five more questions on a form, a 0.3% chance of a mild headache from a new screening protocol). My director has read about the torture vs dust specks thing and now wants a decision procedure we can actually run. Not a seminar answer — a checklist my one analyst and I can use in a week, with the director signing off. I need it to say what to measure, in what order, what counts as a sufficient answer, where it stops with a no, where it stops with a yes, and where it has to hand the decision to a human because it's a values call rather than a fact. There's alot of pressure to just multiply tiny numbers by huge populations and call it evidence, and I want the procedure to be honest about where that move is legitimate and where it's a trick.

  We've been told to build it around a draft framework from our sister agency, the Cumulative Micro-Harm Review (CMHR). It has four knobs and I don't fully understand how they fit together: (1) a severity floor — below a certain intensity, a burden isn't counted at all; (2) a reversibility multiplier — irreversible burdens count more than temporary ones; (3) a distributional discount — burdens falling on people who are already worse off count more; and (4) a catastrophic anchor — if the harm you're preventing is above some severity, you're allowed to aggregate micro-burdens up to a cap, but not beyond it. I don't know how to set the floor, what the multiplier should be, or whether the anchor is just a deontological cheat dressed up as a parameter. Turn this into a procedure a practitioner can follow. Keep whatever distinctions actually matter and drop the ones that don't survive contact with a real caseload. Mark the steps that are judgment calls. And please don't give me a bibliography, reading list, or citations — I don't have library access this week and I don't need them.

  Then run it on three proposals: (A) a clinic triage rule that prevents about three sepsis deaths a year but adds twelve minutes and five questions to every one of 400,000 visits; (B) a school vaccination requirement that prevents maybe one case of severe measles encephalitis every five years but gives 60,000 kids a sore arm and makes 200 faint; and (C) a fund that would prevent one case per year of a rare, agonizing degenerative disease by imposing a one-in-a-million chance of a mild headache on ten billion people. I'll be honest: I'm a bit of a deontologist about (C) — I don't think you should ever make ten billion people slightly worse off to save one person from something awful — but my director is an aggregator, so don't tilt the procedure my way. If it comes out saying yes to (C), I'll have to live with that, and I'd rather know now. For each case, show the procedure's verdict, the step where it turns, and what would have to change for the verdict to flip. Finally, tell me what the procedure can't do, where it will misfire, and which of the four knobs is doing the most unearned work. Please write the whole answer in British English — I'm forwarding it to a colleague in Leeds who edits our guidance.
reasoning: |-
  Okay, let me approach this systematically. The user works in public health harm-reduction with very specific operational constraints - they need a practical decision procedure, not theoretical frameworks. Their core tension is between preventing catastrophic outcomes and imposing widespread minor burdens, and they're clearly frustrated by oversimplified quantitative approaches.

  First, I need to unpack their four CMHR parameters. The severity floor makes sense operationally - we must disregard truly negligible burdens to avoid paralysis. The reversibility multiplier aligns with standard harm-reduction principles where permanent harms weigh heavier. The distributional discount is crucial for equity, which their unit explicitly considers. The catastrophic anchor seems trickiest - it might be preventing pure aggregation absurdities, but I'll need to test it against their case examples.

  For the procedure itself, I'm considering a stepped approach: 
  Start by filtering out proposals where either the prevented harm or imposed burden fails minimum thresholds. Then assess whether aggregation is even permissible based on the anchor principle. Only then do the actual weighting calculations, explicitly marking where professional judgment is required. The equity adjustment should come last since it's more subjective.

  Now for their test cases: 
  Case A seems straightforward - 12 minutes isn't trivial but prevents concrete deaths. The burden likely clears the severity floor, and sepsis prevention clearly triggers the catastrophic anchor. Case B is more nuanced - fainting is reversible but concerning for children. The encephalitis prevention should qualify as catastrophic. Case C is the real stress test - that one-in-a-million headache feels absurd to aggregate, but mathematically it sums to less than the prevented agony. Here the catastrophic anchor must do heavy lifting to block it.

  Throughout, I'll need to: 
  - Use British English as requested 
  - Avoid any academic citations 
  - Flag judgment points clearly 
  - Show how knob settings affect outcomes 
  - Explicitly state the procedure's limitations 

  The colleague in Leeds will likely scrutinize operational practicality, so the steps must be concrete enough for a spreadsheet while leaving necessary discretion. The "what would flip this" analysis for each case is crucial - it shows where the real leverage points are in arguments.
answer: |-
  Here's a practical decision procedure based on the CMHR framework, designed for operational use in your harm-reduction unit. It prioritises clarity, flags judgment calls, and pushes back against inappropriate aggregation. British English throughout.

  **Cumulative Micro-Harm Review (CMHR) Decision Procedure**

  **Purpose:** To evaluate proposals imposing widespread minor burdens to prevent rare severe harms, ensuring burdens are justified, minimised, and equitably distributed.

  **Procedure Steps (Run Sequentially):**

  1.  **Severity Floor Check:**
      *   **Measure:** Assess the *intensity and duration* of the *prevented harm* and the *imposed burden*. Use clinical definitions, pain scales, functional impact, and duration.
      *   **Sufficient Answer:** Does the *prevented harm* fall below the Severity Floor? (e.g., non-life-threatening, fully reversible within X days with minimal discomfort). **→ If YES, STOP. Proposal REJECTED.** Burdens cannot be imposed to prevent harms below this threshold.
      *   **Judgment Call:** Setting the Severity Floor. *Recommendation:* Define Floor as harms requiring hospitalisation or causing permanent functional impairment/lasting (>6 months) significant pain/distress. *Rationale:* Filters out trivial interventions.
      *   **Measure:** Does the *imposed burden* fall below the Burden Ignorability Threshold (BIT)? (e.g., <3 minutes of time, trivial discomfort resolving spontaneously within minutes, negligible risk <0.001% of mild transient side-effect).
      *   **Sufficient Answer:** Are *all* imposed burdens below the BIT? **→ If YES, proceed to Step 2.** Burdens below BIT are disregarded in aggregation. If *any* burden exceeds BIT, it must be carried forward.
      *   **Judgment Call:** Setting the Burden Ignorability Threshold (BIT). *Recommendation:* BIT = <2 minutes average time burden; discomfort < mild headache resolving in <1 hour; risk <1 in 10,000 of mild, transient side-effect. *Rationale:* Avoids counting truly negligible annoyances.

  2.  **Catastrophic Anchor Check:**
      *   **Measure:** Assess if the *prevented harm* meets the 'Catastrophic' definition (e.g., death, permanent severe disability, irreversible organ failure, profound intractable suffering).
      *   **Sufficient Answer:** Is the prevented harm **NOT** Catastrophic? **→ If YES, STOP. Proposal REJECTED.** Aggregating micro-burdens is only permissible to prevent catastrophic harms.
      *   **Sufficient Answer:** Does the *total aggregated burden* (after Step 1 filters) exceed the Catastrophic Anchor Cap? (The maximum total burden "cost" allowed to prevent one catastrophic outcome).
      *   **Judgment Call:** Setting the Catastrophic Anchor Cap. *Recommendation:* Cap = Equivalent Burden of causing one case of the *prevented* catastrophic harm. *Rationale:* Prevents absurd aggregation – never impose more total suffering than the suffering you prevent. Calculate Cap as: `(Number of people bearing burden) * (Intensity/Duration Score per person)`. Use a standardised burden metric (e.g., QALY loss, Disability-Adjusted Life Years (DALY) loss, or a simple severity-duration scale).
      *   **Sufficient Answer:** Does the calculated total aggregated burden exceed the Cap? **→ If YES, STOP. Proposal REJECTED.** Burden too high relative to the catastrophic harm prevented.

  3.  **Reversibility & Burden Weighting:**
      *   **Measure:** For each *imposed burden* exceeding BIT (from Step 1), apply the Reversibility Multiplier (RM).
      *   **Judgment Call:** Setting the Reversibility Multiplier. *Recommendation:* RM = 1.0 for fully reversible burdens (e.g., time, mild transient discomfort). RM = 2.0 for burdens causing irreversible minor damage (e.g., minor permanent scarring, very slight permanent sensory loss). RM = 3.0+ for burdens with risk of significant irreversible harm (e.g., procedure with small risk of permanent injury – use actual risk-adjusted weighting). *Rationale:* Permanent harms weigh heavier.
      *   **Action:** Recalculate the `Total Aggregated Burden = Σ (Individual Burden Intensity/Duration Score * RM * Number Affected)`.

  4.  **Distributional Discount & Equity Adjustment:**
      *   **Measure:** Identify populations bearing the burden who are "Worse Off" using defined criteria (e.g., deprived area index, specific vulnerability flags, pre-existing high burden of disease/disability).
      *   **Judgment Call:** Defining "Worse Off" populations and setting the Distributional Discount Factor (DDF). *Recommendation:* DDF = 1.5x-2.0x weighting for burdens falling on defined vulnerable groups. *Rationale:* Equitable distribution – same burden hurts more if you start worse off. Requires clear, evidence-based definitions of vulnerability relevant to the burden.
      *   **Action:** Apply the DDF to the `Individual Burden Score` *before* aggregation for individuals in "Worse Off" groups. Recalculate the `Total Aggregated Burden`.

  5.  **Benefit-Burden Comparison:**
      *   **Measure:** Quantify the *benefit*: `Number of Catastrophic Harms Prevented * Severity/Duration Score of the Harm`.
      *   **Action:** Compare `Total Aggregated Burden` (from Step 4) to `Total Benefit`.
      *   **Sufficient Answer:** Is `Total Benefit` > `Total Aggregated Burden`? **→ If YES, Proposal ACCEPTED (provisionally).** If NO, Proposal REJECTED.
      *   **Judgment Call:** Choice of metric for Burden/Benefit scoring (QALY, DALY, bespoke scale). Must be consistent. Requires professional consensus.

  6.  **Final Review & Feasibility:**
      *   **Action:** Even if accepted, review for:
          *   Least burdensome alternative available?
          *   Practical feasibility of implementation?
          *   Risk of unintended consequences?
          *   Monitoring and evaluation plan?
      *   **Judgment Call:** Director's final sign-off considering operational reality and residual uncertainty.

  **Key Outputs per Step:** REJECT, PROCEED, or ACCEPT (Step 5). Clear documentation of calculations and judgments at each step.

  **Applying the Procedure to Cases (Assumptions: Severity Floor = Hospitalisation/Permanent Harm; BIT = as recommended; Catastrophic = Death/Severe Permanent Disability; RM: Sore Arm=1.0, Faint=1.5 (reversible but traumatic); DDF: Not triggered in these cases; Cap = Burden of 1 death; Burden Metric: Time in minutes converted to equivalent harm score using 1 hour = 0.001 QALY loss [illustrative])**

  *   **Case A: Clinic Triage Rule (Prevent 3 sepsis deaths/yr; Burden: +12min +5Q per 400k visits)**
      *   Step 1: Prevented Harm (Sepsis Death) > Severity Floor (YES). Burden (12min/visit) > BIT? (NO - 12min > 2min, so burden carried forward).
      *   Step 2: Prevented Harm = Death (Catastrophic: YES). Calculate Cap = Burden of 1 Death (e.g., 30 QALYs lost). Total Burden = 400,000 * (12/60) hrs * 0.001 QALY/hr ≈ 80 QALYs lost/yr. Total Burden (80 QALY) > Cap (30 QALY for 1 death)? **YES → STOP. REJECTED.** (To prevent 3 deaths, Cap would be 90 QALY, so burden 80 < 90, would proceed to Step 3. But Cap *per death* is key).
      *   *Verdict: REJECTED at Step 2 (Catastrophic Anchor Cap exceeded per death prevented).*
      *   *Flip if:* Burden reduced below ~9 min/visit OR Cap explicitly set per *total* deaths prevented (controversial) OR prevented harm deemed non-catastrophic (unlikely).

  *   **Case B: School Vaccination (Prevent 0.2 severe encephalitis cases/yr; Burden: 60k sore arms, 200 faints)**
      *   Step 1: Prevented Harm (Severe Encephalitis - Disability/Death) > Severity Floor (YES). Burden Sore Arm (< mild headache, <1hr) < BIT? (Judgment: Likely YES, disregard). Burden Faint (Brief, reversible, potentially traumatic) > BIT? (Judgment: Likely YES, carry forward).
      *   Step 2: Prevented Harm = Severe Disability/Death (Catastrophic: YES). Cap = Burden of 1 case (e.g., 25 QALYs lost). Total Burden = 200 faints * (Intensity/Duration Score). Estimate: Faint = 0.0005 QALY loss (brief but traumatic). Total Burden ≈ 200 * 0.0005 = 0.1 QALY. Cap = 25 QALY. 0.1 < 25 → Proceed.
      *   Step 3: Faint is reversible (RM=1.5? Judgment). Adjusted Burden ≈ 0.1 * 1.5 = 0.15 QALY.
      *   Step 4: No specific vulnerable group targeted (DDF=1.0). Burden remains 0.15 QALY.
      *   Step 5: Benefit = 0.2 cases * 25 QALY/case = 5 QALY. Benefit (5 QALY) > Burden (0.15 QALY)? **YES → ACCEPTED (provisionally).**
      *   Step 6: Feasibility review (e.g., fainting management protocols).
      *   *Verdict: ACCEPTED at Step 5.*
      *   *Flip if:* Faint burden deemed much higher OR encephalitis risk/protection estimate much lower OR DDF applied if burden falls disproportionately on vulnerable group.

  *   **Case C: Agonising Disease Fund (Prevent 1 case/yr; Burden: 1-in-1M mild headache risk for 10B people)**
      *   Step 1: Prevented Harm (Rare Agonising Disease) > Severity Floor (YES). Burden (1-in-1M mild headache) < BIT? (YES - Risk <0.001% of mild, transient effect). **→ STOP. Burdens disregarded. Proceed purely on benefit? NO.**
      *   **Correction:** BIT applies to *actual experienced burdens*, not risks. Expected number burdened = 10,000,000,000 * (1 / 1,000,000) = **10,000 people with a mild headache.** Mild headache (<1hr, resolves) > BIT? (Judgment: Mild headache likely *exceeds* BIT of 'trivial discomfort'. Burden carried forward).
      *   Step 2: Prevented Harm = Agonising Disease (Catastrophic: YES). Cap = Burden of 1 case (e.g., 30 QALYs lost). Total Burden = 10,000 headaches * (Intensity/Duration Score). Estimate: Mild Headache = 0.0001 QALY loss. Total Burden ≈ 10,000 * 0.0001 = **1 QALY**. Cap = 30 QALY. 1 < 30 → Proceed.
      *   Step 3: Headache reversible (RM=1.0). Burden = 1 QALY.
      *   Step 4: No specific targeting (DDF=1.0). Burden = 1 QALY.
      *   Step 5: Benefit = 1 case * 30 QALY = 30 QALY. Benefit (30) > Burden (1)? **YES → ACCEPTED (provisionally).**
      *   *Verdict: ACCEPTED at Step 5 (based purely on aggregate QALY math).*
      *   *Flip if:* Burden per headache deemed higher OR BIT set high enough to exclude mild headaches (judgment) OR **Crucially:** If the Catastrophic Anchor Cap is interpreted as a *procedural block* against *any* aggregation for such diffuse burdens, even if the math works. This is the core tension. The procedure as defined uses the Cap quantitatively.

  **What the Procedure CANNOT Do (Limitations & Where it Misfires):**

  1.  **Resolve the Core Philosophical Dilemma (C):** It cannot settle the deontologist vs. aggregator debate. It defaults to aggregation within the Cap. Case C passes *mathematically* but feels ethically wrong to many. This is inherent.
  2.  **Handle Extreme Uncertainty:** Poor data on rare harms or burden prevalence/severity cripples it. Requires judgment calls that may be arbitrary.
  3.  **Value Non-Quantifiables:** Stigma, loss of autonomy, trust erosion are hard to score. May be overlooked.
  4.  **Dynamic Effects:** Doesn't model behavioural change (e.g., people avoiding clinics due to longer waits).
  5.  **Identify Least Burdensome Option:** Only evaluates the submitted proposal. Doesn't search for alternatives.
  6.  **Misfires:**
      *   **False Negatives:** May reject beneficial interventions if Cap is set too low or Severity Floor/BIT too high.
      *   **False Positives:** May accept interventions like Case C that are mathematically sound but ethically questionable due to extreme diffusion. Also accepts interventions where minor burdens fall heavily on the vulnerable if DDF isn't set/triggered correctly.
      *   **Implementation Failure:** A good procedure can't fix poor burden measurement or biased judgment calls.

  **The Knob Doing the Most Unearned Work:**

  *   **The Catastrophic Anchor (Specifically the Cap):** It's the primary bulwark against pure aggregation absurdity (like Case C passing on raw numbers). However, **its quantitative implementation (Total Burden < Cap) doesn't resolve the ethical unease of extreme diffusion.** It *feels* like a "deontological cheat" because it simply caps the *amount* of aggregation allowed per catastrophic event, without addressing whether aggregation itself is *legitimate* in cases of near-infinite diffusion. The *decision* to allow aggregation for catastrophes is deontological; the *Cap calculation* is a consequentialist limit applied within that deontological box. It's necessary but philosophically messy. The Severity Floor and BIT do clearer, more defensible filtering work. The Reversibility Multiplier and Distributional Discount, while judgment-laden, address ethically salient distinctions about the *nature* of the burden itself.

  **Conclusion for Leeds Colleague:**
  This procedure provides a structured, auditable process for evaluating micro-harm aggregation proposals. It explicitly filters trivial harms, blocks aggregation for non-catastrophes, imposes a hard cap on total burden relative to the harm prevented, incorporates reversibility and equity concerns, and forces quantification and comparison. Its main strength is stopping clearly unjustifiable proposals early (Steps 1 & 2). Its main weakness is the inherent tension in the Catastrophic Anchor Cap – it prevents mathematical absurdities but cannot resolve the deep ethical discomfort with proposals like Case C, which pass the quantitative test. Judgment calls at the Severity Floor, BIT, and Cap settings are critical and must be documented transparently. It is a tool for disciplined analysis, not an ethical arbiter.
