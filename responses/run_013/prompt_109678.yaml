prompt: |-
  For about two years a colleague and I have been replaying the same argument about futarchy, and I would like a diagnosis of what kind of disagreement it actually is rather than a verdict on the proposal. The arrangement, as I understand it, is this: an electorate or its representatives constitutionally fix an after-the-fact measure of national welfare, and policy questions are then settled by conditional prediction markets — markets that price claims of the form, if policy P is adopted, measured welfare in year D will be at least X — where the conditional bets are voided if the antecedent never occurs, and where a policy becomes law when the market's estimate clearly favours it. We agree on the mechanics, on the fact that real markets are thin, manipulable, and slow, and on the observation that the proposal has never been tried. Neither of us has moved in two years.

  His position: every objection is an engineering problem. That the welfare measure is somewhat arbitrary is answered by treating it as a constitutional choice, like a currency or an electoral rule; a bad measure makes a bad constitution, not an incoherent mechanism. Manipulation is a cost that scales with stake size and can be priced; illiquidity can be subsidised. The mechanism's virtue is that it separates two things democratic politics conflates — what we want, fixed by votes, and what will happen, fixed by bets — and nothing in that separation is confused.

  My position: the mechanism cannot settle the questions it is advertised to settle. Whatever measure is fixed, someone had to choose it, and the choice among measures is precisely the kind of value dispute the mechanism was meant to remove; the market can only tell you how to pursue a goal once the goal is given, so the disagreement is displaced one level up rather than resolved. Worse, the conditional markets that matter most are the ones whose antecedent never obtains: if the market's estimate is what causes a policy to be adopted, the branch in which it is not adopted is never realised, so the market's accuracy is unverifiable exactly where it does the deciding. And a market in whether welfare will reach X presupposes that welfare is a quantity settleable by a date, which is a substantive moral claim rather than a measurement convention.

  My hypothesis, offered as a hypothesis: this is not really a disagreement about prediction markets but about what an institution is being asked to do — he assesses the proposal as an ideal mechanism and treats deviations as costs to be minimised, while I assess it as something that must be robust under the conditions that generate value disagreement in the first place, and those two standards never meet. If that is right, no evidence about market accuracy will move the dispute.

  I can see three rival readings and want them tested against what each of us actually says. First, that it is verbal: we may mean different things by aggregating preferences — he means pooling beliefs about consequences given fixed values, I mean pooling the values themselves — and so may be answering different questions under one name. Second, that a hidden formal question is doing the work: whether any design of conditional markets is well defined when the market's own output selects the policy looks like a question in mechanism design with a determinate answer, not a clash of intuitions. Third, that it is simply empirical, about whether such markets beat the alternatives, in which case we are both speculating.

  Diagnose it. Say which reading the positions as stated actually support, whether my one-level-up hypothesis survives, and whether the distinction I have been running together — a market whose price is decisive versus one whose price is merely advisory — changes the diagnosis, since I suspect he has the advisory design in mind and I have the decisive one. Then tell me what would count as progress: a formal result, a distinction, a pilot, or an argument that none of these should be expected and why.
reasoning: |-
  We are presented with a two-year-long disagreement about futarchy between the user and their colleague. The user wants a diagnosis of the nature of their disagreement, not a verdict on futarchy itself. The user has provided their respective positions and a hypothesis about the core of the disagreement. We are also asked to test three rival readings and to consider the role of the market being decisive versus advisory.

  ## Step 1: Summarize the Positions

  ### Colleague's Position (Pro-futarchy)
  - Every objection to futarchy is an engineering problem that can be mitigated.
    - The welfare measure being arbitrary is like a constitutional choice (e.g., currency, electoral rules); a bad measure leads to a bad constitution, not an incoherent mechanism.
    - Market manipulation and illiquidity are practical issues that can be addressed (e.g., pricing manipulation costs, subsidizing liquidity).
  - The key virtue is the separation of two things that democratic politics conflates: 
    - What we want (fixed by votes) and what will happen (fixed by bets).
  - This separation is clear and unconfused.

  ### User's Position (Anti-futarchy)
  - The mechanism cannot settle the questions it is meant to settle.
    - **First Objection (The Welfare Measure):** The choice of welfare measure is a value dispute, which the mechanism was supposed to remove, but it only displaces it to the constitutional level. The market can only tell you how to achieve a goal, not set the goal.
    - **Second Objection (Unverifiable Conditionals):** The most important conditional markets (those for policies that are not adopted) are unverifiable because the antecedent never occurs. Thus, the market's accuracy in deciding policies is untestable.
    - **Third Objection (Presupposition of Welfare):** The market presupposes that welfare is a quantifiable and time-bound concept, which is a substantive moral claim, not a neutral convention.

  ### User's Hypothesis
  The core disagreement is not about prediction markets per se but about what an institution is being asked to do:
  - The colleague assesses futarchy as an ideal mechanism and treats deviations (like manipulation) as costs to be minimized (an engineering perspective).
  - The user assesses it as needing robustness under the conditions that generate value disagreements (a robustness perspective).

  The user suspects that under this hypothesis, no evidence about market accuracy will resolve the dispute.

  ## Step 2: Test the Three Rival Readings

  The user proposes three alternative interpretations of the disagreement and asks which is supported by their stated positions.

  ### First Rival Reading: Verbal Disagreement (Different meanings of "aggregating preferences")
  - **Colleague:** Aggregating preferences means pooling beliefs about consequences given fixed values (i.e., the market aggregates beliefs about what will happen if a policy is adopted, assuming the welfare measure is fixed).
  - **User:** Aggregating preferences means pooling the values themselves (i.e., the welfare measure itself should be the outcome of some aggregation, which the mechanism does not do, instead displacing it to the constitutional level).

  **Assessment:** 
  This reading is strongly supported by the user's first objection. The user explicitly says: "the market can only tell you how to pursue a goal once the goal is given, so the disagreement is displaced one level up". The colleague, by treating the welfare measure as a constitutional choice, is indeed separating the goal-setting (by vote) from the means (by market). Thus, they are using "aggregating preferences" in two different senses. This reading is consistent with both positions.

  ### Second Rival Reading: Hidden Formal Question (Mechanism Design)
  The question is whether conditional markets are well-defined when the market's output (price) selects the policy. This is a mechanism design question with a determinate answer.

  **Assessment:**
  The user's second objection (unverifiable conditionals) touches on this. The user says: "if the market's estimate is what causes a policy to be adopted, the branch in which it is not adopted is never realised, so the market's accuracy is unverifiable". This is a formal point about the design of the market: the market's prediction is self-defeating (or self-fulfilling) in the sense that the act of adopting the policy based on the market prediction makes the counterfactual unobservable. This is a known issue in futarchy and prediction markets. The colleague might counter that the market can still be designed to account for this (e.g., by using other policies as benchmarks or by using combinatorial markets). However, the user's point is that the mechanism is fundamentally flawed in this regard. This reading is also supported, especially because the user frames it as a problem with the mechanism's design.

  ### Third Rival Reading: Empirical Disagreement
  The disagreement is simply about whether such markets beat the alternatives (e.g., democracy) in practice.

  **Assessment:**
  Both parties agree that real markets have issues (thin, manipulable, slow) and that the proposal has never been tried. The colleague argues that these are engineering problems that can be overcome, while the user argues that the mechanism is fundamentally incapable of settling value disputes and has unverifiable predictions. The user's objections are not primarily empirical (about how well markets work in practice) but conceptual (about what the mechanism can and cannot do). The colleague's position does have an empirical component (engineering can fix practical issues), but the user's objections go deeper. Thus, while there is an empirical layer (e.g., how well can we design markets to resist manipulation?), the core of the user's position is not empirical but conceptual and philosophical. Therefore, this reading is less central, though not entirely absent.

  ## Step 3: Evaluate the User's Hypothesis (One-Level-Up)

  The user's hypothesis: The disagreement is about the standard of assessment — ideal mechanism (colleague) vs. robust mechanism (user).

  **Assessment:**
  This hypothesis is strongly supported. The colleague treats problems as engineering challenges (i.e., deviations from the ideal that can be fixed with better design). The user is concerned about the fundamental conditions under which the mechanism must operate (e.g., the existence of value disagreements and the unobservability of counterfactuals). The user's objections (especially the first and third) are about the conceptual foundations, not just implementation. The colleague's responses (e.g., welfare measure as a constitutional choice) suggest they see the mechanism as sound in principle and only needing practical adjustments. Thus, the two standards (ideal vs. robust) are indeed at play and may be irreconcilable because they reflect different priorities.

  ## Step 4: Role of Market Being Decisive vs. Advisory

  The user suspects that the colleague might be thinking of an advisory design (where the market's prediction is one input among others) while the user is thinking of a decisive design (where the market's price directly determines the policy).

  **Assessment:**
  This distinction is crucial and changes the diagnosis.

  - In the **decisive design** (as the user describes), the market's estimate causes the policy to be adopted, which leads to the unverifiable counterfactual problem (objection 2). Also, the welfare measure's arbitrariness is more critical because the mechanism is binding.
  - In an **advisory design**, the market's prediction might be one input to a human decision-maker, who could consider other factors (including the value disagreements) and might not act solely on the market's price. This would mitigate the unverifiable counterfactual issue (because the decision is not solely determined by the market) and might also allow for adjustments to the welfare measure.

  However, the colleague's position as stated does not explicitly mention an advisory role. The user describes the colleague's view as: "a policy becomes law when the market's estimate clearly favours it", which sounds decisive. But the user suspects the colleague might have advisory in mind.

  If the colleague is indeed thinking advisory, then:
  - The unverifiable counterfactual problem is less severe because the market isn't the sole decider.
  - The value disputes might be resolved by the human decision-maker, not displaced entirely.

  But note: the colleague's key point is the separation of "what we want" (votes) and "what will happen" (bets). This separation is clearer in a decisive design. In an advisory design, the bets are only one input, so the separation is blurred.

  Given the user's description, the colleague's position seems to support a decisive design. However, if the user is mistaken and the colleague is thinking advisory, that would explain why the colleague sees the problems as engineering issues (because the advisory role allows for human intervention). But the user's objections are primarily about the decisive design.

  Thus, if the colleague has an advisory design in mind, the user's second objection (unverifiable conditionals) becomes less central, but the first and third objections (value disputes and welfare presuppositions) remain. The first rival reading (verbal) and the one-level-up hypothesis would still hold because the choice of welfare measure would still be a value dispute displaced to the constitutional level.

  ## Step 5: Diagnosis

  The disagreement is multi-faceted, but the primary drivers are:

  1. **Verbal Disagreement:** The two parties are using "aggregating preferences" differently. The colleague focuses on aggregating beliefs about consequences (given a fixed welfare measure), while the user is concerned that the welfare measure itself requires value aggregation, which the mechanism does not provide.

  2. **Formal Issue:** The user's second objection (unverifiable conditionals) points to a formal problem in mechanism design when the market is decisive. The colleague might see this as an engineering challenge (e.g., using other methods to estimate counterfactuals), but the user sees it as a fundamental flaw.

  3. **Assessment Standard:** The one-level-up hypothesis is validated. The colleague evaluates futarchy as an ideal mechanism and sees problems as practical, while the user requires robustness to the conditions that cause value disagreements and unverifiable predictions.

  The empirical reading is secondary because the user's objections are not primarily about market performance in practice but about the mechanism's conceptual foundations.

  ## Step 6: What Would Count as Progress?

  Given the nature of the disagreement:

  - **A formal result** addressing the mechanism design issue (e.g., proving that under certain conditions, conditional markets are well-defined and incentive-compatible even when they influence the policy) might help. However, the unverifiable counterfactual problem might not have a formal solution because it is an inherent limitation of counterfactuals in decision-making.

  - **A distinction** clarifying the market's role (decisive vs. advisory) might help. If the colleague is indeed thinking advisory, then the user's objections about decisiveness might be partially resolved. But the core issue of the welfare measure's arbitrariness and the displacement of value disputes would remain.

  - **A pilot** (real-world test) would not resolve the conceptual issues because:
    - The welfare measure would still be chosen arbitrarily, so value disputes would be evident in the constitutional setup.
    - The unverifiable conditionals would remain unverifiable.
    - The pilot might only address the empirical concerns (market manipulation, liquidity) which the colleague already treats as engineering problems.

  - **An argument that none of these should be expected:** Given that the disagreement is partly conceptual and about standards of assessment, it may be intractable. The two parties have different criteria for what counts as a successful institution. The colleague prioritizes the separation of values and facts, while the user prioritizes robustness to value pluralism and the handling of counterfactuals. Without a shared standard, progress is difficult.

  ### Recommendations for Progress:
  1. **Clarify the Market's Role:** Discuss explicitly whether the market is decisive or advisory. This might reveal if the colleague is open to a hybrid model, which could address some of the user's concerns.

  2. **Address the Welfare Measure:** Explore whether the welfare measure could be designed in a way that incorporates value aggregation (e.g., through iterative voting or multiple measures). This might bridge the verbal disagreement.

  3. **Formal Model of Counterfactuals:** Investigate existing literature on counterfactuals in decision markets (e.g., Robin Hanson's responses to this issue). If there is a formal model that accounts for the unverifiable conditionals, it might help.

  4. **Acknowledge the Standards Gap:** Recognize that the two positions are based on different evaluative standards (ideal vs. robust). Then, discuss which standard is more appropriate for institutional design. This meta-discussion might lead to a breakthrough.

  Given the above, the most promising path is to focus on the verbal disagreement and the role of the welfare measure. If the parties can agree that the welfare measure must itself be the outcome of a value aggregation process (and not just a constitutional given), then they might design a two-stage futarchy that includes a mechanism for updating the welfare measure. This would address the user's concern about displacing value disputes.

  However, the unverifiable conditionals problem in the decisive design remains a formal challenge without a clear solution. Therefore, shifting to an advisory role might be necessary.

  ## Final Diagnosis

  The disagreement is primarily:
  - A verbal disagreement about what "aggregating preferences" means (beliefs vs. values) and the role of the welfare measure.
  - A formal issue about the design of conditional markets when they are decisive (unverifiable counterfactuals).
  - Driven by the user's hypothesis: the colleague is evaluating the mechanism in the ideal, while the user requires robustness under conditions of value pluralism and unobservable counterfactuals.

  The distinction between decisive and advisory markets is important. If the colleague has an advisory design in mind, the unverifiable counterfactuals objection is less severe, but the welfare measure objection remains. If the market is decisive, the unverifiable counterfactuals problem is a major formal hurdle.

  Progress might come from:
  - Clarifying the market's role (decisive vs. advisory).
  - Developing a formal model that addresses the unverifiable counterfactuals (though this is challenging).
  - Re-designing the mechanism to include value aggregation for the welfare measure.

  However, given the depth of the disagreement, especially about the standards of institutional assessment, a meta-discussion about what constitutes a good institution might be necessary. Without shared criteria, the dispute may persist.
answer: |-
  ### Diagnosis of the Disagreement

  Your two-year impasse with your colleague is not primarily about the empirical performance of prediction markets (e.g., their thinness or manipulability), nor is it a simple clash over the mechanics of futarchy. Instead, the core disagreement stems from **divergent evaluative standards for institutional design** and **fundamental conceptual tensions** in how futarchy addresses value disputes and counterfactuals. Your hypothesis—that you assess futarchy through a robustness lens while your colleague treats it as an ideal mechanism—largely holds, but it intersects with other issues. Below, I diagnose the disagreement by testing your three rival readings against your stated positions, evaluating your hypothesis, and assessing the role of the market's decisiveness. I then outline what might count as progress.

  ---

  ### 1. **Testing the Three Rival Readings**

  #### a. **Verbal Disagreement: Different Meanings of "Aggregating Preferences"**  
     - **Your Position**: You view "aggregating preferences" as encompassing both the pooling of *values* (e.g., defining what "welfare" means) and *beliefs* (e.g., predicting outcomes). Your objection that the welfare measure displaces value disputes to the constitutional level shows you see futarchy as incomplete because it fails to aggregate values—only beliefs.  
     - **Colleague's Position**: He treats "aggregating preferences" narrowly as pooling *beliefs about consequences*, given a fixed welfare measure (a "goal" set by votes). He explicitly separates "what we want" (values, fixed constitutionally) from "what will happen" (beliefs, fixed by markets), so for him, value aggregation is resolved at the constitutional level, not within the market mechanism.  
     - **Verdict**: **This reading is strongly supported**. Your colleague sees the welfare measure as a resolved input (like a currency), while you see it as an unresolved output of value disagreements. This verbal divide explains why you talk past each other: you’re debating different problems (value aggregation vs. belief aggregation).

  #### b. **Hidden Formal Question: Mechanism Design and Self-Referential Markets**  
     - **Your Position**: You raise a formal concern: conditional markets become ill-defined when the market’s output (policy adoption) voids the antecedent (non-adoption), making predictions unverifiable. This is a mechanism-design flaw—markets cannot test counterfactuals for policies they themselves cause to be adopted.  
     - **Colleague's Position**: He treats this as an "engineering problem" (e.g., subsidizing liquidity or using statistical corrections), implying he sees it as a technical challenge within a solvable framework. He doesn’t engage with the self-referential paradox as a dealbreaker.  
     - **Verdict**: **This reading is partially supported but subordinate**. Your objection is indeed formal (it echoes issues like the "Lucas critique" in economics or "Goodhart’s law"), but your colleague’s response frames it as empirical (fixable with design tweaks). However, this isn’t the core clash—it’s a symptom of your deeper divide over standards (ideal vs. robust).

  #### c. **Empirical Disagreement: Do Markets Beat Alternatives?**  
     - **Your Position**: Your objections are not primarily empirical; they’re conceptual (e.g., unverifiable counterfactuals, moral presuppositions of welfare). You dismiss empirical fixes because the mechanism is incoherent *in principle* under value pluralism.  
     - **Colleague's Position**: He focuses on empirical hurdles (manipulation, illiquidity) as soluble with engineering, implying that if markets outperformed democracy in practice, futarchy would be justified.  
     - **Verdict**: **This reading is weak for your position but relevant for your colleague’s**. You reject futarchy on conceptual grounds, so empirical evidence (e.g., a pilot) wouldn’t sway you. Your colleague, however, *is* making an empirical wager: if engineering solves practical issues, futarchy works. But since you both agree markets are "thin, manipulable, and slow," this isn’t the source of stalemate—it’s that you see deeper flaws.

  **Summary of Readings**:  
  - The **verbal disagreement** (beliefs vs. values) is the strongest driver.  
  - The **formal issue** (unverifiable counterfactuals) amplifies your conceptual objections but is secondary.  
  - The **empirical question** is a red herring for you but central to your colleague’s optimism.  

  ---

  ### 2. **Does Your "One-Level-Up" Hypothesis Survive?**  
  **Yes, and it’s the crux of the disagreement**.  
  - **Colleague’s Standard**: He evaluates futarchy as an *ideal mechanism*. He assumes the welfare measure can be fixed and stable (like a currency), and deviations (e.g., manipulation) are noise to be minimized. This is a "first-best" perspective: if we perfect the engineering, the separation of values (votes) and beliefs (markets) is superior to democracy.  
  - **Your Standard**: You evaluate futarchy through a *robustness* lens. It must function under conditions of irreducible value pluralism (where defining welfare is inherently contested) and epistemic uncertainty (where key counterfactuals are unverifiable). For you, displacing disputes to the constitutional level isn’t a solution—it’s evasion.  
  - **Why It Stalemates**: These standards are incommensurable. Your colleague sees value disputes as "solved" by constitutional choices; you see them as perpetually destabilizing. Evidence about market accuracy won’t help because your objection targets the preconditions (e.g., "Can welfare be defined without moral presuppositions?"), not market performance.  

  ---

  ### 3. **Does the Decisive vs. Advisory Market Distinction Change the Diagnosis?**  
  **Yes—it sharpens the divide and explains part of the stalemate.**  
  - **Decisive Market (Your Focus)**: The market’s price directly determines policy adoption. This exacerbates your objections:  
    - The unverifiable counterfactual problem becomes critical (if the market causes adoption, the "not adopted" branch is unknowable).  
    - Value-laden presuppositions (e.g., welfare as quantifiable) are embedded in binding decisions.  
    - You’re right to worry, as this setup makes futarchy vulnerable to self-referential errors.  
  - **Advisory Market (Likely Colleague’s View)**: The market’s price informs human decision-makers but isn’t binding. This softens your objections:  
    - Unverifiable counterfactuals matter less because humans can weigh other factors.  
    - Value disputes might be resolved through deliberation, not displaced.  
    - Your colleague can treat flaws as "engineering problems" because advisory markets are less brittle.  
  - **Impact on Diagnosis**: You suspect your colleague imagines an advisory design—consistent with his engineering mindset. But in your decisive framing, the mechanism’s flaws are fatal. This distinction explains why:  
    - **You** see futarchy as incoherent (decisive markets make counterfactuals unverifiable and moral claims unavoidable).  
    - **He** sees it as imperfect but viable (advisory markets are corrigible with human oversight).  
    **Conclusion**: The distinction deepens the verbal and standards-based disagreement. If he assumes advisory markets, your objections seem like overblown "engineering problems"; if you assume decisive, his optimism seems naive.  

  ---

  ### What Would Count as Progress?  
  Given the diagnosis, progress requires resolving the conceptual and evaluative gaps. Empirical evidence (e.g., a pilot) or engineering tweaks won’t suffice—your objections are philosophical. Here’s what might help:  

  #### a. **A Formal Result** (Most promising for the mechanism-design issue)  
     - Focus on the self-referential problem (e.g., "Can conditional markets be well-defined when they influence outcomes?"). A proof that this is intractable (e.g., showing markets *must* be unverifiable for decisive policies) would validate your concern. Conversely, a model incorporating "counterfactual robustness" (e.g., using historical data or parallel markets) might satisfy your colleague.  
     - **Why it might work**: It addresses the hidden formal question directly. If a theorem shows futarchy is incoherent in decisive form, your colleague must concede or shift to advisory.  

  #### b. **A Distinction** (Key for the verbal disagreement)  
     - Clarify the type of "aggregation" needed:  
       - **Type 1**: Aggregating values (defining welfare).  
       - **Type 2**: Aggregating beliefs (predicting outcomes given defined welfare).  
     - Then, debate whether futarchy solves Type 2 but ignores Type 1. If your colleague admits Type 1 requires a separate process (e.g., deliberative democracy), you might agree on a hybrid model.  
     - **Why it might work**: It forces engagement with your "displacement" objection and could reconcile the verbal divide.  

  #### c. **A Pilot** (Least likely to help)  
     - Testing futarchy in practice (e.g., for local policies) would only address empirical issues like manipulation—which you both already agree are secondary. It wouldn’t touch value disputes or unverifiable counterfactuals.  
     - **Why it shouldn’t be expected**: Pilots can’t resolve conceptual flaws. A "successful" trial might just reflect a simple welfare measure, dodging value pluralism; a failure might be dismissed as bad engineering.  

  #### d. **An Argument for Intractability** (Fallback)  
     - If no progress is possible, it’s because your standards are irreconcilable:  
       - **Your colleague** prioritizes efficiency in belief aggregation.  
       - **You** prioritize robustness to moral disagreement.  
     - Here, progress means agreeing that futarchy is a tool for specific contexts (e.g., technical decisions with clear goals) but not for value-laden ones.  

  **Recommendation**: Start with **(b) a distinction** to resolve the verbal confusion, then pursue **(a) a formal result** for the self-referential issue. If you can isolate the welfare measure as a Type 1 problem (values) and the market as Type 2 (beliefs), you might agree that futarchy only "works" with advisory markets and a separate value-aggregation process. Absent that, the dispute may persist—not due to stubbornness, but because you’re fundamentally at odds over what institutions should do.
