prompt: |-
  I've got a term paper due at the end of next semester — 6000 words, for a seminar on ethics and economics — and a half-formed idea I'd like you to turn into a proper proposal.

  Here's the hunch. Everyone reads Keynes's "Economic Possibilities for our Grandchildren" as this optimistic forecast about the 15-hour week, but the part I keep coming back to is near the end, where he says that once the economic problem is actually solved we'll be left with the real problem — how to use our freedom from economic cares, how to live, what to do with the leisure. And he half-suggests the answer is some kind of cultivated life, a life of aesthetic and intellectual engagement rather than more stuff. Now put that next to "My Early Beliefs," where he tells us what he and his Bloomsbury friends actually believed as young men: they took from Moore that the good consists in certain states of mind — love, beauty, the pursuit of knowledge — and while he says they eventually threw over Moore's practical doctrine and its calculus, I don't think they ever gave up the underlying picture of what's worth wanting. So here's my suspicion: Keynes's economics is built to deliver satiety. The whole point of solving the economic problem is that wants can, in principle, be met. But the goods he personally cared about, the Moorean states of mind, are open-ended and can't be saturated — you can always know more, see more, love more. If that's right, then abundance isn't actually what solves the problem he says it solves, and the vision has a hole in it. What I can't tell yet is whether this is a real inconsistency or whether there's some way of holding the two together that I'm missing.

  Turn this into a proposal. State the question so that it has a determinate answer rather than being a vague "explore the relationship between X and Y." Say why the standard readings of both essays leave it genuinely open — but don't just tell me what the commentators say, I'll track down the literature myself, so please no bibliography and no citations, I'll fill those in. Lay out the method: what I'd actually do, week by week, given that it's one semester and 6000 words. Say what would count as the project failing rather than just quietly petering out, and give me an honest read on whether this is too big for a term paper or whether there's a smaller version of it that's still interesting. And don't just hand me the menu of possible positions — commit to the reading you think is actually right and defend it, even if that means telling me my hunch is wrong.
