prompt: |-
  For the past several months I've been reporting on undercover stings and the entrapment defence, and I've run into a conceptual tangle I'd like you to work through with me rather than around. In the federal courts the defence is defendant-centred: once it is raised, the prosecution must prove beyond a reasonable doubt that the defendant was predisposed — ready and willing to commit the offence had the government left him alone — which in practice makes the pivotal question a counterfactual one about what he would have done absent the inducement. Two episodes pull the doctrine in different directions. In the Abscam sting of the late 1970s, FBI agents posing as front men for a fictitious Arab businessman handed cash to members of Congress, and the entrapment defences largely failed, because jurors concluded the congressmen were already willing. In Jacobson v. United States (1992), postal inspectors spent more than two years courting a Nebraska man with mailings from invented organisations — after his earlier purchases had been perfectly legal — until he finally ordered material Congress had meanwhile outlawed, and a narrowly divided Supreme Court reversed his conviction on the ground that the government had never proved predisposition and had instead implanted the desire. The doctrine's rival formulation, the one in the Model Penal Code, is not about the defendant at all: it asks whether the government's conduct was the kind that would induce a normally law-abiding person, which locates the wrong in the state's behaviour rather than in the defendant's character.

  A law professor I interviewed told me, with some relish, that entrapment is at bottom an application of the principle of alternative possibilities, and that Frankfurt's cases — the counterfactual intervener who stands ready to force the agent's hand but never has to — long ago showed that principle to be false, so the whole doctrine rests on a premise we have good reason to reject. I suspect the analogy does not survive contact with the details, and I want the mapping done carefully rather than rhetorically. So: say precisely which element of the predisposition test is counterfactual and what an alternative-possibilities reading of it would require; set out what Frankfurt's cases do and do not establish about responsibility when the agent's own will is the source of the act; then work through the disanalogies — the intervener is idle by stipulation and reliably present, whereas an informant is causally active and the disposition at issue is arguably the very thing the state helped manufacture; the defence is asymmetric, in that private inducement is no excuse at all, which suggests the doctrine is policing state power rather than assessing culpability; and the government's capacity to intervene is finite and error-prone, so the "intervener" in any real case is probabilistic rather than guaranteed, which may matter to the verdict. Having done that, tell me which of the two families of views — the leeway or alternative-possibilities family, or the actual-sequence or sourcehood family — the federal test is actually tracking, whether it is a doctrine of responsibility at all rather than a constraint on the state dressed in the vocabulary of excuse, and where the theory simply falls silent instead of being stretched to fit.

  If the professor's framing is confused — if entrapment is not a responsibility doctrine in the first place, or if the leeway and sourcehood vocabularies do not carve it at the joints — please say so plainly rather than accommodating me; I would much rather be told that my question is badly posed than be handed a synthesis that papers over the mismatch. Be explicit about which claims are settled doctrine, which are contested, and which are your own extrapolation, and flag any point at which you are reasoning past the limits of what you can reliably say. End with a single line beginning "Verdict:" that states in one sentence whether the federal predisposition test is best read as a leeway doctrine, a sourcehood doctrine, or neither.
reasoning: |-
  Okay, the user is a journalist deeply engaged in legal philosophy regarding entrapment defenses. They've hit a conceptual snag between federal predisposition tests and Frankfurt's critique of alternative possibilities. The core tension lies in whether entrapment doctrine is fundamentally about free will or state overreach.

  Hmm, the professor's Frankfurt analogy seems elegant but potentially misleading. Let me mentally unpack this:

  First, the predisposition test's counterfactual element is explicitly about what the defendant *would have done* without government inducement - that's textbook alternative possibilities framing. But Frankfurt's thought experiments famously challenge whether such counterfactual freedom is necessary for responsibility. 

  However, the legal reality diverges from philosophy in three crucial ways:
  1) Active manufacturing vs passive standby: Unlike Frankfurt's idle intervener, undercover agents actively cultivate criminal intent over time (Jacobson being the prime example)
  2) Asymmetry in treatment: Private inducement isn't a defense, revealing this is really about state power limits
  3) Real-world uncertainty: Unlike philosophical guarantees, real stings involve probabilistic causation

  The user's sharpest insight is recognizing that courts might be using responsibility language as a facade for regulating state behavior. That explains why Jacobson focused on the government's manufacturing of desire rather than deep analysis of the defendant's will.

  Important to flag where doctrine ends and interpretation begins: The "predisposition" requirement is settled law, but its philosophical underpinnings are hotly debated in academia. My extrapolation is that the asymmetry point reveals the doctrine's true nature as a structural safeguard.

  Verdict time: After mapping all this, the federal test uses leeway vocabulary but functions as state-power containment. Neither philosophical framework fits perfectly, but if forced to choose, it's closer to sourcehood with the "state as source" twist. The single-sentence verdict should capture that hybrid reality.
answer: |-
  Here's a precise analysis of the entrapment doctrine's conceptual structure, addressing your core questions directly and flagging the boundaries of settled doctrine, scholarly debate, and reasoned extrapolation:

  ### 1. **The Counterfactual Element in Predisposition**
     - **Settled Doctrine:** The federal test requires proving the defendant was *predisposed*—meaning they were "ready and willing" to commit the crime *before* government involvement. The pivotal question is counterfactual: **"Would the defendant have committed the offense *absent* the government's inducement?"**
     - **Alternative-Possibilities (Leeway) Reading:** This would require that the defendant *could have chosen otherwise* (i.e., refrained from the crime) if the government had not intervened. Predisposition negates this: if the defendant was already willing, they lacked the leeway to avoid the crime even without the sting.

  ### 2. **Frankfurt Cases: What They Do (and Don't) Establish**
     - **Settled Philosophy:** Frankfurt-style cases (e.g., Black the intervener who needs no intervention) show that **moral responsibility can exist even when alternative possibilities are absent**. If the agent acts *from their own will* (the "actual sequence"), they are responsible—regardless of whether they *could* have done otherwise.  
     - **Limits:** Frankfurt cases assume the intervener is *passive* and the agent's will is *unmanipulated*. They **do not address cases where the intervener actively *manufactures* the desire** (e.g., Jacobson's 2-year conditioning). Here, the "source" of the act is the state, not the agent.

  ### 3. **Key Disanalogies with Entrapment**
     - **Intervener Activity:**  
       - Frankfurt: Intervener is *idle* (no causal role).  
       - Entrapment: Government is *causally active* (e.g., fake mailings in *Jacobson*).  
       - **Implication:** Entrapment tests whether the government *created* the criminal intent, not just whether alternatives existed.  
     - **Asymmetry of the Defense:**  
       - Private inducement is no excuse → **The doctrine uniquely targets *state misconduct***. This suggests it functions as a **deterrent against state overreach**, not a general inquiry into culpability.  
     - **Probabilistic vs. Guaranteed Intervention:**  
       - Real-world stings involve imperfect state control and uncertain outcomes. The defense asks whether *this defendant* was predisposed, not whether a hypothetical "normal person" might succumb.  
       - **Contrast:** Model Penal Code focuses on *state conduct* ("would induce a normally law-abiding person"), rejecting counterfactuals about the specific defendant.

  ### 4. **Is Entrapment a Responsibility Doctrine?**
     - **Contested View:** The federal test *uses* responsibility language (predisposition = culpable character) but its **asymmetry and focus on state conduct reveal it as a *regulatory* doctrine**.  
     - **Sourcehood vs. Leeway:**  
       - **Leeway (Alternative Possibilities):** Federal test *formally* fits here (focus on defendant's "would have done" absent inducement).  
       - **Sourcehood (Actual Sequence):** *Jacobson* implicitly adopts this by asking if the government *caused* the criminal intent ("implanted the desire").  
     - **Core Tension:** Doctrine wavers between:  
       (a) "Was this defendant blameworthy?" (leeway/sourcehood)  
       (b) "Did the state cross a line?" (regulatory constraint).  

  ### 5. **Where Theory Falls Silent**
     - The law **lacks tools to address "manufactured predisposition"** (e.g., if state tactics *create* willingness over time). *Jacobson* hints that extreme inducements negate responsibility, but offers no principled threshold.  
     - **Frankfurt’s Irrelevance:** Entrapment isn’t about *alternative possibilities* but about **state-induced *sourcehood disruption***. Frankfurt assumes an untainted will; entrapment questions whether the will is genuinely the defendant’s.  

  ### 6. **Synthesis: Doctrine vs. Philosophy**
     - **Settled Doctrine:** Federal test is *explicitly* counterfactual/leeway-based. *Jacobson* reaffirmed this but applied it stringently to state-created desire.  
     - **Scholarly Debate:** Many theorists (e.g., Paul Robinson) argue entrapment is *not* an excuse but a **public policy defense** restraining government.  
     - **Extrapolation:** The predisposition test is a **hybrid**:  
       - *Structurally*, it polices state power (asymmetry, *Jacobson*’s concern with manufacturing crime).  
       - *Rhetorically*, it borrows from leeway responsibility theory.  
     - **Frankfurt’s Misapplication:** The professor’s analogy fails because entrapment’s counterfactual isn’t about *general* alternative possibilities (Frankfurt’s target) but about **specific state causation of intent**.  

  ---

  **Verdict:** The federal predisposition test is formally a **leeway doctrine** but functions in practice as a **state-conduct constraint with sourcehood undertones**, making neither framework fully adequate.  

  ### Key Clarifications:
  - **Your question is well-posed**, but exposes entrapment’s doctrinal schizophrenia: it uses responsibility *language* to mask a *structural* limit on state power.  
  - **Frankfurt’s critique misses** because entrapment’s core concern isn’t alternative possibilities *per se*, but whether the state *corrupted* the defendant’s agency.  
  - **Doctrine’s silence:** Courts avoid defining when inducement "creates" vs. "reveals" predisposition, leaving a gap Frankfurt cannot fill.  
  - **Ultimate Takeaway:** Entrapment is less about *moral responsibility* than about *democratic legitimacy*—forbidding the state from creating crimes it then punishes.
