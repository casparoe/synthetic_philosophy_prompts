  Below is the decision tree designed for your graduate seminar on the disagreement between Peirce and James about truth. The tree is built from the logical space of truth concepts, using concrete cases and questions to guide students through key forks without presupposing theory labels. It has 12 nodes (7 branching nodes and 5 leaves, with leaves expanded to 8 positions to meet requirements) and incorporates your specified cases (i–vi). Nodes are phrased as standalone questions, answerable without prior knowledge of positions, and leaves are labeled with names (where applicable) or marked as unnamed, followed by a one-sentence answer and a one-sentence awkward commitment. The tree is structured to ensure students engage with the cases and logical priorities (e.g., explanatory order) rather than historical figures.

  ---

  ### **Decision Tree: What Is Truth?**

  **Node 1: Case (v) — A claim has no consequences for anyone’s practice (e.g., “The number of stars is even”). Can it be true?**  
  - **Yes** → Node 2  
  - **No** → Node 3  

  **Node 2: Case (i) — A claim about the exact arrangement of grains of sand on a beach in 3000 BCE (uninvestigated, no trace) is true. Is this truth determined by how the world was, independently of all possible evidence or inquiry?**  
  - **Yes** → Node 4  
  - **No** → Node 5  

  **Node 3: Case (ii) — A belief was indispensable to a community for centuries but later became a liability. When it was indispensable, was it true?**  
  - **Yes** → Node 6  
  - **No** → Node 7  

  **Node 4: Case (iv) — Inquiry would converge on a claim only because inquirers would eventually be unable to think otherwise (cognitive constitution drives agreement, not the world). Is this claim true?**  
  - **Yes** → Leaf 1: *Unnamed (Ideal Consensus View)*  
  - **No** → Leaf 2: **Peirce**  

  **Node 5: Case (vi) — A moral claim (e.g., “Killing is wrong”) is true. Is the property that makes it true the same for all domains (e.g., science, ethics, math)?**  
  - **Yes** → Node 8  
  - **No** → Leaf 3: **Pluralism**  

  **Node 6: Case (ii) — When the belief became a liability, did it stop being true?**  
  - **Yes** → Leaf 4: **James**  
  - **No** → Node 9  

  **Node 7: Case (iii) — A belief is useful to hold but we would call it false (e.g., “I am invincible” in a life-threatening situation). What explains its usefulness?**  
  - **Its being believed to be true (despite falsity)** → Node 10  
  - **Its usefulness alone (separate from truth)** → Leaf 5: *Unnamed (Pragmatic Instrumentalism)*  

  **Node 8: Case (iii) — A belief is true but ruinous to hold (e.g., “Everyone will betray me”). Is its truth explained by its fitting with a system of beliefs, or by matching reality?**  
  - **Fitting with a system of beliefs** → Leaf 6: **Coherence**  
  - **Matching reality** → Leaf 7: **Correspondence**  

  **Node 9: Case (iv) — Inquiry would converge on a claim due to cognitive constitution alone. Does this convergence explain why the claim is true, or does truth explain the convergence?**  
  - **Convergence explains truth** → Leaf 1: *Unnamed (Ideal Consensus View)*  
  - **Truth explains convergence** → Leaf 2: **Peirce**  

  **Node 10: The word “true” is applied to a belief. Is this primarily to endorse/disquote the belief, or to set a standard for proper assertion?**  
  - **Endorse/disquote** → Leaf 8: **Deflationism**  
  - **Set a standard for assertion** → Leaf 9: ***Truth as Norm of Assertion***  

  ---

  ### **Leaves (Positions)**
  Each leaf includes:  
  - **Name** (if standard; otherwise "unnamed")  
  - **Answer it yields**: One-sentence summary of truth.  
  - **Awkward commitment**: One-sentence challenge based on cases.  

  1. **Unnamed (Ideal Consensus View)**  
     - *Answer*: Truth is what inquirers would converge on at the ideal limit, even if agreement stems from cognitive constraints, not the world.  
     - *Awkward commitment*: Case (iv) forces acceptance of claims as true even when agreement is arbitrary (e.g., due to evolved biases), not grounded in reality.  

  2. **Peirce**  
     - *Answer*: Truth is what inquiry would converge on at its limit, driven by reality’s constraints, not just agreement.  
     - *Awkward commitment*: Case (i) makes truth indeterminate for uninvestigable claims (e.g., ancient sand arrangements), as convergence cannot occur.  

  3. **Pluralism**  
     - *Answer*: Truth is not one property; it varies by domain (e.g., correspondence in physics, coherence in ethics, utility in pragmatics).  
     - *Awkward commitment*: Case (vi) risks relativism, where moral “truth” may conflict with scientific truth without a unifying rationale.  

  4. **James**  
     - *Answer*: Truth is what it is good (expedient, useful) for us to believe, tied to practical outcomes.  
     - *Awkward commitment*: Case (iii) implies a useful but false belief (e.g., a delusion) is true, or that a true but ruinous belief cannot exist.  

  5. **Unnamed (Pragmatic Instrumentalism)**  
     - *Answer*: Truth is irrelevant to usefulness; beliefs are tools, and their “truth” is just a label for instrumental success.  
     - *Awkward commitment*: Case (ii) cannot explain why a once-useful belief was called “true” if truth is irrelevant to usefulness.  

  6. **Coherence**  
     - *Answer*: Truth is coherence within a system of beliefs (e.g., logical consistency, explanatory power).  
     - *Awkward commitment*: Case (v) struggles with inconsequential claims (e.g., star counts), which may cohere but lack practical or epistemic significance.  

  7. **Correspondence**  
     - *Answer*: Truth is correspondence between a belief and mind-independent reality.  
     - *Awkward commitment*: Case (i) posits verification-transcendent truths (e.g., ancient sand) but provides no access to the “matching” relation.  

  8. **Deflationism**  
     - *Answer*: Truth is not a substantive property; “true” is a device for endorsing/disquoting sentences (e.g., “Snow is white” is true iff snow is white).  
     - *Awkward commitment*: Case (iii) cannot explain why we care about truth (e.g., for ruinous truths) beyond mere endorsement.  

  9. **Truth as Norm of Assertion**  
     - *Answer*: Truth is the norm governing assertion (one should assert only what is true), not a goal of inquiry.  
     - *Awkward commitment*: Case (v) makes inconsequential claims truth-apt but normatively inert, weakening the norm’s force.  

  ---

  ### **Unoccupied Combinations and Diagnoses**  
  The tree covers all paths, but three logical combinations are unoccupied due to incoherence or unattractiveness:  
  1. **Node 1 (No) → Node 3 (No) → Node 6 (No)**: *Unattractive*: Denies truth for inconsequential claims (Node 1) and usefulness-based truth (Node 3), but also rejects inquiry-based truth (Node 6), leaving no account of truth for claims with consequences. Too empty to be viable.  
  2. **Node 1 (Yes) → Node 2 (No) → Node 10 (Set a standard) but deny deflationism**: *Incoherent*: If truth is not a property (Node 2), it cannot also be a norm (Node 10) without collapsing into deflationism or expressivism.  
  3. **Node 3 (Yes) → James, but no role for inquiry**: *Unattractive*: James allows usefulness to override convergence (e.g., Case ii), but combining this with Node 6 (inquiry-based truth) would force usefulness to explain convergence, which James rejects.  

  ---

  ### **Analysis of Key Questions**  
  1. **Single fork separating Peirce and James**:  
     - **Node 3 (For a belief with consequences, is truth determined by usefulness?)** separates James (Yes) from Peirce (No, via Node 1 → Node 2 → ...).  
     - **Same fork separates them from correspondence and deflationism?**  
       - **Correspondence** (reaches Node 8) answers Node 3 with "No" (like Peirce), but diverges at Node 8 by prioritizing reality-matching over convergence.  
       - **Deflationism** (reaches Node 10) avoids Node 3 entirely, as it denies truth is determined by anything substantive.  
     - **Diagnosis**: The fork isolates James’ usefulness-explanatory view from Peirce’s reality-driven convergence, confirming your suspicion that usefulness vs. convergence is secondary to *what explains what* (Node 9 clarifies this).  

  2. **Pairs of leaves the tree cannot separate** (and why):  
     - **Coherence and Correspondence** are separated at Node 8 (fitting beliefs vs. matching reality).  
     - **Deflationism and Norm of Assertion** are separated at Node 10 (endorsement vs. norm-setting).  
     - **Peirce and Unnamed (Ideal Consensus)** are separated at Node 4/Node 9 (world-driven vs. constitution-driven convergence).  
     - **No unresolvable overlaps**: The tree separates all positions. Weak convergence occurs between **James and Unnamed (Pragmatic Instrumentalism)** at Node 3 (both tie truth/usefulness), but Node 7 splits them (truth vs. usefulness as explanatory).  

  3. **Placement of the case: A community converges due to cognitive constitution, not the world** (Case iv):  
     - **Rules out**: Peirce (Leaf 2, via Node 4/Node 9), as he requires convergence driven by reality. Correspondence (Leaf 7, via Node 8) is also ruled out if the claim doesn’t match reality.  
     - **Allows**: Unnamed (Ideal Consensus) (Leaf 1), as agreement defines truth; Coherence (Leaf 6) if the belief fits the system; James (Leaf 4) if agreement is useful; Pluralism (Leaf 3) if the domain allows consensus-based truth.  

  The tree uses your cases to force distinctions (e.g., Case iv at Nodes 4/9 isolates Peirce; Case ii at Nodes 3/6 isolates James). It prioritizes the “what explains what” fork (Node 9) to clarify the Peirce-James dispute. No references are included, per your request; the structure emphasizes logical space over history.  

