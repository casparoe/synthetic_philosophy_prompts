prompt: |-
  hey, so i'm in this normative ethics course and we've just spent two weeks on supererogation, acts that go beyond the call of duty, and now i have to write a "spec" paper — basically, before i'm allowed to evaluate any particular theory i have to first say what a theory of supererogation would actually have to deliver. can you act as someone who works on this professionally and just lay the desiderata out for me? think carefully about which of the things people demand of such a theory are real requirements and which are just habits of one camp.

  start by brainstorming the landscape for yourself (the deontic categories, the stock examples, the usual objections), then give me the requirements list, each with the case or consideration that motivates it. things i definitely want covered:

  - the basic deontic map it has to get right: how it carves up obligatory / permissible / forbidden / beyond-the-call, and why "beyond the call" can't just be folded into "permissible" or "good to do".
  - the optionality bit: if i don't do a supererogatory act i'm not blameworthy, but if i do it i am praiseworthy. spell out why that asymmetry is a requirement and not just a quirk of how we talk.
  - our prof's weird example: a billionaire writes a cheque that saves a village at basically zero cost to himself. is that supererogatory if it costs him nothing? what does a theory owe us about sacrifice vs no-sacrifice?
  - role-relative baselines: the exact same rescue is obligatory for the on-duty lifeguard but supererogatory for the sunbather watching. a theory has to say what fixes the baseline of duty — one universal baseline, or does it shift with role, and if it shifts how do you stop "beyond duty" from just meaning "beyond what's expected of you".
  - the mirror-image category our TA kept mentioning: acts that are kind of bad to do (like being a bit cold to a friend) but that nobody thinks are forbidden. does a theory of supererogation have to account for these too, or is that a separate job?
  - motive: someone does a hugely beneficial thing purely to get praised for it. does it still count? does the theory owe us a story about the agent's reasons or only about the act?
  - the demandingness / baseline problem: if morality is very demanding there's less room left for supererogation, so the theory seems to need a view on how demanding morality is — flag it if that makes the whole thing circular.
  - and it should let the anti-supererogationist line ("there just are no acts beyond duty") come out as a substantive thesis rather than a self-contradiction.

  the part i care about most: which of these can't be held together. if some pair or triple is jointly unsatisfiable, say so, say which one you'd give up and why — that's the actual paper. also tell me which single requirement does the most work in excluding bad theories.

  don't bother scoring kantianism / utilitarianism / virtue ethics against the list, i'll do that in class.

  finish with one line, \answer{...}, containing just the requirement you think does the most exclusionary work, in a few words.
reasoning: |-
  Okay, the user is taking a normative ethics course and needs to write a "spec" paper on supererogation. They want me to act as a professional in the field and lay out the desiderata for a theory of supererogation. The query is detailed, showing they've engaged with the material and have specific points to cover. 

  First, I need to understand what supererogation entails. Supererogatory acts are those that go beyond duty—like heroic rescues or significant charity—where not doing them isn't blameworthy, but doing them is praiseworthy. The user wants a clear list of requirements for any theory of supererogation, along with motivations for each, and to identify conflicts between them. 

  The user mentioned several key areas: the deontic map, optionality, sacrifice (using the billionaire example), role-relative baselines, the "suberogatory" category (acts that are slightly bad but not forbidden), motive, demandingness, and allowing for the possibility that supererogation doesn't exist. 

  Starting with the deontic map: any theory must distinguish obligatory, permissible, forbidden, and supererogatory acts. Merging supererogation into "permissible" or "good" would miss the key feature that these acts are optional yet praiseworthy. The optionality requirement is crucial because it captures the asymmetry—no blame for omission, praise for commission. This is central to supererogation.

  The billionaire example raises the issue of sacrifice. If an act costs the agent nothing, is it still supererogatory? A theory needs to address whether cost is essential. Sacrifice might be a typical feature but not necessary; what matters is that the act isn't required. The billionaire's donation could still be supererogatory because it's not obligatory, even without sacrifice. 

  Role-relative baselines highlight that duties depend on roles. A lifeguard must attempt a rescue, but a bystander isn't obligated. The theory must explain how baselines shift without reducing "beyond duty" to merely exceeding expectations. This might involve relational duties or institutional roles. 

  The "suberogatory" category—minor wrongs that aren't forbidden—might be separate. While it's part of deontic logic, a supererogation theory might not need to account for it directly. Still, a comprehensive theory should be consistent with such categories. 

  Motive matters. If someone acts for praise, does it still count as supererogatory? The user wants to know if the theory focuses on the act or the agent's reasons. I think both act and motive are relevant; the act must be beneficial and optional, but praiseworthiness might depend on motive. However, a minimal theory could separate the act's status from the agent's praiseworthiness. 

  Demandingness is tricky. If morality is too demanding, there's no room for supererogation. The theory must avoid circularity by not defining duties in a way that precludes supererogation. It should allow for a plausible baseline of duty. 

  Allowing anti-supererogationism as substantive means the theory shouldn't build in supererogation as necessary. It should make "no supererogation" a coherent position, like in utilitarianism where optimizing is obligatory. 

  Now, conflicts: Sacrifice vs. Billionaire poses a problem. If sacrifice is required, the billionaire's act isn't supererogatory, but that seems counterintuitive. I'd drop sacrifice as necessary because many paradigmatic cases don't involve significant cost. 

  Optionality vs. Motive: If we require praiseworthiness, which depends on motive, then an act done for bad motives might not be supererogatory. But if supererogation is about the act's status, motive shouldn't matter. Resolving this might involve distinguishing the act's classification from the agent's praiseworthiness. 

  Role-Relativity vs. Universal Baseline: If duties are role-relative, how do we define a universal baseline? The theory must avoid making "beyond duty" purely subjective. Institutional roles can provide objective baselines. 

  The most exclusionary requirement is Optionality. Without the asymmetry (no blame, but praise), supererogation collapses into mere permissibility. This requirement filters out theories like simple deontology or utilitarianism that don't allow for such a category. 

  The user's deeper need is to identify tensions between desiderata to structure their paper. They want to know which requirement is most critical and where conflicts arise. Highlighting the sacrifice conflict and optionality's centrality will help them focus their argument.
answer: |-
  Here’s a systematic breakdown of desiderata for a theory of supererogation, structured as requested. I’ve distilled core requirements, their motivations, tensions, and the key exclusionary tool.

  ---

  ### **I. Brainstorming the Landscape**
  - **Deontic Categories**: Obligatory (must do), Permissible (may do/not do), Forbidden (must not do), **Supererogatory** (may omit without blame, praiseworthy to do).  
  - **Stock Examples**:  
    - *Heroic*: Jumping on a grenade to save others.  
    - *Beneficent*: Donating a kidney to a stranger.  
    - *Everyday*: Staying late to help a struggling colleague.  
  - **Usual Objections**:  
    - *Redundancy*: "Good but not required" collapses into permissibility (Urmson/Chisholm debate).  
    - *Demandingness*: If morality requires maximization (e.g., utilitarianism), no room for "beyond duty."  
    - *Motivational Purity*: Does self-interest invalidate supererogation?  

  ---

  ### **II. Core Desiderata for a Theory of Supererogation**  
  1. **Deontic Integrity**  
     - *Requirement*: Must distinguish supererogation from mere permissibility (good but optional) and obligation.  
     - *Motivation*: Supererogation implies **moral significance** beyond neutral permissibility (e.g., donating $1 vs. $1M). Folding it into "permissible" erases praiseworthiness.  
     - *Test Case*: Not donating to charity is permissible; donating life savings is supererogatory.  

  2. **Asymmetric Optionality**  
     - *Requirement*: Omission → no blame; commission → praiseworthiness.  
     - *Motivation*: Without this, supererogation loses its **action-guiding force**. We criticize theories that blame non-heroes (e.g., overly demanding utilitarianism).  
     - *Non-negotiable*: This asymmetry defines supererogation conceptually.  

  3. **Sacrifice-Agnosticism**  
     - *Requirement*: Must accommodate supererogation *without* significant cost.  
     - *Motivation*: **Billionaire case**—writing a lifesaving cheque at zero cost is still beyond duty (morally optional but outstanding). Sacrifice is typical but not necessary; the focus is on **non-required beneficence**.  
     - *What Theory Owes*: Clarify that cost affects *degree* of praiseworthiness, not the act’s supererogatory status.  

  4. **Role-Relative Baselines**  
     - *Requirement*: Baselines of duty must shift with social roles (lifeguard vs. sunbather).  
     - *Motivation*: Identical acts have different deontic statuses based on **contextual obligations**.  
     - *Avoiding Collapse*: "Duty" is fixed by **objective roles/norms**, not subjective expectations. A theory must specify which roles are morally relevant (e.g., professional duties vs. moral minimums).  

  5. **Suberogatory Compatibility**  
     - *Requirement*: Need *not* directly explain "suberogatory" acts (minor wrongs not forbidden, e.g., mild rudeness).  
     - *Motivation*: Suberogation is a **mirror category** but distinct. A supererogation theory must avoid contradicting it but needn’t derive it.  
     - *Separation*: Supererogation = "good beyond duty"; suberogation = "bad but not forbidden." Separate mapping tasks.  

  6. **Motive-Independence of Act Status**  
     - *Requirement*: An act’s supererogatory *status* depends on objective features (benefit, non-requirement), not motive.  
     - *Motivation*: A billionaire donating for praise still saves lives **beyond duty**. Motive affects *praiseworthiness of agent*, not the act’s classification.  
     - *What Theory Owes*: Distinguish act-assessment from agent-assessment.  

  7. **Non-Circular Demandingness**  
     - *Requirement*: Must not presuppose a specific demandingness level to "make room" for supererogation.  
     - *Motivation*: Else theory is question-begging (e.g., "duties are minimal so supererogation exists").  
     - *Solution*: Define duty independently (e.g., via contractualism or prima facie duties) so supererogation emerges *as a possibility*.  

  8. **Anti-Supererogationist Compatibility**  
     - *Requirement*: Must allow "no supererogation" as a coherent substantive position (e.g., utilitarianism: "optimizing is obligatory").  
     - *Motivation*: Otherwise, the theory defines rivals out of existence. Supererogation must be a **contingent feature** of morality.  

  ---

  ### **III. Tensions & Trade-offs**  
  - **Sacrifice vs. Billionaire**: If sacrifice is *necessary*, the billionaire’s act isn’t supererogatory (counterintuitive). If *irrelevant*, heroic sacrifice loses special status.  
    - *Resolution*: Drop sacrifice as a *requirement* (use **beneficence beyond duty** instead). Sacrifice amplifies praiseworthiness but isn’t essential.  
  - **Optionality vs. Motive**: If praiseworthiness requires good motives, but supererogatory acts can be done for bad reasons, tension arises.  
    - *Resolution*: Decouple act-status (objective) from agent-praiseworthiness (motive-sensitive).  
  - **Role-Relativity vs. Universal Baseline**: If duties are hyper-contextual, "beyond duty" becomes subjective.  
    - *Resolution*: Anchor roles in **morally significant institutions** (e.g., lifeguard contracts) to avoid arbitrariness.  

  **Most Critical Trade-off**: **Asymmetric Optionality vs. Anti-Supererogationism**.  
  - Utilitarians reject asymmetric optionality (omitting optimization *is* blameworthy).  
  - *To preserve optionality*, you must deny that morality is maximally demanding—but this can’t be baked into the definition (Desideratum 7).  

  ---

  ### **IV. The Most Exclusionary Requirement**  
  **Asymmetric Optionality** does the heaviest lifting. It immediately excludes:  
  - Theories where all good acts are obligatory (e.g., act-utilitarianism).  
  - Theories where omitting good acts is blameworthy (e.g., radical care ethics).  
  - Theories collapsing supererogation into "permissible but not praiseworthy" (e.g., minimal deontology).  

  Without this asymmetry, supererogation dissolves into permissibility or obligation—losing its core ethical meaning.

  \answer{Asymmetric Optionality}
