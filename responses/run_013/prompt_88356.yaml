prompt: |-
  I'm in a statutory interpretation seminar and I'm supposed to write a short paper on whether textualism and purposivism are actually different theories or just the same theory with different rhetorical dressing, and every example I keep reaching for is one of the warhorses everyone already knows, so I want a fresh case built to order instead. Please invent a realistic but fictional statute — don't use a real one, don't cite real cases or tell me what any actual court did, I can't look anything up and I don't want you guessing at holdings — and then engineer a fact pattern under it where a committed textualist and a committed purposivist reach opposite verdicts. Here's the hard part, and it's the whole point: I don't want the easy version where the drafters made an obvious slip, because there everyone agrees the text is just wrong and the purpose wins and the case proves nothing. I want the opposite setup. The enacting legislature actually meant what it wrote — the people who voted for it, if you asked them, would say the literal result is exactly what they were after — and yet a serious purposivist still has to come out the other way, on the ground that the statute's object or function as it operates now points somewhere else. So actual intent lines up with the plain text, and purpose does not. And the purposivist can't weasel out of it through the usual escape hatches: no scrivener's error, no absurdity canon, and the result has to be a real but tolerable policy loss, not something that makes the statute collapse entirely or get somebody killed. The words also have to be genuinely unambiguous on their face — if there's any vagueness or ambiguity to resolve, the textualist just resolves it by consulting purpose and the whole thing falls apart. Same for fair notice or due process escapes.

  Keep the setting boring and plausible — a state licensing scheme, a municipal ordinance, a tax credit, a public records rule, something like that. Not a constitutional provision, not an emergency, not a war. One short paragraph for the scenario, then the analysis.

  After the scenario, give me the statutory language and the facts, then walk through what each theory says and why, step by step, so I can see the verdicts coming out of the theories rather than you just announcing them. Then tell me which single feature of the case is doing the work — my hunch is it'll be the level of generality the purposivist picks when they state the statute's purpose, but if it's something else, say so and say why — and what happens if you take that feature away: does the case collapse back into the boring version where the two theories agree? Then the part I actually care about: how would a sharp purposivist attack the case? What's their best move, and does it work, or does it just show that purposivism needs the text more than it admits? And flip it — what's the textualist's best defense of the literal reading besides "the words say so"?
reasoning: |-
  Okay, let me tackle this user's request. They're in a statutory interpretation seminar and need a fresh case where textualism and purposivism diverge without relying on common examples. The key challenge is creating a scenario where the legislature intended the literal text, but purposivism still leads to a different outcome. 

  First, I need to invent a plausible statute. A tax credit for "solar energy collectors" seems ideal—it's technical enough for ambiguity but mundane enough to avoid drama. The trick is defining "solar energy collectors" narrowly while making solar thermal panels functionally similar to PV panels. That sets up the conflict: text favors PV only, but purpose could include both.

  For the fact pattern, a taxpayer installing thermal panels claims the credit. Textualists would deny it since thermal panels don't convert light to electricity. Purposivists might argue both technologies serve the same environmental purpose. Crucially, the legislature must have deliberately excluded thermal tech—no drafting error here. 

  The critical feature is the purposivist's choice of abstraction level. If they frame the purpose broadly ("reduce carbon emissions"), thermal panels qualify. If narrowly ("promote PV adoption"), they don. Remove this tension—say, if the statute mentioned both—and the theories align.

  Now, the user's deeper needs: they want to see theories clash cleanly, not just rhetorical differences. So I'll preempt escapes like absurdity or vagueness. The statute must be unambiguous, the policy loss tolerable (less adoption, not catastrophe). 

  For the analysis, I'll walk through each theory's reasoning step-by-step. Textualist: plain meaning of "convert light to electricity." Purposivist: broader statutory context shows environmental goals. Then explore how a sharp purposivist might counter by emphasizing legislative intent records, but that fails here because records support exclusion. Textualist's defense? "Collectors" implies electricity-focused tech. 

  Finally, highlight the abstraction-level hinge. Without it—if purpose were explicit—the divergence vanishes. That reveals purposivism's vulnerability: purpose can be stretched, while textualism stays anchored. But textualism risks ignoring functional realities. Both theories show their limits here.
answer: |-
  Here's a self-contained scenario designed to force the theoretical divergence you're seeking, with the intent-text alignment you specified:

  **Scenario:** The State of Columbia enacted the "Green Energy Infrastructure Tax Credit Act" (GEITCA) to incentivize residential adoption of specific solar technologies. The relevant section provides: "A taxpayer who installs a **solar energy collector** on the primary dwelling unit shall receive a tax credit equal to 30% of the cost of the collector and its installation. For purposes of this section, 'solar energy collector' means a device specifically designed to convert **incident solar radiation directly into electricity**." (Emphasis added). The legislative history shows extensive debate. Proponents of photovoltaic (PV) panels pushed for a narrow definition to maximize the credit's impact on the fastest-growing, most efficient technology. Advocates for solar thermal systems (which heat water/fluid using sunlight) argued for inclusion but were explicitly voted down in committee and on the floor. The final bill text reflects this intentional exclusion of thermal tech.

  **Facts:** Alex Rivera installed a high-efficiency "evacuated tube solar thermal collector" system on their home. This system uses sunlight to heat water for domestic use and space heating, significantly reducing natural gas consumption. It does *not* generate electricity. Rivera claims the GEITCA tax credit, arguing the system is a "solar energy collector" and serves the Act's overarching goal of reducing fossil fuel dependence. The State Department of Revenue denies the credit, citing the statutory definition requiring conversion to electricity. Rivera sues.

  **Analysis:**

  1.  **Textualist Approach:**
      *   **Step 1: Identify the Operative Text:** The key phrase is the definition: "'solar energy collector' means a device specifically designed to convert incident solar radiation **directly into electricity**."
      *   **Step 2: Apply Plain Meaning:** The text is unambiguous. "Convert... into electricity" requires the device's primary function to be generating electrical current from sunlight. PV panels do this. Solar thermal collectors convert sunlight into heat (thermal energy), not electricity.
      *   **Step 3: Examine Context:** The phrase "specifically designed to" reinforces that the device's *intended purpose* must be electricity generation. The broader term "solar energy collector" in the credit-granting clause is explicitly defined and constrained by this specific definition.
      *   **Step 4: Avoid Importing External Purpose:** The legislative history confirms the exclusion was intentional. While Rivera's system reduces fossil fuel use, the text does not create a credit for *any* fossil-fuel-reducing solar tech; it creates one *only* for devices meeting this specific, narrow definition. The text controls.
      *   **Verdict:** Credit denied. The thermal collector does not convert sunlight "directly into electricity."

  2.  **Purposivist Approach:**
      *   **Step 1: Identify the Statute's Overall Purpose:** Looking beyond the specific clause to the Act's title, preamble ("to promote the adoption of renewable energy technologies reducing reliance on fossil fuels"), and legislative findings ("residential solar energy adoption is critical for achieving state carbon reduction goals"), the clear overarching purpose is to **reduce residential fossil fuel consumption and associated carbon emissions by incentivizing the adoption of on-site solar technologies**.
      *   **Step 2: Assess How the Device Serves the Purpose:** Rivera's solar thermal system demonstrably achieves this core purpose. It directly displaces natural gas for water and space heating, reducing fossil fuel use and emissions just as effectively (or potentially more effectively in certain contexts) as a PV system displacing grid electricity.
      *   **Step 3: Reconcile Text with Purpose:** The textual definition ("convert into electricity") appears underinclusive relative to the statute's broader purpose. While the legislature *intended* to exclude thermal tech at the time of enactment (as history shows), the *functional purpose* of the statute – reducing fossil fuel use via residential solar – is equally served by Rivera's system. Applying the literal text frustrates the statute's operational goal in this specific instance without serving any discernible *current* policy rationale within the Act's framework (e.g., grid stability concerns specific to electricity aren't mentioned).
      *   **Step 4: Interpret to Best Achieve Purpose:** Giving effect to the statute's fundamental purpose requires interpreting "solar energy collector" functionally to include devices that directly harness solar energy to displace fossil fuels in residential applications, irrespective of the specific energy form (electricity or heat) produced, as both achieve the identical environmental and energy security outcome.
      *   **Verdict:** Credit granted. Excluding this effective fossil-fuel-displacing technology contradicts the statute's raison d'être.

  **The Single Feature Doing the Work: The Level of Generality in Stating the Statute's Purpose.**

  *   **Why it's Crucial:** The textualist focuses on the *specific, enacted purpose* embedded in the precise definition chosen by the legislature: incentivize PV electricity generation. The purposivist focuses on the *broader, functional purpose* discerned from the Act's overall structure and goals: reduce fossil fuel use via residential solar tech. The conflict arises because the legislature *intentionally* selected a specific means (PV electricity) to achieve a broader end (fossil fuel reduction/carbon goals), but the purposivist prioritizes the end over the legislatively chosen means.
  *   **What Happens if Removed?** If the statute had *only* the broad purpose ("incentivize solar tech to reduce fossil fuels") *or* *only* the specific definition without context, the theories might converge. If the statute *explicitly* stated "only devices generating electricity qualify, even if others reduce fossil fuels," the purposivist would be blocked. The tension exists precisely because the legislature expressed both a broad goal *and* a specific, limiting definition achieving only a subset of that goal, while the purposivist elevates the broad goal above the specific limitation.

  **The Sharp Purposivist's Attack & Its Limits:**

  *   **Best Move:** Argue that the specific definition ("convert into electricity") is merely *evidentiary* of purpose, not *constitutive*. The *real* purpose, gleaned from the Act's title, findings, and context, is fossil fuel reduction. The exclusion of thermal was a *policy mistake* or based on outdated assumptions (e.g., about thermal efficiency) within the broader goal, not a rejection of the goal itself. The court should interpret the definition in light of the paramount purpose, effectively reading "electricity" as a placeholder for "usable energy displacing fossil fuels."
  *   **Does it Work?** It *could* persuade a purposivist judge, but it faces significant hurdles:
      1.  **Textual Anchor:** It requires stretching the crystal-clear words "convert incident solar radiation directly into electricity" beyond recognition. This strains the principle that purpose is derived *from* the text, not imposed upon it.
      2.  **Intent Undercuts It:** The legislative history explicitly shows the exclusion was deliberate and based on a considered policy choice favoring one technology over the other *within* the broader goal, not a mistake about the goal. This makes it hard to characterize the definition as merely evidentiary.
      3.  **Risk of Judicial Override:** This approach essentially allows the judge to override a clear, intentional legislative choice about *how* to achieve the broad purpose because the judge disagrees with the limitation. It demonstrates purposivism's potential to undermine legislative supremacy by prioritizing an abstracted purpose over concrete textual choices.

  **The Textualist's Best Defense (Beyond "Words Say So"):**

  *   **Best Move:** Argue **legislative prerogative in choosing the means**. The legislature has the constitutional authority not just to set goals (reduce fossil fuels) but also to choose *specific policy instruments* to achieve them (subsidize PV only). The clear text reflects a deliberate choice to use the tax code to steer adoption towards *one specific technology* that generates electricity, possibly for reasons beyond mere CO2 reduction (e.g., grid decentralization, promoting a specific industry, ease of metering, compatibility with net metering laws). Respecting this choice, even if it seems suboptimal to a judge regarding the *broad* goal, is fundamental to democratic accountability and separation of powers. The text *is* the embodiment of the legislature's chosen purpose and means.
  *   **Why it's Strong:** It acknowledges a broader context (legislative power) without importing substantive policy goals to override the text. It accepts that legislatures can enact underinclusive solutions and that courts must respect those choices when clearly expressed. It highlights that the "purpose" of a statute isn't monolithic; it includes the specific compromises and limitations deliberately written into the law.

  **Conclusion:** This scenario forces a clean split because the legislature achieved a specific, intended policy outcome (promoting PV only) through unambiguous text, while the statute's broader functional goal (reducing fossil fuel use via solar) is equally served by an excluded technology. The divergence hinges entirely on whether interpretation prioritizes the *enacted textual choice of means* (Textualism) or the *abstracted functional end* (Purposivism). The purposivist attack requires minimizing the significance of the clear text and specific intent, revealing a tension within purposivism regarding its fidelity to the enacted law. The textualist defense successfully invokes core constitutional principles of legislative authority to justify adhering to the literal words, even when they seem narrowly tailored. This case illustrates that the theories are fundamentally distinct in their core commitments: text as law vs. purpose as the animating spirit, potentially overriding textual specifics.
