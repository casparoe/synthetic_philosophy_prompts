  For (b), the omissive ("p & ~Bp") and commissive ("p & B~p") variants likely share a mechanism (~75%) - both involve asserting p while the belief component clashes with sincerity conditions. The commissive may add a contradiction layer, but the core absurdity feels similar.

  Regarding (c), the first-person present restriction seems essential (~85%). Shifting to third-person ("John believes p is false but p is true") loses absurdity because we're no longer expressing the speaker's current cognitive dissonance. This suggests the paradox relies on self-ascription.

