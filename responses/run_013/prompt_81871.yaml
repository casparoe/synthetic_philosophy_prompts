  First, they're framing it as interpretation (what the text means) vs. construction (filling gaps). The majority used ACA's overall structure to justify including federal exchanges—that's construction. The dissent stuck to "established by the State" as unambiguous—pure interpretation. But even the dissent's "plain meaning" assumes context, like ignoring that "State" often includes federal actors in statutory schemes. 

  Second, testing theories: The majority isn't classic purposivism; it's "whole-text contextualism" masquerading as textualism. Scalia’s dissent claims textual purity but smuggles in federalism values by treating "State" as exclusively local. Both sides reveal that "plain meaning" is a mirage—it always depends on unstated premises. 

  Third, the user’s real interest is whether this exposes textualism/purposivism as a power struggle (courts vs. Congress) rather than a reading methodology. The three-level model helps: (1) "established by the State" semantically points only to states; (2) but Congress likely intended federal exchanges to count; (3) Roberts prioritized the ACA’s survival (level 3). The key tension: if legislative intent is text-bound (level 1 = level 2), then jumping to level 3 is judicial overreach. Unless... purpose is *inferred* from text, which is what Roberts tried (awkwardly). 

  Verdict: The case makes textualism look brittle (ignoring systemic collapse) and purposivism slippery (overwriting text). But really, it shows both theories are incomplete without context. The "anomaly" is statutes with doomsday clauses—where literal reading self-destructs the law. Neither theory cleanly handles that. Maybe the debate misframes the question: it’s not "text vs. purpose" but "how much context counts as text?" 

  User’s depth suggests they’re a law student or scholar. Their frustration with "standard recaps" hints they’ve heard superficial takes before. They’ll appreciate the "smuggling" point—that textualists aren’t neutral. And they’ll love the three-level model critique because it exposes textualism’s blind spot: when Congress’s oversight creates absurdity, must courts enable it? 

  ...Time to argue that the case actually reveals a meta-theory: statutory interpretation is always coalition management. Roberts saved the ACA to preserve institutional legitimacy, while Scalia defended textualism to constrain judicial power. The theories are tools for deeper governance conflicts.
answer: |-
  Here's a deep analysis of *King v. Burwell* through the lenses of textualism, purposivism, interpretation vs. construction, and broader jurisprudential tensions:

  ### I. Interpretation vs. Construction: Mapping the Moves
  **Majority (Roberts):**  
  - **Interpretation:** Acknowledges the literal meaning of "Exchange established by the State" but argues the phrase is ambiguous *in context* (e.g., multiple definitions of "State" in the ACA, use of "such Exchange" elsewhere).  
  - **Construction:**  
    - **Contextual Holism:** Reads the phrase alongside the ACA's "three-legged stool" structure (guaranteed issue, community rating, subsidies) to infer that denying subsidies in federal exchanges would destabilize the entire scheme.  
    - **Consequentialism:** Explicitly weighs the "calamitous result" (insurance market death spirals) as evidence that Congress couldn’t have intended that outcome.  
    - **Purpose-Driven Gap-Filling:** Treats the literal reading as a "drafting error" and constructs a rule including federal exchanges to preserve the ACA’s "core purpose."  

  **Dissent (Scalia):**  
  - **Interpretation:** Insists "established by the State" has a "plain meaning" (only state-run exchanges) and is unambiguous. Rejects contextual arguments as irrelevant when text is clear.  
  - **Construction:**  
    - **Literal Enforcement:** Constructs a rule that adheres strictly to semantic meaning, regardless of consequences.  
    - **Anti-Purposivism:** Asserts that "the duty of this Court is to apply the law as written," even if it leads to dysfunction. Rejects the majority’s "somersaults of statutory interpretation."  

  ### II. Testing the Theories  
  **Majority’s Approach:**  
  - **Purposivism or Contextual Textualism?** It’s a hybrid:  
    - *Purposivist Elements:* Prioritizes the ACA’s overarching goal (universal coverage) over literal text.  
    - *Textualist Elements:* Grounds its reasoning in statutory structure (e.g., noting other provisions where "State" includes federal exchanges).  
    - **Verdict:** "Whole-text contextualism" with strong purposive influence. It invokes purpose to resolve perceived ambiguity but frames it as textual analysis.  

  **Dissent’s Approach:**  
  - **Pure Textualism?** Not quite:  
    - Ignores contextual clues (e.g., the ACA’s definition of "Exchange" as a generic entity, not specifying state/federal).  
    - **Smuggled-In Purpose:** Implicitly assumes a *federalism/deregulatory purpose*: that Congress intended to coerce states into setting up exchanges by withholding subsidies. This elevates a possible *subsidiary* purpose (state autonomy) over the *primary* purpose (expanding coverage).  
    - **Verdict:** "Selective literalism" that masks a substantive preference for limiting federal power.  

  **Plain Meaning Question:**  
  The case exposes the *myth of plain meaning*. Both sides agreed on the semantic content ("State" ordinarily means state government) but disagreed on:  
  - Whether context or consequences create ambiguity.  
  - Whether "plain meaning" controls when it produces absurdity.  
  - **Result:** "Plain meaning" is often a conclusion, not a starting point.  

  ### III. The Three-Level Model & Jurisprudential Insights  
  1. **Semantic Content:** "Exchange established by the State" → state-run exchanges only.  
  2. **Enactors' Intended Legal Content:** Congress likely *intended* subsidies in all exchanges (evidence: statements by drafters, uniform IRS implementation).  
  3. **Best Purpose-Serving Legal Content:** Subsidies available everywhere to avoid market collapse.  

  **Each Side’s Level:**  
  - **Dissent** claims to stay at (1), but arguably injects a federalism intent at (2).  
  - **Majority** jumps from (1) to (3) via contextual ambiguity, treating (2) as irrelevant (Roberts notably avoids legislative history).  

  **Key Tensions:**  
  - **Is the Move from (1) to (3) Legitimate?**  
    - Textualists: No—text controls, purpose can’t override clear language.  
    - Purposivists: Yes—when text produces incoherence, purpose resolves ambiguity.  
  - **Does (2) Collapse into (1)?**  
    - Only if you accept "text-bound intent" (intent is solely derived from public text). *King* shows why this fails: Congress’s *expected application* (subsidies everywhere) conflicted with literal text.  

  **Broader Debate:**  
  - **Semantic vs. Legal Disagreement:** The core conflict is *legal*, not linguistic. Both sides agreed on "State" meaning state government. The fight was over **who decides when text is "clear"** and **whether courts may "correct" text to avoid disaster**.  
  - **Power Struggle:** Textualism (dissent) claims to defer to Congress by enforcing text as written. Purposivism (majority) claims to defer to Congress by realizing its broader goals. The real conflict: **judicial role in a legislative system**.  

  ### IV. Verdict & Anomalies  
  **Which Theory "Wins"?**  
  - **Textualism** (as formal doctrine) loses: The dissent’s reading was linguistically defensible but produced an outcome at odds with statutory coherence and real-world consequences.  
  - **Purposivism** wins pragmatically but at a cost: The majority saved the ACA but strained textual fidelity, empowering courts to "fix" statutes.  

  **Anomalies for Both Theories:**  
  - **Textualism’s Blind Spot:** Fails when literal text creates absurdity *Congress clearly didn’t intend*. Scalia’s federalism gloss couldn’t mask this.  
  - **Purposivism’s Slippery Slope:** Roberts’ "ambiguity via consequences" risks letting policy preferences override text.  
  - **The Unspoken Anomaly:** *King* is a "statutory doomsday device" case—where a literal reading triggers systemic collapse. Neither theory cleanly resolves this.  

  **Misframed Debate?**  
  Yes. The binary "text vs. purpose" ignores:  
  - **Contextualism** as a middle path (interpreting text *within* its structural ecosystem).  
  - **Consequentialism** as an inescapable judicial consideration.  
  - **Institutional Realism:** Courts *always* blend text, intent, and consequence; pretending otherwise is disingenuous.  

  **Conclusion:** *King v. Burwell* reveals textualism and purposivism as incomplete without context and consequence. The majority’s approach was more defensible *in this case* due to the ACA’s fragile interdependence, but it exposed the peril of judges overriding text. The dissent’s rigid literalism ignored the statute’s reality. Ultimately, the case argues for a **pragmatic contextualism** that prioritizes: (1) semantic meaning, (2) structural coherence, (3) avoiding catastrophic outcomes—in that order. Neither "team text" nor "team purpose" escapes unscathed.
