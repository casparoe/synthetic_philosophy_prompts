  I'm a software engineer with no formal philosophy background, and I keep running into a claim I can't quite pin down: that one theory can be closer to the truth than another even when both are false. I'd like a worked example rather than a survey. Construct two competing explanations of some concrete phenomenon — ideally not a textbook case I've already seen — where both are mistaken, yet one is intuitively nearer the mark. Then use the example to expose the underlying problem: say what "nearer the truth" would have to mean for that intuition to hold up, and show where the obvious ways of cashing it out run into trouble. Please reason it through yourself rather than citing authors or papers.
