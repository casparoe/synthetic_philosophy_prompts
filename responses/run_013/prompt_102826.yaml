prompt: |-
  I am a doctoral candidate in religious ethics, trying to pin down the rule my supervisor is actually running. She writes on Buddhist ethics, has spent her career resisting the label 'consequentialist', and insists that the precepts are not exceptionless — she calls them training rules, and says, in a phrase she uses constantly and never quite defines, that a training rule may be outrun but never outweighed. Over the years she has ruled on a scattered set of cases, and I have kept a list:

  (i) A monk eats after noon so that he can sit with a grieving laywoman through the afternoon and keep her from despair: blameless.
  (ii) A physician tells a patient that her illness is manageable when it is in fact terminal, chiefly because she cannot face the conversation: wrong.
  (iii) A bystander shoots a gunman who is about to open fire on a crowd, in a moment of panic: wrong.
  (iv) A householder breaks a vow to fast on a holy day in order to share a meal that reconciles two estranged brothers: blameless.
  (v) A laywoman diverts money she had pledged to a temple fund in order to buy medicine for a neighbour's child: blameless.

  I can fit at least two quite different rules to all five. Next month she must comment on a new case: a passer-by, who has calmly and deliberately weighed what to do, shoots a gunman about to open fire on a crowd, moved throughout by compassion for those who would otherwise die and, he says, for the gunman himself. Tell me which rules fit her record equally well and what each predicts about this case; give me your best guess at her verdict and the reasons for preferring that reading; and name the further case that would most cleanly show whether it is the character of the act or the state of the agent that she is really tracking.
reasoning: |-
  Okay, let me start by really understanding what this doctoral candidate in religious ethics is asking. They're trying to figure out their supervisor's underlying ethical rule, especially since the supervisor resists the consequentialist label and emphasizes the precepts as training rules that can be "outrun but never outweighed." The student has five cases where the supervisor made judgments, and now they need to predict her verdict on a new case involving a compassionate passer-by shooting a gunman.

  First, I need to parse each of the given cases to identify patterns. Let me list them again: 

  Case (i): Monk eats after noon to comfort a grieving woman → blameless.  
  Case (ii): Physician lies to avoid a hard conversation → wrong.  
  Case (iii): Bystander shoots gunman in panic → wrong.  
  Case (iv): Household breaks fast to reconcile brothers → blameless.  
  Case (v): Laywoman diverts temple funds for medicine → blameless.  

  The supervisor's key phrase is that a training rule can be "outrun but never outweighed." So, "outrun" might mean setting aside the rule temporarily when a higher purpose is served skillfully, while "outweighed" would imply the rule is overridden by consequences, which she rejects. 

  Looking at the blameless cases, they all involve skillful intent (karuṇā, mettā) and a clear higher purpose: preventing despair, reconciliation, saving a life. The wrong cases involve unskillful motives: avoidance of discomfort (ii) or panic without compassion (iii). 

  The agent's state seems crucial. In (iii), panic made the act wrong even though it might have saved lives, whereas the new case has calm, compassionate deliberation. That contrast might be key. 

  The student mentioned two possible rules fitting all cases: one focusing on intention (Skillful Intent Rule) and another on consequences only when combined with good intent (Consequentialism with Virtue Constraint). But the supervisor rejects consequentialism, so the second rule might not align. The Skillful Intent Rule fits better because it emphasizes the actor's mental state and whether the act serves compassion skillfully without self-interest. 

  For the new case, the passer-by acts with calm compassion for everyone involved. Following the Skillful Intent Rule, this would likely be blameless because the intent is pure, and the precept against killing is outrun to save lives. The consequentialist rule would also approve but for different reasons. 

  To distinguish between focusing on the act versus the agent's state, the test case would be someone killing with mixed motives—part compassion, part anger. If the supervisor deems it wrong, she's tracking the agent's state. If blameless only due to outcome, she's focusing on the act. But given her emphasis on training rules and intention, the agent's state is probably paramount.
answer: |-
  Based on your supervisor's record and stated philosophy, two distinct ethical frameworks fit her rulings equally well. Her verdict on the new case will likely hinge on which aspect of her "outrun but never outweighed" principle is primary. Below is the analysis:

  ### Two Rules Fitting All Five Cases
  1.  **The Skillful Intent Rule (Virtue-Constrained Instrumentalism):**
      *   *Rule:* "Breaking a precept is blameless *only* when (a) motivated by unmistakable compassion (karuṇā) or loving-kindness (mettā) *directly relevant to the immediate situation*, (b) undertaken skillfully (kusala) with calm deliberation (not panic or aversion), (c) aimed at preventing imminent, severe harm or fostering significant, immediate good that outweighs the rule's breach *in that context*, and (d) free from significant self-interest or aversion."
      *   *Fits Cases:*
          *   (i) Compassion (prevent despair), deliberate, prevents harm (spiritual/emotional), no self-interest.
          *   (ii) Motivated by aversion (can't face conversation), not compassion. Wrong.
          *   (iii) Motivated by panic (not calm compassion). Wrong.
          *   (iv) Compassion (reconciliation), deliberate, fosters significant good, no self-interest.
          *   (v) Compassion (save life), deliberate, prevents severe harm, no self-interest.
      *   *Prediction for New Case:* **Blameless.** The passer-by acts with calm, deliberate compassion for the victims *and* the gunman, aiming to prevent imminent, severe harm. The precept against killing is "outrun" by this skillful intent and purpose.

  2.  **Consequentialism with an Agent-Virtue Constraint (Rejects "Outweighed" Label):**
      *   *Rule:* "Breaking a precept is blameless *only* when (a) it demonstrably leads to significantly better net consequences *in the specific circumstance* than adhering to the precept would, *and* (b) this outcome was the primary, deliberate intention of the agent, *and* (c) the agent's state is one of compassionate, non-aversive motivation."
      *   *Fits Cases:*
          *   (i) Better consequence (prevented despair) intended deliberately with compassion.
          *   (ii) Consequences arguably worse (deception harms trust), *and* motivation flawed. Wrong.
          *   (iii) Consequences might be good (lives saved), *but* motivation (panic) flawed and not deliberate intention. Wrong.
          *   (iv) Better consequence (reconciliation) intended deliberately with compassion.
          *   (v) Better consequence (life saved) intended deliberately with compassion.
      *   *Prediction for New Case:* **Blameless.** Calm, deliberate intention to achieve the best consequence (saving lives, potentially sparing the gunman karmic escalation) motivated by compassion. The good consequence justifies "outrunning" the precept, but it's not "outweighed" because the agent's virtue is integral.

  ### Your Supervisor's Likely Verdict & Reasoning
  *   **Best Guess Verdict:** **Blameless.**
  *   **Preferred Reading:** **The Skillful Intent Rule.**
  *   **Reasons for Preference:**
      1.  **Rejection of Consequentialism:** Her career-long resistance suggests discomfort with framing the justification *primarily* in terms of net outcomes, even if constrained. The Skillful Intent Rule centers the *agent's moral character and motivation* as the primary gatekeeper, making the consequence secondary to the *why* and *how* of the act. This aligns better with her resistance.
      2.  **"Outrun but never Outweighed":** This phrase strongly favors the Skillful Intent reading. "Outrun" implies the precept remains valid and binding, but a *skillful agent*, motivated purely by compassion and wisdom in an *exceptional circumstance*, can momentarily step beyond it *without negating its value*. The rule isn't "outweighed" (i.e., its value trumped by consequences); it's contextually navigated by a developed practitioner. The new agent's calm, compassionate deliberation exemplifies this "skillful outrunning."
      3.  **Case (iii) Contrast:** Her ruling against the panicked bystander highlights the *agent's state* as decisive, not just the outcome. The new case provides the deliberate, compassionate state missing in (iii), making blamelessness consistent under Skillful Intent.
      4.  **Buddhist Ethical Context:** Skillful Intent aligns with core Buddhist concepts like *cetanā* (volition/intention) as karmically decisive, the centrality of *ahimsa* as a virtue to be embodied, and the precepts as *training* for cultivating these virtues, not abstract rules. The agent's compassion for the gunman in the new case exemplifies a highly skillful, non-aversive motivation crucial to this view.

  ### The Decisive Further Case
  To cleanly distinguish whether she tracks the **Character of the Act** (e.g., killing is inherently wrong unless consequences absolutely force it) or the **State of the Agent** (e.g., the motivation and deliberation matter most), propose this case:

  *   **The Case:** A highly trained medic, moved by a *mixture* of genuine compassion for wounded soldiers *and* intense hatred for the enemy faction, deliberately kills an enemy sniper (who poses no *immediate* threat to the medic personally) in order to safely reach and save the lives of several critically wounded comrades. The medic coolly calculates this is the only way, acknowledges their hatred but believes compassion is dominant, and succeeds in saving the comrades.

  *   **Why it Distinguishes:**
      *   **If she focuses on the *Character of the Act* (leaning Consequentialist/Act-focused):** Saving multiple lives by killing one imminent threat (the sniper) might be seen as justifiably "outrunning" the precept. The mixed motive might be regrettable but secondary to the net good consequence and the necessary act. Likely **Blameless**.
      *   **If she focuses on the *State of the Agent* (Skillful Intent/Virtue-focused):** The presence of significant hatred (*dosa*) corrupts the motivation and undermines "skillfulness," even if compassion is also present. The act is motivated partly by unwholesome roots. The precept cannot be truly "outrun" by an unskillful mind, regardless of the consequence. Likely **Wrong**, or at least **Blamable** despite the good outcome. The hatred "outweighs" the compassionate intent in defining the act's moral quality for the agent.

  This case isolates motivation (mixed, with significant unwholesome element) from both the nature of the act (killing an imminent threat) and the consequence (net lives saved). Her ruling will reveal whether the purity of the agent's state is the *sine qua non* for blamelessly outrunning a precept. Given her emphasis on training rules and resisting consequentialism, the Skillful Intent reading (and thus likely finding this medic's act wrong) is strongly predicted.
