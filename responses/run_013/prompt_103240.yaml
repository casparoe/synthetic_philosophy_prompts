  **Preamble:**  
  We, the undersigned epistemic-program (EP) and idealization-skeptic (IS) parties, agree on the following definitions for this collaboration:  
  - **Rationality:** At every decision node, a player chooses the action that maximizes their expected payoff, given their beliefs about subsequent play.  
  - **Common knowledge (CK):** A fact is common knowledge if all players know it, all know that all know it, and so on ad infinitum.  
  We flag a key divergence: EP holds that CK of rationality (CKR) persists at all nodes (even if reached off-path), while IS contends that off-path deviations invalidate CKR by contradicting rationality. All analyses refer to **Game C**:  
  - Player 1 (P1) first chooses **Stop** (payoffs (1, 0)) or **Continue**.  
  - If P1 continues, Player 2 (P2) chooses **Stop** ((0, 2)) or **Continue**.  
  - If P2 continues, P1 chooses **Stop** ((3, 0)) or **Continue** ((2, 4)).  

  ---

  ### 1. Jointly Signed Claims  
  **1.1 Game C under CKR and backward induction (BI):**  
  - Both parties agree that BI prescribes:  
    - At P1’s second move, P1 chooses **Stop** (3 > 2).  
    - At P2’s move, anticipating P1’s choice, P2 chooses **Stop** (2 > 0).  
    - At P1’s first move, P1 chooses **Stop** (1 > 0).  
  - **EP position:** This follows from CKR at the outset, which implies players anticipate BI play at all future nodes.  
  - **IS position:** BI relies on counterfactual reasoning at nodes unreachable under CKR (e.g., P2’s node). CKR "justifies" BI only by assuming its own conclusion—the real work is done by the BI algorithm itself.  

  **1.2 Grain-of-doubt variant (trembling hand):**  
  - Both parties agree that with tremble probability ε > 0 at each node:  
    - As ε → 0, the outcome converges to P1 stopping first ((1, 0)).  
    - The prediction is continuous (no jump discontinuities).  
  - **EP position:** Continuity shows CKR is a robust idealization; the ε = 0 case is the natural limit.  
  - **IS position:** Continuity here is coincidental; trembles replace CKR with *beliefs* about near-rationality, masking conceptual flaws in the idealization.  

  **1.3 Game C played twice:**  
  - Both parties agree BI prescribes (1, 0) in both plays (total (2, 0)), as the second game’s outcome is independent of the first.  
  - **EP position:** CKR implies players foresee no linkage; BI applies recursively.  
  - **IS position:** Reputation effects are impossible under CKR since deviations don’t occur. The variant fails to reveal new disagreements.  

  **1.4 Role of idealizations:**  
  - **EP:** CKR represents logically omniscient agents; BI is their uniquely rational path.  
  - **IS:** CKR is an inconsistent idealization in off-path nodes; it cannot "ground" BI.  

  ---

  ### 2. Table of Remaining Disagreements  
  | Point at Issue | EP Party Position | IS Party Position |
  |----------------|-------------------|-------------------|
  | **Persistence of CKR off-path** | CKR, once established, holds at all nodes. Deviations are "surprising" but do not revoke CKR; beliefs are updated via Bayesian conditioning on zero-probability events (using CPS, lexicographic beliefs, etc.). | CKR cannot hold at a node reached by a deviation: if players are CKR, deviations have probability 0. Reaching such a node falsifies CKR, forcing belief revision that may abandon rationality assumptions. |
  | **Justificatory power of CKR for BI** | CKR (properly formalized) entails BI as the only rational path. BI is *explained* by epistemic conditions. | CKR either cannot be satisfied off-path or is redundant. BI is justified by its algorithm, not CKR; the latter adds no epistemic insight beyond stipulating BI. |
  | **Grain-of-doubt as validation** | Convergence under trembles validates CKR/BI as the limiting case of near-rational play. Continuity shows the idealization is empirically sound. | Trembles replace CKR with a different (belief-based) model. Convergence in Game C is fortuitous; discontinuity in other games (e.g., Centipede) would expose CKR’s fragility. |

  ---

  ### 3. Cruxes  
  **Crux 1: Persistence of CKR off-path**  
  - *Question:* Must CKR hold at nodes reached only by a deviation from BI?  
  - *Stakes:* If "no," EP loses its justification for BI off-path reasoning. If "yes," IS must accept CKR’s consistency.  

  **Crux 2: Discontinuity under grain-of-doubt**  
  - *Question:* Does there exist a perfect-information game where BI prescribes outcome *X*, but as ε → 0, the trembling-hand outcome does not converge to *X*?  
  - *Stakes:* A discontinuity would undermine EP’s claim that CKR is a robust idealization.  

  ---

  ### 4. Cases Bearing on Cruxes  
  **Crux 1: Game C under a deviation**  
  - **Case:** Suppose P1 continues at the first node (contrary to BI). What should P2 believe at her node?  
    - **Jointly agreed bearing:** This tests whether CKR constrains off-path beliefs.  
    - **EP prediction:** P2 believes P1 is rational and will stop at the last node (paying 3 > 2); P2 thus stops, yielding (0, 2).  
    - **IS prediction:** P2 infers P1 is irrational, so may believe P1 will irrationally continue at the last node (yielding 4 for P2); P2 thus continues, hoping for (2, 4).  

  **Crux 2: Discontinuity in a modified Centipede game**  
  - **Case:** Consider a 3-stage Centipede game:  
    - Stage 1: P1 stops → (1, 0); continues → P2 moves.  
    - Stage 2: P2 stops → (0, 2); continues → P1 moves.  
    - Stage 3: P1 stops → (3, 1); continues → (2, 4).  
  - **Jointly agreed bearing:** BI prescribes P1 stops immediately ((1, 0)). Does trembling-hand play converge to this as ε → 0?  
    - **EP prediction:** Yes. P2’s expected payoff for continuing is 1 (from P1 stopping) * (1 - ε) + 4 (from P1 continuing) * ε ≈ 1 + 3ε. For small ε, 1 + 3ε < 2, so P2 stops. P1 thus stops first.  
    - **IS prediction:** No. For ε > 1/3, P2 continues (since 1 + 3ε > 2), leading P1 to continue first (expected payoff ≈ (1 - ε)(3) > 1). As ε → 0, the limiting outcome depends on the convergence path.  

  ---

  ### 5. Verbal Disagreements and Decisive Arguments  
  **Merely verbal disagreement:** None. Disputes are substantive (e.g., "CKR at a node" implies different things for persistence off-path).  
  **Wording to dissolve confusion:** Use "CKR-persistence" (EP) vs. "CKR-initial" (IS) to disambiguate.  

  **Arguments that would move each party:**  
  - **Against EP:** A game where BI is discontinuous under trembles (Crux 2 case) would force EP to concede CKR is not robust.  
  - **Against IS:** A formal model (e.g., epistemic game theory with conditional probability systems) showing CKR can hold off-path without inconsistency would challenge IS’s claim that deviations falsify CKR.  
  - **Common ground:** Both agree a discontinuity (Crux 2) would refute EP; both agree a consistent off-path CKR model (Crux 1) would refute IS.  

