answer: |-
  Here's the joke, hitting 175 words:

  Our band's drummer, exhausted, proposes: "We need to simplify. Tonight, we vote separately on two things: First, should I play *loud*? Second, should I play *fast*? Then, separately, should I play *loud and fast*? Majority each time."

  The bassist nods. "I like loud. Calms my nerves. But fast? Makes me trip. So loud? Yes. Fast? No. Loud *and* fast? Definitely no."

  The guitarist shrugs. "Loud drowns me out. Hate it. Fast lets me solo more. So loud? No. Fast? Yes. Loud *and* fast? Absolutely not."

  The singer sighs. "Both just give me a headache. Loud? No. Fast? No. Loud and fast? God, no."

  The drummer votes last. "I can *do* loud. I can *do* fast. But both at once? I’d collapse! So loud? Yes. Fast? Yes. Loud *and* fast? Heck no."

  They tally: Loud? Passes 2-1 (Drummer, Bassist). Fast? Passes 2-1 (Drummer, Guitarist). Loud *and* fast? Fails 3-1 (only Drummer *against* his own proposals).

  The manager checks the results. "Right. Band policy: Play loud. Play fast. But under *no circumstances* play loud and fast."
  The drummer slumped. "Thank god. I only have one pair of arms."
