prompt: |-
  Hey, so I'm a junior in high school and I'm in this philosphy club that meets after school. Next week it's my turn to present on the paradox of fiction, which is basically the weird fact that we cry at movies and books even though we know the characters aren't real. Our club president always makes the presenter open with a joke, and last time someone did the whole I'm-not-crying-the-character-doesn't-exist thing and it was so lame that people actually groaned. I want to do better. I read a bit online and there seem to be two cool ideas: one is that when we cry at a story we're not really sad, we're only make-believe sad, sort of playing a game of pretend with our emotions (I think the fancy term is quasi-emotions). The other is that we really are sad, but the sadness is about a thought or an idea of a character rather than a real existing person. I find that whole disagreement kind of hilarious for some reason.

  Could you write me a joke that actually turns on that disagreement? Like, the punchline should only work if you know the difference between make-believe emotions and real emotions directed at thoughts. It should be funny to people in my club who've read the actual stuff, not just a generic nerd joke about fiction not being real. Maybe it's two philosophers in a movie theater arguing during the sad part, or a kid who tries to stop crying by reminding himself the character isn't real and then realizes his sadness is also not real, or something else. I need it to be short enough to tell out loud in like 30 seconds, and if it needs one line of setup about the theories that's fine as long as the setup is part of the joke. Also please don't make it mean-spirited or about spoiling a specific movie, since we have people in the club who haven't seen everything. I definately just want something that lands and makes the debate feel less abstract.
