  3. Only you can publish a technique that you judge 60% likely to be beneficial: you feel publishing is permissible.

  4. One hundred people, including you, each independently judge the technique 60% likely to be beneficial: you feel you should not publish because the group is nearly certain to publish (and likely to publish something harmful) and you don't want to be the one doing it.

