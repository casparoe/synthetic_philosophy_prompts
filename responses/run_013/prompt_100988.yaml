          p=0.6, U_good=1, U_bad=-1, so EU = 0.6*1 + 0.4*(-1) = 0.2.
          q is nearly 1, so (1-q) is nearly 0.
          R is the responsibility cost if the action is bad. Since the stakes are high, R might be large.
          The term (1-p)*R = 0.4 * R, which could be large.
          Therefore, even though (1-q)*0.2 is small, the responsibility cost term might dominate and make the whole expression negative.

     In case (5):
          p=0.9, so EU = 0.9 - 0.1 = 0.8.
          q is nearly 1, so (1-q) is nearly 0.
          (1-p)*R = 0.1 * R.
          So the expression is -0.1 * R. It is negative? But you feel you should act.

     This suggests that in case (5) you are not discounting for responsibility cost because you are more confident? Or you have a lower R because you are more confident? Or you don't incur R if the action is good? The responsibility cost R might be a function of p. Specifically, you might feel less responsible if you were highly confident and it turned out bad (because you had good intentions) than if you were only 60% confident and it turned out bad. So R = R(p), decreasing in p.

     For example, let R(p) = c / p, where c is a constant. Then for p=0.6, R = c/0.6, and for p=0.9, R = c/0.9. Then the cost term (1-p)*R(p) = (1-p) * c / p.

          For p=0.6: (0.4) * c / 0.6 = (2/3)*c
          For p=0.9: (0.1) * c / 0.9 = c/9

     So in case (4): (1-q)*0.2 - (2/3)*c. Even if (1-q) is small, if c is large, this is negative.
     In case (5): (1-q)*0.8 - c/9. Since (1-q) is near 0, this is approximately -c/9. If c is large, it is negative -> you should not act. But you want to act in (5).

     Alternatively, R might be constant, but then the cost in (5) is lower because (1-p) is lower.

          In case (4): cost = 0.4 * R
          In case (5): cost = 0.1 * R

     So if R is the same, the cost in (5) is lower. But the expected marginal utility without cost is also near 0. So the responsibility cost might dominate and make (5) negative too.

  Therefore, to match your reaction in (5), you must not be incurring a responsibility cost when you are highly confident. Or you might be willing to bear the responsibility at high confidence.

  Perhaps the responsibility cost is only incurred if you acted when your confidence was below a threshold T_responsibility. In case (5) your confidence is 90% and you set T_responsibility=80%, so you don't incur the psychological cost. In case (4) you are below and you do incur it.

  So the conditions might be:

     If p >= T_responsibility, then you do not incur the responsibility cost.

     Otherwise, if you act and the action is bad, you incur cost R.

     And T_responsibility is chosen by the individual and may depend on the group size and stakes.

     Then in case (5): p=0.9 > T_responsibility (say 0.8), so no responsibility cost. Then the expected utility is (1-q)*EU which is nearly 0. But if EU>0, then it's non-negative. Since it's costless to act, you might as well act? Or if there is a tiny chance that no one else acts, then it's positive. But essentially, you are indifferent. But you feel you should act. Perhaps because you want to ensure the action is done right? Or because you feel that if you don't act, then a less confident person might act and then you would feel guilty for not preventing that? That's not captured.

  Given the time, I think the most consistent explanation for your reactions is the two-threshold approach: one for necessary actions and a higher one for non-necessary actions.

  For the two additional cases:

  - Reversible: lowers the stakes, thereby lowers both thresholds. So you might be willing to act at 60% in a group of 100 for a non-necessary action if the reversibility makes the responsibility threshold low enough.

  - Preemptive: if by acting you prevent others from acting, then your action is effectively necessary to avoid the risk of the action being taken by someone with lower confidence? But in our case, everyone has the same confidence. However, if you act, you are sure it's done by someone with 60% confidence (you), whereas if you don't act, it might be done by someone else also at 60%. So no difference. Therefore, it's the same as case (4): you don't act if 60% is below the responsibility threshold.

  But if you believe that by acting you can do it better, then that's a different matter.

  In conclusion, there isn't a single principle that is both simple and accounts for all your reactions without introducing additional factors like responsibility aversion or quality of the action. The principle you should adopt depends on whether you want to prioritize marginal impact or responsibility. Your reactions suggest that you are using responsibility aversion in (4) and not in (5) because of the confidence level.

  If you want to be consistent with marginal impact only, then you should change your reaction in (4) and (5) to align with the bystander effect: in both (4) and (5), since the action is very likely to be taken by someone else, you should not act (unless there is a cost to inaction or a benefit to being the one who acts). This would require changing your reactions in (2) and (5) to not act. But you feel in (2) that leaking is more defensible, not less. And in (5) you want to act.

  Therefore, the responsibility-aversion model with a confidence threshold for responsibility is the best fit.

  Final principle:

     An actor should act if and only if:

     (1) The expected utility of the action (EU = p * U_good + (1-p) * U_bad) is positive, AND
     (2) Either:
          (a) the probability that the action would be taken by someone else if the actor does not act is below a threshold (i.e., the action is nearly necessary), OR
          (b) the actor's confidence p is above a responsibility threshold T_responsibility.

     where T_responsibility is a function of the stakes and the group size (increasing with both).

  In case (2) and (5), condition (2)(b) is satisfied because p is high enough. In case (4), it is not.

  The thresholds are subjective and context-dependent.

  This principle cannot save the idea in (2) that leaking feels more defensible because it would happen anyway. In fact, condition (2)(a) is about necessity, and in (2) the action is not necessary. But condition (2)(b) saves it. However, the feeling of defensibility might come from the high confidence, not from the redundancy.

  For the additional cases:

  - Reversible action: This might reduce the stakes, thereby reducing T_responsibility. If 60% is above the reduced T_responsibility, then act.
  - Preemptive action: The action is not necessary (someone else will act) so only condition (2)(b) applies. If 60% is above T_responsibility, act; otherwise, not.

  I hope this helps.
answer: |-
  Your struggle with the unilateralist's curse arises from a tension between two ethical perspectives: **marginal impact reasoning** (focusing on whether your action changes the outcome) and **responsibility aversion** (avoiding being the cause of harm, even if the outcome is unchanged). Your reactions across the five cases reflect a shift between these based on confidence levels, group size, and stakes. I'll propose a principle that captures your intuitions, explain how it handles each case, identify which verdicts it cannot save, and apply it to your new scenarios.

  ### Proposed Principle
  **Refined Responsibility-Adjusted Marginal Impact Principle:**  
  *Act only if:*
  1. **Marginal Impact Condition:** *Either* your action has a positive expected marginal impact (i.e., the probability-weighted change in outcome due to your action is net beneficial), *or*  
  2. **Responsibility Condition:** Your confidence exceeds a responsibility threshold (which increases with group size and stakes), and acting aligns with a "duty of care" (e.g., you have superior expertise or can perform the action better).  

  *Where:*
  - **Expected marginal impact** is calculated as:  
    `[Probability no one else acts] × [Your action's expected utility]`.  
    - *Your action's expected utility* = `p × U_good + (1-p) × U_bad`, with `U_good` and `U_bad` being the utilities of good and bad outcomes, and `U_none = 0` (status quo).  
  - **Responsibility threshold** is a function of:  
    - *Group size*: Larger groups raise the threshold (due to higher likelihood others will act).  
    - *Stakes*: Higher stakes (e.g., potential harm) raise the threshold.  
    - *Your role*: If you have unique expertise, the threshold may lower.  
  - **Duty of care** justifies acting when your action reduces harm (e.g., by being better executed) or fulfills a special obligation (e.g., you discovered the information).

  This principle prioritizes marginal impact but allows overriding it when your confidence is high enough to accept responsibility, especially if you can improve the outcome. It rejects pure unilateralist conservatism (always demanding higher confidence in larger groups) by incorporating role-based duties and the reality that inaction may not prevent harm.

  ### Application to Your Cases
  | Case | Your Reaction | Principle's Handling | Key Clause | Verdict Saved? |
  |------|---------------|----------------------|------------|----------------|
  | **1** You alone hold documents; leaking is clearly right. | Act. Being the only actor strengthens the case. | **Marginal impact dominates:** Probability no one else acts is 1, so your action has definite positive impact. Responsibility is irrelevant (no one else to share blame). | Marginal Impact Condition (necessary action). | Yes. |
  | **2** Thirty colleagues hold documents; leaking feels more defensible. | Act. Information comes out regardless; your silence buys nothing. | **Marginal impact + duty of care:** Probability others act is high, so marginal impact ≈ 0. But high confidence ("clearly right") exceeds responsibility threshold. Duty of care: Leaking truth is inherently defensible, and your action may be identical to others (no added harm). | Responsibility Condition (high confidence + no added harm). | Yes. |
  | **3** You alone judge technique 60% beneficial; publishing is permissible. | Act. | **Marginal impact dominates:** Probability no one else acts is 1. 60% confidence may be sufficient for low-to-moderate stakes. | Marginal Impact Condition. | Yes. |
  | **4** One hundred at 60% confidence; you should not publish. | Don’t act. Group will likely publish something harmful; avoid being the cause. | **Responsibility aversion dominates:** Probability others act is near 1 (≈1 - 0.4¹⁰⁰), so marginal impact ≈ 0. 60% confidence is below responsibility threshold (high stakes + large group). No duty of care (no expertise implied). | Neither condition met. | Yes. |
  | **5** You at 90%, others at 60%; you should publish. | Act. You have looked closely; others will publish worse versions. | **Responsibility condition + duty of care:** Marginal impact ≈ 0 (others likely act). But 90% confidence exceeds responsibility threshold (even in large group). Duty of care: You have superior expertise ("looked closely"), so your action may be better (e.g., more careful). | Responsibility Condition (high confidence + duty of care). | Yes. |

  ### Inconsistent Verdicts and What Must Be Given Up
  The principle saves all your verdicts but requires reinterpreting **Case 2** through the lens of responsibility (not marginal impact). Your initial reaction in Case 2 ("information comes out regardless") leans on marginal impact reasoning, but the principle uses the Responsibility Condition instead. This is a cost:  
  - **What you lose:** The intuitive appeal of marginal impact in Case 2. You must accept that acting is justified by high confidence and lack of added harm (duty of care), not because your action is inconsequential.  
  - **Why it's necessary:** If you insist on pure marginal impact for Case 2, it would conflict with Case 4 (where you reject marginal impact). The principle resolves this by making responsibility aversion context-dependent (activated only below a confidence threshold).

  ### Predictions for New Cases
  1. **Reversible Action (one of 100 at 60%):**  
     - **Prediction:** *Acting may be permissible if reversibility lowers stakes.*  
     - **Reasoning:** Reversibility reduces potential harm, lowering the responsibility threshold. If 60% confidence now exceeds this threshold, the Responsibility Condition may be met. However, marginal impact ≈ 0 (others likely act), and no duty of care is implied. *Verdict:* **Don’t act** unless stakes are trivial (e.g., threshold drops below 60%).  

  2. **Preemptive Action (one of 100 at 60%; your action blocks others):**  
     - **Prediction:** *Act if you can improve the outcome; otherwise, don’t.*  
     - **Reasoning:** Your action is necessary to prevent others from acting (so marginal impact = your action's expected utility). But 60% confidence may be insufficient for high stakes (similar to Case 3). Duty of care: If you can execute better (e.g., add safeguards), acting is justified. *Verdict:* **Act only if you have a duty of care**; otherwise, don’t (since 60% is low for high stakes).

  ### Conclusion
  The **Refined Responsibility-Adjusted Marginal Impact Principle** explains your verdicts by:  
  - Using marginal impact for necessary actions (Cases 1, 3).  
  - Invoking responsibility for redundant actions when confidence is high or duty of care applies (Cases 2, 5).  
  - Invoking responsibility aversion for redundant actions with low confidence (Case 4).  

  It cannot save your *marginal-impact justification* for Case 2 without creating inconsistency. By giving that up, you gain a coherent framework where responsibility thresholds adapt to group size, stakes, and your role. For new cases, reversibility lowers the bar for action, while preemption creates a duty of care opportunity. This principle avoids the unilateralist's curse by not demanding universally higher confidence in larger groups, instead focusing on dynamic thresholds and contextual duties.
