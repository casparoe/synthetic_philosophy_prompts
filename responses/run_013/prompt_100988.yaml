  Let me restructure the problem. The curse arises because independent actors each acting on their own judgment can lead to an action being taken with a probability that is the complement of the probability that everyone refrains. If each actor has a probability p of judging the action beneficial and thus acting, then the probability that at least one acts is 1 - (1-p)^n, which approaches 1 as n increases. Therefore, if p>0, the action is almost certain to be taken in a large group even if p is low. This leads to the conclusion that individuals should be more conservative (i.e., require higher confidence) as the group grows.

  However, your reactions suggest that you are also considering the marginal impact of your own action and the context of who else is acting.

