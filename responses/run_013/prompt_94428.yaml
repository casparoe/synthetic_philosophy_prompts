  4. "That is really Kant's categorical imperative in game-theoretic dress — cooperate in the one-shot Prisoner's Dilemma because cooperation is the policy that pays if everyone adopts it"
     - The Kantian connection: Hofstadter does draw an analogy to Kant's categorical imperative. However, it is important to note that superrationality is presented as a decision rule, not necessarily as a moral doctrine. The summary says: "the superrational player is, at bottom, someone who cares about the group's good rather than only about himself." This is a bit misleading. The superrational player is still self-interested: they are choosing the action that, if all do it, leads to the best outcome for themselves. In the Platonia dilemma, the p=1/20 gives each player an expected payoff of about 18.35 million, which is better than the 0 they get in the symmetric Nash equilibrium (everyone sends) and also better than the 0 if no one sends. But in the asymmetric Nash equilibria, one player gets 1e9 and the others 0. So the superrational solution is a compromise: everyone gets a positive expected payoff. But it is not that they care about the group's good per se; they care about their own payoff and they recognize that the only way to get a positive payoff is to coordinate on a symmetric strategy that maximizes their own expected payoff given that everyone does the same.

     In the Prisoner's Dilemma, the superrational solution is to cooperate. Why? Because if both cooperate, each gets the reward (say, R) which is better than the punishment (P) and the sucker's payoff (S) is worse. But the standard Nash equilibrium is defect. However, if both defect, they get P. If both cooperate, they get R. Since R>P, they prefer mutual cooperation. But the catch: if I know the other will cooperate, I should defect and get T (temptation) which is greater than R. But in superrationality, I cannot assume that the other will cooperate and I defect because I know that the other is reasoning the same way. So if I defect, then the other also defects, and I get P. But if I cooperate, then the other also cooperates, and I get R. So I choose to cooperate because that leads to R, which is better than P. So it is still self-interest, but mediated by the assumption that the other will do what I do.

     Therefore, the summary's claim that the superrational player cares about the group's good is not entirely accurate. They care about their own good, but they realize that their own good depends on everyone doing the same thing, and they choose the action that, when universally adopted, gives them the best outcome.

  5. "The magazine that carried the column later ran a real version of the game for its readers. You entered the Luring Lottery by sending a postcard bearing the number of entries you wanted; the prize was one million dollars divided by the total number of entries, and it went to the submitter of a randomly chosen entry."
     - This matches what we described.

  6. "Since your chance of winning is just your own entries divided by the total, the sensible move was to cram the largest number you could fit onto the postcard, and that is what the magazine told its readers to do"
     - This is the Nash equilibrium advice when there is a bound M. And we showed that the symmetric Nash equilibrium is for each to choose M. And the magazine did give that advice.

  7. "predictably, a great many of them did, the prize shrank to a fraction of a cent, and the contest turned into a debacle that nobody won."
     - Actually, someone did win, but the prize was very small. The summary says "nobody won" — but that is not accurate. The prize was awarded, but it was very small. The summary might be exaggerating.

  8. "The lesson Hofstadter draws is that superrationality is a species of magical thinking: it works only if the other players are literally identical to you, or if your choice somehow causes theirs, and since neither of those holds in a genuine one-shot game, the whole idea collapses back into ordinary rational choice."
     - This is a misrepresentation. Hofstadter does not draw that lesson from the Luring Lottery. In fact, the Luring Lottery was not originally designed by Hofstadter. The Platonia dilemma and the Prisoner's Dilemma are the ones he discusses. The Luring Lottery was an example that occurred in a magazine, and the summary says that Hofstadter drew a lesson from it. But I am not aware of Hofstadter commenting on the Luring Lottery. 

     Moreover, in his writings, Hofstadter does not abandon superrationality. He acknowledges that it requires that the players are identical in reasoning and that they know that. In a one-shot game with no communication, if the players are rational and they know that they are all identical and that they will all do the same thing, then superrationality is a solution. But if they are not identical or if they don't trust that the others are identical, then it may not work.

     The summary says that Hofstadter draws the lesson that superrationality is magical thinking. But I believe that Hofstadter still defends superrationality as a valid mode of reasoning for certain situations. He does not say that it collapses to ordinary rational choice. Ordinary rational choice would lead to the Nash equilibrium, which in the Platonia dilemma is either everyone sending (and getting 0) or a coordination on a single sender (which is hard without communication). The superrational solution is different.

     Also, the claim that it works only if the players are literally identical or if your choice causes theirs: Hofstadter does emphasize the identity of the players. But he does not require that your choice causes theirs — it's that they are all using the same reasoning and will arrive at the same conclusion. That is not causation.

  IV. Addressing the specific questions

  First: the Kant comparison and the suggestion that the superrational player cares about the group's good.

  As argued above, the Kant comparison is one that Hofstadter makes. But the superrational player is not necessarily caring about the group's good; they are caring about their own good, but they recognize that their own good is maximized when they all choose the symmetric action that maximizes the common payoff. So it's still self-interest, but under the constraint that everyone does the same.

  Second: the Luring Lottery.

  The summary is correct about the magazine's advice and what happened. But the arithmetic: 
     - The magazine's advice (Nash equilibrium with bounded M) leads to each player submitting M, and then expected winnings = 1e6/(N^2 * M). 
     - The superrational solution would be to submit 1, leading to expected winnings = 1e6/(N^2). 
     - But the magazine did not give superrational advice; they gave Nash advice.

  The summary states: "the sensible move was to cram the largest number" — that is correct from the standard game-theoretic perspective (if we assume a bound and that others are playing arbitrarily). But from a superrational perspective, it is not sensible.

  Third: the moral drawn at the end.

  The summary attributes to Hofstadter the lesson that superrationality is magical thinking. This is not accurate. Hofstadter does not draw that lesson from the Luring Lottery. In fact, I am not aware that Hofstadter commented on the Luring Lottery. Moreover, in his writings, he defends superrationality. The criticism that superrationality requires identical players is one that he acknowledges, but he does not reject the concept because of that. He thinks it is applicable in some contexts.

  V. The randomization in Platonia

  The summary says that each should send with probability 1/20. And we see why: it maximizes the probability of exactly one sending and also maximizes the expected payoff per player in the symmetric superrational solution.

  But the questioner's instinct was that they might choose a definite choice. However, if they all choose to send with probability 1, they all get 0. If they all choose to send with probability 0, they get 0. The mixed strategy with p=1/20 gives a positive expected payoff. So randomization is necessary.

  VI. Corrected summary

  Let me write a corrected version in the same register:

  "Hofstadter's Platonia dilemma is the cleanest way into this. A trillionaire assembles twenty people and offers them a deal: if exactly one of the twenty sends him a telegram by noon the next day, that person receives a billion dollars; if two or more send, or if nobody sends, nobody gets anything; and the twenty are forbidden to communicate with one another. Hofstadter's superrational solution is that each should send a telegram with probability one in twenty. This maximizes the expected payoff for each player under the assumption that all players are identical and will choose the same mixed strategy. Superrationality is defined as the habit of including in your deliberations the fact that the other people facing the same problem are reasoning the same way you are: instead of asking 'what should I do, given what they will do?', you ask 'what should we all do, given that we will all do the same thing?'. This can be seen as a game-theoretic analogue of Kant's categorical imperative, but it is important to note that the superrational player is not necessarily motivated by the group's good; rather, they seek their own best outcome under the constraint that everyone will do the same. The magazine that carried the column later ran a real version of the Luring Lottery. You entered by sending a postcard with the number of entries you wanted; the prize was one million dollars divided by the total number of entries, and it went to the submitter of a randomly chosen entry. From a standard game-theoretic perspective, the sensible move was to submit the largest number you could fit, because that is the dominant strategy in the Nash equilibrium (if there is a bound on the number). The magazine advised its readers accordingly, and many did so, leading to a very small prize. Hofstadter would likely point out that the superrational solution would be for everyone to submit exactly one entry, which would yield a much larger expected prize per player. However, the outcome of the lottery does not refute superrationality; it rather illustrates the difference between standard game theory and superrationality. Hofstadter does not conclude that superrationality is magical thinking; he acknowledges that it depends on the players being identical and recognizing that identity, and he maintains that in such situations it is the rational approach."

  This corrected summary is more faithful to Hofstadter's position.
