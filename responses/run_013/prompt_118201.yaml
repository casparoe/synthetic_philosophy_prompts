answer: |-
  ## Committee on Student Accommodations: Written Opinion re: Petition for Wearable Device Accommodation  
  **Petitioner:** Second-year undergraduate with documented memory impairment  
  **Request:** Use of wearable AI device during closed-book exams (normal mode: retrieval + generative completion)  
  **Recommended Action:** **Grant with Specific Conditions** (Vote: Approve/Reject)  

  ### I. Recommendation  
  Move to approve the accommodation **with the following conditions**:  
  1. **Generative features disabled** during examinations (completion suggestions, phrasing assistance).  
  2. **Retrieval-only mode enabled** (searchable database of lectures/readings).  
  3. **Offline functionality verified** by IT Services 72 hours prior to each exam.  
  4. **Paper notebook permitted** as backup if device fails mid-exam.  
  5. **Temporary approval** for this term’s exams only, with **mandatory review** after final grades are posted.  

  **Notify the Registrar & Student:** Accommodation is granted for **retrieval-only use** in closed-book exams this term, contingent on IT verification of offline mode. Generative functions are prohibited. Final approval for future terms requires committee reassessment after reviewing this term’s outcomes.  

  ---

  ### II. Reasoning  

  #### A. **Core Principle Applied**  
  The university’s policy permits accommodations that do not "fundamentally alter the skill being assessed." This exam assesses:  
  - **Knowledge retention** (memory of course material)  
  - **Critical synthesis** (organizing arguments independently)  
  - **Original composition** (expressing ideas in the student’s own voice)  

  The device’s two functions impact these differently:  
  - **Retrieval function** (searching stored data) **accommodates memory impairment** without replacing synthesis/composition. It parallels standard accommodations (e.g., extended time for processing delays).  
  - **Generative function** (suggesting phrasings/completions) **alters original composition**, risking assessment of ideas not fully the student’s own. This crosses into "fundamental alteration."  

  #### B. **Engaging the Counterarguments**  
  *The strongest case for full approval* (device as cognitive prosthetic):  
  If the device is so deeply integrated that its absence causes "cognitive collapse," and it meets "extended mind" criteria (reliable, automatic, trusted), denying it could be discriminatory—akin to denying glasses. The student’s dependence suggests the device *is* part of her cognitive system, and prohibiting it invalidates the exam’s measure of *her* abilities.  

  *Why this is not fully persuasive*:  
  1. **Generative features lack "automatic endorsement"**: The student admits she sometimes overrides suggestions and cannot distinguish her ideas from the device’s. This conflicts with the "trusted extension" requirement of extended mind theory. Unlike glasses (which correct perception but don’t generate content), the device creates new linguistic outputs.  
  2. **Assessment integrity**: Even if the device *is* part of her mind, exams must distinguish between the student’s understanding and the system’s output. The generative function blurs authorship, making it impossible to evaluate *her* synthesis skills fairly.  
  3. **Precedent concerns**: Unlike retrieval (which compensates for memory access), generative AI *creates* content. Allowing it would compel us to permit tools like GPT-4 or Grammarly in all exams, fundamentally changing "closed-book" assessment.  

  #### C. **Why Conditions Are Necessary**  
  - **Generative features disabled**: Preserves evaluation of *original composition* while still accommodating memory access.  
  - **Retrieval mode permitted**: Directly addresses documented memory impairment without altering core skills.  
  - **Offline verification + notebook backup**: Mitigates reliability concerns (cloud dependence).  
  - **Temporary approval**: Allows real-world evaluation of whether retrieval-only use adequately supports her needs without compromising assessment integrity.  

  #### D. **What Turns on Generative vs. Retrieval**  
  - **Retrieval** is a *passive* aid: It accesses stored information but doesn’t create structure or language. This compensates for impaired recall without replacing intellectual labor.  
  - **Generative AI** is an *active* collaborator: It produces novel phrasing and logical connections. This risks outsourcing the core tasks of argument-building and expression—precisely what exams aim to assess.  

  ---

  ### III. Conclusion  
  This accommodation balances compassion with academic integrity. Granting retrieval-only use recognizes the student’s disability without conflating memory support with compositional outsourcing. Denying the device entirely ignores her documented need; allowing generative features undermines the exam’s purpose. The conditions ensure fairness to both the petitioner and the student body.  

  **Vote:** Approve the recommendation as specified.  
  **Review Date:** 1 week after final grades post for the current term.  

  ---  
