  ### Structural-Demographic Instability Scoring Procedure  
  *Based on Turchin’s framework of Popular Wellbeing (PW), Elite Overproduction (EO), and State Capacity (SC). Scores 0–100 (higher = worse instability).*

  ---

  #### **1. Inputs, Proxies, and Missing Data Rules**  
  **Core Dimensions and Proxies** (Discounts adjust final dimension scores):  
  - **PW**: Real median wage trend (10+ years).  
    - *Proxies*:  
      - GDP/capita growth + Gini coefficient (if both, discount PW by 30%).  
      - Cost burdens: Housing/food/energy costs vs. income (if 2+ burdens, discount by 50%; if 1, discount by 70%).  
  - **EO**: Youth (25–34) tertiary attainment + youth unemployment (both required).  
    - *Proxies*:  
      - Tertiary attainment alone: Discount EO by 40%.  
      - Political fragmentation (parties/seats): Discount EO by 60% if used alone.  
  - **SC**: Debt/revenue + trust in government (both required).  
    - *Proxies*:  
      - Debt/revenue alone: Discount SC by 50%.  
      - Press freedom: Discount SC by 70% if used alone.  

  **Missing Data Rule**:  
  - **Refuse to score** if any dimension lacks *all* core/proxy data.  
  - **Minimum to lift refusal**: One indicator per dimension (core or proxy).  

  ---

  #### **2. Steps**  
  1. **Data Collection**: Gather inputs for PW, EO, SC. Stop if any dimension has zero data; output refusal.  
  2. **Discount Application**: Apply discounts per proxy quality.  
  3. **Dimension Scoring** (0–100):  
     - **PW**: Score = `50 + (wage decline % × 10)` OR `40 + (cost burden increase % × 15)`. Cap at 100.  
     - **EO**: Score = `(tertiary growth % × 1.5) + (youth unemploy % × 1.2) + (fragmentation score*)`.  
       - **Fragmentation score**: `(parties increase % × 0.5) + (30 if largest bloc < 30%)`.  
     - **SC**: Score = `(debt/GDP × 0.5) + (interest/revenue × 1.5) + (100 − trust % × 1.5)`.  
  4. **Overall Score**: `(PW + EO + SC) ÷ 3`.  
  5. **Diagnosis Only**: Output phase (integrative/disintegrative) if overall score <30 or >60; else "transitional".  

  ---

  #### **3. Diagnosis vs. Forecast**  
  - **Diagnosis**: Current phase based on score thresholds.  
  - **Forecast**: Never output. If pressed: "No timing forecast; framework indicates structural risk/security but not onset."  
  - **Rule**: Confident diagnosis *must not* imply imminent turn. Output: *"Phase: [X]. Timing: Unpredictable."*  

  ---

  #### **4. Falsification Field**  
  - **Falsifies Reading**:  
    - *Disintegrative phase*: No major instability event (e.g., coup, mass unrest, debt default) in 24mo AND improvement in 2+ dimensions.  
    - *Integrative phase*: Major instability event without external shock (e.g., war, pandemic).  
  - **Falsifies Framework**: >50% of scored countries show false readings when data is complete.  

  ---

  #### **5. Judgment and Handoff Points**  
  **Judgment (disguised as measurement)**:  
  - Discount allocation for proxies.  
  - Fragmentation score (subjective weighting of parties/blocs).  
  - Press freedom → trust conversion.  

  **Mandatory Handoff to Person**:  
  - Override refusal to score (business obligation).  
  - Falsification event occurs (requires framework reassessment).  

  ---

  #### **6. Limitations Statement**  
  **The procedure cannot**:  
  - Predict timing of instability events.  
  - Capture external shocks (e.g., wars, pandemics).  
  - Resolve theoretical disputes (e.g., quantifiability of macrohistory).  
  **Output must include**:  
  - Score range (e.g., 70 ±15) reflecting proxy discounts.  
  - Footnote: *"Contested framework. Range incorporates data uncertainty, not model validity."*  

  ---

  ### **Application to Cases**  
  #### **Case 1: Ambria**  
  - **PW**: Real wage flat (0% growth), housing cost ↑130% (9.5 vs. 4.1).  
    - Score: `50 + (0 × 10) = 50` (wage) + `40 + (130 × 0.15) = 59.5 → 60` (cost) → **55** (avg).  
  - **EO**: Tertiary ↑23% in 25y (0.92%/yr), youth unemploy 27%, parties ↑200%, largest bloc 22%.  
    - Fragmentation: `(200 × 0.5) + 30 = 130`.  
    - Score: `(0.92 × 1.5) + (27 × 1.2) + 130 = 1.4 + 32.4 + 130 = 163.8 → 100` (capped).  
  - **SC**: Debt 84%, interest 9%, trust 19%. Press freedom mid-table → proxy trust at 35%.  
    - Score: `(84 × 0.5) + (9 × 1.5) + (100−35 × 1.5) = 42 + 13.5 + 97.5 = 153 → 100` (capped).  
  - **Overall**: `(55 + 100 + 100) ÷ 3 = **85 ±10**` (no discounts; range reflects fragmentation/proxy trust uncertainty).  
  - **Diagnosis**: Disintegrative phase (score >60).  
  - **Falsification**: No mass unrest/debt default by 2026 AND wage growth >1% + trust >30%.  
  - **Verdict**: **High risk** (contradicts house view).  

  ---

  #### **Case 2: Reznia**  
  - **PW**: No wage, cost burden, or Gini trend data. Non-oil GDP ↓6% insufficient (no distributional adjustment).  
  - **EO**: No tertiary/unemployment data. No fragmentation (single party).  
  - **SC**: Reserves cover 3mo spending → weak proxy for fiscal health (discount 70%). No trust data.  
  - **Refusal Reason**: Zero PW indicators; SC proxies inadequate after discount.  
  - **Minimum to Lift Refusal**: Real wage trend OR housing/food cost data (PW); youth education/unemployment (EO).  
  - **Verdict**: **Refuse to score** (insufficient data; contradicts house view).  

  ---

  ### **Closing Summary**  
  - **Ambria**: **85 ±10** (Disintegrative). High risk from wage stagnation, elite competition, and state fragility.  
  - **Reznia**: **Unscorable**. Critical data gaps in PW and EO preclude assessment.  
  - **Procedure Integrity**: Ambria’s result stands despite house view; Reznia refusal is non-negotiable.  
  - **Theoretical Warning**: *"Framework contested. Scores reflect structural preconditions, not event timing."*
