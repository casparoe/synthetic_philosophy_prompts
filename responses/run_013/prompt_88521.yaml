prompt: |-
  I'm on the grants and finance comittee of a small foundation that funds long-term projects (permanent endowment, vague charter about helping future generations). Next Thursday we vote on the discount rate we'll use to rank grants. Our finance chair wants a flat 4% real rate for everything, which would make a project that pays off in 150 years worth almost nothing now; he says that's just fiduciary common sense, since future people can't hold us accountable and might not exist. Two trustees want a zero pure time preference, so only project failure risk or a chance the world ends can justify discounting. One of them keeps saying the right rate is just pure time preference plus a growth term plus a catastrophe risk term, and another trustee says that formula just hides the ethics in the parameters. Our consultant has thrown in a third option: a declining schedule, something like 3% for the first 30 years, 1.5% for 30 to 100, and 0.25% after that, because we're more uncertain about far-future growth. The chair calls that a fudge; the zero-discount trustees call it a sellout. I have to circulate a short written opinion before the vote. Please write it: recommend a concrete policy (a rate or a schedule, plus when we should revisit it), give reasons the board can actually act on, and take the strongest opposing point seriously rather than just splitting the difference. In the reasoning, seperate pure time preference from the fact that future people may be richer, from the chance they never exist, and from the chance the project just fails. And if you think the real issue isn't the rate at all but something else in how we're framing the vote, say that and say what we should decide instead. No need for citations or reading lists; just make the argument.
reasoning: |-
  Okay, the user is part of a foundation committee deciding on a discount rate for long-term grants. They need a written opinion before the vote. Let me start by understanding the different viewpoints. The finance chair wants a flat 4% real rate, arguing fiduciary duty. Two trustees prefer zero pure time preference, focusing on ethics. The consultant suggests a declining schedule due to uncertainty about future growth.

  First, I need to unpack the components of discounting: pure time preference, growth adjustment, catastrophe risk, and project failure. Each affects the rate differently. The finance chair's 4% flat rate heavily discounts the far future, which might undervalue long-term benefits. The zero-discount trustees ignore growth differences but make a valid ethical point against devaluing future generations. The declining schedule tries to balance these by adapting to uncertainty over time.

  The user mentioned that the real issue might be framing. The foundation's charter is vague about helping future generations. A rigid rate might not capture their mission. Also, the vote is on a single number, but different projects have varying risks. Maybe recommending a framework instead of a fixed rate is better. That way, the rate is adjusted based on project specifics.

  I should propose a policy that uses a declining schedule but separates the components. For example, pure time preference at 0%, growth adjustment declining over time, plus explicit catastrophe and project failure rates. This addresses the trustees' ethical concerns while acknowledging economic uncertainty. Revisiting the schedule every five years with audits ensures adaptability.

  The strongest opposing point is the finance chair's fiduciary argument. They worry about accountability and existence risks. By setting pure time preference to 0% and including explicit catastrophe risk, the policy respects fiduciary duties without dismissing future generations. Separating project failure allows tailored risk assessment per grant.

  The user needs actionable reasons for the board. Highlighting that the declining schedule matches uncertainty in growth models and aligns with the foundation's long-term mission. Emphasizing transparency in components builds trust. Recommending a framework instead of a single rate avoids one-size-fits-all, making evaluations more nuanced.

  Also, the policy should require revisiting and audits. This shows due diligence, addressing the chair's accountability concerns. The trustees' ethical stance is honored by removing pure time preference, while growth adjustments reflect realistic economic trends.

  In conclusion, the core issue is using a single rate for all projects. A flexible framework with clear components and periodic reviews would better serve the foundation's goals. This approach respects all viewpoints and provides a principled yet practical solution.
answer: |-
  ## Recommended Discount Rate Policy for Foundation Grant Evaluation

  **Policy:** Adopt a **declining real discount rate schedule**:
  *   **0-30 years:** 2.0%
  *   **31-100 years:** 1.0%
  *   **101+ years:** 0.0%

  **Plus:**
  1.  **Explicit Catastrophe Risk Adjustment:** Add a separate, project-specific adjustment representing the *annual probability of a global catastrophe* making future benefits irrelevant (e.g., 0.1% per year, subject to annual expert review by the committee).
  2.  **Explicit Project Failure Risk:** Evaluate and discount each project individually for its *specific risk of failure* (e.g., technology risk, implementation risk, obsolescence risk). This is *not* part of the base discount rate.
  3.  **Revisit:** Review the entire schedule, base rates, and catastrophe risk parameter **every five years**, or sooner if major shifts in long-term economic forecasts or existential risk assessments occur. Mandate a **retrospective audit** of past grant rankings using the current schedule every 10 years to assess its practical impact.

  ### Reasons for Recommendation

  This policy balances fiduciary responsibility, ethical obligations to future generations, and practical economic realities more effectively than a flat rate or zero pure time preference. Crucially, it separates the distinct rationales for discounting clearly:

  1.  **Pure Time Preference (PTP):** Setting this to **0%** aligns with the ethical argument that the well-being of a future person counts equally to someone alive today, simply because they exist in the future. Our vague charter to "help future generations" implies this fundamental impartiality. The Finance Chair's argument that "future people can't hold us accountable" is valid pragmatically, but ethically, our *duty* is to act in their presumed interest regardless of their ability to enforce it. **Therefore, PTP is explicitly set to 0% in this schedule.**

  2.  **Growth Adjustment (Opportunity Cost):** This is the core rationale for *any* positive discount rate. If future generations are richer (due to economic growth), a unit of benefit (e.g., $1 million) is less valuable to them than it is to the poorer present generation. Investing the money elsewhere *now* could yield higher returns used for nearer-term good. **This is why the rate isn't zero.**
      *   **Why Decline?** Predicting growth reliably diminishes drastically over longer horizons. Assuming constant high growth (implied by a flat 4% rate) for 150+ years is highly speculative and likely overstates the opportunity cost for the far future. The declining schedule (2% -> 1% -> 0%) reflects increasing uncertainty about long-term growth prospects and avoids the extreme devaluation of the far future inherent in a flat 4% rate, which arguably violates our charter's spirit.

  3.  **Catastrophe Risk (Existential Risk):** The valid concern that future benefits might never materialize due to human extinction or civilizational collapse is **real and significant**. However, bundling this into the base discount rate confuses distinct issues. A flat 4% rate implicitly assumes a *constant, high* annual probability of catastrophe (roughly equivalent to 4%), which is likely excessive and lacks transparency. Our policy **explicitly separates this risk**. A modest, separately debated annual adjustment (e.g., 0.1%) applied uniformly acknowledges the possibility without catastrophically devaluing the long-term investments our endowment is designed to support. This is reviewed frequently based on best available science.

  4.  **Project-Specific Failure Risk:** This is fundamentally different from the above. The risk that *this specific grant-funded project* fails (tech doesn't work, organization collapses, solution becomes obsolete) is unique to each proposal. **This risk should NEVER be baked into the foundation-wide discount rate.** It must be evaluated case-by-case during project due diligence and reflected in the *project's expected value calculation* or as a separate risk premium/adjustment to the benefit stream.

  ### Addressing the Strongest Opposing Point (Finance Chair)

  The Finance Chair's core argument – that a high discount rate (like 4%) is "fiduciary common sense" due to uncertainty, lack of accountability, and existential risk – deserves serious consideration. Fiduciary duty requires prudent stewardship of the endowment to ensure its ability to fund grants indefinitely. A zero-rate approach risks undervaluing nearer-term opportunities that could be demonstrably impactful.

  **Why this policy addresses it better:**
  *   **Prudence via Uncertainty:** The declining schedule *is* prudent. It uses moderate near-term rates reflecting current growth expectations (more certain) but reduces them significantly as uncertainty grows, avoiding reckless assumptions about constant high growth or constant high catastrophe risk for centuries.
  *   **Explicit Catastrophe Risk:** Directly addressing existential risk via a separate, transparent, and reviewable parameter fulfills the fiduciary duty to acknowledge this threat more honestly and measurably than hiding it within an inflated constant discount rate.
  *   **Avoids Extreme Devaluation:** A flat 4% rate renders projects with benefits beyond ~75 years essentially worthless *regardless of their potential scale or importance*. This extreme devaluation seems fundamentally at odds with the purpose of a "permanent endowment" funding "long-term projects" to "help future generations." Our duty is to *all* future generations, not just the next few.
  *   **Focuses Risk Where it Belongs:** Fiduciary prudence is better served by rigorous project-specific risk assessment (failure risk) than by applying an inappropriately high blanket discount rate that distorts comparisons between all long-term projects.

  ### If the Real Issue is Framing

  The most fundamental issue *might* be expecting a single rate (or schedule) to mechanically rank all grants. **Discount rates are inherently value-laden tools, especially over centuries.** A rigid formula applied blindly risks obscuring critical ethical and strategic judgments.

  **What We Should Decide Instead (if reframing is possible):**
  Adopt the declining schedule *as a starting framework*, but **mandate explicit qualitative deliberation for any grant where benefits peak beyond 50 years.** The quantitative result using the schedule would inform, but not dictate, the final ranking. Trustees must explicitly debate and justify deviations based on the project's unique long-term significance, alignment with the charter's spirit regarding intergenerational equity, and the plausibility of its very-long-term impact, given the explicit catastrophe risk parameter. This forces the ethical and strategic debates into the open rather than burying them in rate parameters.

  ### Conclusion

  The recommended declining schedule, combined with explicit separation of catastrophe risk and project failure risk, offers the most principled, transparent, and practically prudent approach. It honors our ethical duty to future generations (0% PTP), acknowledges economic reality and uncertainty (declining growth adjustment), addresses existential risk responsibly (explicit parameter), focuses fiduciary prudence where it matters (project due diligence), and avoids the extreme distortions of both a flat high rate and a simplistic zero-rate approach. We should adopt this schedule and revisit it regularly, ensuring our evaluation framework evolves with our understanding of the long-term future we aim to shape.
