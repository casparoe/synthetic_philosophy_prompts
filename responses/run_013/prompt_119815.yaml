  The chronic pain psychologist's functional objection: if distress is separable, why do treatments targeting sensation work? Reply: they often affect both, but precision requires targeting affect. Soft spot: current treatments are blunt instruments.

  The "nightmare question" would be about evolutionary purpose – why would non-distressing pain exist? This is tricky because asymbolia is pathological, not adaptive. The reply must admit it's maladaptive while insisting it reveals structural separability. Soft spot: it feels defensive.

