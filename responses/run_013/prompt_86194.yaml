  Key constraints from the query:
  - Must avoid two false simplifications: pretending "we're all one people" or acting like the referendum's legitimacy is self-evident
  - Cannot make new citizens feel like political pawns
  - May take a position on the referendum only if it emerges from the boundary problem logic
  - Needs 7-9 minute spoken-word rhythm

  Hmm... the philosophical knot here is fascinating. The referendum's outcome will determine whether some attendees could have voted on it - that recursive loop is inescapable. But the naturalization ceremony offers a unique perspective because it represents a separate, non-electoral path to belonging. 

  I should structure the speech like an expanding circle: 
  First ring: Celebrate naturalization as a deliberate act of mutual commitment (different from residency)
  Second ring: Acknowledge the referendum as a different question about local voice
  Third ring: Show how both processes reveal democracy's fundamental tension - that boundaries precede decisions

  The pivot should come when admitting the mayor can't resolve the paradox, but can model how to hold it: by honoring both the solemnity of citizenship and the unsettledness of the voting question. 

  If taking a position, it must derive from the premise that denying participation to long-term residents creates a deeper legitimacy problem than including them - not because inclusion is inherently right, but because exclusion perpetuates the circularity trap. 

  Language must balance precision with warmth. Metaphors like "seams" of democracy or "living document" of community could help. Crucially, the welcome to new citizens needs to feel undiminished by the referendum discussion - perhaps by emphasizing their unique position as having crossed both thresholds.
answer: |-
  Good morning, Harborview! What a profound privilege it is to stand before you today – a room brimming with hope, pride, and the culmination of remarkable journeys. To our newest citizens: welcome. Welcome to the rights, the responsibilities, and the remarkable promise of American citizenship. This moment belongs to you, to your families who supported you, and to the enduring ideal that brings us all together: E pluribus unum. Out of many, one.

  Today, we officially recognize your choice. Your choice to cast your lot with this nation, to embrace its history – the magnificent and the difficult – and to commit to shaping its future. You didn’t just arrive; you chose. You studied. You took an oath. This citizenship is not merely residency extended; it is a bond forged, a conscious act of joining. We celebrate that deliberate act.

  And yet, as I look around this room, I see more than just new citizens. I see neighbors. I see Harborview. I see faces that have shaped this city for decades and faces that are just beginning to leave their mark. I see people deeply invested in our shared home, its streets, its schools, its future. I see a microcosm of the vibrant, sometimes noisy, often challenging, but ultimately vital conversation that *is* democratic life.

  This brings me to something that weighs on my mind, not just as your Mayor, but as someone who believes deeply in the messy beauty of self-governance. Next week, Harborview votes on a referendum. It asks whether residents who have lived here for at least five years, but are not yet citizens, should have the right to vote in our municipal elections – elections about local schools, parks, zoning, and taxes.

  Ordinarily, a Mayor might stand here and offer a simple endorsement or condemnation. Or perhaps avoid the topic entirely, keeping the ceremony pristine. But the very nature of this moment, and the question itself, makes simplicity impossible. It forces us to confront a fundamental puzzle at the heart of democracy – a puzzle I wrestled with long before becoming Mayor, and one that feels particularly vivid today. Philosophers call it the "boundary problem."

  Think about it: Democracy asks "the people" to decide. But *who* are "the people"? Who gets to draw the circle that defines who gets to vote on the decisions that affect the community? It’s a question that seems to chase its own tail. Because any vote *on* who belongs in the demos – the voting body – is itself decided *by* the demos as it’s currently defined. The voters deciding the boundaries are themselves the product of the existing boundaries. It’s a circle, tightly drawn.

  Here in Harborview, that circle feels especially present today. Because next week, the electorate defined by our current rules – citizens residing here – will decide whether to extend voting rights to a group of long-term residents. Some of those very residents are sitting right here, today, crossing the threshold into citizenship. Tomorrow, they *will* be part of that voting body. But next week, they are not yet eligible to vote on a measure that directly concerns their participation in decisions that shape the city they call home, the city they’ve lived in, worked in, and contributed to for years.

  This isn't just politics. It’s the structural knot of democracy itself. How do we legitimize the rules about who makes the rules? I cannot stand here and simply declare, "We are all one people already," brushing aside the very real legal and political distinctions that exist, distinctions that define this ceremony itself. Citizenship *means* something specific, something you have earned today through profound effort. To ignore that is to dishonor your achievement.

  Equally, I cannot pretend the referendum’s legitimacy is obvious or simple. Its outcome will be decided by a group defined by the *current* boundary, potentially changing the boundary for future decisions. There is an inherent tension there, a circularity that philosophers rightly point out. It lacks a perfectly clean, logical foundation outside the commitment we make *to each other* to abide by the process, flawed as the starting point may be.

  So, what does this mean for us today, in this moment of celebration?

  It means acknowledging the complexity. It means honoring the distinct significance of the citizenship oath you take today – a formal, national bond you have chosen. And it means recognizing the genuine stake held by our long-term non-citizen residents in the daily life of Harborview – a stake grounded in presence, contribution, and shared community, even before the formal bond of citizenship is forged. Both realities are true. They coexist in this room.

  The boundary problem reminds us there is no perfect, neutral starting point handed down from on high. Democracies are built on seams – seams between residency and citizenship, between the present electorate and the future community, between the ideal of inclusion and the practical realities of defining membership. Harborview is wrestling with one of those seams right now.

  As Mayor, my role isn't to solve the unsolvable philosophical puzzle from this podium. My role is to welcome you, our newest citizens, with the full respect and admiration your journey commands. My role is also to acknowledge the difficult, important conversation our city is having, a conversation rooted in that very puzzle.

  This referendum forces us to ask: How wide do we draw Harborview’s circle of local decision-makers? How do we balance the profound significance of national citizenship with the tangible realities of local life lived together over years? There are strong arguments on all sides. But the boundary problem itself offers a crucial insight: **A democracy that permanently excludes long-term residents who are deeply woven into the fabric of the community, who are subject to its laws and contribute to its well-being, creates a more profound and persistent legitimacy gap than one that grapples with the circularity of extending the franchise.**

  To deny a voice indefinitely to those who share the burdens and benefits of local life is to entrench a division that the democratic process itself cannot heal from within the existing circle. It risks making the circle a wall. Including long-term residents in municipal decisions – decisions about the streets they walk, the parks their children play in, the local taxes they pay – isn’t about diminishing the value of citizenship you achieve today. It’s about recognizing that local governance has its own texture, its own immediate impact, and that those who are integral to the community’s daily life deserve a say in shaping it, even as they pursue, as you have, the separate and profound path to national citizenship.

  Therefore, while I celebrate your new citizenship today as a unique and hard-earned national bond, I will be voting "Yes" on the referendum next week. Not because it solves the boundary problem – it doesn’t – but because, in this specific context, for our local Harborview community, it represents a more honest attempt to align the circle of those making local decisions with the circle of those living the consequences of those decisions every single day. It acknowledges the reality of our shared home.

  But today? Today is about you. Today is your day. To our newest American citizens: Congratulations. Your journey inspires us all. You remind us what this nation represents – not perfection, but the enduring, challenging aspiration toward a more perfect union. You are now formal partners in that grand, ongoing project. Harborview is honored to call you neighbors, and America is stronger for calling you citizens. Go forth, participate, contribute, and help us build the future – together.

  Thank you, and God bless you all.
