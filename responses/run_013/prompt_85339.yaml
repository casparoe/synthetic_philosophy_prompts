answer: |-
  **(Delivered with calm, direct eye contact, pacing slightly, hands occasionally gesturing to encompass the room)**

  Good morning. Welcome. To those who traveled, thank you for the journey. To those who carved out this time from demanding schedules, thank you for the commitment. My name is [Your Name], from [Your Foundation], and alongside my co-chair [Co-Chair's Name, if appropriate, otherwise omit], it’s our privilege to open this conversation today.

  We stand together in this room – scholars who dissect belief, funders who allocate resources, practitioners who build community, storytellers who shape understanding – all drawn by a shared, gnawing question captured in our title: *Who Keeps the Promise Now? Religion, Secularism, and the Bonds of Trust.*

  It’s a powerful question. And it feels urgent. But this morning, I don't want to rehash the familiar debate you already know: the studies about giving, the arguments about in-groups and out-groups, the correlations versus causations, the Scandinavian counterpoints. We could recite those positions for hours and leave no wiser about what the title *really* demands of us.

  Because I suspect our title isn't one question. It’s at least three, wearing a single coat. And confusing them leads us to talk past each other, using the same words to mean profoundly different things. So, for the next ten minutes, I ask you to hold the familiar debate lightly, and step with me into a narrower, perhaps harder, but hopefully more fruitful space.

  First: Do people who practice a religion, *on the whole*, behave in ways that *we*, looking in from the outside, would call "better"? "Better," that slippery word. More generous? More honest? More actively engaged in caring for others, especially those who cannot repay the favor? This is a question about observable patterns, about outcomes measured against an external yardstick. It’s where much of the existing research lives. But answering it only gets us so far.

  Which leads us, inevitably, to the second question: If we *do* observe a pattern, *why*? Does the practice of religion *shape* people towards that "better" behavior? Or does it primarily *attract* and *retain* people who were already inclined that way? Is it the water, or the swimmers drawn to that particular pool? This is a question about mechanisms, about cause and selection. It’s fiendishly difficult to untangle, but essential if we want to understand what’s truly generative.

  But there’s a third question lurking, one I think we often avoid because it’s messy, perhaps uncomfortable: If the practice *does* shape behavior – if it *does* make a difference – *what part of it is actually doing the work*? Is it the specific moral teachings? The sacred texts? The rituals? Or is it something else entirely? The tangible *community* that forms? The constant, gentle pressure of being *known* within that community? The simple fact of a *weekly appointment* with people who would notice your absence? The scaffolding of habit, expectation, and mutual observation – perhaps reinforced by an awareness of being watched, humanly or divinely? Call this the "scaffolding hypothesis." It suggests something provocative: that much of a tradition’s power might reside not primarily in its specific theological *content*, but in the intricate *structure* it provides for living. And that implication hangs heavy: if the *scaffold* is key, could a secular society rebuild it using different materials? At which point, the unavoidable follow-up: *what* materials?

  This immediately forces us to confront the word "better." We cannot glide past it. A religious community measures "better" against its own internal compass – fidelity to its specific code, its understanding of the divine will. It may be entirely unmoved by an external study showing its members are no kinder to strangers than anyone else; that wasn't its primary metric. *Our* yardstick, often presented as neutral, is external: measurable behavior towards others, especially the vulnerable, the stranger, those who cannot reciprocate. These are *not* the same instrument. And we need to sit with the discomfort that brings – including the discomfort of recognizing that we secular funders, in our zeal for measurement, often smuggle in our own conception of the "good," committing our own subtle version of the imposition we readily critique in others. What counts as evidence for "better" depends entirely on *who is measuring, and why*.

  Which brings us, inevitably, to **trust**. It’s the final clause in our title, and arguably, the heart of the matter. For the next two days, I propose we hold onto a crucial distinction, a lens I hope proves useful: the difference between trusting someone because you can *predict* them, and trusting someone because you count on their *goodwill*.

  The first kind of trust – *predictability trust* – thrives on systems. It’s built by incentives, contracts, clear laws, transparent processes, the weight of reputation. It’s the trust that markets and states generate, often in vast quantities. It scales. When people lament a collapse in trust today, I suspect they often mean a fraying of this kind – a sense that only the brittle trust of predictability remains, that goodwill is in retreat. It’s essential, but it’s not the whole story.

  The second kind – *goodwill trust* – is different. It’s the trust that someone *wants* to do right by you, that they would have to be actively persuaded to let you down. It’s the trust that flows from perceived shared commitment, from a sense of mutual care, even obligation. This is the trust that small communities – religious congregations, tight-knit neighborhood groups, intense civic associations – often seem uniquely capable of nurturing. It’s sticky, personal, harder to quantify, and notoriously difficult to replicate at scale in purely secular institutions. I have yet to see it manufactured reliably outside those intimate, often value-laden contexts. If you believe I’m wrong about that – if you know of secular institutions generating deep, scalable goodwill trust – then this workshop is the perfect place to name them. We desperately need those examples.

  So, where does this leave us? Who keeps the promise? Our foundation, like others represented here, has invested significantly in trying to build secular alternatives to the functions traditionally filled by congregations: creating community, designing meaningful ritual, facilitating mutual aid, establishing that vital "weekly appointment." We’ve bet on the possibility of the scaffold without the specific doctrine.

  As we begin these two days, I ask you to hold that effort, and this whole conversation, with a specific unease. Let’s look clearly at the three distinct questions tangled in our title. Let’s interrogate what we mean by "better," feeling the friction between internal fidelity and external measurement. Let’s dissect trust, asking not just *if* it exists, but *what kind* of trust we observe, or yearn for, or fear we’ve lost.

  And let’s end this opening by confronting the cost of our assumptions. My own foundation’s work rests on a massive, largely unproven hypothesis: that the essential scaffold of community, habit, and mutual accountability *can* be rebuilt without the doctrines that historically clothed it. That the materials of secular life – reason, shared projects, perhaps even new rituals – are sufficient. It’s a necessary experiment. But it *is* an experiment. And if we are wrong – if the scaffold and the doctrine are more intertwined than we admit, or if goodwill trust cannot be engineered this way at scale – then we risk spending a decade, and considerable resources, slowly discovering that the structure we built lacks the strength to bear the weight we need it to hold.

  That’s our shared, uneasy starting point. Not with answers, but with sharper questions. Not with reassurance, but with a productive, specific tension. Let’s begin. Thank you.
