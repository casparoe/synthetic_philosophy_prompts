answer: |-
  Below is a decision procedure designed as a step-by-step audit for evaluating proposed voting rules. It focuses on specific failure modes (not just Arrow's Theorem) and is structured as a checklist of questions. Each question must be answered with evidence (e.g., a clear example, counterexample, or logical reasoning). If a rule fails any "flat no" question, it is rejected. If it passes all "flat no" questions but hits a "value choice," the group must debate the trade-off. The procedure prioritizes practical constraints (e.g., no full rankings of 200 candidates).

  ---

  ### **Decision Procedure: Voting Rule Audit**
  **Key**:  
  - ✅ = Passes (no evidence of failure)  
  - ⚠️ = Conditional (depends on implementation; requires group discussion)  
  - ❌ = Fails (flat no; rule rejected if any ❌)  
  - 🔄 = Value choice (not a fact; group must decide trade-offs)  

  1. **Does the rule require voters to submit full rankings of all candidates?**  
     - ❌ If **yes** → Reject immediately. (Half the readers barely skim files; ranking 200 candidates is infeasible.)  
     - ✅ If **no** → Proceed.  

  2. **Does the rule satisfy the Condorcet winner criterion?**  
     - *Rationale: If a candidate beats every other in head-to-head matchups, they should win.*  
     - ✅ If **yes** → Proceed.  
     - ⚠️ If **no** → Not rejected, but note: Rule may ignore consensus favorites. Proceed.  

  3. **Is the rule vulnerable to the spoiler effect (Independence of Irrelevant Alternatives)?**  
     - *Test: If candidate X beats Y in a vote, can adding a new candidate Z change the outcome between X and Y?*  
     - ❌ If **yes** → Reject. (Adding/removing candidates alters fairness.)  
     - ✅ If **no** → Proceed.  

  4. **Does the winner depend on the order of pairwise comparisons (path dependence)?**  
     - *Test: If the rule uses sequential runoff rounds, does changing the matchup order change the final winner?*  
     - ❌ If **yes** → Reject. (Agenda-setting can manipulate results.)  
     - ✅ If **no** → Proceed.  

  5. **Can a single voter override the group (dictatorship risk)?**  
     - *Test: Is there any scenario where one voter’s ballot forces a win for their top choice, regardless of others?*  
     - ❌ If **yes** → Reject. (Violates core fairness.)  
     - ✅ If **no** → Proceed.  

  6. **Does the rule rely on scores (cardinal data) instead of rankings (ordinal data)?**  
     - 🔄 If **yes** → Acknowledge: Scores allow intensity of preference but are manipulable (e.g., strategic high/low scores). Group must decide if trade-off is acceptable.  
     - 🔄 If **no** → Acknowledge: Rankings avoid score manipulation but may ignore preference strength. Group must decide.  

  7. **Can ties occur? If so, how are they broken?**  
     - ⚠️ If **ties possible** → Must specify a tiebreaker (e.g., chair’s vote, coin flip). If chair breaks ties, note: This concentrates power in one person. Group must accept or modify.  
     - ✅ If **no ties possible** → Proceed (rare).  

  8. **Does the rule require proportional comparisons (e.g., Borda counts, ranked pairs) for >3 candidates?**  
     - *Rationale: Complex methods often fail tests above or require full rankings.*  
     - ❌ If **yes and requires full rankings** → Reject (violates Question 1).  
     - ⚠️ If **yes but feasible** → Run through all tests.  

  ---

  ### **Audit Results for Proposed Rules**
  #### **Rule (a): Average score with chair breaking ties**  
  - Q1 (Full rankings?): **No** → ✅  
  - Q2 (Condorcet winner?): **No** → ⚠️ (*Example: A polarizing candidate with high/low scores may lose to a "meh" candidate, even if they beat all head-to-head.*)  
  - Q3 (Spoiler effect?): **Yes** → ❌  
    - *Evidence: Adding a candidate with extreme scores can shift averages. E.g., Candidate X averages 8.0, Y averages 7.9. If a new candidate Z (average 2.0) is added, voters who scored X high might lower X to 7 to "balance," making Y win. X loses due to Z’s presence.*  
  - **Stop here. Rule (a) fails Q3 (spoiler effect). Rejected.**  

  #### **Rule (b): Two-round runoff (top two by average score face off)**  
  - Q1 (Full rankings?): **No** → ✅  
  - Q2 (Condorcet winner?): **No** → ⚠️ (*Example: Condorcet winner might not make top two if scores are polarized.*)  
  - Q3 (Spoiler effect?): **Yes** → ❌  
    - *Evidence: Adding candidate Z can knock Condorcet winner out of top two. E.g., X beats all head-to-head but has middling scores. Z enters, splits X’s supporters, and X misses top two. Y (weaker) wins runoff.*  
  - **Stop here. Rule (b) fails Q3 (spoiler effect). Rejected.**  

  #### **Rule (c): Weighted rankings by years of service**  
  - Q1 (Full rankings?): **Yes** → ❌  
    - *Evidence: Requires every reader to rank all 200 candidates. Half barely skim files → infeasible.*  
  - **Stop here. Rule (c) fails Q1. Rejected.**  

  ---

  ### **Where the Procedure Can't Help: The "Gray Zones"**  
  This audit catches egregious flaws but **cannot resolve value conflicts** or **guarantee fairness**. You will still need to make judgment calls on:  
  1. **Trade-offs between criteria**: E.g., If a rule avoids spoilers (Q3) but fails Condorcet (Q2), is that acceptable? Arrow’s Theorem proves no rule satisfies all criteria simultaneously—your group must prioritize what matters most (e.g., simplicity vs. robustness).  
  2. **Practical implementation**: The audit assumes voters *can* provide scores/rankings as required. If readers won’t invest effort (e.g., scoring 200 candidates honestly), even a "passing" rule fails in practice.  
  3. **Strategic voting**: No rule here is strategy-proof. Average scores invite exaggeration; rankings invite burying rivals. The audit flags this in Q6, but mitigating it requires cultural norms, not math.  
  4. **Tiebreakers**: If ties are broken by the chair, some will call it "undemocratic." The audit notes this (Q7) but cannot resolve it—your group must accept the chair’s authority or choose randomness.  

  **Recommendation**:  
  - Before the meeting, run this audit on any new proposals. Reject rules that fail ❌ questions.  
  - For rules passing the audit but hitting 🔄/⚠️, frame discussions around trade-offs (e.g., "This rule avoids spoilers but may not reflect strong preferences—are we okay with that?").  
  - If all rules fail (as above), consider simpler options like **approval voting** (voters approve/reject each candidate; most approvals wins):  
    - Audit: Passes Q1 (no rankings), usually passes Q3 (rare spoilers), fails Q2 (Condorcet) but simple. Brevity suits your readers.  
  - Finally, explicitly state when you’re making a judgment call: *"Given Arrow’s Theorem, all rules have flaws. I’ve rejected options that fail our core tests, but among the rest, I choose [Rule X] because [practical reason]. We’ll review next year if issues arise."*  

  This procedure won’t end debates—but it will ground them in tangible problems, not abstract math.
