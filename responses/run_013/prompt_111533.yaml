    reason: The dissolution group's question is about the set of Nash equilibria in the normal form, which includes cooperative outcomes. The relocation group's question imposes sequential rationality, which leads to the backward-induction outcome.

  what_would_move_it:
    - intervention: Build a formal model of the program game as a normal-form game and show that there are multiple Nash equilibria, including cooperative ones.
      why_it_might_work: It would demonstrate that the dissolution group is formally correct about the range of possible outcomes.
      cost: Requires both sides to accept the normal-form representation as the appropriate model.
    - intervention: Build a model as an extensive form with the requirement that the program must be sequentially rational at every node, and show that the unique subgame perfect equilibrium is immediate taking.
      why_it_might_work: It would validate the relocation group's concern about sequential irrationality at unreached nodes.
      cost: The dissolution group may argue that this requirement is artificial because the nodes are not actually reached in the program game.

  what_would_not_move_it: 
    - "Rehearsing the standard centipede game arguments"
    - "Arguing about human rationality"
