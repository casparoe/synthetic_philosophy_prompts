prompt: |-
  Hey, I'm trying to put together a short research proposal — like two pages — for a small interdisciplinary workshop my department is running on longtermism and decision theory, and I've got a half-baked idea I'd love you to turn into something concrete. Here's the gist. There's a whole family of arguments that we should care enormously about the far future because the expected number of lives at stake is astronomical, and then a whole family of worries — the fanaticism or Pascal's-mugging style worries — that this kind of reasoning lets tiny probabilities of enormous payoffs swamp everything else. Seperately, there's Bostrom's simulation argument: roughly, at least one of (we go extinct before running sims, we wouldn't run them, or we're probably simulated) has to hold. My hunch is that these two literatures barely talk to each other, and that when you put them together something interesting happens to the fanaticism worry — like, if there's a decent chance we're in a simulation, then either the stakes aren't really ours to control (the simulators might just switch us off or fork us), or the value of the far future is being computed over the wrong reference class, and either way the astronomical stakes that fuel fanaticism might get quietly capped. But I don't have the argument yet and I'm honestly not sure it's even coherent.

  I'd like you to write the proposal as if you were me. It needs a precise statement of the question (something with a determinate answer, not just "explore the relationship between X and Y"), an explanation of why the existing positions on both sides leave it genuinely open rather than already settled, the actual approach I'd take — what I'd do, in what order, over roughly a semester — and why that approach rather than the obvious alternatives (rather than just doing formal decision theory, say, or just surveying what longtermists already believe). Tell me what a successful result would look like and, just as important, what would count as the project failing or the hunch turning out to be confused. And keep it honest about scope: if the real version of this is a dissertation and not a workshop paper, say so and tell me the workshop-sized slice of it.

  Couple of constraints: don't give me a bibliography or a reading list, I'll add the citations myself, and don't lean on any particular paper's exact claims as if I've read it — I want the proposal to stand on the shape of the arguments. Also please don't just hand me the standard longtermism-versus-anti-fanaticism stuff; I want the simulation angle to do real work, so if you think it can't, tell me that instead of padding it out.
