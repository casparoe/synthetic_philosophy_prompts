answer: |-
  Here’s a focused, two-page-ready research proposal drafted as you requested—sharpening your hunch into a concrete question and approach. It avoids rehashing standard debates and forces the simulation argument to do the heavy lifting:

  ---

  **Research Proposal: Simulated Constraints on Longtermist Fanaticism**  

  **1. Core Question**  
  *Does the possibility that we inhabit a simulation materially constrain the "astronomical stakes" used to justify fanaticism in longtermist decision theory—specifically, by introducing a non-diminishing probability that our actions cannot affect the true long-term future?*  

  **2. The Gap in Existing Work**  
  Existing critiques of longtermist fanaticism focus on *epistemic* or *decision-theoretic* flaws (e.g., unbounded utility functions, dubious probability assessments). Conversely, standard longtermism often treats the simulation hypothesis as a curiosity or a reason to prioritize digital welfare, **not** as a structural constraint on agency. *Neither side systematically examines whether simulation scenarios inherently cap the "actionable" value of the far future*, rendering extreme sacrifices for tiny probabilities of vast payoff incoherent. The simulation argument isn’t just another input to expected value calculations—it potentially reshapes the agent’s relationship to the very stakes they are trying to influence.  

  **3. The Core Argument (To Be Developed)**  
  If we assign non-negligible credence to being in a simulation:  
  - **Option 1 (Loss of Control)**: Simulators may terminate, alter, or fork our timeline arbitrarily. Our actions might be "overwritten," making the astronomical future *not ours to save*.  
  - **Option 2 (Incorrect Reference Class)**: The "value" we generate might primarily affect simulated minds whose existence/persistence is controlled by simulators. The true long-term value at stake could be orders of magnitude smaller than calculated (e.g., confined to our sim-box).  
  **→ Fanaticism Constraint**: If either dynamic holds, the *leveragable* expected value of influencing the far future plateaus well below "astronomical," neutralizing fanaticism’s force.  

  **4. Approach (Semester Timeline)**  
  *Phase 1: Map the Simulation-Induced Constraints (Weeks 1-4)*  
  - Formalize distinct simulation scenarios relevant to agency loss: **Termination Risk** (simulator shuts us down pre-posthumanity), **Manipulation Risk** (simulators overwrite our influence), **Value Fragmentation** (our actions only affect our local sim instance).  
  - Contrast these with "benign" simulation hypotheses (e.g., ancestor sims valuing authenticity).  

  *Phase 2: Integrate with Decision Models (Weeks 5-8)*  
  - Build simple decision-theoretic models where the *probability* of being in a constraining simulation scenario **does not diminish** even as the purported stakes rise. Crucially, this probability isn’t just multiplied by outcomes—it structurally alters the set of outcomes the agent can affect.  
  - Test whether this "capping effect" robustly holds against attempts to "re-fanaticize" (e.g., "But what if simulators reward altruistic sims?").  

  *Phase 3: Test Against Core Fanaticism Cases (Weeks 9-12)*  
  - Apply the constraint to canonical fanaticism examples (e.g., Pascal’s Mugging for galactic civilization, tiny probabilities of near-infinite value).  
  - Quantify the *degree* of capping required to defang fanaticism under plausible credence assignments to constraining simulations.  

  *Why this approach?*  
  Pure formal decision theory would miss the *metaphysical agency shift* introduced by simulations. A survey of longtermists would likely overlook simulation scenarios as *constraints*. This approach forces the simulation hypothesis into the mechanics of fanaticism itself.  

  **5. What Success Looks Like**  
  - **Concrete Output**: A defensible model showing *how and under what conditions* simulation hypotheses impose an upper bound on "actionable" longterm value, making fanaticism obsolete for agents with moderate credence in such scenarios.  
  - **Workshop-Sized Contribution**: A clear articulation of the *capping mechanism* and its implications for one key fanaticism argument—**not** a full refutation of longtermism or resolution of Pascal’s Mugging.  

  **6. Failure Modes & Scope Limits**  
  - **Failure**: The project fails if simulation hypotheses turn out to be *always* "fanaticism-compatible" (e.g., if simulators reliably preserve causal chains or reward sacrifice). It also fails if the capping effect requires implausible credences (>50%) in highly specific simulation types.  
  - **Confusion**: The hunch is confused if "being simulated" doesn’t alter the *leverageable* reference class of value (e.g., if our actions affect simulated minds with intrinsic moral weight comparable to non-simulated ones).  
  - **Honest Scope**: The *full* argument requires resolving deep questions about reference classes, consciousness in simulations, and nested simulations. **This proposal tackles only the decision-theoretic implications of agency loss/value fragmentation.** It’s a workshop paper—not a dissertation—by rigorously defining *one plausible capping mechanism* and its fanaticism implications.  

  **7. Why This Matters**  
  If successful, this reframes the simulation argument from a speculative puzzle into a *practical tool* for moderating extreme longtermist demands. It forces longtermists to either engage seriously with simulation-induced agency constraints or justify ignoring them.  

  ---

  **Key Strengths for Your Context:**  
  - **Precision**: Targets a *yes/no* question about a *capping effect*.  
  - **Novelty**: Simulation isn’t window dressing—it’s the core mechanism for defanging fanaticism.  
  - **Honesty**: Explicit about failure modes and scope. Doesn’t overpromise.  
  - **Workshop Fit**: Delivers one sharp, debatable thesis with clear stakes for both fields.  

  **If your hunch holds**, you’ll show that simulation arguments don’t just add uncertainty—they actively *shrink* the playing field for fanaticism. **If it fails**, you’ll reveal a hidden resilience in longtermist logic. Either way, it’s a concrete step.
