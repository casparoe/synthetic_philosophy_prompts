prompt: |-
  My flatmate keeps calling himself a dialetheist just because he likes paraconsistent logic, and I think he's running two different claims together. Can you pull them apart? Which one entails the other, and can they come apart in either direction? I'm especially interested in whether there's a stable position for someone who wants to reason from inconsistent premises without the whole thing exploding — messy databases, half-broken theories, that sort of thing — but who flatly denies that any contradiction is ever true. Or does that quietly turn into dialetheism the moment you ask what the logic is supposed to be a logic *of*? Going the other way: if you really do think some contradictions are true, is a paraconsistent logic forced on you, and is it forced for the usual reason, that otherwise anything at all follows? I'd also like to know where the consistency-operator idea fits — a logic that lets you mark certain sentences as consistent, reason classically about those, and stay paraconsistent everywhere else. Is that a tool for handling inconsistent information rather than a metaphysics, or is it just dialetheism with the embarassing parts tucked away? And a side question: does the dialetheist get to keep our ordinary sense of not, or is that where the whole thing gets dodgy? At the end, say which of the two views you'd actually defend.
