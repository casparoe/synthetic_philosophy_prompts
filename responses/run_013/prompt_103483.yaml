    "position": "Current evidence does not show any neural network component satisfies all three conditions of the interventionist criterion, making realism about neural representations unwarranted.",
    "key_premises": [
      "Condition (1) (covariation) is well-supported but insufficient for representation.",
      "Condition (3) (stability) is too strong or dispensable due to degenerate model implementations.",
      "Condition (2) (specific intervention effects) fails: interventions cause nonspecific degradation or entangled changes, not feature-specific behavior tracking.",
      "Polysemantic neurons and distributed encoding prevent interventions from isolating single features."
    ],
    "decisive_condition": 2,
    "strongest_objection": "Interventions on polysemantic neurons (e.g., 'Rome' neurons in LLMs) induce thematically coherent output changes that approximately satisfy all three conditions.",
    "reply": "Such interventions lack specificity: they perturb entangled feature subspaces, causing overinclusive changes (e.g., injecting irrelevant themes) that violate condition (2).",
    "evidence_that_would_overturn_the_position": [
      "A method to intervene on a component to selectively alter one feature (e.g., 'cat ears') while leaving others (e.g., 'fur texture') invariant under fixed inputs.",
      "Demonstration that such interventions yield predictable, discrete behavior changes (e.g., modifying only ear shape in generated images) that are stable across ≥95% of trained models."
    ]
  }
  ```

  ### Key Philosophical Notes:
  - **Why Condition (2) is decisive**: It bridges correlation (condition 1) and causal structure, demanding that components act as *levers* for features. Current interventions resemble knocking out a gene with pleiotropic effects—useful but not pinpoint.
  - **Realism’s burden**: To defend discrete representations, realists must show components have *privileged relationships* with features, not just correlative or entangled ones. The interventionist criterion formalizes this.
  - **Falsifiability**: The position is overturned by evidence of interventions that isolate features *and* generalize across models, suggesting components are robust computational primitives.
