answer: |-
  ### Metaphysics Final Examination  
  **Question 5 (25 marks):**  

  Critically evaluate the *Principle of the Identity of Indiscernibles* (PII) using Max Black’s "two spheres" thought experiment as your starting point. Your essay must:  
  1. **Formulate PII** in a way that avoids rendering it trivially true *or* obviously false. Explain why certain property classifications threaten its philosophical significance.  
  2. **Analyze the modal force** of Black’s scenario: Does the mere *conceivability* of qualitatively identical spheres entail a genuine metaphysical possibility? Justify your view.  
  3. **Respond to a novel variant**:  
     - *t₁*: The universe contains two qualitatively identical iron spheres (A and B) in void space.  
     - *t₂*: The universe is qualitatively identical to *t₁*, except all properties previously associated with A now attach to B, and vice versa (e.g., "left-of-center" swaps). No new matter, positions, or qualitative markers exist.  
     Is there a *fact of the matter* about whether the spheres swapped positions? What does your answer imply about PII and *haecceitism* (the view that entities possess non-qualitative "thisness")?  
  4. **Address an objection**: A classmate argues: "One sphere is identical to A and the other isn’t, so they’re discernible after all!" Show why this fails to resolve the problem.  

  ---

  ### Model Answer (≈600 words)  

  The Principle of the Identity of Indiscernibles (PII) states that no two distinct entities share all the same properties. To avoid triviality, PII must exclude *impure properties* (e.g., "being identical to sphere A"), which are defined by reference to specific individuals. Including these renders PII vacuously true: if A has the property "being A" and B lacks it, they differ trivially. However, restricting PII to *pure qualitative properties* (e.g., mass, spatial relations) risks falsification. Max Black exploits this by describing a symmetric universe with two iron spheres sharing all qualitative properties. If such a world is possible, PII (restricted to pure qualities) fails.  

  Black’s thought experiment derives modal force from *conceivability*: we can describe a consistent, contradiction-free scenario. Yet conceivability alone is insufficient for metaphysical possibility. For instance, disembodied minds might be conceivable but metaphysically impossible if physicalism is true. Black’s case gains plausibility because it invokes only fundamental physical properties (e.g., mass, relative distance), making it harder to dismiss as incoherent. However, its possibility hinges on whether spacetime or particles *intrinsically* individuate objects without qualitative differences. If not, Black’s world may be impossible, preserving PII.  

  In the temporal variant, no qualitative difference exists between *t₁* and *t₂*, regardless of whether the spheres swapped. If they swapped, relational properties (e.g., "was left-of-center at *t₁*") transfer symmetrically; if they stayed, properties remain identical. Crucially, *no fact of the matter* exists about which scenario occurred. Any claim that "A moved right while B moved left" or vice versa *adds* information absent from the qualitative description. This commits us to *haecceitism*: the spheres possess primitive identities ("A-ness" and "B-ness") transcending qualitative properties. PII must then be rejected, as the spheres are discernible only by non-qualitative haecceities.  

  The classmate’s objection ("One is identical to A, so they’re discernible") fails because it assumes the *haecceity* it aims to prove. If "being identical to A" is a legitimate property, PII becomes trivial. But if we restrict discernibility to qualitative properties (as Black intends), haecceities cannot resolve the scenario. At *t₂*, the sphere labeled "A" has all properties that *t₁*-A had, including historical relations (e.g., "was created first"), making it qualitatively indistinguishable from *t₁*-A even if it was originally B. The objection thus presupposes non-qualitative individuation, which is precisely what PII, in its non-trivial form, seeks to avoid.  

  In sum, PII’s viability requires restricting properties to pure qualities, but Black’s spheres challenge whether such properties exhaust reality. The swap variant confirms that rejecting haecceitism forces us to deny facts about trans-temporal identity in symmetric worlds. PII survives only if all metaphysically possible worlds contain qualitative individuators – a claim Black’s scenario plausibly undermines.  

  ---

  ### Marking Scheme (25 marks total)  
  **A-grade (21–25):** Hits all cruxes, defends a coherent stance on the swap, anticipates circularity in objections.  
  **B-grade (16–20):** Explains Black well but flounders on the swap/haecceitism link or modal force.  

  | **Key Moves**                                                                                                | **Marks** | **Common Mistakes (Mark Deductions)**                                                                 |  
  |-------------------------------------------------------------------------------------------------------------|-----------|--------------------------------------------------------------------------------------------------------|  
  | **1. Formulates PII** avoiding triviality (excludes impure properties) *and* obvious falsehood (restricts to qualitative properties). Explains why this is necessary. | 8 | Fails to define impure/qualitative distinction (-4); Allows trivializing properties (-3). |  
  | **2. Analyzes modal force**: Distinguishes conceivability from metaphysical possibility; evaluates whether Black’s description suffices for possibility. | 7 | Assumes conceivability entails possibility without justification (-3); Ignores the physical plausibility of Black’s world (-2). |  
  | **3. Swap case verdict**: States whether a fact of the matter exists and *why*. Links answer to haecceitism and PII’s plausibility.                                 | 6 | Claims "they swapped" or "stayed" without justifying how we could know (-3); Fails to mention haecceitism (-2). |  
  | **4. Objection response**: Refutes the classmate by exposing circularity (haecceity presupposition) or trivialization.                                        | 4 | Accepts the objection uncritically (-3); Invokes "identity over time" without analysis (-2). |  

  **Clarity/Structure:** Penalize up to -2 for disorganization or significant ambiguity.  

  ---  
  **Rationale**:  
  - Top marks require *synthesizing* the impure property point (move 1), modal epistemology (move 2), and haecceitism (move 3).  
  - The swap scenario forces the haecceitism commitment: if no fact exists, qualitative properties exhaust reality (anti-haecceitism), sinking PII. If a fact exists, haecceitism holds and PII is trivial.  
  - The objection tests if students spot question-begging haecceities – a common oversight even in strong essays.  

  This question ensures mastery by demanding precision on properties, modal reasoning, and application to unseen problems – exactly what an upper-level metaphysics exam should do. Good luck with the grading!
