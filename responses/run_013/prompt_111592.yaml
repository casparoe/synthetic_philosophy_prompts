prompt: |-
  I'm a science-and-ideas reporter, and a big chunk of my job lately is sitting in on expert panels — for the last six months it's been a hospital research-ethics board and a grant-review panel at a funding agency, and before that a long run of city planning meetings — and I keep running into a shape of thing that I don't have a word for, and it's starting to bother me because I can't write the sentence without the word. The cleanest version is the ethics board. It reviews protocols one at a time and approves nearly all of them, usually 8–1 or 9–0, and on any single protocol the majority and the dissent are both making real arguments — nobody's being lazy, nobody's deferring to the chair. But when I tabulated a whole year of approvals for a piece I was doing, the board had effectively committed itself to a policy — about who bears risk, about what counts as consent — that I'm fairly sure not one member would sign their name to if you put it to them as one proposition. And here's the part I can't get past: every individual member's own voting record is internally consistent. I asked several of them. From where each one sits, their record hangs together fine. The incoherence only exists when you look at the group's output as a whole, and it's invisible from any one seat.

  Then a new chair came in and started bundling items that used to be voted on seperately, and the outcomes changed — same members, same opinions, same arguments in the room, different results. So the agenda, the order, the bundling are doing real work, not just the reasons being offered. I got the same feeling from the planning commission: each variance granted was individually reasonable, and after two years the cumulative effect was a rule that had quietly been rewritten without anyone ever voting to rewrite it. My first instincts were "that's a slippery slope" and "that's just groupthink," but neither really fits — there's no pressure and no single bad step, every step is fine on its own, and in the ethics-board case nobody's mind is even changing.

  So: is there a name for this? I have a hunch it's a known thing, maybe in the social-choice or group-decision literature, but every version I've half-remembered turns out to be about a single vote on a set of linked propositions, and mine is spread across a year of votes on unrelated cases — plus the whole business about order and bundling mattering. What I actually need is the carving, not a label: is this one phenomenon or am I lumping two together? What's it most like, and where exactly does each nearby idea stop fitting — how is it different from plain inconsistency, from a slippery slope, from a body just drifting or changing its mind over time? If nothing established covers it, coin me a term and give me its edges: what would count as a borderline case, and what's clearly outside it. Please don't hand me a reading list — I'm filing on deadline and can't chase any of it down, so just tell me directly.
reasoning: |-
  Okay, the user is a science reporter who's been observing expert panels like research ethics boards and grant-review panels. They've noticed a pattern where individual decisions seem consistent, but looking at the group's output over time, there's an incoherent policy that no member would endorse. They need a term for this phenomenon and a clear distinction from similar concepts.

  First, I need to recall if there's an existing term for this. The user mentioned social-choice theory. Arrow's Impossibility Theorem comes to mind—it shows that no voting system can perfectly translate individual preferences into a group decision without issues. But their case involves sequential decisions, not a single vote. 

  Path dependence fits because the order of decisions matters. Once an initial case sets a precedent, subsequent cases build on it, leading to a policy no one intended. The bundling part reminds me of agenda setting, where how items are grouped affects outcomes. The new chair bundling items changed results without changing opinions, which is classic agenda control.

  The slippery slope analogy doesn't work because there's no gradual decline; each step is reasonable. Groupthink isn't it either because there's no pressure to conform. The key is the structure of decision-making over time, not psychological factors. 

  The user needs to carve the concept: it's about sequential, isolated decisions accumulating into an unintended policy due to structural factors like agenda setting and path dependence. Distinguishing it from inconsistency—individuals are consistent, but the group's collective output isn't. Drift implies slow change, but here the policy emerges from discrete, reasonable decisions.

  Maybe "aggregate inconsistency" or "emergent policy incoherence" as terms. But existing terms like path dependence and agenda control are more established. The user needs a concise label for their article. Also, they need to avoid academic jargon since they're on deadline. 

  Borderline cases: if decisions were interdependent and members aware, it might be intentional. But here, each case is treated in isolation. Clear outside cases would be when a group explicitly votes on a policy upfront. 

  The user's deeper need is to succinctly explain this phenomenon to readers without academic references. They need a term that captures the essence: structure over psychology, accumulation of decisions leading to unintended outcomes.
answer: |-
  Based on your description, you're hitting **multiple interconnected phenomena from social choice theory and organizational behavior**, but the core concept you need is **Path Dependence**, amplified by **Agenda Setting** and **Aggregation Effects**. Here's the carving:

  1.  **The Core Mechanism: Path Dependence**
      *   **What it is:** Decisions made early on constrain or influence later decisions, even if later cases are different. The *order* matters. The "path" taken (the sequence of approvals) makes certain future outcomes more likely or even inevitable, leading to a collective position no individual consciously chose.
      *   **How it fits:** The ethics board's first few decisions on "risk-bearing" or "consent" set implicit precedents. Subsequent cases aren't judged in a vacuum; they're judged *relative to the path already taken*. Approving case A makes approving the slightly more aggressive case B easier ("it's not *that* much different from A"). Over time, the acceptable baseline shifts incrementally.
      *   **Your observation:** "The incoherence only exists when you look at the group's output as a whole." Path dependence explains *why* – the end point is a function of the specific sequence, not a single logical leap.

  2.  **The Amplifier: Agenda Setting & Bundling**
      *   **What it is:** How items are presented (individually vs. bundled), sequenced, and framed significantly influences outcomes. Control over the agenda is powerful.
      *   **How it fits:** The *old* method (individual votes) masked the cumulative effect and allowed path dependence to operate stealthily. The *new* chair's bundling forced members to confront the aggregate implications *simultaneously*. It made the emergent "policy" visible *before* the vote. Voting on a bundle requires evaluating the *combined effect*, exposing the inconsistency that path dependence created across separate votes.
      *   **Your observation:** "Same members, same opinions... different results." This is the *smoking gun* for agenda setting. The structure of the decision-making process itself determined the outcome.

  3.  **The Result: Aggregate (or Emergent) Policy Incoherence / Unintended Rule Evolution**
      *   **What it is:** The collective output of numerous, seemingly reasonable, individual decisions leads to a group-level policy or norm that is logically inconsistent, unintended, and unrecognized by the individuals making the decisions.
      *   **How it fits:** This is the *outcome* of path dependence operating under a specific agenda structure (individual voting). Each "no" vote on a specific case might be internally consistent for a member, but the *sum* of the "yes" votes by the *majority* across different cases creates a de facto rule that none of them would endorse as a single proposition. The "rule" emerges from the aggregate, not from deliberate design.

  **Distinguishing It From Nearby Ideas:**

  *   **Plain Inconsistency:** This is *individual* inconsistency (e.g., a member votes "yes" on case A and "no" on case B, even though A and B are identical in relevant aspects). *Your case* involves *individual consistency* but *collective/aggregate inconsistency*.
  *   **Slippery Slope:** Implies a *foreseen* or *logically inevitable* decline once the first step is taken. *Your case* involves *unforeseen* consequences of *many* small, individually reasonable steps. There's no "slope" perceived at the time; each step is level ground. It's about *unintended accumulation*, not *predicted descent*.
  *   **Groupthink:** Requires *social pressure* to conform, suppression of dissent, and an illusion of unanimity. *Your case* explicitly states no pressure, no deference, real arguments, and dissent (even lone dissenters). The incoherence arises structurally, not psychologically.
  *   **Drifting or Changing Minds:** Implies individuals or the group *consciously evolving* their stance over time. *Your case* emphasizes "nobody's mind is even changing." The *output* drifts due to the decision *process*, not shifting *inputs* (opinions).
  *   **Precedent:** While precedent plays a role in path dependence, it's usually understood within a formal system (like law) and often consciously applied. *Your case* highlights the *informal, cumulative, and unintended* nature of the precedents created by the sequence of approvals.
  *   **Arrow's Impossibility Theorem (Social Choice):** This *underpins* the problem. Arrow proved that no voting system can perfectly translate individual preferences into a coherent group preference under certain fairness conditions. Your observation is a *real-world manifestation* of this impossibility – the aggregation of individual, consistent judgments across multiple decisions fails to produce a coherent group policy. The agenda setting aspect shows how the *method* of aggregation (sequence, bundling) drastically changes the outcome.

  **The Carving: One Core Phenomenon, Key Amplifiers**

  *   **Core Phenomenon:** **Path-Dependent Emergence of Aggregate Policy Incoherence.** (Or **Sequential Aggregation Failure**).
  *   **Key Amplifying Factors:** Agenda Structure (Individual Item Voting vs. Bundling), Lack of Explicit Policy Review, Implicit Precedent Setting.

  **Borderline Cases & Edges:**

  *   **Borderline Inside:** A committee approving budget items one-by-one based on individual merit, leading to an overall budget that exceeds limits and misallocates funds relative to stated priorities, despite each member consistently applying "value for money" and "priority alignment" in each vote.
  *   **Borderline Outside (But Related):** A group explicitly voting on a set of linked propositions *simultaneously* and experiencing Condorcet's Paradox (cycling majorities) – this is a *single-vote* incoherence.
  *   **Clearly Outside:**
      *   A group consciously debating and voting to change a rule over time (drifting/changing minds).
      *   A group where members *are* pressured to conform, leading to poor decisions on individual items (groupthink).
      *   A group where members *are* individually inconsistent in their voting on similar cases.
      *   A group that explicitly reviews and ratifies its cumulative decisions as policy periodically.

  **The Term You Can Use Today:**

  For your deadline, the most direct and descriptive phrase combining the core elements is:

  > **"Path-Dependent Policy Incoherence"**

  Or, to emphasize the structural cause:

  > **"Aggregation Incoherence via Sequential Voting"**

  **Why this fits your need:**
  *   **Path-Dependence:** Captures the crucial role of *order and sequence*.
  *   **Policy Incoherence / Aggregation Incoherence:** Describes the *outcome* – the illogical group-level position.
  *   **Sequential Voting:** Highlights the specific *process mechanism* enabling the problem (vs. a single bundled vote).
  *   It clearly distinguishes from slippery slope (no predicted descent), groupthink (no pressure), and individual inconsistency.
  *   It explains the power of the new chair's bundling – it disrupted the path-dependent sequential voting process.

  You've brilliantly identified a profound and common flaw in committee decision-making processes. It's the dark side of "case-by-case" judgment without periodic holistic review. Good luck with the piece!
