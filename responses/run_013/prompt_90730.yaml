answer: |-
  ## Research Proposal: Decomposing the Procreation Asymmetry

  **1. Core Question & Claim Type**  
  The core question is: **What minimal conceptual components are necessary and sufficient to justify the asymmetric ethical verdicts regarding procreation?** Specifically:  
  - The verdict that creating a life of unrelieved suffering is impermissible.  
  - The verdict that creating a life of net happiness is merely permissible (not obligatory).  
  - The verdict that abstaining from procreation is never impermissible *to the potential person*.  

  The answer is a claim **about the structure of normative reasons**, as this determines downstream conclusions about permissibility and value. If reasons against causing suffering function impersonally (binding regardless of beneficiaries), while reasons for causing happiness are conditional (requiring a deprived subject), this asymmetry directly generates the deontic asymmetry. Value claims (e.g., about "a life worth starting") depend on how reasons structure our response to that value.

  **2. Why Existing Positions Leave the Question Open**  
  Current debates stall because:  
  - **Defenders of asymmetry** typically bundle multiple claims (e.g., non-identity problem, impersonal bads) into a single intuition. This obscures whether all components are essential or if some do the heavy lifting.  
  - **Critics of asymmetry** often reject the entire bundle by attacking its most vulnerable component (e.g., denying impersonal reasons). This fails to engage defenses of *other* components, leaving open whether a stripped-down asymmetry might survive.  
  - **Hybrid approaches** (e.g., appeals to risk or person-affecting constraints) assume but do not isolate the core asymmetry-generating mechanism. Costs include counterintuitive implications in edge cases (e.g., creating lives barely worth living) or unresolved tensions with the continuation asymmetry.  

  This impasse persists because no framework systematically tests the *interdependence* of the asymmetry’s components against fixed intuitions.

  **3. Method: Commitment Tables & Constraint Satisfaction**  
  I will formalize the decomposition using a **commitment table** framework, executed via a custom Python script for combinatorial analysis:  

  - **Variables (Components):**  
    `S`: *Supervenience* – Welfare facts alone determine if a life is worth starting; non-existence lacks a subject for harm/benefit.  
    `R`: *Reason-Structure* – Reasons against suffering are impersonal; reasons for happiness require a deprived subject.  
    `D`: *Deontic Status* – Procreation’s wrongness is non-consensual; abstention is always permitted.  

  - **Constraints (Fixed Intuitions):**  
    `C1`: Creating intense suffering is impermissible. (Source: "Life of unrelieved suffering" case)  
    `C2`: Creating net happiness is not obligatory. (Source: "Happy life" case)  
    `C3`: No one is wronged by not being created. (Source: "Non-wronging of absence" case)  
    `C4`: Continuing a worthwhile life is obligatory. (Source: "Continuation asymmetry" case – treated as a distinct test)  

  - **Procedure:**  
    1. Define truth conditions for `S`, `R`, `D` (e.g., `R=True` iff reasons for happiness are relational).  
    2. Enumerate all 8 combinations of `(S,R,D)`.  
    3. For each combination, evaluate logical consistency with `C1-C4`.  
    4. Identify *minimal viable sets*: Combinations satisfying all constraints with fewest components.  
    5. Test robustness: If a set satisfies `C1-C3` but violates `C4`, is the violation fatal or resolvable?  
    6. Distinguish inconsistency from awkwardness via counterexample testing: Genuine inconsistency produces contradictory obligations; mere awkwardness requires ad-hoc adjustments but no logical contradiction.  

  **4. Why Decomposition Beats Head-On Arguments**  
  Head-on arguments require defending *every* aspect of the asymmetry simultaneously, making them vulnerable to "weakest link" refutations. This approach:  
  - **Avoids** needing to prove any single component’s truth universally.  
  - **Reveals dependencies**: If `C1-C3` can be satisfied without `R`, then critiques targeting `R` miss the mark.  
  - **Clarifies trade-offs**: Shows which intuitions must be abandoned if a component is rejected.  
  - **Decouples theory from intuition**: A "failed" decomposition (e.g., components are inseparable) still answers *why* the asymmetry resists analysis.  

  **5. Possible Conclusions & Decision Criteria**  
  - **Conclusion 1: `R` is load-bearing** (most likely). If only sets containing `R` satisfy `C1-C3`, then reason-structure is essential. *Decider*: Whether `C2` (no obligation to create happiness) fails if `R` is false.  
  - **Conclusion 2: `S` + `D` suffice without `R`**. If e.g., `(S=True, R=False, D=True)` works, supervenience + deontic status carry the asymmetry. *Decider*: Whether `C3` (no one wronged by non-existence) holds if `S` is false.  
  - **Conclusion 3: Inseparability** – Components only work together. *Response*: Drop `C4` if it causes inconsistency (cost: bifurcated ethics of creation/continuation) or drop `C2` if it’s unstable (cost: requiring procreation if feasible).  
  - **Conclusion 4: Mere Verbal Distinction** – Components aren’t distinct in practice. *Result*: The asymmetry is primitive; head-on defenses are unavoidable.  

  **6. Failure Modes, Scope, and Deliverables**  
  **Failure Modes:**  
  1. **Over-Discretion**: The constraints (`C1-C4`) are too vague for binary evaluation. *Mitigation*: Precisify constraints using threshold cases (e.g., "suffering" = life below neutral welfare).  
  2. **Insufficient Generativity**: The table yields no stable combinations, revealing deeper inconsistency in the intuitions themselves. *Response*: Document which constraint-pairs conflict and why.  

  **Scope and Deliverables:**  
  This project *does not* aim to resolve the asymmetry debate or derive new normative conclusions. It maps the logical landscape of existing arguments to:  
  - **Core Output**: A journal article (6,000 words) presenting the decomposition model and its implications for the debate.  
  - **Practitioner Note** (1,200 words): Guidelines for engineers/regulators on:  
    - Why creating suffering is uniquely impermissible (grounded in `C1`).  
    - Why no obligation exists to create happy lives (even if `C2` relies on contested components).  
    - How continuation duties differ from creation duties (addressing `C4`).  

  By isolating the minimal commitments needed to preserve core intuitions, this project clarifies what is truly at stake—enabling more targeted debates and principled decision-making where creation is unavoidable.  

  ---  
  *Appendix: Intuition Clarification*  
  `C4` (continuation asymmetry) is acknowledged as potentially distinct from the procreation asymmetry (`C1-C3`). The project will explicitly test whether any component set satisfies `C1-C4` simultaneously or if bifurcation is required. This is a feature, not a bug: Resolving this tension is a key objective.
