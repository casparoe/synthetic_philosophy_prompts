prompt: |-
  For my philosophy elective I'm writing a paper that reads Shirley Jackson's short story "The Lottery" through David Lewis's account of convention. My teacher's summary of Lewis is that a convention is a regularity in a group's behavior that solves a recurring coordination problem: everyone conforms, everyone expects everyone else to conform, and everyone prefers to conform given that the others do, because acting differently while others act alike would leave you worse off. She also drew a distinction I keep coming back to: a convention is held in place by coordination, whereas a norm is held in place by social pressure, so that people comply because deviation would be resented or punished rather than because the situation leaves them no better option.

  I'd like a reading of the story that takes both the story and the theory seriously. Walk through Lewis's conditions one at a time and say which ones the lottery satisfies; then say whether the lottery is best understood as a convention, a custom, or a norm, and whether the villagers' willingness to conform is really conditional on everyone else's in the way Lewis requires. I'm also interested in what the story says about change: the box predates anyone's memory and the town keeps meaning to replace it, Old Man Warner still repeats the harvest saying, nearby towns have quit, and Tessie jokes about the lottery until her own family is drawn and then insists the draw was unfair. On the story's evidence, what would end a practice like this, and does the story tell Lewis anything about how conventions and norms decay, or does it simply decline to say? Finally, tell me where the reading strains — where treating the lottery as a test case for a theory of convention distorts a story that may be about something else.

  Please structure it as follows: "The lottery as a Lewis convention" (about 300 words, working through the conditions); "Convention, custom, or norm?" (about 300 words); "How the practice ends, or doesn't" (about 250 words); "Where the reading strains" (about 200 words); and "Bottom line" (two or three sentences). I don't have the story in front of me and can't quote it, so please describe scenes rather than quoting them.
