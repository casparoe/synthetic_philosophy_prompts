prompt: |-
  Draft the joint statement that a Strawsonian and a responsibility skeptic could both sign at the close of a long, good-faith adversarial collaboration. The Strawsonian holds that moral responsibility just is a matter of the reactive attitudes — resentment, indignation, guilt, gratitude, and the demands and expectations they express toward one another — that we cannot help having toward one another, and that the further demand for a justification of those attitudes from outside any human practice is one we cannot meet and need not. The skeptic holds that the reactive attitudes are a contingent psychological fact about creatures like us, resting on a picture of agency that cannot be sustained, and that no one is ever blameworthy in the sense that would license them.

  Produce the document the two of them should have written. It should contain the following parts.

  1. Agreed claims. A numbered list of claims both parties accept: about what the reactive attitudes are and what they are attitudes toward; about what the disagreement is not about; about what each side would count as vindication, and as refutation, of its own position; and about any concessions each can make without abandoning its view. No item may be vacuous — each should rule something out.

  2. The residual disagreement, stated precisely. Break it into distinct parts, each phrased in wording that the party who holds it would accept as its own. Separate the skeptic's several possible claims from one another — that no one is ever blameworthy; that blame is never justified; that the concept of blameworthiness is empty or incoherent; and that we could and should live without the reactive attitudes — and say which of these the Strawsonian must engage and which the skeptic may abandon without loss.

  3. Cruxes. The sub-questions such that settling one would move at least one party. For each crux, state the case, argument, or evidence that both parties agree bears on it, and record each party's prediction in advance. Cover at least:

  (a) the asymmetry between blame and praise: does either account predict that praise and blame should behave alike, and does the asymmetry, if it is real, favour one side;

  (b) the localized suspension of the reactive attitudes — toward the very young, toward someone in the grip of a psychotic or manic episode, toward someone one is treating therapeutically — and what the existence and shape of these local suspensions implies about the possibility of a global suspension;

  (c) a case in which a wrongdoer's act is later explained by a treatable lesion or by severe early deprivation: what each party says about the local verdict, and about whether that verdict generalizes;

  (d) whether the skeptic's own resentment, gratitude, and guilt are evidence the Strawsonian may legitimately cite, and if so, of what.

  4. Verbal and substantive. A short closing section stating which parts of the dispute are, on reflection, verbal — turning on different senses of responsibility, blame, or justification — and which are substantive, with reasons.

  Write the finished document in the joint voice of the two parties, not as commentary on the debate. Format it as a numbered agreed-claims section followed by a disagreements table for the residual disagreement. Do not cite any literature; refer to positions and arguments by description, and assume the reader has no access to the sources.
reasoning: |-
  We are two philosophers, one a Strawsonian and the other a responsibility skeptic, who have engaged in a long, good-faith adversarial collaboration. We have discovered substantial common ground and now wish to articulate both our agreements and the precise nature of our remaining disagreement. This joint statement reflects our shared understanding.

  ## 1. Agreed Claims

  We both accept the following claims:

  1. The reactive attitudes (such as resentment, indignation, guilt, and gratitude) are natural, deeply ingrained psychological responses that human beings typically experience toward one another in response to perceived good or ill will, or to the quality of another's will as manifested in their actions. These attitudes express demands and expectations we hold toward one another as agents.

  2. The reactive attitudes are not merely private feelings; they are interpersonal and play a constitutive role in our practices of holding one another accountable and in our moral community. They are attitudes *toward* the quality of will (or lack thereof) we perceive in others or ourselves.

  3. Our disagreement is *not* about whether the reactive attitudes exist, nor about whether they are deeply woven into human life. We agree that they are real and pervasive. Nor is our disagreement about whether we can or should suppress these attitudes in specific contexts (e.g., toward the very young or the mentally ill). We both recognize that such local suspensions are possible and often justified.

  4. The Strawsonian position would be vindicated by showing that the reactive attitudes are inescapable for beings like us and that any attempt to ground them in a metaphysically robust notion of agency beyond our practices is both impossible and unnecessary. It would be refuted by showing that we can coherently and stably abandon the reactive attitudes globally without loss to our humanity or social cohesion, or by showing that the attitudes depend on a metaphysical picture of agency that is demonstrably false and that their persistence without it is irrational.

  5. The skeptic's position would be vindicated by showing that the reactive attitudes are contingent and dispensable, that they rest on an unsustainable view of agency (e.g., libertarian free will or ultimate responsibility), and that we can live without them without significant loss. It would be refuted by showing that the reactive attitudes are indispensable to human life and that any attempt to eliminate them would lead to intolerable impoverishment of our interpersonal relations, or by showing that they do not depend on any metaphysically problematic notion of agency.

  6. Without abandoning their core positions, the Strawsonian can concede that the reactive attitudes can be distorted, excessive, or misplaced, and that they sometimes rest on false empirical beliefs. The skeptic can concede that the reactive attitudes are a natural feature of human psychology and that they may have instrumental value in regulating behavior, even if they are not ultimately justified.

  ## 2. Residual Disagreement

  We have a fundamental disagreement that we break down as follows:

  | Claim | Strawsonian's Position | Skeptic's Position |
  |-------|------------------------|-------------------|
  | **A. On blameworthiness** | The Strawsonian holds that to be blameworthy just is to be an appropriate target of the reactive attitudes (such as resentment or indignation) in light of the quality of one's will. There is no further fact about "ultimate responsibility" that is required. | The skeptic holds that no one is ever *blameworthy* in the sense that would license the reactive attitudes, because the kind of agency required for such blameworthiness (e.g., contra-causal freedom or ultimate responsibility) does not exist. |
  | **B. On justification** | The Strawsonian holds that the reactive attitudes are justified by their role in our form of life; they do not require a justification from outside our practices. | The skeptic holds that the reactive attitudes are never *justified* because they presuppose a false picture of agency and because there is no fact of the matter about blameworthiness that could make them appropriate. |
  | **C. On the concept of blameworthiness** | The Strawsonian holds that the concept of blameworthiness is coherent and fully grounded in the practice of the reactive attitudes; it is not empty. | The skeptic may hold that the concept of blameworthiness (in the desert-involving sense) is empty or incoherent because it requires impossible conditions on agency. (Note: The skeptic *must* hold at least one of A, B, or C to maintain their skepticism.) |
  | **D. On living without reactive attitudes** | The Strawsonian holds that we could not live without the reactive attitudes without a radical and unacceptable transformation of human life. | The skeptic holds that we *could* and *should* live without the reactive attitudes (or significantly modify them) once we see that they are unjustified. |

  The skeptic may abandon claim D (that we should live without reactive attitudes) without loss to their core position, as long as they maintain that the reactive attitudes are unjustified (B) or that no one is blameworthy (A). The Strawsonian must engage claims A, B, and C to defend their position.

  ## 3. Cruxes

  We agree that the following sub-questions are cruxes of the debate, and we record our predictions about how evidence or arguments might bear on them:

  ### (a) Asymmetry between blame and praise
  - **Case/Evidence**: We observe that in our practices, blame and praise are not symmetrical. For instance, we often hold people responsible for harms they cause even without ill will (e.g., negligence), but we do not typically praise for good outcomes without good will. Also, we may feel it is optional to praise but obligatory to blame in certain contexts.
  - **Strawsonian Prediction**: The Strawsonian predicts that this asymmetry is consistent with their view because the reactive attitudes are primarily protective responses to harm or threat to the community, and thus blame has a prominence that praise does not. They see this as evidence of the reactive attitudes' functional role in regulating relationships.
  - **Skeptic Prediction**: The skeptic predicts that if blame and praise were both justified by a robust notion of desert, they should be symmetrical. The observed asymmetry suggests that blame is driven by retributive emotions that are not rationally grounded, while praise may be more forward-looking and thus less problematic.

  ### (b) Localized suspensions and global possibility
  - **Case/Evidence**: We observe localized suspensions of reactive attitudes (e.g., toward children, the mentally ill, or in therapeutic contexts) and note that these suspensions are based on judgments about impaired agency or excusing conditions.
  - **Strawsonian Prediction**: The Strawsonian predicts that these suspensions are exceptions that prove the rule: they are justified by the same framework of expectations and demands, and they do not generalize to global suspension because the reactive attitudes are our default mode of engagement. They argue that the very possibility of excusing conditions shows that the attitudes are sensitive to reasons and thus rational.
  - **Skeptic Prediction**: The skeptic predicts that these local suspensions show that the reactive attitudes are contingent and can be overridden by reason. They argue that if we can suspend them in some cases on the basis of discovering that agency is impaired, we might extend this to all cases upon realizing that agency is never robust enough for ultimate responsibility.

  ### (c) Explaining wrongdoing by lesion or deprivation
  - **Case/Evidence**: Consider a wrongdoer whose act is later fully explained by a brain lesion (e.g., a tumor) or by severe early deprivation that impaired their capacity for moral understanding.
  - **Strawsonian Verdict**: Locally, the Strawsonian would suspend reactive attitudes toward this person, seeing the lesion or deprivation as an excusing condition that undermines the normal quality-of-will attribution. However, they maintain that this does not generalize because in normal cases, without such impairments, the quality of will is still the proper object of reactive attitudes.
  - **Skeptic Verdict**: The skeptic would suspend reactive attitudes in this case and argue that this verdict *does* generalize: if we suspend attitudes when we find a sufficient cause (like a lesion), then we should also suspend them when we realize that all actions have sufficient causes (whether neurobiological, genetic, or environmental) that undermine the notion of ultimate responsibility. The lesion case is just a particularly vivid example of a universal condition.

  ### (d) The skeptic's own reactive attitudes
  - **Case/Evidence**: The skeptic admits to experiencing resentment, gratitude, or guilt in their own life, despite their theoretical rejection of blameworthiness.
  - **Strawsonian Use**: The Strawsonian argues that this is evidence that the reactive attitudes are inescapable and that the skeptic's own feelings demonstrate the naturalness and authority of the practice. The persistence of these attitudes even in the face of theoretical skepticism suggests that they are not contingent in the way the skeptic claims.
  - **Skeptic Response**: The skeptic concedes that the attitudes are deeply ingrained but argues that they are not evidence of justification. They are like optical illusions that persist even when we know they are illusions. The skeptic may work to manage these attitudes but does not see them as data that the Strawsonian can use to justify the practice.

  ## 4. Verbal and Substantive

  We agree that part of our dispute is verbal and part is substantive.

  - **Verbal**: Some disagreements turn on different senses of key terms. For instance, the Strawsonian uses "blameworthiness" to mean being an appropriate target of reactive attitudes within our practices, while the skeptic often uses it to imply desert based on ultimate responsibility. Similarly, "justification" for the Strawsonian is internal to our practices, while the skeptic demands an external, metaphysical justification. If we disambiguate, some apparent disagreement dissolves.

  - **Substantive**: Despite this, we have a substantive disagreement about whether the reactive attitudes, as we naturally experience them, can be rationally sustained once we understand that human agency is fully embedded in a natural world of causes. The Strawsonian says yes, because the attitudes do not require a metaphysics they cannot have; the skeptic says no, because the attitudes implicitly rely on a metaphysics that is false. This disagreement is not merely verbal; it concerns the foundations of our moral practices and whether they can survive reflective scrutiny.

  Signed,  
  [Strawsonian]  
  [Skeptic]
answer: |-
  ## Joint Statement on Moral Responsibility and the Reactive Attitudes  

  ### 1. Agreed Claims  
  We, a Strawsonian and a responsibility skeptic, jointly affirm the following non-vacuous claims:  

  1. **Nature of reactive attitudes**: Reactive attitudes (e.g., resentment, indignation, guilt, gratitude) are psychological responses to the perceived quality of will expressed in others’ actions. They are not merely emotions but embody interpersonal demands for regard and accountability.  
  2. **Target of attitudes**: These attitudes are directed toward agents capable of understanding moral demands, excluding entities like rocks or infants. They respond to actions seen as expressing ill will, good will, or indifference.  
  3. **Disagreement boundaries**: Our dispute is *not* about:  
     - The existence or psychological reality of reactive attitudes (both agree they are ubiquitous).  
     - The permissibility of locally suspending attitudes (e.g., toward children or the mentally incapacitated).  
     - Whether reactive attitudes serve social functions (both acknowledge their role in regulating behavior).  
  4. **Vindication conditions**:  
     - The Strawsonian would be vindicated by demonstrating that global abandonment of reactive attitudes is psychologically impossible or catastrophically dislocating for human social life.  
     - The skeptic would be vindicated by showing that humans can stably relinquish reactive attitudes without loss of social cohesion, or that their persistence relies on empirically false assumptions about agency.  
  5. **Refutation conditions**:  
     - The Strawsonian position would be refuted if reactive attitudes vanished globally without societal collapse, or if their conceptual core required libertarian free will.  
     - The skeptic position would be refuted if reactive attitudes proved ineliminable *and* rationally consistent without metaphysically untenable agency.  
  6. **Concessions**:  
     - The Strawsonian concedes reactive attitudes can be unjustified in specific cases (e.g., when based on misinformation) without invalidating the entire practice.  
     - The skeptic concedes reactive attitudes are deeply ingrained and not eliminable by fiat, without conceding they are justified.  

  ### 2. Residual Disagreement  
  The core disagreement is irreducible to the above agreements. Each party’s position is stated in their own terms:  

  | Claim                                                                 | Strawsonian’s Position                                                                                                | Skeptic’s Position                                                                                                                                 |  
  |-----------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------|  
  | **(A) Blameworthiness existence**:                                    | To be blameworthy *is* to warrant reactive attitudes (e.g., resentment) due to one’s quality of will; no further "metaphysical justification" is needed or possible. | No one is ever *blameworthy* in a desert-based sense (i.e., intrinsically deserving of blame) because the required agency (e.g., contra-causal freedom) is illusory. |  
  | **(B) Justification of blame**:                                       | Blame (via reactive attitudes) is justified when it accurately reflects the quality of will; its justification is internal to our practices.                                  | Blame is *never justified* because it presupposes an incoherent notion of agency; it may be explained, but not vindicated, by psychology or social utility. |  
  | **(C) Concept of blameworthiness**:                                   | The concept of blameworthiness is coherent and non-empty, fully defined within the practice of reactive attitudes.                                  | The concept of desert-involving blameworthiness is empty or incoherent; it cannot be satisfied in any possible world.                               |  
  | **(D) Abolition of reactive attitudes**:                              | Global suspension of reactive attitudes is impossible for beings like us; attempting it would undermine distinctively human relationships.        | We *could* and *should* live without reactive attitudes (or radically reform them) upon recognizing their unjustifiability; their persistence is a psychological inertia. |  

  - **Engagement requirements**:  
    - The Strawsonian must engage **(A)**, **(B)**, and **(C)** to defend their view.  
    - The skeptic may abandon **(D)** without loss (e.g., accepting attitudes as unavoidable but unjustified), but must defend at least one of **(A)**, **(B)**, or **(C)**.  

  ### 3. Cruxes  
  Settling these sub-questions would shift at least one party’s stance. Both agree on the relevance of the cited cases/evidence:  

  **(a) Asymmetry between blame and praise**  
  - **Evidence**: Praise (e.g., gratitude) is less insistent, retributive, or豁免 exempting than blame (e.g., resentment). We rarely demand "ultimate justification" for praise but often do for blame.  
  - **Strawsonian prediction**: Asymmetry arises because blame protects against harm, while praise enhances social bonds; this functional difference is consistent with their view.  
  - **Skeptic prediction**: Asymmetry suggests blame uniquely depends on a myth of "contra-causal" agency, while praise may be purely consequentialist; this undermines the Strawsonian parity claim.  

  **(b) Local suspensions and global possibility**  
  - **Evidence**: We suspend attitudes toward the mentally ill (e.g., psychosis) based on impaired agency, yet maintain them toward the "normal."  
  - **Strawsonian prediction**: Local suspensions rely on the *same* framework of expectations; they are exceptions proving the rule of non-exempt agents. Global suspension is unmotivated and unstable.  
  - **Skeptic prediction**: Local suspensions show attitudes can be overridden by evidence of causation (e.g., neurobiology). This licenses extending skepticism to all agents upon recognizing universal causal constraints.  

  **(c) Explanation by lesion or deprivation**  
  - **Case**: A person commits harm due to a brain lesion or severe childhood trauma discovered post-hoc.  
  - **Strawsonian verdict**: Locally, attitudes are suspended because the cause undermines quality-of-will attribution. This does not generalize: absent such factors, will-attribution remains apt.  
  - **Skeptic verdict**: Local suspension is justified because the cause negates "true" agency. This *generalizes*: all actions have similar causal histories (genetic, environmental), negating blameworthiness universally.  
  - **Predictions**:  
    - Strawsonian: Normal cases retain attitudes; lesion cases are outliers.  
    - Skeptic: Lesion cases exemplify universal truth; attitudes in "normal" cases reflect ignorance.  

  **(d) Skeptic’s own reactive attitudes**  
  - **Evidence**: The skeptic admits feeling resentment/guilt despite their theoretical stance.  
  - **Strawsonian use**: This shows reactive attitudes are inescapable practices, not intellectual errors; their persistence undermines the skeptic’s abolitionist program.  
  - **Skeptic response**: These feelings are evolutionary artifacts, not evidence of justification (e.g., like optical illusions). They demonstrate psychology’s resistance to reason, not the attitudes’ validity.  
  - **Agreed bearing**: If the skeptic’s attitudes persistently conflict with their principles, it challenges the practicality of their view.  

  ### 4. Verbal and Substantive  
  1. **Verbal disputes**:  
     - "Responsibility": The Strawsonian uses it descriptively (attitude-warranting); the skeptic normatively (desert-based).  
     - "Justification": The Strawsonian sees it as internal to practices; the skeptic as requiring external, metaphysical grounds.  
     Clarifying terms narrows but does not eliminate disagreement.  

  2. **Substantive disputes**:  
     - Whether reactive attitudes *necessarily* presuppose incoherent agency (skeptic’s core claim).  
     - Whether abandoning these attitudes would *destroy* human interpersonal life (Strawsonian’s core claim).  
     This is irreducible: it concerns what we can rationally sustain upon reflection about determinism, causation, and human nature.  

  ---  
  *This statement reflects our shared understanding after rigorous debate. We remain opposed on the substantive cruxes but endorse the agreed claims as a foundation for future dialogue.*  

  **Signed**,  
  [Strawsonian]  
  [Responsibility Skeptic]
