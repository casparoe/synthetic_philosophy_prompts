  Misconceptions are crucial. They mentioned several, like confusing epistemic and metaphysical possibility, or thinking primary intension is just a stereotype. For each, I need to pinpoint where it might arise in the sequence and how to preempt it. For example, when introducing epistemic scenarios, emphasize they're not about what's possible in reality but about what's conceivable given our knowledge.

