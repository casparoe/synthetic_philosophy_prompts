answer: |-
  Here is the teaching plan structured as requested:

  ### 1. Dependency Chain (Order of Ideas)
  **(1) Actual reference-fixing:** Start with how we *actually* pin down what a term refers to (e.g., "That shiny thing in the sky at dusk"). *Why first?* Grounds the discussion in concrete communication; no prior concepts needed.  
  **(2) Counterfactual scenarios:** Introduce "what if" cases (e.g., "What if the thing we *called* Venus was actually a drone?"). *Why now?* Builds on familiar hypotheticals; avoids possible-worlds jargon.  
  **(3) Epistemic possibility ("could have turned out"):** Distinguish "we didn’t know what it was" from "it could have been something else." *Why here?* Clarifies that ignorance ≠ metaphysical contingency; preempts conflating dimensions.  
  **(4) Two ways of associating reference:** Show how reference is fixed *by actual discovery* vs. how it *would track* in counterfactual scenarios. *Why last?* Steps 1–3 provide the contrast needed to see why these come apart.  

  **Traps avoided:** No possible worlds (alien), no a priori/posteriori (jargon-heavy), no Kripke cases (overexposed), no indexicals (distracting tangent).  

  ---

  ### 2. The Carrying Example  
  **The "Zap Device" (fictional artifact):**  
  - **Setup:** Scientists discover a device in the desert. They call it a "Zap Device" *because* it emits blue sparks when touching metal (reference-fixing description). Later, they learn its internal mechanism is *quantum-flux crystals*.  
  - **Must have:**  
    - A superficial reference-fixing property (blue sparks).  
    - A hidden underlying structure (crystals).  
    - Scenarios where the two diverge (e.g., a world where identical sparks come from *nanobots*, not crystals).  
  - **Must lack:** Cultural baggage (unlike water/Gödel), technicality, prior familiarity.  
  - **Extension through steps:**  
    - **Actual reference:** "Zap Device = *this* sparking thing" (Step 1).  
    - **Counterfactual:** "What if the sparks were from nanobots? Would we still call *that* a Zap Device?" (Step 2).  
    - **Epistemic possibility:** "Before opening it, it *could have turned out* to be nanobots" (Step 3).  
    - **Two dimensions:**  
      - *Dimension 1 (how reference is fixed):* In any scenario, "Zap Device" picks out whatever fits the "sparking thing" description.  
      - *Dimension 2 (how reference tracks):* In our world, it *actually* picks out quantum-flux crystals, even in counterfactual worlds.  

  **Why not classic examples?** Twin Earth/water invites chemical essentialism debates; Hesperus presumes astronomy knowledge; Gödel/Schmidt is too abstract.  

  ---

  ### 3. The Lab-Coat Case Verdict  
  **Genuine 2D structure, but use late.**  
  - **Verdict:** It’s authentic (not Twin Earth). Primary intension = what the *accepted test* would classify (epistemic). Secondary intension = the *actual pathology* (metaphysical).  
  - **Where it enters:** *After* establishing the Zap Device.  
  - **What it buys you:**  
    - Real-world relevance (clinicians engage immediately).  
    - Shows divergence: If Test A was accepted (but Test B is correct), primary intension picks Test A’s positives; secondary picks Test B’s pathology.  
    - Prevents dismissal as "just philosophy" – *but only if the Zap Device primes them first*.  

  **Repair needed only if:** The pathology is *defined by* the test (then collapse to 1D). Ensure the pathology is mind-independent.  

  ---

  ### 4. Misconception Map  
  | **Misconception** | **When it arises** | **When to head off** | **Response (1–2 sentences)** |
  |-------------------|-------------------|----------------------|----------------------------|
  | "Epistemic dimension = weak metaphysical possibility" | Step 3 (epistemic possibility) | During Step 3, after defining "could have turned out" | "This isn’t about ‘possible worlds’ being closer or farther. It’s about *our knowledge*: before we looked inside, nanobots were *epistemically* possible, but *metaphysically* impossible once we knew it was crystals." |
  | "Primary intension = stereotype/speaker’s description" | Step 4 (defining dimensions) | When contrasting dimensions | "The primary intension isn’t what’s *in our heads*; it’s how reference is fixed by the world *as we describe it*. If we misdescribe the sparks (e.g., call them ‘red’), primary intension still uses *that description*." |
  | "If water isn’t H2O in some world, science is relative" | (Pre-existing) | Step 4, when showing divergence | "This isn’t relativism! In *our world*, water *must be* H2O. The ‘could have turned out’ question just shows how we *fix* reference – like how we fixed ‘Zap Device’ with sparks, even if it turned out different." |
  | "It’s just about words like ‘I’ or ‘here’" | (Pre-existing) | Step 4, after defining dimensions | "Indexicals are *one* case, but ‘Zap Device’ or ‘schizophrenia’ aren’t indexicals. This framework explains *all* terms where how we ID something and what it *is* can come apart." |
  | "The diagonal is a third meaning" | (Likely post-session) | If asked | "The diagonal isn’t *another* dimension; it’s how primary intension behaves when we *re-evaluate* our words after discovery. ‘Zap Device’ still fixes reference by sparks, but *now we know* that picks crystals." |
  | **Missed misconception:** "Secondary intension is the ‘real’ meaning" | Step 4 | When summarizing | "Neither dimension is ‘truer’ – both are essential. We *need* the primary intension to explain why we’d call nanobot-sparkers ‘Zap Devices’; we *need* secondary to explain why they aren’t *actual* Zap Devices." |

  ---

  ### 5. Check for Understanding  
  **Question:** "Imagine we find a plant called ‘Sunspark’ *because* it glows at dawn. Later we learn the glow is caused by symbiotic bacteria. In a world where identical glowing is caused by embedded LEDs, is it a Sunspark?"  
  - **Good answer:** Distinguishes dimensions:  
    - *Primary:* Yes (fits the "glow at dawn" description).  
    - *Secondary:* No (actual Sunsparks require bacteria).  
  - **Wrong answer 1:** "No, because real Sunsparks have bacteria." → **Reveals:** Grasps secondary but ignores primary.  
  - **Wrong answer 2:** "Yes, because it looks the same." → **Reveals:** Collapses to primary only/stereotype.  

  ---

  ### 6. Left Out on Purpose  
  **Do not attempt:**  
  - Diagonal intensions (overcomplicates).  
  - Rigid designation (requires Kripkean metaphysics).  
  - Formal possible-worlds semantics (math/logic overhead).  
  - Historical descriptivism critiques (distracts from core).  

  **When asked:**  
  > *"That’s a great question, but it needs tools we don’t have time for today – like unpacking ‘rigidity’ or the diagonal. For now, focus on how meaning has these two jobs: fixing reference by how things seem and tracking what things actually are."*
