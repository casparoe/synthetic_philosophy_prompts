prompt: |-
  I've been arguing about the non-identity problem in a forum thread for three weeks now and I want to try running the usual result backwards, so bear with me — I need you to actually build the case, not just talk around it.

  The standard setup: an act looks obviously wrong, but the person affected can't complain, because if you'd done otherwise they wouldn't exist, and you can't be worse off than never having existed. Fine, I know it. I want the mirror image. I want a case where a person-affecting principle — the kind thats supposed to be the humane, anti-aggregation one — *condemns* something nobody thinks is wrong at all, and where the condemnation falls out of the same machinery that makes the standard case work.

  Specs. One paragraph, ordinary life: no sci-fi, no medicine, no illness or disability angle, no resource depletion, no climate, no third parties who get hurt. Same number of people in both branches — exactly one child either way, just not the same child. The kid in the actual branch has a life that's plainly good and clearly worth living; in the branch not taken, the kid would have been somewhat better off. Keep that gap smallish — I don't want the case doing its work by making one life bad. And the difference should come from something the parents can't be blamed for: timing, luck, the way the world happened to be, not from them knowingly rolling the dice on a bad outcome.

  Then do the actual work. Give me the verdict each of these gives and why: (1) the narrow person-affecting view, where "worse off" only ever compares a person to alternatives *for that same person*; (2) the version where you compare the actual kid to whoever would have existed instead — the "you had better luck available and didn't take it" principle; (3) plain totalism. My guess is 1 permits and 2 and 3 both condemn, which is the funny-scary part, because a view built to avoid aggregation ends up extensionally the same as totalism whenever the number of people is held fixed. Tell me if that's right, and say which feature of the case is doing the work. Then: if you pull that feature out, does the case collapse back into the ordinary non-identity puzzle? I want to know whether the mirror case is really a different case or just the same case with the arrow flipped.

  Then tell me how someone who likes person-affecting views will attack it. My guess is they say the principle in (2) was never person-affecting to begin with and I've just dressed totalism up in a trench coat — but give me the strongest version of that objection, not the version I already thought of. And: does the case need the parents to have known the alternative was better? If it only condemns when they knew, does the whole thing still work, or does it degrade into a boring point about negligence?

  And please, if this can't be built — if every version of the case smuggles in aggregation, or if (2) turns out to be a straw man nobody actually holds — just tell me that straight instead of producing a case anyway. I'd rather find out the ask is confused than get a tidy answer to a bad question.
reasoning: |-
  Okay, the user is deep into the non-identity problem and wants a mirror case where a person-affecting principle condemns a seemingly innocent action. Let me unpack their request.

  First, they want an ordinary life scenario—no sci-fi, medicine, disabilities, etc. The key elements are: same number of people (one child), the actual child has a good life, the alternative child would've been slightly better off. The difference should be due to factors beyond parental control, like timing or luck. 

  Hmm, finding such a case is tricky. Real-life examples often involve things like job choices affecting resources, but that might imply blame. What about something like conception timing affecting school quality? Say parents conceive in May instead of January. The actual child goes to a good school, but the January child would've gone to a slightly better one due to district cutoff dates. The parents couldn't have known the exact difference. 

  Now, applying the principles:
  1. Narrow person-affecting: The actual child isn't worse off than not existing, so no complaint. Permitted.
  2. Alternative comparison: Here's the crux. Comparing the actual child to the alternative child, who'd be better off. This condemns choosing May conception as harming the actual child by making them worse off than the alternative.
  3. Totalism: The alternative has a better life, so condemns the actual choice. 

  Interesting—both (2) and (3) condemn, making person-affecting (2) align with totalism when population is fixed. The key feature enabling this is the fixed population plus the alternative comparison. Remove fixed population, and it collapses into standard non-identity. 

  But is (2) really person-affecting? Critics would argue it's disguised totalism because it compares welfare across different possible people. The user anticipates this—they want the strongest objection. The core issue is whether "harm" requires an identifiable victim in the alternative scenario. 

  Also, must parents know? If knowledge is required, it becomes negligence, which is boring. The case works better without knowledge to avoid moralizing the parents' choice. 

  Wait—does this scenario sneak in aggregation? Maybe not, since it's one child. But the alternative comparison might implicitly aggregate possible outcomes. 

  If this setup fails, I should admit it. But I think the school cutoff case fits, if we define "slightly better" rigorously (e.g., marginally better resources). The parents' lack of control over cutoffs absolves them of blame. 

  User's deeper need: They're likely wrestling with whether person-affecting principles are coherent or collapse into totalism. They want to test the boundaries of anti-aggregation ethics. The mirror case challenges the claim that person-affecting views are more humane by showing they might condemn benign actions. 

  Strongest objection: Principle (2) isn't person-affecting because the "harmed" child in the actual world can't coherently claim they'd prefer the alternative scenario—since that scenario contains a different person. Harm requires being made worse off than one could have been, not better than someone else might have been. Thus, (2) is just totalism with extra steps. 

  This mirrors the user's suspicion but grounds it in the non-identity logic. The case holds only if we accept comparing across possible identities—which person-affecting proponents reject. 

  Verdict: The case works as a mirror if we accept (2) as a person-affecting variant, but critics will deny that label. It's structurally distinct from standard non-identity due to fixed population enabling the comparison. Without that, it reverts to classic puzzles. Knowledge isn't needed; the condemnation arises from the alternative's existence alone.
answer: |-
  Here's the mirror case built to your specifications, followed by analysis and objections:

  ### The Case
  A couple considers starting a family. They live near two equally good school districts (A and B), but District A has a marginally stronger arts program. Due to arbitrary enrollment cutoff dates, conceiving **this month** (resulting in a May birthday) means their child will attend District A. Conceiving **next month** (June birthday) means District B. They conceive this month. Their child, Maya, has a happy, flourishing life in District A. Had they conceived next month, their child Milo would have attended District B and likely developed slightly stronger artistic skills due to its program, marginally enhancing his overall life satisfaction. The difference is small - both lives are unequivocally good and worth living. The parents knew the cutoff dates existed but had no specific knowledge about the *quality difference* between the districts' arts programs; they chose based on personal readiness.

  ### Verdicts by Principle

  1.  **Narrow Person-Affecting View (Same-Person Comparison):** **Permits the action.** Maya cannot claim she is worse off *than she would otherwise have been* because her alternative is non-existence. Since her life is good, she isn't harmed by the act that caused her to exist. The parents did nothing wrong *to Maya*.
  2.  **Alternative Comparison View ("Better Luck Available"):** **Condemns the action.** This view compares the actual person (Maya) to the person who *would have* existed had the alternative action been taken (Milo). Milo would have been (marginally) better off than Maya is. By conceiving this month, the parents caused Maya to exist instead of Milo, resulting in a person (Maya) being worse off than the alternative person (Milo) would have been. The parents had a "better luck" option available (conceiving next month for Milo) that would have resulted in a better-off person, and they didn't take it. Maya is comparatively harmed.
  3.  **Plain Totalism:** **Condemns the action.** Totalism compares the welfare states of the two possible outcomes. Outcome 1 (conceive this month): Maya exists with well-being level X (good). Outcome 2 (conceive next month): Milo exists with well-being level X+ (slightly better). Since X+ > X, totalism dictates that the parents should have chosen to conceive next month. Choosing this month results in a suboptimal total (and average) well-being.

  ### Analysis

  *   **Your Guess is Correct:** Narrow PA (1) permits, while Alternative Comparison (2) and Totalism (3) both condemn.
  *   **Feature Doing the Work:** The **fixed number of people (one)** combined with the **comparison to a different possible person** in the alternative scenario. This is the core difference from the standard non-identity problem. In the standard problem, the "wrong" act creates a different person who *is* worse off than non-existence, but the narrow PA view absolves it. Here, the mirror forces a comparison *between two different possible people* with fixed numbers.
  *   **Collapse into Standard Non-Identity?** Yes, **if you remove the fixed number constraint.** If conceiving this month resulted in Maya (good life), while conceiving next month resulted in *no child at all*, the case becomes standard non-identity: Narrow PA (1) permits (Maya isn't worse off than non-existence), Alternative Comparison (2) becomes incoherent (there *is* no alternative person to compare Maya to), and Totalism (3) *might* condemn depending on whether it values existence (but your specs forbid making Maya's life bad, so totalism might permit). The mirror case critically depends on comparing *which* person exists when the *number* is fixed.
  *   **Is (2) Extensional Totalism?** In cases with fixed populations, **yes.** Whenever the number of lives is held constant, Principle (2) ("Alternative Comparison") yields the *exact same verdict* as Totalism (3): whichever choice leads to the existence of the person with the highest well-being is required. Principle (2) achieves this by framing the comparison as person-affecting (Maya is worse off than Milo *would have been*), while Totalism frames it impersonally (Outcome Milo > Outcome Maya).

  ### Objections from PA Proponents (Strongest Version)

  The strongest objection attacks Principle (2) at its core:

  *   **"Alternative Comparison" is Inherently Impersonal, Not Person-Affecting:** Genuine person-affecting harm requires an identifiable subject who is made *worse off than they otherwise would have been in the actual world*. Principle (2) fails this. Maya cannot claim she is worse off *than she would have been* under the alternative; she wouldn't have existed. Milo is not an actual person who was harmed; he never existed. Principle (2) is simply comparing two *possible* welfare states (Maya@X vs. Milo@X+) and declaring the lower one "worse for" Maya *only* in the counterfactual sense that she is the one who instantiates the worse outcome *among the possible people*. This is **disguised impersonal aggregation.** It smuggles in the totalist intuition that we should maximize welfare *across possible scenarios* while dressing it up as a harm *to* a specific person. True person-affecting principles, they argue, only recognize harms to actual individuals relative to their own counterfactual existence (Principle 1) or involve depriving actual individuals of existence itself (which isn't harm). Principle (2) is a confused hybrid that abandons the core commitment of PA views: grounding wrongness in harm *to actual persons*.

  ### The Knowledge Question

  *   **Does the case require parental knowledge?** **No, and it's crucial that it doesn't.** If the parents *knew* District B was slightly better, Principle (2) would condemn their choice *and* it would look like straightforward negligence (choosing a known worse option for their child). The power of the mirror case lies in the condemnation *without* negligence or blameworthy ignorance. Principle (2) condemns solely because Maya exists and is marginally worse off than Milo *would have been*, regardless of what the parents knew. This makes the condemnation starkly counterintuitive and highlights the structural similarity to totalism. If knowledge were required, the case *would* degrade into a standard negligence case, losing its unique "non-identity mirror" character.

  ### Conclusion

  The case can be built as specified. It demonstrates that a specific "person-affecting" principle (Alternative Comparison / Principle 2) can condemn intuitively blameless actions under fixed-population conditions, aligning extensionally with totalism. The core feature enabling this is the comparison of welfare levels *between different possible persons* when the number of persons is identical. PA proponents will strenuously object that Principle (2) is *not* genuinely person-affecting but is instead a form of impersonal aggregation in disguise, abandoning the core PA commitment to harm *to actual persons*. The case works without requiring parental knowledge of the marginal difference, preserving its distinctness from negligence and its role as a true mirror to the standard non-identity problem.
