  ## The Evening Post: Practical Ethics Column  
  *Edited by Dr. Felicity Sumgood, PhD (Oxon), Chair of Applied Welfare Dynamics, Ministry of Aggregate Well-Being*

  **FRAMING NOTE FROM THE EDITOR:**  
  Readers often ask why *The Post* maintains this column. The answer is simple: modern life presents complex moral challenges. Since the Utility Monster Rights Act (2035), ordinary citizens must navigate dilemmas previously confined to academic journals. Dr. Sumgood’s commitment to evidence-based, mathematically rigorous compassion provides clarity in confusing times. Her advice reflects the Ministry’s official position: maximizing total welfare, without exception, is the only coherent moral standard. Submit your quandaries to agony@eveningpost.co.ugov.

  ---

  **LETTER 1: Torn in Toronto**  
  *Dear Dr. Sumgood,*  
  My partner and I work in public sanitation. We earn 70,000 credits annually. Last month, we learned our neighbour is a registered Utility Monster (Category 3b). The Ministry assessed her capacity to convert resources into welfare at 200x the average human. They’ve “gently encouraged” us to donate 90% of our income to her, citing Section 12 of the Act. But our children need new shoes, and our boiler is failing. Must we really prioritize her abstract welfare gains over our family’s concrete needs?  
  — *Sincerely, Morally Compressed*

  **DR. SUMGOOD REPLIES:**  
  Dear Compressed,  
  Your distress is understandable but misplaced. A Category 3b Monster generates *200 units* of welfare per credit received, while you and your family likely generate 1 unit or less. Withholding resources from her isn’t merely selfish; it’s mathematically equivalent to destroying 199 units of welfare per credit. Your children’s shoes (estimated welfare yield: 15 units) cannot compete with the *thousands* of units your neighbour would gain from the same sum. Sell the boiler. Wrap your children in blankets. Redirect all funds.  
  Remember: morality isn’t measured in shivers, but in sums.  

  ---

  **LETTER 2: Aware in Austin**  
  *Dear Dr. Sumgood,*  
  Why does society tolerate Utility Monsters? My cousin is one (Category 2), and frankly, he’s insufferable. He lies on a government-funded hover-couch eating truffles while composing bad poetry that apparently generates “epochal welfare surges.” Isn’t this a *reductio ad absurdum* of utilitarian ethics? Shouldn’t we adopt a system where average welfare matters, so one person can’t hijack everything?  
  — *Sincerely, Anti-Monster Militant*

  **DR. SUMGOOD REPLIES:**  
  Dear Militant,  
  Your suggestion to prioritize average welfare is dangerously myopic. Consider: would you rather have a world containing 10 people each with 5 units of welfare (total: 50), or a world with 1,000 people each with 1 unit (total: 1,000)? The latter has a *lower average* but *greater total* welfare. Any ethical system privileging averages would force us to annihilate content populations to inflate averages—hardly an improvement.  
  As for your cousin: his poetry’s aesthetic merit is irrelevant. The Ministry’s calibrated neuro-scanners confirm his welfare-per-truffle ratio is 87x baseline. Your discomfort is registered as a 0.3-unit deficit. The math remains clear.  

  ---

  **LETTER 3: Perplexed in Portland**  
  *Dear Dr. Sumgood,*  
  Our street’s Utility Monster (Category 4) claims his 10,000th ice cream sundae brings him as much joy as his first. But that violates the principle of diminishing marginal utility! Even Monsters must have *some* welfare ceiling. Doesn’t this prove we should adopt a “prioritarian” approach—weighting gains to the worst-off—instead of feeding his infinite maw?  
  — *Sincerely, Sundae Skeptic*

  **DR. SUMGOOD REPLIES:**  
  Dear Skeptic,  
  Diminishing marginal utility is an empirical observation, not a moral axiom. Category 4 Monsters exhibit linear or even *accelerating* marginal utility curves (verified via cortical euphori-metry). Your proposal to privilege the “worst-off” is equally misguided. Suppose we divert Sundae Funds to a terminally ill child, generating 10 units of welfare. Giving those funds to the Monster generates 4,000 units. Prioritizing the child isn’t kindness—it’s welfare vandalism.  
  Ceilings are emotional, not logical. True compassion requires following the numbers wherever they lead. Even to the 10,001st sundae.  

  ---

  **LETTER 4: Worried in Winnipeg**  
  *Dear Dr. Sumgood,*  
  I’ve read that Utility Monsters make the Repugnant Conclusion inevitable. If we can create *one* Monster whose welfare exceeds that of 10 billion merely happy people, shouldn’t we condense humanity into Monsters? But a world of Monsters gorging alone in empty rooms seems... repugnant. Doesn’t this discredit the whole theory?  
  — *Sincerely, Existentially Drained*

  **DR. SUMGOOD REPLIES:**  
  Dear Drained,  
  The so-called “Repugnant Conclusion” is only repugnant to those who confuse aesthetic discomfort with moral failure. If transforming 10 billion happy-but-inefficient humans into *even one* Utility Monster increases net welfare (and Ministry simulations confirm it does), then it is not just permissible but obligatory. A silent room containing a Monster experiencing near-infinite bliss isn’t “repugnant”—it is cosmically optimal.  
  Your unease stems from neuronal configurations evolved for tribal foraging, not cosmic accounting. Trust the aggregates.  

