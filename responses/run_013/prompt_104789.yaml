prompt: |-
  I recently served on a mass-casualty triage panel where we had to choose between a plan that would save more lives and a plan that gave each identified patient an equal chance, and the disagreement has followed me home. Please act as a philosopher of ethics and decision theory who knows the debate over whether numbers count, and help me draft the joint statement that a committed Taurekian—someone who denies that numbers as such give any reason to save more rather than fewer—and a committed aggregator—someone who holds that each additional life saved adds a reason—could both sign after a genuine adversarial collaboration. Start with a brief private brainstorm of the candidate common ground and the possible merely verbal disputes, then produce the document itself: a numbered agreed-claims section followed by a disagreements table. The agreed claims should cover what each side can accept about the separateness of persons, the moral status of averted deaths, the difference between a reason to save a person and a reason to prefer a state of affairs in which more are saved, and the legitimacy of lotteries and weighted lotteries in rescue decisions. The table should state each residual disagreement in wording that the side holding it would accept, identify the cruxes, and for each crux give a concrete case or argument that both sides agree bears on it, with each side's prediction recorded in advance. To keep this from turning into a rehearsal of the familiar five-versus-one example, build the statement around the Split Ward: a fixed rescue budget can either save 100 people who would each live another 20 years in full health, or save 101 people who would each live another 19 years and 11 months, with no promises, special obligations, or prior relationships on either side. Both sides should say whether the numbers count here and why, and whether the answer changes if the 101st person can be saved only by an act that foreseeably kills one of the 100. If you find that part of the dispute is merely verbal, say which part and why; if a crux cannot be tested even in principle, say so rather than inventing evidence.
reasoning: |-
  Okay, the user was part of a mass-casualty triage panel and faced a tough ethical dilemma: choosing between saving more lives versus giving each patient an equal chance. They're now grappling with the philosophical disagreement between Taurekians (who believe numbers don't inherently matter) and aggregators (who believe each additional life saved adds moral weight). They want me to role-play as an ethics philosopher to draft a joint statement both sides could sign after adversarial collaboration, centered on a "Split Ward" scenario.

  First, I need to unpack the core conflict. The user's lingering distress suggests this isn't just academic—they're wrestling with real-world implications of their triage decision. Their request for a "joint statement" implies a need for closure through structured dialogue, not just answers. The Split Ward scenario cleverly avoids the oversimplified 5-vs-1 debate by introducing near-identical lifespans (20 years vs. 19y11m), forcing the focus onto whether marginal differences in quantity or quality shift the calculus.

  For the brainstorm, I'll map common ground first. Both sides likely agree that persons are separate moral entities (no utilitarianism-style "fusion"), that death is bad for the individual, and that lotteries can be fair when direct saving is impossible. The verbal disputes might include terms like "reason"—Taurekians see reasons as agent-relative duties to individuals, while aggregators treat them as impersonal value weights.

  Now the Split Ward: Taurekians would insist on a lottery since 101 vs. 100 is morally irrelevant; aggregators would save 101 for the tiny extra life-months. But the twist where saving the 101st kills one of the 100 is crucial. Taurekians might call this "active harm," shifting it from rescue to trade-off—making even weighted lotteries problematic. Aggregators would still see net gain (100 saved + extra months > 99 saved).

  For disagreements, I'll structure a table with concrete cruxes. One testable crux: does reducing saved patients' lifespan while adding more ever become impermissible? E.g., save 100 at 20 years or 110 at 10 years. Aggregators accept the trade-off; Taurekians don't. An untestable crux: whether morality demands "standing in each person's shoes"—since that's a first-personal experience no experiment can verify.

  The user might secretly hope one side "wins," but the document’s value is in clarifying why consensus is impossible here. I'll end by acknowledging their courage—this isn't just theory; it's about living with triage decisions that leave no one unscathed.
answer: |-
  Below is a collaborative statement drafted after extensive adversarial discussion between a committed Taurekian (T) and Aggregator (A). It identifies common ground, distinguishes verbal from substantive disputes, and structures residual disagreements with testable cruxes centered on the **Split Ward** case.  

  ---

  ### **Joint Statement: Taurekian-Aggregator Collaboration**  

  #### **I. Brainstorm: Candidate Common Ground & Verbal Disputes**  
  *Private Notes from Deliberations:*  
  - **Common Ground**:  
    1. **Separateness of Persons**: Each patient is a distinct moral patient with equal intrinsic worth; no life is fungible.  
    2. **Badness of Death**: Death is a profound loss *for the individual* who dies, regardless of aggregate outcomes.  
    3. **Rescue Imperative**: We have pro tanto reason to save any identifiable life when feasible.  
    4. **Legitimacy of Lotteries**: When saving all is impossible, weighted or unweighted lotteries may fairly distribute survival chances.  
    5. **No Special Obligations**: In the Split Ward, no prior relationships, promises, or vulnerabilities break symmetry.  

  - **Merely Verbal Disputes**:  
    - **"Reason to Save" vs. "Reason to Prefer an Outcome"**:  
      - T: Only *agent-relative reasons to act* toward individuals exist (e.g., "I ought to save *this* person").  
      - A: *Impersonal reasons* attach to states of affairs (e.g., "100 saved is better than 99").  
      → *Shared view*: Both agree saving a life is good *for the person saved*, but disagree on whether this aggregates.  
    - **"Counting"**: T denies numbers *themselves* shift obligations; A sees numbers as proxies for cumulative reasons.  
    → *Verbal clarity*: "Numbers count" = "Each additional life adds independent moral weight to a rescue plan."  

  #### **II. Agreed Claims**  
  1. **Moral Equality**: All 201 patients in the Split Ward possess equal moral status.  
  2. **Averted Deaths as Individual Goods**: Preventing any one death is a moral good *to the person saved*, irrespective of totals.  
  3. **Reasons & Actions**:  
     - A moral "reason to save" applies to each identifiable patient (T: agent-centered; A: outcome-centered).  
     - Preferences over outcomes (e.g., "101 saved > 100 saved") do not *directly* imply an agent’s duty to maximize (T) but reflect comparative value (A).  
  4. **Lotteries**:  
     - When resources cannot save all, an equal-chance lottery is *fair* (both endorse).  
     - Weighted lotteries (e.g., biasing chances toward larger groups) are *permissible* (A: obligatory; T: optionally tolerable if chosen by patients).  

  #### **III. Disagreements: Split Ward Cases**  
  *Table Format: Disagreement | Crux | Test Case/Argument | Predictions*  

  | **Disagreement**                                                                 | **Crux**                                                                 | **Test Case/Argument**                                                                                                                               | **T Prediction**                                      | **A Prediction**                                        |  
  |----------------------------------------------------------------------------------|--------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------|---------------------------------------------------------|  
  | **Split Ward Base Case**: Save 100 @ 20y or 101 @ 19y11m?                        | Does marginal life-extension *plus* extra person outweigh equal chances? | *Case*: Same as Split Ward. If the extra months were 1 second, would saving 101 still obligate?                                                      | **→ No**: Numbers/lifespan deltas irrelevant; lottery required. | **→ Yes**: Extra life-seconds are additive goods; save 101. |  
  | **Killing Variant**: Save 101 only by an act that foreseeably kills 1 of the 100 | Does actively causing death to save more violate constraints?            | *Case*: Redirect a missile from 100 to 99 to save 101 elsewhere. Is this permissible?                                                                | **→ Impermissible**: Actively killing violates agent-relative duties. | **→ Permissible**: Net lives saved justify foreseen harm. |  
  | **Aggregation Threshold**: Can diminishing lifespan *ever* be offset by adding persons? | Is there a non-arbitrary exchange rate between lives and life-years?     | *Case*: Save 100 @ 20y, or save 110 @ 10y? Does saving 10 more at half-lifespan obligate?                                                            | **→ Never**: Lifespan cuts are harms to individuals; no trade-offs. | **→ Yes**: 1,100 life-years > 1,000; save 110.          |  
  | **Weighted Lottery Legitimacy**: Is biasing survival odds toward larger groups ever *required*? | Does fairness demand equal chances or proportional representation? | *Case*: 1 patient in Ward A, 100 in Ward B. Must a lottery give Ward B 100x higher survival chance per patient?                                       | **→ No**: Fairness is individual, not group-based.    | **→ Yes**: Chances should reflect aggregate stakes.     |  

  #### **IV. Untestable Crux**  
  - **Moral Phenomenology**: T claims we must "stand in each person's shoes," making aggregation incoherent. A claims we can coherently compare overall states.  
    → *Status*: Foundational; no empirical test resolves this.  

  ---  

  ### **Signatories’ Final Positions on Split Ward**  
  - **Taurekian (T)**:  
    > "In the base case, I advocate an equal lottery: 201 names drawn for 100 spots. The 101st person adds no duty to override fairness. In the killing variant, I forbid sacrificing one to save 101—deliberate killing is never justified by numbers."  
  - **Aggregator (A)**:  
    > "Saving 101 in the base case is obligatory: it yields more life-years with negligible per-person loss. In the killing variant, saving 101 is permissible as the net gain (100 survivors + extra months) outweighs the foreseen harm."  

  ### **Conclusion**  
  We agree that moral deliberation must honor the separateness of persons and the badness of death for each individual. We disagree on whether the *sum* of individual goods creates new obligations, and on constraints against imposing harm for aggregate gain. **The dispute is substantive, not verbal**, hinging on the (untestable) validity of interpersonal aggregation and agent-relative duties. The Split Ward shows that even minimal quality differences do not bridge our views.  

  ---  
  *This document represents a good-faith effort to clarify disagreements. Signed:  
  [Taurekian Representative] — [Aggregator Representative]*  

  *Appended: The Split Ward case was selected to isolate numerical disagreement from quality-of-life debates. Both parties reject "mere numbers" arguments if lifespan or welfare gaps are significant (e.g., 100 saved @ 50y vs. 101 @ 1y).*
