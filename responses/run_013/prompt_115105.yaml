prompt: |-
  I am a software engineer with no formal background in philosophy, and I have been asked to run the next session of the reading group my team keeps. The topic I have been handed is the disagreement in the philosophy of biology between etiological (selected-effects) accounts of function and causal-role (systemic) accounts. Please do not explain the disagreement to me; I have read enough to follow it, and what I need is a plan for teaching it rather than a summary of it.

  The audience is a dozen engineers, no biology past secondary school, no philosophy at all, and no preparation. Fifty minutes, a whiteboard, nothing handed out in advance. Set out the order in which the ideas have to be introduced, and why that order rather than another: what has to be in place before the question — what makes some effect of a trait one of its functions rather than a by-product — can even be heard as a question; where the two accounts should enter relative to each other; and the point at which the audience is entitled to ask why these are rivals rather than answers to two different questions. My own guess is that the sequence has to earn the rivalry before it announces it, but tell me if that is the wrong shape.

  Then the case that carries the whole session. I do not want the heart-that-pumps-blood-and-also-makes-noise example and I do not want the appendix; both are the sort of thing people have half-heard and will feel they already know. Give me one case to build the fifty minutes on, and say what it must have and what it must lack. I expect the divergence cases to come in four shapes — something that once did a job and no longer does it, something that does a job now that nothing selected it for, something that would do the job but has no history at all because it arose by accident, and something that is meant to do the job but currently cannot — and I want to know which of these should carry the session and which should be held back until the moment the two accounts actually come apart, and why.

  I am expecting two misconceptions and want the rest from you: that function means purpose and purpose requires a designer, and that one of the two accounts is simply correct and the other refuted. Give me the full map in the order the misconceptions will surface, and for each one the exact point in the sequence where I should head it off, not the general remark that I should address it. I am particularly worried about the moment when the case of a trait that no longer does anything useful leads half the room to conclude that the historical account is dead while the other half concludes that the role account is, and about the broken instance, which I expect to be read as proof that function-talk is really about current contribution.

  One thing matters to me more than the rest, and I would like it handled at the right point in the sequence rather than tacked on at the end: whether the historical account can accommodate artifacts at all, code included. If the answer is that a designer's intentions count as a selection process, I want to see what that does to the analogy, because most of the code I work with survives for reasons nobody intended, and I cannot tell whether that makes something a function of the code or merely an effect of it. Say also where a code analogy will help this audience and where it will quietly mislead them.

  Finish with the single question I should ask at the end that would show me whether the audience has understood the distinction rather than picked a side, and with what I should openly decline to cover at this level. I would rather cut the propensity or dispositional account of function, and anything about functions and mental content, than let the session sprawl, but tell me if cutting those leaves the audience with a false picture. No citations or reading list, please; I have no way to check them and no time to use them.
reasoning: |-
  Okay, let me tackle this. The user is a software engineer leading a reading group on the philosophy of biology, specifically the disagreement between etiological and causal-role accounts of function. They need a teaching plan, not an explanation. The audience has no background in biology or philosophy, and the session is 50 minutes with a whiteboard. 

  First, I need to consider the sequence of introducing concepts. The user wants the rivalry between the two accounts to be earned before it's announced. So starting with a relatable example is key. The example must avoid common ones like the heart or appendix. I think a tech analogy would work well here—maybe a software component that logs data. It's something engineers deal with daily. The logging function has intended purposes and actual effects, which can illustrate both historical and current roles.

  Next, misconceptions. The user mentioned two: function equals purpose with a designer, and one account being definitively correct. These need to be addressed at specific points. When introducing functions, I should clarify that in biology, "function" isn't about a designer's intent. Later, when discussing broken or vestigial traits, emphasize that both accounts have valid points, and the disagreement is about criteria, not correctness.

  The user is concerned about the broken instance being seen as proof that function is about current contribution. Using a real-life example like a spam filter that's broken but was intended to block spam can help. Show how the etiological view still attributes the function based on history, while the causal-role view might say it's not functioning now. This highlights the divergence without resolving it, which is the point.

  For artifacts and code, the user worries about unintended survival reasons. I should explain that in the etiological view, designer intent is analogous to natural selection. But in software, features might persist due to unintended reasons. Ask the group if a feature's current use, even if unintended, becomes its function. This ties back to the historical vs. current role debate and shows where the analogy holds or breaks.

  The core case should be a trait that's broken but had a historical function. The logging service that's malfunctioning fits. It was designed to log errors (historical), but now it doesn't. However, its current role might be something else, like causing performance issues. This case covers multiple divergence points without overcomplicating.

  End with a question that tests understanding, not side-picking. Ask them to explain why the accounts disagree on the function of a vestigial trait like human tailbones. This requires applying both views, showing comprehension of the distinction.

  Cutting propensity accounts and mental content is acceptable. The user is right that those would sprawl. The core disagreement is well-covered without them.
answer: |-
  Here’s a battle-tested 50-minute plan focused on **clarity of distinction** and **earning the rivalry**, designed for engineers. The sequence builds from intuitive concepts to philosophical tension, using one core case to avoid cognitive overload.

  ---

  ### **Sequence & Rationale (35 mins)**  
  **Whiteboard Flow:**  
  `Everyday "Function" → Biological Trait Effects → Core Question → Etiological Account → Causal-Role Account → Rivalry Revealed`

  1. **Start with "Function" in Tech (5 mins)**  
     - *Draw:* A simple software component (e.g., `logger.error("Timeout")`).  
     - Ask: *"What’s its function?"* → List responses (e.g., "record errors," "alert devs").  
     - **Why:** Anchors "function" in their domain. Establishes that effects ≠ functions (e.g., "increasing server load" is an effect but not a *function*).  
     - **Pre-empt Misconception 1 (Designer/Purpose):**  
       *"In software, functions are designed. But in biology, there’s no designer—so how do we decide what counts as a function?"* → Explicitly decouple "function" from "intent."

  2. **Transition to Biology (5 mins)**  
     - *Draw:* A biological trait (e.g., **Gecko foot pads**). List effects: "sticks to walls," "traps dirt," "slows movement."  
     - Pose Core Question: *"Which of these effects is its *function*? Why?"*  
     - **Why:** Forces the problem: not all effects are equal. Sets stage for needing criteria.

  3. **Introduce Etiological Account (10 mins)**  
     - Define: *"A function is what the trait was *selected for* by evolution."*  
     - Use **Gecko foot pads**: Selected for adhesion (climbing aids survival). "Traps dirt" is a by-product.  
     - **Key Hook:** *"This is why biologists say 'the function of the heart is to pump blood'—not 'make noise'—even though it does both."*  
     - **Artifact Compatibility:**  
       *"For human-made things, 'selection history' = design purpose. But what if a feature outlives its purpose? We’ll circle back."*

  4. **Introduce Causal-Role Account (10 mins)**  
     - Define: *"A function is what the trait *currently does* within its system."*  
     - Reuse **Gecko foot pads**: In the "locomotion system," adhesion is functional. "Traps dirt" may be functional if it deters parasites.  
     - **Contrast:** *"Etiological looks to *past* survival; causal-role looks to *current* behavior in a system."*  

  5. **Reveal Rivalry (5 mins)**  
     - Pose: *"Do these answer the same question? When would they disagree?"*  
     - **Why now:** The audience has both definitions. The conflict is *felt* before it’s named.

  ---

  ### **The Core Case: Broken/Repurposed Trait (15 mins)**  
  **Use a *single* case with multiple facets:  
  *"Human Goosebumps"***  

  | **Effect**          | **Etiological View**                          | **Causal-Role View**                       |  
  |---------------------|-----------------------------------------------|--------------------------------------------|  
  | Raises hair follicles | Selected for (traps heat in furry ancestors) | Still occurs, but no system *benefits*     |  
  | Emotional response  | By-product (not selected)                     | Functional in "fear system" (signals stress)|  

  #### **Why this case?**  
  - **Has:** Vestigial history (past selection, now useless) + Current role (emotional signaling) + Non-obvious "system" (psychology vs. thermoregulation).  
  - **Lacks:** Design overtones (unlike appendix) and avoids overused examples.  
  - **Divergence Points Covered:**  
    - Past function, no current utility (raises hair)  
    - Current utility, no selection history (emotional signal)  
    - *Brokenness implied:* If goosebumps didn’t raise hair *or* signal emotion, accounts disagree on whether it even *has* a function.  

  #### **How to deploy:**  
  1. Describe goosebumps in ancestors (insulation) vs. humans today (emotional).  
  2. Apply both accounts: *"Is 'insulation' still its function? Is 'fear signaling' a function?"*  
  3. Engineers will split: **Etiological:** "Only insulation!" **Causal-Role:** "Only signaling!" → **Rivalry crystallizes.**  

  ---

  ### **Handling Misconceptions & Tensions**  
  - **Misconception 1 (Designer/Purpose):**  
    - *When:* During Step 1 (tech analogy).  
    - **Action:** Explicitly state: *"Biology has no designer. 'Selection' replaces 'design' in etiological views."*  

  - **Misconception 2 (One Account is "Correct"):**  
    - *When:* During goosebumps debate (Step 5).  
    - **Action:** *"This isn’t about who’s 'right'—it’s about what *criteria* we use. Etiological explains *why traits exist*; causal-role explains *how systems work now*."*  

  - **Broken Instance Tension:**  
    - Pose: *"If a gene mutates and a trait breaks (e.g., goosebumps vanish), does it still *have* a function?"*  
    - **Etiological:** "Yes—its *selected* function."  
    - **Causal-Role:** "No—it contributes nothing *now*."  
    - **Resolution:** *"This shows the accounts ask different questions. Neither 'kills' the other."*  

  - **Artifacts/Code Compatibility:**  
    - *When:* After introducing etiological (Step 3).  
    - **Analogy:** *"Design intent ≈ selection history. But software evolves: a hack (e.g., `printf` for debugging) might become critical. Is its function what the *designer intended* or what the *system requires now*?"*  
    - **Where Analogy Misleads:** Biology lacks a designer’s *mind*. Avoid overextending "intent." Focus on *persistence*: *"In code, if a feature persists because it solves a problem (even unintended), causal-role calls it functional. Etiological requires knowing *why it was kept*."*  

  ---

  ### **Closing (5 mins)**  
  - **Diagnostic Question:**  
    *"A whale pelvis has no current role in swimming. Etiological says its function is ___ because ___. Causal-role says ___ because ___."*  
    (Answers: Etiological: "walking (ancestral selection)"; Causal-Role: "none (no current contribution)")  

  - **What to Cut:**  
    - Propensity accounts (adds nothing at this level).  
    - Mental content (irrelevant to core distinction).  
    - **Justification:** The etiological/causal-role debate is the central, defensible tension. Cutting extras avoids false pictures.  

  ### **Why This Works**  
  - Engineers grasp systems and history. The goosebumps case leverages both.  
  - Rivalry emerges *from the case*—not from abstract definitions.  
  - Tech analogies scaffold understanding but are contained where they mislead (designer intent).  
  - Misconceptions are preempted *at the point of likely failure*.  

  Focus on the **"why now?"** at each step, and the room will self-correct through debate. Trust the case.
