  I'm putting in for a small internal research grant — one semester, enough for a bit of travel and a grad student to check my reading against the texts — and I need a proposal of about 1,500 words. The topic is Arendt on lying in politics, specifically the truth-and-politics essay and the Pentagon Papers one, and I've got a half-formed idea I want you to turn into something a committee can actually score.

  Here's the half-formed thing. The contrast people draw in her work between an older kind of political lie and a modern one usually gets read as a contrast in content: the old lie was about some specific fact, the modern one fabricates a whole picture of the world. I think the real hinge is the audience, and what the lie does to the liar's grip on the world, not how big the lie is. The old lie is told to an opponent and it presupposes a shared world of facts both sides can point at; the modern one is told to a population meant to live inside it, and its point isn't to get anyone to believe a false proposition so much as to make the shared factual world unusable. If thats right, the interesting cases are the ones where nobody believes the official story and it's compulsory anyway — the whole society performing the ritual, everyone knowing that everyone knows — and I genuinely can't tell whether her framework has room for that or whether it's a blind spot. The other thing that nags at me is the self-deception she attributes to the lying team; it sits oddly with the idea that a liar knows the truth he's busy denying.

  So give me the proposal: a precise question with a determinate answer, why the going ways of reading her leave it open (not just "nobody's written on it"), what I'd actually do month by month for a semester, what a result would look like and what would count as the project failing, and an honest word on scope. I'll add the citations myself so no reading list or page numbers. And when you tell me what she actually holds, keep the uncontroversial bits separate from the interpretive fights — don't serve me a contested reading as if it's just what she said. Write it as continuous prose, no headings, no bullets, no bold, like a long email to me.
