prompt: |-
  I have no background in economics or statistics, but I've spent a few months reading about bet sizing — mostly blog posts and forum threads about sports betting and index investing — and I've arrived at a question I can't settle on my own.

  The advice everywhere is to stake some fraction of your bankroll and never to go above what everyone calls the Kelly fraction. When I finally looked up where that number comes from, the answer was that it maximizes the expected value of the logarithm of your wealth. That looks to me like nothing more than choosing a utility function, and not even a natural one, just a curved one that makes you behave like someone who dislikes risk. Choosing a utility function seems like a personal matter, the way some people like spicy food and some don't; it isn't a mathematical fact about betting. I also notice that the word "geometric" keeps turning up in these discussions, and I can't tell whether it's doing any real work or is just a fancy name for a ratio.

  So here is my question. If the Kelly rule is just log utility, doesn't the whole recommendation dissolve into a matter of taste? On what grounds does anyone say that staking more than the Kelly fraction is a mistake, rather than simply a different appetite for risk? If I'm comfortable with wild swings and I want the larger expected payout — and the largest expected payout of all comes from staking everything on any favorable bet — why isn't the bigger bet just the one that suits me, with the growth-optimal crowd merely having a different utility curve and no standing to call me wrong?

  This is where I get stuck. Someone told me that if you stake a fixed fraction more than twice Kelly, the growth rate actually turns negative and you go broke in the long run no matter how favorable the bets are. That can't be right as stated, since any bet with an edge has positive expected value, and if Kelly is only a preference, then the ruin story must be either false or an exaggeration. I'd like to understand what, if anything, is actually being claimed here, because I suspect the people writing about this mean something more than a preference — and I can't see what it is.
reasoning: |-
  Okay, let me really unpack this user's question. They've clearly done some deep reading on bet sizing, especially around Kelly and sports betting, but they're hitting a philosophical wall. The core confusion seems to be: "If Kelly is just about log utility preference, why do people act like overbetting is mathematically wrong?"

  First, I need to validate their insight - they're absolutely correct that choosing log utility is subjective. That "ah-ha" moment they had about utility functions being like taste in spicy food? Spot on. Many introductory sources gloss over this, presenting Kelly as universally optimal without acknowledging it's tied to a specific goal (geometric growth). 

  But where they're stuck is reconciling that with the dire warnings about overbetting. The user mentions hearing that "betting over 2x Kelly guarantees ruin" and intuitively knows that can't be fully true because positive EV bets shouldn't always destroy wealth. I should clarify that distinction between expected value (linear) vs growth rate (multiplicative) - that's the key they're missing.

  Hmm... their example about staking everything for maximum EV is perfect to work with. I should show numerically how even with positive EV, overbetting can systematically drain wealth through volatility drag. Maybe a simple coin toss scenario with 60% win probability? 

  Also need to address the "negative growth rate" claim they heard. That's technically true but requires explanation - it's not that EV is negative, but that volatility compounds destructively when bets are too large. The bankruptcy point is asymptotic (long run), which many misunderstand as "guaranteed ruin" rather than "almost certain ruin with probability approaching 1".

  The geometric mean concept keeps coming up in their reading - I should emphasize how that directly measures compound growth, and how maximizing it prevents ruin. That's the non-preference-based argument they're seeking: if your goal is survival and compounded growth, Kelly is mathematically necessary, not just preferred.

  Importantly, I should acknowledge that yes, if someone truly doesn't care about volatility and only wants maximum linear EV, they're not "wrong" - but in practice, that position is rare because... who enjoys going bankrupt? The "different appetite" argument holds in theory but crumbles in real-world betting where limited bankrolls exist.

  The user seems analytically sharp - they'll appreciate the subtle distinction between "expected value" and "median outcome". Might show how overbetting leads to high EV but most likely bankruptcy, while Kelly gives lower EV but positive growth. That duality often resolves the paradox.

  Finally, should wrap with practical implications: Kelly isn't holy grail (transaction costs, estimation errors exist), but the ruin warnings aren't exaggerations - they're mathematical certainties under the growth framework. Their skepticism is healthy, but the math behind overbetting consequences is real.
answer: |-
  You've hit on a profound tension in decision theory that even experts debate. Let's untangle the key points:

  ### 1. **Kelly as a Utility Choice**
     - **You're fundamentally correct:** Kelly *is* derived from using a logarithmic utility function. Maximizing expected log wealth *is* a specific choice about risk preference. It implies:
       - Constant relative risk aversion (CRRA): You care about *percentage* losses/gains equally, regardless of wealth level.
       - Zero utility from ruin: Log(-∞) = -∞, so bankruptcy is infinitely bad.
     - **It's not "natural":** Other utility functions exist (e.g., linear for pure EV maximizers, quadratic for mean-variance optimizers). Choosing log *is* a preference for geometric growth and ruin avoidance.

  ### 2. **The "Mistake" of Overbetting Kelly**
  Here’s why overbetting Kelly *is* considered a mathematical error *if your goal is long-term wealth growth* – **not** because it violates personal taste, but because it objectively undermines its own stated goal:

  - **The Growth Rate Argument:**
    - **Kelly maximizes the geometric growth rate** of your bankroll. This is a *measurable, objective quantity*: `G = lim_{N→∞} (1/N) log(W_N / W_0)`.
    - Betting fraction `f` > `f_kelly` *reduces* `G`.
    - **Crucially:** If `f > 2 * f_kelly`, the growth rate `G` **becomes negative**, meaning your bankroll *decays* exponentially toward zero in the long run, even if every bet has positive EV! This isn't preference; it's a mathematical property of multiplicative processes.

  - **The Ruin Argument:**
    - **Ruin is guaranteed:** For `f > f_kelly`, the probability of your bankroll dipping below any positive level approaches 1 as time goes to infinity. (`P(lim inf W_t = 0) = 1`). Again, this is a provable limit theorem.

  ### 3. **Your "Maximum EV" Argument - Why It Fails Multiplicatively**
  Your intuition is correct *in a single, additive bet*:
  - **Single Bet:** If you stake your entire bankroll `W` on a +EV bet, your *expected wealth* `E[W_1]` is maximized. This is linear thinking (wealth adds/subtracts).

  But betting is *multiplicative* over time:
  - **Repeated Bets:** Your wealth evolves as `W_n = W_0 * (1 + f * X_1) * (1 + f * X_2) * ... * (1 + f * X_n)`, where `X_i` is the return from bet `i`.
  - **Volatility Drag:** High volatility (`f` too large) *systematically erodes* compounded returns. Losing 50% requires a 100% gain just to break even. Large bets amplify this asymmetry.
  - **Expected Value vs. Median Outcome:**
    - **Overbetting (`f > f_kelly`):** `E[W_n]` is very high, but this is driven by a tiny probability of enormous wealth and a high probability of near-bankruptcy. The *median outcome* plummets.
    - **Kelly Betting (`f = f_kelly`):** Maximizes the *median outcome* and the *mode* of the terminal wealth distribution. It's the most *likely* path to high wealth.
    - **Underbetting (`f < f_kelly`):** Sacrifices growth for reduced volatility. Lower `E[W_n]` but higher safety.

  ### 4. **Why "Going Broke" Happens with Positive EV Bets**
  Consider this simple, extreme example:
  - **Bet:** Fair coin, `P(Heads) = 0.6`, `P(Tails) = 0.4`. You win +100% on Heads, lose -100% on Tails. (Edge = 20%)
  - **Kelly Fraction:** `f_kelly = (bp - q) / b = (1*0.6 - 0.4) / 1 = 0.2`.
  - **Strategy A (Max EV):** Bet full bankroll (`f = 1.0`) repeatedly.
    - `E[W_1] = 0.6*(2W) + 0.4*(0) = 1.2W` (Positive EV!).
    - **After 2 bets:** 36% chance of `4W`, 48% chance of `0W`, 16% chance of `0W`. `E[W_2] = 1.44W`.
    - **After `n` bets:** `E[W_n] = W_0 * (1.2)^n` → ∞.
    - **Reality:** Probability of ruin after `n` bets = `1 - (0.6)^n`. After 10 bets: ≈ 99.4% chance of ruin. The massive EV is an illusion; you almost certainly go broke.
  - **Strategy B (2x Kelly, `f = 0.4`):**
    - Growth Rate `G = 0.6*ln(1.4) + 0.4*ln(0.6) ≈ 0.6*(0.336) + 0.4*(-0.511) ≈ 0.2016 - 0.2044 = -0.0028 < 0`.
    - **Long-run result:** Bankroll decays to $0 with probability 1.
  - **Strategy C (Kelly, `f = 0.2`):**
    - `G = 0.6*ln(1.2) + 0.4*ln(0.8) ≈ 0.6*(0.1823) + 0.4*(-0.2231) ≈ 0.1094 - 0.0892 = 0.0202 > 0`.
    - **Long-run result:** Bankroll grows exponentially at ~2.02% per bet.

  ### 5. **Grounds for Criticizing Overbetting**
  - **Violates Its Own Goal:** If you claim you want "long-term growth" or "to maximize compounded returns," but bet > Kelly, you are objectively undermining that goal. Your *actions* contradict your *stated objective*.
  - **Survival:** Kelly is the *minimum* fraction guaranteeing no-ruin in favorable games. Overbetting guarantees ruin.
  - **Efficiency:** Kelly achieves a given growth target with the *least* risk (variance) or achieves the *highest* growth for a given risk level.

  ### Conclusion: Preference vs. Objective Mismatch
  - **Preference:** Choosing **whether to care about geometric growth and survival** *is* a preference. If you truly value only linear Expected Value (`E[W]`) and are utterly indifferent to variance, bankruptcy risk, and the path taken, then betting full bankroll on +EV opportunities maximizes that (flawed) single-bet metric. Few humans or institutions can sustain this psychologically or practically.
  - **Objective Mismatch:** Criticizing overbetting is **not** about imposing log utility preference. It's about pointing out that **overbetting is mathematically incompatible with the goal of long-term wealth growth and survival.** If you desire geometric growth ("building wealth steadily"), betting > Kelly is self-sabotage.
  - **The "Negative Growth Rate":** It **is** true and **not** an exaggeration. Betting more than twice Kelly (`f > 2*f_kelly`) turns the long-run growth rate negative, ensuring ruin. This occurs because the destructive impact of large losses on compounding overwhelms the positive EV.

  **In short:** Kelly isn't universally "optimal" for all preferences. But if your goal involves compounding wealth over time without going broke, it *is* mathematically optimal, and overbetting is objectively suboptimal for that goal. The ruin warnings are rigorous mathematical consequences of multiplicative dynamics, not mere expressions of risk aversion.
