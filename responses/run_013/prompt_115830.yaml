answer: |-
  **Reject step (4).**

  Step (4) claims any self beyond the aggregates is a "bare posit" equivalent to a soul and thus invalid. This looks compelling because it appeals to empiricism: if we can't experience a separate self, positing one seems unsupported speculation. However, it overreaches by dismissing *any* framework for continuity—like karma, compassion, or liberation—as inherently invalid without proving such frameworks require a metaphysical soul. Buddhist traditions (like your friend's Yogācāra reference) offer *conventional* continuity mechanisms (e.g., storehouse consciousness, dependent arising) that are not "bare posits" but empirically observable *processes*. Rejecting (4) allows these.

  **Costs of rejection:**  
  - **To step (5):** You must accept a non-substantialist continuity—a causal stream *functioning as* an "owner" for karma/ethics without being a fixed self. This stream is dependently arisen, impermanent, and ownerless in an ultimate sense, but conventionally coherent.  
  - **To step (6):** Personal identity becomes a *conventional truth*: your mother is the "same person" via continuity of the causal stream (body/mind aggregates evolving under causes/conditions), even as Alzheimer's alters it. Grief and love are valid because the causal history binds the griever to the cared-for.  
  - **To step (1-3):** The aggregates still aren't a *true self*. The rejection doesn't resurrect a self-essence; it acknowledges continuity arises *from* the aggregates' interdependence, not beyond them.  
  - **To Yogācāra:** Storehouse consciousness isn't a "relabeled self" if understood as a dynamic, empty process carrying karmic seeds—not a hidden *atman*. But this requires careful interpretation to avoid subtle reification.  

  **Why (4) seemed compelling:** It conflates *all* continuity with a soul-possession. By rejecting it, you preserve (7)'s ethical core while upholding no-self's anti-essentialism—but you pay by embracing a sophisticated, nuanced view of continuity that demands rigorous practice to avoid subconscious reification of the stream itself.
