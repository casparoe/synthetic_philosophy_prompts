prompt: |-
  I read Hofstadter on how the 'I' isn't stuck in one skull -- that a fair chunk of you gets copied into the people who know you best, so when you die something of you is still running in their heads, not as a memory but as a real partial instance of you. I want to take that seriously, and I'm trying to work out what a theory of personal identity would have to deliver to survive it. So give me the desiderata -- not a theory, the spec: the cases it has to get right, the distinctions it can't flatten, the things it must not be allowed to say. With the case or consideration that forces each one.

  Don't only give me the usual suspects (fission, gradual neuron-by-neuron replacement, the split-brain patients). It also has to handle: a widow who can finish her late husband's sentences better than he could and gets his jokes right when nobody else does; a man who is, on any honest reading, about 40% his mother and 15% his oldest friend; identical twins raised apart who end up with the same laugh; two people who each carry a copy of the same dead friend and now disagree about what he would have wanted. Throw in your own case if you've got one that does alot more work than mine.

  Then say which requirements are non-negotiable and which are just what one camp happens to like, and flag any pair I can't have at once -- my suspicion is that 'being the same person comes in degrees' fights with 'identity is one relation, not a similarity score', but you tell me. Skip the scorecard of rival theories, I just want the list. 600 words max.
reasoning: |-
  Okay, the user is asking about personal identity theory in light of Hofstadter's idea that parts of us live on in others. They want a list of requirements (desiderata) for any theory that takes this seriously, without proposing an actual theory. They mentioned specific cases like the widow finishing sentences and twins with the same laugh, and want to avoid standard thought experiments. I need to provide the essential criteria such a theory must meet, highlight conflicts, and note which are non-negotiable versus debatable.

  First, I need to identify the core challenge: Hofstadter's view blurs the boundaries of personal identity, suggesting that "I" extends into others' minds. This conflicts with traditional views where identity is confined to one brain. The user wants desiderata that force a theory to accommodate this without collapsing into incoherence.

  Key cases from the user: widow's deep understanding, a person being "40% his mother," twins with identical laughs, and conflicting copies of a dead friend. Each case tests different aspects—persistence of identity beyond death, partial inheritance, innate vs. learned traits, and divergence in replicated identities. I should add my own case if it adds value—maybe a group embodying a shared ideology more than any individual, to test distributed identity.

  Desiderata must ensure the theory: 
  1. Allows identity persistence beyond biological death (via others). 
  2. Accommodates partial inheritance without full identity. 
  3. Handles innate traits vs. socially copied ones. 
  4. Explains divergence in copied identities. 
  5. Addresses distributed identity across a group. 

  Non-negotiables: Probably persistence beyond death and partial inheritance, as they're central to Hofstadter. Conflicts: Degrees of identity vs. all-or-nothing identity is a big one. Also, uniqueness (one person per body) clashes with shared traits. 

  I need to list each desideratum with the case that forces it. For example: 
  - Persistence: Widow case. 
  - Partial inheritance: 40% mother case. 
  - Innate vs. copied: Twins' laugh. 
  - Divergence: Conflicting copies. 
  - Distributed identity: Group case. 

  Then note conflicts: If identity is degreed, it can't be a strict, transitive relation. Also, uniqueness must be relaxed. 

  Finally, clarify which requirements are widely accepted (persistence, no contradictions) vs. contentious (degrees, uniqueness). The widow case making persistence non-negotiable, while degrees vs. strict identity is a camp preference. 

  Word limit is tight—600 words. Stay concise, avoid theory comparisons, focus on specs. Make sure the list is clear and each point is tied to a case.
answer: |-
  Here are the desiderata for a theory of personal identity accommodating Hofstadter's "copying" view, derived from your cases and core demands. The cases force specific requirements:

  1.  **Persistent Partial Instantiation (Non-Negotiable):** The theory *must* allow for a person P to genuinely persist (not merely be remembered) as partial, active instances within other minds *after P's biological death*.  
      *Case:* The widow finishing her late husband's sentences and getting his jokes uniquely. This demands *active persistence*, not passive storage.

  2.  **Degrees of Inheritance (Likely Contentious):** The theory *must* accommodate that individuals can *partially consist* of inherited/copied patterns from others without *being* those others.  
      *Case:* The man who is "40% his mother". This requires quantification of influence without collapsing identity (he isn't his mother).

  3.  **Distinction: Innate Template vs. Copied Pattern:** The theory *must* distinguish traits arising from shared innate biology from those actively copied via interaction.  
      *Case:* Identical twins raised apart with the same laugh. Is this shared biology or mutual copying? The theory must differentiate these sources without conflating them, impacting claims of "copying".

  4.  **Divergence of Instances (Non-Negotiable):** The theory *must* allow distinct, equally valid, partial instances of P (within different hosts) to develop differently and potentially conflict, without one being "truer" than the other *simply due to divergence*.  
      *Case:* Two people disagreeing about what their dead friend would have wanted, both drawing on their internal "copy". The copies are partial, active, and evolve independently within new contexts.

  5.  **Non-Transitivity of Core Identity (Critical):** If A instantiates a significant part of B, and B instantiates a significant part of C, the theory *cannot* imply A instantiates a significant part of C (or that they are the *same* person). Identity/instantiation chains must not be transitive.  
      *Case:* (Augmented) Imagine the widow (instantiating husband) deeply influences her child, who then influences their friend. The friend does *not* thereby instantiate the husband. The theory must block this collapse.

  6.  **Distributed Co-Instantiation (Contentious):** The theory *must* allow a complex pattern (a "person") to be *distributed* and actively co-instantiated across multiple minds simultaneously, without requiring a single "master" copy or physical locus.  
      *Case:* (Augmented) A political movement or artistic school where no single member fully embodies the "spirit," but the collective interaction actively sustains and evolves it. Members genuinely instantiate parts of this shared "identity".

  7.  **Preservation of Uniqueness (Conditional):** The theory *must* preserve the uniqueness of individual biological persons *as distinct entities*, even while allowing their patterns to be copied. It *cannot* imply that widespread copying dissolves the distinction between originator and copier *as individual loci of experience*.  
      *Case:* The "40% mother" man. He is distinct *from* his mother, despite carrying her patterns.

  **Key Conflicts & Negotiability:**

  *   **Non-Negotiable:** (1) Persistent Partial Instantiation, (4) Divergence of Instances, (5) Non-Transitivity of Core Identity, (7) Preservation of Uniqueness (as a minimal condition). These are forced by the core phenomena and prevent logical collapse.
  *   **Contentious (Camp Preferences):**
      *   (2) Degrees of Inheritance: Essential if identity is inherently fuzzy/composite (Hofstadter-leaning). Rejected by strict numerical identity theories.
      *   (3) Innate Template Distinction: Crucial for biological vs. social theories of identity formation.
      *   (6) Distributed Co-Instantiation: Required for radical externalism/group minds; rejected by individualist views.
  *   **Core Conflict:** Your suspicion is correct. **Degrees (2) fundamentally conflicts with "Identity as a Single Relation" (often tied to Uniqueness (7)).** If identity comes in degrees, it cannot be the strict, all-or-nothing, one-to-one relation demanded by traditional numerical identity. The theory *must* choose: either embrace degrees (making "being the same person" a graded, potentially non-symmetric/non-transitive relation) or find a way to anchor strict uniqueness *despite* pervasive copying (e.g., tying it solely to the original biological organism, making copies mere simulations). Hofstadter's view pushes strongly towards degrees. (5) and (4) already break the traditional logical properties of identity.
