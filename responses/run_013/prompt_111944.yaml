     - **Classification**: Goal-directed (with fixed constraints). The approval for large refunds is a separate process that the agent might trigger, but the agent itself is not approval-directed.

  3. **Overnight research agent**: designs and runs its own experiments and reports in the morning.
     - This is the one you are rooting for, and the procedure should reject it as approval-directed? Or maybe not. Let's see.
     - Scenario: The agent is given a research goal (say, maximize scientific knowledge in a domain). But the proposal doesn't specify the objective function. 
     - Q1: What is the explicit objective? The proposal says it designs and runs experiments and reports. It does not specify if it is maximizing a scientific objective or if it is trying to get approval for its experiments and results. 
