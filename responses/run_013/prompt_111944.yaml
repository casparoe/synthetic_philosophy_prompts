     - **Classification**: Goal-directed with constraint (human approval required for the action to be taken).

  2. **Support agent**: authorized to issue refunds below a fixed limit without review.
     - Q1: What is the explicit objective? The agent is designed to resolve customer issues and maximize customer satisfaction (goal). The refund issuance is an action it can take without approval (below a fixed limit). For refunds above the limit, it may need approval.
