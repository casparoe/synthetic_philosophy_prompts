  We are designing a decision procedure to classify agents as either goal-directed or approval-directed. The key distinctions:

  - Goal-directed: selects actions to maximize a stated objective (goal).
  - Approval-directed: selects actions to maximize approval from a human evaluator (or a model standing in for one) who sees the agent's situation and reasoning.

  Wrinkles:
  1. One team proposes sampling uniformly from the top tenth of candidate actions by predicted approval (not pure maximization). We must consider how this affects the classification.
  2. Sometimes the approver is a model (AI) instead of a human. We must determine when that substitution means the design is not approval-directed at all.

  The procedure must:
  - Be runnable in 45 minutes by engineers without theory background.
  - Have clear questions in order, with criteria for sufficient answers.
  - Terminate in a classification of goal-directed (with constraints) when appropriate.
  - Hand the decision to the manager (you) when the question is about what we are willing to ship (value judgment) rather than a fact.

  Procedure Outline:

  1. **Question 1: What is the explicit objective function?**
     - Ask: "What is the explicit, formal objective that the agent is designed to maximize? Is it a clear, predefined metric (like profit, code correctness, user satisfaction) or is it the approval of a human (or model) evaluator?"
     - Sufficient answer: A clear statement of the objective function. If the objective is an approval signal, then we are leaning toward approval-directed. If it's a predefined metric, then goal-directed.
     - If the objective is approval, then go to Question 2. If it's a predefined metric, then we must check if there are constraints that are enforced by approval (Question 3).

  2. **Question 2: Is the approval signal the primary maximization target?**
     - Ask: "Is the agent's action selection mechanism designed to maximize the approval signal (or a prediction of it) above all else? Or is approval used only as a constraint or a secondary factor?"
     - Sufficient answer: If approval is the primary target (i.e., the agent is explicitly trying to get as much approval as possible from the evaluator), then we are in approval-directed territory. However, note the wrinkle: if they are sampling from the top tenth, that is still approximately maximizing approval (it's a form of softmax or noisy top-k). We consider that as still approval-directed because the agent is still primarily driven by approval, just with some randomness for exploration or robustness. So this does not change the classification.

     - But note: if the sampling is from the top tenth by the objective function (if it's goal-directed) then that's different. So we must be clear that the ranking is by predicted approval.

  3. **Question 3: If the agent has a predefined objective, does it use approval as a constraint?**
     - Ask: "Does the agent have a predefined objective (like maximize profit) but with the constraint that actions must be approved by a human (or model) evaluator? And if so, how is that constraint implemented?"
     - Sufficient answer: If the agent first generates actions to maximize the objective and then filters for approval (or uses approval as a constraint in the optimization), then it is goal-directed with constraints. But note: if the agent is using the approval signal to shape its entire behavior (i.e., the approval is the only thing that matters and the objective is not directly used) then it might be approval-directed.

     - However, if the agent is maximizing the objective subject to an approval constraint (e.g., only take actions that are above a certain approval threshold, or that get approved by the evaluator) then it is goal-directed with an approval constraint. But note: if the approval constraint is applied per action and the agent is designed to get each action approved, then it might be approval-directed. We need to see the primary driver.

  4. **Question 4: Who is the approver?**
     - Ask: "Is the approval provided by a human in real-time (or near real-time) or by a model? And if by a model, how is that model trained and what is it trying to predict?"
     - Sufficient answer: 
       - If the approver is a human, then approval-directed remains approval-directed.
       - If the approver is a model, then we must ask: is the model trained to predict human approval? If yes, then it is still approval-directed (because it's a proxy for human approval). If the model is trained to predict something else (like the goal objective) then it becomes a form of goal-directed (because the model is just a tool for the goal). 
       - However, if the model is trained to predict human approval, then the agent is still approval-directed. But if the model is trained to optimize the goal objective, then the agent is goal-directed (with the model as a component). 

     - Critical point: If the model is not predicting human approval but instead is directly optimizing the goal, then the agent is goal-directed. Also, if the model is trained to predict human approval but the human approval is based on the human evaluating the agent's reasoning and situation, then it's still approval-directed.

  5. **Termination Conditions:**
     - If the agent is designed to maximize a predefined objective and does not use approval as the primary signal (only as a constraint or not at all) -> goal-directed.
     - If the agent is designed to maximize approval (even if it's a model predicting human approval) -> approval-directed.
     - If the agent uses a model that is not predicting human approval but is instead trained to predict the goal objective, then it is goal-directed.

     - Hand the decision to the manager (you) when:
       - There is ambiguity in the primary driver (e.g., the agent seems to be balancing both goal and approval without a clear primary).
       - Or when the system uses a model as the approver but the model's objective is not clearly aligned with human approval (e.g., it's a black box or trained on a different objective) and we are not sure if it counts as a human substitute.

     - Also, if the approval constraint is so tight that it effectively overrides the goal (e.g., the agent will only take actions that are 100% approved, and the goal is secondary) then it might be approval-directed. But if the constraint is just a safety layer and the agent is primarily goal-driven, then goal-directed. This is a gray area that might require escalation.

  Now, let's run the procedure on three proposals:

  1. **Coding agent**: patches are reviewed by a human before merge.
     - Q1: What is the explicit objective? The agent is designed to write correct and efficient code (goal: code quality). It generates patches to fix bugs or add features. The human review is a step after the agent acts.
     - Q2: Not applicable because the primary objective is code quality, not approval. But note: the agent's actions are not executed until approved. So we go to Q3.
     - Q3: The agent is generating patches to maximize code quality, but the action (merging the patch) is only taken if approved by a human. So the agent's design is to generate the best patch it can (goal-directed) and then the human acts as a gate. The agent isn't modifying its patch generation to maximize approval (it might, but the proposal doesn't say that). Assuming the agent is not trying to predict the human's approval during patch generation, it is goal-directed with a constraint (the constraint being that the patch must be approved by a human). 
