     - However, note the wrinkle: the agent runs overnight without human oversight. So it cannot get real-time approval. Therefore, if it is approval-directed, it must be using a model of human approval. 

     - Let's assume the team says: "The agent is trained to predict what experiments and results the human would approve, and it chooses actions to maximize that predicted approval."

     - Then:
       - Q1: The objective is to maximize predicted approval (from a model of the human). So it's approval-directed via a model.
       - Q2: Yes, it is maximizing predicted approval (even if it samples from the top tenth, it's still approval-directed).
       - Q4: The approver is a model that predicts human approval. If the model is trained to predict the human's approval (by learning from past human approvals) then it is approval-directed. 

