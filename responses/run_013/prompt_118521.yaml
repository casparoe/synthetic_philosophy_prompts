answer: |-
  ### Essay Question (90 minutes, 25 marks)

  **Scenario:** States A and B simultaneously initiate aggressive military action against each other, each seeking to annex territory to which it has no valid claim. Both sides rely heavily on conscription. Conscripts face severe penalties for refusing to serve, including lengthy imprisonment, though refusal is physically possible. A bloody war of mutual aggression ensues.

  **Stipulated Principle: Liability by Reciprocity (LbR)**
  1.  A combatant is liable to lethal attack if and only if they participate in a reciprocal practice of lethal threat, irrespective of the justice of their cause.
  2.  Duress short of making refusal *impossible* is not a defence against liability, though it is a defence against blame.

  **Task:** Analyse the doctrine of the Moral Equality of Combatants (MEC) under the principle of Liability by Reciprocity (LbR), using the stipulated scenario. Specifically:

  1.  Explain what MEC can still coherently mean under LbR, focusing on whether the distinct claims of *symmetry of justification*, *symmetry of liability*, and *symmetry of excuse* survive or collapse.
  2.  Discuss the implications of LbR for the moral status of non-combatants (civilians) on *both* sides regarding liability to attack.
  3.  Discuss the implications of LbR for the post-war punishment of combatants from *both* sides.
  4.  Conclude whether LbR vindicates the traditional MEC doctrine, merely restates it in different terms, or refutes its core claims.

  ---

  ### Model Answer (Approx. 650 words)

  Liability by Reciprocity (LbR) fundamentally reshapes the Moral Equality of Combatants (MEC) doctrine, neither simply vindicating nor straightforwardly refuting it, but rather collapsing one traditional symmetry while transforming another and introducing significant complexities regarding the third and non-combatant immunity.

  1.  **Collapse of Justification Symmetry, Preservation of Liability Symmetry:** The traditional MEC claim of *symmetry of justification* – that combatants on both sides are equally *permitted* to kill enemy combatants – collapses under LbR. LbR explicitly rejects the justice of the cause as relevant to liability. In the scenario of mutual aggression, *neither* side possesses a just cause. Therefore, combatants on both sides are fighting for an unjust end. Killing enemy combatants cannot be *morally justified* by appeal to a legitimate war aim, as neither exists. However, LbR *preserves symmetry of liability*. According to LbR's first clause, liability arises solely from participating in the reciprocal practice of lethal threat. Soldiers on *both* sides, A and B, are actively engaged in threatening and attempting to kill enemy combatants. This reciprocal participation makes *all* combatants liable to lethal attack, irrespective of the underlying injustice of their state's cause. They are "killable without being wronged" *because* they are reciprocal threat-participants, not because their killing is justified.

  2.  **Transformation of Excuse Symmetry:** *Symmetry of excuse* – the idea that combatants kill wrongly but blamelessly – undergoes a significant transformation under LbR. LbR explicitly separates liability from blame. The second clause states that duress (severe penalties) does not negate liability. Therefore, conscripts in this scenario remain fully liable to attack despite acting under duress; their participation makes them targets. However, LbR allows that duress *can* function as a defence against *blame* or culpability. Combatants on both sides kill wrongly (as their cause is unjust and their participation creates liability in others) under significant coercive pressure. Consequently, while *liable* to be killed and *wrong* in their actions, they may be *excused* from full moral blame or condemnation for participating and killing. Symmetry of excuse *survives* but is grounded *solely* in the excusing conditions of duress applying equally to unjust combatants on both sides, not in the traditional MEC structure.

  3.  **Implications for Non-Combatants:** LbR has profound and problematic implications for non-combatant immunity. The principle grounds liability *exclusively* in participation in a reciprocal lethal practice. Non-combatants (civilians), by definition, do not participate in this reciprocal practice of combat. They are not actively threatening enemy combatants. Therefore, under LbR's own logic, they *lack liability* to direct, intentional attack. Targeting them would wrong them. This holds true for civilians on *both* sides (A and B). However, LbR offers no *positive* justification for non-combatant immunity beyond this negative definition. Crucially, it does not address the traditional justification (their non-participation means they don't pose a threat) nor protect them from harms arising from targeting combatants near them (collateral damage). LbR implies immunity but provides a weaker foundation than traditional just war theory, focusing narrowly on the reciprocal threat relationship.

  4.  **Implications for Post-War Punishment:** LbR strongly militates against the post-war punishment of ordinary combatants for fighting. Punishment typically requires culpability for wrongdoing. While combatants on both sides acted wrongly (participating in unjust aggression), LbR's second clause explicitly opens the door for duress to function as an excuse against blame. Given the severe penalties for refusal faced by conscripts in this scenario (though refusal was possible), it is highly plausible that most combatants would be excused from culpability. Punishing them would therefore be unjust. This holds equally for soldiers from both sides A and B. LbR suggests that liability stems purely from the reciprocal combat relationship during the war, not from culpability for initiating an unjust war. Punishment would only potentially apply to leaders who ordered the aggression without duress.

  5.  **Conclusion - Transformation, not Vindication or Refutation:** LbR does not vindicate the traditional MEC doctrine. It explicitly rejects the core MEC claim of symmetric *justification* for killing. Neither does it merely restate MEC; it grounds liability in reciprocal participation, not state authorization or a blanket permission. However, it doesn't fully refute MEC either. It preserves a form of symmetric *liability* and allows for symmetric *excuse*. LbR transforms MEC. It replaces symmetric *justification* with symmetric *liability based on reciprocity*, decoupled from the justice of the cause. It grounds symmetric excuse in duress, not the mere status of being a combatant. Consequently, MEC under LbR means that combatants on unjust and (hypothetically) just sides alike incur liability through reciprocal threat-participation and may be excused from blame due to duress, but their killing acts are never *justified* if their cause is unjust. The doctrine is fundamentally altered, retaining elements of equality in liability and potential blamelessness but abandoning the core permission to kill.

  ---

  ### Marking Scheme (25 marks total)

  1.  **Analysis of Symmetries under LbR (5 marks):** Must correctly identify that *justification symmetry collapses* (neither side justified), *liability symmetry is preserved* (based solely on reciprocal participation), and *excuse symmetry is transformed* (grounded in duress excusing blame, not status).  
      *   **Error to Penalize:** Failure to distinguish the fates of all three symmetries (justification, liability, excuse) under LbR (e.g., claiming justification symmetry holds, or conflating liability and excuse).

  2.  **Implications for Non-Combatants (5 marks):** Must argue that civilians on *both* sides *lack liability* under LbR (due to non-participation in reciprocity), but also note that LbR provides only a *negative* foundation for immunity (absence of liability) and doesn't address collateral damage or offer a robust *positive* principle like non-threat.  
      *   **Error to Penalize:** Claiming non-combatants on one/unjust side are liable, or failing to identify the limitations of LbR's grounding for non-combatant immunity.

  3.  **Implications for Post-War Punishment (5 marks):** Must conclude that punishment of *ordinary combatants* from *both* sides is likely *unjust* under LbR, as duress excuses blame/culpability despite their wrongful acts. Must distinguish leaders potentially lacking duress.  
      *   **Error to Penalize:** Arguing combatants deserve punishment based on participation alone, or failing to apply the duress clause to excuse blame/culpability for punishment.

  4.  **Evaluation of MEC under LbR (Vindication/Restatement/Refutation) (5 marks):** Must conclude that LbR *transforms* MEC (neither simple vindication, restatement, nor refutation), rejecting justification symmetry but preserving liability symmetry and transformed excuse symmetry, thereby altering its core meaning.  
      *   **Error to Penalize:** Claiming LbR simply vindicates *or* simply refutes the *entire* traditional MEC doctrine without nuance.

  5.  **Argumentative Coherence & Application (5 marks):** Must consistently apply the *stipulated scenario* (mutual aggression, conscription with severe-but-not-impossible penalties) and the *stipulated principle (LbR)* throughout the analysis. Arguments must flow logically from the premises of LbR and the case, not external theories.  
      *   **Error to Penalize:** Ignoring key elements of the scenario (e.g., mutual aggression, nature of duress) or principle (e.g., ignoring the reciprocity clause or the duress clause), or reverting to Walzer/McMahan arguments. Answers must build arguments *from* LbR.

  **A Answer (21-25 marks):** Hits all 5 must-hit points clearly, accurately, and in depth. Demonstrates sophisticated understanding by showing *how* LbR transforms MEC. Logically applies the specific case and principle. Writing is clear, concise, and well-structured.  
  **B Answer (16-20 marks):** Addresses all 5 points but perhaps less deeply or with minor inaccuracies/omissions. Generally applies the case and principle but might miss some nuances (e.g., fully exploring non-combatant limitation or punishment nuances). Logic is sound but less sophisticated. Structure and clarity are good.  
  *(Lower marks result from missing key points, significant errors in applying LbR/case, lack of coherence, or failing to move beyond Walzer/McMahan).*
