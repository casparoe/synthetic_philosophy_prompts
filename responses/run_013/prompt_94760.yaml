prompt: |-
  A pattern in arts institutions has long puzzled me, and I would like you to reconstruct the philosophy it assumes. When a painter, novelist, or composer turns out to have done something appalling, museums and orchestras almost never remove the works themselves from the permanent collection or the repertory; the familiar justification is that a work must be judged on its own merits and that the artist's life is a separate matter. Yet those same institutions will cancel a retrospective, shelve a commission, take a name off a gallery wall, or quietly withdraw a piece from a benefit auction, and they do this without any suggestion that the works themselves have gotten worse. Meanwhile, works whose own content is degrading — canvases that traffic in racial caricature, films that sentimentalize the degradation of their subjects — remain on display and in the canon, largely without anyone reaching for these arguments at all.

  What theory of artistic value does this combination presuppose? Does it require the autonomist thesis that an artist's moral failings never bear on the value of the work, or can a moralist about the artist explain the same behavior by appeal to reputational and institutional costs that fall outside the work's value altogether? Which rival positions does the practice actually rule out, and which does it merely happen to fit? I am especially interested in the second asymmetry: if objectionable content is simply not treated as a reason for removal, what does that reveal about the operative theory of value, and does it sit consistently with the treatment of the artist? Finally, tell me what would have to change in institutional practice if the presupposed view were replaced by one on which a work's moral defects are genuine defects in the work.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're puzzled by a pattern in arts institutions: how they handle artists who've done terrible things versus works with objectionable content. The user points out that institutions don't remove the works themselves, citing the separation of art from artist, but they do cancel retrospectives or remove names. Meanwhile, works with degrading content stay in the canon without much debate. 

  First, I need to reconstruct the philosophy behind this practice. The user mentions autonomism versus moralism. Autonomism says art's value is separate from the artist's morality, which explains why works aren't removed. But why cancel retrospectives? That's where institutional costs come in—reputation, funding, audience comfort. So it's a blend: strict autonomism for the work itself, but pragmatism for institutional actions. 

  Next, the asymmetry: why isn't objectionable content treated the same way? If moral defects in the work aren't seen as affecting its artistic value, that leans toward formalism. The content's morality is irrelevant to its value as art. But if the artist's behavior matters for institutional ties, that's a contradiction. The institution is inconsistent by applying different standards to the artist versus the content. 

  The user asks which rival positions are ruled out. Strong moralism—where moral defects in the artist or work diminish artistic value—isn't followed. If it were, both the work and content issues would lead to removal. Also, theories linking art and artist closely, like certain biographical criticisms, are rejected. But moderate positions could still fit, like pragmatic moralism where external factors justify actions without affecting the work's value. 

  For the second part, what if institutions adopted the view that moral defects in the work are genuine artistic flaws? They'd have to re-evaluate canons, confront problematic content directly, and possibly remove works. This would require new policies, contextualization, and transparency, shifting from formalism to a more inclusive value theory. 

  I should check if the user's deeper need is understanding institutional hypocrisy or seeking ways to advocate for change. They might want to challenge the status quo or reconcile their discomfort with current practices. Addressing the inconsistency and suggesting alternatives could meet that need. Also, considering how power dynamics in institutions preserve canons despite moral issues might be an unspoken angle.
answer: |-
  This institutional pattern reveals a complex, internally inconsistent philosophy of artistic value that blends **moderate autonomism** with **pragmatic institutionalism**, while tacitly endorsing **formalism** for evaluating the artwork itself. Here's a reconstruction:

  1.  **Core Presupposition: Artistic Value ≠ Moral Value (Moderate Autonomism):**
      *   Institutions implicitly accept that the *artistic merit* of a *completed work* is independent of the artist's personal morality ("artist's life is a separate matter"). Removing the work itself is seen as conflating moral judgment with aesthetic judgment – an error.
      *   **What it rules out:** Strong moralism (artist's immorality *always* diminishes the work's artistic value) and strong biographical theories (the work's meaning/value is inseparable from the artist's life and character).

  2.  **The Artist as Brand/Institutional Liability (Pragmatic Institutionalism):**
      *   While the *work's value* is deemed separate, the *artist* functions as a brand associated with the institution. Promoting the artist (via retrospectives, named galleries, commissions) is seen as endorsing the *person*.
      *   **Justification for Cancellations/Removals:** Associating with a morally tainted artist poses reputational, financial (donors, audiences), and ethical risks *for the institution itself*. This is framed as a practical decision about institutional conduct and association, *not* a judgment on the work's intrinsic value. "Withdrawing from auction" is particularly clear – it avoids the institution profiting *directly* from association with the artist at that moment.
      *   **What it accommodates:** Moderate moralism or consequentialism focused on institutional ethics/pragmatics *outside* the work's value. It allows institutions to respond to public pressure without conceding the autonomist core about the work itself.

  3.  **The Asymmetry: Formalism Trumps Content Morality:**
      *   This is the critical inconsistency. The *same* autonomist argument used to shield the work from the artist's immorality ("judge the work on its own merits") is *not* applied to works with morally objectionable *content*.
      *   **Presupposed Theory:** A strong commitment to **formalism** and **canonical value**. The objectionable content is either:
          *   **Aesthetically Transformed:** Seen as formally innovative or historically significant enough that its moral flaws are subsumed or rendered irrelevant *as artistic defects*.
          *   **Contextualized/Historicized:** Treated as a product of its time, demanding contextual understanding rather than removal. Its artistic value (formal qualities, influence, historical role) is deemed paramount.
          *   **Morality as Externally Imposed:** Implicitly, the moral judgment on the *content* is seen as something *outside* the proper domain of aesthetic judgment. Formal qualities *are* the domain of aesthetic judgment and constitute the work's primary value.
      *   **Revealed Inconsistency:** The practice suggests that *the artist's immorality* is seen as genuinely extrinsic to the work, while *morally objectionable content* is seen as an intrinsic feature that, nevertheless, does not necessarily constitute an *artistic* flaw. This privileges form and historical significance over the moral implications of content in the evaluation of artistic merit. The argument "judge the work on its own merits" is applied rigorously against biographical moralism but abandoned when the moral concern arises *from within the work itself*.

  **Which Rival Positions Does This Practice Rule Out?**

  *   **Ruled Out:**
      *   **Strong Moralist Autonomism:** The idea that the artist's immorality *never* has any institutional consequence is disproven by cancellations/name removals.
      *   **Strong Content Moralist Instrumentalism:** The view that morally objectionable content *always* renders a work artistically worthless or necessitates its removal. The persistence of such works in the canon contradicts this.
      *   **Strong Biographicalism:** The notion that the work's meaning/value *cannot* be separated from the artist's life.

  *   **Not Ruled Out (Merely Fits):**
      *   **Moderate Autonomism:** Art's value is distinct from morality, *but* institutions have ethical/pragmatic responsibilities beyond pure aesthetics.
      *   **Moderate Institutional Pragmatism:** Institutions navigate complex pressures; actions regarding the artist's branding don't reflect a theory of art's value itself.
      *   **Formalism:** Artistic value resides primarily in form, composition, technique, innovation – moral content is secondary or irrelevant to *aesthetic* judgment.

  **What Change Would a Content-Moralist View Require?**

  If institutions adopted the view that a work's *moral defects are genuine artistic defects* (e.g., racist caricature *diminishes* its artistic value), practices would fundamentally shift:

  1.  **Re-evaluation of the Canon:** Works with morally objectionable content would face critical reassessment *as art*, potentially leading to deaccessioning or removal from core repertoire/curricula, not just contextual labeling.
  2.  **Explicit Criteria for Removal:** Institutions would need clear, defensible criteria linking specific types of moral defect (e.g., promoting harm, degrading subjects without critical purpose) to diminished artistic value. "Historical significance" would no longer automatically override moral flaws.
  3.  **Prioritization of Moral Critique:** Curatorial statements, exhibition design, and programming would need to actively grapple with the work's moral defects *as part of its artistic evaluation*, not just as historical context. These defects would be presented as reasons the work might be *aesthetically worse*.
  4.  **Consistency Demanded:** The rationale for removing works due to content-based moral defects would need to be reconciled (or contrasted clearly) with the rationale for *not* removing works by immoral artists. A coherent theory linking morality to artistic value would be essential.
  5.  **Increased Deaccessioning/De-canonization:** Removal of objects from permanent collections or core repertoire would become a more frequent and ethically charged act, based on artistic-moral grounds rather than just condition, redundancy, or provenance issues.
  6.  **Shift from Formalism:** Institutions would move away from pure formalism towards a theory of art where ethical perception or the communication of morally sound (or unsound) perspectives is integral to artistic achievement and value.
  7.  **Transparency & Debate:** Decisions would require much greater transparency and public justification, acknowledging the contested nature of linking moral and artistic value.

  **Conclusion:**

  The current practice presupposes a messy hybrid: **Formalist Autonomism for the work's intrinsic value** (defending the art from the artist's life and shielding objectionable content from moral critique *as art*), combined with **Consequentialist Pragmatism regarding institutional association with the artist**. The glaring asymmetry reveals that, while the artist's sins are deemed external, the moral flaws *within* the work are treated as intrinsic features that are nevertheless insufficient to override formal/historical value judgments. This inconsistency points less to a coherent philosophical commitment and more to institutional habits, the inertia of the canon, the dominance of formalist training, and the practical difficulty of systematically re-evaluating vast collections based on evolving moral sensibilities. Adopting a view where moral defects are artistic defects would force a radical, ethically driven overhaul of curation, canonization, and institutional identity.
