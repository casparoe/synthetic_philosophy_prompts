prompt: |-
  I'm the TA for a 300-level epistemology seminar on disagreement and higher-order evidence, and I'm marking the second problem set before Thursday's section. The question was built to make students separate the disagreement literature from the wider debate about higher-order evidence, and then to see whether they can state the akrasia charge against level-splitting precisely; the second half is where most of the stack comes apart. I'd like you to grade the answer below out of 12 using the breakdown in the question, and give me the point-by-point comments that justify the mark: for each sub-part, what the answer gets right, the exact sentence or sentences where it goes wrong and why, and how many of that sub-part's points it earns. Then give the overall mark, and finish with a short note on what a full-credit answer would have added that this one doesn't. Please don't let fluent prose raise the grade — I want comments specific enough that the student can revise from them. And if a claim strikes you as genuinely contestable rather than mistaken, say so and don't deduct for it; I don't want to penalise someone for taking a defensible line. I don't need citations or suggested readings, just the substance.

  The question (12 points: 3 for each part):

  Consider two cases. Case A: Devi and Marco are both careful, well-trained historians working on the same archive; each knows the other to be at least as competent and as thorough as herself, and each knows that they have examined exactly the same documents. They reach opposite conclusions about whether a disputed charter is a forgery, and each has read the other's write-up and finds the other's reasoning as careful as her own. Case B: Devi, before writing up her verdict, receives a note from her physician — the medication she has been taking for the past month is associated, in a minority of users, with a subtle tendency to find ambiguous patterns more probative than they are, and there is no way for her to tell whether she is one of those users. Marco has not looked at the archive at all, and no one else has. Devi's own reasoning still strikes her as compelling.

  (a) What is higher-order evidence? Say precisely how it figures in each case, and whether the two cases raise the same question. (b) What does the conciliationist say about Case A, and what does a steadfast or total-evidence view say? What turns on the difference between them? (c) Is it ever rational to believe that p while believing that one's belief in p is not supported by one's evidence? Say what the state usually called level-splitting amounts to, and assess the charge of epistemic akrasia against it. (d) State the self-defeat objection to conciliationism and say how damaging it is.

  The student's answer (typed up as written, student's own numbering):

  (a) Higher-order evidence is evidence about the epistemic standing of one's beliefs rather than about the subject matter those beliefs are about. The standard case in the literature is the disagreement of a peer: when someone as well placed as I am weighs the same evidence and comes out the other way, that is evidence that something has gone wrong in my own handling of the evidence, and it bears on the disputed question only indirectly. Case A is the paradigm. Devi and Marco have each seen the same documents and each knows the other to be at least as careful as herself, so each now has higher-order evidence about the disputed verdict, and neither can treat her own reading as settling the matter.

  Case B looks similar but is not, in my view, a case of higher-order evidence in this sense. Devi's physician's note tells her something about her own cognitive machinery, but there is no second opinion in play and nobody for her to conciliate with. Properly speaking the note is just one more fact about the world for her to fold into her picture of the archive, so the disagreement literature — which is where the higher-order evidence debate lives — has nothing to say about her situation. The two cases do not raise the same question.

  (b) In Case A the conciliationist says that because Devi and Marco are peers who have seen the same evidence, the disagreement is itself evidence for each of them, and it is unreasonable for either to remain at her original confidence. In the fully symmetric case the equal-weight view says each should move halfway toward the other's position: suspend judgment if they began equally confident, and in any event end up much less confident than before. The steadfast or total-evidence view replies that disagreement is only one consideration among many. It is real evidence, but it can be outweighed; if the first-order evidence genuinely supports the forgery verdict, Devi may keep believing it, because her total evidence still favours it. What turns on the difference is whether the higher-order evidence can defeat a first-order belief that the evidence otherwise supports, or whether the two are simply weighed against each other.

  On the steadfast view, Case B is straightforward: nothing in the note bears on the justification of Devi's verdict, since the total evidence that supported her conclusion is unchanged, and her belief remains exactly as rational, and as warranted, as it was before she opened the letter.

  (c) Level-splitting is the state of believing that p while believing that one's evidence does not support p. It is hard to see how it could be rational, since it looks like plain inconsistency: the agent believes p, and she also believes something incompatible with p. Most writers treat it as a form of epistemic akrasia, believing against one's own better judgment, and I think the charge sticks — an agent who splits levels in this way is contradicting herself, and no belief that requires you to contradict yourself can be rational.

  (d) The self-defeat objection is that conciliationism cannot survive being applied to itself. Conciliationism is itself a contested view, and there are peers who reject it; so by the conciliationist's own standard its defenders should reduce their confidence in it, and if they follow the standard through they should end up with very little confidence in conciliationism. That is a contradiction in the view itself, so the objection is decisive and conciliationism is refuted.

  Please put the overall mark at the end, after the per-part comments.
reasoning: |-
  Hmm, the user is a teaching assistant for an advanced epistemology seminar, and they need me to grade a student's problem set answer. The question is designed to test understanding of disagreement versus higher-order evidence, and specifically the akrasia charge against level-splitting. I need to be precise and critical, not swayed by the student's fluent writing.

  Looking at part (a): The student correctly defines higher-order evidence as evidence about epistemic standing rather than subject matter. They correctly identify Case A as the paradigm peer disagreement case. But they make a mistake in Case B by claiming it's not higher-order evidence because there's "no second opinion." The physician's note is clearly higher-order evidence - it's about Devi's cognitive reliability, not directly about the charter. The student wrongly conflates higher-order evidence with peer disagreement specifically. They get the first half right but miss the core of Case B. I'll give 1.5/3 - full credit for Case A description but half for Case B.

  For part (b): The conciliationist explanation is perfect - suspension of judgment, moving halfway, etc. The steadfast view description is also correct about weighing total evidence. But they make a significant error in applying steadfast to Case B: claiming the note "bears on the justification" is exactly wrong - steadfast views do acknowledge it affects justification, they just weigh it differently. The student misunderstands how steadfast views handle higher-order evidence. 2/3 seems fair - full marks for Case A treatment but deduction for the Case B misstep.

  Part (c) is problematic. The student defines level-splitting incorrectly as believing p while believing evidence doesn't support p. But it's actually believing p while believing you shouldn't believe p (or that your belief is unsupported). This leads them to wrongly call it a "contradiction" - it's actually a conflict between belief and meta-belief, not direct inconsistency. They miss the nuanced akrasia charge entirely. Only 0.5/3 here.

  Part (d) starts strong with the self-defeat objection explanation but then oversimplifies by calling it "decisive" and "refuted." They ignore conciliationist responses (e.g., that it might apply differently to itself). The categorical claim is too strong. 1.5/3 - half credit for accurate setup, half off for lacking nuance.

  Total is 5.5/12. A full-credit answer would have: correctly classified Case B as higher-order evidence, accurately described steadfast treatment of Case B, defined level-splitting properly as a normative disconnect, acknowledged conciliationist replies to self-defeat, and avoided overclaiming. The student's fluency masked some substantive errors, especially in (c) and (d).
answer: |-
  Here is the point-by-point grading for the student's answer, following your breakdown strictly. Each comment specifies what was correct, the exact problematic sentences, why they are problematic/mistaken (not merely contestable), and the points earned per sub-part. The overall mark is at the end.

  **Part (a) (3 points)**  
  **Correct:** Accurately defines higher-order evidence (HOE) as evidence about epistemic standing. Correctly identifies Case A as a paradigm case of peer disagreement generating HOE.  
  **Mistakes:**  
  - *"Case B looks similar but is not, in my view, a case of higher-order evidence in this sense."* → This is mistaken. The physician’s note is classic HOE: it directly concerns the reliability of Devi’s cognitive process (i.e., whether her judgment is distorted), not the archival evidence itself. HOE does not require a "second opinion" or peer; it includes evidence about one’s own faculties (e.g., Christensen’s drug cases).  
  - *"the disagreement literature — which is where the higher-order evidence debate lives — has nothing to say about her situation."* → Incorrect. While peer disagreement is a key *source* of HOE, the HOE debate explicitly extends beyond it (e.g., to cases like B). Case B raises a core HOE question: how should first-order evidence be weighed against evidence of cognitive impairment?  
  - *"The two cases do not raise the same question."* → Partly defensible (they differ in symmetry), but the answer wrongly implies Case B isn’t about HOE. Both raise the *core* HOE question: how meta-evidence affects first-order belief. Deduct for the HOE misclassification.  
  **Points:** 1.5/3 (Full for Case A, half for Case B due to HOE misidentification).  

  **Part (b) (3 points)**  
  **Correct:** Perfect conciliationist description for Case A (symmetric peer disagreement → suspension/moderated confidence). Correct steadfast/total-evidence view: HOE is weighed alongside first-order evidence and can be outweighed. Correctly states the difference turns on whether HOE *defeats* or is *incorporated*.  
  **Mistake:**  
  - *"On the steadfast view, Case B is straightforward: nothing in the note bears on the justification of Devi's verdict... her belief remains exactly as rational, as it was before."* → This misrepresents steadfast views. Steadfast theorists (e.g., Titelbaum) accept HOE *bears on justification* but argue it may not outweigh first-order evidence. Saying the note has *no bearing* implies steadfast denies HOE is justificatorily relevant, which is false. The disagreement is about *weight*, not *relevance*.  
  **Points:** 2/3 (Deduct 1 for misstating steadfast in Case B; rest is flawless).  

  **Part (c) (3 points)**  
  **Correct:** Identifies level-splitting as involving conflicting beliefs. Notes the akrasia charge ("believing against better judgment").  
  **Mistakes:**  
  - *"Level-splitting is the state of believing that p while believing that one's evidence does not support p."* → Incorrect definition. Level-splitting is believing *p* while believing one *should not believe p* (or that one’s belief is *epistemically irrational*). It is not about whether evidence *supports p*, but whether one’s *doxastic attitude* is justified (e.g., one might believe evidence supports p but that external factors make belief irrational).  
  - *"it looks like plain inconsistency: the agent believes p, and she also believes something incompatible with p."* → Mistaken. Believing *p* and believing *my belief in p is irrational* are not *logically* incompatible (no contradiction in content). The charge is *epistemic* akrasia—violating a norm of coherence—not logical inconsistency.  
  - *"no belief that requires you to contradict yourself can be rational"* → Overstates by framing as contradiction. The akrasia charge is about violating rational coherence, not formal logic.  
  **Points:** 0.5/3 (Only partial credit for mentioning akrasia; definition and rationale are wrong).  

  **Part (d) (3 points)**  
  **Correct:** Accurately states the self-defeat objection (conciliationism requires lowering confidence in itself due to peer disagreement).  
  **Mistake:**  
  - *"That is a contradiction in the view itself, so the objection is decisive and conciliationism is refuted."* → Overclaims. Conciliationists (e.g., Elga) have replies: e.g., conciliationism might apply differently to itself, or surviving disagreement might confer stability. The objection is *not* universally seen as "decisive"; it’s a live debate. Calling it a "contradiction" and "refuted" ignores nuance.  
  **Points:** 1.5/3 (Full for stating the objection, half-deduct for overstating its force).  

  **Overall Mark: 5.5/12**  

  **What a full-credit answer would add:**  
  - **(a)** Explicitly classify Case B’s note as HOE (evidence about cognitive reliability) and note both cases raise how HOE impacts first-order belief (even if asymmetry matters).  
  - **(b)** For Case B’s steadfast view: clarify that steadfast acknowledges the note *weakens justification* but may be outweighed by first-order evidence.  
  - **(c)** Define level-splitting precisely as believing *p* while believing *it is irrational to believe p*. Explain akrasia as a failure of epistemic rationality (not logical inconsistency) due to incoherence between belief and meta-belief.  
  - **(d)** Note conciliationist responses to self-defeat (e.g., "self-exemption" strategies) and avoid claiming the objection is "decisive."
