prompt: |-
  Do not explain the wrong kind of reasons problem to me — plan how I should explain it. Next month I lead a sixty-minute session of a cross-departmental reading group (psychologists, linguists and a couple of economists, none with philosophy beyond an introductory course) on that problem: the puzzle that certain considerations appear to count in favour of an attitude while having no bearing on whether the attitude is fitting. Do not send me a reading list. What must come first and what depends on what, and why in that order? Which single example should carry the whole session, and what must that example have — and lack — for the problem to emerge from it rather than merely be illustrated by it? Which misconceptions will this audience bring or form, where exactly in the sequence should each be headed off, and what question at the end will show whether the problem has landed rather than been paraphrased back? What should I leave out at this level, and say that I am leaving out? Two constraints on the design. First, build the session on the case I supply rather than on the demon or the bribe: a doctor who wants to feel compassion for a patient not because the patient's situation merits it but because compassionate doctors are rated more highly, and who can summon the feeling on demand. Second, do not let the object-given/state-given contrast (reasons bearing on whether an attitude fits its object versus reasons bearing only on the attitude's usefulness) do the explanatory work; bring it in, if at all, only after the group has felt the pull of the puzzle, and say what it does and does not settle. Write in British English.
reasoning: |-
  Okay, the user is preparing a session on the "wrong kind of reasons" problem for an interdisciplinary group without philosophy backgrounds. They've given specific constraints: use a doctor case study, avoid jargon like "object-given/state-given," and focus on building understanding rather than providing readings. 

  Hmm, the challenge is making this abstract philosophical puzzle tangible for psychologists, linguists, and economists. The doctor example is perfect—it's profession-adjacent for psychologists, involves intentionality (linguists' wheelhouse), and touches on incentives (economists' domain). But I must ensure the example isn't just illustrative but actually generates the puzzle. That means the doctor must genuinely feel compassion without merited grounds—no self-deception or hidden motives.

  *checks constraints again* Right, avoid demon/bribe cases. The doctor's institutional pressure ("rated more highly") is subtle but clear. Also, object-given/state-given must come late. Tricky, as that's the standard framework. Instead, I'll force tension through questions: "Is this compassion real? Does it deserve praise?" 

  Key pitfalls: 
  - Psychologists might reduce it to cognitive dissonance ("they're just rationalizing"). Need to block that early by stressing the doctor's sincerity. 
  - Economists could fixate on incentives. Must emphasize that the compassion *works* but feels illegitimate anyway. 
  - All might miss the "fittingness" angle. The patient's actual suffering is irrelevant here—that’s the bombshell.

  Ah! The core sequence: 
  1. Establish compassion's ordinary conditions (patient's suffering). 
  2. Introduce the doctor's reason (care ratings). 
  3. Reveal the compassion is authentic. 
  4. Ask: "But is this compassion *appropriate*?" That’s where the puzzle bites—they’ll feel the disconnect before labeling it.

  Timing: 60 minutes is tight. Must skip related debates (e.g., moral worth) and explicitly say so. The killer closing question: "If you were the patient, would you feel comforted?" That exposes whether they grasp the gap between functional and fitting attitudes.

  *Double-checks British English* "Merited" not "warranted," "reckoning" not "reasoning"—got it. Final test: Does this make the abstract itch palpable before naming it? Yes—the doctor’s "successful but hollow" compassion should linger uncomfortably.
answer: |-
  Here’s a structured 60-minute session plan focused on your doctor example, designed to make the **wrong kind of reasons (WKR) problem** emerge experientially for your interdisciplinary group. The sequence prioritises *feeling the puzzle* before labelling it.

  ---

  ### **Session Structure: Why This Order?**
  1. **Groundwork: What Makes Compassion Fitting? (10 mins)**  
     - Start with: *"When is compassion for a patient fitting or appropriate?"*  
     - Elicit responses: Focus on **features of the patient’s situation** (suffering, vulnerability, blamelessness).  
     - *Why first?* Establishes the baseline: fittingness depends entirely on the **object** (the patient).  

  2. **Introduce the Doctor Case (5 mins)**  
     - Present your scenario:  
       > *Dr. A feels genuine compassion for Patient B. But Dr. A cultivated this feeling solely because compassionate doctors get higher patient satisfaction scores. Patient B’s actual situation (e.g., a minor cold) doesn’t merit compassion.*  
     - Clarify:  
       - Dr. A’s compassion is **sincere** (not faked).  
       - The **reason** for cultivating it is institutional reward, not the patient’s plight.  

  3. **The Crucial Tension: Two Questions (15 mins)**  
     - Pose sequentially:  
       - **Q1:** *"Does Dr. A’s reason (getting higher ratings) count in favour of feeling compassion?"*  
         → *Likely consensus:* Yes—it’s instrumentally rational.  
       - **Q2:** *"Does this reason make compassion more fitting to Patient B?"*  
         → *Key:* Patient B’s situation is unchanged. Push the group: *"Does the ratings system make Dr. A’s compassion more deserved or appropriate to this patient?"*  
     - *Why this order?* Forces a conflict: The same reason seems to count *for* the attitude (Q1) but irrelevant to its fittingness (Q2). The puzzle **emerges from dissonance**, not illustration.  

  4. **What the Example MUST Have (and Lack) to Generate the Puzzle**  
     - **Must have:**  
       - A **sincere attitude** (genuine compassion) — so we’re evaluating reasons *for the attitude*, not pretence.  
       - A **clear instrumental reason** (care ratings) divorced from the object’s properties.  
       - An **object (patient) lacking fittingness-grounding features** (trivial ailment).  
     - **Must lack:**  
       - Any *direct link* between the reason (ratings) and the patient’s actual condition.  
       - Self-deception (Dr. A knows why they feel compassion).  

  5. **Preempting Misconceptions**  
     - **Misconception 1 (Psychologists/Economists):** *"This is just about extrinsic motivation vs. intrinsic motivation."*  
       - **When/How to block:** During Q1/Q2 discussion. Stress: *"Even if we grant Dr. A is extrinsically motivated, does that affect whether compassion FITS the patient?"*  
     - **Misconception 2 (Linguists):** *"This is a semantic dispute about ‘reason’."*  
       - **When/How to block:** After introducing the case. Preempt: *"We’re not asking what ‘reason’ means linguistically. We’re asking whether one type of consideration (institutional reward) impacts fittingness."*  
     - **Misconception 3 (All):** *"But compassion helps the patient, so it’s fitting!"*  
       - **When/How to block:** During Q2. Retort: *"Does compassion’s usefulness make it a *correct response to this patient*? What if the patient discovers Dr. A’s reason?"*  

  6. **Introducing Object-Given/State-Given (Only After the Puzzle Bites) (10 mins)**  
     - **When:** Once the group feels the Q1/Q2 tension.  
     - **How:**  
       - *"Some philosophers distinguish: Reasons bearing on the object’s features (object-given) vs. reasons bearing on the attitude’s consequences (state-given)."*  
       - **Stress:** *"This labels the puzzle; it doesn’t solve it. We still need to explain: Why do state-given reasons feel like ‘reasons for the attitude’ if they don’t affect fittingness?"*  
     - **What it doesn’t settle:** Whether state-given reasons are genuine normative reasons (or merely practical incentives).  

  7. **The Closing Test Question (5 mins)**  
     - **Ask:** *"If you were Patient B, and you learned Dr. A’s reason for compassion, would you feel: (a) Grateful they made themselves compassionate? (b) Uncomfortable their compassion wasn’t about you? (c) Both? Neither?"*  
     - **Why this tests understanding:** It reveals if they grasp the *split* between instrumental value and fittingness. Paraphrasing would yield abstract agreement; "landing" the problem generates conflicted answers (e.g., "c – both").  

  8. **What to Leave Out (Explicitly)**  
     - **Omit:** Moral responsibility, epistemic reasons, or whether attitudes can be "chosen."  
     - **State upfront:** *"We’re bracketing whether Dr. A is blameworthy, and whether we can directly control feelings. Focus only on what makes compassion fitting."*  

  ---

  ### **Why This Design Works for Your Audience**
  - **Psychologists:** Engages emotion regulation (summoning compassion) and motivation.  
  - **Linguists:** Explores how "reasons" function in normative claims without semantic analysis.  
  - **Economists:** Uses incentives but challenges their normative scope.  
  - **No philosophy background:** Progresses from concrete intuition (compassion) to abstraction, avoiding jargon until the puzzle is felt.  

  The doctor case **does the heavy lifting** because its instrumental logic is irresistible, yet its disconnect from fittingness is visceral. By the end, the group should wrestle with *why* state-given reasons feel simultaneously relevant and alien to the attitude’s core purpose.
