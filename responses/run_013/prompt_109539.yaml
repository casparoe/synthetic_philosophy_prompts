prompt: |-
  I retired from experimental physics a few years back and have been reading philosphy and the AI-safety stuff since, mostly as an amateur. Something bugs me. In physics I got used to separating a result that's exact at the scale you found it from one that survives coarse-graining -- a law can be dead-on where you tested it and useless one scale up. In the prosaic-alignment discussions I don't see that split made cleanly. People seem to fold "this method gets the behavior we want at today's capability" into "this method keeps getting the behavior we want as capability climbs," and I suspect those are two different questions needing different work. Suppose I've got money to keep two or three people busy for a couple of years, no new theoretical insight allowed, just the methods we already have. Which open questions about whether our alignment methods survive capability scaling actually matter most, and in what order would you tackle them? I want the reasoning, not a list: what's upstream of what, which of these a philosopher rather than an ML engineer could actually make progress on, and what would move a question up or down the ranking. Skip the reading lists, I can't really use them.
