prompt: |-
  I've been reading one of those big popular books on the history of economic ideas, and its chapter on Keynes and the good life is bugging me. I want to know how fair it is. Here's the gist of what the book says:

  Keynes thought economics was only ever a means to an end, and the end was leisure. In his 1930 essay about the economic possibilities for our grandchildren he predicted that within a hundred years we'd be down to a fifteen-hour week, and that this would be the good life — the economic problem solved for good, scarcity abolished, everybody finally free to enjoy themselves. His ethics came out of Bloomsbury and out of G.E. Moore's Principia Ethica, which argued that the only thing good in itself is pleasure, so Keynes was essentially a utilitarian who thought the good life was about maximizing pleasant mental states. Later on, in a memoir, he repudiated all of that and turned into a hard-nosed pragmatist who only cared about policy. He did also say somewhere that the love of money is a disgusting morbidity. So the upshot is that the famous essay isn't really economics at all — it's a sermon telling us the good life is leisure, and that any society still working forty-hour weeks has failed morally.

  I'm inclined to think the book is basicly right, since Keynes does get called a Bloomsbury aesthete, but the Moore part seems off to me — I'd have said Moore was more about beauty and friendship than pleasure? Anyway, can you go through it sentence by sentence and tell me what a Keynes scholar would nod at, what they'd wince at, and what they'd flat out reject? And does the book's conclusion follow from whatever parts survive?
reasoning: |-
  Okay, the user is asking about the accuracy of a popular history book's portrayal of Keynes's views on the good life and leisure. They've summarized the book's claims and want a detailed critique. Let me break this down systematically.

  First, I notice the user is clearly well-read - they're engaging critically with secondary sources and even questioning the interpretation of Moore's Principia Ethica. That's sophisticated. Their core concern seems to be about historical accuracy in intellectual biography, specifically whether Keynes is being fairly represented.

  The book's summary contains several distinct claims that need separate evaluation: (1) Keynes saw economics as purely instrumental to leisure (2) His 15-hour workweek prediction (3) Influence of Bloomsbury/Moore (4) His supposed later "repudiation" (5) The "sermon" characterization. 

  On the instrumental view of economics - yes, absolutely correct. Keynes consistently treated economics as means to higher ends. The 1930 essay is indeed central here, though we should note it's more nuanced than just "leisure" - it's about liberation from economic necessity. 

  The Moore connection needs careful handling. The user is right to question the "pleasure" reductionism - Moore actually privileged aesthetic experience and human connection. This matters because it shows Keynes wasn't just a simple hedonist. The book's oversimplification here is significant.

  The alleged later "repudiation" is the most problematic claim. That 1938 memoir fragment is constantly misread - it was actually about his personal ethics and politics evolving, not rejecting the grand vision. He remained committed to solving the economic problem throughout his life.

  The "sermon" characterization misunderstands Keynes's method. His utopian vision was always grounded in economic analysis - productivity projections, capital accumulation theories. It wasn't just moralizing.

  What the user might really be probing is whether modern capitalism's failure to deliver leisure represents a moral failure. That's actually the most interesting philosophical question lurking here - one Keynes himself grappled with. The book seems to want to reduce him to a moralist when in fact he was both prophet and pragmatist.

  I should emphasize how current this debate remains. The user's frustration with 40-hour workweeks amid plenty suggests they're personally engaging with Keynes's central critique - which is exactly why getting his ideas right matters.
answer: |-
  A Keynes scholar would give this account **partial credit but with significant corrections**, particularly regarding Moore's ethics and Keynes's supposed "repudiation." Here's the breakdown:

  1.  **"Keynes thought economics was only ever a means to an end, and the end was leisure."**
      *   **Nod:** Absolutely correct. This is central to Keynes's vision, especially in "Economic Possibilities for our Grandchildren" (1930). He saw solving the "economic problem" (scarcity) as the *precondition* for humanity to pursue higher ends, which he identified primarily with **leisure** – not idleness, but freedom from *compulsory* labour to pursue arts, culture, science, relationships, and personal fulfilment.

  2.  **"In his 1930 essay... he predicted... a fifteen-hour week... scarcity abolished... everybody finally free to enjoy themselves."**
      *   **Nod:** This accurately captures the core prediction and optimism of the essay. He foresaw immense productivity gains leading to vastly reduced working hours and the overcoming of absolute material scarcity.
      *   **Wince:** While the prediction is famous, scholars emphasize it was a *provocative thought experiment* or "possibility," not a rigid forecast. He was highlighting potential futures, not guaranteeing them. Also, "enjoy themselves" is a bit reductive; his vision of leisure was richer than simple hedonism (see Moore point below).

  3.  **"His ethics came out of Bloomsbury and out of G.E. Moore's Principia Ethica..."**
      *   **Nod:** Undeniably true. Bloomsbury values (aesthetic appreciation, personal relationships, intellectual freedom) and Moore's *Principia Ethica* were profoundly formative for the young Keynes.

  4.  **"...which argued that the only thing good in itself is pleasure, so Keynes was essentially a utilitarian..."**
      *   **Flat Out Reject / Major Wince:** This is a **serious misrepresentation of Moore**. Moore explicitly rejected Hedonistic Utilitarianism (the view that *only* pleasure is intrinsically good).
          *   Moore argued that the most valuable things are **complex states of consciousness** involving the appreciation of beauty and the enjoyment of loving personal relationships ("affection"). He called these "the Ideal." Pleasure was often a *component* of these states, but it was the *quality* (beauty, love) and the *conscious apprehension* of that quality that mattered, not mere pleasure sensation.
          *   Keynes himself, in his 1938 memoir "My Early Beliefs," explicitly described the Moorean ideal as "states of mind... not associated with action or achievement or with consequences... timeless, passionate states of contemplation and communion... the love of love... the love of knowledge... the love of beauty." This is vastly richer than "maximizing pleasant mental states."
          *   While Keynes *started* with a quasi-utilitarian *calculus* based on Moore's ideals (trying to maximize future "good states"), he later critiqued this youthful approach as flawed. He was strongly influenced by Moore's ethics, but **not** as a crude pleasure utilitarian.

  5.  **"Later on, in a memoir, he repudiated all of that and turned into a hard-nosed pragmatist who only cared about policy."**
      *   **Flat Out Reject / Major Wince:** This is a **gross misreading** of Keynes's 1938 memoir "My Early Beliefs."
          *   **Repudiates the *method*, not the *ends*:** Keynes repudiated the *abstract, rationalist, and naive way* he and his young Bloomsbury friends *applied* Moore's ethics ("We were amongst the first of our generation... to escape from the Benthamite tradition... but we were brought up in this [Moore's] tradition, and it took us a long time to get out of it"). He criticized their belief in rational calculation of consequences and their naive optimism about human nature, seeing it as ill-equipped for the real world (especially post-WWI/WWII).
          *   **Does NOT repudiate the Bloomsbury/Moore ideals:** He explicitly states: "I remain, and always will remain, an immoralist" in the sense of valuing Moore's "Ideal" above conventional morality. He never renounced the *value* of beauty, love, knowledge, or the ultimate goal of transcending the economic problem.
          *   **Pragmatist ≠ Only Policy:** Becoming more pragmatic and engaged with urgent policy problems (unemployment, Depression, war finance) did *not* mean he abandoned his deeper philosophical vision. *The General Theory* itself, while a technical policy masterpiece, was ultimately aimed at creating the stable conditions necessary for society to move *towards* the long-term vision outlined in 1930. He was working on the *means* to secure the *end*.

  6.  **"He did also say somewhere that the love of money is a disgusting morbidity."**
      *   **Nod:** Correct. This is a direct quote from the *end* of the "Economic Possibilities" essay. He saw the hoarding instinct and the pursuit of money for its own sake as pathological once the economic problem was solved. This reinforces his view that the purpose of wealth is liberation, not accumulation.

  7.  **"So the upshot is that the famous essay isn't really economics at all — it's a sermon telling us the good life is leisure, and that any society still working forty-hour weeks has failed morally."**
      *   **Partial Nod / Partial Wince:**
          *   **Sermon?** It's certainly a moral and philosophical essay, delivered with conviction. Calling it a "sermon" is a bit pejorative but captures its hortatory tone.
          *   **Not Economics?** **Wince.** While not a technical economics paper, it's deeply *grounded in* Keynes's economic understanding. His prediction rests entirely on projections of capital accumulation and compound productivity growth – core economic concepts. It's an essay on the *ends* of economics, written by an economist using economic reasoning about future possibilities.
          *   **Failed Morally?** **Partial Nod, but Overstated.** Keynes *does* imply that a society which achieves the technical capacity to overcome scarcity but *fails* to translate that into liberation from compulsory toil has profoundly missed the point. He saw this as a potential psychological and social failure ("the love of money as a possession... will be recognised for what it is, a somewhat disgusting morbidity"). He might call it a failure of imagination or priorities rather than strictly "moral" in a narrow sense, but the implication of a profound societal error is clear.

  **Conclusion Regarding the Book's Upshot:**

  *   **Surviving Parts:** Keynes *did* see the end of economics as enabling a life beyond toil focused on higher goods ("leisure" in his broad sense). He *was* profoundly influenced by Bloomsbury and Moore (though Moore was misrepresented). He *did* predict vastly reduced work hours and saw persistent focus on accumulation after solving scarcity as pathological. His vision *is* a powerful critique of societies working long hours amidst plenty.
  *   **Book's Conclusion:** The core conclusion – that Keynes saw the good life as leisure achieved through overcoming scarcity, and that a society failing to achieve this has missed the point – **largely survives the corrections.** However:
      *   It misrepresents the *foundation* of his ethics (Moore ≠ pleasure utilitarianism).
      *   It fundamentally misreads his later pragmatism as a *repudiation* of his ideals rather than an adaptation of *method*.
      *   Calling the essay "not really economics" underestimates its grounding in economic reasoning.
      *   The "failed morally" charge is rhetorically close to Keynes's sentiment ("disgusting morbidity"), but scholars might prefer "failed to achieve its potential" or "succumbed to pathological incentives."

  **In essence:** The book gets Keynes's *ultimate goal* (leisure/liberation from scarcity) broadly right, and his critique of money-lust right, but seriously distorts the philosophical basis (Moore) and misinterprets his later career as an abandonment of that vision rather than a necessary engagement with the messy path towards it. The sermon critique is partially fair regarding tone, but unfair in dismissing its economic foundation. The *spirit* of the conclusion aligns with Keynes, but the details and supporting arguments are flawed.
