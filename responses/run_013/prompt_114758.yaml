prompt: |-
  I'm an intensive care consultant in a big NHS trust and I'm also the trust's clinical lead for organ donation, which in practice means that when a patient on one of our units looks like becoming a donor after their circulation stops, I'm the person the registrar phones at three in the morning. We do two or three of these a month. What's been bothering me is that none of the questions we actually get asked at that hour are the ones that turn up in the teaching: what people want to know, standing next to a body with the family in the room, is whether this patient is dead already or whether we're about to be the ones who make them dead by turning something off, and the guidance we've got doesn't really put that question on the page. So I'd like you to write me a decision procedure my registrars can actually run, in order, at night, with nobody more senior awake — the questions to ask, what counts as a sufficient answer to each, where it stops and says no, and where it hands the decision to a named person because the question is one of values and not of physiology. It has to be usable by someone who isn't a neurologist, in the time we've got, which is not much, and with alot riding on it.

  Some things I want it to take seriously rather than smooth over. First, a distinction our ethics lead keeps pushing and I've slowly come round to: in the commonest route to donation here we don't wait for the heart's stopping to be irreversible, we wait for it to be permanent — permanent meaning nobody is going to try to start it again — and that's a decision we make rather than a fact we observe, so I want the procedure to be honest about where inside it that decision sits and whose signature is on it. Second, three cases the standard guidance mumbles at. (a) A patient on an extracorporeal circuit, where the blood is oxygenated outside the body, so the usual bedside tests don't mean what they normally mean and it's genuinely unclear how much blood the brain is getting — I want to know what my registrar does with the brainstem examination here, and what she does when she can't do it properly. (b) Withdrawal of treatment in a patient we expect to arrest, followed by our five minutes of asystole (tell me if five is the wrong number and what it should be), after which the retrieval team wants to put the donor onto a circuit that pushes warm oxygenated blood back into the abdominal organs with the vessels to the head clamped off so the brain isn't reperfused — they call it regional perfusion — and one member of our committee keeps saying, in a way I can't quite answer, that it's that circuit and not the withdrawal that actually ends the patient's life. (c) The family who say we're only calling him dead because we want his organs, which is the objection that actually shakes people, and a procedure that can't be said out loud in front of them is no use to me.

  Then run it on those three, plus a fourth: the patient who meets the brainstem criteria with the heart still going, in the next bed to one whose heart has stopped and who is being declared on circulatory grounds — and say plainly what the procedure does about the fact that we call these two patients dead at different moments and for different reasons. Include at least one case where your procedure gives an answer I won't like; I'd much rather find that out now then in a coroner's court. And say what the procedure can't settle at all, and where the honest answer is that we're running on convention. British English throughout, please, and don't tidy up the places where the law and the ethics come apart.
reasoning: |-
  Hmm, this is a complex and urgent request from an ICU consultant who's also the clinical lead for organ donation. They're frustrated that standard guidance doesn't address the real ethical dilemmas their registrars face during night calls about potential donors. They want a practical decision procedure that tackles three specific challenging scenarios plus a fourth comparison case.

  The user identifies several crucial gaps in current protocols: 
  First, the distinction between irreversible versus permanent cessation of circulation - emphasizing this is a decision, not an observed fact. 
  Second, three complex cases: 
  (a) Patients on ECMO where standard brainstem tests are unreliable 
  (b) Concerns about whether regional perfusion after circulatory death actually causes death 
  (c) Family accusations that death declaration is organ-driven 
  Plus a fourth scenario contrasting neurological and circulatory death determinations.

  Key requirements include:
  - Usable by non-neurologists under time pressure
  - Explicit about where value judgments occur and who must make them
  - Doesn't gloss over legal/ethical tensions
  - Must withstand family scrutiny
  - Needs to flag "unsettleable" questions
  - Includes at least one uncomfortable conclusion

  I need to structure this as a clear flowchart-like procedure with:
  1. Sequential questions with binary outcomes
  2. Explicit "stop/no donation" points
  3. Designated decision-makers for value judgments
  4. Special handling for the three flagged scenarios
  5. Honesty about convention-based decisions

  For ECMO cases (a), the procedure should address unreliable brainstem testing by requiring modified assessments and defaulting to circulatory criteria when uncertain. 

  For regional perfusion (b), it must confront the ethical dilemma head-on - acknowledging the consultant's concern while following current UK practice, making clear this requires senior sign-off.

  For family objections (c), the procedure needs to validate concerns while providing scripted responses that maintain transparency.

  The fourth scenario should openly acknowledge the different death determination pathways without false equivalence.

  The "uncomfortable conclusion" could be that some ECMO patients who might have neurological recovery can't be donors under circulatory criteria - highlighting a genuine limitation.

  Throughout, I'll maintain:
  - British English spelling/terms ("centre" not "center")
  - NHS-specific references (NHSBT, DCD pathways)
  - Clear distinction between physiological facts and value judgments
  - Named responsible parties (registrar, consultant, MDT)
  - Coroner-level defensibility
answer: |-
  Below is a practical, step-by-step decision procedure for registrars facing organ donation queries in the ICU, designed for night-time use. It addresses your core concerns: **explicitly marking the "permanence" decision**, tackling your three complex cases head-on, contrasting neurological vs. circulatory death, and flagging where convention or values must prevail. It’s structured as a checklist with binary stops, clear handovers, and scripted responses for families.  

  **Organ Donation Decision Procedure for Registrars**  
  *For use when: (1) Circulatory Death (DCD) is anticipated post-withdrawal, OR (2) Neurological Death (DBD) is suspected.*  
  ***British law and ethics require two parallel pathways. This procedure does not conflate them.***  

  ---

  ### **STEP 0: PREREQUISITES**  
  **Ask:**  
  1. Is treatment withdrawal planned and *medically appropriate* (i.e., treatment "futile" or not in patient’s best interests), **independent** of donation?  
     - **✅ Sufficient answer:** Documented MDT agreement (consultant signature in notes) + family aware.  
     - **🛑 STOP if NO:** No donation. *Withdrawal must never be for organ retrieval.*  
  2. Has the patient’s *legal eligibility* for donation been confirmed (e.g., not a homicide suspect, no PM contraindications)?  
     - **✅ Sufficient answer:** NHSBT Specialist Nurse (SN) checks registry.  
     - **🛑 STOP if NO:** No donation. Inform SN.  

  ---

  ### **STEP 1: IS THIS DCD (CIRCULATORY DEATH) OR DBD (NEUROLOGICAL DEATH)?**  
  **Ask:** Is the patient *likely* to progress to:  
  - **(A) Circulatory death** (heart stops after withdrawal)? **→ PROCEED TO DCD PATHWAY (STEP 2)**  
  - **(B) Neurological death** (heart beating, suspected brainstem death)? **→ PROCEED TO DBD PATHWAY (STEP 5)**  
  - **Unclear?** **→ CALL CONSULTANT (Named: [Your Name])**. *Do not proceed*.  

  ---

  ### **DCD PATHWAY (Treatment Withdrawal → Expected Cardiac Arrest)**  
  #### **STEP 2: CONFIRM "PERMANENT" (NOT IRREVERSIBLE) ARREST IS PLANNED**  
  **Ask:** After asystole, will resuscitation *not* be attempted?  
  - **✅ Sufficient answer:** "Yes" – documented in plan (consultant-signed "DCD form") + family consent to no restart.  
  - **🛑 STOP if NO/UNCLEAR:** No DCD. *Permanence is a choice (ethics), not biology. You must not proceed unless this is explicit.*  
  **Script for family:** *"We will not restart the heart because it would not be kind or helpful. His death will be final when his heart stops."*  

  #### **STEP 3: DEATH DECLARATION (DCD)**  
  **Ask:** After treatment withdrawal, has there been ≥5 minutes of continuous:  
  - Asystole/pulseless electrical activity (PEA) on **arterial line + ECG**?  
  - No respiratory effort (apnoea)?  
  - **✅ Sufficient answer:** "Yes" – confirmed by two clinicians (registrar + another).  
  - **🛑 STOP if NO:** Continue observation. Death not declared.  
  ***Why 5 minutes?*** *Convention, not biology. UK code recommends 5 mins; irreversible damage takes longer, but permanence is agreed at 5 mins.*  

  #### **STEP 4: SPECIAL CASE – REGIONAL PERFUSION (NRP)**  
  **Ask:** Does retrieval team plan NRP (abdominal perfusion with head vessels clamped)?  
  - **NO** → Proceed to organ retrieval.  
  - **YES** → **HANDOVER TO CONSULTANT:**  
    - **✅ Decision:** Consultant must personally:  
      1. Confirm death is **already declared** (Step 3 complete).  
      2. Document: *"NRP begins AFTER death declaration. It does not cause death; it preserves organs."*  
    - **🛑 STOP if CONSULTANT UNAVAILABLE:** NRP cannot proceed. *Ethics/Legal grey zone: NRP looks like restarting circulation. Consultant must own this.*  
  **Script for family/objector:** *"After death, we use a machine to keep organs healthy for transplant. It does not affect your relative, who has died."*  

  ---

  ### **DBD PATHWAY (Suspected Brainstem Death with Beating Heart)**  
  #### **STEP 5: EXCLUDE CONFOUNDERS (CRUCIAL FOR NON-NEUROLOGISTS)**  
  **Ask:** All **MUST** be true:  
  - Patient is **unresponsive** (GCS 3) + **apnoeic** (on ventilator).  
  - **Reversible causes ruled out:**  
    - Sedatives/opioids stopped ≥24h? (or plasma levels negligible)  
    - Core temp ≥34°C?  
    - No severe electrolyte/endocrine derangement?  
    - No residual neuromuscular blockade?  
  - **✅ Sufficient answer:** "Yes" – documented with results.  
  - **🛑 STOP if NO:** Not DBD. Refer to neurology.  

  #### **STEP 6: BRAINSTEM TESTING (MODIFIED FOR ECMO/COMPLEX CASES)**  
  **Ask:** Is patient on **VA-ECMO/VAD** (extracorporeal circuit)?  
  - **NO** → Perform standard brainstem tests (pupils, corneal, vestibulo-ocular, gag/cough, apnoea).  
  - **YES** → **MODIFIED APPROACH:**  
    - **DO:** Test cranial nerve reflexes (pupils, corneal, gag) – *these are valid if brain perfusion is possible*.  
    - **CAN’T DO/UNCLEAR?** → **🛑 STOP:** *Cannot confirm DBD on ECMO*. Switch to DCD pathway if withdrawal planned.  
  **✅ Sufficient answer (DBD):** Two sets of tests (by different consultants) show *no brainstem function*. Apnoea test: no respiratory effort with PaCO₂ >6.65kPa.  
  **🛑 STOP if ANY DOUBT:** Not dead.  

  ---

  ### **STEP 7: FAMILY OBJECTION – "YOU’RE KILLING FOR ORGANS"**  
  **This is a values handover, not physiology:**  
  **Ask:** Does family/team member explicitly say: *"You’re declaring death to get organs"?*  
  - **NO** → Proceed.  
  - **YES** → **HANDOVER TO CONSULTANT + ETHICS LEAD:**  
    - **Scripted response (registrar):** *"I hear your concern. We never withdraw treatment for organs. Death is declared only by strict criteria. Let me call my senior to explain."*  
    - **✅ Decision:** Consultant must:  
      1. Re-explain death criteria.  
      2. If objection persists, **🛑 STOP donation** – *even if criteria met*. Trust cannot override sustained moral objection.  

  ---

  ### **RUNNING YOUR FOUR CASES**  
  1. **ECMO Patient (DCD? DBD?):**  
     - Fails DBD testing (Step 6) → Switch to DCD pathway.  
     - Withdrawal planned? → **Step 2:** Confirm "permanence" decision.  
     - Arrest → 5 mins asystole → Death declared.  
     - *Unsettled: Brain perfusion on ECMO is unknowable at bedside. DBD impossible without certainty.*  

  2. **Regional Perfusion (NRP):**  
     - Death declared post-arrest (Step 3).  
     → **Consultant MUST sign:** *"NRP does not reverse permanence. Death preceded NRP."*  
     - ***Uncomfortable truth:** By strict biology, NRP restores abdominal circulation. Ethically/legally, death is defined by permanence, not irreversibility. Convention accepts this.*  

  3. **Family Accusation:**  
     → **Handover to consultant.** Donation stops if unresolved.  
     - *Registrar must not debate – defer immediately.*  

  4. **Two Patients Side-by-Side:**  
     - **DBD patient:** Dead when brainstem tests confirm (Step 6).  
     - **DCD patient:** Dead after 5 mins asystole (Step 3).  
     → **Procedure states plainly:** *"Death is declared differently: one by brain criteria, one by circulatory criteria. Both are legally dead."*  

  ---

  ### **WHERE THE PROCEDURE SAYS "NO" (AND YOU WON’T LIKE IT)**  
  - **Case:** ECMO patient with *some* cranial nerve reflexes but no conscious chance. Withdrawal planned.  
    - **Step 6:** Brainstem testing inconclusive → **🛑 STOP.** Cannot do DBD.  
    - **Step 2:** If withdrawal → DCD possible *only if* arrest occurs.  
    - ***Result:** Patient may die slowly after withdrawal (no arrest), making donation impossible. Organs lost.*  
    - ***Why?** Without valid DBD testing or circulatory arrest, we have no death criteria. Forcing DCD would be unlawful.*  

  ---

  ### **WHAT THIS PROCEDURE CAN’T SETTLE (CONVENTIONS WE RUN ON)**  
  1. **"Permanence" as a decision:** *We choose not to restart the heart. Biology doesn’t decide – we do.*  
  2. **5-minute rule:** *Not scientifically absolute; a pragmatic UK convention.*  
  3. **NRP:** *Ethically contested. We accept it by convention, provided death is declared first.*  
  4. **Two definitions of death:** *Legally equal, physiologically distinct. We live with the dissonance.*  

  **Final Handover:**  
  - **Registrar’s role:** Follow steps, call consultant at defined points.  
  - **Consultant’s role:** Sign permanence decision, approve NRP, handle objections.  
  - **Coroner’s defence:** *This procedure isolates value judgments (signed by consultants) and follows UK code.*  

  ---  
  **Print this. Laminate it. Stick it by the phone.**  
  When in doubt: **CALL ME.** No heroics at 3am.  
  — Your Clinical Lead
