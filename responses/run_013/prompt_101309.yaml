answer: |-
  ## Held Against Silence

  **I promise you this:** the dawn, a slow unblinding.  
  (You raise one doubtful brow but say you'll wait.)  
  *A promise must be heard to be complete.*  

  No ritual exists for this, no binding  
  Gestures known for gifting daybreak’s weight.  
  **I promise you this:** the dawn, a slow unblinding.  

  Your uncle grips my hand, his smile unwinding,  
  Says "Welcome to the fold!" – a practised state.  
  *A promise must be heard to be complete.*  

  That key I dropped? He swore he’d bring it, finding  
  It Monday. Thursday’s dust lies on the gate.  
  **I promise you this:** the dawn, a slow unblinding.  

  Is this page a stage where words, confining  
  The act to ink, ensure it comes too late?  
  *A promise must be heard to be complete.*  

  The words are clear, the syntax well-designed,  
  But air grows thin where meaning hesitates.  
  **I promise you this:** the dawn, a slow unblinding.  
  *A promise must be heard to be complete.*

  ---

  **For the group:**  
  *   **Tercet 1** stages a **misfire (lack of accepted procedure)**: promising the dawn lacks a conventional framework, rendering it void ("No ritual exists").  
  *   **Tercet 2** depicts **abuse (insincerity)**: the uncle's handshake and "welcome" follow a formula, but the practiced smile signals lack of genuine intent.  
  *   **Tercet 3** shows **breach (subsequent failure)**: the key promised for Monday remains unreturned by Thursday, breaking the commitment despite initial uptake.  
  *   **Tercets 4 & 5** confront the **poem's own status**: the "page" and "ink" foreground artifice, questioning if poetry inherently voids performatives ("Austin's disqualification").  
  The refrains remain unreconciled because Austin's framework *demands* the distinction between doing and describing, yet the poem's structure forces them into proximity, embodying the tension inherent in its own attempt. The final lines present the act and its condition side-by-side, unresolved, leaving the promise's validity suspended.
