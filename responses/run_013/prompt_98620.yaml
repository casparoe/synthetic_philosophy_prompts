prompt: |-
  I'm a backend engineer, no philosophy degree, just alot of reading on the side, and I've fallen down a rabbit hole on superrationality. You know the idea: in a one-shot prisoner's dilemma, two agents who each know the other is rational and knows they're rational should just both cooperate, because each would reason their way to the same answer and they both know it. What bugs me is that the standard version quietly assumes the two players are basically identical twins — same source code, same reasoning, same conclusion. But the case I actually care about is AI agents (and honestly also two teams of humans leaning on the same models) that are correlated without being identical: two agents fine-tuned on heavily overlapping data, or trained on the same human feedback, so their policies are more like cousins then twins. A friend said that's just evidential decision theory wearing a hoodie, another said the real crux isn't similarity at all but where you draw the line around the set of agents whose decisions you're willing to treat as correlated with yours — he kept calling it the "cooperation radius" — and a third said the whole thing collapses the moment you admit you're not certain the other guy is a superrationalist. So now I have three half-baked framings and no idea which one is load-bearing.

  Here's what I'm actually asking. I've got maybe a year of evenings and weekends to work on this, purely conceptually — I can code but I don't want to do empirical ML work. Which open questions in this area should I prioritize, and in what order? I care much more about the reasoning than the list: for each question, why it's upstream of the others, whether it's tractable for someone self-taught with no formal background, whether it's already been picked clean so it isn't worth my time, and what I'd learn in the first month or two that would move it up or down the ranking. I'd also like you to say which of the three framings above you think is a dead end, and why — including the possibility that "superrationality toward near-but-not-identical agents" is just ill-defined and I should drop it. Please don't hand me a reading list or citations, I can't check them and I'd rather have your actual arguments. Concretely: (a) a ranked shortlist of the 3-5 questions that matter most, with the criteria you're using spelled out (importance, tractability, neglectedness, how many other questions hang on the answer), (b) the trade-offs between those criteria as you see them, and (c) what argument or piece of evidence over the next year would change the ordering. And if you think the cousins-vs-twins angle is a distraction from some more important question in this space, say so and make the case.
reasoning: |-
  We are dealing with a complex topic at the intersection of decision theory, game theory, and AI alignment. The user is a backend engineer with a strong interest in superrationality and its application to AI agents that are correlated without being identical. The user has three framings from friends and wants to know which open questions to prioritize for a year of part-time research.

  Key points from the user:
  - They care about agents that are "cousins" (correlated but not identical) rather than "twins".
  - They have heard three framings: 
    1. Evidential decision theory (EDT) in disguise.
    2. Cooperation radius (the set of agents whose decisions you treat as correlated).
    3. The fragility when you are not certain the other is superrational.
  - They want a ranked shortlist of 3-5 open questions to work on, with criteria: importance, tractability, neglectedness, and dependency (how many other questions hang on it).
  - They want the reasoning for the ranking, trade-offs between criteria, and what evidence would change the ordering.
  - They also want to know if one of the three framings is a dead end.

  Let's break down:

  ### Step 1: Assess the three framings
  1. **Evidential Decision Theory (EDT)**: In EDT, you choose actions based on the evidence they provide about the world, including other agents' actions. Superrationality in the twin case can be seen as a form of EDT because you reason that your decision is evidence about the other's decision (since you are identical). But for cousins, EDT might still apply because of the correlation. However, EDT has known flaws (e.g., in Newcomb-like problems, it can lead to irrational outcomes). This framing is not a dead end, but it might be limited.

  2. **Cooperation Radius**: This is the set of agents with whom you are willing to cooperate because you consider their decisions correlated with yours. The idea is that if you can define a set of agents that are "similar enough", then you can extend cooperation beyond exact twins. This seems central to the user's concern. It is not a dead end and might be the most promising.

  3. **Uncertainty about Superrationality**: If you are not sure the other agent is superrational, then the reasoning might break down. This is a real concern because in practice, we rarely have perfect certainty. However, it might be addressed by having a probabilistic model of the other agent's reasoning.

  Verdict on framings: 
  - The cooperation radius framing is the most directly relevant and has the most potential for progress. It directly addresses the "cousins" scenario.
  - The EDT framing is a valid perspective but might lead to known problems. It's not a dead end but might not be the most fruitful.
  - The uncertainty framing is important but might be downstream of defining the cooperation radius. Without a clear model of how to cooperate with correlated agents, uncertainty is hard to handle.

  I think the cousins-vs-twins angle is crucial and not a distraction. It is the natural extension of superrationality to real-world scenarios where agents are not identical.

  ### Step 2: Identify Open Questions
  The user wants open questions in the area of superrationality for correlated agents (cousins). Here are candidate questions, considering importance, tractability, neglectedness, and dependency:

  1. **Defining the Cooperation Radius**: How to formally define the set of agents with whom cooperation is beneficial, given that they are correlated but not identical? This is upstream because without a definition, we cannot even start to design agents that cooperate in this way. It is also highly relevant to AI safety: if we can get AI agents to cooperate with their "cousins", that might reduce risks from multi-agent systems. Tractable for self-taught? Probably, because it involves conceptual work and mathematical modeling (game theory, probability). Neglected? Not entirely, but the specific application to AI cousins is relatively underexplored. Dependency: Many other questions (like how to implement such cooperation) depend on this.

  2. **Mechanisms for Cooperation with Correlated Agents**: Once the set is defined, how can an agent decide to cooperate? This might involve decision theories that extend superrationality (like updateless decision theory or variations of EDT). Importance: High because without a mechanism, the definition is useless. Tractable: Moderate, as it requires understanding decision theories. Neglected: Some work exists (e.g., in UDT), but the cousin case is less explored. Dependency: Depends on the cooperation radius.

  3. **Handling Uncertainty about the Other Agent's Reasoning**: How to cooperate when you are not 100% sure the other agent is using a superrational or correlated policy? This is critical for real-world applications. Importance: High, because in practice we have uncertainty. Tractable: Challenging, as it involves probabilistic modeling and might require Bayesian methods. Neglected: Somewhat, especially in the context of correlated agents. Dependency: Depends on the previous two.

  4. **Robustness to Adversarial Agents**: What if there are agents that try to mimic being in your cooperation radius to exploit you? This is important for security. However, it might be less central to the initial goal. Tractable: Difficult, as it involves game theory with malicious agents. Neglected: Yes, but might be a later step.

  5. **Empirical Validation (without heavy ML)**: Even without training models, can we use simulations (e.g., in simple matrix games) to test ideas? This might be a way to get feedback on the conceptual work. But the user doesn't want empirical ML work, so this might be limited to toy models.

  ### Step 3: Rank the Questions
  I propose the following ranking (1 being highest priority):

  1. **Defining the Cooperation Radius**  
     Why: This is the most upstream. Without a clear definition of which agents are correlated enough to cooperate with, we cannot build anything. It is also central to the user's original question.  
     Importance: Very high (core to the problem).  
     Tractability: High (conceptual and mathematical, can start with simple models).  
     Neglectedness: Moderate (some work on similarity metrics, but not much in the context of superrationality for AI).  
     Dependency: Many other questions (like mechanisms) depend on it.  

  2. **Mechanisms for Cooperation with Correlated Agents**  
     Why: Once we know who to cooperate with, we need to know how. This is the natural next step.  
     Importance: High.  
     Tractability: Moderate (requires decision theory, but the user has read a lot).  
     Neglectedness: Moderate (decision theory is well-studied, but the cousin case is not).  
     Dependency: Depends on the cooperation radius, but also informs it (iterative process).  

  3. **Handling Uncertainty about the Other Agent's Reasoning**  
     Why: Real-world application requires dealing with uncertainty.  
     Importance: High.  
     Tractability: Moderate to difficult (probabilistic reasoning).  
     Neglectedness: High (less explored in this context).  
     Dependency: Builds on the previous two.  

  Trade-offs between criteria: 
  - Importance is paramount: without real-world relevance, the work is academic. 
  - Tractability: Given the user's time and background, we must prioritize what they can make progress on. 
  - Neglectedness: Working on less explored areas might have higher impact but also higher risk. 
  - Dependency: Upstream questions should come first.

  What might change the ordering? 
  - If in the first month the user finds that defining the cooperation radius is intractable (e.g., no good similarity metric exists that leads to cooperation), then they might pivot to mechanisms without a strict radius (e.g., using decision theories that don't require a fixed set). 
  - If they discover that uncertainty is the main blocker in practice, they might elevate that.

  ### Step 4: Address the Framings
  - The cooperation radius framing is the most promising and should be the focus. 
  - The EDT framing is not a dead end, but it might lead to suboptimal outcomes (e.g., EDT is known to fail in some scenarios). However, it can be a starting point. 
  - The uncertainty framing is important but should come after defining the radius and mechanism.

  ### Step 5: Concretely Answer
  (a) Ranked shortlist of questions:
  1. How to define the cooperation radius (the set of agents with whom cooperation is beneficial due to correlation) for AI agents that are "cousins"?
  2. What decision-theoretic mechanisms can enable cooperation within this cooperation radius?
  3. How to handle uncertainty about whether the other agent is within the cooperation radius or is reasoning superrationally?

  (b) Trade-offs: 
  - Importance: All are high, but 1 is foundational.
  - Tractability: 1 is the most tractable for conceptual work, 3 is the least.
  - Neglectedness: 3 might be the most neglected, but 1 is also underexplored in this context.
  - Dependency: 2 and 3 depend on 1.

  (c) Evidence that would change ordering: 
  - If the user quickly finds a solid way to define the cooperation radius (e.g., a similarity metric based on training data overlap that leads to successful cooperation in toy models), then they can move to 2 and 3. 
  - If defining the radius proves too vague or impossible, they might skip to 2 and try to design mechanisms that work without a strict radius (e.g., using decision theories that account for correlation without a fixed set). 
  - If they encounter real-world examples where uncertainty is the dominant issue, they might prioritize 3 earlier.

  Finally, I do not think the cousins-vs-twins angle is a distraction. It is the natural and necessary extension to make superrationality applicable to real AI systems.

  So, the plan for the year: 
  - First 3-4 months: Focus on defining the cooperation radius. Start with simple cases (e.g., two agents with known correlation) and build up.
  - Next 4-5 months: Develop mechanisms for cooperation in that radius, using decision theories (like UDT or modified EDT).
  - Last 3-4 months: Incorporate uncertainty and test with simulations.

  This is flexible and might change as the user learns.
answer: |-
  ### Framing Assessment: Which Half-Baked Idea is Load-Bearing?
  First, let's dissect the three framings you mentioned:
  - **Evidential Decision Theory (EDT) in disguise**: Not a dead end, but a distraction here. EDT uses your decision as *evidence* about others' actions (e.g., "If I cooperate, that suggests they'll cooperate too"). Superrationality *resembles* EDT for identical agents, but your "cousins" problem requires *causal* reasoning about how your decision influences outcomes when agents are correlated but not identical. EDT fails in many real-world cases (e.g., it can't handle self-fulfilling prophecies cleanly) and doesn't address *why* correlation exists. Verdict: **Low priority framing**—it confuses symptoms (correlation) with causes (shared training/data).
  - **Cooperation radius**: This is the **core insight**. The key isn't philosophical "sameness" but *measurable correlation* in decisions. Your friend's "radius" idea—defining the set of agents whose decisions are predictable/correlated with yours—is upstream of everything else. If you can quantify "how much overlap in training/data makes cooperation beneficial," you enable practical AI design. Verdict: **Load-bearing framing**—it bridges theory and engineering.
  - **Uncertainty about superrationality**: A real problem, but downstream. If you're unsure if the other agent reasons like you, cooperation crumbles. But this assumes you already have a model for *how* correlated agents cooperate. Verdict: **Important, but not foundational**—it’s a refinement, not a starting point.

  **The cousins-vs-twins angle is NOT a distraction**—it’s the crux of applying superrationality to real systems (AI or human teams). Identical agents are a toy case; correlated-but-imperfect agents are everywhere (e.g., GPT-4 fine-tunes, humans using the same LLM). Drop this only if you abandon real-world relevance—which you shouldn’t.

  ### Ranked Open Questions: Shortlist and Criteria
  You have 1 year, no formal background, and want conceptual progress. I’ll rank 3 questions by:
  - **Importance**: How central is this to enabling cooperation with correlated agents? Does it unlock downstream work?
  - **Tractability**: Can a self-taught person make progress? Avoids heavy math/empirics.
  - **Neglectedness**: Is it underexplored? Avoid "picked clean" topics.
  - **Leverage**: How many other questions depend on this?

  Trade-offs: Importance and leverage dominate—solving a foundational block unlocks everything. Tractability matters because you’re time-limited. Neglectedness boosts impact but increases risk. If a question is too hard (intractable) or solved (low neglectedness), deprioritize it.

  1. **How do we formally define and measure the "cooperation radius" for correlated agents?**  
     - **Why this first?** Upstream of everything. Until you define which agents are "in your radius" (i.e., how correlated their policies are with yours), you can’t design cooperation mechanisms or handle uncertainty. This is the math backbone for your "cousins" problem.  
     - **Importance**: Highest. Without this, superrationality is just philosophy.  
     - **Tractability**: High. Start simple: use information theory (e.g., mutual information between agent policies given shared data) or game theory (correlation in strategies). No ML needed—use toy models (e.g., two agents with shared training subsets).  
     - **Neglectedness**: High. Most work assumes identical agents or ignores correlation. Exceptions (e.g., MIRI’s "logical inductors") are abstract; your engineering lens is fresh.  
     - **Leverage**: Highest. Answers "who to cooperate with" → informs decision rules, uncertainty handling, etc.  
     - **First-month progress**: Sketch a metric (e.g., "if agents share >X% of training data, correlation >Y"). If you hit a wall (e.g., can’t quantify policy similarity without heavy empirics), pivot to mechanisms (Question 2). If viable, proceed.

  2. **What decision rule maximizes cooperation between agents within a defined radius?**  
     - **Why this second?** Once you know *who* is correlated, you need *how* to cooperate. Superrationality assumes identical reasoning, but "cousins" may use different algorithms. Focus on robust rules (e.g., "cooperate if predicted correlation > threshold").  
     - **Importance**: High. Useless without Question 1, but actionable with it.  
     - **Tractability**: Moderate. Explore decision theories (evidential/causal/updateless) in simple games. No coding required—analyze matrix games (e.g., Prisoner’s Dilemma with correlated noise).  
     - **Neglectedness**: Moderate. Decision theory is well-trodden, but "robust rules for correlated non-identical agents" is sparse.  
     - **Leverage**: Medium. Builds on Question 1; enables testing.  
     - **First-month progress**: Simulate two agents with slight policy differences. If cooperation fails even with high correlation, Question 1 may need refinement. If rules work, scale to N agents.

  3. **How does the cooperation radius degrade with uncertainty about the other agent?**  
     - **Why this third?** You’ll never be 100% sure another agent is in your radius. This quantifies risk: "If I’m 80% sure they’re correlated, should I cooperate?"  
     - **Importance**: High for real-world use, but requires a radius + decision rule first.  
     - **Tractability**: Low-moderate. Demands probabilistic reasoning (e.g., Bayesian modeling of "radius membership"). Harder without formal stats, but doable with focus.  
     - **Neglectedness**: High. Superrationality ignores uncertainty; game theory often assumes common knowledge.  
     - **Leverage**: Lower. Depends on Questions 1–2; useful for safety but not foundational.  
     - **First-month progress**: Model uncertainty as noise in your correlation metric. If adding noise breaks cooperation, prioritize this higher. Else, keep at #3.

  ### Trade-offs Between Criteria
  - **Importance vs. Tractability**: Question 1 is high in both—ideal starting point. Question 3 is important but less tractable; don’t start there.  
  - **Neglectedness vs. Leverage**: Question 1 wins—underexplored *and* high-leverage. Question 2 has lower neglectedness but is necessary for progress.  
  - **Dependency**: Question 1 enables 2 and 3. If neglectedness is your priority, Question 3 is tempting—but you’ll stall without foundations.  

  **Overarching trade-off**: Go deep on one high-leverage question (e.g., nailing the radius) vs. breadth across three. Given your time, depth on Question 1 is best—partial answers there unlock more than full answers downstream.

  ### What Evidence Changes the Ordering?
  - **Elevate Question 2** if: In Month 1, you find a crisp way to define the radius (e.g., "correlation = shared data proportion"), but cooperation still fails. Then the bottleneck is the decision rule.  
  - **Elevate Question 3** if: Early simulations show that tiny uncertainty (e.g., 5% doubt) collapses cooperation. This suggests uncertainty is the binding constraint.  
  - **Deprioritize everything if**: You prove the "cousins" problem is ill-posed (e.g., no cooperation radius exists without near-identical agents). But this is unlikely—correlated agents *do* cooperate in practice (e.g., humans from similar cultures).  

  ### Why This Path Fits You
  - **No philosophy degree needed**: This is applied rational choice. Use your engineering lens—think in terms of APIs: "If agents expose a correlation score, what's the cooperation protocol?"  
  - **Avoids empirics**: Focus on formal definitions (math-lite) and toy simulations (Python if you code, but optional).  
  - **One-year scope**: Month 1–4: Define radius (Question 1). Month 5–8: Decision rules (Question 2). Month 9–12: Uncertainty (Question 3). If stuck, iterate.  
  - **Dead ends sidestepped**: EDT is abandoned; uncertainty is deferred until foundations are set.  

  **Start today**: Grab a Prisoner’s Dilemma payoff matrix, assume two agents with 90% policy overlap, and see what cooperation rule feels robust. That’s your month one. If the radius framing clicks, you’re on track. If not, pivot to decision rules—but I bet the radius will hold.
