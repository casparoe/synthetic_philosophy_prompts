prompt: |-
  I'm in a decision-science reading group and we keep going in circles on the inside-view / outside-view thing — you know, when you should trust your particular read of a situation and when you should shut up and defer to what usually happens to people in your position. Last week someone said the outside view is just "the inside views of the past, pre-averaged," which I thought was either very deep or just a pun, and we couldn't settle it. What I actually want from you is the spec: before we argue about which camp is right, what would an adequate theory of this have to get right?

  So give me the desiderata list. I mean the concrete things any decent account of "when to go inside vs outside" has to deliver — the cases it has to get right (the project that runs over because everyone plans from the inside, but also the one where the inside reader really does know better and the reference class is just a bad fit), the distinctions it absolutely cannot collapse (like between the outside view being accurate on average and it being the thing you should actually defer to *here*; or between modesty as a way of being well-calibrated and modesty as a rule that says "defer"; or between picking a reference class and then using one), and the results it has to stay consistent with (the stats, whatever they turn out to be). Put the case or the consideration next to each requirement so I can see why it's a requirement and not just a taste. Then tell me which of them you think are genuine and which are just a prejudice of one camp, and whether any subset can't be satisfied at once — if some of them pull against each other, thats the part I care most about. Finally, if it's not too much, say which single requirement does the most work in ruling theories out, and why. Don't bother with a full scorecard of every view, I can do that part myself; the list is the deliverable.

  One more thing, since it'll come up: I'm not asking you to tell me the outside view always wins, or that you should always trust your gut either. I want the criteria that would let me tell, in a particular case, which one is being misused — because right now every arguement we have just ends with one person saying "that's base-rate neglect" and the other saying "that's just cowardice dressed up as statistics," and neither of us can say what would have to be true for the other to be right.
reasoning: |-
  Okay, let me tackle this user's query. They're in a decision-science reading group struggling with the inside-view vs outside-view debate. The user mentioned a statement that the outside view is "the inside views of the past, pre-averaged," which caused confusion. Their main request is for desiderata—specific criteria any theory must satisfy to resolve when to use each view. 

  First, I need to unpack what they're really asking. They want a concrete list of requirements that a good theory should meet, including cases it must handle, distinctions it must maintain, and consistency with statistical principles. They also want to know which requirements might conflict and which one is most critical for ruling out inadequate theories.

  I recall key concepts: the inside-view relies on unique details of a situation, while the outside-view uses historical data from similar cases. The user highlighted common pitfalls in their group discussions—accusations of base-rate neglect versus dismissing statistics as cowardice. So the core need is a framework to evaluate specific situations objectively.

  Now, identifying desiderata. The user mentioned several must-haves: handling classic failure cases like planning fallacy, allowing for expert exceptions, differentiating between average accuracy and applicability, and avoiding conflated concepts. I should also consider underlying principles from decision theory, like calibration and reference class selection.

  I start listing requirements. The first one is handling the Planning Fallacy—where inside-view optimism leads to underestimating timelines. Any theory must explain why outside-view is superior here. Conversely, the Einstein case shows when inside-view knowledge justifies ignoring outside-view averages. 

  Next, distinctions like Reference Class Elasticity—how choosing different classes affects outcomes—and the difference between average accuracy and decision relevance. Also crucial is separating epistemic modesty from procedural deference, as they address different aspects of decision-making.

  Consistency with statistical principles is non-negotiable. A theory can't violate Bayes' theorem or the importance of empirical evidence. Additionally, it must account for when inside-view is a valid prior update rather than mere opinion.

  Considering conflicts, the Einstein Requirement clashes with the Planning Fallacy Requirement. One demands deference to outside-view, the other to inside-view under specific conditions. The theory needs a mechanism to determine when unique evidence is sufficient to override base rates.

  The most critical requirement? Probably the Reference Class Elasticity, as it exposes subjectivity in applying the outside-view. If a theory can't handle how reference classes are chosen, it fails immediately.

  I also think about biases. The user's group might be influenced by confirmation bias or overconfidence. Highlighting the need for calibration over blind deference addresses this. The desiderata should prevent both mechanical application of statistics and dismissal of data as cowardice.

  Finally, summarizing which requirements are genuine versus potential prejudices. For instance, insisting outside-view always wins ignores valid insider knowledge, while dismissing base rates entirely is negligence. The key is a balanced approach based on evidence quality.
answer: |-
  Here’s a rigorous desiderata list for any theory of inside-view/outside-view tradeoffs, grounded in concrete cases, necessary distinctions, and fundamental constraints. Each requirement includes the case or principle motivating it, conflicts are flagged, and the most decisive requirement is identified.

  ### **Core Desiderata: What a Theory Must Get Right**
  1. **The Planning Fallacy Requirement**  
     *Case:* A team estimates their project will take 6 months based on task breakdowns (inside-view), ignoring that similar projects *always* take 18+ months (outside-view). The project overruns.  
     *Requirement:* The theory **must prescribe deference to the outside-view when unique factors are illusory or overstated**. It must explain why inside-view planning often underestimates risks/overestimates capabilities.

  2. **The Einstein Requirement**  
     *Case:* A physicist ignores the "average success rate of patent applications" (outside-view) because she knows her device violates a previously unquestioned assumption. Her patent revolutionizes the field.  
     *Requirement:* The theory **must allow overriding the outside-view when valid, uniquely differentiating evidence exists**. It cannot force deference to base rates when the reference class is irrelevant.

  3. **Reference Class Elasticity Distinction**  
     *Case:* Is "building a skyscraper" the right reference class for your project, or "building a skyscraper in an earthquake zone during a supply-chain crisis"?  
     *Requirement:* The theory **must distinguish between *selecting* a reference class (subjective) and *applying* it (objective)**. It cannot treat reference classes as given; it must guide how to test their fit.

  4. **Calibration vs. Deference Distinction**  
     *Case:* A cautious manager always defers to industry failure rates (outside-view), missing a genuine opportunity. An overconfident founder ignores base rates and fails.  
     *Requirement:* The theory **must separate *epistemic modesty* (acknowledging uncertainty) from *procedural deference* (blindly following statistics)**. It should reward calibration, not ritualistic outside-view use.

  5. **Outside-View as Anchor, Not Answer**  
     *Case:* Base rates show 90% of startups fail (outside-view). Yours targets an underserved market with proven tech (inside-view).  
     *Requirement:* The theory **must treat the outside-view as a prior to update, not a verdict**. It must integrate inside-view evidence via Bayesian reasoning, not choose between "all inside" or "all outside."

  6. **Handling Unprecedented Situations**  
     *Case:* Predicting outcomes of a novel technology (e.g., first AI regulation). No historical reference class exists.  
     *Requirement:* The theory **must function when the outside-view is absent or weak**, without defaulting to unconstrained inside-view speculation. Should guide structured analogies or scenario planning.

  7. **Consistency with Statistical Principles**  
     *Principle:* Base rates dominate when evidence is weak; unique evidence dominates when strong (per Bayes).  
     *Requirement:* The theory **cannot violate coherence axioms** (e.g., Dutch book arguments) or ignore the quality/quantity of evidence.

  ---

  ### **Tensions & Conflicts**
  - **Planning Fallacy vs. Einstein Requirement:** These pull in opposite directions. A theory that always favors outside-view fails Einstein; one that overvalues inside-view enables planning fallacies. **Resolution hinges on evidence quality assessment** (Requirement 5).  
  - **Reference Class Elasticity vs. Outside-View Objectivity:** If reference class selection is too flexible, the outside-view becomes subjective. If too rigid, it misapplies data. **Requires explicit criteria for class validity** (e.g., causal homogeneity, predictive accuracy).  
  - **Calibration vs. Deference:** Cultures of "modesty" often conflate them. A good theory forces clarity: *Are you deferring because you’re uncalibrated, or because the evidence merits it?*

  ---

  ### **Genuine Requirements vs. Camp Prejudices**
  | **Desideratum**           | Genuine? | Prejudice? | Notes |
  |---------------------------|----------|------------|-------|
  | Planning Fallacy          | ✓        |            | Robust empirical support (Kahneman, Flyvbjerg). |
  | Einstein Requirement      | ✓        |            | Bayesianism demands evidence updates. |
  | Reference Class Elasticity| ✓        |            | Proven vulnerability (e.g., "reference class tennis" in forecasting). |
  | Calibration ≠ Deference   | ✓        |            | Confusion here enables false "modesty" or reckless "expertise." |
  | Outside-View as Prior     | ✓        |            | Necessary for coherence; outside-view absolutism is a common flaw. |
  | Unprecedented Cases       | ✓        |            | Real-world constraint; outside-view purists often ignore this. |
  | **"Outside-view = Cowardice"** |          | ✓ (Inside-view camp) | Rejecting stats isn’t brave; it’s often hubris. |
  | **"Inside-view = Bias"**  |          | ✓ (Outside-view camp) | Dismissing unique evidence is *itself* a bias (base-rate idolatry). |

  ---

  ### **The Most Decisive Requirement**  
  **Requirement #5: Outside-view as Anchor, Not Answer**  
  **Why it rules theories out:**  
  - It forces the theory to handle *evidence integration*, not just view selection. Any approach that treats inside/outside as binary choices (e.g., "always defer to base rates") fails immediately.  
  - It exposes lazy outside-view use (e.g., citing aggregate stats without assessing relevance) and unanchored inside-view (e.g., gut feelings without Bayesian updating).  
  - It’s falsifiable: Does the theory provide a mechanism to weight inside-view evidence *against* the outside-view prior? If not, it fails Einstein or Planning Fallacy cases.

  ---

  ### **Summary for Your Group**  
  A viable theory must:  
  1. **Explain classic failures** (Planning Fallacy) **and exceptions** (Einstein),  
  2. **Enforce key distinctions** (reference class selection vs. application, calibration vs. deference),  
  3. **Use the outside-view as a Bayesian prior**,  
  4. **Require evidence-quality assessments** to resolve tensions.  

  **Test any proposal against this:** If it can’t tell you *when and why* the Einstein case succeeds or the Planning Fallacy fails, it’s inadequate. The core isn’t choosing a camp—it’s building a scaffold to weigh evidence quality. Your "pre-averaged inside views" quip is insightful: it reveals that the outside-view’s power depends entirely on the *representativeness* of those past views to your current problem.
