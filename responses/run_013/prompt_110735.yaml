prompt: |-
  I've been going back and fourth on the procreation asymmetry for years, and the thing that bugs me is that everyone argues it case by case without ever saying what a theory of it would have to do to be any good. So before I read another EA forum take: give me the desiderata. Not a survey of who's said what, just the spec.

  What does any theory that wants to underwrite the asymmetry have to deliver? I want the list, with the case or consideration behind each item: the cases it has to get right (the miserable life it's wrong to start, the happy life nobody has to start, the existing person whose welfare we obviously do have to care about), the distinctions it can't collapse (creating vs. continuing, what's good for a person vs. what makes the world better, an asymmetry in reasons vs. an asymmetry in values), and the results it can't contradict (no repugnant conclusion, no story on which the never-conceived are deprived, no duty to breed, and once someone is here their welfare counts the same as anyone else's).

  Two things I especially want pinned down, since I suspect they're where it falls apart:

  1. Uncertainty. Imagine a coin: heads, the kid gets a wonderful life, tails, a life of unrelenting pain. The asymmetry seems to say the tails branch counts against and the heads branch doesn't count for, which makes the gamble look bad -- but every act of procreation is a gamble with some tail risk, so now I need a story for why having kids is OK at all. Is there a version of the asymmetry that survives this, or is asymmetry + risk + ordinary permissibility just an inconsistent set?

  2. Where the asymmetry stops. It's supposed to be about bringing someone into existence, not about making an existing person worse off, so at what point does the maybe-person become someone who can be made worse off -- conception, viability, birth, first preference? And does that answer also decide whether the asymmetry applies to minds we make instead of birth, like an AI we might train that might suffer?

  Flag any pair of desiderata you think can't be jointly satisfied -- that's the part I actually want. A table is fine.
reasoning: |-
  Okay, let me start by understanding what the user is asking for. They've been struggling with the procreation asymmetry for years and are frustrated with the piecemeal approaches they've encountered. They want a clear list of desiderata that any theory addressing this asymmetry must satisfy, without getting into existing arguments or surveys. The user specifically mentions cases like creating miserable lives versus happy ones, distinctions between creating and continuing existence, and avoiding conclusions like the repugnant one.

  First, I need to outline the core elements the theory must cover. The user mentioned several key points: the wrongness of creating a miserable life, the non-obligation to create a happy life, and equal consideration for existing people. They also want to ensure that distinctions like creating vs. continuing aren't collapsed, and that values versus reasons are kept separate. Plus, avoiding problematic conclusions such as a duty to breed or the idea that the never-conceived are deprived.

  The user has two main concerns: uncertainty and where the asymmetry stops. For uncertainty, they use a coin flip example where tails leads to suffering. If the asymmetry only counts suffering against creation but not happiness for it, any risk makes procreation impermissible. How can a theory handle this without making all procreation wrong? The second issue is about when a potential being becomes someone who can be harmed. Is it at conception, birth, or some other stage? And does this apply to non-biological entities like AI?

  I should list all desiderata clearly, each with the underlying case or reason. Then, highlight where conflicts might arise, especially between uncertainty and permissibility. The user wants to know if any desiderata are incompatible. For example, desideratum 3 (no duty to create happy lives) and desideratum 6 (equal consideration for existing persons) might conflict with handling uncertainty. If avoiding suffering is a strong reason against creating but happiness isn't a reason for, then even small risks of suffering could outweigh any benefits, making procreation impermissible. Yet, common sense says it's often permissible. That's a tension.

  Regarding the asymmetry's scope, defining the threshold when a potential person becomes an entity that can be harmed is tricky. If it's at conception, then contraception might be problematic, but if it's later, like at birth, then issues like abortion or embryo destruction arise. Also, applying this to AI complicates things further. Desideratum 11 (non-arbitrary threshold) and desideratum 12 (scope for non-biological minds) need to align without contradiction.

  I need to ensure each desideratum is backed by a specific case. For instance, the miserable child case supports desideratum 1, while the happy child case supports desideratum 3. Existing person welfare ties to desideratum 6. The distinctions like creating vs. continuing (desideratum 4) and avoiding conflation of values/reasons (desideratum 5) are crucial to prevent theoretical confusion. Avoiding the repugnant conclusion (desideratum 7) and deprivationism (desideratum 8) are standard in population ethics.

  Now, identifying conflicts: Uncertainty (desideratum 9) seems incompatible with desiderata 1, 3, and 10 (ordinary permissibility). If the theory says any risk of suffering makes creation wrong because suffering counts against but happiness doesn't count for, then even minimal risk should prohibit procreation. But that contradicts the intuition that procreation is often permissible. Theories might try to mitigate this by differentiating risks or appealing to expected value, but if happiness doesn't provide positive reason, expected value might still be negative. This is a major hurdle.

  The threshold problem (desideratum 11) and scope for non-biological minds (desideratum 12) might conflict with other desiderata if the threshold isn't clear. For example, if viability is the threshold, then before that point, creating suffering isn't harming anyone, but after, it is. But viability varies, making it arbitrary. If sentience is the threshold, then for AI, if it's sentient, the asymmetry applies, but determining sentience in AI is complex. Any threshold might lead to counterintuitive results in edge cases.

  The user's deeper need is to find a coherent framework that resolves these tensions or to understand why they might be irreconcilable. They might be looking for whether a consistent theory is possible or if they need to compromise on some intuitions. Highlighting the conflicts, especially the uncertainty vs. permissibility, shows where current theories fail. This addresses their frustration with existing discussions and provides clarity on the core challenges.
answer: |-
  Here’s a distilled list of **desiderata for a theory of procreation asymmetry**, grounded in the cases, distinctions, and constraints you specified. Each item includes the core intuition or problem it addresses. **Conflicts are flagged explicitly** — especially your focal points on uncertainty and thresholds.

  ---

  ### **Core Desiderata: What the Theory Must Deliver**

  1. **Wrongness of Creating Miserable Lives**  
     *Case:* Creating a person guaranteed to suffer intensely (e.g., severe genetic disorder with constant pain).  
     *Requirement:* The act must be impermissible.  
     *Rationale:* Basic non-maleficence intuition; harm is done by creating such a life.

  2. **No Duty to Create Happy Lives**  
     *Case:* Opting not to create a person who would have an extremely happy life.  
     *Requirement:* The act must be permissible (no obligation to procreate).  
     *Rationale:* Asymmetry’s core: absence of a "duty to breed" despite potential net-positive welfare.

  3. **Equal Consideration for Existing Persons**  
     *Case:* Deciding whether to extend the life of an existing happy person vs. creating a new happy person.  
     *Requirement:* Extending the existing person’s life is obligatory if welfare-positive; creating a new person is not.  
     *Rationale:* Distinction between *sustaining* welfare (required) vs. *creating* welfare (optional).

  4. **Distinction: Creating vs. Continuing Existence**  
     *Case:* Abortion (denying continued existence) vs. contraception (denying creation).  
     *Requirement:* Moral reasons to avoid harming an existing being (e.g., late-term abortion) differ from reasons not to create.  
     *Rationale:* Collapsing this distinction implies contraception is as wrong as killing — counterintuitive.

  5. **Distinction: Person-Good vs. Impersonal Good**  
     *Case:* Creating a happy person improves the world impersonally but isn’t "good *for*" the non-existent.  
     *Requirement:* The theory must explain why "making the world better" doesn’t compel creation, while avoiding harm does.  
     *Rationale:* Prevents conflating personal welfare with impersonal value (avoiding "duty to breed").

  6. **Avoid Repugnant Conclusion**  
     *Constraint:* The theory must not imply that creating vast numbers of minimally happy lives is obligatory or optimal.  
     *Rationale:* Preserve quality/quantity distinction; avoid absurd obligations.

  7. **Avoid Deprivationism**  
     *Constraint:* Never-conceived persons are not "deprived" of life or wronged.  
     *Rationale:* Only existing beings have interests; non-existence isn’t a state of deprivation.

  ---

  ### **Your Focal Points: Uncertainty & Thresholds**

  8. **Ordinary Permissibility of Procreation**  
     *Case:* Having a child in typical conditions (e.g., stable home, low poverty risk).  
     *Requirement:* The act must be permissible despite non-zero risk of suffering.  
     *Rationale:* Reflects common intuition; avoids anti-natalism by default.

  9. **Uncertainty Handling**  
     *Case:* Coin-flip procreation (50% wonderful life / 50% agony).  
     *Requirement:* Must explain why this is impermissible *without* implying all procreation is impermissible due to tail risks.  
     *Conflict:* **Desiderata 1 + 3 + 8 clash here.**  
     - If suffering counts strongly against creation (1) and happiness doesn’t count for (3), then *any* risk of suffering dominates the calculus, forbidding procreation (violating 8).  
     - *Resolution Attempts:* Theories may appeal to de minimis risk thresholds, expected value with asymmetry, or agent-relative permissions — but all face tensions.

  10. **Threshold for Moral Status**  
      *Case:* When does a potential person become "someone" who can be harmed? (e.g., embryo vs. newborn).  
      *Requirement:* A non-arbitrary point where:  
      - *Before:* Asymmetry applies (no duty to create, suffering counts against).  
      - *After:* Symmetry applies (harming is wrong, benefiting is good).  
      *Rationale:* Needed to ground distinctions like abortion vs. infanticide.

  11. **Scope for Non-Biological Minds**  
      *Case:* Creating a sentient AI with risk of suffering.  
      *Requirement:* If the AI is conscious, the asymmetry should apply identically to biological persons.  
      *Conflict:* **Defining the threshold (10) risks arbitrariness when applied to AI.**  
      - If sentience is the criterion, AI complicates "creation" timing (e.g., activation vs. training).

  ---

  ### **Flagged Conflicts: Incompatible Desiderata**

  | **Conflict**                          | **Why Incompatible**                                                                 |
  |---------------------------------------|--------------------------------------------------------------------------------------|
  | **Uncertainty (9) vs. Ordinary Permissibility (8)** | If (i) suffering always counts against creation, (ii) happiness never counts for, and (iii) all procreation carries some risk of suffering, then procreation is always impermissible. **This contradicts 8.** |
  | **Threshold (10) vs. Non-Arbitrariness** | Any threshold (conception, sentience, birth) faces edge cases (e.g., embryos, brain-dead patients) and struggles with non-biological minds (11). *No consensus point avoids counterexamples.* |
  | **Asymmetry vs. Impersonal Good (5)** | If creating happy people makes the world better impersonally (5), it’s hard to justify *no* duty to create them (2) without ad hoc constraints. |

  ---

  ### **The Core Tension**
  The **uncertainty problem** is the most acute conflict:  
  - **Asymmetry + Risk + Ordinary Permissibility** appears inconsistent if the disvalue of suffering is absolute and the value of happiness is neutral.  
    - *Possible escape:* Weigh suffering as *lexically worse* than happiness is good (e.g., any risk of torture outweighs any chance of bliss). But this still forbids procreation with tail risks.  
    - *Alternative:* Restrict asymmetry to *certain* outcomes, but this abandons the asymmetry in realistic (uncertain) decisions.

  **Where it likely falls apart:** No theory satisfies all desiderata without compromising intuitions. The threshold problem and uncertainty expose the asymmetry’s fragility in non-ideal conditions. If you demand *no tail-risk prohibition* (8) and *asymmetry* (1–3), you must either dilute the wrongness of risk (abandoning 1) or invent a new moral category for "acceptable creation risks" — which no existing theory cleanly provides.

  Would you like a breakdown of how major theories (e.g., Harm-Based, Person-Affecting) fare against this spec?
