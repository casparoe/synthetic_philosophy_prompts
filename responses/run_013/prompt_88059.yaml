prompt: |-
  I teach one ninety-minute session in a combined history-and-philosophy graduate seminar, twelve students, on overdetermination and multi-causal explanation in history. The room is split down the middle: the historians think "there were several causes" needs no theory and resent the metaphysics; the philosophers will test every historical claim with a counterfactual and have never handled a source. Plan how I should teach this — not the content itself but the sequence, the carrying example, and the failures to expect.

  Begin with the dependency order. Say what has to be in place before the question "was this outcome overdetermined?" can even be posed to this room, what depends on what, and why the session should end where you put the end.

  I want the session organized around a three-way classification I use, which I give you now so that you can build the sequence on it rather than invent one: (i) redundant sufficiency, where each strand on its own would have produced the outcome; (ii) joint sufficiency, where only the strands together produce it; (iii) contributory strands, where no strand is sufficient either alone or jointly, but each is an insufficient, non-redundant part of a condition that was sufficient in the circumstances. The payload is not the classification but what follows from reading one archive under all three headings, and then whether the choice among readings is settled by the past or by the question being asked — why this outcome rather than some other, against what background of normalcy — and finally whether that makes historical causal structure mind-dependent.

  For the carrying example I have invented the following case, which I will hand out on a single page and which comes from no real archive, so that nobody can short-circuit the reasoning with prior knowledge: In 1907 a landlocked state's legislature votes 31–29 to enter a customs union with its larger neighbor. Three strands converge: a harvest failure in the eastern provinces makes the standing grain tariff politically intolerable; a foreign bank offers a loan whose terms require tariff alignment; and a press campaign after the harvest turns the vote into a test of whether the government survives. Two deputies are absent through illness, which is what makes the margin look decisive; but the party that would have taken office had the vote failed had itself committed to accession. I can defend each of the three readings above from this same set of facts. Tell me whether this case can carry the whole session or must be replaced; if it must be, specify what its replacement must have and must not have rather than substituting a famous episode about which half the room already has opinions. Tell me also whether to reveal the three strands at once or one at a time, and in what order.

  Then the misconceptions. I expect at least these: that "several causes" means each cause contributed a share, on an additive or vector-sum model; that overdetermination implies inevitability; that a strand which was not necessary was not a cause at all; that counterfactual reasoning about the past is fiction; and, from the other side of the room, that once causal selection is granted to be pragmatic the selection is arbitrary. For each, tell me where in the sequence it should be headed off, the exact move that does it, and which of them will re-form in a new guise later in the session.

  Close with: one question to put to the room at the end that shows whether they hold the distinction rather than remember the three labels; what to leave out at this level and to say so openly (I expect to cut the possible-worlds semantics of counterfactuals, probabilistic causation, and the covering-law debate); timing and board layout; and how to keep the historians from checking out during the metaphysics and the philosophers from treating the case as decoration. No readings or citations — I have the syllabus.
reasoning: |-
  Okay, let me approach this systematically. The professor is teaching a graduate seminar on overdetermination and multi-causal explanation in history, facing a room divided between skeptical historians and theory-focused philosophers. The three-hour session needs to navigate this tension while delivering specific conceptual content through a constructed case study.

  First, considering the dependency order: The foundational layer must establish that historical outcomes have multiple potential explanations before introducing overdetermination theory. This requires getting both groups to accept that causal analysis is legitimate in history (for philosophers) and that theoretical frameworks can enhance rather than distort historical work (for historians). The endpoint should be showing how causal classification depends on explanatory questions, setting up the mind-dependence debate as the capstone.

  The professor's three-category framework seems well-structured for progression: starting with intuitive redundant causation (i), moving to conjunctive necessity in joint sufficiency (ii), then tackling the messier contributory factors (iii). The case study about the 1907 customs union vote appears ideal - it's fabricated to prevent prior knowledge interference, contains clear parallel causal strands, and allows all three interpretations. Revealing the strands simultaneously would be best, letting students immediately see how the same facts support different causal configurations depending on focus.

  For misconceptions, each needs strategic placement:
  - The "additive causes" error should be addressed when introducing joint sufficiency, using the loan/harvest/press strands to show non-summative interaction
  - "Overdetermination as inevitability" can be dismantled during the absent deputies discussion by highlighting contingency
  - The necessity/cause confusion requires exposing during contributory factors, using the opposition party commitment to show causes needn't be necessary
  - Counterfactual skepticism should be confronted early by having historians articulate their objections, then showing minimal counterfactuals (like "had the harvest been normal...") as inherent in historical reasoning
  - Pragmatism-as-arbitrariness will resurface at the end during mind-dependence discussion, requiring emphasis on constrained pragmatism (evidence limits + explanatory goals)

  The closing question should force application beyond labels: "If we wanted to explain why the vote succeeded rather than failed, which classification would we choose and why?" This tests if they grasp how question framing shapes causal selection. Practical considerations: whiteboard space for parallel case analysis, strict timing cuts on philosophical tangents, and explicit framing of the case as the "laboratory" where both sides must engage. Historians stay grounded by constantly returning to case details; philosophers stay engaged by seeing theory tested against concrete constraints.
answer: |-
  Here’s a battle-tested plan for your session, structured around dependency, your classification, the case study, and misconceptions. The goal is to force both sides to *use* the tools, not just debate them.

  ### Dependency Order & Session Flow (90 mins total)
  1.  **Groundwork: What are we even doing? (10 mins)**
      *   **Prerequisite:** Establish that historians *implicitly* use causal reasoning (even when denying "theory") and that philosophers *need* historical constraints (counterfactuals can't float free of evidence). Start with: *"When a historian says 'several factors led to X,' what work is that phrase doing? When a philosopher asks 'was X necessary?,' what are they demanding of the evidence?"*
      *   **Why First?** Without acknowledging these starting points, the room won't engage. Historians need to see their practice reflected; philosophers need to see the evidentiary anchor.
      *   **Board:** Two columns: "Historian's Causal Language" (e.g., factors, context, conditions) vs. "Philosopher's Causal Questions" (e.g., necessary? sufficient? counterfactual dependence?).

  2.  **Introduce the Case & the Core Question (5 mins)**
      *   Hand out the 1907 Customs Union case. **Reveal all 3 strands immediately.** Context is king for historians; philosophers need the full picture to build models. Say: *"Your job isn't to find *the* cause, but to see how different causal stories can be built from *these same facts* to explain the vote's success."*
      *   **Core Question Posed:** *"Was the successful vote overdetermined? Or was it a close-run thing? What does the evidence let us say?"* (Planting the seed for classification).

  3.  **Classification I: Redundant Sufficiency (i) (15 mins)**
      *   *Task:* Argue that the vote was redundantly sufficient. *"Imagine each strand was strong enough on its own. How?"*
          *   Harvest Failure: Even without loan/press, desperation forces gov't action.
          *   Bank Loan: Economic imperative overrides other concerns, gov't pushes hard.
          *   Press Campaign: Vote becomes confidence motion, party discipline ensures passage.
      *   **Why now?** It's the most intuitive "overdetermination" concept (multiple paths). Historians see "robustness"; philosophers see counterfactual independence.
      *   **Kill a Misconception:** "Overdetermination = Inevitability" (Address HERE). *"But look: the 2 absent deputies! If *their* presence flips the vote, how can it be inevitable? Redundancy says *if* a strand fires, it's sufficient, not that it *had* to fire or that strands couldn't fail. Contingency (the illnesses) and redundancy coexist."* **Expect reformation later:** Philosophers might resurrect inevitability under "possible worlds" talk – shut it down by insisting we're in *this* world with *this* evidence.

  4.  **Classification II: Joint Sufficiency (ii) (15 mins)**
      *   *Task:* Argue that *only* the combination of strands worked. *"Why might each strand alone have failed?"*
          *   Harvest Failure: Anger, but no clear alternative policy without the loan? Or lacked political urgency without press framing?
          *   Bank Loan: Technocratic, but politically toxic without harvest pain or press pressure?
          *   Press Campaign: Creates vote focus, but without substance (harvest/loan), might have fizzled?
      *   **Why next?** Contrast with (i). Forces focus on interaction. Historians see complexity; philosophers see necessity of conjunction.
      *   **Kill Misconceptions:**
          *   "Several Causes = Additive Shares" (Address HERE): *"Is the vote '30% harvest, 40% loan, 30% press'? How would evidence support that? Joint sufficiency shows causes aren't additive ingredients; they interact non-linearly. Removing *one* strand (counterfactually) might collapse the whole thing."*
          *   "Not Necessary = Not a Cause" (Plant seed HERE, address fully in iii): *"If the loan wasn't *necessary* (maybe harvest alone could have done it?), does that mean it wasn't a cause *at all* in the actual scenario? Joint sufficiency makes each necessary *in this specific combination*."*

  5.  **Classification III: Contributory Strands (iii) (15 mins)**
      *   *Task:* Argue that each strand was a crucial but insufficient part of a sufficient set (INUS condition). *"None were sufficient alone, and maybe no *single* combination was strictly necessary (remember the opposition party's stance?), but each was vital in the actual circumstances."*
          *   Harvest: Essential catalyst for the *specific* crisis timing/political heat.
          *   Loan: Provided the concrete, immediate policy solution/leverage.
          *   Press: Turned it into the decisive political moment, forcing the vote *now*.
      *   **Why last?** The messiest, most realistic. Challenges both sides. Historians see contingent factors; philosophers grapple with insufficient conditions being causal.
      *   **Kill Misconceptions:**
          *   "Not Necessary = Not a Cause" (Fully Address HERE): *"The opposition's stance shows accession might have happened *later* without *this specific* vote. Does that mean the harvest/loan/press *didn't cause the vote that actually happened on that day*? Contributory causes are causes precisely because they are non-redundant parts of the *actual* sufficient condition."* **Expect Reformation:** Historians might later conflate this with "background conditions" – emphasize *non-redundant part*.
          *   "Counterfactuals = Fiction" (Address HERE *using historian logic*): *"To say the press campaign was contributory, don't we *have* to think: 'Without the press frenzy, would the vote have happened *that week*, with *that* intensity?' Isn't that implicit in historical analysis of 'turning points' or 'catalysts'? It's a disciplined 'what if?' grounded in evidence about the actors and context."* Get historians to articulate their own implicit counterfactuals.

  6.  **The Payload: Mind-Dependence & Explanatory Goals (20 mins)**
      *   *Question:* *"We just defended all three readings from the SAME facts. What determines which reading is 'right'? Is it 'out there' in the past, or does it depend on US?"*
      *   **Key Insight:** The choice depends on the **explanatory question**.
          *   *"Why did it happen AT ALL?"* -> Favors (i) Redundant Sufficiency (robustness).
          *   *"Why did it happen EXACTLY THEN, IN THAT WAY?"* -> Favors (ii) Joint Sufficiency or (iii) Contributory (specific conjuncture).
          *   *"Why THIS outcome rather than THAT specific alternative?"* (e.g., "Why vote passed *this week* rather than next month?" vs. "Why accession happened *at all* vs. not?") -> Determines which counterfactuals matter, shaping necessary/sufficient judgments.
          *   *"Against what background?"* (Normal tariffs? Normal politics?) shapes what counts as a salient "cause" vs. "condition".
      *   **Mind-Dependence:** Causal *selection* and *classification* (i, ii, iii) are pragmatic, driven by our question and contrast class. BUT, the *causal structure itself* (the strands, their potential interactions, constraints like the opposition stance) is **mind-independent fact**. The evidence constrains the plausible stories.
      *   **Kill Misconception:** "Pragmatic Selection = Arbitrary" (Address HERE): *"If I ask 'Why now?' and you give me redundant sufficiency ignoring the timing, have you answered my question? Pragmatism is constrained by the question AND the evidence. You can't just pick any story; the facts (like the opposition stance!) rule some out and support others relative to the specific 'why?' being asked."* **This is where the misconception will re-form:** Someone will say "So it's all relative!" Hammer the constraints: the question + the archive.

  7.  **Closing Question (5 mins)**
      *   *Put to the room:* **"Suppose we discover a secret memo showing the leader of the opposition party was secretly bribed by the larger neighbor to *lose* the vote if it happened. How does this new evidence change the plausibility of our THREE causal classifications (i, ii, iii) for explaining *the actual vote that passed*? Does it make one more compelling? Less? Why?"**
      *   **Why it works:** It forces application beyond labels. They must use the *concepts* to reassess the case based on new evidence relative to causal structure (Does it bolster redundancy? Undermine joint sufficiency by showing the vote might have passed *without* the strands? Complicate contributory factors?). Reveals if they grasp the explanatory interplay.

  ### Carrying Case: 1907 Customs Union
  *   **Verdict:** **Perfect.** Don't replace it. It has exactly what's needed:
      *   **Must Have:** Multiple plausible causal strands; clear outcome; elements of contingency (absent deputies); evidence of alternative possibilities (opposition stance); ambiguity allowing all 3 readings.
      *   **Must Not Have:** Real-world baggage; clear-cut "right" answer; overly complex technical details; missing context for counterfactuals. Yours avoids all this.
  *   **Reveal Order:** **All strands at once.** Historians need full context; philosophers need the system to model. Unveiling sequentially risks biasing the narrative or making later strands seem like afterthoughts/deus ex machina.

  ### What to Cut & State Openly
  *   **Explicitly State (Early On):** "Today is about *structuring* multi-causal reasoning using this framework. We are **cutting**: Possible-worlds semantics (we'll use grounded counterfactuals), probabilistic causation (we're talking sufficiency/necessity), covering-law debates. Why? To focus on how historians *select* causes and how philosophers can *engage with evidence*."

  ### Timing & Board Layout
  *   **Timing (Strict!):** Groundwork (10), Case Intro (5), (i) (15), (ii) (15), (iii) (15), Payload (20), Close (5). Build in 5 mins flex (likely Payload).
  *   **Board Layout:**
      ```
      LEFT SIDE (Structured Notes)                 RIGHT SIDE (Case Analysis)
      --------------------------------------       --------------------------------------
      Historian | Philosopher (Start)              [1907 CASE: Bullet Points]
      Core Q: Overdetermined? Close?               - Harvest Failure...
      --------------------------------------       - Bank Loan...
      (i) Redundant Suff.                          [Arguments for (i)]
        * Each strand sufficient alone.            [Arguments for (ii)]
      (ii) Joint Suff.                             [Arguments for (iii)]
        * Only together sufficient.
      (iii) Contributory (INUS)                    Payload Qs:
        * Insuff., Non-red, Part of Suff Set.      - "Why at all?" -> Favors? (i)
      --------------------------------------       - "Why then/that way?" -> Favors? (ii)/(iii)
      Payload:                                     - "Why this vs. that alt?" -> Contrast Class
        * Q determines reading.                    - Mind-Indep: Strands, Constraints
        * Mind-Dep: Selection/Classification       - Mind-Dep: Selection/Classification
      ```

  ### Keeping Both Sides Engaged
  1.  **Historians:** Frame theory as *tools to describe their implicit practice*. Constantly root discussion in the **case details**: "Look at the harvest strand. How *would* a historian establish if it was sufficient?" "Does the opposition stance feel like a 'cause' or 'background' to you? Why?" Validate their evidentiary concerns.
  2.  **Philosophers:** Force them to **engage the case as data**: "Build your counterfactual *using just this evidence*. What does the source *allow* you to say about the loan being necessary?" "How does the press campaign challenge a simple necessity/sufficiency model?" Treat the case as the *test* for their theories.
  3.  **General:** Use "**What would convince you?**" for both sides. Ask historians: "What evidence would make you accept the vote was redundantly determined?" Ask philosophers: "What in the archive would falsify the joint sufficiency reading?" This forces justification rooted in the material.

  This structure forces interdependence: historians need the philosophers' frameworks to articulate causal nuance; philosophers need the historians' source-sense to ground their models. The case is the crucible where both must operate. Good luck!
