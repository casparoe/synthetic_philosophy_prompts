prompt: |-
  I got into it at a reading group last night. Someone was presenting on Turchin-style cliodynamics — secular cycles, elite overproduction, the stress index, asabiyyah-type generational rhythms — and I asked how we'd know the cycle keeps turning rather than just being a pattern he drew through the data after the fact. He said 'history repeats itself' and moved on like that settled it. I dont think it settles anything, but I also can't articulate whats wrong with it. So: what are the precise claims that one sentence could be making? Somewhere between the near-truism that similar conditions tend to produce similar outcomes and the much stronger claim that there's an endogenous oscillation with roughly fixed period that we can forecast. Lay the readings out as a menu, say for each whether it's a platitude, a substantive empirical claim, or just false, and then tell me which reading he'd need to be entitled to for 'history repeats itself' to actually license treating secular cycles as predictive — and whether any reading on the menu is true, and what evidence each one would need.
