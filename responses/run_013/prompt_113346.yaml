     - Neglectedness: In the longtermist community, which issues are underworked?
     - Impact: Which answers would most change how funders allocate?

     Given the program's goal (to change funders' allocations), questions that directly address how to make decisions under cluelessness (like symmetry, budget, and frame selection) might be high impact.

     Ranking criteria conflicts: A question might be highly upstream but less tractable. We might prioritize tractable and high impact.

     Proposed ordering:

     1. Frame Selection (E): Because without a decision rule, we cannot even start to evaluate acts. This is foundational. And it is tractable by decision theorists without data (by analyzing properties of rules). It is somewhat neglected in longtermism, which often defaults to expected utility. What would change rank: if a clear winner among rules emerges, it might drop; if new rules are proposed, it might rise.

     2. Symmetry Question (A): Because it offers a potential way out of act cluelessness paralysis. If symmetry can be used to justify a default, it could be immediately applicable. Tractability: philosophical analysis and decision theory. Neglected: not much written in longtermist context. Impact: high because it could change the burden of proof for interventions. What would change rank: if it turns out symmetry rarely holds or cannot be formalized, it might drop.

     3. Budget Question (B): Because funders face the decision to fund research or act. This is very practical. Tractability: decision theory (value of information) but must be adapted to deep uncertainty. Neglected: in longtermism, the value of information is discussed but not systematically under cluelessness. What would change rank: if a general formula for the value of information under cluelessness is found, it might become less important.

     4. Foundational Measure (C): Because without knowing how to compare goods, we cannot assign value. This is upstream for any quantification. Tractability: ethical theory and axiomatic approaches. Neglected: there is work on population ethics and aggregation, but less focused on very long time horizons. What would change rank: if a consensus on aggregation emerges.

     5. Fanaticalism (I): Because fanaticism is a major critique of longtermism. Solving it would make expected value more defensible. Tractability: decision theory and philosophy. Neglected: some work exists, but not resolved. What would change rank: if fanaticism is shown to be unavoidable, then this becomes critical.

     6. Value Uncertainty (F): Because if we are uncertain about what is valuable, then even with probabilities we cannot rank. Tractability: moral uncertainty literature can be applied. Neglected: longtermists often assume a specific view (e.g., total utilitarianism). What would change rank: if longtermists converge on a value theory.

