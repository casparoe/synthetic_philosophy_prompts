  We are constructing a five-year research agenda for a small program in long-run ethics, focused on the problem of consequentialist cluelessness. The goal is to produce work that changes how longtermist funders allocate money. The program has eight philosophers and decision theorists, no empirical data collection.

  The user's taxonomy of cluelessness loci:
  1. Act cluelessness: uncertainty about the consequences of a particular action (due to chaotic causal chains and the number of downstream effects).
  2. Measure cluelessness: uncertainty about how to aggregate and compare goods across persons, times, and kinds of value (so that even with a complete probability distribution, ranking is underdetermined).
  3. Frame cluelessness: uncertainty about the option set and decision rule (e.g., choosing among acts, policies, or dispositions).

  Two additional ideas:
  - Cluelessness symmetry: when the same argument that makes doing X unassessable also makes refraining from X unassessable. Is there a sense in which the uncertainty cancels? Can this be turned into a principled decision rule?
  - Cluelessness budget: when is it worth reducing cluelessness (by buying information) versus acting under uncertainty? And to which field does this question belong?

  We need to produce a prioritized agenda of open questions. For each question, we must address:
  - Why it is upstream (i.e., foundational; other work depends on it)
  - Tractability for philosophers and decision theorists (without empirical data)
  - Neglectedness (current state of research)
  - What would change its rank

  The agenda should be returned as a JSON object with specific fields.

  Criteria for ranking:
  - Upstreamness: How foundational the question is; how many other questions or practical decisions depend on it.
  - Tractability: Can it be addressed by philosophers and decision theorists without empirical data?
  - Neglectedness: Is it currently underworked?
  - Impact: How much would progress on this question change longtermist funders' allocation decisions?

  We must also consider the two ideas (symmetry and budget) and decide if they are real research questions.

  We are to produce 6-9 ranked questions, each with:
    rank: integer
    question: one or two sentences
    locus: "act", "measure", "frame", or "other"
    why_upstream: why it is foundational
    tractability: why it can be done without data
    neglectedness: current state and why underworked
    what_would_change_the_rank: what evidence or argument would move it

  Cross-dependencies: at least four important edges in the ordering.

  Deprioritized: questions that might be expected but are left low or out.

  Taxonomy verdict: correct or replace the act/measure/frame distinction.

  Bottom line: 1-2 sentences naming the first two or three questions to fund and why.

