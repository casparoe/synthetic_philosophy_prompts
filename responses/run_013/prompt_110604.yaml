  # Research Proposal: Intent vs. Commitment in AI Alignment

  ## Title
  The Intent/Value Distinction Under Scrutiny: Replacing Preference-Satisfaction with Commitment-Based Intent in AI Alignment

  ## Research Question
  Does the distinction between intent-alignment (narrowly defined) and value-alignment survive when intent is modeled as a settled commitment rather than a preference-satisfaction function, and what are the implications for the tractability and adequacy of the narrow alignment project?

  ## Background and Motivation
  The dominant framing in AI alignment separates "intent-alignment" (getting an AI system to do what the operator intends) from "value-alignment" (ensuring that what the operator intends is good or right). This narrow approach to intent-alignment typically operationalizes "intent" as the operator's preferences, inferred from behavior and expressed desires, and treats it as a tractable engineering problem distinct from the harder ethical problem of value-alignment.

  However, this operationalization conflates two distinct concepts from the philosophy of action: *preferences* (which are desires, often fluctuating and context-dependent) and *intentions* (which are settled commitments that structure action and planning, and may persist even when they contradict momentary preferences). If "intent" in the narrow framing is actually about preferences, then the framing has subtly substituted a preference-satisfaction target for a genuine intention-alignment target. This raises critical questions:
  - If intent is redefined as a settled commitment, does the intent/value distinction collapse?
  - Does the narrow alignment problem become harder (because inferring commitments is different from inferring preferences) or become inadequate (because it aligns to something too thin to capture what operators care about)?

  ## Existing Positions and Why They Don't Settle the Question
  The current debate assumes intent-alignment is about preference-satisfaction. Proponents of the narrow view (e.g., "just do what the user wants") argue that it isolates a solvable technical problem. Critics of the narrow view argue that it ignores value-alignment and may lead to harmful outcomes. However, both sides accept the preference model of intent. They do not consider:
  - Cases where an operator's commitment (intention) diverges from their current preferences (e.g., committing to a diet but craving cake).
  - Cases where an operator's stated intention (commitment) is overridden by a system that optimizes for the operator's predicted future preferences (e.g., a system that ignores a user's command to not be interrupted because it predicts the user will later be glad they were interrupted).
  - Cases where the operator's intention is not formed until the system asks for clarification.

  Because these cases are not addressed, the debate fails to engage with the possibility that the narrow framing is targeting the wrong thing (preferences) and that a shift to commitment-based intent might collapse the intent/value distinction or reveal new challenges.

  ## Method
  This is a conceptual project, not an empirical one. The goal is to clarify concepts and their implications, not to measure user behavior. The steps are:

  1. **Reconstruct the Preference Model of Intent**: Define how "intent" is currently operationalized as preference-satisfaction in alignment literature, and show how it reduces intent to a function mapping states to utilities.

  2. **Reconstruct the Commitment Model of Intent**: Draw on philosophy of action (e.g., Bratman, Searle) to define intentions as commitments that are settled, action-guiding, and distinct from desires. Articulate how this model would require different alignment targets.

  3. **Test Cases**: Run a series of hypothetical cases through both models to identify divergences:
     - **Case 1**: An operator has committed to a deadline (intention) but, at the moment, prefers to procrastinate. A preference-aligned system would help procrastinate; a commitment-aligned system would resist.
     - **Case 2**: A system predicts that an operator will later regret following their current stated intention (e.g., sending an angry email). A preference-aligned system (based on revealed preferences) might override the intention; a commitment-aligned system would not, unless the commitment included a meta-commitment to reconsideration.
     - **Case 3**: An operator has not formed an intention until the system asks them to commit (e.g., "Do you want to save the file?"). Here, the system is not aligning to a pre-existing intent but structuring the formation of intent.

  4. **Analyze Implications**: For each divergence, ask:
     - Does this case show that the narrow intent-alignment problem is actually a value-alignment problem in disguise? (e.g., overriding procrastination requires the system to judge which of the operator's states is more "authentic").
     - Does it make alignment harder? (e.g., because commitments are not directly observable and require normative assumptions about how to identify them).
     - Does it make the target thinner? (e.g., if the system only targets momentary commitments, it might ignore deeper values).

  ## Why Conceptual, Not Empirical?
  This project is about the definitions and assumptions underlying the alignment problem, not about how humans behave in practice. While empirical HCI work could study how users react to systems that prioritize commitments over preferences, that would be a follow-up project. The first step is to clarify the concepts and their logical implications. Without this, empirical work would lack a clear framework.

  ## Timeline (9 months, part-time)
  - **Months 1-2**: Background research and detailed reconstruction of the preference model of intent in AI alignment.
  - **Months 3-4**: Reconstruction of the commitment model of intent from philosophy of action, and drafting of how it would apply to AI alignment.
  - **Months 5-6**: Development and analysis of test cases, identifying divergences between the two models.
  - **Months 7-8**: Analysis of implications for the intent/value distinction and the tractability of alignment.
  - **Month 9**: Synthesis and writing of the deliverable.

  ## Deliverable
  A 20-30 page paper (or equivalent in another format) presenting the analysis, cases, and conclusions, suitable for submission to an AI ethics or philosophy of AI venue.

  ## What Success Looks Like
  The project succeeds if it clearly demonstrates that the preference-based model of intent is inadequate and that switching to a commitment-based model either collapses the intent/value distinction (showing that the narrow problem is not so narrow) or reveals new challenges (making alignment harder or thinner). Success would also include generating novel insights that reframe the alignment debate.

  ## What Failure Looks Like
  Failure occurs if the two models (preference and commitment) turn out to be functionally equivalent for alignment purposes in all relevant cases, making the distinction a mere philosophical subtlety without practical implications. In that case, the project would conclude that the narrow framing is robust to this challenge.

  ## Strongest Objection and Verdict if It Holds
  **Strongest Objection**: The distinction between preferences and commitments is real but irrelevant to AI alignment because, in practice, operators will always want the system to satisfy their preferences (including their preference to follow through on commitments) and will judge the system based on whether it satisfies those preferences. Thus, the commitment model either reduces to a subset of preferences (preferences about commitment-keeping) or is overridden by the operator's all-things-considered preferences at the time of interaction.

  **Verdict if Objection Holds**: If this objection holds, then the commitment model does not introduce new challenges. The narrow framing remains intact because, even if intentions are commitments, what matters for alignment is satisfying the operator's current preferences (which may include honoring commitments). The project would then have shown that the distinction, while philosophically interesting, is idle for alignment.

