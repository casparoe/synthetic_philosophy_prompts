answer: |-
  ### Research Proposal: The Commitment Gap in Intent Alignment

  **Title**  
  Preference-Satisfaction vs. Commitment: Testing the Foundations of Narrow AI Alignment  

  **Research Question**  
  Does substituting a commitment-based model of intent for the prevailing preference-satisfaction model collapse, complicate, or invalidate the intent/value distinction in AI alignment?  

  **Background and Motivation**  
  The "narrow" alignment paradigm treats intent-alignment as distinct from value-alignment by restricting the goal to fulfilling the operator’s *intent*, defined operationally as inferring and satisfying their preferences (e.g., utility functions from behavioral data). This framing assumes intent is reducible to preferences. However, philosophy of action distinguishes *intentions* (settled commitments that close deliberation) from *preferences* (dynamic desires). For instance:  
  - An operator may *intend* to finish a report while actively *preferring* to scroll social media.  
  - A system trained on behavioral data might override a conscious intention if it predicts future preference shifts.  

  This project interrogates whether the intent/value distinction dissolves when intent is modeled as commitment. If intent-alignment requires honoring commitments rather than preferences, the "tractable core" of alignment may implicitly reintroduce value judgments or become operationally unworkable.  

  **Why Existing Positions Don’t Settle This**  
  - **Pro-narrow view** ("Just satisfy user preferences") assumes intent *is* preference-satisfaction, ignoring cases where commitments diverge from preferences.  
  - **Value-alignment critics** focus on ethical risks of satisfying harmful preferences, but don’t challenge the *definition* of intent.  
  - **Hybrid approaches** (e.g., corrigibility) still operationalize intent via preference inference. All sides neglect the commitment/preference gap, leaving the narrow framing’s foundations unexamined.  

  **Method: Conceptual Analysis with Test Cases**  
  1. **Deconstruct the preference model**: Expose how current alignment literature reduces intent to revealed preferences.  
  2. **Formalize the commitment model**: Define intent as non-revisable, plan-structuring commitment (drawing on Bratman, Searle).  
  3. **Run divergence scenarios**: Apply both models to concrete cases:  
     - *Procrastination case*: Operator intends to draft a policy (commitment) but prefers distractions. Does "intent-aligned" AI enable work or leisure?  
     - *Regret-prevention case*: Operator intends to send an email; AI overrides it, predicting future preference shifts. Is this alignment or misalignment?  
     - *Intention-formation case*: Operator’s intent crystallizes only when the system demands explicit commitment. Does alignment require preference-probing or intention-scaffolding?  
  4. **Diagnose implications**: For each divergence, assess whether resolving it:  
     - (a) Collapses into value-alignment (e.g., judging which state is "authentic"),  
     - (b) Introduces new technical hurdles (e.g., detecting commitments vs. preferences),  
     - (c) Renders alignment irrelevant (e.g., satisfying "thin" commitments nobody wants enforced).  

  **Why Conceptual, Not Empirical?**  
  This is a *foundational* problem: Before designing systems that interact with human intentions, we must clarify what "intent" means. Empirical HCI could test implementations, but only *after* establishing whether the target (preference vs. commitment) matters conceptually.  

  **Timeline (Part-Time, 9 Months)**  
  | Period          | Milestone                                  |  
  |-----------------|--------------------------------------------|  
  | Months 1–2      | Framework development: Preference-model critique; commitment-model specification |  
  | Months 3–4      | Scenario drafting: Procrastination, regret-prevention, intention-formation cases |  
  | Months 5–6      | Divergence analysis: Map implications for each case |  
  | Months 7–8      | Synthesis: Does intent/value distinction survive? Classify outcomes (collapse/harden/thin) |  
  | Month 9         | Drafting deliverable paper                |  

  **Deliverable**  
  A peer-ready paper (8,000–10,000 words) for AI ethics/governance venues, concluding with either:  
  - A revised alignment taxonomy,  
  - A demonstration of the narrow framing’s incoherence, or  
  - Proof that the distinction is practically inert.  

  **Success Looks Like**  
  Demonstrating that the commitment model either:  
  - Collapses intent-alignment into value-alignment (e.g., by requiring ethical arbitration of commitment/preference conflicts), or  
  - Reveals new technical/practical obstacles (e.g., detecting commitments requires interpretive leaps beyond preference inference).  

  **Failure Looks Like**  
  The preference and commitment models converge on identical alignment prescriptions in all realistic scenarios, rendering the distinction philosophically valid but operationally irrelevant.  

  **Strongest Objection & Verdict if It Holds**  
  **Objection**: "Commitments are just a subset of preferences (e.g., preferences about future states), so no divergence exists in practice."  
  **Verdict if Objection Holds**: The narrow framing remains intact, as intent-alignment reduces cleanly to preference-satisfaction. The project then concludes that the commitment model offers no substantive challenge.  

