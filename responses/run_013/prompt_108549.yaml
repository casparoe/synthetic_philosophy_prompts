  ## Drawing Hands: A Villanelle of Levels

  **(After M.C. Escher and D.R. Hofstadter)**

  This pencil conjures form from white below,  
  Its careful curve defines the gripping hold,  
  **I draw the hand that draws me so.**

  Does pressure rise from mine, or theirs? We know  
  No starting point within this loop of old –  
  **Mine is the pencil, yours the page to show.**

  Which line began? The truth begins to go  
  In circles where creation is controlled  
  **I draw the hand that draws me so.**

  A flick of wrist, a shade – but watch it grow  
  From *their* intent? Or mine? The tale unfolds:  
  **Mine is the pencil, yours the page to show.**

  This tangled hierarchy begins to throw  
  Its paradox, a story to be told:  
  **I draw the hand that draws me so.**  
  **Mine is the pencil, yours the page to show.**

  No ground emerges from this ceaseless flow,  
  No solid base the shifting lines enfold.  
  The rules that bind the loop begin to show  
  Through this fixed frame where both refrains are rolled.  
  **I draw the hand that draws me so.**  
  **Mine is the pencil, yours the page to show.**

  In one line: **The fixed villanelle form provides the inviolate level enabling the tangled loop to exist without collapse.**

  ---

  **Notes for the Handout:**

  *   **Refrains as Hands:** The two alternating refrains ("I draw the hand that draws me so" and "Mine is the pencil, yours the page to show") embody the two hands locked in mutual creation, each claiming agency over the other – the core tangled hierarchy.
  *   **The Loop's Structure:** The villanelle's mandated return of these exact lines creates the "strange loop" effect, preventing a bottoming out. Each hand's "statement" reappears, driven by the form, perpetuating the cycle.
  *   **Inviolate Level Revealed:** The final quatrain (stanza 6) explicitly breaks the pattern *slightly* by introducing a new rhyme sound ("flow," "show," "rolled," "show") while still containing both refrains. This draws attention to the "rules" and the "fixed frame" – the villanelle structure itself. This structure is the inviolate level: it exists *outside* the drawn loop of the hands. It provides the stable, unchanging rules that *contain* and *enable* the paradoxical, mutually defining relationship depicted *within* it. Neither hand becomes this ground; the poem's form is.
  *   **Accuracy:** The poem focuses on the *act* of mutual drawing and the resulting paradox ("No starting point," "No ground emerges"), avoiding false claims about which hand is the ultimate creator. The final stanza explicitly points to the external structure ("rules," "this fixed frame") as the necessary context, aligning with the inviolate level concept. The final line after the poem states the function clearly.
  *   **Effect:** The form forces the reader to experience the recursive, self-supporting nature of the image while subtly revealing the scaffolding that makes this experience possible.
