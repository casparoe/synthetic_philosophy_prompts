  Now, for the memo draft:

  ---

  **MEMORANDUM**

  To: Board Members of the Provincial Disaster Recovery Fund  
  From: [Your Name]  
  Date: [Date of Circulation, e.g., October 10, 2023]  
  Subject: Recommendation on Hollow Creek Claims and Proposed Contributory Neglect Deduction  

  This memo addresses the staff proposal for the Hollow Creek claims, scheduled for a vote on October 14, 2023. The proposal recommends a 20% deduction for "contributory neglect" from claims by approximately 140 households that built or bought within the mapped floodway and then ignored two evacuation advisories prior to the flood. All other claims would be paid in full.  

  Our enabling statute establishes the fund to restore households to a habitable standard and is silent on matters of fault. This silence has led to divergent views on the role of personal responsibility in claim determinations.  

  **Dara's Position**  
  Dara contends that suffering resulting from one's choices settles a moral account; therefore, compensating these households in full would be an injustice, as it negates a consequence they have earned. She frames this as respecting adults by allowing them to bear the weight of their decisions.  

  **What Dara Gets Right**  
  Dara correctly emphasizes the importance of personal responsibility. Ignoring evacuation advisories is a serious matter that may have increased the losses and risks to emergency responders. There is a moral intuition that choices have consequences, and the fund should not entirely insulate claimants from those consequences.  

  **Where Dara's Argument Breaks**  
  However, the fund's statutory mandate is recovery, not moral accounting. As a public scheme, it must balance individual responsibility with collective support to achieve its goal of restoring habitability. Viewing the deduction as a cosmic settling of accounts risks overstepping the fund's purpose and could lead to arbitrary outcomes. Moreover, the deduction must be justified by practical considerations:  

  1. **Failure to Mitigate**: By ignoring advisories, these households may have failed to take reasonable steps to mitigate their losses (e.g., by moving valuables or reducing damage).  
  2. **Fairness to Others**: Claimants who complied with advisories and took precautions reasonably expect that their neighbors' recklessness will not be rewarded equally.  
  3. **Resource Constraints**: While not explicit in the statute, the fund must be managed prudently; deductions for avoidable losses help preserve resources for unavoidable ones.  

  **Ade's Point and the Buddhist Lens**  
  Ade raised the Buddhist concept of non-self, suggesting that the person suffering now is not the same as the person who acted, so desert does not apply. Dara countered that karma is not judgment but causation. While this exchange highlights philosophical complexities, it does not resolve our practical dilemma. The fund operates in the realm of public policy, not metaphysics.  

  **Recommendation**  
  I propose we adopt the staff's deduction concept but amend it to include an exception process to ensure fairness and practicality:  

  - **Rule**: A 20% deduction applies to claims from households within the mapped floodway who failed to evacuate after two evacuation advisories.  
  - **Exception**: If a claimant demonstrates extenuating circumstances that made evacuation unreasonably difficult (e.g., medical emergency, lack of transportation, or caregiving obligations), the deduction may be reduced or waived.  
  - **Implementation**: The claims manager will develop and apply a simple procedure for evaluating exception requests by November 1, 2023.  
  - **Review**: The board will review the impact of this policy on recovery outcomes at its next quarterly meeting (January 2024).  

  **Bottom Line**  
  This approach acknowledges the role of personal responsibility without making the fund an arbiter of moral deserts. It aligns with the statute by focusing on the practical goal of recovery while recognizing that failure to mitigate losses is a relevant factor. It also addresses the anger of careful claimants by imposing a consequence for recklessness, but with a safety valve for those who had valid reasons for staying.  

  I move that the board adopt the amended proposal as described.  

