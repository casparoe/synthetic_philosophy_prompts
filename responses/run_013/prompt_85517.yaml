  Concrete proposal:

  - Amend the staff proposal to have a 10% deduction for those in the mapped floodway who ignored two evacuation advisories. Why? Because 20% might be too harsh and not aligned with the statutory goal of recovery, but some deduction is warranted to acknowledge the failure to take reasonable steps to protect themselves and to address the concerns of other claimants who did take precautions.

  But we need a rule that a claims manager can implement.

