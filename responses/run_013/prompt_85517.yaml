  3. Address Ade's Buddhist-inspired objection and Dara's rebuttal (karma as causation, not judgment).
  4. Provide a bottom line: adopt, reject, or amend the deduction, with a concrete rule and date.
  5. Be practical for a claims manager to implement.

  After the memo, provide a JSON block with specific fields.

