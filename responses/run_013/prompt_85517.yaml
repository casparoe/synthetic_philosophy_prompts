  Key points:

  - The fund's statutory purpose: to get households back to a habitable standard. It is silent on fault. Therefore, the fund is not a court of moral accountability but a mechanism for recovery.

  - Dara's view: She sees the loss as a deserved consequence and paying in full as an injustice because it negates the consequence. But note: the fund is about recovery, not about assigning moral fault or teaching lessons.

  - Ade's point and Dara's rebuttal: Ade argued that there is no persisting self to hold the account. Dara countered that karma is about causation, not judgment. However, in the context of the fund, we are not operating on a cosmic scale of karma but on a statutory mandate for recovery.

  Practical considerations:

  - The staff proposal: 20% deduction for those in the mapped floodway who ignored two advisories.

  - There are claimants who did everything right and are angry about the 20% deduction for their neighbors being too small.

  - We must balance fairness, the statutory purpose, and the practical need to discourage reckless behavior (which might be the staff's intent with the deduction).

  Proposed bottom line:

  - Amend the staff proposal. Why? Because a flat 20% might be arbitrary and doesn't account for degrees of neglect. Also, we must consider that the fund is for recovery and not about fault. However, ignoring evacuation advisories is a serious matter that might warrant some deduction to acknowledge the role of personal responsibility and to align with the fund's sustainability.

