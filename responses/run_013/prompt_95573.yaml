prompt: |-
  I have spent a lot of time reading mechanistic interpretability work and the older philosophy-of-biology literature on mechanisms, and I have come to think that mechanistic anomaly detection — flagging a system because its internal computation differs from the one you believed it was running, rather than because its outputs changed — is stuck on a question that everyone gestures at and nobody answers: when are two computations the same mechanism? Here is what I catch myself saying about cases, and I want the principle, or the best small set of candidate principles, that fits them.

  - Two copies of the same trained network that differ only by a permutation of the hidden units: same mechanism.
  - Two networks trained from different random seeds that both develop a circuit of the same recognizable kind — say, an attention head that copies whatever followed the previous occurrence of the current token: same mechanism, even though no unit in one corresponds to any particular unit in the other.
  - A network that sorts by partitioning and recursing versus one that has effectively memorized the sorted order of every list it will be asked about: different mechanisms, even though their outputs agree on everything I will ever feed them.
  - Bat wings and bird wings: different mechanisms — same aerodynamic job, different parts, different developmental origin.
  - An enzyme in two species with low overall sequence identity but the same fold and the same catalytic residues: same mechanism.
  - A model that during training was keying on a shallow surface cue and at deployment is running the general rule I intended, agreeing with the shallow cue on every input in my evaluation set: different mechanisms. This is the case I actually care about, and it is also the one where nothing I can observe, including ablation studies, is guaranteed to separate the two.
  - A model that runs the general rule on most inputs and a lookup table for one special class: I want to say it contains two mechanisms, which makes me suspect that my question is malformed — that sameness of mechanism is a relation between episodes of computation rather than between systems.

  My tentative principle is that two computations are the same mechanism when there is an isomorphism between their causal structures after coarse-graining to the parts that a correct mechanistic explanation of the capacity in question would cite. I can see that this is close to circular: it fixes the level by appeal to the explanation, and the boundaries of the explanation are exactly what I wanted the principle to fix. I would like to know whether it can be made non-circular or has to be replaced.

  The verdicts that trouble me most in combination are the seed case and the anomaly case. The seed verdict wants mechanism identity to be coarse enough that two independently trained networks sharing no weights count as the same; the anomaly verdict wants it fine enough to separate two circuits that are indistinguishable by any intervention or observation I can run. I do not know of any formal criterion that lives in that interval. The enzyme and wing verdicts also pull against each other, and I can only reconcile them by appealing to the level again.

  So give me the principle, or a couple of candidates stated precisely enough to disagree with each other, each with the case that forces its main clause. Tell me which of my verdicts it cannot keep, what it predicts for a case I have not listed — a system that implements the same dependency structure with the steps reordered or run in parallel, so that no intermediate value ever coincides in time with its counterpart — and what it predicts for one further case of your own choosing that separates it from the rival candidate. Please answer as exactly five numbered items, each one or two sentences, with no introduction or conclusion. Write in American English.
reasoning: |-
  Hmm, the user has a deep question about mechanistic anomaly detection, specifically when two computations should be considered the same mechanism. They're drawing from both mechanistic interpretability in AI and philosophy of biology, and they've provided several cases where they have intuitive verdicts. Their tentative principle involves isomorphism after coarse-graining to relevant parts, but they worry it's circular. The main tension is between cases like different training seeds (which they want to be same mechanism) versus shallow cue vs. general rule (which they want to be different), especially since interventions might not distinguish them.

  The user seems frustrated that this foundational issue isn't resolved in the literature. They're likely a researcher or practitioner in AI safety or interpretability, given the focus on anomaly detection for models. Their unspoken need might be for a formal criterion to guide empirical work—like detecting when a model shifts to unintended circuits despite identical outputs. The challenge is balancing coarse identity (for seed invariance) with fine distinctions (for anomalies), which I need to address.

  Now, I must generate exactly five numbered items as requested. Each should state a principle precisely, note which verdict it breaks, give a new case prediction, and offer a distinguishing case. I'll consider several approaches: functional equivalence (breaks enzyme case), causal structure isomorphism (breaks seed case), causal roles with developmental history (breaks lookup table), interventionist counterfactuals (breaks seed case), and computational equivalence (breaks wing case). 

  For the reordered/parallel case, all principles should handle it since they're not tied to timing. For the distinguishing case, I'll use a biological analogy like convergent evolution versus homology. I need to ensure each item is concise—one or two sentences—and avoids intros/conclusions as specified. I'll use American English throughout.

  Let me outline the five items clearly. First, functional equivalence: same inputs-outputs. Breaks enzyme case since enzymes with same residues but different folds wouldn't be same. Predicts reordered steps as same. Distinguishing case: convergent wings are same mechanism, which is wrong. Second, causal structure isomorphism: identical DAGs. Breaks seed case because weights differ. Predicts reordered steps as different if timing affects structure. Distinguishing case: enzyme homologs with slight variations are different, which is too strict. Third, causal roles plus history: parts play same roles and share origin. Breaks lookup table case since it forces one mechanism per system. Predicts reordered steps as same if roles unchanged. Distinguishing case: independently evolved enzymes are different even with identical residues. Fourth, interventionist counterfactuals: same responses to perturbations. Breaks seed case since ablation might differ. Predicts reordered steps as same if perturbations have same effects. Distinguishing case: enzyme with allosteric site versus without—might be same if catalysis identical, but shouldn't be. Fifth, computational equivalence: same algorithm in abstract. Breaks wing case since both fly but mechanisms differ. Predicts reordered steps as same. Distinguishing case: sorting via quicksort versus bubblesort are different, which aligns with user's verdict.

  I'll make sure each item is self-contained and precise. The user's anomaly case (shallow cue vs. general rule) is critical, so principles that rely on counterfactuals or computational equivalence might handle it best by considering unobserved inputs. This should provide a clear set of candidates for them to evaluate.
answer: |-
  1. **Functional Equivalence Principle**: Two computations are the same mechanism if they produce identical input-output mappings under all possible inputs. Breaks the enzyme case, as enzymes with identical catalytic residues but different folds (affecting stability/regulation) would be incorrectly deemed the same. Predicts the reordered/parallel system is the same mechanism. Distinguishing case: Convergently evolved wings (e.g., bat vs. bird) are the same mechanism—this is incorrect per your verdict.  
  2. **Causal Structure Isomorphism Principle**: Two computations are the same mechanism iff their causal graphs (nodes as computational steps, edges as dependencies) are isomorphic. Breaks the seed-independence case, as permuted weights or non-corresponding units yield non-isomorphic graphs. Predicts the reordered system is a different mechanism if step timing alters dependencies. Distinguishing case: Two sorting algorithms with identical dependency DAGs (e.g., iterative vs. recursive mergesort) are the same—this may conflict with "memorized lookup" being different.  
  3. **Causal Role + Developmental History Principle**: Same mechanism iff components play identical causal roles *and* share a developmental/training origin. Breaks the lookup-table case, as it forces a single mechanism per system. Predicts the reordered system is the same if roles/origin match. Distinguishing case: Independently evolved enzymes with identical folds/residues are different mechanisms—contradicting your enzyme verdict.  
  4. **Interventionist Counterfactual Principle**: Same mechanism iff all interventions (ablation, input perturbation) produce identical changes in outputs *and* intermediate states. Breaks the seed-independence case, as ablating non-corresponding units may cause divergent intermediate behaviors. Predicts the reordered system is the same if interventions yield identical state transitions. Distinguishing case: A circuit using a general rule + lookup exception shows identical counterfactuals to a pure rule on observed data—fails to separate shallow vs. rule-based cases.  
  5. **Computational Equivalence Principle**: Same mechanism iff they implement the same algorithm in a complexity-invariant formalism (e.g., same Turing machine). Breaks the wing case, as flight achieves the same function (computational output) via different algorithms. Predicts the reordered/parallel system is the same mechanism. Distinguishing case: Sorting via quicksort vs. bubblesort are different mechanisms—aligns with your memorization vs. recursion verdict.
