prompt: |-
  I'm a novelist, three books in, and I've gotten myself into a philosophical hole I'm hoping you can pull me out of.

  Six months ago a friend handed me Rorty's Contingency, Irony, and Solidarity and I haven't written a decent paragraph since. The problem isn't that I disagree with him. It's that I mostly agree. No mind-independent facts sitting out there for my sentences to line up against, vocabularies as tools for coping rather than mirrors of anything, truth as less a relation between my sentence and a chunk of the world than a way of saying the sentence is doing its job, progress as getting a better description rather than getting closer to the thing itself. Sure. But my whole job is inventing sentences about people who never existed and trying to make strangers care about them, and I can't tell anymore what I think I'm doing when I do it well.

  So here's what I want from you: the most important implications of that view for the actual practice of writing fiction. Not a summary of Rorty, I've read the book twice. I want the consequences, ordered, concrete enough that I could act on them at the desk, and I want you to flag which ones are his and which your extending on his behalf.

  A few things I keep banging into, in case they help you aim.

  The book I'm stuck on is about a plant closing in a town my family's from. I'm writing it in a flat, almost clinical voice and I keep feeling like I'm betraying the people in it. Under his view, what would even be the content of that feeling? If accuracy is internal to the vocabulary I've picked, my flatness can't be inaccurate. So is the betrayal feeling just sentimentality, or is it tracking something real that antirepresentationalism has no room to name?

  Redescription. He says the interesting move is to describe things in a new vocabulary, and the strong poet's project is self-creation. Fine, except my craft is the redescription of other people's lives. He also seems to think redescription can be a form of cruelty, which is what he's circling in the Nabokov and Orwell chapters near the end and in the whole private/public split. Give me a usable test for when I'm handing someone a better vocabulary for their own life versus using their life as raw material for mine. I need something I can feel from inside a draft, not a rule.

  Orwell. My reading is that he thinks the cruelty descriptions there do work the argument can't do, that the book moves you rather than proves anything to you, and that this is fine. If that's right, what is the moral force of my novel made of? A technique I can practice on purpose, a con that happens to work, or something that only works if I don't know I'm doing it?

  Solidarity. He wants us to aim at solidarity instead of objectivity, a bigger we. But a good propagandist wants a bigger we too. What is the actual difference between a novel that widens the we and one that just flatters it? If there's no criterion, say so. If there is one, I want it.

  And the honest part: what should I not take from him? Where does this view make me a worse novelist, lazier about facts or colder about people? I think somewhere he says the novel took over from the sermon and the treatise as the main engine of moral change, and I want to know whether that's a compliment to my trade or a warning about it.

  Keep it plain. No cites, no reading list, alot of this I just need in my own words anyway. I'm trying to finish a book, not write a paper.
reasoning: |-
  Okay, let me approach this novelist's problem methodically. They're stuck after reading Rorty's Contingency, Irony, and Solidarity, and need actionable writing advice grounded in his philosophy. The core tension seems to be between embracing linguistic contingency while maintaining ethical responsibility in fiction.

  First, I need to unpack their specific pain points: the guilt over "flat" narration feeling like betrayal, the ethics of redescribing others' lives, the mechanics of moral persuasion in fiction, and distinguishing solidarity from propaganda. They're also asking for warnings about potential pitfalls in applying Rorty's ideas.

  For the betrayal question about clinical narration: Under Rorty's view, accuracy is indeed vocabulary-dependent. That feeling of betrayal isn't about factual misrepresentation but perhaps about failing the solidarity test - is the description expanding empathy or freezing it? The solution might lie in intentionality: clinical tone becomes betrayal when it serves the writer's aesthetic at the expense of the subjects' dignity.

  Regarding redescription ethics: The cruelty test comes down to whether the redescribed person would recognize themselves as participants rather than specimens. This requires techniques like immersive research or perspective-taking within the writing process itself. The key is maintaining what I'd call "narrative reciprocity."

  On moral force without objectivity: Rorty's insight about novels replacing sermons suggests moral power comes from particularity - Orwell's concreteness bypasses arguments. For practice, this means honing sensory details that trigger visceral recognition rather than crafting "messages."

  The solidarity vs propaganda distinction hinges on expansion versus reinforcement. A we-widening novel actively works against the reader's existing categories, while flattery merely dresses up tribal instincts. The test might be discomfort: does the reading experience challenge or confirm the reader's emotional economy?

  Finally, the warnings: The real danger in Rorty isn't coldness but the potential for glibness - when all vocabularies seem equally contingent, the stakes of representation might feel diminished. And ironically, denying objectivity could make one lazy about precise observation, since "facts" become moves in language games.

  Throughout, I'll maintain their requested plain language, avoid citations, and focus on desk-level applications. The response should feel like a toolkit rather than a thesis, with clear markers where Rorty ends and practical extensions begin.
answer: |-
  Here’s a stripped-down, actionable toolkit drawn from Rorty’s view, aimed at your desk. I’ll flag **R** for his core ideas and **Ext** for my extensions/practical consequences. Your specific sticking points are addressed head-on.

  ### 1. **Your "Betrayal" Feeling & Flat Voice (The Accuracy Trap)**
      *   **R:** "Accuracy" isn’t matching an external reality; it’s about whether your vocabulary *works* for your purpose.
      *   **Consequence:** Stop asking "Is this true to the *real* people/town?" Ask: **"Is this voice *effective* for what I’m trying to *do* with this story?"**
      *   **Your Betrayal Feeling - Ext:** It’s likely tracking one of two things:
          1.  **Solidarity Failure:** Does the flat voice *prevent* readers from seeing the characters/human cost *as fellow humans*, reducing them to clinical specimens? If so, it *is* betrayal – not of an external fact, but of the *goal* of expanding solidarity. It might be cruel redescription (see point 2).
          2.  **Vocab Misfit:** Does the voice *feel* like a borrowed tool (e.g., "literary minimalism") rather than an organic response to *this* specific story? If it’s an ill-fitting tool, it might *feel* like betrayal because it’s not doing its job well.
      *   **Action at Desk:** Reread a troubling passage. Ask: *Does this voice help or hinder the reader’s ability to feel the human stakes here?* If hinder, experiment: inject *one* moment of raw, unfiltered sensory detail or thought from a character’s perspective. See if the "betrayal" eases.

  ### 2. **Redescribing Others: Better Vocab vs. Raw Material (The Cruelty Test)**
      *   **R:** Redescription *can* be cruel when it imposes a vocabulary that strips agency, denies suffering, or makes someone a mere example *for your purposes*, not theirs.
      *   **Usable Test (Ext):** **Could the person/people being described reasonably see themselves *as participants* in this new way of talking, or only as its *objects*?**
          *   **Raw Material (Cruel):** The description serves *only* your aesthetic project, reinforces harmful stereotypes, denies their complexity/agency, or makes their suffering merely picturesque or philosophically convenient *for you*. (Think Nabokov’s Humbert aestheticizing Lolita).
          *   **Better Vocab (Potentially Solidaristic):** The description offers them (or those like them) a way to articulate their *own* experience *more fully*, captures complexity they recognize (even painfully), helps outsiders *see their humanity*, or opens space for agency/resistance. (Think Orwell making you *feel* poverty, not just analyze it).
      *   **Action at Desk:** For a character/scene based on "real" inspiration: Draft a paragraph *from their imagined perspective* reacting to *your* description of them in the novel. Does it feel like recognition ("Yes, that’s part of it, even if hard") or violation ("That’s not me, that’s *your* puppet")? Lean towards recognition.

  ### 3. **Moral Force: Technique, Con, or Unknowing? (Orwell’s Lesson)**
      *   **R:** Exactly. Arguments often fail. Novels move us by redescribing the familiar in ways that *make us notice* suffering or injustice we ignored. The moral force comes from **sensitization, not proof.** It’s the capacity to *rearrange our emotional priorities* through vivid particularity.
      *   **Consequence (Ext):** **Your moral force is *made* of detailed, concrete, compelling redescriptions of human experience that trigger empathy or revulsion.** It’s neither pure technique (heartless craft fails) nor a con (if it works, it reveals a *real* capacity for empathy). It *does* require you to genuinely *see* the people you describe (see the Cruelty Test above).
      *   **Action at Desk:** Practice "Orwellian Particularity." Don’t write "the factory closing caused hardship." Find the *specific* detail: the *exact* sound the last machine made when it powered down; the *specific* item the foreman couldn’t afford to buy his kid after; the *specific* way dust settled on an idle workstation. Make the reader *feel* it sensorially. *That* is your moral engine.

  ### 4. **Solidarity vs. Propaganda (Widening "We" vs. Flattering It)**
      *   **R:** Solidarity is created by increasing sensitivity to others' pain and humiliation, seeing similarities where we saw only differences.
      *   **The Difference (Ext):**
          *   **Novel Widening "We":** Forces the reader to confront the *particular humanity* of someone *outside* their current "we." It makes the "other" *specific, complex, and irreducible*. It challenges the reader’s existing categories and comfortable ignorance. It *expands* the circle of "people like us." (e.g., Making a reader feel the dignity and struggle of a laid-off worker they’d normally dismiss).
          *   **Propaganda/Flattering "We":** Confirms existing tribal identities ("us" vs. "them"). Simplifies complexity into good/evil. Uses characters as symbols, not individuals. Appeals to existing prejudices or fears. *Reinforces* the existing circle, often by demonizing those outside it. Offers easy answers, blame, and self-congratulation.
      *   **Criterion (Ext): Does the novel primarily ask the reader to *expand* their sense of "who counts as one of us," or does it ask them to *harden* their existing boundaries?** Does it complicate or simplify human portraits?
      *   **Action at Desk:** Identify a character furthest from your likely reader's experience. Ask: Does my portrayal of them invite *understanding* of their specific motivations and struggles within their context, or do they primarily serve as a symbol of a problem/evil? Push towards understanding.

  ### 5. **What *Not* to Take From Rorty (Warnings for the Novelist)**
      *   **R:** Novels replaced sermons/treatises as engines of moral change (as a *compliment* to their power to sensitize).
      *   **Warnings & Where It Can Make You Worse (Ext):**
          1.  **Laziness about Particulars:** "No facts out there?" *Don't* become lazy about concrete, sensory, historical, or psychological detail. **The *power* of your redescription *depends* on the richness and perceived authenticity of the particulars.** Contingency isn't vagueness. Research matters, not for "Truth," but for *effective, convincing* redescription.
          2.  **Cynicism/Coldness:** "Just a vocabulary?" *Don't* let irony detach you from genuine empathy for your characters *as if they were real people in pain*. Rorty's whole point about solidarity hinges on feeling *real* pain. If your irony becomes a shield against caring about the people you describe, your engine of moral change stalls. The feeling of "betrayal" is your empathy alarm – listen to it.
          3.  **The Glibness Trap:** Believing *any* redescription is as good as any other can lead to shallow, clever, but ultimately hollow fiction. The *test* is whether it *works* to move people, expand solidarity, or help us cope. Glibness rarely passes the Cruelty Test or the Solidarity Test.
          4.  **Ignoring Craft:** "Truth is what works?" This doesn't mean sloppy writing "works." Craft – structure, voice, pacing, imagery – is *how* you make your redescriptions vivid, compelling, and *effective*. Master your tools.

  **In Summary for Your Desk:** Your job is **particular, concrete redescription aimed at sensitization.** Use any tool (voice, style, form) that *works* to make the reader *feel* the human stakes and see people outside their tribe as fellow humans. Constantly check: Is this detail/voice/characterization *effective* for sensitization? Does it pass the Cruelty Test? Is it widening "we"? Avoid coldness, glibness, vagueness, and lazy stereotypes. Your "betrayal" feeling is your moral/empathic compass – interrogate *what specific failure* it's pointing to (solidarity? vocab misfit?) and fix *that*. Now go make strangers care.
