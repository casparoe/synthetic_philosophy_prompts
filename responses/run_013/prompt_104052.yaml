answer: |-
  ### Final Exam Question: Metaphysics of Modality  
  **Time Allowed:** 45 minutes  
  **Marks:** 20  

  **Stipulation:**  
  *Rigid Counterpart Theory (RCT)* holds that:  
  - Nothing exists at more than one world.  
  - "x is F at world w" is analysed as "x’s counterpart at w is F".  
  - The counterpart relation is **unique** (each x has exactly one counterpart at each w), **one-one** (no two individuals share a counterpart at any w), and **fixed independently of context**.  

  **Question:**  
  Evaluate whether RCT is a stable metaphysical position or collapses into either (a) transworld identity or (b) the relativism it aims to avoid. In your answer, address:  
  (i) Whether RCT avoids the standard objection that counterpart theory cannot capture "x could have been F" without implying "x is possibly F *in some respect*";  
  (ii) Whether RCT’s uniqueness and context-independence successfully deliver *absolute* (non-relative) de re necessities;  
  (iii) What, if any, distinction remains between RCT and the view that individuals exist at multiple worlds.  

  *Argue for a clear thesis. Mere survey of options scores poorly.*  

  ---

  ### Model Answer (Definite Line: RCT Collapses into Transworld Identity)  
  **(~700 words; Full Marks Position)**  

  Rigid Counterpart Theory (RCT) attempts to salvage counterpart theory’s anti-haecceitist intuition—that individuals are world-bound—while avoiding its notorious relativism. By demanding a unique, one-one, context-free counterpart relation, RCT promises absolute de re modal properties. I argue RCT is unstable: it collapses into transworld identity (TWI), rendering its "counterpart" label a misnomer.  

  **(i) The "Could Have Been" Objection Persists**  
  The standard objection to Lewisian counterpart theory is that it relativizes possibility: "x could have been F" means only that a *relevant* counterpart is F, not x *itself*. RCT’s uniqueness allegedly avoids this by ensuring x has exactly one "representative" per world. But this intensifies the problem. If I have *only one* counterpart at world w, and that counterpart is, say, a pianist, then *I* am necessarily a pianist at w. RCT cannot coherently say "I could have been a pianist *or* a poet" at w, since only one possibility exists for me per world. Worse, it implies that at every world, I *must* be whatever my unique counterpart is—erasing contingency entirely. RCT thus fails to capture genuine *alternate possibilities* for individuals, making the "could have been" objection *more* pressing, not less.  

  **(ii) Absolute Necessities Are Illusory**  
  RCT claims uniqueness delivers absolute de re necessities (e.g., "Socrates is necessarily human"). But this absoluteness is semantic sleight-of-hand. For RCT, "Socrates is necessarily human" means: at every world w, Socrates’ *unique counterpart* at w is human. Crucially, this presupposes that the counterpart relation rigidly designates the same *individual essence* across worlds. Yet if counterparts are unique and context-independent, they cannot differ from their source individual in any essential property without contradiction. Suppose Socrates’ counterpart at w is not human. Then, by RCT’s analysis, Socrates is not human at w—but if being human is essential to Socrates (as per the theory’s aim), this is impossible. Uniqueness thus forces counterparts to *mirror all essential properties* of their originals. But if counterparts must share all essential properties with x, and are uniquely tied to x, they cease to be *counterparts* and become *x itself* under another name. The "absolute" necessities are artifacts of covertly assuming transworld identity.  

  **(iii) No Metaphysical Distance from Transworld Identity**  
  RCT’s collapse into TWI is evident when we ask what *grounds* the unique counterpart relation. For the relation to be one-one and context-independent, it must track a transworld-invariant criterion—e.g., a haecceity, substantial form, or primitive identity. But if such a criterion exists, then the "counterpart" is just the *same individual* persisting across worlds. Consider: If my counterpart at w is uniquely determined by *my* individual essence, and shares all my essential properties, then calling it my "counterpart" rather than "me" adds nothing but terminology. RCT’s prohibition on transworld existence becomes vacuous; it merely *relabels* TWI as "counterpart relation" while duplicating its structure. The sole remaining difference—that RCT formally denies numerical identity across worlds—is metaphysically inert. If the unique counterpart is indistinguishable from x in all essential respects and determinately linked to x, we are licensed to treat it as x. RCT thus reduces to TWI with a superfluous intermediary.  

  **Conclusion**  
  RCT’s constraints—uniqueness and context-independence—aim to purge counterpart theory of relativism but instead annihilate its core motivation. By eliminating contingency (i), smuggling in identity through essential property-matching (ii), and erasing the metaphysical gap between counterparts and transworld individuals (iii), RCT does not avoid TWI but enacts it. The position is unstable: it uses counterpart *vocabulary* to articulate a theory of transworld identity while denying the label.  

  ---

  ### Marking Scheme (20 Marks Total)  
  **Award Marks For:**  
  | **Criteria**                                                                 | **Marks** | **Required Moves**                                                                 |  
  |------------------------------------------------------------------------------|-----------|-----------------------------------------------------------------------------------|  
  | **Thesis & Structure**                                                       | 5         | Clear thesis (e.g., "RCT collapses into TWI"); Logical flow addressing (i)-(iii). |  
  | **(i) "Could Have Been" Argument**                                           | 4         | Explains why uniqueness *intensifies* the objection (loses contingency).          |  
  | **(ii) Absolute Necessities Argument**                                       | 4         | Shows uniqueness forces counterparts to share *all* essential properties with x.  |  
  | **(iii) Collapse into TWI Argument**                                         | 4         | Argues unique counterparts = x under another name (haecceity/essence collapse).   |  
  | **Critical Depth**                                                           | 3         | Preempts obvious replies (e.g., "But RCT denies transworld existence!").          |  

  **Deduct Marks For These Errors:**  
  | **Error**                                                                 | **Deduction** | **Note**                                                                 |  
  |---------------------------------------------------------------------------|---------------|--------------------------------------------------------------------------|  
  | Misstates RCT’s stipulation (e.g., allows multiple counterparts).         | –2            | Fails basic comprehension.                                               |  
  | Claims RCT avoids the "could have been" objection.                        | –3            | Ignores loss of contingency under uniqueness.                            |  
  | Assumes counterparts can differ essentially from x without contradiction. | –3            | Undermines (ii); misses uniqueness→property-matching.                    |  
  | Treats RCT and TWI as distinct based *only* on terminology.               | –2            | Superficial; fails metaphysical analysis of collapse.                    |  
  | Appeals to "context" or relativism despite RCT’s explicit fixed relation. | –2            | Contradicts stipulation; misreads context-independence.                  |  

  **Grade Boundaries:**  
  - **18–20:** Masterful. Explicitly argues collapse into TWI via (i)–(iii); anticipates objections.  
  - **15–17:** Strong. Correctly identifies collapse but minor gaps in (ii)/(iii).  
  - **12–14:** Adequate. Addresses all parts but vague on why collapse occurs.  
  - **9–11:** Weak. Misreads stipulation or misses >1 core argument.  
  - **0–8:** Poor. Ignores stipulation; recites generic counterpart/TWI points.  

  ---  
  **Rationale:** This design forces engagement with RCT’s *internal* instability. Top answers must spot that uniqueness destroys contingency (i), transforms counterparts into essence-clones (ii), and reduces to TWI (iii). Common errors involve misapplying standard counterpart objections or missing the collapse implication.
