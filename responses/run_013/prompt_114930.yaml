prompt: |-
  I am assembling, before I read any more of the literature, a specification of what a theory of personal identity would have to deliver in order to be usable in the uploading and gradual-replacement debates. No reading lists, no citations — argue from the cases themselves. Treat the theory's job as practical: it is supposed to say when a replacement or copying procedure is a treatment and when it is a death, what may be done to the original and to any copies, and when two stages of a process are stages of one person.

  Give me the desiderata as a list — the cases it must get right, the distinctions it must respect, and the constraints it must not violate — each with the case or consideration that motivates it. The cases I want on the list, at minimum, are these; add any you think indispensable and any you think idle.

  - The Replacement Case: a person's neurons are swapped one at a time for units that reproduce the input–output profile of the tissue they replace, with no interruption of behaviour and no reported discontinuity.
  - The Swap: the same substitution done in a single step under anaesthesia.
  - The Two Jars: the original tissue from the Replacement Case is not destroyed but kept functioning in a vat alongside the replacement, both awake.
  - The Half-Upload: replacement stops at roughly sixty per cent, leaving a person whose memory and dispositions are a partly integrated mixture of biological and artificial parts.
  - The Rewrite: replacement proceeds alongside a slow substitution of the person's memories with false ones, so the endpoint is functionally continuous but informationally discontinuous with the start.
  - The ordinary cases the theory cannot afford to get wrong: dreamless sleep and general anaesthesia, and the fact that a living person is already turning over their molecules and most of their cells across a lifetime.

  Then require the theory to respect the distinctions I would want respected: numerical identity versus survival; what matters versus what identity is; continuity of causal process versus continuity of information; a fact versus a convention; a determinate answer versus a case in which there is nothing to be right about; and survival versus the availability of a copy.

  Tell me which of these desiderata are genuine requirements and which are the parochial preferences of particular camps — psychological-continuity, bodily-continuity or animalist, further-fact, perdurantist or four-dimensionalist, closest-continuer — and say explicitly whether any subset is jointly unsatisfiable; if so, that is the main thing I want from you. Close by naming the single requirement that does the most to rule out otherwise attractive theories.

  Lead with your bottom line in the first sentence — the one-line verdict on whether the list can be met, or which requirement you take to be decisive — and then give the reasoning. No preamble, no restating of my question.
reasoning: |-
  Okay, the user is asking for a specification of desiderata for a theory of personal identity that's practical and usable in debates about uploading and gradual replacement. They want a list based on cases without literature citations, focusing on real-world applicability. The key cases mentioned include Replacement Case, Swap, Two Jars, Half-Upload, Rewrite, and ordinary cases like sleep and cell turnover.

  First, I need to recall the main philosophical positions on personal identity: psychological continuity, bodily continuity, animalism, further-fact theories, perdurantism, and closest continuer theories. Each has different takes on what constitutes identity. The user wants to know which desiderata are essential versus parochial to these camps.

  Looking at the cases, the Replacement Case (gradual replacement) is crucial. Theories need to handle this without interruption. The Swap (instant replacement) is a contrast, where theories might diverge. Two Jars (original and copy both active) challenges uniqueness. Half-Upload tests partial integration. Rewrite involves informational discontinuity despite functional continuity. Ordinary cases like sleep and cell turnover must be handled correctly to avoid absurdity.

  The distinctions required: numerical identity vs. survival, what matters vs. identity, causal vs. informational continuity, fact vs. convention, determinacy vs. indeterminacy, survival vs. copy availability. These need to be respected, but some might conflict. For example, psychological theories might prioritize informational continuity but struggle with Two Jars, where both copies are psychologically continuous. Bodily theories might handle Replacement but fail the Swap if they consider the body essential, yet swapping all at once might be seen as death.

  The biggest issue is the Two Jars case. If both the original brain in a vat and the replaced body are conscious, numerical identity can't hold for both. Theories must either deny that both are persons, deny continuity in one, or accept branching, which numerical identity can't handle. Closest continuer or perdurantist approaches might allow branching, but the user specifies numerical identity as a distinction to respect. So, any theory insisting on numerical identity will clash with Two Jars, making them jointly unsatisfiable with branching cases.

  Ordinary cases are manageable by most theories via continuity. The Half-Upload and Rewrite might be handled by psychological theories focusing on continuity of psychology, but Rewrite's false memories challenge informational continuity. Bodily theories might not care about memory changes as long as the body persists.

  The key conflict is between requiring numerical identity (no branching) and the Two Jars scenario where branching occurs. This rules out psychological theories that allow branching (like Parfit's), but the user wants numerical identity. Animalist or bodily theories might avoid branching by emphasizing the biological organism, but then the Swap case becomes problematic—if the body is replaced entirely, is it the same person? If anaesthesia in Swap is like sleep, maybe continuity is maintained, but replacing the whole brain at once might be seen as death.

  The decisive requirement is the combination of Two Jars and the need for numerical identity. This makes many theories unsatisfiable unless they deny the personhood of the vat brain or the replaced body, which seems arbitrary. Perdurantism could handle it by considering person stages, but the user might see that as not respecting numerical identity. Further-fact theories might introduce a non-physical element, but that's controversial and may not be practical.

  So, the bottom line is that the desiderata are jointly unsatisfiable because Two Jars requires branching, but numerical identity forbids it. The user's insistence on a determinate fact of identity conflicts with cases where continuity branches. Therefore, no theory can satisfy all without compromising on one of these points.
answer: |-
  **The desiderata are jointly unsatisfiable because the Two Jars case forces branching, which contradicts the requirement for numerical identity.**  

  ### Desiderata from Cases  
  1. **Replacement Case (gradual replacement)**  
     - *Requirement:* Must deliver survival/identity.  
     - *Motivation:* Functional continuity and first-person reports imply no death. Violating this invalidates gradual replacement as "treatment."  

  2. **Swap (instant replacement under anesthesia)**  
     - *Requirement:* Must deliver death (or radical discontinuity).  
     - *Motivation:* Intuition that replacing the brain in one step kills the original, even if behavior continues. Anaesthesia ≠ death (unlike destruction).  

  3. **Two Jars (original and copy coexist)**  
     - *Requirement:* Must deny both are numerically identical to the original. At most one survives.  
     - *Motivation:* Two distinct conscious beings cannot both *be* the same person.  

  4. **Half-Upload (partial integration)**  
     - *Requirement:* Must deliver a single surviving person with mixed origins.  
     - *Motivation:* Practical need to address hybrid states without fragmentation.  

  5. **Rewrite (false memory replacement)**  
     - *Requirement:* Must deny identity or survival at endpoint.  
     - *Motivation:* Informational discontinuity (core self altered) despite functional smoothness.  

  6. **Ordinary Cases (sleep, anesthesia, cell turnover)**  
     - *Requirement:* Must affirm survival/identity.  
     - *Motivation:* Baseline intuitions; denying these makes the theory irrelevant to real life.  

  ### Required Distinctions  
  - **Numerical identity vs. survival**: Identity is "yes/no"; survival is "what matters" (e.g., Two Jars: copy may "survive" without identity).  
  - **What matters vs. what identity is**: E.g., Rewrite may preserve "what matters" (subjective flow) but not identity.  
  - **Causal process vs. informational continuity**: Replacement Case relies on causal process; Rewrite breaks informational continuity.  
  - **Fact vs. convention**: Identity must be a fact (not arbitrary) to avoid moral evasion in uploading debates.  
  - **Determinate answer vs. indeterminacy**: Half-Upload needs a clear answer; borderline cases (e.g., 51% vs. 49% replacement) can be indeterminate.  
  - **Survival vs. copy availability**: Two Jars shows survival of a copy doesn’t entail *your* survival if you’re the vat brain.  

  ### Genuine vs. Parochial Requirements  
  - **Genuine**: Replacement Case survival (all camps accept continuity); Ordinary Cases (non-negotiable); Two Jars non-branching (logical necessity for identity); Swap-as-death (rooted in intuition against gappy existence).  
  - **Parochial**:  
    - *Psychological theories*: Privilege informational continuity (Rewrite fails).  
    - *Bodily/animalist*: Reject Half-Upload survival (if "biological organism" is compromised).  
    - *Further-fact*: Insist on indeterminate cases (e.g., Half-Upload) being brute facts.  
    - *Perdurantist/4D*: Allow Two Jars as temporal parts, violating numerical identity.  
    - *Closest-continuer*: Permits Two Jars indeterminacy, violating fact/convention.  

  ### Conflicts and Unsatisfiability  
  - **Core Conflict**: **Two Jars + Numerical Identity + Ordinary Cases → Unsatisfiable**.  
    - Two Jars creates two psychological continuers (both satisfy Replacement Case criteria).  
    - Numerical identity forbids two entities being one person.  
    - Ordinary Cases demand psychological continuity suffices for survival (contra animalism).  
    - *Result*: Any theory accepting Two Jars continuity must either:  
      (a) Deny numerical identity (e.g., perdurantism, psychological "survival"), violating the distinction; or  
      (b) Arbitrarily privilege one continuer (e.g., closest-continuer), violating fact/convention.  
  - **Swap vs. Replacement Case**: Bodily theories reject Swap survival; psychological theories must accept both or neither, violating intuition.  

  ### Decisive Requirement  
  **The Two Jars case, combined with the demand for non-branching numerical identity, rules out all otherwise viable theories.** Psychological continuity theories (Parfit) fail by allowing branching as survival; animalism fails by rejecting Replacement Case survival; perdurantism rejects numerical identity outright. Only convention-based theories (e.g., closest-continuer) handle it but violate the fact/convention distinction.
