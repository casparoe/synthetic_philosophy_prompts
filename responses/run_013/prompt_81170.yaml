prompt: |-
  Bit of an odd question, sorry if it's dumb. I'm in a small reading group that's slowly grinding through recent stuff on disagreement and higher-order evidence — last week we did a paper arguing about how much you should budge when a peer who's just as good as you disagrees, and this week we're on one about "epistemic akrasia," and I think I'm missing something really basic, because the whole setup strikes me as describing a state that can't actually happen.

  Here's my picture of it: epistemic akrasia is when you believe something — say you're sure your flight is at 6pm — and at the same time you believe you're *not* justified in believing it, because you know you're chronically bad with times and dates. And the big fight in the literature is apparently over whether that combination can be rational, or whether there's some requirement that rules it out. But I don't see how the state is even possible, let alone whether it's rational. If I really believe I shouldn't believe the flight is at 6, then I just... stop believing it's at 6? Believing something you take yourself to have no business believing sounds like believing a contradiction — like saying you know the sum is 4 but you believe it's 5. So my suspicion is that the "akrasia" debate is either about a psychological impossibility, or it's secretly the disagreement debate in a fancier outfit, and that "higher-order evidence" is just a posh name for hearing other people's opinions about your opinions. Am I wrong on both counts? If so, whats the cleanest way to see that you can be in the akratic state without just being muddled about what you believe, and how much of the literature would survive if you took the disagreement cases out of it?
